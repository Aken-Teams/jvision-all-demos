<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案總覽 ｜ JVision DEMO</title>
  <meta name="description" content="專案總覽：要解決的問題、系統做什麼、核心功能、運作流程、帶來效益與互動 Demo。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="./shared/system-content.js"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1120px' },
    } } };
  </script>
  <style>
    :root { --accent:#1e40af; --accent-soft:#eef4ff; --accent-line:#c7d7fe; }
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .eyebrow { font-family: Inter, monospace; letter-spacing:.16em; }
    .navlink { position:relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after { transform:scaleX(1); transform-origin:left; }
    .txt-accent { color:var(--accent); }
    .sec-title { font-size:clamp(1.6rem,2.6vw,2.15rem); font-weight:800; color:#0f1e46; letter-spacing:-.02em; }
    .sec-lead { color:#64748b; max-width:52rem; line-height:1.8; }

    /* tabs: centered, equal width, no scrollbar */
    #tabBar { display:grid; grid-template-columns:repeat(3, 1fr); }
    @media (min-width:768px){ #tabBar { grid-template-columns:repeat(6, 1fr); } }
    .tab-btn { position:relative; padding:15px 6px; font-weight:700; font-size:14px; color:#64748b; text-align:center; transition:color .18s; }
    .tab-btn:hover { color:var(--accent); }
    .tab-btn.active { color:var(--accent); }
    .tab-btn.active::after { content:""; position:absolute; left:12%; right:12%; bottom:-1px; height:3px; border-radius:3px; background:var(--accent); }
    .tab-panel { display:none; animation:fadeUp .45s ease; }
    .tab-panel.active { display:block; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* image placeholder */
    .img-slot { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border-radius:18px; background:var(--accent-soft); border:1px dashed var(--accent-line); color:var(--accent); text-align:center; padding:28px; }
    .img-slot .material-symbols-outlined { font-size:42px; opacity:.65; }
    .img-slot b { font-size:13px; }
    .img-slot small { color:#94a3b8; font-weight:600; }

    /* flow diagram */
    .flow { display:flex; flex-direction:column; gap:8px; }
    @media (min-width:900px){ .flow { flex-direction:row; align-items:stretch; } }
    .flow-node { flex:1; background:#fff; border:1px solid var(--line, #e2e8f0); border-radius:14px; padding:16px 18px; box-shadow:0 4px 14px rgba(15,30,70,.05); }
    .flow-node .num { display:inline-grid; place-content:center; width:30px; height:30px; border-radius:999px; color:#fff; font-weight:900; font-size:13px; background:var(--accent); margin-bottom:10px; }
    .flow-cap { background:var(--accent-soft); border-color:var(--accent-line); }
    .flow-conn { display:flex; align-items:center; justify-content:center; color:var(--accent); }
    .flow-conn .material-symbols-outlined { transform:rotate(90deg); }
    @media (min-width:900px){ .flow-conn { width:34px; } .flow-conn .material-symbols-outlined { transform:none; } }

    /* kpi band */
    .kpi-band { background:linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #000)); }

    /* system architecture map */
    .arch { display:flex; flex-direction:column; align-items:center; }
    .arch-layer { width:100%; border-radius:16px; padding:16px 20px; text-align:center; }
    .arch-entry { background:#fff; border:1px solid var(--line,#e2e8f0); }
    .arch-core { color:#fff; font-weight:900; letter-spacing:.01em; box-shadow:0 14px 34px rgba(15,30,70,.18); background:linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 68%, #000)); }
    .arch-data { background:var(--accent-soft); border:1px solid var(--accent-line); }
    .arch-pipe { width:2px; height:20px; background:var(--accent-line); }
    .arch-label { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .arch-mods { width:100%; display:grid; grid-template-columns:repeat(1,1fr); gap:14px; }
    @media (min-width:640px){ .arch-mods { grid-template-columns:repeat(2,1fr); } }
    @media (min-width:900px){ .arch-mods { grid-template-columns:repeat(3,1fr); } }
    .mod-card { position:relative; background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:16px; padding:20px; transition:border-color .2s, box-shadow .2s, transform .2s; }
    .mod-card:hover { border-color:var(--accent); box-shadow:0 12px 30px rgba(15,30,70,.1); transform:translateY(-2px); }
    .mod-ico { width:44px; height:44px; border-radius:12px; display:grid; place-content:center; color:#fff; background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000)); margin-bottom:14px; }
    .mod-idx { position:absolute; top:16px; right:18px; font:800 12px/1 Inter, monospace; color:var(--accent-line); }
  </style>
</head>
<body class="text-body antialiased min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" /></a>
      <div class="flex items-center gap-8">
        <a href="./catalog" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./project-expert.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案 Agents</a>
      </div>
    </nav>
  </header>

  <main id="app" class="flex-1"></main>

  <footer class="border-t border-line bg-white mt-auto">
    <div class="max-w-shell mx-auto px-6 py-10 flex flex-col md:flex-row md:items-start justify-between gap-8">
      <div class="flex flex-col gap-3 max-w-sm">
        <img src="./assets/logo.png" alt="JVision DEMO" class="h-8 w-auto self-start" />
        <p class="text-sm text-muted leading-relaxed">從製造現場到企業決策，463 個可操作的 AI 產業系統，一站探索、即刻體驗。</p>
      </div>
      <div class="md:text-right">
        <h4 class="text-xs font-bold text-ink uppercase tracking-wide mb-3">探索</h4>
        <ul class="flex flex-col gap-2 text-sm text-muted">
          <li><a href="./index.html" class="hover:text-brand transition-colors">首頁</a></li>
          <li><a href="./catalog" class="hover:text-brand transition-colors">專案目錄</a></li>
          <li><a href="./project-expert.html" class="hover:text-brand transition-colors">專案 Agents</a></li>
        </ul>
      </div>
    </div>
    <div class="border-t border-line">
      <div class="max-w-shell mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-muted">
        <span>© 2026 JVision</span>
        <div class="flex items-center gap-5"><a href="#" class="hover:text-brand transition-colors">服務條款</a><a href="#" class="hover:text-brand transition-colors">隱私政策</a></div>
      </div>
    </div>
  </footer>

  <template id="errorTpl">
    <div class="max-w-shell mx-auto px-6 py-24 text-center">
      <h1 class="text-2xl font-bold text-ink mb-2">找不到這個專案</h1>
      <p class="text-muted mb-6">網址參數有誤，或該專案不存在。</p>
      <a href="./catalog" class="inline-flex items-center gap-2 h-11 px-6 rounded-xl bg-brand text-white font-bold">回專案目錄</a>
    </div>
  </template>

  <script>
    const ACCENTS = {
      "生產製造":"#1e40af","品質管理":"#0f766e","業務銷售":"#4338ca","採購供應鏈":"#0e7490","人力資源":"#7c3aed",
      "倉儲物流":"#0369a1","研發管理":"#6d28d9","經營管理":"#1e3a8a","ESG 永續":"#15803d","零售電商":"#be123c",
      "教育":"#b45309","企業協作":"#2563eb","營建工程":"#c2410c","醫療照護":"#047857","財務會計":"#3730a3",
      "金融保險":"#0d9488","資訊科技":"#1d4ed8","交通運輸":"#0891b2","設備維護":"#475569","資訊安全":"#b91c1c",
      "專業服務":"#7e22ce","物流運輸":"#0369a1","餐飲旅宿":"#c2410c","生活服務":"#db2777","數據分析":"#4f46e5",
      "客服管理":"#0891b2","房地產與物業":"#a16207","宗教服務":"#b45309",
    };
    const ICONS = {
      "生產製造":"precision_manufacturing","品質管理":"verified","業務銷售":"trending_up","採購供應鏈":"handshake","人力資源":"badge",
      "倉儲物流":"inventory_2","研發管理":"science","經營管理":"insights","ESG 永續":"eco","零售電商":"storefront","教育":"school",
      "企業協作":"groups","營建工程":"engineering","醫療照護":"medical_services","財務會計":"account_balance","金融保險":"savings",
      "資訊科技":"dns","交通運輸":"commute","設備維護":"build","資訊安全":"security","專業服務":"gavel","物流運輸":"local_shipping",
      "餐飲旅宿":"restaurant","生活服務":"checkroom","數據分析":"analytics","客服管理":"support_agent","房地產與物業":"apartment","宗教服務":"temple_buddhist",
    };
    const shortTitle = (t) => { const r = String(t || ""); return r.replace(/[（(].*?[)）]/g, "").trim() || r; };
    const splitList = (s) => String(s || "").split(/[、,，/／·]/).map((x) => x.trim()).filter(Boolean);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const clip = (s, n) => { const x = String(s || ""); return x.length > n ? x.slice(0, n) + "…" : x; };

    (async function () {
      const params = new URLSearchParams(location.search);
      const repo = params.get("repo"), id = params.get("id");
      const app = document.getElementById("app");
      let project, index;
      try {
        const res = await fetch("./projects-index.json?v=20260730-2");
        index = await res.json();
        project = index.projects.find((p) => (repo && p.repoName === repo) || (id && String(p.id) === String(id)));
      } catch (e) {}
      if (!project) { app.append(document.getElementById("errorTpl").content.cloneNode(true)); return; }

      const cat = project.category || "未分類";
      const accent = ACCENTS[cat] || "#1e40af";
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--accent-soft", `color-mix(in srgb, ${accent} 9%, white)`);
      document.documentElement.style.setProperty("--accent-line", `color-mix(in srgb, ${accent} 28%, white)`);
      const icon = ICONS[cat] || "category";
      const title = shortTitle(project.title);
      const cw = project.customerWorkflow || {};
      const steps = (cw.steps && cw.steps.length) ? cw.steps : ["建立資料", "系統處理", "確認並留存"];
      const choices = (cw.choices && cw.choices.length) ? cw.choices : ["執行處理", "退回補件", "交主管判斷"];
      const fields = (cw.fields && cw.fields.length) ? cw.fields : ["名稱／編號", "負責人／期限"];
      const output = cw.output || "處理結果與操作紀錄";
      const metrics = (project.operationalMetrics && project.operationalMetrics.length) ? project.operationalMetrics : ["待處理", "高風險", "完成率", "預估影響"];
      const users = splitList(project.primaryUser || "部門使用者與主管");
      const caseNo = String(project.id).padStart(3, "0");
      document.title = `${title}｜JVision DEMO`;
      // deterministic demo numbers
      const dn = (seed, mod, base) => (project.id * seed) % mod + base;

      const sc = window.JVSystemContent ? window.JVSystemContent.get(project) : null;
      const sysLabel = (sc && sc.label) || cat;
      const sysTagline = (sc && sc.tagline) || "把散落的作業整合成一套可操作、可追蹤的系統。";
      const entryRoles = (sc && sc.entry && sc.entry.length) ? sc.entry : users.slice(0, 3);
      const dataLayer = (sc && sc.data && sc.data.length) ? sc.data : ["營運報表", "操作紀錄", "系統整合"];
      const modules = (sc && sc.modules && sc.modules.length) ? sc.modules : [
        { icon:"auto_awesome", name:"AI 摘要與建議", desc:"異常、待辦、風險與下一步建議。" },
        { icon:"view_kanban", name:"狀態看板", desc:"把每筆項目的進度攤在同一畫面。" },
        { icon:"edit_note", name:"快速建立與處理", desc:"新增、流轉、保存與例外退回。" },
        { icon:"monitoring", name:"營運數據儀表", desc:"即時追蹤關鍵指標變化。" },
        { icon:"notifications_active", name:"風險排序與提醒", desc:"自動排出最該先處理的項目。" },
        { icon:"history", name:"操作紀錄稽核", desc:"每筆操作留痕、可追溯。" },
      ];

      const chip = (t) => `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold" style="background:var(--accent-soft); color:var(--accent);"><span style="width:5px;height:5px;border-radius:999px;background:var(--accent);"></span>${esc(t)}</span>`;
      const imgSlot = (labelIcon, label, hint, extra="") => `<div class="img-slot ${extra}"><span class="material-symbols-outlined">${labelIcon}</span><b>${esc(label)}</b><small>${esc(hint)}</small></div>`;

      // hero dashboard mockup (clean CSS preview, no external image)
      const mockTiles = metrics.slice(0,4).map((m,i)=>`<div class="rounded-xl p-3 border" style="background:var(--accent-soft); border-color:var(--accent-line);"><div class="text-2xl font-black leading-none" style="color:var(--accent);">${dn(i+3,60,4)}</div><div class="text-[11px] font-semibold text-muted mt-1.5">${esc(m)}</div></div>`).join("");
      const mockBars = [58,80,46,92,68,74].map((h,i)=>`<span style="display:inline-block;width:12%;height:${h}%;border-radius:4px 4px 0 0;background:${i===3?'var(--accent)':'color-mix(in srgb, var(--accent) 32%, white)'};"></span>`).join("");

      app.innerHTML = `
        <!-- ===== HERO ===== -->
        <section class="relative overflow-hidden" style="background:linear-gradient(180deg, var(--accent-soft), #f5f8fc);">
          <div class="max-w-shell mx-auto px-6 pt-8 pb-14">
            <a href="./catalog" class="inline-flex items-center gap-1.5 text-sm font-semibold text-muted hover:text-ink"><span class="material-symbols-outlined text-[18px]">arrow_back</span>專案目錄</a>
            <div class="grid lg:grid-cols-[1.12fr_.88fr] gap-10 items-center mt-6">
              <div>
                <div class="flex items-center gap-2.5 mb-5">
                  <span class="w-11 h-11 rounded-xl grid place-content-center text-white shrink-0" style="background:var(--accent);"><span class="material-symbols-outlined">${icon}</span></span>
                  <span class="eyebrow text-[11px] font-bold uppercase" style="color:var(--accent);">${esc(cat)} · CASE ${caseNo}</span>
                </div>
                <h1 class="text-[clamp(2.1rem,4.4vw,3.2rem)] font-black text-ink tracking-tight leading-[1.1] mb-5">${esc(title)}</h1>
                <p class="text-lg text-muted leading-relaxed max-w-xl mb-3">${esc(project.description || "")}</p>
                <p class="text-base font-bold max-w-xl mb-7" style="color:var(--accent);">${esc(sysTagline)}</p>
                <div class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
                  <span class="flex items-center gap-2 font-semibold text-body"><span class="material-symbols-outlined text-[18px] txt-accent">groups</span>適合 ${users.length} 種角色</span>
                  <span class="flex items-center gap-2 font-semibold text-body"><span class="material-symbols-outlined text-[18px] txt-accent">conversion_path</span>${steps.length} 步驟流程</span>
                  <span class="flex items-center gap-2 font-semibold text-body"><span class="material-symbols-outlined text-[18px] txt-accent">monitoring</span>${metrics.length} 項關鍵指標</span>
                </div>
              </div>
              <!-- clean dashboard mockup -->
              <div class="rounded-2xl border border-line bg-white shadow-[0_20px_50px_rgba(15,30,70,.12)] overflow-hidden" style="animation:floaty 5s ease-in-out infinite;">
                <div class="h-9 flex items-center gap-1.5 px-4 border-b border-line" style="background:var(--accent-soft);"><span class="w-2.5 h-2.5 rounded-full bg-[#ff5f57]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#febc2e]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#28c840]"></span><span class="ml-2 text-[11px] font-bold" style="color:var(--accent);">${esc(title)}</span></div>
                <div class="p-4">
                  <div class="flex items-center justify-between mb-3"><span class="eyebrow text-[10px] font-bold text-muted uppercase">今日營運快照</span><span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background:var(--accent-soft); color:var(--accent);">LIVE</span></div>
                  <div class="grid grid-cols-2 gap-2.5 mb-3">${mockTiles}</div>
                  <div class="rounded-xl border border-line p-3">
                    <div class="flex items-end justify-between gap-1.5" style="height:64px;">${mockBars}</div>
                    <div class="text-[10px] text-muted mt-2">近 7 日處理量（示範數據）</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ===== TABS ===== -->
        <div class="sticky top-16 z-30 bg-white/95 backdrop-blur border-b border-line">
          <div class="max-w-shell mx-auto px-2 sm:px-6">
            <div id="tabBar">
              <button class="tab-btn active" data-tab="problem">要解決的問題</button>
              <button class="tab-btn" data-tab="system">系統做什麼</button>
              <button class="tab-btn" data-tab="features">功能模組</button>
              <button class="tab-btn" data-tab="flow">運作流程</button>
              <button class="tab-btn" data-tab="benefits">帶來效益</button>
              <button class="tab-btn" data-tab="demo">Demo</button>
            </div>
          </div>
        </div>

        <div class="max-w-shell mx-auto px-6 py-12">
          <!-- PROBLEM -->
          <section class="tab-panel active" data-panel="problem">
            <p class="eyebrow text-[11px] font-bold uppercase mb-2" style="color:var(--accent);">THE PROBLEM</p>
            <h2 class="sec-title mb-4">要解決的問題</h2>
            <p class="sec-lead mb-10">${esc(project.businessSituation || "")}</p>
            <div class="grid lg:grid-cols-2 gap-8 items-stretch">
              <div class="space-y-3">
                <p class="text-xs font-bold text-[#dc2626] uppercase tracking-wide mb-1">傳統做法的困境</p>
                ${[
                  { i:"table_view", t:"試算表往返", d:"資料散在各處試算表與訊息，版本混亂、難以對齊。" },
                  { i:"person_search", t:"人工追蹤", d:"靠人一件件盯進度、追負責人，耗時又容易遺漏。" },
                  { i:"warning", t:"異常太晚發現", d:"問題往往等到出事才被看到，錯過最佳處理時機。" },
                ].map((c) => `<div class="flex gap-4 bg-white rounded-xl border border-line p-4"><span class="w-10 h-10 rounded-lg grid place-content-center bg-red-50 text-[#dc2626] shrink-0"><span class="material-symbols-outlined">${c.i}</span></span><div><h3 class="font-bold text-ink">${c.t}</h3><p class="text-sm text-muted leading-relaxed mt-0.5">${c.d}</p></div></div>`).join("")}
              </div>
              ${imgSlot("image", "傳統作業示意圖", "可放：試算表 / 人工追蹤 / 現場紙本的示意圖", "min-h-[280px] h-full")}
            </div>
            <div class="mt-8 rounded-2xl p-6 flex items-center gap-4" style="background:var(--accent-soft);">
              <span class="material-symbols-outlined text-white w-11 h-11 grid place-content-center rounded-xl shrink-0" style="background:var(--accent);">bolt</span>
              <p class="text-body font-semibold">導入 <b style="color:var(--accent);">${esc(title)}</b> 後，以上痛點會被一套系統收斂：資料集中、流程可追蹤、異常即時被看見。</p>
            </div>
          </section>

          <!-- SYSTEM -->
          <section class="tab-panel" data-panel="system">
            <p class="eyebrow text-[11px] font-bold uppercase mb-2" style="color:var(--accent);">WHAT IT DOES</p>
            <h2 class="sec-title mb-4">這套系統做什麼</h2>
            <div class="grid lg:grid-cols-2 gap-8 items-center">
              <div>
                <p class="text-body leading-relaxed mb-6">${esc(project.description || "")}把散落的作業，整合成一個「可操作、可追蹤、可稽核」的單一平台。</p>
                <div class="mb-6">
                  <h3 class="font-bold text-ink mb-2.5 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">groups</span>適合誰使用</h3>
                  <div class="flex flex-wrap gap-2">${users.map(chip).join("")}</div>
                </div>
                <div class="rounded-xl border border-line bg-white p-5">
                  <h3 class="font-bold text-ink mb-1.5 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">event_repeat</span>日常怎麼用</h3>
                  <p class="text-sm text-body leading-relaxed">${esc(project.dailyUse || "")}</p>
                </div>
              </div>
              ${imgSlot("dashboard", "系統主畫面示意", "可放：實際系統畫面截圖或產品 mockup", "min-h-[320px]")}
            </div>
          </section>

          <!-- SYSTEM MODULES / ARCHITECTURE -->
          <section class="tab-panel" data-panel="features">
            <p class="eyebrow text-[11px] font-bold uppercase mb-2" style="color:var(--accent);">SYSTEM MODULES</p>
            <h2 class="sec-title mb-4">功能模組總覽</h2>
            <p class="sec-lead mb-10">${esc(sysLabel)} 由 ${modules.length} 大核心模組組成 —— 從使用者入口、系統核心到資料整合，構成一套完整、可落地的系統架構。</p>
            <div class="arch">
              <div class="arch-layer arch-entry">
                <div class="arch-label mb-2.5" style="color:var(--accent);">使用者入口</div>
                <div class="flex flex-wrap justify-center gap-2">${entryRoles.map(chip).join("")}</div>
              </div>
              <div class="arch-pipe"></div>
              <div class="arch-layer arch-core">
                <div class="text-xs opacity-80 mb-1">系統核心 · CORE</div>
                <div class="text-lg">${esc(sysLabel)}</div>
              </div>
              <div class="arch-pipe"></div>
              <div class="arch-mods">
                ${modules.map((m,i)=>`<div class="mod-card"><span class="mod-idx">0${i+1}</span><div class="mod-ico"><span class="material-symbols-outlined">${m.icon}</span></div><h3 class="font-bold text-ink mb-1">${esc(m.name)}</h3><p class="text-sm text-muted leading-relaxed">${esc(m.desc)}</p></div>`).join("")}
              </div>
              <div class="arch-pipe"></div>
              <div class="arch-layer arch-data">
                <div class="arch-label mb-2.5" style="color:var(--accent);">資料與整合</div>
                <div class="flex flex-wrap justify-center gap-2">${dataLayer.map((d)=>`<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-white border" style="border-color:var(--accent-line); color:var(--accent);"><span class="material-symbols-outlined text-[16px]">database</span>${esc(d)}</span>`).join("")}</div>
              </div>
            </div>
          </section>

          <!-- FLOW (flowchart) -->
          <section class="tab-panel" data-panel="flow">
            <p class="eyebrow text-[11px] font-bold uppercase mb-2" style="color:var(--accent);">HOW IT WORKS</p>
            <h2 class="sec-title mb-4">運作流程</h2>
            <p class="sec-lead mb-8">從資料輸入到完成留存的實際流程 —— 每一步都清楚、可追蹤。</p>
            <div class="flow mb-8">
              <div class="flow-node flow-cap"><div class="text-xs font-bold uppercase mb-2" style="color:var(--accent);">輸入</div><p class="text-sm font-semibold text-ink leading-relaxed">${fields.map(esc).join("、")}</p></div>
              <div class="flow-conn"><span class="material-symbols-outlined">arrow_forward</span></div>
              ${steps.map((s, i) => `<div class="flow-node"><span class="num">${i+1}</span><p class="text-sm font-semibold text-ink leading-relaxed">${esc(s)}</p></div>${i < steps.length-1 ? '<div class="flow-conn"><span class="material-symbols-outlined">arrow_forward</span></div>' : ''}`).join("")}
              <div class="flow-conn"><span class="material-symbols-outlined">arrow_forward</span></div>
              <div class="flow-node flow-cap"><div class="text-xs font-bold uppercase mb-2" style="color:var(--accent);">產出</div><p class="text-sm font-semibold text-ink leading-relaxed">${esc(output)}</p></div>
            </div>
            <div class="grid lg:grid-cols-2 gap-6">
              <div class="bg-white rounded-2xl border border-line p-6">
                <h3 class="font-bold text-ink mb-3 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">alt_route</span>流程中的決策點</h3>
                <div class="space-y-2.5">${choices.map((c) => `<div class="flex items-center gap-3 rounded-lg px-3 py-2.5" style="background:var(--accent-soft);"><span class="w-6 h-6 rounded-md grid place-content-center text-white text-[16px] shrink-0" style="background:var(--accent);"><span class="material-symbols-outlined text-[16px]">chevron_right</span></span><span class="text-sm font-semibold text-body">${esc(c)}</span></div>`).join("")}</div>
              </div>
              ${imgSlot("account_tree", "完整流程圖", "可用 draw.io 繪製後替換此區塊（BPMN／泳道圖）", "min-h-[220px]")}
            </div>
          </section>

          <!-- BENEFITS (KPI band) -->
          <section class="tab-panel" data-panel="benefits">
            <p class="eyebrow text-[11px] font-bold uppercase mb-2" style="color:var(--accent);">THE IMPACT</p>
            <h2 class="sec-title mb-4">帶來的效益</h2>
            <p class="sec-lead mb-8">把重複的人工作業自動化，讓數據即時可視、異常更早被發現、決策更快更準。</p>
            <div class="kpi-band rounded-2xl p-8 text-white grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
              ${[
                { n:"−"+dn(4,30,25)+"%", l:"人工往返時間" },
                { n:dn(3,3,2)+"×", l:"異常提早發現" },
                { n:dn(5,20,80)+"%", l:"流程可視化" },
                { n:"−"+dn(2,20,15)+"%", l:"例外處理耗時" },
              ].map((k)=>`<div><div class="text-4xl font-black tracking-tight">${k.n}</div><div class="text-sm text-white/80 mt-1.5">${k.l}</div></div>`).join("")}
            </div>
            <div class="mb-8">
              <h3 class="font-bold text-ink mb-3">可即時監控的關鍵指標</h3>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${metrics.slice(0,4).map((m)=>`<div class="rounded-xl border border-line bg-white p-4 flex items-center gap-3"><span class="material-symbols-outlined txt-accent">monitoring</span><span class="text-sm font-bold text-ink">${esc(m)}</span></div>`).join("")}</div>
            </div>
            <ul class="grid md:grid-cols-3 gap-5">
              ${[
                { t:"減少人工往返", d:"不再以試算表與訊息反覆確認，省下每天的協調時間。" },
                { t:"異常更早發現", d:"風險自動排序與提醒，把問題擋在事故發生之前。" },
                { t:"決策更快更準", d:"營運數據即時彙整，主管一眼掌握該關注的重點。" },
              ].map((b) => `<li class="bg-white rounded-2xl border border-line p-6"><div class="flex items-center gap-2 mb-1.5"><span class="material-symbols-outlined txt-accent">check_circle</span><span class="font-bold text-ink">${b.t}</span></div><p class="text-sm text-muted leading-relaxed">${b.d}</p></li>`).join("")}
            </ul>
            <p class="text-xs text-muted mt-4">＊上方效益數字為示範情境值，用於呈現系統帶來的改善方向。</p>
          </section>

          <!-- DEMO -->
          <section class="tab-panel" data-panel="demo">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-5">
              <div><h2 class="sec-title mb-1">互動 Demo</h2><p class="text-muted text-sm">以下為實際可操作的系統畫面，資料皆為擬真示範。</p></div>
              <a href="${esc(project.demoUrl || "#")}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 h-11 px-5 rounded-xl text-white font-bold shrink-0" style="background:var(--accent);">在新分頁開啟 <span class="material-symbols-outlined text-[18px]">open_in_new</span></a>
            </div>
            <div class="rounded-2xl border border-line overflow-hidden bg-white shadow-sm">
              <div class="h-9 bg-soft border-b border-line flex items-center gap-1.5 px-4"><span class="w-2.5 h-2.5 rounded-full bg-[#ff5f57]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#febc2e]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#28c840]"></span></div>
              <iframe id="demoFrame" title="${esc(title)} Demo" class="w-full" style="height:72vh;border:0;" loading="lazy" data-src="${esc(project.demoUrl || "")}"></iframe>
            </div>
          </section>
        </div>
      `;

      const tabBar = document.getElementById("tabBar");
      const panels = [...document.querySelectorAll(".tab-panel")];
      const buttons = [...tabBar.querySelectorAll(".tab-btn")];
      function activate(name) {
        buttons.forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
        panels.forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
        if (name === "demo") { const f = document.getElementById("demoFrame"); if (f && !f.src && f.dataset.src) f.src = f.dataset.src; }
      }
      tabBar.addEventListener("click", (e) => { const b = e.target.closest(".tab-btn"); if (b) activate(b.dataset.tab); });
    })();
  </script>
</body>
</html>
