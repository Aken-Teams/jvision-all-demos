<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案總覽 ｜ JVision DEMO</title>
  <meta name="description" content="專案總覽：要解決的問題、系統做什麼、核心功能、運作流程、帶來效益與互動 Demo。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1120px' },
    } } };
  </script>
  <style>
    :root { --accent:#1e40af; --accent-soft:#eef4ff; }
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .eyebrow { font-family: Inter, monospace; letter-spacing:.16em; }
    .navlink { position:relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after { transform:scaleX(1); transform-origin:left; }
    /* accent helpers */
    .txt-accent { color:var(--accent); }
    .bg-accent { background:var(--accent); }
    .bg-accent-soft { background:var(--accent-soft); }
    .border-accent { border-color:var(--accent); }
    /* tabs */
    .tab-btn { position:relative; padding:14px 4px; font-weight:700; font-size:14px; color:#64748b; white-space:nowrap; transition:color .18s; }
    .tab-btn:hover { color:var(--accent); }
    .tab-btn.active { color:var(--accent); }
    .tab-btn.active::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:3px; border-radius:3px; background:var(--accent); }
    .tab-panel { display:none; animation:fadeUp .4s ease; }
    .tab-panel.active { display:block; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
    .sec-title { font-size:clamp(1.5rem,2.4vw,2rem); font-weight:800; color:#0f1e46; letter-spacing:-.02em; }
  </style>
</head>
<body class="text-body antialiased min-h-screen flex flex-col">
  <!-- Nav -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" /></a>
      <div class="flex items-center gap-8">
        <a href="./catalog.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./project-expert.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案 Agents</a>
      </div>
    </nav>
  </header>

  <main id="app" class="flex-1"></main>

  <footer class="border-t border-line bg-white mt-auto">
    <div class="max-w-shell mx-auto px-6 py-10 flex flex-col md:flex-row md:items-start justify-between gap-8">
      <div class="flex flex-col gap-3 max-w-sm">
        <img src="./assets/logo.png" alt="JVision DEMO" class="h-8 w-auto self-start" />
        <p class="text-sm text-muted leading-relaxed">從製造現場到企業決策，463 個可操作的 AI 產業系統，一站探索、即刻體驗。</p>
      </div>
      <div class="md:text-right">
        <h4 class="text-xs font-bold text-ink uppercase tracking-wide mb-3">探索</h4>
        <ul class="flex flex-col gap-2 text-sm text-muted">
          <li><a href="./index.html" class="hover:text-brand transition-colors">首頁</a></li>
          <li><a href="./catalog.html" class="hover:text-brand transition-colors">專案目錄</a></li>
          <li><a href="./project-expert.html" class="hover:text-brand transition-colors">專案 Agents</a></li>
        </ul>
      </div>
    </div>
    <div class="border-t border-line">
      <div class="max-w-shell mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-muted">
        <span>© 2026 JVision</span>
        <div class="flex items-center gap-5">
          <a href="#" class="hover:text-brand transition-colors">服務條款</a>
          <a href="#" class="hover:text-brand transition-colors">隱私政策</a>
        </div>
      </div>
    </div>
  </footer>

  <template id="errorTpl">
    <div class="max-w-shell mx-auto px-6 py-24 text-center">
      <h1 class="text-2xl font-bold text-ink mb-2">找不到這個專案</h1>
      <p class="text-muted mb-6">網址參數有誤，或該專案不存在。</p>
      <a href="./catalog.html" class="inline-flex items-center gap-2 h-11 px-6 rounded-xl bg-brand text-white font-bold">回專案目錄</a>
    </div>
  </template>

  <script>
    const ACCENTS = {
      "生產製造":"#1e40af","品質管理":"#0f766e","業務銷售":"#4338ca","採購供應鏈":"#0e7490",
      "人力資源":"#7c3aed","倉儲物流":"#0369a1","研發管理":"#6d28d9","經營管理":"#1e3a8a",
      "ESG 永續":"#15803d","零售電商":"#be123c","教育":"#b45309","企業協作":"#2563eb",
      "營建工程":"#c2410c","醫療照護":"#047857","財務會計":"#3730a3","金融保險":"#0d9488",
      "資訊科技":"#1d4ed8","交通運輸":"#0891b2","設備維護":"#475569","資訊安全":"#b91c1c",
      "專業服務":"#7e22ce","物流運輸":"#0369a1","餐飲旅宿":"#c2410c","生活服務":"#db2777",
      "數據分析":"#4f46e5","客服管理":"#0891b2","房地產與物業":"#a16207","宗教服務":"#b45309",
    };
    const ICONS = {
      "生產製造":"precision_manufacturing","品質管理":"verified","業務銷售":"trending_up","採購供應鏈":"handshake",
      "人力資源":"badge","倉儲物流":"inventory_2","研發管理":"science","經營管理":"insights","ESG 永續":"eco",
      "零售電商":"storefront","教育":"school","企業協作":"groups","營建工程":"engineering","醫療照護":"medical_services",
      "財務會計":"account_balance","金融保險":"savings","資訊科技":"dns","交通運輸":"commute","設備維護":"build",
      "資訊安全":"security","專業服務":"gavel","物流運輸":"local_shipping","餐飲旅宿":"restaurant","生活服務":"checkroom",
      "數據分析":"analytics","客服管理":"support_agent","房地產與物業":"apartment","宗教服務":"temple_buddhist",
    };
    const shortTitle = (t) => { const r = String(t || ""); return r.replace(/[（(].*?[)）]/g, "").trim() || r; };
    const splitList = (s) => String(s || "").split(/[、,，/／·]/).map((x) => x.trim()).filter(Boolean);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

    (async function () {
      const params = new URLSearchParams(location.search);
      const repo = params.get("repo");
      const id = params.get("id");
      const app = document.getElementById("app");
      let project;
      try {
        const res = await fetch("./projects-index.json?v=20260730-2");
        const index = await res.json();
        project = index.projects.find((p) => (repo && p.repoName === repo) || (id && String(p.id) === String(id)));
      } catch (e) { /* fall through */ }
      if (!project) { app.append(document.getElementById("errorTpl").content.cloneNode(true)); return; }

      const cat = project.category || "未分類";
      const accent = ACCENTS[cat] || "#1e40af";
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--accent-soft", `color-mix(in srgb, ${accent} 10%, white)`);
      const icon = ICONS[cat] || "category";
      const title = shortTitle(project.title);
      const cw = project.customerWorkflow || {};
      const steps = (cw.steps && cw.steps.length) ? cw.steps : ["建立資料", "系統處理", "確認並留存"];
      const choices = cw.choices || [];
      const fields = (cw.fields && cw.fields.length) ? cw.fields : ["名稱／編號", "負責人／期限"];
      const output = cw.output || "處理結果與操作紀錄";
      const metrics = (project.operationalMetrics && project.operationalMetrics.length) ? project.operationalMetrics : ["待處理", "高風險", "完成率", "預估影響"];
      const users = splitList(project.primaryUser || "部門使用者與主管");
      const caseNo = String(project.id).padStart(3, "0");
      document.title = `${title}｜JVision DEMO`;

      const features = [
        { icon:"auto_awesome", t:"AI 摘要與建議", d:"自動整理今日異常、待辦、風險與下一步建議，開工先看重點。" },
        { icon:"view_kanban", t:"狀態看板", d:`以「${steps.map(shortStep).join(" / ")}」清楚掌握每筆項目的進度。` },
        { icon:"edit_note", t:"快速建立與處理", d:`填寫「${fields.join("、")}」即可新增、流轉並保存結果。` },
        { icon:"monitoring", t:"營運數據儀表", d:`即時追蹤「${metrics.join("、")}」等關鍵指標。` },
        { icon:"notifications_active", t:"風險排序與提醒", d:"依期限、影響度與資料完整度自動標記最該先處理的項目。" },
        { icon:"history", t:"操作紀錄稽核", d:"每筆操作留痕，可追溯、可稽核，交接不斷層。" },
      ];
      function shortStep(s) { const x = String(s); return x.length > 8 ? x.slice(0, 8) + "…" : x; }

      const chip = (t, cls = "") => `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${cls}" style="background:var(--accent-soft); color:var(--accent);"><span style="width:5px;height:5px;border-radius:999px;background:var(--accent);"></span>${esc(t)}</span>`;

      app.innerHTML = `
        <!-- HERO -->
        <section class="relative overflow-hidden" style="background:linear-gradient(180deg, var(--accent-soft), #f5f8fc);">
          <div class="max-w-shell mx-auto px-6 py-10">
            <a href="./catalog.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-muted hover:text-ink mb-6"><span class="material-symbols-outlined text-[18px]">arrow_back</span>專案目錄</a>
            <div class="grid lg:grid-cols-[1.3fr_1fr] gap-8 items-center">
              <div>
                <div class="flex items-center gap-2.5 mb-4">
                  <span class="w-11 h-11 rounded-xl grid place-content-center text-white shrink-0" style="background:var(--accent);"><span class="material-symbols-outlined">${icon}</span></span>
                  <span class="eyebrow text-[11px] font-bold uppercase" style="color:var(--accent);">${esc(cat)} · CASE ${caseNo}</span>
                </div>
                <h1 class="text-[clamp(2rem,4vw,3rem)] font-black text-ink tracking-tight leading-[1.1] mb-4">${esc(title)}</h1>
                <p class="text-lg text-muted leading-relaxed max-w-xl mb-6">${esc(project.description || "")}</p>
                <div class="flex flex-wrap items-center gap-3">
                  <button id="toDemo" class="inline-flex items-center gap-2 h-12 px-6 rounded-xl text-white font-bold shadow-lg" style="background:var(--accent);">查看 Demo <span class="material-symbols-outlined text-[20px]">arrow_downward</span></button>
                  <a href="${esc(project.demoUrl || "#")}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 h-12 px-6 rounded-xl border border-line bg-white text-ink font-bold hover:border-[color:var(--accent)] transition-colors">開啟 Demo <span class="material-symbols-outlined text-[20px]">open_in_new</span></a>
                </div>
              </div>
              <div class="bg-white rounded-2xl border border-line shadow-sm p-5">
                <p class="eyebrow text-[10px] font-bold text-muted uppercase mb-3">今日營運快照</p>
                <div class="grid grid-cols-2 gap-3">
                  ${metrics.slice(0,4).map((m) => `<div class="rounded-xl p-3" style="background:var(--accent-soft);"><div class="text-2xl font-black" style="color:var(--accent);">—</div><div class="text-xs font-semibold text-muted mt-1">${esc(m)}</div></div>`).join("")}
                </div>
                <p class="text-[11px] text-muted mt-3">＊擬真示範資料，進入 Demo 可即時操作。</p>
              </div>
            </div>
          </div>
        </section>

        <!-- TABS -->
        <div class="sticky top-16 z-30 bg-white/95 backdrop-blur border-b border-line">
          <div class="max-w-shell mx-auto px-6 flex gap-7 overflow-x-auto" id="tabBar">
            <button class="tab-btn active" data-tab="problem">要解決的問題</button>
            <button class="tab-btn" data-tab="system">系統做什麼</button>
            <button class="tab-btn" data-tab="features">核心功能</button>
            <button class="tab-btn" data-tab="flow">運作流程</button>
            <button class="tab-btn" data-tab="benefits">帶來效益</button>
            <button class="tab-btn" data-tab="demo">Demo</button>
          </div>
        </div>

        <div class="max-w-shell mx-auto px-6 py-10">
          <!-- PROBLEM -->
          <section class="tab-panel active" data-panel="problem">
            <h2 class="sec-title mb-3">要解決的問題</h2>
            <p class="text-body leading-relaxed max-w-3xl mb-8">${esc(project.businessSituation || "")}</p>
            <div class="grid md:grid-cols-3 gap-5">
              ${[
                { i:"table_view", t:"試算表往返", d:"資料散在各處試算表與訊息，版本混亂、難以對齊。" },
                { i:"person_search", t:"人工追蹤", d:"靠人一件件盯進度、追負責人，耗時又容易遺漏。" },
                { i:"warning", t:"異常太晚發現", d:"問題往往等到出事才被看到，錯過最佳處理時機。" },
              ].map((c) => `<div class="bg-white rounded-xl border border-line p-5 border-t-4" style="border-top-color:#dc2626;"><div class="flex items-center gap-2 text-[#dc2626] mb-2"><span class="material-symbols-outlined">${c.i}</span><span class="text-xs font-bold">傳統痛點</span></div><h3 class="font-bold text-ink mb-1">${c.t}</h3><p class="text-sm text-muted leading-relaxed">${c.d}</p></div>`).join("")}
            </div>
          </section>

          <!-- SYSTEM -->
          <section class="tab-panel" data-panel="system">
            <h2 class="sec-title mb-3">這套系統做什麼</h2>
            <p class="text-body leading-relaxed max-w-3xl mb-8">${esc(project.description || "")}</p>
            <div class="grid md:grid-cols-2 gap-6">
              <div class="bg-white rounded-xl border border-line p-6">
                <h3 class="font-bold text-ink mb-3 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">groups</span>適合誰</h3>
                <div class="flex flex-wrap gap-2">${users.map((u) => chip(u)).join("")}</div>
              </div>
              <div class="bg-white rounded-xl border border-line p-6">
                <h3 class="font-bold text-ink mb-3 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">event_repeat</span>日常怎麼用</h3>
                <p class="text-sm text-body leading-relaxed">${esc(project.dailyUse || "")}</p>
              </div>
            </div>
          </section>

          <!-- FEATURES -->
          <section class="tab-panel" data-panel="features">
            <h2 class="sec-title mb-3">核心功能</h2>
            <p class="text-muted max-w-3xl mb-8">把分散的作業收斂成一套可操作、可追蹤的流程，讓團隊專注在真正需要判斷的事。</p>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${features.map((f) => `<div class="bg-white rounded-xl border border-line p-5 hover:border-[color:var(--accent)] transition-colors"><div class="w-11 h-11 rounded-lg grid place-content-center mb-4" style="background:var(--accent-soft); color:var(--accent);"><span class="material-symbols-outlined">${f.icon}</span></div><h3 class="font-bold text-ink mb-1.5">${esc(f.t)}</h3><p class="text-sm text-muted leading-relaxed">${esc(f.d)}</p></div>`).join("")}
            </div>
          </section>

          <!-- FLOW -->
          <section class="tab-panel" data-panel="flow">
            <h2 class="sec-title mb-3">運作流程</h2>
            <p class="text-muted max-w-3xl mb-8">從建立資料到完成留存的標準軌道，每一步都清楚、可追蹤。</p>
            <div class="grid md:grid-cols-${Math.min(steps.length,4)} gap-4 mb-8">
              ${steps.map((s, i) => `<div class="relative bg-white rounded-xl border border-line p-5"><div class="w-9 h-9 rounded-full grid place-content-center text-white font-black text-sm mb-3" style="background:var(--accent);">${i+1}</div><p class="text-sm font-semibold text-ink leading-relaxed">${esc(s)}</p></div>`).join("")}
            </div>
            <div class="grid md:grid-cols-2 gap-6">
              <div class="bg-white rounded-xl border border-line p-6">
                <h3 class="font-bold text-ink mb-3 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">alt_route</span>可選動作</h3>
                <ul class="space-y-2">${(choices.length?choices:["執行","退回補件","交主管判斷"]).map((c) => `<li class="flex items-start gap-2 text-sm text-body"><span class="material-symbols-outlined text-[18px] txt-accent mt-0.5">chevron_right</span>${esc(c)}</li>`).join("")}</ul>
              </div>
              <div class="bg-white rounded-xl border border-line p-6">
                <h3 class="font-bold text-ink mb-3 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">task_alt</span>產出</h3>
                <p class="text-sm text-body leading-relaxed">${esc(output)}</p>
              </div>
            </div>
          </section>

          <!-- BENEFITS -->
          <section class="tab-panel" data-panel="benefits">
            <h2 class="sec-title mb-3">帶來的效益</h2>
            <p class="text-muted max-w-3xl mb-8">把重複的人工作業自動化，讓數據即時可視、異常更早被發現。</p>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              ${metrics.slice(0,4).map((m) => `<div class="rounded-xl p-5 text-white" style="background:var(--accent);"><div class="material-symbols-outlined mb-2 opacity-80">insights</div><div class="font-bold text-sm">${esc(m)}</div><div class="text-xs opacity-80 mt-1">即時可視 · 自動彙整</div></div>`).join("")}
            </div>
            <ul class="grid md:grid-cols-3 gap-5">
              ${[
                { t:"減少人工往返", d:"不再以試算表與訊息反覆確認，省下每天的協調時間。" },
                { t:"異常更早發現", d:"風險自動排序與提醒，把問題擋在事故發生之前。" },
                { t:"決策更快更準", d:"營運數據即時彙整，主管一眼掌握該關注的重點。" },
              ].map((b) => `<li class="bg-white rounded-xl border border-line p-5"><div class="flex items-center gap-2 mb-1.5"><span class="material-symbols-outlined txt-accent">check_circle</span><span class="font-bold text-ink">${b.t}</span></div><p class="text-sm text-muted leading-relaxed">${b.d}</p></li>`).join("")}
            </ul>
          </section>

          <!-- DEMO -->
          <section class="tab-panel" data-panel="demo">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-5">
              <div>
                <h2 class="sec-title mb-1">互動 Demo</h2>
                <p class="text-muted text-sm">以下為實際可操作的系統畫面，資料皆為擬真示範。</p>
              </div>
              <a href="${esc(project.demoUrl || "#")}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 h-11 px-5 rounded-xl text-white font-bold shrink-0" style="background:var(--accent);">在新分頁開啟 <span class="material-symbols-outlined text-[18px]">open_in_new</span></a>
            </div>
            <div class="rounded-2xl border border-line overflow-hidden bg-white shadow-sm">
              <div class="h-9 bg-soft border-b border-line flex items-center gap-1.5 px-4"><span class="w-2.5 h-2.5 rounded-full bg-[#ff5f57]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#febc2e]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#28c840]"></span></div>
              <iframe id="demoFrame" title="${esc(title)} Demo" class="w-full" style="height:72vh;border:0;" loading="lazy" data-src="${esc(project.demoUrl || "")}"></iframe>
            </div>
          </section>
        </div>
      `;

      // Tabs
      const tabBar = document.getElementById("tabBar");
      const panels = [...document.querySelectorAll(".tab-panel")];
      const buttons = [...tabBar.querySelectorAll(".tab-btn")];
      const frame = () => document.getElementById("demoFrame");
      function activate(name) {
        buttons.forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
        panels.forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
        if (name === "demo") { const f = frame(); if (f && !f.src && f.dataset.src) f.src = f.dataset.src; }
      }
      tabBar.addEventListener("click", (e) => { const b = e.target.closest(".tab-btn"); if (b) activate(b.dataset.tab); });
      document.getElementById("toDemo").addEventListener("click", () => {
        activate("demo");
        document.querySelector('[data-panel="demo"]').scrollIntoView({ behavior:"smooth", block:"start" });
      });
    })();
  </script>
</body>
</html>
