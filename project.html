<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案總覽 ｜ JVision DEMO</title>
  <meta name="description" content="專案總覽：要解決的問題、系統做什麼、核心功能、運作流程、帶來效益與互動 Demo。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="./shared/system-content.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1120px' },
    } } };
  </script>
  <style>
    :root { --accent:#1e40af; --accent-soft:#eef4ff; --accent-line:#c7d7fe; }
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .eyebrow { font-family: Inter, monospace; letter-spacing:.16em; }
    .navlink { position:relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after { transform:scaleX(1); transform-origin:left; }
    .txt-accent { color:var(--accent); }
    .sec-title { font-size:clamp(1.6rem,2.6vw,2.15rem); font-weight:800; color:#0f1e46; letter-spacing:-.02em; }
    .sec-lead { color:#64748b; max-width:52rem; line-height:1.8; }

    /* tabs: centered, equal width, no scrollbar */
    #tabBar { display:grid; grid-template-columns:repeat(3, 1fr); }
    @media (min-width:768px){ #tabBar { grid-template-columns:repeat(6, 1fr); } }
    .tab-btn { position:relative; padding:15px 6px; font-weight:700; font-size:14px; color:#64748b; text-align:center; transition:color .18s; }
    .tab-btn:hover { color:var(--accent); }
    .tab-btn.active { color:var(--accent); }
    .tab-btn.active::after { content:""; position:absolute; left:12%; right:12%; bottom:-1px; height:3px; border-radius:3px; background:var(--accent); }
    .tab-panel { display:none; animation:fadeUp .45s ease; }
    .tab-panel.active { display:block; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* image placeholder */
    .img-slot { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border-radius:18px; background:var(--accent-soft); border:1px dashed var(--accent-line); color:var(--accent); text-align:center; padding:28px; }
    .img-slot .material-symbols-outlined { font-size:42px; opacity:.65; }
    .img-slot b { font-size:13px; }
    .img-slot small { color:#94a3b8; font-weight:600; }

    /* flow diagram */
    .flow { display:flex; flex-direction:column; gap:8px; }
    @media (min-width:900px){ .flow { flex-direction:row; align-items:stretch; } }
    .flow-node { flex:1; background:#fff; border:1px solid var(--line, #e2e8f0); border-radius:14px; padding:16px 18px; box-shadow:0 4px 14px rgba(15,30,70,.05); }
    .flow-node .num { display:inline-grid; place-content:center; width:30px; height:30px; border-radius:999px; color:#fff; font-weight:900; font-size:13px; background:var(--accent); margin-bottom:10px; }
    .flow-cap { background:var(--accent-soft); border-color:var(--accent-line); }
    .flow-conn { display:flex; align-items:center; justify-content:center; color:var(--accent); }
    .flow-conn .material-symbols-outlined { transform:rotate(90deg); }
    @media (min-width:900px){ .flow-conn { width:34px; } .flow-conn .material-symbols-outlined { transform:none; } }

    /* kpi band */
    .kpi-band { background:linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #000)); }

    /* system architecture map */
    .arch { display:flex; flex-direction:column; align-items:center; }
    .arch-layer { width:100%; border-radius:16px; padding:16px 20px; text-align:center; }
    .arch-entry { background:#fff; border:1px solid var(--line,#e2e8f0); }
    .arch-core { color:#fff; font-weight:900; letter-spacing:.01em; box-shadow:0 14px 34px rgba(15,30,70,.18); background:linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 68%, #000)); }
    .arch-data { background:var(--accent-soft); border:1px solid var(--accent-line); }
    .arch-pipe { width:2px; height:20px; background:var(--accent-line); }
    .arch-label { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .arch-mods { width:100%; display:grid; grid-template-columns:repeat(1,1fr); gap:14px; }
    @media (min-width:640px){ .arch-mods { grid-template-columns:repeat(2,1fr); } }
    @media (min-width:900px){ .arch-mods { grid-template-columns:repeat(3,1fr); } }
    .mod-card { position:relative; background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:16px; padding:20px; transition:border-color .2s, box-shadow .2s, transform .2s; }
    .mod-card:hover { border-color:var(--accent); box-shadow:0 12px 30px rgba(15,30,70,.1); transform:translateY(-2px); }
    .mod-ico { width:44px; height:44px; border-radius:12px; display:grid; place-content:center; color:#fff; background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000)); margin-bottom:14px; }
    .mod-idx { position:absolute; top:16px; right:18px; font:800 12px/1 Inter, monospace; color:var(--accent-line); }

    /* ===== enriched detail components ===== */
    /* chart wrappers */
    .chart-card { background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:18px; padding:18px 18px 10px; box-shadow:0 4px 14px rgba(15,30,70,.05); }
    .chart-box { width:100%; min-height:240px; }
    .mermaid-wrap { background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:18px; padding:22px 18px; overflow-x:auto; text-align:center; display:flex; align-items:center; justify-content:center; }
    .mermaid-wrap > .dg { width:100%; }
    .mermaid-wrap svg { max-width:100%; height:auto; margin:0 auto; display:block; }
    /* pain cards */
    .pain-card { display:flex; gap:14px; background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:14px; padding:16px; }
    .pain-ico { width:40px; height:40px; border-radius:10px; display:grid; place-content:center; background:#fef2f2; color:#dc2626; flex:none; }
    /* kpi comparison cards */
    .kpi-card { background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:16px; padding:16px 18px; }
    .kpi-card .k-label { font-size:12px; font-weight:700; color:#64748b; }
    .kpi-card .k-nums { display:flex; align-items:baseline; gap:8px; margin-top:6px; }
    .kpi-card .k-before { font-size:15px; font-weight:700; color:#94a3b8; text-decoration:line-through; }
    .kpi-card .k-after { font-size:26px; font-weight:900; letter-spacing:-.02em; }
    .kpi-card .k-delta { font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; }
    .k-up { color:#059669; background:#ecfdf5; }
    .k-down { color:#dc2626; background:#fef2f2; }
    /* records table */
    .rec-table { width:100%; border-collapse:collapse; font-size:13px; }
    .rec-table th { text-align:left; font-weight:800; color:#64748b; padding:10px 12px; border-bottom:2px solid var(--line,#e2e8f0); white-space:nowrap; font-size:11px; letter-spacing:.03em; text-transform:uppercase; }
    .rec-table td { padding:11px 12px; border-bottom:1px solid var(--line,#e2e8f0); color:#334155; white-space:nowrap; }
    .rec-table tr:hover td { background:var(--accent-soft); }
    .pri { font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; }
    .pri-high { color:#dc2626; background:#fef2f2; } .pri-medium { color:#b45309; background:#fffbeb; } .pri-low { color:#0369a1; background:#eff6ff; }
    /* decision cards with yes/no */
    .dec-card { background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:14px; padding:14px 16px; }
    .dec-q { display:flex; align-items:center; gap:8px; font-weight:800; color:#0f1e46; margin-bottom:8px; }
    .dec-branch { display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:5px 0; }
    .dec-tag { font-size:11px; font-weight:800; padding:1px 7px; border-radius:6px; flex:none; margin-top:1px; }
    .dec-yes { color:#059669; background:#ecfdf5; } .dec-no { color:#b45309; background:#fffbeb; }
    /* rule list */
    .rule-item { display:flex; gap:12px; background:var(--accent-soft); border-radius:12px; padding:12px 14px; }
    .rule-id { font:800 11px/1.4 Inter, monospace; color:var(--accent); background:#fff; border:1px solid var(--accent-line); border-radius:6px; padding:3px 7px; height:max-content; flex:none; }

    /* ===== diagram template library (colored + centered) ===== */
    .dg { text-align:center; width:100%; }
    .dg-layers { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .dg-band { width:100%; max-width:820px; border-radius:14px; padding:12px 16px; }
    .dg-entry, .dg-data { background:var(--accent-soft); border:1px solid var(--accent-line); }
    .dg-mods { background:#fff; border:1px solid var(--line,#e2e8f0); }
    .dg-t { display:block; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
    .dg-core { max-width:820px; width:100%; color:#fff; font-weight:800; font-size:16px; padding:13px; border-radius:14px; background:linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 64%, #000)); box-shadow:0 12px 28px rgba(15,30,70,.18); }
    .dg-arrow { color:var(--accent-line); font-weight:900; font-size:18px; line-height:1; }
    .dg-chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
    .dg-chip { background:#fff; border:1px solid var(--accent-line); color:var(--accent); font-weight:700; font-size:13px; padding:6px 13px; border-radius:999px; white-space:nowrap; }
    .dg-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; }
    .dg-cell { background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:10px; padding:11px 10px; font-weight:700; font-size:13px; color:var(--accent); display:flex; align-items:center; gap:7px; justify-content:center; }
    .dg-cell .material-symbols-outlined { font-size:18px; }
    /* framed block wrapper (makes a diagram read as one clear block) */
    .dg-frame { border:1.5px solid var(--accent-line); background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, #fff), #fff); border-radius:18px; padding:22px 20px; max-width:880px; margin:0 auto; }
    .dg-frame.dg-layers { display:flex; flex-direction:column; align-items:center; gap:6px; }
    /* radial rings */
    .dg-rings { position:relative; width:100%; height:400px; max-width:520px; margin:0 auto; }
    .dg-ring-bg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border:2px dashed var(--accent-line); border-radius:50%; background:color-mix(in srgb, var(--accent) 4%, #fff); z-index:0; }
    .dg-core-c { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:150px; height:150px; border-radius:50%; display:grid; place-content:center; text-align:center; color:#fff; font-weight:800; font-size:14px; line-height:1.3; padding:12px; background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent) 78%, #fff), var(--accent)); box-shadow:0 14px 34px rgba(15,30,70,.22); z-index:2; }
    .dg-orbit { position:absolute; transform:translate(-50%,-50%); box-shadow:0 6px 16px rgba(15,30,70,.10); z-index:1; }
    .dg-spoke { position:absolute; left:50%; top:50%; height:2px; background:var(--accent-line); transform-origin:0 50%; z-index:0; }
    /* vertical stepper */
    .dg-steps { max-width:660px; margin:0 auto; text-align:left; }
    .dg-step { display:flex; gap:14px; align-items:flex-start; }
    .dg-step-n { width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; font-weight:900; font-size:14px; display:grid; place-content:center; flex:none; }
    .dg-step-b { flex:1; background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:12px; padding:11px 14px; margin-bottom:2px; }
    .dg-step-c { width:2px; height:16px; background:var(--accent-line); margin-left:16px; }
    /* horizontal journey */
    .dg-journey { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:0; }
    .dg-jcap { background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--accent); }
    .dg-jstep { background:#fff; border:1px solid var(--accent-line); border-radius:12px; padding:12px 14px; min-width:120px; max-width:180px; text-align:center; }
    .dg-jnum { display:inline-grid; place-content:center; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-weight:900; font-size:12px; margin-bottom:6px; }
    .dg-jconn { color:var(--accent); font-size:20px; font-weight:900; padding:0 6px; }
    /* 3-column pillars architecture */
    .dg-pillars { display:flex; align-items:stretch; justify-content:center; gap:0; flex-wrap:wrap; max-width:900px; margin:0 auto; }
    .dg-pillar { flex:1; min-width:150px; max-width:300px; background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .dg-pillar-core { background:#fff; }
    .dg-pillar-h { font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); text-align:center; margin-bottom:2px; }
    .dg-pcell { background:#fff; border:1px solid var(--accent-line); border-radius:9px; padding:9px 10px; font-weight:700; font-size:13px; color:var(--accent); text-align:center; }
    .dg-pillar-core .dg-pcell { background:var(--accent-soft); }
    .dg-pconn { display:flex; align-items:center; color:var(--accent); font-size:24px; font-weight:900; padding:0 8px; }
    @media (max-width:640px){ .dg-pconn { transform:rotate(90deg); padding:6px 0; } .dg-pillars { flex-direction:column; align-items:stretch; } }

    /* interactive flow (left steps + right detail) */
    .flow-in { display:flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px dashed var(--accent-line); border-radius:12px; padding:10px 14px; font-size:13px; font-weight:600; color:var(--accent); overflow:hidden; }
    .flow-in-t { flex:none; }
    .flow-in-x { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .flow-step .fs-body b { overflow-wrap:anywhere; }
    .flow-in-t { font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:#fff; border:1px solid var(--accent-line); border-radius:6px; padding:2px 7px; }
    .flow-step { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:12px; padding:12px 14px; transition:border-color .15s, background .15s, box-shadow .15s; cursor:pointer; }
    .flow-step:hover { border-color:var(--accent-line); }
    .flow-step.active { border-color:var(--accent); background:var(--accent-soft); box-shadow:0 6px 18px rgba(15,30,70,.08); }
    .flow-step .fs-n { width:30px; height:30px; border-radius:50%; background:var(--accent-line); color:var(--accent); font-weight:900; font-size:13px; display:grid; place-content:center; flex:none; }
    .flow-step.active .fs-n { background:var(--accent); color:#fff; }
    .flow-step .fs-body { display:flex; flex-direction:column; min-width:0; }
    .flow-step .fs-body b { font-size:14px; color:#0f1e46; line-height:1.3; }
    .flow-step .fs-body small { font-size:11px; color:#64748b; }
    .flow-step .fs-flag { margin-left:auto; color:var(--accent); font-size:18px; }
    .flow-step-out { cursor:default; background:var(--accent-soft); border-color:var(--accent-line); }
    .flow-step-out .fs-n { background:var(--accent); color:#fff; }
    .flow-detail { background:#fff; border:1px solid var(--line,#e2e8f0); border-radius:16px; padding:22px; min-height:380px; }

    /* benefits: horizontal collaboration flow */
    .collab { display:flex; align-items:flex-start; }
    .collab-step { flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; padding:0 8px; }
    .collab-step:not(:last-child)::after { content:""; position:absolute; top:27px; left:calc(50% + 30px); right:calc(-50% + 30px); height:2px; background:var(--accent-line); z-index:0; }
    .collab-ico { width:54px; height:54px; border-radius:50%; display:grid; place-content:center; border:2px solid var(--accent-line); background:#fff; color:var(--accent); margin-bottom:12px; position:relative; z-index:1; }
    .collab-step.done .collab-ico { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 8px 20px rgba(15,30,70,.18); }
    .collab-num { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
    .collab-title { font-weight:800; color:#0f1e46; margin-bottom:5px; font-size:15px; }
    .collab-desc { font-size:12px; color:#64748b; line-height:1.6; max-width:210px; }
    @media (max-width:640px){ .collab { flex-direction:column; gap:18px; } .collab-step { flex-direction:row; text-align:left; gap:14px; padding:0; } .collab-step::after { display:none; } .collab-ico { margin-bottom:0; flex:none; } .collab-desc { max-width:none; } }
  </style>
</head>
<body class="text-body antialiased min-h-screen flex flex-col">

      "生產製造":"precision_manufacturing","品質管理":"verified","業務銷售":"trending_up","採購供應鏈":"handshake","人力資源":"badge",

      "資訊科技":"dns","交通運輸":"commute","設備維護":"build","資訊安全":"security","專業服務":"gavel","物流運輸":"local_shipping",
      "餐飲旅宿":"restaurant","生活服務":"checkroom","數據分析":"analytics","客服管理":"support_agent","房地產與物業":"apartment","宗教服務":"temple_buddhist",
    };
    const shortTitle = (t) => { const r = String(t || ""); return r.replace(/[（(].*?[)）]/g, "").trim() || r; };
    const splitList = (s) => String(s || "").split(/[、,，/／·]/).map((x) => x.trim()).filter(Boolean);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const clip = (s, n) => { const x = String(s || ""); return x.length > n ? x.slice(0, n) + "…" : x; };

    const num = (v) => { const m = String(v == null ? "" : v).match(/-?\d+(?:\.\d+)?/); return m ? Number(m[0]) : 0; };
    const chip = (t) => `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold" style="background:var(--accent-soft); color:var(--accent);"><span style="width:5px;height:5px;border-radius:999px;background:var(--accent);"></span>${esc(t)}</span>`;
    const imgSlot = (labelIcon, label, hint, extra = "") => `<div class="img-slot ${extra}"><span class="material-symbols-outlined">${labelIcon}</span><b>${esc(label)}</b><small>${esc(hint)}</small></div>`;
    // "lower is better" heuristic for KPI direction (controls arrow + colour only)
    const LOWER_BETTER = /工時|時間|耗時|延遲|加班|停線|流失|逾期|錯誤|不良率|重排|帳齡|成本|停機|漏接|次數|天數/;
    const isImproved = (k) => { const lower = LOWER_BETTER.test(k.label) || /分鐘|小時|天|次/.test(k.unit || ""); return lower ? k.after < k.before : k.after > k.before; };
    const deltaPct = (k) => { const b = num(k.before); if (!b) return 0; return Math.round((num(k.after) - b) / b * 100); };

    // ---- build a normalised detail model from details JSON (preferred) or index+system-content (fallback) ----
    function buildModel(p, D) {
      const cat = p.category || "未分類";
      const sc = window.JVSystemContent ? window.JVSystemContent.get(p) : null;
      const users = splitList(p.primaryUser || "部門使用者與主管");
      const cw = p.customerWorkflow || {};
      if (D) {
        const sys = Object.assign({ summary: p.description || "", users, dailyUse: p.dailyUse || "" }, D.system || {});
        if (!sys.users || !sys.users.length) sys.users = users;
        return {
          raw: p, cat, hasData: true, title: shortTitle(D.title || p.title),
          systemType: D.systemType || (sc && sc.label) || cat,
          hero: D.hero || {}, problem: D.problem || {}, system: sys,
          architecture: D.architecture || {}, flow: D.flow || {}, benefits: D.benefits || {},
          records: D.records || null, decisionRules: D.decisionRules || null, demoUrl: p.demoUrl,
        };
      }
      // fallback (keeps not-yet-enriched projects working)
      const steps = (cw.steps && cw.steps.length) ? cw.steps : ["建立資料", "系統處理", "確認並留存"];
      const choices = (cw.choices && cw.choices.length) ? cw.choices : ["執行處理", "退回補件", "交主管判斷"];
      const fields = (cw.fields && cw.fields.length) ? cw.fields : ["名稱／編號", "負責人／期限"];
      const metrics = (p.operationalMetrics && p.operationalMetrics.length) ? p.operationalMetrics : ["待處理", "高風險", "完成率", "預估影響"];
      const dn = (seed, mod, base) => (p.id * seed) % mod + base;
      return {
        raw: p, cat, hasData: false, title: shortTitle(p.title),
        systemType: (sc && sc.label) || cat,
        hero: { tagline: (sc && sc.tagline) || "把散落的作業整合成一套可操作、可追蹤的系統。", highlights: [
          { icon: "groups", label: "適用角色", value: users.length + " 種" },
          { icon: "conversion_path", label: "流程步驟", value: steps.length + " 步" },
          { icon: "monitoring", label: "關鍵指標", value: metrics.length + " 項" },
        ]},
        problem: { situation: p.businessSituation || "", pains: [
          { icon: "table_view", title: "試算表往返", desc: "資料散在各處試算表與訊息，版本混亂、難以對齊。" },
          { icon: "person_search", title: "人工追蹤", desc: "靠人一件件盯進度、追負責人，耗時又容易遺漏。" },
          { icon: "warning", title: "異常太晚發現", desc: "問題往往等到出事才被看到，錯過最佳處理時機。" },
        ], impact: "重複人工與資訊分散，讓交期、品質與決策都慢半拍。" },
        system: { summary: (p.description || "") + "把散落的作業，整合成一個「可操作、可追蹤、可稽核」的單一平台。", users, dailyUse: p.dailyUse || "" },
        architecture: { entry: (sc && sc.entry) || users.slice(0, 3), core: (sc && sc.label) || cat, modules: (sc && sc.modules) || [], data: (sc && sc.data) || ["營運報表", "操作紀錄", "系統整合"] },
        flow: { inputs: fields, lanes: [{ role: users[0] || "承辦", steps }], decisions: choices.map((c) => ({ label: c })), output: cw.output || "處理結果與操作紀錄" },
        benefits: { kpis: [
            { label: "人工往返時間", before: dn(4, 30, 55) + 30, after: dn(2, 15, 12) + 10, unit: "分鐘/日" },
            { label: "流程可視化", before: 45, after: dn(5, 15, 82), unit: "%" },
            { label: "異常回應速度", before: dn(3, 20, 55), after: dn(7, 8, 8), unit: "分鐘" },
          ],
          trend: { labels: ["第1週", "第2週", "第3週", "第4週", "第5週", "第6週"], series: [{ name: "流程可視化 %", data: [45, 54, 63, 72, 79, 85] }] },
          gauges: [{ label: "流程可視化", value: dn(5, 15, 82), target: 95 }],
          points: [
            { title: "減少人工往返", desc: "不再以試算表與訊息反覆確認，省下每天的協調時間。" },
            { title: "異常更早發現", desc: "風險自動排序與提醒，把問題擋在事故發生之前。" },
            { title: "決策更快更準", desc: "營運數據即時彙整，主管一眼掌握該關注的重點。" },
          ]},
        records: null, decisionRules: null, demoUrl: p.demoUrl,
      };
    }

    (async function () {
      const params = new URLSearchParams(location.search);
      const repo = params.get("repo"), id = params.get("id");
      const app = document.getElementById("app");
      let project, index;
      try {
        const res = await fetch("./projects-index.json?v=20260730-2");
        index = await res.json();
        project = index.projects.find((p) => (repo && p.repoName === repo) || (id && String(p.id) === String(id)));
      } catch (e) {}
      if (!project) { app.append(document.getElementById("errorTpl").content.cloneNode(true)); return; }

      // try the enriched detail layer; fall back silently if absent
      let detail = null;
      try {
        const dr = await fetch(`./content/details/${project.repoName}.json?v=20260813`);
        if (dr.ok) detail = await dr.json();
      } catch (e) {}
      const D = buildModel(project, detail);

      const cat = D.cat;
      const accent = ACCENTS[cat] || "#1e40af";
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--accent-soft", `color-mix(in srgb, ${accent} 9%, white)`);
      document.documentElement.style.setProperty("--accent-line", `color-mix(in srgb, ${accent} 28%, white)`);
      const icon = ICONS[cat] || "category";
      const title = D.title;
      const caseNo = String(index.projects.indexOf(project) + 1).padStart(3, "0");
      document.title = `${title}｜JVision DEMO`;

      const users = (D.system.users && D.system.users.length) ? D.system.users : ["部門使用者", "主管"];
      const highlights = (D.hero.highlights && D.hero.highlights.length) ? D.hero.highlights : [];
      const pains = (D.problem.pains && D.problem.pains.length) ? D.problem.pains : [];
      const modules = (D.architecture.modules && D.architecture.modules.length) ? D.architecture.modules : [];
      const kpis = (D.benefits.kpis || []).map((k) => ({ label: k.label, before: num(k.before), after: num(k.after), unit: k.unit || "" }));
      const gauges = D.benefits.gauges || [];
      const points = D.benefits.points || [];
      const decisions = D.flow.decisions || [];

      // ---- diagram template library: colored + centered; each system picks a fitting style ----
      const mm = (s) => String(s == null ? "" : s).replace(/["]/g, "＂").replace(/[\[\]{}<>|()]/g, "").replace(/[\n\r]/g, " ").trim();
      const hx = (hex, wr) => { hex = String(hex).replace("#", ""); if (hex.length < 6) hex = "1e40af"; const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16); const m = (c) => Math.round(c + (255 - c) * wr).toString(16).padStart(2, "0"); return "#" + m(r) + m(g) + m(b); };
      const cSoft = hx(accent, 0.9), cLine = hx(accent, 0.5);
      const _a = D.architecture || {}, _f = D.flow || {};
      // clip diagram labels so long text never breaks the layout (fallback steps can be very long)
      const clipD = (s, n) => { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "…" : s; };
      const dMods = modules.slice(0, 8).map((m) => ({ icon: m.icon, name: clipD(m.name, 10) }));
      const dEntry = (_a.entry && _a.entry.length ? _a.entry : users).slice(0, 5).map((x) => clipD(x, 8));
      const dData = (_a.data || []).slice(0, 5).map((x) => clipD(x, 10));
      const dCore = clipD(mm(_a.core || D.systemType) || "系統核心", 18);
      const dLanes = (_f.lanes && _f.lanes.length) ? _f.lanes : [{ role: "流程", steps: _f.steps || [] }];
      const dInputs = (_f.inputs || []).map((x) => clipD(x, 12));
      const dOutput = clipD(_f.output || "處理結果", 22);
      const dSteps = dLanes.flatMap((l) => (l.steps && l.steps.length ? l.steps : [])).slice(0, 7).map((s) => clipD(s, 14));
      const inTxt = dInputs.map((x) => esc(x)).join("、") || "資料輸入";

      // --- MODULE diagrams ---
      function tLayers() {
        const chips = (arr) => arr.map((x) => `<span class="dg-chip">${esc(x)}</span>`).join("");
        const cells = dMods.map((m) => `<div class="dg-cell"><span class="material-symbols-outlined">${esc(m.icon || "widgets")}</span>${esc(m.name)}</div>`).join("");
        return { engine: "html", html: `<div class="dg"><div class="dg-frame dg-layers"><div class="dg-band dg-entry"><span class="dg-t">使用者入口</span><div class="dg-chips">${chips(dEntry)}</div></div><div class="dg-arrow">▾</div><div class="dg-core">${esc(dCore)}</div><div class="dg-arrow">▾</div><div class="dg-band dg-mods"><span class="dg-t">功能模組</span><div class="dg-grid">${cells}</div></div><div class="dg-arrow">▾</div><div class="dg-band dg-data"><span class="dg-t">資料與整合</span><div class="dg-chips">${chips(dData)}</div></div></div></div>` };
      }
      function tGrid() {
        const cells = dMods.map((m) => `<div class="dg-cell" style="flex-direction:column;gap:5px;padding:15px 10px;"><span class="material-symbols-outlined" style="font-size:24px;">${esc(m.icon || "widgets")}</span><span>${esc(m.name)}</span></div>`).join("");
        return { engine: "html", html: `<div class="dg"><div class="dg-core" style="max-width:520px;margin:0 auto 16px;">${esc(dCore)}</div><div class="dg-grid" style="max-width:840px;margin:0 auto;">${cells}</div><div class="dg-chips" style="margin-top:14px;">${dData.map((x) => `<span class="dg-chip">${esc(x)}</span>`).join("")}</div></div>` };
      }
      function tRings() {
        const n = Math.max(dMods.length, 1), R = 158;
        const orbits = dMods.map((m, i) => { const ang = (360 / n) * i - 90, rad = ang * Math.PI / 180, x = Math.cos(rad) * R, y = Math.sin(rad) * R; return `<div class="dg-spoke" style="width:${(R - 82).toFixed(0)}px; transform:rotate(${ang}deg);"></div><span class="dg-chip dg-orbit" style="left:calc(50% + ${x.toFixed(0)}px); top:calc(50% + ${y.toFixed(0)}px);"><span class="material-symbols-outlined" style="font-size:15px;vertical-align:-2px;">${esc(m.icon || "widgets")}</span> ${esc(m.name)}</span>`; }).join("");
        const entryRow = dEntry.length ? `<div class="dg-t">使用者入口</div><div class="dg-chips" style="margin-bottom:6px;">${dEntry.map((x) => `<span class="dg-chip" style="background:var(--accent-soft);">${esc(x)}</span>`).join("")}</div>` : "";
        const dataRow = dData.length ? `<div class="dg-t" style="margin-top:6px;">資料與整合</div><div class="dg-chips">${dData.map((x) => `<span class="dg-chip"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;">database</span> ${esc(x)}</span>`).join("")}</div>` : "";
        return { engine: "html", html: `<div class="dg"><div class="dg-frame" style="max-width:600px;">${entryRow}<div class="dg-rings"><div class="dg-ring-bg" style="width:${2 * R - 26}px;height:${2 * R - 26}px;"></div><div class="dg-core-c">${esc(dCore)}</div>${orbits}</div>${dataRow}</div></div>` };
      }
      function tPillars() {
        const cell = (x) => `<div class="dg-pcell">${esc(x)}</div>`;
        const entryItems = dEntry.map(cell).join("");
        const modItems = `<div class="dg-core" style="font-size:14px;padding:10px;margin-bottom:2px;">${esc(dCore)}</div>` + dMods.map((m) => `<div class="dg-pcell" style="display:flex;align-items:center;gap:6px;justify-content:center;"><span class="material-symbols-outlined" style="font-size:16px;">${esc(m.icon || "widgets")}</span>${esc(m.name)}</div>`).join("");
        const dataItems = dData.map(cell).join("");
        return { engine: "html", html: `<div class="dg dg-pillars"><div class="dg-pillar"><div class="dg-pillar-h">使用者入口</div>${entryItems}</div><div class="dg-pconn">→</div><div class="dg-pillar dg-pillar-core"><div class="dg-pillar-h">核心與模組</div>${modItems}</div><div class="dg-pconn">→</div><div class="dg-pillar"><div class="dg-pillar-h">資料與整合</div>${dataItems}</div></div>` };
      }
      function tMindmap() {
        // mermaid fallback definition
        let s = `%%{init: {"theme":"default"}}%%\nmindmap\n  root((${dCore}))\n`;
        if (dEntry.length) { s += "    使用者入口\n"; dEntry.forEach((e) => s += `      ${mm(e)}\n`); }
        s += "    功能模組\n"; (dMods.length ? dMods : [{ name: "核心模組" }]).forEach((m) => s += `      ${mm(m.name)}\n`);
        if (dData.length) { s += "    資料與整合\n"; dData.forEach((d) => s += `      ${mm(d)}\n`); }
        // d3 radial tree data (raw text; d3 escapes on render)
        const node = (content, children) => ({ content, children: children || [] });
        const kids = [];
        if (dEntry.length) kids.push(node("使用者入口", dEntry.map((e) => node(e))));
        kids.push(node("功能模組", (dMods.length ? dMods : [{ name: "核心模組" }]).map((m) => node(m.name))));
        if (dData.length) kids.push(node("資料與整合", dData.map((d) => node(d))));
        return { engine: "radial", data: node(dCore, kids), def: s };
      }

      // --- PROCESS diagrams ---
      function tSwimlane() {
        let s = "flowchart LR\n";
        s += ` IN(["輸入<br/>${dInputs.map(mm).join(" · ") || "資料輸入"}"]):::cap\n`;
        const first = [], last = [];
        dLanes.forEach((ln, li) => { const st = (ln.steps && ln.steps.length) ? ln.steps : ["處理"];
          s += ` subgraph L${li}["${mm(clipD(ln.role || ("關卡" + (li + 1)), 8))}"]\n  direction LR\n`;
          st.forEach((step, si) => s += `  L${li}S${si}["${mm(clipD(step, 12))}"]:::st\n`);
          s += " end\n";
          for (let si = 0; si < st.length - 1; si++) s += ` L${li}S${si} --> L${li}S${si + 1}\n`;
          first[li] = `L${li}S0`; last[li] = `L${li}S${st.length - 1}`;
        });
        s += ` IN --> ${first[0]}\n`;
        for (let li = 0; li < dLanes.length - 1; li++) s += ` ${last[li]} --> ${first[li + 1]}\n`;
        s += ` ${last[dLanes.length - 1]} --> OUT(["產出<br/>${mm(dOutput)}"]):::cap\n`;
        s += `classDef cap fill:${accent},stroke:${accent},color:#fff;\nclassDef st fill:${cSoft},stroke:${cLine},color:${accent};\n`;
        return { engine: "mermaid", def: s };
      }
      function tPipeline() {
        const steps = dSteps.length ? dSteps : ["建立", "處理", "確認"];
        let s = "flowchart LR\n IN([\"" + (dInputs.map(mm).join(" · ") || "輸入") + "\"]):::cap\n";
        let prev = "IN";
        steps.forEach((st, i) => { s += ` S${i}["${i + 1}. ${mm(st)}"]:::st\n ${prev} --> S${i}\n`; prev = `S${i}`; });
        s += ` OUT(["${mm(dOutput)}"]):::cap\n ${prev} --> OUT\n`;
        s += `classDef cap fill:${accent},stroke:${accent},color:#fff;\nclassDef st fill:${cSoft},stroke:${cLine},color:${accent};\n`;
        return { engine: "mermaid", def: s };
      }
      function tCycle() {
        const steps = dSteps.length ? dSteps : ["計畫", "執行", "檢查", "改善"];
        let s = "flowchart LR\n";
        steps.forEach((st, i) => s += ` S${i}(("${i + 1}<br/>${mm(st)}")):::st\n`);
        for (let i = 0; i < steps.length; i++) s += ` S${i} --> S${(i + 1) % steps.length}\n`;
        s += `classDef st fill:${cSoft},stroke:${accent},color:${accent};\n`;
        return { engine: "mermaid", def: s };
      }
      function tStepper() {
        const steps = dSteps.length ? dSteps : ["建立資料", "系統處理", "確認留存"];
        const rows = steps.map((st, i) => `<div class="dg-step"><div class="dg-step-n">${i + 1}</div><div class="dg-step-b"><b class="text-ink">${esc(st)}</b></div></div>${i < steps.length - 1 ? '<div class="dg-step-c"></div>' : ""}`).join("");
        return { engine: "html", html: `<div class="dg"><div class="dg-steps"><div class="dg-step"><div class="dg-step-n" style="background:${cLine};color:${accent};">▸</div><div class="dg-step-b" style="background:var(--accent-soft);border-color:var(--accent-line);"><span class="dg-t" style="margin-bottom:2px;">輸入</span>${inTxt}</div></div><div class="dg-step-c"></div>${rows}<div class="dg-step-c"></div><div class="dg-step"><div class="dg-step-n">✓</div><div class="dg-step-b" style="background:var(--accent-soft);border-color:var(--accent-line);"><span class="dg-t" style="margin-bottom:2px;">產出</span>${esc(dOutput)}</div></div></div></div>` };
      }
      function tJourney() {
        const steps = dSteps.length ? dSteps : ["建立資料", "系統處理", "確認留存"];
        const parts = [`<div class="dg-jstep dg-jcap"><div class="dg-t" style="margin-bottom:2px;">輸入</div><div class="text-sm font-semibold" style="color:var(--accent);">${inTxt}</div></div>`];
        steps.forEach((st, i) => { parts.push('<span class="dg-jconn">›</span>'); parts.push(`<div class="dg-jstep"><div class="dg-jnum">${i + 1}</div><div class="text-sm font-semibold text-ink">${esc(st)}</div></div>`); });
        parts.push('<span class="dg-jconn">›</span>');
        parts.push(`<div class="dg-jstep dg-jcap"><div class="dg-t" style="margin-bottom:2px;">產出</div><div class="text-sm font-semibold" style="color:var(--accent);">${esc(clip(dOutput, 20))}</div></div>`);
        return { engine: "html", html: `<div class="dg dg-journey">${parts.join("")}</div>` };
      }

      // --- selector: category biases the style, project id keeps same-type systems distinct ---
      const MODULE_TPLS = [tLayers, tPillars, tMindmap, tGrid, tRings];
      const PROCESS_TPLS = [tSwimlane, tPipeline, tCycle, tStepper, tJourney];
      const hcat = String(cat).split("").reduce((a, c) => a + c.charCodeAt(0), 0);
      const moduleSpec = MODULE_TPLS[(project.id + hcat) % MODULE_TPLS.length]();
      const processSpec = PROCESS_TPLS[(project.id * 2 + hcat + 1) % PROCESS_TPLS.length]();

      // ---- html fragments ----
      const painsHtml = pains.map((c) => `<div class="pain-card"><span class="pain-ico"><span class="material-symbols-outlined">${esc(c.icon || "warning")}</span></span><div><h3 class="font-bold text-ink">${esc(c.title)}</h3><p class="text-sm text-muted leading-relaxed mt-0.5">${esc(c.desc)}</p></div></div>`).join("");

            <div class="chart-card mb-8"><h3 class="font-bold text-ink mb-1 px-1">導入前後對比</h3><div id="benefitBar" class="chart-box" style="height:${Math.max(220, kpis.length * 52)}px;"></div></div>
            <div class="bg-white rounded-2xl border border-line p-6 mb-8">
              <h3 class="font-bold text-ink mb-1 flex items-center gap-2"><span class="material-symbols-outlined txt-accent">handshake</span>與客戶協作的方式</h3>
              <p class="text-sm text-muted mb-7">導入後，系統帶著團隊一步步走完每個階段的協作。</p>
              <div class="collab">${collabHtml}</div>
            </div>
            <h3 class="font-bold text-ink mb-4">導入後帶來的改變</h3>
            <ul class="grid md:grid-cols-3 gap-5">${pointsHtml}</ul>
            <p class="text-xs text-muted mt-4">＊上方效益數字為示範情境值，用於呈現系統帶來的改善方向。</p>
          </section>

          <!-- DEMO -->
          <section class="tab-panel" data-panel="demo">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-5">
              <div><h2 class="sec-title mb-1">互動 Demo</h2><p class="text-muted text-sm">以下為實際可操作的系統畫面，資料皆為擬真示範。</p></div>
              <a href="${esc(D.demoUrl || "#")}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 h-11 px-5 rounded-xl text-white font-bold shrink-0" style="background:var(--accent);">在新分頁開啟 <span class="material-symbols-outlined text-[18px]">open_in_new</span></a>
            </div>
            <div class="rounded-2xl border border-line overflow-hidden bg-white shadow-sm">
              <div class="h-9 bg-soft border-b border-line flex items-center gap-1.5 px-4"><span class="w-2.5 h-2.5 rounded-full bg-[#ff5f57]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#febc2e]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#28c840]"></span></div>
              <iframe id="demoFrame" title="${esc(title)} Demo" class="w-full" style="height:72vh;border:0;" loading="lazy" data-src="${esc(D.demoUrl || "")}"></iframe>
            </div>
          </section>
        </div>
      `;

      // ---- hero: 縮放嵌入的 live demo 成「活的預覽」 ----
      function scaleHeroEmbed() {
        document.querySelectorAll(".jv-hero-embed").forEach((wrap) => {
          const f = wrap.querySelector(".jv-hero-frame"); if (!f) return;
          const w = wrap.clientWidth; if (!w) return; // 隱藏中（tab 未開）先跳過
          if (!f.src && f.dataset.src) f.src = f.dataset.src; // lazy 載入
          const s = w / 1440;
          f.style.transform = "scale(" + s + ")";
          wrap.style.height = Math.round(900 * s) + "px";
        });
      }
      scaleHeroEmbed();
      requestAnimationFrame(scaleHeroEmbed);
      window.addEventListener("resize", scaleHeroEmbed);
      function scaleFlowEmbed() {
        document.querySelectorAll(".jv-flow-embed").forEach((wrap) => {
          const f = wrap.querySelector(".jv-flow-frame"); if (!f) return;
          const w = wrap.clientWidth; if (!w) return; // tab 未開時 clientWidth=0，先跳過
          if (!f.src && f.dataset.src) f.src = f.dataset.src;
          const s = w / 1280;
          f.style.transform = "scale(" + s + ")";
          wrap.style.height = Math.round(840 * s) + "px";
        });
      }
      window.addEventListener("resize", scaleFlowEmbed);

      // ---- chart / diagram rendering (lazy, per tab) ----
      const charts = [];
      let mermaidReady = false;
      try { if (window.mermaid) { mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", flowchart: { nodeSpacing: 30, rankSpacing: 48, padding: 12, useMaxWidth: true }, themeVariables: { fontSize: "16px", primaryColor: "#ffffff", primaryBorderColor: accent, primaryTextColor: "#0f1e46", lineColor: "#94a3b8", fontFamily: "Inter, Noto Sans TC, sans-serif" } }); mermaidReady = true; } } catch (e) {}
      async function drawDiagram(elId, spec) {
        const el = document.getElementById(elId); if (!el || el.dataset.done || !spec) return;
        if (spec.engine === "html") { el.innerHTML = spec.html; el.dataset.done = "1"; return; }
        if (spec.engine === "radial") {
          if (window.d3) {
            try {
              const d3 = window.d3, data = spec.data, groups = data.children || [];
              const palette = ["#16a34a", "#dc2626", "#7c3aed", "#0891b2", "#d97706", "#db2777", "#2563eb", "#65a30d", "#0d9488", "#c026d3"];
              // balance the top-level groups across left / right by leaf count
              const leafN = (g) => (g.children ? g.children.length : 1);
              const marked = groups.map((g, i) => ({ g, i, n: leafN(g) })).sort((a, b) => b.n - a.n);
              const R = [], L = []; let rn = 0, ln = 0;
              marked.forEach((o) => { if (rn <= ln) { R.push(o); rn += o.n; } else { L.push(o); ln += o.n; } });
              const rGroups = R.sort((a, b) => a.i - b.i).map((o) => o.g), lGroups = L.sort((a, b) => a.i - b.i).map((o) => o.g);
              const side = (gs, dir) => { if (!gs.length) return null; const h = d3.hierarchy({ content: data.content, children: gs }); d3.tree().nodeSize([52, 190]).separation((a, b) => (a.parent === b.parent ? 1 : 1.45))(h); const rx = h.x; h.each((n) => { n.sx = dir * n.y; n.sy = n.x - rx; }); return h; };
              const HR = side(rGroups, 1), HL = side(lGroups, -1);
              const grpIdx = (n) => { let m = n; while (m.depth > 1) m = m.parent; return groups.indexOf(m.data); };
              const colorOf = (n) => palette[((grpIdx(n) < 0 ? 0 : grpIdx(n)) % palette.length)];
              const nodes = [], links = [];
              [HR, HL].forEach((h) => { if (!h) return; h.descendants().forEach((n) => { if (n.depth > 0) nodes.push(n); }); h.links().forEach((lk) => links.push(lk)); });
              const link = (s, t) => { const mx = (s.sx + t.sx) / 2; return `M${s.sx},${s.sy}C${mx},${s.sy} ${mx},${t.sy} ${t.sx},${t.sy}`; };
              const xs = [0, ...nodes.map((n) => n.sx)], ys = [0, ...nodes.map((n) => n.sy)];
              const minX = Math.min(...xs) - 140, maxX = Math.max(...xs) + 140, minY = Math.min(...ys) - 30, maxY = Math.max(...ys) + 30;
              el.innerHTML = "";
              const svg = d3.select(el).append("svg").attr("viewBox", [minX, minY, maxX - minX, maxY - minY]).attr("width", "100%").style("max-width", "1000px").style("height", "auto").style("font-family", "Inter, Noto Sans TC, sans-serif").style("font-size", "16px");
              svg.append("g").attr("fill", "none").attr("stroke-opacity", 0.85).attr("stroke-width", 2)
                .selectAll("path").data(links).join("path").attr("stroke", (d) => d.target.depth === 1 ? "#cbd5e1" : colorOf(d.target)).attr("d", (d) => link(d.source, d.target));
              const ng = svg.append("g").selectAll("g").data(nodes).join("g").attr("transform", (n) => `translate(${n.sx},${n.sy})`);
              ng.append("circle").attr("r", (n) => n.depth === 1 ? 5 : 3.5).attr("fill", colorOf).attr("stroke", "#fff").attr("stroke-width", 1.5);
              ng.append("text").attr("dy", "0.31em").attr("x", (n) => n.sx >= 0 ? 9 : -9).attr("text-anchor", (n) => n.sx >= 0 ? "start" : "end").attr("fill", "#334155").style("font-weight", (n) => n.depth === 1 ? "700" : "500").text((n) => n.data.content).clone(true).lower().attr("stroke", "#fff").attr("stroke-width", 3.5).attr("stroke-linejoin", "round");
              const rootText = String(data.content), rw = rootText.length * 15 + 28;
              const rg = svg.append("g");
              rg.append("rect").attr("x", -rw / 2).attr("y", -16).attr("width", rw).attr("height", 32).attr("rx", 16).attr("fill", accent);
              rg.append("text").attr("text-anchor", "middle").attr("dy", "0.32em").attr("fill", "#fff").style("font-weight", "800").text(rootText);
              el.dataset.done = "1";
              return;
            } catch (e) { console.warn("radial", e); }
          }
          if (mermaidReady && spec.def) { try { const r = await mermaid.render(elId + "Svg", spec.def); el.innerHTML = r.svg; el.dataset.done = "1"; return; } catch (e) { console.warn("mermaid fallback", e); } }
          el.innerHTML = '<p class="text-sm text-muted text-center py-6">心智圖載入失敗</p>'; return;
        }
        if (!mermaidReady) { el.innerHTML = '<p class="text-sm text-muted text-center py-6">圖表元件未載入</p>'; return; }
        try { const { svg } = await mermaid.render(elId + "Svg", spec.def); el.innerHTML = svg; el.dataset.done = "1"; }
        catch (e) { el.innerHTML = '<p class="text-sm text-muted text-center py-6">圖表載入失敗</p>'; console.warn("mermaid", elId, e, spec.def); }
      }
      function echart(elId, option) {
        const el = document.getElementById(elId); if (!el || el.dataset.done || !window.echarts) return;
        const c = echarts.init(el); c.setOption(option); el.dataset.done = "1"; charts.push(c);
      }
      window.addEventListener("resize", () => charts.forEach((c) => c.resize()));

      function renderBenefitCharts() {
        // paired bar: per-row normalised so mixed units stay comparable; labels show real values
        const cats = kpis.map((k) => k.label);
        const rowMax = kpis.map((k) => Math.max(k.before, k.after) || 1);
        const beforeN = kpis.map((k, i) => +(k.before / rowMax[i] * 100).toFixed(1));
        const afterN = kpis.map((k, i) => +(k.after / rowMax[i] * 100).toFixed(1));
        echart("benefitBar", {
          grid: { left: 4, right: 60, top: 34, bottom: 4, containLabel: true },
          legend: { data: ["改善前", "改善後"], top: 2, itemWidth: 12, itemHeight: 12, textStyle: { fontSize: 12 } },
          tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, formatter: (ps) => { const i = ps[0].dataIndex; return `${cats[i]}<br/>改善前：<b>${kpis[i].before}${kpis[i].unit}</b><br/>改善後：<b>${kpis[i].after}${kpis[i].unit}</b>`; } },
          xAxis: { type: "value", max: 100, show: false },
          yAxis: { type: "category", data: cats, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { fontSize: 12, color: "#334155" } },
          series: [
            { name: "改善前", type: "bar", barGap: "-10%", data: kpis.map((k, i) => ({ value: beforeN[i], real: k.before + k.unit })), itemStyle: { color: "#cbd5e1", borderRadius: 4 }, label: { show: true, position: "right", fontSize: 11, color: "#94a3b8", formatter: (p) => p.data.real } },
            { name: "改善後", type: "bar", data: kpis.map((k, i) => ({ value: afterN[i], real: k.after + k.unit })), itemStyle: { color: accent, borderRadius: 4 }, label: { show: true, position: "right", fontSize: 12, fontWeight: "bold", color: accent, formatter: (p) => p.data.real } },
          ],
        });
      }

      // ---- tabs ----
      const tabBar = document.getElementById("tabBar");
      const panels = [...document.querySelectorAll(".tab-panel")];
      const buttons = [...tabBar.querySelectorAll(".tab-btn")];
      function activate(name) {
        buttons.forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
        panels.forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
        if (name === "features") drawDiagram("archDiagram", moduleSpec);
        if (name === "benefits") { renderBenefitCharts(); requestAnimationFrame(() => charts.forEach((c) => c.resize())); }
        if (name === "demo") { const f = document.getElementById("demoFrame"); if (f && !f.src && f.dataset.src) f.src = f.dataset.src; }
        if (name === "flow") { requestAnimationFrame(scaleFlowEmbed); }
        requestAnimationFrame(scaleHeroEmbed);
      }
      tabBar.addEventListener("click", (e) => { const b = e.target.closest(".tab-btn"); if (b) activate(b.dataset.tab); });

      // interactive flow: render first stage, swap detail on click
      const flowStepsEl = document.getElementById("flowSteps");
      const flowDetailEl = document.getElementById("flowDetail");
      function showStage(i) {
        if (!flowDetailEl) return;
        flowDetailEl.innerHTML = flowDetailHtml(i);
        [...flowStepsEl.querySelectorAll(".flow-step[data-step]")].forEach((b) => b.classList.toggle("active", b.dataset.step === String(i)));
        requestAnimationFrame(scaleFlowEmbed);
      }
      if (flowStepsEl && flowDetailEl) {
        showStage(0);
        flowStepsEl.addEventListener("click", (e) => { const b = e.target.closest(".flow-step[data-step]"); if (b) showStage(Number(b.dataset.step)); });
      }
    })();
  </script>
</body>
</html>
