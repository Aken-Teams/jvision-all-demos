<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 詳細 · 專案 Agents — JVision</title>
  <meta name="description" content="認識單一 Agent 的能力、觸發輸入、產出範例、協作關係與適用專案。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" /></noscript></noscript>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" /></noscript></noscript>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6", accent:"#d97706", violet:"#7c3aed", success:"#16a34a", amber:"#d97706", idle:"#94a3b8" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1280px' },
    } } };
  </script>
  <style>
    /* Tailwind 的 display 工具類是作者樣式，會壓過瀏覽器內建的 [hidden]{display:none}——
       同時掛 hidden 與 inline-flex 的元素因此一直看得見（引擎警示、後臺入口都中過）。
       宣告在這裡，hidden 這個屬性在整站才真的有效。 */
    [hidden] { display: none !important; }
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
    .eyebrow { font-family: Inter, monospace; letter-spacing: .18em; }
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .navlink { position: relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after, .navlink.is-active::after { transform:scaleX(1); transform-origin:left; }
    .dot-grid { background-image: radial-gradient(#dbe4f5 1px, transparent 1px); background-size: 16px 16px; }
    .orch-link { stroke:#cbd5e1; }
    .orch-link.active { stroke:#7c3aed; }

    /* ===== 手機版（<768px）===== */
    @media (max-width: 767px) {
      body { overflow-x: hidden; }
      /* 內距與區塊間距收斂（用 id 選擇器蓋過 Tailwind 的 px-6/py-8/space-y-8） */
      #pfShell { padding-left: 1rem; padding-right: 1rem; padding-top: 1.25rem; padding-bottom: 1.75rem; }
      #pfShell > * + * { margin-top: 1.25rem; }
      /* hero 卡：頭像縮小、文字接著排 */
      #pfHero { padding: 1.25rem; gap: 1rem; }
      #pfHero .pf-avatar { width: 4.5rem; height: 4.5rem; }
      #pfName { font-size: 1.375rem; }
      /* KPI：兩欄、數字別佔太高 */
      #pfKpis { gap: .625rem; }
      #pfKpis > div { padding: .75rem .875rem; }
      #pfKpis .pf-kpi-v { font-size: 1.5rem; }
      /* 短標籤用兩欄比較不浪費空間 */
      #pfCaps, #pfMates { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #pfMates > * { min-width: 0; }
      /* 協作圖：角落節點需要多一點高度才不會擠在一起 */
      #pfGraphBox { height: 14rem; }
      #pfShell section > h3, #pfShell > section h3 { font-size: 1.0625rem; }
    }
  </style>
</head>
<body class="bg-white text-body antialiased" data-page="agent-profile">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" /></a>
      <div class="flex items-center gap-8">
        <a href="./catalog.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./agents.html" class="navlink is-active text-sm font-bold text-brand transition-colors">專案 Agents</a>
      </div>
    </nav>
  </header>

  <main class="relative dot-grid min-h-screen">
    <div class="absolute inset-0 pointer-events-none" style="background:linear-gradient(180deg,#ffffff,#f7faff);"></div>
    <div id="pfShell" class="relative max-w-shell mx-auto px-6 py-8 space-y-8">

      <a href="./agents.html" class="inline-flex items-center gap-1 text-sm font-bold text-muted hover:text-brand transition-colors"><span class="material-symbols-outlined text-[18px]">arrow_back</span> 回 Agent 團隊</a>

      <!-- HERO CARD -->
      <section id="pfHero" class="bg-white border border-line rounded-2xl p-6 shadow-[0_10px_30px_rgba(15,30,70,.05)] flex flex-col md:flex-row items-start md:items-center gap-6">
        <div class="relative shrink-0">
          <div class="pf-avatar w-24 h-24 rounded-full p-1 bg-white ring-2 ring-violet ring-offset-2 ring-offset-white">
            <div id="pfAvatar" class="w-full h-full rounded-full bg-soft grid place-content-center text-brand"></div>
          </div>
          <div id="pfStatusDot" class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-idle border-2 border-white"></div>
        </div>
        <div class="flex-1 space-y-1.5">
          <span id="pfSquad" class="inline-block px-2 py-1 rounded bg-violet/10 text-violet eyebrow text-[11px] font-bold uppercase">—</span>
          <h1 id="pfName" class="text-2xl font-black text-ink">—</h1>
          <p id="pfTagline" class="text-body text-[14px] max-w-2xl leading-relaxed">—</p>
        </div>
      </section>

      <!-- KPI ROW -->
      <section id="pfKpis" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white border border-line rounded-xl p-4"><div class="eyebrow text-[11px] font-bold text-muted uppercase">協助任務</div><div id="pfKpiTasks" class="pf-kpi-v text-3xl font-black text-ink mt-1">—</div></div>
        <div class="bg-white border border-line rounded-xl p-4"><div class="eyebrow text-[11px] font-bold text-muted uppercase">推薦命中率</div><div id="pfKpiHit" class="pf-kpi-v text-3xl font-black text-success mt-1">—</div></div>
        <div class="bg-white border border-line rounded-xl p-4"><div class="eyebrow text-[11px] font-bold text-muted uppercase">平均回應</div><div id="pfKpiResp" class="pf-kpi-v text-3xl font-black text-ink mt-1">—</div></div>
        <div class="bg-white border border-line rounded-xl p-4"><div class="eyebrow text-[11px] font-bold text-muted uppercase">常協作 Agents</div><div id="pfKpiCollab" class="pf-kpi-v text-3xl font-black text-ink mt-1">—</div></div>
      </section>

      <!-- TWO COLUMN -->
      <section class="flex flex-col lg:flex-row gap-6">
        <!-- LEFT -->
        <div class="w-full lg:w-[62%] space-y-6">
          <div>
            <h3 class="text-lg font-black text-ink border-b border-line pb-2 mb-4">技能 Skills</h3>
            <div id="pfCaps" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
          </div>
          <div>
            <h3 class="text-lg font-black text-ink border-b border-line pb-2 mb-1">運作範例 How it works</h3>
            <p class="text-[13px] text-muted mb-4">給它一句話，看它怎麼一步步做出成果。</p>
            <div id="pfExample" class="bg-white border border-line rounded-2xl p-5"></div>
          </div>
        </div>
        <!-- RIGHT -->
        <div class="w-full lg:w-[38%] space-y-6">
          <!-- collaboration graph -->
          <div class="bg-white border border-line rounded-2xl p-5">
            <h3 class="eyebrow text-[11px] font-bold text-muted uppercase mb-4">協作關係 Collaboration</h3>
            <div id="pfGraphBox" class="relative h-48 rounded-xl border border-line bg-soft overflow-hidden dot-grid">
              <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path class="orch-link" d="M50 50 Q 22 22 22 22" fill="none" stroke-width="1.5"/>
                <path class="orch-link" d="M50 50 Q 78 22 78 22" fill="none" stroke-width="1.5"/>
                <path class="orch-link" d="M50 50 Q 22 78 22 78" fill="none" stroke-width="1.5"/>
                <path class="orch-link" d="M50 50 Q 78 78 78 78" fill="none" stroke-width="1.5"/>
              </svg>
              <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center z-10">
                <div id="pfGraphSelfRing" class="w-11 h-11 rounded-full bg-white ring-2 ring-violet/50 grid place-content-center mx-auto shadow-sm"><span id="pfGraphSelfIcon" class="material-symbols-outlined text-[22px] text-violet">hub</span></div>
                <span class="eyebrow text-[9px] font-bold text-ink" id="pfGraphSelf">本 Agent</span>
              </div>
              <div id="pfGraphNodes" class="absolute inset-0"></div>
            </div>
            <p class="text-[12px] text-muted mt-3">中間是這位 Agent，四周是常一起協作的夥伴；線上的標籤代表交接關係（接收指派 / 交叉驗證 / 交棒協作）。</p>
          </div>
          <!-- applicable projects -->
          <div class="bg-white border border-line rounded-2xl p-5">
            <h3 class="eyebrow text-[11px] font-bold text-muted uppercase mb-4">適用專案</h3>
            <div id="pfProjects" class="flex flex-wrap gap-2"></div>
          </div>
          <!-- execution log（暫時隱藏：避免客戶誤會「有呼叫卻沒紀錄」） -->
          <div class="bg-white border border-line rounded-2xl p-5" hidden>
            <h3 class="eyebrow text-[11px] font-bold text-muted uppercase mb-4">執行紀錄 Recent Activity</h3>
            <div id="pfActivity"></div>
          </div>
        </div>
      </section>

      <!-- teammates -->
      <section class="border-t border-line pt-8">
        <h3 class="text-lg font-black text-ink mb-4">同隊成員</h3>
        <div id="pfMates" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </section>
    </div>
  </main>

  <footer class="border-t border-line bg-white mt-auto">
    <div class="max-w-6xl mx-auto px-6 py-5 text-center text-sm text-muted">© 2026 JVision</div>
  </footer>

  <script src="./agents.generated.js"></script>
  <script src="./agents.js"></script>
  <script src="./shared/hub-nav.js"></script>
  <script src="./shared/jv-mobile-nav.js"></script>
</body>
</html>
