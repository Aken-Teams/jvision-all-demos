<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任務指揮中心 · 專案 Agents — JVision</title>
  <meta name="description" content="一句話交給團隊，看它跑完流程並交出真實成果（完成任務 / 呈現報表 / 產生報告）。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6", accent:"#d97706", violet:"#7c3aed", success:"#16a34a", amber:"#d97706", idle:"#94a3b8" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1280px' },
    } } };
  </script>
  <style>
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .eyebrow { font-family: Inter, monospace; letter-spacing:.16em; }
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .navlink { position:relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after, .navlink.is-active::after { transform:scaleX(1); transform-origin:left; }
    .scroll-thin::-webkit-scrollbar { width:5px; } .scroll-thin::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
    .log-item, .done-item { opacity:0; transform:translateY(6px); animation:fadeUp .4s ease forwards; }
    @keyframes fadeUp { to { opacity:1; transform:none; } }
    .log-item.show { opacity:1; transform:none; }
    #runProgressBar { transition: width .6s cubic-bezier(.2,.7,.2,1); }
  </style>
</head>
<body class="text-body antialiased">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" /></a>
      <div class="flex items-center gap-8">
        <a href="./catalog.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./agents.html" class="navlink is-active text-sm font-bold text-brand transition-colors">專案 Agents</a>
      </div>
    </nav>
  </header>

  <main class="max-w-shell mx-auto px-6 py-6 space-y-6">

    <!-- case switcher -->
    <div class="flex flex-wrap items-center gap-2">
      <span class="eyebrow text-[11px] font-bold text-muted uppercase mr-1">選擇情境</span>
      <div id="caseTabs" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Ask -->
    <section class="bg-white border border-line rounded-2xl p-6 shadow-sm">
      <span id="missCode" class="eyebrow text-[11px] font-bold text-muted uppercase">MISSION CONTROL</span>
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mt-2">
        <div class="max-w-2xl">
          <p class="text-[11px] font-bold text-violet mb-2">你只需要問一句話</p>
          <div id="modeTabs" class="inline-flex gap-1 bg-soft border border-line rounded-xl p-1 mb-3">
            <button data-mode="task" class="mode-tab px-3 py-1.5 rounded-lg text-[13px] font-bold bg-brand text-white">完成任務</button>
            <button data-mode="report" class="mode-tab px-3 py-1.5 rounded-lg text-[13px] font-bold text-body hover:bg-white">數據報告</button>
            <button data-mode="doc" class="mode-tab px-3 py-1.5 rounded-lg text-[13px] font-bold text-body hover:bg-white">產出文件</button>
          </div>
          <div class="flex items-center gap-2">
            <input id="missInput" class="flex-1 h-11 px-4 rounded-xl border border-line bg-white text-[14px] text-ink focus:outline-none focus:border-brand2" placeholder="描述你的目標，例如：幫我把今天的訂單排成生產工單並派工" />
            <button id="missRun" class="h-11 px-5 rounded-xl bg-brand text-white text-sm font-bold hover:bg-brand2 transition-colors shadow-sm inline-flex items-center gap-1.5 shrink-0"><span class="material-symbols-outlined text-[18px]">bolt</span> 啟動</button>
          </div>
          <p id="demoQuestion" class="sr-only">—</p>
          <h1 id="missObjective" class="sr-only">—</h1>
          <p class="text-sm text-muted mt-3 flex items-center gap-1.5"><span class="material-symbols-outlined text-[18px] text-violet">bolt</span> 團隊收到後自動分工、真的呼叫 Agent 跑完流程並交出成果（內部數據擬真、外部資料真查）。</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
          <div class="flex gap-1 border border-line rounded-xl p-2 bg-white shadow-sm">
            <div class="px-3 border-r border-line"><div class="text-[11px] text-muted font-semibold">參與 Agents</div><div id="statAgents" class="text-lg font-black text-ink">—</div></div>
            <div class="px-3 border-r border-line"><div class="text-[11px] text-muted font-semibold">流程步驟</div><div id="statSteps" class="text-lg font-black text-ink">—</div></div>
            <div class="px-3"><div class="text-[11px] text-muted font-semibold">完成項目</div><div id="statDone" class="text-lg font-black text-ink">—</div></div>
          </div>
          <button id="replayBtn" class="inline-flex items-center gap-1.5 h-10 px-4 rounded-xl bg-brand text-white text-sm font-bold hover:bg-brand2 transition-colors shadow-sm"><span class="material-symbols-outlined text-[18px]">replay</span> 重新播放</button>
        </div>
      </div>
    </section>

    <!-- Run: AI 對話 (左) × 即時長出資料的實際網頁 (右) -->
    <section class="bg-white border border-line rounded-2xl shadow-sm overflow-hidden">
      <div class="p-5 border-b border-line">
        <div class="flex items-center justify-between gap-3 mb-3">
          <h2 class="text-base font-black text-ink flex items-center gap-2"><span class="material-symbols-outlined text-brand">smart_toy</span> AI 團隊即時操作系統</h2>
          <div class="flex items-center gap-3"><span id="runStatus" class="text-sm font-bold text-brand">協作中</span><span id="runPct" class="text-sm font-black text-ink w-10 text-right">0%</span></div>
        </div>
        <div class="w-full bg-line rounded-full h-2 overflow-hidden"><div id="runProgressBar" class="bg-brand h-2 rounded-full" style="width:0%"></div></div>
        <div id="runAgents" class="flex flex-wrap gap-2 mt-4"></div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-12 divide-y xl:divide-y-0 xl:divide-x divide-line">
        <!-- LEFT: AI 對話 + 完成項目 + 小交付成果 -->
        <div class="xl:col-span-4 p-5 flex flex-col">
          <h3 class="text-[13px] font-black text-muted uppercase eyebrow mb-3 flex items-center justify-between">AI 對話 <span id="logHint" class="text-[11px] font-semibold normal-case tracking-normal text-violet"></span></h3>
          <div id="logFeed" class="h-[300px] overflow-y-auto scroll-thin flex flex-col gap-3 pr-1"></div>
          <h3 class="text-[13px] font-black text-muted uppercase eyebrow mt-5 mb-2">完成項目</h3>
          <div id="doneList" class="flex flex-col gap-1.5"></div>
          <div id="summaryList" class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-line"></div>
        </div>
        <!-- RIGHT: live webpage -->
        <div class="xl:col-span-8 p-4 bg-soft/40">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="inline-flex items-center gap-1 text-[11px] font-bold text-violet bg-violet/10 rounded-full px-2 py-0.5 shrink-0"><span class="material-symbols-outlined text-[13px]">desktop_windows</span> <span id="resultKind">實際系統</span></span>
              <h2 id="resultTitle" class="text-sm font-black text-ink truncate">—</h2>
            </div>
            <a id="resultOpen" href="#" target="_blank" rel="noreferrer" class="shrink-0 inline-flex items-center gap-1 text-[12px] font-bold text-brand hover:text-brand2"><span class="material-symbols-outlined text-[15px]">open_in_new</span> 新分頁</a>
          </div>
          <div class="rounded-xl border border-line overflow-hidden shadow-sm bg-white">
            <div class="bg-soft px-3 py-1.5 flex items-center gap-2 border-b border-line">
              <span class="w-2.5 h-2.5 rounded-full bg-[#ff5f57]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#febc2e]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#28c840]"></span>
              <span class="ml-1 text-[10px] text-muted bg-white border border-line rounded px-2 py-0.5">app.jvision.demo</span>
              <span id="frameLive" class="ml-auto text-[10px] font-bold text-muted inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-idle"></span> 待機</span>
            </div>
            <iframe id="resultFrame" title="實際成果畫面" class="w-full bg-white block" style="height:620px;border:0"></iframe>
          </div>
          <p id="resultDesc" class="text-[12px] text-muted mt-2">—</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-line bg-white mt-auto">
    <div class="max-w-6xl mx-auto px-6 py-5 text-center text-sm text-muted">© 2026 JVision</div>
  </footer>

  <script src="./agents.generated.js"></script>
  <script src="./agents.js"></script>
  <script src="./agents-missions.js"></script>
  <script src="./agents-mission-live.js"></script>
  <script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var mode = "task";
    // 清掉舊的罐頭 demo 內容，改為即時
    var rb = $("#replayBtn"); if (rb) rb.style.display = "none";
    ["#logFeed", "#doneList", "#runAgents", "#summaryList"].forEach(function (s) { if ($(s)) $(s).innerHTML = ""; });
    // 範例情境 → 填入輸入框
    var EXAMPLES = {
      task: ["幫我把今天進來的訂單排成生產工單並派工", "幫我盤點本週採購缺料並排出補貨優先序"],
      report: ["分析我上季的品質良率與客訴趨勢", "幫我看這個月的設備稼動與故障狀況"],
      doc: ["幫我寫一份導入智慧排程的評估報告", "幫我產出這季 ESG 碳盤查摘要文件"]
    };
    function fillExamples() {
      var host = $("#caseTabs"); if (!host) return;
      host.innerHTML = (EXAMPLES[mode] || []).map(function (q) {
        return '<button class="ex-chip px-3 py-1.5 rounded-full border border-line bg-white text-[12px] font-semibold text-body hover:border-brand2 hover:text-brand">' + q + '</button>';
      }).join("");
      host.querySelectorAll(".ex-chip").forEach(function (b) {
        b.addEventListener("click", function () { $("#missInput").value = b.textContent; $("#missInput").focus(); });
      });
    }
    // 模式頁籤
    document.querySelectorAll("#modeTabs .mode-tab").forEach(function (t) {
      t.addEventListener("click", function () {
        mode = t.getAttribute("data-mode");
        document.querySelectorAll("#modeTabs .mode-tab").forEach(function (x) {
          var on = x === t;
          x.className = "mode-tab px-3 py-1.5 rounded-lg text-[13px] font-bold " + (on ? "bg-brand text-white" : "text-body hover:bg-white");
        });
        if (window.JVMission) window.JVMission.setMode(mode);
        fillExamples();
      });
    });
    function go() {
      var q = ($("#missInput").value || "").trim();
      if (!q || !window.JVMission) return;
      window.JVMission.run(q, mode);
    }
    if ($("#missRun")) $("#missRun").addEventListener("click", go);
    if ($("#missInput")) $("#missInput").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    function setMode(m) {
      mode = m;
      document.querySelectorAll("#modeTabs .mode-tab").forEach(function (x) {
        var on = x.getAttribute("data-mode") === m;
        x.className = "mode-tab px-3 py-1.5 rounded-lg text-[13px] font-bold " + (on ? "bg-brand text-white" : "text-body hover:bg-white");
      });
      if (window.JVMission) window.JVMission.setMode(m);
    }
    // 從 /agents 帶過來的需求：讀 ?q & ?mode，預填並自動開跑
    var sp = new URLSearchParams(location.search);
    var q = sp.get("q"), m = sp.get("mode");
    if (m && EXAMPLES[m]) setMode(m);
    fillExamples();
    // 隱藏罐頭 demo 的 iframe（即時面板會取代）
    var ifr = $("#resultFrame"); if (ifr) ifr.style.display = "none";
    if ($("#missCode")) $("#missCode").textContent = "MISSION CONTROL · 即時協作 · " + ({task:"完成任務",report:"數據報告",doc:"產出文件"}[mode] || "完成任務");
    if (q) {
      $("#missInput").value = q;
      // 等 live runtime 載入後自動開跑
      var tries = 0;
      (function auto() {
        if (window.JVMission) { window.JVMission.run(q, mode); }
        else if (tries++ < 40) { setTimeout(auto, 100); }
      })();
    }
  })();
  </script>
</body>
</html>
