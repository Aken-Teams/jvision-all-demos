<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人設定 ｜ JVision DEMO</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1360px' },
    } } };
  </script>
  <style>
    /* Tailwind 的 display 工具類是作者樣式，會壓過瀏覽器內建的 [hidden]{display:none}。 */
    [hidden] { display: none !important; }
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:1rem; }
    .lbl { font-size:.78rem; font-weight:800; color:#475569; }
    .inp { width:100%; border:1px solid #e2e8f0; border-radius:.6rem; padding:.55rem .75rem; font-size:.88rem; color:#0f1e46; }
    .inp:focus { outline:2px solid #3b82f6; outline-offset:-1px; border-color:#3b82f6; }
    .inp[readonly] { background:#f8fafc; color:#64748b; }
    .btn { display:inline-flex; align-items:center; gap:.4rem; height:38px; padding:0 1rem; border-radius:.6rem; font-size:.85rem; font-weight:800; cursor:pointer; border:1px solid transparent; }
    .btn-primary { background:#1e40af; color:#fff; }
    .btn-primary:hover { background:#3b82f6; }
    .btn-ghost { border-color:#e2e8f0; background:#fff; color:#0f1e46; }
    .btn-ghost:hover { border-color:#1e40af; color:#1e40af; }
    /* 不能改的值。刻意不長得像輸入框——沒有邊框、底色更淡。 */
    .ro { padding:.55rem .75rem; border-radius:.6rem; background:#f8fafc;
          color:#475569; font-size:.9rem; word-break:break-all; }
    /* 用量兩欄。用 grid 讓「標題／量表／說明」三列各自對齊，
       而不是兩欄各自堆疊——那樣左邊少一塊右邊就會歪。 */
    .usage { display:grid; grid-template-columns:1fr; gap:.4rem 1.5rem; }
    .usage .u-hd { display:flex; align-items:baseline; justify-content:space-between; }
    .usage > p { margin:0; }
    @media (min-width:640px) {
      .usage { grid-template-columns:1fr 1fr; grid-auto-flow:row; }
      /* 三列各兩欄，順序就是 DOM 的順序 */
    }
    .bar { height:8px; border-radius:9999px; background:#eef2f7; overflow:hidden; }
    .bar > i { display:block; height:100%; border-radius:9999px; background:linear-gradient(90deg,#1e40af,#7c3aed); }
  </style>
</head>
<body class="text-body">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line">
    <!-- 導覽跟其他頁一致：同一組連結、同樣的間距、許願池同樣是漸層膠囊，
         而且載 hub-nav.js 讓「專案目錄／專案 Agents」有大選單。
         這一頁原本少了「專案 Agents」也沒載 hub-nav，從別頁切過來會看到
         整條導覽跳一下、少一個入口。 -->
    <nav class="max-w-shell mx-auto h-16 px-4 sm:px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-8 md:h-9 w-auto" /></a>
      <div class="flex items-center gap-5 sm:gap-8">
        <a href="./catalog.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./agents.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案 Agents</a>
        <a href="./wish.html" class="hidden sm:inline-flex items-center gap-1.5 h-9 px-3.5 rounded-full text-white text-sm font-black hover:opacity-90 transition shadow-sm" style="background-image:linear-gradient(90deg,#1e40af,#7c3aed)"><span class="material-symbols-outlined text-[18px]">auto_awesome</span> AI 許願池</a>
      </div>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-black text-ink mb-1.5">個人設定</h1>
    <p class="text-sm text-muted mb-8">你的名字、公司、誰能進你的系統，以及目前用掉多少資源。</p>

    <!-- 沒登入 -->
    <section id="guest" hidden class="card p-10 text-center">
      <span class="material-symbols-outlined text-[44px] text-muted">account_circle</span>
      <p class="mt-3 text-ink font-bold">請先登入</p>
      <p class="text-sm text-muted mt-1 mb-5">個人設定需要知道你是誰。</p>
      <a id="loginLink" href="#" class="btn btn-primary">用 Google 登入</a>
    </section>

    <div id="panes" hidden class="space-y-6">
      <!-- 個人資料 -->
      <section class="card p-6">
        <h2 class="text-base font-black text-ink mb-4">個人資料</h2>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="lbl" for="displayName">顯示名稱</label>
            <input id="displayName" class="inp mt-1.5" maxlength="60" placeholder="留白就用 Google 帳號上的名字" />
            <p id="nameHint" class="text-xs text-muted mt-1.5"></p>
          </div>
          <div>
            <!-- 信箱不是輸入框。它原本是 readonly 的 <input>，長得跟旁邊可以改的
                 那些一模一樣，使用者會先點進去、打字、發現沒反應，才推論出它不能改。
                 直接畫成一個值，就不會有那一步。 -->
            <span class="lbl">信箱</span>
            <p id="email" class="ro mt-1.5">—</p>
            <p class="text-xs text-muted mt-1.5">登入身分就是信箱，不能修改。</p>
          </div>
          <div id="companyWrap" hidden class="sm:col-span-2">
            <label class="lbl" for="company">公司名稱</label>
            <input id="company" class="inp mt-1.5" maxlength="120" />
            <!-- 這裡原本寫「會出現在你系統的網址上」，那是錯的：網址用的是
                 slug，而 slug 只在開通公司帳戶的當下從名稱推導一次，之後改名
                 不會動到任何一個既有或未來的網址。照實說，並把真正在用的那一段
                 顯示出來——使用者才對得起來自己看到的網址。 -->
            <p id="companyHint" class="text-xs text-muted mt-1.5"></p>
          </div>
        </div>
        <!-- 按鈕一律靠右。三張卡的內容高度不一樣，動作靠左的話每張卡的按鈕
             都落在不同位置；靠右則是固定的一個角落，眼睛不用重新找。
             訊息放左邊填空白，不要讓它把按鈕推走。 -->
        <div class="flex items-center gap-3 mt-5 pt-4 border-t border-line">
          <span id="profileMsg" class="text-sm font-bold flex-1"></span>
          <button id="saveProfile" type="button" class="btn btn-primary shrink-0"><span class="material-symbols-outlined text-[18px]">save</span>儲存</button>
        </div>
      </section>

      <!-- 用量 -->
      <section class="card p-6">
        <h2 class="text-base font-black text-ink mb-1">目前用量</h2>
        <p class="text-xs text-muted mb-5">AI 分析用掉的 token，以及你的系統佔用的空間。</p>
        <!-- 兩欄用 grid 的列對齊：標題一列、量表一列、說明一列。
             各自堆疊的話，左邊沒有量表時說明就會往上跑，兩欄的文字對不齊。 -->
        <div class="usage">
          <div class="u-hd">
            <span class="lbl">這個月的 token</span>
            <span id="tokMonth" class="text-lg font-black text-ink">—</span>
          </div>
          <div class="u-hd">
            <span class="lbl">佔用空間</span>
            <span id="spTotal" class="text-lg font-black text-ink">—</span>
          </div>
          <!-- 沒用過的時候量表是空的，但格子留著——不然右邊那欄的說明會比
               左邊低一截。 -->
          <div><div id="tokBarWrap" class="bar" hidden><i id="tokBar" style="width:0%"></i></div></div>
          <div><div class="bar"><i id="spBar" style="width:0%"></i></div></div>
          <p id="tokNote" class="text-xs text-muted"></p>
          <p id="spNote" class="text-xs text-muted"></p>
        </div>
      </section>

      <!-- 使用名單 -->
      <section id="membersCard" hidden class="card p-6">
        <!-- 標題帶上公司名稱。這份名單本來就是公司層級的（一次加人，他看得到
             你名下所有系統），寫出公司名字才說得清楚範圍有多大。
             順帶讓「公司名稱」那個欄位有實際用途——在這之前它全站只有個人設定
             自己讀得到，改了什麼都不會發生。 -->
        <h2 id="membersTitle" class="text-base font-black text-ink mb-1">誰能進我的系統</h2>
        <p class="text-xs text-muted mb-5">名單上的 Google 帳號，進得去你名下<b class="text-ink">所有</b>的系統，不只某一套。同事離職就把他移除。</p>
        <div id="memberList" class="divide-y divide-line border border-line rounded-xl overflow-hidden mb-4"></div>
        <div class="flex gap-2">
          <input id="newMember" class="inp" type="email" placeholder="同事的 Google 信箱" />
          <button id="addMember" type="button" class="btn btn-primary shrink-0"><span class="material-symbols-outlined text-[18px]">person_add</span>加入</button>
        </div>
        <p id="memberMsg" class="text-sm font-bold mt-3 text-right"></p>
      </section>

      <!-- 「我的系統」那一整塊拿掉了。
           它跟工作台重複：同一份清單在 workspace.html 的總覽就有，而分享／交付
           那幾顆按鈕在工作台的「交付」那一頁做得更完整（有分支選擇、有使用名單、
           有狀態）。兩個入口做同一件事的代價是只會有一邊被維護——這裡的
           「開一個 PR」就是活生生的例子：工作台早就把那顆換成「選分支推上去」，
           這裡還留著一顆按下去不會開成 PR 的按鈕。
           個人設定只留「我是誰」與「誰進得去」。 -->
    </div>
  </main>

  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); };

    /* 位元組要給人看。到 GB 才用一位小數——KB/MB 級距下的小數點沒有意義。 */
    function bytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + " B";
      if (n < 1048576) return Math.round(n / 1024) + " KB";
      if (n < 1073741824) return Math.round(n / 1048576) + " MB";
      return (n / 1073741824).toFixed(1) + " GB";
    }
    function num(n) { return (Number(n) || 0).toLocaleString("en-US"); }

    function msg(el, text, ok) {
      el.textContent = text;
      el.style.color = ok ? "#15803d" : "#b91c1c";
      if (ok) setTimeout(function () { if (el.textContent === text) el.textContent = ""; }, 3000);
    }

    /* ── 個人資料 ── */
    var profile = null;
    function loadProfile() {
      return fetch("/api/me/profile", { cache: "no-store" }).then(function (r) {
        if (r.status === 401) { showGuest(); return null; }
        return r.json();
      }).then(function (d) {
        if (!d) return;
        profile = d;
        $("panes").hidden = false;
        $("email").textContent = d.email;
        $("displayName").value = d.displayName || "";
        $("nameHint").textContent = d.googleName ? "Google 帳號上的名字是「" + d.googleName + "」。" : "";
        if (d.isOwner) {
          $("companyWrap").hidden = false;
          $("company").value = d.company || "";
          /* 網址那一段是開通當下定下來的，改名不會動到它。把它印出來，
             使用者才對得起來自己在網址上看到的那個字。 */
          if (d.company) $("membersTitle").textContent = "誰能進「" + d.company + "」的系統";
          $("companyHint").innerHTML = d.slug
            ? '這是顯示用的名稱。你的系統網址固定用 <b class="text-ink" style="font-family:ui-monospace,monospace">'
              + esc(d.slug) + '</b> 這一段（開通時就定下來了，改名稱不會變）。'
            : "這是顯示用的名稱。";
          $("membersCard").hidden = false;
          loadMembers();
        }
      });
    }

    function showGuest() {
      $("guest").hidden = false;
      $("panes").hidden = true;
      $("loginLink").href = "/api/visitor/google/start?next=" + encodeURIComponent(location.pathname);
    }

    $("saveProfile").addEventListener("click", function () {
      var body = { displayName: $("displayName").value };
      if (profile && profile.isOwner) body.company = $("company").value;
      fetch("/api/me/profile", { method: "PATCH", headers: { "content-type": "application/json" },
        body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          if (!x.ok) return msg($("profileMsg"), x.d.error || "存不起來", false);
          msg($("profileMsg"), "已儲存", true);
          /* 標題用的是公司名稱，改完要當場跟上——不然使用者會以為沒存到。 */
          var co = $("company").value.trim();
          if (profile && profile.isOwner) {
            profile.company = co;
            $("membersTitle").textContent = co ? "誰能進「" + co + "」的系統" : "誰能進我的系統";
          }
          /* 顯示名稱改了，右上角那顆也要跟著改——不然使用者會以為沒存到。 */
          if (window.JVAccount && window.JVAccount.refresh) window.JVAccount.refresh();
        })
        .catch(function () { msg($("profileMsg"), "連不上伺服器", false); });
    });

    /* ── 用量 ── */
    function loadUsage() {
      fetch("/api/me/usage", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) return;
          var t = d.tokens || {}, s = d.storage || {};
          $("tokMonth").textContent = num(t.month);
          /* 沒有配額制度，所以這條不是「用掉幾成」而是相對刻度：
             以 100 萬 token 當滿格，讓人對數量級有感覺。
             真的用過才顯示——0 的時候一條空的量表只會讓人猜它代表什麼。 */
          var used = Number(t.month) > 0;
          $("tokBarWrap").hidden = !used;
          if (used) $("tokBar").style.width = Math.max(2, Math.min(100, (t.month / 1000000) * 100)) + "%";
          $("tokNote").textContent = t.ledger
            ? "累計 " + num(t.total) + " token，共 " + num(t.calls) + " 次分析，成本 US$" + (t.cost || 0).toFixed(4) + "。沒有上限，這裡只是讓你知道用了多少。"
            : "還沒有用過 AI 分析。";
          $("spTotal").textContent = bytes((s.files || 0) + (s.db || 0));
          /* 650KB 對 1GB 是 0.06%，畫出來是看不見的一條線——「有一點」跟
             「完全沒有」長得一樣。有用到就至少給 2%，讓那兩件事分得開。 */
          var pct = ((s.files + s.db) / (1024 * 1024 * 1024)) * 100;
          $("spBar").style.width = (pct > 0 ? Math.max(2, Math.min(100, pct)) : 0) + "%";
          $("spNote").textContent = s.systems
            ? s.systems + " 套系統：畫面檔 " + bytes(s.files) + "、資料 " + bytes(s.db) +
              (s.partial ? "（資料庫用量暫時查不到）" : "") + "。刻度以 1 GB 為滿格。"
            : "還沒有開通的系統。";
        })
        .catch(function () {});
    }

    /* ── 使用名單 ── */
    function drawMembers(list) {
      var box = $("memberList");
      if (!list || !list.length) { box.innerHTML = '<div class="p-3 text-sm text-muted">名單是空的</div>'; return; }
      box.innerHTML = list.map(function (m) {
        var owner = m.role === "owner";
        return '<div class="flex items-center justify-between gap-3 px-3 py-2.5 bg-white">' +
          '<span class="text-sm text-ink">' + esc(m.email) +
            (owner ? ' <span class="text-[11px] font-black text-brand ml-1">擁有者</span>' : "") + "</span>" +
          (owner ? '<span class="text-xs text-muted">不可移除</span>'
                 : '<button type="button" data-rm="' + esc(m.email) + '" class="text-xs font-bold text-red-700 hover:underline">移除</button>') +
          "</div>";
      }).join("");
      box.querySelectorAll("[data-rm]").forEach(function (b) {
        b.addEventListener("click", function () {
          fetch("/api/me/members?email=" + encodeURIComponent(b.dataset.rm), { method: "DELETE" })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (d.members) { drawMembers(d.members); msg($("memberMsg"), "已移除", true); }
                                 else msg($("memberMsg"), d.error || "移除失敗", false); })
            .catch(function () { msg($("memberMsg"), "連不上伺服器", false); });
        });
      });
    }
    function loadMembers() {
      fetch("/api/me/members", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.members) drawMembers(d.members); })
        .catch(function () {});
    }
    $("addMember").addEventListener("click", function () {
      var v = $("newMember").value.trim();
      if (!v) return;
      fetch("/api/me/members", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ email: v }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.members) { drawMembers(d.members); $("newMember").value = ""; msg($("memberMsg"), "已加入", true); }
          else msg($("memberMsg"), d.error || "加不進去", false);
        })
        .catch(function () { msg($("memberMsg"), "連不上伺服器", false); });
    });
    $("newMember").addEventListener("keydown", function (e) { if (e.key === "Enter") $("addMember").click(); });


    loadProfile().then(function () {
      if (!$("panes").hidden) loadUsage();
    });
  })();
  </script>
  <script src="./shared/hub-nav.js"></script>
  <script src="./shared/jv-account.js?v=11" defer></script>
</body>
</html>
