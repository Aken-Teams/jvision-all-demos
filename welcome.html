<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>進入 JV Demo</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#0f2d5c; --brand:#1e40af; --violet:#7c3aed; --muted:#64748b;
         --line:#dbe4f0; --bg:#f3f6fb; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:radial-gradient(1200px 700px at 50% -20%,#e0ecff,var(--bg));
       color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
  .card{width:min(100%,420px);background:#fff;border:1px solid var(--line);
        border-radius:18px;padding:36px 30px;box-shadow:0 24px 60px rgba(15,45,92,.12)}
  .mark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .mark b{background:var(--brand);color:#fff;padding:5px 10px;border-radius:9px;
          font-size:15px;letter-spacing:.5px}
  .mark span{font-size:13.5px;color:var(--muted);letter-spacing:.08em}
  h1{margin:0 0 8px;font-size:23px;line-height:1.45}
  p.sub{margin:0 0 26px;font-size:14px;color:var(--muted);line-height:1.8}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
        padding:13px;border:1px solid #dadce0;border-radius:11px;background:#fff;
        color:#3c4043;font-size:15px;font-weight:500;font-family:inherit;
        cursor:pointer;text-decoration:none}
  .gbtn:hover{background:#f8f9fa}
  .gbtn svg{width:18px;height:18px;flex:none}
  .guest{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
         margin-top:12px;padding:13px;border:0;border-radius:11px;color:#fff;
         font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
         background-image:linear-gradient(90deg,#1e40af,#7c3aed)}
  .guest:disabled{opacity:.6;cursor:progress}
  .divider{display:flex;align-items:center;gap:12px;margin:18px 0;
           font-size:12.5px;color:var(--muted)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .err{margin-top:14px;font-size:13.5px;color:#b42318;min-height:20px;line-height:1.6}
  .foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
        font-size:12.5px;color:var(--muted);line-height:1.8}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><b>JV</b><span>DEMO</span></div>
    <h1>選擇你要用哪個身分瀏覽</h1>
    <p class="sub">站上收錄超過一千五百套企業系統展示。兩種方式看到的內容完全一樣。</p>

    <a class="gbtn" id="gbtn" hidden href="#">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      使用 Google 帳號登入
    </a>
    <div class="divider" id="divider" hidden>或</div>

    <button class="guest" id="guest" type="button">
      <span class="material-symbols-outlined" aria-hidden="true"></span>以訪客身分瀏覽
    </button>

    <div class="err" id="err" role="alert"></div>
    <div class="foot">
      用 Google 登入只是留下聯絡身分，方便後續聯繫，<b>不會</b>取得你的任何檔案或聯絡人。
      訪客身分不記錄個人資料。
    </div>
  </main>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/";
  const err = document.getElementById("err");
  if (params.get("error")) err.textContent = params.get("error");

  /* 只有真的設定好 Google 登入才顯示那顆按鈕，否則按下去只會拿到 503。 */
  fetch("/api/visitor/me").then((r) => r.json()).then((d) => {
    if (d.signedIn) { location.replace(next); return; }
    if (!d.google) return;
    const g = document.getElementById("gbtn");
    g.href = "/api/visitor/google/start?next=" + encodeURIComponent(next);
    g.hidden = false;
    document.getElementById("divider").hidden = false;
  }).catch(() => {});

  const guest = document.getElementById("guest");
  guest.addEventListener("click", async () => {
    guest.disabled = true; err.textContent = "";
    try {
      const r = await fetch("/api/visitor/guest", { method: "POST" });
      if (!r.ok) throw new Error("無法進站，請重試");
      location.replace(next);
    } catch (e) {
      err.textContent = e.message;
      guest.disabled = false;
    }
  });
</script>
</body>
</html>
