<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系統需求單 · JV Demo 管理後台</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" /></noscript></noscript>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --line:#334155; --ink:#e2e8f0;
         --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
         padding:14px 22px;border-bottom:1px solid var(--line);background:#111c33;
         position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700}
  .brand b{background:var(--accent);color:#082f49;padding:3px 8px;border-radius:7px;font-size:13px}
  nav{display:flex;flex-wrap:wrap;gap:8px}
  nav a,nav button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);
       background:transparent;color:var(--ink);font-size:13px;text-decoration:none;
       font-family:inherit;cursor:pointer}
  nav a.on{background:var(--accent);color:#082f49;border-color:transparent;font-weight:700}
  main{padding:22px;max-width:1120px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
  .kpi span{display:block;font-size:12.5px;color:var(--muted)}
  .kpi b{display:block;font-size:26px;margin-top:4px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  select{padding:7px 11px;border-radius:9px;border:1px solid var(--line);
         background:var(--card);color:var(--ink);font-family:inherit;font-size:13.5px}
  .hint{margin-left:auto;font-size:12.5px;color:var(--muted)}
  /* 一張卡片一筆申請。需求文字長短差很多，用表格會被撐得很難讀 */
  .list{display:grid;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
  .tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .s-pending{color:#fbbf24;border-color:#78350f}
  .s-queued{color:#93c5fd;border-color:#1e40af}
  .s-building{color:#c4b5fd;border-color:#4c1d95}
  .s-published{color:#4ade80;border-color:#14532d}
  .s-rejected{color:#f87171;border-color:#7f1d1d}
  .who{font-size:12.5px;color:var(--muted)}
  .when{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .need{background:#0f172a;border:1px solid var(--line);border-radius:9px;padding:12px 14px;
        white-space:pre-wrap;word-break:break-word;line-height:1.8}
  .meta{margin-top:10px;font-size:12.5px;color:var(--muted);word-break:break-all}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .acts button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);
               background:transparent;color:var(--ink);font-family:inherit;font-size:13.5px;cursor:pointer}
  .acts .now{background:var(--accent);color:#082f49;border-color:transparent;font-weight:700}
  .acts button:disabled{opacity:.5;cursor:progress}
  .empty{padding:34px;text-align:center;color:var(--muted);background:var(--card);
         border:1px solid var(--line);border-radius:12px}
  .ost{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .ost-draft{background:rgba(148,163,184,.18);color:var(--muted)}
  .ost-paid{background:rgba(56,189,248,.16);color:var(--accent)}
  .ost-provisioning{background:rgba(251,191,36,.16);color:var(--warn)}
  .ost-delivered{background:rgba(74,222,128,.16);color:var(--ok)}
  .ost-failed{background:rgba(248,113,113,.16);color:var(--bad)}
  .obtn{padding:6px 13px;border-radius:8px;border:1px solid var(--line);background:transparent;
        color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer}
  .obtn:hover{border-color:var(--accent)}
  .obtn.pri{background:var(--accent);color:#082f49;border-color:transparent;font-weight:700}
  .obtn:disabled{opacity:.5;cursor:default}
  footer{padding:18px 22px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:24px}
</style>
</head>
<body>
<header>
  <div><strong>系統需求單</strong> <span class="muted">客戶挑了哪幾套、想改成什麼樣子</span></div>
  <nav style="display:flex;gap:14px">
    <a href="./admin.html">管理中心</a>
    <a href="./admin-wishes.html">許願申請</a>
    <a href="./admin-builds.html">生成紀錄</a>
    <a href="./admin-agent.html">產線管理</a>
    <a href="./admin-actions.html">動作紀錄</a>
  </nav>
</header>

<main style="padding:22px;max-width:1100px;margin:0 auto">
  <div id="kpis" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px"></div>
  <div id="list"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const when = (s) => s ? String(s).slice(0, 16).replace("T", " ") : "—";

async function load() {
  const res = await fetch("/api/admin/orders");
  if (res.status === 401) { location.href = "./admin-login.html?next=" + encodeURIComponent("/admin-orders"); return; }
  const { orders } = await res.json();
  render(orders || []);
}

function render(orders) {
  const systems = orders.reduce((n, o) => n + o.items.length, 0);
  const companies = new Set(orders.map((o) => o.buyer_email)).size;
  $("#kpis").innerHTML = [["需求單", orders.length], ["被挑選的系統", systems], ["來自不同客戶", companies]]
    .map(([k, v]) => `<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;min-width:150px">
      <div style="font-size:26px;font-weight:700">${v}</div><div class="muted" style="font-size:12px">${k}</div></div>`).join("");

  if (!orders.length) {
    $("#list").innerHTML = `<p class="muted" style="text-align:center;padding:50px">還沒有人送出需求單。</p>`;
    return;
  }

  $("#list").innerHTML = orders.map((o) => `
    <article style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <strong style="font-size:15px">${esc(o.buyer_email)}</strong>
        <span class="muted" style="font-size:12px">${when(o.created_at)}</span>
        <span class="ost ost-${esc(o.status)}">${statusText(o.status)}</span>
        <code class="muted" style="font-size:11px;margin-left:auto">${esc(o.id)}</code>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${o.status === "draft" || o.status === "paid"
          ? `<button type="button" class="obtn pri" data-provision="${esc(o.id)}">開通這張單</button>`
          : ""}
        ${o.status === "failed" || o.status === "provisioning"
          ? `<button type="button" class="obtn" data-reset="${esc(o.id)}">放回可開通</button>`
          : ""}
        ${o.provisioned_at ? `<span class="muted" style="font-size:12px">開通於 ${when(o.provisioned_at)}</span>` : ""}
        <span class="omsg" data-msg="${esc(o.id)}" style="font-size:12.5px"></span>
      </div>
      ${o.note ? `<p class="muted" style="margin:8px 0 0;font-size:13px">備註：${esc(o.note)}</p>` : ""}
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
        ${o.items.map((it) => `
          <div style="border-left:3px solid var(--accent);padding:8px 0 8px 12px">
            <div style="font-weight:500">${esc(it.title)}
              <a href="/demos/${esc(it.repoName)}/" target="_blank" class="muted" style="font-size:11px;margin-left:6px">看目前的樣子 ↗</a>
            </div>
            ${it.want
              ? `<div style="font-size:13px;color:var(--warn);margin-top:4px">想改：${esc(it.want)}</div>`
              : `<div class="muted" style="font-size:12px;margin-top:4px">（未填寫想改的地方）</div>`}
            ${it.shot
              ? `<a href="/api/admin/order-shot/${esc(o.id)}/${esc(it.shot)}" target="_blank" rel="noreferrer" style="display:inline-block;margin-top:6px"><img alt="客戶附的截圖" src="/api/admin/order-shot/${esc(o.id)}/${esc(it.shot)}" style="max-width:320px;border:1px solid var(--line);border-radius:8px;display:block" /></a>`
              : ""}
          </div>`).join("")}
      </div>
    </article>`).join("");
}

const STATUS_TEXT = { draft: "待開通", pending: "待付款", paid: "已付款",
  provisioning: "開通中", delivered: "已交付", failed: "開通失敗" };
function statusText(s) { return STATUS_TEXT[s] || s; }

function say(id, text, ok) {
  const el = document.querySelector(`[data-msg="${id}"]`);
  if (!el) return;
  el.textContent = text;
  el.style.color = ok ? "var(--ok)" : "var(--bad)";
}

document.addEventListener("click", async (e) => {
  const prov = e.target.closest("[data-provision]");
  const reset = e.target.closest("[data-reset]");
  if (!prov && !reset) return;
  const btn = prov || reset;
  const id = btn.dataset.provision || btn.dataset.reset;
  btn.disabled = true;
  say(id, prov ? "開通中，請稍候…" : "重設中…", true);
  try {
    const r = await fetch(prov ? "/api/admin/orders/provision" : "/api/admin/orders/reset", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ orderId: id }),
    });
    const d = await r.json();
    if (!r.ok) { say(id, d.error || "失敗", false); btn.disabled = false; return; }
    say(id, prov ? "已開通" : "已放回可開通", true);
    /* 重新載入才看得到新的狀態與開通時間——就地改一個徽章，其餘欄位會不同步。 */
    setTimeout(load, 900);
  } catch {
    say(id, "連不上伺服器", false);
    btn.disabled = false;
  }
});

load();
</script>
</body>
</html>
