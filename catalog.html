<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案目錄 ｜ JVision DEMO</title>
  <meta name="description" content="搜尋、篩選並開啟 463 個可操作的 AI 與產業系統 Demo。" />
  <meta name="theme-color" content="#f5f8fc" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6", accent:"#d97706" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1360px' },
    } } };
  </script>
  <style>
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .eyebrow { font-family: Inter, monospace; letter-spacing:.14em; }
    .navlink { position:relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after { transform:scaleX(1); transform-origin:left; }

    /* ---- app.js-injected: category list (#quickFilters) ---- */
    #quickFilters { display:flex; flex-direction:column; gap:2px; max-height:min(46vh, 340px); overflow-y:auto; scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; padding-right:2px; }
    #quickFilters::-webkit-scrollbar { width:6px; }
    #quickFilters::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
    #quickFilters button { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 12px; border-radius:8px; font-size:14px; font-weight:600; color:#334155; background:transparent; border:1px solid transparent; transition:background .15s, color .15s, border-color .15s; }
    #quickFilters button:hover { background:#eef4ff; color:#1e40af; }
    #quickFilters button.active { background:#e8f0ff; color:#1e40af; border-color:#bfdbfe; }

    /* ---- custom sort dropdown ---- */
    #sortTrigger[aria-expanded="true"] { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.2); }
    #sortTrigger[aria-expanded="true"] #sortChevron { transform:rotate(180deg); }
    .sort-opt { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; padding:9px 14px; font-size:14px; font-weight:600; color:#334155; background:#fff; border:0; cursor:pointer; transition:background .12s, color .12s; }
    .sort-opt:hover { background:#eef4ff; color:#1e40af; }
    .sort-opt .check { opacity:0; color:#1e40af; }
    .sort-opt[aria-selected="true"] { color:#1e40af; }
    .sort-opt[aria-selected="true"] .check { opacity:1; }

    /* ---- app.js-injected: active filter chips ---- */
    #activeFilters { display:flex; flex-wrap:wrap; gap:8px; }
    #activeFilters:empty { display:none; }
    #activeFilters button { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; color:#334155; background:#fff; border:1px solid #e2e8f0; transition:border-color .15s, color .15s; }
    #activeFilters button:hover { border-color:#1e40af; color:#1e40af; }

    /* ---- app.js-injected: search suggestions ---- */
    #searchSuggestions { position:absolute; z-index:30; left:0; right:0; top:calc(100% + 6px); background:#fff; border:1px solid #e2e8f0; border-radius:12px; box-shadow:0 16px 40px rgba(15,30,70,.14); overflow:hidden; }
    #searchSuggestions button { display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; padding:10px 14px; border:0; border-top:1px solid #eef2f7; background:#fff; cursor:pointer; }
    #searchSuggestions button:first-child { border-top:0; }
    #searchSuggestions button:hover, #searchSuggestions button.active { background:#f5f8fc; }
    #searchSuggestions strong { font-size:14px; color:#0f1e46; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #searchSuggestions span { font-size:12px; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ---- empty state ---- */
    .empty-state { grid-column:1/-1; text-align:center; padding:56px 24px; border:1px dashed #cbd5e1; border-radius:16px; background:#fff; color:#64748b; }
    .empty-state h3 { color:#0f1e46; font-size:18px; font-weight:700; margin:0 0 8px; }
    .empty-state button { margin-top:14px; padding:9px 18px; border-radius:9px; background:#1e40af; color:#fff; border:0; font-weight:700; cursor:pointer; }

    /* ---- practical-detail hidden inline, shown in dialog ---- */
    .practical-detail-body { display:none; }
    #projectUseDialog { border:0; border-radius:18px; padding:0; max-width:520px; width:92%; box-shadow:0 24px 60px rgba(15,30,70,.28); }
    #projectUseDialog::backdrop { background:rgba(15,30,70,.42); backdrop-filter:blur(2px); }
    .project-use-dialog-content .practical-detail-body { display:block; }
    .project-use-dialog-content dl { display:grid; gap:14px; margin:0; }
    .project-use-dialog-content dt { font-size:12px; font-weight:700; color:#64748b; }
    .project-use-dialog-content dd { margin:3px 0 0; font-size:14px; line-height:1.6; color:#334155; }
    .project-metrics { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
    .project-metrics span { padding:4px 10px; border-radius:999px; background:#eef4ff; color:#1e40af; font-size:12px; font-weight:600; }
    .project-use-dialog-content small { display:block; margin-top:14px; color:#94a3b8; font-size:12px; }
  </style>
</head>
<body class="text-body antialiased min-h-screen flex flex-col">
  <a href="#searchResults" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:top-2 focus:left-2 focus:bg-brand focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">跳至搜尋結果</a>

  <!-- ===== Top Nav ===== -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁">
        <img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" />
      </a>
      <div class="flex items-center gap-8">
        <a href="./catalog.html" class="navlink text-sm font-bold text-brand">專案目錄</a>
        <a href="./project-expert.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案 Agents</a>
        <button id="focusSearch" type="button" class="h-10 w-10 grid place-content-center rounded-lg text-muted hover:text-brand hover:bg-soft transition-colors" aria-label="搜尋">
          <span class="material-symbols-outlined text-[22px]">search</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-shell mx-auto w-full px-6 py-8 flex flex-col lg:flex-row gap-6">
    <!-- ===== Left Filter Rail ===== -->
    <aside class="w-full lg:w-[264px] shrink-0">
      <div class="lg:sticky lg:top-24 bg-white rounded-xl border border-line shadow-[0_4px_16px_rgba(15,30,70,.05)] p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-bold text-ink">篩選條件</h2>
          <button id="clearFilters" type="button" class="text-sm font-semibold text-brand2 hover:text-brand transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled>清除</button>
        </div>

        <div class="relative mb-5">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted text-[20px] pointer-events-none">search</span>
          <label for="searchInput" class="sr-only">搜尋名稱、產業、功能或編號</label>
          <input id="searchInput" type="search" inputmode="search" autocomplete="off" class="w-full pl-10 pr-3 py-2.5 bg-soft border border-line rounded-lg text-sm font-medium text-ink focus:border-brand2 focus:ring-2 focus:ring-brand2/20 outline-none transition" placeholder="搜尋工單、ESG、CRM、#82…" aria-autocomplete="list" aria-controls="searchSuggestions" aria-expanded="false" />
          <div class="search-suggestions" id="searchSuggestions" role="listbox" hidden></div>
        </div>

        <div class="mb-5">
          <p class="block text-xs font-bold text-muted uppercase mb-2">排序</p>
          <div class="relative" id="sortDropdown">
            <button type="button" id="sortTrigger" aria-haspopup="listbox" aria-expanded="false" class="w-full flex items-center justify-between gap-2 py-2.5 pl-3 pr-3 bg-white border border-line rounded-lg text-sm font-semibold text-ink hover:border-brand2/60 focus:border-brand2 focus:ring-2 focus:ring-brand2/20 outline-none transition">
              <span id="sortLabel">相關性最高</span>
              <span class="material-symbols-outlined text-muted text-[20px] transition-transform" id="sortChevron">unfold_more</span>
            </button>
            <ul id="sortMenu" role="listbox" class="hidden absolute z-30 left-0 right-0 mt-1.5 bg-white border border-line rounded-lg shadow-[0_16px_40px_rgba(15,30,70,.14)] overflow-hidden py-1">
              <li><button type="button" class="sort-opt" role="option" data-value="relevance" data-label="相關性最高" aria-selected="true"><span>相關性最高</span><span class="material-symbols-outlined text-[18px] check">check</span></button></li>
              <li><button type="button" class="sort-opt" role="option" data-value="id" data-label="案例編號" aria-selected="false"><span>案例編號</span><span class="material-symbols-outlined text-[18px] check">check</span></button></li>
              <li><button type="button" class="sort-opt" role="option" data-value="title" data-label="專案名稱" aria-selected="false"><span>專案名稱</span><span class="material-symbols-outlined text-[18px] check">check</span></button></li>
            </ul>
            <!-- source of truth for app.js -->
            <select id="sortSelect" class="hidden">
              <option value="relevance">相關性最高</option>
              <option value="id">案例編號</option>
              <option value="title">專案名稱</option>
            </select>
          </div>
        </div>

        <div>
          <p class="text-xs font-bold text-muted uppercase mb-2">產業分類</p>
          <div class="quick-filters" id="quickFilters" aria-label="常用產業篩選"></div>
        </div>

        <!-- hidden: required by app.js -->
        <select id="categorySelect" class="hidden"><option value="">全部產業</option></select>
      </div>
    </aside>

    <!-- ===== Results ===== -->
    <section class="flex-1 min-w-0" id="searchResults">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-5">
        <div>
          <p class="eyebrow text-[11px] font-bold text-brand2 uppercase mb-1">SEARCH RESULTS</p>
          <h1 class="text-2xl font-black text-ink">專案結果</h1>
          <p id="resultSummary" class="text-sm text-muted mt-1" aria-live="polite">正在載入專案資料…</p>
        </div>
      </div>
      <div class="active-filters mb-5" id="activeFilters" aria-label="目前篩選條件"></div>

      <section class="project-grid grid grid-cols-1 sm:grid-cols-2 2xl:grid-cols-3 gap-5" id="projectGrid" aria-live="polite"></section>

      <div class="flex justify-center mt-8">
        <button class="load-more py-2.5 px-6 bg-white border border-line text-ink text-sm font-bold rounded-full shadow-sm hover:bg-soft transition-colors inline-flex items-center gap-2" id="loadMore" type="button" hidden>
          載入更多結果 <span class="material-symbols-outlined text-[18px]">expand_more</span>
        </button>
      </div>
    </section>
  </main>

  <!-- hidden industry stats: required by app.js (renderCatalogStats) -->
  <section id="catalogStats" class="hidden" aria-hidden="true">
    <div id="catalogStatsSummary"></div>
    <table><tbody id="catalogStatsBody"></tbody></table>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="border-t border-line bg-white mt-auto">
    <div class="max-w-shell mx-auto px-6 py-10 flex flex-col md:flex-row md:items-start justify-between gap-8">
      <div class="flex flex-col gap-3 max-w-sm">
        <img src="./assets/logo.png" alt="JVision DEMO" class="h-8 w-auto self-start" />
        <p class="text-sm text-muted leading-relaxed">從製造現場到企業決策，463 個可操作的 AI 產業系統，一站探索、即刻體驗。</p>
      </div>
      <div class="md:text-right">
        <h4 class="text-xs font-bold text-ink uppercase tracking-wide mb-3">探索</h4>
        <ul class="flex flex-col gap-2 text-sm text-muted">
          <li><a href="./index.html" class="hover:text-brand transition-colors">首頁</a></li>
          <li><a href="./catalog.html" class="hover:text-brand transition-colors">專案目錄</a></li>
          <li><a href="./project-expert.html" class="hover:text-brand transition-colors">專案 Agents</a></li>
        </ul>
      </div>
    </div>
    <div class="border-t border-line">
      <div class="max-w-shell mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-muted">
        <span>© 2026 JVision</span>
        <div class="flex items-center gap-5">
          <a href="#" class="hover:text-brand transition-colors">服務條款</a>
          <a href="#" class="hover:text-brand transition-colors">隱私政策</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- ===== Card template (app.js clones this) ===== -->
  <template id="projectCardTemplate">
    <article class="project-card bg-white rounded-xl border border-line overflow-hidden flex flex-col group hover:shadow-[0_10px_28px_rgba(15,30,70,.1)] hover:border-brand2/40 transition-all duration-300">
      <a class="system-preview relative block aspect-[16/9] bg-soft overflow-hidden" target="_blank" rel="noreferrer">
        <img class="system-preview-image w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" width="720" height="405" decoding="async" />
        <span class="case-id hidden"></span>
      </a>
      <div class="p-4 flex-1 flex flex-col">
        <p class="project-category self-start text-brand text-xs font-bold bg-brand/5 px-2 py-0.5 rounded-full mb-2"></p>
        <h3 class="text-base font-bold text-ink mb-1.5 line-clamp-1"></h3>
        <p class="project-description text-sm text-muted leading-relaxed line-clamp-2 mb-3 flex-1"></p>
        <div class="project-practical-detail mb-3">
          <button type="button" class="project-use-trigger text-xs font-bold text-brand2 hover:text-brand inline-flex items-center gap-1 transition-colors">
            查看實際用途 <span class="material-symbols-outlined text-[16px]">expand_more</span>
          </button>
          <div class="practical-detail-body">
            <dl>
              <div><dt>適合誰</dt><dd class="project-primary-user"></dd></div>
              <div><dt>今天會遇到</dt><dd class="project-business-situation"></dd></div>
              <div><dt>日常怎麼用</dt><dd class="project-daily-use"></dd></div>
            </dl>
            <div class="project-metrics" aria-label="可查看的營運數據"></div>
            <small>公司、人名、單據與營運資料皆為擬真示範。</small>
          </div>
        </div>
        <div class="flex gap-2 mt-auto pt-3 border-t border-line">
          <a class="guided-link flex-1 text-center py-2 px-3 border border-brand2 text-brand2 text-sm font-bold rounded-lg hover:bg-brand2/5 transition-colors" target="_blank" rel="noreferrer">3 分鐘情境導覽</a>
          <a class="demo-link flex-1 text-center py-2 px-3 bg-brand text-white text-sm font-bold rounded-lg hover:bg-brand2 transition-colors shadow-[0_6px_16px_rgba(30,64,175,.2)]" target="_blank" rel="noreferrer">開啟 Demo</a>
        </div>
      </div>
    </article>
  </template>

  <!-- ===== Practical-use dialog ===== -->
  <dialog class="project-use-dialog" id="projectUseDialog" aria-labelledby="projectUseDialogTitle">
    <div class="project-use-dialog-shell">
      <header class="flex items-start justify-between gap-4 p-5 border-b border-line">
        <div>
          <p class="eyebrow text-[11px] font-bold text-brand2 uppercase">專案實際用途</p>
          <h2 id="projectUseDialogTitle" class="text-lg font-bold text-ink mt-1"></h2>
        </div>
        <button type="button" class="project-use-dialog-close text-muted hover:text-ink text-3xl leading-none -mt-1" aria-label="關閉實際用途">×</button>
      </header>
      <div class="project-use-dialog-content p-5"></div>
    </div>
  </dialog>

  <script src="./app.js?v=20260730-6"></script>
  <script>
    // Custom sort dropdown → syncs the hidden native #sortSelect that app.js listens to.
    (function () {
      const trigger = document.getElementById("sortTrigger");
      const menu = document.getElementById("sortMenu");
      const label = document.getElementById("sortLabel");
      const select = document.getElementById("sortSelect");
      if (!trigger || !menu || !select) return;
      const opts = [...menu.querySelectorAll(".sort-opt")];
      const close = () => { menu.classList.add("hidden"); trigger.setAttribute("aria-expanded", "false"); };
      const open = () => { menu.classList.remove("hidden"); trigger.setAttribute("aria-expanded", "true"); };
      const syncFromSelect = () => {
        const v = select.value || "relevance";
        opts.forEach((o) => o.setAttribute("aria-selected", o.dataset.value === v ? "true" : "false"));
        const active = opts.find((o) => o.dataset.value === v);
        if (active) label.textContent = active.dataset.label;
      };
      trigger.addEventListener("click", (e) => { e.stopPropagation(); menu.classList.contains("hidden") ? open() : close(); });
      opts.forEach((o) => o.addEventListener("click", () => {
        select.value = o.dataset.value;
        select.dispatchEvent(new Event("change", { bubbles: true }));
        syncFromSelect();
        close();
      }));
      document.addEventListener("click", (e) => { if (!e.target.closest("#sortDropdown")) close(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
      // reflect any value app.js set from the URL (?sort=) shortly after boot
      setTimeout(syncFromSelect, 300);
      syncFromSelect();
    })();
  </script>
</body>
</html>
