<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JV Demo 網站｜專案檢索</title>
    <meta name="description" content="JV 公司 Demo 網站：檢索 464 個 AI、智慧製造與產業系統展示專案。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="jv-site">
    <a class="skip-link" href="#searchResults">跳至搜尋結果</a>
    <header class="site-header">
      <a class="site-brand" href="./index.html" aria-label="JV Demo 網站首頁">
        <span>JV</span><b>DEMO</b>
      </a>
      <nav aria-label="主要導覽">
        <a href="#searchResults">專案檢索</a>
        <a href="./project-expert.html">專案專家 Agent</a>
        <a href="./admin.html">管理中心</a>
        <a href="./docs/PROJECT_INDEX.md">專案索引</a>
      </nav>
      <button class="header-search" id="focusSearch" type="button" aria-label="開啟專案搜尋">搜尋專案 <kbd>/</kbd></button>
    </header>

    <main>
      <section class="search-hero" aria-labelledby="siteTitle">
        <div>
          <p class="section-label">JV COMPANY · DEMO CATALOG</p>
          <h1 id="siteTitle">JV Demo 網站</h1>
          <p class="site-intro">搜尋、篩選並開啟所有展示專案。</p>
        </div>
        <div class="catalog-count" aria-label="專案總數">
          <strong id="totalProjects">—</strong>
          <span>個可檢索專案</span>
        </div>
      </section>

      <section class="search-panel" aria-labelledby="searchHeading">
        <div class="search-panel-heading">
          <div>
            <p class="section-label">PROJECT SEARCH</p>
            <h2 id="searchHeading">尋找專案</h2>
          </div>
          <button id="clearFilters" class="text-button" type="button" disabled>清除條件</button>
        </div>

        <div class="search-input-wrap">
          <label for="searchInput">搜尋名稱、產業、功能、Repo 或編號</label>
          <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="例如：工單、ESG、庫存、CRM、#82" aria-autocomplete="list" aria-controls="searchSuggestions" aria-expanded="false" />
          <div class="search-suggestions" id="searchSuggestions" role="listbox" hidden></div>
        </div>

        <div class="filter-grid" aria-label="專案篩選條件">
          <label>
            <span>產業分類</span>
            <select id="categorySelect"><option value="">全部產業</option></select>
          </label>
          <label>
            <span>專案來源</span>
            <select id="sourceSelect"><option value="">全部來源</option></select>
          </label>
          <label>
            <span>技術類型</span>
            <select id="runtimeSelect"><option value="">全部類型</option></select>
          </label>
          <label>
            <span>GitHub</span>
            <select id="githubSelect"><option value="">全部狀態</option><option value="available">有 GitHub</option><option value="missing">無 GitHub</option></select>
          </label>
          <label>
            <span>排序</span>
            <select id="sortSelect"><option value="relevance">相關性</option><option value="id">案例編號</option><option value="title">專案名稱</option></select>
          </label>
        </div>

        <div class="quick-filters" id="quickFilters" aria-label="常用產業篩選"></div>
      </section>

      <section class="result-section" id="searchResults" aria-labelledby="resultHeading">
        <div class="result-heading">
          <div>
            <p class="section-label">SEARCH RESULTS</p>
            <h2 id="resultHeading">專案結果</h2>
          </div>
          <p id="resultSummary" aria-live="polite">正在載入專案資料…</p>
        </div>
        <div class="active-filters" id="activeFilters" aria-label="目前篩選條件"></div>
        <section class="project-grid" id="projectGrid" aria-live="polite"></section>
        <button class="load-more" id="loadMore" type="button" hidden>載入更多結果</button>
      </section>
    </main>

    <footer class="site-footer">
      <span>JV 公司 Demo 網站</span>
      <span id="footerStats">—</span>
      <a href="https://github.com/JVision-pj/jvision-all-demos" target="_blank" rel="noreferrer">GitHub Monorepo</a>
    </footer>

    <template id="projectCardTemplate">
      <article class="project-card">
        <div class="card-heading">
          <span class="case-id"></span>
          <span class="runtime-badge"></span>
        </div>
        <a class="system-preview" target="_blank" rel="noreferrer">
          <img class="system-preview-image" width="720" height="405" decoding="async" />
          <span class="system-preview-label">系統示意圖</span>
        </a>
        <h3></h3>
        <p class="project-category"></p>
        <p class="project-industry"></p>
        <dl class="project-details">
          <div><dt>來源</dt><dd class="project-source"></dd></div>
          <div><dt>Repo</dt><dd class="project-repo"></dd></div>
        </dl>
        <div class="card-actions">
          <a class="demo-link" target="_blank" rel="noreferrer">開啟 Demo</a>
          <a class="repo-link" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
