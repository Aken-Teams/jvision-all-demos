<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我要的系統 ｜ JVision DEMO</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1360px' },
    } } };
  </script>
  <style>
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    textarea { field-sizing: content; min-height: 3.5rem; }
  </style>
</head>
<body class="text-body">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" /></a>
      <div class="flex items-center gap-6">
        <a href="./catalog.html" class="text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./wish.html" class="text-sm font-bold text-ink hover:text-brand transition-colors">AI 許願池</a>
      </div>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-black text-ink mb-1.5">我要的系統</h1>
    <p class="text-sm text-muted mb-8">挑好的系統列在下面。每一套可以寫下你希望改成什麼樣子——欄位、流程、名稱都可以改。送出後我們會依你的需求做成可以實際使用的版本。</p>

    <!-- 空車 -->
    <section id="empty" hidden class="text-center py-16 border border-dashed border-line rounded-2xl bg-white">
      <span class="material-symbols-outlined text-[44px] text-muted">shopping_cart</span>
      <p class="mt-3 text-ink font-bold">還沒有挑選任何系統</p>
      <p class="text-sm text-muted mt-1">到目錄裡按卡片上的「＋」把系統加進來。</p>
      <a href="./catalog.html" class="inline-block mt-5 px-5 py-2.5 bg-brand text-white text-sm font-bold rounded-lg">前往專案目錄</a>
    </section>

    <!-- 需要登入 -->
    <section id="needLogin" hidden class="text-center py-16 border border-line rounded-2xl bg-white">
      <span class="material-symbols-outlined text-[44px] text-brand2">account_circle</span>
      <p class="mt-3 text-ink font-bold">請先用 Google 帳號登入</p>
      <p class="text-sm text-muted mt-1">我們需要知道要把做好的系統交給誰。</p>
      <a id="loginLink" href="#" class="inline-block mt-5 px-5 py-2.5 bg-brand text-white text-sm font-bold rounded-lg">用 Google 登入</a>
    </section>

    <form id="form" hidden>
      <div id="list" class="space-y-4"></div>

      <div class="mt-8 bg-white border border-line rounded-2xl p-5">
        <h2 class="font-bold text-ink mb-4">聯絡方式</h2>
        <div class="grid sm:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-xs font-bold text-muted">公司名稱</span>
            <input name="company" required maxlength="60" placeholder="例：宏達精密股份有限公司"
                   class="mt-1 w-full rounded-lg border-line text-sm focus:border-brand focus:ring-brand" />
          </label>
          <label class="block">
            <span class="text-xs font-bold text-muted">聯絡人</span>
            <input name="contact" maxlength="40" placeholder="留白就用你的 Google 名稱"
                   class="mt-1 w-full rounded-lg border-line text-sm focus:border-brand focus:ring-brand" />
          </label>
        </div>
        <label class="block mt-4">
          <span class="text-xs font-bold text-muted">整體想說的話（選填）</span>
          <textarea name="note" maxlength="1000" rows="2" placeholder="例：我們是做金屬加工的，希望介面用語貼近現場師傅的說法。"
                    class="mt-1 w-full rounded-lg border-line text-sm focus:border-brand focus:ring-brand"></textarea>
        </label>
      </div>

      <div class="mt-6 flex items-center gap-3">
        <button type="submit" id="submitBtn"
                class="px-6 py-3 bg-brand text-white font-bold rounded-lg hover:bg-brand2 transition-colors disabled:opacity-50">
          送出需求
        </button>
        <span id="hint" class="text-sm text-muted">送出後不會立刻收費，我們會先跟你確認範圍。</span>
      </div>
    </form>

    <!-- 送出成功 -->
    <section id="done" hidden class="text-center py-16 border border-line rounded-2xl bg-white">
      <span class="material-symbols-outlined text-[44px] text-green-600">task_alt</span>
      <p class="mt-3 text-ink font-bold text-lg">收到了</p>
      <p class="text-sm text-muted mt-1">需求單號 <code id="orderId" class="font-mono text-ink"></code></p>
      <p class="text-sm text-muted mt-3 max-w-md mx-auto">我們會依你寫的內容把系統做成可以實際使用的版本，完成後寄信通知你。</p>
      <a href="./catalog.html" class="inline-block mt-6 px-5 py-2.5 border border-line text-ink text-sm font-bold rounded-lg">繼續逛目錄</a>
    </section>
  </main>

  <script src="/shared/jv-cart.js?v=1"></script>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);
    const show = (id) => ["empty", "needLogin", "form", "done"].forEach((k) => { $("#" + k).hidden = k !== id; });

    function render(items) {
      $("#list").innerHTML = items.map((it, i) => `
        <div class="bg-white border border-line rounded-2xl p-5" data-repo="${it.repoName}">
          <div class="flex items-start gap-3">
            <span class="w-7 h-7 rounded-lg bg-brand/10 text-brand grid place-content-center text-xs font-black shrink-0">${i + 1}</span>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-ink leading-tight">${it.title}</h3>
              <a href="./demos/${it.repoName}/" target="_blank" rel="noreferrer"
                 class="text-xs font-semibold text-brand2 hover:underline">看目前的樣子 ↗</a>
            </div>
            <button type="button" class="remove text-muted hover:text-red-600 shrink-0" title="移除">
              <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
          </div>
          <label class="block mt-3">
            <span class="text-xs font-bold text-muted">這一套你想改成什麼樣子？（選填）</span>
            <textarea class="want mt-1 w-full rounded-lg border-line text-sm focus:border-brand focus:ring-brand"
                      rows="2" maxlength="600"
                      placeholder="例：要多一個「爐號」欄位、狀態改成我們自己的四個階段、把「客戶」改叫「業主」。"></textarea>
          </label>
        </div>`).join("");
    }

    function refresh() {
      const items = JVCart.items();
      if (!items.length) { show("empty"); return; }
      render(items);
      show("form");
    }

    $("#list").addEventListener("click", (e) => {
      const btn = e.target.closest(".remove");
      if (!btn) return;
      JVCart.remove(btn.closest("[data-repo]").dataset.repo);
      refresh();
    });
    document.addEventListener("jv-cart-sync", refresh);

    /* 先確認身分。要把做好的系統交給誰，這件事沒有身分就無從談起。 */
    fetch("/api/visitor/me").then((r) => r.json()).then((me) => {
      if (!me.signedIn) {
        $("#loginLink").href = "/api/visitor/google/start?next=" + encodeURIComponent("/cart.html");
        show("needLogin");
        return;
      }
      refresh();
    }).catch(() => refresh());

    $("#form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("#submitBtn");
      btn.disabled = true;
      $("#hint").textContent = "送出中…";
      const fd = new FormData(e.target);
      const items = [...$("#list").children].map((el) => ({
        repoName: el.dataset.repo,
        title: el.querySelector("h3").textContent,
        want: el.querySelector(".want").value.trim(),
      }));
      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ company: fd.get("company"), contact: fd.get("contact"), note: fd.get("note"), items }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "送出失敗");
        $("#orderId").textContent = data.id;
        JVCart.clear();
        show("done");
      } catch (err) {
        btn.disabled = false;
        $("#hint").textContent = "✖ " + err.message;
      }
    });
  })();
  </script>
</body>
</html>
