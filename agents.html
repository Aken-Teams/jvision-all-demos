<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案 Agents ｜ AI Agent 市集 · JVision</title>
  <meta name="description" content="搜尋、篩選並認識 16 位各司其職的 AI 專員，看整支團隊如何從一句話協作完成企業工作。" />
  <meta name="theme-color" content="#f5f8fc" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:"#0f1e46", body:"#334155", muted:"#64748b", line:"#e2e8f0", soft:"#f5f8fc", brand:"#1e40af", brand2:"#3b82f6", accent:"#d97706", violet:"#7c3aed", success:"#16a34a", amber:"#d97706", idle:"#94a3b8" },
      fontFamily: { sans:['Inter','Noto Sans TC','Microsoft JhengHei','sans-serif'] },
      maxWidth: { shell:'1360px' },
    } } };
  </script>
  <style>
    body { font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background:#f5f8fc; }
    .eyebrow { font-family: Inter, monospace; letter-spacing:.16em; }
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .navlink { position:relative; }
    .navlink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .28s ease; }
    .navlink:hover::after, .navlink.is-active::after { transform:scaleX(1); transform-origin:left; }
    .dot-grid { background-image: radial-gradient(#dbe4f5 1px, transparent 1px); background-size: 16px 16px; }
    .core-glow { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{ box-shadow:0 0 30px 4px rgba(124,58,237,.26);} 50%{ box-shadow:0 0 52px 10px rgba(124,58,237,.4);} }
    .agent-node { animation: floaty 5s ease-in-out infinite; }
    .agent-node:nth-child(3n){ animation-delay:1.4s; } .agent-node:nth-child(2n){ animation-delay:.7s; }
    @keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
    @media (prefers-reduced-motion: reduce){ .core-glow,.agent-node{ animation:none !important; } }
  </style>
</head>
<body class="text-body antialiased min-h-screen flex flex-col">

  <!-- ===== Top Nav ===== -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-line">
    <nav class="max-w-shell mx-auto h-16 px-6 flex items-center justify-between gap-6">
      <a href="./index.html" class="flex items-center shrink-0" aria-label="JVision DEMO 首頁"><img src="./assets/logo.png" alt="JVision DEMO" class="h-9 w-auto" /></a>
      <div class="flex items-center gap-8">
        <a href="./catalog.html" class="navlink text-sm font-bold text-ink hover:text-brand transition-colors">專案目錄</a>
        <a href="./agents.html" class="navlink is-active text-sm font-bold text-brand transition-colors">專案 Agents</a>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-shell mx-auto w-full px-6 py-8 flex flex-col gap-8">

    <!-- ===== Intro banner (compact hero + command) ===== -->
    <section class="relative overflow-hidden rounded-2xl border border-line bg-white">
      <div class="absolute inset-0 pointer-events-none dot-grid opacity-60"></div>
      <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(120% 120% at 88% 10%, rgba(124,58,237,.08), transparent 55%)"></div>
      <div class="relative grid grid-cols-1 lg:grid-cols-[1.08fr_1fr] gap-6 p-7 lg:p-9 items-center">
        <div class="flex flex-col gap-4">
          <span class="eyebrow inline-flex items-center gap-2 text-[11px] font-bold text-violet uppercase"><span class="w-1.5 h-1.5 rounded-full bg-violet"></span> AGENT MARKETPLACE · MULTI-AGENT ORCHESTRATION</span>
          <h1 class="text-ink font-black tracking-tight text-[clamp(1.9rem,3vw,2.7rem)] leading-[1.16]">一句話，讓整支 <span class="text-transparent bg-clip-text" style="background-image:linear-gradient(90deg,#1e40af,#7c3aed)">AI 專案團隊</span> 替你完成</h1>
          <p class="text-[1.02rem] text-muted leading-relaxed max-w-xl">16 位各司其職的 AI 專員，會自己分工、互相接力。挑一位認識它，或直接看整支團隊實跑一個需求。</p>
          <div class="bg-white rounded-xl border border-line shadow-[0_10px_30px_rgba(15,30,70,.07)] p-2 max-w-xl focus-within:border-brand2 transition-colors">
            <div class="flex items-center gap-2 px-2">
              <span class="material-symbols-outlined text-brand">auto_awesome</span>
              <input id="goalInput" class="w-full border-none focus:ring-0 text-[15px] text-ink placeholder:text-muted py-2.5" placeholder="描述你的目標，例如：導入生產排程並評估 ROI" />
              <a href="./agents-mission?case=1" class="shrink-0 inline-flex items-center gap-2 h-10 px-4 rounded-lg text-white font-bold text-sm hover:opacity-90 transition-opacity" style="background-image:linear-gradient(90deg,#1e40af,#7c3aed)">啟動 <span class="material-symbols-outlined text-[18px]">arrow_forward</span></a>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm font-bold text-muted">
            <span><b class="text-brand text-base" data-agent-total>16</b> 位 Agents</span><span class="w-1 h-1 rounded-full bg-line"></span>
            <span><b class="text-ink text-base">5</b> 個小隊</span><span class="w-1 h-1 rounded-full bg-line"></span>
            <span><b class="text-ink text-base">463</b> 套可調度系統</span><span class="w-1 h-1 rounded-full bg-line"></span>
            <span><b class="text-ink text-base">3</b> 個實跑 Demo</span>
          </div>
        </div>
        <!-- 團隊 / 協作情境圖 -->
        <img src="./assets/agents.png" alt="AI 專案團隊協作情境" class="hidden lg:block w-full h-auto" />
      </div>
    </section>

    <!-- ===== Marketplace: filter + grid ===== -->
    <div class="flex flex-col lg:flex-row gap-6">

      <!-- LEFT: filter rail -->
      <aside class="w-full lg:w-[248px] shrink-0">
        <div class="lg:sticky lg:top-24 bg-white rounded-xl border border-line shadow-[0_4px_16px_rgba(15,30,70,.05)] p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-ink">篩選 Agents</h2>
            <button id="agClear" class="text-sm font-semibold text-brand2 hover:text-brand transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled>清除</button>
          </div>
          <div class="relative mb-5">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted text-[20px] pointer-events-none">search</span>
            <input id="agSearch" type="search" autocomplete="off" class="w-full pl-10 pr-3 py-2.5 bg-soft border border-line rounded-lg text-sm font-medium text-ink focus:border-brand2 focus:ring-2 focus:ring-brand2/20 outline-none transition" placeholder="搜尋名稱、能力、產業…" />
          </div>
          <div>
            <p class="text-xs font-bold text-muted uppercase mb-2">分類</p>
            <div id="agSquads" class="flex flex-col gap-1"></div>
          </div>
        </div>
      </aside>

      <!-- MIDDLE: grid -->
      <section class="flex-1 min-w-0">
        <!-- all agents -->
        <div class="flex items-center justify-between mb-3">
          <div>
            <p class="eyebrow text-[11px] font-bold text-brand2 uppercase">ALL AGENTS</p>
            <h2 class="text-lg font-black text-ink">全部 Agents</h2>
          </div>
          <p id="agCount" class="text-sm text-muted" aria-live="polite">—</p>
        </div>
        <div id="agGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        <div class="flex justify-center mt-8">
          <button id="agMore" class="py-2.5 px-6 bg-white border border-line text-ink text-sm font-bold rounded-full shadow-sm hover:bg-soft transition-colors inline-flex items-center gap-2" hidden>顯示更多 Agents <span class="material-symbols-outlined text-[18px]">expand_more</span></button>
        </div>
      </section>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="border-t border-line bg-white mt-auto">
    <div class="max-w-6xl mx-auto px-6 py-5 text-center text-sm text-muted">© 2026 JVision</div>
  </footer>

  <script src="./agents.js"></script>
  <script>
    renderAgentMarketplace();
    document.querySelectorAll("[data-agent-total]").forEach(function(el){ el.textContent = AGENTS.length; });
    document.getElementById("goalInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); location.href = "./agents-mission?case=1"; } });
  </script>
</body>
</html>
