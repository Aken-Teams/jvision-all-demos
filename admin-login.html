<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登入 · JV Demo 管理後台</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" /></noscript></noscript>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --line:#334155; --ink:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --bad:#f87171; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:radial-gradient(1200px 600px at 50% -10%,#1e3a5f,var(--bg));
       color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
  .card{width:min(100%,380px);background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .mark b{background:var(--accent);color:#082f49;padding:4px 9px;border-radius:8px;font-size:15px;letter-spacing:.5px}
  .mark span{font-size:14px;color:var(--muted)}
  h1{margin:0 0 6px;font-size:21px}
  p.sub{margin:0 0 22px;font-size:13.5px;color:var(--muted);line-height:1.7}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
        background:#0f172a;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;
         background:var(--accent);color:#082f49;font-size:15px;font-weight:700;
         font-family:inherit;cursor:pointer}
  button:disabled{opacity:.55;cursor:progress}
  .err{margin-top:14px;font-size:13.5px;color:var(--bad);min-height:20px;line-height:1.6}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
        font-size:12.5px;color:var(--muted);line-height:1.7}
  .foot a{color:var(--accent)}
  /* Google 按鈕用官方的白底樣式，讓人一眼認得出是哪一種登入 */
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
        margin-top:4px;padding:11px;border:1px solid #dadce0;border-radius:10px;
        background:#fff;color:#3c4043;font-size:15px;font-weight:500;
        font-family:inherit;cursor:pointer;text-decoration:none}
  .gbtn:hover{background:#f8f9fa}
  .gbtn svg{width:18px;height:18px;flex:none}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0 4px;
           font-size:12.5px;color:var(--muted)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="mark"><b>JV</b><span>DEMO ADMIN</span></div>
    <h1>管理後台</h1>
    <p class="sub">這裡可以看到站上的每一個動作、專案導入時間與 Agent 的開發進度。</p>
    <a class="gbtn" id="gbtn" hidden href="#">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      使用 Google 帳號登入
    </a>
    <div class="divider" id="divider" hidden>或使用管理密碼</div>

    <label for="pw">管理密碼</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <button id="go" type="submit">登入</button>
    <div class="err" id="err" role="alert"></div>
    <div class="foot">單一共用密碼，站台在公開網域上。<a href="./index.html">回到展示站</a></div>
  </form>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/admin-actions.html";
  const err = document.getElementById("err");
  /* 從 Google 回呼被退回來時，把原因顯示出來——最常見的是信箱不在允許清單，
     沒有訊息的話使用者只會看到自己又回到登入頁，完全不知道發生什麼事。 */
  if (params.get("error")) err.textContent = params.get("error");

  /* 只有真的設定好 Google 登入才顯示那顆按鈕，否則按下去只會拿到 503。
     查詢失敗要重試——站台重啟的幾秒內開頁，按鈕會永遠不出現。 */
  let sessTries = 0;
  (function checkSess() {
    fetch("/api/admin/session").then((r) => r.json()).then((d) => {
      /* 密碼登入停用時收掉整個密碼表單——留著一個必然失敗的表單，
         只會讓人反覆嘗試然後以為系統壞了。 */
      if (d.password === false) {
        var form = document.getElementById("form");
        ["pw", "go"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) (el.closest("label") || el).style.display = "none";
        });
        form.querySelectorAll("label").forEach(function (l) { l.style.display = "none"; });
        document.getElementById("divider") && (document.getElementById("divider").hidden = true);
      }
      if (!d.google) return;
      const g = document.getElementById("gbtn");
      g.href = "/api/admin/google/start?next=" + encodeURIComponent(next);
      g.hidden = false;
      document.getElementById("divider").hidden = false;
    }).catch(() => {
      if (++sessTries < 4) setTimeout(checkSess, 1500);
    });
  })();
  const go = document.getElementById("go");
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "登入中…";
    try {
      const r = await fetch("/api/admin/login", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "登入失敗");
      location.href = next;
    } catch (e2) {
      err.textContent = e2.message;
      go.disabled = false; go.textContent = "登入";
    }
  });
</script>
</body>
</html>
