<style>
:root{
 --color-primary:#16A34A;--color-on-primary:#000;--color-secondary:#22C55E;

 --color-ring:#16A34A;--amber:#F59E0B;--blue:#16A34A;--ink:#F8FAFC;

*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--color-background);color:var(--ink);font-family:Inter,sans-serif;line-height:1.5}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:"FILL" 0,"wght" 500}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px 16px;background:#05090f;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;overflow:auto}
.bd{display:flex;align-items:center;gap:12px;padding:2px 8px 22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.lg{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--color-primary);color:#001407;font-weight:800;box-shadow:0 0 18px rgba(34,197,94,.24)}

.side button{width:100%;min-height:44px;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:11px;text-align:left;font-size:13px;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .2s}
.side button:hover{background:#111827;color:#fff;border-color:#263449}
.side button.on{background:linear-gradient(90deg,rgba(22,163,74,.22),rgba(22,163,74,.06));border-color:rgba(34,197,94,.5);color:#fff;box-shadow:inset 3px 0 var(--color-secondary)}
.side button.on .material-symbols-outlined{color:var(--color-secondary);filter:drop-shadow(0 0 6px rgba(34,197,94,.45))}
.foot{margin-top:auto;padding:15px 10px 4px;border-top:1px solid var(--line);color:#94A3B8;font:11px/1.8 var(--mono)}
.main{min-width:0;padding:28px clamp(16px,2.4vw,36px) 44px;background:
 radial-gradient(circle at 88% 0,rgba(22,163,74,.08),transparent 28rem),
 linear-gradient(180deg,#0B1220 0,var(--color-background) 22rem)}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.vh h2{margin:0;font-size:clamp(23px,2.2vw,32px);line-height:1.2;letter-spacing:-.035em;font-weight:800;text-shadow:0 0 10px rgba(248,250,252,.12)}
.vh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.live{display:flex;align-items:center;gap:8px;min-height:34px;padding:6px 12px;border:1px solid rgba(34,197,94,.42);border-radius:8px;background:rgba(22,163,74,.1);color:#BBF7D0;font:600 11px var(--mono)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s ease-in-out infinite}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi,.card,.st{border:1px solid var(--line);background:linear-gradient(145deg,rgba(17,24,39,.98),rgba(13,20,33,.98));box-shadow:0 14px 34px rgba(0,0,0,.18)}
.kpi{position:relative;min-height:126px;padding:16px;border-radius:12px;overflow:hidden}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--color-primary),transparent)}
.kpi .l,.st .l{color:var(--muted);font-size:11.5px;font-weight:600}
.kpi .v{margin-top:6px;font-size:28px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}

.kpi .ic{position:absolute;right:14px;top:14px;color:#86EFAC;opacity:.7}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:17px;border-radius:13px}

.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}

.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.mh b{display:block;font:600 13px var(--mono);color:#fff}
.mh small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.ringw{position:relative;display:grid;place-items:center}
.ring{--p:0;--c:#22C55E;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#263449 0)}
.ring:before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#0D1523}
.ring span{position:relative;color:var(--c);font:700 13px var(--mono)}
.mf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.mf b{color:#F8FAFC;font-family:var(--mono);font-weight:500}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border:1px solid currentColor;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap}
.t-ok{background:rgba(34,197,94,.1);color:#86EFAC}.t-warn{background:rgba(245,158,11,.1);color:#FCD34D}.t-bad{background:rgba(239,68,68,.1);color:#FCA5A5}.t-info{background:#1E293B;color:#CBD5E1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table.data{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data tr:last-child td,table.data tr:last-child th{border-bottom:0}
table.data th{background:#0A101B;color:#CBD5E1;font-size:10.5px;letter-spacing:.04em;font-weight:700}
table.data tr:hover td{background:rgba(30,41,59,.45)}
table.data td:nth-child(n+3){font-variant-numeric:tabular-nums}
table.data td b,table.data td:first-child{font-family:var(--mono)}
table.data th:nth-child(n+3),table.data td:nth-child(n+3){text-align:right}
table.data th:last-child,table.data td:last-child{text-align:left}
.bar{height:7px;border-radius:4px;background:#28364A;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.chart{height:230px}
.alist,.wo,.rep{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid rgba(245,158,11,.35);border-left:3px solid var(--warn);border-radius:8px;background:rgba(245,158,11,.07)}
.al.bad{border-color:rgba(239,68,68,.35);border-left-color:var(--bad);background:rgba(239,68,68,.07)}
.al .material-symbols-outlined{flex:none;color:#FCD34D}.al.bad .material-symbols-outlined{color:#FCA5A5}
.al b{font-size:11.5px}.al small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.wc{padding:12px 13px;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:9px;background:#0D1523}
.wc.warn{border-left-color:var(--warn)}.wc.bad{border-left-color:var(--bad)}.wc.ok{border-left-color:var(--ok)}
.wt{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}
.wt b{font-size:12.5px}.steps{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.step{padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:#172235;color:#CBD5E1;font-size:10px;font-weight:700}
.step.done{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86EFAC}
.step.now{border-color:var(--color-secondary);background:var(--color-primary);color:#001407}
.ri{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;background:#0D1523}
.ri.w{border-left-color:var(--warn)}.ri.o{border-left-color:var(--ok)}
.mid{flex:1;min-width:0}.mid b{font-size:12px}.mid small{display:block;color:var(--muted);font-size:10.5px}
.qty{text-align:right;flex:none}.qty b{color:#F8FAFC;font:700 14px var(--mono)}.qty small{display:block;color:var(--muted);font-size:9.5px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.st{padding:15px;border-radius:11px}.st .v{margin-top:4px;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:1px;background:var(--line)}
.ti{position:relative;padding:0 0 18px 5px}
.ti:before{content:"";position:absolute;left:-23px;top:2px;width:12px;height:12px;border:3px solid #111827;border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 1px var(--color-secondary)}
.ti.w:before{background:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.ti.b:before{background:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ti.g:before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tt{font-size:12px;font-weight:700}.ti small{color:var(--muted);font:10px var(--mono)}.dsc{margin-top:3px;color:#CBD5E1;font-size:11.5px}
#view>.kpis>* ,#view>.grid>* ,#view>.card,#view>.two>* ,#view>.stat>*{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
#view>.kpis>*:nth-child(2),#view>.grid>*:nth-child(2),#view>.two>*:nth-child(2),#view>.stat>*:nth-child(2){animation-delay:.06s}
#view>.kpis>*:nth-child(3),#view>.stat>*:nth-child(3){animation-delay:.12s}
#view>.kpis>*:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35;box-shadow:0 0 3px var(--ok)}}
@media(max-width:1024px){.shell{grid-template-columns:220px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.mg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:768px){.shell{display:block}.side{position:static;width:100%;height:auto;display:block;padding:12px}.bd{padding:4px 4px 12px}.side #nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px}.side button{width:auto;flex:none}.foot{display:none}.main{padding:20px 14px 34px}.g11,.two{grid-template-columns:1fr}}
@media(max-width:520px){.kpis,.stat,.mg{grid-template-columns:1fr}.vh{align-items:flex-start}.live{width:100%;justify-content:center}.card{padding:13px}.kpi{min-height:112px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

let charts=[];
const text="#CBD5E1",grid="#334155",green="#22C55E",amber="#F59E0B",red="#EF4444";
function clearCharts(){charts.forEach(c=>{try{c.dispose()}catch(e){}});charts=[]}
function mk(id){const el=document.getElementById(id);if(!el)return null;const c=echarts.init(el);charts.push(c);return c}
function base(){return {backgroundColor:"transparent",textStyle:{fontFamily:"Inter",color:text},tooltip:{backgroundColor:"#080D16",borderColor:grid,textStyle:{color:"#F8FAFC"}},legend:{textStyle:{color:text,fontSize:10}}}}
function draw(i){
 clearCharts();
 if(i===0){const c=mk("c_dist");c&&c.setOption({...base(),legend:{bottom:0,textStyle:{color:text,fontSize:10}},series:[{type:"pie",radius:["45%","72%"],center:["50%","43%"],label:{color:text,fontSize:10},data:[{value:31,name:"正常",itemStyle:{color:green}},{value:10,name:"接近保養",itemStyle:{color:amber}},{value:5,name:"壽命將盡",itemStyle:{color:red}}]}]})}
 if(i===1){const c=mk("c_use");c&&c.setOption({...base(),grid:{left:52,right:14,top:16,bottom:25},xAxis:{type:"category",data:["23/03","23/08","24/01","24/08","25/05","26/02","26/08"],axisLine:{lineStyle:{color:grid}},axisLabel:{color:text,fontSize:10}},yAxis:{type:"value",name:"萬模",nameTextStyle:{color:text},splitLine:{lineStyle:{color:grid}},axisLabel:{color:text,formatter:v=>v/10000}},series:[{type:"line",smooth:true,data:[80000,150000,240000,330000,430000,520000,572000],areaStyle:{color:"rgba(34,197,94,.1)"},lineStyle:{color:green,width:3},itemStyle:{color:green},markLine:{data:[{yAxis:600000,label:{formatter:"壽命上限",color:"#FCA5A5"}}],lineStyle:{color:red,type:"dashed"}}}]});const g=mk("c_gauge");g&&g.setOption({...base(),series:[{type:"gauge",progress:{show:true,width:16,itemStyle:{color:red}},axisLine:{lineStyle:{width:16,color:[[1,"#263449"]]}},pointer:{itemStyle:{color:"#F8FAFC"}},axisTick:{show:false},splitLine:{lineStyle:{color:text}},axisLabel:{color:text,fontSize:9},detail:{formatter:"{value}%",fontSize:28,offsetCenter:[0,"60%"],color:"#FCA5A5"},data:[{value:95,name:"壽命耗用"}],title:{offsetCenter:[0,"86%"],fontSize:11,color:text}}]})}
 if(i===2){const c=mk("c_pm");c&&c.setOption({...base(),grid:{left:72,right:45,top:12,bottom:28},xAxis:{type:"value",name:"剩餘模數(萬)",nameTextStyle:{color:text},splitLine:{lineStyle:{color:grid}},axisLabel:{color:text,formatter:v=>v/10000}},yAxis:{type:"category",data:["MD-B07","MD-F03","MD-A18","MD-E14","MD-G21"],axisLabel:{color:text,fontFamily:"JetBrains Mono"}},series:[{type:"bar",data:[{value:82000,itemStyle:{color:green}},{value:44000,itemStyle:{color:green}},{value:5000,itemStyle:{color:amber}},{value:2400,itemStyle:{color:amber}},{value:-1200,itemStyle:{color:red}}],barWidth:"55%",label:{show:true,position:"right",color:text,formatter:p=>p.value<0?"逾期":(p.value/10000).toFixed(1)+"萬"}}]})}
 if(i===3){const c=mk("c_sp");c&&c.setOption({...base(),legend:{bottom:0,textStyle:{color:text}},series:[{type:"pie",radius:["45%","72%"],center:["50%","42%"],label:{color:text},data:[{value:3,name:"充足",itemStyle:{color:green}},{value:2,name:"低於安全量",itemStyle:{color:amber}},{value:1,name:"臨界",itemStyle:{color:red}}]}]})}
 if(i===4){const r=mk("c_roi");r&&r.setOption({...base(),grid:{left:44,right:14,top:34,bottom:26},legend:{top:0,textStyle:{color:text}},xAxis:{type:"category",data:["MD-C22","MD-G21","MD-E14","MD-A18"],axisLabel:{color:text}},yAxis:{type:"value",name:"萬元",nameTextStyle:{color:text},splitLine:{lineStyle:{color:grid}},axisLabel:{color:text}},series:[{name:"翻修延壽成本",type:"bar",data:[42,18,9.6,18.5],itemStyle:{color:green}},{name:"重新開模成本",type:"bar",data:[280,240,180,320],itemStyle:{color:"#64748B"}}]});const u=mk("c_unit");u&&u.setOption({...base(),grid:{left:44,right:14,top:16,bottom:24},xAxis:{type:"category",data:["MD-E14","MD-C22","MD-A18","MD-F03","MD-B07"],axisLabel:{color:text}},yAxis:{type:"value",name:"NT$/模",nameTextStyle:{color:text},splitLine:{lineStyle:{color:grid}},axisLabel:{color:text}},series:[{type:"bar",data:[.31,.48,.62,.71,1.94],barWidth:"50%",itemStyle:{color:green,borderRadius:[4,4,0,0]},label:{show:true,position:"top",color:text}}]})}
 if(i===5){const m=mk("c_mile");m&&m.setOption({...base(),grid:{left:40,right:14,top:14,bottom:24},xAxis:{type:"category",data:["建檔","保養1","滑塊","預警","翻修"],axisLabel:{color:text}},yAxis:{type:"value",name:"萬模",nameTextStyle:{color:text},splitLine:{lineStyle:{color:grid}},axisLabel:{color:text,formatter:v=>v/10000}},series:[{type:"bar",data:[0,150000,320000,510000,572000],barWidth:"50%",itemStyle:{color:green,borderRadius:[4,4,0,0]}}]})}
}
function show(i){nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i)}
function fromHash(){const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],5):0);try{scrollTo(0,0)}catch(e){}}

fromHash();
