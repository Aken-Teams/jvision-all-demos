<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>模具生命週期管家 · Mold Lifecycle</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#1e293b;--accent:#475569;--accent2:#64748b;--bg:#eef1f5;--card:#fff;--line:#dbe1e9;--mut:#64748b;--ok:#059669;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#334155,#1e293b);color:#cbd5e1;padding:18px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#64748b,#475569);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 6px 18px rgba(15,23,42,.5)}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:#94a3b8;letter-spacing:1.4px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#cbd5e1;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#94a3b8}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:linear-gradient(135deg,#64748b,#475569);color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#94a3b8;border-top:1px solid rgba(255,255,255,.1)}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#e2e8f0;color:#334155;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px;color:var(--ok)}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.45}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.mc{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.mc .mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.mc .mh b{font-family:"Noto Sans TC";font-size:14px;display:block}
.mc .mh small{color:var(--mut);font-size:11px}
.ring{--p:0;--c:#475569;width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e5e9f0 0)}
.ring::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#fff}
.ring span{position:relative;font-size:14px;font-weight:800;font-family:Inter;color:var(--c)}
.ringw{position:relative;display:grid;place-items:center}
.mc .mf{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:4px}
.mc .mf b{color:var(--ink)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e2e8f0;color:#334155}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f4f6f9}
.bar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart{height:230px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:9px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.wo{display:flex;flex-direction:column;gap:10px}
.wc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px}
.wc.warn{border-left-color:var(--warn)}.wc.bad{border-left-color:var(--bad)}.wc.ok{border-left-color:var(--ok)}
.wc .wt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wc .wt b{font-family:"Noto Sans TC";font-size:13.5px}
.wc .steps{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.step{font-size:10.5px;padding:3px 9px;border-radius:20px;background:#eef1f5;color:var(--mut);font-weight:700}
.step.done{background:#d1fae5;color:#047857}.step.now{background:#475569;color:#fff}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 16px 4px}
.ti::before{content:"";position:absolute;left:-21px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.w::before{background:var(--warn)}.ti.b::before{background:var(--bad)}.ti.g::before{background:var(--ok)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:12px;color:#475569;margin-top:2px}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.o{border-left-color:var(--ok)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:15px;color:var(--accent)}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
.st{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.st .l{font-size:11.5px;color:var(--mut);font-weight:600}
.st .v{font-size:20px;font-weight:800;font-family:Inter;margin-top:3px}
.scroll{overflow-x:auto}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto}.side .foot{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.stat{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">模</div><div><b>模具生命週期管家</b><span>MOLD LIFECYCLE</span></div></div>
    <div id="nav"></div>
    <div class="foot">在管模具 46 副<br/>壽命預警 5 · 翻修中 3</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">模具總覽</h2><p id="vd"></p></div><div class="live"><i></i>生產計數即時回傳</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["模具總覽","dashboard","模具總覽","全廠模具清冊與壽命狀態戰情"],
["使用次數監控","speed","使用次數監控","射出模數 / 沖壓次數累計與壽命預警"],
["保養與翻修","handyman","保養與翻修","預防保養排程、翻修工單與試模確認"],
["備品耗材","inventory_2","備品耗材","模仁、頂針等備品庫存與領用"],
["成本效益","savings","成本效益","單模成本、翻修投報與攤提分析"],
["履歷追溯","history","履歷追溯","單一模具全生命週期履歷追溯"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const MOLDS=[
["MD-A18","前保桿射出模",428000,500000,"warn","接近保養","剩 5,000 模"],
["MD-B07","儀表板本體模",96000,600000,"ok","正常","剩 82,000 模"],
["MD-C22","車門飾板模",572000,600000,"bad","壽命將盡","逾期 8,000 模"],
["MD-D09","電池外殼沖壓模",188000,400000,"ok","正常","剩 31,000 沖"],
["MD-E14","連接器端子模",755000,800000,"warn","接近保養","剩 2,400 模"],
["MD-F03","水箱上蓋模",312000,450000,"ok","正常","剩 44,000 模"],
["MD-G21","保險桿格柵模",489000,500000,"bad","壽命將盡","逾期 1,200 模"],
["MD-H11","後燈殼射出模",134000,550000,"ok","正常","剩 96,000 模"],
["MD-J05","引擎蓋沖壓模",358000,400000,"warn","接近保養","剩 3,600 沖"]];
const ALERTS=[["MD-C22 車門飾板模 已達 95.3% 壽命","建議下線大翻修，已自動開立 WO-2207","bad"],["MD-G21 保險桿格柵模 保養逾期 1,200 模","持續生產恐產生毛邊不良，請儘速停機","bad"],["MD-E14 連接器端子模 距保養剩 2,400 模","備妥模仁 SP-MC08，排入本週翻修","warn"]];

const USE=[
["MD-A18","前保桿射出模",1240,428000,500000,3800],
["MD-C22","車門飾板模",980,572000,600000,3100],
["MD-E14","連接器端子模",2100,755000,800000,6200],
["MD-G21","保險桿格柵模",760,489000,500000,2400],
["MD-F03","水箱上蓋模",1520,312000,450000,4100],
["MD-B07","儀表板本體模",890,96000,600000,2600]];

const WO=[
["WO-2207","MD-C22 車門飾板模","大翻修 · 換模仁","陳課長","bad",1],
["WO-2205","MD-G21 保險桿格柵模","研磨 · 拋光","林工程師","warn",2],
["WO-2203","MD-A18 前保桿射出模","定期保養 · 清潔","黃工程師","ok",2],
["WO-2199","MD-E14 連接器端子模","頂針更換 · 試模","張工程師","warn",1]];
const WSTEP=["下模","翻修","試模","上線"];

const SPARE=[
["SP-MC08","模仁 φ12 SKD11","連接器端子模","4","6","warn","低於安全量"],
["SP-EP15","頂針組 φ3×120","前保桿/門飾板","28","12","ok","充足"],
["SP-HR02","熱澆道加熱圈","儀表板本體模","2","4","bad","臨界"],
["SP-SL07","滑塊耐磨片","保險桿格柵模","10","6","ok","充足"],
["SP-GS11","導柱襯套 φ40","通用","3","8","warn","低於安全量"],
["SP-SP04","彈簧 中負荷","沖壓模通用","54","20","ok","充足"]];

const COST=[
["MD-A18",428000,"NT$0.62","NT$185,000","攤提中"],
["MD-C22",572000,"NT$0.48","NT$420,000","翻修評估"],
["MD-E14",755000,"NT$0.31","NT$96,000","效益佳"],
["MD-B07",96000,"NT$1.94","NT$0","初期攤提"],
["MD-F03",312000,"NT$0.71","NT$132,000","攤提中"]];

const HIST=[
["2023-03-15","模具建檔上線","設備課","車門飾板模建入清冊，壽命上限 600,000 模，保養週期 100,000 模。","g"],
["2023-11-02","第 1 次定期保養","黃工程師","累計 150,000 模，清潔拋光並更換頂針一組。",""],
["2024-08-20","滑塊維修","林工程師","累計 320,000 模，滑塊耐磨片磨損，領用 SP-SL07 更換。","w"],
["2025-05-11","毛邊不良預警","系統","分模面出現毛邊，AI 研判模仁磨耗，建議排程研磨。","w"],
["2026-08-12","壽命將盡預警","系統","累計 572,000 模達 95.3%，自動開立大翻修工單 WO-2207。","b"],
["2026-08-13","翻修下模","陳課長","模具已下線，安排換模仁與熱澆道檢修，預估回線 3 日。","b"]];

function ring(used,limit,col){const p=Math.min(100,Math.round(used/limit*100));const c=col=='bad'?'#dc2626':col=='warn'?'#d97706':'#475569';return `<div class="ringw"><div class="ring" style="--p:${p};--c:${c}"><span>${p}%</span></div></div>`;}
const fmt=n=>n.toLocaleString('en-US');

const SCREENS=[
// 0 模具總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">deployed_code</span><div class="l">在管模具</div><div class="v">46<small style="font-size:12px"> 副</small></div><div class="d">▲ 稼動 41 副</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">壽命預警</div><div class="v" style="color:var(--bad)">5</div><div class="d" style="color:var(--mut)">2 將盡 · 3 接近</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">handyman</span><div class="l">翻修中</div><div class="v">3</div><div class="d" style="color:var(--mut)">1 大翻修 · 2 保養</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">trending_up</span><div class="l">平均壽命達成</div><div class="v">96<small style="font-size:12px">%</small></div><div class="d">▲ 較目標 90%</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">grid_view</span>模具壽命狀態（使用次數進度環）</h3><div class="mg">${MOLDS.map(m=>`<div class="mc"><div class="mh"><div><b>${m[0]}</b><small>${m[1]}</small></div>${ring(m[2],m[3],m[4])}</div><div class="mf"><span>已用 <b>${fmt(m[2])}</b> / ${fmt(m[3])}</span><span class="tag t-${m[4]=='bad'?'bad':m[4]=='warn'?'warn':'ok'}">${m[5]}</span></div><div class="mf"><span>下次保養</span><b>${m[6]}</b></div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>模具壽命分佈</h3><div class="chart" id="c_dist"></div><h3 style="margin-top:14px"><span class="material-symbols-outlined">notifications_active</span>壽命預警</h3><div class="alist">${ALERTS.map(a=>`<div class="al ${a[2]}"><span class="material-symbols-outlined">${a[2]=='bad'?'error':'warning'}</span><div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join('')}</div></div>
</div>`,
// 1 使用次數監控
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>MD-C22 車門飾板模 · 模數累計趨勢</h3><div class="chart" id="c_use"></div></div>
<div class="card"><h3><span class="material-symbols-outlined">gauge</span>本模壽命耗用</h3><div class="chart" id="c_gauge" style="height:230px"></div></div></div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">speed</span>各模具使用次數即時計數</h3><div class="scroll"><table class="data"><tr><th>編號</th><th>名稱</th><th>本班模數</th><th>累計模數</th><th>壽命上限</th><th>耗用</th><th>日均</th></tr>${USE.map(u=>{const p=Math.round(u[3]/u[4]*100);const c=p>=95?'var(--bad)':p>=85?'var(--warn)':'var(--accent)';return `<tr><td><b>${u[0]}</b></td><td>${u[1]}</td><td>+${fmt(u[2])}</td><td>${fmt(u[3])}</td><td>${fmt(u[4])}</td><td style="min-width:120px"><div class="bar"><i style="width:${p}%;background:${c}"></i></div><small style="color:var(--mut);font-size:10.5px">${p}%</small></td><td>${fmt(u[5])}</td></tr>`;}).join('')}</table></div></div>`,
// 2 保養與翻修
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">assignment</span>翻修 / 保養工單 <span class="tag t-warn" style="margin-left:auto">進行中 3 · 待料 1</span></h3><div class="wo">${WO.map(w=>`<div class="wc ${w[4]}"><div class="wt"><b>${w[0]} · ${w[1]}</b><span class="tag t-${w[4]=='bad'?'bad':w[4]=='warn'?'warn':'ok'}">${w[2]}</span></div><div style="font-size:11.5px;color:var(--mut);margin-top:4px">負責：${w[3]}</div><div class="steps">${WSTEP.map((s,si)=>`<span class="step ${si<w[5]?'done':si==w[5]?'now':''}">${s}</span>`).join('')}</div></div>`).join('')}</div></div>
<div class="card"><h3><span class="material-symbols-outlined">event_repeat</span>各模距下次保養（剩餘模數）</h3><div class="chart" id="c_pm" style="height:250px"></div><p style="font-size:11.5px;color:var(--mut);margin:10px 0 0">依各模累計模數與保養週期自動推算，接近門檻或逾期者優先排入翻修。</p></div></div>`,
// 3 備品耗材
