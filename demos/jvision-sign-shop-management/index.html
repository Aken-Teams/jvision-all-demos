<style>
:root{
  --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#f3effd;
  --ink:#1e1b2e; --muted:#6b6683; --line:#ece9f5; --bg:#f6f4fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
.msy{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}
header{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,#5b21b6,#6d28d9 55%,#7c3aed);color:#fff;box-shadow:0 2px 14px rgba(76,29,149,.25);}
.hbar{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.3px;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:22px;}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.8;letter-spacing:.5px;}
.hspacer{flex:1;}
.huser{display:flex;align-items:center;gap:9px;font-size:13px;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:999px;}
.huser .av{width:26px;height:26px;border-radius:50%;background:#c4b5fd;color:#4c1d95;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
nav{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap;}
.navbtn{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:#e9e2fb;background:rgba(255,255,255,.09);transition:.16s;}
.navbtn:hover{background:rgba(255,255,255,.2);}
.navbtn.on{background:#fff;color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.16);}
.navbtn .msy{font-size:19px;}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
.screen{animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.shead h1{font-size:22px;font-weight:800;letter-spacing:.3px;}
.shead p{color:var(--muted);font-size:13.5px;}
.pill{font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;position:relative;z-index:1;}
.kpi .lab{font-size:12.5px;color:var(--muted);margin-top:11px;}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .dt{font-size:12px;font-weight:700;margin-top:3px;}
.up{color:var(--ok);}.down{color:var(--bad);}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.grid1-1{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.card h3 .msy{font-size:20px;color:var(--accent);}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.chart{width:100%;height:290px;}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:13px;}
.col{background:#f1edfb;border:1px solid var(--line);border-radius:14px;padding:11px;}
.col-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px;margin-bottom:10px;padding:0 3px;}
.col-h .cnt{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent2);border-radius:999px;padding:1px 8px;}
.kc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(30,27,46,.05);cursor:grab;transition:.15s;}
.kc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(109,40,217,.14);}
.kc .no{font-size:11px;font-weight:700;color:var(--accent);}
.kc .tt{font-weight:700;font-size:14px;margin:2px 0 6px;}
.kc .meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.kc .amt{font-weight:800;font-size:13px;color:var(--ink);}
.kc .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;}
.t-led{background:#ede9fe;color:#6d28d9;}.t-out{background:#dcfce7;color:#15803d;}.t-ban{background:#dbeafe;color:#1d4ed8;}.t-3d{background:#fef3c7;color:#b45309;}
.av2{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:hover td{background:#faf8ff;}
.st{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
.s-ok{background:#dcfce7;color:#15803d;}.s-wait{background:#fef3c7;color:#b45309;}.s-rej{background:#fee2e2;color:#b91c1c;}.s-run{background:#e0e7ff;color:#4338ca;}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums;font-weight:600;}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.wo{display:flex;flex-direction:column;gap:12px;}
.wrow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;}
.wrow .nm{font-weight:700;font-size:13.5px;}
.wrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;}
.steps{display:flex;gap:6px;}
.step{flex:1;text-align:center;font-size:11px;padding:8px 4px;border-radius:9px;border:1px solid var(--line);color:var(--muted);}
.step.done{background:var(--accent-soft);border-color:#ddd0fb;color:var(--accent);font-weight:700;}
.step.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.step .msy{font-size:16px;display:block;margin-bottom:2px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.cal .dh{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0;}
.cell{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px 7px;}
.cell.dim{background:#faf9fd;color:#c3bdd6;}
.cell .dn{font-size:12px;font-weight:700;}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.ev{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.e-p{background:#ede9fe;color:#6d28d9;}.e-c{background:#fee2e2;color:#b91c1c;}.e-o{background:#dcfce7;color:#15803d;}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s;}
.fcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(109,40,217,.13);}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;position:relative;}
.thumb .ver{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;padding:2px 8px;border-radius:999px;}
.fbody{padding:11px 12px;}
.fbody .fn{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fbody .fm{font-size:11.5px;color:var(--muted);margin-top:3px;}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.note{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.note:last-child{border-bottom:0;}
.note .ni{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}
.note .nt{font-weight:700;font-size:13.5px;}
.note .nd{font-size:12.5px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:9px;height:9px;border-radius:50%;}
@media(max-width:1100px){.gal{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr;}
  .grid2,.grid1-1{grid-template-columns:1fr;}
  .wrow{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr;}
  .gal{grid-template-columns:1fr;}
  .navbtn .txt{display:none;}
  .navbtn{padding:9px 11px;}
  .brand small{display:none;}
}
</style>
</head>

function kpi(ic,lab,val,dt,dir,unit){

function v2(){

    var steps=w.steps.map(function(s,i){

    '<div class="shead"><h1>製作工單</h1><span class="pill">工序派工 · 現場報工</span><div class="hspacer"></div><p>拆解字體、LED、噴繪工序派工並追蹤現場製作進度</p></div>'+

function v3(){
  var head=CAL.head.map(function(h){return '<div class="dh">'+h+'</div>';}).join("");
  var cells=CAL.cells.map(function(c){
    if(c.dim && !c.d) return '<div class="cell dim"></div>';

    return '<div class="cell'+(c.today?' today':'')+'"><div class="dn">'+c.d+'</div>'+evs+'</div>';
  }).join("");
  var crew=CREW.map(function(c){
    return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px"><span>'+c.nm+'</span><span>'+c.load+' 案 · '+c.pct+'%</span></div><div class="bar"><i style="width:'+c.pct+'%"></i></div></div>';

    '<div class="shead"><h1>安裝排程</h1><span class="pill">車隊 · 吊車 · 高空作業</span><div class="hspacer"></div><p>安排施工日期與吊車班次，避免衝突與交期逾期</p></div>'+

      kpi("verified_user","準時交付率","91.4","+3.2","up","%")+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card"><h3><span class="msy">calendar_month</span>八月施工日曆</h3><div class="sub">紅=高空/吊車　綠=一般安裝　紫=現勘/木招牌</div><div style="overflow-x:auto"><div class="cal" style="min-width:640px">'+head+cells+'</div></div></div>'+
      '<div class="card"><h3><span class="msy">diversity_3</span>施工班負荷</h3><div class="sub">本週各班別案量與工時佔用</div>'+crew+

      '</div>'+
    '</div>'+
  '</div>';
}

  return '<div class="screen">'+
    '<div class="shead"><h1>營運報表</h1><span class="pill">漏斗 · 毛利 · 交期</span><div class="hspacer"></div><p>成交漏斗、案件毛利與交期達成率的整體檢視</p></div>'+

/* ============ CHARTS ============ */
var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
function mk(id){var d=el(id);if(!d)return null;var c=echarts.init(d);charts.push(c);return c;}
var PURPLE=["#6d28d9","#8b5cf6","#a78bfa","#c4b5fd","#7c3aed","#5b21b6"];

function drawCharts(i){
  if(i===1){
    var c=mk("c1");if(c)c.setOption({
      color:PURPLE,tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},
      series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],avoidLabelOverlap:true,itemStyle:{borderRadius:6,borderColor:"#fff",borderWidth:2},label:{show:false},data:[
        {value:42,name:"LED立體字"},{value:23,name:"燈箱看板"},{value:18,name:"噴繪帆布"},{value:11,name:"壓克力字"},{value:6,name:"造型招牌"}
      ]}]
    });
  }else if(i===2){
    var c2=mk("c2");if(c2)c2.setOption({
      color:["#8b5cf6"],grid:{left:74,right:24,top:14,bottom:20},
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
      xAxis:{type:"value",max:100,axisLabel:{formatter:"{value}%"}},
      yAxis:{type:"category",data:["出貨包裝","LED組裝","字體貼合","裁切成型","設計出圖"],axisLabel:{fontSize:11}},
      series:[{type:"bar",barWidth:16,itemStyle:{borderRadius:[0,6,6,0]},label:{show:true,position:"right",formatter:"{c}%"},data:[52,88,74,66,91]}]
    });
  }else if(i===5){
    var c3=mk("c3");if(c3)c3.setOption({
      color:PURPLE,tooltip:{trigger:"item",formatter:"{b}: {c}"},
      series:[{type:"funnel",left:"6%",right:"6%",top:10,bottom:10,minSize:"28%",gap:3,label:{color:"#1e1b2e",fontWeight:700},data:[
        {value:100,name:"詢價 100"},{value:68,name:"報價 68"},{value:41,name:"議價 41"},{value:34,name:"成交 34"},{value:31,name:"安裝完成 31"}
      ]}]
    });
    var c4=mk("c4");if(c4)c4.setOption({
      color:PURPLE,tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{bottom:0,textStyle:{fontSize:10}},
      grid:{left:40,right:16,top:16,bottom:44},
      xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"]},yAxis:{type:"value"},
      series:[
        {name:"LED字",type:"bar",stack:"a",data:[92,105,118,124,131,142]},
        {name:"燈箱",type:"bar",stack:"a",data:[58,61,66,70,72,78]},
        {name:"噴繪",type:"bar",stack:"a",data:[31,34,36,40,42,45]},
        {name:"壓克力/造型",type:"bar",stack:"a",itemStyle:{borderRadius:[4,4,0,0]},data:[19,21,24,26,27,31]}
      ]
    });
    var c5=mk("c5");if(c5)c5.setOption({
      tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},grid:{left:46,right:52,top:16,bottom:44},
      xAxis:{type:"category",boundaryGap:false,data:["3月","4月","5月","6月","7月","8月"]},
      yAxis:[{type:"value",name:"營收(萬)"},{type:"value",name:"毛利%",max:60,axisLabel:{formatter:"{value}%"}}],
      series:[
        {name:"月營收(萬)",type:"bar",barWidth:26,itemStyle:{color:"#c4b5fd",borderRadius:[5,5,0,0]},data:[200,221,244,260,272,286]},
        {name:"毛利率%",type:"line",yAxisIndex:1,smooth:true,symbolSize:8,lineStyle:{width:3,color:"#6d28d9"},itemStyle:{color:"#6d28d9"},data:[40,41.5,42.8,43.6,44.2,45.1]}
      ]
    });
  }
}

/* ============ SHOW ============ */
var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  disposeCharts();
  var app=el("app");
  app.innerHTML=RENDER[i]();
  document.querySelectorAll("#nav .navbtn").forEach(function(b){
    b.classList.toggle("on",+b.getAttribute("data-i")===i);
  });
  void app.offsetHeight;
  drawCharts(i);
}

(function(){
  el("nav").innerHTML=NAV.map(function(n){
    return '<button class="navbtn" data-i="'+n.i+'"><span class="msy">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }).join("");
  document.querySelectorAll("#nav .navbtn").forEach(function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  });
  show(0);
})();

window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
