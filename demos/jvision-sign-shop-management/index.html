:root{

  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#a13d00;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --shadow:0 8px 24px rgba(15,23,42,.07);

*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
.mono,.no,td:first-child{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.hbar{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:4px}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.hspacer{flex:1}
.huser{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;font-weight:600}
.av,.av2{display:grid;place-items:center;background:#dbeafe;color:#1e40af;font-weight:700}
.av{width:30px;height:30px;border-radius:50%}
nav{display:flex;gap:2px;padding:0 24px;overflow:auto;scrollbar-width:thin}
.navbtn{position:relative;display:flex;align-items:center;gap:7px;min-height:46px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:color .2s,background .2s}
.navbtn:hover{background:#eff6ff;color:var(--blue)}
.navbtn.on{color:var(--blue)}
.navbtn.on:after{content:"";position:absolute;right:12px;bottom:0;left:12px;height:3px;background:var(--blue)}
.navbtn .msy{font-size:19px}
main{max-width:1440px;margin:auto;padding:24px 24px 64px}
.screen{animation:enter .35s ease-out}
.shead{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.shead h1{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.03em}
.shead p{margin:4px 0 0;color:var(--muted);font-size:12px}
.pill,.tag,.st{display:inline-flex;align-items:center;font-weight:700}
.pill{padding:3px 8px;border:1px solid #bfdbfe;border-radius:3px;background:#eff6ff;color:#1d4ed8;font-size:10px;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{position:relative;padding:15px 16px;background:var(--color-card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:transform .2s,border-color .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);border-color:#bfdbfe;box-shadow:var(--shadow)}
.kpi .ic{position:absolute;top:14px;right:14px;color:#93c5fd;font-size:24px}
.kpi .lab{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{margin-top:5px;font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px}
.kpi .dt{margin-top:4px;font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.grid1-1{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:16px;background:var(--color-card);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 5px rgba(15,23,42,.03)}
.card h3{display:flex;align-items:center;gap:7px;margin:0 0 2px;font-size:14px}
.card h3 .msy{color:var(--blue);font-size:20px}
.card .sub{margin-bottom:13px;color:var(--muted);font-size:11px}
.chart{width:100%;height:290px}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:9px}
.col{padding:9px;background:#f1f5f9;border-top:3px solid #94a3b8}
.col-h{display:flex;justify-content:space-between;padding:2px 3px 9px;font-size:12px;font-weight:700}
.cnt{min-width:22px;padding:1px 7px;background:#334155;color:#fff;text-align:center;border-radius:99px;font-family:"Fira Code",monospace;font-size:10px}
.kc{margin-bottom:8px;padding:10px 11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:3px;box-shadow:0 1px 2px rgba(15,23,42,.04);cursor:grab;transition:transform .2s,box-shadow .2s,border-color .2s}
.kc:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 7px 16px rgba(37,99,235,.11)}
.kc .no{color:#1d4ed8;font-size:10px;font-weight:700}
.kc .tt{margin:3px 0 7px;font-size:13px;font-weight:700}
.meta,.foot{display:flex;align-items:center;gap:7px}
.meta{flex-wrap:wrap;color:var(--muted);font-size:10px}
.amt{margin-left:auto;color:var(--ink);font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.foot{justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.av2{width:23px;height:23px;border-radius:50%;font-size:10px}
.tag{padding:2px 6px;border-radius:3px;font-size:9px}
.t-led{background:#dbeafe;color:#1e40af}.t-out{background:#dcfce7;color:#166534}.t-ban{background:#e0e7ff;color:#3730a3}.t-3d{background:#ffedd5;color:#9a3412}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 10px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;color:#334155;text-align:left;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td:nth-child(5),th:nth-child(5){text-align:right}
tbody tr{transition:background .18s}
tbody tr:hover{background:#eff6ff}
.st{gap:4px;padding:3px 7px;border-radius:3px;font-size:10px}
.st:before{font-family:"Material Symbols Outlined";font-size:13px}
.s-ok{background:#dcfce7;color:#166534}.s-ok:before{content:"check_circle"}
.s-wait{background:#fef3c7;color:#92400e}.s-wait:before{content:"schedule"}
.s-rej{background:#fee2e2;color:#991b1b}.s-rej:before{content:"cancel"}
.s-run{background:#dbeafe;color:#1e40af}.s-run:before{content:"info"}
.bar{height:7px;overflow:hidden;background:#e2e8f0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue)}
.wo{display:flex;flex-direction:column;gap:10px}
.wrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.nm{font-size:12px;font-weight:700}
.nm small{display:block;color:var(--muted);font-family:"Fira Code",monospace;font-size:9px;font-weight:500}
.steps{display:flex;gap:4px}
.step{flex:1;padding:7px 3px;border:1px solid var(--line);border-radius:3px;color:var(--muted);text-align:center;font-size:9px}
.step.done{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;font-weight:700}
.step.cur{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.step .msy{display:block;margin-bottom:2px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{padding:3px;text-align:center;color:var(--muted);font-size:10px;font-weight:700}
.cell{min-height:92px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:3px}
.cell.dim{background:#f8fafc}
.dn{font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.cell.today{border:2px solid var(--blue);background:#eff6ff}
.ev{margin-top:4px;padding:2px 5px;overflow:hidden;border-left:3px solid currentColor;border-radius:2px;font-size:9px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.e-p{background:#ffedd5;color:#9a3412}.e-c{background:#fee2e2;color:#991b1b}.e-o{background:#dcfce7;color:#166534}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fcard{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:5px;transition:transform .2s,border-color .2s,box-shadow .2s}
.fcard:hover{transform:translateY(-3px);border-color:#93c5fd;box-shadow:var(--shadow)}
.thumb{position:relative;display:grid;height:104px;place-items:center;color:#fff;font-size:36px}
.ver{position:absolute;top:7px;right:7px;padding:2px 6px;background:rgba(15,23,42,.78);border-radius:2px;font-family:"Fira Code",monospace;font-size:9px}
.fbody{padding:10px}
.fn{overflow:hidden;font-size:11px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.fm{margin-top:4px;color:var(--muted);font-size:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 11px;background:#fff;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:#93c5fd;color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.note{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.ni{display:grid;width:30px;height:30px;flex:none;place-items:center;border-radius:3px;color:#fff}
.nt{font-size:12px;font-weight:700}.nd{color:var(--muted);font-size:11px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.gal{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .hbar{padding:0 16px}.huser{font-size:0}nav{padding:0 12px}main{padding:18px 14px 48px}
  .kpis{grid-template-columns:1fr 1fr}.grid2,.grid1-1{grid-template-columns:1fr}.wrow{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand small{display:none}.brand{font-size:14px}.hbar{height:58px}.navbtn{padding:0 12px}.navbtn .txt{display:none}
  .shead{display:grid;grid-template-columns:1fr auto}.shead p{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr;gap:7px}
  .kpi{padding:12px}.kpi .val{font-size:21px}.gal{grid-template-columns:1fr}.card{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .screen,.kpi:hover,.kc:hover,.fcard:hover{transform:none}
}
</style>

var cards=c.items.map(function(k){return'<div class="kc" tabindex="0"><div class="no">'+k.no+'</div><div class="tt">'+k.tt+'</div><div class="meta"><span class="tag '+tagName[k.type]+'">'+k.tp+'</span><span class="amt">'+k.amt+'</span></div><div class="foot"><span style="font-size:10px;color:var(--muted)"><span class="msy" style="font-size:13px">schedule</span> '+k.days+'</span><span class="av2">'+k.w+'</span></div></div>'}).join("");
return'<div class="col"><div class="col-h"><span>'+c.k+'</span><span class="cnt">'+c.items.length+'</span></div>'+cards+'</div>'}).join("");
return shell("案件看板","SIGNCRAFT Pipeline","拖曳卡片管理招牌案件從詢價到安裝的每個階段",
'<div class="kpis">'+kpi("inbox","本月新詢價","38","+12","up","單")+kpi("handshake","成交轉化率","34.2","+4.1","up","%")+kpi("payments","進行中案件金額","1.28","+0.3","up","M")+kpi("timer","平均成交天數","11.6","-2.4","up","天")+'</div>'+
'<div class="card"><h3><span class="msy">view_kanban</span>招牌案件流程看板</h3><div class="sub">共 '+totalItems()+' 件在途 · 依招牌類型顏色與文字標記</div><div style="overflow-x:auto"><div class="board">'+cols+'</div></div><div class="legend"><span><i class="dot" style="background:#2563eb"></i>LED立體字</span><span><i class="dot" style="background:#15803d"></i>噴繪帆布</span><span><i class="dot" style="background:#3730a3"></i>燈箱看板</span><span><i class="dot" style="background:#c2410c"></i>壓克力/造型</span></div></div>')}

function v1(){
var rows=QUOTES.map(function(q){var gp=Math.round((q.amt-q.cost)/q.amt*100);return'<tr><td class="mono">'+q.id+'</td><td><b>'+q.cust+'</b></td><td>'+q.item+'</td><td><span class="tag t-led">'+q.tpl+'</span></td><td class="mono">NT$ '+nfmt(q.amt)+'</td><td><div style="display:flex;align-items:center;gap:7px"><div class="bar" style="width:64px"><i style="width:'+gp+'%"></i></div><b class="mono">'+gp+'%</b></div></td><td><span class="st '+q.cls+'">'+q.st+'</span></td></tr>'}).join("");
return shell("報價與合約","模板 + 電子簽核","依招牌類型套用報價模板，核算毛利並完成合約簽核",
'<div class="kpis">'+kpi("description","待審核報價","7","+2","down","件")+kpi("verified","本月核准率","78","+6","up","%")+kpi("percent","平均毛利率","44.8","+1.9","up","%")+kpi("draw","電子簽核完成","23","+9","up","份")+'</div>'+
'<div class="grid2"><div class="card"><h3><span class="msy">request_quote</span>報價單審核清單</h3><div class="sub">套用模板自動帶入材料、工資與安裝費</div><div style="overflow-x:auto"><table><thead><tr><th>報價單號</th><th>客戶</th><th>品項</th><th>套用模板</th><th>報價金額</th><th>毛利</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h3><span class="msy">donut_large</span>報價金額分布</h3><div class="sub">近 6 個月依招牌類型</div><div id="c1" class="chart" style="height:320px"></div></div></div>')}

function v2(){
var rows=WORK.map(function(w){var steps=w.steps.map(function(s,i){var cls=i<w.cur?"done":i===w.cur?"cur":"";var ic=i<w.cur?"check_circle":i===w.cur?"autorenew":"radio_button_unchecked";return'<div class="step '+cls+'"><span class="msy">'+ic+'</span>'+s+'</div>'}).join("");return'<div class="wrow"><div class="nm">'+w.nm+'<small>'+w.no+' · '+w.sub+'</small></div><div style="overflow-x:auto"><div class="steps" style="min-width:420px">'+steps+'</div></div></div>'}).join("");
return shell("製作工單","工序派工 · 現場報工","拆解字體、LED、噴繪工序派工並追蹤現場製作進度",
'<div class="kpis">'+kpi("build_circle","製作中工單","14","+3","up","張")+kpi("done_all","今日完工","5","+1","up","張")+kpi("warning","逾期工序","2","-1","up","項")+kpi("engineering","現場報工次數","46","+11","up","次")+'</div>'+
'<div class="grid2"><div class="card"><h3><span class="msy">precision_manufacturing</span>工單製程進度</h3><div class="sub">目前工序以藍底標記 · 已完成以淡藍底與完成圖示標記</div><div class="wo">'+rows+'</div></div><div class="card"><h3><span class="msy">bar_chart</span>各工站負荷</h3><div class="sub">今日各製程工時佔用率</div><div id="c2" class="chart" style="height:330px"></div></div></div>')}

function v3(){
var head=CAL.head.map(function(h){return'<div class="dh">'+h+'</div>'}).join("");
var cells=CAL.cells.map(function(c){if(c.dim&&!c.d)return'<div class="cell dim"></div>';var evs=(c.ev||[]).map(function(e){return'<div class="ev '+e.c+'">'+e.t+'</div>'}).join("");return'<div class="cell'+(c.today?" today":"")+'"><div class="dn">'+c.d+'</div>'+evs+'</div>'}).join("");
var crew=CREW.map(function(c){return'<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px"><span>'+c.nm+'</span><span class="mono">'+c.load+' 案 · '+c.pct+'%</span></div><div class="bar"><i style="width:'+c.pct+'%"></i></div></div>'}).join("");
return shell("安裝排程","車隊 · 吊車 · 高空作業","安排施工日期與吊車班次，避免衝突與交期逾期",
'<div class="kpis">'+kpi("event","本週安裝場次","9","+2","up","場")+kpi("local_shipping","吊車出勤","4","0","up","台次")+kpi("running_with_errors","衝突提醒","1","-2","up","筆")+kpi("verified_user","準時交付率","91.4","+3.2","up","%")+'</div>'+
'<div class="grid2"><div class="card"><h3><span class="msy">calendar_month</span>八月施工日曆</h3><div class="sub">紅=高空/吊車　綠=一般安裝　橙=現勘/木招牌</div><div style="overflow-x:auto"><div class="cal" style="min-width:640px">'+head+cells+'</div></div></div><div class="card"><h3><span class="msy">diversity_3</span>施工班負荷</h3><div class="sub">本週各班別案量與工時佔用</div>'+crew+'<div class="note" style="border-top:1px solid var(--line);margin-top:6px"><div class="ni" style="background:var(--warn)"><span class="msy">warning</span></div><div><div class="nt">8/16 排程衝突</div><div class="nd">昇陽汽車吊車施工與O福建設現勘同時段，建議調整 A 班。</div></div></div></div></div>')}

function v4(){
var chips='<div class="chips"><span class="chip on" tabindex="0">全部</span><span class="chip" tabindex="0">設計稿</span><span class="chip" tabindex="0">現勘</span><span class="chip" tabindex="0">施工圖</span><span class="chip" tabindex="0">驗收</span></div>';
var cards=FILES.map(function(f){return'<div class="fcard" tabindex="0"><div class="thumb" style="background:linear-gradient(135deg,'+f.bg+',#60a5fa)"><span class="msy">'+f.ic+'</span><span class="ver">'+f.ver+'</span></div><div class="fbody"><div class="fn">'+f.fn+'</div><div class="fm"><span class="tag t-led">'+f.cat+'</span> · '+f.sz+'</div><div class="fm"><span class="msy" style="font-size:13px">person</span> '+f.who+'</div></div></div>'}).join("");
return shell("設計檔案庫","版本控管","設計稿、現勘照與驗收檔集中管理並保留版本歷程",
'<div class="kpis">'+kpi("folder","檔案總數","1,284","+56","up","")+kpi("history","本月新版本","39","+14","up","版")+kpi("cloud_done","已同步雲端","99.2","+0.3","up","%")+kpi("photo_camera","驗收照片","417","+61","up","張")+'</div>'+chips+'<div class="gal">'+cards+'</div>')}

function v5(){
return shell("營運報表","漏斗 · 毛利 · 交期","成交漏斗、案件毛利與交期達成率的整體檢視",
'<div class="kpis">'+kpi("payments","本月營收","2.86","+0.42","up","M")+kpi("trending_up","毛利率","45.1","+2.3","up","%")+kpi("filter_alt","詢價→成交","34.2","+4.1","up","%")+kpi("schedule","交期達成率","91","+9","up","%")+'</div>'+
'<div class="grid1-1"><div class="card"><h3><span class="msy">filter_alt</span>成交漏斗</h3><div class="sub">從詢價到安裝完成的轉化</div><div id="c3" class="chart"></div></div><div class="card"><h3><span class="msy">stacked_bar_chart</span>各招牌類型月營收</h3><div class="sub">近 6 個月 · 單位萬元</div><div id="c4" class="chart"></div></div></div><div class="card" style="margin-top:12px"><h3><span class="msy">insights</span>營收與毛利趨勢</h3><div class="sub">近 6 個月營收與毛利率</div><div id="c5" class="chart" style="height:300px"></div></div>')}

var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id){var d=el(id);if(!d)return null;var c=echarts.init(d);charts.push(c);return c}
var BLUE=["#2563eb","#3b82f6","#60a5fa","#93c5fd","#ea580c","#15803d"];
var baseText={fontFamily:"Fira Sans",color:"#475569"};
function drawCharts(i){
if(i===1){var c=mk("c1");if(c)c.setOption({color:BLUE,textStyle:baseText,tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:10,color:"#475569"}},series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],itemStyle:{borderRadius:3,borderColor:"#fff",borderWidth:2},label:{show:false},data:[{value:42,name:"LED立體字"},{value:23,name:"燈箱看板"},{value:18,name:"噴繪帆布"},{value:11,name:"壓克力字"},{value:6,name:"造型招牌"}]}]})}
else if(i===2){var c2=mk("c2");if(c2)c2.setOption({color:["#2563eb"],textStyle:baseText,grid:{left:74,right:28,top:14,bottom:20},tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},xAxis:{type:"value",max:100,axisLabel:{formatter:"{value}%"}},yAxis:{type:"category",data:["出貨包裝","LED組裝","字體貼合","裁切成型","設計出圖"],axisLabel:{fontSize:10}},series:[{type:"bar",barWidth:15,itemStyle:{borderRadius:[0,2,2,0]},label:{show:true,position:"right",formatter:"{c}%"},data:[52,88,74,66,91]}]})}
else if(i===5){
var c3=mk("c3");if(c3)c3.setOption({color:BLUE,textStyle:baseText,tooltip:{trigger:"item",formatter:"{b}: {c}"},series:[{type:"funnel",left:"6%",right:"6%",top:10,bottom:10,minSize:"28%",gap:3,label:{color:"#1e293b",fontWeight:700},data:[{value:100,name:"詢價 100"},{value:68,name:"報價 68"},{value:41,name:"議價 41"},{value:34,name:"成交 34"},{value:31,name:"安裝完成 31"}]}]});
var c4=mk("c4");if(c4)c4.setOption({color:BLUE,textStyle:baseText,tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{bottom:0,textStyle:{fontSize:9}},grid:{left:40,right:16,top:16,bottom:44},xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"]},yAxis:{type:"value"},series:[{name:"LED字",type:"bar",stack:"a",data:[92,105,118,124,131,142]},{name:"燈箱",type:"bar",stack:"a",data:[58,61,66,70,72,78]},{name:"噴繪",type:"bar",stack:"a",data:[31,34,36,40,42,45]},{name:"壓克力/造型",type:"bar",stack:"a",data:[19,21,24,26,27,31]}]});
var c5=mk("c5");if(c5)c5.setOption({textStyle:baseText,tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:10}},grid:{left:46,right:52,top:16,bottom:44},xAxis:{type:"category",boundaryGap:false,data:["3月","4月","5月","6月","7月","8月"]},yAxis:[{type:"value",name:"營收(萬)"},{type:"value",name:"毛利%",max:60,axisLabel:{formatter:"{value}%"}}],series:[{name:"月營收(萬)",type:"bar",barWidth:25,itemStyle:{color:"#93c5fd",borderRadius:[2,2,0,0]},data:[200,221,244,260,272,286]},{name:"毛利率%",type:"line",yAxisIndex:1,smooth:true,symbolSize:7,lineStyle:{width:3,color:"#ea580c"},itemStyle:{color:"#ea580c"},data:[40,41.5,42.8,43.6,44.2,45.1]}]})}}

var RENDER=[v0,v1,v2,v3,v4,v5],current=-1;
function show(i){
i=Math.max(0,Math.min(i,RENDER.length-1));
if(i===current&&el("app").innerHTML)return;
current=i;disposeCharts();el("app").innerHTML=RENDER[i]();
document.querySelectorAll("#nav .navbtn").forEach(function(b){var on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
requestAnimationFrame(function(){drawCharts(i)})}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0);try{window.scrollTo(0,0)}catch(e){}}
el("nav").innerHTML=NAV.map(function(n){return'<button type="button" class="navbtn" data-i="'+n.i+'"><span class="msy" aria-hidden="true">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>'}).join("");
document.querySelectorAll("#nav .navbtn").forEach(function(b){b.addEventListener("click",function(){var target="v"+b.dataset.i;if(location.hash.slice(1)===target){show(+b.dataset.i);window.scrollTo(0,0)}else location.hash=target})});
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize()}catch(e){}})});
fromHash();
</script>
</body>
