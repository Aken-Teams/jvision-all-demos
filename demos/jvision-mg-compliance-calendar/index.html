<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>法定申報時程與合規行事曆 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#E8F1F4;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#E8F1F4;
  --hov:#F0FDFA;
  --track:#D5E7E8;
  --sidebar:#134E4A;
  --sidebar2:#134E4A;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0F766E;
  --r:6px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums lining-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  margin:0;
  color:inherit;
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:none;
  flex-direction:column;
  width:252px;
  min-width:0;
  height:100vh;
  padding:20px 16px;
  overflow-y:auto;
  color:#F0FDFA;
  background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:4px 6px 24px;
  border-bottom:1px solid rgba(94,234,212,.42);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:var(--color-on-secondary);
  background:var(--color-secondary);
  border:2px solid #99F6E4;
  border-radius:4px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#FFFFFF;font-size:18px;line-height:1.15;letter-spacing:.03em}
.brand-txt span{
  display:block;
  margin-top:3px;
  color:#CCFBF1;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:500;
  letter-spacing:.12em;
  white-space:nowrap;
}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:18px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-width:0;
  min-height:44px;
  padding:10px 11px;
  color:#CCFBF1;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button .txt{overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:700}
.nav button .idx{
  margin-left:auto;
  color:#99F6E4;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.08em;
}
.nav button:hover{color:#FFFFFF;background:#0F766E;border-color:#2DD4BF}
.nav button.on{
  color:#042F2E;
  background:var(--color-secondary);
  border-color:#99F6E4;
}
.nav button.on::before{
  content:"";
  position:absolute;
  top:8px;
  bottom:8px;
  left:-17px;
  width:4px;
  background:var(--color-accent);
}
.nav button.on .idx{color:#134E4A}
.side-foot{
  margin-top:auto;
  padding:15px 7px 2px;
  color:#CCFBF1;
  border-top:1px solid rgba(94,234,212,.42);
  font-size:12px;
  line-height:1.65;
}
.side-foot b{color:#FFFFFF;font-family:"Cinzel",serif}

.main{flex:1;min-width:0;padding:24px 28px 56px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
  padding:0 0 18px;
  border-bottom:2px solid var(--color-border);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:#134E4A;
  font-size:26px;
  line-height:1.12;
  letter-spacing:.01em;
}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:27px}
.topbar .sub{margin-top:5px;color:var(--color-muted-foreground);font-size:13px;font-weight:500}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:#334155;
  background:var(--color-card);
  border:1px solid #99DCD3;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #DCFCE7;
  border-radius:50%;
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#000000;
  background:var(--color-secondary);
  border:2px solid var(--color-primary);
  border-radius:4px;
  font-weight:700;
}

#screen{animation:screen-in 350ms ease both}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid #99DCD3;
  border-radius:var(--r);
  box-shadow:none;
}
.card,.sec{padding:16px}
.sec{margin-bottom:12px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:#134E4A;
  font-size:17px;
  line-height:1.25;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px;
}
.card-h .hint{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.sec>h3{margin-bottom:12px}
.sec>p{margin:0 0 12px;color:var(--color-muted-foreground);font-size:14px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:14px}
.dl dt{color:var(--color-muted-foreground);font-size:13px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat{position:relative;overflow:hidden;padding:15px 16px;border-top:4px solid var(--color-primary)}
.kpi::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:34px;
  height:34px;
  background:var(--accent-soft);
  border-bottom:1px solid var(--color-border);
  border-left:1px solid var(--color-border);
}
.kpi .ico{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#115E59;
  background:var(--accent-soft);
  border:1px solid var(--color-border);
  border-radius:4px;
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-primary);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:#134E4A;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:25px;
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.2;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--color-muted-foreground);font-size:13px;font-weight:600}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:6px;
  font-size:12px;
  font-weight:700;
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.tile{
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:15px 16px;
  border-top:4px solid var(--color-primary);
  transition:background-color 180ms ease,border-color 180ms ease;
}
.tile:hover{background:#F8FFFE;border-color:var(--color-primary)}
.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#115E59;
  background:var(--accent-soft);
  border:1px solid var(--color-border);
  border-radius:4px;
}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:16px;line-height:1.2}
.tile p{margin:0;color:var(--color-muted-foreground);font-size:12px;line-height:1.55}

.card.pad0>.card-h{padding:15px 16px 0!important}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:10px 13px;
  color:#334155;
  text-align:left;
  white-space:nowrap;
  background:var(--color-muted);
  border-top:1px solid #B7DADB;
  border-bottom:2px solid var(--color-primary);
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
td{
  padding:10px 13px;
  color:#1E3A3A;
  white-space:nowrap;
  border-bottom:1px solid #CDE3E2;
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color 160ms ease}
tbody tr:hover{background:var(--color-background)}
td b{font-variant-numeric:tabular-nums lining-nums}
.mono{
  font-family:"Cinzel",ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:12px;
  font-weight:600;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums lining-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:2px 8px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:999px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:10px;
  font-weight:700;
}
.tag::before{content:"";width:6px;height:6px;flex:none;background:currentColor;border-radius:50%}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-info{color:#115E59;background:#F0FDFA}
.t-gray{color:#475569;background:#F8FAFC}
.t-acc,.t-pink{color:#115E59;background:#ECFDF5}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #B8D3D3;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{
  width:40px;
  flex:none;
  color:#334155;
  text-align:right;
  font-family:"Cinzel",ui-monospace,monospace;
  font-size:10px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:#99DCD3}
.tl-item,.tl-i{position:relative;padding:0 0 16px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-23px;
  width:13px;
  height:13px;
  background:#FFFFFF;
  border:3px solid var(--color-primary);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--color-muted-foreground);font-family:"Cinzel",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--color-muted-foreground);font-size:12px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #99DCD3;font-size:13px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:#475569}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--color-muted-foreground);font-size:11px}
.note{margin-top:12px;padding-top:11px;color:var(--color-muted-foreground);border-top:1px dashed #99DCD3;font-size:12px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--color-muted);border:1px solid #99DCD3;border-radius:4px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:13px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:#334155;background:#FFFFFF;border:1px solid #99DCD3;border-radius:999px;font-size:10px}
.pcard{padding:10px 11px;background:#FFFFFF;border:1px solid #99DCD3;border-left:4px solid var(--color-primary);border-radius:3px}
.pcard b{font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{
  display:inline-flex;
  flex:none;
  align-items:center;
  justify-content:center;
  color:#115E59;
  background:var(--accent-soft);
  border:1px solid var(--color-border);
  border-radius:3px;
  font-weight:700;
}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 13px;background:#FFFFFF;border:1px solid #99DCD3;border-radius:4px}
.lane-row .num{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:31px;
  height:31px;
  color:#115E59;
  background:var(--accent-soft);
  border:1px solid var(--color-border);
  border-radius:3px;
  font-family:"Cinzel",serif;
  font-size:12px;
  font-weight:600;
}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:15px}
.lane-row .body p{margin:2px 0 0;color:var(--color-muted-foreground);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:23px;height:23px;color:#64748B;background:#FFFFFF;border:2px solid #AFCACA;border-radius:50%;font-size:10px}
.steps .ln{width:20px;height:2px;background:#AFCACA}
.steps .s.done{color:#000000;background:var(--color-secondary);border-color:var(--color-primary)}
.steps .s.cur{color:#115E59;border-color:var(--color-primary);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 4px;border-bottom:1px dashed #99DCD3}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--color-muted-foreground);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border:1px solid #B8D3D3;border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--color-muted-foreground);text-align:right;font-family:"Cinzel",monospace;font-size:9px}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border:1px solid #B8D3D3;border-radius:3px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--color-primary);border:1px solid #115E59;border-radius:2px}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important;fill:#475569!important;color:#475569!important}
.apexcharts-gridline{stroke:#CDE3E2!important}
.apexcharts-tooltip{border:1px solid #99DCD3!important;border-radius:3px!important;box-shadow:none!important}
.apexcharts-tooltip-title{background:var(--color-muted)!important;border-bottom:1px solid #99DCD3!important}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.48}}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{
    position:sticky;
    top:18px;
    grid-column:2;
    grid-row:1 / span 99;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #screen>.grid.g4:first-child>*{width:100%}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    position:static;
    width:100%;
    height:auto;
    padding:10px 14px;
    border-right:0;
    border-bottom:4px solid var(--color-secondary);
  }
  .brand{padding:2px 4px 10px;border-bottom:0}
  .brand-logo{width:38px;height:38px}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
