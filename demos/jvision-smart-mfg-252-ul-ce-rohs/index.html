<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>法規認證管理系統（UL/CE/RoHS等）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa;
  --bg:#0d0b1a; --panel:#171331; --panel2:#1f1a3d; --line:#2c2653;
  --txt:#ece9fb; --mut:#a7a0cf; --dim:#6f68a0;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Inter","Noto Sans TC",sans-serif;overflow-x:hidden;}
body{min-width:0;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;
  font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}

.nav{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#120f26,#1a1540);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:10px 18px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 0 18px rgba(124,58,237,.5);}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500;}
.navtabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;
  background:transparent;border:1px solid transparent;color:var(--mut);
  cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap;
  transition:.15s;}
.tab:hover{background:var(--panel2);color:var(--txt);}
.tab.on{background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff;
  border-color:var(--accent2);box-shadow:0 3px 14px rgba(124,58,237,.4);}
.tab .material-symbols-outlined{font-size:19px;}

main{padding:20px;max-width:1400px;margin:0 auto;min-width:0;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:16px;min-width:0;}
.head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;}
.head p{margin:4px 0 0;color:var(--mut);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 8px var(--ok);}

.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
.grid>*{min-width:0;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;
  gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.sub{color:var(--dim);font-size:11px;font-weight:600;}

.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;
  overflow:hidden;min-width:0;}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;
  border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.35),transparent 70%);}
.kpi .k-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:rgba(124,58,237,.18);color:var(--accent2);margin-bottom:9px;}
.kpi .k-ico .material-symbols-outlined{font-size:21px;}
.kpi .k-val{font-size:26px;font-weight:800;letter-spacing:.5px;}
.kpi .k-lab{color:var(--mut);font-size:12px;font-weight:600;margin-top:2px;}
.kpi .k-tag{margin-top:8px;font-size:11px;font-weight:700;display:inline-flex;
  align-items:center;gap:4px;}
.up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--warn);}

.tbl-wrap{overflow-x:auto;border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  position:sticky;top:0;background:var(--panel);}
tbody tr:hover{background:var(--panel2);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;border:1px solid transparent;}
.b-ok{background:rgba(52,211,153,.14);color:var(--ok);border-color:rgba(52,211,153,.3);}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.3);}
.b-bad{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.3);}
.b-info{background:rgba(96,165,250,.14);color:var(--info);border-color:rgba(96,165,250,.3);}
.b-mut{background:rgba(167,160,207,.12);color:var(--mut);border-color:var(--line);}

.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;
  background:rgba(124,58,237,.16);color:var(--accent2);}

.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:70px;}
.bar>i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;
  font-weight:700;margin-bottom:9px;color:var(--mut);}
.col-h .cnt{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:1px 8px;font-size:11px;}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;
  margin-bottom:9px;border-left:3px solid var(--accent);}
.tk .t-t{font-weight:700;font-size:13px;}
.tk .t-m{color:var(--dim);font-size:11px;margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;}

.tl{position:relative;padding-left:20px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;
  background:var(--line);}
.tl-i{position:relative;padding:0 0 16px 6px;}
.tl-i::before{content:"";position:absolute;left:-17px;top:3px;width:11px;height:11px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg);
  box-shadow:0 0 0 2px var(--accent);}
.tl-i.done::before{background:var(--ok);box-shadow:0 0 0 2px var(--ok);}
.tl-i.now::before{background:var(--warn);box-shadow:0 0 0 2px var(--warn);}
.tl-t{font-weight:700;font-size:13px;}
.tl-d{color:var(--dim);font-size:11px;margin-top:2px;}

.chart{width:100%;overflow:hidden;min-width:0;}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

.flag{font-size:15px;}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;}

.miniStat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.miniStat:last-child{border-bottom:none;}
.miniStat .ms-ico{width:32px;height:32px;border-radius:9px;flex:none;display:flex;
  align-items:center;justify-content:center;background:var(--panel2);color:var(--accent2);}
.miniStat .ms-t{font-size:13px;font-weight:600;flex:1;min-width:0;}
.miniStat .ms-v{font-size:13px;font-weight:800;text-align:right;}

@media(max-width:560px){
  .tab span.txt{display:none;}
  .tab{padding:8px 10px;}
  main{padding:14px;}
  .head h1{font-size:18px;}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">verified</span></div>
    <div>
      <b>CertGuard 認證管理</b>
      <small>UL / CE / FCC / RoHS 全球合規控制台</small>
    </div>
  </div>
  <div class="navtabs" id="tabs"></div>
</nav>
<main>
  <div id="app"></div>
</main>

<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;
  var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,
    animations:{enabled:false},foreColor:"#a7a0cf",toolbar:{show:false},
    background:"transparent"};
  opt.chart=Object.assign({},baseChart,opt.chart||{});
  if(!opt.grid)opt.grid={borderColor:"#2c2653"};
  if(!opt.tooltip)opt.tooltip={theme:"dark"};
  var c=new ApexCharts(el,opt);c.render();charts.push(c);}

var NAV=[
  {i:0,ic:"gavel",t:"認證標準庫"},
  {i:1,ic:"fact_check",t:"送測申請"},
  {i:2,ic:"monitoring",t:"進度看板"},
  {i:3,ic:"history",t:"到期管控"},
  {i:4,ic:"science",t:"測試報告"},
  {i:5,ic:"shield",t:"出貨合規"}
];

function headHtml(h1,p,tag){
  return '<div class="head"><div><h1>'+h1+'</h1><p>'+p+'</p></div>'+
    '<span class="pill"><span class="dot"></span>'+tag+'</span></div>';
}
function kpi(ic,val,lab,tag,cls){
  return '<div class="kpi"><div class="k-ico"><span class="material-symbols-outlined">'+ic+
    '</span></div><div class="k-val">'+val+'</div><div class="k-lab">'+lab+'</div>'+
    '<div class="k-tag '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+
    (cls==="up"?"trending_up":cls==="down"?"trending_down":"remove")+'</span>'+tag+'</div></div>';
}
function barHtml(pct){return '<div class="bar"><i style="width:'+pct+'%"></i></div>';}

/* SCREEN 0 : 認證標準庫 */
function s0(){
  var std=[
    {c:"UL",m:"美國",f:"🇺🇸",n:"UL 62368-1",d:"影音/資通設備安全",items:34,cls:"b-info"},
    {c:"CE",m:"歐盟",f:"🇪🇺",n:"EN 55032 / EN 55035",d:"EMC 電磁相容",items:28,cls:"b-ok"},
    {c:"RoHS",m:"歐盟",f:"🇪🇺",n:"EN IEC 63000",d:"有害物質限用(10項)",items:10,cls:"b-warn"},
    {c:"FCC",m:"美國",f:"🇺🇸",n:"FCC Part 15B",d:"無意輻射體",items:12,cls:"b-info"},
    {c:"CB",m:"IEC",f:"🌐",n:"IEC 62368-1",d:"國際互認證書",items:34,cls:"b-mut"},
    {c:"CCC",m:"中國",f:"🇨🇳",n:"GB 4943.1",d:"強制性產品認證",items:22,cls:"b-bad"},
    {c:"PSE",m:"日本",f:"🇯🇵",n:"J62368-1",d:"電氣用品安全",items:19,cls:"b-mut"},
    {c:"BSMI",m:"台灣",f:"🇹🇼",n:"CNS 15598-1",d:"商品檢驗",items:18,cls:"b-ok"}
  ];
  var rows="";
  for(var i=0;i<std.length;i++){var s=std[i];
    rows+='<tr><td><span class="badge '+s.cls+'">'+s.c+'</span></td>'+
      '<td><span class="flag">'+s.f+'</span> '+s.m+'</td>'+
      '<td class="mono">'+s.n+'</td><td>'+s.d+'</td>'+
      '<td class="mono">'+s.items+' 測項</td>'+
      '<td><span class="badge b-ok">現行版</span></td></tr>';
  }
  var h=headHtml("認證標準庫","各國法規標準、適用測項與版本對照","資料庫已同步 · 8 標準體系");
  h+='<div class="grid g4" style="margin-bottom:14px">'+
    kpi("gavel","8","涵蓋認證體系","+2 本季新增","up")+
    kpi("public","24","涵蓋銷售國別","覆蓋主要市場","flat")+
    kpi("rule","177","標準測項總數","已建索引","up")+
    kpi("update","6","版本更新待評估","EN 55032 改版","down")+
    '</div>';
  h+='<div class="grid g23">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">gavel</span>標準清單</h3>'+
    '<div class="tbl-wrap"><table><thead><tr><th>認證</th><th>市場</th><th>標準編號</th>'+
    '<th>適用範圍</th><th>測項</th><th>版本狀態</th></tr></thead><tbody>'+rows+
    '</tbody></table></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>測項分佈</h3>'+
    '<div id="c0a" class="chart"></div></div>';
  h+='</div>';
  document.getElementById("app").innerHTML=h;
  void document.getElementById("app").offsetHeight;
  mk("c0a",{
    series:[34,28,10,12,22,19],
    labels:["安全","EMC","RoHS","FCC","CCC","其他"],
    chart:{type:"donut",height:300},
    colors:["#7c3aed","#a78bfa","#fbbf24","#60a5fa","#f87171","#34d399"],
    stroke:{colors:["#171331"],width:2},
    legend:{position:"bottom"},
    dataLabels:{enabled:true,style:{fontSize:"11px"}},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,
      label:"總測項",color:"#a7a0cf",formatter:function(){return "177";}}}}}}
  });
}

/* SCREEN 1 : 送測申請 */
function s1(){
  var steps=[
    {t:"標準比對完成",r:"研發專案管理師",done:true,d:"08/02 · 適用 UL/CE/RoHS 已確認"},
    {t:"申請文件備齊",r:"研發專案管理師",done:true,d:"08/05 · BOM、規格書、樣品清單"},
    {t:"實驗室指派",r:"研發經理",now:true,d:"08/08 · 待指派 TÜV 或 UL 官方"},
    {t:"送測收件簽核",r:"研發經理",d:"預計 08/10"},
    {t:"樣品寄送",r:"研發專案管理師",d:"預計 08/12"}
  ];
  var tl="";
  for(var i=0;i<steps.length;i++){var s=steps[i];
    tl+='<div class="tl-i '+(s.done?"done":s.now?"now":"")+'"><div class="tl-t">'+s.t+
      '</div><div class="tl-d">'+s.r+' · '+s.d+'</div></div>';
  }
  var forms=[
    {k:"案件編號",v:"CERT-2026-0184"},
    {k:"產品型號",v:"JV-PWR860 電源模組"},
    {k:"目標市場",v:"美國 / 歐盟 / 日本"},
    {k:"申請認證",v:"UL 62368-1、CE、RoHS"},
    {k:"指定實驗室",v:"UL Taiwan · TÜV Rheinland"},
    {k:"上市承諾日",v:"2026-11-30"}
  ];
  var ms="";
  for(var j=0;j<forms.length;j++){
    ms+='<div class="miniStat"><div class="ms-ico"><span class="material-symbols-outlined">description</span></div>'+
      '<div class="ms-t">'+forms[j].k+'</div><div class="ms-v">'+forms[j].v+'</div></div>';
  }
  var docs=[
    {n:"BOM 物料清單",st:"b-ok",s:"已上傳"},
    {n:"產品規格書",st:"b-ok",s:"已上傳"},
    {n:"電路原理圖",st:"b-ok",s:"已上傳"},
    {n:"關鍵零件證書",st:"b-warn",s:"待補 2 件"},
    {n:"RoHS 材料聲明",st:"b-warn",s:"待供應商回覆"},
    {n:"樣品照片",st:"b-bad",s:"未上傳"}
  ];
  var dr="";
  for(var k=0;k<docs.length;k++){var d=docs[k];
    dr+='<tr><td>'+d.n+'</td><td><span class="badge '+d.st+'">'+d.s+'</span></td></tr>';
  }
  var h=headHtml("送測申請","建立認證案件、備齊文件並指派實驗室","案件 CERT-2026-0184 · 執行中");
  h+='<div class="grid g32">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">assignment</span>案件基本資料</h3>'+ms+'</div>';
  h+='<div>';
  h+='<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">timeline</span>申請流程進度</h3>'+
    '<div class="tl">'+tl+'</div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">folder_open</span>送審文件檢核</h3>'+
    '<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>文件</th><th>狀態</th></tr></thead>'+
    '<tbody>'+dr+'</tbody></table></div></div>';
  h+='</div></div>';
  document.getElementById("app").innerHTML=h;
  void document.getElementById("app").offsetHeight;
}

/* SCREEN 2 : 進度看板 */
function s2(){
  var cols=[
    {t:"送測申請",cnt:3,c:"#60a5fa",items:[
      {n:"CERT-0184 JV-PWR860",m:["UL 62368","歐盟","D-14"]},
      {n:"CERT-0191 JV-CAM200",m:["FCC 15B","美國","D-9"]},
      {n:"CERT-0195 JV-HUB07",m:["CE EMC","歐盟","D-21"]}
    ]},
    {t:"實驗室審查",cnt:4,c:"#a78bfa",items:[
      {n:"CERT-0177 JV-SEN44",m:["RoHS","歐盟","審查中"]},
      {n:"CERT-0180 JV-LED12",m:["UL 8750","美國","審查中"]},
      {n:"CERT-0182 JV-PSU55",m:["PSE","日本","補件"]},
      {n:"CERT-0186 JV-NET90",m:["CCC","中國","審查中"]}
    ]},
    {t:"缺失補件",cnt:2,c:"#fbbf24",items:[
      {n:"CERT-0169 JV-MTR30",m:["EMC","歐盟","D-3 逾期"]},
      {n:"CERT-0173 JV-CTL08",m:["安全","美國","待重測"]}
    ]},
    {t:"發證完成",cnt:3,c:"#34d399",items:[
      {n:"CERT-0158 JV-ADP18",m:["UL/CE","已發證"]},
      {n:"CERT-0161 JV-BAT22",m:["RoHS","已發證"]},
      {n:"CERT-0165 JV-FAN04",m:["BSMI","已發證"]}
    ]}
  ];
  var board="";
  for(var i=0;i<cols.length;i++){var c=cols[i];var tk="";
    for(var j=0;j<c.items.length;j++){var it=c.items[j];var chips="";
      for(var m=0;m<it.m.length;m++)chips+='<span class="chip">'+it.m[m]+'</span>';
      tk+='<div class="tk" style="border-left-color:'+c.c+'"><div class="t-t">'+it.n+
        '</div><div class="t-m">'+chips+'</div></div>';
    }
    board+='<div class="col"><div class="col-h"><span>'+c.t+'</span>'+
      '<span class="cnt">'+c.cnt+'</span></div>'+tk+'</div>';
  }
  var h=headHtml("進度看板","各認證案件送測、審查、補件、發證即時進度","12 進行中案件 · 2 逾期預警");
  h+='<div class="grid g4" style="margin-bottom:14px">'+
    kpi("pending_actions","12","進行中案件","+3 本週","up")+
    kpi("hourglass_top","18","平均審查天數","-4 天","up")+
    kpi("report","2","逾期/待補件","需優先處理","down")+

var SCREENS=[s0,s1,s2,s3,s4,s5];

function buildTabs(){
  var html="";
  for(var i=0;i<NAV.length;i++){var n=NAV[i];
    html+='<button class="tab" data-i="'+n.i+'"><span class="material-symbols-outlined">'+
      n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }
  document.getElementById("tabs").innerHTML=html;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){
      var idx=+this.getAttribute("data-i");location.hash="v"+idx;
    });
  }
}
function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  }
  SCREENS[i]();
}
buildTabs();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
