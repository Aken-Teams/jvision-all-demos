<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>法規認證管理系統（UL/CE/RoHS等）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --ok:#15803D;
  --warn:#A55205;
  --bad:#B91C1C;
  --info:#075985;
  --shadow:0 14px 38px rgba(20,83,45,.08);
  --shadow-soft:0 5px 18px rgba(20,83,45,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:0;
  overflow-x:hidden;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 8% 3%,rgba(34,197,94,.13),transparent 24rem),
    radial-gradient(circle at 93% 10%,rgba(217,119,6,.08),transparent 22rem),
    var(--color-background);
  font-family:"Exo",system-ui,sans-serif;
  line-height:1.5;
}
button{font:inherit}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:22px;
  padding:13px clamp(14px,3vw,34px);
  border-bottom:1px solid rgba(21,128,61,.18);
  background:rgba(240,253,244,.92);
  box-shadow:0 7px 24px rgba(20,83,45,.06);
  backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:260px}
.logo{
  position:relative;
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  overflow:hidden;
  color:#fff;
  border-radius:42% 58% 55% 45% / 45% 44% 56% 55%;
  background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));
  box-shadow:0 8px 20px rgba(21,128,61,.24);
}
.logo::after{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  top:-10px;
  right:-6px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--color-muted-foreground);font-size:11px}
.nav-shell{min-width:0;margin-left:auto}
.navtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:42px;
  padding:8px 12px;
  border:1px solid transparent;
  border-radius:14px 18px 13px 17px;
  color:var(--color-muted-foreground);
  background:transparent;
  cursor:pointer;
  white-space:nowrap;
  font-size:12px;
  font-weight:600;
  transition:color .2s,background .2s,border-color .2s,transform .2s;
}
.tab:hover{color:var(--color-primary);background:#fff;border-color:var(--color-border)}
.tab.on{
  color:var(--color-on-primary);
  border-color:var(--color-primary);
  background:var(--color-primary);
  box-shadow:0 7px 17px rgba(21,128,61,.2);
}
.tab .material-symbols-outlined{font-size:19px}
.progress-track{
  height:3px;
  margin-top:8px;
  overflow:hidden;
  border-radius:999px;
  background:#DCFCE7;
}
.progress-bar{
  width:16.666%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  transition:width .35s ease;
}
main{width:min(1420px,100%);margin:auto;padding:clamp(18px,3vw,36px)}
#app{min-width:0}
.head{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
  padding:4px 2px 14px;
}
.head::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:76px;
  height:4px;
  border-radius:50% 50% 60% 40%;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
}
.head h1{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:.01em}
.head p{margin:7px 0 0;color:var(--color-muted-foreground);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 12px;
  border:1px solid var(--color-border);
  border-radius:999px;
  color:#166534;
  background:rgba(255,255,255,.76);
  box-shadow:var(--shadow-soft);
  font-size:12px;
  font-weight:600;
}
.dot{
  width:9px;
  height:9px;
  border:2px solid #fff;
  border-radius:50%;
  background:var(--color-secondary);
  box-shadow:0 0 0 2px rgba(34,197,94,.24);
}
.grid{display:grid;gap:16px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{
  border:1px solid var(--color-border);
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow);
}
.card{
  min-width:0;
  padding:18px;
  border-radius:20px 24px 18px 23px;
}
.card:nth-child(even){border-radius:24px 18px 23px 17px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 15px;
  color:var(--color-card-foreground);
  font-size:14px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.sub{color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px;
  border-radius:22px 17px 24px 18px;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.kpi:nth-child(even){border-radius:17px 24px 18px 22px}
.kpi::before{
  content:"";
  position:absolute;
  right:-36px;
  top:-46px;
  width:126px;
  height:126px;
  border-radius:48% 52% 62% 38% / 40% 48% 52% 60%;
  background:linear-gradient(140deg,rgba(34,197,94,.13),rgba(217,119,6,.06));
}
.kpi:hover{transform:translateY(-2px);border-color:#86EFAC;box-shadow:0 17px 34px rgba(20,83,45,.12)}
.k-ico,.ms-ico{
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#DCFCE7;
}
.k-ico{
  width:40px;
  height:40px;
  margin-bottom:11px;
  border-radius:13px 17px 12px 16px;
}
.k-ico .material-symbols-outlined{font-size:21px}
.k-val{
  position:relative;
  color:#123E24;
  font-family:"Roboto Mono",monospace;
  font-size:27px;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.k-lab{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.k-tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:8px;
  font-size:11px;
  font-weight:700;
}
.up{color:#166534}.down{color:#B91C1C}.flat{color:#92400E}
.tbl-wrap{
  max-width:100%;
  overflow-x:auto;
  border:1px solid #D8F6E1;
  border-radius:14px 18px 14px 17px;
}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
th,td{
  padding:11px 13px;
  border-bottom:1px solid #DDF4E4;
  text-align:left;
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#345548;
  background:#EAF9EF;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
tbody tr{transition:background .18s}
tbody tr:hover{background:#F4FCF6}
tbody tr:last-child td{border-bottom:0}
td:nth-last-child(1):has(.mono),td.mono{text-align:left}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.badge::before{
  content:"";
  width:7px;
  height:7px;
  flex:none;
  border-radius:50%;
  background:currentColor;
}
.b-ok{color:#166534;background:#E8F8EC;border-color:#86EFAC}
.b-warn{color:#92400E;background:#FFF7E8;border-color:#F6C976}
.b-bad{color:#B91C1C;background:#FEF2F2;border-color:#FCA5A5}
.b-info{color:#075985;background:#F0F9FF;border-color:#7DD3FC}
.b-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.chip{
  display:inline-block;
  padding:3px 8px;
  border:1px solid #A7F3D0;
  border-radius:8px 11px 8px 10px;
  color:#166534;
  background:#ECFDF5;
  font-size:11px;
  font-weight:700;
}
.bar{min-width:76px;height:8px;overflow:hidden;border-radius:999px;background:#E2E8F0}
.bar>i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{
  min-width:0;
  padding:11px;
  border:1px solid #D6F4DF;
  border-radius:17px 21px 16px 20px;
  background:#F6FCF7;
}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
  color:#345548;
  font-size:12px;
  font-weight:700;
}
.cnt{
  min-width:26px;
  padding:2px 8px;
  border:1px solid var(--color-border);
  border-radius:999px;
  background:#fff;
  text-align:center;
  font-family:"Roboto Mono",monospace;
}
.tk{
  margin-bottom:9px;
  padding:11px;
  border:1px solid #DDEFE2;
  border-left:4px solid var(--color-primary);
  border-radius:11px 15px 12px 13px;
  background:#fff;
  box-shadow:0 4px 11px rgba(20,83,45,.05);
}
.tk:last-child{margin-bottom:0}
.t-t{font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700}
.t-m{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tl{position:relative;padding-left:24px}
.tl::before{
  content:"";
  position:absolute;
  left:7px;
  top:6px;
  bottom:8px;
  width:2px;
  border-radius:999px;
  background:#BBF7D0;
}
.tl-i{position:relative;padding:0 0 18px 6px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{
  content:"";
  position:absolute;
  left:-23px;
  top:3px;
  width:12px;
  height:12px;
  border:3px solid #fff;
  border-radius:50%;
  background:#64748B;
  box-shadow:0 0 0 2px #CBD5E1;
}
.tl-i.done::before{background:var(--ok);box-shadow:0 0 0 2px #86EFAC}
.tl-i.now::before{background:var(--color-accent);box-shadow:0 0 0 2px #F6C976}
.tl-t{font-size:13px;font-weight:700}
.tl-d{margin-top:3px;color:var(--color-muted-foreground);font-size:11px}
.chart{width:100%;min-width:0;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:7px;color:var(--color-muted-foreground);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.market{
  display:inline-grid;
  place-items:center;
  min-width:30px;
  height:23px;
  margin-right:4px;
  padding:0 6px;
  border:1px solid #CDEBDA;
  border-radius:7px;
  color:#166534;
  background:#F0FDF4;
  font-family:"Roboto Mono",monospace;
  font-size:9px;
  font-style:normal;
  font-weight:700;
  letter-spacing:.04em;
}
.mono{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.num{text-align:right;font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.miniStat{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 0;
  border-bottom:1px solid #DDF4E4;
}
.miniStat:last-child{border-bottom:0}
.ms-ico{width:34px;height:34px;flex:none;border-radius:11px 14px 11px 13px}
.ms-t{flex:1;min-width:0;color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.ms-v{text-align:right;font-size:13px;font-weight:700}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1050px){
  .nav{align-items:flex-start;flex-direction:column;gap:10px}
  .nav-shell{width:100%;margin-left:0}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  main{padding:16px 13px 28px}
  .nav{padding:10px 13px}
  .brand{min-width:0}
  .brand small{white-space:normal}
  .tab{min-width:43px;padding:8px 10px}
  .tab .txt{display:none}
  .head{align-items:flex-start;flex-direction:column}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .card{padding:14px}
  .pill{align-self:flex-start}
  .ms-v{max-width:56%;white-space:normal}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<nav class="nav" aria-label="主要功能">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">verified</span></div>
    <div>
      <b>CertGuard 認證管理</b>
      <small>UL / CE / FCC / RoHS 全球合規控制台</small>
    </div>
  </div>
  <div class="nav-shell">
    <div class="navtabs" id="tabs"></div>
    <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
  </div>
</nav>
<main>
  <div id="app" class="reveal"></div>
</main>

<script>
"use strict";
var charts=[];

function clearCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].destroy();}catch(e){}
  }
  charts=[];
}

function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var baseChart={
    redrawOnParentResize:false,
    redrawOnWindowResize:false,
    animations:{enabled:!window.matchMedia("(prefers-reduced-motion: reduce)").matches},
    foreColor:"#475569",
    fontFamily:"Exo, sans-serif",
    toolbar:{show:false},
    background:"transparent"
  };
  opt.chart=Object.assign({},baseChart,opt.chart||{});
  if(!opt.grid)opt.grid={borderColor:"#DDEFE2"};
  if(!opt.tooltip)opt.tooltip={theme:"light"};
  var c=new ApexCharts(el,opt);
  c.render();
  charts.push(c);
}

var NAV=[
  {i:0,ic:"gavel",t:"認證標準庫"},
  {i:1,ic:"fact_check",t:"送測申請"},
  {i:2,ic:"monitoring",t:"進度看板"},
  {i:3,ic:"history",t:"到期管控"},
  {i:4,ic:"science",t:"測試報告"},
  {i:5,ic:"shield",t:"出貨合規"}
];

function market(code,name){
  return '<span class="market" aria-hidden="true">'+code+'</span>'+name;
}
function headHtml(h1,p,tag){
  return '<div class="head"><div><h1>'+h1+'</h1><p>'+p+'</p></div>'+
    '<span class="pill"><span class="dot"></span>'+tag+'</span></div>';
}
function kpi(ic,val,lab,tag,cls){
  return '<div class="kpi"><div class="k-ico"><span class="material-symbols-outlined">'+ic+
    '</span></div><div class="k-val">'+val+'</div><div class="k-lab">'+lab+'</div>'+
    '<div class="k-tag '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+
    (cls==="up"?"trending_up":cls==="down"?"priority_high":"remove")+
    '</span>'+tag+'</div></div>';
}
function barHtml(pct){
  return '<div class="bar" role="progressbar" aria-label="剩餘效期" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>';
}
function mount(html){
  var app=document.getElementById("app");
  app.classList.remove("reveal");
  app.innerHTML=html;
  void app.offsetHeight;
  app.classList.add("reveal");
}

function s0(){
  var std=[
    {c:"UL",m:"美國",f:"US",n:"UL 62368-1",d:"影音/資通設備安全",items:34,cls:"b-info"},
    {c:"CE",m:"歐盟",f:"EU",n:"EN 55032 / EN 55035",d:"EMC 電磁相容",items:28,cls:"b-ok"},
    {c:"RoHS",m:"歐盟",f:"EU",n:"EN IEC 63000",d:"有害物質限用(10項)",items:10,cls:"b-warn"},
    {c:"FCC",m:"美國",f:"US",n:"FCC Part 15B",d:"無意輻射體",items:12,cls:"b-info"},
    {c:"CB",m:"IEC",f:"IEC",n:"IEC 62368-1",d:"國際互認證書",items:34,cls:"b-mut"},
    {c:"CCC",m:"中國",f:"CN",n:"GB 4943.1",d:"強制性產品認證",items:22,cls:"b-bad"},
    {c:"PSE",m:"日本",f:"JP",n:"J62368-1",d:"電氣用品安全",items:19,cls:"b-mut"},
    {c:"BSMI",m:"台灣",f:"TW",n:"CNS 15598-1",d:"商品檢驗",items:18,cls:"b-ok"}
  ];
  var rows="";
  for(var i=0;i<std.length;i++){
    var s=std[i];
    rows+='<tr><td><span class="badge '+s.cls+'">'+s.c+'</span></td>'+
      '<td>'+market(s.f,s.m)+'</td><td class="mono">'+s.n+'</td><td>'+s.d+'</td>'+
      '<td class="num">'+s.items+' 測項</td><td><span class="badge b-ok">現行版</span></td></tr>';
  }
  var h=headHtml("認證標準庫","各國法規標準、適用測項與版本對照","資料庫已同步 · 8 標準體系");
  h+='<div class="grid g4" style="margin-bottom:16px">'+
    kpi("gavel","8","涵蓋認證體系","+2 本季新增","up")+
    kpi("public","24","涵蓋銷售國別","覆蓋主要市場","flat")+
    kpi("rule","177","標準測項總數","已建索引","up")+
    kpi("update","6","版本更新待評估","EN 55032 改版","down")+'</div>';

var SCREENS=[s0,s1,s2,s3,s4,s5];

function buildTabs(){
  var html="";
  for(var i=0;i<NAV.length;i++){
    var n=NAV[i];
    html+='<button class="tab" type="button" data-i="'+n.i+'" aria-label="'+n.t+'"><span class="material-symbols-outlined" aria-hidden="true">'+
      n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }
  document.getElementById("tabs").innerHTML=html;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){
      location.hash="v"+this.getAttribute("data-i");
    });
  }
}

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  document.getElementById("progress").style.width=((i+1)/SCREENS.length*100)+"%";
  SCREENS[i]();
}

buildTabs();

function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
