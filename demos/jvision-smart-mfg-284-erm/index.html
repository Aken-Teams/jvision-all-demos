<style>
:root{
  --accent:#a16207; --accent2:#eab308; --accent-soft:#fef9c3;
  --bg:#faf8f2; --card:#ffffff; --ink:#3f3210; --muted:#8a7a4f;
  --line:#ece4cf; --ok:#15803d; --warn:#b45309; --danger:#b91c1c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#7c4d06,#a16207);color:#fff;box-shadow:0 2px 14px rgba(120,80,0,.22);}
.topbar-inner{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fde68a;}
.brand h1{font-size:16px;font-weight:800;margin:0;letter-spacing:.3px;white-space:nowrap;}
.brand p{margin:1px 0 0;font-size:11px;opacity:.82;white-space:nowrap;}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;}
.pill{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.pill .material-symbols-outlined{font-size:16px;color:#fde68a;}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:35;}
.nav-inner{max-width:1360px;margin:0 auto;padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;min-width:0;}
.nav-btn{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;min-width:0;}
.nav-btn .material-symbols-outlined{font-size:19px;}
.nav-btn:hover{border-color:var(--accent2);color:var(--accent);}
.nav-btn.active{background:linear-gradient(100deg,#a16207,#ca8a04);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(161,98,7,.28);}
.nav-num{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 6px;font-weight:700;}
.nav-btn.active .nav-num{background:rgba(255,255,255,.25);color:#fff;}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px;min-width:0;}
.screen-head{margin-bottom:18px;}
.screen-head .eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.screen-head h2{margin:5px 0 3px;font-size:23px;font-weight:800;}
.screen-head p{margin:0;color:var(--muted);font-size:13.5px;max-width:760px;}
.grid{display:grid;gap:14px;min-width:0;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr;}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;min-width:0;box-shadow:0 1px 3px rgba(120,90,20,.05);}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 12px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;min-width:0;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(120,90,20,.05);}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi .klabel{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .klabel .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .kval{font-size:27px;font-weight:800;margin:7px 0 2px;letter-spacing:-.5px;}
.kpi .kdelta{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;}
.kpi .kdelta .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);} .down{color:var(--danger);} .flat{color:var(--muted);}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px;}
th{background:#fbf7ea;text-align:left;padding:10px 12px;font-weight:700;color:var(--muted);font-size:12px;white-space:nowrap;border-bottom:1px solid var(--line);}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fdfbf2;}
.mono{font-variant-numeric:tabular-nums;font-weight:600;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.tag .material-symbols-outlined{font-size:14px;}
.t-hi{background:#fee2e2;color:#b91c1c;}
.t-md{background:#fef3c7;color:#b45309;}
.t-lo{background:#dcfce7;color:#15803d;}
.t-info{background:#e0f2fe;color:#0369a1;}
.t-grey{background:#f1efe6;color:#78716c;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
.bar{height:8px;border-radius:6px;background:#f0ead6;overflow:hidden;min-width:70px;}
.bar > span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;min-width:0;}
.matrix .mh{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;}
.mcell{border-radius:9px;aspect-ratio:1.4/1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;min-width:0;}
.mcell small{font-size:10px;font-weight:600;opacity:.9;}
.m-yaxis{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#fbf8ef;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.col-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:10px;}
.col-head .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(120,90,20,.05);}
.tk:last-child{margin-bottom:0;}
.tk .tkid{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
.tk .tkt{font-size:13px;font-weight:700;margin:3px 0 6px;white-space:normal;}
.tk .tkm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.ava{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#a16207,#eab308);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--accent2);}
.tl-item .tt{font-size:13.5px;font-weight:700;}
.tl-item .td{font-size:12px;color:var(--muted);margin-top:2px;}
.tl-item .tm{font-size:11px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
.lrow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0;}
.lrow:last-child{border-bottom:none;}
.lrow .li-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.lrow .li-ic .material-symbols-outlined{font-size:19px;color:var(--accent);}
.lrow .li-body{flex:1;min-width:0;}
.lrow .li-t{font-size:13.5px;font-weight:700;}
.lrow .li-s{font-size:11.5px;color:var(--muted);}
.lrow .li-v{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.gaugewrap{display:flex;flex-direction:column;gap:13px;}
.gauge .gtop{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;}
.gauge .gname{font-weight:700;}
.gauge .gval{font-variant-numeric:tabular-nums;font-weight:800;}
.gtrack{height:9px;border-radius:6px;background:#f0ead6;position:relative;overflow:hidden;}
.gfill{height:100%;border-radius:6px;}
.gthresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:#57534e;}
.callout{background:linear-gradient(100deg,#fef9c3,#fef3c7);border:1px solid #fde68a;border-radius:13px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;}
.callout .material-symbols-outlined{font-size:22px;color:var(--accent);flex:0 0 auto;}
.callout .co-t{font-weight:800;font-size:13.5px;}
.callout .co-d{font-size:12.5px;color:#78550a;margin-top:2px;}
.stat-inline{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px;}
.stat-inline > div{min-width:0;}
.stat-inline .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat-inline .l{font-size:11px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);}
@media(max-width:560px){
  .nav-txt{display:none;}
  .nav-btn{padding:8px 11px;}
  .brand p{display:none;}
  .top-meta .pill span.pl-txt{display:none;}
}
</style>
</head>

function kpi(label,ic,val,delta,dir){
  var dc=dir==="up"?"up":dir==="down"?"down":"flat";
  var di=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="klabel"><span class="material-symbols-outlined">'+ic+'</span>'+label+'</div>'+
    '<div class="kval">'+val+'</div>'+
    '<div class="kdelta '+dc+'"><span class="material-symbols-outlined">'+di+'</span>'+delta+'</div></div>';
}
function lvlTag(l){var m={"高":"t-hi","中":"t-md","低":"t-lo"};var ic={"高":"priority_high","中":"remove","低":"check"};return '<span class="tag '+(m[l]||"t-grey")+'"><span class="material-symbols-outlined">'+(ic[l]||"circle")+'</span>'+l+'</span>';}
function stTag(s){var m={"改善中":"t-info","待釐清":"t-md","核定確認":"t-lo","已解除":"t-grey"};return '<span class="tag '+(m[s]||"t-grey")+'">'+s+'</span>';}
function trIcon(t){var m={up:'<span class="down"><span class="material-symbols-outlined" style="font-size:16px">north_east</span></span>',down:'<span class="up"><span class="material-symbols-outlined" style="font-size:16px">south_east</span></span>',flat:'<span class="flat"><span class="material-symbols-outlined" style="font-size:16px">east</span></span>'};return m[t]||"";}
function head(title,eyebrow,desc){

}

var RENDER=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var html=NAV.map(function(n,idx){
    return '<button class="nav-btn" data-i="'+idx+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="nav-txt">'+n.label+'</span><span class="nav-num">'+idx+'</span></button>';
  }).join("");
  document.getElementById("navBar").innerHTML=html;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){location.hash="go="+this.getAttribute("data-i");});
  }
}
function show(i){
  destroyCharts();
  var container=document.getElementById("screen");
  container.innerHTML=(RENDER[i]||s0)();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  void container.offsetHeight;
  initCharts(i);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
