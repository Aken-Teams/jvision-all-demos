<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業風險管理系統（ERM）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --bg:#F0FDFA;
  --card:#FFFFFF;
  --ok:#047857;
  --warn:#B45309;
  --danger:#DC2626;
  --shadow:0 1px 2px rgba(15,118,110,.08),0 8px 24px rgba(15,118,110,.06);
  --shadow-hover:0 2px 4px rgba(15,118,110,.1),0 14px 30px rgba(15,118,110,.1);
  --radius:4px;
  --font-display:"Cormorant Garamond","Noto Sans TC",serif;
  --font-body:"Crimson Pro","Noto Sans TC",serif;
  --font-label:"Cinzel","Noto Sans TC",serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-width:320px;}
body{
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[role="button"]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#99F6E4;color:#0F172A;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  direction:ltr;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#FFFFFF;
  background:#134E4A;
  border-bottom:4px solid var(--color-secondary);
  box-shadow:0 4px 16px rgba(19,78,74,.18);
}
.topbar-inner{
  max-width:1440px;
  min-width:0;
  min-height:68px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .logo{
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#0F172A;
  background:var(--color-secondary);
  border:1px solid #99F6E4;
  border-radius:2px;
}
.brand .logo .material-symbols-outlined{font-size:25px;color:#0F172A;}
.brand h1{
  margin:0;
  font-family:var(--font-display);
  font-size:20px;
  font-weight:700;
  line-height:1.15;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand p{margin:3px 0 0;font-size:12px;color:#CCFBF1;letter-spacing:.04em;white-space:nowrap;}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;}
.pill{
  min-height:34px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#ECFEFF;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(153,246,228,.42);
  border-radius:2px;
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:16px;color:#5EEAD4;}
nav{
  position:sticky;
  top:68px;
  z-index:35;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 3px 10px rgba(19,78,74,.05);
  backdrop-filter:blur(10px);
}
.nav-inner{
  max-width:1440px;
  min-width:0;
  margin:0 auto;
  padding:8px 24px;
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav-btn{
  min-width:0;
  min-height:40px;
  padding:7px 12px;
  border:1px solid transparent;
  border-radius:2px;
  background:transparent;
  color:#475569;
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav-btn .material-symbols-outlined{font-size:18px;}
.nav-btn:hover{color:#0F766E;background:#F0FDFA;border-color:#99F6E4;transform:translateY(-1px);}
.nav-btn.active{
  color:#FFFFFF;
  background:#0F766E;
  border-color:#0F766E;
  box-shadow:inset 0 -3px 0 #5EEAD4;
}
.nav-num{
  min-width:20px;
  padding:1px 5px;
  border-radius:2px;
  background:#CCFBF1;
  color:#115E59;
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  text-align:center;
}
.nav-btn.active .nav-num{background:#99F6E4;color:#134E4A;}
main{max-width:1440px;min-width:0;margin:0 auto;padding:22px 24px 56px;}
.screen-head{
  position:relative;
  margin-bottom:16px;
  padding:2px 0 13px 18px;
  border-bottom:1px solid var(--color-border);
}
.screen-head::before{content:"";position:absolute;left:0;top:2px;bottom:13px;width:4px;background:var(--color-primary);}
.screen-head .eyebrow{
  display:flex;
  align-items:center;
  gap:5px;
  color:#0F766E;
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.screen-head h2{margin:3px 0 2px;font-family:var(--font-display);font-size:29px;font-weight:700;line-height:1.15;letter-spacing:.01em;color:#134E4A;}
.screen-head p{max-width:860px;margin:0;color:#475569;font-size:14px;}
.grid{display:grid;gap:10px;min-width:0;}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid #99F6E4;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#2DD4BF;box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.card{padding:14px 15px;}
.card h3{
  margin:0 0 2px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#134E4A;
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  line-height:1.25;
}
.card h3 .material-symbols-outlined{font-size:19px;color:#0F766E;}
.card .sub{margin:0 0 10px;color:#475569;font-size:12px;}
.kpi{position:relative;overflow:hidden;padding:13px 14px 12px 17px;}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary);}
.kpi::after{content:"";position:absolute;top:0;right:0;width:36px;height:36px;border-top:1px solid #5EEAD4;border-right:1px solid #5EEAD4;opacity:.7;}
.kpi .klabel{display:flex;align-items:center;gap:6px;color:#475569;font-size:12px;font-weight:600;}
.kpi .klabel .material-symbols-outlined{font-size:17px;color:#0F766E;}
.kpi .kval{margin:4px 0 1px;color:#134E4A;font-family:var(--font-label);font-size:27px;font-weight:600;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.kpi .kdelta{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;}
.kpi .kdelta .material-symbols-outlined{font-size:14px;}
.up{color:#047857;}.down{color:#B91C1C;}.flat{color:#475569;}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;border:1px solid #99F6E4;border-radius:2px;scrollbar-width:thin;}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
th{
  padding:9px 10px;
  border-bottom:2px solid var(--color-primary);
  background:#E6FFFB;
  color:#134E4A;
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid #CCFBF1;color:#334155;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:#F8FFFE;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#E6FFFB;}
th:nth-last-child(-n+2),td:nth-last-child(-n+2){text-align:center;}
td.mono,.mono,.tkid,.tm{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:22px;
  padding:2px 7px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.tag .material-symbols-outlined{font-size:13px;}
.t-hi{background:#FEF2F2;color:#B91C1C;}
.t-md{background:#FFFBEB;color:#92400E;}
.t-lo{background:#ECFDF5;color:#047857;}
.t-info{background:#ECFEFF;color:#0E7490;}
.t-grey{background:#F1F5F9;color:#475569;}
.dot{width:8px;height:8px;display:inline-block;margin-right:2px;border-radius:1px;vertical-align:middle;outline:1px solid rgba(15,23,42,.25);}
.bar{height:7px;min-width:70px;overflow:hidden;border-radius:1px;background:#DDEAE9;}
.bar>span{display:block;height:100%;border-radius:1px;background:linear-gradient(90deg,#0F766E,#2DD4BF);}
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;min-width:0;}
.matrix .mh{padding:3px;display:flex;align-items:center;justify-content:center;color:#475569;font-family:var(--font-label);font-size:10px;font-weight:600;text-align:center;}
.mcell{min-width:0;aspect-ratio:1.4/1;border:1px solid rgba(15,23,42,.16);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFFFFF;font-family:var(--font-label);font-size:17px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.45);}
.mcell small{font-family:var(--font-body);font-size:10px;font-weight:600;opacity:1;}
.m-yaxis{display:flex;align-items:center;justify-content:center;color:#475569;font-family:var(--font-label);font-size:10px;font-weight:600;writing-mode:vertical-rl;transform:rotate(180deg);}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0;}
.col{min-width:0;padding:9px;background:#F0FDFA;border:1px solid #99F6E4;border-radius:2px;}
.col-head{margin-bottom:8px;padding-bottom:7px;border-bottom:2px solid #2DD4BF;display:flex;align-items:center;justify-content:space-between;color:#134E4A;font-family:var(--font-display);font-size:15px;font-weight:700;}
.col-head .cnt{min-width:23px;padding:1px 6px;border:1px solid #5EEAD4;border-radius:2px;background:#FFFFFF;color:#475569;font-family:var(--font-mono);font-size:10px;text-align:center;}
.tk{margin-bottom:7px;padding:8px 9px;background:#FFFFFF;border:1px solid #99F6E4;border-left:3px solid #0D9488;border-radius:2px;box-shadow:0 1px 2px rgba(15,118,110,.06);transition:border-color .2s ease,transform .2s ease;}
.tk:hover{border-color:#0D9488;transform:translateX(2px);}
.tk:last-child{margin-bottom:0;}
.tk .tkid{color:#64748B;font-size:10px;font-weight:600;}
.tk .tkt{margin:2px 0 5px;color:#134E4A;font-size:12px;font-weight:700;white-space:normal;}
.tk .tkm{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:#475569;font-size:10px;}
.ava{width:20px;height:20px;flex:0 0 auto;border:1px solid #0F766E;border-radius:2px;background:#CCFBF1;color:#134E4A;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-label);font-size:10px;font-weight:600;}
.tl{position:relative;padding-left:20px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:#5EEAD4;}
.tl-item{position:relative;padding-bottom:13px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border:2px solid #FFFFFF;border-radius:1px;background:#0D9488;box-shadow:0 0 0 1px #0F766E;}
.tl-item .tt{color:#134E4A;font-size:13px;font-weight:700;}
.tl-item .td{margin-top:1px;color:#475569;font-size:11px;}
.tl-item .tm{color:#0F766E;font-size:10px;font-weight:700;}
.lrow{min-width:0;padding:9px 2px;border-bottom:1px solid #CCFBF1;display:flex;align-items:center;gap:9px;}
.lrow:last-child{border-bottom:none;}
.lrow .li-ic{width:32px;height:32px;flex:0 0 auto;border:1px solid #99F6E4;border-radius:2px;background:#E6FFFB;display:grid;place-items:center;}
.lrow .li-ic .material-symbols-outlined{font-size:18px;color:#0F766E;}
.lrow .li-body{flex:1;min-width:0;}
.lrow .li-t{color:#134E4A;font-size:13px;font-weight:700;}
.lrow .li-s{color:#475569;font-size:11px;}
.lrow .li-v{color:#134E4A;font-family:var(--font-label);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
.gaugewrap{display:flex;flex-direction:column;gap:11px;}
.gauge .gtop{margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;}
.gauge .gname{font-weight:700;}
.gauge .gval{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.gtrack{position:relative;height:8px;overflow:hidden;border-radius:1px;background:#DDEAE9;}
.gfill{height:100%;border-radius:1px;}
.gthresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0F172A;}
.callout{padding:11px 12px;border:1px solid #F59E0B;border-left:4px solid var(--color-accent);border-radius:2px;background:#FFFBEB;display:flex;align-items:flex-start;gap:9px;}
.callout .material-symbols-outlined{flex:0 0 auto;color:#B45309;font-size:20px;}
.callout .co-t{color:#78350F;font-size:13px;font-weight:800;}
.callout .co-d{margin-top:1px;color:#78350F;font-size:12px;}
.stat-inline{display:flex;gap:16px;flex-wrap:wrap;margin-top:3px;}
.stat-inline>div{min-width:0;}
.stat-inline .n{color:#134E4A;font-family:var(--font-label);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
.stat-inline .l{color:#475569;font-size:10px;}
.legend{margin-top:9px;display:flex;gap:12px;flex-wrap:wrap;color:#475569;font-size:11px;}
.legend span{display:flex;align-items:center;gap:4px;}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid #99F6E4;color:#475569;font-size:11px;text-align:center;letter-spacing:.02em;}
#screen>.screen-head,#screen>.grid,#screen>.card{animation:screen-enter .38s cubic-bezier(.2,.8,.2,1) both;}
#screen>.grid:nth-of-type(2),#screen>.card:nth-of-type(2){animation-delay:.06s;}
.grid>.card,.grid>.kpi,.board>.col{animation:grid-enter .4s cubic-bezier(.2,.9,.25,1.25) both;}
.grid>:nth-child(2){animation-delay:.05s;}.grid>:nth-child(3){animation-delay:.1s;}.grid>:nth-child(4){animation-delay:.15s;}
@keyframes screen-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes grid-enter{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
@media(max-width:1024px){
  .topbar-inner,.nav-inner,main{padding-left:18px;padding-right:18px;}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g-2{grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:768px){
  .topbar-inner{min-height:62px;padding-top:9px;padding-bottom:9px;gap:10px;}
  .brand h1{font-size:18px;}
  .top-meta{width:100%;margin-left:54px;}
  nav{top:104px;}
  .nav-inner{padding-top:6px;padding-bottom:6px;}
  main{padding-top:18px;}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
  .screen-head h2{font-size:27px;}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:560px){
  body{font-size:15px;}
  .topbar-inner{padding-left:14px;padding-right:14px;}
  .brand{width:100%;}
  .brand .logo{width:38px;height:38px;}
  .brand h1{font-size:17px;white-space:normal;}
  .brand p{display:none;}
  .top-meta{width:auto;margin-left:50px;margin-top:-6px;}
  .top-meta .pill span.pl-txt{display:none;}
  nav{top:101px;}
  .nav-inner{padding-left:12px;padding-right:12px;}
  .nav-btn{min-width:42px;min-height:42px;padding:8px 10px;justify-content:center;}
  .nav-txt{display:none;}
  main{padding:15px 12px 42px;}
  .screen-head{padding-left:14px;margin-bottom:12px;}
  .screen-head h2{font-size:24px;}
  .screen-head p{font-size:13px;}
  .g-kpi{grid-template-columns:1fr 1fr;gap:8px;}
  .card{padding:12px;}
  .kpi{padding:11px 10px 10px 14px;}
  .kpi .klabel{font-size:11px;}
  .kpi .kval{font-size:22px;}
  .board{grid-template-columns:1fr;}
  .matrix{gap:3px;}
  .mcell{font-size:14px;}
}
@media(max-width:375px){
  .g-kpi{grid-template-columns:1fr;}
  .top-meta{margin-left:0;}
  nav{top:101px;}
  .pill{padding:5px 7px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  .card:hover,.kpi:hover,.nav-btn:hover,.tk:hover{transform:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">shield</span></div>
      <div>
        <h1>企業風險管理系統（ERM）</h1>
        <p>把分散數據變成可下鑽、可決策的經營洞察</p>
      </div>
    </div>
    <div class="top-meta">
      <div class="pill"><span class="material-symbols-outlined">groups</span><span class="pl-txt">風控部 · 稽核室</span></div>
      <div class="pill"><span class="material-symbols-outlined">event</span><span>2026 Q3</span></div>
    </div>
  </div>
</header>
<nav>
  <div class="nav-inner" id="navBar"></div>
</nav>
<main>
  <div id="screen"></div>
  <div class="foot">企業風險管理系統（ERM） · 純前端 UI 展示 · 資料為模擬示意，非真實營運數據</div>
</main>

<script>
"use strict";

function kpi(label,ic,val,delta,dir){
  var dc=dir==="up"?"up":dir==="down"?"down":"flat";
  var di=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="klabel"><span class="material-symbols-outlined">'+ic+'</span>'+label+'</div>'+
    '<div class="kval">'+val+'</div>'+
    '<div class="kdelta '+dc+'"><span class="material-symbols-outlined">'+di+'</span>'+delta+'</div></div>';
}
function lvlTag(l){var m={"高":"t-hi","中":"t-md","低":"t-lo"};var ic={"高":"priority_high","中":"remove","低":"check"};return '<span class="tag '+(m[l]||"t-grey")+'"><span class="material-symbols-outlined">'+(ic[l]||"circle")+'</span>'+l+'</span>';}
function stTag(s){var m={"改善中":"t-info","待釐清":"t-md","核定確認":"t-lo","已解除":"t-grey"};return '<span class="tag '+(m[s]||"t-grey")+'">'+s+'</span>';}
function trIcon(t){var m={up:'<span class="down"><span class="material-symbols-outlined" style="font-size:16px">north_east</span></span>',down:'<span class="up"><span class="material-symbols-outlined" style="font-size:16px">south_east</span></span>',flat:'<span class="flat"><span class="material-symbols-outlined" style="font-size:16px">east</span></span>'};return m[t]||"";}
function head(title,eyebrow,desc){
  return '<div class="screen-head"><div class="eyebrow"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+eyebrow+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>';
}

function s0(){
  var high=RISKS.filter(function(r){return r.lvl==="高";}).length;
  var rows=RISKS.map(function(r){
    return '<tr><td class="mono">'+r.id+'</td><td>'+esc(r.name)+'</td><td><span class="tag t-grey">'+r.cat+'</span></td>'+
      '<td><span class="ava">'+esc(r.owner.slice(0,1))+'</span> '+esc(r.owner)+'</td>'+
      '<td class="mono">'+r.lk+'×'+r.im+'</td><td>'+lvlTag(r.lvl)+'</td><td>'+stTag(r.status)+'</td><td style="text-align:center">'+trIcon(r.trend)+'</td></tr>';
  }).join("");
  return head("風險登錄簿","登錄與盤點","全企業風險項目集中登錄、分類與擁有者指派，作為 ERM 作業的單一資料來源。")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("登錄風險總數","receipt_long","52","本季新增 8 筆","up")+
      kpi("高風險項目","priority_high",high+" 項","較上季 -2","down")+
      kpi("待釐清案件","pending_actions","7 件","需 3 日內指派","flat")+
      kpi("風險擁有者","groups","23 位","覆蓋 6 部門","flat")+
    '</div>'+
    '<div class="grid g-2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>風險登錄清單</h3><p class="sub">依風險等級與最近更新排序 · 共 9 筆展示</p>'+
        '<div class="tbl-wrap"><table><thead><tr><th>風險編號</th><th>風險描述</th><th>分類</th><th>風險擁有者</th><th>可能性×衝擊</th><th>等級</th><th>狀態</th><th>趨勢</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>分類分布</h3><p class="sub">依風險來源分類佔比</p>'+
        '<div class="chart-wrap" style="height:210px"><canvas id="c0a"></canvas></div>'+
        '<div class="callout" style="margin-top:14px"><span class="material-symbols-outlined">flag</span><div><div class="co-t">本季重點</div><div class="co-d">供應鏈與資安高風險合計 9 項，佔全部高風險 75%，列為董事會優先審視。</div></div></div>'+
      '</div>'+
    '</div>';
}
function s1(){
  var counts={};RISKS.forEach(function(r){var k=r.lk+"_"+r.im;counts[k]=(counts[k]||0)+1;});
  function cellColor(score){if(score>=17)return"#b91c1c";if(score>=10)return"#d97706";if(score>=5)return"#ca8a04";return"#65a30d";}
  var yLabels=["極高","高","中","低","極低"];
  var cells="";
  cells+='<div></div>';
  var lk,im,l;
  for(lk=1;lk<=5;lk++){cells+='<div class="mh">'+lk+'</div>';}
  for(im=5;im>=1;im--){
    cells+='<div class="m-yaxis">'+yLabels[5-im]+'</div>';
    for(l=1;l<=5;l++){
      var sc=l*im;var cnt=counts[l+"_"+im]||0;
      cells+='<div class="mcell" style="background:'+cellColor(sc)+'">'+(cnt>0?cnt:'')+(cnt>0?'<small>件</small>':'')+'</div>';
    }
  }
  return head("風險矩陣評估","評估分級","以可能性 × 衝擊二維矩陣為風險定級，辨識需優先處理的熱區。")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("平均風險分數","speed","10.4","目標 ≤ 9.0","up")+
      kpi("熱區(≥17)風險","local_fire_department","3 項","集中供應鏈/資安","flat")+
      kpi("本季升級風險","north_east","4 項","可能性上升","up")+
      kpi("本季降級風險","south_east","5 項","措施奏效","down")+
    '</div>'+
    '<div class="grid g-2e">'+
      '<div class="card"><h3><span class="material-symbols-outlined">grid_on</span>風險熱區矩陣</h3><p class="sub">縱軸：衝擊程度　橫軸：發生可能性　數字為落點風險數</p>'+
        '<div style="overflow-x:auto"><div class="matrix" style="min-width:320px">'+cells+'</div></div>'+
        '<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px">→ 發生可能性 (1 ~ 5)</div>'+
        '<div class="legend"><span><i class="dot" style="background:#b91c1c"></i>極高(17+)</span><span><i class="dot" style="background:#d97706"></i>高(10-16)</span><span><i class="dot" style="background:#ca8a04"></i>中(5-9)</span><span><i class="dot" style="background:#65a30d"></i>低(1-4)</span></div>'+
      '</div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">scatter_plot</span>殘餘 vs 固有風險</h3><p class="sub">應對措施後殘餘風險降幅</p>'+
        '<div class="chart-wrap" style="height:250px"><canvas id="c1a"></canvas></div>'+
        '<div class="stat-inline" style="margin-top:6px"><div><div class="n">-31%</div><div class="l">平均風險降幅</div></div><div><div class="n">3</div><div class="l">仍高於胃納</div></div><div><div class="n">86%</div><div class="l">重大風險覆蓋率</div></div></div>'+
      '</div>'+
    '</div>';
}
function s2(){
  var cards=CATS.map(function(c){
    var pct=Math.round((c.exposure-c.resid)/c.exposure*100);
    return '<div class="card"><h3><span class="material-symbols-outlined">'+c.icon+'</span>'+c.name+'風險</h3>'+
      '<p class="sub">登錄 '+c.count+' 項 · 高風險 '+c.high+' 項</p>'+
      '<div class="stat-inline"><div><div class="n">'+c.exposure+'</div><div class="l">固有風險指數</div></div><div><div class="n">'+c.resid+'</div><div class="l">殘餘風險指數</div></div></div>'+
      '<div style="margin-top:11px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px"><span>緩解進度</span><span>'+pct+'%</span></div>'+
      '<div class="bar"><span style="width:'+pct+'%;background:linear-gradient(90deg,'+c.color+',#eab308)"></span></div></div></div>';
  }).join("");
  return head("風險分類管理","分域治理","將風險依供應鏈、財務、營運、資安分域管理，各域指定治理負責人與胃納門檻。")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+cards+'</div>'+
    '<div class="grid g-2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各分類固有 vs 殘餘風險</h3><p class="sub">風險指數 (0-50)　措施執行後之殘餘水準</p>'+
        '<div class="chart-wrap" style="height:260px"><canvas id="c2a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>分域治理責任</h3><p class="sub">各風險域負責人與覆蓋範圍</p>'+
        '<div class="lrow"><div class="li-ic"><span class="material-symbols-outlined">inventory_2</span></div><div class="li-body"><div class="li-t">供應鏈風險 · 林采潔</div><div class="li-s">單一來源、交期、地緣政治斷鏈</div></div><div class="li-v">5<small style="font-size:11px;color:var(--muted)"> 高</small></div></div>'+
        '<div class="lrow"><div class="li-ic"><span class="material-symbols-outlined">request_quote</span></div><div class="li-body"><div class="li-t">財務風險 · 陳彥廷</div><div class="li-s">匯率、流動性、信用與價格波動</div></div><div class="li-v">3<small style="font-size:11px;color:var(--muted)"> 高</small></div></div>'+
        '<div class="lrow"><div class="li-ic"><span class="material-symbols-outlined">factory</span></div><div class="li-body"><div class="li-t">營運風險 · 黃士豪</div><div class="li-s">產能、合規、設備與客戶集中度</div></div><div class="li-v">2<small style="font-size:11px;color:var(--muted)"> 高</small></div></div>'+
        '<div class="lrow"><div class="li-ic"><span class="material-symbols-outlined">shield</span></div><div class="li-body"><div class="li-t">資安風險 · 張慕琳</div><div class="li-s">勒索軟體、資料外洩、SLA 未達</div></div><div class="li-v">4<small style="font-size:11px;color:var(--muted)"> 高</small></div></div>'+
      '</div>'+
    '</div>';
}
function s3(){
  var rows=KRIS.map(function(k){
    var stt=k.status==="danger"?'t-hi':k.status==="warn"?'t-md':'t-lo';
    var stTxt=k.status==="danger"?"超限":k.status==="warn"?"預警":"正常";
    var col=k.status==="danger"?C.danger:k.status==="warn"?C.warn:C.ok;
    var pct=Math.min(100,Math.round(k.val/k.limit*100));
    var wpct=Math.min(100,Math.round(k.warn/k.limit*100));
    return '<div class="gauge"><div class="gtop"><span class="gname">'+esc(k.name)+' <span class="tag '+stt+'" style="margin-left:4px">'+stTxt+'</span></span><span class="gval">'+k.val+' '+k.unit+'</span></div>'+
      '<div class="gtrack"><div class="gfill" style="width:'+pct+'%;background:'+col+'"></div><div class="gthresh" style="left:'+wpct+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px"><span>預警門檻 '+k.warn+'</span><span>上限 '+k.limit+'</span></div></div>';
  }).join("");
  return head("KRI 預警監控","監控追蹤","設定關鍵風險指標門檻，系統依實際值亮燈預警，追蹤風險是否趨向惡化。")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("監控中 KRI","monitoring","18 項","覆蓋 4 風險域","flat")+
      kpi("超限指標","error","1 項","資安事件超上限","up")+
      kpi("預警指標","warning","2 項","供應/客戶集中","up")+
      kpi("平均應變時效","timer","1.4 天","較上季 -1.5 天","down")+
    '</div>'+
    '<div class="grid g-2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>關鍵 KRI 六週趨勢</h3><p class="sub">實際值走勢，紅色為已超限指標</p>'+
        '<div class="chart-wrap" style="height:270px"><canvas id="c3a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">speed</span>KRI 門檻儀表</h3><p class="sub">直線為預警門檻位置 · 條長為目前值 / 上限</p>'+
        '<div class="gaugewrap">'+rows+'</div></div>'+
    '</div>';
}
function s4(){
  var groups={"待啟動":[],"進行中":[],"逾期":[],"已完成":[]};
  ACTIONS.forEach(function(a){if(!groups[a.st])groups[a.st]=[];groups[a.st].push(a);});
  var order=["待啟動","進行中","逾期","已完成"];
  var board=order.map(function(g){
    var items=(groups[g]||[]).map(function(a){
      var sc=a.strat==="緩解"?"t-info":a.strat==="移轉"?"t-md":"t-grey";
      return '<div class="tk"><div class="tkid">'+a.id+' · '+a.risk+'</div><div class="tkt">'+esc(a.title)+'</div>'+
        '<div class="tkm"><span class="tag '+sc+'">'+a.strat+'</span><span class="ava">'+esc(a.owner.slice(0,1))+'</span>'+esc(a.owner)+'</div>'+
        '<div style="margin-top:7px"><div class="bar"><span style="width:'+a.prog+'%"></span></div></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px"><span>到期 '+a.due+'</span><span>'+a.prog+'%</span></div></div>';
    }).join("")||'<div style="font-size:11px;color:var(--muted);text-align:center;padding:12px">無項目</div>';
    return '<div class="col"><div class="col-head">'+g+'<span class="cnt">'+(groups[g]||[]).length+'</span></div>'+items+'</div>';
  }).join("");
  return head("應對措施追蹤","措施制定","為高風險擬定緩解、移轉或接受策略，指派負責人與到期日並追蹤執行進度。")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("進行中措施","pending","24 項","本週更新 9 項","flat")+
      kpi("逾期措施","event_busy","1 項","環保許可證更新","up")+
      kpi("本季完成率","task_alt","78%","目標 85%","up")+
      kpi("平均關閉天數","calendar_month","12 天","較上季 -4 天","down")+
    '</div>'+
    '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">view_kanban</span>措施執行看板</h3><p class="sub">依執行狀態分欄</p>'+
      '<div class="board">'+board+'</div></div>'+
    '<div class="grid g-2e">'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>應對策略分布</h3><p class="sub">緩解 / 移轉 / 接受 措施佔比</p>'+
        '<div class="chart-wrap" style="height:220px"><canvas id="c4a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">history</span>近期措施動態</h3><p class="sub">最新處理紀錄</p>'+
        '<div class="tl">'+
          '<div class="tl-item"><div class="tm">08/12 14:20</div><div class="tt">原料長約鎖價談判 完成</div><div class="td">陳彥廷 · RSK-2024 殘餘風險由 12 降至 6</div></div>'+
          '<div class="tl-item"><div class="tm">08/11 10:05</div><div class="tt">OT 網路分段 進度更新至 40%</div><div class="td">張慕琳 · EDR 佈署第一階段完成</div></div>'+
          '<div class="tl-item"><div class="tm">08/09 16:40</div><div class="tt">環保許可證更新 標記逾期</div><div class="td">周孟樺 · 已升級提報風控主管</div></div>'+
          '<div class="tl-item"><div class="tm">08/08 09:15</div><div class="tt">第二供應商備援 進度更新至 65%</div><div class="td">林采潔 · 完成兩家供應商稽核</div></div>'+
        '</div></div>'+
    '</div>';
}
function s5(){
  var topRisks=RISKS.filter(function(r){return r.lvl==="高";}).slice(0,4);
  var rows=topRisks.map(function(r){
    return '<tr><td class="mono">'+r.id+'</td><td>'+esc(r.name)+'</td><td><span class="tag t-grey">'+r.cat+'</span></td><td class="mono">'+(r.lk*r.im)+'</td><td>'+r.resp+'</td><td>'+stTag(r.status)+'</td></tr>';
  }).join("");
  return head("董事會審視報告","定期報告","彙整重大風險與覆蓋率，提交董事會審視，記錄治理決議與後續追蹤要求。")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("重大風險覆蓋率","verified","86%","較上季 +8pt","up")+
      kpi("超出風險胃納","report","3 項","需董事會決議","flat")+
      kpi("本期已審視","fact_check","52 項","100% 完成","up")+
      kpi("待董事會決議","gavel","5 項","下次會議 08/28","flat")+
    '</div>'+
    '<div class="grid g-2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">insights</span>整體風險趨勢 (季)</h3><p class="sub">固有風險 vs 殘餘風險指數走勢</p>'+
        '<div class="chart-wrap" style="height:250px"><canvas id="c5a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">radar</span>各風險域殘餘水位</h3><p class="sub">相對風險胃納之殘餘曝險</p>'+
        '<div class="chart-wrap" style="height:250px"><canvas id="c5b"></canvas></div></div>'+
    '</div>'+
    '<div class="grid g-2" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">priority_high</span>提報董事會重大風險</h3><p class="sub">超出胃納、需治理層決議之項目</p>'+
        '<div class="tbl-wrap"><table><thead><tr><th>編號</th><th>風險描述</th><th>分類</th><th>風險分數</th><th>應對策略</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">gavel</span>治理決議紀錄</h3><p class="sub">董事會審視結論</p>'+
        '<div class="callout" style="margin-bottom:11px"><span class="material-symbols-outlined">check_circle</span><div><div class="co-t">核准供應鏈備援投資</div><div class="co-d">通過 RSK-2041 第二供應商備援預算，要求 09 月底前完成佈署。</div></div></div>'+
        '<div class="callout" style="margin-bottom:11px"><span class="material-symbols-outlined">policy</span><div><div class="co-t">資安風險列為最高優先</div><div class="co-d">RSK-2033 KRI 已超限，要求風控部每兩週回報進度並提升胃納監控。</div></div></div>'+
        '<div class="callout"><span class="material-symbols-outlined">schedule</span><div><div class="co-t">下次審視 2026/08/28</div><div class="co-d">要求補充客戶集中度風險之中長期降低方案。</div></div></div>'+
      '</div>'+
    '</div>';
}

function initCharts(i){
  Chart.defaults.font.family="'Inter','Noto Sans TC',sans-serif";
  Chart.defaults.color=C.muted;
  Chart.defaults.font.size=11.5;
  var grid={color:"#f0ead6"};
  if(i===0){
    mkChart("c0a",{type:"doughnut",data:{labels:CATS.map(function(c){return c.name;}),datasets:[{data:CATS.map(function(c){return c.count;}),backgroundColor:["#a16207","#ca8a04","#d97706","#b45309"],borderWidth:2,borderColor:"#fff"}]},options:{maintainAspectRatio:false,responsive:true,cutout:"58%",plugins:{legend:{position:"bottom",labels:{padding:12,boxWidth:11,usePointStyle:true}}}}});
  }else if(i===1){
    var pts=RISKS.map(function(r){var inh=r.lk*r.im;var factor=r.trend==="down"?0.4:r.trend==="flat"?0.3:0.15;return {x:inh,y:Math.max(1,inh-Math.round(factor*inh))};});
    mkChart("c1a",{type:"scatter",data:{datasets:[{label:"風險落點",data:pts,backgroundColor:"rgba(161,98,7,.75)",pointRadius:7,pointHoverRadius:9}]},options:{maintainAspectRatio:false,responsive:true,scales:{x:{title:{display:true,text:"固有風險分數"},grid:grid,min:0,max:26},y:{title:{display:true,text:"殘餘風險分數"},grid:grid,min:0,max:26}},plugins:{legend:{display:false}}}});
  }else if(i===2){
    mkChart("c2a",{type:"bar",data:{labels:CATS.map(function(c){return c.name;}),datasets:[
      {label:"固有風險",data:CATS.map(function(c){return c.exposure;}),backgroundColor:"#e9c46a",borderRadius:5},
      {label:"殘餘風險",data:CATS.map(function(c){return c.resid;}),backgroundColor:"#a16207",borderRadius:5}
    ]},options:{maintainAspectRatio:false,responsive:true,scales:{x:{grid:{display:false}},y:{grid:grid,beginAtZero:true,max:50}},plugins:{legend:{position:"bottom",labels:{padding:12,boxWidth:11,usePointStyle:true}}}}});
  }else if(i===3){
    var lbl=["第1週","第2週","第3週","第4週","第5週","第6週"];
    var pick=[KRIS[2],KRIS[0],KRIS[3]];
    var cols=[C.danger,C.warn,C.accent];
    mkChart("c3a",{type:"line",data:{labels:lbl,datasets:pick.map(function(k,idx){return {label:k.name,data:k.series,borderColor:cols[idx],backgroundColor:"transparent",tension:.35,borderWidth:2.5,pointRadius:3,pointBackgroundColor:cols[idx]};})},options:{maintainAspectRatio:false,responsive:true,interaction:{mode:"index",intersect:false},scales:{x:{grid:{display:false}},y:{grid:grid,beginAtZero:true}},plugins:{legend:{position:"bottom",labels:{padding:12,boxWidth:11,usePointStyle:true}}}}});
  }else if(i===4){
    var st={};ACTIONS.forEach(function(a){st[a.strat]=(st[a.strat]||0)+1;});
    var keys=Object.keys(st);
    mkChart("c4a",{type:"polarArea",data:{labels:keys,datasets:[{data:keys.map(function(k){return st[k];}),backgroundColor:["rgba(161,98,7,.75)","rgba(234,179,8,.7)","rgba(217,119,6,.7)"],borderWidth:1,borderColor:"#fff"}]},options:{maintainAspectRatio:false,responsive:true,scales:{r:{grid:grid,ticks:{backdropColor:"transparent",stepSize:1}}},plugins:{legend:{position:"bottom",labels:{padding:12,boxWidth:11,usePointStyle:true}}}}});
  }else if(i===5){
    var q=["Q3'25","Q4'25","Q1'26","Q2'26","Q3'26"];
    mkChart("c5a",{type:"line",data:{labels:q,datasets:[
      {label:"固有風險指數",data:[142,138,135,131,129],borderColor:"#d97706",backgroundColor:"rgba(217,119,6,.08)",fill:true,tension:.35,borderWidth:2.5,pointRadius:3},
      {label:"殘餘風險指數",data:[112,104,96,88,80],borderColor:"#a16207",backgroundColor:"rgba(161,98,7,.10)",fill:true,tension:.35,borderWidth:2.5,pointRadius:3}
    ]},options:{maintainAspectRatio:false,responsive:true,scales:{x:{grid:{display:false}},y:{grid:grid,beginAtZero:true}},plugins:{legend:{position:"bottom",labels:{padding:12,boxWidth:11,usePointStyle:true}}}}});
    mkChart("c5b",{type:"radar",data:{labels:["供應鏈","財務","營運","資安","合規"],datasets:[
      {label:"殘餘曝險",data:[22,19,15,24,17],borderColor:"#a16207",backgroundColor:"rgba(161,98,7,.18)",borderWidth:2,pointBackgroundColor:"#a16207"},
      {label:"風險胃納",data:[18,18,18,18,18],borderColor:"#ca8a04",backgroundColor:"transparent",borderWidth:1.5,borderDash:[5,4],pointRadius:0}
    ]},options:{maintainAspectRatio:false,responsive:true,scales:{r:{grid:grid,angleLines:{color:"#f0ead6"},suggestedMin:0,suggestedMax:30,ticks:{backdropColor:"transparent",stepSize:10}}},plugins:{legend:{position:"bottom",labels:{padding:12,boxWidth:11,usePointStyle:true}}}}});
  }
}

var RENDER=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var html=NAV.map(function(n,idx){
    return '<button class="nav-btn" data-i="'+idx+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="nav-txt">'+n.label+'</span><span class="nav-num">'+idx+'</span></button>';
  }).join("");
  document.getElementById("navBar").innerHTML=html;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){location.hash="go="+this.getAttribute("data-i");});
  }
}
function show(i){
  destroyCharts();
  var container=document.getElementById("screen");
  container.innerHTML=(RENDER[i]||s0)();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  void container.offsetHeight;
  initCharts(i);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
