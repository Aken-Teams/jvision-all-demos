<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人資服務台 HR Helpdesk · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#CCFBF1;
  --hov:#E6FFFB;
  --track:#CCFBF1;
  --sidebar:#0F766E;
  --sidebar2:#134E4A;
  --side-edge:#000;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:0px;
  --glow:rgba(13,148,136,.22);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro",Georgia,serif;
  font-size:15px;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,.brand-txt,.nav button,.tag,.chip,.lbl,.card-h,.col-h,.tile b,.lane-row b,.chk{
  font-family:"Cormorant Garamond",Georgia,serif;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.05}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:4px solid var(--color-ring)!important;
  outline-offset:3px!important;
  box-shadow:0 0 0 2px #fff!important;
}
::selection{background:var(--color-accent);color:#000}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:264px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  min-width:0;
  padding:0;
  color:#fff;
  background:var(--sidebar2);
  border-right:4px solid #000;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:22px 18px;
  color:#000;
  background:var(--color-secondary);
  border-bottom:4px solid #000;
}
.brand-logo{
  width:46px;
  height:46px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-accent);
  border:3px solid #000;
  border-radius:0;
  box-shadow:5px 5px 0 #000;
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt b{display:block;font-size:19px;font-weight:700;letter-spacing:.02em}
.brand-txt span{display:block;margin-top:2px;color:#134E4A;font-family:"Cinzel",serif;font-size:9px;font-weight:600;letter-spacing:.16em}
.nav{display:flex;flex-direction:column;gap:0;min-width:0;margin:0}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:56px;
  min-width:0;
  padding:13px 16px;
  color:#ECFEFF;
  background:transparent;
  border:0;
  border-bottom:1px solid #2DD4BF;
  border-radius:0;
  text-align:left;
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,transform 180ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav button:hover{color:#000;background:var(--color-secondary);transform:translateX(5px)}
.nav button.on{color:#000;background:var(--color-accent);box-shadow:inset 8px 0 0 #000}
.nav .idx{margin-left:auto;color:currentColor;font-family:"Cinzel",serif;font-size:10px;font-weight:600;opacity:.8}
.side-foot{
  margin-top:auto;
  padding:18px;
  color:#CCFBF1;
  border-top:4px solid #000;
  background:#0F766E;
  font-size:12px;
  line-height:1.65;
}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,44px) 64px}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding:20px 22px;
  background:#fff;
  border:3px solid #000;
  box-shadow:8px 8px 0 var(--color-primary);
}
.topbar::before{
  content:"PEOPLE / SERVICE / OPERATIONS";
  position:absolute;
  top:-11px;
  left:18px;
  padding:2px 8px;
  color:#000;
  background:var(--color-accent);
  border:2px solid #000;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.topbar h1{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:clamp(27px,3vw,42px);color:#0F172A}
.topbar h1 .material-symbols-outlined{padding:7px;color:#000;background:var(--color-secondary);border:2px solid #000;font-size:25px}
.topbar .sub{margin-top:8px;color:var(--muted);font-size:14px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 10px;
  color:#0F172A;
  background:var(--color-muted);
  border:2px solid #000;
  border-radius:0;
  font-size:12px;
  font-weight:700;
}
.chip .dot{width:10px;height:10px;background:var(--ok);border:2px solid #000;animation:pulse 2s steps(2,end) infinite}
.avatar{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-accent);border:3px solid #000;border-radius:0;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blockIn{0%{opacity:0;transform:translateY(16px) scale(.94)}100%{opacity:1;transform:none}}
#screen>*{animation:blockIn 400ms cubic-bezier(.2,.85,.25,1.25) both}
#screen>*:nth-child(2){animation-delay:60ms}
#screen>*:nth-child(3){animation-delay:120ms}
#screen>*:nth-child(4){animation-delay:180ms}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.45fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:3px solid #000;
  border-radius:0;
  box-shadow:6px 6px 0 var(--line);
}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{box-shadow:9px 9px 0 var(--color-primary);transform:translate(-2px,-2px)}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{transition:transform 180ms ease,box-shadow 180ms ease,background-color 180ms ease}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{padding:4px;color:#000;background:var(--color-secondary);border:2px solid #000;font-size:18px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card.pad0>.card-h{margin-bottom:12px}
.card-h .hint{padding:3px 7px;color:#000;background:#FDE68A;border:1px solid #000;font-size:12px;font-weight:600}
.kpi,.stat{position:relative;overflow:hidden;padding:17px 18px}
.kpi::before,.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--color-primary);border-right:2px solid #000}
.kpi::after{content:"";position:absolute;right:-28px;top:-32px;width:88px;height:88px;background:var(--accent-soft);border:2px solid #000;transform:rotate(14deg)}
.kpi .ico{position:relative;z-index:1;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#000;background:var(--color-secondary);border:2px solid #000;border-radius:0}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{position:relative;z-index:1;display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:13px;font-weight:700}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{position:relative;z-index:1;margin-top:4px;color:#0F172A;font-family:"Crimson Pro",serif;font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:14px;font-weight:600}
.kpi .delta,.stat .d{position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px;margin-top:7px;padding:2px 6px;border:1px solid currentColor;font-size:12px;font-weight:700}
.delta.up,.d.up{color:#166534;background:#DCFCE7}
.delta.down,.d.down{color:#991B1B;background:#FEE2E2}
.delta.flat,.d.flat{color:#334155;background:#E2E8F0}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums}
th{
  padding:12px 14px;
  color:#0F172A;
  background:var(--color-secondary);
  border-right:1px solid #000;
  border-bottom:3px solid #000;
  text-align:left;
  font-family:"Cormorant Garamond",serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{padding:12px 14px;color:#134E4A;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F8FFFE}
tbody tr:hover{background:#CCFBF1}
td b{color:#991B1B}
.mono{font-family:"Crimson Pro",ui-monospace,monospace;font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;color:#0F172A;border:2px solid currentColor;border-radius:0;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}
.bar{height:10px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #000;border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-right:2px solid #000;border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:42px;flex:none;color:var(--muted);font-family:"Crimson Pro",monospace;font-size:12px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:#000}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-27px;top:3px;width:16px;height:16px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Crimson Pro",monospace;font-size:12px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-family:"Cormorant Garamond",serif;font-size:15px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:10px;min-height:43px;padding:9px 3px;border-bottom:1px dashed #0F766E;font-size:14px;font-weight:600}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{flex:none;padding:3px;color:#000;border:1px solid currentColor;font-size:18px}
.chk .ok{color:#166534;background:#DCFCE7}
.chk .wait{color:#334155;background:#E2E8F0}
.chk .bad{color:#991B1B;background:#FEE2E2}
.chk .warn{color:#92400E;background:#FEF3C7}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-family:"Crimson Pro",serif;font-size:12px;text-align:right}
.note{margin-top:14px;padding:13px;color:#0F172A;background:#FEF3C7;border:2px solid #000;font-size:13px;line-height:1.65}
.note::before{content:"NOTE / ";font-family:"Cinzel",serif;font-size:10px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:10px;padding:11px;background:var(--color-muted);border:2px solid #000;border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 8px;font-size:15px;font-weight:700}
.col-h .cnt{padding:2px 8px;color:#000;background:var(--color-secondary);border:2px solid #000;border-radius:0;font-size:12px}
.pcard{padding:12px;color:var(--ink);background:#fff;border:2px solid #000;border-left:8px solid var(--accent);border-radius:0}
.pcard:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--color-primary)}
.pcard b{font-family:"Cormorant Garamond",serif;font-size:15px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:12px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:12px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-secondary);border:1px solid #000;border-radius:0;font-weight:700}
.mini-av{width:20px;height:20px;font-size:10px}
.av{width:28px;height:28px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:12px}
.lane-row{display:flex;align-items:center;gap:14px;min-width:0;padding:13px 14px;background:#fff;border:2px solid #000;border-radius:0}
.lane-row:hover{box-shadow:5px 5px 0 var(--line);transform:translate(-2px,-2px)}
.lane-row .num{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-accent);border:2px solid #000;border-radius:0;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-family:"Cormorant Garamond",serif;font-size:16px}
.lane-row .body p{margin:3px 0 0;color:var(--muted);font-size:13px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#475569;background:#fff;border:2px solid #64748B;border-radius:0;font-size:11px}
.steps .ln{width:20px;height:3px;background:#94A3B8}
.steps .s.done{color:#000;background:var(--color-secondary);border-color:#000}
.steps .s.cur{color:#000;background:#FEF3C7;border:3px solid var(--color-accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 4px;border-bottom:1px dashed #0F766E}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-family:"Cormorant Garamond",serif;font-size:15px}
.rep-row .sku span{color:var(--muted);font-size:12px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:10px;overflow:hidden;background:var(--track);border:1px solid #000;border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent);border-right:2px solid #000}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:11px;text-align:right}
.band{position:relative;min-width:150px;height:28px;background:var(--track);border:1px solid #000;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-right:1px solid #000;border-left:1px solid #000}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:#475569}
.band .me{position:absolute;top:3px;width:13px;height:20px;background:var(--accent);border:2px solid #000;border-radius:0;box-shadow:none}
.tile{display:flex;flex-direction:column;gap:8px;padding:17px}
.tile .ti{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#000;background:var(--color-secondary);border:2px solid #000;border-radius:0}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{font-size:17px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.apexcharts-canvas{font-family:"Crimson Pro",serif!important}
.apexcharts-gridline{stroke:#99F6E4!important}
.apexcharts-text{fill:#475569!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:2px solid #000!important;border-radius:0!important;box-shadow:4px 4px 0 var(--line)!important}
.apexcharts-legend-text{color:#134E4A!important}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid #000}
  .brand{padding:14px 16px}
  .brand-logo{width:40px;height:40px;box-shadow:4px 4px 0 #000}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .nav button{justify-content:center;min-height:52px;padding:10px;border-right:1px solid #2DD4BF;text-align:center}
  .nav button:hover{transform:none}
  .nav button.on{box-shadow:inset 0 -7px 0 #000}
  .nav .idx,.side-foot{display:none}
  .main{padding:24px 16px 48px}
  .topbar{margin-right:7px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
}
@media(max-width:600px){
  body{background-size:24px 24px}
  .main{padding:20px 12px 42px}
  .topbar{padding:20px 15px 15px;box-shadow:6px 6px 0 var(--color-primary)}
  .topbar h1{font-size:28px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button{justify-content:flex-start}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .kpi,.stat{padding:14px}
  .kpi .val,.stat .val{font-size:28px}
  .board{grid-template-columns:1fr}
  .card,.sec{padding:14px}
  .chk{align-items:flex-start;flex-wrap:wrap}

function buildNav(){var n=document.getElementById("nav");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
