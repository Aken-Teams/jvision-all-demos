<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>股東會管理系統｜控制中心</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1728; --line:#1e2c44;
    --accent:#0369a1; --accent2:#38bdf8; --txt:#e6eefb; --mut:#8ba0c0;
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
  a{color:inherit;text-decoration:none}

  .topbar{
    background:linear-gradient(90deg,#081020,#0d1a30);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:50; padding:10px 16px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .logo{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#03121f;
  }
  .brand .logo .material-symbols-outlined{font-size:24px}
  .brand h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:11px;color:var(--mut)}
  .barrow{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(34,197,94,.15)}

  nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
  .nbtn{
    display:flex;align-items:center;gap:7px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--mut); padding:8px 13px;border-radius:9px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:.15s; min-width:0;
  }
  .nbtn .material-symbols-outlined{font-size:18px}
  .nbtn:hover{color:var(--txt);border-color:var(--accent)}
  .nbtn.on{background:linear-gradient(135deg,var(--accent),#075985);color:#fff;border-color:var(--accent2)}

  main{padding:16px}
  .scr{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .scrhead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .scrhead .material-symbols-outlined{color:var(--accent2);font-size:26px}
  .scrhead h2{margin:0;font-size:19px;font-weight:700}
  .scrhead .tag{margin-left:auto;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:20px}

  .grid{display:grid;gap:14px;min-width:0}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g23{grid-template-columns:2fr 1fr}
  .g32{grid-template-columns:1fr 2fr}
  @media(max-width:820px){
    .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .ctitle{font-size:13px;color:var(--mut);font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .ctitle .material-symbols-outlined{font-size:17px;color:var(--accent2)}

  .kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
  .kpi .d{font-size:12px;margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px}
  .up{color:var(--good);background:rgba(34,197,94,.12)}
  .dn{color:var(--warn);background:rgba(245,158,11,.12)}
  .kpi .d .material-symbols-outlined{font-size:15px}

  .chartbox{position:relative;overflow:hidden;width:100%}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:12px;background:var(--panel2)}
  tbody tr:hover{background:rgba(56,189,248,.05)}
  .ovx{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .pill .material-symbols-outlined{font-size:14px}
  .s-good{color:var(--good);background:rgba(34,197,94,.12)}
  .s-warn{color:var(--warn);background:rgba(245,158,11,.12)}
  .s-bad{color:var(--bad);background:rgba(239,68,68,.12)}
  .s-info{color:var(--accent2);background:rgba(56,189,248,.12)}
  .s-mut{color:var(--mut);background:rgba(139,160,192,.12)}

  .bar{height:8px;border-radius:20px;background:var(--panel2);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:820px){.board{grid-template-columns:1fr}}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
  .col h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:6px}
  .colcnt{margin-left:auto;font-size:11px;color:var(--mut);background:var(--panel);padding:1px 8px;border-radius:20px}
  .item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px}
  .item .t{font-size:13px;font-weight:600}
  .item .m{font-size:11px;color:var(--mut);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}

  .tl{position:relative;padding-left:22px}
  .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tlrow{position:relative;padding:0 0 16px}
  .tlrow:last-child{padding-bottom:0}
  .tlrow .node{position:absolute;left:-19px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent2)}
  .tlrow.done .node{background:var(--good);border-color:var(--good)}
  .tlrow.now .node{background:var(--accent2);border-color:#fff;box-shadow:0 0 0 4px rgba(56,189,248,.2)}
  .tlrow .th{font-size:13px;font-weight:600}
  .tlrow .tt{font-size:11px;color:var(--accent2)}

  .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .grow{flex:1;min-width:0}
  .muted{color:var(--mut)}
  .big{font-size:34px;font-weight:700;letter-spacing:-1px}
  .mini{font-size:12px;color:var(--mut)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg{width:11px;height:11px;border-radius:3px;display:inline-block}

  .foot{padding:20px 16px 30px;color:var(--mut);font-size:12px;text-align:center;border-top:1px solid var(--line);margin-top:10px}

  @media(max-width:560px){
    .nbtn .lbl{display:none}
    .nbtn{padding:9px 11px}
    .scrhead .tag{display:none}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="barrow">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
        <div style="min-width:0">
          <h1>股東會管理系統</h1>
          <div class="sub">Shareholders Meeting Control Center · 2026 年度股東常會</div>
        </div>
      </div>
      <div class="live"><span class="dot"></span> 即時連線 · 股務中控台 · 08/14 09:12</div>
    </div>
  </div>

  <nav id="nav"></nav>
  <main><div id="app"></div></main>
  <div class="foot">股東會管理系統 · 純前端展示 Demo · 本頁資料皆為模擬 · 不含後端連線</div>

<script>
(function(){
  "use strict";

  var app = document.getElementById("app");
  var chartRef = null;
  var chartRefs = [];

  var MODULES = [
    {icon:"calendar_month", name:"議程與議案管理"},
    {icon:"groups",         name:"股東通知與公告"},
    {icon:"fact_check",     name:"股東報到登記"},
    {icon:"checklist",      name:"電子投票與表決"},
    {icon:"monitoring",     name:"計票與統計"},
    {icon:"gavel",          name:"議事錄與申報"}
  ];

  if (window.Chart){
    Chart.defaults.color = "#8ba0c0";
    Chart.defaults.borderColor = "rgba(30,44,68,.9)";
    Chart.defaults.font.family = "Inter, 'Noto Sans TC', sans-serif";
  }

  function killCharts(){
    if(chartRef){ try{chartRef.destroy();}catch(e){} chartRef=null; }
    for(var i=0;i<chartRefs.length;i++){ try{chartRefs[i].destroy();}catch(e){} }
    chartRefs=[];
  }
  function reg(c){ chartRefs.push(c); return c; }
  function el(id){ return document.getElementById(id); }

  (function buildNav(){
    var n = el("nav");
    var h = "";
    for(var i=0;i<MODULES.length;i++){
      h += '<button class="nbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
    }
    n.innerHTML = h;
    var btns = n.querySelectorAll("[data-i]");
    for(var j=0;j<btns.length;j++){
      btns[j].addEventListener("click", function(){
        location.hash = "go="+ (+this.getAttribute("data-i"));
      });
    }
  })();

  function setActive(i){
    var btns = document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){
      btns[k].classList.toggle("on", (+btns[k].getAttribute("data-i"))===i);
    }
  }

  function head(icon,title,tag){
    return '<div class="scrhead"><span class="material-symbols-outlined">'+icon+'</span><h2>'+title+'</h2>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>';
  }
  function kpi(v,l,dcls,dtxt,dic){
    return '<div class="card kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+
      (dtxt?'<div class="d '+dcls+'"><span class="material-symbols-outlined">'+dic+'</span>'+dtxt+'</div>':'')+'</div>';
  }

  /* ===== SCREEN 0 : 議程與議案管理 ===== */
  function s0(){
    var proposals = [
      {no:"第一案", t:"承認 2025 年度營業報告書及財務報表", type:"承認案", th:"普通決議", ver:"v3", st:"已鎖定"},
      {no:"第二案", t:"2025 年度盈餘分配案（每股配息 4.2 元）", type:"承認案", th:"普通決議", ver:"v2", st:"已鎖定"},
      {no:"第三案", t:"修訂公司章程部分條文", type:"討論案", th:"特別決議", ver:"v4", st:"審議中"},
      {no:"第四案", t:"全面改選董事（含獨立董事）", type:"選舉案", th:"累積投票", ver:"v1", st:"審議中"},
      {no:"第五案", t:"解除新任董事競業禁止限制", type:"討論案", th:"普通決議", ver:"v1", st:"草擬"},
      {no:"臨時動議", t:"股東臨時提案受理與資格審查", type:"臨時案", th:"依規定", ver:"—", st:"待收件"}
    ];
    var cols = [
      {k:"草擬", ic:"edit_note"},
      {k:"審議中", ic:"pending"},
      {k:"已鎖定", ic:"lock"},
      {k:"待收件", ic:"inbox"}
    ];
    var boardH = "";
    for(var c=0;c<cols.length;c++){
      var inner="", cnt=0;
      for(var p=0;p<proposals.length;p++){
        if(proposals[p].st===cols[c].k){
          cnt++;
          inner += '<div class="item"><div class="t">'+proposals[p].no+'</div>'+
                   '<div class="m"><span class="s-info pill">'+proposals[p].type+'</span><span>'+proposals[p].th+'</span><span>版本 '+proposals[p].ver+'</span></div>'+
                   '<div class="m" style="color:var(--mut)">'+proposals[p].t+'</div></div>';
        }
      }
      boardH += '<div class="col"><h4><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent2)">'+cols[c].ic+'</span>'+cols[c].k+'<span class="colcnt">'+cnt+'</span></h4>'+inner+'</div>';
    }

    var tl = [
      {d:"03/28", t:"董事會決議召開股東常會", s:"done"},
      {d:"04/15", t:"確定股東會基準日", s:"done"},
      {d:"05/10", t:"公告召集事由與議事手冊", s:"done"},
      {d:"06/06", t:"寄發開會通知書與電子投票開通", s:"now"},
      {d:"06/25", t:"股東常會召開（實體＋視訊）", s:"wait"},
      {d:"07/03", t:"議事錄公告與主管機關申報", s:"wait"}
    ];
    var tlH="";
    for(var i=0;i<tl.length;i++){
      var cls = tl[i].s==="done"?"done":(tl[i].s==="now"?"now":"");
      tlH += '<div class="tlrow '+cls+'"><span class="node"></span><div class="tt">'+tl[i].d+'</div><div class="th">'+tl[i].t+'</div></div>';
    }

    return '<div class="scr">'+ head("calendar_month","議程與議案管理","2026 年度股東常會") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("6","議案總數","up","本次常會","description")+
        kpi("2","選舉／討論案","dn","高關注","how_to_vote")+
        kpi("v4","最高議案版本","up","版控啟用","difference")+
        kpi("11 天","距開會日","dn","籌備中","hourglass_top")+
      '</div>'+
      '<div class="grid g32">'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">event_note</span>籌備時程軸</div><div class="tl">'+tlH+'</div></div>'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">view_kanban</span>議案審議看板</div><div class="board">'+boardH+'</div></div>'+
      '</div>'+
    '</div>';
  }

  /* ===== SCREEN 1 : 股東通知與公告 ===== */
  function s1(){
    var rows = [
      {batch:"B-01",g:"董監事及關係人",cnt:128,sent:128,read:126,vote:121,st:"完成"},
      {batch:"B-02",g:"持股 1% 以上大股東",cnt:54,sent:54,read:52,vote:49,st:"完成"},
      {batch:"B-03",g:"機構投資人",cnt:312,sent:312,read:298,vote:271,st:"完成"},
      {batch:"B-04",g:"一般自然人股東",cnt:18420,sent:18190,read:12640,vote:9880,st:"寄送中"},
      {batch:"B-05",g:"信託／保管銀行",cnt:76,sent:76,read:70,vote:63,st:"完成"},
      {batch:"B-06",g:"退件重寄名單",cnt:230,sent:118,read:41,vote:22,st:"處理中"}
    ];
    var tot={cnt:0,sent:0,vote:0};
    var tbody="";
    for(var i=0;i<rows.length;i++){
      var r=rows[i]; tot.cnt+=r.cnt; tot.sent+=r.sent; tot.vote+=r.vote;
      var sp = r.st==="完成"?"s-good":(r.st==="寄送中"?"s-info":"s-warn");
      var rp = Math.round(r.read/r.cnt*100);
      tbody += '<tr><td><b>'+r.batch+'</b></td><td>'+r.g+'</td><td>'+r.cnt.toLocaleString()+'</td><td>'+r.sent.toLocaleString()+'</td>'+
        '<td style="min-width:110px"><div class="row2"><span class="grow">'+rp+'%</span></div><div class="bar"><i style="width:'+rp+'%"></i></div></td>'+
        '<td>'+r.vote.toLocaleString()+'</td><td><span class="pill '+sp+'">'+r.st+'</span></td></tr>';
    }
    var deliverPct = Math.round(tot.sent/tot.cnt*100);
    var votePct = Math.round(tot.vote/tot.cnt*100);

    return '<div class="scr">'+ head("groups","股東通知與公告","召集通知 · 開會通知書") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi(tot.cnt.toLocaleString(),"應通知股東數","up","名冊已核對","how_to_reg")+
        kpi(deliverPct+"%","通知送達率","up","+3.1% 週增","mark_email_read")+
        kpi(votePct+"%","電子投票開通率","up","目標 55%","checklist")+
        kpi("230","退件待重寄","dn","跟催中","undo")+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">outgoing_mail</span>各批次寄發與已讀進度</div>'+
          '<div class="ovx"><table><thead><tr><th>批次</th><th>對象群組</th><th>應寄</th><th>已寄</th><th>已讀率</th><th>已投票</th><th>狀態</th></tr></thead><tbody>'+tbody+'</tbody></table></div></div>'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">stacked_line_chart</span>每日累計送達 vs 投票</div>'+
          '<div class="chartbox" style="height:230px"><canvas id="c1a"></canvas></div>'+
          '<div class="legend"><span><i class="lg" style="background:#38bdf8"></i>累計送達</span><span><i class="lg" style="background:#0369a1"></i>累計電子投票</span></div></div>'+
      '</div>'+
    '</div>';
  }
  function draw1(){
    var ctx = el("c1a"); if(!ctx||!window.Chart) return;
    chartRef = reg(new Chart(ctx,{
      type:"line",
      data:{
        labels:["06/06","06/08","06/10","06/12","06/14","06/16","06/18","06/20"],
        datasets:[
          {label:"累計送達",data:[6.2,9.8,13.1,15.6,17.2,18.1,18.6,18.9],borderColor:"#38bdf8",backgroundColor:"rgba(56,189,248,.12)",fill:true,tension:.35,pointRadius:2},
          {label:"累計投票",data:[1.1,2.8,4.6,6.2,7.9,9.1,10.0,10.4],borderColor:"#0369a1",backgroundColor:"rgba(3,105,161,.10)",fill:true,tension:.35,pointRadius:2}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{y:{ticks:{callback:function(v){return v+"k";}},grid:{color:"rgba(30,44,68,.7)"}},x:{grid:{display:false}}}}
    }));
  }

  /* ===== SCREEN 2 : 股東報到登記 ===== */
  function s2(){
    var rows=[
      {t:"09:02",id:"H-00218",name:"國泰人壽（機構）",kind:"委託書",shares:"12,840,000",st:"已報到"},
      {t:"09:05",id:"S-10457",name:"王○明",kind:"本人親自",shares:"86,500",st:"已報到"},
      {t:"09:07",id:"S-20981",name:"陳○華",kind:"視訊出席",shares:"41,200",st:"已報到"},
      {t:"09:09",id:"T-00074",name:"某信託專戶",kind:"代理出席",shares:"3,510,000",st:"已報到"},
      {t:"09:11",id:"S-33120",name:"林○芳",kind:"電子投票",shares:"22,800",st:"已投票"},
      {t:"09:13",id:"S-45012",name:"黃○德",kind:"本人親自",shares:"9,300",st:"待驗證"}
    ];
    var tbody="";
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      var sp = r.st==="待驗證"?"s-warn":(r.st==="已投票"?"s-info":"s-good");
      var kp = (r.kind==="委託書"||r.kind==="代理出席")?"s-info":((r.kind==="視訊出席"||r.kind==="電子投票")?"s-mut":"s-good");
      tbody += '<tr><td>'+r.t+'</td><td>'+r.id+'</td><td>'+r.name+'</td><td><span class="pill '+kp+'">'+r.kind+'</span></td><td style="text-align:right">'+r.shares+'</td><td><span class="pill '+sp+'">'+r.st+'</span></td></tr>';
    }
    return '<div class="scr">'+ head("fact_check","股東報到登記","開會門檻即時判定") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("2,146","報到人數","up","持續增加","groups")+
        kpi("71.4%","出席權數","up","已達開會門檻","verified")+
        kpi("1,034","委託書張數","up","已驗印","assignment_ind")+
        kpi("18","待驗證","dn","身分核對中","pending_actions")+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">how_to_reg</span>即時報到明細</div>'+
          '<div class="ovx"><table><thead><tr><th>時間</th><th>戶號</th><th>股東</th><th>出席方式</th><th style="text-align:right">出席股數</th><th>狀態</th></tr></thead><tbody>'+tbody+'</tbody></table></div></div>'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">donut_large</span>出席權數組成</div>'+
          '<div class="chartbox" style="height:210px"><canvas id="c2a"></canvas></div>'+
          '<div style="text-align:center;margin-top:6px"><div class="big" style="color:var(--accent2)">71.4%</div><div class="mini">已出席權數 / 已發行股份總數</div></div></div>'+
      '</div>'+
    '</div>';
  }
  function draw2(){
    var ctx = el("c2a"); if(!ctx||!window.Chart) return;
    chartRef = reg(new Chart(ctx,{
      type:"doughnut",
      data:{
        labels:["本人親自","委託書代理","視訊／電子","尚未出席"],
        datasets:[{data:[24.6,31.8,15.0,28.6],
          backgroundColor:["#38bdf8","#0369a1","#0ea5e9","#1e2c44"],borderColor:"#111c30",borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:false,cutout:"62%",
        plugins:{legend:{position:"bottom",labels:{boxWidth:12,padding:12}}}}
    }));
  }

  /* ===== SCREEN 3 : 電子投票與表決 ===== */
  function s3(){
    var cases=[
      {no:"第一案",t:"承認財務報表",part:96.4,ends:"—",st:"已截止"},
      {no:"第二案",t:"盈餘分配 4.2 元",part:95.8,ends:"—",st:"已截止"},
      {no:"第三案",t:"修訂公司章程",part:88.2,ends:"09:41",st:"投票中"},
      {no:"第四案",t:"全面改選董事",part:0,ends:"待宣讀",st:"未開始"},
      {no:"第五案",t:"解除競業禁止",part:0,ends:"待宣讀",st:"未開始"}
    ];
    var cardH="";
    for(var i=0;i<cases.length;i++){
      var c=cases[i];
      var sp=c.st==="投票中"?"s-info":(c.st==="已截止"?"s-good":"s-mut");
      cardH+='<div class="card" style="padding:13px"><div class="row2"><b>'+c.no+'</b><span class="pill '+sp+'" style="margin-left:auto">'+c.st+'</span></div>'+
        '<div class="mini" style="margin:4px 0 8px">'+c.t+'</div>'+
        '<div class="row2"><span class="mini grow">投票參與率</span><b>'+c.part.toFixed(1)+'%</b></div>'+
        '<div class="bar"><i style="width:'+c.part+'%"></i></div>'+
        '<div class="mini" style="margin-top:8px">截止時間 '+c.ends+'</div></div>';
    }
    return '<div class="scr">'+ head("checklist","電子投票與表決","逐案表決 · 實體＋視訊") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("第三案","目前表決議案","up","主席宣讀中","campaign")+
        kpi("88.2%","本案參與率","up","仍可投票","how_to_vote")+
        kpi("00:41","本案剩餘倒數","dn","即將截止","timer")+
        kpi("312","視訊出席在線","up","連線正常","videocam")+
      '</div>'+
      '<div class="grid g32">'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">bar_chart</span>各議案投票參與率</div>'+
          '<div class="chartbox" style="height:250px"><canvas id="c3a"></canvas></div></div>'+
        '<div><div class="grid g2">'+cardH+'</div></div>'+
      '</div>'+
    '</div>';
  }
  function draw3(){
    var ctx=el("c3a"); if(!ctx||!window.Chart) return;
    chartRef = reg(new Chart(ctx,{
      type:"bar",
      data:{
        labels:["第一案","第二案","第三案","第四案","第五案"],
        datasets:[{label:"參與率",data:[96.4,95.8,88.2,0,0],
          backgroundColor:["#0369a1","#0369a1","#38bdf8","#1e2c44","#1e2c44"],borderRadius:6}]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{y:{max:100,ticks:{callback:function(v){return v+"%";}},grid:{color:"rgba(30,44,68,.7)"}},x:{grid:{display:false}}}}
    }));
  }

  /* ===== SCREEN 4 : 計票與統計 ===== */
  function s4(){
    var rows=[
      {no:"第一案",th:"1/2 出席過半",ag:96.8,ob:2.1,ab:1.1,pass:true},
      {no:"第二案",th:"1/2 出席過半",ag:94.2,ob:4.6,ab:1.2,pass:true},
      {no:"第三案",th:"2/3 出席特別決議",ag:71.9,ob:26.4,ab:1.7,pass:true},
      {no:"第四案",th:"累積投票制",ag:0,ob:0,ab:0,pass:null},
      {no:"第五案",th:"1/2 出席過半",ag:0,ob:0,ab:0,pass:null}
    ];
    var tbody="";
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      var res = r.pass===true?'<span class="pill s-good"><span class="material-symbols-outlined">task_alt</span>通過</span>':
                (r.pass===false?'<span class="pill s-bad"><span class="material-symbols-outlined">block</span>否決</span>':
                '<span class="pill s-mut">未計票</span>');
      tbody += '<tr><td><b>'+r.no+'</b></td><td class="muted">'+r.th+'</td>'+
        '<td style="color:var(--good)">'+(r.ag?r.ag.toFixed(1)+'%':'—')+'</td>'+
        '<td style="color:var(--bad)">'+(r.ob?r.ob.toFixed(1)+'%':'—')+'</td>'+
        '<td class="muted">'+(r.ab?r.ab.toFixed(1)+'%':'—')+'</td>'+
        '<td>'+res+'</td></tr>';
    }
    return '<div class="scr">'+ head("monitoring","計票與統計","門檻判定 · 逐案開票") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("3 / 5","已完成計票議案","up","進行中","how_to_vote")+
        kpi("3","已通過議案","up","含 1 特別決議","task_alt")+
        kpi("0","否決議案","up","全數過關","thumb_up")+
        kpi("71.9%","第三案贊成權數","up","逾 2/3 門檻","verified")+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">stacked_bar_chart</span>各議案表決權數分布</div>'+
          '<div class="chartbox" style="height:250px"><canvas id="c4a"></canvas></div>'+
          '<div class="legend"><span><i class="lg" style="background:#22c55e"></i>贊成</span><span><i class="lg" style="background:#ef4444"></i>反對</span><span><i class="lg" style="background:#64748b"></i>棄權</span></div></div>'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">rule</span>門檻判定結果</div>'+
          '<div class="ovx"><table><thead><tr><th>議案</th><th>通過門檻</th><th>贊成</th><th>反對</th><th>棄權</th><th>結果</th></tr></thead><tbody>'+tbody+'</tbody></table></div></div>'+
      '</div>'+
    '</div>';
  }
  function draw4(){
    var ctx=el("c4a"); if(!ctx||!window.Chart) return;
    chartRef = reg(new Chart(ctx,{
      type:"bar",
      data:{
        labels:["第一案","第二案","第三案","第四案","第五案"],
        datasets:[
          {label:"贊成",data:[96.8,94.2,71.9,0,0],backgroundColor:"#22c55e",borderRadius:4,stack:"s"},
          {label:"反對",data:[2.1,4.6,26.4,0,0],backgroundColor:"#ef4444",borderRadius:4,stack:"s"},
          {label:"棄權",data:[1.1,1.2,1.7,0,0],backgroundColor:"#64748b",borderRadius:4,stack:"s"}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,max:100,ticks:{callback:function(v){return v+"%";}},grid:{color:"rgba(30,44,68,.7)"}}}}
    }));
  }

  /* ===== SCREEN 5 : 議事錄與申報 ===== */
  function s5(){
    var steps=[
      {d:"06/25 12:40",t:"會議結束、封存表決紀錄",s:"done",r:"系統自動"},
      {d:"06/25 15:10",t:"議事錄初稿產製（含發言摘要）",s:"done",r:"股務部"},
      {d:"06/26 10:00",t:"法務部覆核議事錄與決議事項",s:"done",r:"法務部"},
      {d:"06/27 09:30",t:"主席核章、用印",s:"now",r:"董事長／主席"},
      {d:"06/28",t:"公開資訊觀測站重大訊息申報",s:"wait",r:"投資人關係部"},
      {d:"07/03",t:"議事錄公告及股東寄送",s:"wait",r:"股務部"}
    ];
    var tlH="";
    for(var i=0;i<steps.length;i++){
      var cls=steps[i].s==="done"?"done":(steps[i].s==="now"?"now":"");
      tlH+='<div class="tlrow '+cls+'"><span class="node"></span><div class="tt">'+steps[i].d+' · '+steps[i].r+'</div><div class="th">'+steps[i].t+'</div></div>';
    }
    var files=[
      {n:"股東常會議事錄.pdf",st:"待用印",sp:"s-warn"},
      {n:"各項議案表決結果統計表.xlsx",st:"已產製",sp:"s-good"},
      {n:"董事當選名單.pdf",st:"待產製",sp:"s-mut"},
      {n:"重大訊息申報稿.docx",st:"草擬中",sp:"s-info"},
      {n:"出席股東簽名簿.pdf",st:"已封存",sp:"s-good"}
    ];
    var fH="";
    for(var f=0;f<files.length;f++){
      fH+='<div class="row2" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="material-symbols-outlined" style="color:var(--accent2)">description</span><span class="grow">'+files[f].n+'</span><span class="pill '+files[f].sp+'">'+files[f].st+'</span></div>';
    }
    return '<div class="scr">'+ head("gavel","議事錄與申報","決議公告 · 主管機關申報") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("3","已成立決議","up","待公告","gavel")+
        kpi("06/28","申報截止日","dn","法定 2 日內","event_available")+
        kpi("83%","議事錄完成度","up","覆核完成","fact_check")+
        kpi("5","應備文件","dn","2 份待產製","folder_open")+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">history</span>議事錄與申報進度</div><div class="tl">'+tlH+'</div></div>'+
        '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">folder_open</span>應備文件清單</div>'+fH+
          '<div class="mini" style="margin-top:10px">依公司法第 183 條，議事錄應於會後 20 日內分發各股東。</div></div>'+
      '</div>'+
    '</div>';
  }

  var SCREENS = [
    {fn:s0, draw:null},
    {fn:s1, draw:draw1},
    {fn:s2, draw:draw2},
    {fn:s3, draw:draw3},
    {fn:s4, draw:draw4},
    {fn:s5, draw:null}
  ];

  window.show = function(i){
    killCharts();
    var s = SCREENS[i] || SCREENS[0];
    app.innerHTML = s.fn();
    setActive(i);
    void app.offsetHeight;
    if(s.draw) s.draw();
  };

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
</body>
</html>
