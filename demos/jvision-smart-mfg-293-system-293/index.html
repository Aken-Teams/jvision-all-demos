<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>股東會管理系統｜控制中心</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --color-primary: #0D9488;
  --color-on-primary: #000000;
  --color-secondary: #2DD4BF;
  --color-on-secondary: #0F172A;
  --color-accent: #D97706;
  --color-on-accent: #000000;
  --color-background: #F0FDFA;
  --color-foreground: #134E4A;
  --color-card: #FFFFFF;
  --color-card-foreground: #134E4A;
  --color-muted: #E8F1F4;
  --color-muted-foreground: #475569;
  --color-border: #5EEAD4;
  --color-destructive: #DC2626;
  --color-on-destructive: #FFFFFF;
  --color-ring: #0D9488;

  /* External compatibility contract */
  --blue: #0D9488;
  --ink: #134E4A;
  --muted: #475569;
  --line: #5EEAD4;

  /* Existing internal aliases */
  --bg: var(--color-background);
  --panel: var(--color-card);
  --panel2: #E6FFFB;
  --accent: var(--color-primary);
  --accent2: #0F766E;
  --txt: var(--color-foreground);
  --mut: var(--color-muted-foreground);
  --good: #15803D;
  --warn: #A65005;
  --bad: #B91C1C;

  --font-display: "Cormorant Garamond", "Crimson Pro", Georgia, serif;
  --font-body: "Crimson Pro", Georgia, "Times New Roman", serif;
  --font-label: "Cinzel", "Crimson Pro", Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --ease: 180ms ease;
}

* {
  box-sizing: border-box;
}

html {
  color-scheme: light;
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--color-background);
  color: var(--color-foreground);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.45;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
a,
[role="button"],
[data-i] {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
[role="button"]:focus-visible,
[data-i]:focus-visible,
canvas:focus-visible {
  outline: 3px solid var(--color-ring);
  outline-offset: 3px;
}

::selection {
  background: var(--color-secondary);
  color: var(--color-on-secondary);
}

.material-symbols-outlined {
  display: inline-block;
  flex: none;
  font-family: "Material Symbols Outlined";
  font-size: 1.15em;
  font-style: normal;
  font-weight: normal;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  vertical-align: middle;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-feature-settings: "liga";
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 10px clamp(14px, 2vw, 28px);
  background: var(--color-card);
  border-bottom: 3px solid var(--color-primary);
}

.barrow {
  width: min(1500px, 100%);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px 24px;
  flex-wrap: wrap;
}

.brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand .logo {
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  background: var(--color-primary);
  color: var(--color-on-primary);
  border: 2px solid var(--color-foreground);
  border-radius: var(--radius-sm);
}

.brand .logo .material-symbols-outlined {
  font-size: 24px;
}

.brand h1 {
  margin: 0;
  overflow: hidden;
  color: var(--color-foreground);
  font-family: var(--font-display);
  font-size: clamp(20px, 2vw, 27px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand .sub {
  margin-top: 3px;
  color: var(--color-muted-foreground);
  font-family: var(--font-label);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .055em;
}

.live {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-muted-foreground);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.dot {
  width: 10px;
  height: 10px;
  flex: none;
  background: #15803D;
  border: 2px solid var(--color-card);
  outline: 1px solid #166534;
  border-radius: 50%;
}

nav {
  width: min(1500px, calc(100% - 28px));
  margin: 10px auto 0;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
}

.nbtn {
  min-width: 0;
  min-height: 44px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: var(--color-card);
  color: var(--color-muted-foreground);
  border: 1px solid #5CBEB5;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.15;
  transition: color var(--ease), background-color var(--ease), border-color var(--ease);
}

.nbtn .material-symbols-outlined {
  color: var(--color-primary);
  font-size: 19px;
}

.nbtn:hover {
  background: #CCFBF1;
  color: var(--color-foreground);
  border-color: var(--color-primary);
}

.nbtn.on {
  background: var(--color-primary);
  color: var(--color-on-primary);
  border-color: var(--color-foreground);
}

.nbtn.on .material-symbols-outlined {
  color: var(--color-on-primary);
}

main {
  width: min(1500px, 100%);
  margin: 0 auto;
  padding: 14px clamp(14px, 2vw, 28px) 20px;
}

.scr {
  animation: screen-enter 350ms ease-out both;
}

@keyframes screen-enter {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.scrhead {
  min-height: 48px;
  margin: 0 0 10px;
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--color-border);
}

.scrhead > .material-symbols-outlined {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  background: var(--color-primary);
  color: var(--color-on-primary);
  border-radius: var(--radius-sm);
  font-size: 20px;
}

.scrhead h2 {
  margin: 0;
  color: var(--color-foreground);
  font-family: var(--font-display);
  font-size: clamp(22px, 2vw, 30px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .015em;
}

.scrhead .tag {
  margin-left: auto;
  padding: 4px 9px;
  background: var(--color-muted);
  color: var(--color-muted-foreground);
  border: 1px solid #8ECFC8;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.grid {
  min-width: 0;
  display: grid;
  gap: 10px;
}

.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g23 { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.g32 { grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr); }

.card {
  min-width: 0;
  padding: 13px;
  overflow: hidden;
  background: var(--color-card);
  color: var(--color-card-foreground);
  border: 1px solid #79C9C1;
  border-radius: var(--radius-md);
  transition: border-color var(--ease), background-color var(--ease);
}

.card:hover {
  border-color: var(--color-primary);
}

.ctitle {
  margin: 0 0 10px;
  padding-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--color-foreground);
  border-bottom: 1px solid var(--color-border);
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.1;
}

.ctitle .material-symbols-outlined {
  color: var(--color-primary);
  font-size: 18px;
}

.kpi {
  position: relative;
  padding-left: 16px;
  border-left: 4px solid var(--color-primary);
}

.kpi:nth-child(2n) {
  border-left-color: var(--color-accent);
}

.kpi .v,
.big {
  color: var(--color-foreground);
  font-family: var(--font-display);
  font-variant-numeric: tabular-nums lining-nums;
  line-height: 1;
}

.kpi .v {
  font-size: clamp(27px, 3vw, 36px);
  font-weight: 700;
  letter-spacing: -.02em;
}

.kpi .l {
  margin-top: 4px;
  color: var(--color-muted-foreground);
  font-size: 13px;
  font-weight: 600;
}

.kpi .d {
  min-height: 25px;
  margin-top: 8px;
  padding: 3px 7px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid currentColor;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
}

.kpi .d .material-symbols-outlined {
  font-size: 15px;
}

.up {
  background: #DCFCE7;
  color: #166534;
}

.dn {
  background: #FEF3C7;
  color: #854D0E;
}

.chartbox {
  position: relative;
  width: 100%;
  overflow: hidden;
}

canvas {
  max-width: 100%;
}

.ovx {
  max-width: 100%;
  overflow-x: auto;
  border: 1px solid #79C9C1;
  border-radius: var(--radius-sm);
  scrollbar-color: var(--color-primary) var(--color-muted);
}

table {
  width: 100%;
  border-collapse: collapse;
  color: var(--color-card-foreground);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

th,
td {
  padding: 9px 10px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid #B8E4DF;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #CCFBF1;
  color: #134E4A;
  font-family: var(--font-label);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .035em;
  text-transform: none;
}

td {
  background: var(--color-card);
}

td:first-child,
td:nth-child(2):not(:last-child) {
  font-variant-numeric: tabular-nums;
}

td:first-child,
td[style*="text-align:right"],
td:nth-child(3),
td:nth-child(4),
td:nth-child(5) {
  font-feature-settings: "tnum" 1;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover td {
  background: #F0FDFA;
}

.pill {
  min-height: 24px;
  padding: 2px 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: var(--color-foreground);
  border: 1px solid currentColor;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.15;
  white-space: nowrap;
}

.pill .material-symbols-outlined {
  font-size: 14px;
}

.s-good {
  background: #DCFCE7;
  color: #166534;
}

.s-warn {
  background: #FEF3C7;
  color: #854D0E;
}

.s-bad {
  background: #FEE2E2;
  color: #991B1B;
}

.s-info {
  background: #CCFBF1;
  color: #115E59;
}

.s-mut {
  background: #E2E8F0;
  color: #334155;
}

.bar {
  height: 8px;
  margin-top: 6px;
  overflow: hidden;
  background: #DCE9E8;
  border: 1px solid #A7D9D4;
  border-radius: 2px;
}

.bar > i {
  display: block;
  height: 100%;
  background: var(--color-primary);
  border-radius: 0;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(190px, 1fr));
  gap: 8px;
}

.col {
  min-width: 0;
  padding: 9px;
  background: #F0FDFA;
  border: 1px solid #79C9C1;
  border-radius: var(--radius-sm);
}

.col h4 {
  min-height: 28px;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--color-foreground);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
}

.col h4 .material-symbols-outlined {
  color: var(--color-primary) !important;
}

.colcnt {
  min-width: 24px;
  margin-left: auto;
  padding: 2px 6px;
  background: var(--color-primary);
  color: var(--color-on-primary);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: center;
}

.item {
  margin-bottom: 7px;
  padding: 8px 9px;
  background: var(--color-card);
  border: 1px solid #A7D9D4;
  border-left: 3px solid var(--color-primary);
  border-radius: var(--radius-sm);
  transition: background-color var(--ease), border-color var(--ease);
}

.item:last-child {
  margin-bottom: 0;
}

.item:hover {
  background: #E6FFFB;
  border-color: var(--color-primary);
}

.item .t {
  color: var(--color-foreground);
  font-size: 14px;
  font-weight: 700;
}

.item .m {
  margin-top: 4px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px 8px;
  color: var(--color-muted-foreground);
  font-size: 12px;
  line-height: 1.35;
}

.tl {
  position: relative;
  padding-left: 25px;
}

.tl::before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 7px;
  width: 2px;
  background: #70BFB7;
}

.tlrow {
  position: relative;
  padding: 0 0 14px;
}

.tlrow:last-child {
  padding-bottom: 0;
}

.tlrow .node {
  position: absolute;
  top: 2px;
  left: -24px;
  width: 14px;
  height: 14px;
  background: var(--color-card);
  border: 2px solid #64748B;
  border-radius: 50%;
}

.tlrow.done .node {
  background: #15803D;
  border-color: #166534;
}

.tlrow.now .node {
  background: var(--color-accent);
  border-color: #7C2D12;
  outline: 3px solid #FDE68A;
}

.tlrow .th {
  color: var(--color-foreground);
  font-size: 14px;
  font-weight: 600;
}

.tlrow .tt {
  color: #0F766E;
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.row2 {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.grow {
  min-width: 0;
  flex: 1;
}

.muted,
.mini {
  color: var(--color-muted-foreground);
}

.big {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -.025em;
}

.mini {
  font-size: 12px;
}

.legend {
  margin-top: 9px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  color: var(--color-muted-foreground);
  font-size: 12px;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.lg {
  width: 11px;
  height: 11px;
  display: inline-block;
  border: 1px solid #334155;
  border-radius: 2px;
}

.foot {
  margin-top: 10px;
  padding: 18px 16px 26px;
  color: var(--color-muted-foreground);
  border-top: 1px solid var(--color-border);
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: .04em;
  text-align: center;
}

@media (max-width: 1180px) {
  nav {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .g4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .g23,
  .g32 {
    grid-template-columns: 1fr;
  }

  .board {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 768px) {
  .topbar {
    position: relative;
  }

  .barrow {
    align-items: flex-start;
  }

  .live {
    width: 100%;
    padding-top: 7px;
    border-top: 1px solid var(--color-border);
  }

  nav {
    width: calc(100% - 24px);
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
  }

  .nbtn {
    min-width: max-content;
    flex: 0 0 auto;
    scroll-snap-align: start;
  }

  .g3,
  .g2,
  .g23,
  .g32 {
    grid-template-columns: 1fr;
  }

  .board {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 12px;
  }
}

@media (max-width: 480px) {
  body {
    font-size: 15px;
  }

  .topbar {
    padding-inline: 12px;
  }

  .brand {
    align-items: flex-start;
  }

  .brand .logo {
    width: 36px;
    height: 36px;
  }

  .brand h1 {
    font-size: 21px;
  }

  .brand .sub {
    max-width: 270px;
    white-space: normal;
  }

  main {
    padding-inline: 12px;
  }

  .scrhead {
    align-items: flex-start;
  }

  .scrhead h2 {
    padding-top: 4px;
    font-size: 23px;
  }

  .scrhead .tag {
    display: none;
  }

  .g4 {
    grid-template-columns: 1fr;
  }

  .kpi {
    min-height: 118px;
  }

  .nbtn .lbl {
    display: inline;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }

  .scr {
    opacity: 1;
    transform: none;
    animation: none;
  }
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="barrow">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
        <div style="min-width:0">
          <h1>股東會管理系統</h1>
          <div class="sub">Shareholders Meeting Control Center · 2026 年度股東常會</div>
        </div>
      </div>
      <div class="live"><span class="dot"></span> 即時連線 · 股務中控台 · 08/14 09:12</div>
    </div>
  </div>

  <nav id="nav"></nav>
  <main><div id="app"></div></main>
  <div class="foot">股東會管理系統 · 純前端展示 Demo · 本頁資料皆為模擬 · 不含後端連線</div>

<script>
(function(){
  "use strict";

  var app = document.getElementById("app");
  var chartRef = null;
  var chartRefs = [];

  var MODULES = [
    {icon:"calendar_month", name:"議程與議案管理"},
    {icon:"groups",         name:"股東通知與公告"},
    {icon:"fact_check",     name:"股東報到登記"},
    {icon:"checklist",      name:"電子投票與表決"},
    {icon:"monitoring",     name:"計票與統計"},
    {icon:"gavel",          name:"議事錄與申報"}
  ];

  if (window.Chart){
    Chart.defaults.color = "#8ba0c0";
    Chart.defaults.borderColor = "rgba(30,44,68,.9)";
    Chart.defaults.font.family = "Inter, 'Noto Sans TC', sans-serif";
  }

  function killCharts(){
    if(chartRef){ try{chartRef.destroy();}catch(e){} chartRef=null; }
    for(var i=0;i<chartRefs.length;i++){ try{chartRefs[i].destroy();}catch(e){} }
    chartRefs=[];
  }
  function reg(c){ chartRefs.push(c); return c; }
  function el(id){ return document.getElementById(id); }

  (function buildNav(){
    var n = el("nav");
    var h = "";
    for(var i=0;i<MODULES.length;i++){
