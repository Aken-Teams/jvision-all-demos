<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>收貨預約與月台排程 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#f8fafc;
  --track:#e2e8f0;
  --sidebar:#fff;
  --sidebar2:#fff;
  --side-edge:#e6e8ea;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#334155;
  --r:8px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.035);
  --shadow-hover:0 2px 4px rgba(15,23,42,.07),0 8px 20px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{font-family:"Open Sans",sans-serif;background:var(--color-background);color:var(--color-foreground);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{font-family:"Poppins","Open Sans",sans-serif}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-feature-settings:"liga"}
:focus{outline:none}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:4px}
::selection{background:#a7f3d0;color:#052e16}

.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar{width:100%;height:68px;flex:0 0 auto;display:flex;align-items:center;gap:28px;padding:0 32px;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,23,42,.02)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:none}
.brand-logo{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:6px;background:var(--color-primary);color:var(--color-on-primary);box-shadow:none}
.brand-logo .material-symbols-outlined{font-size:21px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand-txt span{display:block;margin-top:1px;color:var(--muted);font-size:9px;font-weight:700;line-height:1;letter-spacing:.14em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;flex:0 0 auto;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;text-align:left;white-space:nowrap;transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.nav button .material-symbols-outlined{font-size:18px;flex:none}
.nav button:hover{background:var(--color-muted);color:var(--ink);border-color:var(--line)}
.nav button.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.nav button.on:hover{background:#1e293b;border-color:#1e293b}
.nav .idx{margin-left:3px;font-family:"Open Sans",sans-serif;font-size:9px;font-variant-numeric:tabular-nums;opacity:.65}
.side-foot{margin-left:auto;flex:none;padding-left:18px;border-left:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.45;white-space:nowrap}
.side-foot b{color:var(--ink)}

.main{width:100%;max-width:1600px;margin:0 auto;padding:24px 32px 56px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.topbar>div:first-child{min-width:0}
.topbar h1{display:flex;align-items:center;gap:10px;margin:0;color:var(--ink);font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:20px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
.chip .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #d1fae5;animation:status-pulse 2.2s ease-in-out infinite}
.avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #1e293b;border-radius:5px;background:var(--color-primary);color:#fff;font-family:"Poppins",sans-serif;font-size:11px;font-weight:600}
@keyframes status-pulse{0%,100%{box-shadow:0 0 0 3px #d1fae5}50%{box-shadow:0 0 0 5px rgba(5,150,105,.09)}}

#screen>.grid,#screen>.sec{animation:screen-in .4s cubic-bezier(.2,.8,.2,1) both}
#screen>.grid:nth-child(2){animation-delay:.05s}
#screen>.grid:nth-child(3){animation-delay:.1s}
#screen>.grid:nth-child(4){animation-delay:.15s}
@keyframes screen-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.sec,.kpi,.stat,.tile{background:var(--color-card);color:var(--color-card-foreground);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#cbd5e1;box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.card,.sec{padding:16px;min-width:0}
.sec{margin-bottom:12px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:13px;font-weight:600;line-height:1.4}
.sec>h3{margin-bottom:12px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:18px}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:12px}
.dl dt{color:var(--muted);font-size:11px;font-weight:600}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font-size:10px;font-weight:600}

.kpi,.stat{position:relative;min-width:0;overflow:hidden;padding:15px 16px}
.kpi::before,.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.kpi::after{display:none}
.kpi .ico{position:relative;z-index:1;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.kpi .ico .material-symbols-outlined{font-size:18px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:11px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:14px}
.kpi .val,.stat .val{margin-top:3px;color:var(--ink);font-family:"Poppins","Open Sans",sans-serif;font-size:25px;font-weight:600;line-height:1.25;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:10px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:13px}

.card.pad0>.card-h{margin-bottom:0;padding:15px 16px 12px!important;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;color:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums}
th{padding:9px 12px;background:var(--th);border-bottom:1px solid var(--line);color:var(--muted);font-family:"Open Sans",sans-serif;font-size:9.5px;font-weight:700;line-height:1.4;letter-spacing:.045em;text-align:left;text-transform:none;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);line-height:1.45;text-align:left;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fafc}
td b{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:22px;padding:2px 8px;border:1px solid transparent;border-radius:4px;font-size:9.5px;font-weight:700;line-height:1.35;white-space:nowrap}
.t-ok{background:#ecfdf5;border-color:#a7f3d0;color:#046c4e}
.t-warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.t-bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.t-info{background:#f1f5f9;border-color:#cbd5e1;color:#334155}
.t-gray{background:#f8fafc;border-color:#e2e8f0;color:#475569}
.t-acc,.t-pink{background:#ecfdf5;border-color:#a7f3d0;color:#047857}

.bar{height:6px;min-width:56px;overflow:hidden;border-radius:2px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 16px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-22px;top:3px;width:12px;height:12px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:11.5px;font-weight:600}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:10.5px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:11.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:18px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10px}
.note{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted);font-size:10.5px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--th);border:1px solid var(--line);border-radius:6px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;color:var(--ink);font-family:"Poppins",sans-serif;font-size:11px;font-weight:600}
.col-h .cnt{padding:1px 7px;background:#fff;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:9px}
.pcard{padding:10px 11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.pcard:hover{border-color:#cbd5e1;box-shadow:var(--shadow);transform:translateY(-1px)}
.pcard b{font-size:11.5px;font-weight:600}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:7px;color:var(--ink);font-size:10px}
.mini-av{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:8px;font-weight:800}
.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:6px}
.lane-row .num{width:29px;height:29px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:12px;font-weight:600}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:10.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;width:21px;height:21px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:50%;background:#fff;color:#64748b;font-family:ui-monospace,Consolas,monospace;font-size:9px}
.steps .ln{width:18px;height:2px;background:var(--line)}
.steps .s.done{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .s.cur{border-color:var(--accent);color:var(--accent);animation:current-step 1.8s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}
@keyframes current-step{50%{box-shadow:0 0 0 4px rgba(5,150,105,.12)}}
.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 3px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:11.5px;font-weight:600}
.rep-row .sku span{color:var(--muted);font-size:10px}
.gauge{width:108px;flex:none}
.gauge .track{position:relative;height:7px;overflow:hidden;border-radius:2px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:9px;text-align:right}
.band{position:relative;height:24px;min-width:150px;border-radius:4px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:10px;height:18px;border-radius:2px;background:var(--accent)}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 15px;border-top:3px solid var(--color-primary)}
.tile .ti{width:33px;height:33px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.tile .ti .material-symbols-outlined{font-size:18px}
.tile b{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tile p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.55}
.tile .tv{color:var(--ink);font-family:"Poppins","Open Sans",sans-serif;font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.av{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800}
.who{display:inline-flex;align-items:center;gap:6px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Open Sans",sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:5px!important;box-shadow:var(--shadow)!important}

@media(max-width:1200px){
  .sidebar{gap:18px;padding:0 22px}
  .side-foot{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .sidebar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 16px;gap:8px 16px}
  .brand{height:40px}
  .brand-txt span{display:none}
  .nav{order:2;width:100%;flex-basis:100%;padding-bottom:1px}
  .nav button{min-height:38px}
  .main{padding:20px 20px 44px}
  .topbar{align-items:flex-start}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
  .g2,.g3{grid-template-columns:1fr}
  .card,.sec{padding:14px}
  th,td{padding-left:10px;padding-right:10px}
}
@media(max-width:560px){
  .sidebar{padding:9px 12px}
  .brand-logo{width:36px;height:36px}
  .nav{gap:3px}
  .nav button{min-width:42px;justify-content:center;padding:8px 10px}
  .nav button .txt,.nav button .idx{display:none}
  .main{padding:16px 12px 38px}
  .topbar{margin-bottom:14px;padding-bottom:14px}
  .topbar h1{font-size:19px}
  .top-right{width:100%;gap:6px}
  .chip{min-height:32px;padding:5px 8px;font-size:10px}
  .g4{grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:12px}
  .tile .tv{font-size:18px}
  .tile p{font-size:9.5px}
  .board{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
  .lane-row{align-items:flex-start;flex-wrap:wrap}
  .steps{width:100%;padding-left:41px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .top-right .avatar{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen>.grid,#screen>.sec{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">local_shipping</span></div>
      <div class="brand-txt"><b>月台排程台</b><span>DOCK APPOINTMENT</span></div>
    </div>
