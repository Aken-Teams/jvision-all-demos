<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>電子實驗記錄本 ELN｜實驗數據管理</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0891b2; --accent2:#22d3ee; --accent3:#67e8f9;
  --bg:#071417; --bg2:#0b1d22; --card:#0f272d; --card2:#123037;
  --ink:#e6f6fa; --muted:#8fb3bc; --dim:#5f8791;
  --line:#173a43; --line2:#1f4c57;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#22d3ee;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(8,145,178,.16),transparent),var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  line-height:1;letter-spacing:normal;vertical-align:middle;}
/* TOP NAV */
.topnav{background:linear-gradient(180deg,#0c2229,#081a1f);border-bottom:1px solid var(--line2);
  position:sticky;top:0;z-index:20;box-shadow:0 4px 22px rgba(0,0,0,.5);}
.topnav .bar{display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .mk{width:42px;height:42px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px -4px rgba(8,145,178,.75);}
.brand .mk .material-symbols-outlined{font-size:24px;color:#04141a;}
.brand .tt{font-weight:800;font-size:16px;line-height:1.2;letter-spacing:.2px;}
.brand .st{font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.7px;text-transform:uppercase;}
.topnav .spacer{flex:1;min-width:8px;}
.livechips{display:flex;gap:8px;flex-wrap:wrap;}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:6px 11px;border-radius:999px;background:rgba(8,145,178,.16);color:var(--accent2);
  border:1px solid var(--line2);}
.lchip .material-symbols-outlined{font-size:15px;}
.lchip .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2);}
.navrow{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap;}
.navbtn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:11px;
  background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:600;min-width:0;transition:all .15s;}
.navbtn .material-symbols-outlined{font-size:19px;flex-shrink:0;}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .nix{font-size:10px;opacity:.55;font-weight:700;}
.navbtn:hover{background:rgba(255,255,255,.05);color:var(--ink);}
.navbtn.active{background:linear-gradient(135deg,rgba(8,145,178,.34),rgba(34,211,238,.16));
  color:#fff;border-color:var(--accent);box-shadow:0 4px 14px -6px rgba(8,145,178,.85);}
/* HEAD */
.pagehead{padding:20px 26px 4px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.pagehead .ph-t{font-size:19px;font-weight:800;min-width:0;}
.pagehead .ph-s{font-size:12.5px;color:var(--muted);margin-top:3px;}
.pagehead .ph-tag{font-size:11px;font-weight:700;color:var(--accent2);background:rgba(8,145,178,.16);
  padding:5px 11px;border-radius:999px;border:1px solid var(--line2);}
.content{padding:16px 26px 46px;min-width:0;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.mt{margin-top:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;
  box-shadow:0 2px 10px rgba(0,0,0,.32);}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.card .csub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
/* SPLIT WORKSPACE (signature) */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;min-width:0;align-items:start;}
.split.wide{grid-template-columns:380px 1fr;}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0;
  box-shadow:0 2px 10px rgba(0,0,0,.32);overflow:hidden;}
.pane-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pane-h .pt{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0;}
.pane-h .pt .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.pane-h .cnt{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--muted);flex-shrink:0;}
.pane-b{padding:12px;max-height:560px;overflow-y:auto;}
.pane-b.pad{padding:16px;}
.searchbar{display:flex;align-items:center;gap:8px;margin:0 12px 4px;background:var(--bg2);border:1px solid var(--line2);
  border-radius:10px;padding:8px 11px;font-size:12px;color:var(--muted);}
.searchbar .material-symbols-outlined{font-size:17px;color:var(--dim);}
.litem{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;min-width:0;}
.litem:last-child{margin-bottom:0;}
.litem:hover{border-color:var(--line2);}
.litem.sel{border-color:var(--accent);background:linear-gradient(135deg,rgba(8,145,178,.16),rgba(34,211,238,.06));box-shadow:0 3px 12px -6px rgba(8,145,178,.7);}
.litem .lt{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;}
.litem .lt .id{font-size:10.5px;color:var(--accent2);font-weight:700;font-variant-numeric:tabular-nums;}
.litem .lm{font-size:11px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;}
.litem .lm b{color:var(--ink);font-weight:600;}
/* detail meta rows */
.metagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:0;}
.mcell{background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;min-width:0;}
.mcell b{display:block;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.4px;margin-bottom:4px;}
.mcell .v{font-size:13px;font-weight:700;}
/* KPI */
.kpi{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card),var(--card2));}
.kpi .klab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .klab .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.kpi .kval{font-size:27px;font-weight:800;margin-top:10px;letter-spacing:-.5px;color:#fff;}
.kpi .kval small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .kfoot{font-size:11.5px;margin-top:8px;font-weight:600;display:flex;align-items:center;gap:5px;}
.kpi .kfoot .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
.kpi .bar{position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(var(--accent),var(--accent2));}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink);}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:rgba(8,145,178,.08);}
.tw{overflow-x:auto;border-radius:10px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge .material-symbols-outlined{font-size:13px;}
.b-ok{background:rgba(52,211,153,.16);color:#6ee7b7;}
.b-warn{background:rgba(251,191,36,.16);color:#fcd34d;}
.b-bad{background:rgba(248,113,113,.16);color:#fca5a5;}
.b-info{background:rgba(34,211,238,.18);color:#67e8f9;}
.b-grey{background:rgba(143,179,188,.14);color:#b3ccd2;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.progress{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;min-width:60px;}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{overflow:hidden;min-width:0;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.bcol{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.bcol .bh{font-size:12px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
.bcol .bh .cnt{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.bcard{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 11px;margin-bottom:9px;}
.bcard:last-child{margin-bottom:0;}
.bcard .bt{font-weight:700;font-size:12.5px;}
.bcard .bm{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.bcard .bamt{font-weight:800;color:var(--accent2);}
.ltop{border-top:3px solid var(--accent);}
/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line2);}
.tev{position:relative;padding-bottom:18px;}
.tev:last-child{padding-bottom:0;}
.tev .tdot{position:absolute;left:-25px;top:2px;width:16px;height:16px;border-radius:50%;
  background:var(--card);border:3px solid var(--accent);}
.tev.done .tdot{background:var(--accent);}
.tev .thd{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.tev .tdt{font-size:11px;color:var(--dim);font-weight:600;}
.tev .tbody{font-size:12px;color:var(--muted);margin-top:4px;}
/* step log */
.slog{position:relative;padding-left:22px;}
.slog:before{content:"";position:absolute;left:7px;top:2px;bottom:2px;width:2px;background:var(--line2);}
.sev{position:relative;padding-bottom:15px;}
.sev:last-child{padding-bottom:0;}
.sev .sdot{position:absolute;left:-19px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--card);}
.sev .sh{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sev .stm{font-size:10.5px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums;}
.sev .sb{font-size:11.5px;color:var(--muted);margin-top:3px;}
/* alert */
.alertitem{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start;background:var(--bg2);}
.alertitem:last-child{margin-bottom:0;}
.alertitem .aic{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.alertitem .aic .material-symbols-outlined{font-size:20px;}
.alertitem .abody{min-width:0;flex:1;}
.alertitem .at{font-weight:700;font-size:13px;}
.alertitem .ad{font-size:11.5px;color:var(--muted);margin-top:2px;}
/* diff */
.diffrow{display:flex;gap:10px;padding:9px 11px;border-radius:9px;font-size:12px;margin-bottom:7px;align-items:flex-start;}
.diffrow:last-child{margin-bottom:0;}
.diffrow .dt{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.d-add{background:rgba(52,211,153,.1);}.d-add .dt{background:rgba(52,211,153,.2);color:#6ee7b7;}
.d-mod{background:rgba(251,191,36,.1);}.d-mod .dt{background:rgba(251,191,36,.2);color:#fcd34d;}
.d-del{background:rgba(248,113,113,.1);}.d-del .dt{background:rgba(248,113,113,.2);color:#fca5a5;}
.diffrow .db{min-width:0;}.diffrow .db b{color:var(--ink);}
/* legend / ministat */
.legendrow{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legendrow span{display:inline-flex;align-items:center;gap:5px;}
.miniStat{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;}
.miniStat .ms{min-width:0;}
.miniStat .ms .v{font-size:20px;font-weight:800;color:#fff;}
.miniStat .ms .l{font-size:11px;color:var(--muted);}
/* pill input */
.pill-input{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pill-input .pi{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:12px;min-width:0;}
.pill-input .pi b{display:block;font-size:10px;color:var(--dim);font-weight:700;margin-bottom:3px;letter-spacing:.4px;}
/* sign card */
.signrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);margin-bottom:10px;}
.signrow:last-child{margin-bottom:0;}
.signrow .av{width:34px;height:34px;border-radius:10px;background:rgba(8,145,178,.2);color:var(--accent2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.signrow .si{min-width:0;flex:1;}
.signrow .sn{font-size:12.5px;font-weight:700;}
.signrow .sr{font-size:11px;color:var(--muted);margin-top:2px;}
/* knowledge tag */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(8,145,178,.14);color:var(--accent2);border:1px solid var(--line2);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .split,.split.wide{grid-template-columns:1fr;}
  .pane-b{max-height:none;}
}
@media(max-width:820px){
  .g4,.g3,.g2{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
  .metagrid{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .navbtn .nlab{display:none;}
  .navbtn{padding:9px 11px;}
  .navbtn .nix{display:none;}
  .content{padding:14px 14px 36px;}
  .pagehead{padding:16px 15px 2px;}
  .board{grid-template-columns:1fr;}
  .topnav .bar{padding:11px 15px;}
  .navrow{padding:0 10px 10px;}
  .metagrid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header class="topnav">
  <div class="bar">
    <div class="brand">
      <div class="mk"><span class="material-symbols-outlined">biotech</span></div>
      <div>
        <div class="tt">電子實驗記錄本 ELN</div>
        <div class="st">Electronic Lab Notebook · R&amp;D Data</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="livechips">
      <span class="lchip"><span class="live"></span>研發現場連線</span>
      <span class="lchip"><span class="material-symbols-outlined">calendar_month</span>2026-08-14</span>
      <span class="lchip"><span class="material-symbols-outlined">verified_user</span>GLP · 21 CFR Part 11</span>

  <nav class="navrow" id="nav"></nav>
</header>
<div class="pagehead">
  <div style="min-width:0">
    <div class="ph-t" id="ptitle">實驗計畫設計</div>

  </div>
  <div class="spacer" style="flex:1"></div>

</div>
<div class="content" id="view"></div>

<script>
"use strict";
var MODS=[
  {icon:"science",name:"實驗計畫設計",sub:"實驗目的、假設、變因與步驟結構化建立"},
  {icon:"description",name:"電子記錄本",sub:"實驗記錄逐步輸入、試劑批號與觀察附圖"},
  {icon:"biotech",name:"設備數據匯入",sub:"儀器介接自動擷取量測數據與圖譜"},
  {icon:"history",name:"版本追溯",sub:"記錄修改軌跡、版本比對與稽核軌跡"},
  {icon:"verified",name:"審閱簽署",sub:"覆核、電子簽章與 GLP 合規鎖定"},
  {icon:"insights",name:"數據檢索分析",sub:"全文檢索、實驗成果彙整與知識重用"}
];
var echs=[];
function destroyCharts(){for(var i=0;i<echs.length;i++){try{echs[i].dispose();}catch(e){}}echs=[];}
var AXCOL="#8fb3bc",GRID="#1f4c57";
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  try{
    var c=echarts.init(el,null,{renderer:"canvas"});
    opt.animation=false;
    opt.textStyle=opt.textStyle||{fontFamily:'Inter,"Noto Sans TC",sans-serif'};
    c.setOption(opt);
    echs.push(c);
  }catch(e){}
}
function kpi(l,v,u,ic,f,cls,fic){
  return '<div class="card kpi"><span class="bar"></span>'+
    '<div class="klab"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="kval">'+v+'<small>'+u+'</small></div>'+
    '<div class="kfoot '+cls+'"><span class="material-symbols-outlined">'+fic+'</span>'+f+'</div></div>';
}
function alertItem(col,ic,t,d){
  return '<div class="alertitem"><div class="aic" style="background:'+col+'26;color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="abody"><div class="at">'+t+'</div><div class="ad">'+d+'</div></div></div>';
}
function tl(dt,title,cls,body){
  return '<div class="tev '+cls+'"><div class="tdot"></div>'+
    '<div class="thd"><span>'+title+'</span><span class="tdt">'+dt+'</span></div>'+
    '<div class="tbody">'+body+'</div></div>';
}
function slog(tm,title,body){
  return '<div class="sev"><div class="sdot"></div>'+
    '<div class="sh"><span>'+title+'</span><span class="stm">'+tm+'</span></div>'+
    '<div class="sb">'+body+'</div></div>';
}
function mcell(l,v){return '<div class="mcell"><b>'+l+'</b><div class="v">'+v+'</div></div>';}

/* ============ SCREEN 0 : 實驗計畫設計 (split) ============ */
var PLANS=[
  {id:"EXP-2601",sel:true,name:"高鎳正極材料 NCM811 摻雜實驗",owner:"林郁婷",prj:"次世代電池",st:"設計中",bc:"b-warn",
   goal:"評估 Al/Mg 共摻雜對 NCM811 循環壽命與熱穩定性之影響",hyp:"共摻雜 1.5mol% 可提升 500 圈容量保持率 ≥ 4pp",
   vars:[["自變因","摻雜比例 0.5–2.0 mol%"],["應變因","容量保持率 / DSC 放熱峰"],["控制變因","燒結溫度 850°C / 12h"]],
   steps:6,dur:"14 天"},

function buildNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="nlab">'+MODS[i].name+'</span><span class="nix">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  destroyCharts();
  var sc=SCREENS[i];if(!sc)return;
  var view=document.getElementById("view");
  view.innerHTML=sc.r();
  document.getElementById("ptitle").textContent=MODS[i].name;
  document.getElementById("psub").textContent=MODS[i].sub;
  document.getElementById("ptag").textContent="MODULE 0"+(i+1)+" / 06";
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    if(+btns[k].getAttribute("data-i")===i)btns[k].classList.add("active");
    else btns[k].classList.remove("active");
  }
  void view.offsetHeight;
  if(sc.c)sc.c();
  try{window.scrollTo(0,0);}catch(e){}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
