<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子實驗記錄本 ELN｜實驗數據管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#86D9A4;
  --shadow:7px 7px 0 #14532D;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  color:var(--ink);
  background:
    linear-gradient(rgba(21,128,61,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.075) 1px,transparent 1px),
    var(--color-background);
  background-size:24px 24px;
  font-family:"Exo",sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden
}
button,input{font:inherit}
button,[role=button],.litem,.bcard,.signrow{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,.litem:focus-visible,.bcard:focus-visible,.signrow:focus-visible{
  outline:4px solid var(--color-accent);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.mono,.id,td:nth-child(1),td:nth-child(2),.nix,.stm,.tdt{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums
}
.topnav{
  position:sticky;
  top:0;
  z-index:30;
  background:#fff;
  border-bottom:4px solid var(--ink)
}
.bar{
  display:flex;
  align-items:center;
  gap:18px;
  padding:13px 22px;
  border-bottom:2px solid var(--ink)
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mk{
  width:46px;height:46px;
  display:grid;place-items:center;
  color:#fff;background:var(--color-primary);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent)
}
.tt{font-size:18px;font-weight:800;line-height:1.1;text-transform:uppercase}
.st{margin-top:4px;color:var(--muted);font:500 10px/1.2 "Roboto Mono",monospace;letter-spacing:.08em}
.spacer{flex:1}
.livechips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{
  display:inline-flex;align-items:center;gap:6px;
  min-height:34px;padding:6px 10px;
  color:var(--ink);background:var(--color-muted);
  border:2px solid var(--ink);
  font:700 11px "Roboto Mono",monospace
}
.live{
  width:9px;height:9px;
  display:inline-block;
  background:var(--color-secondary);
  border:2px solid var(--ink)
}
.navrow{
  display:grid;
  grid-template-columns:repeat(6,minmax(120px,1fr));
  border-left:2px solid var(--ink)
}
.navbtn{
  min-height:52px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 8px;
  color:var(--muted);background:#fff;
  border:0;border-right:2px solid var(--ink);
  font-size:12px;font-weight:800
}
.navbtn:hover{background:var(--color-border);color:var(--ink)}
.navbtn.active{color:#fff;background:var(--color-primary)}
.navbtn.active .nix{color:#fff}
.nix{color:var(--color-primary);font-size:9px}
.pagehead{
  display:flex;align-items:flex-end;gap:16px;
  max-width:1600px;margin:auto;
  padding:28px 26px 12px
}
.ph-t{
  font-size:clamp(25px,3vw,46px);
  line-height:.95;font-weight:800;letter-spacing:-.04em
}
.ph-s{margin-top:9px;color:var(--muted);font-size:13px}
.ph-tag{
  padding:7px 10px;
  color:#fff;background:var(--ink);
  border:2px solid var(--ink);
  font:700 11px "Roboto Mono",monospace
}
.content{max-width:1600px;margin:auto;padding:12px 26px 56px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.mt{margin-top:18px}
.card,.pane{
  min-width:0;
  background:var(--color-card);
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.card{padding:17px}
.card h3{
  display:flex;align-items:center;gap:8px;
  margin:0 0 5px;
  font-size:15px;font-weight:800;text-transform:uppercase
}
.card h3 .material-symbols-outlined,.pt .material-symbols-outlined{color:var(--color-primary)}
.csub{margin:0 0 14px;color:var(--muted);font-size:11.5px}
.split{
  display:grid;grid-template-columns:330px 1fr;
  gap:18px;align-items:start;min-width:0
}
.split.wide{grid-template-columns:380px 1fr}
.pane{overflow:hidden}
.pane-h{
  min-height:50px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 13px;
  background:var(--color-muted);
  border-bottom:3px solid var(--ink)
}
.pt{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;font-weight:800}
.cnt{
  padding:3px 7px;
  color:#fff;background:var(--ink);
  font:700 10px "Roboto Mono",monospace;
  white-space:nowrap
}
.pane-b{padding:11px;max-height:590px;overflow:auto}
.pane-b.pad{padding:16px;max-height:none}
.searchbar{
  min-height:42px;
  display:flex;align-items:center;gap:8px;
  margin:11px;
  padding:8px 10px;
  color:var(--muted);background:#fff;
  border:2px solid var(--ink);
  font-size:12px
}
.litem{
  margin-bottom:9px;padding:11px;
  color:var(--ink);background:#fff;
  border:2px solid var(--line)
}
.litem:hover{border-color:var(--ink);background:var(--color-background)}
.litem.sel{
  background:#DCFCE7;
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent)
}
.lt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.id{color:var(--color-primary);font-size:10px;white-space:nowrap}
.lm{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px;color:var(--muted);font-size:10.5px}
.mono{font-weight:700}
.metagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mcell,.pi{
  min-width:0;
  padding:10px;
  background:var(--color-background);
  border:2px solid var(--ink)
}
.mcell b,.pi b,.label{
  display:block;margin-bottom:4px;
  color:var(--muted);
  font:700 9.5px "Roboto Mono",monospace;
  letter-spacing:.06em;text-transform:uppercase
}
.mcell .v{font-size:12.5px;font-weight:700}
.kpi{position:relative;padding:17px 15px 15px 21px;overflow:hidden}
.kpi .bar{
  position:absolute;left:0;top:0;bottom:0;width:9px;
  background:var(--color-primary);border-right:3px solid var(--ink)
}
.klab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:800}
.klab .material-symbols-outlined{color:var(--color-primary)}
.kval{
  margin-top:9px;
  font:800 28px/1 "Roboto Mono",monospace;
  letter-spacing:-.05em
}
.kval small{margin-left:4px;color:var(--muted);font:700 11px "Exo",sans-serif}
.kfoot{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:10.5px;font-weight:700}
.kfoot .material-symbols-outlined{font-size:15px}
.up{color:#166534}.down{color:#B91C1C}.flat{color:var(--muted)}
.tw{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th{
  padding:9px 11px;
  text-align:left;white-space:nowrap;
  color:#fff;background:var(--ink);
  border-right:1px solid #fff;
  font:700 10px "Roboto Mono",monospace;
  letter-spacing:.04em
}
td{
  padding:10px 11px;
  color:var(--ink);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line)
}
tbody tr:nth-child(even){background:var(--color-background)}
tbody tr:hover{background:#DCFCE7}
td:nth-child(3),td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 7px;
  color:var(--ink);background:#fff;
  border:2px solid currentColor;
  font-size:10px;font-weight:800;white-space:nowrap
}
.badge:before{content:"";width:7px;height:7px;background:currentColor}
.b-ok{color:#166534;background:#DCFCE7}
.b-warn{color:#92400E;background:#FEF3C7}
.b-bad{color:#991B1B;background:#FEE2E2}
.b-info{color:#14532D;background:#BBF7D0}
.b-grey{color:#475569;background:#E8F0F1}
.chartbox{min-width:0;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bcol{
  min-width:0;padding:10px;
  background:var(--color-background);
  border:2px solid var(--ink)
}
.bh{display:flex;justify-content:space-between;gap:7px;margin-bottom:10px;font-size:12px;font-weight:800}
.bcard{
  margin-bottom:9px;padding:10px;
  background:#fff;border:2px solid var(--ink)
}
.bcard:hover{box-shadow:4px 4px 0 var(--color-accent)}
.bt{font-size:12px;font-weight:800}
.bm{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px;color:var(--muted);font-size:10px}
.bamt{color:#92400E;font-weight:800}
.ltop{border-top:9px solid var(--color-accent)}
.slog,.timeline{position:relative;padding-left:23px}
.slog:before,.timeline:before{
  content:"";position:absolute;left:7px;top:2px;bottom:2px;
  width:3px;background:var(--ink)
}
.sev,.tev{position:relative;padding-bottom:15px}
.sdot,.tdot{
  position:absolute;
  left:-21px;top:2px;
  width:15px;height:15px;
  background:#fff;border:3px solid var(--color-primary)
}
.tev.done .tdot{background:var(--color-primary)}
.sh,.thd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800}
.stm,.tdt{color:var(--muted);font-size:9.5px}
.sb,.tbody{margin-top:3px;color:var(--muted);font-size:11px}
.alertitem{
  display:flex;gap:10px;align-items:flex-start;
  margin-bottom:9px;padding:10px;
  background:#fff;border:2px solid var(--ink)
}
.aic{width:34px;height:34px;display:grid;place-items:center;flex:none;border:2px solid currentColor}
.at{font-size:12px;font-weight:800}
.ad{margin-top:3px;color:var(--muted);font-size:10.5px}
.diffrow{display:flex;gap:9px;margin-bottom:7px;padding:9px;border:2px solid var(--ink);font-size:11px}
.dt{flex:none;padding:2px 6px;color:#fff;background:var(--ink);font-weight:800}
.d-add{background:#DCFCE7}.d-mod{background:#FEF3C7}.d-del{background:#FEE2E2}
.legendrow{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;color:var(--muted);font-size:10.5px}
.legendrow span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;display:inline-block;border:2px solid var(--ink)}
.miniStat{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px}
.ms .v{font:800 20px "Roboto Mono",monospace}
.ms .l{color:var(--muted);font-size:10px}
.pill-input{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pi{font-size:11px}
.signrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding:10px;background:#fff;border:2px solid var(--ink)}
.signrow:hover{background:#DCFCE7}
.av{
  width:36px;height:36px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--color-primary);
  border:2px solid var(--ink);font-weight:800
}
.si{flex:1;min-width:0}
.sn{font-size:12px;font-weight:800}
.sr{margin-top:2px;color:var(--muted);font-size:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{
  padding:3px 7px;
  color:var(--ink);background:#DCFCE7;
  border:1px solid var(--ink);
  font:700 9px "Roboto Mono",monospace
}
.chapter{scroll-margin-top:150px}
@keyframes enter{
  from{opacity:0;transform:translateY(15px) scale(.98)}
  to{opacity:1;transform:none}
}
.content>.grid,.content>.split,.content>.card{
  animation:enter .4s cubic-bezier(.2,.85,.3,1.25) both
}
.content>*:nth-child(2){animation-delay:.06s}
.content>*:nth-child(3){animation-delay:.12s}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media(max-width:1100px){
  .navrow{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .split,.split.wide{grid-template-columns:1fr}
  .pane-b{max-height:none}
  .g3,.g2{grid-template-columns:1fr}
}
@media(max-width:600px){
  .bar{padding:10px 13px;align-items:flex-start}
  .livechips{display:none}
  .navrow{grid-template-columns:repeat(6,1fr)}
  .navbtn{min-width:0;min-height:48px;padding:8px 4px}
  .navbtn .nlab,.navbtn .nix{display:none}
  .pagehead{padding:20px 14px 9px}
  .content{padding:10px 14px 38px}
  .g4,.board,.metagrid{grid-template-columns:1fr}
  .card,.pane{box-shadow:5px 5px 0 var(--ink)}
  .ph-t{font-size:28px}
  .ph-tag{display:none}
}
</style>
</head>
<body>
<header class="topnav">
  <div class="bar">
    <div class="brand">
      <div class="mk"><span class="material-symbols-outlined">biotech</span></div>
      <div>
        <div class="tt">電子實驗記錄本 ELN</div>
        <div class="st">Electronic Lab Notebook · R&amp;D Data</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="livechips">
      <span class="lchip"><span class="live"></span>研發現場連線</span>
      <span class="lchip"><span class="material-symbols-outlined">calendar_month</span>2026-08-14</span>
      <span class="lchip"><span class="material-symbols-outlined">verified_user</span>GLP · 21 CFR Part 11</span>

  </div>
  <nav class="navrow" id="nav" aria-label="系統模組"></nav>
</header>

<div class="pagehead">
  <div>
    <div class="ph-t" id="ptitle">實驗計畫設計</div>

  </div>
  <div class="spacer"></div>
  <div class="ph-tag" id="ptag">MODULE 01 / 06</div>
</div>
<main class="content" id="view"></main>

<script>
"use strict";
const M=[
["science","實驗計畫設計","實驗目的、假設、變因與步驟結構化建立"],
["description","電子記錄本","實驗記錄逐步輸入、試劑批號與觀察附圖"],
["biotech","設備數據匯入","儀器介接自動擷取量測數據與圖譜"],
["history","版本追溯","記錄修改軌跡、版本比對與稽核軌跡"],
["verified","審閱簽署","覆核、電子簽章與 GLP 合規鎖定"],
["insights","數據檢索分析","全文檢索、實驗成果彙整與知識重用"]
];
let charts=[];
const AX="#475569",GRID="#BBF7D0",INK="#14532D";
const icon=n=>`<span class="material-symbols-outlined">${n}</span>`;
const badge=(s,c)=>`<span class="badge ${c}">${s}</span>`;
const cell=(l,v)=>`<div class="mcell"><b>${l}</b><div class="v">${v}</div></div>`;
const kpi=(l,v,u,i,f,c,fi)=>`<div class="card kpi"><span class="bar"></span><div class="klab">${icon(i)}${l}</div><div class="kval">${v}<small>${u}</small></div><div class="kfoot ${c}">${icon(fi)}${f}</div></div>`;
const alert=(c,i,t,d)=>`<div class="alertitem"><div class="aic" style="color:${c};background:${c}18">${icon(i)}</div><div><div class="at">${t}</div><div class="ad">${d}</div></div></div>`;
const step=(t,h,b)=>`<div class="sev"><div class="sdot"></div><div class="sh"><span>${h}</span><span class="stm">${t}</span></div><div class="sb">${b}</div></div>`;
const timeline=(t,h,b)=>`<div class="tev done"><div class="tdot"></div><div class="thd"><span>${h}</span><span class="tdt">${t}</span></div><div class="tbody">${b}</div></div>`;
const list=(id,name,meta,sel="")=>`<div class="litem ${sel}" tabindex="0"><div class="lt"><span class="id">${id}</span>${name}</div><div class="lm">${meta}</div></div>`;
const head=(i,t,c="")=>`<div class="pane-h"><div class="pt">${icon(i)}${t}</div>${c}</div>`;
const chartCard=(i,t,s,id,h=280)=>`<div class="card"><h3>${icon(i)}${t}</h3><p class="csub">${s}</p><div class="chartbox" id="${id}" style="height:${h}px"></div></div>`;
function initChart(id,opt){
  const el=document.getElementById(id);if(!el)return;
  const c=echarts.init(el,null,{renderer:"canvas"});
  opt.animation=!matchMedia("(prefers-reduced-motion: reduce)").matches;
  opt.textStyle={fontFamily:"Exo, sans-serif",color:AX};
  c.setOption(opt);charts.push(c)
}
function dispose(){charts.forEach(c=>c.dispose());charts=[]}

function screen0(){
 const plans=[
 ["EXP-2601","高鎳正極材料 NCM811 摻雜實驗","林郁婷 · 次世代電池",badge("設計中","b-warn"),"sel"],
 ["EXP-2600","水系黏著劑配方最佳化","陳彥廷 · 綠色製程",badge("已核准","b-ok")],
 ["EXP-2599","固態電解質離子導電率量測","黃思庭 · 固態電池",badge("設計中","b-warn")],
 ["EXP-2598","負極矽碳複合材料膨脹測試","吳孟儒 · 高能量密度",badge("執行中","b-info")],
 ["EXP-2597","電解液添加劑成膜特性","張書涵 · 循環壽命",badge("已核准","b-ok")]
 ].map(x=>list(x[0],x[1],`${x[2]} ${x[3]}`,x[4])).join("");
 return `<section class="grid g4 chapter">
 ${kpi("進行中計畫","23","項","science","涵蓋 6 個研發專案","flat","folder_open")}
 ${kpi("待核准計畫","7","項","fact_check","平均審核 1.4 天","up","trending_down")}
 ${kpi("本月新建","31","項","description","範本套用率 82%","up","trending_up")}
 ${kpi("計畫延遲","3","項","warning","資源衝突 2 · 待料 1","down","priority_high")}
 </section>
 <section class="split mt chapter">
  <div class="pane">${head("science","實驗計畫清單",'<span class="cnt">23 項</span>')}<div class="searchbar">${icon("search")}依專案 / 材料 / 負責人搜尋…</div><div class="pane-b">${plans}</div></div>
  <div class="pane">${head("draft","EXP-2601 · 高鎳正極材料 NCM811 摻雜實驗",badge("設計中","b-warn"))}
   <div class="pane-b pad">
    <div class="metagrid">${cell("負責人","林郁婷")}${cell("所屬專案","次世代電池")}${cell("預估工期","14 天")}</div>
    <div class="mcell mt"><b>實驗目的</b><div class="v">評估 Al/Mg 共摻雜對 NCM811 循環壽命與熱穩定性之影響</div></div>

}
const screens=[screen0,screen1,screen2,screen3,screen4,screen5];
function buildNav(){
 document.getElementById("nav").innerHTML=M.map((m,i)=>`<button class="navbtn" data-i="${i}" aria-label="${m[1]}">${icon(m[0])}<span class="nlab">${m[1]}</span><span class="nix">0${i+1}</span></button>`).join("");
 document.querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>{location.hash="v"+b.dataset.i}))
}
function show(i){
 if(!screens[i])i=0;
 dispose();
 document.getElementById("view").innerHTML=screens[i]();
 document.getElementById("ptitle").textContent=M[i][1];
 document.getElementById("psub").textContent=M[i][2];
 document.getElementById("ptag").textContent=`MODULE 0${i+1} / 06`;
 document.querySelectorAll("[data-i]").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("active",on);b.setAttribute("aria-current",on?"page":"false")});
 requestAnimationFrame(()=>chartsFor(i));
 scrollTo(0,0)
}
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],5):0)
}
buildNav();
addEventListener("hashchange",fromHash);
addEventListener("resize",()=>charts.forEach(c=>c.resize()));
fromHash();
</script>
