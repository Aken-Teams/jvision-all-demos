views.innerHTML=NAV.map(function(m,i){return '<section class="view'+(i===0?" on":"")+'" data-view="'+i+'"><div class="ph"><div><h1><span class="bar" aria-hidden="true"></span>'+m[1]+'</h1><p>'+DESC[i]+'</p></div><div class="pills"><span class="pill live"><span class="live-dot" aria-hidden="true"></span>LPR 即時辨識 · 14:32 更新</span><span class="pill">'+icon("calendar_month")+'2026/08/13</span></div></div><div class="vbody"></div></section>'}).join("");
var bodies=views.querySelectorAll(".vbody");
function show(i){
i=Math.max(0,Math.min(i,NAV.length-1));
nav.querySelectorAll("button").forEach(function(b){var on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
views.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",+v.dataset.view===i)});
if(!built[i]){bodies[i].innerHTML=SCREENS[i]();built[i]=true}
draw(i)
}
nav.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b){location.hash="v"+b.dataset.i}});
nav.addEventListener("keydown",function(e){var b=e.target.closest("button[data-i]");if(!b)return;var i=+b.dataset.i;if(e.key==="ArrowRight")i=(i+1)%NAV.length;else if(e.key==="ArrowLeft")i=(i+NAV.length-1)%NAV.length;else return;e.preventDefault();location.hash="v"+i;nav.querySelector('[data-i="'+i+'"]').focus()});
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize()}catch(e){}})});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
