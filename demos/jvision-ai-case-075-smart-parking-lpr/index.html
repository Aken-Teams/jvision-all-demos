<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>智慧停車辨識台 · Smart Parking LPR</title>
<meta name="description" content="從車位即時地圖、車牌辨識進出場、計費繳費到月租管理與場區佔用分析的智慧停車營運台（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --acc:#7c3aed; --acc2:#a78bfa; --acc-d:#5b21b6; --acc-l:#f3edff;
  --ink:#1e1b29; --body:#3b3550; --mut:#6b6580; --line:#e7e2f0; --bg:#f6f4fb; --card:#fff;
  --free:#16a34a; --occ:#7c3aed; --rent:#2563eb; --resv:#d97706; --dis:#0891b2; --off:#94a3b8;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}

/* top nav */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--acc),var(--acc-d));box-shadow:0 4px 18px rgba(124,58,237,.3)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:11px 24px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.24)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 55%,rgba(255,255,255,.28) 100%)}
.logo .material-symbols-outlined{font-size:24px;position:relative;z-index:1}
.brand b{font-size:16px;font-weight:900;color:#fff;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10.5px;color:#ddd0fb;letter-spacing:2.5px;font-weight:700}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:#ddd0fb;font:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button.on{background:#fff;color:var(--acc);box-shadow:0 5px 14px rgba(0,0,0,.16)}
.nav button.on .material-symbols-outlined{color:var(--acc2)}
.who{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid rgba(255,255,255,.2);flex:none}
.ava{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--acc);font-weight:900;display:grid;place-items:center;font-size:14px}
.who small{font-size:11px;color:#ddd0fb;display:block}
.who b{font-size:12.5px;color:#fff}

.wrap{max-width:1360px;margin:0 auto;padding:22px 24px 48px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px}
.ph h1 .bar{width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.ph p{margin:5px 0 0 15px;color:var(--mut);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--acc-l);color:var(--acc);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px}
.pill.live{background:#dcfce7;color:#166534}
.pill .material-symbols-outlined{font-size:16px}
.pill .live-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

.view{display:none}
.view.on{display:block;animation:f .28s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.10),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--acc)}
.kpi .v{font-size:27px;font-weight:900;margin-top:6px;color:var(--ink);font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}

.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.35fr 1fr}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px;min-width:0}
.card h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:800;color:var(--acc2);cursor:pointer}
.muted{font-weight:600;color:var(--mut);font-size:12px}

.chart{width:100%;height:270px}

/* legend */
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--body)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.d-free{background:var(--free)}.d-occ{background:var(--occ)}.d-rent{background:var(--rent)}.d-resv{background:var(--resv)}.d-dis{background:var(--dis)}.d-off{background:var(--off)}

/* ===== signature 1: 車位地圖 ===== */
.lotwrap{overflow-x:auto;padding-bottom:4px}
.zone{margin-bottom:14px;min-width:0}
.zone:last-child{margin-bottom:0}
.zlab{font-size:12.5px;font-weight:900;color:var(--acc);margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.zlab .zn{background:var(--acc-l);border-radius:7px;padding:2px 9px}
.zlab small{font-weight:600;color:var(--mut);font-size:11px}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px}
.spot{border-radius:10px;padding:7px 6px 6px;color:#fff;min-height:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.06);min-width:0}
.spot .sn{font-size:11.5px;font-weight:900;font-family:Inter}
.spot .plate{font-size:9.5px;font-weight:800;font-family:Inter;letter-spacing:.4px;background:rgba(0,0,0,.22);border-radius:5px;padding:1px 4px;align-self:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.spot .st{font-size:9px;opacity:.95;font-weight:700}
.s-free{background:linear-gradient(135deg,#22c55e,#15803d)}
.s-occ{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.s-rent{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.s-resv{background:linear-gradient(135deg,#f59e0b,#d97706)}
.s-dis{background:linear-gradient(135deg,#22d3ee,#0891b2)}
.s-off{background:linear-gradient(135deg,#94a3b8,#64748b)}

/* ===== signature 2: 進出場 LPR log ===== */
.lpr{display:flex;flex-direction:column;gap:9px}
.lprow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);flex-wrap:wrap}
.lprow.in{border-left:4px solid var(--free)}
.lprow.out{border-left:4px solid var(--acc)}
.lpcam{width:40px;height:40px;border-radius:9px;background:#1e1b29;color:#a78bfa;display:grid;place-items:center;flex:none}
.lpcam .material-symbols-outlined{font-size:22px}
.lpplate{font-family:Inter;font-weight:900;font-size:15px;letter-spacing:1px;color:#111;background:linear-gradient(180deg,#fff,#eef2f7);border:2px solid #1e293b;border-radius:7px;padding:3px 9px;flex:none;min-width:96px;text-align:center}
.lpmid{flex:1;min-width:120px}
.lpmid b{font-size:13px;color:var(--ink);font-family:"Noto Sans TC"}
.lpmid small{display:block;color:var(--mut);font-size:11.5px}
.lpdir{font-size:11px;font-weight:900;border-radius:999px;padding:3px 10px;white-space:nowrap;flex:none}
.dir-in{background:#dcfce7;color:#166534}
.dir-out{background:var(--acc-l);color:var(--acc)}
.lpconf{font-size:11px;color:var(--mut);flex:none;text-align:right;min-width:64px}
.lpconf b{display:block;font-size:13px;color:var(--ink);font-family:Inter;font-weight:900}
.lprow.warn{border-left-color:var(--warn)}
.lprow.warn .lpplate{border-color:#d97706;color:#b45309}

/* status cards */
.stat5{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.stat5>*{min-width:0}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--acc)}
.sc .n{font-size:12px;color:var(--mut);font-weight:700}
.sc .b{font-size:23px;font-weight:900;font-family:Inter}
.sc .b small{font-size:11px;color:var(--mut);font-weight:700}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:#faf8ff}
.tblwrap{overflow-x:auto}
.plateT{font-family:Inter;font-weight:900;letter-spacing:.5px;color:var(--ink)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-wait{background:#fef3c7;color:#92400e}.t-rej{background:#fee2e2;color:#991b1b}.t-info{background:#ede9ff;color:#5b21b6}.t-blue{background:#dbeafe;color:#1e40af}

.trow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .nm{font-size:13px;font-weight:800;color:var(--ink);font-family:"Noto Sans TC"}
.trow .nm small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.tbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.trow .pct{text-align:right;font-size:14px;font-weight:900;color:var(--acc);font-family:Inter}
.trow .pct small{display:block;font-size:11px;color:var(--mut);font-weight:600}

.tl-i{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tl-i:first-of-type{border-top:0}
.tl-ic{width:32px;height:32px;border-radius:9px;background:var(--acc-l);color:var(--acc);display:grid;place-items:center;flex:none}
.tl-ic.r{background:#fee2e2;color:#b91c1c}.tl-ic.a{background:#fef3c7;color:#b45309}
.tl-ic .material-symbols-outlined{font-size:18px}
.tl-i b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.tl-i small{display:block;color:var(--mut);font-size:12px}
.tl-i .when{margin-left:auto;font-size:11px;color:#9aa1ad;white-space:nowrap;flex:none}

.alert{border-radius:14px;padding:14px 15px;border:1px solid}
.alert h4{margin:0 0 6px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px}
.alert p{margin:0;font-size:12.5px;line-height:1.6}
.a-red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.a-amber{background:#fffbeb;border-color:#fde68a;color:#b45309}
.a-violet{background:var(--acc-l);border-color:#ddd0fb;color:var(--acc-d)}

.ai-row{display:flex;gap:11px;background:linear-gradient(135deg,#f3edff,#faf5ff);border:1px solid #e6dcfb;border-radius:13px;padding:12px 13px;margin-bottom:10px}
.ai-ic{width:32px;height:32px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.ai-ic.g{background:var(--acc2)}
.ai-row p{margin:0;font-size:13px;color:var(--body);line-height:1.55}
.ai-row b{color:var(--ink)}

.cstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.cs2{background:var(--bg);border-radius:12px;padding:13px;text-align:center;border:1px solid var(--line)}
.cs2 b{display:block;font-size:20px;color:var(--ink);font-weight:900;font-family:Inter}
.cs2 span{font-size:11px;color:var(--mut)}
.cs2.acc b{color:var(--acc)}

/* pay ticket */
.ticket{border:1px dashed var(--acc2);border-radius:14px;padding:15px 16px;background:linear-gradient(135deg,#faf7ff,#fff)}
.tkrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tkrow:last-child{border-bottom:0}
.tkrow b{color:var(--ink)}
.tktotal{font-size:22px;font-weight:900;color:var(--acc);font-family:Inter}

@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g11,.g21{grid-template-columns:1fr}
  .stat5{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
  .topin{padding:10px 14px}
  .wrap{padding:16px 14px 34px}
  .kpis{grid-template-columns:1fr 1fr}
  .stat5{grid-template-columns:repeat(2,1fr)}
  .who small{display:none}
  .nav button span:last-child{display:none}
  .nav button{padding:9px}
  .trow{grid-template-columns:104px 1fr 76px}
  .lpplate{min-width:80px;font-size:13px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">local_parking</span></span>
      <div><b>智慧停車辨識台</b><span>SMART PARKING LPR</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="ava">庭</span><div><b>沈品庭</b><small>值班主管 · 光復立體停車場</small></div></div>
  </div>
</header>

<main class="wrap" id="views"></main>

<script>
/* ===================== DATA ===================== */
var NAV=[
  ["dashboard","停車總覽"],

  ["receipt_long","計費繳費"],

var SST={f:["s-free","空位"],o:["s-occ","佔用"],r:["s-rent","月租"],v:["s-resv","預約"],d:["s-dis","無障礙"],x:["s-off","停用"]};

  ["out","3390-VT","出場","B1 · 出口 1 號車道 · 已繳費 NT$40","97.9","14:22:18",false]
];

/* 計費繳費 在場車輛 */
var PARKED=[
  ["BGH-2751","B1 · A02","一般計時","14:32","0 時 12 分","計時中","30"],
  ["7823-KP","B1 · A03","一般計時","14:30","0 時 14 分","計時中","30"],
  ["8801-RF","B2 · C01","一般計時","13:05","1 時 39 分","計時中","90"],

];
var FEERATE=[

  ["平日 19:00–07:00","夜間優惠","每小時 NT$20","上限 NT$100/夜"],
  ["假日全日","假日費率","每 30 分 NT$25","上限 NT$350/日"],
  ["月租車","月租戶","固定 NT$3,200/月","不限次數進出"]
];

/* 月租管理 */

/* ===================== HELPERS ===================== */
function kpiRow(list){
  return '<div class="kpis">'+list.map(function(k){
    var dn=k[3].charAt(0)==='-'||k[3].indexOf('▼')>-1;
    return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[4]+'</span>'+k[0]+'</div>'
      +'<div class="v">'+k[1]+'<small> '+k[2]+'</small></div>'
      +'<div class="d '+(dn?'dn':'up')+'">'+k[3]+'</div></div>';
  }).join('')+'</div>';
}

function spotHtml(){
  return '<div class="lotwrap">'+ZONES.map(function(z){
    return '<div class="zone"><div class="zlab"><span class="zn">'+z.name+'</span><small>'+z.note+'</small></div>'
      +'<div class="spots">'+z.spots.map(function(s){
        var st=SST[s[1]];
        var plate=s[2]&&s[2]!=='—'?'<span class="plate">'+s[2]+'</span>':(s[1]==='f'?'<span class="st">可停</span>':'<span class="st">'+st[1]+'</span>');
        return '<div class="spot '+st[0]+'" title="'+s[0]+' · '+st[1]+(s[2]&&s[2]!=='—'?' · '+s[2]:'')+'"><div class="sn">'+s[0]+'</div>'+plate+'</div>';
      }).join('')+'</div></div>';
  }).join('')+'</div>';
}

function lotLegend(){
  return '<div class="leg">'
    +'<span><i class="dot d-free"></i>空位</span>'
    +'<span><i class="dot d-occ"></i>佔用</span>'
    +'<span><i class="dot d-rent"></i>月租</span>'
    +'<span><i class="dot d-resv"></i>預約</span>'
    +'<span><i class="dot d-dis"></i>無障礙</span>'
    +'<span><i class="dot d-off"></i>停用</span></div>';
}

function lprLog(list){
  return '<div class="lpr">'+list.map(function(r){
    var cls=r[0]+(r[6]?' warn':'');
    var dir=r[0]==='in'?'<span class="lpdir dir-in">進場</span>':'<span class="lpdir dir-out">出場</span>';
    return '<div class="lprow '+cls+'"><div class="lpcam"><span class="material-symbols-outlined">photo_camera</span></div>'
      +'<div class="lpplate">'+r[1]+'</div>'
      +'<div class="lpmid"><b>'+r[2]+(r[6]?' · 需人工複核':'')+'</b><small>'+r[3]+'</small></div>'
      +dir
      +'<div class="lpconf"><b>'+r[4]+'%</b>辨識信心<br>'+r[5]+'</div></div>';
  }).join('')+'</div>';
}

function initChart(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}

function draw(i){
  charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];
  if(!window.echarts)return;

var nav=document.getElementById('nav'), views=document.getElementById('views');
nav.innerHTML=NAV.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+m[0]+'</span><span>'+m[1]+'</span></button>';}).join('');

views.innerHTML=NAV.map(function(m,i){
  return '<section class="view'+(i===0?' on':'')+'" data-view="'+i+'">'
    +'<div class="ph"><div><h1><span class="bar"></span>'+NAMES[i]+'</h1><p>'+DESC[i]+'</p></div>'
    +'<div class="pills"><span class="pill live"><span class="live-dot"></span>LPR 即時辨識</span><span class="pill"><span class="material-symbols-outlined">calendar_month</span>2026/08/13</span></div></div>'
    +'<div class="vbody"></div></section>';
}).join('');
var vbodies=views.querySelectorAll('.vbody');
var built=[];

function show(i){
  nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
  views.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',+v.dataset.view===i);});
  if(!built[i]){ vbodies[i].innerHTML=SCREENS[i](); built[i]=true; }
  void views.offsetHeight;
  draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
window.addEventListener('resize',function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
