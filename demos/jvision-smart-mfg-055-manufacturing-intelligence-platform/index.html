<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>製造大數據分析平台 · Manufacturing Intelligence Platform</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#fb923c;--ink:#1c1917;--bg:#f6f5f3;--card:#fff;--line:#e7e2dc;--mut:#78716c;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--dark:#211b16;--dark2:#2c241d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:linear-gradient(180deg,var(--dark),var(--dark2));color:#e9e3dc;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(234,88,12,.4)}
.brand b{font-size:14px;font-weight:800;display:block;font-family:"Noto Sans TC";line-height:1.3}
.brand span{font-size:9.5px;color:var(--accent2);letter-spacing:1.5px}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 12px;min-width:0}
.nav button{border:0;background:transparent;color:#cbc2b8;font:inherit;font-weight:600;font-size:13px;padding:11px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:11px;flex:none;white-space:nowrap;text-align:left;font-family:"Noto Sans TC";min-width:0}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(234,88,12,.35)}
.sfoot{margin-top:auto;padding:14px 18px;font-size:10.5px;color:#8a8078;border-top:1px solid rgba(255,255,255,.07);line-height:1.6}
.sfoot b{color:#d8cfc5;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{background:var(--card);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.hd .mn{font-family:"Noto Sans TC";font-weight:900;font-size:16px}
.hd .pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:#fff1e7;color:var(--accent);white-space:nowrap}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.hd .who{font-size:11.5px;color:var(--mut);white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#57534e,#292524);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.wrap{padding:22px 26px;max-width:1320px;width:100%;margin:0 auto}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:12.5px}
.live{background:#fff1e7;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(234,88,12,.12),transparent 70%)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .9fr}
.g21{grid-template-columns:.9fr 1.3fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card h3 .r{margin-left:auto;font-weight:400}
.mut{color:var(--mut)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-run{background:#fff1e7;color:var(--accent)}.t-mut{background:#f0ede9;color:#78716c}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11px;background:#faf8f5}
table.data td b{font-family:Inter}
table.data tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.bar{height:7px;border-radius:5px;background:#efeae4;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.src{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.src>*{min-width:0}
.scard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfaf8;position:relative}
.scard .sh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.scard b{font-size:13px;font-family:"Noto Sans TC"}
.scard .sd{font-size:11px;color:var(--mut)}
.scard .srow{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.pipe{display:flex;gap:0;align-items:stretch;flex-wrap:nowrap;min-width:640px}
.pstep{flex:1;min-width:110px;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fbfaf8;position:relative;text-align:center}
.pstep .pn{width:30px;height:30px;border-radius:9px;margin:0 auto 7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:13px}
.pstep b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.pstep .ps{font-size:10.5px;color:var(--mut);margin-top:3px}
.parr{align-self:center;color:var(--accent2);font-size:22px;padding:0 3px}
.dq{display:flex;flex-direction:column;gap:9px}
.dqi{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fbfaf8}
.dqi .di{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.dqi b{font-size:12.5px;font-family:"Noto Sans TC"}
.dqi .dd{font-size:11px;color:var(--mut)}
.dqi .dv{margin-left:auto;text-align:right;flex:none}
.dqi .dv b{font-size:15px;font-family:Inter}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fbfaf8;color:var(--mut);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:13px}.stat3>*{min-width:0}
.sbox{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fbfaf8}
.sbox .sl{font-size:10.5px;color:var(--mut);font-weight:600}
.sbox .sv{font-size:19px;font-weight:800;font-family:Inter;margin-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.mgrid>*{min-width:0}
.mcard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfaf8}
.mcard .mt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mcard .mt b{font-size:13px;font-family:"Noto Sans TC"}
.mcard .mrow{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.mcard .mrow:last-child{border-bottom:0}
.ver{font-family:Inter;font-weight:700}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}.board>*{min-width:0}
.w-lg{grid-column:span 4}.w-md{grid-column:span 2}.w-full{grid-column:span 6}
.widget{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card)}
.widget .wt{font-size:12px;font-weight:700;font-family:"Noto Sans TC";margin-bottom:9px;display:flex;align-items:center;gap:6px}
.widget .wt .material-symbols-outlined{font-size:16px;color:var(--accent)}
.big{font-size:30px;font-weight:800;font-family:Inter}
.covgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.covgrid>*{min-width:0}
.covi{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfaf8}
.covi .cl{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between}
.covi .cv{font-size:17px;font-weight:800;font-family:Inter;margin:5px 0 6px}
.audit{display:flex;flex-direction:column;gap:0}
.aud{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.aud:last-child{border-bottom:0}
.aud .at{width:52px;flex:none;font-size:11px;color:var(--mut);font-family:Inter;font-weight:600}
.aud .ab{font-size:12.5px}
.aud .ab .as{font-size:11px;color:var(--mut);margin-top:2px}
.lineg{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.lineg:last-child{border-bottom:0}
.lineg .material-symbols-outlined{font-size:15px;color:var(--accent2);flex:none}
@media(max-width:1080px){.g2,.g21,.g3,.mgrid{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(4,1fr)}.w-lg{grid-column:span 4}.w-md{grid-column:span 2}.w-full{grid-column:span 4}}
@media(max-width:860px){
 .app{flex-direction:column}
 .side{width:100%;height:auto;position:static;flex-direction:column}
 .brand{padding:12px 16px 8px}
 .nav{flex-direction:row;flex-wrap:wrap;padding:0 12px 10px}
 .nav button{padding:9px 12px}
 .sfoot{display:none}
}
@media(max-width:820px){.g2,.g21,.g3,.g11,.mgrid,.src,.covgrid,.stat3,.kpis{grid-template-columns:1fr}.board{grid-template-columns:1fr}.w-lg,.w-md,.w-full{grid-column:span 1}}
@media(max-width:560px){.nav button .lbl{display:none}.nav button{padding:9px 11px}.hd .who{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">MI</div>
      <div><b>製造大數據<br>分析平台</b><span>MFG INTELLIGENCE</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">環境：<b>PROD · 華東一廠</b><br>數據源 <b>18</b> · 覆蓋率 <b>94.6%</b><br>© 2026 JVision MIP</div>
  </aside>
  <div class="main">
    <div class="hd">
      <span class="material-symbols-outlined" style="color:var(--accent)">insights</span>
      <span class="mn" id="hdName">數據源接入</span>
      <span class="pill" id="hdPill">Data Ingestion</span>
      <div class="rt">
        <span class="who">資訊部門 · 王志豪</span>
        <div class="avatar">王</div>
      </div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>
<script>
var MODS=[
 {i:"hub",n:"數據源接入",e:"Data Ingestion"},
 {i:"cleaning_services",n:"資料整合清洗",e:"ETL Pipeline"},
 {i:"timeline",n:"時序數據探索",e:"Time-Series"},
 {i:"dashboard_customize",n:"自助式儀表板",e:"Self-Service BI"},
 {i:"model_training",n:"分析模型庫",e:"Model Library"},
 {i:"policy",n:"數據治理稽核",e:"Governance"}
];
var charts=[];
function killCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

function kpi(l,v,d,cls,ic){return '<div class="kpi"><span class="material-symbols-outlined ic">'+ic+'</span><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d '+(cls||"")+'">'+d+'</div></div>';}

/* SCREEN 0 : 數據源接入 */
function s0(){
 var srcs=[
  {n:"MES 製造執行",e:"OPC-UA",c:"#ea580c",st:"連線正常",ok:1,rate:"1,240 筆/分",lat:"0.8s",cov:99},
  {n:"SCADA 監控",e:"Modbus/TCP",c:"#0369a1",st:"連線正常",ok:1,rate:"3,860 筆/分",lat:"0.5s",cov:98},
  {n:"OEE 稼動系統",e:"REST API",c:"#7c3aed",st:"連線正常",ok:1,rate:"420 筆/分",lat:"1.2s",cov:96},
  {n:"ERP 訂單主檔",e:"JDBC",c:"#15803d",st:"連線正常",ok:1,rate:"90 筆/分",lat:"2.1s",cov:100},
  {n:"環境感測 IoT",e:"MQTT",c:"#0d9488",st:"延遲偏高",ok:2,rate:"5,120 筆/分",lat:"4.6s",cov:88},
  {n:"品保 LIMS",e:"REST API",c:"#b45309",st:"連線正常",ok:1,rate:"60 筆/分",lat:"1.6s",cov:94},
  {n:"AGV 派車系統",e:"WebSocket",c:"#9333ea",st:"連線正常",ok:1,rate:"310 筆/分",lat:"0.9s",cov:97},
  {n:"能源電表 EMS",e:"Modbus/RTU",c:"#c2410c",st:"重連中",ok:3,rate:"— 筆/分",lat:"—",cov:71}
 ];
 var stMap={1:["t-ok","#15803d"],2:["t-warn","#b45309"],3:["t-bad","#b91c1c"]};
 var cards="";
 for(var i=0;i<srcs.length;i++){var s=srcs[i];var sm=stMap[s.ok];
  cards+='<div class="scard"><div class="sh"><div class="sico" style="background:'+s.c+'"><span class="material-symbols-outlined" style="font-size:19px">lan</span></div><div style="min-width:0"><b>'+s.n+'</b><div class="sd">'+s.e+'</div></div></div>'+
  '<div class="srow"><span class="mut"><span class="dot" style="background:'+sm[1]+'"></span>'+s.st+'</span><span class="tag '+sm[0]+'">'+s.cov+'%</span></div>'+
  '<div class="srow"><span class="mut">吞吐</span><b>'+s.rate+'</b></div>'+
  '<div class="srow"><span class="mut">延遲</span><b>'+s.lat+'</b></div></div>';
 }
 return ''+
 '<div class="vh"><div><h2>數據源接入監控</h2><p>MES／SCADA／OEE／ERP 等多源連接器即時同步狀態一覽</p></div><span class="live">● 即時同步中</span></div>'+
 '<div class="kpis">'+
  kpi("已接入數據源","18","+2 本月","up","hub")+
  kpi("即時吞吐量","11.4K/分","峰值 18.2K/分","","bolt")+
  kpi("同步成功率","99.2%","近 24 小時","up","check_circle")+
  kpi("異常連接器","2","EMS · IoT","dn","error")+
 '</div>'+
 '<div class="grid g2">'+
  '<div class="card"><h3><span class="material-symbols-outlined">device_hub</span>連接器狀態</h3><div class="src">'+cards+'</div></div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 12 小時攝入量趨勢</h3><div id="c0a"></div></div>'+
 '</div>';
}
function d0(){
 var opt={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:340,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},stacked:true},
  colors:["#ea580c","#fb923c","#0369a1"],dataLabels:{enabled:false},stroke:{curve:"smooth",width:2},fill:{type:"gradient",gradient:{opacityFrom:.5,opacityTo:.05}},
  series:[{name:"SCADA",data:[3200,3400,3100,3600,3900,4100,3800,4200,4000,4300,4100,3860]},
   {name:"MES",data:[1100,1180,1050,1200,1240,1300,1220,1280,1240,1320,1260,1240]},
   {name:"IoT/其他",data:[4800,5000,4600,5200,5400,5600,5100,5300,5000,5500,5200,5120]}],
  xaxis:{categories:["8:00","9:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"],labels:{style:{fontSize:"11px"}}},
  yaxis:{labels:{formatter:function(v){return (v/1000).toFixed(0)+"K";},style:{fontSize:"11px"}}},
  legend:{position:"top",fontSize:"12px"},grid:{borderColor:"#eee"},tooltip:{y:{formatter:function(v){return v.toLocaleString()+" 筆/分";}}}};
 var c=new ApexCharts(el("c0a"),opt);c.render();charts.push(c);
}

/* SCREEN 1 : 資料整合清洗 (ETL) */
function s1(){
 var steps=[["1","擷取","Raw 18 源"],["2","標準化","欄位對映"],["3","去重","主鍵校驗"],["4","品質校驗","9 條規則"],["5","入湖","分區寫入"]];
 var pipe="";
 for(var i=0;i<steps.length;i++){var p=steps[i];
  pipe+='<div class="pstep"><div class="pn">'+p[0]+'</div><b>'+p[1]+'</b><div class="ps">'+p[2]+'</div></div>';
  if(i<steps.length-1)pipe+='<div class="parr"><span class="material-symbols-outlined">arrow_forward</span></div>';
 }
 var rules=[
  {i:"tag",t:"缺值率檢查",d:"關鍵欄位空值 ≤ 0.5%",v:"0.31%",cls:"t-ok"},
  {i:"content_copy",t:"重複紀錄",d:"同工單同時間戳去重",v:"2,140 筆",cls:"t-warn"},
  {i:"straighten",t:"單位量綱一致性",d:"溫度／壓力單位統一",v:"通過",cls:"t-ok"},
  {i:"schedule",t:"時間戳單調性",d:"時序不得逆序",v:"41 筆修正",cls:"t-warn"},
  {i:"filter_alt",t:"離群值偵測",d:"±3σ 標記後保留",v:"318 筆",cls:"t-info"},
  {i:"link",t:"外鍵完整性",d:"工單須對應訂單",v:"通過",cls:"t-ok"}
 ];
 var colMap={"t-ok":["#15803d","合格"],"t-warn":["#b45309","已處理"],"t-info":["#0369a1","標記"]};
 var dqhtml="";
 for(var j=0;j<rules.length;j++){var r=rules[j];var cm=colMap[r.cls];
  dqhtml+='<div class="dqi"><div class="di" style="background:'+cm[0]+'"><span class="material-symbols-outlined" style="font-size:17px">'+r.i+'</span></div><div style="min-width:0"><b>'+r.t+'</b><div class="dd">'+r.d+'</div></div><div class="dv"><b>'+r.v+'</b><div class="dd"><span class="tag '+r.cls+'">'+cm[1]+'</span></div></div></div>';
 }
 var jobs=[
  ["JOB-2418","SCADA 溫壓整合","已完成","t-ok","19,840,220","2.1 分"],
  ["JOB-2417","MES 工單彙整","已完成","t-ok","842,110","1.4 分"],
  ["JOB-2416","IoT 環境清洗","執行中","t-run","6,120,000","進度 68%"],
  ["JOB-2415","OEE 稼動對映","已完成","t-ok","318,900","0.9 分"],
  ["JOB-2414","ERP 訂單同步","警告","t-warn","90,410","外鍵 12 筆待補"],
  ["JOB-2413","LIMS 檢測併入","已完成","t-ok","44,300","0.6 分"]
 ];
