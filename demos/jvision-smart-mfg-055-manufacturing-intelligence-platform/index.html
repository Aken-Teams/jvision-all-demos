.audit{display:flex;flex-direction:column}.aud{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}.aud:last-child{border:0}
.at{width:52px;flex:none;color:var(--muted);font-size:10px}.ab{font-size:12px}.as{margin-top:4px}
