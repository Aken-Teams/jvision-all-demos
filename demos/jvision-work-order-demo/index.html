<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>維修工單管理｜MES 維修看板</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --accent-soft:#DBEAFE;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --black:#0F172A;
  --grid:rgba(37,99,235,.065);
}

*{box-sizing:border-box;}
html{scroll-behavior:auto;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;}
button,[data-i]{cursor:pointer;}
.msi{
  display:inline-block;
  overflow:hidden;
  width:1em;
  font-family:"Material Symbols Outlined";
  font-size:inherit;
  font-style:normal;
  font-weight:normal;
  line-height:1;
  text-transform:none;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#FFFFFF;
  background:var(--black);
  border-bottom:4px solid var(--color-accent);
  box-shadow:none;
}
.topbar-inner{
  display:flex;
  align-items:stretch;
  gap:0;
  width:100%;
  max-width:1440px;
  min-height:72px;
  margin:0 auto;
  padding:0 20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:310px;
  padding:10px 22px 10px 0;
  border-right:1px solid #475569;
}
.brand .logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  flex:0 0 42px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #FFFFFF;
  border-radius:0;
  font-size:23px;
}
.brand h1{
  margin:0;
  color:#FFFFFF;
  font-size:18px;
  font-weight:700;
  letter-spacing:.04em;
  line-height:1.15;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:4px;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.02em;
}
.nav{
  display:flex;
  align-items:stretch;
  justify-content:flex-end;
  gap:0;
  min-width:0;
  margin-left:auto;
}
.nav button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:10px 13px;
  color:#E2E8F0;
  background:transparent;
  border:0;
  border-left:1px solid #334155;
  border-radius:0;
  font-size:12px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
  transition:background-color 160ms ease,color 160ms ease;
}
.nav button:hover{color:#FFFFFF;background:#1E293B;}
.nav button.active{
  position:relative;
  color:#000000;
  background:var(--color-accent);
  border-color:var(--color-accent);
  box-shadow:none;
}
.nav button.active::after{
  content:"";
  position:absolute;
  right:0;
  bottom:-4px;
  left:0;
  height:4px;
  background:#FFFFFF;
}
.nav button .msi{font-size:19px;}

main{
  width:100%;
  max-width:1440px;
  min-height:calc(100vh - 72px);
  margin:0 auto;
  padding:24px 20px 64px;
}
.screen-head{
  display:grid;
  grid-template-columns:auto minmax(180px,1fr) auto;
  align-items:end;
  gap:12px 20px;
  margin:0 0 18px;
  padding:0 0 14px;
  border-bottom:3px solid var(--black);
}
.screen-head h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--black);
  font-size:clamp(22px,2vw,30px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1;
}
.screen-head h2 .msi{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:#FFFFFF;
  background:var(--color-primary);
  border:2px solid var(--black);
  font-size:23px;
}
.screen-head p{
  margin:0;
  padding-bottom:2px;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}
.pill{
  padding:5px 9px;
  color:var(--black);
  background:var(--color-muted);
  border:1px solid var(--black);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
}

.grid{display:grid;gap:12px;}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-board{grid-template-columns:repeat(4,minmax(245px,1fr));}

.card{
  min-width:0;
  padding:15px 16px;
  color:var(--card-foreground);
  background:var(--card);
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-border);
}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:24px;
  margin:0 0 13px;
  padding-bottom:9px;
  border-bottom:1px solid var(--line);
  color:var(--black);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .msi{color:var(--color-primary);font-size:20px;}
.card .sub{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
}

.kpi{
  position:relative;
  min-height:120px;
  overflow:hidden;
  padding-top:18px;
  border-top-width:6px;
  border-top-color:var(--color-primary);
}
.kpi:nth-child(2n){border-top-color:var(--color-secondary);}
.kpi:nth-child(3){border-top-color:var(--color-accent);}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:6px;
  padding-right:48px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.kpi .val{
  margin-top:8px;
  color:var(--black);
  font-family:"Fira Code",monospace;
  font-size:30px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.06em;
  line-height:1;
}
.kpi .val small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .delta{margin-top:9px;font-size:11px;font-weight:700;}
.kpi .ic{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:var(--color-primary);
  background:var(--accent-soft);
  border:1px solid var(--color-primary);
  border-radius:0;
  font-size:20px;
}
.up{color:var(--ok);}
.down{color:var(--bad);}
.up::before{content:"▲ ";font-family:"Fira Code",monospace;}
.down::before{content:"▼ ";font-family:"Fira Code",monospace;}

.tbl-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px;}
th{
  padding:9px 10px;
  color:#FFFFFF;
  background:var(--black);
  border-right:1px solid #475569;
  border-bottom:2px solid var(--color-primary);
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  line-height:1.25;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:last-child{border-right:0;}
td{
  padding:9px 10px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td:last-child{border-right:0;}
tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even) td{background:#F8FAFC;}
tbody tr:hover td{background:#EFF6FF;}
td:nth-child(4),td:nth-child(5),td:nth-child(6){font-variant-numeric:tabular-nums;}
td[style*="color:var(--accent)"],.wo-card .id,
.mc .n,.kpi .val,.tl-item .tl-s,small{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}

.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.tag::before{content:"■";font-size:7px;line-height:1;}
.t-red{color:#991B1B;background:#FEE2E2;}
.t-amber{color:#92400E;background:#FEF3C7;}
.t-green{color:#166534;background:#DCFCE7;}
.t-blue{color:#1E40AF;background:#DBEAFE;}
.t-purple{color:#1E40AF;background:#DBEAFE;}
.t-gray{color:#334155;background:#E2E8F0;}

.avatar{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  color:#FFFFFF;
  background:var(--color-primary);
  border:1px solid var(--black);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.board-col{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:2px solid var(--black);
  border-radius:0;
}
.board-col-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:-10px -10px 10px;
  padding:9px 10px;
  color:#FFFFFF;
  background:var(--black);
  border-bottom:3px solid var(--color-primary);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
}
.board-col:nth-child(3) .board-col-head{border-bottom-color:var(--color-accent);}
.board-col:nth-child(4) .board-col-head{border-bottom-color:var(--ok);}
.board-col-head .cnt{
  min-width:24px;
  padding:1px 6px;
  color:var(--black);
  background:#FFFFFF;
  border:1px solid #FFFFFF;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
.wo-card{
  margin-bottom:8px;
  padding:10px;
  background:#FFFFFF;
  border:1px solid var(--black);
  border-left:6px solid var(--color-secondary);
  border-radius:0;
  box-shadow:3px 3px 0 #CBD5E1;
}
.wo-card:last-child{margin-bottom:0;}
.wo-card .id{color:var(--color-primary);font-size:10px;font-weight:700;}
.wo-card .ttl{margin:4px 0 7px;color:var(--black);font-size:12px;font-weight:700;line-height:1.4;}
.wo-card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10px;}
.wo-card.p-urgent{border-left-color:var(--bad);}
.wo-card.p-high{border-left-color:var(--warn);}
.wo-card.p-normal{border-left-color:var(--info);}
.wo-card.p-done{border-left-color:var(--ok);}

.tl{position:relative;padding-left:29px;}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:3px;background:var(--black);}
.tl-item{position:relative;padding:0 0 16px 4px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{
  position:absolute;
  top:2px;
  left:-27px;
  width:17px;
  height:17px;
  background:#FFFFFF;
  border:4px solid var(--color-accent);
  border-radius:0;
}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--black);}
.tl-item.done .tl-dot::after{content:"✓";position:absolute;top:-6px;left:0;color:#FFFFFF;font-size:11px;font-weight:700;}
.tl-item .tl-t{color:var(--black);font-size:12px;font-weight:700;}
.tl-item .tl-s{color:var(--color-primary);font-size:10px;font-weight:600;}
.tl-item .tl-d{margin-top:3px;color:var(--muted);font-size:11px;}

.bar{height:9px;overflow:hidden;background:#CBD5E1;border:1px solid var(--black);border-radius:0;}
.bar>span{display:block;height:100%;background:var(--color-primary);border-radius:0;}
.chart{width:100%;overflow:hidden;}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #94A3B8;font-size:12px;}
.stat-row:last-child{border-bottom:0;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.03em;}
.field .inp{
  min-height:39px;
  padding:9px 10px;
  color:var(--ink);
  background:#F8FAFC;
  border:1px solid var(--black);
  border-radius:0;
  font-size:12px;
  font-weight:600;
}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:6px 10px;
  color:var(--ink);
  background:#FFFFFF;
  border:1px solid var(--black);
  border-radius:0;
  font-size:11px;
  font-weight:700;
}
.chip.on{color:#FFFFFF;background:var(--color-primary);border-color:var(--black);}
.chip.on::before{content:"✓ ";}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.btn{
  min-height:42px;
  padding:9px 16px;
  border:2px solid var(--black);
  border-radius:0;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  box-shadow:3px 3px 0 var(--black);
  transition:background-color 160ms ease,color 160ms ease,transform 160ms ease,box-shadow 160ms ease;
}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black);}
.btn-p{color:var(--color-on-accent);background:var(--color-accent);}
.btn-p:hover{background:#C2410C;}
.btn-o{color:var(--color-primary);background:#FFFFFF;}
.btn-o:hover{color:#FFFFFF;background:var(--color-primary);}
.mini-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.mc{padding:11px;background:var(--color-muted);border:1px solid var(--black);border-radius:0;}
.mc .n{color:var(--black);font-size:23px;font-weight:700;line-height:1.1;}
.mc .l{margin-top:4px;color:var(--muted);font-size:10px;font-weight:700;}

:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.nav button:focus-visible{position:relative;z-index:2;outline-color:#FFFFFF;outline-offset:-5px;}

#app{animation:screen-in 350ms ease-out both;}
@keyframes screen-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

@media(max-width:1100px){
  .topbar-inner{flex-direction:column;padding:0;}
  .brand{width:100%;min-width:0;padding:10px 16px;border-right:0;border-bottom:1px solid #334155;}
  .nav{justify-content:flex-start;width:100%;overflow-x:auto;}
  .nav button{flex:1;min-width:max-content;border-left:0;border-right:1px solid #334155;}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g-board{grid-template-columns:repeat(4,minmax(235px,1fr));}
}
@media(max-width:820px){
  main{padding:18px 14px 48px;}
  .screen-head{grid-template-columns:1fr auto;align-items:center;}
  .screen-head p{grid-column:1/-1;grid-row:2;}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .brand h1{font-size:16px;}
  .brand small{font-size:9px;}
  .nav button{min-width:48px;padding:9px 11px;}
  .nav button span.lbl{display:none;}
  main{padding:15px 10px 40px;}
  .screen-head{gap:8px;margin-bottom:12px;}
  .screen-head h2{font-size:21px;}
  .screen-head h2 .msi{width:34px;height:34px;font-size:20px;}
  .screen-head p{font-size:11px;}
  .pill{padding:4px 6px;font-size:9px;}
  .grid{gap:9px;}
  .g-kpi{grid-template-columns:1fr 1fr;}
  .card{padding:12px;box-shadow:3px 3px 0 var(--color-border);}
  .kpi{min-height:110px;padding:13px 10px 10px;}
  .kpi .lbl{padding-right:34px;font-size:9px;}
  .kpi .val{font-size:24px;}
  .kpi .ic{top:9px;right:8px;width:30px;height:30px;font-size:17px;}
  .mini-cards{grid-template-columns:1fr;}
}
@media(max-width:390px){
  .g-kpi{grid-template-columns:1fr;}
  .screen-head{grid-template-columns:1fr;}
  .screen-head .pill{justify-self:start;}
  .screen-head p{grid-column:1;grid-row:auto;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #app{animation:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="msi">build</span></div>
      <div><h1>維修工單管理</h1><small>MES 製造執行系統 · 設備維修全流程</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<script>
"use strict";
var NAV=[
  {i:0,ic:"receipt_long",t:"報修受理"},
  {i:1,ic:"account_tree",t:"維修看板"},
  {i:2,ic:"engineering",t:"派工執行"},
  {i:3,ic:"inventory_2",t:"備品領用"},
  {i:4,ic:"task_alt",t:"試車復機"},
  {i:5,ic:"history",t:"維修履歷"}
];
var charts=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;void el.offsetHeight;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
function baseOpt(extra){
  var o={chart:{fontFamily:'"Fira Sans",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    dataLabels:{enabled:false},grid:{borderColor:"#E2E8F0",strokeDashArray:0},
    colors:["#2563EB","#3B82F6","#93C5FD","#EA580C","#15803D"]};
  for(var k in extra){if(k==="chart"){for(var ck in extra.chart){o.chart[ck]=extra.chart[ck];}}else{o[k]=extra[k];}}return o;
}

/* SCREEN 0 */
function s0(){
  var kpis=[
    {l:"今日新報修",v:"14",u:"件",d:"+3 較昨日",dn:false,ic:"add_alert"},
    {l:"待受理",v:"6",u:"件",d:"2 件逾時未受理",dn:true,ic:"pending_actions"},
    {l:"緊急工單",v:"3",u:"件",d:"產線停機中",dn:true,ic:"priority_high"},
    {l:"平均受理時效",v:"11",u:"分",d:"-4 分 較上週",dn:false,ic:"timer"}

  h+='<div class="grid g-3" style="margin-bottom:16px">';
  var k=[{l:"本月工單總數",v:"316",ic:"summarize"},{l:"平均 MTTR",v:"3.4h",ic:"build"},{l:"設備平均稼動率",v:"94.3%",ic:"speed"}];
  for(var i=0;i<k.length;i++){var kk=k[i];h+='<div class="card kpi"><div class="ic"><span class="msi">'+kk.ic+'</span></div><div class="lbl">'+kk.l+'</div><div class="val">'+kk.v+'</div></div>';}
  h+='</div>';
  h+='<div class="grid g-2e">';
  h+='<div class="card"><h3><span class="msi">show_chart</span>近半年維修工單趨勢</h3><div id="c5a" class="chart"></div></div>';
  h+='<div class="card"><h3><span class="msi">radar</span>設備健康度雷達</h3><div id="c5b" class="chart"></div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:16px"><h3><span class="msi">precision_manufacturing</span>設備維修履歷彙總<span class="sub">近 6 個月</span></h3><div class="tbl-wrap"><table><thead><tr><th>設備</th><th>維修次數</th><th>MTBF 平均故障間隔</th><th>MTTR 平均修復</th><th>稼動率</th></tr></thead><tbody>';
  for(var j=0;j<eqs.length;j++){var e=eqs[j];
    h+='<tr><td><b>'+esc(e.eq)+'</b></td><td>'+e.cnt+' 次</td><td>'+esc(e.mtbf)+'</td><td>'+esc(e.mttr)+'</td><td><span class="tag t-'+e.t+'">'+esc(e.avail)+'</span></td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var CHARTFN=[null,null,s2charts,s3charts,s4charts,s5charts];

function show(i){
  var app=document.getElementById("app");
  destroyCharts();
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  void app.offsetHeight;
  if(CHARTFN[i])CHARTFN[i]();
}

(function buildNav(){
  var nav=document.getElementById("nav");var html="";
  for(var i=0;i<NAV.length;i++){var n=NAV[i];
    html+='<button data-i="'+n.i+'"><span class="msi">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
