<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>維修工單管理｜MES 維修看板</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa; --accent-soft:#f3effe;
  --bg:#f5f3fb; --card:#ffffff; --ink:#1e1b2e; --muted:#6b6780; --line:#ece8f6;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(100deg,#4c1d95,#7c3aed 60%,#8b5cf6);
  color:#fff; box-shadow:0 4px 20px rgba(76,29,149,.25);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:22px;}
.brand h1{font-size:17px;margin:0;font-weight:900;letter-spacing:.5px;white-space:nowrap;}
.brand small{display:block;font-size:11px;opacity:.8;font-weight:500;}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.14);
  padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;
  transition:.15s; white-space:nowrap;
}
.nav button:hover{background:rgba(255,255,255,.22);}
.nav button.active{background:#fff;color:var(--accent);border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.nav button .msi{font-size:19px;}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.screen-head h2{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px;}
.screen-head h2 .msi{color:var(--accent);font-size:26px;}
.screen-head p{margin:0;color:var(--muted);font-size:13px;padding-bottom:3px;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);}
.grid{display:grid;gap:16px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-board{grid-template-columns:repeat(4,1fr);}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-2e,.g-3,.g-board{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;box-shadow:0 2px 8px rgba(30,27,46,.03);}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card h3 .msi{color:var(--accent);font-size:19px;}
.card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;}
.kpi{position:relative;overflow:hidden;}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .val{font-size:29px;font-weight:900;margin-top:6px;letter-spacing:-.5px;}
.kpi .val small{font-size:14px;font-weight:700;color:var(--muted);}
.kpi .delta{font-size:12px;font-weight:700;margin-top:4px;}
.kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:21px;}
.up{color:var(--ok);} .down{color:var(--bad);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9fe;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.t-red{background:#fdecec;color:var(--bad);} .t-amber{background:#fef4e2;color:#b45309;}
.t-green{background:#e7f6ec;color:var(--ok);} .t-blue{background:#e7effd;color:var(--info);}
.t-purple{background:var(--accent-soft);color:var(--accent);} .t-gray{background:#eef0f4;color:#5b6472;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
.board-col{background:#f7f5fd;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.board-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:13.5px;padding:2px 4px;}
.board-col-head .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:1px 8px;color:var(--muted);}
.wo-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(30,27,46,.05);border-left:4px solid var(--accent2);}
.wo-card:last-child{margin-bottom:0;}
.wo-card .id{font-size:11px;font-weight:800;color:var(--accent);}
.wo-card .ttl{font-size:13px;font-weight:700;margin:3px 0 6px;line-height:1.35;}
.wo-card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.wo-card.p-urgent{border-left-color:var(--bad);}
.wo-card.p-high{border-left-color:var(--warn);}
.wo-card.p-normal{border-left-color:var(--info);}
.wo-card.p-done{border-left-color:var(--ok);}
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok);}
.tl-item .tl-t{font-size:13px;font-weight:700;}
.tl-item .tl-s{font-size:11.5px;color:var(--muted);}
.tl-item .tl-d{font-size:12.5px;color:var(--muted);margin-top:2px;}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;}
.bar > span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chart{width:100%;overflow:hidden;}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:820px){.form-grid{grid-template-columns:1fr;}}
.field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;}
.field .inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;background:#faf9fe;color:var(--ink);font-weight:600;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:default;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}
.btn{font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:10px;border:none;cursor:default;}
.btn-p{background:var(--accent);color:#fff;} .btn-o{background:#fff;color:var(--accent);border:1px solid var(--accent);}
.mini-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:560px){.mini-cards{grid-template-columns:1fr;}}
.mc{background:#faf9fe;border:1px solid var(--line);border-radius:12px;padding:12px;}
.mc .n{font-size:22px;font-weight:900;} .mc .l{font-size:11.5px;color:var(--muted);font-weight:600;}
@media(max-width:560px){.nav button span.lbl{display:none;} .nav button{padding:8px 10px;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="msi">build</span></div>
      <div><h1>維修工單管理</h1><small>MES 製造執行系統 · 設備維修全流程</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<script>
"use strict";
var NAV=[
  {i:0,ic:"receipt_long",t:"報修受理"},
  {i:1,ic:"account_tree",t:"維修看板"},
  {i:2,ic:"engineering",t:"派工執行"},
  {i:3,ic:"inventory_2",t:"備品領用"},
  {i:4,ic:"task_alt",t:"試車復機"},
  {i:5,ic:"history",t:"維修履歷"}
];
var charts=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
function baseOpt(extra){
  var o={chart:{fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    dataLabels:{enabled:false},grid:{borderColor:"#ece8f6",strokeDashArray:4},
    colors:["#7c3aed","#a78bfa","#c4b5fd","#f59e0b","#16a34a"]};
  for(var k in extra){o[k]=extra[k];}return o;
}

    {id:"WO-24812",eq:"檢測站 AOI-01",sym:"光源亮度衰減",area:"品保課",lv:"一般",t:"blue",time:"07:40",st:"已受理",sc:"t-blue"}

  var h='<div class="screen-head"><h2><span class="msi">receipt_long</span>報修受理</h2><p>登錄設備故障、判定優先級並開立維修工單</p><span class="pill">Step v0 · 受理</span></div>';
  h+='<div class="grid g-kpi" style="margin-bottom:16px">';

  h+='<div class="card"><h3><span class="msi">list_alt</span>今日報修受理清單<span class="sub">依報修時間排序</span></h3><div class="tbl-wrap"><table><thead><tr><th>工單</th><th>設備</th><th>故障現象</th><th>報修區域</th><th>優先級</th><th>時間</th><th>狀態</th></tr></thead><tbody>';
  for(var j=0;j<rows.length;j++){var r=rows[j];
    h+='<tr><td><b style="color:var(--accent)">'+esc(r.id)+'</b></td><td>'+esc(r.eq)+'</td><td>'+esc(r.sym)+'</td><td>'+esc(r.area)+'</td><td><span class="tag t-'+r.t+'">'+esc(r.lv)+'</span></td><td>'+r.time+'</td><td><span class="tag '+r.sc+'">'+esc(r.st)+'</span></td></tr>';

  h+='</tbody></table></div></div>';
  h+='<div class="card"><h3><span class="msi">post_add</span>新增報修單</h3>';

  h+='</div>';
  h+='</div>';
  return h;
}

    {t:"待處理",cnt:5,items:[

  var h='<div class="screen-head"><h2><span class="msi">engineering</span>派工執行</h2><p>技師負載分派、現場處置與工時登錄</p><span class="pill">Step v2 · 維修處置</span></div>';

function show(i){
  var app=document.getElementById("app");
  destroyCharts();
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  void app.offsetHeight;
  if(CHARTFN[i])CHARTFN[i]();
}

(function buildNav(){
  var nav=document.getElementById("nav");var html="";
  for(var i=0;i<NAV.length;i++){var n=NAV[i];
    html+='<button data-i="'+n.i+'"><span class="msi">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
