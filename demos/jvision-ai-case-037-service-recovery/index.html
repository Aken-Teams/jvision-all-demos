<head>
<meta charset="utf-8"/>

<style>
:root{
 --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
 --color-on-secondary:#000;--color-accent:#ea580c;--color-on-accent:#000;
 --color-background:#f8fafc;--color-foreground:#1e293b;--color-card:#fff;
 --color-card-foreground:#1e293b;--color-muted:#e9eff8;
 --color-muted-foreground:#475569;--color-border:#e2e8f0;
 --color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#2563eb;
 --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
 --ok:#15803d;--warn:#a94306;--bad:#dc2626;--info:#2563eb;
 --shadow:0 12px 30px rgba(15,23,42,.07);--radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--color-background);color:var(--ink);
 font-family:"Work Sans","PingFang TC","Microsoft JhengHei",sans-serif;
 font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid var(--color-ring);outline-offset:3px;
}
.material-symbols-outlined{
 font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:"FILL" 0;
}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{
 position:sticky;top:0;height:100vh;z-index:20;padding:20px 14px;
 display:flex;flex-direction:column;gap:5px;overflow:auto;
 background:#fff;border-right:1px solid var(--line);
}
.bd{display:flex;align-items:center;gap:11px;padding:2px 7px 22px}
.lg{
 width:42px;height:42px;display:grid;place-items:center;flex:none;
 color:#fff;background:var(--blue);border-radius:10px;
 font-family:"Outfit",sans-serif;font-size:21px;font-weight:700;
 box-shadow:4px 4px 0 #bfdbfe;
}
.bd b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.bd span{
 display:block;margin-top:2px;color:var(--blue);font-family:"Outfit",sans-serif;
 font-size:9px;font-weight:600;letter-spacing:.13em;
}
.side button{
 width:100%;min-height:44px;padding:10px 12px;display:flex;align-items:center;
 gap:11px;border:1px solid transparent;border-radius:8px;background:transparent;
 color:#475569;text-align:left;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .2s;
}
.side button .material-symbols-outlined{color:#64748b}
.side button:hover{background:#f1f5f9;color:#0f172a;transform:translateX(2px)}
.side button.on{
 background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;
 box-shadow:inset 3px 0 var(--blue);
}
.side button.on .material-symbols-outlined{color:var(--blue);font-variation-settings:"FILL" 1}
.foot{
 margin-top:auto;padding:16px 10px 2px;border-top:1px solid var(--line);
 color:var(--muted);font-size:11px;line-height:1.8;
}
.main{min-width:0;padding:24px clamp(16px,2.5vw,34px) 96px}
.vh{
 position:sticky;top:0;z-index:15;margin:-24px calc(clamp(16px,2.5vw,34px)*-1) 20px;
 padding:18px clamp(16px,2.5vw,34px);display:flex;align-items:center;
 justify-content:space-between;gap:16px;background:rgba(248,250,252,.94);
 border-bottom:1px solid rgba(226,232,240,.9);backdrop-filter:blur(14px);
}
.vh h2{
 margin:0;font-family:"Outfit","PingFang TC",sans-serif;font-size:24px;
 line-height:1.2;font-weight:700;letter-spacing:-.02em;
}
.vh p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.live{
 display:flex;align-items:center;gap:8px;flex:none;padding:7px 11px;
 border:1px solid #fed7aa;border-radius:999px;background:#fff7ed;
 color:#9a3412;font-size:11px;font-weight:700;
}
.live i{width:8px;height:8px;border-radius:50%;background:var(--color-accent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi,.card,.npc{
 position:relative;background:var(--color-card);border:1px solid var(--line);
 border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.03);
 transition:border-color .22s,box-shadow .22s,transform .22s;
}
.kpi:hover,.card:hover,.npc:hover{border-color:#bfdbfe;box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi{min-height:118px;padding:16px;overflow:hidden}
.kpi:after{
 content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
 background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .25s;
}
.kpi:hover:after{transform:scaleX(1)}
.kpi .l{color:var(--muted);font-size:11.5px;font-weight:600}
.kpi .v{
 margin-top:4px;font-family:"Outfit",sans-serif;font-size:29px;
 font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;
}
.kpi .d{margin-top:7px;font-size:11px;font-weight:600}
.kpi .ic{
 position:absolute;right:14px;top:14px;width:32px;height:32px;display:grid;
 place-items:center;border-radius:8px;background:#eff6ff;color:var(--blue);
}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:17px}
.card h3{
 margin:0 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 font-size:13px;font-weight:700;letter-spacing:.01em;
}
.card h3>.material-symbols-outlined{
 width:30px;height:30px;display:grid;place-items:center;border-radius:7px;
 background:#eff6ff;color:var(--blue);font-size:18px;
}
.tag{
 display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
 font-size:10.5px;font-weight:700;line-height:1.3;white-space:nowrap;
}
.t-ok{background:#dcfce7;color:#166534}.t-ok:before{content:"✓ "}
.t-warn{background:#ffedd5;color:#9a3412}.t-warn:before{content:"! "}
.t-bad{background:#fee2e2;color:#991b1b}.t-bad:before{content:"! "}
.t-info{background:#dbeafe;color:#1e40af}.t-info:before{content:"• "}
.t-rose{background:#ffedd5;color:#9a3412}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{
 background:#f1f5f9;color:#334155;font-size:10.5px;font-weight:700;
 letter-spacing:.025em;text-transform:none;
}
table.data tr:first-child th:first-child{border-radius:7px 0 0 0}
table.data tr:first-child th:last-child{border-radius:0 7px 0 0}
table.data tr:hover td{background:#f8fafc}
table.data td:nth-child(3){font-variant-numeric:tabular-nums}
.chart{height:250px}
.bar,.track{overflow:hidden;background:#e2e8f0;border-radius:999px}
.bar{height:8px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:inherit}
.queue,.slarow,.esc,.appr,.chat,.fbk{display:flex;flex-direction:column;gap:10px}
.qc{
 position:relative;padding:12px 13px;background:#fff;border:1px solid var(--line);
 border-left:4px solid var(--info);border-radius:9px;
 transition:border-color .2s,box-shadow .2s,transform .2s;
}
.qc:hover{box-shadow:0 7px 18px rgba(15,23,42,.08);transform:translateX(2px)}
.qc.hi{border-left-color:var(--bad);background:linear-gradient(90deg,#fff7f7,#fff 24%)}
.qc.mid{border-left-color:var(--warn)}.qc.lo{border-left-color:var(--info)}
.qc .qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qc .qt b{font-size:12.5px}
.id,.amt,.num,table.data td:first-child,.tm{
 font-family:"Work Sans",monospace;font-variant-numeric:tabular-nums;
}
.id{color:#1d4ed8;font-size:11.5px;font-weight:700}
.meta{
 margin-top:6px;display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:11px;
}
.meta span{display:flex;align-items:center;gap:4px}.meta .material-symbols-outlined{font-size:14px}
.sla{margin-left:auto;text-align:right;flex:none}
.sla .num{font-size:16px;font-weight:700;line-height:1}
.sla small{display:block;margin-top:3px;color:var(--muted);font-size:9.5px}
.sla.red .num{color:var(--bad)}.sla.amb .num{color:var(--warn)}.sla.grn .num{color:var(--ok)}
.chan{
 width:27px;height:27px;display:grid;place-items:center;flex:none;border-radius:6px;color:#fff;
}
.chan .material-symbols-outlined{font-size:15px}
.c-phone{background:#4f46e5}.c-mail{background:#0369a1}.c-chat{background:#047857}.c-social{background:#be123c}
.ava{
 width:23px;height:23px;display:inline-grid!important;place-items:center;flex:none;
 border-radius:50%;background:#dbeafe;color:#1e40af;font-size:10px;font-weight:700;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;display:inline-block;border-radius:2px}
.slr{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.slr .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.slr .h b{font-size:12px;font-family:"Work Sans",monospace}
.slr .track{height:8px}
.slr .track i{display:block;height:100%;border-radius:inherit}
.slr .k{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--muted);font-size:10.5px}
.ei{
 display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--line);
 border-left:3px solid var(--blue);border-radius:8px;background:#f8fafc;
}
.ei.r{border-left-color:var(--bad)}.ei.a{border-left-color:var(--warn)}
.ei>.material-symbols-outlined{flex:none;color:var(--blue);font-size:18px}
.ei.r>.material-symbols-outlined{color:var(--bad)}.ei.a>.material-symbols-outlined{color:var(--warn)}
.ei b{font-size:11.5px}.ei small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.ei .tm{margin-left:auto;flex:none;color:var(--muted);font-size:9.5px}
.ac{padding:14px;border:1px solid var(--line);border-radius:9px;background:#fff}
.ac .ah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.ac .ah b{font-size:12.5px}
.ac .amt{margin-left:auto;color:#c2410c;font-size:17px;font-weight:700}
.steps{display:flex;align-items:flex-start;gap:4px}
.stp{position:relative;flex:1;min-width:62px;text-align:center}
.stp .cir{
 position:relative;z-index:1;width:28px;height:28px;margin:0 auto 5px;display:grid;
 place-items:center;border:1px solid #cbd5e1;border-radius:50%;background:#fff;
 color:#64748b;font-size:11px;font-weight:700;
}
.stp.done .cir{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.now .cir{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px #dbeafe}
.stp b{display:block;font-size:10.5px}.stp small{display:block;color:var(--muted);font-size:9.5px}
.stp .ln{position:absolute;z-index:0;top:14px;left:60%;right:-40%;height:2px;background:#dbe3ec}
.stp.done .ln{background:var(--ok)}
.mini{display:flex;gap:7px}
.btn{
 min-height:36px;padding:7px 12px;border-radius:7px;border:1px solid transparent;
 font-size:11px;font-weight:700;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(15,23,42,.12)}
.btn.ok{background:var(--color-accent);color:#fff}
.btn.ok:hover{background:#c2410c}
.btn.no{background:#fff;border-color:#fca5a5;color:#b91c1c}
.btn.gh{background:#fff;border-color:#cbd5e1;color:#334155}
.msg{max-width:84%;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.65}
.msg.cust{align-self:flex-start;background:#f1f5f9;border:1px solid #e2e8f0;border-bottom-left-radius:3px}
.msg.ai{align-self:flex-end;background:#eff6ff;border:1px solid #bfdbfe;border-bottom-right-radius:3px}
.msg .who{display:flex;align-items:center;gap:5px;margin-bottom:3px;color:var(--muted);font-size:10px;font-weight:700}
.msg .who .material-symbols-outlined{color:var(--blue);font-size:14px}
.sug{margin-bottom:9px;padding:11px 12px;border:1px solid #dbeafe;border-radius:8px;background:#f8fbff}
.sug b{display:block;margin-bottom:4px;font-size:11.5px}.sug small{color:var(--muted);font-size:10.5px;line-height:1.6}
.conf{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#dbeafe;color:#1e40af;font-size:9.5px}
.kbrow{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.kbrow>.material-symbols-outlined{margin-top:2px;flex:none;color:var(--blue);font-size:18px}
.kbrow b{font-size:11.5px}.kbrow small{display:block;color:var(--muted);font-size:10.5px}
.stars{color:#a94306;font-size:13px;letter-spacing:1px}
.fc{padding:11px 12px;border:1px solid var(--line);border-radius:8px}
.fc .fh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fc .fh b{font-size:11.5px}.fc p{margin:6px 0;font-size:11.5px;line-height:1.6}
.nps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.npc{padding:15px;text-align:center}
.npc .v{font-family:"Outfit",sans-serif;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.npc .l{margin-top:2px;color:var(--muted);font-size:10.5px}
.view-enter>*{animation:reveal .4s cubic-bezier(.2,.9,.3,1.2) both}
.view-enter>*:nth-child(2){animation-delay:.06s}
@keyframes reveal{from{opacity:0;transform:translateY(12px) scale(.985)}}
@media(max-width:1024px){
 .shell{grid-template-columns:210px minmax(0,1fr)}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
 .shell{grid-template-columns:1fr}
 .side{
  position:sticky;top:0;height:auto;padding:10px 12px;display:block;
  border-right:0;border-bottom:1px solid var(--line);overflow:hidden;
 }
 .bd{padding:0 2px 10px}.lg{width:36px;height:36px}
 #nav{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:thin}
 .side button{width:auto;min-width:max-content;min-height:40px;padding:8px 10px}
 .side button.on{box-shadow:inset 0 -3px var(--blue)}
 .foot{display:none}
 .main{padding-top:16px}
 .vh{position:static;margin:-16px calc(clamp(16px,2.5vw,34px)*-1) 16px;padding-top:15px}
 .steps{overflow-x:auto;padding-bottom:5px}.stp{min-width:90px}
}
@media(max-width:480px){
 .main{padding-left:12px;padding-right:12px}
 .vh{align-items:flex-start}.vh h2{font-size:21px}.vh p{max-width:235px}.live{padding:6px 8px;font-size:10px}
 .kpis,.nps{grid-template-columns:1fr}
 .kpi{min-height:105px}.card{padding:13px}
 .msg{max-width:95%}.slr .k{flex-direction:column;gap:2px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation:none!important;transition:none!important}
 .view-enter>*{opacity:1!important;transform:none!important}
}
</style>
</head>
