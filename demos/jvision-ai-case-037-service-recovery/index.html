<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>客訴補償處理站 · Service Recovery Desk</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#f43f5e;--accent2:#fb7185;--ink:#1a1116;--bg:#f6f0f2;--card:#fff;--line:#efdfe4;--mut:#8a6f78;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#6366f1}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#fff,#fff7f9);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 20px rgba(244,63,94,.42);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9px;color:var(--accent);letter-spacing:1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#6b555d;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#c9a9b3}
.side button:hover{background:#fdeef1}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(244,63,94,.32)}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.8}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#ffe4ea;color:#be123c;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(244,63,94,.5)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(244,63,94,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#e0e7ff;color:#4338ca}.t-rose{background:#ffe4ea;color:#be123c}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fdf3f5}
table.data tr:hover td{background:#fdf6f8}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#f3e5ea;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
/* queue */
.queue{display:flex;flex-direction:column;gap:10px}
.qc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:13px;padding:12px 14px;background:#fff;position:relative}
.qc.hi{border-left-color:var(--bad);background:linear-gradient(90deg,#fff5f7,#fff)}
.qc.mid{border-left-color:var(--warn)}
.qc.lo{border-left-color:var(--info)}
.qc .qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qc .qt b{font-size:13.5px;font-family:"Noto Sans TC"}
.qc .qt .id{font-family:Inter;font-weight:800;color:var(--accent);font-size:12.5px}
.qc .meta{color:var(--mut);font-size:11.5px;margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.qc .meta span{display:flex;align-items:center;gap:4px}
.qc .meta .material-symbols-outlined{font-size:14px}
.sla{margin-left:auto;text-align:right;flex:none}
.sla .num{font-family:Inter;font-weight:900;font-size:17px;line-height:1}
.sla small{font-size:9.5px;color:var(--mut);display:block}
.sla.red .num{color:var(--bad)}.sla.amb .num{color:var(--warn)}.sla.grn .num{color:var(--ok)}
.chan{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.chan .material-symbols-outlined{font-size:15px}
.c-phone{background:#6366f1}.c-mail{background:#0ea5e9}.c-chat{background:#10b981}.c-social{background:#f43f5e}
.ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800;font-family:"Noto Sans TC"}
/* sla bars */
.slarow{display:flex;flex-direction:column;gap:11px}
.slr{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.slr .h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.slr .h b{font-size:12.5px;font-family:"Noto Sans TC"}
.slr .track{height:9px;background:#f3e5ea;border-radius:6px;overflow:hidden;position:relative}
.slr .track i{display:block;height:100%;border-radius:6px}
.slr .k{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--mut)}
.esc{display:flex;flex-direction:column;gap:8px}
.ei{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:#fdf3f5;border-left:3px solid var(--accent)}
.ei.r{border-color:var(--bad)}.ei.a{border-color:var(--warn)}
.ei .material-symbols-outlined{font-size:18px;flex:none;color:var(--accent)}
.ei.r .material-symbols-outlined{color:var(--bad)}.ei.a .material-symbols-outlined{color:var(--warn)}
.ei b{font-size:12.5px;font-family:"Noto Sans TC"}
.ei small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ei .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
/* compensation approval flow */
.appr{display:flex;flex-direction:column;gap:12px}
.ac{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.ac .ah{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.ac .ah b{font-size:13.5px;font-family:"Noto Sans TC"}
.ac .amt{font-family:Inter;font-weight:900;font-size:18px;color:var(--accent);margin-left:auto}
.steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stp{flex:1;min-width:70px;text-align:center;position:relative}
.stp .cir{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;font-weight:800;font-size:13px;background:#f3e5ea;color:#b58a97}
.stp.done .cir{background:var(--ok);color:#fff}
.stp.now .cir{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(244,63,94,.18)}
.stp small{font-size:10.5px;color:var(--mut);display:block;line-height:1.4}
.stp b{font-size:11.5px;font-family:"Noto Sans TC";display:block}
.stp .ln{position:absolute;top:15px;left:60%;right:-40%;height:2px;background:#eadde2;z-index:0}
.stp.done .ln{background:var(--ok)}
.mini{display:flex;gap:6px}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;border:1px solid var(--bad);color:var(--bad)}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--mut)}
/* ai chat */
.chat{display:flex;flex-direction:column;gap:11px}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.6}
.msg.cust{align-self:flex-start;background:#f3e9ec;border-bottom-left-radius:4px}
.msg.ai{align-self:flex-end;background:linear-gradient(135deg,#fff0f3,#ffe4ea);border:1px solid #fbd0da;border-bottom-right-radius:4px}
.msg .who{font-size:10.5px;color:var(--mut);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.msg .who .material-symbols-outlined{font-size:14px;color:var(--accent)}
.sug{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fdf3f5;margin-bottom:10px}
.sug b{font-size:12.5px;font-family:"Noto Sans TC";display:block;margin-bottom:4px}
.sug small{color:var(--mut);font-size:11.5px;line-height:1.6}
.conf{display:inline-block;font-size:10.5px;font-weight:800;color:var(--accent);background:#ffe4ea;padding:1px 8px;border-radius:20px;margin-left:6px}
.kbrow{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.kbrow .material-symbols-outlined{color:var(--accent);font-size:18px;flex:none;margin-top:2px}
.kbrow b{font-size:12.5px;font-family:"Noto Sans TC"}
.kbrow small{color:var(--mut);font-size:11px;display:block}
/* satisfaction */
.stars{color:#f59e0b;font-size:14px;letter-spacing:1px}
.fbk{display:flex;flex-direction:column;gap:10px}
.fc{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fc .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.fc .fh b{font-size:12.5px;font-family:"Noto Sans TC"}
.fc p{margin:4px 0 0;font-size:12px;color:#54444a;line-height:1.6}
.nps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.npc{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.npc .v{font-family:Inter;font-weight:900;font-size:24px}
.npc .l{font-size:11px;color:var(--mut);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two,.nps{grid-template-columns:1fr}
 .nps{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .main{padding:16px 14px}
 .msg{max-width:94%}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">訴</div><div><b>客訴補償處理站</b><span>SERVICE RECOVERY DESK</span></div></div>

<script>
const MOD=[

const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

/* 渠道:電話c-phone/信箱c-mail/線上c-chat/社群c-social ; sev hi/mid/lo ; sla red/amb/grn */

/* SLA 追蹤 */

["CT-88139","出貨延誤退費 · 企業戶","P2 · 30 分回應 / 8 小時解決",62,"amb","回應剩 18 分 · 解決剩 5 小時","監控中"],

["CT-88142 回應逾時升級","系統自動升級白金 VIP 案件至客服主管","r","2 分前"],

["CT-88135 已回覆客戶","換貨物流單已建立並通知客戶","g","41 分前"]];

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
