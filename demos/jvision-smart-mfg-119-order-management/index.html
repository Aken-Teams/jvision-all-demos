<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Management 訂單管理｜純 UI 展示</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0f766e; --accent2:#5eead4; --accent-soft:#ccfbf1;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2b28; --muted:#5b716d;
  --line:#e2ede9; --ok:#0f766e; --warn:#b45309; --bad:#be123c; --info:#0369a1;
  --shadow:0 1px 2px rgba(15,118,110,.06),0 6px 18px rgba(15,118,110,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{
  width:250px; flex:0 0 250px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand-logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;box-shadow:var(--shadow)}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px}
.brand-txt span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav-btn{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border:none;background:transparent;
  border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--muted);
  text-align:left;width:100%;font-weight:600;transition:.15s;min-width:0;
}
.nav-btn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.nav-btn .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn:hover{background:var(--bg);color:var(--ink)}
.nav-btn.on{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.nav-idx{margin-left:auto;font-size:11px;opacity:.6;flex:0 0 auto}
.nav-btn.on .nav-idx{opacity:.85}
.side-foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.main{flex:1 1 auto;min-width:0;padding:24px 28px 48px;max-width:1280px;margin:0 auto;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14.5px;font-weight:800}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .kt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .kt .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi .kv{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .kv small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .kd{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.kpi .kd .material-symbols-outlined{font-size:15px}
.kicon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);position:absolute;top:16px;right:16px}
.kicon .material-symbols-outlined{font-size:21px}
.card.rel{position:relative}
.chart{width:100%;height:260px;overflow:hidden;min-width:0}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{background:#f6faf9;text-align:left;padding:10px 12px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);font-size:11.5px}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f9fdfc}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.tag .material-symbols-outlined{font-size:13px}
.t-ok{background:#dcfce7;color:#166534}
.t-warn{background:#fef3c7;color:#92400e}
.t-bad{background:#ffe4e6;color:#9f1239}
.t-info{background:#e0f2fe;color:#075985}
.t-mut{background:#eef2f1;color:#475569}
.t-acc{background:var(--accent-soft);color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0}
.col{background:#f6faf9;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;font-weight:800}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tk:last-child{margin-bottom:0}
.tk .tid{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tk .tt{font-size:12.5px;font-weight:700;margin:5px 0 8px}
.tk .tm{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.tk .tm .who{display:inline-flex;align-items:center;gap:5px}
.av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex:0 0 auto}
.bar{height:8px;background:#e6efed;border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#14b8a6)}
.barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.barrow .bl{font-size:12px;width:96px;flex:0 0 auto;color:var(--muted);font-weight:600}
.barrow .bp{flex:1 1 auto;min-width:0}
.barrow .bv{font-size:12px;font-weight:800;width:44px;text-align:right;flex:0 0 auto}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px}
.tl-i:last-child{padding-bottom:0}
.tl-i .dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tl-i.done .dot{background:var(--accent);border-color:var(--accent)}
.tl-i .th{font-size:13px;font-weight:800}
.tl-i .ts{font-size:11.5px;color:var(--muted);margin-top:1px}
.tl-i .tw{font-size:11px;color:var(--muted);margin-top:3px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.cmp .ch{background:#f6faf9;padding:9px 12px;font-size:11.5px;font-weight:800;border-bottom:1px solid var(--line)}
.cmp .cr{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;min-width:0}
.cmp .cr .lbl{color:var(--muted);flex:0 0 auto}
.cmp .cr.diff{background:#fff7ed}
.cmp .cr .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{background:var(--accent-soft);border:1px solid #99f6e4;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#134e4a;display:flex;gap:10px;align-items:flex-start}
.note .material-symbols-outlined{color:var(--accent);font-size:20px;flex:0 0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hd h3{margin:0}
.seg{display:inline-flex;background:#eef2f1;border-radius:9px;padding:3px;gap:2px}
.seg span{padding:5px 11px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--muted)}
.seg span.on{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
.mini{display:flex;align-items:center;gap:8px;font-size:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.mini:last-child{border-bottom:none}
.mini .md{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
@media(max-width:1080px){ .g4{grid-template-columns:repeat(2,1fr)} .g23,.g32{grid-template-columns:1fr} }
@media(max-width:820px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 12px 0 4px}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;flex:1 1 auto}
  .nav-btn{width:auto}
  .nav-idx{display:none}
  .side-foot{display:none}
  .main{padding:18px 16px 40px}
}
@media(max-width:560px){
  .board{grid-template-columns:1fr}
  .nav-btn .nl{display:none}
  .nav-btn{padding:9px 11px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">receipt_long</span></div>
      <div class="brand-txt"><b>OrderFlow</b><span>訂單管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br/>v2026.08 · 無後端</div>
  </aside>
  <main class="main">
    <div class="top" id="top"></div>
    <div id="view"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"訂單控制台",sub:"在製訂單、逾期風險與交期達成率總覽"},
  {icon:"fact_check",name:"客戶 PO 比對",sub:"PO 品項、數量、單價與系統訂單自動勾稽"},
  {icon:"calendar_month",name:"交期承諾",sub:"依產線負荷試算 ATP 可承諾交期"},
  {icon:"account_tree",name:"訂單變更管理",sub:"改量、改期、取消的簽核與版本追蹤"},
  {icon:"inventory_2",name:"出貨排程",sub:"分批出貨、揀貨與物流配送看板"},
  {icon:"receipt_long",name:"結案對帳",sub:"出貨對發票、應收帳款與交貨績效"}
];
var charts={};
function disposeAll(){for(var k in charts){if(charts[k]){try{charts[k].dispose();}catch(e){}charts[k]=null;}}}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].dispose();}catch(e){}}var c=echarts.init(el);c.setOption(opt);charts[id]=c;}
function resizeAll(){for(var k in charts){if(charts[k]){try{charts[k].resize();}catch(e){}}}}
window.addEventListener("resize",resizeAll);
var AX={color:"#5b716d",fontSize:11};
var GRID={left:8,right:14,top:26,bottom:6,containLabel:true};

/* ---------- SCREEN 0 : 訂單控制台 ---------- */
function s0(){
  var kpis=[
    {t:"在製訂單",v:"142",u:"張",d:"+8 本週",c:"up",ic:"receipt_long"},
    {t:"準時交貨率",v:"96.3",u:"%",d:"+2.1 pt",c:"up",ic:"verified"},
    {t:"逾期風險單",v:"7",u:"張",d:"需即刻處理",c:"down",ic:"warning"},
    {t:"本月出貨金額",v:"3,840",u:"萬",d:"+12.4%",c:"up",ic:"trending_up"}
  ];
  var kh=kpis.map(function(k){
    return '<div class="card rel kpi"><div class="kt"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.t+'</div>'+
      '<div class="kv">'+k.v+'<small>'+k.u+'</small></div>'+
      '<div class="kd '+k.c+'"><span class="material-symbols-outlined">'+(k.c==="up"?"trending_up":k.c==="down"?"priority_high":"remove")+'</span>'+k.d+'</div>'+
      '<div class="kicon"><span class="material-symbols-outlined">'+k.ic+'</span></div></div>';
  }).join("");
  var rows=[
    ["SO-26081","O昇精機","伺服馬達 x120","08/18","t-info","進行中"],
    ["SO-26079","O運電子","控制模組 x60","08/16","t-acc","備貨完成"],
    ["SO-26075","O達工業","線性滑軌 x300","08/15","t-bad","延遲 2 天"],
    ["SO-26073","O泰科技","減速機 x45","08/20","t-warn","待客戶回覆"],
    ["SO-26070","O盛機械","連接器 x1,200","08/14","t-ok","在途"],
    ["SO-26066","力群自動化","感測器 x480","08/22","t-mut","已建檔"]
  ];
  var tr=rows.map(function(r){
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td>'+
      '<td><span class="tag '+r[4]+'">'+r[5]+'</span></td></tr>';
  }).join("");
  document.getElementById("view").innerHTML=
    '<div class="grid g4">'+kh+'</div>'+
    '<div class="grid g23" style="margin-top:16px">'+
      '<div class="card"><div class="hd"><h3>近 6 月出貨金額與訂單量</h3><div class="seg"><span>週</span><span class="on">月</span></div></div><div id="c0a" class="chart"></div></div>'+
      '<div class="card"><h3>訂單狀態分布</h3><p class="sub">142 張在製訂單即時盤點</p><div id="c0b" class="chart"></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="hd"><h3>優先處理訂單</h3><span class="pill"><span class="material-symbols-outlined">bolt</span>依交期與風險排序</span></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>訂單號</th><th>客戶</th><th>品項</th><th>交期</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
  void document.getElementById("view").offsetHeight;
  mkChart("c0a",{
    tooltip:{trigger:"axis"},grid:GRID,legend:{data:["出貨金額(萬)","訂單量"],textStyle:AX,top:0,right:0},
    xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLabel:AX,axisLine:{lineStyle:{color:"#e2ede9"}}},
    yAxis:[{type:"value",axisLabel:AX,splitLine:{lineStyle:{color:"#eef4f2"}}},{type:"value",axisLabel:AX,splitLine:{show:false}}],
    series:[
      {name:"出貨金額(萬)",type:"bar",data:[2980,3150,3020,3510,3420,3840],itemStyle:{color:"#0f766e",borderRadius:[5,5,0,0]},barWidth:"46%"},
      {name:"訂單量",type:"line",yAxisIndex:1,data:[118,124,120,135,131,142],smooth:true,itemStyle:{color:"#f59e0b"},lineStyle:{width:3}}
    ]
  });
  mkChart("c0b",{
    tooltip:{trigger:"item"},legend:{bottom:0,textStyle:AX,itemWidth:10,itemHeight:10},
    series:[{type:"pie",radius:["48%","72%"],center:["50%","44%"],avoidLabelOverlap:true,
      itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
      data:[
        {value:58,name:"產線加工",itemStyle:{color:"#0f766e"}},
        {value:34,name:"待出貨",itemStyle:{color:"#5eead4"}},
        {value:28,name:"排程中",itemStyle:{color:"#99f6e4"}},
        {value:15,name:"交期確認",itemStyle:{color:"#f59e0b"}},
        {value:7,name:"逾期風險",itemStyle:{color:"#be123c"}}
      ]}]
  });
}

/* ---------- SCREEN 1 : 客戶 PO 比對 ---------- */
function s1(){
  var items=[
    {po:"料號 M-2201 伺服馬達",sys:"料號 M-2201 伺服馬達",diff:false},
    {po:"數量 120 台",sys:"數量 120 台",diff:false},
    {po:"單價 NT$ 18,500",sys:"單價 NT$ 18,900",diff:true},
    {po:"交期 2026-08-18",sys:"交期 2026-08-20",diff:true},
    {po:"付款 月結 60 天",sys:"付款 月結 60 天",diff:false},
    {po:"收貨地 台中廠",sys:"收貨地 台中廠",diff:false}
  ];
  var lRows=items.map(function(it){return '<div class="cr'+(it.diff?" diff":"")+'"><span class="lbl">PO</span><span class="val">'+it.po+(it.diff?" ⚠":"")+'</span></div>';}).join("");
  var rRows=items.map(function(it){return '<div class="cr'+(it.diff?" diff":"")+'"><span class="lbl">系統</span><span class="val">'+it.sys+'</span></div>';}).join("");
  var q=[
    ["PO-A88231","O昇精機","6","4","2","t-warn","2 項差異"],
    ["PO-A88230","O運電子","4","4","0","t-ok","完全一致"],
    ["PO-A88228","O達工業","8","5","3","t-bad","3 項差異"],
    ["PO-A88225","O泰科技","5","5","0","t-ok","完全一致"],
    ["PO-A88221","O盛機械","7","6","1","t-warn","1 項差異"]
  ];
  var qtr=q.map(function(r){
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="mono" style="color:var(--ok)">'+r[3]+'</td><td class="mono" style="color:var(--bad)">'+r[4]+'</td><td><span class="tag '+r[5]+'">'+r[6]+'</span></td></tr>';
  }).join("");
  document.getElementById("view").innerHTML=
    '<div class="grid g4">'+
      '<div class="card rel kpi"><div class="kt"><span class="material-symbols-outlined">fact_check</span>本日待比對 PO</div><div class="kv">18<small>張</small></div><div class="kd flat"><span class="material-symbols-outlined">schedule</span>平均 3.5 分/張</div></div>'+
      '<div class="card rel kpi"><div class="kt"><span class="material-symbols-outlined">task_alt</span>自動勾稽通過</div><div class="kv">83<small>%</small></div><div class="kd up"><span class="material-symbols-outlined">trending_up</span>+6 pt</div></div>'+
      '<div class="card rel kpi"><div class="kt"><span class="material-symbols-outlined">rule</span>差異待確認</div><div class="kv">11<small>項</small></div><div class="kd down"><span class="material-symbols-outlined">priority_high</span>3 張阻擋建單</div></div>'+
      '<div class="card rel kpi"><div class="kt"><span class="material-symbols-outlined">history</span>平均建單時效</div><div class="kv">4.2<small>小時</small></div><div class="kd up"><span class="material-symbols-outlined">trending_down</span>-38%</div></div>'+
    '</div>'+
    '<div class="grid g23" style="margin-top:16px">'+

    return '<button class="nav-btn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="nl">'+m.name+'</span><span class="nav-idx">0'+(i+1)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i");});
  });
}

function show(i){
  disposeAll();
  var mod=MODS[i]||MODS[0];
  document.getElementById("top").innerHTML=
    '<div><h1>'+mod.name+'</h1><p>'+mod.sub+'</p></div>'+
    '<span class="pill"><span class="material-symbols-outlined">'+mod.icon+'</span>模組 0'+(i+1)+' / 06</span>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.classList.toggle("on",+b.getAttribute("data-i")===i);
  });
  var fn=SCREENS[i]||SCREENS[0];
  fn();
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
