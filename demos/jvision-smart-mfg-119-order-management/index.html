<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Management 訂單管理｜純 UI 展示</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --ok:#047857;
  --warn:#A34C00;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --panel:#FFFFFF;
  --bg:#F8FAFC;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.icon{
  width:20px;height:20px;display:inline-block;vertical-align:middle;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;top:0;z-index:20;width:264px;height:100vh;flex:0 0 264px;
  display:flex;flex-direction:column;padding:24px 16px;
  background:var(--color-card);border-right:1px solid var(--color-border);
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px}
.brand-logo{
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  color:var(--color-on-primary);background:var(--color-primary);border-radius:10px;
}
.brand-logo .icon{width:24px;height:24px}
.brand-txt b{
  display:block;font-family:"Cinzel","Crimson Pro",serif;font-size:15px;
  font-weight:600;letter-spacing:.05em;
}
.brand-txt span{display:block;color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{
  width:100%;min-height:48px;display:flex;align-items:center;gap:12px;
  padding:10px 12px;color:var(--muted);background:transparent;
  border:1px solid transparent;border-radius:8px;text-align:left;font-weight:600;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav-btn:hover{color:var(--ink);background:var(--color-muted);border-color:var(--line)}
.nav-btn.on{
  color:var(--color-on-primary);background:var(--color-primary);
  border-color:var(--color-primary);
}
.nav-btn .icon{flex:0 0 auto}
.nav-btn .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-idx{
  margin-left:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;font-variant-numeric:tabular-nums;opacity:.72;
}
.side-foot{
  margin-top:auto;padding:16px 8px 2px;color:var(--muted);
  border-top:1px solid var(--line);font-size:12px;
}
.main{width:100%;max-width:1400px;min-width:0;margin:0 auto;padding:32px 34px 56px}
.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:20px;
}
.top h1{
  margin:0;font-family:"Cormorant Garamond","Crimson Pro",serif;
  font-size:34px;font-weight:700;line-height:1.08;letter-spacing:-.02em;
}
.top p{margin:6px 0 0;color:var(--muted);font-size:15px}
.pill,.tag{
  display:inline-flex;align-items:center;gap:6px;width:max-content;
  border:1px solid currentColor;font-weight:600;white-space:nowrap;
}
.pill{
  min-height:34px;padding:5px 11px;color:var(--color-primary);
  background:#EFF6FF;border-color:#BFDBFE;border-radius:7px;font-size:13px;
}
.pill .icon,.tag .icon{width:15px;height:15px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{
  min-width:0;padding:20px;background:var(--color-card);
  border:1px solid var(--color-border);border-radius:12px;
}
.card h3{
  margin:0 0 3px;font-family:"Cormorant Garamond","Crimson Pro",serif;
  font-size:20px;font-weight:700;line-height:1.2;
}
.card .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.card.rel{position:relative}
.kpi{
  position:relative;min-height:150px;display:flex;flex-direction:column;
  justify-content:space-between;gap:8px;border-top:4px solid var(--color-primary);
}
.kpi .kt{
  display:flex;align-items:center;gap:8px;padding-right:38px;
  color:var(--muted);font-size:14px;font-weight:600;
}
.kpi .kt .icon{width:18px;height:18px;color:var(--color-primary)}
.kpi .kv{
  font-family:"Cormorant Garamond","Crimson Pro",serif;font-size:38px;
  font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
}
.kpi .kv small{margin-left:5px;color:var(--muted);font-size:16px;font-weight:600}
.kpi .kd{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.kpi .kd .icon{width:15px;height:15px}
.kicon{
  position:absolute;top:18px;right:18px;width:34px;height:34px;
  display:grid;place-items:center;color:var(--color-primary);
  background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;
}
.kicon .icon{width:18px;height:18px}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--muted)}
.chart{width:100%;height:270px;min-width:0;overflow:hidden}
.hd{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:16px;
}
.hd h3{margin:0}
.seg{
  display:inline-flex;gap:2px;padding:3px;background:var(--color-muted);
  border:1px solid var(--line);border-radius:8px;
}
.seg span{padding:5px 12px;color:var(--muted);border-radius:5px;font-size:13px;font-weight:600}
.seg span.on{color:var(--color-on-primary);background:var(--color-primary)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
th{
  padding:11px 13px;color:#334155;background:var(--color-muted);
  border-bottom:1px solid var(--line);text-align:left;font-size:13px;font-weight:600;
  white-space:nowrap;
}
td{padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFF}
th:nth-child(n+3):not(:last-child),td:nth-child(n+3):not(:last-child){font-variant-numeric:tabular-nums}
.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.tag{padding:3px 8px;border-radius:6px;font-size:12px}
.t-ok{color:#166534;background:#F0FDF4;border-color:#86EFAC}
.t-warn{color:#854D0E;background:#FFFBEB;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEF2F2;border-color:#FCA5A5}
.t-info{color:#1E40AF;background:#EFF6FF;border-color:#93C5FD}
.t-mut{color:#475569;background:#F8FAFC;border-color:#CBD5E1}
.t-acc{color:#065F46;background:#ECFDF5;border-color:#6EE7B7}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:900px}
.col{min-width:0;padding:12px;background:var(--color-muted);border:1px solid var(--line);border-radius:10px}
.col-h{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;font-size:14px;font-weight:600;
}
.col-h .cnt{
  min-width:26px;padding:1px 7px;text-align:center;color:var(--muted);
  background:#fff;border:1px solid var(--line);border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
}
.tk{margin-bottom:9px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:8px}
.tk:last-child{margin-bottom:0}
.tk .tid{
  color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
}
.tk .tt{margin:7px 0 10px;font-size:14px;font-weight:600}
.tk .tm{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.tk .who{display:inline-flex;align-items:center;gap:6px}
.av{
  width:22px;height:22px;display:inline-grid;place-items:center;
  color:#fff;background:var(--color-primary);border-radius:50%;font-size:11px;font-weight:600;
}
.bar{display:block;height:9px;overflow:hidden;background:#E2E8F0;border-radius:3px}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.barrow{display:flex;align-items:center;gap:10px;margin:12px 0}
.barrow .bl{width:88px;flex:0 0 auto;color:var(--muted);font-size:13px;font-weight:600}
.barrow .bp{flex:1;min-width:0}
.barrow .bv{
  width:46px;text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:12px}
.legend i,.mini .md{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;top:5px;bottom:5px;left:9px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 20px}
.tl-i:last-child{padding-bottom:0}
.tl-i .dot{
  position:absolute;top:3px;left:-26px;width:16px;height:16px;
  background:#fff;border:3px solid var(--color-secondary);border-radius:50%;
}
.tl-i.done .dot{background:var(--color-primary);border-color:var(--color-primary)}
.tl-i .th{font-size:15px;font-weight:600}
.tl-i .ts{margin-top:2px;color:var(--muted);font-size:13px}
.tl-i .tw{
  margin-top:3px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;font-variant-numeric:tabular-nums;
}
.cmp{
  display:grid;grid-template-columns:1fr 1fr;min-width:0;overflow:hidden;
  border:1px solid var(--line);border-radius:9px;
}
.cmp>div+div{border-left:1px solid var(--line)}
.cmp .ch{
  padding:10px 12px;color:#334155;background:var(--color-muted);
  border-bottom:1px solid var(--line);font-size:13px;font-weight:600;
}
.cmp .cr{
  min-width:0;display:flex;justify-content:space-between;gap:8px;
  padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;
}
.cmp .cr:last-child{border-bottom:0}
.cmp .cr.diff{background:#FFF7ED;border-left:4px solid var(--warn)}
.cmp .lbl{flex:0 0 auto;color:var(--muted)}
.cmp .val{
  min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;
  font-weight:600;font-variant-numeric:tabular-nums;
}
.note{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
  color:#1E3A8A;background:#EFF6FF;border:1px solid #93C5FD;
  border-left:4px solid var(--color-primary);border-radius:8px;font-size:14px;
}
.note .icon{flex:0 0 auto;color:var(--color-primary)}
.mini{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini:last-child{border-bottom:0}
.mini b{font-variant-numeric:tabular-nums}
.grid-item{animation:enter .4s cubic-bezier(.2,.85,.3,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .side{
    position:sticky;width:100%;height:auto;min-height:0;padding:10px 14px;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .brand{padding:0 0 10px}
  .brand-logo{width:38px;height:38px;flex-basis:38px}
  .nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;overflow-x:auto}
  .nav-btn{min-width:48px;justify-content:center;padding:9px}
  .nav-btn .nl,.nav-idx{display:none}
  .side-foot{display:none}
  .main{padding:22px 18px 42px}
}
@media(max-width:768px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .top{align-items:flex-start}
  .top h1{font-size:30px}
}
@media(max-width:520px){
  .main{padding:18px 12px 36px}
  .top{display:block}
  .top .pill{margin-top:14px}
  .card{padding:16px}
  .cmp{grid-template-columns:1fr}
  .cmp>div+div{border-left:0;border-top:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo" id="brandIcon"></div>
      <div class="brand-txt"><b>OrderFlow</b><span>訂單管理平台</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="訂單管理模組"></nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br>v2026.08 · 無後端</div>
  </aside>
  <main class="main">
    <div class="top" id="top"></div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<script>
"use strict";
var ICONS={
dashboard:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
receipt_long:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
fact_check:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 2 2 4-4M15 10h3M7 16h11"/></svg>',
calendar_month:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>',
account_tree:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="6" height="5" rx="1"/><rect x="14" y="16" width="6" height="5" rx="1"/><rect x="4" y="16" width="6" height="5" rx="1"/><path d="M7 8v4h10v4M7 12v4"/></svg>',
inventory_2:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>',
verified:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.2 1.4 2.6-.2 1.2 2.3 2.3 1.2-.2 2.6 1.4 2.2-1.4 2.2.2 2.6-2.3 1.2-1.2 2.3-2.6-.2L12 22l-2.2-1.4-2.6.2L6 18.5l-2.3-1.2.2-2.6L2.5 12.5l1.4-2.2-.2-2.6L6 6.5l1.2-2.3 2.6.2L12 3Z"/><path d="m8.5 12.5 2.2 2.2 4.8-5"/></svg>',
warning:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.1 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
trending_up:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
trending_down:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>',
priority_high:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M12 19h.01"/></svg>',
remove:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>',
task_alt:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 1 1-5.3-8.2"/><path d="m9 11 3 3L22 4"/></svg>',
rule:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4M13 7h7M4 17l5-5M4 12l5 5M13 17h7"/></svg>',
history:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
factory:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l6 3V9l6 3V4h6v17H3Z"/><path d="M7 17h.01M11 17h.01M15 17h.01"/></svg>',
gavel:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6M12 6l6 6M4 20l8-8M2 22h8"/></svg>',
bolt:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h8l-1 8 9-12h-8l1-8Z"/></svg>',
info:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.info}
var MODS=[
 {icon:"dashboard",name:"訂單控制台",sub:"在製訂單、逾期風險與交期達成率總覽"},
 {icon:"fact_check",name:"客戶 PO 比對",sub:"PO 品項、數量、單價與系統訂單自動勾稽"},
 {icon:"calendar_month",name:"交期承諾",sub:"依產線負荷試算 ATP 可承諾交期"},
 {icon:"account_tree",name:"訂單變更管理",sub:"改量、改期、取消的簽核與版本追蹤"},
 {icon:"inventory_2",name:"出貨排程",sub:"分批出貨、揀貨與物流配送看板"},
 {icon:"receipt_long",name:"結案對帳",sub:"出貨對發票、應收帳款與交貨績效"}
];
var charts={};
var AX={color:"#475569",fontSize:12,fontFamily:"Crimson Pro"};
var GRID={left:8,right:16,top:30,bottom:8,containLabel:true};
function disposeAll(){Object.keys(charts).forEach(function(k){if(charts[k]){try{charts[k].dispose()}catch(e){}charts[k]=null}})}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts[id]=c}
function resizeAll(){Object.keys(charts).forEach(function(k){if(charts[k])charts[k].resize()})}
window.addEventListener("resize",resizeAll);
function statusIcon(c){return c==="up"?"trending_up":c==="down"?"priority_high":"remove"}
function kpi(t,v,u,d,c,ic){
 return '<div class="card rel kpi grid-item"><div class="kt">'+icon(ic)+t+'</div><div class="kv">'+v+'<small>'+u+'</small></div><div class="kd '+c+'">'+icon(statusIcon(c))+d+'</div><div class="kicon">'+icon(ic)+'</div></div>'
}
