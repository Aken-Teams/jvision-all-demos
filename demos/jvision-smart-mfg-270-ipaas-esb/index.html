<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>系統整合平台（iPaaS/ESB）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#ea580c; --accent2:#fb923c; --bg:#f5f4f2; --panel:#ffffff;
  --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --sidebar:#1c1512; --sidebar2:#2b211b;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
/* sidebar */
.sidebar{
  width:250px; background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#e7e5e4; flex-shrink:0; display:flex; flex-direction:column; padding:22px 16px;
  position:sticky; top:0; height:100vh; min-width:0;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(234,88,12,.4);}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;}
.brand p{font-size:11px;margin:2px 0 0;color:#a8a29e;}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:18px;}
.nav button{
  display:flex;align-items:center;gap:12px;background:transparent;border:none;color:#d6d3d1;
  padding:11px 13px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:14px;text-align:left;
  transition:background .15s,color .15s;min-width:0;
}
.nav button .material-symbols-outlined{font-size:21px;color:#a8a29e;flex-shrink:0;transition:color .15s;}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav button.active{background:linear-gradient(135deg,rgba(234,88,12,.95),rgba(251,146,60,.9));color:#fff;box-shadow:0 4px 14px rgba(234,88,12,.35);}
.nav button.active .material-symbols-outlined{color:#fff;}
.nav .idx{margin-left:auto;font-size:11px;font-weight:700;opacity:.55;}
.sidebar .foot{margin-top:auto;font-size:11px;color:#78716c;padding:14px 8px 2px;border-top:1px solid rgba(255,255,255,.08);}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1500px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.topbar .tt h2{margin:0;font-size:22px;font-weight:800;}
.topbar .tt p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--muted);font-weight:600;}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);}
/* grids */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 14px;}
/* kpi */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .val{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta.up{color:var(--ok);} .kpi .delta.down{color:var(--bad);}
.kpi .delta .material-symbols-outlined{font-size:15px;}
/* tables */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#faf9f8;}
.mono{font-family:"Inter",monospace;font-size:12px;color:var(--muted);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;} .t-info{background:#dbeafe;color:#1d4ed8;}
.t-mut{background:#f5f5f4;color:#57534e;} .t-acc{background:#ffedd5;color:#c2410c;}
.bar{height:7px;border-radius:6px;background:#f0eeec;overflow:hidden;min-width:60px;}
.bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
/* chart box */
.chart{width:100%;overflow:hidden;min-width:0;}
/* pipeline canvas (signature) */
.canvas{position:relative;overflow-x:auto;background:
  linear-gradient(#faf7f4 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,#faf7f4 1px,transparent 1px) 0 0/22px 22px,#fffdfb;
  border:1px dashed #e7d9cd;border-radius:14px;padding:20px;}
.flowrow{display:flex;align-items:stretch;gap:0;min-width:660px;}
.node{flex:1;min-width:120px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.05);}
.node .nh{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;}
.node .nh .material-symbols-outlined{font-size:18px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;padding:4px;}
.node .nd{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}
.node .nmeta{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;}
.conn{display:flex;align-items:center;justify-content:center;width:34px;flex-shrink:0;color:var(--accent);}
.conn .material-symbols-outlined{font-size:22px;}
/* mapping */
.map-grid{display:grid;grid-template-columns:1fr 44px 1fr;gap:10px;align-items:center;}
.field{background:#faf9f8;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;}
.field .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.field .ft{font-size:10px;color:var(--muted);font-family:monospace;flex-shrink:0;}
.map-arrow{display:flex;align-items:center;justify-content:center;color:var(--accent);}
.map-arrow .material-symbols-outlined{font-size:20px;}
.xform{font-size:9.5px;text-align:center;color:var(--accent);font-weight:700;margin-top:-4px;}
/* timeline */
.tl{position:relative;padding-left:8px;}
.tl .ev{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.tl .ev:not(:last-child)::before{content:"";position:absolute;left:9px;top:20px;bottom:-2px;width:2px;background:var(--line);}
.tl .dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;z-index:1;}
.tl .dot .material-symbols-outlined{font-size:13px;}
.tl .body{flex:1;min-width:0;}
.tl .body .th{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;}
.tl .body .tm{font-size:11px;color:var(--muted);font-family:monospace;}
.tl .body .tx{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
/* legend / misc */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.statline{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line);}
.statline:last-child{border-bottom:none;}
.statline b{font-weight:700;}
.hbtn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;cursor:default;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.hbtn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);}
.grow{display:flex;gap:8px;flex-wrap:wrap;}
/* responsive */
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr);}.g23,.g32{grid-template-columns:1fr;}}
@media(max-width:820px){.g3,.g2,.g4{grid-template-columns:1fr;}.map-grid{grid-template-columns:1fr;}.map-arrow{transform:rotate(90deg);}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;height:auto;position:relative;top:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:8px;}
  .brand{border-bottom:none;padding:0;flex:1;min-width:200px;}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;width:100%;gap:6px;}
  .nav button{flex:1;justify-content:center;min-width:0;padding:9px 10px;}
  .nav .idx{display:none;}
  .sidebar .foot{display:none;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:560px){
  .nav button .navtxt{display:none;}
  .nav button{flex:0 0 auto;padding:9px;}
  .topbar .tt h2{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div><h1>iPaaS / ESB</h1><p>系統整合平台</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">整合中樞 · v2.7 · 環境：PROD<br/>© 2026 JVision Integration</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scr-title">—</h2>
        <p id="scr-sub">—</p>
      </div>
      <div class="grow">
        <span class="pill"><span class="dot"></span> 匯流列即時運行</span>
        <span class="pill"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">bolt</span> 42 條整合流程</span>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"account_tree",name:"介接需求管理",sub:"端點盤點與介接需求登錄"},
  {icon:"build",name:"流程編排",sub:"整合流程視覺化編排畫布"},
  {icon:"rule",name:"格式對應",sub:"資料格式轉換與欄位對應"},
  {icon:"fact_check",name:"測試驗證",sub:"介接測試案例與資料驗證"},
  {icon:"monitoring",name:"上線監控",sub:"訊息吞吐、延遲與成功率"},
  {icon:"history",name:"異常重送",sub:"失敗重送、死信與版本管理"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function tag(cls,txt,ic){return '<span class="tag '+cls+'">'+(ic?'<span class="material-symbols-outlined" style="font-size:13px">'+ic+'</span>':'')+txt+'</span>';}
function bar(pct){return '<div class="bar"><span style="width:'+pct+'%"></span></div>';}

/* ---------- SCREEN 0 : 介接需求管理 ---------- */
function s0(){
  var kpis=[
    {l:"已登錄介接需求",v:"128",u:"件",d:"+9",up:true,ic:"assignment"},
    {l:"待評估端點",v:"17",u:"個",d:"-4",up:true,ic:"lan"},
    {l:"平均上線前置",v:"6.4",u:"天",d:"-1.8",up:true,ic:"timer"},
    {l:"高優先需求",v:"5",u:"件",d:"+2",up:false,ic:"priority_high"}
  ];
  var reqs=[
    {id:"REQ-2401",src:"ERP-財務",dst:"WMS 倉儲",proto:"REST / JSON",pri:"高",freq:"即時",st:"評估中",tone:"t-warn"},
    {id:"REQ-2402",src:"MES 產線",dst:"BI 分析湖",proto:"Kafka",pri:"高",freq:"串流",st:"已核准",tone:"t-ok"},
    {id:"REQ-2403",src:"電商平台",dst:"ERP-訂單",proto:"REST / JSON",pri:"中",freq:"5 分批",st:"已核准",tone:"t-ok"},
    {id:"REQ-2404",src:"HR 系統",dst:"AD 目錄",proto:"SOAP / XML",pri:"低",freq:"每日",st:"排程中",tone:"t-info"},
    {id:"REQ-2405",src:"物流 TMS",dst:"WMS 倉儲",proto:"SFTP / CSV",pri:"中",freq:"每時",st:"評估中",tone:"t-warn"},
    {id:"REQ-2406",src:"CRM",dst:"客服工單",proto:"Webhook",pri:"高",freq:"事件",st:"待補件",tone:"t-bad"}
  ];
  var trows=reqs.map(function(r){
    return '<tr><td class="mono">'+r.id+'</td><td><b>'+r.src+'</b></td>'
      +'<td style="color:var(--accent)"><span class="material-symbols-outlined" style="font-size:15px">east</span> '+r.dst+'</td>'
      +'<td>'+tag('t-mut',r.proto)+'</td>'
      +'<td>'+tag(r.pri==='高'?'t-acc':(r.pri==='中'?'t-info':'t-mut'),r.pri)+'</td>'
      +'<td class="mono">'+r.freq+'</td>'
      +'<td>'+tag(r.tone,r.st)+'</td></tr>';
  }).join('');
  var endpoints=[
    {n:"ERP",pct:96,c:"var(--ok)"},{n:"MES",pct:88,c:"var(--ok)"},
    {n:"WMS",pct:74,c:"var(--warn)"},{n:"CRM",pct:61,c:"var(--warn)"},
    {n:"電商",pct:45,c:"var(--bad)"}
  ];
  var html=''
   +'<div class="grid g4">'+kpis.map(function(k){
      return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div>'
        +'<div class="val">'+k.v+'<small>'+k.u+'</small></div>'
        +'<div class="delta '+(k.up?'up':'down')+'"><span class="material-symbols-outlined">'+(k.up?'trending_up':'trending_down')+'</span>'+k.d+' 週變化</div></div>';
     }).join('')+'</div>'
   +'<div class="grid g32" style="margin-top:16px">'
     +'<div class="card"><h3><span class="material-symbols-outlined">assignment</span>介接需求清單</h3>'
       +'<p class="sub">各業務系統負責人提出的介接需求與評估狀態</p>'
       +'<div class="tbl-wrap"><table><thead><tr><th>需求編號</th><th>來源系統</th><th>目標系統</th><th>協定</th><th>優先</th><th>頻率</th><th>狀態</th></tr></thead><tbody>'+trows+'</tbody></table></div></div>'
     +'<div class="card"><h3><span class="material-symbols-outlined">hub</span>端點就緒度</h3>'
       +'<p class="sub">各業務系統可介接程度盤點</p>'
       +endpoints.map(function(e){
          return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px"><span>'+e.n+'</span><span style="color:'+e.c+'">'+e.pct+'%</span></div>'
            +'<div class="bar"><span style="width:'+e.pct+'%;background:'+e.c+'"></span></div></div>';
        }).join('')
       +'<div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)">'
       +'<div class="statline"><span>本季目標介接數</span><b>36 條</b></div>'
       +'<div class="statline"><span>已排入路線圖</span><b>28 條</b></div>'
       +'<div class="statline"><span>待補技術文件</span><b style="color:var(--bad)">4 件</b></div>'
       +'</div></div>'
   +'</div>';
  return html;
}

/* ---------- SCREEN 1 : 流程編排 ---------- */
function s1(){
  var nodes=[
    {ic:"input",n:"觸發器",d:"ERP 訂單建立 Webhook"},
    {ic:"filter_alt",n:"路由過濾",d:"依訂單金額與地區分流"},
    {ic:"rule",n:"資料轉換",d:"套用對應規則 MAP-07"},
    {ic:"call_split",n:"多目標分派",d:"WMS + BI + 通知服務"},
    {ic:"task_alt",n:"確認回寫",d:"回寫整合狀態至 ERP"}
  ];
  var flow='<div class="canvas"><div class="flowrow">';
  nodes.forEach(function(nd,i){
    flow+='<div class="node"><div class="nh"><span class="material-symbols-outlined">'+nd.ic+'</span>'+nd.n+'</div>'
      +'<div class="nd">'+nd.d+'</div>'
      +'<div class="nmeta">'+tag('t-ok','啟用','check')+tag('t-mut','#'+(i+1))+'</div></div>';
    if(i<nodes.length-1)flow+='<div class="conn"><span class="material-symbols-outlined">trending_flat</span></div>';
  });
  flow+='</div></div>';
  var flows=[
    {n:"ERP→WMS 出貨同步",trig:"事件",steps:6,st:"執行中",tone:"t-ok",ver:"v14"},
    {n:"MES 產量串流",trig:"串流",steps:4,st:"執行中",tone:"t-ok",ver:"v8"},
    {n:"電商訂單匯入",trig:"排程 5m",steps:7,st:"執行中",tone:"t-ok",ver:"v22"},
    {n:"HR 帳號同步",trig:"排程 日",steps:5,st:"暫停",tone:"t-warn",ver:"v3"},
    {n:"CRM 客訴分派",trig:"事件",steps:3,st:"草稿",tone:"t-mut",ver:"v1"}
  ];
  var frows=flows.map(function(f){
    return '<tr><td><b>'+f.n+'</b></td><td>'+tag('t-info',f.trig)+'</td><td class="mono">'+f.steps+' 節點</td>'
      +'<td class="mono">'+f.ver+'</td><td>'+tag(f.tone,f.st)+'</td></tr>';
  }).join('');
  var html=''
   +'<div class="card"><h3><span class="material-symbols-outlined">build</span>整合流程編排畫布 · ERP 訂單自動出貨</h3>'
     +'<p class="sub">拖拉節點串接觸發、路由、轉換與分派，無需點對點程式碼</p>'+flow
     +'<div class="legend"><span><i style="background:var(--accent)"></i>資料流向</span><span><i style="background:var(--ok)"></i>節點啟用</span><span><i style="background:var(--line)"></i>可拖拉插入</span></div></div>'
   +'<div class="grid g2" style="margin-top:16px">'
     +'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>整合流程清單</h3><p class="sub">已編排的流程與其觸發模式</p>'
       +'<div class="tbl-wrap"><table><thead><tr><th>流程名稱</th><th>觸發</th><th>節點數</th><th>版本</th><th>狀態</th></tr></thead><tbody>'+frows+'</tbody></table></div></div>'
     +'<div class="card"><h3><span class="material-symbols-outlined">category</span>節點類型使用分佈</h3><p class="sub">全平台流程中各節點類型使用次數</p>'
       +'<div class="chart" id="c1a"></div></div>'
   +'</div>';

var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[null,init1,init2,init3,init4,null];
var cur=-1;
function buildNav(){
  var nav=el("nav");var h='';
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'
      +'<span class="navtxt">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
}
function show(i){
  if(i<0)i=0; if(i>MODS.length-1)i=MODS.length-1;
  cur=i;
  destroyCharts();
  var c=el("screen");
  c.innerHTML=RENDER[i]();
  el("scr-title").textContent=MODS[i].name;
  el("scr-sub").textContent=MODS[i].sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    if(+btns[k].getAttribute("data-i")===i)btns[k].classList.add("active");
    else btns[k].classList.remove("active");
  }
  void c.offsetHeight;
  if(INIT[i])INIT[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
