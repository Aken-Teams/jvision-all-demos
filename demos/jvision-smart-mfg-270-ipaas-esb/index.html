<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業系統資料串接平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;

  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#cbd5e1;

  --accent:#ea580c;
  --accent2:#3b82f6;
  --bg:#f8fafc;
  --panel:#ffffff;
  --sidebar:#0f172a;
  --sidebar2:#172554;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --black:#0f172a;
  --shadow:6px 6px 0 #0f172a;
  --shadow-sm:3px 3px 0 #0f172a;
}

*{box-sizing:border-box;}
html{scroll-behavior:auto;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  overflow-x:hidden;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(37,99,235,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.08) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-accent);color:var(--color-on-accent);}
.material-symbols-outlined{
  display:inline-block;
  direction:ltr;
  font-family:"Material Symbols Outlined";
  font-size:1.25em;
  font-style:normal;
  font-weight:500;
  letter-spacing:normal;
  line-height:1;
  text-transform:none;
  vertical-align:middle;
  white-space:nowrap;
}

.app{display:flex;min-height:100vh;}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  width:272px;
  height:100vh;
  min-width:0;
  flex-shrink:0;
  flex-direction:column;
  padding:0;
  overflow:hidden;
  background:var(--sidebar);
  color:#f8fafc;
  border-right:4px solid var(--black);
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-height:108px;
  padding:20px;
  background:var(--color-primary);
  border-bottom:4px solid var(--black);
}
.brand .logo{
  display:flex;
  width:52px;
  height:52px;
  flex-shrink:0;
  align-items:center;
  justify-content:center;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:3px solid var(--black);
  border-radius:0;
  box-shadow:4px 4px 0 var(--black);
}
.brand .logo .material-symbols-outlined{font-size:28px;font-weight:700;}
.brand h1{
  margin:0;
  font-family:"Outfit",sans-serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.05;
}
.brand p{margin:6px 0 0;color:#dbeafe;font-size:12px;font-weight:600;letter-spacing:.08em;}
.nav{display:flex;flex-direction:column;gap:0;margin-top:0;}
.nav button{
  position:relative;
  display:flex;
  min-width:0;
  min-height:56px;
  align-items:center;
  gap:12px;
  padding:13px 17px;
  background:transparent;
  color:#cbd5e1;
  border:0;
  border-bottom:1px solid #334155;
  border-radius:0;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.nav button .material-symbols-outlined{flex-shrink:0;color:#93c5fd;font-size:22px;}
.nav button:hover{background:#1e3a8a;color:#fff;transform:translateX(4px);}
.nav button.active{
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:inset -8px 0 0 var(--black);
}
.nav button.active::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:5px;
  height:100%;
  background:var(--black);
}
.nav button.active .material-symbols-outlined{color:var(--black);font-weight:700;}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Work Sans",monospace;
  font-size:11px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  opacity:.8;
}
.sidebar .foot{
  margin-top:auto;
  padding:18px 20px;
  background:#020617;
  color:#94a3b8;
  border-top:3px solid #334155;
  font-family:"Work Sans",monospace;
  font-size:10px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
  line-height:1.7;
}

.main{width:100%;max-width:1600px;min-width:0;flex:1;padding:34px 38px 72px;}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin:0 0 28px;
  padding:0 0 20px;
  border-bottom:4px solid var(--black);
}
.topbar::after{
  content:"LIVE / PROD";
  position:absolute;
  right:0;
  bottom:-4px;
  padding:3px 10px;
  background:var(--black);
  color:#fff;
  font-family:"Work Sans",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
}
.topbar .tt{max-width:680px;}
.topbar .tt h2{
  margin:0;
  color:var(--black);
  font-family:"Outfit",sans-serif;
  font-size:clamp(30px,4vw,54px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:.96;
}
.topbar .tt p{margin:12px 0 0;color:var(--muted);font-size:14px;font-weight:600;}
.grow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.pill{
  display:inline-flex;
  min-height:40px;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  background:var(--color-card);
  color:var(--color-foreground);
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:3px 3px 0 var(--black);
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
}
.pill .dot{
  width:10px;
  height:10px;
  background:var(--ok);
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:none;
}

#screen>*,.grid-item{animation:brutal-in .4s cubic-bezier(.34,1.56,.64,1) both;}
#screen>*:nth-child(2){animation-delay:.06s;}
#screen>*:nth-child(3){animation-delay:.12s;}
@keyframes brutal-in{
  from{opacity:0;transform:translateY(16px) scale(.96);}
  to{opacity:1;transform:none;}
}
.grid{display:grid;gap:18px;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);}
.card{
  min-width:0;
  padding:22px;
  overflow:hidden;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:3px solid var(--black);
  border-radius:0;
  box-shadow:var(--shadow);
}
.card:nth-child(even){box-shadow:-5px 5px 0 var(--color-primary);}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 5px;
  color:var(--black);
  font-family:"Outfit",sans-serif;
  font-size:18px;
  font-weight:700;
  line-height:1.2;
}
.card h3 .material-symbols-outlined{
  display:inline-flex;
  width:30px;
  height:30px;
  flex-shrink:0;
  align-items:center;
  justify-content:center;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border:2px solid var(--black);
  font-size:18px;
}
.card .sub{margin:0 0 20px;color:var(--muted);font-size:12px;font-weight:500;}

.kpi{
  position:relative;
  min-width:0;
  min-height:156px;
  padding:19px 18px 18px;
  overflow:hidden;
  background:var(--color-card);
  border:3px solid var(--black);
  border-radius:0;
  box-shadow:var(--shadow-sm);
}
.kpi:nth-child(2n){background:var(--color-muted);}
.kpi:nth-child(3){box-shadow:5px 5px 0 var(--color-primary);}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:8px;
  background:var(--color-primary);
  border-bottom:2px solid var(--black);
}
.kpi:nth-child(4)::before{background:var(--color-accent);}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.03em;
}
.kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:19px;font-weight:700;}
.kpi .val{
  margin-top:12px;
  color:var(--black);
  font-family:"Outfit",sans-serif;
  font-size:38px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.04em;
  line-height:1;
}
.kpi .val small{margin-left:5px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:0;}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:10px;
  padding:2px 5px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.kpi .delta.up{color:var(--ok);}
.kpi .delta.down{color:var(--bad);}
.kpi .delta .material-symbols-outlined{font-size:15px;}

.tbl-wrap{width:100%;overflow-x:auto;border:2px solid var(--black);}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
th{
  padding:11px 12px;
  background:var(--black);
  color:#fff;
  border-right:1px solid #475569;
  border-bottom:3px solid var(--color-primary);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:last-child{border-right:0;}
td{
  padding:12px;
  background:#fff;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td:last-child{border-right:0;}
tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even) td{background:#f1f5f9;}
tbody tr:hover td{background:#dbeafe;}
td.mono{text-align:right;}
.mono,.ft,.tm{
  font-family:"Work Sans","SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.mono{color:#334155;font-size:12px;white-space:nowrap;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.25;
  white-space:nowrap;
}
.t-ok{background:#dcfce7;color:#166534;}
.t-warn{background:#fef3c7;color:#92400e;}
.t-bad{background:#fee2e2;color:#991b1b;}
.t-info{background:#dbeafe;color:#1e40af;}
.t-mut{background:#f1f5f9;color:#334155;}
.t-acc{background:#ffedd5;color:#9a3412;}
.bar{height:10px;min-width:60px;overflow:hidden;background:#e2e8f0;border:1px solid var(--black);border-radius:0;}
.bar span{display:block;height:100%;background:var(--color-primary);border-right:1px solid var(--black);border-radius:0;}
.chart{width:100%;min-width:0;overflow:hidden;}

.canvas{
  position:relative;
  padding:22px;
  overflow-x:auto;
  background-color:#f8fafc;
  background-image:
    linear-gradient(rgba(37,99,235,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.16) 1px,transparent 1px);
  background-size:22px 22px;
  border:3px solid var(--black);
  border-radius:0;
}
.flowrow{display:flex;min-width:760px;align-items:stretch;gap:0;}
.node{
  position:relative;
  min-width:130px;
  flex:1;
  padding:14px;
  background:#fff;
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:4px 4px 0 var(--color-primary);
}
.node:nth-child(4n+1){transform:translateY(-3px);}
.node .nh{display:flex;align-items:center;gap:7px;color:var(--black);font-family:"Outfit",sans-serif;font-size:13px;font-weight:700;}
.node .nh .material-symbols-outlined{
  padding:5px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:2px solid var(--black);
  border-radius:0;
  font-size:17px;
}
.node .nd{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.5;}
.node .nmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.conn{display:flex;width:38px;flex-shrink:0;align-items:center;justify-content:center;color:var(--color-primary);}
.conn .material-symbols-outlined{font-size:25px;font-weight:700;}

.map-grid{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:9px;align-items:center;}
.field{
  display:flex;
  min-width:0;
  min-height:45px;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px 11px;
  background:#f8fafc;
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:2px 2px 0 var(--line);
  font-size:12px;
}
.field .fn{overflow:hidden;font-weight:700;text-overflow:ellipsis;white-space:nowrap;}
.field .ft{flex-shrink:0;color:var(--muted);font-size:10px;}
.map-arrow{display:flex;align-items:center;justify-content:center;color:var(--color-primary);}
.map-arrow .material-symbols-outlined{font-size:23px;font-weight:700;}
.xform{margin-top:-2px;color:#9a3412;font-size:9px;font-weight:700;text-align:center;}

.tl{position:relative;padding-left:4px;}
.tl .ev{position:relative;display:flex;gap:13px;padding-bottom:18px;}
.tl .ev:not(:last-child)::before{
  content:"";
  position:absolute;
  top:22px;
  bottom:-1px;
  left:10px;
  width:3px;
  background:var(--black);
}
.tl .dot{
  z-index:1;
  display:flex;
  width:23px;
  height:23px;
  flex-shrink:0;
  align-items:center;
  justify-content:center;
  color:#fff;
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:2px 2px 0 var(--black);
}
.tl .dot .material-symbols-outlined{font-size:13px;}
.tl .body{min-width:0;flex:1;}
.tl .body .th{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--black);font-size:13px;font-weight:700;}
.tl .body .tm{color:var(--muted);font-size:10px;}
.tl .body .tx{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5;}

.legend{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:15px;color:var(--muted);font-size:11px;font-weight:600;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--black);border-radius:0;}
.statline{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:2px dotted var(--line);font-size:12px;}
.statline:last-child{border-bottom:0;}
.statline b{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
.hbtn{
  display:inline-flex;
  min-height:34px;
  align-items:center;
  gap:5px;
  padding:6px 11px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:2px 2px 0 var(--black);
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.hbtn.ghost{background:#fff;color:#9a3412;border-color:var(--black);}
.hbtn:hover{transform:translate(2px,2px);box-shadow:0 0 0 var(--black);}

@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:900px){
  .app{flex-direction:column;}
  .sidebar{
    position:relative;
    width:auto;
    height:auto;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:stretch;
    border-right:0;
    border-bottom:4px solid var(--black);
  }
  .brand{min-width:230px;min-height:82px;flex:1;padding:13px 16px;border-bottom:0;border-right:3px solid var(--black);}
  .brand .logo{width:44px;height:44px;}
  .nav{display:grid;width:100%;grid-template-columns:repeat(6,minmax(0,1fr));border-top:3px solid var(--black);}
  .nav button{min-height:52px;justify-content:center;padding:9px;border-right:1px solid #334155;border-bottom:0;}
  .nav button:hover{transform:translateY(-2px);}
  .nav .idx,.sidebar .foot{display:none;}
  .main{padding:25px 20px 54px;}
}
@media(max-width:768px){
  .g2,.g3{grid-template-columns:1fr;}
  .topbar{align-items:flex-start;flex-direction:column;padding-bottom:24px;}
  .topbar::after{right:auto;left:0;}
  .grow{justify-content:flex-start;}
  .map-grid{grid-template-columns:1fr;}
  .map-arrow{min-height:34px;transform:rotate(90deg);}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .brand h1{font-size:16px;}
  .brand p{font-size:10px;}
  .nav{grid-template-columns:repeat(6,1fr);}
  .nav button{min-width:0;min-height:48px;padding:8px 4px;}
  .nav button .material-symbols-outlined{font-size:20px;}
  .nav button .navtxt{display:none;}
  .main{padding:20px 13px 48px;}
  .topbar .tt h2{font-size:32px;}
  .pill{min-height:36px;padding:6px 9px;font-size:10px;}
  .g4{grid-template-columns:1fr;}
  .grid{gap:14px;}
  .card{padding:16px;box-shadow:4px 4px 0 var(--black);}
  .card h3{font-size:16px;}
  .kpi{min-height:132px;}
  .kpi .val{font-size:34px;}
  td,th{padding:10px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #screen>*,.grid-item{opacity:1!important;transform:none!important;animation:none!important;}
  .nav button:hover,.hbtn:hover,.node:nth-child(4n+1){transform:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div><h1>iPaaS / ESB</h1><p>系統整合平台</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">整合中樞 · v2.7 · 環境：PROD<br/>© 2026 JVision Integration</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scr-title">—</h2>
        <p id="scr-sub">—</p>
      </div>
      <div class="grow">
        <span class="pill"><span class="dot"></span> 匯流列即時運行</span>
        <span class="pill"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">bolt</span> 42 條整合流程</span>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"account_tree",name:"介接需求管理",sub:"端點盤點與介接需求登錄"},
  {icon:"build",name:"流程編排",sub:"整合流程視覺化編排畫布"},

    {id:"MSG-7c04",flow:"ERP→WMS",err:"連線中斷",rt:"2/5",st:"重試中",tone:"t-warn"},
    {id:"MSG-6a88",flow:"MES 串流",err:"格式解析錯誤",rt:"5/5",st:"進入死信",tone:"t-bad"},

  ];
  var drows=dlq.map(function(d){
    return '<tr><td class="mono">'+d.id+'</td><td>'+d.flow+'</td><td>'+tag('t-mut',d.err)+'</td>'
      +'<td class="mono">'+d.rt+'</td><td>'+tag(d.tone,d.st)+'</td>'
      +'<td><span class="hbtn ghost"><span class="material-symbols-outlined" style="font-size:14px">replay</span>重送</span></td></tr>';
  }).join('');
  var tl=[
    {t:"14:32",n:"版本 v22 上線",d:"電商訂單匯入流程更新對應規則 MAP-07",c:"var(--accent)",ic:"rocket_launch"},
    {t:"13:58",n:"批次重送 42 筆",d:"ERP→WMS 連線恢復後自動重送，全部成功",c:"var(--ok)",ic:"replay"},

    {t:"09:05",n:"回滾至 v21",d:"HR 帳號同步流程異常，已回滾至前一穩定版本",c:"var(--warn)",ic:"undo"},
    {t:"08:12",n:"版本 v14 上線",d:"MES 產量串流節點調整完成",c:"var(--info)",ic:"rocket_launch"}
  ];
  var tlHtml='<div class="tl">'+tl.map(function(e){
    return '<div class="ev"><div class="dot" style="background:'+e.c+'"><span class="material-symbols-outlined">'+e.ic+'</span></div>'
      +'<div class="body"><div class="th"><span>'+e.n+'</span><span class="tm">'+e.t+'</span></div><div class="tx">'+e.d+'</div></div></div>';
  }).join('')+'</div>';
  var html=''
   +'<div class="grid g4">'+kpis.map(function(k){
      return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div>'
        +'<div class="val" '+(k.tone?'style="color:'+k.tone+'"':'')+'>'+k.v+'<small>'+k.u+'</small></div></div>';
     }).join('')+'</div>'
   +'<div class="grid g23" style="margin-top:16px">'
     +'<div class="card"><h3><span class="material-symbols-outlined">report</span>死信佇列 (DLQ) 與重送</h3>'
       +'<p class="sub">失敗訊息、重試次數與人工重送</p>'
       +'<div class="tbl-wrap"><table><thead><tr><th>訊息 ID</th><th>來源流程</th><th>錯誤</th><th>重試</th><th>狀態</th><th></th></tr></thead><tbody>'+drows+'</tbody></table></div></div>'
     +'<div class="card"><h3><span class="material-symbols-outlined">history</span>變更版本與事件時間軸</h3><p class="sub">整合流程上線、回滾與重送紀錄</p>'+tlHtml+'</div>'
   +'</div>';

}

var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[null,init1,init2,init3,init4,null];
var cur=-1;
function buildNav(){
  var nav=el("nav");var h='';
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'
      +'<span class="navtxt">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
}
function show(i){
  if(i<0)i=0; if(i>MODS.length-1)i=MODS.length-1;
  cur=i;
  destroyCharts();
  var c=el("screen");
  c.innerHTML=RENDER[i]();
  el("scr-title").textContent=MODS[i].name;
  el("scr-sub").textContent=MODS[i].sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    if(+btns[k].getAttribute("data-i")===i)btns[k].classList.add("active");
    else btns[k].classList.remove("active");
  }
  void c.offsetHeight;
  if(INIT[i])INIT[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
