<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>量具校驗管理 Gauge / Calibration Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#047857;
  --warn:#A13C00;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow:0 8px 24px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-width:0;background:var(--color-background);color:var(--ink)}
body{overflow-x:hidden;font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.ms{
  font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;
  font-size:20px;line-height:1;vertical-align:middle
}
.mono,.kpi .val,.tk .id,.cell .d{
  font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums
}
.nav{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;
  min-height:66px;padding:10px max(16px,calc((100vw - 1440px)/2));
  background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(15,23,42,.05);backdrop-filter:blur(12px)
}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.logo{
  width:38px;height:38px;display:grid;place-items:center;flex:none;
  color:var(--color-on-primary);background:var(--blue);border-radius:6px;
  box-shadow:4px 4px 0 #BFDBFE
}
.brand b{display:block;font-size:15px;line-height:1.15;letter-spacing:.02em}
.brand span:not(.ms){display:block;margin-top:3px;color:var(--muted);font-size:11px}
.navbtns{display:flex;align-items:center;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.navbtns::-webkit-scrollbar{display:none}
.navbtns button{
  display:flex;align-items:center;gap:7px;min-height:40px;padding:8px 11px;
  flex:none;border:1px solid transparent;border-radius:5px;background:transparent;
  color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease
}
.navbtns button:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
.navbtns button.on{
  color:var(--color-on-primary);background:var(--blue);border-color:var(--blue);
  box-shadow:0 4px 12px rgba(37,99,235,.2)
}
.navbtns button:active{transform:translateY(1px)}
.navmeta{
  display:flex;align-items:center;gap:7px;flex:none;color:var(--muted);
  font-size:11px;font-weight:600;white-space:nowrap
}
.dot{
  width:9px;height:9px;border:2px solid #A7F3D0;border-radius:50%;background:var(--ok)
}
.wrap{width:min(100%,1440px);margin:auto;padding:22px 18px 52px}
.head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin-bottom:16px;padding:18px 20px;border:1px solid #BFDBFE;
  border-left:5px solid var(--blue);border-radius:6px;background:var(--color-card);
  box-shadow:var(--shadow)
}
.head h1{margin:0;font-size:clamp(21px,2.2vw,29px);line-height:1.12;letter-spacing:-.025em}
.head p{max-width:760px;margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.tag{
  flex:none;padding:7px 11px;border:1px solid #FDBA74;border-radius:4px;
  color:#9A3412;background:#FFF7ED;font:600 11px "Fira Code",monospace
}
.g{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2u{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2v{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.card,.kpi{
  min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--color-card);
  box-shadow:0 2px 8px rgba(15,23,42,.04);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease
}
.card:hover,.kpi:hover{border-color:#CBD5E1;box-shadow:var(--shadow);transform:translateY(-1px)}
.card{padding:15px}
.card h3{
  display:flex;align-items:center;gap:8px;margin:0 0 3px;
  color:var(--ink);font-size:14px;font-weight:700
}
.card h3 .ms{color:var(--blue)}
.card .sub{margin-bottom:11px;color:var(--muted);font-size:11.5px;line-height:1.5}
.kpi{position:relative;overflow:hidden;padding:14px 15px;border-top:3px solid var(--blue)}
.kpi::after{
  content:"";position:absolute;right:-22px;bottom:-28px;width:84px;height:84px;
  border-radius:50%;background:#EFF6FF
}
.kpi .lab{
  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  color:var(--muted);font-size:11.5px;font-weight:600
}
.kpi .lab .ms{color:var(--blue);font-size:17px}
.kpi .val{
  position:relative;z-index:1;margin-top:8px;font-size:25px;font-weight:700;
  line-height:1.1;letter-spacing:-.04em
}
.kpi .val small{margin-left:5px;color:var(--muted);font:600 12px "Fira Sans",sans-serif}
.kpi .delta{position:relative;z-index:1;margin-top:7px;font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.warn{color:var(--warn)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  text-align:left;color:#334155;background:#F1F5F9;font-size:10.5px;font-weight:700;
  letter-spacing:.045em;text-transform:uppercase
}
td{color:#334155}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FAFC}
td:nth-last-child(n+2){font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid;
  border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.25
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:#065F46;background:#ECFDF5;border-color:#A7F3D0}
.p-warn{color:#92400E;background:#FFFBEB;border-color:#FCD34D}
.p-bad{color:#991B1B;background:#FEF2F2;border-color:#FCA5A5}
.p-info{color:#1E40AF;background:#EFF6FF;border-color:#93C5FD}
.p-mut{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{padding:4px;color:var(--muted);font-size:10.5px;font-weight:700;text-align:center}
.cell{
  display:flex;flex-direction:column;gap:4px;min-height:72px;padding:6px;
  border:1px solid var(--line);border-radius:4px;background:#FFF
}
.cell .d{color:var(--muted);font-size:10.5px;font-weight:600}
.cell.today{border:2px solid var(--blue);background:#EFF6FF}
.ev{
  overflow:hidden;padding:3px 5px;border-left:3px solid;border-radius:2px;
  font-size:9.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap
}
.ev.due{color:#854D0E;background:#FEFCE8;border-color:#CA8A04}
.ev.over{color:#991B1B;background:#FEF2F2;border-color:#DC2626}
.ev.done{color:#065F46;background:#ECFDF5;border-color:#059669}
.ev.ext{color:#1E40AF;background:#EFF6FF;border-color:#2563EB}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px;color:var(--muted);font-size:10.5px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.col{min-width:0;padding:9px;border:1px solid var(--line);border-radius:5px;background:#F8FAFC}
.col h4{display:flex;justify-content:space-between;gap:8px;margin:0 0 9px;font-size:11.5px}
.cnt{padding:1px 7px;border-radius:999px;color:#334155;background:#E2E8F0;font:600 10px "Fira Code",monospace}
.tk{margin-bottom:7px;padding:8px;border:1px solid var(--line);border-radius:4px;background:#FFF}
.tk:last-child{margin-bottom:0}
.tk .id{color:var(--blue);font-size:10px;font-weight:700}
.tk .nm{margin:3px 0 5px;font-size:11.5px;font-weight:600}
.tk .mt{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:#BFDBFE}
.tl .it{position:relative;padding:0 0 15px 8px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";position:absolute;top:3px;left:-20px;width:10px;height:10px;
  border:3px solid #DBEAFE;border-radius:50%;background:var(--blue)
}
.tl .t{font-size:12px;font-weight:700}.tl .m{margin-top:2px;color:var(--muted);font-size:11px}
.lab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cert{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#FFF}
.cert .top{
  display:flex;align-items:center;justify-content:space-between;padding:11px 13px;
  border-bottom:1px dashed #93C5FD;background:#EFF6FF
}
.cert .top b{color:#1E40AF;font-size:12px}
.cert .body{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:11px 13px}
.cert .f{min-width:0}.cert label{display:block;margin-bottom:2px;color:var(--muted);font-size:9.5px}
.cert .f span{font-size:11.5px;font-weight:600}
.qr{
  width:44px;height:44px;flex:none;border:3px solid #1E3A8A;border-radius:2px;
  background:conic-gradient(#1E3A8A 25%,#FFF 0 50%,#2563EB 0 75%,#FFF 0);
  background-size:11px 11px
}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:11.5px
}
.stat-row:last-child{border-bottom:0}
.chip{
  display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 9px;
  border:1px solid #FDBA74;border-radius:4px;color:#9A3412;background:#FFF7ED;
  font-size:11px;font-weight:600
}
.chip .ms{color:var(--color-accent);font-size:16px}
.foot{margin-top:26px;color:var(--muted);font-size:10.5px;text-align:center}
.reveal{animation:reveal .36s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .nav{gap:10px}.navmeta{display:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2u,.g2v{grid-template-columns:1fr}.kb{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .nav{align-items:flex-start;flex-wrap:wrap;padding:9px 14px}
  .brand{width:100%}.navbtns{width:100%;order:2}.wrap{padding:16px 12px 42px}
  .head{align-items:flex-start;padding:15px;flex-direction:column}.tag{align-self:flex-start}
  .g3,.g2{grid-template-columns:1fr}.lab-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .g4{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:12px}
  .kpi .val{font-size:21px}.navbtns button{padding:8px 10px}
  .navbtns .lbl{display:none}.navbtns button .ms{font-size:21px}
  .card{padding:12px}.kb{grid-template-columns:1fr}.stat-row{align-items:flex-start;flex-direction:column;gap:5px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card:hover,.kpi:hover{transform:none}
}
</style>
