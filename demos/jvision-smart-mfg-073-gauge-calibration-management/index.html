<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>量具校驗管理 Gauge / Calibration Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#071417; --panel:#0d2529; --panel2:#103035; --line:#1c454b;
  --ink:#e6f6f4; --muted:#8fb7b6; --accent:#0d9488; --accent2:#2dd4bf;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{min-width:0;overflow-x:hidden}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;
  line-height:1;vertical-align:middle;font-size:20px}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#08191c,#0a2226);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#04211f}
.brand b{font-size:15px;letter-spacing:.5px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.navbtns button{flex:none;white-space:nowrap;min-width:0;cursor:pointer;
  background:transparent;color:var(--muted);border:1px solid transparent;
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.15s}
.navbtns button:hover{color:var(--ink);background:#0f2c31}
.navbtns button.on{color:#04211f;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 4px 14px rgba(45,212,191,.25)}
.navmeta{flex:none;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px}
.head p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:640px}
.tag{flex:none;font-size:12px;color:var(--accent2);border:1px solid var(--line);
  background:#0c262a;padding:6px 12px;border-radius:20px;font-weight:600}
.g{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g2u{grid-template-columns:1.5fr 1fr}
.g2v{grid-template-columns:1fr 1.4fr}
.card{background:linear-gradient(180deg,var(--panel),#0b2226);border:1px solid var(--line);
  border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kpi{background:linear-gradient(180deg,#0e2b30,#0a2024);border:1px solid var(--line);
  border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:60px;height:60px;
  border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.18),transparent 70%)}
.kpi .lab{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:11.5px;margin-top:6px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:#0f2c31}
.mono{font-family:"Inter",monospace;letter-spacing:.3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:700;border:1px solid transparent}
.p-ok{background:rgba(52,211,153,.14);color:var(--ok);border-color:rgba(52,211,153,.3)}
.p-warn{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.3)}
.p-bad{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.3)}
.p-info{background:rgba(96,165,250,.14);color:var(--info);border-color:rgba(96,165,250,.3)}
.p-mut{background:#12333a;color:var(--muted);border-color:var(--line)}
.bar{height:7px;border-radius:6px;background:#0a1e22;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dow{color:var(--muted);font-size:11px;text-align:center;font-weight:600;padding-bottom:2px}
.cell{background:#0a2024;border:1px solid var(--line);border-radius:10px;min-height:74px;
  padding:7px;min-width:0;display:flex;flex-direction:column;gap:4px}
.cell .d{font-size:12px;color:var(--muted);font-weight:600}
.cell.today{border-color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2)}
.ev{font-size:10px;padding:2px 5px;border-radius:5px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ev.due{background:rgba(251,191,36,.18);color:var(--warn)}
.ev.over{background:rgba(248,113,113,.18);color:var(--bad)}
.ev.done{background:rgba(52,211,153,.16);color:var(--ok)}
.ev.ext{background:rgba(96,165,250,.16);color:var(--info)}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#0a2024;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{margin:0 0 10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:#12333a;color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px}
.tk{background:linear-gradient(180deg,#0e2b30,#0b2327);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;margin-bottom:9px}
.tk .id{font-size:11px;color:var(--accent2);font-weight:700;font-family:monospace}
.tk .nm{font-size:12.5px;font-weight:600;margin:3px 0 5px}
.tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.lab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cert{border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;
  background:linear-gradient(180deg,#0e2b30,#091f23)}
.cert .top{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,rgba(13,148,136,.35),rgba(45,212,191,.12));
  border-bottom:1px dashed var(--line)}
.cert .top b{font-size:13px}
.cert .body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cert .f{min-width:0}
.cert .f label{display:block;color:var(--muted);font-size:10.5px;margin-bottom:2px}
.cert .f span{font-size:12.5px;font-weight:600}
.cert .qr{width:46px;height:46px;border-radius:8px;flex:none;
  background:conic-gradient(#04211f 25%,#0d9488 0 50%,#04211f 0 75%,#2dd4bf 0);
  background-size:12px 12px;border:2px solid var(--accent2)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 16px 8px}
.tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;
  border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(45,212,191,.15)}
.tl .it .t{font-size:12.5px;font-weight:700}
.tl .it .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:12.5px}
.stat-row:last-child{border-bottom:none}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0c262a;border:1px solid var(--line);
  border-radius:20px;padding:5px 11px;font-size:12px;color:var(--muted);font-weight:600}
.chip .ms{font-size:15px;color:var(--accent2)}
@media(max-width:820px){
  .g4,.g3,.g2,.g2u,.g2v{grid-template-columns:1fr}
  .kb{grid-template-columns:1fr 1fr}
  .lab-grid{grid-template-columns:1fr}
  .cal{gap:5px}
  .cell{min-height:60px}
}
@media(max-width:560px){
  .navbtns button .lbl{display:none}
  .navbtns button{padding:8px 10px}
  .kb{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="logo"><span class="ms">straighten</span></div>
    <div><b>CalibHub</b><span>量具校驗管理平台</span></div>
  </div>
  <div class="navbtns" id="navbtns"></div>
  <div class="navmeta"><span class="dot"></span>計量室 · 線上</div>
</nav>
<div class="wrap"><div id="app"></div>
  <div class="foot">CalibHub 量具校驗管理 · 純 UI 展示（無後端，資料為擬真示範）· 主題色 #0d9488 控制室</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function elById(id){return document.getElementById(id);}
function mk(elid,opt){var node=elById(elid);if(!node)return;opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};
  opt.chart.foreColor="#8fb7b6";opt.chart.background="transparent";
  var c=new ApexCharts(node,opt);c.render();charts.push(c);}
var AX={labels:{style:{colors:"#8fb7b6"}},axisBorder:{color:"#1c454b"},axisTicks:{color:"#1c454b"}};
var GRID={borderColor:"#163a40",strokeDashArray:3};

var NAV=[
 {i:"straighten",t:"量具台帳"},
 {i:"event_repeat",t:"校驗排程"},
 {i:"local_shipping",t:"送校 / 內校"},
 {i:"assignment_turned_in",t:"校驗結果"},
 {i:"verified",t:"合格標示"},
 {i:"insights",t:"計量分析"}
];

var gauges=[
 {id:"GA-2201",nm:"數位卡尺 0-150mm",type:"卡尺",loc:"CNC 一課",cyc:"12 月",due:"2026-09-02",st:"ok",own:"林建良",prec:"0.01mm"},
 {id:"GA-2208",nm:"外徑分厘卡 25-50",type:"分厘卡",loc:"CNC 二課",cyc:"12 月",due:"2026-08-19",st:"due",own:"陳雅婷",prec:"0.001mm"},
 {id:"GA-1705",nm:"三次元量測儀 CMM",type:"CMM",loc:"計量室",cyc:"12 月",due:"2026-08-08",st:"over",own:"王志明",prec:"1.5μm"},
 {id:"GA-3310",nm:"扭力扳手 20-100N",type:"扭力",loc:"組裝線",cyc:"6 月",due:"2026-10-14",st:"ok",own:"李佳蓉",prec:"±3%"},
 {id:"GA-2244",nm:"塞規 Φ10 H7",type:"塞規",loc:"品保室",cyc:"6 月",due:"2026-08-21",st:"due",own:"陳雅婷",prec:"H7"},
 {id:"GA-4102",nm:"表面粗糙度儀",type:"粗糙度",loc:"計量室",cyc:"24 月",due:"2027-02-11",st:"ok",own:"王志明",prec:"0.001μm"},
 {id:"GA-2260",nm:"高度規 0-300mm",type:"高度規",loc:"CNC 三課",cyc:"12 月",due:"2026-08-05",st:"over",own:"林建良",prec:"0.01mm"},
 {id:"GA-3320",nm:"數位溫度計",type:"溫度",loc:"熱處理",cyc:"12 月",due:"2026-11-30",st:"ok",own:"李佳蓉",prec:"0.1°C"}
];
function stPill(s){
 if(s==="ok")return '<span class="pill p-ok">效期內</span>';
 if(s==="due")return '<span class="pill p-warn">即將到期</span>';
 return '<span class="pill p-bad">已逾期</span>';
}

function s0(){
 var rows=gauges.map(function(g){
  return '<tr><td class="mono" style="color:var(--accent2);font-weight:700">'+g.id+'</td>'+
   '<td>'+g.nm+'</td><td>'+g.type+'</td><td>'+g.loc+'</td><td>'+g.own+'</td>'+
   '<td class="mono">'+g.prec+'</td><td class="mono">'+g.due+'</td><td>'+stPill(g.st)+'</td></tr>';
 }).join("");
 return card_head("量具台帳","量具建檔、唯一編號與資產分佈總覽")+
 '<div class="g g4" style="margin-bottom:14px">'+
   kpi("straighten","量具總數","1,284","支","up","本月 +18 支新建檔")+
   kpi("check_circle","效期內","1,146","支","up","89.3% 台帳覆蓋")+
   kpi("schedule","30 天內到期","72","支","warn","warn")+
   kpi("error","已逾期","23","支","bad","bad")+
 '</div>'+
 '<div class="g g2v">'+
   '<div class="card"><h3><span class="ms">table_chart</span>量具明細清單</h3>'+
     '<div class="sub">共 8 筆（示範）· 依到期日排序</div>'+
     '<div class="tbl-wrap"><table><thead><tr><th>編號</th><th>名稱</th><th>類別</th><th>使用單位</th><th>保管人</th><th>精度</th><th>下次校驗</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
   '<div class="card"><h3><span class="ms">donut_large</span>量具類別分佈</h3><div class="sub">依台帳類別統計</div>'+
     '<div id="c0a" style="min-height:230px"></div></div>'+
 '</div>';
}
function s0init(){
 mk("c0a",{series:[312,268,204,176,148,176],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:230},
  labels:["卡尺","分厘卡","塞 / 環規","扭力","CMM","其他"],
  colors:["#0d9488","#2dd4bf","#34d399","#60a5fa","#fbbf24","#3f8f8a"],
  stroke:{width:1,colors:["#0b2226"]},legend:{position:"bottom",labels:{colors:"#8fb7b6"}},
  dataLabels:{enabled:true,style:{fontSize:"10px"}},
  plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總數",color:"#8fb7b6",formatter:function(){return "1,284";}}}}}}});
}

function s1(){
 var dows=["一","二","三","四","五","六","日"];
 var dowHtml=dows.map(function(d){return '<div class="dow">'+d+'</div>';}).join("");
 var events={5:[{c:"over",t:"GA-2260 逾期"}],8:[{c:"over",t:"CMM 逾期"}],
  12:[{c:"ext",t:"GA-2208 送外校"}],14:[{c:"done",t:"扭力內校 完成"}],
  19:[{c:"due",t:"GA-2208 到期"}],21:[{c:"due",t:"GA-2244 到期"},{c:"ext",t:"塞規 送校"}],
  25:[{c:"done",t:"高度規 回廠"}],28:[{c:"due",t:"批次到期 6 支"}]};
 var today=14;
 var cells="";
 for(var d=1;d<=28;d++){
  var evs=events[d]||[];
  var evHtml=evs.map(function(e){return '<div class="ev '+e.c+'">'+e.t+'</div>';}).join("");
  cells+='<div class="cell'+(d===today?' today':'')+'"><div class="d">'+d+'</div>'+evHtml+'</div>';
 }
 return card_head("校驗排程","週期自動推算到期日，行事曆排入送校 / 內校並提醒逾期")+
 '<div class="g g4" style="margin-bottom:14px">'+
   kpi("event_available","本月排程","96","場","up","已排 82 · 待排 14")+
   kpi("verified","本月準時率","94.2","%","up","目標 ≥ 92%")+
   kpi("event_busy","逾期未校","23","支","bad","bad")+
   kpi("timelapse","平均在校天數","4.6","天","up","外校 6.2 · 內校 1.1")+
 '</div>'+
 '<div class="g g2u">'+
   '<div class="card"><h3><span class="ms">calendar_month</span>2026 年 8 月校驗行事曆</h3>'+
     '<div class="sub">今日 8/14 · 標示到期 / 逾期 / 送校 / 完成</div>'+
     '<div style="overflow-x:auto"><div style="min-width:520px"><div class="cal">'+dowHtml+cells+'</div></div></div>'+
     '<div class="legend"><span><i style="background:#fbbf24"></i>即將到期</span><span><i style="background:#f87171"></i>逾期</span><span><i style="background:#60a5fa"></i>送外校</span><span><i style="background:#34d399"></i>已完成</span></div>'+
   '</div>'+
   '<div class="card"><h3><span class="ms">notifications_active</span>到期提醒佇列</h3><div class="sub">依剩餘天數排序</div>'+
     alertRow("GA-2260 高度規","已逾期 9 天","bad")+
     alertRow("GA-1705 CMM","已逾期 6 天","bad")+
     alertRow("GA-2208 分厘卡","5 天後到期","warn")+
     alertRow("GA-2244 塞規","7 天後到期","warn")+
     alertRow("GA-3310 扭力扳手","61 天後到期","info")+
     alertRow("GA-3320 溫度計","108 天後到期","ok")+
   '</div>'+
 '</div>';
}
function alertRow(nm,st,c){
 return '<div class="stat-row"><span>'+nm+'</span><span class="pill p-'+c+'">'+st+'</span></div>';
}

function s2(){
 var cols=[
  {h:"待送校 / 待內校",cnt:6,items:[
   {id:"CAL-0912",nm:"GA-2260 高度規",own:"林建良",tag:"內校"},
   {id:"CAL-0913",nm:"GA-2244 塞規 Φ10",own:"陳雅婷",tag:"外校"}]},
  {h:"在校中（外校）",cnt:4,items:[
   {id:"CAL-0908",nm:"GA-2208 分厘卡",own:"台美檢測所",tag:"外校"},
   {id:"CAL-0905",nm:"GA-1705 CMM",own:"全國量測中心",tag:"外校"}]},
  {h:"內校執行中",cnt:3,items:[
   {id:"CAL-0910",nm:"GA-3310 扭力扳手",own:"王志明",tag:"內校"}]},
  {h:"待結果登錄",cnt:5,items:[
   {id:"CAL-0901",nm:"GA-2201 數位卡尺",own:"李佳蓉",tag:"內校"},
   {id:"CAL-0899",nm:"GA-3320 溫度計",own:"李佳蓉",tag:"內校"}]}
 ];
 var kb=cols.map(function(col){
  var tks=col.items.map(function(t){
   return '<div class="tk"><div class="id">'+t.id+'</div><div class="nm">'+t.nm+'</div>'+
    '<div class="mt"><span>'+t.own+'</span><span class="pill p-'+(t.tag==="外校"?"info":"mut")+'">'+t.tag+'</span></div></div>';
  }).join("");
  return '<div class="col"><h4>'+col.h+'<span class="cnt">'+col.cnt+'</span></h4>'+tks+'</div>';
 }).join("");
 return card_head("送校 / 內校執行","外校委外送出與內校自行量測的看板追蹤，避免量具長時間離線")+

function card_head(t,d){
 return '<div class="head"><div><h1>'+t+'</h1><p>'+d+'</p></div>'+
  '<span class="tag">CalibHub · 控制室</span></div>';
}
function kpi(ic,lab,val,unit,dir,note){
 var cls=(dir==="up")?"up":"down";
 var noteHtml;
 if(note==="warn")noteHtml='<span class="down">需關注</span>';
 else if(note==="bad")noteHtml='<span class="down">立即處理</span>';
 else noteHtml='<span class="'+cls+'">'+note+'</span>';
 return '<div class="kpi"><div class="lab"><span class="ms" style="font-size:16px;color:var(--accent2)">'+ic+'</span>'+lab+'</div>'+
  '<div class="val">'+val+'<small>'+unit+'</small></div><div class="delta">'+noteHtml+'</div></div>';
}

var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[s0init,null,null,s3init,s4init,s5init];

function show(i){
 destroyCharts();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
 app.innerHTML=RENDER[i]();
 void app.offsetHeight;
 if(INIT[i])INIT[i]();
}

(function(){
 var box=document.getElementById("navbtns");
 var h="";
 for(var i=0;i<NAV.length;i++){
  h+='<button data-i="'+i+'"><span class="ms">'+NAV[i].i+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
 }
 box.innerHTML=h;
 var btns=box.querySelectorAll("[data-i]");
 for(var j=0;j<btns.length;j++){
  btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
 }
})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
