<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>供應商評鑑計分卡系統 · Supplier Scorecard</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --sidebar:#0F172A;
  --sidebar-muted:#CBD5E1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
}
button,input,select{font:inherit}
button,select,input[type="range"]{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:3px solid color-mix(in srgb,var(--color-ring) 30%,transparent);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  width:248px;
  height:100vh;
  flex:none;
  flex-direction:column;
  background:var(--sidebar);
  color:var(--sidebar-muted);
  border-right:1px solid #1E293B;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:72px;
  padding:15px 18px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.logo{
  display:grid;
  width:40px;
  height:40px;
  flex:none;
  place-items:center;
  border-radius:6px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  font:700 14px/1 "Fira Code",monospace;
  letter-spacing:-.04em;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 6px 14px rgba(37,99,235,.25);
}
.brand b{display:block;color:#FFF;font-size:14px;font-weight:600;line-height:1.35}
.brand span{
  display:block;
  margin-top:3px;
  color:#93C5FD;
  font:500 9px/1.2 "Fira Code",monospace;
  letter-spacing:.12em;
}
.nav{display:flex;flex-direction:column;gap:3px;padding:14px 10px}
.nav button{
  position:relative;
  display:flex;
  width:100%;
  min-height:44px;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#CBD5E1;
  text-align:left;
  font-weight:500;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nav button:hover{background:#1E293B;color:#FFF}
.nav button.on{
  background:#1E3A8A;
  border-color:#3B82F6;
  color:#FFF;
}
.nav button.on::before{
  position:absolute;
  top:8px;
  bottom:8px;
  left:-10px;
  width:3px;
  background:#60A5FA;
  content:"";
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.sfoot{
  margin-top:auto;
  padding:15px 18px 18px;
  border-top:1px solid rgba(255,255,255,.1);
  color:#94A3B8;
  font-size:11px;
  line-height:1.7;
}
.main{display:flex;min-width:0;flex:1;flex-direction:column}
.wrap{width:100%;max-width:1440px;margin:0 auto;padding:26px 28px 46px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:15px;
  border-bottom:1px solid var(--color-border);
}
.vh h2{
  margin:0;
  color:var(--color-foreground);
  font-size:23px;
  font-weight:600;
  letter-spacing:-.025em;
  line-height:1.25;
}
.vh p{margin:5px 0 0;color:var(--color-muted-foreground);font-size:13px}
.pill{
  display:inline-flex;
  min-height:32px;
  align-items:center;
  gap:6px;
  padding:6px 11px;
  border:1px solid #BFDBFE;
  border-radius:5px;
  background:#EFF6FF;
  color:#1E40AF;
  font:600 11px/1.2 "Fira Code",monospace;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
  position:relative;
  min-height:112px;
  overflow:hidden;
  padding:16px 48px 15px 17px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:var(--color-card);
  box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:0 8px 22px rgba(15,23,42,.08)}
.kpi::before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--color-primary);
  content:"";
}
.kpi .l{color:var(--color-muted-foreground);font-size:12px;font-weight:500}
.kpi .v{
  margin-top:5px;
  color:var(--color-card-foreground);
  font:700 27px/1.12 "Fira Code",monospace;
  letter-spacing:-.04em;
}
.kpi .d{margin-top:5px;color:var(--color-muted-foreground);font-size:11px;font-weight:500}
.kpi .ic{position:absolute;top:16px;right:15px;color:#93C5FD;font-size:28px}
.up{color:var(--ok)!important}
.down{color:var(--bad)!important}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g37{grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr)}
.g73{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr)}
.card{
  min-width:0;
  padding:16px 17px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:var(--color-card);
  box-shadow:var(--shadow);
}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 14px;
  color:var(--color-card-foreground);
  font-size:14px;
  font-weight:600;
  letter-spacing:-.01em;
}
.card h3>.material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card h3 small{
  margin-left:auto;
  color:var(--color-muted-foreground);
  font:400 10.5px/1.3 "Fira Code",monospace;
}
.tag{
  display:inline-flex;
  min-height:23px;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10.5px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{border-color:#BBF7D0;background:#F0FDF4;color:#166534}
.t-warn{border-color:#FDE68A;background:#FFFBEB;color:#92400E}
.t-bad{border-color:#FECACA;background:#FEF2F2;color:#991B1B}
.t-info{border-color:#BFDBFE;background:#EFF6FF;color:#1E40AF}
.t-mut{border-color:#CBD5E1;background:#F1F5F9;color:#475569}
.table-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:5px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--color-border);text-align:left}
table.data tr:last-child td{border-bottom:0}
table.data th{
  background:#F1F5F9;
  color:#334155;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.035em;
  white-space:nowrap;
}
table.data tbody tr{transition:background-color .18s ease}
table.data tbody tr:hover{background:#F8FAFC}
table.data td b{font-weight:600}
table.data td small{font-family:"Fira Code",monospace}
.num{
  text-align:right!important;
  font-family:"Fira Code",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.code{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.chart{width:100%;overflow:hidden}
.grade{
  display:inline-grid;
  width:27px;
  height:27px;
  place-items:center;
  border-radius:4px;
  color:#FFF;
  font:700 13px/1 "Fira Code",monospace;
}
.gA{background:#15803D}.gB{background:#4D7C0F}.gC{background:#B45309}.gD{background:#B91C1C}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:#E2E8F0}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--color-primary)}
.wrow{
  display:grid;
  grid-template-columns:140px 1fr 56px 72px;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--color-border);
}
.wrow:last-child{border-bottom:0}
.wrow b{font-size:12.5px;font-weight:600}
.wrow b .material-symbols-outlined{margin-right:4px;color:var(--color-primary);font-size:18px}
.wrow small{display:block;color:var(--color-muted-foreground);font-size:10.5px}
.wrng{display:flex;align-items:center}
.wrng input{
  width:100%;
  height:5px;
  border-radius:2px;
  outline:none;
  appearance:none;
  background:#CBD5E1;
}
.wrng input::-webkit-slider-thumb{
  width:17px;
  height:17px;
  border:3px solid #FFF;
  border-radius:50%;
  appearance:none;
  background:var(--color-primary);
  box-shadow:0 0 0 1px var(--color-primary);
}
.wrng input::-moz-range-thumb{
  width:12px;
  height:12px;
  border:3px solid #FFF;
  border-radius:50%;
  background:var(--color-primary);
  box-shadow:0 0 0 1px var(--color-primary);
}
.wpct{text-align:right;color:#1D4ED8;font:700 12px/1 "Fira Code",monospace}
.tl{position:relative;padding-left:28px}
.tl::before{
  position:absolute;
  top:6px;
  bottom:6px;
  left:8px;
  width:2px;
  background:#CBD5E1;
  content:"";
}
.tli{position:relative;padding:0 0 17px}
.tli:last-child{padding-bottom:0}
.tli::before{
  position:absolute;
  top:3px;
  left:-25px;
  width:12px;
  height:12px;
  border:3px solid #94A3B8;
  border-radius:50%;
  background:#FFF;
  content:"";
}
.tli.done::before{border-color:#15803D;background:#15803D}
.tli.run::before{border-color:#2563EB;background:#2563EB;box-shadow:0 0 0 4px #DBEAFE}
.tli.wait::before{border-color:#94A3B8;background:#FFF}
.tli b{font-size:12.5px;font-weight:600}
.tli small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:11.5px}
.tli .tm{color:#1D4ED8;font:600 10.5px/1.4 "Fira Code",monospace;white-space:nowrap}
.stat{display:flex;flex-direction:column;gap:8px}
.si{
  display:grid;
  grid-template-columns:27px 1fr auto;
  gap:10px;
  align-items:center;
  min-height:54px;
  padding:9px 11px;
  border:1px solid var(--color-border);
  border-radius:5px;
  background:#FFF;
}
.si>.material-symbols-outlined{color:var(--color-primary);font-size:20px}
.si b{font-size:12px;font-weight:600}
.si small{display:block;color:var(--color-muted-foreground);font-size:10.5px}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px}
.col{min-width:0;padding:10px;border:1px solid var(--color-border);border-radius:6px;background:#F1F5F9}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
  color:#334155;
  font-size:11.5px;
  font-weight:600;
}
.col h4 span{
  padding:1px 7px;
  border:1px solid #CBD5E1;
  border-radius:3px;
  background:#FFF;
  color:#475569;
  font:600 10px/1.5 "Fira Code",monospace;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  border:1px solid var(--color-border);
  border-radius:5px;
  background:#FFF;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.tk:last-child{margin-bottom:0}
.tk b{display:block;font-size:12px;font-weight:600}
.tk small{display:block;margin:3px 0 7px;color:var(--color-muted-foreground);font:400 10px/1.5 "Fira Code",monospace}
.tk .mt{display:flex;align-items:center;gap:5px;margin-top:7px;color:#475569;font-size:10px;flex-wrap:wrap}
.tk .mt .material-symbols-outlined{font-size:15px}
.tk .lb{width:100%;height:4px;overflow:hidden;border-radius:1px;background:#E2E8F0}
.tk .lb>i{display:block;height:100%;background:var(--color-primary)}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--color-muted-foreground);font-size:11px}
.leg span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;flex:none;border-radius:50%}
.scard{padding:16px;border:1px solid var(--color-border);border-radius:7px;background:#FFF;box-shadow:var(--shadow)}
.scard .sh{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.scard .av{
  display:grid;
  width:44px;
  height:44px;
  flex:none;
  place-items:center;
  border-radius:5px;
  background:var(--color-primary);
  color:#FFF;
  font:700 17px/1 "Fira Code",monospace;
}
.scard .sh b{display:block;font-size:14px;font-weight:600}
.scard .sh small{color:var(--color-muted-foreground);font:400 10.5px/1.5 "Fira Code",monospace}
.scard .big{margin-left:auto;text-align:right}
.scard .big em{color:#1D4ED8;font:700 29px/1 "Fira Code",monospace;font-style:normal}
.scard .big span{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:10.5px}
.dim{display:flex;flex-direction:column;gap:10px}
.dim .dr{display:grid;grid-template-columns:92px 1fr 35px;gap:10px;align-items:center;font-size:11.5px}
.dim .dr small{color:var(--color-muted-foreground)}
.dim .dr b{text-align:right;font:600 11.5px/1 "Fira Code",monospace}
.note{
  display:flex;
  gap:9px;
  align-items:flex-start;
  padding:10px 12px;
  border:1px solid #BFDBFE;
  border-left:3px solid var(--color-primary);
  border-radius:5px;
  background:#EFF6FF;
  color:#1E3A8A;
  font-size:11.5px;
}
.note>.material-symbols-outlined{flex:none;color:#1D4ED8;font-size:18px}
.control{
  min-height:40px;
  padding:7px 34px 7px 11px;
  border:1px solid #CBD5E1;
  border-radius:5px;
  background:#FFF;
  color:var(--color-foreground);
  font-weight:600;
}
.control:hover{border-color:#93C5FD}
.mtool{display:none}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .side{width:220px}
  .wrap{padding:22px 20px 38px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
}
@media(max-width:768px){
  .app{display:block}
  .side{position:static;width:100%;height:auto;border-right:0}
  .brand,.sfoot{display:none}
  .mtool{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    min-height:54px;
    align-items:center;
    gap:9px;
    padding:8px 14px;
    border-bottom:1px solid #1E293B;
    background:var(--sidebar);
    color:#FFF;
  }
  .mtool .logo{width:32px;height:32px;border-radius:5px;font-size:11px}
  .mtool b{font-size:13px;font-weight:600}
  .nav{
    display:grid;
    grid-template-columns:repeat(6,minmax(94px,1fr));
    gap:5px;
    padding:8px;
    overflow-x:auto;
  }
  .nav button{justify-content:center;min-height:42px;padding:8px 9px;white-space:nowrap}
  .nav button.on::before{display:none}
  .wrap{padding:18px 14px 32px}
  .vh{align-items:flex-start}
  .g2,.g37,.g73{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav{grid-template-columns:repeat(6,52px)}
  .nav button{min-width:48px}
  .nav button .lbl{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{min-height:105px;padding:14px 38px 13px 13px}
  .kpi .v{font-size:22px}
  .kpi .ic{right:10px;font-size:24px}
  .vh{display:block}
  .vh h2{font-size:20px}
  .pill{margin-top:12px;white-space:normal}
  .card,.scard{padding:13px}
  .card h3{align-items:flex-start;flex-wrap:wrap}
  .card h3 small{width:100%;margin-left:26px}
  .board{grid-template-columns:1fr}
  .wrow{grid-template-columns:102px 1fr 44px}
  .wrow>div:last-child{display:none}
  .scard .big{width:100%;margin-left:55px;text-align:left}
  .dim .dr{grid-template-columns:78px 1fr 30px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .reveal{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true">SS</div>
      <div><b>供應商評鑑計分卡</b><span>SUPPLIER SCORECARD</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="sfoot">SRM 採購供應商管理<br/>純 UI 展示 · 擬真資料<br/><span class="code">v2.6 · 2026 Q3</span></div>
  </aside>
  <div class="main">
    <div class="mtool"><div class="logo" aria-hidden="true">SS</div><b>供應商評鑑計分卡系統</b></div>
    <main class="wrap"><div id="app" aria-live="polite"></div></main>
  </div>
</div>
<script>
var MODS=[
  {i:"dashboard",n:"評鑑總覽"},
  {i:"rule",n:"構面設定"},
  {i:"calendar_month",n:"評鑑排程"},
  {i:"fact_check",n:"計分卡評分"},
  {i:"insights",n:"趨勢分析"},
  {i:"task_alt",n:"改善追蹤"}
];
var C=document.getElementById("app"),chartReg=[];
function mi(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function gradeCls(g){return g==="A"?"gA":g==="B"?"gB":g==="C"?"gC":"gD"}
function killCharts(){for(var k=0;k<chartReg.length;k++){try{chartReg[k].destroy()}catch(e){}}chartReg=[]}
function mount(id,opt){var el=document.getElementById(id);if(!el)return;try{var ch=new ApexCharts(el,opt);ch.render();chartReg.push(ch)}catch(e){}}
var BASE={
  chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Fira Sans",sans-serif',foreColor:"#475569"},
  grid:{borderColor:"#E2E8F0",strokeDashArray:3},
  dataLabels:{enabled:false},
  tooltip:{theme:"light"},
  noData:{text:"暫無資料"}
};
function merge(o){var r=JSON.parse(JSON.stringify(BASE));for(var k in o){if(k==="chart"){for(var c in o.chart)r.chart[c]=o.chart[c]}else r[k]=o[k]}return r}
function tableWrap(h){return '<div class="table-wrap">'+h+'</div>'}
