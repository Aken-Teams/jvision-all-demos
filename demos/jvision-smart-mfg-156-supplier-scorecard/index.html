<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供應商評鑑計分卡系統 · Supplier Scorecard</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#fb923c;--ink:#1c1917;--bg:#f6f5f4;--card:#fff;--line:#e7e5e4;--mut:#78716c;--dark:#1c1410;--dark2:#292018;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--dark),var(--dark2));color:#e7e2dc;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(234,88,12,.4)}
.brand b{font-size:14.5px;font-weight:800;display:block;font-family:"Noto Sans TC";color:#fff}
.brand span{font-size:9.5px;color:var(--accent2);letter-spacing:2px}
.nav{display:flex;flex-direction:column;gap:3px;padding:12px 10px;min-width:0}
.nav button{border:0;background:transparent;color:#c9c1b8;font:inherit;font-weight:600;font-size:13.5px;padding:11px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;font-family:"Noto Sans TC";width:100%}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(234,88,12,.32)}
.sfoot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8a8078;line-height:1.6}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1180px;width:100%;margin:0 auto;padding:22px 24px 40px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{background:#fff1e7;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px;font-family:Inter;line-height:1.1}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28;font-size:30px}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g37{grid-template-columns:1.15fr .85fr}
.g73{grid-template-columns:.85fr 1.15fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card h3 small{color:var(--mut);font-weight:500;font-size:11.5px;margin-left:auto}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-mut{background:#f1efed;color:#78716c}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf8f6;white-space:nowrap}
table.data td b{font-family:"Noto Sans TC"}
.num{font-family:Inter;font-weight:700;text-align:right!important}
.chart{width:100%;overflow:hidden}
.grade{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:800;font-size:13px;color:#fff;font-family:Inter}
.gA{background:#16a34a}.gB{background:#65a30d}.gC{background:#d97706}.gD{background:#dc2626}
.bar{height:8px;border-radius:6px;background:#eee7e1;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.wrow{display:grid;grid-template-columns:130px 1fr 54px 78px;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow b{font-family:"Noto Sans TC";font-size:13px}
.wrow small{color:var(--mut);font-size:10.5px;display:block}
.wrng{display:flex;align-items:center;gap:8px}
.wrng input{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:#eee7e1;outline:none}
.wrng input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 5px rgba(234,88,12,.5)}
.wpct{font-family:Inter;font-weight:800;color:var(--accent);text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--accent2)}
.tli.done::before{background:var(--ok);border-color:var(--ok)}
.tli.run::before{background:var(--accent);border-color:var(--accent)}
.tli.wait::before{background:#d6d3d1;border-color:#d6d3d1}
.tli b{font-family:"Noto Sans TC";font-size:13.5px}
.tli small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.tli .tm{font-family:Inter;font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap}
.stat{display:flex;flex-direction:column;gap:10px}
.si{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.si .material-symbols-outlined{color:var(--accent);font-size:20px}
.si b{font-family:"Noto Sans TC";font-size:12.5px}
.si small{color:var(--mut);font-size:11px;display:block}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#faf8f6;border:1px solid var(--line);border-radius:13px;padding:11px 10px;min-width:0}
.col h4{margin:0 0 10px;font-size:12px;font-family:"Noto Sans TC";display:flex;align-items:center;justify-content:space-between}
.col h4 span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px}
.tk:last-child{margin-bottom:0}
.tk b{font-family:"Noto Sans TC";font-size:12.5px;display:block}
.tk small{color:var(--mut);font-size:11px;display:block;margin:3px 0 6px}
.tk .mt{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut);flex-wrap:wrap}
.tk .lb{width:100%;height:4px;background:#eee7e1;border-radius:4px;margin-top:6px;overflow:hidden}
.tk .lb>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.leg span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.scard{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:#faf8f6}
.scard .sh{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap}
.scard .av{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-family:Inter;flex:none;font-size:16px}
.scard .sh b{font-family:"Noto Sans TC";font-size:15px;display:block}
.scard .sh small{color:var(--mut);font-size:11.5px}
.scard .big{margin-left:auto;text-align:right}
.scard .big em{font-family:Inter;font-size:30px;font-weight:800;font-style:normal;line-height:1;color:var(--accent)}
.scard .big span{font-size:11px;color:var(--mut);display:block}
.dim{display:flex;flex-direction:column;gap:9px}
.dim .dr{display:grid;grid-template-columns:80px 1fr 34px;gap:10px;align-items:center;font-size:12px}
.dim .dr small{color:var(--mut);font-family:"Noto Sans TC"}
.dim .dr b{font-family:Inter;text-align:right;font-weight:700}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:11px 13px;font-size:12px;color:#9a3412;display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{color:var(--accent);font-size:18px;flex:none}
.mtool{display:none;align-items:center;gap:10px;padding:11px 16px;background:var(--dark);color:#fff;position:sticky;top:0;z-index:30}
.mtool .logo{width:30px;height:30px;border-radius:9px;font-size:13px}
.mtool b{font-size:13px;font-family:"Noto Sans TC"}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column}
  .brand{display:none}
  .mtool{display:flex}
  .nav{flex-direction:row;flex-wrap:wrap;padding:9px 10px}
  .nav button{width:auto;flex:none;padding:8px 11px;font-size:12.5px}
  .sfoot{display:none}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g37,.g73{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
  .kpis{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .wrow{grid-template-columns:96px 1fr 44px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">SS</div>
      <div><b>供應商評鑑計分卡</b><span>SUPPLIER SCORECARD</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">SRM 採購供應商管理<br/>純 UI 展示 · 擬真資料<br/>v2.6 · 2026 Q3</div>
  </aside>
  <div class="main">
    <div class="mtool"><div class="logo">SS</div><b>供應商評鑑計分卡系統</b></div>
    <div class="wrap"><div id="app"></div></div>
  </div>
</div>
<script>
var MODS=[
  {i:"dashboard",n:"評鑑總覽"},
  {i:"rule",n:"構面設定"},
  {i:"calendar_month",n:"評鑑排程"},
  {i:"fact_check",n:"計分卡評分"},
  {i:"insights",n:"趨勢分析"},
  {i:"task_alt",n:"改善追蹤"}
];
var C=document.getElementById("app");
var chartReg=[];
function mi(n){return '<span class="material-symbols-outlined">'+n+'</span>';}
function gradeCls(g){return g==="A"?"gA":g==="B"?"gB":g==="C"?"gC":"gD";}
function killCharts(){for(var k=0;k<chartReg.length;k++){try{chartReg[k].destroy();}catch(e){}}chartReg=[];}
function mount(id,opt){var el=document.getElementById(id);if(!el)return;try{var ch=new ApexCharts(el,opt);ch.render();chartReg.push(ch);}catch(e){}}
var BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'},grid:{borderColor:"#f0ede9",strokeDashArray:4},dataLabels:{enabled:false}};
function merge(o){var r=JSON.parse(JSON.stringify(BASE));for(var k in o){if(k==="chart"){for(var c in o.chart)r.chart[c]=o.chart[c];}else r[k]=o[k];}return r;}

/* ---------- data ---------- */
var SUPS=[
  {c:"S-1042",n:"精鋼金屬工業",cat:"沖壓件",g:"A",s:94.2,q:96,d:95,co:88,se:93,e:90,po:"+2.1",dev:"品保部 · 王品豪"},
  {c:"S-1088",n:"O達電子零件",cat:"連接器",g:"A",s:91.6,q:94,d:90,co:86,se:92,e:88,po:"+0.8",dev:"品保部 · 李思穎"},
  {c:"S-1130",n:"聯欣塑膠成型",cat:"射出件",g:"B",s:83.4,q:85,d:80,co:88,se:82,e:79,po:"-1.4",dev:"採購部 · 陳冠廷"},
  {c:"S-1175",n:"台耀表面處理",cat:"電鍍",g:"B",s:80.1,q:82,d:76,co:84,se:81,e:77,po:"+1.2",dev:"品保部 · 王品豪"},
  {c:"S-1203",n:"廣越五金",cat:"扣件",g:"C",s:72.5,q:70,d:68,co:82,se:74,e:71,po:"-3.6",dev:"採購部 · 陳冠廷"},
  {c:"S-1240",n:"日昇線材",cat:"線材",g:"C",s:69.8,q:66,d:72,co:75,se:70,e:66,po:"+0.4",dev:"品保部 · 李思穎"},
  {c:"S-1287",n:"美盛包裝材料",cat:"包材",g:"D",s:58.3,q:54,d:60,co:70,se:56,e:52,po:"-5.2",dev:"供應商管理部 · 林佳蓉"}
];
var DIMS=[
  {k:"q",n:"品質",w:30,ic:"verified"},
  {k:"d",n:"交期",w:25,ic:"local_shipping"},
  {k:"co",n:"成本",w:20,ic:"request_quote"},
  {k:"se",n:"服務",w:15,ic:"support_agent"},
  {k:"e",n:"ESG",w:10,ic:"eco"}
];

/* ---------- screen 0: 評鑑總覽 ---------- */
function s0(){
  var kp=[
    {l:"合格供應商比率",v:"78.5%",d:"↑ 6.2% vs 上季",c:"up",ic:"verified"},
    {l:"平均評鑑分數",v:"81.4",d:"↑ 2.3 分",c:"up",ic:"grade"},
    {l:"本季受評家數",v:"142",d:"排程 128 / 補評 14",c:"",ic:"groups"},
    {l:"待改善 SCAR",v:"9",d:"↓ 4 件 已結案",c:"up",ic:"build"}
  ];
  var kh="";for(var i=0;i<kp.length;i++){var k=kp[i];kh+='<div class="kpi"><span class="material-symbols-outlined ic">'+k.ic+'</span><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div><div class="d '+k.c+'">'+k.d+'</div></div>';}
  var rows="";for(var j=0;j<SUPS.length;j++){var s=SUPS[j];var pc=parseFloat(s.po)>=0;
    rows+='<tr><td><b>'+s.n+'</b><br><small style="color:var(--mut)">'+s.c+' · '+s.cat+'</small></td>'
      +'<td><span class="grade '+gradeCls(s.g)+'">'+s.g+'</span></td>'
      +'<td class="num">'+s.s.toFixed(1)+'</td>'
      +'<td><div class="bar"><i style="width:'+s.s+'%"></i></div></td>'
      +'<td class="num '+(pc?"up":"down")+'">'+s.po+'</td>'
      +'<td><span class="tag '+(s.g==="A"||s.g==="B"?"t-ok":s.g==="C"?"t-warn":"t-bad")+'">'+(s.g==="D"?"需改善":s.g==="C"?"觀察":"合格")+'</span></td></tr>';}
  C.innerHTML=
  '<div class="vh"><div><h2>評鑑總覽儀表板</h2><p>合格供應商比率、平均評鑑分數與等級分布 · 品保部結果通報視圖</p></div><span class="pill">'+mi("calendar_month")+' 2026 Q3 評鑑週期</span></div>'
  +'<div class="kpis">'+kh+'</div>'
  +'<div class="grid g37" style="margin-bottom:16px">'
    +'<div class="card"><h3>'+mi("trending_up")+'合格率與平均分趨勢<small>近 6 個評鑑週期</small></h3><div id="c0a" class="chart"></div></div>'
    +'<div class="card"><h3>'+mi("donut_large")+'等級分布<small>142 家</small></h3><div id="c0b" class="chart"></div>'
      +'<div class="leg"><span><i class="dot" style="background:#16a34a"></i>A 級</span><span><i class="dot" style="background:#65a30d"></i>B 級</span><span><i class="dot" style="background:#d97706"></i>C 級</span><span><i class="dot" style="background:#dc2626"></i>D 級</span></div></div>'
  +'</div>'
  +'<div class="card"><h3>'+mi("leaderboard")+'供應商評鑑排名<small>依總分排序</small></h3>'
    +'<div style="overflow-x:auto"><table class="data"><thead><tr><th>供應商</th><th>等級</th><th class="num">總分</th><th style="width:120px">分數</th><th class="num">季變動</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  void C.offsetHeight;
  mount("c0a",merge({chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:280},colors:["#ea580c","#16a34a"],stroke:{width:[3,3],curve:"smooth",dashArray:[0,5]},markers:{size:4},
    series:[{name:"合格率 %",data:[64,68,71,73,76,78.5]},{name:"平均分",data:[75,76.5,78,79.4,80.2,81.4]}],
    xaxis:{categories:["Q2/25","Q3/25","Q4/25","Q1/26","Q2/26","Q3/26"],labels:{style:{fontSize:"11px"}}},
    yaxis:{min:55,max:100,labels:{style:{fontSize:"11px"}}},legend:{position:"top",fontSize:"12px"}}));
  mount("c0b",merge({chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:280},colors:["#16a34a","#65a30d","#d97706","#dc2626"],
    series:[38,54,36,14],labels:["A 級","B 級","C 級","D 級"],legend:{show:false},
    plotOptions:{pie:{donut:{size:"66%",labels:{show:true,total:{show:true,label:"受評家數",fontSize:"12px",formatter:function(){return "142";}}}}}},
    stroke:{width:2,colors:["#fff"]}}));
}

/* ---------- screen 1: 構面設定 ---------- */
function s1(){
  var wh="";for(var i=0;i<DIMS.length;i++){var d=DIMS[i];
    var descMap={q:"進料合格率、退貨率",d:"準交率、交期達成",co:"報價競爭力、降本",se:"回應速度、配合度",e:"碳排、勞安、認證"};
    var cntMap={q:"5 項",d:"3 項",co:"3 項",se:"4 項",e:"4 項"};
    wh+='<div class="wrow"><div><b>'+mi(d.ic)+' '+d.n+'</b><small>'+descMap[d.k]+'</small></div>'
      +'<div class="wrng"><input type="range" min="0" max="40" value="'+d.w+'" oninput="reweight(this,'+i+')"></div>'
      +'<div class="wpct" id="wp'+i+'">'+d.w+'%</div>'
      +'<div style="text-align:right"><span class="tag t-info">'+cntMap[d.k]+'</span></div></div>';}
  var basis=[
    {r:"品質 · 進料合格率 ≥ 99%",p:"滿分 30",t:"t-ok"},
    {r:"品質 · 每發生 1 件 SCAR",p:"-3 分",t:"t-bad"},
    {r:"交期 · 準交率 ≥ 95%",p:"滿分 25",t:"t-ok"},
    {r:"交期 · 逾期 > 5 日案件",p:"-2 分/件",t:"t-warn"},
    {r:"成本 · 主動提出降本方案",p:"+2 分",t:"t-ok"},

  ];
