<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>團體保險與員工福利平台 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E9DD;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E8F7F5;
  --hov:#F4FCFB;
  --track:#DDECEA;
  --ok:#15803D;
  --warn:#A8550B;
  --bad:#B91C1C;
  --info:#0369A1;
  --r:8px;
  --shadow:0 10px 28px rgba(19,78,74,.08);
  --shadow-hover:0 14px 34px rgba(19,78,74,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(90deg,rgba(13,148,136,.04) 1px,transparent 1px),
    linear-gradient(rgba(13,148,136,.04) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC","PingFang TC",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tag{
  font-family:"Cinzel","Noto Serif TC","PingFang TC",serif
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  font-feature-settings:"liga";
  -webkit-font-feature-settings:"liga"
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px
}
.app{display:flex;min-height:100vh}
.sidebar{
  width:250px;
  height:100vh;
  position:sticky;
  top:0;
  z-index:10;
  flex:none;
  display:flex;
  flex-direction:column;
  padding:28px 18px 20px;
  background:rgba(255,255,255,.96);
  border-right:1px solid var(--line);
  backdrop-filter:blur(14px)
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 8px 28px;
  min-width:0
}
.brand-logo{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  flex:none;
  color:#062E2B;
  background:var(--color-secondary);
  border:1px solid #0F766E;
  border-radius:6px;
  box-shadow:4px 4px 0 #115E59
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  font-size:15px;
  font-weight:600;
  letter-spacing:.04em
}
.brand-txt span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.16em
}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{
  min-height:46px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  text-align:left;
  font-size:13px;
  font-weight:500;
  transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease
}
.nav button:hover{
  color:var(--ink);
  background:#ECFDF9;
  border-color:var(--line);
  transform:translateX(2px)
}
.nav button.on{
  color:#073B37;
  background:#CCFBF1;
  border-color:#2DD4BF;
  box-shadow:inset 3px 0 0 var(--color-primary)
}
.nav button .material-symbols-outlined{font-size:20px}
.nav .idx{
  margin-left:auto;
  color:#0F766E;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.08em
}
.side-foot{
  margin-top:auto;
  padding:18px 10px 0;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-size:12px;
  line-height:1.7
}
.side-foot b{color:var(--ink)}
.main{
  width:calc(100% - 250px);
  min-width:0;
  padding:28px clamp(18px,3vw,46px) 64px
}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  max-width:1500px;
  margin:0 auto 24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line)
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--ink);
  font-size:clamp(22px,2vw,30px);
  font-weight:500;
  letter-spacing:.01em
}
.topbar h1 .material-symbols-outlined{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#063F3A;
  background:var(--color-secondary);
  border-radius:4px;
  font-size:22px
}
.topbar .sub{
  max-width:680px;
  margin-top:7px;
  color:var(--muted);
  font-size:14px
}
.top-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap
}
.chip{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 11px;
  color:var(--muted);
  background:rgba(255,255,255,.86);
  border:1px solid var(--line);
  border-radius:4px;
  font-size:12px;
  font-weight:600
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #DCFCE7;
  border-radius:50%;
  box-shadow:0 0 0 2px var(--ok)
}
.avatar{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  flex:none;
  color:#062E2B;
  background:#FDE68A;
  border:1px solid var(--color-accent);
  border-radius:50%;
  font-weight:700
}
#screen{max-width:1500px;margin:auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr)}
.grid>*{min-width:0}
.card,.sec,.tile{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow)
}
.card,.sec{padding:20px}
.card{
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease
}
.card:hover{
  border-color:#2DD4BF;
  box-shadow:var(--shadow-hover);
  transform:translateY(-2px)
}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
  flex-wrap:wrap
}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  color:var(--ink);
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px
}
.card-h .hint{
  color:var(--muted);
  font-size:12px
}
.sec{margin-bottom:16px}
.sec>h3{margin-bottom:14px}
.sec>p{margin:0 0 14px;color:var(--muted)}
.tile{
  position:relative;
  min-height:168px;
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:19px;
  overflow:hidden;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease
}
.tile::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--color-primary)
}
.tile:hover{
  border-color:#2DD4BF;
  box-shadow:var(--shadow-hover);
  transform:translateY(-3px)
}
.tile .ti{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  margin-bottom:4px;
  color:#064E46;
  background:#CCFBF1;
  border:1px solid #5EEAD4;
  border-radius:5px
}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{
  color:var(--muted);
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:14px;
  font-weight:600
}
.tile .tv{
  color:var(--ink);
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:clamp(22px,2vw,29px);
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.025em
}
.tile p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55
}
table{
  width:100%;
  border-collapse:collapse;
  color:var(--ink);
  font-size:14px
}
th{
  padding:12px 14px;
  color:#334155;
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:12px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  letter-spacing:.035em
}
td{
  padding:12px 14px;
  border-bottom:1px solid #CFE9E5;
  white-space:nowrap;
  font-variant-numeric:tabular-nums
}
tbody tr{transition:background-color .2s ease}
tbody tr:hover{background:var(--hov)}
tbody tr:last-child td{border-bottom:0}
td:first-child,.mono{
  font-family:"Cinzel","SFMono-Regular",Consolas,monospace;
  font-size:12px;
  font-weight:500;
  font-variant-numeric:tabular-nums
}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:600;
  white-space:nowrap
}
.tag::before{
  content:"";
  width:6px;
  height:6px;
  background:currentColor;
  border-radius:50%
}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#991B1B;background:#FEF2F2}
.t-info{color:#075985;background:#F0F9FF}
.t-gray{color:#475569;background:#F8FAFC}
.t-acc,.t-pink{color:#115E59;background:#F0FDFA}
.prog{
  min-width:104px;
  display:flex;
  align-items:center;
  gap:8px
}
.bar{
  min-width:60px;
  height:7px;
  overflow:hidden;
  background:var(--track);
  border-radius:999px
}
.bar>i{
  display:block;
  height:100%;
  background:var(--color-primary);
  border-radius:999px
}
.prog small{
  width:36px;
  flex:none;
  color:var(--muted);
  font-family:"Cinzel",monospace;
  font-size:10px;
  text-align:right;
  font-variant-numeric:tabular-nums
}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:4px;
  left:7px;
  width:1px;
  background:var(--line)
}
.tl-item{position:relative;padding:0 0 19px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:3px;
  left:-26px;
  width:14px;
  height:14px;
  background:#FFF;
  border:3px solid var(--color-primary);
  border-radius:50%
}
.tl-dot::after{
  content:"";
  position:absolute;
  inset:2px;
  background:currentColor;
  border-radius:50%
}
.tl-dot.ok{color:var(--ok);border-color:var(--ok)}
.tl-dot.warn{color:var(--warn);border-color:var(--warn)}
.tl-dot.bad{color:var(--bad);border-color:var(--bad)}
.tl-time{
  color:var(--muted);
  font-family:"Cinzel",monospace;
  font-size:10px;
  font-weight:600
}
.tl-item b{
  display:block;
  margin:3px 0;
  font-size:14px
}
.tl-item p{margin:0;color:var(--muted);font-size:12px}
.chk{
  min-height:43px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 2px;
  border-bottom:1px dashed #B8DDD8;
  font-size:14px
}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:#64748B}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{
  color:var(--muted);
  font-size:12px;
  text-align:right
}
.note{
  margin-top:14px;
  padding:13px 14px;
  color:#3F4F5F;
  background:#F8FAFC;
  border-left:3px solid var(--color-accent);
  font-size:12px;
  line-height:1.7
}
.dl{
  display:grid;
  grid-template-columns:136px minmax(0,1fr);
  gap:10px 18px;
  margin:0
}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px
}
.col{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:12px;
  background:var(--th);
  border:1px solid var(--line);
  border-radius:var(--r)
}
.col-h{
  display:flex;
  justify-content:space-between;
  padding:3px 4px 7px;
  font-weight:600
}
.col-h .cnt{
  padding:1px 8px;
  color:var(--muted);
  background:#FFF;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:11px
}
.pcard,.lane-row{
  background:#FFF;
  border:1px solid var(--line);
  border-radius:6px
}
.pcard{
  padding:12px;
  border-left:3px solid var(--color-primary)
}
.pcard .meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:6px;
  color:var(--muted);
  font-size:11px
}
.who{display:inline-flex;align-items:center;gap:6px}
.mini-av,.av{
  display:inline-grid;
  place-items:center;
  flex:none;
  color:#115E59;
  background:#CCFBF1;
  border-radius:50%;
  font-weight:700
}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 14px
}
.lane-row .num{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:none;
  color:#064E46;
  background:#CCFBF1;
  border-radius:4px;
  font-family:"Cinzel",serif;
  font-weight:600
}
.lane-row .body{flex:1;min-width:0}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{
  width:23px;
  height:23px;
  display:grid;
  place-items:center;
  z-index:1;
  color:#64748B;
  background:#FFF;
  border:2px solid var(--line);
  border-radius:50%;
  font-size:10px
}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#FFF;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:var(--color-primary);border-color:var(--color-primary)}
.steps .ln.done{background:var(--color-primary)}
.rep-row{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 4px;
  border-bottom:1px dashed var(--line)
}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{
  height:8px;
  overflow:hidden;
  background:var(--track);
  border-radius:999px
}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{
  position:relative;
  min-width:150px;
  height:26px;
  background:var(--track);
  border-radius:4px
}
.band .rng{position:absolute;inset:0 auto;background:#99F6E4;border-radius:4px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--color-primary);border-radius:2px}
@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 278px;gap:16px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{
    grid-column:2;
    grid-row:1/span 99;
    display:flex;
    flex-direction:column;
    gap:12px;
    position:sticky;
    top:20px
  }
  #screen>.grid.g4:first-child>*{width:100%}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{display:block}
  .sidebar{
    width:100%;
    height:auto;
    position:relative;
    flex-direction:row;
    align-items:center;
    flex-wrap:wrap;
    padding:12px 14px;
    border-right:0;
    border-bottom:1px solid var(--line)
  }
  .brand{padding:0 12px 0 0}
  .brand-logo{width:38px;height:38px;box-shadow:3px 3px 0 #115E59}
  .side-foot{display:none}
  .nav{
    flex:1;
    flex-direction:row;
    overflow-x:auto;
    scrollbar-width:thin
  }
  .nav button{min-height:42px;padding:8px 10px;white-space:nowrap}
  .nav .idx{display:none}
  .main{width:100%;padding:22px 16px 48px}
  .topbar{align-items:center}
}
@media(max-width:760px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
  .top-right{justify-content:flex-start}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dt{margin-top:8px}
}
@media(max-width:560px){
  body{font-size:15px}
  .brand-txt{display:none}
  .nav button .txt{display:none}
  .nav button{min-width:42px;justify-content:center}
  .topbar{display:block}
  .top-right{margin-top:14px}
  .topbar h1{font-size:21px}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .tile{min-height:154px;padding:15px}
  .tile .tv{font-size:20px}
  .tile p{font-size:11px}
  .board{grid-template-columns:1fr}
  .card{padding:16px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .tile{min-height:0}
  .chip:nth-child(2){display:none}
}
@media(prefers-reduced-motion:no-preference){
  #screen>*{
    animation:reveal .36s ease-out both
  }
  #screen>*:nth-child(2){animation-delay:.05s}
  #screen>*:nth-child(3){animation-delay:.1s}
  @keyframes reveal{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }

  ]))+
  card("續保評估重點","fact_check",
   '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span class="n">損率 50.0%，低於議價門檻 60%</span><small>有調降空間</small></div>'+
   '<div class="chk"><span class="material-symbols-outlined warn">warning</span><span class="n">住院日額給付件數年增 22%</span><small>需觀察</small></div>'+
   '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span class="n">眷屬加保率 44%，規模足夠</span><small>可爭取眷屬費率</small></div>'+
   '<div class="chk"><span class="material-symbols-outlined warn">warning</span><span class="n">平均年齡上升 0.8 歲</span><small>費率承壓</small></div>'+
   '<div class="chk"><span class="material-symbols-outlined bad">error</span><span class="n">實支實付額度 12 萬偏低</span><small>員工反映最多</small></div>'+
   '<div class="note">建議續保時以「維持保費、提高實支實付額度至 15 萬」為談判目標，而非單純殺價。離職面談中「福利不足」僅佔 2%，顯示現行方案尚有競爭力，但實支實付額度是最常被提及的具體缺口。</div>')+
 '</div>';
}
var RENDER=[v0,v1,v2,v3,v4];
function buildNav(){
 var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'
 }).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
  b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})
 })
}
function show(i){
 killCharts();
 var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
  var active=+b.getAttribute("data-i")===i;
  b.classList.toggle("on",active);
  if(active)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
 });
 RENDER[i](document.getElementById("screen"))
}
buildNav();
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],MODULES.length-1):0);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
