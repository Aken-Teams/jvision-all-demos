<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>諮商個案紀錄室 · Counseling Casebook</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFFFFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --accent:#0891B2;
  --accent2:#22D3EE;
  --bg:#ECFEFF;
  --card:#FFFFFF;
  --mut:#475569;
  --ok:#047857;
  --warn:#A15C00;
  --bad:#B91C1C;
  --soft:#E8F1F6;
  --shadow-raised:-6px -6px 16px rgba(255,255,255,.92),6px 6px 16px rgba(8,145,178,.13);
  --shadow-small:-3px -3px 9px rgba(255,255,255,.88),3px 3px 9px rgba(8,145,178,.11);
  --shadow-inset:inset 2px 2px 5px rgba(8,82,106,.10),inset -2px -2px 5px rgba(255,255,255,.86);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:"Atkinson Hyperlegible",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  line-height:1.45;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  vertical-align:middle;
  line-height:1;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20;
}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:20;
  height:100vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:20px 15px;
  color:var(--ink);
  background:#DDF8FB;
  border-right:1px solid rgba(8,145,178,.18);
  box-shadow:6px 0 22px rgba(8,82,106,.08);
}
.side .bd{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 7px 19px;
  margin-bottom:5px;
  border-bottom:1px solid rgba(8,145,178,.18);
}
.side .lg{
  width:45px;
  height:45px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:var(--ink);
  background:#DDF8FB;
  box-shadow:var(--shadow-raised);
}
.side .lg .material-symbols-outlined{font-size:25px;color:var(--color-primary)}
.side .bd b{display:block;font-size:16px;font-weight:700;color:#103E50}
.side .bd span:not(.material-symbols-outlined){
  display:block;
  margin-top:2px;
  color:#376679;
  font-size:10px;
  letter-spacing:1.35px;
}
.side button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:13px;
  color:#275C70;
  background:transparent;
  font-weight:700;
  font-size:14px;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .15s ease;
}
.side button .material-symbols-outlined{color:#347287}
.side button:hover{
  color:#0E556D;
  background:#E9FCFE;
  box-shadow:var(--shadow-small);
}
.side button:active{transform:translateY(1px);box-shadow:var(--shadow-inset)}
.side button.on{
  color:#003D4D;
  background:#BDEEF3;
  border-color:rgba(8,145,178,.25);
  box-shadow:var(--shadow-inset);
}
.side button.on .material-symbols-outlined{color:#006C85}
.side button .bg{
  margin-left:auto;
  min-width:25px;
  padding:2px 8px;
  border-radius:999px;
  color:#7F1D1D;
  background:#FEE2E2;
  border:1px solid #FCA5A5;
  font-size:11px;
  font-weight:700;
  text-align:center;
}
.side .foot{
  margin-top:auto;
  padding:14px 11px 3px;
  border-top:1px solid rgba(8,145,178,.18);
  color:#376679;
  font-size:12px;
  line-height:1.75;
}
.main{min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  padding:15px 27px;
  background:rgba(236,254,255,.94);
  border-bottom:1px solid rgba(8,145,178,.18);
  box-shadow:0 5px 18px rgba(8,82,106,.06);
  backdrop-filter:blur(12px);
}
.top h2{margin:0;color:#103E50;font-size:21px;font-weight:700;letter-spacing:.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill,.live{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 12px;
  border:1px solid rgba(8,145,178,.23);
  border-radius:12px;
  color:#075D71;
  background:#E4FAFC;
  box-shadow:var(--shadow-small);
  font-size:12px;
  font-weight:700;
}
button.pill{transition:transform .15s ease,box-shadow .18s ease,background-color .18s ease}
button.pill:hover{background:#CFF5F8;box-shadow:var(--shadow-raised)}
button.pill:active{transform:translateY(1px);box-shadow:var(--shadow-inset)}
.pill.warm{color:#7A4500;background:#FFF4D6;border-color:#E9C777}
.live{color:#065F46;background:#DDF8EE;border-color:#86D8BB}
.live i{
  width:9px;
  height:9px;
  flex:none;
  border-radius:50%;
  background:#047857;
  box-shadow:0 0 0 4px rgba(5,150,105,.12);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
.body{padding:24px 27px 46px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:18px;
}
.kpi,.card{
  background:var(--color-card);
  border:1px solid rgba(8,145,178,.16);
  box-shadow:var(--shadow-raised);
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:119px;
  padding:17px 18px;
  border-radius:15px;
}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-31px;
  width:78px;
  height:78px;
  border-radius:50%;
  background:rgba(34,211,238,.10);
}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:700}
.kpi .v{
  margin-top:3px;
  color:#103E50;
  font-size:28px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{color:var(--muted);font-size:13px;font-weight:700}
.kpi .d{margin-top:3px;color:#047857;font-size:11.5px;font-weight:700}
.kpi .d.w{color:#8A4F00}.kpi .d.b{color:#A41515}
.kpi .ic{position:absolute;top:15px;right:14px;color:#087F9B;opacity:.55;font-size:22px}
.grid{display:grid;gap:17px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr)}
.g21{grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr)}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:18px 19px;border-radius:16px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 14px;
  color:#164E63;
  font-size:14.5px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:#087F9B}
.card h3 .grow{margin-left:auto;color:#076A80;font-size:12px;font-weight:700}
.casehd{display:flex;align-items:center;gap:14px;margin-bottom:15px}
.cav{
  width:59px;
  height:59px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid rgba(8,145,178,.22);
  border-radius:16px;
  color:#075D71;
  background:#DDF8FB;
  box-shadow:var(--shadow-small);
  font-size:24px;
  font-weight:700;
}
.casehd b{color:#103E50;font-size:19px}
.casehd small{display:block;margin-top:2px;color:var(--muted);font-size:12.5px}
.lvl,.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  border-radius:999px;
  white-space:nowrap;
  font-weight:700;
}
.lvl{padding:2px 8px;font-size:10.5px}
.tag{padding:2px 9px;font-size:11px}
.l7,.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.l4,.t-warn{color:#7A4500;background:#FFF4D6;border-color:#E9C777}
.l2,.t-ok{color:#046C51;background:#DDF8EE;border-color:#86D8BB}
.t-run{color:#075D71;background:#DDF8FB;border-color:#8DDEE8}
.t-info{color:#174A75;background:#E0F0FA;border-color:#A7CDE5}
.chart{height:250px}.chart.sm{height:210px}
.cases{display:flex;flex-direction:column;gap:9px}
.cml{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:64px;
  padding:10px 12px;
  border:1px solid rgba(8,145,178,.17);
  border-radius:13px;
  background:#FBFFFF;
  transition:background-color .18s ease,box-shadow .18s ease,transform .15s ease;
}
.cml:hover{background:#F0FCFD;box-shadow:var(--shadow-small);transform:translateY(-1px)}
.cml .av{
  width:41px;
  height:41px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:12px;
  color:#075D71;
  background:#DDF8FB;
  box-shadow:var(--shadow-inset);
  font-weight:700;
}
.cml .info{flex:1;min-width:0}
.cml .info b{color:#164E63;font-size:13.5px}
.cml .info small{display:block;color:var(--muted);font-size:11.5px}
.scroll{max-width:100%;overflow-x:auto;border-radius:12px}
table.data{
  width:100%;
  border-spacing:0;
  border-collapse:separate;
  color:#244F60;
  font-size:12.5px;
  font-variant-numeric:tabular-nums;
}
table.data th,table.data td{
  padding:10px 11px;
  border-bottom:1px solid rgba(8,145,178,.16);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  color:#315F70;
  background:#E8F1F6;
  border-top:1px solid rgba(8,145,178,.14);
  font-size:11.5px;
  font-weight:700;
}
table.data th:first-child{border-radius:10px 0 0 0}
table.data th:last-child{border-radius:0 10px 0 0}
table.data tbody tr:hover td,table.data tr:hover td{background:#F0FCFD}
table.data td:nth-child(n+2){font-variant-numeric:tabular-nums}
.alist{display:flex;flex-direction:column;gap:9px}
.al{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:11px 12px;
  border:1px solid #E9C777;
  border-left:4px solid #A15C00;
  border-radius:11px;
  background:#FFF9E8;
}
.al.bad{border-color:#FCA5A5;border-left-color:#B91C1C;background:#FFF1F1}
.al.info{border-color:#8DDEE8;border-left-color:#0891B2;background:#EDFBFD}
.al .material-symbols-outlined{flex:none;color:#8A4F00;font-size:19px}
.al.bad .material-symbols-outlined{color:#B91C1C}
.al.info .material-symbols-outlined{color:#087F9B}
.al b{color:#234D5D;font-size:12.5px}
.al small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.soap{display:flex;flex-direction:column;gap:11px}
.soap .sec{
  overflow:hidden;
  border:1px solid rgba(8,145,178,.18);
  border-radius:13px;
  background:#FCFFFF;
}
.soap .sec .hd{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 13px;
  color:#164E63;
  background:#E8F1F6;
  font-size:12.5px;
  font-weight:700;
}
.soap .sec .hd .k{
  width:25px;
  height:25px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:8px;
  color:#003D4D;
  background:#A5F3FC;
  box-shadow:var(--shadow-inset);
  font-size:13px;
}
.soap .sec .hd small{color:var(--muted);font-size:11px;font-weight:700}
.soap .sec p{margin:0;padding:11px 14px;color:#294F5E;font-size:12.5px;line-height:1.75}
.soap .sec p .hl{color:#006A80;font-weight:700}
.adl{display:flex;flex-direction:column;gap:9px}
.adl .row{display:flex;align-items:center;gap:10px}
.adl .row span.nm{width:120px;flex:none;color:#244F60;font-size:12.5px;font-weight:700}
.adl .bar,.bt .pb{
  overflow:hidden;
  background:#DDECEF;
  box-shadow:var(--shadow-inset);
}
.adl .bar{flex:1;height:10px;border-radius:7px}
.adl .bar i{display:block;height:100%;border-radius:7px;background:#0891B2}
.adl .row b{
  width:58px;
  flex:none;
  color:#164E63;
  font-size:12px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:6px;width:2px;background:#B9E5EA}
.ti{position:relative;padding:0 0 16px 7px}
.ti::before{
  content:"";
  position:absolute;
  top:2px;
  left:-21px;
  width:12px;
  height:12px;
  border:3px solid #ECFEFF;
  border-radius:50%;
  background:#0891B2;
  box-shadow:0 0 0 1px #72CAD5;
}
.ti.done::before{background:#047857}
.ti.now::before{background:#A15C00;animation:pulse 1.8s ease-in-out infinite}
.ti .tt{color:#244F60;font-size:12.5px;font-weight:700}
.ti small{color:var(--muted);font-size:11px}
.ti .dsc{margin-top:2px;color:#3B5D69;font-size:11.5px}
.vt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px}
.vt .v{
  padding:13px 9px;
  border:1px solid rgba(8,145,178,.14);
  border-radius:13px;
  background:#EDF8FA;
  box-shadow:var(--shadow-inset);
  text-align:center;
}
.vt .v b{
  display:block;
  color:#164E63;
  font-size:23px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.vt .v span{color:var(--muted);font-size:11px}
.vt .v em{padding:1px 7px;font-size:10px;font-style:normal;font-weight:700}
.med{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid rgba(8,145,178,.15)}
.med:first-of-type{border-top:0}
.med .ck{
  width:23px;
  height:23px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:7px;
  color:#046C51;
  background:#DDF8EE;
  border:1px solid #86D8BB;
}
.med .ck.miss{color:#7A4500;background:#FFF4D6;border-color:#E9C777}
.med .mi{flex:1}.med .mi b{color:#244F60;font-size:12.5px}
.med .mi small{display:block;color:var(--muted);font-size:11px}
.budget{display:flex;flex-direction:column;gap:12px}
.bt{
  padding:13px 14px;
  border:1px solid rgba(8,145,178,.16);
  border-radius:13px;
  background:#FBFFFF;
}
.bt .h{display:flex;justify-content:space-between;margin-bottom:8px;color:#244F60;font-size:12.5px}
.bt .h b{font-weight:700;font-variant-numeric:tabular-nums}
.bt .pb{height:10px;border-radius:7px}
.bt .pb i{display:block;height:100%;border-radius:7px}
.bt small{display:block;margin-top:7px;color:var(--muted);font-size:11px}
.risk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.risk .r{
  padding:14px;
  border:1px solid rgba(8,145,178,.18);
  border-radius:14px;
  background:#FBFFFF;
  text-align:center;
}
.risk .r b{display:block;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.risk .r span{color:var(--muted);font-size:11px}
.risk .r.hi{background:#FFF1F1;border-color:#FCA5A5}.risk .r.hi b{color:#991B1B}
.risk .r.md{background:#FFF9E8;border-color:#E9C777}.risk .r.md b{color:#7A4500}
.risk .r.lo{background:#EAFBF4;border-color:#86D8BB}.risk .r.lo b{color:#046C51}
code,.mono,time,[data-id]{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.reveal{animation:reveal .36s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .body{padding-right:21px;padding-left:21px}
  .top{padding-right:21px;padding-left:21px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .shell{grid-template-columns:1fr}
  .side{
    position:static;
    height:auto;
    padding:14px;
    flex-direction:row;
    flex-wrap:wrap;
    border-right:0;
    border-bottom:1px solid rgba(8,145,178,.18);
  }
  .side .bd{width:100%;padding-bottom:12px}
  #nav{display:grid;width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .side button{justify-content:flex-start}
  .side button .bg{display:none}
  .side .foot{display:none}
  .top{top:0;padding:13px 16px}
  .top .r{width:100%;margin-left:0}
  .body{padding:19px 16px 36px}
  .g2,.g21,.two{grid-template-columns:1fr}
  .vt{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  #nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side button{padding:9px;font-size:13px}
  .side button .material-symbols-outlined{font-size:18px}
  .top h2{font-size:19px}
  .top .r{gap:7px}
  .pill,.live{padding:5px 9px;font-size:11.5px}
  .kpis{gap:10px}
  .kpi{min-height:108px;padding:14px}
  .kpi .v{font-size:24px}
  .card{padding:15px}
  .casehd{align-items:flex-start}
  .casehd small{line-height:1.55}
  .adl .row span.nm{width:92px}
  .risk{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="主要導覽">
    <div class="bd">
      <div class="lg" aria-hidden="true"><span class="material-symbols-outlined">psychology</span></div>
      <div><b>諮商個案紀錄室</b><span>COUNSELING CASEBOOK</span></div>
    </div>
    <div id="nav" role="navigation" aria-label="系統畫面"></div>
    <div class="foot">收案個案 86 位<br/>本週晤談 42 場 · 待督導 4<br/>高風險預警 2 · 已處理 1</div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h2 id="vt">個案總覽</h2><p id="vd"></p></div>
      <div class="r">
        <span class="pill"><span class="material-symbols-outlined" style="font-size:16px" aria-hidden="true">groups</span>收案 86 位</span>
        <span class="pill warm"><span class="material-symbols-outlined" style="font-size:16px" aria-hidden="true">warning</span>高風險 2</span>
        <span class="live"><i aria-hidden="true"></i>諮商紀錄同步</span>
      </div>
    </header>
    <div class="body reveal" id="view" aria-live="polite"></div>
  </main>
</div>
<script>

<div style="background:#FFF1F1;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:12.5px;line-height:1.7;border-left:4px solid #B91C1C"><b style="color:#991B1B">危機處遇：</b>李欣瑜 PHQ-9 第 9 題陽性、自傷意念浮現，已啟動危機評估流程並通報督導，安排 24 小時內危機晤談與安全計畫擬定，必要時聯繫緊急聯絡人。</div></div>`
];

let charts=[];
function disposeCharts(){
  charts.forEach(c=>{if(c&&!c.isDisposed())c.dispose()});
  charts=[];
}
function draw(i){
  if(i===0){
    const el=document.getElementById("c_risk");
    if(!el)return;
    const c=echarts.init(el);
    charts.push(c);
    c.setOption({
      animation:!window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      tooltip:{trigger:"item"},
      legend:{bottom:0,textStyle:{fontSize:11,color:"#475569"},itemWidth:11,itemHeight:11},
      series:[{
        type:"pie",
        radius:["46%","72%"],
        center:["50%","42%"],
        label:{fontSize:11,color:"#164E63",formatter:"{b}\n{d}%"},
        data:[
          {value:2,name:"高風險",itemStyle:{color:"#B91C1C"}},
          {value:5,name:"中風險",itemStyle:{color:"#A15C00"}},
          {value:38,name:"低風險 追蹤",itemStyle:{color:"#0891B2"}},
          {value:41,name:"穩定",itemStyle:{color:"#75D5DF"}}
        ]
      }]
    });
  }
  if(i===3){
    const el=document.getElementById("c_scale");
    if(!el)return;
    const c=echarts.init(el);
    charts.push(c);
    c.setOption({
      animation:!window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      grid:{left:36,right:14,top:30,bottom:26},
      tooltip:{trigger:"axis"},
      legend:{data:["PHQ-9 憂鬱","GAD-7 焦慮","ISI 失眠"],textStyle:{fontSize:10,color:"#475569"},top:0,itemWidth:12,itemHeight:8},
      xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLabel:{fontSize:10,color:"#475569"},axisLine:{lineStyle:{color:"#A5DDE4"}}},
      yAxis:{type:"value",min:0,max:24,axisLabel:{fontSize:10,color:"#475569"},splitLine:{lineStyle:{color:"#D9EEF1"}}},
      series:[
        {name:"PHQ-9 憂鬱",type:"line",smooth:true,data:[13,13,12,11,10,11,11,11],lineStyle:{color:"#087F9B",width:2.5},itemStyle:{color:"#087F9B"},symbol:"circle"},
        {name:"GAD-7 焦慮",type:"line",smooth:true,data:[12,13,11,12,10,12,13,15],lineStyle:{color:"#B91C1C",width:2.5},itemStyle:{color:"#B91C1C"},symbol:"diamond",markLine:{silent:true,data:[{yAxis:15,label:{formatter:"重度",fontSize:9,color:"#991B1B"}}],lineStyle:{color:"#B91C1C",type:"dashed"}}},
        {name:"ISI 失眠",type:"line",smooth:true,data:[18,17,16,15,14,15,14,14],areaStyle:{color:"rgba(34,211,238,.12)"},lineStyle:{color:"#059669",width:2},itemStyle:{color:"#059669"},symbol:"triangle"}
      ]
    });
  }
}
function show(i){
  disposeCharts();
  nav.querySelectorAll("button").forEach(b=>{
    const active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[i][2];
  vd.textContent=MOD[i][3];
  view.classList.remove("reveal");
  view.innerHTML=SCREENS[i]();
  void view.offsetWidth;
  view.classList.add("reveal");
  draw(i);
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  const n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
nav.addEventListener("keydown",e=>{
  const buttons=[...nav.querySelectorAll("button")];
  const current=buttons.indexOf(document.activeElement);
  if(current<0)return;
  let next=current;
  if(e.key==="ArrowDown"||e.key==="ArrowRight")next=(current+1)%buttons.length;
  else if(e.key==="ArrowUp"||e.key==="ArrowLeft")next=(current-1+buttons.length)%buttons.length;
  else if(e.key==="Home")next=0;
  else if(e.key==="End")next=buttons.length-1;
  else return;
  e.preventDefault();
  buttons[next].focus();
});
fromHash();
</script>
</body>
</html>
