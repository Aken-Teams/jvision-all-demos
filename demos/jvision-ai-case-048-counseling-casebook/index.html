<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>諮商個案紀錄室 · Counseling Casebook</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#1e1730;--accent:#6d28d9;--accent2:#8b5cf6;--bg:#f6f4fc;--card:#fff;--line:#e9e3f6;--mut:#6a6284;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--soft:#f2edfd}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#3b1470,#5b21b6);color:#ece5fb;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:0 0 20px rgba(139,92,246,.55)}
.side .lg .material-symbols-outlined{color:#fff;font-size:24px}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:#c4b5fd;letter-spacing:1.5px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#d8ccf7;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#c4b5fd}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side button .bg{margin-left:auto;font-size:11px;font-weight:800;background:#fca5a5;color:#7f1d1d;border-radius:999px;padding:1px 8px}
.side button.on .bg{background:rgba(255,255,255,.28);color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#c4b5fd;border-top:1px solid rgba(255,255,255,.12);line-height:1.7}
.main{padding:0}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.top p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--accent);background:var(--soft);border-radius:999px;padding:6px 12px}
.pill.warm{background:#fef3c7;color:#b45309}
.live{background:#ede9fe;color:#6d28d9;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#6d28d9;display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.body{padding:22px 26px 44px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px;color:var(--ok)}
.kpi .d.w{color:var(--warn)}.kpi .d.b{color:var(--bad)}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.4}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g21{grid-template-columns:.85fr 1.35fr}
.two{grid-template-columns:1fr 1fr}
.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent)}
.casehd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cav{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;flex:none}
.casehd b{font-size:19px;font-family:"Noto Sans TC"}
.casehd small{color:var(--mut);font-size:12.5px;display:block}
.lvl{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.l7{background:#fee2e2;color:#b91c1c}.l4{background:#fef3c7;color:#b45309}.l2{background:#dcfce7;color:#15803d}
.chart{height:250px}
.chart.sm{height:210px}
.cases{display:flex;flex-direction:column;gap:9px}
.cml{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;cursor:default}
.cml:hover{background:var(--soft)}
.cml .av{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none}
.cml .info{flex:1;min-width:0}
.cml .info b{font-size:13.5px;font-family:"Noto Sans TC"}
.cml .info small{display:block;color:var(--mut);font-size:11.5px}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-run{background:#ede9fe;color:#6d28d9}.t-info{background:#dbeafe;color:#1d4ed8}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--soft)}
table.data tr:hover td{background:#faf7ff}
.scroll{overflow-x:auto}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 11px 11px 0;padding:10px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}.al.info{border-color:var(--accent);background:var(--soft)}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--accent)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
/* SOAP 晤談紀錄卡 */
.soap{display:flex;flex-direction:column;gap:11px}
.soap .sec{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.soap .sec .hd{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--soft);font-family:"Noto Sans TC";font-weight:800;font-size:12.5px}
.soap .sec .hd .k{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.soap .sec .hd small{color:var(--mut);font-weight:600;font-size:11px}
.soap .sec p{margin:0;padding:10px 14px;font-size:12.5px;line-height:1.75;color:#37304d}
.soap .sec p .hl{color:var(--accent);font-weight:700}
/* 量表分數 bars */
.adl{display:flex;flex-direction:column;gap:8px}
.adl .row{display:flex;align-items:center;gap:10px}
.adl .row span.nm{font-size:12.5px;width:120px;flex:none;color:var(--ink);font-weight:600}
.adl .bar{flex:1;height:9px;background:#eee6fa;border-radius:6px;overflow:hidden}
.adl .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.adl .row b{font-size:12px;width:52px;text-align:right;flex:none}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 6px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.done::before{background:var(--ok)}.ti.now::before{background:var(--warn);animation:pulse 1.4s infinite}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:11.5px;color:#4a4160;margin-top:2px}
/* 量表施測 vt */
.vt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.vt .v{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.vt .v b{display:block;font-size:22px;font-weight:900;font-family:Inter}
.vt .v span{font-size:11px;color:var(--mut)}
.vt .v em{font-size:10px;font-weight:800;font-style:normal;padding:1px 7px;border-radius:20px}
/* 處遇任務 */
.med{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.med:first-child{border-top:0}
.med .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;background:#dcfce7;color:#15803d}
.med .ck.miss{background:#fef3c7;color:#b45309}
.med .mi{flex:1}.med .mi b{font-size:12.5px;font-family:"Noto Sans TC"}.med .mi small{display:block;color:var(--mut);font-size:11px}
/* 處遇計畫進度 */
.budget{display:flex;flex-direction:column;gap:12px}
.bt{border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.bt .h{display:flex;justify-content:space-between;font-size:12.5px;font-family:"Noto Sans TC";margin-bottom:8px}
.bt .h b{font-weight:800}
.bt .pb{height:10px;background:#eee6fa;border-radius:6px;overflow:hidden}
.bt .pb i{display:block;height:100%;border-radius:6px}
.bt small{font-size:11px;color:var(--mut);display:block;margin-top:6px}
/* 風險量表 */
.risk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.risk .r{border-radius:14px;padding:14px;text-align:center;border:1px solid var(--line)}
.risk .r b{display:block;font-size:26px;font-weight:900;font-family:Inter}
.risk .r span{font-size:11px;color:var(--mut)}
.risk .r.hi{background:#fef2f2;border-color:#fecaca}.risk .r.hi b{color:var(--bad)}
.risk .r.md{background:#fffbeb;border-color:#fde68a}.risk .r.md b{color:var(--warn)}
.risk .r.lo{background:#f0fdf4;border-color:#bbf7d0}.risk .r.lo b{color:var(--ok)}
.hamb{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side button .bg{display:none}.side .foot{display:none}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g21,.two{grid-template-columns:1fr}.vt{grid-template-columns:repeat(2,1fr)}.risk{grid-template-columns:1fr}}
@media(max-width:480px){.top{padding:12px 14px}.body{padding:16px 13px 30px}.adl .row span.nm{width:92px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg"><span class="material-symbols-outlined">psychology</span></div><div><b>諮商個案紀錄室</b><span>COUNSELING CASEBOOK</span></div></div>
    <div id="nav"></div>
    <div class="foot">收案個案 86 位<br/>本週晤談 42 場 · 待督導 4<br/>高風險預警 2 · 已處理 1</div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h2 id="vt">個案總覽</h2><p id="vd"></p></div>
      <div class="r"><span class="pill"><span class="material-symbols-outlined" style="font-size:16px">groups</span>收案 86 位</span><span class="pill warm">高風險 2</span><span class="live"><i></i>諮商紀錄同步</span></div>

</div>
<script>
const MOD=[["個案總覽","dashboard","個案總覽","收案概況、風險分布與本週晤談排程一覽",""],
["個案管理","folder_shared","個案管理 · 收案評估","個案基本資料、主訴脈絡與收案分級",""],
["晤談紀錄","psychology","晤談紀錄 · SOAP","結構化 SOAP 晤談紀錄與歷次會談脈絡",""],
["評估量表","assignment","心理評估量表","PHQ-9 / GAD-7 施測、計分與分數趨勢",""],
["處遇計畫","checklist","處遇計畫","諮商目標、介入策略與成效追蹤",""],
["風險督導","crisis_alert","風險預警 · 督導","自傷/危機風險分級、督導審閱與轉介","2"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0]+(m[5]?'<span class="bg">'+m[5]+'</span>':'');b.onclick=()=>show(i);nav.appendChild(b);});

const CASES=[["林宜靜","女 · 29 歲 · 職場適應","焦慮 · 中重度","l7","高風險","t-bad","GAD-7 15"],["陳柏勳","男 · 34 歲 · 婚姻議題","憂鬱 · 中度","l4","晤談中","t-run","PHQ-9 12"],["王詩涵","女 · 22 歲 · 學業壓力","焦慮 · 輕度","l2","穩定","t-ok","GAD-7 6"],["張家豪","男 · 41 歲 · 失眠困擾","憂鬱 · 中度","l4","待回訪","t-warn","PHQ-9 11"],["李欣瑜","女 · 18 歲 · 自我認同","混合 · 中重度","l7","高風險","t-bad","PHQ-9 17"],["黃志明","男 · 52 歲 · 職涯轉換","壓力 · 輕度","l2","結案評估","t-info","PHQ-9 5"]];
const KPI=[["收案個案","86","位","▲ 本月 +7",""],["本週晤談","42","場","出席率 91%",""],["高風險待處理","2","件","1 自傷 · 1 危機","b"],["平均量表降幅","-34","%","▲ 8 週療程","ok"]];
const ALERTS=[["林宜靜 GAD-7 升至 15 分","焦慮升高並提及恐慌發作，已排本週加開晤談","bad"],["李欣瑜 PHQ-9 第 9 題陽性","自傷意念題項勾選，已啟動危機評估並通報督導","bad"],["張家豪 逾 3 週未回訪","上次晤談 07/22，處遇計畫追蹤逾期","warn"],["陳柏勳 處遇計畫將屆期","8 次療程即將完成，建議安排成效複評","info"]];

const SUBROWS=[["主訴問題","工作高壓引發持續焦慮、入睡困難與胸悶，近一週出現兩次恐慌發作。"],["發展背景","家中長女，長期承擔家庭期待，完美主義傾向明顯，缺乏情緒宣洩管道。"],["過往病史","無精神科住院史；半年前曾短期服用抗焦慮藥物，現已停藥。"],["支持系統","與伴侶同住關係穩定；工作環境支持薄弱，主管期待壓力大。"]];
const SCALEROWS=[["PHQ-9 憂鬱量表",44,"11 / 27 · 中度"],["GAD-7 焦慮量表",71,"15 / 21 · 重度"],["ISI 失眠嚴重度",56,"14 / 28 · 中度"],["自我效能感",38,"偏低"]];

const SOAP=[["S","主觀陳述 Subjective","個案表示「這禮拜又發作了兩次，心跳很快、喘不過氣，覺得快撐不下去」。主訴<span class=\"hl\">工作壓力持續累積</span>，夜間反覆思考待辦事項導致入睡困難，睡眠約 4 小時。"],["O","客觀觀察 Objective","晤談中語速偏快、雙手交握、數度停頓拭淚；情緒張力高但<span class=\"hl\">現實感良好、無立即自傷意念</span>。GAD-7 由上週 12 分升至 15 分，PHQ-9 維持 11 分。"],["A","評估 Assessment","符合廣泛性焦慮表現並合併<span class=\"hl\">恐慌發作</span>；認知上呈現災難化與過度責任歸因。整體風險評估為中度，需密切追蹤恐慌頻率與睡眠品質。"],["P","處置計畫 Plan","本週加開一次晤談；導入<span class=\"hl\">腹式呼吸與漸進式肌肉放鬆</span>，指派情緒紀錄家庭作業；評估是否轉介身心科藥物協談。下次晤談 08/18。"]];
const SESSTL=[["第 6 次晤談 · SOAP","08/13 · 諮商師 蘇雅文","焦慮升高並出現恐慌，導入放鬆技巧，本週加開晤談","now"],["第 5 次晤談","08/06 · 諮商師 蘇雅文","探討完美主義與家庭期待，情緒覺察練習","done"],["第 4 次晤談","07/30 · 諮商師 蘇雅文","建立情緒溫度計，練習辨識焦慮觸發情境","done"],["第 3 次晤談","07/23 · 諮商師 蘇雅文","釐清工作壓力源，設定短期可行目標","done"],["收案初談","07/09 · 諮商師 蘇雅文","完成收案評估，施測 PHQ-9=13、GAD-7=12","done"]];

const PLAN=[["降低焦慮症狀","放鬆訓練＋認知重建，GAD-7 降至 10 分以下",65,"進行中 · 第 6/12 次","#6d28d9"],["改善睡眠品質","睡眠衛生教育與刺激控制法",50,"進行中 · ISI 目標 ≤ 10","#8b5cf6"],["調整完美主義認知","辨識自動化思考、練習自我慈悲",40,"進行中","#16a34a"],["建立支持系統","伴侶溝通與職場界線設定",30,"起步 · 家庭作業中","#f59e0b"]];

function draw(i){

  if(i==3){const c=echarts.init(document.getElementById('c_scale'));c.setOption({grid:{left:36,right:14,top:26,bottom:26},tooltip:{trigger:'axis'},legend:{data:['PHQ-9 憂鬱','GAD-7 焦慮','ISI 失眠'],textStyle:{fontSize:10},top:0,itemWidth:12,itemHeight:8},xAxis:{type:'category',data:['W1','W2','W3','W4','W5','W6','W7','W8'],axisLabel:{fontSize:10}},yAxis:{type:'value',min:0,max:24,axisLabel:{fontSize:10}},series:[

    {name:'GAD-7 焦慮',type:'line',smooth:true,data:[12,13,11,12,10,12,13,15],lineStyle:{color:'#ef4444',width:2.5},itemStyle:{color:'#ef4444'},markLine:{silent:true,data:[{yAxis:15,label:{formatter:'重度',fontSize:9}}],lineStyle:{color:'#ef4444',type:'dashed'}}},
    {name:'ISI 失眠',type:'line',smooth:true,data:[18,17,16,15,14,15,14,14],areaStyle:{color:'rgba(139,92,246,.12)'},lineStyle:{color:'#8b5cf6',width:2},itemStyle:{color:'#8b5cf6'}}]});}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
