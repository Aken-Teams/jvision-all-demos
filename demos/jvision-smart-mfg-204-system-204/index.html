<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產線排班管理系統（三班制排班）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0d9488;--accent2:#2dd4bf;--ink:#0f2f2c;--muted:#5b7a76;
  --bg:#f1f6f5;--card:#ffffff;--line:#dbe9e7;--soft:#effbf9;
}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Inter",system-ui,sans-serif;overflow-x:hidden}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.shell{display:flex;min-height:100vh;align-items:stretch}
.shell>*{min-width:0}
.side{width:236px;flex:none;background:linear-gradient(180deg,#ffffff,#f6fdfc);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(13,148,136,.32)}
.brand .logo .ms{font-size:22px}
.brand b{font-size:15px;font-weight:900;letter-spacing:.3px;line-height:1.25}
.brand span{font-size:11px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;min-width:0}
.nav button .ms{font-size:20px;flex:none}
.nav button .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(13,148,136,.28)}
.side .foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}
.main{flex:1;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:21px;font-weight:900;letter-spacing:.4px}
.top p{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.top .who{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink)}
.top .who .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(45,212,191,.25);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .lb .ms{font-size:16px;color:var(--accent)}
.kpi .v{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:.5px}
.kpi .v small{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .sub{font-size:11px;font-weight:700;margin-top:5px}
.up{color:#0d9488}.down{color:#e11d48}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gridm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;min-width:0}
.card h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.card h3 .ms{font-size:18px;color:var(--accent)}
.card .cap{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:13px}
.chart{width:100%;height:250px;overflow:hidden}
.chartS{width:100%;height:200px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
td{font-weight:600}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.t-day{background:#fef3c7;color:#b45309}.t-eve{background:#e0e7ff;color:#4338ca}.t-night{background:#e0f2fe;color:#0369a1}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:var(--soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:999px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:70px repeat(7,1fr);gap:6px;min-width:640px}
.cal .hd{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:6px 0}
.cal .rl{font-size:11px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:8px}
.cell{border-radius:9px;padding:8px 6px;font-size:11px;font-weight:800;text-align:center;color:#fff;line-height:1.5}
.c-day{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.c-eve{background:linear-gradient(135deg,#6366f1,#818cf8)}
.c-night{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.c-off{background:#eef4f3;color:var(--muted)}
.cell small{display:block;font-weight:600;opacity:.9;font-size:9.5px}
.mx{display:grid;grid-template-columns:120px repeat(6,1fr);gap:5px;min-width:640px}
.mx .h{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;padding:4px 2px;white-space:nowrap}
.mx .nm{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.mx .lv{height:34px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.l3{background:#0d9488}.l2{background:#5eb0aa}.l1{background:#a9d6d1;color:#0f2f2c}.l0{background:#eef4f3;color:#9fb5b2}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:14px;position:relative;padding-bottom:20px}
.step:before{content:"";position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:var(--line)}
.step:last-child:before{display:none}
.step .dot{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;z-index:1}
.step.done .dot{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.step.now .dot{background:#fff;border:2px solid var(--accent);color:var(--accent)}
.step.wait .dot{background:#eef4f3;color:var(--muted)}
.step .bd{padding-top:4px}
.step .bd b{font-size:13.5px;font-weight:800}
.step .bd p{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.rulebox{background:var(--soft);border:1px dashed var(--accent2);border-radius:11px;padding:12px 14px;font-size:12px;font-weight:700;color:var(--ink);line-height:1.7}
.rulebox .id{color:var(--accent);font-weight:900}
.gauge{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.req{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:12.5px;font-weight:700}
.stepc{display:flex;align-items:center;gap:6px}
.stepc button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:900;color:var(--accent);cursor:pointer;font-size:15px}
.stepc b{min-width:34px;text-align:center;font-size:14px}
.audit{list-style:none}
.audit li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;align-items:center}
.audit li:last-child{border-bottom:0}
.audit .ic{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.audit .ic .ms{font-size:16px}
.audit time{color:var(--muted);font-weight:700;font-size:11px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;font-family:inherit;font-weight:800;font-size:12.5px;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent2)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini .m{background:var(--soft);border-radius:11px;padding:11px 12px}
.mini .m b{font-size:19px;font-weight:900;display:block}
.mini .m span{font-size:10.5px;color:var(--muted);font-weight:700}
@media(max-width:1080px){.grid2,.gridm{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px;gap:8px}
  .brand{padding:0;margin-right:8px}
  .side .foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:auto}
  .nav button{width:auto;padding:9px 12px}
  .main{padding:18px 16px 34px}
}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}}
@media(max-width:560px){
  .nav button .tx{display:none}
  .nav button{padding:9px 11px}
  .kpis{grid-template-columns:1fr 1fr}
  .top h1{font-size:18px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="ms">calendar_month</span></div>
      <div><b>班務排</b><br><span>三班制排班平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">產線排班管理系統 v2.4<br>資料為示範假資料</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="ttl">排班總覽儀表板</h1>
        <p id="sub">三班制人力達成率、缺口與工時概況一覽</p>
      </div>
      <div class="who"><span class="dot"></span>陳志明 · 產線主管 · A 廠</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
var ECH=window.echarts;
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=ECH.init(el);c.setOption(opt);charts.push(c);}

function shiftTag(t){var m={早:'t-day',中:'t-eve',夜:'t-night'};return '<span class="tag '+(m[t]||'t-info')+'">'+t+'班</span>';}
function kpi(ic,lb,val,u,cls,sub){return '<div class="kpi"><div class="lb"><span class="ms">'+ic+'</span>'+lb+'</div><div class="v">'+val+'<small>'+u+'</small></div><div class="sub '+(cls||'')+'">'+sub+'</div></div>';}

/* ---------- Screen 0 : Dashboard ---------- */
function s0(v){
  v.innerHTML=''
  +'<div class="kpis">'
  + kpi('groups','排班達成率','98.2','%','up','▲ 3.4% 較上週')
  + kpi('warning','班表缺口','5','班','down','▼ 較上週 -8')
  + kpi('history','換班待審','7','件','','平均 1.2 天結案')
  + kpi('schedule','平均週工時','41.6','hr','up','法規上限 48hr')
  +'</div>'
  +'<div class="grid2">'
  +'<div class="card"><h3><span class="ms">stacked_bar_chart</span>各產線三班人力配置</h3><div class="cap">本週每日三班次到位人數（人）</div><div id="c0a" class="chart"></div>'
  +'<div class="legend"><span><i style="background:#f59e0b"></i>早班 06-14</span><span><i style="background:#6366f1"></i>中班 14-22</span><span><i style="background:#0ea5e9"></i>夜班 22-06</span></div></div>'
  +'<div class="card"><h3><span class="ms">donut_large</span>技能覆蓋率</h3><div class="cap">各工站合格人力占需求比例</div><div id="c0b" class="chartS"></div></div>'
  +'</div>'
  +'<div class="grid2" style="margin-top:16px">'
  +'<div class="card"><h3><span class="ms">warning</span>今日人力缺口告警</h3><div class="cap">低於最低配置需優先補班</div><div style="overflow-x:auto"><table><thead><tr><th>產線</th><th>班別</th><th>需求</th><th>到位</th><th>缺口</th><th>狀態</th></tr></thead><tbody>'
  + gapRow('SMT-1','夜',12,10,2,'bad')
  + gapRow('組裝-A','中',18,17,1,'warn')
  + gapRow('包裝-B','早',10,10,0,'ok')
  + gapRow('測試-C','夜',8,6,2,'bad')
  + gapRow('組裝-B','早',18,18,0,'ok')
  +'</tbody></table></div></div>'
  +'<div class="card"><h3><span class="ms">trending_up</span>排班達成率趨勢</h3><div class="cap">近 6 週排班達成率 (%)</div><div id="c0c" class="chartS"></div></div>'
  +'</div>';
  void v.offsetHeight;
  mk('c0a',{grid:{left:38,right:12,top:18,bottom:24},tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:['一','二','三','四','五','六','日'],axisLine:{lineStyle:{color:'#cbd5d1'}},axisLabel:{color:'#5b7a76'}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#eef4f3'}},axisLabel:{color:'#5b7a76'}},
    series:[
      {name:'早班',type:'bar',stack:'s',data:[38,40,39,41,40,22,20],itemStyle:{color:'#f59e0b'},barWidth:'52%'},
      {name:'中班',type:'bar',stack:'s',data:[36,37,38,37,39,20,18],itemStyle:{color:'#6366f1'}},
      {name:'夜班',type:'bar',stack:'s',data:[30,31,29,30,31,16,15],itemStyle:{color:'#0ea5e9'}}
    ]});
  mk('c0b',{tooltip:{trigger:'item'},series:[{type:'pie',radius:['52%','76%'],center:['50%','50%'],avoidLabelOverlap:false,
    label:{formatter:'{b}\n{d}%',fontSize:11,color:'#5b7a76'},labelLine:{length:8,length2:6},
    data:[
      {value:96,name:'SMT',itemStyle:{color:'#0d9488'}},
      {value:88,name:'組裝',itemStyle:{color:'#2dd4bf'}},
      {value:82,name:'測試',itemStyle:{color:'#5eb0aa'}},
      {value:74,name:'包裝',itemStyle:{color:'#a9d6d1'}}
    ]}]});
  mk('c0c',{grid:{left:36,right:14,top:18,bottom:24},tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:['W1','W2','W3','W4','W5','W6'],axisLine:{lineStyle:{color:'#cbd5d1'}},axisLabel:{color:'#5b7a76'}},
    yAxis:{type:'value',min:85,max:100,splitLine:{lineStyle:{color:'#eef4f3'}},axisLabel:{color:'#5b7a76',formatter:'{value}%'}},
    series:[{type:'line',smooth:true,data:[89,91,92,95,96,98.2],symbolSize:7,
      lineStyle:{width:3,color:'#0d9488'},itemStyle:{color:'#0d9488'},
      areaStyle:{color:new ECH.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(45,212,191,.35)'},{offset:1,color:'rgba(45,212,191,0)'}])}}]});
}
function gapRow(l,s,req,got,gap,st){var stt={ok:['t-ok','已達標'],warn:['t-warn','注意'],bad:['t-bad','需補班']}[st];
  return '<tr><td>'+l+'</td><td>'+shiftTag(s)+'</td><td>'+req+'</td><td>'+got+'</td><td style="font-weight:900;color:'+(gap>0?'#be123c':'#047857')+'">'+(gap>0?'-'+gap:'0')+'</td><td><span class="tag '+stt[0]+'">'+stt[1]+'</span></td></tr>';}

/* ---------- Screen 1 : Capacity & shift setup ---------- */
function s1(v){
  v.innerHTML=''
  +'<div class="gridm">'
  +'<div class="card"><h3><span class="ms">factory</span>訂單產能需求</h3><div class="cap">依交期換算所需產能與人力（本週 W34）</div>'
  +'<div style="overflow-x:auto"><table><thead><tr><th>工單</th><th>產品</th><th>需求量</th><th>交期</th><th>人時/千件</th><th>需求人力</th></tr></thead><tbody>'
  + '<tr><td>WO-2411</td><td>控制板 A</td><td>32,000</td><td>08/19</td><td>6.2</td><td style="font-weight:900">31 人</td></tr>'
  + '<tr><td>WO-2412</td><td>感測模組</td><td>18,500</td><td>08/20</td><td>5.4</td><td style="font-weight:900">22 人</td></tr>'
  + '<tr><td>WO-2413</td><td>電源模組</td><td>26,000</td><td>08/21</td><td>4.8</td><td style="font-weight:900">25 人</td></tr>'
  + '<tr><td>WO-2414</td><td>連接器</td><td>44,000</td><td>08/22</td><td>2.1</td><td style="font-weight:900">18 人</td></tr>'
  +'</tbody></table></div></div>'
  +'<div class="card"><h3><span class="ms">tune</span>三班制班別設定</h3><div class="cap">各班別時段與最低人力配置</div>'
  +'<div class="req">'
  + reqRow('早','06:00 – 14:00',40)
  + reqRow('中','14:00 – 22:00',36)
  + reqRow('夜','22:00 – 06:00',30)
  +'</div>'
  +'<div class="rulebox" style="margin-top:16px"><span class="id">RULE-01</span>　班別低於最低人力配置時，系統自動列入「優先補班」清單並通知主管。</div>'
  +'<div class="mini"><div class="m"><b>四班二輪</b><span>輪班模式</span></div><div class="m"><b>2 天</b><span>連續夜班上限</span></div><div class="m"><b>11 hr</b><span>班間最短間隔</span></div></div>'
  +'</div>'
  +'</div>'
  +'<div class="card" style="margin-top:16px"><h3><span class="ms">bar_chart</span>各班別產能需求對照最低人力</h3><div class="cap">需求人力（換算）vs 最低配置門檻（人）</div><div id="c1a" class="chart"></div></div>';
  void v.offsetHeight;
  mk('c1a',{grid:{left:40,right:16,top:26,bottom:26},tooltip:{trigger:'axis'},legend:{data:['需求人力','最低配置'],top:0,textStyle:{color:'#5b7a76'}},
    xAxis:{type:'category',data:['早班','中班','夜班'],axisLine:{lineStyle:{color:'#cbd5d1'}},axisLabel:{color:'#5b7a76'}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#eef4f3'}},axisLabel:{color:'#5b7a76'}},
    series:[
      {name:'需求人力',type:'bar',data:[43,38,31],barWidth:'32%',itemStyle:{color:'#0d9488',borderRadius:[6,6,0,0]}},
      {name:'最低配置',type:'bar',data:[40,36,30],barWidth:'32%',itemStyle:{color:'#a9d6d1',borderRadius:[6,6,0,0]}}
    ]});
}
function reqRow(s,tm,n){return '<div>'+shiftTag(s)+' <span style="color:#5b7a76;font-weight:600;margin-left:6px">'+tm+'</span></div><div class="stepc"><button>−</button><b>'+n+'</b><button>＋</button></div>';}

/* ---------- Screen 2 : Skill matrix ---------- */
function s2(v){
  var stations=['SMT','錫膏印刷','AOI 檢測','組裝','測試','包裝'];
  var emp=[
    ['王O茂',[3,3,2,2,1,0]],
    ['林淑芬',[2,3,3,3,2,1]],
    ['張偉倫',[1,2,2,3,3,2]],
    ['陳美玲',[0,1,2,3,3,3]],

  {icon:"groups",name:"技能矩陣",ttl:"人力技能矩陣",sub:"員工技能證照對應產線工站與可上班別",fn:s2},
  {icon:"account_tree",name:"自動排班",ttl:"自動排班引擎",sub:"規則引擎依技能與工時法規自動產生班表",fn:s3},
  {icon:"history",name:"換班代班",ttl:"換班代班申請",sub:"員工提出換班代班、主管線上審核與追蹤",fn:s4},
  {icon:"fact_check",name:"發佈稽核",ttl:"班表發佈與稽核",sub:"確認發佈班表並留存工時法規稽核紀錄",fn:s5}
];
function buildNav(){var n=document.getElementById('nav');var h='';
  for(var i=0;i<SCREENS.length;i++){h+='<button data-i="'+i+'"><span class="ms">'+SCREENS[i].icon+'</span><span class="tx">'+SCREENS[i].name+'</span></button>';}
  n.innerHTML=h;
  var btns=n.querySelectorAll('button');
  for(var j=0;j<btns.length;j++){btns[j].addEventListener('click',function(){show(+this.getAttribute('data-i'));});}
}
function show(i){
  clearCharts();
  var s=SCREENS[i];
  document.getElementById('ttl').textContent=s.ttl;
  document.getElementById('sub').textContent=s.sub;
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle('on',+btns[b].getAttribute('data-i')===i);
  var view=document.getElementById('view');
  s.fn(view);
  void view.offsetHeight;
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
