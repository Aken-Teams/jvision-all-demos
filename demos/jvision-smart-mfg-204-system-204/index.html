<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產線排班管理系統（三班制排班）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--color-primary:#0D9488;
--color-on-primary:#000000;
--color-secondary:#2DD4BF;
--color-on-secondary:#0F172A;
--color-accent:#D97706;
--color-on-accent:#000000;
--color-background:#F0FDFA;
--color-foreground:#134E4A;
--color-card:#FFFFFF;
--color-card-foreground:#134E4A;
--color-muted:#E8F1F4;
--color-muted-foreground:#475569;
--color-border:#5EEAD4;
--color-destructive:#DC2626;
--color-on-destructive:#FFFFFF;
--color-ring:#0D9488;
--blue:#0D9488;
--ink:#134E4A;
--muted:#475569;
--line:#5EEAD4;
--amber:#D97706;
--violet:#5B4BB7;
--sky:#0369A1;
--success:#047857;
--surface-2:#CCFBF1;
--radius:8px;
--serif:"Crimson Pro","Cormorant Garamond","Noto Serif TC","PingFang TC",serif;
--display:"Cinzel","Crimson Pro","Noto Serif TC",serif;
--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace
}
html{background:var(--color-background);scroll-behavior:smooth}
body{
min-width:320px;
background:var(--color-background);
color:var(--color-foreground);
font-family:var(--serif);
font-size:16px;
line-height:1.45;
overflow-x:hidden
}
button,input,select,textarea{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
outline:3px solid var(--color-ring);
outline-offset:3px
}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{
position:sticky;
top:0;
height:100vh;
display:flex;
flex-direction:column;
gap:20px;
padding:22px 16px;
background:var(--color-card);
border-right:2px solid var(--color-border)
}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;border-bottom:1px solid var(--color-border)}
.logo{
width:42px;height:42px;flex:none;display:grid;place-items:center;
background:var(--color-primary);color:#001C19;border:2px solid #087F74;border-radius:6px
}
.logo svg{width:23px;height:23px}
.brand b{display:block;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.08em}
.brand span{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
width:100%;min-height:46px;display:flex;align-items:center;gap:11px;
padding:10px 12px;border:1px solid transparent;border-radius:6px;
background:transparent;color:var(--muted);text-align:left;font-weight:600;
transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.nav button svg{width:19px;height:19px;flex:none;stroke-width:1.9}
.nav button:hover{background:var(--color-muted);color:var(--ink);border-color:var(--line)}
.nav button.on{
background:var(--color-primary);
color:#001C19;
border-color:#087F74
}
.nav .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:auto;padding:15px 7px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.65}
.main{min-width:0;padding:24px clamp(16px,2.4vw,36px) 48px}
.top{
display:flex;align-items:center;justify-content:space-between;gap:18px;
padding-bottom:18px;margin-bottom:16px;border-bottom:2px solid var(--line)
}
.eyebrow{
display:flex;align-items:center;gap:7px;color:var(--color-primary);
font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase
}
.eyebrow:before{content:"";width:22px;height:3px;background:var(--color-accent)}
.top h1{font-size:clamp(25px,2.5vw,34px);font-weight:600;line-height:1.12;letter-spacing:.02em;margin-top:5px}
.top p{color:var(--muted);font-size:14px;font-weight:500;margin-top:5px}
.who{
display:flex;align-items:center;gap:9px;min-height:42px;padding:8px 12px;
border:1px solid var(--line);border-radius:6px;background:var(--card,#fff);
font-size:13px;font-weight:600;white-space:nowrap
}
.who .dot{width:9px;height:9px;background:var(--success);border:2px solid #A7F3D0;border-radius:50%}
.page-actions{display:flex;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{
position:relative;min-width:0;padding:14px 15px;background:var(--color-card);
border:1px solid var(--line);border-top:4px solid var(--color-primary);border-radius:var(--radius)
}
.kpi:nth-child(2){border-top-color:var(--color-accent)}
.kpi .lb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .lb svg{width:17px;height:17px;color:var(--color-primary)}
.kpi .v{margin-top:7px;font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.kpi .v small{margin-left:4px;color:var(--muted);font-family:var(--serif);font-size:12px;font-weight:600}
.kpi .sub{margin-top:7px;font-size:12px;font-weight:600}
.up{color:var(--success)}.down{color:#B91C1C}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px}
.gridm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{
min-width:0;padding:16px;background:var(--color-card);
border:1px solid var(--line);border-radius:var(--radius)
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:.01em}
.card h3 svg{width:18px;height:18px;color:var(--color-primary);stroke-width:2}
.card .cap{color:var(--muted);font-size:12px;font-weight:500;margin:3px 0 12px}
.chart{width:100%;height:250px;overflow:hidden}
.chartS{width:100%;height:205px;overflow:hidden}
.scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid #B8E9E1;white-space:nowrap}
th{
background:var(--color-muted);color:#334155;text-align:left;
font-size:11px;font-weight:700;letter-spacing:.04em
}
td{font-weight:500}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F7FFFD}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.code,time,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag,.pill{
display:inline-flex;align-items:center;gap:5px;min-height:25px;
padding:3px 8px;border:1px solid currentColor;border-radius:4px;
font-size:11px;font-weight:700;line-height:1
}
.tag svg{width:12px;height:12px}
.t-day{background:#FFF7D6;color:#8A4B00}
.t-eve{background:#EEEBFF;color:#4338A8}
.t-night{background:#E0F2FE;color:#075985}
.t-ok{background:#DDF8EA;color:#036B4C}
.t-warn{background:#FFF1C7;color:#8A4B00}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info,.pill{background:#E4F7F4;color:#0F766E}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px;font-weight:600}
.legend i{width:10px;height:10px;display:inline-block;margin-right:5px;border:1px solid rgba(0,0,0,.28);vertical-align:-1px}
.cal{display:grid;grid-template-columns:76px repeat(7,minmax(64px,1fr));gap:5px;min-width:650px}
.cal .hd{padding:6px 0;color:var(--muted);font-size:11px;font-weight:700;text-align:center}
.cal .rl{display:flex;align-items:center;justify-content:center;background:var(--color-muted);border:1px solid var(--line);border-radius:4px;font-size:12px;font-weight:700}
.cell{padding:7px 5px;border:1px solid currentColor;border-radius:4px;text-align:center;font-size:12px;font-weight:700;line-height:1.35}
.cell small{display:block;font-family:var(--mono);font-size:9px;font-weight:500}
.c-day{background:#FFF1B8;color:#754000}
.c-eve{background:#E5E0FF;color:#332A88}
.c-night{background:#D9F1FF;color:#075985}
.c-off{background:#EFF5F5;color:#475569}
.mx{display:grid;grid-template-columns:126px repeat(6,minmax(66px,1fr));gap:5px;min-width:650px}
.mx .h{padding:5px 2px;color:var(--muted);font-size:10px;font-weight:700;text-align:center;white-space:nowrap}
.mx .nm{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.mx .nm svg{width:15px;color:var(--color-primary)}
.mx .lv{height:34px;display:grid;place-items:center;border:1px solid currentColor;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:700}
.l3{background:#0D9488;color:#001C19}.l2{background:#83DDD1;color:#083B36}
.l1{background:#CCFBF1;color:#134E4A}.l0{background:#EFF5F5;color:#64748B}
.steps{display:flex;flex-direction:column}
.step{position:relative;display:flex;gap:13px;padding-bottom:18px}
.step:before{content:"";position:absolute;left:14px;top:31px;bottom:0;width:2px;background:var(--line)}
.step:last-child:before{display:none}
.step .dot{z-index:1;width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;font-family:var(--mono);font-size:12px;font-weight:700}
.step .dot svg{width:15px}
.step.done .dot{background:var(--color-primary);color:#001C19;border:1px solid #087F74}
.step.now .dot{background:#fff;color:var(--color-primary);border:3px solid var(--color-primary)}
.step.wait .dot{background:var(--color-muted);color:var(--muted);border:1px solid #CBD5E1}
.step .bd{padding-top:3px}.step .bd b{font-size:14px}.step .bd p{margin-top:2px;color:var(--muted);font-size:12px}
.rulebox{
padding:11px 13px;background:#FFF9E8;border:1px solid #D97706;border-left:4px solid #D97706;
border-radius:5px;color:#654000;font-size:12px;font-weight:600;line-height:1.65
}
.rulebox .id{font-family:var(--mono);font-weight:700}
.gauge{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:11px;align-items:center;font-size:13px;font-weight:600}
.stepc{display:flex;align-items:center;gap:5px}
.stepc button{
width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px;
color:var(--color-primary);font-size:17px;font-weight:700;transition:background-color .18s ease
}
.stepc button:hover{background:var(--color-muted)}
.stepc b{min-width:32px;text-align:center;font-family:var(--mono);font-size:13px}
.audit{list-style:none}
.audit li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #B8E9E1;font-size:13px;font-weight:500}
.audit li:last-child{border-bottom:0}
.audit .ic{width:28px;height:28px;flex:none;display:grid;place-items:center;background:var(--color-muted);border:1px solid var(--line);border-radius:4px;color:var(--color-primary)}
.audit .ic svg{width:15px}
.audit time{color:var(--muted);font-size:11px;white-space:nowrap}
.btn{
min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
padding:8px 14px;border:2px solid #965204;border-radius:5px;background:var(--color-accent);
color:#1F1200;font-weight:700;font-size:13px;
transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.btn svg{width:16px}
.btn:hover{background:#B96005}
.btn.ghost{background:#fff;color:#0B7168;border-color:var(--color-primary)}
.btn.ghost:hover{background:var(--color-muted)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mini .m{padding:10px;background:var(--color-muted);border:1px solid #B8E9E1;border-radius:5px}
.mini .m b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.mini .m span{color:var(--muted);font-size:11px;font-weight:600}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--color-muted);border:1px solid #CFE8E5;border-radius:5px}
.check-row svg{width:20px;flex:none}
.check-row.ok svg{color:var(--success)}.check-row.bad svg{color:#B91C1C}
.check-row b{font-size:13px}.check-row small{display:block;color:var(--muted);font-size:11px}
.engine{background:var(--color-muted);border-color:#A5DDD6}
.engine-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.engine-label svg{width:16px;color:var(--color-primary)}
.engine-value{margin-top:5px;font-family:var(--display);font-size:22px;font-weight:600}
.engine-sub{margin-top:2px;color:var(--muted);font-size:11px;font-weight:600}
.grid-item{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:.05s}.grid-item:nth-child(3){animation-delay:.1s}.grid-item:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1080px){.grid2,.gridm{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){
.shell{display:block}.side{position:static;width:auto;height:auto;padding:12px;border-right:0;border-bottom:2px solid var(--line);gap:10px}
.brand{padding:0 2px 10px}.nav{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:4px}
.nav button{justify-content:center;min-height:44px;padding:8px 5px}.nav .tx{display:none}.foot{display:none}
.main{padding:17px 12px 34px}.top{align-items:flex-start}.who{white-space:normal}.grid3{grid-template-columns:1fr}
}
@media(max-width:560px){
.top{display:block}.who{margin-top:12px;width:100%}.kpis{grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:12px}.kpi .v{font-size:24px}.card{padding:13px}.mini{grid-template-columns:1fr}
.audit li{align-items:flex-start;flex-wrap:wrap}.audit time{margin-left:38px}.btn{width:100%}
}
@media(max-width:390px){.kpis{grid-template-columns:1fr}.top h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<div class="brand">
<div class="logo" data-icon="calendar"></div>
<div><b>班務排</b><span>三班制排班平台</span></div>
</div>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
<div class="foot">產線排班管理系統 v2.4<br>資料為示範假資料</div>
</aside>
<main class="main">
<header class="top">
<div>
<div class="eyebrow">Workforce Operations</div>
<h1 id="ttl">排班總覽儀表板</h1>
<p id="sub">三班制人力達成率、缺口與工時概況一覽</p>
</div>
<div class="who"><span class="dot" aria-hidden="true"></span>陳志明 · 產線主管 · A 廠</div>
</header>
<div id="view"></div>
</main>
</div>
<script>
var ECH=window.echarts,charts=[],motionOK=!window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var ICONS={
calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg>',
dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
factory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21V10l6 3V9l6 4V5h6v16H3Z"/><path d="M7 17h2m4 0h2m4 0h2"/></svg>',
users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2"/><path d="M16 15c3 0 5 2 5 5"/></svg>',
tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="3" width="6" height="5"/><rect x="3" y="16" width="6" height="5"/><rect x="15" y="16" width="6" height="5"/><path d="M12 8v4M6 16v-4h12v4"/></svg>',
swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4m14 4H3"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="10"/></svg>',
warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3v1"/></svg>',
clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>',
pie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 3a9 9 0 1 0 10 10H11V3Z"/><path d="M15 3.9A9 9 0 0 1 20.1 9H15V3.9Z"/></svg>',
badge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="5"/><path d="m8.5 12-1 9 4.5-3 4.5 3-1-9"/></svg>',
bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m13 2-8 12h7l-1 8 8-12h-7l1-8Z"/></svg>',
inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16l2 12v4H2v-4L4 4Z"/><path d="M2 16h6l2 2h4l2-2h6"/></svg>',
rule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m16 17 2 2 4-5"/></svg>',
send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m22 2-9 20-2-9-9-2 20-9Z"/><path d="m11 13 5-5"/></svg>',
file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2h9l4 4v16H6V2Z"/><path d="M14 2v5h5M9 13h6m-6 4h6"/></svg>',
history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5m4-1v6l4 2"/></svg>',
refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7V3l-3 3a8 8 0 1 0 2 9"/></svg>',
x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.dashboard}
document.querySelector("[data-icon]").innerHTML=icon("calendar");
function clearCharts(){for(var i=0;i<charts.length;i++)try{charts[i].dispose()}catch(e){}charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;opt.animation=motionOK;var c=ECH.init(el);c.setOption(opt);charts.push(c)}
function head(ic,title,cap){return '<h3>'+icon(ic)+title+'</h3><div class="cap">'+cap+'</div>'}
function statusIcon(kind){return kind==="bad"?icon("x"):icon("check")}
function shiftTag(t){var m={早:"t-day",中:"t-eve",夜:"t-night"};return '<span class="tag '+(m[t]||"t-info")+'>'+t+'班</span>'}
function kpi(ic,lb,val,u,cls,sub){return '<div class="kpi grid-item"><div class="lb">'+icon(ic)+lb+'</div><div class="v">'+val+'<small>'+u+'</small></div><div class="sub '+(cls||"")+'">'+sub+'</div></div>'}
