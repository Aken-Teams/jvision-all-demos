<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品設計失效風險分析</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
 --color-primary:#15803D;--color-on-primary:#FFFFFF;--color-secondary:#22C55E;
 --color-on-secondary:#0F172A;--color-accent:#D97706;--color-on-accent:#000000;
 --color-background:#F0FDF4;--color-foreground:#14532D;--color-card:#FFFFFF;
 --color-card-foreground:#14532D;--color-muted:#E8F0F1;--color-muted-foreground:#475569;
 --color-border:#BBF7D0;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;
 --color-ring:#15803D;
 --blue:#15803D;--ink:#14532D;--muted:#475569;--line:#BBF7D0;
 --warning:#B45309;--danger:#B91C1C;--info:#0369A1;
 --shadow:0 14px 36px rgba(20,83,45,.08);--shadow-hover:0 18px 44px rgba(20,83,45,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Exo",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
svg{display:block}
.scroll-progress{position:fixed;left:0;top:0;z-index:100;width:100%;height:4px;background:#DCFCE7}
.scroll-progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-accent));transition:width .12s linear}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;background:rgba(255,255,255,.92);border-right:1px solid var(--line);backdrop-filter:blur(16px);display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px}
.brand-logo{width:46px;height:46px;border-radius:17px 12px 19px 13px;background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(21,128,61,.25)}
.brand-logo svg{width:25px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font:500 10px/1.5 "Roboto Mono";letter-spacing:.1em}
.nav{display:grid;gap:6px}
.nav button{width:100%;min-height:48px;border:1px solid transparent;border-radius:17px 13px 18px 14px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:11px;padding:11px 12px;text-align:left;transition:background .22s,color .22s,transform .22s,border-color .22s}
.nav button svg{width:20px;flex:none}
.nav button:hover{background:#F0FDF4;color:var(--ink);border-color:var(--line);transform:translateX(2px)}
.nav button.on{background:linear-gradient(135deg,#DCFCE7,#F0FDF4);border-color:#86EFAC;color:var(--color-primary);font-weight:700}
.nav .idx{margin-left:auto;font:500 10px "Roboto Mono";color:var(--muted)}
.side-foot{margin-top:auto;border:1px solid var(--line);border-radius:18px 13px 20px 14px;background:#F7FFF9;padding:14px;color:var(--muted);font-size:11px}
.side-foot b{color:var(--ink)}
.main{min-width:0;padding:26px clamp(18px,3vw,44px) 70px;position:relative;overflow:hidden}
.main:before,.main:after{content:"";position:fixed;pointer-events:none;border-radius:44% 56% 67% 33%/48% 40% 60% 52%;filter:blur(2px);z-index:-1}
.main:before{width:370px;height:370px;right:-140px;top:-120px;background:rgba(34,197,94,.09)}
.main:after{width:280px;height:280px;left:22%;bottom:-160px;background:rgba(217,119,6,.06)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}
.eyebrow{color:var(--color-primary);font:700 10px "Roboto Mono";letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.topbar h1{margin:0;font-size:clamp(22px,2.5vw,31px);line-height:1.2;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar h1 svg{width:28px;color:var(--color-primary)}
.sub{margin-top:5px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{min-height:36px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.86);display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.chip svg{width:16px;color:var(--color-primary)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--color-secondary);box-shadow:0 0 0 4px rgba(34,197,94,.14);animation:pulse 2.2s ease-in-out infinite}
.avatar{width:38px;height:38px;border-radius:48% 52% 58% 42%;display:grid;place-items:center;background:var(--color-primary);color:#fff;font-weight:700}
.chapter-head{margin-bottom:16px;padding:18px 20px;border:1px solid var(--line);border-radius:24px 17px 26px 18px;background:linear-gradient(120deg,rgba(255,255,255,.94),rgba(220,252,231,.76));box-shadow:var(--shadow)}
.chapter-head small{font:700 10px "Roboto Mono";letter-spacing:.14em;color:var(--color-primary)}
.chapter-head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.tile,.card{background:var(--color-card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;transition:transform .24s,box-shadow .24s,border-color .24s}
.tile:hover,.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#86EFAC}
.tile{padding:18px;border-radius:21px 15px 23px 16px;position:relative;overflow:hidden}
.tile:after{content:"";position:absolute;width:70px;height:70px;right:-25px;top:-28px;border-radius:41% 59% 62% 38%;background:#DCFCE7}
.tile .ti{width:38px;height:38px;border-radius:14px 10px 15px 11px;background:#DCFCE7;color:var(--color-primary);display:grid;place-items:center}
.tile .ti svg{width:20px}
.tile b{display:block;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.tile .tv{margin-top:2px;font:700 25px "Roboto Mono";font-variant-numeric:tabular-nums}
.tile p{margin:5px 0 0;color:var(--muted);font-size:11.5px}
.card{border-radius:24px 17px 25px 18px;padding:18px;margin-top:16px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pad0 .card-h{padding:18px 18px 13px}
.card-h h3{margin:0;display:flex;align-items:center;gap:8px;font-size:14px}
.card-h h3 svg{width:19px;color:var(--color-primary)}
.hint{color:var(--muted);font-size:11px}
.table-wrap{overflow:auto;scrollbar-color:#86EFAC transparent}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:11px 13px;background:#F0FDF4;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;text-align:left;white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid #DCFCE7;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F7FFF9}
td:first-child,.mono{font-family:"Roboto Mono";font-variant-numeric:tabular-nums}
td:nth-last-child(-n+4){font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-family:"Roboto Mono";font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid currentColor}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:#166534;background:#F0FDF4}.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#991B1B;background:#FEF2F2}.t-acc{color:#166534;background:#DCFCE7}
.t-gray{color:#475569;background:#F1F5F9}
.chart{min-height:236px}
.chapter-cta{margin:16px 0 0;display:flex;justify-content:flex-end}
.cta{min-height:44px;border:0;border-radius:16px 12px 17px 13px;padding:10px 17px;background:var(--color-accent);color:var(--color-on-accent);font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 9px 22px rgba(217,119,6,.2);transition:transform .2s,filter .2s}
.cta:hover{transform:translateY(-2px);filter:brightness(.96)}
.cta svg{width:18px}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.story-card{min-height:220px;background:#fff;border:1px solid var(--line);border-radius:28px 18px 30px 20px;padding:22px;box-shadow:var(--shadow)}
.story-card .step{font:700 11px "Roboto Mono";color:var(--color-primary);letter-spacing:.1em}
.story-card h3{font-size:20px;margin:18px 0 8px}
.story-card p{color:var(--muted);margin:0}
.story-card svg{width:32px;color:var(--color-primary);margin-top:22px}
.climax{margin-top:18px;padding:30px;border-radius:32px 20px 34px 22px;background:linear-gradient(130deg,#14532D,#15803D);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 20px 50px rgba(20,83,45,.2)}
.climax h2{margin:0 0 6px;font-size:24px}
.climax p{margin:0;color:#DCFCE7}
.fade{animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
.grid>.tile{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.grid>.tile:nth-child(2){animation-delay:.06s}.grid>.tile:nth-child(3){animation-delay:.12s}.grid>.tile:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.38}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g32{grid-template-columns:1fr}.story{grid-template-columns:1fr}}
@media(max-width:820px){
 .app{display:block}.sidebar{position:sticky;height:auto;width:100%;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:2px 4px 9px}.brand-logo{width:38px;height:38px}.brand small,.side-foot{display:none}
 .nav{display:flex;overflow-x:auto;padding-bottom:3px}.nav button{width:auto;min-width:max-content;min-height:42px;padding:8px 11px}.nav .idx{display:none}
 .main{padding:20px 15px 48px}.topbar{align-items:flex-start}.top-right{justify-content:flex-end}.chapter-head{padding:15px}
}
@media(max-width:560px){
 .g4,.g2{grid-template-columns:1fr}.topbar{display:block}.top-right{margin-top:13px}.chip:nth-child(2){display:none}
 .tile{padding:16px}.card{padding:14px}.pad0 .card-h{padding:15px}.climax{display:block;padding:23px}.climax .cta{margin-top:18px}
 th,td{padding:10px 11px}.topbar h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
 .fade,.grid>.tile{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="scroll-progress" aria-hidden="true"><i id="scrollBar"></i></div>
<div class="app">
<aside class="sidebar">
 <div class="brand">
  <div class="brand-logo" id="brandIcon"></div>
  <div><b>產品設計失效風險分析</b><small>DESIGN RISK LAB</small></div>
 </div>
 <nav class="nav" id="nav" aria-label="主要功能"></nav>
 <div class="side-foot"><b>NPD-2026-08</b><br>失效模式 148 項<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
</aside>
<main class="main">
 <header class="topbar">
  <div>
   <div class="eyebrow">Research Development Project Tracking</div>
   <h1><span id="titleIcon"></span><span id="title"></span></h1>
   <div class="sub" id="subtitle"></div>
  </div>
  <div class="top-right">
   <span class="chip"><span class="dot"></span><span>正常：系統連線</span></span>
   <span class="chip"><span id="dateIcon"></span><span class="mono">2026/08/20</span></span>
   <span class="avatar" aria-label="使用者：資">資</span>
  </div>
 </header>
 <div id="screen" class="fade"></div>
</main>
</div>
<script>
var charts=[];
var ICONS={
 risk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 2.8 19h18.4L12 3Z"/><path d="M12 9v4"/><path d="M12 16.5h.01"/></svg>',
 dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
 table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 9v11"/></svg>',
 tool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5-5L12 3.6 8.4 7.2 6.1 4.9a4 4 0 0 0 5 5L19 17.8a2 2 0 1 1-2.8 2.8l-7.9-7.9"/></svg>',
 link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>',
 journey:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h3a4 4 0 0 0 4-4V10a4 4 0 0 1 4-4"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/></svg>',
 calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>',
 circle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5 3"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>',
 science:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 3h6m-5 0v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.circle}
document.getElementById("brandIcon").innerHTML=icon("risk");
document.getElementById("dateIcon").innerHTML=icon("calendar");
var MODULES=[
 {icon:"dashboard",name:"風險總覽",sub:"RPN 分布與高風險項目",chapter:"01 · INTRO HOOK"},
 {icon:"table",name:"失效模式表",sub:"功能、失效、後果與 S/O/D 評分",chapter:"02 · PROBLEM"},
 {icon:"tool",name:"改善對策",sub:"高風險項的設計對策與再評估",chapter:"03 · JOURNEY"},
 {icon:"link",name:"連結管制",sub:"與管制計畫、測試與 PFMEA 的對應",chapter:"04 · SOLUTION"},
 {icon:"journey",name:"風險旅程",sub:"從識別、評估到閉環的完整路徑",chapter:"05 · TRACEABILITY"},
 {icon:"check",name:"閉環成果",sub:"高風險項目改善與驗證成果",chapter:"06 · CLIMAX"}
];
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function tile(ic,t,v,p){return '<article class="tile"><div class="ti">'+icon(ic)+'</div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>'}
function card(t,ic,body,hint,pad0){return '<section class="card'+(pad0?' pad0':'')+'"><div class="card-h"><h3>'+icon(ic)+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function table(h,rows){
 return '<div class="table-wrap"><table><thead><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+
 rows.map(function(r){return'<tr>'+r.map(function(c,i){return'<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'
}
function head(text){return'<div class="chapter-head"><small>'+text+'</small><p>以可追溯資料呈現失效風險、改善進度與驗證結果。</p></div>'}
function next(i,label){return'<div class="chapter-cta"><button class="cta" type="button" data-next="'+i+'">'+label+icon("arrow")+'</button></div>'}
var chartBase={chart:{toolbar:{show:false},animations:{enabled:!matchMedia("(prefers-reduced-motion: reduce)").matches},fontFamily:"Exo, sans-serif"},dataLabels:{enabled:false},grid:{borderColor:"#BBF7D0",strokeDashArray:4},tooltip:{theme:"light"}};
function push(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c)}
function bar(id,cats,data){push(id,Object.assign({},chartBase,{chart:Object.assign({},chartBase.chart,{type:"bar",height:248}),series:[{name:"項數",data:data}],xaxis:{categories:cats,labels:{style:{colors:"#475569"}}},colors:["#15803D"],plotOptions:{bar:{borderRadius:8,columnWidth:"52%"}}}))}
function donut(id,labels,data){push(id,Object.assign({},chartBase,{chart:Object.assign({},chartBase.chart,{type:"donut",height:248}),labels:labels,series:data,colors:["#15803D","#22C55E","#D97706","#65A30D","#0F766E","#84CC16"],legend:{position:"bottom"},stroke:{colors:["#fff"],width:3},plotOptions:{pie:{donut:{size:"66%"}}}}))}
function radar(id,cats,data){push(id,Object.assign({},chartBase,{chart:Object.assign({},chartBase.chart,{type:"radar",height:260}),series:[{name:"平均嚴重度",data:data}],xaxis:{categories:cats},yaxis:{show:false},colors:["#15803D"],markers:{size:4},fill:{opacity:.2}}))}
function line(id,cats,a,b){push(id,Object.assign({},chartBase,{chart:Object.assign({},chartBase.chart,{type:"line",height:260}),series:[a,b],xaxis:{categories:cats},colors:["#DC2626","#15803D"],stroke:{curve:"smooth",width:3,dashArray:[0,5]},legend:{position:"top"}}))}
function v0(){
 return head(MODULES[0].chapter)+'<div class="grid g4">'+
 tile("table","失效模式","148 項","涵蓋 24 個功能項")+
 tile("risk","RPN > 100","12 項","須提出設計對策")+
 tile("risk","嚴重度 S ≥ 9","6 項","安全或法規相關")+
 tile("chart","對策後平均 RPN","64 → 38","改善 40.6%")+
 '</div><div class="grid g32">'+card("RPN 分布","chart",'<div id="a1" class="chart"></div>',"單位：項")+
 card("失效模式類別","circle",'<div id="a2" class="chart"></div>',"共 148 項")+'</div>'+
 card("高風險失效模式（RPN > 100）","risk",table(["編號","功能","失效模式","失效後果","S","O","D","RPN","對策後 RPN","狀態"],[
 ["FM-012","輸出穩壓","輸出電壓漂移超規","客戶設備誤動作","<b>8</b>","5","4","<b class='tag t-bad'>160</b>","<b>48</b>","<span class='tag t-ok'>已改善</span>"],
 ["FM-028","過溫保護","保護未動作","元件燒毀、起火風險","<b>10</b>","3","5","<b class='tag t-bad'>150</b>","<b>40</b>","<span class='tag t-ok'>已改善</span>"],
 ["FM-041","輸入濾波","EMI 超標","無法通過認證","7","6","3","<b class='tag t-bad'>126</b>","<b>42</b>","<span class='tag t-ok'>已改善</span>"],
