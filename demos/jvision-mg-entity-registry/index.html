<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>法人實體與工商登記管理 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&amp;family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;family=Noto+Sans+TC:wght@400;500;600;700;900&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#CCFBF1;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E6FFFA;
  --hov:#F0FDFA;
  --track:#CCFBF1;
  --sidebar:#FFFFFF;
  --sidebar2:#FFFFFF;
  --side-edge:var(--color-border);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:8px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Crimson Pro","Noto Sans TC",serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tag{margin:0;font-family:"Cormorant Garamond","Noto Sans TC",serif}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}
.app{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;display:flex;flex:none;flex-direction:column;width:252px;height:100vh;padding:24px 16px;background:var(--panel);color:var(--ink);border-right:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 8px 24px;border-bottom:1px solid var(--line)}
.brand-logo{display:flex;align-items:center;justify-content:center;flex:none;width:42px;height:42px;border:2px solid var(--accent);border-radius:8px;background:var(--accent);color:#001F1C}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt b{display:block;font-size:18px;font-weight:700;letter-spacing:.04em}
.brand-txt span{display:block;margin-top:1px;color:var(--muted);font-family:"Cinzel",serif;font-size:9px;font-weight:600;letter-spacing:.16em}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:20px}
.nav button{display:flex;align-items:center;gap:11px;min-width:0;padding:11px 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:15px;font-weight:600;text-align:left;white-space:nowrap;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{border-color:var(--line);background:var(--th);color:var(--ink)}
.nav button.on{border-color:var(--accent);background:var(--accent);color:#001F1C}
.nav .idx{margin-left:auto;font-family:"Cinzel",monospace;font-size:9px;font-weight:600;opacity:.75}
.side-foot{margin-top:auto;padding:16px 9px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}
.side-foot b{color:var(--ink)}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:27px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:600}
.chip .dot{width:8px;height:8px;border:2px solid #166534;border-radius:50%;background:#22C55E;animation:pulse 2s ease-in-out infinite}
.avatar{display:flex;align-items:center;justify-content:center;flex:none;width:35px;height:35px;border:2px solid var(--ink);border-radius:50%;background:var(--color-secondary);color:var(--color-on-secondary);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:800}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card-h,.sec>h3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;padding-bottom:11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card-h .hint{color:var(--muted);font-size:12px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;border-bottom:0}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:13px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.kpi,.stat{position:relative;overflow:hidden;padding:17px 18px}
.kpi::after{content:"";position:absolute;top:0;right:0;width:44px;height:5px;background:var(--accent)}
.kpi .ico,.tile .ti{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{margin-top:4px;font-family:"Cinzel","Noto Sans TC",serif;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:600}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#166534}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
table{width:100%;border-collapse:collapse;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-variant-numeric:tabular-nums lining-nums}
th{padding:11px 13px;border-bottom:2px solid var(--accent);background:var(--th);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.04em;text-align:left;white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:var(--hov)}
tr:last-child td{border-bottom:0}
td:has(.prog),td:has(.band){min-width:150px}
.mono{font-family:"Cinzel","SFMono-Regular",Consolas,monospace;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-family:"Noto Sans TC",sans-serif;font-size:10px;font-weight:700;white-space:nowrap}
.t-ok{background:#DCFCE7;color:#166534}.t-warn{background:#FEF3C7;color:#92400E}.t-bad{background:#FEE2E2;color:#B91C1C}.t-info{background:#E0F2FE;color:#075985}.t-gray{background:#F1F5F9;color:#475569}.t-acc,.t-pink{background:#CCFBF1;color:#115E59}
.bar{height:8px;min-width:56px;overflow:hidden;border-radius:2px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:0;background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:var(--muted);font-size:11px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-24px;width:14px;height:14px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.chk:last-child{border-bottom:0}.chk .material-symbols-outlined{font-size:19px}.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.7}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;border:1px solid var(--line);border-radius:6px;background:var(--th)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:13px;font-weight:700}
.col-h .cnt{padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:10px}
.pcard{padding:11px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:5px;background:#fff}
.pcard b{font-size:14px}.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}.pcard .who{margin-top:8px;color:var(--ink)}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800}
.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:11px}.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}.lane-row .num{display:flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:5px;background:var(--accent);color:#001F1C;font-family:"Cinzel",serif;font-size:12px;font-weight:600}.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:14px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:23px;height:23px;border:2px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);font-size:10px}.steps .ln{width:20px;height:2px;background:var(--line)}.steps .s.done{border-color:var(--accent);background:var(--accent);color:#001F1C}.steps .s.cur{border-color:var(--accent);color:var(--accent);animation:pulse 1.8s ease-in-out infinite}.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:14px}.rep-row .sku span{color:var(--muted);font-size:11px}.gauge{width:110px;flex:none}.gauge .track{height:8px;overflow:hidden;border-radius:2px;background:var(--track)}.gauge .track i{display:block;height:100%;background:var(--accent)}.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;border-radius:4px;background:var(--track)}.band .rng{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent-soft)}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:2px;background:var(--accent)}
.tile{display:flex;flex-direction:column;gap:7px;padding:17px 18px;border-top:4px solid var(--accent)}.tile b{font-size:15px;font-weight:700}.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
#screen>*{animation:rise-in .38s cubic-bezier(.2,.8,.2,1) both}#screen>*:nth-child(2){animation-delay:.06s}#screen>*:nth-child(3){animation-delay:.12s}#screen>*:nth-child(4){animation-delay:.18s}
@keyframes rise-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(min-width:1140px){#screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:16px;align-items:start}#screen>*{margin-top:0!important}#screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}#screen>*:nth-child(2){grid-column:2;grid-row:2}#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}#screen>*:nth-child(3){grid-column:1;grid-row:2}#screen>*:nth-child(n+4){grid-column:1/-1}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.app{flex-direction:column}.sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:2px solid var(--line);flex-direction:row;align-items:center;flex-wrap:wrap}.brand{padding:0 12px 0 4px;border:0}.brand-logo{width:38px;height:38px}.side-foot{display:none}.nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}.nav button{min-height:44px;padding:9px 12px}.nav .idx{display:none}.main{padding:20px 16px 46px}.topbar{align-items:flex-start}}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}.dl{grid-template-columns:1fr;gap:2px}.dl dt{margin-top:9px}}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:10px}.board{grid-template-columns:1fr}.nav button .txt{display:none}.nav button{justify-content:center;width:44px;padding:8px}.topbar h1{font-size:22px}.top-right{width:100%}.chip{flex:1;justify-content:center}.tile{padding:14px}.tile .tv{font-size:20px}.card{padding:14px}}
@media(max-width:390px){.g4{grid-template-columns:1fr}.brand-txt span{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(forced-colors:active){.tag,.nav button.on,.brand-logo{border:2px solid ButtonText}.chip .dot{forced-color-adjust:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">account_balance</span></div>
      <div class="brand-txt"><b>法人實體台</b><span>ENTITY REGISTRY</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">集團 32 家法人<br/>6 個法域<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
