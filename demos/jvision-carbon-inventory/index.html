<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>碳盤查作業台 · Carbon Inventory</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0c2b33;--bg:#eef6f8;--card:#fff;--line:#d6e6ea;--mut:#5a7880;--ok:#059669;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--purple:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(8,145,178,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#e2f4f8;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1300px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#cffafe;color:#0e7490;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#0891b2;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .v small{font-size:12px}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28;font-size:30px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.15fr .85fr}
.g21{grid-template-columns:1fr 1fr}
.g31{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-cy{background:#cffafe;color:#0e7490}.t-pu{background:#ede9fe;color:#6d28d9}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eafafc}
table.data td b{font-family:"Noto Sans TC"}
table.data tr:hover td{background:#f5fbfc}
.scroll{overflow-x:auto}
/* kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.board>*{min-width:0}
.col{background:#e6f4f7;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:10px}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-family:"Noto Sans TC";font-weight:800;font-size:13px;padding:2px 4px}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 9px;color:var(--mut);font-weight:700}
.kc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;border-left:4px solid var(--accent);cursor:default}
.kc.s1{border-left-color:var(--warn)}.kc.s2{border-left-color:var(--info)}.kc.s3{border-left-color:var(--ok)}
.kc .kt{font-family:"Noto Sans TC";font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.kc .code{font-family:Inter;font-size:10px;color:var(--accent);font-weight:800}
.kc .km{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:10.5px;color:var(--mut)}
.kc .km span{display:inline-flex;align-items:center;gap:3px}
.kc .km .material-symbols-outlined{font-size:13px}
.kc .prog{height:6px;background:#eef4f6;border-radius:4px;margin-top:9px;overflow:hidden}
.kc .prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:9px;font-weight:800;display:inline-grid;place-items:center;font-family:Inter}
/* activity data list */
.dq{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dq .qi{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--card)}
.dq .qi .n{font-family:Inter;font-weight:800;font-size:23px}
.dq .qi small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.upl{display:flex;flex-direction:column;gap:9px}
.ur{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ur .ui{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.ur .mid b{font-size:12.5px;font-family:"Noto Sans TC"}
.ur .mid small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.bar{height:6px;border-radius:4px;background:#eef4f6;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
/* calc rows */
.calc{display:flex;flex-direction:column;gap:10px}
.cr{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;align-items:center}
.cr>*{min-width:0}
.cr .nm{font-family:"Noto Sans TC";font-weight:700;font-size:12.5px}
.cr .nm small{display:block;color:var(--mut);font-weight:400;font-size:10.5px;margin-top:2px}
.cr .eq{font-family:Inter;font-size:12px;color:var(--mut)}
.cr .eq b{color:var(--ink)}
.cr .res{font-family:Inter;font-weight:800;font-size:16px;color:var(--accent);text-align:right}
.cr .res small{font-size:10px;color:var(--mut);display:block;font-weight:600}
/* scope pills */
.sp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sp .spc{flex:1;min-width:150px;border:1px solid var(--line);border-radius:13px;padding:13px 15px;position:relative;overflow:hidden;background:var(--card)}
.sp .spc .ch{position:absolute;left:0;top:0;width:5px;height:100%}
.sp .spc b{font-family:"Noto Sans TC";font-size:12.5px}
.sp .spc .big{font-family:Inter;font-weight:800;font-size:22px;margin-top:5px}
.sp .spc small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
/* hotspot */
.hot{display:flex;flex-direction:column;gap:10px}
.hr{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hr .th{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hr .th b{font-family:"Noto Sans TC";font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hr .th .rk{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-family:Inter;font-weight:800;font-size:11px;display:grid;place-items:center}
.hr .hb{height:9px;background:#eef4f6;border-radius:6px;margin-top:10px;overflow:hidden}
.hr .hb i{display:block;height:100%;border-radius:6px}
.hr .meta{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.hr .meta b{color:var(--ink);font-family:Inter}
/* report */
.rpt{display:flex;flex-direction:column;gap:10px}
.rr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.rr .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.rr .mid b{font-size:13px;font-family:"Noto Sans TC"}
.rr .mid small{color:var(--mut);font-size:11px;display:block}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti:last-child{padding-bottom:0}
.ti .pt{position:absolute;left:-19px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ti.done .pt{background:var(--ok);border-color:var(--ok)}
.ti.now .pt{border-color:var(--warn);animation:pulse 1.8s ease-in-out infinite}
.ti b{font-family:"Noto Sans TC";font-size:12.5px}
.ti small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.chk{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px}
.ck .material-symbols-outlined{font-size:19px}
.ck.d .material-symbols-outlined{color:var(--ok)}.ck.p .material-symbols-outlined{color:var(--warn)}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g21,.g31{grid-template-columns:1fr}.cr{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wrap{padding:14px}.board{grid-template-columns:1fr}.cr{grid-template-columns:1fr}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>

function bar(pct,color){return '<div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div>';}
function scpTag(s){return s==='範疇一'?'t-warn':s==='範疇二'?'t-cy':'t-pu';}
