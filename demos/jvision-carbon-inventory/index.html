<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>組織碳盤查 · Carbon Inventory</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
 --color-primary:#059669;--color-on-primary:#000;--color-secondary:#10b981;
 --color-on-secondary:#0f172a;--color-accent:#059669;--color-on-accent:#000;
 --color-background:#ecfdf5;--color-foreground:#064e3b;--color-card:#fff;
 --color-card-foreground:#064e3b;--color-muted:#e8f1f3;--color-muted-foreground:#475569;
 --color-border:#a7f3d0;--color-destructive:#dc2626;--color-on-destructive:#fff;
 --color-ring:#059669;--blue:#059669;--ink:#064e3b;--muted:#475569;--line:#a7f3d0;
 --amber:#b45309;--red:#b91c1c;--violet:#6d28d9;--navy:#0f172a
}
*{box-sizing:border-box}
html{background:var(--color-background)}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.45}
button{font:inherit}
button,a,[tabindex]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto 1fr;background:#fff;border:2px solid var(--ink);border-top:0}
.brand{display:flex;align-items:center;gap:12px;padding:12px 18px;border-right:2px solid var(--ink)}
.logo{display:grid;place-items:center;width:44px;height:44px;background:var(--color-primary);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);color:#001a11;font:700 17px "Fira Code",monospace}
.brand b{display:block;font-size:16px;font-weight:700}
.brand small{display:block;margin-top:1px;color:var(--muted);font:600 10px "Fira Code",monospace;letter-spacing:.15em}
.nav{display:flex;justify-content:flex-end;overflow-x:auto}
.nav button{min-height:68px;padding:10px 14px;border:0;border-left:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--color-primary);color:#001a11;box-shadow:inset 0 -5px 0 var(--ink)}
.nav button .material-symbols-outlined{display:block;margin:0 auto 5px}
.wrap{width:min(1440px,100%);margin:auto;padding:24px}
.vh{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin-bottom:18px;padding:24px;background:var(--ink);color:#fff;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--color-primary)}
.vh h1{margin:0;font-size:clamp(25px,4vw,44px);font-weight:700;letter-spacing:-.045em}
.vh p{max-width:680px;margin:6px 0 0;color:#d1fae5;font-size:13px}
.live{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;color:var(--ink);border:2px solid var(--color-primary);font:600 11px "Fira Code",monospace}
.dot{width:10px;height:10px;background:var(--color-primary);border:2px solid var(--ink);animation:pulse 1.8s steps(2,end) infinite}
@keyframes pulse{50%{opacity:.35}}
.kpis,.quick,.scopes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi,.quick>div,.scope{position:relative;min-width:0;padding:15px;background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--line)}
.kpi:nth-child(even),.quick>div:nth-child(even){transform:translateY(5px)}
.label,.quick small,.scope small{color:var(--muted);font-size:11px;font-weight:600}
.value,.quick strong,.scope strong{display:block;margin-top:4px;font:700 25px "Fira Code",monospace;font-variant-numeric:tabular-nums}
.delta{margin-top:3px;font-size:11px;font-weight:700}
.icon-bg{position:absolute;right:10px;top:10px;color:var(--primary,var(--color-primary));font-size:29px;opacity:.5}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0;padding:17px;background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--line)}
.card+.card-row,.card.mt{margin-top:16px}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink);font-size:14px;font-weight:700}
.card h2 .material-symbols-outlined{color:var(--color-primary)}
.card h2 .tag{margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;background:#fff;font:700 10px "Fira Code",monospace;white-space:nowrap}
.ok{color:#047857;background:#d1fae5}.warn{color:#92400e;background:#fef3c7}
.bad{color:#991b1b;background:#fee2e2}.info{color:#1e40af;background:#dbeafe}
.scope2{color:#065f46;background:#a7f3d0}.scope3{color:#5b21b6;background:#ede9fe}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px}
.col{padding:9px;background:var(--color-muted);border:2px solid var(--ink)}
.col-head{display:flex;justify-content:space-between;padding:3px 2px 9px;font-weight:700;font-size:12px}
.count{min-width:24px;text-align:center;background:#fff;border:1px solid var(--ink);font:700 10px "Fira Code"}
.ticket{margin-top:8px;padding:10px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--color-primary)}
.ticket.s1{border-left-color:var(--amber)}.ticket.s2{border-left-color:#1d4ed8}.ticket.s3{border-left-color:#047857}
.ticket-title{display:flex;justify-content:space-between;gap:7px;font-size:12px;font-weight:700}
.code,.mono,table td:nth-child(1),table td:nth-child(n+4){font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.code{color:#047857;font-size:9px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;color:var(--muted);font-size:10px}
.avatar{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--ink);color:#fff;border:1px solid var(--ink);font:700 9px "Fira Code"}
.progress{height:8px;margin-top:8px;background:#fff;border:1px solid var(--ink)}
.progress i{display:block;height:100%;background:var(--color-primary)}
.note{margin:14px 0 0;padding:10px;border-left:5px solid var(--color-primary);background:var(--color-background);color:var(--muted);font-size:11px}
.list{display:grid;gap:9px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--ink);background:#fff}
.row-icon{display:grid;place-items:center;width:38px;height:38px;background:var(--color-primary);border:2px solid var(--ink);color:#001a11}
.row b{display:block;font-size:12px}.row small{display:block;color:var(--muted);font-size:10px}
.calc{display:grid;gap:8px}
.calc-row{display:grid;grid-template-columns:1.45fr 1fr 1.2fr .75fr;align-items:center;gap:10px;padding:10px;border:1px solid var(--ink)}
.calc-row b{font-size:12px}.calc-row small{display:block;color:var(--muted);font-size:10px}
.result{text-align:right;color:#047857;font:700 15px "Fira Code",monospace}
.scope{border-top:8px solid var(--scope-color,var(--color-primary))}
.scroll{overflow:auto;border:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;font-size:10px;letter-spacing:.03em}
td:nth-child(n+4):not(:last-child),th:nth-child(n+4):not(:last-child){text-align:right}
tbody tr:hover td{background:var(--color-background)}
.total td{background:#d1fae5;font-weight:700}
.hotspot{padding:11px;border:1px solid var(--ink)}
.hotspot+.hotspot{margin-top:9px}
.hot-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hot-head b{display:flex;align-items:center;gap:7px;font-size:12px}
.rank{display:grid;place-items:center;width:24px;height:24px;background:var(--ink);color:#fff;font:700 10px "Fira Code"}
.hot-value{font:700 12px "Fira Code"}
.hotbar{height:10px;margin-top:9px;background:var(--color-muted);border:1px solid var(--ink)}
.hotbar i{display:block;height:100%;background:var(--color-primary)}
.timeline{position:relative;padding-left:25px}
.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:3px;background:var(--ink)}
.step{position:relative;padding:0 0 16px}
.step:last-child{padding-bottom:0}
.step:before{content:"";position:absolute;left:-23px;top:2px;width:15px;height:15px;background:#fff;border:3px solid var(--ink)}
.step.done:before{background:var(--color-primary)}
.step.now:before{background:#fbbf24}
.step b{font-size:12px}.step small{display:block;color:var(--muted);font-size:10px}
.check{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--ink);font-size:12px}
.check+.check{margin-top:7px}.check.done .material-symbols-outlined{color:#047857}.check.pending .material-symbols-outlined{color:#92400e}
.chart{height:290px}
.view-enter>*{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.view-enter>*:nth-child(2){animation-delay:.06s}.view-enter>*:nth-child(3){animation-delay:.12s}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}}
@media(max-width:1000px){
 .top{grid-template-columns:1fr}.brand{border-right:0;border-bottom:2px solid var(--ink)}
 .nav{justify-content:flex-start}.nav button{border-left:0;border-right:1px solid var(--line);min-height:58px}
 .g3{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(2,minmax(220px,1fr))}
}
@media(max-width:768px){
 .wrap{padding:14px}.vh{grid-template-columns:1fr;padding:18px;box-shadow:5px 5px 0 var(--color-primary)}
 .kpis,.quick,.scopes{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
 .calc-row{grid-template-columns:1fr 1fr}.result{text-align:left}
}
@media(max-width:480px){
 .brand{padding:10px 13px}.nav button{padding:8px 10px}.nav button span:last-child{display:none}
 .kpis,.quick,.scopes,.board{grid-template-columns:1fr}.kpi:nth-child(even),.quick>div:nth-child(even){transform:none}
 .calc-row{grid-template-columns:1fr}.live{align-self:start}.row{grid-template-columns:34px 1fr}.row>.tag{grid-column:2}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
 <div class="brand">
  <div class="logo" aria-hidden="true">CO₂</div>
  <div><b>組織碳盤查</b><small>CARBON INVENTORY / FY2025</small></div>
 </div>
 <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
 <header class="vh">
  <div><h1 id="vt">盤查作業看板</h1><p id="vd"></p></div>
  <div class="live"><span class="dot" aria-hidden="true"></span><span id="vl">FY2025 盤查週期 · 進行中</span></div>
 </header>
 <div id="view" aria-live="polite"></div>
</main>
<script>
const MOD=[
["盤查作業看板","view_kanban","盤查作業看板","各排放源盤查進度看板與待辦指派","FY2025 盤查週期 · 進行中"],
["活動數據收集","database","活動數據收集","用油、外購電力、差旅等活動量登錄","本期活動數據 82% 已收齊"],
["排放係數與計算","functions","排放係數與計算","係數庫套用與範疇一二三 tCO₂e 計算","係數庫 2025 版 · 已同步"],
["排放清冊","inventory_2","排放清冊","彙整全組織 GHG 排放清冊明細","清冊 v3 · 待複核 6 筆"],
["熱點分析","local_fire_department","熱點分析","排放熱點與減量機會辨識排序","已辨識 5 大排放熱點"],
["查證與報告","verified","查證與報告","ISO 14064 查證軌跡與報告輸出","第三方查證 · 意見回覆中"]
];
const KAN={
"待指派":[["外購電力（總廠）","S2-ELEC-01","範疇二","—","?","10/28",0,""],["委外運輸排放","S3-TRAN-04","範疇三","—","?","11/05",0,""]],
"收集中":[["柴油鍋爐用油","S1-DIE-01","範疇一","陳志明","CM","10/22",45,"s1"],["員工商務差旅","S3-BIZ-02","範疇三","林佩珊","LP","10/25",60,"s1"],["天然氣鍋爐","S1-NG-03","範疇一","王大衛","WD","10/24",30,"s1"]],
"計算中":[["堆高機用油","S1-FRK-05","範疇一","陳志明","CM","10/20",80,"s2"],["外購蒸汽","S2-STM-02","範疇二","黃詩涵","HS","10/21",72,"s2"]],
"已完成":[["製程逸散排放","S1-FUG-06","範疇一","王大衛","WD","10/18",100,"s3"],["員工通勤","S3-COM-03","範疇三","林佩珊","LP","10/17",100,"s3"],["廢棄物處理","S3-WST-05","範疇三","黃詩涵","HS","10/16",100,"s3"]]
};
const UPL=[
["外購電力帳單 Q3","台電 3 期帳單 · 428,500 kWh","bolt","#b45309",100,"已核驗","ok"],
["柴油採購憑證","中油發票 12 張 · 128,000 L","local_gas_station","#b91c1c",100,"已核驗","ok"],
["天然氣用量表","瓦斯公司月報 · 18,900 m³","local_fire_department","#6d28d9",70,"複核中","warn"],
["商務差旅明細","機票/高鐵 86 筆 · 待補里程","flight","#1d4ed8",55,"待補件","bad"],
["員工通勤問卷","回收 312 份 · 覆蓋 91%","directions_car","#059669",91,"彙整中","scope2"],
["委外運輸單據","物流 GPS 匯出 · 42,300 tkm","local_shipping","#047857",100,"已核驗","ok"]
];
const CALC=[
["柴油鍋爐用油","範疇一 · 固定燃燒","128,000 L","× 2.606 kgCO₂e/L","333.6","tCO₂e"],
["天然氣鍋爐","範疇一 · 固定燃燒","18,900 m³","× 1.879 kgCO₂e/m³","35.5","tCO₂e"],
["堆高機用油","範疇一 · 移動燃燒","32,400 L","× 2.606 kgCO₂e/L","84.4","tCO₂e"],
["外購電力","範疇二 · 電力","428,500 kWh","× 0.474 kgCO₂e/kWh","203.1","tCO₂e"],
["外購蒸汽","範疇二 · 蒸汽","3,120 t","× 66.0 kgCO₂e/t","205.9","tCO₂e"],
["商務差旅（空運）","範疇三 · 差旅","286,000 pkm","× 0.151 kgCO₂e/pkm","43.2","tCO₂e"],
["委外運輸","範疇三 · 上游運輸","42,300 tkm","× 0.107 kgCO₂e/tkm","4.5","tCO₂e"]
];
const INV=[
["S1-DIE-01","柴油鍋爐用油","範疇一","128,000 L","2.606","333.6","已驗證","ok"],
["S1-NG-03","天然氣鍋爐","範疇一","18,900 m³","1.879","35.5","待複核","warn"],
["S1-FRK-05","堆高機用油","範疇一","32,400 L","2.606","84.4","已驗證","ok"],
["S1-FUG-06","製程逸散（R-410a）","範疇一","GWP 2088","2.088","62.6","待複核","warn"],
["S2-ELEC-01","外購電力","範疇二","428,500 kWh","0.474","203.1","已驗證","ok"],
["S2-STM-02","外購蒸汽","範疇二","3,120 t","66.0","205.9","已驗證","ok"],
["S3-BIZ-02","商務差旅","範疇三","286,000 pkm","0.151","43.2","待補件","bad"],
["S3-COM-03","員工通勤","範疇三","1.98M km","0.171","112.4","已驗證","ok"],
["S3-TRAN-04","委外運輸","範疇三","42,300 tkm","0.107","4.5","待複核","warn"],
["S3-WST-05","廢棄物處理","範疇三","62.4 t","21.3","1.3","已驗證","ok"]
];
const HOT=[
[1,"外購蒸汽","範疇二",19.5,205.9,"與去年持平"],
[2,"外購電力","範疇二",19.2,203.1,"▼ 綠電抵減 8%"],
[3,"柴油鍋爐用油","範疇一",31.6,333.6,"▲ 產能增 +6%"],
[4,"員工通勤","範疇三",10.6,112.4,"▼ 通勤車減碳 3%"],
[5,"堆高機用油","範疇一",8,84.4,"評估電動堆高機"]
];
const RPT=[
["ISO 14064-1 盤查報告書","2025 年度 · 範疇一二三清冊","description","已產出","ok"],
["第三方查證意見回覆表","含 6 項待澄清項目","forum","回覆中","warn"],
["溫室氣體排放盤查證明","環境部登錄用版本","verified","查證中","warn"],
["活動數據佐證彙編","帳單/憑證 148 份掃描檔","folder_zip","已封存","info"]
];
const VTL=[
["盤查邊界確認","組織邊界採營運控制法","done"],
["活動數據封存","148 份憑證存證","done"],
["內部自我查證","品保處完成一致性檢核","done"],
["第三方現場查證","SGS 查證員 · 意見回覆中","now"],
["查證聲明書核發","預計 11/15 取得",""]
];
const CHK=[
["活動數據完整率 ≥ 95%","done"],["排放係數採 2025 官方版本","done"],
["範疇一二三邊界完整界定","done"],["前期差異 >20% 已提出說明","pending"],
["查證機構意見已逐項回覆","pending"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view");
MOD.forEach((m,i)=>{
 const b=document.createElement("button");
 b.type="button";b.dataset.i=i;b.setAttribute("aria-label",m[0]);
 b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span>${m[0]}</span>`;
 b.onclick=()=>{location.hash=`v${i}`};nav.appendChild(b)
});
const tagScope=s=>s==="範疇一"?"warn":s==="範疇二"?"scope2":"scope3";
const tag=(text,cls)=>`<span class="tag ${cls}">${text}</span>`;
const progress=(n,c="#059669")=>`<div class="progress" role="progressbar" aria-label="完成進度 ${n}%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${n}"><i style="width:${n}%;background:${c}"></i></div>`;
const metric=(l,v,d,c="")=>`<div class="kpi"><div class="label">${l}</div><div class="value" style="${c?`color:${c}`:""}">${v}</div><div class="delta">${d}</div></div>`;
function ticket(c){return `<article class="ticket ${c[7]}"><div class="ticket-title"><span>${c[0]}</span><span class="code">${c[1]}</span></div><div class="meta">${tag(c[2],tagScope(c[2]))}<span><span class="avatar">${c[4]}</span> ${c[3]}</span><span class="mono">截止 ${c[5]}</span></div>${progress(c[6])}</article>`}
const SCREENS=[
()=>`<section class="kpis">${metric("盤查卡片總數","10","10 個排放源")}${metric("待指派","2","需指派負責人","#92400e")}${metric("收集／計算中","5","進行中作業","#1e40af")}${metric("已完成","3","▲ 進度 30%","#047857")}</section>
<section class="card"><h2><span class="material-symbols-outlined">view_kanban</span>排放源盤查看板${tag("FY2025 · 截止 11/15","scope2")}</h2><div class="scroll"><div class="board">${Object.entries(KAN).map(([n,a])=>`<section class="col"><div class="col-head"><span>${n}</span><span class="count">${a.length}</span></div>${a.map(ticket).join("")}</section>`).join("")}</div></div><p class="note">依 RULE-01：每張盤查卡片須指派唯一負責人與截止日；未上傳原始憑證之排放源不得移入「計算中」欄。</p></section>`,

()=>`<section class="scopes"><div class="scope" style="--scope-color:#b45309"><small>範疇一 直接排放</small><strong>516.1 t</strong><small>燃燒/逸散 · 48.9%</small></div><div class="scope" style="--scope-color:#059669"><small>範疇二 能源間接</small><strong>409.0 t</strong><small>外購電力/蒸汽 · 38.8%</small></div><div class="scope" style="--scope-color:#6d28d9"><small>範疇三 其他間接</small><strong>129.4 t</strong><small>差旅/運輸/廢棄 · 12.3%</small></div></section>

];
let charts=[];
function clearCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function chart(id,opt){const el=document.getElementById(id);if(el){const c=new ApexCharts(el,opt);c.render();charts.push(c)}}
const base={chart:{fontFamily:"Fira Sans",foreColor:"#475569",animations:{enabled:!matchMedia("(prefers-reduced-motion: reduce)").matches},toolbar:{show:false}},grid:{borderColor:"#a7f3d0"},legend:{position:"bottom"},dataLabels:{style:{fontFamily:"Fira Code"}}};
function draw(i){
 if(i===1)chart("c_coll",{...base,chart:{...base.chart,type:"radialBar",height:290},series:[100,100,70,55,91,100],labels:["電力","柴油","天然氣","差旅","通勤","運輸"],colors:["#b45309","#b91c1c","#6d28d9","#1d4ed8","#059669","#047857"],plotOptions:{radialBar:{hollow:{size:"30%"},dataLabels:{total:{show:true,label:"完整率",formatter:()=>"82%"}}}}});
 if(i===2)chart("c_scope",{...base,chart:{...base.chart,type:"bar",stacked:true,height:290},series:[{name:"範疇一",data:[516.1]},{name:"範疇二",data:[409]},{name:"範疇三",data:[129.4]}],colors:["#b45309","#059669","#6d28d9"],plotOptions:{bar:{horizontal:true,barHeight:"40%"}},xaxis:{categories:["總排放"]},dataLabels:{enabled:true,formatter:v=>v+"t"},tooltip:{y:{formatter:v=>v+" tCO₂e"}}});
 if(i===4){
  chart("c_radar",{...base,chart:{...base.chart,type:"radar",height:290},series:[{name:"外購電力",data:[9,8,8,6,7]},{name:"外購蒸汽",data:[8,9,6,7,6]}],labels:["減量潛力","成本效益","技術可行","實施難度","投資回收"],colors:["#059669","#b45309"],stroke:{width:3},fill:{opacity:.15},markers:{size:4},yaxis:{show:false,min:0,max:10}});
  chart("c_trend",{...base,chart:{...base.chart,type:"area",stacked:true,height:290},series:[{name:"範疇一",data:[560,548,540,530,522,516]},{name:"範疇二",data:[470,455,442,430,418,409]},{name:"範疇三",data:[158,150,145,140,134,129]}],colors:["#b45309","#059669","#6d28d9"],stroke:{width:3,curve:"straight"},fill:{type:"solid",opacity:.18},xaxis:{categories:["20上","20下","21上","21下","22上","22下"]},yaxis:{labels:{formatter:v=>v+"t"}},dataLabels:{enabled:false}})
 }
}
function show(i){
 clearCharts();i=Math.max(0,Math.min(i,5));
 nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 document.getElementById("vt").textContent=MOD[i][2];
 document.getElementById("vd").textContent=MOD[i][3];
 document.getElementById("vl").textContent=MOD[i][4];
 view.className="view-enter";view.innerHTML=SCREENS[i]();
 requestAnimationFrame(()=>draw(i))
}
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?+m[1]:0);
 try{window.scrollTo(0,0)}catch(e){}
}
addEventListener("hashchange",fromHash);
fromHash();
</script>
