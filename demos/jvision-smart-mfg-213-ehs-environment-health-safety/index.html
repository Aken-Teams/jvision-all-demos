<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>職業安全衛生管理系統（EHS）｜Jvision 系統 Demo</title>
  <meta name="description" content="危害辨識、事故通報、PPE 發放、改善追蹤與安全稽核的一站式職安衛平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#be185d; --accent2:#fb7185; --accent3:#f43f5e;
      --bg:#0b0d13; --panel:#141824; --panel2:#1b2130; --line:#28303f;
      --txt:#e7ecf4; --mut:#8b93a7; --dim:#5f6779;
      --ok:#34d399; --warn:#fbbf24; --danger:#fb7185; --info:#60a5fa;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,rgba(190,24,93,.16),transparent 60%),var(--bg);
      color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;
    }
    .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
      padding:10px 18px;background:rgba(12,14,20,.92);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
      background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
      box-shadow:0 4px 14px rgba(190,24,93,.4);}
    .logo .msi{font-size:22px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
    .brand p{font-size:11px;margin:1px 0 0;color:var(--mut);white-space:nowrap;}
    .livewrap{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
    .clock{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .livepill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);
      background:var(--panel2);border:1px solid var(--line);padding:5px 11px;border-radius:20px;white-space:nowrap;}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
    .nav{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;background:rgba(20,24,36,.6);
      border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:25;backdrop-filter:blur(6px);}
    .nav button{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;
      background:var(--panel);border:1px solid var(--line);color:var(--mut);
      padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;
      transition:.15s;white-space:nowrap;min-width:0;}
    .nav button .msi{font-size:18px}
    .nav button:hover{color:var(--txt);border-color:var(--dim);}
    .nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border-color:transparent;
      box-shadow:0 4px 14px rgba(190,24,93,.35);}
    .nav button .num{font-size:11px;opacity:.7;font-weight:800;}
    main{padding:20px 18px 48px;max-width:1500px;margin:0 auto;}
    .head{display:flex;align-items:flex-end;gap:12px;margin:0 0 18px;flex-wrap:wrap;}
    .head .ttl{font-size:21px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px;}
    .head .ttl .msi{color:var(--accent2);font-size:26px;}
    .head .sub{color:var(--mut);font-size:13px;margin:0;}
    .head .tag{margin-left:auto;font-size:12px;color:var(--accent2);background:rgba(251,113,133,.12);
      border:1px solid rgba(251,113,133,.3);padding:5px 12px;border-radius:20px;white-space:nowrap;}
    .grid{display:grid;gap:14px;}
    .kpis{grid-template-columns:repeat(4,1fr);}
    .g2{grid-template-columns:1fr 1fr;}
    .g3{grid-template-columns:1fr 1fr 1fr;}
    .g23{grid-template-columns:2fr 1fr;}
    .g32{grid-template-columns:1fr 2fr;}
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr;}
      .g2,.g3,.g23,.g32{grid-template-columns:1fr;}
      .nav{top:0;position:static;}
      .topbar{position:static;}
    }
    @media(max-width:520px){.kpis{grid-template-columns:1fr;} .navtxt{display:none;} .nav button{padding:9px 11px;}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;
      box-shadow:0 8px 24px rgba(0,0,0,.22);}
    .card.pad0{padding:0;overflow:hidden;}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .card h3 .msi{font-size:18px;color:var(--accent2);}
    .card .cd{font-size:12px;color:var(--mut);margin:0 0 12px;}
    .cardhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);}
    .cardhead h3{margin:0;}
    .kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
      border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2);}
    .kpi .kl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;}
    .kpi .kl .msi{font-size:16px;color:var(--accent2);}
    .kpi .kv{font-size:27px;font-weight:800;margin:8px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
    .kpi .kv small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px;}
    .kpi .kd{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px;}
    .kpi .up{color:var(--ok)} .kpi .down{color:var(--danger)}
    .chart{width:100%;overflow:hidden;}
    .tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
    .tbl th{text-align:left;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);
      position:sticky;top:0;background:var(--panel);white-space:nowrap;font-size:11.5px;letter-spacing:.3px;}
    .tbl td{padding:11px 12px;border-bottom:1px solid rgba(40,48,63,.6);white-space:nowrap;}
    .tbl tr:hover td{background:rgba(190,24,93,.06);}
    .tbl tr:last-child td{border-bottom:none;}
    .mono{font-variant-numeric:tabular-nums;font-weight:700;}
    .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
      padding:3px 10px;border-radius:20px;white-space:nowrap;line-height:1.5;}
    .b-red{background:rgba(251,113,133,.14);color:#fda4af;border:1px solid rgba(251,113,133,.35);}
    .b-org{background:rgba(251,146,60,.14);color:#fdba74;border:1px solid rgba(251,146,60,.3);}
    .b-yel{background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.3);}
    .b-grn{background:rgba(52,211,153,.14);color:#6ee7b7;border:1px solid rgba(52,211,153,.3);}
    .b-blu{background:rgba(96,165,250,.14);color:#93c5fd;border:1px solid rgba(96,165,250,.3);}
    .b-gry{background:rgba(139,147,167,.14);color:var(--mut);border:1px solid var(--line);}
    .b-pnk{background:rgba(190,24,93,.18);color:#f9a8c9;border:1px solid rgba(190,24,93,.4);}
    .matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:11px;}
    .matrix .mc{border-radius:7px;display:grid;place-items:center;aspect-ratio:1.5/1;font-weight:800;
      cursor:default;color:#0b0d13;position:relative;min-width:0;}
    .matrix .axis{color:var(--mut);display:grid;place-items:center;font-weight:600;font-size:10.5px;}
    .m-l{background:#34d399;} .m-m{background:#fbbf24;} .m-h{background:#fb923c;} .m-e{background:#fb7185;}
    .matrix .mc b{font-size:14px;}
    .bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px;}
    .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .tl{position:relative;padding-left:26px;}
    .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl .ev{position:relative;padding:0 0 16px;}
    .tl .ev::before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;
      background:var(--panel);border:2px solid var(--accent2);}
    .tl .ev.crit::before{background:var(--danger);border-color:var(--danger);box-shadow:0 0 0 4px rgba(251,113,133,.18);}
    .tl .ev.ok::before{background:var(--ok);border-color:var(--ok);}
    .tl .et{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;}
    .tl .eh{font-size:13.5px;font-weight:700;margin:2px 0 3px;}
    .tl .ed{font-size:12px;color:var(--mut);line-height:1.5;}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    @media(max-width:820px){.board{grid-template-columns:1fr;}}
    .col{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
    .col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px;}
    .col .ch .cnt{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--mut);}
    .tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;}
    .tk:last-child{margin-bottom:0;}
    .tk .tkt{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:7px;}
    .tk .tkm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut);}
    .tk .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none;}
    .ppe{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    @media(max-width:820px){.ppe{grid-template-columns:1fr;}}
    .ppecard{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0;}
    .ppecard .pt{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
    .ppecard .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
      background:rgba(190,24,93,.15);color:var(--accent2);}
    .ppecard .ico .msi{font-size:22px;}
    .ppecard .pn{font-size:13.5px;font-weight:700;}
    .ppecard .ps{font-size:11px;color:var(--mut);}
    .stat{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;color:var(--mut);}
    .stat b{color:var(--txt);font-variant-numeric:tabular-nums;}
    .chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid rgba(40,48,63,.6);}
    .chk:last-child{border-bottom:none;}
    .chk .cb{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;
      border:1px solid var(--line);color:var(--dim);font-size:15px;background:var(--panel2);}
    .chk.done .cb{background:var(--ok);color:#0b0d13;border-color:var(--ok);}
    .chk.na .cb{background:rgba(251,113,133,.15);color:var(--danger);border-color:rgba(251,113,133,.4);}
    .chk .ci{flex:1;min-width:0;}
    .chk .cn{font-size:13px;font-weight:600;}
    .chk .cx{font-size:11.5px;color:var(--mut);margin-top:2px;}
    .rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .gauge-wrap{display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:8px;}
    .mini{text-align:center;min-width:70px;}
    .mini .mv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
    .mini .ml{font-size:11px;color:var(--mut);}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:6px;}
    .legend span{display:flex;align-items:center;gap:6px;}
    .swatch{width:10px;height:10px;border-radius:3px;flex:none;}
    .foot{text-align:center;color:var(--dim);font-size:11.5px;padding:20px 0 4px;}
    .scrollx{overflow-x:auto;}
    .maxh{max-height:360px;overflow:auto;}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="msi">health_and_safety</span></div>
      <div>
        <h1>EHS 職業安全衛生管理系統</h1>
        <p>Environment · Health · Safety 控制中心</p>
      </div>
    </div>
    <div class="livewrap">
      <div class="clock" id="clock">—</div>
      <div class="livepill"><span class="dot"></span>安平廠區 · 即時連線</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main id="view"></main>

  <script>
  (function(){
    "use strict";
    var view=document.getElementById("view");
    var NAV=[
      {i:0,ic:"warning",t:"危害辨識 HIRA"},
      {i:1,ic:"report_problem",t:"事故通報"},
      {i:2,ic:"shield",t:"PPE 防護具"},
      {i:3,ic:"rule",t:"改善追蹤 CAPA"},
      {i:4,ic:"monitoring",t:"安全監測"},
      {i:5,ic:"fact_check",t:"稽核結案"}
    ];
    var navEl=document.getElementById("nav");
    navEl.innerHTML=NAV.map(function(n){
      return '<button data-i="'+n.i+'"><span class="num">0'+(n.i+1)+'</span><span class="msi">'+n.ic+'</span><span class="navtxt">'+n.t+'</span></button>';
    }).join("");
    navEl.querySelectorAll("[data-i]").forEach(function(b){
      b.addEventListener("click",function(){ location.hash="v"+b.getAttribute("data-i"); });
    });

    (function(){
      var d=new Date(2026,7,14,10,42);
      var wd=["日","一","二","三","四","五","六"][d.getDay()];
      var p=function(x){return(x<10?"0":"")+x;};
      document.getElementById("clock").textContent=
        d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" (週"+wd+") "+p(d.getHours())+":"+p(d.getMinutes());
    })();

    var charts=[];
    function clearCharts(){ charts.forEach(function(c){ try{c.dispose();}catch(e){} }); charts=[]; }
    var AX="#8b93a7", GRID="#28303f", LT="#e7ecf4";
    function mk(id,opt){
      var el=document.getElementById(id);
      if(!el) return;
      var c=echarts.init(el,null,{renderer:"canvas"});
      c.setOption(opt);
      charts.push(c);
    }
    var PINK="#be185d",ROSE="#fb7185",MINT="#34d399",AMB="#fbbf24",BLU="#60a5fa",ORG="#fb923c";

    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
    function bar(pct){return '<div class="bar"><i style="width:'+pct+'%"></i></div>';}

    /* ============ SCREEN 0 : HIRA 危害辨識 ============ */
    function s0(){
      view.innerHTML=
      head("warning","危害辨識與風險評估 HIRA","以機率 × 嚴重度量化各工序風險等級，優先列管極高風險項目")+
      '<div class="grid kpis" style="margin-bottom:14px">'+
        kpi("assignment","評估作業項","248","本季 HIRA 條目","up","+18 vs 上季")+
        kpi("priority_high","極高風險","7","需立即改善","down","-3 已降級")+
        kpi("trending_down","殘餘風險降幅","41","%","up","導入防護後")+
        kpi("event_available","評估覆蓋率","96","%","up","+5")+
      '</div>'+
      '<div class="grid g23" style="margin-bottom:14px">'+
        '<div class="card"><h3><span class="msi">grid_view</span>5×5 風險矩陣</h3><p class="cd">機率（縱）× 嚴重度（橫），數字為落點作業數</p>'+
          riskMatrix()+
          '<div class="legend"><span><i class="swatch m-l"></i>低（1-4）</span><span><i class="swatch m-m"></i>中（5-9）</span><span><i class="swatch m-h"></i>高（10-16）</span><span><i class="swatch m-e"></i>極高（20-25）</span></div>'+
        '</div>'+
        '<div class="card"><h3><span class="msi">donut_large</span>危害類型分布</h3><p class="cd">依危害源歸類</p><div id="c0pie" class="chart" style="height:250px"></div></div>'+
      '</div>'+
      '<div class="card pad0"><div class="cardhead"><span class="msi" style="color:var(--accent2)">warning</span><h3>高風險作業清冊</h3></div>'+
        '<div class="scrollx"><table class="tbl"><thead><tr>'+
          '<th>編號</th><th>作業／工序</th><th>危害情境</th><th>機率</th><th>嚴重度</th><th>風險值</th><th>等級</th><th>控制措施</th></tr></thead><tbody>'+
          hiraRows()+
        '</tbody></table></div></div>';
      reflow();
      mk("c0pie",{
        tooltip:{trigger:"item"},
        legend:{bottom:0,textStyle:{color:AX,fontSize:11},itemWidth:10,itemHeight:10},
        series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],
          itemStyle:{borderColor:"#141824",borderWidth:2},
          label:{color:LT,fontSize:11,formatter:"{b}\n{d}%"},
          data:[
            {value:34,name:"機械夾捲",itemStyle:{color:PINK}},
            {value:22,name:"墜落",itemStyle:{color:ROSE}},
            {value:18,name:"化學暴露",itemStyle:{color:AMB}},
            {value:14,name:"感電",itemStyle:{color:BLU}},
            {value:12,name:"高溫燙傷",itemStyle:{color:ORG}}
          ]}]
      });
    }
    function riskMatrix(){
      var cells=[
        [ ["m-h",2],["m-e",1],["m-e",3],["m-e",1],["m-e",2] ],
        [ ["m-m",4],["m-h",5],["m-h",3],["m-e",2],["m-e",1] ],
        [ ["m-m",6],["m-m",8],["m-h",7],["m-h",4],["m-e",1] ],
        [ ["m-l",9],["m-m",11],["m-m",9],["m-h",5],["m-h",2] ],
        [ ["m-l",14],["m-l",10],["m-m",7],["m-m",4],["m-h",1] ]
      ];
      var probLbl=["5 極高","4 高","3 中","2 低","1 極低"];
      var sev=["1 輕","2 中","3 重","4 嚴重","5 災難"];
      var h='<div class="matrix"><div class="axis"></div>';
      sev.forEach(function(s){h+='<div class="axis">'+s+'</div>';});
      cells.forEach(function(row,ri){
        h+='<div class="axis">'+probLbl[ri]+'</div>';
        row.forEach(function(c){ h+='<div class="mc '+c[0]+'"><b>'+c[1]+'</b></div>'; });
      });
      h+='</div>';
      return h;
    }
    function hiraRows(){
      var d=[
        ["HZ-1042","沖壓機上下料","手部夾捲於模具間",4,5,20,"e","雙手按鈕＋光柵連鎖"],
        ["HZ-1039","高架管線檢修","2.4m 以上墜落",4,5,20,"e","背負式安全帶＋護欄"],
        ["HZ-1051","有機溶劑調配","VOC 吸入暴露",3,4,12,"h","局部排氣＋供氣式面罩"],
        ["HZ-1033","配電盤維護","400V 感電",2,5,10,"h","停電上鎖 LOTO＋絕緣手套"],
        ["HZ-1047","熔接作業","高溫燙傷／火花",3,3,9,"m","阻燃服＋防護面罩"],
        ["HZ-1028","堆高機物流","人車碰撞",3,4,12,"h","人車分道＋警示鳴笛"],
        ["HZ-1055","儲槽內部清洗","局限空間缺氧",2,5,10,"h","氣體偵測＋監視人員"]
      ];

      '<div class="grid kpis" style="margin-bottom:14px">'+
        kpi("checklist","本季稽核場次","36","場","up","+8")+
        kpi("task_alt","查檢合格率","91","%","up","+6")+

        kpi("verified_user","證照到期追蹤","3","人","down","30 天內")+

      '<div class="grid g32" style="margin-bottom:14px">'+
        '<div class="card"><h3><span class="msi">radar</span>五大構面稽核得分</h3><p class="cd">ISO 45001 管理系統構面</p><div id="c5radar" class="chart" style="height:250px"></div></div>'+
        '<div class="card"><h3><span class="msi">checklist_rtl</span>現場查檢表 · 沖壓區 08/14</h3><p class="cd">稽核員：職安衛主管 吳明德</p>'+ checklist() +
          '<div class="rowflex" style="justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
          '<span style="font-size:12px;color:var(--mut)">查檢 8 項 · 合格 6 · 待改 1 · 不適用 1</span>'+
          '<span class="badge b-grn">合格率 86%</span></div></div>'+
      '</div>'+
      '<div class="card pad0"><div class="cardhead"><span class="msi" style="color:var(--accent2)">inventory_2</span><h3>稽核結案歸檔紀錄</h3></div>'+
        '<div class="scrollx"><table class="tbl"><thead><tr><th>稽核單號</th><th>區域</th><th>日期</th><th>缺失數</th><th>改善完成</th><th>結果</th><th>結案</th></tr></thead><tbody>'+
        auditRows()+'</tbody></table></div></div>';
      reflow();
      mk("c5radar",{
        tooltip:{},
        legend:{data:["本季","上季"],textStyle:{color:AX},bottom:0},
        radar:{indicator:[
          {name:"領導承諾",max:100},{name:"危害辨識",max:100},{name:"作業管制",max:100},
          {name:"應變準備",max:100},{name:"績效評估",max:100}
        ],center:["50%","46%"],axisName:{color:AX,fontSize:11},splitLine:{lineStyle:{color:GRID}},
          splitArea:{areaStyle:{color:["rgba(190,24,93,.03)","rgba(190,24,93,.08)"]}},axisLine:{lineStyle:{color:GRID}}},
        series:[{type:"radar",data:[
          {value:[92,88,84,79,90],name:"本季",areaStyle:{color:"rgba(190,24,93,.3)"},lineStyle:{color:PINK,width:2},itemStyle:{color:PINK}},
          {value:[80,76,72,68,74],name:"上季",lineStyle:{color:AX,width:1,type:"dashed"},itemStyle:{color:AX},areaStyle:{color:"rgba(139,147,167,.08)"}}
        ]}]
      });

    function checklist(){
      var d=[
        ["done","機台安全連鎖裝置功能正常","雙手按鈕＋光柵測試通過"],
        ["done","作業人員 PPE 配戴確實","全員安全帽、護目鏡到位"],
        ["done","緊急停止按鈕標示清楚","紅色蕈狀鈕無遮蔽"],
        ["na","局限空間許可證","本區無局限空間作業"],
        ["done","滅火器在效期且定位","檢查合格證 2026/12"],
        ["fail","地面油污未即時清理","B 區積油，已開立改善"],
        ["done","逃生通道淨空","無堆放物阻擋"],
        ["done","作業標準書張貼","SOP-P042 現場可見"]
      ];
      var ic={done:"check",na:"remove",fail:"priority_high"};

        var cls=r[0]==="fail"?"na":r[0];
        return '<div class="chk '+cls+'"><div class="cb"><span class="msi">'+ic[r[0]]+'</span></div>'+
          '<div class="ci"><div class="cn">'+esc(r[1])+'</div><div class="cx">'+esc(r[2])+'</div></div></div>';
      }).join("")+'</div>';
    }
    function auditRows(){
      var d=[
        ["AUD-2608-12","沖壓一課","2026/08/14",1,"進行中","待改","b-yel","否"],
        ["AUD-2608-11","化學製程課","2026/08/12",2,"2/2","合格","b-grn","是"],
        ["AUD-2608-10","熔接課","2026/08/09",3,"2/3","待改","b-org","否"],
        ["AUD-2608-09","物流課","2026/08/06",0,"—","合格","b-grn","是"],
        ["AUD-2608-08","配電維護課","2026/08/03",1,"1/1","合格","b-grn","是"],
        ["AUD-2607-07","實驗室","2026/07/29",2,"2/2","合格","b-grn","是"]
      ];
      return d.map(function(r){
        return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td style="color:var(--mut)">'+r[2]+'</td>'+
          '<td class="mono">'+r[3]+'</td><td class="mono">'+r[4]+'</td>'+
          '<td><span class="badge '+r[6]+'">'+r[5]+'</span></td>'+

    /* ============ shared helpers ============ */
    function head(ic,t,sub){
      return '<div class="head"><h2 class="ttl"><span class="msi">'+ic+'</span>'+t+'</h2>'+
        '<p class="sub">'+sub+'</p><span class="tag">安平廠 · 2026 Q3</span></div>';
    }
    function kpi(ic,val,unit,label,dir,delta){
      var d="";
      if(delta) d='<div class="kd '+(dir==="up"?"up":dir==="down"?"down":"")+'"><span class="msi" style="font-size:14px">'+(dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove")+'</span>'+delta+'</div>';
      var u=unit?'<small>'+unit+'</small>':"";
      return '<div class="kpi"><div class="kl"><span class="msi">'+ic+'</span>'+label+'</div>'+
        '<div class="kv">'+val+u+'</div>'+d+'</div>';
    }
    function reflow(){ void view.offsetHeight; }

    var SCREENS=[s0,s1,s2,s3,s4,s5];
    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      clearCharts();
      navEl.querySelectorAll("[data-i]").forEach(function(b){
        b.classList.toggle("on",+b.getAttribute("data-i")===i);
      });
      SCREENS[i]();
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
