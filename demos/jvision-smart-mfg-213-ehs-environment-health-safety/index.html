<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>職業安全衛生管理系統（EHS）｜Jvision 系統 Demo</title>
  <meta name="description" content="危害辨識、事故通報、PPE 發放、改善追蹤與安全稽核的一站式職安衛平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --ok:#087443;
      --warn:#9a4a06;
      --danger:#b91c1c;
      --info:#1d4ed8;
      --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 22px rgba(15,23,42,.055);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--color-foreground);
      background:
        linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
        var(--color-background);
      background-size:32px 32px;
      font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,.scrollx{scrollbar-color:#cbd5e1 transparent}
    button:focus-visible,.tk:focus-visible{
      outline:3px solid rgba(37,99,235,.35);
      outline-offset:2px;
      border-color:var(--color-ring);
    }
    .msi{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;gap:18px;min-height:66px;
      padding:10px clamp(14px,2vw,28px);
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:42px;height:42px;flex:none;display:grid;place-items:center;
      color:var(--color-on-primary);background:var(--blue);
      border-radius:6px;box-shadow:4px 4px 0 #bfdbfe;
    }
    .logo .msi{font-size:23px}
    .brand h1{
      margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;
      white-space:nowrap;
    }
    .brand p{
      margin:2px 0 0;color:var(--muted);font:500 10.5px/1.35 "Fira Code",monospace;
      white-space:nowrap;letter-spacing:.02em;
    }
    .livewrap{
      margin-left:auto;display:flex;align-items:center;gap:14px;min-width:0;
    }
    .clock{
      color:var(--muted);font:500 11.5px/1 "Fira Code",monospace;
      font-variant-numeric:tabular-nums;white-space:nowrap;
    }
    .livepill{
      display:flex;align-items:center;gap:8px;padding:6px 10px;
      color:#14532d;background:#f0fdf4;border:1px solid #bbf7d0;
      border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;
    }
    .dot{
      width:8px;height:8px;border:2px solid #15803d;border-radius:50%;
      background:#fff;animation:pulse 2.2s ease-out infinite;
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(21,128,61,.35)}
      70%{box-shadow:0 0 0 6px rgba(21,128,61,0)}
      100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}
    }
    .nav{
      position:sticky;top:66px;z-index:25;display:flex;gap:4px;
      padding:8px clamp(14px,2vw,28px);overflow-x:auto;
      background:rgba(248,250,252,.96);border-bottom:1px solid var(--line);
      backdrop-filter:blur(10px);
    }
    .nav button{
      min-height:42px;display:flex;align-items:center;gap:8px;flex:none;
      padding:8px 13px;cursor:pointer;color:var(--muted);
      background:transparent;border:1px solid transparent;border-radius:5px;
      font-size:12.5px;font-weight:600;white-space:nowrap;
      transition:color .2s,background .2s,border-color .2s,transform .2s,box-shadow .2s;
    }
    .nav button:hover{
      color:var(--blue);background:#fff;border-color:#bfdbfe;
      transform:translateY(-1px);
    }
    .nav button.on{
      color:var(--color-on-primary);background:var(--blue);
      border-color:var(--blue);box-shadow:0 3px 10px rgba(37,99,235,.2);
    }
    .nav button .msi{font-size:18px}
    .nav .num{
      font:600 10px/1 "Fira Code",monospace;opacity:.78;
    }
    main{max-width:1500px;margin:auto;padding:22px clamp(14px,2vw,28px) 46px}
    .head{
      display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:9px 16px;
      margin-bottom:18px;padding-bottom:15px;border-bottom:2px solid var(--ink);
    }
    .head .ttl{
      margin:0;display:flex;align-items:center;gap:9px;
      font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.02em;
    }
    .head .ttl .msi{color:var(--blue);font-size:26px}
    .head .sub{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
    .head .tag{
      padding:5px 9px;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;
      border-radius:4px;font:600 10.5px/1.3 "Fira Code",monospace;white-space:nowrap;
    }
    .grid{display:grid;gap:12px}
    .kpis{grid-template-columns:repeat(4,1fr)}
    .g2{grid-template-columns:1fr 1fr}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g23{grid-template-columns:2fr 1fr}
    .g32{grid-template-columns:1fr 2fr}
    .card,.kpi,.ppecard,.col{
      min-width:0;background:var(--color-card);border:1px solid var(--line);
      border-radius:6px;box-shadow:var(--shadow);
    }
    .card{
      padding:16px;transition:border-color .22s,box-shadow .22s,transform .22s;
    }
    .card:hover{border-color:#cbd5e1;box-shadow:0 2px 3px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.07)}
    .card.pad0{padding:0;overflow:hidden}
    .card h3{
      margin:0 0 3px;display:flex;align-items:center;gap:7px;
      color:var(--ink);font-size:13.5px;font-weight:700;
    }
    .card h3 .msi{color:var(--blue);font-size:18px}
    .card .cd{margin:0 0 12px;color:var(--muted);font-size:11.5px;line-height:1.5}
    .cardhead{
      min-height:48px;display:flex;align-items:center;gap:8px;padding:12px 16px;
      background:#f8fafc;border-bottom:1px solid var(--line);
    }
    .cardhead h3{margin:0}
    .kpi{
      position:relative;overflow:hidden;padding:15px 15px 14px 17px;
      border-top:3px solid var(--blue);
      transition:transform .22s,border-color .22s,box-shadow .22s;
    }
    .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.09)}
    .kpi .kl{
      display:flex;align-items:center;gap:6px;color:var(--muted);
      font-size:11.5px;font-weight:500;
    }
    .kpi .kl .msi{color:var(--blue);font-size:17px}
    .kpi .kv{
      margin:8px 0 4px;color:var(--ink);font:700 27px/1 "Fira Code",monospace;
      font-variant-numeric:tabular-nums;letter-spacing:-.04em;
    }
    .kpi .kv small{
      margin-left:4px;color:var(--muted);font:500 12px/1 "Fira Sans",sans-serif;
      letter-spacing:0;
    }
    .kpi .kd{
      display:flex;align-items:center;gap:4px;color:var(--muted);
      font:500 10.5px/1.3 "Fira Code",monospace;
    }
    .kpi .up{color:var(--ok)}
    .kpi .down{color:var(--danger)}
    .chart{width:100%;overflow:hidden}
    .scrollx{overflow-x:auto}
    .maxh{max-height:360px;overflow:auto}
    .tbl{width:100%;border-collapse:collapse;font-size:12px}
    .tbl th{
      position:sticky;top:0;z-index:1;padding:10px 12px;
      color:#334155;background:#f1f5f9;border-bottom:1px solid #cbd5e1;
      text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
    }
    .tbl td{
      padding:10px 12px;border-bottom:1px solid #edf1f5;white-space:nowrap;
      color:var(--ink);
    }
    .tbl tbody tr:nth-child(even) td{background:#fbfdff}
    .tbl tbody tr:hover td{background:#eff6ff}
    .tbl tr:last-child td{border-bottom:0}
    .tbl td:nth-child(4),.tbl td:nth-child(5),.tbl td:nth-child(6){
      font-variant-numeric:tabular-nums;
    }
    .mono{
      font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;
      font-weight:600;letter-spacing:-.02em;
    }
    .badge{
      display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
      border-radius:3px;border:1px solid currentColor;
      font-size:10.5px;font-weight:700;line-height:1.35;white-space:nowrap;
    }
    .badge::before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
    .b-red{color:#991b1b;background:#fef2f2}
    .b-org{color:#9a3412;background:#fff7ed}
    .b-yel{color:#854d0e;background:#fefce8}
    .b-grn{color:#166534;background:#f0fdf4}
    .b-blu{color:#1e40af;background:#eff6ff}
    .b-gry{color:#475569;background:#f8fafc}
    .b-pnk{color:#9d174d;background:#fdf2f8}
    .matrix{
      display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:10.5px;
    }
    .matrix .mc{
      min-width:0;aspect-ratio:1.55/1;display:grid;place-items:center;
      border:1px solid rgba(15,23,42,.15);border-radius:3px;color:#172033;
      font-family:"Fira Code",monospace;font-weight:700;
    }
    .matrix .axis{
      display:grid;place-items:center;color:var(--muted);font-size:10px;font-weight:600;
    }
    .m-l{background:#bbf7d0}
    .m-m{background:#fde68a}
    .m-h{background:#fdba74}
    .m-e{background:#fca5a5}
    .matrix .mc b{font-size:13px}
    .legend{
      display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;
      color:var(--muted);font-size:10.5px;
    }
    .legend span{display:flex;align-items:center;gap:6px}
    .swatch{width:10px;height:10px;flex:none;border:1px solid rgba(15,23,42,.15);border-radius:2px}
    .bar{height:6px;margin-top:6px;overflow:hidden;background:#e2e8f0;border-radius:2px}
    .bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
    .tl{position:relative;padding-left:26px}
    .tl::before{
      content:"";position:absolute;left:8px;top:4px;bottom:4px;width:1px;background:#cbd5e1;
    }
    .tl .ev{position:relative;padding:0 0 16px}
    .tl .ev::before{
      content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;
      background:#fff;border:2px solid var(--blue);border-radius:50%;
    }
    .tl .ev.crit::before{background:var(--danger);border-color:var(--danger)}
    .tl .ev.ok::before{background:var(--ok);border-color:var(--ok)}
    .tl .et{color:var(--muted);font:500 10.5px/1.3 "Fira Code",monospace}
    .tl .eh{margin:3px 0;font-size:12.5px;font-weight:600;line-height:1.45}
    .tl .ed{color:var(--muted);font-size:11px}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .col{padding:10px;background:#f8fafc;box-shadow:none}
    .col .ch{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:9px;font-size:12px;font-weight:700;
    }
    .col .ch .cnt{
      min-width:24px;padding:2px 7px;text-align:center;color:var(--muted);
      background:#fff;border:1px solid var(--line);border-radius:3px;
      font:600 10px/1.3 "Fira Code",monospace;
    }
    .tk{
      margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);
      border-radius:4px;transition:transform .2s,border-color .2s,box-shadow .2s;
    }
    .tk:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 5px 13px rgba(15,23,42,.07)}
    .tk:last-child{margin-bottom:0}
    .tk .tkt{margin-bottom:7px;font-size:11.5px;font-weight:600;line-height:1.45}
    .tk .tkm{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      color:var(--muted);font-size:10.5px;
    }
    .tk .av{
      width:23px;height:23px;display:grid;place-items:center;
      color:#fff;background:var(--blue);border-radius:3px;font-size:10px;font-weight:700;
    }
    .ppe{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .ppecard{padding:14px;border-top:3px solid #93c5fd}
    .ppecard .pt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .ppecard .ico{
      width:38px;height:38px;flex:none;display:grid;place-items:center;
      color:var(--blue);background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;
    }
    .ppecard .ico .msi{font-size:21px}
    .ppecard .pn{font-size:12.5px;font-weight:700}
    .ppecard .ps{margin-top:2px;color:var(--muted);font-size:10.5px}
    .stat{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);font-size:10.5px}
    .stat b{color:var(--ink);font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .chk{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f5}
    .chk:last-child{border-bottom:0}
    .chk .cb{
      width:22px;height:22px;flex:none;display:grid;place-items:center;
      color:#64748b;background:#f8fafc;border:1px solid #cbd5e1;border-radius:3px;
    }
    .chk.done .cb{color:#fff;background:var(--ok);border-color:var(--ok)}
    .chk.na .cb{color:#fff;background:var(--danger);border-color:var(--danger)}
    .chk .cb .msi{font-size:15px}
    .chk .ci{flex:1;min-width:0}
    .chk .cn{font-size:12px;font-weight:600}
    .chk .cx{margin-top:2px;color:var(--muted);font-size:10.5px}
    .rowflex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .gauge-wrap{display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap}
    .mini{text-align:center;min-width:74px}
    .mini .mv{font:700 20px/1.2 "Fira Code",monospace;font-variant-numeric:tabular-nums}
    .mini .ml{margin-top:3px;color:var(--muted);font-size:10px}
    .screen-enter>*{animation:gridIn .4s cubic-bezier(.2,.8,.25,1.15) both}
    .screen-enter>*:nth-child(2){animation-delay:.04s}
    .screen-enter>*:nth-child(3){animation-delay:.08s}
    .screen-enter>*:nth-child(4){animation-delay:.12s}
    @keyframes gridIn{
      from{opacity:0;transform:translateY(12px) scale(.985)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1024px){
      .g3{grid-template-columns:1fr 1fr}
      .g23,.g32{grid-template-columns:3fr 2fr}
    }
    @media(max-width:768px){
      .topbar{position:static}
      .nav{position:static}
      .kpis{grid-template-columns:1fr 1fr}
      .g2,.g3,.g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
      .ppe{grid-template-columns:1fr 1fr}
      .head{grid-template-columns:1fr auto}
      .head .sub{grid-column:1/-1;grid-row:2}
    }
    @media(max-width:520px){
      .topbar{align-items:flex-start}
      .livewrap{margin-left:auto}
      .clock{display:none}
      .brand p{white-space:normal}
      .navtxt{display:none}
      .nav button{min-width:43px;justify-content:center;padding:9px}
      .nav button .num{display:none}
      main{padding-top:16px}
      .kpis,.board,.ppe{grid-template-columns:1fr}
      .head{display:flex;align-items:flex-start}
      .head .ttl{font-size:18px}
      .head .sub{width:100%}
      .head .tag{margin-left:0}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .screen-enter>*{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="msi">health_and_safety</span></div>
      <div>
        <h1>EHS 職業安全衛生管理系統</h1>
        <p>Environment · Health · Safety 控制中心</p>
      </div>
    </div>
    <div class="livewrap">
      <time class="clock" id="clock">—</time>
      <div class="livepill"><span class="dot" aria-hidden="true"></span>安平廠區 · 即時連線</div>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="系統功能"></nav>
  <main id="view" tabindex="-1"></main>

  <script>
  (function(){
    "use strict";
    var view=document.getElementById("view");
    var NAV=[
      {i:0,ic:"warning",t:"危害辨識 HIRA"},
      {i:1,ic:"report_problem",t:"事故通報"},
      {i:2,ic:"shield",t:"PPE 防護具"},
      {i:3,ic:"rule",t:"改善追蹤 CAPA"},
      {i:4,ic:"monitoring",t:"安全監測"},
      {i:5,ic:"fact_check",t:"稽核結案"}
    ];
    var navEl=document.getElementById("nav");
    navEl.innerHTML=NAV.map(function(n){
      return '<button type="button" data-i="'+n.i+'" aria-label="'+n.t+'"><span class="num">0'+(n.i+1)+'</span><span class="msi" aria-hidden="true">'+n.ic+'</span><span class="navtxt">'+n.t+'</span></button>';
    }).join("");
    navEl.querySelectorAll("[data-i]").forEach(function(b){
      b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i");});
    });

    var d=new Date(2026,7,14,10,42);
    var wd=["日","一","二","三","四","五","六"][d.getDay()];
    var p=function(x){return(x<10?"0":"")+x;};
    document.getElementById("clock").textContent=
      d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" (週"+wd+") "+p(d.getHours())+":"+p(d.getMinutes());

    var charts=[];
    var AX="#475569",GRID="#dbe3ed",LT="#1e293b";
    var BLUE="#2563eb",SKY="#3b82f6",RED="#dc2626",GREEN="#087443",AMBER="#b45309",ORANGE="#ea580c";
    function clearCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[]}
    function mk(id,opt){
      var el=document.getElementById(id);
      if(!el)return;
      var c=echarts.init(el,null,{renderer:"canvas"});
      c.setOption(opt);
      charts.push(c);
    }
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
    function bar(pct){return '<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'}
    function head(ic,t,sub){
      return '<div class="head"><h2 class="ttl"><span class="msi" aria-hidden="true">'+ic+'</span>'+t+'</h2><p class="sub">'+sub+'</p><span class="tag">安平廠 · 2026 Q3</span></div>';
    }
    function kpi(ic,val,unit,label,dir,delta){
      var trend=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
      var text=dir==="up"?"上升":dir==="down"?"下降":"";
      var detail=delta?'<div class="kd '+dir+'"><span class="msi" aria-hidden="true">'+trend+'</span><span class="sr">'+text+'</span>'+delta+'</div>':"";
      return '<div class="kpi"><div class="kl"><span class="msi" aria-hidden="true">'+ic+'</span>'+label+'</div><div class="kv">'+val+(unit?'<small>'+unit+'</small>':"")+'</div>'+detail+'</div>';
    }

    function s0(){
      view.innerHTML=

    function enter(){
      view.classList.remove("screen-enter");
      void view.offsetWidth;
      view.classList.add("screen-enter");
    }
    var SCREENS=[s0,s1,s2,s3,s4,s5];
    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      clearCharts();
      navEl.querySelectorAll("[data-i]").forEach(function(b){
        var active=+b.getAttribute("data-i")===i;
        b.classList.toggle("on",active);
        if(active)b.setAttribute("aria-current","page");
        else b.removeAttribute("aria-current");
      });
      SCREENS[i]();
    }
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0)}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
    fromHash();
  })();
