<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>理賠案件審核台 · Claims Case Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#F59E0B;--color-on-primary:#0F172A;
 --color-secondary:#FBBF24;--color-on-secondary:#0F172A;
 --color-accent:#8B5CF6;--color-on-accent:#000;
 --color-background:#0F172A;--color-foreground:#F8FAFC;
 --color-card:#222735;--color-card-foreground:#F8FAFC;
 --color-muted:#272F42;--color-muted-foreground:#B3C0D1;
 --color-border:#334155;--color-destructive:#EF4444;
 --color-on-destructive:#000;--color-ring:#F59E0B;
 --blue:#F59E0B;--ink:#F8FAFC;--muted:#B3C0D1;--line:#334155;
 --ok:#34D399;--warn:#FBBF24;--bad:#FB7185;--info:#A78BFA;
 --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"IBM Plex Sans","Noto Sans TC",sans-serif;font-size:14px;line-height:1.5}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 18px 20px;background:#161B29;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.bd{display:flex;align-items:center;gap:12px;padding:0 8px 28px}
.lg{width:42px;height:42px;display:grid;place-items:center;background:var(--color-primary);color:var(--color-on-primary);font-weight:700;font-size:18px;border-radius:4px;box-shadow:5px 5px 0 rgba(245,158,11,.18)}
.bd b{display:block;font-size:15px;letter-spacing:.02em}
.bd span{display:block;margin-top:2px;color:var(--muted);font-size:9px;letter-spacing:.13em}
#nav{display:grid;gap:5px}
#nav button{width:100%;min-height:44px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .2s}
#nav button:hover{background:var(--color-muted);border-color:var(--line);color:var(--ink);transform:translateX(2px)}
#nav button.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary);box-shadow:4px 4px 0 rgba(245,158,11,.2)}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;color:var(--muted);font-size:11px;line-height:1.8}
.main{min-width:0;padding:32px clamp(18px,3vw,44px) 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.vh h2{margin:0;font-size:clamp(22px,2.2vw,30px);line-height:1.2;letter-spacing:-.025em}
.vh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.live{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #5B4720;border-radius:999px;background:#2A251B;color:#FCD34D;font-size:12px;font-weight:600;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--color-primary);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.75)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi,.card,.kvc{background:var(--color-card);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.16)}
.kpi{position:relative;overflow:hidden;padding:18px;border-top:3px solid var(--color-primary);transition:transform .22s,border-color .22s,box-shadow .22s}
.kpi:hover,.card:hover{border-color:#4B5D78;box-shadow:0 16px 38px rgba(0,0,0,.23)}
.kpi:hover{transform:translateY(-2px)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{margin-top:5px;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:3px;font-size:11px;font-weight:600}
.kpi .ic{position:absolute;right:16px;top:16px;color:var(--color-primary);opacity:.55}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr)}
.card{padding:18px;transition:border-color .22s,box-shadow .22s}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;font-size:14px}
.card h3>.material-symbols-outlined{color:var(--color-primary)}
.up,.t-ok{color:#6EE7B7}.dn,.t-bad{color:#FDA4AF}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:2px 9px;border:1px solid;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.t-ok{background:#112E2A;border-color:#286A5E}.t-warn{background:#322813;border-color:#6B5421;color:#FCD34D}
.t-bad{background:#351B25;border-color:#713044}.t-info{background:#292143;border-color:#59428D;color:#C4B5FD}
.t-blue{background:#2C2414;border-color:#70561B;color:#FCD34D}
.chart{height:250px}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:#1A1F2C;color:#CBD5E1;font-size:11px;font-weight:600;letter-spacing:.03em}
table.data tr:hover td{background:#282F40}
table.data td:nth-child(n+2){font-variant-numeric:tabular-nums}
.queue,.docrow,.rk,.flag,.appr,.pay{display:flex;flex-direction:column;gap:10px}
.qc,.dr,.rkr,.ac,.pc{border:1px solid var(--line);border-radius:5px;background:#1D2230;transition:border-color .2s,transform .2s}
.qc:hover,.dr:hover,.rkr:hover,.ac:hover,.pc:hover{border-color:#53647F;transform:translateY(-1px)}
.qc{padding:13px 14px;border-left:4px solid var(--color-primary)}
.qc.hi{border-left-color:var(--bad)}.qc.mid{border-left-color:var(--warn)}.qc.lo{border-left-color:var(--ok)}
.qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qt b,.dr b,.rkr b,.ac b,.pc b,.fl b,.ti b{font-size:12.5px}
.id,.tt,.who,table td:first-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.id{color:#FCD34D;font-weight:700}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:11.5px}
.meta span{display:flex;align-items:center;gap:5px}
.meta .material-symbols-outlined{font-size:14px}
.ctyp{width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:4px;color:#0F172A}
.ctyp .material-symbols-outlined{font-size:16px}
.c-med{background:#38BDF8}.c-auto{background:#A78BFA}.c-life{background:#FB7185}.c-prop{background:#34D399}.c-travel{background:#FBBF24}
.ava{width:23px;height:23px;border-radius:50%;background:var(--color-primary);color:#172033;display:inline-grid;place-items:center;font-weight:700;font-size:10px}
.risk{margin-left:auto;min-width:67px;padding:6px 9px;border:1px solid;border-radius:4px;text-align:center}
.risk .num{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1}
.risk small{display:block;margin-top:2px;font-size:9px;font-weight:700}
.risk.red{background:#351B25;border-color:#713044;color:#FDA4AF}.risk.amb{background:#322813;border-color:#6B5421;color:#FCD34D}.risk.grn{background:#112E2A;border-color:#286A5E;color:#6EE7B7}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px}
.dr{display:flex;align-items:center;gap:11px;padding:11px 12px}
.di{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:4px;background:#286A5E;color:#D1FAE5}
.dr.miss .di{background:#713044;color:#FFE4E6}.dr.wait .di{background:#6B5421;color:#FEF3C7}
.di .material-symbols-outlined{font-size:17px}.dr small{display:block;color:var(--muted);font-size:11px}.dr .st{margin-left:auto}
.rkr{padding:12px 13px}.rkr .h,.rkr .k{display:flex;justify-content:space-between;gap:8px}
.track,.bar{height:8px;overflow:hidden;border-radius:999px;background:#151A26}
.track i,.bar i{display:block;height:100%;border-radius:999px;background:var(--color-primary)}
.rkr .k{margin-top:6px;color:var(--muted);font-size:11px}
.fl{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid #59428D;border-left:3px solid var(--info);border-radius:4px;background:#252039}
.fl.r{border-color:#713044;border-left-color:var(--bad);background:#301B24}.fl.a{border-color:#6B5421;border-left-color:var(--warn);background:#302715}
.fl>.material-symbols-outlined{color:#C4B5FD}.fl.r>.material-symbols-outlined{color:#FDA4AF}.fl.a>.material-symbols-outlined{color:#FCD34D}
.fl small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.fl .tm{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
.ac,.pc{padding:14px}.ah,.ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.amt{margin-left:auto;color:#FCD34D;font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.steps{display:flex;align-items:flex-start;gap:4px}
.stp{position:relative;flex:1;min-width:64px;text-align:center}
.cir{position:relative;z-index:1;width:30px;height:30px;margin:0 auto 5px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#161B27;color:var(--muted);font-family:var(--mono);font-weight:700}
.stp.done .cir{background:#1C5B4F;border-color:#34D399;color:#D1FAE5}.stp.now .cir{background:var(--color-primary);border-color:var(--color-primary);color:#0F172A;box-shadow:0 0 0 4px rgba(245,158,11,.14)}
.stp b{display:block;font-size:11px}.stp small{display:block;color:var(--muted);font-size:10px}
.ln{position:absolute;top:15px;left:60%;right:-40%;height:1px;background:var(--line)}.stp.done .ln{background:var(--ok)}
.mini{display:flex;gap:7px;flex-wrap:wrap}
.btn{min-height:36px;padding:7px 13px;border:1px solid;border-radius:4px;font-size:11.5px;font-weight:700;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ok{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.btn.no{background:transparent;border-color:#A34860;color:#FDA4AF}.btn.gh{background:#272F42;border-color:#45536B;color:#E2E8F0}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;color:#CBD5E1;font-size:11.5px}
.calc>div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.calc b{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:23px}.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:5px;width:1px;background:var(--line)}
.ti{position:relative;padding:0 0 16px 9px}.ti:before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border:3px solid var(--color-card);border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 1px var(--line)}
.ti.ok:before{background:var(--ok)}.ti.warn:before{background:var(--warn)}.ti.bad:before{background:var(--bad)}
.ti small{display:block;margin-top:3px;color:var(--muted);font-size:11.5px}.tt{color:var(--muted);font-size:10.5px}.who{margin-top:3px;color:#FCD34D;font-size:10.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kvc{padding:16px;text-align:center}.kvc .v{font-family:var(--mono);font-size:24px;font-weight:700}.kvc .l{margin-top:3px;color:var(--muted);font-size:11px}
@media(max-width:960px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:16px}.bd{padding-bottom:14px}.side .foot{display:none}#nav{grid-template-columns:repeat(3,1fr)}#nav button{justify-content:center}.g2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.main{padding:20px 14px 34px}.vh{align-items:flex-start}.live{white-space:normal}#nav{grid-template-columns:repeat(2,1fr)}#nav button{justify-content:flex-start}.kpis,.kv{grid-template-columns:1fr}.calc{grid-template-columns:1fr}.steps{overflow-x:auto;padding-bottom:6px}.stp{min-width:82px}.card{padding:14px}.risk{margin-left:0}.qt b{width:calc(100% - 40px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.kpi:hover,.qc:hover,.dr:hover,.rkr:hover,.ac:hover,.pc:hover,#nav button:hover,.btn:hover{transform:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="bd"><div class="lg">賠</div><div><b>理賠案件審核台</b><span>CLAIMS CASE MANAGEMENT</span></div></div>
 <nav id="nav" aria-label="主要功能"></nav>
 <div class="foot">產險/壽險理賠 · 醫療/車險/財損<br/>今日受理 74 · 待審 31<br/>詐欺警示 5 · 待覆核 8 · 待撥付 6</div>
</aside>
<main class="main">
 <header class="vh"><div><h2 id="vt">理賠總覽</h2><p id="vd"></p></div><div class="live" role="status"><i aria-hidden="true"></i>即時案件審核中</div></header>
 <div id="view"></div>
</main>
</div>
<script>
const MOD=[
["理賠總覽","dashboard","理賠總覽","理賠案件量、風險分布與撥付的全局戰情儀表"],
["案件受理","assignment","理賠案件受理","理賠案件佇列，含風險評分徽章與保單效力比對"],
["文件審核","fact_check","理賠文件審核","診斷書/單據/影像文件審查、缺漏標註與補件"],
["風險評分","shield","風險詐欺評分","風險模型分數拆解、詐欺警示規則與調查建議"],
["核准撥付","gavel","初核覆核與撥付","金額分級初核覆核流程與理算撥付作業"],
["案件追溯","history","案件追溯稽核","單一案件全程軌跡、操作留痕與稽核紀錄"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{let b=document.createElement("button");b.type="button";b.dataset.i=i;b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span>${m[0]}</span>`;b.onclick=()=>{location.hash="v"+i};nav.appendChild(b)});

const CASES=[
["CLM-24-88142","c-life","favorite","身故理賠 · 保額 NT$300 萬 · 短期內出險","陳","陳彥宏 · 壽險保戶","hi","91","高","投保 4 月即出險，受益人近期變更","壽險身故"],
["CLM-24-88139","c-auto","directions_car","第三人責任 · 對造車損高額維修","黃","黃思婷 · 車險保戶","hi","78","高","維修估價高於車價，重複送修徵兆","車體險"],
["CLM-24-88135","c-med","medical_services","住院醫療 · 慢性病住院 12 日","林","林佩君 · 醫療險保戶","mid","54","中","住院天數偏長，需病歷佐證","醫療險"],
["CLM-24-88131","c-prop","home_work","住宅火險 · 廚房火災財損","王","王志偉 · 火險保戶","mid","46","中","報案與出險時間差待釐清","住宅火險"],
["CLM-24-88128","c-travel","flight","旅平險 · 班機延誤補償","張","張惠雯 · 旅平險保戶","lo","22","低","延誤證明齊全，可快速核付","旅平險"],
["CLM-24-88124","c-med","medical_services","門診手術 · 白內障手術","李","李國強 · 醫療險保戶","lo","18","低","文件完整、金額在自動核付門檻內","醫療險"]];
const FLAGS=[
["S1 短期出險警示","投保未滿 6 個月之高保額身故案件自動轉調查","r","命中"],
["S2 受益人變更","出險前近期變更受益人，須人工複核","r","命中"],
["S3 重複就診比對","跨院就診紀錄比對未見異常","g","未命中"],
["S4 高額維修徵兆","車險維修估價高於車輛殘值 40%","a","觀察中"]];
const flagHTML=()=>FLAGS.map(f=>`<div class="fl ${f[2]}"><span class="material-symbols-outlined">${f[2]=="r"?"gpp_bad":f[2]=="a"?"warning":"verified_user"}</span><div><b>${f[0]}</b><small>${f[1]}</small></div><span class="tm">${f[3]}</span></div>`).join("");

const SCREENS=[
()=>`<div class="kpis">
<div class="kpi"><span class="material-symbols-outlined ic">assignment</span><div class="l">今日受理案件</div><div class="v">74<small> 件</small></div><div class="d up">▲ 自動核付 38%</div></div>
<div class="kpi"><span class="material-symbols-outlined ic">timer</span><div class="l">平均處理時間</div><div class="v">3.2<small> 天</small></div><div class="d up">▼ 較 6.7 天</div></div>
<div class="kpi"><span class="material-symbols-outlined ic">gpp_bad</span><div class="l">詐欺風險警示</div><div class="v dn">5</div><div class="d dn">高風險轉調查 · 佔 6.8%</div></div>
<div class="kpi"><span class="material-symbols-outlined ic">payments</span><div class="l">今日待撥付</div><div class="v" style="color:var(--warn)">6</div><div class="d" style="color:var(--muted)">賠款合計 NT$412 萬</div></div>
</div><div class="grid g2">
<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各險種案件量與詐欺警示</h3><div class="chart" id="c_typ"></div></div>
<div class="card"><h3><span class="material-symbols-outlined">bolt</span>即時詐欺/風險警示</h3><div class="flag">${flagHTML()}</div><h3 style="margin-top:16px"><span class="material-symbols-outlined">trending_up</span>週風險檢出率</h3><div class="chart" id="c_det" style="height:132px"></div></div></div>`,

()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">assignment</span>理賠案件佇列 <span class="tag t-bad" style="margin-left:auto">高風險 2 · 待審 31</span></h3><div class="queue">${CASES.map(c=>`<div class="qc ${c[6]}"><div class="qt"><span class="ctyp ${c[1]}"><span class="material-symbols-outlined">${c[2]}</span></span><span class="id">${c[0]}</span><b>${c[3]}</b><div class="risk ${c[6]=="hi"?"red":c[6]=="mid"?"amb":"grn"}"><div class="num">${c[7]}</div><small>風險 ${c[8]}</small></div></div><div class="meta"><span><span class="ava">${c[4]}</span>${c[5]}</span><span><span class="material-symbols-outlined">category</span>${c[10]}</span><span><span class="material-symbols-outlined">info</span>${c[9]}</span></div></div>`).join("")}</div><div class="legend"><span><i class="dot" style="background:var(--bad)"></i>高風險 ≥70</span><span><i class="dot" style="background:var(--warn)"></i>中風險 40–69</span><span><i class="dot" style="background:var(--ok)"></i>低風險 &lt;40</span></div></div>
