<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>理賠案件審核台 · Claims Case Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0369a1;--accent2:#38bdf8;--ink:#0f1c26;--bg:#eef4f8;--card:#fff;--line:#dce8f0;--mut:#5f7688;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#6366f1}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#0b3b56,#0369a1);color:#dbeafe;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent2),#0ea5e9);display:grid;place-items:center;font-weight:900;color:#08324a;flex:none;box-shadow:0 8px 20px rgba(56,189,248,.4);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:9px;color:var(--accent2);letter-spacing:1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#b9d4e6;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#6ea9cc}
.side button:hover{background:rgba(255,255,255,.08)}
.side button.on{background:linear-gradient(135deg,var(--accent2),#0ea5e9);color:#06283b;box-shadow:0 6px 16px rgba(56,189,248,.32)}
.side button.on .material-symbols-outlined{color:#06283b}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#8fb6cd;border-top:1px solid rgba(255,255,255,.14);line-height:1.8}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#dbeafe;color:#0369a1;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(3,105,161,.5)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(3,105,161,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#e0e7ff;color:#4338ca}.t-blue{background:#dbeafe;color:#0369a1}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef6fb}
table.data tr:hover td{background:#f2f8fc}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#e3eef5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
/* claims queue */
.queue{display:flex;flex-direction:column;gap:10px}
.qc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:13px;padding:12px 14px;background:#fff;position:relative}
.qc.hi{border-left-color:var(--bad);background:linear-gradient(90deg,#fff5f7,#fff)}
.qc.mid{border-left-color:var(--warn)}
.qc.lo{border-left-color:var(--ok)}
.qc .qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qc .qt b{font-size:13.5px;font-family:"Noto Sans TC"}
.qc .qt .id{font-family:Inter;font-weight:800;color:var(--accent);font-size:12.5px}
.qc .meta{color:var(--mut);font-size:11.5px;margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.qc .meta span{display:flex;align-items:center;gap:4px}
.qc .meta .material-symbols-outlined{font-size:14px}
/* risk score badge */
.risk{margin-left:auto;text-align:center;flex:none;border-radius:11px;padding:5px 10px;min-width:62px}
.risk .num{font-family:Inter;font-weight:900;font-size:18px;line-height:1}
.risk small{font-size:9px;display:block;font-weight:700;letter-spacing:.5px}
.risk.red{background:#ffe4e6;color:#be123c}.risk.amb{background:#fef3c7;color:#b45309}.risk.grn{background:#dcfce7;color:#15803d}
.ctyp{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.ctyp .material-symbols-outlined{font-size:15px}
.c-med{background:#0ea5e9}.c-auto{background:#6366f1}.c-life{background:#f43f5e}.c-prop{background:#10b981}.c-travel{background:#f59e0b}
.ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800;font-family:"Noto Sans TC"}
/* doc audit rows */
.docrow{display:flex;flex-direction:column;gap:9px}
.dr{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px}
.dr .di{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;background:var(--accent)}
.dr.miss .di{background:var(--bad)}.dr.wait .di{background:var(--warn)}
.dr .di .material-symbols-outlined{font-size:17px}
.dr b{font-size:12.5px;font-family:"Noto Sans TC"}
.dr small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.dr .st{margin-left:auto;flex:none}
/* risk breakdown */
.rk{display:flex;flex-direction:column;gap:11px}
.rkr{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.rkr .h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.rkr .h b{font-size:12.5px;font-family:"Noto Sans TC"}
.rkr .track{height:9px;background:#e3eef5;border-radius:6px;overflow:hidden}
.rkr .track i{display:block;height:100%;border-radius:6px}
.rkr .k{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--mut)}
.flag{display:flex;flex-direction:column;gap:8px}
.fl{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:#eef6fb;border-left:3px solid var(--accent)}
.fl.r{border-color:var(--bad);background:#fff1f3}.fl.a{border-color:var(--warn);background:#fffaf0}
.fl .material-symbols-outlined{font-size:18px;flex:none;color:var(--accent)}
.fl.r .material-symbols-outlined{color:var(--bad)}.fl.a .material-symbols-outlined{color:var(--warn)}
.fl b{font-size:12.5px;font-family:"Noto Sans TC"}
.fl small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.fl .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
/* approval flow */
.appr{display:flex;flex-direction:column;gap:12px}
.ac{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.ac .ah{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.ac .ah b{font-size:13.5px;font-family:"Noto Sans TC"}
.ac .amt{font-family:Inter;font-weight:900;font-size:18px;color:var(--accent);margin-left:auto}
.steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stp{flex:1;min-width:66px;text-align:center;position:relative}
.stp .cir{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;font-weight:800;font-size:13px;background:#e3eef5;color:#7ba3bd}
.stp.done .cir{background:var(--ok);color:#fff}
.stp.now .cir{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(3,105,161,.18)}
.stp small{font-size:10.5px;color:var(--mut);display:block;line-height:1.4}
.stp b{font-size:11.5px;font-family:"Noto Sans TC";display:block}
.stp .ln{position:absolute;top:15px;left:60%;right:-40%;height:2px;background:#dbe7ef;z-index:0}
.stp.done .ln{background:var(--ok)}
.mini{display:flex;gap:6px}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--accent);color:#fff}.btn.no{background:#fff;border:1px solid var(--bad);color:var(--bad)}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--mut)}
/* payout */
.pay{display:flex;flex-direction:column;gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pc .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pc .ph b{font-size:12.5px;font-family:"Noto Sans TC"}
.pc .ph .amt{margin-left:auto;font-family:Inter;font-weight:900;font-size:16px;color:var(--ok)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11.5px;color:#3f5666}
.calc>div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.calc b{font-family:Inter}
/* trace timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#dbe7ef}
.ti{position:relative;padding:0 0 15px 8px}
.ti:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px #dbe7ef}
.ti.ok:before{background:var(--ok)}.ti.warn:before{background:var(--warn)}.ti.bad:before{background:var(--bad)}
.ti b{font-size:12.5px;font-family:"Noto Sans TC"}
.ti .tt{font-size:10.5px;color:var(--mut);font-family:Inter;font-weight:600}
.ti small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.6}
.ti .who{font-size:10.5px;color:var(--accent);font-weight:700;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.kvc{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card)}
.kvc .v{font-family:Inter;font-weight:900;font-size:23px}
.kvc .l{font-size:11px;color:var(--mut);margin-top:2px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two{grid-template-columns:1fr}
}
@media(max-width:820px){.calc{grid-template-columns:1fr}}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .main{padding:16px 14px}
 .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">賠</div><div><b>理賠案件審核台</b><span>CLAIMS CASE MANAGEMENT</span></div></div>
    <div id="nav"></div>
    <div class="foot">產險/壽險理賠 · 醫療/車險/財損<br/>今日受理 74 · 待審 31<br/>詐欺警示 5 · 待覆核 8 · 待撥付 6</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">理賠總覽</h2><p id="vd"></p></div><div class="live"><i></i>即時案件審核中</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["理賠總覽","dashboard","理賠總覽","理賠案件量、風險分布與撥付的全局戰情儀表"],
["案件受理","assignment","理賠案件受理","理賠案件佇列，含風險評分徽章與保單效力比對"],
["文件審核","fact_check","理賠文件審核","診斷書/單據/影像文件審查、缺漏標註與補件"],
["風險評分","shield","風險詐欺評分","風險模型分數拆解、詐欺警示規則與調查建議"],
["核准撥付","gavel","初核覆核與撥付","金額分級初核覆核流程與理算撥付作業"],
["案件追溯","history","案件追溯稽核","單一案件全程軌跡、操作留痕與稽核紀錄"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

/* 險種:醫療c-med/車險c-auto/壽險c-life/財損c-prop/旅平c-travel ; sev hi/mid/lo */
const TYP_ICON={"c-med":"medical_services","c-auto":"directions_car","c-life":"favorite","c-prop":"home_work","c-travel":"flight"};
const TYP_LABEL={"c-med":"醫療險","c-auto":"車體險","c-life":"壽險身故","c-prop":"住宅火險","c-travel":"旅平險"};
const CASES=[
["CLM-24-88142","c-life","身故理賠 · 保額 NT$300 萬 · 短期內出險","陳","陳彥宏 · 壽險保戶","hi","91","高","投保 4 月即出險，受益人近期變更"],
["CLM-24-88139","c-auto","第三人責任 · 對造車損高額維修","黃","黃思婷 · 車險保戶","hi","78","高","維修估價高於車價，重複送修徵兆"],
["CLM-24-88135","c-med","住院醫療 · 慢性病住院 12 日","林","林佩君 · 醫療險保戶","mid","54","中","住院天數偏長，需病歷佐證"],
["CLM-24-88131","c-prop","住宅火險 · 廚房火災財損","王","王志偉 · 火險保戶","mid","46","中","報案與出險時間差待釐清"],
["CLM-24-88128","c-travel","旅平險 · 班機延誤補償","張","張惠雯 · 旅平險保戶","lo","22","低","延誤證明齊全，可快速核付"],
["CLM-24-88124","c-med","門診手術 · 白內障手術","李","李國強 · 醫療險保戶","lo","18","低","文件完整、金額在自動核付門檻內"]];

/* 文件審核 */
const DOCS=[
["diagnosis","診斷證明書","主治醫師開立 · 已上傳並 OCR 辨識","ok","已核對"],
["receipt","醫療費用收據","正本收據 3 張 · 金額 NT$186,400","ok","已核對"],
["assignment_ind","理賠申請書","保戶親簽 · 身分驗證通過","ok","已核對"],
["image","住院病歷摘要","缺住院第 4–8 日護理紀錄","miss","缺件"],
["account_balance","匯款帳戶存摺","戶名與保戶不符，待確認受益人","wait","待補正"],
["policy","保單效力證明","保單有效 · 已過等待期 90 日","ok","已核對"]];

/* 風險評分拆解 */
const RISK=[
["出險時序異常","投保後 4 個月內出險，短期出險加權",34,"red","高風險加權 +34"],
["受益人近期變更","出險前 30 日內變更受益人",22,"red","高風險加權 +22"],
["就醫紀錄一致性","診斷與過往病史大致相符",14,"amb","中度 +14"],
["申報金額合理性","申報金額落於同類案件中位數",12,"amb","中度 +12"],
["文件真偽比對","文件 OCR 與防偽驗證通過",9,"grn","低風險 +9"]];
const FLAGS=[
["S1 短期出險警示","投保未滿 6 個月之高保額身故案件自動轉調查","r","命中"],
["S2 受益人變更","出險前近期變更受益人，須人工複核","r","命中"],
["S3 重複就診比對","跨院就診紀錄比對未見異常","g","未命中"],
["S4 高額維修徵兆","車險維修估價高於車輛殘值 40%","a","觀察中"]];

/* 核准 flow — a[5] progress 0..1, a[6] hi=大額特批 */
const APPR=[
["CLM-24-88135","住院醫療理賠","林佩君 · 醫療險","NT$186,400","初核通過，文件補齊後送覆核","1","mid"],
["CLM-24-88139","車險第三人責任","黃思婷 · 車險","NT$248,000","高額且風險偏高，須經理特批","0","hi"],
["CLM-24-88131","住宅火險財損","王志偉 · 火險","NT$95,200","初核完成，待覆核核決","1","mid"]];
const APPR_HIST=[
["CLM-24-88128","張惠雯","NT$8,000","班機延誤 · 快速核付","主管核准","t-ok","10:12"],
["CLM-24-88124","李國強","NT$42,600","門診手術 · 自動核付","系統核付","t-blue","09:48"],
["CLM-24-88118","周孟璇","NT$0","不符除外條款","初核婉拒","t-bad","09:05"],
["CLM-24-88110","趙偉倫","NT$1,320,000","壽險身故 · 大額特批","總經理核決","t-ok","昨 17:20"]];

/* 撥付理算 */
const PAY=[
["CLM-24-88135","林佩君 · 住院醫療","NT$174,900",[["申報總額","NT$186,400"],["自負額扣除","-NT$3,000"],["日額上限調整","-NT$8,500"],["實付賠款","NT$174,900"]],"待撥付"],
["CLM-24-88128","張惠雯 · 旅平延誤","NT$8,000",[["延誤補償定額","NT$8,000"],["實付賠款","NT$8,000"]],"撥付中"],
["CLM-24-88124","李國強 · 門診手術","NT$42,600",[["手術定額給付","NT$45,000"],["部分負擔扣除","-NT$2,400"],["實付賠款","NT$42,600"]],"已撥付"]];
