<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人力成本分析與人事報表系統｜Workforce Cost Analytics</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --good:#166534;
  --bad:#B91C1C;
  --warn:#92400E;
  --paper:#FFF;
  --shadow:7px 7px 0 #134E4A;
  --font-display:"Cormorant Garamond","Crimson Pro","Noto Serif TC",serif;
  --font-body:"Crimson Pro","Noto Serif TC",serif;
  --font-code:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.08) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
.topbar{
  position:relative;
  z-index:30;
  color:#001C1A;
  background:var(--color-secondary);
  border-bottom:4px solid var(--ink)
}
.topbar::after{
  content:"";
  position:absolute;
  right:4%;
  bottom:-18px;
  width:150px;
  height:28px;
  background:var(--color-accent);
  border:4px solid var(--ink);
  transform:rotate(-2deg)
}
.topbar-in{
  max-width:1440px;
  min-height:84px;
  margin:auto;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  flex:none;
  background:var(--color-accent);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  font-family:var(--font-display);
  font-size:25px;
  font-weight:700
}
.brand b{
  display:block;
  font-family:var(--font-display);
  font-size:22px;
  font-weight:700;
  line-height:1
}
.brand span{
  display:block;
  margin-top:5px;
  color:#0F3F3B;
  font-family:var(--font-code);
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase
}
.spacer{flex:1}
.who{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  background:#FFF;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  color:var(--ink);
  font-family:var(--font-code);
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}
.who .material-symbols-outlined{font-size:18px}
.nav{
  position:sticky;
  top:0;
  z-index:20;
  background:#FFF;
  border-bottom:4px solid var(--ink)
}
.nav-in{
  max-width:1440px;
  margin:auto;
  padding:8px 18px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:thin
}
.nav button{
  min-height:44px;
  padding:8px 13px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  color:var(--ink);
  background:var(--color-muted);
  border:2px solid var(--ink);
  font-weight:700;
  transition:background-color .18s,color .18s,transform .18s,box-shadow .18s
}
.nav button:hover{background:#CCFBF1;transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.nav button.on{
  color:#000;
  background:var(--color-accent);
  box-shadow:4px 4px 0 var(--ink);
  transform:translate(-2px,-2px)
}
.nav button .material-symbols-outlined{font-size:20px}
main{max-width:1440px;margin:auto;padding:30px 22px 72px;min-width:0}
.shead{
  position:relative;
  min-height:150px;
  margin-bottom:24px;
  padding:22px 210px 22px 24px;
  display:grid;
  grid-template-columns:auto 1fr;
  align-content:center;
  gap:3px 12px;
  background:var(--ink);
  color:#FFF;
  border:4px solid var(--ink);
  box-shadow:9px 9px 0 var(--color-secondary);
  overflow:hidden
}
.shead::after{
  content:"WCA / 2026";
  position:absolute;
  right:-20px;
  top:28px;
  padding:14px 30px;
  color:#000;
  background:var(--color-accent);
  border:3px solid #000;
  font-family:var(--font-code);
  font-weight:900;
  transform:rotate(7deg)
}
.shead>.material-symbols-outlined{
  grid-row:1/3;
  align-self:start;
  padding:9px;
  color:#000!important;
  background:var(--color-secondary);
  border:2px solid #FFF
}
.shead h1{
  margin:0;
  color:#FFF;
  font-family:var(--font-display);
  font-size:clamp(28px,4vw,48px);
  font-weight:700;
  line-height:.98
}
.shead .tag{
  justify-self:start;
  margin-top:7px;
  padding:3px 8px;
  color:#001C1A;
  background:var(--color-secondary);
  border:2px solid #FFF;
  font-family:var(--font-code);
  font-size:10px;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase
}
.shead p{
  grid-column:1/-1;
  max-width:880px;
  margin:14px 0 0;
  color:#DFFCF8;
  font-size:16px
}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.card{padding:18px}
.card h3{
  margin:-18px -18px 18px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  color:#000;
  background:var(--color-secondary);
  border-bottom:3px solid var(--ink);
  font-family:var(--font-display);
  font-size:20px;
  font-weight:700;
  line-height:1.1
}
.card h3 .material-symbols-outlined{font-size:21px}
.sub{color:var(--muted);font-size:13px;font-weight:600}
.card h3 .sub{color:#134E4A;font-family:var(--font-code);font-size:10px}
.kpi{
  position:relative;
  min-height:150px;
  padding:17px;
  overflow:hidden
}
.kpi:nth-child(even){transform:translateY(10px)}
.kpi::before{
  content:"";
  position:absolute;
  right:-24px;
  bottom:-27px;
  width:85px;
  height:85px;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  transform:rotate(20deg)
}
.kpi::after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:38%;
  height:7px;
  background:var(--color-accent);
  border-right:3px solid var(--ink);
  border-bottom:3px solid var(--ink)
}
.kpi .kl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-family:var(--font-code);
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em
}
.kpi .kl .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.kpi .kv{
  position:relative;
  z-index:1;
  margin-top:10px;
  color:var(--ink);
  font-family:var(--font-display);
  font-size:clamp(28px,3vw,38px);
  font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums
}
.kpi .kd{
  position:relative;
  z-index:1;
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:4px;
  font-family:var(--font-code);
  font-size:11px;
  font-weight:800
}
.up{color:var(--bad)}.down{color:var(--good)}
.cw{position:relative;width:100%;overflow:hidden}
.tw{overflow-x:auto;border:2px solid var(--ink)}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  color:var(--ink);
  background:#FFF;
  font-size:14px
}
th,td{
  padding:10px 12px;
  border-right:1px solid #99F6E4;
  border-bottom:2px solid var(--line);
  text-align:left;
  white-space:nowrap
}
th:last-child,td:last-child{border-right:0}
th{
  color:#001C1A;
  background:#CCFBF1;
  border-bottom:3px solid var(--ink);
  font-family:var(--font-code);
  font-size:11px;
  font-weight:900;
  letter-spacing:.04em
}
tbody tr:nth-child(even){background:#F0FDFA}
tbody tr:hover{background:#FEF3C7}
td.num,th.num{
  text-align:right;
  font-family:var(--font-code);
  font-variant-numeric:tabular-nums
}
.mono{
  font-family:var(--font-code);
  font-variant-numeric:tabular-nums
}
.bar-cell{min-width:130px}
.minibar,.track{
  height:12px;
  overflow:hidden;
  background:#D8E8EA;
  border:2px solid var(--ink)
}
.minibar i,.track i{
  display:block;
  height:100%;
  background:var(--color-primary)
}
.track i.over{background:repeating-linear-gradient(135deg,#DC2626 0 7px,#FCA5A5 7px 14px)}
.pill{
  display:inline-flex;
  min-height:25px;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:2px solid currentColor;
  color:var(--ink);
  background:#FFF;
  font-family:var(--font-code);
  font-size:10px;
  font-weight:900
}
.pill.g{color:#14532D;background:#DCFCE7}
.pill.r{color:#7F1D1D;background:#FEE2E2}
.pill.y{color:#78350F;background:#FEF3C7}
.pill.b{color:#134E4A;background:#CCFBF1}
.pill.n{color:#334155;background:#E8F1F4}
.pill .material-symbols-outlined{font-size:14px}
.col{
  min-width:0;
  padding:12px;
  background:#E8F1F4;
  border:3px solid var(--ink)
}
.tk{
  margin-bottom:10px;
  padding:10px;
  background:#FFF;
  border:2px solid var(--ink);
  border-left:9px solid var(--color-accent)
}
.tk .t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:700}
.tk .m{margin-top:4px;color:var(--muted);font-size:13px}
.tl{position:relative;padding-left:28px}
.tl::before{
  content:"";
  position:absolute;
  left:8px;
  top:4px;
  bottom:4px;
  width:4px;
  background:var(--ink)
}
.tl .it{position:relative;padding:0 0 18px 6px}
.tl .it::before{
  content:"";
  position:absolute;
  left:-27px;
  top:2px;
  width:15px;
  height:15px;
  background:#FFF;
  border:3px solid var(--ink)
}
.tl .it.done::before{background:var(--color-secondary)}
.tl .it.wait::before{background:var(--color-accent)}
.tl .tt{font-weight:700}
.tl .td{color:var(--muted);font-size:13px}
.prow{
  min-width:0;
  padding:10px 0;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:2px dashed #5B7F7C
}
.prow:last-child{border-bottom:0}
.prow .pn{width:125px;flex:none;font-weight:700}
.prow .pb{flex:1;min-width:0}
.prow .pv{
  width:70px;
  flex:none;
  text-align:right;
  font-family:var(--font-code);
  font-weight:900;
  font-variant-numeric:tabular-nums
}
.stat{
  padding:8px 0;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:2px dashed #5B7F7C
}
.stat:last-child{border-bottom:0}
.stat b{
  font-family:var(--font-display);
  font-size:22px;
  font-variant-numeric:tabular-nums
}
.legend{
  margin-top:10px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  color:var(--muted);
  font-family:var(--font-code);
  font-size:11px
}
.legend i{
  width:13px;
  height:13px;
  display:inline-block;
  margin-right:5px;
  border:2px solid var(--ink);
  vertical-align:-2px
}
.note{
  padding:13px;
  display:flex;
  align-items:flex-start;
  gap:9px;
  color:#542B00;
  background:#FEF3C7;
  border:3px solid #92400E;
  box-shadow:5px 5px 0 #92400E;
  font-weight:600
}
.note .material-symbols-outlined{flex:none;color:#92400E}
.flowbar{
  padding:14px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  background:#FFF;
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.flowbar .st{
  min-height:42px;
  padding:7px 10px;
  display:flex;
  align-items:center;
  gap:7px;
  border:2px solid var(--ink);
  font-weight:700
}
.flowbar .n{
  width:23px;
  height:23px;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-family:var(--font-code);
  font-size:10px;
  font-weight:900
}
.flowbar .ar{color:var(--muted)}
.mt{margin-top:20px}
.grid-item,.card,.kpi,.note,.flowbar{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.grid>*:nth-child(2){animation-delay:.06s}
.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}
@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-delay:0ms!important;
    scroll-behavior:auto!important;
    transition-duration:.001ms!important
  }
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .shead{padding-right:150px}
}
@media(max-width:768px){
  main{padding:24px 14px 56px}
  .topbar-in{padding:12px 14px}
  .brand b{font-size:19px}
  .shead{min-height:0;padding:18px}
  .shead::after{display:none}
  .card,.kpi{box-shadow:5px 5px 0 var(--ink)}
  .g2,.g3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .hide-sm{display:none}
  .topbar::after{display:none}
  .topbar-in{min-height:68px}
  .logo{width:42px;height:42px}
  .nav-in{padding:8px}
  .nav button{padding:8px 11px}
  .nav button .hide-sm{display:inline}
  .g4{grid-template-columns:1fr}
  .kpi:nth-child(even){transform:none}
  .shead{grid-template-columns:auto 1fr}
  .shead h1{font-size:29px}
  .shead p{font-size:15px}
  .flowbar .ar{display:none}
  .flowbar .st{flex:1 1 140px}
}
@media(max-width:400px){
  .nav button .hide-sm{display:none}
  .brand span{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">薪</div>
      <div><b>人力成本分析平台</b><span>Workforce Cost Analytics · 人事報表系統</span></div>
    </div>
    <div class="spacer"></div>
    <div class="who"><span class="material-symbols-outlined">groups</span>人資部 · 陳筱雯<span class="hide-sm"> ｜ 財務共用</span></div>
    <div class="who hide-sm"><span class="material-symbols-outlined">calendar_month</span>2026 年 7 月</div>
  </div>
</header>
<nav class="nav" aria-label="主要功能">
  <div class="nav-in" id="nav"></div>
</nav>
<main id="app"></main>
<script>
"use strict";
var accent="#0D9488",accent2="#2DD4BF";
var money=function(n){return "$"+Number(n).toLocaleString("en-US")};
var SCREENS=[
{i:0,icon:"dashboard",label:"成本儀表板"},
{i:1,icon:"account_tree",label:"成本分攤"},
{i:2,icon:"receipt_long",label:"資料匯入"},
{i:3,icon:"trending_up",label:"加班外包趨勢"},
{i:4,icon:"request_quote",label:"預算分析"},
{i:5,icon:"description",label:"報表產出"}
];
var DEPTS=[
{name:"衝壓一線",head:42,salary:2860000,ot:412000,out:180000,rev:9600000},
{name:"焊接二線",head:36,salary:2440000,ot:356000,out:120000,rev:8100000},
{name:"塗裝線",head:28,salary:2010000,ot:298000,out:260000,rev:6200000},
{name:"總裝線",head:54,salary:3720000,ot:508000,out:96000,rev:12800000},
{name:"品保部",head:18,salary:1380000,ot:96000,out:40000,rev:0},
{name:"物流倉儲",head:22,salary:1290000,ot:176000,out:320000,rev:0}
];
function deptCost(d){return d.salary+d.ot+d.out}
var TOTAL_COST=DEPTS.reduce(function(s,d){return s+deptCost(d)},0);
var TOTAL_HEAD=DEPTS.reduce(function(s,d){return s+d.head},0);
var TOTAL_REV=DEPTS.reduce(function(s,d){return s+d.rev},0);
var charts={};
function killCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function screen0(){
var feeRate=TOTAL_COST/(TOTAL_REV||1)*100;
var perHead=Math.round(TOTAL_REV/TOTAL_HEAD);
var otTotal=DEPTS.reduce(function(s,d){return s+d.ot},0);
return head("人力成本結構儀表板","dashboard","2026 年 7 月人事總費用、人事費用率與人均產值即時彙整，資料每日自薪資／出勤／HRIS 同步。")
+'<div class="grid g4">'+kpi("總人事費用","payments",money(TOTAL_COST),"較上月 +3.2%","up","arrow_upward")
+kpi("人事費用率","monitoring",feeRate.toFixed(1)+"%","目標 ≤ 30%",feeRate>30?"up":"down",feeRate>30?"warning":"check")
+kpi("人均產值","insights",money(perHead),"較上月 +1.8%","down","arrow_upward")

function fromHash(){
