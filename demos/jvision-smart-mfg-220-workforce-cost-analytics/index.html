<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人力成本分析與人事報表系統｜Workforce Cost Analytics</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#a16207; --accent2:#eab308; --accent-soft:#fef9c3;
  --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#faf9f7; --card:#ffffff;
  --good:#15803d; --bad:#b91c1c; --warn:#c2410c;
  --shadow:0 1px 2px rgba(28,25,23,.06),0 6px 20px rgba(28,25,23,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#78500c,#a16207);color:#fff;box-shadow:var(--shadow);}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent2);color:#5a3e08;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;}
.brand b{font-size:15px;font-weight:800;white-space:nowrap;}
.brand span{font-size:11px;opacity:.82;display:block;font-weight:500;}
.spacer{flex:1 1 auto;min-width:8px;}
.who{display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(255,255,255,.14);padding:5px 11px;border-radius:999px;white-space:nowrap;}
.who .material-symbols-outlined{font-size:18px;}
nav.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(28,25,23,.04);}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;
  color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;cursor:pointer;
  white-space:nowrap;transition:.14s;min-width:0;
}
.nav button .material-symbols-outlined{font-size:20px;color:var(--accent);}
.nav button:hover{background:var(--accent-soft);color:var(--accent);}
.nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(161,98,7,.28);}
.nav button.on .material-symbols-outlined{color:#fff;}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0;}
.shead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-width:0;}
.shead h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px;}
.shead .tag{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:999px;}
.shead p{margin:3px 0 0;color:var(--muted);font-size:13px;width:100%;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.sub{color:var(--muted);font-size:12px;font-weight:500;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);} .g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .kv{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:.3px;word-break:break-all;}
.kpi .kd{font-size:11.5px;margin-top:4px;font-weight:600;display:flex;align-items:center;gap:3px;}
.up{color:var(--bad);} .down{color:var(--good);}
.cw{position:relative;width:100%;overflow:hidden;}
.tw{overflow-x:auto;border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.4px;background:#fcfbf9;}
tbody tr:hover{background:#fdfcf9;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.bar-cell{min-width:120px;}
.minibar{height:8px;border-radius:5px;background:var(--accent-soft);overflow:hidden;}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.pill.g{background:#dcfce7;color:var(--good);} .pill.r{background:#fee2e2;color:var(--bad);}
.pill.y{background:var(--accent-soft);color:var(--warn);} .pill.b{background:#e0e7ff;color:#3730a3;}
.pill.n{background:#f5f5f4;color:var(--muted);}
.pill .material-symbols-outlined{font-size:14px;}
.col{background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.tk .t{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tk .m{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 15px 4px;}
.tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
.tl .it.done::before{background:var(--good);box-shadow:0 0 0 2px #dcfce7;}
.tl .it.wait::before{background:var(--muted);box-shadow:0 0 0 2px #f5f5f4;}
.tl .it .tt{font-weight:700;font-size:13px;}
.tl .it .td{font-size:11.5px;color:var(--muted);}
.prow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);min-width:0;}
.prow:last-child{border-bottom:none;}
.prow .pn{width:120px;flex:0 0 auto;font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.prow .pb{flex:1 1 auto;min-width:0;}
.prow .pv{width:82px;flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.track{height:10px;background:#f0efec;border-radius:6px;overflow:hidden;}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.track i.over{background:linear-gradient(90deg,#b91c1c,#f97316);}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.stat:last-child{border-bottom:none;}
.stat b{font-size:16px;font-variant-numeric:tabular-nums;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
.note{background:var(--accent-soft);border:1px solid #fde68a;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#713f12;display:flex;gap:9px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:19px;color:var(--warn);flex:0 0 auto;}
.flowbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;}
.flowbar .st{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-weight:600;display:flex;align-items:center;gap:6px;}
.flowbar .st .n{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.flowbar .ar{color:var(--muted);}
.mono{font-variant-numeric:tabular-nums;}
.mt{margin-top:14px;}
@media(max-width:560px){
  .hide-sm{display:none;}
  .nav button{padding:8px 10px;}
  .brand span{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">薪</div>
      <div><b>人力成本分析平台</b><span>Workforce Cost Analytics · 人事報表系統</span></div>
    </div>
    <div class="spacer"></div>
    <div class="who"><span class="material-symbols-outlined">groups</span>人資部 · 陳筱雯<span class="hide-sm"> ｜ 財務共用</span></div>
    <div class="who hide-sm"><span class="material-symbols-outlined">calendar_month</span>2026 年 7 月</div>
  </div>
</header>
<nav class="nav">
  <div class="nav-in" id="nav"></div>
</nav>
<main id="app"></main>

<script>
"use strict";
var accent="#a16207", accent2="#eab308";
var money=function(n){return "$"+Number(n).toLocaleString("en-US");};

var SCREENS=[
  {i:0,icon:"dashboard",label:"成本儀表板"},
  {i:1,icon:"account_tree",label:"成本分攤"},
  {i:2,icon:"receipt_long",label:"資料匯入"},
  {i:3,icon:"trending_up",label:"加班外包趨勢"},
  {i:4,icon:"request_quote",label:"預算分析"},
  {i:5,icon:"description",label:"報表產出"}
];

var DEPTS=[
  {name:"衝壓一線",head:42,salary:2860000,ot:412000,out:180000,rev:9600000},
  {name:"焊接二線",head:36,salary:2440000,ot:356000,out:120000,rev:8100000},
  {name:"塗裝線",head:28,salary:2010000,ot:298000,out:260000,rev:6200000},
  {name:"總裝線",head:54,salary:3720000,ot:508000,out:96000,rev:12800000},
  {name:"品保部",head:18,salary:1380000,ot:96000,out:40000,rev:0},
  {name:"物流倉儲",head:22,salary:1290000,ot:176000,out:320000,rev:0}
];
function deptCost(d){return d.salary+d.ot+d.out;}
var TOTAL_COST=DEPTS.reduce(function(s,d){return s+deptCost(d);},0);
var TOTAL_HEAD=DEPTS.reduce(function(s,d){return s+d.head;},0);
var TOTAL_REV=DEPTS.reduce(function(s,d){return s+d.rev;},0);

var charts={};
function killCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* =============================== screen 0 =============================== */
function screen0(){
  var feeRate=(TOTAL_COST/(TOTAL_REV||1)*100);
  var perHead=Math.round(TOTAL_REV/TOTAL_HEAD);
  var otTotal=DEPTS.reduce(function(s,d){return s+d.ot;},0);
  return ''
  +head("人力成本結構儀表板","dashboard","2026 年 7 月人事總費用、人事費用率與人均產值即時彙整，資料每日自薪資／出勤／HRIS 同步。")
  +'<div class="grid g4">'
    +kpi("總人事費用","payments",money(TOTAL_COST),"較上月 +3.2%","up","arrow_upward")
    +kpi("人事費用率","monitoring",feeRate.toFixed(1)+"%","目標 ≤ 30%",feeRate>30?"up":"down",feeRate>30?"warning":"check")
    +kpi("人均產值","insights",money(perHead),"較上月 +1.8%","down","arrow_upward")
    +kpi("加班費占比","bolt",(otTotal/TOTAL_COST*100).toFixed(1)+"%","OT $"+Math.round(otTotal/1000)+"K","up","arrow_upward")
  +'</div>'
  +'<div class="grid g23 mt">'
    +'<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各部門人事費用結構 <span class="sub">薪資／加班／外包</span></h3><div class="cw" style="height:300px"><canvas id="c0a"></canvas></div>'
      +'<div class="legend"><span><i style="background:'+accent+'"></i>本薪</span><span><i style="background:'+accent2+'"></i>加班費</span><span><i style="background:#d6d3d1"></i>外包費</span></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>成本類別占比</h3><div class="cw" style="height:210px"><canvas id="c0b"></canvas></div>'
      +'<div class="stat mt"><span>直接人工</span><b>62.4%</b></div><div class="stat"><span>間接人工</span><b>24.1%</b></div><div class="stat"><span>外包委外</span><b>13.5%</b></div></div>'
  +'</div>'
  +'<div class="card mt"><h3><span class="material-symbols-outlined">table_chart</span>部門成本明細</h3>'
    +'<div class="tw"><table><thead><tr><th>部門</th><th class="num">人數</th><th class="num">總人事費用</th><th class="bar-cell">占比</th><th class="num">人均月成本</th><th>費用率</th></tr></thead><tbody>'
    +DEPTS.map(function(d){
        var c=deptCost(d); var pct=c/TOTAL_COST*100; var fr=d.rev? (c/d.rev*100):null;
        return '<tr><td><b>'+esc(d.name)+'</b></td><td class="num">'+d.head+'</td><td class="num mono">'+money(c)+'</td>'
          +'<td class="bar-cell"><div class="minibar"><i style="width:'+pct.toFixed(0)+'%"></i></div><span class="sub">'+pct.toFixed(1)+'%</span></td>'
          +'<td class="num mono">'+money(Math.round(c/d.head))+'</td>'
          +'<td>'+(fr===null?'<span class="pill n">支援部門</span>':'<span class="pill '+(fr>32?'r':fr>28?'y':'g')+'">'+fr.toFixed(1)+'%</span>')+'</td></tr>';
      }).join('')
    +'</tbody></table></div></div>'
  +'<div class="note mt"><span class="material-symbols-outlined">tips_and_updates</span><div>塗裝線與物流倉儲外包費用占比偏高（外包合計 $58 萬），建議於「預算分析」檢視委外 vs 自營成本試算。</div></div>';
}

/* =============================== screen 1 =============================== */
function screen1(){
  var basis=[
    {k:"人頭數分攤",v:"間接管銷、廠務水電",p:38},
    {k:"實際工時分攤",v:"直接人工、加班費",p:44},
    {k:"產值權重分攤",v:"獎金、共用外包",p:18}
  ];
  return ''
  +head("成本歸屬分攤","account_tree","將薪資、加班與外包費用依人頭數／工時／產值等基準，分攤至各部門與產線，供費用率計算與稽核。")
  +'<div class="grid g32">'
    +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>分攤基準設定</h3>'
      +basis.map(function(b){return '<div class="prow"><div class="pn">'+esc(b.k)+'</div><div class="pb"><div class="track"><i style="width:'+b.p+'%"></i></div><span class="sub">'+esc(b.v)+'</span></div><div class="pv">'+b.p+'%</div></div>';}).join('')
      +'<div class="note mt"><span class="material-symbols-outlined">gavel</span><div>RULE：共用外包費依各產線當月產值權重分攤，異動需成本會計覆核。</div></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>分攤結果 · 費用歸屬</h3><div class="cw" style="height:250px"><canvas id="c1a"></canvas></div></div>'
  +'</div>'
  +'<div class="card mt"><h3><span class="material-symbols-outlined">calculate</span>分攤計算明細（2026-07）</h3>'
    +'<div class="tw"><table><thead><tr><th>成本中心</th><th>分攤基準</th><th class="num">分攤前</th><th class="num">分攤加項</th><th class="num">分攤後</th><th>狀態</th></tr></thead><tbody>'
    +DEPTS.map(function(d,idx){
        var base=deptCost(d); var add=Math.round(base*(idx%2?0.06:0.09)); var after=base+add;
        return '<tr><td><b>'+esc(d.name)+'</b></td><td>'+(idx%2?'實際工時':'人頭數')+'</td>'
          +'<td class="num mono">'+money(base)+'</td><td class="num mono" style="color:var(--warn)">+'+money(add)+'</td>'
          +'<td class="num mono"><b>'+money(after)+'</b></td>'
          +'<td><span class="pill '+(idx<4?'g':'y')+'"><span class="material-symbols-outlined">'+(idx<4?'task_alt':'schedule')+'</span>'+(idx<4?'已覆核':'待覆核')+'</span></td></tr>';
      }).join('')
    +'</tbody></table></div></div>'
  +'<div class="grid g3 mt">'
    +stat("已分攤成本中心","6","account_tree")
    +stat("待覆核項目","2","fact_check")
    +stat("分攤誤差率","0.4%","rule")
  +'</div>';
}

/* =============================== screen 2 =============================== */
function screen2(){
  var sources=[
    {sys:"薪資系統 PayCore",type:"薪資／勞健保",rows:1284,st:"done",time:"07-05 02:10"},
    {sys:"出勤排班 TimeGate",type:"工時／加班",rows:3960,st:"done",time:"07-05 02:24"},
    {sys:"HRIS 人事主檔",type:"員工／部門",rows:220,st:"done",time:"07-05 02:31"},
    {sys:"外包廠對帳單",type:"委外費用",rows:96,st:"warn",time:"07-05 03:02"},
    {sys:"獎金試算表",type:"績效獎金",rows:210,st:"run",time:"進行中"}
  ];
  var stMap={done:{c:"g",t:"完成",ic:"check_circle"},warn:{c:"y",t:"待補正",ic:"warning"},run:{c:"b",t:"進行中",ic:"sync"}};
  return ''
  +head("多系統成本資料匯入","receipt_long","整合薪資、出勤、HRIS 與外包對帳等來源，校驗欄位完整與期間一致後入庫，解決成本數據分散難彙整。")
  +'<div class="grid g4">'
    +kpi("本次匯入來源","hub","5 個","4 完成 · 1 進行中","","")
    +kpi("匯入筆數","dataset","5,770","校驗通過 5,761","down","check")
    +kpi("欄位缺漏","report","3 筆","外包對帳缺成本中心","up","warning")
    +kpi("最近同步","update","07-05","每日 02:00 排程","","")
  +'</div>'
  +'<div class="grid g23 mt">'
    +'<div class="card"><h3><span class="material-symbols-outlined">cloud_sync</span>資料來源匯入狀態</h3>'
      +'<div class="tw"><table><thead><tr><th>來源系統</th><th>資料類型</th><th class="num">筆數</th><th>時間</th><th>狀態</th></tr></thead><tbody>'
      +sources.map(function(s){var m=stMap[s.st];return '<tr><td><b>'+esc(s.sys)+'</b></td><td class="sub">'+esc(s.type)+'</td><td class="num mono">'+s.rows.toLocaleString()+'</td><td class="sub">'+esc(s.time)+'</td><td><span class="pill '+m.c+'"><span class="material-symbols-outlined">'+m.ic+'</span>'+m.t+'</span></td></tr>';}).join('')
      +'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">timeline</span>匯入處理時序</h3><div class="tl">'
      +tlItem("done","02:00 · 排程觸發","啟動每日成本資料 ETL")
      +tlItem("done","02:24 · 薪資＋出勤入庫","5,244 筆校驗通過")
      +tlItem("done","02:31 · HRIS 主檔比對","部門對應更新 220 筆")

/* ---------- html helpers ---------- */
function head(title,icon,desc){
  return '<div class="shead"><span class="material-symbols-outlined" style="font-size:26px;color:'+accent+'">'+icon+'</span>'
    +'<h1>'+esc(title)+'</h1><span class="tag">Workforce Cost Analytics</span><p>'+esc(desc)+'</p></div>';
}
function kpi(label,icon,val,delta,dir,dic){
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+esc(label)+'</div>'
    +'<div class="kv">'+esc(val)+'</div>'
    +'<div class="kd '+(dir||"")+'">'+(dic?'<span class="material-symbols-outlined" style="font-size:14px">'+dic+'</span>':'')+esc(delta)+'</div></div>';
}
function stat(label,val,icon){
  return '<div class="card" style="display:flex;align-items:center;gap:13px;padding:15px"><span class="material-symbols-outlined" style="font-size:30px;color:'+accent+'">'+icon+'</span><div><div class="sub">'+esc(label)+'</div><div style="font-size:22px;font-weight:800">'+esc(val)+'</div></div></div>';
}
function tlItem(cls,title,desc){
  return '<div class="it '+(cls||"")+'"><div class="tt">'+esc(title)+'</div><div class="td">'+esc(desc)+'</div></div>';
}
function alertRow(c,ic,title,desc){
  var col=c=="r"?"bad":c=="y"?"warn":"good";
  return '<div class="prow" style="align-items:flex-start"><span class="material-symbols-outlined" style="color:var(--'+col+');flex:0 0 auto">'+ic+'</span><div style="flex:1 1 auto;min-width:0"><div style="font-weight:700;font-size:13px">'+esc(title)+'</div><div class="sub">'+esc(desc)+'</div></div><span class="pill '+c+'">'+(c=="r"?"高":c=="y"?"中":"改善")+'</span></div>';
}
function sug(dept,tag,txt){
  var cls=tag.indexOf("超支")>=0?"r":"g";
  return '<div class="tk"><div class="t">'+esc(dept)+'<span class="pill '+cls+'" style="font-size:10px">'+esc(tag)+'</span></div><div class="m">'+esc(txt)+'</div></div>';
}

  scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:"#f0efec"},ticks:{font:{size:11}}}}};

        {label:"外包費",data:DEPTS.map(function(d){return d.out;}),backgroundColor:"#d6d3d1",stack:"s",borderRadius:3}
      ]},options:(function(){var o=clone(baseOpts);o.scales.x.stacked=true;o.scales.y.stacked=true;o.scales.y.ticks.callback=function(v){return "$"+(v/1000000)+"M";};return o;})()});

      scales:{x:{grid:{display:false}},y:{position:"left",grid:{color:"#f0efec"},ticks:{callback:function(v){return "$"+v+"K";},font:{size:11}}},
      y1:{position:"right",grid:{display:false},min:24,max:34,ticks:{callback:function(v){return v+"%";},font:{size:11}}}}}});

/* ---------- render ---------- */
var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  var app=document.getElementById("app");
  killCharts();
  app.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i);}
  void app.offsetHeight;
  initCharts(i);
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=SCREENS.map(function(s){
    return '<button data-i="'+s.i+'"><span class="material-symbols-outlined">'+s.icon+'</span><span class="hide-sm">'+s.label+'</span></button>';
  }).join('');
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){(function(bt){bt.addEventListener("click",function(){show(+bt.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(btns[k]);}
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
