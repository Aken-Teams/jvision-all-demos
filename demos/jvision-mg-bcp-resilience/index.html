<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>營運持續與危機應變 BCP · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#D97706;
  --accent2:#2DD4BF;
  --accent-soft:#FEF3C7;
  --accent-soft2:#CCFBF1;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#CCFBF1;
  --hov:#E6FFFA;
  --track:#D7EEEC;
  --sidebar:#134E4A;
  --sidebar2:#134E4A;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:10px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--bg);
  color:var(--ink);
  font-family:"Crimson Pro","Times New Roman",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  margin:0;
  font-family:"Cormorant Garamond","Times New Roman",serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  width:264px;
  height:100vh;
  min-width:0;
  padding:24px 16px;
  overflow-y:auto;
  color:#FFFFFF;
  background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.28)}
.brand-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:42px;
  height:42px;
  color:var(--color-on-secondary);
  background:var(--color-secondary);
  border:2px solid #99F6E4;
  border-radius:8px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;line-height:1.15;letter-spacing:.02em}
.brand-txt span{
  display:block;
  margin-top:4px;
  overflow:hidden;
  color:#CCFBF1;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:500;
  letter-spacing:.13em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav{display:flex;flex-direction:column;gap:7px;min-width:0;margin-top:20px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:46px;
  padding:10px 12px;
  color:#E6FFFA;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:15px;
  text-align:left;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
  white-space:nowrap;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#FFFFFF;background:#115E59;border-color:#2DD4BF}
.nav button.on{color:var(--color-on-secondary);background:var(--color-secondary);border-color:#99F6E4;font-weight:700}
.nav .idx{margin-left:auto;color:inherit;font-family:"Cinzel",serif;font-size:10px;font-weight:600;opacity:.78}
.side-foot{
  margin-top:auto;
  padding:16px 9px 2px;
  color:#CCFBF1;
  border-top:1px solid rgba(255,255,255,.28);
  font-size:12px;
  line-height:1.7;
}
.side-foot b{color:#FFFFFF;font-family:"Cinzel",serif}
.main{flex:1;min-width:0;padding:28px 32px 64px}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:2px solid var(--color-border);
}
.topbar h1{display:flex;align-items:center;gap:10px;color:var(--color-foreground);font-size:29px;line-height:1.1}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:28px}
.topbar .sub{margin-top:5px;color:var(--color-muted-foreground);font-size:14px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:var(--color-muted-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;background:var(--ok);border:2px solid #DCFCE7;border-radius:50%;animation:pulse 2s ease-in-out infinite}
.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:36px;
  height:36px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #92400E;
  border-radius:50%;
  font-weight:700;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.48}}
@keyframes card-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
  animation:card-in 400ms ease both;
}
.grid>*:nth-child(2){animation-delay:60ms}
.grid>*:nth-child(3){animation-delay:120ms}
.grid>*:nth-child(4){animation-delay:180ms}
.card,.sec{min-width:0;padding:18px}
.card{border-top:4px solid var(--color-primary)}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-foreground);
  font-size:18px;
  line-height:1.2;
}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.sec>p{margin:0 0 14px;color:var(--color-muted-foreground);font-size:14px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--color-muted-foreground);font-size:13px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{min-width:0}
.card-h .hint{color:var(--color-muted-foreground);font-size:12px}

.kpi,.stat{position:relative;min-width:0;padding:17px;overflow:hidden}
.kpi::after{content:"";position:absolute;top:0;right:0;width:34px;height:6px;background:var(--color-accent)}
.kpi .ico{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:var(--color-foreground);
  background:var(--color-secondary);
  border:1px solid var(--color-primary);
  border-radius:7px;
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--color-muted-foreground);font-size:13px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-primary);font-size:16px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:var(--color-foreground);
  font-family:"Cinzel",serif;
  font-size:27px;
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.2;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Crimson Pro",serif;font-size:13px;font-weight:600}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--color-muted-foreground)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0 .card-h{padding:18px 18px 0!important}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:12px 14px;
  color:var(--color-foreground);
  background:var(--th);
  border-bottom:2px solid var(--color-primary);
  font-family:"Crimson Pro",serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{padding:12px 14px;color:#183D3A;border-bottom:1px solid #A7F3D0;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color 170ms ease}
tbody tr:hover{background:var(--hov)}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:600;letter-spacing:.01em}
td b{font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.tag::before{content:"";display:inline-block;width:6px;height:6px;background:currentColor;border-radius:50%}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #99D9D3;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:40px;color:var(--color-muted-foreground);font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--color-border)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-24px;width:14px;height:14px;background:#FFFFFF;border:3px solid var(--color-primary);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--color-muted-foreground);font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--color-muted-foreground);font-size:12px}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--color-border);font-size:13px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--color-muted-foreground)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--color-muted-foreground);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--color-muted-foreground);border-top:1px dashed var(--color-border);font-size:12px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:1px solid var(--color-border);border-radius:8px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;color:var(--color-foreground);font-size:14px;font-weight:700}
.col-h .cnt{padding:1px 9px;color:var(--color-muted-foreground);background:#FFFFFF;border:1px solid var(--color-border);border-radius:999px;font-family:"Cinzel",serif;font-size:11px}
.pcard{padding:11px 12px;background:#FFFFFF;border:1px solid var(--color-border);border-left:4px solid var(--color-accent);border-radius:6px}
.pcard b{font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--color-foreground);font-size:11px}
.mini-av,.av{display:flex;align-items:center;justify-content:center;flex:none;color:var(--color-foreground);background:var(--color-secondary);border:1px solid var(--color-primary);border-radius:50%;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#FFFFFF;border:1px solid var(--color-border);border-radius:8px}
.lane-row .num{display:flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;color:var(--color-on-accent);background:var(--color-accent);border:1px solid #92400E;border-radius:6px;font-family:"Cinzel",serif;font-size:12px;font-weight:600}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:15px}
.lane-row .body p{margin:2px 0 0;color:var(--color-muted-foreground);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:#475569;background:#FFFFFF;border:2px solid #94A3B8;border-radius:50%;font-family:"Cinzel",serif;font-size:10px}
.steps .ln{width:20px;height:2px;background:#94A3B8}
.steps .s.done{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:var(--color-primary);border-color:var(--color-primary);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--color-border)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--color-muted-foreground);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border:1px solid #99D9D3;border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border:1px solid #99D9D3;border-radius:4px}
.band .rng{position:absolute;top:0;bottom:0;background:#99F6E4}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--color-muted-foreground)}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--color-accent);border:1px solid #92400E;border-radius:2px}

.tile{display:flex;flex-direction:column;gap:8px;min-width:0;padding:17px;border-top:4px solid var(--color-primary)}
.tile .ti{display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:var(--color-foreground);background:var(--color-secondary);border:1px solid var(--color-primary);border-radius:7px}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{color:var(--color-foreground);font-size:16px}
.tile p{margin:0;color:var(--color-muted-foreground);font-size:12px;line-height:1.6}
.tile .tv{font-size:23px}

#screen{display:grid;grid-template-columns:392px minmax(0,1fr);grid-auto-rows:min-content;gap:16px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px;padding:0!important;background:none!important;border:none!important}
#screen>.grid.g4:first-child>*{flex:none!important;padding:16px!important;background:var(--color-card)!important;border:1px solid var(--color-border)!important;border-top:4px solid var(--color-primary)!important;border-radius:var(--r)!important}
#screen>.grid.g4:first-child>.tile .ti{width:35px;height:35px;margin:0;overflow:visible}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:312px}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:0 4px 12px;border-bottom:1px solid rgba(255,255,255,.28)}
  .side-foot{display:none}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
  .nav button{justify-content:center;min-height:44px;padding:8px}
  .nav button .idx{display:none}
  .main{padding:20px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  body{font-size:14px}
  .g4{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button .material-symbols-outlined{font-size:22px}
  .topbar{display:block}
  .topbar h1{font-size:24px}
  .top-right{justify-content:flex-start;margin-top:14px}
  #screen>.grid.g4:first-child{grid-template-columns:1fr!important}
  .tile .tv,.kpi .val,.stat .val{font-size:22px}
  .card,.sec{padding:15px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .chip{font-size:11px}
  .top-right .avatar{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}

function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
