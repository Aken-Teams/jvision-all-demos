<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>營建專案管理套件</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#15803d; --accent2:#4ade80; --accent-soft:#dcfce7;
  --bg:#f1f5f4; --card:#ffffff; --ink:#0f2419; --muted:#64766c;
  --line:#e2ebe6; --side:#0d2c1c; --side2:#123c28; --side-ink:#cdead9;
  --warn:#d97706; --danger:#dc2626; --ok:#16a34a; --info:#0ea5e9;
  --radius:14px; --shadow:0 2px 10px rgba(13,44,28,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;vertical-align:middle;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:250px;flex:none;background:linear-gradient(178deg,var(--side),var(--side2));color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{display:flex;align-items:center;gap:11px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06210f;flex:none}
.brand .mark .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;color:#fff;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:11.5px;color:#7fb896;margin-top:2px}
.nav{padding:12px 12px 20px;display:flex;flex-direction:column;gap:4px}
.nav .lbl{font-size:11px;color:#5f8f72;padding:12px 10px 6px;letter-spacing:1px;font-weight:700}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:none;border:none;color:var(--side-ink);cursor:pointer;font:inherit;font-size:14px;text-align:left;width:100%;transition:.15s;min-width:0}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.active{background:linear-gradient(90deg,rgba(74,222,128,.22),rgba(74,222,128,.04));color:#fff;box-shadow:inset 3px 0 0 var(--accent2)}
.navbtn .material-symbols-outlined{font-size:21px;flex:none}
.navbtn .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .idx{font-size:11px;font-weight:700;color:#4f7d61;flex:none}
.sidefoot{margin-top:auto;padding:14px 18px;font-size:11px;color:#5f8f72;border-top:1px solid rgba(255,255,255,.08)}
.sidefoot b{color:var(--accent2)}
/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar .tt{min-width:0}
.topbar h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px}
.topbar h2 .material-symbols-outlined{color:var(--accent);font-size:23px}
.topbar .desc{font-size:12.5px;color:var(--muted);margin-top:1px}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.pill.gray{background:#eef2f0;color:var(--muted)}
.chip-usr{display:flex;align-items:center;gap:9px}
.chip-usr .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06210f;font-weight:700;font-size:13px;flex:none}
.chip-usr .un{font-size:12.5px;font-weight:700;line-height:1.2}
.chip-usr .ur{font-size:11px;color:var(--muted)}
.wrap{padding:22px 26px 40px}
/* GRID SYSTEM */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.7fr}
.grid>*{min-width:0}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
}
/* CARD */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card .hd{padding:15px 18px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .hd h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .hd .sub{font-size:11.5px;color:var(--muted)}
.card .bd{padding:15px 18px 18px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-danger{background:#fee2e2;color:#b91c1c}
.t-info{background:#e0f2fe;color:#0369a1}
.t-gray{background:#eef2f0;color:#5b6b62}
/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);opacity:.5}
.kpi .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:11px;position:relative;z-index:1}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px;position:relative;z-index:1}
.kpi .kv small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:700;display:flex;align-items:center;gap:3px}
.kd.up{color:var(--ok)}.kd.down{color:var(--danger)}.kd.flat{color:var(--muted)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#f8faf9}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f6faf7}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ovf{overflow-x:auto;border-radius:10px}
/* PROGRESS */
.bar{height:7px;border-radius:6px;background:#e9efeb;overflow:hidden;min-width:70px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar.warn>span{background:linear-gradient(90deg,#d97706,#fbbf24)}
.bar.danger>span{background:linear-gradient(90deg,#dc2626,#f87171)}
.mini{font-size:11px;color:var(--muted)}
.chart{width:100%;height:280px}
.chart.sm{height:220px}
/* GANTT */
.gantt{min-width:720px}
.grow{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.gname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.gtrack{position:relative;height:22px;background:#f1f5f3;border-radius:6px}
.gbar{position:absolute;top:3px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 7px;font-size:10.5px;color:#06210f;font-weight:700;overflow:hidden}
.gbar.late{background:linear-gradient(90deg,#dc2626,#f87171);color:#fff}
.gbar.done{background:#94b5a2}
.gmile{position:absolute;top:0;width:2px;height:22px;background:var(--danger)}
.gscale{display:grid;grid-template-columns:180px 1fr;gap:10px;font-size:10.5px;color:var(--muted)}
.gscale .sc{display:flex;justify-content:space-between}
/* BOARD */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px}
.bcol{background:#f5f8f6;border-radius:12px;padding:10px;min-width:0}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;padding:4px 6px 10px}
.bcol .bh .cnt{background:#fff;color:var(--muted);border-radius:20px;font-size:11px;padding:1px 8px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(13,44,28,.05);border-left:3px solid var(--accent2)}
.bcard.hi{border-left-color:var(--danger)}
.bcard.md{border-left-color:var(--warn)}
.bcard .bt{font-size:12.5px;font-weight:700;margin-bottom:5px}
.bcard .bm{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap}
.bcard .bm .material-symbols-outlined{font-size:14px}
/* TIMELINE */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 4px}
.tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent)}
.tli.warn::before{background:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.tli.danger::before{background:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.tli .tt2{font-size:13px;font-weight:700}
.tli .tm{font-size:11.5px;color:var(--muted);margin-top:2px}
/* LEGEND */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
/* PHOTO GALLERY */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.gal{grid-template-columns:repeat(2,1fr)}}
.photo{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);min-width:0}
.photo .ph{height:110px;position:relative;display:grid;place-items:center;color:#fff;font-weight:700}
.photo .ph .material-symbols-outlined{font-size:34px;opacity:.92}
.photo .ph .ov{position:absolute;left:8px;top:8px;font-size:10px;background:rgba(0,0,0,.45);color:#fff;padding:2px 7px;border-radius:20px;font-weight:600}
.photo .pf{padding:9px 11px}
.photo .pf .ptt{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo .pf .pmm{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
/* MATRIX */
.matrix{min-width:520px;display:grid;grid-template-columns:80px repeat(5,1fr);gap:5px}
.mx-h{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:5px 0}
.mx-y{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.mx-cell{height:46px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff}
/* STATLINE */
.statline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.statline:last-child{border:none}
.statline .sn{flex:1;min-width:0;font-weight:600}
.statline .sv{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px}
.hint .material-symbols-outlined{font-size:15px;color:var(--accent)}
.split{display:flex;align-items:center;gap:12px}
.split>*{min-width:0}
/* RESPONSIVE SIDEBAR -> TOP NAV */
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap;padding:10px}
  .nav .lbl{display:none}
  .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
  .navbtn .idx{display:none}
  .sidefoot{display:none}
}
@media(max-width:560px){
  .navbtn .nt{display:none}
  .navbtn{padding:9px 11px}
  .wrap{padding:16px 14px 34px}
  .topbar{padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mark"><span class="material-symbols-outlined">engineering</span></div>
        <div>
          <h1>營建專案管理套件</h1>
          <div class="sub">Construction PM Suite</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">功能模組</div>
    </nav>
    <div class="sidefoot">
      工程專案 <b>信義聯開住宅新建工程</b><br/>標案 C-2024-018 · 純 UI 展示
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scr-title"><span class="material-symbols-outlined">dashboard</span>—</h2>
        <div class="desc" id="scr-desc">—</div>
      </div>
      <div class="spacer"></div>
      <span class="pill gray"><span class="material-symbols-outlined" style="font-size:16px">calendar_month</span>2026/08/13</span>
      <div class="chip-usr">
        <div class="av">陳</div>
        <div><div class="un">陳柏勳</div><div class="ur">工務工程師</div></div>
      </div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>

<script>
/* ============ HELPERS ============ */
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function money(n){try{return Number(n).toLocaleString('en-US');}catch(e){return String(n);}}
var GREEN=['#15803d','#4ade80','#86efac','#22c55e','#166534','#bbf7d0'];

/* ============ CHART REGISTRY ============ */
var CHARTS=[];
function disposeCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].dispose();}catch(e){}}CHARTS=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);CHARTS.push(c);}

function kpiCard(k){
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
    '<div class="kl">'+esc(k.l)+'</div>'+
    '<div class="kv">'+esc(k.v)+(k.u?' <small>'+esc(k.u)+'</small>':'')+'</div>'+
    '<div class="kd '+k.c+'"><span class="material-symbols-outlined" style="font-size:15px">'+(k.c==='up'?'north_east':(k.c==='down'?'south_east':'remove'))+'</span>'+esc(k.d)+'</div></div>';
}

/* ============ SCREEN 0 : 工程進度排程 (Gantt signature) ============ */
function s0(){
  var kpis=[
    {ic:"speed",l:"整體完工進度",v:"58.4",u:"%",d:"+3.1% 本週",c:"up"},
    {ic:"flag",l:"里程碑達成",v:"7 / 12",u:"",d:"下一個 8/20",c:"flat"},
    {ic:"schedule",l:"落後分項",v:"3",u:"項",d:"關鍵路徑 1 項",c:"down"},
    {ic:"event_available",l:"預估竣工",v:"2027/05",u:"",d:"順延 6 天",c:"down"}
  ];
  var gantt=[
    {n:"基礎工程",s:2,e:22,p:100,st:"done"},
    {n:"地下室結構",s:18,e:40,p:100,st:"done"},
    {n:"地上RC結構",s:36,e:66,p:74,st:"on"},
    {n:"外牆帷幕",s:58,e:82,p:22,st:"on"},
    {n:"機電幹線",s:52,e:88,p:15,st:"late"},
    {n:"室內裝修",s:70,e:96,p:0,st:"plan"},
    {n:"景觀公設",s:84,e:100,p:0,st:"plan"}
  ];
  var mile=[22,40,66,82,96];
  var rows=gantt.map(function(g){
    var w=g.e-g.s;var cls=g.st==='late'?' late':(g.st==='done'?' done':'');
    return '<div class="grow"><div class="gname"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">'+
      (g.st==='late'?'error':(g.st==='done'?'task_alt':'radio_button_unchecked'))+'</span>'+esc(g.n)+'</div>'+
      '<div class="gtrack"><div class="gbar'+cls+'" style="left:'+g.s+'%;width:'+w+'%">'+g.p+'%</div>'+
      mile.map(function(m){return '<div class="gmile" style="left:'+m+'%"></div>';}).join('')+'</div></div>';
  }).join('');
  return '<div class="grid g4">'+kpis.map(kpiCard).join('')+'</div>'+
    '<div class="grid g21" style="margin-top:16px">'+
      '<div class="card"><div class="hd"><h3><span class="material-symbols-outlined">account_tree</span>WBS 甘特排程</h3><span class="sub">2026 Q3 · 週別基準</span></div>'+
        '<div class="bd"><div class="ovf"><div class="gantt">'+
          '<div class="gscale"><div></div><div class="sc"><span>W1</span><span>W8</span><span>W16</span><span>W24</span><span>W32</span></div></div>'+
          rows+
        '</div></div>'+
        '<div class="legend"><span><i class="dot" style="background:var(--accent)"></i>進行中</span><span><i class="dot" style="background:#94b5a2"></i>已完成</span><span><i class="dot" style="background:var(--danger)"></i>落後</span><span><i class="dot" style="background:var(--danger);width:3px;height:12px;border-radius:1px"></i>里程碑</span></div>'+
        '</div></div>'+
      '<div class="card"><div class="hd"><h3><span class="material-symbols-outlined">trending_up</span>計畫 vs 實際 S 曲線</h3></div>'+
        '<div class="bd"><div id="c-s0-scurve" class="chart sm"></div><div class="hint"><span class="material-symbols-outlined">info</span>實際落後計畫 2.6 個百分點</div></div></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:16px">'+
      '<div class="card"><div class="hd"><h3><span class="material-symbols-outlined">groups</span>各分包進度貢獻</h3></div><div class="bd"><div id="c-s0-bar" class="chart sm"></div></div></div>'+
      '<div class="card"><div class="hd"><h3><span class="material-symbols-outlined">route</span>關鍵路徑警示</h3></div><div class="bd">'+
        cpRow('地上RC結構 → 外牆帷幕','浮時 0 天','danger','關鍵')+
        cpRow('機電幹線配管','落後 4 天','warn','注意')+
        cpRow('室內裝修備料','浮時 8 天','ok','充裕')+
        cpRow('景觀公設發包','浮時 12 天','ok','充裕')+
        '</div></div>'+
    '</div>';
}
function cpRow(t,m,c,tag){
  var tc={danger:'t-danger',warn:'t-warn',ok:'t-ok'}[c];
  return '<div class="statline"><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">conversion_path</span>'+
    '<div class="sn"><div style="font-weight:700">'+esc(t)+'</div><div class="mini">'+esc(m)+'</div></div>'+
    '<span class="tag '+tc+'">'+esc(tag)+'</span></div>';
}
function chart_s0(){
  mk('c-s0-scurve',{grid:{left:38,right:14,top:24,bottom:26},legend:{data:['計畫','實際'],top:0,textStyle:{fontSize:11}},
    tooltip:{trigger:'axis'},xAxis:{type:'category',data:['W4','W8','W12','W16','W20','W24','W28'],axisLabel:{fontSize:10}},
    yAxis:{type:'value',max:100,axisLabel:{fontSize:10,formatter:'{value}%'}},
    series:[
      {name:'計畫',type:'line',smooth:true,data:[8,20,34,46,58,70,82],lineStyle:{width:2,type:'dashed'},itemStyle:{color:'#94b5a2'},symbol:'none'},

/* build nav */
(function(){
  var nav=document.getElementById('nav');
  var html='';
  for(var i=0;i<SCREENS.length;i++){
    html+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].ic+'</span><span class="nt">'+SCREENS[i].t+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.insertAdjacentHTML('beforeend',html);
  nav.addEventListener('click',function(e){
    var b=e.target.closest('[data-i]');if(!b)return;
    show(+b.getAttribute('data-i'));
    try{window.scrollTo(0,0);}catch(err){}
  });
})();

function show(i){
  if(i<0)i=0;if(i>SCREENS.length-1)i=SCREENS.length-1;
  disposeCharts();
  var s=SCREENS[i];
  document.getElementById('scr-title').innerHTML='<span class="material-symbols-outlined">'+s.ic+'</span>'+esc(s.t);
  document.getElementById('scr-desc').textContent=s.d;
  var btns=document.querySelectorAll('[data-i]');
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle('active',+btns[k].getAttribute('data-i')===i);}
  var view=document.getElementById('view');
  view.innerHTML=s.render();
  void view.offsetHeight;
  if(s.chart)s.chart();
}

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
