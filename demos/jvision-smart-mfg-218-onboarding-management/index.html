<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新進員工報到管理系統 · Onboarding Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99DDD4;
  --ok:#15803D;
  --warn:#A65305;
  --bad:#B91C1C;
  --info:#0369A1;
  --radius:8px;
  --shadow:0 1px 2px rgba(15,118,110,.07),0 8px 22px rgba(15,118,110,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:28px 28px;
  color:var(--ink);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:normal;
  font-feature-settings:"liga";
  line-height:1;
}
.app{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  min-height:68px;
  padding:10px clamp(16px,3vw,36px);
  color:#fff;
  background:#063B38;
  border-bottom:4px solid var(--color-secondary);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  flex:0 0 auto;
  color:#042F2E;
  background:var(--color-secondary);
  border:1px solid #8FF3E8;
  border-radius:6px;
}
.logo .material-symbols-outlined{font-size:24px}
.brand h1{
  margin:0;
  overflow:hidden;
  font-size:16px;
  font-weight:800;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand .sub{
  margin-top:1px;
  overflow:hidden;
  color:#CFFAF5;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
  text-overflow:ellipsis;
  text-transform:uppercase;
  white-space:nowrap;
}
.spacer{flex:1}
.whoami{
  display:flex;
  align-items:center;
  gap:9px;
  margin-left:18px;
  padding:5px 10px 5px 5px;
  color:#E8FFFC;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.24);
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.whoami .av{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  color:#052E2B;
  background:var(--color-secondary);
  border-radius:50%;
  font-weight:800;
}
.nav{
  position:sticky;
  top:68px;
  z-index:20;
  display:flex;
  gap:0;
  overflow-x:auto;
  padding:0 clamp(16px,3vw,36px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 16px rgba(15,118,110,.05);
  scrollbar-width:thin;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-width:max-content;
  min-height:48px;
  padding:8px 14px;
  color:#3C5F5C;
  background:transparent;
  border:0;
  border-right:1px solid #D5ECE9;
  font-size:12px;
  font-weight:700;
  transition:background-color .2s,color .2s,box-shadow .2s;
}
.nav button:first-child{border-left:1px solid #D5ECE9}
.nav button:hover{color:#075E57;background:#E5FAF7}
.nav button.active{
  color:#053D39;
  background:#CCFBF1;
  box-shadow:inset 0 -4px 0 var(--color-primary);
}
.nav button.active::after{
  content:"目前畫面";
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
}
.nav .material-symbols-outlined{font-size:19px}
.nav .idx{
  min-width:18px;
  color:#286E68;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-variant-numeric:tabular-nums;
}
.wrap{width:100%;max-width:1440px;margin:auto;padding:24px clamp(16px,3vw,36px) 42px}
.scr-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.scr-head .t{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  color:#0F403C;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.025em;
}
.scr-head .t .material-symbols-outlined{
  width:34px;
  height:34px;
  color:#fff;
  background:var(--color-primary);
  border-radius:5px;
  font-size:21px;
}
.scr-head .d{max-width:720px;margin-top:5px;color:var(--muted);font-size:12px}
.rowflex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  width:max-content;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10.5px;
  font-weight:800;
  line-height:1.35;
  white-space:nowrap;
}
.pill::before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 auto;
  background:currentColor;
  border-radius:50%;
}
.pill.ok{color:#166534;background:#ECFDF3;border-color:#86D9A1}
.pill.warn{color:#854006;background:#FFF7E6;border-color:#E8B66E}
.pill.bad{color:#991B1B;background:#FEF2F2;border-color:#F3A5A5}
.pill.info{color:#075985;background:#EFF8FF;border-color:#9ACCE8}
.pill.soft{color:#0F766E;background:#E5FAF7;border-color:#84D8D0}
.pill.grey{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:16px;
}
.kpi,.card,.plist{
  animation:enter .4s cubic-bezier(.2,.8,.2,1) both;
}
.kpi:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4){animation-delay:.18s}
.kpi{
  position:relative;
  min-width:0;
  padding:14px 15px 13px;
  overflow:hidden;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--color-primary);
}
.kpi:hover{
  transform:translateY(-2px);
  border-color:var(--color-primary);
  box-shadow:0 2px 4px rgba(15,118,110,.08),0 12px 28px rgba(15,118,110,.1);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
.kpi .lab .material-symbols-outlined{color:var(--color-primary);font-size:17px}
.kpi .val{
  margin-top:5px;
  color:#083E3A;
  font-size:27px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small{margin-left:4px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:0}
.kpi .foot{display:flex;align-items:center;gap:4px;margin-top:2px;color:var(--muted);font-size:10.5px}
.kpi .up{color:#15803D}.kpi .down{color:#B45309}
.card,.plist{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card .ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:46px;
  padding:10px 14px;
  background:#F8FFFE;
  border-bottom:1px solid var(--line);
  border-radius:var(--radius) var(--radius) 0 0;
}
.card .ct{display:flex;align-items:center;gap:8px;color:#103F3B;font-size:12px;font-weight:800}
.card .ct .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card .cb{padding:14px}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.listcol,.detail{display:flex;flex-direction:column;gap:12px;min-width:0}
.searchbox{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:42px;
  padding:7px 11px;
  background:#fff;
  border:1px solid #77CFC5;
  border-radius:6px;
  box-shadow:0 1px 2px rgba(15,118,110,.05);
}
.searchbox:focus-within{border-color:var(--color-ring);box-shadow:0 0 0 3px rgba(13,148,136,.2)}
.searchbox input{width:100%;min-width:0;color:var(--ink);background:transparent;border:0;outline:0;font-size:12px}
.searchbox input::placeholder{color:#64748B}
.searchbox .material-symbols-outlined{color:#0F766E;font-size:18px}
.plist{overflow:hidden}
.pitem{
  display:flex;
  gap:10px;
  min-width:0;
  padding:11px 12px;
  border-bottom:1px solid #D5ECE9;
  transition:background-color .2s,box-shadow .2s;
}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:#F0FDFA}
.pitem.sel{background:#E1F8F4;box-shadow:inset 4px 0 0 var(--color-primary)}
.pitem .av,.bigav,.avatar-sm{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
}
.pitem .av{width:36px;height:36px;flex:0 0 auto;border-radius:5px;font-size:12px}
.pitem .info{min-width:0;flex:1}
.pitem .nm{overflow:hidden;color:#123F3B;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.pitem .mt{margin-top:1px;overflow:hidden;color:var(--muted);font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}
.pitem .rt{flex:0 0 auto;text-align:right}
.pitem .day{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;white-space:nowrap}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bigav{width:52px;height:52px;flex:0 0 auto;border-radius:7px;font-size:18px}
.dhead .nm{color:#103F3B;font-size:18px;font-weight:800}
.dhead .role{margin-top:2px;color:var(--muted);font-size:11.5px}
.metgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.met{
  min-width:0;
  padding:10px 11px;
  background:#F5FCFB;
  border:1px solid #C0E6E1;
  border-radius:5px;
}
.met .l{color:var(--muted);font-size:10px;font-weight:700}
.met .v{
  margin-top:2px;
  color:#10433F;
  font-size:15px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{
  padding:9px 10px;
  color:#264E4A;
  background:#E7F8F5;
  border-bottom:2px solid #62BEB4;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.02em;
  text-align:left;
  white-space:nowrap;
}
.tbl td{padding:9px 10px;border-bottom:1px solid #D5ECE9;vertical-align:middle}
.tbl tbody tr:nth-child(even){background:#FBFEFE}
.tbl tbody tr:hover{background:#EFFFFC}
.tbl tr:last-child td{border-bottom:0}
.tbl .nowrap{white-space:nowrap}
.tbl td:nth-last-child(-n+2){font-variant-numeric:tabular-nums}
.avatar-sm{width:27px;height:27px;margin-right:7px;border-radius:4px;font-size:10px;vertical-align:middle}
.bar{height:7px;min-width:62px;overflow:hidden;flex:1;background:#D7E8E6;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:2px}
.chartbox{min-width:0;overflow:hidden}
.chk{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:56px;
  margin-bottom:8px;
  padding:9px 11px;
  background:#fff;
  border:1px solid #C7E7E3;
  border-radius:6px;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.chk:last-child{margin-bottom:0}
.chk:hover{transform:translateX(3px);border-color:var(--color-primary);box-shadow:0 3px 12px rgba(13,148,136,.08)}
.chk .ic{display:grid;place-items:center;width:33px;height:33px;flex:0 0 auto;border-radius:4px}
.chk .ic .material-symbols-outlined{font-size:19px}
.chk .body{min-width:0;flex:1}
.chk .body .t{color:#143F3C;font-size:12px;font-weight:800}
.chk .body .s{margin-top:1px;color:var(--muted);font-size:10.5px}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;top:5px;bottom:6px;left:9px;width:2px;background:#8CD4CC}
.tl .node{position:relative;margin-bottom:15px}
.tl .node:last-child{margin-bottom:0}
.tl .node::before{
  content:"排";
  position:absolute;
  top:1px;
  left:-26px;
  display:grid;
  place-items:center;
  width:17px;
  height:17px;
  color:#075E57;
  background:#fff;
  border:2px solid var(--color-primary);
  border-radius:50%;
  font-size:7px;
  font-weight:800;
}
.tl .node.done::before{content:"完";color:#fff;background:var(--color-primary)}
.tl .tt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:#103F3B;font-size:12px;font-weight:800}
.tl .ts{margin-top:3px;color:var(--muted);font-size:10.5px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.col{min-width:0;padding:8px;background:#F3FBFA;border:1px solid #B9E2DD;border-radius:6px}
.col .colh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin-bottom:8px;
  padding:2px;
  color:#1A4844;
  font-size:10.5px;
  font-weight:800;
}
.col .cnt{
  padding:1px 7px;
  color:#075E57;
  background:#CCFBF1;
  border:1px solid #93DDD4;
  border-radius:999px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
}
.tk{margin-bottom:7px;padding:8px;background:#fff;border:1px solid #C8E6E2;border-radius:5px;box-shadow:0 1px 2px rgba(15,118,110,.05)}
.tk:last-child{margin-bottom:0}
.tk .tn{overflow:hidden;color:#143F3C;font-size:11px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.tk .tm{margin-top:6px;color:var(--muted);font-size:10px}
.stars{color:#A65305;font-size:12px;letter-spacing:1px}
.stars .off{color:#B4C8C5}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .split{grid-template-columns:290px minmax(0,1fr)}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.two,.three{grid-template-columns:1fr}
  .metgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scr-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:480px){
  .topbar{min-height:64px;padding-inline:14px}
  .nav{top:64px;padding-inline:0}
  .nav button{min-height:48px;padding-inline:12px}
  .nav .txt{display:none}
  .wrap{padding:18px 12px 32px}
  .kpis{gap:8px}
  .kpi{padding:12px}
  .kpi .val{font-size:23px}
  .scr-head .t{font-size:18px}
  .metgrid,.board{grid-template-columns:1fr}
  .whoami .nm2{display:none}
  .whoami{margin-left:8px;padding-right:5px}
  .brand .sub{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">badge</span></div>
      <div style="min-width:0">
        <h1>新進員工報到管理系統</h1>
        <div class="sub">Onboarding Management · 人力資源</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="whoami"><span class="av">陳</span><span class="nm2">陳怡君 · 人資專員</span></div>
  </header>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <main class="wrap"><div id="screen" aria-live="polite"></div></main>
</div>
<script>
(function(){
"use strict";
var C={accent:"#0D9488",accent2:"#2DD4BF",ok:"#15803D",warn:"#A65305",bad:"#B91C1C",info:"#0369A1"};
var palette=["#0F766E","#0369A1","#15803D","#7C3AED","#BE185D","#A65305","#334155","#0D9488"];
function av(n){var x=0,i;for(i=0;i<n.length;i++)x+=n.charCodeAt(i);return{c:palette[x%palette.length]}}
function esc(s){return(""+s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pill(c,t){return'<span class="pill '+c+'">'+esc(t)+'</span>'}
var NAV=[
 {icon:"groups",label:"報到看板"},
 {icon:"fact_check",label:"文件與體檢"},
 {icon:"task_alt",label:"到職手續"},
 {icon:"calendar_month",label:"新人訓練"},
 {icon:"monitoring",label:"試用期追蹤"},
 {icon:"verified",label:"轉正評核"}
];
var newcomers=[
 {id:"N-2041",nm:"林思妤",dept:"SMT 產線",role:"設備技術員",day:"報到 D+1",date:"08/13",status:"手續中",prog:72,mgr:"王建豪",docs:8,docsOk:7,risk:"low"},
 {id:"N-2042",nm:"張哲瑋",dept:"品保部",role:"品保工程師",day:"報到 D+0",date:"08/14",status:"待報到",prog:40,mgr:"李美惠",docs:8,docsOk:5,risk:"mid"},
 {id:"N-2043",nm:"黃郁婷",dept:"物料倉儲",role:"倉管專員",day:"試用 D+22",date:"07/23",status:"試用中",prog:100,mgr:"陳志明",docs:8,docsOk:8,risk:"low"},
