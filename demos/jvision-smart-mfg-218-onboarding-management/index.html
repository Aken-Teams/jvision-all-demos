<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>新進員工報到管理系統 · Onboarding Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#c2410c; --accent2:#fb923c; --accent-soft:#fff1e9;
  --bg:#f6f4f1; --panel:#ffffff; --line:#eadfd6; --ink:#2b2320; --sub:#8a7d74;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --radius:14px; --shadow:0 1px 3px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-feature-settings:'liga';}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:linear-gradient(100deg,#7c2d12,#c2410c 60%,#ea580c);color:#fff;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.topbar .whoami{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.topbar .whoami .av{width:26px;height:26px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#7c2d12}
.nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:20}
.nav button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--sub);padding:9px 14px;border-radius:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--accent2);color:var(--accent)}
.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(194,65,12,.28)}
.nav .idx{font-size:10.5px;opacity:.6;font-weight:700}
.wrap{padding:22px;max-width:1360px;margin:0 auto;width:100%}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.scr-head .t{font-size:20px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px}
.scr-head .t .material-symbols-outlined{color:var(--accent);font-size:26px}
.scr-head .d{font-size:13px;color:var(--sub);margin-top:4px;max-width:640px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.ok{background:#e7f6ec;color:var(--ok)} .pill.warn{background:#fef3e2;color:var(--warn)}
.pill.bad{background:#fdeaea;color:var(--bad)} .pill.info{background:#e8f0fd;color:var(--info)}
.pill.soft{background:var(--accent-soft);color:var(--accent)} .pill.grey{background:#eee9e4;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .lab{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;font-weight:600}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .foot{font-size:11.5px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:5px}
.kpi .foot .up{color:var(--ok)} .kpi .foot .down{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card .ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .ch .ct{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .ch .ct .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .cb{padding:16px}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.listcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.searchbox input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.searchbox .material-symbols-outlined{color:var(--sub);font-size:19px}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pitem{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;min-width:0}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:var(--accent-soft)}
.pitem.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .av{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.pitem .info{min-width:0;flex:1}
.pitem .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .mt{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pitem .rt{text-align:right;flex:0 0 auto}
.pitem .rt .day{font-size:11px;color:var(--sub);white-space:nowrap}
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.dhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dhead .bigav{width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex:0 0 auto}
.dhead .nm{font-size:19px;font-weight:800}
.dhead .role{font-size:12.5px;color:var(--sub);margin-top:3px}
.metgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.met{background:#fbf8f5;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}
.met .l{font-size:11px;color:var(--sub);font-weight:600}
.met .v{font-size:16px;font-weight:800;margin-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fbf8f5}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fdfaf7}
.tbl .nowrap{white-space:nowrap}
.avatar-sm{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-right:8px;vertical-align:middle}
.bar{height:7px;border-radius:99px;background:#eee2d8;overflow:hidden;min-width:60px;flex:1}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.chartbox{overflow:hidden;min-width:0}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px}
.chk .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chk .ic .material-symbols-outlined{font-size:20px}
.chk .body{flex:1;min-width:0}
.chk .body .t{font-size:13.5px;font-weight:700}
.chk .body .s{font-size:11.5px;color:var(--sub);margin-top:2px}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .node{position:relative;margin-bottom:16px}
.tl .node::before{content:"";position:absolute;left:-24px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tl .node.done::before{background:var(--accent);border-color:var(--accent)}
.tl .node .tt{font-size:13.5px;font-weight:700}
.tl .node .ts{font-size:11.5px;color:var(--sub);margin-top:3px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#fbf8f5;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col .colh{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:2px 4px}
.col .colh .cnt{background:#eee2d8;color:var(--sub);border-radius:99px;font-size:11px;padding:1px 8px}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tk .tn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .tm{font-size:11px;color:var(--sub);margin-top:6px}
.stars{color:var(--accent2);font-size:13px;letter-spacing:1px}
.stars .off{color:#e1d5c9}
.rowflex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .nav{top:60px;overflow-x:auto;flex-wrap:nowrap}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .two,.three{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .metgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .wrap{padding:16px}
  .topbar .whoami .nm2{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">badge</span></div>
      <div style="min-width:0">
        <h1>新進員工報到管理系統</h1>
        <div class="sub">Onboarding Management · 人力資源</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="whoami"><span class="av">陳</span><span class="nm2">陳怡君 · 人資專員</span></div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="wrap"><div id="screen"></div></div>
</div>

<script>
(function(){
"use strict";
var C={accent:"#c2410c",accent2:"#fb923c",ok:"#16a34a",warn:"#d97706",bad:"#dc2626",info:"#2563eb"};
var palette=["#c2410c","#fb923c","#0ea5e9","#16a34a","#8b5cf6","#e11d48","#0d9488","#d97706"];
function av(nm){ var idx=(""+nm).length%palette.length; return {c:palette[idx]}; }
function esc(s){ return (""+s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pill(cls,txt){ return '<span class="pill '+cls+'">'+esc(txt)+'</span>'; }

var NAV=[
  {icon:"groups",label:"報到看板"},
  {icon:"fact_check",label:"文件與體檢"},
  {icon:"task_alt",label:"到職手續"},
  {icon:"calendar_month",label:"新人訓練"},
  {icon:"monitoring",label:"試用期追蹤"},
  {icon:"verified",label:"轉正評核"}
];

var newcomers=[
  {id:"N-2041",nm:"林思妤",dept:"SMT 產線",role:"設備技術員",day:"報到 D+1",date:"08/13",status:"手續中",prog:72,mgr:"王建豪",docs:8,docsOk:7,risk:"low"},
  {id:"N-2042",nm:"張哲瑋",dept:"品保部",role:"品保工程師",day:"報到 D+0",date:"08/14",status:"待報到",prog:40,mgr:"李美惠",docs:8,docsOk:5,risk:"mid"},
  {id:"N-2043",nm:"黃郁婷",dept:"物料倉儲",role:"倉管專員",day:"試用 D+22",date:"07/23",status:"試用中",prog:100,mgr:"陳志明",docs:8,docsOk:8,risk:"low"},
  {id:"N-2044",nm:"吳承恩",dept:"組裝產線",role:"產線作業員",day:"報到前 D-2",date:"08/16",status:"備齊中",prog:25,mgr:"王建豪",docs:8,docsOk:3,risk:"high"},
  {id:"N-2045",nm:"劉宥辰",dept:"製程工程",role:"製程工程師",day:"試用 D+58",date:"06/17",status:"待轉正",prog:100,mgr:"周文彬",docs:8,docsOk:8,risk:"low"},
  {id:"N-2046",nm:"蔡佳蓉",dept:"品保部",role:"檢驗員",day:"報到 D+3",date:"08/11",status:"訓練中",prog:88,mgr:"李美惠",docs:8,docsOk:8,risk:"low"},
  {id:"N-2047",nm:"鄭光佑",dept:"SMT 產線",role:"設備技術員",day:"試用 D+11",date:"08/03",status:"試用中",prog:100,mgr:"王建豪",docs:8,docsOk:8,risk:"mid"},
  {id:"N-2048",nm:"謝雅雯",dept:"物料倉儲",role:"物控專員",day:"報到前 D-4",date:"08/18",status:"備齊中",prog:15,mgr:"陳志明",docs:8,docsOk:2,risk:"mid"}
];
function riskPill(r){ return r==="high"?pill("bad","高風險"):r==="mid"?pill("warn","注意"):pill("ok","穩定"); }
function statusPill(s){
  var m={"手續中":"info","待報到":"warn","試用中":"soft","備齊中":"warn","待轉正":"ok","訓練中":"info"};
  return pill(m[s]||"grey",s);
}

var chartRegistry={};
function killCharts(){ for(var k in chartRegistry){ try{chartRegistry[k].destroy();}catch(e){} } chartRegistry={}; }
function mount(id,opts){
  var el=document.getElementById(id); if(!el) return;
  var ch=new ApexCharts(el,opts); ch.render(); chartRegistry[id]=ch;
}
function baseChart(extra){
  var o={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:"Inter, Noto Sans TC, sans-serif",toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    dataLabels:{enabled:false},grid:{borderColor:"#eadfd6",strokeDashArray:4},legend:{fontSize:"12px"}};
  for(var k in extra){ o[k]=extra[k]; }
  return o;
}
function kpi(icon,lab,val,unit,dir,foot){
  var cl=dir==="up"?"up":"down"; var ar=dir==="up"?"arrow_upward":"arrow_downward";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+esc(lab)+'</div>'+
    '<div class="val">'+esc(val)+'<small>'+esc(unit)+'</small></div>'+
    '<div class="foot"><span class="'+cl+'"><span class="material-symbols-outlined" style="font-size:14px">'+ar+'</span></span>'+esc(foot)+'</div></div>';
}
function buildListCol(selId){
  var h='<div class="listcol">';
  h+='<div class="searchbox"><span class="material-symbols-outlined">search</span><input placeholder="搜尋新進員工 / 部門…"/></div>';
  h+='<div class="plist">';
  for(var i=0;i<newcomers.length;i++){
    var n=newcomers[i]; var a=av(n.nm); var sel=(i===selId)?" sel":"";
    h+='<div class="pitem'+sel+'">';
    h+='<div class="av" style="background:'+a.c+'">'+esc(n.nm.slice(0,1))+'</div>';
    h+='<div class="info"><div class="nm">'+esc(n.nm)+' · '+esc(n.role)+'</div>';
    h+='<div class="mt">'+esc(n.dept)+' · '+esc(n.id)+'</div>';
    h+='<div style="margin-top:6px" class="rowflex">'+statusPill(n.status)+riskPill(n.risk)+'</div></div>';
    h+='<div class="rt"><div class="day">'+esc(n.day)+'</div></div>';
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

/* ===== SCREEN 0 : 報到看板 ===== */
function screen0(){
  var sel=newcomers[0];
  var h='';
  h+='<div class="scr-head"><div><div class="t"><span class="material-symbols-outlined">groups</span>報到看板總覽</div>'+
     '<div class="d">掌握本週到職進度、待辦手續與留任風險，於左側清單點選新人查看詳情。</div></div>'+
     '<div class="rowflex">'+pill("soft","本週到職 5 人")+pill("info","進行中 12 案")+'</div></div>';
  h+='<div class="kpis">';
  h+=kpi("event_available","本週報到人數","5","位","up","較上週 +2");
  h+=kpi("pending_actions","待辦手續","18","項","down","逾期 2 項");
  h+=kpi("schedule","平均報到時效","1.2","天","up","目標 ≤ 1.5 天");
  h+=kpi("favorite","試用期留任率","91","%","up","季目標 88%");
  h+='</div>';
  h+='<div class="split">'+buildListCol(0);
  h+='<div class="detail">';
  var a=av(sel.nm);
  h+='<div class="card"><div class="cb">';
  h+='<div class="dhead"><div class="bigav" style="background:'+a.c+'">'+esc(sel.nm.slice(0,1))+'</div>'+
     '<div><div class="nm">'+esc(sel.nm)+'</div><div class="role">'+esc(sel.role)+' · '+esc(sel.dept)+' · 用人主管 '+esc(sel.mgr)+'</div></div>'+
     '<div style="margin-left:auto" class="rowflex">'+statusPill(sel.status)+riskPill(sel.risk)+'</div></div>';
  h+='<div class="metgrid" style="margin-top:16px">';
  h+='<div class="met"><div class="l">員工編號</div><div class="v">'+esc(sel.id)+'</div></div>';
  h+='<div class="met"><div class="l">到職日</div><div class="v">'+esc(sel.date)+'</div></div>';
  h+='<div class="met"><div class="l">文件備齊</div><div class="v">'+sel.docsOk+'/'+sel.docs+'</div></div>';
  h+='<div class="met"><div class="l">整體進度</div><div class="v">'+sel.prog+'%</div></div>';
  h+='</div></div></div>';
  h+='<div class="two">';
  h+='<div class="card"><div class="ch"><div class="ct"><span class="material-symbols-outlined">apartment</span>各部門到職人數</div></div><div class="cb chartbox"><div id="c0a"></div></div></div>';
  h+='<div class="card"><div class="ch"><div class="ct"><span class="material-symbols-outlined">trending_up</span>近 6 週報到時效（天）</div></div><div class="cb chartbox"><div id="c0b"></div></div></div>';
  h+='</div>';
  h+='</div></div>';
  return {html:h,init:function(){
    mount("c0a",baseChart({
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:250},
      series:[{name:"人數",data:[6,4,5,3,4]}],
      colors:[C.accent],
      plotOptions:{bar:{borderRadius:6,columnWidth:"48%"}},
      xaxis:{categories:["SMT 產線","品保部","物料倉儲","組裝產線","製程工程"],labels:{style:{fontSize:"11px"}}},
      yaxis:{labels:{style:{fontSize:"11px"}}}
    }));
    mount("c0b",baseChart({
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:250},
      series:[{name:"報到時效",data:[2.4,2.1,1.9,1.6,1.4,1.2]}],
      colors:[C.accent2],
      stroke:{curve:"smooth",width:3},
      fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.4,opacityTo:.05}},
      xaxis:{categories:["W1","W2","W3","W4","W5","W6"],labels:{style:{fontSize:"11px"}}},
      yaxis:{labels:{style:{fontSize:"11px"}}}
    }));
  }};
}

/* ===== SCREEN 1 : 文件與體檢 (v1) ===== */
function screen1(){

  for(var k=0;k<crit.length;k++){
    var c=crit[k];
    h+='<tr><td>'+esc(c[0])+'</td><td class="nowrap">'+esc(c[1])+'</td><td class="nowrap">'+stars(c[2])+' '+c[2]+'</td>'+
       '<td><div class="rowflex"><div class="bar"><i style="width:'+c[3]+'%"></i></div><span style="font-size:11.5px;color:var(--sub);flex:0 0 auto">'+c[3]+'%</span></div></td></tr>';
  }
  h+='</tbody></table></div></div></div>';
  h+='</div></div>';
  return {html:h,init:function(){}};
}

var screens=[screen0,screen1,screen2,screen3,screen4,screen5];
var container=document.getElementById("screen");
var navEl=document.getElementById("nav");
(function buildNav(){
  var h='';
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'"><span class="idx">'+i+'</span><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="txt">'+esc(NAV[i].label)+'</span></button>';
  }
  navEl.innerHTML=h;
  var btns=navEl.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ location.hash="go="+this.getAttribute("data-i"); });
  }
})();

function show(i){
  killCharts();
  var btns=navEl.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active",(+btns[b].getAttribute("data-i"))===i); }
  var res=screens[i]();
  container.innerHTML=res.html;
  void container.offsetHeight;
  if(res.init){ try{ res.init(); }catch(e){} }
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
