<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>診所營運照護艙｜Jvision 系統 Demo</title>
<meta name="description" content="診所 EMR + 營運 + 批價申報：看診管理、電子病歷、批價/健保申報、慢箋回診與營運指標（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#0369a1; --accent-d:#075985; --accent2:#38bdf8; --accent-soft:#e0f2fe;
    --ink:#0b2437; --body:#3d5266; --muted:#7c93a8; --line:#dde8f1; --bg:#f3f8fc;
    --ok:#0f9d6e; --ok-soft:#d9f5ea; --amber:#d97706; --amber-soft:#fef1dc; --red:#dc2626; --red-soft:#fde3e3; --purple:#7c3aed;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* ===== TOP NAV ===== */
  .topbar{ position:sticky; top:0; z-index:40; background:linear-gradient(100deg,var(--accent-d),var(--accent)); color:#fff; }
  .tb-in{ max-width:1360px; margin:0 auto; padding:0 22px; display:flex; align-items:center; gap:18px; min-height:60px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .lg{ width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.16); display:grid; place-content:center; }
  .brand .lg .material-symbols-outlined{ font-size:24px; }
  .brand b{ font-size:16px; font-weight:900; letter-spacing:.02em; display:block; line-height:1.1; }
  .brand small{ font-size:11px; opacity:.8; }
  .nav{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:6px; }
  .nav button{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:0; color:rgba(255,255,255,.85); font:inherit; font-size:13px; font-weight:700; padding:9px 13px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .nav button .material-symbols-outlined{ font-size:19px; }
  .nav button:hover{ background:rgba(255,255,255,.12); color:#fff; }
  .nav button.on{ background:#fff; color:var(--accent-d); }
  .tb-r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .tb-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; background:rgba(255,255,255,.16); border-radius:999px; padding:6px 12px; }
  .tb-chip .material-symbols-outlined{ font-size:16px; }
  .who{ display:flex; align-items:center; gap:9px; }
  .who .av{ width:34px; height:34px; border-radius:50%; background:#fff; color:var(--accent-d); font-weight:900; display:grid; place-content:center; font-size:14px; }
  .who b{ font-size:13px; display:block; line-height:1.1; } .who small{ font-size:11px; opacity:.8; }
  /* ===== LAYOUT ===== */
  .wrap{ max-width:1360px; margin:0 auto; padding:22px 22px 60px; }
  .vh{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:22px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:9px; }
  .vh h2 .material-symbols-outlined{ color:var(--accent); font-size:26px; }
  .vh p{ margin:4px 0 0; font-size:13px; color:var(--muted); }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .btn:hover{ background:var(--accent-d); }
  .btn.ghost{ background:#fff; color:var(--accent-d); border:1px solid var(--line); }
  .btn .material-symbols-outlined{ font-size:18px; }
  /* KPI */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .kpis>*{ min-width:0; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent2); }
  .kpi .l{ font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--accent); }
  .kpi .v{ font-size:28px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:6px; color:var(--ok); }
  .kpi .d.down{ color:var(--ok); } .kpi .d.warn{ color:var(--amber); }
  /* grid + cards */
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g-2{ grid-template-columns:1fr 1fr; }
  .g-53{ grid-template-columns:1.55fr 1fr; }
  .g-35{ grid-template-columns:1fr 1.55fr; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card>h3 .material-symbols-outlined{ color:var(--accent); font-size:20px; }
  .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:800; color:var(--accent); cursor:pointer; }
  /* ===== 候診叫號 BOARD (signature) ===== */
  .board{ background:linear-gradient(135deg,#0b2437,#0f3a5c); border-radius:18px; padding:20px 22px; color:#fff; }
  .board .bh{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .board .bh .material-symbols-outlined{ color:var(--accent2); }
  .board .bh b{ font-size:15px; font-weight:900; } .board .bh small{ color:rgba(255,255,255,.6); font-size:12px; margin-left:auto; }
  .now{ display:flex; align-items:center; gap:20px; background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.4); border-radius:16px; padding:18px 20px; margin-bottom:16px; }
  .now .big{ font-size:52px; font-weight:900; color:var(--accent2); line-height:1; letter-spacing:.02em; }
  .now .meta b{ font-size:18px; color:#fff; } .now .meta small{ display:block; color:rgba(255,255,255,.65); font-size:12px; margin-top:3px; }
  .now .rm{ margin-left:auto; text-align:right; } .now .rm b{ font-size:14px; color:var(--accent2); } .now .rm small{ display:block; color:rgba(255,255,255,.6); font-size:11px; }
  .callrow{ display:flex; flex-wrap:wrap; gap:10px; }
  .callno{ min-width:64px; text-align:center; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:9px 8px; }
  .callno b{ display:block; font-size:20px; font-weight:900; color:#fff; } .callno small{ font-size:10px; color:rgba(255,255,255,.55); }
  .callno.done{ opacity:.42; } .callno.next{ border-color:var(--accent2); background:rgba(56,189,248,.16); }
  /* rooms */
  .rooms{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; } .rooms>*{ min-width:0; }
  .room{ border:1px solid var(--line); border-radius:14px; padding:14px; }
  .room .rt{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .room .rt b{ color:var(--ink); font-size:14px; font-weight:900; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .room .dr{ color:var(--body); font-size:12px; font-weight:700; } .room .pt{ color:var(--muted); font-size:12px; margin-top:6px; }
  /* queue list */
  .q{ display:flex; align-items:center; gap:13px; padding:11px 0; border-top:1px solid var(--line); } .q:first-of-type{ border-top:0; }
  .q-no{ width:40px; height:40px; border-radius:11px; background:var(--accent-soft); color:var(--accent-d); font-weight:900; font-size:15px; display:grid; place-content:center; flex:none; }
  .q.cur .q-no{ background:var(--accent); color:#fff; box-shadow:0 0 0 4px var(--accent-soft); }
  .q .info{ flex:1; min-width:0; } .q .info b{ color:var(--ink); font-size:14px; } .q .info small{ display:block; color:var(--muted); font-size:12px; }
  .q .st{ font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; flex:none; }
  .s-cur{ background:var(--accent-soft); color:var(--accent-d); } .s-wait{ background:var(--amber-soft); color:var(--amber); } .s-done{ background:#eef3f8; color:var(--muted); }
  /* ===== EMR 病歷卡 (signature) ===== */
  .emr{ border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .emr-hd{ background:linear-gradient(100deg,var(--accent-d),var(--accent)); color:#fff; padding:18px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .emr-av{ width:58px; height:58px; border-radius:16px; background:rgba(255,255,255,.16); display:grid; place-content:center; font-size:24px; font-weight:900; flex:none; }
  .emr-hd .pn b{ font-size:20px; font-weight:900; } .emr-hd .pn small{ display:block; opacity:.85; font-size:12px; margin-top:3px; }
  .emr-hd .tags{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .emr-hd .tags span{ font-size:11px; font-weight:800; background:rgba(255,255,255,.18); border-radius:999px; padding:4px 11px; }
  .emr-hd .tags span.alert{ background:#fecaca; color:#7f1d1d; }
  .emr-bd{ padding:18px 22px; background:#fff; }
  .vitals{ display:grid; grid-template-columns:repeat(5,1fr); gap:11px; margin-bottom:18px; } .vitals>*{ min-width:0; }
  .vt{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .vt b{ display:block; font-size:20px; color:var(--ink); font-weight:900; } .vt span{ font-size:11px; color:var(--muted); }
  .vt.hi b{ color:var(--red); }
  .visit{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .visit .d{ font-size:12px; color:var(--muted); width:74px; flex:none; font-weight:700; } .visit b{ color:var(--ink); font-size:13px; } .visit small{ display:block; color:var(--body); font-size:12px; margin-top:2px; }
  .visit .icd{ font-size:11px; font-weight:800; color:var(--accent-d); background:var(--accent-soft); border-radius:6px; padding:1px 7px; margin-left:6px; }
  /* form */
  .form{ display:grid; grid-template-columns:1fr 1fr; gap:14px; } .form>*{ min-width:0; }
  .fld{ display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:800; color:var(--body); } .fld.full{ grid-column:1/-1; }
  .fld input,.fld select,.fld textarea{ border:1px solid var(--line); border-radius:9px; padding:10px 12px; font:inherit; font-size:13px; color:var(--ink); outline:none; background:#fff; width:100%; }
  .fld input:focus,.fld textarea:focus,.fld select:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .rx{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .rx b{ color:var(--ink); font-size:13px; } .rx small{ color:var(--muted); font-size:11px; display:block; }
  /* table */
  .scroll{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:var(--bg); white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:var(--bg); }
  .tbl td.num{ font-variant-numeric:tabular-nums; text-align:right; font-weight:700; color:var(--ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .t-ok{ background:var(--ok-soft); color:#0a6b4b; } .t-wait{ background:var(--amber-soft); color:var(--amber); } .t-rej{ background:var(--red-soft); color:#991b1b; } .t-info{ background:var(--accent-soft); color:var(--accent-d); }
  /* bill */
  .bill{ border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .bill .bl{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px; border-top:1px solid var(--line); font-size:13px; }
  .bill .bl:first-child{ border-top:0; } .bill .bl b{ color:var(--ink); }
  .bill .bl.total{ background:var(--accent-soft); } .bill .bl.total b{ color:var(--accent-d); font-size:18px; }
  .bignum{ font-variant-numeric:tabular-nums; font-weight:900; color:var(--ink); }
  /* recall / chip */
  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; }
  .progress{ display:flex; flex-direction:column; gap:5px; }
  .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; } .bar span{ display:block; height:100%; border-radius:999px; background:var(--accent); }
  .note{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.7; color:var(--body); }
  .note b{ color:var(--ink); }
  .chartbox{ position:relative; height:280px; }
  .chartbox.sm{ height:230px; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; font-weight:700; color:var(--body); margin-top:10px; }
  .legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:middle; }
  .mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; } .mini>*{ min-width:0; }
  .mini .m{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .mini .m .l{ font-size:12px; color:var(--muted); font-weight:800; } .mini .m .v{ font-size:22px; font-weight:900; color:var(--ink); margin-top:6px; } .mini .m .s{ font-size:11px; font-weight:800; color:var(--ok); margin-top:3px; }
  /* ===== RWD ===== */
  @media (max-width:1000px){
    .g-53,.g-35{ grid-template-columns:1fr; }
    .kpis{ grid-template-columns:1fr 1fr; }
    .vitals{ grid-template-columns:repeat(3,1fr); }
    .rooms{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:820px){
    .g-2{ grid-template-columns:1fr; }
    .form{ grid-template-columns:1fr; }
    .mini{ grid-template-columns:1fr; }
  }
  @media (max-width:560px){
    .wrap{ padding:16px 14px 44px; }
    .nav button span:not(.material-symbols-outlined){ display:none; }
    .nav button{ padding:9px 10px; }
    .kpis{ grid-template-columns:1fr 1fr; }
    .vitals{ grid-template-columns:1fr 1fr; }
    .rooms{ grid-template-columns:1fr; }
    .who small{ display:none; }
    .now .big{ font-size:40px; }
    .vh h2{ font-size:19px; }
    .tb-chip span:not(.material-symbols-outlined){ display:none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">health_and_safety</span></span><div><b>診所營運照護艙</b><small>康和聯合診所 · 家醫 / 內科 / 皮膚科</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="tb-r">
      <span class="tb-chip"><span class="material-symbols-outlined">groups</span><span>候診 8 人</span></span>
      <div class="who"><span class="av">陳</span><div><b>陳懿德 醫師</b><small>家醫科 · 第 2 診間</small></div></div>
    </div>
  </div>
</header>
<div class="wrap"><div id="view"></div></div>

<script>
"use strict";
var MODS=[
  ["dashboard","營運總覽"],
  ["meeting_room","看診管理"],
  ["clinical_notes","電子病歷"],
  ["point_of_sale","批價申報"],
  ["medication","慢箋回診"],
  ["insights","營運指標"]
];
var SUB=[
  "今日看診量、營收、候診與申報即時儀表",
  "候診叫號、報到分診與各診間即時狀態",
  "病歷卡、生命徵象、就診紀錄與醫囑處方",
  "批價收費、部分負擔與健保申報上傳追蹤",
  "慢性病連續處方管理與主動回診提醒",
  "看診效率、健保申報與財務營運指標分析"
];

/* ---------- shared fake data ---------- */
var QUEUE=[
  ["36","王美玲","家醫科 · 高血壓複診","cur","看診中"],
  ["37","陳建宏","家醫科 · 感冒初診","wait","候診"],
  ["38","林淑芬","家醫科 · 慢箋領藥","wait","候診"],
  ["39","黃志偉","內科 · 健檢報告","wait","候診"],
  ["40","吳雅婷","皮膚科 · 過敏","wait","候診"],
  ["41","張家豪","家醫科 · 定期追蹤","wait","候診"],
  ["35","李佳穎","家醫科 · 複診","done","已完成"],
  ["34","趙敏","內科 · 糖尿病","done","已完成"]
];
var ROOMS=[
  ["第 1 診間","家醫科","王品文 醫師","看診中","36 王美玲","var(--ok)"],
  ["第 2 診間","家醫科","陳懿德 醫師","看診中","33 劉冠廷","var(--ok)"],
  ["第 3 診間","內科","蔡宜臻 醫師","候診","下一位 39","var(--amber)"],
  ["第 4 診間","皮膚科","何明翰 醫師","看診中","28 吳雅婷","var(--ok)"],
  ["第 5 診間","家醫科","—","休診","下午診 14:00","var(--muted)"],
  ["處置室","—","林護理長","可用","備藥 / 換藥","var(--accent)"]
];

/* ---------- screens ---------- */
var SCREENS={};

/* 0 · 營運總覽 */
SCREENS[0]=function(){
  var kpi=[
    ["今日看診量","148","診次","+12 較昨","monitoring","down"],
    ["候診等待","12","分鐘","−23 分鐘","hourglass_top","down"],
    ["今日營收","NT$ 86,240","","+9.4%","payments","down"],
    ["申報退件率","1.9","%","−6.6pp","fact_check","down"]
  ];
  return '<div class="vh"><div><h2><span class="material-symbols-outlined">dashboard</span>營運總覽</h2><p>'+SUB[0]+'</p></div><button class="btn"><span class="material-symbols-outlined">refresh</span>更新即時資料</button></div>'
  +'<div class="kpis">'+kpi.map(function(k){return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[4]+'</span>'+k[0]+'</div><div class="v">'+k[1]+' <small>'+k[2]+'</small></div><div class="d '+k[5]+'">'+k[3]+'</div></div>';}).join('')+'</div>'
  +'<div class="grid g-53" style="margin-bottom:18px;">'
    +'<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>今日各時段看診量<span class="grow">上午 / 下午</span></h3><div class="chartbox sm"><canvas id="c-vol"></canvas></div></div>'
    +'<div class="board"><div class="bh"><span class="material-symbols-outlined">campaign</span><b>候診叫號看板</b><small>家醫科 · 上午診</small></div>'
      +'<div class="now"><div class="big">36</div><div class="meta"><b>王美玲</b><small>第 1 診間 · 高血壓複診</small></div><div class="rm"><b>第 1 診間</b><small>看診中</small></div></div>'
      +'<div class="callrow">'+[["34","已看","done"],["35","已看","done"],["36","看診中","next"],["37","候診",""],["38","候診",""],["39","候診",""]].map(function(c){return '<div class="callno '+c[2]+'"><b>'+c[0]+'</b><small>'+c[1]+'</small></div>';}).join('')+'</div>'
    +'</div>'
  +'</div>'
