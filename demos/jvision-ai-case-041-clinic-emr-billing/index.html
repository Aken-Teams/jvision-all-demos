<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>診所營運照護艙｜Jvision 系統 Demo</title>
<meta name="description" content="診所 EMR + 營運 + 批價申報：看診管理、電子病歷、批價/健保申報、慢箋回診與營運指標（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,700,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --ok:#047857;
  --amber:#A14505;
  --red:#B91C1C;
  --paper:#FFF;
  --shadow:7px 7px 0 #164E63;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--color-background)}
body{
  font-family:"Atkinson Hyperlegible","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,select{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 24;
  line-height:1;
}
:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  inset-block-start:0;
  z-index:40;
  background:var(--color-card);
  color:var(--ink);
  border-block-end:4px solid var(--ink);
}
.tb-in{
  max-width:1440px;
  min-height:78px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .lg{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav{
  align-self:stretch;
  display:flex;
  align-items:center;
  gap:0;
  border-inline:2px solid var(--ink);
}
.nav button{
  min-height:54px;
  padding:8px 12px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:0;
  border-inline-end:2px solid var(--ink);
  background:transparent;
  color:var(--ink);
  font-weight:700;
}
.nav button:last-child{border-inline-end:0}
.nav button:hover{background:var(--color-muted)}
.nav button.on{
  background:var(--color-primary);
  color:#001B22;
  box-shadow:inset 0 -7px 0 var(--color-secondary);
}
.nav button .material-symbols-outlined{font-size:20px}
.tb-r{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.tb-chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border:2px solid var(--ink);
  background:var(--color-secondary);
  color:#0F172A;
  font-size:12px;
  font-weight:700;
}
.who{display:flex;align-items:center;gap:9px}
.who .av{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  background:var(--color-accent);
  color:#001C12;
  font-weight:700;
}
.who b,.who small{display:block}
.who b{font-size:13px}.who small{font-size:11px;color:var(--muted)}
.wrap{max-width:1440px;margin:auto;padding:32px 24px 70px}
.vh{
  min-height:120px;
  margin-block-end:24px;
  padding:22px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  background:var(--color-secondary);
  color:#0F172A;
  border:4px solid var(--ink);
  box-shadow:var(--shadow);
}
.vh h2{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:#0F172A;
  font-size:clamp(26px,4vw,48px);
  line-height:1;
  letter-spacing:-.04em;
  font-weight:700;
}
.vh h2 .material-symbols-outlined{font-size:.8em}
.vh p{margin:10px 0 0;font-size:14px;font-weight:700}
.btn{
  min-height:44px;
  padding:9px 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:3px solid var(--ink);
  border-radius:0;
  background:var(--color-accent);
  color:#001C12;
  box-shadow:4px 4px 0 var(--ink);
  font-weight:700;
}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn .material-symbols-outlined{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-block-end:24px}
.kpi{
  min-width:0;
  min-height:150px;
  padding:17px;
  position:relative;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--color-primary);
}
.kpi:nth-child(even){transform:translateY(8px);box-shadow:5px 5px 0 var(--color-accent)}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:700}
.kpi .l .material-symbols-outlined{color:var(--blue)}
.kpi .v{
  margin-block-start:18px;
  color:var(--ink);
  font-size:30px;
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{color:var(--muted);font-size:13px}
.kpi .d{margin-block-start:10px;color:var(--ok);font-size:12px;font-weight:700}
.kpi .d::before{content:"改善 ";font-family:inherit}
.grid{display:grid;gap:22px}.grid>*{min-width:0}
.g-2{grid-template-columns:1fr 1fr}
.g-53{grid-template-columns:1.55fr 1fr}
.g-35{grid-template-columns:1fr 1.55fr}
.card,.board,.emr{
  min-width:0;
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--ink);
}
.card{padding:20px}
.card>h3{
  margin:0 0 17px;
  padding-block-end:10px;
  display:flex;
  align-items:center;
  gap:8px;
  border-block-end:3px solid var(--ink);
  color:var(--ink);
  font-size:16px;
  font-weight:700;
}
.card>h3 .material-symbols-outlined{color:var(--blue)}
.card>h3 .grow{margin-inline-start:auto;color:var(--blue);font-size:12px}
.board{padding:20px;background:#103E4E;color:#FFF;box-shadow:6px 6px 0 var(--color-secondary)}
.board .bh{display:flex;align-items:center;gap:9px;margin-block-end:18px}
.board .bh .material-symbols-outlined{color:var(--color-secondary)}
.board .bh b{font-size:17px}.board .bh small{margin-inline-start:auto;color:#D9F8FC;font-size:12px}
.now{
  margin-block-end:16px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:18px;
  border:3px solid var(--color-secondary);
  background:#072D39;
}
.now .big{
  color:var(--color-secondary);
  font:700 56px/1 var(--mono);
  letter-spacing:-.06em;
}
.now .meta b{font-size:19px}.now .meta small,.now .rm small{display:block;color:#D9F8FC;font-size:12px}
.now .rm{margin-inline-start:auto;text-align:end}.now .rm b{color:var(--color-secondary)}
.callrow{display:flex;flex-wrap:wrap;gap:9px}
.callno{
  min-width:65px;
  padding:9px;
  text-align:center;
  border:2px solid #B7DCE3;
  background:#164E63;
}
.callno b{display:block;font:700 20px/1.2 var(--mono)}
.callno small{color:#D9F8FC;font-size:11px}
.callno.done{opacity:.62;text-decoration:line-through}
.callno.next{background:var(--color-secondary);color:#001B22;border-color:#FFF}
.callno.next small{color:#001B22;font-weight:700}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.room{padding:14px;border:2px solid var(--ink);background:var(--color-background)}
.room .rt{display:flex;justify-content:space-between;align-items:center;margin-block-end:9px}
.room .rt b{color:var(--ink)}
.dot{width:13px;height:13px;display:inline-block;border:2px solid var(--ink)}
.room .dr{font-size:12px;font-weight:700}.room .pt{margin-block-start:6px;color:var(--muted);font-size:12px}
.q{padding:12px 0;display:flex;align-items:center;gap:12px;border-block-start:2px solid var(--line)}
.q:first-of-type{border-block-start:0}
.q-no{
  width:43px;
  height:43px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  background:var(--color-muted);
  color:var(--ink);
  font:700 15px var(--mono);
}
.q.cur .q-no{background:var(--color-secondary);box-shadow:3px 3px 0 var(--ink)}
.q .info{flex:1;min-width:0}.q .info b{color:var(--ink)}.q .info small{display:block;color:var(--muted);font-size:12px}
.st,.tag,.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 9px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.st::before,.tag::before{font-family:"Material Symbols Outlined";font-size:14px}
.s-cur,.t-info{background:#CFFAFE;color:#155E75}.s-cur::before,.t-info::before{content:"schedule"}
.s-wait,.t-wait{background:#FEF3C7;color:#854D0E}.s-wait::before,.t-wait::before{content:"hourglass_top"}
.s-done,.t-ok{background:#D1FAE5;color:#065F46}.s-done::before,.t-ok::before{content:"check_circle"}
.t-rej{background:#FEE2E2;color:#991B1B}.t-rej::before{content:"error"}
.emr{overflow:hidden}
.emr-hd{
  padding:20px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  background:var(--color-primary);
  color:#001B22;
  border-block-end:4px solid var(--ink);
}
.emr-av{
  width:60px;height:60px;display:grid;place-items:center;
  border:3px solid var(--ink);background:var(--color-secondary);
  font-size:26px;font-weight:700;box-shadow:4px 4px 0 var(--ink)
}
.emr-hd .pn b{font-size:22px}.emr-hd .pn small{display:block;margin-block-start:3px;font:12px var(--mono)}
.emr-hd .tags{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:7px}
.emr-hd .tags span{padding:5px 9px;border:2px solid #001B22;background:#FFF;font-size:11px;font-weight:700}
.emr-hd .tags .alert{background:#FEE2E2;color:#7F1D1D}
.emr-hd .tags .alert::before{content:"警示｜"}
.emr-bd{padding:20px}
.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-block-end:20px}
.vt{padding:13px;text-align:center;border:2px solid var(--ink);background:var(--color-background)}
.vt b{display:block;color:var(--ink);font:700 20px var(--mono)}
.vt span{color:var(--muted);font-size:11px}.vt.hi{background:#FEE2E2}.vt.hi b{color:var(--red)}.vt.hi::after{content:"偏高";color:var(--red);font-size:11px;font-weight:700}
.visit{padding:12px 0;display:flex;gap:12px;border-block-start:2px solid var(--line)}
.visit .d{width:74px;flex:none;color:var(--muted);font:700 12px var(--mono)}
.visit b{color:var(--ink)}.visit small{display:block;margin-block-start:3px;font-size:12px}
.icd{margin-inline-start:7px;padding:2px 6px;border:1px solid var(--blue);background:#CFFAFE;color:#155E75;font:700 11px var(--mono)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fld{display:flex;flex-direction:column;gap:6px;color:var(--ink);font-size:12px;font-weight:700}.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{
  width:100%;padding:11px;border:2px solid var(--ink);border-radius:0;background:#FFF;color:var(--ink);outline:0
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:4px solid var(--color-ring);outline-offset:2px}
.rx{padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;border-block-start:2px solid var(--line)}
.rx:first-of-type{border-block-start:0}.rx b{color:var(--ink)}.rx small{display:block;color:var(--muted);font-size:11px}
.scroll{overflow-x:auto;border:2px solid var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  padding:11px 12px;
  border-inline-end:1px solid #FFF;
  border-block-end:3px solid var(--ink);
  background:var(--ink);
  color:#FFF;
  text-align:start;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.tbl td{padding:12px;border-block-end:2px solid var(--line);white-space:nowrap}
.tbl tbody tr:nth-child(even) td{background:var(--color-background)}
.tbl tr:hover td{background:#CFFAFE}
.tbl td.num{text-align:end;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl td:first-child,.bignum{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bill{border:3px solid var(--ink)}
.bill .bl{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;border-block-start:2px solid var(--ink)}
.bill .bl:first-child{border-block-start:0}.bill .bl b{color:var(--ink)}
.bill .bl.total{background:var(--color-secondary)}.bill .bl.total b{font-size:18px}
.bignum{font-weight:700;color:var(--ink)}
.note{padding:14px;border:2px solid var(--ink);background:var(--color-background);line-height:1.7}.note b{color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini .m{padding:13px;border:2px solid var(--ink);background:var(--color-background)}
.mini .l{color:var(--muted);font-size:12px;font-weight:700}.mini .v{margin-block-start:5px;color:var(--ink);font-size:22px;font-weight:700}.mini .s{margin-block-start:3px;color:var(--ok);font-size:11px;font-weight:700}
.progress{min-width:100px}.bar{height:12px;border:2px solid var(--ink);background:#FFF}.bar span{display:block;height:100%;background:var(--color-primary)}
.chartbox{position:relative;height:280px}.chartbox.sm{height:230px}
.legend{margin-block-start:12px;display:flex;flex-wrap:wrap;gap:14px;font-size:12px;font-weight:700}
.legend i{width:13px;height:13px;display:inline-block;margin-inline-end:5px;border:1px solid var(--ink);vertical-align:-2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{animation:none}
}
@media(max-width:1180px){
  .tb-in{align-items:flex-start;flex-wrap:wrap}.nav{order:3;width:100%;overflow-x:auto;border:2px solid var(--ink)}.nav button{flex:1}
  .g-53,.g-35{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.vitals{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .wrap{padding:22px 15px 55px}.g-2{grid-template-columns:1fr}.rooms{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.fld.full{grid-column:auto}
  .mini{grid-template-columns:1fr}.vh{box-shadow:4px 4px 0 var(--ink)}.who small{display:none}
}
@media(max-width:560px){
  .tb-in{padding:9px 12px}.brand small,.tb-chip span:last-child,.nav button span:last-child{display:none}
  .nav button{min-width:50px;justify-content:center;padding:8px}.tb-r{margin-inline-start:auto}
  .kpis,.vitals,.rooms{grid-template-columns:1fr}.kpi:nth-child(even){transform:none}.card,.board,.emr{box-shadow:4px 4px 0 var(--ink)}
  .now{align-items:flex-start;flex-wrap:wrap}.now .rm{margin-inline-start:0;text-align:start}.vh h2{font-size:29px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <span class="lg"><span class="material-symbols-outlined">health_and_safety</span></span>
      <div><b>診所營運照護艙</b><small>康和聯合診所 · 家醫 / 內科 / 皮膚科</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="tb-r">
      <span class="tb-chip"><span class="material-symbols-outlined">groups</span><span>候診 8 人</span></span>
      <div class="who"><span class="av">陳</span><div><b>陳懿德 醫師</b><small>家醫科 · 第 2 診間</small></div></div>
    </div>
  </div>
</header>
<main class="wrap"><div id="view" class="reveal"></div></main>
<script>
"use strict";
var MODS=[
  ["dashboard","營運總覽"],["meeting_room","看診管理"],["clinical_notes","電子病歷"],
  ["point_of_sale","批價申報"],["medication","慢箋回診"],["insights","營運指標"]
];
var SUB=[
  "今日看診量、營收、候診與申報即時儀表",
  "候診叫號、報到分診與各診間即時狀態",
  "病歷卡、生命徵象、就診紀錄與醫囑處方",
  "批價收費、部分負擔與健保申報上傳追蹤",
  "慢性病連續處方管理與主動回診提醒",
  "看診效率、健保申報與財務營運指標分析"
];
var QUEUE=[
  ["36","王美玲","家醫科 · 高血壓複診","cur","看診中"],
  ["37","陳建宏","家醫科 · 感冒初診","wait","候診"],
  ["38","林淑芬","家醫科 · 慢箋領藥","wait","候診"],
  ["39","黃志偉","內科 · 健檢報告","wait","候診"],
  ["40","吳雅婷","皮膚科 · 過敏","wait","候診"],
  ["41","張家豪","家醫科 · 定期追蹤","wait","候診"],
  ["35","李佳穎","家醫科 · 複診","done","已完成"],
  ["34","趙敏","內科 · 糖尿病","done","已完成"]
];
var ROOMS=[
  ["第 1 診間","家醫科","王品文 醫師","看診中","36 王美玲","#047857"],
  ["第 2 診間","家醫科","陳懿德 醫師","看診中","33 劉冠廷","#047857"],
  ["第 3 診間","內科","蔡宜臻 醫師","候診","下一位 39","#A14505"],
  ["第 4 診間","皮膚科","何明翰 醫師","看診中","28 吳雅婷","#047857"],
  ["第 5 診間","家醫科","—","休診","下午診 14:00","#475569"],
  ["處置室","—","林護理長","可用","備藥 / 換藥","#0891B2"]
];
var SCREENS={};
function head(i,icon,title,action,ghost){
  return '<div class="vh"><div><h2><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h2><p>'+SUB[i]+'</p></div>'+action.replace('class="btn"','class="btn'+(ghost?' ghost':'')+'"')+'</div>';
}

  return '<div class="kpis">'+rows.map(function(k){

  nav.querySelectorAll("[data-i]").forEach(function(b){
    var on=Number(b.dataset.i)===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  destroyCharts();
  view.classList.remove("reveal");
  view.innerHTML=SCREENS[i]();
  void view.offsetWidth;
  view.classList.add("reveal");
  initCharts(i);
}
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");
  if(b){
    var hash="#v"+b.dataset.i;
    if(location.hash===hash)show(b.dataset.i);else location.hash=hash;
  }
});
nav.addEventListener("keydown",function(e){
  var b=e.target.closest("button[data-i]");
  if(!b||!["ArrowLeft","ArrowRight","Home","End"].includes(e.key))return;
  e.preventDefault();
  var i=Number(b.dataset.i);
  if(e.key==="ArrowRight")i=(i+1)%6;
  if(e.key==="ArrowLeft")i=(i+5)%6;
  if(e.key==="Home")i=0;
  if(e.key==="End")i=5;
  location.hash="#v"+i;
  nav.querySelector('[data-i="'+i+'"]').focus();
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(Number(m[1]),5):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
