<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>應付帳款管理系統（AP System）| JVISION</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#0d9488; --accent2:#2dd4bf;
  --bg:#0b1417; --panel:#111f24; --panel2:#152a30; --line:#22424a;
  --txt:#e6f2f1; --muted:#8fb3b0; --dim:#5f8580;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Inter","Noto Sans TC",sans-serif;overflow-x:hidden}
body{min-height:100vh}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

/* NAV */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#0a1315,#0e2126);border-bottom:1px solid var(--line);box-shadow:0 2px 18px rgba(0,0,0,.4)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04211d;flex-shrink:0}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand-txt span{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{display:flex;align-items:center;gap:6px;background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{color:var(--txt);border-color:var(--accent)}
.nav button.active{background:linear-gradient(135deg,var(--accent),#0f766e);color:#04211d;border-color:var(--accent2);font-weight:700}
.nav button.active .material-symbols-outlined{color:#04211d}

/* LAYOUT */
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.screen-head .st{min-width:0}
.screen-head h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h1 .material-symbols-outlined{color:var(--accent2);font-size:24px}
.screen-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.chip{font-size:11px;color:var(--accent2);background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.3);padding:4px 9px;border-radius:20px;font-weight:600}
.head-chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.7fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card-h b{font-size:14px;font-weight:700}
.card-h .sub{font-size:11px;color:var(--dim);margin-left:auto}

/* KPI */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.16),transparent 70%)}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px}
.kpi .delta .material-symbols-outlined{font-size:14px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{text-align:left;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(34,66,74,.5);white-space:nowrap}
.tbl tr:hover td{background:rgba(45,212,191,.04)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.14);color:var(--ok)}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.b-bad{background:rgba(248,113,113,.14);color:var(--bad)}
.b-info{background:rgba(56,189,248,.14);color:var(--info)}
.b-dim{background:rgba(143,179,176,.12);color:var(--muted)}

.chartbox{width:100%;overflow:hidden}

/* progress bar */
.pbar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* match/3-way signature */
.match{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
@media(max-width:560px){.match{grid-template-columns:1fr}}
.match .doc{padding:14px;border:1px solid var(--line);text-align:center}
.match .doc:not(:last-child){border-right:none}
@media(max-width:560px){.match .doc:not(:last-child){border-right:1px solid var(--line);border-bottom:none}}
.match .doc .material-symbols-outlined{font-size:30px;color:var(--accent2)}
.match .doc .t{font-size:12px;color:var(--muted);margin-top:6px}
.match .doc .v{font-size:17px;font-weight:800;margin-top:3px}

.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:11px;padding:11px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;min-width:0}
.li .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li .ic .material-symbols-outlined{font-size:19px}
.li .tx{min-width:0;flex:1}
.li .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:11px;color:var(--muted)}
.li .rt{text-align:right;flex-shrink:0}
.li .rt b{font-size:14px;font-variant-numeric:tabular-nums}
.li .rt span{font-size:10.5px;color:var(--dim);display:block}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 0}
.tl .ev::before{content:"";position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl .ev.warn::before{background:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.tl .ev.bad::before{background:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.tl .ev .tt{font-size:10.5px;color:var(--dim)}
.tl .ev b{font-size:13px;display:block;margin:2px 0}
.tl .ev p{font-size:11.5px;color:var(--muted)}

/* board columns */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col .ch .cnt{background:var(--panel);color:var(--muted);font-size:11px;padding:1px 8px;border-radius:20px}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;min-width:0}
.tk .id{font-size:10px;color:var(--dim)}
.tk b{font-size:12.5px;display:block;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .m{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tk.warn{border-left-color:var(--warn)}
.tk.bad{border-left-color:var(--bad)}

.mini{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:9px;font-size:12px}
.mrow .nm{width:88px;color:var(--muted);flex-shrink:0}
.mrow .pbar{flex:1}
.mrow .vv{width:64px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}

.stat-inline{display:flex;gap:18px;flex-wrap:wrap}
.stat-inline .si{min-width:0}
.stat-inline .si .l{font-size:11px;color:var(--muted)}
.stat-inline .si .v{font-size:18px;font-weight:800}

.note{font-size:11px;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px}
.note .material-symbols-outlined{font-size:15px;color:var(--accent2)}

.foot{max-width:1360px;margin:0 auto;padding:20px 16px;color:var(--dim);font-size:11px;text-align:center;border-top:1px solid var(--line)}

@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:8px 10px}
  .brand-txt span{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">payments</span></div>
      <div class="brand-txt">
        <b>應付帳款管理系統</b>
        <span>Accounts Payable · Smart MFG Finance</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main class="wrap"><div id="screen"></div></main>
<div class="foot">JVISION 智慧製造財會平台 · 應付帳款管理系統（AP System）· 本頁為純前端展示，資料皆為模擬</div>

<script>
"use strict";
var container = document.getElementById("screen");
var charts = [];
function destroyCharts(){ for(var i=0;i<charts.length;i++){ try{ charts[i].destroy(); }catch(e){} } charts=[]; }
function el(id){ return document.getElementById(id); }
function money(n){ return "$" + n.toLocaleString("en-US"); }

var MODULES = [
  {icon:"receipt_long", name:"發票登錄", desc:"供應商發票登錄與憑證建檔"},
  {icon:"fact_check",   name:"三方核對", desc:"發票/採購單/驗收單比對"},
  {icon:"gavel",        name:"付款審核", desc:"授權額度檢核與覆核"},
  {icon:"calendar_month",name:"付款排程",desc:"付款批次與現金流"},
  {icon:"request_quote",name:"預付押金", desc:"預付款與押金沖銷"},
  {icon:"insights",     name:"帳齡看板", desc:"帳齡與逾期風險分析"}
];

var axisColors = { colors:"#8fb3b0" };
function baseChart(type,height){
  return {
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:type,height:height,background:"transparent",toolbar:{show:false},
      redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:"Inter, Noto Sans TC, sans-serif"},
    theme:{mode:"dark"},
    grid:{borderColor:"#22424a",strokeDashArray:3},
    legend:{labels:{colors:"#8fb3b0"},fontSize:"12px"},
    tooltip:{theme:"dark"},
    dataLabels:{enabled:false}
  };
}

/* ---------------- SCREEN 0: 發票登錄 ---------------- */
function screen0(){
  var invoices=[
    {no:"INV-2408-0417",sup:"O鋼機械股份",po:"PO-88231",amt:1284500,tax:64225,date:"08/12",due:"09/11",st:"待核對",cat:"設備零件"},
    {no:"INV-2408-0416",sup:"O達精密工業",po:"PO-88190",amt:486300,tax:24315,date:"08/12",due:"08/27",st:"已登錄",cat:"耗材"},
    {no:"INV-2408-0415",sup:"台O電控科技",po:"PO-88155",amt:2130000,tax:106500,date:"08/11",due:"09/25",st:"待核對",cat:"控制系統"},
    {no:"INV-2408-0414",sup:"金屬表面處理廠",po:"PO-88142",amt:97800,tax:4890,date:"08/11",due:"08/26",st:"缺憑證",cat:"委外加工"},
    {no:"INV-2408-0413",sup:"O新物流",po:"PO-88120",amt:58200,tax:2910,date:"08/10",due:"08/24",st:"已登錄",cat:"運輸"},
    {no:"INV-2408-0412",sup:"聯O潤滑油品",po:"PO-88101",amt:312400,tax:15620,date:"08/10",due:"09/09",st:"待核對",cat:"油品"}
  ];
  function stBadge(s){
    if(s==="已登錄") return '<span class="badge b-ok">'+s+'</span>';
    if(s==="待核對") return '<span class="badge b-info">'+s+'</span>';
    return '<span class="badge b-bad">'+s+'</span>';
  }
  var rows=invoices.map(function(v){
    return '<tr><td><b>'+v.no+'</b></td><td>'+v.sup+'</td><td>'+v.po+'</td><td>'+v.cat+'</td>'+
      '<td class="num">'+money(v.amt)+'</td><td class="num" style="color:var(--muted)">'+money(v.tax)+'</td>'+
      '<td>'+v.date+'</td><td>'+v.due+'</td><td>'+stBadge(v.st)+'</td></tr>';
  }).join("");

  container.innerHTML =
  head(0,"當月發票登錄與憑證建檔，帶入稅額、付款條件與到期日",["本月 214 張","已登錄 187","缺憑證 6"])+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("receipt_long","本月登錄張數","214","張","up","較上月 +18 張")+
    kpi("payments","應付總額","64.2","M","flat","含稅 5%")+
    kpi("verified","憑證完整率","97.2","%","up","+2.1pp")+
    kpi("warning","缺憑證待補","6","筆","down","-3 筆")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card pad0"><div class="card-h" style="padding:16px 16px 0"><span class="material-symbols-outlined">list_alt</span><b>近期發票登錄清單</b><span class="sub">依登錄時間排序</span></div>'+
      '<div class="scrollx" style="padding:12px 16px 16px"><table class="tbl"><thead><tr><th>發票號</th><th>供應商</th><th>採購單</th><th>類別</th><th class="num">金額(未稅)</th><th class="num">稅額</th><th>發票日</th><th>到期日</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-h"><span class="material-symbols-outlined">donut_large</span><b>發票類別占比</b></div><div class="chartbox" id="c0a"></div>'+
      '<div class="note"><span class="material-symbols-outlined">bolt</span>設備零件與控制系統占月度應付逾六成</div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><div class="card-h"><span class="material-symbols-outlined">bar_chart</span><b>每日登錄張數趨勢</b><span class="sub">近 10 個工作日</span></div><div class="chartbox" id="c0b"></div></div>'+
    '<div class="card"><div class="card-h"><span class="material-symbols-outlined">assignment_late</span><b>缺憑證待補清單</b></div>'+
      '<div class="list">'+
        liItem("bad","description","INV-2408-0414 · 委外加工","金屬表面處理廠 · 缺統一發票正本","$97,800","逾補3天")+
        liItem("warn","request_quote","INV-2408-0389 · 耗材","華泰五金 · 缺驗收單","$41,200","待補")+
        liItem("warn","local_shipping","INV-2408-0371 · 運輸","O新物流 · 缺簽收單","$12,600","待補")+
        liItem("bad","receipt","INV-2408-0355 · 油品","聯O潤滑 · 發票品項不符","$8,400","退回")+
      '</div></div>'+
  '</div>';

  void container.offsetHeight;

  var c0a=new ApexCharts(el("c0a"),Object.assign(baseChart("donut",250),{
    series:[34,22,15,12,10,7],
    labels:["設備零件","控制系統","委外加工","耗材","油品","運輸"],
    colors:["#0d9488","#2dd4bf","#38bdf8","#fbbf24","#a78bfa","#f472b6"],
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總類別",color:"#8fb3b0",formatter:function(){return "6 類";}}}}}},
    legend:{position:"bottom",labels:{colors:"#8fb3b0"}}
  }));
  c0a.render(); charts.push(c0a);

  var c0b=new ApexCharts(el("c0b"),Object.assign(baseChart("bar",250),{
    series:[{name:"登錄張數",data:[18,24,21,29,17,26,31,22,28,21]}],
    xaxis:{categories:["8/1","8/2","8/5","8/6","8/7","8/8","8/9","8/11","8/12","8/13"],labels:{style:axisColors}},
    yaxis:{labels:{style:axisColors}},
    colors:["#2dd4bf"],
    plotOptions:{bar:{borderRadius:4,columnWidth:"55%"}}
  }));
  c0b.render(); charts.push(c0b);
}

/* ---------------- SCREEN 1: 三方核對 ---------------- */
function screen1(){
  var cases=[
    {no:"INV-2408-0417",po:"PO-88231",grn:"GRN-77412",inv:1284500,poa:1284500,grna:1284500,st:"相符"},
    {no:"INV-2408-0410",po:"PO-88097",grn:"GRN-77380",inv:658000,poa:658000,grna:632000,st:"數量差異"},
    {no:"INV-2408-0405",po:"PO-88051",grn:"GRN-77341",inv:920400,poa:895000,grna:920400,st:"金額差異"},
    {no:"INV-2408-0398",po:"PO-88012",grn:"GRN-77302",inv:145600,poa:145600,grna:145600,st:"相符"},
    {no:"INV-2408-0391",po:"PO-87988",grn:"—",inv:73200,poa:73200,grna:0,st:"缺驗收單"}
  ];
  function stB(s){
    if(s==="相符") return '<span class="badge b-ok"><span class="material-symbols-outlined" style="font-size:13px">check</span>'+s+'</span>';
    if(s==="缺驗收單") return '<span class="badge b-bad">'+s+'</span>';
    return '<span class="badge b-warn">'+s+'</span>';
  }
  var rows=cases.map(function(c){
    var d=c.inv-c.grna;
    return '<tr><td><b>'+c.no+'</b></td><td>'+c.po+'</td><td>'+c.grn+'</td>'+
      '<td class="num">'+money(c.inv)+'</td><td class="num">'+money(c.poa)+'</td>'+
      '<td class="num">'+(c.grna? money(c.grna):"—")+'</td>'+
      '<td class="num" style="color:'+(d===0?"var(--muted)":"var(--bad)")+'">'+(d===0?"$0":money(d))+'</td>'+
      '<td>'+stB(c.st)+'</td></tr>';
  }).join("");

  container.innerHTML =
  head(1,"自動比對發票、採購單（PO）與驗收單（GRN），標示三方差異供人工判讀",["待核 42","相符率 88%","差異 5"])+

    {sup:"聯O潤滑油品",amt:312400,age:"31-60天",days:44,risk:"中",r:"warn"},
    {sup:"金屬表面處理廠",amt:97800,age:"61-90天",days:73,risk:"高",r:"bad"},
    {sup:"O泰五金行",amt:186200,age:"90天+",days:104,risk:"高",r:"bad"},
    {sup:"O新物流",amt:58200,age:"1-30天",days:8,risk:"低",r:"ok"}
  ];
  function riskB(r,risk){
    var cls=r==="ok"?"b-ok":(r==="warn"?"b-warn":"b-bad");
    return '<span class="badge '+cls+'">'+risk+'</span>';
  }
  var body=rows.map(function(x){
    return '<tr><td><b>'+x.sup+'</b></td><td class="num">'+money(x.amt)+'</td><td>'+x.age+'</td>'+
      '<td class="num">'+x.days+' 天</td><td>'+riskB(x.r,x.risk)+'</td>'+
      '<td>'+(x.r==="bad"?'<span class="badge b-bad">優先追蹤</span>':(x.r==="warn"?'<span class="badge b-warn">留意</span>':'<span class="badge b-dim">正常</span>'))+'</td></tr>';
  }).join("");
  return '<div class="scrollx" style="padding:12px 16px 16px"><table class="tbl"><thead><tr><th>供應商</th><th class="num">應付金額</th><th>帳齡</th><th class="num">逾期天數</th><th>風險</th><th>建議</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ---------------- helpers ---------------- */
function head(i,desc,chips){
  var m=MODULES[i];
  var c=chips.map(function(x){return '<span class="chip">'+x+'</span>';}).join("");
  return '<div class="screen-head"><div class="st"><h1><span class="material-symbols-outlined">'+m.icon+'</span>'+m.name+'</h1><p>'+desc+'</p></div><div class="head-chips">'+c+'</div></div>';
}
function kpi(icon,lab,val,unit,dir,note){
  var arrow=dir==="up"?"arrow_upward":(dir==="down"?"arrow_downward":"remove");
  var cls=dir==="up"?"up":(dir==="down"?"down":"flat");
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'+
    '<div class="val">'+val+'<small>'+unit+'</small></div>'+
    '<div class="delta '+cls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+note+'</div></div>';
}
function liItem(tone,icon,title,sub,rt1,rt2){
  var bg={ok:"rgba(52,211,153,.14)",warn:"rgba(251,191,36,.14)",bad:"rgba(248,113,113,.14)",info:"rgba(56,189,248,.14)"}[tone];
  var col={ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)",info:"var(--info)"}[tone];
  return '<div class="li"><div class="ic" style="background:'+bg+'"><span class="material-symbols-outlined" style="color:'+col+'">'+icon+'</span></div>'+
    '<div class="tx"><b>'+title+'</b><span>'+sub+'</span></div>'+
    '<div class="rt"><b>'+rt1+'</b><span>'+rt2+'</span></div></div>';
}
function mrow(nm,tag,pct){
  return '<div class="mrow"><span class="nm">'+nm+'</span><div class="pbar"><i style="width:'+pct+'%"></i></div><span class="vv">'+tag+'</span></div>';
}
function tlEv(tone,tt,title,desc){
  return '<div class="ev '+(tone||"")+'"><div class="tt">'+tt+'</div><b>'+title+'</b><p>'+desc+'</p></div>';
}
function siInline(l,v){ return '<div class="si"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'; }

/* ---------------- nav / router ---------------- */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function buildNav(){
  var nav=el("nav");
  var html="";
  for(var i=0;i<MODULES.length;i++){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="txt">'+MODULES[i].name+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ show(+this.getAttribute("data-i")); });
  }
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i); }
  SCREENS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
