<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000;
  --color-ring:#FFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#A8B5C8;
  --line:#334155;
  --accent:#22C55E;
  --accent2:#4ADE80;
  --bg:#020617;
  --panel:#0E1223;
  --panel2:#151A2D;
  --txt:#F8FAFC;
  --dim:#94A3B8;
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#FB7185;
  --info:#60A5FA;
  --shadow:0 18px 46px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark;scroll-behavior:smooth}
body{min-height:100vh;margin:0;background:
radial-gradient(circle at 7% -5%,rgba(34,197,94,.10),transparent 25rem),
radial-gradient(circle at 97% 14%,rgba(59,130,246,.08),transparent 30rem),
var(--bg);color:var(--txt);font-family:"Fira Sans",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button,a,[role=button]{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:1.25rem;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--accent);color:var(--color-on-accent)}
.topbar{position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(51,65,85,.82);background:rgba(2,6,23,.88);box-shadow:0 8px 28px rgba(0,0,0,.3);backdrop-filter:blur(18px)}
.topbar-inner{width:min(1440px,100%);margin:auto;padding:12px 22px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(74,222,128,.55);border-radius:12px;background:linear-gradient(145deg,#172033,#0F172A);color:var(--accent2);box-shadow:0 0 22px rgba(34,197,94,.14),inset 0 1px rgba(255,255,255,.08)}
.logo .material-symbols-outlined{font-size:24px}
.brand-txt b{display:block;font-size:15px;line-height:1.2;letter-spacing:.02em;text-shadow:0 0 10px rgba(248,250,252,.17)}
.brand-txt span{display:block;margin-top:4px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.nav{display:flex;gap:6px;margin-left:auto;overflow-x:auto;padding:3px}
.nav button{min-height:40px;display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;transition:color .2s,background .2s,border-color .2s,transform .2s}
.nav button:hover{border-color:var(--line);background:var(--panel2);color:var(--txt)}
.nav button:active{transform:translateY(1px)}
.nav button.active{border-color:rgba(74,222,128,.52);background:rgba(34,197,94,.12);color:var(--accent2);box-shadow:inset 0 -2px var(--accent)}
.wrap{width:min(1440px,100%);margin:auto;padding:27px 22px 70px}
.screen-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:20px}
.screen-head .st{min-width:0}
.screen-head h1{display:flex;align-items:center;gap:10px;margin:0;color:var(--txt);font-size:clamp(21px,2vw,27px);font-weight:700;letter-spacing:-.025em}
.screen-head h1 .material-symbols-outlined{color:var(--accent2);font-size:27px;filter:drop-shadow(0 0 7px rgba(34,197,94,.25))}
.screen-head p{max-width:720px;margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.head-chips{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-left:auto}
.chip{padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:rgba(15,23,42,.78);color:#C7D2E2;font-family:"Fira Code",monospace;font-size:10px}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card,.kpi{min-width:0;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,rgba(20,25,44,.86),var(--panel) 60%);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.025)}
.card{padding:17px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.card-h .material-symbols-outlined{color:var(--accent2);font-size:19px}
.card-h b{font-size:14px;font-weight:600}
.card-h .sub{margin-left:auto;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.kpi{position:relative;overflow:hidden;padding:16px}
.kpi:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--accent),transparent 72%)}
.kpi:after{content:"";position:absolute;right:-38px;top:-42px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.12),transparent 68%);pointer-events:none}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.kpi .lab .material-symbols-outlined{color:var(--accent2);font-size:17px}
.kpi .val{margin-top:10px;color:#FFF;font-family:"Fira Code",monospace;font-size:clamp(23px,2.5vw,30px);font-weight:600;line-height:1.1;letter-spacing:-.05em;text-shadow:0 0 10px rgba(255,255,255,.12)}
.kpi .val small{margin-left:5px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:0}
.delta{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;font-weight:500}
.delta .material-symbols-outlined{font-size:14px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
.tbl th{padding:11px 12px;border-bottom:1px solid var(--line);background:rgba(2,6,23,.45);color:#AEBBD0;text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.025em;white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid rgba(51,65,85,.58);color:#E5EAF2;white-space:nowrap}
.tbl tbody tr{transition:background .18s}
.tbl tbody tr:hover{background:rgba(34,197,94,.045)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl b,.tbl .num,.tbl td:first-child{font-family:"Fira Code",monospace}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;scrollbar-color:var(--line) transparent}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border:1px solid currentColor;border-radius:5px;font-size:10px;font-weight:600;line-height:1;white-space:nowrap}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-ok{background:rgba(74,222,128,.09);color:#6EE7A0}
.b-warn{background:rgba(251,191,36,.09);color:#FCD34D}
.b-bad{background:rgba(251,113,133,.09);color:#FDA4AF}
.b-info{background:rgba(96,165,250,.1);color:#93C5FD}
.b-dim{background:rgba(148,163,184,.08);color:#BCC7D6}
.chartbox{width:100%;overflow:hidden}
.pbar{height:7px;overflow:hidden;border:1px solid #29364B;border-radius:3px;background:#080D1A}
.pbar>i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#16A34A,var(--accent2));box-shadow:0 0 9px rgba(34,197,94,.28)}
.match{display:grid;grid-template-columns:repeat(3,1fr)}
.match .doc{padding:18px;border:1px solid var(--line);background:rgba(2,6,23,.28);text-align:center}
.match .doc:first-child{border-radius:9px 0 0 9px}
.match .doc:last-child{border-radius:0 9px 9px 0}
.match .doc:not(:last-child){border-right:0}
.match .doc .material-symbols-outlined{color:var(--accent2);font-size:30px}
.match .doc .t{margin-top:8px;color:var(--muted);font-size:11px}
.match .doc .v{margin-top:4px;font-family:"Fira Code",monospace;font-size:17px;font-weight:600}
.list,.mini{display:flex;flex-direction:column;gap:9px}
.li{display:flex;align-items:center;gap:11px;min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px;background:rgba(2,6,23,.32)}
.li .ic{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:8px}
.li .ic .material-symbols-outlined{font-size:19px}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;overflow:hidden;color:#EEF2F8;font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.li .tx span{color:var(--muted);font-size:10.5px}
.li .rt{flex:none;text-align:right}
.li .rt b{font-family:"Fira Code",monospace;font-size:12px}
.li .rt span{display:block;color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:17px}
.tl .ev:before{content:"✓";position:absolute;left:-23px;top:1px;width:13px;height:13px;display:grid;place-items:center;border:2px solid var(--accent);border-radius:50%;background:var(--bg);color:var(--accent2);font-size:8px;font-weight:700;box-shadow:0 0 9px rgba(34,197,94,.25)}
.tl .ev.warn:before{content:"!";border-color:var(--warn);color:var(--warn);box-shadow:none}
.tl .ev.bad:before{content:"!";border-color:var(--bad);color:var(--bad);box-shadow:none}
.tl .ev .tt{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tl .ev b{display:block;margin:3px 0;font-size:12px}
.tl .ev p{margin:0;color:var(--muted);font-size:11px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:rgba(2,6,23,.28)}
.col .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:1px 1px 8px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600}
.cnt{padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tk{min-width:0;margin-bottom:7px;padding:9px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;background:var(--panel)}
.tk.warn{border-left-color:var(--warn)}.tk.bad{border-left-color:var(--bad)}
.tk .id{color:var(--muted);font-family:"Fira Code",monospace;font-size:9px}
.tk b{display:block;overflow:hidden;margin:3px 0;color:#E7EDF6;font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.tk .m{display:flex;justify-content:space-between;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.mrow{display:flex;align-items:center;gap:9px;font-size:11px}
.mrow .nm{width:80px;flex:none;color:var(--muted)}
.mrow .pbar{flex:1}
.mrow .vv{width:68px;flex:none;color:#E2E8F0;font-family:"Fira Code",monospace;text-align:right}
.stat-inline{display:flex;gap:22px;flex-wrap:wrap}
.si .l{color:var(--muted);font-size:10px}
.si .v{margin-top:3px;font-family:"Fira Code",monospace;font-size:17px;font-weight:600}
.note{display:flex;align-items:flex-start;gap:6px;margin-top:11px;color:#B8C4D5;font-size:10.5px;line-height:1.5}
.note .material-symbols-outlined{color:var(--accent2);font-size:15px}
.foot{width:min(1440px,100%);margin:auto;padding:20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;text-align:center}
@media(prefers-reduced-motion:no-preference){
  .card,.kpi{animation:reveal .38s both}
  .grid>:nth-child(2){animation-delay:.05s}.grid>:nth-child(3){animation-delay:.1s}.grid>:nth-child(4){animation-delay:.15s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media(max-width:1024px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:10px}
  .nav{width:100%;margin-left:0}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .wrap{padding:22px 15px 55px}
  .topbar-inner{padding:10px 15px}
  .screen-head{align-items:flex-start;flex-direction:column}
  .head-chips{justify-content:flex-start;margin-left:0}
  .g2,.g3{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .brand-txt span{display:none}
  .nav button{min-width:42px;justify-content:center;padding:9px}
  .nav button .txt{display:none}
  .g4,.board{grid-template-columns:1fr}
  .match{grid-template-columns:1fr}
  .match .doc:first-child{border-radius:9px 9px 0 0}
  .match .doc:last-child{border-radius:0 0 9px 9px}
  .match .doc:not(:last-child){border-right:1px solid var(--line);border-bottom:0}
}
</style>
</head>
