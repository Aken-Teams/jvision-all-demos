<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>企業稽核作業管理｜Jvision Demo</title>
<meta name="description" content="稽核計畫排程、檢查表、缺失看板、改善追蹤與績效報表" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#1d4ed8;
  --violet:#6d28d9;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid rgba(37,99,235,.34);
  outline-offset:3px;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
  backdrop-filter:blur(12px);
}
.top::before{
  content:"";
  display:block;
  height:3px;
  background:linear-gradient(90deg,var(--color-primary) 0 78%,var(--color-accent) 78%);
}
.top .bar{
  width:min(1440px,100%);
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:22px;
  padding:12px 24px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:250px;
  color:var(--ink);
  font-weight:700;
}
.brand .logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:8px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:0 4px 10px rgba(37,99,235,.18);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand .t{
  display:flex;
  flex-direction:column;
  min-width:0;
  line-height:1.2;
}
.brand .t b{
  overflow:hidden;
  font-size:15px;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand .t span{
  margin-top:3px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.04em;
  white-space:nowrap;
}
.nav{
  display:flex;
  gap:4px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  border-color:var(--color-border);
  background:var(--color-muted);
  color:var(--color-primary);
  transform:translateY(-1px);
}
.nav button.on{
  border-color:#bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
}
.nav button.on::after{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--color-accent);
}
.nav button .material-symbols-outlined{font-size:18px}
main{
  width:min(1440px,100%);
  min-height:calc(100vh - 154px);
  margin:0 auto;
  padding:24px;
}
.screen{
  animation:screen-in .36s ease-out both;
}
@keyframes screen-in{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
.screen-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  padding-bottom:15px;
  border-bottom:1px solid var(--color-border);
}
.screen-head h1{
  margin:0;
  color:var(--ink);
  font-size:clamp(21px,2.2vw,28px);
  font-weight:700;
  letter-spacing:-.025em;
}
.screen-head .sub{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
}
.pill{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:6px 10px;
  border:1px solid #bfdbfe;
  border-radius:6px;
  background:#eff6ff;
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.pill .material-symbols-outlined{font-size:17px}
.grid{
  display:grid;
  gap:12px;
  min-width:0;
}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(310px,1fr)}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(310px,1fr)}
.grid>*{min-width:0}
.card,.kpi{
  border:1px solid var(--color-border);
  border-radius:8px;
  background:var(--color-card);
  box-shadow:var(--shadow);
}
.card{
  min-width:0;
  padding:16px;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{
  border-color:#cbd5e1;
  box-shadow:0 2px 4px rgba(15,23,42,.04),0 10px 24px rgba(15,23,42,.07);
}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 12px;
  color:var(--ink);
  font-size:13px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:18px;
}
.card .cap{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
}
.kpi{
  position:relative;
  min-height:122px;
  overflow:hidden;
  padding:15px 16px;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:var(--color-primary);
  transform:scaleX(.22);
  transform-origin:left;
  transition:transform .24s ease;
}
.kpi:hover{
  border-color:#bfdbfe;
  box-shadow:0 8px 24px rgba(37,99,235,.08);
  transform:translateY(-2px);
}
.kpi:hover::before{transform:scaleX(1)}
.kpi .lb{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .lb .material-symbols-outlined{
  color:var(--color-primary);
  font-size:18px;
}
.kpi .v{
  margin-top:10px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .v small{
  margin-left:5px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0;
}
.kpi .d{
  display:flex;
  align-items:center;
  gap:3px;
  margin-top:3px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.kpi .d .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--muted)}
.scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-color:#cbd5e1 transparent;
  scrollbar-width:thin;
}
.tbl{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:12.5px;
}
.tbl th{
  padding:9px 10px;
  border-bottom:1px solid #cbd5e1;
  background:var(--color-muted);
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
.tbl td{
  padding:10px;
  border-bottom:1px solid var(--color-border);
  color:var(--ink);
  vertical-align:middle;
}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background-color .18s ease}
.tbl tbody tr:hover{background:#f8fafc}
.tbl td:first-child b,
.tbl td:nth-child(4),
.tbl td:nth-child(5){
  font-variant-numeric:tabular-nums;
}
.tbl td:first-child b{
  font-family:"Fira Code",monospace;
  font-size:11.5px;
}
.tbl td[style*="min-width"] b{font-family:"Fira Sans",sans-serif}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:currentColor;
}
.t-ok{background:#f0fdf4;color:#166534}
.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#eff6ff;color:#1d4ed8}
.t-mut{background:#f1f5f9;color:#475569}
.t-cy{background:#ecfeff;color:#0e7490}
.dot{
  width:8px;
  height:8px;
  display:inline-block;
  flex:none;
  border:1px solid rgba(15,23,42,.16);
  border-radius:2px;
}
.bar-wrap{
  height:7px;
  overflow:hidden;
  border-radius:2px;
  background:#e2e8f0;
}
.bar-wrap i{
  display:block;
  height:100%;
  border-radius:2px;
  background:var(--color-primary);
}
.chartbox{
  position:relative;
  height:260px;
  min-width:0;
}
.chartbox.sm{height:210px}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(225px,1fr));
  gap:10px;
  min-width:960px;
}
.col{
  min-width:0;
  padding:10px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:#f8fafc;
}
.col .ch{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:9px;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
}
.col .ch .n{
  min-width:24px;
  margin-left:auto;
  padding:1px 6px;
  border:1px solid var(--color-border);
  border-radius:4px;
  background:#fff;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
.tik{
  margin-bottom:8px;
  padding:10px;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary);
  border-radius:6px;
  background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.tik:hover{
  border-color:#bfdbfe;
  box-shadow:0 5px 14px rgba(15,23,42,.07);
  transform:translateY(-1px);
}
.tik:last-child{margin-bottom:0}
.tik .id{
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.035em;
}
.tik .ti{
  margin:4px 0 8px;
  color:var(--ink);
  font-size:12px;
  font-weight:600;
  line-height:1.4;
}
.tik .mt{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:10.5px;
}
.tik .av{
  width:23px;
  height:23px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:5px;
  background:#dbeafe;
  color:#1e40af;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
}
.sev{border-left-color:var(--bad)}
.sev2{border-left-color:#d97706}
.sev3{border-left-color:var(--info)}
.cal{
  width:100%;
  min-width:690px;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:12px;
}
.cal th{
  padding:7px;
  border-bottom:1px solid #cbd5e1;
  background:var(--color-muted);
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  text-align:center;
}
.cal td{
  position:relative;
  height:82px;
  padding:5px;
  border:1px solid var(--color-border);
  background:#fff;
  vertical-align:top;
}
.cal td .dn{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.cal td.off{background:#f1f5f9}
.ev{
  display:block;
  overflow:hidden;
  margin-top:4px;
  padding:3px 5px;
  border-radius:3px;
  color:#fff;
  font-size:9.5px;
  font-weight:600;
  line-height:1.35;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.e-a{background:#1d4ed8}
.e-b{background:#0f766e}
.e-c{background:#6d28d9}
.e-d{background:#b45309}
.clitem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 3px;
  border-bottom:1px solid var(--color-border);
}
.clitem:last-child{border-bottom:0}
.clitem .ic{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid currentColor;
  border-radius:6px;
}
.clitem .ic .material-symbols-outlined{font-size:18px}
.ic-ok{background:#f0fdf4;color:#166534}
.ic-ob{background:#fffbeb;color:#92400e}
.ic-nc{background:#fef2f2;color:#b91c1c}
.clitem .bd{
  min-width:0;
  flex:1;
}
.clitem .bd b{
  color:var(--ink);
  font-size:12.5px;
  font-weight:600;
}
.clitem .bd p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:11px;
}
.clitem .sc{
  flex:none;
  font-family:"Fira Code",monospace;
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.tl{
  position:relative;
  padding-left:21px;
}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:6px;
  width:1px;
  background:#cbd5e1;
}
.tl .it{
  position:relative;
  padding:0 0 14px 4px;
}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";
  position:absolute;
  top:3px;
  left:-19px;
  width:9px;
  height:9px;
  border:2px solid #fff;
  border-radius:2px;
  background:var(--color-primary);
  box-shadow:0 0 0 1px var(--color-primary);
}
.tl .it .tm{
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.tl .it .tx{
  margin-top:2px;
  color:var(--ink);
  font-size:11.5px;
}
.tl .it .tx b{font-weight:600}
.mtx{
  display:grid;
  grid-template-columns:minmax(86px,auto) repeat(4,1fr);
  gap:5px;
  min-width:440px;
}
.mtx .h{
  padding:5px;
  color:var(--muted);
  font-size:10.5px;
  font-weight:600;
  text-align:center;
}
.mtx .rh{
  display:flex;
  align-items:center;
  padding:5px;
  color:var(--ink);
  font-size:11px;
  font-weight:600;
}
.mtx .cell{
  height:45px;
  display:grid;
  place-items:center;
  border-radius:5px;
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  line-height:1.1;
  text-align:center;
}
.legend{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
  margin-top:11px;
  color:var(--muted);
  font-size:10.5px;
}
.legend span{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.foot{
  width:min(1440px,100%);
  margin:0 auto;
  padding:10px 24px 28px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.mini{
  color:var(--muted);
  font-size:10.5px;
}
.hl{
  color:#1d4ed8;
  font-weight:700;
}
.summary{
  padding:12px;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary);
  border-radius:6px;
  background:#f8fafc;
  color:var(--ink);
  font-size:12px;
  line-height:1.75;
}
.score-box{
  margin-top:12px;
  padding:12px;
  border:1px solid var(--color-border);
  border-radius:6px;
  background:#f8fafc;
}
.score-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  font-size:11px;
}
@media(max-width:1100px){
  .top .bar{align-items:flex-start;flex-direction:column;gap:8px}
  .nav{width:100%;margin-left:0}
  main{padding-top:20px}
}
@media(max-width:860px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .card{padding:14px}
}
@media(max-width:560px){
  .top .bar{padding:9px 14px}
  .brand{min-width:0}
  .brand .t span{display:none}
  .nav button{min-height:40px;padding:8px 10px}
  .nav button .lbl{display:none}
  .nav button.on::after{display:none}
  main{padding:16px 12px}
  .screen-head{align-items:flex-start;flex-direction:column}
  .g4{grid-template-columns:1fr}
  .kpi{min-height:112px}
  .foot{padding:8px 12px 24px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  .screen,.kpi:hover,.tik:hover,.nav button:hover{transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">fact_check</span></div>
      <div class="t"><b>企業稽核作業管理</b><span>JVISION QMS / AUDIT CONTROL</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="稽核管理功能">
      <button type="button" data-i="0" class="on"><span class="material-symbols-outlined" aria-hidden="true">event_available</span><span class="lbl">稽核排程</span></button>
      <button type="button" data-i="1"><span class="material-symbols-outlined" aria-hidden="true">checklist</span><span class="lbl">檢查表</span></button>

    '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">bar_chart</span>缺失結案率趨勢</h3><div class="chartbox"><canvas id="c5b"></canvas></div></div>'+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">grid_view</span>部門風險熱區矩陣</h3><div class="scroll">'+mtx+'</div>'+
      '<div class="legend"><span><i class="dot" style="background:'+C.ok+'"></i>低</span><span><i class="dot" style="background:'+C.warn+'"></i>中</span><span><i class="dot" style="background:'+C.bad+'"></i>高</span></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">workspace_premium</span>各部門稽核評等</h3>'+deptRank()+'</div>'+
  '</div></section>';
}
function matrix(){
  var deps=["組裝一課","SMT 線","電鍍線","成品倉","品保室"];
  var cats=["文件","製程","人員","環安"];
  var data=[[3,2,1,2],[2,3,1,1],[3,3,2,2],[2,1,1,3],[1,2,1,1]];
  var col=function(v){return v>=3?C.bad:v===2?C.warn:C.ok};
  var label=function(v){return v>=3?"高":v===2?"中":"低"};
  var h='<div class="mtx"><div class="h"></div>';
  for(var c=0;c<cats.length;c++)h+='<div class="h">'+cats[c]+'</div>';
  for(var r=0;r<deps.length;r++){
    h+='<div class="rh">'+deps[r]+'</div>';
    for(var k=0;k<cats.length;k++){
      var v=data[r][k];
      h+='<div class="cell" style="background:'+col(v)+'" aria-label="'+deps[r]+' '+cats[k]+'風險 '+label(v)+'，分數 '+v+'"><span>'+v+'</span><small>'+label(v)+'</small></div>';
    }
  }
  return h+'</div>';
}
function deptRank(){
  var rows=[
    ["組裝一課","A",92],
    ["SMT 線","A",89],
    ["電鍍線","B",76],
    ["成品倉","B",81],
    ["品保室","A",94],
    ["焊接課","C",68]
  ];
  var h='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    h+='<div class="clitem"><div class="ic '+(r[1]==="A"?"ic-ok":r[1]==="B"?"ic-ob":"ic-nc")+'"><b style="font-size:13px">'+r[1]+'</b></div><div class="bd"><b>'+r[0]+'</b><div class="bar-wrap" style="margin-top:5px"><i style="width:'+r[2]+'%"></i></div></div><div class="sc" style="color:'+(r[2]>=85?C.ok:r[2]>=75?C.warn:C.bad)+'">'+r[2]+'</div></div>';
  }
  return h;
}
function kpi(icon,label,val,unit,delta,dir){
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  var state=dir==="up"?"趨勢上升":dir==="down"?"趨勢下降":"趨勢持平";
  var dd=delta?'<div class="d '+dir+'"><span class="material-symbols-outlined" aria-hidden="true">'+arrow+'</span><span>'+delta+' · '+state+'</span></div>':'<div class="d flat"><span aria-hidden="true">—</span><span class="sr-only">無比較資料</span></div>';
  return '<div class="kpi"><div class="lb"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+label+'</div><div class="v">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+dd+'</div>';
}
function baseScales(){
  return {
    x:{grid:{display:false},ticks:{color:C.mut,font:{family:"Fira Sans",size:11}}},
    y:{grid:{color:C.grid},ticks:{color:C.mut,font:{family:"Fira Code",size:10}},beginAtZero:true}
  };
}
function noLeg(){return{legend:{display:false}}}
function initCharts(i){
  if(i===0){
    mkChart("c0a",{
      type:"doughnut",
      data:{
        labels:["系統稽核","製程稽核","供應商稽核","追蹤複核"],
        datasets:[{data:[7,6,3,2],backgroundColor:[C.ac,"#0f766e",C.vio,C.warn],borderWidth:3,borderColor:"#fff"}]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        cutout:"64%",
        plugins:{legend:{position:"bottom",labels:{color:C.mut,font:{family:"Fira Sans",size:10},boxWidth:10,boxHeight:10}}}
      }
    });
  }else if(i===1){
    mkChart("c1a",{
      type:"radar",
      data:{
        labels:["文件管制","製程管控","人員資格","設備校驗","環安衛","紀錄追溯"],
        datasets:[
          {label:"本次",data:[5,3,5,4,3,4],borderColor:C.ac,backgroundColor:"rgba(37,99,235,.16)",pointBackgroundColor:C.ac},
          {label:"基準",data:[4,4,4,4,4,4],borderColor:C.warn,backgroundColor:"rgba(180,83,9,.07)",pointBackgroundColor:C.warn}
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        scales:{r:{min:0,max:5,grid:{color:C.grid},angleLines:{color:C.grid},pointLabels:{color:C.mut,font:{family:"Fira Sans",size:10}},ticks:{display:false}}},
        plugins:{legend:{position:"bottom",labels:{color:C.mut,font:{family:"Fira Sans",size:10},boxWidth:10}}}
      }
    });
  }else if(i===2){
    mkChart("c2a",{
      type:"bar",
      data:{labels:["組裝","SMT","電鍍","CNC","成品倉","焊接"],datasets:[{label:"缺失數",data:[6,4,5,3,4,5],backgroundColor:C.ac,borderRadius:3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:noLeg(),scales:baseScales()}
    });
    mkChart("c2b",{
      type:"pie",
      data:{labels:["製程","文件","人員","環安","設備"],datasets:[{data:[9,6,4,3,5],backgroundColor:[C.ac,C.ac2,C.vio,C.warn,"#0f766e"],borderWidth:3,borderColor:"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:C.mut,font:{family:"Fira Sans",size:10},boxWidth:10}}}}
    });
  }else if(i===3){
    mkChart("c3a",{
      type:"line",
      data:{
        labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
        datasets:[
          {label:"結案數",data:[3,5,4,7,6,9],borderColor:C.ac,backgroundColor:"rgba(37,99,235,.10)",fill:true,tension:.25,pointRadius:3},
          {label:"新開立",data:[6,5,7,5,4,4],borderColor:C.warn,backgroundColor:"transparent",tension:.25,pointRadius:3}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:C.mut,font:{family:"Fira Sans",size:10},boxWidth:10}}},scales:baseScales()}
    });
  }else if(i===4){
    mkChart("c4a",{
      type:"bar",
      data:{labels:["文件","製程","人員","環安","設備"],datasets:[{label:"平均結案天數",data:[6.2,10.4,7.1,5.5,9.3],backgroundColor:[C.ac,C.warn,C.ac2,C.ok,C.vio],borderRadius:3}]},
      options:{
        indexAxis:"y",
        responsive:true,
        maintainAspectRatio:false,
        plugins:noLeg(),
        scales:{
          x:{grid:{color:C.grid},ticks:{color:C.mut,font:{family:"Fira Code",size:10}},beginAtZero:true},
          y:{grid:{display:false},ticks:{color:C.mut,font:{family:"Fira Sans",size:11}}}
        }
      }
    });
  }else if(i===5){
    mkChart("c5a",{
      type:"bar",
      data:{
        labels:["4月","5月","6月","7月","8月"],
        datasets:[
          {label:"計畫場次",data:[16,18,17,19,18],backgroundColor:"rgba(59,130,246,.28)",borderColor:C.ac2,borderWidth:1,borderRadius:3},
          {label:"實際完成",data:[14,17,15,18,16],backgroundColor:C.ac,borderRadius:3}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:C.mut,font:{family:"Fira Sans",size:10},boxWidth:10}}},scales:baseScales()}
    });
    mkChart("c5b",{
      type:"line",
      data:{
        labels:["3月","4月","5月","6月","7月","8月"],
        datasets:[
          {label:"結案率 %",data:[72,76,79,83,85,88],borderColor:C.ac,backgroundColor:"rgba(37,99,235,.10)",fill:true,tension:.25,pointRadius:3},
          {label:"目標 90%",data:[90,90,90,90,90,90],borderColor:C.bad,borderDash:[6,4],pointRadius:0}
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{position:"bottom",labels:{color:C.mut,font:{family:"Fira Sans",size:10},boxWidth:10}}},
        scales:{
          x:{grid:{display:false},ticks:{color:C.mut,font:{family:"Fira Sans",size:11}}},
          y:{grid:{color:C.grid},ticks:{color:C.mut,font:{family:"Fira Code",size:10}},min:60,max:100}
        }
      }
    });
  }
}
var screens=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  app.innerHTML=screens[i]();
  void app.offsetHeight;
  initCharts(i);
}
var navEl=document.getElementById("nav");
navEl.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-i]");
  if(!t)return;
  var i=+t.getAttribute("data-i");
  var next="#go="+i;
  if(location.hash===next){
    show(i);
    try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){}
  }else{
    location.hash=next;
  }
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var n=document.querySelectorAll("[data-i]").length||6;
  var i=m?Math.min(+m[1],n-1):0;
  show(i);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
