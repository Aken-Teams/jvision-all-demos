<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>服飾產品生命週期管理 PLM</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316;
  --bg:#f5f5f7; --card:#ffffff; --ink:#1f2430; --sub:#6b7280;
  --line:#eceef2; --side:#171a21; --side2:#20242e; --sideink:#c7ccd6;
  --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444; --info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:250px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:var(--sideink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(220,38,38,.4)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{color:#fff;font-size:15px;font-weight:800;line-height:1.25;font-family:"Noto Sans TC"}
.brand span{font-size:11px;color:#8b93a1;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--sideink);padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;text-align:left;transition:.18s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(220,38,38,.35)}
.sidefoot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7c8493;line-height:1.6}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:"Noto Sans TC";font-size:23px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.top h1 .material-symbols-outlined{color:var(--accent);font-size:26px}
.top p{color:var(--sub);font-size:13px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--sub)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 4px rgba(22,163,74,.14);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.7fr 1fr}
.g32{grid-template-columns:1fr 1.4fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{font-family:"Noto Sans TC";font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .cd{font-size:12px;color:var(--sub);margin-bottom:14px}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lab .material-symbols-outlined{font-size:18px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin:8px 0 2px;font-family:"Inter"}
.kpi .val small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .dt{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .dt.up{color:var(--ok)}.kpi .dt.dn{color:var(--bad)}
.kpi .ic{position:absolute;right:-8px;top:-8px;font-size:74px;color:var(--accent);opacity:.06}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#faf9fb}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#dbeafe;color:#1d4ed8}.t-gray{background:#eef0f4;color:#4b5563}.t-pur{background:#ede9fe;color:#6d28d9}
.echart{width:100%;height:280px;min-width:0}
.season{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.scol{background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.scol .sh{font-weight:800;font-size:13px;font-family:"Noto Sans TC";display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.scol .sh .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--sub)}
.styc{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.styc:last-child{margin-bottom:0}
.styc b{font-size:13px;display:block}
.styc .m{font-size:11px;color:var(--sub);margin-top:3px;display:flex;justify-content:space-between}
.swatch{display:inline-flex;gap:4px;margin-top:7px}
.swatch i{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-width:0}
.stcard{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}
.stcard .thumb{height:120px;display:grid;place-items:center;position:relative;color:#fff}
.stcard .thumb .material-symbols-outlined{font-size:52px;opacity:.9}
.stcard .thumb .code{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.35);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.stcard .bd{padding:13px}
.stcard .bd b{font-size:14px;font-family:"Noto Sans TC"}
.stcard .bd .meta{font-size:11.5px;color:var(--sub);margin:3px 0 10px}
.steps{display:flex;gap:4px;margin-bottom:10px}
.steps i{flex:1;height:5px;border-radius:99px;background:#eceef2}
.steps i.done{background:var(--accent)}.steps i.cur{background:var(--accent2)}
.stcard .ft{display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.bomsum{display:flex;gap:16px;flex-wrap:wrap}
.bomsum .b{flex:1;min-width:120px;background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:13px}
.bomsum .b .l{font-size:11.5px;color:var(--sub);font-weight:600}
.bomsum .b .v{font-size:22px;font-weight:800;margin-top:5px}
.costbar{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:11px;font-weight:700;color:#fff;min-width:280px}
.costbar>span{display:grid;place-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.tl{position:relative;padding-left:26px;min-width:0}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:16px}
.tli:last-child{margin-bottom:0}
.tli .dot{position:absolute;left:-24px;top:2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px}
.tli .dot .material-symbols-outlined{font-size:13px}
.tli .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tli .hd b{font-size:13.5px;font-family:"Noto Sans TC"}
.tli .hd .dd{font-size:11px;color:var(--sub)}
.tli .cm{font-size:12px;color:#444;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:7px;line-height:1.55}
.fit{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.fit .f{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--sub)}
.fit .f b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;min-width:640px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mgrid .mh{background:#fafbfc;font-size:11.5px;font-weight:700;color:var(--sub);padding:10px;text-align:center;border-bottom:1px solid var(--line)}
.mcell{padding:12px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;min-width:0}
.mcell.hleft{border-left:0;text-align:left}
.mcell .vend{font-weight:700;font-size:13px}
.mcell .vend small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.node{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;margin:0 auto;color:#fff}
.node .material-symbols-outlined{font-size:15px}
.n-ok{background:var(--ok)}.n-cur{background:var(--accent2);box-shadow:0 0 0 4px rgba(249,115,22,.18)}.n-wait{background:#d1d5db}.n-late{background:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.16)}
.aibox{background:linear-gradient(135deg,#1f1420,#2a1418);color:#fdebe9;border-radius:16px;padding:20px;min-width:0;border:1px solid rgba(249,115,22,.25)}
.aibox h3{color:#fff;display:flex;align-items:center;gap:9px;font-size:15px;font-family:"Noto Sans TC";margin-bottom:5px}
.aibox h3 .material-symbols-outlined{color:var(--accent2)}
.aibox .sm{font-size:12px;color:#e8b7ad;margin-bottom:14px}
.airow{display:flex;gap:11px;padding:12px 0;border-top:1px solid rgba(255,255,255,.09)}
.airow .ai-ic{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(249,115,22,.16);color:var(--accent2)}
.airow .ai-ic .material-symbols-outlined{font-size:19px}
.airow b{font-size:13px;color:#fff;display:block}
.airow p{font-size:12px;color:#e3bfb8;line-height:1.55;margin-top:2px}
.airow .sev{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;align-self:flex-start;white-space:nowrap}
.sev-h{background:rgba(239,68,68,.2);color:#fca5a5}.sev-m{background:rgba(245,158,11,.2);color:#fcd34d}.sev-l{background:rgba(34,197,94,.18);color:#86efac}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.season{grid-template-columns:repeat(2,1fr)}.styles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{display:block}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px}
  .brand{border-bottom:0;margin:0 14px 0 0;padding:0}
  .sidefoot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav button{width:auto;padding:9px 13px}
  .main{padding:20px 16px 50px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .season{grid-template-columns:1fr}
  .styles{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:9px 11px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">checkroom</span></div>
      <div><b>Fashion PLM</b><br /><span>服飾產品生命週期</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">純 UI 展示 · 無後端<br />資料皆為擬真示範<br />2026 春夏系列 · SS26</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1><span class="material-symbols-outlined" id="hIcon">line_style</span><span id="hTitle">系列企劃</span></h1>
        <p id="hSub">季節系列規劃、色彩故事與價格帶佈局</p>
      </div>
      <span class="pill"><i></i>SS26 系列 · 資料即時同步</span>
    </div>
    <div id="stage"></div>
  </main>
</div>
<script>
var MOD=[
  {icon:"line_style",name:"系列企劃",desc:"季節系列規劃、色彩故事與價格帶佈局"},
  {icon:"checkroom",name:"款式開發",desc:"款式卡、設計圖與開發階段狀態追蹤"},
  {icon:"texture",name:"BOM 物料",desc:"布料副料用量、單件成本與物料庫維護"},
  {icon:"content_cut",name:"樣衣打樣",desc:"Tech Pack、樣衣輪次與試穿評語管理"},
  {icon:"factory",name:"供應商生產",desc:"供應商配置、下單與生產里程碑追蹤"},
  {icon:"insights",name:"AI 洞察報表",desc:"上市達交率、成本趨勢與 AI 風險摘要"}
];
var AC="#dc2626",AC2="#f97316";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var chart=null;
function dispose(){if(chart){try{if(chart._c2){chart._c2.dispose();}chart.dispose();}catch(e){}chart=null;}}

var nav=document.getElementById("nav");
nav.innerHTML=MOD.map(function(m,i){
  return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+esc(m.name)+'</span></button>';
}).join("");
nav.querySelectorAll("button").forEach(function(b){
  b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
});

function kcard(k){
  return '<div class="card kpi"><span class="material-symbols-outlined ic">'+k.ic+'</span>'+
    '<div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+esc(k.l)+'</div>'+
    '<div class="val">'+esc(k.v)+'<small>'+esc(k.u)+'</small></div>'+
    '<span class="dt '+(k.up?"up":"dn")+'"><span class="material-symbols-outlined" style="font-size:14px">'+(k.up?"arrow_upward":"arrow_downward")+'</span>'+esc(k.dt)+' · '+esc(k.s)+'</span></div>';
}

/* ===== SCREEN 0 : 系列企劃 ===== */
function s0(){
  var kpi=[
    {l:"季開發款數",v:"148",u:"款",ic:"checkroom",dt:"+12",up:1,s:"vs SS25"},
    {l:"已核准系列",v:"6",u:"系列",ic:"folder_special",dt:"目標 8",up:1,s:"進行中"},
    {l:"目標毛利率",v:"58.4",u:"%",ic:"trending_up",dt:"+2.1",up:1,s:"優於基準"},
    {l:"上市倒數",v:"63",u:"天",ic:"event",dt:"09/15",up:1,s:"上架日"}
  ];
  var cols=[
    {t:"洋裝 Dress",c:AC,items:[
      {n:"藤蔓印花洋裝",code:"DR-1042",price:"NT$2,480",qty:"3,200",sw:["#c2410c","#fed7aa","#7c2d12"]},
      {n:"垂墜緞面洋裝",code:"DR-1058",price:"NT$3,180",qty:"1,800",sw:["#1e293b","#94a3b8"]}
    ]},
    {t:"上衣 Tops",c:AC2,items:[
      {n:"泡泡袖襯衫",code:"TP-2210",price:"NT$1,280",qty:"5,400",sw:["#fef3c7","#fde68a","#ffffff"]},
      {n:"針織背心",code:"TP-2233",price:"NT$980",qty:"4,600",sw:["#166534","#4ade80"]},
      {n:"法式方領上衣",code:"TP-2251",price:"NT$1,120",qty:"3,900",sw:["#be123c","#fda4af"]}
    ]},
    {t:"下著 Bottoms",c:"#2563eb",items:[
      {n:"高腰寬褲",code:"BT-3301",price:"NT$1,680",qty:"4,100",sw:["#1e3a8a","#0f172a"]},
      {n:"A字牛仔裙",code:"BT-3320",price:"NT$1,480",qty:"2,700",sw:["#3b82f6","#93c5fd"]}
    ]},
    {t:"外套 Outer",c:"#7c3aed",items:[
      {n:"輕薄風衣",code:"OT-4402",price:"NT$3,980",qty:"1,500",sw:["#78716c","#d6d3d1"]},
      {n:"棉質短外套",code:"OT-4418",price:"NT$2,880",qty:"2,000",sw:["#7c2d12","#ea580c"]}
    ]}
  ];
  var board=cols.map(function(c){
    return '<div class="scol"><div class="sh"><span style="color:'+c.c+'">'+esc(c.t)+'</span><span class="cnt">'+c.items.length+' 款</span></div>'+
      c.items.map(function(it){
        return '<div class="styc" style="border-left-color:'+c.c+'"><b>'+esc(it.n)+'</b>'+
          '<div class="m"><span>'+esc(it.code)+'</span><span style="font-weight:700;color:'+AC+'">'+esc(it.price)+'</span></div>'+
          '<div class="m"><span>計畫量 '+esc(it.qty)+' 件</span></div>'+
          '<div class="swatch">'+it.sw.map(function(x){return '<i style="background:'+x+'"></i>';}).join("")+'</div></div>';
      }).join("")+'</div>';
  }).join("");
  return '<div class="grid g4" style="margin-bottom:16px">'+kpi.map(kcard).join("")+'</div>'+
    '<div class="grid g23">'+
      '<div class="card"><h3><span class="material-symbols-outlined">dashboard</span>SS26 品類企劃看板</h3><div class="cd">依品類配置的核心款式、目標售價與色彩故事</div><div style="overflow-x:auto"><div class="season">'+board+'</div></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>價格帶佈局</h3><div class="cd">開發款數在各價格帶的分佈</div><div id="ch" class="echart"></div></div>'+
    '</div>';
}
function s0chart(){
  chart=echarts.init(document.getElementById("ch"));
  chart.setOption({
    tooltip:{trigger:"item",formatter:"{b}<br/>{c} 款 ({d}%)"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],avoidLabelOverlap:true,
      itemStyle:{borderColor:"#fff",borderWidth:2,borderRadius:5},
      label:{formatter:"{b}\n{c}款",fontSize:11},
      data:[
        {value:52,name:"入門 <1,500",itemStyle:{color:"#fbbf24"}},
        {value:61,name:"主力 1,500-2,800",itemStyle:{color:AC2}},
        {value:24,name:"高階 2,800-4,000",itemStyle:{color:AC}},
        {value:11,name:"精品 >4,000",itemStyle:{color:"#7c3aed"}}
      ]}]
  });
}

/* ===== SCREEN 1 : 款式開發 ===== */
function s1(){
  var kpi=[
    {l:"開發中款式",v:"96",u:"款",ic:"draw",dt:"+8 本週",up:1,s:"活躍"},
    {l:"待設計核准",v:"14",u:"款",ic:"pending_actions",dt:"3 逾期",up:0,s:"需處理"},
    {l:"平均開發天數",v:"18.6",u:"天",ic:"timelapse",dt:"-2.4",up:1,s:"較上季"},
