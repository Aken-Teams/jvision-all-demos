<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F8FAFC">
<title>服飾款式與生產流程管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --purple:#6D28D9;
  --cyan:#0E7490;
  --shadow:0 10px 32px rgba(30,41,59,.07);
  --shadow-sm:0 3px 12px rgba(30,41,59,.06);
  --radius:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;margin:0;overflow-x:hidden}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  display:inline-block;
  font-family:"Material Symbols Outlined";
  font-size:20px;
  font-style:normal;
  font-weight:400;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  white-space:nowrap;
  direction:ltr;
  font-feature-settings:"liga";
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:260px;
  height:100vh;
  padding:24px 18px 18px;
  overflow-y:auto;
  color:#334155;
  background:rgba(255,255,255,.94);
  border-right:1px solid var(--line);
  backdrop-filter:blur(16px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:60px;
  padding:0 6px 20px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}
.logo{
  display:grid;
  flex:none;
  place-items:center;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  box-shadow:5px 5px 0 #BFDBFE;
}
.logo .material-symbols-outlined{font-size:24px}
.brand b{
  display:block;
  color:#0F172A;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
}
.brand small{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  letter-spacing:.04em;
}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:46px;
  padding:11px 12px;
  color:#475569;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button::after{
  position:absolute;
  top:9px;
  bottom:9px;
  left:-19px;
  width:3px;
  background:var(--blue);
  content:"";
  opacity:0;
  transform:scaleY(.35);
  transition:opacity .2s ease,transform .2s ease;
}
.nav button:hover{
  color:#1D4ED8;
  background:#EFF6FF;
  border-color:#DBEAFE;
  transform:translateX(2px);
}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:var(--shadow-sm);
}
.nav button.on::after{opacity:1;transform:scaleY(1)}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav .txt{overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.sidefoot{
  padding:16px 8px 4px;
  margin-top:auto;
  color:#64748B;
  border-top:1px solid var(--line);
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.8;
}
.main{
  flex:1;
  min-width:0;
  max-width:1600px;
  padding:28px clamp(18px,3vw,46px) 64px;
  margin:0 auto;
}
.top{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  min-height:166px;
  padding:30px clamp(22px,3vw,40px);
  margin-bottom:22px;
  overflow:hidden;
  color:#fff;
  background:#0F2B5B;
  border:1px solid #173C76;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.top::before{
  position:absolute;
  right:-48px;
  bottom:-96px;
  width:300px;
  height:300px;
  border:48px solid rgba(96,165,250,.15);
  border-radius:50%;
  content:"";
}
.top::after{
  position:absolute;
  top:0;
  right:30%;
  width:1px;
  height:100%;
  background:rgba(255,255,255,.1);
  content:"";
  transform:skewX(-20deg);
}
.top-copy{position:relative;z-index:1}
.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  color:#BFDBFE;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.eyebrow::before{width:28px;height:2px;background:#60A5FA;content:""}
.top h1{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0;
  font-size:clamp(25px,3vw,38px);
  font-weight:700;
  line-height:1.14;
  letter-spacing:-.04em;
}
.top h1 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--blue);
  border:1px solid rgba(255,255,255,.24);
  border-radius:4px;
}
.top p{max-width:660px;margin:11px 0 0;color:#DBEAFE;font-size:14px}
.pill{
  position:relative;
  z-index:2;
  display:inline-flex;
  flex:none;
  align-items:center;
  gap:8px;
  min-height:42px;
  padding:10px 14px;
  color:#0F172A;
  background:#fff;
  border:1px solid rgba(255,255,255,.8);
  border-radius:4px;
  box-shadow:0 8px 22px rgba(2,6,23,.18);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.pill i{
  width:9px;
  height:9px;
  background:#16A34A;
  border:2px solid #DCFCE7;
  border-radius:50%;
  box-shadow:0 0 0 2px #16A34A;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.card{
  min-width:0;
  padding:20px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow);transform:translateY(-2px)}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  color:#0F172A;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.015em;
}
.card h3 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  color:var(--blue);
  background:#EFF6FF;
  border-radius:3px;
  font-size:18px;
}
.card .cd{margin-bottom:16px;color:var(--muted);font-size:12px}
.kpi{position:relative;min-height:146px;overflow:hidden;border-top:3px solid var(--blue)}
.kpi::after{
  position:absolute;
  right:-24px;
  bottom:-36px;
  width:105px;
  height:105px;
  background:#EFF6FF;
  border-radius:50%;
  content:"";
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  position:relative;
  z-index:1;
  margin:10px 0 4px;
  color:#0F172A;
  font-family:"Fira Code",monospace;
  font-size:30px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.055em;
}
.kpi .val small{margin-left:5px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}
.kpi .dt{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:600;
}
.kpi .dt.up{color:var(--ok)}
.kpi .dt.dn{color:var(--bad)}
.kpi .ic{position:absolute;right:9px;bottom:3px;z-index:1;color:var(--blue);font-size:48px;opacity:.12}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
  padding:11px 12px;
  color:#334155;
  text-align:left;
  white-space:nowrap;
  background:#F1F5F9;
  border-top:1px solid var(--line);
  border-bottom:1px solid #CBD5E1;
  font-size:11px;
  font-weight:700;
  letter-spacing:.025em;
}
th:first-child{border-left:1px solid var(--line)}
th:last-child{border-right:1px solid var(--line)}
td{
  padding:12px;
  color:#334155;
  vertical-align:middle;
  border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
td:first-child{color:#1E293B}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:10.5px;
  font-weight:700;
}
.tag::before{width:5px;height:5px;background:currentColor;border-radius:50%;content:""}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#991B1B;background:#FEF2F2}
.t-info{color:#1D4ED8;background:#EFF6FF}
.t-gray{color:#475569;background:#F1F5F9}
.t-pur{color:#6D28D9;background:#F5F3FF}
.echart{width:100%;height:280px;min-width:0}
.season{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;min-width:790px}
.scol{min-width:0;padding:12px;background:#F8FAFC;border:1px solid var(--line);border-radius:4px}
.scol .sh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:10px;
  margin-bottom:10px;
  border-bottom:1px solid var(--line);
  font-size:12px;
  font-weight:700;
}
.scol .cnt{
  padding:2px 7px;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.styc{
  padding:10px;
  margin-bottom:8px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:3px;
  box-shadow:0 2px 7px rgba(30,41,59,.04);
  transition:transform .2s ease,border-color .2s ease;
}
.styc:hover{transform:translateY(-2px);border-color:#93C5FD}
.styc:last-child{margin-bottom:0}
.styc b{display:block;font-size:12px}
.styc .m{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:4px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  font-variant-numeric:tabular-nums;
}
.swatch{display:inline-flex;gap:4px;margin-top:8px}
.swatch i{width:14px;height:14px;border:1px solid rgba(15,23,42,.18);border-radius:2px}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stcard{min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:4px;transition:transform .22s ease,box-shadow .22s ease}
.stcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stcard .thumb{position:relative;display:grid;height:132px;place-items:center;color:#fff}
.stcard .thumb::after{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(15,23,42,.18));content:""}
.stcard .thumb .material-symbols-outlined{z-index:1;font-size:52px}
.stcard .thumb .code{
  position:absolute;
  top:10px;
  left:10px;
  z-index:2;
  padding:3px 7px;
  color:#fff;
  background:rgba(15,23,42,.74);
  border:1px solid rgba(255,255,255,.3);
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.stcard .bd{padding:14px}
.stcard .bd b{font-size:13px}
.stcard .meta{margin:3px 0 11px;color:var(--muted);font-size:11px}
.steps{display:flex;gap:4px;margin-bottom:11px}
.steps i{flex:1;height:4px;background:#E2E8F0;border-radius:1px}
.steps i.done{background:var(--blue)}
.steps i.cur{background:var(--color-accent)}
.stcard .ft{display:flex;align-items:center;justify-content:space-between;font-size:10.5px}
.bomsum{display:flex;gap:12px;flex-wrap:wrap}
.bomsum .b{flex:1;min-width:130px;padding:13px;background:#F8FAFC;border:1px solid var(--line);border-radius:4px}
.bomsum .l{color:var(--muted);font-size:11px;font-weight:600}
.bomsum .v{margin-top:4px;color:#0F172A;font-family:"Fira Code",monospace;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.costbar{display:flex;min-width:360px;height:30px;overflow:hidden;color:#fff;border-radius:3px;font-size:10px;font-weight:600}
.costbar>span{display:grid;min-width:0;place-items:center;overflow:hidden;white-space:nowrap}
.tl{position:relative;min-width:0;padding-left:29px}
.tl::before{position:absolute;top:8px;bottom:6px;left:10px;width:1px;background:#CBD5E1;content:""}
.tli{position:relative;margin-bottom:18px}
.tli:last-child{margin-bottom:0}
.tli .dot{
  position:absolute;
  top:1px;
  left:-29px;
  display:grid;
  width:21px;
  height:21px;
  place-items:center;
  color:#fff;
  border:2px solid #fff;
  border-radius:50%;
  box-shadow:0 0 0 1px #CBD5E1;
}
.tli .dot .material-symbols-outlined{font-size:12px}
.tli .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tli .hd b{font-size:13px}
.tli .dd{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tli .cm{padding:9px 11px;margin-top:7px;color:#334155;background:#F8FAFC;border:1px solid var(--line);border-radius:3px;font-size:11.5px;line-height:1.6}
.fit{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.fit .f{padding:2px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:3px;font-size:10px}
.fit .f b{color:var(--ink);font-family:"Fira Code",monospace}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(95px,1fr));min-width:690px;overflow:hidden;border:1px solid var(--line);border-radius:4px}
.mgrid .mh{padding:10px;color:#334155;text-align:center;background:#F1F5F9;border-bottom:1px solid #CBD5E1;font-size:10.5px;font-weight:700}
.mcell{min-width:0;padding:13px 10px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.mcell.hleft{border-left:0;text-align:left}
.mcell .vend{font-size:12px;font-weight:700}
.mcell .vend small{display:block;margin-top:2px;color:var(--muted);font-family:"Fira Code",monospace;font-size:9.5px;font-weight:400}
.node{display:inline-grid;width:25px;height:25px;place-items:center;margin:0 auto;color:#fff;border-radius:50%}
.node .material-symbols-outlined{font-size:14px}
.n-ok{background:#15803D}
.n-cur{background:#C2410C;box-shadow:0 0 0 4px #FFEDD5}
.n-wait{color:#475569;background:#E2E8F0}
.n-late{background:#B91C1C;box-shadow:0 0 0 4px #FEE2E2}
.aibox{
  min-width:0;
  padding:22px;
  color:#E2E8F0;
  background:#102A52;
  border:1px solid #1D4ED8;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.aibox h3{display:flex;align-items:center;gap:9px;margin:0 0 5px;color:#fff;font-size:15px}
.aibox h3 .material-symbols-outlined{color:#FDBA74}
.aibox .sm{margin-bottom:14px;color:#BFDBFE;font-size:11.5px}
.airow{display:flex;gap:11px;padding:13px 0;border-top:1px solid rgba(191,219,254,.18)}
.ai-ic{display:grid;flex:none;width:32px;height:32px;place-items:center;color:#FDBA74;background:rgba(234,88,12,.16);border:1px solid rgba(253,186,116,.3);border-radius:3px}
.ai-ic .material-symbols-outlined{font-size:18px}
.airow b{display:block;color:#fff;font-size:12.5px}
.airow p{margin:3px 0 0;color:#CBD5E1;font-size:11.5px;line-height:1.6}
.airow .sev{align-self:flex-start;padding:3px 7px;white-space:nowrap;border:1px solid currentColor;border-radius:3px;font-size:9.5px;font-weight:700}
.sev-h{color:#FCA5A5;background:rgba(185,28,28,.2)}
.sev-m{color:#FDE68A;background:rgba(180,83,9,.2)}
.sev-l{color:#86EFAC;background:rgba(21,128,61,.2)}
.legend{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid rgba(15,23,42,.16);border-radius:2px}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .styles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:960px){
  .app{display:block}
  .side{
    position:sticky;
    top:0;
    width:100%;
    height:auto;
    padding:10px 16px;
    overflow-x:auto;
    overflow-y:hidden;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand{display:none}
  .nav{flex-direction:row;min-width:max-content}
  .nav button{width:auto;min-height:42px;padding:9px 12px}
  .nav button::after{display:none}
  .nav button:hover{transform:none}
  .sidefoot{display:none}
  .main{padding-top:18px}
  .top{min-height:150px}
}
@media(max-width:800px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .styles{grid-template-columns:1fr}
  .top{align-items:flex-start;flex-direction:column}
  .top::after{display:none}
  .pill{flex:none}
}
@media(max-width:560px){
  .main{padding:14px 12px 44px}
  .top{min-height:0;padding:23px 19px;margin-bottom:14px}
  .top h1{font-size:24px}
  .top h1 .material-symbols-outlined{width:37px;height:37px}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0chart,null,s2chart,null,s4chart,s5chart];
var activeIndex=-1;
function show(i){
  i=Math.max(0,Math.min(Number(i)||0,MOD.length-1));
  if(activeIndex===i&&document.getElementById("stage").children.length){return;}
  activeIndex=i;
  dispose();
  var m=MOD[i];
  document.getElementById("hIcon").textContent=m.icon;
  document.getElementById("hTitle").textContent=m.name;
  document.getElementById("hSub").textContent=m.desc;
  nav.querySelectorAll("button").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  var stage=document.getElementById("stage");
  stage.classList.remove("reveal");
  stage.innerHTML=SCREENS[i]();
  void stage.offsetHeight;
  stage.classList.add("reveal");
  if(CHARTS[i]){CHARTS[i]();}
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MOD.length-1):0);
}
window.addEventListener("hashchange",function(){
  fromHash();
  window.scrollTo({top:0,behavior:"smooth"});
});
window.addEventListener("resize",function(){
  if(chart){
    chart.resize();
    if(chart._c2){chart._c2.resize();}
  }
});
fromHash();
</script>
