<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Twin 數位分身 · 製造現場虛實同步平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#6d28d9;--accent2:#8b5cf6;--bg:#f4f2fb;--card:#ffffff;
  --ink:#1e1b2e;--muted:#7c7796;--line:#e7e2f4;--dark:#221a3d;--dark2:#2e2452;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0ea5e9;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.layout{display:flex;min-height:100vh}
.sidebar{width:252px;flex:none;background:linear-gradient(180deg,var(--dark),var(--dark2));color:#e9e6f7;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(109,40,217,.5)}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;color:#a89fd6;font-weight:500}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;color:#c7c1e6;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.16s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(109,40,217,.4)}
.nav button .idx{margin-left:auto;font-size:11px;opacity:.6;font-weight:700}
.side-foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#8f86bf;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:#c9c2ea}
.main{flex:1;min-width:0;padding:26px 30px 44px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar .tt{flex:1;min-width:200px}
.topbar .tt h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px}
.topbar .tt h2 .material-symbols-outlined{color:var(--accent);font-size:26px}
.topbar .tt p{font-size:13px;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--accent)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.18);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.7fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#faf8ff}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#ede9fe;color:#6d28d9}
.bar{height:7px;border-radius:6px;background:#ece7f8;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
/* twin sync signature */
.twin{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch}
.twin .side{padding:16px;border-radius:14px}
.twin .phys{background:linear-gradient(160deg,#f1eefc,#e9e4f9);border:1px solid var(--line)}
.twin .virt{background:linear-gradient(160deg,#221a3d,#3a2c66);color:#e9e6f7;border:1px solid #3a2c66}
.twin .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;gap:6px}
.twin .mid .link{width:2px;flex:1;background:linear-gradient(180deg,transparent,var(--accent2),transparent)}
.twin .mid .sync{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 5px rgba(139,92,246,.18);animation:spin 3.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.twin h4{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.twin .row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed rgba(124,119,150,.28)}
.twin .virt .row{border-color:rgba(255,255,255,.14)}
.twin .row b{font-variant-numeric:tabular-nums}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#f7f5fd;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col .ch{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.col .ch .n{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;border-left:3px solid var(--accent2)}
.tk .tt{font-size:12.5px;font-weight:700;line-height:1.35}
.tk .mt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.tk .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 12px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tl .ev.crit::before{border-color:var(--bad)}
.tl .ev.done::before{background:var(--accent2);border-color:var(--accent2)}
.tl .ev .tm{font-size:11px;color:var(--muted);font-weight:700}
.tl .ev .ti{font-size:13px;font-weight:700;margin:2px 0}
.tl .ev .de{font-size:12px;color:var(--muted)}
/* scenario cards */
.scn{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;position:relative}
.scn.best{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.1)}
.scn .badge{position:absolute;top:-9px;right:12px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.scn h4{font-size:13.5px;font-weight:800;margin-bottom:2px}
.scn .p{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.scn .met{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-top:1px dashed var(--line)}
.scn .met b{font-variant-numeric:tabular-nums;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.assetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.asset{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}
.asset .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.asset .ic{width:36px;height:36px;border-radius:10px;background:#ede9fe;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.asset .nm{font-size:13px;font-weight:800}
.asset .id{font-size:10.5px;color:var(--muted);font-family:"Inter"}
.asset .st{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:11.5px;margin-top:8px}
.asset .st div{color:var(--muted)}
.asset .st b{color:var(--ink);font-variant-numeric:tabular-nums}
.gauge{display:flex;align-items:center;gap:10px}
.msg{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border:1px solid var(--line);border-radius:13px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.msg .material-symbols-outlined{color:var(--accent);font-size:22px;flex:none}
.msg .tt{font-size:13px;font-weight:700}
.msg .de{font-size:12px;color:var(--muted);margin-top:2px}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:column;padding:12px 14px}
  .brand{padding:2px 4px 12px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:8px}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:9px 13px}
  .nav button .idx{display:none}
  .side-foot{display:none}
  .main{padding:20px 16px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .assetgrid{grid-template-columns:1fr}
  .twin{grid-template-columns:1fr}
  .twin .mid{flex-direction:row;padding:10px 0}
  .twin .mid .link{width:auto;height:2px;background:linear-gradient(90deg,transparent,var(--accent2),transparent)}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:10px}
  .board{grid-template-columns:1fr}
  .g4,.g3{grid-template-columns:1fr}
  .main{padding:16px 12px 36px}
  .topbar .tt h2{font-size:18px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">deployed_code</span></div>
      <div><h1>Digital Twin</h1><p>數位分身 · 虛實同步平台</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">系統核心：<b>MES 製造執行</b><br/>整合 IoT Gateway · SCADA · ERP<br/>模擬準確率 <b>96.4%</b></div>
  </aside>
  <main class="main">
    <div id="app"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"sensors",name:"實體數據建模",desc:"IoT/SCADA 訊號採集與數位資產建模"},
  {icon:"deployed_code",name:"虛擬模型建立",desc:"3D 產線孿生與參數化行為模型"},
  {icon:"sync_alt",name:"虛實同步校準",desc:"即時映射與偏差校準"},
  {icon:"science",name:"情境模擬分析",desc:"What-if 產能與排程試算"},
  {icon:"warning",name:"異常情境預演",desc:"故障注入與風險推演"},
  {icon:"lightbulb",name:"優化方案回饋",desc:"模擬結論回寫實體產線"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}

/* ---------- SCREEN 0 : 實體數據建模 ---------- */
function s0(c){
  var kpis=[
    {l:"接入設備節點",v:"148",u:"台",ic:"lan",d:"+6 本週",cls:"up"},
    {l:"即時訊號通道",v:"3,264",u:"路",ic:"cable",d:"取樣 200ms",cls:"flat"},
    {l:"資料完整率",v:"99.2",u:"%",ic:"verified",d:"+0.4%",cls:"up"},
    {l:"離線節點",v:"3",u:"台",ic:"link_off",d:"待巡檢",cls:"down"}
  ];
  var sig=[
    {n:"CNC-07 主軸振動",tag:"訊號正常",t:"t-ok",v:"2.1 mm/s",r:"200ms",q:99.6},
    {n:"注塑機 IM-12 料溫",tag:"訊號正常",t:"t-ok",v:"228 °C",r:"500ms",q:99.1},
    {n:"AGV-03 電池電壓",tag:"抖動偏高",t:"t-warn",v:"48.2 V",r:"1s",q:94.3},
    {n:"焊接站 WD-02 電流",tag:"訊號正常",t:"t-ok",v:"312 A",r:"100ms",q:98.8},
    {n:"輸送帶 CV-05 轉速",tag:"訊號中斷",t:"t-bad",v:"— rpm",r:"—",q:0},
    {n:"沖壓機 PR-09 壓力",tag:"訊號正常",t:"t-ok",v:"186 bar",r:"200ms",q:99.4}
  ];
  var rows="";
  for(var i=0;i<sig.length;i++){var s=sig[i];
    rows+='<tr><td style="font-weight:600">'+s.n+'</td><td><span class="tag '+s.t+'">'+s.tag+'</span></td><td class="mono">'+s.v+'</td><td style="color:var(--muted)">'+s.r+'</td>'+
    '<td><div class="gauge"><div class="bar" style="flex:1"><i style="width:'+s.q+'%"></i></div><span class="mono" style="font-size:12px;min-width:38px">'+s.q+'%</span></div></td></tr>';
  }
  var kh="";for(var j=0;j<kpis.length;j++){var k=kpis[j];
    kh+='<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="delta '+k.cls+'"><span class="material-symbols-outlined" style="font-size:14px">'+(k.cls=="up"?"trending_up":k.cls=="down"?"trending_down":"remove")+'</span>'+k.d+'</div></div>';
  }
  c.innerHTML='<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'+
    '<div class="grid g21">'+
      '<div class="card pad0"><div style="padding:18px 18px 4px"><h3><span class="material-symbols-outlined">sensors</span>設備訊號採集監控</h3><div class="sub">IoT Gateway 即時匯入 · 依資料品質排序</div></div><div style="overflow-x:auto"><table><thead><tr><th>訊號來源</th><th>狀態</th><th>目前值</th><th>取樣</th><th>資料品質</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">timeline</span>資料吞吐量趨勢</h3><div class="sub">近 12 小時每分鐘訊號筆數（千）</div><div id="c0"></div></div>'+
    '</div>';
  void c.offsetHeight;
  var data=[];for(var t=0;t<24;t++){data.push(Math.round(38+Math.sin(t/2.4)*8+(t%5)*1.3));}
  var ch=new ApexCharts(document.querySelector("#c0"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:250,fontFamily:"Inter",toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[{name:"訊號筆數(千/分)",data:data}],
    colors:["#6d28d9"],stroke:{curve:"smooth",width:2.5},
    fill:{type:"gradient",gradient:{shadeIntensity:1,opacityFrom:.4,opacityTo:.05}},
    dataLabels:{enabled:false},
    xaxis:{categories:data.map(function(_,i){return (i*.5+8).toFixed(0)+"h";}),labels:{style:{fontSize:"10px"}},tickAmount:6},
    yaxis:{labels:{style:{fontSize:"10px"}}},grid:{borderColor:"#eee"}
  });
  ch.render();charts.push(ch);
}

/* ---------- SCREEN 1 : 虛擬模型建立 ---------- */
function s1(c){
  var assets=[
    {ic:"precision_manufacturing",nm:"CNC 加工單元",id:"TWIN-CNC-07",v:"v3.2",fid:"98.7",poly:"1.24M",st:"已綁定"},
    {ic:"conveyor_belt",nm:"輸送分揀線",id:"TWIN-CV-05",v:"v2.8",fid:"96.1",poly:"842K",st:"已綁定"},
    {ic:"iron",nm:"注塑成型機",id:"TWIN-IM-12",v:"v4.0",fid:"97.9",poly:"1.66M",st:"已綁定"},
    {ic:"smart_toy",nm:"六軸機械手臂",id:"TWIN-RB-04",v:"v3.5",fid:"99.2",poly:"2.10M",st:"已綁定"},
    {ic:"electric_bolt",nm:"點焊工作站",id:"TWIN-WD-02",v:"v2.1",fid:"92.4",poly:"610K",st:"校準中"},
    {ic:"forklift",nm:"AGV 搬運車",id:"TWIN-AGV-03",v:"v1.9",fid:"88.6",poly:"430K",st:"建構中"}
  ];
  var ah="";for(var i=0;i<assets.length;i++){var a=assets[i];
    var stc=a.st=="已綁定"?"t-ok":a.st=="校準中"?"t-warn":"t-info";
    ah+='<div class="asset"><div class="top"><div class="ic"><span class="material-symbols-outlined">'+a.ic+'</span></div><div><div class="nm">'+a.nm+'</div><div class="id">'+a.id+' · '+a.v+'</div></div><span class="tag '+stc+'" style="margin-left:auto">'+a.st+'</span></div>'+
      '<div class="st"><div>擬真度</div><b>'+a.fid+'%</b><div>網格量</div><b>'+a.poly+'</b></div>'+
      '<div class="bar" style="margin-top:9px"><i style="width:'+a.fid+'%"></i></div></div>';
  }
  c.innerHTML='<div class="grid g12">'+
    '<div class="card"><h3><span class="material-symbols-outlined">radar</span>模型擬真度雷達</h3><div class="sub">六項孿生保真度維度評分</div><div id="c1"></div><div class="legend"><span><i style="background:#6d28d9"></i>目標基準</span><span><i style="background:#8b5cf6"></i>目前模型</span></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">deployed_code</span>數位資產庫</h3><div class="sub">3D 孿生模型與參數化行為模型清單</div><div class="assetgrid">'+ah+'</div></div>'+
  '</div>';
  void c.offsetHeight;
  var ch=new ApexCharts(document.querySelector("#c1"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radar",height:300,fontFamily:"Inter",toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[{name:"目標基準",data:[95,95,90,92,95,90]},{name:"目前模型",data:[98,92,88,96,90,85]}],
    colors:["#6d28d9","#8b5cf6"],stroke:{width:2},fill:{opacity:.18},markers:{size:3},
