<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠數位分身模擬系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --sidebar:#0F172A;
  --sidebar-muted:#CBD5E1;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans","Noto Sans TC",sans-serif;line-height:1.5}
button{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:"liga";vertical-align:middle}
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;background:var(--sidebar);color:#F8FAFC;border-right:1px solid #1E293B}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid #334155}
.logo{display:grid;place-items:center;width:42px;height:42px;flex:none;background:var(--color-primary);border:1px solid #60A5FA;border-radius:8px;color:#fff;box-shadow:4px 4px 0 #172554}
.brand h1{margin:0;font-size:15px;line-height:1.3;letter-spacing:.02em}
.brand p{margin:3px 0 0;color:#CBD5E1;font-size:11px}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:18px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 11px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--sidebar-muted);text-align:left;font-size:13px;font-weight:600;transition:background-color .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{background:#1E293B;color:#fff;border-color:#334155;transform:translateX(2px)}
.nav button.on{background:var(--color-primary);border-color:#60A5FA;color:#fff;box-shadow:3px 3px 0 #172554}
.nav .idx{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:10px;opacity:.75}
.side-foot{margin-top:auto;padding:16px 9px 2px;border-top:1px solid #334155;color:#CBD5E1;font-size:11px;line-height:1.7}
.side-foot b{color:#fff}
.main{padding:24px 28px 44px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;min-height:70px;margin-bottom:18px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.topbar .tt{flex:1}
.topbar h2{display:flex;align-items:center;gap:9px;margin:0;color:#0F172A;font-size:22px;line-height:1.25}
.topbar h2 .material-symbols-outlined{color:var(--color-primary);font-size:26px}
.topbar p{margin:5px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid #CBD5E1;border-radius:999px;background:#fff;color:#1E40AF;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #DCFCE7;animation:pulse 2.4s ease-in-out infinite}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.g12{grid-template-columns:minmax(300px,1fr) minmax(0,1.7fr)}
.card,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card{padding:17px}
.card.pad0{padding:0;overflow:hidden}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;color:#0F172A;font-size:14px}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.sub{margin-bottom:13px;color:var(--muted);font-size:12px}
.kpi{position:relative;padding:15px 16px 14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.kpi:before{position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary);content:""}
.kpi:hover{transform:translateY(-2px);border-color:#93C5FD;box-shadow:0 10px 26px rgba(37,99,235,.1)}
.kpi .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:16px}
.kpi .val{margin-top:7px;color:#0F172A;font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em}
.kpi .val small{color:var(--muted);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.delta{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:10px 12px;border-bottom:2px solid #CBD5E1;background:#F8FAFC;color:#334155;text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#EFF6FF}
tbody tr:last-child td{border-bottom:0}
td:nth-last-child(-n+3){font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;border-radius:4px;font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap}
.tag:before{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;content:""}
.t-ok{background:#F0FDF4;color:#166534}.t-warn{background:#FFFBEB;color:#92400E}.t-bad{background:#FEF2F2;color:#B91C1C}.t-info{background:#F0F9FF;color:#075985}.t-mut{background:#EFF6FF;color:#1D4ED8}
.bar{height:7px;min-width:60px;overflow:hidden;border:1px solid #DBEAFE;border-radius:2px;background:#EFF6FF}
.bar i{display:block;height:100%;background:var(--color-primary)}
.gauge{display:flex;align-items:center;gap:9px}
.mono,.id,.tm{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{font-weight:600}
.twin{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch}
.twin .side{padding:15px;border-radius:6px}
.twin .phys{border:1px solid #BFDBFE;background:#EFF6FF}
.twin .virt{border:1px solid #1E40AF;background:#172554;color:#EFF6FF}
.twin .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 10px}
.twin .link{width:2px;flex:1;background:#93C5FD}
.twin .sync{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--color-primary);color:#fff;box-shadow:0 0 0 5px #DBEAFE;animation:spin 4s linear infinite}
.twin h4{display:flex;align-items:center;gap:6px;margin:0 0 9px;font-size:13px}
.twin .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #CBD5E1;font-size:12px}
.twin .virt .row{border-color:#475569}
.twin .row b{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;text-align:right}
.msg{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid #BFDBFE;border-left:4px solid var(--color-primary);border-radius:6px;background:#EFF6FF}
.msg>.material-symbols-outlined{flex:none;color:var(--color-primary);font-size:21px}
.msg .tt{font-size:13px;font-weight:700}.msg .de{margin-top:2px;color:var(--muted);font-size:12px}
.assetgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.asset{padding:12px;border:1px solid var(--line);border-radius:6px;background:#fff;transition:border-color .2s,transform .2s}
.asset:hover{transform:translateY(-2px);border-color:#93C5FD}
.asset .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.asset .ic{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:5px;background:#DBEAFE;color:#1D4ED8}
.asset .nm{font-size:12.5px;font-weight:700}.asset .id{color:var(--muted);font-size:10px}
.asset .st{display:grid;grid-template-columns:1fr auto;gap:5px 8px;margin-top:7px;font-size:11px}
.asset .st div{color:var(--muted)}.asset .st b{text-align:right;font-family:"Fira Code",monospace}
.scn{position:relative;padding:14px;border:1px solid var(--line);border-radius:7px;background:#fff}
.scn.best{border:2px solid var(--color-accent);box-shadow:0 0 0 3px #FFEDD5}
.scn .badge{position:absolute;top:-10px;right:11px;padding:3px 8px;border-radius:3px;background:var(--color-accent);color:#fff;font-size:10px;font-weight:700}
.scn h4{margin:0 0 2px;font-size:13px}.scn .p{min-height:35px;margin-bottom:8px;color:var(--muted);font-size:11px}
.scn .met{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:11.5px}
.scn .met b{font-family:"Fira Code",monospace;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:5px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:4px;display:inline-block}
.board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px}
.col{padding:10px;border:1px solid var(--line);border-radius:6px;background:#F8FAFC}
.col .ch{display:flex;align-items:center;gap:6px;margin-bottom:9px;padding-bottom:7px;border-bottom:2px solid #CBD5E1;font-size:12px;font-weight:700}
.col .n{margin-left:auto;padding:1px 7px;border:1px solid #CBD5E1;border-radius:3px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tk{margin-bottom:8px;padding:9px 9px 8px;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:4px;background:#fff}
.tk:last-child{margin-bottom:0}.tk .tt{font-size:12px;font-weight:600;line-height:1.4}
.tk .mt{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.av{display:grid;place-items:center;width:23px;height:23px;border:1px solid #93C5FD;border-radius:50%;background:#EFF6FF;color:#1E40AF;font-size:10px;font-weight:700}
.tl{position:relative;padding-left:22px}
.tl:before{position:absolute;top:4px;bottom:5px;left:6px;width:2px;background:#CBD5E1;content:""}
.ev{position:relative;padding:0 0 16px 11px}
.ev:before{position:absolute;top:3px;left:-19px;width:10px;height:10px;border:3px solid var(--color-primary);border-radius:50%;background:#fff;content:""}
.ev.crit:before{border-color:var(--bad)}.ev.done:before{border-color:var(--ok);background:var(--ok)}
.ev .tm{color:var(--muted);font-size:10px;font-weight:600}.ev .ti{margin:2px 0;font-size:12.5px;font-weight:700}.ev .de{color:var(--muted);font-size:11.5px}
@keyframes pulse{50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}}
@media(max-width:1024px){
  .layout{grid-template-columns:220px minmax(0,1fr)}
  .main{padding:22px 20px 40px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g21,.g12{grid-template-columns:1fr}
  .assetgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .layout{display:block}
  .sidebar{position:static;width:100%;height:auto;padding:12px}
  .brand{padding:2px 4px 12px}
  .nav{flex-direction:row;overflow-x:auto;margin-top:10px;padding:2px 1px 7px}
  .nav button{width:auto;flex:none;white-space:nowrap}
  .side-foot{display:none}
  .main{padding:18px 14px 36px}
  .topbar{align-items:flex-start;flex-wrap:wrap}
  .topbar .tt{flex-basis:100%}
  .g2,.g3{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(190px,1fr))}
}
@media(max-width:480px){
  .nav .txt,.nav .idx{display:none}
  .nav button{justify-content:center;width:44px;height:44px;padding:0}
  .main{padding:15px 10px 32px}
  .topbar h2{font-size:19px}
  .g4,.assetgrid,.board{grid-template-columns:1fr}
  .twin{grid-template-columns:1fr}
  .twin .mid{flex-direction:row;padding:10px 0}
  .twin .link{width:auto;height:2px}
  .card{padding:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">

  </div>

  <div class="side-foot">系統核心：<b>MES 製造執行</b><br>整合 IoT Gateway · SCADA · ERP<br>模擬準確率 <b>96.4%</b></div>
</aside>
<main class="main"><div id="app"></div></main>
</div>
<script>
var MODS=[
{icon:"sensors",name:"實體數據建模",desc:"IoT/SCADA 訊號採集與數位資產建模"},

{icon:"sync_alt",name:"虛實同步校準",desc:"即時映射與偏差校準"},

{icon:"lightbulb",name:"優化方案回饋",desc:"模擬結論回寫實體產線"}
];
var charts=[];

function baseChart(type,height){
 return{chart:{type:type,height:height,fontFamily:"Fira Sans",toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},dataLabels:{enabled:false},grid:{borderColor:"#E2E8F0"},tooltip:{theme:"light"}}
}
function s0(c){
 var k=[["接入設備節點","148","台","lan","+6 本週","up"],["即時訊號通道","3,264","路","cable","取樣 200ms","flat"],["資料完整率","99.2","%","verified","+0.4%","up"],["離線節點","3","台","link_off","待巡檢","down"]];
 var s=[["CNC-07 主軸振動","訊號正常","t-ok","2.1 mm/s","200ms",99.6],["注塑機 IM-12 料溫","訊號正常","t-ok","228 °C","500ms",99.1],["AGV-03 電池電壓","抖動偏高","t-warn","48.2 V","1s",94.3],["焊接站 WD-02 電流","訊號正常","t-ok","312 A","100ms",98.8],["輸送帶 CV-05 轉速","訊號中斷","t-bad","— rpm","—",0],["沖壓機 PR-09 壓力","訊號正常","t-ok","186 bar","200ms",99.4]];
 var kh=k.map(function(x){return'<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+x[3]+'</span>'+x[0]+'</div><div class="val">'+x[1]+' <small>'+x[2]+'</small></div><div class="delta '+x[5]+'"><span class="material-symbols-outlined">'+(x[5]=="up"?"trending_up":x[5]=="down"?"trending_down":"remove")+'</span>'+x[4]+'</div></div>'}).join("");
 var rows=s.map(function(x){return'<tr><td style="font-weight:600">'+x[0]+'</td><td><span class="tag '+x[2]+'">'+x[1]+'</span></td><td class="mono" style="text-align:right">'+x[3]+'</td><td class="mono">'+x[4]+'</td><td><div class="gauge"><div class="bar" style="flex:1"><i style="width:'+x[5]+'%"></i></div><span class="mono">'+x[5]+'%</span></div></td></tr>'}).join("");
 c.innerHTML='<div class="grid g4" style="margin-bottom:14px">'+kh+'</div><div class="grid g21"><section class="card pad0"><div style="padding:17px 17px 3px"><h3><span class="material-symbols-outlined">sensors</span>設備訊號採集監控</h3><div class="sub">IoT Gateway 即時匯入 · 依資料品質排序</div></div><div style="overflow-x:auto"><table><thead><tr><th>訊號來源</th><th>狀態</th><th>目前值</th><th>取樣</th><th>資料品質</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><section class="card"><h3><span class="material-symbols-outlined">timeline</span>資料吞吐量趨勢</h3><div class="sub">近 12 小時每分鐘訊號筆數（千）</div><div id="c0"></div></section></div>';
 var d=[];for(var i=0;i<24;i++)d.push(Math.round(38+Math.sin(i/2.4)*8+(i%5)*1.3));

}
function s1(c){
 var a=[["precision_manufacturing","CNC 加工單元","TWIN-CNC-07","v3.2","98.7","1.24M","已綁定"],["conveyor_belt","輸送分揀線","TWIN-CV-05","v2.8","96.1","842K","已綁定"],["iron","注塑成型機","TWIN-IM-12","v4.0","97.9","1.66M","已綁定"],["smart_toy","六軸機械手臂","TWIN-RB-04","v3.5","99.2","2.10M","已綁定"],["electric_bolt","點焊工作站","TWIN-WD-02","v2.1","92.4","610K","校準中"],["forklift","AGV 搬運車","TWIN-AGV-03","v1.9","88.6","430K","建構中"]];
