<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APQP Management 先期產品品質規劃</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#cbd5e1;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#cbd5e1;
  --ok:#15803d;
  --warn:#a34700;
  --bad:#dc2626;
  --info:#1d4ed8;
  --shadow:6px 6px 0 #1e293b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(37,99,235,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.055) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:0 0 276px;
  flex-direction:column;
  width:276px;
  height:100vh;
  padding:20px 16px;
  overflow-y:auto;
  background:var(--color-card);
  border-right:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  padding:0 0 18px;
  border-bottom:3px solid var(--ink);
}
.logo{
  display:grid;
  flex:0 0 44px;
  width:44px;
  height:44px;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.logo svg{width:24px;height:24px}
.bt{min-width:0}
.bt b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.bt span{display:block;color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:8px}
.navbtn{
  display:grid;
  grid-template-columns:24px minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:48px;
  padding:10px 12px;
  color:var(--ink);
  text-align:left;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 transparent;
}
.navbtn:hover{color:var(--blue);background:var(--color-muted);box-shadow:3px 3px 0 var(--ink)}
.navbtn.active{
  color:#fff;
  background:var(--blue);
  box-shadow:4px 4px 0 var(--ink);
  transform:translate(-2px,-2px);
}
.navbtn svg{width:20px;height:20px}
.navbtn .nl{overflow:hidden;font-size:13px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.navbtn .idx{font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.sidefoot{
  margin-top:auto;
  padding:16px 4px 0;
  color:var(--muted);
  font-size:11px;
  border-top:2px solid var(--ink);
}
.sidefoot b{color:var(--blue);font-family:"Fira Code",monospace}
.main{flex:1;min-width:0;padding:28px clamp(16px,3vw,44px) 72px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
  padding-bottom:18px;
  border-bottom:3px solid var(--ink);
}
.topbar h1{
  max-width:760px;
  margin:0;
  font-size:clamp(25px,3vw,44px);
  font-weight:700;
  line-height:1.05;
  letter-spacing:-.035em;
}
.topbar .sub{margin-top:9px;color:var(--muted);font-size:13px;font-family:"Fira Code",monospace}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:42px;
  padding:8px 12px;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
  background:var(--color-accent);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.pill svg{width:18px;height:18px}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:var(--shadow);
}
.card{padding:18px}
.card h3{margin:0;font-size:15px;font-weight:700}
.ch{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:2px solid var(--ink);
}
.ch small{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;text-align:right}
.kpi{position:relative;padding:16px;overflow:hidden}
.kpi:before{
  position:absolute;
  top:0;
  right:0;
  width:14px;
  height:14px;
  content:"";
  background:var(--blue);
  border-bottom:2px solid var(--ink);
  border-left:2px solid var(--ink);
}
.kt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
.kt svg{width:18px;height:18px;color:var(--blue)}
.kv{
  margin-top:10px;
  font-family:"Fira Code",monospace;
  font-size:clamp(24px,3vw,34px);
  font-weight:700;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.kd{margin-top:7px;color:var(--muted);font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;height:270px;min-width:0;overflow:hidden}
.chart.sm{height:220px}
.tblwrap{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:600px;border-collapse:collapse;font-size:12px}
th{
  padding:11px 12px;
  color:#fff;
  text-align:left;
  white-space:nowrap;
  background:var(--ink);
  border-right:1px solid #64748b;
}
td{padding:11px 12px;white-space:nowrap;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#dbeafe}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
td:last-child,th:last-child{border-right:0}
tr:last-child td{border-bottom:0}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  border:1px solid currentColor;
}
.tag:before{content:"•";font-size:13px;line-height:1}
.t-ok{color:#166534;background:#dcfce7}
.t-warn{color:#8a3900;background:#ffedd5}
.t-bad{color:#991b1b;background:#fee2e2}
.t-info{color:#1e40af;background:#dbeafe}
.t-mut{color:#334155;background:#e2e8f0}
.bar{height:10px;min-width:70px;overflow:hidden;background:#e2e8f0;border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--blue)}
.phasestrip{display:flex;gap:12px;flex-wrap:wrap}
.phase{
  position:relative;
  flex:1 1 150px;
  min-width:0;
  padding:14px;
  background:#fff;
  border:2px solid var(--ink);
}
.phase:before{position:absolute;top:-2px;left:-2px;width:8px;height:calc(100% + 4px);content:"";background:#94a3b8;border-right:2px solid var(--ink)}
.phase.done:before{background:var(--ok)}
.phase.active:before{background:var(--blue)}
.phase.late:before{background:var(--bad)}
.pn{padding-left:4px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.pt{margin:3px 0 10px;padding-left:4px;font-size:13px;font-weight:700}
.pp{margin-top:7px;padding-left:4px;color:var(--muted);font-size:10px}
.chkgroup{margin-bottom:14px;border:2px solid var(--ink)}
.chkhead{display:flex;align-items:center;gap:10px;padding:12px;background:var(--color-muted);border-bottom:2px solid var(--ink)}
.chkhead svg{width:20px;height:20px;color:var(--blue)}
.chkhead b{font-size:13px}
.chkhead .prog{margin-left:auto;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.chkitem{display:flex;align-items:center;gap:10px;min-height:43px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px}
.chkitem:last-child{border-bottom:0}
.chkbox{
  display:grid;
  flex:0 0 20px;
  width:20px;
  height:20px;
  place-items:center;
  border:2px solid var(--ink);
}
.chkbox.on{color:#fff;background:var(--ok)}
.chkbox.na{color:#000;background:#fb923c}
.chkbox svg{width:13px;height:13px}
.ci-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ci-m{margin-left:auto;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;white-space:nowrap}
.chkitem.dim .ci-t{color:var(--muted)}
.gantt{min-width:650px;padding:12px}
.gantt-row{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.gantt-label{overflow:hidden;font-size:11px;font-weight:700;text-overflow:ellipsis}
.gantt-track{position:relative;height:24px;background:#e9eff8;border:1px solid var(--ink)}
.gantt-bar{
  position:absolute;
  top:3px;
  height:16px;
  padding:0 6px;
  overflow:hidden;
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
  white-space:nowrap;
  background:var(--blue);
}
.gantt-bar.done{background:var(--ok)}
.gantt-bar.late{background:var(--bad)}
.gantt-scale{display:grid;grid-template-columns:160px 1fr;gap:12px;margin-bottom:4px}
.gs-cells{display:grid;grid-template-columns:repeat(6,1fr)}
.gs-cells span{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:center}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:900px}
.kcol{min-width:0;padding:10px;background:var(--color-muted);border:2px solid var(--ink)}
.kcol-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:12px;font-weight:700}
.dot{width:10px;height:10px;border:1px solid var(--ink)}
.cnt{margin-left:auto;padding:1px 7px;font-family:"Fira Code",monospace;font-size:10px;background:#fff;border:1px solid var(--ink)}
.kcard{margin-bottom:10px;padding:11px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.kcard:last-child{margin-bottom:0}
.kc-t{margin-bottom:8px;font-size:12px;font-weight:700;line-height:1.4}
.kc-m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-family:"Fira Code",monospace;font-size:9px}
.who{display:inline-flex;align-items:center;gap:5px}
.av{display:grid;width:21px;height:21px;place-items:center;color:#fff;background:var(--blue);border:1px solid var(--ink);font-size:9px;font-weight:700}
.gates{position:relative}
.gate{display:grid;grid-template-columns:34px 1fr;gap:14px}
.grail{display:flex;flex-direction:column;align-items:center}
.gdot{display:grid;z-index:1;flex:0 0 34px;width:34px;height:34px;place-items:center;color:#fff;border:2px solid var(--ink)}
.gdot svg{width:17px;height:17px}
.gline{flex:1;width:3px;margin:2px 0;background:var(--ink)}
.gate:last-child .gline{display:none}
.gbody{margin-bottom:13px;padding:13px;border:2px solid var(--ink)}
.gb-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.gb-h b{font-size:13px}
.gd{margin-left:auto;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.gb-desc{margin-bottom:9px;color:var(--muted);font-size:12px}
.gb-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:10px}
.doclist{display:flex;flex-direction:column;gap:9px}
.docrow{display:flex;align-items:center;gap:12px;padding:11px;background:#fff;border:2px solid var(--ink)}
.dico{display:grid;flex:0 0 36px;width:36px;height:36px;place-items:center;color:#fff;background:var(--blue);border:1px solid var(--ink)}
.dico svg{width:19px;height:19px}
.dbody{flex:1;min-width:0}
.dt{font-size:12px;font-weight:700}
.dm{margin-top:2px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.dstat{flex:0 0 auto}
.mini-legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}
.mini-legend span{display:inline-flex;align-items:center;gap:6px}
.mini-legend i{display:inline-block;width:11px;height:11px;border:1px solid var(--ink)}
.note{margin-top:14px;padding:11px;color:var(--ink);font-family:"Fira Code",monospace;font-size:10px;background:#ffedd5;border:2px dashed var(--ink)}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .sidebar{
    position:sticky;
    width:100%;
    height:auto;
    padding:10px 12px;
    border-right:0;
    border-bottom:3px solid var(--ink);
  }
  .brand{margin-bottom:10px;padding-bottom:10px}
  .brand .bt span,.sidefoot{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .navbtn{display:flex;justify-content:center;min-height:44px;padding:8px}
  .navbtn .nl,.navbtn .idx{display:none}
  .main{padding:20px 14px 48px}
  .topbar{margin-bottom:22px}
}
@media(max-width:700px){
  .g2,.g3{grid-template-columns:1fr}
  .topbar{display:block}
  .pill{margin-top:16px}
  .phase{flex-basis:100%}
  .chart{height:240px}
}
@media(max-width:480px){
  .g4{grid-template-columns:1fr}
  .card{padding:14px}
  .topbar h1{font-size:28px}
  .pill{width:100%;justify-content:center}
  .ci-m{max-width:110px;overflow:hidden;text-overflow:ellipsis}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .reveal{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" data-icon="verified"></div>
      <div class="bt"><b>APQP 平台</b><span>先期產品品質規劃</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="sidefoot">專案：<b>NPI-2026-A17</b><br>車用連接器新案 · Phase 3</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="th">
        <h1 id="scTitle">APQP 專案總覽</h1>
        <div class="sub" id="scSub">五階段進度與里程碑戰情看板</div>
      </div>
      <div class="pill"><span data-icon="factory"></span>宏鈺精密 · 品質工程處</div>
    </header>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
"use strict";
var ICONS={
dashboard:"<path d='M3 3h7v8H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 15h7v6H3z'/>",
checklist:"<path d='M9 5h12M9 12h12M9 19h12M3 5l1.5 1.5L7 4M3 12l1.5 1.5L7 11M3 19l1.5 1.5L7 18'/>",
calendar_month:"<path d='M6 2v4M18 2v4M3 9h18M5 4h14a2 2 0 012 2v15H3V6a2 2 0 012-2zM7 13h3v3H7z'/>",
account_tree:"<path d='M6 3v12M6 7h8M6 15h8M14 4h7v6h-7zM14 12h7v6h-7zM3 18h6v4H3z'/>",
gavel:"<path d='M14 4l6 6M12 6l6 6M4 20l9-9M2 22h12M10 4l4-2 8 8-2 4z'/>",
fact_check:"<path d='M9 5h11M9 12h11M9 19h11M3 5l2 2 3-4M3 12l2 2 3-4M3 19l2 2 3-4'/>",
verified:"<path d='M12 2l3 2 4-.2.2 4 2 3-2 3-.2 4-4-.2-3 2-3-2-4 .2-.2-4-2-3 2-3 .2-4 4 .2zM8 12l2.5 2.5L16 9'/>",
factory:"<path d='M3 22V9l6 3V9l6 3V4h6v18zM7 17h2M12 17h2M17 17h2'/>",
trending_up:"<path d='M3 17l6-6 4 4 8-9M15 6h6v6'/>",
task_alt:"<path d='M3 12l4 4 8-9M13 19h8M17 15h4'/>",
warning:"<path d='M12 3L2 21h20zM12 9v5M12 18h.01'/>",
bolt:"<path d='M13 2L4 14h7l-1 8 9-12h-7z'/>",
engineering:"<path d='M14 7l3-3 3 3-3 3M5 12a3 3 0 110-6 3 3 0 010 6zM1 21v-3a4 4 0 014-4h2M13 13l8 8M16 12l-4 4'/>",
precision_manufacturing:"<path d='M4 21v-8l4-4 4 4v8M12 17h4l2-3h3v7h-9M7 9V4h10v7M10 4V2h4v2'/>",
schedule:"<circle cx='12' cy='12' r='9'/><path d='M12 7v6l4 2'/>",
flag:"<path d='M5 22V3M5 4h12l-2 4 2 4H5'/>",
monitoring:"<path d='M3 20h18M5 17l4-5 4 3 6-9'/>",
groups:"<circle cx='9' cy='8' r='3'/><circle cx='17' cy='9' r='2'/><path d='M3 20v-3a5 5 0 0110 0v3M14 15a4 4 0 017 3v2'/>",
history:"<path d='M3 12a9 9 0 109-9 9 9 0 00-7 3.3L3 9M3 3v6h6M12 7v6l4 2'/>",
science:"<path d='M9 2h6M10 2v6L4 19a2 2 0 002 3h12a2 2 0 002-3L14 8V2M7 16h10'/>",
description:"<path d='M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8'/>",
check:"<path d='M5 12l4 4L19 6'/>",
remove:"<path d='M5 12h14'/>",
pending:"<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/>",
lock:"<rect x='5' y='10' width='14' height='11'/><path d='M8 10V7a4 4 0 018 0v3'/>"
};
function icon(name){
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">'+(ICONS[name]||ICONS.dashboard)+'</svg>';
}
document.querySelectorAll("[data-icon]").forEach(function(el){el.innerHTML=icon(el.getAttribute("data-icon"));});

var MODULES=[
  {icon:"dashboard",name:"APQP 專案總覽",desc:"五階段進度與里程碑戰情看板"},
  {icon:"checklist",name:"五階段檢查表",desc:"各階段交付物與門檻項目查核"},
  {icon:"calendar_month",name:"時程與里程碑",desc:"甘特時程與跨階段時序管理"},
  {icon:"account_tree",name:"跨部門任務分派",desc:"小組成員任務指派與追蹤"},
  {icon:"gavel",name:"階段門檻審查",desc:"Gate Review 放行決議與簽核"},
  {icon:"fact_check",name:"PPAP / 控制計畫",desc:"PPAP 交件與控制計畫覆核"}
];
var navEl=document.getElementById("nav");
MODULES.forEach(function(m,i){
  var b=document.createElement("button");
  b.className="navbtn";
  b.type="button";
  b.setAttribute("data-i",String(i));
  b.setAttribute("aria-label",m.name);

  '<div class="grid g2"><section class="card"><div class="ch"><h3>PPAP 要素備件狀態</h3><small>Level 3 · 18 要素節選</small></div><div class="doclist">'+doclist+'</div></section><section class="card"><div class="ch"><h3>製程能力分布</h3><small>關鍵特性 Cpk</small></div><div id="c5a" class="chart"></div><div class="mini-legend"><span><i style="background:#15803d"></i>Cpk ≥ 1.33</span><span><i style="background:#ea580c"></i>1.0–1.33</span><span><i style="background:#dc2626"></i>&lt; 1.0</span></div></section></div>'+

function screen5charts(){
  mkChart("c5a",{textStyle:chartText(),grid:{left:8,right:28,top:14,bottom:8,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"value",splitLine:{lineStyle:{color:"#cbd5e1",type:"dashed"}}},yAxis:{type:"category",data:["色差 ΔE","塑件尺寸","插拔力","鍍層厚度","接觸電阻"],axisLine:{lineStyle:{color:"#1e293b"}}},series:[{type:"bar",barWidth:17,label:{show:true,position:"right",color:"#1e293b"},data:[{value:1.67,itemStyle:{color:OK}},{value:1.55,itemStyle:{color:OK}},{value:1.42,itemStyle:{color:OK}},{value:1.28,itemStyle:{color:WARN}},{value:1.10,itemStyle:{color:WARN}}]}]});
}
var BUILDERS=[screen0,screen1,screen2,screen3,screen4,screen5];
var CHARTS=[screen0charts,screen1charts,screen2charts,screen3charts,screen4charts,screen5charts];
function show(i){
  disposeCharts();
  var data=BUILDERS[i](),container=document.getElementById("screen");
  container.innerHTML=data.html;
  container.classList.remove("reveal");
  void container.offsetWidth;
  container.classList.add("reveal");
  document.getElementById("scTitle").textContent=data.title;
  document.getElementById("scSub").textContent=data.sub;
  document.querySelectorAll("[data-i]").forEach(function(btn,k){
    var active=k===i;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-current",active?"page":"false");
  });
  if(CHARTS[i])CHARTS[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
