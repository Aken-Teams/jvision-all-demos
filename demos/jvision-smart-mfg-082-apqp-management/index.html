<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>APQP Management 先期產品品質規劃</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#4f46e5; --accent2:#818cf8; --accent-soft:#eef0fe;
  --bg:#f5f6fb; --panel:#ffffff; --ink:#1e2230; --muted:#6b7285;
  --line:#e7e9f2; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --shadow:0 1px 2px rgba(30,34,48,.05),0 8px 24px rgba(79,70,229,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand .bt{min-width:0}
.brand .bt b{display:block;font-size:14px;font-weight:800;letter-spacing:.2px}
.brand .bt span{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:13.5px;
  font-weight:600;text-align:left;width:100%;transition:.15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto}
.navbtn .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .idx{margin-left:auto;font-size:11px;font-weight:700;color:var(--line);flex:0 0 auto}
.navbtn:hover{background:var(--accent-soft);color:var(--accent)}
.navbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.navbtn.active .idx{color:rgba(255,255,255,.7)}
.sidefoot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.sidefoot b{color:var(--accent)}
.main{flex:1 1 auto;min-width:0;padding:22px 26px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar .th{min-width:0}
.topbar h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px}
.pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card .ch small{color:var(--muted);font-size:11.5px;font-weight:600}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .kt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .kt .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .kv{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.3px}
.kpi .kd{font-size:11.5px;margin-top:4px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;height:260px;overflow:hidden;min-width:0}
.chart.sm{height:210px}
.tblwrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:520px}
th{text-align:left;padding:10px 12px;background:#fafaff;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:#e7f6ec;color:var(--ok)}
.t-warn{background:#fdf0dc;color:var(--warn)}
.t-bad{background:#fdeaea;color:var(--bad)}
.t-info{background:#e6effd;color:var(--info)}
.t-mut{background:#eef0f4;color:var(--muted)}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.phasestrip{display:flex;gap:10px;flex-wrap:wrap;min-width:0}
.phase{flex:1 1 150px;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel);position:relative;overflow:hidden}
.phase::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2)}
.phase.done::before{background:var(--ok)}
.phase.active::before{background:var(--accent)}
.phase.late::before{background:var(--bad)}
.phase .pn{font-size:11px;color:var(--muted);font-weight:700}
.phase .pt{font-size:13.5px;font-weight:800;margin:3px 0 8px}
.phase .pp{font-size:11px;color:var(--muted);margin-top:6px}
.chkgroup{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.chkhead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fafaff;border-bottom:1px solid var(--line)}
.chkhead .material-symbols-outlined{color:var(--accent)}
.chkhead b{font-size:13.5px}
.chkhead .prog{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.chkitem{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.chkitem:last-child{border-bottom:none}
.chkbox{width:19px;height:19px;border-radius:6px;flex:0 0 19px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line)}
.chkbox.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chkbox.na{background:#fdf0dc;border-color:var(--warn);color:var(--warn)}
.chkbox .material-symbols-outlined{font-size:14px}
.chkitem .ci-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.chkitem .ci-m{margin-left:auto;font-size:11px;color:var(--muted);flex:0 0 auto}
.chkitem.dim .ci-t{color:var(--muted)}
.gantt{min-width:640px}
.gantt-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.gantt-row:last-child{border-bottom:none}
.gantt-label{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;height:22px;background:#fafaff;border-radius:6px}
.gantt-bar{position:absolute;top:3px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 6px;color:#fff;font-size:10px;font-weight:700;overflow:hidden;white-space:nowrap}
.gantt-bar.done{background:linear-gradient(90deg,#16a34a,#4ade80)}
.gantt-bar.late{background:linear-gradient(90deg,#dc2626,#f87171)}
.gantt-scale{display:grid;grid-template-columns:150px 1fr;gap:12px;margin-bottom:4px}
.gantt-scale .gs-cells{display:grid;grid-template-columns:repeat(6,1fr)}
.gantt-scale .gs-cells span{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.kcol{background:#fafaff;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.kcol-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;margin-bottom:10px}
.kcol-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.kcol-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,34,48,.04)}
.kcard:last-child{margin-bottom:0}
.kcard .kc-t{font-size:12.5px;font-weight:700;margin-bottom:6px;line-height:1.35}
.kcard .kc-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.kcard .who{display:inline-flex;align-items:center;gap:5px}
.av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.gates{position:relative;padding-left:2px}
.gate{display:grid;grid-template-columns:32px 1fr;gap:14px}
.gate .grail{display:flex;flex-direction:column;align-items:center}
.gate .gdot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 32px;z-index:1}
.gate .gdot .material-symbols-outlined{font-size:18px}
.gate .gline{flex:1;width:2px;background:var(--line);margin:2px 0}
.gate:last-child .gline{display:none}
.gate .gbody{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.gate .gb-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.gate .gb-h b{font-size:13.5px}
.gate .gb-h .gd{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.gate .gb-desc{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.gate .gb-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px}
.gate .gb-meta span b{color:var(--ink)}
.doclist{display:flex;flex-direction:column;gap:9px}
.docrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.docrow .dico{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.docrow .dbody{min-width:0;flex:1}
.docrow .dt{font-size:13px;font-weight:700}
.docrow .dm{font-size:11px;color:var(--muted);margin-top:2px}
.docrow .dstat{flex:0 0 auto}
.mini-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.mini-legend span{display:inline-flex;align-items:center;gap:6px}
.mini-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;padding:10px 12px;background:#fafaff;border:1px dashed var(--line);border-radius:10px}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;border-right:none;border-bottom:1px solid var(--line);gap:8px}
  .brand{border-bottom:none;padding:0;margin:0;margin-right:auto}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .navbtn{width:auto;padding:8px 11px}
  .navbtn .idx{display:none}
  .sidefoot{display:none}
  .main{padding:18px 16px 34px}
}
@media(max-width:820px){
  .g3,.g2{grid-template-columns:1fr}
  .phase{flex:1 1 100%}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
  .navbtn .nl{display:none}
  .navbtn{padding:8px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div class="bt"><b>APQP 平台</b><span>先期產品品質規劃</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">專案：<b>NPI-2026-A17</b><br/>車用連接器新案 · Phase 3</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="th">
        <h1 id="scTitle">APQP 專案總覽</h1>
        <div class="sub" id="scSub">五階段進度與里程碑戰情看板</div>
      </div>
      <div class="pill"><span class="material-symbols-outlined">factory</span>宏鈺精密 · 品質工程處</div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODULES=[
  {icon:"dashboard",name:"APQP 專案總覽",desc:"五階段進度與里程碑戰情看板"},
  {icon:"checklist",name:"五階段檢查表",desc:"各階段交付物與門檻項目查核"},
  {icon:"calendar_month",name:"時程與里程碑",desc:"甘特時程與跨階段時序管理"},
  {icon:"account_tree",name:"跨部門任務分派",desc:"小組成員任務指派與追蹤"},
  {icon:"gavel",name:"階段門檻審查",desc:"Gate Review 放行決議與簽核"},
  {icon:"fact_check",name:"PPAP / 控制計畫",desc:"PPAP 交件與控制計畫覆核"}
];

var navEl=document.getElementById("nav");
MODULES.forEach(function(m,i){
  var b=document.createElement("button");
  b.className="navbtn";b.setAttribute("data-i",String(i));
  b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="nl">'+m.name+'</span><span class="idx">0'+(i+1)+'</span>';
  b.addEventListener("click",function(){ location.hash="v"+i; });
  navEl.appendChild(b);
});

var CH={};
function disposeCharts(){
  Object.keys(CH).forEach(function(k){ try{CH[k].dispose();}catch(e){} delete CH[k]; });
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el) return;
  var c=echarts.init(el);
  c.setOption(opt);
  CH[id]=c;
}
window.addEventListener("resize",function(){
  Object.keys(CH).forEach(function(k){ try{CH[k].resize();}catch(e){} });
});

var ACC="#4f46e5",ACC2="#818cf8";

function kpi(icon,label,val,delta){
  return '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'+
    '<div class="kv">'+val+'</div><div class="kd">'+delta+'</div></div>';
}
function phase(cls,pn,pt,pv,pct,pp){
  return '<div class="phase '+cls+'"><div class="pn">'+pn+'</div><div class="pt">'+pt+'</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="pp">'+pv+' · '+pp+'</div></div>';
}

function screen0(){
  return {
    title:MODULES[0].name, sub:MODULES[0].desc,
    html:''+
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi("trending_up","APQP 準時完成率","91.4%",'<span class="up">▲ 4.2%</span> 較上季')+
      kpi("task_alt","階段交付達成","38 / 44",'<span class="up">86.4%</span> 已核准')+
      kpi("warning","逾期任務","5 件",'<span class="down">2 件</span> 高風險')+
      kpi("bolt","量產初期不良","1.8%",'<span class="up">▼ 0.6%</span> 目標 2.0%')+
    '</div>'+
    '<div class="card" style="margin-bottom:14px">'+
      '<div class="ch"><div><h3>五階段推進狀態</h3></div><small>NPI-2026-A17 · 車用連接器</small></div>'+
      '<div class="phasestrip">'+
        phase("done","P1","計畫與定義","100%",100,"已放行 02/10")+
        phase("done","P2","產品設計開發","100%",100,"已放行 03/22")+
        phase("active","P3","製程設計開發","72%",72,"進行中 · 4 項待審")+
        phase("late","P4","產品製程確認","28%",28,"1 項逾期 · PPAP 待交")+
        phase("","P5","門檻放行回饋","0%",0,"未開始")+
      '</div>'+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>任務燃盡（剩餘 vs 計畫）</h3><small>32 週專案</small></div><div id="c0a" class="chart"></div></div>'+
      '<div class="card"><div class="ch"><h3>交付物狀態分布</h3><small>共 44 項</small></div><div id="c0b" class="chart"></div></div>'+
    '</div>'
  };
}
function screen0charts(){
  mkChart("c0a",{
    grid:{left:38,right:14,top:28,bottom:26},
    tooltip:{trigger:"axis"},
    legend:{data:["計畫剩餘","實際剩餘"],top:0,textStyle:{fontSize:11},itemWidth:14,itemHeight:8},
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLine:{lineStyle:{color:"#d7dae6"}},axisLabel:{fontSize:10,color:"#6b7285"}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef0f6"}},axisLabel:{fontSize:10,color:"#6b7285"}},
    series:[
      {name:"計畫剩餘",type:"line",smooth:true,data:[44,38,33,27,22,16,9,0],lineStyle:{type:"dashed",color:ACC2},itemStyle:{color:ACC2},symbolSize:5},
      {name:"實際剩餘",type:"line",smooth:true,data:[44,40,36,31,26,20,14,null],areaStyle:{color:"rgba(79,70,229,.10)"},lineStyle:{color:ACC,width:3},itemStyle:{color:ACC},symbolSize:5}
    ]
  });
  mkChart("c0b",{
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11},itemWidth:12,itemHeight:8},
    series:[{type:"pie",radius:["48%","72%"],center:["50%","44%"],avoidLabelOverlap:true,
      itemStyle:{borderColor:"#fff",borderWidth:2},
      label:{show:true,fontSize:11,formatter:"{c}"},
      data:[
        {value:38,name:"已核准",itemStyle:{color:ACC}},
        {value:4,name:"審查中",itemStyle:{color:ACC2}},
        {value:2,name:"退回修改",itemStyle:{color:"#f0b429"}}
      ]}]
  });
}

function screen1(){
  var groups=[
    {phase:"P2 產品設計開發",prog:"9 / 10",icon:"engineering",items:[
      ["設計 FMEA（DFMEA）完成","on","QA-林","D+0"],
      ["設計驗證計畫（DVP&R）","on","RD-陳","D+2"],
      ["工程圖面與規格釋出","on","RD-陳","D+3"],
      ["新設備 / 治具需求清單","on","ME-王","D+4"],
      ["特殊特性清單（SC/CC）","on","QA-林","D+5"],
      ["原型件製作與試驗","on","RD-周","D+6"],
      ["可製造性設計審查（DFM）","on","ME-王","D+7"],
      ["材料與供應商初選","on","PU-李","D+8"],
      ["設計審查會議紀錄","on","PM-徐","D+9"],
      ["客戶工程變更確認","na","PM-徐","待客戶"]
    ]},
    {phase:"P3 製程設計開發",prog:"6 / 9",icon:"precision_manufacturing",items:[
      ["製程流程圖（Flow Chart）","on","ME-王","D+0"],
      ["製程 FMEA（PFMEA）","on","QA-張","D+2"],

var BUILDERS=[screen0,screen1,screen2,screen3,screen4,screen5];
var CHARTS=[screen0charts,screen1charts,screen2charts,screen3charts,screen4charts,screen5charts];

function show(i){
  disposeCharts();
  var data=BUILDERS[i]();
  var container=document.getElementById("screen");
  container.innerHTML=data.html;
  document.getElementById("scTitle").textContent=data.title;
  document.getElementById("scSub").textContent=data.sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle("active",String(k)===String(i));
  }
  void container.offsetHeight;
  if(CHARTS[i]) CHARTS[i]();
}
