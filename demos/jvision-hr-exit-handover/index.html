<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>離職面談與知識交接 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E8DC;
  --accent:#D97706;
  --accent2:#F59E0B;
  --accent-soft:#FFF4D6;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#E5FAF6;
  --hov:#F2FCFA;
  --track:#D9EEEC;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#2563EB;
  --r:6px;
  --shadow:5px 5px 0 rgba(19,78,74,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC","Times New Roman",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,h4{
  margin:0;
  color:var(--ink);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  letter-spacing:.01em;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:3px;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:264px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  padding:28px 20px 20px;
  overflow:auto;
  background:#073D39;
  color:#F0FDFA;
  border-right:6px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 4px 27px;
  border-bottom:1px solid rgba(153,246,228,.25);
}
.brand-logo{
  width:43px;
  height:43px;
  flex:none;
  display:grid;
  place-items:center;
  color:#042F2E;
  background:var(--color-secondary);
  border:1px solid #99F6E4;
  border-radius:3px;
  box-shadow:4px 4px 0 rgba(0,0,0,.2);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  color:#FFFFFF;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:.04em;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:#99F6E4;
  font-family:"Cinzel",serif;
  font-size:8px;
  letter-spacing:.18em;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:24px;
}
.nav button{
  position:relative;
  min-height:46px;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:10px 11px;
  color:#CCFBF1;
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  text-align:left;
  transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
}
.nav button:hover{
  color:#FFFFFF;
  background:rgba(45,212,191,.13);
  border-color:rgba(153,246,228,.32);
  transform:translateX(2px);
}
.nav button.on{
  color:#042F2E;
  background:#FFFFFF;
  border-color:#FFFFFF;
  box-shadow:4px 4px 0 var(--color-secondary);
}
.nav button.on::before{
  content:"";
  position:absolute;
  left:-21px;
  top:9px;
  bottom:9px;
  width:5px;
  background:var(--color-accent);
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav .txt{font-weight:600}
.nav .idx{
  margin-left:auto;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-variant-numeric:tabular-nums;
  opacity:.75;
}
.side-foot{
  margin-top:auto;
  padding:19px 4px 0;
  border-top:1px solid rgba(153,246,228,.25);
  color:#A7F3D0;
  font-size:12px;
  line-height:1.8;
}
.side-foot b{color:#FFFFFF}
.main{
  flex:1;
  min-width:0;
  max-width:1660px;
  padding:32px 38px 64px;
}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  margin-bottom:25px;
  padding-bottom:19px;
  border-bottom:2px solid var(--ink);
}
.topbar::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-2px;
  width:92px;
  height:5px;
  background:var(--color-accent);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:700;
  line-height:1.1;
}
.topbar h1 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:27px;
}
.topbar .sub{
  max-width:660px;
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}
.top-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  flex-wrap:wrap;
}
.chip{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 11px;
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.chip .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(21,128,61,.14);
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  color:#042F2E;
  background:var(--color-secondary);
  border:1px solid var(--color-primary);
  border-radius:50%;
  font-family:"Cinzel",serif;
  font-weight:600;
}
.grid{display:grid;gap:17px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.card,.sec{padding:19px}
.sec{margin-bottom:17px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
  flex-wrap:wrap;
}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:700;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px;
}
.card-h .hint{
  color:var(--muted);
  font-size:12px;
}
.sec>p{margin:0 0 13px;color:var(--muted)}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0}
.dl dt{color:var(--muted);font-size:13px;font-weight:600}
.dl dd{margin:0}
.kpi,.stat{
  position:relative;
  overflow:hidden;
  padding:17px 18px 16px;
  border-top:4px solid var(--color-primary);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi:hover,.stat:hover,.card:hover{
  border-color:var(--color-primary);
  box-shadow:7px 7px 0 rgba(13,148,136,.12);
}
.kpi:hover,.stat:hover{transform:translateY(-2px)}
.kpi::after{
  content:"";
  position:absolute;
  right:-25px;
  top:-29px;
  width:88px;
  height:88px;
  border:1px solid rgba(13,148,136,.16);
  border-radius:50%;
}
.kpi .ico{
  position:relative;
  z-index:1;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#064E3B;
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:3px;
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.kpi .val,.stat .val{
  margin-top:2px;
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Crimson Pro",serif;
  font-size:14px;
  font-weight:600;
}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:8px;
  font-size:12px;
  font-weight:700;
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
table{
  width:100%;
  border-collapse:collapse;
  color:var(--ink);
  font-size:14px;
}
th{
  padding:12px 14px;
  color:#134E4A;
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:2px solid var(--color-primary);
  text-align:left;
  white-space:nowrap;
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
}
td{
  padding:12px 14px;
  border-bottom:1px solid #C9EAE5;
  white-space:nowrap;
}
tbody tr{transition:background-color .2s ease}
tbody tr:hover{background:var(--hov)}
tbody tr:last-child td{border-bottom:0}
td:first-child,.mono{
  font-family:"Cinzel","Courier New",monospace;
  font-size:12px;
  font-weight:600;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
td:nth-child(n+5){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#1E40AF;background:#DBEAFE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}
.bar{
  height:8px;
  min-width:58px;
  overflow:hidden;
  background:var(--track);
  border:1px solid #B8DCD7;
  border-radius:1px;
}
.bar>i{
  display:block;
  height:100%;
  background:var(--color-primary);
}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{
  width:38px;
  flex:none;
  color:var(--muted);
  text-align:right;
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;
  left:7px;
  top:5px;
  bottom:5px;
  width:1px;
  background:var(--color-primary);
}
.tl-item,.tl-i{position:relative;padding:0 0 19px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  left:-26px;
  top:3px;
  width:14px;
  height:14px;
  background:#FFFFFF;
  border:4px solid var(--color-primary);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{
  color:var(--muted);
  font-family:"Cinzel",monospace;
  font-size:10px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.tl-item b,.tl-i b{
  display:block;
  margin:2px 0;
  font-size:14px;
}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:13px}
.chk{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:43px;
  padding:9px 2px;
  border-bottom:1px dashed var(--line);
  font-size:14px;
}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:#9A6700}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:12px}
.note{
  margin-top:13px;
  padding-top:12px;
  color:var(--muted);
  border-top:1px dashed var(--line);
  font-size:12px;
}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:12px;
  background:var(--th);
  border:1px solid var(--line);
  border-radius:3px;
}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 3px 7px;
  font-size:14px;
  font-weight:700;
}
.col-h .cnt{
  min-width:26px;
  padding:2px 8px;
  color:var(--ink);
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:999px;
  text-align:center;
  font-family:"Cinzel",monospace;
  font-size:10px;
}
.pcard{
  padding:12px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:2px;
  box-shadow:3px 3px 0 rgba(13,148,136,.08);
  transition:transform .22s ease,border-color .22s ease;
}
.pcard:hover{transform:translateY(-2px);border-color:var(--color-primary)}
.pcard b{font-size:13px}
.pcard .meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}
.pcard .who,.who{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.pcard .who{margin-top:8px;color:var(--ink);font-size:12px}
.mini-av,.av{
  display:inline-grid;
  place-items:center;
  flex:none;
  color:#064E3B;
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:50%;
  font-weight:700;
}
.mini-av{width:20px;height:20px;font-size:10px}
.av{width:27px;height:27px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:13px 14px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:2px;
  transition:background-color .2s ease,transform .2s ease;
}
.lane-row:hover{background:var(--hov);transform:translateX(2px)}
.lane-row .num{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:none;
  color:#FFFFFF;
  background:var(--color-primary);
  border-radius:2px;
  font-family:"Cinzel",monospace;
  font-size:12px;
  font-weight:600;
}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:3px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{
  z-index:1;
  width:23px;
  height:23px;
  display:grid;
  place-items:center;
  color:#64748B;
  background:#FFFFFF;
  border:2px solid #94A3B8;
  border-radius:50%;
  font-family:"Cinzel",monospace;
  font-size:9px;
}
.steps .ln{width:18px;height:2px;background:#94A3B8}
.steps .s.done{
  color:#FFFFFF;
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.steps .s.cur{
  color:#064E3B;
  border-color:var(--color-primary);
  box-shadow:0 0 0 3px rgba(13,148,136,.15);
  animation:pulse 1.6s ease-in-out infinite;
}
.steps .ln.done{background:var(--color-primary)}
.rep-row{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  padding:13px 4px;
  border-bottom:1px dashed var(--line);
}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:12px}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;overflow:hidden;background:var(--track);border-radius:1px}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--muted);text-align:right;font-size:10px}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:2px}
.band .rng{position:absolute;inset-block:0;background:#99F6E4;border-radius:2px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--color-primary);border-radius:2px}
.tile{display:flex;flex-direction:column;gap:8px;padding:17px}
.tile .ti{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#064E3B;
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:3px;
}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:15px}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile .tv{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.48}}
@keyframes reveal{
  from{opacity:0;transform:translateY(14px) scale(.97)}
  to{opacity:1;transform:none}
}
#screen>.grid>*,
#screen>.card{
  animation:reveal .4s both cubic-bezier(.2,.75,.2,1.25);
}
#screen>.grid>*:nth-child(2),#screen>.card:nth-child(2){animation-delay:.06s}
#screen>.grid>*:nth-child(3),#screen>.card:nth-child(3){animation-delay:.12s}
#screen>.grid>*:nth-child(4),#screen>.card:nth-child(4){animation-delay:.18s}
@media(min-width:1140px){
  #screen{
    display:grid;
    grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);
    gap:17px;
    align-items:start;
  }
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}

function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})
}
function show(i){
  killCharts();
  var m=MODULES[i];
  document.getElementById("th-ico").textContent=m.icon;
  document.getElementById("th-title").textContent=m.name;
  document.getElementById("th-sub").textContent=m.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",active);
    if(active)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
  });
  RENDER[i](document.getElementById("screen"))
}
buildNav();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MODULES.length-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
