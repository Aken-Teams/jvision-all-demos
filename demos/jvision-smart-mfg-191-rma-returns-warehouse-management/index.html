<style>
:root{

--color-border:#a7f3d0;--color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#059669;

}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Nunito Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a{font:inherit}

button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:500;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:11px 18px;background:#064e3b;color:#fff;border-bottom:4px solid #000}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:44px;height:44px;display:grid;place-items:center;flex:none;background:var(--color-accent);color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000}
.logo span{font-size:26px}
.t1{font-family:"Rubik",sans-serif;font-size:15px;font-weight:900;line-height:1.15;white-space:nowrap}
.t2{margin-top:2px;color:#d1fae5;font:700 10px/1.2 "Rubik",sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;gap:5px;margin-left:auto;overflow-x:auto;padding:3px}
.nav button{display:flex;align-items:center;gap:6px;min-height:40px;padding:8px 11px;border:2px solid #a7f3d0;background:transparent;color:#ecfdf5;font-weight:800}
.nav button:hover{background:#d1fae5;color:#064e3b}
.nav button.active{background:var(--color-accent);color:#000;border-color:#000;box-shadow:3px 3px 0 #000}
.nav span{font-size:18px}
.wrap{width:min(1380px,100%);margin:auto;padding:28px 20px 64px}
.screen-head{position:relative;margin:0 0 22px;padding:22px 24px;background:#fff;border:3px solid #064e3b;box-shadow:var(--shadow);overflow:hidden}
.screen-head:after{content:"";position:absolute;right:-44px;top:-60px;width:190px;height:190px;background:#a7f3d0;border:3px solid #064e3b;transform:rotate(18deg)}
.screen-head>*{position:relative;z-index:1;max-width:900px}
.crumb{display:inline-flex;align-items:center;gap:7px;margin-bottom:9px;padding:5px 9px;background:#064e3b;color:#fff;font:800 12px "Rubik",sans-serif;text-transform:uppercase}
.crumb span{font-size:16px}
h1{margin:0 0 5px;font:900 clamp(25px,4vw,38px)/1.06 "Rubik",sans-serif;letter-spacing:-.04em}
.screen-head p{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.grid{display:grid;gap:16px}.g-kpi{grid-template-columns:repeat(4,1fr)}.g-2{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:repeat(3,1fr)}.g-32{grid-template-columns:2fr 1fr}.g-23{grid-template-columns:1fr 2fr}
.card{min-width:0;padding:17px;background:#fff;border:2px solid #064e3b;box-shadow:4px 4px 0 #a7f3d0}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line);font:900 15px "Rubik",sans-serif}
.card h3>.material-symbols-outlined{padding:4px;background:#064e3b;color:#fff;font-size:19px}
.sub{color:var(--muted);font:700 12px "Nunito Sans",sans-serif}
.kpi{position:relative;overflow:hidden;min-height:132px}
.kpi:after{content:"";position:absolute;right:-26px;bottom:-35px;width:98px;height:98px;background:#d1fae5;border:2px solid #064e3b;transform:rotate(25deg)}
.kpi:nth-child(2n):after{background:#ffedd5}
.kpi>*{position:relative;z-index:1}
.lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.lab span{font-size:18px;color:#064e3b}.val{margin-top:10px;font:900 31px/1 "Rubik",sans-serif;font-variant-numeric:tabular-nums}.val small{margin-left:4px;color:var(--muted);font-size:13px}
.delta{display:inline-flex;align-items:center;gap:3px;margin-top:8px;padding:3px 6px;border:1px solid currentColor;font-size:11px;font-weight:900}.delta span{font-size:14px}.up{color:var(--ok)}.down{color:var(--bad)}
.chart-box{overflow:hidden}
.tbl-wrap{overflow:auto;border:2px solid #064e3b}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:#064e3b;color:#fff;font:800 12px "Rubik",sans-serif;letter-spacing:.02em}
tbody tr:nth-child(even){background:#f0fdfa}tbody tr:hover{background:#ffedd5}
td.num{text-align:right;font-family:"Rubik",monospace;font-weight:800;font-variant-numeric:tabular-nums}
td:first-child b,td:nth-child(2),td:nth-child(4),.id,.code,.tt{font-family:"Rubik",monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border:1px solid currentColor;font-size:11px;font-weight:900}.tag span{font-size:14px}
.t-ok{background:#d1fae5;color:#065f46}.t-warn{background:#ffedd5;color:#9a3412}.t-bad{background:#fee2e2;color:#991b1b}.t-info{background:#dbeafe;color:#1e40af}.t-mut{background:#e8f1f3;color:#334155}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-width:940px}
.col{display:flex;flex-direction:column;gap:9px;min-width:0;padding:10px;background:#e8f1f3;border:2px solid #064e3b}
.col:nth-child(even){transform:translateY(8px)}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 2px 9px;border-bottom:3px solid #064e3b;font:900 12px "Rubik",sans-serif}
.cnt{padding:2px 7px;background:#fff;border:2px solid #064e3b;font-size:11px}.dot{display:inline-block;width:9px;height:9px;margin-right:6px;border:1px solid #000}
.ticket{padding:10px;background:#fff;border:2px solid #064e3b;border-left:7px solid var(--color-primary);box-shadow:3px 3px 0 #a7f3d0}
.ticket:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #064e3b}
.ticket .id{color:#047857;font-size:11px;font-weight:900}.ticket .nm{margin:4px 0;font-size:13px;font-weight:900}.ticket .mt{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:7px;color:var(--muted);font-size:11px;font-weight:700}
.av{display:grid;place-items:center;width:25px;height:25px;background:#064e3b;color:#fff;border:1px solid #000;font-weight:900}
.scanbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:20px;background:#064e3b;color:#fff;border:3px solid #000;box-shadow:7px 7px 0 var(--color-accent)}
.scanbox .icn{display:grid;place-items:center;width:58px;height:58px;flex:none;background:var(--color-accent);color:#000;border:3px solid #000}.scanbox .icn span{font-size:33px}.scanbox .code{font-size:20px;font-weight:900}.scanbox .meta{margin-top:4px;color:#d1fae5;font-size:12px;font-weight:700}.scanbox .ok{display:flex;align-items:center;gap:6px;margin-left:auto;padding:9px 12px;background:#d1fae5;color:#064e3b;border:2px solid #000;font-size:12px;font-weight:900}
.list-clean{margin:0;padding:0;list-style:none}.list-clean li{display:flex;gap:10px;padding:11px 0;border-bottom:2px solid var(--line);font-size:13px}.list-clean li:last-child{border:0}.list-clean li>span{flex:none;color:#047857;font-size:20px}
.note{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;background:#ffedd5;color:#7c2d12;border:2px solid #c2410c;font-size:12px;font-weight:700}.note>span{flex:none;font-size:19px}
.rowline{display:flex;align-items:center;gap:10px;margin-bottom:12px}.rl-l{flex:0 0 84px;font-size:12px;font-weight:800}.rl-b{flex:1}.rl-v{min-width:38px;text-align:right;color:var(--muted);font:800 12px "Rubik",monospace}.bar{height:11px;background:#e8f1f3;border:1px solid #064e3b}.bar i{display:block;height:100%}
.tl{position:relative;padding-left:25px}.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:5px;width:3px;background:#064e3b}.tl-item{position:relative;padding:0 0 17px 5px}.tl-item:before{content:"";position:absolute;left:-22px;top:2px;width:13px;height:13px;background:var(--color-accent);border:2px solid #000}.tt{color:var(--muted);font-size:11px;font-weight:800}.th{margin:2px 0;font-weight:900}.td{color:var(--muted);font-size:12px}
.donut-legend{display:flex;flex-direction:column;gap:8px}.donut-legend .li{display:flex;align-items:center;gap:8px;font-size:12px}.sw{width:11px;height:11px;border:1px solid #000}.donut-legend .nm{flex:1}.vv{font:900 12px "Rubik",monospace}
.footer{max-width:1380px;margin:auto;padding:20px;border-top:2px solid var(--line);color:var(--muted);text-align:center;font-size:11px;font-weight:700}
@media(max-width:1000px){.g-kpi{grid-template-columns:1fr 1fr}.g-32,.g-23{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-wrap:wrap}.nav{width:100%;margin:0}}
@media(max-width:760px){.g-2,.g-3{grid-template-columns:1fr}.wrap{padding:20px 12px 50px}.screen-head{padding:18px}.screen-head:after{opacity:.45}.col:nth-child(even){transform:none}}
@media(max-width:480px){.g-kpi{grid-template-columns:1fr}.nav .lbl{display:none}.nav{justify-content:space-between}.nav button{justify-content:center;flex:1;padding:8px}.scanbox .ok{width:100%;margin:0}.t2{display:none}}
@media(prefers-reduced-motion:no-preference){.screen-head,.card,.scanbox{animation:reveal .36s ease-out both}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.nav button,.ticket,tbody tr{transition:background-color .18s,color .18s,transform .18s,box-shadow .18s}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++)try{charts[i].destroy()}catch(e){}charts=[]}
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var NAV=[
{ic:"request_quote",nm:"RMA 受理"},{ic:"inventory_2",nm:"收料掃碼"},{ic:"fact_check",nm:"品質判定"},
{ic:"account_tree",nm:"分類處置"},{ic:"receipt_long",nm:"帳務沖銷"},{ic:"insights",nm:"原因分析"}];
function head(cr,h1,p){return'<div class="screen-head"><div class="crumb"><span class="material-symbols-outlined">'+cr.ic+"</span>"+cr.nm+" · Module 0"+(cr.i+1)+"</div><h1>"+h1+"</h1><p>"+p+"</p></div>"}
function kpi(lab,ic,val,unit,delta,dir){return'<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+"</span>"+lab+'</div><div class="val">'+val+(unit?"<small>"+unit+"</small>":"")+"</div>"+(delta?'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":"trending_down")+"</span>"+delta+"</div>":"")+"</div>"}
function tagOf(kind,txt,ic){return'<span class="tag '+kind+'">'+(ic?'<span class="material-symbols-outlined">'+ic+"</span>":"")+txt+"</span>"}
function barRow(lab,v,col){return'<div class="rowline"><div class="rl-l">'+lab+'</div><div class="rl-b"><div class="bar"><i style="width:'+v+"%;background:"+col+'"></i></div></div><div class="rl-v">'+v+"%</div></div>"}
function tl(t,h,d){return'<div class="tl-item"><div class="tt">'+t+'</div><div class="th">'+h+'</div><div class="td">'+d+"</div></div>"}
function chart(id,opt){var c=new ApexCharts(el(id),opt);c.render();charts.push(c)}
function baseChart(type,height){return{chart:{type:type,height:height,toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},dataLabels:{enabled:false},grid:{borderColor:"#a7f3d0"},stroke:{width:3},tooltip:{intersect:false}}}

function s0(){

var colors={"申請待審":"#f59e0b","保固比對":"#2563eb","核發授權":"#dc2626","待寄回":"#ea580c","已收貨":"#059669"},cols="";

}

function s1(){
