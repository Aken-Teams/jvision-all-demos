<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>退貨管理系統（RMA/Returns Warehouse Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316; --bg:#f5f5f4; --card:#ffffff;
  --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --soft:#fafaf9;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}
.topbar{
  position:sticky; top:0; z-index:50; background:#1c1917; color:#fff;
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto;
}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff;}
.brand .t1{font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap;}
.brand .t2{font-size:11px;color:#a8a29e;white-space:nowrap;}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:6px;border:0;cursor:pointer;
  background:rgba(255,255,255,.06); color:#d6d3d1; padding:8px 12px;
  border-radius:9px; font-family:inherit; font-size:13px; font-weight:600;
  transition:.15s; min-width:0;
}
.nav button .material-symbols-outlined{font-size:18px;}
.nav button:hover{background:rgba(255,255,255,.14);color:#fff;}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px;}
.screen-head{margin-bottom:18px;}
.screen-head h1{font-size:22px;font-weight:800;margin:0 0 4px;}
.screen-head p{margin:0;color:var(--muted);font-size:13.5px;}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px;}
.crumb .material-symbols-outlined{font-size:16px;}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-32{grid-template-columns:2fr 1fr;}
.g-23{grid-template-columns:1fr 2fr;}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr;}
  .g-2,.g-3,.g-32,.g-23{grid-template-columns:1fr;}
}
@media(max-width:480px){ .g-kpi{grid-template-columns:1fr;} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:12px;color:var(--muted);font-weight:500;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:12px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta.up{color:var(--ok);} .kpi .delta.down{color:var(--bad);}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));opacity:.08;}
.chart-box{overflow:hidden;min-width:0;}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--soft);font-weight:700;color:var(--muted);font-size:12px;position:sticky;top:0;}
tbody tr:hover{background:#fff7ed;}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#dbeafe;color:#1d4ed8;}
.t-mut{background:#f5f5f4;color:#57534e;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
@media(max-width:1100px){.board{grid-template-columns:repeat(3,1fr);}}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:9px;}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;padding:4px 4px 8px;border-bottom:2px solid var(--line);gap:6px;}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);flex:0 0 auto;}
.col-h .dot{width:8px;height:8px;border-radius:50%;margin-right:6px;display:inline-block;}
.ticket{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:.12s;border-left:3px solid var(--accent);}
.ticket:hover{box-shadow:0 3px 10px rgba(0,0,0,.08);transform:translateY(-1px);}
.ticket .id{font-size:11px;color:var(--accent);font-weight:800;}
.ticket .nm{font-size:13px;font-weight:700;margin:3px 0;}
.ticket .mt{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px;}
.ticket .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;}
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 4px;}
.tl-item::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line);}
.tl-item .tt{font-size:12px;color:var(--muted);font-weight:600;}
.tl-item .th{font-size:13.5px;font-weight:700;margin:2px 0;}
.tl-item .td{font-size:12.5px;color:var(--muted);}
.bar{background:var(--soft);border-radius:999px;height:8px;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.rowline{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.rowline .rl-l{font-size:12.5px;font-weight:600;flex:0 0 84px;min-width:0;}
.rowline .rl-b{flex:1;min-width:0;}
.rowline .rl-v{font-size:12px;font-weight:700;flex:0 0 auto;color:var(--muted);}
.pill-row{display:flex;flex-wrap:wrap;gap:7px;}
.list-clean{list-style:none;margin:0;padding:0;}
.list-clean li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.list-clean li:last-child{border-bottom:0;}
.list-clean li .material-symbols-outlined{font-size:19px;color:var(--accent);flex:0 0 auto;margin-top:1px;}
.scanbox{background:linear-gradient(135deg,#1c1917,#292524);border-radius:14px;padding:18px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.scanbox .icn{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:0 0 auto;}
.scanbox .icn .material-symbols-outlined{font-size:32px;}
.scanbox .code{font-size:20px;font-weight:800;letter-spacing:.5px;}
.scanbox .meta{font-size:12.5px;color:#d6d3d1;margin-top:3px;}
.scanbox .ok{margin-left:auto;background:rgba(22,163,74,.2);color:#4ade80;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;}
.donut-legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.donut-legend .li .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.donut-legend .li .nm{flex:1;min-width:0;}
.donut-legend .li .vv{font-weight:700;}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#9a3412;display:flex;gap:9px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:19px;color:var(--accent2);flex:0 0 auto;}
.footer{max-width:1360px;margin:0 auto;padding:18px;color:var(--muted);font-size:12px;text-align:center;}
@media(max-width:560px){ .nav button .lbl{display:none;} .nav button{padding:8px;} }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">assignment_return</span></div>
    <div>
      <div class="t1">RMA 退貨倉儲管理</div>
      <div class="t2">Returns Warehouse Management</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>
<div class="wrap"><div id="app"></div></div>
<div class="footer">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-191-rma-returns-warehouse-management/</div>

<script>
"use strict";
var charts=[];
function clearCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

var NAV=[
  {ic:"request_quote", nm:"RMA 受理"},
  {ic:"inventory_2",   nm:"收料掃碼"},
  {ic:"fact_check",    nm:"品質判定"},
  {ic:"account_tree",  nm:"分類處置"},
  {ic:"receipt_long",  nm:"帳務沖銷"},
  {ic:"insights",      nm:"原因分析"}
];

function head(cr,h1,p){
  return '<div class="screen-head"><div class="crumb"><span class="material-symbols-outlined">'+cr.ic+'</span>'+cr.nm+' · Module 0'+(cr.i+1)+'</div>'+
         '<h1>'+h1+'</h1><p>'+p+'</p></div>';
}
function kpi(lab,ic,val,unit,delta,dir){
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    (delta?'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div>':'')+'</div>';
}
function tagOf(kind,txt,ic){ return '<span class="tag '+kind+'">'+(ic?'<span class="material-symbols-outlined">'+ic+'</span>':'')+txt+'</span>'; }
function barRow(lab,v,col){
  return '<div class="rowline"><div class="rl-l">'+lab+'</div><div class="rl-b"><div class="bar"><i style="width:'+v+'%;background:'+col+'"></i></div></div><div class="rl-v">'+v+'%</div></div>';
}
function tl(t,h,d){ return '<div class="tl-item"><div class="tt">'+t+'</div><div class="th">'+h+'</div><div class="td">'+d+'</div></div>'; }

/* ===== SCREEN 0 : RMA 受理（KANBAN 招牌畫面） ===== */
function s0(){
  var kanban={
    "申請待審":[
      {id:"RMA-24081",nm:"無線耳機 X3 · 功能異常",cust:"O信 3C",who:"李",qty:2},
      {id:"RMA-24082",nm:"智慧手錶 S2 · 七天鑑賞",cust:"樂購網",who:"陳",qty:1},
      {id:"RMA-24083",nm:"藍牙喇叭 B1 · 外觀刮傷",cust:"O和商行",who:"林",qty:4}
    ],
    "保固比對":[
      {id:"RMA-24078",nm:"行動電源 P5 · 無法充電",cust:"O通量販",who:"王",qty:3},
      {id:"RMA-24079",nm:"USB 集線器 · 接觸不良",cust:"O信 3C",who:"李",qty:6}
    ],
    "核發授權":[
      {id:"RMA-24074",nm:"機械鍵盤 K7 · 按鍵失靈",cust:"電商倉配",who:"張",qty:1},
      {id:"RMA-24075",nm:"顯示器 M27 · 亮點瑕疵",cust:"樂購網",who:"陳",qty:1}
    ],
    "待寄回":[
      {id:"RMA-24070",nm:"路由器 R6 · 頻繁斷線",cust:"O和商行",who:"林",qty:2},
      {id:"RMA-24071",nm:"webcam C2 · 對焦異常",cust:"O通量販",who:"王",qty:5}
    ],
    "已收貨":[
      {id:"RMA-24065",nm:"滑鼠 G3 · 滾輪失效",cust:"電商倉配",who:"張",qty:8},
      {id:"RMA-24066",nm:"充電線 L1 · 破損",cust:"O信 3C",who:"李",qty:12}
    ]
  };
  var dots={"申請待審":"#f59e0b","保固比對":"#2563eb","核發授權":"#dc2626","待寄回":"#f97316","已收貨":"#16a34a"};
  var cols="";
  for(var k in kanban){
    var arr=kanban[k], tks="";
    for(var i=0;i<arr.length;i++){ var t=arr[i];
      tks+='<div class="ticket"><div class="id">'+t.id+'</div><div class="nm">'+esc(t.nm)+'</div>'+
        '<div class="mt"><span>'+esc(t.cust)+'</span><span>×'+t.qty+'</span></div>'+
        '<div class="mt"><span class="tag t-mut">受理</span><span class="av">'+t.who+'</span></div></div>';
    }
    cols+='<div class="col"><div class="col-h"><span><span class="dot" style="background:'+dots[k]+'"></span>'+k+'</span><span class="cnt">'+arr.length+'</span></div>'+tks+'</div>';
  }
  var html=head({ic:"request_quote",nm:"RMA 申請受理",i:0},
    "RMA 退貨授權看板","依訂單與保固比對受理退貨，核發 RMA 編號與退貨標籤，登錄退貨原因。");
  html+='<div class="grid g-kpi" style="margin-bottom:14px">'+
    kpi("今日新增申請","request_quote","38","件","+9 件 vs 昨日","up")+
    kpi("待審核件數","pending_actions","11","件","-4 件","up")+
    kpi("平均受理時效","schedule","1.4","小時","-0.6h","up")+
    kpi("保固內占比","verified","62","%","+5%","up")+
  '</div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>退貨案件流轉看板<span class="sub" style="margin-left:auto">狀態管理 · 即時更新</span></h3>'+
    '<div style="overflow-x:auto"><div class="board">'+cols+'</div></div></div>';
  html+='<div class="grid g-2" style="margin-top:14px">'+
    '<div class="card chart-box"><h3><span class="material-symbols-outlined">bar_chart</span>近 7 日退貨原因分布</h3><div id="c0a"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">rule</span>受理規則檢核</h3><ul class="list-clean">'+
      '<li><span class="material-symbols-outlined">check_circle</span><div><b>保固期比對</b>：訂單出貨日 + 保固天數，逾期自動轉付費維修。</div></li>'+
      '<li><span class="material-symbols-outlined">check_circle</span><div><b>七天鑑賞期</b>：簽收 7 日內無理由退貨，商品需完整未使用。</div></li>'+
      '<li><span class="material-symbols-outlined">check_circle</span><div><b>序號綁定</b>：核發前比對出貨序號，防止跨單掉包。</div></li>'+
      '<li><span class="material-symbols-outlined">check_circle</span><div><b>退貨標籤</b>：授權後自動產生物流退貨面單與 RMA 條碼。</div></li>'+
    '</ul></div>'+
  '</div>';
  el("app").innerHTML=html;
  void el("app").offsetHeight;
  var c=new ApexCharts(el("c0a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:270,toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[{name:"件數",data:[42,31,27,19,14,9]}],
    xaxis:{categories:["功能異常","七天鑑賞","外觀瑕疵","規格不符","缺件","運送損壞"],labels:{style:{fontSize:"11px"}}},
    plotOptions:{bar:{borderRadius:5,columnWidth:"52%",distributed:true}},
    colors:["#dc2626","#f97316","#f59e0b","#2563eb","#16a34a","#78716c"],
    legend:{show:false},dataLabels:{enabled:true},grid:{borderColor:"#eee"},
    tooltip:{intersect:false,shared:false}
  });
  c.render(); charts.push(c);
}

/* ===== SCREEN 1 : 收料掃碼 ===== */
function s1(){
  var rows=[
    {id:"RMA-24070",sku:"RTR-R6",nm:"路由器 R6",sn:"SN-R6-88210",qty:2,rcv:2,st:"ok",loc:"暫存-A01"},
    {id:"RMA-24071",sku:"CAM-C2",nm:"webcam C2",sn:"SN-C2-40551",qty:5,rcv:5,st:"ok",loc:"暫存-A02"},
    {id:"RMA-24065",sku:"MOU-G3",nm:"滑鼠 G3",sn:"SN-G3-71203",qty:8,rcv:7,st:"short",loc:"暫存-A03"},
    {id:"RMA-24066",sku:"CAB-L1",nm:"充電線 L1",sn:"SN-L1-19087",qty:12,rcv:12,st:"ok",loc:"暫存-A04"},
    {id:"RMA-24061",sku:"SPK-B1",nm:"藍牙喇叭 B1",sn:"SN-B1-33418",qty:4,rcv:4,st:"mismatch",loc:"異常區-X1"},
    {id:"RMA-24058",sku:"PWR-P5",nm:"行動電源 P5",sn:"SN-P5-60922",qty:3,rcv:3,st:"ok",loc:"暫存-A05"}
  ];
  function stTag(s){ if(s==="ok")return tagOf("t-ok","數量相符","check_circle");
    if(s==="short")return tagOf("t-warn","短收","report");
    return tagOf("t-bad","序號不符","cancel"); }
  var trs="";
  for(var i=0;i<rows.length;i++){ var r=rows[i];
    trs+='<tr><td><b>'+r.id+'</b></td><td>'+r.sku+'</td><td>'+esc(r.nm)+'</td><td>'+r.sn+'</td>'+
      '<td class="num">'+r.qty+'</td><td class="num">'+r.rcv+'</td><td>'+stTag(r.st)+'</td><td>'+r.loc+'</td></tr>';
  }
  var html=head({ic:"inventory_2",nm:"退貨收料掃碼",i:1},
    "退貨到貨收料工作台","退貨到貨後掃碼點收、序號比對與數量核對，異常件即時攔截入暫存區。");
  html+='<div class="scanbox" style="margin-bottom:14px"><div class="icn"><span class="material-symbols-outlined">barcode_scanner</span></div>'+
    '<div><div class="code">RMA-24071 · SN-C2-40551</div><div class="meta">webcam C2 · 樂購網 · 掃碼時間 09:42:17 · 站點 收料台-2</div></div>'+
    '<div class="ok"><span class="material-symbols-outlined">task_alt</span>比對通過 · 已入暫存 A02</div></div>';

    dataLabels:{enabled:false},grid:{borderColor:"#eee"}
  });
  c3.render(); charts.push(c3);
}

/* ===== router ===== */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].nm+'</span></button>';
  }
  el("nav").innerHTML=h;
  var btns=el("nav").querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ location.hash="v"+this.getAttribute("data-i"); });
  }
}
function show(i){
  clearCharts();
  var btns=el("nav").querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i); }
  SCREENS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
<script src="/shared/jv-agent-bridge.js?v=2" defer></script>
