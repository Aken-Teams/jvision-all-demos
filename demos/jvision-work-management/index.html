<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作協作管理 · Jvision 團隊協作平台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-soft:rgba(22,163,74,.12);
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f1c17; --muted:#5c6b64;
  --line:#e3ebe7; --side:#10231b; --side2:#173428; --side-ink:#c9e8d8;
  --warn:#e0851f; --danger:#dc2626; --info:#2563eb;
  --radius:16px; --shadow:0 6px 24px rgba(15,40,28,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
/* ===== Sidebar ===== */
.side{
  width:250px; min-width:250px; background:linear-gradient(180deg,var(--side),var(--side2));
  color:var(--side-ink); display:flex; flex-direction:column; padding:22px 16px;
  position:sticky; top:0; height:100vh; gap:6px;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
.brand .logo{
  width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#04140c;flex:0 0 auto;
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{color:#fff;font-size:16px;font-weight:800;display:block;line-height:1.3}
.brand span{font-size:11px;color:#7fbf9f;letter-spacing:.05em}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
  background:transparent;border:0;color:var(--side-ink);cursor:pointer;width:100%;
  font-family:inherit;font-size:14px;font-weight:600;text-align:left;transition:.15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn small{display:block;font-size:11px;font-weight:400;color:#6ba585;margin-top:1px}
.navbtn:hover{background:rgba(255,255,255,.06)}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#12833c);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.4)}
.navbtn.on small{color:#d6f5e3}
.navtxt{min-width:0;overflow:hidden}
.side-foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#5f9077;border-top:1px solid rgba(255,255,255,.08)}
/* ===== Main ===== */
.main{flex:1;min-width:0;padding:26px 30px 44px;max-width:1400px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.pill .material-symbols-outlined{font-size:16px}
/* grids */
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.col-2-1{grid-template-columns:2fr 1fr}
.col-1-2{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700}
.card .desc{color:var(--muted);font-size:12px;margin:0 0 14px}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:29px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .delta{font-size:12px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--accent)} .down{color:var(--danger)}
.kico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;float:right}
.kico .material-symbols-outlined{font-size:21px}
.chartwrap{position:relative;height:280px;width:100%;overflow:hidden}
.chartwrap.sm{height:220px}
.chartwrap.lg{height:320px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap}
.t-green{background:var(--accent-soft);color:var(--accent)}
.t-amber{background:rgba(224,133,31,.13);color:var(--warn)}
.t-red{background:rgba(220,38,38,.11);color:var(--danger)}
.t-blue{background:rgba(37,99,235,.11);color:var(--info)}
.t-gray{background:#eef2f0;color:var(--muted)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:0 0 auto}
.bar{height:7px;border-radius:5px;background:#eef2f0;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* kanban */
.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:720px}
.kcol{background:#f6faf8;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}
.kcol-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:11px;padding:0 2px}
.kcount{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 9px;color:var(--muted)}
.ktask{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;box-shadow:0 2px 6px rgba(15,40,28,.04)}
.ktask .kt-t{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4}
.ktask .kt-m{display:flex;align-items:center;justify-content:space-between}
.prio{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
/* gantt */
.gantt{display:flex;flex-direction:column;gap:10px;min-width:640px}
.grow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.gtrack{position:relative;height:30px;background:#f6faf8;border-radius:8px;border:1px solid var(--line)}
.gbar{position:absolute;top:5px;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap}
.gbar.b2{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.gbar.b3{background:linear-gradient(90deg,#e0851f,#fbbf24)}
.gmile{position:absolute;top:2px;width:26px;height:26px;transform:rotate(45deg);background:#fff;border:2px solid var(--accent);border-radius:5px}
.gname{font-size:12.5px;font-weight:600;text-align:right;color:var(--ink)}
.gname small{display:block;color:var(--muted);font-weight:400;font-size:11px}
/* doc list */
.doc{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.dico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.doc .d-t{font-weight:600;font-size:13.5px}
.doc .d-m{font-size:11.5px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;background:#eef2f0;color:var(--muted);padding:3px 9px;border-radius:7px;font-weight:600}
.chip.on{background:var(--accent-soft);color:var(--accent)}
/* automation flow */
.flowline{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.fstep{flex:1;min-width:150px;background:#f6faf8;border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.fstep+.fstep{margin-left:26px}
.fstep+.fstep::before{content:"arrow_forward";font-family:'Material Symbols Outlined';position:absolute;left:-24px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:22px}
.fstep .fs-i{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.fstep .fs-t{font-size:13px;font-weight:700}
.fstep .fs-d{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.rule{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#fff}
.rule .r-when{font-size:12px;font-weight:600}
.rule .r-then{font-size:11.5px;color:var(--muted);margin-top:2px}
.toggle{width:40px;height:22px;border-radius:999px;background:var(--accent);position:relative;flex:0 0 auto}
.toggle.off{background:#cfd8d4}
.toggle::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;right:3px}
.toggle.off::after{right:auto;left:3px}
/* workload */
.wl{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:0}
.wl .wl-n{font-weight:600;font-size:13.5px}
.wl .wl-r{font-size:11.5px;color:var(--muted)}
.wl-bar{flex:1;min-width:80px}
.mono{font-variant-numeric:tabular-nums}
@media(max-width:860px){
  body{flex-direction:column}
  .side{width:100%;min-width:0;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:8px}
  .brand{padding:0 12px 0 0}
  .side-foot{display:none}
  .navbtn{width:auto;flex:0 0 auto;padding:9px 12px}
  .navbtn small{display:none}
  .main{padding:20px 18px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.col-2-1,.col-1-2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .navtxt{display:none}
  .navbtn{padding:9px 11px}
  .top h1{font-size:20px}
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">hub</span></div>
    <div><b>Jvision 協作</b><span>WORK MANAGEMENT</span></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">工作協作管理 · 純前端展示<br/>資料為模擬示意，非真實營運數據</div>
</aside>
<main class="main">
  <div class="top">
    <div>
      <h1 id="scr-title">任務看板</h1>
      <div class="sub" id="scr-sub"></div>
    </div>
    <span class="pill"><span class="material-symbols-outlined">bolt</span> 即時協作平台</span>
  </div>
  <div id="view"></div>
</main>

<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"任務看板",sub:"以看板欄位管理任務指派、狀態流轉與逾期提醒"},
  {icon:"account_tree",name:"專案里程碑",sub:"專案時程、里程碑與相依關係的甘特追蹤"},
  {icon:"description",name:"知識文件庫",sub:"文件版本、標籤與全文檢索的團隊知識中心"},
  {icon:"bolt",name:"流程自動化",sub:"表單簽核與觸發規則的自動化流程引擎"},
  {icon:"groups",name:"工作負荷",sub:"成員產能、負載分配與衝突排解檢視"},
  {icon:"insights",name:"團隊報表",sub:"準時率、產能與趨勢的營運分析報表"}
];
var COLORS=["#16a34a","#2563eb","#e0851f","#7c3aed","#dc2626","#0891b2"];
function av(nm,idx){return '<span class="avatar" style="background:'+COLORS[idx%COLORS.length]+'">'+nm.slice(0,1)+'</span>';}

var nav=document.getElementById("nav");
nav.innerHTML=MODS.map(function(m,i){
  return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span>'+
    '<span class="navtxt">'+m.name+'<small>'+m.sub.slice(0,10)+'</small></span></button>';
}).join("");
nav.addEventListener("click",function(e){
  var b=e.target.closest(".navbtn"); if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});

var _charts=[];
function killCharts(){for(var i=0;i<_charts.length;i++){try{_charts[i].destroy();}catch(e){}}_charts=[];}
function mk(id,cfg){
  var el=document.getElementById(id); if(!el)return;
  var c=new Chart(el.getContext("2d"),cfg); _charts.push(c);
}
var GRID={color:"#e6efeb"};
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:12},color:"#5c6b64",usePointStyle:true,boxWidth:8}}},
    scales:{x:{grid:{display:false},ticks:{color:"#5c6b64",font:{size:11}}},y:{grid:GRID,ticks:{color:"#5c6b64",font:{size:11}}}}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}
function kpi(icon,lab,val,delta,dir,note,tone){
  var toneCol=tone==="warn"?"var(--warn)":"var(--accent)";
  var toneBg=tone==="warn"?"rgba(224,133,31,.13)":"var(--accent-soft)";
  var d="";
  if(delta){d='<div class="delta '+(dir==="down"?"down":"up")+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dir==="down"?"arrow_downward":"arrow_upward")+'</span>'+delta+'</div>';}
  return '<div class="card kpi"><div class="kico" style="background:'+toneBg+';color:'+toneCol+'"><span class="material-symbols-outlined">'+icon+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+'</div>'+d+
    '<div style="font-size:11.5px;color:var(--muted);margin-top:'+(delta?"4px":"8px")+'">'+(note||"")+'</div></div>';
}

/* ================= SCREENS ================= */
function v0(){
  var cols=[
    {t:"待處理",n:5,items:[["改版官網首頁 RWD","王","高","#dc2626"],["匯出 Q3 客戶名單","陳","中","#e0851f"],["盤點雲端授權","林","低","#16a34a"]]},
    {t:"進行中",n:4,items:[["整合金流 API","張","高","#dc2626"],["撰寫上線測試計畫","李","中","#e0851f"]]},
    {t:"待審核",n:3,items:[["行銷素材定稿","周","中","#e0851f"],["合約條款複核","黃","高","#dc2626"]]},
    {t:"已完成",n:6,items:[["新版 Logo 交付","吳","低","#16a34a"],["會議室設備採購","蔡","低","#16a34a"]]}
  ];
  var kcards=cols.map(function(c,ci){
    var items=c.items.map(function(t){
      return '<div class="ktask"><div class="kt-t">'+t[0]+'</div><div class="kt-m">'+
        '<span class="prio" style="background:'+t[3]+'22;color:'+t[3]+'">'+t[2]+'優先</span>'+av(t[1],ci)+'</div></div>';
    }).join("");
    return '<div class="kcol"><div class="kcol-h"><span>'+c.t+'</span><span class="kcount">'+c.n+'</span></div>'+items+'</div>';
  }).join("");
  return ''+
  '<div class="grid g4">'+
    kpi("dashboard","進行中任務","24","+3","up","本週")+
    kpi("task_alt","本週完成","18","+22%","up","對比上週")+
    kpi("warning","逾期任務","5","-2","up","已改善","warn")+
    kpi("groups","參與成員","12","","","跨 4 部門")+
  '</div>'+
  '<div class="grid col-2-1" style="margin-top:16px">'+
    '<div class="card"><h3>看板總覽</h3><p class="desc">拖曳式任務欄位，狀態流轉一目了然</p>'+
      '<div style="overflow-x:auto"><div class="kbd">'+kcards+'</div></div></div>'+
    '<div class="card"><h3>任務狀態分布</h3><p class="desc">依目前欄位統計</p>'+
      '<div class="chartwrap sm"><canvas id="c0a"></canvas></div></div>'+
  '</div>';
}
function v0charts(){
  mk("c0a",{type:"doughnut",data:{labels:["待處理","進行中","待審核","已完成"],
    datasets:[{data:[5,4,3,6],backgroundColor:["#94a3a0","#2563eb","#e0851f","#16a34a"],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{font:{family:"Inter",size:12},color:"#5c6b64",usePointStyle:true,boxWidth:8,padding:14}}}}});
}

function v1(){
  var rows=[
    {n:"需求訪談",r:"專案專員",l:6,w:16,c:""},
    {n:"系統設計",r:"架構師",l:18,w:20,c:"b2"},
    {n:"前端開發",r:"開發團隊",l:32,w:30,c:""},
    {n:"金流整合",r:"開發團隊",l:44,w:22,c:"b3"},
    {n:"整合測試",r:"QA 團隊",l:62,w:20,c:"b2"},
    {n:"上線部署",r:"維運",l:80,w:14,c:""}
  ];
  var miles=[{l:16,t:"需求凍結"},{l:62,t:"功能封版"},{l:94,t:"正式上線"}];
  var g=rows.map(function(x){
    return '<div class="grow"><div class="gname">'+x.n+'<small>'+x.r+'</small></div>'+
      '<div class="gtrack"><div class="gbar '+x.c+'" style="left:'+x.l+'%;width:'+x.w+'%">'+x.w+'%</div></div></div>';
  }).join("");
  var mrow='<div class="grow"><div class="gname">里程碑</div><div class="gtrack" style="background:transparent;border:0">'+
    miles.map(function(m){return '<div class="gmile" title="'+m.t+'" style="left:'+m.l+'%"></div>';}).join("")+'</div></div>';
  return ''+
  '<div class="grid g4">'+
    kpi("account_tree","進行中專案","6","+1","up","本季")+
    kpi("flag","本月里程碑","9","","","3 已達成")+
    kpi("schedule","平均進度","68","+12","up","%")+
    kpi("warning","相依阻塞","2","","","需協調","warn")+
  '</div>'+
  '<div class="card" style="margin-top:16px"><h3>官網改版專案 · 甘特時程</h3><p class="desc">任務時程、里程碑與相依關係追蹤</p>'+
    '<div style="overflow-x:auto"><div class="gantt">'+g+mrow+'</div></div></div>'+
  '<div class="grid col-1-2" style="margin-top:16px">'+
    '<div class="card"><h3>里程碑達成率</h3><p class="desc">近 6 個月</p><div class="chartwrap sm"><canvas id="c1a"></canvas></div></div>'+
    '<div class="card"><h3>各專案進度 vs 目標</h3><p class="desc">實際完成百分比對目標</p><div class="chartwrap sm"><canvas id="c1b"></canvas></div></div>'+
  '</div>';
}
function v1charts(){
  mk("c1a",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],
    datasets:[{label:"達成率 %",data:[62,70,66,78,83,89],borderColor:"#16a34a",backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.4,pointRadius:3,pointBackgroundColor:"#16a34a"}]},
    options:baseOpts({scales:{x:{grid:{display:false},ticks:{color:"#5c6b64"}},y:{grid:GRID,ticks:{color:"#5c6b64"},min:40,max:100}}})});
  mk("c1b",{type:"bar",data:{labels:["官網改版","App 2.0","CRM 導入","資安稽核","報表中台"],
    datasets:[
      {label:"實際 %",data:[68,54,82,40,73],backgroundColor:"#16a34a",borderRadius:6,barPercentage:.6},
      {label:"目標 %",data:[75,60,80,55,70],backgroundColor:"#cfe8d8",borderRadius:6,barPercentage:.6}
    ]},options:baseOpts()});
}

function v2(){
  var docs=[

function v4(){

    {n:"陳怡君",r:"專案專員",cap:8,max:10},

    {n:"李美玲",r:"QA 測試",cap:6,max:10},
    {n:"周家豪",r:"視覺設計",cap:9,max:10},
    {n:"黃淑芬",r:"法務專員",cap:4,max:10}
  ];
  var rows=mem.map(function(m,i){
    var pct=Math.round(m.cap/m.max*100);

    var fill=over?"linear-gradient(90deg,#dc2626,#f87171)":(pct>85?"linear-gradient(90deg,#e0851f,#fbbf24)":"linear-gradient(90deg,#16a34a,#4ade80)");
    return '<div class="wl">'+av(m.n,i)+

      '<div class="wl-bar"><div class="bar" style="height:9px"><i style="width:'+Math.min(pct,100)+'%;background:'+fill+'"></i></div></div>'+
      '<div style="width:96px;text-align:right"><span class="mono" style="font-weight:700">'+m.cap+'</span><span style="color:var(--muted)">/'+m.max+' 任務</span></div>'+

  '<div class="grid g4">'+
    kpi("groups","團隊成員","6","","","2 部門")+
    kpi("balance","平均負載","83","+5","down","%","warn")+
    kpi("priority_high","過載成員","1","","","需重分配","warn")+

  '</div>'+

    '<div class="card"><h3>負載分布雷達</h3><p class="desc">各成員相對負載</p><div class="chartwrap"><canvas id="c4a"></canvas></div></div>'+
  '</div>';
}

var SCREENS=[v0,v1,v2,v3,v4,v5];
var CHARTFN=[v0charts,v1charts,v2charts,v3charts,v4charts,v5charts];
var view=document.getElementById("view");

function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=MODS[i].name;
  document.getElementById("scr-sub").textContent=MODS[i].sub;
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  CHARTFN[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
