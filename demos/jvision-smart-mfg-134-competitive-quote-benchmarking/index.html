<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>同業比價分析 Competitive Quote Benchmarking</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--acc:#0d9488;--acc2:#2dd4bf;--bg:#f1f5f4;--card:#fff;--ink:#0f2f2c;--mut:#64807c;--line:#dbe8e5;--good:#0d9488;--warn:#d97706;--bad:#dc2626}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle}
.topbar{background:linear-gradient(100deg,#0b3d38,#0d9488);color:#fff;padding:0 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(13,148,136,.25)}
.tbrow{display:flex;align-items:center;gap:14px;height:60px;max-width:1400px;margin:0 auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.8;letter-spacing:.5px}
.tbspacer{flex:1;min-width:0}
.tbmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.92;white-space:nowrap}
.tbmeta .dot{width:8px;height:8px;border-radius:50%;background:#5eead4;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,234,212,.5)}70%{box-shadow:0 0 0 8px rgba(94,234,212,0)}100%{box-shadow:0 0 0 0 rgba(94,234,212,0)}}
.nav{background:#0b3d38;padding:0 20px;position:sticky;top:60px;z-index:49}
.navrow{display:flex;flex-wrap:wrap;gap:4px;max-width:1400px;margin:0 auto;min-width:0}
.nav button{flex:none;background:none;border:none;color:#a7d3cd;font-family:inherit;font-size:13.5px;font-weight:600;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0;transition:.15s}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:var(--acc2)}
.wrap{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
.head{margin-bottom:18px}
.head h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.head h1 .ms{color:var(--acc);font-size:26px}
.head p{color:var(--mut);font-size:13.5px;margin-top:5px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .ms{color:var(--acc);font-size:19px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--mut)}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--good)}.down{color:var(--bad)}
.chartbox{position:relative;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#f7fbfa}
tbody tr:hover{background:#f0faf8}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-good{background:#d1faf3;color:#0b6b60}
.t-warn{background:#fef1dc;color:#9a5b06}
.t-bad{background:#fde3e3;color:#b0201f}
.t-info{background:#e0f2fe;color:#075985}
.t-mut{background:#eef2f1;color:#5b6b68}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2f1;color:var(--mut)}
.idx{font-weight:800;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.rowitem{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;min-width:0}
.rowitem .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:#e3f6f2;color:var(--acc)}
.rowitem .gr{flex:1;min-width:0}
.rowitem .ti{font-weight:700;font-size:13.5px}
.rowitem .de{font-size:11.5px;color:var(--mut);margin-top:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px 8px}
.tl::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tl.done::before{background:var(--acc)}
.tl .tt{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .td{font-size:12px;color:var(--mut);margin-top:3px}
.tl .tm{font-size:11px;color:var(--acc);font-weight:700}
.spec td:first-child{font-weight:700;background:#f7fbfa}
.win{color:var(--good);font-weight:800}
.lose{color:var(--bad);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{background:#e3f6f2;border:1px solid #b6e6dd;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#0b6b60;display:flex;gap:9px;align-items:flex-start}
.note .ms{color:var(--acc);flex:none}
.gauge{text-align:center}
.gaugeval{font-size:30px;font-weight:800;color:var(--acc);margin-top:-6px}
.pricebadge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.pb-low{background:#d1faf3;color:#0b6b60}
.pb-mid{background:#fef1dc;color:#9a5b06}
.pb-high{background:#fde3e3;color:#b0201f}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){.nav button span.lb{display:none}.nav button{padding:12px 12px}.tbmeta{display:none}.brand small{display:none}}
@media(max-width:430px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand"><span class="logo"><span class="ms">insights</span></span><span>同業比價分析<small>Competitive Quote Benchmarking</small></span></div>
    <div class="tbspacer"></div>
    <div class="tbmeta"><span class="dot"></span>資料同步：CRM / Quotation / Sales Pipeline</div>
    <div class="tbmeta"><span class="ms">calendar_month</span>2026 Q3</div>
  </div>
</header>
<nav class="nav"><div class="navrow" id="navrow"></div></nav>
<main class="wrap"><div id="app"></div></main>

<script>
function destroyCharts(){ if(window.__charts){window.__charts.forEach(function(c){try{c.destroy();}catch(e){}});} window.__charts=[]; }
function reg(c){ if(!window.__charts)window.__charts=[]; window.__charts.push(c); return c; }
function el(id){ return document.getElementById(id); }
var ACC='#0d9488',ACC2='#2dd4bf',INK='#0f2f2c',MUT='#64807c';
Chart.defaults.font.family="'Inter','Noto Sans TC',sans-serif";
Chart.defaults.color=MUT;

var NAV=[
 {ic:'dashboard',t:'比價戰情總覽',lb:'戰情總覽'},
 {ic:'inventory_2',t:'競品報價資料庫',lb:'競品資料庫'},
 {ic:'fact_check',t:'價格規格比較表',lb:'規格比較'},
 {ic:'trending_up',t:'市場行情趨勢',lb:'行情趨勢'},
 {ic:'request_quote',t:'報價策略建議',lb:'策略建議'},
 {ic:'insights',t:'輸贏單分析',lb:'輸贏單分析'}
];

function buildNav(){
  var r=el('navrow'),h='';
  for(var i=0;i<NAV.length;i++){h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="ms">'+NAV[i].ic+'</span><span class="lb">'+NAV[i].lb+'</span></button>';}
  r.innerHTML=h;
}

function head(ic,t,p){return '<div class="head"><h1><span class="ms">'+ic+'</span>'+t+'</h1><p>'+p+'</p></div>';}

/* ---------- Screen 0: 戰情總覽 ---------- */
function s0(){
  var kpis=[
    {l:'贏單率',v:'27',u:'%',d:'+9pt',up:1,ic:'emoji_events'},
    {l:'報價競爭力指數',v:'82',u:'/100',d:'+6',up:1,ic:'speed'},
    {l:'市場均價偏離',v:'-4.2',u:'%',d:'低於均價',up:1,ic:'trending_down'},
    {l:'待更新競品',v:'13',u:'筆',d:'+3 待建檔',up:0,ic:'update'}
  ];
  var h=head('dashboard','比價戰情總覽','贏單率、報價競爭力指數與市場均價一頁掌握，鎖定本季重點戰場。');
  h+='<div class="grid g4" style="margin-bottom:14px">';
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    h+='<div class="kpi"><div class="lbl"><span class="ms" style="font-size:16px;color:var(--acc)">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="delta '+(k.up?'up':'down')+'"><span class="ms" style="font-size:13px">'+(k.up?'arrow_upward':'arrow_downward')+'</span>'+k.d+'</div></div>';
  }
  h+='</div>';
  h+='<div class="grid g23" style="margin-bottom:14px">';
  h+='<div class="card"><h3><span class="ms">stacked_line_chart</span>贏單率 vs 競爭力指數走勢</h3><div class="sub">近 6 週 — 報價策略調整後穩定拉升</div><div class="chartbox" style="height:280px"><canvas id="c0a"></canvas></div></div>';
  h+='<div class="card"><h3><span class="ms">donut_large</span>各品類報價定位</h3><div class="sub">本公司相對市場均價</div><div class="chartbox" style="height:280px"><canvas id="c0b"></canvas></div></div>';
  h+='</div>';
  h+='<div class="grid g2">';
  h+='<div class="card"><h3><span class="ms">local_fire_department</span>本季重點對決品項</h3><div class="sub">價差為本公司相對主要競品</div><div style="overflow-x:auto"><table><thead><tr><th>品項</th><th>主要競品</th><th class="num">價差</th><th class="num">競爭力</th><th>狀態</th></tr></thead><tbody>';
  var rows=[
    ['伺服馬達 SM-750W','鴻捷 HJ-700','-6.5%',88,'good','領先'],
    ['變頻器 VF-15K','O晟 T-15','+3.2%',71,'warn','拉鋸'],
    ['PLC 控制器 CX-24','三菱 FX5','+8.1%',58,'bad','落後'],
    ['伺服驅動器 SD-2A','安川 Σ-7','-2.8%',80,'good','領先'],
    ['減速機 RG-40','住友 CH','+1.5%',66,'warn','拉鋸']
  ];
  for(var r=0;r<rows.length;r++){var x=rows[r];
    h+='<tr><td style="font-weight:700">'+x[0]+'</td><td>'+x[1]+'</td><td class="num '+(x[2][0]=='-'?'win':'lose')+'">'+x[2]+'</td><td class="num idx">'+x[3]+'</td><td><span class="tag t-'+x[4]+'">'+x[5]+'</span></td></tr>';
  }
  h+='</tbody></table></div></div>';
  h+='<div class="card"><h3><span class="ms">notifications_active</span>戰情提醒</h3><div class="sub">系統依規則自動排序</div><div class="list">';
  var al=[
    {ic:'price_change',t:'鴻捷 HJ-700 調降報價 5%',d:'伺服馬達品類均價下修，建議重新評估報價區間',g:'t-bad',s:'警示'},
    {ic:'new_releases',t:'O晟推出 T-15 Plus 新規格',d:'需補建競品規格資料以維持比較完整度',g:'t-warn',s:'注意'},
    {ic:'flag',t:'PLC 控制器連兩案落後流失',d:'競爭力指數 58，建議產品部檢討定價策略',g:'t-bad',s:'警示'},
    {ic:'verified',t:'伺服驅動器贏單率升至 34%',d:'低於均價 2.8% 策略奏效，維持現行報價',g:'t-good',s:'佳'}
  ];
  for(var a=0;a<al.length;a++){var y=al[a];
    h+='<div class="rowitem"><div class="ic"><span class="ms">'+y.ic+'</span></div><div class="gr"><div class="ti">'+y.t+'</div><div class="de">'+y.d+'</div></div><span class="tag '+y.g+'">'+y.s+'</span></div>';
  }
  h+='</div></div></div>';
  el('app').innerHTML=h;
  void el('app').offsetHeight;
  reg(new Chart(el('c0a'),{type:'line',data:{labels:['第1週','第2週','第3週','第4週','第5週','第6週'],datasets:[
    {label:'贏單率 %',data:[18,20,22,23,25,27],borderColor:ACC,backgroundColor:'rgba(13,148,136,.12)',fill:true,tension:.35,borderWidth:2.5,pointRadius:3},
    {label:'競爭力指數',data:[70,72,74,77,79,82],borderColor:'#f59e0b',backgroundColor:'transparent',tension:.35,borderWidth:2.5,pointRadius:3,yAxisID:'y1'}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14}}},scales:{y:{beginAtZero:false,grid:{color:'#eef4f2'}},y1:{position:'right',grid:{display:false},min:60,max:90}}}}));
  reg(new Chart(el('c0b'),{type:'doughnut',data:{labels:['低於均價','貼近均價','高於均價'],datasets:[{data:[7,9,4],backgroundColor:[ACC,ACC2,'#fbbf24'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12}}}}}));
}

/* ---------- Screen 1: 競品報價資料庫 ---------- */
function s1(){
  var h=head('inventory_2','競品報價資料庫','彙整同業產品、規格與最新報價，統一建檔管理與情報來源追溯。');
  h+='<div class="grid g4" style="margin-bottom:14px">';
  var stat=[['competitor','競品廠商','12','家'],['category','建檔品項','248','項'],['history','本月新增報價','36','筆'],['task_alt','資料完整率','88','%']];
  for(var i=0;i<stat.length;i++){var s=stat[i];
    h+='<div class="kpi"><div class="lbl"><span class="ms" style="font-size:16px;color:var(--acc)">'+s[0]+'</span>'+s[1]+'</div><div class="val">'+s[2]+'<small>'+s[3]+'</small></div></div>';
  }
  h+='</div>';
  h+='<div class="card"><div class="seg"><button class="on">全部品類</button><button>伺服馬達</button><button>變頻器</button><button>PLC</button><button>減速機</button></div>';
  h+='<h3><span class="ms">database</span>競品報價明細</h3><div class="sub">共 248 筆 · 依情報回報時間排序 · 來源可追溯</div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>競品型號</th><th>廠商</th><th>品類</th><th class="num">報價 (NT$)</th><th>規格摘要</th><th>情報來源</th><th>更新</th><th>狀態</th></tr></thead><tbody>';
  var db=[
    ['HJ-700','鴻捷','伺服馬達','12,400','750W/3000rpm/230V','客戶提供','08/12','已建檔'],
    ['T-15','O晟','變頻器','28,900','15kW/三相/向量','招標文件','08/11','已建檔'],
    ['FX5-80','三菱','PLC','19,600','80點/乙太網','代理商','08/10','已建檔'],
    ['Σ-7-2A','安川','伺服驅動','15,200','2A/脈波+匯流排','展會','08/09','待複核'],
    ['CH-40','住友','減速機','8,750','40:1/法蘭式','客戶提供','08/09','已建檔'],
    ['VF-11K','O昇','變頻器','24,300','11kW/內建PLC','官網','08/08','已建檔'],
    ['A6-1KW','發那科','伺服馬達','16,800','1kW/2500rpm','招標文件','08/07','待複核'],
    ['CP1E-60','歐姆龍','PLC','11,900','60點/類比擴充','代理商','08/06','已建檔']
  ];
  for(var d=0;d<db.length;d++){var x=db[d];var st=x[7]=='已建檔'?'t-good':'t-warn';
    h+='<tr><td style="font-weight:700">'+x[0]+'</td><td>'+x[1]+'</td><td><span class="pill">'+x[2]+'</span></td><td class="num">'+x[3]+'</td><td style="color:var(--mut);font-size:12px">'+x[4]+'</td><td>'+x[5]+'</td><td>'+x[6]+'</td><td><span class="tag '+st+'">'+x[7]+'</span></td></tr>';
  }
  h+='</tbody></table></div></div>';
  h+='<div class="grid g23" style="margin-top:14px">';
  h+='<div class="card"><h3><span class="ms">bar_chart</span>各廠商建檔筆數</h3><div class="sub">競品覆蓋度</div><div class="chartbox" style="height:250px"><canvas id="c1a"></canvas></div></div>';
  h+='<div class="card"><h3><span class="ms">source</span>情報來源分布</h3><div class="sub">本月 36 筆新增</div><div class="chartbox" style="height:250px"><canvas id="c1b"></canvas></div></div>';
  h+='</div>';
  el('app').innerHTML=h;
  void el('app').offsetHeight;
  reg(new Chart(el('c1a'),{type:'bar',data:{labels:['鴻捷','O晟','三菱','安川','O昇','發那科','歐姆龍','住友'],datasets:[{label:'建檔筆數',data:[38,34,31,27,25,22,19,16],backgroundColor:ACC,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#eef4f2'}},x:{grid:{display:false}}}}}));
  reg(new Chart(el('c1b'),{type:'polarArea',data:{labels:['客戶提供','招標文件','代理商','展會','官網'],datasets:[{data:[11,9,7,5,4],backgroundColor:['rgba(13,148,136,.85)','rgba(45,212,191,.85)','rgba(251,191,36,.8)','rgba(148,163,184,.8)','rgba(59,130,246,.7)'],borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:11,padding:9,font:{size:11}}}},scales:{r:{grid:{color:'#eef4f2'},ticks:{display:false}}}}}));
}

/* ---------- Screen 2: 價格規格比較表 ---------- */
function s2(){
  var h=head('fact_check','價格規格比較表','多競品逐項規格與價差並排分析，一眼看出本公司相對優劣勢。');
  h+='<div class="note"><span class="ms">tips_and_updates</span><span>本公司欄以青色標示。比較品項：<b style="color:var(--acc)">伺服馬達 750W 級</b>共 4 家並排，可快速定位規格與價格優劣勢。</span></div>';

  for(var b=0;b<btns.length;b++){btns[b].classList.toggle('on',+btns[b].getAttribute('data-i')===i);}

}
