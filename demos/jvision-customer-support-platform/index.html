<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>客戶服務平台 · Jvision 客服支援平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#6d28d9;--accent2:#8b5cf6;--bg:#f5f3fb;--card:#ffffff;
  --ink:#1e1b2e;--sub:#6b6580;--line:#ece8f5;--side:#241b3d;--side2:#180f2e;
  --ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#e7e2f5;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(109,40,217,.5)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;color:#a99fd0;font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#c7bfe4;padding:11px 13px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;text-align:left;width:100%;transition:.15s}
.nav button .material-symbols-outlined{font-size:21px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(109,40,217,.45)}
.nav .num{margin-left:auto;font-size:11px;opacity:.6;font-weight:700}
.sidefoot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9a8fc4;line-height:1.6}
.sidefoot b{color:#d8cff2}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h2{font-size:18px;font-weight:800}
.top .sub{font-size:12.5px;color:var(--sub);font-weight:500}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1ecfb;color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px}
.chip .material-symbols-outlined{font-size:16px}
.wrap{padding:22px 26px 46px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:2fr 1fr}
.split3{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.tight{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ch h3{font-size:14.5px;font-weight:700}
.ch .material-symbols-outlined{font-size:19px;color:var(--accent)}
.ch .r{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;margin-bottom:11px}
.kpi .ic .material-symbols-outlined{font-size:21px}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
.kpi .val small{font-size:14px;font-weight:700;color:var(--sub)}
.kpi .dt{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px}
.kpi .dt .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.dn{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9fe}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.t-ok{background:#e7f7ec;color:var(--ok)}
.t-warn{background:#fef3e2;color:#b45309}
.t-bad{background:#fde7ec;color:var(--bad)}
.t-info{background:#e8effd;color:var(--info)}
.t-mut{background:#eef0f4;color:#64748b}
.t-pur{background:#f1ecfb;color:var(--accent)}
.ava{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.bar{height:7px;border-radius:6px;background:#efeaf9;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.inbox{display:grid;grid-template-columns:200px 1fr;gap:0}
.chanlist{border-right:1px solid var(--line);padding:6px}
.chanlist .it{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600}
.chanlist .it:hover{background:#f6f3fc}
.chanlist .it.on{background:#f1ecfb;color:var(--accent)}
.chanlist .it .material-symbols-outlined{font-size:19px}
.chanlist .it .c{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px}
.convo{display:flex;flex-direction:column;gap:2px}
.convo .row2{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.convo .row2:hover{background:#faf9fe}
.convo .row2.unread{background:#faf7ff}
.convo .meta{flex:1;min-width:0}
.convo .meta .nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.convo .meta .pv{font-size:12.5px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo .side2{text-align:right;flex:none}
.convo .side2 .tm{font-size:11px;color:var(--sub);font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.col{background:#f7f5fc;border:1px solid var(--line);border-radius:14px;padding:11px;min-height:120px}
.col>h4{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:11px;color:#4b4364}
.col>h4 .n{margin-left:auto;background:#e7e0f6;color:var(--accent);border-radius:20px;font-size:11px;padding:1px 8px}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,20,60,.04);cursor:pointer}
.tk:hover{border-color:var(--accent2)}
.tk .id{font-size:11px;color:var(--sub);font-weight:700}
.tk .ti{font-size:12.8px;font-weight:600;margin:5px 0 8px;line-height:1.45}
.tk .ft{display:flex;align-items:center;gap:7px;justify-content:space-between}
.prib{width:4px;border-radius:4px;align-self:stretch}
.slarow{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.slarow:last-child{border-bottom:0}
.slabar{flex:1;height:24px;border-radius:8px;background:#f1ecfb;position:relative;overflow:hidden}
.slabar>i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10.5px;font-weight:800;color:#fff}
.slarow .nm{width:150px;flex:none;font-size:13px;font-weight:600}
.slarow .rt{width:96px;flex:none;text-align:right;font-size:12px;font-weight:700}
.chatw{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .bub{background:#f4f1fb;border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.55;max-width:82%}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.aibox{background:linear-gradient(135deg,#faf7ff,#f3eefc);border:1px solid #e7ddf7;border-radius:14px;padding:16px}
.aibox .hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;color:var(--accent);margin-bottom:10px}
.aibox ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.aibox li{font-size:13px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.aibox li .material-symbols-outlined{font-size:18px;color:var(--accent2);flex:none;margin-top:1px}
.sugg{border:1px dashed var(--accent2);border-radius:11px;padding:11px 13px;font-size:12.8px;line-height:1.55;color:#4b4364;background:#fff;margin-top:6px}
.kbcard{border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:9px}
.kbcard .tt{font-size:13.5px;font-weight:700;line-height:1.4}
.kbcard .mt{font-size:11.5px;color:var(--sub);font-weight:600;display:flex;gap:12px}
.starrow{display:flex;align-items:center;gap:11px;padding:9px 0}
.starrow .lb{width:56px;font-size:12px;font-weight:700;flex:none}
.starrow .bar{flex:1}
.starrow .pc{width:44px;text-align:right;font-size:12px;font-weight:700;flex:none}
.pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:#f1ecfb;color:var(--accent);cursor:pointer}
.mini{font-size:11.5px;color:var(--sub);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;flex-wrap:wrap;padding:11px 14px;z-index:40}
  .brand{padding:0;margin-right:6px}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;flex:1;gap:6px}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
  .nav .num{display:none}
  .sidefoot{display:none}
}
@media(max-width:820px){
  .kpis,.g3,.g2,.split,.split3,.board{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}
  .chanlist{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
  .chanlist .it{flex:none}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
  .wrap{padding:16px 14px 40px}
  .top{padding:13px 15px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">support_agent</span></div>
      <div><h1>ServiceDesk</h1><p>Jvision 客服支援平台</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <b>客服團隊 · 值班中 12 人</b><br/>
      今日進線 <b>486</b> · 待處理 <b>37</b><br/>
      平均首回 <b>5.3 分</b> · CSAT <b>94%</b>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h2 id="scr-t">共享收件匣</h2>
        <div class="sub" id="scr-s">多渠道對話集中處理</div>
      </div>
      <div class="spacer"></div>
      <span class="chip"><span class="material-symbols-outlined">bolt</span>即時運作中</span>
      <span class="chip"><span class="material-symbols-outlined">calendar_today</span>2026/08/13</span>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<script>
var MODS=[
  {icon:"inbox",name:"共享收件匣",sub:"多渠道對話集中處理"},
  {icon:"confirmation_number",name:"服務工單",sub:"客訴工單指派與追蹤"},
  {icon:"timer",name:"SLA 時效",sub:"回應與解決時效監控"},
  {icon:"smart_toy",name:"AI 摘要回覆",sub:"對話摘要與建議回覆"},
  {icon:"menu_book",name:"知識庫",sub:"解法文章與命中分析"},
  {icon:"sentiment_satisfied",name:"滿意度報表",sub:"CSAT 回饋與趨勢分析"}
];
var PAL=["#6d28d9","#8b5cf6","#0ea5e9","#f59e0b","#16a34a","#e11d48","#2563eb","#db2777"];
function av(s){var h=0;for(var i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return PAL[Math.abs(h)%PAL.length];}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}

var view=document.getElementById("view");
var _chart=null;
function killChart(){if(_chart){try{_chart.destroy();}catch(e){}_chart=null;}}

/* ===== SCREEN 0 : 共享收件匣 ===== */
function v0(){
  var chans=[
    {ic:"call",n:"電話",c:6,on:false},
    {ic:"mail",n:"電子郵件",c:14,on:true},
    {ic:"forum",n:"線上聊天",c:9,on:false},
    {ic:"chat",n:"社群訊息",c:5,on:false},
    {ic:"sms",n:"簡訊",c:3,on:false}
  ];
  var convo=[
    {nm:"林曉薇",ch:"mail",pv:"訂單 #A20391 收到瑕疵品，希望能換貨…",tm:"3 分前",un:true,tag:"t-bad",tt:"未回"},
    {nm:"陳建豪",ch:"forum",pv:"請問我的退款什麼時候會到帳？已經等了…",tm:"8 分前",un:true,tag:"t-warn",tt:"處理中"},
    {nm:"Global Tech",ch:"mail",pv:"發票抬頭需要更正，麻煩協助修改謝謝",tm:"21 分前",un:false,tag:"t-info",tt:"已認領"},
    {nm:"王美玲",ch:"chat",pv:"App 一直閃退，重新安裝也沒用，很困擾",tm:"34 分前",un:true,tag:"t-bad",tt:"未回"},
    {nm:"張志明",ch:"call",pv:"[語音留言] 想詢問會員升級的優惠方案內容",tm:"52 分前",un:false,tag:"t-mut",tt:"待回撥"},
    {nm:"李佩珊",ch:"forum",pv:"感謝昨天的協助，問題已經完全解決了！",tm:"1 小時前",un:false,tag:"t-ok",tt:"已關案"},
    {nm:"Sunrise 貿易",ch:"mail",pv:"批次採購合約條款想再確認幾個細節…",tm:"1 小時前",un:false,tag:"t-info",tt:"已認領"}
  ];
  var v=el("div");
  var k=el("div","grid kpis");
  var kd=[
    ["進線總數","486","today","var(--accent)","+8.2%","up"],
    ["待處理","37","warning","var(--warn)","-5 件","up"],
    ["平均認領","1.8","bolt","var(--info)","-0.4 分","up"],
    ["未讀對話","22","markunread","var(--bad)","即時","dn"]
  ];
  kd.forEach(function(d){
    k.appendChild(el("div","kpi",
      '<div class="ic" style="background:'+d[3]+'"><span class="material-symbols-outlined">'+d[2]+'</span></div>'+
      '<div class="lab">'+d[0]+'</div><div class="val">'+d[1]+(d[0]==="平均認領"?' <small>分</small>':'')+'</div>'+
      '<div class="dt '+d[5]+'"><span class="material-symbols-outlined">'+(d[5]==="up"?"trending_up":"trending_down")+'</span>'+d[4]+'</div>'));
  });
  v.appendChild(k);

  var box=el("div","card tight");box.style.marginTop="16px";
  var ib=el("div","inbox");
  var cl=el("div","chanlist");
  cl.appendChild(el("div","",'<div style="padding:6px 8px 10px;font-size:11px;font-weight:800;color:var(--sub)">渠道</div>'));
  chans.forEach(function(c){
    cl.appendChild(el("div","it"+(c.on?" on":""),
      '<span class="material-symbols-outlined">'+c.ic+'</span>'+c.n+'<span class="c">'+c.c+'</span>'));
  });
  ib.appendChild(cl);
  var cv=el("div","convo");
  var cIcon={mail:"mail",forum:"forum",chat:"chat",call:"call",sms:"sms"};
  convo.forEach(function(c){
    cv.appendChild(el("div","row2"+(c.un?" unread":""),
      '<div class="ava" style="background:'+av(c.nm)+'">'+c.nm.charAt(0)+'</div>'+
      '<div class="meta"><div class="nm">'+esc(c.nm)+
        ' <span class="material-symbols-outlined" style="font-size:15px;color:var(--sub)">'+cIcon[c.ch]+'</span>'+
        (c.un?' <span class="dot" style="background:var(--bad)"></span>':'')+'</div>'+
        '<div class="pv">'+esc(c.pv)+'</div></div>'+
      '<div class="side2"><div class="tm">'+c.tm+'</div>'+
        '<div style="margin-top:6px"><span class="tag '+c.tag+'">'+c.tt+'</span></div></div>'));
  });
  ib.appendChild(cv);
  box.appendChild(ib);
  v.appendChild(box);
  view.appendChild(v);
}

/* ===== SCREEN 1 : 服務工單 (board) ===== */
function v1(){
  var cols=[
    {h:"待處理",ic:"inbox",items:[
      {id:"TK-4821",ti:"訂單 #A20391 瑕疵換貨申請",pri:"高",who:"林曉薇",tag:"t-bad",cat:"退換貨"},
      {id:"TK-4823",ti:"App 於 iOS 17 持續閃退",pri:"高",who:"王美玲",tag:"t-bad",cat:"技術"},
      {id:"TK-4826",ti:"會員升級優惠方案諮詢",pri:"低",who:"張志明",tag:"t-mut",cat:"諮詢"}
    ]},
    {h:"處理中",ic:"pending",items:[
      {id:"TK-4810",ti:"退款尚未到帳查詢",pri:"中",who:"陳建豪",tag:"t-warn",cat:"帳務"},
      {id:"TK-4815",ti:"發票抬頭更正",pri:"低",who:"Global",tag:"t-info",cat:"帳務"}
    ]},
    {h:"待客戶回覆",ic:"schedule",items:[
      {id:"TK-4802",ti:"批次採購合約條款確認",pri:"中",who:"Sunrise",tag:"t-info",cat:"業務"},
      {id:"TK-4799",ti:"帳號雙重驗證設定",pri:"低",who:"周雅婷",tag:"t-mut",cat:"帳號"}
    ]},
    {h:"已關案",ic:"check_circle",items:[
      {id:"TK-4790",ti:"配送地址更改",pri:"低",who:"李佩珊",tag:"t-ok",cat:"物流"},
      {id:"TK-4788",ti:"優惠券無法使用",pri:"中",who:"黃國強",tag:"t-ok",cat:"促銷"},
      {id:"TK-4785",ti:"產品保固期查詢",pri:"低",who:"吳孟達",tag:"t-ok",cat:"諮詢"}
    ]}
  ];
  var priC={"高":"var(--bad)","中":"var(--warn)","低":"var(--accent2)"};
  var v=el("div");
  var k=el("div","grid kpis");
  [["開立工單","148","confirmation_number","var(--accent)"],
   ["處理中","42","pending","var(--warn)"],
   ["今日關案","31","task_alt","var(--ok)"],
   ["平均關案","1.9 天","event_available","var(--info)"]].forEach(function(d){
    k.appendChild(el("div","kpi",
      '<div class="ic" style="background:'+d[3]+'"><span class="material-symbols-outlined">'+d[2]+'</span></div>'+
      '<div class="lab">'+d[0]+'</div><div class="val">'+d[1]+'</div>'));
  });

function show(i){
  killChart();
  view.innerHTML="";
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++)btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);

  document.getElementById("scr-s").textContent=MODS[i].sub;
  void view.offsetHeight;
  RENDER[i]();
  try{window.scrollTo(0,0);}catch(e){}
}
