<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>財務稽核系統（Financial Audit System）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --accent:#b45309;--accent2:#f59e0b;--bg:#f6f5f2;--panel:#ffffff;
    --ink:#2b2115;--muted:#8a7d68;--line:#ece7dd;--soft:#fbf8f2;
    --good:#0f766e;--bad:#b91c1c;--warn:#b45309;--info:#1d4ed8;
    --shadow:0 1px 2px rgba(60,40,10,.05),0 8px 24px rgba(120,80,20,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    font-size:14px;line-height:1.55;
  }
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle}
  .app{display:flex;min-height:100vh;max-width:100%}
  .side{
    width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
    padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;min-width:0;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .logo{
    width:42px;height:42px;flex:0 0 42px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow);
  }
  .logo .material-symbols-outlined{font-size:26px}
  .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
  .brand p{font-size:11px;margin:2px 0 0;color:var(--muted);font-weight:500}
  nav{display:flex;flex-direction:column;gap:4px}
  .navbtn{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;
    border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--muted);
    text-align:left;width:100%;font-weight:600;transition:.12s;min-width:0;
  }
  .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
  .navbtn .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navbtn:hover{background:var(--soft);color:var(--ink)}
  .navbtn.on{background:linear-gradient(135deg,rgba(180,83,9,.12),rgba(245,158,11,.1));color:var(--accent);box-shadow:inset 0 0 0 1px rgba(180,83,9,.18)}
  .navbtn .idx{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 6px}
  .side-foot{margin-top:16px;padding:12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.5}
  main{flex:1;min-width:0;padding:24px 28px 60px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .top h2{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px}
  .top .sub{color:var(--muted);font-size:13px;margin-top:3px;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
  .pill .material-symbols-outlined{font-size:17px;color:var(--accent)}
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g21{grid-template-columns:1.6fr 1fr}
  .g12{grid-template-columns:1fr 1.7fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
  .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800}
  .card .ch-sub{color:var(--muted);font-size:11.5px;margin-bottom:12px;font-weight:500}
  .ch-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .ch-head h3{margin:0}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
  .kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .kl .material-symbols-outlined{font-size:18px;color:var(--accent)}
  .kpi .kv{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.3px;font-family:"Inter",sans-serif}
  .kpi .kv small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
  .kpi .kd{font-size:11.5px;margin-top:5px;font-weight:600}
  .up{color:var(--good)}.down{color:var(--bad)}.neu{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:520px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--soft)}
  .num{font-family:"Inter",sans-serif;font-weight:600;text-align:right}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .t-good{background:#d1fae5;color:#065f46}
  .t-warn{background:#fef3c7;color:#92400e}
  .t-bad{background:#fee2e2;color:#991b1b}
  .t-info{background:#dbeafe;color:#1e40af}
  .t-mut{background:#eee9e0;color:#6b6152}
  .bar-mini{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:52px}
  .bar-mini > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px}
  .col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
  .col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
  .col h4 span.cnt{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1px 7px}
  .ticket{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(60,40,10,.04);overflow:hidden}
  .ticket:last-child{margin-bottom:0}
  .ticket .tt{font-size:12.5px;font-weight:700;margin-bottom:5px}
  .ticket .tm{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ticket .brdr{height:3px;margin:-10px -11px 8px;border-radius:11px 11px 0 0}
  .tl{position:relative;padding-left:26px;min-width:0}
  .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item .node{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);box-shadow:0 0 0 3px var(--soft)}
  .tl-item.done .node{background:var(--accent)}
  .tl-item .th{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-item .td{font-size:11.5px;color:var(--muted);margin-top:3px}
  .tl-item .time{font-size:10.5px;color:var(--muted);font-weight:600;font-family:"Inter",sans-serif}
  .chart-wrap{width:100%;overflow:hidden;min-width:0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:10px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  .lst{list-style:none;margin:0;padding:0}
  .lst li{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .lst li:last-child{border-bottom:none}
  .ic-box{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);border:1px solid var(--line)}
  .ic-box .material-symbols-outlined{font-size:20px}
  .lst .grow{min-width:0;flex:1}
  .lst .tt{font-size:13px;font-weight:700}
  .lst .ss{font-size:11px;color:var(--muted)}
  .gauge-row{display:flex;flex-direction:column;gap:14px}
  .gr{min-width:0}
  .gr .glbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px}
  .gr .glbl b{font-family:"Inter",sans-serif}
  .heat{display:grid;grid-template-columns:64px repeat(5,1fr);gap:4px;min-width:420px;font-size:11px}
  .heat .hc{border-radius:7px;padding:9px 4px;text-align:center;font-weight:700;color:#fff}
  .heat .hl{display:flex;align-items:center;font-weight:700;color:var(--muted);font-size:11px}
  .stat-strip{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:600;min-width:0}
  .chip b{display:block;font-size:17px;font-family:"Inter",sans-serif;margin-top:2px}
  .callout{background:linear-gradient(135deg,rgba(180,83,9,.07),rgba(245,158,11,.06));border:1px solid rgba(180,83,9,.18);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
  .callout .material-symbols-outlined{color:var(--accent);font-size:24px;flex:0 0 auto}
  .callout .cot b{font-size:13px}
  .callout .cot p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .steps{display:flex;flex-wrap:wrap;gap:8px}
  .step{flex:1;min-width:120px;border-radius:12px;padding:11px 12px;background:var(--soft)}
  .step .sn{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:1px}
  .step .st{font-size:12.5px;font-weight:700;margin-top:3px}
  .step .sd{font-size:11px;color:var(--muted);margin-top:3px}
  .foot-note{margin-top:22px;text-align:center;font-size:11px;color:var(--muted)}
  @media(max-width:860px){
    .app{flex-direction:column}
    .side{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:14px 14px 10px}
    .brand{border-bottom:none;padding-bottom:8px;margin-bottom:8px}
    nav{flex-direction:row;flex-wrap:wrap;gap:7px}
    .navbtn{width:auto;padding:9px 13px}
    .navbtn .idx{display:none}
    .side-foot{display:none}
    main{padding:18px 16px 50px}
  }
  @media(max-width:820px){
    .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .navbtn .nl{display:none}
    .navbtn{padding:9px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div>
        <h1>財務稽核系統</h1>
        <p>Financial Audit System</p>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b style="color:var(--ink)">純 UI 展示</b><br/>
      本頁為擬真示範，資料皆為虛構，無後端連線。畫面與專案詳細頁功能模組、運作流程一致。
    </div>
  </aside>
  <main>
    <div class="top" id="top"></div>
    <div id="screen"></div>
    <div class="foot-note">財務稽核系統（Financial Audit System）· 純 UI 擬真示範 · 資料皆為虛構</div>
  </main>
</div>

<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};opt.chart.fontFamily='Inter, "Noto Sans TC", sans-serif';opt.chart.toolbar={show:false};try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}
var ACC="#b45309",ACC2="#f59e0b";

var SCREENS=[
  {icon:"checklist",label:"內控稽核清單",title:"內控稽核清單",sub:"稽核項目庫與年度稽核計畫排程",render:s0},
  {icon:"fact_check",label:"抽樣與測試",title:"抽樣與控制測試",sub:"統計抽樣、控制測試與工作底稿",render:s1},
  {icon:"warning",label:"異常交易偵測",title:"異常交易偵測",sub:"規則與模型標記可疑與例外交易",render:s2},
  {icon:"rule",label:"稽核發現與改善",title:"稽核發現與改善",sub:"缺失追蹤與矯正措施看板",render:s3},
  {icon:"gavel",label:"法遵與覆核",title:"法遵與覆核",sub:"適合度與法規覆核紀錄軌跡",render:s4},
  {icon:"monitoring",label:"稽核決策室",title:"稽核決策室",sub:"風險指標與稽核成果彙總",render:s5}
];

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function tagClass(k){return{good:"t-good",warn:"t-warn",bad:"t-bad",info:"t-info",mut:"t-mut"}[k]||"t-mut";}

/* ============ SCREEN 0 : 內控稽核清單 ============ */
function s0(){
  var kpis=[
    {l:"稽核項目",v:"186",u:"項",d:"涵蓋 7 大控制領域",c:"neu",ic:"checklist"},
    {l:"本季已排程",v:"42",u:"項",d:"+6 較上季",c:"up",ic:"calendar_month"},
    {l:"高風險項目",v:"11",u:"項",d:"優先執行",c:"down",ic:"warning"},
    {l:"清單覆蓋率",v:"92",u:"%",d:"+9pt 導入後",c:"up",ic:"task_alt"}
  ];
  var rows=[
    {id:"IC-1042",area:"授信作業",name:"授信額度審核權限控管",risk:"高",cy:"季",owner:"林品瑄",st:["排程中","info"],cov:78},
    {id:"IC-1051",area:"財務報導",name:"月結分錄覆核與截止",risk:"高",cy:"月",owner:"陳彥廷",st:["執行中","warn"],cov:64},
    {id:"IC-1067",area:"現金與存款",name:"銀行對帳單三方勾稽",risk:"中",cy:"月",owner:"王思翰",st:["已完成","good"],cov:100},
    {id:"IC-1073",area:"採購付款",name:"付款前三聯單比對",risk:"中",cy:"季",owner:"林品瑄",st:["排程中","info"],cov:55},
    {id:"IC-1088",area:"投資商品",name:"客戶適合度覆核紀錄",risk:"高",cy:"季",owner:"周雅涵",st:["待覆核","mut"],cov:41},
    {id:"IC-1095",area:"資訊安全",name:"系統存取權限最小化",risk:"中",cy:"半年",owner:"陳彥廷",st:["已完成","good"],cov:96}
  ];
  var risks={"高":"t-bad","中":"t-warn","低":"t-good"};
  var html=kpiRow(kpis);
  html+='<div class="grid g21" style="margin-top:16px">';
  html+='<div class="card"><div class="ch-head"><div><h3>年度稽核項目清單</h3><div class="ch-sub">依風險等級與循環頻率排程</div></div><span class="pill"><span class="material-symbols-outlined">filter_list</span>2026 計畫</span></div>';
  html+='<div style="overflow-x:auto"><table><thead><tr><th>項目編號</th><th>控制領域</th><th>稽核項目</th><th>風險</th><th>頻率</th><th>負責人</th><th>狀態</th><th style="text-align:right">覆蓋</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr><td style="font-weight:700;font-family:Inter">'+esc(r.id)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.name)+'</td>'+
      '<td><span class="tag '+risks[r.risk]+'">'+r.risk+'</span></td><td>'+esc(r.cy)+'</td><td>'+esc(r.owner)+'</td>'+
      '<td><span class="tag '+tagClass(r.st[1])+'">'+esc(r.st[0])+'</span></td>'+
      '<td style="text-align:right"><div style="display:flex;align-items:center;gap:7px;justify-content:flex-end"><span class="num">'+r.cov+'%</span><span class="bar-mini" style="width:56px"><i style="width:'+r.cov+'%"></i></span></div></td></tr>';
  });
  html+='</tbody></table></div></div>';
  html+='<div class="grid" style="gap:16px"><div class="card"><h3>控制領域分布</h3><div class="ch-sub">依項目數量占比</div><div class="chart-wrap"><div id="c0a"></div></div></div>';
  html+='<div class="card"><h3>計畫執行進度</h3><div class="ch-sub">四階段稽核循環</div><div class="steps" style="flex-direction:column">'+
    step("01","風險評估","盤點流程並評分","done")+
    step("02","計畫排程","指派範圍與人員","done")+
    step("03","現場執行","抽樣與測試進行中","now")+
    step("04","覆核結案","主管覆核與存檔","")+
    '</div></div></div>';
  html+='</div>';
  document.getElementById("screen").innerHTML=html;
  void document.getElementById("screen").offsetHeight;
  mk("c0a",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:230},
    labels:["授信作業","財務報導","現金存款","採購付款","投資商品","資安其他"],
    series:[34,28,22,26,19,57],
    colors:[ACC,ACC2,"#d97706","#92400e","#facc15","#e7c9a0"],
    dataLabels:{enabled:false},
    legend:{position:"bottom",fontSize:"11px"},
    stroke:{width:2,colors:["#fff"]},
    plotOptions:{pie:{donut:{size:"64%",labels:{show:true,total:{show:true,label:"項目",fontSize:"12px",color:"#8a7d68",formatter:function(){return"186 項";}}}}}}
  });
}

/* ============ SCREEN 1 : 抽樣與控制測試 ============ */
function s1(){
  var chips=[
    {l:"母體交易",v:"48,210"},{l:"樣本數",v:"384"},{l:"信賴水準",v:"95%"},
    {l:"容忍誤差",v:"5%"},{l:"已測試",v:"271"},{l:"例外",v:"14"}
  ];
  var samples=[
    {id:"SM-0031",tx:"授信撥款 TX-88214",amt:"NT$ 1,250,000",ctrl:"雙人覆核",res:["通過","good"],ex:"—"},
    {id:"SM-0032",tx:"付款作業 TX-88251",amt:"NT$ 486,300",ctrl:"三聯單比對",res:["例外","bad"],ex:"缺請購核准"},
    {id:"SM-0033",tx:"投資申購 TX-88277",amt:"NT$ 900,000",ctrl:"適合度確認",res:["待覆核","warn"],ex:"風險屬性未更新"},
    {id:"SM-0034",tx:"沖銷分錄 TX-88290",amt:"NT$ 132,750",ctrl:"主管授權",res:["通過","good"],ex:"—"},
    {id:"SM-0035",tx:"現金收付 TX-88301",amt:"NT$ 58,900",ctrl:"對帳勾稽",res:["例外","bad"],ex:"對帳差異未查明"},

/* ---------- render helpers ---------- */
function kpiCard(k){
  var arrow=k.c==="up"?"trending_up":k.c==="down"?"trending_down":"remove";
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+k.ic+'</span>'+esc(k.l)+'</div>'+
    '<div class="kv">'+esc(k.v)+'<small>'+esc(k.u)+'</small></div>'+
    '<div class="kd '+k.c+'"><span class="material-symbols-outlined" style="font-size:15px">'+arrow+'</span> '+esc(k.d)+'</div></div>';
}
function kpiRow(arr){var h='<div class="grid g4">';arr.forEach(function(k){h+=kpiCard(k);});return h+'</div>';}
function step(n,t,d,state){
  var col=state==="done"?"#0f766e":state==="now"?ACC:"#c9bda6";
  return '<div class="step" style="border-left:3px solid '+col+'"><div class="sn">STEP '+n+'</div><div class="st">'+esc(t)+'</div><div class="sd">'+esc(d)+'</div></div>';
}
function gauge(name,v,max,col){
  var pct=Math.round(v/max*100);
  return '<div class="gr"><div class="glbl"><span>'+esc(name)+'</span><b>'+(max===100?v+"%":v+"/"+max)+'</b></div>'+
    '<div class="bar-mini" style="height:9px"><i style="width:'+pct+'%;background:'+col+'"></i></div></div>';
}
function scLi(ic,t,s,k){
  var col=k==="good"?"#0f766e":k==="warn"?ACC:"#1d4ed8";
  return '<li><div class="ic-box" style="color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="grow"><div class="tt">'+esc(t)+'</div><div class="ss">'+esc(s)+'</div></div></li>';
}

/* ---------- shell ---------- */
function buildNav(){
  var nav=document.getElementById("nav");var h="";
  SCREENS.forEach(function(s,i){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+s.icon+'</span><span class="nl">'+esc(s.label)+'</span><span class="idx">'+i+'</span></button>';
  });
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
}
function show(i){
  var s=SCREENS[i];if(!s)return;
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
  var topEl=document.getElementById("top");
  topEl.innerHTML='<div><h2>'+esc(s.title)+'</h2><div class="sub">'+esc(s.sub)+'</div></div>'+
    '<span class="pill"><span class="material-symbols-outlined">'+s.icon+'</span>模組 '+(i+1)+' / 6</span>';
  s.render();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
