<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>員工持股與股權激勵管理 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E7DC;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E5FAF6;
  --hov:#F0FDFA;
  --track:#D8F3EE;
  --sidebar:#083F3B;
  --sidebar2:#0B514B;
  --side-edge:rgba(255,255,255,.14);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:4px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(19,78,74,.07);
  --shadow-hover:0 2px 4px rgba(15,23,42,.08),0 14px 30px rgba(19,78,74,.11);
  --glow:rgba(13,148,136,.22);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--bg);
  background-size:40px 40px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.kpi .val,.stat .val,.tile .tv{
  font-family:"Cinzel","Noto Sans TC",serif;
  margin:0;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(13,148,136,.18);
}
::selection{background:#99F6E4;color:#042F2E}

.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;
  flex:none;
  min-width:0;
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#F0FDFA;
  display:flex;
  flex-direction:column;
  padding:28px 18px 20px;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid var(--side-edge);
}
.brand{display:flex;align-items:center;gap:13px;padding:0 7px 26px;min-width:0}
.brand-logo{
  width:42px;height:42px;flex:none;border-radius:2px;
  background:var(--color-secondary);
  display:flex;align-items:center;justify-content:center;
  color:#042F2E;
  border:1px solid rgba(255,255,255,.38);
  box-shadow:6px 6px 0 rgba(45,212,191,.15);
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt b{display:block;font-weight:600;font-size:15px;letter-spacing:.08em}
.brand-txt span{display:block;margin-top:2px;font-size:10px;color:#BFEDE7;letter-spacing:.18em}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:5px;min-width:0}
.nav button{
  display:flex;align-items:center;gap:12px;min-width:0;
  background:transparent;border:1px solid transparent;color:#D2F4EF;
  padding:11px 12px;border-radius:2px;font-size:13px;font-weight:500;
  text-align:left;letter-spacing:.03em;white-space:nowrap;
  transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);color:#FFF}
.nav button.on{
  background:var(--color-secondary);border-color:var(--color-secondary);
  color:#042F2E;box-shadow:4px 4px 0 rgba(0,0,0,.16);
}
.nav button.on::before{content:"";width:3px;height:18px;background:#042F2E;flex:none}
.nav .idx{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;opacity:.72;font-weight:700}
.side-foot{margin-top:auto;padding:16px 9px 2px;border-top:1px solid rgba(255,255,255,.16);font-size:11px;color:#BFEDE7;line-height:1.75;letter-spacing:.02em}
.side-foot b{color:#FFF}

.main{flex:1;min-width:0;padding:30px clamp(20px,3vw,42px) 64px}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.topbar h1{font-size:clamp(21px,2vw,29px);font-weight:600;display:flex;align-items:center;gap:11px;letter-spacing:.025em}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:27px}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:5px;letter-spacing:.025em}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.88);
  border:1px solid var(--line);border-radius:999px;padding:7px 12px;
  font-size:12px;font-weight:600;color:var(--muted);box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.14);animation:pulse 2.4s ease-in-out infinite}
.avatar{width:36px;height:36px;border-radius:2px;background:var(--color-accent);color:#2B1600;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;border:1px solid #B45309}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.82)}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);min-width:0;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--color-primary)}
.card,.sec{padding:19px}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:.025em}
.sec>h3{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sec>p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:14px;margin:0}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.card.pad0 .card-h,.card.p0 .card-h{border-bottom:none;margin-bottom:8px}
.card-h .hint{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.03em}

.kpi,.stat,.tile{position:relative;overflow:hidden;padding:17px 18px 16px;border-left:4px solid var(--accent)}
.kpi::after,.tile::after{content:"";position:absolute;right:0;top:0;width:46px;height:3px;background:var(--color-accent)}
.kpi .ico,.tile .ti{
  position:absolute;right:14px;top:13px;width:31px;height:31px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:#0F766E;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{font-size:12px;color:var(--muted);margin-top:0;font-weight:600;display:flex;align-items:center;gap:5px;padding-right:32px}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{
  font-size:clamp(24px,2vw,30px);font-weight:600;letter-spacing:-.02em;margin-top:7px;
  font-variant-numeric:tabular-nums lining-nums;color:#0F3D3A;
}
.kpi .val small,.stat .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .delta,.stat .d{font-size:12px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:4px}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
.tile{display:flex;flex-direction:column;gap:7px}
.tile b{font-size:13px;font-weight:600;padding-right:34px;letter-spacing:.02em}
.tile p{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
.tile .tv{margin-top:0}

.card.pad0>div[style*="overflow-x"],.card.p0>div[style*="overflow-x"]{scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th{
  text-align:left;font-family:"Cinzel","Noto Sans TC",serif;font-weight:600;color:#285B57;
  font-size:11px;padding:12px 14px;border-bottom:2px solid var(--color-primary);
  background:var(--th);letter-spacing:.055em;white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;color:#173F3C}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .2s ease,box-shadow .2s ease}
tbody tr:hover{background:var(--hov);box-shadow:inset 3px 0 0 var(--color-primary)}
.mono,td:first-child{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-weight:600;letter-spacing:.015em;font-variant-numeric:tabular-nums;
}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid currentColor}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:#DCFCE7;color:#166534}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#B91C1C}
.t-info{background:#E0F2FE;color:#075985}
.t-gray{background:#F1F5F9;color:#475569}
.t-acc,.t-pink{background:#CCFBF1;color:#0F766E}

.bar{height:7px;border-radius:0;background:var(--track);overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--color-secondary))}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--muted);font-weight:600;width:38px;flex:none;text-align:right}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--color-primary)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#FFF;border:3px solid var(--accent)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--muted);font-weight:600}
.tl-item b,.tl-i b{font-size:13px;display:block;margin:2px 0;font-family:"Cinzel","Noto Sans TC",serif}
.tl-item p,.tl-i p{margin:0;font-size:12px;color:var(--muted)}

.chk{display:flex;align-items:center;gap:9px;font-size:13px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{background:var(--th);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;font-family:"Cinzel","Noto Sans TC",serif;padding:3px 3px 7px}
.col-h .cnt{background:#FFF;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--muted)}
.pcard{background:#FFF;border:1px solid var(--line);border-radius:2px;padding:12px;border-left:3px solid var(--accent);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.pcard b{font-size:13px;font-family:"Cinzel","Noto Sans TC",serif}
.pcard .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink)}
.mini-av,.av{border-radius:2px;background:var(--accent-soft);color:#0F766E;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:2px;background:#FFF;min-width:0}
.lane-row .num{width:32px;height:32px;flex:none;border-radius:2px;background:var(--accent-soft);color:#0F766E;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:800;font-size:13px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px;font-family:"Cinzel","Noto Sans TC",serif}
.lane-row .body p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:23px;height:23px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#64748B;background:#FFF;z-index:1}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{background:var(--accent);border-color:var(--accent);color:#FFF}
.steps .s.cur{border-color:var(--color-accent);color:#92400E;animation:pulse 1.8s infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px dashed var(--line);min-width:0}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{font-size:13px;font-family:"Cinzel","Noto Sans TC",serif;display:block}
.rep-row .sku span{font-size:11px;color:var(--muted)}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;border-radius:0;background:var(--track);position:relative;overflow:hidden}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;color:var(--muted);display:block;margin-top:4px;text-align:right}
.band{position:relative;height:27px;border-radius:2px;background:var(--track);min-width:150px}
.band .rng{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:21px;border-radius:1px;background:var(--color-accent);box-shadow:0 2px 5px rgba(180,83,9,.25)}

.apexcharts-canvas text{fill:#475569!important;font-family:"Crimson Pro","Noto Sans TC",serif!important}
.apexcharts-gridline{stroke:#C9EDE7!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.apexcharts-legend-text{color:#475569!important}
.apexcharts-series[seriesName]:nth-of-type(1) path{stroke:#0D9488!important}
.apexcharts-series[seriesName]:nth-of-type(2) path{stroke:#2DD4BF!important}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:16px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:2;grid-row:1 / span 99;display:flex;flex-direction:column;gap:13px;position:sticky;top:20px}
  #screen>.grid.g4:first-child>*{width:100%}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:13px 14px;gap:7px}
  .brand{padding:0 12px 0 3px}
  .brand-logo{width:38px;height:38px}
  .side-foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0;flex:1}
  .nav button{padding:9px 11px;min-height:44px}
  .nav .idx{display:none}
  .main{padding:22px 16px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:560px){
  body{font-size:14px;background-size:28px 28px}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button.on::before{display:none}
  .topbar{align-items:flex-start;margin-bottom:18px}
  .topbar h1{font-size:19px}
  .top-right{justify-content:flex-start}
  .chip{min-height:40px}
  .card,.sec{padding:15px}
  .kpi,.stat,.tile{padding:15px 13px}
  .kpi .val,.stat .val,.tile .tv{font-size:21px}
  .kpi .ico,.tile .ti{opacity:.75;right:9px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .brand-txt{display:none}
  .sidebar{flex-wrap:nowrap}
  .nav{flex-wrap:nowrap;justify-content:space-between}
  .nav button{flex:1;justify-content:center;padding:9px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">

var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#f9e8ef",strokeDashArray:4},

function buildNav(){var n=document.getElementById("nav");

 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
