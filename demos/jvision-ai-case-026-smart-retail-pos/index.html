<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>門市收銀庫存管理台</title>
<meta name="description" content="多店門市營運總覽、業績比較、銷售分析、庫存管理、會員行銷與日結報表。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --paper:#FFFFFF;
  --shadow:6px 6px 0 #064E3B;
  --shadow-small:3px 3px 0 #064E3B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(5,150,105,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.08) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Nunito Sans","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:21px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:18px;
  overflow:auto;
  background:var(--color-foreground);
  border-right:4px solid #000;
  color:#fff;
}
.bd{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
  padding:10px;
  background:var(--color-secondary);
  border:3px solid #000;
  box-shadow:5px 5px 0 #000;
  color:#000;
}
.lg{
  display:grid;
  flex:none;
  width:46px;
  height:46px;
  place-items:center;
  background:var(--color-accent);
  border:3px solid #000;
}
.lg .material-symbols-outlined{font-size:27px}
.bd b{
  display:block;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:16px;
  font-weight:900;
  line-height:1.15;
}
.bd span:not(.material-symbols-outlined){
  display:block;
  margin-top:4px;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.2px;
}
.nlabel{
  padding:8px 8px 7px;
  color:#A7F3D0;
  font-family:Rubik,sans-serif;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.7px;
  text-transform:uppercase;
}
#nav{display:grid;gap:7px}
.side button{
  position:relative;
  display:flex;
  width:100%;
  min-height:48px;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  background:transparent;
  border:2px solid transparent;
  border-radius:0;
  color:#D1FAE5;
  font-weight:800;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.side button:hover{
  background:#D1FAE5;
  border-color:#000;
  color:#000;
  transform:translate(-2px,-2px);
}
.side button.on{
  background:var(--color-accent);
  border:3px solid #000;
  box-shadow:4px 4px 0 #000;
  color:#000;
}
.side button.on::after{
  position:absolute;
  right:9px;
  content:"→";
  font:900 18px Rubik,sans-serif;
}
.side .foot{
  margin-top:auto;
  padding:16px 8px 4px;
  border-top:2px solid #34D399;
  color:#D1FAE5;
  font-size:11.5px;
  font-weight:700;
  line-height:1.8;
}
.side .foot b{color:#FDE68A;font-family:Rubik,sans-serif}
.main{min-width:0;padding:26px clamp(18px,3vw,42px) 52px}
.vh{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin:0 0 24px;
  padding:20px 22px;
  background:var(--color-card);
  border:3px solid var(--color-foreground);
  box-shadow:var(--shadow);
}
.vh::before{
  position:absolute;
  top:-3px;
  left:-3px;
  width:92px;
  height:9px;
  background:var(--color-accent);
  border-right:3px solid var(--color-foreground);
  border-bottom:3px solid var(--color-foreground);
  content:"";
}
.vh h2{
  margin:0;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:clamp(24px,3vw,37px);
  font-weight:900;
  letter-spacing:-1px;
  line-height:1;
}
.vh p{
  max-width:680px;
  margin:9px 0 0;
  color:var(--color-muted-foreground);
  font-size:13.5px;
  font-weight:700;
}
.vhr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datechip,.live{
  display:inline-flex;
  min-height:36px;
  align-items:center;
  gap:8px;
  padding:7px 11px;
  border:2px solid var(--color-foreground);
  font-family:Rubik,sans-serif;
  font-size:11px;
  font-weight:900;
}
.datechip{background:#FDE68A;color:#713F12}
.live{background:#D1FAE5;color:#064E3B}
.live i{
  width:10px;
  height:10px;
  background:var(--color-primary);
  border:2px solid #064E3B;
  animation:pulse 1.6s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.3}}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpi,.card,.sb,.mc,.st{
  animation:enter .4s cubic-bezier(.22,1.35,.5,1) both;
}
.kpi:nth-child(2),.card:nth-child(2),.sb:nth-child(2),.mc:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3),.sb:nth-child(3),.mc:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4),.sb:nth-child(4),.mc:nth-child(4){animation-delay:.18s}
@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.94)}
  to{opacity:1;transform:none}
}
.kpi{
  position:relative;
  min-height:142px;
  padding:17px;
  overflow:hidden;
  background:var(--color-card);
  border:3px solid var(--color-foreground);
  box-shadow:var(--shadow-small);
}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi::after{
  position:absolute;
  right:-22px;
  bottom:-25px;
  width:75px;
  height:75px;
  background:var(--color-secondary);
  border:3px solid var(--color-foreground);
  content:"";
  transform:rotate(16deg);
}
.kpi .l{
  position:relative;
  z-index:1;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:900;
  letter-spacing:.4px;
}
.kpi .v{
  position:relative;
  z-index:1;
  margin-top:7px;
  font:900 clamp(25px,2.3vw,34px) Rubik,sans-serif;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{font-size:13px;font-weight:800}
.kpi .d{
  position:relative;
  z-index:1;
  margin-top:6px;
  font-size:11px;
  font-weight:900;
}
.kpi .ic{
  position:absolute;
  z-index:1;
  top:14px;
  right:14px;
  display:grid;
  width:34px;
  height:34px;
  place-items:center;
  background:#D1FAE5;
  border:2px solid var(--color-foreground);
  color:var(--color-foreground);
}
.up{color:var(--ok)}
.dn{color:var(--bad)}
.grid{display:grid;gap:17px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  position:relative;
  min-width:0;
  padding:19px;
  background:var(--color-card);
  border:3px solid var(--color-foreground);
  box-shadow:var(--shadow);
}
.card:nth-child(even){box-shadow:-6px 6px 0 var(--color-primary)}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 17px;
  padding-bottom:11px;
  border-bottom:3px solid var(--color-foreground);
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:15px;
  font-weight:900;
  line-height:1.35;
}
.card h3 .material-symbols-outlined{
  display:grid;
  width:31px;
  height:31px;
  flex:none;
  place-items:center;
  background:var(--color-accent);
  border:2px solid var(--color-foreground);
  color:#000;
}
.tag,.tier{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:900;
  line-height:1.1;
  white-space:nowrap;
}
.t-ok{background:#D1FAE5;color:#065F46}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#DBEAFE;color:#1E40AF}
.t-gold{background:#FEF3C7;color:#92400E}
.t-plat{background:#EDE9FE;color:#5B21B6}
.t-slv{background:#F1F5F9;color:#334155}
table.data{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12.5px;
  font-variant-numeric:tabular-nums;
}
table.data th,table.data td{
  padding:11px 12px;
  border-right:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);
  text-align:left;
  white-space:nowrap;
}
table.data th:first-child,table.data td:first-child{border-left:2px solid var(--color-foreground)}
table.data th:last-child,table.data td:last-child{border-right:2px solid var(--color-foreground)}
table.data th{
  background:var(--color-foreground);
  border-color:#34D399;
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.3px;
}
table.data tr:first-child th{border-top:2px solid var(--color-foreground)}
table.data tr:last-child td{border-bottom:2px solid var(--color-foreground)}
table.data tr:nth-child(even) td{background:#F0FDF4}
table.data td:not(:first-child){font-variant-numeric:tabular-nums}
table.data td:nth-last-child(2){text-align:right}
table.data tr:hover td{background:#D1FAE5}
.rank{
  display:inline-grid;
  width:27px;
  height:27px;
  flex:none;
  place-content:center;
  background:#D1FAE5;
  border:2px solid var(--color-foreground);
  color:var(--color-foreground);
  font:900 12px Rubik,sans-serif;
}
.rank.top{background:var(--color-accent);color:#000}
.chart{height:270px}
.scroll{overflow-x:auto;padding-bottom:2px}
.bar{
  height:12px;
  overflow:hidden;
  background:var(--color-muted);
  border:2px solid var(--color-foreground);
}
.bar i{
  display:block;
  height:100%;
  background:var(--color-primary);
}
.board{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(225px,1fr));
  gap:16px;
}
.sb{
  min-width:0;
  padding:15px;
  background:#F0FDF4;
  border:3px solid var(--color-foreground);
  box-shadow:4px 4px 0 var(--color-primary);
}
.sb:nth-child(3n+2){background:#FFF7ED;box-shadow:4px 4px 0 var(--color-accent)}
.sb .sh{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:12px}
.sb .sh b{font-size:14px;font-weight:900}
.sb .rev{
  font:900 24px Rubik,sans-serif;
  letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;
}
.sb .sub{margin-top:3px;color:var(--color-muted-foreground);font-size:11px;font-weight:700}
.sb .prog{margin-top:13px}
.sb .prog .pt{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:5px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:900;
}
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{
  display:grid;
  min-width:570px;
  grid-template-columns:44px repeat(12,minmax(32px,1fr));
  gap:4px;
}
.hcell{
  display:grid;
  aspect-ratio:1;
  place-items:center;
  border:1px solid var(--color-foreground);
  font:900 9px Rubik,sans-serif;
}
.hhead,.hrow{
  display:grid;
  place-items:center;
  color:var(--color-muted-foreground);
  font:900 10px Rubik,sans-serif;
}
.legend{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:13px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:800;
  flex-wrap:wrap;
}
.legend .lb{width:18px;height:14px;border:1px solid var(--color-foreground)}
.mem{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
}
.mc{
  min-width:0;
  padding:15px;
  background:#F0FDF4;
  border:3px solid var(--color-foreground);
  box-shadow:4px 4px 0 var(--color-secondary);
}
.mc:nth-child(2n){background:#FFF7ED;box-shadow:4px 4px 0 var(--color-accent)}
.mc-t{display:flex;align-items:center;gap:10px}
.mc-av{
  display:grid;
  width:41px;
  height:41px;
  flex:none;
  place-content:center;
  background:var(--color-primary);
  border:2px solid var(--color-foreground);
  color:#fff;
  font:900 16px Rubik,sans-serif;
}
.mc-t b{font-weight:900}
.mc-t small{display:block;color:var(--color-muted-foreground);font-size:10.5px;font-weight:700}
.mc-row{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:11px;border-top:2px solid var(--color-foreground)}
.mc-row div span{display:block;color:var(--color-muted-foreground);font-size:10.5px;font-weight:800}
.mc-row div b{color:var(--color-primary);font:900 17px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.rep{display:flex;flex-direction:column;gap:10px}
.ri{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 13px;
  background:#FEF2F2;
  border:2px solid var(--color-foreground);
  border-left:9px solid var(--color-destructive);
}
.ri::before{
  flex:none;
  content:"!";
  color:#991B1B;
  font:900 15px Rubik,sans-serif;
}
.ri.w{background:#FFFBEB;border-left-color:#D97706}
.ri.w::before{content:"△";color:#92400E}
.ri.o{background:#ECFDF5;border-left-color:var(--color-primary)}
.ri.o::before{content:"✓";color:#065F46}
.ri .rank{margin-left:-4px}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-weight:900}
.ri .mid small{display:block;color:var(--color-muted-foreground);font-size:11.5px;font-weight:700}
.ri .qty{flex:none;text-align:right}
.ri .qty b{color:var(--color-primary);font:900 16px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.ri .qty small{display:block;color:var(--color-muted-foreground);font-size:10px;font-weight:800}
.settle{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:12px;
}
.st{
  padding:14px;
  background:#D1FAE5;
  border:3px solid var(--color-foreground);
}
.st:nth-child(2n){background:#FFF7ED}
.st .l{color:var(--color-muted-foreground);font-size:11px;font-weight:900}
.st .v{
  margin-top:5px;
  font:900 20px Rubik,sans-serif;
  font-variant-numeric:tabular-nums;
}
.mono,table.data td:first-child{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
@media(max-width:1024px){
  .shell{grid-template-columns:224px minmax(0,1fr)}
  .main{padding-inline:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g11{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}
  .side{
    position:relative;
    height:auto;
    padding:13px;
    border-right:0;
    border-bottom:4px solid #000;
  }
  .bd{margin-bottom:12px}
  #nav{
    display:flex;
    gap:8px;
    padding:3px 3px 8px;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .side button{width:auto;min-width:max-content}
  .side button.on::after{display:none}
  .nlabel,.side .foot{display:none}
  .main{padding:20px 16px 44px}
  .vh{align-items:flex-start;flex-direction:column}
}
@media(max-width:520px){
  .kpis{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
  .vh{padding:18px 15px}
  .vh h2{font-size:27px}
  .card{padding:14px}
  .card h3{align-items:flex-start}
  .chart{height:245px}
  .ri{align-items:flex-start}
  .ri .qty{max-width:84px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="主要導覽">
    <div class="bd">
      <div class="lg" aria-hidden="true"><span class="material-symbols-outlined">point_of_sale</span></div>
      <div><b>門市收銀庫存管理台</b><span>RETAIL CONTROL DESK</span></div>
    </div>
    <div class="nlabel">經營分析 / Operations</div>
    <div id="nav"></div>
    <div class="foot">全台 <b>18</b> 家門市 · 會員 <b>42,860</b><br/>今日總營收 <b>$1,284,500</b><br/>資料更新 08-13 21:40</div>
  </aside>
  <main class="main">
    <header class="vh">
      <div><h2 id="vt"></h2><p id="vd"></p></div>
      <div class="vhr">
        <span class="datechip">2026-08-13</span>
        <span class="live"><i aria-hidden="true"></i>各店即時同步</span>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<script>
var MOD=[
 ["營運總覽","dashboard","營運總覽","多店營收、客流與達成率的即時經營戰情"],
 ["多店業績比較","storefront","多店業績比較","各分店業績排行、同期成長與客單價對比"],
 ["銷售分析","insights","銷售分析","熱銷排行與時段×星期客流熱力圖"],
 ["庫存進銷","inventory_2","庫存進銷","各店可售天數與 AI 智慧補貨建議"],
 ["會員行銷","loyalty","會員行銷","會員分層、回購率與行銷活動成效"],
 ["日結報表","summarize","日結報表","日結對帳、支付核對與經營結算報表"]
];
var money=function(n){return "$"+n.toLocaleString();};
var nav=document.getElementById("nav");
var view=document.getElementById("view");
var vt=document.getElementById("vt");
var vd=document.getElementById("vd");

MOD.forEach(function(m,i){
  var b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
