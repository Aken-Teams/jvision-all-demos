<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>批次/批號管理系統 Lot/Batch Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#0369a1; --accent2:#38bdf8; --ink:#0f2233; --mut:#5c7185;
  --line:#e2ebf1; --bg:#f2f7fb; --card:#ffffff; --soft:#eef6fc;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --lock:#7c3aed;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
.app{display:flex; min-height:100vh; align-items:stretch;}
.side{
  width:246px; flex:none; background:linear-gradient(180deg,#ffffff,#f6fbff);
  border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:0; height:100vh; overflow:auto; min-width:0;
}
.brand{display:flex; gap:11px; align-items:center; padding:6px 8px 14px;}
.brand .logo{
  width:42px; height:42px; border-radius:12px; flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid; place-items:center; color:#fff; box-shadow:0 6px 16px rgba(3,105,161,.28);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-family:"Noto Sans TC";font-weight:900;font-size:15px;line-height:1.2;letter-spacing:.2px;}
.brand span{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:2px;letter-spacing:.4px;}
.navlbl{font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:1.2px;padding:10px 10px 4px;text-transform:uppercase;}
nav{display:flex; flex-direction:column; gap:4px; min-width:0;}
.nav-btn{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px;
  border:1px solid transparent; background:transparent; cursor:pointer; text-align:left;
  color:var(--mut); font-family:inherit; font-size:13.5px; font-weight:600; width:100%; min-width:0;
  transition:background .15s,color .15s,border-color .15s;
}
.nav-btn .material-symbols-outlined{font-size:21px; flex:none;}
.nav-btn .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.nav-btn small{display:block;font-size:10.5px;font-weight:500;color:#9db0bf;margin-top:1px;}
.nav-btn:hover{background:var(--soft); color:var(--accent);}
.nav-btn.on{background:linear-gradient(135deg,var(--accent),#0284c7); color:#fff; box-shadow:0 5px 14px rgba(3,105,161,.3);}
.nav-btn.on small{color:rgba(255,255,255,.8);}
.side-foot{margin-top:auto; padding:12px 10px 4px; font-size:11px; color:var(--mut); border-top:1px dashed var(--line);}
.side-foot b{color:var(--accent);}
.main{flex:1 1 auto; min-width:0; padding:22px 26px 40px;}
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
.topbar .h{min-width:0;}
.topbar h1{font-family:"Noto Sans TC";font-weight:900;font-size:21px;margin:0;letter-spacing:.3px;}
.topbar p{margin:3px 0 0;color:var(--mut);font-size:12.5px;font-weight:500;}
.topbar .spacer{flex:1 1 auto;}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--accent);}
.chip .material-symbols-outlined{font-size:17px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.15);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.5fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;min-width:0;box-shadow:0 1px 2px rgba(15,34,51,.03);}
.card h3{margin:0 0 3px;font-family:"Noto Sans TC";font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--mut);margin:0 0 13px;font-weight:500;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .lab .material-symbols-outlined{font-size:19px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:800;font-family:"Inter";margin:9px 0 2px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--mut);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta.up{color:var(--ok);} .kpi .delta.dn{color:var(--bad);} .kpi .delta.fl{color:var(--mut);}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%);}
.tbl-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px;}
thead th{background:var(--soft);color:var(--accent);font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap;font-size:11.5px;letter-spacing:.3px;border-bottom:1px solid var(--line);}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f8fcff;}
.mono{font-family:"Inter";font-weight:700;letter-spacing:.3px;color:var(--accent);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{background:#e6f7ee;color:var(--ok);} .t-warn{background:#fdf1e0;color:var(--warn);}
.t-bad{background:#fdeaea;color:var(--bad);} .t-run{background:#e6f2fb;color:var(--accent);}
.t-lock{background:#f0eafd;color:var(--lock);} .t-mut{background:#eef2f5;color:var(--mut);}
.bar{height:7px;border-radius:5px;background:#e9f1f6;overflow:hidden;min-width:70px;}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.col h4 .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--accent);}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,34,51,.04);}
.tk:last-child{margin-bottom:0;}
.tk .id{font-weight:800;font-size:12.5px;color:var(--accent);font-family:"Inter";}
.tk .meta{font-size:11px;color:var(--mut);margin-top:3px;display:flex;justify-content:space-between;gap:6px;}
.tk .lbar{border-left:3px solid var(--accent);padding-left:8px;margin-top:7px;font-size:11px;color:var(--ink);}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:var(--line);}
.tl-i{position:relative;padding:0 0 15px;}
.tl-i:last-child{padding-bottom:0;}
.tl-i::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl-i.done::before{background:var(--accent);}
.tl-i .tt{font-size:12.5px;font-weight:700;}
.tl-i .td{font-size:11.5px;color:var(--mut);margin-top:2px;}
.tree{display:flex;flex-direction:column;gap:0;min-width:440px;}
.node{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative;}
.node .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;}
.node .ic .material-symbols-outlined{font-size:18px;}
.node b{font-family:"Inter";font-size:13px;} .node .d{font-size:11px;color:var(--mut);}
.branch{margin-left:34px;padding-left:20px;border-left:2px dashed var(--accent2);display:flex;flex-direction:column;gap:11px;padding-top:11px;padding-bottom:2px;}
.rack{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;min-width:420px;}
.cell{aspect-ratio:1/1;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;position:relative;font-family:"Inter";}
.cell.e{background:#eef4f8;color:#9db0bf;border:1px dashed #cdd9e2;}
.cell.f{background:linear-gradient(135deg,var(--accent),#0284c7);}
.cell.h{background:linear-gradient(135deg,var(--warn),#f59e0b);}
.cell.l{background:linear-gradient(135deg,var(--lock),#8b5cf6);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;}
.alist{display:flex;flex-direction:column;gap:10px;}
.arow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;}
.arow .ac{width:34px;height:34px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--accent);flex:none;}
.arow .ac .material-symbols-outlined{font-size:20px;}
.arow .info{min-width:0;flex:1;} .arow .info b{font-size:12.5px;} .arow .info div{font-size:11px;color:var(--mut);}
.arow .sc{font-size:16px;font-weight:800;font-family:"Inter";}
.field{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px;background:#fafdff;}
.field label{font-size:11px;color:var(--mut);font-weight:600;display:block;}
.field .v{font-size:13.5px;font-weight:700;margin-top:3px;font-family:"Inter";}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.pill{border:1px solid var(--accent2);color:var(--accent);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;}
.btnp{background:linear-gradient(135deg,var(--accent),#0284c7);color:#fff;border:none;border-radius:10px;padding:11px;font-family:inherit;font-weight:700;font-size:13px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;box-shadow:0 5px 14px rgba(3,105,161,.28);}
.btnp .material-symbols-outlined{font-size:18px;}
.split-note{font-size:11px;color:var(--mut);margin-top:8px;display:flex;align-items:center;gap:6px;}
.split-note .material-symbols-outlined{font-size:15px;color:var(--warn);}
.metricrow{display:flex;gap:12px;flex-wrap:wrap;}
.metricrow .m{flex:1;min-width:0;text-align:center;background:var(--soft);border-radius:11px;padding:12px 8px;}
.metricrow .m .v{font-size:20px;font-weight:800;font-family:"Inter";color:var(--accent);}
.metricrow .m .l{font-size:11px;color:var(--mut);margin-top:2px;}
.donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
@media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:960px){.g23,.g32,.g3{grid-template-columns:1fr;}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:auto;height:auto;position:static;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);}
  .side-foot{display:none;}
  nav{flex-direction:row;flex-wrap:wrap;}
  .nav-btn{width:auto;flex:none;white-space:nowrap;}
  .nav-btn small{display:none;}
  .navlbl{width:100%;padding:6px 6px 2px;}
}
@media(max-width:820px){.g2,.g4,.board{grid-template-columns:1fr;}}
@media(max-width:560px){
  .nav-btn .txt{display:none;}
  .brand span{display:none;}
  .main{padding:16px 14px 34px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
      <div><b>批次履歷平台</b><span>LOT / BATCH MGMT</span></div>
    </div>
    <div class="navlbl">作業模組</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      MES 製造執行系統整合<br/>資料同步 <b>WMS · 追溯系統</b><br/>© 2026 智慧製造示範
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="h">
        <h1 id="scr-title">投料建批</h1>
        <p id="scr-sub">領料投入產生批號、綁定物料與規格</p>
      </div>
      <div class="spacer"></div>
      <span class="chip"><span class="dot"></span>現場即時連線</span>
      <span class="chip"><span class="material-symbols-outlined">calendar_today</span>2026-08-13</span>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
var MODULES=[
  {icon:"add_box",name:"投料建批",desc:"領料投入產生批號、綁定物料與規格"},
  {icon:"call_split",name:"拆批併批",desc:"批次拆分、合併並自動延續父子批號"},
  {icon:"track_changes",name:"批次狀態追蹤",desc:"在製、暫存、鎖定、報廢即時看板"},
  {icon:"account_tree",name:"批次履歷譜系",desc:"父子批號正逆向追溯與斷鏈告警"},
  {icon:"warehouse",name:"完工入庫",desc:"批次結批、儲位分配與入庫確認"},
  {icon:"fact_check",name:"履歷歸檔稽核",desc:"批次週轉與履歷完整率稽核報表"}
];

function tag(cls,ic,txt){return '<span class="tag '+cls+'">'+(ic?'<span class="material-symbols-outlined">'+ic+'</span>':'')+txt+'</span>';}
function barCell(p){return '<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><b style="font-size:11.5px;font-family:Inter">'+p+'%</b></div>';}
function kpi(lab,val,ic,dir,dtxt,unit){
  var da=dir==='up'?'up':dir==='dn'?'dn':'fl';var arr=dir==='up'?'trending_up':dir==='dn'?'trending_down':'trending_flat';
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'
    +'<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
    +'<div class="delta '+da+'"><span class="material-symbols-outlined">'+arr+'</span>'+dtxt+'</div></div>';
}
function node(col,ic,name,d){
  return '<div class="node"><div class="ic" style="background:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div><div><b>'+name+'</b><div class="d">'+d+'</div></div></div>';
}

var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
function mkChart(node,opt){if(!node)return;var c=new ApexCharts(node,opt);c.render();CHARTS.push(c);}
var BASEFONT='Inter, "Noto Sans TC", sans-serif';
function baseOpt(extra){
  var o={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:BASEFONT,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    dataLabels:{enabled:false},grid:{borderColor:'#eef2f5',strokeDashArray:4},
    legend:{fontSize:'12px',labels:{colors:'#5c7185'}},tooltip:{style:{fontSize:'12px'}}};
  for(var k in extra){o[k]=extra[k];}return o;
}

/* ===== SCREEN 0 : 投料建批 ===== */
function s0(c){
  c.innerHTML=''
  +'<div class="grid g4" style="margin-bottom:16px">'
    +kpi("今日新建批號","28","batch_prediction","up","+6 vs 昨日","筆")
    +kpi("投料領用單","41","local_shipping","up","+9","張")
    +kpi("待覆核建批","5","pending_actions","fl","持平","筆")
    +kpi("建批平均耗時","3.2","timer","dn","-0.8 分","分/批")
  +'</div>'
  +'<div class="grid g32">'
    +'<div class="card">'
      +'<h3><span class="material-symbols-outlined">add_box</span>快速投料建批</h3>'
      +'<p class="sub">依工單領料投入，系統自動配發批號</p>'
      +'<div class="field"><label>來源工單</label><div class="v">WO-2608-0417 · 鋁合金外殼 A3</div></div>'
      +'<div class="field"><label>投入物料 / 規格</label><div class="v">6061-T6 · 板厚 3.0mm</div>'
        +'<div class="pill-row"><span class="pill">批量 500 pcs</span><span class="pill">爐號 M-0812</span></div></div>'
      +'<div class="field"><label>將配發批號</label><div class="v mono" style="color:var(--accent)">LOT-260813-A3-07</div></div>'
      +'<button class="btnp"><span class="material-symbols-outlined">qr_code_2</span>產生批號並列印標籤</button>'
      +'<div class="split-note"><span class="material-symbols-outlined">info</span>建批後將自動綁定物料規格與履歷起點</div>'
    +'</div>'
    +'<div class="card">'
      +'<h3><span class="material-symbols-outlined">receipt_long</span>近期建批紀錄</h3>'
      +'<p class="sub">最新投料建批，含物料綁定與初始數量</p>'
      +'<div class="tbl-wrap"><table><thead><tr>'
        +'<th>批號</th><th>物料</th><th>工單</th><th>數量</th><th>狀態</th><th>時間</th></tr></thead><tbody>'
        +s0rows()
      +'</tbody></table></div>'
    +'</div>'
  +'</div>'
  +'<div class="grid g2" style="margin-top:16px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>近 7 日建批量趨勢</h3><p class="sub">依班別統計建批筆數</p><div id="c0a"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>投料物料類別占比</h3><p class="sub">本日建批物料分布</p><div class="donut-wrap"><div id="c0b"></div></div></div>'
  +'</div>';
  void c.offsetHeight;
  mkChart(document.querySelector('#c0a'),baseOpt({
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'bar',height:230,stacked:true},
    series:[{name:'早班',data:[12,15,11,14,16,10,13]},{name:'中班',data:[9,11,8,12,10,9,11]},{name:'夜班',data:[5,6,4,7,5,6,4]}],
    xaxis:{categories:['08/07','08/08','08/09','08/10','08/11','08/12','08/13'],labels:{style:{fontSize:'11px'}}},
    colors:['#0369a1','#38bdf8','#7dd3fc'],plotOptions:{bar:{columnWidth:'52%',borderRadius:3}},
    yaxis:{labels:{style:{fontSize:'11px'}}}
  }));
  mkChart(document.querySelector('#c0b'),baseOpt({
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'donut',height:230},
    series:[42,26,18,14],labels:['鋁合金','工程塑膠','不鏽鋼','電子件'],
    colors:['#0369a1','#38bdf8','#7dd3fc','#bae6fd'],
    plotOptions:{pie:{donut:{size:'62%',labels:{show:true,total:{show:true,label:'今日建批',fontSize:'12px',formatter:function(){return '28 批';}}}}}},
    legend:{position:'right',fontSize:'12px'}
  }));
}

function rackMap(){

  var labs=['A','B','C','D','E'];
  var h='<div class="rack" style="min-width:420px">';
  for(var r=0;r<pat.length;r++){
    var row=pat[r];
    for(var col=0;col<8;col++){
      var t=row.charAt(col);var lab=(t==='e')?'':labs[r]+'-'+(col+1);
      h+='<div class="cell '+t+'">'+lab+'</div>';
    }
  }
  return h+'</div>';
}

  }));
  mkChart(document.querySelector('#c5b'),baseOpt({

}
function arow(ic,t,d,sc){
  var col=(+sc>=99?'var(--ok)':+sc>=97?'var(--accent)':'var(--warn)');
  return '<div class="arow"><div class="ac"><span class="material-symbols-outlined">'+ic+'</span></div>'
    +'<div class="info"><b>'+t+'</b><div>'+d+'</div></div>'
    +'<div class="sc" style="color:'+col+'">'+sc+'<span style="font-size:11px">%</span></div></div>';
}
function s5rows(){
  var d=[
    ['LOT-260812-E4-10','2.1天','99.4','ok','08/12'],
    ['LOT-260812-A3-01','1.8天','98.9','ok','08/12'],
    ['LOT-260811-P1-05','2.6天','97.2','warn','08/11'],
    ['LOT-260811-S2-04','3.4天','94.1','bad','08/11'],
    ['LOT-260810-E4-07','2.2天','98.6','ok','08/10'],
    ['LOT-260810-A3-03','1.9天','99.1','ok','08/10']
  ];
  var s={ok:['t-ok','check_circle','通過'],warn:['t-warn','error','複核'],bad:['t-bad','close','退回']};
  return d.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'%</td><td>'+tag(s[r[3]][0],s[r[3]][1],s[r[3]][2])+'</td><td>'+r[4]+'</td></tr>';}).join('');
}

/* ===== render engine ===== */
var RENDER=[s0,s1,s2,s3,s4,s5];
var container=document.getElementById('screen');
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle('on',+btns[b].getAttribute('data-i')===i);}
  document.getElementById('scr-title').textContent=MODULES[i].name;
  document.getElementById('scr-sub').textContent=MODULES[i].desc;
  RENDER[i](container);
}
(function(){
  var nav=document.getElementById('nav');
  var html='';
  for(var i=0;i<MODULES.length;i++){
    html+='<button class="nav-btn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span>'
      +'<span class="txt">'+MODULES[i].name+'<small>'+MODULES[i].desc+'</small></span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll('[data-i]');
  for(var j=0;j<btns.length;j++){(function(b){b.addEventListener('click',function(){show(+b.getAttribute('data-i'));try{window.scrollTo(0,0);}catch(e){}});})(btns[j]);}
})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
