<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批次/批號管理系統 Lot/Batch Management System</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#16A34A;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#A8B5C8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#FFFFFF;
  --color-ring:#FFFFFF;
  --blue:#16A34A;
  --ink:#F8FAFC;
  --muted:#A8B5C8;
  --line:#334155;
  --accent:var(--color-accent);
  --accent2:#4ADE80;
  --bg:var(--color-background);
  --card:var(--color-card);
  --soft:var(--color-muted);
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#F87171;
  --lock:#C084FC;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(51,65,85,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.22) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Inter",sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:none;
  flex-direction:column;
  width:272px;
  height:100vh;
  overflow:auto;
  padding:0;
  border-right:2px solid var(--line);
  background:#070B16;
}
.brand{
  display:flex;
  min-height:104px;
  align-items:center;
  gap:14px;
  padding:20px 18px;
  border-bottom:2px solid var(--line);
}
.brand .logo{
  display:grid;
  width:50px;
  height:50px;
  flex:none;
  place-items:center;
  border:2px solid var(--accent);
  background:var(--accent);
  color:#020617;
  box-shadow:7px 7px 0 #0B3B20;
}
.brand .logo .material-symbols-outlined{font-size:28px}
.brand b{
  display:block;
  max-width:150px;
  font-size:16px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  letter-spacing:.12em;
}
.navlbl{
  padding:17px 18px 8px;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
}
nav{display:flex;min-width:0;flex-direction:column}
.nav-btn{
  position:relative;
  display:flex;
  width:100%;
  min-width:0;
  align-items:center;
  gap:12px;
  padding:15px 17px;
  border:0;
  border-top:1px solid transparent;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  transition:background-color .16s ease,color .16s ease,transform .16s ease;
}
.nav-btn:hover{background:#131A2B;color:#fff}
.nav-btn.on{
  background:var(--accent);
  color:#020617;
  font-weight:800;
  transform:translateX(5px);
  box-shadow:-5px 0 0 #fff;
}
.nav-btn .material-symbols-outlined{flex:none;font-size:22px}
.nav-btn .txt{
  min-width:0;
  overflow:hidden;
  font-size:13px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav-btn small{
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:inherit;
  font-size:10px;
  font-weight:500;
  opacity:.78;
  text-overflow:ellipsis;
}
.side-foot{
  margin-top:auto;
  padding:18px;
  border-top:2px solid var(--line);
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  line-height:1.8;
}
.side-foot b{color:var(--accent)}
.main{min-width:0;flex:1;padding:24px 28px 48px}
.topbar{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin:-24px -28px 22px;
  padding:21px 28px;
  border-bottom:2px solid var(--line);
  background:rgba(2,6,23,.94);
}
.topbar .h{min-width:0}
.topbar h1{
  margin:0;
  font-size:clamp(22px,2.4vw,34px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.04em;
}
.topbar h1::before{
  content:"OPS / ";
  color:var(--accent);
  font-family:"JetBrains Mono",monospace;
  font-size:.38em;
  letter-spacing:.08em;
  vertical-align:top;
}
.topbar p{margin:8px 0 0;color:var(--muted);font-size:12px}
.topbar .spacer{flex:1}
.chip{
  display:inline-flex;
  min-height:38px;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:0;
  background:var(--card);
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.chip .material-symbols-outlined{font-size:16px;color:var(--accent)}
.dot{
  width:9px;
  height:9px;
  border:2px solid #052E16;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 2px var(--ok);
  animation:pulse 2s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.45}}
#screen{animation:screenIn .35s ease-out both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}}
.grid{display:grid;min-width:0;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:1.55fr 1fr}
.g32{grid-template-columns:1fr 1.45fr}
.card{
  position:relative;
  min-width:0;
  padding:17px;
  border:2px solid var(--line);
  border-radius:0;
  background:var(--card);
  box-shadow:7px 7px 0 rgba(0,0,0,.35);
}
.card::before{
  content:"";
  position:absolute;
  top:-2px;
  left:-2px;
  width:42px;
  height:4px;
  background:var(--accent);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:11px}
.kpi{min-height:145px;overflow:hidden}
.kpi:nth-child(even){transform:translateY(7px)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.kpi .lab .material-symbols-outlined{color:var(--accent);font-size:20px}
.kpi .val{
  margin:14px 0 7px;
  font-size:32px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.05em;
  line-height:1;
}
.kpi .val small{margin-left:5px;color:var(--muted);font-size:11px;letter-spacing:0}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 6px;
  border:1px solid currentColor;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:700;
}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.dn{color:var(--bad)}
.kpi .delta.fl{color:var(--muted)}
.kpi .delta .material-symbols-outlined{font-size:14px}
.kpi::after{
  content:attr(data-index);
  position:absolute;
  right:9px;
  bottom:-17px;
  color:rgba(255,255,255,.035);
  font-family:"Playfair Display",serif;
  font-size:78px;
  font-style:italic;
}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
thead th{
  padding:10px 12px;
  border-right:1px solid #0F172A;
  border-bottom:2px solid var(--line);
  background:#1E293B;
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  text-align:left;
  text-transform:none;
  white-space:nowrap;
}
thead th:last-child{border-right:0}
tbody td{
  padding:10px 12px;
  border-right:1px solid rgba(51,65,85,.55);
  border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
tbody td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#111629}
tbody tr:hover{background:#182137}
tbody td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono,
td:first-child,
.field .v{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.mono{color:#86EFAC;font-size:11px;font-weight:700}
.tag{
  display:inline-flex;
  min-height:24px;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.tag .material-symbols-outlined{font-size:14px}
.t-ok{background:#052E16;color:#86EFAC}
.t-warn{background:#422006;color:#FDE68A}
.t-bad{background:#450A0A;color:#FCA5A5}
.t-run{background:#052E16;color:#86EFAC}
.t-lock{background:#2E1065;color:#D8B4FE}
.t-mut{background:#1E293B;color:#CBD5E1}
.bar{height:9px;min-width:72px;overflow:hidden;border:1px solid var(--line);background:#020617}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,#15803D 8px 11px)}
.board{display:grid;min-width:0;grid-template-columns:repeat(4,1fr);gap:10px}
.col{min-width:0;padding:10px;border:1px solid var(--line);background:#090D1A}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
  padding-bottom:9px;
  border-bottom:2px solid var(--line);
  font-size:11px;
  font-weight:800;
}
.col h4 .n{
  min-width:24px;
  padding:2px 6px;
  border:1px solid var(--accent);
  background:var(--accent);
  color:#020617;
  font-family:"JetBrains Mono",monospace;
  text-align:center;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  border:1px solid var(--line);
  background:var(--card);
}
.tk:last-child{margin-bottom:0}
.tk .id{color:#86EFAC;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700}
.tk .meta{
  display:flex;
  justify-content:space-between;
  gap:6px;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}
.tk .lbar{margin-top:8px;padding-left:7px;border-left:3px solid var(--accent);font-size:10px}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{
  content:"";
  position:absolute;
  top:2px;
  left:-23px;
  width:12px;
  height:12px;
  border:3px solid var(--accent);
  background:var(--card);
}
.tl-i.done::before{background:var(--accent)}
.tl-i .tt{font-size:12px;font-weight:800}
.tl-i .td{margin-top:3px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10px}
.tree{display:flex;min-width:440px;flex-direction:column}
.node{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--line);
  background:#090D1A;
}
.node .ic{display:grid;width:34px;height:34px;flex:none;place-items:center;color:#020617}
.node .ic .material-symbols-outlined{font-size:19px}
.node b{font-family:"JetBrains Mono",monospace;font-size:11px}
.node .d{margin-top:3px;color:var(--muted);font-size:10px}
.branch{
  display:flex;
  margin-left:34px;
  padding:10px 0 1px 20px;
  flex-direction:column;
  gap:10px;
  border-left:2px dashed var(--accent);
}
.rack{display:grid;min-width:420px;grid-template-columns:repeat(8,1fr);gap:6px}
.cell{
  position:relative;
  display:grid;
  aspect-ratio:1;
  place-items:center;
  border:1px solid var(--line);
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-weight:700;
}
.cell.e{border-style:dashed;background:#111827;color:#94A3B8}
.cell.f{background:#166534;color:#fff}
.cell.h{background:#92400E;color:#fff}
.cell.l{background:#6B21A8;color:#fff}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:13px;height:13px;border:1px solid currentColor}
.alist{display:flex;flex-direction:column;gap:8px}
.arow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--line);
  background:#090D1A;
}
.arow .ac{display:grid;width:34px;height:34px;flex:none;place-items:center;border:1px solid var(--accent);color:var(--accent)}
.arow .ac .material-symbols-outlined{font-size:19px}
.arow .info{min-width:0;flex:1}
.arow .info b{font-size:11px}
.arow .info div{color:var(--muted);font-size:10px}
.arow .sc{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:800}
.field{
  margin-bottom:10px;
  padding:11px;
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  background:#090D1A;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.field .v{margin-top:5px;color:var(--ink);font-size:12px;font-weight:700}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{padding:4px 8px;border:1px solid var(--accent);border-radius:0;background:#052E16;color:#86EFAC;font-size:10px;font-weight:700}
.btnp{
  display:flex;
  width:100%;
  min-height:46px;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px;
  border:2px solid #4ADE80;
  border-radius:0;
  background:var(--accent);
  color:#020617;
  box-shadow:5px 5px 0 #064E3B;
  font-weight:800;
  transition:background-color .16s ease,transform .16s ease,box-shadow .16s ease;
}
.btnp:hover{background:#4ADE80;transform:translate(2px,2px);box-shadow:3px 3px 0 #064E3B}
.btnp:active{transform:translate(5px,5px);box-shadow:none}
.btnp .material-symbols-outlined{font-size:19px}
.split-note{display:flex;align-items:flex-start;gap:6px;margin-top:10px;color:var(--muted);font-size:10px}
.split-note .material-symbols-outlined{color:var(--warn);font-size:15px}
.metricrow{display:flex;gap:8px;flex-wrap:wrap}
.metricrow .m{min-width:0;flex:1;padding:10px 6px;border:1px solid var(--line);background:#090D1A;text-align:center}
.metricrow .m .v{color:#86EFAC;font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:800}
.metricrow .m .l{margin-top:3px;color:var(--muted);font-size:9px}
.donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.apexcharts-text,.apexcharts-legend-text{fill:#A8B5C8!important;color:#A8B5C8!important}
.apexcharts-gridline{stroke:#334155!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:1px solid #334155!important;border-radius:0!important;background:#0E1223!important;color:#F8FAFC!important}
.apexcharts-tooltip-title{border-bottom:1px solid #334155!important;background:#1A1E2F!important}
@media(max-width:1120px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:960px){.g23,.g32,.g3{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:static;width:auto;height:auto;border-right:0;border-bottom:2px solid var(--line)}
  .brand{min-height:auto;padding:12px 14px}
  .brand .logo{width:42px;height:42px}
  .side-foot{display:none}
  .navlbl{padding:10px 14px 5px}
  nav{flex-direction:row;overflow-x:auto}
  .nav-btn{width:auto;min-width:130px;flex:none;border-right:1px solid var(--line)}
  .nav-btn.on{transform:none;box-shadow:0 -4px 0 #fff inset}
  .nav-btn small{display:none}
  .main{padding-top:0}
  .topbar{position:sticky;top:0;z-index:8;margin:0 -28px 18px}
}
@media(max-width:820px){.g2,.g4,.board{grid-template-columns:1fr}.kpi:nth-child(even){transform:none}}
@media(max-width:560px){
  .main{padding:0 12px 32px}
  .topbar{margin:0 -12px 15px;padding:14px 12px;align-items:center}
  .topbar p{max-width:230px}
  .topbar .chip:last-child{display:none}
  .chip{padding:6px 8px}
  .nav-btn{min-width:55px;justify-content:center;padding:13px}
  .nav-btn .txt{display:none}
  .brand span{display:none}
  .card{padding:14px;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #screen{animation:none}
  .dot{animation:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
    <div><b>批次履歷平台</b><span>LOT / BATCH MGMT</span></div>
  </div>
  <div class="navlbl">作業模組</div>
  <nav id="nav" aria-label="作業模組"></nav>
  <div class="side-foot">MES 製造執行系統整合<br>資料同步 <b>WMS · 追溯系統</b><br>© 2026 智慧製造示範</div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="h">
      <h1 id="scr-title">投料建批</h1>
      <p id="scr-sub">領料投入產生批號、綁定物料與規格</p>
    </div>
    <div class="spacer"></div>
    <span class="chip"><span class="dot" aria-hidden="true"></span>現場即時連線</span>
    <span class="chip"><span class="material-symbols-outlined">calendar_today</span>2026-08-13</span>
  </div>
  <div id="screen"></div>
</main>
</div>
<script>
var MODULES=[
{icon:"add_box",name:"投料建批",desc:"領料投入產生批號、綁定物料與規格"},
{icon:"call_split",name:"拆批併批",desc:"批次拆分、合併並自動延續父子批號"},

function fromHash(){

}
