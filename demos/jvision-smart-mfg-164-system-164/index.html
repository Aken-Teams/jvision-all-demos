<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>電子料件缺料預警系統｜Jvision 系統 Demo</title>
  <meta name="description" content="關鍵料件交期監控、市場缺料情報彙整、安全庫存水位預警與缺料應變協同" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --green:#15803d;
      --amber:#a84b00;
      --red:#dc2626;
      --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.045);
      --radius:6px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:var(--color-background);
      color:var(--ink);
      font-family:"Fira Sans",system-ui,sans-serif;
      font-size:14px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    button,a{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid rgba(37,99,235,.28);
      outline-offset:2px;
      box-shadow:0 0 0 1px var(--color-ring);
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .layout{display:flex;min-height:100vh}
    .side{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      flex:0 0 252px;
      flex-direction:column;
      width:252px;
      height:100vh;
      padding:24px 16px 18px;
      overflow:auto;
      background:#fff;
      border-right:1px solid var(--line);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 8px 24px;
      border-bottom:1px solid var(--line);
    }
    .logo{
      display:grid;
      flex:0 0 42px;
      width:42px;
      height:42px;
      place-items:center;
      color:#fff;
      background:var(--blue);
      border-radius:5px;
      box-shadow:5px 5px 0 #bfdbfe;
    }
    .logo .material-symbols-outlined{font-size:23px}
    .brand b{display:block;font-size:15px;line-height:1.3;letter-spacing:-.01em}
    .brand small{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-family:"Fira Code",monospace;
      font-size:9px;
      letter-spacing:.04em;
    }
    .navlbl{
      padding:22px 10px 7px;
      color:var(--muted);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .nav{display:flex;flex-direction:column;gap:4px}
    .nav button{
      position:relative;
      display:flex;
      align-items:center;
      gap:11px;
      width:100%;
      min-height:44px;
      padding:10px 11px;
      color:var(--muted);
      text-align:left;
      background:transparent;
      border:1px solid transparent;
      border-radius:5px;
      transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
    }
    .nav button:hover{
      color:var(--blue);
      background:#eff6ff;
      border-color:#bfdbfe;
      transform:translateX(2px);
    }
    .nav button.on{
      color:#fff;
      background:var(--blue);
      border-color:var(--blue);
      box-shadow:3px 3px 0 #bfdbfe;
    }
    .nav button.on:before{
      position:absolute;
      left:-17px;
      width:3px;
      height:24px;
      content:"";
      background:var(--color-accent);
    }
    .nav button .material-symbols-outlined{flex:0 0 auto;font-size:20px}
    .nav .t{min-width:0;overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
    .nav .n{
      margin-left:auto;
      color:inherit;
      font-family:"Fira Code",monospace;
      font-size:10px;
      opacity:.72;
    }
    .side-foot{
      margin-top:auto;
      padding:17px 9px 0;
      color:var(--muted);
      border-top:1px solid var(--line);
      font-size:10px;
      line-height:1.7;
    }
    .main{flex:1;min-width:0;padding:0 30px 48px}
    .topbar{
      position:sticky;
      top:0;
      z-index:15;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      min-height:92px;
      margin:0 -30px 24px;
      padding:17px 30px;
      background:rgba(248,250,252,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .eyebrow{
      margin-bottom:4px;
      color:var(--blue);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .topbar h1{
      display:flex;
      align-items:center;
      gap:9px;
      margin:0;
      font-size:23px;
      font-weight:700;
      letter-spacing:-.025em;
      line-height:1.25;
    }
    .topbar h1 .material-symbols-outlined{color:var(--blue);font-size:25px}
    .sub{margin-top:4px;color:var(--muted);font-size:12px}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:36px;
      padding:7px 12px;
      color:#14532d;
      background:#f0fdf4;
      border:1px solid #bbf7d0;
      border-radius:999px;
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:600;
      white-space:nowrap;
    }
    .pill .dot{
      width:7px;
      height:7px;
      background:var(--green);
      border-radius:50%;
      box-shadow:0 0 0 3px #dcfce7;
    }
    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
    .g32{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
    .card{
      min-width:0;
      padding:17px 18px;
      background:var(--color-card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
    }
    .card:hover{border-color:#cbd5e1;box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.06)}
    .card h3{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 3px;
      font-size:14px;
      font-weight:700;
      letter-spacing:-.01em;
    }
    .card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
    .card .cap{margin-bottom:13px;color:var(--muted);font-size:11.5px}
    .kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
    .kpi:after{
      position:absolute;
      top:13px;
      right:13px;
      width:38px;
      height:38px;
      content:"";
      background:linear-gradient(135deg,#dbeafe 50%,transparent 50%);
      opacity:.55;
    }
    .kpi .lbl{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:11.5px;
      font-weight:600;
    }
    .kpi .lbl .material-symbols-outlined{color:var(--blue);font-size:17px}
    .kpi .val{
      margin-top:9px;
      font-family:"Fira Code",monospace;
      font-size:25px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.045em;
    }
    .kpi .val small{
      margin-left:5px;
      color:var(--muted);
      font-family:"Fira Sans",sans-serif;
      font-size:12px;
      font-weight:600;
      letter-spacing:0;
    }
    .delta{
      display:inline-flex;
      align-items:center;
      gap:3px;
      margin-top:6px;
      font-size:11px;
      font-weight:600;
    }
    .delta .material-symbols-outlined{font-size:15px}
    .up{color:#146c35}.down{color:#b91c1c}.warn{color:#92400e}
    .chartbox{position:relative;width:100%;overflow:hidden}
    .tw{
      width:100%;
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:5px;
      scrollbar-color:#94a3b8 #f1f5f9;
    }
    table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
    th{
      padding:9px 10px;
      color:#334155;
      text-align:left;
      white-space:nowrap;
      background:#edf3fa;
      border-bottom:1px solid #cbd5e1;
      font-size:10px;
      font-weight:700;
      letter-spacing:.055em;
      text-transform:none;
    }
    td{padding:10px;border-bottom:1px solid #edf2f7;vertical-align:middle}
    tbody tr{transition:background-color .18s ease}
    tbody tr:hover{background:#f8fbff}
    tr:last-child td{border-bottom:0}
    th:nth-child(n+4),td:nth-child(n+4){font-variant-numeric:tabular-nums}
    td.mono,td:has(.bar){text-align:right}
    .tw th:first-child,.tw td:first-child{padding-left:14px}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 8px;
      white-space:nowrap;
      border:1px solid currentColor;
      border-radius:3px;
      font-size:10px;
      font-weight:700;
      line-height:1.35;
    }
    .badge:before{width:5px;height:5px;content:"";background:currentColor;border-radius:50%}
    .b-red{color:#b91c1c;background:#fff1f2}
    .b-amber{color:#92400e;background:#fff7ed}
    .b-green{color:#166534;background:#f0fdf4}
    .b-blue{color:#1d4ed8;background:#eff6ff}
    .b-gray{color:#475569;background:#f1f5f9}
    .mono,.id,.tm{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }
    .mono{font-weight:600}
    .bar{
      height:6px;
      min-width:70px;
      overflow:hidden;
      background:#e2e8f0;
      border-radius:1px;
    }
    .bar>i{display:block;height:100%;border-radius:1px}
    .gauge{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .legend{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:11.5px}
    .legend .li{display:flex;align-items:center;gap:8px}
    .legend .sw{flex:0 0 10px;width:10px;height:10px;border:1px solid rgba(15,23,42,.18)}
    .legend b{margin-left:auto;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .signal{display:flex;flex-direction:column;gap:8px}
    .srow{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      padding:10px 12px;
      background:#fff;
      border:1px solid var(--line);
      border-left:3px solid currentColor;
      border-radius:4px;
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .srow:hover{transform:translateX(2px);box-shadow:0 5px 14px rgba(15,23,42,.07)}
    .srow .ic{
      display:grid;
      flex:0 0 36px;
      width:36px;
      height:36px;
      place-items:center;
      border-radius:3px;
    }
    .srow .ic .material-symbols-outlined{font-size:20px}
    .srow .mid{flex:1;min-width:0}
    .srow .mid .t{font-size:12.5px;font-weight:700}
    .srow .mid .s{overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis}
    .srow .rt{flex:0 0 auto;text-align:right}
    .srow .rt .big{font-family:"Fira Code",monospace;font-size:17px;font-weight:700;line-height:1}
    .srow .rt .u{margin-top:4px;color:var(--muted);font-size:10px}
    .note{
      display:flex;
      align-items:flex-start;
      gap:8px;
      padding:10px 11px;
      color:#334155;
      background:#eff6ff;
      border:1px solid #bfdbfe;
      border-left:3px solid var(--blue);
      border-radius:4px;
      font-size:11.5px;
    }
    .note .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:18px}
    .tl{position:relative;padding-left:22px}
    .tl:before{
      position:absolute;
      top:4px;
      bottom:4px;
      left:6px;
      width:1px;
      content:"";
      background:#cbd5e1;
    }
    .tl .ev{position:relative;padding:0 0 17px 6px}
    .tl .ev:last-child{padding-bottom:0}
    .tl .ev .dot{
      position:absolute;
      top:3px;
      left:-22px;
      width:13px;
      height:13px;
      border:3px solid #fff;
      border-radius:50%;
      box-shadow:0 0 0 1px #94a3b8;
    }
    .tl .tm{color:var(--muted);font-size:10px;font-weight:500}
    .tl .h{margin:2px 0;font-size:12.5px;font-weight:700}
    .tl .d{color:var(--muted);font-size:11.5px}
    .steps{display:flex;gap:7px;flex-wrap:wrap}
    .step{
      position:relative;
      flex:1;
      min-width:125px;
      padding:11px;
      background:#f8fafc;
      border:1px solid var(--line);
      border-top:2px solid var(--blue);
      border-radius:3px;
    }
    .step:not(:last-child):after{
      position:absolute;
      top:50%;
      right:-8px;
      z-index:2;
      width:8px;
      height:1px;
      content:"";
      background:var(--blue);
    }
    .step .n{color:var(--blue);font-family:"Fira Code",monospace;font-size:9px;font-weight:700;text-transform:uppercase}
    .step .h{margin:3px 0 2px;font-size:12px;font-weight:700}
    .step .d{color:var(--muted);font-size:10.5px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(175px,1fr));gap:9px;min-width:740px}
    .col{min-width:0;padding:9px;background:#f1f5f9;border:1px solid var(--line);border-radius:4px}
    .col .ch{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:9px;
      font-size:11.5px;
      font-weight:700;
    }
    .col .cnt{
      padding:1px 7px;
      color:var(--muted);
      background:#fff;
      border:1px solid var(--line);
      border-radius:2px;
      font-family:"Fira Code",monospace;
      font-size:10px;
    }
    .tk{
      margin-bottom:7px;
      padding:9px 10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:3px;
      box-shadow:0 1px 2px rgba(15,23,42,.04);
      transition:border-color .2s ease,transform .2s ease;
    }
    .tk:hover{transform:translateY(-2px);border-color:#93c5fd}
    .tk:last-child{margin-bottom:0}
    .tk .id{color:var(--muted);font-size:9.5px;font-weight:600}
    .tk .tt{margin:5px 0 7px;font-size:11.5px;font-weight:700}
    .tk .mt{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px}
    .avatar{
      display:inline-grid;
      width:22px;
      height:22px;
      place-items:center;
      color:#fff;
      background:var(--blue);
      border-radius:2px;
      font-size:10px;
      font-weight:700;
    }
    .reveal{animation:reveal .35s ease-out both}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1100px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g23,.g32{grid-template-columns:1fr}
    }
    @media(max-width:860px){
      .layout{display:block}
      .side{
        position:relative;
        width:100%;
        height:auto;
        padding:12px;
        border-right:0;
        border-bottom:1px solid var(--line);
      }
      .brand{padding:0 5px 12px}
      .navlbl,.side-foot{display:none}
      .nav{flex-direction:row;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding-top:10px}
      .nav button{flex:0 0 auto;width:auto;min-height:42px;padding:9px 11px}
      .nav button.on:before{display:none}
      .nav .n{display:none}
      .main{padding:0 16px 36px}
      .topbar{
        position:relative;
        margin:0 -16px 18px;
        padding:15px 16px;
        min-height:auto;
      }
    }
    @media(max-width:620px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .topbar{align-items:flex-start;flex-direction:column;gap:11px}
      .topbar h1{font-size:20px}
      .pill{width:100%;justify-content:center}
      .card{padding:15px}
      .srow{align-items:flex-start;flex-wrap:wrap}
      .srow .mid{min-width:calc(100% - 52px)}
      .srow .rt{width:100%;padding-left:48px;text-align:left}
      .step:not(:last-child):after{display:none}
    }
    @media(max-width:420px){
      .nav .t{display:none}
      .nav button{padding:9px 12px}
      .brand small{display:none}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .reveal{animation:none}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">warning</span></div>
        <div>
          <b>缺料預警系統</b>
          <small>COMPONENT SHORTAGE EWS</small>
        </div>
      </div>
      <div class="navlbl">功能模組 / Modules</div>
      <nav class="nav" id="nav" aria-label="功能模組"></nav>
      <div class="side-foot">JVISION DEMO · 純前端假資料<br />© 2026 智慧製造供應鏈</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div style="min-width:0">
          <div class="eyebrow">Supply Chain Intelligence</div>
          <h1 id="scr-title"><span class="material-symbols-outlined">warning</span><span>缺料預警</span></h1>
          <div class="sub" id="scr-sub"></div>
        </div>
        <span class="pill"><span class="dot" aria-hidden="true"></span>即時監控中 · 更新於 08:42</span>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <script>
  (function(){
    "use strict";
    var C={accent:"#2563eb",accent2:"#3b82f6",red:"#dc2626",amber:"#a84b00",green:"#15803d",blue:"#2563eb",line:"#e2e8f0",muted:"#475569"};
    var MODS=[
      {icon:"inventory_2",name:"料件庫存水位",sub:"安全庫存與在途量即時盤點"},
      {icon:"warning",name:"缺料訊號偵測",sub:"交期落差與缺口自動分級預警"},
      {icon:"insights",name:"市場缺料情報",sub:"晶片被動元件行情與缺料指數"},
      {icon:"account_tree",name:"影響訂單模擬",sub:"缺料展開至工單與交期衝擊"},
      {icon:"task_alt",name:"應變對策看板",sub:"替代料改板與加急採購追蹤"},
      {icon:"groups",name:"跨部門通報",sub:"缺料事件協同與稽核軌跡"}
    ];
    var charts={};
    function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
    function bar(pct,color){var p=Math.max(0,Math.min(100,pct));return'<div class="bar" role="img" aria-label="水位 '+p+'%"><i style="width:'+p+'%;background:'+color+'"></i></div>'}

    function s4c(){
      var o=opts();o.plugins.legend.display=false;o.scales={r:{ticks:{display:false},grid:{color:"#e2e8f0"}}};
      charts.c4a=new Chart(document.getElementById("c4a"),{type:"polarArea",data:{labels:["替代料","加急/空運","改板","安全庫存","雙來源"],datasets:[{data:[11,6,4,8,5],backgroundColor:["rgba(37,99,235,.78)","rgba(59,130,246,.68)","rgba(168,75,0,.68)","rgba(21,128,61,.68)","rgba(71,85,105,.68)"],borderWidth:1,borderColor:"#fff"}]},options:o})
    }
    function s5(){
      var k=[
        {lbl:"本月通報",ic:"campaign",val:"58",u:"件",d:"+14 較上月",cls:"up",di:"trending_up"},
        {lbl:"平均回應",ic:"schedule",val:"1.8",u:"小時",d:"-0.6 改善",cls:"up",di:"trending_down"},
        {lbl:"跨部門協同",ic:"groups",val:"3",u:"部門",d:"採購/計畫/業務",cls:"up",di:"check"},
        {lbl:"稽核完整率",ic:"verified",val:"100",u:"%",d:"全程留痕",cls:"up",di:"check"}
      ];
      var feed=[
        ["08-14 08:40","採購 陳專員","b-red","發布 L1 缺料通報","IC-ESP32-WROOM 缺口 -1,090，已通知生產計畫部評估工單重排。"],
        ["08-14 08:12","生產計畫 林工程師","b-amber","回覆影響評估","WO-2608-114 建議延後 5 天，或改用替代料 IC-ESP32-C3。"],
        ["08-13 17:30","品保 吳課長","b-blue","替代料驗證更新","替代 MCU 完成信賴性測試，建議可小批量導入。"],
        ["08-13 15:05","業務 黃經理","b-green","客戶溝通結果","客戶 A 同意分批交貨，首批 08-25 交付，餘量順延一週。"],
        ["08-13 10:22","供應鏈 郭經理","b-gray","對策核准","核准 USB-C 連接器加急空運，預算 NT$ 42 萬。"]
      ];
      var fr=feed.map(function(f){var c=f[2]==="b-red"?C.red:f[2]==="b-amber"?C.amber:f[2]==="b-blue"?C.blue:f[2]==="b-green"?C.green:C.muted;return'<div class="ev"><div class="dot" style="background:'+c+'"></div><div class="tm">'+f[0]+' · '+f[1]+'</div><div class="h">'+f[3]+' <span class="badge '+f[2]+'">通報</span></div><div class="d">'+f[4]+'</div></div>'}).join("");
      var stat=[["採購部",26,C.accent],["生產計畫部",19,C.blue],["業務部",8,C.green],["品保部",5,C.amber]];
      var sr=stat.map(function(s){return'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px"><span>'+s[0]+'</span><b class="mono">'+s[1]+' 件</b></div>'+bar(s[1]/26*100,s[2])+'</div>'}).join("");
      return'<div class="grid g4">'+k.map(cardKpi).join("")+'</div><div style="height:14px"></div><div class="grid g23"><div class="card"><h3><span class="material-symbols-outlined">forum</span>缺料事件協同動態</h3><div class="cap">跨部門通報與回覆之稽核軌跡</div><div class="tl">'+fr+'</div></div><div><div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">bar_chart</span>各部門通報參與</h3><div class="cap">本月通報發起與回覆件數</div>'+sr+'</div><div class="card"><h3><span class="material-symbols-outlined">fact_check</span>本月成效</h3><div class="cap">缺料預警管理指標</div><div style="display:flex;flex-direction:column;gap:11px;margin-top:2px">'+statLine("缺料預警提前天數","14.8 天","up","+6.2")+statLine("缺料導致停線次數","1 次","up","-4")+statLine("跨部門通報平均回應","1.8 小時","up","-0.6")+statLine("對策解除風險率","44%","up","+11%")+'</div></div></div></div>'
    }
    var SCREENS=[{r:s0,c:s0c},{r:s1,c:s1c},{r:s2,c:s2c},{r:s3,c:s3c},{r:s4,c:s4c},{r:s5,c:null}];
    var nav=document.getElementById("nav");
    nav.innerHTML=MODS.map(function(m,i){return'<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="t">'+esc(m.name)+'</span><span class="n">0'+i+'</span></button>'}).join("");
    nav.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b)location.hash="v"+b.getAttribute("data-i")});
    var container=document.getElementById("view");
    function show(i){
      destroyAll();
      var m=MODS[i]||MODS[0],sc=SCREENS[i]||SCREENS[0];
      document.getElementById("scr-title").innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span>'+esc(m.name)+'</span>';
      document.getElementById("scr-sub").textContent=m.sub;
      document.title=m.name+"｜電子料件缺料預警系統";
      var btns=document.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        var on=+btns[j].getAttribute("data-i")===i;
        btns[j].classList.toggle("on",on);
        btns[j].setAttribute("aria-current",on?"page":"false");
      }
      container.classList.remove("reveal");
      container.innerHTML=sc.r();
      void container.offsetWidth;
      container.classList.add("reveal");
      if(sc.c)sc.c()
    }
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      var n=m?Math.min(+m[1],5):0;
      show(n);
      try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash()
  })();
  </script>
