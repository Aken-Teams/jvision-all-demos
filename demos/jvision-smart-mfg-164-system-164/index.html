<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>電子料件缺料預警系統｜Jvision 系統 Demo</title>
  <meta name="description" content="關鍵料件交期監控、市場缺料情報彙整、安全庫存水位預警與缺料應變協同" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#334155; --accent2:#64748b; --bg:#f1f5f9; --panel:#ffffff;
      --line:#e2e8f0; --ink:#1e293b; --muted:#64748b; --soft:#f8fafc;
      --red:#dc2626; --amber:#d97706; --green:#16a34a; --blue:#2563eb;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .layout{display:flex; min-height:100vh; align-items:stretch;}
    /* sidebar */
    .side{
      width:248px; flex:0 0 248px; background:var(--panel);
      border-right:1px solid var(--line); padding:20px 14px;
      display:flex; flex-direction:column; gap:6px; min-width:0;
    }
    .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px;}
    .brand .logo{
      width:40px;height:40px;border-radius:11px;flex:0 0 40px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;display:flex;align-items:center;justify-content:center;
    }
    .brand .logo .material-symbols-outlined{font-size:24px;}
    .brand b{font-size:15px;font-weight:800;display:block;line-height:1.3;}
    .brand span{font-size:11px;color:var(--muted);}
    .navlbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;padding:8px 10px 4px;}
    .nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
    .nav button{
      display:flex;align-items:center;gap:11px;width:100%;text-align:left;
      background:transparent;border:0;border-radius:10px;padding:10px 12px;
      color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
      cursor:pointer;transition:.15s;min-width:0;
    }
    .nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
    .nav button .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .nav button .n{font-size:11px;color:#94a3b8;font-weight:700;flex:0 0 auto;}
    .nav button:hover{background:var(--soft);color:var(--ink);}
    .nav button.on{background:var(--accent);color:#fff;}
    .nav button.on .n{color:#cbd5e1;}
    .side-foot{margin-top:auto;padding:14px 10px 2px;font-size:11px;color:#94a3b8;border-top:1px solid var(--line);}
    /* main */
    .main{flex:1;min-width:0;padding:22px 26px 44px;max-width:100%;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
    .topbar h1{font-size:20px;font-weight:800;margin:0;display:flex;align-items:center;gap:9px;min-width:0;}
    .topbar h1 .material-symbols-outlined{font-size:24px;color:var(--accent);}
    .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);}
    .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
    /* generic */
    .grid{display:grid;gap:14px;min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g23{grid-template-columns:1.55fr 1fr;}
    .g32{grid-template-columns:1fr 1.45fr;}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
    .card .cap{font-size:11.5px;color:var(--muted);margin-bottom:12px;}
    .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .kpi .lbl .material-symbols-outlined{font-size:17px;}
    .kpi .val{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.02em;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
    .kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;}
    .kpi .delta .material-symbols-outlined{font-size:15px;}
    .up{color:var(--green);} .down{color:var(--red);} .warn{color:var(--amber);}
    .chartbox{position:relative;width:100%;overflow:hidden;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
    th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft);}
    td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
    tr:last-child td{border-bottom:0;}
    .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
    .tw table{min-width:560px;}
    .tw th:first-child,.tw td:first-child{padding-left:14px;}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
    .b-red{background:#fef2f2;color:var(--red);}
    .b-amber{background:#fffbeb;color:var(--amber);}
    .b-green{background:#f0fdf4;color:var(--green);}
    .b-blue{background:#eff6ff;color:var(--blue);}
    .b-gray{background:#f1f5f9;color:var(--muted);}
    .mono{font-variant-numeric:tabular-nums;font-weight:700;}
    .bar{height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:70px;}
    .bar>i{display:block;height:100%;border-radius:6px;}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
    .col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
    .col .ch{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
    .tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.03);}
    .tk:last-child{margin-bottom:0;}
    .tk .id{font-size:10.5px;color:#94a3b8;font-weight:700;}
    .tk .tt{font-size:12.5px;font-weight:700;margin:2px 0 6px;}
    .tk .mt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);}
    .avatar{width:22px;height:22px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
    /* timeline */
    .tl{position:relative;padding-left:22px;}
    .tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl .ev{position:relative;padding:0 0 16px 6px;}
    .tl .ev:last-child{padding-bottom:0;}
    .tl .ev .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);}
    .tl .ev .tm{font-size:11px;color:#94a3b8;font-weight:700;}
    .tl .ev .h{font-size:13px;font-weight:700;margin:1px 0 2px;}
    .tl .ev .d{font-size:12px;color:var(--muted);}
    .signal{display:flex;flex-direction:column;gap:10px;}
    .srow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0;}
    .srow .ic{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;}
    .srow .ic .material-symbols-outlined{font-size:21px;}
    .srow .mid{flex:1;min-width:0;}
    .srow .mid .t{font-size:13px;font-weight:700;}
    .srow .mid .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
    .srow .rt{text-align:right;flex:0 0 auto;}
    .srow .rt .big{font-size:19px;font-weight:900;line-height:1;}
    .srow .rt .u{font-size:10.5px;color:var(--muted);}
    .gauge{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .legend{display:flex;flex-direction:column;gap:8px;font-size:12px;min-width:0;}
    .legend .li{display:flex;align-items:center;gap:8px;}
    .legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px;}
    .legend .li b{margin-left:auto;font-variant-numeric:tabular-nums;}
    .note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;}
    .note .material-symbols-outlined{font-size:18px;color:var(--accent2);flex:0 0 auto;}
    .steps{display:flex;flex-wrap:wrap;gap:8px;}
    .step{flex:1;min-width:120px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:11px 12px;}
    .step .n{font-size:10.5px;font-weight:800;color:var(--accent2);}
    .step .h{font-size:12.5px;font-weight:700;margin:2px 0 2px;}
    .step .d{font-size:11px;color:var(--muted);}
    .hl{color:var(--accent);font-weight:800;}
    @media(max-width:860px){
      .layout{flex-direction:column;}
      .side{width:auto;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 12px 10px;}
      .side-foot{display:none;}
      .navlbl{display:none;}
      .nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
      .nav button{width:auto;padding:8px 12px;}
      .nav button .n{display:none;}
      .main{padding:18px 16px 40px;}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .nav button .t{display:none;}
      .nav button{padding:9px 11px;}
      .brand span{display:none;}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">warning</span></div>
        <div>
          <b>缺料預警系統</b>
          <span>Component Shortage EWS</span>
        </div>
      </div>
      <div class="navlbl">功能模組</div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">Jvision Demo · 純前端假資料<br/>© 2026 智慧製造供應鏈</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div style="min-width:0">
          <h1 id="scr-title"><span class="material-symbols-outlined">warning</span><span>缺料預警</span></h1>
          <div class="sub" id="scr-sub"></div>
        </div>
        <span class="pill"><span class="dot"></span>即時監控中 · 更新於 08:42</span>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var C={accent:"#334155",accent2:"#64748b",red:"#dc2626",amber:"#d97706",green:"#16a34a",blue:"#2563eb",line:"#e2e8f0",muted:"#64748b"};
    var MODS=[
      {icon:"inventory_2",name:"料件庫存水位",sub:"安全庫存與在途量即時盤點"},
      {icon:"warning",name:"缺料訊號偵測",sub:"交期落差與缺口自動分級預警"},
      {icon:"insights",name:"市場缺料情報",sub:"晶片被動元件行情與缺料指數"},
      {icon:"account_tree",name:"影響訂單模擬",sub:"缺料展開至工單與交期衝擊"},
      {icon:"task_alt",name:"應變對策看板",sub:"替代料改板與加急採購追蹤"},
      {icon:"groups",name:"跨部門通報",sub:"缺料事件協同與稽核軌跡"}
    ];
    var charts={};
    function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
    function bar(pct,color){var p=Math.max(0,Math.min(100,pct));return '<div class="bar"><i style="width:'+p+'%;background:'+color+'"></i></div>';}

    /* ---------- SCREEN 0: 料件庫存水位 ---------- */
    function s0(){
      var kpis=[
        {lbl:"監控料號",ic:"inventory_2",val:"1,284",u:"項",d:"+36 本週新增",cls:"up",di:"trending_up"},
        {lbl:"低於安全庫存",ic:"warning",val:"47",u:"項",d:"占 3.7%",cls:"warn",di:"error"},
        {lbl:"缺料風險料號",ic:"priority_high",val:"12",u:"項",d:"需即刻處理",cls:"down",di:"trending_up"},
        {lbl:"平均庫存覆蓋",ic:"schedule",val:"18.5",u:"天",d:"目標 21 天",cls:"warn",di:"trending_down"}
      ];
      var rows=[
        {no:"IC-STM32F103",name:"MCU 主控晶片",cat:"晶片",sup:"STMicro",stk:820,saf:1500,tr:1200,cov:9,st:"risk"},
        {no:"CAP-0402-104",name:"積層陶瓷電容",cat:"被動元件",sup:"Murata",stk:52000,saf:60000,tr:80000,cov:16,st:"low"},
        {no:"IC-LM358",name:"運算放大器",cat:"晶片",sup:"TI",stk:3400,saf:2000,tr:0,cov:34,st:"ok"},
        {no:"RES-0603-10K",name:"厚膜電阻",cat:"被動元件",sup:"Yageo",stk:128000,saf:90000,tr:0,cov:41,st:"ok"},
        {no:"CONN-USB-C-16",name:"Type-C 連接器",cat:"連接器",sup:"Amphenol",stk:6200,saf:8000,tr:5000,cov:12,st:"low"},
        {no:"IC-ESP32-WROOM",name:"WiFi 模組",cat:"晶片",sup:"Espressif",stk:410,saf:1200,tr:800,cov:5,st:"risk"},
        {no:"IND-0805-4R7",name:"功率電感",cat:"被動元件",sup:"TDK",stk:24000,saf:18000,tr:0,cov:28,st:"ok"}
      ];
      var stMap={risk:['b-red','缺料風險'],low:['b-amber','低水位'],ok:['b-green','正常']};
      var tr=rows.map(function(r){
        var m=stMap[r.st];
        var ratio=Math.round(r.stk/r.saf*100);
        var col=r.st==="risk"?C.red:(r.st==="low"?C.amber:C.green);
        return '<tr>'+
          '<td><b>'+esc(r.no)+'</b><div style="font-size:11px;color:var(--muted)">'+esc(r.name)+'</div></td>'+
          '<td><span class="badge b-gray">'+esc(r.cat)+'</span></td>'+
          '<td>'+esc(r.sup)+'</td>'+
          '<td class="mono">'+r.stk.toLocaleString()+'</td>'+
          '<td class="mono" style="color:var(--muted)">'+r.saf.toLocaleString()+'</td>'+
          '<td style="min-width:130px">'+bar(ratio,col)+'<div style="font-size:10.5px;color:var(--muted);margin-top:3px">水位 '+ratio+'%</div></td>'+
          '<td class="mono">'+r.cov+' 天</td>'+
          '<td><span class="badge '+m[0]+'">'+m[1]+'</span></td>'+
        '</tr>';
      }).join("");
      var html=
        '<div class="grid g4">'+kpis.map(function(k){return card_kpi(k);}).join("")+'</div>'+
        '<div style="height:14px"></div>'+
        '<div class="grid g32">'+
          '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>庫存水位分布</h3><div class="cap">依料件狀態統計監控料號</div>'+
            '<div class="gauge"><div class="chartbox" style="height:190px;flex:1 1 180px;min-width:170px"><canvas id="c0a"></canvas></div>'+
            '<div class="legend" style="flex:1 1 160px">'+
              '<div class="li"><span class="sw" style="background:'+C.green+'"></span>正常水位<b>1,058</b></div>'+
              '<div class="li"><span class="sw" style="background:'+C.amber+'"></span>低水位<b>167</b></div>'+
              '<div class="li"><span class="sw" style="background:'+C.red+'"></span>缺料風險<b>47</b></div>'+
              '<div class="li"><span class="sw" style="background:'+C.accent2+'"></span>停用/替代<b>12</b></div>'+
            '</div></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">category</span>各料件類別覆蓋天數</h3><div class="cap">庫存＋在途可支撐天數（越低越急）</div>'+
            '<div class="chartbox" style="height:190px"><canvas id="c0b"></canvas></div></div>'+
        '</div>'+
        '<div style="height:14px"></div>'+
        '<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>關鍵料件庫存明細</h3><div class="cap">安全庫存基準與在途量比對</div>'+
          '<div class="tw"><table><thead><tr><th>料號 / 品名</th><th>類別</th><th>供應商</th><th>現有庫存</th><th>安全庫存</th><th>庫存水位</th><th>可支撐</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
      return html;
    }
    function s0charts(){
      var a=document.getElementById("c0a");
      if(a){charts.c0a=new Chart(a,{type:"doughnut",data:{labels:["正常水位","低水位","缺料風險","停用/替代"],datasets:[{data:[1058,167,47,12],backgroundColor:[C.green,C.amber,C.red,C.accent2],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});}
      var b=document.getElementById("c0b");
      if(b){charts.c0b=new Chart(b,{type:"bar",data:{labels:["晶片 IC","被動元件","連接器","模組","線材","結構件"],datasets:[{data:[7,16,12,9,24,31],backgroundColor:["#dc2626","#d97706","#d97706","#16a34a","#16a34a","#16a34a"],borderRadius:5,barPercentage:.6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{beginAtZero:true,title:{display:true,text:"天",font:{size:10}},grid:{color:"#f1f5f9"}}}}});}
    }

    /* ---------- SCREEN 1: 缺料訊號偵測 ---------- */
    function s1(){
      var kpis=[
        {lbl:"作用中預警",ic:"notifications_active",val:"23",u:"件",d:"紅色 8 · 橙色 15",cls:"down",di:"trending_up"},
        {lbl:"平均提前天數",ic:"schedule",val:"14.8",u:"天",d:"+6.2 較去年",cls:"up",di:"trending_up"},
        {lbl:"最大缺口",ic:"error",val:"-1,090",u:"pcs",d:"IC-ESP32-WROOM",cls:"down",di:"trending_down"},
        {lbl:"已轉對策",ic:"task_alt",val:"17",u:"件",d:"處理率 74%",cls:"up",di:"trending_up"}
      ];
      var sig=[
        {ic:"error",bg:"#fef2f2",fg:C.red,t:"IC-ESP32-WROOM · WiFi 模組",s:"交期延後 5 天，缺口 -1,090 pcs，影響 3 張工單",big:"-1,090",u:"pcs",lv:"L1"},
        {ic:"error",bg:"#fef2f2",fg:C.red,t:"IC-STM32F103 · MCU 主控",s:"庫存低於安全庫存 45%，市場缺料指數升至 82",big:"5",u:"天可撐",lv:"L1"},

            '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">bar_chart</span>各部門通報參與</h3><div class="cap">本月通報發起與回覆件數</div>'+sr+'</div>'+
            '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>本月成效</h3><div class="cap">缺料預警管理指標</div>'+
              '<div style="display:flex;flex-direction:column;gap:11px;margin-top:2px">'+
                statLine("缺料預警提前天數","14.8 天","up","+6.2")+
                statLine("缺料導致停線次數","1 次","up","-4")+
                statLine("跨部門通報平均回應","1.8 小時","up","-0.6")+
                statLine("對策解除風險率","44%","up","+11%")+
              '</div></div>'+
          '</div>'+
        '</div>';
      return html;
    }

    /* ---------- helpers ---------- */
    function card_kpi(k){
      return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.ic+'</span>'+esc(k.lbl)+'</div>'+
        '<div class="val">'+esc(k.val)+'<small>'+esc(k.u)+'</small></div>'+
        '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+k.di+'</span>'+esc(k.d)+'</div></div>';
    }
    function statLine(lbl,val,cls,dv){
      return '<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f5f9;padding-bottom:9px">'+
        '<span style="font-size:12.5px;color:var(--muted)">'+esc(lbl)+'</span>'+
        '<span style="text-align:right"><b class="mono" style="font-size:16px">'+esc(val)+'</b> <span class="'+cls+'" style="font-size:11px;font-weight:700">'+esc(dv)+'</span></span></div>';
    }

    var SCREENS=[
      {r:s0,c:s0charts},
      {r:s1,c:s1charts},
      {r:s2,c:s2charts},
      {r:s3,c:s3charts},
      {r:s4,c:s4charts},
      {r:s5,c:null}
    ];

    /* nav */
    var nav=document.getElementById("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="t">'+esc(m.name)+'</span><span class="n">0'+i+'</span></button>';
    }).join("");
    nav.addEventListener("click",function(e){
      var b=e.target.closest("button[data-i]");
      if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });

    var container=document.getElementById("view");
    function show(i){
      destroyAll();
      var m=MODS[i]||MODS[0];
      var sc=SCREENS[i]||SCREENS[0];
      var tt=document.getElementById("scr-title");
      tt.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span>'+esc(m.name)+'</span>';
      document.getElementById("scr-sub").textContent=m.sub;
      var btns=document.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
      container.innerHTML=sc.r();
      void container.offsetHeight;
      if(sc.c)sc.c();
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
</html>
