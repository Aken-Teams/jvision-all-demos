<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>報廢重工管理 Scrap/Rework Management｜Jvision 系統 Demo</title>
  <meta name="description" content="不良品判定、報廢重工決策、重工作業指導、品質驗證與成本歸檔的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#CBD5E1;
      --ok:#047857;
      --warn:#9A3412;
      --bad:#B91C1C;
      --shadow:7px 7px 0 #1E293B;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    body{
      margin:0;
      min-width:320px;
      min-height:100vh;
      overflow-x:hidden;
      color:var(--ink);
      background-color:var(--color-background);
      background-image:
        linear-gradient(var(--color-border) 1px,transparent 1px),
        linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
      background-size:32px 32px;
      font-family:"Fira Sans",sans-serif;
      line-height:1.5;
    }
    button{font:inherit}
    button,a{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:500;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .nav{
      position:sticky;
      top:0;
      z-index:30;
      display:grid;
      grid-template-columns:minmax(245px,.8fr) minmax(0,2.2fr);
      align-items:stretch;
      border-bottom:3px solid var(--ink);
      background:var(--color-card);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      padding:12px 18px;
      border-right:3px solid var(--ink);
      background:var(--color-primary);
      color:var(--color-on-primary);
    }
    .logo{
      display:grid;
      flex:0 0 auto;
      width:42px;
      height:42px;
      place-items:center;
      border:2px solid #fff;
      background:var(--ink);
    }
    .logo .material-symbols-outlined{font-size:25px}
    .brand b{
      display:block;
      font-size:16px;
      font-weight:800;
      letter-spacing:.03em;
      white-space:nowrap;
    }
    .brand span:not(.material-symbols-outlined){
      display:block;
      margin-top:1px;
      font:500 10px/1.3 "Fira Code",monospace;
      letter-spacing:.05em;
      opacity:.88;
    }
    .tabs{
      display:flex;
      min-width:0;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    .tab{
      position:relative;
      display:inline-flex;
      flex:1 0 auto;
      min-height:68px;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:9px 14px;
      border:0;
      border-right:1px solid var(--line);
      border-radius:0;
      background:var(--color-card);
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .tab:hover{background:var(--color-muted);color:var(--ink)}
    .tab.on{
      background:var(--ink);
      color:#fff;
      box-shadow:inset 0 -6px 0 var(--color-accent);
    }
    .tab.on::before{
      content:"ACTIVE";
      position:absolute;
      top:4px;
      right:5px;
      color:#FED7AA;
      font:700 8px/1 "Fira Code",monospace;
      letter-spacing:.08em;
    }
    .tab .material-symbols-outlined{font-size:19px}
    .wrap{max-width:1440px;margin:auto;padding:34px 24px 72px}
    #screen{animation:screen-in .35s ease-out both}
    .scr-head{
      position:relative;
      max-width:1060px;
      margin:0 0 28px;
      padding:24px 28px 22px;
      border:3px solid var(--ink);
      background:var(--color-card);
      box-shadow:var(--shadow);
    }
    .scr-head::before{
      content:"QUALITY CONTROL / OPERATIONS";
      display:block;
      margin-bottom:10px;
      color:var(--color-primary);
      font:700 11px/1.2 "Fira Code",monospace;
      letter-spacing:.12em;
    }
    .scr-head::after{
      content:"";
      position:absolute;
      top:-3px;
      right:-3px;
      width:86px;
      height:13px;
      border:3px solid var(--ink);
      background:var(--color-accent);
    }
    .scr-head h1{
      display:flex;
      align-items:center;
      gap:12px;
      margin:0;
      font-size:clamp(25px,3.4vw,44px);
      font-weight:800;
      line-height:1.08;
      letter-spacing:-.035em;
    }
    .scr-head h1 .material-symbols-outlined{
      display:grid;
      width:48px;
      height:48px;
      flex:0 0 auto;
      place-items:center;
      background:var(--color-primary);
      color:#fff;
      font-size:28px;
    }
    .scr-head p{
      max-width:820px;
      margin:13px 0 0 60px;
      color:var(--muted);
      font-size:14px;
    }
    .grid{display:grid;gap:16px}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
    .g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
    .card,.kpi{
      min-width:0;
      border:2px solid var(--ink);
      border-radius:0;
      background:var(--color-card);
      color:var(--color-card-foreground);
    }
    .card{padding:18px}
    .card:nth-child(even){box-shadow:5px 5px 0 var(--color-primary)}
    .card h3{
      display:flex;
      align-items:center;
      gap:8px;
      margin:-18px -18px 17px;
      padding:11px 14px;
      border-bottom:2px solid var(--ink);
      background:var(--color-muted);
      font-size:14px;
      font-weight:800;
    }
    .card h3 .material-symbols-outlined{
      color:var(--color-primary);
      font-size:20px;
    }
    .card h3 .sub{
      margin-left:auto;
      color:var(--muted);
      font:500 10px/1.3 "Fira Code",monospace;
      text-align:right;
    }
    .kpi{
      position:relative;
      min-height:142px;
      overflow:hidden;
      padding:16px 17px;
      border-width:2px 2px 7px;
    }
    .kpi:nth-child(2){transform:translateY(8px)}
    .kpi:nth-child(3){border-bottom-color:var(--color-accent)}
    .kpi::after{
      content:"";
      position:absolute;
      right:-23px;
      bottom:-23px;
      width:69px;
      height:69px;
      border:2px solid var(--ink);
      background:var(--color-secondary);
      transform:rotate(45deg);
    }
    .kpi .lab{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }
    .kpi .lab .material-symbols-outlined{
      color:var(--color-primary);
      font-size:18px;
    }
    .kpi .val{
      position:relative;
      z-index:1;
      margin-top:10px;
      font:700 clamp(25px,2.2vw,34px)/1.15 "Fira Code",monospace;
      letter-spacing:-.04em;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{
      color:var(--muted);
      font:600 12px "Fira Sans",sans-serif;
      letter-spacing:0;
    }
    .kpi .dl{
      position:relative;
      z-index:1;
      display:inline-block;
      margin-top:10px;
      padding:2px 6px;
      border:1px solid currentColor;
      font:700 10px/1.4 "Fira Code",monospace;
    }
    .up{color:var(--ok)}
    .down{color:var(--bad)}
    .flat{color:var(--warn)}
    .chartbox{position:relative;width:100%;overflow:hidden}
    table{
      width:100%;
      border-collapse:collapse;
      border:2px solid var(--ink);
      background:#fff;
      font-size:13px;
    }
    th,td{
      padding:11px 12px;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      white-space:nowrap;
    }
    th{
      background:var(--ink);
      color:#fff;
      font:600 11px/1.3 "Fira Code",monospace;
      letter-spacing:.045em;
      text-align:left;
    }
    td:nth-child(1),td:nth-child(3){
      font-family:"Fira Code",monospace;
      font-size:12px;
      font-variant-numeric:tabular-nums;
    }
    td:nth-child(4),td:nth-child(5):has(+ td:last-child){
      font-variant-numeric:tabular-nums;
    }
    tbody tr:nth-child(even){background:#F1F5F9}
    tbody tr:hover{background:#DBEAFE}
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:26px;
      padding:3px 8px;
      border:1px solid currentColor;
      border-radius:0;
      font-size:11px;
      font-weight:800;
    }
    .tag::before{content:"";width:7px;height:7px;background:currentColor}
    .t-ok{background:#D1FAE5;color:#065F46}
    .t-warn{background:#FFEDD5;color:#9A3412}
    .t-bad{background:#FEE2E2;color:#991B1B}
    .t-info{background:#DBEAFE;color:#1D4ED8}
    .t-mut{background:#E2E8F0;color:#334155}
    .bar{
      height:11px;
      min-width:70px;
      overflow:hidden;
      border:1px solid var(--ink);
      border-radius:0;
      background:#E2E8F0;
    }
    .bar i{
      display:block;
      height:100%;
      background:repeating-linear-gradient(135deg,var(--color-primary) 0 8px,#60A5FA 8px 14px);
    }
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:900px}
    .col{
      min-width:0;
      padding:10px;
      border:2px solid var(--ink);
      background:var(--color-muted);
    }
    .col .ch{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:-10px -10px 10px;
      padding:9px 10px;
      border-bottom:2px solid var(--ink);
      background:var(--ink);
      color:#fff;
      font-size:12px;
      font-weight:800;
    }
    .col .ch .n{
      min-width:25px;
      padding:2px 7px;
      background:var(--color-accent);
      color:#000;
      font:700 11px "Fira Code",monospace;
      text-align:center;
    }
    .tile{
      margin-bottom:9px;
      padding:10px;
      border:2px solid var(--ink);
      border-left:7px solid var(--color-primary);
      background:#fff;
    }
    .tile .id{color:#1D4ED8;font:700 11px "Fira Code",monospace}
    .tile .ti{margin:4px 0 7px;font-size:13px;font-weight:700;white-space:normal}
    .tile .mt{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:11px}
    .tl{position:relative;padding-left:31px}
    .tl::before{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:3px;background:var(--ink)}
    .tl .it{position:relative;margin-bottom:18px}
    .tl .it::before{
      content:"待辦";
      position:absolute;
      top:1px;
      left:-31px;
      width:20px;
      height:20px;
      border:2px solid var(--ink);
      background:#fff;
      color:transparent;
    }
    .tl .it.done::before{content:"完成";background:var(--ok)}
    .tl .it.now::before{content:"進行";background:var(--color-accent)}
    .tl .tt{font-size:13px;font-weight:800}
    .tl .td{margin-top:3px;color:var(--muted);font-size:12px;white-space:normal}
    .tl .tm{color:#1D4ED8;font:700 10px "Fira Code",monospace}
    .flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .between{justify-content:space-between}
    .pill,.btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      min-height:38px;
      padding:7px 12px;
      border:2px solid var(--ink);
      border-radius:0;
      font-size:12px;
      font-weight:700;
    }
    .pill{background:var(--color-muted);color:var(--muted)}
    .btn{background:#fff;color:var(--ink)}
    .btn:hover{background:var(--color-muted)}
    .btn.p{background:var(--color-accent);color:#000;box-shadow:3px 3px 0 var(--ink)}
    .rule{
      margin-bottom:11px;
      padding:12px;
      border:2px solid var(--ink);
      border-left:8px solid var(--color-primary);
      background:#fff;
    }
    .rule .rid{color:#1D4ED8;font:700 11px "Fira Code",monospace}
    .rule .rt{margin:5px 0;font-size:13px;font-weight:700;white-space:normal}
    .rule .re{color:var(--muted);font-size:11.5px}
    .gauge{display:flex;align-items:center;gap:18px}
    .gaugebox{position:relative;width:130px;height:130px;flex:0 0 auto}
    .gaugebox .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
    .gaugebox .ctr b{display:block;font:700 24px "Fira Code",monospace}
    .gaugebox .ctr span{color:var(--muted);font-size:10px}
    .spec{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:13px;
      font-size:12.5px;
      flex-wrap:wrap;
    }
    .spec .nm{width:120px;flex:0 0 auto;color:var(--muted)}
    .spec .track{
      position:relative;
      flex:1;
      min-width:120px;
      height:25px;
      overflow:hidden;
      border:2px solid var(--ink);
      background:repeating-linear-gradient(90deg,#E2E8F0 0 18px,#F8FAFC 18px 36px);
    }
    .spec .zone{position:absolute;top:0;bottom:0;background:#A7F3D0}
    .spec .mk{position:absolute;top:0;bottom:0;width:4px;background:var(--color-primary)}
    .spec .rd{width:100px;flex:0 0 auto;text-align:right;font:700 11px "Fira Code",monospace}
    .cost-row{
      display:flex;
      align-items:center;
      gap:11px;
      padding:10px 0;
      border-bottom:1px solid var(--line);
      font-size:13px;
    }
    .cost-row .ic{
      display:grid;
      width:35px;
      height:35px;
      flex:0 0 auto;
      place-items:center;
      border:2px solid var(--ink);
      background:var(--color-muted);
    }
    .cost-row .ic .material-symbols-outlined{color:var(--color-primary);font-size:19px}
    .cost-row .nm{flex:1;min-width:0}
    .cost-row .amt{font:700 12px "Fira Code",monospace;white-space:nowrap}
    .stepper{display:flex;flex-wrap:wrap;gap:0;margin-bottom:2px;border:2px solid var(--ink)}
    .step{
      position:relative;
      flex:1;
      min-width:120px;
      padding:11px;
      border-right:1px solid var(--ink);
      background:#fff;
    }
    .step:last-child{border-right:0}
    .step.on{background:#DBEAFE;box-shadow:inset 0 -7px 0 var(--color-primary)}
    .step .sn{color:var(--muted);font:600 10px "Fira Code",monospace}
    .step .sti{margin-top:3px;font-size:13px;font-weight:800}
    .step .ss{margin-top:5px;font-size:11px;font-weight:700}
    .foot{
      margin-top:30px;
      padding:15px;
      border-top:3px solid var(--ink);
      background:var(--ink);
      color:#CBD5E1;
      font:500 11px "Fira Code",monospace;
      text-align:center;
    }
    @keyframes screen-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1024px){
      .nav{grid-template-columns:1fr}
      .brand{border-right:0;border-bottom:2px solid var(--ink)}
      .tab{min-height:52px}
      .g4{grid-template-columns:repeat(2,1fr)}
      .g23,.g32{grid-template-columns:1fr}
      .kpi:nth-child(2){transform:none}
    }
    @media(max-width:768px){
      .wrap{padding:25px 16px 60px}
      .g3,.g2{grid-template-columns:1fr}
      .scr-head{padding:20px 18px}
      .scr-head p{margin-left:0}
      .scr-head h1 .material-symbols-outlined{width:42px;height:42px}
    }
    @media(max-width:560px){
      .brand{padding:10px 13px}
      .tabs{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}
      .tab{min-height:48px;padding:7px;border-bottom:1px solid var(--line)}
      .tab .lbl{font-size:11px}
      .tab .material-symbols-outlined{display:none}
      .tab.on::before{display:none}
      .wrap{padding-inline:12px}
      .g4{grid-template-columns:1fr}
      .scr-head{box-shadow:4px 4px 0 var(--ink)}
      .scr-head h1{font-size:25px}
      .gauge{align-items:flex-start;flex-direction:column}
      .spec .nm{width:100%}
      .spec .rd{width:auto;margin-left:auto}
      .cost-row{align-items:flex-start}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
      }
      #screen{animation:none}
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="主要功能">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">recycling</span></div>
      <div><b>報廢重工管理</b><span>Scrap / Rework Management</span></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </nav>

  <main class="wrap">
    <div id="screen" aria-live="polite"></div>
    <footer class="foot">Jvision 系統 Demo · 報廢重工管理平台 · 資料為示意用途，非真實生產數據</footer>
  </main>

  <script>
  (function(){
    var C={grid:"#CBD5E1",tick:"#475569",ac:"#2563EB",ac2:"#3B82F6",ok:"#047857",warn:"#EA580C",bad:"#DC2626"};
    var charts={};

    function killCharts(){
      for(var k in charts){try{charts[k].destroy();}catch(e){}}
      charts={};
    }

    Chart.defaults.color=C.tick;
    Chart.defaults.font.family="'Fira Sans', sans-serif";
    Chart.defaults.borderColor=C.grid;

    var MODS=[
      {icon:"fact_check",name:"不良品判定",sub:"缺陷登錄"},
      {icon:"rule",name:"處置判定",sub:"報廢/重工"},
      {icon:"build",name:"重工作業",sub:"SOP 指導"},
      {icon:"verified",name:"品質驗證",sub:"複檢放行"},
      {icon:"request_quote",name:"成本歸檔",sub:"COQ"},
      {icon:"monitoring",name:"成效看板",sub:"KPI"}
    ];

    function el(id){return document.getElementById(id)}
    function head(icon,t,d){
      return '<header class="scr-head"><h1><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+t+'</h1><p>'+d+'</p></header>';
    }
    function kpi(icon,lab,val,unit,dl,cls){
      return '<article class="kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dl '+cls+'">'+dl+'</div></article>';
    }
    function tag(cls,t){return '<span class="tag '+cls+'">'+t+'</span>'}

    function s0(){
      var rows=[
        {id:"NCR-2408-1042",part:"CNC-機殼A1",lot:"LOT-77321",qty:36,def:"尺寸超差",code:"D-102",sev:"重大",st:"t-bad",img:3},
        {id:"NCR-2408-1041",part:"注塑上蓋B2",lot:"LOT-77318",qty:12,def:"表面刮傷",code:"S-044",sev:"次要",st:"t-warn",img:2},
        {id:"NCR-2408-1039",part:"PCBA-主板",lot:"LOT-77310",qty:8,def:"焊點虛焊",code:"E-211",sev:"重大",st:"t-bad",img:5},
        {id:"NCR-2408-1037",part:"鋁擠型框",lot:"LOT-77302",qty:24,def:"氧化色差",code:"S-051",sev:"次要",st:"t-warn",img:1},
        {id:"NCR-2408-1035",part:"齒輪箱蓋",lot:"LOT-77295",qty:5,def:"毛邊未除",code:"M-018",sev:"輕微",st:"t-mut",img:2}

          kpi("recycling","報廢率","2.0","%","起始 5.8%","up")+
          kpi("schedule","批號追溯時間","14","分","起始 191 分","up")+
          kpi("event_available","客訴關案","9.2","天","起始 21 天","up")+
        '</section>'+
        '<section class="grid g23">'+
          '<article class="card"><h3><span class="material-symbols-outlined">trending_up</span>改善驗證率趨勢<span class="sub">6 週</span></h3><div class="chartbox" style="height:250px"><canvas id="c5a" aria-label="改善驗證率趨勢圖"></canvas></div></article>'+
          '<article class="card"><h3><span class="material-symbols-outlined">factory</span>各工站成效<span class="sub">重工成功率</span></h3>'+lr+'</article>'+
        '</section>'+
        '<section class="grid g2" style="margin-top:18px">'+
          '<article class="card"><h3><span class="material-symbols-outlined">bar_chart</span>報廢率 vs 重工成功率<span class="sub">近6月</span></h3><div class="chartbox" style="height:250px"><canvas id="c5b" aria-label="報廢率與重工成功率對比圖"></canvas></div></article>'+
          '<article class="card"><h3><span class="material-symbols-outlined">history</span>改善行動時間軸</h3><div class="tl">'+tl+'</div></article>'+
        '</section>';
      void el("screen").offsetHeight;
      charts.c5a=new Chart(el("c5a"),{
        type:"line",
        data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"改善驗證率 %",data:[67,72,77,82,87,92],borderColor:"#2563EB",backgroundColor:"rgba(37,99,235,.13)",fill:true,tension:0,pointRadius:4,pointBackgroundColor:"#EA580C"}]},
        options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid}},y:{grid:{color:C.grid},min:50,max:100}}}
      });
      charts.c5b=new Chart(el("c5b"),{
        data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
          {type:"line",label:"重工成功率 %",data:[74,79,83,87,90,92],borderColor:"#2563EB",backgroundColor:"#2563EB",tension:0,pointRadius:4,yAxisID:"y",fill:false},
          {type:"bar",label:"報廢率 %",data:[5.1,4.4,3.6,3.0,2.4,2.0],backgroundColor:"#DC2626",yAxisID:"y1"}
        ]},
        options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:13}}},scales:{x:{grid:{color:C.grid}},y:{position:"left",grid:{color:C.grid},min:60,max:100,title:{display:true,text:"成功率%"}},y1:{position:"right",grid:{drawOnChartArea:false},min:0,max:8,title:{display:true,text:"報廢率%"}}}}
      });
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    el("tabs").innerHTML=MODS.map(function(m,i){
      return '<button type="button" class="tab" data-i="'+i+'" aria-label="'+m.name+'，'+m.sub+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';
    }).join("");

    function show(i){
      killCharts();
      var tabs=document.querySelectorAll("[data-i]");
      for(var k=0;k<tabs.length;k++){
        var active=+tabs[k].getAttribute("data-i")===i;
        tabs[k].classList.toggle("on",active);
        tabs[k].setAttribute("aria-current",active?"page":"false");
      }
      el("screen").style.animation="none";
      void el("screen").offsetHeight;
      el("screen").style.animation="";
      SCREENS[i]();
      document.title=MODS[i].name+"｜報廢重工管理｜Jvision 系統 Demo";
    }

    var tabsEl=document.querySelectorAll("[data-i]");
    for(var j=0;j<tabsEl.length;j++){
      tabsEl[j].addEventListener("click",function(){
        var i=+this.getAttribute("data-i");
        var next="#go="+i;
        if(location.hash===next){show(i)}
        else{location.hash=next}
        try{window.scrollTo(0,0)}catch(e){}
      });
    }

    window.show=show;
  })();

  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return}
    var n=document.querySelectorAll("[data-i]").length||6;
    show(Math.min(+m[1],n-1));
    try{window.scrollTo(0,0)}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
  </script>
</body>
</html>
