<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生產進階規劃排程系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A14905;
  --bad:#B91C1C;
  --violet:#6D28D9;
  --radius:8px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.3);
  outline-offset:3px;
}
.material-symbols-outlined{
  display:inline-block;
  direction:ltr;
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:normal;
  letter-spacing:normal;
  line-height:1;
  text-transform:none;
  white-space:nowrap;
}
.mi{font-size:18px;vertical-align:-4px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:24px 16px 18px;
  overflow:auto;
  color:#DBEAFE;
  background:#0F172A;
  border-right:1px solid #1E293B;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px}
.logo{
  display:grid;
  flex:none;
  width:42px;
  height:42px;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border:1px solid #60A5FA;
  border-radius:6px;
  box-shadow:5px 5px 0 rgba(59,130,246,.22);
}
.logo .material-symbols-outlined{font-size:24px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.02em}
.brand span:last-child{display:block;margin-top:2px;color:#94A3B8;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
  display:grid;
  grid-template-columns:22px minmax(0,1fr) 22px;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:44px;
  padding:10px 11px;
  color:#CBD5E1;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s;
}
.nav button:hover{color:#fff;background:#1E293B;border-color:#334155;transform:translateX(2px)}
.nav button.on{color:#fff;background:var(--color-primary);border-color:#60A5FA}
.nav button .material-symbols-outlined{font-size:20px}
.nav .txt{overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.nav .num{
  color:inherit;
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:right;
  opacity:.7;
}
.rail .foot{
  margin-top:auto;
  padding:18px 8px 0;
  color:#94A3B8;
  font-size:11px;
  line-height:1.7;
  border-top:1px solid #334155;
}
.main{min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:78px;
  padding:13px clamp(16px,3vw,36px);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(12px);
}
.topbar .tt{min-width:0}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:18px;
  font-weight:700;
  letter-spacing:-.02em;
}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:23px}
.topbar .sub{margin-top:2px;color:var(--color-muted-foreground);font-size:12px}
.spacer{flex:1}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:30px;
  padding:5px 10px;
  color:#1E40AF;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:999px;
}
.chip.g{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.pulse{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #DCFCE7;
  border-radius:50%;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(21,128,61,.35)}
  50%{box-shadow:0 0 0 5px rgba(21,128,61,0)}
}
.view{min-width:0;padding:24px clamp(14px,3vw,36px) 48px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi,.card,.list{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{
  position:relative;
  min-width:0;
  padding:15px 16px 14px;
  overflow:hidden;
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.kpi::after{
  position:absolute;
  right:-18px;
  bottom:-25px;
  width:72px;
  height:72px;
  content:"";
  background:var(--color-muted);
  border-radius:50%;
  opacity:.55;
}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:0 10px 24px rgba(37,99,235,.08)}
.kpi .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .v{
  position:relative;
  z-index:1;
  margin-top:7px;
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.04em;
}
.kpi .v small{color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:500}
.kpi .d{position:relative;z-index:1;margin-top:2px;color:var(--color-muted-foreground);font-size:11px;font-weight:500}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.card,.list{min-width:0;overflow:hidden}
.card{transition:border-color .22s,box-shadow .22s}
.card:hover{border-color:#CBD5E1;box-shadow:0 12px 28px rgba(15,23,42,.065)}
.card-h{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:50px;
  padding:11px 15px;
  background:#fff;
  border-bottom:1px solid var(--color-border);
}
.card-h h3{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:700}
.card-h h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card-h .r{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-left:auto;color:var(--color-muted-foreground);font-size:11px}
.card-b{padding:15px}
.grid2,.grid-3-2,.grid-2-3,.split{display:grid;align-items:start;gap:16px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.grid-2-3{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.split{grid-template-columns:330px minmax(0,1fr)}
.detail{display:flex;min-width:0;flex-direction:column;gap:16px}
.list-h{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:48px;
  padding:11px 13px;
  font-size:12px;
  font-weight:700;
  border-bottom:1px solid var(--color-border);
}
.list-h .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.list-h .cnt{margin-left:auto;padding:2px 8px;color:#1D4ED8;font-size:10px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px}
.li{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:11px 13px;
  border-bottom:1px solid var(--color-border);
  transition:background-color .2s,box-shadow .2s;
}
.li:last-child{border-bottom:0}
.li:hover{background:#F8FAFC}
.li.sel{background:#EFF6FF;box-shadow:inset 3px 0 var(--color-primary)}
.li .top{display:flex;align-items:center;gap:7px}
.li .id,.tk .ti{font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.li .cust{
  max-width:120px;
  margin-left:auto;
  overflow:hidden;
  color:var(--color-muted-foreground);
  font-size:11px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.li .meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--color-muted-foreground);font-size:10.5px}
.li .meta b{color:var(--color-foreground);font-family:"Fira Code",monospace;font-weight:600}
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 7px;
  font-size:10px;
  font-weight:700;
  line-height:1.55;
  white-space:nowrap;
  border:1px solid transparent;
  border-radius:4px;
}
.b-red{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.b-amb{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.b-grn{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.b-blu{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.b-gry{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.b-pnk{color:#9A3412;background:#FFF7ED;border-color:#FED7AA}
.b-vio{color:#5B21B6;background:#F5F3FF;border-color:#DDD6FE}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
thead th{
  padding:9px 11px;
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
  background:#F1F5F9;
  border-bottom:1px solid #CBD5E1;
}
tbody td{padding:10px 11px;vertical-align:middle;border-bottom:1px solid var(--color-border)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#F8FAFC}
td.num,th.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
tbody td:first-child b{font-family:"Fira Code",monospace}
.twrap{max-width:100%;overflow-x:auto}
.bar{height:7px;min-width:60px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:2px}
.bar.g>i{background:var(--ok)}.bar.a>i{background:#D97706}
.mini{color:var(--color-muted-foreground);font-size:10.5px}
.field{display:flex;min-width:0;flex-direction:column;gap:3px}
.field .k{color:var(--color-muted-foreground);font-size:10px;font-weight:600}
.field .v{font-size:13px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.canv{position:relative;width:100%}
canvas{max-width:100%}
.gantt{min-width:720px}
.gantt-head{display:grid;grid-template-columns:130px repeat(12,1fr);color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:9px;font-weight:600;border-bottom:1px solid var(--color-border)}
.gantt-head div{padding:7px 2px;text-align:center;border-left:1px dashed #CBD5E1}
.gantt-head div:first-child{padding-left:10px;text-align:left;border-left:0}
.gantt-row{display:grid;grid-template-columns:130px 1fr;align-items:center;min-height:43px;border-bottom:1px solid var(--color-border)}
.gantt-lbl{display:flex;flex-direction:column;gap:1px;padding:0 10px;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.gantt-lbl small{color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:9px;font-weight:400}
.gantt-track{position:relative;height:43px;background:repeating-linear-gradient(90deg,transparent,transparent calc(8.333% - 1px),#E2E8F0 calc(8.333% - 1px),#E2E8F0 8.333%)}
.gbar{
  position:absolute;
  top:8px;
  display:flex;
  align-items:center;
  height:27px;
  padding:0 7px;
  overflow:hidden;
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  white-space:nowrap;
  border-radius:3px;
  box-shadow:0 2px 5px rgba(15,23,42,.18);
}
.gbar.acc{background:#C2410C}.gbar.blu{background:#1D4ED8}.gbar.grn{background:#15803D}
.gbar.amb{background:#A14905}.gbar.vio{background:#6D28D9}.gbar.gry{color:#0F172A;background:#CBD5E1}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;min-width:720px}
.col{min-width:0;padding:9px;background:#F8FAFC;border:1px solid var(--color-border);border-radius:6px}
.col-h{display:flex;align-items:center;gap:7px;padding:2px 3px 9px;font-size:11px;font-weight:700}
.col-h .dot{width:8px;height:8px;border-radius:2px}
.col-h .n{margin-left:auto;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px}
.tk{margin-bottom:8px;padding:9px;background:#fff;border:1px solid var(--color-border);border-radius:5px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tk:last-child{margin-bottom:0}
.tk .ti{display:flex;align-items:center;gap:6px}
.tk .tm{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px;color:var(--color-muted-foreground);font-size:10px}
.tk .av{display:grid;flex:none;width:20px;height:20px;place-items:center;color:#fff;font-size:9px;font-weight:700;background:var(--color-primary);border-radius:50%}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-border)}
.srow:last-child{border-bottom:0}
.srow .ic{display:grid;flex:none;width:34px;height:34px;place-items:center;color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:5px}
.srow .ic .material-symbols-outlined{font-size:18px}
.srow .nm{min-width:0;font-size:12px;font-weight:600}
.srow .nm small{display:block;color:var(--color-muted-foreground);font-size:10px;font-weight:400}
.srow .val{flex:none;margin-left:auto;text-align:right}
.srow .val b{font-family:"Fira Code",monospace;font-size:13px}
.tl{position:relative;padding-left:22px}
.tl::before{position:absolute;top:4px;bottom:4px;left:6px;width:2px;content:"";background:var(--color-border)}
.tli{position:relative;padding:0 0 16px 6px}
.tli:last-child{padding-bottom:0}
.tli::before{position:absolute;top:3px;left:-20px;width:11px;height:11px;content:"";background:#fff;border:3px solid var(--color-secondary);border-radius:50%}
.tli.done::before{background:var(--color-primary);border-color:var(--color-primary)}
.tli .tt2{font-size:12px;font-weight:700}
.tli .td{margin-top:2px;color:var(--color-muted-foreground);font-size:10.5px}
.tli .tw{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.seg{display:inline-flex;padding:3px;background:#E9EFF8;border:1px solid #D5DEEB;border-radius:5px}
.seg span{padding:4px 10px;color:var(--color-muted-foreground);font-size:10.5px;font-weight:600;border-radius:3px}
.seg span.on{color:#fff;background:var(--color-primary)}
.matrix{width:100%;min-width:560px;border-collapse:separate;border-spacing:4px}
.matrix td{padding:9px 6px;color:#fff;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;text-align:center;border:0;border-radius:3px}
.matrix .hd{color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:10px;background:transparent}
.load-lo{background:#15803D}.load-md{background:#A14905}.load-hi{background:#B91C1C}.load-ov{background:#7F1D1D}
.note{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:10px 12px;
  color:#7C2D12;
  font-size:11.5px;
  background:#FFF7ED;
  border:1px solid #FDBA74;
  border-left:4px solid var(--color-accent);
  border-radius:5px;
}
.note .material-symbols-outlined{flex:none;margin-top:1px;font-size:18px}
.legend{display:flex;flex-wrap:wrap;gap:11px;color:var(--color-muted-foreground);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid rgba(15,23,42,.16);border-radius:2px}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 10px;
  color:var(--color-foreground);
  font-size:11px;
  font-weight:600;
  background:#fff;
  border:1px solid #CBD5E1;
  border-radius:5px;
  transition:color .2s,background-color .2s,border-color .2s,transform .2s,box-shadow .2s;
}
.btn:hover{color:#1D4ED8;background:#EFF6FF;border-color:#93C5FD;transform:translateY(-1px)}
.btn.pri{color:#fff;background:#C2410C;border-color:#9A3412}
.btn.pri:hover{color:#fff;background:#9A3412;border-color:#7C2D12}
.btn .material-symbols-outlined{font-size:16px}
.grid-item{animation:grid-in .4s cubic-bezier(.34,1.45,.64,1) both}
@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1080px){.split{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:960px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .shell{display:block}
  .rail{position:static;width:100%;height:auto;padding:14px}
  .brand{padding:0 4px 12px}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px}
  .nav button{display:flex;justify-content:center;padding:9px}
  .nav .txt,.nav .num{display:none}
  .rail .foot{display:none}
  .topbar{top:0}
}
@media(max-width:820px){
  .split,.grid2,.grid-3-2,.grid-2-3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .topbar{align-items:flex-start;padding:12px 14px}
  .topbar .sub{max-width:220px}
  .topbar>.chip{display:none}
  .view{padding:15px 12px 34px}
  .kpis{gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-b{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .grid-item{animation:none!important;opacity:1!important;transform:none!important}
  .pulse{animation:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>APS 排程中樞</b><span>Advanced Planning &amp; Scheduling</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot">O茂精機股份有限公司<br>第二廠 · 生管排程室<br>資料為模擬示範用途</div>
  </aside>
  <main class="main">
    <header class="topbar">

function kpi(ic,l,v,u,d,cls){
  return '<div class="kpi grid-item"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="d '+(cls||"")+'">'+(cls==="up"?"▲ ":cls==="down"?"▼ ":"")+d+'</div></div>'
}
function field(k,v){return '<div class="field"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function srow(ic,nm,sub,val){return '<div class="srow"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div><div class="nm">'+nm+'<small>'+sub+'</small></div><div class="val"><b>'+val+'</b></div></div>'}
function loadRow(nm,arr){
  var cells=arr.map(function(v){var c=v>=95?"load-ov":v>=85?"load-hi":v>=70?"load-md":"load-lo";return '<td class="'+c+'">'+v+'%</td>'}).join("");
  return '<tr><td class="hd" style="text-align:left">'+nm+'</td>'+cells+'</tr>'
}
function ganttHead(){
  var h='<div class="gantt-head"><div>機台 / 內容</div>';
  for(var i=8;i<=19;i++)h+='<div>'+i+':00</div>';
  return h+'</div>'
}
function ganttRow(mc,desc,bars){
  var b=bars.map(function(x){var left=x[0]/12*100,w=x[1]/12*100;return '<div class="gbar '+x[2]+'" style="left:'+left+'%;width:calc('+w+'% - 4px)">'+x[3]+'</div>'}).join("");
  return '<div class="gantt-row"><div class="gantt-lbl">'+mc+'<small>'+desc+'</small></div><div class="gantt-track">'+b+'</div></div>'
}
function boardCol(title,color,st){
  var items=WO.filter(function(w){return w.st===st});
  var cards=items.map(function(w){
    return '<div class="tk"><div class="ti">'+w.id+'</div><div class="tm"><span class="av">'+esc(w.op.charAt(0))+'</span><span>'+esc(w.item)+'</span></div><div class="tm"><span>'+esc(w.line)+'</span><span>'+w.done.toLocaleString()+'/'+w.qty.toLocaleString()+'</span></div></div>'
  }).join("");
  return '<div class="col"><div class="col-h"><span class="dot" style="background:'+color+'"></span>'+title+'<span class="n">'+items.length+'</span></div>'+(cards||'<div class="mini" style="padding:8px 4px">無工單</div>')+'</div>'
}
function scen(nm,ot,dl,ov,cost,cls){return '<tr><td><b>'+nm+'</b></td><td><span class="badge '+cls+'">'+ot+'</span></td><td class="num">'+dl+'</td><td class="num">'+ov+'</td><td class="num">'+cost+'</td><td><span class="mini">試算完成</span></td></tr>'}
function tli(cls,t,d,w){return '<div class="tli '+cls+'"><div class="tt2">'+t+'</div><div class="td">'+d+'</div><div class="tw">'+w+'</div></div>'}
function initCharts(i){

  Chart.defaults.font.family="'Fira Sans',sans-serif";
  Chart.defaults.font.size=11;
  Chart.defaults.color="#475569";
  var A="#2563EB",A2="#EA580C",grid="#E2E8F0";
  if(i===0){
    var e=document.getElementById("c0a");
    if(e)charts.push(new Chart(e,{type:"doughnut",data:{labels:["急單","高","一般"],datasets:[{data:[3,2,3],backgroundColor:["#B91C1C",A2,A],borderColor:"#FFFFFF",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}}}}));
    var e2=document.getElementById("c0b");
    if(e2)charts.push(new Chart(e2,{type:"bar",data:{labels:["08/13","08/14","08/15","08/16","08/17","08/18","08/19"],datasets:[{label:"到期訂單數",data:[2,1,3,2,1,2,1],backgroundColor:A,borderRadius:3,barThickness:16}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:grid}},x:{grid:{display:false}}}}}))
  }else if(i===1){
    var a=document.getElementById("c1a");
    if(a)charts.push(new Chart(a,{type:"doughnut",data:{labels:["充足","待到料","缺料"],datasets:[{data:[3,2,1],backgroundColor:["#15803D","#A14905","#B91C1C"],borderColor:"#FFFFFF",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}}}}))
  }else if(i===2){
    var b=document.getElementById("c2a");
    if(b)charts.push(new Chart(b,{type:"bar",data:{labels:["第一線","第二線","第三線","第四線","第五線"],datasets:[{label:"已排時數",data:[10.6,8.5,9.2,7.6,6.2],backgroundColor:A,borderRadius:3},{label:"可用時數",data:[12,12,10,12,9],backgroundColor:"#BFDBFE",borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}},scales:{y:{beginAtZero:true,grid:{color:grid},title:{display:true,text:"小時"}},x:{grid:{display:false}}}}}))
  }else if(i===4){
    var c=document.getElementById("c4a");
    if(c)charts.push(new Chart(c,{type:"line",data:{labels:["08/13","08/15","08/17","08/19","08/21","08/23","08/25"],datasets:[{label:"累積 ATP (千件)",data:[3.2,5.6,7.4,9.1,10.3,11,11.5],borderColor:A,backgroundColor:"rgba(37,99,235,.10)",fill:true,tension:.3,pointRadius:3,pointBackgroundColor:A},{label:"已承諾累積",data:[1.1,2.4,4,5.8,7.2,8.6,9.9],borderColor:A2,borderDash:[5,4],fill:false,tension:.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}},scales:{y:{beginAtZero:true,grid:{color:grid}},x:{grid:{display:false}}}}}))
  }else if(i===5){
    var d=document.getElementById("c5a");
    if(d)charts.push(new Chart(d,{type:"radar",data:{labels:["準時交付","成本","產線負載","急單保障","實施速度"],datasets:[{label:"B 案(建議)",data:[99,78,88,95,90],borderColor:A,backgroundColor:"rgba(37,99,235,.14)",borderWidth:2,pointBackgroundColor:A},{label:"A 案",data:[92,95,70,72,96],borderColor:"#64748B",backgroundColor:"rgba(100,116,139,.08)",borderWidth:2,pointBackgroundColor:"#64748B"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}},scales:{r:{beginAtZero:true,min:0,max:100,ticks:{stepSize:25,backdropColor:"transparent"},grid:{color:grid},pointLabels:{font:{size:11}}}}}}));
    var d2=document.getElementById("c5b");
    if(d2)charts.push(new Chart(d2,{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"準時交付率 %",data:[85,88,91,93,96,99],borderColor:A,backgroundColor:"rgba(37,99,235,.10)",fill:true,tension:.3,pointRadius:3,pointBackgroundColor:A}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:80,max:100,grid:{color:grid}},x:{grid:{display:false}}}}}))
  }

var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODS.map(function(m,i){
    return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="num">0'+(i+1)+'</span></button>'
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){
      var i=+b.getAttribute("data-i");
      if(location.hash!=="#v"+i)location.hash="v"+i;
      else show(i)
    })
  })
}
function show(i){
  i=Math.max(0,Math.min(5,i|0));
  var m=MODS[i];
  document.getElementById("tIcon").textContent=m.icon;
  document.getElementById("tTitle").textContent=m.name;
  document.getElementById("tSub").textContent=m.sub;
  document.title=m.name+"｜生產進階規劃排程系統";
  Array.prototype.forEach.call(document.querySelectorAll("#nav [data-i]"),function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false")
  });
  var c=document.getElementById("view");
  killCharts();
  c.innerHTML=RENDER[i]();
  Array.prototype.forEach.call(c.querySelectorAll(".grid-item"),function(el,index){el.style.animationDelay=Math.min(index*60,300)+"ms"});
  initCharts(i)
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],5):0);
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
