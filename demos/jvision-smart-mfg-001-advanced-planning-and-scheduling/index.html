<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>APS 先進規劃排程系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#e11d48;--accent2:#fb7185;--accent-soft:#fff1f3;
  --ink:#1f2430;--sub:#6b7280;--line:#eceef2;--bg:#f5f6f8;--card:#fff;
  --ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#2563eb;
  --radius:14px;--shadow:0 1px 3px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
.mi{font-size:20px;vertical-align:-4px}
.shell{display:flex;min-height:100vh;align-items:stretch}
.shell>*{min-width:0}
.rail{width:240px;flex:none;background:linear-gradient(170deg,#3f1220 0%,#7f1030 55%,#e11d48 140%);color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;display:block}
.brand span{font-size:11px;opacity:.72;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:rgba(255,255,255,.82);font-family:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;transition:.16s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav button .num{margin-left:auto;font-size:11px;opacity:.55;flex:none}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.on{background:#fff;color:var(--accent);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.nav button.on .num{opacity:.5}
.rail .foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;opacity:.6;line-height:1.6;border-top:1px solid rgba(255,255,255,.14)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .tt{min-width:0}
.topbar h1{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:23px}
.topbar .sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.g{background:#ecfdf3;color:var(--ok)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}50%{box-shadow:0 0 0 6px rgba(22,163,74,0)}}
.view{padding:22px 26px 40px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .l{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .v{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub)}
.kpi .d{font-size:11.5px;font-weight:600;margin-top:3px}
.up{color:var(--ok)}.down{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card-h .r{margin-left:auto;font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3-2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.grid-2-3{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.list-h{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.list-h .material-symbols-outlined{font-size:18px;color:var(--accent)}
.list-h .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:999px}
.li{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;position:relative;transition:.14s}
.li:last-child{border-bottom:0}
.li:hover{background:#fafbfc}
.li.sel{background:var(--accent-soft)}
.li.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.li .top{display:flex;align-items:center;gap:8px}
.li .id{font-size:12.5px;font-weight:800;letter-spacing:.2px}
.li .cust{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.li .meta{display:flex;gap:8px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.li .meta b{color:var(--ink);font-weight:600}
.detail{min-width:0;display:flex;flex-direction:column;gap:16px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.b-red{background:#fee2e2;color:#b91c1c}.b-amb{background:#fef3c7;color:#b45309}.b-grn{background:#dcfce7;color:#15803d}
.b-blu{background:#dbeafe;color:#1d4ed8}.b-gry{background:#eef0f3;color:#475569}.b-pnk{background:var(--accent-soft);color:var(--accent)}
.b-vio{background:#ede9fe;color:#6d28d9}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{text-align:left;font-size:11.5px;font-weight:700;color:var(--sub);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfbfc}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.twrap{overflow-x:auto}
.bar{height:7px;border-radius:6px;background:#eef0f3;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.bar.g>i{background:linear-gradient(90deg,#4ade80,#16a34a)}
.bar.a>i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.mini{font-size:11.5px;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:3px}
.field .k{font-size:11px;color:var(--sub);font-weight:600}
.field .v{font-size:14px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.canv{position:relative;width:100%}
canvas{max-width:100%}
.gantt{min-width:720px}
.gantt-head{display:grid;grid-template-columns:130px repeat(12,1fr);font-size:10.5px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line)}
.gantt-head div{padding:6px 2px;text-align:center;border-left:1px dashed #f0f1f4}
.gantt-head div:first-child{border-left:0;text-align:left;padding-left:10px}
.gantt-row{display:grid;grid-template-columns:130px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:42px}
.gantt-lbl{font-size:12px;font-weight:700;padding:0 10px;display:flex;flex-direction:column;gap:1px}
.gantt-lbl small{font-weight:500;color:var(--sub);font-size:10.5px}
.gantt-track{position:relative;height:42px;background:repeating-linear-gradient(90deg,transparent,transparent calc(8.333% - 1px),#f2f3f6 calc(8.333% - 1px),#f2f3f6 8.333%)}
.gbar{position:absolute;top:8px;height:26px;border-radius:7px;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.gbar.acc{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.gbar.blu{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.gbar.grn{background:linear-gradient(90deg,#16a34a,#4ade80)}
.gbar.amb{background:linear-gradient(90deg,#d97706,#fbbf24)}
.gbar.vio{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.gbar.gry{background:linear-gradient(90deg,#94a3b8,#cbd5e1);color:#334155}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px}
.col{background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col-h{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;padding:2px 4px 10px}
.col-h .dot{width:9px;height:9px;border-radius:3px}
.col-h .n{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tk:last-child{margin-bottom:0}
.tk .ti{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.tk .tm{font-size:11px;color:var(--sub);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.tk .av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.srow .ic .material-symbols-outlined{font-size:19px}
.srow .nm{font-size:13px;font-weight:600;min-width:0}
.srow .nm small{display:block;color:var(--sub);font-size:11px;font-weight:400}
.srow .val{margin-left:auto;text-align:right;flex:none}
.srow .val b{font-size:15px;font-weight:800}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 6px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tli.done::before{background:var(--accent);border-color:var(--accent)}
.tli .tt2{font-size:13px;font-weight:700}
.tli .td{font-size:11.5px;color:var(--sub);margin-top:2px}
.tli .tw{font-size:11px;color:var(--accent);font-weight:700}
.seg{display:inline-flex;background:#f1f2f5;border-radius:9px;padding:3px}
.seg span{font-size:12px;font-weight:600;color:var(--sub);padding:5px 12px;border-radius:7px}
.seg span.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.matrix{width:100%;border-collapse:separate;border-spacing:4px;min-width:560px}
.matrix td{text-align:center;padding:10px 6px;border-radius:8px;font-size:12px;font-weight:700;color:#fff}
.matrix .hd{background:transparent;color:var(--sub);font-weight:700;font-size:11px}
.load-lo{background:#4ade80}.load-md{background:#fbbf24}.load-hi{background:#fb7185}.load-ov{background:#e11d48}
.note{background:var(--accent-soft);border:1px solid #fbcfe0;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#9f1239;display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{font-size:19px;flex:none;margin-top:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn .material-symbols-outlined{font-size:17px}
@media(max-width:1080px){.split{grid-template-columns:280px 1fr}}
@media(max-width:960px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .rail{width:100%;height:auto;position:static;flex-direction:column}
  .shell{flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;flex:none;white-space:nowrap}
  .nav button .num{display:none}
  .brand{padding-bottom:10px}
  .rail .foot{display:none}
}
@media(max-width:820px){
  .split{grid-template-columns:1fr}
  .grid2,.grid-3-2,.grid-2-3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:10px}
  .view{padding:16px 14px 34px}
  .topbar{padding:12px 14px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .fgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>

function kpi(ic,l,v,u,d,cls){
  return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="d '+(cls||'')+'">'+(cls==='up'?'▲ ':cls==='down'?'▼ ':'')+d+'</div></div>';
}
function field(k,v){return '<div class="field"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
function srow(ic,nm,sub,val){return '<div class="srow"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div><div class="nm">'+nm+'<small>'+sub+'</small></div><div class="val"><b>'+val+'</b></div></div>';}
function loadRow(nm,arr){
  var cells=arr.map(function(v){var c=v>=95?'load-ov':v>=85?'load-hi':v>=70?'load-md':'load-lo';return '<td class="'+c+'">'+v+'%</td>';}).join("");
  return '<tr><td class="hd" style="text-align:left">'+nm+'</td>'+cells+'</tr>';
}
function ganttHead(){
  var h='<div class="gantt-head"><div>機台 / 內容</div>';
  for(var i=8;i<=19;i++){h+='<div>'+i+':00</div>';}
  return h+'</div>';
}
function ganttRow(mc,desc,bars){
  var b=bars.map(function(x){var left=x[0]/12*100,w=x[1]/12*100;return '<div class="gbar '+x[2]+'" style="left:'+left+'%;width:calc('+w+'% - 4px)">'+x[3]+'</div>';}).join("");
  return '<div class="gantt-row"><div class="gantt-lbl">'+mc+'<small>'+desc+'</small></div><div class="gantt-track">'+b+'</div></div>';
}
function boardCol(title,color,st){
  var items=WO.filter(function(w){return w.st===st;});
  var cards=items.map(function(w){
    return '<div class="tk"><div class="ti">'+w.id+'</div><div class="tm"><span class="av">'+esc(w.op.charAt(0))+'</span><span>'+esc(w.item)+'</span></div>'+
      '<div class="tm"><span>'+esc(w.line)+'</span><span>'+w.done.toLocaleString()+'/'+w.qty.toLocaleString()+'</span></div></div>';
  }).join("");
  return '<div class="col"><div class="col-h"><span class="dot" style="background:'+color+'"></span>'+title+'<span class="n">'+items.length+'</span></div>'+(cards||'<div class="mini" style="padding:8px 4px">無工單</div>')+'</div>';
}
function scen(nm,ot,dl,ov,cost,cls){
  return '<tr><td><b>'+nm+'</b></td><td><span class="badge '+cls+'">'+ot+'</span></td><td class="num">'+dl+'</td><td class="num">'+ov+'</td><td class="num">'+cost+'</td><td><span class="mini">試算完成</span></td></tr>';
}
function tli(cls,t,d,w){return '<div class="tli '+cls+'"><div class="tt2">'+t+'</div><div class="td">'+d+'</div><div class="tw">'+w+'</div></div>';}

  killCharts();

  Chart.defaults.font.size=11;
  Chart.defaults.color="#6b7280";
  var A="#e11d48",A2="#fb7185";
  if(i===0){
    var e=document.getElementById("c0a");
    if(e)charts.push(new Chart(e,{type:"doughnut",data:{labels:["急單","高","一般"],datasets:[{data:[3,2,3],backgroundColor:[A,A2,"#fecdd3"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}}}}));
    var e2=document.getElementById("c0b");
    if(e2)charts.push(new Chart(e2,{type:"bar",data:{labels:["08/13","08/14","08/15","08/16","08/17","08/18","08/19"],datasets:[{label:"到期訂單數",data:[2,1,3,2,1,2,1],backgroundColor:A,borderRadius:5,barThickness:16}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:"#f0f1f4"}},x:{grid:{display:false}}}}}));
  }else if(i===1){
    var e=document.getElementById("c1a");
    if(e)charts.push(new Chart(e,{type:"doughnut",data:{labels:["充足","待到料","缺料"],datasets:[{data:[3,2,1],backgroundColor:["#16a34a","#f59e0b",A],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}}}}));
  }else if(i===2){
    var e=document.getElementById("c2a");
    if(e)charts.push(new Chart(e,{type:"bar",data:{labels:["第一線","第二線","第三線","第四線","第五線"],datasets:[{label:"已排時數",data:[10.6,8.5,9.2,7.6,6.2],backgroundColor:A,borderRadius:5},{label:"可用時數",data:[12,12,10,12,9],backgroundColor:"#fecdd3",borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}},scales:{y:{beginAtZero:true,grid:{color:"#f0f1f4"},title:{display:true,text:"小時"}},x:{grid:{display:false}}}}}));
  }else if(i===4){
    var e=document.getElementById("c4a");
    if(e)charts.push(new Chart(e,{type:"line",data:{labels:["08/13","08/15","08/17","08/19","08/21","08/23","08/25"],datasets:[{label:"累積 ATP (千件)",data:[3.2,5.6,7.4,9.1,10.3,11.0,11.5],borderColor:A,backgroundColor:"rgba(225,29,72,.10)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:A},{label:"已承諾累積",data:[1.1,2.4,4.0,5.8,7.2,8.6,9.9],borderColor:A2,borderDash:[5,4],fill:false,tension:.35,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}},scales:{y:{beginAtZero:true,grid:{color:"#f0f1f4"}},x:{grid:{display:false}}}}}));
  }else if(i===5){
    var e=document.getElementById("c5a");
    if(e)charts.push(new Chart(e,{type:"radar",data:{labels:["準時交付","成本","產線負載","急單保障","實施速度"],datasets:[{label:"B 案(建議)",data:[99,78,88,95,90],borderColor:A,backgroundColor:"rgba(225,29,72,.16)",borderWidth:2,pointBackgroundColor:A},{label:"A 案",data:[92,95,70,72,96],borderColor:"#94a3b8",backgroundColor:"rgba(148,163,184,.12)",borderWidth:2,pointBackgroundColor:"#94a3b8"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:12}}},scales:{r:{beginAtZero:true,min:0,max:100,ticks:{stepSize:25,backdropColor:"transparent"},grid:{color:"#e8eaee"},pointLabels:{font:{size:11}}}}}}));
    var e2=document.getElementById("c5b");
    if(e2)charts.push(new Chart(e2,{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"準時交付率 %",data:[85,88,91,93,96,99],borderColor:A,backgroundColor:"rgba(225,29,72,.10)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:A}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:80,max:100,grid:{color:"#f0f1f4"}},x:{grid:{display:false}}}}}));
  }
}

var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="num">'+(i+1)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});
  });
}
function show(i){
  i=Math.max(0,Math.min(5,i|0));
  var m=MODS[i];
  document.getElementById("tIcon").textContent=m.icon;
  document.getElementById("tTitle").textContent=m.name;
  document.getElementById("tSub").textContent=m.sub;
  var nav=document.querySelectorAll("#nav [data-i]");
  Array.prototype.forEach.call(nav,function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var c=document.getElementById("view");
  killCharts();
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  initCharts(i);
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
