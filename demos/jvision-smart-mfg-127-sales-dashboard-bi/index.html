<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>業務儀表板 Sales Dashboard/BI｜Jvision 系統 Demo</title>
  <meta name="description" content="從名單到成交的完整客戶生命週期管理，單一可操作、可追蹤、可稽核的業績分析平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --accent-d:#1d4ed8;
  --bg:#f8fafc;
  --card:#ffffff;
  --mut:#475569;
  --soft:#f1f5fd;
  --amber:#b45309;
  --red:#dc2626;
  --slate:#475569;
  --deal:#059669;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(37,99,235,.04);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  overflow-x:hidden;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button{cursor:pointer;}
::selection{background:#dbeafe;color:#172554;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:68px;
  padding:10px clamp(16px,3vw,36px);
  background:rgba(255,255,255,.96);
  color:var(--ink);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:240px;}
.brand .logo{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:40px;
  height:40px;
  border-radius:7px;
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.brand .logo .material-symbols-outlined{font-size:23px;}
.brand b{
  display:block;
  font-size:14px;
  font-weight:700;
  line-height:1.3;
  letter-spacing:.01em;
}
.brand span{display:block;margin-top:2px;color:var(--muted);font-size:10.5px;line-height:1.3;}
.nav{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0;margin-left:auto;}
.nav button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:40px;
  padding:8px 10px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:#334155;
  font-size:12px;
  font-weight:500;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:18px;}
.nav button:hover{background:var(--soft);color:var(--blue);}
.nav button.on{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8;font-weight:700;}
.nav button:active{transform:translateY(1px);}
.nav button:focus-visible,
button:focus-visible,
[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.28);
  outline-offset:2px;
  border-color:var(--color-ring);
}

main{width:min(100%,1320px);margin:0 auto;padding:30px clamp(16px,3vw,36px) 64px;}
#view{animation:view-in .35s ease-out both;}
.screen-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:12px;
  margin:0 0 22px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.screen-head h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 5px;
  color:var(--ink);
  font-size:clamp(20px,2.2vw,27px);
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.025em;
}
.screen-head h1 .material-symbols-outlined{font-size:25px;color:var(--blue);}
.screen-head p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6;}
.screen-head p b{color:var(--blue);font-weight:600;}

.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr);}
.grid>*{min-width:0;}

.card,.kpi{
  min-width:0;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#c7d7f6;box-shadow:0 2px 4px rgba(15,23,42,.06),0 10px 24px rgba(37,99,235,.06);}
.card{padding:18px;}
.card.pad0{overflow:hidden;padding:0;}
.card-t{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 3px;
  color:var(--ink);
  font-size:13px;
  font-weight:700;
  letter-spacing:.005em;
}
.card-t .material-symbols-outlined{font-size:19px;color:var(--blue);}
.card-s{margin:0 0 14px;color:var(--muted);font-size:11.5px;}

.kpi{position:relative;overflow:hidden;padding:17px 17px 16px;}
.kpi::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--accent);}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:500;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{
  margin-top:9px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:clamp(24px,2.4vw,30px);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:0;}
.kpi .dt{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:600;}
.kpi .dt.up{color:#047857;}
.kpi .dt.dn{color:#b91c1c;}
.kpi .dt .material-symbols-outlined{font-size:15px;}
.chart{width:100%;min-height:240px;overflow:hidden;}
.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans",sans-serif!important;}
.apexcharts-gridline{stroke:#e4ecfc;}

.tbl-wrap{overflow-x:auto;scrollbar-color:#cbd5e1 transparent;}
table{width:100%;border-collapse:collapse;color:var(--ink);font-size:12px;}
th,td{height:44px;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
th{
  background:var(--soft);
  color:#334155;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.045em;
  text-transform:uppercase;
}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#f8fbff;}
tbody tr:last-child td{border-bottom:0;}
td.num,th.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:500;
}
td:first-child{font-weight:600;}
.bar-cell{position:relative;min-width:130px;}
.bar-cell .track,.rk-b .track,.seg{overflow:hidden;background:#e8eef8;border-radius:2px;}
.bar-cell .track{height:7px;}
.bar-cell .bar,.rk-b .track .bar{height:100%;border-radius:2px;background:var(--blue);}

.bdg{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10.5px;
  font-weight:600;
  line-height:1.35;
}
.bdg .material-symbols-outlined{font-size:13px;}
.b-grn{border-color:#a7f3d0;background:#ecfdf5;color:#065f46;}
.b-amb{border-color:#fde68a;background:#fffbeb;color:#92400e;}
.b-red{border-color:#fecaca;background:#fef2f2;color:#991b1b;}
.b-blu{border-color:#bfdbfe;background:#eff6ff;color:#1e40af;}
.b-gry{border-color:#dbe3ef;background:#f8fafc;color:#475569;}

.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;min-width:1080px;}
.board>*{min-width:0;}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#f6f8fc;}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 9px;border-bottom:2px solid var(--blue);font-size:12px;font-weight:700;}
.col-h .cnt{min-width:24px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:center;}
.col-sum{margin:-2px 2px 1px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:500;}
.deal{padding:11px;border:1px solid var(--line);border-left:3px solid var(--deal);border-radius:5px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;}
.deal:hover{border-color:#bfdbfe;box-shadow:0 5px 14px rgba(37,99,235,.08);transform:translateY(-1px);}
.deal.warn{border-left-color:var(--red);}
.deal.hot{border-left-color:var(--amber);}
.deal .dc{margin-bottom:3px;font-size:12px;font-weight:700;line-height:1.4;}
.deal .dm{margin-bottom:7px;color:var(--muted);font-size:10.5px;}
.deal .damt{color:#047857;font-family:"Fira Code",monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.deal .df{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;}
.ava{display:flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:700;}

.tl{position:relative;padding-left:25px;}
.tl::before{content:"";position:absolute;top:5px;bottom:5px;left:7px;width:1px;background:#bfdbfe;}
.tl-i{position:relative;padding:0 0 17px 4px;}
.tl-i:last-child{padding-bottom:0;}
.tl-i::before{content:"";position:absolute;top:4px;left:-22px;width:9px;height:9px;border:3px solid #dbeafe;border-radius:50%;background:var(--blue);}
.tl-i .tt{font-size:12px;font-weight:700;}
.tl-i .td{margin-top:2px;color:var(--muted);font-size:11px;}
.tl-i .tm{color:#1d4ed8;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;}

.rank{display:flex;align-items:center;gap:11px;padding:10px 3px;border-bottom:1px solid var(--line);}
.rank:last-child{border-bottom:0;}
.rk-n{display:flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:#1d4ed8;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;}
.rank.top .rk-n{border-color:var(--blue);background:var(--blue);color:#fff;}
.rk-b{flex:1;min-width:0;}
.rk-b .n{overflow:hidden;font-size:11.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.rk-b .track{height:6px;margin-top:6px;}
.rk-v{flex:none;min-width:54px;color:var(--ink);font-family:"Fira Code",monospace;font-size:11.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
.quota{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
.quota:last-child{border-bottom:0;}
.seg{flex:1;min-width:0;height:8px;}
.seg .f{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--deal))!important;}

.alert{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px;padding:12px;border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:#fff;}
.alert:last-child{margin-bottom:0;}
.alert .ic{display:flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:5px;}
.alert .ic .material-symbols-outlined{font-size:19px;}
.alert.crit{border-left-color:var(--red);}
.alert.crit .ic{background:#fef2f2;color:#b91c1c;}
.alert.warn2{border-left-color:var(--amber);}
.alert.warn2 .ic{background:#fffbeb;color:#92400e;}
.alert.info{border-left-color:var(--blue);}
.alert.info .ic{background:#eff6ff;color:#1d4ed8;}
.alert .bd{flex:1;min-width:0;}
.alert .bd .at{font-size:12.5px;font-weight:700;line-height:1.4;}
.alert .bd .ad{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.55;}
.alert .bd .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:7px;color:#475569;font-family:"Fira Code",monospace;font-size:10px;}
.alert .bd .meta b{font-family:"Fira Sans",sans-serif;font-weight:600;}
.alert .act{flex:none;align-self:center;}
.pill{display:inline-block;padding:6px 10px;border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;color:#1e40af;font-size:10.5px;font-weight:600;}

.steps{display:flex;gap:9px;flex-wrap:wrap;}
.step{flex:1;min-width:150px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#f8fbff;}
.step .sn{color:#1d4ed8;font-family:"Fira Code",monospace;font-size:9.5px;font-weight:600;letter-spacing:.05em;}
.step .st{margin:4px 0 2px;font-size:12px;font-weight:700;}
.step .sd{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-variant-numeric:tabular-nums;}

.flt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#475569;font-size:11px;font-weight:500;}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600;}
.mini{color:var(--muted);font-size:10.5px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10.5px;}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:middle;}
.split{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px;text-align:center;}

@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:1100px){
  .topbar{align-items:flex-start;gap:10px;flex-direction:column;}
  .nav{justify-content:flex-start;width:100%;margin-left:0;overflow-x:auto;padding-bottom:2px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:820px){
  main{padding-top:22px;}
  .g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr;}
  .screen-head{grid-template-columns:1fr;}
  .card{padding:15px;}
}
@media(max-width:560px){
  .topbar{padding:9px 14px;}
  .brand{min-width:0;}
  .brand span{display:none;}
  .nav{gap:3px;}
  .nav button{min-width:40px;padding:8px;}
  .nav button .lbl{display:none;}
  main{padding-right:14px;padding-left:14px;}
  .g4,.g3{grid-template-columns:1fr;}
  .screen-head h1{font-size:20px;}
  .kpi .val{font-size:27px;}
  .alert{align-items:flex-start;}
  .alert .act{align-self:flex-start;}
  .alert{flex-wrap:wrap;}
  .alert .bd{flex-basis:calc(100% - 48px);}
  .alert .act{margin-left:46px;}
  .step{min-width:100%;}
  th,td{padding-right:11px;padding-left:11px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
  #view{animation:none;}
  .deal:hover{transform:none;}
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div>
        <b>業務儀表板 Sales Dashboard/BI</b>
        <span>單一可操作 · 可追蹤 · 可稽核的業績分析平台</span>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <main><div id="view"></div>
    <div class="foot">Jvision 系統 Demo · 純前端展示 · 資料為模擬示意</div>
  </main>

  <script>
  var charts=[];
  function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
  function mk(id,opt){var el=document.getElementById(id);if(!el)return;var base={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Fira Sans,sans-serif'},foreColor:'#475569'};for(var k in opt.chart){base.chart[k]=opt.chart[k];}opt.chart=base.chart;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
  var GRN='#2563eb',GRN2='#059669',AMB='#b45309',RED='#dc2626',BLU='#3b82f6',SLT='#64748b';

  var NAV=[
    {i:0,ic:'dashboard',t:'業績總覽'},
    {i:1,ic:'account_tree',t:'銷售管線'},
    {i:2,ic:'monitoring',t:'客戶/產品分析'},
    {i:3,ic:'groups',t:'團隊績效'},
    {i:4,ic:'trending_up',t:'銷售預測'},
    {i:5,ic:'warning',t:'異常追蹤'}
  ];

  function head(ic,t,s){return '<div class="screen-head"><h1><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h1><p>'+s+'</p></div>';}

  /* ============ SCREEN 0 : 業績總覽儀表板 ============ */
  function s0(){
    var kpis=[
      {ic:'payments',lab:'本季營收',val:'8,420',u:'萬',dt:'+12.4% vs 上季',up:1},
      {ic:'target',lab:'目標達成率',val:'84',u:'%',dt:'距目標 1,580 萬',up:1},
      {ic:'shopping_cart',lab:'成交案件',val:'146',u:'件',dt:'+18 件',up:1},
      {ic:'schedule',lab:'平均回應時間',val:'6.2',u:'小時',dt:'-21.8 小時',up:1}
    ];
    var h=head('dashboard','業績總覽儀表板','即時彙總營收、達成率與關鍵指標 · 資料每 15 分鐘自 CRM／ERP／Pipeline 同步');
    h+='<div class="grid g4" style="margin-bottom:14px">';
    for(var i=0;i<kpis.length;i++){var k=kpis[i];
      h+='<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div>'+
         '<div class="val">'+k.val+'<small>'+k.u+'</small></div>'+
         '<div class="dt '+(k.up?'up':'dn')+'"><span class="material-symbols-outlined">'+(k.up?'trending_up':'trending_down')+'</span>'+k.dt+'</div></div>';
    }

    h+='<div class="flt"><span class="chip on">全部 (5)</span><span class="chip">緊急 (2)</span><span class="chip">警示 (2)</span><span class="chip">資訊 (1)</span><span class="chip" style="margin-left:auto">依規則優先排序</span></div>';
    h+='<div class="card"><div class="card-t"><span class="material-symbols-outlined">notification_important</span>異常清單（依決策規則自動排序）</div><div class="card-s">RULE-01 期限 · RULE-02 金額 · RULE-03 進度</div>';
    for(var i=0;i<alerts.length;i++){var a=alerts[i];
      h+='<div class="alert '+a.lv+'"><div class="ic"><span class="material-symbols-outlined">'+a.ic+'</span></div>'+
         '<div class="bd"><div class="at">'+a.t+'</div><div class="ad">'+a.d+'</div>'+
         '<div class="meta"><span><b>負責人</b> '+a.own+'</span><span><b>規則</b> '+a.rule+'</span><span><b>到期</b> '+a.due+'</span></div></div>'+
         '<div class="act"><span class="pill">'+a.act+'</span></div></div>';
    }
    h+='</div>';
    document.getElementById('view').innerHTML=h;
    void document.getElementById('view').offsetHeight;
  }

  var SCREENS=[s0,s1,s2,s3,s4,s5];
  function show(i){
    destroyCharts();
    var btns=document.querySelectorAll('[data-i]');
    for(var b=0;b<btns.length;b++){btns[b].classList.toggle('on',+btns[b].getAttribute('data-i')===i);}
    SCREENS[i]();
    try{window.scrollTo(0,0);}catch(e){}
  }
  (function(){
    var nv=document.getElementById('nav');var s='';
    for(var i=0;i<NAV.length;i++){s+='<button data-i="'+NAV[i].i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>';}
    nv.innerHTML=s;
    var bs=nv.querySelectorAll('[data-i]');
    for(var j=0;j<bs.length;j++){bs[j].addEventListener('click',function(){show(+this.getAttribute('data-i'));});}
  })();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
