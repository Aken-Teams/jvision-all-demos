<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCAR 供應商矯正措施報告平台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#ea580c;--accent2:#fb923c;--ink:#1f2937;--muted:#6b7280;
  --bg:#f4f5f7;--card:#ffffff;--line:#e5e7eb;--side:#1c1917;--side2:#292524;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:250px;flex:none;background:var(--side);color:#e7e5e4;display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid #44403c;margin-bottom:10px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-size:15px;font-weight:800;color:#fff;line-height:1.2}
.brand span{font-size:11px;color:#a8a29e}
.navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;border:none;background:transparent;color:#d6d3d1;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;min-width:0}
.navbtn .material-symbols-outlined{font-size:20px;flex:none}
.navbtn small{display:block;font-size:10.5px;color:#a8a29e;font-weight:500;margin-top:1px}
.navbtn:hover{background:var(--side2);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.navbtn.on small{color:#ffe6d5}
.navtx{min-width:0}
.side .foot{margin-top:auto;font-size:10.5px;color:#78716c;padding:10px 8px 2px;border-top:1px solid #44403c}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:20px;margin:0 0 4px;font-weight:800}
.top p{margin:0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff7ed;color:var(--accent);border:1px solid #fed7aa;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:27px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .sub{font-size:11.5px;font-weight:600}
.kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .ic .material-symbols-outlined{font-size:20px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#fafaf9;color:var(--muted);font-weight:700;font-size:11.5px}
tbody tr:hover{background:#fff7ed}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.t-open{background:#fef3c7;color:#92400e}
.t-rep{background:#dbeafe;color:#1e40af}
.t-rev{background:#ede9fe;color:#5b21b6}
.t-done{background:#dcfce7;color:#166534}
.t-over{background:#fee2e2;color:#991b1b}
.t-crit{background:#7f1d1d;color:#fff}
.t-maj{background:#fee2e2;color:#991b1b}
.t-min{background:#fef9c3;color:#854d0e}
.bar{height:8px;border-radius:5px;background:#f1f5f9;overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart-wrap{position:relative;height:260px}
.chart-sm{position:relative;height:210px}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#fafaf9;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col>.hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:9px;padding:2px 4px}
.col .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;min-width:0}
.tk .id{font-size:10.5px;color:var(--accent);font-weight:800;letter-spacing:.3px}
.tk .tt{font-size:12.5px;font-weight:600;margin:3px 0 6px;line-height:1.35}
.tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--muted);gap:6px}
/* 8D steps */
.d8{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.dstep{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fafaf9;min-width:0}
.dstep .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-bottom:7px}
.dstep.done .n{background:var(--ok)}
.dstep.now .n{background:var(--info)}
.dstep .dt{font-size:12px;font-weight:700;margin-bottom:3px}
.dstep .dd{font-size:11px;color:var(--muted);line-height:1.4}
.dstep .st{font-size:10.5px;font-weight:700;margin-top:6px}
/* fishbone */
.fish{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fbone{border:1px dashed #fdba74;border-radius:11px;padding:11px;background:#fff7ed;min-width:0}
.fbone .fh{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.fbone .fh .material-symbols-outlined{font-size:16px}
.fbone ul{margin:0;padding-left:16px}
.fbone li{font-size:11.5px;color:#57534e;margin-bottom:4px;line-height:1.35}
/* gantt */
.gantt{min-width:640px}
.grow{display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.gname{font-size:12px;font-weight:600;min-width:0}
.gname small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
.gtrack{position:relative;height:24px;background:#f8fafc;border-radius:7px;border:1px solid var(--line)}
.gbar{position:absolute;top:3px;height:18px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 7px;color:#fff;font-size:10.5px;font-weight:700;overflow:hidden;white-space:nowrap}
.gbar.g-done{background:linear-gradient(90deg,#16a34a,#4ade80)}
.gbar.g-late{background:linear-gradient(90deg,#dc2626,#f87171)}
.gaxis{display:grid;grid-template-columns:180px 1fr;gap:8px;margin-bottom:6px}
.gaxis .lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.cc-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.cc-leg span b{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* scorecard */
.sc-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.sc-av{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.sc-nm{flex:1;min-width:0}
.sc-nm b{font-size:13px;display:block}
.sc-nm small{font-size:11px;color:var(--muted)}
.grade{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.gA{background:#16a34a}.gB{background:#65a30d}.gC{background:#d97706}.gD{background:#dc2626}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px}
.hint .material-symbols-outlined{font-size:15px;color:var(--accent)}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}.d8{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{display:block}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:6px;padding:12px}
  .brand{border-bottom:none;margin:0;padding:0 10px 0 0;width:auto}
  .navbtn{width:auto;flex:none;white-space:nowrap}
  .side .foot{display:none}
  .main{padding:18px 16px 50px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32,.board,.d8,.fish{grid-template-columns:1fr}
}
@media(max-width:560px){
  .navtx{display:none}
  .navbtn{padding:10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">rule</span></div>
      <div class="navtx"><b>SCAR 平台</b><span>供應商矯正措施報告</span></div>
    </div>
    <button class="navbtn on" data-i="0"><span class="material-symbols-outlined">report</span><span class="navtx">異常受理台<small>缺陷登錄與開單</small></span></button>
    <button class="navbtn" data-i="1"><span class="material-symbols-outlined">assignment_late</span><span class="navtx">SCAR 派工看板<small>狀態與逾期追蹤</small></span></button>
    <button class="navbtn" data-i="2"><span class="material-symbols-outlined">account_tree</span><span class="navtx">8D 根因分析<small>D1–D8 與魚骨圖</small></span></button>
    <button class="navbtn" data-i="3"><span class="material-symbols-outlined">task_alt</span><span class="navtx">對策執行追蹤<small>矯正措施甘特</small></span></button>
    <button class="navbtn" data-i="4"><span class="material-symbols-outlined">fact_check</span><span class="navtx">效果驗證<small>管制圖與結案</small></span></button>
    <button class="navbtn" data-i="5"><span class="material-symbols-outlined">leaderboard</span><span class="navtx">供應商績效<small>評分與雷達</small></span></button>
    <div class="foot">JVISION · Smart MFG 075<br/>Demo 展示用假資料</div>
  </aside>
  <main class="main">
    <div class="top" id="top"></div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(id,cfg){var c=el(id);if(!c)return;var ch=new Chart(c.getContext("2d"),cfg);charts.push(ch);return ch;}
var ACC="#ea580c",ACC2="#fb923c";

var META=[
 {t:"異常受理台",d:"彙整 IQC 與產線異常，判定嚴重度並開立 SCAR 單",p:"本月受理 42 件"},
 {t:"SCAR 派工看板",d:"依處理狀態追蹤供應商回覆與逾期案件",p:"進行中 18 件"},
 {t:"8D 根因分析",d:"D1–D8 步驟推進與魚骨圖真因追查",p:"SCAR-2408-013"},
 {t:"對策執行追蹤",d:"矯正與預防措施甘特進度控管",p:"9 項對策執行中"},
 {t:"效果驗證",d:"改善前後管制圖驗證與結案審核",p:"待驗證 5 件"},
 {t:"供應商績效",d:"SCAR 結案天數與品質評分雷達分析",p:"評鑑 12 家"}
];

function kpi(lab,val,sub,cls,ic,icbg,iccol){
 return '<div class="card kpi"><div class="ic" style="background:'+icbg+'"><span class="material-symbols-outlined" style="color:'+iccol+'">'+ic+'</span></div>'
 +'<div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub '+cls+'">'+sub+'</div></div>';
}

/* ============ SCREEN 0 : 異常受理台 ============ */
function s0(){
 var rows=[
  ["IR-4471","滾珠軸承 BR-06","O工五金","尺寸超差 0.04mm","major","IQC 進料","QE-陳彥廷"],
  ["IR-4470","注塑外殼 CS-12","O達塑膠","縮水痕/外觀","minor","產線 A2","QE-林佳蓉"],
  ["IR-4469","電源模組 PM-33","O力電子","冷焊虛焊","critical","SMT 段","QE-陳彥廷"],
  ["IR-4468","鋁擠型 AL-08","O合金屬","陽極色差","minor","IQC 進料","QE-王孟樺"],
  ["IR-4467","感測線束 WH-21","O通線材","絕緣不良","critical","組裝段","QE-林佳蓉"],
  ["IR-4466","螺絲 M3 不鏽鋼","O佳精密","扭力不足","major","IQC 進料","QE-王孟樺"]
 ];
 var sev={critical:["t-crit","嚴重"],major:["t-maj","主要"],minor:["t-min","次要"]};
 var tr="";
 for(var i=0;i<rows.length;i++){var r=rows[i];var s=sev[r[4]];
  tr+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td>'
   +'<td><span class="tag '+s[0]+'">'+s[1]+'</span></td><td>'+r[5]+'</td><td>'+r[6]+'</td>'
   +'<td><span class="tag t-open">待開單</span></td></tr>';
 }
 var h='<div class="grid g4">'
  +kpi("本月異常受理","42","較上月 +6","up","report","#fff7ed",ACC)
  +kpi("嚴重(Critical)","5","需即刻圍堵","down","gpp_bad","#fef2f2","#dc2626")
  +kpi("待開立 SCAR","11","超過 24h 未開 3","flat","pending_actions","#eff6ff","#2563eb")
  +kpi("進料退貨批","8","佔受理 19%","flat","move_to_inbox","#f5f3ff","#7c3aed")
  +'</div>';
 h+='<div class="grid g23" style="margin-top:14px">'
  +'<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>待開單異常清單</h3>'
  +'<div style="overflow-x:auto"><table><thead><tr><th>異常編號</th><th>品項</th><th>供應商</th><th>缺陷描述</th><th>嚴重度</th><th>來源</th><th>負責 QE</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div>'
  +'<div class="hint"><span class="material-symbols-outlined">bolt</span>系統依嚴重度自動建議是否開立 SCAR 並通知供應商窗口。</div></div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>缺陷類別分布</h3><div class="chart-sm"><canvas id="c0a"></canvas></div>'
  +'<div class="legend"><span><i style="background:'+ACC+'"></i>尺寸/機構</span><span><i style="background:'+ACC2+'"></i>外觀</span><span><i style="background:#2563eb"></i>電性</span><span><i style="background:#16a34a"></i>組裝</span><span><i style="background:#a8a29e"></i>其他</span></div></div>'
  +'</div>';
 h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>近六週各嚴重度受理趨勢</h3><div class="chart-sm"><canvas id="c0b"></canvas></div></div>';
 return h;
}
function s0init(){
 mk("c0a",{type:"doughnut",data:{labels:["尺寸/機構","外觀","電性","組裝","其他"],
  datasets:[{data:[14,9,8,7,4],backgroundColor:[ACC,ACC2,"#2563eb","#16a34a","#a8a29e"],borderWidth:0}]},
  options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{display:false}}}});
 var wk=["W28","W29","W30","W31","W32","W33"];
 mk("c0b",{type:"bar",data:{labels:wk,datasets:[
   {label:"嚴重",data:[2,3,1,2,4,5],backgroundColor:"#7f1d1d",stack:"s"},
   {label:"主要",data:[6,5,7,6,8,7],backgroundColor:ACC,stack:"s"},
   {label:"次要",data:[9,8,10,7,9,11],backgroundColor:ACC2,stack:"s"}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},
   scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true}}}});
}

/* ============ SCREEN 1 : SCAR 派工看板 ============ */
function s1(){
 var cols=[
  {h:"待供應商回覆",cls:"t-open",items:[
    {id:"SCAR-2408-021",tt:"電源模組冷焊，要求 8D 回覆",who:"O力電子",due:"逾期 2 天",over:true},
    {id:"SCAR-2408-019",tt:"感測線束絕緣不良圍堵",who:"O通線材",due:"剩 1 天",over:false},
    {id:"SCAR-2408-017",tt:"軸承尺寸超差批次隔離",who:"O工五金",due:"剩 3 天",over:false}]},
  {h:"回覆審核中",cls:"t-rep",items:[
    {id:"SCAR-2408-014",tt:"注塑縮水痕 D4 真因待確認",who:"O達塑膠",due:"審核中",over:false},
    {id:"SCAR-2408-013",tt:"螺絲扭力不足 8D 進行",who:"O佳精密",due:"審核中",over:false}]},
  {h:"對策執行中",cls:"t-rev",items:[
    {id:"SCAR-2408-009",tt:"陽極色差製程參數調整",who:"O合金屬",due:"執行 60%",over:false},
    {id:"SCAR-2408-006",tt:"鍍層厚度製程管制導入",who:"新鎧表面",due:"執行 85%",over:false}]},
  {h:"效果驗證/結案",cls:"t-done",items:[
    {id:"SCAR-2408-004",tt:"焊點強度改善驗證通過",who:"O力電子",due:"已結案",over:false},
    {id:"SCAR-2408-002",tt:"外觀刮傷包材改善",who:"O達塑膠",due:"已結案",over:false},
    {id:"SCAR-2408-001",tt:"料號混料防呆導入",who:"O通線材",due:"已結案",over:false}]}
 ];
 var board="";
 for(var c=0;c<cols.length;c++){var col=cols[c];var tk="";
  for(var i=0;i<col.items.length;i++){var it=col.items[i];
   tk+='<div class="tk"'+(it.over?' style="border-left-color:#dc2626"':'')+'><div class="id">'+it.id+'</div><div class="tt">'+it.tt+'</div>'
    +'<div class="mt"><span>'+it.who+'</span><span class="tag '+(it.over?"t-over":col.cls)+'">'+it.due+'</span></div></div>';
  }
  board+='<div class="col"><div class="hd"><span>'+col.h+'</span><span class="cnt">'+col.items.length+'</span></div>'+tk+'</div>';
 }
