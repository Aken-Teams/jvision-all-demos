<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>供應商品質改善管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --success:#15803d;
  --warning:#a16207;
  --violet:#6d28d9;
  --radius:10px;
  --shadow:0 8px 24px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}
.side{
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
  display:flex;
  flex-direction:column;
  padding:22px 14px 16px;
  background:#fff;
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  margin:0 5px 28px;
  min-width:0;
}
.logo{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
}
.logo .material-symbols-outlined{font-size:22px}
.brand-copy{display:grid;min-width:0}
.brand b{font-size:14px;letter-spacing:.02em}
.brand small{margin-top:2px;color:var(--muted);font-size:10.5px}
.nav-label{
  margin:0 10px 8px;
  color:#64748b;
  font:600 10px/1 "Fira Code",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.navbtn{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:11px;
  margin:2px 0;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:8px;
  color:#475569;
  background:transparent;
  text-align:left;
  transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.navbtn:hover{color:#1e40af;background:#eff6ff;border-color:#dbeafe}
.navbtn.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 5px 14px rgba(37,99,235,.18);
}
.navbtn .material-symbols-outlined{flex:none;font-size:20px}
.navtx{min-width:0;font-size:13px;font-weight:600}
.navtx small{
  display:block;
  margin-top:2px;
  color:#64748b;
  font-size:10.5px;
  font-weight:400;
}
.navbtn.on .navtx small{color:#dbeafe}
.foot{
  margin-top:auto;
  padding:14px 9px 0;
  border-top:1px solid var(--line);
  color:#64748b;
  font:400 10px/1.7 "Fira Code",monospace;
}
.main{min-width:0;padding:28px clamp(18px,3vw,42px) 72px}
.top{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  min-height:82px;
  margin:-28px calc(clamp(18px,3vw,42px)*-1) 24px;
  padding:15px clamp(18px,3vw,42px);
  border-bottom:1px solid rgba(226,232,240,.92);
  background:rgba(248,250,252,.94);
  backdrop-filter:blur(12px);
}
.eyebrow{
  display:block;
  margin-bottom:5px;
  color:var(--blue);
  font:600 10px/1 "Fira Code",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.top h1{margin:0;font-size:clamp(20px,2vw,25px);line-height:1.15;letter-spacing:-.025em}
.top p{margin:5px 0 0;color:var(--muted);font-size:12.5px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 12px;
  color:#9a3412;
  border:1px solid #fdba74;
  border-radius:8px;
  background:#fff7ed;
  font:600 11px/1.2 "Fira Code",monospace;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr)}
.card{
  min-width:0;
  padding:17px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--color-card);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#bfdbfe;box-shadow:0 12px 28px rgba(15,23,42,.075)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 15px;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi{position:relative;overflow:hidden;padding:18px}
.kpi:after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:54px;
  height:3px;
  background:var(--blue);
}
.kpi .lab{padding-right:48px;color:var(--muted);font-size:11.5px;font-weight:500}
.kpi .val{
  margin:9px 0 4px;
  font:600 27px/1.05 "Fira Code",monospace;
  letter-spacing:-.04em;
}
.kpi .sub{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.kpi .ic{
  position:absolute;
  top:14px;
  right:14px;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:8px;
}
.kpi .ic .material-symbols-outlined{font-size:19px}
.up{color:var(--success)}.down{color:#b91c1c}.flat{color:var(--muted)}
.scroll{overflow-x:auto;overscroll-behavior-inline:contain}
table{width:100%;min-width:590px;border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  color:#475569;
  background:#f1f5f9;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.035em;
  text-align:left;
}
th:first-child{border-radius:7px 0 0 7px}
th:last-child{border-radius:0 7px 7px 0}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#f8fbff}
td:first-child,td:nth-child(4),td:nth-child(5),.id,.mono{font-family:"Fira Code",monospace}
td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:600;
  white-space:nowrap;
}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-open{color:#92400e;background:#fffbeb}
.t-rep{color:#1e40af;background:#eff6ff}
.t-rev{color:#5b21b6;background:#f5f3ff}
.t-done{color:#166534;background:#f0fdf4}
.t-over{color:#991b1b;background:#fef2f2}
.t-crit{color:#fff;background:#991b1b;border-color:#991b1b}
.t-crit:before{background:#fff}
.t-maj{color:#991b1b;background:#fef2f2}
.t-min{color:#854d0e;background:#fefce8}
.chart-wrap{position:relative;height:280px}
.chart-sm{position:relative;height:220px}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:11px}
.col{min-width:0;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:9px}
.col>.hd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:34px;
  padding:2px 4px 9px;
  color:#334155;
  font-size:11.5px;
  font-weight:600;
}
.cnt{
  display:grid;
  place-items:center;
  min-width:23px;
  height:23px;
  padding:0 6px;
  color:#475569;
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px;
  font:600 10px/1 "Fira Code",monospace;
}
.tk{
  min-width:0;
  margin-bottom:8px;
  padding:11px;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:7px;
  background:#fff;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.tk:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 7px 18px rgba(15,23,42,.07)}
.tk .id{color:#1d4ed8;font-size:9.5px;font-weight:600}
.tk .tt{margin:5px 0 9px;font-size:11.5px;font-weight:500;line-height:1.45}
.tk .mt{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--muted);font-size:10px}
.d8{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:9px}
.dstep{position:relative;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}
.dstep .n{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  margin-bottom:8px;
  color:#64748b;
  background:#e2e8f0;
  border-radius:6px;
  font:600 11px/1 "Fira Code",monospace;
}
.dstep.done .n{color:#fff;background:var(--success)}
.dstep.now{border-color:#93c5fd;background:#eff6ff}
.dstep.now .n{color:#fff;background:var(--blue)}
.dstep .dt{margin-bottom:4px;font-size:11.5px;font-weight:600}
.dstep .dd{color:var(--muted);font-size:10.5px;line-height:1.45}
.dstep .st{margin-top:8px;font-size:10px;font-weight:600}
.fish{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:9px}
.fbone{min-width:0;padding:12px;border:1px solid #fed7aa;border-radius:8px;background:#fffaf5}
.fbone .fh{display:flex;align-items:center;gap:5px;margin-bottom:7px;color:#9a3412;font-size:11.5px;font-weight:600}
.fbone .fh .material-symbols-outlined{font-size:15px}
.fbone ul{margin:0;padding-left:17px}
.fbone li{margin-bottom:4px;color:#475569;font-size:10.5px;line-height:1.45}
.hint{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:12px;
  padding:10px 11px;
  color:#334155;
  background:#eff6ff;
  border-left:3px solid var(--blue);
  border-radius:0 6px 6px 0;
  font-size:10.5px;
  line-height:1.5;
}
.hint .material-symbols-outlined{flex:none;color:var(--blue);font-size:16px}
.gantt{min-width:660px}
.grow,.gaxis{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center}
.grow{margin-bottom:8px}
.gname{min-width:0;font-size:11px;font-weight:600}
.gname small{display:block;margin-top:2px;color:var(--muted);font-size:9.5px;font-weight:400}
.gtrack{position:relative;height:25px;border:1px solid var(--line);border-radius:6px;background:repeating-linear-gradient(90deg,#f8fafc 0,#f8fafc calc(20% - 1px),#e2e8f0 20%)}
.gbar{
  position:absolute;
  top:3px;
  height:17px;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding:0 6px;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  font:500 9px/1 "Fira Code",monospace;
  white-space:nowrap;
}
.gbar.g-done{background:var(--success)}
.gbar.g-late{background:var(--color-destructive)}
.gaxis{margin-bottom:7px}
.gaxis .lbls{display:flex;justify-content:space-between;color:var(--muted);font:400 9px/1 "Fira Code",monospace}
.cc-leg,.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;color:var(--muted);font-size:10.5px}
.cc-leg span,.legend span{display:inline-flex;align-items:center;gap:6px}
.cc-leg b{display:inline-block;width:20px;height:3px;border-radius:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px}
.sc-row{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 0;border-bottom:1px solid var(--line)}
.sc-row:last-child{border-bottom:0}
.sc-av{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:7px;
  font-weight:600;
}
.sc-nm{flex:1;min-width:0}
.sc-nm b{display:block;font-size:12px}
.sc-nm small{color:var(--muted);font-size:10px}
.bar{height:6px;margin-top:6px;overflow:hidden;border-radius:3px;background:#e2e8f0}
.bar>span{display:block;height:100%;background:var(--blue)}
.grade{
  width:33px;
  height:33px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  border-radius:6px;
  font:600 12px/1 "Fira Code",monospace;
}
.gA{background:#15803d}.gB{background:#4d7c0f}.gC{background:#a16207}.gD{background:#b91c1c}
.mt14{margin-top:14px}
.grid-item{animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:.05s}
.grid-item:nth-child(3){animation-delay:.1s}
.grid-item:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(4,minmax(225px,1fr))}
}
@media(max-width:900px){
  .app{display:block}
  .side{
    position:sticky;
    width:100%;
    height:auto;
    padding:10px 14px;
    flex-direction:row;
    align-items:center;
    overflow-x:auto;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand{margin:0 8px 0 0}
  .brand-copy,.nav-label,.foot{display:none}
  .navbtn{width:auto;min-width:max-content;min-height:44px;margin:0;padding:9px 11px}
  .navtx small{display:none}
  .main{padding:24px 16px 60px}
  .top{position:static;margin:-24px -16px 20px;padding:16px}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:700px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .fish{grid-template-columns:repeat(3,minmax(160px,1fr))}
  .top{align-items:flex-start;flex-direction:column;gap:12px}
  .pill{white-space:normal}
}
@media(max-width:480px){
  .side{padding:8px 10px}
  .brand{display:none}
  .navbtn{min-height:44px}
  .navbtn .navtx{display:none}
  .navbtn .material-symbols-outlined{font-size:21px}
  .main{padding-inline:12px}
  .top{margin-inline:-12px;padding-inline:14px}
  .card{padding:14px}
  .kpi .val{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
  .grid-item,.tk{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="主要功能">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">verified_user</span></div>
      <div class="brand-copy"><b>供應商品質改善管理</b><small>Supplier Quality Control</small></div>
    </div>
    <div class="nav-label">Workspace</div>
    <button class="navbtn on" data-i="0"><span class="material-symbols-outlined" aria-hidden="true">report</span><span class="navtx">異常受理台<small>缺陷登錄與開單</small></span></button>
    <button class="navbtn" data-i="1"><span class="material-symbols-outlined" aria-hidden="true">assignment_late</span><span class="navtx">SCAR 派工看板<small>狀態與逾期追蹤</small></span></button>
    <button class="navbtn" data-i="2"><span class="material-symbols-outlined" aria-hidden="true">account_tree</span><span class="navtx">8D 根因分析<small>D1–D8 與魚骨圖</small></span></button>
    <button class="navbtn" data-i="3"><span class="material-symbols-outlined" aria-hidden="true">task_alt</span><span class="navtx">對策執行追蹤<small>矯正措施甘特</small></span></button>
    <button class="navbtn" data-i="4"><span class="material-symbols-outlined" aria-hidden="true">fact_check</span><span class="navtx">效果驗證<small>管制圖與結案</small></span></button>
    <button class="navbtn" data-i="5"><span class="material-symbols-outlined" aria-hidden="true">leaderboard</span><span class="navtx">供應商績效<small>評分與雷達</small></span></button>
    <div class="foot">JVISION · SMART MFG 075<br>DEMO DATASET</div>
  </aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
var BLUE="#2563eb",BLUE2="#3b82f6",ORANGE="#ea580c",GREEN="#15803d",RED="#dc2626";
var META=[
 ["異常受理台","彙整 IQC 與產線異常，判定嚴重度並開立 SCAR 單","本月受理 42 件"],
 ["SCAR 派工看板","依處理狀態追蹤供應商回覆與逾期案件","進行中 18 件"],
 ["8D 根因分析","D1–D8 步驟推進與魚骨圖真因追查","SCAR-2408-013"],
 ["對策執行追蹤","矯正與預防措施甘特進度控管","9 項對策執行中"],
 ["效果驗證","改善前後管制圖驗證與結案審核","待驗證 5 件"],
 ["供應商績效","SCAR 結案天數與品質評分雷達分析","評鑑 12 家"]
];
function el(id){return document.getElementById(id)}
function kill(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,cfg){
 var canvas=el(id);
 if(!canvas)return;
 cfg.options=cfg.options||{};
 cfg.options.animation=window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:cfg.options.animation;
 charts.push(new Chart(canvas.getContext("2d"),cfg));
}
function icon(name){return '<span class="material-symbols-outlined" aria-hidden="true">'+name+"</span>"}
function kpi(label,value,sub,cls,ic,bg,color){
 return '<article class="card kpi grid-item"><div class="ic" style="background:'+bg+";color:"+color+'">'+icon(ic)+'</div><div class="lab">'+label+'</div><div class="val">'+value+'</div><div class="sub '+cls+'">'+sub+"</div></article>";
}
function card(title,ic,body,extra){
 return '<section class="card grid-item '+(extra||"")+'"><h3>'+icon(ic)+title+"</h3>"+body+"</section>";
}
function tag(cls,text){return '<span class="tag '+cls+'">'+text+"</span>"}
function chartDefaults(){
 Chart.defaults.font.family='"Fira Sans",sans-serif';
 Chart.defaults.color="#475569";
 Chart.defaults.borderColor="#e2e8f0";
 Chart.defaults.plugins.tooltip.backgroundColor="#0f172a";
 Chart.defaults.plugins.tooltip.padding=10;
 Chart.defaults.plugins.tooltip.cornerRadius=6;
}
chartDefaults();

function s0(){
