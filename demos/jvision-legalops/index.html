<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>法務案件管理｜Jvision 系統 Demo</title>
<meta name="description" content="案件、庭期、合約審閱、工時計費到請款稽核的法務控制台（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#334155;
  --color-on-secondary:#FFFFFF;
  --color-accent:#0369A1;
  --color-on-accent:#FFFFFF;
  --color-background:#F8FAFC;
  --color-foreground:#020617;
  --color-card:#FFFFFF;
  --color-card-foreground:#020617;
  --color-muted:#E8ECF1;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0F172A;
  --blue:#0369A1;
  --ink:#020617;
  --muted:#475569;
  --line:#E2E8F0;
  --green:#047857;
  --amber:#A16207;
  --red:#B91C1C;
  --cyan:#0369A1;
  --panel:#FFFFFF;
  --panel2:#F1F5F9;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:Lato,"Microsoft JhengHei",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.skip-link{
  position:fixed;
  left:16px;
  top:-80px;
  z-index:100;
  padding:12px 18px;
  border-radius:8px;
  background:var(--color-primary);
  color:#fff;
  font-weight:700;
  text-decoration:none;
}
.skip-link:focus{top:12px}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.top{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 8px rgba(15,23,42,.05);
  backdrop-filter:blur(12px);
}
.bar{
  display:flex;
  align-items:center;
  gap:20px;
  min-height:72px;
  max-width:1440px;
  margin:auto;
  padding:10px 28px;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.lg{
  width:46px;
  height:46px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);
}
.lg .material-symbols-outlined{font-size:27px}
.brand b{
  display:block;
  color:var(--ink);
  font-family:"EB Garamond","Microsoft JhengHei",serif;
  font-size:20px;
  line-height:1.05;
}
.brand small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.15em;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:32px;
  padding:5px 12px;
  border:1px solid #BAE6FD;
  border-radius:999px;
  background:#F0F9FF;
  color:#075985;
  font-size:12px;
  font-weight:700;
}
.live .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
}
.r{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:14px;
  color:var(--muted);
  font-size:13px;
}
.clk,.mono,.no,.tm,.ver,.tbl td:first-child{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.ava{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid #CBD5E1;
  border-radius:50%;
  background:#F1F5F9;
  color:var(--color-primary);
  font-weight:700;
}
.nav{
  display:flex;
  gap:4px;
  max-width:1440px;
  margin:auto;
  padding:0 28px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:48px;
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 15px;
  border:0;
  border-bottom:3px solid transparent;
  background:transparent;
  color:#475569;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .2s,color .2s,border-color .2s;
}
.nav button:hover{background:#F1F5F9;color:var(--ink)}
.nav button.on{
  border-bottom-color:var(--color-accent);
  color:var(--color-accent);
}
.nav button .material-symbols-outlined{font-size:20px}
.wrap{max-width:1440px;margin:auto;padding:28px 28px 56px}
.vh{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
}
.vh h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--ink);
  font-family:"EB Garamond","Microsoft JhengHei",serif;
  font-size:32px;
  line-height:1.15;
}
.vh h2 .material-symbols-outlined{color:var(--blue);font-size:28px}
.vh p{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:0 17px;
  border:1px solid var(--color-accent);
  border-radius:8px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:0 3px 10px rgba(3,105,161,.18);
  font-weight:700;
  font-size:14px;
  transition:background-color .2s,transform .2s,box-shadow .2s;
}
.btn:hover{background:#075985;transform:translateY(-1px);box-shadow:0 6px 14px rgba(3,105,161,.22)}
.btn.ghost{background:#fff;color:var(--color-accent);box-shadow:none}
.btn.ghost:hover{background:#F0F9FF}
.btn .material-symbols-outlined{font-size:20px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:20px;
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:19px 20px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--blue);
}
.kpi .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.kpi .l .material-symbols-outlined{color:var(--blue);font-size:20px}
.kpi .v{
  margin-top:10px;
  color:var(--ink);
  font-family:"EB Garamond",serif;
  font-size:34px;
  font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{color:var(--muted);font-family:Lato,sans-serif;font-size:13px}
.kpi .d{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:9px;
  color:var(--green);
  font-size:12px;
  font-weight:700;
}
.kpi .d.dn{color:var(--red)}
.kpi .d .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g-2{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr)}
.g-2b{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-12{grid-template-columns:minmax(320px,1fr) minmax(0,1.4fr)}
.card{
  min-width:0;
  padding:20px 21px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  box-shadow:var(--shadow);
}
.card>h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 17px;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
}
.card>h3 .material-symbols-outlined{color:var(--blue);font-size:21px}
.card>h3 .grow{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.tw{overflow-x:auto}
.tbl{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.tbl th{
  padding:11px 12px;
  border-top:1px solid var(--line);
  border-bottom:1px solid #CBD5E1;
  background:#F8FAFC;
  color:#334155;
  text-align:left;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.tbl td{
  padding:13px 12px;
  border-bottom:1px solid var(--line);
  color:#334155;
  white-space:nowrap;
}
.tbl tbody tr:hover td{background:#F8FAFC}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{color:var(--ink)}
.tbl th:nth-last-child(-n+4),.tbl td:nth-last-child(-n+4){font-variant-numeric:tabular-nums}
.tbl td:nth-child(5),.tbl td:nth-child(6),.tbl td:nth-child(7){text-align:right}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-vi{background:#EFF6FF;color:#075985}
.t-ok{background:#ECFDF5;color:#047857}
.t-am{background:#FFFBEB;color:#92400E}
.t-rd{background:#FEF2F2;color:#B91C1C}
.t-cy{background:#F0F9FF;color:#0369A1}
.t-mu{background:#F1F5F9;color:#475569}
.chart{width:100%}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:13px}
.kcol{
  min-width:0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#F8FAFC;
}
.kcol h4{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  color:#334155;
  font-size:13px;
}
.kcol h4 i{width:9px;height:9px;border-radius:50%}
.kcol .cnt{
  margin-left:auto;
  padding:2px 8px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--muted);
  font-size:11px;
}
.kcard{
  margin-bottom:9px;
  padding:12px;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:8px;
  background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s,box-shadow .2s;
}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,23,42,.08)}
.kcard:last-child{margin-bottom:0}
.kcard .no{color:#075985;font-size:11px;font-weight:700}
.kcard .ti{margin:5px 0 8px;color:var(--ink);font-size:13px;font-weight:700}
.kcard .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.kcard .av{
  width:24px;
  height:24px;
  display:inline-grid;
  place-items:center;
  border:1px solid #CBD5E1;
  border-radius:50%;
  background:#F1F5F9;
  color:#334155;
  font-size:10px;
  font-weight:700;
}
.cal{display:grid;grid-template-columns:repeat(7,minmax(68px,1fr));gap:6px;min-width:560px}
.cal .dow{padding:5px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.cell{
  min-height:84px;
  padding:7px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}
.cell .dn{color:#334155;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cell.mo{background:#F8FAFC;opacity:.55}
.cell.tod{border:2px solid var(--blue);background:#F0F9FF}
.ev{
  display:block;
  overflow:hidden;
  margin-top:5px;
  padding:3px 5px;
  border-left:3px solid currentColor;
  border-radius:3px;
  font-size:10px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.ev-court{background:#EFF6FF;color:#1D4ED8}
.ev-due{background:#FEF2F2;color:#B91C1C}
.ev-mtg{background:#ECFEFF;color:#0E7490}
.dl{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.dl:last-child{border-bottom:0}
.cd{
  width:54px;
  flex:none;
  padding:7px 2px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#F8FAFC;
  text-align:center;
}
.cd b{display:block;color:var(--ink);font-family:"EB Garamond",serif;font-size:21px;line-height:1}
.cd small{color:var(--muted);font-size:10px}
.dl .info{flex:1;min-width:0}
.dl .info b{color:var(--ink);font-size:13px}
.dl .info small{display:block;color:var(--muted);font-size:12px}
.cdn{flex:none;padding:5px 9px;border:1px solid currentColor;border-radius:7px;font-size:11px;font-weight:700}
.cdn:before{content:"期限："}
.cdn.hot{background:#FEF2F2;color:#B91C1C}
.cdn.warn{background:#FFFBEB;color:#92400E}
.cdn.ok{background:#ECFDF5;color:#047857}
.clause{padding:14px 0;border-bottom:1px solid var(--line)}
.clause:last-child{border-bottom:0}
.top2{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.top2 b{color:var(--ink);font-size:14px}
.top2 .no{color:var(--muted);font-size:11px}
.clause p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.rbar{height:8px;overflow:hidden;margin-top:10px;border-radius:999px;background:#E2E8F0}
.rbar i{display:block;height:100%;border-radius:999px}
.timer{
  display:flex;
  align-items:center;
  gap:16px;
  padding:20px 22px;
  border-radius:12px;
  background:var(--color-primary);
  color:#fff;
  box-shadow:0 12px 24px rgba(15,23,42,.16);
}
.timer .clk2{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:34px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.timer .meta{flex:1;min-width:150px}
.timer .meta b{display:block;font-size:14px}
.timer .meta small{color:#CBD5E1;font-size:12px}
.rec{width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:#DC2626}
.tbtn{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border:1px solid #64748B;
  border-radius:8px;
  background:#334155;
  color:#fff;
  transition:background-color .2s;
}
.tbtn:hover{background:#475569}
.agebar{display:flex;min-width:420px;height:38px;overflow:hidden;border-radius:7px}
.agebar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.inv-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.isum{padding:14px;border:1px solid var(--line);border-radius:8px;background:#F8FAFC}
.isum small{color:var(--muted);font-size:12px;font-weight:700}
.isum b{display:block;margin-top:5px;color:var(--ink);font-family:"EB Garamond",serif;font-size:24px;font-variant-numeric:tabular-nums}
.audit{position:relative;padding-left:28px}
.audit:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:#CBD5E1}
.aitem{position:relative;padding-bottom:18px}
.aitem:last-child{padding-bottom:0}
.aitem .dot{position:absolute;left:-25px;top:4px;width:14px;height:14px;border:3px solid var(--blue);border-radius:50%;background:#fff}
.aitem .dot.v{background:var(--blue)}
.aitem .dot.g{border-color:var(--green);background:var(--green)}
.aitem .dot.r{border-color:var(--red);background:var(--red)}
.aitem .tm{color:var(--muted);font-size:11px}
.aitem .txt{margin-top:3px;color:#334155;font-size:13px}
.aitem .txt b{color:var(--ink)}
.aitem .who{color:#075985;font-weight:700}
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .fi{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid #BAE6FD;
  border-radius:8px;
  background:#F0F9FF;
  color:var(--blue);
}
.doc .info{flex:1;min-width:0}
.doc .info b{display:block;overflow:hidden;color:var(--ink);font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.doc .info small{display:block;color:var(--muted);font-size:12px}
.ver{flex:none;padding:4px 8px;border:1px solid #BAE6FD;border-radius:6px;background:#F0F9FF;color:#075985;font-size:11px;font-weight:700}
.view-enter>.vh,.view-enter>.kpis,.view-enter>.grid,.view-enter>.card,.view-enter>[style]{
  animation:reveal .42s cubic-bezier(.2,.8,.2,1) both;
}
.view-enter>.kpis{animation-delay:.04s}
.view-enter>.grid,.view-enter>.card{animation-delay:.09s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-2b,.g-12{grid-template-columns:1fr}
}
@media(max-width:760px){
  .bar{padding:9px 16px}.nav{padding:0 12px}.wrap{padding:22px 16px 42px}
  .live,.clk{display:none}.vh{align-items:stretch;flex-direction:column}.vh h2{font-size:28px}
  .vh .btn{align-self:flex-start}.card{padding:17px 15px}.timer{align-items:flex-start;flex-wrap:wrap}
  .timer .meta{order:3;flex-basis:100%}.inv-sum{grid-template-columns:1fr}
}
@media(max-width:480px){
  .brand small{display:none}.brand b{font-size:18px}.lg{width:42px;height:42px}
  .nav button{min-width:48px;justify-content:center;padding:10px 12px}.nav .lbl{display:none}
  .kpis{grid-template-columns:1fr}.kpi{padding:17px}.timer .clk2{font-size:28px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#view">跳至主要內容</a>
<header class="top">
  <div class="bar">
    <div class="brand" aria-label="LegalOps 法務控制台">
      <div class="lg" aria-hidden="true"><span class="material-symbols-outlined">balance</span></div>
      <div><b>LegalOps 法務控制台</b><small>JVISION CASE COMMAND</small></div>
    </div>
    <span class="live"><span class="dot" aria-hidden="true"></span>案件即時監控</span>
    <div class="r"><span class="clk">2026/08/13　週四</span><div class="ava" aria-label="目前使用者：陳">陳</div></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap"><div id="view" tabindex="-1"></div></main>
<script>
var NAV=[
 {ic:"folder_open",t:"案件總覽"},{ic:"gavel",t:"庭期期限"},
 {ic:"assignment",t:"合約審閱"},{ic:"timer",t:"工時計費"},
 {ic:"receipt_long",t:"請款帳單"},{ic:"manage_search",t:"文件稽核"}
];
var charts=[];
