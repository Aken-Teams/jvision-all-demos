<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>法務案件管理｜Jvision 系統 Demo</title>
<meta name="description" content="案件、庭期、合約審閱、工時計費到請款稽核的法務控制台（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --violet:#7c3aed; --violet2:#a78bfa; --violet-d:#5b21b6;
    --bg:#0b0b16; --panel:#15152a; --panel2:#1c1c38; --line:#2c2c4d;
    --ink:#f3f0ff; --body:#c9c6e6; --muted:#8c88b8;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --cyan:#38bdf8;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  /* TOP NAV */
  .top{ background:linear-gradient(90deg,#120b26,#1a0f33); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; }
  .top .bar{ display:flex; align-items:center; gap:18px; padding:0 24px; height:60px; max-width:1400px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand .lg{ width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--violet),var(--violet2)); color:#fff; display:grid; place-content:center; box-shadow:0 6px 16px rgba(124,58,237,.45); flex:none; }
  .brand b{ color:#fff; font-size:15px; display:block; letter-spacing:.02em; } .brand small{ color:var(--violet2); font-size:11px; letter-spacing:.14em; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:var(--violet2); background:rgba(124,58,237,.16); border:1px solid var(--line); border-radius:999px; padding:4px 11px; }
  .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; } @keyframes pulse{50%{opacity:.25;}}
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:14px; color:var(--body); font-size:13px; }
  .top .r .clk{ font-variant-numeric:tabular-nums; color:var(--muted); }
  .ava{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--violet2)); color:#fff; font-weight:800; display:grid; place-content:center; flex:none; }
  /* NAV TABS */
  .nav{ display:flex; flex-wrap:wrap; gap:6px; padding:0 24px 12px; max-width:1400px; margin:0 auto; }
  .nav button{ flex:none; white-space:nowrap; display:inline-flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:11px; color:var(--body); font:inherit; font-size:13px; font-weight:700; padding:9px 14px; cursor:pointer; transition:.15s; min-width:0; }
  .nav button .material-symbols-outlined{ font-size:19px; color:var(--violet2); }
  .nav button:hover{ border-color:var(--violet); color:#fff; }
  .nav button.on{ background:linear-gradient(135deg,var(--violet),var(--violet-d)); border-color:var(--violet); color:#fff; box-shadow:0 6px 16px rgba(124,58,237,.4); }
  .nav button.on .material-symbols-outlined{ color:#fff; }
  /* BODY */
  .wrap{ max-width:1400px; margin:0 auto; padding:8px 24px 48px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin:10px 0 18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:22px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:9px; } .vh h2 .material-symbols-outlined{ color:var(--violet2); font-size:24px; }
  .vh p{ margin:5px 0 0; font-size:13px; color:var(--muted); }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:1px solid var(--violet); background:linear-gradient(135deg,var(--violet),var(--violet-d)); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; } .btn.ghost{ background:var(--panel); color:var(--violet2); } .btn .material-symbols-outlined{ font-size:18px; }
  /* KPI */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi{ background:linear-gradient(150deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:15px; padding:15px 17px; position:relative; overflow:hidden; min-width:0; }
  .kpi::after{ content:""; position:absolute; right:-20px; top:-20px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle,rgba(124,58,237,.25),transparent 70%); }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; align-items:center; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--violet2); }
  .kpi .v{ font-size:28px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:7px; display:flex; align-items:center; gap:3px; } .kpi .d.up{ color:var(--green); } .kpi .d.dn{ color:var(--red); } .kpi .d .material-symbols-outlined{ font-size:15px; }
  /* GRID */
  .grid{ display:grid; gap:16px; } .grid>*{ min-width:0; }
  .g-2{ grid-template-columns:1.6fr 1fr; } .g-2b{ grid-template-columns:1fr 1fr; } .g-3{ grid-template-columns:repeat(3,1fr); } .g-12{ grid-template-columns:1fr 1.4fr; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:17px 19px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:14px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--violet2); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--violet2); }
  /* TABLE */
  .tw{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:800; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--body); } .tbl tr:last-child td{ border-bottom:0; } .tbl tbody tr:hover td{ background:var(--panel2); }
  .tbl td b{ color:var(--ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; display:inline-flex; align-items:center; gap:4px; }
  .t-vi{ background:rgba(124,58,237,.18); color:var(--violet2); } .t-ok{ background:rgba(52,211,153,.16); color:var(--green); } .t-am{ background:rgba(251,191,36,.16); color:var(--amber); } .t-rd{ background:rgba(248,113,113,.16); color:var(--red); } .t-cy{ background:rgba(56,189,248,.16); color:var(--cyan); } .t-mu{ background:rgba(140,136,184,.16); color:var(--muted); }
  .chart{ width:100%; }
  /* KANBAN */
  .kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; } .kanban>*{ min-width:0; }
  .kcol{ background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .kcol h4{ margin:0 0 11px; font-size:12px; font-weight:800; color:var(--body); display:flex; align-items:center; gap:7px; } .kcol h4 .cnt{ margin-left:auto; background:var(--panel); border:1px solid var(--line); border-radius:999px; font-size:11px; padding:1px 8px; color:var(--muted); }
  .kcol h4 i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .kcard{ background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--violet); border-radius:10px; padding:11px 12px; margin-bottom:9px; }
  .kcard:last-child{ margin-bottom:0; } .kcard .no{ font-size:11px; font-weight:800; color:var(--violet2); } .kcard .ti{ font-size:13px; font-weight:700; color:var(--ink); margin:3px 0 6px; } .kcard .mt{ font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .kcard .av{ width:22px; height:22px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); color:var(--violet2); font-size:10px; font-weight:800; display:inline-grid; place-content:center; }
  /* CALENDAR */
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; min-width:520px; } .cal>*{ min-width:0; }
  .cal .dow{ text-align:center; font-size:11px; font-weight:800; color:var(--muted); padding:4px 0; }
  .cell{ background:var(--panel2); border:1px solid var(--line); border-radius:9px; min-height:78px; padding:6px; }
  .cell .dn{ font-size:11px; font-weight:800; color:var(--body); } .cell.mo{ opacity:.4; } .cell.tod{ border-color:var(--violet); box-shadow:0 0 0 1px var(--violet) inset; }
  .ev{ font-size:10px; font-weight:700; border-radius:5px; padding:2px 5px; margin-top:4px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev-court{ background:rgba(124,58,237,.25); color:#ddd6fe; } .ev-due{ background:rgba(248,113,113,.22); color:#fecaca; } .ev-mtg{ background:rgba(56,189,248,.22); color:#bae6fd; }
  /* DEADLINE LIST */
  .dl{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); } .dl:last-child{ border-bottom:0; }
  .dl .cd{ width:52px; flex:none; text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px 0; } .dl .cd b{ display:block; font-size:19px; font-weight:900; color:var(--ink); line-height:1; } .dl .cd small{ font-size:10px; color:var(--muted); }
  .dl .info{ flex:1; min-width:0; } .dl .info b{ color:var(--ink); font-size:13px; } .dl .info small{ display:block; color:var(--muted); font-size:12px; }
  .cdn{ font-size:11px; font-weight:900; border-radius:8px; padding:4px 9px; flex:none; }
  .cdn.hot{ background:rgba(248,113,113,.16); color:var(--red); } .cdn.warn{ background:rgba(251,191,36,.16); color:var(--amber); } .cdn.ok{ background:rgba(52,211,153,.16); color:var(--green); }
  /* CONTRACT / RISK ROWS */
  .clause{ padding:12px 0; border-bottom:1px solid var(--line); } .clause:last-child{ border-bottom:0; }
  .clause .top2{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; } .clause .top2 b{ color:var(--ink); font-size:13px; } .clause .top2 .no{ font-size:11px; font-weight:800; color:var(--muted); }
  .clause p{ margin:6px 0 0; font-size:12px; color:var(--muted); line-height:1.5; }
  .rbar{ height:7px; border-radius:999px; background:var(--panel2); overflow:hidden; margin-top:8px; } .rbar i{ display:block; height:100%; border-radius:999px; }
  /* TIMER / WORKLOG */
  .timer{ display:flex; align-items:center; gap:16px; background:linear-gradient(135deg,var(--violet-d),var(--violet)); border-radius:14px; padding:18px 20px; color:#fff; flex-wrap:wrap; }
  .timer .clk2{ font-size:38px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:.02em; } .timer .meta{ flex:1; min-width:120px; } .timer .meta b{ font-size:14px; display:block; } .timer .meta small{ color:#e9d5ff; font-size:12px; }
  .tbtn{ width:44px; height:44px; border-radius:12px; border:0; background:rgba(255,255,255,.18); color:#fff; display:grid; place-content:center; cursor:pointer; } .tbtn .material-symbols-outlined{ font-size:24px; }
  .rec{ width:10px; height:10px; border-radius:50%; background:#fff; animation:pulse 1.4s infinite; display:inline-block; }
  /* INVOICE / AGING */
  .agebar{ display:flex; height:34px; border-radius:10px; overflow:hidden; border:1px solid var(--line); min-width:340px; }
  .agebar span{ display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; white-space:nowrap; }
  .inv-sum{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; } .inv-sum>*{ min-width:0; }
  .isum{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:13px; } .isum small{ font-size:11px; color:var(--muted); font-weight:700; } .isum b{ display:block; font-size:22px; font-weight:900; color:var(--ink); margin-top:5px; }
  /* AUDIT TIMELINE */
  .audit{ position:relative; padding-left:26px; } .audit::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .aitem{ position:relative; padding:0 0 16px; } .aitem:last-child{ padding-bottom:0; }
  .aitem .dot{ position:absolute; left:-22px; top:3px; width:13px; height:13px; border-radius:50%; background:var(--panel); border:2px solid var(--violet2); }
  .aitem .dot.v{ background:var(--violet2); } .aitem .dot.g{ border-color:var(--green); background:var(--green); } .aitem .dot.r{ border-color:var(--red); background:var(--red); }
  .aitem .tm{ font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; } .aitem .txt{ font-size:13px; color:var(--body); margin-top:2px; } .aitem .txt b{ color:var(--ink); }
  .aitem .who{ font-size:11px; color:var(--violet2); font-weight:700; }
  /* DOC VERSION */
  .doc{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); } .doc:last-child{ border-bottom:0; }
  .doc .fi{ width:38px; height:38px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); color:var(--violet2); display:grid; place-content:center; flex:none; }
  .doc .info{ flex:1; min-width:0; } .doc .info b{ color:var(--ink); font-size:13px; } .doc .info small{ display:block; color:var(--muted); font-size:12px; }
  .ver{ font-size:11px; font-weight:800; color:var(--violet2); background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:3px 8px; flex:none; }
  /* RWD */
  @media (max-width:1020px){ .g-2,.g-2b,.g-3,.g-12{ grid-template-columns:1fr; } .kanban{ grid-template-columns:repeat(2,1fr); min-width:520px; } }
  @media (max-width:820px){
    .wrap{ padding:8px 14px 34px; } .top .bar{ padding:0 14px; } .nav{ padding:0 14px 12px; }
    .inv-sum{ grid-template-columns:1fr; }
    .top .r .clk{ display:none; }
  }
  @media (max-width:560px){
    .nav button span.lbl{ display:none; } .nav button{ padding:9px 11px; }
    .timer .clk2{ font-size:30px; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="bar">
      <div class="brand">
        <div class="lg"><span class="material-symbols-outlined">balance</span></div>
        <div><b>LegalOps 法務控制台</b><small>JVISION CASE COMMAND</small></div>
      </div>
      <span class="live"><span class="dot"></span>案件即時監控</span>
      <div class="r">
        <span class="clk">2026/08/13　週四</span>
        <div class="ava">陳</div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="wrap"><div id="view"></div></div>

<script>
var NAV=[
  {ic:"folder_open",t:"案件總覽"},
  {ic:"gavel",t:"庭期期限"},
  {ic:"assignment",t:"合約審閱"},
  {ic:"timer",t:"工時計費"},
  {ic:"receipt_long",t:"請款帳單"},
  {ic:"manage_search",t:"文件稽核"}
];
var charts=[];
function destroyCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function kpi(l,ic,v,u,d,dir){ return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div>'+(d?'<div class="d '+(dir||'up')+'"><span class="material-symbols-outlined">'+(dir==='dn'?'trending_down':'trending_up')+'</span>'+d+'</div>':'')+'</div>'; }

/* ============ SCREEN 0: 案件總覽 (Kanban board) ============ */
function v0(){
  var kpis=kpi('進行中案件','folder_open','128','件','+6 本月')
    +kpi('本週到期期限','event_upcoming','14','項','需關注','dn')
    +kpi('待分派新案','inbox','7','件','2 逾時','dn')
    +kpi('平均結案天數','timelapse','86','天','-11 天');
  var cols=[
    {t:"待分派",c:"#8c88b8",n:7,cards:[
      {no:"113-訴-2048",ti:"甲公司違約金請求",cli:"甲工業股份",who:"待指派",tag:["t-mu","民事"]},
      {no:"113-勞-0312",ti:"資遣費爭議調解",cli:"李〇〇",who:"待指派",tag:["t-mu","勞資"]}
    ]},
    {t:"進行中",c:"#7c3aed",n:52,cards:[
      {no:"112-金-1187",ti:"聯合投資詐欺辯護",cli:"O達控股",who:"王律師",tag:["t-vi","刑事"]},
      {no:"113-智-0455",ti:"商標侵權排除",cli:"O田生技",who:"陳律師",tag:["t-vi","智財"]},
      {no:"112-家-0921",ti:"遺產分割訴訟",cli:"周氏家族",who:"林律師",tag:["t-vi","家事"]}
    ]},
    {t:"待覆核",c:"#fbbf24",n:19,cards:[
      {no:"113-建-0087",ti:"工程款結算仲裁",cli:"鼎O營造",who:"合夥人",tag:["t-am","仲裁"]},
      {no:"113-商-1520",ti:"併購盡職調查",cli:"宸O投資",who:"合夥人",tag:["t-am","併購"]}
    ]},
    {t:"已結案",c:"#34d399",n:50,cards:[
      {no:"112-訴-3391",ti:"租賃返還一審勝訴",cli:"O信地產",who:"陳律師",tag:["t-ok","勝訴"]},
      {no:"112-勞-0774",ti:"職災補償和解",cli:"O都製造",who:"林律師",tag:["t-ok","和解"]}
    ]}
  ];
  var kb='';
  for(var i=0;i<cols.length;i++){
    var c=cols[i], cc='';
    for(var j=0;j<c.cards.length;j++){ var k=c.cards[j];
      cc+='<div class="kcard" style="border-left-color:'+c.c+'"><div class="no">'+esc(k.no)+'</div><div class="ti">'+esc(k.ti)+'</div><div class="mt"><span class="tag '+k.tag[0]+'">'+k.tag[1]+'</span><span>'+esc(k.cli)+'</span><span class="av">'+esc(k.who.charAt(0))+'</span>'+esc(k.who)+'</div></div>';
    }
    kb+='<div class="kcol"><h4><i style="background:'+c.c+'"></i>'+c.t+'<span class="cnt">'+c.n+'</span></h4>'+cc+'</div>';
  }
  return '<div class="vh"><div><h2><span class="material-symbols-outlined">folder_open</span>案件總覽</h2><p>案件建檔、承辦分派與進度看板</p></div><button class="btn"><span class="material-symbols-outlined">add</span>新增案件</button></div>'
    +'<div class="kpis">'+kpis+'</div>'
    +'<div class="grid g-2"><div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>案件進度看板<span class="grow">拖曳更新狀態</span></h3><div class="tw"><div class="kanban">'+kb+'</div></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>案件類型分布</h3><div id="c0a" class="chart"></div></div></div>'
    +'<div class="grid g-2b" style="margin-top:16px"><div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各律師承辦負荷</h3><div id="c0b" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近半年新收 / 結案趨勢</h3><div id="c0c" class="chart"></div></div></div>';
}
function draw0(){
  charts.push(new ApexCharts(document.querySelector("#c0a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[38,27,22,19,12,10],labels:["民事","刑事","勞資","智財","家事","商務"],
    colors:["#7c3aed","#a78bfa","#38bdf8","#34d399","#fbbf24","#f87171"],
