<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>產品物料與成本試算平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --mut:#475569;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --mat:#2563EB;
  --lab:#0F766E;
  --ovh:#7C3AED;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-hover:0 2px 4px rgba(15,23,42,.06),0 14px 32px rgba(37,99,235,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button,.chip,.node,input[type=range]{cursor:pointer}
button:focus-visible,.chip:focus-visible,.node:focus-visible,input:focus-visible{
  outline:3px solid rgba(37,99,235,.28);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-size:20px;
  vertical-align:middle;
  line-height:1;
  font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:72px;
  padding:12px max(20px,calc((100vw - 1380px)/2));
  border-bottom:1px solid rgba(226,232,240,.92);
  background:rgba(255,255,255,.94);
  box-shadow:0 1px 12px rgba(15,23,42,.04);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:248px}
.logo{
  position:relative;
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  border-radius:8px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:5px 5px 0 #BFDBFE;
  font-family:"Fira Code",monospace;
  font-size:17px;
  font-weight:700;
}
.logo::after{
  content:"";
  position:absolute;
  right:7px;
  bottom:7px;
  width:5px;
  height:5px;
  background:#FDBA74;
}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span{
  display:block;
  margin-top:1px;
  color:var(--color-primary);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.13em;
}
.nav{
  display:flex;
  gap:4px;
  margin-left:auto;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  min-height:42px;
  padding:9px 12px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--color-muted-foreground);
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  border-color:#BFDBFE;
  background:#EFF6FF;
  color:#1D4ED8;
}
.nav button.on{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:0 4px 12px rgba(37,99,235,.20);
}
.nav button.on::after{
  content:"";
  position:absolute;
  right:10px;
  bottom:4px;
  left:10px;
  height:2px;
  background:#BFDBFE;
}
.wrap{width:min(1380px,100%);margin:0 auto;padding:28px 24px 40px}
.vh{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  min-height:102px;
  margin-bottom:22px;
  padding:23px 24px;
  overflow:hidden;
  border:1px solid #D7E3F4;
  border-radius:10px;
  background:linear-gradient(105deg,#FFF 0%,#FFF 67%,#EFF6FF 100%);
  box-shadow:var(--shadow);
}
.vh::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:5px;
  background:var(--color-primary);
}
.vh::after{
  content:"COST / MATERIAL / PRODUCTION";
  position:absolute;
  right:22px;
  bottom:10px;
  color:rgba(37,99,235,.08);
  font-family:"Fira Code",monospace;
  font-size:22px;
  font-weight:700;
  letter-spacing:.08em;
  pointer-events:none;
}
.vh h2{position:relative;z-index:1;margin:0;font-size:clamp(22px,2vw,29px);font-weight:700;letter-spacing:-.03em}
.vh p{position:relative;z-index:1;margin:4px 0 0;color:var(--color-muted-foreground);font-size:13px}
.pill{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 11px;
  border:1px solid #A7F3D0;
  border-radius:6px;
  background:#ECFDF5;
  color:#065F46;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.pill i{
  width:8px;
  height:8px;
  border:2px solid #047857;
  border-radius:50%;
  background:#D1FAE5;
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
  position:relative;
  min-width:0;
  min-height:126px;
  overflow:hidden;
  padding:18px;
  border:1px solid var(--color-border);
  border-radius:9px;
  background:var(--color-card);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.kpi::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:46px;
  height:3px;
  background:var(--color-primary);
}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:var(--shadow-hover)}
.kpi .l{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.kpi .v{
  margin-top:7px;
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .d{margin-top:4px;font-size:11px;font-weight:600}
.kpi .ic{
  position:absolute;
  top:16px;
  right:15px;
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border:1px solid #DBEAFE;
  border-radius:7px;
  background:#EFF6FF;
  color:var(--color-primary);
  opacity:1;
}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(350px,410px) minmax(0,1fr)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{
  min-width:0;
  padding:18px;
  border:1px solid var(--color-border);
  border-radius:9px;
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow-hover)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:30px;
  margin:0 0 15px;
  padding-bottom:12px;
  border-bottom:1px solid var(--color-border);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:23px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-mut{background:#F1F5F9;color:#475569}
.scroll{overflow-x:auto;scrollbar-color:#CBD5E1 transparent}
table.data{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12.5px;
}
table.data th,table.data td{
  padding:10px 11px;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  vertical-align:middle;
}
table.data th{
  position:relative;
  background:#F1F5F9;
  color:#334155;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
table.data th:first-child{border-radius:6px 0 0 0}
table.data th:last-child{border-radius:0 6px 0 0}
table.data tbody tr,table.data tr{transition:background-color .18s ease}
table.data tr:hover td{background:#F8FAFC}
table.data td.num,table.data th.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
table.data td:first-child b{font-family:"Fira Code",monospace;font-size:11.5px}
.chart{height:250px}
.tree{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.node{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:39px;
  padding:8px 9px;
  border:1px solid transparent;
  border-radius:6px;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.node:hover{background:#F8FAFC;border-color:#CBD5E1;transform:translateX(2px)}
.node.sel{border-color:#93C5FD;background:#EFF6FF;box-shadow:inset 3px 0 0 var(--color-primary)}
.node .tw{width:16px;flex:none;color:var(--color-muted-foreground);text-align:center;font-size:16px}
.node .code{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cost{flex:none;font-family:"Fira Code",monospace;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.node .lv{width:7px;height:7px;flex:none;border:1px solid rgba(15,23,42,.28);border-radius:2px}
.detail-hd{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
  padding:14px;
  border:1px solid #BFDBFE;
  border-radius:8px;
  background:linear-gradient(100deg,#EFF6FF,#F8FAFC);
}
.detail-hd .bg{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  flex:none;
  border:1px solid #BFDBFE;
  border-radius:7px;
  background:#FFF;
}
.detail-hd .bg .material-symbols-outlined{color:var(--color-primary);font-size:24px}
.detail-hd b{display:block;font-size:15px}
.detail-hd small{color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:11px}
.detail-hd .big{margin-left:auto;text-align:right}
.detail-hd .big b{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:21px}
.detail-hd .big small{color:#475569}
.cbar{display:flex;height:12px;margin:5px 0 15px;overflow:hidden;border-radius:3px;background:#E2E8F0}
.cbar i{display:block;height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:7px;color:var(--color-muted-foreground);font-size:11.5px}
.leg span{display:flex;align-items:center;gap:6px}
.leg em{display:inline-block;width:10px;height:10px;border:1px solid rgba(15,23,42,.22);border-radius:2px;font-style:normal}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qc{
  position:relative;
  min-width:0;
  padding:16px;
  border:1px solid var(--color-border);
  border-radius:8px;
  background:#FFF;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.qc:hover{transform:translateY(-2px);border-color:#93C5FD;box-shadow:var(--shadow)}
.qc.best{border:2px solid var(--color-primary);background:#F8FBFF;box-shadow:0 8px 24px rgba(37,99,235,.12)}
.qc .badge{
  position:absolute;
  top:-10px;
  right:12px;
  padding:3px 9px;
  border:1px solid #C2410C;
  border-radius:4px;
  background:var(--color-accent);
  color:#FFF;
  font-size:10px;
  font-weight:700;
}
.qc b{font-size:13.5px}
.qc .pr{margin:9px 0 4px;font-family:"Fira Code",monospace;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.qc .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--color-border);color:var(--color-muted-foreground);font-size:11.5px}
.qc .row b{color:var(--color-foreground);font-family:"Fira Code",monospace;font-size:11px;text-align:right}
.sim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.ctrl{display:flex;flex-direction:column;gap:18px}
.slb{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12.5px;font-weight:600}
.slb span{color:#1D4ED8;font-family:"Fira Code",monospace;font-weight:700}
input[type=range]{
  width:100%;
  height:6px;
  border-radius:3px;
  accent-color:var(--color-primary);
}
.simout{
  padding:20px;
  border:1px solid #BFDBFE;
  border-radius:8px;
  background:linear-gradient(145deg,#EFF6FF,#FFF);
  box-shadow:inset 4px 0 0 var(--color-primary);
}
.simout .big{font-family:"Fira Code",monospace;font-size:32px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.simrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #D7E3F4;font-size:13px}
.simrow:last-child{border:0}
.simrow b{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:6px 12px;
  border:1px solid #CBD5E1;
  border-radius:6px;
  background:#FFF;
  color:#334155;
  font-size:12px;
  font-weight:600;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.chip:hover{border-color:#93C5FD;background:#EFF6FF;transform:translateY(-1px)}
.chip.on{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
.dline{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 13px;
  border:1px solid var(--color-border);
  border-radius:7px;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.dline:hover{transform:translateX(2px);border-color:#BFDBFE;background:#F8FAFC}
.dline .dot{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:6px;color:#FFF}
.dline .m{flex:1;min-width:0}
.dline .m b{font-family:"Fira Code",monospace;font-size:12px}
.dline .m small{display:block;color:var(--color-muted-foreground);font-size:11.5px}
.dline .delta{flex:none;font-family:"Fira Code",monospace;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ver{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:6px}
.ver::before{content:"";position:absolute;top:6px;bottom:16px;left:11px;width:2px;background:#CBD5E1}
.vi{position:relative;display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;padding-left:22px}
.vi::before{
  content:"";
  position:absolute;
  top:3px;
  left:0;
  width:12px;
  height:12px;
  border:3px solid #FFF;
  border-radius:2px;
  background:var(--color-primary);
  box-shadow:0 0 0 1px #93C5FD;
}
.vi.old::before{background:#64748B;box-shadow:0 0 0 1px #CBD5E1}
.vi b{font-family:"Fira Code",monospace;font-size:13px;font-weight:700}
.vi small{display:block;color:var(--color-muted-foreground);font-size:11.5px}
.mini{margin-top:2px;color:var(--color-muted-foreground);font-size:11px}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1080px){
  .top{align-items:flex-start;gap:10px;flex-wrap:wrap;padding:10px 18px}
  .brand{min-width:220px}
  .nav{width:100%;margin-left:0}
  .wrap{padding:22px 18px 34px}
}
@media(max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g11,.split,.sim,.two,.qgrid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .top{position:sticky;padding:9px 12px}
  .brand{min-width:0}
  .logo{width:38px;height:38px}
  .brand b{font-size:14px}
  .nav button{min-height:40px;padding:8px 10px;font-size:12px}
  .nav button .material-symbols-outlined{font-size:17px}
  .wrap{padding:16px 12px 28px}
  .vh{align-items:flex-start;min-height:0;padding:18px 16px;flex-direction:column}
  .vh::after{display:none}
  .vh h2{font-size:22px}
  .pill{white-space:normal}
  .kpis{grid-template-columns:1fr;gap:10px}
  .kpi{min-height:110px}
  .card{padding:14px}
  .detail-hd{align-items:flex-start;flex-wrap:wrap}
  .detail-hd .big{width:100%;margin-left:56px;text-align:left}
  .chart{height:230px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">物</div>
    <div><b>產品物料與成本試算平台</b><span>PRODUCT COST OPERATIONS</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
  <section class="vh">
    <div><h2 id="vt"></h2><p id="vd"></p></div>
    <div class="pill" role="status"><i aria-hidden="true"></i><span>已鎖定：標準成本 v3.2</span></div>
  </section>
  <div id="view" aria-live="polite"></div>
</main>
<script>
const MOD=[
["成本總覽","insights","成本總覽","單位成本、毛利與料工費占比戰情"],
["BOM 結構","account_tree","BOM 結構","多階 BOM 展開、用量與階層單位成本"],
["成本結構分析","donut_large","成本結構分析","料/工/費占比拆解與異常項目定位"],
["供應報價","request_quote","供應報價","多供應商比價、替代料與匯率試算"],
["情境試算","tune","情境試算","用量、匯率、替代料的 What-if 模擬"],
["版本比較","difference","版本比較","核定成本版本差異與變動來源追溯"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{
 const b=document.createElement('button');

function fromHash(){
 const m=(location.hash||'').match(/(?:go=|v)([0-9]+)/);

 try{window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}catch(e){window.scrollTo(0,0)}
}
