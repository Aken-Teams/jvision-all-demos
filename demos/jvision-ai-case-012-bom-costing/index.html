<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BOM 成本試算室 · BOM Costing Studio</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#d97706;--accent2:#f59e0b;--ink:#1c1608;--bg:#faf6ef;--card:#fff;--line:#eadfcc;--mut:#8a7a5f;--ok:#059669;--warn:#e0870b;--bad:#dc2626;--mat:#d97706;--lab:#0ea5e9;--ovh:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(217,119,6,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
.nav button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#fbf1de;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(217,119,6,.3)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:#fef3c7;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.3}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.split{grid-template-columns:400px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#f1ece2;color:#8a7a5f}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fbf6ec}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.chart{height:250px}
.scroll{overflow-x:auto}
/* BOM tree */
.tree{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.node{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.node:hover{background:#fbf1de}
.node.sel{background:#fef3c7;border-color:#f4d089}
.node .tw{color:var(--mut);width:16px;text-align:center;flex:none;font-size:16px}
.node .code{font-family:Inter;font-weight:700;font-size:11.5px;color:var(--accent)}
.node .nm{font-family:"Noto Sans TC";flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .cost{font-family:Inter;font-weight:800;font-size:12px;flex:none}
.node .lv{width:6px;height:6px;border-radius:50%;flex:none}
.detail-hd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#fef3c7,#fde68a);margin-bottom:14px}
.detail-hd .bg{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(217,119,6,.2)}
.detail-hd .bg .material-symbols-outlined{color:var(--accent);font-size:24px}
.detail-hd b{font-family:"Noto Sans TC";font-size:15px;display:block}
.detail-hd small{color:#a06a12;font-size:11.5px}
.detail-hd .big{margin-left:auto;text-align:right}
.detail-hd .big b{font-family:Inter;font-size:22px;color:#92610d}
.detail-hd .big small{color:#a06a12}
.cbar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:4px 0 14px}
.cbar i{display:block;height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.leg span{display:flex;align-items:center;gap:5px}
.leg em{width:10px;height:10px;border-radius:3px;font-style:normal;display:inline-block}
/* quote compare */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qgrid>*{min-width:0}
.qc{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.qc.best{border-color:var(--accent2);box-shadow:0 8px 20px rgba(217,119,6,.14)}
.qc .badge{position:absolute;top:-9px;right:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.qc b{font-family:"Noto Sans TC";font-size:13.5px}
.qc .pr{font-family:Inter;font-weight:800;font-size:24px;margin:8px 0 2px}
.qc .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);padding:5px 0;border-top:1px dashed var(--line)}
/* what-if */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sim>*{min-width:0}
.ctrl{display:flex;flex-direction:column;gap:16px}
.slb{display:flex;justify-content:space-between;font-size:12.5px;font-family:"Noto Sans TC";font-weight:700;margin-bottom:7px}
.slb span{color:var(--accent);font-family:Inter;font-weight:800}
input[type=range]{width:100%;accent-color:var(--accent)}
.simout{background:#fbf6ec;border:1px solid var(--line);border-radius:14px;padding:18px}
.simout .big{font-family:Inter;font-weight:800;font-size:34px}
.simrow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.simrow:last-child{border:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fbf1de;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;font-family:"Noto Sans TC";cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* version diff */
.dline{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px}
.dline .dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.dline .m{flex:1;min-width:0}
.dline .m b{font-family:"Noto Sans TC";font-size:13px}
.dline .m small{color:var(--mut);font-size:11.5px;display:block}
.dline .delta{font-family:Inter;font-weight:800;font-size:15px;flex:none}
.ver{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:6px}
.ver::before{content:"";position:absolute;left:11px;top:6px;bottom:16px;width:2px;background:var(--line)}
.vi{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;position:relative;padding-left:22px}
.vi::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.vi.old::before{background:var(--mut)}
.vi b{font-family:Inter;font-weight:800;font-size:13.5px}
.vi small{color:var(--mut);font-size:11.5px;display:block}
.mini{font-size:11px;color:var(--mut);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
@media(max-width:900px){.wrap{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.split,.sim,.two,.qgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">試</div><div><b>BOM 成本試算室</b><span>BOM COSTING STUDIO</span></div></div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><i></i><span>標準成本 v3.2 已鎖定</span></div></div>
  <div id="view"></div>
</div>
<script>
const MOD=[
["成本總覽","insights","成本總覽","單位成本、毛利與料工費占比戰情"],
["BOM 結構","account_tree","BOM 結構","多階 BOM 展開、用量與階層單位成本"],
["成本結構分析","donut_large","成本結構分析","料/工/費占比拆解與異常項目定位"],
["供應報價","request_quote","供應報價","多供應商比價、替代料與匯率試算"],
["情境試算","tune","情境試算","用量、匯率、替代料的 What-if 模擬"],
["版本比較","difference","版本比較","核定成本版本差異與變動來源追溯"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const NT=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
// Multi-level BOM: 產品 GX-3000 智慧電表. [level,code,name,qty,unit,unitCost,cat]
const BOM=[
[0,"GX-3000","智慧電表主機 (成品)",1,"台",1284.60,"asm"],
[1,"SUB-PCBA","主控 PCBA 模組",1,"片",486.20,"asm"],
[2,"IC-MCU32","32-bit 主控 MCU",1,"顆",128.40,"m"],
[2,"IC-METER","計量前端晶片",1,"顆",96.80,"m"],
[2,"PCB-6L","六層印刷電路板",1,"片",74.50,"m"],
[2,"CAP-SET","被動元件套包",1,"套",58.30,"m"],
[2,"SMT-LINE","SMT 貼片工時",1,"工",92.00,"l"],
[2,"OVH-PCBA","PCBA 製造費用分攤",1,"式",36.20,"o"],
[1,"SUB-CASE","外殼與結構件",1,"組",214.90,"asm"],
[2,"CASE-ABS","ABS 阻燃上下殼",1,"組",88.60,"m"],
[2,"GASKET","防水矽膠墊圈",2,"件",12.40,"m"],
[2,"SCREW-M3","M3 不鏽鋼螺絲",8,"支",1.85,"m"],
[2,"ASSY-CASE","結構組立工時",1,"工",78.50,"l"],
[1,"SUB-DISP","顯示與通訊模組",1,"組",268.30,"asm"],
[2,"LCD-160","segment LCD 顯示屏",1,"片",142.70,"m"],
[2,"RF-NB","NB-IoT 通訊模組",1,"顆",96.40,"m"],
[2,"ASSY-DISP","顯示組裝工時",1,"工",29.20,"l"],
[1,"FINAL-TEST","整機測試與校正工時",1,"工",96.80,"l"],
[1,"OVH-FINAL","整機製造費用分攤",1,"式",52.40,"o"]];
const CATC={m:"var(--mat)",l:"var(--lab)",o:"var(--ovh)",asm:"var(--accent)"};
const CATN={m:"材料",l:"人工",o:"費用",asm:"組立"};

const SCREENS=[
// 0 成本總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">payments</span><div class="l">單位標準成本</div><div class="v">$1,284<small style="font-size:12px">.60</small></div><div class="d up">▼ 較上版 2.1%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">trending_up</span><div class="l">建議售價毛利</div><div class="v">31.4<small style="font-size:12px">%</small></div><div class="d up">▲ +3.6 pt</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">category</span><div class="l">BOM 品項</div><div class="v">18</div><div class="d" style="color:var(--mut)">3 階 · 4 組立</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">待覆核報價</div><div class="v" style="color:var(--bad)">4</div><div class="d" style="color:var(--mut)">2 漲價 · 1 替代</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>料工費結構占比</h3><div class="chart" id="c_ov"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">local_fire_department</span>成本前五大品項</h3>${
   [["LCD-160","segment LCD 顯示屏",142.70,100],["IC-MCU32","32-bit 主控 MCU",128.40,90],["FINAL-TEST","整機測試工時",96.80,68],["RF-NB","NB-IoT 通訊模組",96.40,68],["SMT-LINE","SMT 貼片工時",92.00,65]]
   .map(h=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">${h[1]}</b><span style="color:var(--accent);font-weight:800;font-family:Inter">$${NT(h[2])}</span></div><div style="height:8px;background:#f5ecda;border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${h[3]}%;background:linear-gradient(90deg,var(--accent2),var(--accent))"></i></div></div>`).join('')}
   <div style="margin-top:14px;padding:10px 12px;background:#fbf6ec;border-radius:10px;font-size:12px;color:var(--mut)"><span class="material-symbols-outlined" style="color:var(--accent);font-size:16px">bolt</span> 前五大品項占單位成本 <b style="color:var(--ink)">43.2%</b>，優先議價可最大化降本。</div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">timeline</span>近六個月單位成本走勢</h3><div class="chart" id="c_trend" style="height:230px"></div></div>`,

// 1 BOM 結構 — SIGNATURE split
()=>`<div class="grid split">
 <div class="card"><h3><span class="material-symbols-outlined">account_tree</span>多階 BOM 結構 <span class="tag t-mut" style="margin-left:auto">GX-3000</span></h3>
  <div class="leg"><span><em style="background:var(--mat)"></em>材料</span><span><em style="background:var(--lab)"></em>人工</span><span><em style="background:var(--ovh)"></em>費用</span><span><em style="background:var(--accent)"></em>組立</span></div>
  <div class="tree" id="tree"></div></div>
 <div class="card" id="bomDetail"></div>
</div>`,

// 2 成本結構分析
()=>`<div class="grid g11">
 <div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>成本結構（料/工/費）</h3><div class="chart" id="c_struct"></div>
  <div style="display:flex;gap:10px;margin-top:6px">${
   [["材料","var(--mat)","$772.70","60.1%"],["人工","var(--lab)","$296.50","23.1%"],["費用","var(--ovh)","$215.40","16.8%"]]
   .map(s=>`<div style="flex:1;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center"><div style="width:10px;height:10px;border-radius:3px;background:${s[1]};margin:0 auto 6px"></div><div style="font-size:12px;color:var(--mut)">${s[0]}</div><div style="font-family:Inter;font-weight:800;font-size:16px">${s[2]}</div><div style="font-size:11px;color:var(--accent);font-weight:700">${s[3]}</div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各組立階成本堆疊</h3><div class="chart" id="c_stack"></div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">rule</span>成本異常偵測</h3><div class="scroll"><table class="data"><tr><th>品項</th><th>類別</th><th class="num">標準成本</th><th class="num">目前成本</th><th class="num">變動</th><th>判定</th></tr>${
  [["IC-MCU32","材料",118.90,128.40,"+8.0%","t-bad","缺料漲價"],["LCD-160","材料",142.70,142.70,"0.0%","t-ok","持平"],["SMT-LINE","人工",84.00,92.00,"+9.5%","t-bad","工時上調"],["CASE-ABS","材料",96.20,88.60,"-7.9%","t-ok","替代料降本"],["RF-NB","材料",96.40,96.40,"0.0%","t-ok","持平"],["OVH-FINAL","費用",48.00,52.40,"+9.2%","t-warn","分攤上升"]]
  .map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="num">$${NT(r[2])}</td><td class="num">$${NT(r[3])}</td><td class="num" style="color:${r[4][0]=='+'?'var(--bad)':r[4][0]=='-'?'var(--ok)':'var(--mut)'};font-weight:800">${r[4]}</td><td><span class="tag ${r[5]}">${r[6]}</span></td></tr>`).join('')}</table></div></div>`,

// 3 供應報價
()=>`<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">request_quote</span>IC-MCU32 · 32-bit 主控 MCU 供應報價比較 <span class="tag t-info" style="margin-left:auto">匯率 USD 32.15</span></h3>
 <div class="qgrid">
  <div class="qc best"><span class="badge">最佳方案</span><b>盛群半導體</b><div class="pr" style="color:var(--accent)">$128.40</div><div class="row"><span>原幣報價</span><b>USD 3.99</b></div><div class="row"><span>MOQ / 交期</span><b>5K / 14 天</b></div><div class="row"><span>替代相容</span><b style="color:var(--ok)">100%</b></div></div>
  <div class="qc"><b>兆易創新</b><div class="pr">$133.70</div><div class="row"><span>原幣報價</span><b>USD 4.16</b></div><div class="row"><span>MOQ / 交期</span><b>10K / 21 天</b></div><div class="row"><span>替代相容</span><b style="color:var(--warn)">需驗證</b></div></div>
  <div class="qc"><b>意法半導體</b><div class="pr">$145.20</div><div class="row"><span>原幣報價</span><b>USD 4.52</b></div><div class="row"><span>MOQ / 交期</span><b>2.5K / 35 天</b></div><div class="row"><span>替代相容</span><b style="color:var(--ok)">100%</b></div></div>
 </div></div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">table_chart</span>關鍵料件多供應商比價</h3><div class="scroll"><table class="data"><tr><th>料號</th><th>供應商</th><th class="num">原幣</th><th class="num">台幣</th><th>交期</th><th>狀態</th></tr>${

// BOM tree render + detail
let ins={};
function disp(v){try{v.dispose();}catch(e){}}
function bomTree(){
 const el=document.getElementById('tree');if(!el)return;
 el.innerHTML=BOM.map((b,idx)=>{const pad=b[0]*18;const tw=b[6]=='asm'?(b[0]<2?'expand_more':'south_east'):'south_east';
  return `<div class="node ${idx==0?'sel':''}" data-idx="${idx}" onclick="bomSel(${idx})" style="padding-left:${9+pad}px"><span class="tw material-symbols-outlined">${tw}</span><span class="lv" style="background:${CATC[b[6]]}"></span><span class="code">${b[1]}</span><span class="nm">${b[2]}</span><span class="cost">$${NT(b[5])}</span></div>`;}).join('');
 bomSel(0);
}
function bomSel(idx){
 document.querySelectorAll('#tree .node').forEach(n=>n.classList.toggle('sel',+n.dataset.idx===idx));
 const b=BOM[idx],el=document.getElementById('bomDetail');if(!el)return;
 // direct children = next entries at level+1 until level<=b.level
 const kids=[];const desc=[];
 for(let i=idx+1;i<BOM.length;i++){if(BOM[i][0]<=b[0])break;desc.push(BOM[i]);if(BOM[i][0]===b[0]+1)kids.push(BOM[i]);}
 // roll up material/labor/overhead from ALL descendant leaf nodes (assemblies excluded)
 let mat=0,lab=0,ovh=0;
 desc.forEach(k=>{if(k[6]=='asm')return;const s=k[5]*k[3];if(k[6]=='m')mat+=s;else if(k[6]=='l')lab+=s;else if(k[6]=='o')ovh+=s;});
 const mm=mat||(b[6]=='m'?b[5]:0),ll=lab||(b[6]=='l'?b[5]:0),oo=ovh||(b[6]=='o'?b[5]:0);
 const sum=(mm+ll+oo)||1;
 const kidSum=kids.reduce((a,k)=>a+k[5]*k[3],0)||b[5];
 el.innerHTML=`<div class="detail-hd"><div class="bg"><span class="material-symbols-outlined">${b[6]=='asm'?'account_tree':b[6]=='l'?'engineering':b[6]=='o'?'receipt_long':'category'}</span></div><div><b>${b[2]}</b><small>${b[1]} · 用量 ${b[3]} ${b[4]} · ${CATN[b[6]]}</small></div><div class="big"><b>$${NT(b[5])}</b><small>單位成本</small></div></div>
  <div class="leg"><span><em style="background:var(--mat)"></em>材料 $${NT(mm)}</span><span><em style="background:var(--lab)"></em>人工 $${NT(ll)}</span><span><em style="background:var(--ovh)"></em>費用 $${NT(oo)}</span></div>
  <div class="cbar"><i style="width:${mm/sum*100}%;background:var(--mat)"></i><i style="width:${ll/sum*100}%;background:var(--lab)"></i><i style="width:${oo/sum*100}%;background:var(--ovh)"></i></div>
  ${kids.length?`<div class="scroll"><table class="data"><tr><th>子件</th><th>類別</th><th class="num">用量</th><th class="num">單價</th><th class="num">小計</th></tr>${kids.map(k=>`<tr><td><b>${k[1]}</b><br><span style="font-size:11px;color:var(--mut)">${k[2]}</span></td><td><span class="tag" style="background:${CATC[k[6]]}22;color:${CATC[k[6]]}">${CATN[k[6]]}</span></td><td class="num">${k[3]} ${k[4]}</td><td class="num">$${NT(k[5])}</td><td class="num" style="font-weight:800">$${NT(k[5]*k[3])}</td></tr>`).join('')}<tr style="background:#fbf6ec"><td colspan="4" style="text-align:right;font-weight:800">直屬階層合計</td><td class="num" style="font-weight:800;color:var(--accent)">$${NT(kidSum)}</td></tr></table></div>`:`<div style="padding:20px;text-align:center;color:var(--mut);font-size:12.5px;background:#fbf6ec;border-radius:11px"><span class="material-symbols-outlined" style="color:var(--accent)">description</span><br>此為採購／工時葉節點，無下階展開。<br>單位成本 <b style="color:var(--ink)">$${NT(b[5])}</b> 由標準成本帶入。</div>`}`;
}

let simAlt=0;
function simCalc(){
 const qty=+document.getElementById('s_qty').value,fx=+document.getElementById('s_fx').value/100,lab=+document.getElementById('s_lab').value;
 document.getElementById('l_qty').textContent=qty+'%';document.getElementById('l_fx').textContent=fx.toFixed(2);document.getElementById('l_lab').textContent=lab+'%';
 const base={mat:772.70,lab:296.50,ovh:215.40};
 const altF=[{m:1,name:''},{m:0.982,name:'ABS 降本殼'},{m:0.955,name:'國產 MCU'}][simAlt];
 const fxRatio=fx/32.15;
 const mat=base.mat*altF.m*(0.45+0.55*fxRatio)*(0.5+0.5*qty/100);
 const labC=base.lab*lab/100;
 const ovh=base.ovh;
 const cost=mat+labC+ovh,baseCost=1284.60;
 const price=cost/(1-0.31),gp=(price-cost)/price*100;
 document.getElementById('o_cost').textContent='$'+NT(cost);
 document.getElementById('o_mat').textContent='$'+NT(mat);
 document.getElementById('o_lab').textContent='$'+NT(labC);
 document.getElementById('o_ovh').textContent='$'+NT(ovh);
 document.getElementById('o_price').textContent='$'+NT(price);
 document.getElementById('o_gp').textContent=gp.toFixed(1)+'%';
 const d=cost-baseCost,dp=d/baseCost*100;
 const el=document.getElementById('o_delta');
 el.innerHTML=(d>=0?'▲ 增加 ':'▼ 減少 ')+'$'+NT(Math.abs(d))+' ('+(d>=0?'+':'')+dp.toFixed(1)+'%) 對比核定 v3.2'+(altF.name?' · '+altF.name:'');
 el.style.color=d>0?'var(--bad)':d<0?'var(--ok)':'var(--mut)';
}

   {name:'材料',type:'bar',stack:'x',data:[358,102.85,239.1,0],itemStyle:{color:'#d97706'}},

   {name:'費用',type:'bar',stack:'x',data:[36.2,0,0,52.4],itemStyle:{color:'#8b5cf6'}}]});
