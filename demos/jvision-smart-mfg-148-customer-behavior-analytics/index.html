<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客戶行為分析 Customer Behavior Analytics｜Jvision 系統 Demo</title>
<meta name="description" content="把分散的客戶數據變成可下鑽、可行動的行為洞察與交叉銷售建議" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#1E40AF;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E3A8A;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E3A8A;
  --color-muted:#E9EEF6;
  --color-muted-foreground:#475569;
  --color-border:#DBEAFE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#1E40AF;

  --blue:#1E40AF;
  --ink:#172554;
  --muted:#475569;
  --line:#DBEAFE;

  --oc:#1E40AF;
  --oc2:#3B82F6;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --panel2:#F1F5F9;
  --body:#334155;
  --dim:#64748B;
  --green:#15803D;
  --amber:#B45309;
  --red:#DC2626;
  --vio:#6D28D9;
  --shadow:0 1px 2px rgba(30,64,175,.05),0 8px 24px rgba(30,58,138,.06);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  color:var(--body);
  background:
    linear-gradient(rgba(30,64,175,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,64,175,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(30,64,175,.28);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  line-height:1;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 0 rgba(30,64,175,.03);
  backdrop-filter:blur(12px);
}
.tb-in{
  display:flex;
  align-items:center;
  gap:16px;
  max-width:1440px;
  margin:0 auto;
  padding:12px 24px 10px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .lg{
  display:grid;
  flex:none;
  width:40px;
  height:40px;
  place-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:8px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.brand b{
  display:block;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:30px;
  padding:5px 10px;
  color:#166534;
  background:#F0FDF4;
  border:1px solid #BBF7D0;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.dot{
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(21,128,61,.28)}
  50%{opacity:.65;box-shadow:0 0 0 5px rgba(21,128,61,0)}
}
.tb-r{display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0}
.clock{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.ava{
  display:grid;
  flex:none;
  width:34px;
  height:34px;
  place-content:center;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:7px;
  font-weight:700;
}
.nav{
  display:flex;
  gap:2px;
  max-width:1440px;
  margin:0 auto;
  padding:0 24px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  position:relative;
  display:flex;
  flex:none;
  align-items:center;
  gap:7px;
  min-height:44px;
  padding:9px 14px 10px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-bottom:3px solid transparent;
  border-radius:0;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.nav button .material-symbols-outlined{color:#64748B;font-size:19px}
.nav button:hover{color:var(--color-primary);background:#EFF6FF}
.nav button:hover .material-symbols-outlined{color:var(--color-primary)}
.nav button.on{
  color:var(--color-primary);
  background:#EFF6FF;
  border-bottom-color:var(--color-primary);
}
.nav button.on .material-symbols-outlined{color:var(--color-primary)}

.wrap{
  max-width:1440px;
  min-height:calc(100vh - 108px);
  margin:0 auto;
  padding:24px 24px 48px;
}
.wrap>.vh,.wrap>.kpis,.wrap>.grid,.wrap>.segs{
  animation:reveal .36s cubic-bezier(.22,.61,.36,1) both;
}
.wrap>.kpis{animation-delay:.035s}
.wrap>.grid,.wrap>.segs{animation-delay:.07s}
@keyframes reveal{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.vh{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
}
.vh h2{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  color:var(--ink);
  font-size:22px;
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.25;
}
.vh h2 .material-symbols-outlined{color:var(--color-primary);font-size:23px}
.vh p{max-width:720px;margin:6px 0 0;color:var(--muted);font-size:13px}
.seg{
  display:flex;
  flex:none;
  gap:2px;
  padding:3px;
  background:var(--color-muted);
  border:1px solid #D7E2F0;
  border-radius:7px;
}
.seg span{
  min-height:30px;
  padding:6px 11px;
  color:var(--muted);
  border-radius:4px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.seg span.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  box-shadow:0 1px 2px rgba(30,64,175,.18);
}

.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
  margin-bottom:16px;
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:15px 16px 14px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:8px;
  box-shadow:0 1px 2px rgba(30,64,175,.035);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi::before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--color-primary);
  content:"";
}
.kpi:hover{
  border-color:#93C5FD;
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}
.kpi .l{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:17px}
.kpi .v{
  margin-top:7px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:26px;
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.04em;
  line-height:1.2;
}
.kpi .v small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .d{margin-top:5px;font-family:"Fira Code",monospace;font-size:11px;font-weight:600}
.up{color:#166534}
.up::before{content:"↑ ";font-weight:700}
.down{color:#B91C1C}
.down::before{content:"↓ ";font-weight:700}

.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;
  padding:16px 18px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:8px;
  box-shadow:0 1px 2px rgba(30,64,175,.04);
  transition:border-color .22s ease,box-shadow .22s ease;
}
.card:hover{border-color:#BFDBFE;box-shadow:var(--shadow)}
.card>h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 13px;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  letter-spacing:-.01em;
}
.card>h3::after{
  flex:1;
  height:1px;
  margin-left:4px;
  background:var(--color-border);
  content:"";
}
.card>h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card>h3 .grow{order:3;margin-left:auto;color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}
.card>h3 .grow+*{order:4}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}

.tw{overflow-x:auto;scrollbar-width:thin}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{
  padding:10px 12px;
  color:#334155;
  background:#EFF6FF;
  border-top:1px solid var(--color-border);
  border-bottom:1px solid #BFDBFE;
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl th:first-child{border-left:1px solid var(--color-border);border-radius:6px 0 0 0}
.tbl th:last-child{border-right:1px solid var(--color-border);border-radius:0 6px 0 0}
.tbl td{
  padding:10px 12px;
  color:var(--body);
  background:#FFFFFF;
  border-bottom:1px solid #E2E8F0;
  white-space:nowrap;
  transition:background-color .18s ease;
}
.tbl tbody tr:nth-child(even) td{background:#FAFCFF}
.tbl tbody tr:hover td{background:#EFF6FF}
.tbl td b{color:var(--ink);font-weight:600}
.tbl th:nth-child(4),.tbl th:nth-child(5),.tbl th:nth-child(6),
.tbl td:nth-child(4),.tbl td:nth-child(5),.tbl td:nth-child(6){text-align:right}
.tbl td:nth-child(3),.tbl td:nth-child(4),.tbl td:nth-child(5),.tbl td:nth-child(6){font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:23px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-family:"Fira Sans",sans-serif;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#F0FDF4;border-color:#86EFAC}
.t-warn{color:#92400E;background:#FFFBEB;border-color:#FCD34D}
.t-bad{color:#B91C1C;background:#FEF2F2;border-color:#FCA5A5}
.t-info{color:#1E40AF;background:#EFF6FF;border-color:#93C5FD}
.t-oc{color:#92400E;background:#FFF7ED;border-color:#FDBA74}
.bar{min-width:64px;height:7px;overflow:hidden;background:#E2E8F0;border:1px solid #CBD5E1;border-radius:3px}
.bar span{display:block;height:100%;border-radius:2px}
.mini{color:var(--muted);font-size:11px}

.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sg{
  padding:14px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-top:4px solid var(--color-primary);
  border-radius:7px;
  box-shadow:0 1px 2px rgba(30,64,175,.04);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.sg:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sg .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sg .h b{color:var(--ink);font-size:14px}
.sg .cnt{padding:3px 8px;color:var(--color-primary);background:#EFF6FF;border:1px solid #BFDBFE;border-radius:5px;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.sg .mt{display:flex;gap:18px;margin-top:12px}
.sg .mt div span{display:block;color:var(--muted);font-size:11px}
.sg .mt div b{color:var(--ink);font-family:"Fira Code",monospace;font-size:16px;font-variant-numeric:tabular-nums}
.sg p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.55}

.rec{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:9px;
  padding:11px;
  background:#FAFCFF;
  border:1px solid var(--color-border);
  border-radius:7px;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.rec:hover{background:#EFF6FF;border-color:#93C5FD;transform:translateX(2px)}
.rec .ic{display:grid;flex:none;width:38px;height:38px;place-content:center;color:var(--color-primary);background:#DBEAFE;border-radius:6px}
.rec .txt{flex:1;min-width:0}
.rec .txt b{color:var(--ink);font-size:13px}
.rec .txt small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
.rec .conf{flex:none;text-align:right}
.rec .conf b{display:block;color:var(--color-primary);font-family:"Fira Code",monospace;font-size:17px;font-weight:700}
.rec .conf span{font-size:10px}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0;padding:3px 8px;color:var(--body);background:#F8FAFC;border:1px solid var(--color-border);border-radius:5px;font-size:11px;font-weight:600}

.tl{position:relative;padding-left:27px}
.tl::before{position:absolute;top:5px;bottom:5px;left:8px;width:2px;background:#CBD5E1;content:""}
.tli{position:relative;padding:0 0 18px}
.tli::before{position:absolute;top:4px;left:-24px;width:12px;height:12px;background:var(--color-primary);border:3px solid #FFFFFF;border-radius:50%;box-shadow:0 0 0 1px #93C5FD;content:""}
.tli.email::before{background:#2563EB}
.tli.visit::before{background:#15803D}
.tli.quote::before{background:#D97706}
.tli.call::before{background:#6D28D9}
.tli .top2{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tli .top2 b{color:var(--ink);font-size:13px}
.tli .when{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-variant-numeric:tabular-nums}
.tli p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.5}

.risk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #E2E8F0}
.risk:last-child{border-bottom:0}
.risk .sco{display:grid;flex:none;width:46px;height:46px;place-content:center;color:#FFFFFF;border:2px solid rgba(15,23,42,.12);border-radius:6px;font-family:"Fira Code",monospace;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.risk .info{flex:1;min-width:0}
.risk .info b{color:var(--ink);font-size:13px}
.risk .info small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
.risk .act{flex:none}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-height:36px;
  padding:0 12px;
  color:var(--color-primary);
  background:#FFFFFF;
  border:1px solid #93C5FD;
  border-radius:6px;
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.btn:hover{background:#EFF6FF;border-color:var(--color-primary);transform:translateY(-1px)}
.btn.pri{color:var(--color-on-primary);background:var(--color-primary);border-color:var(--color-primary);box-shadow:0 2px 6px rgba(30,64,175,.18)}
.btn.pri:hover{background:#1E3A8A;box-shadow:0 4px 10px rgba(30,64,175,.23)}
.btn .material-symbols-outlined{font-size:16px}
.gauge-wrap{display:flex;align-items:center;gap:16px}
.note{padding:11px 13px;color:var(--muted);background:#FFF7ED;border:1px solid #FED7AA;border-left:4px solid var(--color-accent);border-radius:6px;font-size:12px;line-height:1.6}
.note b{color:#7C2D12}
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.funnel-row .fl{flex:none;width:110px;color:var(--body);font-size:12px}
.funnel-row .ft{display:flex;align-items:center;min-width:0;height:27px;padding:0 9px;color:#FFFFFF;background:linear-gradient(90deg,#1E40AF,#3B82F6);border-radius:4px;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.funnel-row .fn{flex:none;width:52px;color:var(--muted);font-family:"Fira Code",monospace;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:1024px){
  .g2{grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr)}
  .tb-in,.nav,.wrap{padding-right:18px;padding-left:18px}
}
@media (max-width:900px){
  .g2,.g11,.g3{grid-template-columns:1fr}
  .vh{flex-wrap:wrap}
  .seg{max-width:100%;overflow-x:auto}
}
@media (max-width:768px){
  .tb-in{padding-top:10px;padding-bottom:8px}
  .nav{padding-right:14px;padding-left:14px}
  .nav button{min-height:42px;padding-right:12px;padding-left:12px}
  .wrap{padding:18px 14px 38px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:14px}
  .chart{height:250px}
  .risk{align-items:flex-start;flex-wrap:wrap}
  .risk .act{width:100%;padding-left:58px}
}
@media (max-width:560px){
  .brand small,.clock{display:none}
  .brand b{font-size:14px}
  .live{padding:4px 7px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button{justify-content:center;min-width:44px;padding:9px 11px}
  .vh h2{font-size:19px}
  .kpis{gap:9px}
  .kpi{padding:13px 12px}
  .kpi .v{font-size:22px}
  .segs{grid-template-columns:1fr}
  .rec{align-items:flex-start;flex-wrap:wrap}
  .rec .txt{min-width:calc(100% - 52px)}
  .rec .conf{width:100%;padding-left:50px;text-align:left}
  .funnel-row .fl{width:82px}
  .tbl th,.tbl td{padding:9px 10px}
}
@media (max-width:390px){
  .tb-in{gap:9px;padding-right:10px;padding-left:10px}
  .brand{gap:8px}
  .brand .lg{width:36px;height:36px}
  .ava{display:none}
  .wrap{padding-right:10px;padding-left:10px}
  .kpis{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .wrap>.vh,.wrap>.kpis,.wrap>.grid,.wrap>.segs{opacity:1;transform:none}
  .dot{box-shadow:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-in">
    <div class="brand">
      <span class="lg"><span class="material-symbols-outlined">insights</span></span>
      <div><b>客戶行為分析</b><small>Customer Behavior Analytics · 禾川智造業務中心</small></div>
    </div>

/* ---------- helpers ---------- */
function vhead(i,extra){
  return '<div class="vh"><div><h2><span class="material-symbols-outlined">'+MODS[i][0]+'</span>'+TITLES[i][0]+'</h2><p>'+TITLES[i][1]+'</p></div>'+(extra||'')+'</div>';
}
function kpi(ic,l,v,d,dir){
  return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+'</div><div class="d '+(dir||'up')+'">'+d+'</div></div>';
}
var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODS.map(function(m,i){ return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m[0]+'</span><span>'+m[1]+'</span></button>'; }).join('');
  var btns=n.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); }); })(btns[i]); }
}
function show(i){
  disposeCharts();
  SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
}
function tick(){ var d=new Date(); var p=function(x){return (x<10?"0":"")+x;}; var el=document.getElementById("clk"); if(el) el.textContent=p(d.getHours())+":"+p(d.getMinutes()); }
buildNav(); tick();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
