<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客戶行為分析 Customer Behavior Analytics｜Jvision 系統 Demo</title>
<meta name="description" content="把分散的客戶數據變成可下鑽、可行動的行為洞察與交叉銷售建議" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --oc:#c2410c; --oc2:#fb923c; --bg:#0b1220; --panel:#111a2e; --panel2:#0e1626;
    --line:#1f2b45; --ink:#f1f5f9; --body:#c3cee0; --muted:#7d8bab; --dim:#5b6a8a;
    --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --blue:#38bdf8; --vio:#a78bfa;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* top nav */
  .topbar{ position:sticky; top:0; z-index:30; background:linear-gradient(180deg,#0e1830,#0b1220); border-bottom:1px solid var(--line); }
  .tb-in{ display:flex; align-items:center; gap:14px; padding:11px 20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand .lg{ width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--oc),var(--oc2)); color:#fff; display:grid; place-content:center; flex:none; box-shadow:0 4px 14px rgba(194,65,12,.4); }
  .brand b{ color:#fff; font-size:15px; display:block; white-space:nowrap; } .brand small{ color:var(--muted); font-size:11px; white-space:nowrap; }
  .live{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:var(--green); background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3); padding:5px 10px; border-radius:999px; white-space:nowrap; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(34,197,94,.5);} 50%{ opacity:.5; box-shadow:0 0 0 5px rgba(34,197,94,0);} }
  .tb-r{ margin-left:auto; display:flex; align-items:center; gap:12px; min-width:0; }
  .clock{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ava{ width:34px; height:34px; border-radius:10px; background:rgba(251,146,60,.16); color:var(--oc2); font-weight:800; display:grid; place-content:center; flex:none; }
  .nav{ display:flex; gap:6px; padding:0 14px 10px; overflow-x:auto; flex-wrap:wrap; }
  .nav button{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); color:var(--body); font:inherit; font-size:13px; font-weight:700; padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap; flex:none; }
  .nav button .material-symbols-outlined{ font-size:19px; color:var(--muted); }
  .nav button:hover{ border-color:var(--oc2); color:#fff; }
  .nav button.on{ background:linear-gradient(135deg,var(--oc),var(--oc2)); border-color:transparent; color:#fff; box-shadow:0 4px 14px rgba(194,65,12,.35); }
  .nav button.on .material-symbols-outlined{ color:#fff; }
  /* body */
  .wrap{ padding:20px 22px 46px; max-width:1400px; margin:0 auto; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:21px; font-weight:900; color:#fff; display:flex; align-items:center; gap:9px; }
  .vh h2 .material-symbols-outlined{ color:var(--oc2); }
  .vh p{ margin:5px 0 0; font-size:13px; color:var(--muted); max-width:640px; }
  .seg{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px; }
  .seg span{ font-size:12px; font-weight:700; color:var(--muted); padding:5px 11px; border-radius:7px; white-space:nowrap; }
  .seg span.on{ background:var(--oc); color:#fff; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:15px 17px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--oc),var(--oc2)); }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:17px; color:var(--oc2); }
  .kpi .v{ font-size:27px; font-weight:900; color:#fff; margin-top:7px; font-variant-numeric:tabular-nums; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:5px; } .up{ color:var(--green); } .down{ color:var(--red); }
  .grid{ display:grid; gap:16px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:2fr 1fr; } .g11{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:1fr 1fr 1fr; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:17px 19px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:14px; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; }
  .card>h3 .material-symbols-outlined{ color:var(--oc2); font-size:19px; }
  .card>h3 .grow{ margin-left:auto; font-size:11px; font-weight:700; color:var(--muted); }
  .chart{ width:100%; height:280px; overflow:hidden; }
  .chart.sm{ height:220px; }
  /* table */
  .tw{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:800; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--body); }
  .tbl tr:hover td{ background:var(--panel2); } .tbl td b{ color:#fff; }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .t-ok{ background:rgba(34,197,94,.14); color:#4ade80; } .t-warn{ background:rgba(245,158,11,.14); color:#fbbf24; } .t-bad{ background:rgba(239,68,68,.14); color:#f87171; } .t-info{ background:rgba(56,189,248,.14); color:#38bdf8; } .t-oc{ background:rgba(251,146,60,.16); color:var(--oc2); }
  .bar{ height:6px; border-radius:999px; background:var(--line); overflow:hidden; min-width:64px; } .bar span{ display:block; height:100%; border-radius:999px; }
  .mini{ font-size:11px; color:var(--muted); }
  /* segment cards */
  .segs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .sg{ background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:15px; border-top:3px solid var(--oc); }
  .sg .h{ display:flex; align-items:center; justify-content:space-between; } .sg .h b{ color:#fff; font-size:15px; } .sg .cnt{ font-size:11px; font-weight:800; color:var(--oc2); background:rgba(251,146,60,.14); border-radius:999px; padding:2px 9px; }
  .sg .mt{ display:flex; gap:14px; margin-top:12px; } .sg .mt div span{ display:block; font-size:11px; color:var(--muted); } .sg .mt div b{ color:#fff; font-size:17px; }
  .sg p{ margin:10px 0 0; font-size:12px; color:var(--muted); line-height:1.5; }
  /* cross-sell recs */
  .rec{ display:flex; align-items:center; gap:13px; padding:13px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  .rec .ic{ width:40px; height:40px; border-radius:11px; background:rgba(251,146,60,.14); color:var(--oc2); display:grid; place-content:center; flex:none; }
  .rec .txt{ flex:1; min-width:0; } .rec .txt b{ color:#fff; font-size:14px; } .rec .txt small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .rec .conf{ text-align:right; flex:none; } .rec .conf b{ color:var(--oc2); font-size:18px; font-weight:900; } .rec .conf span{ display:block; font-size:10px; color:var(--muted); }
  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--body); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px 9px; margin:2px 4px 2px 0; }
  /* timeline */
  .tl{ position:relative; padding-left:26px; }
  .tl::before{ content:""; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tli{ position:relative; padding:0 0 18px; }
  .tli::before{ content:""; position:absolute; left:-22px; top:3px; width:12px; height:12px; border-radius:50%; border:2px solid var(--bg); }
  .tli.email::before{ background:var(--blue); } .tli.visit::before{ background:var(--green); } .tli.quote::before{ background:var(--oc2); } .tli.call::before{ background:var(--vio); }
  .tli .top2{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .tli .top2 b{ color:#fff; font-size:13px; } .tli .when{ font-size:11px; color:var(--dim); }
  .tli p{ margin:4px 0 0; font-size:12px; color:var(--muted); line-height:1.5; }
  /* churn list */
  .risk{ display:flex; align-items:center; gap:13px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .risk:last-child{ border-bottom:0; }
  .risk .sco{ width:46px; height:46px; border-radius:12px; display:grid; place-content:center; font-weight:900; font-size:16px; flex:none; color:#fff; }
  .risk .info{ flex:1; min-width:0; } .risk .info b{ color:#fff; font-size:14px; } .risk .info small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .risk .act{ flex:none; }
  .btn{ display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 13px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); color:var(--body); font:inherit; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; }
  .btn.pri{ background:linear-gradient(135deg,var(--oc),var(--oc2)); border-color:transparent; color:#fff; }
  .btn .material-symbols-outlined{ font-size:16px; }
  .gauge-wrap{ display:flex; align-items:center; gap:16px; }
  .note{ font-size:12px; color:var(--muted); line-height:1.6; background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--oc2); border-radius:10px; padding:12px 14px; }
  .note b{ color:#fff; }
  .funnel-row{ display:flex; align-items:center; gap:12px; margin-bottom:11px; }
  .funnel-row .fl{ width:110px; font-size:12px; color:var(--body); flex:none; }
  .funnel-row .ft{ flex:1; height:26px; border-radius:7px; background:linear-gradient(90deg,var(--oc),var(--oc2)); display:flex; align-items:center; padding:0 10px; color:#fff; font-weight:800; font-size:12px; min-width:0; }
  .funnel-row .fn{ width:64px; text-align:right; font-size:12px; color:var(--muted); flex:none; }
  @media (max-width:900px){ .g2,.g11,.g3{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .brand small,.clock,.nav button span:not(.material-symbols-outlined){ display:none; } .nav button{ padding:9px 11px; } .wrap{ padding:16px 13px 34px; } .kpis{ grid-template-columns:1fr 1fr; } .kpi .v{ font-size:23px; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-in">
    <div class="brand">
      <span class="lg"><span class="material-symbols-outlined">insights</span></span>
      <div><b>客戶行為分析</b><small>Customer Behavior Analytics · 禾川智造業務中心</small></div>
    </div>
    <div class="tb-r">
      <span class="live"><span class="dot"></span>資料同步中</span>
      <span class="clock" id="clk">--:--</span>
      <span class="ava">析</span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>
<div class="wrap" id="view"></div>

<script>
"use strict";
var MODS=[
  ["groups","行為總覽"],["insights","購買模式"],["account_tree","交叉銷售"],
  ["history","互動軌跡"],["warning","流失預警"],["trending_up","成效追蹤"]
];
var TITLES=[
  ["客戶行為總覽","整合 CRM／ERP／郵件與拜訪詢價，形成單一客戶行為視圖與健康分數"],
  ["購買模式分析","以 RFM 與復購週期分群，掌握每群客戶的價值與購買節奏"],
  ["產品關聯與交叉銷售","從品項關聯網找出高信賴度組合，產出可執行的交叉銷售建議"],
  ["客戶互動軌跡整合","把郵件、拜訪、詢價、電話彙整成單一客戶時間軸"],
  ["客戶流失預警","流失風險評分與挽回名單，讓業務把力氣花在對的客戶"],
  ["成效追蹤與回饋","追蹤交叉銷售成功率與流失預警準確率，回饋策略調整"]
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){ for(var i=0;i<charts.length;i++){ try{ charts[i].dispose(); }catch(e){} } charts=[]; }
function mk(id){ var el=document.getElementById(id); if(!el) return null; var c=echarts.init(el); charts.push(c); return c; }
var AX="#7d8bab", GRID="#1f2b45";
function baseGrid(){ return { top:30, left:6, right:14, bottom:6, containLabel:true }; }
function axis(o){ o.axisLine={lineStyle:{color:GRID}}; o.axisLabel={color:AX,fontSize:11}; o.splitLine={lineStyle:{color:GRID}}; o.axisTick={show:false}; return o; }
function tt(){ return { trigger:"axis", backgroundColor:"#0e1626", borderColor:"#1f2b45", textStyle:{color:"#f1f5f9",fontSize:12} }; }

/* ---------- shared fake data ---------- */
var CUST=[
  ["O工機械","製造設備","A+",92,"活躍",214,3.4,"高頻穩定",6],
  ["宏達自動化","自動化系統","A",87,"活躍",168,2.8,"成長中",11],
  ["昇O精密","金屬加工","A",84,"活躍",142,3.1,"穩定",18],
  ["旭O電子","電子零組件","B+",71,"觀察",96,4.6,"週期拉長",42],
  ["O泰模具","模具製造","B",64,"觀察",78,5.2,"回購下降",58],
  ["O暉工業","工業設備","B",61,"觀察",70,4.9,"詢價減少",63],
  ["華信儀器","量測儀器","C+",48,"風險",41,7.8,"互動冷卻",97],
  ["盛豐鑄造","鑄造","C",39,"風險",33,9.1,"報價未回",128]
];

/* ---------- Screen 0: 行為總覽 ---------- */
function s0(){
  view.innerHTML=''
  +vhead(0,'<div class="seg"><span class="on">近 90 天</span><span>近 30 天</span><span>本季</span></div>')
  +'<div class="kpis">'
  +kpi("groups","活躍客戶數","1,284","+6.2%","up")
  +kpi("favorite","平均健康分數","74.3","+3.1","up")
  +kpi("autorenew","平均復購週期","38 <small>天</small>","−4 天","up")
  +kpi("warning","高流失風險","46 <small>戶</small>","+8 戶","down")
  +'</div>'
  +'<div class="grid g2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>客戶活躍度趨勢<span class="grow">郵件 · 拜訪 · 詢價</span></h3><div id="c0a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>客戶價值分層</h3><div id="c0b" class="chart"></div></div>'
  +'</div>'
  +'<div class="grid" style="margin-top:16px"><div class="card"><h3><span class="material-symbols-outlined">table_rows</span>重點客戶行為看板</h3>'
    +'<div class="tw"><table class="tbl"><thead><tr><th>客戶</th><th>產業</th><th>分級</th><th>健康分數</th><th>近 90 天訂單</th><th>復購週期</th><th>狀態</th></tr></thead><tbody>'
    +CUST.map(function(r){
        var col=r[3]>=80?"var(--green)":r[3]>=60?"var(--amber)":"var(--red)";
        var st=r[4]==="活躍"?"t-ok":r[4]==="觀察"?"t-warn":"t-bad";
        return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td><span class="tag t-oc">'+r[2]+'</span></td>'
          +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar"><span style="width:'+r[3]+'%;background:'+col+'"></span></div><b>'+r[3]+'</b></div></td>'
          +'<td>'+r[5]+'</td><td>'+r[6]+' 週</td><td><span class="tag '+st+'">'+r[4]+'</span></td></tr>';
      }).join('')
    +'</tbody></table></div></div></div>';
  void view.offsetHeight;
  var c=mk("c0a"); if(c) c.setOption({
    tooltip:tt(), legend:{data:["郵件互動","拜訪","詢價"],textStyle:{color:AX},top:0,right:0},
    grid:baseGrid(),
    xAxis:axis({type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週","第7週","第8週","第9週","第10週","第11週","第12週"]}),
    yAxis:axis({type:"value"}),
    series:[
      {name:"郵件互動",type:"line",smooth:true,data:[320,342,358,371,364,389,402,418,431,447,459,472],lineStyle:{color:"#38bdf8"},itemStyle:{color:"#38bdf8"},areaStyle:{color:"rgba(56,189,248,.12)"}},
      {name:"拜訪",type:"line",smooth:true,data:[58,61,66,64,72,75,71,78,82,80,86,91],lineStyle:{color:"#22c55e"},itemStyle:{color:"#22c55e"}},
      {name:"詢價",type:"line",smooth:true,data:[112,124,131,128,140,148,143,156,162,159,171,183],lineStyle:{color:"#fb923c"},itemStyle:{color:"#fb923c"}}
    ]
  });
  var d=mk("c0b"); if(d) d.setOption({
    tooltip:{trigger:"item",backgroundColor:"#0e1626",borderColor:"#1f2b45",textStyle:{color:"#f1f5f9"}},
    legend:{bottom:0,textStyle:{color:AX}},
    series:[{type:"pie",radius:["48%","72%"],center:["50%","44%"],label:{color:"#c3cee0"},
      data:[
        {value:214,name:"高價值 (A)",itemStyle:{color:"#c2410c"}},
        {value:386,name:"成長 (B)",itemStyle:{color:"#fb923c"}},
        {value:452,name:"穩定 (C)",itemStyle:{color:"#f59e0b"}},
        {value:232,name:"待喚醒 (D)",itemStyle:{color:"#475569"}}
      ]}]
  });
}

/* ---------- Screen 1: 購買模式 (RFM) ---------- */
var RFM=[
  ["冠軍客戶",214,"R 5 · F 5 · M 5","近期高頻高額，最佳維護對象","#c2410c"],
  ["忠誠客戶",298,"R 4 · F 4 · M 4","穩定回購，適合擴大品項","#fb923c"],
  ["高潛力",176,"R 4 · F 2 · M 5","單筆金額高但頻率低，可培養","#f59e0b"],
  ["需喚醒",232,"R 2 · F 4 · M 3","過去活躍近期沉睡，及早接觸","#38bdf8"],
  ["流失邊緣",164,"R 1 · F 2 · M 2","長時間未購，需挽回方案","#ef4444"]
];
function s1(){
  view.innerHTML=''
  +vhead(1,'<div class="seg"><span class="on">RFM</span><span>復購週期</span><span>品項偏好</span></div>')
  +'<div class="segs">'+RFM.map(function(r){
      return '<div class="sg" style="border-top-color:'+r[4]+'"><div class="h"><b>'+r[0]+'</b><span class="cnt">'+r[1]+' 戶</span></div>'
        +'<div class="mt"><div><span>RFM 分數</span><b style="color:'+r[4]+'">'+r[2].split(' ')[1]+r[2].split(' ')[4]+r[2].split(' ')[7]+'</b></div><div><span>佔比</span><b>'+Math.round(r[1]/1084*100)+'%</b></div></div>'
        +'<p>'+r[3]+'</p></div>';
    }).join('')+'</div>'

function kpi(ic,l,v,d,dir){
  return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+'</div><div class="d '+(dir||'up')+'">'+d+'</div></div>';
}
var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODS.map(function(m,i){ return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m[0]+'</span><span>'+m[1]+'</span></button>'; }).join('');
  var btns=n.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); }); })(btns[i]); }
}
function show(i){
  disposeCharts();
  SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
}
function tick(){ var d=new Date(); var p=function(x){return (x<10?"0":"")+x;}; var el=document.getElementById("clk"); if(el) el.textContent=p(d.getHours())+":"+p(d.getMinutes()); }
buildNav(); tick();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
