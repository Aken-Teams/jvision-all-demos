<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>倉儲空間規劃系統 Warehouse Slotting & Space Planning</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#334155; --accent2:#64748b; --bg:#f1f5f9; --panel:#ffffff;
  --line:#e2e8f0; --ink:#1e293b; --muted:#64748b; --soft:#f8fafc;
  --a:#dc2626; --b:#d97706; --c:#0891b2; --ok:#16a34a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.55;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
.wrap{display:flex; min-height:100vh; align-items:stretch;}
.side{
  width:236px; flex:0 0 236px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:18px 14px; gap:6px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; gap:10px; align-items:center; padding:6px 8px 14px; border-bottom:1px solid var(--line); margin-bottom:8px;}
.brand .logo{width:38px;height:38px;flex:0 0 38px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
.brand b{font-size:14px; display:block; line-height:1.3;}
.brand span{font-size:11px;color:var(--muted);}
.navbtn{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; cursor:pointer;
  color:var(--muted); border:none; background:transparent; width:100%; text-align:left; font:inherit; min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;}
.navbtn .nt{min-width:0; overflow:hidden;}
.navbtn .nt b{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;}
.navbtn .nt small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.navbtn:hover{background:var(--soft);}
.navbtn.on{background:var(--accent);}
.navbtn.on .material-symbols-outlined,.navbtn.on .nt b,.navbtn.on .nt small{color:#fff;}
.navbtn .idx{font-size:10px;font-weight:700;opacity:.5;margin-left:auto;}
.side .foot{margin-top:auto;font-size:10.5px;color:var(--muted);padding:10px 8px 2px;border-top:1px solid var(--line);}
.main{flex:1 1 auto; min-width:0; padding:22px 26px 40px;}
.head{margin-bottom:18px;}
.head h1{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:9px;}
.head h1 .material-symbols-outlined{color:var(--accent);font-size:24px;}
.head p{margin:0;color:var(--muted);font-size:12.5px;}
.crumb{font-size:11px;color:var(--accent2);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;}
.g{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0;}
.card h3{margin:0 0 3px;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.card .sub{font-size:11px;color:var(--muted);margin:0 0 12px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0;}
.kpi .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2);}
.kpi .val{font-size:25px;font-weight:700;margin-top:7px;letter-spacing:-.02em;}
.kpi .val small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px;}
.kpi .delta{font-size:11px;margin-top:5px;font-weight:600;}
.up{color:var(--ok);} .down{color:var(--a);}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:480px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;background:var(--soft);}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tA{background:#fef2f2;color:var(--a);} .tB{background:#fffbeb;color:var(--b);} .tC{background:#ecfeff;color:var(--c);}
.tok{background:#f0fdf4;color:var(--ok);} .tw2{background:#fef2f2;color:var(--a);} .tp{background:#f1f5f9;color:var(--accent2);}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px;}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent);}
.hm{display:grid;gap:5px;min-width:0;}
.hm .cell{aspect-ratio:1/1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.hm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px;align-items:center;}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
.tl{position:relative;padding-left:20px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 8px;}
.tl .it:before{content:"";position:absolute;left:-18px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line);}
.tl .it .tt{font-size:12.5px;font-weight:600;}
.tl .it .td{font-size:11.5px;color:var(--muted);}
.tl .it .tm{font-size:10.5px;color:var(--accent2);font-weight:600;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;}
.col h4 span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:10.5px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:9px;margin-bottom:8px;}
.tk b{font-size:12px;display:block;}
.tk small{font-size:10.5px;color:var(--muted);}
.tk .who{margin-top:6px;font-size:10.5px;color:var(--accent);font-weight:600;}
.note{font-size:11px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.chart{width:100%;overflow:hidden;}
.rowflex{display:flex;gap:10px;align-items:center;min-width:0;}
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} .board{grid-template-columns:repeat(2,1fr);} }
@media(max-width:860px){
  .wrap{display:block;}
  .side{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);gap:6px;}
  .brand{border-bottom:none;margin:0;padding:2px 8px 2px 0;flex:0 0 100%;}
  .side .foot{display:none;}
  .navbtn{width:auto;flex:1 1 auto;}
  .navbtn .idx{display:none;}
  .main{padding:18px 16px 40px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .navbtn .nt{display:none;}
  .navbtn{justify-content:center;flex:0 0 auto;}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">warehouse</span></div>
      <div><b>倉儲空間規劃</b><span>Warehouse Slotting</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>WMS 倉儲管理系統</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"出入庫數據分析",desc:"揀取頻率與週轉率量化"},
  {icon:"account_tree",name:"ABC 速度分類",desc:"依動銷分 A/B/C 熱區"},
  {icon:"dashboard",name:"儲位佈局模擬",desc:"倉區熱力圖與庫容"},
  {icon:"trending_up",name:"揀貨動線分析",desc:"行走距離與共揀關聯"},
  {icon:"task_alt",name:"儲位指派執行",desc:"移位工單與看板"},
  {icon:"insights",name:"坪效效益追蹤",desc:"利用率坪效前後對比"}
];

function el(id){return document.getElementById(id);}
var _charts={};
function killCharts(){for(var k in _charts){try{_charts[k].destroy();}catch(e){}}_charts={};}
function mkChart(id,opt){
  var node=el(id); if(!node)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(node,opt);c.render();_charts[id]=c;}catch(e){}
}

(function(){
  var n=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')">'
      +'<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'
      +'<span class="nt"><b>'+MODS[i].name+'</b><small>'+MODS[i].desc+'</small></span>'
      +'<span class="idx">0'+(i+1)+'</span></button>';
  }
  n.innerHTML=h;
})();

function kpi(icon,lab,val,delta,dir){
  var d=delta?('<div class="delta '+(dir||'')+'">'+delta+'</div>'):'';
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'
    +'<div class="val">'+val+'</div>'+d+'</div>';
}

/* ===== SCREEN 0 ===== */
function scr0(){
  var rows=[
    {sku:"SKU-A1042",name:"精密軸承 6204",pick:1820,out:9600,turn:14.2,cls:"A"},
    {sku:"SKU-A1088",name:"齒輪箱總成",pick:1540,out:7200,turn:11.8,cls:"A"},
    {sku:"SKU-B2210",name:"液壓油封套件",pick:960,out:4100,turn:6.4,cls:"B"},
    {sku:"SKU-B2377",name:"皮帶輪 D125",pick:720,out:3300,turn:5.1,cls:"B"},
    {sku:"SKU-C3055",name:"備用螺栓組",pick:210,out:880,turn:1.6,cls:"C"},
    {sku:"SKU-C3190",name:"維修工具箱",pick:96,out:340,turn:0.8,cls:"C"}
  ];
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td><b>'+r.sku+'</b></td><td>'+r.name+'</td><td>'+r.pick.toLocaleString()+'</td><td>'
      +r.out.toLocaleString()+'</td><td>'+r.turn.toFixed(1)+'</td>'
      +'<td><span class="tag t'+r.cls+'">'+r.cls+' 級</span></td></tr>';
  }
  return '<div class="crumb">模組 01 · 規劃依據</div>'
    +'<div class="head"><h1><span class="material-symbols-outlined">monitoring</span>出入庫數據分析</h1>'
    +'<p>彙整近 90 日揀取頻率、出貨量與週轉率，找出高動銷與呆滯品項，作為儲位規劃的量化基礎。</p></div>'
    +'<div class="g g4">'
    +kpi("inventory_2","分析品項數","4,286","+312 本月","up")
    +kpi("bolt","日均揀取次數","18,940","+6.4%","up")
    +kpi("cached","平均庫存週轉","8.7 <small>次/月</small>","","")
    +kpi("hourglass_bottom","呆滯品項占比","11.2 <small>%</small>","","")
    +'</div>'
    +'<div class="g g23" style="margin-top:14px;">'
    +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近 12 週出入庫量趨勢</h3>'
    +'<p class="sub">入庫 vs 出庫 · 單位：棧板 PLT</p><div id="c0a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>揀取量占比</h3>'
    +'<p class="sub">80/20 法則觀察</p><div id="c0b" class="chart"></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px;"><h3><span class="material-symbols-outlined">table_rows</span>高動銷品項排行</h3>'
    +'<p class="sub">依 90 日揀取次數排序</p>'
    +'<div class="tw"><table><thead><tr><th>料號</th><th>品名</th><th>揀取次數</th><th>出貨量</th><th>週轉率</th><th>初判分級</th></tr></thead>'
    +'<tbody>'+tr+'</tbody></table></div>'
    +'<div class="note">分析結果將流入模組 02 進行 ABC 速度分類。</div></div>';
}
function scr0charts(){
  mkChart("c0a",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:270},
    series:[{name:"入庫",data:[420,460,410,500,540,480,520,560,590,610,580,630]},
            {name:"出庫",data:[390,430,450,470,510,530,500,540,560,600,620,650]}],
    colors:["#64748b","#334155"],
    plotOptions:{bar:{columnWidth:"58%",borderRadius:3}},
    dataLabels:{enabled:false},
    xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8","W9","W10","W11","W12"],labels:{style:{fontSize:"10px"}}},
    yaxis:{labels:{style:{fontSize:"10px"}}},
    legend:{position:"top",fontSize:"11px"},
    grid:{borderColor:"#eef2f7"},
    tooltip:{shared:true,intersect:false}
  });
  mkChart("c0b",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:270},
    series:[62,26,12],
    labels:["A 級品項","B 級品項","C 級品項"],
    colors:["#dc2626","#d97706","#0891b2"],
    dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    legend:{position:"bottom",fontSize:"11px"},
    plotOptions:{pie:{donut:{size:"62%"}}},
    stroke:{width:0}
  });
}

/* ===== SCREEN 1 ===== */
function scr1(){
  var rows=[
    {sku:"SKU-A1042",v:98,cls:"A",zone:"黃金拿取區 · 腰高",move:"維持"},
    {sku:"SKU-A1088",v:94,cls:"A",zone:"黃金拿取區 · 腰高",move:"維持"},
    {sku:"SKU-B2210",v:71,cls:"B",zone:"次熱區 · 中層",move:"上移一層"},
    {sku:"SKU-B2377",v:64,cls:"B",zone:"次熱區 · 中層",move:"維持"},
    {sku:"SKU-C3055",v:28,cls:"C",zone:"高架冷區 · 頂層",move:"下架轉呆滯"},
    {sku:"SKU-C3190",v:14,cls:"C",zone:"高架冷區 · 頂層",move:"下架轉呆滯"}
  ];
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td><b>'+r.sku+'</b></td><td><span class="tag t'+r.cls+'">'+r.cls+'</span></td>'
      +'<td><div class="rowflex"><div class="bar" style="flex:1"><i style="width:'+r.v+'%"></i></div><span style="width:34px;text-align:right">'+r.v+'</span></div></td>'
      +'<td>'+r.zone+'</td><td>'+r.move+'</td></tr>';
  }
  return '<div class="crumb">模組 02 · 速度分級</div>'
    +'<div class="head"><h1><span class="material-symbols-outlined">account_tree</span>ABC 速度分類</h1>'
    +'<p>依動銷速度將品項分為 A/B/C 三級，決定各級應配置的熱區與拿取高度，取代憑經驗的擺放方式。</p></div>'
    +'<div class="g g3">'
    +'<div class="kpi" style="border-top:3px solid var(--a)"><div class="lab"><span class="material-symbols-outlined">local_fire_department</span>A 級（快速動銷）</div><div class="val">312<small> 品項</small></div><div class="delta">貢獻 78% 揀取量 · 黃金拿取區</div></div>'
    +'<div class="kpi" style="border-top:3px solid var(--b)"><div class="lab"><span class="material-symbols-outlined">trending_flat</span>B 級（中速動銷）</div><div class="val">1,048<small> 品項</small></div><div class="delta">貢獻 17% 揀取量 · 次熱中層</div></div>'
    +'<div class="kpi" style="border-top:3px solid var(--c)"><div class="lab"><span class="material-symbols-outlined">ac_unit</span>C 級（慢速動銷）</div><div class="val">2,926<small> 品項</small></div><div class="delta">貢獻 5% 揀取量 · 高架冷區</div></div>'
    +'</div>'
    +'<div class="g g23" style="margin-top:14px;">'
    +'<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>動銷速度分佈（帕累托）</h3>'
    +'<p class="sub">分級界線落在累積 80% / 95%</p><div id="c1a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>分級門檻</h3>'
    +'<p class="sub">依上季揀取動態調整</p>'
    +'<div class="tl"><div class="it"><div class="tm">A 級</div><div class="tt">累積揀取 0–80%</div><div class="td">週轉 ≥ 10 次/月</div></div>'
    +'<div class="it"><div class="tm">B 級</div><div class="tt">累積揀取 80–95%</div><div class="td">週轉 3–10 次/月</div></div>'
    +'<div class="it"><div class="tm">C 級</div><div class="tt">累積揀取 95–100%</div><div class="td">週轉 &lt; 3 次/月</div></div></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px;"><h3><span class="material-symbols-outlined">move_up</span>分級與建議儲位</h3>'
    +'<p class="sub">系統依分級產生擺放建議</p>'
    +'<div class="tw"><table><thead><tr><th>料號</th><th>級別</th><th>速度分數</th><th>建議儲位</th><th>異動建議</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function scr1charts(){
  mkChart("c1a",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:290},
    series:[{name:"累積揀取占比 %",type:"line",data:[42,62,73,80,86,90,93,95,97,98,99,100]},
            {name:"各段揀取量",type:"column",data:[42,20,11,7,6,4,3,2,2,1,1,1]}],
    colors:["#334155","#94a3b8"],
    stroke:{width:[3,0],curve:"smooth"},
    plotOptions:{bar:{columnWidth:"55%",borderRadius:2}},
    dataLabels:{enabled:false},
    xaxis:{categories:["10%","20%","30%","40%","50%","60%","70%","80%","90%","92%","95%","100%"],labels:{style:{fontSize:"9px"}}},
    yaxis:{max:100,labels:{style:{fontSize:"10px"},formatter:function(v){return Math.round(v);}}},
    legend:{position:"top",fontSize:"11px"},
    grid:{borderColor:"#eef2f7"},
    tooltip:{shared:false}
  });
}

/* ===== SCREEN 2 ===== */
function scr2(){
  var cols=10,rowsN=6,cells="",seed=[];
  for(var y=0;y<rowsN;y++){for(var x=0;x<cols;x++){
    var base=(cols-x)/cols*0.9 + (rowsN-Math.abs(y-2))/rowsN*0.25;
    var jit=((x*7+y*13)%5)/10;
    seed.push(Math.min(1,base*0.7+jit*0.3));
  }}
  for(var i=0;i<seed.length;i++){
    var v=seed[i],col;
