<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>倉儲空間規劃系統 Warehouse Slotting & Space Planning</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#334155;
  --accent2:#475569;
  --bg:#f8fafc;
  --panel:#fff;
  --soft:#f2f3f4;
  --a:#b91c1c;
  --b:#9a5700;
  --c:#036f82;
  --ok:#047857;
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--color-background);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Open Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,a,[onclick]{cursor:pointer}
button{color:inherit}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--color-accent);color:#00150d}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 24;
  vertical-align:middle
}
.wrap{display:flex;min-height:100vh;align-items:stretch}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:0 0 264px;
  flex-direction:column;
  width:264px;
  height:100vh;
  padding:0;
  gap:0;
  overflow:auto;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-right:4px solid var(--ink)
}
.brand{
  display:flex;
  gap:12px;
  align-items:center;
  min-height:92px;
  padding:18px 16px;
  margin:0;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border-bottom:4px solid var(--ink)
}
.brand .logo{
  display:flex;
  flex:0 0 46px;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  background:var(--ink);
  color:#fff;
  border:2px solid var(--ink);
  border-radius:0
}
.brand .logo .material-symbols-outlined{font-size:27px}
.brand b{
  display:block;
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.25
}
.brand span:not(.material-symbols-outlined){display:block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#nav{display:flex;flex-direction:column}
.navbtn{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 24px;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:68px;
  padding:11px 14px;
  text-align:left;
  font:inherit;
  color:#e2e8f0;
  background:transparent;
  border:0;
  border-bottom:1px solid #64748b;
  border-radius:0;
  transition:background-color 180ms ease,color 180ms ease,transform 180ms ease
}
.navbtn .material-symbols-outlined{font-size:22px;color:#fff}
.navbtn .nt{min-width:0;overflow:hidden}
.navbtn .nt b{display:block;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.navbtn .nt small{display:block;margin-top:2px;color:#cbd5e1;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn .idx{margin-left:auto;color:#cbd5e1;font-family:"Poppins",monospace;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.navbtn:hover{background:#475569;transform:translateX(3px)}
.navbtn.on{background:#fff;color:var(--ink);box-shadow:inset 7px 0 0 var(--color-accent)}
.navbtn.on .material-symbols-outlined,.navbtn.on .nt b,.navbtn.on .nt small,.navbtn.on .idx{color:var(--ink)}
.navbtn.on .nt small{color:var(--muted)}
.side .foot{
  margin-top:auto;
  padding:16px;
  color:#e2e8f0;
  border-top:4px solid var(--ink);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.03em
}
.main{flex:1 1 auto;min-width:0;padding:28px clamp(18px,3vw,44px) 52px}
#screen{max-width:1500px;margin:0 auto}
.crumb{
  display:inline-flex;
  min-height:28px;
  align-items:center;
  margin:0 0 10px;
  padding:4px 9px;
  color:#fff;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase
}
.head{
  position:relative;
  margin:0 0 18px;
  padding:18px 20px;
  background:#fff;
  border:3px solid var(--ink)
}
.head:after{content:"";position:absolute;right:-3px;bottom:-3px;width:30%;height:7px;background:var(--color-accent);border-left:3px solid var(--ink)}
.head h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 5px;
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:clamp(21px,2.2vw,30px);
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.025em
}
.head h1 .material-symbols-outlined{display:grid;place-items:center;width:38px;height:38px;background:var(--color-accent);color:#00150d;border:2px solid var(--ink);font-size:23px}
.head p{max-width:920px;margin:0;color:var(--muted);font-size:12.5px;font-weight:500}
.g{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 #cbd5e1
}
.card{padding:16px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 3px;
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:13.5px;
  font-weight:700
}
.card h3 .material-symbols-outlined{display:grid;place-items:center;width:27px;height:27px;background:var(--color-primary);color:#fff;font-size:17px}
.card .sub{margin:2px 0 13px;color:var(--muted);font-size:11px;font-weight:500}
.kpi{position:relative;min-height:126px;padding:15px 16px;overflow:hidden}
.kpi:after{content:"";position:absolute;right:0;bottom:0;width:42px;height:9px;background:var(--color-accent);border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:700}
.kpi .lab .material-symbols-outlined{display:grid;place-items:center;width:25px;height:25px;color:#fff;background:var(--color-secondary);font-size:16px}
.kpi .val{
  margin-top:8px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:clamp(23px,2.2vw,31px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums
}
.kpi .val small{margin-left:3px;color:var(--muted);font-family:"Open Sans","Noto Sans TC",sans-serif;font-size:11px;font-weight:600;letter-spacing:0}
.kpi .delta{margin-top:7px;color:var(--muted);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--ok)!important}.down{color:var(--a)!important}
.tw{overflow-x:auto;border:1px solid var(--ink)}
table{width:100%;min-width:480px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#fff;
  background:var(--color-primary);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:uppercase
}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#d1fae5}
td:first-child,td b,.tk b,.tl .tm{font-variant-numeric:tabular-nums}
td:first-child b,.tk b,.tl .tm,.idx{font-family:"Poppins","Open Sans",monospace}
td:nth-child(3),td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  gap:4px;
  padding:2px 8px;
  color:var(--ink);
  background:#fff;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:700
}
.tA{color:#991b1b;background:#fef2f2}.tB{color:#854d0e;background:#fefce8}.tC{color:#155e75;background:#ecfeff}
.tok{color:#065f46;background:#ecfdf5}.tw2{color:#991b1b;background:#fef2f2}.tp{color:#334155;background:#f1f5f9}
.bar{height:10px;min-width:70px;overflow:hidden;background:#e2e8f0;border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-accent);border-radius:0}
.hm{display:grid;gap:4px;min-width:0;padding:8px;background:var(--ink);border:2px solid var(--ink)}
.hm .cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;min-width:0;color:#fff;border:1px solid #fff;border-radius:0;font-family:"Poppins",monospace;font-size:9px;font-weight:700;font-variant-numeric:tabular-nums}
.hm-legend{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10.5px;font-weight:600}
.dot{display:inline-block;width:13px;height:13px;margin-right:5px;vertical-align:-2px;border:1px solid var(--ink);border-radius:0}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:3px;background:var(--ink)}
.tl .it{position:relative;padding:0 0 16px 10px}
.tl .it:before{content:"";position:absolute;top:3px;left:-23px;width:13px;height:13px;background:var(--color-accent);border:2px solid var(--ink);border-radius:0}
.tl .it .tt{font-size:12px;font-weight:700}
.tl .it .td{color:var(--muted);font-size:11px}
.tl .it .tm{color:var(--color-secondary);font-size:10.5px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:8px;min-width:780px}
.col{min-width:0;padding:10px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-family:"Poppins","Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700}
.col h4 span{padding:1px 7px;color:#fff;background:var(--color-secondary);border:1px solid var(--ink);border-radius:0;font-family:"Poppins",monospace;font-size:10px;font-variant-numeric:tabular-nums}
.tk{margin-bottom:8px;padding:9px;background:#fff;border:1px solid var(--ink);border-left:6px solid var(--color-secondary);border-radius:0}
.tk:last-child{margin-bottom:0}
.tk b{display:block;font-size:11.5px;font-weight:700}
.tk small{display:block;margin-top:2px;color:var(--muted);font-size:10px;line-height:1.45}
.tk .who{margin-top:7px;padding-top:5px;color:#065f46;border-top:1px dashed #94a3b8;font-size:10px;font-weight:700}
.note{margin-top:11px;padding:9px 10px;color:#334155;background:#ecfdf5;border:1px solid #047857;border-left:6px solid var(--color-accent);font-size:10.5px;font-weight:600}
.chart{width:100%;min-height:220px;overflow:hidden}
.rowflex{display:flex;align-items:center;gap:9px;min-width:0}
.apexcharts-text,.apexcharts-legend-text{font-family:"Open Sans","Noto Sans TC",sans-serif!important;fill:var(--muted)}
.apexcharts-tooltip,.apexcharts-menu{border:2px solid var(--ink)!important;border-radius:0!important;box-shadow:none!important}
.apexcharts-xaxistooltip{border-radius:0!important}
#screen>.crumb,#screen>.head,#screen>.g,#screen>.card{animation:brutal-in 380ms cubic-bezier(.18,.89,.32,1.28) both}
#screen>.head{animation-delay:45ms}
#screen>.g{animation-delay:90ms}
#screen>.card{animation-delay:135ms}
.g>.kpi,.g>.card{animation:brutal-in 400ms cubic-bezier(.18,.89,.32,1.28) both}
.g>:nth-child(2){animation-delay:60ms}.g>:nth-child(3){animation-delay:120ms}.g>:nth-child(4){animation-delay:180ms}
@keyframes brutal-in{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(4,minmax(180px,1fr))}
}
@media(max-width:860px){
  .wrap{display:block}
  .side{position:sticky;top:0;width:100%;height:auto;overflow:visible;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{min-height:62px;padding:8px 12px;border-bottom:2px solid var(--ink)}
  .brand .logo{width:38px;height:38px;flex-basis:38px}
  #nav{display:grid;grid-template-columns:repeat(6,1fr);overflow-x:auto}
  .navbtn{display:flex;justify-content:center;min-width:54px;min-height:48px;padding:8px;border-right:1px solid #64748b;border-bottom:0}
  .navbtn:hover{transform:none}
  .navbtn .nt,.navbtn .idx{display:none}
  .navbtn.on{box-shadow:inset 0 -6px 0 var(--color-accent)}
  .side .foot{display:none}
  .main{padding:18px 14px 40px}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .g3,.g2{grid-template-columns:1fr}
  .head{padding:15px}
  .head h1{font-size:21px}
  .card,.kpi{box-shadow:3px 3px 0 #cbd5e1}
}
@media(max-width:560px){
  body{background-size:24px 24px;font-size:13px}
  .brand b{font-size:13px}.brand span:not(.material-symbols-outlined){font-size:9px}
  .g4{grid-template-columns:1fr}
  .kpi{min-height:108px}
  .head h1{align-items:flex-start}
  .head p{font-size:11.5px}
  .hm{gap:2px;padding:4px}
  .hm .cell{font-size:7px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">warehouse</span></div>
      <div><b>倉儲空間規劃</b><span>Warehouse Slotting</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>WMS 倉儲管理系統</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"出入庫數據分析",desc:"揀取頻率與週轉率量化"},
  {icon:"account_tree",name:"ABC 速度分類",desc:"依動銷分 A/B/C 熱區"},
  {icon:"dashboard",name:"儲位佈局模擬",desc:"倉區熱力圖與庫容"},
  {icon:"trending_up",name:"揀貨動線分析",desc:"行走距離與共揀關聯"},
  {icon:"task_alt",name:"儲位指派執行",desc:"移位工單與看板"},
  {icon:"insights",name:"坪效效益追蹤",desc:"利用率坪效前後對比"}
];

function el(id){return document.getElementById(id);}
var _charts={};
function killCharts(){for(var k in _charts){try{_charts[k].destroy();}catch(e){}}_charts={};}
function mkChart(id,opt){
  var node=el(id); if(!node)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Open Sans,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(node,opt);c.render();_charts[id]=c;}catch(e){}
}

(function(){
  var n=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')">'
      +'<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'
      +'<span class="nt"><b>'+MODS[i].name+'</b><small>'+MODS[i].desc+'</small></span>'
      +'<span class="idx">0'+(i+1)+'</span></button>';
  }
  n.innerHTML=h;
})();

function kpi(icon,lab,val,delta,dir){
  var d=delta?('<div class="delta '+(dir||'')+'">'+delta+'</div>'):'';
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'
    +'<div class="val">'+val+'</div>'+d+'</div>';
}

/* ===== SCREEN 0 ===== */
function scr0(){
  var rows=[
    {sku:"SKU-A1042",name:"精密軸承 6204",pick:1820,out:9600,turn:14.2,cls:"A"},
    {sku:"SKU-A1088",name:"齒輪箱總成",pick:1540,out:7200,turn:11.8,cls:"A"},
    {sku:"SKU-B2210",name:"液壓油封套件",pick:960,out:4100,turn:6.4,cls:"B"},
    {sku:"SKU-B2377",name:"皮帶輪 D125",pick:720,out:3300,turn:5.1,cls:"B"},
    {sku:"SKU-C3055",name:"備用螺栓組",pick:210,out:880,turn:1.6,cls:"C"},
    {sku:"SKU-C3190",name:"維修工具箱",pick:96,out:340,turn:0.8,cls:"C"}
  ];
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td><b>'+r.sku+'</b></td><td>'+r.name+'</td><td>'+r.pick.toLocaleString()+'</td><td>'
      +r.out.toLocaleString()+'</td><td>'+r.turn.toFixed(1)+'</td>'
      +'<td><span class="tag t'+r.cls+'">'+r.cls+' 級</span></td></tr>';
  }
  return '<div class="crumb">模組 01 · 規劃依據</div>'
    +'<div class="head"><h1><span class="material-symbols-outlined">monitoring</span>出入庫數據分析</h1>'
    +'<p>彙整近 90 日揀取頻率、出貨量與週轉率，找出高動銷與呆滯品項，作為儲位規劃的量化基礎。</p></div>'
    +'<div class="g g4">'
    +kpi("inventory_2","分析品項數","4,286","+312 本月","up")
    +kpi("bolt","日均揀取次數","18,940","+6.4%","up")
    +kpi("cached","平均庫存週轉","8.7 <small>次/月</small>","","")
    +kpi("hourglass_bottom","呆滯品項占比","11.2 <small>%</small>","","")
    +'</div>'
    +'<div class="g g23" style="margin-top:14px;">'
    +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近 12 週出入庫量趨勢</h3>'
    +'<p class="sub">入庫 vs 出庫 · 單位：棧板 PLT</p><div id="c0a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>揀取量占比</h3>'
    +'<p class="sub">80/20 法則觀察</p><div id="c0b" class="chart"></div></div>'

    +'<tr><td>B 區（中速動銷）</td><td>58%</td><td><b>79%</b></td><td>3.4</td><td><span class="tag tok">達標</span></td></tr>'

}

var SCR=[scr0,scr1,scr2,scr3,scr4,scr5];
var CHT=[scr0charts,scr1charts,scr2charts,scr3charts,scr4charts,scr5charts];
function show(i){
  killCharts();
  var c=el("screen");
  c.innerHTML=SCR[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  void c.offsetHeight;
  CHT[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
