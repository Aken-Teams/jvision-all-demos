<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>專案負荷分析儀</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#ede9fe;
  --bg:#f5f3fb; --card:#ffffff; --ink:#1e1b2e; --muted:#6b7280; --line:#ece9f5;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
  --shadow:0 1px 2px rgba(30,27,46,.05),0 8px 24px rgba(109,40,217,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  font-size:20px;line-height:1;letter-spacing:normal;vertical-align:middle;display:inline-block}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#4c1d95,#6d28d9 55%,#7c3aed);
  color:#fff;box-shadow:0 4px 18px rgba(76,29,149,.28)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.75;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer;
  border:0;background:rgba(255,255,255,.08);color:#fff;padding:8px 13px;border-radius:10px;
  font-family:inherit;font-size:13.5px;font-weight:600;transition:.16s;opacity:.86}
.nav button:hover{background:rgba(255,255,255,.2);opacity:1}
.nav button.on{background:#fff;color:var(--accent);opacity:1;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.nav button .material-symbols-outlined{font-size:19px}
.topmeta{display:flex;align-items:center;gap:9px;flex:none}
.topmeta .who{text-align:right;line-height:1.2}
.topmeta .who b{font-size:13px;display:block}
.topmeta .who span{font-size:11px;opacity:.75}
.topmeta .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

.wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.screen-head .title{display:flex;align-items:center;gap:12px;min-width:0}
.screen-head .title .ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.screen-head .title .ic .material-symbols-outlined{font-size:26px}
.screen-head h2{margin:0;font-size:21px;font-weight:800}
.screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card-h .sub{font-size:12px;color:var(--muted)}

.grid{display:grid;gap:14px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-kanban{grid-template-columns:repeat(4,1fr)}
.g-b6040{grid-template-columns:1.5fr 1fr}
.g-b7030{grid-template-columns:2fr 1fr}
.g-b3070{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr}
  .g-2,.g-3,.g-kanban,.g-b6040,.g-b7030,.g-b3070{grid-template-columns:1fr}
}
@media(max-width:430px){ .g-kpi{grid-template-columns:1fr} }
.grid>*{min-width:0}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .dt{font-size:11.5px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.kpi .dt.up{color:var(--bad)} .kpi .dt.down{color:var(--ok)}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:var(--accent-soft);opacity:.55}

.chart{width:100%;height:290px}
.chart.sm{height:230px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf9ff}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.tag.ok{background:#dcfce7;color:#15803d} .tag.warn{background:#fef3c7;color:#b45309}
.tag.bad{background:#fee2e2;color:#b91c1c} .tag.info{background:#dbeafe;color:#1d4ed8}
.tag.mute{background:#f1f0f7;color:#6b7280}
.ava{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex:none}
.who-cell{display:flex;align-items:center;gap:9px}
.who-cell b{font-size:13px} .who-cell span span{font-size:11px;color:var(--muted);display:block}

.lbar{height:8px;border-radius:5px;background:#eee9f7;overflow:hidden;position:relative;min-width:60px}
.lbar>i{display:block;height:100%;border-radius:5px}
.lbar.anim>i{animation:grow 1.1s cubic-bezier(.3,.8,.3,1) both}
@keyframes grow{from{width:0}}

.kcol{background:#f6f4fc;border:1px solid var(--line);border-radius:15px;padding:11px;min-width:0;display:flex;flex-direction:column;gap:10px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.kcol .kh b{font-size:13px;font-weight:800}
.kcol .kh .cnt{font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:0 1px 2px rgba(30,27,46,.04);border-left:4px solid var(--accent2)}
.kcard.ovr{border-left-color:var(--bad)} .kcard.hi{border-left-color:var(--warn)} .kcard.ok{border-left-color:var(--ok)}
.kcard .knm{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kcard .knm b{font-size:13px} .kcard .knm span{font-size:11px;color:var(--muted)}
.kcard .krow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:7px}
.kcard .kload{font-weight:800;font-size:13px}
.kcard .kmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:#f1f0f7;color:#5b5570;display:inline-flex;align-items:center;gap:3px}

.gantt{min-width:640px}
.gantt .grow{display:grid;grid-template-columns:130px 1fr;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}
.gantt .gname{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;padding-right:8px}
.gantt .gtrack{position:relative;height:26px;background:repeating-linear-gradient(90deg,#f6f4fc 0 calc(100%/7 - 1px),#e9e5f4 calc(100%/7 - 1px) calc(100%/7));border-radius:7px}
.gbar{position:absolute;top:4px;height:18px;border-radius:6px;color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden}
.gaxis{display:grid;grid-template-columns:130px 1fr;font-size:10.5px;color:var(--muted);padding-bottom:4px}
.gaxis .days{display:grid;grid-template-columns:repeat(7,1fr)}
.gaxis .days span{text-align:center;font-weight:600}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

.lr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr .li{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.lr .lm{flex:1;min-width:0}
.lr .lm b{font-size:13.5px} .lr .lm p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.lr .lv{text-align:right;flex:none}

.simrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.simrow:last-child{border-bottom:0}
.simrow .arw{color:var(--accent);font-weight:800}
.mini-stat{display:flex;flex-direction:column;gap:2px;background:#f6f4fc;border-radius:12px;padding:12px 14px;min-width:0}
.mini-stat b{font-size:21px;font-weight:800}
.mini-stat span{font-size:11.5px;color:var(--muted);font-weight:600}

.uwrap{display:flex;align-items:center;gap:9px}
.uwrap b{font-size:13px;min-width:42px}

.note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:12px}
.note .material-symbols-outlined{font-size:16px;color:var(--accent2)}

@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:8px 10px}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">balance</span></div>
      <div><h1>專案負荷分析儀</h1><small>Project Workload Analyzer</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="topmeta">
      <div class="who"><b>林詠晴</b><span>部門經理</span></div>
      <div class="av">林</div>
    </div>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>

<script>
"use strict";
var C={accent:"#6d28d9",accent2:"#8b5cf6",ok:"#16a34a",warn:"#f59e0b",bad:"#dc2626",info:"#2563eb",muted:"#6b7280"};
var _charts=[];

function avColor(n){var p=["#6d28d9","#8b5cf6","#2563eb","#0891b2","#db2777","#ea580c","#16a34a","#4f46e5"];var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return p[h%p.length];}
function loadColor(v){return v>100?C.bad:v>=85?C.warn:v>=55?C.ok:C.info;}

var MODULES=[
 {icon:"view_week",name:"負荷看板",desc:"成員負荷狀態與過載預警"},
 {icon:"groups",name:"產能配置",desc:"可用工時與投入配比"},
 {icon:"calendar_month",name:"資源排程",desc:"任務時間軸與衝突偵測"},
 {icon:"balance",name:"負荷平衡",desc:"過載轉移與再分派模擬"},
 {icon:"warning",name:"風險預警",desc:"過載與延誤風險排序"},
 {icon:"analytics",name:"負荷分析",desc:"利用率趨勢與部門比較"}
];

var MEMBERS=[
 {n:"陳冠宇",r:"前端工程師",team:"產品開發",avail:40,load:132,tasks:6,over:12.8,due:2},
 {n:"王思婷",r:"UI 設計師",team:"設計",avail:40,load:118,tasks:5,over:7.2,due:1},
 {n:"李孟樺",r:"後端工程師",team:"產品開發",avail:40,load:104,tasks:5,over:1.6,due:1},
 {n:"張哲維",r:"資料工程師",team:"數據",avail:40,load:96,tasks:4,over:0,due:0},
 {n:"黃品瑄",r:"QA 測試",team:"品質",avail:40,load:88,tasks:4,over:0,due:0},
 {n:"吳承翰",r:"專案助理",team:"專案管理",avail:40,load:72,tasks:3,over:0,due:0},
 {n:"劉子瑜",r:"行銷企劃",team:"行銷",avail:40,load:58,tasks:3,over:0,due:0},
 {n:"周彥廷",r:"後端工程師",team:"產品開發",avail:40,load:46,tasks:2,over:0,due:0}
];

function kpiCard(lab,ic,val,unit,dt,dir){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    (dt?'<div class="dt '+dir+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+dt+'</div>':'')+'</div>';
}
function recRow(ic,col,t,d){
  return '<div class="lr"><div class="li" style="background:'+col+'22;color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lm"><b>'+t+'</b><p>'+d+'</p></div></div>';
}
function headBlock(i,desc,pill){
  var m=MODULES[i];
  return '<div class="screen-head"><div class="title"><div class="ic"><span class="material-symbols-outlined">'+m.icon+'</span></div>'+
    '<div><h2>'+m.name+'</h2><p>'+desc+'</p></div></div>'+
    '<span class="pill"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+pill+'</span></div>';
}

/* ===== SCREEN 0 : 負荷看板 (signature kanban) ===== */
function scr0(){
  var cols=[
   {t:"閒置 (<55%)",f:function(m){return m.load<55;}},
   {t:"合理 (55–84%)",f:function(m){return m.load>=55&&m.load<85;}},
   {t:"偏高 (85–100%)",f:function(m){return m.load>=85&&m.load<=100;}},
   {t:"過載 (>100%)",f:function(m){return m.load>100;}}
  ];
  var html=headBlock(0,'即時彙整各成員當週負荷比，過載者自動置於右欄並標記轉移建議','當週 W32 · 8 名成員')+
  '<div class="grid g-kpi" style="margin-bottom:14px">'+
    kpiCard("團隊平均負荷","speed","89.3","%","+6.1% vs 上週","up")+
    kpiCard("過載成員","warning","2","人","2 人待再分派","up")+
    kpiCard("可釋放工時","schedule","34","h","來自 3 名閒置者","down")+
    kpiCard("尖峰衝突日","event_busy","W32 週三","","3 人同時到期","up")+
  '</div><div class="grid g-kanban" style="margin-bottom:14px">';
  cols.forEach(function(col){
    var list=MEMBERS.filter(col.f);
    html+='<div class="kcol"><div class="kh"><b>'+col.t+'</b><span class="cnt">'+list.length+'</span></div>';
    list.forEach(function(m){
      var kc=m.load>100?"ovr":m.load>=85?"hi":"ok";
      html+='<div class="kcard '+kc+'">'+
        '<div class="knm"><span class="ava" style="background:'+avColor(m.n)+'">'+m.n.slice(0,1)+'</span>'+
          '<div style="min-width:0"><b>'+m.n+'</b><br><span>'+m.r+' · '+m.team+'</span></div></div>'+
        '<div class="lbar anim"><i style="width:'+Math.min(m.load,140)/1.4+'%;background:'+loadColor(m.load)+'"></i></div>'+
        '<div class="krow"><span>負荷比</span><span class="kload" style="color:'+loadColor(m.load)+'">'+m.load+'%</span></div>'+
        '<div class="kmeta"><span class="chip"><span class="material-symbols-outlined" style="font-size:13px">task_alt</span>'+m.tasks+' 任務</span>'+
          (m.over>0?'<span class="chip" style="background:#fee2e2;color:#b91c1c">超出 '+m.over+'h</span>':'')+
          (m.due>0?'<span class="chip" style="background:#fef3c7;color:#b45309">近期到期 '+m.due+'</span>':'')+'</div></div>';
    });
    html+='</div>';
  });
  html+='</div><div class="grid g-b6040">'+
    '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各成員負荷組成</h3><span class="sub">已排入 / 剩餘 (h)</span></div><div class="pad"><div id="ch0" class="chart"></div></div></div>'+
    '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">tips_and_updates</span>系統建議</h3></div><div class="pad">'+
      recRow("swap_horiz",C.bad,"陳冠宇 132% 過載","建議轉移「行動版報表」2 項任務予周彥廷（46%）")+
      recRow("swap_horiz",C.warn,"王思婷 118% 偏高","可將圖示切版釋出 6h 予閒置設計資源")+
      recRow("check_circle",C.ok,"李孟樺 104% 微幅","本週僅超出 1.6h，維持觀察不調整")+
      recRow("beach_access",C.info,"3 名成員閒置","劉子瑜 / 周彥廷合計 34h 可承接過載任務")+
    '</div></div></div>';
  return html;
}
function chart0(el){
  var c=echarts.init(el);
  c.setOption({
    grid:{left:44,right:14,top:28,bottom:52},
    legend:{data:["已排入工時","剩餘可用"],top:0,textStyle:{fontSize:11}},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    xAxis:{type:"category",data:MEMBERS.map(function(m){return m.n;}),axisLabel:{rotate:35,fontSize:10}},
    yAxis:{type:"value",name:"小時",axisLabel:{fontSize:10}},
    series:[
      {name:"已排入工時",type:"bar",stack:"a",data:MEMBERS.map(function(m){return +(m.avail*m.load/100).toFixed(1);}),
        itemStyle:{color:function(p){return loadColor(MEMBERS[p.dataIndex].load);}}},
      {name:"剩餘可用",type:"bar",stack:"a",data:MEMBERS.map(function(m){return Math.max(0,+(m.avail-m.avail*m.load/100).toFixed(1));}),
        itemStyle:{color:"#e9e5f4",borderRadius:[4,4,0,0]}}
    ]
  });
  return c;
}

/* ===== SCREEN 1 : 產能配置 ===== */
function scr1(){
  var teams=[
   {t:"產品開發",cap:160,used:151,head:4,color:"#6d28d9"},
   {t:"設計",cap:80,used:71,head:2,color:"#8b5cf6"},
   {t:"數據",cap:80,used:62,head:2,color:"#2563eb"},
   {t:"品質",cap:40,used:35,head:1,color:"#0891b2"},
   {t:"行銷",cap:40,used:23,head:1,color:"#db2777"},
   {t:"專案管理",cap:40,used:29,head:1,color:"#ea580c"}
  ];
  var alloc=[
   {p:"客戶入口改版",plan:96,actual:108,skill:"前端 / UI"},
   {p:"資料倉儲遷移",plan:80,actual:74,skill:"後端 / 資料"},

    var ti={up:["trending_up",C.bad],flat:["trending_flat",C.muted],down:["trending_down",C.ok]}[x.tr];
    html+='<tr><td><b>'+x.d+'</b></td>'+
      '<td><div class="uwrap"><b>'+x.u+'%</b><div class="lbar anim" style="flex:1"><i style="width:'+x.u+'%;background:'+loadColor(x.u)+'"></i></div></div></td>'+
      '<td>'+x.od+' 天</td><td>'+x.dev+'</td>'+
      '<td><span class="material-symbols-outlined" style="color:'+ti[1]+'">'+ti[0]+'</span></td>'+
      '<td><span class="tag '+x.tg+'">'+x.c+'</span></td></tr>';
  });
  html+='</tbody></table></div></div>';
  html+='<div class="note"><span class="material-symbols-outlined">lightbulb</span>產品開發連續 4 週利用率 &gt;95%，系統建議下季新增 1–2 名工程人力或將部分任務外包。</div>';
  return html;
}

/* ===== nav + show ===== */
var RENDER=[scr0,scr1,scr2,scr3,scr4,scr5];
var CHARTMAP={
  0:[["ch0",chart0]],1:[["ch1",chart1]],2:[["ch2",chart2]],3:[["ch3",chart3]],4:[["ch4",chart4]],
  5:[["ch5a",chart5a],["ch5b",chart5b]]
};

(function buildNav(){
  var nav=document.getElementById("nav");
  MODULES.forEach(function(m,i){
    var b=document.createElement("button");
    b.setAttribute("data-i",i);
    b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span>';
    b.addEventListener("click",function(){show(i);});
    nav.appendChild(b);
  });
})();

function show(i){
  var container=document.getElementById("app");
  _charts.forEach(function(c){try{c.dispose();}catch(e){}});
  _charts=[];
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  (CHARTMAP[i]||[]).forEach(function(pair){
    var el=document.getElementById(pair[0]);
    if(el){try{var c=pair[1](el);_charts.push(c);}catch(e){}}
  });
}
window.addEventListener("resize",function(){_charts.forEach(function(c){try{c.resize();}catch(e){}});});

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
