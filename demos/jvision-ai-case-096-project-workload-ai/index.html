<style>
:root{

*{box-sizing:border-box}

body{margin:0;background-color:var(--color-background);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px;background-attachment:fixed}

.screen-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:20px;border-bottom:4px solid var(--black);padding-bottom:14px}
.title{display:flex;gap:13px;align-items:center}.title .ic{width:54px;height:54px;display:grid;place-items:center;background:var(--color-primary);color:#002A26;border:3px solid var(--black);box-shadow:6px 6px 0 var(--color-accent)}

.pill{padding:8px 10px;background:#fff;color:var(--black);box-shadow:4px 4px 0 var(--color-primary)}
.tag{padding:3px 7px}.chip{padding:3px 6px;background:var(--color-muted);color:var(--black)}
.ok{color:var(--ok);background:#D1FAE5}.warn{color:#92400E;background:#FEF3C7}.bad{color:#991B1B;background:#FEE2E2}.info{color:#075985;background:#E0F2FE}.mute{color:#334155;background:#E2E8F0}
.grid{display:grid;gap:16px}.g-kpi{grid-template-columns:repeat(4,1fr)}.g-2{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:repeat(3,1fr)}.g-4{grid-template-columns:repeat(4,1fr)}.g-6040{grid-template-columns:3fr 2fr}.g-7030{grid-template-columns:2fr 1fr}
.card,.kpi,.kcol{background:var(--color-card);border:3px solid var(--black);box-shadow:7px 7px 0 var(--color-primary)}
.card{min-width:0}.pad{padding:18px}.card-h{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:3px solid var(--black);background:var(--color-muted)}
.card-h h3{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--black)}.sub{font-size:11px;color:var(--muted)}
.kpi{position:relative;padding:16px;min-height:142px;overflow:hidden}
.kpi:nth-child(even){transform:translateY(8px);box-shadow:7px 7px 0 var(--color-accent)}
.kpi:after{content:"";position:absolute;right:-12px;top:-12px;width:52px;height:52px;background:var(--color-secondary);border:3px solid var(--black);transform:rotate(12deg)}
.kpi .lab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.kpi .val{margin-top:13px;color:var(--black);font-size:30px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12px;color:var(--muted);letter-spacing:0}.dt{margin-top:7px;font-size:11px;font-weight:700}.up{color:var(--bad)}.down{color:var(--ok)}
.chart{height:290px}.chart.sm{height:235px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px;font-size:12px}
th{padding:12px;text-align:left;background:var(--black);color:#fff;border-right:1px solid #64748B;font-size:10px;letter-spacing:.07em;white-space:nowrap}
td{padding:12px;border-bottom:2px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#F0FDFA}tbody tr:hover{background:#CCFBF1}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.num{text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.kcol{padding:10px;background:var(--color-muted);box-shadow:5px 5px 0 var(--black)}
.kh{display:flex;justify-content:space-between;gap:8px;padding:4px 3px 11px;font-size:12px;color:var(--black)}
.cnt{background:#fff;border:2px solid var(--black);padding:1px 7px}
.kcard{background:#fff;border:2px solid var(--black);border-left:8px solid var(--color-primary);padding:11px;margin-top:9px}.kcard.ovr{border-left-color:var(--bad)}.kcard.hi{border-left-color:var(--warn)}
.knm,.who-cell{display:flex;align-items:center;gap:9px}.knm b,.who-cell b{font-size:12px}.knm small,.who-cell small{display:block;color:var(--muted);font-size:10px}
.krow{display:flex;justify-content:space-between;margin-top:7px;font-size:11px}.kload{font-family:ui-monospace,monospace;font-weight:800}
.kmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lbar{height:10px;background:#CBD5E1;border:2px solid var(--black);overflow:hidden}.lbar i{display:block;height:100%;background:var(--color-primary);animation:grow .5s ease-out both}
.lr{display:grid;grid-template-columns:40px 1fr;gap:11px;padding:12px 0;border-bottom:2px solid var(--line)}.lr:last-child{border:0}.li{width:38px;height:38px;display:grid;place-items:center;border:2px solid currentColor}.lm b{font-size:12px}.lm p{margin:4px 0 0;color:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}.legend b{display:flex;align-items:center;gap:5px}.dot{width:11px;height:11px;border:2px solid var(--black)}
.gantt{min-width:680px}.gaxis,.grow{display:grid;grid-template-columns:125px 1fr}.gaxis{font-size:10px;color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,1fr)}.days span{text-align:center}.grow{align-items:center;padding:9px 0;border-bottom:2px solid var(--line)}.gname{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800}.gtrack{position:relative;height:30px;background:repeating-linear-gradient(90deg,#fff 0 calc(14.285% - 2px),var(--line) calc(14.285% - 2px) 14.285%);border:2px solid var(--black)}.gbar{position:absolute;top:3px;height:20px;display:flex;align-items:center;padding:0 5px;color:#fff;border:1px solid var(--black);font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden}
.simrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}.simrow:last-child{border:0}.simrow .main{flex:1;min-width:0;font-size:11px}.simrow .main b{font-size:12px}.simrow .result{text-align:right;font-family:ui-monospace,monospace;font-size:11px}.simrow .result b{color:var(--color-primary);font-size:14px}
.mini-stat{padding:14px;background:var(--color-muted);border:2px solid var(--black)}.mini-stat span{display:block;font-size:10px;color:var(--muted)}.mini-stat b{display:block;margin-top:6px;font-size:20px;color:var(--black);font-variant-numeric:tabular-nums}
.rule{border:2px solid var(--black);border-left:8px solid var(--color-primary);padding:13px;background:#fff}.rule code{font-family:ui-monospace,monospace;color:var(--color-primary);font-weight:800}.rule b{display:block;margin-top:5px;font-size:12px}.rule p{margin:5px 0 0;color:var(--muted);font-size:11px}
.note{display:flex;align-items:center;gap:7px;margin-top:14px;padding:10px 12px;border:2px solid var(--black);background:#fff;font-size:11px;color:var(--muted)}
.status-text{font-weight:800}
@keyframes grow{from{width:0!important}}@keyframes reveal{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.screen,.lbar i{animation:none!important}}
@media(max-width:1050px){.topbar-inner{grid-template-columns:1fr auto}.nav{grid-column:1/-1;grid-row:2}.g-kpi,.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.wrap{padding:22px 14px 50px}.g-2,.g-3,.g-6040,.g-7030{grid-template-columns:1fr}.screen-head{grid-template-columns:1fr}.title .ic{width:46px;height:46px}.topmeta{display:none}.topbar-inner{display:block;padding:10px 12px}.nav{margin-top:10px}.brand{padding-left:3px}.kpi:nth-child(even){transform:none}}
@media(max-width:430px){.g-kpi,.g-4{grid-template-columns:1fr}.nav button{min-width:45px;justify-content:center}.nav .txt{display:none}.screen-head h2{font-size:29px}.chart{height:250px}}
</style>
</head>
<body>

<script>
"use strict";
var C={accent:"#0D9488",accent2:"#14B8A6",ok:"#047857",warn:"#B45309",bad:"#DC2626",info:"#0369A1",muted:"#475569",ink:"#134E4A",line:"#99F6E4"};
var _charts=[];

function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+(ICONS[n]||ICONS.info)+'</span>'}
document.querySelectorAll("[data-icon]").forEach(function(x){x.innerHTML=ICONS[x.dataset.icon]});
var MODULES=[
{icon:"view_week",name:"負荷看板",desc:"成員負荷狀態與過載預警"},
{icon:"groups",name:"產能配置",desc:"可用工時與投入配比"},

{icon:"balance",name:"負荷平衡",desc:"過載轉移與再分派模擬"},

];

{n:"黃品瑄",r:"QA 測試",team:"品質",load:88,tasks:4,over:0,due:0},
{n:"吳承翰",r:"專案助理",team:"專案管理",load:72,tasks:3,over:0,due:0},

{n:"周彥廷",r:"後端工程師",team:"產品開發",load:46,tasks:2,over:0,due:0}
];
function avColor(n){var p=["#0D9488","#EA580C","#0369A1","#7C3AED","#BE123C","#047857"];var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return p[h%p.length]}

function loadState(v){return v>100?"過載":v>=85?"偏高":v>=55?"合理":"閒置"}
function head(i,pill){var m=MODULES[i];return '<div class="screen-head"><div class="title"><div class="ic">'+icon(m.icon)+'</div><div><h2>'+m.name+'</h2><p>'+m.desc+'</p></div></div><span class="pill">'+icon("bolt")+pill+'</span></div>'}
function kpi(lab,ic,val,unit,detail,dir){return '<div class="kpi"><div class="lab">'+icon(ic)+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dt '+dir+'">'+detail+'</div></div>'}

function chartCard(id,title,sub,sm){return '<div class="card"><div class="card-h"><h3>'+icon("chart")+title+'</h3><span class="sub">'+sub+'</span></div><div class="pad"><div id="'+id+'" class="chart '+(sm?"sm":"")+'"></div></div></div>'}
function scr0(){
var cols=[["閒置 (<55%)",function(m){return m.load<55}],["合理 (55–84%)",function(m){return m.load>=55&&m.load<85}],["偏高 (85–100%)",function(m){return m.load>=85&&m.load<=100}],["過載 (>100%)",function(m){return m.load>100}]];
var h=head(0,"當週 W32 · 8 名成員")+'<div class="grid g-kpi">'+kpi("團隊平均負荷","speed","89.3","%","+6.1% vs 上週","up")+kpi("過載成員","warning","2","人","2 人待再分派","up")+kpi("可釋放工時","schedule","34","h","來自 3 名閒置者","down")+kpi("尖峰衝突日","event_busy","W32 週三","","3 人同時到期","up")+'</div><div class="grid g-4" style="margin-top:24px">';
cols.forEach(function(c){var list=MEMBERS.filter(c[1]);h+='<section class="kcol"><div class="kh"><b>'+c[0]+'</b><span class="cnt">'+list.length+'</span></div>';list.forEach(function(m){h+='<article class="kcard '+(m.load>100?"ovr":m.load>=85?"hi":"")+'"><div class="knm"><span class="ava" style="background:'+avColor(m.n)+'">'+m.n[0]+'</span><div><b>'+m.n+'</b><small>'+m.r+' · '+m.team+'</small></div></div><div class="lbar" aria-label="'+loadState(m.load)+' '+m.load+'%"><i style="width:'+Math.min(m.load,100)+'%;background:'+loadColor(m.load)+'"></i></div><div class="krow"><span class="status-text">'+loadState(m.load)+'</span><span class="kload" style="color:'+loadColor(m.load)+'">'+m.load+'%</span></div><div class="kmeta"><span class="chip">'+icon("task")+m.tasks+' 任務</span>'+(m.over?'<span class="tag bad">過載 · 超出 '+m.over+'h</span>':'')+(m.due?'<span class="tag warn">注意 · 近期到期 '+m.due+'</span>':'')+'</div></article>'});h+='</section>'});
return h+'</div><div class="grid g-6040" style="margin-top:24px">'+chartCard("ch0","各成員負荷組成","已排入 / 剩餘 (h)")+'<div class="card"><div class="card-h"><h3>'+icon("bolt")+'系統建議</h3></div><div class="pad">'+rec("swap","bad","過載 · 陳冠宇 132%","建議轉移「行動版報表」2 項任務予周彥廷（46%）")+rec("swap","warn","偏高 · 王思婷 118%","可將圖示切版釋出 6h 予閒置設計資源")+rec("check","ok","觀察 · 李孟樺 104%","本週僅超出 1.6h，維持觀察不調整")+rec("info","info","可承接 · 3 名成員閒置","劉子瑜 / 周彥廷合計 34h 可承接過載任務")+'</div></div></div>'
}
