<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>應收帳款催收管理系統（Collections Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="逾期帳款自動分級、催收任務排程分派、溝通紀錄與回收成效追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#dc2626;--accent2:#f97316;--ink:#1f2430;--muted:#6b7280;
      --line:#e9ebf0;--bg:#f4f5f8;--card:#ffffff;
      --side:#161a23;--sideln:#2a303c;--sidemut:#8b93a4;
      --ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .layout{display:flex;min-height:100vh;align-items:stretch;}
    /* sidebar */
    .side{width:246px;flex:0 0 246px;background:var(--side);color:#eef1f6;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0;}
    .brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--sideln);margin-bottom:14px;}
    .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;}
    .brand .logo .ms{font-size:23px;}
    .brand b{font-size:15px;font-weight:800;letter-spacing:.2px;display:block;}
    .brand span{font-size:11px;color:var(--sidemut);}
    .nav{display:flex;flex-direction:column;gap:4px;flex-wrap:wrap;}
    .navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c7cdd8;cursor:pointer;border:none;background:transparent;font:inherit;text-align:left;width:100%;min-width:0;transition:.15s;}
    .navbtn .ms{font-size:21px;flex:0 0 auto;}
    .navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .navbtn .nt small{display:block;font-size:10.5px;color:var(--sidemut);font-weight:400;}
    .navbtn .nt b{font-size:13.5px;font-weight:600;}
    .navbtn:hover{background:#222835;color:#fff;}
    .navbtn.on{background:linear-gradient(135deg,rgba(220,38,38,.22),rgba(249,115,22,.16));color:#fff;box-shadow:inset 0 0 0 1px rgba(249,115,22,.32);}
    .navbtn.on .ms{color:var(--accent2);}
    .sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--sideln);font-size:11px;color:var(--sidemut);line-height:1.6;}
    .sidefoot .u{display:flex;align-items:center;gap:9px;color:#dfe3ea;font-size:12.5px;margin-bottom:7px;}
    .sidefoot .u .av{width:29px;height:29px;border-radius:50%;background:#333b49;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#ffd;flex:0 0 29px;}
    /* main */
    .main{flex:1 1 auto;min-width:0;padding:22px 26px 60px;}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
    .top h1{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:.2px;}
    .top .sub{color:var(--muted);font-size:13px;margin:0;}
    .top .badge{display:inline-flex;align-items:center;gap:6px;background:#fef2f2;color:var(--accent);border:1px solid #fbd0d0;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;}
    .top .badge .ms{font-size:15px;}
    .chips{display:flex;gap:8px;flex-wrap:wrap;}
    .chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;color:#374151;display:flex;align-items:center;gap:7px;min-width:0;}
    .chip .ms{font-size:16px;color:var(--accent2);}
    .chip b{color:var(--ink);}
    /* generic cards */
    .grid{display:grid;gap:14px;min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g21{grid-template-columns:1.6fr 1fr;}
    .g12{grid-template-columns:1fr 1.8fr;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;box-shadow:0 1px 2px rgba(20,20,40,.03);}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .card h3 .ms{font-size:18px;color:var(--accent);}
    .card .ch-sub{color:var(--muted);font-size:11.5px;margin:0 0 12px;}
    .kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:9px;}
    .kpi .lab .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fef2f2;color:var(--accent);flex:0 0 32px;}
    .kpi .lab .ic .ms{font-size:18px;}
    .kpi .val{font-size:26px;font-weight:800;letter-spacing:.3px;line-height:1;}
    .kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px;}
    .kpi .dl{margin-top:9px;font-size:11.5px;display:flex;align-items:center;gap:5px;font-weight:600;}
    .kpi .dl.up{color:var(--bad);}.kpi .dl.down{color:var(--ok);}
    .kpi .dl .ms{font-size:15px;}
    .chart{width:100%;height:260px;overflow:hidden;min-width:0;}
    .chart.sm{height:210px;}
    .chart.lg{height:300px;}
    /* table */
    .tblwrap{overflow-x:auto;border-radius:10px;min-width:0;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
    th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.3px;padding:9px 11px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;}
    td{padding:10px 11px;border-bottom:1px solid #f1f2f5;white-space:nowrap;}
    tbody tr:hover{background:#fcfcfd;}
    .money{font-variant-numeric:tabular-nums;font-weight:700;}
    .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
    .pill .ms{font-size:13px;}
    .p-m1{background:#ecfdf5;color:#059669;}
    .p-m2{background:#fffbeb;color:#b45309;}
    .p-m3{background:#fef2f2;color:#dc2626;}
    .p-legal{background:#faf5ff;color:#7c3aed;}
    .p-ok{background:#ecfdf5;color:#059669;}
    .p-wait{background:#f1f5f9;color:#475569;}
    .p-hot{background:#fff1e6;color:#ea580c;}
    .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:7px;vertical-align:middle;}
    .bar{height:7px;border-radius:6px;background:#eef0f4;overflow:hidden;min-width:60px;}
    .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
    .col{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
    .col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px;}
    .col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
    .col .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
    .tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,20,40,.03);}
    .tk .tn{font-size:12.5px;font-weight:700;margin-bottom:3px;}
    .tk .tm{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .tk .amt{font-size:13px;font-weight:800;color:var(--accent);}
    .tk .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed #eceef2;}
    /* timeline */
    .tl{position:relative;padding-left:8px;}
    .tl .it{position:relative;padding:0 0 16px 26px;border-left:2px solid var(--line);margin-left:8px;}
    .tl .it:last-child{border-left-color:transparent;padding-bottom:0;}
    .tl .it .nd{position:absolute;left:-9px;top:1px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;}
    .tl .it .nd.o{border-color:var(--accent2);}
    .tl .it .nd .ms{font-size:11px;color:var(--accent);}
    .tl .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:2px;flex-wrap:wrap;}
    .tl .tm2{font-size:11px;color:var(--muted);}
    .tl .bd{font-size:12px;color:#4b5563;margin-top:3px;line-height:1.55;}
    .chan{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;}
    .chan .ms{font-size:14px;}
    .c-call{background:#eef2ff;color:#4f46e5;}.c-mail{background:#ecfeff;color:#0891b2;}.c-letter{background:#fef3c7;color:#b45309;}.c-sms{background:#f0fdf4;color:#16a34a;}
    /* misc */
    .row{display:flex;align-items:center;gap:9px;min-width:0;}
    .between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .mut{color:var(--muted);font-size:12px;}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
    .stat-strip{display:flex;gap:10px;flex-wrap:wrap;}
    .mini{flex:1 1 120px;min-width:0;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
    .mini .l{font-size:11px;color:var(--muted);margin-bottom:5px;}
    .mini .v{font-size:18px;font-weight:800;}
    .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#374151;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;}
    .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;}
    .btn .ms{font-size:16px;}
    .gauge-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .promise{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f2f5;}
    .promise:last-child{border-bottom:none;}
    .promise .dt{width:52px;text-align:center;flex:0 0 52px;}
    .promise .dt b{display:block;font-size:16px;font-weight:800;line-height:1;}
    .promise .dt small{font-size:10px;color:var(--muted);}
    .promise .body{flex:1 1 auto;min-width:0;}
    .promise .body .n{font-size:12.5px;font-weight:700;}
    .promise .body .s{font-size:11px;color:var(--muted);}
    .heat{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px;font-size:11px;min-width:340px;}
    .heat .hc{border-radius:5px;padding:8px 4px;text-align:center;color:#fff;font-weight:700;font-variant-numeric:tabular-nums;}
    .heat .hl{padding:8px 6px;color:var(--muted);display:flex;align-items:center;font-weight:600;}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
    .seg button{border:none;background:transparent;padding:7px 13px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600;}
    .seg button.on{background:var(--accent);color:#fff;}
    .rule-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 13px;font-size:12px;color:#9a3412;display:flex;gap:9px;align-items:flex-start;}
    .rule-box .ms{color:var(--accent2);font-size:18px;flex:0 0 auto;}
    @media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr);}.g12,.g21{grid-template-columns:1fr;}}
    @media(max-width:860px){
      .layout{display:block;}
      .side{width:auto;flex:none;position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;}
      .brand{border-bottom:none;margin:0;padding:0 8px 0 0;flex:0 0 auto;}
      .nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;gap:6px;}
      .navbtn{width:auto;flex:1 1 auto;justify-content:center;padding:9px 12px;}
      .navbtn .nt small{display:none;}
      .sidefoot{display:none;}
      .main{padding:18px 15px 50px;}
    }
    @media(max-width:820px){
      .g3,.g2,.g21,.g12{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .g4{grid-template-columns:1fr;}
      .navbtn .nt{display:none;}
      .navbtn{flex:0 0 auto;}
      .top h1{font-size:18px;}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="ms">request_quote</span></div>
        <div style="min-width:0;">
          <b>催收管家</b>
          <span>Collections MS</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidefoot">
        <div class="u"><span class="av">陳</span><div style="min-width:0;">陳彥廷<br><span style="color:var(--sidemut);font-size:10.5px;">財務經理</span></div></div>
        本季應收 NT$ 4.82 億<br>資料更新 2026/08/14 09:20
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div style="min-width:0;">
          <h1 id="scr-title">催收總覽儀表板</h1>
          <p class="sub" id="scr-sub">逾期金額、DSO 與回收率總覽</p>
        </div>
        <div class="badge"><span class="ms">verified</span> 稽核軌跡已啟用</div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var A="#dc2626",B="#f97316";
    var MODS=[
      {i:"monitoring",t:"催收總覽儀表板",s:"逾期金額、DSO 與回收率總覽"},
      {i:"rule",t:"帳齡自動分級",s:"依逾期天數與金額自動分級標記"},
      {i:"checklist",t:"催收任務排程",s:"催收任務排程與專員分派"},
      {i:"history",t:"催收溝通紀錄",s:"電話 / email / 信函往來紀錄"},
      {i:"gavel",t:"承諾付款與升級",s:"付款承諾追蹤與案件升級覆核"},
      {i:"insights",t:"回收成效分析",s:"回收趨勢、專員績效與帳款稽核"}
    ];
    var charts=[];
    function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
    function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
    function fmt(n){return n.toLocaleString("en-US");}
    var view=document.getElementById("view");

    /* ============ SCREEN 0 : DASHBOARD ============ */
    function v0(){
      var kpi=[
        {ic:"account_balance_wallet",l:"逾期應收總額",v:"NT$ 1.28",u:"億",d:"-6.4%",dir:"down"},
        {ic:"schedule",l:"平均收款天數 DSO",v:"41.6",u:"天",d:"-5.2 天",dir:"down"},
        {ic:"trending_up",l:"本月回收率",v:"73.8",u:"%",d:"+4.1%",dir:"up2"},
        {ic:"warning",l:"高風險案件 (M3)",v:"38",u:"件",d:"+3 件",dir:"up"}
      ];
      var h='<div class="grid g4">';
      for(var i=0;i<kpi.length;i++){var k=kpi[i];
        var cls=k.dir==="down"?"down":(k.dir==="up2"?"down":"up");
        var arrow=(k.dir==="down"||k.dir==="up2")?"arrow_downward":"arrow_upward";
        if(k.dir==="up2")arrow="arrow_upward";
        h+='<div class="card kpi"><div class="lab"><span class="ic"><span class="ms">'+k.ic+'</span></span>'+k.l+'</div>'+
           '<div class="val">'+k.v+'<small>'+k.u+'</small></div>'+
           '<div class="dl '+(k.dir==="up"?"up":"down")+'"><span class="ms">'+arrow+'</span>'+k.d+' 較上月</div></div>';
      }
      h+='</div>';
      h+='<div class="grid g21" style="margin-top:14px;">'+
         '<div class="card"><h3><span class="ms">insights</span>逾期餘額與回收趨勢</h3><p class="ch-sub">近 6 週逾期期末餘額（長條）對回收金額（折線）</p><div id="c0a" class="chart"></div></div>'+
         '<div class="card"><h3><span class="ms">donut_small</span>帳齡結構占比</h3><p class="ch-sub">依帳齡分級之逾期金額占比</p><div id="c0b" class="chart"></div></div>'+
         '</div>';
      h+='<div class="grid g12" style="margin-top:14px;">'+
         '<div class="card"><h3><span class="ms">flag</span>今日待辦</h3><p class="ch-sub">系統依規則排序</p>'+
           '<div class="stat-strip" style="flex-direction:column;">'+
           todo("call","12 筆","M3 逾期需今日致電","p-m3")+
           todo("mark_email_unread","8 筆","承諾到期未入帳","p-m2")+
           todo("gavel","3 筆","逾授權額度待覆核","p-legal")+
           todo("draft","27 筆","第二次催函批次","p-m1")+
           '</div></div>'+
         '<div class="card"><h3><span class="ms">groups</span>逾期客戶 Top（依金額）</h3><p class="ch-sub">點名高風險大額客戶</p>'+
           '<div class="tblwrap"><table><thead><tr><th>客戶</th><th>逾期金額</th><th>帳齡</th><th>逾期天數</th><th>負責專員</th><th>狀態</th></tr></thead><tbody>'+
           topRow("宏昌精密工業","2,860,000","p-m3","M3",92,"林","洽談中","p-hot")+
           topRow("鼎宸機電股份","1,940,000","p-m3","M3",78,"王","已承諾","p-ok")+
           topRow("台捷五金貿易","1,520,000","p-m2","M2",54,"林","催函已寄","p-wait")+
           topRow("永順塑膠","1,180,000","p-m2","M2",47,"陳","洽談中","p-hot")+
           topRow("大禾電子","   920,000","p-m1","M1",22,"王","首次聯繫","p-wait")+
           topRow("聚鑫材料","   740,000","p-m1","M1",18,"陳","已承諾","p-ok")+
           '</tbody></table></div></div>'+
         '</div>';
      view.innerHTML=h;
      void view.offsetHeight;
      var c=mk("c0a");
      if(c)c.setOption({
        grid:{left:8,right:12,top:30,bottom:24,containLabel:true},
        tooltip:{trigger:"axis"},legend:{data:["逾期期末餘額(萬)","回收金額(萬)"],right:0,top:0,textStyle:{fontSize:11}},
        xAxis:{type:"category",data:["W23","W24","W25","W26","W27","W28"],axisLine:{lineStyle:{color:"#d5d8de"}},axisLabel:{color:"#6b7280"}},
        yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef0f4"}},axisLabel:{color:"#9aa0ac"}},
        series:[
          {name:"逾期期末餘額(萬)",type:"bar",data:[1580,1520,1470,1390,1330,1280],barWidth:"48%",itemStyle:{borderRadius:[5,5,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"#f97316"},{offset:1,color:"#fdba74"}])}},
          {name:"回收金額(萬)",type:"line",smooth:true,data:[210,240,265,290,320,346],lineStyle:{color:A,width:3},itemStyle:{color:A},symbolSize:7,areaStyle:{color:"rgba(220,38,38,.06)"}}

        '<div class="card"><h3><span class="ms">stacked_line_chart</span>承諾兌現趨勢</h3><p class="ch-sub">近 6 週承諾金額對實際兌現</p><div id="c4a" class="chart sm"></div></div>'+

        grid:{left:8,right:12,top:30,bottom:6,containLabel:true},
        tooltip:{trigger:"axis"},legend:{right:0,top:0,textStyle:{fontSize:11}},
        xAxis:{type:"category",data:["W23","W24","W25","W26","W27","W28"],axisLabel:{color:"#6b7280"},axisLine:{lineStyle:{color:"#d5d8de"}}},
        yAxis:{type:"value",name:"萬",splitLine:{lineStyle:{color:"#eef0f4"}},axisLabel:{color:"#9aa0ac"}},

        '<td><div class="row"><div class="bar" style="flex:1 1 auto;"><i style="width:'+pct+'%"></i></div><span class="mut" style="font-size:11px;">'+pct+'%</span></div></td><td>'+ava+'專員</td></tr>';

    function prm(d,w,name,note,cls){
      return '<div class="promise"><div class="dt"><b>'+d+'</b><small>週'+w+'</small></div><div class="body"><div class="n">'+name+'</div><div class="s">'+note+'</div></div><span class="pill '+cls+'"><span class="ms">payments</span></span></div>';

      return '<div class="promise"><span class="pill '+cls+'" style="width:34px;height:34px;justify-content:center;padding:0;border-radius:10px;flex:0 0 34px;"><span class="ms">gavel</span></span>'+
        '<div class="body" style="margin-left:10px;"><div class="n">'+name+'</div><div class="s">'+note+'</div></div>'+
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;"><span class="pill '+cls+'">'+tag+'</span><button class="btn pri" style="padding:4px 10px;font-size:11px;">覆核</button></div></div>';

    /* ============ SCREEN 5 : RECOVERY ANALYTICS ============ */

        mini("平均回收率","73.8%","percent")+
        mini("DSO 改善","-5.2 天","speed")+
        mini("呆帳沖銷率","1.4%","money_off")+

        '<div class="card"><h3><span class="ms">show_chart</span>回收率與逾期率趨勢</h3><p class="ch-sub">近 6 週回收率上升、逾期率下降</p><div id="c5a" class="chart"></div></div>'+
        '<div class="card"><h3><span class="ms">radar</span>各帳齡回收效率</h3><p class="ch-sub">分級別回收成效雷達</p><div id="c5b" class="chart"></div></div>'+
        '</div>';
      h+='<div class="grid g2" style="margin-top:14px;">'+
        '<div class="card"><h3><span class="ms">leaderboard</span>催收專員績效</h3><p class="ch-sub">本月回收金額與案件數排名</p>'+
          '<div class="tblwrap"><table><thead><tr><th>#</th><th>專員</th><th>回收金額</th><th>結案</th><th>兌現率</th><th>達成</th></tr></thead><tbody>'+
          perf(1,"林","林專員","4,820,000",31,"84%",92)+
          perf(2,"陳","陳專員","4,210,000",28,"81%",86)+
          perf(3,"王","王專員","3,640,000",24,"76%",74)+
          perf(4,"黃","黃專員","2,180,000",17,"69%",58)+
          '</tbody></table></div></div>'+
        '<div class="card"><h3><span class="ms">fact_check</span>回收核銷與稽核</h3><p class="ch-sub">款項入帳後核銷留痕</p><div id="c5c" class="chart"></div></div>'+
        '</div>';
      h+='<div class="card" style="margin-top:14px;"><h3><span class="ms">verified_user</span>稽核軌跡（近期核銷）</h3><p class="ch-sub">RULE-03：缺少合法憑證的支出不得完成入帳</p>'+
        '<div class="tblwrap"><table><thead><tr><th>時間</th><th>案件</th><th>動作</th><th>金額</th><th>操作人</th><th>憑證</th></tr></thead><tbody>'+
        aud("08/14 10:40","東立科技","回收核銷","540,000","陳專員","匯款水單 ✓")+
        aud("08/13 16:22","勝美貿易","全額入帳","210,000","林專員","收據 ✓")+
        aud("08/13 09:05","鼎宸機電","部分入帳","400,000","王專員","匯款水單 ✓")+
        aud("08/12 14:10","華泰儀器","轉法催","288,000","財務經理","催告存證 ✓")+
        aud("08/11 11:30","宏達材料","結案核銷","95,000","王專員","收據 ✓")+
        '</tbody></table></div></div>';
      view.innerHTML=h;
      void view.offsetHeight;
      var c=mk("c5a");
      if(c)c.setOption({
        grid:{left:8,right:14,top:30,bottom:24,containLabel:true},
        tooltip:{trigger:"axis"},legend:{right:0,top:0,textStyle:{fontSize:11}},
        xAxis:{type:"category",data:["W23","W24","W25","W26","W27","W28"],axisLabel:{color:"#6b7280"},axisLine:{lineStyle:{color:"#d5d8de"}}},
        yAxis:{type:"value",max:100,splitLine:{lineStyle:{color:"#eef0f4"}},axisLabel:{formatter:"{value}%",color:"#9aa0ac"}},
        series:[
          {name:"回收率",type:"line",smooth:true,data:[62,65,68,70,72,74],lineStyle:{color:A,width:3},itemStyle:{color:A},symbolSize:7,areaStyle:{color:"rgba(220,38,38,.07)"}},
          {name:"逾期率",type:"line",smooth:true,data:[15,13,11,8.8,6.8,4.7],lineStyle:{color:B,width:3},itemStyle:{color:B},symbolSize:7}
        ]
      });
      var d=mk("c5b");
      if(d)d.setOption({
        tooltip:{},
        radar:{indicator:[{name:"M1",max:100},{name:"M2",max:100},{name:"M3",max:100},{name:"法催",max:100},{name:"整體",max:100}],radius:"64%",splitLine:{lineStyle:{color:"#eef0f4"}},axisName:{color:"#6b7280",fontSize:11}},
        series:[{type:"radar",areaStyle:{color:"rgba(220,38,38,.14)"},lineStyle:{color:A},itemStyle:{color:A},data:[{value:[94,82,61,38,74]}]}]
      });
      var e=mk("c5c");
      if(e)e.setOption({
        tooltip:{trigger:"item",formatter:"{b}: {c} 萬 ({d}%)"},
        legend:{bottom:0,textStyle:{fontSize:11}},
        series:[{type:"pie",radius:["44%","70%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},data:[
          {value:1980,name:"已核銷入帳",itemStyle:{color:"#16a34a"}},
          {value:620,name:"部分入帳",itemStyle:{color:"#f59e0b"}},
          {value:340,name:"協商中",itemStyle:{color:B}},
          {value:96,name:"呆帳沖銷",itemStyle:{color:A}}
        ]}]
      });
    }
    function perf(rk,ava,name,amt,cnt,rate,pct){
      var medal=rk===1?"#f59e0b":rk===2?"#9ca3af":rk===3?"#b45309":"#cbd5e1";
      return '<tr><td><span style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:'+medal+';color:#fff;align-items:center;justify-content:center;font-weight:800;font-size:11px;">'+rk+'</span></td>'+
        '<td><span class="avatar">'+ava+'</span>'+name+'</td><td class="money">NT$ '+amt+'</td><td>'+cnt+' 件</td><td>'+rate+'</td>'+
        '<td><div class="row"><div class="bar" style="flex:1 1 auto;"><i style="width:'+pct+'%"></i></div><span class="mut" style="font-size:11px;">'+pct+'%</span></div></td></tr>';
    }
    function aud(tm,cs,act,amt,who,ev){
      return '<tr><td class="mut">'+tm+'</td><td>'+cs+'</td><td><span class="pill p-ok">'+act+'</span></td><td class="money">NT$ '+amt+'</td><td>'+who+'</td><td class="mut">'+ev+'</td></tr>';
    }

    /* ============ ROUTER ============ */
    var FN=[v0,v1,v2,v3,v4,v5];
    function show(i){
      i=Math.max(0,Math.min(i,FN.length-1));
      clearCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
      document.getElementById("scr-title").textContent=MODS[i].t;
      document.getElementById("scr-sub").textContent=MODS[i].s;
      FN[i]();
    }
    // build nav
    (function(){
      var nav=document.getElementById("nav");var out="";
      for(var i=0;i<MODS.length;i++){
        out+='<button class="navbtn" data-i="'+i+'"><span class="ms">'+MODS[i].i+'</span><span class="nt"><b>'+MODS[i].t+'</b><small>'+MODS[i].s+'</small></span></button>';
      }
      nav.innerHTML=out;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
      }
    })();
    window.addEventListener("resize",function(){for(var k=0;k<charts.length;k++){try{charts[k].resize();}catch(e){}}});

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
