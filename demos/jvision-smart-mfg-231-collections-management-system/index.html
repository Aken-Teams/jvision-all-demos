<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>應收帳款催收管理系統（Collections Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="逾期帳款自動分級、催收任務排程分派、溝通紀錄與回收成效追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#0f172a;
      --color-on-primary:#fff;
      --color-secondary:#1e293b;
      --color-on-secondary:#fff;
      --color-accent:#22c55e;
      --color-on-accent:#0f172a;
      --color-background:#020617;
      --color-foreground:#f8fafc;
      --color-card:#0e1223;
      --color-card-foreground:#f8fafc;
      --color-muted:#1a1e2f;
      --color-muted-foreground:#94a3b8;
      --color-border:#334155;
      --color-destructive:#ef4444;
      --color-on-destructive:#000;
      --color-ring:#fff;
      --blue:#38bdf8;
      --ink:#f8fafc;
      --muted:#94a3b8;
      --line:#334155;
      --warning:#fbbf24;
      --violet:#c084fc;
      --shadow:0 18px 48px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{color-scheme:dark;scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
    button{font:inherit}
    button,[role="button"]{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--color-ring);outline-offset:3px}
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .mono,.money,time,td:first-child,.value{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
    .side{position:sticky;top:0;height:100vh;padding:20px 14px;background:linear-gradient(180deg,#080d1c,#050816);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid var(--line)}
    .logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--color-on-accent);background:var(--color-accent);box-shadow:0 0 24px rgba(34,197,94,.22)}
    .logo .ms{font-size:23px}
    .brand b{display:block;font-size:15px;letter-spacing:.02em}
    .brand small{color:var(--muted);font-family:"Fira Code",monospace}
    .nav{display:grid;gap:5px;margin-top:16px}
    .navbtn{width:100%;min-height:48px;border:1px solid transparent;border-radius:9px;background:transparent;color:#b9c5d6;display:flex;align-items:center;gap:11px;padding:9px 11px;text-align:left;transition:background .2s,border-color .2s,color .2s,transform .2s}
    .navbtn:hover{background:var(--color-muted);color:#fff;border-color:#293249}
    .navbtn.on{background:linear-gradient(90deg,rgba(34,197,94,.17),rgba(34,197,94,.04));border-color:rgba(34,197,94,.5);color:#fff;box-shadow:inset 3px 0 var(--color-accent)}
    .navbtn.on .ms{color:var(--color-accent);text-shadow:0 0 10px rgba(34,197,94,.65)}
    .navbtn .ms{font-size:20px}
    .navbtn b{display:block;font-size:13px}
    .navbtn small{display:block;margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sidefoot{margin-top:auto;padding:16px 8px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}
    .user{display:flex;align-items:center;gap:9px;color:#e2e8f0;margin-bottom:7px}
    .avatar{display:inline-grid;place-items:center;width:27px;height:27px;border:1px solid #476078;border-radius:7px;background:#172033;color:#e5edf7;font-weight:700;margin-right:7px}
    .main{min-width:0;padding:24px clamp(16px,2.2vw,32px) 60px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;margin-bottom:16px;border-bottom:1px solid var(--line)}
    .eyebrow{font:600 10px "Fira Code",monospace;letter-spacing:.13em;color:var(--color-accent);text-transform:uppercase;margin-bottom:7px}
    h1{font-size:22px;line-height:1.2;margin:0 0 5px;letter-spacing:.01em;text-shadow:0 0 10px rgba(248,250,252,.12)}
    .sub,.mut{color:var(--muted)}
    .sub{margin:0;font-size:12px}
    .audit{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(34,197,94,.45);border-radius:8px;background:rgba(34,197,94,.08);color:#86efac;font-size:11px;font-weight:600;white-space:nowrap}
    .grid{display:grid;gap:12px}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g21{grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr)}
    .card{min-width:0;padding:15px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,rgba(20,27,47,.95),var(--color-card));box-shadow:0 1px rgba(255,255,255,.025),var(--shadow)}
    .card h2,.card h3{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}
    .card h3 .ms{color:var(--color-accent);font-size:18px}
    .desc{color:var(--muted);font-size:11px;margin:4px 0 12px}
    .kpi{position:relative;overflow:hidden}
    .kpi:after{content:"";position:absolute;inset:auto -35px -55px auto;width:110px;height:110px;border-radius:50%;background:rgba(34,197,94,.055)}
    .label{display:flex;align-items:center;gap:8px;color:#b4c0d1;font-size:11px}
    .iconbox{width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(34,197,94,.28);border-radius:7px;background:rgba(34,197,94,.08);color:#86efac}
    .value{margin-top:12px;font-size:24px;font-weight:700;letter-spacing:-.04em}
    .value small{font:500 11px "Fira Sans",sans-serif;color:var(--muted);margin-left:3px}
    .delta{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;font-weight:600}
    .good{color:#86efac}.risk{color:#fca5a5}.warn{color:#fde68a}
    .chart{height:260px;width:100%}.chart.sm{height:210px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .btn,.seg button{min-height:36px;border:1px solid var(--line);border-radius:7px;background:#11182a;color:#d7e0ec;padding:7px 12px;font-weight:600;font-size:11px;transition:.2s}
    .btn:hover,.seg button:hover{border-color:#64748b;background:#182136}
    .btn.pri,.seg button.on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);box-shadow:0 0 18px rgba(34,197,94,.14)}
    .seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#090e1c}
    .seg button{border-color:transparent;min-height:30px}
    .rule{display:flex;gap:10px;padding:12px 14px;border:1px solid #6b5c28;border-left:3px solid var(--warning);border-radius:8px;background:rgba(251,191,36,.07);color:#f8e7ac;font-size:11px;line-height:1.65}
    .rule .ms{color:var(--warning);font-size:18px}
    .tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
    table{width:100%;min-width:630px;border-collapse:collapse;font-size:11px}
    th{padding:9px 10px;background:#090e1c;color:#aebbcf;border-bottom:1px solid #475569;text-align:left;font-weight:600;white-space:nowrap;letter-spacing:.03em}
    td{padding:9px 10px;border-bottom:1px solid #222d42;color:#e5edf7;white-space:nowrap}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:rgba(56,189,248,.055)}
    td.money,th.money{text-align:right}
    .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid;border-radius:999px;font-size:10px;font-weight:600}
    .pill .ms{font-size:12px}
    .ok{color:#86efac;background:rgba(34,197,94,.09);border-color:rgba(34,197,94,.35)}
    .m1{color:#7dd3fc;background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.35)}
    .m2{color:#fde68a;background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.38)}
    .m3{color:#fca5a5;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
    .legal{color:#d8b4fe;background:rgba(192,132,252,.1);border-color:rgba(192,132,252,.38)}
    .wait{color:#cbd5e1;background:rgba(148,163,184,.08);border-color:#475569}
    .bar{height:6px;background:#263147;border-radius:999px;overflow:hidden;min-width:65px}
    .bar i{display:block;height:100%;background:var(--color-accent);border-radius:inherit}
    .row,.between{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
    .stack{display:grid;gap:8px}
    .item{padding:10px;border:1px solid var(--line);border-radius:8px;background:#0a1020}
    .item strong{font-size:12px}.item p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .col{padding:10px;border:1px solid var(--line);border-radius:9px;background:#080d1a}
    .colhead{display:flex;justify-content:space-between;margin-bottom:9px;font-size:11px;font-weight:700}
    .count{font-family:"Fira Code",monospace;color:var(--muted)}
    .task{padding:10px;margin-bottom:8px;border:1px solid #2e3b53;border-radius:7px;background:#11182a}
    .task:last-child{margin-bottom:0}
    .task .amount{margin:6px 0;color:#86efac;font:600 11px "Fira Code",monospace}
    .taskfoot{display:flex;justify-content:space-between;gap:5px;padding-top:7px;border-top:1px dashed #334155;color:var(--muted);font-size:9px}
    .timeline{position:relative;margin-top:8px}
    .event{position:relative;margin-left:9px;padding:0 0 17px 25px;border-left:1px solid #475569}
    .event:last-child{border-left-color:transparent;padding-bottom:0}
    .node{position:absolute;left:-8px;top:0;width:15px;height:15px;border:3px solid var(--color-accent);border-radius:50%;background:#080d1a}
    .event h4{margin:0 0 4px;font-size:11px}
    .event time{color:var(--muted);font-size:9px}
    .event p{color:#c3cfdd;font-size:10px;line-height:1.55;margin:5px 0 0}
    .profile{text-align:center;padding:8px}
    .profile .avatar{width:54px;height:54px;margin:0 auto 9px;border-radius:11px;font-size:19px}
    .kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #263147;font-size:11px}
    .heat{display:grid;grid-template-columns:auto repeat(6,minmax(50px,1fr));gap:4px;min-width:480px}
    .heat div{padding:8px 5px;text-align:center;border-radius:5px;font:600 10px "Fira Code",monospace}
    .heat .hl{color:var(--muted);background:transparent}
    .h1{background:#213349;color:#d9e8f5}.h2{background:#275a53;color:#dcfce7}.h3{background:#8b4e24;color:#fff7ed}.h4{background:#991b1b;color:#fff}
    .spacer{height:12px}
    .fade{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:800px){
      .shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:12px}.brand{padding:0 4px 12px}.nav{display:flex;overflow-x:auto;padding-bottom:3px}.navbtn{flex:0 0 48px;width:48px;justify-content:center;padding:8px}.navbtn .text{display:none}.sidefoot{display:none}.main{padding-top:17px}.top{align-items:center}
    }
    @media(max-width:560px){.g4,.g2,.board{grid-template-columns:1fr}.audit{padding:7px}.audit span:last-child{display:none}h1{font-size:18px}.card{padding:13px}.chart{height:235px}}
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="ms" aria-hidden="true">request_quote</span></div>
        <div><b>催收管家</b><small>COLLECTIONS MS</small></div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能"></nav>
      <div class="sidefoot">
        <div class="user"><span class="avatar">陳</span><span>陳彥廷<br><small>財務經理</small></span></div>
        本季應收 NT$ 4.82 億<br><span class="mono">資料更新 2026/08/14 09:20</span>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <div class="eyebrow">Finance / Accounts Receivable</div>
          <h1 id="title">催收總覽儀表板</h1>
          <p class="sub" id="subtitle">逾期金額、DSO 與回收率總覽</p>
        </div>
        <div class="audit"><span class="ms" aria-hidden="true">verified_user</span><span>稽核軌跡已啟用</span></div>
      </header>
      <div id="view" class="fade"></div>
    </main>
  </div>
<script>
(function(){
  "use strict";
  var GREEN="#22c55e",BLUE="#38bdf8",YELLOW="#fbbf24",RED="#ef4444",VIOLET="#c084fc";
  var mods=[
    ["monitoring","催收總覽儀表板","逾期金額、DSO 與回收率總覽"],
    ["rule","帳齡自動分級","依逾期天數與金額自動分級標記"],
    ["checklist","催收任務排程","催收任務排程與專員分派"],
    ["history","催收溝通紀錄","電話 / email / 信函往來紀錄"],
    ["gavel","承諾付款與升級","付款承諾追蹤與案件升級覆核"],
    ["insights","回收成效分析","回收趨勢、專員績效與帳款稽核"]
  ];
  var charts=[],view=document.getElementById("view");
  function clearCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
  function chart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
  function kpi(icon,label,value,unit,delta,state){
    return '<section class="card kpi"><div class="label"><span class="iconbox"><span class="ms">'+icon+'</span></span>'+label+'</div><div class="value">'+value+'<small>'+unit+'</small></div><div class="delta '+state+'"><span class="ms">'+(state==="risk"?"trending_up":"trending_down")+'</span>'+delta+' 較上月</div></section>'
  }
  function heading(icon,title,desc){return '<h3><span class="ms">'+icon+'</span>'+title+'</h3><p class="desc">'+desc+'</p>'}
  function pill(text,cls,icon){return '<span class="pill '+cls+'">'+(icon?'<span class="ms">'+icon+'</span>':'')+text+'</span>'}
  function baseChart(){
    return {backgroundColor:"transparent",textStyle:{fontFamily:"Fira Sans",color:"#cbd5e1"},tooltip:{trigger:"axis",backgroundColor:"#111827",borderColor:"#475569",textStyle:{color:"#f8fafc"}},legend:{top:0,right:0,textStyle:{color:"#94a3b8",fontSize:10}},grid:{left:8,right:12,top:32,bottom:8,containLabel:true}}
  }
  function axes(o,cats,max){
    o.xAxis={type:"category",data:cats,axisLine:{lineStyle:{color:"#475569"}},axisLabel:{color:"#94a3b8",fontFamily:"Fira Code"}};
    o.yAxis={type:"value",max:max,splitLine:{lineStyle:{color:"#1e293b"}},axisLabel:{color:"#94a3b8",fontFamily:"Fira Code"}};
    return o
  }
  function v0(){
    view.innerHTML='<div class="grid g4">'+
      kpi("account_balance_wallet","逾期應收總額","NT$ 1.28","億","-6.4%","good")+
      kpi("schedule","平均收款天數 DSO","41.6","天","-5.2 天","good")+
      kpi("trending_up","本月回收率","73.8","%","+4.1%","good")+
      kpi("warning","高風險案件 (M3)","38","件","+3 件","risk")+
    '</div><div class="spacer"></div><div class="grid g21"><section class="card">'+heading("insights","逾期餘額與回收趨勢","近 6 週逾期期末餘額（長條）對回收金額（折線）")+'<div id="c0a" class="chart"></div></section><section class="card">'+heading("donut_small","帳齡結構占比","依帳齡分級之逾期金額占比")+'<div id="c0b" class="chart"></div></section></div><div class="spacer"></div><div class="grid g21"><section class="card">'+heading("flag","今日待辦","系統依規則排序")+'<div class="stack">'+
      '<div class="item between"><span>'+pill("需處理","m3","call")+' M3 逾期需今日致電</span><strong class="mono">12 筆</strong></div>'+
      '<div class="item between"><span>'+pill("未入帳","m2","mark_email_unread")+' 承諾到期未入帳</span><strong class="mono">8 筆</strong></div>'+
      '<div class="item between"><span>'+pill("待覆核","legal","gavel")+' 逾授權額度待覆核</span><strong class="mono">3 筆</strong></div>'+
      '<div class="item between"><span>'+pill("批次","m1","draft")+' 第二次催函批次</span><strong class="mono">27 筆</strong></div></div></section>'+
      '<section class="card">'+heading("groups","逾期客戶 Top（依金額）","點名高風險大額客戶")+'<div class="tblwrap"><table><thead><tr><th>客戶</th><th>逾期金額</th><th>帳齡</th><th>逾期天數</th><th>負責專員</th><th>狀態</th></tr></thead><tbody>'+
      top("宏昌精密工業","2,860,000","M3","92","林","洽談中","m3")+top("鼎O機電股份","1,940,000","M3","78","王","已承諾","ok")+top("台捷五金貿易","1,520,000","M2","54","林","催函已寄","wait")+top("O順塑膠","1,180,000","M2","47","陳","洽談中","m2")+top("O禾電子","920,000","M1","22","王","首次聯繫","wait")+top("O鑫材料","740,000","M1","18","陳","已承諾","ok")+
      '</tbody></table></div></section></div>';
    var a=axes(baseChart(),["W23","W24","W25","W26","W27","W28"]);
    a.legend.data=["逾期期末餘額(萬)","回收金額(萬)"];
    a.series=[{name:"逾期期末餘額(萬)",type:"bar",data:[1580,1520,1470,1390,1330,1280],itemStyle:{color:BLUE,borderRadius:[3,3,0,0]}},{name:"回收金額(萬)",type:"line",data:[210,240,265,290,320,346],smooth:true,lineStyle:{color:GREEN,width:3},itemStyle:{color:GREEN}}];chart("c0a",a);
    chart("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#94a3b8",fontSize:10}},series:[{type:"pie",radius:["48%","70%"],center:["50%","44%"],label:{show:false},itemStyle:{borderColor:"#0e1223",borderWidth:3},data:[{value:520,name:"M1 (1-30天)",itemStyle:{color:BLUE}},{value:430,name:"M2 (31-60天)",itemStyle:{color:YELLOW}},{value:230,name:"M3 (61-90天)",itemStyle:{color:RED}},{value:100,name:"法催 (>90天)",itemStyle:{color:VIOLET}}]}]})
  }
  function top(n,a,g,d,p,s,sc){return '<tr><td><span class="avatar">'+p+'</span>'+n+'</td><td class="money">NT$ '+a+'</td><td>'+pill(g,g.toLowerCase())+'</td><td class="mono">'+d+' 天</td><td>'+p+'專員</td><td>'+pill(s,sc)+'</td></tr>'}
  function v1(){
