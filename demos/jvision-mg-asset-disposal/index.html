<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>取得或處分資產審議管理 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#CCFBF1;
  --hov:#E6FFFA;
  --track:#D5E7E8;
  --sidebar:#FFFFFF;
  --sidebar2:#FFFFFF;
  --side-edge:#134E4A;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --r:0px;
  --glow:rgba(13,148,136,.24);
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(19,78,74,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(19,78,74,.06) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Serif TC","Times New Roman",serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--color-card);
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}
.app{display:flex;min-height:100vh}
.sidebar{
  width:264px;
  min-width:0;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:0 18px 20px;
  color:var(--ink);
  background:var(--panel);
  border-right:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  margin:0 -18px 18px;
  padding:18px;
  color:#042F2E;
  background:var(--color-secondary);
  border-bottom:3px solid var(--ink);
}
.brand-logo{
  width:46px;
  height:46px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-accent);
  border:2px solid #000;
  border-radius:0;
  box-shadow:5px 5px 0 #000;
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;line-height:1.1;letter-spacing:.03em}
.brand-txt span{display:block;margin-top:4px;color:#134E4A;font-family:"Cinzel",serif;font-size:9px;font-weight:600;letter-spacing:.16em}
.nav{display:flex;flex-direction:column;gap:8px;min-width:0;margin-top:2px}
.nav button{
  min-width:0;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  color:var(--ink);
  background:transparent;
  border:2px solid transparent;
  border-radius:0;
  text-align:left;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:var(--color-muted);border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.nav button.on{color:#000;background:var(--color-secondary);border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.nav .idx{margin-left:auto;color:var(--ink);font-family:"Cinzel",monospace;font-size:10px;font-weight:600;opacity:.75}
.side-foot{
  margin-top:auto;
  padding:16px 2px 0;
  color:var(--muted);
  border-top:2px solid var(--ink);
  font-family:"Crimson Pro",serif;
  font-size:12px;
  line-height:1.65;
}
.side-foot b{color:var(--ink);font-family:"Cinzel",monospace}
.main{flex:1;min-width:0;padding:28px 34px 64px}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding:0 0 17px;
  border-bottom:3px solid var(--ink);
  flex-wrap:wrap;
}
.topbar h1{display:flex;align-items:center;gap:10px;color:#042F2E;font-size:30px;line-height:1;font-weight:700;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:29px}
.topbar .sub{margin-top:7px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  min-height:36px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  color:var(--ink);
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  font-size:12px;
  font-weight:600;
}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid #052E16;border-radius:0;animation:pulse 2s steps(2,end) infinite}
.avatar{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-accent);border:2px solid #000;border-radius:0;font-weight:700;font-size:14px;box-shadow:3px 3px 0 #000}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
#screen>*,#screen>.grid>*{animation:reveal .36s ease-out both}
#screen>*:nth-child(2){animation-delay:.05s}
#screen>*:nth-child(3){animation-delay:.1s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--color-border);
}
.card,.sec{padding:16px}
.sec{margin-bottom:15px}
.card:hover,.tile:hover,.kpi:hover,.stat:hover{box-shadow:7px 7px 0 var(--color-secondary)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;font-size:17px;line-height:1.15}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card-h .hint{padding:3px 7px;color:#000;background:var(--color-secondary);border:1px solid var(--ink);font-family:"Cinzel",monospace;font-size:9px;font-weight:600;letter-spacing:.04em}
.sec>h3{margin-bottom:13px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.kpi,.stat,.tile{position:relative;overflow:hidden;padding:15px 16px;border-left:6px solid var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:72px;height:72px;background:var(--color-secondary);border:2px solid var(--ink);transform:rotate(12deg);opacity:.55}
.kpi .ico,.tile .ti{
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  border-radius:0;
  position:relative;
  z-index:1;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:#042F2E;
  font-family:"Cinzel","Roboto Mono",monospace;
  font-size:25px;
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:600;
  letter-spacing:-.035em;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Crimson Pro",serif;font-size:13px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;padding:2px 5px;border:1px solid currentColor;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#166534}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:7px}
.tile b{font-size:16px;line-height:1.15}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.tile .ti{position:absolute;right:13px;top:13px;background:var(--color-accent)}
.tile .tv{padding-right:30px;font-size:24px}
table{width:100%;border-collapse:collapse;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:10px 12px;
  color:#042F2E;
  background:var(--th);
  border-right:1px solid var(--ink);
  border-bottom:2px solid var(--ink);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hov)}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
.mono,[class*="id"],time{font-family:"Cinzel","Roboto Mono",monospace;font-variant-numeric:tabular-nums lining-nums;font-weight:600;letter-spacing:.01em}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}.t-ok::before{content:"✓ ";font-weight:900}
.t-warn{color:#92400E;background:#FEF3C7}.t-warn::before{content:"! ";font-weight:900}
.t-bad{color:#991B1B;background:#FEE2E2}.t-bad::before{content:"× ";font-weight:900}
.t-info{color:#1E3A8A;background:#DBEAFE}.t-info::before{content:"i ";font-weight:900}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}
.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-27px;top:3px;width:16px;height:16px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--ink);font-size:13px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--ink);font-size:12px;line-height:1.65}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:2px solid var(--ink);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-family:"Cormorant Garamond",serif;font-size:15px;font-weight:700}
.col-h .cnt{padding:1px 7px;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:0;font-family:"Cinzel",monospace;font-size:10px}
.pcard{padding:11px 12px;background:#fff;border:2px solid var(--ink);border-left:6px solid var(--accent);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.pcard b{font-size:14px}.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-secondary);border:1px solid var(--ink);border-radius:0;font-weight:800}
.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:11px}.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:0}
.lane-row .num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-secondary);border:2px solid var(--ink);border-radius:0;font-family:"Cinzel",monospace;font-weight:600;font-size:12px}
.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:15px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}.steps .s{width:24px;height:24px;display:flex;align-items:center;justify-content:center;z-index:1;color:var(--muted);background:#fff;border:2px solid var(--ink);border-radius:0;font-family:"Cinzel",monospace;font-size:10px}.steps .ln{width:20px;height:3px;background:var(--ink)}.steps .s.done{color:#000;background:var(--color-secondary)}.steps .s.cur{color:#000;background:var(--color-accent);animation:pulse 1.6s steps(2,end) infinite}.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--ink)}.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:14px}.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}.gauge .track{height:9px;position:relative;overflow:hidden;background:var(--track);border:1px solid var(--ink);border-radius:0}.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;text-align:right}
.band{position:relative;height:27px;min-width:150px;background:var(--track);border:1px solid var(--ink);border-radius:0}.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}.band .me{position:absolute;top:2px;width:12px;height:21px;background:var(--accent);border:1px solid var(--ink);border-radius:0}
@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);gap:15px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 14px;border-right:0;border-bottom:3px solid var(--ink);gap:8px}
  .brand{margin:0 8px 0 0;padding:8px 12px;border:2px solid var(--ink)}
  .brand-logo{width:38px;height:38px;box-shadow:3px 3px 0 #000}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:7px;margin:0}
  .nav button{min-height:44px;padding:8px 11px}
  .nav .idx{display:none}
  .main{padding:22px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:560px){
  body{font-size:14px;background-size:24px 24px}
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .sidebar{align-items:stretch}
  .brand{margin:0;width:100%}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
  .nav button{justify-content:center;padding:9px 6px;border-color:var(--ink)}
  .nav button .txt{display:none}
  .topbar h1{font-size:25px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .main{padding:18px 12px 42px}
  .card,.sec{padding:13px}
  .kpi,.stat,.tile{padding:14px}
  .dl{grid-template-columns:1fr;gap:2px 0}.dl dt{margin-top:9px}
}
@media(max-width:390px){.chip{font-size:11px;padding:6px}.topbar h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen>*,#screen>.grid>*{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">domain_add</span></div>
      <div class="brand-txt"><b>資產審議台</b><span>ASSET TRANSACTION</span></div>

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
