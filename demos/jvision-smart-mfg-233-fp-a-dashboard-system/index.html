<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>財務分析儀表板系統（FP&A Dashboard System）｜Demo</title>
<meta name="description" content="把分散數據變成可下鑽、可決策的經營洞察" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;--ink:#1e2235;--muted:#6b7192;
  --bg:#f4f5fb;--card:#ffffff;--line:#e7e9f4;--soft:#f0f1fa;
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.shell{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:264px;flex:0 0 264px;background:var(--card);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 18px;}
.brand .logo{
  width:44px;height:44px;border-radius:13px;flex:0 0 44px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 8px 20px rgba(79,70,229,.32);
}
.brand .logo .material-symbols-outlined{font-size:26px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px;}
.brand p{font-size:11px;margin:2px 0 0;color:var(--muted);font-weight:500;}
.navlist{display:flex;flex-direction:column;gap:4px;flex-wrap:wrap;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;
  width:100%;min-width:0;transition:background .15s,color .15s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:var(--soft);color:var(--ink);}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28);}
.navbtn .idx{margin-left:auto;font-size:11px;opacity:.6;font-weight:700;}
.sidefoot{margin-top:auto;padding:12px 10px 0;font-size:11px;color:var(--muted);border-top:1px solid var(--line);}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.topbar .tt{min-width:0;}
.topbar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;}
.topbar .sub{margin:3px 0 0;color:var(--muted);font-size:13px;}
.period{
  display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--muted);
}
.period b{color:var(--accent);}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.chd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.chd h3{margin:0;font-size:14.5px;font-weight:700;}
.chd .cap{font-size:11.5px;color:var(--muted);font-weight:500;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;}
.kpi .val{font-size:27px;font-weight:800;margin:7px 0 2px;letter-spacing:.3px;}
.kpi .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px;}
.kpi .dm{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi .dm .material-symbols-outlined{font-size:16px;}
.up{color:var(--good);}.down{color:var(--bad);}
.kpi .ic{
  position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);
}
.kpi .ic .material-symbols-outlined{font-size:22px;}
.chart{width:100%;height:260px;overflow:hidden;}
.chart.sm{height:220px;}
.chart.lg{height:300px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;}
thead th{background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.4px;position:sticky;top:0;}
tbody tr{border-top:1px solid var(--line);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.t-good{background:#e7f6ec;color:var(--good);}
.t-warn{background:#fdf1e0;color:var(--warn);}
.t-bad{background:#fbe7e7;color:var(--bad);}
.t-neu{background:var(--soft);color:var(--muted);}
.bar{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.scroll{overflow-x:auto;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line);}
.pill.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:var(--soft);border-radius:14px;padding:12px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;}
.col h4 span.cnt{background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted);}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;}
.ticket .tk{font-size:12.5px;font-weight:700;margin:0 0 4px;}
.ticket .tm{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.ticket .amt{font-weight:800;color:var(--ink);}
/* timeline */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 2px var(--accent2);}
.tl .ev h5{margin:0 0 2px;font-size:13px;font-weight:700;}
.tl .ev p{margin:0;font-size:12px;color:var(--muted);}
.tl .ev .tt2{font-size:11px;color:var(--accent);font-weight:700;}
/* whatif sliders */
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.slider-row label{flex:0 0 118px;font-size:12.5px;font-weight:700;min-width:0;}
.slider-row input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--accent);}
.slider-row .rv{flex:0 0 62px;text-align:right;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--accent);}
.scenbox{display:flex;flex-direction:column;gap:10px;}
.scenline{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);}
.scenline:last-child{border-bottom:none;}
.scenline .sl{font-size:12.5px;color:var(--muted);font-weight:600;}
.scenline .sv{font-size:19px;font-weight:800;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.mini{font-size:11px;color:var(--muted);}
.report-item{display:flex;align-items:center;gap:13px;padding:13px 4px;border-top:1px solid var(--line);}
.report-item:first-child{border-top:none;}
.report-item .ri-ic{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.report-item .ri-b{min-width:0;flex:1 1 auto;}
.report-item .ri-b .rt{font-size:13.5px;font-weight:700;}
.report-item .ri-b .rm{font-size:11.5px;color:var(--muted);}
.btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.btn .material-symbols-outlined{font-size:16px;}
.notewrap{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:13px;padding:14px;border:1px solid var(--line);}
.notewrap .material-symbols-outlined{color:var(--accent);font-size:22px;flex:0 0 auto;}
.notewrap p{margin:0;font-size:12.5px;color:var(--muted);}
.notewrap b{color:var(--ink);}
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} .board{grid-template-columns:repeat(2,1fr);} }
@media(max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);padding:14px;}
  .brand{padding:2px 6px 12px;}
  .navlist{flex-direction:row;flex-wrap:wrap;}
  .navbtn{width:auto;flex:0 0 auto;}
  .navbtn .idx{display:none;}
  .sidefoot{display:none;}
  .main{padding:20px 16px 48px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .navbtn .nlab{display:none;}
  .navbtn{padding:10px;}
  .topbar h2{font-size:19px;}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">monitoring</span></div>
      <div>
        <h1>FP&A Dashboard</h1>
        <p>財務分析儀表板系統</p>
      </div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="sidefoot">
      資料倉儲多源整合 · 每日 06:00 排程更新<br/>示範資料 · 2026 財年
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scrTitle">損益儀表板</h2>
        <p class="sub" id="scrSub">營收、成本、毛利即時總覽</p>
      </div>
      <div class="period"><span class="material-symbols-outlined" style="font-size:18px">calendar_month</span>期間 <b>2026 Q2</b> · 更新 08/14 06:00</div>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var NAV=[
  {icon:"monitoring",name:"損益儀表板",sub:"營收、成本、毛利即時總覽"},
  {icon:"account_tree",name:"現金流分析",sub:"現金流入流出與資金水位"},
  {icon:"insights",name:"獲利下鑽",sub:"部門與產品線獲利拆解"},
  {icon:"trending_up",name:"情境模擬",sub:"What-if 假設與敏感度分析"},
  {icon:"fact_check",name:"預實差異",sub:"預算與實際差異追蹤"},
  {icon:"receipt_long",name:"報表產出",sub:"財務報表彙整與匯出"}
];
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function fmt(n){return n.toLocaleString("en-US");}
function money(n){return "$"+n.toLocaleString("en-US");}

/* ---------- SCREEN 0 : 損益儀表板 ---------- */
function v0(){
  return ''+
  '<div class="grid g4">'+
    kpi("本季營收","$4,286萬","up","arrow_upward","+8.4% QoQ","payments")+
    kpi("營業毛利","$1,712萬","up","arrow_upward","+5.1% QoQ","savings")+
    kpi("毛利率","39.9%","up","arrow_upward","+1.2 pt","percent")+
    kpi("營業淨利","$642萬","down","arrow_downward","-2.3% QoQ","account_balance")+
  '</div>'+
  '<div class="grid g23" style="margin-top:16px">'+
    '<div class="card"><div class="chd"><h3>營收 / 成本 / 毛利趨勢</h3><span class="cap">近 6 個月（萬元）</span></div><div id="c0a" class="chart"></div>'+
      '<div class="legend" style="margin-top:6px"><span><i style="background:#4f46e5"></i>營收</span><span><i style="background:#f59e0b"></i>營業成本</span><span><i style="background:#16a34a"></i>毛利</span></div></div>'+
    '<div class="card"><div class="chd"><h3>營收結構</h3><span class="cap">產品線佔比</span></div><div id="c0b" class="chart"></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px"><div class="chd"><h3>損益科目明細（本季 vs 去年同期）</h3><span class="cap">單位：萬元</span></div>'+
    '<div class="scroll"><table><thead><tr><th>科目</th><th class="num">本季</th><th class="num">去年同期</th><th class="num">YoY</th><th>佔營收</th></tr></thead><tbody>'+
      plRow("營業收入",4286,3954,true)+
      plRow("營業成本",2574,2402,false)+
      plRow("營業毛利",1712,1552,true)+
      plRow("營業費用",1070,988,false)+
      plRow("營業淨利",642,564,true)+
      plRow("業外損益",-58,42,false)+
      plRow("稅前淨利",584,606,false)+
    '</tbody></table></div></div>';
}
function plRow(name,cur,prev,goodUp){
  var yoy=((cur-prev)/Math.abs(prev)*100);
  var yoyTxt=(yoy>=0?"+":"")+yoy.toFixed(1)+"%";
  var good=goodUp?(yoy>=0):(yoy<=0);
  var pct=Math.min(100,Math.abs(cur)/4286*100);
  return '<tr><td>'+name+'</td><td class="num">'+fmt(cur)+'</td><td class="num">'+fmt(prev)+'</td>'+
    '<td class="num '+(good?'up':'down')+'">'+yoyTxt+'</td>'+
    '<td><div class="bar"><i style="width:'+pct.toFixed(0)+'%"></i></div></td></tr>';
}
function v0charts(){
  mkChart("c0a",{
    grid:{left:44,right:14,top:16,bottom:26},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["1月","2月","3月","4月","5月","6月"],axisLine:{lineStyle:{color:"#c9cde3"}},axisLabel:{color:"#6b7192"}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef0f8"}},axisLabel:{color:"#6b7192"}},
    series:[
      {name:"營收",type:"bar",data:[1320,1385,1410,1402,1438,1446],itemStyle:{color:"#4f46e5",borderRadius:[4,4,0,0]},barMaxWidth:22},
      {name:"營業成本",type:"bar",data:[812,842,858,845,862,867],itemStyle:{color:"#f59e0b",borderRadius:[4,4,0,0]},barMaxWidth:22},
      {name:"毛利",type:"line",data:[508,543,552,557,576,579],smooth:true,itemStyle:{color:"#16a34a"},lineStyle:{width:3}}
    ]
  });
  mkChart("c0b",{
    tooltip:{trigger:"item",formatter:"{b}: {d}%"},
    series:[{type:"pie",radius:["46%","72%"],center:["50%","52%"],avoidLabelOverlap:true,
      itemStyle:{borderColor:"#fff",borderWidth:2},
      label:{color:"#1e2235",fontSize:11},
      data:[
        {value:1712,name:"智能製造模組",itemStyle:{color:"#4f46e5"}},
        {value:1188,name:"感測元件",itemStyle:{color:"#818cf8"}},
        {value:842,name:"系統整合服務",itemStyle:{color:"#22c55e"}},
        {value:544,name:"維運訂閱",itemStyle:{color:"#f59e0b"}}
      ]}]
  });
}

/* ---------- SCREEN 1 : 現金流分析 ---------- */
function v1(){
  return ''+
  '<div class="grid g4">'+
    kpi("期末現金水位","$2,340萬","up","arrow_upward","+$180萬","account_balance_wallet")+
    kpi("本季淨現金流","$+296萬","up","arrow_upward","轉正","swap_vert")+
    kpi("應收週轉天數","48 天","down","arrow_downward","-6 天","hourglass_top")+
    kpi("現金安全月數","5.8 月","up","arrow_upward","+0.4","shield")+
  '</div>'+
  '<div class="grid g23" style="margin-top:16px">'+
    '<div class="card"><div class="chd"><h3>現金流量瀑布圖</h3><span class="cap">本季（萬元）</span></div><div id="c1a" class="chart lg"></div></div>'+
    '<div class="card"><div class="chd"><h3>資金水位走勢</h3><span class="cap">近 6 個月</span></div><div id="c1b" class="chart lg"></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:16px">'+
    '<div class="card"><div class="chd"><h3>現金流量三大活動</h3><span class="cap">單位：萬元</span></div>'+
      cfRow("營業活動現金流",528,"t-good","營收回收穩定、應收改善")+
      cfRow("投資活動現金流",-312,"t-warn","產線設備資本支出")+
      cfRow("融資活動現金流",80,"t-neu","短期借款淨增加")+
      '<div class="notewrap" style="margin-top:12px"><span class="material-symbols-outlined">insights</span><p><b>自由現金流 $216 萬</b>，已足以覆蓋下一季預估資本支出，資金水位維持健康。</p></div>'+
    '</div>'+
    '<div class="card"><div class="chd"><h3>應收帳款帳齡</h3><span class="cap">逾期需優先追蹤</span></div>'+
      '<div id="c1c" class="chart"></div>'+
      '<div class="notewrap" style="margin-top:10px"><span class="material-symbols-outlined">warning</span><p><b>逾期 &gt; 90 天 $186 萬</b>，依 RULE-01 已列入優先追蹤名單。</p></div>'+
    '</div>'+
  '</div>';
}
function cfRow(name,val,cls,note){
  var pos=val>=0;
  return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">'+
    '<div style="flex:1 1 auto;min-width:0"><div style="font-size:13.5px;font-weight:700">'+name+'</div><div class="mini">'+note+'</div></div>'+
    '<div style="font-size:18px;font-weight:800;'+(pos?'color:var(--good)':'color:var(--bad)')+'">'+(pos?'+':'')+fmt(val)+'</div></div>';
}
function v1charts(){
  mkChart("c1a",{
    grid:{left:44,right:12,top:16,bottom:44},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["期初","營業","投資","融資","期末"],axisLabel:{color:"#6b7192",interval:0},axisLine:{lineStyle:{color:"#c9cde3"}}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef0f8"}},axisLabel:{color:"#6b7192"}},
    series:[
      {type:"bar",stack:"t",itemStyle:{color:"transparent"},data:[0,2044,2260,2044,0],barMaxWidth:38},
      {type:"bar",stack:"t",barMaxWidth:38,

    '<span class="rv" id="'+id+'-v">'+(val>=0?'+':'')+val+'%</span></div>';

function recalc(){
  var vol=+document.getElementById("s-vol").value;
  var price=+document.getElementById("s-price").value;
  var cost=+document.getElementById("s-cost").value;
  var opex=+document.getElementById("s-opex").value;
  document.getElementById("s-vol-v").textContent=(vol>=0?'+':'')+vol+'%';
  document.getElementById("s-price-v").textContent=(price>=0?'+':'')+price+'%';
  document.getElementById("s-cost-v").textContent=(cost>=0?'+':'')+cost+'%';
  document.getElementById("s-opex-v").textContent=(opex>=0?'+':'')+opex+'%';
  var rev=BASE.rev*(1+vol/100)*(1+price/100);
  var baseCost=BASE.rev*(1-BASE.gmPct/100);
  var cost$=baseCost*(1+vol/100)*(1+cost/100);
  var gross=rev-cost$;
  var opex$=BASE.rev*BASE.opexPct/100*(1+opex/100);
  var oi=gross-opex$;
  var baseOI=BASE.rev-baseCost-BASE.rev*BASE.opexPct/100;
  var diff=oi-baseOI;
  var changed=(vol||price||cost||opex);
  var badge=document.getElementById("s-badge");
  if(badge)badge.textContent=changed?"情境：調整後":"情境：基準";
  var box=document.getElementById("scen");
  if(box){
    box.innerHTML=
      scLine("模擬營收",Math.round(rev)+" 萬","")+
      scLine("營業毛利",Math.round(gross)+" 萬 ("+(gross/rev*100).toFixed(1)+"%)","")+
      scLine("營業費用",Math.round(opex$)+" 萬","")+
      scLine("營業淨利",Math.round(oi)+" 萬",diff>=0?"up":"down")+
      scLine("較基準",(diff>=0?"+":"")+Math.round(diff)+" 萬",diff>=0?"up":"down");
  }
  updateScenChart(baseOI,oi);
}
function scLine(l,v,cls){
  return '<div class="scenline"><span class="sl">'+l+'</span><span class="sv '+cls+'">'+v+'</span></div>';
}
