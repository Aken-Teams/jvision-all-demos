<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>財務分析儀表板系統（FP&amp;A Dashboard System）｜Demo</title>
<meta name="description" content="把分散數據變成可下鑽、可決策的經營洞察" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Fira+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;

  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;

  --accent:var(--color-accent);
  --accent-soft:rgba(34,197,94,.12);
  --bg:var(--color-background);
  --card:var(--color-card);
  --soft:var(--color-muted);
  --good:#4ADE80;
  --warn:#FBBF24;
  --bad:#F87171;
  --info:#60A5FA;
  --radius:8px;
  --shadow:0 18px 42px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  background:
    linear-gradient(rgba(51,65,85,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.08) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
}
.shell{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  position:sticky;
  top:0;
  width:248px;
  height:100vh;
  flex:0 0 248px;
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:24px 18px;
  background:rgba(14,18,35,.96);
  border-right:1px solid var(--line);
  backdrop-filter:blur(16px);
  z-index:10;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 4px 20px;
  border-bottom:1px solid var(--line);
}
.brand .logo{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:grid;
  place-items:center;
  border:1px solid rgba(34,197,94,.42);
  border-radius:7px;
  background:var(--accent-soft);
  color:var(--accent);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand h1{
  margin:0;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:10.5px;
  letter-spacing:.04em;
}
.navlist{display:flex;flex-direction:column;gap:4px}
.navbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#CBD5E1;
  font-size:13px;
  font-weight:500;
  text-align:left;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.navbtn:hover{
  background:var(--soft);
  border-color:var(--line);
  color:var(--ink);
  transform:translateX(2px);
}
.navbtn.on{
  background:var(--accent-soft);
  border-color:rgba(34,197,94,.48);
  color:var(--ink);
}
.navbtn.on::before{
  content:"";
  position:absolute;
  left:-19px;
  width:3px;
  height:24px;
  background:var(--accent);
}
.navbtn.on .material-symbols-outlined{color:var(--accent)}
.navbtn .material-symbols-outlined{font-size:19px;flex:0 0 auto}
.navbtn .nlab{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.navbtn .idx{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.sidefoot{
  margin-top:auto;
  padding:16px 4px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
  line-height:1.7;
}
.main{
  flex:1 1 auto;
  min-width:0;
  max-width:1680px;
  padding:28px 34px 64px;
}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}
.topbar .tt{min-width:0}
.topbar h2{
  margin:0;
  font-size:clamp(22px,2vw,28px);
  font-weight:600;
  letter-spacing:-.025em;
}
.topbar .sub{
  margin:5px 0 0;
  color:#A9B6CA;
  font-size:13px;
}
.period{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:40px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--card);
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:11px;
  white-space:nowrap;
}
.period .material-symbols-outlined{color:var(--accent)}
.period b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{
  min-width:0;
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(20,25,45,.96),rgba(12,16,31,.98));
  box-shadow:0 1px 0 rgba(255,255,255,.025);
  transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.card:hover{
  border-color:#475569;
  box-shadow:var(--shadow);
}
.card.pad0{padding:0;overflow:hidden}
.chd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.chd h3{
  margin:0;
  font-size:14px;
  font-weight:600;
  letter-spacing:.01em;
}
.chd .cap{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:142px;
}
.kpi::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:74px;
  height:2px;
  background:var(--accent);
  opacity:.72;
}
.kpi .lab{
  color:#A9B6CA;
  font-size:12px;
  font-weight:500;
}
.kpi .val{
  margin:10px 0 4px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:clamp(23px,2.2vw,29px);
  font-weight:600;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{
  margin-left:2px;
  color:var(--muted);
  font-size:13px;
}
.kpi .dm{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  font-weight:600;
}
.kpi .dm .material-symbols-outlined{font-size:16px}
.up{color:var(--good)!important}
.down{color:var(--bad)!important}
.kpi .ic{
  position:absolute;
  top:15px;
  right:15px;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border:1px solid rgba(34,197,94,.24);
  border-radius:6px;
  background:var(--accent-soft);
  color:var(--accent);
}
.kpi .ic .material-symbols-outlined{font-size:20px}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:220px}
.chart.lg{height:300px}
.scroll{
  max-width:100%;
  overflow-x:auto;
  scrollbar-color:#475569 transparent;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
}
th,td{
  padding:11px 12px;
  text-align:left;
  white-space:nowrap;
}
thead th{
  position:sticky;
  top:0;
  z-index:1;
  border-bottom:1px solid #475569;
  background:#171C2D;
  color:#B7C3D4;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.055em;
}
tbody tr{border-top:1px solid rgba(51,65,85,.7)}
tbody tr:hover{background:rgba(30,41,59,.42)}
td.num,th.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td .mini{white-space:normal}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10.5px;
  font-weight:600;
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:currentColor;
}
.t-good{background:rgba(34,197,94,.1);color:#6EE7A0}
.t-warn{background:rgba(251,191,36,.1);color:#FCD34D}
.t-bad{background:rgba(248,113,113,.1);color:#FCA5A5}
.t-neu{background:rgba(148,163,184,.1);color:#CBD5E1}
.bar{
  height:6px;
  min-width:70px;
  overflow:hidden;
  border-radius:2px;
  background:#242B3D;
}
.bar>i{
  display:block;
  height:100%;
  border-radius:2px;
  background:var(--accent);
}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:6px 12px;
  border:1px solid var(--line);
  border-radius:5px;
  background:var(--card);
  color:#B7C3D4;
  font-size:11.5px;
  font-weight:600;
}
.pill.on{
  border-color:var(--accent);
  background:var(--accent);
  color:var(--color-on-accent);
}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{min-width:0;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
  font-size:12px;
}
.col h4 span.cnt{
  padding:1px 7px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--card);
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.ticket{margin-bottom:9px;padding:11px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.ticket .tk{margin:0 0 4px;font-size:12px;font-weight:600}
.ticket .tm{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10.5px}
.ticket .amt{color:var(--ink);font-family:"Fira Code",monospace;font-weight:600}
.tl{position:relative;padding-left:28px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:8px;
  width:1px;
  background:var(--line);
}
.tl .ev{position:relative;padding:0 0 20px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{
  position:absolute;
  top:3px;
  left:-24px;
  width:9px;
  height:9px;
  border:2px solid var(--accent);
  border-radius:50%;
  background:var(--card);
}
.tl .ev h5{margin:1px 0 3px;font-size:12.5px;font-weight:600}
.tl .ev p{margin:0;color:#A9B6CA;font-size:11.5px}
.tl .ev .tt2{
  color:var(--accent);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.slider-row label{flex:0 0 118px;min-width:0;font-size:12px;font-weight:600}
.slider-row input[type=range]{
  flex:1 1 auto;
  min-width:0;
  accent-color:var(--accent);
  cursor:pointer;
}
.slider-row input[type=range]:focus-visible{border-radius:4px}
.slider-row .rv{
  flex:0 0 62px;
  color:var(--accent);
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:600;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.scenbox{display:flex;flex-direction:column;gap:4px}
.scenline{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.scenline:last-child{border-bottom:none}
.scenline .sl{color:#A9B6CA;font-size:12px}
.scenline .sv{
  font-family:"Fira Code",monospace;
  font-size:17px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:#A9B6CA;font-size:10.5px}
.legend i{
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:5px;
  border-radius:2px;
  vertical-align:middle;
}
.mini{color:var(--muted);font-size:10.5px}
.report-item{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:66px;
  padding:12px 3px;
  border-top:1px solid var(--line);
}
.report-item:first-child{border-top:none}
.report-item .ri-ic{
  width:38px;
  height:38px;
  flex:0 0 38px;
  display:grid;
  place-items:center;
  border:1px solid rgba(34,197,94,.25);
  border-radius:6px;
  background:var(--accent-soft);
  color:var(--accent);
}
.report-item .ri-b{min-width:0;flex:1 1 auto}
.report-item .ri-b .rt{font-size:13px;font-weight:600}
.report-item .ri-b .rm{color:var(--muted);font-size:10.5px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:38px;
  min-height:38px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:5px;
  background:var(--card);
  color:#CBD5E1;
  font-size:11px;
  font-weight:600;
  transition:border-color .2s ease,background-color .2s ease,color .2s ease,transform .2s ease;
}
.btn:hover{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--accent);
  transform:translateY(-1px);
}
.btn.pri{border-color:var(--accent);background:var(--accent);color:var(--color-on-accent)}
.btn .material-symbols-outlined{font-size:17px}
.notewrap{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:13px;
  border:1px solid #37445A;
  border-left:3px solid var(--accent);
  border-radius:5px;
  background:#141A29;
}
.notewrap .material-symbols-outlined{flex:0 0 auto;color:var(--accent);font-size:20px}
.notewrap p{margin:0;color:#B7C3D4;font-size:11.5px}
.notewrap b{color:var(--ink);font-weight:600}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .sidebar{
    position:relative;
    width:auto;
    height:auto;
    flex:none;
    gap:12px;
    padding:14px 16px;
    border-right:none;
    border-bottom:1px solid var(--line);
  }
  .brand{padding:0 0 12px}
  .navlist{
    flex-direction:row;
    flex-wrap:nowrap;
    gap:6px;
    padding:2px 2px 5px;
    overflow-x:auto;
  }
  .navbtn{width:auto;flex:0 0 auto}
  .navbtn.on::before{display:none}
  .navbtn .idx{display:none}
  .sidefoot{display:none}
  .main{padding:22px 18px 48px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .main{padding:18px 12px 42px}
  .topbar{align-items:stretch;flex-direction:column;margin-bottom:16px}
  .period{align-self:flex-start;white-space:normal}
  .navbtn{min-height:42px;padding:9px}
  .navbtn .nlab{font-size:11px}
  .brand .logo{width:36px;height:36px;flex-basis:36px}
  .card{padding:15px}
  .kpi{min-height:132px}
  .slider-row{display:grid;grid-template-columns:1fr 58px;gap:6px 10px}
  .slider-row label{grid-column:1;flex:none}
  .slider-row input[type=range]{grid-column:1/-1;grid-row:2}
  .slider-row .rv{grid-column:2;grid-row:1}
  .report-item{align-items:flex-start;flex-wrap:wrap}
  .report-item .ri-b{min-width:calc(100% - 52px)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .reveal{animation:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">monitoring</span></div>
      <div>
        <h1>FP&amp;A Dashboard</h1>
        <p>財務分析儀表板系統</p>
      </div>
    </div>
    <nav class="navlist" id="nav" aria-label="主要功能"></nav>
    <div class="sidefoot">
      資料倉儲多源整合 · 每日 06:00 排程更新<br />示範資料 · 2026 財年
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scrTitle">損益儀表板</h2>
        <p class="sub" id="scrSub">營收、成本、毛利即時總覽</p>
      </div>
      <div class="period"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>期間 <b>2026 Q2</b> · 更新 08/14 06:00</div>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var COLORS={
  accent:"#22C55E",
  accent2:"#60A5FA",
  ink:"#F8FAFC",
  muted:"#94A3B8",
  grid:"#273247",
  line:"#475569",
  card:"#0E1223",
  good:"#4ADE80",
  warn:"#FBBF24",
  bad:"#F87171",
  neutral:"#64748B"
};
var NAV=[
  {icon:"monitoring",name:"損益儀表板",sub:"營收、成本、毛利即時總覽"},
  {icon:"account_tree",name:"現金流分析",sub:"現金流入流出與資金水位"},
  {icon:"insights",name:"獲利下鑽",sub:"部門與產品線獲利拆解"},
  {icon:"trending_up",name:"情境模擬",sub:"What-if 假設與敏感度分析"},
  {icon:"fact_check",name:"預實差異",sub:"預算與實際差異追蹤"},
  {icon:"receipt_long",name:"報表產出",sub:"財務報表彙整與匯出"}
];
var charts=[];
function disposeCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].dispose()}catch(e){}
  }
  charts=[];
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el,null,{renderer:"canvas"});

function slider(id,lab,key,val,min,max){
  return '<div class="slider-row"><label for="'+id+'">'+lab+"</label>"+
    '<input type="range" id="'+id+'" data-key="'+key+'" min="'+min+'" max="'+max+'" value="'+val+'" step="1" oninput="recalc()" />'+
    '<span class="rv" id="'+id+'-v">'+(val>=0?"+":"")+val+"%</span></div>";
}
function recalc(){
  var vol=+document.getElementById("s-vol").value;
  var price=+document.getElementById("s-price").value;
  var cost=+document.getElementById("s-cost").value;
  var opex=+document.getElementById("s-opex").value;
  document.getElementById("s-vol-v").textContent=(vol>=0?"+":"")+vol+"%";
  document.getElementById("s-price-v").textContent=(price>=0?"+":"")+price+"%";
  document.getElementById("s-cost-v").textContent=(cost>=0?"+":"")+cost+"%";
  document.getElementById("s-opex-v").textContent=(opex>=0?"+":"")+opex+"%";
  var rev=BASE.rev*(1+vol/100)*(1+price/100);
  var baseCost=BASE.rev*(1-BASE.gmPct/100);
  var costValue=baseCost*(1+vol/100)*(1+cost/100);
  var gross=rev-costValue;
  var opexValue=BASE.rev*BASE.opexPct/100*(1+opex/100);
  var oi=gross-opexValue;
  var baseOI=BASE.rev-baseCost-BASE.rev*BASE.opexPct/100;
  var diff=oi-baseOI;
  var changed=(vol||price||cost||opex);
  var badge=document.getElementById("s-badge");
  if(badge)badge.textContent=changed?"情境：調整後":"情境：基準";
  var box=document.getElementById("scen");
  if(box){
    box.innerHTML=
      scLine("模擬營收",fmt(Math.round(rev))+" 萬","")+
      scLine("營業毛利",fmt(Math.round(gross))+" 萬 ("+(gross/rev*100).toFixed(1)+"%)","")+
      scLine("營業費用",fmt(Math.round(opexValue))+" 萬","")+
      scLine("營業淨利",fmt(Math.round(oi))+" 萬",diff>=0?"up":"down")+
      scLine("較基準",(diff>=0?"有利 +":"不利 ")+fmt(Math.round(diff))+" 萬",diff>=0?"up":"down");
  }
  updateScenChart(baseOI,oi);
}
function scLine(l,v,cls){
  return '<div class="scenline"><span class="sl">'+l+'</span><span class="sv '+cls+'">'+v+"</span></div>";
}
var scenChart=null;

function varRow(name,bud,act,revenueLike){
  var diff=act-bud;
  var fav=revenueLike?(diff>=0):(diff<=0);
  var rate=(act/bud*100).toFixed(1);
  var st=fav?"t-good":(Math.abs(diff)/bud>0.1?"t-bad":"t-warn");
  var lab=fav?"有利":(Math.abs(diff)/bud>0.1?"重大不利":"待說明");
  return "<tr><td>"+name+'</td><td class="num">'+fmt(bud)+'</td><td class="num">'+fmt(act)+"</td>"+
    '<td class="num '+(fav?"up":"down")+'">'+lab+" "+(diff>=0?"+":"")+fmt(diff)+"</td>"+
    '<td class="num">'+rate+'%</td><td><span class="tag '+st+'">'+lab+"</span></td></tr>";
}

/* ---------- shared ---------- */
function kpi(lab,val,dir,ico,note,micon){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined" aria-hidden="true">'+micon+"</span></div>"+
    '<div class="lab">'+lab+'</div><div class="val">'+val+"</div>"+
    '<div class="dm '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined" aria-hidden="true">'+ico+"</span>"+note+"</div></div>";
}
var RENDER=[v0,v1,v2,v3,v4,v5];
var CHARTS=[v0charts,v1charts,v2charts,v3charts,v4charts,v5charts];

function buildNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button class="navbtn" type="button" data-i="'+i+'" onclick="show('+i+')" aria-label="'+NAV[i].name+'">'+
      '<span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].icon+"</span>"+
      '<span class="nlab">'+NAV[i].name+'</span><span class="idx">0'+(i+1)+"</span></button>";
  }
  nav.innerHTML=h;
}
function show(i){
  disposeCharts();
  scenChart=null;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].className="navbtn"+(active?" on":"");
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  document.getElementById("scrTitle").textContent=NAV[i].name;
  document.getElementById("scrSub").textContent=NAV[i].sub;
  var box=document.getElementById("screen");
  box.innerHTML='<div class="grid reveal" style="gap:16px">'+RENDER[i]()+"</div>";
  void box.offsetHeight;
  CHARTS[i]();
}
function resizeCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].resize()}catch(e){}
  }
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){
    show(0);
    return;
  }
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",resizeCharts);
fromHash();
</script>
