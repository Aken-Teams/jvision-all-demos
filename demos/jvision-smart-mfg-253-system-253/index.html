<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研發成本管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="研發專案預算實際比對、目標成本設定與 BOM 成本即時試算的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#15803d;
      --color-on-primary:#fff;
      --color-secondary:#22c55e;
      --color-on-secondary:#0f172a;
      --color-accent:#d97706;
      --color-on-accent:#000;
      --color-background:#f0fdf4;
      --color-foreground:#14532d;
      --color-card:#fff;
      --color-card-foreground:#14532d;
      --color-muted:#e8f0f1;
      --color-muted-foreground:#475569;
      --color-border:#bbf7d0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#15803d;
      --blue:#15803d;
      --ink:#14532d;
      --muted:#475569;
      --line:#bbf7d0;
      --bg:#f0fdf4;
      --card:#fff;
      --ok:#15803d;
      --warn:#b45309;
      --bad:#b91c1c;
      --soft:#dcfce7;
      --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
      --shadow:0 1px 2px rgba(20,83,45,.06),0 8px 24px rgba(20,83,45,.05);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:
        linear-gradient(rgba(21,128,61,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(21,128,61,.035) 1px,transparent 1px),
        var(--color-background);
      background-size:32px 32px;
      color:var(--color-foreground);
      font-family:"Exo","Noto Sans TC",system-ui,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button,[role="button"],input[type="range"]{cursor:pointer}
    button:focus-visible,input:focus-visible,a:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      color:var(--color-foreground);
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--color-border);
      box-shadow:0 1px 0 rgba(21,128,61,.04);
      backdrop-filter:blur(14px);
    }
    .topbar-inner{
      max-width:1440px;
      min-width:0;
      margin:auto;
      padding:12px 24px 0;
    }
    .topline{
      display:flex;
      align-items:center;
      gap:24px;
      min-width:0;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:250px;
    }
    .logo{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      color:var(--color-on-primary);
      background:var(--color-primary);
      border-radius:4px;
      box-shadow:4px 4px 0 #86efac;
    }
    .logo .material-symbols-outlined{font-size:23px}
    .brand b{
      display:block;
      font-size:16px;
      font-weight:700;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .brand small{
      display:block;
      margin-top:1px;
      color:var(--color-muted-foreground);
      font-family:var(--mono);
      font-size:10px;
      letter-spacing:.06em;
    }
    .system-meta{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:12px;
      color:var(--color-muted-foreground);
      font-family:var(--mono);
      font-size:11px;
    }
    .live{
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:#166534;
      font-weight:700;
    }
    .live:before{
      content:"";
      width:8px;
      height:8px;
      background:var(--color-secondary);
      border:2px solid #dcfce7;
      border-radius:50%;
    }
    nav{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:0;
      margin-top:10px;
    }
    .navbtn{
      position:relative;
      min-height:47px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      border:0;
      border-top:1px solid var(--color-border);
      color:var(--color-muted-foreground);
      background:transparent;
      font-size:12px;
      font-weight:600;
      letter-spacing:.02em;
      transition:color .2s ease,background .2s ease;
    }
    .navbtn:after{
      content:"";
      position:absolute;
      right:14px;
      bottom:-1px;
      left:14px;
      height:3px;
      background:var(--color-primary);
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .22s ease;
    }
    .navbtn:hover{color:var(--color-primary);background:#f0fdf4}
    .navbtn.on{color:var(--color-primary);background:#f7fff9}
    .navbtn.on:after{transform:scaleX(1)}
    .navbtn .material-symbols-outlined{font-size:18px}
    main{max-width:1440px;margin:auto;padding:26px 24px 64px}
    #app{animation:reveal .36s ease both}
    .screen-head{
      position:relative;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px 24px;
      align-items:end;
      margin:0 0 20px;
      padding:5px 0 18px;
      border-bottom:1px solid var(--color-border);
    }
    .screen-head:before{
      content:"";
      position:absolute;
      bottom:-1px;
      left:0;
      width:72px;
      height:3px;
      background:var(--color-primary);
    }
    .screen-head h1{
      grid-column:1;
      margin:0;
      color:var(--color-foreground);
      font-size:clamp(22px,2.2vw,30px);
      font-weight:600;
      letter-spacing:.025em;
      line-height:1.2;
    }
    .screen-head p{
      grid-column:1;
      margin:0;
      color:var(--color-muted-foreground);
      font-size:13px;
    }
    .pill{
      grid-column:2;
      grid-row:1/3;
      align-self:center;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid var(--color-border);
      border-radius:3px;
      color:var(--color-primary);
      background:#fff;
      font-family:var(--mono);
      font-size:10px;
      font-weight:700;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr)}
    .g32{grid-template-columns:minmax(320px,1fr) minmax(0,1.5fr)}
    .card,.kpi{
      min-width:0;
      background:var(--color-card);
      border:1px solid var(--color-border);
      border-radius:5px;
      box-shadow:var(--shadow);
    }
    .card{
      padding:17px 18px;
      transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
    }
    .card:hover{
      border-color:#86efac;
      box-shadow:0 2px 3px rgba(20,83,45,.06),0 12px 30px rgba(20,83,45,.08);
    }
    .card h3{
      min-height:25px;
      margin:0 0 13px;
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--color-card-foreground);
      font-size:13px;
      font-weight:700;
      letter-spacing:.025em;
    }
    .card h3 .material-symbols-outlined{
      color:var(--color-primary);
      font-size:19px;
    }
    .card .sub{
      margin-left:auto;
      color:var(--color-muted-foreground);
      font-family:var(--mono);
      font-size:10px;
      font-weight:500;
    }
    .kpi{
      position:relative;
      overflow:hidden;
      display:grid;
      grid-template-columns:42px minmax(0,1fr);
      grid-template-rows:auto auto auto;
      column-gap:13px;
      padding:16px;
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .kpi:before{
      content:"";
      position:absolute;
      top:0;
      right:0;
      left:0;
      height:3px;
      background:var(--color-primary);
    }
    .kpi:hover{
      transform:translateY(-2px);
      border-color:#86efac;
      box-shadow:0 10px 24px rgba(20,83,45,.09);
    }
    .kpi .ic{
      grid-row:1/4;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      color:var(--color-primary);
      background:var(--color-background);
      border:1px solid var(--color-border);
      border-radius:4px;
    }
    .kpi .ic .material-symbols-outlined{font-size:21px}
    .kpi .lab{
      color:var(--color-muted-foreground);
      font-size:11px;
      font-weight:600;
      letter-spacing:.04em;
    }
    .kpi .val{
      margin-top:2px;
      color:var(--color-card-foreground);
      font-family:var(--mono);
      font-size:25px;
      font-weight:700;
      letter-spacing:-.04em;
      line-height:1.2;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{
      color:var(--color-muted-foreground);
      font-family:"Exo",sans-serif;
      font-size:11px;
      font-weight:600;
      letter-spacing:0;
    }
    .delta{
      margin-top:5px;
      display:inline-flex;
      align-items:center;
      gap:3px;
      font-size:11px;
      font-weight:600;
    }
    .delta .material-symbols-outlined{font-size:15px}
    .up{color:var(--bad)}
    .down{color:var(--ok)}
    .chart{width:100%;height:280px;overflow:hidden}
    .chart.sm{height:230px}
    .chart.lg{height:320px}
    .tbl-wrap{
      overflow-x:auto;
      border:1px solid #dcfce7;
      border-radius:3px;
      scrollbar-color:#86efac #f0fdf4;
    }
    table{
      width:100%;
      min-width:520px;
      border-collapse:collapse;
      font-size:12px;
    }
    th,td{
      padding:9px 11px;
      border-bottom:1px solid #dcfce7;
      text-align:left;
      white-space:nowrap;
    }
    th{
      color:#334155;
      background:#f0fdf4;
      font-size:10px;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background .18s ease}
    tbody tr:hover{background:#f7fff9}
    td:first-child{font-family:var(--mono);font-size:11px}
    .num{
      text-align:right;
      font-family:var(--mono);
      font-weight:600;
      font-variant-numeric:tabular-nums;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:3px 7px;
      border:1px solid currentColor;
      border-radius:3px;
      font-family:var(--mono);
      font-size:10px;
      font-weight:700;
    }
    .tag:before{font-family:"Material Symbols Outlined";font-size:13px}
    .t-ok{color:#166534;background:#f0fdf4}
    .t-ok:before{content:"check_circle"}
    .t-warn{color:#92400e;background:#fffbeb}
    .t-warn:before{content:"warning"}
    .t-bad{color:#991b1b;background:#fef2f2}
    .t-bad:before{content:"error"}
    .t-info{color:#166534;background:#f0fdf4}
    .bar{
      width:100px;
      min-width:70px;
      height:6px;
      overflow:hidden;
      display:inline-block;
      vertical-align:middle;
      background:#dbe7e1;
      border-radius:2px;
    }
    .bar>i{display:block;height:100%;border-radius:2px}
    .board{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:11px;
      min-width:0;
    }
    .col{
      min-width:0;
      padding:10px;
      background:#f8fcf9;
      border:1px solid var(--color-border);
      border-radius:4px;
    }
    .col>.ch{
      min-height:29px;
      margin:0 2px 9px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--color-foreground);
      font-size:11px;
      font-weight:700;
      letter-spacing:.04em;
    }
    .cnt{
      min-width:25px;
      padding:2px 7px;
      color:var(--color-muted-foreground);
      background:#fff;
      border:1px solid var(--color-border);
      border-radius:3px;
      font-family:var(--mono);
      font-size:10px;
      text-align:center;
    }
    .ticket{
      position:relative;
      min-width:0;
      margin-bottom:8px;
      padding:10px 10px 10px 13px;
      background:#fff;
      border:1px solid #d7e9dc;
      border-left:3px solid var(--color-primary);
      border-radius:3px;
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .ticket:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(20,83,45,.08)}
    .ticket b{display:block;font-size:11px;font-weight:700}
    .ticket .meta{
      margin-top:5px;
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      color:var(--color-muted-foreground);
      font-family:var(--mono);
      font-size:9px;
    }
    .ticket .meta span:first-child:before{
      margin-right:3px;
      font-family:"Material Symbols Outlined";
      font-size:11px;
      vertical-align:-2px;
    }
    .ticket.hi{border-left-color:var(--color-destructive)}
    .ticket.hi .meta span:first-child:before{content:"error"}
    .ticket.mi{border-left-color:var(--color-accent)}
    .ticket.mi .meta span:first-child:before{content:"warning"}
    .ticket.lo{border-left-color:var(--color-primary)}
    .ticket.lo .meta span:first-child:before{content:"check_circle"}
    .tl{position:relative;min-width:0;padding-left:24px}
    .tl:before{
      content:"";
      position:absolute;
      top:4px;
      bottom:4px;
      left:8px;
      width:1px;
      background:var(--color-border);
    }
    .tl .it{position:relative;padding:0 0 15px}
    .tl .it:last-child{padding-bottom:0}
    .tl .it:before{
      content:"";
      position:absolute;
      top:4px;
      left:-20px;
      width:9px;
      height:9px;
      background:#fff;
      border:2px solid var(--color-primary);
      border-radius:1px;
    }
    .tl .tt{font-size:12px;font-weight:700}
    .tl .dd{margin-top:2px;color:var(--color-muted-foreground);font-size:11px}
    .target-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-width:0}
    .ring{position:relative;width:150px;height:150px;flex:0 0 auto}
    .ring .rc{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }
    .ring .rc b{
      color:var(--color-primary);
      font-family:var(--mono);
      font-size:23px;
      font-weight:700;
    }
    .ring .rc span{color:var(--color-muted-foreground);font-size:10px;font-weight:600}
    .gapbox{flex:1;min-width:210px}
    .gaprow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:8px 0;
      border-bottom:1px solid #dcfce7;
      font-size:12px;
    }
    .gaprow:last-child{border-bottom:0}
    .gaprow b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
    .simrow{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid #dcfce7;
      flex-wrap:wrap;
    }
    .simrow:last-child{border-bottom:0}
    .simrow .nm{min-width:125px;flex:1;font-size:11px;font-weight:600}
    .simrow input[type="range"]{min-width:120px;flex:1;accent-color:var(--color-primary)}
    .qv{
      width:68px;
      color:var(--color-primary);
      font-family:var(--mono);
      font-size:11px;
      font-weight:700;
      text-align:right;
      font-variant-numeric:tabular-nums;
    }
    .totbar{
      margin-top:14px;
      padding:13px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color:var(--color-on-primary);
      background:var(--color-primary);
      border-radius:4px;
    }
    .totbar .tv{
      font-family:var(--mono);
      font-size:21px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }
    .totbar .tt{font-size:11px;font-weight:600}
    .legend{
      margin-top:8px;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      color:var(--color-muted-foreground);
      font-size:10px;
    }
    .legend i{
      width:10px;
      height:10px;
      display:inline-block;
      margin-right:5px;
      border-radius:1px;
      vertical-align:middle;
    }
    .mini{color:var(--color-muted-foreground);font-size:10px}
    .foot{
      margin-top:28px;
      padding-top:16px;
      border-top:1px solid var(--color-border);
      color:var(--color-muted-foreground);
      font-family:var(--mono);
      font-size:9px;
      text-align:center;
      letter-spacing:.03em;
    }
    @keyframes reveal{
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1100px){
      .g4{grid-template-columns:repeat(2,1fr)}
      .board{grid-template-columns:repeat(2,1fr)}
      .system-meta{display:none}
    }
    @media(max-width:820px){
      .topbar-inner{padding-right:16px;padding-left:16px}
      main{padding:20px 16px 48px}
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:1fr}
      nav{overflow-x:auto;grid-template-columns:repeat(6,minmax(105px,1fr))}
      .navbtn{justify-content:flex-start;padding:0 12px}
      .screen-head{grid-template-columns:1fr}
      .screen-head h1,.screen-head p,.pill{grid-column:1}
      .pill{grid-row:auto;justify-self:start}
    }
    @media(max-width:560px){
      .topline{gap:10px}
      .brand{min-width:0}
      .brand small{display:none}
      .logo{width:38px;height:38px}
      .navbtn{min-width:62px;justify-content:center}
      .navbtn .lbl{display:none}
      nav{grid-template-columns:repeat(6,1fr)}
      .g4{grid-template-columns:1fr}
      .card{padding:14px}
      .screen-head h1{font-size:22px}
      .target-hero{justify-content:center}
      .gapbox{width:100%}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      #app{animation:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topline">
        <div class="brand">
          <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">request_quote</span></div>
          <div><b>研發成本管理系統</b><small>R&amp;D COST MANAGEMENT PLATFORM</small></div>
        </div>
        <div class="system-meta"><span class="live">資料同步正常</span><span>FY2024 / Q4</span></div>
      </div>
      <nav id="nav" aria-label="主要功能"></nav>
    </div>
  </header>

  <main>
    <div id="app" aria-live="polite"></div>
    <div class="foot">JVISION 系統 DEMO · 研發成本管理系統 · 純前端展示（模擬資料）</div>
  </main>

  <script>
  var CH=[];
  function disposeCharts(){for(var i=0;i<CH.length;i++){try{CH[i].dispose()}catch(e){}}CH=[]}
  function mk(id,opt){
    var el=document.getElementById(id);
    if(!el)return;
    var c=echarts.init(el);
    c.setOption(opt);
    CH.push(c);
  }
  function money(n){return n.toLocaleString("en-US")}
  var GREEN="#15803d",LIME="#22c55e",AMBER="#d97706",RED="#dc2626",SLATE="#64748b",PALE="#bbf7d0";

  var NAVS=[
    {i:0,ic:"dashboard",t:"成本總覽"},
    {i:1,ic:"request_quote",t:"預實比對"},
    {i:2,ic:"trending_up",t:"目標成本"},
    {i:3,ic:"account_tree",t:"BOM 試算"},
    {i:4,ic:"warning",t:"超支預警"},

  var SCREENS=[{r:s0,d:d0},{r:s1,d:d1},{r:s2,d:d2},{r:s3,d:d3},{r:s4,d:d4},{r:s5,d:d5}];
  function show(i){
    disposeCharts();
    var app=document.getElementById("app"),sc=SCREENS[i]||SCREENS[0];
    app.innerHTML=sc.r();
    app.style.animation="none";
    void app.offsetWidth;
    app.style.animation="";
    var btns=document.querySelectorAll("#nav .navbtn");
    for(var b=0;b<btns.length;b++){
      var active=(+btns[b].getAttribute("data-i"))===i;
      btns[b].classList.toggle("on",active);
      btns[b].setAttribute("aria-current",active?"page":"false");
    }
    void app.offsetHeight;
    if(sc.d)sc.d();
  }
  window.addEventListener("resize",function(){for(var i=0;i<CH.length;i++){try{CH[i].resize()}catch(e){}}});
  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return}
    var n=document.querySelectorAll("[data-i]").length||6;
    show(Math.min(+m[1],n-1));
    try{window.scrollTo(0,0)}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
