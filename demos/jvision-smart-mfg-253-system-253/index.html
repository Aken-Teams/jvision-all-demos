<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研發成本管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="研發專案預算實際比對、目標成本設定與 BOM 成本即時試算的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --ac:#0369a1; --ac2:#38bdf8; --ink:#0f172a; --muted:#64748b;
      --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
      --soft:#e0f2fe;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#0c4a6e,#0369a1);color:#fff;box-shadow:0 2px 14px rgba(3,105,161,.28)}
    .topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
    .brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
    .brand span{display:block;font-size:11px;opacity:.8;font-weight:500}
    nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
    .navbtn{display:flex;align-items:center;gap:7px;border:0;cursor:pointer;background:rgba(255,255,255,.08);color:#e0f2fe;padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;transition:.16s;min-width:0}
    .navbtn:hover{background:rgba(255,255,255,.2);color:#fff}
    .navbtn.on{background:#fff;color:var(--ac)}
    .navbtn .material-symbols-outlined{font-size:19px}
    main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
    .screen-head{margin:2px 0 18px}
    .screen-head h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:.3px}
    .screen-head p{margin:0;color:var(--muted);font-size:13.5px}
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ac)}
    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:1.6fr 1fr}
    .g32{grid-template-columns:1fr 1.5fr}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
    .card h3{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--ac)}
    .card .sub{color:var(--muted);font-size:12px;font-weight:500;margin-left:auto}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
    .kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ac);margin-bottom:10px}
    .kpi .ic .material-symbols-outlined{font-size:22px}
    .kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600}
    .kpi .val{font-size:26px;font-weight:900;letter-spacing:.5px;margin-top:2px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
    .kpi .delta .material-symbols-outlined{font-size:16px}
    .up{color:var(--bad)} .down{color:var(--ok)}
    .chart{width:100%;height:280px;overflow:hidden}
    .chart.sm{height:230px}
    .chart.lg{height:320px}
    .tbl-wrap{overflow-x:auto;border-radius:12px}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{background:#f8fafc;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase}
    tbody tr:hover{background:#f8fbfe}
    .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
    .t-ok{background:#dcfce7;color:#15803d} .t-warn{background:#fef3c7;color:#b45309} .t-bad{background:#fee2e2;color:#b91c1c} .t-info{background:var(--soft);color:var(--ac)}
    .bar{height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:70px;display:inline-block;width:110px;vertical-align:middle}
    .bar>i{display:block;height:100%;border-radius:6px}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
    .col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
    .col>.ch{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px}
    .col>.ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
    .ticket{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;padding:9px 11px;margin-bottom:9px;min-width:0}
    .ticket b{font-size:13px;font-weight:800;display:block}
    .ticket .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
    .ticket.hi{border-left-color:var(--bad)} .ticket.mi{border-left-color:var(--warn)} .ticket.lo{border-left-color:var(--ac2)}
    .tl{position:relative;padding-left:24px;min-width:0}
    .tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .it{position:relative;padding:0 0 16px}
    .tl .it:last-child{padding-bottom:0}
    .tl .it:before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid #fff;box-shadow:0 0 0 2px var(--ac2)}
    .tl .it .tt{font-weight:800;font-size:13.5px}
    .tl .it .dd{color:var(--muted);font-size:12px;margin-top:2px}
    .target-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-width:0}
    .ring{position:relative;width:150px;height:150px;flex:0 0 auto}
    .ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
    .ring .rc b{font-size:24px;font-weight:900;color:var(--ac)}
    .ring .rc span{font-size:11px;color:var(--muted);font-weight:600}
    .gapbox{flex:1;min-width:200px}
    .gaprow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
    .gaprow:last-child{border-bottom:0}
    .gaprow b{font-weight:800}
    .simrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
    .simrow:last-child{border-bottom:0}
    .simrow .nm{font-weight:700;font-size:13px;flex:1;min-width:120px}
    .simrow input[type=range]{flex:1;min-width:120px;accent-color:var(--ac)}
    .simrow .qv{width:64px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac)}
    .totbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(100deg,#0c4a6e,#0369a1);color:#fff;border-radius:14px;padding:14px 18px;margin-top:14px;flex-wrap:wrap;gap:10px}
    .totbar .tv{font-size:24px;font-weight:900}
    .totbar .tt{font-size:12.5px;opacity:.85;font-weight:600}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
    .mini{font-size:12px;color:var(--muted)}
    .foot{margin-top:26px;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr)} .board{grid-template-columns:repeat(2,1fr)} }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .navbtn .lbl{display:none}
      .navbtn{padding:8px 10px}
      .brand span{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">request_quote</span></div>
        <div><b>研發成本管理系統</b><span>R&amp;D Cost Management Platform</span></div>
      </div>
      <nav id="nav"></nav>
    </div>
  </header>
  <main><div id="app"></div><div class="foot">Jvision 系統 Demo · 研發成本管理系統 · 純前端展示（模擬資料）</div></main>

  <script>
  var CH = [];
  function disposeCharts(){ for(var i=0;i<CH.length;i++){ try{CH[i].dispose();}catch(e){} } CH=[]; }
  function mk(id,opt){ var el=document.getElementById(id); if(!el) return; var c=echarts.init(el); c.setOption(opt); CH.push(c); }
  function money(n){ return n.toLocaleString('en-US'); }

  var NAVS = [
    {i:0,ic:"dashboard",t:"成本總覽"},
    {i:1,ic:"request_quote",t:"預實比對"},
    {i:2,ic:"trending_up",t:"目標成本"},
    {i:3,ic:"account_tree",t:"BOM 試算"},
    {i:4,ic:"warning",t:"超支預警"},
    {i:5,ic:"insights",t:"趨勢分析"}
  ];
  (function buildNav(){
    var h="";
    for(var k=0;k<NAVS.length;k++){ var nv=NAVS[k];
      h+='<button class="navbtn" data-i="'+nv.i+'"><span class="material-symbols-outlined">'+nv.ic+'</span><span class="lbl">'+nv.t+'</span></button>';
    }
    document.getElementById("nav").innerHTML=h;
    var btns=document.querySelectorAll("#nav .navbtn");
    for(var j=0;j<btns.length;j++){ btns[j].addEventListener("click",function(){ location.hash="v"+this.getAttribute("data-i"); }); }
  })();

  function head(title,desc,pill){
    return '<div class="screen-head"><span class="pill"><span class="material-symbols-outlined" style="font-size:15px">'+pill.ic+'</span>'+pill.t+'</span>'
      +'<h1 style="margin-top:8px">'+title+'</h1><p>'+desc+'</p></div>';
  }

  var PROJECTS=[
    {code:"RD-2401",name:"次世代電源模組",budget:8600000,actual:9240000,owner:"林彥廷"},
    {code:"RD-2402",name:"車用感測器 v3",budget:5400000,actual:4980000,owner:"陳孟樺"},
    {code:"RD-2403",name:"工業閘道器",budget:6200000,actual:6510000,owner:"王柏森"},
    {code:"RD-2404",name:"低功耗藍牙晶片",budget:4100000,actual:3860000,owner:"李思妤"},
    {code:"RD-2405",name:"AI 邊緣運算板",budget:11200000,actual:12480000,owner:"張家豪"},
    {code:"RD-2406",name:"智慧電表模組",budget:3700000,actual:3720000,owner:"黃詩涵"}
  ];

  // ===== SCREEN 0 : 成本總覽 =====
  function s0(){
    var totB=0,totA=0,over=0,cnt=PROJECTS.length;
    for(var i=0;i<PROJECTS.length;i++){ totB+=PROJECTS[i].budget; totA+=PROJECTS[i].actual; if(PROJECTS[i].actual>PROJECTS[i].budget) over++; }
    var rate=Math.round(totA/totB*1000)/10;
    var kpis=[
      {ic:"savings",lab:"研發總預算",val:(totB/1000000).toFixed(1),unit:" 百萬",d:"6 項專案",dir:"info"},
      {ic:"payments",lab:"累計實支",val:(totA/1000000).toFixed(1),unit:" 百萬",d:"執行率 "+rate+"%",dir:rate>100?"up":"down"},
      {ic:"warning",lab:"超支專案",val:over,unit:" / "+cnt,d:"需介入處置",dir:"up"},
      {ic:"target",lab:"目標成本達成",val:"71",unit:" %",d:"季目標 80%",dir:"up"}
    ];
    var kh="";
    for(var k=0;k<kpis.length;k++){ var p=kpis[k];
      var cls=p.dir==="down"?"down":(p.dir==="up"?"up":"");
      var arrow=p.dir==="down"?"trending_down":(p.dir==="up"?"trending_up":"remove");
      kh+='<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+p.ic+'</span></div>'
        +'<div class="lab">'+p.lab+'</div><div class="val">'+p.val+'<small>'+p.unit+'</small></div>'
        +'<div class="delta '+cls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+p.d+'</div></div>';
    }
    var rows="";
    for(var r=0;r<PROJECTS.length;r++){ var pr=PROJECTS[r];
      var diff=pr.actual-pr.budget; var pct=Math.round(pr.actual/pr.budget*100);
      var tg=diff>0?'t-bad':'t-ok'; var col=diff>0?'#dc2626':'#16a34a';
      rows+='<tr><td><b>'+pr.code+'</b></td><td>'+pr.name+'</td>'
        +'<td class="num">'+money(pr.budget)+'</td><td class="num">'+money(pr.actual)+'</td>'
        +'<td><span class="bar"><i style="width:'+(Math.min(pct,140)/1.4)+'%;background:'+col+'"></i></span> <b style="color:'+col+'">'+pct+'%</b></td>'
        +'<td><span class="tag '+tg+'">'+(diff>0?'+':'')+money(diff)+'</span></td><td>'+pr.owner+'</td></tr>';
    }
    return head("研發成本總覽","跨專案預算、實支與目標成本一頁掌握，超支自動標紅。",{ic:"dashboard",t:"模組 1 · 總覽儀表"})
      +'<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'
      +'<div class="grid g23">'
        +'<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>專案成本明細 <span class="sub">單位：元</span></h3>'
          +'<div class="tbl-wrap"><table><thead><tr><th>專案</th><th>名稱</th><th>預算</th><th>實支</th><th>執行率</th><th>差異</th><th>負責人</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
        +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>成本結構占比</h3><div id="c0" class="chart sm"></div></div>'
      +'</div>';
  }
  function d0(){
    mk("c0",{
      tooltip:{trigger:"item",formatter:"{b}: {c} 萬 ({d}%)"},
      legend:{bottom:0,textStyle:{fontSize:11}},
      color:["#0369a1","#38bdf8","#0ea5e9","#7dd3fc","#075985"],
      series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],avoidLabelOverlap:true,
        label:{show:false},labelLine:{show:false},
        data:[{name:"人力工時",value:1820},{name:"料件試作",value:1240},{name:"委外測試",value:760},{name:"設備攤提",value:540},{name:"其他",value:320}]
      }]
    });
  }

  // ===== SCREEN 1 : 預實比對 =====
  function s1(){
    var items=[
      {n:"人力工時",b:3200,a:3480},{n:"料件採購",b:2400,a:2210},{n:"試作樣品",b:1500,a:1690},
      {n:"委外測試",b:900,a:1120},{n:"設備租用",b:600,a:540},{n:"差旅雜支",b:300,a:265}
    ];
    var rows="";
    for(var j=0;j<items.length;j++){ var it=items[j]; var d=it.a-it.b; var pct=Math.round(it.a/it.b*100);
      var tg=d>0?'t-bad':'t-ok';
      rows+='<tr><td><b>'+it.n+'</b></td><td class="num">'+money(it.b)+'</td><td class="num">'+money(it.a)+'</td>'
        +'<td class="num" style="color:'+(d>0?'#dc2626':'#16a34a')+'">'+(d>0?'+':'')+money(d)+'</td>'
        +'<td><span class="tag '+tg+'">'+pct+'%</span></td></tr>';
    }
    return head("預算與實際比對","逐專案、逐科目比對預算與實支，快速定位超支來源。",{ic:"request_quote",t:"模組 2 · 差異分析"})
      +'<div class="grid g23">'
        +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各專案預算 vs 實支 <span class="sub">單位：萬元</span></h3><div id="c1" class="chart"></div>'
          +'<div class="legend"><span><i style="background:#0369a1"></i>預算</span><span><i style="background:#f97316"></i>實支</span></div></div>'
        +'<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>科目差異明細 <span class="sub">RD-2405</span></h3>'
          +'<div class="tbl-wrap"><table><thead><tr><th>成本科目</th><th>預算</th><th>實支</th><th>差異</th><th>比率</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
      +'</div>';
  }
  function d1(){
    var cats=[]; var bud=[]; var act=[];
    for(var i=0;i<PROJECTS.length;i++){ cats.push(PROJECTS[i].code); bud.push(Math.round(PROJECTS[i].budget/10000)); act.push(Math.round(PROJECTS[i].actual/10000)); }
    mk("c1",{
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
      grid:{left:8,right:14,top:18,bottom:22,containLabel:true},
      xAxis:{type:"category",data:cats,axisLabel:{fontSize:11}},
      yAxis:{type:"value",axisLabel:{fontSize:11}},
      series:[
        {name:"預算",type:"bar",data:bud,itemStyle:{color:"#0369a1",borderRadius:[4,4,0,0]},barGap:0},
        {name:"實支",type:"bar",data:act,itemStyle:{color:"#f97316",borderRadius:[4,4,0,0]}}
      ]
    });
  }

  // ===== SCREEN 2 : 目標成本設定 =====
  function s2(){
    var price=13800, margin=28;
    var allow=Math.round(price*(1-margin/100));
    var cur=11200; var gap=cur-allow;
    var mods=[
      {n:"主控晶片",tc:3600,cur:3980},{n:"電源模組",tc:2200,cur:2340},
      {n:"感測單元",tc:1800,cur:1720},{n:"外殼結構",tc:1200,cur:1260},
      {n:"軟韌體授權",tc:1100,cur:1060},{n:"組裝測試",tc:800,cur:840}
    ];
    var gr="";
    for(var i=0;i<mods.length;i++){ var m=mods[i]; var d=m.cur-m.tc;
      gr+='<div class="gaprow"><span>'+m.n+'</span><span><span class="mini">目標 '+money(m.tc)+'</span> &nbsp; <b style="color:'+(d>0?'#dc2626':'#16a34a')+'">'+(d>0?'+':'')+money(d)+'</b></span></div>';
    }
    var achieve=Math.round(allow/cur*100);
    return head("目標成本設定 (Target Costing)","由市場售價回推可容許成本，拆解至各功能模組並追蹤缺口。",{ic:"trending_up",t:"模組 3 · 目標成本"})
      +'<div class="grid g32">'
        +'<div class="card"><h3><span class="material-symbols-outlined">adjust</span>目標達成概況</h3>'
          +'<div class="target-hero"><div class="ring"><div id="c2r" class="chart" style="height:150px"></div>'
            +'<div class="rc"><b>'+achieve+'%</b><span>成本達成率</span></div></div>'
          +'<div class="gapbox">'
            +'<div class="gaprow"><span>市場售價</span><b>'+money(price)+' 元</b></div>'
            +'<div class="gaprow"><span>目標毛利率</span><b>'+margin+'%</b></div>'
            +'<div class="gaprow"><span>可容許成本</span><b style="color:#0369a1">'+money(allow)+' 元</b></div>'
            +'<div class="gaprow"><span>目前試算成本</span><b>'+money(cur)+' 元</b></div>'
            +'<div class="gaprow"><span>需消除缺口</span><b style="color:#dc2626">'+money(gap)+' 元</b></div>'
          +'</div></div></div>'

    }

      {n:"AI SoC 主控晶片",v:3980,min:3200,max:4600},
      {n:"LPDDR4 記憶體",v:1160,min:800,max:1500},
      {n:"鋁合金外殼",v:1260,min:900,max:1600}

          +'<p class="mini" style="margin:0 0 8px">拖動關鍵料件單價，即時觀察單位成本與目標缺口變化。</p>'+sh

  function bomSim(){
    var ranges=document.querySelectorAll('.simrow input[type=range]');

    for(var i=0;i<ranges.length;i++){ var base=+ranges[i].getAttribute('data-base'); var v=+ranges[i].value;
      delta += (v-base); if(qids[i]) qids[i].textContent=money(v);
    }
    var nt=bomTotal()+delta;
    var el=document.getElementById('simtot'); if(el) el.textContent=money(nt)+' 元';
    var allow=9936;
    if(CH[0]){ CH[0].setOption({series:[{data:[{value:nt,name:"試算成本"},{value:Math.max(allow-nt,0),name:"目標餘裕"}]}]}); }
  }
