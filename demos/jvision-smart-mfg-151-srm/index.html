<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>供應商關係管理系統（SRM）｜Jvision 系統 Demo</title>
  <meta name="description" content="供應商協同、詢比議價到交期風險控管" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#f5f3ff;
      --bg:#f4f5fb; --panel:#ffffff; --line:#e7e4f2; --ink:#1e1b2e; --muted:#726e83;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
      --shadow:0 1px 2px rgba(30,27,46,.05),0 8px 24px rgba(109,40,217,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    a{color:inherit;text-decoration:none}

    /* top nav */
    .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#3b1a78,#6d28d9 55%,#7c3aed);color:#fff;box-shadow:0 4px 18px rgba(60,20,120,.25);}
    .topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto;}
    .brand .logo .ms{font-size:22px;color:#fff}
    .brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
    .brand span{font-size:11px;opacity:.8;display:block;margin-top:1px}
    .topbar .spacer{flex:1 1 auto}
    .env{font-size:11px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;white-space:nowrap;display:flex;align-items:center;gap:5px}
    .env .ms{font-size:14px}
    .who{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .who .av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
    .who small{display:block;font-size:11px;opacity:.82}

    nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
    .tabs-in{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:4px;flex-wrap:wrap;min-width:0;}
    .tab{appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;color:var(--muted);
      padding:13px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;position:relative;min-width:0;white-space:nowrap;}
    .tab .ms{font-size:19px}
    .tab:hover{color:var(--accent)}
    .tab.on{color:var(--accent)}
    .tab.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);}

    main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0;}
    .screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-width:0;}
    .screen-head h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.2px;display:flex;align-items:center;gap:9px;}
    .screen-head h1 .ms{color:var(--accent);font-size:24px}
    .screen-head p{margin:0;color:var(--muted);font-size:13px}
    .screen-head .sp{flex:1 1 auto}
    .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:12.5px;
      padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
    .btn .ms{font-size:17px}
    .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.pri:hover{background:#5b21b6}
    .btn.gho:hover{border-color:var(--accent);color:var(--accent)}

    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:1.6fr 1fr}
    .g32{grid-template-columns:1fr 1.5fr}
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
    }

    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;}
    .card.pad{padding:15px 16px}
    .card-h{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line);min-width:0;}
    .card-h .ms{color:var(--accent);font-size:20px}
    .card-h b{font-size:14px;font-weight:800}
    .card-h small{color:var(--muted);font-size:11.5px}
    .card-h .sp{flex:1 1 auto}
    .card-b{padding:14px 16px;min-width:0}

    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden;}
    .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
    .kpi .lab .ms{font-size:16px;color:var(--accent2)}
    .kpi .val{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-.5px;line-height:1}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .delta{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px}
    .kpi .delta .ms{font-size:14px}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}

    .chart{width:100%;height:260px;overflow:hidden}
    .chart.sm{height:210px}
    .chart.lg{height:300px}

    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9fe;}
    tbody td{padding:10px 12px;border-bottom:1px solid #f1eff8;vertical-align:middle;}
    tbody tr:hover{background:#faf8ff}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 14px 14px;}

    .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
    .p-ok{background:#e8f6ec;color:#15803d}
    .p-warn{background:#fdf0dd;color:#b45309}
    .p-bad{background:#fdeaea;color:#c81e1e}
    .p-info{background:#e8eefe;color:#1d4ed8}
    .p-mute{background:#f0eef7;color:#6b6780}
    .p-vio{background:#f2ecfd;color:#6d28d9}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

    .tier{font-weight:900;font-size:12px;width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;color:#fff}
    .t-A{background:#6d28d9}.t-B{background:#8b5cf6}.t-C{background:#c4b5fd;color:#4c1d95}.t-D{background:#e5e0f5;color:#6b6780}

    .bar{height:7px;border-radius:6px;background:#eee7fb;overflow:hidden;min-width:60px}
    .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

    /* KANBAN board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    @media(max-width:900px){.board{grid-template-columns:1fr}}
    .col{background:#f7f5fd;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:9px;}
    .col-h{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;padding:2px 4px 6px;border-bottom:2px solid var(--accent2);}
    .col-h .n{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 8px;color:var(--muted);font-weight:800}
    .col-h .ms{font-size:16px;color:var(--accent)}
    .kc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;box-shadow:0 1px 2px rgba(30,27,46,.04);cursor:grab;min-width:0;}
    .kc .top{display:flex;align-items:center;gap:6px;justify-content:space-between}
    .kc .rid{font-size:10.5px;font-weight:800;color:var(--accent)}
    .kc .tt{font-weight:800;font-size:13px;margin:6px 0 4px;line-height:1.35}
    .kc .meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .kc .meta span{display:inline-flex;align-items:center;gap:3px}
    .kc .meta .ms{font-size:13px}
    .kc .ppl{display:flex;align-items:center;gap:6px;margin-top:9px}
    .mini-av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:10px;border:1px solid var(--line)}

    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl-i{position:relative;padding:0 0 16px 0}
    .tl-i:last-child{padding-bottom:0}
    .tl-i .dotm{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
    .tl-i.done .dotm{background:var(--accent);border-color:var(--accent)}
    .tl-i .tm{font-size:11px;color:var(--muted);font-weight:700}
    .tl-i .tx{font-size:13px;font-weight:700;margin-top:2px}
    .tl-i .tx small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}

    .list{display:flex;flex-direction:column}
    .li{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid #f1eff8;min-width:0}
    .li:last-child{border-bottom:0}
    .li .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
    .li .ic .ms{font-size:20px}
    .li .g{flex:1 1 auto;min-width:0}
    .li .g b{font-size:13px;font-weight:800;display:block}
    .li .g small{font-size:11.5px;color:var(--muted)}
    .li .rt{text-align:right;flex:0 0 auto}

    .rank{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #f1eff8}
    .rank:last-child{border-bottom:0}
    .rank .no{width:24px;height:24px;border-radius:7px;background:#f0eef7;color:var(--muted);font-weight:900;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
    .rank .no.top{background:var(--accent);color:#fff}
    .rank .nm{flex:1 1 auto;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rank .sc{font-weight:900;font-size:14px;color:var(--accent)}

    .seg{display:inline-flex;background:#f0eef7;border-radius:9px;padding:3px;gap:2px}
    .seg b{font-size:12px;font-weight:700;color:var(--muted);padding:5px 11px;border-radius:7px;cursor:default}
    .seg b.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}

    .gauge-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
    .muted{color:var(--muted)}
    .num{font-variant-numeric:tabular-nums}

    .scar{border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0}
    .scar .sh{display:flex;align-items:center;gap:8px;justify-content:space-between}
    .scar .code{font-weight:900;color:var(--bad);font-size:13px}
    .scar .stg{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
    .stp{flex:1 1 0;min-width:64px;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:8px;background:#f7f5fd;border:1px solid var(--line)}
    .stp.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .stp.done{background:#ede7fb;color:var(--accent);border-color:#ddd2f6}

    .foot{max-width:1360px;margin:0 auto;padding:18px;color:var(--muted);font-size:11.5px;text-align:center}

    @media(max-width:560px){
      .tab span.t{display:none}
      .tab{padding:13px 12px}
      .who small{display:none}
      .env{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="ms">hub</span></div>
        <div><b>Jvision SRM</b><span>供應商關係管理系統</span></div>
      </div>
      <div class="spacer"></div>
      <div class="env"><span class="ms">cloud_done</span>PROD · 台北總部採購中心</div>
      <div class="who">
        <div class="av">陳</div>
        <div><b style="font-size:12.5px">陳采瑜</b><small>採購主管</small></div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <div class="tabs-in" id="tabs"></div>
  </nav>

  <main id="app"></main>

  <div class="foot">Jvision 系統 Demo · 純前端展示 · 資料皆為模擬 · 供應商關係管理系統（SRM）</div>

  <script>
  (function(){
    "use strict";

    var NAV=[
      {i:0,ic:"groups",t:"供應商主檔"},
      {i:1,ic:"request_quote",t:"詢比議價"},
      {i:2,ic:"monitoring",t:"績效評鑑"},
      {i:3,ic:"warning",t:"交期風險"},
      {i:4,ic:"fact_check",t:"進料品質"},
      {i:5,ic:"insights",t:"採購儀表板"}
    ];

    var app=document.getElementById("app");
    var tabsEl=document.getElementById("tabs");
    var charts=[];

    // build nav
    var nh="";
    for(var k=0;k<NAV.length;k++){
      nh+='<button class="tab" data-i="'+NAV[k].i+'"><span class="ms">'+NAV[k].ic+'</span><span class="t">'+NAV[k].t+'</span></button>';
    }
    tabsEl.innerHTML=nh;
    tabsEl.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]"); if(!b) return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function disposeCharts(){
      for(var c=0;c<charts.length;c++){try{charts[c].dispose();}catch(e){}}
      charts=[];
    }
    function mk(id,opt){
      var el=document.getElementById(id); if(!el) return;
      var ch=echarts.init(el); ch.setOption(opt); charts.push(ch);
    }
    var VIO="#6d28d9",VIO2="#8b5cf6",VIO3="#c4b5fd";
    function baseGrid(l,r,t,b){return{left:l||44,right:r||16,top:t||24,bottom:b||30,containLabel:true};}

    function esc(s){return String(s);}

    /* ============ SCREEN 0 : 供應商主檔（KANBAN 簽名畫面）============ */
    function s0(){
      var kpi=[
        {l:"合格供應商",v:"268",u:"家",d:"+12",dir:"up",ic:"verified"},
        {l:"策略供應商占比",v:"31.4",u:"%",d:"+2.6pt",dir:"up",ic:"trending_up"},
        {l:"待資格審查",v:"14",u:"件",d:"3 逾期",dir:"down",ic:"pending_actions"},
        {l:"近12月流失率",v:"4.8",u:"%",d:"-1.1pt",dir:"up",ic:"logout"}
      ];
      var cols=[
        {t:"待建檔",ic:"note_add",cards:[
          {id:"SUP-0912",nm:"鴻毅精密五金",cat:"CNC 加工",tier:"C",own:"林采潔",loc:"台中",st:"待補文件",sc:"p-warn"},
          {id:"SUP-0918",nm:"泰昇電子材料",cat:"被動元件",tier:"D",own:"周世豪",loc:"新竹",st:"新申請",sc:"p-info"}
        ]},
        {t:"資格審查",ic:"fact_check",cards:[
          {id:"SUP-0806",nm:"永O塑膠工業",cat:"射出成型",tier:"B",own:"陳采瑜",loc:"桃園",st:"現場稽核",sc:"p-vio"},
          {id:"SUP-0831",nm:"聯欣表面處理",cat:"電鍍陽極",tier:"C",own:"林采潔",loc:"高雄",st:"環安查核",sc:"p-warn"},
          {id:"SUP-0844",nm:"宏達包裝材料",cat:"紙箱包材",tier:"C",own:"周世豪",loc:"台南",st:"文件審查",sc:"p-info"}
        ]},
        {t:"分級核定",ic:"grade",cards:[
          {id:"SUP-0512",nm:"日盛半導體零件",cat:"IC 零件",tier:"A",own:"陳采瑜",loc:"新竹",st:"升級 A 級",sc:"p-vio"},
          {id:"SUP-0623",nm:"川輝機械配件",cat:"傳動件",tier:"B",own:"周世豪",loc:"台中",st:"複核中",sc:"p-warn"}
        ]},
        {t:"合格啟用",ic:"verified",cards:[
          {id:"SUP-0301",nm:"友O工具機",cat:"設備供應",tier:"A",own:"陳采瑜",loc:"台中",st:"策略夥伴",sc:"p-ok"},
          {id:"SUP-0417",nm:"大東鋼鐵材料",cat:"金屬原料",tier:"A",own:"林采潔",loc:"高雄",st:"已啟用",sc:"p-ok"},
          {id:"SUP-0489",nm:"茂盛螺絲扣件",cat:"標準件",tier:"B",own:"周世豪",loc:"彰化",st:"已啟用",sc:"p-ok"}
        ]}
      ];

      var boardH="";
      for(var c=0;c<cols.length;c++){
        var col=cols[c],cch="";
        for(var j=0;j<col.cards.length;j++){
          var d=col.cards[j];
          cch+='<div class="kc"><div class="top"><span class="rid">'+d.id+'</span><span class="tier t-'+d.tier+'">'+d.tier+'</span></div>'+
            '<div class="tt">'+d.nm+'</div>'+
            '<span class="pill '+d.sc+'">'+d.st+'</span>'+
            '<div class="meta"><span><span class="ms">category</span>'+d.cat+'</span><span><span class="ms">place</span>'+d.loc+'</span></div>'+
            '<div class="ppl"><span class="mini-av">'+d.own.charAt(0)+'</span><small class="muted">'+d.own+'</small></div></div>';
        }
        boardH+='<div class="col"><div class="col-h"><span class="ms">'+col.ic+'</span>'+col.t+'<span class="n">'+col.cards.length+'</span></div>'+cch+'</div>';
      }

      var kh="";
      for(var m=0;m<kpi.length;m++){var a=kpi[m];
        kh+='<div class="kpi"><div class="lab"><span class="ms">'+a.ic+'</span>'+a.l+'</div>'+
          '<div class="val num">'+a.v+' <small>'+a.u+'</small></div>'+
          '<div class="delta '+(a.dir==="up"?"up":"down")+'"><span class="ms">'+(a.dir==="up"?"north_east":"south_east")+'</span>'+a.d+'</div></div>';
      }

      app.innerHTML=
        '<div class="screen-head"><h1><span class="ms">groups</span>供應商主檔管理</h1>'+
        '<p>建檔、資格審查、分級核定到合格啟用的供應商生命週期看板</p><div class="sp"></div>'+
        '<button class="btn gho"><span class="ms">filter_list</span>篩選</button>'+
        '<button class="btn pri"><span class="ms">person_add</span>新增供應商</button></div>'+
        '<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'+
        '<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="ms">view_kanban</span><b>供應商引進看板</b><small>依作業階段檢視 · 拖曳卡片可推進狀態</small><div class="sp"></div><span class="seg"><b class="on">全部</b><b>策略級</b><b>待處理</b></span></div>'+
        '<div class="card-b"><div class="board">'+boardH+'</div></div></div>'+

        series:[{type:"bar",data:[24,18,14,9,4],barWidth:"55%",itemStyle:{color:function(p){return [VIO,VIO2,VIO3,"#a78bfa","#ddd6fe"][p.dataIndex];},borderRadius:[0,5,5,0]},label:{show:true,position:"right",color:"#6d28d9",fontWeight:700}}]

    /* ============ SCREEN 5 : 採購儀表板 ============ */
    function s5(){
      var kpi=[
        {l:"本季採購金額",v:"$48.6",u:"M",d:"+7.2%",dir:"up",ic:"payments"},
        {l:"採購前置時間",v:"5.1",u:"天",d:"-6.9 天",dir:"up",ic:"schedule"},
        {l:"策略供應商占比",v:"31.4",u:"%",d:"+2.6pt",dir:"up",ic:"trending_up"},
        {l:"綠色採購占比",v:"38.5",u:"%",d:"+5.1pt",dir:"up",ic:"eco"}
      ];
      var kh="";
      for(var m=0;m<kpi.length;m++){var a=kpi[m];
        kh+='<div class="kpi"><div class="lab"><span class="ms">'+a.ic+'</span>'+a.l+'</div><div class="val num">'+a.v+' <small>'+a.u+'</small></div>'+
          '<div class="delta '+(a.dir==="up"?"up":"down")+'"><span class="ms">'+(a.dir==="up"?"north_east":"south_east")+'</span>'+a.d+'</div></div>';
      }
      var esg=[
        {n:"友O工具機",s:"A+",v:92},{n:"大東鋼鐵材料",s:"A",v:88},{n:"日盛半導體零件",s:"A",v:85},
        {n:"永O塑膠工業",s:"B",v:76},{n:"聯欣表面處理",s:"C",v:64}
      ];
      var eh="";
      for(var e=0;e<esg.length;e++){var r=esg[e];
        eh+='<div class="li"><div class="ic" style="background:#ede7fb"><b style="color:#6d28d9;font-size:13px">'+r.s+'</b></div>'+
          '<div class="g"><b>'+r.n+'</b><div class="bar" style="margin-top:5px"><i style="width:'+r.v+'%"></i></div></div>'+
          '<div class="rt num" style="font-weight:800;color:#6d28d9">'+r.v+'</div></div>';
      }

      app.innerHTML=
        '<div class="screen-head"><h1><span class="ms">insights</span>採購分析儀表板</h1>'+
        '<p>採購金額、供應商集中度與 ESG 永續採購綜合分析 · 2026 Q3</p><div class="sp"></div>'+
        '<span class="seg"><b>月</b><b class="on">季</b><b>年</b></span>'+
        '<button class="btn pri" style="margin-left:8px"><span class="ms">summarize</span>產出報表</button></div>'+
        '<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'+
        '<div class="grid g23" style="margin-bottom:16px">'+
          '<div class="card"><div class="card-h"><span class="ms">bar_chart</span><b>各品類採購金額</b><small>本季 vs 上季（百萬元）</small></div><div class="card-b"><div id="c5a" class="chart"></div></div></div>'+
          '<div class="card"><div class="card-h"><span class="ms">pie_chart</span><b>供應商集中度</b><small>採購金額占比</small></div><div class="card-b"><div id="c5b" class="chart"></div></div></div>'+
        '</div>'+
        '<div class="grid g32">'+
          '<div class="card"><div class="card-h"><span class="ms">eco</span><b>ESG 供應商評等</b><small>永續採購 Top 5</small></div><div class="card-b" style="padding-top:6px">'+eh+'</div></div>'+
          '<div class="card"><div class="card-h"><span class="ms">show_chart</span><b>採購前置時間趨勢</b><small>近 6 個月（天）</small></div><div class="card-b"><div id="c5c" class="chart"></div></div></div>'+
        '</div>';

      void app.offsetHeight;
      mk("c5a",{
        tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
        legend:{data:["本季","上季"],top:0,textStyle:{color:"#726e83",fontSize:11}},
        grid:baseGrid(40,16,34,26),
        xAxis:{type:"category",data:["金屬原料","電子零件","機械加工","塑膠包材","設備耗材"],axisLabel:{color:"#726e83",fontSize:10,interval:0,rotate:0}},
        yAxis:{type:"value",axisLabel:{color:"#726e83"},splitLine:{lineStyle:{color:"#f0eef7"}}},
        series:[
          {name:"本季",type:"bar",data:[15.2,12.8,9.4,6.7,4.5],barWidth:"34%",itemStyle:{color:VIO,borderRadius:[5,5,0,0]}},
          {name:"上季",type:"bar",data:[13.9,12.1,9.0,6.2,4.1],barWidth:"34%",itemStyle:{color:VIO3,borderRadius:[5,5,0,0]}}
        ]
      });
      mk("c5b",{
        tooltip:{trigger:"item",formatter:"{b}: {d}%"},
        legend:{bottom:0,textStyle:{color:"#726e83",fontSize:11},itemWidth:10,itemHeight:10},
        series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},labelLine:{show:false},
          data:[
            {value:34,name:"策略供應商 A",itemStyle:{color:VIO}},
            {value:28,name:"優先供應商 B",itemStyle:{color:VIO2}},
            {value:22,name:"一般供應商 C",itemStyle:{color:VIO3}},
            {value:16,name:"其他",itemStyle:{color:"#ddd6fe"}}
          ]}]
      });
      mk("c5c",{
        tooltip:{trigger:"axis"},
        grid:baseGrid(38,16,20,26),
        xAxis:{type:"category",boundaryGap:false,data:["2月","3月","4月","5月","6月","7月"],axisLabel:{color:"#726e83"}},
        yAxis:{type:"value",axisLabel:{color:"#726e83"},splitLine:{lineStyle:{color:"#f0eef7"}}},
        series:[{type:"line",smooth:true,data:[12,10.4,8.6,7.1,6,5.1],lineStyle:{color:VIO,width:3},itemStyle:{color:VIO},areaStyle:{color:"rgba(109,40,217,.12)"},label:{show:true,color:"#6d28d9",fontSize:10}}]
      });
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      disposeCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){
        btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
      }
      SCREENS[i]();
    }

    window.addEventListener("resize",function(){
      for(var c=0;c<charts.length;c++){try{charts[c].resize();}catch(e){}}
    });

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
