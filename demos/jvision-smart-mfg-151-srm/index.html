<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>供應商關係管理系統（SRM）｜Jvision 系統 Demo</title>
  <meta name="description" content="供應商協同、詢比議價到交期風險控管" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;

      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#E2E8F0;

      --ok:#15803D;
      --warn:#A83B05;
      --bad:#DC2626;
      --info:#1D4ED8;
      --panel:#FFFFFF;
      --bg:#F8FAFC;
      --shadow:7px 7px 0 #CBD5E1;
      --border:2px solid var(--ink);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    html,body{margin:0;min-height:100%}
    body{
      color:var(--ink);
      background-color:var(--bg);
      background-image:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:32px 32px;
      font-family:"Fira Sans",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,a{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .ms{
      font-family:"Material Symbols Outlined";
      font-weight:600;
      font-style:normal;
      font-size:20px;
      line-height:1;
      vertical-align:middle;
    }
    :focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }

    .topbar{
      position:sticky;
      inset:0 0 auto;
      z-index:50;
      color:#fff;
      background:var(--ink);
      border-bottom:4px solid var(--color-primary);
    }
    .topbar-in{
      max-width:1440px;
      min-width:0;
      min-height:70px;
      margin:auto;
      padding:10px 22px;
      display:flex;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      flex:none;
      color:#fff;
      background:var(--color-primary);
      border:2px solid #fff;
      box-shadow:4px 4px 0 var(--color-accent);
    }
    .brand b{
      display:block;
      font-size:16px;
      font-weight:700;
      letter-spacing:.06em;
      white-space:nowrap;
    }
    .brand span{display:block;margin-top:2px;font-size:12px;color:#CBD5E1}
    .spacer,.sp{flex:1 1 auto}
    .env{
      display:flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      color:#fff;
      background:#334155;
      border:1px solid #94A3B8;
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-weight:600;
      white-space:nowrap;
    }
    .who{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .who .av,.mini-av{
      display:grid;
      place-items:center;
      flex:none;
      font-weight:700;
      border:2px solid currentColor;
    }
    .who .av{
      width:34px;
      height:34px;
      color:var(--ink);
      background:var(--color-accent);
    }
    .who b{font-size:13px}
    .who small{display:block;color:#CBD5E1;font-size:11px}

    .tabs{
      position:sticky;
      top:70px;
      z-index:40;
      background:var(--panel);
      border-bottom:2px solid var(--ink);
    }
    .tabs-in{
      max-width:1440px;
      min-width:0;
      margin:auto;
      padding:0 18px;
      display:flex;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    .tab{
      appearance:none;
      min-height:52px;
      padding:10px 16px;
      display:flex;
      align-items:center;
      gap:8px;
      flex:none;
      color:var(--muted);
      background:#fff;
      border:0;
      border-left:1px solid var(--line);
      border-right:1px solid transparent;
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
    }
    .tab:last-child{border-right:1px solid var(--line)}
    .tab:hover{color:var(--color-primary);background:var(--color-muted)}
    .tab.on{
      color:#fff;
      background:var(--color-primary);
      box-shadow:inset 0 -5px 0 var(--color-accent);
    }

    main{max-width:1440px;min-width:0;margin:auto;padding:28px 22px 64px}
    .screen-head{
      min-width:0;
      margin-bottom:22px;
      padding:20px;
      display:flex;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      background:var(--panel);
      border:var(--border);
      box-shadow:var(--shadow);
      position:relative;
    }
    .screen-head:before{
      content:"";
      position:absolute;
      top:-2px;
      left:-2px;
      width:112px;
      height:7px;
      background:var(--color-accent);
      border:2px solid var(--ink);
    }
    .screen-head h1{
      margin:0;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:clamp(20px,2vw,27px);
      font-weight:700;
      letter-spacing:-.03em;
    }
    .screen-head h1 .ms{font-size:29px;color:var(--color-primary)}
    .screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .btn{
      appearance:none;
      min-height:42px;
      padding:9px 14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      color:var(--ink);
      background:#fff;
      border:2px solid var(--ink);
      box-shadow:3px 3px 0 var(--ink);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
    .btn:active{transform:translate(3px,3px);box-shadow:none}
    .btn.pri{
      color:#fff;
      background:var(--color-primary);
    }
    .btn.pri:hover{background:#1D4ED8}
    .btn.gho:hover{color:var(--color-primary);background:var(--color-muted)}

    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
    .g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}

    .card,.kpi{
      min-width:0;
      color:var(--color-card-foreground);
      background:var(--color-card);
      border:var(--border);
      box-shadow:var(--shadow);
    }
    .card.pad{padding:17px}
    .card-h{
      min-width:0;
      min-height:51px;
      padding:12px 15px;
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
      background:var(--color-muted);
      border-bottom:2px solid var(--ink);
    }
    .card-h .ms{color:var(--color-primary)}
    .card-h b{font-size:14px;font-weight:700}
    .card-h small{color:var(--muted);font-size:11px}
    .card-b{min-width:0;padding:16px}

    .kpi{
      min-height:136px;
      padding:17px;
      position:relative;
      overflow:hidden;
    }
    .kpi:before{
      content:"";
      position:absolute;
      top:0;
      right:0;
      width:38px;
      height:38px;
      background:
        linear-gradient(135deg,transparent 48%,var(--color-primary) 49%);
    }
    .kpi:nth-child(even):before{
      background:linear-gradient(135deg,transparent 48%,var(--color-accent) 49%);
    }
    .kpi .lab{
      padding-right:26px;
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.025em;
    }
    .kpi .lab .ms{color:var(--color-primary)}
    .kpi .val{
      margin-top:14px;
      font-family:"Fira Code",monospace;
      font-size:29px;
      font-weight:700;
      letter-spacing:-.06em;
      line-height:1;
    }
    .kpi .val small{
      color:var(--muted);
      font-family:"Fira Sans",sans-serif;
      font-size:12px;
      letter-spacing:0;
    }
    .kpi .delta{
      margin-top:10px;
      display:inline-flex;
      align-items:center;
      gap:4px;
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-weight:700;
    }

    .up{color:var(--ok)}
    .down{color:var(--bad)}
    .flat,.muted{color:var(--muted)}
    .num{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }

    .chart{width:100%;height:260px;overflow:hidden}
    .chart.sm{height:210px}
    .chart.lg{height:300px}

    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{
      width:100%;
      min-width:610px;
      border-collapse:collapse;
      font-size:13px;
    }
    thead th{
      padding:11px 12px;
      color:#fff;
      background:var(--ink);
      border:1px solid #64748B;
      text-align:left;
      font-size:11px;
      font-weight:700;
      letter-spacing:.025em;
      white-space:nowrap;
    }
    tbody td{
      padding:11px 12px;
      border:1px solid var(--line);
      vertical-align:middle;
    }
    tbody tr:nth-child(even){background:#F1F5F9}
    tbody tr:hover{background:#DBEAFE}
    td.num{text-align:right}
    tbody td:first-child,
    tbody td:nth-child(4),
    tbody td:nth-child(5),
    tbody td:nth-child(6){
      font-variant-numeric:tabular-nums;
    }

    .pill{
      min-height:25px;
      padding:3px 8px;
      display:inline-flex;
      align-items:center;
      gap:5px;
      border:1px solid currentColor;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }
    .pill:before{
      content:"";
      width:6px;
      height:6px;
      flex:none;
      background:currentColor;
    }
    .p-ok{color:#166534;background:#DCFCE7}
    .p-warn{color:#9A3412;background:#FFEDD5}
    .p-bad{color:#B91C1C;background:#FEE2E2}
    .p-info{color:#1D4ED8;background:#DBEAFE}
    .p-mute{color:#475569;background:#E2E8F0}
    .p-vio{color:#1E40AF;background:#DBEAFE}
    .dot{display:none}

    .tier{
      width:27px;
      height:27px;
      display:inline-grid;
      place-items:center;
      color:#fff;
      border:2px solid var(--ink);
      font-family:"Fira Code",monospace;
      font-size:12px;
      font-weight:700;
    }
    .t-A{background:#1D4ED8}
    .t-B{background:#2563EB}
    .t-C{color:#172554;background:#93C5FD}
    .t-D{color:var(--ink);background:#CBD5E1}

    .bar{
      height:9px;
      min-width:60px;
      overflow:hidden;
      background:#DBEAFE;
      border:1px solid var(--ink);
    }
    .bar>i{display:block;height:100%;background:var(--color-primary)}

    .board{
      min-width:0;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:13px;
    }
    .col{
      min-width:0;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
      background:#EFF6FF;
      border:2px solid var(--ink);
    }
    .col:nth-child(even){background:#F8FAFC}
    .col-h{
      padding:4px 2px 9px;
      display:flex;
      align-items:center;
      gap:7px;
      border-bottom:4px solid var(--color-primary);
      font-size:13px;
      font-weight:700;
    }
    .col-h .ms{color:var(--color-primary)}
    .col-h .n{
      margin-left:auto;
      padding:2px 7px;
      color:#fff;
      background:var(--ink);
      border:1px solid var(--ink);
      font-family:"Fira Code",monospace;
      font-size:10px;
    }
    .kc{
      min-width:0;
      padding:11px;
      background:#fff;
      border:2px solid var(--ink);
      box-shadow:3px 3px 0 #94A3B8;
      cursor:grab;
    }
    .kc:hover{box-shadow:5px 5px 0 var(--color-primary)}
    .kc .top{display:flex;align-items:center;justify-content:space-between;gap:7px}
    .kc .rid{
      color:var(--color-primary);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
    }
    .kc .tt{margin:8px 0 6px;font-size:13px;font-weight:700;line-height:1.35}
    .kc .meta{
      margin-top:8px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color:var(--muted);
      font-size:11px;
    }
    .kc .meta span{display:inline-flex;align-items:center;gap:3px}
    .kc .meta .ms{font-size:14px}
    .kc .ppl{margin-top:10px;display:flex;align-items:center;gap:6px}
    .mini-av{
      width:24px;
      height:24px;
      color:var(--color-primary);
      background:#DBEAFE;
      font-size:10px;
    }

    .tl{position:relative;padding-left:30px}
    .tl:before{
      content:"";
      position:absolute;
      top:3px;
      bottom:3px;
      left:10px;
      width:3px;
      background:var(--ink);
    }
    .tl-i{position:relative;padding-bottom:17px}
    .tl-i:last-child{padding-bottom:0}
    .tl-i .dotm{
      position:absolute;
      top:1px;
      left:-27px;
      width:17px;
      height:17px;
      background:#fff;
      border:3px solid var(--color-primary);
    }
    .tl-i.done .dotm{
      background:var(--color-primary);
      box-shadow:inset 0 0 0 3px #fff;
    }
    .tl-i .tm{
      color:var(--muted);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
    }
    .tl-i .tx{margin-top:2px;font-size:13px;font-weight:700}
    .tl-i .tx small{
      margin-top:3px;
      display:block;
      color:var(--muted);
      font-size:11px;
      font-weight:400;
    }

    .list{display:flex;flex-direction:column}
    .li{
      min-width:0;
      padding:12px 4px;
      display:flex;
      align-items:center;
      gap:11px;
      border-bottom:2px solid var(--line);
    }
    .li:last-child{border-bottom:0}
    .li .ic{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      flex:none;
      color:var(--color-primary);
      background:#DBEAFE;
      border:2px solid var(--ink);
    }
    .li .g{min-width:0;flex:1}
    .li .g b{display:block;font-size:13px;font-weight:700}
    .li .g small{color:var(--muted);font-size:11px}
    .li .rt{flex:none;text-align:right}

    .rank{
      padding:10px 0;
      display:flex;
      align-items:center;
      gap:11px;
      border-bottom:2px solid var(--line);
    }
    .rank:last-child{border-bottom:0}
    .rank .no{
      width:26px;
      height:26px;
      display:grid;
      place-items:center;
      flex:none;
      color:var(--ink);
      background:#E2E8F0;
      border:1px solid var(--ink);
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-weight:700;
    }
    .rank .no.top{color:#fff;background:var(--color-primary)}
    .rank .nm{
      min-width:0;
      flex:1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:13px;
      font-weight:700;
    }
    .rank .sc{
      color:var(--color-primary);
      font-size:14px;
      font-weight:700;
    }

    .seg{
      padding:3px;
      display:inline-flex;
      gap:2px;
      background:#E2E8F0;
      border:2px solid var(--ink);
    }
    .seg b{
      min-height:30px;
      padding:6px 11px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      cursor:default;
    }
    .seg b.on{color:#fff;background:var(--color-primary)}

    .scar{
      min-width:0;
      padding:13px;
      border:2px solid var(--ink);
      box-shadow:3px 3px 0 #CBD5E1;
    }
    .scar .sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .scar .code{
      color:var(--bad);
      font-family:"Fira Code",monospace;
      font-size:13px;
      font-weight:700;
    }
    .scar .stg{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}
    .stp{
      min-width:64px;
      padding:7px 4px;
      flex:1;
      color:var(--muted);
      background:#F1F5F9;
      border:1px solid var(--ink);
      text-align:center;
      font-size:10px;
      font-weight:700;
    }
    .stp.on{color:#fff;background:var(--color-primary);border-color:var(--ink)}
    .stp.on:before{content:"▶ ";font-size:8px}
    .stp.done{color:#1E40AF;background:#DBEAFE}
    .stp.done:before{content:"✓ "}

    .foot{
      max-width:1440px;
      margin:auto;
      padding:22px;
      color:#334155;
      background:rgba(248,250,252,.92);
      border-top:2px solid var(--ink);
      text-align:center;
      font-family:"Fira Code",monospace;
      font-size:11px;
    }

    @media(min-width:821px){
      .grid-item,.kpi,.card,.kc{
        animation:grid-in .4s backwards;
      }
      .grid-item:nth-child(2),.kpi:nth-child(2),.card:nth-child(2),.kc:nth-child(2){animation-delay:.06s}
      .grid-item:nth-child(3),.kpi:nth-child(3),.card:nth-child(3),.kc:nth-child(3){animation-delay:.12s}
      .grid-item:nth-child(4),.kpi:nth-child(4),.card:nth-child(4),.kc:nth-child(4){animation-delay:.18s}
      @keyframes grid-in{
        0%{opacity:0;transform:translateY(16px) scale(.92)}
        75%{transform:translateY(-2px) scale(1.01)}
        100%{opacity:1;transform:none}
      }
    }
    @media(max-width:1024px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .board{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:820px){
      .tabs{top:70px}
      .g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .screen-head{align-items:flex-start}
      .screen-head .sp{flex-basis:100%}
    }
    @media(max-width:600px){
      .topbar-in{min-height:62px;padding:9px 14px}
      .tabs{top:62px}
      main{padding:20px 14px 50px}
      .g4,.board{grid-template-columns:1fr}
      .tab{min-width:52px;justify-content:center;padding:10px 15px}
      .tab .t{display:none}
      .env{display:none}
      .who small{display:none}
      .screen-head{padding:18px 14px}
      .screen-head p{flex-basis:100%}
      .screen-head .btn{flex:1}
      .card-b{padding:12px}
      .kpi{min-height:125px}
      .chart{height:240px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
      }
      .grid-item,.kpi,.card,.kc{opacity:1!important;transform:none!important}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="ms">hub</span></div>
        <div><b>JVISION // SRM</b><span>供應商關係管理系統</span></div>
      </div>
      <div class="spacer"></div>
      <div class="env"><span class="ms">cloud_done</span>PROD · 台北總部採購中心</div>
      <div class="who">
        <div class="av">陳</div>
        <div><b>陳采瑜</b><small>採購主管</small></div>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="系統功能">
    <div class="tabs-in" id="tabs"></div>
  </nav>

  <main id="app"></main>

        {lot:"IQC-2408-0513",sup:"O欣表面處理",item:"陽極面板",qty:"640 pcs",res:"特採",sc:"p-warn",aql:"1.5"},

      mk("c4a",{
        tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
        grid:baseGrid(44,16,18,26),
        xAxis:{type:"value",axisLabel:{color:AXIS},splitLine:{lineStyle:{color:GRID}}},
        yAxis:{type:"category",data:["尺寸偏差","外觀刮傷","膜厚不足","粗糙度","混料"],axisLabel:{color:AXIS,fontSize:11},inverse:true},
        series:[{type:"bar",data:[24,18,14,9,4],barWidth:"55%",itemStyle:{color:function(p){return[BLUE,BLUE2,PALE,ORANGE,"#CBD5E1"][p.dataIndex]}},label:{show:true,position:"right",color:BLUE,fontWeight:700}}]
      });
    }

          {l:"綠色採購占比",v:"38.5",u:"%",d:"+5.1pt",dir:"up",ic:"eco"}
        ])+'</div>'+
        '<div class="grid g23" style="margin-bottom:18px"><section class="card"><div class="card-h"><span class="ms" aria-hidden="true">bar_chart</span><b>各品類採購金額</b><small>本季 vs 上季（百萬元）</small></div><div class="card-b"><div id="c5a" class="chart"></div></div></section><section class="card"><div class="card-h"><span class="ms" aria-hidden="true">pie_chart</span><b>供應商集中度</b><small>採購金額占比</small></div><div class="card-b"><div id="c5b" class="chart"></div></div></section></div>'+

      mk("c5a",{

        legend:{data:["本季","上季"],top:0,textStyle:{color:AXIS,fontSize:11}},
        grid:baseGrid(40,16,34,26),

        yAxis:{type:"value",axisLabel:{color:AXIS},splitLine:{lineStyle:{color:GRID}}},
        series:[{type:"line",data:[12,10.4,8.6,7.1,6,5.1],lineStyle:{color:BLUE,width:3},itemStyle:{color:BLUE},areaStyle:{color:"rgba(37,99,235,.14)"},label:{show:true,color:"#1D4ED8",fontSize:10,fontWeight:700}}]
      });
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function show(index){
      index=Math.max(0,Math.min(index,SCREENS.length-1));
      disposeCharts();
      document.querySelectorAll("[data-i]").forEach(function(button){
        var selected=Number(button.getAttribute("data-i"))===index;
        button.classList.toggle("on",selected);
        button.setAttribute("aria-current",selected?"page":"false");
      });
      SCREENS[index]();
    }

    window.addEventListener("resize",function(){
      charts.forEach(function(chart){try{chart.resize()}catch(e){}});
    });

    function fromHash(){
      var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      var count=document.querySelectorAll("[data-i]").length||6;
      show(match?Math.min(Number(match[1]),count-1):0);
      try{window.scrollTo(0,0)}catch(e){}
    }

    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
