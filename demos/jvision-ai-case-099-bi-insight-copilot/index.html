<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BI 洞察報表台 · BI Insight Copilot</title>
<meta name="description" content="多源資料接入、指標下鑽、AI 洞察歸因到平衡計分卡與報表排程發布（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0d9488;--accent2:#2dd4bf;--accent3:#5eead4;--deep:#0f3d38;--ink:#0c2b28;--bg:#eef4f3;--card:#fff;--line:#dbe8e6;--soft:#eef7f5;--mut:#5b7370;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0369a1}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* shell */
.shell{display:flex;min-height:100vh;align-items:stretch}
/* sidebar */
.side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(13,148,136,.32)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:900;font-family:"Noto Sans TC";display:block;line-height:1.2}
.brand span{font-size:9.5px;color:var(--mut);letter-spacing:2px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px;padding:8px 12px;min-width:0}
.nav button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;font-family:"Noto Sans TC";white-space:nowrap;min-width:0}
.nav button .material-symbols-outlined{font-size:20px;color:var(--mut);flex:none}
.nav button .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav button .badge{font-size:10px;font-weight:800;background:#fecaca;color:#b91c1c;border-radius:999px;padding:1px 7px;flex:none}
.nav button:hover{background:var(--soft)}
.nav button.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff}
.nav button.on .material-symbols-outlined{color:#fff}
.nav button.on .badge{background:rgba(255,255,255,.28);color:#fff}
.side .who{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;min-width:0}
.side .who .av{width:36px;height:36px;border-radius:50%;background:var(--accent2);color:var(--deep);font-weight:900;display:grid;place-items:center;flex:none;font-size:14px}
.side .who b{font-size:12.5px;display:block}
.side .who small{font-size:11px;color:var(--mut)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1180px;width:100%;margin:0 auto;padding:22px 24px 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;display:flex;align-items:center;gap:9px}
.vh h2 .material-symbols-outlined{color:var(--accent);font-size:26px}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--accent);padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line)}
.pill .material-symbols-outlined{font-size:16px}
/* grids */
.grid,.g2,.g3,.g4,.g21,.g12,.g23{display:grid;gap:15px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.5fr 1fr}
.g12{grid-template-columns:1fr 1.5fr}
.g23{grid-template-columns:1.3fr .9fr}
.grid>*,.g2>*,.g3>*,.g4>*,.g21>*,.g12>*,.g23>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent)}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.65}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:25px;font-weight:900;margin-top:5px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.22}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* tags */
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#eef2f6;color:#64748b}.t-ac{background:var(--soft);color:var(--accent)}
/* table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft);letter-spacing:.03em}
table.data td.num{text-align:right;font-family:Inter;font-weight:700}
table.data tr:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.chart{width:100%}
/* bars in cells */
.mbar{display:inline-block;height:7px;border-radius:999px;background:var(--accent);vertical-align:middle}
/* datasource nodes (screen1) */
.srcline{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.srcline:first-of-type{border-top:0}
.srcline .fi{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.srcline .in{flex:1;min-width:0}.srcline .in b{font-size:13px}.srcline .in small{display:block;color:var(--mut);font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
/* metric governance cards */
.metdef{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;border-left:4px solid var(--accent)}
.metdef.warn{border-left-color:var(--warn);background:#fffdf5}
.metdef .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metdef .nm{font-size:13px;font-weight:800;font-family:"Noto Sans TC"}
.metdef .fx{font-size:11.5px;color:var(--mut);margin-top:5px;font-family:Inter}
.metdef .fx code{background:var(--soft);padding:1px 6px;border-radius:6px;color:var(--accent);font-weight:700}
/* drill breadcrumb */
.crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--soft);border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:700;margin-bottom:13px}
.crumb .material-symbols-outlined{font-size:16px;color:var(--mut)}
.crumb .cur{color:var(--accent)}
/* drill rows */
.dbar{display:flex;flex-direction:column;gap:9px}
.dr{display:flex;align-items:center;gap:11px}
.dr .dn{width:96px;flex:none;font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .track{flex:1;height:26px;border-radius:8px;background:var(--soft);position:relative;overflow:hidden;min-width:0}
.dr .track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;display:block}
.dr .track b{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;font-size:11.5px;font-weight:800;font-family:Inter}
.dr .chg{width:62px;flex:none;text-align:right;font-size:12px;font-weight:800;font-family:Inter}
/* ai insight cards */
.ins{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;border-left:4px solid var(--accent);position:relative}
.ins+.ins{margin-top:12px}
.ins.up{border-left-color:var(--ok)}.ins.down{border-left-color:var(--bad)}.ins.watch{border-left-color:var(--warn)}
.ins .ih{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.ins .ih .bx{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;background:var(--accent)}
.ins.up .ih .bx{background:var(--ok)}.ins.down .ih .bx{background:var(--bad)}.ins.watch .ih .bx{background:var(--warn)}
.ins .ih b{font-size:13.5px;font-family:"Noto Sans TC"}
.ins .ih .cf{margin-left:auto;font-size:11px;font-weight:800;color:var(--mut);flex:none}
.ins p{margin:0;font-size:12.5px;line-height:1.7;color:#334744}
.ins .act{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:999px;padding:4px 11px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .material-symbols-outlined{font-size:14px}
/* scorecard matrix */
.sc-persp{margin-bottom:14px}.sc-persp:last-child{margin-bottom:0}
.sc-persp .ph{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;font-family:"Noto Sans TC";margin-bottom:9px}
.sc-persp .ph .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sc-persp .ph .pw{margin-left:auto;font-size:11px;color:var(--mut);font-weight:700}
.kpicard{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;position:relative;overflow:hidden}
.kpicard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.kpicard.g::after{background:var(--ok)}.kpicard.y::after{background:var(--warn)}.kpicard.r::after{background:var(--bad)}
.kpicard .kn{font-size:12px;font-weight:700;color:var(--mut);font-family:"Noto Sans TC"}
.kpicard .kv{font-size:19px;font-weight:900;font-family:Inter;margin-top:3px}
.kpicard .kt{font-size:11px;color:var(--mut);margin-top:2px}
.kpicard .kbar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:7px}
.kpicard .kbar i{display:block;height:100%}
/* report schedule */
.repline{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.repline:first-of-type{border-top:0}
.repline .ri{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.repline .in{flex:1;min-width:0}.repline .in b{font-size:13px}.repline .in small{display:block;color:var(--mut);font-size:11.5px}
.repline .rt{text-align:right;flex:none}.repline .rt .dt{font-size:11px;color:var(--mut);margin-top:3px}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlr{position:relative;padding:0 0 15px}.tlr:last-child{padding-bottom:0}
.tlr::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tlr b{font-size:12.5px;font-family:"Noto Sans TC"}
.tlr small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.tlr .tm{font-size:11px;color:var(--accent);font-weight:800;font-family:Inter}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:11px}
.sc{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.sc b{display:block;font-size:20px;font-weight:900;color:var(--ink);font-family:Inter}
.sc span{font-size:11px;color:var(--mut)}
.okbox{background:#dcfce7;color:#15803d;border-radius:11px;padding:11px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.warnbox{background:#fef3c7;color:#b45309;border-radius:11px;padding:11px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
/* responsive */
@media(max-width:820px){.g4,.g3,.g2,.g21,.g12,.g23{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .shell{display:block}
  .side{width:auto;height:auto;position:static;flex-direction:column;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:14px 16px 10px}
  .nav{flex-direction:row;flex-wrap:wrap;padding:0 12px 12px}
  .nav button{flex:none;white-space:nowrap;gap:7px;padding:8px 12px;font-size:12.5px;border:1px solid var(--line)}
  .nav button.on{border-color:transparent}
  .nav button .lbl{flex:none}
  .side .who{display:none}
}
@media(max-width:560px){
  .wrap{padding:16px 14px 40px}
  .nav button .lbl{display:none}
  .nav button{padding:9px}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo"><span class="material-symbols-outlined">insights</span></div><div><b>BI 洞察報表台</b><span>BI INSIGHT COPILOT</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="av">婷</span><div><b>王思婷</b><small>資料分析師 · 營運分析組</small></div></div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="vh"><div><h2 id="vt"><span class="material-symbols-outlined" id="vi">space_dashboard</span><span id="vtt">經營戰情總覽</span></h2><p id="vd"></p></div><span class="pill" id="vpill"><span class="material-symbols-outlined">update</span>資料更新 2026-08-13 08:10</span></div>
      <div id="view"></div>
    </div>
  </main>
</div>
<script>
var MOD=[
["經營戰情總覽","space_dashboard","營收獲利與關鍵指標即時彙整、跨事業體比較與異常提醒",""],
["資料源與口徑","hub","ERP/CRM/試算表多源接入狀態與指標定義治理",""],
["指標下鑽分析","manage_search","針對異常指標逐層鑽取到事業體、通路與明細","2"],
["AI 洞察偵測","auto_awesome","自動歸因異常與機會並生成洞察摘要草稿","3"],
["平衡計分卡","flag","四大構面策略目標與 KPI 達成率燈號追蹤",""],
["報表排程發布","schedule_send","報表排程產出、訂閱名單與版本發布紀錄",""]];

/* ---- fake data ---- */
// 事業體 KPI 明細: [名稱, 營收(萬), 月增%, 毛利率%, 達成率%, 燈號]
var BU=[
["消費電子","18420",8.4,31.2,104,"g"],
["工業自動化","12680",-3.1,27.5,92,"y"],
["醫療器材","7360",14.6,42.8,111,"g"],
["雲端服務","9540",5.2,55.1,98,"y"],
["車用電子","5210",-9.8,24.3,78,"r"],
["零組件通路","6870",2.1,15.6,95,"y"]];
// 資料源: [名稱, icon, 明細, 狀態(g/y/r), 更新, 筆數]
var SRC=[
["ERP 財務總帳","account_balance","營收 / 成本 / 費用主檔","g","08:05 完成","1.2M 列"],
["CRM 商機管線","diversity_3","商機 / 訂單 / 客戶","g","08:07 完成","486K 列"],
["電商後台","shopping_cart","流量 / 轉換 / 客單","g","08:02 完成","3.4M 列"],
["ERP 存貨模組","inventory","庫存 / 週轉 / 呆滯","y","07:58 部分延遲","902K 列"],
["行銷投放平台","campaign","廣告花費 / ROAS","y","口徑待對齊","210K 列"],
["人工試算表","table_view","區域預算 / 目標","r","欄位缺漏待補","—"]];
// 指標口徑: [名稱, 公式, 口徑一致?(ok/warn), 說明]
var METRIC=[
["營收(認列)","net_revenue = 出貨金額 − 退貨 − 折讓","ok","全公司統一以認列制計算"],
["毛利率","gross_margin = (營收 − 銷貨成本) / 營收","ok","含分攤製造費用"],
["客戶獲取成本","CAC = 行銷+業務費用 / 新客數","warn","行銷投放與 CRM 新客定義不一致"],
["回購率","repeat_rate = 90 天內回購客數 / 活躍客數","ok","以下單日為基準"],
["存貨週轉","inv_turnover = 銷貨成本 / 平均存貨","warn","存貨模組延遲，暫用前日快照"]];
// 下鑽 車用電子 → 通路: [名稱, 值(萬), 佔比%, 月增%, 色]
var DRILL=[
["原廠供應(OEM)",2680,51,-14.2,"#0d9488"],
["售後維修(AM)",1240,24,-3.5,"#2dd4bf"],
["經銷通路",760,15,-18.6,"#5eead4"],
["直營電商",320,6,6.2,"#99f6e4"],
["專案標案",210,4,-22.0,"#f59e0b"]];
// 下鑽明細品項: [品項, 營收(萬), 月增%, 主因]
var DITEM=[
["車載資訊娛樂主機",980,-21.4,"歐系客戶減單"],
["ADAS 感測模組",720,-8.2,"晶片交期延後"],
["車用電源管理 IC",640,-15.9,"庫存去化中"],
["儀表顯示模組",410,4.1,"新專案量產"],
["充電控制器",280,12.5,"電動車需求升"]];

function show(i){
 nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
 vt.textContent=MOD[i][0];vd.textContent=MOD[i][2];vi.textContent=MOD[i][1];
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
