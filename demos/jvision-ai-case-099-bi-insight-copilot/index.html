:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans","Microsoft JhengHei",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:5}
.brand{min-height:78px;padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:4px;box-shadow:5px 5px 0 #BFDBFE}
.brand b{display:block;font-size:15px;line-height:1.25;color:var(--ink)}

.nav button{position:relative;width:100%;min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:11px;text-align:left;font-weight:600;font-size:13px;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease}

.main{min-width:0}
.topbar{height:54px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:flex-end;gap:10px;position:sticky;top:0;z-index:4;backdrop-filter:blur(8px)}

.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #DCFCE7}
.wrap{width:min(1220px,100%);margin:auto;padding:24px 26px 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.eyebrow{margin:0 0 5px;color:var(--blue);font:700 10px "Fira Code";letter-spacing:.14em;text-transform:uppercase}

.pill{display:inline-flex;align-items:center;gap:7px;flex:none;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font:500 10.5px "Fira Code"}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1.55fr 1fr}.g12{grid-template-columns:1fr 1.55fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0;background:var(--color-card);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:var(--shadow)}

.card-title svg{color:var(--blue)}
.grow{margin-left:auto;color:var(--muted);font:500 10.5px "Fira Code"}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:5px;padding:14px 15px;box-shadow:var(--shadow);transition:transform .22s ease,border-color .22s ease}
.kpi:hover{transform:translateY(-2px);border-color:#93C5FD}
.kpi:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue)}
.kpi.warn:before{background:var(--color-accent)}
.kpi .label{color:var(--muted);font-size:11.5px;font-weight:600}
.kpi .value{margin-top:5px;font:700 25px "Fira Code";letter-spacing:-.05em;color:var(--ink)}
.kpi .value small{font-size:12px;letter-spacing:0;color:var(--muted)}
.delta{margin-top:3px;font:600 10.5px "Fira Code"}.up{color:var(--ok)}.down{color:var(--bad)}
.chart{width:100%;height:250px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{padding:10px;background:var(--color-muted);border-radius:4px;text-align:center}
.stat b{display:block;font:700 18px "Fira Code"}.stat span{font-size:10.5px;color:var(--muted)}
.scroll{overflow:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{height:41px;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:#EFF6FF;color:var(--color-foreground);font-size:10.5px;letter-spacing:.025em}
tbody tr:last-child td{border-bottom:0}tbody tr{transition:background .18s ease}tbody tr:hover{background:#F8FAFC}
td.num{text-align:right;font-family:"Fira Code";font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid;border-radius:3px;font-size:10px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:#F0FDF4;color:var(--ok);border-color:#BBF7D0}.warn-tag{background:#FFFBEB;color:var(--warn);border-color:#FDE68A}.bad{background:#FEF2F2;color:var(--bad);border-color:#FECACA}.info{background:#EFF6FF;color:var(--blue);border-color:#BFDBFE}
.note{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.6}
.source,.report{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.source:last-child,.report:last-child{border-bottom:0}
.ico{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:4px;background:#EFF6FF;color:var(--blue)}
.detail{flex:1;min-width:0}.detail b{display:block;font-size:12px}.detail small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}.right small{display:block;margin-top:3px;color:var(--muted);font:500 9.5px "Fira Code"}
.alert{margin-top:12px;padding:10px 11px;border:1px solid #FDE68A;border-left:3px solid var(--warn);border-radius:4px;background:#FFFBEB;color:#78350F;display:flex;gap:8px;font-size:11px}
.alert.good{background:#F0FDF4;border-color:#BBF7D0;border-left-color:var(--ok);color:#14532D}
.metric{padding:11px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px}
.metric.warn-m{border-left-color:var(--warn)}
.metric-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.metric-head b{font-size:12px}
.formula{margin-top:6px;color:var(--blue);font:500 10.5px "Fira Code";overflow-wrap:anywhere}.metric p{margin:4px 0 0;color:var(--muted);font-size:10.5px}
.crumb{margin-bottom:14px;padding:9px 12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:4px;font-size:11px;font-weight:600}.crumb strong{color:var(--blue)}.crumb .push{margin-left:auto}
.bars{display:grid;gap:11px}.bar-row{display:grid;grid-template-columns:112px minmax(120px,1fr) 64px;align-items:center;gap:10px;font-size:11px}.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:25px;background:var(--color-muted);position:relative;border-radius:3px;overflow:hidden}.fill{height:100%;background:var(--blue)}.track b{position:absolute;right:7px;inset-block:0;display:flex;align-items:center;color:var(--ink);font:600 9.5px "Fira Code"}.change{text-align:right;font:600 10.5px "Fira Code"}
.insight{padding:13px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:4px}.insight+.insight{margin-top:10px}.insight.risk{border-left-color:var(--bad)}.insight.chance{border-left-color:var(--ok)}.insight.watch{border-left-color:var(--warn)}
.insight-head{display:flex;gap:9px;align-items:flex-start}.insight-head .ico{width:30px;height:30px}.insight-head b{flex:1;font-size:12px}.confidence{font:600 9.5px "Fira Code";color:var(--muted);white-space:nowrap}.insight p{margin:7px 0;color:#334155;font-size:11px;line-height:1.65}
.actions{display:flex;gap:6px;flex-wrap:wrap}.chip,.btn{min-height:36px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:600;transition:background .2s ease,border-color .2s ease,transform .2s ease}
.chip{padding:6px 9px;border:1px solid var(--line);background:#fff;color:var(--blue);font-size:10px}.chip:hover,.btn:hover{transform:translateY(-1px)}
.chip.primary,.btn{background:var(--blue);border:1px solid var(--blue);color:#fff}.btn{padding:8px 13px;font-size:11.5px}.btn.accent{background:var(--color-accent);border-color:var(--color-accent);color:#111827}.btn.ghost{background:#fff;color:var(--blue)}
.score-group+.score-group{margin-top:15px}.score-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:12px;font-weight:700}.score-head span{margin-left:auto;color:var(--muted);font:500 9.5px "Fira Code"}
.score{position:relative;padding:10px 11px;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:4px}.score.yellow{border-top-color:var(--warn)}.score.green{border-top-color:var(--ok)}
.score .name{font-size:10.5px;color:var(--muted)}.score .number{margin-top:2px;font:700 17px "Fira Code"}.score small{font-size:9.5px;color:var(--muted)}.progress{height:5px;margin-top:7px;background:var(--color-muted);overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}
.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:#93C5FD}.event{position:relative;padding-bottom:13px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-17px;top:4px;width:7px;height:7px;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}.event time{display:block;color:var(--blue);font:600 9.5px "Fira Code"}.event b{font-size:11.5px}.event small{display:block;color:var(--muted);font-size:10px}
.reveal{animation:reveal .35s ease both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.shell{grid-template-columns:208px minmax(0,1fr)}.g21,.g12{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.shell{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.brand{min-height:64px}.nav{display:flex;overflow:auto;padding:8px 12px}.nav button{width:auto;flex:none}.nav button.on:before{display:none}.who{display:none}.topbar{top:0;height:46px;padding:0 14px}.wrap{padding:18px 14px 38px}.vh{align-items:flex-start}.pill{display:none}.g2,.g3{grid-template-columns:1fr}.bar-row{grid-template-columns:96px minmax(110px,1fr) 52px}}
@media(max-width:480px){.brand small{display:none}.nav .lbl{display:none}.nav button{padding:10px}.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:12px}.kpi .value{font-size:20px}.vh h1{font-size:20px}.card{padding:13px}.live{font-size:9px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
