<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務區域責任管理 Territory Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#be185d;
  --accent2:#fb7185;
  --bg:#0c0a12;
  --panel:#171320;
  --panel2:#1f1930;
  --line:#2c2440;
  --txt:#f4eef8;
  --mut:#a99fbd;
  --ok:#34d399;
  --warn:#fbbf24;
  --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#2a1030 0%,var(--bg) 55%);
  color:var(--txt);
  min-height:100vh;
  line-height:1.55;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}
/* ===== top nav ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(12,10,18,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;border-bottom:1px solid var(--line);
}
.logo{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 18px rgba(190,24,93,.4);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--mut);font-weight:500}
.brand .badge{
  margin-left:auto;font-size:11px;color:var(--accent2);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  background:var(--panel);white-space:nowrap;flex:0 0 auto;
}
nav{
  display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;
}
.navbtn{
  display:flex;align-items:center;gap:7px;min-width:0;
  background:transparent;border:1px solid transparent;
  color:var(--mut);font-family:inherit;font-size:13px;font-weight:600;
  padding:8px 13px;border-radius:9px;cursor:pointer;transition:.15s;
}
.navbtn:hover{background:var(--panel);color:var(--txt)}
.navbtn.on{
  background:linear-gradient(135deg,rgba(190,24,93,.25),rgba(251,113,133,.15));
  border-color:var(--accent);color:#fff;
}
.navbtn .material-symbols-outlined{font-size:19px;flex:0 0 auto}
/* ===== layout ===== */
main{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
.screen-head{margin-bottom:18px}
.screen-head .eyebrow{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.screen-head h2{font-size:22px;font-weight:800;margin-top:2px}
.screen-head p{font-size:13px;color:var(--mut);margin-top:4px;max-width:760px}
/* grids */
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
.grid>*{min-width:0}
/* panels */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px;min-width:0;
}
.card.tight{padding:14px}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card .hint{font-size:11px;color:var(--mut);font-weight:500;margin-left:auto}
/* kpi */
.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;color:var(--mut);font-weight:600}
.kpi .delta{font-size:12px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--bad)}
.kpi .ic{
  position:absolute;right:-6px;top:-6px;font-size:64px;opacity:.08;color:var(--accent2);
}
.kpi .bar{height:5px;border-radius:5px;background:var(--panel2);margin-top:11px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* chart wrap */
.chart{position:relative;width:100%;overflow:hidden}
.h220{height:220px}.h240{height:240px}.h260{height:260px}.h280{height:280px}.h300{height:300px}
/* table */
.tblwrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
thead th{
  text-align:left;font-size:11px;color:var(--mut);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:10px;border-bottom:1px solid var(--panel2);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* pills / tags */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}
.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}
.pill.info{background:rgba(251,113,133,.15);color:var(--accent2)}
.pill.mut{background:var(--panel2);color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
/* avatar */
.av{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 auto}
.cell{display:flex;align-items:center;gap:9px;min-width:0}
.cell .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .sm{font-size:11px;color:var(--mut)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:"";position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl .ev .th{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .ev .tt{font-size:11px;color:var(--mut)}
.tl .ev .td{font-size:12px;color:var(--mut);margin-top:3px}
/* rule row */
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);margin-bottom:10px}
.rule:last-child{margin-bottom:0}
.rule .rn{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 auto;color:#fff}
.rule .rb{min-width:0;flex:1}
.rule .rb .rt{font-size:13px;font-weight:700}
.rule .rb .rd{font-size:12px;color:var(--mut);margin-top:2px}
/* mini stat inline */
.mstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.mstat .m{min-width:0}
.mstat .m .l{font-size:11px;color:var(--mut)}
.mstat .m .v{font-size:16px;font-weight:800}
/* legend */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* progress list */
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--panel2)}
.prow:last-child{border-bottom:none}
.prow .pn{font-size:13px;font-weight:600;min-width:64px}
.prow .pbar{flex:1;height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;min-width:0}
.prow .pbar i{display:block;height:100%;border-radius:8px}
.prow .pv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.footer-note{margin-top:28px;text-align:center;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:18px}
@media(max-width:560px){
  .navbtn .txt{display:none}
  .navbtn{padding:9px}
  .brand .badge{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div style="min-width:0">
      <h1>業務區域責任管理</h1>
      <div class="sub">Territory Management ｜ CRM 客戶關係管理</div>
    </div>
    <div class="badge">純 UI 展示 · 擬真資料</div>
  </div>
  <nav id="nav"></nav>
</div>
<main id="app"></main>

<script>
"use strict";
var accent="#be185d",accent2="#fb7185",gridLine="rgba(255,255,255,.07)",tickCol="#a99fbd";

/* ---------- nav ---------- */
var NAV=[
  {ic:"account_tree",t:"劃分規則"},
  {ic:"groups",t:"自動歸屬"},
  {ic:"gavel",t:"爭議仲裁"},
  {ic:"monitoring",t:"區域績效"},
  {ic:"insights",t:"負載均衡"},
  {ic:"history",t:"稽核軌跡"}
];
var charts={};
function destroyChart(id){ if(charts[id]){try{charts[id].destroy();}catch(e){} charts[id]=null;} }
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el) return;
  destroyChart(id);
  charts[id]=new Chart(el.getContext("2d"),cfg);
}
function baseOpts(extra){
  var o={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:tickCol,font:{size:11},boxWidth:12}}},
    scales:{
      x:{ticks:{color:tickCol,font:{size:11}},grid:{color:gridLine}},
      y:{ticks:{color:tickCol,font:{size:11}},grid:{color:gridLine}}
    }
  };
  if(extra){for(var k in extra){o[k]=extra[k];}}
  return o;
}
function av(txt,c){return '<span class="av" style="background:'+c+'">'+txt+'</span>';}

/* ---------- data ---------- */
var REGIONS=[
  {code:"N",name:"北區",color:"#be185d",owner:"林昱翔",cust:184,target:2400,actual:2632,disp:1,white:12},
  {code:"C",name:"中區",color:"#fb7185",owner:"陳雅筑",cust:142,target:1800,actual:1548,disp:3,white:21},
  {code:"S",name:"南區",color:"#f59e0b",owner:"黃國峰",cust:167,target:2100,actual:1974,disp:2,white:18},
  {code:"E",name:"東區",color:"#34d399",owner:"吳孟蓉",cust:63,target:900,actual:1012,disp:0,white:8},
  {code:"X",name:"海外",color:"#60a5fa",owner:"Steve Ho",cust:41,target:1200,actual:864,disp:1,white:26}
];
function regByCode(code){for(var i=0;i<REGIONS.length;i++){if(REGIONS[i].code===code)return REGIONS[i];}return {name:"未定",color:"#64748b"};}

/* ================= SCREEN 0 : 區域劃分規則 ================= */
function screen0(){
  var rules=[
    {n:"01",t:"地理郵遞區段優先",d:"客戶登記地址前 3 碼落入 100–116 者歸屬北區；權重最高。",w:"最高"},
    {n:"02",t:"產業別專責歸屬",d:"半導體、光電客戶不分地理，一律歸屬產業專責小組。",w:"高"},
    {n:"03",t:"營收級距分流",d:"年營收 ≥ 5,000 萬之關鍵客戶（KA）由 KA 小組承接。",w:"高"},
    {n:"04",t:"既有往來延續",d:"三年內有成交紀錄之客戶維持原歸屬，避免斷點。",w:"中"},
    {n:"05",t:"負載上限保護",d:"單一業務歸屬客戶數達 60 家時，新客戶改分派次順位業務。",w:"中"}
  ];
  return {
    head:{eye:"MODULE 01",h:"區域劃分規則設定",p:"以地理、產業別、營收級距與往來延續建立責任劃分條件，並設定規則優先序，作為客戶自動歸屬的判斷依據。"},
    html:''
    +'<div class="grid g4" style="margin-bottom:14px">'
      +kpiCard("啟用規則","5","項","up","+1 本季",100,"rule")
      +kpiCard("覆蓋客戶","597","家","up","98.4% 命中",98,"groups")
      +kpiCard("責任區域","5","區","up","含海外",100,"account_tree")
      +kpiCard("規則衝突","2","筆","down","待調整",40,"warning")
    +'</div>'
    +'<div class="grid g23">'
      +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>劃分規則清單<span class="hint">依優先序由上而下比對</span></h3>'
        +rules.map(function(r){return ''
          +'<div class="rule"><div class="rn">'+r.n+'</div><div class="rb">'
          +'<div class="rt">'+r.t+' <span class="pill '+(r.w==="最高"?"bad":r.w==="高"?"warn":"info")+'">權重 '+r.w+'</span></div>'
          +'<div class="rd">'+r.d+'</div></div></div>';}).join('')
      +'</div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>歸屬命中來源</h3>'
        +'<div class="chart h240"><canvas id="c0a"></canvas></div>'
        +'<div class="legend"><span><i class="dot" style="background:'+accent+'"></i>規則直接命中</span><span><i class="dot" style="background:'+accent2+'"></i>次順位分派</span><span><i class="dot" style="background:#f59e0b"></i>人工確認</span></div>'
      +'</div>'
    +'</div>',
    init:function(){
      mkChart("c0a",{type:"doughnut",data:{labels:["規則直接命中","次順位分派","人工確認"],
        datasets:[{data:[512,68,17],backgroundColor:[accent,accent2,"#f59e0b"],borderColor:"#171320",borderWidth:3}]},
        options:baseOpts({cutout:"62%",scales:{}})});
    }
  };
}

/* ================= SCREEN 1 : 客戶自動歸屬 ================= */
function screen1(){
  var rows=[
    {c:"鴻運精密工業",ind:"半導體",reg:"N",own:"林昱翔",rule:"R02",st:"ok",note:"產業專責命中"},
    {c:"泰昇光電",ind:"光電",reg:"S",own:"黃國峰",rule:"R01",st:"ok",note:"地理郵遞命中"},
    {c:"廣達實業社",ind:"機械",reg:"C",own:"陳雅筑",rule:"R01",st:"ok",note:"地理郵遞命中"},
    {c:"新洋國際",ind:"貿易",reg:"X",own:"Steve Ho",rule:"R02",st:"warn",note:"地址跨區待確認"},
    {c:"晶采科技",ind:"半導體",reg:"N",own:"KA 小組",rule:"R03",st:"ok",note:"KA 級距承接"},
    {c:"日新工程行",ind:"營建",reg:"E",own:"吳孟蓉",rule:"R01",st:"ok",note:"地理郵遞命中"},
    {c:"合眾電子",ind:"電子",reg:"C",own:"陳雅筑",rule:"R04",st:"warn",note:"往來延續待覆核"},
    {c:"宏遠貿易",ind:"貿易",reg:"S",own:"—",rule:"—",st:"bad",note:"多規則衝突未歸屬"}
  ];
  return {
    head:{eye:"MODULE 02",h:"客戶自動歸屬指派",p:"新進客戶名單依規則即時比對，自動指派歸屬業務與責任區域，邊界與衝突案件標記為待人工確認。"},
    html:''
    +'<div class="grid g4" style="margin-bottom:14px">'
      +kpiCard("今日新進","23","家","up","+5 昨日",76,"person_add")
      +kpiCard("自動歸屬","19","家","up","82.6%",83,"bolt")
      +kpiCard("待確認","3","家","down","邊界案件",30,"help")
      +kpiCard("未歸屬","1","家","down","規則衝突",10,"warning")
    +'</div>'
    +'<div class="grid g32">'
      +'<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各區歸屬進度（本週）</h3>'
        +'<div class="chart h260"><canvas id="c1a"></canvas></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">assignment_ind</span>自動歸屬結果<span class="hint">即時佇列</span></h3>'
        +'<div class="tblwrap"><table><thead><tr><th>客戶／產業</th><th>區域</th><th>歸屬業務</th><th>命中規則</th><th>狀態</th></tr></thead><tbody>'
        +rows.map(function(r){var R=regByCode(r.reg);return '<tr>'
          +'<td><div class="cell">'+av(r.c.slice(0,1),R.color)+'<div style="min-width:0"><div class="nm">'+r.c+'</div><div class="sm">'+r.ind+'</div></div></div></td>'
          +'<td><span class="pill mut"><i class="dot" style="background:'+R.color+'"></i>'+R.name+'</span></td>'
          +'<td>'+r.own+'</td>'
          +'<td><span class="pill info">'+r.rule+'</span></td>'
          +'<td><span class="pill '+r.st+'">'+r.note+'</span></td>'
        +'</tr>';}).join('')
        +'</tbody></table></div></div>'
    +'</div>',
    init:function(){
      mkChart("c1a",{type:"bar",data:{
        labels:REGIONS.map(function(r){return r.name;}),
        datasets:[
          {label:"自動歸屬",data:[6,4,5,2,2],backgroundColor:accent,stack:"s"},
          {label:"待確認",data:[1,1,0,0,1],backgroundColor:accent2,stack:"s"},
          {label:"未歸屬",data:[0,1,0,0,0],backgroundColor:"#64748b",stack:"s"}
        ]},
        options:baseOpts({scales:{x:{stacked:true,ticks:{color:tickCol},grid:{color:gridLine}},y:{stacked:true,ticks:{color:tickCol},grid:{color:gridLine}}}})});
    }
  };
}

/* ================= SCREEN 2 : 歸屬爭議仲裁 ================= */
function screen2(){
  var cases=[
    {id:"D-2418",c:"宏遠貿易",a:"黃國峰(南)",b:"Steve Ho(海外)",why:"地址登記南區、實際採購由海外分公司下單",amt:320,st:"審核中"},
    {id:"D-2411",c:"合眾電子",a:"陳雅筑(中)",b:"林昱翔(北)",why:"三年前成交由北區，近期由中區開發",amt:145,st:"待補件"},
    {id:"D-2405",c:"新洋國際",a:"Steve Ho(海外)",b:"黃國峰(南)",why:"跨區重疊拜訪，雙方均登記商機",amt:88,st:"審核中"}
  ];
  return {
    head:{eye:"MODULE 03",h:"歸屬爭議偵測與仲裁",p:"系統偵測搶單與重疊歸屬，彙整雙方拜訪與商機證據，由業務主管審核裁決並留下不可竄改的仲裁紀錄。"},
    html:''
    +'<div class="grid g4" style="margin-bottom:14px">'
      +kpiCard("本月爭議","7","件","down","-2 上月",58,"gavel")
      +kpiCard("待裁決","3","件","down","平均 1.8 天",40,"pending")
      +kpiCard("已仲裁","4","件","up","結案率 57%",57,"task_alt")
      +kpiCard("平均金額","184","萬","down","涉及商機",60,"payments")
    +'</div>'
    +'<div class="grid g23">'
      +'<div class="card"><h3><span class="material-symbols-outlined">balance</span>爭議案件佇列<span class="hint">依金額排序</span></h3>'
        +'<div class="tblwrap"><table><thead><tr><th>案號</th><th>客戶</th><th>爭議雙方</th><th class="num">商機(萬)</th><th>狀態</th></tr></thead><tbody>'
        +cases.map(function(x){return '<tr>'
          +'<td><span class="pill info">'+x.id+'</span></td>'

/* ---------- component helpers ---------- */
function kpiCard(lbl,val,unit,dir,delta,pct,ic){
  var dcls=dir==="up"?"up":dir==="down"?"down":"";
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"remove";
  return '<div class="card kpi tight">'
    +'<span class="material-symbols-outlined ic">'+ic+'</span>'
    +'<div class="lbl">'+lbl+'</div>'
    +'<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'
    +(delta?'<div class="delta '+dcls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arrow+'</span>'+delta+'</div>':'')
    +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
  +'</div>';
}
function tlEv(t,tt,td){
  return '<div class="ev"><div class="th">'+t+'</div><div class="tt">'+tt+'</div><div class="td">'+td+'</div></div>';
}

/* ---------- router ---------- */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function buildNav(){
  var nv=document.getElementById("nav");
  nv.innerHTML=NAV.map(function(x,i){return '<button class="navbtn" data-i="'+i+'">'
    +'<span class="material-symbols-outlined">'+x.ic+'</span><span class="txt">'+x.t+'</span></button>';}).join('');
  var btns=nv.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){location.hash="go="+this.getAttribute("data-i");});
  }
}
function show(i){
  var app=document.getElementById("app");
  var s=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  app.innerHTML='<div class="screen-head"><div class="eyebrow">'+s.head.eye+'</div><h2>'+s.head.h+'</h2><p>'+s.head.p+'</p></div>'+s.html
    +'<div class="footer-note">業務區域責任管理 Territory Management ｜ 純 UI 展示，資料皆為擬真示範</div>';
  void app.offsetHeight;
  if(s.init) s.init();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
