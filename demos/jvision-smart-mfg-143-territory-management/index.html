<head>

<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFFFFF;--color-secondary:#3B82F6;--color-on-secondary:#000000;
--color-accent:#059669;--color-on-accent:#000000;--color-background:#F8FAFC;--color-foreground:#0F172A;
--color-card:#FFFFFF;--color-card-foreground:#0F172A;--color-muted:#F1F5FD;--color-muted-foreground:#475569;
--color-border:#E4ECFC;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#0F172A;--muted:#475569;--line:#E4ECFC;
--ok:#047857;--warn:#A16207;--bad:#B91C1C;--panel:#FFFFFF;--panel2:#F1F5FD;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-width:320px;min-height:100vh;overflow-x:hidden;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button{font:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(37,99,235,.32);outline-offset:2px}
.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px;padding:13px 24px}
.logo{width:40px;height:40px;display:grid;place-items:center;flex:none;background:var(--blue);color:#fff;border-radius:8px;box-shadow:0 3px 8px rgba(37,99,235,.2)}
.brand h1{font-size:16px;line-height:1.3;font-weight:700;letter-spacing:.01em}
.brand .sub{margin-top:2px;color:var(--muted);font-size:11px}
.badge{margin-left:auto;border:1px solid #BFDBFE;border-radius:999px;background:#EFF6FF;color:#1D4ED8;padding:5px 10px;font-size:11px;font-weight:600;white-space:nowrap}
nav{max-width:1440px;margin:auto;display:flex;gap:2px;overflow-x:auto;padding:0 20px}
.navbtn{position:relative;display:flex;align-items:center;gap:7px;flex:none;border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:10px 12px;font-size:13px;font-weight:600;transition:background .2s,color .2s}
.navbtn::after{content:"";position:absolute;right:10px;bottom:0;left:10px;height:2px;background:transparent}
.navbtn:hover{background:#F8FAFC;color:var(--ink)}
.navbtn.on{color:var(--blue);background:#EFF6FF}
.navbtn.on::after{background:var(--blue)}
.navbtn .material-symbols-outlined{font-size:18px}
main{width:min(100%,1440px);margin:auto;padding:26px 24px 60px}
.screen-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;letter-spacing:.08em}
.screen-head h2{margin-top:3px;font-size:24px;line-height:1.25;letter-spacing:-.02em}
.screen-head p{grid-column:1/-1;max-width:860px;color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px;min-width:0}.grid>*{min-width:0}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
.card{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.035);transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:#C7D7F4;box-shadow:0 4px 12px rgba(15,23,42,.055)}
.card.tight{padding:14px}
.card h3{display:flex;align-items:center;gap:7px;margin-bottom:13px;font-size:14px;font-weight:600}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:18px}
.hint{margin-left:auto;color:var(--muted);font-size:11px;font-weight:400}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:500}
.kpi .val{margin-top:4px;font-family:"Fira Code",monospace;font-size:27px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:13px;font-weight:500}
.kpi .delta{display:flex;align-items:center;gap:3px;margin-top:3px;font-size:11px;font-weight:600}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.kpi .ic{position:absolute;top:13px;right:13px;color:#94A3B8;font-size:23px}
.kpi .bar{height:4px;margin-top:11px;overflow:hidden;background:#E2E8F0;border-radius:2px}.kpi .bar i{display:block;height:100%;background:var(--blue)}
.chart{position:relative;width:100%;overflow:hidden}.h220{height:220px}.h240{height:240px}.h260{height:260px}.h280{height:280px}.h300{height:300px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:#F8FAFC}
thead th{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em;text-align:left;white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#F8FAFC}
td.num,th.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 8px;border:1px solid transparent;border-radius:999px;font-size:10px;font-weight:600;line-height:1.35;white-space:nowrap}
.pill.ok{border-color:#A7F3D0;background:#ECFDF5;color:#065F46}.pill.warn{border-color:#FDE68A;background:#FFFBEB;color:#854D0E}.pill.bad{border-color:#FECACA;background:#FEF2F2;color:#991B1B}.pill.info{border-color:#BFDBFE;background:#EFF6FF;color:#1D4ED8}.pill.mut{border-color:#CBD5E1;background:#F8FAFC;color:#334155}
.dot{width:7px;height:7px;display:inline-block;flex:none;border-radius:50%;outline:1px solid rgba(15,23,42,.12)}
.av{width:29px;height:29px;display:inline-grid;place-items:center;flex:none;border-radius:6px;color:#fff;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.cell{display:flex;align-items:center;gap:8px;min-width:0}.nm{overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.sm{color:var(--muted);font-size:11px}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:6px;width:1px;background:#CBD5E1}
.ev{position:relative;padding:0 0 17px 5px}.ev:last-child{padding-bottom:0}.ev::before{content:"";position:absolute;top:4px;left:-21px;width:9px;height:9px;border:2px solid var(--blue);border-radius:50%;background:#fff}
.th{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;font-weight:600}.tt{margin-top:2px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}.td{margin-top:3px;color:var(--muted);font-size:12px}
.rule{display:flex;gap:11px;align-items:flex-start;margin-bottom:8px;padding:11px;border:1px solid var(--line);border-radius:6px;background:#FAFCFF}.rule:last-child{margin-bottom:0}.rn{width:29px;height:29px;display:grid;place-items:center;flex:none;border-radius:5px;background:var(--blue);color:#fff;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}.rb{min-width:0;flex:1}.rt{font-size:13px;font-weight:600}.rd{margin-top:3px;color:var(--muted);font-size:11px}
.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10px}.legend span{display:inline-flex;align-items:center;gap:5px}
.prow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.prow:last-child{border:0}.pn{min-width:64px;font-size:12px;font-weight:600}.pbar{height:7px;min-width:0;flex:1;overflow:hidden;border-radius:3px;background:#E2E8F0}.pbar i{display:block;height:100%;border-radius:3px}.pv{min-width:48px;text-align:right;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.mstat{display:flex;gap:26px;margin-top:12px}.mstat .l{color:var(--muted);font-size:10px}.mstat .v{font-size:15px;font-weight:700}
.footer-note{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center}
.reveal{animation:reveal .35s ease-out both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:768px){.g2,.g3{grid-template-columns:1fr}.brand{padding-inline:16px}nav{padding-inline:12px}main{padding:20px 16px 48px}.screen-head h2{font-size:21px}}
@media(max-width:480px){.g4{grid-template-columns:1fr}.badge{display:none}.navbtn{padding:10px}.navbtn .txt{display:none}.card{padding:13px}.screen-head{display:block}.screen-head p{margin-top:8px}.tblwrap{margin-inline:-2px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
