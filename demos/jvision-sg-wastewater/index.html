<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>廢水處理與放流水監測 · ESG 永續管理系統</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#D1FAE5;
  --accent-soft2:#ECFDF5;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#F0FDF8;
  --hov:#F0FDF4;
  --track:#DCEFE8;
  --sidebar:#FFFFFF;
  --sidebar2:#F0FDF8;
  --side-edge:var(--color-border);
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#0369A1;
  --r:4px;
  --glow:rgba(5,150,105,.18);
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 24px rgba(6,78,59,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:"Fira Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans",sans-serif;color:var(--ink);letter-spacing:-.015em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#A7F3D0;color:#022C22}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;min-width:0;height:100vh;position:sticky;top:0;z-index:10;display:flex;flex-direction:column;padding:28px 18px 20px;background:var(--panel);color:var(--ink);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 6px 27px;border-bottom:1px solid var(--line)}
.brand-logo{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid #34D399;border-radius:3px;background:var(--accent);color:#00150E;box-shadow:5px 5px 0 #A7F3D0;transition:transform .22s ease,box-shadow .22s ease}
.brand:hover .brand-logo{transform:translate(-1px,-1px);box-shadow:7px 7px 0 #A7F3D0}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-txt span{display:block;margin-top:2px;color:var(--muted);font-family:"Fira Code",monospace;font-size:9px;font-weight:500;letter-spacing:.08em;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:24px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;min-width:0;min-height:44px;padding:10px 11px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;text-align:left;white-space:nowrap;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}
.nav button::before{content:"";position:absolute;left:-19px;top:8px;bottom:8px;width:3px;background:transparent;transition:background-color .2s ease}
.nav button:hover{border-color:var(--line);background:var(--th);color:var(--ink);transform:translateX(2px)}
.nav button.on{border-color:#6EE7B7;background:#D1FAE5;color:#064E3B;font-weight:700}
.nav button.on::before{background:var(--accent)}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav .idx{margin-left:auto;color:#527467;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.side-foot{margin-top:auto;padding:17px 7px 0;border-top:1px solid var(--line);color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;line-height:1.75}
.side-foot b{color:var(--ink)}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,44px) 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(20px,2vw,27px);font-weight:700;line-height:1.2}
.topbar h1 .material-symbols-outlined{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:3px;background:#D1FAE5;color:#047857;font-size:21px}
.topbar .sub{margin:7px 0 0 44px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.78);color:#365D51;font-size:11.5px;font-weight:600;box-shadow:0 1px 1px rgba(6,78,59,.04)}
.chip .dot{width:8px;height:8px;border:2px solid #065F46;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px #D1FAE5;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.65}}
.avatar{width:35px;height:35px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid #047857;border-radius:50%;background:#D1FAE5;color:#064E3B;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0;animation:enter .42s both cubic-bezier(.2,.8,.2,1)}
.grid>*:nth-child(2){animation-delay:.06s}
.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card,.sec,.kpi,.stat,.tile{min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#6EE7B7;box-shadow:0 2px 3px rgba(6,78,59,.07),0 13px 30px rgba(6,78,59,.08);transform:translateY(-2px)}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.sec>h3{margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:#047857;font-size:19px}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;padding:18px 18px 13px!important;border-bottom:1px solid var(--line)}
.card-h .hint{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.kpi,.stat{position:relative;overflow:hidden;padding:17px 18px}
.kpi::before,.stat::before,.tile::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--accent);opacity:.78}
.kpi::after{content:"";position:absolute;right:-27px;top:-34px;width:90px;height:90px;border:1px solid #A7F3D0;border-radius:50%;background:#ECFDF5}
.kpi .ico{position:relative;z-index:1;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid #A7F3D0;border-radius:3px;background:#D1FAE5;color:#047857}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:11.5px;font-weight:500}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:#047857;font-size:15px}
.kpi .val,.stat .val{margin-top:4px;color:#043E30;font-family:"Fira Code",monospace;font-size:clamp(22px,2.2vw,28px);font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
table{width:100%;border-collapse:separate;border-spacing:0;color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:11px 14px;border-bottom:1px solid #6EE7B7;background:var(--th);color:#355E51;font-size:10.5px;font-weight:700;letter-spacing:.045em;text-align:left;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #D1FAE5;background:#fff;white-space:nowrap;transition:background-color .2s ease}
td:nth-child(4),td:nth-child(5),td:nth-child(6),td:nth-child(9){text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hov)}
.mono{font-family:"Fira Code",monospace;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.tag::before{content:"";width:5px;height:5px;flex:none;border-radius:50%;background:currentColor}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-gray{background:#F1F5F9;color:#475569}
.t-acc,.t-pink{background:#ECFDF5;color:#047857}
.bar{height:7px;min-width:56px;overflow:hidden;border-radius:1px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:1px;background:linear-gradient(90deg,#047857,#34D399)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:39px;flex:none;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-25px;top:3px;width:13px;height:13px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:500}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10.5px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;border:1px solid var(--line);border-radius:3px;background:var(--th)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.pcard{padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;background:#fff;transition:transform .2s ease,box-shadow .2s ease}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10.5px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:10.5px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);border-radius:50%;background:#D1FAE5;color:#047857;font-family:"Fira Code",monospace;font-weight:700}
.mini-av{width:19px;height:19px;font-size:8px}
.av{width:27px;height:27px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:#fff;transition:border-color .2s ease,transform .2s ease}
.lane-row:hover{border-color:#34D399;transform:translateX(2px)}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:2px;background:#D1FAE5;color:#047857;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:23px;height:23px;z-index:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:50%;background:#fff;color:#64748B;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{border-color:#047857;background:#047857;color:#fff}
.steps .s.cur{border-color:#047857;color:#047857;animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:#047857}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:10.5px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;border-radius:1px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:1px;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:9.5px;text-align:right}
.band{position:relative;height:26px;min-width:150px;border-radius:2px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:2px;background:#A7F3D0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:2px;background:var(--accent);box-shadow:0 2px 6px var(--glow)}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:17px 18px}
.tile .ti{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:3px;background:#D1FAE5;color:#047857}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{font-size:12.5px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}
.tile .tv{color:#043E30;font-family:"Fira Code",monospace;font-size:clamp(19px,2vw,24px);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:3px!important;box-shadow:var(--shadow)!important}
.apexcharts-gridline{stroke:#D1FAE5}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 14px 0 2px;border:0}.brand-logo{width:38px;height:38px;box-shadow:3px 3px 0 #A7F3D0}.side-foot{display:none}.nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}.nav button{min-height:42px;padding:8px 11px}.nav button::before{display:none}.nav .idx{display:none}.main{padding:22px 16px 48px}.topbar{align-items:flex-start}.topbar .sub{margin-left:0}}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}.topbar{flex-direction:column}.top-right{justify-content:flex-start}.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:none}}
@media(max-width:560px){.g4{grid-template-columns:1fr}.board{grid-template-columns:1fr}.nav button{width:44px;justify-content:center;padding:8px}.nav button .txt{display:none}.brand-txt span{display:none}.topbar h1{font-size:19px}.chip{font-size:10.5px}.avatar{width:34px;height:34px}.card,.sec{padding:15px}.tile{padding:15px}.dl{grid-template-columns:1fr;gap:2px 0}.dl dt{margin-top:9px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.grid>*{opacity:1!important;transform:none!important}.chip .dot,.steps .s.cur{animation:none!important}}
@media(forced-colors:active){.tag,.nav button.on,.brand-logo{border:2px solid currentColor}.tag::before{forced-color-adjust:auto}:focus-visible{outline:3px solid Highlight}}
@media print{.sidebar{display:none}.main{padding:0}.card,.sec,.kpi,.stat,.tile{box-shadow:none;break-inside:avoid}.grid>*{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">water_drop</span></div>
      <div class="brand-txt"><b>放流監測台</b><span>WASTEWATER MONITORING</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">放流口 3 處<br/>監測項目 18 項<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
