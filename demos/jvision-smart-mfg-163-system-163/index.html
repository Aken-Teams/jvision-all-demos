<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>雙源／多源供應管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#be185d;
  --accent2:#fb7185;
  --bg:#0d0b12;
  --panel:#171320;
  --panel2:#1f1930;
  --line:#2c2540;
  --text:#f3eef7;
  --muted:#a99fbf;
  --good:#34d399;
  --warn:#fbbf24;
  --bad:#f43f5e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
/* NAV */
.nav{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#100c18,#0d0b12);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
}
.brand .t1{font-weight:800;font-size:15px;letter-spacing:.3px;white-space:nowrap;}
.brand .t2{font-size:11px;color:var(--muted);white-space:nowrap;}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.navbtn{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:1px solid transparent;
  color:var(--muted);cursor:pointer;
  padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:600;
  font-family:inherit;transition:.15s;min-width:0;
}
.navbtn:hover{color:var(--text);background:var(--panel2);}
.navbtn.on{color:#fff;background:linear-gradient(135deg,var(--accent),#9d174d);border-color:var(--accent);}
.navbtn .material-symbols-outlined{font-size:18px;}
/* LAYOUT */
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.scr-head .stag{
  font-size:11px;color:var(--accent2);font-weight:700;letter-spacing:1px;text-transform:uppercase;
}
.scr-head h2{margin:2px 0 0;font-size:22px;font-weight:800;}
.scr-head p{margin:0;color:var(--muted);font-size:13px;}
.pill{
  margin-left:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:6px;min-width:0;
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);}
/* CARDS */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;
}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
/* KPI */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;line-height:1;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .sub{font-size:11.5px;margin-top:6px;color:var(--muted);}
.up{color:var(--good);}.down{color:var(--bad);}
/* CHART */
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:220px;}
.chart.lg{height:320px;}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;letter-spacing:.3px;}
.tbl td{padding:10px;border-bottom:1px solid #221c33;white-space:nowrap;}
.tbl tr:hover td{background:var(--panel2);}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.t-bad{background:rgba(244,63,94,.15);color:#fca5b5;}
.t-warn{background:rgba(251,191,36,.15);color:#fcd34d;}
.t-good{background:rgba(52,211,153,.15);color:#6ee7b7;}
.t-info{background:rgba(190,24,93,.18);color:#f9a8c9;}
.bar{height:6px;border-radius:4px;background:#2c2540;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle;width:90px;}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
/* BOARD */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.col h4 span.cnt{background:var(--panel);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;}
.tk .m{font-size:12.5px;font-weight:700;}
.tk .s{font-size:11px;color:var(--muted);margin-top:3px;}
/* TIMELINE */
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;margin-bottom:14px;}
.tl .ev:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 8px var(--accent);}
.tl .ev .tt{font-size:12.5px;font-weight:700;}
.tl .ev .dd{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tl .ev .tm{font-size:10.5px;color:var(--accent2);font-weight:600;margin-top:2px;}
/* misc */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.matrix{width:100%;border-collapse:collapse;font-size:12px;min-width:560px;}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px 6px;text-align:center;}
.matrix th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11px;}
.matrix td.mat{font-weight:700;}
.cell-100{background:rgba(52,211,153,.22);}
.cell-hi{background:rgba(190,24,93,.28);}
.cell-mid{background:rgba(251,191,36,.16);}
.cell-lo{background:rgba(163,150,191,.06);color:var(--muted);}
.miniStat{display:flex;flex-direction:column;gap:4px;}
.miniStat b{font-size:20px;}.miniStat span{font-size:11px;color:var(--muted);}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.slider-row .nm{font-size:13px;font-weight:700;min-width:110px;}
.slider-row input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);}
.slider-row .pct{font-size:14px;font-weight:800;color:var(--accent2);min-width:44px;text-align:right;}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;}
.alertrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;}
.alertrow .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alertrow .bd{min-width:0;flex:1;}
.alertrow .bd .m{font-size:12.5px;font-weight:700;}
.alertrow .bd .s{font-size:11px;color:var(--muted);}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .navbtn .lbl{display:none;}
  .navbtn{padding:7px 9px;}
  .board{grid-template-columns:1fr;}
  .scr-head h2{font-size:19px;}
}
</style>
</head>
<body>
<div class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div>
      <div class="t1">雙源／多源供應管理系統</div>
      <div class="t2">SRM · 供應韌性控制台</div>
    </div>
  </div>
  <div class="navbtns" id="navbtns"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
var AX={axisLine:{lineStyle:{color:"#40364f"}},axisLabel:{color:"#a99fbf",fontSize:11},splitLine:{lineStyle:{color:"#221c33"}}};
var TT={backgroundColor:"#1f1930",borderColor:"#2c2540",textStyle:{color:"#f3eef7",fontSize:12}};
var GRID={left:8,right:14,top:28,bottom:6,containLabel:true};

var NAV=[
  {i:0,ic:"warning",t:"單一來源風險雷達"},
  {i:1,ic:"account_tree",t:"供應商配置矩陣"},
  {i:2,ic:"insights",t:"替代供應商評估"},
  {i:3,ic:"rule",t:"分單比例規劃"},
  {i:4,ic:"monitoring",t:"供應狀況監控"},
  {i:5,ic:"trending_up",t:"多源覆蓋成效"}
];
(function(){
  var h="";
  for(var k=0;k<NAV.length;k++){
    h+='<button class="navbtn" data-i="'+NAV[k].i+'"><span class="material-symbols-outlined">'+NAV[k].ic+'</span><span class="lbl">'+NAV[k].t+'</span></button>';
  }
  document.getElementById("navbtns").innerHTML=h;
  var bs=document.querySelectorAll("#navbtns .navbtn");
  for(var j=0;j<bs.length;j++){
    bs[j].addEventListener("click",function(){var n=+this.getAttribute("data-i");location.hash="v"+n;});
  }
})();

function head(stag,title,desc,pill){
  return '<div class="scr-head"><div><div class="stag">'+stag+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>'+
    '<div class="pill"><span class="dot"></span>'+pill+'</div></div>';
}
function kpi(icon,lab,val,unit,sub,dir){
  var sc=dir==="up"?"up":(dir==="down"?"down":"");
  var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px">trending_up</span>':(dir==="down"?'<span class="material-symbols-outlined" style="font-size:14px">trending_down</span>':'');
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'+
    '<div class="val">'+val+'<small>'+unit+'</small></div>'+
    '<div class="sub '+sc+'">'+arrow+' '+sub+'</div></div>';
}

/* ============ SCREEN 0 : 單一來源風險雷達 ============ */
function s0(){
  var risk=[
    {p:"IGBT 功率模組",cat:"半導體",sup:"1 家",dep:96,risk:"極高",lead:112,st:"t-bad"},
    {p:"高精度軸承 6205",cat:"機構件",sup:"1 家",dep:88,risk:"高",lead:63,st:"t-bad"},
    {p:"車規級 MLCC",cat:"被動元件",sup:"2 家",dep:71,risk:"高",lead:84,st:"t-warn"},
    {p:"鋁擠型散熱鰭片",cat:"金屬件",sup:"2 家",dep:64,risk:"中",lead:35,st:"t-warn"},
    {p:"精密光學鏡片",cat:"光學件",sup:"1 家",dep:91,risk:"極高",lead:98,st:"t-bad"},
    {p:"導電膠 EC-780",cat:"化工料",sup:"3 家",dep:44,risk:"中",lead:28,st:"t-warn"},
    {p:"連接器 FPC-40P",cat:"連接器",sup:"3 家",dep:38,risk:"低",lead:21,st:"t-good"}
  ];
  var rows="";
  for(var i=0;i<risk.length;i++){var r=risk[i];
    rows+='<tr><td style="font-weight:700">'+r.p+'</td><td style="color:var(--muted)">'+r.cat+'</td><td>'+r.sup+'</td>'+
      '<td><div class="bar"><i style="width:'+r.dep+'%"></i></div> <span style="font-size:11px;color:var(--muted)">'+r.dep+'%</span></td>'+
      '<td><span class="tag '+r.st+'">'+r.risk+'</span></td><td>'+r.lead+' 天</td></tr>';
  }
  return head("STAGE 01 · 辨識關鍵料件","單一來源風險雷達","掃描全料件庫，找出單源依賴度過高、影響生產的高風險關鍵料件","即時監測 1,284 項料件")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("warning","高風險關鍵料件","38","項","較上月 +5","down")+
    kpi("looks_one","單一來源料件","217","項","占全料件 16.9%","")+
    kpi("shield","多源覆蓋率","61.4","%","目標 85%","up")+
    kpi("schedule","平均補救交期","74","天","替代源導入","")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">warning</span>高風險關鍵料件清單（依單源依賴度排序）</h3>'+
      '<div class="scrollx"><table class="tbl"><thead><tr><th>料件</th><th>類別</th><th>合格供應商</th><th>單源依賴度</th><th>風險等級</th><th>標準交期</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">radar</span>風險維度雷達</h3><div id="c0a" class="chart sm"></div>'+
      '<div class="note">綜合評估依賴度、交期、產能缺口、替代難度與品質波動五個維度，愈往外表示風險愈高。</div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">bubble_chart</span>依賴度 × 交期風險分佈</h3><div id="c0b" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">category</span>各料件類別風險占比</h3><div id="c0c" class="chart"></div></div>'+
  '</div>';
}
function s0charts(){
  mk("c0a",{tooltip:TT,radar:{indicator:[{name:"依賴度",max:100},{name:"交期",max:100},{name:"產能缺口",max:100},{name:"替代難度",max:100},{name:"品質波動",max:100}],
    axisName:{color:"#a99fbf",fontSize:11},splitLine:{lineStyle:{color:"#2c2540"}},splitArea:{areaStyle:{color:["rgba(190,24,93,.03)","rgba(190,24,93,.08)"]}},axisLine:{lineStyle:{color:"#40364f"}}},
    series:[{type:"radar",data:[{value:[96,88,74,82,55],name:"IGBT 功率模組",areaStyle:{color:"rgba(244,63,94,.25)"},lineStyle:{color:"#f43f5e"},itemStyle:{color:"#f43f5e"}},
      {value:[71,64,48,60,38],name:"車規級 MLCC",areaStyle:{color:"rgba(190,24,93,.2)"},lineStyle:{color:"#fb7185"},itemStyle:{color:"#fb7185"}}]}]});
  mk("c0b",{tooltip:TT,grid:GRID,
    xAxis:Object.assign({type:"value",name:"單源依賴度 %",nameTextStyle:{color:"#a99fbf"},max:100},AX),
    yAxis:Object.assign({type:"value",name:"標準交期(天)",nameTextStyle:{color:"#a99fbf"},max:120},AX),
    series:[{type:"scatter",symbolSize:function(d){return 8+d[2]/4;},data:[[96,112,80],[88,63,60],[71,84,55],[64,35,40],[91,98,70],[44,28,30],[38,21,25]],
      itemStyle:{color:new echarts.graphic.RadialGradient(0.4,0.3,1,[{offset:0,color:"#fb7185"},{offset:1,color:"#be185d"}]),opacity:.85}}]});
  mk("c0c",{tooltip:TT,legend:{textStyle:{color:"#a99fbf"},bottom:0,icon:"circle"},
    series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],data:[
      {value:38,name:"半導體"},{value:22,name:"被動元件"},{value:18,name:"機構件"},{value:14,name:"光學件"},{value:8,name:"化工料"}],
      label:{color:"#f3eef7",fontSize:11},itemStyle:{borderColor:"#171320",borderWidth:2},
      color:["#be185d","#fb7185","#f9a8c9","#9d174d","#7c2d5a"]}]});
}

/* ============ SCREEN 1 : 供應商配置矩陣 ============ */
function s1(){
  var items=["IGBT 功率模組","車規級 MLCC","高精度軸承","鋁擠型散熱片","導電膠 EC-780"];
  var sups=["瀚O科技","O豐電子","O盛材料","O鴻精機","日商 Nichi"];
  var M=[
    [100,0,0,0,0],
    [58,42,0,0,0],
    [70,0,30,0,0],
    [45,0,25,30,0],
    [40,30,0,0,30]
  ];
  var mh='<table class="matrix"><thead><tr><th>料件 ＼ 供應商</th>';
  for(var s=0;s<sups.length;s++)mh+='<th>'+sups[s]+'</th>';
  mh+='<th>合格數</th></tr></thead><tbody>';
  for(var i=0;i<items.length;i++){
    mh+='<tr><td style="text-align:left;font-weight:700;background:var(--panel2)">'+items[i]+'</td>';
    var cnt=0;
    for(var j=0;j<sups.length;j++){
      var v=M[i][j];var cls="cell-lo",txt="—";
      if(v===100){cls="cell-hi";txt="100%";cnt++;}
      else if(v>=40){cls="cell-100";txt=v+"%";cnt++;}
      else if(v>0){cls="cell-mid";txt=v+"%";cnt++;}
      mh+='<td class="mat '+cls+'">'+txt+'</td>';
    }
    mh+='<td style="font-weight:800;color:'+(cnt<=1?"var(--bad)":"var(--good)")+'">'+cnt+' 家</td></tr>';
  }
  mh+='</tbody></table>';
  return head("模組 · 配置管理","供應商配置矩陣","呈現每項關鍵料件對合格供應商的分單配置與資格認證狀態","5 料件 × 5 供應商")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("account_tree","已建矩陣料件","642","項","","")+
    kpi("verified","合格認證供應商","128","家","本季 +9","up")+
    kpi("looks_one","單源配置料件","217","項","紅色標記","down")+
    kpi("hub","平均供應商數","2.4","家/料件","目標 ≥ 3","")+
  '</div>'+
  '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">grid_on</span>料件—供應商分單配置矩陣</h3>'+
    '<div class="scrollx">'+mh+'</div>'+
    '<div class="legend"><span><i style="background:rgba(190,24,93,.5)"></i>單一來源 100%</span><span><i style="background:rgba(52,211,153,.5)"></i>主力分單 ≥40%</span><span><i style="background:rgba(251,191,36,.4)"></i>備援分單 &lt;40%</span><span><i style="background:#2c2540"></i>未配置</span></div></div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>供應商資格認證狀態</h3><div id="c1a" class="chart sm"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各供應商承接料件數</h3><div id="c1b" class="chart sm"></div></div>'+
  '</div>';
