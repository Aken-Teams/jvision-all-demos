<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-d:#0f7a37;
  --bg:#0b1220; --panel:#0f1a2b; --panel2:#132238; --line:#1e3049;
  --ink:#e6edf6; --mut:#8ea3bd; --dim:#5f7593;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,#0d1728,#0f1e33);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04240f;flex:0 0 auto;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand p{font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap}
.topbar .spacer{flex:1 1 auto;min-width:8px}
.status-pill{display:flex;align-items:center;gap:7px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:var(--accent2);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.nav{display:flex;gap:8px;padding:11px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:63px;z-index:20}
.nav button{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-width:0}
.nav button:hover{border-color:var(--accent);color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.3)}
.nav button .material-symbols-outlined{font-size:19px}
.nav .idx{font-size:11px;opacity:.7;font-weight:700}
.wrap{flex:1;padding:20px;max-width:1360px;margin:0 auto;width:100%}
.screen-head{margin-bottom:16px}
.screen-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.screen-head h2 .material-symbols-outlined{color:var(--accent2);font-size:24px}
.screen-head p{color:var(--mut);font-size:13px;margin-top:5px;max-width:760px;line-height:1.6}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card .sub{font-size:11px;color:var(--dim);font-weight:500;margin-left:auto}
.listpane{max-height:640px;overflow-y:auto}
.litem{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:.15s;background:var(--panel2);align-items:center}
.litem:hover{border-color:var(--accent)}
.litem.on{border-color:var(--accent);background:rgba(22,163,74,.1);box-shadow:0 0 0 1px var(--accent) inset}
.licon{width:38px;height:38px;border-radius:9px;background:#0c1526;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.licon .material-symbols-outlined{font-size:21px;color:var(--accent2)}
.linfo{min-width:0;flex:1}
.linfo b{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linfo span{font-size:11px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0}
.kv label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px;font-weight:600}
.kv b{font-size:14px;font-weight:700;word-break:break-word}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .kl{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .kv2{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.5px}
.kpi .kd{font-size:11px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-crit{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.b-high{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.4)}
.b-med{background:rgba(56,189,248,.13);color:#7dd3fc;border:1px solid rgba(56,189,248,.35)}
.b-low{background:rgba(34,197,94,.13);color:#86efac;border:1px solid rgba(34,197,94,.35)}
.b-gray{background:rgba(142,163,189,.13);color:var(--mut);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;padding:11px 13px;background:var(--panel2);color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(22,163,74,.05)}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
.chart{width:100%;overflow:hidden}
.zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.zone{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);min-width:0;position:relative}
.zone .zt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px}
.zone .zt .material-symbols-outlined{font-size:19px}
.zone .lvl{font-size:11px;color:var(--dim);margin-bottom:10px}
.zbar{height:7px;border-radius:5px;background:#0c1526;overflow:hidden;margin:8px 0}
.zbar span{display:block;height:100%;border-radius:5px}
.zmeta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);margin-top:6px;gap:6px;flex-wrap:wrap}
.acl{margin-top:14px}
.acl .arow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2);font-size:12px;flex-wrap:wrap}
.acl .arow .material-symbols-outlined{font-size:17px}
.chip{font-size:11px;padding:2px 8px;border-radius:6px;background:#0c1526;border:1px solid var(--line);font-weight:600;white-space:nowrap}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px 12px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl .ev.crit::before{background:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.tl .ev .et{font-size:11px;color:var(--dim);font-weight:600}
.tl .ev .eb{font-size:13px;font-weight:700;margin:2px 0 3px}
.tl .ev .ed{font-size:12px;color:var(--mut);line-height:1.5}
.prog{display:flex;flex-direction:column;gap:11px}
.prow{display:flex;align-items:center;gap:11px;min-width:0}
.prow .pn{font-size:12px;width:118px;flex:0 0 auto;color:var(--mut);font-weight:600}
.pbar{flex:1;height:9px;border-radius:6px;background:#0c1526;overflow:hidden;min-width:0}
.pbar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prow .pv{font-size:12px;font-weight:700;width:44px;text-align:right;flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.foot{text-align:center;color:var(--dim);font-size:11px;padding:22px 20px 30px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
@media(max-width:1000px){.split{grid-template-columns:1fr}.listpane{max-height:none}}
@media(max-width:820px){
  .detail-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .zone-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr}
  .nav button .ntx{display:none}
  .nav button{padding:9px 12px}
  .prow .pn{width:88px}
  .wrap{padding:14px}
}
</style>
</head>

      '<div class="prow" style="margin-bottom:16px"><span class="pn">處置進度</span><div class="pbar"><span style="width:'+n.prog+'%"></span></div><span class="pv">'+n.prog+'%</span></div>'+
      '<div class="tl">'+tlH+'</div>';
  }
  var items=document.querySelectorAll("#irlist [data-ir]");
  for(var j=0;j<items.length;j++){(function(el){el.addEventListener("click",function(){
    var all=document.querySelectorAll("#irlist [data-ir]");for(var q=0;q<all.length;q++){all[q].className="litem";}
    el.className="litem on";renderIr(+el.getAttribute("data-ir"));
  });})(items[j]);}
  renderIr(0);
}

/* ============ ROUTER ============ */
var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  disposeCharts();
  setNav(i);
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
