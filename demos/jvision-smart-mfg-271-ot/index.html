:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --violet:#6D28D9;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100vh;background:var(--color-background);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[data-a],[data-al],[data-ir]{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(37,99,235,.32);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px max(18px,calc((100vw - 1400px)/2));background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:11px;color:#fff;background:var(--blue);box-shadow:0 6px 16px rgba(37,99,235,.22)}
.logo .material-symbols-outlined{font-size:24px}
.brand h1{margin:0;font:700 17px/1.2 "Outfit",sans-serif;letter-spacing:.01em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.spacer{flex:1}
.status-pill{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #BBF7D0;border-radius:999px;background:#F0FDF4;color:#166534;font-size:12px;font-weight:700;white-space:nowrap}
.status-pill .material-symbols-outlined{font-size:16px}
.hero-cta{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid #C2410C;border-radius:9px;background:var(--color-accent);color:#111827;font-weight:700;font-size:12px;text-decoration:none;box-shadow:0 4px 12px rgba(234,88,12,.18);transition:transform .2s,box-shadow .2s,background .2s}
.hero-cta:hover{transform:translateY(-1px);background:#F97316;box-shadow:0 8px 18px rgba(234,88,12,.23)}
.nav-shell{position:sticky;top:65px;z-index:25;background:rgba(248,250,252,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.nav{display:flex;gap:6px;max-width:1400px;margin:auto;padding:9px 18px;overflow-x:auto;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:7px;flex:none;padding:9px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:650;transition:color .2s,background .2s,border-color .2s,box-shadow .2s}
.nav button:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
.nav button.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 5px 12px rgba(37,99,235,.2)}
.nav .idx{font:600 10px/1 "Outfit",sans-serif;opacity:.7}
.wrap{width:100%;max-width:1400px;margin:auto;padding:24px 18px 32px;flex:1}
.screen-head{position:relative;margin-bottom:18px;padding:20px 22px;overflow:hidden;border:1px solid #DBEAFE;border-radius:16px;background:linear-gradient(112deg,#fff 0%,#EFF6FF 100%);box-shadow:var(--shadow)}
.screen-head:after{content:"";position:absolute;right:-50px;top:-75px;width:210px;height:210px;border:32px solid rgba(37,99,235,.06);border-radius:50%}
.screen-head h2{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin:0;font:700 clamp(21px,2vw,27px)/1.2 "Outfit",sans-serif}
.screen-head h2 .material-symbols-outlined{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#DBEAFE;color:var(--blue)}
.screen-head p{position:relative;z-index:1;max-width:850px;margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.card{min-width:0;padding:17px;border:1px solid var(--line);border-radius:13px;background:var(--color-card);box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 13px;font:650 14px/1.4 "Outfit",sans-serif}
.card h3>.material-symbols-outlined{color:var(--blue)}
.sub{margin-left:auto;color:var(--muted);font:500 11px/1 "Work Sans",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;min-width:0;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .2s,border-color .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:0 10px 24px rgba(37,99,235,.09)}
.kpi:before{content:"";position:absolute;top:14px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.kl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:650}
.kl .material-symbols-outlined{color:var(--blue);font-size:17px}
.kv2{margin-top:8px;font:700 27px/1 "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.kd{margin-top:6px;font-size:11px;font-weight:650}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.listpane{max-height:630px;overflow:auto}
.litem{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}
.litem:hover{border-color:#93C5FD;transform:translateX(2px)}
.litem.on{border-color:var(--blue);background:#EFF6FF;box-shadow:0 0 0 1px var(--blue)}
.licon{display:grid;place-items:center;width:37px;height:37px;flex:none;border-radius:9px;background:#E9EFF8;color:var(--blue)}
.linfo{min-width:0;flex:1}
.linfo b,.linfo span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linfo b{font-size:12px}.linfo span{margin-top:3px;color:var(--muted);font-size:10px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#F8FAFC}
.kv label{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:650}
.kv b{font-size:13px;word-break:break-word}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.b-crit{color:#991B1B;background:#FEF2F2;border-color:#FCA5A5}
.b-high{color:#92400E;background:#FFFBEB;border-color:#FCD34D}
.b-med{color:#075985;background:#F0F9FF;border-color:#7DD3FC}
.b-low{color:#166534;background:#F0FDF4;border-color:#86EFAC}
.b-gray{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border:1px solid #CBD5E1;border-radius:6px;background:#F8FAFC;color:#334155;font-size:10px;font-weight:650;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th{padding:10px 12px;text-align:left;white-space:nowrap;background:#E9EFF8;color:#334155;border-bottom:1px solid #CBD5E1;font-size:10px;letter-spacing:.04em}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td:nth-last-child(-n+3){font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:#F8FAFC}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.chart{width:100%;overflow:hidden}
.zone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.zone{min-width:0;padding:13px;border:1px solid var(--line);border-radius:10px;background:#F8FAFC;transition:transform .2s,border-color .2s}
.zone:hover{transform:translateY(-2px);border-color:#93C5FD}
.zt{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px}
.lvl{margin:7px 0 9px;color:var(--muted);font-size:10px}
.zmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:10px;flex-wrap:wrap}
.zbar,.pbar{overflow:hidden;border-radius:999px;background:#DDE6F2}
.zbar{height:7px;margin:7px 0}.zbar span,.pbar span{display:block;height:100%;border-radius:inherit}
.acl{margin-top:12px}
.arow{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#F8FAFC;font-size:11px;flex-wrap:wrap}
.prog{display:flex;flex-direction:column;gap:11px}
.prow{display:flex;align-items:center;gap:10px;min-width:0}
.pn{width:122px;flex:none;color:var(--muted);font-size:11px;font-weight:650}
.pbar{height:8px;flex:1}.pbar span{background:linear-gradient(90deg,var(--blue),var(--color-secondary))}
.pv{width:42px;flex:none;text-align:right;font:650 11px/1 ui-monospace,monospace}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:8px;width:2px;background:#CBD5E1}
.ev{position:relative;padding:0 0 17px 12px}
.ev:before{content:"";position:absolute;left:-20px;top:3px;width:10px;height:10px;border:3px solid #DBEAFE;border-radius:50%;background:var(--blue)}
.ev.crit:before{border-color:#FECACA;background:var(--bad)}
.et{color:var(--muted);font:600 10px/1 ui-monospace,monospace}.eb{margin:3px 0;font-weight:700;font-size:12px}.ed{color:var(--muted);font-size:11px;line-height:1.55}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px}
.foot{padding:20px;text-align:center;color:var(--muted);font-size:10px}
.grid-item{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:1000px){.split{grid-template-columns:1fr}.listpane{max-height:none}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.detail-grid{grid-template-columns:1fr}.zone-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  .topbar{padding:10px 14px}.brand p,.status-pill{display:none}.hero-cta{padding:9px}.hero-cta span:last-child{display:none}
  .nav-shell{top:61px}.nav{padding:8px 14px}.nav button{min-width:42px;justify-content:center}.nav .ntx,.nav .idx{display:none}
  .wrap{padding:14px}.screen-head{padding:17px}.screen-head h2{font-size:20px}.kpis,.zone-grid{grid-template-columns:1fr}.pn{width:96px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .grid-item{opacity:1;transform:none}
}
</style>
