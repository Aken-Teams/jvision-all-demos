<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>員工酬勞與盈餘分派管理 · 經營治理系統</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#FEF3C7;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#E6FFFA;
  --hov:#F0FDFA;
  --track:#CCFBF1;
  --sidebar:#115E59;
  --sidebar2:#115E59;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:4px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Serif TC","PMingLiU",serif;
  font-size:15px;
  font-variant-numeric:tabular-nums lining-nums;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC","PMingLiU",serif;
  color:inherit;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus{outline:none}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  width:256px;
  height:100vh;
  min-width:0;
  padding:24px 16px 18px;
  overflow-y:auto;
  background:var(--sidebar);
  color:#FFFFFF;
  border-right:4px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 8px 24px;
  border-bottom:1px solid rgba(255,255,255,.28);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:#042F2E;
  background:var(--color-secondary);
  border:2px solid #FFFFFF;
  border-radius:2px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#FFFFFF;font-size:18px;font-weight:700;letter-spacing:.04em}
.brand-txt span{
  display:block;
  margin-top:1px;
  overflow:hidden;
  color:#CCFBF1;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:500;
  letter-spacing:.15em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav{display:flex;flex-direction:column;gap:6px;min-width:0;margin-top:20px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  min-width:0;
  padding:10px 11px;
  color:#D5FFFA;
  background:transparent;
  border:1px solid transparent;
  border-radius:2px;
  font-size:15px;
  font-weight:600;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
  white-space:nowrap;
}
.nav button:hover{color:#FFFFFF;background:#0F766E;border-color:#5EEAD4}
.nav button.on{color:#042F2E;background:var(--color-secondary);border-color:#FFFFFF}
.nav button.on::before{
  content:"";
  position:absolute;
  top:7px;
  bottom:7px;
  left:-12px;
  width:4px;
  background:#F59E0B;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav .txt{overflow:hidden;text-overflow:ellipsis}
.nav .idx{
  margin-left:auto;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  opacity:.8;
}
.side-foot{
  margin-top:auto;
  padding:16px 8px 2px;
  color:#CCFBF1;
  border-top:1px solid rgba(255,255,255,.28);
  font-size:12px;
  line-height:1.75;
}
.side-foot b{color:#FFFFFF}
.main{flex:1;min-width:0;padding:26px 32px 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:2px solid var(--color-primary);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:9px;
  color:#0F3D3A;
  font-size:27px;
  font-weight:700;
  letter-spacing:.01em;
  line-height:1.15;
}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:27px}
.topbar .sub{margin-top:5px;color:var(--color-muted-foreground);font-size:13px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 10px;
  color:#334155;
  background:var(--color-card);
  border:1px solid #2DD4BF;
  border-radius:2px;
  font-size:12px;
  font-weight:600;
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #FFFFFF;
  outline:1px solid var(--ok);
  border-radius:50%;
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#FFFFFF;
  background:var(--color-primary);
  border:2px solid #0F766E;
  border-radius:2px;
  font-weight:700;
}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
}
.card,.sec{padding:16px}
.sec{margin-bottom:14px}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row,.col{
  transition:border-color .18s ease,background-color .18s ease,transform .18s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:var(--color-primary)}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:#134E4A;
  font-size:17px;
  font-weight:700;
}
.card-h h3::after,.sec>h3::after{
  content:"";
  width:24px;
  height:2px;
  margin-left:2px;
  background:var(--color-accent);
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card-h .hint{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.sec>h3{margin-bottom:12px}
.sec>p{margin:0 0 13px;color:var(--color-muted-foreground);font-size:14px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:14px}
.dl dt{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat,.tile{position:relative;overflow:hidden;padding:15px 16px}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary)}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#115E59;
  background:#CCFBF1;
  border:1px solid #5EEAD4;
  border-radius:2px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-primary);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;
  color:#0F3D3A;
  font-family:"Crimson Pro",serif;
  font-size:27px;
  font-weight:600;
  letter-spacing:-.02em;
  line-height:1.15;
  text-align:right;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--color-muted-foreground);font-size:13px;font-weight:600}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:6px;
  padding:2px 5px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:11px;
  font-weight:700;
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.tile{display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--color-primary)}
.tile b{color:#134E4A;font-size:16px;font-weight:700}
.tile p{margin:0;color:var(--color-muted-foreground);font-size:12px;line-height:1.55}
.grid.g4:first-child{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  overflow:hidden;
  padding:0;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
}
.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{
  min-width:0;
  padding:15px 17px;
  background:transparent;
  border:0;
  border-top:4px solid var(--color-primary);
  border-right:1px solid var(--color-border);
  border-radius:0;
}
.grid.g4:first-child>*:last-child{border-right:0}
.grid.g4:first-child>.tile .ti,.grid.g4:first-child>.kpi .ico{width:32px;height:32px}

.card.pad0 .card-h{padding:15px 16px 0!important}
table{
  width:100%;
  border-collapse:collapse;
  color:#183F3C;
  font-size:13px;
  font-variant-numeric:tabular-nums lining-nums;
}
th{
  padding:10px 12px;
  color:#334155;
  background:var(--th);
  border-bottom:2px solid var(--color-primary);
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:10px 12px;
  border-bottom:1px solid #99F6E4;
  white-space:nowrap;
}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:#E6FFFA}
tbody tr:focus-within{background:#CCFBF1}
td b{color:#0F3D3A}
.mono{
  font-family:"Crimson Pro","Courier New",monospace;
  font-weight:600;
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #5EEAD4;border-radius:1px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:#334155;font-size:11px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--color-border)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-24px;
  width:14px;
  height:14px;
  background:#FFFFFF;
  border:3px solid var(--color-primary);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;color:#134E4A;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--color-muted-foreground);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--color-border);font-size:13px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:#475569}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small,.note{color:var(--color-muted-foreground);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--color-border);line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:9px;min-width:0;padding:10px;background:var(--th);border:1px solid var(--color-border);border-radius:2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;color:#134E4A;font-size:13px;font-weight:700}
.col-h .cnt{padding:1px 7px;color:#334155;background:#FFFFFF;border:1px solid var(--color-border);border-radius:2px;font-size:11px}
.pcard{padding:10px 11px;background:#FFFFFF;border:1px solid var(--color-border);border-left:4px solid var(--color-primary);border-radius:2px}
.pcard:hover{border-color:var(--color-primary)}
.pcard b{color:#134E4A;font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:#134E4A;font-size:11px}
.mini-av,.av{
  display:inline-flex;
  flex:none;
  align-items:center;
  justify-content:center;
  color:#115E59;
  background:#CCFBF1;
  border:1px solid var(--color-border);
  border-radius:2px;
  font-weight:700;
}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 13px;background:#FFFFFF;border:1px solid var(--color-border);border-radius:2px}
.lane-row:hover{border-color:var(--color-primary);background:#F0FDFA}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:31px;height:31px;color:#FFFFFF;background:var(--color-primary);border-radius:2px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{color:#134E4A;font-size:15px}
.lane-row .body p{margin:2px 0 0;color:var(--color-muted-foreground);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:23px;height:23px;color:#64748B;background:#FFFFFF;border:2px solid #94A3B8;border-radius:50%;font-size:11px}
.steps .ln{width:20px;height:2px;background:#94A3B8}
.steps .s.done{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:#0F766E;border-color:var(--color-primary);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 4px;border-bottom:1px dashed var(--color-border)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;color:#134E4A;font-size:14px}
.rep-row .sku span{color:var(--color-muted-foreground);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border:1px solid var(--color-border);border-radius:1px}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border:1px solid var(--color-border);border-radius:2px}
.band .rng{position:absolute;top:0;bottom:0;background:#99F6E4;border-radius:0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--color-accent);border:1px solid #92400E;border-radius:1px}

#screen>*,#screen>.grid>*{animation:reveal .36s ease-out both}
#screen>*:nth-child(2){animation-delay:.04s}
#screen>*:nth-child(3){animation-delay:.08s}
#screen>*:nth-child(4){animation-delay:.12s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:14px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g4:first-child{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g4:first-child>*:nth-child(2){border-right:0}
  .grid.g4:first-child>*:nth-child(-n+2){border-bottom:1px solid var(--color-border)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:0 4px 12px;border-bottom:0}
  .brand-logo{width:38px;height:38px}

var RENDER=[v0,v1,v2,v3];



/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
