<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宮廟信眾與服務管理 — 廟務營運主控台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root{
  --color-primary:#7C3AED;
  --color-on-primary:#FFFFFF;
  --color-secondary:#A78BFA;
  --color-on-secondary:#0F172A;
  --color-accent:#16A34A;
  --color-on-accent:#000000;
  --color-background:#FAF5FF;
  --color-foreground:#4C1D95;
  --color-card:#FFFFFF;
  --color-card-foreground:#4C1D95;
  --color-muted:#ECEEF9;
  --color-muted-foreground:#475569;
  --color-border:#DDD6FE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#7C3AED;

  --blue:#2563EB;
  --ink:#4C1D95;
  --muted:#475569;
  --line:#DDD6FE;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --panel:var(--color-card);
  --card:var(--color-card);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --dim:#64748B;
  --gold:#9A6700;
  --red:var(--color-destructive);
  --amber:#A16207;
  --purple:#6D28D9;

  --font-display:"Cormorant Garamond","Noto Sans TC",serif;
  --font-body:"Crimson Pro","Noto Sans TC",serif;
  --font-ui:"Noto Sans TC",sans-serif;
  --font-code:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow-sm:0 1px 2px rgba(76,29,149,.05),0 6px 18px rgba(76,29,149,.05);
  --shadow-md:0 12px 30px rgba(76,29,149,.10);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 92% 2%,rgba(167,139,250,.20),transparent 28rem),
    linear-gradient(180deg,#fff 0,var(--color-background) 19rem);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{color:var(--color-on-primary);background:var(--color-primary)}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 4px 20px rgba(76,29,149,.06);
  backdrop-filter:blur(16px);
}
.tb-inner{
  max-width:1400px;
  min-height:70px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid rgba(76,29,149,.16);
  border-radius:12px;
  box-shadow:0 8px 18px rgba(124,58,237,.22);
}
.logo .ms{font-size:24px}
.brand b{
  display:block;
  font-family:var(--font-ui);
  font-size:16px;
  font-weight:900;
  letter-spacing:.04em;
}
.brand small{
  display:block;
  margin-top:1px;
  color:var(--color-muted-foreground);
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.16em;
}
.tb-status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:6px 10px;
  background:#F0FDF4;
  border:1px solid #BBF7D0;
  border-radius:999px;
}
.pulse{
  width:9px;
  height:9px;
  border:2px solid #DCFCE7;
  border-radius:50%;
  background:var(--color-accent);
  animation:status-pulse 2s ease-out infinite;
}
@keyframes status-pulse{
  0%{box-shadow:0 0 0 0 rgba(22,163,74,.35)}
  70%,100%{box-shadow:0 0 0 8px rgba(22,163,74,0)}
}
.tb-status span.lb{color:#166534;font-family:var(--font-ui);font-size:12px;font-weight:700}
.tb-clock{color:#4C1D95;font-family:var(--font-code);font-size:12px;font-weight:700}
.navrow{
  max-width:1400px;
  margin:0 auto;
  padding:0 24px 12px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.navbtn{
  min-height:42px;
  min-width:0;
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex:0 0 auto;
  color:var(--color-muted-foreground);
  background:transparent;
  border:1px solid transparent;
  border-radius:10px;
  font-family:var(--font-ui);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.navbtn .ms{font-size:19px}
.navbtn:hover{color:var(--color-primary);background:#F5F3FF;border-color:var(--color-border);transform:translateY(-1px)}
.navbtn.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:0 6px 16px rgba(124,58,237,.22);
}
.navbtn.on::after{content:"目前";font-size:9px;font-weight:700;opacity:.82}

main{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
#app{min-height:65vh}
.scr-head{
  position:relative;
  margin:0 0 18px;
  padding:22px 24px;
  display:flex;
  align-items:flex-end;
  gap:10px 18px;
  flex-wrap:wrap;
  overflow:hidden;
  background:linear-gradient(120deg,#4C1D95,#7C3AED 72%,#8B5CF6);
  color:#FFFFFF;
  border:1px solid #6D28D9;
  border-radius:18px;
  box-shadow:var(--shadow-md);
}
.scr-head::after{
  content:"";
  position:absolute;
  right:-50px;
  top:-80px;
  width:220px;
  height:220px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 58px rgba(255,255,255,.035);
}
.scr-head h1{
  position:relative;
  z-index:1;
  font-family:var(--font-display);
  font-size:clamp(28px,3vw,38px);
  font-weight:700;
  line-height:1;
  letter-spacing:.015em;
}
.scr-head p{position:relative;z-index:1;color:#EDE9FE;font-family:var(--font-ui);font-size:13px}
.chip{
  position:relative;
  z-index:1;
  margin-left:auto;
  padding:7px 12px;
  color:#FFFFFF;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.38);
  border-radius:999px;
  font-family:var(--font-ui);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-3-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-3-1{grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr)}
.card{
  min-width:0;
  overflow:hidden;
  padding:17px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:14px;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
  animation:card-in .4s cubic-bezier(.2,.9,.25,1.25) both;
}
.grid .card:nth-child(2){animation-delay:.05s}
.grid .card:nth-child(3){animation-delay:.1s}
.grid .card:nth-child(4){animation-delay:.15s}
.card:hover{border-color:#C4B5FD;box-shadow:var(--shadow-md);transform:translateY(-2px)}
@keyframes card-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.card h3{
  margin-bottom:13px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-foreground);
  font-family:var(--font-ui);
  font-size:14px;
  font-weight:800;
}
.card h3 .ms{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#F5F3FF;
  border:1px solid var(--color-border);
  border-radius:8px;
  font-size:18px;
}
.card h3 .sub{margin-left:auto;color:var(--color-muted-foreground);font-size:11px;font-weight:600}

.kpi{position:relative;min-height:126px;padding:17px 17px 16px 20px}
.kpi .bar{
  position:absolute;
  left:0;
  top:14px;
  bottom:14px;
  width:4px;
  background:var(--color-primary);
  border-radius:0 4px 4px 0;
}
.kpi:nth-child(4n+2) .bar{background:#6D28D9}
.kpi:nth-child(4n+3) .bar{background:var(--color-accent)}
.kpi:nth-child(4n+4) .bar{background:#A16207}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-family:var(--font-ui);
  font-size:12px;
  font-weight:700;
}
.kpi .lab .ms{color:var(--color-primary);font-size:18px}
.kpi .val{
  margin-top:8px;
  color:#3B0764;
  font-family:var(--font-code);
  font-size:clamp(22px,2.1vw,29px);
  font-weight:800;
  letter-spacing:-.045em;
  line-height:1.2;
  word-break:break-word;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:var(--color-muted-foreground);font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:0}
.kpi .delta{margin-top:7px;font-family:var(--font-ui);font-size:11px;font-weight:800}
.kpi .delta::before{margin-right:5px;font-family:"Material Symbols Outlined";font-size:14px;vertical-align:-2px}
.up{color:#15803D}.up::before{content:"trending_up"}
.dn{color:var(--color-destructive)}.dn::before{content:"trending_down"}
.warn{color:#92400E}.warn::before{content:"warning"}
.gold{color:#854D0E}

.cw{position:relative;width:100%}
.cw:has(canvas){padding:12px;background:#3B176F;border:1px solid #6D28D9;border-radius:11px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:10px}
table{width:100%;min-width:480px;border-collapse:collapse;font-family:var(--font-ui);font-size:12.5px}
th{
  padding:10px;
  color:#4C1D95;
  background:#F5F3FF;
  border-bottom:1px solid var(--color-border);
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{padding:10px;border-bottom:1px solid #EDE9FE;color:#334155;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAF5FF}
td.gold{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-code);font-weight:650;font-variant-numeric:tabular-nums}

.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-family:var(--font-ui);
  font-size:10.5px;
  font-weight:800;
  line-height:1;
}
.tag::before{font-family:"Material Symbols Outlined";font-size:13px}
.t-ok{color:#166534;background:#F0FDF4}.t-ok::before{content:"check_circle"}
.t-wait{color:#92400E;background:#FFFBEB}.t-wait::before{content:"schedule"}
.t-no{color:#B91C1C;background:#FEF2F2}.t-no::before{content:"error"}
.t-info{color:#1D4ED8;background:#EFF6FF}.t-info::before{content:"info"}
.t-pur{color:#6D28D9;background:#F5F3FF}.t-pur::before{content:"label"}

.prog{height:8px;margin-top:7px;overflow:hidden;background:#E2E8F0;border-radius:999px}
.prog>i{display:block;height:100%;background:var(--color-primary);border-radius:inherit}
.lrow{min-width:0;padding:11px 3px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #EDE9FE}
.lrow:last-child{border-bottom:0}
.lrow .ic{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#F5F3FF;
  border:1px solid var(--color-border);
  border-radius:10px;
}
.lrow .ic .ms{font-size:19px}
.lrow .mn{min-width:0;flex:1}
.lrow .mn b{display:block;overflow:hidden;color:#3B0764;font-family:var(--font-ui);font-size:13px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.lrow .mn span{color:var(--color-muted-foreground);font-family:var(--font-ui);font-size:11.5px}
.lrow .rt{flex:none;text-align:right}

.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--color-border)}
.tl .ev{position:relative;padding:0 0 15px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{
  content:"";
  position:absolute;
  left:-21px;
  top:4px;
  width:10px;
  height:10px;
  background:var(--color-primary);
  border:3px solid #EDE9FE;
  border-radius:50%;
}
.tl .ev .tm{color:#6D28D9;font-family:var(--font-code);font-size:11px;font-weight:800}
.tl .ev b{display:block;margin:2px 0;color:#3B0764;font-family:var(--font-ui);font-size:13px;font-weight:800}
.tl .ev span{color:var(--color-muted-foreground);font-family:var(--font-ui);font-size:11.5px}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.col{min-width:0;padding:10px;background:#FAF5FF;border:1px solid var(--color-border);border-radius:11px}
.col>.ch{margin-bottom:9px;display:flex;align-items:center;gap:7px;color:#4C1D95;font-family:var(--font-ui);font-size:12px;font-weight:800}
.col>.ch .cnt{margin-left:auto;padding:2px 8px;color:#FFFFFF;background:var(--color-primary);border-radius:999px;font-family:var(--font-code);font-size:10px}
.ticket{min-width:0;margin-bottom:8px;padding:10px;background:#FFFFFF;border:1px solid var(--color-border);border-left:4px solid var(--color-primary);border-radius:8px;box-shadow:0 3px 10px rgba(76,29,149,.05)}
.ticket:last-child{margin-bottom:0}
.ticket b{display:block;color:#3B0764;font-family:var(--font-ui);font-size:12px;font-weight:800}
.ticket>span{color:var(--color-muted-foreground);font-family:var(--font-ui);font-size:10.5px}
.ticket .m{margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}

.seatwrap{overflow-x:auto;padding:3px}
.seats{min-width:430px;display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.seat{
  aspect-ratio:1;
  display:grid;
  place-items:center;
  color:#1E293B;
  border:1px solid rgba(15,23,42,.16);
  border-radius:6px;
  font-family:var(--font-code);
  font-size:9px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.s-lit{background:#FDE68A}.s-tai{background:#FDA4AF}.s-fu{background:#C4B5FD}
.s-free{color:#64748B;background:#F8FAFC;border:1px dashed #94A3B8}
.legend{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;color:var(--color-muted-foreground);font-family:var(--font-ui);font-size:11px}
.legend i{display:inline-block;width:13px;height:13px;margin-right:5px;border-radius:4px;vertical-align:-2px}
.donut-center{position:absolute;inset:12px;display:grid;place-items:center;color:#FFFFFF;pointer-events:none;text-align:center}
.donut-center b{display:block;font-family:var(--font-code);font-size:22px;font-weight:800}
.donut-center span{color:#DDD6FE;font-family:var(--font-ui);font-size:10px}
.stat-inline{display:flex;gap:18px;flex-wrap:wrap}
.stat-inline>div span{display:block;color:var(--color-muted-foreground);font-family:var(--font-ui);font-size:10.5px}
.stat-inline>div b{font-family:var(--font-code);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

.receipt{
  padding:15px;
  color:#422006;
  background:repeating-linear-gradient(0deg,#FFFBEB,#FFFBEB 27px,#FEF3C7 27px,#FEF3C7 28px);
  border:1px solid #D6B86A;
  border-radius:9px;
  font-family:var(--font-body);
  font-size:13px;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.45);
}
.receipt .rh{margin-bottom:9px;padding-bottom:9px;display:flex;align-items:center;gap:9px;border-bottom:1px dashed #B08938}
.receipt .rh .ms{color:#854D0E;font-size:22px}
.receipt .rl{padding:5px 0;display:flex;justify-content:space-between;color:#6B4F1D}
.receipt .rl b{color:#422006}
.receipt .rt2{margin-top:8px;padding-top:9px;display:flex;justify-content:space-between;border-top:1px dashed #B08938;font-family:var(--font-ui);font-weight:900}
.receipt .rt2 b{color:#854D0E;font-family:var(--font-code);font-size:17px}
.foot{margin-top:28px;padding-top:17px;color:var(--color-muted-foreground);border-top:1px solid var(--color-border);font-family:var(--font-ui);font-size:11px;text-align:center}

@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .tb-inner{padding-inline:16px}
  .navrow{padding-inline:16px}
  main{padding:16px 16px 48px}
  .g-2,.g-3,.g-3-2,.g-3-1{grid-template-columns:1fr}
  .scr-head{align-items:flex-start;padding:20px}
  .scr-head p{width:100%}
  .chip{margin-left:0}
}
@media(max-width:560px){
  .tb-inner{min-height:62px;gap:10px}
  .logo{width:38px;height:38px}
  .brand b{font-size:14px}
  .brand small{font-size:8px}
  .tb-status{width:100%;margin-left:0;justify-content:space-between}
  .navrow{padding-bottom:9px}
  .navbtn{min-width:44px;min-height:44px;padding:9px 11px}
  .navbtn.on::after{display:none}
  main{padding:12px 12px 42px}
  .scr-head{border-radius:14px}
  .scr-head h1{font-size:29px}
  .g-kpi{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{min-height:118px;padding:14px 12px 13px 16px}
  .kpi .val{font-size:20px;letter-spacing:-.055em}
  .kpi .delta{font-size:10px}
  .card{padding:14px;border-radius:12px}
  .board{grid-template-columns:1fr}
  .hidelab{display:none}
}
@media(max-width:390px){
  .g-kpi{grid-template-columns:1fr}
  .kpi{min-height:auto}
  .tb-clock{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .card,.navbtn{transform:none!important}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <div class="logo"><span class="ms">temple_buddhist</span></div>
      <div><b>慈恩宮 廟務主控台</b><small>TEMPLE OPS TERMINAL</small></div>
    </div>
    <div class="tb-status">

(function(){
  var nv=document.getElementById("nav"),h="";
  NAV.forEach(function(o,idx){
    h+='<button class="navbtn" data-i="'+idx+'"><span class="ms">'+o.i+'</span><span class="hidelab">'+o.t+'</span></button>';
  });
  nv.innerHTML=h;
  nv.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");
    if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

function show(i){
  destroyAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  }
  (SCR[i]||SCR[0])();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
