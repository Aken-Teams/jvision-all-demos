<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宮廟信眾與服務管理 — 廟務營運主控台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0d9488;--accent2:#2dd4bf;
  --bg:#0a1512;--panel:#0f211d;--card:#132b26;
  --line:#1e3a34;--txt:#e7f3f0;--mut:#8fb3ac;--dim:#5f857e;
  --gold:#e0b64f;--red:#ef6d6d;--amber:#e5a54b;--blue:#5aa9d6;--purple:#a888e0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#0f2b25 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;line-height:1.55;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:rgba(9,20,17,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#04211d;box-shadow:0 0 20px rgba(45,212,191,.35)}
.logo .ms{font-size:23px}
.brand b{font-family:"Noto Sans TC";font-weight:900;font-size:16px;letter-spacing:.5px}
.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:2px;font-weight:600}
.tb-status{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}70%{box-shadow:0 0 0 8px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
.tb-status span.lb{font-size:12px;color:var(--mut)}
.tb-clock{font-family:"Inter";font-weight:700;font-size:13px;color:var(--accent2)}
.navrow{max-width:1360px;margin:0 auto;padding:0 18px 10px;display:flex;gap:8px;flex-wrap:wrap}
.navbtn{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:10px;font-family:"Noto Sans TC";font-weight:700;font-size:13.5px;transition:.16s;white-space:nowrap}
.navbtn .ms{font-size:19px}
.navbtn:hover{border-color:var(--accent);color:var(--txt)}
.navbtn.on{background:linear-gradient(135deg,rgba(13,148,136,.95),rgba(45,212,191,.8));color:#04211d;border-color:transparent;box-shadow:0 4px 18px rgba(13,148,136,.35)}
main{max-width:1360px;margin:0 auto;padding:8px 18px 60px}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.scr-head h1{font-family:"Noto Sans TC";font-size:22px;font-weight:900;letter-spacing:.5px}
.scr-head p{color:var(--mut);font-size:13px}
.chip{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;color:var(--accent2);font-weight:700;white-space:nowrap}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-3-2{grid-template-columns:2fr 1fr}
.g-3-1{grid-template-columns:1.3fr 1fr}
@media(max-width:820px){.g-kpi{grid-template-columns:1fr 1fr}.g-2,.g-3,.g-3-2,.g-3-1{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--card));border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;overflow:hidden}
.card h3{font-family:"Noto Sans TC";font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .ms{font-size:19px;color:var(--accent2)}
.card h3 .sub{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600}
.kpi{position:relative}
.kpi .lab{font-size:12.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lab .ms{font-size:18px;color:var(--accent2)}
.kpi .val{font-family:"Inter";font-weight:800;font-size:27px;margin-top:9px;letter-spacing:-.5px;word-break:break-word}
.kpi .val small{font-size:14px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px}
.up{color:var(--accent2)}.dn{color:var(--red)}.warn{color:var(--amber)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:15px 0 0 15px;background:linear-gradient(var(--accent),var(--accent2))}
.cw{position:relative;width:100%}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{text-align:left;color:var(--dim);font-weight:700;font-size:11.5px;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(30,58,52,.5);color:var(--txt);white-space:nowrap}
tr:hover td{background:rgba(45,212,191,.04)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.t-ok{background:rgba(45,212,191,.14);color:var(--accent2)}
.t-wait{background:rgba(229,165,75,.14);color:var(--amber)}
.t-no{background:rgba(239,109,109,.14);color:var(--red)}
.t-info{background:rgba(90,169,214,.14);color:var(--blue)}
.t-pur{background:rgba(168,136,224,.14);color:var(--purple)}
.mono{font-family:"Inter";font-weight:600}
.gold{color:var(--gold)}
.prog{height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.prog > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(30,58,52,.5);min-width:0}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(45,212,191,.1)}
.lrow .ic .ms{font-size:19px;color:var(--accent2)}
.lrow .mn{min-width:0;flex:1}
.lrow .mn b{font-size:13.5px;font-family:"Noto Sans TC";font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .mn span{font-size:12px;color:var(--mut)}
.lrow .rt{text-align:right;flex:none}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 0}
.tl .ev::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(45,212,191,.15)}
.tl .ev .tm{font-family:"Inter";font-size:11px;color:var(--accent2);font-weight:700}
.tl .ev b{display:block;font-family:"Noto Sans TC";font-size:13.5px;font-weight:700;margin:2px 0}
.tl .ev span{font-size:12px;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:rgba(9,20,17,.5);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.col > .ch{display:flex;align-items:center;gap:7px;font-family:"Noto Sans TC";font-weight:700;font-size:12.5px;margin-bottom:10px;color:var(--mut)}
.col > .ch .cnt{margin-left:auto;background:var(--card);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--accent2)}
.ticket{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px;min-width:0}
.ticket b{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700;display:block}
.ticket span{font-size:11px;color:var(--mut)}
.ticket .m{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.seatwrap{overflow-x:auto}
.seats{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;min-width:430px}
.seat{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;font-family:"Inter";color:#04211d}
.s-lit{background:linear-gradient(135deg,var(--gold),#f2d078);box-shadow:0 0 8px rgba(224,182,79,.5)}
.s-tai{background:linear-gradient(135deg,#c0575a,#e08487)}
.s-fu{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.s-free{background:rgba(255,255,255,.06);color:var(--dim);border:1px dashed var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:middle}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.donut-center b{font-family:"Inter";font-size:24px;font-weight:800;display:block}
.donut-center span{font-size:11px;color:var(--mut)}
.stat-inline{display:flex;gap:18px;flex-wrap:wrap}
.stat-inline > div span{font-size:11px;color:var(--mut);display:block}
.stat-inline > div b{font-family:"Inter";font-size:18px;font-weight:800}
.receipt{background:repeating-linear-gradient(0deg,var(--card),var(--card) 27px,rgba(45,212,191,.03) 27px,rgba(45,212,191,.03) 28px);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px}
.receipt .rh{display:flex;align-items:center;gap:9px;border-bottom:1px dashed var(--line);padding-bottom:9px;margin-bottom:9px}
.receipt .rh .ms{color:var(--gold);font-size:22px}
.receipt .rl{display:flex;justify-content:space-between;padding:5px 0;color:var(--mut)}
.receipt .rl b{color:var(--txt)}
.receipt .rt2{border-top:1px dashed var(--line);margin-top:8px;padding-top:9px;display:flex;justify-content:space-between;font-family:"Noto Sans TC";font-weight:900}
.receipt .rt2 b{color:var(--gold);font-size:18px;font-family:"Inter"}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:560px){.hidelab{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <div class="logo"><span class="ms">temple_buddhist</span></div>
      <div><b>慈恩宮 廟務主控台</b><small>TEMPLE OPS TERMINAL</small></div>
    </div>
    <div class="tb-status">
      <span class="pulse"></span><span class="lb">系統連線正常</span>
      <span class="tb-clock">乙巳年 · 農曆七月十五</span>
    </div>
  </div>
  <div class="navrow" id="nav"></div>
</div>
<main><div id="app"></div>
  <div class="foot">宮廟信眾與服務管理 Demo · 純前端展示 · 資料為模擬產生，僅供介面呈現</div>
</main>

<script>
"use strict";
var App=document.getElementById("app");
var charts={};
var NAV=[
  {i:"dashboard",t:"廟務總覽"},
  {i:"groups",t:"信眾名冊"},
  {i:"bolt",t:"點燈登記"},
  {i:"calendar_month",t:"法會活動"},
  {i:"receipt_long",t:"捐獻收據"},
  {i:"insights",t:"香火洞察"}
];
function nf(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}
var GRID="rgba(143,179,172,.14)",TICK="#8fb3ac";
function baseScales(){
  return {
    x:{grid:{color:GRID},ticks:{color:TICK,font:{size:11}}},
    y:{grid:{color:GRID},ticks:{color:TICK,font:{size:11}},beginAtZero:true}
  };
}
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  if(charts[id]){charts[id].destroy();charts[id]=null;}
  charts[id]=new Chart(el.getContext("2d"),cfg);
}
function destroyAll(){for(var k in charts){if(charts[k]){charts[k].destroy();charts[k]=null;}}}
function head(t,d,chip){
  return '<div class="scr-head"><h1>'+t+'</h1><p>'+d+'</p><span class="chip">'+chip+'</span></div>';
}
function miniK(ic,l,v,c,d){
  return '<div class="card kpi"><i class="bar"></i>'+
    '<div class="lab"><span class="ms">'+ic+'</span>'+l+'</div>'+
    '<div class="val">'+v+'</div>'+
    '<div class="delta '+c+'">'+d+'</div></div>';
}

/* SCREEN 0 — 廟務總覽 */
function scr0(){
  var kpis=[
    {ic:"volunteer_activism",l:"今日香油捐獻",v:"NT$ 128,600",d:"較昨日 +12.4%",c:"up"},
    {ic:"bolt",l:"點燈總數",v:"3,842<small>盞</small>",d:"本季新增 486 盞",c:"up"},
    {ic:"groups",l:"登錄信眾",v:"9,517<small>人</small>",d:"本月 +134 人",c:"up"},
    {ic:"event",l:"待辦法會",v:"4<small>場</small>",d:"7 日內 2 場",c:"warn"}
  ];
  var kh="";
  kpis.forEach(function(k){
    kh+='<div class="card kpi"><i class="bar"></i>'+
      '<div class="lab"><span class="ms">'+k.ic+'</span>'+k.l+'</div>'+
      '<div class="val">'+k.v+'</div>'+
      '<div class="delta '+k.c+'">'+k.d+'</div></div>';
  });
  var events=[
    {tm:"07:40",b:"晨間開廟 · 上香",s:"值日：林明志 · 一切正常"},
    {tm:"09:15",b:"太歲燈登記 12 筆",s:"承辦：陳美惠"},
    {tm:"11:02",b:"中元普渡供品驗收",s:"物資組確認 38 項供品到位"},
    {tm:"14:30",b:"功德金收據開立 27 張",s:"合計 NT$ 96,300"},
    {tm:"16:45",b:"志工排班確認",s:"週六法會 24 位志工到位"}
  ];
  var ev="";
  events.forEach(function(e){ev+='<div class="ev"><div class="tm">'+e.tm+'</div><b>'+e.b+'</b><span>'+e.s+'</span></div>';});
  var todo=[
    {ic:"receipt_long",b:"補開捐獻收據 3 張",s:"逾期 1 天",r:"待處理",c:"t-no"},
    {ic:"bolt",b:"光明燈燈位重配 5 盞",s:"A 區已滿",r:"進行中",c:"t-wait"},
    {ic:"groups",b:"信眾聯絡資料補正",s:"14 筆缺電話",r:"待處理",c:"t-wait"},
    {ic:"inventory_2",b:"金紙庫存偏低",s:"剩 12%",r:"採購中",c:"t-info"}
  ];
  var td="";
  todo.forEach(function(t){
    td+='<div class="lrow"><div class="ic"><span class="ms">'+t.ic+'</span></div>'+
      '<div class="mn"><b>'+t.b+'</b><span>'+t.s+'</span></div>'+
      '<div class="rt"><span class="tag '+t.c+'">'+t.r+'</span></div></div>';
  });
  App.innerHTML=head("廟務總覽","今日香火、點燈、法會與捐獻的即時營運概況","乙巳年 · 七月十五")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+kh+'</div>'+
    '<div class="grid g-3-2" style="margin-bottom:14px">'+
      '<div class="card"><h3><span class="ms">monitoring</span>近 14 日香油捐獻趨勢<span class="sub">單位：仟元</span></h3>'+
        '<div class="cw" style="height:260px"><canvas id="c0a"></canvas></div></div>'+
      '<div class="card"><h3><span class="ms">history</span>今日廟務動態</h3><div class="tl">'+ev+'</div></div>'+
    '</div>'+
    '<div class="grid g-2">'+
      '<div class="card"><h3><span class="ms">checklist</span>待辦與提醒<span class="sub">4 項</span></h3>'+td+'</div>'+
      '<div class="card"><h3><span class="ms">pie_chart</span>本月捐獻類別分布</h3>'+
        '<div class="cw" style="height:230px"><canvas id="c0b"></canvas></div></div>'+
    '</div>';
  void App.offsetHeight;
  mkChart("c0a",{type:"line",data:{
    labels:["7/1","7/3","7/5","7/7","7/9","7/11","7/13"],
    datasets:[{label:"捐獻",data:[86,94,112,88,131,109,128],borderColor:"#2dd4bf",backgroundColor:"rgba(45,212,191,.16)",fill:true,tension:.35,borderWidth:2.5,pointRadius:3,pointBackgroundColor:"#2dd4bf"}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:baseScales()}});
  mkChart("c0b",{type:"doughnut",data:{
    labels:["點燈","法會功德","香油錢","供品捐贈"],
    datasets:[{data:[42,26,22,10],backgroundColor:["#e0b64f","#2dd4bf","#0d9488","#5aa9d6"],borderColor:"#0a1512",borderWidth:3}]
  },options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{color:"#e7f3f0",font:{size:12},boxWidth:12}}}}});
}

/* SCREEN 1 — 信眾名冊 */
function scr1(){
  var rows=[
    {id:"D-100482",nm:"王承德",sex:"男",b:"庚子·1960",area:"三重",act:14,last:"點燈",st:"t-ok",sl:"活躍"},
    {id:"D-100517",nm:"李淑芬",sex:"女",b:"癸卯·1963",area:"新莊",act:31,last:"法會報名",st:"t-ok",sl:"活躍"},
    {id:"D-100633",nm:"陳文彬",sex:"男",b:"戊申·1968",area:"蘆洲",act:6,last:"捐獻",st:"t-info",sl:"一般"},
    {id:"D-100701",nm:"張惠雯",sex:"女",b:"辛亥·1971",area:"板橋",act:22,last:"點燈",st:"t-ok",sl:"活躍"},
    {id:"D-100844",nm:"林國樑",sex:"男",b:"丙午·1966",area:"三重",act:2,last:"建檔",st:"t-wait",sl:"新登錄"},
    {id:"D-100912",nm:"黃美玲",sex:"女",b:"乙巳·1965",area:"泰山",act:0,last:"—",st:"t-no",sl:"待補資料"},
    {id:"D-101033",nm:"吳志豪",sex:"男",b:"壬子·1972",area:"新莊",act:18,last:"法會報名",st:"t-ok",sl:"活躍"}
  ];
  var tr="";
  rows.forEach(function(r){
    tr+='<tr><td class="mono">'+r.id+'</td><td><b>'+r.nm+'</b></td><td>'+r.sex+'</td>'+
      '<td>'+r.b+'</td><td>'+r.area+'</td><td class="mono">'+r.act+' 次</td>'+
      '<td>'+r.last+'</td><td><span class="tag '+r.st+'">'+r.sl+'</span></td></tr>';
  });
  App.innerHTML=head("信眾名冊","信徒基本資料、生辰、聯絡與參與紀錄集中管理","共 9,517 位信眾")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      miniK("groups","登錄信眾","9,517","up","本月 +134")+
      miniK("bolt","本月活躍","3,120","up","佔 32.8%")+
      miniK("person_add","本週新登錄","41","up","+9 待補")+
      miniK("warning","資料待補正","14","warn","缺聯絡方式")+
    '</div>'+
    '<div class="grid g-3-1" style="margin-bottom:14px">'+
      '<div class="card"><h3><span class="ms">groups</span>信眾名冊<span class="sub">近期參與</span></h3>'+
        '<div class="tbl-wrap"><table><thead><tr><th>信眾編號</th><th>姓名</th><th>性別</th><th>生辰</th><th>轄區</th><th>參與</th><th>最近服務</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="ms">bar_chart</span>信眾轄區分布</h3>'+
        '<div class="cw" style="height:270px"><canvas id="c1a"></canvas></div></div>'+

    datasets:[{label:"香火(萬)",data:[210,96,72,188,164,88],backgroundColor:["#e0b64f","#5aa9d6","#a888e0","#0d9488","#2dd4bf","#e5a54b"],borderRadius:6}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:baseScales()}});
}

var SCR=[scr0,scr1,scr2,scr3,scr4,scr5];

(function(){
  var nv=document.getElementById("nav"),h="";
  NAV.forEach(function(o,idx){
    h+='<button class="navbtn" data-i="'+idx+'"><span class="ms">'+o.i+'</span><span class="hidelab">'+o.t+'</span></button>';
  });
  nv.innerHTML=h;
  nv.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");
    if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

function show(i){
  destroyAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  }
  (SCR[i]||SCR[0])();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
