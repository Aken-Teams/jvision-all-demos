<style>

*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand .lg{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-content:center;flex:none;box-shadow:0 8px 18px rgba(234,88,12,.32)}
.brand b{color:var(--ink);font-size:15px;display:block;font-family:"Noto Sans TC"}
.brand small{color:var(--mut);font-size:10px;letter-spacing:.14em}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav .t{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:10px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:var(--body);font:inherit;font-size:13.5px;font-weight:600;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:21px;color:#c6ad97}
.nav button:hover{background:var(--bg)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff}
.nav button.on .material-symbols-outlined{color:#fff}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:#ffe4d3;color:var(--acc-d);border-radius:999px;padding:1px 8px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
.side-f{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.doc{display:flex;align-items:center;gap:10px}
.doc .av{width:34px;height:34px;border-radius:50%;background:#ffe4d3;color:var(--acc-d);font-weight:800;display:grid;place-content:center}

.main{min-width:0}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.top h1{margin:0;font-size:19px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.top .sub{font-size:12px;color:var(--mut)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--acc-d);background:#ffe4d3;border-radius:999px;padding:6px 12px}
.pill.live i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.body{padding:22px 26px 44px}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.vh p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--acc-d);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,rgba(234,88,12,.12),transparent 70%)}
.kpi .l{font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--acc)}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);margin-top:7px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:12px;font-weight:800;color:var(--acc-d);margin-top:4px}
.kpi .d.bad{color:var(--red)}.kpi .d.good{color:var(--green)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g-53{grid-template-columns:1.15fr .85fr}
.g-64{grid-template-columns:1.35fr 1fr}
.g-11{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.card>h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Noto Sans TC"}
.card>h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card>h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc)}
.scroll{overflow-x:auto}
.chart-wrap{position:relative;height:270px;width:100%}
.chart-wrap.sm{height:230px}
.note{background:var(--bg);border-radius:12px;padding:14px;font-size:13px;color:var(--body);line-height:1.7}
.miniq{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.miniq:first-of-type{border-top:0}
.miniq b{color:var(--ink);font-weight:700}.miniq span{color:var(--acc-d);font-weight:800;font-family:Inter}

.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl tr:hover td{background:var(--bg)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.g-ok{background:#dcfce7;color:#166534}.g-wait{background:#fef3c7;color:#92400e}.g-rej{background:#fee2e2;color:#991b1b}.g-info{background:#dbeafe;color:#1e40af}.g-pur{background:#ede9fe;color:#6d28d9}.g-mut{background:#f1efec;color:#6b5c4d}

.tt-wrap{overflow-x:auto}
.timetable{display:grid;grid-template-columns:76px repeat(6,minmax(112px,1fr));gap:6px;min-width:720px}
.tt-h{font-size:11.5px;font-weight:800;color:var(--mut);text-align:center;padding:7px 0;background:var(--bg);border-radius:8px}
.tt-t{font-size:11px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center;background:var(--bg);border-radius:8px;padding:6px 4px;line-height:1.3}
.tt-c{border:1px solid var(--line);border-radius:9px;min-height:58px;padding:6px 7px;font-size:11px;position:relative}
.tt-c.empty{background:#fdfaf7}
.tt-c.k{color:#fff}
.tt-c b{font-size:11.5px;display:block;font-family:"Noto Sans TC"}
.tt-c small{font-size:10px;opacity:.92;display:block;margin-top:2px}
.subj{background:#ea580c}.subj-m{background:#2563eb}.subj-e{background:#7c3aed}.subj-s{background:#16a34a}.subj-c{background:#0891b2}.subj-p{background:#db2777}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}

.classpick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.classpick button{border:1px solid var(--line);background:#fff;color:var(--mut);font:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.classpick button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.roll{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stu{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;background:#fff}
.stu .sav{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;display:grid;place-content:center;font-weight:800;font-size:14px;flex:none;font-family:"Noto Sans TC"}

.att-b{font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;flex:none}
.a-p{background:#dcfce7;color:#166534}.a-l{background:#fef3c7;color:#92400e}.a-a{background:#fee2e2;color:#991b1b}.a-o{background:#e0e7ef;color:#475569}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.mc{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.mc .l{font-size:11px;color:var(--mut);font-weight:700}
.mc .v{font-size:20px;font-weight:900;font-family:Inter;margin-top:3px;color:var(--ink)}
/* progress bar */
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:9px 0 7px}
.bar span{display:block;height:100%}
/* invoice */
.inv{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.inv .ih{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.inv .ih b{font-size:16px;font-family:"Noto Sans TC"}
.inv .ih span{font-size:11.5px;opacity:.94;display:block;margin-top:2px}
.inv .ihr{text-align:right}.inv .ihr .big{font-size:23px;font-weight:900;font-family:Inter}
.inv .ib{padding:6px 18px 16px}
.sr{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.sr.tot{border-bottom:0;font-weight:900;font-size:15px;color:var(--acc-d)}
.sr .rn{font-family:Inter}
.rows{display:flex;flex-direction:column;gap:11px}
.prow{border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.prow .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prow .ph b{font-family:"Noto Sans TC";font-size:13.5px;color:var(--ink)}
.prow .meta{font-size:11.5px;color:var(--mut);margin-top:5px}
/* msg */
.msg{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;padding:11px 14px;margin-bottom:10px}
.msg b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.msg small{display:block;color:var(--mut);font-size:12px;margin-top:3px;line-height:1.5}
.msg .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;flex:none}.nav .t{display:none}.side-f{display:none}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g-53,.g-64,.g-11{grid-template-columns:1fr}
  .mini4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:420px){
  .top{flex-wrap:wrap;padding:12px 16px;gap:8px}.top h1{font-size:17px}.body{padding:16px 14px 30px}
  .kpis{grid-template-columns:1fr}
}
</style>
