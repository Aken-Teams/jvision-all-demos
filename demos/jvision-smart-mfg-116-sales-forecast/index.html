<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales Forecast 業務預測｜Jvision 系統 Demo</title>
<meta name="description" content="製造業滾動式業務預測：填報、歷史比對、審核彙整、PMC 交接與覆盤準確率" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#15803d; --accent2:#4ade80; --bg:#f1f5f0; --ink:#14261a; --muted:#5b6b60;
  --card:#ffffff; --line:#e0e8e0; --side:#0f2416; --side2:#16351f;
  --good:#15803d; --warn:#d97706; --bad:#dc2626; --info:#0369a1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--side),var(--side2));
  color:#dcefe0;display:flex;flex-direction:column;padding:22px 16px;gap:6px;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px 8px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:12px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04160b;flex:0 0 40px}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:800;color:#fff;display:block;line-height:1.3}
.brand span{font-size:11px;color:#8fb79a}
.navlist{display:flex;flex-direction:column;gap:4px;min-width:0}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;border:0;background:transparent;
  color:#bcd6c3;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;min-width:0;transition:.15s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#1c9a4b);color:#fff;box-shadow:0 6px 16px rgba(21,128,61,.35)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#7ea589;line-height:1.6}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 48px;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .tt{min-width:0}
.topbar h1{font-size:21px;margin:0 0 3px;font-weight:800;letter-spacing:.3px}
.topbar p{margin:0;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#dcf3e2;color:var(--accent);font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px}
.pill .material-symbols-outlined{font-size:15px}

.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.7fr}
.gspan{grid-column:1/-1}
.min0{min-width:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{color:var(--muted);font-size:11.5px;margin:0 0 14px}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0;position:relative;overflow:hidden}
.kpi .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:900;margin:3px 0 2px;letter-spacing:.3px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .chg{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .chg .material-symbols-outlined{font-size:14px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}

.chart{width:100%;height:280px;overflow:hidden;min-width:0}
.chart.sm{height:230px}
.chart.lg{height:330px}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f4f8f4;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.4px;text-transform:uppercase;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f6faf6}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.g{background:#dcf3e2;color:var(--good)} .tag.w{background:#fdf0d9;color:var(--warn)}
.tag.b{background:#fde5e5;color:var(--bad)} .tag.i{background:#dceaf5;color:var(--info)}
.tag.n{background:#eef1ee;color:var(--muted)}

.bar{height:8px;border-radius:6px;background:#e8efe8;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.col{background:#f6faf6;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col > .h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:10px}
.col > .h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.ci{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;min-width:0}
.ci .t{font-size:12.5px;font-weight:700;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis}
.ci .m{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* timeline */
.tl{position:relative;padding-left:26px;min-width:0}
.tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev:before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #d5ecdb}
.tl .ev .d{font-size:11px;color:var(--muted);font-weight:600}
.tl .ev .ti{font-size:13px;font-weight:700;margin:2px 0 3px}
.tl .ev .de{font-size:11.5px;color:var(--muted);line-height:1.6}

/* forecast input rows */
.frow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 90px;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff;min-width:0}
.frow .lbl{font-size:12.5px;font-weight:700;min-width:0}
.frow .lbl small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
.frow .fld{font-size:12px}
.frow .fld b{font-size:14px;font-weight:800}
.frow .fld span{color:var(--muted);font-size:10.5px;display:block}
.inp{border:1px solid var(--accent2);background:#f0fbf3;border-radius:9px;padding:7px 9px;font-size:13px;font-weight:800;color:var(--accent);text-align:right;font-family:inherit;width:100%}
.mhead{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 90px;gap:10px;padding:0 12px 8px;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;min-width:520px}
.frowwrap{min-width:520px}

/* gauge / accuracy */
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.accbox{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#fff;min-width:0}
.accbox .n{font-size:24px;font-weight:900}
.accbox .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

.note{background:#f0fbf3;border:1px solid #c9ebd3;border-radius:12px;padding:12px 14px;font-size:12px;color:#14532d;line-height:1.65;display:flex;gap:9px}
.note .material-symbols-outlined{font-size:19px;color:var(--accent);flex:0 0 auto}

.mobnav{display:none}

@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex:none;flex-direction:column;padding:14px 14px 8px}
  .brand{border-bottom:0;margin-bottom:8px;padding-bottom:6px}
  .side-foot{display:none}
  .navlist{flex-direction:row;flex-wrap:wrap;gap:8px}
  .navbtn{width:auto;flex:0 0 auto;padding:9px 13px}
  .main{padding:20px 16px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .acc-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .navbtn .nx{display:none}
  .navbtn{padding:10px}
  .board{grid-template-columns:1fr}
  .topbar h1{font-size:18px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">trending_up</span></div>
      <div class="min0"><b>Sales Forecast</b><span>業務預測 · 滾動式預測平台</span></div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="side-foot">
      製造業滾動式業務預測<br/>ERP · Pipeline · PMC 同步<br/>版本 FC-2026Q3 · Demo
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h1 id="scr-title">預測總覽儀表</h1>
        <p id="scr-sub">本期預測金額、達成率與偏差率一頁掌握</p>
      </div>
      <span class="pill"><span class="material-symbols-outlined">calendar_month</span><span id="period-pill">週期 2026-08 / Q3 滾動</span></span>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
"use strict";

var MODS=[
  {i:"dashboard",t:"預測總覽儀表",s:"本期預測金額、達成率與偏差率一頁掌握"},
  {i:"request_quote",t:"業務預測填報",s:"業務個人/團隊逐品項填報月度預測數量與金額"},
  {i:"history",t:"歷史銷售比對",s:"預測值對比歷史實績，分析趨勢與季節性"},
  {i:"fact_check",t:"主管審核彙整",s:"主管調整、核准並彙整全團隊滾動式預測"},
  {i:"account_tree",t:"PMC 產銷交接",s:"核定預測轉為產能與備料需求供 PMC 排程"},
  {i:"insights",t:"覆盤與準確率",s:"期末預測 vs 實際覆盤，追蹤準確率與偏差"}
];

var view=document.getElementById("view");
var nav=document.getElementById("nav");
var charts=[];

// build nav
(function(){
  var h="";
  for(var k=0;k<MODS.length;k++){
    h+='<button class="navbtn" data-i="'+k+'"><span class="material-symbols-outlined">'+MODS[k].i+'</span><span class="nx">'+MODS[k].t+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var idx=+this.getAttribute("data-i");
      location.hash="v"+idx;
    });
  }
})();

function money(n){return (Math.round(n)).toLocaleString("en-US");}

function disposeCharts(){
  for(var k=0;k<charts.length;k++){ try{charts[k].dispose();}catch(e){} }
  charts=[];
}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el) return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
var PAL=["#15803d","#4ade80","#0369a1","#d97706","#94a3b8","#7c3aed"];

/* ================= SCREEN 0 : Overview dashboard ================= */
function s0(){
  return ''+
  '<div class="grid g4">'+
    kpi("payments","本期預測金額","NT$ 4,820","萬","up","+6.4% 對上期","#dcf3e2","#15803d")+
    kpi("target","預測達成率","91.3","%","up","+3.1pt","#dceaf5","#0369a1")+
    kpi("query_stats","加權偏差率","6.8","%","down","-1.9pt 改善","#fdf0d9","#d97706")+
    kpi("verified","已核定占比","78","%","up","23/29 業務","#dcf3e2","#15803d")+
  '</div>'+
  '<div class="grid g21" style="margin-top:16px">'+
    '<div class="card min0"><h3><span class="material-symbols-outlined">show_chart</span>滾動式預測 vs 實際 vs 訂單</h3>'+
      '<p class="sub">近 8 個月預測金額對照實際出貨與在手訂單（單位：萬元）</p>'+
      '<div id="c0a" class="chart"></div>'+
      '<div class="legend"><span><i style="background:#15803d"></i>預測</span><span><i style="background:#0369a1"></i>實際</span><span><i style="background:#4ade80"></i>在手訂單</span></div></div>'+
    '<div class="card min0"><h3><span class="material-symbols-outlined">donut_small</span>預測金額產品線占比</h3>'+
      '<p class="sub">本期核定預測構成</p>'+
      '<div id="c0b" class="chart"></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:16px">'+
    '<div class="card min0"><h3><span class="material-symbols-outlined">groups</span>業務團隊預測進度</h3>'+
      '<p class="sub">各業務本期填報 / 核定狀態</p>'+
      '<div class="tblwrap"><table><thead><tr><th>業務</th><th class="num">預測(萬)</th><th class="num">達成率</th><th>狀態</th></tr></thead><tbody>'+
        teamRow("林佳蓉","北區",1420,94,"g","已核定")+
        teamRow("陳彥廷","中區",980,88,"g","已核定")+
        teamRow("黃子軒","南區",1160,79,"w","審核中")+
        teamRow("吳芳瑜","外銷",760,102,"g","已核定")+
        teamRow("張哲維","OEM",500,71,"b","待補件")+
      '</tbody></table></div></div>'+
    '<div class="card min0"><h3><span class="material-symbols-outlined">notifications_active</span>預測異常提醒</h3>'+
      '<p class="sub">系統依決策規則自動排序</p>'+
      alertItem("bad","OEM 預測較歷史同期 -34%，需說明","張哲維 · 影響 260 萬")+
      alertItem("warn","黃子軒 3 項品項無下次聯絡日","南區 · 不列入本月預估")+
      alertItem("warn","客戶 A 加購案報價 08/25 到期","北區 · 預算待核准")+
      alertItem("info","外銷匯率假設待財務確認","吳芳瑜 · 影響 76 萬")+
    '</div>'+
  '</div>';
}
function teamRow(n,z,f,r,cls,st){
  return '<tr><td><b>'+n+'</b> <span class="tag n">'+z+'</span></td><td class="num">'+money(f)+'</td>'+
    '<td class="num"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><div class="bar" style="width:70px"><i style="width:'+Math.min(r,100)+'%"></i></div>'+r+'%</div></td>'+
    '<td><span class="tag '+cls+'">'+st+'</span></td></tr>';
}
function alertItem(k,t,m){
  var ic=k==="bad"?"error":k==="warn"?"warning":"info";
  var cl=k==="bad"?"b":k==="warn"?"w":"i";
  return '<div class="note" style="margin-bottom:9px"><span class="material-symbols-outlined" style="color:inherit"></span>'+
    '<div class="min0"><div style="font-weight:700;margin-bottom:2px"><span class="tag '+cl+'" style="margin-right:6px">'+ic+'</span>'+t+'</div><div style="color:#5b6b60;font-size:11px">'+m+'</div></div></div>';
}
function kpi(ic,lab,val,unit,dir,chg,bg,col){
  var d=dir==="up"?"up":dir==="down"?"up":"flat"; // both good here
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="ico" style="background:'+bg+';color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    '<div class="chg '+(dir==="down"?"up":"up")+'"><span class="material-symbols-outlined">'+arrow+'</span>'+chg+'</div></div>';
}
function draw0(){
  mk("c0a",{
    grid:{left:44,right:12,top:20,bottom:28},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["1月","2月","3月","4月","5月","6月","7月","8月"],axisLine:{lineStyle:{color:"#cbd5cb"}},axisLabel:{color:"#5b6b60"}},
    yAxis:{type:"value",axisLabel:{color:"#5b6b60"},splitLine:{lineStyle:{color:"#eef2ee"}}},
    series:[
      {name:"預測",type:"line",smooth:true,data:[3900,4100,4300,4200,4500,4600,4700,4820],lineStyle:{width:3,color:"#15803d"},itemStyle:{color:"#15803d"},areaStyle:{color:"rgba(21,128,61,.10)"}},
      {name:"實際",type:"line",smooth:true,data:[3760,4020,4180,4350,4410,4520,4640,null],lineStyle:{width:3,color:"#0369a1"},itemStyle:{color:"#0369a1"}},
      {name:"在手訂單",type:"bar",data:[2100,2300,2500,2400,2650,2700,2900,3100],itemStyle:{color:"#4ade80",borderRadius:[4,4,0,0]},barWidth:14}
    ]
  });
  mk("c0b",{
    tooltip:{trigger:"item",formatter:"{b}: {c} 萬 ({d}%)"},
    legend:{bottom:0,textStyle:{color:"#5b6b60",fontSize:11}},
    series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],avoidLabelOverlap:true,
      label:{show:false},itemStyle:{borderColor:"#fff",borderWidth:2},
      data:[
        {value:1680,name:"精密齒輪",itemStyle:{color:"#15803d"}},
        {value:1240,name:"傳動軸件",itemStyle:{color:"#4ade80"}},
        {value:920,name:"外銷模組",itemStyle:{color:"#0369a1"}},
        {value:600,name:"OEM 代工",itemStyle:{color:"#d97706"}},
        {value:380,name:"備品耗材",itemStyle:{color:"#94a3b8"}}
      ]}]
  });
}

/* ================= SCREEN 1 : Forecast entry (signature) ================= */
var FITEMS=[
  {p:"精密齒輪 G-220",c:"台中機械",hist:320,fc:360,amt:648},
  {p:"傳動軸 S-115",c:"漢翔精工",hist:180,fc:210,amt:441},
  {p:"外銷模組 M-40",c:"KOBE Ltd.",hist:96,fc:88,amt:308},
  {p:"OEM 齒盤 O-9",c:"泰豐工業",hist:150,fc:120,amt:216},
  {p:"備品耗材組",c:"多客戶",hist:210,fc:230,amt:161}
];
function s1(){
  var rows="";
  var sumHist=0,sumFc=0,sumAmt=0;
  for(var k=0;k<FITEMS.length;k++){
    var it=FITEMS[k];

function show(i){
  disposeCharts();
  var m=MODS[i];
  document.getElementById("scr-title").textContent=m.t;
  document.getElementById("scr-sub").textContent=m.s;
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].className="navbtn"+(+btns[b].getAttribute("data-i")===i?" on":""); }

}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
