<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales Forecast 業務預測｜Jvision 系統 Demo</title>
<meta name="description" content="製造業滾動式業務預測：填報、歷史比對、審核彙整、PMC 交接與覆盤準確率" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#cbd5e1;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#cbd5e1;
  --accent:#059669;
  --accent2:#3b82f6;
  --bg:#f8fafc;
  --card:#fff;
  --side:#0f172a;
  --side2:#0f172a;
  --good:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#1d4ed8;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",sans-serif;
  background-color:var(--color-background);
  background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:264px;
  flex:0 0 264px;
  background:var(--side);
  color:#e2e8f0;
  border-right:4px solid var(--blue);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  gap:8px;
  min-width:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 4px 18px;
  border-bottom:2px solid #334155;
  margin-bottom:10px;
}
.brand .logo{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--blue);
  color:#fff;
  border:2px solid #fff;
  border-radius:0;
}
.brand .logo .material-symbols-outlined{font-size:25px}
.brand b{
  display:block;
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:15px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.02em;
}
.brand span{font-size:11px;color:#cbd5e1}
.navlist{display:flex;flex-direction:column;gap:6px;min-width:0}
.navbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:46px;
  min-width:0;
  padding:10px 11px;
  border:2px solid #475569;
  border-radius:0;
  background:transparent;
  color:#e2e8f0;
  font-size:13px;
  font-weight:600;
  text-align:left;
  transition:background-color 160ms,color 160ms,border-color 160ms,transform 160ms;
}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto}
.navbtn .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:#1e293b;border-color:#93c5fd;color:#fff;transform:translateX(3px)}
.navbtn.on{
  background:var(--blue);
  border-color:#fff;
  color:#fff;
  box-shadow:5px 5px 0 #059669;
  transform:translate(-2px,-2px);
}
.navbtn.on:after{
  content:"ACTIVE";
  margin-left:auto;
  font-family:"Fira Code",monospace;
  font-size:8px;
  letter-spacing:.08em;
}
.side-foot{
  margin-top:auto;
  padding:14px 4px 0;
  border-top:2px solid #334155;
  color:#cbd5e1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.65;
}
.main{
  flex:1 1 auto;
  min-width:0;
  max-width:100%;
  padding:24px 28px 48px;
  background:rgba(248,250,252,.94);
}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding:0 0 14px;
  border-bottom:4px solid var(--ink);
  flex-wrap:wrap;
}
.topbar .tt{min-width:0}
.topbar h1{
  margin:0 0 4px;
  font-family:"Fira Code",monospace;
  font-size:clamp(22px,2vw,30px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.05em;
}
.topbar h1:before{content:"// ";color:var(--blue)}
.topbar p{margin:0;color:var(--muted);font-size:12.5px;font-weight:500}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 11px;
  border:2px solid var(--ink);
  border-radius:0;
  background:#dbeafe;
  color:#1e3a8a;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  box-shadow:4px 4px 0 var(--ink);
}
.pill .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.gspan{grid-column:1/-1}
.min0{min-width:0}
.card,.kpi,.accbox{
  min-width:0;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--card);
  color:var(--ink);
  box-shadow:5px 5px 0 var(--line);
}
.card{padding:15px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  font-size:14px;
  font-weight:700;
  line-height:1.35;
}
.card h3 .material-symbols-outlined{
  display:inline-flex;
  width:27px;
  height:27px;
  align-items:center;
  justify-content:center;
  background:var(--blue);
  color:#fff;
  font-size:18px;
}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:11.5px;line-height:1.5}
.kpi{
  position:relative;
  overflow:hidden;
  padding:13px 14px 14px;
  border-top:5px solid var(--blue);
}
.kpi:after{
  content:"";
  position:absolute;
  top:9px;
  right:9px;
  width:18px;
  height:18px;
  border-top:3px solid var(--ink);
  border-right:3px solid var(--ink);
}
.kpi .ico{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin-bottom:10px;
  border:2px solid currentColor;
  border-radius:0!important;
}
.kpi .ico .material-symbols-outlined{font-size:19px}
.kpi .lab{color:var(--muted);font-size:11.5px;font-weight:600}
.kpi .val{
  margin:2px 0;
  font-family:"Fira Code",monospace;
  font-size:clamp(22px,2.25vw,28px);
  font-weight:700;
  letter-spacing:-.06em;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .chg{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700}
.kpi .chg .material-symbols-outlined{font-size:14px}
.up{color:var(--good)}
.down{color:var(--bad)}
.flat{color:var(--muted)}
.chart{width:100%;height:276px;overflow:hidden;min-width:0}
.chart.sm{height:224px}
.chart.lg{height:326px}
.tblwrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:2px solid var(--ink);
  border-radius:0;
  scrollbar-color:var(--blue) var(--color-muted);
}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;background:#fff}
th,td{padding:9px 10px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--ink);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
}
td.num,th.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#dbeafe}
td b{font-weight:700}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.tag.g{background:#d1fae5;color:#065f46}
.tag.g:before{content:"✓";font-family:"Fira Sans",sans-serif}
.tag.w{background:#fef3c7;color:#854d0e}
.tag.w:before{content:"!"}
.tag.b{background:#fee2e2;color:#991b1b}
.tag.b:before{content:"×"}
.tag.i{background:#dbeafe;color:#1e3a8a}
.tag.i:before{content:"i"}
.tag.n{background:#e2e8f0;color:#334155}
.tag.n:before{content:"—"}
.bar{
  height:9px;
  min-width:60px;
  overflow:hidden;
  border:1px solid var(--ink);
  border-radius:0;
  background:#e2e8f0;
}
.bar>i{display:block;height:100%;border-radius:0;background:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;min-width:0}
.col{
  min-width:0;
  padding:9px;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-muted);
}
.col>.h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
  padding-bottom:7px;
  border-bottom:2px solid var(--ink);
  font-size:11.5px;
  font-weight:700;
}
.col>.h .cnt{
  padding:1px 6px;
  border:1px solid var(--ink);
  border-radius:0;
  background:#fff;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.ci{
  min-width:0;
  margin-bottom:7px;
  padding:9px;
  border:1px solid var(--ink);
  border-left:5px solid var(--blue);
  border-radius:0;
  background:#fff;
}
.ci:last-child{margin-bottom:0}
.ci .t{margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:700}
.ci .m{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tl{position:relative;padding-left:27px;min-width:0}
.tl:before{content:"";position:absolute;left:9px;top:5px;bottom:5px;width:3px;background:var(--ink)}
.tl .ev{position:relative;padding:0 0 15px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev:before{
  content:"";
  position:absolute;
  left:-24px;
  top:2px;
  width:13px;
  height:13px;
  border:3px solid var(--ink);
  border-radius:0;
  background:var(--accent);
}
.tl .ev .d{color:var(--blue);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:700}
.tl .ev .ti{margin:2px 0;font-size:12.5px;font-weight:700}
.tl .ev .de{color:var(--muted);font-size:11px;line-height:1.55}
.frow{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr 90px;
  gap:9px;
  align-items:center;
  min-width:0;
  margin-bottom:7px;
  padding:9px 10px;
  border:1px solid var(--ink);
  border-left:5px solid var(--blue);
  border-radius:0;
  background:#fff;
}
.frow .lbl{min-width:0;font-size:11.5px;font-weight:700}
.frow .lbl small{display:block;color:var(--muted);font-size:10px;font-weight:500}
.frow .fld{font-size:11px}
.frow .fld b{font-family:"Fira Code",monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.frow .fld span{display:block;color:var(--muted);font-size:9.5px}
.inp{
  width:100%;
  padding:6px 8px;
  border:2px solid var(--blue);
  border-radius:0;
  background:#eff6ff;
  color:#1e40af;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.mhead{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr 90px;
  gap:9px;
  min-width:520px;
  padding:7px 10px;
  background:var(--ink);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.frowwrap{min-width:520px}
.acc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.accbox{padding:15px;text-align:left;border-top:5px solid var(--blue)}
.accbox .n{
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:700;
  letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;
}
.accbox .l{margin-top:2px;color:var(--muted);font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:10.5px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;border:1px solid var(--ink);border-radius:0;vertical-align:middle}
.note{
  display:flex;
  gap:9px;
  padding:10px 11px;
  border:1px solid #1e40af;
  border-left:6px solid var(--blue);
  border-radius:0;
  background:#eff6ff;
  color:#172554;
  font-size:11.5px;
  line-height:1.55;
}
.note .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:18px}
.note div[style*="color:#5b6b60"]{color:var(--muted)!important}
.mobnav{display:none}
#view>.grid-item,#view>.grid,#view>.card,#view>.acc-grid{
  animation:grid-in 400ms cubic-bezier(.2,.9,.25,1.3) both;
}
#view>:nth-child(2){animation-delay:60ms}
#view>:nth-child(3){animation-delay:120ms}
#view>:nth-child(4){animation-delay:180ms}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex:none;padding:12px;border-right:0;border-bottom:4px solid var(--blue)}
  .brand{margin-bottom:5px;padding-bottom:10px}
  .side-foot{display:none}
  .navlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .navbtn{width:auto;padding:9px;justify-content:flex-start}
  .navbtn:hover{transform:none}
  .navbtn.on{box-shadow:3px 3px 0 var(--accent);transform:none}
  .navbtn.on:after{display:none}
  .main{padding:18px 14px 38px}
}
@media(max-width:768px){
  .g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .acc-grid{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .sidebar{padding:10px}
  .brand .logo{width:38px;height:38px;flex-basis:38px}
  .navlist{grid-template-columns:repeat(6,1fr)}
  .navbtn{justify-content:center;min-height:44px;padding:8px}
  .navbtn .nx{display:none}
  .navbtn .material-symbols-outlined{font-size:19px}
  .main{padding:15px 10px 32px}
  .topbar{margin-bottom:13px;padding-bottom:11px}
  .topbar h1{font-size:20px}
  .topbar p{font-size:11px}
  .pill{width:100%;justify-content:center;box-shadow:3px 3px 0 var(--ink)}
  .g4{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:11px}
  .kpi .ico{width:30px;height:30px;margin-bottom:8px}
  .kpi .val{font-size:20px}
  .card{padding:12px}
  .board{grid-template-columns:1fr}
  .chart{height:250px}
  .chart.lg{height:290px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #view>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">trending_up</span></div>
      <div class="min0"><b>Sales Forecast</b><span>業務預測 · 滾動式預測平台</span></div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="side-foot">
      製造業滾動式業務預測<br/>ERP · Pipeline · PMC 同步<br/>版本 FC-2026Q3 · Demo
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h1 id="scr-title">預測總覽儀表</h1>
        <p id="scr-sub">本期預測金額、達成率與偏差率一頁掌握</p>
      </div>
      <span class="pill"><span class="material-symbols-outlined">calendar_month</span><span id="period-pill">週期 2026-08 / Q3 滾動</span></span>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
"use strict";

var MODS=[
  {i:"dashboard",t:"預測總覽儀表",s:"本期預測金額、達成率與偏差率一頁掌握"},
  {i:"request_quote",t:"業務預測填報",s:"業務個人/團隊逐品項填報月度預測數量與金額"},
  {i:"history",t:"歷史銷售比對",s:"預測值對比歷史實績，分析趨勢與季節性"},
  {i:"fact_check",t:"主管審核彙整",s:"主管調整、核准並彙整全團隊滾動式預測"},
  {i:"account_tree",t:"PMC 產銷交接",s:"核定預測轉為產能與備料需求供 PMC 排程"},
  {i:"insights",t:"覆盤與準確率",s:"期末預測 vs 實際覆盤，追蹤準確率與偏差"}
];

var view=document.getElementById("view");
var nav=document.getElementById("nav");
var charts=[];

// build nav
(function(){
  var h="";
  for(var k=0;k<MODS.length;k++){
    h+='<button class="navbtn" data-i="'+k+'"><span class="material-symbols-outlined">'+MODS[k].i+'</span><span class="nx">'+MODS[k].t+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var idx=+this.getAttribute("data-i");
      location.hash="v"+idx;
    });
  }
})();

function money(n){return (Math.round(n)).toLocaleString("en-US");}

function disposeCharts(){
  for(var k=0;k<charts.length;k++){ try{charts[k].dispose();}catch(e){} }
  charts=[];
}

function show(i){
  disposeCharts();
  var m=MODS[i];
  document.getElementById("scr-title").textContent=m.t;
  document.getElementById("scr-sub").textContent=m.s;
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].className="navbtn"+(+btns[b].getAttribute("data-i")===i?" on":""); }
  view.className="grid min0";
  view.innerHTML=SCREENS[i].r();
  void view.offsetHeight;
  SCREENS[i].d();
}

window.addEventListener("resize",function(){ for(var k=0;k<charts.length;k++){ try{charts[k].resize();}catch(e){} } });

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
