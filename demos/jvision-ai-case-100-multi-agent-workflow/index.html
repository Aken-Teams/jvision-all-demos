<style>
  :root{
    --pink:#db2777; --pink2:#f472b6; --pink-d:#9d174d;
    --ink:#3a0b23; --body:#4b3a44; --muted:#8b7480; --line:#f0dbe6; --bg:#fbf4f8;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --sky:#0ea5e9; --indigo:#4f46e5;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; max-width:100%; overflow-x:hidden; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* ===== top nav bar ===== */
  .topbar{ position:sticky; top:0; z-index:40; background:linear-gradient(120deg,#4a0c2b,#7a1146); color:#fff; box-shadow:0 4px 20px rgba(157,23,77,.28); }
  .tb-in{ display:flex; align-items:center; gap:16px; padding:11px 22px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; flex:none; }
  .brand .logo{ width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--pink),var(--pink2)); display:grid; place-content:center; color:#fff; flex:none; box-shadow:0 6px 18px rgba(219,39,119,.5); }
  .brand .logo .material-symbols-outlined{ font-size:25px; }
  .brand b{ font-size:16px; font-weight:900; color:#fff; display:block; letter-spacing:.5px; white-space:nowrap; }
  .brand span{ font-size:10.5px; color:#f5b8d3; font-weight:700; }
  .nav{ display:flex; gap:5px; flex-wrap:wrap; min-width:0; flex:1; }

  .nav button .material-symbols-outlined{ font-size:19px; flex:none; }
  .nav button:hover{ background:rgba(255,255,255,.18); color:#fff; }
  .nav button.on{ background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; box-shadow:0 5px 14px rgba(219,39,119,.5); }
  .tb-r{ display:flex; align-items:center; gap:10px; flex:none; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; color:#fff; background:rgba(255,255,255,.12); border-radius:999px; padding:5px 11px; }
  .live .dot{ width:7px; height:7px; border-radius:50%; background:#4ade80; animation:pulse 2s infinite; } @keyframes pulse{50%{opacity:.25;}}
  .tb-u{ display:flex; align-items:center; gap:8px; }
  .tb-u .av{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--pink2),#fff); color:var(--pink-d); font-weight:900; display:grid; place-content:center; flex:none; font-size:13px; }
  .tb-u b{ color:#fff; font-size:12.5px; display:block; line-height:1.2; } .tb-u span{ font-size:10px; color:#f5b8d3; }
  /* ===== main ===== */
  .body{ padding:22px 26px 52px; min-width:0; max-width:1440px; margin:0 auto; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:9px; } .vh h2 .material-symbols-outlined{ color:var(--pink); }
  .vh p{ margin:5px 0 0; font-size:13px; color:var(--muted); max-width:680px; line-height:1.5; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 15px; border-radius:10px; border:0; background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; font:inherit; font-weight:800; font-size:12.5px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--pink); border:1px solid var(--line); }
  .btn .material-symbols-outlined{ font-size:18px; }
  /* kpis */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px 17px; border-left:4px solid var(--pink); min-width:0; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; align-items:center; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--pink); }
  .kpi .v{ font-size:25px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:11.5px; font-weight:800; margin-top:4px; } .up{ color:var(--green); } .dn{ color:var(--red); } .fl{ color:var(--muted); }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1.5fr 1fr; } .g2b{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:repeat(3,1fr); }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card>h3 .material-symbols-outlined{ color:var(--pink); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--pink); }
  .chart-box{ position:relative; width:100%; }
  /* table */
  .tblwrap{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:#fdf2f8; white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:#fdf2f8; }
  .tbl td b{ color:var(--ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; display:inline-block; }
  .t-ok{ background:#dcfce7; color:#166534; } .t-warn{ background:#fef3c7; color:#92400e; } .t-bad{ background:#fee2e2; color:#991b1b; } .t-info{ background:#dbeafe; color:#1e40af; } .t-pink{ background:#fce7f0; color:var(--pink-d); } .t-grey{ background:#f1f5f9; color:#64748b; } .t-indigo{ background:#e0e7ff; color:#3730a3; }
  .bar{ height:7px; border-radius:999px; background:#f0e0e8; overflow:hidden; min-width:70px; } .bar span{ display:block; height:100%; border-radius:999px; }
  .mini{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .stat{ background:#fdf2f8; border-radius:12px; padding:13px 14px; } .stat .l{ font-size:11.5px; color:var(--muted); font-weight:700; } .stat .v{ font-size:22px; font-weight:900; color:var(--pink-d); margin-top:3px; }
  /* ===== SCREEN 0 : agent roster cards ===== */
  .agents{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .ac{ background:#fdf7fb; border:1px solid var(--line); border-radius:16px; padding:15px; min-width:0; position:relative; overflow:hidden; }
  .ac::before{ content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--pink),var(--pink2)); }
  .ac-h{ display:flex; align-items:center; gap:11px; } .ac-h .av{ width:44px; height:44px; border-radius:13px; background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; display:grid; place-content:center; flex:none; } .ac-h .av .material-symbols-outlined{ font-size:24px; }
  .ac-h b{ font-size:14.5px; color:var(--ink); display:block; } .ac-h span{ font-size:11px; color:var(--muted); font-weight:700; }
  .ac-h .st{ margin-left:auto; }
  .ac p{ font-size:11.5px; color:var(--body); margin:11px 0 0; line-height:1.5; min-height:34px; }
  .ac-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:11px; }
  .ac-stats div{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px; text-align:center; } .ac-stats b{ font-size:15px; color:var(--pink-d); display:block; } .ac-stats small{ font-size:9.5px; color:var(--muted); font-weight:700; }
  .ac-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:10px; }
  .pulse{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; }
  .pulse i{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .pulse.run i{ background:var(--green); animation:pulse 1.6s infinite; } .pulse.idle i{ background:#94a3b8; } .pulse.wait i{ background:var(--amber); animation:pulse 1.6s infinite; }
  .pulse.run{ color:var(--green); } .pulse.idle{ color:#64748b; } .pulse.wait{ color:#b45309; }
  /* ===== SCREEN 1 : DAG pipeline (signature) ===== */
  .dag{ overflow-x:auto; }
  .dag-inner{ min-width:820px; padding:8px 4px; }
  .dag-row{ display:flex; align-items:stretch; gap:0; margin-bottom:18px; }
  .dnode{ background:#fff; border:2px solid var(--line); border-radius:14px; padding:11px 13px; min-width:150px; flex:none; }
  .dnode.act{ border-color:var(--pink); box-shadow:0 6px 16px rgba(219,39,119,.18); }
  .dnode.done{ border-color:#bbf7d0; background:#f6fef9; }
  .dnode .dh{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:900; color:var(--ink); }
  .dnode .dh .material-symbols-outlined{ font-size:18px; color:var(--pink); }
  .dnode .role{ font-size:10.5px; color:var(--muted); font-weight:700; margin-top:3px; }
  .dnode .meta{ font-size:10px; margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; }
  .arrow{ flex:none; align-self:center; display:flex; align-items:center; color:var(--pink2); font-size:22px; padding:0 4px; }
  .dbranch{ display:flex; flex-direction:column; gap:12px; justify-content:center; }
  /* ===== SCREEN 2 : kanban ===== */
  .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .col{ background:#fdf2f8; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .col>h4{ margin:0 0 10px; font-size:12.5px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .col>h4 .n{ margin-left:auto; background:var(--pink); color:#fff; font-size:11px; border-radius:999px; padding:1px 8px; }
  .tk{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(157,23,77,.06); }
  .tk b{ font-size:12.5px; color:var(--ink); display:block; } .tk .meta{ font-size:10.5px; color:var(--muted); margin-top:5px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tk .who{ display:flex; align-items:center; gap:6px; margin-top:9px; font-size:11px; font-weight:700; color:var(--body); } .tk .av{ width:22px; height:22px; border-radius:7px; background:var(--pink2); color:#fff; display:grid; place-content:center; flex:none; } .tk .av .material-symbols-outlined{ font-size:14px; }
  /* ===== SCREEN 3 : tool list + kb cards ===== */
  .toolrow{ display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); } .toolrow:first-child{ border-top:0; }
  .tool-ic{ width:36px; height:36px; border-radius:10px; display:grid; place-content:center; flex:none; background:#fce7f0; color:var(--pink); } .tool-ic .material-symbols-outlined{ font-size:20px; }
  .toolrow .ti{ flex:1; min-width:0; } .toolrow .ti b{ font-size:13px; color:var(--ink); display:block; } .toolrow .ti small{ font-size:11px; color:var(--muted); }
  .kbcard{ background:#fdf7fb; border:1px solid var(--line); border-left:3px solid var(--pink); border-radius:12px; padding:12px 14px; margin-bottom:11px; }
  .kbcard .kh{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color:var(--ink); } .kbcard .kh .grow{ margin-left:auto; }
  .kbcard p{ margin:7px 0 0; font-size:11.5px; color:var(--body); line-height:1.55; }
  .kbcard .src{ margin-top:8px; font-size:10.5px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  /* ===== SCREEN 4 : trace timeline (signature) ===== */
  .trace{ position:relative; padding-left:2px; }
  .trace .tr{ display:flex; gap:13px; position:relative; padding-bottom:16px; }
  .trace .tr::before{ content:""; position:absolute; left:15px; top:30px; bottom:-2px; width:2px; background:var(--line); }
  .trace .tr:last-child::before{ display:none; }
  .tr-ic{ width:32px; height:32px; border-radius:10px; display:grid; place-content:center; flex:none; z-index:1; } .tr-ic .material-symbols-outlined{ font-size:18px; }
  .tr-body{ flex:1; min-width:0; background:#fdf7fb; border:1px solid var(--line); border-radius:12px; padding:10px 13px; }
  .tr-body .th{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .tr-body b{ font-size:13px; color:var(--ink); } .tr-body .t{ margin-left:auto; font-size:10.5px; color:var(--muted); font-weight:700; }
  .tr-body p{ margin:5px 0 0; font-size:11.5px; color:var(--body); line-height:1.5; }
  .tr-body .kv{ margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; font-size:10px; }
  .chip{ background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-weight:700; color:var(--muted); }
  .a-pink{ background:#fce7f0; color:#db2777; } .a-info{ background:#dbeafe; color:#1e40af; } .a-amber{ background:#fef3c7; color:#d97706; } .a-red{ background:#fee2e2; color:#dc2626; } .a-ok{ background:#dcfce7; color:#16a34a; }
  /* handoff chain */
  .hf{ overflow-x:auto; }
  .hf-inner{ min-width:640px; display:flex; align-items:flex-start; gap:0; padding:6px 0; }
  .hf-node{ flex:1; text-align:center; min-width:90px; }
  .hf-node .b{ width:38px; height:38px; border-radius:12px; margin:0 auto 6px; display:grid; place-content:center; color:#fff; } .hf-node .b .material-symbols-outlined{ font-size:20px; }
  .hf-node small{ font-size:10.5px; font-weight:800; color:var(--ink); display:block; } .hf-node span{ font-size:9.5px; color:var(--muted); }
  .hf-line{ flex:none; width:34px; height:2px; background:var(--pink2); margin-top:18px; }
  /* ===== SCREEN 5 : eval matrix ===== */
  .mtx{ overflow-x:auto; }
  .mtx table{ border-collapse:collapse; width:100%; min-width:620px; font-size:12.5px; }
  .mtx th{ padding:9px 8px; font-size:11px; font-weight:800; color:var(--muted); border-bottom:2px solid var(--line); text-align:center; } .mtx th:first-child{ text-align:left; }
  .mtx td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:center; } .mtx td:first-child{ text-align:left; font-weight:800; color:var(--ink); }
  .score{ display:inline-grid; place-content:center; min-width:44px; height:26px; border-radius:8px; font-weight:800; font-size:12px; padding:0 6px; }
  .sc-hi{ background:#dcfce7; color:#166534; } .sc-mid{ background:#fef3c7; color:#92400e; } .sc-lo{ background:#fee2e2; color:#991b1b; }
  @media (max-width:1100px){ .g2,.g2b,.g3{ grid-template-columns:1fr; } .board{ grid-template-columns:1fr 1fr; } .agents{ grid-template-columns:1fr 1fr; } }
  @media (max-width:820px){
    .kpis{ grid-template-columns:1fr 1fr; }
    .agents,.board{ grid-template-columns:1fr; }
    .body{ padding:16px 14px 40px; }
  }
  @media (max-width:560px){
    .nav button .txt{ display:none; }
    .nav button{ padding:9px; }
    .tb-u b,.tb-u span{ display:none; }
    .kpis{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>

<script>
"use strict";
var MODS=[
  {i:"smart_toy",n:"代理團隊",d:"AI 代理人角色與職能編組"},
  {i:"account_tree",n:"流程編排",d:"多代理協作流程 DAG 設計"},
  {i:"playlist_add_check",n:"任務派工",d:"子任務分派與佇列調度"},
  {i:"handyman",n:"工具與知識",d:"工具呼叫與知識庫檢索"},
  {i:"timeline",n:"執行追蹤",d:"運行軌跡與交接紀錄"},
  {i:"fact_check",n:"品質成本",d:"產出評測與 Token 成本"}
];
var PINK="#db2777", PINK2="#f472b6", INDIGO="#4f46e5", SKY="#0ea5e9";

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s); }
function kpi(l,ic,v,u,d,cls){ return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="d '+(cls||'fl')+'">'+esc(d)+'</div></div>'; }
function barrow(pct,color){ var p=Math.max(0,Math.min(100,pct)); return '<div class="bar"><span style="width:'+p+'%;background:'+color+'"></span></div>'; }
function cbox(id,h){ return '<div class="chart-box" style="height:'+h+'px"><canvas id="'+id+'"></canvas></div>'; }

var _charts=[];
function killCharts(){ for(var k=0;k<_charts.length;k++){ try{ _charts[k].destroy(); }catch(e){} } _charts=[]; }
Chart.defaults.font.family='Inter,"Noto Sans TC",sans-serif';
Chart.defaults.animation=false;
Chart.defaults.plugins.legend.labels.boxWidth=12;
function mkChart(id,cfg){ var el=document.getElementById(id); if(!el) return; try{ var c=new Chart(el.getContext("2d"),cfg); _charts.push(c); }catch(e){} }

/* =================== SCREEN 0 : 代理團隊 =================== */
function v0(){
  var agents=[
    {ic:"account_tree",n:"編排代理",role:"Orchestrator",st:"run",p:"解析使用者目標、拆解子任務並規劃多代理協作 DAG。",stat:[["128","本日流程"],["1.9s","規劃"],["99.2","成功%"]],tags:['<span class="tag t-pink">規劃</span>','<span class="tag t-info">DAG</span>']},
    {ic:"alt_route",n:"調度代理",role:"Dispatcher",st:"run",p:"依角色職能與負載將子任務推入佇列並分派給專責代理。",stat:[["412","已派工"],["6","佇列"],["98.6","準確%"]],tags:['<span class="tag t-pink">派工</span>','<span class="tag t-indigo">負載均衡</span>']},
    {ic:"search",n:"檢索代理",role:"Retriever",st:"run",p:"從知識庫與向量索引檢索相關片段，供執行代理引用。",stat:[["1.2k","檢索次"],["0.4s","延遲"],["94.1","命中%"]],tags:['<span class="tag t-pink">RAG</span>','<span class="tag t-info">向量庫</span>']},
    {ic:"handyman",n:"工具代理",role:"Tool Worker",st:"wait",p:"呼叫外部 API 與工具，整合回傳結果為中間產物。",stat:[["867","工具呼叫"],["3","重試中"],["96.8","成功%"]],tags:['<span class="tag t-pink">工具</span>','<span class="tag t-warn">待回應</span>']},
    {ic:"shield_person",n:"監督代理",role:"Supervisor",st:"run",p:"監控交接軌跡、偵測卡關與逾時並升級人工介入。",stat:[["37","攔截"],["4","升級"],["100","覆蓋%"]],tags:['<span class="tag t-pink">監督</span>','<span class="tag t-bad">護欄</span>']},
    {ic:"fact_check",n:"評測代理",role:"Evaluator",st:"idle",p:"對最終產出評分、比對事實並核算 Token 成本後放行。",stat:[["298","已評測"],["4.6","均分"],["0.9%","駁回"]],tags:['<span class="tag t-pink">評測</span>','<span class="tag t-indigo">成本</span>']}
  ];

    kpi("平均品質分","grade",'4.6',"/5","通過門檻 4.0","up")+
    kpi("本日產出","inventory_2",'298',"件","駁回 3 件","fl")+

var SCREENS=[{r:v0,i:v0init},{r:v1,i:v1init},{r:v2,i:v2init},{r:v3,i:v3init},{r:v4,i:v4init},{r:v5,i:v5init}];
function buildNav(){
  var nav=document.getElementById("nav"), h="";
  for(var i=0;i<MODS.length;i++){ h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MODS[i].i+'</span><span class="txt">'+MODS[i].n+'</span></button>'; }
  nav.innerHTML=h;
}
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
  var container=document.getElementById("view");
  container.innerHTML=SCREENS[i].r();
  void container.offsetHeight;
  SCREENS[i].i();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
