<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多位AI助理任務協作台｜Jvision 系統 Demo</title>
<meta name="description" content="多個 AI 代理人協作編排、派工、工具檢索到品質成本評測的流程自動化平台（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --green:#15803D;
  --amber:#A16207;
  --red:#DC2626;
  --sky:#0369A1;
  --indigo:#4338CA;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--color-background);
  color:#334155;
  font-family:"Plus Jakarta Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[onclick]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:var(--color-foreground);
  background:var(--color-card);
  border-bottom:1px solid var(--color-border);
}
.tb-in{
  display:flex;
  align-items:center;
  gap:18px;
  max-width:1440px;
  margin:auto;
  padding:12px 24px;
}
.brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
.brand .logo{
  display:grid;
  place-content:center;
  width:42px;
  height:42px;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--color-foreground);
  border-radius:10px;
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{
  display:block;
  color:var(--color-foreground);
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand span{display:block;color:var(--color-muted-foreground);font-size:10px;font-weight:600}
.nav{display:flex;flex:1;gap:4px;min-width:0}
.nav button{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:40px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:8px;
  color:var(--color-muted-foreground);
  background:transparent;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button:hover{color:var(--color-foreground);background:var(--color-muted)}
.nav button.on{
  color:var(--color-foreground);
  background:#CCFBF1;
  border-color:var(--color-primary);
}
.nav button .material-symbols-outlined{font-size:18px}
.tb-r{display:flex;align-items:center;gap:10px;flex:none}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 10px;
  color:#14532D;
  background:#DCFCE7;
  border:1px solid #86EFAC;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.tb-u{display:flex;align-items:center;gap:8px}
.tb-u .av{
  display:grid;
  place-content:center;
  width:34px;
  height:34px;
  color:var(--color-foreground);
  background:#CCFBF1;
  border:1px solid var(--color-primary);
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}
.tb-u b{display:block;color:var(--color-foreground);font-size:11px;line-height:1.3}
.tb-u span{display:block;color:var(--color-muted-foreground);font-size:9px}
.body{max-width:1440px;margin:auto;padding:28px 26px 56px}
.vh{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}
.vh h2{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  color:var(--color-foreground);
  font-size:22px;
  font-weight:700;
  letter-spacing:-.02em;
}
.vh h2 .material-symbols-outlined{color:var(--color-primary)}
.vh p{max-width:720px;margin:7px 0 0;color:var(--color-muted-foreground);font-size:12px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:42px;
  padding:0 16px;
  border:2px solid var(--color-accent);
  border-radius:8px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  font-size:12px;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.btn:hover{background:#C2410C;border-color:#C2410C;color:#fff}
.btn.ghost{color:var(--color-foreground);background:#fff;border-color:var(--color-border)}
.btn.ghost:hover{background:#CCFBF1;border-color:var(--color-primary)}
.btn .material-symbols-outlined{font-size:17px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:18px;
}
.kpi,.card{
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:12px;
}
.kpi{
  position:relative;
  min-width:0;
  padding:16px;
  overflow:hidden;
}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary)}
.kpi .l{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:11px;font-weight:700}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:17px}
.kpi .v{margin-top:6px;color:var(--color-foreground);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.kpi .d{margin-top:3px;font-size:10px;font-weight:700}
.up{color:#166534}.dn{color:#991B1B}.fl{color:var(--color-muted-foreground)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr 1fr}.g2b{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{min-width:0;padding:18px}
.card>h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  color:var(--color-card-foreground);
  font-size:14px;
  font-weight:700;
}
.card>h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card>h3 .grow{margin-left:auto;color:var(--color-primary);font-size:10px}
.chart-box{position:relative;width:100%}
.tblwrap,.dag,.hf,.mtx{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.mtx th{
  padding:10px 11px;
  color:var(--color-foreground);
  background:var(--color-muted);
  border-bottom:2px solid var(--color-primary);
  font-size:10px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
}
.tbl td{padding:11px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.tbl tbody tr:hover td,.mtx tbody tr:hover td{background:#F0FDFA}
.tbl td b{color:var(--color-foreground)}
.tbl td:first-child,.tbl td:nth-child(5){font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl td:nth-child(4){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:9px;
  font-weight:700;
  line-height:1.2;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#854D0E;background:#FEF9C3}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-pink{color:#115E59;background:#CCFBF1}
.t-grey{color:#475569;background:#F1F5F9}
.t-indigo{color:#3730A3;background:#E0E7FF}
.bar{height:7px;min-width:70px;overflow:hidden;background:#DDE8EA;border-radius:3px}
.bar span{display:block;height:100%}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:13px;background:var(--color-muted);border:1px solid var(--color-border);border-radius:9px}
.stat .l{color:var(--color-muted-foreground);font-size:10px;font-weight:600}
.stat .v{margin-top:3px;color:var(--color-foreground);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ac{
  position:relative;
  min-width:0;
  padding:14px;
  overflow:hidden;
  background:#F8FFFE;
  border:1px solid var(--color-border);
  border-radius:10px;
}
.ac:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--color-primary)}
.ac-h{display:flex;align-items:center;gap:10px}
.ac-h .av,.tk .av{
  display:grid;
  place-content:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:8px;
}
.ac-h .av{width:42px;height:42px}.ac-h .av .material-symbols-outlined{font-size:22px}
.ac-h b{display:block;color:var(--color-foreground);font-size:13px}
.ac-h span{display:block;color:var(--color-muted-foreground);font-size:9px;font-weight:600}
.ac-h .st{margin-left:auto}
.ac p{min-height:38px;margin:10px 0 0;color:#334155;font-size:10px}
.ac-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ac-stats div{padding:7px 4px;text-align:center;background:#fff;border:1px solid var(--color-border);border-radius:7px}
.ac-stats b{display:block;color:var(--color-foreground);font-size:13px;font-variant-numeric:tabular-nums}
.ac-stats small{color:var(--color-muted-foreground);font-size:8px;font-weight:600}
.ac-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pulse{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700}
.pulse i{display:inline-block;width:7px;height:7px;border-radius:50%}
.pulse.run{color:#166534}.pulse.run i{background:var(--green)}
.pulse.wait{color:#854D0E}.pulse.wait i{background:#CA8A04}
.pulse.idle{color:#475569}.pulse.idle i{background:#64748B}
.dag-inner{min-width:820px;padding:8px 4px}
.dag-row{display:flex;align-items:stretch;margin-bottom:16px}
.dnode{min-width:150px;padding:11px 12px;background:#fff;border:2px solid var(--color-border);border-radius:9px}
.dnode.act{background:#F0FDFA;border-color:var(--color-primary)}
.dnode.done{background:#F0FDF4;border-color:#4ADE80}
.dnode .dh{display:flex;align-items:center;gap:7px;color:var(--color-foreground);font-size:11px;font-weight:700}
.dnode .dh .material-symbols-outlined{color:var(--color-primary);font-size:17px}
.dnode .role{margin-top:3px;color:var(--color-muted-foreground);font-size:9px;font-weight:600}
.dnode .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;font-size:9px}
.arrow{display:flex;align-items:center;align-self:center;padding:0 5px;color:var(--color-primary)}
.dbranch{display:flex;flex-direction:column;justify-content:center;gap:10px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{min-width:0;padding:11px;background:var(--color-muted);border:1px solid var(--color-border);border-radius:9px}
.col>h4{display:flex;align-items:center;gap:6px;margin:0 0 9px;color:var(--color-foreground);font-size:11px}
.col>h4 .n{margin-left:auto;padding:1px 7px;color:#fff;background:var(--color-primary);border-radius:999px;font-size:9px}
.tk{margin-bottom:9px;padding:10px;background:#fff;border:1px solid var(--color-border);border-radius:8px}
.tk b{display:block;color:var(--color-foreground);font-size:11px}
.tk .meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:5px;color:var(--color-muted-foreground);font-size:9px}
.tk .who{display:flex;align-items:center;gap:6px;margin-top:8px;color:#334155;font-size:9px;font-weight:600}
.tk .av{width:21px;height:21px}.tk .av .material-symbols-outlined{font-size:13px}
.toolrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--color-border)}
.toolrow:first-child{border-top:0}
.tool-ic{display:grid;place-content:center;width:36px;height:36px;flex:none;color:var(--color-primary);background:#CCFBF1;border:1px solid var(--color-border);border-radius:8px}
.tool-ic .material-symbols-outlined{font-size:19px}
.toolrow .ti{flex:1;min-width:0}
.toolrow .ti b{display:block;color:var(--color-foreground);font-size:11px}
.toolrow .ti small{color:var(--color-muted-foreground);font-size:9px}
.kbcard{margin-bottom:10px;padding:11px 12px;background:#F8FFFE;border:1px solid var(--color-border);border-left:4px solid var(--color-primary);border-radius:8px}
.kbcard .kh{display:flex;align-items:center;gap:7px;color:var(--color-foreground);font-size:11px;font-weight:700}
.kbcard .kh .grow{margin-left:auto}
.kbcard p{margin:6px 0 0;color:#334155;font-size:10px}
.kbcard .src{display:flex;align-items:center;gap:7px;margin-top:7px;color:var(--color-muted-foreground);font-size:9px}
.trace{position:relative}
.trace .tr{position:relative;display:flex;gap:12px;padding-bottom:14px}
.trace .tr:before{content:"";position:absolute;top:29px;bottom:-1px;left:15px;width:2px;background:var(--color-border)}
.trace .tr:last-child:before{display:none}
.tr-ic{z-index:1;display:grid;place-content:center;width:32px;height:32px;flex:none;border:1px solid currentColor;border-radius:8px}
.tr-ic .material-symbols-outlined{font-size:17px}
.tr-body{flex:1;min-width:0;padding:10px 12px;background:#F8FFFE;border:1px solid var(--color-border);border-radius:8px}
.tr-body .th{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tr-body b{color:var(--color-foreground);font-size:11px}
.tr-body .t{margin-left:auto;color:var(--color-muted-foreground);font-family:var(--mono);font-size:9px;font-weight:600}
.tr-body p{margin:5px 0 0;color:#334155;font-size:10px}
.tr-body .kv{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{padding:2px 7px;color:var(--color-muted-foreground);background:#fff;border:1px solid var(--color-border);border-radius:999px;font-family:var(--mono);font-size:8px;font-weight:600}
.a-pink{color:#115E59;background:#CCFBF1}.a-info{color:#075985;background:#E0F2FE}
.a-amber{color:#854D0E;background:#FEF9C3}.a-red{color:#991B1B;background:#FEE2E2}.a-ok{color:#166534;background:#DCFCE7}
.hf-inner{display:flex;align-items:flex-start;min-width:640px;padding:6px 0}
.hf-node{flex:1;min-width:90px;text-align:center}
.hf-node .b{display:grid;place-content:center;width:38px;height:38px;margin:0 auto 6px;color:#fff;border-radius:8px}
.hf-node .b .material-symbols-outlined{font-size:19px}
.hf-node small{display:block;color:var(--color-foreground);font-size:9px;font-weight:700}
.hf-node span{color:var(--color-muted-foreground);font-size:8px}
.hf-line{width:34px;height:2px;flex:none;margin-top:18px;background:var(--color-primary)}
.mtx table{width:100%;min-width:620px;border-collapse:collapse;font-size:11px}
.mtx th{text-align:center}.mtx th:first-child{text-align:left}
.mtx td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--color-border);font-variant-numeric:tabular-nums}
.mtx td:first-child{text-align:left;color:var(--color-foreground);font-weight:700}
.mtx td:nth-last-child(-n+2){font-family:var(--mono);text-align:right}
.score{display:inline-grid;place-content:center;min-width:44px;height:26px;padding:0 6px;border:1px solid currentColor;border-radius:6px;font-size:10px;font-weight:700}
.sc-hi{color:#166534;background:#DCFCE7}.sc-mid{color:#854D0E;background:#FEF9C3}.sc-lo{color:#991B1B;background:#FEE2E2}
@media (prefers-reduced-motion:no-preference){
  .grid-item,.kpi,.card,.ac{animation:enter .4s both}
  .kpi:nth-child(2),.ac:nth-child(2){animation-delay:.06s}
  .kpi:nth-child(3),.ac:nth-child(3){animation-delay:.12s}
  .kpi:nth-child(4),.ac:nth-child(4){animation-delay:.18s}
  .ac:nth-child(5){animation-delay:.24s}.ac:nth-child(6){animation-delay:.3s}
  .live .dot,.pulse.run i,.pulse.wait i{animation:pulse 1.8s ease-in-out infinite}
}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
@media (max-width:1100px){
  .tb-in{flex-wrap:wrap}
  .nav{order:3;width:100%;overflow-x:auto}
  .g2,.g2b,.g3{grid-template-columns:1fr}
  .board,.agents{grid-template-columns:1fr 1fr}
}
@media (max-width:768px){
  .body{padding:20px 14px 42px}
  .kpis{grid-template-columns:1fr 1fr}
  .agents,.board{grid-template-columns:1fr}
  .vh{flex-direction:column}
  .vh>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
  .tb-in{padding:10px 14px}
  .tb-r{margin-left:auto}
}
@media (max-width:520px){
  .brand span,.tb-u b,.tb-u span,.live{display:none}
  .nav button .txt{display:none}
  .nav button{min-width:42px;justify-content:center;padding:8px}
  .kpis{grid-template-columns:1fr}
  .vh h2{font-size:19px}
  .btn{min-height:44px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div><b>多位AI助理任務協作台</b><span>AI TEAM COLLABORATION WORKSPACE</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="tb-r">
      <span class="live"><span class="dot"></span>運行中：3 個工作流</span>
      <div class="tb-u"><div class="av">許</div><div><b>許庭安</b><span>營運長</span></div></div>
    </div>
  </div>
</header>
<main class="body" id="view"></main>
<script>
"use strict";
var MODS=[
  {i:"smart_toy",n:"代理團隊"},
  {i:"account_tree",n:"流程編排"},
  {i:"playlist_add_check",n:"任務派工"},
  {i:"handyman",n:"工具與知識"},
  {i:"timeline",n:"執行追蹤"},
  {i:"fact_check",n:"品質成本"}
];
var PINK="#0D9488",PINK2="#14B8A6",INDIGO="#4338CA",SKY="#0369A1";
function kpi(l,ic,v,u,d,cls){
  return '<div class="kpi grid-item"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="d '+(cls||"fl")+'">'+d+'</div></div>';
}
function cbox(id,h){return '<div class="chart-box" style="height:'+h+'px"><canvas id="'+id+'"></canvas></div>'}
function barrow(p,c){return '<div class="bar"><span style="width:'+Math.max(0,Math.min(100,p))+'%;background:'+c+'"></span></div>'}
var charts=[];

function buildNav(){
  document.getElementById("nav").innerHTML=MODS.map(function(m,i){
    return '<button type="button" data-i="'+i+'" aria-label="'+m.n+'" onclick="location.hash=\'v'+i+'\'"><span class="material-symbols-outlined">'+m.i+'</span><span class="txt">'+m.n+'</span></button>'
  }).join("");
}
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  killCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i].r();
  SCREENS[i].i();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?+m[1]:0);
  try{window.scrollTo(0,0)}catch(e){}
}

window.addEventListener("hashchange",fromHash);
