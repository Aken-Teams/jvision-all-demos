<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GRC 治理風險合規平台 · IT Governance, Risk &amp; Compliance</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Josefin+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;--color-on-primary:#0F172A;
  --color-secondary:#0D0D0D;--color-on-secondary:#FFFFFF;
  --color-accent:#FF3333;--color-on-accent:#000000;
  --color-background:#000000;--color-foreground:#E0E0E0;
  --color-card:#0C130E;--color-card-foreground:#E0E0E0;
  --color-muted:#181818;--color-muted-foreground:#94A3B8;
  --color-border:#1F1F1F;--color-destructive:#EF4444;
  --color-on-destructive:#000000;--color-ring:#00FF41;
  --blue:#00FF41;--ink:#E0E0E0;--muted:#94A3B8;--line:#303630;
  --ok:#00FF41;--warn:#FFD000;--bad:#FF4D4D;--info:#67E8F9;
  --font-display:Cinzel,Georgia,serif;
  --font-body:"Josefin Sans","Noto Sans TC",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace
}
*{box-sizing:border-box}
html{color-scheme:dark;background:#000}
body{
  margin:0;min-width:320px;background:
  linear-gradient(rgba(0,255,65,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,255,65,.035) 1px,transparent 1px),
  var(--color-background);
  background-size:32px 32px;color:var(--color-foreground);
  font-family:var(--font-body);font-weight:500;line-height:1.45
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px
}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{
  position:sticky;top:0;z-index:20;display:grid;
  grid-template-columns:minmax(260px,1fr) auto;border-bottom:2px solid var(--color-primary);
  background:rgba(0,0,0,.96)
}
.brand{
  min-width:0;display:flex;align-items:center;gap:13px;padding:11px 20px;
  border-right:1px solid var(--line)
}
.logo{
  width:48px;height:48px;display:grid;place-items:center;flex:none;
  border:2px solid var(--color-primary);background:var(--color-primary);
  color:var(--color-on-primary);font:700 12px var(--font-display);
  box-shadow:5px 5px 0 #23472c
}
.brand b{
  display:block;color:#fff;font-family:var(--font-display);
  font-size:15px;font-weight:700;letter-spacing:.03em
}
.brand span{
  display:block;margin-top:2px;color:var(--color-primary);
  font-size:10px;font-weight:700;letter-spacing:.16em
}
.nav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin}
.nav button{
  min-height:70px;min-width:92px;padding:9px 12px;border:0;
  border-left:1px solid var(--line);background:#070707;color:#B8C4BA;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:12px;font-weight:700;white-space:nowrap;
  transition:background-color .18s ease,color .18s ease
}
.nav button:hover{background:#172018;color:#fff}
.nav button.on{
  background:var(--color-primary);color:var(--color-on-primary);
  box-shadow:inset 0 -6px 0 #0a5e20
}
.wrap{width:min(100%,1440px);margin:auto;padding:24px}
.vh{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid var(--line)
}
.vh h2{
  margin:0;color:#fff;font:700 clamp(23px,3vw,38px)/1.05 var(--font-display);
  letter-spacing:.02em
}
.vh p{margin:8px 0 0;color:#AAB7AC;font-size:14px}
.badge-live{
  display:flex;align-items:center;gap:9px;max-width:100%;padding:8px 12px;
  border:1px solid var(--color-primary);background:#061509;color:#CFFFD8;
  font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase
}
.badge-live i{
  width:9px;height:9px;display:inline-block;background:var(--color-primary);
  box-shadow:0 0 0 3px rgba(0,255,65,.14)
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{
  min-width:0;position:relative;overflow:hidden;padding:17px 16px 15px;
  border:1px solid #344039;border-top:4px solid var(--color-primary);
  background:var(--color-card)
}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi .l{padding-right:35px;color:#AEB9B0;font-size:12px;font-weight:700}
.kpi .v{
  margin-top:9px;color:#fff;font:700 30px/1 var(--font-display);
  font-variant-numeric:tabular-nums
}
.kpi .v small{font-family:var(--font-mono)!important}
.kpi .d{margin-top:9px;font-family:var(--font-mono);font-size:10px;font-weight:700}
.kpi .ic{position:absolute;right:12px;top:13px;color:var(--color-primary);font-size:25px}
.up{color:#6BFF8E}.down{color:#FF8585}
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(300px,.85fr)}
.g11{grid-template-columns:1fr 1fr}
.card{
  min-width:0;padding:17px;border:1px solid #344039;
  background:linear-gradient(145deg,#0C130E 0,#080B09 100%);
  box-shadow:6px 6px 0 #111
}
.card h3{
  margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);
  color:#fff;font-size:14px;font-weight:700;letter-spacing:.015em;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.tag{
  display:inline-flex;align-items:center;justify-content:center;min-height:23px;
  padding:3px 8px;border:1px solid currentColor;background:#111;
  font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap
}
.t-r{color:#FF8B8B;background:#240909}.t-a{color:#FFE16A;background:#211B03}
.t-b{color:#8EEBFF;background:#062029}.t-g{color:#75FF95;background:#06240D}
.t-x{color:#BBC5BD;background:#181818}
.scroll,.rmwrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{
  padding:10px;border:1px solid var(--line);text-align:left;vertical-align:middle
}
table.data th{
  background:#182019;color:#D9E4DB;font-size:11px;font-weight:700;
  letter-spacing:.04em;white-space:nowrap
}
table.data tr:hover td{background:#101A12}
table.data td:first-child,table.data td:nth-child(4){
  font-family:var(--font-mono);font-variant-numeric:tabular-nums
}
table.data td:nth-last-child(2){text-align:right;font-variant-numeric:tabular-nums}
.chart{overflow:hidden}
.rm{margin:auto;border-collapse:separate;border-spacing:5px}
.rm td,.rm th{text-align:center}
.rm .cell{
  width:54px;height:48px;position:relative;display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.42);color:#fff;
  font:700 15px var(--font-mono);text-shadow:0 1px 2px #000
}
.rm .cell small{position:absolute;top:2px;left:4px;font-size:8px}
.rm .ax{
  color:#B8C4BA;font-size:10px;font-weight:700;white-space:nowrap
}
.rm .yl{writing-mode:vertical-rl;text-orientation:mixed}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.leg span{display:flex;align-items:center;gap:6px;color:#B6C1B8;font-size:11px}
.leg i{width:15px;height:15px;display:inline-block;border:1px solid #fff}
.docs,.chk,.sch,.impr,.risktop{display:flex;flex-direction:column;gap:8px}
.doc,.si,.im,.rtc,.ci{
  border:1px solid var(--line);background:#101411
}
.doc{
  display:flex;align-items:center;gap:12px;padding:11px 12px
}
.doc .fic{
  width:36px;height:40px;display:grid;place-items:center;flex:none;
  border:1px solid var(--color-primary);color:var(--color-primary);background:#071009
}
.doc b,.si b,.im b,.rtc b,.ci b{display:block;color:#EEF5EF;font-size:12.5px}
.doc small,.si small,.im small,.rtc small,.ci small,.vnode small,.ti small{
  color:#A9B5AB;font-size:11px
}
.doc .rt,.si .rt,.im .rt,.ci .rt{margin-left:auto;flex:none;text-align:right}
.ver{
  color:var(--color-primary);font:700 12px var(--font-mono);
  font-variant-numeric:tabular-nums
}
.vtree{position:relative;padding-left:10px}
.vtree:before,.tl:before{
  content:"";position:absolute;width:2px;background:var(--line)
}
.vtree:before{left:5px;top:6px;bottom:14px}
.vnode{position:relative;margin-bottom:8px;padding:0 0 5px 23px}
.vnode:before{
  content:"";position:absolute;left:0;top:4px;width:11px;height:11px;
  border:2px solid #000;background:var(--color-primary)
}
.vnode.old:before{background:#7C8A7F}
.vnode .vt2{color:#EEF5EF;font-size:12.5px;font-weight:700}
.ci{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-left:5px solid}
.ci.pass{border-left-color:var(--ok)}.ci.fail{border-left-color:var(--bad)}
.ci.part{border-left-color:var(--warn)}
.ci .bx,.im .bx{
  width:27px;height:27px;display:grid;place-items:center;flex:none;color:#000
}
.si{display:flex;align-items:center;gap:11px;padding:11px 12px}
.si .av{
  width:34px;height:34px;display:grid;place-items:center;flex:none;
  border:1px solid var(--color-primary);background:#09200F!important;
  color:var(--color-primary);font-weight:700
}
.im{display:flex;align-items:center;gap:12px;padding:12px}
.im .prog,.tc .rate .pb{
  overflow:hidden;background:#242B25;border:1px solid #3C483E
}
.im .prog{width:150px;max-width:100%;height:7px;margin-top:7px}
.im .prog i,.tc .rate .pb i{
  display:block;height:100%;background:var(--color-primary)
}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.tc{padding:13px;border:1px solid var(--line);background:#101411}
.tc>.material-symbols-outlined{color:var(--color-primary);font-size:25px}
.tc b{display:block;margin:7px 0 4px;color:#EEF5EF;font-size:13px}
.tc small{color:#A9B5AB;font-size:11px}
.tc .rate{display:flex;align-items:center;gap:8px;margin-top:9px}
.tc .rate .pb{height:8px;flex:1}
.tl{position:relative;padding-left:23px}
.tl:before{left:6px;top:4px;bottom:4px}
.ti{position:relative;padding:0 0 16px 4px}
.ti:before{
  content:"";position:absolute;left:-21px;top:2px;width:13px;height:13px;
  border:2px solid #000;background:var(--color-primary)
}
.ti .tt{color:#EDF5EE;font-size:12.5px;font-weight:700}
.rtc{padding:11px 12px;border-left:4px solid #667369}
.rtc .ct{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rtc small{display:block;margin-top:4px}
.score{
  color:#fff!important;font:700 18px var(--font-mono);
  font-variant-numeric:tabular-nums
}
p[style*="color:var(--mut)"]{color:#ABB6AD!important}
@keyframes gridIn{
  0%{opacity:0;transform:translateY(16px) scale(.94)}
  70%{transform:translateY(-2px) scale(1.01)}
  100%{opacity:1;transform:none}
}
#view>.kpis>*,
#view>.grid>.card,
.tr>.tc,.docs>.doc,.chk>.ci,.sch>.si,.impr>.im,.risktop>.rtc{
  animation:gridIn .42s cubic-bezier(.2,.8,.25,1.25) both
}
#view>.grid>.card:nth-child(2),.tr>.tc:nth-child(2n),.docs>.doc:nth-child(2n),
.chk>.ci:nth-child(2n),.sch>.si:nth-child(2n),.impr>.im:nth-child(2n),
.risktop>.rtc:nth-child(2n){animation-delay:.06s}
@media(max-width:1024px){
  .top{grid-template-columns:1fr}.brand{border-right:0}
  .nav{border-top:1px solid var(--line)}.nav button{min-height:58px;flex:1}
  .g2{grid-template-columns:minmax(0,1.25fr) minmax(280px,.85fr)}
}
@media(max-width:768px){
  .wrap{padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}
  .g2,.g11{grid-template-columns:1fr}.vh{align-items:flex-start}
  .brand{padding:10px 14px}.nav button{min-width:82px}
}
@media(max-width:480px){
  .brand b{font-size:13px}.brand span{font-size:8px}
  .logo{width:42px;height:42px}.wrap{padding:12px}
  .vh{display:block}.badge-live{width:max-content;margin-top:12px}
  .kpis{gap:8px}.kpi{padding:14px 12px}.kpi:nth-child(even){transform:none}
  .kpi .v{font-size:24px}.card{padding:13px;box-shadow:4px 4px 0 #111}
  .nav button{min-width:62px;padding:8px 5px;font-size:10px}
  .doc,.si,.im{align-items:flex-start}.doc .rt,.si .rt,.im .rt{max-width:78px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    scroll-behavior:auto!important;transition-duration:.001ms!important
  }
}
</style>
</head>
