<style>
:root{--accent:#1d4ed8;--accent2:#60a5fa;--ink:#0f172a;--bg:#eef2f9;--panel:#ffffff;--panel2:#f4f7fc;--line:#dbe3f0;--mut:#64748b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap;box-shadow:0 2px 12px rgba(29,78,216,.25)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:none}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);font-size:12px}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:#c7dbff;letter-spacing:1.5px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:#dbeafe;font:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.nav button.on{background:#fff;color:var(--accent)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.badge-live{background:#dbeafe;color:var(--accent);border:1px solid #bfdbfe;padding:6px 13px;border-radius:9px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.badge-live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent2);opacity:.55}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h3{margin:0 0 13px;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink)}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-r{background:#fee2e2;color:#b91c1c}.t-a{background:#fef3c7;color:#b45309}.t-b{background:#dbeafe;color:#1d4ed8}.t-g{background:#dcfce7;color:#15803d}.t-x{background:#f1f5f9;color:#64748b}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--panel2)}
table.data tr:hover td{background:var(--panel2)}
.chart{overflow:hidden}
.scroll{overflow-x:auto}
.rmwrap{overflow-x:auto}
.rm{border-collapse:separate;border-spacing:4px;margin:0 auto}
.rm td,.rm th{text-align:center}
.rm .cell{width:52px;height:46px;border-radius:9px;color:#fff;font-weight:800;font-size:15px;font-family:Inter;position:relative;display:grid;place-items:center}
.rm .cell small{position:absolute;left:5px;top:3px;font-size:8.5px;font-weight:700;opacity:.85}
.rm .ax{color:var(--mut);font-size:10px;font-weight:700;font-family:"Noto Sans TC";white-space:nowrap}
.rm .yl{writing-mode:vertical-rl;text-orientation:mixed}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.leg span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.leg i{width:13px;height:13px;border-radius:4px;display:inline-block}
.docs{display:flex;flex-direction:column;gap:9px}
.doc{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.doc .fic{width:34px;height:38px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.doc b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.doc small{color:var(--mut);font-size:11px}
.doc .rt{margin-left:auto;text-align:right;flex:none}
.ver{font-family:Inter;font-weight:800;font-size:12px;color:var(--accent)}
.vtree{position:relative;padding-left:10px}
.vnode{position:relative;padding:0 0 4px 22px;margin-bottom:8px}
.vtree::before{content:"";position:absolute;left:5px;top:6px;bottom:14px;width:2px;background:var(--line)}
.vnode::before{content:"";position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:3px solid var(--panel)}
.vnode.old::before{background:var(--mut)}
.vnode .vt2{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.vnode small{color:var(--mut);font-size:11px;display:block}
.chk{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--panel2);border-left:3px solid var(--line)}
.ci.pass{border-color:var(--ok)}.ci.fail{border-color:var(--bad)}.ci.part{border-color:var(--warn)}
.ci .bx{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ci b{font-size:12.5px;font-family:"Noto Sans TC"}
.ci small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ci .rt{margin-left:auto;flex:none}
.sch{display:flex;flex-direction:column;gap:9px}
.si{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.si .av{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none;font-family:"Noto Sans TC"}
.si b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.si small{color:var(--mut);font-size:11px}
.si .rt{margin-left:auto;text-align:right;flex:none}
.impr{display:flex;flex-direction:column;gap:10px}
.im{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2);display:flex;gap:12px;align-items:center}
.im .bx{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.im b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.im small{color:var(--mut);font-size:11px}
.im .prog{height:6px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin-top:7px;width:130px;max-width:100%}
.im .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.im .rt{margin-left:auto;flex:none;text-align:right}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
.tc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.tc .material-symbols-outlined{color:var(--accent);font-size:24px}
.tc b{display:block;font-family:"Noto Sans TC";font-size:13px;margin:7px 0 5px}
.tc .rate{display:flex;align-items:center;gap:8px;margin-top:8px}
.tc .rate .pb{flex:1;height:7px;background:#e2e8f0;border-radius:5px;overflow:hidden}
.tc .rate .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tc small{color:var(--mut);font-size:11px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--panel)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.risktop{display:flex;flex-direction:column;gap:9px}
.rtc{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel2)}
.rtc .ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rtc b{font-family:"Noto Sans TC";font-size:12.5px}
.rtc small{color:var(--mut);font-size:11px;display:block;margin-top:4px}
.score{font-family:Inter;font-weight:900;font-size:17px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g11{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:8px}}
</style>
</head>
