<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>資訊安全事件管理平台（SIEM/SOC）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#0D0D0D;
  --color-on-secondary:#FFFFFF;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#000000;
  --color-foreground:#E0E0E0;
  --color-card:#0C130E;
  --color-card-foreground:#E0E0E0;
  --color-muted:#181818;
  --color-muted-foreground:#94A3B8;
  --color-border:#1F1F1F;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;

  --blue:#60A5FA;
  --ink:#E0E0E0;
  --muted:#94A3B8;
  --line:#2D3B31;

  --teal:#00FF41;
  --teal2:#7CFF9D;
  --teal-dark:#00CC34;
  --bg:#000000;
  --panel:#0C130E;
  --soft:#111914;
  --red:#FF5151;
  --amber:#FBBF24;
  --green:#00FF41;
}
*{box-sizing:border-box;}
html{color-scheme:dark;scroll-behavior:auto;}
html,body{margin:0;padding:0;min-width:320px;}
body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:"Josefin Sans",system-ui,sans-serif;
  line-height:1.55;
  color:var(--color-foreground);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(0,255,65,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.045) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer;}
button,input,select,textarea{font:inherit;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{color:#000;background:var(--color-primary);}
.material-symbols-outlined{
  vertical-align:middle;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
}
.app{display:flex;min-height:100vh;align-items:stretch;}
.side{
  position:sticky;
  top:0;
  z-index:10;
  width:264px;
  height:100vh;
  flex:0 0 264px;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
  padding:18px 14px;
  color:var(--color-card-foreground);
  background:#070A08;
  border-right:2px solid var(--color-primary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 12px;
  padding:0 0 18px;
  border-bottom:2px solid var(--line);
}
.brand .logo{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--color-primary);
  border-radius:0;
  box-shadow:6px 6px 0 #17421F;
}
.brand .logo .material-symbols-outlined{font-size:27px;font-weight:700;}
.brand b{
  display:block;
  font-family:"Cinzel",serif;
  font-size:15px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:.03em;
  color:#FFFFFF;
}
.brand span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;}
.navwrap{display:flex;flex-direction:column;gap:7px;min-width:0;}
.navbtn{
  position:relative;
  width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  color:#B8C5BC;
  background:#0A0E0B;
  border:1px solid #314037;
  border-radius:0;
  text-align:left;
  font-size:13px;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
}
.navbtn::after{
  content:"";
  position:absolute;
  right:8px;
  width:6px;
  height:6px;
  border:1px solid #526258;
}
.navbtn:hover{
  color:#FFFFFF;
  background:#142019;
  border-color:var(--color-primary);
  transform:translateX(3px);
}
.navbtn.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:5px 5px 0 #17421F;
}
.navbtn.on::after{background:#000;border-color:#000;}
.navbtn .material-symbols-outlined{flex:0 0 auto;font-size:21px;color:var(--color-primary);}
.navbtn.on .material-symbols-outlined{color:#000;}
.navbtn .txt{min-width:0;overflow:hidden;}
.navbtn .txt b{display:block;font-size:13px;font-weight:700;line-height:1.2;}
.navbtn small{display:block;margin-top:3px;font-size:10px;font-weight:600;color:#94A3B8;letter-spacing:.06em;}
.navbtn.on small{color:#18351F;}
.side-foot{
  margin-top:auto;
  padding:14px 4px 2px;
  border-top:2px solid var(--line);
  color:#A8B5AC;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
}
.side-foot .dot{
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:7px;
  background:var(--green);
  border:1px solid #000;
  border-radius:0;
  box-shadow:0 0 0 2px var(--green);
}
.main{flex:1 1 auto;min-width:0;padding:30px clamp(18px,3vw,44px) 64px;display:flex;flex-direction:column;}
#screen{width:100%;max-width:1540px;margin:0 auto;}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:22px;
  margin:0 0 24px;
  padding:0 0 20px;
  border-bottom:3px solid var(--color-primary);
}
.topbar::after{
  content:"SECURITY OPERATIONS / ACTIVE VIEW";
  position:absolute;
  right:0;
  bottom:-18px;
  padding:2px 8px;
  color:#000;
  background:var(--color-primary);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:11px;
  margin:0;
  color:#FFFFFF;
  font-family:"Cinzel",serif;
  font-size:clamp(22px,2.2vw,32px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:.02em;
}
.topbar h1 .material-symbols-outlined{font-size:30px;color:var(--color-primary);}
.topbar .sub{max-width:760px;margin-top:8px;color:#A9B5AD;font-size:13px;font-weight:500;}
.chips{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;}
.chip{
  display:flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 10px;
  color:#C4CEC7;
  background:#080C09;
  border:1px solid #3B4B40;
  border-radius:0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-weight:700;
}
.chip .material-symbols-outlined{font-size:16px;color:var(--color-primary);}
.chip.live{color:#000;background:var(--color-primary);border-color:var(--color-primary);}
.chip.live .material-symbols-outlined{color:#000;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);}
.min0{min-width:0;}
.card{
  position:relative;
  min-width:0;
  padding:18px;
  overflow:hidden;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid #28382D;
  border-radius:0;
  box-shadow:7px 7px 0 rgba(0,255,65,.09);
}
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:42px;
  height:3px;
  background:var(--color-primary);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  color:#FFFFFF;
  font-family:"Cinzel",serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary);}
.card .cdesc{margin:0 0 16px;color:#9EACA2;font-size:11.5px;font-weight:500;}
.kpi{min-height:146px;padding:17px 18px 22px;}
.kpi:nth-child(even){transform:translateY(7px);}
.kpi .lbl{display:flex;align-items:center;gap:7px;color:#AAB6AE;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.kpi .lbl .material-symbols-outlined{font-size:18px;color:var(--color-primary);}
.kpi .val{
  margin:10px 0 4px;
  color:#FFFFFF;
  font-family:"Cinzel",ui-monospace,monospace;
  font-size:clamp(26px,2.4vw,36px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{font-family:"Josefin Sans",sans-serif;font-size:12px;font-weight:700;color:#9EACA2;letter-spacing:0;}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.up{color:#66FF8C;}.down{color:#FF7373;}.warn{color:#FFD25A;}
.kpi .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--color-primary)!important;}
.hl{color:var(--color-primary);font-weight:800;}
.chartbox{position:relative;width:100%;overflow:hidden;background:#101713;border:1px solid #314037;padding:8px;}
.tblwrap{overflow-x:auto;border:1px solid #314037;scrollbar-color:var(--color-primary) #111;}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12.5px;}
th{
  padding:11px 12px;
  color:#000;
  background:var(--color-primary);
  border-right:1px solid #073B14;
  border-bottom:2px solid #000;
  text-align:left;
  white-space:nowrap;
  font-size:10px;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
}
th:last-child{border-right:0;}
td{padding:12px;border-right:1px solid #253229;border-bottom:1px solid #253229;vertical-align:middle;color:#DCE5DF;}
td:last-child{border-right:0;}
tbody tr:nth-child(even){background:#101713;}
tbody tr:hover{background:#17231B;}
tr:last-child td{border-bottom:0;}
td[style*="text-align:center"]{text-align:right!important;}
td[style*="color:#64748b"],td[style*="color: #64748b"]{color:#AAB6AE!important;}
.mono,
td:first-child,
.chip{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.mono{font-weight:700;letter-spacing:.01em;}
td:has(> .mono),td .mono{font-variant-numeric:tabular-nums;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:800;
}
.tag .material-symbols-outlined{font-size:14px;}
.t-red{color:#FF8A8A;background:#351111;}
.t-amber{color:#FFD25A;background:#332708;}
.t-green{color:#7CFF9D;background:#0A3516;}
.t-blue{color:#93C5FD;background:#102A45;}
.t-teal{color:#7CFF9D;background:#0A3516;}
.t-gray{color:#CAD4CD;background:#29302B;}
.sev{
  display:inline-flex;
  align-items:center;
  width:auto;
  height:20px;
  margin-right:7px;
  padding:1px 5px;
  border:1px solid currentColor;
  border-radius:0;
  vertical-align:middle;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:8px;
  font-weight:800;
  line-height:1;
}
.sev::after{display:inline-block;}
.s-crit{color:#FF8A8A;background:#351111;}.s-crit::after{content:"CRIT";}
.s-high{color:#FFD25A;background:#332708;}.s-high::after{content:"HIGH";}
.s-med{color:#93C5FD;background:#102A45;}.s-med::after{content:"MED";}
.s-low{color:#CAD4CD;background:#29302B;}.s-low::after{content:"LOW";}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:900px;}
.col{min-width:0;padding:12px;background:#080D09;border:1px solid #35443A;border-top:4px solid var(--color-primary);border-radius:0;}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;color:#FFFFFF;font-size:12px;font-weight:800;letter-spacing:.04em;}
.col-h .cnt{padding:1px 7px;color:#000;background:var(--color-primary);border:1px solid var(--color-primary);border-radius:0;font-family:ui-monospace,monospace;font-size:10px;}
.ticket{margin-bottom:9px;padding:11px;color:#DDE5DF;background:#111914;border:1px solid #3B4B40;border-radius:0;box-shadow:3px 3px 0 #1B2B20;}
.ticket:last-child{margin-bottom:0;}
.ticket .tt{margin-bottom:6px;font-size:12px;font-weight:700;line-height:1.4;}
.ticket .tm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;color:#AAB6AE;font-size:10px;}
.ticket .who{display:inline-flex;align-items:center;gap:5px;}
.ava{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;color:#000;background:var(--color-primary);border:1px solid var(--color-primary);border-radius:0;font-family:ui-monospace,monospace;font-size:8px;font-weight:800;}
.tl{position:relative;margin:0;padding-left:28px;}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:#405046;}
.tl-item{position:relative;padding:0 0 19px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .dot{position:absolute;top:2px;left:-27px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;color:#000;background:#0C130E;border:3px solid #789083;border-radius:0;}
.tl-item.done .dot{background:var(--color-primary);border-color:var(--color-primary);}
.tl-item .tl-t{color:#FFFFFF;font-size:12.5px;font-weight:800;}
.tl-item .tl-time{margin-left:5px;color:#AAB6AE;font-family:ui-monospace,monospace;font-size:10px;font-weight:700;}
.tl-item .tl-d{margin-top:3px;color:#B6C2BA;font-size:11.5px;}
.prog{height:9px;min-width:60px;overflow:hidden;background:#263129;border:1px solid #445248;border-radius:0;}
.prog i{display:block;height:100%;background:var(--color-primary)!important;border-radius:0;}
.meter{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
.meter:last-child{margin-bottom:0;}
.meter .ml{width:120px;flex:0 0 120px;overflow:hidden;color:#DCE5DF;font-size:11.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap;}
.meter .mb{flex:1 1 auto;min-width:0;}
.meter .mv{width:44px;flex:0 0 44px;color:#FFFFFF;text-align:right;font-family:ui-monospace,monospace;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}
.path{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;min-width:max-content;padding:4px;}
.node{display:flex;align-items:center;gap:7px;min-width:0;padding:10px 13px;color:#E6EEE8;background:#111914;border:2px solid #45564A;border-radius:0;font-size:11.5px;font-weight:800;}
.node .material-symbols-outlined{font-size:18px;}
.node.attk{color:#FF9A9A;background:#2B1010;border-color:#FF5151;}
.node.mid{color:#FFD96D;background:#2C230B;border-color:#FBBF24;}
.node.tgt{color:#7CFF9D;background:#0A2C13;border-color:#00FF41;}
.arrow{flex:0 0 auto;color:var(--color-primary);font-size:21px;}
.attck{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:7px;min-width:520px;}
.tk{min-width:0;padding:10px 7px;color:#B8C4BC;background:#111914;border:1px solid #405046;border-radius:0;text-align:center;font-size:10px;font-weight:700;}
.tk.hit{color:#FF9A9A;background:#2B1010;border:2px solid #FF5151;}
.tk.hit::before{content:"DETECTED";display:block;margin:-10px -7px 6px;padding:2px;color:#000;background:#FF5151;font-size:7px;font-weight:900;letter-spacing:.08em;}
.tk.hit b{display:block;margin-top:2px;font-family:"Cinzel",monospace;font-size:17px;}
.tk .th{color:#AAB6AE;font-size:8px;letter-spacing:.05em;text-transform:uppercase;}
.donut-wrap{position:relative;}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.donut-center b{display:block;color:#FFFFFF;font-family:"Cinzel",monospace;font-size:25px;font-weight:700;}
.donut-center span{color:#AAB6AE;font-size:10px;}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #304037;}
.lrow:last-child{border-bottom:0;}
.lrow .li-ic{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;color:#000;background:var(--color-primary);border-radius:0;}
.lrow .li-ic .material-symbols-outlined{font-size:20px;color:#000;}
.lrow .li-main{flex:1 1 auto;min-width:0;}
.lrow .li-main b{display:block;overflow:hidden;color:#E4ECE6;font-size:12.5px;text-overflow:ellipsis;}
.lrow .li-main small{color:#AAB6AE;font-family:ui-monospace,monospace;font-size:10px;}
.lrow .li-end{flex:0 0 auto;text-align:right;}
.compbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:11px;color:#DCE5DF;background:#101713;border:1px solid #3A4A3F;border-radius:0;}
.compbar:last-child{margin-bottom:0;}
.compbar .cn{flex:1 1 auto;min-width:0;}
.compbar .cn b{display:block;color:#FFFFFF;font-size:12.5px;}
.compbar .cn small{color:#AAB6AE;font-size:10.5px;}
.ring{display:flex;align-items:center;justify-content:center;width:48px;height:48px;flex:0 0 48px;border-radius:50%;font-family:ui-monospace,monospace;font-size:11px;font-weight:800;}
.ring span{background:#09100B!important;color:#FFFFFF!important;}
@media(prefers-reduced-motion:no-preference){
  #screen>.grid>.card,#screen>.card{
    animation:soc-enter .4s cubic-bezier(.18,.89,.32,1.28) both;
  }
  #screen>.grid>.card:nth-child(2){animation-delay:.06s;}
  #screen>.grid>.card:nth-child(3){animation-delay:.12s;}
  #screen>.grid>.card:nth-child(4){animation-delay:.18s;}
  .side-foot .dot{animation:status-pulse 1.8s steps(2,end) infinite;}
}
@keyframes soc-enter{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes status-pulse{50%{opacity:.45;}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  #screen>.grid>.card,#screen>.card{opacity:1;transform:none;}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .attck{grid-template-columns:repeat(3,minmax(100px,1fr));}
}
@media(max-width:960px){
  .board{grid-template-columns:repeat(2,minmax(220px,1fr));min-width:500px;}
  .topbar{flex-direction:column;}
  .chips{justify-content:flex-start;}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{position:static;width:auto;height:auto;flex:none;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;border-right:0;border-bottom:2px solid var(--color-primary);}
  .brand{margin:0 8px 0 0;padding:0 14px 0 0;border-right:2px solid var(--line);border-bottom:0;}
  .brand .logo{width:40px;height:40px;flex-basis:40px;box-shadow:4px 4px 0 #17421F;}
  .navwrap{flex:1 1 auto;flex-direction:row;flex-wrap:wrap;}
  .navbtn{width:auto;min-height:42px;padding:9px 11px;}
  .navbtn:hover{transform:translateY(-2px);}
  .navbtn::after{display:none;}
  .navbtn small{display:none;}
  .side-foot{display:none;}
  .main{padding:22px 16px 50px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .kpi:nth-child(even){transform:none;}
  .attck{grid-template-columns:repeat(2,minmax(110px,1fr));}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .side{gap:7px;padding:10px;}

// ---------- shared chart options ----------
function copts(o){
  o=o||{};
  var sc={
    x:{grid:{display:false},ticks:{font:{size:10}},stacked:!!o.stackX},
    y:{beginAtZero:true,grid:{color:"#eef2f6"},ticks:{font:{size:10}},stacked:!!o.stackY}
  };
  if(o.y100){ sc.y.max=100; }
  var cfg={maintainAspectRatio:false,responsive:true,
    plugins:{legend:{display:o.horizontal?false:true,position:"bottom",labels:{boxWidth:10,font:{size:11},padding:12}}},
    scales:sc};
  if(o.horizontal){ cfg.indexAxis="y"; }
  return cfg;
}

// ---------- header ----------
function head(ic,title,sub){
  return '<div class="topbar"><div class="min0"><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1><div class="sub">'+sub+'</div></div>'
    +'<div class="chips">'
    +'<div class="chip"><span class="material-symbols-outlined">schedule</span>2026-08-14 04:15</div>'
    +'<div class="chip"><span class="material-symbols-outlined">location_on</span>SOC 值班室</div>'
    +'<div class="chip live"><span class="material-symbols-outlined">sensors</span>即時監控中</div>'
    +'</div></div>';
}

  {r:s4,c:s4charts},

// ---------- nav ----------
function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODULES.map(function(m,i){
    return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span>'
      +'<span class="txt"><b>'+m.title+'</b><small>'+m.sub+'</small></span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){
      var idx=+this.getAttribute("data-i");
      location.hash="go="+idx;
    });
  }
}

function show(i){
  destroyCharts();
  var container=document.getElementById("screen");
  var s=SCREENS[i]||SCREENS[0];
  container.innerHTML=s.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on",(+btns[b].getAttribute("data-i"))===i);
  }
  void container.offsetHeight;
  s.c();
}

buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
