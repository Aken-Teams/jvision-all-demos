<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人員訓練資格管理 · 訓練能力控制台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#4F46E5;
  --color-on-primary:#FFFFFF;
  --color-secondary:#818CF8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#EEF2FF;
  --color-foreground:#1E1B4B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E1B4B;
  --color-muted:#EBEEF8;
  --color-muted-foreground:#475569;
  --color-border:#C7D2FE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#4F46E5;
  --blue:#4F46E5;
  --ink:#1E1B4B;
  --muted:#475569;
  --line:#C7D2FE;
  --good:#047857;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#3730A3;
  --shadow-outer:0 9px 0 rgba(79,70,229,.11),0 16px 30px rgba(49,46,129,.10);
  --shadow-soft:0 5px 0 rgba(79,70,229,.10),0 10px 22px rgba(49,46,129,.08);
  --shadow-inner:inset 0 2px 0 rgba(255,255,255,.88),inset 0 -2px 0 rgba(79,70,229,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 4%,rgba(129,140,248,.28),transparent 25rem),
    radial-gradient(circle at 95% 34%,rgba(234,88,12,.12),transparent 24rem),
    var(--color-background);
  font-family:"Comic Neue","Noto Sans TC",system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
.msym{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:1.25em;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.skip{
  position:fixed;
  left:14px;
  top:-60px;
  z-index:100;
  padding:10px 16px;
  color:#fff;
  background:var(--color-primary);
  border:3px solid var(--ink);
  border-radius:14px;
  font-weight:700;
}
.skip:focus{top:14px}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  margin:0;
  background:rgba(238,242,255,.94);
  border-bottom:3px solid var(--line);
  box-shadow:0 5px 18px rgba(49,46,129,.10);
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  max-width:1440px;
  margin:auto;
  padding:12px 22px 9px;
}
.logo{
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  flex:0 0 auto;
  color:var(--color-on-primary);
  background:linear-gradient(145deg,#7770ff,var(--color-primary));
  border:3px solid #3730A3;
  border-radius:17px;
  box-shadow:var(--shadow-inner),0 5px 0 #312E81,0 10px 18px rgba(79,70,229,.25);
}
.logo .msym{font-size:26px}
.brand-txt{min-width:0}
.brand-txt h1{
  margin:0;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:20px;
  font-weight:700;
  line-height:1.05;
  letter-spacing:.01em;
}
.brand-txt p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.brand-spacer{flex:1}
.status-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 13px;
  color:#065F46;
  background:#ECFDF5;
  border:2px solid #A7F3D0;
  border-radius:999px;
  box-shadow:var(--shadow-inner);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.status-pill .msym{font-size:16px}
.nav{
  display:flex;
  gap:9px;
  max-width:1440px;
  margin:auto;
  padding:5px 22px 14px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:max-content;
  min-height:44px;
  padding:9px 15px;
  color:var(--muted);
  background:var(--color-card);
  border:2px solid var(--line);
  border-radius:15px;
  box-shadow:0 3px 0 rgba(79,70,229,.13),var(--shadow-inner);
  font-size:14px;
  font-weight:700;
  transition:transform .2s ease-out,box-shadow .2s ease-out,border-color .2s ease-out,color .2s ease-out;
}
.nav button:hover{
  color:var(--color-primary);
  border-color:var(--color-secondary);
  transform:translateY(-2px);
  box-shadow:0 6px 0 rgba(79,70,229,.14),0 10px 18px rgba(79,70,229,.10);
}
.nav button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 rgba(79,70,229,.14),var(--shadow-inner);
}
.nav button.on{
  color:#fff;
  background:linear-gradient(145deg,#655CF1,var(--color-primary));
  border-color:#3730A3;
  box-shadow:0 5px 0 #312E81,0 9px 17px rgba(79,70,229,.22),var(--shadow-inner);
}
main{
  width:min(100%,1440px);
  min-height:calc(100vh - 138px);
  margin:auto;
  padding:30px 22px 72px;
}
.screen-head{
  position:relative;
  margin:0 0 24px;
  padding:22px 24px;
  overflow:hidden;
  background:linear-gradient(135deg,#fff 0%,#F8F7FF 70%,#EEF2FF 100%);
  border:3px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow-outer),var(--shadow-inner);
}
.screen-head::after{
  position:absolute;
  right:-32px;
  bottom:-54px;
  width:170px;
  height:170px;
  content:"";
  background:radial-gradient(circle,rgba(129,140,248,.3),rgba(129,140,248,0) 68%);
  border-radius:50%;
  pointer-events:none;
}
.screen-head h2{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:11px;
  flex-wrap:wrap;
  margin:0;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:clamp(24px,3vw,32px);
  font-weight:700;
  line-height:1.12;
}
.screen-head h2>.msym{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid #3730A3;
  border-radius:14px;
  box-shadow:0 4px 0 #312E81;
  font-size:24px;
}
.screen-head .tag{
  padding:4px 10px;
  color:#7C2D12;
  background:#FFF7ED;
  border:2px solid #FDBA74;
  border-radius:999px;
  font-family:"Comic Neue",monospace;
  font-size:12px;
  font-weight:700;
}
.screen-head p{
  position:relative;
  z-index:1;
  max-width:920px;
  margin:12px 0 0;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}
.g-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g-3{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:20px}
.g-side{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
.card,.kpi,.cert,.col,.task{min-width:0}
.card{
  padding:19px;
  background:var(--color-card);
  border:3px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow-soft),var(--shadow-inner);
}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:17px;
  font-weight:700;
}
.card-h h3 .msym{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  color:var(--color-primary);
  background:#EEF2FF;
  border:2px solid var(--line);
  border-radius:11px;
  font-size:19px;
}
.card-h .sub{
  color:var(--muted);
  font-family:"Comic Neue",monospace;
  font-size:12px;
  font-weight:700;
}
.kpi{
  position:relative;
  padding:18px;
  overflow:hidden;
  background:linear-gradient(145deg,#fff,#F8F7FF);
  border:3px solid var(--line);
  border-radius:21px;
  box-shadow:var(--shadow-soft),var(--shadow-inner);
}
.kpi::after{
  position:absolute;
  right:-25px;
  top:-25px;
  width:95px;
  height:95px;
  content:"";
  background:rgba(129,140,248,.13);
  border:3px solid rgba(129,140,248,.17);
  border-radius:50%;
}
.kpi:nth-child(2n)::after{background:rgba(234,88,12,.10);border-color:rgba(234,88,12,.14)}
.klabel{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.klabel .msym{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  color:var(--color-primary);
  background:#EEF2FF;
  border:2px solid var(--line);
  border-radius:10px;
  font-size:18px;
}
.kval{
  position:relative;
  z-index:1;
  margin-top:10px;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:35px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
  line-height:1;
}
.kval small{color:var(--muted);font-size:15px;font-weight:700}
.kfoot{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:9px;
  font-size:12px;
  font-weight:700;
}
.kfoot::before{font-family:"Material Symbols Outlined";font-size:16px}
.up{color:var(--good)}.up::before{content:"trending_up"}
.down{color:var(--bad)}.down::before{content:"priority_high"}
.warn{color:var(--warn)}.warn::before{content:"schedule"}
.flat{color:var(--muted)}.flat::before{content:"info"}
.chart{width:100%;overflow:hidden}
.tbl-wrap,.mtx-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:13px}
th{
  padding:11px 13px;
  color:#312E81;
  background:#EEF2FF;
  border-bottom:2px solid var(--line);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:12px 13px;
  color:var(--ink);
  background:#fff;
  border-bottom:1px solid #E0E7FF;
  font-weight:700;
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F8FAFF}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
table:not(.mtx) th:nth-child(n+3),
table:not(.mtx) td:nth-child(n+3){text-align:right}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:2px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.chip::before{font-family:"Material Symbols Outlined";font-size:14px}
.c-good{color:#047857;background:#ECFDF5}.c-good::before{content:"check_circle"}
.c-warn{color:#9A3412;background:#FFF7ED}.c-warn::before{content:"schedule"}
.c-bad{color:#B91C1C;background:#FEF2F2}.c-bad::before{content:"error"}
.c-info{color:#3730A3;background:#EEF2FF}.c-info::before{content:"info"}
.bar{
  height:10px;
  min-width:60px;
  overflow:hidden;
  background:#E0E7FF;
  border:1px solid #C7D2FE;
  border-radius:999px;
  box-shadow:inset 0 2px 3px rgba(49,46,129,.12);
}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:999px}
.mtx-wrap{border:0;border-radius:0}
.mtx{min-width:650px;border-collapse:separate;border-spacing:6px}
.mtx th{padding:7px 8px;background:transparent;border:0;text-align:center}
.mtx th.rowh{text-align:left}
.mtx td{padding:0;background:transparent;border:0;text-align:center}
.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:40px;
  border:2px solid rgba(49,46,129,.15);
  border-radius:12px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 rgba(49,46,129,.11);
  font-family:"Comic Neue",monospace;
  font-size:12px;
  font-weight:700;
}
.cell.name{
  width:auto;
  justify-content:flex-start;
  padding-left:4px;
  color:var(--ink);
  background:transparent;
  border:0;
  box-shadow:none;
  font-family:"Comic Neue",sans-serif;
  font-size:13px;
  white-space:nowrap;
}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;color:var(--muted);font-size:12px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:15px;height:15px;border:2px solid rgba(49,46,129,.22);border-radius:5px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.col{
  padding:13px;
  background:#F5F3FF;
  border:2px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow-inner);
}
.col>h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 11px;
  color:#312E81;
  font-size:13px;
  font-weight:700;
}
.col>h4 .n{
  min-width:26px;
  padding:2px 8px;
  color:#fff;
  background:var(--color-primary);
  border-radius:999px;
  font-family:"Comic Neue",monospace;
  text-align:center;
}
.task{
  margin-bottom:10px;
  padding:11px 12px;
  background:#fff;
  border:2px solid var(--line);
  border-left:5px solid var(--color-accent);
  border-radius:14px;
  box-shadow:0 3px 0 rgba(79,70,229,.10),var(--shadow-inner);
}
.task:last-child{margin-bottom:0}
.task .t{font-size:13px;font-weight:700}
.task .m{display:flex;flex-wrap:wrap;gap:6px 11px;margin-top:7px;color:var(--muted);font-size:11px;font-weight:700}
.task .m span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.task .m .msym{color:var(--color-primary);font-size:14px}
.tl{position:relative;padding-left:27px}
.tl::before{position:absolute;left:7px;top:5px;bottom:5px;width:4px;content:"";background:#C7D2FE;border-radius:5px}
.tl-item{position:relative;padding:0 0 19px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  position:absolute;
  left:-25px;
  top:4px;
  width:13px;
  height:13px;
  content:"";
  background:var(--color-accent);
  border:3px solid #fff;
  border-radius:50%;
  box-shadow:0 0 0 2px #C2410C;
}
.tl-item .th{font-size:13px;font-weight:700}
.tl-item .tt{color:#3730A3;font-family:"Comic Neue",monospace;font-size:12px;font-weight:700}
.tl-item .td{margin-top:3px;color:var(--muted);font-size:12px;font-weight:700}
.certs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cert{
  position:relative;
  padding:16px;
  background:linear-gradient(145deg,#fff,#F7F7FF);
  border:2px solid var(--line);
  border-radius:18px;
  box-shadow:0 4px 0 rgba(79,70,229,.11),var(--shadow-inner);
}
.cert .badge{position:absolute;right:13px;top:13px}
.cert .cn{padding-right:105px;font-size:14px;font-weight:700}
.cert .cw{margin-top:4px;color:var(--muted);font-size:12px;font-weight:700}
.cert .row{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:700}
.cert .row b{color:var(--ink);font-family:"Comic Neue",monospace;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.reveal{animation:rise .36s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3,.g-side{grid-template-columns:1fr}
  .g-side>.card:first-child{max-width:none}
}
@media(max-width:768px){
  .brand{padding-inline:16px}
  .nav{padding-inline:16px}
  main{padding:22px 16px 60px}
  .g-2{grid-template-columns:1fr}
  .board,.certs{grid-template-columns:1fr}
  .screen-head{padding:19px}
}
@media(max-width:560px){
  .brand-txt p{display:none}
  .status-pill{width:38px;height:38px;padding:0;justify-content:center}
  .status-pill .status-copy{display:none}
  .nav button{min-width:46px;padding:9px 12px}
  .nav button .lbl{display:none}
  .g-kpi{grid-template-columns:1fr}
  .screen-head h2{font-size:24px}
  .card{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .reveal{animation:none}
}
</style>
</head>
<body>
<a class="skip" href="#app">跳至主要內容</a>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="msym">verified</span></div>
    <div class="brand-txt">
      <h1>人員訓練資格管理</h1>
      <p>Training &amp; Competency Management · 訓練能力控制台</p>
    </div>
    <div class="brand-spacer"></div>
    <div class="status-pill"><span class="msym" aria-hidden="true">sync</span><span class="status-copy">作業班 · 即時同步</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="功能畫面">
    <button type="button" data-i="0" class="on"><span class="msym" aria-hidden="true">account_tree</span><span class="lbl">能力矩陣</span></button>
    <button type="button" data-i="1"><span class="msym" aria-hidden="true">calendar_month</span><span class="lbl">訓練排課</span></button>
    <button type="button" data-i="2"><span class="msym" aria-hidden="true">fact_check</span><span class="lbl">訓練執行</span></button>
    <button type="button" data-i="3"><span class="msym" aria-hidden="true">checklist</span><span class="lbl">測驗評核</span></button>
    <button type="button" data-i="4"><span class="msym" aria-hidden="true">verified</span><span class="lbl">資格認證</span></button>
    <button type="button" data-i="5"><span class="msym" aria-hidden="true">shield</span><span class="lbl">稽核合規</span></button>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<script>
(function(){
"use strict";
var app=document.getElementById("app"),charts=[];
var AX="#475569",GRID="#C7D2FE",LBL="#1E1B4B";
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose()}catch(e){}}charts=[]}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
function grid(o){return Object.assign({left:8,right:14,top:26,bottom:8,containLabel:true},o||{})}
function kpi(label,icon,val,unit,foot,cls){
return '<div class="kpi"><div class="klabel"><span class="msym" aria-hidden="true">'+icon+'</span>'+label+'</div><div class="kval">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="kfoot '+(cls||"flat")+'">'+foot+'</div></div>'
}
function head(icon,title,tag,desc){
return '<div class="screen-head"><h2><span class="msym" aria-hidden="true">'+icon+'</span>'+title+(tag?' <span class="tag">'+tag+'</span>':'')+'</h2><p>'+desc+'</p></div>'
}
function finish(){
app.classList.remove("reveal");void app.offsetWidth;app.classList.add("reveal");
if(matchMedia("(prefers-reduced-motion: reduce)").matches)app.classList.remove("reveal")
