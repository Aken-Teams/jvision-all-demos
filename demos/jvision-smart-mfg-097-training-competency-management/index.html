<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人員訓練資格管理 · 訓練能力控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0c0a09; --panel:#1c1917; --panel2:#292524; --line:#3a332e;
    --txt:#f5f1ed; --muted:#a8a29e; --dim:#78716c;
    --accent:#c2410c; --accent2:#fb923c; --accent3:#fdba74;
    --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--txt); min-width:0;
    font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .msym{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  a{color:inherit;text-decoration:none;}

  .topbar{
    position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#171310,#0c0a09);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;padding:12px 18px;}
  .logo{
    width:38px;height:38px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:0 4px 14px rgba(194,65,12,.4);
  }
  .logo .msym{font-size:22px;}
  .brand-txt{min-width:0;}
  .brand-txt h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;}
  .brand-txt p{margin:2px 0 0;font-size:11px;color:var(--muted);}
  .brand-spacer{flex:1;}
  .status-pill{
    display:flex;align-items:center;gap:7px;background:var(--panel2);
    border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--muted);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);}
  .nav{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;}
  .nav button{
    display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;
    font-family:inherit;transition:.15s;
  }
  .nav button .msym{font-size:18px;}
  .nav button:hover{color:var(--txt);border-color:var(--accent);}
  .nav button.on{
    background:linear-gradient(135deg,var(--accent),#9a3412);color:#fff;border-color:var(--accent2);
    box-shadow:0 3px 12px rgba(194,65,12,.35);
  }

  main{padding:20px 18px 60px;max-width:1360px;margin:0 auto;}
  .screen-head{margin:0 0 18px;}
  .screen-head h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .screen-head h2 .msym{color:var(--accent2);font-size:24px;}
  .screen-head .tag{font-size:11px;font-weight:700;color:var(--accent3);background:rgba(194,65,12,.15);border:1px solid rgba(194,65,12,.4);padding:3px 9px;border-radius:6px;}
  .screen-head p{margin:7px 0 0;color:var(--muted);font-size:13px;}

  .g-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .g-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .g-3{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
  .g-side{display:grid;grid-template-columns:280px 1fr;gap:16px;}
  @media(max-width:820px){
    .g-kpi{grid-template-columns:1fr 1fr;}
    .g-2,.g-3,.g-side{grid-template-columns:1fr;}
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0;}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .card-h h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card-h h3 .msym{color:var(--accent2);font-size:19px;}
  .card-h .sub{font-size:11px;color:var(--dim);}

  .kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0;position:relative;overflow:hidden;}
  .kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.18),transparent 70%);}
  .kpi .klabel{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .kpi .klabel .msym{font-size:16px;color:var(--accent2);}
  .kpi .kval{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:.5px;line-height:1;}
  .kpi .kval small{font-size:13px;font-weight:600;color:var(--muted);}
  .kpi .kfoot{font-size:11px;margin-top:7px;display:flex;align-items:center;gap:5px;}
  .up{color:var(--good);} .down{color:var(--bad);} .flat{color:var(--muted);}

  .chart{width:100%;overflow:hidden;}

  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
  th{text-align:left;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.4px;white-space:nowrap;background:var(--panel2);}
  td{padding:10px 12px;border-bottom:1px solid #262019;color:var(--txt);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(251,146,60,.05);}

  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .c-good{background:rgba(52,211,153,.15);color:var(--good);}
  .c-warn{background:rgba(251,191,36,.15);color:var(--warn);}
  .c-bad{background:rgba(248,113,113,.15);color:var(--bad);}
  .c-info{background:rgba(96,165,250,.15);color:var(--info);}

  .bar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;min-width:60px;}
  .bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

  .mtx-wrap{overflow-x:auto;}
  .mtx{border-collapse:separate;border-spacing:4px;min-width:560px;}
  .mtx th{background:transparent;border:none;padding:6px 8px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;}
  .mtx th.rowh{text-align:left;}
  .mtx td{border:none;padding:0;}
  .cell{width:44px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .cell.name{width:auto;justify-content:flex-start;color:var(--txt);font-weight:600;font-size:12.5px;padding-left:4px;background:transparent;white-space:nowrap;}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:820px){.board{grid-template-columns:1fr;}}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0;}
  .col > h4{margin:0 0 10px;font-size:12px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);}
  .col > h4 .n{background:var(--panel);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--accent3);}
  .task{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:9px 11px;margin-bottom:9px;}
  .task:last-child{margin-bottom:0;}
  .task .t{font-size:12.5px;font-weight:700;}
  .task .m{font-size:11px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:5px 10px;}
  .task .m span{display:inline-flex;align-items:center;gap:3px;min-width:0;}
  .task .m .msym{font-size:13px;}

  .tl{position:relative;padding-left:22px;}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl-item{position:relative;padding:0 0 16px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent);}
  .tl-item .th{font-size:12.5px;font-weight:700;}
  .tl-item .tt{font-size:11px;color:var(--dim);margin-bottom:2px;}
  .tl-item .td{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .certs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:820px){.certs{grid-template-columns:1fr;}}
  .cert{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;position:relative;}
  .cert .badge{position:absolute;right:12px;top:12px;}
  .cert .cn{font-size:13px;font-weight:800;padding-right:64px;}
  .cert .cw{font-size:11px;color:var(--muted);margin-top:3px;}
  .cert .row{display:flex;justify-content:space-between;font-size:11.5px;margin-top:11px;color:var(--muted);gap:8px;}
  .cert .row b{color:var(--txt);font-weight:700;text-align:right;}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-top:10px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}

  @media(max-width:560px){
    .nav button .lbl{display:none;}
    .nav button{padding:9px 12px;}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="msym">verified</span></div>
    <div class="brand-txt">
      <h1>人員訓練資格管理</h1>
      <p>Training &amp; Competency Management · 訓練能力控制台</p>
    </div>
    <div class="brand-spacer"></div>
    <div class="status-pill"><span class="dot"></span>作業班 · 即時同步</div>
  </div>
  <nav class="nav" id="nav">
    <button data-i="0" class="on"><span class="msym">account_tree</span><span class="lbl">能力矩陣</span></button>
    <button data-i="1"><span class="msym">calendar_month</span><span class="lbl">訓練排課</span></button>
    <button data-i="2"><span class="msym">fact_check</span><span class="lbl">訓練執行</span></button>
    <button data-i="3"><span class="msym">checklist</span><span class="lbl">測驗評核</span></button>
    <button data-i="4"><span class="msym">verified</span><span class="lbl">資格認證</span></button>
    <button data-i="5"><span class="msym">shield</span><span class="lbl">稽核合規</span></button>
  </nav>
</header>

<main id="app"></main>

<script>
(function(){
  "use strict";
  var app = document.getElementById("app");
  var charts = [];

  function killCharts(){
    for(var i=0;i<charts.length;i++){ try{ charts[i].dispose(); }catch(e){} }
    charts = [];
  }
  function mkChart(id, opt){
    var el = document.getElementById(id);
    if(!el) return;
    var c = echarts.init(el);
    c.setOption(opt);
    charts.push(c);
  }
  var AX = "#a8a29e", GRID = "#3a332e", LBL = "#f5f1ed";
  function grid(o){ return Object.assign({left:8,right:14,top:26,bottom:8,containLabel:true}, o||{}); }

  function kpi(label, icon, val, unit, foot, cls){
    return '<div class="kpi"><div class="klabel"><span class="msym">'+icon+'</span>'+label+'</div>'+
      '<div class="kval">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
      '<div class="kfoot '+(cls||'flat')+'">'+foot+'</div></div>';
  }
  function head(icon,title,tag,desc){
    return '<div class="screen-head"><h2><span class="msym">'+icon+'</span>'+title+
      (tag?' <span class="tag">'+tag+'</span>':'')+'</h2><p>'+desc+'</p></div>';
  }

  /* ============ SCREEN 0 · 能力矩陣 ============ */
  function s0(){
    var people = [
      {n:"陳志明", role:"CNC 加工 A班", sk:[3,2,3,1,2]},
      {n:"林淑芬", role:"品檢 B班", sk:[2,3,3,3,1]},
      {n:"黃國華", role:"焊接 A班", sk:[3,3,2,2,3]},
      {n:"張美玲", role:"組裝 C班", sk:[1,2,3,2,2]},
      {n:"吳建志", role:"CNC 加工 B班", sk:[2,1,2,3,3]},
      {n:"劉家豪", role:"焊接 B班", sk:[3,2,1,2,1]}
    ];
    var skills = ["設備操作","品質判定","安全規範","治具校正","異常排除"];
    var lvColor = {0:"#3a332e",1:"#7c2d12",2:"#c2410c",3:"#fb923c"};
    var lvTxt = {0:"—",1:"L1",2:"L2",3:"L3"};

    var mtx = '<div class="mtx-wrap"><table class="mtx"><thead><tr><th class="rowh">人員 / 技能項目</th>';
    for(var s=0;s<skills.length;s++){ mtx += '<th>'+skills[s]+'</th>'; }
    mtx += '</tr></thead><tbody>';
    for(var p=0;p<people.length;p++){
      var row = people[p];
      mtx += '<tr><td><div class="cell name">'+row.n+'<span style="color:var(--dim);font-weight:400;margin-left:6px;font-size:11px">'+row.role+'</span></div></td>';
      for(var k=0;k<row.sk.length;k++){
        var lv = row.sk[k];
        mtx += '<td><div class="cell" style="background:'+lvColor[lv]+';color:'+(lv>=2?'#0c0a09':'#a8a29e')+'">'+lvTxt[lv]+'</div></td>';
      }
      mtx += '</tr>';
    }
    mtx += '</tbody></table></div>'+
      '<div class="legend">'+
      '<span><i class="sw" style="background:#3a332e"></i>未具備</span>'+
      '<span><i class="sw" style="background:#7c2d12"></i>L1 認知</span>'+
      '<span><i class="sw" style="background:#c2410c"></i>L2 可獨立</span>'+
      '<span><i class="sw" style="background:#fb923c"></i>L3 可帶訓</span>'+
      '</div>';

    app.innerHTML =
      head("account_tree","能力矩陣","STAGE v0","比對崗位技能需求與人員能力現況，標示技能缺口與待補訓人員，作為本期訓練需求分析依據。")+
      '<div class="g-kpi">'+
        kpi("受評人員","groups","148","人","涵蓋 6 個作業班","flat")+
        kpi("技能缺口項","warning","37","項","需優先補訓","down")+
        kpi("平均達標率","insights","74","%","目標 85%","up")+
        kpi("可帶訓人數","military_tech","22","人","L3 認證師傅","up")+
      '</div>'+
      '<div class="g-3">'+
        '<div class="card"><div class="card-h"><h3><span class="msym">grid_view</span>崗位能力對照矩陣</h3><span class="sub">評核基準：JVISION-SKL-2026</span></div>'+mtx+'</div>'+
        '<div class="card"><div class="card-h"><h3><span class="msym">insights</span>各技能達標分布</h3></div><div id="c0a" class="chart" style="height:280px"></div></div>'+
      '</div>';

    void app.offsetHeight;

    mkChart("c0a",{
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
      legend:{data:["已達標","待補訓"],textStyle:{color:LBL},bottom:0},
      grid:grid({bottom:34}),
      xAxis:{type:"value",axisLabel:{color:AX},splitLine:{lineStyle:{color:GRID}},axisLine:{lineStyle:{color:GRID}}},
      yAxis:{type:"category",data:skills,axisLabel:{color:AX},axisLine:{lineStyle:{color:GRID}}},
      series:[
        {name:"已達標",type:"bar",stack:"t",data:[112,98,131,86,74],itemStyle:{color:"#c2410c"}},
        {name:"待補訓",type:"bar",stack:"t",data:[36,50,17,62,74],itemStyle:{color:"#3a332e"}}
      ]
    });
  }

  /* ============ SCREEN 1 · 訓練排課 ============ */
  function s1(){
    var cols = [
      {t:"待安排",n:2,tasks:[
        {t:"CNC 精度校正實作",m:[["schedule","09/02"],["person","講師未確認"],["meeting_room","教室 A-201"]]},
        {t:"堆高機作業安全",m:[["schedule","09/05"],["groups","報名 6 / 12"],["warning","人數不足"]]}
      ]},
      {t:"已排定",n:3,tasks:[
        {t:"焊接 WPS 標準作業",m:[["schedule","08/26 13:30"],["person","王世昌 師傅"],["meeting_room","實作區 W-1"]]},
        {t:"品質異常判定",m:[["schedule","08/28 09:00"],["person","李佩珊"],["meeting_room","教室 A-105"]]},
        {t:"5S 現場管理",m:[["schedule","08/29 15:00"],["person","陳冠廷"],["meeting_room","教室 B-302"]]}
      ]},
      {t:"衝突待處理",n:1,tasks:[
        {t:"治具校正進階",m:[["schedule","09/03 10:00"],["meeting_room","教室 A-201 衝突"],["error","與精度課同時段"]]}
      ]}
    ];
    var board = '<div class="board">';
    for(var i=0;i<cols.length;i++){
      board += '<div class="col"><h4>'+cols[i].t+'<span class="n">'+cols[i].n+'</span></h4>';
      for(var j=0;j<cols[i].tasks.length;j++){
        var tk = cols[i].tasks[j];
        board += '<div class="task"><div class="t">'+tk.t+'</div><div class="m">';
        for(var m=0;m<tk.m.length;m++){ board += '<span><span class="msym">'+tk.m[m][0]+'</span>'+tk.m[m][1]+'</span>'; }
        board += '</div></div>';
      }
      board += '</div>';
    }
    board += '</div>';

    app.innerHTML =
      head("calendar_month","訓練排課","STAGE v1","依訓練需求安排課程、講師與教室資源，即時偵測教室衝突與開班人數門檻，符合開課三日內衝突優先原則。")+
      '<div class="g-kpi">'+
        kpi("本週開課","event_available","9","場","含 3 場實作","flat")+
        kpi("教室衝突","error","1","件","需重新排定","down")+
        kpi("講師到位率","how_to_reg","92","%","1 名待確認","up")+
        kpi("平均報名率","groups","78","%","門檻 8 人/班","up")+
      '</div>'+
      '<div class="g-3">'+
        '<div class="card"><div class="card-h"><h3><span class="msym">view_kanban</span>排課看板</h3><span class="sub">8/25 週</span></div>'+board+'</div>'+
        '<div class="card"><div class="card-h"><h3><span class="msym">meeting_room</span>教室使用時段</h3></div><div id="c1a" class="chart" style="height:300px"></div></div>'+
      '</div>';

    void app.offsetHeight;

    mkChart("c1a",{
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
      legend:{data:["A-201","W-1","B-302"],textStyle:{color:LBL},bottom:0},
      grid:grid({bottom:34}),
      xAxis:{type:"category",data:["週一","週二","週三","週四","週五"],axisLabel:{color:AX},axisLine:{lineStyle:{color:GRID}}},
      yAxis:{type:"value",name:"時數",nameTextStyle:{color:AX},axisLabel:{color:AX},splitLine:{lineStyle:{color:GRID}},axisLine:{lineStyle:{color:GRID}}},
      series:[
        {name:"A-201",type:"bar",stack:"h",data:[4,6,3,5,2],itemStyle:{color:"#c2410c"}},
        {name:"W-1",type:"bar",stack:"h",data:[3,0,4,2,3],itemStyle:{color:"#fb923c"}},
        {name:"B-302",type:"bar",stack:"h",data:[2,3,2,0,4],itemStyle:{color:"#fdba74"}}
      ]
    });
  }

  /* ============ SCREEN 2 · 訓練執行 ============ */
  function s2(){
    var rows = [
      {n:"陳志明",c:"焊接 WPS 標準作業",att:"已簽到",hr:"6.0",st:"good",note:"—"},
      {n:"林淑芬",c:"品質異常判定",att:"已簽到",hr:"3.5",st:"good",note:"—"},
      {n:"黃國華",c:"焊接 WPS 標準作業",att:"遲到",hr:"5.0",st:"warn",note:"補足 1 小時"},
      {n:"張美玲",c:"5S 現場管理",att:"缺席",hr:"0.0",st:"bad",note:"連續第 2 次"},
      {n:"吳建志",c:"品質異常判定",att:"已簽到",hr:"3.5",st:"good",note:"—"},
      {n:"劉家豪",c:"5S 現場管理",att:"缺席",hr:"0.0",st:"bad",note:"待補訓"},

  window.addEventListener("resize", function(){
    for(var i=0;i<charts.length;i++){ try{ charts[i].resize(); }catch(e){} }
