<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CPQ 配置報價系統｜Configure-Price-Quote</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#a16207; --accent2:#eab308; --accent-soft:#fef9e7;
  --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#faf8f4; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0369a1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
h1,h2,h3,h4{margin:0;}
button{font-family:inherit;cursor:pointer;}

.topbar{
  position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#78500a,#a16207);
  color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 2px 14px rgba(120,80,10,.25);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:11px;background:var(--accent2);color:#5a3a00;
  display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.brand .txt{min-width:0;}
.brand .txt b{font-size:15px;font-weight:800;display:block;letter-spacing:.5px;}
.brand .txt span{font-size:11px;opacity:.82;}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{
  border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;
  padding:8px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  transition:.15s;flex:none;white-space:nowrap;
}
.nav button:hover{background:rgba(255,255,255,.24);}
.nav button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15);}
.nav button .material-symbols-outlined{font-size:19px;}

main{max-width:1240px;margin:0 auto;padding:22px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.screen-head .st{min-width:0;}
.screen-head h2{font-size:21px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:9px;}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.screen-head p{color:var(--muted);font-size:13px;margin:3px 0 0;}
.pill{
  margin-left:auto;background:var(--accent-soft);color:#7a4d06;border:1px solid #f5e6b8;
  padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;
}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.card-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:12px;}
.card-h .material-symbols-outlined{color:var(--accent);font-size:20px;}
.card-h .sub{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px;}

.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.grid>*{min-width:0;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2);}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.5px;font-family:"Inter";}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:12px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:3px;}
.kpi .delta.up{color:var(--ok);}
.kpi .delta.down{color:var(--bad);}
.kpi .delta .material-symbols-outlined{font-size:16px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#faf6ec;color:#7a5a1a;font-weight:700;font-size:12px;position:sticky;top:0;}
tbody tr:hover{background:#fdfbf4;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Inter";}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag.ok{background:#dcfce7;color:#15803d;}
.tag.warn{background:#fef3c7;color:#b45309;}
.tag.bad{background:#fee2e2;color:#b91c1c;}
.tag.info{background:#e0f2fe;color:#075985;}
.tag.gray{background:#f5f5f4;color:#57534e;}
.tag.gold{background:#fef9e7;color:#7a4d06;border:1px solid #f5e6b8;}

.chart-wrap{position:relative;width:100%;overflow:hidden;}

.bar{height:8px;border-radius:5px;background:#efece5;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

.cfg{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;min-width:0;}
@media(max-width:820px){.cfg{grid-template-columns:1fr;}}
.opt-group{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:11px;}
.opt-group .gh{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.opt-group .gh .material-symbols-outlined{font-size:18px;color:var(--accent);}
.opt-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;border:1px solid transparent;font-size:13px;}
.opt-row.sel{background:var(--accent-soft);border-color:#f0dfa8;}
.opt-row.dis{opacity:.5;}
.opt-row .dot{width:15px;height:15px;border-radius:50%;border:2px solid #cbb56a;flex:none;}
.opt-row.sel .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff;}
.opt-row .nm{flex:1;min-width:0;}
.opt-row .pr{font-weight:700;color:#7a5a1a;font-variant-numeric:tabular-nums;}

.compat{border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
.compat-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.compat-item:last-child{border-bottom:none;}
.compat-item .material-symbols-outlined{font-size:19px;flex:none;margin-top:1px;}
.compat-item.pass .material-symbols-outlined{color:var(--ok);}
.compat-item.block .material-symbols-outlined{color:var(--bad);}
.compat-item.note .material-symbols-outlined{color:var(--warn);}
.compat-item .ci-t{font-weight:700;}
.compat-item .ci-d{color:var(--muted);font-size:12px;}

.ladder{display:flex;flex-direction:column;gap:8px;}
.lad-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:13px;}
.lad-row.act{border-color:var(--accent);background:var(--accent-soft);}
.lad-row .qty{font-weight:700;width:110px;flex:none;}
.lad-row .dsc{flex:1;color:var(--muted);min-width:0;}
.lad-row .fin{font-weight:800;color:#7a4d06;font-variant-numeric:tabular-nums;white-space:nowrap;}

.pricebox{border:2px solid var(--accent2);border-radius:14px;padding:15px 16px;background:linear-gradient(160deg,#fffdf6,#fef9e7);}
.pline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px dashed #ecdfb4;}
.pline:last-child{border-bottom:none;}
.pline .k{color:var(--muted);min-width:0;}
.pline .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pline.total{margin-top:6px;padding-top:11px;border-top:2px solid #eab30855;border-bottom:none;}
.pline.total .k{font-weight:800;color:var(--ink);font-size:14px;}
.pline.total .v{font-size:22px;font-weight:900;color:#7a4d06;}

.bom-row{display:grid;grid-template-columns:1fr 66px 66px 110px 76px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;}
.bom-row.head{background:#faf6ec;color:#7a5a1a;font-weight:700;font-size:12px;border-radius:8px 8px 0 0;}
.bom-row .nmc{display:flex;align-items:center;gap:7px;min-width:0;}
.bom-row .nmc .material-symbols-outlined{font-size:17px;color:var(--accent);flex:none;}
.bom-row.lv2 .nmc{padding-left:22px;}
.bom-row.lv2 .nmc .material-symbols-outlined{color:#b08d3a;font-size:15px;}
.bom-row .rn{text-align:right;font-variant-numeric:tabular-nums;}
.bom-mini{overflow-x:auto;}
.bom-mini .bom-min{min-width:520px;}

.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px;}
.tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
.tl-item.done::before{background:var(--accent);border-color:var(--accent);}
.tl-item.wait::before{border-color:#d6d3d1;}
.tl-item .tt{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tl-item .tm{color:var(--muted);font-size:12px;margin-top:2px;}

.quote-doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.qd-head{background:linear-gradient(100deg,#78500a,#a16207);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.qd-head .qt{font-weight:800;font-size:16px;letter-spacing:.5px;}
.qd-head .qn{font-size:12px;opacity:.85;}
.qd-body{padding:14px 16px;}
.qd-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:600px){.qd-meta{grid-template-columns:1fr 1fr;}}
.qd-meta .m{font-size:12px;}
.qd-meta .m .k{color:var(--muted);}
.qd-meta .m .v{font-weight:700;margin-top:2px;}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

.hint{font-size:12px;color:var(--muted);display:flex;align-items:flex-start;gap:6px;margin-top:10px;}
.hint .material-symbols-outlined{font-size:16px;color:var(--accent);flex:none;}

@media(max-width:560px){
  .nav button .lbl{display:none;}
  .nav button{padding:8px 10px;}
  .pill{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo material-symbols-outlined">request_quote</div>
    <div class="txt">
      <b>CPQ 配置報價系統</b>
      <span>Configure · Price · Quote ｜ 智慧製造客製化報價平台</span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="view"></main>

<script>
"use strict";
var CH = [];

var NAVS = [
  {i:0,ic:"dashboard",t:"報價總覽"},
  {i:1,ic:"account_tree",t:"規格配置"},
  {i:2,ic:"rule",t:"自動定價"},
  {i:3,ic:"inventory_2",t:"BOM 成本"},
  {i:4,ic:"request_quote",t:"報價核准"},
  {i:5,ic:"insights",t:"成效分析"}
];

function buildNav(){
  var nav = document.getElementById("nav");
  var html = "";
  for(var k=0;k<NAVS.length;k++){
    var n = NAVS[k];
    html += '<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
  }
  nav.innerHTML = html;
}

function fmt(x){ return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,","); }

var QUOTES = [
  {no:"Q-26081", cust:"O運精密工業", prod:"CNC-820 五軸加工中心", amt:4820000, margin:22, stage:"核准中", tag:"warn", eta:"08/16", owner:"林嘉偉"},
  {no:"Q-26080", cust:"台O捷特科技", prod:"AGV-300 搬運系統", amt:1960000, margin:31, stage:"配置中", tag:"info", eta:"08/18", owner:"陳思穎"},
  {no:"Q-26079", cust:"永O自動化", prod:"ROB-6 六軸機械手", amt:3380000, margin:18, stage:"待客戶確認", tag:"gold", eta:"08/15", owner:"林嘉偉"},
  {no:"Q-26078", cust:"O達智造", prod:"CNC-620 三軸銑床", amt:1240000, margin:27, stage:"已成交", tag:"ok", eta:"—", owner:"黃柏睿"},
  {no:"Q-26077", cust:"O發動力", prod:"LINE-A 組裝產線", amt:8650000, margin:15, stage:"核准中", tag:"warn", eta:"08/17", owner:"陳思穎"},
  {no:"Q-26076", cust:"O鴻電子", prod:"AGV-300 搬運系統", amt:2110000, margin:29, stage:"配置中", tag:"info", eta:"08/19", owner:"黃柏睿"},
  {no:"Q-26075", cust:"O山機械", prod:"ROB-6 六軸機械手", amt:3020000, margin:12, stage:"待議價", tag:"bad", eta:"08/14", owner:"林嘉偉"}
];

/* ---------- screen 0 ---------- */
function screen0(){
  var kpis = [
    {lab:"在辦報價",ic:"description",val:"37",unit:"件",d:"+6 較上週",up:true},
    {lab:"平均報價時效",ic:"schedule",val:"6.2",unit:"小時",d:"-3.1h 較上月",up:true},
    {lab:"配置錯誤率",ic:"rule",val:"1.8",unit:"%",d:"-2.4% 較上月",up:true},
    {lab:"本月報價金額",ic:"payments",val:"48.2",unit:"百萬",d:"+11% 達成率",up:true}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    kh += '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div>'
      +'<div class="val">'+k.val+'<small>'+k.unit+'</small></div>'
      +'<div class="delta '+(k.up?'up':'down')+'"><span class="material-symbols-outlined">'+(k.up?'trending_up':'trending_down')+'</span>'+k.d+'</div></div>';
  }
  var rows="";
  for(var q=0;q<QUOTES.length;q++){var r=QUOTES[q];
    rows += '<tr><td><b>'+r.no+'</b></td><td>'+r.cust+'</td><td>'+r.prod+'</td>'
      +'<td class="num">'+fmt(r.amt)+'</td>'
      +'<td class="num">'+r.margin+'%</td>'
      +'<td><span class="tag '+r.tag+'">'+r.stage+'</span></td>'
      +'<td>'+r.eta+'</td><td>'+r.owner+'</td></tr>';
  }
  return ''
  + head("dashboard","報價總覽儀表板","業務進辦公室第一眼：在辦報價、時效、配置錯誤率與金額達成，並掌握需優先跟進的案件","業務部")
  + '<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'
  + '<div class="grid g23" style="margin-bottom:14px">'
    + '<div class="card"><div class="card-h"><span class="material-symbols-outlined">stacked_bar_chart</span>近 6 週報價量與成交量<span class="sub">件 / 週</span></div><div class="chart-wrap" style="height:260px"><canvas id="c0a"></canvas></div></div>'
    + '<div class="card"><div class="card-h"><span class="material-symbols-outlined">donut_large</span>報價階段分布<span class="sub">共 37 件</span></div><div class="chart-wrap" style="height:260px"><canvas id="c0b"></canvas></div></div>'
  + '</div>'
  + '<div class="card pad0"><div class="card-h" style="padding:16px 17px 0">'
    + '<span class="material-symbols-outlined">list_alt</span>在辦報價清單<span class="sub">依交期排序 · 可進入規格配置引擎</span></div>'
    + '<div style="overflow-x:auto;padding:12px 8px 6px"><table><thead><tr><th>報價單號</th><th>客戶</th><th>產品</th><th class="num">金額(NT$)</th><th class="num">毛利率</th><th>階段</th><th>需回覆</th><th>負責業務</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function chart0(){
  var a=document.getElementById("c0a");
  if(a) CH.push(new Chart(a,{type:"bar",data:{
    labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
    datasets:[
      {label:"報價量",data:[28,31,26,34,30,37],backgroundColor:"#eab308",borderRadius:5,barPercentage:.62},
      {label:"成交量",data:[9,11,10,13,12,15],backgroundColor:"#a16207",borderRadius:5,barPercentage:.62}
    ]},options:barOpt()}));
  var b=document.getElementById("c0b");
  if(b) CH.push(new Chart(b,{type:"doughnut",data:{
    labels:["配置中","核准中","待客戶確認","待議價","已成交"],
    datasets:[{data:[9,7,8,4,9],backgroundColor:["#eab308","#d97706","#f6d24b","#dc2626","#a16207"],borderWidth:2,borderColor:"#fff"}]
  },options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{family:"Inter",size:11}}}}}}));
}

/* ---------- screen 1 ---------- */
function screen1(){
  var groups=[
    {t:"機型基座",ic:"precision_manufacturing",opts:[
      {n:"CNC-820 五軸機頭",p:"標配",sel:true},
      {n:"CNC-820L 加長行程",p:"+ 480,000",sel:false},
      {n:"CNC-820H 高剛性主軸座",p:"+ 720,000",sel:false}
    ]},
    {t:"主軸與轉速",ic:"bolt",opts:[
      {n:"12,000 rpm 標準主軸",p:"標配",sel:false},
      {n:"18,000 rpm 高速主軸",p:"+ 350,000",sel:true},
      {n:"24,000 rpm 陶瓷軸承",p:"+ 610,000",sel:false,dis:true}
    ]},
    {t:"控制系統",ic:"memory",opts:[
      {n:"FANUC 0i-MF",p:"標配",sel:false},
      {n:"FANUC 31i-B5 五軸聯動",p:"+ 280,000",sel:true},
      {n:"Siemens 840D sl",p:"+ 330,000",sel:false}
    ]},
    {t:"自動化選配",ic:"conveyor_belt",opts:[
      {n:"自動換刀 24 刀庫",p:"+ 150,000",sel:true},
      {n:"料件自動上下料 APC",p:"+ 520,000",sel:false},
      {n:"線上量測探頭",p:"+ 190,000",sel:true}
    ]}
  ];
  var gh="";
  for(var g=0;g<groups.length;g++){var G=groups[g];
    var rows="";
    for(var o=0;o<G.opts.length;o++){var O=G.opts[o];
      rows += '<div class="opt-row '+(O.sel?'sel':'')+' '+(O.dis?'dis':'')+'"><span class="dot"></span><span class="nm">'+O.n+(O.dis?' <span class="tag bad" style="margin-left:4px">相容衝突</span>':'')+'</span><span class="pr">'+O.p+'</span></div>';
    }
    gh += '<div class="opt-group"><div class="gh"><span class="material-symbols-outlined">'+G.ic+'</span>'+G.t+'</div>'+rows+'</div>';
  }
  var checks=[
    {c:"pass",ic:"check_circle",t:"18,000 rpm 主軸 + 線上量測探頭",d:"組合相容，量測精度 ±0.003mm 可達成"},

function destroyCharts(){
  for(var i=0;i<CH.length;i++){ try{ CH[i].destroy(); }catch(e){} }
  CH=[];
}

function show(i){
  var view=document.getElementById("view");
  destroyCharts();
  view.innerHTML = SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on", (+btns[b].getAttribute("data-i"))===i);
  }
  void view.offsetHeight;
  if(CHARTS[i]) CHARTS[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
