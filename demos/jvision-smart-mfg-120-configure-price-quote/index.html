<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>業務產品配置與報價管理｜Configure-Price-Quote</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#1d4ed8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased
}
button,a,[role=button]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.mono,.num,.val,.pr,.fin,.v,.qn,td:first-child{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:24px;
  padding:12px max(18px,calc((100vw - 1240px)/2));
  color:#fff;
  background:#1746a2;
  border-bottom:4px solid var(--color-primary)
}
.brand{display:flex;align-items:center;gap:11px;min-width:270px}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:2px solid #93c5fd;
  border-radius:8px
}
.brand b{display:block;font-size:15px;letter-spacing:.03em}
.brand small{display:block;margin-top:1px;color:#dbeafe;font-size:11px}
.nav{display:flex;justify-content:flex-end;gap:5px;margin-left:auto}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:7px;
  color:#dbeafe;
  background:transparent;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.nav button:hover{color:#fff;background:#2563eb}
.nav button.on{color:#0f172a;background:#fff;border-color:#bfdbfe}
main{max-width:1240px;margin:auto;padding:26px 18px 56px}
.screen{animation:screen-in .38s cubic-bezier(.2,.85,.25,1) both}
.screen-head{
  display:flex;
  align-items:flex-end;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:15px;
  border-bottom:2px solid var(--line)
}
.screen-head .st{min-width:0}
.screen-head h1{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  font-size:23px;
  line-height:1.25;
  letter-spacing:.01em
}
.screen-head h1 .material-symbols-outlined{font-size:27px;color:var(--blue)}
.screen-head p{max-width:850px;margin:5px 0 0;color:var(--muted)}
.pill{
  margin-left:auto;
  padding:6px 11px;
  border:1px solid #bfdbfe;
  border-radius:6px;
  color:#1e40af;
  background:#eff6ff;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:600;
  white-space:nowrap
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:10px
}
.card{padding:16px}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:13px;
  color:#172554;
  font-weight:700
}
.card-h .material-symbols-outlined{color:var(--blue)}
.card-h .sub{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.kpi{
  position:relative;
  overflow:hidden;
  padding:15px 16px 14px;
  border-top:4px solid var(--blue)
}
.kpi:nth-child(2n){border-top-color:var(--color-accent)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{margin-top:7px;font-size:27px;font-weight:700;line-height:1.2}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px}
.delta{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:600}
.delta .material-symbols-outlined{font-size:16px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.table-wrap{overflow-x:auto;padding:10px 8px 7px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{
  color:#1e3a8a;
  background:var(--color-muted);
  font-size:12px;
  font-weight:700
}
td.num,th.num{text-align:right}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:#f8fbff}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{color:#047857;background:#ecfdf5}
.tag.warn{color:#92400e;background:#fffbeb}
.tag.bad{color:#b91c1c;background:#fef2f2}
.tag.info{color:#1d4ed8;background:#eff6ff}
.tag.gray{color:#475569;background:#f8fafc}
.tag.gold{color:#166534;background:#f0fdf4}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.cfg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.opt-group{margin-bottom:11px;padding:12px;border:1px solid var(--line);border-radius:8px}
.opt-group:last-child{margin-bottom:0}
.gh{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:13px;font-weight:700}
.gh .material-symbols-outlined{color:var(--blue);font-size:18px}
.opt-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:38px;
  padding:7px 9px;
  border:1px solid transparent;
  border-radius:6px
}
.opt-row.sel{border-color:#93c5fd;background:#eff6ff}
.opt-row.dis{color:#64748b;background:#f8fafc}
.dot{width:16px;height:16px;flex:none;border:2px solid #64748b;border-radius:50%}
.sel .dot{background:var(--blue);border:4px solid #dbeafe}
.nm{min-width:0;flex:1}
.pr{color:#1e40af;font-size:12px;font-weight:600;white-space:nowrap}
.compat{border:1px solid var(--line);border-radius:8px;padding:4px 12px}
.compat-item{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.compat-item:last-child{border:0}
.compat-item .material-symbols-outlined{flex:none;margin-top:2px}
.compat-item.pass .material-symbols-outlined{color:var(--ok)}
.compat-item.block .material-symbols-outlined{color:var(--bad)}
.compat-item.note .material-symbols-outlined{color:var(--warn)}
.ci-t{font-weight:700}
.ci-d{color:var(--muted);font-size:12px}
.hint{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:10px;
  color:var(--muted);
  font-size:12px
}
.hint .material-symbols-outlined{flex:none;color:var(--blue);font-size:17px}
.ladder{display:flex;flex-direction:column;gap:8px}
.lad-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:7px
}
.lad-row.act{border:2px solid var(--blue);background:#eff6ff}
.qty{width:104px;flex:none;font-weight:700}
.dsc{min-width:0;flex:1;color:var(--muted)}
.fin{color:#1e40af;font-size:12px;font-weight:700;white-space:nowrap}
.pricebox{padding:14px 16px;border:2px solid #93c5fd;border-radius:8px;background:#f8fbff}
.pline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.pline:last-child{border:0}
.pline .k{color:var(--muted)}
.pline .v{font-weight:600;white-space:nowrap}
.pline.total{margin-top:6px;padding-top:12px;border-top:2px solid var(--blue)}
.pline.total .k{color:var(--ink);font-weight:700}
.pline.total .v{color:#1d4ed8;font-size:20px;font-weight:700}
.bom-mini{overflow-x:auto}
.bom-min{min-width:540px}
.bom-row{display:grid;grid-template-columns:1fr 65px 65px 112px 76px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line)}
.bom-row.head{color:#1e3a8a;background:var(--color-muted);font-size:12px;font-weight:700}
.nmc{display:flex;align-items:center;gap:7px;min-width:0}
.nmc .material-symbols-outlined{color:var(--blue);font-size:17px}
.lv2 .nmc{padding-left:22px}
.rn{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.timeline{position:relative;padding-left:27px}
.timeline::before{content:"";position:absolute;left:9px;top:5px;bottom:8px;width:2px;background:#cbd5e1}
.tl-item{position:relative;padding-bottom:17px}
.tl-item::before{
  content:"";
  position:absolute;
  left:-23px;
  top:3px;
  width:11px;
  height:11px;
  border:3px solid #94a3b8;
  border-radius:50%;
  background:#fff
}
.tl-item.done::before{border-color:var(--ok);background:var(--ok)}
.tl-item.wait::before{border-color:var(--warn)}
.tt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:700}
.tm{margin-top:2px;color:var(--muted);font-size:12px}
.quote-doc{overflow:hidden;border-radius:9px}
.qd-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:15px 16px;
  color:#fff;
  background:#1e40af
}
.qt{font-size:16px;font-weight:700;letter-spacing:.04em}
.qn{margin-top:2px;color:#dbeafe;font-size:11px}
.qd-body{padding:15px 16px}
.qd-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qd-meta .k{color:var(--muted);font-size:12px}
.qd-meta .v{margin-top:2px;font-size:12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:2px}
.bar{height:8px;overflow:hidden;border-radius:3px;background:#e2e8f0}
.bar i{display:block;height:100%;background:var(--color-accent)}
.approver{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.approver .material-symbols-outlined{color:var(--blue);font-size:22px}
.approver-info{min-width:0;flex:1}
.approver-info b{display:block}
.approver-info small{color:var(--muted)}
@keyframes screen-in{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:980px){
  .topbar{align-items:flex-start}
  .nav{overflow-x:auto;justify-content:flex-start;width:100%;margin:0;padding-bottom:2px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32,.cfg{grid-template-columns:1fr}
}
@media(max-width:560px){
  main{padding:20px 12px 44px}
  .topbar{padding:10px 12px}
  .brand{min-width:0}
  .brand small{white-space:normal}
  .nav button{min-width:43px;justify-content:center}
  .nav .lbl{display:none}
  .g4{grid-template-columns:1fr}
  .screen-head{align-items:flex-start}
  .screen-head h1{font-size:20px}
  .pill{display:none}
  .card{padding:13px}
  .qd-meta{grid-template-columns:1fr 1fr}
  .lad-row{align-items:flex-start;flex-wrap:wrap}
  .fin{margin-left:auto}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  .screen{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo material-symbols-outlined" aria-hidden="true">request_quote</div>
    <div>
      <b>業務產品配置與報價管理</b>
      <small>Configure · Price · Quote｜智慧製造客製化報價平台</small>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main id="view"></main>
<script>
"use strict";
var CH=[];
var NAVS=[
  {i:0,ic:"dashboard",t:"報價總覽"},
  {i:1,ic:"account_tree",t:"規格配置"},
  {i:2,ic:"rule",t:"自動定價"},
  {i:3,ic:"inventory_2",t:"BOM 成本"},
  {i:4,ic:"request_quote",t:"報價核准"},
  {i:5,ic:"insights",t:"成效分析"}
];
var QUOTES=[
  {no:"Q-26081",cust:"O運精密工業",prod:"CNC-820 五軸加工中心",amt:4820000,margin:22,stage:"核准中",tag:"warn",eta:"08/16",owner:"林嘉偉"},
  {no:"Q-26080",cust:"台O捷特科技",prod:"AGV-300 搬運系統",amt:1960000,margin:31,stage:"配置中",tag:"info",eta:"08/18",owner:"陳思穎"},
  {no:"Q-26079",cust:"永O自動化",prod:"ROB-6 六軸機械手",amt:3380000,margin:18,stage:"待客戶確認",tag:"gold",eta:"08/15",owner:"林嘉偉"},
  {no:"Q-26078",cust:"O達智造",prod:"CNC-620 三軸銑床",amt:1240000,margin:27,stage:"已成交",tag:"ok",eta:"—",owner:"黃柏睿"},
  {no:"Q-26077",cust:"O發動力",prod:"LINE-A 組裝產線",amt:8650000,margin:15,stage:"核准中",tag:"warn",eta:"08/17",owner:"陳思穎"},
  {no:"Q-26076",cust:"O鴻電子",prod:"AGV-300 搬運系統",amt:2110000,margin:29,stage:"配置中",tag:"info",eta:"08/19",owner:"黃柏睿"},
  {no:"Q-26075",cust:"O山機械",prod:"ROB-6 六軸機械手",amt:3020000,margin:12,stage:"待議價",tag:"bad",eta:"08/14",owner:"林嘉偉"}
];
function icon(x){return '<span class="material-symbols-outlined" aria-hidden="true">'+x+'</span>'}
function fmt(x){return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function head(ic,title,desc,pill){
  return '<div class="screen-head"><div class="st"><h1>'+icon(ic)+title+'</h1><p>'+desc+'</p></div><div class="pill">'+pill+'</div></div>'
}
function tag(text,type){return '<span class="tag '+type+'">'+text+'</span>'}
function pline(k,v){return '<div class="pline"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function qm(k,v){return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function kpi(ic,lab,val,unit,delta,type){
  return '<div class="kpi grid-item"><div class="lab">'+icon(ic)+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="delta '+(type||'')+'">'+icon(type==="down"?"trending_down":"insights")+delta+'</div></div>'
}
function cardTitle(ic,title,sub){
  return '<div class="card-h">'+icon(ic)+title+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'
}
function buildNav(){
  var h="";
  NAVS.forEach(function(n){
    h+='<button type="button" data-i="'+n.i+'" onclick="go('+n.i+')" aria-label="'+n.t+'">'+icon(n.ic)+'<span class="lbl">'+n.t+'</span></button>'
  });
  document.getElementById("nav").innerHTML=h
}
function screen0(){
  var kh=kpi("description","在辦報價","37","件","+6 較上週","up")
    +kpi("schedule","平均報價時效","6.2","小時","-3.1h 較上月","up")
    +kpi("rule","配置錯誤率","1.8","%","-2.4% 較上月","up")
    +kpi("payments","本月報價金額","48.2","百萬","+11% 達成率","up");
  var rows="";
  QUOTES.forEach(function(r){
    rows+='<tr><td><b>'+r.no+'</b></td><td>'+r.cust+'</td><td>'+r.prod+'</td><td class="num">'+fmt(r.amt)+'</td><td class="num">'+r.margin+'%</td><td>'+tag(r.stage,r.tag)+'</td><td>'+r.eta+'</td><td>'+r.owner+'</td></tr>'
  });
  return head("dashboard","報價總覽儀表板","業務進辦公室第一眼：在辦報價、時效、配置錯誤率與金額達成，並掌握需優先跟進的案件","業務部")
    +'<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'
    +'<div class="grid g23" style="margin-bottom:14px"><section class="card grid-item">'+cardTitle("stacked_bar_chart","近 6 週報價量與成交量","件 / 週")+'<div class="chart-wrap" style="height:260px"><canvas id="c0a" aria-label="近六週報價量與成交量圖表"></canvas></div></section>'
    +'<section class="card grid-item">'+cardTitle("donut_large","報價階段分布","共 37 件")+'<div class="chart-wrap" style="height:260px"><canvas id="c0b" aria-label="報價階段分布圖表"></canvas></div></section></div>'
    +'<section class="card pad0 grid-item"><div style="padding:16px 17px 0">'+cardTitle("list_alt","在辦報價清單","依交期排序 · 可進入規格配置引擎")+'</div><div class="table-wrap"><table><thead><tr><th>報價單號</th><th>客戶</th><th>產品</th><th class="num">金額(NT$)</th><th class="num">毛利率</th><th>階段</th><th>需回覆</th><th>負責業務</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'
}
function screen1(){
  var groups=[
    ["機型基座","precision_manufacturing",[["CNC-820 五軸機頭","標配",1],["CNC-820L 加長行程","+ 480,000",0],["CNC-820H 高剛性主軸座","+ 720,000",0]]],
    ["主軸與轉速","bolt",[["12,000 rpm 標準主軸","標配",0],["18,000 rpm 高速主軸","+ 350,000",1],["24,000 rpm 陶瓷軸承","+ 610,000",0,1]]],
    ["控制系統","memory",[["FANUC 0i-MF","標配",0],["A 牌控制器 31i-B5 五軸聯動","+ 280,000",1],["B 牌控制器 840D sl","+ 330,000",0]]],
    ["自動化選配","conveyor_belt",[["自動換刀 24 刀庫","+ 150,000",1],["料件自動上下料 APC","+ 520,000",0],["線上量測探頭","+ 190,000",1]]]
  ],gh="";
  groups.forEach(function(g){
