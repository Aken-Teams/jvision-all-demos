<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>業務會議週報管理 Sales Meeting &amp; Weekly Report</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;
  --accent:#059669;
  --accent2:#10b981;
  --accent-dark:#047857;
  --amber:#b45309;
  --red:#dc2626;
  --bg:#f8fafc;
  --panel:#fff;
  --soft:#f1f5fd;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
.material-symbols-outlined{
  display:inline-block;
  overflow:hidden;
  width:1em;
  font-family:"Material Symbols Outlined";
  font-size:20px;
  font-style:normal;
  font-weight:400;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  white-space:nowrap;
  direction:ltr;
  vertical-align:middle
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.app{display:flex;min-width:0;min-height:100vh}
.side{
  position:sticky;
  top:0;
  display:flex;
  width:252px;
  height:100vh;
  flex:0 0 252px;
  flex-direction:column;
  padding:20px 14px;
  overflow:auto;
  border-right:1px solid #1e40af;
  background:#172554;
  color:#dbeafe
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 8px 20px;
  margin-bottom:16px;
  border-bottom:1px solid #334e8a
}
.logo{
  display:grid;
  width:42px;
  height:42px;
  flex:0 0 42px;
  place-items:center;
  border:2px solid #60a5fa;
  border-radius:var(--radius-md);
  background:var(--color-primary);
  color:#fff
}
.brand b{display:block;color:#fff;font-size:15px;font-weight:700;line-height:1.3}
.brand small{
  display:block;
  margin-top:3px;
  color:#bfdbfe;
  font-family:"Fira Code",monospace;
  font-size:9px;
  letter-spacing:.08em
}
.nav{display:flex;flex-direction:column;gap:5px}
.navbtn{
  display:flex;
  width:100%;
  min-height:44px;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:#bfdbfe;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.navbtn:hover{border-color:#3b5ea1;background:#1e3a6f;color:#fff}
.navbtn.on{border-color:#60a5fa;background:#2563eb;color:#fff}
.navbtn .txt{
  min-width:0;
  overflow:hidden;
  font-size:13px;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap
}
.navbtn .idx{
  margin-left:auto;
  color:#bfdbfe;
  font-family:"Fira Code",monospace;
  font-size:10px
}
.navbtn.on .idx{color:#fff}
.foot{
  margin-top:auto;
  padding:16px 8px 2px;
  border-top:1px solid #334e8a;
  color:#bfdbfe;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.8
}
.main{display:flex;min-width:0;flex:1;flex-direction:column}
.topbar{
  position:sticky;
  z-index:10;
  top:0;
  display:flex;
  min-width:0;
  align-items:center;
  gap:16px;
  padding:15px 24px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.97)
}
.topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.topbar .sub{margin-top:2px;color:var(--muted);font-size:12px}
.wk{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{
  display:inline-flex;
  min-height:34px;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--soft);
  color:#334155;
  font-size:11px;
  font-weight:600
}
.pill .material-symbols-outlined{color:var(--blue);font-size:16px}
.ava,.avatar-sm{
  display:inline-grid;
  place-items:center;
  background:var(--blue);
  color:#fff;
  font-weight:700
}
.ava{width:34px;height:34px;border-radius:50%;font-size:12px}
.avatar-sm{width:25px;height:25px;border-radius:6px;font-size:10px;vertical-align:middle}
.content{min-width:0;padding:24px}
.split{display:grid;min-width:0;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:18px;align-items:start}
.pane,.card,.kpi{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:var(--panel)
}
.pane{overflow:hidden}
.pane-h{
  display:flex;
  min-height:52px;
  align-items:center;
  gap:9px;
  padding:13px 16px;
  border-bottom:1px solid var(--line);
  background:#fff
}
.pane-h h3,.card h3{margin:0;color:var(--ink);font-size:14px;font-weight:700}
.pane-h>.material-symbols-outlined,.card h3>.material-symbols-outlined,.sec-title>.material-symbols-outlined{
  color:var(--blue)
}
.cnt{
  margin-left:auto;
  padding:3px 8px;
  border:1px solid #cbdaf8;
  border-radius:999px;
  background:var(--soft);
  color:#334155;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  white-space:nowrap
}
.pane-b{padding:14px}
.litem{
  position:relative;
  display:flex;
  min-width:0;
  min-height:58px;
  gap:11px;
  padding:11px;
  margin-bottom:8px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:#fff;
  transition:background-color .18s ease,border-color .18s ease,transform .18s ease
}
.litem:last-child{margin-bottom:0}
.litem:hover{border-color:#93b4f7;background:#f8fbff;transform:translateY(-1px)}
.litem.sel{border-color:var(--blue);background:#eff6ff}
.litem.sel:after{
  position:absolute;
  top:10px;
  right:10px;
  content:"check";
  color:var(--blue);
  font-family:"Material Symbols Outlined";
  font-size:17px
}
.dot{
  width:9px;
  height:9px;
  flex:0 0 9px;
  margin-top:6px;
  border:2px solid currentColor;
  border-radius:2px
}
.li-main{min-width:0;flex:1;padding-right:12px}
.li-t{display:flex;min-width:0;align-items:center;gap:7px;font-size:13px}
.li-t b{overflow:hidden;min-width:0;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.li-s{overflow:hidden;margin-top:3px;color:var(--muted);font-size:11.5px;text-overflow:ellipsis;white-space:nowrap}
.li-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:10.5px}
.kpis{display:grid;min-width:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
  position:relative;
  overflow:hidden;
  padding:15px 16px;
  border-top:3px solid var(--blue)
}
.kpi:nth-child(2n){border-top-color:var(--accent)}
.k-l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:600}
.k-l .material-symbols-outlined{color:var(--blue);font-size:18px}
.k-v{
  margin-top:7px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em
}
.k-v small{color:var(--muted);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:12px;font-weight:600}
.k-d{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;font-weight:600}
.k-d:before{font-family:"Material Symbols Outlined";font-size:15px}
.k-d.up{color:#047857}.k-d.up:before{content:"trending_up"}
.k-d.down{color:#b91c1c}.k-d.down:before{content:"priority_high"}
.grid2{display:grid;min-width:0;grid-template-columns:1fr 1fr;gap:18px}
.card{padding:16px}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.chartbox{position:relative;width:100%;overflow:hidden}
.detail-block{
  min-width:0;
  padding:15px;
  margin-bottom:12px;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:var(--radius-md);
  background:#f8fbff
}
.detail-block h4{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 9px;
  color:var(--ink);
  font-size:13px;
  font-weight:700
}
.fld{
  display:flex;
  min-width:0;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:8px 0;
  border-bottom:1px solid var(--line);
  font-size:12.5px
}
.fld:last-child{border-bottom:0}
.lab{flex:0 0 auto;color:var(--muted);font-weight:500}
.val{min-width:0;text-align:right;font-weight:600}
.fld .val,.mini,.tl-time{font-variant-numeric:tabular-nums}
.tag{
  display:inline-block;
  padding:3px 8px;
  margin:2px 4px 2px 0;
  border:1px solid #a7f3d0;
  border-radius:var(--radius-sm);
  background:#ecfdf5;
  color:#065f46;
  font-size:11px;
  font-weight:600
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap
}
.badge:before{font-family:"Material Symbols Outlined";font-size:13px}
.b-green{border-color:#86efac;background:#f0fdf4;color:#166534}.b-green:before{content:"check_circle"}
.b-amber{border-color:#fcd34d;background:#fffbeb;color:#92400e}.b-amber:before{content:"schedule"}
.b-red{border-color:#fca5a5;background:#fef2f2;color:#991b1b}.b-red:before{content:"error"}
.b-blue{border-color:#93c5fd;background:#eff6ff;color:#1e40af}.b-blue:before{content:"info"}
.b-gray{border-color:#cbd5e1;background:#f8fafc;color:#475569}.b-gray:before{content:"remove_circle_outline"}
.bar{
  display:inline-block;
  min-width:60px;
  height:7px;
  overflow:hidden;
  border-radius:2px;
  background:#dbe5f6;
  vertical-align:middle
}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.sec-title{display:flex;align-items:center;gap:8px;margin:5px 0 13px;font-size:13px;font-weight:700}
.tl{position:relative;padding-left:27px}
.tl:before{position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:#cbdaf8;content:""}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:before{
  position:absolute;
  top:3px;
  left:-24px;
  width:11px;
  height:11px;
  border:2px solid #fff;
  outline:1px solid var(--blue);
  border-radius:2px;
  background:var(--blue);
  content:""
}
.tl-item.warn:before{outline-color:var(--amber);background:var(--amber)}
.tl-time{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.tl-t{margin:2px 0;color:var(--ink);font-size:12.5px;font-weight:600}
.tl-d{color:var(--muted);font-size:12px;line-height:1.55}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md)}
table{width:100%;min-width:680px;border-collapse:collapse;font-size:12.5px}
th{
  padding:10px 11px;
  border-bottom:2px solid #cbdaf8;
  background:var(--soft);
  color:#334155;
  font-size:11px;
  font-weight:700;
  text-align:left;
  white-space:nowrap
}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
td:nth-child(4),td:nth-child(5),td:nth-child(6){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:middle}
.hint{margin-top:11px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;line-height:1.6}
.grid-item{animation:item-in .4s cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes item-in{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}
@media(max-width:1080px){
  .split{grid-template-columns:300px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{
    position:static;
    width:100%;
    height:auto;
    flex:none;
    flex-direction:row;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    overflow-x:auto;
    border-right:0;
    border-bottom:1px solid #1e40af
  }
  .brand{flex:0 0 auto;padding:0 12px 0 2px;margin:0;border:0}
  .brand small{display:none}
  .nav{flex:1;flex-direction:row}
  .navbtn{width:auto;flex:0 0 auto}
  .navbtn .idx,.foot{display:none}
  .topbar{top:0}
  .split{grid-template-columns:1fr}
}
@media(max-width:720px){
  .topbar{position:static;align-items:flex-start;padding:13px 15px}
  .wk{flex-wrap:wrap;justify-content:flex-end}
  .pill:nth-child(2){display:none}
  .content{padding:15px}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:520px){
  .brand b{display:none}
  .logo{width:38px;height:38px;flex-basis:38px}
  .navbtn{min-width:42px;padding:9px}
  .navbtn .txt{display:none}
  .topbar h1{font-size:15px}
  .topbar .sub{font-size:11px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:12px}
  .k-v{font-size:21px}
  .pane-b,.card{padding:12px}
  .fld{align-items:flex-start;flex-direction:column;gap:4px}
  .val{text-align:left}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-delay:0s!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  .litem:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">description</span></div>
      <div><b>週報會議管理</b><small>SALES WEEKLY REPORT</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot">
      <div>本週 W33 · 2026/08/10–08/14</div>
      <div>環境 · UI 展示（假資料）</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="min-width:0">
        <h1 id="scr-title">—</h1>
        <div class="sub" id="scr-sub">—</div>
      </div>
      <div class="wk">
        <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>第 33 週</span>
        <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">groups</span>業務部 12 人</span>
        <div class="ava" aria-label="目前使用者：陳志明">陳</div>
      </div>
    </header>
    <div class="content" id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"description",name:"週報範本填寫",sub:"統一範本線上填寫本週進度、重點商機與問題"},
  {icon:"trending_up",name:"重點商機彙整",sub:"自動彙整各業務重點商機與金額階段分布"},
  {icon:"warning",name:"問題與風險列管",sub:"收集卡關問題並標記需主管協助的項目"},
  {icon:"groups",name:"會議紀錄與議程",sub:"週會議程、討論案件與決議紀錄"},
  {icon:"task_alt",name:"行動項目追蹤",sub:"Action Item 指派、期限與結案追蹤"},
  {icon:"monitoring",name:"週報成效儀表",sub:"提交率、結案率與團隊績效總覽"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function clearSel(){var a=document.querySelectorAll("#screen .litem");for(var i=0;i<a.length;i++){a[i].classList.remove("sel");a[i].setAttribute("aria-selected","false")}}
function markSel(i){var t=document.querySelector('#screen .litem[data-r="'+i+'"]');if(t){t.classList.add("sel");t.setAttribute("aria-selected","true")}}
function interactive(html){return html.replace(/class="litem/g,'class="litem grid-item').replace(/ data-r=/g,' role="button" tabindex="0" aria-selected="false" data-r=')}
function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
function chartDefaults(){
  Chart.defaults.color="#475569";
  Chart.defaults.font.family='"Fira Sans","Noto Sans TC",sans-serif';
  Chart.defaults.borderColor="#e4ecfc"
}
chartDefaults();

var REPS=[
  {ini:"王",name:"王思賢",region:"北區",st:"submitted",time:"週四 16:20",deals:6,amt:820,issues:1,dot:"var(--accent)",rate:100},
  {ini:"李",name:"李佩璇",region:"北區",st:"submitted",time:"週四 18:05",deals:5,amt:640,issues:2,dot:"var(--accent)",rate:90},
  {ini:"張",name:"張家豪",region:"中區",st:"review",time:"週五 09:12",deals:7,amt:1180,issues:1,dot:"var(--amber)",rate:70},
  {ini:"林",name:"林宛儒",region:"中區",st:"submitted",time:"週四 14:40",deals:4,amt:390,issues:0,dot:"var(--accent)",rate:100},
  {ini:"陳",name:"陳冠廷",region:"南區",st:"draft",time:"草稿中",deals:5,amt:560,issues:3,dot:"var(--red)",rate:50},
  {ini:"黃",name:"黃詩涵",region:"南區",st:"submitted",time:"週四 17:30",deals:6,amt:910,issues:1,dot:"var(--accent)",rate:100}
];
function stBadge(s){
  if(s==="submitted")return '<span class="badge b-green">已提交</span>';
  if(s==="review")return '<span class="badge b-blue">審閱中</span>';
  return '<span class="badge b-red">未提交</span>'
}

  for(var i=0;i<REPS.length;i++){var r=REPS[i];rows+='<tr><td><span class="avatar-sm">'+esc(r.ini)+"</span> "+esc(r.name)+'</td><td>'+esc(r.region)+'</td><td>'+stBadge(r.st)+'</td><td style="text-align:center">'+r.deals+'</td><td style="text-align:right;font-weight:700;color:var(--accent-dark)">'+r.amt+' 萬</td><td>'+r.issues+' 件</td><td><div style="display:flex;align-items:center;gap:8px"><span class="bar" style="flex:1"><i style="width:'+r.rate+'%"></i></span><span class="mini">'+r.rate+"%</span></div></td></tr>"}
  return '<div class="kpis">'+kpi("assignment_turned_in","週報準時提交率","83","%","+8% 較上週","up")+kpi("task_alt","行動項目結案率","67","%","+4%","up")+kpi("schedule","平均提交時間","週四","","目標週五前","up")+kpi("groups","本週應提交","12","份","10 份已交","down")+'</div><div class="grid2" style="margin-bottom:18px"><section class="card grid-item"><h3>'+icon("show_chart")+'提交率與結案率趨勢</h3><div class="chartbox" style="height:250px"><canvas id="c5a" aria-label="提交率與結案率趨勢圖表"></canvas></div></section><section class="card grid-item"><h3>'+icon("bar_chart")+'各區重點商機金額（萬）</h3><div class="chartbox" style="height:250px"><canvas id="c5b" aria-label="各區重點商機金額圖表"></canvas></div><div class="legend"><span><i style="background:#059669"></i>本週</span><span><i style="background:#bfdbfe"></i>上週</span></div></section></div><section class="card grid-item"><h3>'+icon("groups")+'團隊週報總覽</h3><div class="tw"><table><thead><tr><th>業務</th><th>區域</th><th>週報狀態</th><th style="text-align:center">商機數</th><th style="text-align:right">加權金額</th><th>問題</th><th style="min-width:150px">行動項目完成率</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="hint">依 RULE-01：報價 2026-07-25 前且未確認決策者的商機優先追蹤；RULE-02：預估 &gt;100 萬停滯商機由經理協銷；RULE-03：無下次聯絡日期者不列入本月預估。</div></section>'
}
function initS5(){
  var a=el("c5a");if(a)charts.c5a=new Chart(a,{type:"line",data:{labels:["W28","W29","W30","W31","W32","W33"],datasets:[{label:"準時提交率%",data:[68,72,75,79,75,83],borderColor:"#2563eb",backgroundColor:"rgba(37,99,235,.1)",fill:true,tension:.3,pointRadius:3},{label:"結案率%",data:[52,58,61,64,63,67],borderColor:"#059669",backgroundColor:"transparent",fill:false,tension:.3,pointRadius:3,borderDash:[5,4]}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:12}}},scales:{y:{beginAtZero:true,max:100},x:{grid:{display:false}}}}});
  var b=el("c5b");if(b)charts.c5b=new Chart(b,{type:"bar",data:{labels:["北區","中區","南區"],datasets:[{label:"本週",data:[1460,1570,1470],backgroundColor:"#059669",borderRadius:3},{label:"上週",data:[1320,1490,1280],backgroundColor:"#bfdbfe",borderRadius:3}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}})
}
function kpi(ic,label,val,unit,delta,dir){
  return '<article class="kpi grid-item"><div class="k-l">'+icon(ic)+esc(label)+'</div><div class="k-v">'+esc(val)+(unit?" <small>"+esc(unit)+"</small>":"")+'</div><div class="k-d '+(dir==="up"?"up":"down")+'">'+esc(delta)+"</div></article>"
}
var SCREENS=[s0,s1,s2,s3,s4,s5];
var INITS=[null,initS1,initS2,null,initS4,initS5];
var PICKS=[pick0,pick1,pick2,pick3,pick4,null];

function buildNav(){
  var nav=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){var m=MODS[i];h+='<button type="button" class="navbtn" data-i="'+i+'" onclick="go('+i+')" aria-label="'+esc(m.name)+'">'+icon(m.icon)+'<span class="txt">'+esc(m.name)+'</span><span class="idx">0'+(i+1)+"</span></button>"}
  nav.innerHTML=h
}
function go(i){
  var hash="#go="+i;
  if(location.hash===hash)show(i);else location.hash=hash
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){var on=+btns[b].getAttribute("data-i")===i;btns[b].classList.toggle("on",on);btns[b].setAttribute("aria-current",on?"page":"false")}
  var m=MODS[i];
  el("scr-title").textContent=(i+1<10?"0"+(i+1):i+1)+" · "+m.name;
  el("scr-sub").textContent=m.sub;
  var c=el("screen");c.innerHTML=SCREENS[i]();
  if(INITS[i])INITS[i]();
  if(PICKS[i])PICKS[i](0)
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("litem")){e.preventDefault();e.target.click()}
});
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
