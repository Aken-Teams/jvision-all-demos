<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務會議週報管理 Sales Meeting & Weekly Report</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-dark:#15803d;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2417; --muted:#5f7168;
  --line:#e2ebe6; --soft:#f6faf8; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.app{display:flex;min-height:100vh;min-width:0;}
.side{
  width:246px;flex:0 0 246px;background:linear-gradient(180deg,#0f2417,#153a26);
  color:#e6f2eb;display:flex;flex-direction:column;padding:18px 14px;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04170c;flex:0 0 40px;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-size:15px;font-weight:800;display:block;line-height:1.25;}
.brand span{font-size:11px;color:#9dc9b3;letter-spacing:.5px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  border:0;background:transparent;color:#c7ddd0;cursor:pointer;text-align:left;
  font-family:inherit;font-size:13.5px;font-weight:600;width:100%;min-width:0;transition:.15s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 5px 16px rgba(22,163,74,.4);}
.navbtn .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .idx{margin-left:auto;font-size:11px;opacity:.55;font-weight:700;}
.side .foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8fb8a2;line-height:1.6;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;
  display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap;
}
.topbar h1{font-size:16px;margin:0;font-weight:800;min-width:0;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.wk{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);}
.pill .material-symbols-outlined{font-size:16px;color:var(--accent);}
.who{display:flex;align-items:center;gap:8px;}
.ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 32px;}
.content{padding:22px;min-width:0;}
.split{display:grid;grid-template-columns:340px 1fr;gap:18px;min-width:0;align-items:start;}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden;}
.pane-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;min-width:0;}
.pane-h h3{margin:0;font-size:14px;font-weight:800;min-width:0;}
.pane-h .material-symbols-outlined{color:var(--accent);font-size:20px;}
.pane-h .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:999px;white-space:nowrap;}
.pane-b{padding:14px 16px;}
.litem{display:flex;gap:11px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:9px;cursor:pointer;transition:.15s;background:#fff;min-width:0;}
.litem:hover{border-color:var(--accent2);background:var(--soft);}
.litem.sel{border-color:var(--accent);background:#ecfdf3;box-shadow:0 0 0 1px var(--accent) inset;}
.litem .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 9px;}
.litem .li-main{min-width:0;flex:1;}
.litem .li-t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;min-width:0;}
.litem .li-t b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.litem .li-s{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.litem .li-meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;margin-bottom:18px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.kpi .k-l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .k-l .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .k-v{font-size:26px;font-weight:800;margin-top:7px;letter-spacing:-.5px;}
.kpi .k-v small{font-size:13px;font-weight:600;color:var(--muted);}
.kpi .k-d{font-size:11.5px;margin-top:5px;font-weight:600;}
.up{color:var(--accent);}.down{color:var(--red);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.chartbox{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
th{text-align:left;padding:9px 11px;background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap;border-bottom:1px solid var(--line);}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-green{background:#dcfce7;color:#15803d;}
.b-amber{background:#fef3c7;color:#b45309;}
.b-red{background:#fee2e2;color:#b91c1c;}
.b-blue{background:#dbeafe;color:#1d4ed8;}
.b-gray{background:#eef2f0;color:#556;}
.avatar-sm{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:0 0 24px;}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle;}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.mini{font-size:11px;color:var(--muted);}
.detail-block{padding:16px;background:var(--soft);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;min-width:0;}
.detail-block h4{margin:0 0 9px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;}
.fld{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;min-width:0;align-items:center;}
.fld:last-child{border-bottom:0;}
.fld .lab{color:var(--muted);font-weight:600;flex:0 0 auto;}
.fld .val{font-weight:700;text-align:right;min-width:0;}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#ecfdf3;color:var(--accent-dark);font-size:11px;font-weight:700;margin:2px 4px 2px 0;}
.sec-title{font-size:13px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;gap:8px;}
.sec-title .material-symbols-outlined{color:var(--accent);font-size:19px;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px 0;}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent);}
.tl-item.warn::before{background:var(--amber);box-shadow:0 0 0 1px var(--amber);}
.tl-item .tl-time{font-size:11px;color:var(--muted);font-weight:700;}
.tl-item .tl-t{font-size:13px;font-weight:700;margin:2px 0 3px;}
.tl-item .tl-d{font-size:12px;color:var(--muted);line-height:1.5;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
@media(max-width:1080px){.split{grid-template-columns:300px 1fr;}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:100%;flex:none;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:8px;}
  .brand{border-bottom:0;margin-bottom:0;padding:0 10px 0 4px;flex:0 0 auto;}
  .nav{flex-direction:row;gap:6px;flex:1;}
  .navbtn{width:auto;flex:0 0 auto;padding:8px 12px;}
  .navbtn .idx{display:none;}
  .side .foot{display:none;}
  .split{grid-template-columns:1fr;}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr;}
  .grid2{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .navbtn .txt{display:none;}
  .navbtn{padding:9px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .content{padding:14px;}
  .topbar{padding:12px 14px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">description</span></div>
      <div>
        <b>週報會議管理</b>
        <span>SALES WEEKLY REPORT</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div>本週 W33 · 2026/08/10–08/14</div>
      <div>環境 · UI 展示（假資料）</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div style="min-width:0;">
        <h1 id="scr-title">—</h1>
        <div class="sub" id="scr-sub">—</div>
      </div>
      <div class="wk">
        <span class="pill"><span class="material-symbols-outlined">calendar_month</span>第 33 週</span>
        <span class="pill"><span class="material-symbols-outlined">groups</span>業務部 12 人</span>
        <div class="who"><div class="ava">陳</div></div>
      </div>
    </div>
    <div class="content" id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"description",name:"週報範本填寫",sub:"統一範本線上填寫本週進度、重點商機與問題"},
  {icon:"trending_up",name:"重點商機彙整",sub:"自動彙整各業務重點商機與金額階段分布"},
  {icon:"warning",name:"問題與風險列管",sub:"收集卡關問題並標記需主管協助的項目"},
  {icon:"groups",name:"會議紀錄與議程",sub:"週會議程、討論案件與決議紀錄"},
  {icon:"task_alt",name:"行動項目追蹤",sub:"Action Item 指派、期限與結案追蹤"},
  {icon:"monitoring",name:"週報成效儀表",sub:"提交率、結案率與團隊績效總覽"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function clearSel(){var items=document.querySelectorAll('#screen .litem');for(var k=0;k<items.length;k++)items[k].classList.remove('sel');}
function markSel(i){var t=document.querySelector('#screen .litem[data-r="'+i+'"]');if(t)t.classList.add('sel');}

var REPS=[
  {ini:"王",name:"王思賢",region:"北區",st:"submitted",time:"週四 16:20",deals:6,amt:820,issues:1,dot:"var(--accent)",rate:100},
  {ini:"李",name:"李佩璇",region:"北區",st:"submitted",time:"週四 18:05",deals:5,amt:640,issues:2,dot:"var(--accent)",rate:90},
  {ini:"張",name:"張家豪",region:"中區",st:"review",time:"週五 09:12",deals:7,amt:1180,issues:1,dot:"var(--amber)",rate:70},
  {ini:"林",name:"林宛儒",region:"中區",st:"submitted",time:"週四 14:40",deals:4,amt:390,issues:0,dot:"var(--accent)",rate:100},
  {ini:"陳",name:"陳冠廷",region:"南區",st:"draft",time:"草稿中",deals:5,amt:560,issues:3,dot:"var(--red)",rate:50},
  {ini:"黃",name:"黃詩涵",region:"南區",st:"submitted",time:"週四 17:30",deals:6,amt:910,issues:1,dot:"var(--accent)",rate:100}
];
function stBadge(s){
  if(s==="submitted")return '<span class="badge b-green">已提交</span>';
  if(s==="review")return '<span class="badge b-blue">審閱中</span>';
  return '<span class="badge b-red">未提交</span>';
}

/* ===== SCREEN 0 : 週報範本填寫 ===== */
function s0(){
  var list="";
  for(var i=0;i<REPS.length;i++){var r=REPS[i];
    list+='<div class="litem'+(i===0?' sel':'')+'" data-r="'+i+'" onclick="pick0('+i+')">'+
      '<span class="dot" style="background:'+r.dot+'"></span>'+
      '<div class="li-main"><div class="li-t"><b>'+esc(r.name)+' 週報</b></div>'+
      '<div class="li-s">'+esc(r.region)+' · '+r.deals+' 筆商機</div>'+
      '<div class="li-meta"><span>'+esc(r.time)+'</span>'+stBadge(r.st)+'</div></div></div>';
  }
  return '<div class="split">'+
    '<div class="pane"><div class="pane-h"><span class="material-symbols-outlined">inbox</span><h3>本週週報清單</h3><span class="cnt">W33</span></div>'+
    '<div class="pane-b">'+list+'</div></div>'+
    '<div class="pane"><div class="pane-h"><span class="material-symbols-outlined">description</span><h3>週報明細</h3><span class="cnt" id="d0-tag">已提交</span></div>'+
    '<div class="pane-b" id="d0-body"></div></div></div>';
}
function pick0(i){
  clearSel();markSel(i);var r=REPS[i];
  var tag=el('d0-tag');if(tag)tag.textContent=r.st==="submitted"?"已提交":r.st==="review"?"審閱中":"草稿";
  var goals=[
    {t:"本週拜訪客戶",v:"9 家 / 目標 8",p:100},
    {t:"新增商機建立",v:r.deals+" 筆 / 目標 5",p:Math.min(100,r.deals*20)},
    {t:"報價提交",v:"3 份 / 目標 4",p:75}
  ];
  var gh="";for(var g=0;g<goals.length;g++){var o=goals[g];
    gh+='<div class="fld"><span class="lab">'+esc(o.t)+'</span><span class="val" style="display:flex;align-items:center;gap:10px;">'+esc(o.v)+'<span class="bar" style="width:80px"><i style="width:'+o.p+'%"></i></span></span></div>';}
  var body=el('d0-body');if(!body)return;
  body.innerHTML=
    '<div class="detail-block"><h4><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">badge</span>'+esc(r.name)+' · '+esc(r.region)+'業務</h4>'+
    '<div class="fld"><span class="lab">填報週別</span><span class="val">2026 W33（08/10–08/14）</span></div>'+
    '<div class="fld"><span class="lab">提交狀態</span><span class="val">'+stBadge(r.st)+'</span></div>'+
    '<div class="fld"><span class="lab">提交時間</span><span class="val">'+esc(r.time)+'</span></div></div>'+
    '<div class="detail-block"><h4><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">flag</span>本週目標達成</h4>'+gh+'</div>'+
    '<div class="detail-block"><h4><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">summarize</span>本週工作摘要</h4>'+
    '<p style="margin:0;font-size:12.5px;line-height:1.7;color:var(--ink)">完成 A 客戶自動化產線第二次簡報，客戶技術部門反應良好；推進 B 集團年度採購案報價，等待對方決策者確認預算；C 客戶反映交期疑慮，已協調生管回覆。</p></div>'+
    '<div class="detail-block"><h4><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">event_upcoming</span>下週計畫</h4>'+
    '<span class="tag">A 客戶合約議價</span><span class="tag">B 集團複訪</span><span class="tag">南區展會布展</span><span class="tag">D 廠試機追蹤</span></div>';
}

/* ===== SCREEN 1 : 重點商機彙整 ===== */
var DEALS=[
  {t:"精密機械自動化產線",cust:"宏達精機",amt:1200,stage:"報價議合",owner:"張",prob:70,dot:"var(--accent)"},
  {t:"年度耗材採購框架約",cust:"聯昌集團",amt:860,stage:"方案評估",owner:"黃",prob:55,dot:"var(--amber)"},
  {t:"檢測設備汰換案",cust:"台興電子",amt:640,stage:"需求確認",owner:"李",prob:35,dot:"var(--blue)"},
  {t:"倉儲自動搬運系統",cust:"鴻昌物流",amt:980,stage:"報價議合",owner:"王",prob:65,dot:"var(--accent)"},
  {t:"產線視覺檢測擴充",cust:"友暘光電",amt:520,stage:"方案評估",owner:"林",prob:45,dot:"var(--amber)"}
];
function s1(){
  var list="";
  for(var i=0;i<DEALS.length;i++){var d=DEALS[i];
    list+='<div class="litem'+(i===0?' sel':'')+'" data-r="'+i+'" onclick="pick1('+i+')">'+
      '<span class="dot" style="background:'+d.dot+'"></span>'+
      '<div class="li-main"><div class="li-t"><b>'+esc(d.t)+'</b></div>'+
      '<div class="li-s">'+esc(d.cust)+' · '+esc(d.stage)+'</div>'+
      '<div class="li-meta"><span style="color:var(--accent-dark);font-weight:800">NT$ '+d.amt+' 萬</span><span>贏率 '+d.prob+'%</span></div></div></div>';
  }
  return '<div class="kpis">'+
      kpi("trending_up","本週重點商機","23","筆","+4 較上週","up")+
      kpi("payments","加權預估金額","4,200","萬","+9.2%","up")+
      kpi("conversion_path","平均推進階段","2.6","／4","+0.3","up")+
      kpi("hourglass_top","停滯 >14 天","5","筆","需協銷","down")+

  if(c1)charts.c5a=new Chart(c1,{type:"line",data:{labels:["W28","W29","W30","W31","W32","W33"],datasets:[{label:"準時提交率%",data:[68,72,75,79,75,83],borderColor:"#16a34a",backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35,pointRadius:3},{label:"結案率%",data:[52,58,61,64,63,67],borderColor:"#4ade80",backgroundColor:"transparent",fill:false,tension:.35,pointRadius:3,borderDash:[5,4]}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12}}},scales:{y:{beginAtZero:true,max:100,grid:{color:"#eef2f0"}},x:{grid:{display:false}}}}});
  var c2=el("c5b");
  if(c2)charts.c5b=new Chart(c2,{type:"bar",data:{labels:["北區","中區","南區"],datasets:[{label:"本週",data:[1460,1570,1470],backgroundColor:"#16a34a",borderRadius:6},{label:"上週",data:[1320,1490,1280],backgroundColor:"#bbf7d0",borderRadius:6}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:"#eef2f0"}},x:{grid:{display:false}}}}});
}

function kpi(icon,label,val,unit,delta,dir){
  return '<div class="kpi"><div class="k-l"><span class="material-symbols-outlined">'+icon+'</span>'+esc(label)+'</div>'+
    '<div class="k-v">'+esc(val)+(unit?' <small>'+esc(unit)+'</small>':'')+'</div>'+
    '<div class="k-d '+(dir==="up"?"up":"down")+'">'+esc(delta)+'</div></div>';
}
var SCREENS=[s0,s1,s2,s3,s4,s5];
var INITS=[null,initS1,initS2,null,initS4,initS5];
var PICKS=[pick0,pick1,pick2,pick3,pick4,null];

function buildNav(){
  var nav=el("nav");var h="";
  for(var i=0;i<MODS.length;i++){var m=MODS[i];
    h+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+esc(m.name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  var m=MODS[i];
  el("scr-title").textContent=(i+1<10?"0"+(i+1):(i+1))+" · "+m.name;
  el("scr-sub").textContent=m.sub;
  var c=el("screen");
  c.innerHTML=SCREENS[i]();
  void c.offsetHeight;
  if(INITS[i])INITS[i]();
  if(PICKS[i])PICKS[i](0);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
