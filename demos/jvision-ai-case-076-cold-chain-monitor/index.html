<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>冷鏈溫控警示站 · Cold Chain Monitor</title>
<meta name="description" content="冷藏車即時溫度、溫度趨勢曲線、超溫警示、溫層貨物與 HACCP 稽核報表（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0b2530;--bg:#eef6f9;--card:#ffffff;--line:#d3e6ec;--soft:#e4f2f6;--mut:#557785;--ok:#0891b2;--warn:#d97706;--bad:#dc2626;--blu:#2563eb;--frz:#4338ca}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* top nav */
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap;box-shadow:0 1px 3px rgba(11,37,48,.06)}
.top>*{min-width:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(8,145,178,.34)}
.logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px;font-weight:700}
.tick{display:flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);padding:5px 11px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;flex:none}
.tick i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:bl 1.7s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(8,145,178,.5)}50%{opacity:.4;box-shadow:0 0 0 5px rgba(8,145,178,0)}}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(8,145,178,.32)}
.nav button .badge{font-size:10px;font-weight:800;background:#fee2e2;color:#b91c1c;border-radius:999px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
/* main */
.wrap{max-width:1320px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pill .material-symbols-outlined{font-size:16px}
.view{animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0;box-shadow:0 1px 2px rgba(11,37,48,.04)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(8,145,178,.09),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:25px;font-weight:900;margin-top:5px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.26}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* grid */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.5fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(11,37,48,.04)}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#cffafe;color:#0e7490}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-mut{background:#eef2f4;color:#64748b}.t-frz{background:#e0e7ff;color:#4338ca}
/* table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft);text-transform:uppercase;letter-spacing:.03em}
table.data tr:hover td{background:var(--soft)}
.num{font-family:Inter;font-weight:700;text-align:right}
.scroll{overflow-x:auto}
.chart{width:100%;min-height:60px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* vehicle temp board */
.veh{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.veh>*{min-width:0}
.vc{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fff;position:relative;overflow:hidden}
.vc.warn{border-color:#fecaca;background:#fff7f7}
.vc.frz{border-color:#c7d2fe}
.vc .hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mut)}
.vc .hd .material-symbols-outlined{font-size:18px;color:var(--accent)}
.vc.warn .hd .material-symbols-outlined{color:var(--bad)}
.vc.frz .hd .material-symbols-outlined{color:var(--frz)}
.vc .temp{font-family:Inter;font-size:28px;font-weight:900;margin-top:7px;line-height:1}
.vc .temp small{font-size:14px;color:var(--mut);font-weight:800}
.vc small.sub{color:var(--mut);font-size:11px;display:block;margin-top:5px}
.vc .st{margin-top:9px}
.vc .rng{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px;position:relative}
.vc .rng i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.vc.warn .rng i{background:linear-gradient(90deg,#f87171,var(--bad))}
.vc.frz .rng i{background:linear-gradient(90deg,#818cf8,var(--frz))}
/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:10px;font-size:12px}
.br b{font-family:"Noto Sans TC";font-weight:700}
.br .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.br .track i{display:block;height:100%;border-radius:6px}
.br .val{font-family:Inter;font-weight:800;text-align:right}
/* alert list */
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--mut)}
.al.r{border-left-color:var(--bad);background:#fff7f7}
.al.a{border-left-color:var(--warn);background:#fffdf5}
.al.g{border-left-color:var(--ok)}
.al .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.al.r .ic{background:#fee2e2;color:var(--bad)}
.al.a .ic{background:#fef3c7;color:var(--warn)}
.al.g .ic{background:#cffafe;color:var(--ok)}
.al .bd{flex:1;min-width:0}
.al .bd b{font-family:"Noto Sans TC";font-size:13px}
.al .bd small{display:block;color:var(--mut);font-size:11px;margin-top:2px;line-height:1.5}
.al .rt{text-align:right;flex:none}
.al .rt .dv{font-family:Inter;font-weight:900;font-size:15px}
.al .rt small{color:var(--mut);font-size:10px;display:block}
/* stat */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.sc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.sc b{display:block;font-size:20px;font-weight:900;color:var(--ink);font-family:Inter}
.sc span{font-size:11.5px;color:var(--mut)}
/* form / option zone */
.oz{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.oz b{font-family:"Noto Sans TC";font-size:12.5px}
.oz small{color:var(--mut);font-size:11px;display:block}
.chip{display:inline-flex;gap:5px;flex-wrap:wrap}
.chip .c{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#cffafe;color:var(--accent);border:1px solid #a5f3fc}
.chip .c.off{background:transparent;color:var(--mut);border-color:var(--line)}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
/* cargo cards */
.cargo{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cargo>*{min-width:0}
.cg{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fff;position:relative}
.cg .top2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cg .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--accent)}
.cg.frz .ico{background:#e0e7ff;color:var(--frz)}
.cg b{font-family:"Noto Sans TC";font-size:13px;display:block}
.cg .meta{font-size:11px;color:var(--mut)}
.cg .kv{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-top:1px dashed var(--line)}
.cg .kv span{color:var(--mut)}
.cg .kv b{font-family:Inter;font-weight:800}
/* report */
.rep{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.rep>*{min-width:0}
.sched{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);margin-bottom:8px;font-size:12px;flex-wrap:wrap}
.sched .material-symbols-outlined{color:var(--accent);font-size:18px}
.sched b{font-family:"Noto Sans TC"}
.sched .r{margin-left:auto;color:var(--mut)}
.prev{border:1px dashed var(--line);border-radius:12px;background:var(--soft);padding:16px}
.prev .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:13px;gap:8px;flex-wrap:wrap}
.prev .ph b{font-family:"Noto Sans TC";font-size:15px}
.prev .ph small{color:var(--mut);font-size:11px;display:block}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:74px 1fr;gap:12px;position:relative;padding-bottom:14px}
.tl .it:before{content:"";position:absolute;left:80px;top:20px;bottom:-4px;width:2px;background:var(--line)}
.tl .it:last-child:before{display:none}
.tl .tm{font-family:Inter;font-weight:800;font-size:12px;color:var(--mut);text-align:right}
.tl .bd2{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 12px;position:relative}
.tl .bd2:before{content:"";position:absolute;left:-19px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .bd2.r:before{background:var(--bad)}
.tl .bd2.a:before{background:var(--warn)}
.tl .bd2 b{font-family:"Noto Sans TC";font-size:12.5px}
.tl .bd2 small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21,.g3,.rep{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.tick{display:none}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.kpis{grid-template-columns:1fr 1fr}.br{grid-template-columns:110px 1fr 54px}.tl .it{grid-template-columns:60px 1fr}.tl .it:before{left:66px}}
</style>
</head>

<script>
var SCREENS=[

function show(i){
 nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];vpill.innerHTML='<span class="material-symbols-outlined">calendar_today</span>'+PILL[i];
 view.innerHTML='<div class="view">'+SCREENS[i]()+'</div>';
 void view.offsetHeight;
 draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
