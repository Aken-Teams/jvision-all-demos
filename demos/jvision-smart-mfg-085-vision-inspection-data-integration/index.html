<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AOI/AVI 設備數據整合平台 · Vision Inspection Data Integration</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#9a5410;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --shadow:0 8px 24px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  vertical-align:middle
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:22px;
  min-height:72px;
  padding:10px clamp(16px,3vw,42px);
  color:var(--ink);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(15,23,42,.04);
  backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.brand .logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--color-primary);
  border-radius:8px;
  box-shadow:5px 5px 0 #bfdbfe
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.2
}
.brand span{color:var(--muted);font-size:10.5px}
.tnav{
  display:flex;
  align-items:center;
  gap:3px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin
}
.tbtn{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:42px;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:7px;
  color:var(--muted);
  background:transparent;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease
}
.tbtn .material-symbols-outlined{font-size:18px}
.tbtn:hover{color:var(--blue);background:#eff6ff;border-color:#bfdbfe}
.tbtn.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary)
}
.tbtn.on:hover{color:#fff;background:#1d4ed8}
.topsp{display:none}
.pill,.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:32px;
  padding:6px 10px;
  border:1px solid #bfdbfe;
  border-radius:6px;
  color:#1e40af;
  background:#eff6ff;
  font:600 11px "Fira Code",monospace;
  white-space:nowrap
}
.hd{
  display:flex;
  align-items:flex-end;
  gap:18px;
  padding:clamp(26px,5vw,58px) clamp(16px,5vw,72px) 28px;
  background:
    linear-gradient(90deg,rgba(37,99,235,.07),transparent 58%),
    rgba(255,255,255,.74);
  border-bottom:1px solid var(--line)
}
.hd:before{
  content:"INSPECTION DATA / 06 MODULES";
  align-self:flex-start;
  position:absolute;
  color:var(--blue);
  font:600 10px "Fira Code",monospace;
  letter-spacing:.15em
}
.hd .tt{min-width:0;padding-top:23px}
.hd h1{
  margin:0;
  color:#0f172a;
  font-size:clamp(24px,3vw,42px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1.05
}
.hd p{margin:10px 0 0;color:var(--muted);font-size:13px}
.hd .badge{
  margin-left:auto;
  color:#9a3412;
  background:#fff7ed;
  border-color:#fdba74
}
.wrap{max-width:1500px;margin:0 auto;padding:24px clamp(14px,3vw,40px) 64px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:9px;
  box-shadow:var(--shadow)
}
.card{padding:18px}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  color:#0f172a;
  font-size:14px;
  font-weight:700
}
.card h3 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  color:var(--blue);
  background:#eff6ff;
  border-radius:6px;
  font-size:17px
}
.card .sub{margin:0 0 15px;color:var(--muted);font-size:11.5px;line-height:1.55}
.kpi{
  position:relative;
  min-height:132px;
  padding:17px 18px;
  overflow:hidden;
  border-top:3px solid var(--blue);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease
}
.kpi:hover{transform:translateY(-2px);border-top-color:var(--color-accent);box-shadow:0 12px 28px rgba(15,23,42,.09)}
.kpi .lb{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600
}
.kpi .vl{
  margin:11px 0 4px;
  color:#0f172a;
  font:700 27px "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.05em
}
.kpi .dt{display:flex;align-items:center;color:var(--muted);font-size:11px;font-weight:600}
.kpi .ic{position:absolute;right:12px;top:14px;color:var(--blue);font-size:29px;opacity:.12}
.up{color:var(--ok)!important}
.down{color:var(--bad)!important}
.chart{width:100%;height:280px}
.chart.sm{height:230px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th{
  padding:10px 12px;
  color:#334155;
  background:#f1f5f9;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:11px;
  font-weight:700;
  text-align:left;
  white-space:nowrap
}
td{
  padding:11px 12px;
  border-bottom:1px solid #edf2f7;
  vertical-align:middle
}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#f8fafc}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:right}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap
}
.tag:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.t-ok{color:#166534;background:#f0fdf4}
.t-warn{color:#854d0e;background:#fefce8}
.t-bad{color:#991b1b;background:#fef2f2}
.t-info{color:#1e40af;background:#eff6ff}
.t-mut{color:#475569;background:#f1f5f9}
.bar{height:7px;min-width:60px;overflow:hidden;background:#e2e8f0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
.notice{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;color:#9a3412;background:#fff7ed;border:1px solid #fdba74;border-radius:7px;font-size:12px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px}
.kcol{min-width:0;padding:11px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
.kcol>h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
  color:#334155;
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em
}
.kcol>h4 .cnt{
  padding:2px 7px;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  font:600 10px "Fira Code",monospace
}
.kcard{
  margin-bottom:8px;
  padding:11px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:6px;
  box-shadow:0 2px 7px rgba(15,23,42,.035);
  transition:transform .2s ease,box-shadow .2s ease
}
.kcard:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(15,23,42,.08)}
.kcard:last-child{margin-bottom:0}
.kcard .kh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kcard b{font-size:12px}
.kcard .brandtag{
  padding:2px 5px;
  color:#1d4ed8;
  background:#eff6ff;
  border-radius:3px;
  font-size:9.5px;
  font-weight:700
}
.kcard .meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:7px;
  color:var(--muted);
  font:10.5px "Fira Code",monospace
}
.kcard .prog{margin-top:9px}
.kcard.b2{border-left-color:#0f766e}
.kcard.b2 .brandtag{color:#115e59;background:#f0fdfa}
.kcard.b3{border-left-color:#7c3aed}
.kcard.b3 .brandtag{color:#6d28d9;background:#f5f3ff}
.kcard.b4{border-left-color:var(--ok)}
.kcard.b4 .brandtag{color:#166534;background:#f0fdf4}
.maprow{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:44px;
  padding:8px 0;
  border-bottom:1px solid #edf2f7;
  font-size:12px
}
.maprow:last-child{border-bottom:0}
.maprow .src{
  width:150px;
  flex:none;
  overflow:hidden;
  font:600 11px "Fira Code",monospace;
  text-overflow:ellipsis;
  white-space:nowrap
}
.maprow .ar{color:var(--blue);flex:none}
.maprow .dst{flex:1;min-width:0;color:#334155;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.gcell{
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  transition:transform .2s ease,box-shadow .2s ease
}
.gcell:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(15,23,42,.09)}
.gimg{position:relative;display:flex;align-items:center;justify-content:center;height:96px;overflow:hidden}
.gimg:after{
  content:"";
  position:absolute;
  inset:11px;
  border:1px solid rgba(255,255,255,.55)
}
.gimg .material-symbols-outlined{z-index:1;color:rgba(255,255,255,.9);font-size:37px}
.gimg .lab,.gimg .conf{
  position:absolute;
  z-index:2;
  padding:2px 6px;
  color:#fff;
  background:rgba(15,23,42,.78);
  border-radius:3px;
  font:700 9.5px "Fira Code",monospace
}
.gimg .lab{left:7px;top:7px}
.gimg .conf{right:7px;bottom:7px}
.gbody{padding:9px}
.gbody b{display:block;font-size:11.5px}
.gbody small{color:var(--muted);font-size:10px}
.gbody .gact{display:flex;gap:6px;margin-top:8px}
.gbtn{
  flex:1;
  min-height:30px;
  padding:4px;
  color:#334155;
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px;
  font-size:10px;
  font-weight:700;
  text-align:center;
  transition:background .18s ease,border-color .18s ease
}
.gbtn:hover{background:#f8fafc;border-color:#94a3b8}
.gbtn.ok{color:#166534;background:#f0fdf4;border-color:#86efac}
.gbtn.no{color:#991b1b;background:#fef2f2;border-color:#fca5a5}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlrow{position:relative;padding:0 0 19px}
.tlrow:last-child{padding-bottom:0}
.tlrow .dot{
  position:absolute;
  left:-24px;
  top:2px;
  width:15px;
  height:15px;
  background:#fff;
  border:3px solid #64748b;
  border-radius:50%
}
.tlrow.done .dot{background:var(--ok);border-color:var(--ok)}
.tlrow.now .dot{background:#fff7ed;border-color:var(--color-accent);box-shadow:0 0 0 4px #ffedd5}
.tlrow b{font-size:12.5px}
.tlrow .meta{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.5}
.chain{display:flex;align-items:stretch;gap:2px;flex-wrap:wrap}
.node{min-width:130px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:6px}
.node .lv{color:var(--blue);font:700 9.5px "Fira Code",monospace;letter-spacing:.08em;text-transform:uppercase}
.node b{display:block;margin-top:3px;font-size:12px}
.node small{color:var(--muted);font-size:10.5px}
.arw{align-self:center;padding:0 3px;color:#64748b}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.stn{position:relative;padding:12px;background:#fff;border:1px solid var(--line);border-radius:6px}
.stn .sd{
  position:absolute;
  right:9px;
  top:9px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  width:auto;
  height:auto;
  padding:2px 5px;
  border:1px solid currentColor;
  border-radius:3px;
  font:700 8.5px "Fira Code",monospace
}
.stn .sd:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.stn .sd.on{color:#166534;background:#f0fdf4}
.stn .sd.on:after{content:"線上"}
.stn .sd.wn{color:#854d0e;background:#fefce8}
.stn .sd.wn:after{content:"延遲"}
.stn .sd.of{color:#475569;background:#f1f5f9}
.stn .sd.of:after{content:"離線"}
.stn b{display:block;padding-right:44px;font-size:12px}
.stn small{color:var(--muted);font-size:10px}
.stn .rt{margin-top:8px;color:#334155;font:600 10px "Fira Code",monospace}
.chklist>div{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chklist>div:last-child{margin-bottom:0}
.chklist .cn{width:130px;flex:none;min-width:0;font-size:12px;font-weight:600}
.chklist .cv{width:44px;flex:none;text-align:right;font:700 11.5px "Fira Code",monospace}
#view>*,.card,.kpi{animation:reveal .35s ease both}
#view>*:nth-child(2){animation-delay:.05s}
#view>*:nth-child(3){animation-delay:.1s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1180px){
  .topbar{grid-template-columns:auto 1fr}
  .pill{display:none}
  .tnav{justify-content:flex-end}
}
@media(max-width:900px){
  .topbar{display:flex;flex-wrap:wrap;gap:8px}
  .brand{flex:1}
  .tnav{order:2;width:100%;justify-content:flex-start;padding-top:4px}
  .kanban{grid-template-columns:repeat(2,minmax(220px,1fr))}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .hd{align-items:flex-start;padding:28px 16px 20px}
  .hd .badge{margin-top:22px}
  .wrap{padding:16px 14px 42px}
}
@media(max-width:560px){
  .topbar{padding:9px 12px}
  .brand span{display:none}
  .tbtn{min-width:43px;justify-content:center}
  .tbtn .ttxt{display:none}
  .hd{display:block}
  .hd .badge{margin-top:16px}
  .kanban{grid-template-columns:1fr}
  .card{padding:14px}
  .kpi{min-height:120px}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
  #view>*,.card,.kpi{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></div>
    <div><b>VisionHub</b><span>AOI/AVI 數據整合平台</span></div>
  </div>
  <nav class="tnav" id="tnav" aria-label="主要功能"></nav>
  <div class="topsp"></div>
  <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">sync</span>7 機台線上</span>
</header>
<section class="hd" aria-labelledby="scT">
  <div class="tt"><h1 id="scT">—</h1><p id="scS">—</p></div>
  <span class="badge" id="scB"><span class="material-symbols-outlined" aria-hidden="true">bolt</span>—</span>
</section>
<main class="wrap"><div id="view"></div></main>
<script>
(function(){
"use strict";
var MODS=[
  {icon:"factory",name:"多機台數據匯入",sub:"整合各廠牌 AOI/AVI 機台檢測數據",badge:"7 機台同步中"},
  {icon:"account_tree",name:"統一格式轉換",sub:"異質數據標準化與欄位對映",badge:"對映覆蓋 96%"},
  {icon:"fact_check",name:"離線複判站",sub:"缺陷影像人工覆判與真偽分類",badge:"待複判 148 張"},
  {icon:"biotech",name:"缺陷影像庫",sub:"缺陷影像分類標註與檢索",badge:"影像 84.6 萬張"},
  {icon:"insights",name:"數據回饋",sub:"複判結果回饋機台與 AI 模型",badge:"過殺率 -34%"},
  {icon:"trending_up",name:"良率分析",sub:"跨站良率與缺陷趨勢統計",badge:"直通良率 98.2%"}
];
var view=document.getElementById("view"),charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function kpi(lb,vl,dt,ic,dir,tail){
  var cls=dir==="up"?"up":dir==="down"?"down":"";
  var ar=dir==="up"?"trending_up":dir==="down"?"trending_down":"remove";
  var tailH=tail?'<span style="color:#64748b;font-weight:500"> · '+esc(tail)+'</span>':"";
  var dtH=dir?'<span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">'+ar+"</span>"+esc(dt):esc(dt);
  return '<div class="kpi"><span class="material-symbols-outlined ic" aria-hidden="true">'+ic+'</span><div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+'</div><div class="dt '+cls+'">'+dtH+tailH+"</div></div>"
}
function s0(){

function show(i){
  i=Math.max(0,Math.min(5,i|0));active=i;disposeCharts();
  document.getElementById("scT").textContent=MODS[i].name;
  document.getElementById("scS").textContent=MODS[i].sub;

    b.setAttribute("aria-current",on?"page":"false")
  });
  void view.offsetHeight;

}

  });

  })

var show=window.show;
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
