<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AOI/AVI 設備數據整合平台 · Vision Inspection Data Integration</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#ea580c; --accent2:#fb923c;
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1c2230; --muted:#6b7280;
  --line:#e5e7eb; --top:#141821; --top2:#1e2430; --topink:#c9cedb;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
/* top bar */
.topbar{
  background:var(--top);color:var(--topink);position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid #262c38;
}
.brand{display:flex;align-items:center;gap:11px;flex:none;}
.brand .logo{
  width:38px;height:38px;flex:none;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 15px rgba(234,88,12,.4);
}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px;display:block;line-height:1.15;}
.brand span{font-size:10.5px;color:#8b90a0;}
.tnav{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0;justify-content:center;}
.tbtn{
  display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;
  background:transparent;border:none;color:var(--topink);cursor:pointer;
  padding:9px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:500;transition:.15s;
}
.tbtn .material-symbols-outlined{font-size:19px;color:#8b90a0;flex:none;}
.tbtn:hover{background:var(--top2);color:#fff;}
.tbtn.on{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(234,88,12,.35);}
.tbtn.on .material-symbols-outlined{color:#fff;}
.topsp{margin-left:auto;flex:none;}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(234,88,12,.16);color:#fdba74;border:1px solid rgba(234,88,12,.35);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
/* header strip */
.hd{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:14px;}
.hd .tt{min-width:0;}
.hd h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.2px;}
.hd p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
.hd .badge{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;background:#fff7ed;color:var(--accent);border:1px solid #fed7aa;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
.wrap{padding:22px 26px 44px;max-width:1500px;margin:0 auto;}
/* grids */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.55fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0;}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 17px;position:relative;overflow:hidden;min-width:0;}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;}
.kpi .vl{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:.3px;}
.kpi .dt{font-size:11.5px;font-weight:600;}
.kpi .ic{position:absolute;right:-8px;top:-8px;font-size:74px;opacity:.06;color:var(--accent);}
.up{color:var(--ok);} .down{color:var(--bad);}
.chart{width:100%;height:280px;}
.chart.sm{height:230px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
th{background:#f9fafb;color:#6b7280;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;}
td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfc;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.t-ok{background:#f0fdf4;color:var(--ok);}
.t-warn{background:#fffbeb;color:var(--warn);}
.t-bad{background:#fef2f2;color:var(--bad);}
.t-info{background:#eff6ff;color:var(--info);}
.t-mut{background:#f3f4f6;color:#6b7280;}
.bar{height:7px;border-radius:5px;background:#eef0f3;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#9a3412;display:flex;gap:9px;align-items:flex-start;}
.notice .material-symbols-outlined{color:var(--accent);font-size:20px;flex:none;}
/* KANBAN board (v0 signature) */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kcol{background:#f8f9fb;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.kcol>h4{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.kcol>h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);font-weight:600;}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:11px 12px;margin-bottom:9px;}
.kcard:last-child{margin-bottom:0;}
.kcard .kh{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.kcard b{font-size:12.5px;}
.kcard .brandtag{font-size:10px;font-weight:700;color:var(--accent);background:#fff7ed;border-radius:5px;padding:1px 6px;}
.kcard .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.kcard .prog{margin-top:8px;}
.kcard.b2{border-left-color:var(--accent2);}
.kcard.b2 .brandtag{color:var(--accent2);}
.kcard.b3{border-left-color:var(--info);}
.kcard.b3 .brandtag{color:var(--info);background:#eff6ff;}
.kcard.b4{border-left-color:var(--ok);}
.kcard.b4 .brandtag{color:var(--ok);background:#f0fdf4;}
/* mapping rows (v1) */
.maprow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f3;font-size:12.5px;}
.maprow:last-child{border-bottom:none;}
.maprow .src{width:150px;flex:none;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.maprow .ar{color:var(--accent);flex:none;}
.maprow .dst{flex:1;min-width:0;color:#374151;font-weight:600;}
/* defect image gallery (v2 & v3) */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.gcell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
.gimg{height:96px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.gimg .material-symbols-outlined{font-size:40px;color:rgba(255,255,255,.85);}
.gimg .lab{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:5px;padding:1px 6px;}
.gimg .conf{position:absolute;right:8px;bottom:8px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.4);border-radius:5px;padding:1px 6px;}
.gbody{padding:9px 10px;}
.gbody b{font-size:12px;display:block;}
.gbody small{font-size:10.5px;color:var(--muted);}
.gbody .gact{margin-top:7px;display:flex;gap:6px;}
.gbtn{flex:1;font-size:10.5px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 0;text-align:center;color:#374151;}
.gbtn.ok{background:#f0fdf4;color:var(--ok);border-color:#bbf7d0;}
.gbtn.no{background:#fef2f2;color:var(--bad);border-color:#fecaca;}
/* timeline (v5 / v4) */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlrow{position:relative;padding:0 0 18px;}
.tlrow:last-child{padding-bottom:0;}
.tlrow .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tlrow.done .dot{background:var(--ok);border-color:var(--ok);}
.tlrow.now .dot{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(251,146,60,.25);}
.tlrow b{font-size:13px;}
.tlrow .meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
/* feedback flow nodes (v4) */
.chain{display:flex;flex-wrap:wrap;gap:2px;align-items:stretch;}
.node{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:130px;}
.node .lv{font-size:10px;letter-spacing:.5px;color:var(--accent);font-weight:700;text-transform:uppercase;}
.node b{font-size:12.5px;display:block;margin-top:2px;}
.node small{font-size:11px;color:var(--muted);}
.arw{align-self:center;color:var(--muted);padding:0 4px;}
/* status station cards (v0 top) */
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px;}
.stn{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative;}
.stn .sd{position:absolute;right:11px;top:12px;width:9px;height:9px;border-radius:50%;}
.stn .sd.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.18);}
.stn .sd.wn{background:var(--warn);box-shadow:0 0 0 3px rgba(217,119,6,.18);}
.stn .sd.of{background:#9ca3af;}
.stn b{font-size:12.5px;display:block;}
.stn small{font-size:10.5px;color:var(--muted);}
.stn .rt{font-size:11px;margin-top:8px;color:#374151;font-weight:600;}
/* generic list */
.chklist>div{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.chklist>div:last-child{margin-bottom:0;}
.chklist .cn{width:130px;font-size:12.5px;font-weight:600;flex:none;min-width:0;}
.chklist .cv{width:44px;text-align:right;font-size:12.5px;font-weight:700;flex:none;}
/* mobile */
@media(max-width:1000px){
  .tnav{justify-content:flex-start;}
}
@media(max-width:860px){
  .kanban{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .hd{padding:14px 16px;}
  .wrap{padding:18px 14px 36px;}
  .topbar{padding:10px 14px;}
}
@media(max-width:560px){
  .tbtn .ttxt{display:none;}
  .tbtn{padding:9px 11px;}
  .kanban{grid-template-columns:1fr;}
  .brand span{display:none;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">visibility</span></div>
    <div><b>VisionHub</b><span>AOI/AVI 數據整合平台</span></div>
  </div>
  <nav class="tnav" id="tnav"></nav>
  <div class="topsp"></div>
  <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">sync</span>7 機台線上</span>
</div>
<div class="hd">
  <div class="tt"><h1 id="scT">—</h1><p id="scS">—</p></div>
  <span class="badge" id="scB"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>—</span>
</div>
<div class="wrap"><div id="view"></div></div>
<script>
(function(){
"use strict";
var MODS=[
  {icon:"factory",name:"多機台數據匯入",sub:"整合各廠牌 AOI/AVI 機台檢測數據",badge:"7 機台同步中"},
  {icon:"account_tree",name:"統一格式轉換",sub:"異質數據標準化與欄位對映",badge:"對映覆蓋 96%"},
  {icon:"fact_check",name:"離線複判站",sub:"缺陷影像人工覆判與真偽分類",badge:"待複判 148 張"},
  {icon:"biotech",name:"缺陷影像庫",sub:"缺陷影像分類標註與檢索",badge:"影像 84.6 萬張"},
  {icon:"insights",name:"數據回饋",sub:"複判結果回饋機台與 AI 模型",badge:"過殺率 -34%"},
  {icon:"trending_up",name:"良率分析",sub:"跨站良率與缺陷趨勢統計",badge:"直通良率 98.2%"}
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function kpi(lb,vl,dt,ic,dir,tail){
  var cls=dir==="up"?"up":(dir==="down"?"down":"");
  var ar=dir==="up"?"trending_up":(dir==="down"?"trending_down":"remove");
  var tailH=tail?'<span style="color:#9ca3af;font-weight:500"> · '+esc(tail)+'</span>':'';
  var dtH=dir?('<span class="material-symbols-outlined" style="font-size:15px">'+ar+'</span>'+esc(dt)):esc(dt);
  return '<div class="kpi"><span class="material-symbols-outlined ic">'+ic+'</span><div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+'</div><div class="dt '+cls+'">'+dtH+tailH+'</div></div>';
}

/* ---------- SCREEN 0 : 多機台數據匯入 (KANBAN signature) ---------- */
function s0(){
  var stns=[
    ["AOI-01 首件","A 廠牌","on","即時 · 12ms 延遲"],
    ["AOI-02 SMT線","B 廠牌","on","即時 · 9ms 延遲"],
    ["AOI-03 SMT線","D 廠牌","wn","延遲 4.2s 重試中"],
    ["AVI-04 外觀","C 廠牌","on","即時 · 15ms 延遲"],
    ["AVI-05 外觀","自製設備","on","批次 · 每 5 分鐘"],
    ["AOI-06 終檢","Saki","of","離線 · 排程維護"],
    ["AOI-07 DIP線","Test Research","on","即時 · 11ms 延遲"]
  ];
  var st=stns.map(function(x){
    return '<div class="stn"><span class="sd '+x[2]+'"></span><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small><div class="rt">'+esc(x[3])+'</div></div>';
  }).join('');
  var cols=[
    {h:"接收中",n:3,cards:[
      {t:"批 LT2408-A19","brand":"A 廠牌","cls":"","m":["AOI-01","4,820 點","07:52"],"p":72},
      {t:"批 LT2408-A20","brand":"B 廠牌","cls":"b2","m":["AOI-02","3,110 點","07:54"],"p":48},
      {t:"批 LT2408-A21","brand":"C 廠牌","cls":"b3","m":["AVI-04","1,960 點","07:55"],"p":31}
    ]},
    {h:"解析中",n:3,cards:[
      {t:"批 LT2408-A17","brand":"Saki","cls":"b4","m":["AOI-06","5,240 點","07:48"],"p":88},
      {t:"批 LT2408-A18","brand":"D 廠牌","cls":"","m":["AOI-03","2,730 點","07:50"],"p":64},
      {t:"批 LT2408-A16","brand":"自製設備","cls":"b2","m":["AVI-05","1,420 點","07:46"],"p":55}
    ]},
    {h:"已入庫",n:2,cards:[
      {t:"批 LT2408-A15","brand":"Test Research","cls":"b3","m":["AOI-07","6,010 點","07:44"],"p":100},
      {t:"批 LT2408-A14","brand":"A 廠牌","cls":"","m":["AOI-01","4,190 點","07:40"],"p":100}
    ]},
    {h:"匯入失敗",n:1,cards:[
      {t:"批 LT2408-A13","brand":"D 廠牌","cls":"","m":["AOI-03","欄位缺漏","07:38"],"p":0,"err":true}
    ]}
  ];
  var kb="";
  cols.forEach(function(c){
    var inner="";
    c.cards.forEach(function(k){
      var pcolor=k.err?"var(--bad)":"";
      var prog='<div class="prog"><div class="bar"><i style="width:'+k.p+'%'+(pcolor?';background:'+pcolor:'')+'"></i></div></div>';
      inner+='<div class="kcard '+k.cls+'"><div class="kh"><b>'+esc(k.t)+'</b><span class="brandtag">'+esc(k.brand)+'</span></div><div class="meta">'+k.m.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'+prog+'</div>';
    });
    kb+='<div class="kcol"><h4>'+esc(c.h)+'<span class="cnt">'+c.n+'</span></h4>'+inner+'</div>';
  });
  return '<div class="grid g4">'
    +kpi("線上機台","7","家中 6 家連線","lan","up","1 台維護中")
    +kpi("今日匯入批次","128","來自 5 廠牌","download","up","+22 vs 昨")
    +kpi("匯入成功率","98.4%","失敗自動重送","task_alt","up","+1.2pt")
    +kpi("待解析佇列","36","筆數據封包","pending","down","本時 -9")
    +'</div>'
    +'<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">dashboard</span>多機台數據匯入看板</h3><p class="sub">各批次檢測數據從接收、解析到入庫的即時流轉；色條標示來源廠牌</p><div class="scroll"><div class="kanban" style="min-width:0">'+kb+'</div></div></div>'
    +'<div class="grid g23" style="margin-top:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>機台數據流量（近 8 小時）</h3><p class="sub">各廠牌機台每小時上傳檢測點數（千點）</p><div id="c0a" class="chart"></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">device_hub</span>機台連線狀態</h3><p class="sub">7 台 AOI/AVI 設備即時連線與延遲</p><div class="stations" style="margin-top:4px">'+st+'</div></div>'
    +'</div>';
}
function c0(){
  mk("c0a",{tooltip:{trigger:"axis"},legend:{data:["A 廠牌","B 廠牌","C 廠牌","其他廠牌"],top:0,textStyle:{fontSize:11}},
    grid:{left:36,right:14,top:30,bottom:26},
    xAxis:{type:"category",data:["01","02","03","04","05","06","07","08"],axisLabel:{color:"#6b7280"},axisLine:{lineStyle:{color:"#d1d5db"}}},
    yAxis:{type:"value",axisLabel:{color:"#6b7280"},splitLine:{lineStyle:{color:"#eef0f3"}}},
    series:[
      {name:"A 廠牌",type:"bar",stack:"a",barWidth:22,data:[18,21,19,24,22,20,25,23],itemStyle:{color:"#ea580c"}},
      {name:"B 廠牌",type:"bar",stack:"a",barWidth:22,data:[12,14,13,15,16,14,17,16],itemStyle:{color:"#fb923c"}},
      {name:"C 廠牌",type:"bar",stack:"a",barWidth:22,data:[8,9,7,10,9,11,10,12],itemStyle:{color:"#2563eb"}},
      {name:"其他廠牌",type:"bar",stack:"a",barWidth:22,data:[10,11,9,12,13,10,14,13],itemStyle:{color:"#94a3b8",borderRadius:[4,4,0,0]}}
    ]});
}

/* ---------- SCREEN 1 : 統一格式轉換 ---------- */
