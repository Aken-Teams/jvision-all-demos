<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>倉儲設備與堆高機管理 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --color-primary:#334155;
  --color-on-primary:#FFFFFF;
  --color-secondary:#475569;
  --color-on-secondary:#FFFFFF;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F2F3F4;
  --color-muted-foreground:#475569;
  --color-border:#E6E8EA;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E6E8EA;
  --accent:#059669;
  --accent2:#10B981;
  --accent-soft:#D1FAE5;
  --accent-soft2:#ECFDF5;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --th:#F2F3F4;
  --hov:#F8FAFC;
  --track:#E2E8F0;
  --sidebar:#FFFFFF;
  --sidebar2:#FFFFFF;
  --side-edge:#E6E8EA;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#334155;
  --r:8px;
  --glow:rgba(5,150,105,.16);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b{
  margin:0;
  color:var(--color-foreground);
  font-family:"Poppins","Open Sans",sans-serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px;
}
::selection{background:#A7F3D0;color:#064E3B}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:252px;
  min-width:0;
  height:100vh;
  padding:28px 18px 20px;
  overflow-y:auto;
  background:var(--color-card);
  color:var(--color-foreground);
  border-right:1px solid var(--color-border);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 8px 28px;
  border-bottom:1px solid var(--color-border);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:6px;
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:var(--color-muted-foreground);
  font-size:10px;
  font-weight:700;
  letter-spacing:.14em;
}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:22px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-width:0;
  min-height:44px;
  padding:10px 11px;
  color:var(--color-muted-foreground);
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{
  color:var(--color-foreground);
  background:var(--color-muted);
  border-color:var(--color-border);
  transform:translateX(2px);
}
.nav button.on{
  color:#065F46;
  font-weight:700;
  background:var(--accent-soft2);
  border-color:#A7F3D0;
}
.nav button.on::before{
  position:absolute;
  top:9px;
  bottom:9px;
  left:-12px;
  width:3px;
  background:var(--color-accent);
  border-radius:0 2px 2px 0;
  content:"";
}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Poppins",sans-serif;
  font-size:10px;
  font-variant-numeric:tabular-nums;
  font-weight:600;
  opacity:.65;
}
.side-foot{
  margin-top:auto;
  padding:18px 9px 2px;
  color:var(--color-muted-foreground);
  font-size:10.5px;
  font-variant-numeric:tabular-nums;
  line-height:1.75;
  border-top:1px solid var(--color-border);
}
.side-foot b{color:var(--color-foreground)}

.main{flex:1;min-width:0;padding:30px clamp(20px,3vw,44px) 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  max-width:1600px;
  margin:0 auto 24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--color-border);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(20px,2vw,25px);
  font-weight:600;
  letter-spacing:-.025em;
}
.topbar h1 .material-symbols-outlined{color:var(--color-accent);font-size:27px}
.topbar .sub{margin-top:5px;color:var(--color-muted-foreground);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:var(--color-muted-foreground);
  font-size:11.5px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:6px;
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #D1FAE5;
  border-radius:50%;
  box-shadow:0 0 0 2px var(--ok);
  animation:pulse 2.4s ease-in-out infinite;
}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:var(--color-on-primary);
  font-family:"Poppins",sans-serif;
  font-size:12px;
  font-weight:600;
  background:var(--color-primary);
  border-radius:6px;
}
#screen{max-width:1600px;margin:0 auto}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.card,.sec{min-width:0;padding:18px}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{
  border-color:#CBD5E1;
  box-shadow:0 2px 3px rgba(15,23,42,.05),0 10px 24px rgba(15,23,42,.07);
}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:14px;
  font-weight:600;
}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{
  color:var(--color-accent);
  font-size:19px;
}
.sec>p{margin:0 0 14px;color:var(--color-muted-foreground);font-size:13px;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .hint{color:var(--color-muted-foreground);font-size:11px;font-variant-numeric:tabular-nums}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{
  position:relative;
  min-width:0;
  min-height:148px;
  padding:17px 18px;
  overflow:hidden;
}
.kpi::before,.stat::before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--color-accent);
  content:"";
  opacity:.85;
}
.kpi::after{display:none}
.kpi .ico{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#047857;
  background:var(--accent-soft2);
  border:1px solid #A7F3D0;
  border-radius:6px;
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  color:var(--color-muted-foreground);
  font-size:11.5px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:var(--color-foreground);
  font-family:"Poppins",sans-serif;
  font-variant-numeric:tabular-nums;
  font-weight:600;
  letter-spacing:-.035em;
}
.kpi .val,.stat .val{font-size:26px}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:6px;
  font-size:11px;
  font-weight:700;
}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--color-muted-foreground)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.tile{
  position:relative;
  display:grid;
  grid-template-columns:40px minmax(0,1fr);
  grid-template-rows:auto auto auto;
  gap:2px 12px;
  min-width:0;
  min-height:146px;
  padding:18px;
  overflow:hidden;
}
.tile::after{
  position:absolute;
  top:0;
  right:0;
  width:44px;
  height:3px;
  background:var(--color-accent);
  content:"";
}
.tile .ti{
  display:flex;
  grid-row:1 / span 2;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  color:#047857;
  background:var(--accent-soft2);
  border:1px solid #A7F3D0;
  border-radius:6px;
}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{align-self:end;font-size:12px;font-weight:700}
.tile .tv{align-self:start;font-size:23px}
.tile p{grid-column:1 / -1;margin:11px 0 0;color:var(--color-muted-foreground);font-size:11.5px;line-height:1.55}

.card.pad0 .card-h{padding:18px 18px 0!important}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:11px 13px;
  color:var(--color-muted-foreground);
  text-align:left;
  white-space:nowrap;
  background:var(--color-muted);
  border-top:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);
  font-family:"Open Sans",sans-serif;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
}
td{
  height:43px;
  padding:10px 13px;
  color:var(--color-card-foreground);
  white-space:nowrap;
  background:var(--color-card);
  border-bottom:1px solid var(--color-border);
  transition:background-color .18s ease;
}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hov)}
td:nth-child(n+4),th:nth-child(n+4){text-align:right}
td:last-child,th:last-child{text-align:left}
.mono,td:first-child{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
  letter-spacing:.01em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
}
.tag::before{width:5px;height:5px;background:currentColor;border-radius:50%;content:""}
.t-ok{color:#047857;background:#ECFDF5}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-info{color:#334155;background:#F1F5F9}
.t-gray{color:#475569;background:#F8FAFC}
.t-acc,.t-pink{color:#047857;background:#ECFDF5}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-accent);border-radius:2px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--color-muted-foreground);font-size:10.5px;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

.tl{position:relative;padding-left:26px}
.tl::before{position:absolute;top:4px;bottom:4px;left:7px;width:1px;background:var(--color-border);content:""}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-25px;
  width:13px;
  height:13px;
  background:var(--color-card);
  border:3px solid var(--color-accent);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--color-muted-foreground);font-size:10.5px;font-variant-numeric:tabular-nums;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--color-muted-foreground);font-size:11.5px}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;font-size:12.5px;border-bottom:1px dashed var(--color-border)}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--color-muted-foreground)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--color-muted-foreground);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--color-muted-foreground);font-size:11.5px;line-height:1.7;border-top:1px dashed var(--color-border)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--color-muted);border:1px solid var(--color-border);border-radius:6px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:var(--color-muted-foreground);font-size:10.5px;background:var(--color-card);border:1px solid var(--color-border);border-radius:4px}
.pcard{padding:11px 12px;background:var(--color-card);border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:5px}
.pcard:hover{border-color:#94A3B8;transform:translateY(-1px)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--color-foreground);font-size:11px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#065F46;font-weight:800;background:var(--accent-soft);border-radius:4px}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:var(--color-card);border:1px solid var(--color-border);border-radius:6px}
.lane-row:hover{border-color:#94A3B8;transform:translateY(-1px)}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:31px;height:31px;color:#065F46;font-family:"Poppins",sans-serif;font-size:12px;font-weight:700;background:var(--accent-soft);border-radius:4px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--color-muted-foreground);font-size:11.5px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--color-muted-foreground);font-size:10px;background:var(--color-card);border:2px solid var(--color-border);border-radius:50%}
.steps .ln{width:20px;height:2px;background:var(--color-border)}
.steps .s.done{color:var(--color-on-primary);background:var(--color-accent);border-color:var(--color-accent)}
.steps .s.cur{color:#047857;border-color:var(--color-accent);animation:pulse 1.8s ease-in-out infinite}
.steps .ln.done{background:var(--color-accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--color-border)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--color-muted-foreground);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--color-accent);border-radius:2px}
.gauge small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border-radius:4px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:4px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--color-muted-foreground)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--color-accent);border-radius:2px;box-shadow:0 2px 6px var(--glow)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,.8fr);gap:16px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1 / -1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1 / -1}
}
@media(max-width:1100px){

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
