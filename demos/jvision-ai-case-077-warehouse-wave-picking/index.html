<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>倉儲波次出貨艙 · Wave Picking Ops</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#b45309;--accent2:#f59e0b;--ink:#292018;--bg:#f7f3ec;--card:#fff;--line:#e7dccb;--mut:#8a7a62;--ok:#4d7c0f;--warn:#d97706;--bad:#c2410c;--info:#a16207}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(190deg,#3b2a17,#2a1d10);color:#e7d8c3;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;min-width:0}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 20px rgba(180,83,9,.5);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:9.5px;color:var(--accent2);letter-spacing:1.4px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#d8c6ad;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#a98f6c}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#a98f6c;border-top:1px solid rgba(255,255,255,.1);line-height:1.7}
.main{padding:22px 24px;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fdefd9;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent2),var(--accent))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.3}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#ecfccb;color:#3f6212}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffedd5;color:#c2410c}.t-info{background:#f3e8d6;color:#8a6d3b}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf6ef}
.scroll{overflow-x:auto}
.bar{height:8px;background:#f0e7d7;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* wave kanban */
.wk{display:flex;flex-direction:column;gap:11px}
.wave{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#fffdf9}
.wave .wtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.wave .wtop b{font-family:Inter;font-weight:800;font-size:14px}
.wave .wtop .mt{color:var(--mut);font-size:11.5px}
.wave .wtop .sp{margin-left:auto}
.pickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.pk .pn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-bottom:5px}
.pk .pn .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.pk .pv{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:4px}
/* heat grid picking zones */
.zone{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.zc{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;position:relative}
.zc.pathnode{outline:2px solid #1f2937;outline-offset:-2px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--mut)}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart{height:250px}
/* pick task list */
.pl{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12.5px;background:#fff}
.pi .seq{width:26px;height:26px;border-radius:8px;background:#3b2a17;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.pi .loc{background:#f3e8d6;color:#8a6d3b;padding:2px 8px;border-radius:6px;font-weight:800;font-size:11.5px;font-family:Inter}
.pi .nm{flex:1;min-width:0}
.pi .nm b{font-family:"Noto Sans TC";font-size:12.5px}
.pi .nm small{display:block;color:var(--mut);font-size:11px}
.pi .qt{font-weight:800;font-family:Inter;color:var(--accent)}
/* pack station */
.pack{display:flex;flex-direction:column;gap:8px}
.pc{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;flex-wrap:wrap;background:#fff}
.pc .material-symbols-outlined{color:var(--accent)}
.pc code{background:#f3ede2;padding:2px 7px;border-radius:5px;font-size:11.5px;color:var(--accent);font-weight:700}
.pc .tm{margin-left:auto;color:var(--mut);font-size:11px}
/* dock */
.dock{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.db{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fffdf9;min-width:0}
.db .dh{display:flex;align-items:center;gap:7px;font-weight:800;font-family:Inter;font-size:14px;margin-bottom:6px}
.db .dh .material-symbols-outlined{color:var(--accent)}
.db small{color:var(--mut);font-size:11px;display:block;line-height:1.6}
.db.free{background:#f3ede2;border-style:dashed}
.mini{font-size:11.5px;color:var(--mut);margin:10px 0 0;line-height:1.6}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side .foot{display:none}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11{grid-template-columns:1fr}.zone{grid-template-columns:repeat(8,1fr)}}
@media(max-width:430px){.zone{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">波</div><div><b>倉儲波次出貨艙</b><span>WAVE PICKING OPS</span></div></div>
    <div id="nav"></div>
    <div class="foot">出貨訂單 386 · 進行波次 4<br/>揀貨員 12 · 覆核站 3<br/>今日準點率 96.4%</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">出貨總覽</h2><p id="vd"></p></div><div class="live"><i></i>波次即時同步</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["出貨總覽","dashboard","出貨總覽","出貨戰情、波次進度與準點率全局監控"],
["訂單波次","waves","訂單波次規劃","訂單合併分波、揀貨策略與人力配置"],
["揀貨任務","route","揀貨任務與路徑","揀貨員任務派工、儲區熱區與最短路徑"],
["覆核打包","fact_check","覆核打包","揀貨覆核、裝箱打包與出貨標籤列印"],
["出貨裝車","local_shipping","出貨裝車","月台指派、裝車排程與物流交運"],
["出貨績效","monitoring","出貨績效","波次工時、揀貨效率與準點率分析"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

// ---- data ----
const WAVES=[
 ["WV-2408","批量揀貨 · 電商 B2C","86 單 / 214 行","截車 15:30",[["王","王志明",78],["陳","陳怡君",64],["林","林大維",52]],"揀貨中","t-info"],
 ["WV-2407","分區揀貨 · 門市補貨","12 店 / 340 行","截車 16:00",[["李","李欣妤",92],["張","張建宏",88]],"覆核中","t-warn"],
 ["WV-2406","急單合併 · VIP","9 單 / 41 行","截車 14:00",[["黃","黃冠廷",100]],"待裝車","t-warn"],
 ["WV-2405","整棧出貨 · 通路","4 棧 / 96 行","截車 13:00",[["吳","吳孟儒",100],["蔡","蔡佳穎",100]],"已出貨","t-ok"]
];
const HOTZONE=[["A 快速揀取區",92,"高"],["B 電商小件",81,"高"],["C 常溫散貨",64,"中"],["D 大件棧板",47,"中"],["E 退換暫存",28,"低"]];
const PATH=[
 [1,"A-01-03","無線藍牙耳機","出貨 4 件",4],
 [2,"A-02-07","行動電源 10000mAh","出貨 6 件",6],
 [3,"A-04-12","USB-C 快充線","出貨 8 件",8],
 [4,"B-01-05","保護殼 iPhone","出貨 3 件",3],
 [5,"B-03-09","鋼化玻璃貼","出貨 5 件",5],
 [6,"C-02-01","無線滑鼠","出貨 2 件",2]
];
const PACKQ=[
 ["覆核通過","PK-5581","WV-2408 · 12 項 / 34 件","裝箱 1 箱","10:41","t-ok"],
 ["列印標籤","PK-5580","WV-2408 · 8 項 / 21 件","O貓宅配","10:43","t-info"],
 ["數量不符","PK-5579","WV-2407 · 少 1 件補揀","退回揀貨","10:45","t-bad"],
 ["覆核通過","PK-5578","WV-2407 · 20 項 / 88 件","裝箱 3 箱","10:47","t-ok"],
 ["列印標籤","PK-5577","WV-2406 · VIP 加購禮","O光物流","10:49","t-info"]
];
const DOCKS=[
 ["月台 1","O貓宅配","WV-2405 · 96 箱","裝車中 72%","出發 13:00","t-info"],
 ["月台 2","O光物流","WV-2406 · 41 箱","待裝車","出發 14:00","t-warn"],
 ["月台 3","","—","空閒可指派","",""],
 ["月台 4","O榮貨運","WV-2404 · 210 箱","已交運","發車 11:20","t-ok"]
];
const ZONECOLOR=v=>v>=85?'#c2410c':v>=65?'#f59e0b':v>=45?'#eab308':v>=25?'#a3a635':'#84a35a';

// ---- screens ----
const SCREENS=[
// v0 出貨總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">receipt_long</span><div class="l">今日待出貨</div><div class="v">386<small style="font-size:12px"> 單</small></div><div class="d up">▲ 較昨 +42</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">waves</span><div class="l">進行中波次</div><div class="v">4<small style="font-size:12px"> / 9</small></div><div class="d" style="color:var(--mut)">2 待裝車</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">bolt</span><div class="l">每人時揀貨行</div><div class="v">118<small style="font-size:12px"> 行</small></div><div class="d up">▲ 較目標 +14</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">schedule</span><div class="l">準點出貨率</div><div class="v">96.4<small style="font-size:12px">%</small></div><div class="d up">▲ 較上週 +3.1</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">grid_view</span>波次揀貨看板 <span class="tag t-info" style="margin-left:auto">波次 → 揀貨員進度</span></h3><div class="wk">${WAVES.map(w=>`<div class="wave"><div class="wtop"><b>${w[0]}</b><span class="mt">${w[1]} · ${w[2]}</span><span class="mt sp">${w[3]}</span><span class="tag ${w[6]}">${w[5]}</span></div><div class="pickers">${w[4].map(p=>`<div class="pk"><div class="pn"><span class="av">${p[0]}</span>${p[1]}</div><div class="bar"><i style="width:${p[2]}%"></i></div><div class="pv"><span>揀貨進度</span><span>${p[2]}%</span></div></div>`).join('')}</div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">local_fire_department</span>儲區揀貨熱區</h3>${HOTZONE.map(h=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">${h[0]}</b><span style="color:var(--accent);font-weight:800">${h[1]}%</span></div><div class="bar"><i style="width:${h[1]}%"></i></div><small style="color:var(--mut);font-size:10.5px">壅塞程度 ${h[2]}</small></div>`).join('')}<h3 style="margin-top:14px"><span class="material-symbols-outlined">insights</span>今日出貨時段</h3><div class="chart" style="height:160px" id="c_ov"></div></div>
</div>`,

// v1 訂單波次規劃
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">waves</span>訂單分波規劃 <span class="tag t-warn" style="margin-left:auto">待釋放 2 波</span></h3><div class="scroll"><table class="data"><tr><th>波次</th><th>揀貨策略</th><th>訂單 / 行數</th><th>截車時間</th><th>指派人力</th><th>狀態</th></tr>
${[["WV-2409","批量揀貨","124 單 / 302 行","17:00","未指派","待釋放","t-warn"],["WV-2408","批量揀貨","86 單 / 214 行","15:30","3 人","揀貨中","t-info"],["WV-2407","分區揀貨","12 店 / 340 行","16:00","2 人","覆核中","t-info"],["WV-2406","急單合併","9 單 / 41 行","14:00","1 人","待裝車","t-warn"],["WV-2405","整棧出貨","4 棧 / 96 行","13:00","2 人","已出貨","t-ok"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><span class="tag ${r[6]}">${r[5]}</span></td></tr>`).join('')}</table></div><p class="mini">RULE-01：依出貨截止時間、貨主與儲區合併訂單成波，尖峰時段自動加派揀貨人力。</p></div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_small</span>波次揀貨策略占比</h3><div class="chart" id="c_wave"></div></div></div>`,

// v2 揀貨任務與路徑
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">alt_route</span>WV-2408 揀貨任務路徑 <span class="tag t-info" style="margin-left:auto">王志明 · PDA-07</span></h3><div class="pl">${PATH.map(p=>`<div class="pi"><span class="seq">${p[0]}</span><span class="loc">${p[1]}</span><span class="nm"><b>${p[2]}</b><small>${p[3]}</small></span><span class="qt">×${p[4]}</span></div>`).join('')}</div><p class="mini">依儲位座標計算最短揀貨路徑，PDA 逐項語音導引與掃碼確認。</p></div>
 <div class="card"><h3><span class="material-symbols-outlined">grid_on</span>A 區儲位熱區 / 揀取路徑</h3><div class="zone" id="zone"></div><div class="lgd"><span><i style="background:#c2410c"></i>壅塞</span><span><i style="background:#f59e0b"></i>繁忙</span><span><i style="background:#eab308"></i>一般</span><span><i style="background:#84a35a"></i>閒置</span><span><i style="background:#fff;border:2px solid #1f2937"></i>路徑節點</span></div></div></div>`,

// v3 覆核打包
()=>`<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>覆核打包站即時軌跡 <span class="tag t-bad" style="margin-left:auto">數量不符 1</span></h3><div class="pack">${PACKQ.map(s=>`<div class="pc"><span class="material-symbols-outlined">${s[0]=='數量不符'?'error':s[0]=='列印標籤'?'print':'check_circle'}</span><b style="font-family:Noto Sans TC">${s[0]}</b><code>${s[1]}</code><span>${s[2]}</span><span class="tag ${s[5]}">${s[3]}</span><span class="tm">${s[4]}</span></div>`).join('')}</div>
<div class="grid g11" style="margin-top:16px"><div class="card" style="border:1px solid var(--line)"><h3><span class="material-symbols-outlined">inventory_2</span>裝箱明細（PK-5578）</h3><div class="scroll"><table class="data"><tr><th>箱號</th><th>品項數</th><th>件數</th><th>材積</th><th>重量</th></tr>${[["CTN-01","8","32","60×40×35","6.4kg"],["CTN-02","7","28","60×40×35","5.1kg"],["CTN-03","5","28","50×35×30","4.8kg"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div></div>
<div class="card" style="border:1px solid var(--line)"><h3><span class="material-symbols-outlined">verified</span>覆核通過率</h3><div class="chart" style="height:210px" id="c_pack"></div></div></div></div>`,

// v4 出貨裝車
