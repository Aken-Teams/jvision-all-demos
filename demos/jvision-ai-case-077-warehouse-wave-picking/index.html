<style>
:root{
--color-primary:#334155;--color-on-primary:#fff;--color-secondary:#475569;--color-on-secondary:#fff;
--color-accent:#059669;--color-on-accent:#000;--color-background:#f8fafc;--color-foreground:#0f172a;
--color-card:#fff;--color-card-foreground:#0f172a;--color-muted:#f2f3f4;--color-muted-foreground:#475569;
--color-border:#e6e8ea;--color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#334155;
--blue:#334155;--ink:#0f172a;--muted:#475569;--line:#e6e8ea;
--ok:#047857;--warn:#a16207;--bad:#dc2626;--info:#334155
}
*{box-sizing:border-box}
html{background:var(--color-background)}
body{margin:0;min-width:320px;background:var(--color-background);color:var(--ink);font-family:"Open Sans",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;background:var(--color-primary);color:#fff;border-right:4px solid var(--ink)}
.bd{display:flex;align-items:center;gap:12px;padding:22px 18px;border-bottom:2px solid #94a3b8}
.lg{width:48px;height:48px;display:grid;place-items:center;flex:none;background:var(--color-accent);border:2px solid #fff;color:#00150d;font:700 20px Poppins,sans-serif}
.bd b{display:block;font:700 16px Poppins,"Open Sans",sans-serif;letter-spacing:.02em}
.bd span{display:block;margin-top:2px;color:#dbeafe;font:600 9px Poppins,sans-serif;letter-spacing:.16em}
#nav{padding:14px 0}
.side button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;background:transparent;border:0;border-bottom:1px solid #64748b;color:#f8fafc;text-align:left;font-weight:700;transition:background-color .18s,color .18s}
.side button:first-child{border-top:1px solid #64748b}
.side button:hover{background:#475569}
.side button.on{background:var(--color-accent);color:#00150d}
.side button.on::after{content:"";position:absolute;right:0;top:0;width:8px;height:100%;background:#fff}
.side button .material-symbols-outlined{color:#cbd5e1}
.side button.on .material-symbols-outlined{color:#00150d}
.foot{margin-top:auto;padding:18px;color:#e2e8f0;border-top:2px solid #94a3b8;font:500 11px/1.8 "Open Sans",sans-serif}
.main{min-width:0;padding:28px clamp(16px,3vw,42px) 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;padding-bottom:18px;border-bottom:3px solid var(--ink)}
.vh h2{margin:0;font:700 clamp(24px,3vw,38px)/1.05 Poppins,"Open Sans",sans-serif;letter-spacing:-.04em}
.vh p{margin:8px 0 0;color:var(--muted);font-size:13px}
.live{display:flex;align-items:center;gap:8px;flex:none;padding:9px 13px;background:#d1fae5;border:2px solid #047857;color:#064e3b;font-weight:700}
.live i{width:9px;height:9px;background:#047857;border:2px solid #fff;outline:1px solid #047857}
#view>*,.card,.kpi{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:22px;border:2px solid var(--ink)}
.kpi{position:relative;min-width:0;padding:19px 18px;background:var(--color-card);border-right:2px solid var(--ink)}
.kpi:last-child{border-right:0}
.kpi::before{content:"";position:absolute;left:0;top:0;width:100%;height:6px;background:var(--color-accent)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700}
.kpi .v{margin-top:4px;font:700 27px/1.2 Poppins,sans-serif;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:"Open Sans",sans-serif;font-weight:600}
.kpi .d{margin-top:5px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:16px;color:var(--color-primary)}
.up{color:#047857}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{min-width:0;padding:18px;background:var(--color-card);border:2px solid var(--ink)}
.card:nth-child(even){transform:translateY(8px)}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;padding-bottom:11px;border-bottom:2px solid var(--line);font:700 15px Poppins,"Open Sans",sans-serif}
.card h3 .material-symbols-outlined{color:var(--color-accent)}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border:1px solid currentColor;font-size:10.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.t-ok{background:#d1fae5;color:#065f46}.t-warn{background:#fef3c7;color:#854d0e}
.t-bad{background:#fee2e2;color:#991b1b}.t-info{background:#e2e8f0;color:#1e293b}
.scroll{overflow-x:auto;border:1px solid var(--line)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th:last-child,table.data td:last-child{border-right:0}
table.data tr:last-child td{border-bottom:0}
table.data th{background:var(--color-primary);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.02em}
table.data tbody tr:hover td,table.data tr:not(:first-child):hover td{background:#ecfdf5}
table.data td:nth-child(1),table.data td:nth-child(3),table.data td:nth-child(4),table.data td:nth-child(5){font-variant-numeric:tabular-nums}
.bar{height:10px;overflow:hidden;background:#e2e8f0;border:1px solid #94a3b8}
.bar i{display:block;height:100%;background:var(--color-accent)}
.wk{display:flex;flex-direction:column;gap:12px}
.wave{padding:13px;background:#fff;border:1px solid var(--ink);border-left:7px solid var(--color-primary)}
.wtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.wtop b{font:700 14px Poppins,sans-serif;font-variant-numeric:tabular-nums}
.wtop .mt{color:var(--muted);font-size:11.5px}.wtop .sp{margin-left:auto}
.pickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.pk{min-width:0;padding:9px;background:var(--color-muted);border:1px solid var(--line)}
.pn{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;font-weight:700}
.av{width:23px;height:23px;display:grid;place-items:center;flex:none;background:var(--color-primary);color:#fff;font-size:10px;font-weight:700}
.pv{display:flex;justify-content:space-between;margin-top:5px;color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.zone{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px;background:#e2e8f0;border:2px solid var(--ink)}
.zc{aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(15,23,42,.45);color:#fff;font-size:9px;font-weight:700}
.zc.pathnode{outline:3px solid #0f172a;outline-offset:-3px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:11.5px}
.lgd span{display:inline-flex;align-items:center;gap:6px}.lgd i{width:13px;height:13px;display:inline-block;border:1px solid #475569}
.chart{height:250px}
.pl,.pack{display:flex;flex-direction:column;gap:8px}
.pi,.pc{display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;border:1px solid var(--ink);font-size:12.5px}
.pi .seq{width:28px;height:28px;display:grid;place-items:center;flex:none;background:var(--color-primary);color:#fff;font:700 12px Poppins,sans-serif}
.pi .loc,.pc code{padding:3px 7px;background:#e2e8f0;color:#1e293b;border:1px solid #94a3b8;font:700 11.5px ui-monospace,SFMono-Regular,Consolas,monospace}
.pi .nm{flex:1;min-width:0}.pi .nm b{font-size:12.5px}.pi .nm small{display:block;color:var(--muted);font-size:11px}
.pi .qt{color:#047857;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace}
.pc{flex-wrap:wrap;border-left:6px solid var(--color-primary)}
.pc .material-symbols-outlined{color:var(--color-primary)}
.pc .tm{margin-left:auto;color:var(--muted);font:500 11px ui-monospace,SFMono-Regular,Consolas,monospace}
.dock{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.db{min-width:0;padding:13px;background:#fff;border:2px solid var(--ink);border-top:7px solid var(--color-accent)}
.db .dh{display:flex;align-items:center;gap:7px;margin-bottom:7px;font:700 14px Poppins,sans-serif}
.db .dh .material-symbols-outlined{color:var(--color-primary)}
.db small{display:block;color:var(--muted);font-size:11px;line-height:1.7}
.db.free{background:var(--color-muted);border-top-color:#94a3b8;border-style:dashed}
.mini{margin:12px 0 0;padding:10px;background:var(--color-muted);border-left:5px solid var(--color-primary);color:var(--muted);font-size:11.5px;line-height:1.6}
code,.loc,.seq,.wtop b,table.data td:first-child{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
@media(max-width:1024px){.shell{grid-template-columns:220px minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:2px solid var(--ink)}.g2{grid-template-columns:1fr}.card:nth-child(even){transform:none}}
@media(max-width:768px){
.shell{display:block}.side{position:static;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
.bd{padding:15px 16px}.lg{width:40px;height:40px}
#nav{display:flex;overflow-x:auto;padding:0}.side button{width:auto;min-width:max-content;padding:12px 15px;border-right:1px solid #64748b;border-bottom:0}.side button:first-child{border-top:0}.side button.on::after{top:auto;bottom:0;width:100%;height:5px}.foot{display:none}
.main{padding:20px 16px 36px}.vh{align-items:flex-start}.vh h2{font-size:27px}.live{font-size:11px}.g11{grid-template-columns:1fr}.zone{grid-template-columns:repeat(8,1fr)}
}
@media(max-width:480px){
.vh{display:block}.live{width:max-content;margin-top:14px}.kpis{display:block;border-bottom:0}.kpi{border-right:0;border-bottom:2px solid var(--ink)}.kpi:last-child{border-bottom:2px solid var(--ink)}
.card{padding:14px}.zone{grid-template-columns:repeat(6,1fr)}.pi{display:grid;grid-template-columns:auto auto 1fr auto}.pi .nm{grid-column:3}.pc .tm{margin-left:0;width:100%;text-align:right}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
#view>*,.card,.kpi{animation:none!important}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<div class="bd"><div class="lg">倉</div><div><b>倉庫揀貨出貨排程台</b><span>FULFILLMENT OPERATIONS</span></div></div>

<main class="main">

<script>
const MOD=[["出貨總覽","dashboard","出貨總覽","出貨戰情、波次進度與準點率全局監控"],["訂單波次","waves","訂單波次規劃","訂單合併分波、揀貨策略與人力配置"],["揀貨任務","route","揀貨任務與路徑","揀貨員任務派工、儲區熱區與最短路徑"],["覆核打包","fact_check","覆核打包","揀貨覆核、裝箱打包與出貨標籤列印"],["出貨裝車","local_shipping","出貨裝車","月台指派、裝車排程與物流交運"],["出貨績效","monitoring","出貨績效","波次工時、揀貨效率與準點率分析"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{const b=document.createElement("button");b.dataset.i=i;b.className=i===0?"on":"";b.innerHTML=`<span class="material-symbols-outlined">${m[1]}</span>${m[0]}`;b.onclick=()=>show(i);nav.appendChild(b)});

const WAVES=[
["WV-2408","批量揀貨 · 電商 B2C","86 單 / 214 行","截車 15:30",[["王","王志明",78],["陳","陳怡君",64],["林","林大維",52]],"揀貨中","t-info"],

const PACKQ=[["覆核通過","PK-5581","WV-2408 · 12 項 / 34 件","裝箱 1 箱","10:41","t-ok"],["列印標籤","PK-5580","WV-2408 · 8 項 / 21 件","O貓宅配","10:43","t-info"],["數量不符","PK-5579","WV-2407 · 少 1 件補揀","退回揀貨","10:45","t-bad"],["覆核通過","PK-5578","WV-2407 · 20 項 / 88 件","裝箱 3 箱","10:47","t-ok"],["列印標籤","PK-5577","WV-2406 · VIP 加購禮","O光物流","10:49","t-info"]];
const DOCKS=[["月台 1","O貓宅配","WV-2405 · 96 箱","裝車中 72%","出發 13:00","t-info"],["月台 2","O光物流","WV-2406 · 41 箱","待裝車","出發 14:00","t-warn"],["月台 3","","—","空閒可指派","",""],["月台 4","O榮貨運","WV-2404 · 210 箱","已交運","發車 11:20","t-ok"]];
const ZONECOLOR=v=>v>=85?"#b91c1c":v>=65?"#b45309":v>=45?"#4d7c0f":v>=25?"#047857":"#475569";

const SCREENS=[
()=>`<div class="kpis">
<div class="kpi"><span class="material-symbols-outlined ic">receipt_long</span><div class="l">今日待出貨</div><div class="v">386<small> 單</small></div><div class="d up">▲ 較昨 +42</div></div>
<div class="kpi"><span class="material-symbols-outlined ic">waves</span><div class="l">進行中波次</div><div class="v">4<small> / 9</small></div><div class="d" style="color:var(--muted)">2 待裝車</div></div>
<div class="kpi"><span class="material-symbols-outlined ic">bolt</span><div class="l">每人時揀貨行</div><div class="v">118<small> 行</small></div><div class="d up">▲ 較目標 +14</div></div>
<div class="kpi"><span class="material-symbols-outlined ic">schedule</span><div class="l">準點出貨率</div><div class="v">96.4<small>%</small></div><div class="d up">▲ 較上週 +3.1</div></div>
</div><div class="grid g2">
<div class="card"><h3><span class="material-symbols-outlined">grid_view</span>波次揀貨看板 <span class="tag t-info" style="margin-left:auto">波次 → 揀貨員進度</span></h3><div class="wk">${WAVES.map(w=>`<div class="wave"><div class="wtop"><b>${w[0]}</b><span class="mt">${w[1]} · ${w[2]}</span><span class="mt sp">${w[3]}</span><span class="tag ${w[6]}">${w[5]}</span></div><div class="pickers">${w[4].map(p=>`<div class="pk"><div class="pn"><span class="av">${p[0]}</span>${p[1]}</div><div class="bar"><i style="width:${p[2]}%"></i></div><div class="pv"><span>揀貨進度</span><span>${p[2]}%</span></div></div>`).join("")}</div></div>`).join("")}</div></div>

</div>`,

()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">waves</span>訂單分波規劃 <span class="tag t-warn" style="margin-left:auto">待釋放 2 波</span></h3><div class="scroll"><table class="data"><tr><th>波次</th><th>揀貨策略</th><th>訂單 / 行數</th><th>截車時間</th><th>指派人力</th><th>狀態</th></tr>
