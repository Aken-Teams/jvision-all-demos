<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>設備維護管理套件｜Jvision Demo</title>
<meta name="description" content="保養、維修、預兆到備品的設備全生命週期 CMMS 管理套件" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#16a34a;
  --color-on-primary:#000;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#dc2626;
  --color-on-accent:#fff;
  --color-background:#0f172a;
  --color-foreground:#f8fafc;
  --color-card:#111827;
  --color-card-foreground:#f8fafc;
  --color-muted:#1e293b;
  --color-muted-foreground:#cbd5e1;
  --color-border:#334155;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#16a34a;
  --blue:#60a5fa;
  --ink:#f8fafc;
  --muted:#cbd5e1;
  --line:#334155;
  --green:#22c55e;
  --green-dark:#16a34a;
  --amber:#f59e0b;
  --red:#ef4444;
  --slate:#94a3b8;
  --panel:#111827;
  --soft:#182235;
  --shadow:0 16px 40px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    radial-gradient(circle at 82% -10%,rgba(22,163,74,.14),transparent 28rem),
    linear-gradient(180deg,#0b1120 0,#0f172a 38rem);
  color:var(--ink);
  font-family:"Inter",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,.card{cursor:pointer}
button:focus-visible,.card:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid rgba(148,163,184,.22);
  background:rgba(11,17,32,.92);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  backdrop-filter:blur(16px);
}
.topbar-in{
  width:min(1440px,100%);
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:260px}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid rgba(74,222,128,.35);
  border-radius:12px;
  color:#4ade80;
  background:linear-gradient(145deg,#163524,#102319);
  box-shadow:0 0 22px rgba(34,197,94,.16);
}
.brand-t b{display:block;font-size:15px;font-weight:800;letter-spacing:.03em}
.brand-t span{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.nav{
  margin-left:auto;
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;
  padding:8px 12px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  border:1px solid transparent;
  border-radius:9px;
  color:var(--muted);
  background:transparent;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
}
.nav button:hover{color:#fff;background:#1e293b;border-color:#334155}
.nav button.on{
  color:#fff;
  border-color:rgba(74,222,128,.3);
  background:linear-gradient(135deg,rgba(22,163,74,.28),rgba(22,163,74,.12));
  box-shadow:inset 0 0 18px rgba(34,197,94,.06);
}
.wrap{width:min(1440px,100%);margin:auto;padding:30px 22px 64px}
.screen-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}
.eyebrow{
  margin-bottom:5px;
  color:#4ade80;
  font:400 11px/1.4 "JetBrains Mono",monospace;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.screen-head h1{
  margin:0 0 5px;
  color:#fff;
  font-size:clamp(24px,3vw,34px);
  line-height:1.15;
  letter-spacing:-.035em;
}
.screen-head p{margin:0;color:var(--muted);font-size:13px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill,.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  white-space:nowrap;
  font-weight:700;
}
.pill{
  min-height:36px;
  padding:6px 12px;
  border:1px solid rgba(74,222,128,.28);
  color:#86efac;
  background:rgba(22,163,74,.11);
  font-size:12px;
}
.pill.warn{border-color:rgba(245,158,11,.32);color:#fbbf24;background:rgba(245,158,11,.1)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(320px,2fr)}
.spacer{height:16px}
.panel,.kpi{
  min-width:0;
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--color-card-foreground);
  background:
    linear-gradient(145deg,rgba(255,255,255,.018),transparent 50%),
    var(--panel);
  box-shadow:var(--shadow);
}
.pad{padding:18px}
.ptitle{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800}
.ptitle .material-symbols-outlined{color:#4ade80}
.psub{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.kpi{
  position:relative;
  min-height:150px;
  padding:17px;
  overflow:hidden;
}
.kpi:after{
  content:"";
  position:absolute;
  inset:auto -30px -45px auto;
  width:115px;
  height:115px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(34,197,94,.12),transparent 68%);
}
.k-ic{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  margin-bottom:16px;
  border:1px solid rgba(74,222,128,.22);
  border-radius:10px;
  color:#4ade80;
  background:rgba(22,163,74,.09);
}
.k-lab{color:var(--muted);font-size:11.5px;font-weight:700}
.k-val{
  margin-top:2px;
  color:#fff;
  font-size:27px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.035em;
}
.k-val small{color:var(--muted);font-size:12px;letter-spacing:0}
.k-tag{
  position:absolute;
  top:17px;
  right:17px;
  padding:3px 8px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
}
.up{color:#86efac;background:rgba(34,197,94,.13)}
.dn{color:#fca5a5;background:rgba(239,68,68,.13)}
.k-bar,.prog,.stk,.m-track{
  overflow:hidden;
  border-radius:999px;
  background:#293548;
}
.k-bar{height:5px;margin-top:10px}
.k-bar i,.prog i,.m-track i,.stk i{display:block;height:100%;border-radius:inherit}
.k-bar i,.prog i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px}
.col{
  padding:11px;
  border:1px solid #2c3a50;
  border-radius:12px;
  background:#0c1423;
}
.col-h{
  padding:2px 3px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
}
.cnt{padding:2px 8px;border-radius:99px;color:var(--muted);background:#1e293b}
.dot{width:8px;height:8px;display:inline-block;margin-right:7px;border-radius:50%}
.card{
  margin-top:9px;
  padding:12px;
  border:1px solid #334155;
  border-left:3px solid var(--green);
  border-radius:10px;
  background:#151f2f;
  transition:transform .2s,border-color .2s,background .2s;
}
.card:hover{transform:translateY(-2px);background:#192538;border-color:#4b5d76}
.card.lv-red{border-left-color:var(--red)}
.card.lv-amb{border-left-color:var(--amber)}
.card.lv-blu{border-left-color:var(--blue)}
.c-top,.c-meta{display:flex;align-items:center;gap:8px}
.c-top{justify-content:space-between}
.c-id,.mono,.code,.date,.num{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.c-id{color:var(--muted);font-size:10px}
.c-title{margin:7px 0;font-size:13px;font-weight:800;line-height:1.4}
.c-meta{color:var(--muted);font-size:10.5px}
.c-meta .date{margin-left:auto}
.ava{
  width:22px;
  height:22px;
  display:inline-grid;
  place-items:center;
  flex:none;
  border-radius:50%;
  color:#dcfce7;
  background:#176233;
  font-size:10px;
  font-weight:800;
}
.badge{padding:3px 8px;font-size:10.5px}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-grn{color:#86efac;background:rgba(34,197,94,.13)}
.b-amb{color:#fbbf24;background:rgba(245,158,11,.13)}
.b-red{color:#fca5a5;background:rgba(239,68,68,.14)}
.b-blu{color:#93c5fd;background:rgba(59,130,246,.14)}
.b-gry{color:#cbd5e1;background:rgba(148,163,184,.13)}
.prog{height:5px;margin-top:9px}
.scrollx{overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;font-size:12.5px}
th{
  padding:11px 13px;
  border-block:1px solid var(--line);
  color:#cbd5e1;
  background:#0d1626;
  text-align:left;
  font-size:10.5px;
  letter-spacing:.05em;
  white-space:nowrap;
}
td{padding:12px 13px;border-bottom:1px solid #263347;white-space:nowrap}
tbody tr{transition:background .18s}
tbody tr:hover{background:#172337}
td.num,th.num{text-align:right}
.chart-wrap{width:100%;min-height:255px}
.lrow{
  min-width:0;
  padding:11px 2px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid #263347;
}
.lrow:last-child{border-bottom:0}
.li-ic{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:10px;
  color:#4ade80;
  background:rgba(34,197,94,.1);
}
.li-main{min-width:0;flex:1}
.li-t{font-size:12.5px;font-weight:800}
.li-s{margin-top:2px;color:var(--muted);font-size:10.5px}
.stock-list{margin-top:15px;display:grid;gap:18px}
.stock-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:12px;font-weight:700}
.stk{position:relative;height:8px}
.stk i{position:absolute;inset:0 auto 0 0}
.stk .safe{position:absolute;top:-4px;width:2px;height:16px;background:#fff}
.meters{margin-top:16px;display:grid;gap:15px}
.meter{display:flex;align-items:center;gap:12px}
.m-lab{width:105px;flex:none;font-size:11.5px;font-weight:700}
.m-track{height:9px;flex:1}
.m-val{width:48px;text-align:right;font:400 11px "JetBrains Mono",monospace}
.strip{padding:15px 18px;display:flex;gap:28px;flex-wrap:wrap}
.s-it{min-width:105px}
.s-l{color:var(--muted);font-size:10.5px}
.s-v{margin-top:2px;font:700 17px "JetBrains Mono",monospace}
.timeline{position:relative;margin-top:18px;padding-left:27px}
.timeline:before{content:"";position:absolute;left:8px;top:5px;bottom:8px;width:1px;background:#405068}
.tl-i{position:relative;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.dotm{
  position:absolute;
  left:-26px;
  top:2px;
  width:15px;
  height:15px;
  border:3px solid var(--green);
  border-radius:50%;
  background:#111827;
}
.tl-i.red .dotm{border-color:var(--red)}
.tl-i.amb .dotm{border-color:var(--amber)}
.tl-i.blu .dotm{border-color:var(--blue)}
.tl-i.gry .dotm{border-color:var(--slate)}
.tl-t{font-size:13px;font-weight:800}
.tl-d{margin:2px 0 6px;color:var(--muted);font:400 10.5px "JetBrains Mono",monospace}
.tl-b{padding:9px 11px;border:1px solid #2d3c52;border-radius:9px;color:#dbe5f2;background:#172235;font-size:11.5px}
.matrix{min-width:520px;display:grid;grid-template-columns:110px repeat(4,1fr);gap:6px}
.mh{padding:5px;text-align:center;color:var(--muted);font-size:10px;font-weight:700}
.mr{padding:8px 5px;font-size:11px;font-weight:700}
.mc{padding:8px 5px;border-radius:7px;text-align:center;color:#fff;font:700 11px "JetBrains Mono",monospace}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .topbar-in{align-items:flex-start;flex-direction:column;gap:9px}
  .nav{width:100%;margin:0}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g21,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(240px,1fr))}
}
@media(max-width:640px){
  .topbar-in,.wrap{padding-left:14px;padding-right:14px}
  .brand{min-width:0}
  .nav button{min-width:42px;justify-content:center}
  .nav .lbl{display:none}
  .screen-head{align-items:flex-start;flex-direction:column}
  .g4,.g2,.board{grid-template-columns:1fr}
  .kpi{min-height:135px}
  .pad{padding:15px}
  .strip{gap:18px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div class="brand-t"><b>設備維護管理套件</b><span>CMMS · 保養 · 維修 · 預兆 · 備品</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main class="wrap"><div id="app" aria-live="polite"></div></main>
<script>
"use strict";
var NAV=[
 {i:0,ic:"view_kanban",t:"保養看板"},
 {i:1,ic:"build_circle",t:"維修工單"},
 {i:2,ic:"sensors",t:"預兆診斷"},
 {i:3,ic:"inventory_2",t:"備品倉儲"},
 {i:4,ic:"speed",t:"OEE 稼動"},
 {i:5,ic:"history",t:"設備履歷"}
];
var charts=[];
var C={green:"#22c55e",green2:"#4ade80",amber:"#f59e0b",red:"#ef4444",blue:"#60a5fa",slate:"#94a3b8",text:"#cbd5e1",grid:"#334155"};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function destroyCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function badge(cls,text){return '<span class="badge '+cls+'">'+text+'</span>'}
function head(title,sub,status,warn){
 return '<div class="screen-head"><div><div class="eyebrow">Reliability operations</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="head-actions"><span class="pill '+(warn?"warn":"")+'">'+icon(warn?"warning":"verified") +status+'</span></div></div>'
}
function kpis(items){
 return '<div class="grid g4">'+items.map(function(x){
  return '<section class="kpi"><div class="k-ic">'+icon(x[0])+'</div><div class="k-lab">'+x[1]+'</div><div class="k-val">'+x[2]+' <small>'+x[3]+'</small></div>'+
   (x[4]?'<div class="k-tag '+x[4]+'">'+x[5]+'</div>':'')+
   (x[6]!=null?'<div class="k-bar"><i style="width:'+x[6]+'%"></i></div>':'')+'</section>'
 }).join("")+'</div>'
}
function panel(title,sub,body,ic){
 return '<section class="panel"><div class="pad"><div class="ptitle">'+icon(ic||"analytics")+title+'</div>'+(sub?'<p class="psub">'+sub+'</p>':'')+body+'</div></section>'
}
function s0(){
 var cols=[
 ["待排程","var(--blue)",[
  ["PM-2418","空壓機#3 三個月定保","lv-blu","b-blu","定保","林品豪","08/14"],
  ["PM-2421","冷卻塔水質檢測","lv-blu","b-blu","點檢","張雅筑","08/15"],
  ["PM-2423","射出機B 潤滑系統保養","lv-amb","b-amb","即將到期","黃俊傑","08/14"]]],
 ["進行中","var(--amber)",[
  ["PM-2410","CNC-07 主軸精度校正","lv-amb","b-amb","進行 60%","吳庭安","08/13",60],
  ["PM-2412","輸送帶馬達軸承更換","lv-grn","b-grn","進行 85%","王柏諺","08/13",85]]],
 ["待驗收","var(--green)",[
  ["PM-2402","變頻器散熱清潔","lv-grn","b-grn","待主管簽核","陳映蓉","08/12"],
  ["PM-2405","配電盤紅外線熱像檢測","lv-grn","b-grn","待主管簽核","李念慈","08/12"]]],
 ["逾期","var(--red)",[
  ["PM-2388","廢水泵浦機封更換","lv-red","b-red","逾期 4 天","黃俊傑","08/09"],
  ["PM-2391","鍋爐安全閥年度校驗","lv-red","b-red","逾期 3 天","林品豪","08/10"],
  ["PM-2395","堆高機液壓管路檢查","lv-red","b-red","逾期 2 天","吳庭安","08/11"]]]
 ];
 var board='<div class="board">'+cols.map(function(c){
  return '<div class="col"><div class="col-h"><span><i class="dot" style="background:'+c[1]+'"></i>'+c[0]+'</span><span class="cnt">'+c[2].length+'</span></div>'+
  c[2].map(function(x){return '<article class="card '+x[2]+'" tabindex="0"><div class="c-top"><span class="c-id">'+x[0]+'</span>'+badge(x[3],x[4])+'</div><div class="c-title">'+x[1]+'</div><div class="c-meta"><span class="ava">'+x[5][0]+'</span>'+x[5]+'<span class="date">'+icon("event")+x[6]+'</span></div>'+(x[7]?'<div class="prog"><i style="width:'+x[7]+'%"></i></div>':'')+'</article>'}).join("")+'</div>'
 }).join("")+'</div>';
 return head("保養排程看板","預防保養工單依狀態拖動追蹤 · 8 月第 2 週","準時率 90%",false)+
 kpis([["event_available","本週應保養","38","件","up","↑ 6",76],["task_alt","準時完成率","90","%","up","↑ 4%",90],["schedule","逾期未處理","3","件","dn","↓ 2",12],["engineering","在線技師","6","人","up","值班",60]])+
 '<div class="spacer"></div><div class="panel pad scrollx">'+board+'</div>'
}
function s1(){
 var rows=[
 ["WO-5182","射出機 IMM-05","液壓油溫過高","b-red","緊急","王柏諺","油冷器","2.5h","b-amb","維修中"],
 ["WO-5179","CNC-07 加工中心","主軸異音","b-amb","高","吳庭安","軸承 6208","1.0h","b-amb","維修中"],
