<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>牙科術後主動聯繫站 · Dental Post-op Follow-up</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow:0 10px 26px rgba(8,145,178,.08);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Atkinson Hyperlegible","Noto Sans TC",sans-serif;
  font-size:15px;
  line-height:1.45
}
button{font:inherit}
button,[role="button"],.slot.free{cursor:pointer}
button:focus-visible,[role="button"]:focus-visible,.slot.free:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24
}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:10;
  height:100vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  padding:22px 16px 18px;
  background:#fff;
  border-right:1px solid var(--color-border)
}
.bd{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 8px 22px;
  border-bottom:1px solid var(--color-border)
}
.lg{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid var(--color-primary);
  border-radius:8px;
  background:var(--color-background);
  color:var(--color-primary);
  font-size:20px;
  font-weight:700
}
.bd b{display:block;font-size:16px;letter-spacing:.01em}
.bd span{
  display:block;
  margin-top:2px;
  color:var(--color-muted-foreground);
  font-size:10px;
  font-weight:700;
  letter-spacing:.13em
}
#nav{display:grid;gap:4px;padding-top:18px}
.side button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--color-muted-foreground);
  text-align:left;
  font-weight:700;
  transition:background-color .2s,border-color .2s,color .2s,transform .2s
}
.side button:hover{
  background:var(--color-background);
  border-color:var(--color-border);
  color:var(--color-foreground)
}
.side button.on{
  background:var(--color-primary);
  border-color:var(--color-primary);
  color:#001A20;
  box-shadow:0 5px 0 #075F72
}
.side button.on .material-symbols-outlined{color:#001A20}
.side button:not(.on) .material-symbols-outlined{color:var(--color-primary)}
.foot{
  margin-top:auto;
  padding:16px 10px 0;
  border-top:1px solid var(--color-border);
  color:var(--color-muted-foreground);
  font-size:12px;
  line-height:1.7
}
.main{min-width:0;padding:26px clamp(16px,2.5vw,34px) 38px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px
}
.vh h2{margin:0;color:var(--color-foreground);font-size:clamp(24px,3vw,32px);line-height:1.1}
.vh p{margin:7px 0 0;color:var(--color-muted-foreground);font-size:14px}
.live{
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid #6EE7B7;
  border-radius:999px;
  background:#ECFDF5;
  color:#065F46;
  font-size:12px;
  font-weight:700
}
.live i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--color-accent)
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi,.card,.npc{
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:8px;
  box-shadow:var(--shadow)
}
.kpi{
  position:relative;
  min-height:132px;
  overflow:hidden;
  padding:17px 18px;
  transition:border-color .2s,transform .2s,box-shadow .2s
}
.kpi:hover,.card:hover,.npc:hover{
  border-color:var(--color-primary);
  box-shadow:0 12px 30px rgba(8,145,178,.12)
}
.kpi:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:var(--color-primary)
}
.kpi .l{color:var(--color-muted-foreground);font-size:13px;font-weight:700}
.kpi .v{
  margin-top:7px;
  color:var(--color-foreground);
  font-size:30px;
  font-weight:700;
  font-variant-numeric:tabular-nums
}
.kpi .d{margin-top:4px;font-size:12px;font-weight:700}
.kpi .ic{
  position:absolute;
  right:14px;
  top:14px;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:6px;
  background:var(--color-background);
  color:var(--color-primary)
}
.up{color:var(--ok)}
.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr)}
.g11,.two{grid-template-columns:1fr 1fr}
.card{min-width:0;padding:17px 18px;transition:border-color .2s,box-shadow .2s}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  color:var(--color-foreground);
  font-size:15px;
  line-height:1.3
}
.card h3>.material-symbols-outlined{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border:1px solid var(--color-border);
  border-radius:6px;
  background:var(--color-background);
  color:var(--color-primary)
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  max-width:100%;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap
}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-teal{background:#ECFEFF;color:#0E7490}
.scroll{overflow:auto;overscroll-behavior-inline:contain}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{
  padding:10px 11px;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  vertical-align:middle
}
table.data th{
  background:var(--color-muted);
  color:#334155;
  font-size:12px;
  font-weight:700;
  letter-spacing:.015em
}
table.data tbody tr:hover td,table.data tr:hover td{background:#F0FDFF}
table.data td:first-child small,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.data td:nth-last-child(-n+2){font-variant-numeric:tabular-nums}
.bar{height:8px;overflow:hidden;border-radius:999px;background:var(--color-muted)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--color-primary)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;color:var(--color-muted-foreground);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;display:inline-block;border:1px solid rgba(15,23,42,.2);border-radius:2px}
.calllist{display:flex;flex-direction:column;gap:9px}
.cc{
  padding:12px 13px;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-primary);
  border-radius:6px;
  background:#fff;
  transition:background-color .2s,border-color .2s,transform .2s
}
.cc:hover{transform:translateY(-1px);border-color:var(--color-primary)}
.cc.due{border-left-color:var(--bad);background:#FFF8F8}
.cc.soon{border-left-color:var(--warn);background:#FFFCF3}
.cc.done{border-left-color:var(--ok);background:#F7FFFB}
.cc .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc .ct b{font-size:14px}
.cc .day{
  padding:2px 7px;
  border:1px solid var(--color-border);
  border-radius:4px;
  background:var(--color-background);
  color:#0E7490;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700
}
.cc .meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 14px;
  margin-top:7px;
  color:var(--color-muted-foreground);
  font-size:12px
}
.cc .meta span{display:flex;align-items:center;gap:4px}
.cc .meta .material-symbols-outlined{font-size:15px}
.ava{
  width:27px;
  height:27px;
  flex:none;
  display:inline-grid;
  place-items:center;
  border:1px solid var(--color-primary);
  border-radius:4px;
  background:var(--color-background);
  color:#0E7490;
  font-size:12px;
  font-weight:700
}
.stat{margin-left:auto;text-align:right}
.stat .num{font-size:13px;font-weight:700}
.stat small{display:block;color:var(--color-muted-foreground);font-size:10px}
.chan{
  width:28px;
  height:28px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:4px;
  color:#fff
}
.chan .material-symbols-outlined{font-size:16px}
.c-phone{background:#0369A1}
.c-sms{background:#6D28D9}
.c-line{background:#15803D}
.tl{display:flex;flex-direction:column}
.tli{position:relative;display:flex;gap:12px;padding-bottom:16px}
.tli:before{
  content:"";
  position:absolute;
  left:14px;
  top:30px;
  bottom:0;
  width:2px;
  background:var(--color-border)
}
.tli:last-child:before{display:none}
.dotm{
  z-index:1;
  width:30px;
  height:30px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid #fff;
  border-radius:50%;
  color:#fff
}
.dotm .material-symbols-outlined{font-size:16px}
.tli.ok .dotm{background:var(--ok)}
.tli.now .dotm{background:var(--color-primary);box-shadow:0 0 0 4px #CFFAFE}
.tli.warn .dotm{background:var(--warn)}
.tli.wait .dotm{background:#64748B}
.tli .tc{min-width:0}
.tli .tc b{font-size:13px}
.tli .tc small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:12px;line-height:1.45}
.tli .tt{
  margin-left:auto;
  color:var(--color-muted-foreground);
  font-family:var(--mono);
  font-size:11px;
  white-space:nowrap
}
.sug{
  margin-bottom:10px;
  padding:11px 12px;
  border:1px solid var(--color-border);
  border-radius:6px;
  background:var(--color-background)
}
.sug b{display:block;margin-bottom:4px;font-size:13px}
.sug small{color:var(--color-muted-foreground);font-size:12px;line-height:1.55}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{
  max-width:86%;
  padding:10px 12px;
  border:1px solid var(--color-border);
  border-radius:8px;
  font-size:13px;
  line-height:1.55
}
.msg.pt{align-self:flex-start;background:var(--color-muted)}
.msg.nu{align-self:flex-end;background:var(--color-background);border-color:#67E8F9}
.msg .who{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:4px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:700
}
.msg .who .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.mini{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  min-height:38px;
  padding:7px 14px;
  border:1px solid transparent;
  border-radius:5px;
  font-size:12px;
  font-weight:700;
  transition:background-color .2s,border-color .2s,color .2s,transform .2s
}
.btn:hover{transform:translateY(-1px)}
.btn.ok{
  background:var(--color-accent);
  border-color:#047857;
  color:#001A12;
  box-shadow:0 3px 0 #065F46
}
.btn.ok:hover{background:#10B981}
.btn.gh{background:#fff;border-color:#94A3B8;color:#334155}
.btn.gh:hover{background:var(--color-muted);border-color:var(--color-primary)}
.chart{height:250px}
.slotgrid{display:grid;grid-template-columns:70px repeat(4,minmax(105px,1fr));gap:6px;min-width:590px}
.slotgrid .hd{
  padding:7px 3px;
  color:#334155;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  text-align:center
}
.slotgrid .tm{
  display:flex;
  align-items:center;
  color:var(--color-muted-foreground);
  font-family:var(--mono);
  font-size:11px;
  font-weight:700
}
.slot{
  min-height:48px;
  padding:7px 8px;
  border:1px solid var(--color-border);
  border-radius:5px;
  font-size:11px
}
.slot.bk{background:#ECFEFF;border-color:#22D3EE}
.slot.bk b{display:block;font-size:12px}
.slot.bk small{color:var(--color-muted-foreground)}
.slot.free{
  display:grid;
  place-items:center;
  background:#fff;
  color:#0E7490;
  font-weight:700;
  transition:background-color .2s,border-color .2s
}
.slot.free:hover{background:#CFFAFE;border-color:var(--color-primary)}
.slot.blk{display:grid;place-items:center;background:#F1F5F9;color:#64748B}
.nps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.npc{padding:17px;text-align:left;transition:border-color .2s,box-shadow .2s}
.npc .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.npc .l{margin-top:3px;color:var(--color-muted-foreground);font-size:12px;font-weight:700}
.fbk{display:flex;flex-direction:column;gap:9px}
.fc{padding:11px 12px;border:1px solid var(--color-border);border-radius:6px}
.fc .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fc .fh b{font-size:13px}
.fc p{margin:6px 0 0;color:#334155;font-size:12px;line-height:1.55}
.stars{color:#9A6700;font-size:14px;letter-spacing:1px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Atkinson Hyperlegible",sans-serif!important}
@media (prefers-reduced-motion:no-preference){
  .kpi,.card,.npc{animation:reveal .35s ease-out both}
  .grid>.card:nth-child(2){animation-delay:.06s}
  @keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
@media(max-width:1024px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}
  .side{
    position:sticky;
    height:auto;
    max-height:none;
    padding:12px;
    border-right:0;
    border-bottom:1px solid var(--color-border)
  }
  .bd{padding:0 4px 10px}
  .lg{width:36px;height:36px}
  #nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
  .side button{width:auto;min-width:max-content;padding:8px 10px}
  .side button.on{box-shadow:none}
  .foot{display:none}
  .main{padding-top:20px}
  .vh{align-items:flex-start}
}
@media(max-width:520px){
  .vh{display:block}
  .live{width:max-content;margin-top:12px}
  .kpis,.nps{grid-template-columns:1fr}
  .kpi{min-height:112px}
  .card{padding:14px}
  .msg{max-width:94%}
  .tli .tt{white-space:normal;text-align:right}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="主要導覽">
    <div class="bd">
      <div class="lg" aria-hidden="true">牙</div>
      <div><b>牙科術後聯繫站</b><span>DENTAL FOLLOW-UP</span></div>
    </div>
    <nav id="nav" aria-label="系統功能"></nav>
    <div class="foot">術後追蹤 · 電話/簡訊/LINE 關懷<br/>本日待聯繫 18 · 已完成 42<br/>回診完成率 88% · 異常回報 3</div>
  </aside>
  <main class="main">
    <header class="vh">
      <div><h2 id="vt">追蹤總覽</h2><p id="vd"></p></div>
      <div class="live" role="status"><i aria-hidden="true"></i>術後追蹤進行中</div>
    </header>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["追蹤總覽","monitoring","追蹤總覽","術後追蹤戰情、癒合狀況與回診完成率儀表"],
["術後名單","list_alt","術後追蹤名單","依術式與術後第N天排序的主動追蹤名單"],
["主動聯繫","call","主動關懷聯繫","電話/簡訊關懷佇列、話術與接通狀態"],
["癒合回報","healing","癒合狀況回報","患者疼痛腫脹回報與術後癒合時間軸"],
["回診預約","event_available","回診預約","拆線與複檢回診排程與診間安排"],
["滿意度統計","sentiment_satisfied","滿意度統計","術後滿意度、NPS 與各術式關懷成效"]
];
const nav=document.getElementById("nav");
const view=document.getElementById("view");
const vt=document.getElementById("vt");
const vd=document.getElementById("vd");

MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.setAttribute("aria-controls","view");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+"</span><span>"+m[0]+"</span>";
  b.addEventListener("click",()=>{location.hash="v"+i});
  nav.appendChild(b);
});

const LIST=[
["P-2041","陳伯宏","陳","下顎智齒拔除","術後 1 天","due","c-phone","應於今日致電關懷","t-bad"],
["P-2039","林淑芬","林","植牙第一階段","術後 2 天","due","c-phone","腫脹回報偏高，優先聯繫","t-bad"],
["P-2036","黃冠廷","黃","根管治療","術後 3 天","soon","c-sms","簡訊衛教提醒待發送","t-warn"],
["P-2033","吳雅琪","吳","牙周翻瓣手術","術後 5 天","soon","c-phone","評估拆線回診時機","t-warn"],
["P-2030","張家豪","張","上顎智齒拔除","術後 7 天","done","c-line","已聯繫 · 癒合良好","t-ok"],
["P-2028","劉思妤","劉","全瓷冠黏著","術後 8 天","done","c-sms","已回報無不適","t-ok"],
["P-2025","王志明","王","植牙補骨","術後 10 天","done","c-phone","已預約拆線回診","t-ok"]
];
const CHAN_LABEL={"c-phone":"電話","c-sms":"簡訊","c-line":"LINE"};
const CHAN_ICON={"c-phone":"call","c-sms":"sms","c-line":"chat"};

function stars(n){
  let s="";
  for(let i=0;i<5;i++)s+=i<n?"★":"☆";
  return s;
}
function healTimeline(){
  return HEAL.map(h=>`<div class="tli ${h[0]}">
    <div class="dotm"><span class="material-symbols-outlined" aria-hidden="true">${h[0]==="ok"?"check":h[0]==="now"?"timelapse":h[0]==="warn"?"priority_high":"schedule"}</span></div>
    <div class="tc"><b>${h[1]}</b><small>${h[2]}</small></div>
    <span class="tt">${h[3]}</span>
  </div>`).join("");
}
function stateLabel(state){
  return state==="due"?"應聯繫":state==="soon"?"即將到期":"已完成";
}
function queueLabel(state){
  return state==="due"?"待撥打":state==="soon"?"排程中":"已完成";
}

  CH.forEach(c=>{try{c.destroy()}catch(e){}});
  CH=[];
}
function mk(id,opt){

  const c=new ApexCharts(el,opt);

  CH.push(c);
}

      chart:Object.assign({},BASE.chart,{type:"donut",height:250}),
      series:[93,86,90,82,95],
      labels:["智齒拔除","植牙","根管治療","牙周手術","冠橋修復"],
      colors:[CYAN,CYAN2,INFO,WARN,OKG],
      legend:{position:"bottom",fontSize:"11px"},
      stroke:{colors:["#fff"],width:3},
      plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"平均完成率",fontSize:"12px",formatter:()=> "88%"}}}}}
    }));
  }
}
function show(i){
  const index=Math.max(0,Math.min(i,MOD.length-1));
  nav.querySelectorAll("button").forEach(b=>{
    const active=Number(b.dataset.i)===index;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[index][2];
  vd.textContent=MOD[index][3];
  view.innerHTML=SCREENS[index]();
  draw(index);
}
function fromHash(){
  const match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(match?Number(match[1]):0);
  try{window.scrollTo({top:0,behavior:reduceMotion?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{
  const target=e.target.closest(".slot.free");
  if(target&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    target.click();
  }
});
fromHash();
</script>
