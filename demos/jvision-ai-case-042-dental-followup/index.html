<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>牙科術後主動聯繫站 · Dental Post-op Follow-up</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#14b8a6;--accent2:#5eead4;--ink:#0f2b28;--bg:#eef6f5;--card:#fff;--line:#d7ebe8;--mut:#5b807b;--ok:#0f9d70;--warn:#f59e0b;--bad:#e11d48;--info:#6366f1}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#fff,#f2fbfa);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 20px rgba(20,184,166,.42);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9px;color:var(--accent);letter-spacing:1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#3f5d59;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#9ac9c3}
.side button:hover{background:#e3f5f2}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(20,184,166,.32)}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.8}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#d5f5ef;color:#0b7d63;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(20,184,166,.5)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(20,184,166,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.26}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d3f4e7;color:#0f7a52}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe1e6;color:#be123c}.t-info{background:#e0e7ff;color:#4338ca}.t-teal{background:#d0f3ee;color:#0b7d63}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#effaf8}
table.data tr:hover td{background:#f3fbfa}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#e0f0ed;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
/* follow-up call list */
.calllist{display:flex;flex-direction:column;gap:10px}
.cc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:13px;padding:12px 14px;background:#fff}
.cc.due{border-left-color:var(--bad);background:linear-gradient(90deg,#fff5f7,#fff)}
.cc.soon{border-left-color:var(--warn)}
.cc.done{border-left-color:var(--ok)}
.cc .ct{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cc .ct b{font-size:13.5px;font-family:"Noto Sans TC"}
.cc .day{font-family:Inter;font-weight:900;color:var(--accent);font-size:12.5px;background:#dff5f1;padding:2px 9px;border-radius:8px}
.cc .meta{color:var(--mut);font-size:11.5px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.cc .meta span{display:flex;align-items:center;gap:4px}
.cc .meta .material-symbols-outlined{font-size:14px}
.ava{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;font-family:"Noto Sans TC";flex:none}
.stat{margin-left:auto;text-align:right;flex:none}
.stat .num{font-family:"Noto Sans TC";font-weight:800;font-size:12.5px}
.stat small{font-size:9.5px;color:var(--mut);display:block}
.chan{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.chan .material-symbols-outlined{font-size:15px}
.c-phone{background:#0ea5e9}.c-sms{background:#8b5cf6}.c-line{background:#22c55e}
/* healing timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tli{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tli:before{content:"";position:absolute;left:13px;top:26px;bottom:-2px;width:2px;background:#d7ebe8}
.tli:last-child:before{display:none}
.tli .dotm{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;z-index:1}
.tli .dotm .material-symbols-outlined{font-size:16px}
.tli.ok .dotm{background:var(--ok)}.tli.now .dotm{background:var(--accent);box-shadow:0 0 0 4px rgba(20,184,166,.2)}.tli.warn .dotm{background:var(--warn)}.tli.wait .dotm{background:#cbd5cf}
.tli .tc b{font-size:13px;font-family:"Noto Sans TC"}
.tli .tc small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.5}
.tli .tt{margin-left:auto;color:var(--mut);font-size:11px;white-space:nowrap;flex:none}
/* pill / stepper for call scripts */
.sug{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#eefaf8;margin-bottom:10px}
.sug b{font-size:12.5px;font-family:"Noto Sans TC";display:block;margin-bottom:4px}
.sug small{color:var(--mut);font-size:11.5px;line-height:1.6}
.chat{display:flex;flex-direction:column;gap:11px}
.msg{max-width:84%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.6}
.msg.pt{align-self:flex-start;background:#eef2f1;border-bottom-left-radius:4px}
.msg.nu{align-self:flex-end;background:linear-gradient(135deg,#e9fbf7,#d5f5ef);border:1px solid #a9e9df;border-bottom-right-radius:4px}
.msg .who{font-size:10.5px;color:var(--mut);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.msg .who .material-symbols-outlined{font-size:14px;color:var(--accent)}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--accent);color:#fff}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--mut)}
.mini{display:flex;gap:6px}
.chart{height:250px}
/* booking grid */
.slotgrid{display:grid;grid-template-columns:70px repeat(4,1fr);gap:6px;min-width:520px}
.slotgrid .hd{font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:6px 0}
.slotgrid .tm{font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center}
.slot{border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:11px;min-height:44px}
.slot.bk{background:#dff5f1;border-color:#a9e9df}
.slot.bk b{font-family:"Noto Sans TC";font-size:11.5px;display:block}
.slot.bk small{color:var(--mut);font-size:10px}
.slot.free{background:#fbfefe;color:#9ac9c3;display:grid;place-items:center;cursor:pointer}
.slot.blk{background:#f4f6f6;color:#b8c4c2;display:grid;place-items:center;font-size:10.5px}
.nps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.npc{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.npc .v{font-family:Inter;font-weight:900;font-size:24px}
.npc .l{font-size:11px;color:var(--mut);margin-top:2px}
.stars{color:#f59e0b;font-size:14px;letter-spacing:1px}
.fbk{display:flex;flex-direction:column;gap:10px}
.fc{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fc .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.fc .fh b{font-size:12.5px;font-family:"Noto Sans TC"}
.fc p{margin:4px 0 0;font-size:12px;color:#3f5751;line-height:1.6}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
 .g2,.g11,.two{grid-template-columns:1fr}
}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .main{padding:16px 14px}
 .msg{max-width:94%}
 .nps{grid-template-columns:1fr}
}
</style>
</head>
<body>

["P-2041","陳伯宏","陳","下顎智齒拔除 · 術後 1 天","c-phone","due","首次術後關懷","電話"],

const SCRIPT=[
["術後衛教話術","確認止痛/消腫用藥、冰熱敷時機、飲食軟質、避免吸吮傷口，並說明拆線時間。","智齒拔除 · 標準"],
["風險提醒","偵測「腫脹偏高 + 術後 1 天」，建議 24 小時內再次追蹤，異常則升級護理長評估。","高關注"],

["P-2033","吳雅琪","牙周翻瓣","術後 5 天","腫脹 1 · 疼痛 1","正常","t-ok"],

["15:30",["free","bk|張家豪|術後檢查","bk|劉思妤|咬合調整","free"]]];
const BOOKQ=[

["P-2041","陳伯宏","下顎智齒拔除","建議 術後第 7 天","拆線","t-bad"],
["P-2039","林淑芬","植牙第一階段","建議 術後第 14 天","複診","t-info"]];

/* 滿意度 */
const FBK=[
["張家豪 · 智齒拔除","5","術後護理師主動打電話關心，衛教很清楚，拆線回診也幫我約好，很安心。","P-2030"],
["王志明 · 植牙補骨","5","LINE 收到照顧圖卡很實用，回診提醒讓我沒有忘記，服務很貼心。","P-2025"],
["黃冠廷 · 根管治療","4","簡訊提醒服藥很有幫助，希望能多一次電話追蹤會更好。","P-2036"],
["劉思妤 · 全瓷冠","5","術後有任何問題都能馬上得到回覆，護理團隊很專業。","P-2028"]];
function stars(n){var s='';for(var i=0;i<5;i++)s+=(i<n?'★':'☆');return s;}

const SCREENS=[
/* 0 追蹤總覽 */
()=>`<div class="kpis">

/* ApexCharts init/destroy guard */
let CH=[];
function dispose(){CH.forEach(c=>{try{c.destroy();}catch(e){}});CH=[];}
function mk(id,opt){const el=document.getElementById(id);if(!el)return;const c=new ApexCharts(el,opt);c.render();CH.push(c);}

const BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},animations:{enabled:true}},dataLabels:{enabled:false},grid:{borderColor:'#e2f0ed',strokeDashArray:4},tooltip:{style:{fontSize:'12px'}}};
function draw(i){
 dispose();
 if(i==0){

  mk('c_trend',Object.assign({},BASE,{chart:Object.assign({type:'area',height:170},BASE.chart),series:[{name:'回診完成率%',data:[71,74,78,81,85,88]}],colors:[TEAL],stroke:{curve:'smooth',width:3},fill:{type:'gradient',gradient:{shadeIntensity:.4,opacityFrom:.4,opacityTo:.05}},xaxis:{categories:['第1週','第2週','第3週','第4週','第5週','第6週'],labels:{style:{fontSize:'10px'}}},yaxis:{min:60,max:100,labels:{style:{fontSize:'10px'}}},markers:{size:4}}));
 }
 if(i==3){
  mk('c_pain',Object.assign({},BASE,{chart:Object.assign({type:'line',height:180},BASE.chart),series:[{name:'疼痛分數',data:[3,3,2,2,1,1,0]},{name:'腫脹分數',data:[2,4,3,3,2,1,0]}],colors:[INFO,TEAL],stroke:{curve:'smooth',width:3},xaxis:{categories:['0天','1天','2天','3天','4天','5天','7天'],labels:{style:{fontSize:'10px'}}},yaxis:{min:0,max:5,labels:{style:{fontSize:'10px'}}},legend:{fontSize:'11px'},markers:{size:4}}));

 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
