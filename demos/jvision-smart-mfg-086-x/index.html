<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AXI 自動X光檢測管理｜Jvision 系統 Demo</title>
  <meta name="description" content="焊點X光檢測：從影像判讀到缺陷處置與檢出率驗證的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --acc:#16a34a; --acc2:#4ade80; --acc-d:#15803d;
      --bg:#f0f4f1; --panel:#ffffff; --ink:#0f1a12; --mut:#5b6b60;
      --line:#dbe6de; --soft:#eef5f0; --warn:#dc2626; --warnbg:#fef2f2;
      --amber:#d97706; --amberbg:#fffbeb; --info:#0369a1; --infobg:#eff6ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .app{max-width:1360px;margin:0 auto;padding:0 16px 40px}
    /* topbar */
    .top{display:flex;align-items:center;gap:14px;padding:16px 4px;flex-wrap:wrap}
    .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.32)}
    .logo .material-symbols-outlined{font-size:26px}
    .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
    .brand p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
    .top .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--acc-d);background:#dcfce7;padding:6px 12px;border-radius:999px;font-weight:600;min-width:0}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(22,163,74,.18)}
    /* nav */
    nav{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 18px}
    .nb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);padding:9px 14px;border-radius:11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:0;transition:.15s}
    .nb .material-symbols-outlined{font-size:19px}
    .nb .ix{width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    .nb:hover{border-color:var(--acc2);color:var(--ink)}
    .nb.on{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(22,163,74,.3)}
    .nb.on .ix{background:rgba(255,255,255,.24);color:#fff}
    /* screen head */
    .shead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
    .shead h2{margin:0;font-size:20px;font-weight:800}
    .shead .sub{color:var(--mut);font-size:13px;margin:0}
    .tag{margin-left:auto;font-size:12px;background:var(--soft);color:var(--acc-d);padding:5px 12px;border-radius:999px;font-weight:700;border:1px solid var(--line)}
    /* generic cards */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--acc-d)}
    .muted{color:var(--mut);font-size:12.5px}
    /* KPI */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0;position:relative;overflow:hidden}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--acc),var(--acc2))}
    .kpi .kl{font-size:12px;color:var(--mut);font-weight:600}
    .kpi .kv{font-size:26px;font-weight:900;margin-top:4px;letter-spacing:-.5px}
    .kpi .kd{font-size:11.5px;margin-top:3px;font-weight:700}
    .up{color:var(--acc-d)} .down{color:var(--warn)}
    /* split workspace */
    .split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
    .list{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
    .lfilter{display:flex;gap:6px;padding:6px 6px 10px;flex-wrap:wrap}
    .chip{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-weight:600}
    .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
    .li{display:flex;gap:10px;padding:11px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;min-width:0}
    .li:hover{background:var(--soft)}
    .li.on{background:var(--soft);border-color:var(--acc2)}
    .li .th{width:44px;height:44px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
    .li .in{min-width:0;flex:1}
    .li .in .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .li .in .m{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .detail{min-width:0;display:flex;flex-direction:column;gap:14px}
    /* badges */
    .b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
    .b .material-symbols-outlined{font-size:14px}
    .b-red{background:var(--warnbg);color:var(--warn)}
    .b-amb{background:var(--amberbg);color:var(--amber)}
    .b-grn{background:#dcfce7;color:var(--acc-d)}
    .b-blu{background:var(--infobg);color:var(--info)}
    .b-gry{background:#f1f5f2;color:var(--mut)}
    /* tables */
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th{text-align:left;font-size:11px;color:var(--mut);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
    td{padding:10px;border-bottom:1px solid var(--soft);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .scroll{overflow-x:auto}
    /* xray viewer signature */
    .xray{background:#0c1512;border-radius:14px;padding:14px;position:relative;overflow:hidden;min-width:0}
    .xray .grid{background-image:linear-gradient(rgba(74,222,128,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,.12) 1px,transparent 1px);background-size:26px 26px;border-radius:10px;height:300px;position:relative;border:1px solid rgba(74,222,128,.25)}
    .joint{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#04140c;cursor:pointer}
    .joint.ok{background:radial-gradient(circle at 35% 30%,#86efac,#22c55e)}
    .joint.bad{background:radial-gradient(circle at 35% 30%,#fca5a5,#ef4444);box-shadow:0 0 0 3px rgba(239,68,68,.35),0 0 16px rgba(239,68,68,.5)}
    .joint.rev{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b);box-shadow:0 0 0 3px rgba(245,158,11,.3)}
    .xleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:#cbe8d5}
    .xleg span{display:inline-flex;align-items:center;gap:6px}
    .xd{width:11px;height:11px;border-radius:50%}
    /* chart wrap */
    .cwrap{position:relative;width:100%;overflow:hidden}
    /* grids */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .g2a{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .col{background:var(--soft);border-radius:13px;padding:10px;min-width:0}
    .col .ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
    .col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--mut)}
    .tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;min-width:0}
    .tk .tt{font-size:12.5px;font-weight:700}
    .tk .tm{font-size:11px;color:var(--mut);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
    .tk:last-child{margin-bottom:0}
    /* timeline */
    .tl{position:relative;padding-left:22px}
    .tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 16px}
    .tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
    .tli.done::before{background:var(--acc)}
    .tli:last-child{padding-bottom:0}
    .tli .tt{font-size:13px;font-weight:700}
    .tli .tx{font-size:12px;color:var(--mut);margin-top:2px}
    .tli .ts{font-size:11px;color:var(--acc-d);font-weight:700}
    /* meter */
    .meter{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
    .meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
    .prog{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}
    .prog i{display:block;height:100%;background:var(--acc)}
    /* def detail rows */
    .drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;min-width:0}
    .drow:last-child{border-bottom:none}
    .drow .k{color:var(--mut);font-weight:600;flex:0 0 auto}
    .drow .v{font-weight:700;text-align:right;min-width:0}
    .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
    .btn .material-symbols-outlined{font-size:17px}
    .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
    .btn.dng{background:var(--warnbg);color:var(--warn);border-color:#fecaca}
    /* gauge row */
    .gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .gc{text-align:center;padding:6px}
    .gc .gv{font-size:30px;font-weight:900;letter-spacing:-1px}
    .gc .gl{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
    /* legend */
    .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
    .lg span{display:inline-flex;align-items:center;gap:6px}
    .sw{width:12px;height:12px;border-radius:3px}
    .foot{text-align:center;color:var(--mut);font-size:11.5px;padding:22px 0 4px}
    @media(max-width:860px){
      .split{grid-template-columns:1fr}
      .list{display:flex;overflow-x:auto;gap:8px}
      .list .lwrap{display:flex;gap:8px}
    }
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr}
      .g2,.g3,.g2a,.board,.gauge{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .nb .ntx{display:none}
      .nb{padding:9px 11px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="logo"><span class="material-symbols-outlined">biotech</span></div>
      <div class="brand">
        <h1>AXI 自動X光檢測管理</h1>
        <p>焊點X光檢測 · 缺陷判讀 · 處置追溯與檢出率管制</p>
      </div>
      <div class="live"><span class="dot"></span>3 台 AXI 機台線上</div>
    </div>
    <nav id="nav"></nav>
    <div id="screen"></div>
    <div class="foot">Jvision Demo · AXI 自動X光檢測管理系統 · 本頁為純前端展示，資料皆為模擬</div>
  </div>

  <script>
  (function(){
    "use strict";
    var C={acc:"#16a34a",acc2:"#4ade80",accD:"#15803d",warn:"#dc2626",amber:"#d97706",info:"#0369a1",mut:"#5b6b60",line:"#dbe6de",soft:"#eef5f0"};
    var NAV=[
      {ix:"M1",icon:"biotech",t:"X光檢測程式"},
      {ix:"M2",icon:"insights",t:"缺陷影像判讀"},
      {ix:"M3",icon:"rule",t:"缺陷分類複判"},
      {ix:"M4",icon:"warning",t:"異常通報處置"},
      {ix:"M5",icon:"precision_manufacturing",t:"機台校驗追蹤"},
      {ix:"M6",icon:"monitoring",t:"檢出率SPC分析"}
    ];
    var host=document.getElementById("screen");
    var navEl=document.getElementById("nav");
    var charts=[];
    function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
    function el(id){return document.getElementById(id);}
    function bar(id,cfg){var cv=el(id);if(!cv)return;var ch=new Chart(cv.getContext("2d"),cfg);charts.push(ch);return ch;}

    // build nav
    (function(){
      var h="";
      for(var i=0;i<NAV.length;i++){
        h+='<button class="nb" data-i="'+i+'"><span class="ix">'+NAV[i].ix+'</span><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="ntx">'+NAV[i].t+'</span></button>';
      }
      navEl.innerHTML=h;
      navEl.addEventListener("click",function(e){
        var b=e.target.closest("[data-i]");if(!b)return;
        location.hash="v"+b.getAttribute("data-i");
      });
    })();

    function head(t,sub,tag){
      return '<div class="shead"><div><h2>'+t+'</h2><p class="sub">'+sub+'</p></div><span class="tag">'+tag+'</span></div>';
    }
    function kpi(l,v,d,cls){
      return '<div class="kpi"><div class="kl">'+l+'</div><div class="kv">'+v+'</div><div class="kd '+(cls||"")+'">'+d+'</div></div>';
    }

    /* ============ SCREEN 0: X光檢測程式 (split workspace) ============ */
    var PROGS=[
      {id:"AXI-PGM-A71",name:"車用ECU主板 A71",rev:"v4.2",joints:1842,thr:"空洞≤18%",st:"生效",stc:"b-grn",owner:"陳彥廷",upd:"08/12",cov:98,line:"L1"},
      {id:"AXI-PGM-B33",name:"電源模組 PWR-B33",rev:"v2.7",joints:960,thr:"少錫≤0.08mm",st:"生效",stc:"b-grn",owner:"林巧宜",upd:"08/11",cov:96,line:"L2"},
      {id:"AXI-PGM-C08",name:"通訊背板 COM-C08",rev:"v1.9",joints:2410,thr:"橋接偵測 ON",st:"審核中",stc:"b-amb",owner:"黃志鴻",upd:"08/13",cov:91,line:"L1"},
      {id:"AXI-PGM-D54",name:"感測器板 SNS-D54",rev:"v3.1",joints:640,thr:"空洞≤22%",st:"生效",stc:"b-grn",owner:"陳彥廷",upd:"08/09",cov:99,line:"L3"},
      {id:"AXI-PGM-E12",name:"馬達驅動 MDR-E12",rev:"v0.9",joints:1280,thr:"待設定",st:"草稿",stc:"b-gry",owner:"林巧宜",upd:"08/13",cov:0,line:"L2"}
    ];
    function screen0(){
      var lis="";
      for(var i=0;i<PROGS.length;i++){var p=PROGS[i];
        var col=p.st==="生效"?"linear-gradient(135deg,#16a34a,#4ade80)":p.st==="草稿"?"linear-gradient(135deg,#94a3b8,#cbd5e1)":"linear-gradient(135deg,#d97706,#fbbf24)";
        lis+='<div class="li'+(i===0?" on":"")+'" data-p="'+i+'"><div class="th" style="background:'+col+'">'+p.line+'</div><div class="in"><div class="t">'+p.name+'</div><div class="m">'+p.id+' · '+p.rev+' · '+p.owner+'</div></div></div>';
      }
      var h=head("X光檢測程式","板卡檢測程式版本、判定門檻與焊點覆蓋維護","6 支程式 · 4 支生效");
      h+='<div class="kpis" style="margin-bottom:14px">'+
        kpi("生效程式","3","涵蓋 5 條 SMT 線","up")+
        kpi("待審核","1","COM-C08 v1.9","")+
        kpi("平均焊點覆蓋","97%","+2% 較上月","up")+
        kpi("門檻異動 (30日)","12","2 筆待複核","")+'</div>';
      h+='<div class="split"><div class="list"><div class="lfilter"><span class="chip on">全部</span><span class="chip">生效</span><span class="chip">審核中</span><span class="chip">草稿</span></div><div class="lwrap" style="flex-direction:column;width:100%">'+lis+'</div></div><div class="detail" id="pgDetail"></div></div>';
      host.innerHTML=h;
      renderProg(0);
      host.querySelector(".list").addEventListener("click",function(e){
        var b=e.target.closest("[data-p]");if(!b)return;
        var idx=+b.getAttribute("data-p");
        var all=host.querySelectorAll(".li");for(var k=0;k<all.length;k++)all[k].classList.remove("on");
        b.classList.add("on");renderProg(idx);
      });
    }
    function renderProg(i){
      var p=PROGS[i];var box=el("pgDetail");if(!box)return;
      var h='<div class="card"><h3><span class="material-symbols-outlined">biotech</span>'+esc(p.name)+' <span class="b '+p.stc+'" style="margin-left:auto">'+p.st+'</span></h3>'+
        '<div class="drow"><span class="k">程式編號</span><span class="v">'+p.id+'</span></div>'+
        '<div class="drow"><span class="k">版本 / 產線</span><span class="v">'+p.rev+' · '+p.line+'</span></div>'+
        '<div class="drow"><span class="k">焊點總數</span><span class="v">'+p.joints.toLocaleString()+' 點</span></div>'+
        '<div class="drow"><span class="k">關鍵判定門檻</span><span class="v">'+p.thr+'</span></div>'+
        '<div class="drow"><span class="k">維護工程師</span><span class="v">'+p.owner+' · 更新 '+p.upd+'</span></div>'+
        '<div style="margin-top:12px"><div class="muted" style="display:flex;justify-content:space-between"><span>焊點程式覆蓋率</span><span style="font-weight:800;color:var(--acc-d)">'+p.cov+'%</span></div><div class="meter" style="margin-top:6px"><i style="width:'+p.cov+'%"></i></div></div>'+
        '<div class="btnrow" style="margin-top:14px"><button class="btn pri"><span class="material-symbols-outlined">edit</span>編輯門檻</button><button class="btn"><span class="material-symbols-outlined">difference</span>版本比對</button><button class="btn"><span class="material-symbols-outlined">play_arrow</span>試跑驗證</button></div></div>';
      h+='<div class="g2"><div class="card"><h3><span class="material-symbols-outlined">tune</span>缺陷判定門檻</h3><div class="scroll"><table><thead><tr><th>缺陷類型</th><th>量測</th><th>門檻</th><th>狀態</th></tr></thead><tbody>'+
        thr("焊點空洞","面積比","≤ 18%","b-grn","啟用")+
        thr("橋接短路","相鄰間距","偵測 ON","b-grn","啟用")+
        thr("少錫 / 缺錫","錫高","≥ 0.10mm","b-grn","啟用")+
        thr("偏移 (Shift)","中心位移","≤ 0.05mm","b-amb","觀察")+
        thr("空焊 (Open)","連接判定","模型判讀","b-grn","啟用")+
        '</tbody></table></div></div>';
      h+='<div class="card"><h3><span class="material-symbols-outlined">history</span>版本變更紀錄</h3><div class="tl">'+
        tli(true,"v4.2 提高空洞門檻至18%","陳彥廷 · 08/12","降低車規誤判，通過工程試跑")+

    function show(i){
      killCharts();
      var btns=document.querySelectorAll("[data-i]");

      SCREENS[i]();
    }
    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
