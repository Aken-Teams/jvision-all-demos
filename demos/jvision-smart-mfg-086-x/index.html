<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AXI 自動X光檢測管理｜Jvision 系統 Demo</title>
  <meta name="description" content="焊點X光檢測：從影像判讀到缺陷處置與檢出率驗證的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --panel:#fff;
      --soft:#f1f5f9;
      --success:#15803d;
      --success-bg:#dcfce7;
      --warning:#9a3412;
      --warning-bg:#ffedd5;
      --danger:#b91c1c;
      --danger-bg:#fee2e2;
      --info:#1d4ed8;
      --info-bg:#dbeafe;
      --shadow:0 12px 30px rgba(15,23,42,.07);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    button{font:inherit}
    button,.li,.chip{cursor:pointer}
    button:focus-visible,.li:focus-visible,.chip:focus-visible,.joint:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .mono,.kv,td:nth-child(1),td:nth-child(3),td:nth-child(4),.v,.ix,.cnt{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .app{width:min(1440px,100%);margin:auto;padding:0 24px 40px}
    .top-shell{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    .top{display:flex;align-items:center;gap:14px;min-height:78px}
    .logo{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;background:var(--blue);color:#fff;border-radius:4px;box-shadow:6px 6px 0 #bfdbfe}
    .logo span{font-size:25px}
    .brand{min-width:0}
    .brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .live{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid #86efac;background:#f0fdf4;color:#166534;font-size:12px;font-weight:600}
    .dot{width:8px;height:8px;background:#15803d;box-shadow:0 0 0 3px #bbf7d0}
    nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0 16px;scrollbar-width:thin}
    .nb{display:flex;align-items:center;gap:7px;flex:0 0 auto;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--muted);font-size:12px;font-weight:600;transition:color .2s,border-color .2s,background .2s,transform .2s}
    .nb:hover{border-color:#93c5fd;color:var(--blue);transform:translateY(-1px)}
    .nb.on{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:4px 4px 0 #bfdbfe}
    .nb .material-symbols-outlined{font-size:18px}
    .ix{display:grid;place-items:center;width:23px;height:23px;background:var(--soft);color:var(--blue);font-size:10px;font-weight:700}
    .nb.on .ix{background:rgba(255,255,255,.18);color:#fff}
    main{padding-top:18px}
    .shead{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
    .shead h2{margin:0;font-size:clamp(23px,3vw,34px);line-height:1.12;letter-spacing:-.035em}
    .shead .sub{margin:7px 0 0;color:var(--muted);font-size:13px}
    .tag{margin-left:auto;padding:7px 10px;border-left:3px solid var(--color-accent);background:#fff7ed;color:#9a3412;font-size:11px;font-weight:700}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .kpi,.card,.list{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
    .kpi{position:relative;min-width:0;padding:15px;border-radius:3px;overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s}
    .kpi:hover,.card:hover{border-color:#bfdbfe;box-shadow:0 16px 34px rgba(37,99,235,.09)}
    .kpi:hover{transform:translateY(-2px)}
    .kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
    .kl{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .kv{margin-top:5px;font-size:25px;font-weight:700;line-height:1.15;letter-spacing:-.05em}
    .kd{margin-top:4px;color:var(--muted);font-size:11px;font-weight:600}
    .up{color:#166534}.down{color:var(--danger)}
    .card{min-width:0;padding:16px;border-radius:4px;transition:border-color .22s,box-shadow .22s}
    .card h3{display:flex;align-items:center;gap:8px;margin:0 0 13px;font-size:13px}
    .card h3>.material-symbols-outlined{color:var(--blue);font-size:19px}
    .muted{color:var(--muted);font-size:12px}
    .split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
    .list{padding:10px;border-radius:4px}
    .lfilter,.btnrow,.lg,.xleg{display:flex;gap:7px;flex-wrap:wrap}
    .lfilter{padding:2px 2px 10px}
    .chip{min-height:32px;padding:5px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--muted);font-size:11px;font-weight:600;transition:.2s}
    .chip:hover,.chip.on{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
    .li{display:flex;gap:10px;min-width:0;padding:11px 9px;border:1px solid transparent;border-radius:3px;transition:.2s}
    .li:hover{background:#f8fafc}
    .li.on{border-color:#93c5fd;background:#eff6ff;box-shadow:inset 3px 0 var(--blue)}
    .th{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;border-radius:2px;color:#fff;font-size:11px;font-weight:700}
    .in{min-width:0;flex:1}
    .in .t{overflow:hidden;font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .in .m{overflow:hidden;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-overflow:ellipsis;white-space:nowrap}
    .detail{display:flex;min-width:0;flex-direction:column;gap:14px}
    .g2,.g3,.g2a,.gauge,.board{display:grid;gap:14px}
    .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2a{grid-template-columns:1.5fr 1fr}.gauge{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(4,1fr)}
    .scroll{overflow-x:auto}
    table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
    th{padding:9px 10px;border-bottom:2px solid #cbd5e1;background:#f8fafc;color:#334155;font-size:10px;font-weight:700;text-align:left;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr:hover{background:#f8fafc}
    tbody tr:last-child td{border-bottom:0}
    td:nth-child(n+3){font-variant-numeric:tabular-nums}
    .b{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid transparent;border-radius:2px;font-size:10px;font-weight:700;white-space:nowrap}
    .b:before{font-family:"Material Symbols Outlined";font-size:13px;font-weight:normal}
    .b-red{border-color:#fecaca;background:var(--danger-bg);color:#991b1b}.b-red:before{content:"error"}
    .b-amb{border-color:#fed7aa;background:var(--warning-bg);color:#9a3412}.b-amb:before{content:"priority_high"}
    .b-grn{border-color:#bbf7d0;background:var(--success-bg);color:#166534}.b-grn:before{content:"check_circle"}
    .b-blu{border-color:#bfdbfe;background:var(--info-bg);color:#1e40af}.b-blu:before{content:"info"}
    .b-gry{border-color:#cbd5e1;background:#f1f5f9;color:#475569}.b-gry:before{content:"schedule"}
    .drow{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
    .drow:last-child{border:0}.drow .k{color:var(--muted);font-weight:500}.drow .v{text-align:right;font-weight:600}
    .btnrow{margin-top:13px}
    .btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:3px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
    .btn:hover{border-color:var(--blue);background:#eff6ff;transform:translateY(-1px)}
    .btn.pri{border-color:var(--color-accent);background:var(--color-accent);color:#fff;box-shadow:4px 4px 0 #fed7aa}
    .btn.pri:hover{background:#c2410c}.btn.dng{border-color:#fecaca;background:#fff1f2;color:#b91c1c}
    .btn .material-symbols-outlined{font-size:17px}
    .meter,.prog{height:7px;overflow:hidden;background:var(--color-muted);border-radius:1px}
    .meter i,.prog i{display:block;height:100%;background:var(--blue)}
    .xray{padding:14px;background:#111827;border-radius:3px}
    .xray .grid{position:relative;height:300px;border:1px solid #475569;background-color:#0f172a;background-image:linear-gradient(rgba(96,165,250,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.13) 1px,transparent 1px);background-size:26px 26px}
    .joint{position:absolute;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;transform:translate(-50%,-50%);color:#111827;font:700 11px "Fira Code";transition:transform .2s}
    .joint:hover{transform:translate(-50%,-50%) scale(1.12)}
    .joint.ok{background:radial-gradient(circle at 35% 30%,#bbf7d0,#22c55e)}
    .joint.bad{background:radial-gradient(circle at 35% 30%,#fecaca,#ef4444);box-shadow:0 0 0 4px rgba(248,113,113,.3)}
    .joint.rev{background:radial-gradient(circle at 35% 30%,#ffedd5,#f97316);box-shadow:0 0 0 4px rgba(251,146,60,.3)}
    .xleg{margin-top:10px;color:#e2e8f0;font-size:11px}.xleg span,.lg span{display:inline-flex;align-items:center;gap:6px}
    .xd{width:11px;height:11px;border-radius:50%}.lg{margin-top:8px;color:var(--muted);font-size:11px}.sw{width:11px;height:11px}
    .cwrap{position:relative;width:100%;overflow:hidden}
    .col{min-width:0;padding:9px;background:#f1f5f9;border-top:3px solid #94a3b8}
    .ch{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 9px;font-size:11px;font-weight:700}
    .cnt{padding:1px 6px;border:1px solid var(--line);background:#fff;font-size:10px}
    .tk{margin-bottom:7px;padding:9px;border:1px solid var(--line);background:#fff}.tk:last-child{margin:0}
    .tt{font-size:11px;font-weight:700}.tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--muted);font-size:10px}
    .tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
    .tli{position:relative;padding-bottom:16px}.tli:last-child{padding-bottom:0}
    .tli:before{content:"";position:absolute;top:3px;left:-19px;width:10px;height:10px;border:2px solid #94a3b8;background:#fff}
    .tli.done:before{border-color:var(--blue);background:var(--blue)}
    .tli .tt{font-size:12px;font-weight:700}.tli .ts{color:#1d4ed8;font-family:"Fira Code";font-size:10px;font-weight:600}.tli .tx{margin-top:2px;color:var(--muted);font-size:11px}
    .gc{padding:8px 2px;text-align:center}.gv{font-family:"Fira Code";font-size:27px;font-weight:700;letter-spacing:-.05em}.gl{margin-top:3px;color:var(--muted);font-size:11px}
    .foot{padding:25px 0 4px;color:var(--muted);font-size:10px;text-align:center}
    .grid-item{animation:enter .42s cubic-bezier(.22,.85,.32,1.22) both}
    .grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
    @keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
    @media(max-width:1024px){.split{grid-template-columns:290px 1fr}.g2a{grid-template-columns:1.2fr 1fr}}
    @media(max-width:768px){.app{padding:0 16px 28px}.top-shell{position:relative}.split,.g2,.g3,.g2a,.gauge{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.list{display:flex;overflow-x:auto}.lfilter{min-width:max-content}.lwrap{display:flex!important;flex-direction:row!important;gap:6px}.li{min-width:240px}.shead{align-items:flex-start;flex-direction:column}.tag{margin-left:0}.board{min-width:720px}.brand p{display:none}}
    @media(max-width:480px){.app{padding-inline:12px}.live{width:100%;margin-left:58px}.top{padding:12px 0;flex-wrap:wrap}.kpis{grid-template-columns:1fr}.nb .ntx{display:none}.nb{padding:8px 10px}.kv{font-size:23px}.card{padding:13px}.xray .grid{height:260px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.grid-item{opacity:1!important;transform:none!important}}
  </style>
</head>
<body>
  <div class="top-shell">
    <div class="app" style="padding-bottom:0">
      <header class="top">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">biotech</span></div>
        <div class="brand"><h1>AXI 自動X光檢測管理</h1><p>焊點X光檢測 · 缺陷判讀 · 處置追溯與檢出率管制</p></div>
        <div class="live"><span class="dot" aria-hidden="true"></span>3 台 AXI 機台線上</div>
      </header>
      <nav id="nav" aria-label="功能導覽"></nav>
    </div>
  </div>
  <div class="app">
    <main id="screen" tabindex="-1"></main>
    <footer class="foot">Jvision Demo · AXI 自動X光檢測管理系統 · 本頁為純前端展示，資料皆為模擬</footer>
  </div>
  <script>
  (function(){
    "use strict";
    var C={acc:"#2563eb",acc2:"#3b82f6",accD:"#1d4ed8",warn:"#dc2626",amber:"#ea580c",info:"#2563eb",mut:"#475569",line:"#e2e8f0",soft:"#f1f5f9"};
    var NAV=[
      {ix:"M1",icon:"biotech",t:"X光檢測程式"},
      {ix:"M2",icon:"insights",t:"缺陷影像判讀"},
      {ix:"M3",icon:"rule",t:"缺陷分類複判"},
      {ix:"M4",icon:"warning",t:"異常通報處置"},
      {ix:"M5",icon:"precision_manufacturing",t:"機台校驗追蹤"},
      {ix:"M6",icon:"monitoring",t:"檢出率SPC分析"}
    ];
    var host=document.getElementById("screen"),navEl=document.getElementById("nav"),charts=[];
    function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
    function el(id){return document.getElementById(id)}
    function chart(id,cfg){var cv=el(id);if(!cv)return;var c=new Chart(cv.getContext("2d"),cfg);charts.push(c)}
    function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
    function head(t,s,tag){return '<div class="shead"><div><h2>'+t+'</h2><p class="sub">'+s+'</p></div><span class="tag">'+tag+'</span></div>'}
    function kpi(l,v,d,c){return '<div class="kpi grid-item"><div class="kl">'+l+'</div><div class="kv">'+v+'</div><div class="kd '+(c||"")+'">'+d+'</div></div>'}
    function badge(c,t){return '<span class="b '+c+'">'+t+'</span>'}
    function row(k,v){return '<div class="drow"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
    function btn(c,i,t){return '<button type="button" class="btn '+(c||"")+'">'+icon(i)+t+'</button>'}
    function tli(done,t,s,x){return '<div class="tli'+(done?" done":"")+'"><div class="tt">'+t+'</div><div class="ts">'+s+'</div>'+(x?'<div class="tx">'+x+'</div>':'')+'</div>'}
    navEl.innerHTML=NAV.map(function(n,i){return '<button type="button" class="nb" data-i="'+i+'" aria-label="'+n.t+'"><span class="ix">'+n.ix+'</span>'+icon(n.icon)+'<span class="ntx">'+n.t+'</span></button>'}).join("");
    navEl.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)location.hash="v"+b.dataset.i});

    var PROGS=[
      {id:"AXI-PGM-A71",name:"車用ECU主板 A71",rev:"v4.2",joints:1842,thr:"空洞≤18%",st:"生效",stc:"b-grn",owner:"陳彥廷",upd:"08/12",cov:98,line:"L1"},
      {id:"AXI-PGM-B33",name:"電源模組 PWR-B33",rev:"v2.7",joints:960,thr:"少錫≤0.08mm",st:"生效",stc:"b-grn",owner:"林巧宜",upd:"08/11",cov:96,line:"L2"},
      {id:"AXI-PGM-C08",name:"通訊背板 COM-C08",rev:"v1.9",joints:2410,thr:"橋接偵測 ON",st:"審核中",stc:"b-amb",owner:"黃志鴻",upd:"08/13",cov:91,line:"L1"},
      {id:"AXI-PGM-D54",name:"感測器板 SNS-D54",rev:"v3.1",joints:640,thr:"空洞≤22%",st:"生效",stc:"b-grn",owner:"陳彥廷",upd:"08/09",cov:99,line:"L3"},
      {id:"AXI-PGM-E12",name:"馬達驅動 MDR-E12",rev:"v0.9",joints:1280,thr:"待設定",st:"草稿",stc:"b-gry",owner:"林巧宜",upd:"08/13",cov:0,line:"L2"}
    ];
    function listItem(p,i,type){var danger=type==="ncr"&&p.sev==="高",warn=type==="ncr"&&p.sev==="中",label=type==="ncr"?p.sev:p.line;return '<div class="li'+(i===0?" on":"")+'" tabindex="0" role="button" data-'+(type==="ncr"?"n":"p")+'="'+i+'"><div class="th" style="background:'+(danger?"#dc2626":warn?"#ea580c":p.st==="草稿"?"#64748b":"#2563eb")+'">'+label+'</div><div class="in"><div class="t">'+p.t||p.name+'</div><div class="m">'+p.id+' · '+(type==="ncr"?p.st:p.rev+" · "+p.owner)+'</div></div></div>'}
    function thr(a,b,c,cl,st){return '<tr><td><strong>'+a+'</strong></td><td>'+b+'</td><td>'+c+'</td><td>'+badge(cl,st)+'</td></tr>'}
    function screen0(){
      var h=head("X光檢測程式","板卡檢測程式版本、判定門檻與焊點覆蓋維護","6 支程式 · 4 支生效");
      h+='<div class="kpis">'+kpi("生效程式","3","涵蓋 5 條 SMT 線","up")+kpi("待審核","1","COM-C08 v1.9")+kpi("平均焊點覆蓋","97%","+2% 較上月","up")+kpi("門檻異動 (30日)","12","2 筆待複核")+'</div>';
      h+='<div class="split"><div class="list"><div class="lfilter"><button class="chip on">全部</button><button class="chip">生效</button><button class="chip">審核中</button><button class="chip">草稿</button></div><div class="lwrap" style="flex-direction:column;width:100%">'+PROGS.map(function(p,i){return listItem(p,i,"prog")}).join("")+'</div></div><div class="detail" id="pgDetail"></div></div>';
      host.innerHTML=h;renderProg(0);bindList("p",renderProg)
    }
