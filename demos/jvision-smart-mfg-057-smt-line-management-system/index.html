<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMT產線管理系統 · 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa;
  --bg:#0d0b17; --panel:#171528; --panel2:#1e1b34;
  --line:#2c2846; --txt:#eae8f5; --mut:#9a93bd; --dim:#6f6796;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#241d47 0%,var(--bg) 55%);
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;vertical-align:middle;}

/* NAV */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(13,11,23,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none;}
.brand .logo{
  width:36px;height:36px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 14px rgba(124,58,237,.5);
}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500;}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
.nbtn{
  flex:none;white-space:nowrap;min-width:0;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:9px;border:1px solid transparent;
  background:transparent;color:var(--mut);font-family:inherit;font-size:13px;font-weight:600;
  transition:.15s;
}
.nbtn .material-symbols-outlined{font-size:19px;}
.nbtn:hover{background:var(--panel2);color:var(--txt);}
.nbtn.on{
  background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(167,139,250,.16));
  border-color:var(--accent);color:#fff;
}
.navmeta{display:flex;align-items:center;gap:8px;flex:none;color:var(--mut);font-size:12px;}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18);flex:none;}

/* WRAP */
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;}
.head p{margin:5px 0 0;color:var(--mut);font-size:13px;}
.tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--accent2);
}

/* PANEL */
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.panel h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.sub{color:var(--dim);font-size:11px;font-weight:600;}

/* GRIDS */
.g{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2a{grid-template-columns:1.6fr 1fr;}
.g-2b{grid-template-columns:1fr 1.5fr;}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-3,.g-2a,.g-2b{grid-template-columns:1fr;}
}
@media(max-width:480px){ .g-kpi{grid-template-columns:1fr;} }

/* KPI */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden;min-width:0;}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%);}
.kpi .kl{color:var(--mut);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .kv{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.5px;}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--mut);margin-left:3px;}
.kpi .kd{margin-top:6px;font-size:11px;font-weight:600;}
.up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--mut);}

/* TABLE */
.tblwrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
td{color:var(--txt);}
tr:hover td{background:rgba(124,58,237,.06);}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-ok{background:rgba(52,211,153,.16);color:var(--ok);}
.b-warn{background:rgba(251,191,36,.16);color:var(--warn);}
.b-bad{background:rgba(251,113,133,.16);color:var(--bad);}
.b-info{background:rgba(96,165,250,.16);color:var(--info);}
.b-mut{background:rgba(154,147,189,.14);color:var(--mut);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* BAR */
.bar{height:7px;border-radius:6px;background:var(--panel);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

/* CHART */
.chart-box{position:relative;height:260px;}
.chart-sm{position:relative;height:200px;}

/* LINE STATUS BOARD */
.lineboard{display:flex;flex-direction:column;gap:10px;}
.station{
  display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;
  border-left:4px solid var(--accent);
}
.station.warn{border-left-color:var(--warn);}
.station.bad{border-left-color:var(--bad);}
.station .sicon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(124,58,237,.16);color:var(--accent2);flex:none;}
.station .sname{font-weight:700;font-size:13.5px;}
.station .smeta{color:var(--mut);font-size:11.5px;margin-top:2px;}
.station .sright{text-align:right;flex:none;}
.station .sright b{font-size:18px;font-weight:800;}

/* PCB DEFECT MAP */
.pcbmap{
  display:grid;grid-template-columns:repeat(12,1fr);gap:4px;
  background:#0b2018;border:1px solid #1e3a30;border-radius:10px;padding:10px;min-width:360px;
}
.cell{aspect-ratio:1;border-radius:3px;background:#123326;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.cell.d1{background:var(--warn);color:#3a2a00;}
.cell.d2{background:var(--bad);color:#3a0010;}
.cell.d3{background:var(--info);color:#04203a;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--mut);}
.legend span{display:inline-flex;align-items:center;gap:6px;}

/* CHANGEOVER GANTT */
.gantt{display:flex;flex-direction:column;gap:8px;min-width:420px;}
.grow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;min-width:0;}
.gname{font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;}
.gtrack{position:relative;height:26px;background:var(--panel);border-radius:7px;overflow:hidden;}
.gseg{position:absolute;top:0;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;overflow:hidden;}
.gscale{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:10px;color:var(--dim);margin-top:4px;min-width:420px;}
.gscale .ticks{display:flex;justify-content:space-between;}

/* TRACE TIMELINE */
.trace{display:flex;flex-direction:column;position:relative;padding-left:26px;}
.trace::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--accent2));}
.tnode{position:relative;padding:11px 0 11px 6px;}
.tnode::before{content:"";position:absolute;left:-22px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--accent2);}
.tnode .tt{font-weight:700;font-size:13px;}
.tnode .tm{color:var(--mut);font-size:11.5px;margin-top:3px;}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;}
.searchbar input{flex:1;min-width:120px;background:transparent;border:none;color:var(--txt);font-family:inherit;font-size:13px;outline:none;}
.searchbar .material-symbols-outlined{color:var(--accent2);}

/* DIFF / CARD */
.diffcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0;}
.diffrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
.diffrow:last-child{border-bottom:none;}
.diffrow .old{color:var(--bad);text-decoration:line-through;opacity:.75;}
.diffrow .new{color:var(--ok);font-weight:700;}

/* GAUGE */
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;min-width:0;}
.gauge .gv{font-size:24px;font-weight:800;margin-top:4px;}
.gauge .gl{color:var(--mut);font-size:12px;font-weight:600;}
.gauge .gt{font-size:10.5px;margin-top:5px;color:var(--dim);}

.notewrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.note{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--mut);}
.note .material-symbols-outlined{font-size:16px;color:var(--accent2);}

.foot{margin-top:24px;color:var(--dim);font-size:11.5px;text-align:center;line-height:1.7;}
.mt14{margin-top:14px;}
@media(max-width:560px){ .brand small{display:none;} .navlabel{display:none;} }
@media(max-width:860px){ .navmeta{display:none;} }
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">developer_board</span></div>
    <div><b>SMT LineOps</b><small>SMT產線管理控制台</small></div>
  </div>
  <div class="navbtns" id="navbtns"></div>
  <div class="navmeta"><span class="pulse"></span>線上 · 產線 A/B/C</div>
</nav>
<div class="wrap">
  <div id="app"></div>
  <div class="foot">
    純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範，與專案詳細頁的功能模組與運作流程一致 ·
    SMT產線管理系統（SMT Line Management System）
  </div>
</div>

<script>
(function(){
"use strict";

var MODS=[
  {i:0,icon:"dvr",name:"產線總覽"},
  {i:1,icon:"memory",name:"貼片程式"},
  {i:2,icon:"grid_on",name:"SPI 檢測"},
  {i:3,icon:"center_focus_strong",name:"AOI 缺陷"},
  {i:4,icon:"conveyor_belt",name:"設備換線"},
  {i:5,icon:"qr_code_scanner",name:"追溯履歷"}
];

var app=document.getElementById("app");
var navbtns=document.getElementById("navbtns");
var charts=[];

MODS.forEach(function(m){
  var b=document.createElement("button");
  b.className="nbtn";
  b.setAttribute("data-i",m.i);
  b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="navlabel">'+m.name+'</span>';
  b.addEventListener("click",function(){ location.hash="#v"+m.i; });
  navbtns.appendChild(b);
});

function setNav(i){
  var bs=navbtns.querySelectorAll(".nbtn");
  for(var k=0;k<bs.length;k++){ bs[k].className="nbtn"+(k===i?" on":""); }
}

function destroyCharts(){
  for(var k=0;k<charts.length;k++){ try{ charts[k].destroy(); }catch(e){} }
  charts=[];
}

var AX="#9a93bd", GRID="rgba(60,40,90,.35)", LTXT="#eae8f5";
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el) return;
  var c=new Chart(el.getContext("2d"),cfg);
  charts.push(c);
  return c;
}
function axisOpts(extra){
  var o={
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{color:LTXT,font:{size:11}}},
      tooltip:{backgroundColor:"#1e1b34",borderColor:"#7c3aed",borderWidth:1,titleColor:"#fff",bodyColor:"#eae8f5"}},
    scales:{
      x:{ticks:{color:AX,font:{size:10}},grid:{color:GRID}},
      y:{ticks:{color:AX,font:{size:10}},grid:{color:GRID}}
    }
  };
  if(extra){ for(var k in extra){ o[k]=extra[k]; } }
  return o;
}

function head(title,desc,tag){
  return '<div class="head"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+
    '<span class="tag"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+tag+'</span></div>';
}
function kpi(icon,label,val,unit,delta,cls){
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'+
    '<div class="kv">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="kd '+cls+'">'+delta+'</div></div>';
}

/* ===== SCREEN 0 : 產線總覽戰情 ===== */
function s0(){
  var stations=[
    {icon:"print",name:"印刷機 DEK NeoHorizon (Line A)",meta:"機種 GX-8L · 節拍 22.4s · 換線就緒",util:94,st:""},
    {icon:"precision_manufacturing",name:"高速貼片 SIPLACE SX (Line A)",meta:"貼裝率 99.982% · 拋料率 0.31%",util:96,st:""},
    {icon:"local_fire_department",name:"回焊爐 Reflow 10 溫區 (Line A)",meta:"爐溫曲線正常 · 峰值 245°C",util:91,st:""},
    {icon:"precision_manufacturing",name:"高速貼片 SIPLACE SX (Line B)",meta:"餵料器 42/48 · 供料告警 1 站",util:78,st:"warn"},
    {icon:"local_fire_department",name:"回焊爐 Reflow (Line C)",meta:"停機待料 · 預估復線 14:20",util:0,st:"bad"}
  ];
  var board=stations.map(function(s){
    var tone=s.st==="bad"?"b-bad":s.st==="warn"?"b-warn":"b-ok";
    var word=s.st==="bad"?"停機":s.st==="warn"?"告警":"運轉";
    return '<div class="station '+s.st+'"><div class="sicon"><span class="material-symbols-outlined">'+s.icon+'</span></div>'+
      '<div style="min-width:0"><div class="sname">'+s.name+'</div><div class="smeta">'+s.meta+'</div>'+
      '<div class="bar" style="margin-top:7px"><i style="width:'+s.util+'%"></i></div></div>'+
      '<div class="sright"><b>'+s.util+'%</b><div><span class="badge '+tone+'">'+word+'</span></div></div></div>';
  }).join("");

  app.innerHTML=head("產線總覽戰情","印刷 / 貼片 / 回焊三站即時稼動、產出與異常一屏掌握","即時 · 30秒刷新")+
    '<div class="g g-kpi mt14">'+
      kpi("speed","綜合稼動率 OEE","86.2","%","▲ 3.1% 對比昨日","up")+
      kpi("check_circle","首件合格率 FPY","98.4","%","▲ 0.6% 週趨勢","up")+
      kpi("all_inbox","今日產出","18,420","片","目標 20,000 · 92%","flat")+
      kpi("warning","開放異常","3","件","貼片1 · 回焊1 · 供料1","down")+
    '</div>'+
    '<div class="g g-2a mt14">'+
      '<div class="panel"><h3><span class="material-symbols-outlined">view_timeline</span>各站即時狀態板 <span class="sub">Line A / B / C</span></h3>'+
        '<div class="lineboard">'+board+'</div></div>'+
      '<div class="panel"><h3><span class="material-symbols-outlined">show_chart</span>近 8 小時 OEE 趨勢</h3>'+
        '<div class="chart-box"><canvas id="c0oee"></canvas></div>'+
        '<div class="notewrap"><span class="note"><span class="material-symbols-outlined">insights</span>可用率 92% · 表現率 96% · 良率 98%</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="g g-2 mt14">'+
      '<div class="panel"><h3><span class="material-symbols-outlined">bar_chart</span>各產線班別產出（片）</h3><div class="chart-sm"><canvas id="c0out"></canvas></div></div>'+
      '<div class="panel"><h3><span class="material-symbols-outlined">pie_chart</span>停機損失分布</h3><div class="chart-sm"><canvas id="c0loss"></canvas></div></div>'+
    '</div>';
  void app.offsetHeight;

  mkChart("c0oee",{type:"line",data:{labels:["07","08","09","10","11","12","13","14"],
    datasets:[
      {label:"OEE %",data:[81,84,86,85,88,83,87,86],borderColor:"#a78bfa",backgroundColor:"rgba(167,139,250,.15)",fill:true,tension:.4,pointRadius:3},
      {label:"可用率 %",data:[88,90,93,91,94,89,93,92],borderColor:"#60a5fa",backgroundColor:"transparent",tension:.4,pointRadius:2,borderDash:[5,4]}
    ]},options:axisOpts({scales:{x:{ticks:{color:AX},grid:{color:GRID}},y:{min:60,max:100,ticks:{color:AX},grid:{color:GRID}}}})});

  mkChart("c0out",{type:"bar",data:{labels:["Line A","Line B","Line C"],
    datasets:[
      {label:"早班",data:[6200,5100,3800],backgroundColor:"#7c3aed"},
      {label:"晚班",data:[5900,4700,0],backgroundColor:"#a78bfa"}
    ]},options:axisOpts()});

  mkChart("c0loss",{type:"doughnut",data:{labels:["換線","待料","設備故障","品質調機","計畫保養"],
    datasets:[{data:[38,22,15,17,8],backgroundColor:["#7c3aed","#a78bfa","#fb7185","#fbbf24","#60a5fa"],borderColor:"#171528",borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{color:LTXT,font:{size:11}}}}}});
}

/* ===== SCREEN 1 : 貼片程式版本管理 ===== */
function s1(){
  var rows=[
    {mc:"GX-8L 主板",ver:"v4.2.1",st:"生效",who:"陳彥廷",dt:"08/14 09:12",diff:"+2 -1",b:"b-ok"},
    {mc:"GX-8L 主板",ver:"v4.2.0",st:"封存",who:"陳彥廷",dt:"08/10 14:05",diff:"+5 -3",b:"b-mut"},
    {mc:"PWR-24 電源板",ver:"v2.7.3",st:"審核中",who:"林巧薇",dt:"08/14 08:40",diff:"+1 -0",b:"b-warn"},
    {mc:"RF-Mod 射頻模組",ver:"v1.9.0",st:"生效",who:"郭仲翔",dt:"08/13 16:22",diff:"+3 -2",b:"b-ok"},
    {mc:"SEN-12 感測板",ver:"v3.1.5",st:"測試",who:"林巧薇",dt:"08/12 11:08",diff:"+4 -1",b:"b-info"},
    {mc:"IO-Ext 擴充板",ver:"v5.0.2",st:"生效",who:"郭仲翔",dt:"08/11 10:33",diff:"+2 -2",b:"b-ok"}
  ];
  var trs=rows.map(function(r){
    return '<tr><td><b>'+r.mc+'</b></td><td class="mono">'+r.ver+'</td>'+
      '<td><span class="badge '+r.b+'">'+r.st+'</span></td><td>'+r.who+'</td>'+
      '<td class="mono">'+r.dt+'</td><td class="mono">'+r.diff+'</td>'+

        '<div class="tblwrap"><table style="min-width:460px"><thead><tr><th>板序號</th><th>機種</th><th>錫膏批號</th><th>結果</th><th>族譜</th></tr></thead><tbody>'+trs+'</tbody></table></div>'+
        '<div class="panel mt14" style="background:var(--panel);"><h3 style="margin-bottom:8px"><span class="material-symbols-outlined">donut_small</span>追溯資料完整度</h3>'+
          '<div class="chart-sm" style="height:180px"><canvas id="c5cov"></canvas></div></div>'+
      '</div>'+
    '</div>';
  void app.offsetHeight;

  mkChart("c5cov",{type:"radar",data:{labels:["序號","料捲","錫膏","程式","爐溫","AOI"],
    datasets:[
      {label:"綁定完整度 %",data:[100,100,98,100,96,99],borderColor:"#a78bfa",backgroundColor:"rgba(167,139,250,.25)",pointBackgroundColor:"#7c3aed"}
    ]},options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:LTXT,font:{size:11}}}},
      scales:{r:{min:80,max:100,angleLines:{color:GRID},grid:{color:GRID},pointLabels:{color:AX,font:{size:11}},ticks:{color:AX,backdropColor:"transparent",font:{size:9}}}}}});
}

var RENDER=[s0,s1,s2,s3,s4,s5];

function show(i){
  if(i<0) i=0; if(i>RENDER.length-1) i=RENDER.length-1;
  destroyCharts();
  setNav(i);
  RENDER[i]();
}

if(!location.hash){ show(0); }
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
