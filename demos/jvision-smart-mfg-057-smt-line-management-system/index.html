<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMT產線管理系統 · 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}
.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:18px;
  min-height:68px;
  padding:10px max(18px,calc((100vw - 1400px)/2));
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 10px rgba(15,23,42,.04);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  flex:none;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.navbtns{
  display:flex;
  flex:1;
  gap:4px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.navbtns::-webkit-scrollbar{display:none}
.nbtn{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
  min-height:40px;
  padding:8px 11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
}
.nbtn .material-symbols-outlined{font-size:18px}
.nbtn:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
.nbtn:active{transform:translateY(1px)}
.nbtn.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.2)}
.navmeta{display:flex;align-items:center;gap:7px;flex:none;color:var(--muted);font-size:11px;font-weight:600}
.pulse{width:8px;height:8px;flex:none;background:var(--ok);border:2px solid #DCFCE7;border-radius:50%;box-shadow:0 0 0 1px var(--ok)}
.wrap{width:min(1400px,100%);margin:auto;padding:24px 20px 48px}
#app{animation:screen-in .35s ease both}
.head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  padding:18px 20px;
  margin-bottom:14px;
  background:#fff;
  border:1px solid var(--line);
  border-left:5px solid var(--blue);
  box-shadow:var(--shadow);
}
.head h1{margin:0;font-size:clamp(21px,2vw,28px);font-weight:700;letter-spacing:-.025em}
.head p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 10px;
  color:#1D4ED8;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:5px;
  font:600 11px "Fira Code",monospace;
  white-space:nowrap;
}
.panel,.kpi,.gauge,.diffcard{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:7px;
}
.panel{padding:16px;box-shadow:var(--shadow)}
.panel h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 13px;
  color:var(--ink);
  font-size:13px;
  font-weight:700;
}
.panel h3 .material-symbols-outlined{font-size:19px;color:var(--blue)}
.sub{color:var(--muted);font-size:10px;font-weight:500}
.g{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2a{grid-template-columns:1.55fr 1fr}
.g-2b{grid-template-columns:1fr 1.5fr}
.mt14{margin-top:12px}
.kpi{
  position:relative;
  overflow:hidden;
  padding:14px 15px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:var(--shadow)}
.kl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600}
.kl .material-symbols-outlined{font-size:17px;color:var(--blue)}
.kv{
  margin-top:8px;
  color:var(--ink);
  font:700 25px "Fira Code",monospace;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kv small{margin-left:4px;color:var(--muted);font:500 11px "Fira Sans",sans-serif;letter-spacing:0}
.kd{margin-top:6px;font-size:10px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{width:100%;min-width:460px;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{
  color:#334155;
  background:#F1F5F9;
  font-size:10px;
  font-weight:700;
  letter-spacing:.055em;
  text-transform:uppercase;
}
td{color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#F8FAFC}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:23px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.badge::before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.b-ok{color:#166534;background:#F0FDF4}.b-warn{color:#854D0E;background:#FEFCE8}
.b-bad{color:#B91C1C;background:#FEF2F2}.b-info{color:#075985;background:#F0F9FF}
.b-mut{color:#475569;background:#F8FAFC}
.bar{height:6px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
.chart-box{position:relative;height:260px}.chart-sm{position:relative;height:200px}
.lineboard{display:flex;flex-direction:column;gap:8px}
.station{
  display:grid;
  grid-template-columns:40px 1fr auto;
  gap:11px;
  align-items:center;
  min-width:0;
  padding:10px 12px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-left:4px solid var(--ok);
  border-radius:5px;
  transition:background .2s ease,border-color .2s ease;
}
.station:hover{background:#fff;border-color:#93C5FD}
.station.warn{border-left-color:var(--warn)}.station.bad{border-left-color:var(--bad)}
.sicon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  flex:none;
  color:var(--blue);
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:5px;
}
.sname{font-size:12px;font-weight:700}.smeta{margin-top:2px;color:var(--muted);font-size:10px}
.sright{text-align:right}.sright b{font:700 17px "Fira Code",monospace}
.pcbmap{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:4px;
  min-width:360px;
  padding:10px;
  background:#ECFDF5;
  border:1px solid #86EFAC;
  border-radius:5px;
}
.cell{
  display:grid;
  place-items:center;
  aspect-ratio:1;
  color:#14532D;
  background:#BBF7D0;
  border:1px solid #86EFAC;
  border-radius:2px;
  font:700 9px "Fira Code",monospace;
}
.cell.d1{color:#713F12;background:#FEF08A;border:2px dashed #A16207}
.cell.d2{color:#fff;background:#DC2626;border:2px solid #7F1D1D}
.cell.d3{color:#0C4A6E;background:#BAE6FD;border:2px dotted #0369A1}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}.dot{display:inline-block;width:8px;height:8px;border:1px solid currentColor;border-radius:2px}
.gantt{display:flex;flex-direction:column;gap:7px;min-width:420px}
.grow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.gname{color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
.gtrack{position:relative;height:25px;overflow:hidden;background:#E2E8F0;border-radius:3px}
.gseg{position:absolute;top:0;display:flex;align-items:center;justify-content:center;height:100%;overflow:hidden;color:#fff;border-right:2px solid #fff;font-size:9px;font-weight:700}
.gscale{display:grid;grid-template-columns:120px 1fr;gap:10px;min-width:420px;margin-top:4px;color:var(--muted);font:9px "Fira Code",monospace}
.ticks{display:flex;justify-content:space-between}
.trace{position:relative;display:flex;flex-direction:column;padding-left:25px}
.trace::before{content:"";position:absolute;top:7px;bottom:7px;left:8px;width:2px;background:#93C5FD}
.tnode{position:relative;padding:10px 0 10px 6px}
.tnode::before{content:"";position:absolute;top:14px;left:-22px;width:11px;height:11px;background:#fff;border:3px solid var(--blue);border-radius:50%}
.tt{font-size:12px;font-weight:700}.tm{margin-top:3px;color:var(--muted);font:10px/1.6 "Fira Code",monospace}
.searchbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#fff;
  border:1px solid #93C5FD;
  border-left:4px solid var(--blue);
  border-radius:5px;
  box-shadow:var(--shadow);
}
.searchbar input{flex:1;min-width:120px;color:var(--ink);background:transparent;border:0;outline:0;font-family:"Fira Code",monospace;font-size:12px}
.searchbar .material-symbols-outlined{color:var(--blue)}
.diffcard{padding:12px}
.diffrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:11px}
.diffrow:last-child{border:0}.old{color:var(--bad);text-decoration:line-through}.new{color:var(--ok);font-weight:700}
.gauge{padding:14px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.gv{margin-top:5px;color:var(--blue);font:700 23px "Fira Code",monospace}.gl{color:var(--muted);font-size:11px;font-weight:600}.gt{margin-top:5px;color:var(--muted);font-size:9px}
.notewrap{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.note{display:flex;align-items:center;gap:6px;padding:6px 9px;color:var(--muted);background:#F8FAFC;border:1px solid var(--line);border-radius:4px;font-size:10px}
.note .material-symbols-outlined{font-size:15px;color:var(--blue)}
.foot{margin-top:22px;color:var(--muted);font-size:10px;line-height:1.7;text-align:center}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.navmeta{display:none}.g-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .nav{align-items:flex-start;gap:8px;flex-wrap:wrap;padding:9px 14px}.brand{width:100%}
  .navbtns{width:100%;margin:0 -3px}.wrap{padding:16px 14px 40px}
  .g-kpi{grid-template-columns:repeat(2,1fr)}.g-2,.g-2a,.g-2b{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand small{display:none}.navlabel{display:none}.nbtn{flex:1;justify-content:center;padding:8px;min-width:42px}
  .head{align-items:flex-start;flex-direction:column;padding:15px}.head h1{font-size:21px}.tag{align-self:stretch;justify-content:center}
  .g-3{grid-template-columns:1fr}.station{grid-template-columns:36px 1fr auto;padding:9px}.sicon{width:36px;height:36px}
}
@media(max-width:390px){.g-kpi{grid-template-columns:1fr}.wrap{padding-inline:10px}.panel{padding:12px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<nav class="nav" aria-label="主要功能">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">developer_board</span></div>
    <div><b>SMT LineOps</b><small>SMT產線管理控制台</small></div>
  </div>
  <div class="navbtns" id="navbtns"></div>
  <div class="navmeta"><span class="pulse"></span>線上 · 產線 A/B/C</div>
</nav>
<main class="wrap">
  <div id="app"></div>
  <footer class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範，與專案詳細頁的功能模組與運作流程一致 · SMT產線管理系統（SMT Line Management System）</footer>
</main>
<script>
(function(){
"use strict";
var MODS=[
{i:0,icon:"dvr",name:"產線總覽"},
{i:1,icon:"memory",name:"貼片程式"},
{i:2,icon:"grid_on",name:"SPI 檢測"},
{i:3,icon:"center_focus_strong",name:"AOI 缺陷"},
{i:4,icon:"conveyor_belt",name:"設備換線"},
{i:5,icon:"qr_code_scanner",name:"追溯履歷"}
];
var app=document.getElementById("app"),navbtns=document.getElementById("navbtns"),charts=[];
MODS.forEach(function(m){
  var b=document.createElement("button");
  b.className="nbtn";b.type="button";b.setAttribute("data-i",m.i);
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="navlabel">'+m.name+'</span>';
  b.addEventListener("click",function(){location.hash="#v"+m.i});
  navbtns.appendChild(b);
});
function setNav(i){
  var bs=navbtns.querySelectorAll(".nbtn");
  for(var k=0;k<bs.length;k++){
    bs[k].className="nbtn"+(k===i?" on":"");
    bs[k].setAttribute("aria-current",k===i?"page":"false");
  }
}
function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy()}catch(e){}}charts=[]}
var AX="#475569",GRID="rgba(148,163,184,.25)",LTXT="#1E293B";
function mkChart(id,cfg){
  var el=document.getElementById(id);if(!el)return;
  var c=new Chart(el.getContext("2d"),cfg);charts.push(c);return c;
}
function axisOpts(extra){
  var o={
    responsive:true,maintainAspectRatio:false,
    plugins:{
      legend:{labels:{color:LTXT,font:{family:"Fira Sans",size:10},usePointStyle:true,pointStyle:"rectRounded"}},
      tooltip:{backgroundColor:"#FFFFFF",borderColor:"#CBD5E1",borderWidth:1,titleColor:"#1E293B",bodyColor:"#475569",padding:10}
    },
    scales:{
      x:{ticks:{color:AX,font:{family:"Fira Code",size:9}},grid:{color:GRID}},
      y:{ticks:{color:AX,font:{family:"Fira Code",size:9}},grid:{color:GRID}}
    }
  };
  if(extra){for(var k in extra)o[k]=extra[k]}
  return o;
}
function head(title,desc,tag){
  return '<div class="head"><div><h1>'+title+'</h1><p>'+desc+'</p></div><span class="tag"><span class="material-symbols-outlined" style="font-size:16px" aria-hidden="true">bolt</span>'+tag+'</span></div>';
}
function kpi(icon,label,val,unit,delta,cls){
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+label+'</div><div class="kv">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="kd '+cls+'">'+delta+'</div></div>';
}
function s0(){
  var stations=[
    {icon:"print",name:"印刷機 DEK NeoHorizon (Line A)",meta:"機種 GX-8L · 節拍 22.4s · 換線就緒",util:94,st:""},
    {icon:"precision_manufacturing",name:"高速貼片 SIPLACE SX (Line A)",meta:"貼裝率 99.982% · 拋料率 0.31%",util:96,st:""},
    {icon:"local_fire_department",name:"回焊爐 Reflow 10 溫區 (Line A)",meta:"爐溫曲線正常 · 峰值 245°C",util:91,st:""},
    {icon:"precision_manufacturing",name:"高速貼片 SIPLACE SX (Line B)",meta:"餵料器 42/48 · 供料告警 1 站",util:78,st:"warn"},
    {icon:"local_fire_department",name:"回焊爐 Reflow (Line C)",meta:"停機待料 · 預估復線 14:20",util:0,st:"bad"}
  ];
  var board=stations.map(function(s){
    var tone=s.st==="bad"?"b-bad":s.st==="warn"?"b-warn":"b-ok",word=s.st==="bad"?"停機":s.st==="warn"?"告警":"運轉";
    return '<div class="station '+s.st+'"><div class="sicon"><span class="material-symbols-outlined">'+s.icon+'</span></div><div style="min-width:0"><div class="sname">'+s.name+'</div><div class="smeta">'+s.meta+'</div><div class="bar" style="margin-top:7px"><i style="width:'+s.util+'%"></i></div></div><div class="sright"><b>'+s.util+'%</b><div><span class="badge '+tone+'">'+word+'</span></div></div></div>';
  }).join("");
  app.innerHTML=head("產線總覽戰情","印刷 / 貼片 / 回焊三站即時稼動、產出與異常一屏掌握","即時 · 30秒刷新")+
  '<div class="g g-kpi mt14">'+kpi("speed","綜合稼動率 OEE","86.2","%","▲ 3.1% 對比昨日","up")+kpi("check_circle","首件合格率 FPY","98.4","%","▲ 0.6% 週趨勢","up")+kpi("all_inbox","今日產出","18,420","片","目標 20,000 · 92%","flat")+kpi("warning","開放異常","3","件","貼片1 · 回焊1 · 供料1","down")+'</div>'+
  '<div class="g g-2a mt14"><div class="panel"><h3><span class="material-symbols-outlined">view_timeline</span>各站即時狀態板 <span class="sub">Line A / B / C</span></h3><div class="lineboard">'+board+'</div></div><div class="panel"><h3><span class="material-symbols-outlined">show_chart</span>近 8 小時 OEE 趨勢</h3><div class="chart-box"><canvas id="c0oee"></canvas></div><div class="notewrap"><span class="note"><span class="material-symbols-outlined">insights</span>可用率 92% · 表現率 96% · 良率 98%</span></div></div></div>'+
  '<div class="g g-2 mt14"><div class="panel"><h3><span class="material-symbols-outlined">bar_chart</span>各產線班別產出（片）</h3><div class="chart-sm"><canvas id="c0out"></canvas></div></div><div class="panel"><h3><span class="material-symbols-outlined">pie_chart</span>停機損失分布</h3><div class="chart-sm"><canvas id="c0loss"></canvas></div></div></div>';

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  if(i<0)i=0;if(i>RENDER.length-1)i=RENDER.length-1;
  destroyCharts();setNav(i);app.style.animation="none";void app.offsetHeight;app.style.animation="";RENDER[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
