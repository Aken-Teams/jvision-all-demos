<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>採購預算控管系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#15803d;--accent2:#4ade80;--sidebar:#0f2418;--sidebar2:#16321f;
  --ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--bg:#f1f5f4;--card:#ffffff;
  --warn:#dc2626;--warnbg:#fef2f2;--amber:#d97706;--amberbg:#fffbeb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{width:248px;flex:0 0 248px;background:var(--sidebar);color:#e6f2ea;display:flex;flex-direction:column;padding:22px 16px;min-width:0;}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;}
.brand .logo .material-symbols-outlined{font-size:23px;}
.brand h1{font-size:15px;margin:0;font-weight:700;color:#fff;line-height:1.35;}
.brand p{font-size:11px;margin:2px 0 0;color:#7fb99a;}
.navlbl{font-size:10.5px;letter-spacing:.14em;color:#5f9678;padding:14px 10px 7px;font-weight:600;}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:#bcd8c8;font-family:inherit;font-size:13.5px;cursor:pointer;text-align:left;width:100%;transition:.16s;min-width:0;}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;}
.navbtn .ntxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.navbtn:hover{background:var(--sidebar2);color:#fff;}
.navbtn.on{background:linear-gradient(120deg,var(--accent),#1e9d4e);color:#fff;box-shadow:0 6px 16px rgba(21,128,61,.35);}
.sidefoot{margin-top:auto;padding:14px 10px 2px;font-size:11px;color:#5f9678;border-top:1px solid rgba(255,255,255,.07);}
.sidefoot b{color:#a7d0ba;font-weight:600;}
.main{flex:1;min-width:0;padding:26px 30px 46px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.topbar .htxt{min-width:0;}
.topbar h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;}
.topbar .sub{margin:5px 0 0;color:var(--sub);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#15803d;font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;}
.pill .material-symbols-outlined{font-size:16px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:3fr 2fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .cdesc{margin:0 0 14px;font-size:12px;color:var(--sub);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0;position:relative;overflow:hidden;}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:#dcfce7;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:11px;}
.kpi .ic .material-symbols-outlined{font-size:21px;}
.kpi .kl{font-size:12px;color:var(--sub);font-weight:500;}
.kpi .kv{font-size:25px;font-weight:700;margin:3px 0 2px;letter-spacing:-.02em;}
.kpi .kd{font-size:11.5px;font-weight:600;}
.kpi .kd.up{color:#16a34a;}.kpi .kd.down{color:var(--warn);}.kpi .kd.n{color:var(--sub);}
.kpi.warn .ic{background:var(--warnbg);color:var(--warn);}
.kpi.amber .ic{background:var(--amberbg);color:var(--amber);}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11px;letter-spacing:.04em;color:var(--sub);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#f8fafb;white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid #f1f5f4;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.num{font-variant-numeric:tabular-nums;font-weight:600;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
.tag.ok{background:#dcfce7;color:#15803d;}
.tag.warn{background:var(--warnbg);color:var(--warn);}
.tag.amb{background:var(--amberbg);color:var(--amber);}
.tag.info{background:#e0f2fe;color:#0369a1;}
.tag.mute{background:#f1f5f9;color:#475569;}
.meter{height:8px;border-radius:999px;background:#eef2f0;overflow:hidden;min-width:70px;}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.meter.warn i{background:linear-gradient(90deg,#dc2626,#f87171);}
.meter.amb i{background:linear-gradient(90deg,#d97706,#fbbf24);}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:220px;}
.tree{font-size:13px;}
.tnode{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;margin-bottom:5px;background:#f8fafb;border:1px solid var(--line);min-width:0;}
.tnode.lv2{margin-left:22px;background:#fff;}
.tnode .tn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.tnode .material-symbols-outlined{font-size:18px;color:var(--accent);flex:0 0 auto;}
.tnode .tv{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);flex:0 0 auto;font-size:12.5px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 18px;}
.tli:last-child{padding-bottom:0;}
.tli .dot{position:absolute;left:-22px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tli.warn .dot{border-color:var(--warn);}
.tli.mute .dot{border-color:#cbd5e1;}
.tli .tlt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tli .tld{font-size:12px;color:var(--sub);margin-top:3px;}
.tli .tlm{font-size:11px;color:#94a3b8;margin-top:3px;font-variant-numeric:tabular-nums;}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:12px;border:1px solid;margin-bottom:11px;min-width:0;}
.alert .material-symbols-outlined{flex:0 0 auto;font-size:22px;margin-top:1px;}
.alert.hi{background:var(--warnbg);border-color:#fecaca;}
.alert.hi .material-symbols-outlined{color:var(--warn);}
.alert.md{background:var(--amberbg);border-color:#fde68a;}
.alert.md .material-symbols-outlined{color:var(--amber);}
.alert.lo{background:#eff6ff;border-color:#bfdbfe;}
.alert.lo .material-symbols-outlined{color:#2563eb;}
.alert .at{font-size:13px;font-weight:700;margin-bottom:3px;}
.alert .ad{font-size:12px;color:var(--sub);line-height:1.5;}
.alert .abtn{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:600;color:var(--accent);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);min-width:0;}
.srow:last-child{border-bottom:none;}
.srow .sl{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow .sr{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;flex:0 0 auto;}
.formrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.fld{flex:1;min-width:130px;}
.fld label{display:block;font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:5px;}
.fld .fv{background:#f8fafb;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-weight:600;}
.chk{background:linear-gradient(120deg,#dcfce7,#f0fdf4);border:1px solid #bbf7d0;border-radius:13px;padding:15px 16px;display:flex;align-items:center;gap:13px;}
.chk.block{background:linear-gradient(120deg,#fef2f2,#fff5f5);border-color:#fecaca;}
.chk .cic{width:44px;height:44px;border-radius:12px;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.chk.block .cic{background:var(--warn);}
.chk .ct{font-size:14px;font-weight:700;}
.chk .cd{font-size:12px;color:var(--sub);margin-top:2px;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.mb14{margin-bottom:14px;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:6px;}
  .brand{padding:0 8px 0 2px;flex:1 1 auto;}
  .navlbl,.sidefoot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;}
  .navbtn{width:auto;padding:8px 12px;}
  .main{padding:20px 16px 40px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .navbtn .ntxt{display:none;}
  .navbtn{padding:9px 11px;}
  .board{grid-template-columns:1fr;}
  .topbar h2{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">savings</span></div>
      <div>
        <h1>採購預算控管系統</h1>
        <p>Procurement Budget Control</p>
      </div>
    </div>
    <div class="navlbl">功能模組</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      年度：<b>FY2026</b> · 期別 <b>H2</b><br/>
      資料同步：<b>ERP / 財務系統</b>
    </div>
  </aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="screen"></div>
  </main>
</div>
<script>
var MODULES=[
  {icon:"account_tree",name:"預算科目設定",sub:"科目樹、年度額度與部門分攤設定基準"},
  {icon:"fact_check",name:"請購預算檢核",sub:"請購送出即時比對可用餘額與攔阻"},
  {icon:"receipt_long",name:"額度扣減紀錄",sub:"承諾數與實際數逐筆入帳明細"},
  {icon:"monitoring",name:"執行率儀表板",sub:"各科目執行率與燒錢曲線"},
  {icon:"warning",name:"超支預警",sub:"門檻告警與待簽核預算調撥"},
  {icon:"gavel",name:"期末結算檢討",sub:"結轉、差異分析與稽核軌跡"}
];
var charts={};
function disposeAll(){for(var k in charts){if(charts[k]){try{charts[k].dispose();}catch(e){}charts[k]=null;}}}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].dispose();}catch(e){}}var c=echarts.init(el);c.setOption(opt);charts[id]=c;}
window.addEventListener("resize",function(){for(var k in charts){if(charts[k]){try{charts[k].resize();}catch(e){}}}});
var GREEN="#15803d",GREEN2="#4ade80",AMBER="#d97706",REDC="#dc2626";
function money(n){return "$"+n.toLocaleString("en-US");}
function bar(p,cls){cls=cls||(p>=95?"warn":p>=80?"amb":"");return '<div class="meter '+cls+'"><i style="width:'+Math.min(p,100)+'%"></i></div>';}
function kpi(ic,label,val,delta,dir,ic2,flag){
  var cls=flag===true?"warn":(flag==="amber"?"amber":"");
  return '<div class="kpi '+cls+'"><div class="ic"><span class="material-symbols-outlined">'+(ic2||ic)+'</span></div>'
    +'<div class="kl">'+label+'</div><div class="kv">'+val+'</div><div class="kd '+(dir||"n")+'">'+delta+'</div></div>';
}
function fld(l,v){return '<div class="fld"><label>'+l+'</label><div class="fv">'+v+'</div></div>';}
function tnode(ic,name,val,lv2){
  return '<div class="tnode'+(lv2?' lv2':'')+'"><span class="material-symbols-outlined">'+ic+'</span><span class="tn">'+name+'</span>'+(val?'<span class="tv">'+val+'</span>':'')+'</div>';
}

/* SCREEN 0 : 預算科目設定 */
function s0(){
  var accts=[
    {code:"51000",name:"直接原物料",dept:"生產部",annual:48000000,note:"季度分攤"},
    {code:"52000",name:"間接物料/耗材",dept:"生產部",annual:9600000,note:"月度分攤"},
    {code:"53000",name:"外包加工費",dept:"生產部",annual:15200000,note:"依工單"},
    {code:"54000",name:"設備維護備品",dept:"設備工程",annual:6400000,note:"季度分攤"},
    {code:"55000",name:"辦公/行政採購",dept:"管理部",annual:2800000,note:"月度分攤"},
    {code:"56000",name:"研發材料",dept:"研發部",annual:5200000,note:"專案別"}
  ];
  var rows=accts.map(function(a){
    return '<tr><td class="num">'+a.code+'</td><td><b>'+a.name+'</b></td><td>'+a.dept+'</td>'
      +'<td class="num">'+money(a.annual)+'</td><td>'+a.note+'</td>'
      +'<td><span class="tag ok">啟用</span></td></tr>';
  }).join("");
  var total=accts.reduce(function(s,a){return s+a.annual;},0);
  return ''
  +'<div class="grid g4 mb14">'
    +kpi("account_balance","年度總預算",money(total),"FY2026 核定","n","dashboard")
    +kpi("category","預算科目數","6 類 / 23 子項","已完成分攤","up","account_tree")
    +kpi("groups","分攤部門","5 個部門","權責已界定","n","groups")
    +kpi("event_available","生效期別","FY2026 H2","2026-07-01 起","n","calendar_month")
  +'</div>'
  +'<div class="grid g23">'
    +'<div class="card"><h3><span class="material-symbols-outlined">description</span>預算科目與年度額度</h3>'
      +'<p class="cdesc">財務部核定的一級科目、負責部門與分攤方式，作為請購檢核的基準。</p>'
      +'<div class="tbl-wrap"><table><thead><tr><th>科目代碼</th><th>科目名稱</th><th>負責部門</th><th>年度額度</th><th>分攤方式</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>科目樹結構</h3>'
      +'<p class="cdesc">51000 直接原物料展開範例。</p>'
      +'<div class="tree">'
        +tnode("inventory_2","51000 直接原物料","",false)
        +tnode("description","51100 鋼材/金屬",money(21000000),true)
        +tnode("description","51200 塑膠粒/樹脂",money(14400000),true)
        +tnode("description","51300 電子零件",money(9600000),true)
        +tnode("description","51900 其他原料",money(3000000),true)
      +'</div>'
      +'<div class="legend"><span><i style="background:'+GREEN+'"></i>一級科目</span><span><i style="background:'+GREEN2+'"></i>子科目額度</span></div>'
    +'</div>'
  +'</div>';
}

/* SCREEN 1 : 請購預算檢核 */
function s1(){
  var reqs=[
    {no:"PR-260814-07",dept:"生產部",item:"冷軋鋼捲 SPCC 2.0t",acct:"51100",amt:1850000,avail:2340000,st:"pass"},
    {no:"PR-260814-06",dept:"設備工程",item:"軸承備品 一批",acct:"54000",amt:420000,avail:510000,st:"pass"},
    {no:"PR-260814-05",dept:"研發部",item:"實驗用電子模組",acct:"56000",amt:980000,avail:640000,st:"block"},
    {no:"PR-260814-04",dept:"生產部",item:"外包CNC加工",acct:"53000",amt:1200000,avail:1420000,st:"hold"},
    {no:"PR-260814-03",dept:"管理部",item:"辦公家具汰換",acct:"55000",amt:230000,avail:1120000,st:"pass"}
  ];
  var rows=reqs.map(function(r){
    var t=r.st==="pass"?'<span class="tag ok">通過</span>':r.st==="block"?'<span class="tag warn">攔阻</span>':'<span class="tag amb">轉簽核</span>';
    var pct=Math.round(r.amt/r.avail*100);
    return '<tr><td class="num">'+r.no+'</td><td>'+r.dept+'</td><td>'+r.item+'</td><td class="num">'+r.acct+'</td>'
      +'<td class="num">'+money(r.amt)+'</td><td class="num">'+money(r.avail)+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:8px">'+bar(pct)+'<span style="font-size:11px;font-weight:600;color:#64748b">'+pct+'%</span></div></td>'
      +'<td>'+t+'</td></tr>';
  }).join("");
  return ''
  +'<div class="grid g4 mb14">'
    +kpi("fact_check","今日請購檢核","38 筆","即時比對餘額","n","fact_check")
    +kpi("task_alt","自動通過","31 筆","81.6% 通過率","up","task_alt")
    +kpi("block","餘額不足攔阻","4 筆","須調撥或改科目","down","warning",true)
    +kpi("hourglass_top","轉待簽核","3 筆","逼近門檻","n","rule","amber")
  +'</div>'
  +'<div class="grid g32">'
    +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>請購即時檢核佇列</h3>'
      +'<p class="cdesc">請購送出時系統即時比對科目可用餘額，超出門檻自動攔阻或轉待簽核。</p>'
      +'<div class="tbl-wrap"><table><thead><tr><th>請購單號</th><th>部門</th><th>品項</th><th>科目</th><th>請購金額</th><th>可用餘額</th><th>占用比</th><th>檢核</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">checklist</span>檢核明細</h3>'
      +'<p class="cdesc">PR-260814-05 研發材料</p>'
      +'<div class="formrow">'
        +fld("請購科目","56000 研發材料")
        +fld("請購金額","$980,000")
      +'</div>'
      +'<div class="formrow">'
        +fld("科目可用餘額","$640,000")
        +fld("超出金額","$340,000")
      +'</div>'
      +'<div class="chk block"><div class="cic"><span class="material-symbols-outlined">warning</span></div>'
        +'<div><div class="ct">預算不足 · 已攔阻</div><div class="cd">占用 153% 超過門檻，請調撥額度或分期請購。</div></div></div>'
      +'<div style="margin-top:12px"><div class="srow"><span class="sl">RULE-01 交期內缺料項</span><span class="sr" style="color:#16a34a">符合</span></div>'

(function buildNav(){
  var nav=document.getElementById("nav");

  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll(".navbtn");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var idx=+this.getAttribute("data-i");location.hash="v"+idx;show(idx);});

})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
