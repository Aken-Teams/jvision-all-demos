<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>採購預算控管系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --amber:#b45309;
  --green:#15803d;
  --sidebar:#0f172a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:256px;
  height:100vh;
  flex:0 0 256px;
  display:flex;
  flex-direction:column;
  padding:26px 18px 20px;
  overflow:auto;
  color:#e2e8f0;
  background:
    linear-gradient(135deg,rgba(37,99,235,.2),transparent 38%),
    var(--sidebar);
  border-right:1px solid #1e293b;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 6px 24px;
  border-bottom:1px solid rgba(226,232,240,.12);
}
.logo{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
  box-shadow:4px 4px 0 rgba(59,130,246,.22);
}
.logo .material-symbols-outlined{font-size:23px}
.brand h1{margin:0;color:#fff;font-size:15px;font-weight:700;line-height:1.35}
.brand p{margin:3px 0 0;color:#94a3b8;font:500 9px/1.4 "Fira Code",monospace;letter-spacing:.035em}
.navlbl{
  padding:24px 10px 8px;
  color:#94a3b8;
  font:600 10px/1 "Fira Code",monospace;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.navbtn{
  position:relative;
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  color:#cbd5e1;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  text-align:left;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.navbtn .material-symbols-outlined{flex:0 0 auto;font-size:20px}
.navbtn .ntxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.navbtn:hover{color:#fff;background:#1e293b;border-color:#334155;transform:translateX(2px)}
.navbtn.on{
  color:#fff;
  background:var(--blue);
  border-color:#60a5fa;
  box-shadow:4px 4px 0 rgba(59,130,246,.2);
}
.navbtn.on:before{
  content:"";
  position:absolute;
  left:-19px;
  width:3px;
  height:24px;
  background:#93c5fd;
}
.sidefoot{
  margin-top:auto;
  padding:18px 8px 2px;
  color:#94a3b8;
  border-top:1px solid rgba(226,232,240,.12);
  font-size:11px;
  line-height:1.75;
}
.sidefoot b{color:#e2e8f0;font:600 11px "Fira Code",monospace}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,44px) 48px}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin:0 auto 22px;
  max-width:1500px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.topbar .htxt{min-width:0}
.topbar h2{
  margin:0;
  color:var(--ink);
  font-size:clamp(22px,2vw,28px);
  font-weight:700;
  letter-spacing:-.035em;
}
.topbar .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  padding:7px 11px;
  color:#1e3a8a;
  background:#dbeafe;
  border:1px solid #bfdbfe;
  border-radius:5px;
  font-size:11px;
  font-weight:600;
}
.pill .material-symbols-outlined{font-size:16px}
#screen{max-width:1500px;margin:0 auto;animation:screen-in .35s ease both}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(320px,2fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:3px 3px 0 rgba(30,41,59,.045);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{
  border-color:#bfdbfe;
  box-shadow:5px 5px 0 rgba(37,99,235,.07);
  transform:translateY(-1px);
}
.card{padding:20px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.card .cdesc{margin:0 0 16px;color:var(--muted);font-size:12px}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 18px;
}
.kpi:after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:4px;
  background:var(--blue);
}
.kpi.warn:after{background:var(--color-destructive)}
.kpi.amber:after{background:var(--color-accent)}
.kpi .ic{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  margin-bottom:12px;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-radius:6px;
}
.kpi.warn .ic{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.kpi.amber .ic{color:#9a3412;background:#fff7ed;border-color:#fed7aa}
.kpi .ic .material-symbols-outlined{font-size:20px}
.kpi .kl{color:var(--muted);font-size:11.5px;font-weight:500}
.kpi .kv{
  margin:3px 0 2px;
  color:#0f172a;
  font:700 24px/1.25 "Fira Code",monospace;
  letter-spacing:-.04em;
}
.kpi .kd{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.kpi .kd:before{font-family:"Material Symbols Outlined";font-size:14px}
.kpi .kd.up{color:#166534}.kpi .kd.up:before{content:"check_circle"}
.kpi .kd.down{color:#b91c1c}.kpi .kd.down:before{content:"warning"}
.kpi .kd.n{color:var(--muted)}.kpi .kd.n:before{content:"info"}
.tbl-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:6px;
  -webkit-overflow-scrolling:touch;
}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12.5px}
th{
  padding:10px 12px;
  color:#334155;
  background:#f1f5f9;
  border-bottom:1px solid #cbd5e1;
  text-align:left;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
}
td{padding:11px 12px;border-bottom:1px solid #edf2f7;white-space:nowrap}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fbff}
tr:last-child td{border-bottom:0}
td.num,.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
td:first-child.num{text-align:left}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:23px;
  padding:3px 8px;
  border:1px solid;
  border-radius:4px;
  font-size:10.5px;
  font-weight:700;
}
.tag:before{font-family:"Material Symbols Outlined";font-size:13px}
.tag.ok{color:#166534;background:#f0fdf4;border-color:#bbf7d0}.tag.ok:before{content:"check_circle"}
.tag.warn{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.tag.warn:before{content:"error"}
.tag.amb{color:#92400e;background:#fffbeb;border-color:#fde68a}.tag.amb:before{content:"schedule"}
.tag.info{color:#1e40af;background:#eff6ff;border-color:#bfdbfe}.tag.info:before{content:"info"}
.tag.mute{color:#475569;background:#f1f5f9;border-color:#cbd5e1}.tag.mute:before{content:"remove_circle"}
.meter{
  height:7px;
  min-width:72px;
  overflow:hidden;
  background:#e2e8f0;
  border-radius:2px;
}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.warn i{background:repeating-linear-gradient(135deg,#dc2626 0,#dc2626 5px,#991b1b 5px,#991b1b 8px)}
.meter.amb i{background:repeating-linear-gradient(135deg,#ea580c 0,#ea580c 5px,#c2410c 5px,#c2410c 8px)}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.tree{font-size:13px}
.tnode{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  margin-bottom:6px;
  padding:10px 11px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:5px;
}
.tnode.lv2{margin-left:22px;background:#fff;border-left-color:#93c5fd}
.tnode .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tnode .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:18px}
.tnode .tv{flex:0 0 auto;color:var(--ink);font:700 12px "Fira Code",monospace}
.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px}
.tli:last-child{padding-bottom:0}
.tli .dot{
  position:absolute;
  top:2px;
  left:-23px;
  width:16px;
  height:16px;
  background:#fff;
  border:3px solid var(--blue);
  border-radius:2px;
}
.tli.warn .dot{border-color:var(--color-destructive)}
.tli.mute .dot{border-color:#94a3b8}
.tli .tlt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.tli .tld{margin-top:3px;color:var(--muted);font-size:12px}
.tli .tlm{margin-top:3px;color:#64748b;font:400 10.5px "Fira Code",monospace}
.alert{
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-width:0;
  margin-bottom:10px;
  padding:13px;
  border:1px solid;
  border-left-width:4px;
  border-radius:6px;
}
.alert .material-symbols-outlined{flex:0 0 auto;margin-top:1px;font-size:21px}
.alert.hi{background:#fef2f2;border-color:#fecaca;border-left-color:#dc2626}
.alert.hi>.material-symbols-outlined{color:#b91c1c}
.alert.md{background:#fffbeb;border-color:#fde68a;border-left-color:#d97706}
.alert.md>.material-symbols-outlined{color:#92400e}
.alert.lo{background:#eff6ff;border-color:#bfdbfe;border-left-color:#2563eb}
.alert.lo>.material-symbols-outlined{color:#1d4ed8}
.alert .at{margin-bottom:3px;font-size:12.5px;font-weight:700}
.alert .ad{color:var(--muted);font-size:11.5px;line-height:1.55}
.alert .abtn{
  flex:0 0 auto;
  min-height:36px;
  margin-left:auto;
  padding:7px 10px;
  color:#fff;
  background:var(--blue);
  border:1px solid #1d4ed8;
  border-radius:5px;
  white-space:nowrap;
  font-size:11px;
  font-weight:700;
  transition:background-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.alert .abtn:hover{background:#1d4ed8;box-shadow:3px 3px 0 #bfdbfe;transform:translateY(-1px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .sl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.srow .sr{flex:0 0 auto;font:700 12px "Fira Code",monospace}
.formrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.fld{flex:1;min-width:130px}
.fld label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:600}
.fld .fv{
  min-height:39px;
  padding:9px 10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:5px;
  font-size:12.5px;
  font-weight:600;
}
.chk{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-left:4px solid var(--blue);
  border-radius:6px;
}
.chk.block{background:#fef2f2;border-color:#fecaca;border-left-color:#dc2626}
.chk .cic{
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:5px;
}
.chk.block .cic{background:var(--color-destructive)}
.chk .ct{font-size:13px;font-weight:700}
.chk .cd{margin-top:2px;color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:1px}
.mb14{margin-bottom:16px}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:13px 14px;
    overflow:visible;
    border-right:0;
    border-bottom:1px solid #1e293b;
  }
  .brand{padding:0 2px 12px;border-bottom:0}
  .navlbl,.sidefoot{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px}
  .navbtn{justify-content:center;padding:9px 7px}
  .navbtn .ntxt{display:none}
  .navbtn.on:before{display:none}
  .main{padding:20px 16px 38px}
  .topbar{align-items:flex-start;margin-bottom:18px}
}
@media(max-width:560px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .topbar{display:block}
  .topbar h2{font-size:21px}
  .pill{margin-top:12px}
  .card{padding:16px}
  .kpi{padding:15px 16px}
  .alert{flex-wrap:wrap}
  .alert .abtn{width:100%;margin-left:33px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #screen,.card:hover,.kpi:hover,.navbtn:hover,.alert .abtn:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">savings</span></div>
      <div>
        <h1>採購預算控管系統</h1>
        <p>Procurement Budget Control</p>
      </div>
    </div>
    <div class="navlbl">功能模組</div>
    <nav class="nav" id="nav" aria-label="功能模組"></nav>
    <div class="sidefoot">
      年度：<b>FY2026</b> · 期別 <b>H2</b><br/>
      資料同步：<b>ERP / 財務系統</b>
    </div>
  </aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="screen"></div>
  </main>
</div>
<script>
var MODULES=[
  {icon:"account_tree",name:"預算科目設定",sub:"科目樹、年度額度與部門分攤設定基準"},
  {icon:"fact_check",name:"請購預算檢核",sub:"請購送出即時比對可用餘額與攔阻"},
  {icon:"receipt_long",name:"額度扣減紀錄",sub:"承諾數與實際數逐筆入帳明細"},
  {icon:"monitoring",name:"執行率儀表板",sub:"各科目執行率與燒錢曲線"},
  {icon:"warning",name:"超支預警",sub:"門檻告警與待簽核預算調撥"},
  {icon:"gavel",name:"期末結算檢討",sub:"結轉、差異分析與稽核軌跡"}
];
var charts={};
function disposeAll(){for(var k in charts){if(charts[k]){try{charts[k].dispose()}catch(e){}charts[k]=null}}}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].dispose()}catch(e){}}var c=echarts.init(el);c.setOption(opt);charts[id]=c}
window.addEventListener("resize",function(){for(var k in charts){if(charts[k]){try{charts[k].resize()}catch(e){}}}});
var GREEN="#2563eb",GREEN2="#93c5fd",AMBER="#ea580c",REDC="#dc2626";
function money(n){return "$"+n.toLocaleString("en-US")}
function bar(p,cls){cls=cls||(p>=95?"warn":p>=80?"amb":"");return '<div class="meter '+cls+'" aria-label="占用比例 '+p+'%"><i style="width:'+Math.min(p,100)+'%"></i></div>'}
function kpi(ic,label,val,delta,dir,ic2,flag){
  var cls=flag===true?"warn":flag==="amber"?"amber":"";
  return '<div class="kpi '+cls+'"><div class="ic"><span class="material-symbols-outlined">'+(ic2||ic)+'</span></div><div class="kl">'+label+'</div><div class="kv">'+val+'</div><div class="kd '+(dir||"n")+'">'+delta+'</div></div>'
}
function fld(l,v){return '<div class="fld"><label>'+l+'</label><div class="fv">'+v+'</div></div>'}
function tnode(ic,name,val,lv2){return '<div class="tnode'+(lv2?' lv2':'')+'"><span class="material-symbols-outlined">'+ic+'</span><span class="tn">'+name+'</span>'+(val?'<span class="tv">'+val+'</span>':'')+'</div>'}

function s0(){
  var accts=[
    {code:"51000",name:"直接原物料",dept:"生產部",annual:48000000,note:"季度分攤"},
    {code:"52000",name:"間接物料/耗材",dept:"生產部",annual:9600000,note:"月度分攤"},
    {code:"53000",name:"外包加工費",dept:"生產部",annual:15200000,note:"依工單"},
    {code:"54000",name:"設備維護備品",dept:"設備工程",annual:6400000,note:"季度分攤"},
    {code:"55000",name:"辦公/行政採購",dept:"管理部",annual:2800000,note:"月度分攤"},
    {code:"56000",name:"研發材料",dept:"研發部",annual:5200000,note:"專案別"}
  ];
  var rows=accts.map(function(a){return '<tr><td class="num">'+a.code+'</td><td><b>'+a.name+'</b></td><td>'+a.dept+'</td><td class="num">'+money(a.annual)+'</td><td>'+a.note+'</td><td><span class="tag ok">啟用</span></td></tr>'}).join("");

    ],radius:"60%",axisName:{color:text,fontSize:11},splitLine:{lineStyle:{color:grid}},splitArea:{areaStyle:{color:["#fff","#f8fafc"]}}},series:[{type:"radar",data:[
      {value:[95,88,80,60,70],name:"研發材料",areaStyle:{color:"rgba(220,38,38,.16)"},lineStyle:{color:REDC},itemStyle:{color:REDC}},
      {value:[85,90,65,75,40],name:"外包加工",areaStyle:{color:"rgba(234,88,12,.14)"},lineStyle:{color:AMBER},itemStyle:{color:AMBER}}
    ]}]})
  }else if(i===5){
    mkChart("c5a",{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{data:["預算","實際"],bottom:0,textStyle:{fontFamily:"Fira Sans",fontSize:11,color:text}},grid:{left:8,right:12,top:14,bottom:34,containLabel:true},xAxis:{type:"category",data:["原物料","間接物料","外包加工","設備備品","行政","研發"],axisLabel:{color:text,interval:0,fontSize:11},axisLine:{lineStyle:{color:axis}}},yAxis:{type:"value",axisLabel:{color:text,formatter:function(v){return v/1000000+"M"}},splitLine:{lineStyle:{color:grid}}},series:[
      {name:"預算",type:"bar",barGap:0,data:[48000000,9600000,15200000,6400000,2800000,5200000],itemStyle:{color:GREEN,borderRadius:[2,2,0,0]}},
      {name:"實際",type:"bar",data:[45300000,8900000,16100000,5200000,2350000,5480000],itemStyle:{color:AMBER,borderRadius:[2,2,0,0]}}
    ]})
  }
}
var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  disposeAll();
  var nav=document.getElementById("nav"),btns=nav.querySelectorAll(".navbtn");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].className="navbtn"+(active?" on":"");
    btns[b].setAttribute("aria-current",active?"page":"false")
  }
  var m=MODULES[i];
  document.getElementById("topbar").innerHTML='<div class="htxt"><h2>'+m.name+'</h2><p class="sub">'+m.sub+'</p></div><span class="pill"><span class="material-symbols-outlined">sync</span>即時連動 ERP / 財務</span>';
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  drawCharts(i)
}
(function buildNav(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button class="navbtn" type="button" data-i="'+i+'" title="'+MODULES[i].name+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="ntxt">'+MODULES[i].name+'</span></button>'
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll(".navbtn");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var idx=+this.getAttribute("data-i");
      location.hash="v"+idx;
      show(idx)
    })
  }
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
