<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勞退與退休金提繳管理 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --primary-soft:#CCFBF1;
  --accent-soft:#FEF3C7;
  --danger-soft:#FEE2E2;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font:400 15px/1.55 "Crimson Pro","Noto Serif TC",serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
h1,h2,h3,h4,.brand-name,.nav button,.kpi .val,.mono,.chip,.tag,th{
  font-family:"Cinzel","Noto Serif TC",serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus{outline:none}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:24px 18px;
  color:var(--color-foreground);
  background:var(--color-card);
  border-right:2px solid var(--color-border);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 6px 24px;
  border-bottom:1px solid var(--line);
}
.brand-logo{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-secondary);
  border:2px solid var(--color-primary);
  border-radius:6px;
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-name{
  display:block;
  font-size:16px;
  font-weight:600;
  letter-spacing:.04em;
}
.brand-sub{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.13em;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:22px;
}
.nav button{
  position:relative;
  min-height:46px;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  font-size:13px;
  font-weight:600;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button:hover{
  color:var(--ink);
  background:var(--color-background);
  border-color:var(--line);
}
.nav button.on{
  color:#062F2B;
  background:var(--color-secondary);
  border-color:var(--color-primary);
}
.nav button.on::before{
  content:"";
  position:absolute;
  left:-19px;
  top:8px;
  bottom:8px;
  width:4px;
  background:var(--color-accent);
}
.nav button .material-symbols-outlined{flex:none}
.nav .idx{
  margin-left:auto;
  font:600 11px/1 "Cinzel",serif;
  letter-spacing:.08em;
}
.side-foot{
  margin-top:auto;
  padding:16px 6px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}
.side-foot b{color:var(--ink)}
.main{min-width:0;padding:28px 30px 64px}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin:-28px -30px 22px;
  padding:20px 30px;
  background:rgba(240,253,250,.96);
  border-bottom:1px solid var(--line);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--ink);
  font-size:24px;
  font-weight:600;
  letter-spacing:.01em;
}
.topbar h1 .material-symbols-outlined{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  color:#062F2B;
  background:var(--color-secondary);
  border:1px solid var(--color-primary);
  border-radius:4px;
}
.topbar .sub{
  margin:4px 0 0 44px;
  color:var(--muted);
  font-size:14px;
}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{
  min-height:36px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  color:var(--muted);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:4px;
  font-size:11px;
  font-weight:600;
}
.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--ok);
  border:2px solid #DCFCE7;
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid #0F766E;
  border-radius:4px;
  font-family:"Cinzel",serif;
  font-weight:600;
}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.grid>*{min-width:0}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.card{padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.card.pad0 .card-h{margin-bottom:0}
.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  color:var(--ink);
  font-size:16px;
  font-weight:600;
}
.card-h h3 .material-symbols-outlined{color:var(--color-primary)}
.hint{color:var(--muted);font-size:12px;text-align:right}
.kpi{
  position:relative;
  padding:18px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--color-primary);
}
.kpi .ico{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#064E3B;
  background:var(--primary-soft);
  border:1px solid var(--color-secondary);
  border-radius:4px;
}
.kpi .lbl{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.kpi .val{
  margin-top:2px;
  color:#0F3D38;
  font-size:29px;
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.02em;
}
.kpi .val small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Crimson Pro",serif;
  font-size:14px;
  font-weight:600;
}
.delta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:7px;
  font-size:12px;
  font-weight:600;
}
.delta .material-symbols-outlined{font-size:16px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.delta.flat{color:var(--muted)}
.table-wrap{width:100%;overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th{
  padding:12px 14px;
  color:#334155;
  background:var(--color-muted);
  border-bottom:2px solid var(--color-border);
  font-size:11px;
  font-weight:600;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:12px 14px;
  color:var(--color-card-foreground);
  border-bottom:1px solid #CDEBE7;
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:#F0FDFA}
td.num{
  text-align:right;
  font-variant-numeric:tabular-nums lining-nums;
}
.mono{
  font-size:12px;
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:.02em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:11px;
  font-weight:600;
}
.tag::before{
  font-family:"Material Symbols Outlined";
  font-size:14px;
  line-height:1;
}
.t-ok{color:#166534;background:#F0FDF4}
.t-ok::before{content:"check_circle"}
.t-warn{color:#92400E;background:#FFFBEB}
.t-warn::before{content:"schedule"}
.t-bad{color:#991B1B;background:#FEF2F2}
.t-bad::before{content:"error"}
.t-info{color:#1E40AF;background:#EFF6FF}
.t-info::before{content:"info"}
.t-gray{color:#475569;background:#F8FAFC}
.t-gray::before{content:"remove_circle_outline"}
.t-acc,.t-pink{color:#115E59;background:#F0FDFA}
.t-acc::before,.t-pink::before{content:"verified"}
.chk{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:44px;
  padding:9px 2px;
  border-bottom:1px dashed #99D9D1;
  font-size:14px;
}
.chk:last-of-type{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .warn{color:var(--warn)}
.chk .bad{color:var(--bad)}
.chk .wait{color:var(--muted)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:12px;text-align:right}
.note{
  margin-top:14px;
  padding:13px 14px;
  color:#713F12;
  background:var(--accent-soft);
  border-left:4px solid var(--color-accent);
  font-size:13px;
  line-height:1.7;
}
.tl{position:relative;padding-left:28px}
.tl::before{
  content:"";
  position:absolute;
  left:8px;
  top:7px;
  bottom:7px;
  width:2px;
  background:var(--line);
}
.tl-item{position:relative;padding-bottom:19px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  left:-27px;
  top:4px;
  width:15px;
  height:15px;
  background:#FFF;
  border:4px solid var(--color-primary);
  border-radius:50%;
}
.tl-dot.ok{border-color:var(--ok)}
.tl-dot.warn{border-color:var(--warn)}
.tl-dot.bad{border-color:var(--bad)}
.tl-time{
  color:var(--muted);
  font:600 11px/1.2 "Cinzel",serif;
  font-variant-numeric:tabular-nums;
}
.tl-item b{
  display:block;
  margin:3px 0;
  color:var(--ink);
  font-size:14px;
}
.tl-item p{margin:0;color:var(--muted);font-size:13px}
#screen>.grid,#screen>.card{
  animation:rise .38s cubic-bezier(.2,.8,.2,1) both;
}
#screen>.grid:nth-child(2),#screen>.card:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3),#screen>.card:nth-child(3){animation-delay:.12s}
@keyframes rise{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:none}
}
@keyframes pulse{50%{opacity:.45}}
@media(max-width:1160px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g32{grid-template-columns:1fr}
}
@media(max-width:900px){
  .app{display:block}
  .sidebar{
    position:static;
    width:100%;
    height:auto;
    padding:14px 16px;
    border-right:0;
    border-bottom:2px solid var(--line);
  }
  .brand{padding:0 0 13px}
  .nav{
    display:grid;
    grid-template-columns:repeat(5,minmax(120px,1fr));
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:3px;
  }
  .nav button.on::before{
    left:8px;
    right:8px;
    top:auto;
    bottom:-4px;
    width:auto;
    height:4px;
  }
  .side-foot{display:none}
  .main{padding:22px 18px 48px}
  .topbar{
    position:static;
    margin:-22px -18px 20px;
    padding:18px;
  }
}
@media(max-width:700px){
  .topbar{align-items:flex-start}
  .topbar h1{font-size:20px}
  .topbar .sub{margin-left:0}
  .top-right{justify-content:flex-end}
  .chip:first-child{display:none}
  .g2{grid-template-columns:1fr}
}
@media(max-width:520px){
  .main{padding-inline:14px}
  .topbar{margin-inline:-14px;padding-inline:14px}
  .top-right .chip{display:none}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi .val{font-size:24px}
  .card{padding:14px}
  .card-h{align-items:flex-start}
  .hint{max-width:45%}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"><span class="material-symbols-outlined">savings</span></div>
      <div>
        <b class="brand-name">退休金提繳台</b>
        <span class="brand-sub">PENSION CONTRIBUTION</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">2026 年 8 月 · 486 人<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico" aria-hidden="true"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot" aria-hidden="true"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--color-primary)" aria-hidden="true">calendar_today</span>2026/08/20</span>
        <div class="avatar" aria-label="資源管理員">資</div>
      </div>
    </header>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
var charts=[];

function killCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].destroy()}catch(e){}
  }
  charts=[];
}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function numericCell(c){
  var text=String(c).replace(/<[^>]*>/g,"").trim();
  return /^(?:NT\$\s*)?[-+]?\d[\d,]*(?:\.\d+)?(?:\s*(?:%|人|年|萬|元|千元|件|筆|級|月|\/\d+))?$/.test(text) ||
    /^\d{4}(?:\/\d{2}(?:\/\d{2})?)?$/.test(text);
}
function stats(items){
  return '<div class="grid g4">'+items.map(function(k){
    var icon=k.cls==="up"?"trending_up":k.cls==="down"?"warning":"remove";
    return '<article class="kpi">'+
      '<div class="ico"><span class="material-symbols-outlined" aria-hidden="true">'+k.ico+'</span></div>'+
      '<div class="lbl">'+esc(k.lbl)+'</div>'+
      '<div class="val">'+k.val+(k.u?'<small>'+esc(k.u)+'</small>':'')+'</div>'+
      '<div class="delta '+k.cls+'"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+esc(k.d)+'</div>'+
    '</article>';
  }).join("")+'</div>';
}
function tbl(headers,rows){
  return '<div class="table-wrap"><table><thead><tr>'+
    headers.map(function(x){return '<th scope="col">'+esc(x)+'</th>';}).join("")+
    '</tr></thead><tbody>'+
    rows.map(function(row){
      return '<tr>'+row.map(function(cell,i){
        var cls=[];
        if(i===0)cls.push("mono");
        if(numericCell(cell))cls.push("num");
        return '<td'+(cls.length?' class="'+cls.join(" ")+'"':'')+'>'+cell+'</td>';
      }).join("")+'</tr>';
    }).join("")+
  '</tbody></table></div>';
}
function tl(items){
  return '<div class="tl">'+items.map(function(item){
    return '<div class="tl-item">'+
      '<div class="tl-dot '+(item.k||"")+'"></div>'+
      '<div class="tl-time">'+esc(item.t)+'</div>'+
      '<b>'+esc(item.b)+'</b>'+
      '<p>'+esc(item.p)+'</p>'+
    '</div>';
  }).join("")+'</div>';
}
function card(title,icon,body,hint){
  return '<section class="card"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+title+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>';
}
function cardT(title,icon,body,hint){
  return '<section class="card pad0"><div class="card-h" style="padding:18px 18px 13px"><h3><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+title+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>';
}

var AX={style:{colors:"#475569",fontSize:"12px",fontFamily:'"Crimson Pro",serif'}};
var CB={
  redrawOnParentResize:true,
  redrawOnWindowResize:true,
  animations:{enabled:false},
  toolbar:{show:false},
  fontFamily:'"Crimson Pro",serif',
  foreColor:"#475569"
};
function push(el,opt){
  var node=document.getElementById(el);
  if(!node)return;
  var chart=new ApexCharts(node,opt);
  chart.render();
  charts.push(chart);
}
function mkArea(el,data,cats,name){
  push(el,{
    chart:Object.assign({},CB,{type:"area",height:245}),
    series:[{name:name,data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:AX.style}},
    grid:{borderColor:"#99D9D1",strokeDashArray:0},
    dataLabels:{enabled:false},
    stroke:{curve:"straight",width:3},
    colors:["#0D9488"],
    fill:{type:"solid",opacity:.12},
    markers:{size:3,strokeWidth:0},
    tooltip:{theme:"light"}
  });
}
function mkDonut(el,labels,data){
  push(el,{
    chart:Object.assign({},CB,{type:"donut",height:255}),
    series:data,
    labels:labels,
    colors:["#0D9488","#2DD4BF","#F59E0B","#0F766E","#5EEAD4"],
    legend:{position:"bottom",fontSize:"12px"},
    dataLabels:{enabled:false},
    plotOptions:{pie:{donut:{size:"64%"}}},
    stroke:{width:2,colors:["#FFFFFF"]},
    tooltip:{theme:"light"}
  });
}

var MODULES=[
  {icon:"savings",name:"提繳總覽",sub:"新制雇主提繳、勞工自提與舊制準備金"},
  {icon:"person",name:"個人提繳明細",sub:"逐人提繳級距、金額與異動紀錄"},
  {icon:"sync_alt",name:"級距異動",sub:"薪資變動後的提繳工資調整與申報"},
  {icon:"account_balance",name:"舊制準備金",sub:"勞退舊制專戶與精算提撥"},
  {icon:"fact_check",name:"申報稽核",sub:"與勞保局申報資料的勾稽檢查"}

var RENDER=[v0,v1,v2,v3,v4];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODULES.map(function(module,i){
    return '<button type="button" data-i="'+i+'" aria-label="'+esc(module.name)+'">'+
      '<span class="material-symbols-outlined" aria-hidden="true">'+module.icon+'</span>'+
      '<span class="txt">'+module.name+'</span>'+
      '<span class="idx">0'+(i+1)+'</span>'+
    '</button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(button){
    button.addEventListener("click",function(){
      location.hash="go="+button.getAttribute("data-i");
    });
  });
}
function show(i){
  killCharts();
  var module=MODULES[i];
  document.getElementById("th-ico").textContent=module.icon;
  document.getElementById("th-title").textContent=module.name;
  document.getElementById("th-sub").textContent=module.sub;
  document.title=module.name+" · 勞退與退休金提繳管理";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(button){
    var active=Number(button.getAttribute("data-i"))===i;
    button.classList.toggle("on",active);
    if(active)button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  });
  RENDER[i](document.getElementById("screen"));
}
function fromHash(){
  var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(match?Math.min(Number(match[1]),MODULES.length-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
