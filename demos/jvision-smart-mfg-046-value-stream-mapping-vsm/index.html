<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>價值流程圖工具（Value Stream Mapping, VSM）| 純 UI 展示</title>
<meta name="description" content="現況價值流程繪製、浪費環節辨識、未來狀態設計與 Kaizen 改善追蹤"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#9333ea; --accent2:#c084fc; --accent-soft:#f5edff;
  --ink:#1e1633; --muted:#6b6480; --line:#ece7f4; --bg:#f7f5fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;background:linear-gradient(100deg,#3b1063,#9333ea 55%,#c084fc);color:#fff;position:sticky;top:0;z-index:30}
.topbar .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.topbar .logo .material-symbols-outlined{font-size:24px}
.topbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}
.topbar .sub{font-size:12px;opacity:.85;font-weight:500}
.topbar .spacer{flex:1;min-width:0}
.badge-ui{font-size:11px;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:999px;font-weight:600;white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:20}
nav button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
nav button .material-symbols-outlined{font-size:19px}
nav button:hover{border-color:var(--accent2);color:var(--accent)}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(147,51,234,.28)}
main{padding:20px 22px 48px}
.scr-head{margin:0 0 16px}
.scr-head h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h2 .material-symbols-outlined{color:var(--accent);font-size:24px}
.scr-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ok{background:#e7f6ec;color:var(--ok)} .pill.warn{background:#fdf2e2;color:var(--warn)}
.pill.bad{background:#fdeaea;color:var(--bad)} .pill.info{background:#e8f0fd;color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .delta{font-size:12px;font-weight:700;margin-top:3px}
.up{color:var(--ok)} .down{color:var(--bad)}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.list-pane{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.list-pane .lp-head{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;background:var(--accent-soft)}
.list-pane .lp-head .material-symbols-outlined{font-size:19px;color:var(--accent)}
.li{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.li .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li .m{font-size:11px;color:var(--muted);margin-top:3px}
.detail-pane{min-width:0;display:flex;flex-direction:column;gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{text-align:left;padding:9px 11px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap;background:#faf9fd}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.muted{color:var(--muted)}
.scroll{overflow-x:auto}
.vsm-flow{display:flex;gap:10px;align-items:stretch;min-width:760px;padding:14px 0 6px}
.vsm-node{flex:1;min-width:120px;background:#fff;border:2px solid var(--accent2);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:5px;position:relative}
.vsm-node .nm{font-size:12.5px;font-weight:800}
.vsm-node .rows{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.vsm-node .rows b{color:var(--ink)}
.vsm-node .icon{position:absolute;top:-14px;right:10px;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.vsm-node .icon .material-symbols-outlined{font-size:17px}
.vsm-arrow{align-self:center;color:var(--accent);flex:none}
.vsm-arrow .material-symbols-outlined{font-size:26px}
.ladder{min-width:640px;display:flex;flex-direction:column;gap:3px}
.ladder .seg{display:flex;align-items:stretch;gap:2px;height:38px}
.ladder .cell{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border-radius:4px;min-width:2px}
.ladder .va{background:#22a565} .ladder .nva{background:#e05656} .ladder .lab{color:var(--muted);width:100px;flex:none;justify-content:flex-start;font-weight:600}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px}
.kb-col{background:#faf9fd;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kb-col h4{margin:0 0 9px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.kb-col h4 .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:2px 8px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent2)}
.kcard:last-child{margin-bottom:0}
.kcard .kt{font-size:12px;font-weight:700}
.kcard .km{font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.matrix{border-collapse:collapse;min-width:620px;width:100%;font-size:12px}
.matrix th{padding:8px;color:var(--muted);font-weight:600;font-size:11px}
.matrix td{padding:0;text-align:center}
.mcell{margin:3px;border-radius:8px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.mcell small{font-size:9px;font-weight:600;opacity:.9}
.rowlab{text-align:left;font-weight:700;font-size:12px;white-space:nowrap;padding-right:8px !important}
.note{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#faf9fd;margin-bottom:11px}
.note:last-child{margin-bottom:0}
.note .nic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.note .nb{font-size:12.5px;font-weight:700}
.note .nd{font-size:11.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.chartbox{min-width:0}
@media(max-width:860px){.split{grid-template-columns:1fr}}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.kb{grid-template-columns:1fr 1fr}}
@media(max-width:560px){nav button span.txt{display:none}nav button{padding:9px 12px}.kpis{grid-template-columns:1fr 1fr}.kb{grid-template-columns:1fr}.topbar .sub{display:none}}
/*rwdfix*/.card{min-width:0}.scroll{min-width:0;max-width:100%;overflow-x:auto}.grid>*,[class*="g2"]>*,[class*="grid"]>*{min-width:0}</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div style="min-width:0">
      <h1>價值流程圖工具 VSM</h1>
      <div class="sub">現況繪製 · 浪費辨識 · 未來狀態設計 · 改善追蹤</div>
    </div>
    <div class="spacer"></div>
    <div class="badge-ui">純 UI 展示 · 擬真資料</div>
  </header>
  <nav id="nav"></nav>
  <main><div id="screen"></div></main>
</div>

<script>
"use strict";
var chartRegistry=[];
function clearCharts(){for(var i=0;i<chartRegistry.length;i++){try{chartRegistry[i].destroy();}catch(e){}}chartRegistry=[];}
function mount(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=Object.assign({redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'},opt.chart||{});
  var c=new ApexCharts(el,opt);
  c.render();chartRegistry.push(c);
}
var PURPLE="#9333ea",PURPLE2="#c084fc";

var MODULES=[
  {icon:"account_tree",name:"現況價值流程"},
  {icon:"timeline",name:"週期時間軸"},
  {icon:"delete_sweep",name:"浪費環節辨識"},
  {icon:"lightbulb",name:"未來狀態設計"},
  {icon:"task_alt",name:"改善計畫追蹤"},
  {icon:"insights",name:"成效指標儀表"}
];

function scrHead(icon,title,desc){
  return '<div class="scr-head"><h2><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h2><p>'+desc+'</p></div>';
}
function kpi(icon,lab,val,unit,delta,dir){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    (delta?'<div class="delta '+(dir||'')+'">'+delta+'</div>':'')+'</div>';
}

/* ===== Screen 0 : 現況價值流程 (SPLIT signature) ===== */
var VS_STREAMS=[
  {id:"VS-A",nm:"控制閥本體加工線",fam:"閥體 A族",lt:"14.6",pce:"6.8%",takt:"92 秒",st:"warn",stt:"待改善"},
  {id:"VS-B",nm:"泵浦組裝流程",fam:"泵浦 B族",lt:"9.2",pce:"11.2%",takt:"120 秒",st:"ok",stt:"已優化"},
  {id:"VS-C",nm:"感測器封裝線",fam:"感測 C族",lt:"18.3",pce:"4.1%",takt:"64 秒",st:"bad",stt:"高浪費"},
  {id:"VS-D",nm:"齒輪箱裝配",fam:"傳動 D族",lt:"12.0",pce:"7.9%",takt:"150 秒",st:"warn",stt:"待改善"}
];
var VS_NODES={
  "VS-A":[{nm:"下料切削",ct:"48s",co:"22m",up:"96%",wip:"320"},{nm:"CNC 車銑",ct:"92s",co:"38m",up:"88%",wip:"210"},{nm:"熱處理",ct:"—",co:"—",up:"91%",wip:"860"},{nm:"研磨",ct:"64s",co:"15m",up:"94%",wip:"180"},{nm:"檢驗包裝",ct:"41s",co:"6m",up:"97%",wip:"95"}],
  "VS-B":[{nm:"零件備料",ct:"55s",co:"8m",up:"95%",wip:"140"},{nm:"次組裝",ct:"110s",co:"12m",up:"90%",wip:"180"},{nm:"主線裝配",ct:"120s",co:"10m",up:"93%",wip:"220"},{nm:"測試",ct:"85s",co:"5m",up:"96%",wip:"70"},{nm:"包裝入庫",ct:"40s",co:"4m",up:"98%",wip:"60"}],
  "VS-C":[{nm:"晶片取放",ct:"32s",co:"18m",up:"85%",wip:"420"},{nm:"打線",ct:"64s",co:"25m",up:"82%",wip:"680"},{nm:"封膠固化",ct:"—",co:"—",up:"88%",wip:"1200"},{nm:"雷射標記",ct:"28s",co:"9m",up:"92%",wip:"210"},{nm:"終測包裝",ct:"36s",co:"7m",up:"95%",wip:"150"}],
  "VS-D":[{nm:"軸件加工",ct:"78s",co:"30m",up:"89%",wip:"260"},{nm:"齒輪成形",ct:"150s",co:"42m",up:"84%",wip:"340"},{nm:"熱處理",ct:"—",co:"—",up:"90%",wip:"720"},{nm:"齒箱裝配",ct:"140s",co:"14m",up:"92%",wip:"190"},{nm:"跑合檢驗",ct:"95s",co:"6m",up:"95%",wip:"110"}]
};
function s0(sel){
  var s=sel||"VS-A";
  var list='';
  VS_STREAMS.forEach(function(v){
    list+='<div class="li'+(v.id===s?' on':'')+'" data-vs="'+v.id+'"><div class="t">'+v.nm+'<span class="pill '+v.st+'">'+v.stt+'</span></div>'+
      '<div class="m">'+v.id+' · '+v.fam+' · LT '+v.lt+' 天</div></div>';
  });
  var nodes=VS_NODES[s]||VS_NODES["VS-A"];
  var cur=VS_STREAMS.filter(function(v){return v.id===s;})[0]||VS_STREAMS[0];
  var mats=["供應商 週配","看板拉動","批量推動","批量推動","出貨 FIFO"];
  var flow='<div class="vsm-flow">';
  nodes.forEach(function(n,i){
    flow+='<div class="vsm-node"><div class="icon"><span class="material-symbols-outlined">precision_manufacturing</span></div>'+
      '<div class="nm">'+n.nm+'</div><div class="rows">'+
      '<div>C/T <b>'+n.ct+'</b></div><div>C/O <b>'+n.co+'</b></div>'+
      '<div>稼動 <b>'+n.up+'</b></div><div>在製 <b>'+n.wip+'</b></div></div></div>';
    if(i<nodes.length-1)flow+='<div class="vsm-arrow"><span class="material-symbols-outlined">chevron_right</span></div>';
  });
  flow+='</div>';
  var right=
    '<div class="card"><h3><span class="material-symbols-outlined">hub</span>'+cur.nm+' · 現況價值流程圖</h3>'+
    '<div class="scroll">'+flow+'</div>'+
    '<div class="legend"><span><span class="dot" style="background:'+PURPLE+'"></span>製程節點</span>'+
    '<span><span class="material-symbols-outlined" style="font-size:16px;color:'+PURPLE+'">chevron_right</span>物料流向</span>'+
    '<span>資訊流：'+mats.join(' → ')+'</span></div></div>'+
    '<div class="g3">'+
      '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">schedule</span>前置時間 LT</div><div class="val">'+cur.lt+'<small>天</small></div><div class="delta down">可縮短 42%</div></div>'+
      '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">bolt</span>增值比 PCE</div><div class="val">'+cur.pce+'</div><div class="delta up">目標 15%</div></div>'+
      '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">speed</span>節拍 Takt</div><div class="val">'+cur.takt+'</div><div class="delta">依需求</div></div>'+
    '</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>各站在製品（WIP）分佈</h3><div id="c0" class="chartbox"></div></div>';
  return scrHead("account_tree","現況價值流程","左側選擇產品族價值流，右側呈現製程節點的週期、換模與在製品資訊流。")+
    '<div class="split"><div class="list-pane"><div class="lp-head"><span class="material-symbols-outlined">list</span>價值流清單（4）</div>'+list+'</div>'+
    '<div class="detail-pane">'+right+'</div></div>';
}
function s0charts(sel){
  var s=sel||"VS-A";var nodes=VS_NODES[s]||VS_NODES["VS-A"];
  var cats=nodes.map(function(n){return n.nm;});
  var data=nodes.map(function(n){return +n.wip;});
  var cols=data.map(function(v){return v>=600?PURPLE:PURPLE2;});
  mount("c0",{
    series:[{name:"在製品 (件)",data:data}],
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:230},
    plotOptions:{bar:{borderRadius:6,distributed:true,columnWidth:"55%"}},
    colors:cols,
    dataLabels:{enabled:true},
    legend:{show:false},
    xaxis:{categories:cats},
    yaxis:{title:{text:"件數"}},
    grid:{borderColor:"#eee"}
  });
}

/* ===== Screen 1 : 週期時間軸 ===== */
var LADDER=[{nm:"下料切削",va:48,nva:1200},{nm:"CNC 車銑",va:92,nva:2100},{nm:"熱處理等待",va:0,nva:86400},{nm:"研磨",va:64,nva:900},{nm:"檢驗包裝",va:41,nva:600}];
function s1(){
  var totalVA=0,totalNVA=0;
  LADDER.forEach(function(l){totalVA+=l.va;totalNVA+=l.nva;});
  var maxNVA=86400;
  var rows='';
  LADDER.forEach(function(l){
    var vw=Math.max(2,(l.va/900)*100);
    var nw=Math.max(2,(l.nva/maxNVA)*100);
    rows+='<div class="seg"><div class="cell lab">'+l.nm+'</div>'+
      '<div class="cell va" style="width:'+vw+'px" title="增值">'+(l.va?l.va+'s':'')+'</div>'+
      '<div class="cell nva" style="flex:'+nw+'" title="非增值">'+(l.nva>=3600?(l.nva/3600).toFixed(1)+'h':l.nva+'s')+'</div></div>';
  });
  var pce=(totalVA/(totalVA+totalNVA)*100).toFixed(1);
  return scrHead("timeline","週期時間軸","將每一站切分為增值（VA）與非增值（NVA）時間，量化前置時間的浪費結構。")+
    '<div class="kpis">'+
      kpi("bolt","增值時間 VA",totalVA,"秒","","")+
      kpi("hourglass_empty","非增值 NVA",(totalNVA/3600).toFixed(1),"小時","","")+
      kpi("percent","流程效率 PCE",pce,"%","目標 15%","up")+
      kpi("timelapse","總前置時間",((totalVA+totalNVA)/3600).toFixed(1),"小時","可縮短 42%","down")+
    '</div>'+
    '<div class="g2" style="margin-top:16px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">horizontal_rule</span>時間階梯（VA vs NVA）</h3>'+
        '<div class="scroll"><div class="ladder">'+rows+'</div></div>'+
        '<div class="legend"><span><span class="dot" style="background:#22a565"></span>增值時間</span><span><span class="dot" style="background:#e05656"></span>非增值時間</span></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>時間累積瀑布圖</h3><div id="c1" class="chartbox"></div></div>'+

/* ---------- router ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
var container=document.getElementById("screen");

function buildNav(){
  var nv=document.getElementById("nav");var h='';
  MODULES.forEach(function(m,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span></button>';
  });
  nv.innerHTML=h;
  var btns=nv.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}

function wireStreamList(){
  var lis=container.querySelectorAll("[data-vs]");
  for(var k=0;k<lis.length;k++){
    (function(el){
      el.addEventListener("click",function(){
        var id=this.getAttribute("data-vs");
        container.innerHTML=s0(id);
        void container.offsetHeight;
        clearCharts();
        s0charts(id);
        wireStreamList();
      });
    })(lis[k]);
  }
}

function show(i){
  clearCharts();
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void container.offsetHeight;
  if(i===0){s0charts("VS-A");wireStreamList();}
  else{CHARTS[i]();}
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
