<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生產流程浪費分析工具｜價值流程圖 VSM</title>
<meta name="description" content="現況價值流程繪製、浪費環節辨識、未來狀態設計與 Kaizen 改善追蹤">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 5px 16px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,.li{cursor:pointer}
button:focus-visible,.li:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{max-width:1440px;min-height:100vh;margin:auto}
.topbar{
  min-height:72px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px clamp(16px,3vw,32px);
  color:#fff;
  background:#0F172A;
  border-bottom:3px solid var(--color-primary);
  position:sticky;
  top:0;
  z-index:40;
}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:4px;
}
.logo .material-symbols-outlined{font-size:24px}
.brand{min-width:0}
.topbar h1{font-size:17px;line-height:1.25;margin:0;font-weight:700;letter-spacing:.02em}
.topbar .sub{margin-top:3px;color:#CBD5E1;font-size:12px}
.spacer{flex:1}
.badge-ui{
  padding:5px 9px;
  border:1px solid #475569;
  border-radius:3px;
  color:#E2E8F0;
  font:500 11px "Fira Code",monospace;
  white-space:nowrap;
}
nav{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:9px clamp(16px,3vw,32px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:72px;
  z-index:30;
  scrollbar-width:thin;
}
nav button{
  min-height:40px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:8px 12px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  font-size:13px;
  font-weight:600;
  transition:background-color .2s,color .2s,border-color .2s;
}
nav button:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 2px 7px rgba(37,99,235,.2);
}
nav button .material-symbols-outlined{font-size:19px}
main{padding:22px clamp(16px,3vw,32px) 54px}
#screen{animation:reveal .35s ease-out both}
.scr-head{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
  gap:12px;
  margin-bottom:17px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}
.scr-head h2{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  font-size:clamp(20px,2.1vw,27px);
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.025em;
}
.scr-head h2 .material-symbols-outlined{color:var(--blue);font-size:25px}
.scr-head p{grid-column:1/-1;margin:0;color:var(--muted);font-size:13px;max-width:840px}
.card,.kpi,.list-pane{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card{padding:16px}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 14px;
  font-size:14px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{
  position:relative;
  padding:15px 16px;
  overflow:hidden;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--blue);
}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:0 7px 18px rgba(15,23,42,.08)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:17px}
.kpi .val{
  margin-top:6px;
  font:700 25px/1.2 "Fira Code",monospace;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:var(--muted);font:500 12px "Fira Sans",sans-serif}
.kpi .delta{margin-top:5px;font-size:11px;font-weight:600}
.up:before{content:"↑ ";font-family:"Fira Code",monospace}
.down:before{content:"↓ ";font-family:"Fira Code",monospace}
.up{color:var(--ok)}
.down{color:var(--bad)}
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:15px;align-items:start}
.list-pane{overflow:hidden}
.lp-head{
  display:flex;
  align-items:center;
  gap:7px;
  padding:12px 14px;
  background:#F1F5F9;
  border-bottom:1px solid var(--line);
  font-size:13px;
  font-weight:700;
}
.lp-head .material-symbols-outlined{color:var(--blue);font-size:18px}
.li{
  min-height:62px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  transition:background-color .2s,box-shadow .2s;
}
.li:last-child{border:0}
.li:hover{background:#F8FAFC}
.li.on{background:#EFF6FF;box-shadow:inset 3px 0 var(--blue)}
.li .t{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:13px;font-weight:700}
.li .m{margin-top:4px;color:var(--muted);font:500 10.5px "Fira Code",monospace}
.detail-pane{display:flex;min-width:0;flex-direction:column;gap:15px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:10.5px;
  line-height:1.25;
  font-weight:700;
  white-space:nowrap;
}
.pill:before{font-family:"Material Symbols Outlined";font-size:13px;font-weight:normal}
.pill.ok{color:#166534;background:#F0FDF4}.pill.ok:before{content:"check_circle"}
.pill.warn{color:#92400E;background:#FFFBEB}.pill.warn:before{content:"warning"}
.pill.bad{color:#991B1B;background:#FEF2F2}.pill.bad:before{content:"error"}
.pill.info{color:#1E40AF;background:#EFF6FF}.pill.info:before{content:"info"}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.scroll{min-width:0;max-width:100%;overflow-x:auto}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{padding:9px 10px}
.tbl th{
  color:#334155;
  background:#F1F5F9;
  border-block:1px solid var(--line);
  text-align:left;
  font-weight:700;
  white-space:nowrap;
}
.tbl td{border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:#F8FAFC}
.tbl tr:last-child td{border-bottom:0}
.tbl td:nth-child(n+2){font-variant-numeric:tabular-nums}
.tbl td:has(.bar){text-align:right}
.bar{height:7px;min-width:60px;overflow:hidden;background:#DBEAFE;border-radius:2px}
.bar>span{display:block;height:100%;background:var(--blue)}
.vsm-flow{display:flex;align-items:stretch;gap:9px;min-width:760px;padding:17px 1px 6px}
.vsm-node{
  position:relative;
  display:flex;
  flex:1;
  min-width:122px;
  flex-direction:column;
  gap:6px;
  padding:12px;
  background:#fff;
  border:1px solid #93C5FD;
  border-top:3px solid var(--blue);
  border-radius:4px;
}
.vsm-node .nm{font-size:12px;font-weight:700}
.vsm-node .rows{display:grid;gap:2px;color:var(--muted);font:400 10.5px "Fira Code",monospace}
.vsm-node .rows b{color:var(--ink);font-weight:600}
.vsm-node .icon{
  position:absolute;
  top:-14px;
  right:9px;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:3px;
}
.vsm-node .icon .material-symbols-outlined{font-size:16px}
.vsm-arrow{align-self:center;flex:none;color:var(--blue)}
.vsm-arrow .material-symbols-outlined{font-size:23px}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{display:inline-block;width:10px;height:10px;border:1px solid rgba(15,23,42,.25);border-radius:2px}
.ladder{display:flex;min-width:640px;flex-direction:column;gap:4px}
.ladder .seg{display:flex;align-items:stretch;gap:3px;height:38px}
.ladder .cell{display:flex;min-width:2px;align-items:center;justify-content:center;border-radius:2px;color:#fff;font:600 10px "Fira Code",monospace}
.ladder .va{background:#15803D}.ladder .nva{background:#DC2626}
.ladder .lab{width:106px;flex:none;justify-content:flex-start;color:var(--muted);font-family:"Fira Sans",sans-serif}
.kb{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;min-width:720px}
.kb-col{min-width:0;padding:10px;background:#F1F5F9;border:1px solid var(--line);border-radius:4px}
.kb-col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px;font-size:12px}
.cnt{min-width:23px;padding:2px 6px;color:#fff;background:var(--blue);border-radius:3px;text-align:center;font:600 10px "Fira Code",monospace}
.kcard{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:3px;transition:transform .2s,box-shadow .2s}
.kcard:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,.08)}
.kcard:last-child{margin-bottom:0}.kt{font-size:12px;font-weight:700}
.km{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:7px;color:var(--muted);font:500 10px "Fira Code",monospace}
.avatar{display:inline-grid;width:21px;height:21px;place-items:center;color:#fff;background:#334155;border-radius:50%;font:600 10px "Fira Sans",sans-serif}
.matrix{width:100%;min-width:640px;border-collapse:collapse;font-size:12px}
.matrix th{padding:8px;color:#334155;background:#F1F5F9;font-size:11px;font-weight:700}
.matrix td{padding:0;text-align:center}
.mcell{height:43px;margin:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(15,23,42,.15);border-radius:3px;color:#0F172A;font:700 14px "Fira Code",monospace}
.mcell small{font-size:9px;font-weight:500}
.rowlab{padding-right:8px!important;text-align:left!important;font-weight:700;white-space:nowrap}
.note{display:flex;gap:10px;margin-bottom:9px;padding:11px;background:#F8FAFC;border:1px solid var(--line);border-radius:4px}
.note:last-child{margin-bottom:0}
.nic{width:33px;height:33px;display:grid;place-items:center;flex:none;color:var(--blue);background:#DBEAFE;border-radius:3px}
.nb{font-size:12px;font-weight:700}.nd{margin-top:2px;color:var(--muted);font-size:11px}
.chartbox{min-width:0}
.muted{color:var(--muted)}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:860px){.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.topbar .sub{display:none}}
@media(max-width:560px){
  .topbar{min-height:64px}.badge-ui{display:none}nav{top:64px}
  nav button{padding:9px 11px}nav button .txt{display:none}
  main{padding-top:17px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{padding:13px}.kpi .val{font-size:21px}.scr-head{display:block}.scr-head p{margin-top:7px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #screen{animation:none}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">precision_manufacturing</span></div>
  <div class="brand">
    <h1>生產流程浪費分析工具</h1>
    <div class="sub">現況繪製 · 浪費辨識 · 未來狀態設計 · 改善追蹤</div>
  </div>
  <div class="spacer"></div>
  <div class="badge-ui">VSM / LIVE VIEW</div>
</header>
<nav id="nav" aria-label="主要功能"></nav>
<main><div id="screen"></div></main>
</div>
<script>
"use strict";
var charts=[];
var BLUE="#2563EB",BLUE2="#60A5FA",ORANGE="#EA580C",GREEN="#15803D",RED="#DC2626";
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mount(id,opt){
  var el=document.getElementById(id);if(!el)return;
  opt.chart=Object.assign({redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Fira Sans",sans-serif'},opt.chart||{});
  var c=new ApexCharts(el,opt);c.render();charts.push(c);
}
var MODULES=[
  {icon:"account_tree",name:"現況價值流程"},{icon:"timeline",name:"週期時間軸"},
  {icon:"delete_sweep",name:"浪費環節辨識"},{icon:"lightbulb",name:"未來狀態設計"},
  {icon:"task_alt",name:"改善計畫追蹤"},{icon:"insights",name:"成效指標儀表"}
];
function head(icon,title,desc){return '<div class="scr-head"><h2><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h2><p>'+desc+'</p></div>'}
function kpi(icon,lab,val,unit,delta,dir){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+(delta?'<div class="delta '+(dir||'')+'">'+delta+'</div>':'')+'</div>'}

var STREAMS=[
{id:"VS-A",nm:"控制閥本體加工線",fam:"閥體 A族",lt:"14.6",pce:"6.8%",takt:"92 秒",st:"warn",stt:"待改善"},
{id:"VS-B",nm:"泵浦組裝流程",fam:"泵浦 B族",lt:"9.2",pce:"11.2%",takt:"120 秒",st:"ok",stt:"已優化"},
{id:"VS-C",nm:"感測器封裝線",fam:"感測 C族",lt:"18.3",pce:"4.1%",takt:"64 秒",st:"bad",stt:"高浪費"},
{id:"VS-D",nm:"齒輪箱裝配",fam:"傳動 D族",lt:"12.0",pce:"7.9%",takt:"150 秒",st:"warn",stt:"待改善"}];
var NODES={
"VS-A":[["下料切削","48s","22m","96%","320"],["CNC 車銑","92s","38m","88%","210"],["熱處理","—","—","91%","860"],["研磨","64s","15m","94%","180"],["檢驗包裝","41s","6m","97%","95"]],
"VS-B":[["零件備料","55s","8m","95%","140"],["次組裝","110s","12m","90%","180"],["主線裝配","120s","10m","93%","220"],["測試","85s","5m","96%","70"],["包裝入庫","40s","4m","98%","60"]],
"VS-C":[["晶片取放","32s","18m","85%","420"],["打線","64s","25m","82%","680"],["封膠固化","—","—","88%","1200"],["雷射標記","28s","9m","92%","210"],["終測包裝","36s","7m","95%","150"]],
"VS-D":[["軸件加工","78s","30m","89%","260"],["齒輪成形","150s","42m","84%","340"],["熱處理","—","—","90%","720"],["齒箱裝配","140s","14m","92%","190"],["跑合檢驗","95s","6m","95%","110"]]};
function s0(sel){
  sel=sel||"VS-A";var list="",cur=STREAMS[0];
  STREAMS.forEach(function(v){if(v.id===sel)cur=v;list+='<div class="li'+(v.id===sel?' on':'')+'" tabindex="0" role="button" data-vs="'+v.id+'"><div class="t">'+v.nm+'<span class="pill '+v.st+'">'+v.stt+'</span></div><div class="m">'+v.id+' · '+v.fam+' · LT '+v.lt+' 天</div></div>'});
  var flow='<div class="vsm-flow">';
  NODES[sel].forEach(function(n,i){flow+='<div class="vsm-node"><div class="icon"><span class="material-symbols-outlined">precision_manufacturing</span></div><div class="nm">'+n[0]+'</div><div class="rows"><div>C/T <b>'+n[1]+'</b></div><div>C/O <b>'+n[2]+'</b></div><div>稼動 <b>'+n[3]+'</b></div><div>在製 <b>'+n[4]+'</b></div></div></div>'+(i<4?'<div class="vsm-arrow"><span class="material-symbols-outlined">chevron_right</span></div>':'')});flow+='</div>';
  return head("account_tree","現況價值流程","左側選擇產品族價值流，右側呈現製程節點的週期、換模與在製品資訊流。")+
  '<div class="split"><div class="list-pane"><div class="lp-head"><span class="material-symbols-outlined">list</span>價值流清單（4）</div>'+list+'</div><div class="detail-pane">'+
  '<div class="card"><h3><span class="material-symbols-outlined">hub</span>'+cur.nm+' · 現況價值流程圖</h3><div class="scroll">'+flow+'</div><div class="legend"><span><i class="dot" style="background:'+BLUE+'"></i>製程節點</span><span><span class="material-symbols-outlined" style="font-size:16px;color:'+BLUE+'">chevron_right</span>物料流向</span><span>資訊流：供應商 週配 → 看板拉動 → 批量推動 → 批量推動 → 出貨 FIFO</span></div></div>'+
  '<div class="g3">'+kpi("schedule","前置時間 LT",cur.lt,"天","可縮短 42%","down")+kpi("bolt","增值比 PCE",cur.pce,"","目標 15%","up")+kpi("speed","節拍 Takt",cur.takt,"","依需求","")+'</div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>各站在製品（WIP）分佈</h3><div id="c0"></div></div></div></div>';
