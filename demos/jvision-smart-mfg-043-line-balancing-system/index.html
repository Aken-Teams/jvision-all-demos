<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產線平衡系統 Line Balancing System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--ink:#334155;--ink2:#64748b;--bg:#f1f5f9;--card:#ffffff;--line:#e2e8f0;--txt:#1e293b;--mut:#64748b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;}
.app{display:flex;min-height:100vh;}
.side{width:236px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.brand .logo{width:38px;height:38px;flex:none;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;}
.brand b{font-size:15px;color:var(--ink);display:block;line-height:1.3;}
.brand span{font-size:11px;color:var(--mut);}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:none;border-radius:9px;cursor:pointer;font:inherit;font-size:13.5px;color:var(--mut);text-align:left;width:100%;transition:.15s;}
.nav button .num{width:22px;height:22px;flex:none;border-radius:6px;background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.nav button:hover{background:var(--bg);color:var(--txt);}
.nav button.on{background:var(--ink);color:#fff;}
.nav button.on .num{background:rgba(255,255,255,.22);color:#fff;}
.nav button .lbl{flex:1;min-width:0;}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);}
.main{flex:1;min-width:0;padding:22px 26px 40px;}
.head{margin-bottom:18px;}
.head h1{font-size:20px;color:var(--ink);font-weight:700;letter-spacing:-.2px;}
.head p{font-size:13px;color:var(--mut);margin-top:3px;}
.head .tag{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;}
.card h3{font-size:13.5px;color:var(--txt);font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{color:var(--ink2);font-size:19px;}
.card .sub{font-size:11.5px;color:var(--mut);margin-bottom:12px;}
.kpi .v{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.5px;}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:500;margin-left:3px;}
.kpi .lb{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;}
.kpi .dl{font-size:11.5px;font-weight:600;margin-top:7px;display:inline-flex;align-items:center;gap:3px;}
.up{color:var(--ok);}.dn{color:var(--bad);}.fl{color:var(--warn);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;min-width:70px;}
.bar i{display:block;height:100%;border-radius:5px;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.p-ok{background:#dcfce7;color:#15803d;}.p-warn{background:#fef3c7;color:#b45309;}.p-bad{background:#fee2e2;color:#b91c1c;}.p-mut{background:#f1f5f9;color:#475569;}.p-ink{background:#e2e8f0;color:#334155;}
.mono{font-variant-numeric:tabular-nums;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.chart{width:100%;}
.stnrow{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding:6px 2px 4px;}
.stn{flex:1;min-width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.stn .col{width:100%;background:var(--bg);border-radius:8px 8px 0 0;position:relative;height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
.stn .fill{width:100%;border-radius:8px 8px 0 0;transition:.2s;}
.stn .nm{font-size:12px;font-weight:600;}
.stn .tm{font-size:11px;color:var(--mut);}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 15px 0;}
.tl .it::before{content:"";position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--ink2);}
.tl .it.done::before{background:var(--ink);border-color:var(--ink);}
.tl .tt{font-size:13px;font-weight:600;}
.tl .mt{font-size:11.5px;color:var(--mut);}
.dag{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;align-items:center;}
.dagcol{display:flex;flex-direction:column;gap:8px;flex:none;}
.node{width:96px;border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff;text-align:center;}
.node b{font-size:12.5px;color:var(--ink);}
.node span{font-size:10.5px;color:var(--mut);display:block;}
.node.b{border-color:var(--warn);background:#fffbeb;}
.arrow{color:var(--ink2);flex:none;}
.matrix td,.matrix th{text-align:center;padding:7px 8px;}
.dot{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
.cmp{display:flex;gap:12px;flex-wrap:wrap;}
.cmp .box{flex:1;min-width:150px;border:1px solid var(--line);border-radius:11px;padding:13px;}
.cmp .box.win{border-color:var(--ink);background:#f8fafc;}
.hint{font-size:11.5px;color:var(--mut);background:var(--bg);border-radius:9px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;}
.hint .material-symbols-outlined{color:var(--ink2);font-size:18px;flex:none;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px;}
  .brand{border-bottom:none;margin-bottom:0;padding:0 8px 0 4px;flex:none;}
  .side .foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;flex:1;}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:8px 11px;}
  .main{padding:16px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button .lbl{display:none;}
  .nav button{padding:8px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">balance</span></div>
      <div><b>產線平衡系統</b><span>Line Balancing System</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">MES · 工業工程模組<br/>資料為示範用途</div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var NAV=[
 {i:"timer",t:"工序時間量測"},
 {i:"balance",t:"產線平衡率分析"},
 {i:"account_tree",t:"工序優先關係"},
 {i:"shuffle",t:"工序重組模擬"},
 {i:"fact_check",t:"方案驗證比較"},
 {i:"rocket_launch",t:"現場導入追蹤"}
];
var nav=document.getElementById("nav");
NAV.forEach(function(m,idx){
  var b=document.createElement("button");
  b.setAttribute("data-i",idx);
  b.innerHTML='<span class="num">'+idx+'</span><span class="material-symbols-outlined">'+m.i+'</span><span class="lbl">'+m.t+'</span>';
  b.addEventListener("click",function(){show(idx);});
  nav.appendChild(b);
});

var view=document.getElementById("view");
var chartStore=[];
function clearCharts(){chartStore.forEach(function(c){try{c.destroy();}catch(e){}});chartStore=[];}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};
  opt.chart=Object.assign(baseChart,opt.chart||{});
  var ch=new ApexCharts(el,opt);
  ch.render();
  chartStore.push(ch);
}
function head(t,p,tag){
  return '<div class="head"><h1>'+t+'</h1><p>'+p+'</p>'+(tag?'<span class="tag"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+tag+'</span>':'')+'</div>';
}
function barcol(pct,c){return '<div class="bar"><i style="width:'+pct+'%;background:'+c+'"></i></div>';}
function kpi(lb,v,unit,ic,dir,note){
  var dc=dir==="up"?"up":(dir==="dn"?"dn":"fl");
  var ar=dir==="up"?"arrow_upward":(dir==="dn"?"arrow_downward":"remove");
  return '<div class="card kpi"><div class="lb"><span class="material-symbols-outlined" style="font-size:17px;color:#64748b">'+ic+'</span>'+lb+'</div>'+
    '<div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="dl '+dc+'"><span class="material-symbols-outlined" style="font-size:15px">'+ar+'</span>'+note+'</div></div>';
}
function miniStat(lb,val){
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:#f8fafc;border-radius:9px"><span style="font-size:12.5px;color:#475569">'+lb+'</span><span style="font-size:13px;font-weight:700;color:#334155">'+val+'</span></div>';
}

/* SCREEN 0 */
function s0(){
  var rows=[
    {st:"ST01 上料",std:26.0,act:27.4,n:120,cv:4.2},
    {st:"ST02 裁切",std:31.5,act:33.8,n:118,cv:6.1},
    {st:"ST03 折彎",std:29.0,act:28.2,n:121,cv:3.4},
    {st:"ST04 焊接",std:42.0,act:45.6,n:110,cv:8.7},
    {st:"ST05 研磨",std:24.5,act:23.9,n:122,cv:2.9},
    {st:"ST06 組裝",std:38.0,act:39.1,n:115,cv:5.5},
    {st:"ST07 檢測",std:22.0,act:22.6,n:124,cv:3.1},
    {st:"ST08 包裝",std:19.5,act:20.3,n:126,cv:2.4}
  ];
  var maxv=48;
  var tr=rows.map(function(r){
    var dev=((r.act-r.std)/r.std*100);
    var cvc=r.cv>7?'p-bad':(r.cv>5?'p-warn':'p-ok');
    return '<tr><td><b>'+r.st+'</b></td><td class="mono">'+r.std.toFixed(1)+'s</td><td class="mono">'+r.act.toFixed(1)+'s</td>'+
      '<td style="width:150px">'+barcol(r.act/maxv*100,r.act>r.std?'#d97706':'#334155')+'</td>'+
      '<td class="mono '+(dev>0?'dn':'up')+'">'+(dev>0?'+':'')+dev.toFixed(1)+'%</td>'+
      '<td class="mono">'+r.n+'</td><td><span class="pill '+cvc+'">CV '+r.cv.toFixed(1)+'%</span></td></tr>';
  }).join("");
  view.innerHTML=head("工序時間量測","以碼錶與影像量測各工站作業元素工時，建立標準工時基準（STD）與實測節拍對照。","量測樣本 976 筆 · 8 工站")+
   '<div class="grid g4" style="margin-bottom:14px">'+
     kpi("量測工站","8","站","done_all","up","覆蓋率 100%")+
     kpi("平均實測節拍","30.1","s","timer","dn","+3.4% vs STD")+
     kpi("最長工站","ST04","","priority_high","fl","焊接 45.6s")+
     kpi("量測穩定度","94.2","%","insights","up","CV≤5% 佔比")+
   '</div>'+
   '<div class="grid g23">'+
     '<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>各工站標準工時 vs 實測節拍</h3><div class="sub">STD＝標準工時；CV＝變異係數，越低越穩定</div>'+
       '<div style="overflow-x:auto"><table><thead><tr><th>工站</th><th>標準工時</th><th>實測節拍</th><th>節拍長度</th><th>偏差</th><th>樣本</th><th>穩定度</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
     '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>作業元素工時分解 · ST04</h3><div class="sub">焊接站各作業元素堆疊（秒）</div><div id="c0a" class="chart"></div></div>'+
   '</div>';
  void view.offsetHeight;
  mk("c0a",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:300,stacked:true},
    plotOptions:{bar:{horizontal:true,barHeight:"46%"}},
    series:[
      {name:"取件定位",data:[6.2]},{name:"點焊",data:[14.8]},{name:"連續焊",data:[16.1]},{name:"清渣檢查",data:[8.5]}
    ],
    colors:["#94a3b8","#334155","#64748b","#cbd5e1"],
    xaxis:{categories:["ST04 焊接"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{show:false}},
    dataLabels:{enabled:true,style:{fontSize:"11px",colors:["#fff"]}},
    legend:{position:"bottom",fontSize:"12px"},
    grid:{borderColor:"#eef2f6"}
  });
}

/* SCREEN 1 */
function s1(){
  var stn=[
    {n:"ST01",v:27.4},{n:"ST02",v:33.8},{n:"ST03",v:28.2},{n:"ST04",v:45.6},
    {n:"ST05",v:23.9},{n:"ST06",v:39.1},{n:"ST07",v:22.6},{n:"ST08",v:20.3}
  ];
  var takt=48, colH=150;
  var bars=stn.map(function(s){
    var h=Math.round(s.v/takt*colH);
    var c=s.v>=44?'#dc2626':(s.v>=38?'#d97706':'#334155');
    return '<div class="stn"><div class="col"><div class="fill" style="height:'+h+'px;background:'+c+'"></div></div><div class="nm">'+s.n+'</div><div class="tm">'+s.v.toFixed(1)+'s</div></div>';
  }).join("");
  view.innerHTML=head("產線平衡率分析","計算目前產線平衡率、辨識瓶頸站與各站節拍差異；紅色代表逼近或超過目標節拍。","目標節拍 Takt = 48.0s")+
   '<div class="grid g4" style="margin-bottom:14px">'+
     kpi("產線平衡率","55.7","%","balance","dn","低於 85% 目標")+
     kpi("瓶頸站","ST04","","priority_high","fl","焊接 45.6s")+
     kpi("平衡損失","44.3","%","trending_down","dn","閒置工時佔比")+
     kpi("理論最少工站","5.2","站","group_work","up","目前 8 站")+
   '</div>'+
   '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">equalizer</span>各工站節拍負荷圖（Yamazumi）</h3><div class="sub">柱高＝該站節拍時間；紅色虛線為目標節拍 Takt 48.0s</div>'+
     '<div style="position:relative"><div style="position:absolute;left:0;right:0;top:8px;height:0;border-top:2px dashed #dc2626;z-index:2"></div><div style="position:absolute;right:2px;top:-6px;font-size:10.5px;color:#dc2626;font-weight:600">Takt 48s</div>'+
     '<div class="stnrow" style="margin-top:2px">'+bars+'</div></div>'+
     '<div class="legend"><span><i style="background:#334155"></i>正常</span><span><i style="background:#d97706"></i>偏高</span><span><i style="background:#dc2626"></i>瓶頸/逼近上限</span></div></div>'+
   '<div class="grid g2">'+
     '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 6 週平衡率趨勢</h3><div class="sub">產線 L-A 平衡率（%）</div><div id="c1a" class="chart"></div></div>'+
     '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>工時結構分析</h3><div class="sub">有效作業 vs 平衡損失</div><div id="c1b" class="chart"></div></div>'+
   '</div>';
  void view.offsetHeight;
  mk("c1a",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:250},
    series:[{name:"平衡率 %",data:[52.1,53.4,54.0,55.2,55.5,55.7]}],
    colors:["#334155"],stroke:{width:3,curve:"smooth"},
    markers:{size:4,colors:["#334155"]},
    xaxis:{categories:["W27","W28","W29","W30","W31","W32"],labels:{style:{fontSize:"11px"}}},
    yaxis:{min:45,max:90,labels:{formatter:function(v){return v.toFixed(0)+"%";},style:{fontSize:"11px"}}},
    annotations:{yaxis:[{y:85,borderColor:"#16a34a",strokeDashArray:5,label:{text:"目標 85%",style:{color:"#fff",background:"#16a34a",fontSize:"10px"}}}]},
    grid:{borderColor:"#eef2f6"},dataLabels:{enabled:false}
  });
  mk("c1b",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:250},
    series:[55.7,44.3],labels:["有效作業","平衡損失"],
    colors:["#334155","#e2e8f0"],
    dataLabels:{enabled:true,formatter:function(v){return v.toFixed(1)+"%";},style:{fontSize:"11px"}},
    legend:{position:"bottom",fontSize:"12px"},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"平衡率",fontSize:"12px",formatter:function(){return "55.7%";}}}}}}
  });
}

/* SCREEN 2 */
function s2(){
  var el=[
    {c:"A",n:"上料定位",t:6.2},{c:"B",n:"裁切",t:31.5},{c:"C",n:"折彎",t:29.0},
    {c:"D",n:"點焊",t:14.8},{c:"E",n:"連續焊",t:16.1},{c:"F",n:"研磨",t:23.9},
    {c:"G",n:"組裝",t:38.0},{c:"H",n:"檢測",t:22.0},{c:"I",n:"包裝",t:19.5}
  ];
  var prec=[["A","B"],["B","C"],["C","D"],["D","E"],["C","F"],["E","G"],["F","G"],["G","H"],["H","I"]];
  var codes=el.map(function(e){return e.c;});
  var mhead='<th></th>'+codes.map(function(c){return '<th>'+c+'</th>';}).join("");
  var mbody=codes.map(function(r){
    var cells=codes.map(function(cc){
      var yes=prec.some(function(p){return p[0]===r&&p[1]===cc;});
      return '<td>'+(yes?'<span class="dot" style="background:#334155">→</span>':(r===cc?'<span class="dot" style="background:#e2e8f0;color:#94a3b8">·</span>':'<span style="color:#cbd5e1">–</span>'))+'</td>';
    }).join("");
    return '<tr><th style="text-align:center">'+r+'</th>'+cells+'</tr>';
  }).join("");
  var levels=[["A"],["B"],["C"],["D","F"],["E"],["G"],["H"],["I"]];
  var dag=levels.map(function(col,ix){
    var nodes=col.map(function(c){
      var e=el.filter(function(x){return x.c===c;})[0];
      var b=(c==="G")?" b":"";
      return '<div class="node'+b+'"><b>'+c+'</b><span>'+e.n+'</span><span class="mono">'+e.t.toFixed(1)+'s</span></div>';
    }).join("");
    var colHtml='<div class="dagcol">'+nodes+'</div>';
    if(ix<levels.length-1)colHtml+='<span class="material-symbols-outlined arrow">arrow_forward</span>';
    return colHtml;
  }).join("");
  var tr=el.map(function(e){
    var pre=prec.filter(function(p){return p[1]===e.c;}).map(function(p){return p[0];});

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  RENDER[i]();
}
window.show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
