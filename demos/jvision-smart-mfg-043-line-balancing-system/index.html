<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產線平衡系統 Line Balancing System</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
  --color-on-secondary:#000;--color-accent:#ea580c;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#1e293b;--color-card:#fff;
  --color-card-foreground:#1e293b;--color-muted:#e9eff8;--color-muted-foreground:#475569;
  --color-border:#e2e8f0;--color-destructive:#dc2626;--color-on-destructive:#fff;
  --color-ring:#2563eb;--success:#15803d;--warning:#b45309;
  --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--color-foreground);font-family:"Fira Sans","Noto Sans TC",sans-serif;line-height:1.55}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;top:0;z-index:20;display:flex;flex:0 0 264px;flex-direction:column;
  height:100vh;padding:22px 16px;background:var(--color-card);border-right:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.logo{
  display:grid;place-items:center;flex:none;width:42px;height:42px;color:#fff;
  background:var(--blue);border-radius:8px;box-shadow:0 6px 14px rgba(37,99,235,.2)
}
.brand b{display:block;font-size:15px;line-height:1.35;letter-spacing:.01em;color:var(--ink)}
.brand span:not(.material-symbols-outlined){display:block;margin-top:2px;color:var(--muted);font:400 10px/1.3 "Fira Code",monospace;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;
  color:var(--muted);text-align:left;background:transparent;border:1px solid transparent;border-radius:7px;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease
}
.nav button:hover{color:var(--blue);background:#eff6ff;border-color:#bfdbfe;transform:translateX(2px)}
.nav button.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 5px 12px rgba(37,99,235,.18)}
.nav button.on::before{position:absolute;left:-17px;width:3px;height:24px;background:var(--color-accent);content:""}
.nav .num{
  display:grid;place-items:center;flex:none;width:23px;height:23px;color:#64748b;
  background:var(--color-muted);border-radius:5px;font:600 11px "Fira Code",monospace
}
.nav button.on .num{color:var(--blue);background:#fff}
.nav .lbl{flex:1;font-size:13px;font-weight:500}
.foot{margin-top:auto;padding:16px 8px 0;color:#64748b;border-top:1px solid var(--line);font:400 10px/1.65 "Fira Code",monospace}
.main{flex:1;width:calc(100% - 264px);padding:30px clamp(18px,3vw,44px) 52px}
.head{
  position:relative;padding:25px 28px;margin-bottom:18px;overflow:hidden;
  background:linear-gradient(112deg,#fff 0%,#fff 67%,#eff6ff 100%);
  border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;box-shadow:var(--shadow)
}
.head::after{
  position:absolute;right:-44px;top:-82px;width:190px;height:190px;
  border:34px solid rgba(37,99,235,.055);border-radius:50%;content:""
}
.head h1{position:relative;z-index:1;margin:0;color:var(--ink);font-size:clamp(22px,2.25vw,31px);line-height:1.25;letter-spacing:-.035em}
.head p{position:relative;z-index:1;max-width:780px;margin:8px 0 0;color:var(--muted);font-size:13px}
.tag{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 10px;
  color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;
  font:500 11px "Fira Code",monospace
}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{
  background:var(--color-card);border:1px solid var(--line);border-radius:8px;padding:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.025);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease
}
.card:hover{border-color:#cbd5e1;box-shadow:var(--shadow);transform:translateY(-1px)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;color:var(--ink);font-size:14px;line-height:1.4}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.sub{margin-bottom:14px;color:#64748b;font-size:11.5px}
.kpi{position:relative;overflow:hidden}
.kpi::before{position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--blue),#60a5fa);content:""}
.kpi .lb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{margin-top:8px;color:var(--ink);font:700 27px/1.2 "Fira Code",monospace;letter-spacing:-.04em}
.kpi .v small{margin-left:4px;color:#64748b;font:500 12px "Fira Sans","Noto Sans TC",sans-serif;letter-spacing:0}
.kpi .dl{display:inline-flex;align-items:center;gap:3px;margin-top:9px;font-size:11.5px;font-weight:600}
.up{color:var(--success)}.dn{color:var(--color-destructive)}.fl{color:var(--warning)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{
  padding:9px 10px;color:var(--muted);text-align:left;white-space:nowrap;
  background:#f8fafc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;letter-spacing:.025em
}
th:first-child{border-left:1px solid var(--line);border-radius:5px 0 0 5px}
th:last-child{border-right:1px solid var(--line);border-radius:0 5px 5px 0}
td{padding:10px;border-bottom:1px solid #edf2f7;white-space:nowrap}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+2):not(:last-child).mono{text-align:right}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.bar{height:7px;min-width:72px;overflow:hidden;background:var(--color-muted);border-radius:2px}
.bar i{display:block;height:100%;border-radius:2px}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid transparent;
  border-radius:4px;font-size:10.5px;font-weight:600;line-height:1.25
}
.p-ok{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
.p-warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
.p-bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.p-mut{color:#475569;background:#f8fafc;border-color:#cbd5e1}
.p-ink{color:#1e40af;background:#eff6ff;border-color:#bfdbfe}
.chart{width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:-1px}
.stnrow{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding:7px 2px 4px}
.stn{display:flex;flex:1;flex-direction:column;align-items:center;gap:6px;min-width:78px}
.stn .col{display:flex;flex-direction:column;justify-content:flex-end;width:100%;height:150px;overflow:hidden;background:#eff3f8;border-radius:5px 5px 0 0}
.stn .fill{width:100%;border-radius:5px 5px 0 0;transition:height .22s ease}
.stn .nm{font:600 11px "Fira Code",monospace}.stn .tm{color:var(--muted);font:400 10.5px "Fira Code",monospace}
.tl{position:relative;padding-left:24px}
.tl::before{position:absolute;top:4px;bottom:4px;left:6px;width:2px;background:var(--line);content:""}
.tl .it{position:relative;padding-bottom:16px}
.tl .it::before{position:absolute;top:4px;left:-22px;width:10px;height:10px;background:#fff;border:2px solid var(--warning);border-radius:50%;content:""}
.tl .it.done::before{background:var(--blue);border-color:var(--blue)}
.tl .tt{font-size:13px;font-weight:600}.tl .mt{color:var(--muted);font-size:11.5px}
.dag{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:9px 2px}
.dagcol{display:flex;flex:none;flex-direction:column;gap:8px}
.node{width:99px;padding:9px;background:#fff;border:1px solid #cbd5e1;border-radius:6px;text-align:center}
.node b{color:var(--blue);font:700 12px "Fira Code",monospace}
.node span{display:block;color:var(--muted);font-size:10.5px}
.node.b{background:#fffbeb;border-color:#d97706}
.arrow{flex:none;color:#94a3b8}
.matrix td,.matrix th{padding:7px;text-align:center}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;color:#fff;border-radius:4px;font-size:11px;font-weight:700}
.cmp{display:flex;gap:12px;flex-wrap:wrap}
.cmp .box{flex:1;min-width:150px;padding:13px;border:1px solid var(--line);border-radius:7px}
.cmp .box.win{background:#eff6ff;border-color:#93c5fd}
.hint{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;font-size:11.5px}
.hint .material-symbols-outlined{flex:none;color:var(--blue);font-size:18px}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
@media(max-width:1024px){.side{flex-basis:224px}.main{width:calc(100% - 224px);padding:24px 20px 42px}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .app{display:block}.side{position:static;width:100%;height:auto;padding:12px}
  .brand{padding:2px 4px 12px;margin-bottom:10px}.brand .logo{width:36px;height:36px}
  .nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav button{justify-content:center;padding:9px 7px}
  .nav button.on::before{display:none}.nav .lbl{display:none}.foot{display:none}
  .main{width:100%;padding:16px 14px 36px}.head{padding:21px 19px}
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:480px){
  .g4{grid-template-columns:1fr}.nav{grid-template-columns:repeat(6,1fr)}
  .nav button{gap:0}.nav .num{display:none}.card{padding:15px}.head h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  .nav button:hover,.card:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">balance</span></div>
    <div><b>產線平衡系統</b><span>Line Balancing System</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="系統功能"></nav>
  <div class="foot">MES · 工業工程模組<br>資料為示範用途</div>
</aside>
<main class="main"><div id="view"></div></main>
</div>
<script>
(function(){
"use strict";
var C={blue:"#2563eb",blue2:"#3b82f6",muted:"#cbd5e1",line:"#e2e8f0",ok:"#15803d",warn:"#b45309",bad:"#dc2626"};
var NAV=[
 {i:"timer",t:"工序時間量測"},{i:"balance",t:"產線平衡率分析"},
 {i:"account_tree",t:"工序優先關係"},{i:"shuffle",t:"工序重組模擬"},
 {i:"fact_check",t:"方案驗證比較"},{i:"rocket_launch",t:"現場導入追蹤"}
];
var nav=document.getElementById("nav"),view=document.getElementById("view"),chartStore=[];
NAV.forEach(function(m,idx){
 var b=document.createElement("button");
 b.type="button";b.setAttribute("data-i",idx);b.setAttribute("aria-label",m.t);
 b.innerHTML='<span class="num">0'+(idx+1)+'</span><span class="material-symbols-outlined" aria-hidden="true">'+m.i+'</span><span class="lbl">'+m.t+'</span>';
 b.addEventListener("click",function(){location.hash="v"+idx;show(idx)});nav.appendChild(b);
});
function clearCharts(){chartStore.forEach(function(c){try{c.destroy()}catch(e){}});chartStore=[]}
function mk(id,opt){
 var el=document.getElementById(id);if(!el)return;
 var base={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Fira Sans","Noto Sans TC",sans-serif',foreColor:"#475569"};
 opt.chart=Object.assign(base,opt.chart||{});
 var ch=new ApexCharts(el,opt);ch.render();chartStore.push(ch);
}
function head(t,p,tag){return '<div class="head"><h1>'+t+'</h1><p>'+p+'</p>'+(tag?'<span class="tag"><span class="material-symbols-outlined" style="font-size:16px" aria-hidden="true">manufacturing</span>'+tag+'</span>':'')+'</div>'}
function barcol(pct,c){return '<div class="bar" role="img" aria-label="比例 '+Math.round(pct)+'%"><i style="width:'+pct+'%;background:'+c+'"></i></div>'}
function kpi(lb,v,unit,ic,dir,note){
 var dc=dir==="up"?"up":dir==="dn"?"dn":"fl",ar=dir==="up"?"arrow_upward":dir==="dn"?"arrow_downward":"remove";
 return '<div class="card kpi"><div class="lb"><span class="material-symbols-outlined" style="font-size:17px;color:#2563eb" aria-hidden="true">'+ic+'</span>'+lb+'</div><div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dl '+dc+'"><span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">'+ar+'</span>'+note+'</div></div>'
}
function miniStat(lb,val){return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 11px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px"><span style="font-size:12px;color:#475569">'+lb+'</span><span class="mono" style="font-size:12px;font-weight:700;color:#1e293b;text-align:right">'+val+'</span></div>'}

function s0(){
 var rows=[
 {st:"ST01 上料",std:26,act:27.4,n:120,cv:4.2},{st:"ST02 裁切",std:31.5,act:33.8,n:118,cv:6.1},
 {st:"ST03 折彎",std:29,act:28.2,n:121,cv:3.4},{st:"ST04 焊接",std:42,act:45.6,n:110,cv:8.7},
 {st:"ST05 研磨",std:24.5,act:23.9,n:122,cv:2.9},{st:"ST06 組裝",std:38,act:39.1,n:115,cv:5.5},
 {st:"ST07 檢測",std:22,act:22.6,n:124,cv:3.1},{st:"ST08 包裝",std:19.5,act:20.3,n:126,cv:2.4}
 ];
 var tr=rows.map(function(r){
  var dev=(r.act-r.std)/r.std*100,cvc=r.cv>7?"p-bad":r.cv>5?"p-warn":"p-ok";
  return '<tr><td><b class="mono">'+r.st+'</b></td><td class="mono">'+r.std.toFixed(1)+'s</td><td class="mono">'+r.act.toFixed(1)+'s</td><td style="width:150px">'+barcol(r.act/48*100,r.act>r.std?C.warn:C.blue)+'</td><td class="mono '+(dev>0?"dn":"up")+'">'+(dev>0?"+":"")+dev.toFixed(1)+'%</td><td class="mono">'+r.n.toLocaleString()+'</td><td><span class="pill '+cvc+'">'+(r.cv>7?"高變異 · ":r.cv>5?"注意 · ":"穩定 · ")+'CV '+r.cv.toFixed(1)+'%</span></td></tr>'
 }).join("");
 view.innerHTML=head("工序時間量測","以碼錶與影像量測各工站作業元素工時，建立標準工時基準（STD）與實測節拍對照。","量測樣本 976 筆 · 8 工站")+
 '<div class="grid g4" style="margin-bottom:14px">'+kpi("量測工站","8","站","done_all","up","覆蓋率 100%")+kpi("平均實測節拍","30.1","s","timer","dn","+3.4% vs STD")+kpi("最長工站","ST04","","priority_high","fl","焊接 45.6s")+kpi("量測穩定度","94.2","%","insights","up","CV≤5% 佔比")+'</div>'+
 '<div class="grid g23"><div class="card"><h3><span class="material-symbols-outlined">table_rows</span>各工站標準工時 vs 實測節拍</h3><div class="sub">STD＝標準工時；CV＝變異係數，越低越穩定</div><div style="overflow-x:auto"><table><thead><tr><th>工站</th><th>標準工時</th><th>實測節拍</th><th>節拍長度</th><th>偏差</th><th>樣本</th><th>穩定度</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
 '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>作業元素工時分解 · ST04</h3><div class="sub">焊接站各作業元素堆疊（秒）</div><div id="c0a" class="chart"></div></div></div>';
 void view.offsetHeight;
 mk("c0a",{chart:{type:"bar",height:300,stacked:true},plotOptions:{bar:{horizontal:true,barHeight:"46%",borderRadius:2}},series:[{name:"取件定位",data:[6.2]},{name:"點焊",data:[14.8]},{name:"連續焊",data:[16.1]},{name:"清渣檢查",data:[8.5]}],colors:["#93c5fd","#2563eb","#1e40af","#ea580c"],xaxis:{categories:["ST04 焊接"],labels:{style:{fontSize:"11px"}}},yaxis:{labels:{show:false}},dataLabels:{enabled:true,style:{fontSize:"11px",colors:["#fff"]}},legend:{position:"bottom",fontSize:"12px"},grid:{borderColor:C.line}})
}
function s1(){
 var stn=[{n:"ST01",v:27.4},{n:"ST02",v:33.8},{n:"ST03",v:28.2},{n:"ST04",v:45.6},{n:"ST05",v:23.9},{n:"ST06",v:39.1},{n:"ST07",v:22.6},{n:"ST08",v:20.3}];
 var bars=stn.map(function(s){var status=s.v>=44?"瓶頸":s.v>=38?"偏高":"正常",c=s.v>=44?C.bad:s.v>=38?C.warn:C.blue;return '<div class="stn" aria-label="'+s.n+' '+status+' '+s.v.toFixed(1)+' 秒"><div class="col"><div class="fill" style="height:'+Math.round(s.v/48*150)+'px;background:'+c+'"></div></div><div class="nm">'+s.n+'</div><div class="tm">'+status+' · '+s.v.toFixed(1)+'s</div></div>'}).join("");
 view.innerHTML=head("產線平衡率分析","計算目前產線平衡率、辨識瓶頸站與各站節拍差異；紅色代表逼近或超過目標節拍。","目標節拍 Takt = 48.0s")+
 '<div class="grid g4" style="margin-bottom:14px">'+kpi("產線平衡率","55.7","%","balance","dn","低於 85% 目標")+kpi("瓶頸站","ST04","","priority_high","fl","焊接 45.6s")+kpi("平衡損失","44.3","%","trending_down","dn","閒置工時佔比")+kpi("理論最少工站","5.2","站","group_work","up","目前 8 站")+'</div>'+
 '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">equalizer</span>各工站節拍負荷圖（Yamazumi）</h3><div class="sub">柱高＝該站節拍時間；紅色虛線為目標節拍 Takt 48.0s</div><div style="position:relative"><div style="position:absolute;left:0;right:0;top:8px;border-top:2px dashed #dc2626;z-index:2"></div><div style="position:absolute;right:2px;top:-8px;color:#991b1b;font-size:10.5px;font-weight:600">上限 · Takt 48s</div><div class="stnrow" style="margin-top:2px">'+bars+'</div></div><div class="legend"><span><i style="background:#2563eb"></i>正常</span><span><i style="background:#b45309"></i>偏高</span><span><i style="background:#dc2626"></i>瓶頸/逼近上限</span></div></div>'+
