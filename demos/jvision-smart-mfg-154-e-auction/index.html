<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>電子競標系統（e-Auction）｜Jvision 系統 Demo</title>
  <meta name="description" content="逆向拍賣競標室、即時報價排名、競標規則與決標評選" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --teal:#0d9488; --teal2:#2dd4bf; --ink:#0f2a28; --muted:#5b7371;
      --line:#dbe8e6; --bg:#f1f6f5; --card:#ffffff; --soft:#e8f5f3;
      --amber:#d97706; --red:#dc2626; --green:#16a34a; --blue:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .layout{display:flex;min-height:100vh;}
    .sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;}
    .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;}
    .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;}
    .brand .logo .material-symbols-outlined{font-size:24px;}
    .brand b{font-size:15px;display:block;line-height:1.3;}
    .brand span{font-size:11px;color:var(--muted);}
    .nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
    .navbtn{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:.15s;min-width:0;}
    .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
    .navbtn .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
    .navbtn .idx{margin-left:auto;font-size:11px;color:#a9c0bd;font-weight:700;flex:0 0 auto;}
    .navbtn:hover{background:var(--soft);color:var(--teal);}
    .navbtn.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.28);}
    .navbtn.on .idx{color:rgba(255,255,255,.7);}
    .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6;}
    .main{flex:1 1 auto;min-width:0;padding:24px 28px 44px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
    .topbar h1{font-size:20px;margin:0;font-weight:800;}
    .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--teal);padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;}
    .grid{display:grid;gap:16px;min-width:0;}
    .kpis{grid-template-columns:repeat(4,1fr);}
    .cards2{grid-template-columns:1fr 1fr;}
    .cards3{grid-template-columns:repeat(3,1fr);}
    .col-2-1{grid-template-columns:2fr 1fr;}
    .col-1-2{grid-template-columns:1fr 2fr;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
    .card h3{margin:0 0 4px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--teal);}
    .card .hint{font-size:11.5px;color:var(--muted);margin-bottom:12px;}
    .kpi{position:relative;overflow:hidden;}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;}
    .kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px;}
    .kpi .val small{font-size:14px;font-weight:700;color:var(--muted);}
    .kpi .dt{font-size:11.5px;margin-top:5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
    .up{color:var(--green);} .down{color:var(--red);} .warn{color:var(--amber);}
    .kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
    .kpi .ic .material-symbols-outlined{color:var(--teal);font-size:21px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-weight:700;}
    td{padding:10px;border-bottom:1px solid #eef4f3;white-space:nowrap;}
    tr:last-child td{border-bottom:none;}
    tbody tr:hover{background:#f7fbfa;}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
    .t-green{background:#dcfce7;color:#15803d;} .t-amber{background:#fef3c7;color:#b45309;}
    .t-red{background:#fee2e2;color:#b91c1c;} .t-blue{background:#dbeafe;color:#1d4ed8;}
    .t-gray{background:#eef2f1;color:#556;} .t-teal{background:var(--soft);color:var(--teal);}
    .bar{height:8px;border-radius:6px;background:#eef4f3;overflow:hidden;min-width:60px;}
    .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--teal2));}
    .chart{width:100%;height:280px;overflow:hidden;}
    .chart.sm{height:220px;}
    .rank-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;border:1px solid var(--line);margin-bottom:9px;min-width:0;}
    .rank-row.lead{border-color:var(--teal);background:var(--soft);}
    .rank-no{width:30px;height:30px;border-radius:9px;background:#eef4f3;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:0 0 auto;color:var(--muted);}
    .rank-row.lead .rank-no{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;}
    .rank-name{font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;}
    .rank-sub{font-size:11px;color:var(--muted);}
    .rank-bid{margin-left:auto;text-align:right;flex:0 0 auto;}
    .rank-bid b{font-size:16px;font-weight:900;}
    .rank-bid span{font-size:11px;color:var(--muted);display:block;}
    .timeline{position:relative;padding-left:8px;}
    .tl{display:flex;gap:13px;padding-bottom:16px;position:relative;}
    .tl:before{content:"";position:absolute;left:11px;top:26px;bottom:-2px;width:2px;background:var(--line);}
    .tl:last-child:before{display:none;}
    .tl-dot{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--teal2);flex:0 0 24px;z-index:1;display:flex;align-items:center;justify-content:center;}
    .tl-dot.done{background:var(--teal);border-color:var(--teal);}
    .tl-dot.done .material-symbols-outlined{color:#fff;font-size:13px;}
    .tl-body{min-width:0;}
    .tl-body b{font-size:13.5px;}
    .tl-body p{margin:3px 0 0;font-size:12px;color:var(--muted);}
    .tl-time{font-size:11px;color:var(--muted);font-weight:700;}
    .step{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;min-width:0;}
    .step .sn{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--teal);font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 26px;font-size:13px;}
    .step b{font-size:13px;} .step p{margin:3px 0 0;font-size:11.5px;color:var(--muted);}
    .field{margin-bottom:14px;}
    .field label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
    .field .inp{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;background:#fbfdfc;color:var(--ink);font-weight:600;}
    .field .inp.big{font-weight:800;font-size:15px;color:var(--teal);}
    .chips{display:flex;flex-wrap:wrap;gap:7px;}
    .chip{background:var(--soft);color:var(--teal);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
    .chip.off{background:#eef2f1;color:var(--muted);}
    .live-clock{background:linear-gradient(135deg,#0f2a28,#134e48);color:#fff;border-radius:16px;padding:20px;text-align:center;}
    .live-clock .lab{font-size:12px;color:var(--teal2);font-weight:700;letter-spacing:1px;}
    .live-clock .big{font-size:40px;font-weight:900;letter-spacing:1px;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
    .live-clock .st{font-size:12px;color:#a7d8d2;}
    .stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
    .stat-row:last-child{border-bottom:none;}
    .stat-row b{font-weight:900;}
    .prog-wrap{display:flex;align-items:center;gap:9px;min-width:0;}
    .prog-wrap span{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
    .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
    .score-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
    .sc{background:#fbfdfc;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;min-width:0;}
    .sc .n{font-size:10.5px;color:var(--muted);font-weight:700;}
    .sc .v{font-size:19px;font-weight:900;margin-top:3px;}
    .banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--soft),#fff);border:1px solid var(--teal2);border-radius:14px;padding:14px 16px;margin-bottom:16px;min-width:0;}
    .banner .material-symbols-outlined{font-size:26px;color:var(--teal);flex:0 0 auto;}
    .banner b{font-size:14px;} .banner p{margin:2px 0 0;font-size:12px;color:var(--muted);}
    .mnav{display:none;}
    @media(max-width:860px){
      .layout{flex-direction:column;}
      .sidebar{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;position:sticky;top:0;z-index:20;}
      .brand{border-bottom:none;margin-bottom:0;padding:0;flex:1 1 auto;}
      .nav{flex-direction:row;flex-wrap:wrap;width:100%;gap:6px;}
      .navbtn{width:auto;padding:9px 12px;}
      .navbtn .idx{display:none;}
      .side-foot{display:none;}
      .main{padding:18px 16px 40px;}
    }
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr;}
      .cards2,.cards3,.col-2-1,.col-1-2{grid-template-columns:1fr;}
      .score-grid{grid-template-columns:1fr 1fr;}
    }
    @media(max-width:560px){
      .navbtn .txt{display:none;}
      .navbtn{padding:9px 11px;}
      .topbar h1{font-size:17px;}
    }
    @media(max-width:430px){
      .kpis{grid-template-columns:1fr 1fr;}
      .score-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
        <div><b>e-Auction</b><span>電子競標系統</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        Jvision 智慧製造 Demo<br/>採購供應鏈 · SRM<br/>純前端展示 · 假資料
      </div>
    </aside>
    <main class="main">
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";

    var MODS = [
      {icon:"gavel",       name:"競標標的設定", sub:"建立採購標的、規格與底價"},
      {icon:"rule",        name:"競標規則引擎", sub:"逆向拍賣模式、延長規則與級距"},
      {icon:"groups",      name:"供應商邀標",   sub:"邀請、資格審查與參標確認"},
      {icon:"monitoring",  name:"即時競標室",   sub:"線上競價、即時排名與剩餘時間"},
      {icon:"fact_check",  name:"決標評選",     sub:"多維評分、降本試算與決標"},
      {icon:"trending_up", name:"競標成效分析", sub:"降本率、參標數與品類趨勢"}
    ];

    var charts = [];
    function disposeCharts(){
      for(var i=0;i<charts.length;i++){ try{ charts[i].dispose(); }catch(e){} }
      charts = [];
    }
    function mkChart(id, opt){
      var el = document.getElementById(id);
      if(!el) return;
      var c = echarts.init(el);
      c.setOption(opt);
      charts.push(c);
      window.addEventListener("resize", function(){ try{ c.resize(); }catch(e){} });
    }

    var TEAL="#0d9488", TEAL2="#2dd4bf", MUTED="#5b7371", LINE="#dbe8e6";

    function esc(s){ return String(s); }

    // ---------- screen builders ----------
    function head(t, s){
      return '<div class="topbar"><div><h1>'+t+'</h1><div class="sub">'+s+'</div></div>'+
             '<span class="pill"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>即時模擬資料</span></div>';
    }

    // Screen 0 — 競標標的設定
    function s0(){
      var lots = [
        {id:"LOT-2408-11", name:"CNC 鋁合金結構件 (A系列)", qty:"12,000 件", base:"NT$ 3,180,000", cat:"機構加工", due:"2026-09-20", st:"草稿", cls:"t-gray"},
        {id:"LOT-2408-12", name:"注塑外殼模具 3 套", qty:"3 套", base:"NT$ 5,400,000", cat:"模具治具", due:"2026-10-05", st:"審核中", cls:"t-amber"},
        {id:"LOT-2408-13", name:"PCBA SMT 代工月度", qty:"48,000 片", base:"NT$ 2,760,000", cat:"電子代工", due:"2026-09-30", st:"待發布", cls:"t-blue"},
        {id:"LOT-2408-14", name:"包裝耗材年度合約", qty:"年約", base:"NT$ 1,920,000", cat:"包裝耗材", due:"2026-12-31", st:"待發布", cls:"t-blue"},
        {id:"LOT-2408-15", name:"表面陽極處理服務", qty:"24,000 件", base:"NT$ 960,000", cat:"表面處理", due:"2026-09-18", st:"草稿", cls:"t-gray"}
      ];
      var rows="";
      for(var i=0;i<lots.length;i++){var l=lots[i];
        rows+='<tr><td><b>'+l.id+'</b></td><td>'+l.name+'</td><td>'+l.qty+'</td><td><b style="color:var(--teal)">'+l.base+'</b></td><td><span class="tag t-teal">'+l.cat+'</span></td><td>'+l.due+'</td><td><span class="tag '+l.cls+'">'+l.st+'</span></td></tr>';
      }
      return head("競標標的設定","建立採購標的、規格與底價，設定競標基本資訊")+
        '<div class="grid kpis" style="margin-bottom:16px">'+
          kpi("本月新增標的","18","件","up","+5","trending_up")+
          kpi("待發布標的","6","件","warn","審核中","pending_actions")+
          kpi("預估採購金額","14.9","M","up","NT$","payments")+
          kpi("平均底價節省目標","9.5","%","up","目標","savings")+
        '</div>'+
        '<div class="grid col-1-2">'+
          '<div class="card">'+
            '<h3><span class="material-symbols-outlined">edit_note</span>新增競標標的</h3>'+
            '<div class="hint">LOT-2408-16 · 逆向拍賣</div>'+
            '<div class="field"><label>標的名稱</label><div class="inp">SUS304 板金件年度採購</div></div>'+
            '<div class="field"><label>採購類別</label><div class="chips"><span class="chip">機構加工</span><span class="chip off">電子代工</span><span class="chip off">表面處理</span></div></div>'+
            '<div class="grid cards2" style="gap:12px">'+
              '<div class="field"><label>需求數量</label><div class="inp">36,000 件</div></div>'+
              '<div class="field"><label>參考底價</label><div class="inp big">NT$ 4,320,000</div></div>'+
            '</div>'+
            '<div class="field"><label>交期需求</label><div class="inp">2026-10-15</div></div>'+
            '<div class="field"><label>規格附件</label><div class="chips"><span class="chip"><span class="material-symbols-outlined" style="font-size:15px">description</span>圖面_Rev.C.pdf</span><span class="chip"><span class="material-symbols-outlined" style="font-size:15px">fact_check</span>檢驗規範.xlsx</span></div></div>'+
          '</div>'+
          '<div class="card">'+
            '<h3><span class="material-symbols-outlined">inventory_2</span>競標標的清單</h3>'+
            '<div class="hint">本季進行中與草稿標的</div>'+
            '<div style="overflow-x:auto"><table><thead><tr><th>標的編號</th><th>名稱</th><th>數量</th><th>參考底價</th><th>類別</th><th>交期</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
          '</div>'+
        '</div>';
    }

    // Screen 1 — 競標規則引擎
    function s1(){
      return head("競標規則引擎","設定逆向拍賣模式、起標價、最小降幅與自動延長規則")+
        '<div class="banner"><span class="material-symbols-outlined">rule</span><div><b>當前套用規則組：英式逆向拍賣（Rank-Visible）</b><p>供應商可見自身排名但不見對手報價，觸價自動延長 3 分鐘</p></div></div>'+
        '<div class="grid col-2-1">'+
          '<div class="card">'+
            '<h3><span class="material-symbols-outlined">tune</span>規則參數設定</h3>'+
            '<div class="hint">LOT-2408-13 · PCBA SMT 代工月度</div>'+
            '<div class="grid cards2" style="gap:12px">'+
              '<div class="field"><label>拍賣模式</label><div class="inp">英式逆向拍賣</div></div>'+
              '<div class="field"><label>排名可見性</label><div class="inp">僅顯示排名</div></div>'+
              '<div class="field"><label>起標價</label><div class="inp big">NT$ 2,760,000</div></div>'+
              '<div class="field"><label>保留底價</label><div class="inp big">NT$ 2,400,000</div></div>'+
              '<div class="field"><label>最小降幅</label><div class="inp">NT$ 5,000 / 0.2%</div></div>'+
              '<div class="field"><label>競標時長</label><div class="inp">60 分鐘</div></div>'+
            '</div>'+
            '<div class="field" style="margin-top:4px"><label>自動延長規則（末段觸價）</label>'+
              '<div class="chips"><span class="chip">末 3 分鐘觸價 +3 分</span><span class="chip">最多延長 5 次</span><span class="chip off">封閉式一次報價</span></div></div>'+
            '<div class="field"><label>資格門檻</label>'+
              '<div class="chips"><span class="chip">ISO 9001</span><span class="chip">近一年準交率≥95%</span><span class="chip">SCAR≤2</span></div></div>'+
          '</div>'+
          '<div class="card">'+
            '<h3><span class="material-symbols-outlined">timeline</span>延長機制示意</h3>'+
            '<div class="hint">末段觸價自動延長競標時間</div>'+
            '<div class="chart sm" id="c1a"></div>'+
            '<div class="legend"><span><i style="background:'+TEAL+'"></i>累積競標時長</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="grid cards2" style="margin-top:16px">'+
          '<div class="card"><h3><span class="material-symbols-outlined">library_books</span>規則範本庫</h3>'+

          '<div class="card"><h3><span class="material-symbols-outlined">shield</span>合規與稽核設定</h3>'+

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function buildNav(){
      var nav=document.getElementById("nav");
      var h="";
      for(var i=0;i<MODS.length;i++){
        h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="txt">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
      }
      nav.innerHTML=h;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); location.hash="v"+b.getAttribute("data-i"); }); })(btns[j]);
      }
    }

    function show(i){
      disposeCharts();
      var container=document.getElementById("screen");
      container.innerHTML=SCREENS[i]();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){
        btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i);
      }
      void container.offsetHeight;
      initCharts(i);
    }

    buildNav();
    window.show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
