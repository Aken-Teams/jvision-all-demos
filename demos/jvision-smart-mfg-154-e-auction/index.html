<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>電子競標系統（e-Auction）｜Jvision 系統 Demo</title>
  <meta name="description" content="逆向拍賣競標室、即時報價排名、競標規則與決標評選" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
:root{
  color-scheme:dark;
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#16A34A;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#FFFFFF;
  --blue:#60A5FA;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --teal:#16A34A;
  --teal2:#4ADE80;
  --bg:#020617;
  --card:#0E1223;
  --soft:#15251D;
  --amber:#FBBF24;
  --red:#F87171;
  --green:#4ADE80;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --shadow-card:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025);
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Inter","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:
    radial-gradient(circle at 88% -10%,rgba(22,163,74,.11),transparent 28rem),
    radial-gradient(circle at 15% 100%,rgba(30,41,59,.42),transparent 36rem),
    var(--color-background);
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
::selection{background:rgba(74,222,128,.28);color:#fff}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.layout{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:260px;
  height:100vh;
  flex:0 0 260px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
  padding:22px 16px;
  background:rgba(7,11,24,.96);
  border-right:1px solid var(--color-border);
  box-shadow:14px 0 40px rgba(0,0,0,.17);
  backdrop-filter:blur(16px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:13px;
  padding:4px 7px 19px;
  border-bottom:1px solid var(--color-border);
}
.brand .logo{
  position:relative;
  display:flex;
  width:42px;
  height:42px;
  flex:0 0 42px;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(74,222,128,.42);
  border-radius:11px;
  background:linear-gradient(145deg,#1CC44F,#0B742F);
  color:#fff;
  box-shadow:0 0 22px rgba(22,163,74,.22),inset 0 1px 0 rgba(255,255,255,.2);
}
.brand .logo:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 42%);
  pointer-events:none;
}
.brand .logo .material-symbols-outlined{font-size:23px;text-shadow:0 0 10px rgba(255,255,255,.35)}
.brand b{display:block;font-size:15px;line-height:1.35;letter-spacing:.01em}
.brand span:not(.material-symbols-outlined){font-size:11px;color:var(--color-muted-foreground)}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.navbtn{
  position:relative;
  display:flex;
  width:100%;
  min-width:0;
  min-height:44px;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  overflow:hidden;
  border:1px solid transparent;
  border-radius:9px;
  background:transparent;
  color:#AAB8CC;
  font-size:13px;
  font-weight:600;
  text-align:left;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto}
.navbtn .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .idx{
  margin-left:auto;
  flex:0 0 auto;
  color:#64748B;
  font-family:var(--mono);
  font-size:10px;
  font-weight:400;
  letter-spacing:.04em;
}
.navbtn:hover{border-color:#2D4938;background:#111D19;color:#E2FBEA;transform:translateX(2px)}
.navbtn.on{
  border-color:rgba(74,222,128,.48);
  background:linear-gradient(100deg,rgba(22,163,74,.27),rgba(22,163,74,.08));
  color:#fff;
  box-shadow:inset 3px 0 0 var(--color-accent),0 0 24px rgba(22,163,74,.1);
}
.navbtn.on .material-symbols-outlined{color:#86EFAC;text-shadow:0 0 10px rgba(74,222,128,.4)}
.navbtn.on .idx{color:#BBF7D0}
.navbtn:focus-visible,
button:focus-visible,
[tabindex]:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(255,255,255,.12);
}
.side-foot{
  margin-top:auto;
  padding:15px 8px 0;
  border-top:1px solid var(--color-border);
  color:#94A3B8;
  font-size:10.5px;
  line-height:1.7;
  letter-spacing:.02em;
}
.main{flex:1 1 auto;min-width:0;padding:28px clamp(18px,2.5vw,38px) 50px}
#screen{max-width:1540px;margin:0 auto}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(51,65,85,.78);
}
.topbar h1{
  margin:0;
  color:#fff;
  font-size:clamp(20px,2vw,27px);
  font-weight:800;
  letter-spacing:-.035em;
  line-height:1.2;
  text-shadow:0 0 10px rgba(255,255,255,.09);
}
.topbar .sub{margin-top:6px;color:#A7B4C7;font-size:12.5px;line-height:1.5}
.pill{
  display:inline-flex;
  min-height:34px;
  flex:0 0 auto;
  align-items:center;
  gap:6px;
  padding:7px 12px;
  border:1px solid rgba(74,222,128,.34);
  border-radius:999px;
  background:#0D2117;
  color:#86EFAC;
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
  box-shadow:0 0 18px rgba(22,163,74,.1);
}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 9px #22C55E}
.grid{display:grid;gap:14px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}
.col-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.col-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  position:relative;
  min-width:0;
  padding:17px;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:12px;
  background:linear-gradient(145deg,rgba(17,22,41,.98),rgba(10,14,29,.98));
  color:var(--color-card-foreground);
  box-shadow:var(--shadow-card);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.card:hover{border-color:#41536B;box-shadow:0 18px 40px rgba(0,0,0,.32),0 0 22px rgba(22,163,74,.035)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  color:#F8FAFC;
  font-size:13.5px;
  font-weight:750;
  line-height:1.4;
}
.card h3 .material-symbols-outlined{color:#4ADE80;font-size:18px;text-shadow:0 0 10px rgba(74,222,128,.24)}
.card .hint{margin-bottom:13px;color:#94A3B8;font-size:11px;line-height:1.5}
.kpi{min-height:126px;padding:17px 18px}
.kpi:after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:-45px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:rgba(22,163,74,.06);
  filter:blur(5px);
  pointer-events:none;
}
.kpi .lab{color:#A7B4C7;font-size:11.5px;font-weight:600}
.kpi .val{
  margin-top:8px;
  color:#fff;
  font-size:28px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;
  line-height:1.1;
}
.kpi .val small{color:#CBD5E1;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .dt{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:10.5px;font-weight:700}
.up{color:#86EFAC!important}.down{color:#FCA5A5!important}.warn{color:#FCD34D!important}
.kpi .ic{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  width:36px;
  height:36px;
  align-items:center;
  justify-content:center;
  border:1px solid #294838;
  border-radius:9px;
  background:#10251A;
}
.kpi .ic .material-symbols-outlined{color:#6EE7A0;font-size:19px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:9px 10px;
  border-top:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);
  background:#11172A;
  color:#B2C0D2;
  font-size:10px;
  font-weight:700;
  letter-spacing:.055em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:first-child{border-left:1px solid var(--color-border);border-radius:7px 0 0 7px}
th:last-child{border-right:1px solid var(--color-border);border-radius:0 7px 7px 0}
td{
  padding:10px;
  border-bottom:1px solid rgba(51,65,85,.55);
  color:#DCE5F1;
  line-height:1.35;
  white-space:nowrap;
}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td b{font-weight:700}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:rgba(51,65,85,.23)}
tbody tr:last-child td{border-bottom:none}
table td:first-child,
.tl-time,
.rank-sub,
.rank-bid,
.live-clock .big{
  font-variant-numeric:tabular-nums;
}
table td:first-child,.tl-time{font-family:var(--mono)}
.tag{
  display:inline-flex;
  min-height:22px;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-green{border-color:#27633C;background:#12331E;color:#86EFAC}
.t-amber{border-color:#6F511D;background:#36270C;color:#FCD34D}
.t-red{border-color:#783535;background:#3A171B;color:#FCA5A5}
.t-blue{border-color:#315A8E;background:#142C4B;color:#93C5FD}
.t-gray{border-color:#475569;background:#20283A;color:#CBD5E1}
.t-teal{border-color:#2C6541;background:#102C1C;color:#86EFAC}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:999px;background:#283247;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#15803D,#4ADE80);box-shadow:0 0 8px rgba(74,222,128,.25)}
.chart{width:100%;height:280px;overflow:hidden;border-radius:8px;background:rgba(2,6,23,.22)}
.chart.sm{height:220px}
.rank-row{
  display:flex;
  min-width:0;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  padding:11px 12px;
  border:1px solid var(--color-border);
  border-radius:9px;
  background:rgba(15,23,42,.56);
  transition:border-color .2s ease,background-color .2s ease,transform .2s ease;
}
.rank-row:hover{border-color:#52647D;background:#121C32;transform:translateX(2px)}
.rank-row.lead{border-color:#2F7A49;background:linear-gradient(90deg,rgba(22,163,74,.16),rgba(22,163,74,.035));box-shadow:inset 3px 0 0 #22C55E}
.rank-no{display:flex;width:30px;height:30px;flex:0 0 30px;align-items:center;justify-content:center;border:1px solid #3B465B;border-radius:7px;background:#20283A;color:#CBD5E1;font-family:var(--mono);font-size:12px;font-weight:700}
.rank-row.lead .rank-no{border-color:#4ADE80;background:#16A34A;color:#fff;box-shadow:0 0 13px rgba(22,163,74,.24)}
.rank-name{min-width:0;overflow:hidden;color:#F1F5F9;font-size:12.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{margin-top:3px;color:#94A3B8;font-family:var(--mono);font-size:9.5px}
.rank-bid{margin-left:auto;flex:0 0 auto;text-align:right}
.rank-bid b{color:#fff;font-family:var(--mono);font-size:14px;font-weight:700}
.rank-bid span{display:block;margin-top:3px;color:#86EFAC;font-size:10px}
.timeline{position:relative;padding-left:7px}
.tl{position:relative;display:flex;gap:12px;padding-bottom:15px}
.tl:before{content:"";position:absolute;top:25px;bottom:-1px;left:10px;width:1px;background:#3A485F}
.tl:last-child:before{display:none}
.tl-dot{z-index:1;display:flex;width:22px;height:22px;flex:0 0 22px;align-items:center;justify-content:center;border:2px solid #64748B;border-radius:50%;background:#0E1223}
.tl-dot.done{border-color:#4ADE80;background:#16833C}
.tl-dot.done .material-symbols-outlined{color:#fff;font-size:12px}
.tl-body{min-width:0}.tl-body b{font-size:12.5px}.tl-body p{margin:3px 0 0;color:#A7B4C7;font-size:11px;line-height:1.45}.tl-time{color:#94A3B8;font-size:9.5px;font-weight:400}
.step{
  display:flex;
  min-width:0;
  align-items:flex-start;
  gap:10px;
  padding:10px;
  border:1px solid var(--color-border);
  border-radius:9px;
  background:#0B1120;
}
.step .sn{display:flex;width:25px;height:25px;flex:0 0 25px;align-items:center;justify-content:center;border:1px solid #315F40;border-radius:7px;background:#10291B;color:#86EFAC;font-family:var(--mono);font-size:11px;font-weight:700}
.step b{font-size:12px}.step p{margin:3px 0 0;color:#9EADBF;font-size:10.5px;line-height:1.45}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:5px;color:#AAB8CA;font-size:10.5px;font-weight:700;letter-spacing:.015em}
.field .inp{
  min-height:38px;
  padding:9px 10px;
  border:1px solid #3B4A61;
  border-radius:8px;
  background:#090F1E;
  color:#E8EEF7;
  font-size:12px;
  font-weight:600;
  line-height:1.45;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.22);
}
.field .inp.big{color:#86EFAC;font-family:var(--mono);font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;min-height:30px;align-items:center;gap:5px;padding:6px 9px;border:1px solid #326A47;border-radius:7px;background:#102B1C;color:#9AF1B6;font-size:10.5px;font-weight:700}
.chip.off{border-color:#3C475C;background:#20283A;color:#B6C2D1}
.live-clock{
  position:relative;
  overflow:hidden;
  padding:21px;
  border:1px solid rgba(74,222,128,.4);
  border-radius:12px;
  background:linear-gradient(145deg,#0B2115,#07130E 62%,#0B1120);
  color:#fff;
  text-align:center;
  box-shadow:0 14px 32px rgba(0,0,0,.3),0 0 28px rgba(22,163,74,.1),inset 0 1px 0 rgba(255,255,255,.04);
}
.live-clock:after{content:"";position:absolute;right:-45px;bottom:-55px;width:150px;height:150px;border-radius:50%;background:rgba(22,163,74,.11);filter:blur(10px)}
.live-clock .lab{position:relative;z-index:1;color:#86EFAC;font-size:10.5px;font-weight:700;letter-spacing:.13em}
.live-clock .big{position:relative;z-index:1;margin:7px 0 4px;font-family:var(--mono);font-size:clamp(34px,4vw,44px);font-weight:400;letter-spacing:.03em;text-shadow:0 0 10px rgba(74,222,128,.2)}
.live-clock .st{position:relative;z-index:1;color:#B7C7BE;font-size:10.5px}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #354156;color:#C7D1DE;font-size:11.5px}
.stat-row:last-child{border-bottom:none}.stat-row b{color:#F8FAFC;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.prog-wrap{display:flex;min-width:0;align-items:center;gap:8px}.prog-wrap span{color:#C1CCDA;font-family:var(--mono);font-size:10px;font-weight:400;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;color:#AAB8C9;font-size:10.5px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border:1px solid rgba(255,255,255,.28);border-radius:2px;vertical-align:middle}
.score-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.sc{min-width:0;padding:10px 7px;border:1px solid var(--color-border);border-radius:8px;background:#0A1020;text-align:center}.sc .n{color:#9EACBE;font-size:9.5px;font-weight:700}.sc .v{margin-top:4px;font-family:var(--mono);font-size:17px;font-weight:400}
.banner{
  display:flex;
  min-width:0;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  padding:13px 15px;
  border:1px solid #326A47;
  border-radius:10px;
  background:linear-gradient(100deg,rgba(22,163,74,.15),rgba(14,18,35,.8));
  box-shadow:inset 3px 0 0 #22C55E;
}
.banner .material-symbols-outlined{flex:0 0 auto;color:#6EE7A0;font-size:23px;text-shadow:0 0 10px rgba(74,222,128,.2)}
.banner b{color:#F1F5F9;font-size:12.5px}.banner p{margin:3px 0 0;color:#AAB8C9;font-size:10.5px;line-height:1.45}
.mnav{display:none}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col-2-1,.col-1-2{grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr)}
}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{position:sticky;top:0;width:auto;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 13px;gap:7px;background:rgba(4,8,18,.97)}
  .brand{flex:1 1 auto;margin:0;padding:0;border:0}.brand .logo{width:36px;height:36px;flex-basis:36px}.brand b{font-size:13px}
  .nav{width:100%;flex-direction:row;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .navbtn{width:auto;min-width:max-content;min-height:42px;padding:9px 11px}.navbtn:hover{transform:none}.navbtn .idx{display:none}
  .side-foot{display:none}.main{padding:18px 14px 40px}
  .col-2-1,.col-1-2{grid-template-columns:1fr}
}
@media(max-width:680px){
  .topbar{align-items:flex-start}.topbar .sub{max-width:34ch}.cards2,.cards3{grid-template-columns:1fr}.score-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:14px}.chart{height:250px}
}
@media(max-width:480px){
  .main{padding:15px 11px 34px}.topbar{gap:10px;margin-bottom:14px;padding-bottom:13px}.topbar h1{font-size:19px}.topbar .sub{font-size:11px}.pill{padding:7px 9px;font-size:9.5px}
  .navbtn .txt{display:none}.navbtn{min-width:42px;justify-content:center;padding:9px}.navbtn .material-symbols-outlined{font-size:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi{min-height:112px;padding:14px}.kpi .val{font-size:23px}.kpi .ic{width:31px;height:31px}.kpi .ic .material-symbols-outlined{font-size:17px}

      ];

        '<div class="grid kpis" style="margin-bottom:16px">'+
          kpi("成交金額","2.95","M","up","NT$","paid")+

        '</div>'+
        '<div class="grid col-2-1">'+
          '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>加權評分明細</h3>'+
            '<div class="hint">價格 40 / 品質 35 / 交期 15 / ESG 10</div>'+
            '<div style="overflow-x:auto"><table><thead><tr><th>供應商</th><th>報價</th><th>價格(40)</th><th>品質(35)</th><th>交期(15)</th><th>ESG(10)</th><th>綜合分</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
          '</div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>評分權重占比</h3>'+
            '<div class="hint">得標者各構面貢獻</div>'+
            '<div class="chart sm" id="c4a"></div>'+
          '</div>'+
        '</div>'+
        '<div class="grid cards2" style="margin-top:16px">'+
          '<div class="card"><h3><span class="material-symbols-outlined">scoreboard</span>得標者評分卡</h3>'+
            '<div class="hint">泰豐金屬製造</div>'+
            '<div class="score-grid" style="margin-top:6px">'+
              scCard("價格分","38.0")+scCard("品質分","35.0")+scCard("交期分","14.0")+scCard("ESG 分","8.0")+
            '</div>'+
            '<div class="stat-row" style="margin-top:12px"><span>準時交貨率（近一年）</span><b>98.6%</b></div>'+
            '<div class="stat-row"><span>進料合格率</span><b>99.2%</b></div>'+
            '<div class="stat-row"><span>ESG 永續評等</span><b>B+</b></div>'+
          '</div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">assignment_turned_in</span>決標與簽約流程</h3>'+
            '<div class="hint">決標後自動推進至合約管理</div>'+ awardSteps() +'</div>'+

    }
    function scCard(n,v){ return '<div class="sc"><div class="n">'+n+'</div><div class="v" style="color:var(--teal)">'+v+'</div></div>'; }
    function awardSteps(){
      var st=[
        {n:"競標室關閉、鎖定最終報價",done:true},
        {n:"多維評分試算與主管覆核",done:true},
        {n:"填寫決標理由並電子簽核",done:false},
        {n:"產生採購合約與 PO 下單",done:false},
        {n:"同步 SRM 與合約管理系統",done:false}
      ];
      var h="";
      for(var i=0;i<st.length;i++){var x=st[i];
        h+='<div class="step" style="margin-bottom:9px"><div class="sn" style="'+(x.done?'background:var(--teal);color:#fff':'')+'">'+(x.done?'✓':(i+1))+'</div><div style="flex:1;min-width:0"><b>'+x.n+'</b></div><span class="tag '+(x.done?'t-green':'t-gray')+'" style="align-self:center">'+(x.done?'完成':'待辦')+'</span></div>';
      }
      return h;
    }

    // Screen 5 — 競標成效分析

    function perfTable(){
      var s=[

    // ---------- shared kpi ----------
    function kpi(lab,val,unit,cls,dt,ic){
      var d = dt ? '<div class="dt '+(cls||'')+'">'+(cls==='up'?'<span class="material-symbols-outlined" style="font-size:14px">arrow_upward</span>':cls==='down'?'<span class="material-symbols-outlined" style="font-size:14px">arrow_downward</span>':'')+dt+'</div>' : '';
      return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
        '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+d+'</div>';
    }

    // ---------- chart initializers ----------
    var GRID={left:44,right:16,top:24,bottom:28};
    function axisText(){ return {color:MUTED,fontSize:11}; }

      if(i===1){
        mkChart("c1a",{
          grid:GRID, tooltip:{trigger:"axis"},

          yAxis:{type:"value",name:"分鐘",nameTextStyle:{color:MUTED},axisLabel:axisText(),splitLine:{lineStyle:{color:LINE}}},
          series:[{type:"line",data:[0,15,30,45,53,60,66],smooth:true,areaStyle:{color:"rgba(13,148,136,.15)"},lineStyle:{color:TEAL,width:3},itemStyle:{color:TEAL}}]
        });
      } else if(i===2){

          tooltip:{}, legend:{bottom:0,textStyle:{color:MUTED,fontSize:11}},

          ]}]

      } else if(i===3){

          yAxis:{type:"value",name:"NT$ 千",nameTextStyle:{color:MUTED},min:2900,max:3200,axisLabel:axisText(),splitLine:{lineStyle:{color:LINE}}},
          series:[
            {name:"O豐金屬",type:"line",smooth:true,data:[3170,3120,3060,3010,2990,2968,2946],lineStyle:{color:TEAL,width:3},itemStyle:{color:TEAL}},
            {name:"O程精密",type:"line",smooth:true,data:[3180,3140,3080,3040,3010,2990,2968],lineStyle:{color:TEAL2,width:2},itemStyle:{color:TEAL2}},
            {name:"聯O模具",type:"line",smooth:true,data:[3175,3150,3110,3070,3050,3035,3024],lineStyle:{color:"#2563eb",width:2},itemStyle:{color:"#2563eb"}},
            {name:"新O電子",type:"line",smooth:true,data:[3178,3160,3140,3120,3105,3095,3090],lineStyle:{color:"#d97706",width:2},itemStyle:{color:"#d97706"}},
            {name:"參考底價",type:"line",data:[3180,3180,3180,3180,3180,3180,3180],lineStyle:{color:MUTED,width:1.5,type:"dashed"},itemStyle:{color:MUTED},symbol:"none"}
          ]
        });
      } else if(i===4){
        mkChart("c4a",{
          tooltip:{trigger:"item"}, legend:{bottom:0,textStyle:{color:MUTED,fontSize:11}},
          series:[{type:"pie",radius:["45%","70%"],center:["50%","44%"],avoidLabelOverlap:true,
            itemStyle:{borderColor:"#fff",borderWidth:2},
            label:{show:true,formatter:"{b}\n{d}%",color:MUTED,fontSize:11},
            data:[
              {value:38,name:"價格",itemStyle:{color:TEAL}},
              {value:35,name:"品質",itemStyle:{color:TEAL2}},
              {value:14,name:"交期",itemStyle:{color:"#2563eb"}},
              {value:8,name:"ESG",itemStyle:{color:"#d97706"}}
            ]}]
        });
      } else if(i===5){
        mkChart("c5a",{
          grid:GRID, tooltip:{trigger:"axis"},
          xAxis:{type:"category",data:["機構加工","電子代工","模具治具","表面處理","包裝耗材","原物料"],axisLabel:{color:MUTED,fontSize:10,interval:0,rotate:20},axisLine:{lineStyle:{color:LINE}}},
          yAxis:{type:"value",name:"%",nameTextStyle:{color:MUTED},axisLabel:axisText(),splitLine:{lineStyle:{color:LINE}}},
          series:[{type:"bar",data:[10.2,9.4,8.1,7.6,6.8,5.9],barWidth:"48%",
            itemStyle:{borderRadius:[6,6,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:TEAL2},{offset:1,color:TEAL}])}}]
        });
        mkChart("c5b",{
          grid:{left:44,right:44,top:24,bottom:28}, tooltip:{trigger:"axis"},

          xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLabel:axisText(),axisLine:{lineStyle:{color:LINE}}},

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function buildNav(){
      var nav=document.getElementById("nav");
      var h="";
      for(var i=0;i<MODS.length;i++){
        h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="txt">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
      }
      nav.innerHTML=h;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); location.hash="v"+b.getAttribute("data-i"); }); })(btns[j]);
      }
    }

    function show(i){
      disposeCharts();
      var container=document.getElementById("screen");
      container.innerHTML=SCREENS[i]();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){
        btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i);
      }
      void container.offsetHeight;
      initCharts(i);
    }

    buildNav();
    window.show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
