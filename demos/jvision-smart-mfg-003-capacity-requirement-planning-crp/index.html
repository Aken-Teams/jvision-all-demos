<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產能規劃系統 CRP｜Jvision 系統 Demo</title>
<meta name="description" content="產能負荷試算、資源缺口分析、因應方案模擬與決策輸出的產能規劃平台">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;--color-on-primary:#FFF;--color-secondary:#3B82F6;
  --color-on-secondary:#000;--color-accent:#EA580C;--color-on-accent:#000;
  --color-background:#F8FAFC;--color-foreground:#1E293B;--color-card:#FFF;
  --color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
  --color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFF;
  --color-ring:#2563EB;--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
  --warning:#B45309;--success:#047857;--violet:#7C3AED;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.shell{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#111827;color:#FFF;border-right:4px solid var(--ink);z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:22px 18px;border-bottom:2px solid #FFF}
.logo{width:44px;height:44px;display:grid;place-items:center;background:var(--color-accent);border:2px solid #FFF;box-shadow:5px 5px 0 #2563EB}
.logo svg{width:25px;height:25px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;margin-top:3px;color:#CBD5E1;font:500 10px/1.3 "Fira Code",monospace}
.navlab{padding:20px 18px 8px;color:#94A3B8;font:600 10px/1 "Fira Code",monospace;letter-spacing:.16em}
nav{display:flex;flex-direction:column}
.navbtn{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;width:100%;min-height:50px;padding:11px 16px;color:#E2E8F0;background:transparent;border:0;border-bottom:1px solid #334155;text-align:left;transition:background-color .18s,color .18s}
.navbtn svg{width:20px;height:20px}
.navbtn .idx{color:#94A3B8;font:600 10px "Fira Code",monospace}
.navbtn:hover{background:#1E293B;color:#FFF}
.navbtn.on{background:var(--blue);color:#FFF;box-shadow:inset 6px 0 0 var(--color-accent)}
.navbtn.on .idx{color:#FFF}
.foot{margin-top:auto;padding:17px 18px;border-top:2px solid #FFF;color:#CBD5E1;font-size:11px;line-height:1.65}
.foot b{color:#FFF;font-family:"Fira Code",monospace}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;min-height:84px;padding:14px 28px;background:rgba(248,250,252,.96);border-bottom:3px solid var(--ink);backdrop-filter:blur(8px)}
.topbar:before{content:"CRP / OPERATIONS";align-self:stretch;display:grid;place-items:center;padding-right:18px;border-right:2px solid var(--ink);color:var(--blue);font:700 10px "Fira Code",monospace;letter-spacing:.12em}
.htitle{min-width:0}
h1{margin:0;font-size:22px;line-height:1.15;font-weight:700}
.sub{margin-top:5px;color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip,.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;font-weight:700}
.chip{padding:7px 10px;background:#FFF;color:var(--ink);font-size:11px}
.chip svg{width:15px;height:15px}
.chip.live{background:#ECFDF5;color:#065F46}
.dot{width:8px;height:8px;background:#047857;border:1px solid currentColor}
.wrap{width:100%;max-width:1500px;padding:24px 28px 48px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3,.scn{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2u{grid-template-columns:1.4fr 1fr}
.g2v{grid-template-columns:1fr 1.5fr}
.card,.kpi,.scnc{min-width:0;background:var(--color-card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--color-muted)}
.card{padding:17px}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.ch svg{width:20px;height:20px;color:var(--blue);flex:none}
.ch h3{margin:0;font-size:14px;font-weight:700}
.tag{margin-left:auto;color:var(--muted);font:600 10px "Fira Code",monospace}
.kpi{position:relative;padding:15px 16px 16px;border-top:7px solid var(--blue)}
.kpi:nth-child(even){border-top-color:var(--color-accent)}
.kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600}
.kl svg,.kd svg{width:17px;height:17px}
.kv{margin-top:12px;font:700 28px/1 "Fira Code",monospace;letter-spacing:-.05em}
.kv small{margin-left:4px;color:var(--muted);font:600 12px "Fira Sans",sans-serif;letter-spacing:0}
.kd{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:11px;font-weight:700}
.up{color:var(--success)}.down{color:var(--color-destructive)}.flat{color:var(--muted)}
.echart{width:100%;height:278px}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:550px;border-collapse:collapse;font-size:12px}
th,td{padding:10px 11px;border:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--ink);color:#FFF;font:600 10px "Fira Code",monospace;letter-spacing:.025em}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#EFF6FF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num,td code,.mono{font-family:"Fira Code",monospace}
.bar{height:12px;min-width:72px;background:#CBD5E1;border:1px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.warn i{background:#D97706}.bar.bad i{background:var(--color-destructive)}
.pill{padding:3px 7px;font-size:10px}
.pill:before{content:"";width:6px;height:6px;background:currentColor}
.pill.ok{background:#ECFDF5;color:#065F46}.pill.warn{background:#FFFBEB;color:#92400E}
.pill.bad{background:#FEF2F2;color:#991B1B}.pill.info{background:#EFF6FF;color:#1D4ED8}
.pill.mut{background:#F1F5F9;color:#475569}
.matrix{min-width:650px;border-spacing:4px;border-collapse:separate}
.matrix th{text-align:center}
.matrix td{height:46px;padding:0;text-align:center;border:2px solid var(--ink);font:700 12px "Fira Code",monospace}
.matrix .mrowh{text-align:left;background:var(--ink)!important;color:#FFF;padding:9px!important}
.cellv{height:42px;display:grid;place-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:11px;font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;border:1px solid var(--ink);vertical-align:-2px}
.sub2{margin:-5px 0 15px;color:var(--muted);font-size:12px;line-height:1.6}
.scn{display:grid;gap:14px}
.scnc{position:relative;padding:17px}
.scnc.best{border:4px solid var(--blue);box-shadow:7px 7px 0 var(--color-accent)}
.rk{position:absolute;right:10px;top:-12px;padding:4px 8px;background:var(--ink);color:#FFF;border:2px solid #FFF;font:600 10px "Fira Code",monospace}
.rk svg{width:12px;height:12px;vertical-align:-2px}
.scnc.best .rk{background:var(--color-accent);color:#FFF}
.scnc h4{margin:0 0 4px;font-size:15px}
.stag{margin-bottom:12px;color:var(--muted);font-size:11px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #94A3B8;font-size:12px}
.mrow:last-child{border:0}.mrow span:first-child{color:var(--muted)}.mrow b{font-family:"Fira Code",monospace}
.gantt{min-width:760px}
.gaxis,.grow{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:10px}
.gaxis{margin-bottom:7px}.grow{margin-bottom:8px}
.glab{overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);font:600 10px "Fira Code",monospace;color:var(--muted)}
.days div{text-align:center}
.gtrack{position:relative;height:28px;border:1px solid var(--ink);background:repeating-linear-gradient(90deg,#FFF 0,#FFF calc(14.285% - 1px),var(--line) calc(14.285% - 1px),var(--line) 14.285%)}
.gbar{position:absolute;top:3px;height:20px;overflow:hidden;padding:3px 7px;color:#FFF;border:1px solid var(--ink);font:600 9px "Fira Code",monospace;white-space:nowrap}
.steps{display:flex}
.step{position:relative;flex:1;min-width:130px;padding:0 10px 7px;border-top:3px solid var(--ink)}
.sn{width:31px;height:31px;margin-top:-17px;margin-bottom:9px;display:grid;place-items:center;background:var(--blue);color:#FFF;border:2px solid var(--ink);font:700 12px "Fira Code",monospace}
.st{font-size:12px;font-weight:700}.sd{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.4}
.log{border-left:4px solid var(--ink);padding-left:18px}
.li{position:relative;padding:0 0 16px}
.li:before{content:"";position:absolute;left:-26px;top:2px;width:11px;height:11px;background:var(--blue);border:2px solid #FFF;box-shadow:0 0 0 2px var(--ink)}
.li.warn:before{background:#D97706}
.lt{font-size:12px;font-weight:700}.lm{margin-top:3px;color:var(--muted);font-size:11px}.ltime{margin-top:4px;color:var(--muted);font:500 10px "Fira Code",monospace}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media(max-width:1024px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2u,.g2v{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}.side{position:relative;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{padding:14px}.navlab,.foot{display:none}nav{display:grid;grid-template-columns:repeat(3,1fr)}
  .navbtn{grid-template-columns:22px 1fr;border-right:1px solid #334155;padding:10px}.navbtn .idx{display:none}
  .topbar{top:0;padding:13px 16px}.topbar:before{display:none}.wrap{padding:18px 16px 38px}
  .g2,.g3,.scn{grid-template-columns:1fr}.steps{overflow-x:auto;padding-top:16px}
}
@media(max-width:480px){
  nav{grid-template-columns:repeat(2,1fr)}.navbtn{min-height:48px;font-size:11px}
  .topbar{align-items:flex-start;flex-direction:column;gap:9px}.chips{margin-left:0}
  h1{font-size:19px}.g4{grid-template-columns:1fr}.kv{font-size:26px}.card{padding:13px}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand">
    <span class="logo" id="brandIcon"></span>
    <div><b>產能規劃 CRP</b><small>CAPACITY REQUIREMENT<br>PLANNING</small></div>
  </div>
  <div class="navlab">作業流程模組 / MODULES</div>
  <nav id="nav" aria-label="主要功能"></nav>
  <div class="foot">資料來源同步：<b>ERP · APS · MES</b><br>規劃週期：<b>2026-W29 ~ W34</b><br>Jvision Demo · 純前端假資料</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="htitle"><h1 id="tt">需求預測輸入</h1><div class="sub" id="ts">彙整接單與預測，展開為各工作中心產能需求</div></div>
    <div class="chips"><span class="chip live"><span class="dot"></span>即時試算</span><span class="chip" id="factoryChip"></span></div>
  </header>
  <div class="wrap"><div id="screen" class="reveal"></div></div>
</main>
</div>
<script>
(function(){

var icons={
 factory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21V9l6 3V8l6 4V4h6v17Z"/><path d="M7 21v-3m5 3v-3m5 3v-3"/></svg>',

 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4Zm0 5h16M4 15h16M9 4v16m6-16v16"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1m-1 6h1m-1 6h1"/></svg>',
 route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h3a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 15 5-5 4 4 5-7"/><path d="M15 7h4v4"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 9 5 5 4-4 5 7"/><path d="M15 17h4v-4"/></svg>',
 flat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-4-4 4 4-4 4"/></svg>',

};
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function dispose(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
function grid(l,r,t,b){return{left:l||42,right:r||18,top:t||26,bottom:b||40,containLabel:true}}
function axis(){return{axisLine:{lineStyle:{color:C.ink,width:1}},axisTick:{show:false},axisLabel:{color:C.muted,fontSize:10,fontFamily:"Fira Code"},splitLine:{lineStyle:{color:C.line,type:"dashed"}}}}
function chartText(){return{textStyle:{fontFamily:"Fira Sans",color:C.ink}}}
function ch(icon,title,tag){return'<div class="ch">'+icons[icon]+'<h3>'+title+'</h3>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>'}
function kpi(icon,label,val,unit,delta,dir){
 return'<div class="kpi"><div class="kl">'+icons[icon]+esc(label)+'</div><div class="kv">'+esc(val)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div><div class="kd '+dir+'">'+icons[dir]+esc(delta)+'</div></div>'
}
function pill(text,kind){return'<span class="pill '+kind+'">'+esc(text)+'</span>'}
function mount(html){var s=document.getElementById("screen");s.classList.remove("reveal");s.innerHTML=html;void s.offsetWidth;s.classList.add("reveal")}
var MODS=[

 {icon:"gauge",name:"產能負荷試算",sub:"工作中心負荷率對比可用產能，找出過載時段"},

 {icon:"check",name:"決策輸出稽核",sub:"產能決策核准、回寫與稽核追蹤"}
];
function s0(){
 var rows=[["CNC 加工","OD-2291","閥體 A32",4200,.42,1820,"高","07-25"],["沖壓成型","OD-2288","支架 B14",9800,.14,1360,"中","07-28"],["表面處理","OD-2295","外殼 C08",6100,.16,980,"高","07-24"],["組裝線 1","OD-2301","總成 D21",3600,.62,2240,"高","07-26"],["焊接工段","OD-2277","框架 E05",2400,.32,760,"低","08-02"],["品檢包裝","OD-2299","總成 D21",3600,.31,1120,"中","07-27"]];
 var h='<div class="grid g4">'+kpi("list","本週工單需求","46","張","+7 vs 上週","up")+kpi("clock","總產能需求","8,280","工時","+12.4%","down")+kpi("alert","急單/插單","9","張","佔比 19.6%","flat")+kpi("calendar","最早承諾交期","07-24","","距今 3 天","flat")+'</div>';
