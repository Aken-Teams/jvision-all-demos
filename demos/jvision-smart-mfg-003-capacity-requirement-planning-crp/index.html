<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>產能規劃系統 CRP｜Jvision 系統 Demo</title>
  <meta name="description" content="產能負荷試算、資源缺口分析、因應方案模擬與決策輸出的產能規劃平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#0d9488; --accent2:#2dd4bf; --accent-d:#0f766e;
      --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2a27; --muted:#5c7370;
      --line:#e2ebe9; --soft:#f5faf9; --warn:#d97706; --bad:#dc2626; --good:#0d9488;
      --shadow:0 1px 2px rgba(13,148,136,.06),0 8px 24px rgba(13,148,136,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    .shell{display:flex; min-height:100vh; align-items:stretch}
    /* sidebar */
    .side{
      width:246px; flex:none; background:var(--panel); border-right:1px solid var(--line);
      display:flex; flex-direction:column; padding:18px 14px; gap:6px; position:sticky; top:0; height:100vh;
    }
    .brand{display:flex; gap:11px; align-items:center; padding:6px 8px 14px}
    .brand .logo{
      width:40px;height:40px;flex:none;border-radius:11px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.35);
    }
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand b{font-size:15px;font-weight:800;letter-spacing:.2px;line-height:1.2;display:block}
    .brand span{font-size:11px;color:var(--muted);font-weight:600}
    .navlab{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);padding:10px 10px 4px;text-transform:uppercase}
    nav{display:flex; flex-direction:column; gap:4px}
    .navbtn{
      display:flex; align-items:center; gap:11px; padding:10px 12px; border:none; cursor:pointer;
      background:transparent; border-radius:11px; color:var(--muted); font-family:inherit;
      font-size:13.5px; font-weight:700; text-align:left; width:100%; transition:.16s; min-width:0;
    }
    .navbtn .material-symbols-outlined{font-size:21px; flex:none}
    .navbtn .txt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .navbtn .idx{margin-left:auto; font-size:10.5px; font-weight:800; opacity:.5; flex:none}
    .navbtn:hover{background:var(--soft); color:var(--accent-d)}
    .navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent-d)); color:#fff; box-shadow:0 6px 16px rgba(13,148,136,.28)}
    .navbtn.on .idx{opacity:.75}
    .side .foot{margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); line-height:1.6}
    .side .foot b{color:var(--accent-d)}
    /* main */
    .main{flex:1; min-width:0; display:flex; flex-direction:column}
    .topbar{
      display:flex; align-items:center; gap:14px; padding:16px 26px; background:var(--panel);
      border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; flex-wrap:wrap;
    }
    .topbar .htitle{min-width:0}
    .topbar h1{margin:0; font-size:18px; font-weight:800; letter-spacing:.2px}
    .topbar .sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px}
    .chips{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
    .chip{
      display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
      background:var(--soft); border:1px solid var(--line); font-size:12px; font-weight:700; color:var(--accent-d);
    }
    .chip .material-symbols-outlined{font-size:16px}
    .chip.live{background:linear-gradient(135deg,#ecfdf5,#d1fae5); border-color:#a7f3d0}
    .chip.live .dot{width:8px;height:8px;border-radius:50%;background:var(--accent); animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    .wrap{padding:22px 26px 40px; max-width:1240px; width:100%}
    /* generic */
    .grid{display:grid; gap:16px}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g2u{grid-template-columns:1.4fr 1fr}
    .g2v{grid-template-columns:1fr 1.5fr}
    .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); min-width:0}
    .card.pad0{padding:0; overflow:hidden}
    .ch{display:flex; align-items:center; gap:9px; margin-bottom:14px; min-width:0}
    .ch .material-symbols-outlined{font-size:20px; color:var(--accent); flex:none}
    .ch h3{margin:0; font-size:14.5px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis}
    .ch .tag{margin-left:auto; font-size:11px; font-weight:700; color:var(--muted); flex:none}
    .kpi{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 17px; box-shadow:var(--shadow); min-width:0; position:relative; overflow:hidden}
    .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(var(--accent),var(--accent2))}
    .kpi .kl{font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
    .kpi .kl .material-symbols-outlined{font-size:17px; color:var(--accent)}
    .kpi .kv{font-size:27px; font-weight:900; margin-top:8px; letter-spacing:-.5px; line-height:1}
    .kpi .kv small{font-size:13px; font-weight:700; color:var(--muted); margin-left:3px}
    .kpi .kd{font-size:11.5px; font-weight:700; margin-top:7px; display:flex; align-items:center; gap:4px}
    .kpi .kd .material-symbols-outlined{font-size:15px}
    .up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
    .echart{width:100%; height:280px}
    table{width:100%; border-collapse:collapse; font-size:13px; min-width:520px}
    th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
    th{font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; background:var(--soft)}
    tbody tr:hover{background:var(--soft)}
    td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
    .bar{height:8px; border-radius:6px; background:var(--line); overflow:hidden; min-width:64px}
    .bar > i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .bar.warn > i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .bar.bad > i{background:linear-gradient(90deg,#ef4444,#f87171)}
    .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:800}
    .pill.ok{background:#ecfdf5;color:#0f766e} .pill.warn{background:#fffbeb;color:#b45309} .pill.bad{background:#fef2f2;color:#b91c1c} .pill.info{background:#eff6ff;color:#1d4ed8} .pill.mut{background:#f1f5f9;color:#475569}
    .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
    /* board */
    .board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
    .col{background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0}
    .col h4{margin:0 0 10px; font-size:12.5px; font-weight:800; display:flex; align-items:center; gap:7px}
    .col h4 .cnt{margin-left:auto; font-size:11px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted)}
    .tk{background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:10px 11px; margin-bottom:9px; box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .tk .t{font-size:12.5px; font-weight:800; margin-bottom:5px}
    .tk .m{font-size:11px; color:var(--muted); font-weight:600; display:flex; gap:8px; flex-wrap:wrap}
    .tk.hi{border-left-color:var(--warn)} .tk.cr{border-left-color:var(--bad)}
    /* timeline / gantt */
    .gantt{min-width:720px}
    .grow{display:grid; grid-template-columns:150px 1fr; align-items:center; gap:10px; margin-bottom:9px}
    .glab{font-size:12px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis}
    .gtrack{position:relative; height:26px; background:var(--soft); border-radius:8px; border:1px solid var(--line)}
    .gbar{position:absolute; top:3px; height:20px; border-radius:6px; display:flex; align-items:center; padding:0 8px; font-size:10.5px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden}
    .gaxis{display:grid; grid-template-columns:150px 1fr; gap:10px; margin-bottom:6px}
    .gaxis .days{display:grid; grid-template-columns:repeat(7,1fr); font-size:10px; color:var(--muted); font-weight:700}
    /* matrix / heat */
    .matrix{min-width:640px; border-collapse:separate; border-spacing:4px}
    .matrix td{text-align:center; border:none; border-radius:8px; padding:0; height:44px; color:#0f2a27; font-weight:800; font-size:12px}
    .matrix th{background:transparent; text-align:center; font-size:11px}
    .matrix td .cellv{display:flex; flex-direction:column; align-items:center; justify-content:center; height:44px; border-radius:8px}
    .mrowh{background:var(--soft)!important; font-weight:800; font-size:11.5px; color:var(--ink); text-align:left!important; padding-left:8px!important}
    /* scenario compare */
    .scn{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
    .scnc{border:1.5px solid var(--line); border-radius:16px; padding:16px; position:relative; background:var(--panel)}
    .scnc.best{border-color:var(--accent); box-shadow:0 8px 22px rgba(13,148,136,.15)}
    .scnc .rk{position:absolute; top:-10px; right:14px; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--muted); border:1px solid var(--line)}
    .scnc.best .rk{background:linear-gradient(135deg,var(--accent),var(--accent-d)); color:#fff; border-color:transparent}
    .scnc h4{margin:0 0 4px; font-size:15px; font-weight:800}
    .scnc .stag{font-size:11px; color:var(--muted); font-weight:700; margin-bottom:12px}
    .mrow{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line); font-size:12.5px}
    .mrow:last-child{border-bottom:none}
    .mrow span{color:var(--muted); font-weight:700}
    .mrow b{font-weight:800; font-variant-numeric:tabular-nums}
    /* step flow */
    .steps{display:flex; gap:0; flex-wrap:wrap}
    .step{flex:1; min-width:140px; position:relative; padding:2px 8px}
    .step .sn{width:30px;height:30px;border-radius:50%;background:var(--soft);border:2px solid var(--accent);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;margin-bottom:8px}
    .step.done .sn{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent}
    .step .st{font-size:12.5px;font-weight:800}
    .step .sd{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.5}
    /* audit log */
    .log{position:relative; padding-left:22px}
    .log::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .li{position:relative; padding:0 0 16px 4px}
    .li::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
    .li.warn::before{border-color:var(--warn)} .li.bad::before{border-color:var(--bad)}
    .li .lt{font-size:12.5px;font-weight:800}
    .li .lm{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
    .li .ltime{font-size:10.5px;color:var(--muted);font-weight:700}
    .sub2{font-size:12px;color:var(--muted);font-weight:600;margin:-6px 0 14px;line-height:1.6}
    .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); font-weight:700; margin-top:10px}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
    .donutip{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;line-height:1.6}
    /* mobile nav */
    @media(max-width:860px){
      .shell{flex-direction:column}
      .side{width:auto; height:auto; position:static; flex-direction:column; border-right:none; border-bottom:1px solid var(--line)}
      .side .navlab, .side .foot{display:none}
      nav{flex-direction:row; flex-wrap:wrap; gap:8px}
      .navbtn{width:auto; flex:none; white-space:nowrap; padding:9px 13px}
      .navbtn .idx{display:none}
      .brand{padding:2px 4px 10px}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g2u,.g2v,.board,.scn,.matrix{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
      .scn{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .navbtn .txt{display:none}
      .navbtn{padding:9px 11px}
      .wrap{padding:16px 14px 34px}
      .topbar{padding:14px 16px}
      .board{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></span>
        <div>
          <b>產能規劃 CRP</b>
          <span>Capacity Requirement Planning</span>
        </div>
      </div>
      <div class="navlab">作業流程模組</div>
      <nav id="nav"></nav>
      <div class="foot">
        資料來源同步：<b>ERP · APS · MES</b><br/>
        規劃週期：<b>2026-W29 ~ W34</b><br/>
        <span style="opacity:.7">Jvision Demo · 純前端假資料</span>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="htitle">
          <h1 id="tt">需求預測輸入</h1>
          <div class="sub" id="ts">彙整接單與預測，展開為各工作中心產能需求</div>
        </div>
        <div class="chips">
          <span class="chip live"><span class="dot"></span>即時試算</span>
          <span class="chip"><span class="material-symbols-outlined">factory</span>桃園一廠</span>
        </div>
      </div>
      <div class="wrap"><div id="screen"></div></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    var charts=[];
    function disposeCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].dispose();}catch(e){} } charts=[]; }
    function mk(el,opt){ if(!el) return; var c=echarts.init(el); c.setOption(opt); charts.push(c); return c; }
    function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

    var MODS=[
      {icon:"insights",name:"需求預測輸入",sub:"彙整接單與預測，展開為各工作中心產能需求"},
      {icon:"precision_manufacturing",name:"產能負荷試算",sub:"工作中心負荷率對比可用產能，找出過載時段"},
      {icon:"warning",name:"資源缺口分析",sub:"量化缺工/缺產能天數並定位瓶頸工作中心"},
      {icon:"tune",name:"因應方案模擬",sub:"加班/委外/擴線情境試算，比較成本與交期"},
      {icon:"event_available",name:"產線排程檢視",sub:"工作中心負荷甘特排程與治具衝突檢視"},
      {icon:"task_alt",name:"決策輸出稽核",sub:"產能決策核准、回寫與稽核追蹤"}
    ];

    var accent="#0d9488", accent2="#2dd4bf", warn="#d97706", bad="#dc2626", line="#e2ebe9", ink="#0f2a27", muted="#5c7370";
    function baseGrid(l,r,t,b){ return {left:l||44,right:r||18,top:t||30,bottom:b||30,containLabel:true}; }
    function axStyle(){ return {axisLine:{lineStyle:{color:line}},axisTick:{show:false},axisLabel:{color:muted,fontSize:11,fontFamily:"Inter"},splitLine:{lineStyle:{color:"#eef4f3"}}}; }

    /* ============ SCREEN 0: 需求預測輸入 ============ */
    function s0(){
      var wc=[
        {c:"CNC 加工",need:1820,ord:"OD-2291",item:"閥體 A32",qty:4200,std:0.42,pri:"高",due:"07-25"},
        {c:"沖壓成型",need:1360,ord:"OD-2288",item:"支架 B14",qty:9800,std:0.14,pri:"中",due:"07-28"},
        {c:"表面處理",need:980,ord:"OD-2295",item:"外殼 C08",qty:6100,std:0.16,pri:"高",due:"07-24"},
        {c:"組裝線 1",need:2240,ord:"OD-2301",item:"總成 D21",qty:3600,std:0.62,pri:"高",due:"07-26"},
        {c:"焊接工段",need:760,ord:"OD-2277",item:"框架 E05",qty:2400,std:0.32,pri:"低",due:"08-02"},
        {c:"品檢包裝",need:1120,ord:"OD-2299",item:"總成 D21",qty:3600,std:0.31,pri:"中",due:"07-27"}
      ];
      var html='';
      html+='<div class="grid g4">';
      html+=kpi("assignment","本週工單需求","46","張","+7 vs 上週","up");
      html+=kpi("schedule","總產能需求","8,280","工時","+12.4%","down");
      html+=kpi("priority_high","急單/插單","9","張","佔比 19.6%","flat");
      html+=kpi("event","最早承諾交期","07-24","","距今 3 天","flat");
      html+='</div>';
      html+='<div class="grid g2v" style="margin-top:16px">';
      html+='<div class="card"><div class="ch"><span class="material-symbols-outlined">donut_large</span><h3>需求來源結構</h3><span class="tag">工時佔比</span></div><div id="c0a" class="echart" style="height:260px"></div><div class="donutip">確認訂單為主力需求，滾動預測與安全備貨提供緩衝，插單需即時併入負荷試算。</div></div>';
      html+='<div class="card"><div class="ch"><span class="material-symbols-outlined">stacked_bar_chart</span><h3>各工作中心產能需求（工時）</h3><span class="tag">2026-W29</span></div><div id="c0b" class="echart" style="height:260px"></div></div>';
      html+='</div>';
      html+='<div class="card" style="margin-top:16px"><div class="ch"><span class="material-symbols-outlined">table_rows</span><h3>需求展開明細（訂單 → 工作中心工時）</h3><span class="tag">依標準工時 × 數量</span></div>';
      html+='<div class="scroll"><table><thead><tr><th>工作中心</th><th>來源訂單</th><th>品項</th><th class="num">數量</th><th class="num">標準工時</th><th class="num">需求工時</th><th>優先</th><th>承諾交期</th></tr></thead><tbody>';
      wc.forEach(function(r){
        var pcls=r.pri==="高"?"bad":(r.pri==="中"?"warn":"mut");
        html+='<tr><td><b>'+esc(r.c)+'</b></td><td>'+esc(r.ord)+'</td><td>'+esc(r.item)+'</td><td class="num">'+r.qty.toLocaleString()+'</td><td class="num">'+r.std.toFixed(2)+'</td><td class="num"><b>'+r.need.toLocaleString()+'</b></td><td><span class="pill '+pcls+'">'+esc(r.pri)+'</span></td><td>'+esc(r.due)+'</td></tr>';
      });
      html+='</tbody></table></div></div>';
      document.getElementById("screen").innerHTML=html;
      void document.getElementById("screen").offsetHeight;

      mk(document.getElementById("c0a"),{
        tooltip:{trigger:"item",valueFormatter:function(v){return v+" 工時";}},
        legend:{bottom:0,textStyle:{color:muted,fontSize:11},itemWidth:11,itemHeight:11},
        series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],avoidLabelOverlap:true,
          itemStyle:{borderColor:"#fff",borderWidth:2,borderRadius:5},
          label:{show:false},
          data:[
            {value:5180,name:"確認訂單",itemStyle:{color:accent}},
            {value:1720,name:"滾動預測",itemStyle:{color:accent2}},
            {value:960,name:"安全備貨",itemStyle:{color:"#5eead4"}},
            {value:420,name:"插單需求",itemStyle:{color:warn}}

    function kpi(icon,label,val,unit,delta,dir){
      var dc=dir==="up"?"up":(dir==="down"?"down":"flat");
      var di=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");
      return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+esc(label)+'</div>'
        +'<div class="kv">'+esc(val)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div>'
        +'<div class="kd '+dc+'"><span class="material-symbols-outlined">'+di+'</span>'+esc(delta)+'</div></div>';
    }
    function scn(title,tag,best,l1,v1,l2,v2,l3,v3,l4,v4,rec){
      return '<div class="scnc'+(best==="best"?" best":"")+'">'
        +'<span class="rk">'+(best==="best"?"★ 推薦":"備選")+'</span>'
        +'<h4>'+esc(title)+'</h4><div class="stag">'+esc(tag)+'</div>'
        +'<div class="mrow"><span>'+esc(l1)+'</span><b>'+esc(v1)+'</b></div>'
        +'<div class="mrow"><span>'+esc(l2)+'</span><b style="color:var(--accent-d)">'+esc(v2)+'</b></div>'
        +'<div class="mrow"><span>'+esc(l3)+'</span><b>'+esc(v3)+'</b></div>'
        +'<div class="mrow"><span>'+esc(l4)+'</span><b>'+esc(v4)+'</b></div>'
        +'<div class="mrow"><span>系統建議</span>'+(rec==="是"?'<span class="pill ok">採用</span>':'<span class="pill mut">保留</span>')+'</div></div>';
    }

    var RENDER=[s0,s1,s2,s3,s4,s5];

    function buildNav(){
      var nav=document.getElementById("nav"), h='';
      for(var i=0;i<MODS.length;i++){
        h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="txt">'+esc(MODS[i].name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
      }
      nav.innerHTML=h;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        btns[j].addEventListener("click",function(){ show(+this.getAttribute("data-i")); try{window.scrollTo(0,0);}catch(e){} });
      }
    }

    function show(i){
      disposeCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
      document.getElementById("tt").textContent=MODS[i].name;
      document.getElementById("ts").textContent=MODS[i].sub;
      var container=document.getElementById("screen");
      RENDER[i]();
      void container.offsetHeight;
    }
    window.show=show;
    buildNav();
    show(0);
  })();
  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
