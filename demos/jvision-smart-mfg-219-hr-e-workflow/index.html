<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人事電子簽核系統（HR e-Workflow）｜Jvision 系統 Demo</title>
<meta name="description" content="表單申請、規則轉送、多層級簽核到稽核歸檔的人資電子簽核全流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --tl:#0f766e; --tl-d:#0b5a54; --tl-l:#5eead4; --tl-bg:#ecfdf9; --ink:#0f2b28; --body:#37514d; --muted:#6f8b86; --line:#dbeae6; --bg:#f2f8f6; --card:#ffffff; --green:#16a34a; --amber:#d97706; --red:#dc2626; --blue:#2563eb; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .shell{ display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
  /* sidebar (light) */
  .side{ background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; }
  .brand{ display:flex; align-items:center; gap:11px; padding:4px 6px 16px; }
  .brand .lg{ width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--tl),var(--tl-d)); color:#fff; display:grid; place-content:center; flex:none; box-shadow:0 6px 14px rgba(15,118,110,.28); }
  .brand .lg .material-symbols-outlined{ font-size:24px; }
  .brand b{ color:var(--ink); font-size:15px; font-weight:900; display:block; line-height:1.2; }
  .brand small{ color:var(--muted); font-size:11px; font-weight:700; }
  .navlbl{ font-size:10px; font-weight:900; color:var(--muted); letter-spacing:.08em; padding:10px 8px 6px; }
  nav{ display:flex; flex-direction:column; gap:3px; }
  nav button{ display:flex; align-items:center; gap:11px; border:0; background:none; text-align:left; padding:10px 12px; border-radius:11px; font:inherit; font-size:13.5px; font-weight:700; color:var(--body); cursor:pointer; min-width:0; }
  nav button .material-symbols-outlined{ font-size:21px; color:var(--muted); flex:none; }
  nav button .nt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav button:hover{ background:var(--tl-bg); color:var(--tl-d); }
  nav button.on{ background:linear-gradient(135deg,var(--tl),var(--tl-d)); color:#fff; box-shadow:0 6px 14px rgba(15,118,110,.28); }
  nav button.on .material-symbols-outlined{ color:#fff; }
  .side .foot{ margin-top:auto; padding:12px 8px 2px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); line-height:1.7; }
  .side .foot b{ color:var(--tl-d); }
  /* main */
  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ position:sticky; top:0; z-index:10; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:13px 26px; display:flex; align-items:center; gap:14px; }
  .top .mb{ display:none; border:1px solid var(--line); background:#fff; border-radius:10px; width:38px; height:38px; place-content:center; cursor:pointer; color:var(--tl-d); }
  .top h1{ margin:0; font-size:17px; font-weight:900; color:var(--ink); }
  .top .sub{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--tl-d); background:var(--tl-bg); border-radius:999px; padding:5px 11px; }
  .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--tl); }
  .ava{ width:34px; height:34px; border-radius:50%; background:var(--tl-bg); color:var(--tl-d); font-weight:900; display:grid; place-content:center; font-size:13px; }
  .body{ padding:22px 26px 46px; min-width:0; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--tl); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--tl-d); border:1px solid var(--line); }
  .btn .material-symbols-outlined{ font-size:18px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); }
  .vh p{ margin:4px 0 0; font-size:13px; color:var(--muted); }
  /* kpis */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:15px; padding:15px 17px; border-left:4px solid var(--tl); min-width:0; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--tl); }
  .kpi .v{ font-size:26px; font-weight:900; color:var(--ink); margin-top:6px; }
  .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:4px; }
  .up{ color:var(--green); } .dn{ color:var(--red); }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:1fr 1fr 1fr; } .g14{ grid-template-columns:1.5fr 1fr; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card>h3 .material-symbols-outlined{ color:var(--tl); font-size:20px; }
  .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--tl-d); cursor:pointer; }
  .chart{ width:100%; height:260px; overflow:hidden; }
  /* table */
  .tw{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; letter-spacing:.03em; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:#f6faf9; white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl tr:hover td{ background:#f6faf9; }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .t-run{ background:#ccfbf1; color:#0f766e; } .t-wait{ background:#f1f5f9; color:#64748b; } .t-done{ background:#dcfce7; color:#166534; } .t-late{ background:#fee2e2; color:#991b1b; } .t-back{ background:#ffedd5; color:#9a3412; }
  .pri{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 8px; }
  .p-h{ background:#fee2e2; color:#dc2626; } .p-m{ background:#fef3c7; color:#b45309; } .p-l{ background:#e0f2fe; color:#0369a1; }
  /* generic inbox list */
  .inbox{ display:flex; flex-direction:column; }
  .ib{ display:flex; gap:12px; padding:13px 4px; border-top:1px solid var(--line); cursor:pointer; align-items:flex-start; }
  .ib:first-child{ border-top:0; } .ib:hover{ background:#f6faf9; }
  .ib.sel{ background:var(--tl-bg); }
  .ib .ic{ width:36px; height:36px; border-radius:11px; display:grid; place-content:center; flex:none; background:var(--tl-bg); color:var(--tl-d); }
  .ib .ic .material-symbols-outlined{ font-size:20px; }
  .ib .tx{ min-width:0; flex:1; }
  .ib .tx b{ color:var(--ink); font-size:13.5px; display:block; }
  .ib .tx small{ color:var(--muted); font-size:12px; }
  .ib .rt{ text-align:right; flex:none; }
  .ib .rt small{ display:block; color:var(--muted); font-size:11px; margin-top:4px; }
  /* approval timeline */
  .tl{ position:relative; padding-left:26px; }
  .tl::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .tl .step{ position:relative; padding:0 0 18px; }
  .tl .step:last-child{ padding-bottom:0; }
  .tl .step .dot{ position:absolute; left:-26px; top:2px; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--line); display:grid; place-content:center; }
  .tl .step .dot .material-symbols-outlined{ font-size:13px; color:var(--muted); }
  .tl .step.ok .dot{ border-color:var(--green); background:#dcfce7; } .tl .step.ok .dot .material-symbols-outlined{ color:var(--green); }
  .tl .step.now .dot{ border-color:var(--tl); background:var(--tl); } .tl .step.now .dot .material-symbols-outlined{ color:#fff; }
  .tl .step b{ color:var(--ink); font-size:13.5px; }
  .tl .step small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  /* flow designer canvas */
  .canvas{ position:relative; background:#f6faf9; border:1px dashed var(--tl-l); border-radius:14px; padding:22px 14px; overflow-x:auto; }
  .flowrow{ display:flex; align-items:center; gap:0; min-width:720px; }
  .node{ flex:none; width:132px; background:#fff; border:2px solid var(--line); border-radius:13px; padding:11px 12px; text-align:center; box-shadow:0 4px 10px rgba(15,43,40,.06); }
  .node.start{ border-color:var(--tl); background:var(--tl-bg); }
  .node.cond{ border-color:var(--amber); background:#fffbeb; }
  .node.end{ border-color:var(--green); background:#f0fdf4; }
  .node .ni{ width:34px; height:34px; border-radius:10px; margin:0 auto 6px; display:grid; place-content:center; background:var(--tl-bg); color:var(--tl-d); }
  .node.cond .ni{ background:#fef3c7; color:var(--amber); } .node.end .ni{ background:#dcfce7; color:var(--green); }
  .node .ni .material-symbols-outlined{ font-size:20px; }
  .node b{ display:block; color:var(--ink); font-size:13px; }
  .node small{ display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  .arrow{ flex:none; width:34px; text-align:center; color:var(--tl); }
  .arrow .material-symbols-outlined{ font-size:22px; }
  .palette{ display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--body); }
  .chip .material-symbols-outlined{ font-size:16px; color:var(--tl); }
  /* form preview */
  .fld{ margin-bottom:13px; }
  .fld label{ display:block; font-size:12px; font-weight:800; color:var(--ink); margin-bottom:5px; }
  .fld .ipt{ background:#f6faf9; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--body); }
  .fld .ipt.big{ min-height:64px; }
  .frow{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  /* board (delegate) */
  .cols{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .col{ background:#f6faf9; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .col h4{ margin:0 0 10px; font-size:13px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:7px; }
  .col h4 .cnt{ margin-left:auto; font-size:11px; font-weight:800; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .dcard{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:9px; }
  .dcard:last-child{ margin-bottom:0; }
  .dcard b{ color:var(--ink); font-size:13px; }
  .dcard .who{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12px; color:var(--body); }
  .mini{ width:24px; height:24px; border-radius:50%; background:var(--tl-bg); color:var(--tl-d); font-weight:800; font-size:11px; display:grid; place-content:center; flex:none; }
  .dcard small{ display:block; color:var(--muted); font-size:11px; margin-top:6px; }
  .prog{ height:7px; border-radius:999px; background:#e6f2ef; overflow:hidden; margin-top:9px; }
  .prog span{ display:block; height:100%; background:linear-gradient(90deg,var(--tl),var(--tl-l)); }
  .lgd{ font-size:12px; color:var(--muted); font-weight:700; }
  .lgd i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  @media (max-width:860px){
    .shell{ grid-template-columns:1fr; }
    .side{ position:static; height:auto; flex-direction:column; padding:12px 14px; }
    .side .foot{ display:none; }
    nav{ flex-direction:row; flex-wrap:wrap; }
    nav button{ padding:9px 12px; }
    .navlbl{ display:none; }
    .top .mb{ display:none; }
  }
  @media (max-width:820px){
    .body{ padding:16px 14px 34px; }
    .g2,.g3,.g14{ grid-template-columns:1fr; }
    .cols{ grid-template-columns:1fr; }
    .frow{ grid-template-columns:1fr; }
  }
  @media (max-width:560px){
    nav button .nt{ display:none; }
    nav button{ padding:9px; }
    .top h1{ font-size:15px; } .top .sub{ display:none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="lg"><span class="material-symbols-outlined">how_to_reg</span></div>
      <div><b>HR e-Workflow</b><small>人事電子簽核系統</small></div>
    </div>
    <div class="navlbl">簽核作業</div>
    <nav id="nav"></nav>
    <div class="foot">環境：<b>Demo 展示</b><br/>資料同步：HRIS · ESS · 薪資系統<br/>版本 v2.6 · 純 UI 範例</div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="mb"><span class="material-symbols-outlined">menu</span></button>
      <div>
        <h1 id="tt">簽核總覽</h1>

</div>
<script>
var MODS=[
  ["dashboard","簽核總覽","即時掌握待辦、時效與逾期"],
  ["account_tree","流程設計器","可視化拖拉設定簽核路徑"],
  ["description","表單申請","填寫並提交電子表單"],
  ["fact_check","簽核審批","待辦逐層核准與退回"],
  ["groups","代理授權","職務代理與加簽授權"],
  ["history","稽核軌跡","全程紀錄與稽核報表"]

/* ---------- fake data ---------- */

  {no:"LV-20826",ty:"特休假申請",ap:"林彥廷",dept:"生產一課",cur:"直屬主管",pr:"m",age:"4 小時",st:"run",ic:"beach_access"},

  {no:"PO-30217",ty:"採購請購單",ap:"張博勛",dept:"資材課",cur:"財務審核",pr:"h",age:"6 小時",st:"run",ic:"shopping_cart"},
  {no:"RE-00842",ty:"費用報支",ap:"黃芷晴",dept:"業務課",cur:"HR 覆核",pr:"l",age:"2 天",st:"back",ic:"receipt_long"},
  {no:"TR-05519",ty:"教育訓練申請",ap:"吳承恩",dept:"研發課",cur:"部級主管",pr:"m",age:"3 小時",st:"run",ic:"school"},
  {no:"LV-20831",ty:"病假申請",ap:"蔡佳蓉",dept:"生產二課",cur:"直屬主管",pr:"l",age:"30 分",st:"run",ic:"medical_services"}
];
var MYFORMS=[
  {no:"LV-20826",ty:"特休假申請",date:"08/14",st:"run",prog:40,stg:"直屬主管簽核中"},
  {no:"OT-11498",ty:"加班申請",date:"08/12",st:"done",prog:100,stg:"已完成"},

var TRAIL=[

  {t:"08/14 14:21",who:"人資 · 陳曉薇",act:"HR 覆核通過",no:"OT-11498",ic:"verified",cl:"done"},
  {t:"08/14 11:05",who:"經理 · 王志明",act:"部級主管核准",no:"OT-11498",ic:"task_alt",cl:"done"},

/* helpers */
function prTx(p){return p==="h"?"急件":p==="m"?"一般":"低";}
function prCls(p){return p==="h"?"p-h":p==="m"?"p-m":"p-l";}
function stTx(s){return s==="run"?"簽核中":s==="late"?"逾期":s==="done"?"已完成":s==="back"?"已退回":"待處理";}
function stCls(s){return s==="run"?"t-run":s==="late"?"t-late":s==="done"?"t-done":s==="back"?"t-back":"t-wait";}

/* ---------- screens ---------- */
function kpiRow(){
  var d=[
    ["pending_actions","待簽核件數","38","+6 較昨日","dn"],
    ["schedule","平均簽核時效","1.0","天 · ▼1.9 天","up"],
    ["warning","逾期未簽","5","件 · 需關注","dn"],
    ["task_alt","本月完成","412","件 · 準時率 96%","up"]
  ];
  return '<div class="kpis">'+d.map(function(k){
    return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[0]+'</span>'+k[1]+'</div><div class="v">'+k[2]+' <small>'+(k[1]==="平均簽核時效"?"":"")+'</small></div><div class="d '+k[4]+'">'+k[3]+'</div></div>';
  }).join("")+'</div>';
}

function scr0(){
  return kpiRow()+
  '<div class="grid g14"><div class="card"><h3><span class="material-symbols-outlined">monitoring</span>近 6 週簽核時效與逾期</h3><div id="c0a" class="chart"></div></div>'+

var charts=[];
function draw(i){

  charts=[];
  if(!window.echarts) return;
  var axis={axisLabel:{color:"#6f8b86"},axisLine:{lineStyle:{color:"#dbeae6"}}};
  function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
  if(i===0){
    mk("c0a",{grid:{left:6,right:14,top:30,bottom:6,containLabel:true},tooltip:{trigger:"axis"},legend:{data:["平均時效(天)","逾期件數"],textStyle:{color:"#37514d"},top:0},
      xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLabel:axis.axisLabel,axisLine:axis.axisLine},
      yAxis:[{type:"value",splitLine:{lineStyle:{color:"#eef5f3"}},axisLabel:axis.axisLabel},{type:"value",splitLine:{show:false},axisLabel:axis.axisLabel}],
      series:[{name:"平均時效(天)",type:"line",smooth:true,data:[2.9,2.4,1.9,1.6,1.2,1.0],itemStyle:{color:"#0f766e"},areaStyle:{color:"rgba(15,118,110,.12)"}},
        {name:"逾期件數",type:"bar",yAxisIndex:1,data:[14,11,9,8,6,5],itemStyle:{color:"#5eead4",borderRadius:[5,5,0,0]}}]});
    mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#37514d"}},
      series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],avoidLabelOverlap:false,label:{show:false},
        data:[{value:14,name:"請假",itemStyle:{color:"#0f766e"}},{value:9,name:"加班",itemStyle:{color:"#5eead4"}},{value:7,name:"報支",itemStyle:{color:"#2dd4bf"}},{value:5,name:"請購",itemStyle:{color:"#99f6e4"}},{value:3,name:"其他",itemStyle:{color:"#cbd5e1"}}]}]});
  }else if(i===4){
    mk("c4",{grid:{left:6,right:14,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},
      xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLabel:axis.axisLabel,axisLine:axis.axisLine},
      yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef5f3"}},axisLabel:axis.axisLabel},
      series:[{type:"bar",data:[18,22,17,25,24,28],itemStyle:{color:"#0f766e",borderRadius:[6,6,0,0]}}]});

      yAxis:{type:"category",data:["完成歸檔","HR 覆核","部級主管","直屬主管","填單提交"],axisLabel:axis.axisLabel,axisLine:axis.axisLine},

      series:[{type:"bar",data:[2,6.5,9,11,0.5],itemStyle:{color:"#5eead4",borderRadius:[0,6,6,0]}}]});

}

var nav=document.getElementById("nav"),view=document.getElementById("view"),tt=document.getElementById("tt"),ts=document.getElementById("ts");
nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?"on":"")+'"><span class="material-symbols-outlined">'+m[0]+'</span><span class="nt">'+m[1]+'</span></button>';}).join("");
function show(i){
  nav.querySelectorAll("button[data-i]").forEach(function(b){b.classList.toggle("on",+b.dataset.i===i);});
  tt.textContent=MODS[i][1]; ts.textContent=MODS[i][2];
  var head='<div class="vh"><div><h2>'+MODS[i][1]+'</h2><p>'+MODS[i][2]+'</p></div>'+
    (i===2?'<button class="btn"><span class="material-symbols-outlined">note_add</span>新增表單</button>':i===1?'<button class="btn"><span class="material-symbols-outlined">add</span>新增流程</button>':i===4?'<button class="btn"><span class="material-symbols-outlined">person_add</span>新增代理</button>':'<button class="btn ghost"><span class="material-symbols-outlined">filter_list</span>篩選</button>')+'</div>';
  view.innerHTML=head+SCREENS[i]();
  void view.offsetHeight;
  draw(i);
}
nav.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
