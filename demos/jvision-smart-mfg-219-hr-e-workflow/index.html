<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人事電子簽核系統（HR e-Workflow）｜Jvision 系統 Demo</title>
<meta name="description" content="表單申請、規則轉送、多層級簽核到稽核歸檔的人資電子簽核全流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#102F2C;
  --muted:#526570;
  --line:#A7DED7;
  --tl:var(--color-primary);
  --tl-d:#087168;
  --tl-l:var(--color-secondary);
  --tl-bg:#DDF8F3;
  --body:#294743;
  --bg:var(--color-background);
  --card:var(--color-card);
  --green:#15803D;
  --amber:#B45309;
  --red:var(--color-destructive);
  --shadow-sm:0 2px 0 rgba(19,78,74,.08);
  --shadow-md:0 12px 28px rgba(19,78,74,.09);
  --serif:"Cormorant Garamond","Noto Serif TC","PMingLiU",serif;
  --display:"Cinzel","Noto Serif TC","PMingLiU",serif;
  --text:"Crimson Pro","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--text);
  font-size:16px;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
button,.ib,.chip,.grow{cursor:pointer}
button:focus-visible,.ib:focus-visible,.chip:focus-visible,.grow:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  line-height:1;
}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:24px 18px 18px;
  background:rgba(255,255,255,.96);
  border-right:1px solid var(--line);
  box-shadow:6px 0 0 rgba(13,148,136,.035);
}
.brand{display:flex;align-items:center;gap:13px;padding:0 5px 24px;border-bottom:1px solid var(--line)}
.brand .lg{
  display:grid;
  place-content:center;
  width:44px;
  height:44px;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid #087168;
  border-radius:4px;
  box-shadow:5px 5px 0 #99F6E4;
}
.brand .lg .material-symbols-outlined{font-size:24px;font-weight:600}
.brand b{
  display:block;
  color:var(--ink);
  font-family:var(--display);
  font-size:14px;
  font-weight:600;
  line-height:1.25;
  letter-spacing:.025em;
}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:600}
.navlbl{padding:24px 10px 8px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:5px}
nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  min-height:44px;
  padding:10px 12px;
  color:var(--body);
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  font-size:14px;
  font-weight:600;
  text-align:left;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
nav button .material-symbols-outlined{flex:none;color:var(--muted);font-size:21px;transition:color .2s ease,transform .2s ease}
nav button .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button:hover{color:var(--ink);background:#E3F8F4;border-color:var(--line);transform:translateX(2px)}
nav button:hover .material-symbols-outlined{color:var(--tl-d);transform:scale(1.06)}
nav button.on{color:var(--color-on-primary);background:var(--color-primary);border-color:#087168;box-shadow:4px 4px 0 #99F6E4}
nav button.on::before{position:absolute;left:-19px;width:4px;height:24px;background:var(--color-accent);content:""}
nav button.on .material-symbols-outlined{color:var(--color-on-primary);font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.side .foot{margin-top:auto;padding:18px 8px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.75}
.side .foot b{color:var(--tl-d);font-weight:600}
.main{display:flex;min-width:0;flex-direction:column}
.top{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:72px;
  padding:12px clamp(18px,3vw,40px);
  background:rgba(240,253,250,.9);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.top .mb{display:none;width:44px;height:44px;place-content:center;color:var(--tl-d);background:#fff;border:1px solid var(--line);border-radius:4px}
.top h1{margin:0;color:var(--ink);font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.1;letter-spacing:.01em}
.top .sub{margin-top:4px;color:var(--muted);font-size:13px}
.top .r{display:flex;align-items:center;gap:12px;margin-left:auto}
.live{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;color:#075E57;background:#DDF8F3;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600}
.live .dot{width:8px;height:8px;background:var(--color-primary);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--color-primary)}
.ava{display:grid;place-content:center;width:38px;height:38px;color:var(--color-on-primary);background:var(--color-secondary);border:1px solid var(--tl-d);border-radius:50%;font-family:var(--serif);font-size:15px;font-weight:700}
.body{min-width:0;padding:30px clamp(18px,3vw,40px) 56px}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.vh h2{margin:0;color:var(--ink);font-family:var(--serif);font-size:clamp(28px,3vw,38px);font-weight:700;line-height:1;letter-spacing:-.015em}
.vh p{margin:8px 0 0;color:var(--muted);font-size:14px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:44px;
  padding:0 17px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:1px solid #92400E;
  border-radius:4px;
  box-shadow:3px 3px 0 rgba(120,53,15,.2);
  font-size:14px;
  font-weight:600;
  transition:background-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btn:hover{background:#F59E0B;box-shadow:5px 5px 0 rgba(120,53,15,.18);transform:translate(-1px,-1px)}
.btn:active{box-shadow:1px 1px 0 rgba(120,53,15,.22);transform:translate(1px,1px)}
.btn.ghost{color:#075E57;background:#fff;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:#E3F8F4;border-color:var(--color-primary);box-shadow:3px 3px 0 #CCFBF1}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:18px 18px 17px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.kpi::after{position:absolute;right:0;bottom:0;width:28px;height:4px;background:var(--color-accent);content:""}
.kpi:hover{border-color:var(--color-primary);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .l .material-symbols-outlined{color:var(--tl-d);font-size:19px}
.kpi .v{margin-top:10px;color:var(--ink);font-family:var(--serif);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .v small{color:var(--muted);font-family:var(--text);font-size:13px;font-weight:600}
.kpi .d{margin-top:9px;font-size:12px;font-weight:600}
.up{color:#116B32}.dn{color:#B91C1C}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g14{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}
.card{
  min-width:0;
  padding:20px 22px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#79CFC5;box-shadow:var(--shadow-md)}
.card>h3{display:flex;align-items:center;gap:9px;margin:0 0 17px;color:var(--ink);font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25}
.card>h3::after{align-self:center;width:26px;height:1px;margin-left:3px;background:var(--color-accent);content:""}
.card>h3 .material-symbols-outlined{color:var(--tl-d);font-size:20px}
.card>h3 .grow{margin-left:auto;color:#075E57;font-family:var(--text);font-size:12px;font-weight:600;white-space:nowrap}
.card>h3 .grow:hover{text-decoration:underline;text-underline-offset:3px}
.chart{width:100%;height:260px;overflow:hidden}
.tw{overflow-x:auto;scrollbar-color:var(--color-primary) var(--color-muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{padding:12px;text-align:left;white-space:nowrap;color:#40545F;background:#E8F4F3;border-top:1px solid var(--line);border-bottom:2px solid var(--color-primary);font-size:11px;font-weight:600;letter-spacing:.07em}
.tbl td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{transition:background-color .18s ease}
.tbl tbody tr:hover td{background:#EDFAF7}
.tbl td:first-child,.tbl td:nth-child(3),.tbl td:nth-child(7){font-variant-numeric:tabular-nums}
.tbl td:first-child{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
.tbl td:nth-child(7){text-align:right}
.tag,.pri{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid currentColor;border-radius:3px;font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.tag::before,.pri::before{font-family:"Material Symbols Outlined";font-size:13px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20}
.t-run{color:#075E57;background:#CCFBF1}.t-run::before{content:"pending_actions"}
.t-wait{color:#475569;background:#F1F5F9}.t-wait::before{content:"hourglass_empty"}
.t-done{color:#166534;background:#DCFCE7}.t-done::before{content:"check_circle"}
.t-late{color:#991B1B;background:#FEE2E2}.t-late::before{content:"warning"}
.t-back{color:#9A3412;background:#FFEDD5}.t-back::before{content:"undo"}
.p-h{color:#B91C1C;background:#FEE2E2}.p-h::before{content:"priority_high"}
.p-m{color:#92400E;background:#FEF3C7}.p-m::before{content:"remove"}
.p-l{color:#075985;background:#E0F2FE}.p-l::before{content:"arrow_downward"}
.inbox{display:flex;flex-direction:column}
.ib{display:flex;align-items:flex-start;gap:12px;padding:14px 6px;border-top:1px solid var(--line);transition:background-color .2s ease,transform .2s ease}
.ib:first-child{border-top:0}.ib:hover{background:#EDFAF7;transform:translateX(2px)}.ib.sel{background:#DDF8F3;box-shadow:inset 3px 0 var(--color-primary)}
.ib .ic{display:grid;place-content:center;width:38px;height:38px;flex:none;color:#075E57;background:#DDF8F3;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:12px;font-weight:600}
.ib .ic .material-symbols-outlined{font-size:20px}.ib .tx{min-width:0;flex:1}.ib .tx b{display:block;color:var(--ink);font-size:14px;font-weight:600}.ib .tx small{color:var(--muted);font-size:12px}.ib .rt{flex:none;text-align:right}.ib .rt small{display:block;margin-top:5px;color:var(--muted);font-family:var(--mono);font-size:11px}
.tl{position:relative;padding-left:28px}.tl::before{position:absolute;top:6px;bottom:6px;left:9px;width:2px;background:var(--line);content:""}.tl .step{position:relative;padding:0 0 20px}.tl .step:last-child{padding-bottom:0}.tl .step .dot{position:absolute;top:1px;left:-28px;display:grid;place-content:center;width:20px;height:20px;color:var(--muted);background:#fff;border:2px solid var(--line);border-radius:50%}.tl .step .dot .material-symbols-outlined{font-size:13px}.tl .step.ok .dot{color:#166534;background:#DCFCE7;border-color:#15803D}.tl .step.now .dot{color:var(--color-on-primary);background:var(--color-primary);border-color:#075E57;box-shadow:0 0 0 4px #CCFBF1}.tl .step b{color:var(--ink);font-size:14px;font-weight:600}.tl .step small{display:block;margin-top:2px;color:var(--muted);font-family:var(--mono);font-size:11px}
.canvas{position:relative;overflow-x:auto;padding:28px 18px;background:#EDFAF7;border:1px dashed var(--color-primary);border-radius:4px}.flowrow{display:flex;align-items:center;min-width:720px}.node{width:132px;flex:none;padding:13px 11px;text-align:center;background:#fff;border:1px solid var(--line);border-top:4px solid var(--color-primary);border-radius:4px;box-shadow:4px 4px 0 rgba(13,148,136,.1)}.node.start{background:#DDF8F3;border-color:var(--color-primary)}.node.cond{background:#FFFBEB;border-color:var(--color-accent)}.node.end{background:#F0FDF4;border-color:#15803D}.node .ni{display:grid;place-content:center;width:34px;height:34px;margin:0 auto 7px;color:#075E57;background:#CCFBF1;border-radius:3px}.node.cond .ni{color:#92400E;background:#FEF3C7}.node.end .ni{color:#166534;background:#DCFCE7}.node .ni .material-symbols-outlined{font-size:20px}.node b{display:block;color:var(--ink);font-size:13px;font-weight:600}.node small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.arrow{width:34px;flex:none;color:var(--tl-d);text-align:center}.arrow .material-symbols-outlined{font-size:22px}
.palette{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:7px 12px;color:var(--body);background:#fff;border:1px solid var(--line);border-radius:3px;font-size:13px;font-weight:600;transition:background-color .2s ease,border-color .2s ease,transform .2s ease}.chip:hover{background:#DDF8F3;border-color:var(--color-primary);transform:translateY(-2px)}.chip .material-symbols-outlined{color:var(--tl-d);font-size:17px}
.fld{margin-bottom:14px}.fld label{display:block;margin-bottom:6px;color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.025em}.fld .ipt{min-height:43px;padding:10px 12px;color:var(--body);background:#F8FCFB;border:1px solid var(--line);border-radius:3px;font-size:14px}.fld .ipt:focus-within{border-color:var(--color-ring);box-shadow:0 0 0 3px rgba(13,148,136,.18)}.fld .ipt.big{min-height:72px}.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.col{min-width:0;padding:13px;background:#EDFAF7;border:1px solid var(--line);border-radius:4px}.col h4{display:flex;align-items:center;gap:7px;margin:0 0 11px;color:var(--ink);font-size:14px;font-weight:600}.col h4 .cnt{margin-left:auto;padding:2px 8px;color:#40545F;background:#fff;border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11px}.dcard{margin-bottom:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:2px 2px 0 rgba(13,148,136,.07);transition:border-color .2s ease,transform .2s ease}.dcard:hover{border-color:var(--color-primary);transform:translateY(-2px)}.dcard:last-child{margin-bottom:0}.dcard b{color:var(--ink);font-size:13px;font-weight:600}.dcard .who{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--body);font-size:12px}.mini{display:grid;place-content:center;width:25px;height:25px;flex:none;color:#075E57;background:#CCFBF1;border:1px solid var(--line);border-radius:50%;font-size:11px;font-weight:600}.dcard small{display:block;margin-top:7px;color:var(--muted);font-family:var(--mono);font-size:11px}.prog{height:7px;margin-top:10px;overflow:hidden;background:#D8E8E6;border-radius:0}.prog span{display:block;height:100%;background:var(--color-primary)}.lgd{color:var(--muted);font-size:12px;font-weight:600}.lgd i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:middle}
#view>.vh~*{animation:reveal .4s cubic-bezier(.34,1.3,.64,1) both}
#view>.vh~*:nth-child(2){animation-delay:.04s}#view>.vh~*:nth-child(3){animation-delay:.10s}#view>.vh~*:nth-child(4){animation-delay:.16s}
.kpis .kpi{animation:reveal .4s cubic-bezier(.34,1.3,.64,1) both}.kpis .kpi:nth-child(2){animation-delay:.06s}.kpis .kpi:nth-child(3){animation-delay:.12s}.kpis .kpi:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g14{grid-template-columns:minmax(0,1.25fr) minmax(260px,1fr)}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:14px 16px}.brand{padding-bottom:14px}.side .foot,.navlbl{display:none}nav{flex-direction:row;overflow-x:auto;padding:2px 1px 7px;scrollbar-width:thin}nav button{flex:0 0 auto;min-height:44px;padding:9px 12px}nav button.on::before{display:none}.top{top:0;min-height:64px}.top .mb{display:none}}
@media (max-width:768px){.body{padding:22px 16px 40px}.top{padding:10px 16px}.g2,.g3,.g14,.cols{grid-template-columns:1fr}.card{padding:18px}.chart{height:240px}.frow{grid-template-columns:1fr}.vh{margin-bottom:18px}.vh h2{font-size:30px}}
@media (max-width:560px){.side{padding:12px}.brand{margin-bottom:8px}.brand .lg{width:40px;height:40px}nav button{width:44px;justify-content:center;padding:9px}nav button .nt{display:none}.top h1{font-size:18px}.top .sub{display:none}.live{padding:7px 9px}.live .dot{flex:none}.ava{width:36px;height:36px}.body{padding:18px 12px 34px}.kpis{grid-template-columns:1fr;gap:10px}.kpi{padding:16px}.card{padding:16px}.card>h3{font-size:18px;flex-wrap:wrap}.card>h3::after{display:none}.card>h3 .grow{width:100%;margin:2px 0 0 29px}.btn{min-height:44px}.tbl th,.tbl td{padding:11px 10px}.chart{height:220px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}#view>.vh~*,.kpis .kpi{animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="lg"><span class="material-symbols-outlined">how_to_reg</span></div>
      <div><b>HR e-Workflow</b><small>人事電子簽核系統</small></div>
    </div>

    mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#37514d"}},
      series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],avoidLabelOverlap:false,label:{show:false},
        data:[{value:14,name:"請假",itemStyle:{color:"#0f766e"}},{value:9,name:"加班",itemStyle:{color:"#5eead4"}},{value:7,name:"報支",itemStyle:{color:"#2dd4bf"}},{value:5,name:"請購",itemStyle:{color:"#99f6e4"}},{value:3,name:"其他",itemStyle:{color:"#cbd5e1"}}]}]});
  }else if(i===4){
    mk("c4",{grid:{left:6,right:14,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},
      xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLabel:axis.axisLabel,axisLine:axis.axisLine},
      yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef5f3"}},axisLabel:axis.axisLabel},
      series:[{type:"bar",data:[18,22,17,25,24,28],itemStyle:{color:"#0f766e",borderRadius:[6,6,0,0]}}]});
  }else if(i===5){
    mk("c5",{grid:{left:6,right:14,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},
      yAxis:{type:"category",data:["完成歸檔","HR 覆核","部級主管","直屬主管","填單提交"],axisLabel:axis.axisLabel,axisLine:axis.axisLine},
      xAxis:{type:"value",splitLine:{lineStyle:{color:"#eef5f3"}},axisLabel:axis.axisLabel,name:"小時"},
      series:[{type:"bar",data:[2,6.5,9,11,0.5],itemStyle:{color:"#5eead4",borderRadius:[0,6,6,0]}}]});
  }
}

/* ---------- render ---------- */
var nav=document.getElementById("nav"),view=document.getElementById("view"),tt=document.getElementById("tt"),ts=document.getElementById("ts");
nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?"on":"")+'"><span class="material-symbols-outlined">'+m[0]+'</span><span class="nt">'+m[1]+'</span></button>';}).join("");
function show(i){
  nav.querySelectorAll("button[data-i]").forEach(function(b){b.classList.toggle("on",+b.dataset.i===i);});
  tt.textContent=MODS[i][1]; ts.textContent=MODS[i][2];
  var head='<div class="vh"><div><h2>'+MODS[i][1]+'</h2><p>'+MODS[i][2]+'</p></div>'+
    (i===2?'<button class="btn"><span class="material-symbols-outlined">note_add</span>新增表單</button>':i===1?'<button class="btn"><span class="material-symbols-outlined">add</span>新增流程</button>':i===4?'<button class="btn"><span class="material-symbols-outlined">person_add</span>新增代理</button>':'<button class="btn ghost"><span class="material-symbols-outlined">filter_list</span>篩選</button>')+'</div>';
  view.innerHTML=head+SCREENS[i]();
  void view.offsetHeight;
  draw(i);
}
nav.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
