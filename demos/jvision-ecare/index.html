<style>
:root{--accent:#0d9488;--accent2:#2dd4bf;--bg:#0a1512;--panel:#0f1f1b;--panel2:#132a25;--line:#1f3b34;--ink:#e7f4f1;--mut:#7fa39b;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#0b1a17,#0f1f1b);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#04110d;flex:none;box-shadow:0 6px 16px rgba(45,212,191,.28)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent2);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#122b25;color:var(--accent2)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04110d;box-shadow:0 4px 12px rgba(45,212,191,.32)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:rgba(45,212,191,.12);color:var(--accent2);border:1px solid var(--line);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-right:6px;box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}70%{box-shadow:0 0 0 7px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.16),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent2);opacity:.35}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent2)}
.card h3 .r{margin-left:auto}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:rgba(34,197,94,.15);color:#4ade80}.t-warn{background:rgba(245,158,11,.15);color:#fbbf24}.t-bad{background:rgba(239,68,68,.15);color:#f87171}.t-info{background:rgba(56,189,248,.15);color:#7dd3fc}.t-run{background:rgba(45,212,191,.15);color:var(--accent2)}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--panel2)}
table.data td b{font-family:Inter}
table.data tr:hover td{background:rgba(45,212,191,.04)}
.qb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.qb>*{min-width:0}
.qc{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--panel2);position:relative;overflow:hidden}
.qc .rm{font-size:11px;color:var(--mut);font-weight:700}
.qc .no{font-family:Inter;font-weight:800;font-size:30px;line-height:1.1;margin:4px 0}
.qc .dr{font-size:12px;font-family:"Noto Sans TC"}
.qc .st{position:absolute;right:12px;top:12px}
.qc.calling{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
.qc.calling .no{color:var(--accent2);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.qwait{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qpill{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-family:Inter;font-weight:700;font-size:13px;background:var(--panel2)}
.qpill small{color:var(--mut);font-family:"Noto Sans TC";font-weight:600;font-size:10px;margin-left:4px}
.chart{width:100%}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 0}
.ti::before{content:"";position:absolute;left:-17px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(45,212,191,.15)}
.ti.warn::before{background:var(--warn)}.ti.bad::before{background:var(--bad)}
.ti .tm{font-family:Inter;font-size:11px;color:var(--mut);font-weight:700}
.ti b{font-size:13px;font-family:"Noto Sans TC";display:block;margin:2px 0}
.ti small{color:var(--mut);font-size:11.5px}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kan>*{min-width:0}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px}
.kcol .kh{display:flex;align-items:center;gap:7px;font-family:"Noto Sans TC";font-size:12.5px;font-weight:700;margin-bottom:9px}
.kcol .kh .n{margin-left:auto;background:var(--panel);border-radius:20px;padding:1px 9px;font-family:Inter;font-size:11px;color:var(--mut)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px}
.kcard b{font-size:12.5px;font-family:"Noto Sans TC"}
.kcard .mt{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--mut)}
.kcard:last-child{margin-bottom:0}
.fun{display:flex;flex-direction:column;gap:7px}
.fr{display:flex;align-items:center;gap:11px}
.fbar{height:38px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 13px;color:#04110d;font-weight:800;font-family:Inter;min-width:56px}
.fr .fl{width:96px;font-size:12px;font-family:"Noto Sans TC";color:var(--mut);flex:none;text-align:right}
.mtx{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.mtx th,.mtx td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
.mtx th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--panel2)}
.mtx td:first-child,.mtx th:first-child{text-align:left;font-family:"Noto Sans TC"}
.cell{display:inline-block;min-width:46px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:11.5px;color:#04110d;font-family:Inter}
.lines{display:flex;flex-direction:column;gap:11px}
.lr{display:grid;grid-template-columns:118px 1fr 42px;gap:11px;align-items:center}.lr>*{min-width:0}
.lr b{font-size:12px;font-family:"Noto Sans TC"}
.bar{height:13px;background:var(--panel2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lr small{font-size:12.5px;font-weight:700;text-align:right;font-family:Inter}
.ev{display:flex;flex-direction:column;gap:9px}
.ei{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:rgba(245,158,11,.07);border-radius:0 10px 10px 0;padding:10px 12px}
.ei.bad{border-color:var(--bad);background:rgba(239,68,68,.07)}.ei.info{border-color:var(--info);background:rgba(56,189,248,.07)}
.ei .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.ei.bad .material-symbols-outlined{color:var(--bad)}.ei.info .material-symbols-outlined{color:var(--info)}
.ei b{font-size:12.5px;font-family:"Noto Sans TC"}
.ei small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ei .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.mb{margin-top:16px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.qb,.kan{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.qb{grid-template-columns:1fr 1fr}}
</style>
</head>
