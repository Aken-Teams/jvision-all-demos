<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>照護服務管理 · eCare 照護戰情台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFFFFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --mut:#475569;
  --line:#164E63;
  --accent:#0891B2;
  --accent2:#22D3EE;
  --bg:#ECFEFF;
  --panel:#FFFFFF;
  --panel2:#E8F1F6;
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow:6px 6px 0 #164E63;
}
*{box-sizing:border-box}
html{color-scheme:light;background:var(--color-background)}
body{
  margin:0;
  min-width:320px;
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(8,145,178,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(8,145,178,.12) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Atkinson Hyperlegible",sans-serif;
  font-size:16px;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-size:21px;line-height:1;vertical-align:middle}
.top{
  position:sticky;
  z-index:20;
  top:0;
  display:grid;
  grid-template-columns:minmax(230px,.7fr) minmax(560px,1.8fr);
  align-items:stretch;
  gap:0;
  padding:0;
  background:var(--color-card);
  border-bottom:3px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  padding:13px 20px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  border-right:3px solid var(--line);
}
.logo{
  display:grid;
  flex:none;
  width:46px;
  height:46px;
  place-items:center;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:3px solid #000;
  border-radius:0;
  box-shadow:4px 4px 0 #000;
  font-size:22px;
  font-weight:700;
}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.1}
.brand span{display:block;margin-top:3px;color:#0F172A;font-size:11px;font-weight:700;letter-spacing:.13em}
.nav{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  min-width:0;
  margin:0;
  overflow-x:auto;
  background:var(--color-card);
}
.nav button{
  min-height:72px;
  min-width:92px;
  padding:9px 8px;
  border:0;
  border-right:1px solid var(--color-border);
  border-radius:0;
  background:transparent;
  color:var(--color-muted-foreground);
  font-weight:700;
  font-size:13px;
  line-height:1.2;
  white-space:nowrap;
}
.nav button:last-child{border-right:0}
.nav button .material-symbols-outlined{display:block;margin:0 auto 7px;font-size:22px}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:inset 0 -7px 0 #000;
}
.wrap{width:min(100%,1440px);margin:0 auto;padding:30px 28px 48px}
.vh{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:20px;
  margin:0 0 26px;
  padding:22px 24px;
  background:var(--color-card);
  border:3px solid var(--line);
  box-shadow:var(--shadow);
}
.vh h2{margin:0;font-size:clamp(28px,4vw,48px);font-weight:700;line-height:.95;letter-spacing:-.04em}
.vh p{max-width:700px;margin:12px 0 0;color:var(--color-muted-foreground);font-size:15px;font-weight:700}
.live{
  align-self:start;
  padding:9px 13px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:2px solid #000;
  border-radius:0;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.live i{
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:8px;
  background:#000;
  border:2px solid #000;
  border-radius:0;
  animation:status-pulse 1.8s steps(2,end) infinite;
}
@keyframes status-pulse{50%{background:#FFF}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi{
  position:relative;
  min-width:0;
  min-height:156px;
  overflow:hidden;
  padding:18px;
  background:var(--color-card);
  border:3px solid var(--line);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.kpi:nth-child(even){transform:translateY(9px)}
.kpi::after{content:"";position:absolute;right:0;bottom:0;width:34px;height:34px;background:var(--color-secondary);border-top:3px solid var(--line);border-left:3px solid var(--line)}
.kpi .l{max-width:75%;color:var(--color-muted-foreground);font-size:13px;font-weight:700}
.kpi .v{margin-top:10px;font-size:clamp(30px,3vw,44px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px!important}
.kpi .d{margin-top:10px;font-size:12px;font-weight:700}
.kpi .ic{position:absolute;top:16px;right:16px;color:var(--color-primary);font-size:28px;opacity:1}
.up{color:var(--ok)}
.dn{color:var(--bad)}
.grid{display:grid;gap:20px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;
  padding:19px;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:3px solid var(--line);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.card:nth-child(even){box-shadow:8px 8px 0 var(--color-primary)}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:35px;
  margin:-19px -19px 17px;
  padding:11px 14px;
  background:var(--color-muted);
  border-bottom:3px solid var(--line);
  font-size:15px;
  font-weight:700;
  line-height:1.25;
  flex-wrap:wrap;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card h3 .r{margin-left:auto}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:2px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{background:#D1FAE5;color:#065F46}
.t-ok::before{content:"✓ ";font-weight:700}
.t-warn{background:#FEF3C7;color:#854D0E}
.t-warn::before{content:"! ";font-weight:700}
.t-bad{background:#FEE2E2;color:#B91C1C}
.t-bad::before{content:"× ";font-weight:700}
.t-info{background:#E0F2FE;color:#075985}
.t-info::before{content:"i ";font-weight:700}
.t-run{background:#CFFAFE;color:#155E75}
.t-run::before{content:"● ";font-weight:700}
.scroll{overflow-x:auto;border:2px solid var(--line)}
table.data,.mtx{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mtx{min-width:560px}
table.data th,table.data td,.mtx th,.mtx td{padding:11px 12px;border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);text-align:left}
table.data th:last-child,table.data td:last-child,.mtx th:last-child,.mtx td:last-child{border-right:0}
table.data tr:last-child td,.mtx tr:last-child td{border-bottom:0}
table.data th,.mtx th{background:var(--color-secondary);color:var(--color-on-secondary);font-size:12px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
table.data tbody tr:nth-child(even) td,.mtx tr:nth-child(odd) td{background:#F5FDFF}
table.data tr:hover td,.mtx tr:hover td{background:#DFFAFE}
table.data td b,.mtx td b{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;font-variant-numeric:tabular-nums}
table.data td:nth-child(3),table.data td:nth-child(4),.mtx td:not(:first-child){text-align:right}
.mtx th:not(:first-child){text-align:right}
.qb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.qc{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:15px;
  background:var(--color-muted);
  border:2px solid var(--line);
  border-radius:0;
}
.qc .rm{color:var(--color-muted-foreground);font-size:12px;font-weight:700}
.qc .no{margin:9px 0 4px;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.qc .dr{font-size:13px;font-weight:700}
.qc .st{position:absolute;top:10px;right:10px}
.qc.calling{background:var(--color-secondary);border:4px solid #000;box-shadow:5px 5px 0 var(--color-primary)}
.qc.calling .no{color:#000;animation:calling-flash 1.4s steps(2,end) infinite}
@keyframes calling-flash{50%{opacity:.45}}
.qwait{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.qpill{padding:6px 10px;background:#FFF;border:2px solid var(--line);border-radius:0;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:700}
.qpill small{margin-left:6px;color:var(--color-muted-foreground);font-family:"Atkinson Hyperlegible",sans-serif;font-size:11px;font-weight:700}
.chart{width:100%;min-height:260px}
.apexcharts-text,.apexcharts-legend-text{fill:var(--color-muted-foreground)!important;color:var(--color-muted-foreground)!important;font-family:"Atkinson Hyperlegible",sans-serif!important}
.apexcharts-gridline{stroke:var(--color-border)!important}
.apexcharts-tooltip{border:2px solid var(--line)!important;border-radius:0!important;box-shadow:4px 4px 0 var(--line)!important}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:4px;background:var(--line)}
.ti{position:relative;padding:0 0 20px}
.ti::before{content:"";position:absolute;top:3px;left:-25px;width:15px;height:15px;background:var(--color-accent);border:3px solid var(--line);border-radius:0}
.ti.warn::before{background:#FBBF24}
.ti.bad::before{background:var(--bad)}
.ti .tm{color:var(--color-muted-foreground);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:700}
.ti b{display:block;margin:3px 0;font-size:14px;font-weight:700}
.ti small{color:var(--color-muted-foreground);font-size:12px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.kcol{min-width:0;padding:12px;background:var(--color-muted);border:2px solid var(--line);border-radius:0}
.kcol .kh{display:flex;align-items:center;gap:7px;margin-bottom:11px;padding-bottom:9px;border-bottom:2px solid var(--line);font-size:13px;font-weight:700}
.kcol .kh .n{margin-left:auto;padding:1px 8px;background:var(--color-card);border:2px solid var(--line);border-radius:0;color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px}
.kcard{margin-bottom:10px;padding:11px;background:var(--color-card);border:2px solid var(--line);border-radius:0;box-shadow:3px 3px 0 var(--color-primary)}
.kcard:last-child{margin-bottom:0}
.kcard b{font-size:13px}
.kcard .mt{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--color-muted-foreground);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;font-variant-numeric:tabular-nums}
.fun{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.fr{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:12px}
.fr .fl{color:var(--color-muted-foreground);font-size:12px;font-weight:700;text-align:right}
.fbar{display:flex;align-items:center;min-width:58px;height:40px;padding:0 12px;background:var(--color-primary);color:#000;border:2px solid #000;border-radius:0;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;font-variant-numeric:tabular-nums}
.cell{display:inline-block;min-width:54px;padding:5px 8px;border:2px solid #000;border-radius:0;color:#000;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.lines{display:flex;flex-direction:column;gap:13px}
.lr{display:grid;grid-template-columns:124px minmax(0,1fr) 44px;align-items:center;gap:11px}
.lr>*{min-width:0}
.lr b{font-size:12px}
.bar{height:16px;overflow:hidden;background:var(--color-muted);border:2px solid var(--line);border-radius:0}
.bar i{display:block;height:100%;background:var(--color-primary);border-right:2px solid var(--line);border-radius:0}
.lr small{text-align:right;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ev{display:flex;flex-direction:column;gap:10px}
.ei{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;background:#FEF3C7;border:2px solid #854D0E;border-left:8px solid #854D0E;border-radius:0}
.ei.bad{background:#FEE2E2;border-color:#B91C1C}
.ei.info{background:#E0F2FE;border-color:#075985}
.ei .material-symbols-outlined{flex:none;color:#854D0E;font-size:20px}
.ei.bad .material-symbols-outlined{color:#B91C1C}
.ei.info .material-symbols-outlined{color:#075985}
.ei b{font-size:13px}
.ei small{display:block;margin-top:2px;color:var(--color-muted-foreground);font-size:12px}
.ei .tm{flex:none;margin-left:auto;color:var(--color-muted-foreground);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--color-muted-foreground);font-size:12px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:12px;height:12px;border:2px solid #000;border-radius:0}
.mb{margin-top:22px}
.kpis>*,.grid>*,.qb>*,.kan>*{animation:grid-enter .4s cubic-bezier(.34,1.56,.64,1) both}
.kpis>*:nth-child(2),.grid>*:nth-child(2),.qb>*:nth-child(2),.kan>*:nth-child(2){animation-delay:.06s}
.kpis>*:nth-child(3),.qb>*:nth-child(3),.kan>*:nth-child(3){animation-delay:.12s}
.kpis>*:nth-child(4),.qb>*:nth-child(4){animation-delay:.18s}
@keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:1024px){
  .top{grid-template-columns:1fr}
  .brand{border-right:0;border-bottom:3px solid var(--line)}
  .nav button{min-height:60px}
  .wrap{padding:24px 20px 42px}
  .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .nav{grid-template-columns:repeat(6,minmax(82px,1fr))}
  .vh{grid-template-columns:1fr;padding:18px}
  .vh h2{font-size:36px}
  .live{justify-self:start;white-space:normal}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
  .kpi:nth-child(even){transform:none}
  .g11,.g3,.qb,.kan{grid-template-columns:1fr}
  .card{padding:16px}
  .card h3{margin:-16px -16px 15px}
}
@media(max-width:480px){
  .brand{padding:11px 14px}
  .logo{width:40px;height:40px}
  .nav button{min-width:72px;min-height:54px;padding:8px 5px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button .material-symbols-outlined{margin:0 auto}
  .wrap{padding:17px 13px 36px}
  .vh{margin-bottom:18px;box-shadow:4px 4px 0 var(--line)}
  .vh h2{font-size:31px}
  .kpis{grid-template-columns:1fr}
  .kpi{min-height:140px}
  .fr{grid-template-columns:88px minmax(0,1fr)}
  .lr{grid-template-columns:100px minmax(0,1fr) 34px;gap:7px}
  .ei{flex-wrap:wrap}
  .ei .tm{width:100%;margin-left:31px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .kpis>*,.grid>*,.qb>*,.kan>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">護</div><div><b>照護服務管理</b><span>ECARE OPS TERMINAL</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="live" id="live"><i></i>晨光聯合診所 · 今日看診中</div></div>
  <div id="view"></div>
</main>
<script>
var MOD=[
["預約報到","event_available","預約報到台","線上預約、現場報到與候診叫號即時看板","監控 4 診間 · 今日 128 診次"],
["病歷照護","clinical_notes","病歷照護紀錄","病患主檔、就診病歷與長者照護交班紀錄","在案病患 1,842 位 · 今日就診 96"],
["診療處置","stethoscope","診療醫囑處置","診斷、醫囑處方與護理處置排程看板","今日醫囑 214 筆 · 待處置 8"],
["申報請款","receipt_long","健保申報請款","健保申報、退件核對與請款結算","本月申報 3,120 件 · 退件 59"],
["回診追蹤","notifications_active","回診追蹤提醒","回診名單、主動提醒與完成率追蹤","待回診 214 位 · 逾期 18"],
["藥材庫存","inventory_2","藥材庫存管理","藥品耗材效期、安全庫存與請領補貨","品項 486 項 · 效期預警 9"]
];
var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd'),live=document.getElementById('live');
MOD.forEach(function(m,i){var b=document.createElement('button');b.dataset.i=i;b.className=i===0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=function(){show(i);};nav.appendChild(b);});

// ---- fake data ----
