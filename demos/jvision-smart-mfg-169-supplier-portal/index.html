<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

<style>
:root{
--color-primary:#1E40AF;--color-on-primary:#FFF;--color-secondary:#3B82F6;--color-on-secondary:#000;
--color-accent:#16A34A;--color-on-accent:#000;--color-background:#EFF6FF;--color-foreground:#1E3A8A;
--color-card:#FFF;--color-card-foreground:#1E3A8A;--color-muted:#E9EFF5;--color-muted-foreground:#475569;
--color-border:#BFDBFE;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#1E40AF;
--blue:#1E40AF;--ink:#172554;--muted:#475569;--line:#BFDBFE;
--panel:#FFF;--soft:#DBEAFE;--ok:#15803D;--warn:#A16207;--bad:#DC2626;--shadow:0 8px 24px rgba(30,64,175,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100vh;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;overflow-x:hidden}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 16px;background:#fff;border-right:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px;border-bottom:1px solid var(--color-muted)}
.logo{display:grid;place-items:center;width:42px;height:42px;flex:none;color:#fff;background:var(--blue);border-radius:8px;box-shadow:5px 5px 0 #93C5FD}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span:not(.material-symbols-outlined){display:block;margin-top:3px;color:var(--muted);font:500 10px "Fira Code",monospace}
.navlist{display:flex;flex-direction:column;gap:4px;margin-top:20px}
.nlab{padding:11px 10px 5px;color:#64748B;font:600 10px "Fira Code",monospace;letter-spacing:.13em}
.nav{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 12px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:6px;text-align:left;font-weight:600;transition:background .22s,color .22s,border-color .22s,transform .22s}
.nav:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE;transform:translateX(2px)}
.nav.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:4px 4px 0 #93C5FD}
.sideftr{margin-top:auto;padding:18px 8px 0;border-top:1px solid var(--color-muted)}
.who{display:flex;align-items:center;gap:10px}
.avatar{display:grid;place-items:center;width:36px;height:36px;flex:none;color:var(--blue);background:#DBEAFE;border:1px solid #93C5FD;border-radius:50%;font-weight:700}
.nm{font-size:12px;font-weight:700}.rl{margin-top:2px;color:var(--muted);font:10px "Fira Code",monospace}
.main{min-width:0;padding:34px clamp(18px,3vw,48px) 64px}
#app{max-width:1480px;margin:auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--blue)}
.head h1{margin:0 0 6px;color:var(--color-foreground);font-size:clamp(24px,3vw,34px);line-height:1.1;letter-spacing:-.03em}
.head p{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill,.bdg{display:inline-flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.pill{min-height:34px;padding:6px 11px;color:var(--blue);background:#fff;border:1px solid #93C5FD;border-radius:999px;font-size:12px}
.pill.w{color:#854D0E;background:#FEFCE8;border-color:#FACC15}
.grid{display:grid;gap:16px;min-width:0}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g23{grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr)}.g32{grid-template-columns:minmax(290px,1fr) minmax(0,1.7fr)}
.card,.kpi{min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card{padding:20px}.card h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--color-foreground);font-size:14px}
.card h3>.material-symbols-outlined{color:var(--blue)}.sub{margin-left:auto;color:var(--muted);font-size:10px;font-weight:500}
.kpi{position:relative;padding:18px 18px 17px;overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s}
.kpi:before{position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue);content:""}
.kpi:hover{transform:translateY(-3px);border-color:#60A5FA;box-shadow:0 14px 30px rgba(30,64,175,.13)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lab span{color:var(--blue)}.kpi .val{margin-top:12px;color:#172554;font:700 27px "Fira Code",monospace;letter-spacing:-.04em}
.kpi .val small{margin-left:4px;color:var(--muted);font:500 12px "Fira Sans",sans-serif}
.delta{margin-top:6px;color:var(--muted);font-size:11px;font-weight:600}.up{color:#166534}.down{color:#B91C1C}
.scroll{overflow:auto;border:1px solid #DBEAFE;border-radius:6px}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
.tbl th{padding:11px 10px;color:#334155;background:#EFF6FF;border-bottom:2px solid #93C5FD;text-align:left;font-size:11px;letter-spacing:.02em;white-space:nowrap}
.tbl td{padding:11px 10px;color:var(--ink);border-bottom:1px solid #E2E8F0}
.tbl tbody tr:last-child td{border-bottom:0}.tbl tbody tr{transition:background .2s}.tbl tbody tr:hover td{background:#F8FAFC}
.tbl td:first-child,.mini,.tm,.dn,.step .sn{font-family:"Fira Code",monospace}
.tbl td:nth-child(3),.tbl th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
.bdg{padding:4px 8px;border:1px solid currentColor;border-radius:4px;font-size:10px}
.bdg:before{width:6px;height:6px;background:currentColor;border-radius:50%;content:""}
.b-ok{color:#166534;background:#F0FDF4}.b-warn{color:#854D0E;background:#FEFCE8}.b-bad{color:#B91C1C;background:#FEF2F2}
.b-ind{color:#1E40AF;background:#EFF6FF}.b-cy{color:#075985;background:#F0F9FF}
.bar{width:64px;min-width:60px;height:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar i{display:block;height:100%;background:var(--blue)}
.chartbox{width:100%;min-width:0;overflow:hidden}.mini{color:#64748B;font-size:10px}.note{display:flex;align-items:flex-start;gap:8px;padding:12px;color:#1E3A8A;background:#EFF6FF;border:1px solid #93C5FD;border-left:4px solid var(--blue);border-radius:4px;font-size:12px}
.todo,.riskbar,.chat{display:flex;flex-direction:column;gap:10px}
.todoi{display:flex;align-items:center;gap:12px;min-width:0;padding:12px;background:#fff;border:1px solid #DBEAFE;border-radius:6px;transition:transform .22s,border-color .22s,box-shadow .22s}
.todoi:hover{transform:translateX(3px);border-color:#60A5FA;box-shadow:4px 4px 0 #DBEAFE}
.tico,.dico{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:6px}.ti-a,.dico{color:#1E40AF;background:#DBEAFE}.ti-w{color:#854D0E;background:#FEF3C7}.ti-b{color:#B91C1C;background:#FEE2E2}
.tx,.dx{min-width:0;flex:1}.tt,.dn,.rn{font-size:12px;font-weight:700}.ts,.dm,.rd{margin-top:3px;color:var(--muted);font-size:11px}.todoi .tm{flex:none;color:#64748B;font-size:10px}
.docl{display:flex;flex-direction:column}.docr{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 4px;border-bottom:1px solid #E2E8F0}.docr:last-child{border:0}.dn{overflow-wrap:anywhere}
.tl{position:relative;padding-left:24px}.tl:before{position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:#93C5FD;content:""}
.tli{position:relative;padding:0 0 18px 7px}.tli:before{position:absolute;top:3px;left:-22px;width:10px;height:10px;background:#fff;border:3px solid var(--blue);border-radius:50%;content:""}
.tli .td{margin-top:4px;color:var(--muted);font-size:11px}.tli .tm{margin-top:4px;color:#64748B;font-size:10px}
.riski{min-width:0;padding:13px;background:#fff;border:1px solid #CBD5E1;border-left-width:5px;border-radius:5px}
.riski.hi{border-left-color:var(--bad)}.riski.md{border-left-color:#CA8A04}.riski.lo{border-left-color:#15803D}.rh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.msg{display:flex;gap:9px;max-width:84%}.msg.me{align-self:flex-end;flex-direction:row-reverse}.mav{display:grid;place-items:center;width:31px;height:31px;flex:none;border-radius:50%;font-size:10px;font-weight:700}
.msg.me .mav{color:#fff;background:var(--blue)}.msg.them .mav{color:#334155;background:#E2E8F0}
.mbub{padding:10px 12px;background:#F1F5F9;border:1px solid #CBD5E1;border-radius:7px;font-size:12px}.msg.me .mbub{background:#DBEAFE;border-color:#93C5FD}.mt{margin-top:5px;color:#64748B;font:9px "Fira Code",monospace}
.step-flow{display:flex;gap:9px}.step{position:relative;flex:1;min-width:125px;padding:13px;background:#F8FAFC;border:1px solid #BFDBFE;border-top:4px solid var(--blue);border-radius:5px}
.step .sn{color:var(--blue);font-size:9px;font-weight:700}.step .st{margin-top:5px;font-size:12px;font-weight:700}.step .sr{margin-top:5px;color:var(--muted);font-size:10px}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.grid>*{animation:enter .42s cubic-bezier(.34,1.56,.64,1) both}.grid>*:nth-child(2){animation-delay:.06s}.grid>*:nth-child(3){animation-delay:.12s}.grid>*:nth-child(4){animation-delay:.18s}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}.step-flow{flex-wrap:wrap}}
@media(max-width:768px){.layout{display:block}.side{position:sticky;width:100%;height:auto;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0;border:0}.brand .logo{width:36px;height:36px}.navlist{flex-direction:row;width:100%;margin-top:10px;overflow-x:auto}.nlab,.sideftr{display:none}.nav{width:auto;flex:none;min-height:42px;padding:9px}.nav:hover{transform:none}.main{padding:20px 15px 48px}.head{align-items:flex-start;flex-direction:column}.g2{grid-template-columns:1fr}}
@media(max-width:480px){.g4,.g3{grid-template-columns:1fr}.ntx{display:none}.step-flow{flex-direction:column}.msg{max-width:94%}.card{padding:15px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important;transform:none!important}}
</style>
</head>

function icon(n){return'<span class="material-symbols-outlined">'+n+"</span>"}
function head(t,p,x){return'<div class="head"><div><h1>'+t+"</h1><p>"+p+'</p></div><div class="row">'+x+"</div></div>"}
function pill(i,t,c){return'<span class="pill '+(c||"")+'">'+icon(i)+t+"</span>"}
function kpi(i,l,v,u,d,x){return'<div class="kpi"><div class="lab">'+icon(i)+l+'</div><div class="val">'+v+(u?"<small>"+u+"</small>":"")+'</div>'+(x?'<div class="delta '+(d||"")+'">'+(d?icon(d==="up"?"trending_up":"trending_down"):"")+x+"</div>":"")+"</div>"}
