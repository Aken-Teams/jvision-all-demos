<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供應商入口網站（Supplier Portal）｜協同平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#f1f5f4;--panel:#ffffff;--sidebar:#ffffff;--line:#e2e8e6;--line2:#eef2f1;
  --ink:#0f2622;--muted:#5b7a75;--dim:#8aa39e;
  --accent:#0f766e;--accent2:#5eead4;--accent3:#14b8a6;--accentSoft:#e6f6f3;
  --ok:#0f9d76;--warn:#d97706;--bad:#dc2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.layout{display:flex;min-height:100vh;align-items:stretch;}
.side{
  width:236px;flex:0 0 236px;background:var(--sidebar);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;min-width:0;}
.brand .logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.32);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-size:15px;letter-spacing:.2px;white-space:nowrap;display:block;}
.brand span{font-size:11px;color:var(--dim);display:block;margin-top:1px;}
.navlist{display:flex;flex-direction:column;gap:4px;margin-top:6px;min-width:0;}
.nlab{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.6px;padding:8px 10px 4px;text-transform:uppercase;}
.nav{
  display:flex;align-items:center;gap:11px;min-width:0;text-align:left;width:100%;
  padding:10px 11px;border-radius:11px;border:1px solid transparent;
  background:transparent;color:var(--muted);font-size:13.5px;cursor:pointer;
  font-family:inherit;transition:.15s;white-space:nowrap;font-weight:600;
}
.nav .material-symbols-outlined{font-size:20px;flex:0 0 auto;}
.nav:hover{color:var(--accent);background:var(--accentSoft);}
.nav.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent3));border-color:transparent;box-shadow:0 6px 16px rgba(15,118,110,.28);}
.sideftr{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--line2);}
.sideftr .who{display:flex;align-items:center;gap:9px;min-width:0;}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;}
.sideftr .nm{font-size:12.5px;font-weight:700;white-space:nowrap;}
.sideftr .rl{font-size:10.5px;color:var(--dim);}
.main{flex:1;min-width:0;padding:24px 26px 60px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.head h1{font-size:22px;margin:0 0 5px;font-weight:800;letter-spacing:.2px;}
.head p{margin:0;color:var(--muted);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--accent);}
.pill .material-symbols-outlined{font-size:16px;}
.pill.w{color:var(--warn);border-color:#f3d9ac;background:#fef6e9;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.7fr 1fr;}
.g32{grid-template-columns:1fr 1.7fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0;box-shadow:0 1px 2px rgba(15,38,34,.03);}
.card h3{margin:0 0 13px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.sub{font-size:11px;color:var(--dim);font-weight:500;margin-left:auto;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;position:relative;overflow:hidden;min-width:0;box-shadow:0 1px 2px rgba(15,38,34,.03);}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:800;margin-top:9px;letter-spacing:.3px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11px;margin-top:5px;font-weight:700;}
.up{color:var(--ok);}.down{color:var(--bad);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
.tbl th{text-align:left;color:var(--dim);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;}
.tbl td{padding:10px;border-bottom:1px solid var(--line2);color:var(--ink);}
.tbl tr:hover td{background:var(--accentSoft);}
.tbl b{font-weight:700;}
.scroll{overflow-x:auto;}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.b-ok{background:rgba(15,157,118,.13);color:var(--ok);}
.b-warn{background:rgba(217,119,6,.13);color:var(--warn);}
.b-bad{background:rgba(220,38,38,.11);color:var(--bad);}
.b-ind{background:var(--accentSoft);color:var(--accent);}
.b-cy{background:rgba(20,184,166,.13);color:var(--accent3);}
.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;min-width:60px;}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent3));}
.chartbox{width:100%;overflow:hidden;min-width:0;}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;}
.mini{font-size:11px;color:var(--dim);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px;}
.legend span{display:flex;align-items:center;gap:5px;}
.note{background:var(--accentSoft);border:1px solid #bfe8e2;border-radius:11px;padding:11px 12px;font-size:12px;color:var(--accent);display:flex;gap:8px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:18px;flex:0 0 auto;}
/* signature: supplier task inbox */
.todo{display:flex;flex-direction:column;gap:9px;}
.todoi{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0;transition:.15s;}
.todoi:hover{border-color:var(--accent2);box-shadow:0 4px 12px rgba(15,118,110,.08);}
.tico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tico .material-symbols-outlined{font-size:20px;}
.ti-a{background:var(--accentSoft);color:var(--accent);}
.ti-w{background:#fef6e9;color:var(--warn);}
.ti-b{background:#fdeaea;color:var(--bad);}
.todoi .tx{min-width:0;flex:1;}
.todoi .tt{font-size:13px;font-weight:700;}
.todoi .ts{font-size:11.5px;color:var(--muted);margin-top:2px;}
.todoi .tm{font-size:11px;color:var(--dim);white-space:nowrap;flex:0 0 auto;}
/* doc rows */
.docl{display:flex;flex-direction:column;gap:0;}
.docr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line2);min-width:0;}
.docr:last-child{border-bottom:none;}
.dico{width:36px;height:36px;border-radius:9px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.dico .material-symbols-outlined{font-size:19px;}
.docr .dx{min-width:0;flex:1;}
.docr .dn{font-size:12.5px;font-weight:700;word-break:break-all;}
.docr .dm{font-size:11px;color:var(--dim);margin-top:2px;}
/* timeline */
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 15px 6px;}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--accent2);}
.tli .tt{font-weight:700;font-size:13px;}
.tli .td{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tli .tm{font-size:10.5px;color:var(--dim);margin-top:3px;}
/* chat / message */
.chat{display:flex;flex-direction:column;gap:11px;}
.msg{display:flex;gap:9px;max-width:82%;min-width:0;}
.msg.me{margin-left:auto;flex-direction:row-reverse;}
.msg .mav{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.msg.me .mav{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;}
.msg.them .mav{background:var(--line2);color:var(--muted);}
.mbub{border-radius:12px;padding:9px 12px;font-size:12.5px;min-width:0;}
.msg.me .mbub{background:var(--accentSoft);border:1px solid #bfe8e2;color:var(--ink);border-top-right-radius:3px;}
.msg.them .mbub{background:var(--line2);border-top-left-radius:3px;}
.mbub .mt{font-size:10px;color:var(--dim);margin-top:4px;}
/* step flow */
.step-flow{display:flex;gap:8px;flex-wrap:wrap;}
.step{flex:1;min-width:130px;background:var(--line2);border:1px solid var(--line);border-radius:12px;padding:11px;}
.step .sn{font-size:10px;color:var(--dim);font-weight:800;}
.step .st{font-size:12.5px;font-weight:800;margin-top:3px;}
.step .sr{font-size:10.5px;color:var(--accent);margin-top:4px;}
/* risk list */
.riskbar{display:flex;flex-direction:column;gap:10px;}
.riski{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
.riski .rh{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.riski .rn{font-size:12.5px;font-weight:700;}
.riski .rd{font-size:11px;color:var(--muted);margin-top:6px;}
.riski.hi{border-left:4px solid var(--bad);}
.riski.md{border-left:4px solid var(--warn);}
.riski.lo{border-left:4px solid var(--ok);}
@media(max-width:860px){
  .layout{flex-direction:column;}
  .side{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:50;padding:10px 14px;
    flex-direction:row;align-items:center;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line);}
  .brand{padding:0;margin-right:auto;}
  .navlist{flex-direction:row;flex-wrap:wrap;margin-top:0;width:100%;gap:6px;}
  .nlab{display:none;}
  .sideftr{display:none;}
  .nav{width:auto;padding:8px 12px;}
  .main{padding:18px 16px 50px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .step-flow{flex-direction:column;}
}
@media(max-width:560px){
  .nav .ntx{display:none;}
  .nav{padding:8px;}
}
</style>
</head>
<body>

</div>

<script>

var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
function mk(id,opt){

  try{var c=echarts.init(el,null,{renderer:"canvas"});c.setOption(opt);charts.push(c);}catch(e){}
}
var AXTX="#5b7a75",AXLN="#e2e8e6",FONT='Inter,"Noto Sans TC",sans-serif';
function axis(){return{axisLine:{lineStyle:{color:AXLN}},axisTick:{show:false},axisLabel:{color:AXTX,fontFamily:FONT},splitLine:{lineStyle:{color:AXLN}}};}

];

/* ---------- helpers ---------- */
function kpi(ic,lab,val,unit,dir,delta){
  var d=dir?('<div class="delta '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px">'+(dir==="up"?"trending_up":"trending_down")+'</span> '+delta+'</div>'):(delta?'<div class="delta" style="color:var(--dim)">'+delta+'</div>':'');
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
  '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+d+'</div>';
}
function step(n,t,r){return '<div class="step"><div class="sn">STEP '+n+'</div><div class="st">'+t+'</div><div class="sr">'+r+'</div></div>';}
function todoItem(cls,ic,tt,ts,tm){
  return '<div class="todoi"><div class="tico '+cls+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
  '<div class="tx"><div class="tt">'+tt+'</div><div class="ts">'+ts+'</div></div><div class="tm">'+tm+'</div></div>';
}

/* ---------- screen 0: 供應商總覽 ---------- */
function scr0(){return ''+
  '<div class="head"><div><h1>供應商總覽</h1><p>登入入口首頁，掌握待辦、公告與帳號協同概況</p></div>'+

var SCR=[scr0,scr1,scr2,scr3,scr4,scr5];
var CH=[null,charts1,charts2,charts3,null,charts5];

function show(i){
  var navs=document.querySelectorAll("[data-i]");
  for(var t=0;t<navs.length;t++){navs[t].classList.toggle("on",+navs[t].getAttribute("data-i")===i);}
  clearCharts();
  var container=document.getElementById("app");
  container.innerHTML=SCR[i]();
  void container.offsetHeight;
  if(CH[i])CH[i]();
}
var navEl=document.getElementById("nav");
navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
