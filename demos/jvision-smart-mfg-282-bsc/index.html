<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>平衡計分卡管理系統（BSC）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#c2410c;--accent2:#fb923c;--bg:#f8f6f4;--panel:#ffffff;
  --ink:#1c1917;--muted:#78716c;--line:#ede9e6;--soft:#fbf7f4;
  --fin:#c2410c;--cust:#0369a1;--proc:#7c3aed;--learn:#059669;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.app{display:flex;min-height:100vh;flex-direction:column}
header.top{background:linear-gradient(120deg,#7c2d12,#c2410c 55%,#ea580c);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logo .ms{font-size:26px}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11.5px;opacity:.85;font-weight:500}
.top .spacer{flex:1 1 auto}
.top .stat{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;opacity:.9;min-width:0}
.top .stat b{font-size:15px;font-weight:800}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;position:sticky;top:0;z-index:20}
nav.tabs button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:8px 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
nav.tabs button .ms{font-size:19px}
nav.tabs button:hover{border-color:var(--accent2);color:var(--accent)}
nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:18px;max-width:1360px;margin:0 auto;width:100%}
.scr-head{margin-bottom:16px}
.scr-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h2 .ms{color:var(--accent);font-size:24px}
.scr-head p{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card h3 .ms{font-size:19px;color:var(--accent)}
.muted{color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--green)}.down{color:var(--red)}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px}
.list-pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.list-pane .lp-h{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.li{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.li:hover{background:var(--soft)}
.li.on{background:#fff4ec;border-left:4px solid var(--accent)}
.li .li-t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.li .li-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.detail-pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill.g{background:#dcfce7;color:#15803d}.pill.a{background:#fef3c7;color:#b45309}.pill.r{background:#fee2e2;color:#b91c1c}
.pill.fin{background:#ffedd5;color:#c2410c}.pill.cust{background:#e0f2fe;color:#0369a1}
.pill.proc{background:#ede9fe;color:#7c3aed}.pill.learn{background:#d1fae5;color:#059669}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
tbody tr:hover{background:var(--soft)}
.bar-track{height:8px;background:#f1ede9;border-radius:6px;overflow:hidden;min-width:70px}
.bar-fill{height:100%;border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mb12{margin-bottom:12px}.mt14{margin-top:14px}
.chart-wrap{overflow:hidden;min-width:0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.led{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.led.g{background:var(--green)}.led.a{background:var(--amber)}.led.r{background:var(--red)}
.persp{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px}
.persp .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.map-col{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.map-node{border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:600;margin-bottom:8px;color:#fff;line-height:1.35}
.map-node small{display:block;font-weight:500;opacity:.9;font-size:10.5px;margin-top:2px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;font-size:12px;min-width:0}
.tk .tk-t{font-weight:700;margin-bottom:4px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--accent)}
.tl-item .tl-t{font-weight:700;font-size:13px}
.tl-item .tl-m{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-box{border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0}
.stat-box .sb-l{font-size:11px;color:var(--muted);font-weight:600}
.stat-box .sb-v{font-size:19px;font-weight:800;margin-top:3px}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px}
.mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:960px){.split{grid-template-columns:1fr}}
@media(max-width:860px){nav.tabs{overflow-x:auto}}
@media(max-width:820px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr 1fr}
  .mini-grid{grid-template-columns:1fr 1fr}
  .mapgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  nav.tabs button .txt{display:none}
  nav.tabs button{padding:8px 11px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="ms">insights</span></div>
      <div>
        <h1>平衡計分卡管理系統（BSC）</h1>
        <p>策略地圖 · 四構面 KPI · 目標對齊 · 績效追蹤</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="stat"><span>本期策略目標達成率</span><b>82.4%</b></div>
    <div class="stat"><span>指標對齊覆蓋率</span><b>90%</b></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var BASE={chart:{fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function barHtml(pct,color){var w=Math.max(0,Math.min(100,pct));return '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+color+'"></div></div>';}
function ledClass(p){return p>=95?'g':p>=80?'a':'r';}
var PNAME={fin:'財務',cust:'顧客',proc:'流程',learn:'成長'};

var MODULES=[
 {icon:"account_tree",name:"策略地圖",sub:"四構面策略目標與因果連結"},
 {icon:"insights",name:"四構面計分卡",sub:"財務/顧客/流程/學習成長 KPI"},
 {icon:"checklist",name:"指標權責指派",sub:"KPI 樹狀展開與負責人"},
 {icon:"account_tree",name:"部門目標對齊",sub:"策略目標向部門展開對齊"},
 {icon:"monitoring",name:"績效追蹤",sub:"達成率追蹤與燈號預警"},
 {icon:"fact_check",name:"考核回饋",sub:"週期考核與行動方案"}
];

/* ============ SCREEN 0 : 策略地圖 (split) ============ */
var THEMES=[
 {id:"T1",name:"營收成長引擎",owner:"總經理室",status:"g",prog:88,desc:"透過高價值方案與客戶留存推升營收，強化每股盈餘與投資回報。"},
 {id:"T2",name:"顧客價值領先",owner:"行銷處",status:"a",prog:74,desc:"以體驗與交期優勢提升淨推薦值，鞏固關鍵客戶佔比。"},
 {id:"T3",name:"卓越營運效率",owner:"營運處",status:"a",prog:81,desc:"以精實流程與品質管理縮短交期、降低不良，支撐成本領先。"},
 {id:"T4",name:"組織與數位能力",owner:"人資部",status:"r",prog:63,desc:"培育數位人才與系統化知識，作為所有構面的成長基礎。"}
];
var PERSP=[
 {k:"fin",name:"財務構面",color:"var(--fin)",nodes:[{t:"營收成長 +18%",s:"F1 主營收年增"},{t:"EPS 提升",s:"F2 每股盈餘"},{t:"成本領先",s:"F3 單位成本下降"}]},
 {k:"cust",name:"顧客構面",color:"var(--cust)",nodes:[{t:"NPS ≥ 55",s:"C1 淨推薦值"},{t:"關鍵客戶留存 92%",s:"C2 客戶留存"},{t:"準時交貨 98%",s:"C3 OTD"}]},
 {k:"proc",name:"內部流程構面",color:"var(--proc)",nodes:[{t:"製程良率 99.2%",s:"P1 首件良率"},{t:"交期縮短 20%",s:"P2 訂單前置期"},{t:"新品導入 12 件",s:"P3 NPI"}]},
 {k:"learn",name:"學習成長構面",color:"var(--learn)",nodes:[{t:"數位技能覆蓋 85%",s:"L1 人才認證"},{t:"提案改善 240 件",s:"L2 全員提案"},{t:"系統採用率 90%",s:"L3 平台使用"}]}
];
function screen0(){
 var s=state.s0;
 var li=THEMES.map(function(t,i){
   return '<div class="li'+(i===s?' on':'')+'" data-t="'+i+'"><div class="li-t"><span>'+esc(t.name)+'</span><span class="led '+t.status+'"></span></div><div class="li-s">'+esc(t.owner)+' · 達成 '+t.prog+'%</div></div>';
 }).join("");
 var t=THEMES[s];
 var mapCols=PERSP.map(function(p){
   var nodes=p.nodes.map(function(n){return '<div class="map-node" style="background:'+p.color+'">'+esc(n.t)+'<small>'+esc(n.s)+'</small></div>';}).join("");
   return '<div class="map-col"><div class="persp mb12"><span class="dot" style="background:'+p.color+'"></span>'+esc(p.name)+'</div>'+nodes+'</div>';
 }).join("");
 var stName=t.status==='g'?'達標':t.status==='a'?'追蹤':'落後';
 return ''+
 '<div class="scr-head"><h2><span class="ms">account_tree</span>策略地圖</h2><p>將公司願景轉化為四構面策略目標，並建立由下而上的因果連結。</p></div>'+
 '<div class="split">'+
   '<div class="list-pane"><div class="lp-h"><span class="ms">flag</span>策略主題</div>'+li+'</div>'+
   '<div class="detail-pane">'+
     '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap" class="mb12">'+
       '<div style="min-width:0"><div style="font-size:17px;font-weight:800">'+esc(t.name)+'</div><div class="muted" style="font-size:12.5px;margin-top:2px">'+esc(t.desc)+'</div></div>'+
       '<span class="pill '+t.status+'">'+stName+' '+t.prog+'%</span></div>'+
     '<div class="card" style="background:var(--soft);border:none"><h3><span class="ms">hub</span>四構面因果地圖</h3>'+
       '<div class="mapgrid">'+mapCols+'</div>'+
       '<div class="hint"><span class="ms" style="font-size:16px">arrow_upward</span>由下（學習成長）往上（財務）驅動：能力 → 流程 → 顧客 → 財務。</div>'+
     '</div>'+
   '</div>'+
 '</div>';
}

/* ============ SCREEN 1 : 四構面計分卡 ============ */
var SC_PERSP=[
 {k:"fin",name:"財務",weight:35,score:86,color:"#c2410c"},
 {k:"cust",name:"顧客",weight:25,score:79,color:"#0369a1"},
 {k:"proc",name:"內部流程",weight:25,score:84,color:"#7c3aed"},
 {k:"learn",name:"學習成長",weight:15,score:68,color:"#059669"}
];
var SC_KPI=[
 {p:"fin",name:"營收年增率",tgt:"18%",act:"16.4%",r:91},
 {p:"fin",name:"營業利益率",tgt:"14%",act:"13.2%",r:94},
 {p:"cust",name:"淨推薦值 NPS",tgt:"55",act:"48",r:87},
 {p:"cust",name:"準時交貨率",tgt:"98%",act:"96.1%",r:98},
 {p:"proc",name:"製程首件良率",tgt:"99.2%",act:"98.6%",r:99},
 {p:"proc",name:"訂單前置期",tgt:"7 天",act:"8.1 天",r:86},
 {p:"learn",name:"數位技能覆蓋",tgt:"85%",act:"71%",r:84},
 {p:"learn",name:"全員提案件數",tgt:"240",act:"152",r:63}
];
function pName(k){for(var i=0;i<SC_PERSP.length;i++){if(SC_PERSP[i].k===k)return SC_PERSP[i].name;}return k;}
function screen1(){
 var kpiCards=SC_PERSP.map(function(p){
   return '<div class="kpi"><span style="position:absolute;left:0;top:0;bottom:0;width:4px;background:'+p.color+'"></span>'+
    '<div class="lbl">'+esc(p.name)+'構面 · 權重 '+p.weight+'%</div>'+
    '<div class="val">'+p.score+'<small> / 100</small></div>'+
    '<div class="delta '+(p.score>=80?'up':'down')+'"><span class="ms" style="font-size:15px">'+(p.score>=80?'trending_up':'trending_down')+'</span>'+(p.score>=80?'達標區':'待改善')+'</div></div>';
 }).join("");
 var rows=SC_KPI.map(function(k){
   return '<tr><td><span class="pill '+k.p+'">'+esc(pName(k.p))+'</span></td><td style="white-space:normal;font-weight:600">'+esc(k.name)+'</td><td>'+esc(k.tgt)+'</td><td style="font-weight:700">'+esc(k.act)+'</td><td>'+barHtml(k.r,'var(--accent)')+'</td><td><span class="led '+ledClass(k.r)+'"></span> '+k.r+'%</td></tr>';
 }).join("");
 return ''+
 '<div class="scr-head"><h2><span class="ms">insights</span>四構面計分卡</h2><p>財務、顧客、內部流程、學習成長四構面 KPI 與加權綜合得分。</p></div>'+
 '<div class="kpi-grid mb12">'+kpiCards+'</div>'+
 '<div class="grid2">'+
   '<div class="card"><h3><span class="ms">donut_large</span>構面加權綜合得分</h3><div class="chart-wrap" id="c1a"></div></div>'+
   '<div class="card"><h3><span class="ms">radar</span>四構面平衡雷達</h3><div class="chart-wrap" id="c1b"></div></div>'+
 '</div>'+
 '<div class="card mt14"><h3><span class="ms">table_chart</span>KPI 明細與達成率</h3><div style="overflow-x:auto"><table><thead><tr><th>構面</th><th>指標</th><th>目標</th><th>實績</th><th>達成</th><th>燈號</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function chart1(){
 mk("c1a",Object.assign({},BASE,{
   chart:Object.assign({},BASE.chart,{type:"bar",height:300}),
   series:[{name:"綜合得分",data:SC_PERSP.map(function(p){return p.score;})}],
   plotOptions:{bar:{horizontal:true,borderRadius:5,distributed:true,barHeight:"60%"}},
   colors:["#c2410c","#0369a1","#7c3aed","#059669"],
   dataLabels:{enabled:true},
   legend:{show:false},
   xaxis:{categories:SC_PERSP.map(function(p){return p.name;}),max:100},
   grid:{borderColor:"#ede9e6"}
 }));
 mk("c1b",Object.assign({},BASE,{
   chart:Object.assign({},BASE.chart,{type:"radar",height:300}),
   series:[{name:"綜合得分",data:SC_PERSP.map(function(p){return p.score;})}],
   labels:SC_PERSP.map(function(p){return p.name;}),
   colors:["#c2410c"],
   stroke:{width:2},
   fill:{opacity:.28},
   markers:{size:4},
   yaxis:{max:100,tickAmount:4}
 }));
}

/* ============ SCREEN 2 : 指標權責指派 (split tree) ============ */
var OWNERS=[
 {id:"O1",name:"營收成長引擎",owner:"王志明 · 業務副總",kpis:[
   {n:"營收年增率",who:"北區業務處",fq:"月",st:"g"},
   {n:"高價值方案佔比",who:"產品行銷部",fq:"月",st:"a"},
   {n:"客單價提升",who:"通路業務部",fq:"季",st:"g"}]},
 {id:"O2",name:"顧客價值領先",owner:"李思婷 · 行銷長",kpis:[
   {n:"淨推薦值 NPS",who:"客戶體驗部",fq:"季",st:"a"},
   {n:"關鍵客戶留存率",who:"大客戶團隊",fq:"月",st:"g"},

var state={s0:0,s2:0,s4:0};
var SCREENS=[
 {html:screen0,chart:null},
 {html:screen1,chart:chart1},
 {html:screen2,chart:null},
 {html:screen3,chart:chart3},
 {html:screen4,chart:chart4},
 {html:screen5,chart:null}
];
function show(i){
 clearCharts();
 var view=document.getElementById("view");
 view.innerHTML=SCREENS[i].html();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
 void view.offsetHeight;
 bindScreen(i);
 if(SCREENS[i].chart){SCREENS[i].chart();}
}
function bindScreen(i){
 var view=document.getElementById("view");
 if(i===0){
   var lis=view.querySelectorAll("[data-t]");
   for(var a=0;a<lis.length;a++){lis[a].addEventListener("click",function(){state.s0=+this.getAttribute("data-t");show(0);});}
 }else if(i===2){
   var lo=view.querySelectorAll("[data-o]");
   for(var c=0;c<lo.length;c++){lo[c].addEventListener("click",function(){state.s2=+this.getAttribute("data-o");show(2);});}
 }else if(i===4){
   var sg=view.querySelectorAll("[data-seg]");
   for(var d=0;d<sg.length;d++){sg[d].addEventListener("click",function(){state.s4=+this.getAttribute("data-seg");show(4);});}
 }
}
(function(){
 var tabs=document.getElementById("tabs");
 tabs.innerHTML=MODULES.map(function(m,i){
   return '<button data-i="'+i+'"><span class="ms">'+m.icon+'</span><span class="txt">'+esc(m.name)+'</span></button>';
 }).join("");
 var btns=tabs.querySelectorAll("[data-i]");
 for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
