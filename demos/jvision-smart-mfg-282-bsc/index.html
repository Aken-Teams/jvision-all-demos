<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>平衡計分卡管理系統（BSC）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --soft:#E8F1F4;
  --fin:#0F766E;
  --cust:#0369A1;
  --proc:#6D28D9;
  --learn:#15803D;
  --green:#15803D;
  --amber:#B45309;
  --red:#DC2626;
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:12px;
  --transition:180ms ease;
}

*{box-sizing:border-box;margin:0;padding:0}
html{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{
  max-width:100%;
  overflow-x:hidden;
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],[data-i],[data-t],[data-o],[data-seg]{cursor:pointer}
button:focus-visible,[role="button"]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.ms{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;flex-direction:column}

header.top{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  padding:18px clamp(18px,3vw,42px);
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-bottom:4px solid var(--color-accent);
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  background:var(--color-card);
  color:var(--color-foreground);
  border:2px solid var(--color-on-primary);
  border-radius:var(--radius-md);
}
.logo .ms{font-size:28px}
.brand h1{
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(19px,2vw,25px);
  font-weight:700;
  line-height:1.05;
  letter-spacing:.02em;
}
.brand p{margin-top:4px;font-size:12px;font-weight:600;letter-spacing:.04em}
.top .spacer{flex:1 1 auto}
.top .stat{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  min-width:120px;
  padding-left:16px;
  border-left:1px solid rgba(0,0,0,.35);
  font-size:12px;
  font-weight:600;
}
.top .stat b{
  margin-top:1px;
  font-family:"Cinzel",serif;
  font-size:18px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

nav.tabs{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding:8px clamp(14px,3vw,42px);
  background:var(--color-card);
  border-bottom:1px solid var(--color-border);
  scrollbar-width:thin;
}
nav.tabs button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:0 0 auto;
  min-height:42px;
  padding:8px 13px;
  background:transparent;
  color:var(--color-muted-foreground);
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  font-family:"Crimson Pro","Noto Sans TC",sans-serif;
  font-size:14px;
  font-weight:600;
  transition:background-color var(--transition),color var(--transition),border-color var(--transition);
}
nav.tabs button .ms{font-size:19px}
nav.tabs button:hover{background:var(--color-muted);color:var(--color-foreground);border-color:var(--color-border)}
nav.tabs button.on{
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-color:var(--color-primary);
}

main{width:100%;max-width:1440px;margin:0 auto;padding:clamp(18px,3vw,36px)}
.scr-head{margin-bottom:20px;padding-bottom:13px;border-bottom:1px solid var(--color-border)}
.scr-head h2{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--color-foreground);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(25px,3vw,34px);
  font-weight:700;
  line-height:1.1;
}
.scr-head h2 .ms{color:var(--color-primary);font-size:27px}
.scr-head p{max-width:760px;margin-top:5px;color:var(--color-muted-foreground);font-size:14px;font-weight:400}

.card,.kpi,.list-pane,.detail-pane,.stat-box,.map-col,.col,.tk{
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
}
.card{padding:18px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:19px;
  font-weight:700;
  line-height:1.2;
}
.card h3 .ms{font-size:20px;color:var(--color-primary)}
.muted{color:var(--color-muted-foreground)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{position:relative;min-width:0;overflow:hidden;padding:16px 16px 15px;border-top:4px solid var(--color-primary)}
.kpi::before{display:none}
.kpi .lbl{color:var(--color-muted-foreground);font-size:12px;font-weight:600;letter-spacing:.025em}
.kpi .val,.stat-box .sb-v{
  margin-top:5px;
  color:var(--color-foreground);
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:27px;
  font-weight:600;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--color-muted-foreground);font-family:"Crimson Pro",sans-serif;font-size:13px;font-weight:600}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:700}
.up{color:#166534}.down{color:#B91C1C}

.split{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:14px}
.list-pane{min-width:0;overflow:hidden}
.list-pane .lp-h{
  display:flex;
  align-items:center;
  gap:7px;
  padding:13px 14px;
  background:var(--color-muted);
  border-bottom:1px solid var(--color-border);
  font-size:14px;
  font-weight:700;
}
.li{
  min-width:0;
  min-height:58px;
  padding:12px 14px;
  border-bottom:1px solid var(--color-border);
  border-left:4px solid transparent;
  transition:background-color var(--transition),border-color var(--transition);
}
.li:last-child{border-bottom:0}
.li:hover{background:var(--color-muted)}
.li.on{background:#CCFBF1;border-left-color:var(--color-primary)}
.li .li-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.li .li-s{margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.detail-pane{min-width:0;padding:18px}

.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.pill.g{background:#DCFCE7;color:#166534}.pill.a{background:#FEF3C7;color:#92400E}.pill.r{background:#FEE2E2;color:#991B1B}
.pill.fin{background:#CCFBF1;color:#115E59}.pill.cust{background:#E0F2FE;color:#075985}
.pill.proc{background:#EDE9FE;color:#5B21B6}.pill.learn{background:#DCFCE7;color:#166534}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mb12{margin-bottom:12px}.mt14{margin-top:14px}
.chart-wrap{min-width:0;overflow:hidden}

.card>div[style*="overflow-x:auto"]{scrollbar-width:thin;scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--color-border);text-align:left;white-space:nowrap}
th{
  background:var(--color-muted);
  color:var(--color-foreground);
  font-size:12px;
  font-weight:700;
  letter-spacing:.035em;
}
tbody tr{transition:background-color var(--transition)}
tbody tr:hover{background:#F0FDFA}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td:has(.bar-track),td:last-child{text-align:right}

.bar-track{height:8px;min-width:72px;overflow:hidden;background:#CBD5E1;border-radius:2px}
.bar-fill{height:100%;border-radius:2px}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:23px;
  padding:2px 8px;
  background:var(--color-muted);
  color:var(--color-muted-foreground);
  border:1px solid #CBD5E1;
  border-radius:var(--radius-sm);
  font-size:11px;
  font-weight:700;
}
.led{display:inline-block;width:10px;height:10px;flex:0 0 auto;border:2px solid currentColor;border-radius:50%}
.led.g{background:#16A34A;color:#166534}.led.a{background:#F59E0B;color:#92400E}.led.r{background:#DC2626;color:#991B1B}
.li .led{width:auto;height:auto;padding:2px 6px;background:transparent;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:700;line-height:1.2}
.li .led.g::after{content:"達標"}.li .led.a::after{content:"追蹤"}.li .led.r::after{content:"風險"}

.persp{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.persp .dot{width:10px;height:10px;flex:0 0 auto;border:1px solid var(--color-foreground);border-radius:2px}
.mapgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.map-col{min-width:0;padding:12px;background:var(--color-card)}
.map-node{
  margin-bottom:8px;
  padding:10px 11px;
  color:#FFFFFF;
  border:2px solid rgba(0,0,0,.2);
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  line-height:1.35;
}
.map-node:last-child{margin-bottom:0}
.map-node small{display:block;margin-top:2px;font-size:11px;font-weight:500;opacity:1}

.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;min-width:930px}
.col{min-width:0;padding:10px;background:var(--color-muted)}
.col h4{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:13px;font-weight:700}
.tk{min-width:0;margin-bottom:8px;padding:10px;background:var(--color-card);font-size:12px}
.tk:last-child{margin-bottom:0}
.tk .tk-t{margin-bottom:4px;font-size:13px;font-weight:700}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--color-primary)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";
  position:absolute;
  top:3px;
  left:-22px;
  width:11px;
  height:11px;
  background:var(--color-card);
  border:3px solid var(--color-primary);
  border-radius:50%;
}
.tl-item .tl-t{font-size:14px;font-weight:700}
.tl-item .tl-m{color:var(--color-muted-foreground);font-size:12px}

.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.seg button{
  min-height:36px;
  padding:6px 13px;
  background:var(--color-card);
  color:var(--color-muted-foreground);
  border:1px solid #94A3B8;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  transition:background-color var(--transition),color var(--transition),border-color var(--transition);
}
.seg button:hover{background:var(--color-muted);color:var(--color-foreground);border-color:var(--color-primary)}
.seg button.on{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}

.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat-box{min-width:0;padding:14px;border-bottom:3px solid var(--color-secondary)}
.stat-box .sb-l{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.stat-box .sb-v{font-size:22px}
.hint{
  display:flex;
  align-items:flex-start;
  gap:6px;
  margin-top:10px;
  padding:9px 10px;
  background:var(--color-muted);
  color:var(--color-muted-foreground);
  border-left:3px solid var(--color-primary);
  font-size:12px;
}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",sans-serif!important;fill:var(--color-muted-foreground)}
.apexcharts-gridline{stroke:#CCFBF1}
.apexcharts-tooltip{border:1px solid var(--color-border)!important;box-shadow:none!important}

main>*{animation:reveal .36s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:1024px){
  .mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .stat{min-width:105px}
}
@media(max-width:960px){
  .split{grid-template-columns:1fr}
  .list-pane{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .list-pane .lp-h{grid-column:1/-1}
}
@media(max-width:820px){
  header.top{gap:12px}
  .top .spacer{display:none}
  .top .stat{flex:1 1 42%;align-items:flex-start;padding-left:0;border-left:0;border-top:1px solid rgba(0,0,0,.3);padding-top:8px}
  .kpi-grid,.mini-grid,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media(max-width:560px){
  header.top{padding:14px 16px}
  .brand{width:100%}
  .logo{width:42px;height:42px}
  nav.tabs{padding:7px 12px}
  nav.tabs button{min-width:42px;padding:8px 10px}
  nav.tabs button .txt{display:none}
  main{padding:16px 12px 24px}
  .scr-head{margin-bottom:15px}
  .kpi-grid,.mini-grid,.mapgrid,.list-pane{grid-template-columns:1fr}
  .list-pane .lp-h{grid-column:auto}
  .kpi .val{font-size:24px}
  .card,.detail-pane{padding:14px}
  th,td{padding:9px 10px}
}
@media(max-width:375px){
  .top .stat{flex-basis:100%}
  .brand h1{font-size:18px}
  .brand p{font-size:11px}
  .scr-head h2{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  main>*{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="ms">insights</span></div>
      <div>
        <h1>平衡計分卡管理系統（BSC）</h1>
        <p>策略地圖 · 四構面 KPI · 目標對齊 · 績效追蹤</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="stat"><span>本期策略目標達成率</span><b>82.4%</b></div>
    <div class="stat"><span>指標對齊覆蓋率</span><b>90%</b></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var BASE={chart:{fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function barHtml(pct,color){var w=Math.max(0,Math.min(100,pct));return '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+color+'"></div></div>';}
function ledClass(p){return p>=95?'g':p>=80?'a':'r';}
var PNAME={fin:'財務',cust:'顧客',proc:'流程',learn:'成長'};

var MODULES=[
 {icon:"account_tree",name:"策略地圖",sub:"四構面策略目標與因果連結"},
 {icon:"insights",name:"四構面計分卡",sub:"財務/顧客/流程/學習成長 KPI"},
 {icon:"checklist",name:"指標權責指派",sub:"KPI 樹狀展開與負責人"},
 {icon:"account_tree",name:"部門目標對齊",sub:"策略目標向部門展開對齊"},
 {icon:"monitoring",name:"績效追蹤",sub:"達成率追蹤與燈號預警"},
 {icon:"fact_check",name:"考核回饋",sub:"週期考核與行動方案"}
];

/* ============ SCREEN 0 : 策略地圖 (split) ============ */
var THEMES=[
 {id:"T1",name:"營收成長引擎",owner:"總經理室",status:"g",prog:88,desc:"透過高價值方案與客戶留存推升營收，強化每股盈餘與投資回報。"},
 {id:"T2",name:"顧客價值領先",owner:"行銷處",status:"a",prog:74,desc:"以體驗與交期優勢提升淨推薦值，鞏固關鍵客戶佔比。"},
 {id:"T3",name:"卓越營運效率",owner:"營運處",status:"a",prog:81,desc:"以精實流程與品質管理縮短交期、降低不良，支撐成本領先。"},
 {id:"T4",name:"組織與數位能力",owner:"人資部",status:"r",prog:63,desc:"培育數位人才與系統化知識，作為所有構面的成長基礎。"}
];
var PERSP=[
 {k:"fin",name:"財務構面",color:"var(--fin)",nodes:[{t:"營收成長 +18%",s:"F1 主營收年增"},{t:"EPS 提升",s:"F2 每股盈餘"},{t:"成本領先",s:"F3 單位成本下降"}]},

/* ============ state + render ============ */
var state={s0:0,s2:0,s4:0};
var SCREENS=[
 {html:screen0,chart:null},
 {html:screen1,chart:chart1},
 {html:screen2,chart:null},
 {html:screen3,chart:chart3},
 {html:screen4,chart:chart4},
 {html:screen5,chart:null}
];
function show(i){
 clearCharts();
 var view=document.getElementById("view");
 view.innerHTML=SCREENS[i].html();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
 void view.offsetHeight;
 bindScreen(i);
 if(SCREENS[i].chart){SCREENS[i].chart();}
}
function bindScreen(i){
 var view=document.getElementById("view");
 var controls=view.querySelectorAll(".li[tabindex]");
 for(var k=0;k<controls.length;k++){controls[k].addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();this.click();}});}
 if(i===0){
   var lis=view.querySelectorAll("[data-t]");
   for(var a=0;a<lis.length;a++){lis[a].addEventListener("click",function(){state.s0=+this.getAttribute("data-t");show(0);});}
 }else if(i===2){
   var lo=view.querySelectorAll("[data-o]");
   for(var c=0;c<lo.length;c++){lo[c].addEventListener("click",function(){state.s2=+this.getAttribute("data-o");show(2);});}
 }else if(i===4){
   var sg=view.querySelectorAll("[data-seg]");
   for(var d=0;d<sg.length;d++){sg[d].addEventListener("click",function(){state.s4=+this.getAttribute("data-seg");show(4);});}
 }
}
(function(){
 var tabs=document.getElementById("tabs");
 tabs.innerHTML=MODULES.map(function(m,i){
   return '<button data-i="'+i+'"><span class="ms">'+m.icon+'</span><span class="txt">'+esc(m.name)+'</span></button>';
 }).join("");
 var btns=tabs.querySelectorAll("[data-i]");
 for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
