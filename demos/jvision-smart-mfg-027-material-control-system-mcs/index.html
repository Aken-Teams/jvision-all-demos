<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa; --accent-soft:#f2ecfe;
  --ink:#1e1b2e; --sub:#6b6580; --line:#e8e3f3; --bg:#f6f4fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;vertical-align:middle;line-height:1;-webkit-font-feature-settings:'liga'}
.app{display:flex;min-height:100vh}

.side{width:236px;flex:none;background:linear-gradient(180deg,#2a1d54,#1c1436);color:#fff;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(124,58,237,.5)}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block}
.brand span{font-size:11px;color:#c8bff0;font-weight:500}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#d8d1f0;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;transition:.16s;flex:none;white-space:nowrap}
.nav button .ms{font-size:21px;flex:none}
.nav button .idx{margin-left:auto;font-size:11px;opacity:.5;font-weight:700}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff;box-shadow:0 8px 18px rgba(124,58,237,.4)}
.side .foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:#9c93c4;border-top:1px solid rgba(255,255,255,.09)}
.side .foot b{color:#fff;font-weight:700}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .tt{font-size:17px;font-weight:800}
.top .ts{font-size:12.5px;color:var(--sub);font-weight:500}
.top .chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700}
.top .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.16);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wrap{padding:22px 24px 40px}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .k-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;margin-bottom:9px}
.kpi .k-l{font-size:12px;color:var(--sub);font-weight:600}
.kpi .k-v{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .k-v small{font-size:13px;font-weight:600;color:var(--sub)}
.kpi .k-d{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kpi .k-d.up{color:var(--ok)} .kpi .k-d.dn{color:var(--bad)} .kpi .k-d.fl{color:var(--sub)}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px}
.card h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card h3 .ms{color:var(--accent);font-size:20px}
.card .cap{font-size:12px;color:var(--sub);margin-bottom:12px;font-weight:500}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:2fr 1fr}
.split{grid-template-columns:340px 1fr}

table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#faf8ff}
tbody tr:hover{background:#faf9ff}
td b{font-weight:700}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.7}
.t-ok{background:#e7f6ec;color:var(--ok)} .t-warn{background:#fef3e2;color:var(--warn)}
.t-bad{background:#fdeaea;color:var(--bad)} .t-info{background:#e8f0fe;color:var(--info)}
.t-mut{background:#eeecf5;color:var(--sub)} .t-acc{background:var(--accent-soft);color:var(--accent)}

.bar{height:8px;border-radius:5px;background:#ece8f6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart{width:100%;height:270px}
.scroll{overflow-x:auto}

.wk-list{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}
.wk-item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;transition:.15s;background:#fff}
.wk-item.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 12px rgba(124,58,237,.12)}
.wk-item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-item .no{font-weight:800;font-size:13px}
.wk-item .r2{font-size:11.5px;color:var(--sub);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
.wk-detail{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 6px}
.dl .c{background:#faf8ff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.dl .c .l{font-size:11px;color:var(--sub);font-weight:600}
.dl .c .v{font-size:16px;font-weight:800;margin-top:2px}

.seq{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.seq .st{flex:none;width:150px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px}
.seq .st .step{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;display:inline-block}
.seq .st .mat{font-weight:800;font-size:14px;margin:8px 0 2px}
.seq .st .sub{font-size:11.5px;color:var(--sub)}
.seq .arw{flex:none;display:grid;place-items:center;color:var(--accent2);font-size:22px}
.poka{display:flex;flex-direction:column;gap:9px}
.poka .p{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
.poka .p .pic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:20px}
.poka .p.g .pic{background:#e7f6ec;color:var(--ok)} .poka .p.r .pic{background:#fdeaea;color:var(--bad)}
.poka .p.y .pic{background:#fef3e2;color:var(--warn)}
.poka .p .txt{flex:1;min-width:0} .poka .p .txt b{font-size:13px} .poka .p .txt div{font-size:11.5px;color:var(--sub)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 8px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl .ev .h{font-weight:800;font-size:13px}
.tl .ev .m{font-size:11.5px;color:var(--sub)}
.tl .ev .tm{font-size:11px;color:var(--accent);font-weight:700}

.mtx{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.mtx .cell{border-radius:11px;padding:10px;color:#fff;min-height:76px;display:flex;flex-direction:column;justify-content:space-between}
.mtx .cell .n{font-size:11.5px;font-weight:700;opacity:.95}
.mtx .cell .v{font-size:19px;font-weight:800}
.mtx .cell .u{font-size:10.5px;opacity:.85}

.alerts{display:flex;flex-direction:column;gap:11px}
.alert{display:flex;gap:13px;border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:13px 15px;background:#fff}
.alert.hi{border-left-color:var(--bad)} .alert.md{border-left-color:var(--warn)} .alert.lo{border-left-color:var(--info)}
.alert .aic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:23px}
.alert.hi .aic{background:#fdeaea;color:var(--bad)} .alert.md .aic{background:#fef3e2;color:var(--warn)} .alert.lo .aic{background:#e8f0fe;color:var(--info)}
.alert .ab{flex:1;min-width:0}
.alert .ab .at{font-weight:800;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert .ab .ad{font-size:12px;color:var(--sub);margin-top:3px}
.alert .ameta{font-size:11px;color:var(--sub);text-align:right;flex:none}
.alert .ameta b{font-size:16px;color:var(--ink);display:block}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column;padding:12px}
  .brand{padding:2px 4px 12px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px}
  .nav button{flex:none}
  .nav button .idx{display:none}
  .side .foot{display:none}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .two,.three,.split{grid-template-columns:1fr}
  .mtx{grid-template-columns:repeat(3,1fr)}
  .dl{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:10px}
  .nav button .ms{font-size:22px}
  .wrap{padding:16px 14px 34px}
  .top{padding:12px 14px}
}
</style>
</head>

function bindList(){
  var lst=document.getElementById("wkList"); if(!lst) return;
  lst.onclick=function(e){
    var it=e.target.closest("[data-req]"); if(!it) return;
    curReq=+it.getAttribute("data-req");
    var b=document.getElementById("screen"); b.innerHTML=s0(); void b.offsetHeight; bindList();
  };
}
function show(i){
  i=Math.max(0,Math.min(RENDER.length-1,i));
  disposeChart();
  var nav=document.getElementById("nav").children;
  for(var k=0;k<nav.length;k++) nav[k].classList.toggle("on",+nav[k].getAttribute("data-i")===i);
  document.getElementById("ptt").textContent=MODS[i].tt;
  document.getElementById("pts").textContent=MODS[i].ts;
  var box=document.getElementById("screen");
  box.innerHTML=RENDER[i]();
  void box.offsetHeight;
  if(i===0) bindList();
  initChart(i);
}

(function(){
  var nav=document.getElementById("nav");
  MODS.forEach(function(m,i){
    var b=document.createElement("button");
    b.setAttribute("data-i",i);
    b.innerHTML='<span class="ms">'+m.ic+'</span><span class="lbl">'+m.lbl+'</span><span class="idx">'+i+'</span>';
    b.addEventListener("click",function(){ location.hash="go="+i; show(i); try{window.scrollTo(0,0);}catch(e){} });
    nav.appendChild(b);
  });
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
