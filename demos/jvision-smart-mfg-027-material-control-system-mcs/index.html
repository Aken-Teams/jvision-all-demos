.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}

.three{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.split{grid-template-columns:350px minmax(0,1fr)}
.kpi,.card,.wk-list,.wk-detail{background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

.chart{width:100%;height:270px}

.alert.hi{border-left-color:#dc2626}.alert.md{border-left-color:#c2410c}.alert.lo{border-left-color:#2563eb}
.alert .aic{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:6px}
.alert.hi .aic{background:#fee2e2;color:#991b1b}.alert.md .aic{background:#ffedd5;color:#9a3412}.alert.lo .aic{background:#dbeafe;color:#1e40af}

.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:middle}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.4}}
@media(max-width:1024px){

.kpis{grid-template-columns:repeat(2,1fr)}

@media(max-width:768px){

.brand{padding:0 2px 12px}.nav{flex-direction:row;overflow:auto;margin-top:12px;padding:2px}.nav button{width:auto;flex:none}.nav .idx,.foot{display:none}
.top{top:0;padding:17px 16px 12px}.top::before{left:16px;top:5px}.wrap{padding:18px 14px 36px}
.two,.three,.split{grid-template-columns:1fr}.wk-list{max-height:350px}

@media(max-width:480px){
.kpis{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.nav .lbl{display:none}.nav button{padding:10px}
.tt{font-size:18px}.ts{font-size:11px}.chip{padding:7px 9px;font-size:10px}.card,.wk-detail{padding:14px}
.alert{align-items:flex-start}.alert .ameta{display:none}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important}
#screen{opacity:1;transform:none}
}
