<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研發實驗規劃與結果分析</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --panel:#FFFFFF;
  --surface:#F7FFF9;
  --surface-strong:#DCFCE7;
  --shadow:0 14px 40px rgba(20,83,45,.09);
  --shadow-hover:0 20px 50px rgba(20,83,45,.14);
  --radius:22px;
  --radius-small:15px;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#0369A1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    radial-gradient(circle at 8% 5%,rgba(34,197,94,.12),transparent 28rem),
    radial-gradient(circle at 93% 22%,rgba(217,119,6,.08),transparent 25rem),
    var(--color-background);
  color:var(--ink);
  font-family:"Exo","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:10px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{min-height:100vh}
.sidebar{
  position:sticky;
  z-index:40;
  top:0;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:76px;
  padding:10px clamp(16px,3vw,48px);
  color:#ECFDF5;
  background:rgba(20,83,45,.96);
  border-bottom:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 34px rgba(20,83,45,.16);
  backdrop-filter:blur(16px);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  flex:none;
}
.brand-logo{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  color:#052E16;
  background:linear-gradient(145deg,#86EFAC,#22C55E);
  border-radius:17px 13px 18px 12px;
  box-shadow:0 8px 20px rgba(34,197,94,.3);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt b{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:#BBF7D0;
  font:500 9px/1.2 "Roboto Mono",monospace;
  letter-spacing:.12em;
}
.nav{
  display:flex;
  align-items:center;
  gap:7px;
  flex:1;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:10px 13px;
  color:#D1FAE5;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:15px 12px 16px 11px;
  transition:background-color .2s,color .2s,transform .2s,border-color .2s;
}
.nav button:hover{
  color:#fff;
  background:rgba(255,255,255,.11);
  transform:translateY(-1px);
}
.nav button.on{
  color:#052E16;
  background:#DCFCE7;
  border-color:#86EFAC;
  box-shadow:0 8px 20px rgba(0,0,0,.13);
}
.nav button.on::after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:5px;
  height:3px;
  background:var(--color-accent);
  border-radius:999px;
}
.nav .material-symbols-outlined{font-size:19px}
.idx{
  color:inherit;
  opacity:.7;
  font:500 10px "Roboto Mono",monospace;
}
.side-foot{
  flex:none;
  color:#BBF7D0;
  font-size:10px;
  line-height:1.55;
}
.side-foot b{color:#fff}
.main{
  width:min(1600px,100%);
  margin:auto;
  padding:clamp(22px,3vw,42px) clamp(15px,3vw,46px) 70px;
}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
  padding:6px 2px 22px;
  border-bottom:1px solid var(--line);
}
.topbar::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:0;
  width:25%;
  height:3px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary),var(--color-accent));
  border-radius:999px;
}
.title-kicker{
  margin-bottom:7px;
  color:var(--color-primary);
  font:600 10px "Roboto Mono",monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--color-foreground);
  font-size:clamp(21px,2.1vw,29px);
  line-height:1.2;
}
.topbar h1 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:29px;
}
.sub{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}
.top-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  flex-wrap:wrap;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 12px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  background:rgba(255,255,255,.8);
  border:1px solid var(--line);
  border-radius:999px;
}
.dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid #fff;
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(21,128,61,.18);
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  color:#fff;
  font-weight:700;
  background:linear-gradient(145deg,var(--color-primary),#166534);
  border:2px solid #DCFCE7;
  border-radius:50% 44% 52% 46%;
}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr)}
.grid>*{min-width:0}
.card,.tile{
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.card:hover,.tile:hover{
  border-color:#86EFAC;
  box-shadow:var(--shadow-hover);
}
.card{
  padding:18px;
  border-radius:var(--radius);
}
.card.pad0{
  padding:0;
  overflow:hidden;
}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.card.pad0 .card-h{padding:18px 18px 0}
.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  color:#14532D;
  font-size:15px;
}
.card-h h3 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  color:var(--color-primary);
  font-size:18px;
  background:#DCFCE7;
  border-radius:11px 8px 12px 8px;
}
.hint{
  color:var(--muted);
  font-size:11px;
}
.tile{
  position:relative;
  display:grid;
  grid-template-columns:auto 1fr;
  column-gap:13px;
  padding:18px;
  overflow:hidden;
  border-radius:22px 16px 24px 17px;
}
.tile::after{
  content:"";
  position:absolute;
  right:-24px;
  bottom:-32px;
  width:98px;
  height:80px;
  background:rgba(34,197,94,.08);
  border-radius:55% 45% 62% 38%;
  transform:rotate(-18deg);
}
.tile .ti{
  grid-row:1/4;
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:var(--color-primary);
  background:linear-gradient(145deg,#ECFDF5,#BBF7D0);
  border:1px solid #86EFAC;
  border-radius:16px 11px 17px 12px;
}
.tile .ti .material-symbols-outlined{font-size:22px}
.tile b{
  align-self:end;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.tile .tv{
  color:#14532D;
  font:700 clamp(20px,2vw,27px) "Roboto Mono",monospace;
  letter-spacing:-.04em;
}
.tile p{
  z-index:1;
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12.5px;
}
th{
  padding:12px 14px;
  color:#365B48;
  text-align:left;
  white-space:nowrap;
  background:#ECFDF5;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
}
td{
  padding:12px 14px;
  color:#244934;
  white-space:nowrap;
  background:#fff;
  border-bottom:1px solid #DCFCE7;
  font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F0FDF4}
th:nth-child(n+5),td:nth-child(n+5){text-align:right}
td:first-child,th:first-child{text-align:left}
.mono{
  font-family:"Roboto Mono",monospace;
  font-weight:600;
  letter-spacing:-.02em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  border:1px solid currentColor;
  border-radius:999px;
}
.tag::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  background:currentColor;
  border-radius:50%;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#14532D;background:#DCFCE7}
.apexcharts-text{font-family:"Roboto Mono",monospace!important}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(.82);opacity:.6}
}
@keyframes rise{
  from{opacity:0;transform:translateY(16px) scale(.97)}
  to{opacity:1;transform:none}
}
#screen>.grid{
  animation:rise .42s cubic-bezier(.2,.8,.2,1) both;
}
#screen>.grid:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3){animation-delay:.12s}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g32{grid-template-columns:1fr}
  .side-foot{display:none}
}
@media(max-width:820px){
  .sidebar{
    position:relative;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:10px;
    min-height:auto;
    padding:12px 15px;
  }
  .brand{width:100%}
  .brand-txt span{display:none}
  .nav{width:100%}
  .nav button{min-width:44px;justify-content:center}
  .nav .idx{display:none}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
  .g2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .main{padding:20px 12px 50px}
  .nav button{padding:10px 12px}
  .nav .txt{display:none}
  .g4{grid-template-columns:1fr}
  .tile{min-height:120px}
  .chip:nth-child(2){display:none}
  .card{padding:14px;border-radius:18px}
  .card.pad0 .card-h{padding:14px 14px 0}
  th,td{padding:11px 12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"><span class="material-symbols-outlined">science</span></div>
      <div class="brand-txt"><b>研發實驗規劃與結果分析</b><span>R&amp;D EXPERIMENT INTELLIGENCE</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">進行中 6 案<br>本年 34 案<br>版本 <b>v1.0.0</b></div>
  </header>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="title-kicker">Research development project tracking</div>
        <h1><span class="material-symbols-outlined" id="th-ico" aria-hidden="true"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot" aria-hidden="true"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--color-primary)" aria-hidden="true">calendar_today</span><span class="mono">2026/08/20</span></span>
        <div class="avatar" aria-label="使用者：資">資</div>
      </div>
    </div>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>

<script>
var charts=[];

function killCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].destroy()}catch(e){}
  }
  charts=[];
}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function tbl(h,r){
  return '<div style="overflow-x:auto"><table><thead><tr>'+
    h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
    '</tr></thead><tbody>'+
    r.map(function(x){
      return '<tr>'+x.map(function(c,i){
        return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>';
      }).join("")+'</tr>';
    }).join("")+
    '</tbody></table></div>';
}
function card(t,ic,body,hint){
  return '<section class="card"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+t+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+
    '</div>'+body+'</section>';
}
function cardT(t,ic,body,hint){
  return '<section class="card pad0"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+t+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+
    '</div>'+body+'</section>';
}
function tile(ic,t,v,p){
  return '<article class="tile"><div class="ti"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>';
}
function push(el,opt){
  var n=document.getElementById(el);
  if(!n)return;
  var c=new ApexCharts(n,opt);
  c.render();
  charts.push(c);
}
function heightValue(x,d){
  return typeof x==="number"?(x>0&&x<20?Math.round(d*x):x):d;
}

var AX={style:{colors:"#475569",fontSize:"11px",fontFamily:"Roboto Mono"}};
var CB={
  redrawOnParentResize:false,
  redrawOnWindowResize:false,
  animations:{enabled:!window.matchMedia("(prefers-reduced-motion: reduce)").matches},
  toolbar:{show:false},
  foreColor:"#475569",
  fontFamily:"Roboto Mono, monospace"
};
function mkBar(el,cats,data,name,horiz,a6,a7){
  var color=typeof a6==="string"?a6:"#15803D";
  var min=typeof a6==="number"?a6:undefined;
  push(el,{
    chart:Object.assign({},CB,{type:"bar",height:heightValue(a7,230)}),
    series:[{name:name||"數值",data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{min:min,labels:{style:AX.style}},
    grid:{borderColor:"#BBF7D0",strokeDashArray:4},
    dataLabels:{enabled:false},
    plotOptions:{bar:{borderRadius:7,horizontal:!!horiz,columnWidth:"52%",barHeight:"58%"}},
    colors:[color],
    tooltip:{theme:"light"}
  });
}
function mkDonut(el,labels,data,h){
  push(el,{
    chart:Object.assign({},CB,{type:"donut",height:heightValue(h,240)}),
    series:data,
    labels:labels,
    colors:["#15803D","#22C55E","#D97706","#65A30D","#0F766E","#84CC16"],
    legend:{position:"bottom",fontSize:"11px"},
    dataLabels:{enabled:false},
    plotOptions:{pie:{donut:{size:"66%"}}},
    stroke:{width:3,colors:["#FFFFFF"]},
    tooltip:{theme:"light"}
  });
}
function mkLine2(el,cats,s1,s2,h){
  push(el,{
    chart:Object.assign({},CB,{type:"line",height:heightValue(h,240)}),
    series:[s1,s2],
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:AX.style}},
    grid:{borderColor:"#BBF7D0",strokeDashArray:4},
    dataLabels:{enabled:false},
    stroke:{curve:"smooth",width:[3,3],dashArray:[0,5]},
    markers:{size:4,strokeWidth:2,strokeColors:"#fff"},
    colors:["#15803D","#D97706"],
    legend:{position:"top",fontSize:"11px"},
    tooltip:{theme:"light"}
  });
}

var MODULES=[
  {icon:"dashboard",name:"實驗總覽",sub:"DOE 案件、因子數與結論採用率"},
  {icon:"grid_view",name:"實驗矩陣",sub:"因子水準與試驗組合"},
  {icon:"analytics",name:"效應分析",sub:"主效應、交互作用與最佳條件"},
  {icon:"verified",name:"驗證與導入",sub:"最佳條件的確認試驗與量產導入"}
];

function v0(c){
  c.innerHTML=
  '<div class="grid g4">'+
    tile("science","進行中 DOE","6 案","規劃 2 · 執行 3 · 分析 1")+
    tile("insights","本年完成","28 案","平均每案 3.2 個因子")+
    tile("verified","結論採用率","78.6%","22 / 28 案導入量產")+
    tile("savings","本年效益","1,284 萬","良率提升與成本下降")+
  '</div>'+
  '<div class="grid g32" style="margin-top:16px">'+
    card("DOE 案件數與採用率","show_chart",'<div id="a1"></div>',"雙軸")+
    card("實驗目的","donut_large",'<div id="a2"></div>',"本年 34 案")+
  '</div>'+
  '<div class="grid" style="margin-top:16px">'+
    cardT("DOE 案件清單","science",tbl(
      ["案號","主題","目的","設計類型","因子數","試驗數","負責","階段","結論"],
      [
        ["DOE-26-018","回焊爐溫度曲線","<span class='tag t-acc'>良率提升</span>","田口 L9","3","9","吳孟儒","<span class='tag t-ok'>已導入</span>","空焊率 4.2%→0.8%"],
        ["DOE-26-021","錫膏印刷參數","<span class='tag t-acc'>良率提升</span>","全因子 2³","3","8","吳孟儒","<span class='tag t-ok'>已導入</span>","印刷不良 -62%"],
        ["DOE-26-024","變壓器繞線張力","<span class='tag t-warn'>成本下降</span>","田口 L9","3","9","陳志豪","<span class='tag t-warn'>分析中</span>","—"],

var RENDER=[v0,v1,v2,v3];

function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODULES.map(function(m,i){
    return '<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'">'+
      '<span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span>'+
      '<span class="txt">'+m.name+'</span>'+
      '<span class="idx">0'+(i+1)+'</span>'+
    '</button>';
  }).join("");

  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){
      location.hash="go="+b.getAttribute("data-i");
    });
  });
}
function show(i){
  killCharts();
  var m=MODULES[i];
  document.getElementById("th-ico").textContent=m.icon;
  document.getElementById("th-title").textContent=m.name;
  document.getElementById("th-sub").textContent=m.sub;
  document.title=m.name+" · 研發實驗規劃與結果分析";

  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",active);
    if(active)b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });

  RENDER[i](document.getElementById("screen"));
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MODULES.length-1):0);
  try{window.scrollTo({top:0,behavior:"auto"})}catch(e){window.scrollTo(0,0)}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
