<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SMT餵料防呆管理系統（Feeder / Component Verification System）｜Jvision 系統 Demo</title>
<meta name="description" content="料號料盤條碼掃描比對、餵料槽位對位、換料防呆與用料履歷追溯的 SMT 現場管制終端" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0369a1; --accent2:#38bdf8; --accent-l:#7dd3fc;
  --bg:#070c15; --panel:#0d1524; --panel2:#111c30; --card:#0f1a2c; --ink:#e8f1fb; --sub:#8ba0bd; --line:#1c2b44;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC","Inter",system-ui,sans-serif;background:
  radial-gradient(1100px 520px at 82% -8%,rgba(56,189,248,.12),transparent 60%),
  radial-gradient(900px 480px at 6% 4%,rgba(3,105,161,.16),transparent 62%),
  var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
/* top nav */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#061426,#0a2136 55%,#0369a1);border-bottom:1px solid #123456;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.topbar-in{max-width:1400px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0369a1,#38bdf8);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 18px rgba(56,189,248,.5)}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap;color:#fff}
.brand span{font-size:11px;color:#9fc7e8;display:block}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid transparent;cursor:pointer;background:rgba(255,255,255,.06);color:#cfe6fb;padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;transition:.15s}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(56,189,248,.18)}
.nav button.on{background:linear-gradient(135deg,#0369a1,#38bdf8);color:#fff;border-color:#7dd3fc;box-shadow:0 0 14px rgba(56,189,248,.45)}
.usr{display:flex;align-items:center;gap:8px;flex:none;padding-left:6px}
.usr .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#02121f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.usr small{font-size:12px;color:#cfe6fb}
.wrap{max-width:1400px;margin:0 auto;padding:20px 20px 64px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.screen-head h1{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h1 .material-symbols-outlined{color:var(--accent2);font-size:26px}
.screen-head p{margin:5px 0 0;color:var(--sub);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid transparent}
.pill.ok{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.4)}
.pill.warn{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.4)}
.pill.bad{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.4)}
.pill.info{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.4)}
.pill.mut{background:rgba(139,160,189,.12);color:#a9c0da;border-color:rgba(139,160,189,.3)}
/* grids */
.grid{display:grid;gap:15px}
.kpi4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.g13{grid-template-columns:1fr 2fr}
.g23{grid-template-columns:repeat(3,1fr)}
.card{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--line);border-radius:15px;padding:15px 16px;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;color:#e8f1fb}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card .sub{font-size:12px;color:var(--sub);font-weight:500}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .num{font-size:29px;font-weight:900;margin-top:6px;letter-spacing:-.5px;font-family:"Inter",sans-serif}
.kpi .num small{font-size:13px;font-weight:700;color:var(--sub)}
.kpi .dt{font-size:11.5px;font-weight:700;margin-top:5px}
.kpi .ic{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kpi .ic .material-symbols-outlined{font-size:22px}
.up{color:var(--ok)}.down{color:var(--bad)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:580px}
th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:rgba(56,189,248,.05)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;color:#d6e4f4}
tr:last-child td{border-bottom:none}
.mono{font-family:"Inter",monospace;font-weight:700;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.tag.g{background:rgba(34,197,94,.16);color:#4ade80}.tag.y{background:rgba(245,158,11,.16);color:#fbbf24}.tag.r{background:rgba(239,68,68,.16);color:#f87171}.tag.b{background:rgba(56,189,248,.16);color:#7dd3fc}.tag.gr{background:rgba(139,160,189,.14);color:#a9c0da}
.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart-box{position:relative;height:270px}
.chart-sm{position:relative;height:210px}
/* feeder slot matrix (signature) */
.machine{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}
.mc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mc-h b{font-size:13.5px}
.mc-h .side{font-size:11px;color:var(--sub);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.slot{aspect-ratio:1/1.35;border-radius:8px;border:1px solid var(--line);background:#0a1322;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"Inter";position:relative;cursor:default}
.slot .sn{font-size:9.5px;color:var(--sub);font-weight:700}
.slot .sv{font-size:8px;font-weight:800;line-height:1}
.slot.ok{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.1)}
.slot.ok .sv{color:#4ade80}
.slot.err{border-color:rgba(239,68,68,.7);background:rgba(239,68,68,.16)}
.slot.err .sv{color:#f87171}
.slot.low{border-color:rgba(245,158,11,.6);background:rgba(245,158,11,.12)}
.slot.low .sv{color:#fbbf24}
.slot.empty{border-style:dashed;opacity:.55}
.slot.empty .sv{color:var(--sub)}
/* scan terminal */
.scan-term{background:#050b16;border:1px solid var(--line);border-radius:13px;padding:14px;font-family:"Inter",monospace}
.scan-line{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:12.5px}
.scan-line:last-child{border-bottom:none}
.scan-line .st{width:9px;height:9px;border-radius:50%;flex:none}
.scan-line .code{font-weight:800;color:#cfe6fb;flex:none}
.scan-line .msg{color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan-line .tm{color:#607694;font-size:11px;flex:none}
.big-scan{background:linear-gradient(135deg,#0a2136,#06121f);border:1px solid rgba(56,189,248,.4);border-radius:14px;padding:18px;text-align:center;position:relative;overflow:hidden}
.big-scan .ring{width:78px;height:78px;border-radius:20px;border:2px solid var(--accent2);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 0 24px rgba(56,189,248,.4)}
.big-scan .ring .material-symbols-outlined{font-size:44px;color:var(--accent2)}
.big-scan .laser{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#38bdf8,transparent);animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(24px)}50%{transform:translateY(150px)}}
/* gate / interception */
.gate{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#0a2136,#06121f);border:1px solid var(--line);border-radius:14px;padding:16px}
.gate .glamp{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.gate .glamp .material-symbols-outlined{font-size:34px}
.gate.pass .glamp{background:rgba(34,197,94,.16);color:#4ade80;box-shadow:0 0 20px rgba(34,197,94,.35)}
.gate.block .glamp{background:rgba(239,68,68,.16);color:#f87171;box-shadow:0 0 20px rgba(239,68,68,.4)}
.gate .gt{font-size:16px;font-weight:900}
.gate .gd{font-size:12px;color:var(--sub);margin-top:3px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;background:var(--panel2)}
.alert:last-child{margin-bottom:0}
.alert .ai{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.alert .ai .material-symbols-outlined{font-size:20px}
.alert.r{background:rgba(239,68,68,.08)}.alert.r .ai{background:rgba(239,68,68,.18);color:#f87171}
.alert.y{background:rgba(245,158,11,.08)}.alert.y .ai{background:rgba(245,158,11,.18);color:#fbbf24}
.alert.b .ai{background:rgba(56,189,248,.18);color:#7dd3fc}
.alert .txt{min-width:0;flex:1}
.alert .txt b{font-size:13.5px}
.alert .txt p{margin:3px 0 0;font-size:12px;color:var(--sub)}
.alert .rt{font-size:11px;color:var(--sub);white-space:nowrap;font-weight:700}
/* machine progress rows */
.pline{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.pline:last-child{border-bottom:none}
.pline .pm{width:96px;flex:none;font-weight:700;font-size:13px}
.pline .pm small{display:block;color:var(--sub);font-weight:600;font-size:11px}
.pline .pbar{flex:1;min-width:0}
.pline .pv{width:56px;text-align:right;font-weight:800;font-size:12.5px;flex:none}
/* remaining material gauge cards */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.gauge .gn{font-size:11.5px;color:var(--sub);font-weight:700}
.gauge .gnum{font-size:23px;font-weight:900;margin:5px 0 6px;font-family:"Inter"}
.gauge .bar{height:6px}
.gauge .gl{font-size:10.5px;color:var(--sub);margin-top:5px;font-weight:600}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dotmk{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent2)}
.tl-item.done .dotmk{background:var(--accent2);border-color:var(--accent2)}
.tl-item.bad .dotmk{border-color:var(--bad);background:var(--bad)}
.tl-item .tt{font-weight:700;font-size:13.5px}
.tl-item .tt .mono{color:var(--accent2)}
.tl-item .ds{font-size:12px;color:var(--sub);margin-top:2px}
/* trace card */
.trace{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.trace .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.trace .row:last-child{border-bottom:none}
.trace .row .k{color:var(--sub);flex:none}
.trace .row .v{font-weight:700;color:#d6e4f4;text-align:right;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.callo{background:linear-gradient(120deg,rgba(3,105,161,.16),rgba(56,189,248,.08));border:1px solid rgba(56,189,248,.28);border-radius:13px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.callo .material-symbols-outlined{color:var(--accent2);font-size:22px;flex:none}
.callo b{font-size:13px}.callo p{margin:3px 0 0;font-size:12.5px;color:#a9c0da;line-height:1.6}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:88px}
.mini .m-l{font-size:11px;color:var(--sub);font-weight:600}
.mini .m-v{font-size:18px;font-weight:900;margin-top:2px;font-family:"Inter"}
.stat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:120px;font-weight:600;flex:none;color:#d6e4f4}
.stat-row .bar{flex:1}
.stat-row .vl{width:44px;text-align:right;font-weight:800;font-size:12.5px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.blink{animation:bl 1.6s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:820px){
  .kpi4{grid-template-columns:1fr 1fr}
  .g2,.g3,.g13,.g23{grid-template-columns:1fr}
  .machine{grid-template-columns:1fr}
  .gauges{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button span.t{display:none}
  .nav button{padding:8px 10px}
  .kpi4{grid-template-columns:1fr 1fr}
  .gauges{grid-template-columns:1fr 1fr}
  .brand span{display:none}
  .usr small{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>SMT餵料防呆管理系統</b><span>Feeder / Component Verification System · 現場管制終端</span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="usr">
      <div class="av">工</div>
      <small>SMT製造工程 · 林士傑</small>
    </div>
  </div>
</div>
<div class="wrap"><div id="view"></div></div>

<script>
"use strict";
var chartRefs=[];
function killCharts(){for(var i=0;i<chartRefs.length;i++){try{chartRefs[i].destroy();}catch(e){}}chartRefs=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var NAV=[
  {i:0,ic:"qr_code_scanner",t:"領料掃碼"},
  {i:1,ic:"grid_on",t:"槽位對位"},
  {i:2,ic:"verified_user",t:"防呆上機"},
  {i:3,ic:"precision_manufacturing",t:"生產執行"},
  {i:4,ic:"history_edu",t:"用料履歷"},
  {i:5,ic:"gpp_maybe",t:"誤料稽核"}
];

/* ---------- helpers ---------- */
function sh(ic,t,d,extra){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h1><p>'+d+'</p></div>'+(extra||"")+'</div>';
}
function kpi(lab,ic,num,unit,bg,col,dt,dir){
  var dc=dir==="up"?"up":dir==="down"?"down":"";
  var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">trending_up</span>':dir==="down"?'<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">trending_down</span>':'';
  return '<div class="card kpi"><div class="ic" style="background:'+bg+'"><span class="material-symbols-outlined" style="color:'+col+'">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="num">'+num+' <small>'+unit+'</small></div>'+
    '<div class="dt '+dc+'">'+arrow+' '+dt+'</div></div>';
}
function statRow(nm,v,max,col){
  var pct=Math.round(v/max*100);
  return '<div class="stat-row"><div class="nm">'+esc(nm)+'</div><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div><div class="vl">'+v+'</div></div>';
}

/* ================= SCREEN 0 · 領料掃碼比對 ================= */
function scr0(){
  var scans=[
    {ok:true,code:"C-104K-2200PF",msg:"料號比對相符 · MLCC 0402 · 廠商 Murata · 批次 LOT-A7742",tm:"08:41:07"},
    {ok:true,code:"R-4R7-0603",msg:"料號比對相符 · 電阻 0603 4.7Ω · 廠商 Yageo · 批次 LOT-C1180",tm:"08:41:22"},
    {ok:false,code:"IC-STM32F0",msg:"錯誤：工單 BOM 未含此料號，疑似領錯料 · 已攔截",tm:"08:41:49"},
    {ok:true,code:"L-2R2H-0805",msg:"料號比對相符 · 功率電感 2.2µH · 廠商 TDK · 批次 LOT-E0563",tm:"08:42:10"},
    {ok:true,code:"D-SS34-SMA",msg:"料號比對相符 · 蕭特基二極體 · 廠商 MCC · 批次 LOT-B9021",tm:"08:42:33"},
    {ok:false,code:"C-105K-0603",msg:"警告：批次 LOT-X0088 已超保存期，須換料 · 待放行",tm:"08:42:58"}
  ];
  var log=scans.map(function(s){
    var c=s.ok?'var(--ok)':'var(--bad)';
    return '<div class="scan-line"><span class="st" style="background:'+c+'"></span><span class="code">'+esc(s.code)+'</span><span class="msg">'+esc(s.msg)+'</span><span class="tm">'+s.tm+'</span></div>';
  }).join("");
  var bom=[
    {no:"C-104K-2200PF",nm:"MLCC 0402 100nF",need:4200,pick:4200,st:"g",stt:"已備足"},
    {no:"R-4R7-0603",nm:"電阻 0603 4.7Ω",need:1800,pick:1800,st:"g",stt:"已備足"},
    {no:"L-2R2H-0805",nm:"功率電感 2.2µH",need:600,pick:600,st:"g",stt:"已備足"},
    {no:"D-SS34-SMA",nm:"蕭特基二極體",need:320,pick:320,st:"g",stt:"已備足"},
    {no:"U-PMIC-QFN24",nm:"電源管理 IC QFN24",need:80,pick:0,st:"y",stt:"待領料"},
    {no:"CN-USB-C16",nm:"USB-C 連接器 16P",need:80,pick:0,st:"r",stt:"缺料"}
  ];
  var rows=bom.map(function(r){
    return '<tr><td class="mono">'+esc(r.no)+'</td><td>'+esc(r.nm)+'</td><td class="mono">'+r.need.toLocaleString()+'</td>'+
      '<td class="mono">'+r.pick.toLocaleString()+'</td><td><span class="tag '+r.st+'">'+r.stt+'</span></td></tr>';
  }).join("");

/* ---------- charts ---------- */
var FONT={family:"'Noto Sans TC',sans-serif"};
var TICK="#8ba0bd", GRID="rgba(56,189,248,.10)";
function axes(yCb){
  return {x:{ticks:{font:FONT,color:TICK},grid:{display:false}},y:{beginAtZero:true,ticks:{font:FONT,color:TICK,callback:yCb},grid:{color:GRID}}};
}
function mkCharts(i){
  if(i===2){
    var e=document.getElementById("c2");
    if(e) chartRefs.push(new Chart(e,{type:"bar",data:{labels:["8/07","8/08","8/09","8/10","8/11","8/12","8/13"],datasets:[{label:"攔截次數",data:[6,4,7,3,5,4,3],backgroundColor:"#38bdf8",borderRadius:6,maxBarThickness:30}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:axes(function(v){return v;})}}));
  }else if(i===3){
    var e3=document.getElementById("c3");
    if(e3) chartRefs.push(new Chart(e3,{type:"line",data:{labels:["08時","09時","10時","11時","12時","13時","14時"],datasets:[
      {label:"M-01",data:[18,22,24,21,23,25,24],borderColor:"#38bdf8",backgroundColor:"rgba(56,189,248,.14)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:"#38bdf8"},
      {label:"M-03",data:[20,23,26,27,25,28,27],borderColor:"#22c55e",backgroundColor:"rgba(34,197,94,.10)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:"#22c55e"}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:FONT,color:"#cfe6fb"}}},scales:axes(function(v){return v;})}}));
  }else if(i===5){
    var e5=document.getElementById("c5a");
    if(e5) chartRefs.push(new Chart(e5,{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"防呆攔截率 %",data:[98.2,98.6,98.9,99.2,99.4,99.6],borderColor:"#38bdf8",backgroundColor:"rgba(56,189,248,.14)",fill:true,tension:.35,pointRadius:4,pointBackgroundColor:"#38bdf8"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:FONT,color:TICK},grid:{display:false}},y:{min:97,max:100,ticks:{font:FONT,color:TICK,callback:function(v){return v+"%";}},grid:{color:GRID}}}}}));
    var e5b=document.getElementById("c5b");
    if(e5b) chartRefs.push(new Chart(e5b,{type:"doughnut",data:{labels:["領錯料號","槽位對位","批次逾效","換料誤裝"],datasets:[{data:[18,11,7,5],backgroundColor:["#0369a1","#38bdf8","#7dd3fc","#f59e0b"],borderWidth:2,borderColor:"#0f1a2c"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{display:false}}}}));
  }
}

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void view.offsetHeight;
  mkCharts(i);
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="t">'+n.t+'</span></button>';}).join("");
  nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)show(+b.getAttribute("data-i"));});
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
