<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SMT餵料防呆管理系統（Feeder / Component Verification System）｜Jvision 系統 Demo</title>
<meta name="description" content="料號料盤條碼掃描比對、餵料槽位對位、換料防呆與用料履歷追溯的 SMT 現場管制終端" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --accent-l:#BFDBFE;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --panel2:#F1F5F9;
  --card:#FFFFFF;
  --sub:#475569;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#2563EB;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --shadow-hover:0 2px 4px rgba(15,23,42,.06),0 14px 32px rgba(37,99,235,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--color-background)}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{color:#fff;background:var(--color-primary)}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(14px);
}
.topbar-in{
  max-width:1440px;
  min-height:76px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:44px;
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:var(--color-primary);
  border:1px solid #1D4ED8;
  border-radius:8px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.brand .logo .material-symbols-outlined{font-size:25px;color:#fff}
.brand b{
  display:block;
  color:var(--ink);
  font-size:16px;
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand span{display:block;color:var(--muted);font-size:11px;letter-spacing:.015em}
.nav{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  margin-left:auto;
  padding:4px;
  overflow-x:auto;
  background:#F1F5F9;
  border:1px solid var(--line);
  border-radius:10px;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:40px;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  color:#334155;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{color:#1D4ED8;background:#fff;border-color:#CBD5E1}
.nav button:active{transform:translateY(1px)}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:0 2px 8px rgba(37,99,235,.22);
}
.nav button.on:hover{color:#fff;background:#1D4ED8;border-color:#1D4ED8}
.nav button:focus-visible{position:relative;z-index:2;outline:3px solid var(--color-ring);outline-offset:2px}
.usr{display:flex;align-items:center;gap:9px;flex:none;padding-left:2px}
.usr .av{
  width:36px;
  height:36px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1E3A8A;
  background:#DBEAFE;
  border:1px solid #93C5FD;
  border-radius:50%;
  font-size:13px;
  font-weight:700;
}
.usr small{color:#475569;font-size:12px;font-weight:500}
.wrap{max-width:1440px;margin:0 auto;padding:28px 24px 72px}
.screen-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.screen-head h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:#0F172A;
  font-size:clamp(21px,2vw,27px);
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.25;
}
.screen-head h1 .material-symbols-outlined{
  width:38px;
  height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--color-primary);
  background:#DBEAFE;
  border:1px solid #BFDBFE;
  border-radius:7px;
  font-size:22px;
}
.screen-head p{max-width:780px;margin:7px 0 0;color:var(--muted);font-size:13px}
.pill{
  min-height:30px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 11px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.pill.ok{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.pill.warn{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.pill.bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.pill.info{color:#1E40AF;background:#DBEAFE;border-color:#93C5FD}
.pill.mut{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.grid{display:grid;gap:16px}
.kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g13{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.g23{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:10px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#BFDBFE;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card h3{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#0F172A;
  font-size:14px;
  font-weight:700;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card .sub{color:var(--muted);font-size:11.5px;font-weight:400}
.kpi{position:relative;overflow:hidden;padding-top:20px;border-top:3px solid #BFDBFE}
.kpi::after{
  content:"";
  position:absolute;
  right:-28px;
  bottom:-40px;
  width:108px;
  height:108px;
  border:1px solid #DBEAFE;
  border-radius:50%;
  pointer-events:none;
}
.kpi .lab{display:flex;align-items:center;gap:6px;color:#475569;font-size:12px;font-weight:600}
.kpi .num{
  margin-top:8px;
  color:#0F172A;
  font-family:"Fira Code",monospace;
  font-size:29px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
  line-height:1.2;
}
.kpi .num small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .dt{margin-top:7px;color:#475569;font-size:11.5px;font-weight:600}
.kpi .ic{
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(37,99,235,.16);
  border-radius:7px;
}
.kpi .ic .material-symbols-outlined{font-size:21px}
.up{color:#166534!important}.down{color:#991B1B!important}

table{width:100%;min-width:580px;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
  padding:10px 11px;
  color:#334155;
  background:#F1F5F9;
  border-top:1px solid var(--line);
  border-bottom:1px solid #CBD5E1;
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em;
  white-space:nowrap;
}
th:first-child{border-left:1px solid var(--line);border-radius:7px 0 0 0}
th:last-child{border-right:1px solid var(--line);border-radius:0 7px 0 0}
td{padding:11px;color:#334155;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
tbody tr:last-child td{border-bottom:none}
.mono,.scan-line .code,.scan-line .tm,.pline .pv,.gauge .gnum,.mini .m-v,.stat-row .vl{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.mono{font-size:12px;font-weight:600;letter-spacing:-.02em}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid transparent;
  border-radius:5px;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.g{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.tag.y{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.tag.r{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.tag.b{color:#1E40AF;background:#DBEAFE;border-color:#93C5FD}
.tag.gr{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.bar{height:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--color-primary)}
.chart-box{position:relative;height:270px}
.chart-sm{position:relative;height:210px}

.machine{display:grid;grid-template-columns:repeat(2,minmax(430px,1fr));gap:14px}
.mc{min-width:0;padding:14px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px}
.mc-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.mc-h b{color:#0F172A;font-size:13px}
.mc-h .side{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(8,minmax(40px,1fr));gap:6px}
.slot{
  aspect-ratio:1/1.28;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#334155;
  background:#fff;
  border:1px solid #CBD5E1;
  border-radius:5px;
  font-family:"Fira Code",monospace;
  cursor:default;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.slot:hover{z-index:1;transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,23,42,.12)}
.slot::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#94A3B8;border-radius:4px 4px 0 0}
.slot .sn{color:#475569;font-size:9px;font-weight:600}
.slot .sv{color:#334155;font-size:8px;font-weight:700;line-height:1}
.slot.ok{background:#F0FDF4;border-color:#86EFAC}
.slot.ok::before{background:#15803D}
.slot.ok .sv{color:#166534}
.slot.err{background:#FEF2F2;border:2px solid #DC2626}
.slot.err::before{background:#DC2626}
.slot.err .sv{color:#991B1B}
.slot.err::after{content:"!";position:absolute;right:3px;top:5px;color:#991B1B;font:700 10px "Fira Code"}
.slot.low{background:#FFFBEB;border-color:#F59E0B}
.slot.low::before{background:#B45309}
.slot.low .sv{color:#92400E}
.slot.low::after{content:"LOW";position:absolute;right:2px;top:6px;color:#92400E;font:700 6px "Fira Code"}
.slot.empty{background:#F8FAFC;border-style:dashed;opacity:.78}
.slot.empty::before{background:#94A3B8}
.slot.empty .sv{color:#64748B}

.scan-term{padding:8px 14px;background:#F8FAFC;border:1px solid #CBD5E1;border-radius:8px;font-family:"Fira Code",monospace}
.scan-line{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 3px;border-bottom:1px dashed #CBD5E1;font-size:12px}
.scan-line:last-child{border-bottom:none}
.scan-line .st{width:9px;height:9px;flex:none;border:2px solid currentColor;border-radius:50%}
.scan-line .code{flex:none;color:#1E3A8A;font-weight:600}
.scan-line .msg{flex:1;min-width:0;overflow:hidden;color:#475569;text-overflow:ellipsis;white-space:nowrap}
.scan-line .tm{flex:none;color:#64748B;font-size:10.5px}
.big-scan{
  position:relative;
  overflow:hidden;
  padding:24px 18px;
  text-align:center;
  background:#EFF6FF;
  border:1px solid #93C5FD;
  border-radius:8px;
}
.big-scan::before,.big-scan::after{content:"";position:absolute;width:20px;height:20px;border-color:#2563EB}
.big-scan::before{left:10px;top:10px;border-left:2px solid;border-top:2px solid}
.big-scan::after{right:10px;bottom:10px;border-right:2px solid;border-bottom:2px solid}
.big-scan .ring{
  width:76px;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  color:var(--color-primary);
  background:#fff;
  border:2px solid var(--color-primary);
  border-radius:8px;
  box-shadow:6px 6px 0 #BFDBFE;
}
.big-scan .ring .material-symbols-outlined{color:var(--color-primary);font-size:40px}
.big-scan>div[style*="color:#cfe6fb"]{color:#0F172A!important}
.big-scan .laser{position:absolute;left:18px;right:18px;top:0;height:2px;background:var(--color-accent);animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(28px)}50%{transform:translateY(150px)}}

.gate{display:flex;align-items:center;gap:15px;padding:16px;background:#F8FAFC;border:1px solid var(--line);border-left-width:4px;border-radius:8px}
.gate .glamp{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:7px}
.gate .glamp .material-symbols-outlined{font-size:30px}
.gate.pass{border-left-color:#15803D}.gate.pass .glamp{color:#166534;background:#DCFCE7;border:1px solid #86EFAC}
.gate.block{border-left-color:#DC2626}.gate.block .glamp{color:#991B1B;background:#FEE2E2;border:1px solid #FCA5A5}
.gate .gt{color:#0F172A;font-size:15px;font-weight:700}
.gate.block .gt{color:#991B1B!important}
.gate .gd{margin-top:3px;color:var(--muted);font-size:12px}
.alert{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px;padding:12px;background:#F8FAFC;border:1px solid var(--line);border-left-width:4px;border-radius:7px}
.alert:last-child{margin-bottom:0}
.alert .ai{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px}
.alert .ai .material-symbols-outlined{font-size:19px}
.alert.r{background:#FFF7F7;border-left-color:#DC2626}.alert.r .ai{color:#991B1B;background:#FEE2E2}
.alert.y{background:#FFFBEB;border-left-color:#B45309}.alert.y .ai{color:#92400E;background:#FEF3C7}
.alert.b{border-left-color:#2563EB}.alert.b .ai{color:#1E40AF;background:#DBEAFE}
.alert .txt{min-width:0;flex:1}.alert .txt b{color:#0F172A;font-size:13px}
.alert .txt p{margin:3px 0 0;color:var(--muted);font-size:12px}
.alert .rt{color:#475569;font-size:10.5px;font-weight:700;white-space:nowrap}

.pline{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.pline:last-child{border-bottom:none}
.pline .pm{width:96px;flex:none;color:#0F172A;font-size:12.5px;font-weight:700}
.pline .pm small{display:block;color:var(--muted);font-size:10.5px;font-weight:500}
.pline .pbar{flex:1;min-width:0}
.pline .pv{width:56px;flex:none;color:#334155;text-align:right;font-size:12px;font-weight:700}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gauge{min-width:0;padding:14px;text-align:left;background:#F8FAFC;border:1px solid var(--line);border-radius:8px}
.gauge .gn{color:#475569;font-size:11px;font-weight:600}
.gauge .gnum{margin:6px 0 8px;color:#1E3A8A!important;font-size:22px;font-weight:700}
.gauge .bar{height:6px}
.gauge .gl{margin-top:6px;color:var(--muted);font-size:10.5px;font-weight:600}

.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:#CBD5E1}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dotmk{position:absolute;left:-26px;top:2px;width:16px;height:16px;background:#fff;border:3px solid #2563EB;border-radius:50%}
.tl-item.done .dotmk{background:#2563EB;box-shadow:0 0 0 3px #DBEAFE}
.tl-item.done .dotmk::after{content:"✓";position:absolute;left:1px;top:-4px;color:#fff;font:700 8px sans-serif}
.tl-item.bad .dotmk{background:#DC2626;border-color:#DC2626;box-shadow:0 0 0 3px #FEE2E2}
.tl-item.bad .dotmk::after{content:"!";position:absolute;left:3px;top:-5px;color:#fff;font:700 9px sans-serif}
.tl-item .tt{color:#0F172A;font-size:13px;font-weight:700}
.tl-item .tt .mono{color:#1D4ED8}
.tl-item .ds{margin-top:3px;color:var(--muted);font-size:11.5px}
.trace{padding:12px 14px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px}
.trace .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #CBD5E1;font-size:12px}
.trace .row:last-child{border-bottom:none}
.trace .row .k{flex:none;color:var(--muted)}
.trace .row .v{min-width:0;color:#1E293B;text-align:right;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:#475569;font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;display:inline-block;border:1px solid rgba(15,23,42,.18);border-radius:2px}
.callo{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;background:#EFF6FF;border:1px solid #BFDBFE;border-left:4px solid #2563EB;border-radius:7px}
.callo .material-symbols-outlined{flex:none;color:#1D4ED8;font-size:21px}
.callo b{color:#1E3A8A;font-size:12.5px}

<script>
"use strict";
var chartRefs=[];
function killCharts(){for(var i=0;i<chartRefs.length;i++){try{chartRefs[i].destroy();}catch(e){}}chartRefs=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var NAV=[
  {i:0,ic:"qr_code_scanner",t:"領料掃碼"},
  {i:1,ic:"grid_on",t:"槽位對位"},
  {i:2,ic:"verified_user",t:"防呆上機"},
  {i:3,ic:"precision_manufacturing",t:"生產執行"},
  {i:4,ic:"history_edu",t:"用料履歷"},
  {i:5,ic:"gpp_maybe",t:"誤料稽核"}
];

/* ---------- helpers ---------- */
function sh(ic,t,d,extra){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h1><p>'+d+'</p></div>'+(extra||"")+'</div>';
}
function kpi(lab,ic,num,unit,bg,col,dt,dir){
  var dc=dir==="up"?"up":dir==="down"?"down":"";
  var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">trending_up</span>':dir==="down"?'<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">trending_down</span>':'';
  return '<div class="card kpi"><div class="ic" style="background:'+bg+'"><span class="material-symbols-outlined" style="color:'+col+'">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="num">'+num+' <small>'+unit+'</small></div>'+
    '<div class="dt '+dc+'">'+arrow+' '+dt+'</div></div>';
}
function statRow(nm,v,max,col){
  var pct=Math.round(v/max*100);
  return '<div class="stat-row"><div class="nm">'+esc(nm)+'</div><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div><div class="vl">'+v+'</div></div>';
}

/* ================= SCREEN 0 · 領料掃碼比對 ================= */

  '<div class="grid kpi4" style="margin-bottom:15px">'+

    kpi("領錯攔截","block",4,"筆","rgba(239,68,68,.14)","var(--bad)","全數即時擋下","down")+

var FONT={family:"'Noto Sans TC',sans-serif"};
var TICK="#8ba0bd", GRID="rgba(56,189,248,.10)";
function axes(yCb){
  return {x:{ticks:{font:FONT,color:TICK},grid:{display:false}},y:{beginAtZero:true,ticks:{font:FONT,color:TICK,callback:yCb},grid:{color:GRID}}};
}
function mkCharts(i){
  if(i===2){
    var e=document.getElementById("c2");
    if(e) chartRefs.push(new Chart(e,{type:"bar",data:{labels:["8/07","8/08","8/09","8/10","8/11","8/12","8/13"],datasets:[{label:"攔截次數",data:[6,4,7,3,5,4,3],backgroundColor:"#38bdf8",borderRadius:6,maxBarThickness:30}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:axes(function(v){return v;})}}));

    var e3=document.getElementById("c3");
    if(e3) chartRefs.push(new Chart(e3,{type:"line",data:{labels:["08時","09時","10時","11時","12時","13時","14時"],datasets:[

    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:FONT,color:"#cfe6fb"}}},scales:axes(function(v){return v;})}}));
  }else if(i===5){
    var e5=document.getElementById("c5a");

  }
}

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void view.offsetHeight;
  mkCharts(i);
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="t">'+n.t+'</span></button>';}).join("");
  nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)show(+b.getAttribute("data-i"));});
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
