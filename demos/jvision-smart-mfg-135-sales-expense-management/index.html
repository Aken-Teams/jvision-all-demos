<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>業務費用報支管理 Sales Expense Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --ok:#047857;
  --warn:#A15C00;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --sidebar:#0F172A;
  --sidebar-muted:#CBD5E1;
  --radius:8px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  background:var(--color-background);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.3);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:0 0 232px;
  flex-direction:column;
  height:100vh;
  padding:24px 16px 18px;
  background:var(--sidebar);
  color:#fff;
  border-right:1px solid #1E293B;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:52px;
  padding:0 8px 22px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.brand .logo{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  flex:0 0 38px;
  color:#fff;
  background:var(--blue);
  border-radius:6px;
}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{
  display:block;
  color:#fff;
  font-size:14px;
  font-weight:700;
  line-height:1.35;
  letter-spacing:.02em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:2px;
  color:#94A3B8;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  letter-spacing:.03em;
}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.nav button{
  display:flex;
  align-items:center;
  width:100%;
  min-height:42px;
  gap:11px;
  padding:9px 10px;
  color:var(--sidebar-muted);
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease;
}
.nav button .material-symbols-outlined{font-size:19px;flex:0 0 auto}
.nav button .lbl{min-width:0;font-size:13px;font-weight:500}
.nav button .idx{
  margin-left:auto;
  color:#64748B;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.nav button:hover{color:#fff;background:#1E293B}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:#60A5FA;
}
.nav button.on .idx{color:#DBEAFE}
.side-foot{
  margin-top:auto;
  padding:15px 8px 0;
  color:#94A3B8;
  border-top:1px solid rgba(255,255,255,.1);
  font-size:11px;
  line-height:1.7;
}
.side-foot b{color:#fff;font-family:"Fira Code",monospace}
.main{flex:1;min-width:0;padding:28px 30px 48px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}
.topbar .tt{min-width:0}
.topbar h1{
  margin:0 0 6px;
  font-size:22px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.02em;
}
.topbar p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:36px;
  padding:7px 12px;
  color:#334155;
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px;
  font-size:11.5px;
  font-weight:500;
  white-space:nowrap;
}
.chip .dot{
  position:relative;
  width:8px;
  height:8px;
  flex:0 0 8px;
  background:var(--ok);
  border-radius:50%;
}
.chip .dot:after{
  content:"";
  position:absolute;
  inset:-3px;
  border:1px solid rgba(4,120,87,.28);
  border-radius:50%;
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.card{
  min-width:0;
  padding:17px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.card:hover{border-color:#C8D8F5;box-shadow:0 2px 3px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.06)}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 4px;font-size:14px;font-weight:700;line-height:1.4}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:11.5px;line-height:1.5}
.kpi{position:relative;overflow:hidden}
.kpi .bar{
  position:absolute;
  top:0;
  left:0;
  width:3px;
  height:100%;
  background:var(--blue);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:500;
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  margin:10px 0 5px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:600;
  line-height:1.1;
  letter-spacing:-.04em;
}
.kpi .val small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:500;
  letter-spacing:0;
}
.kpi .delta,.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10.5px;
  font-weight:600;
  line-height:1.5;
}
.kpi .delta{padding:2px 7px}
.tag{padding:3px 7px}
.delta.up,.t-ok{color:#065F46;background:#ECFDF5;border-color:#A7F3D0}
.delta.dn,.t-bad{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.delta.nu,.t-info{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.t-warn{color:#854D0E;background:#FFFBEB;border-color:#FDE68A}
.t-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-pink{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:9px 12px;
  color:#475569;
  background:#F8FAFC;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.04em;
}
td{
  padding:10px 12px;
  color:#24324A;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  vertical-align:middle;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
tbody tr:last-child td{border-bottom:0}
.mono,.money,.tkt .no,.tkt .amt,.receipt{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.money{font-weight:600}
.bars{display:flex;flex-direction:column;gap:13px}
.barrow .brk{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:6px;
  color:#334155;
  font-size:11.5px;
}
.barrow .brk b{font-family:"Fira Code",monospace;font-size:11px;font-weight:600}
.track{height:6px;overflow:hidden;background:#E8EEF8;border-radius:2px}
.track i{display:block;height:100%;background:var(--blue);border-radius:2px}
.chartbox{width:100%;min-width:0;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:10px}
.col{
  min-width:0;
  padding:10px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:6px;
}
.col .ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
  color:#334155;
  font-size:11.5px;
  font-weight:700;
}
.col .ch .cnt{
  min-width:24px;
  padding:2px 7px;
  color:#475569;
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tkt{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:5px;
  transition:border-color .2s ease,transform .2s ease;
}
.tkt:hover{transform:translateY(-1px);border-color:#BFDBFE;border-left-color:var(--color-accent)}
.tkt:last-child{margin-bottom:0}
.tkt .no{color:var(--muted);font-size:9.5px;font-weight:500}
.tkt .amt{margin:5px 0 4px;color:var(--ink);font-size:13px;font-weight:600}
.tkt .who{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:10.5px;
}
.tkt .who .av,.avatar{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  font-weight:600;
}
.tkt .who .av{width:19px;height:19px;font-size:9px}
.avatar{width:25px;height:25px;font-size:10px}
.who2{display:flex;align-items:center;gap:8px}
.tl{position:relative;padding-left:25px}
.tl:before{
  content:"";
  position:absolute;
  top:6px;
  bottom:6px;
  left:7px;
  width:1px;
  background:#CBD5E1;
}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev .dt{
  position:absolute;
  top:2px;
  left:-24px;
  width:15px;
  height:15px;
  background:#fff;
  border:2px solid #94A3B8;
  border-radius:50%;
}
.tl .ev.done .dt{background:var(--ok);border-color:var(--ok)}
.tl .ev.done .dt:after{
  content:"";
  position:absolute;
  top:2px;
  left:4px;
  width:3px;
  height:6px;
  border:solid #fff;
  border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg);
}
.tl .ev.now .dt{border-color:var(--warn);box-shadow:0 0 0 3px #FEF3C7}
.tl .ev .ti{color:#1E293B;font-size:12px;font-weight:600}
.tl .ev .ti small{margin-left:7px;color:var(--muted);font-size:10px;font-weight:400}
.tl .ev .de{margin-top:3px;color:var(--muted);font-size:10.5px}
.ocr{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px}
.receipt{
  min-width:0;
  padding:18px;
  color:#334155;
  background:#FCFCFD;
  border:1px dashed #94A3B8;
  border-radius:6px;
  font-size:11px;
}
.receipt .rh{
  margin-bottom:10px;
  padding-bottom:10px;
  border-bottom:1px dashed #CBD5E1;
  text-align:center;
}
.receipt .rh b{display:block;font-size:13px;letter-spacing:.08em}
.receipt .li{display:flex;justify-content:space-between;gap:15px;padding:4px 0}
.receipt .tot{
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed #CBD5E1;
  font-size:12px;
  font-weight:700;
}
.receipt .stamp{margin-top:13px;text-align:center}
.receipt .stamp span{
  display:inline-block;
  padding:4px 12px;
  color:#065F46;
  border:2px solid var(--ok);
  border-radius:4px;
  font-weight:700;
  letter-spacing:.05em;
  transform:rotate(-2deg);
}
.field{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:55px;
  margin-bottom:8px;
  padding:9px 11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px;
}
.field:last-child{margin-bottom:0}
.field .fl{color:var(--muted);font-size:10.5px;font-weight:500}
.field .fv{margin-top:3px;color:#1E293B;font-size:12px;font-weight:600}
.field .cf{
  display:flex;
  align-items:center;
  gap:4px;
  color:var(--ok);
  white-space:nowrap;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  font-weight:600;
}
.field .cf.low{color:var(--warn)}
.chk{
  display:flex;
  align-items:flex-start;
  gap:11px;
  margin-bottom:9px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:6px;
}
.chk:last-child{margin-bottom:0}
.chk .ic{
  display:flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  flex:0 0 30px;
  color:#fff;
  border-radius:4px;
}
.chk .ic .material-symbols-outlined{font-size:18px}
.chk.pass .ic{background:var(--ok)}
.chk.fail .ic{background:var(--bad)}
.chk.warn2 .ic{background:var(--warn)}
.chk .bd{min-width:0;flex:1}
.chk .bd .t{color:#1E293B;font-size:12px;font-weight:600}
.chk .bd .d{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.5}
.chk .rt{font-family:"Fira Code",monospace;font-size:9.5px;font-weight:600;white-space:nowrap}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center}
.miniK{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.miniK .m{
  min-width:0;
  padding:11px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:5px;
}
.miniK .m .l{color:var(--muted);font-size:10px;font-weight:500}
.miniK .m .v{
  margin-top:5px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:18px;
  font-weight:600;
}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.stepbar .s{
  position:relative;
  flex:1;
  min-width:120px;
  padding:10px 11px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:5px;
}
.stepbar .s .n{color:var(--muted);font-family:"Fira Code",monospace;font-size:9px;font-weight:600}
.stepbar .s .tt{margin-top:4px;color:#1E293B;font-size:11.5px;font-weight:600}
.stepbar .s .stt{margin-top:6px;font-size:9.5px;font-weight:600}
.stepbar .s.done{background:#F0FDF4;border-color:#86EFAC}
.stepbar .s.now{background:#FFFBEB;border-color:#FCD34D}
@keyframes reveal{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
#view>.grid,#view>.card,#view>.ocr{animation:reveal .35s ease-out both}
#view>.grid:nth-child(2),#view>.card:nth-child(2){animation-delay:.04s}
#view>.grid:nth-child(3),#view>.card:nth-child(3){animation-delay:.08s}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    position:static;
    width:auto;
    height:auto;
    flex-basis:auto;
    padding:12px 14px;
  }
  .brand{padding:0 2px 11px}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:11px;gap:6px}
  .nav button{width:auto;min-height:40px;padding:8px 11px}
  .nav button .idx{display:none}
  .side-foot{display:none}
  .main{padding:20px 16px 40px}
  .topbar{align-items:flex-start;flex-direction:column}
  .chip{white-space:normal}
}
@media(max-width:768px){
  .g2,.g3,.g23,.g32,.ocr{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(190px,1fr))}
}
@media(max-width:560px){
  .main{padding:18px 12px 34px}
  .topbar h1{font-size:19px}
  .g4{grid-template-columns:1fr}
  .nav button .lbl{display:none}
  .nav button{min-width:40px;justify-content:center;padding:9px}
  .board{grid-template-columns:1fr}
  .miniK{grid-template-columns:1fr}
  .card{padding:14px}
  .field{align-items:flex-start}
  .chk{flex-wrap:wrap}
  .chk .rt{width:100%;padding-left:41px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #view>.grid,#view>.card,#view>.ocr{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">request_quote</span></div>
      <div><b>費用報支管理</b><span>Sales Expense Mgmt</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">財務核銷平台 · <b>2026 Q3</b><br>本月已核銷 <b>NT$ 2.84M</b></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h1 id="scTitle">報支總覽儀表</h1>
        <p id="scSub">待審單量、核銷時效與費用結構一頁掌握</p>
      </div>
      <div class="chip"><span class="dot" aria-hidden="true"></span>系統連線正常 · ERP / 財務系統已同步</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"dashboard",name:"報支總覽儀表",desc:"待審單量、核銷時效與費用結構一頁掌握"},
  {icon:"receipt_long",name:"費用申報單",desc:"差旅、交際、樣品等費用線上填報與明細"},
  {icon:"description",name:"發票 OCR 辨識",desc:"拍照上傳自動擷取品項、金額與稅額"},
  {icon:"rule",name:"費用政策檢核",desc:"上限、超支與缺件依政策規則自動比對"},
  {icon:"fact_check",name:"主管審核簽核",desc:"多層簽核、退件補件與審核時效追蹤"},
  {icon:"request_quote",name:"財務核銷付款",desc:"撥款排程、匯款批次與科目過帳對帳"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var chartBase={
    redrawOnParentResize:false,
    redrawOnWindowResize:false,

function pstep(n,t,cls,note){
  var sc=cls==="done"?"var(--ok)":cls==="now"?"var(--warn)":"var(--muted)";
  var st=cls==="done"?"已完成":cls==="now"?"進行中":"待處理";
  return '<div class="s '+cls+'"><div class="n">STEP '+n+'</div><div class="tt">'+t+'</div><div class="stt" style="color:'+sc+'">'+st+' · '+note+'</div></div>';
}
function pay(no,who,acc,amt,cls,st){
  return '<tr><td class="mono">'+no+'</td><td><span class="who2"><span class="avatar">'+who.charAt(0)+'</span>'+who+'</span></td><td style="color:var(--muted)">'+acc+'</td><td style="text-align:right" class="money">'+money(amt)+'</td><td><span class="tag '+cls+'">'+st+'</span></td></tr>';
}
function draw5(){
  mk("c5a",{series:[
    {name:"差旅費",data:[92,88,101,96,110,118]},
    {name:"交際費",data:[54,61,58,66,63,71]},
    {name:"業務推廣",data:[38,42,40,47,51,55]}
  ],chart:{type:"area",height:300,stacked:true},colors:["#2563EB","#3B82F6","#059669"],
    stroke:{width:2,curve:"straight"},fill:{type:"solid",opacity:.14},
    dataLabels:{enabled:false},xaxis:{categories:["3月","4月","5月","6月","7月","8月"],labels:{style:{fontSize:"10px"}}},
    yaxis:{title:{text:"萬",style:{fontSize:"10px"}}},legend:{position:"top",fontSize:"11px"},
    grid:{borderColor:"#E4ECFC"},tooltip:{shared:true,intersect:false}});
}

var VIEWS=[v0,v1,v2,v3,v4,v5];
var DRAWS=[draw0,draw1,draw2,draw3,draw4,draw5];
function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].icon+'</span><span class="lbl">'+MODS[i].name+'</span><span class="idx">'+i+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var i=+this.getAttribute("data-i");
      var next="#v"+i;
      if(location.hash!==next)location.hash=next;
      else show(i);
      try{window.scrollTo(0,0)}catch(e){}
    });
  }
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    var active=+btns[j].getAttribute("data-i")===i;
    btns[j].className=active?"on":"";
    btns[j].setAttribute("aria-current",active?"page":"false");
  }
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].desc;
  var c=document.getElementById("view");
  c.innerHTML=VIEWS[i]();
  void c.offsetHeight;
  DRAWS[i]();
}
buildNav();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
