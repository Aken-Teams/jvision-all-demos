<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務費用報支管理 Sales Expense Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --bg:#f6f4f7; --card:#ffffff;
  --ink:#1f1430; --muted:#7a6d86; --line:#eee3ee; --side:#2a1526; --side2:#3a1e34;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#7c3aed;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;vertical-align:middle;font-size:20px;}
.app{display:flex;min-height:100vh;}
.sidebar{width:248px;background:linear-gradient(180deg,var(--side),var(--side2));color:#f4e8f0;flex-shrink:0;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-size:14.5px;font-weight:800;letter-spacing:.2px;color:#fff;display:block;line-height:1.3;}
.brand span{font-size:11px;color:#c7a9bd;}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#d9c3d2;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.15s;min-width:0;}
.nav button .material-symbols-outlined{font-size:21px;flex-shrink:0;}
.nav button .idx{margin-left:auto;font-size:11px;color:#9d7c92;font-weight:700;}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px var(--accent);}
.nav button.on .idx{color:rgba(255,255,255,.8);}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:#a98aa0;border-top:1px solid rgba(255,255,255,.08);}
.side-foot b{color:#f0d9e6;font-weight:700;}
.main{flex:1;min-width:0;padding:26px 30px 46px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.topbar .tt{min-width:0;}
.topbar h1{font-size:20px;margin:0 0 3px;font-weight:800;letter-spacing:.2px;}
.topbar p{margin:0;color:var(--muted);font-size:13px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.55fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;}
.card .sub{margin:0 0 14px;font-size:12px;color:var(--muted);}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .val{font-size:29px;font-weight:800;margin:9px 0 2px;letter-spacing:-.5px;}
.kpi .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;}
.kpi .delta.up{background:#e7f6ec;color:var(--ok);}
.kpi .delta.dn{background:#fdeaea;color:var(--bad);}
.kpi .delta.nu{background:#f3edf9;color:var(--info);}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;letter-spacing:.3px;}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:#faf5f9;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.t-ok{background:#e7f6ec;color:var(--ok);}
.t-warn{background:#fdf1e3;color:var(--warn);}
.t-bad{background:#fdeaea;color:var(--bad);}
.t-info{background:#f0eafb;color:var(--info);}
.t-mut{background:#f0ecf2;color:var(--muted);}
.t-pink{background:#fce7f3;color:var(--accent);}
.mono{font-variant-numeric:tabular-nums;font-family:'Inter',sans-serif;}
.money{font-weight:700;font-variant-numeric:tabular-nums;}
.bars{display:flex;flex-direction:column;gap:13px;}
.barrow .brk{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.barrow .brk b{font-weight:700;}
.track{height:9px;border-radius:999px;background:#f0e7ee;overflow:hidden;}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{width:100%;overflow:hidden;min-width:0;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.col{background:#faf6f9;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.col .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:12.5px;font-weight:800;}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);}
.tkt{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:11px;margin-bottom:10px;}
.tkt:last-child{margin-bottom:0;}
.tkt .no{font-size:11px;color:var(--muted);font-weight:700;}
.tkt .amt{font-size:15px;font-weight:800;margin:4px 0 2px;}
.tkt .who{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.tkt .who .av{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;}
/* timeline */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 20px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev .dt{position:absolute;left:-26px;top:1px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
.tl .ev.done .dt{background:var(--accent);border-color:var(--accent);}
.tl .ev.now .dt{border-color:var(--warn);box-shadow:0 0 0 4px #fdf1e3;}
.tl .ev .ti{font-size:13px;font-weight:700;}
.tl .ev .ti small{font-weight:600;color:var(--muted);margin-left:8px;font-size:11px;}
.tl .ev .de{font-size:12px;color:var(--muted);margin-top:3px;}
/* ocr */
.ocr{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;}
.receipt{background:linear-gradient(180deg,#fff,#fdf7fb);border:1px dashed var(--accent2);border-radius:13px;padding:18px;font-family:'Inter',monospace;font-size:12px;color:#4a3a45;min-width:0;}
.receipt .rh{text-align:center;border-bottom:1px dashed #d9b9cd;padding-bottom:10px;margin-bottom:10px;}
.receipt .rh b{font-size:14px;display:block;letter-spacing:2px;}
.receipt .li{display:flex;justify-content:space-between;padding:4px 0;}
.receipt .tot{border-top:1px dashed #d9b9cd;margin-top:8px;padding-top:8px;font-weight:800;font-size:13px;}
.receipt .stamp{margin-top:12px;text-align:center;}
.receipt .stamp span{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:4px 14px;font-weight:800;transform:rotate(-6deg);letter-spacing:1px;}
.field{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;}
.field:last-child{margin-bottom:0;}
.field .fl{font-size:11.5px;color:var(--muted);font-weight:600;}
.field .fv{font-size:13.5px;font-weight:700;margin-top:2px;}
.field .cf{font-size:11px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:4px;white-space:nowrap;}
.field .cf.low{color:var(--warn);}
/* policy */
.chk{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:11px;align-items:flex-start;}
.chk:last-child{margin-bottom:0;}
.chk .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chk .ic .material-symbols-outlined{font-size:20px;color:#fff;}
.chk.pass .ic{background:var(--ok);} .chk.fail .ic{background:var(--bad);} .chk.warn2 .ic{background:var(--warn);}
.chk .bd{min-width:0;flex:1;}
.chk .bd .t{font-size:13px;font-weight:700;}
.chk .bd .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
.chk .rt{font-size:11px;font-weight:700;white-space:nowrap;}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.miniK{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
.miniK .m{background:#faf6f9;border:1px solid var(--line);border-radius:11px;padding:12px;min-width:0;}
.miniK .m .l{font-size:11px;color:var(--muted);font-weight:600;}
.miniK .m .v{font-size:20px;font-weight:800;margin-top:5px;}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.stepbar .s{flex:1;min-width:120px;background:#faf6f9;border:1px solid var(--line);border-radius:11px;padding:11px 12px;position:relative;}
.stepbar .s .n{font-size:11px;color:var(--muted);font-weight:700;}
.stepbar .s .tt{font-size:12.5px;font-weight:700;margin-top:3px;}
.stepbar .s .stt{font-size:11px;margin-top:5px;font-weight:700;}
.stepbar .s.done{border-color:var(--accent2);background:#fdf2f8;}
.stepbar .s.now{border-color:var(--warn);background:#fdf7ef;}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.who2{display:flex;align-items:center;gap:8px;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;height:auto;position:static;flex-direction:column;padding:12px 14px;}
  .brand{padding:2px 4px 12px;}
  .side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px;}
  .nav button{width:auto;padding:9px 13px;}
  .nav button .idx{display:none;}
  .main{padding:20px 16px 40px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
  .ocr{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button span.lbl{display:none;}
  .nav button{padding:9px 11px;}
  .board{grid-template-columns:1fr;}
  .miniK{grid-template-columns:1fr;}
  .topbar h1{font-size:17px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">request_quote</span></div>
      <div><b>費用報支管理</b><span>Sales Expense Mgmt</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">財務核銷平台 · <b>2026 Q3</b><br/>本月已核銷 <b>NT$ 2.84M</b></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h1 id="scTitle">報支總覽儀表</h1>
        <p id="scSub">待審單量、核銷時效與費用結構一頁掌握</p>
      </div>
      <div class="chip"><span class="dot"></span> 系統連線正常 · ERP / 財務系統已同步</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"dashboard",name:"報支總覽儀表",desc:"待審單量、核銷時效與費用結構一頁掌握"},
  {icon:"receipt_long",name:"費用申報單",desc:"差旅、交際、樣品等費用線上填報與明細"},
  {icon:"description",name:"發票 OCR 辨識",desc:"拍照上傳自動擷取品項、金額與稅額"},
  {icon:"rule",name:"費用政策檢核",desc:"上限、超支與缺件依政策規則自動比對"},
  {icon:"fact_check",name:"主管審核簽核",desc:"多層簽核、退件補件與審核時效追蹤"},
  {icon:"request_quote",name:"財務核銷付款",desc:"撥款排程、匯款批次與科目過帳對帳"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var chartBase={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Inter, Noto Sans TC, sans-serif"};opt.chart=Object.assign(chartBase,opt.chart||{});var c=new ApexCharts(el,opt);c.render();charts.push(c);}
function money(n){return n.toLocaleString("en-US");}

/* ============ SCREEN 0 : 總覽儀表 ============ */
function v0(){
  return ''+
  '<div class="grid g4">'+
    kpiCard("receipt_long","待審報支單","38","筆","up","+6 較昨日")+
    kpiCard("schedule","平均核銷時效","2.4","天","nu","目標 &le; 3 天")+
    kpiCard("verified","費用合規率","94.2","%","up","+3.1%")+
    kpiCard("payments","本月核銷金額","2.84M","","up","NT$ · +12%")+
  '</div>'+
  '<div class="grid g23" style="margin-top:16px">'+
    '<div class="card"><h3>近 8 週核銷金額與時效</h3><p class="sub">核銷金額（NT$ 萬）對照平均處理天數</p><div class="chartbox"><div id="c0a"></div></div></div>'+
    '<div class="card"><h3>費用類別占比</h3><p class="sub">本月已核銷費用結構</p><div class="chartbox"><div id="c0b"></div></div></div>'+
  '</div>'+
  '<div class="grid g32" style="margin-top:16px">'+
    '<div class="card"><h3>各部門報支狀態</h3><p class="sub">合規率表現</p><div class="bars">'+
      deptBar("北區業務處",72,88)+deptBar("中區業務處",64,91)+deptBar("南區業務處",58,83)+deptBar("海外業務處",41,79)+deptBar("行銷企劃部",33,95)+
    '</div></div>'+
    '<div class="card pad0"><div style="padding:18px 18px 4px"><h3>待處理報支單</h3><p class="sub">依金額由高至低排序</p></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>單號</th><th>申請人</th><th>類別</th><th style="text-align:right">金額</th><th>狀態</th></tr></thead><tbody>'+
      row0("EXP-26081","林昱辰","差旅費",42800,"t-warn","待審核")+
      row0("EXP-26079","陳品妍","交際費",31500,"t-info","檢核中")+
      row0("EXP-26076","王承澤","樣品費",28900,"t-warn","待審核")+
      row0("EXP-26071","張雅涵","差旅費",19200,"t-bad","缺件退回")+
      row0("EXP-26068","黃冠宇","業務推廣",15600,"t-ok","已核准")+
      row0("EXP-26065","李思穎","交通費",8400,"t-info","檢核中")+
    '</tbody></table></div></div>'+
  '</div>';
}
function kpiCard(ic,lab,val,unit,cls,delta){
  return '<div class="card kpi"><span class="bar"></span><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<span class="delta '+cls+'">'+delta+'</span></div>';
}
function deptBar(n,pct,comp){
  return '<div class="barrow"><div class="brk"><span>'+n+'</span><b>合規 '+comp+'%</b></div><div class="track"><i style="width:'+pct+'%"></i></div></div>';
}
function row0(no,who,cat,amt,cls,st){
  return '<tr><td class="mono">'+no+'</td><td><span class="who2"><span class="avatar">'+who.charAt(0)+'</span>'+who+'</span></td><td>'+cat+'</td><td style="text-align:right" class="money">'+money(amt)+'</td><td><span class="tag '+cls+'">'+st+'</span></td></tr>';
}
function draw0(){
  mk("c0a",{series:[
    {name:"核銷金額(萬)",type:"column",data:[184,210,176,232,258,241,276,284]},
    {name:"平均時效(天)",type:"line",data:[3.4,3.1,3.3,2.9,2.6,2.7,2.5,2.4]}
  ],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:300,stacked:false},stroke:{width:[0,3],curve:"smooth"},colors:["#db2777","#7c3aed"],
    plotOptions:{bar:{columnWidth:"48%",borderRadius:5}},dataLabels:{enabled:false},
    xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8"],labels:{style:{fontSize:"11px"}}},
    yaxis:[{title:{text:"金額(萬)",style:{fontSize:"11px"}}},{opposite:true,title:{text:"天",style:{fontSize:"11px"}},max:5}],
    legend:{position:"top",fontSize:"12px"},grid:{borderColor:"#f0e7ee"},tooltip:{shared:false}});
  mk("c0b",{series:[38,24,16,13,9],labels:["差旅費","交際費","業務推廣","樣品費","雜項"],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300},
    colors:["#db2777","#f472b6","#7c3aed","#a78bfa","#fbcfe8"],legend:{position:"bottom",fontSize:"12px"},
    dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總費用",formatter:function(){return"NT$2.84M";}}}}}},
    stroke:{width:2,colors:["#fff"]}});
}

/* ============ SCREEN 1 : 費用申報單 ============ */
function v1(){
  return ''+
  '<div class="grid g32">'+
    '<div class="card">'+
      '<h3>費用申報單 · EXP-26081</h3><p class="sub">北區業務處 · 林昱辰 · 2026-08-13 建立</p>'+
      '<div class="field"><div><div class="fl">費用類別</div><div class="fv">差旅費（客戶拜訪）</div></div><span class="tag t-pink">TRAVEL</span></div>'+
      '<div class="field"><div><div class="fl">出差事由</div><div class="fv">台中精機客戶 Q3 設備導入洽談</div></div></div>'+
      '<div class="field"><div><div class="fl">出差期間</div><div class="fv">2026-08-11 ~ 08-12（2 天）</div></div></div>'+

var DRAWS=[draw0,draw1,draw2,draw3,draw4,draw5];
function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="lbl">'+MODS[i].name+'</span><span class="idx">'+i+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].className=(+btns[j].getAttribute("data-i")===i)?"on":"";}
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].desc;
  var c=document.getElementById("view");
  c.innerHTML=VIEWS[i]();
  void c.offsetHeight;
  DRAWS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
