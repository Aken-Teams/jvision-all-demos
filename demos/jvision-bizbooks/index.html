<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業財務記帳｜Jvision 財務會計系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#F59E0B;
 --color-on-primary:#0F172A;
 --color-secondary:#FBBF24;
 --color-on-secondary:#0F172A;
 --color-accent:#8B5CF6;
 --color-on-accent:#000;
 --color-background:#0F172A;
 --color-foreground:#F8FAFC;
 --color-card:#222735;
 --color-card-foreground:#F8FAFC;
 --color-muted:#272F42;
 --color-muted-foreground:#AEBACB;
 --color-border:#334155;
 --color-destructive:#EF4444;
 --color-on-destructive:#000;
 --color-ring:#F59E0B;
 --blue:#93C5FD;
 --ink:#F8FAFC;
 --muted:#AEBACB;
 --line:#334155;
 --green:#4ADE80;
 --red:#F87171;
 --amber:#FBBF24;
 --surface:#172033;
 --shadow:0 16px 38px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
 min-height:100vh;
 font-family:"IBM Plex Sans",sans-serif;
 color:var(--ink);
 background:
  linear-gradient(rgba(51,65,85,.18) 1px,transparent 1px),
  linear-gradient(90deg,rgba(51,65,85,.18) 1px,transparent 1px),
  var(--color-background);
 background-size:48px 48px;
 line-height:1.5;
 -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid var(--color-ring);
 outline-offset:3px;
}
.ms{
 font-family:"Material Symbols Outlined";
 font-size:20px;
 line-height:1;
 vertical-align:middle;
}
.min0{min-width:0}
header{
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(15,23,42,.94);
 border-bottom:1px solid var(--line);
 box-shadow:0 8px 28px rgba(0,0,0,.2);
 backdrop-filter:blur(14px);
}
.bar{
 display:flex;
 align-items:center;
 gap:16px;
 max-width:1440px;
 margin:auto;
 padding:14px 28px 10px;
}
.brand{display:flex;align-items:center;gap:13px}
.logo{
 display:grid;
 place-items:center;
 width:42px;
 height:42px;
 flex:none;
 color:var(--color-on-primary);
 background:var(--color-primary);
 border:1px solid #FCD34D;
 border-radius:6px;
 box-shadow:5px 5px 0 #713F12;
}
.logo .ms{font-size:24px}
.bt{display:flex;flex-direction:column}
.bt b{font-size:16px;font-weight:700;letter-spacing:.02em}
.bt span{font-size:11.5px;color:var(--muted)}
.hspace{flex:1}
.fiscal{
 display:flex;
 align-items:center;
 gap:9px;
 padding:7px 12px;
 color:#FDE68A;
 background:#2A251D;
 border:1px solid #785A20;
 border-radius:4px;
 font-size:12px;
 font-weight:600;
 white-space:nowrap;
}
.fiscal .dot{
 width:8px;
 height:8px;
 border-radius:50%;
 background:var(--green);
 box-shadow:0 0 0 3px rgba(74,222,128,.14);
 animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.4}}
nav{
 display:flex;
 gap:6px;
 max-width:1440px;
 margin:auto;
 padding:0 28px 12px;
 overflow-x:auto;
 scrollbar-width:thin;
}
nav button{
 display:flex;
 align-items:center;
 gap:7px;
 flex:none;
 padding:9px 13px;
 color:var(--muted);
 background:transparent;
 border:1px solid transparent;
 border-radius:4px;
 font-size:13px;
 font-weight:600;
 white-space:nowrap;
 transition:color .2s,background .2s,border-color .2s,transform .2s;
}
nav button:hover{
 color:var(--ink);
 background:var(--color-muted);
 border-color:#475569;
 transform:translateY(-1px);
}
nav button.on{
 color:var(--color-on-primary);
 background:var(--color-primary);
 border-color:#FCD34D;
 box-shadow:3px 3px 0 #713F12;
}
nav button .num{
 font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;
 opacity:.72;
}
nav button .ms{font-size:18px}
main{max-width:1440px;margin:auto;padding:30px 28px 64px}
.shead{
 display:flex;
 align-items:flex-start;
 gap:15px;
 margin-bottom:24px;
 padding-bottom:20px;
 border-bottom:1px solid var(--line);
}
.shead .ic{
 display:grid;
 place-items:center;
 width:48px;
 height:48px;
 flex:none;
 color:var(--color-primary);
 background:#2C2A24;
 border:1px solid #66501F;
 border-radius:5px;
}
.shead .ic .ms{font-size:27px}
.shead h1{
 font-size:clamp(21px,2vw,27px);
 line-height:1.2;
 font-weight:700;
 letter-spacing:-.02em;
}
.shead p{max-width:680px;margin-top:5px;color:var(--muted);font-size:13px}
.stag{
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
 margin-left:auto;
}
.chip{
 padding:6px 10px;
 color:#CBD5E1;
 background:var(--color-card);
 border:1px solid var(--line);
 border-radius:3px;
 font-size:11.5px;
 font-weight:600;
 white-space:nowrap;
}
.chip.hot{color:#FDE68A;background:#312A1E;border-color:#80601E}
.g{display:grid;gap:16px;margin-bottom:16px}
.g.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g.k2,.g.c55{grid-template-columns:repeat(2,minmax(0,1fr))}
.g.c64{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.card,.kpi,.pj{
 min-width:0;
 background:linear-gradient(145deg,#252B3A,var(--color-card));
 border:1px solid var(--line);
 border-radius:6px;
 box-shadow:var(--shadow);
}
.card{padding:19px}
.card:hover,.pj:hover{
 border-color:#526178;
 box-shadow:0 18px 42px rgba(0,0,0,.23);
}
.ch{
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:15px;
 padding-bottom:12px;
 border-bottom:1px solid var(--line);
}
.ch h3{font-size:14px;font-weight:700;letter-spacing:.01em}
.ch .ms{color:var(--color-primary)}
.ch .r{margin-left:auto;color:var(--muted);font-size:11.5px;font-weight:500}
.kpi{
 position:relative;
 overflow:hidden;
 padding:17px 18px 16px;
 transition:transform .22s,border-color .22s,box-shadow .22s;
}
.kpi:hover{
 transform:translateY(-2px);
 border-color:#5A6374;
 box-shadow:0 18px 38px rgba(0,0,0,.25);
}
.kpi:before{
 content:"";
 position:absolute;
 inset:0 auto 0 0;
 width:3px;
 background:var(--color-primary);
}
.kpi .kl{
 display:flex;
 align-items:center;
 gap:7px;
 color:var(--muted);
 font-size:12px;
 font-weight:600;
}
.kpi .kl .ms{color:var(--color-primary);font-size:18px}
.kpi .kv{
 margin-top:11px;
 color:var(--ink);
 font-size:clamp(23px,2.1vw,29px);
 font-weight:700;
 letter-spacing:-.035em;
 font-variant-numeric:tabular-nums;
}
.kpi .kv small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:500}
.kpi .kd{
 display:inline-flex;
 align-items:center;
 gap:4px;
 margin-top:6px;
 font-size:11.5px;
 font-weight:600;
}
.kd.up{color:var(--green)}
.kd.dn{color:var(--red)}
.kd.nu{color:var(--muted)}
.kd .ms{font-size:15px}
.tw,.mtx{overflow-x:auto}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12.5px}
th{
 padding:11px 12px;
 color:#CBD5E1;
 background:#182132;
 border-bottom:1px solid #526178;
 font-size:11px;
 font-weight:600;
 letter-spacing:.045em;
 text-align:left;
 white-space:nowrap;
}
td{
 padding:11px 12px;
 border-bottom:1px solid var(--line);
 white-space:nowrap;
}
td:not(:first-child){font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:#293247}
.mono,.amt,.sv,.tka,.pcell .v{
 font-family:ui-monospace,SFMono-Regular,Consolas,monospace!important;
 font-variant-numeric:tabular-nums;
}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.badge{
 display:inline-flex;
 align-items:center;
 gap:5px;
 padding:3px 8px;
 border:1px solid currentColor;
 border-radius:3px;
 font-size:11px;
 font-weight:600;
 white-space:nowrap;
}
.b-green{color:#86EFAC;background:#163429}
.b-red{color:#FCA5A5;background:#411F26}
.b-amber{color:#FDE68A;background:#3B301B}
.b-blue{color:#BFDBFE;background:#1C3250}
.b-gray{color:#CBD5E1;background:#303848}
.chart{width:100%;height:280px}
.chart.sm{height:230px}
.chart.lg{height:320px}
.recon{display:flex;flex-direction:column}
.rrow{
 display:grid;
 grid-template-columns:minmax(0,1fr) auto;
 gap:14px;
 align-items:center;
 padding:13px 3px;
 border-bottom:1px solid var(--line);
}
.rrow:last-child{border-bottom:0}
.rrow .nm{font-size:13px;font-weight:600}
.rrow .mt,.jline .js,.pmeta,.tkm,.tli .tm{
 margin-top:3px;
 color:var(--muted);
 font-size:11.5px;
}
.rrow .amt{font-size:14px;font-weight:700;text-align:right}
.match{
 display:flex;
 align-items:center;
 gap:5px;
 margin-top:5px;
 color:var(--green);
 font-size:11px;
 font-weight:600;
}
.jline{
 display:grid;
 grid-template-columns:auto minmax(0,1fr) auto;
 gap:12px;
 align-items:center;
 margin-bottom:9px;
 padding:12px;
 background:#1A2232;
 border:1px solid var(--line);
 border-radius:4px;
 transition:border-color .2s,background .2s,transform .2s;
}
.jline:hover{background:#202A3C;border-color:#6C5722;transform:translateX(2px)}
.jline .ji{
 display:grid;
 place-items:center;
 width:38px;
 height:38px;
 color:var(--color-primary);
 background:#302B20;
 border:1px solid #654F20;
 border-radius:4px;
}
.jline .jt{font-size:13px;font-weight:600}
.jline .jv{text-align:right}
.dc{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.dc span{padding:2px 6px;border-radius:2px;font-size:10.5px;font-weight:600}
.dc .d{color:#BFDBFE;background:#1E3554}
.dc .c{color:#BBF7D0;background:#18372A}
.tpl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tpl button{
 display:flex;
 align-items:center;
 gap:5px;
 padding:7px 10px;
 color:#FDE68A;
 background:#2D281F;
 border:1px solid #70551F;
 border-radius:4px;
 font-size:12px;
 font-weight:600;
 transition:background .2s,border-color .2s,transform .2s;
}
.tpl button:hover{background:#40351F;border-color:var(--color-primary);transform:translateY(-1px)}
.tpl button .ms{font-size:16px}
.bal{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
 margin-top:7px;
 padding:13px;
 color:#D1FAE5;
 background:#173329;
 border:1px solid #286543;
 border-radius:4px;
}
.bal b{color:#86EFAC;font-size:13px}
.mtxt th,.mtxt td{text-align:center}
.mtxt th:first-child,.mtxt td:first-child{text-align:left;font-weight:600}
.cell{
 display:inline-block;
 min-width:58px;
 padding:3px 7px;
 border:1px solid currentColor;
 border-radius:3px;
 font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
 font-size:11.5px;
 font-weight:600;
}
.tl{position:relative;padding-left:28px}
.tl:before{
 content:"";
 position:absolute;
 top:6px;
 bottom:6px;
 left:8px;
 width:1px;
 background:#80601E;
}
.tli{position:relative;padding-bottom:18px}
.tli:last-child{padding-bottom:0}
.tli:before{
 content:"!";
 position:absolute;
 top:2px;
 left:-27px;
 display:grid;
 place-items:center;
 width:15px;
 height:15px;
 color:#172033;
 background:var(--color-primary);
 border-radius:50%;
 font-size:10px;
 font-weight:700;
}
.tli.done:before{content:"✓";background:var(--green)}
.tli .tt{font-size:13px;font-weight:600}
.tli .td{margin-top:4px;color:#DCE4EF;font-size:11.5px}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px}
.col{
 min-width:0;
 padding:11px;
 background:#182132;
 border:1px solid var(--line);
 border-radius:5px;
}
.colh{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12px;font-weight:700}
.colh .cnt{
 margin-left:auto;
 padding:1px 7px;
 color:#CBD5E1;
 background:#283246;
 border:1px solid #475569;
 border-radius:2px;
 font-size:10px;
}
.tk{
 margin-bottom:9px;
 padding:11px;
 background:#222C3D;
 border:1px solid #3C495E;
 border-left:3px solid var(--color-primary);
 border-radius:3px;
}
.tk:last-child{margin-bottom:0}
.tk .tkt{font-size:12px;font-weight:600}
.tk .tkm{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk .tka{margin-top:7px;font-size:13px;font-weight:700}
.av{
 display:inline-grid;
 place-items:center;
 width:22px;
 height:22px;
 flex:none;
 color:#0F172A;
 border:1px solid rgba(255,255,255,.35);
 border-radius:50%;
 font-size:10px;
 font-weight:700;
}
.pj{padding:16px}
.pj .pn{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;font-weight:700}
.prog{
 height:7px;
 margin:13px 0 6px;
 overflow:hidden;
 background:#111827;
 border:1px solid #3A4658;
 border-radius:2px;
}
.prog i{display:block;height:100%;background:var(--color-primary)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.pcell{min-width:0;padding:8px;background:#192233;border:1px solid #303C50;border-radius:3px}
.pcell .l{color:var(--muted);font-size:10px}
.pcell .v{margin-top:3px;font-size:12.5px;font-weight:700}
.stmt{font-size:12.5px}
.srow{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:10px 4px;
 border-bottom:1px solid var(--line);
}
.srow.sub{color:var(--muted);font-size:12px}
.srow.tot{
 margin-top:7px;
 padding:12px;
 background:#192334;
 border:1px solid #46536A;
 border-radius:3px;
 font-weight:700;
}
.srow .sv{font-weight:700;white-space:nowrap}
.foot{padding:28px 10px 0;color:var(--muted);font-size:11.5px;text-align:center}
@media(max-width:1024px){
 .g.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g.c64{grid-template-columns:1fr}
}
@media(max-width:768px){
 .bar{padding:12px 16px 9px}
 nav{padding:0 16px 11px}
 main{padding:23px 16px 50px}
 .shead{flex-wrap:wrap}
 .stag{width:100%;margin-left:63px}
 .g.k3,.g.k2,.g.c55{grid-template-columns:1fr}
 .board{grid-template-columns:repeat(4,240px)}
}
@media(max-width:480px){
 .fiscal{width:100%;order:3}
 .bar{flex-wrap:wrap}
 .hspace{display:none}
 .bt span{display:none}
 nav button .lbl{display:none}
 nav button{padding:9px 11px}
 .g.k4{grid-template-columns:1fr}
 .stag{margin-left:0}
 .shead p{font-size:12px}
 .card{padding:15px}
 .jline{grid-template-columns:auto minmax(0,1fr)}
 .jline .jv{grid-column:2;text-align:left}
 .pgrid{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  scroll-behavior:auto!important;
  transition-duration:.01ms!important;
 }
}
</style>
</head>
<body>
<header>
 <div class="bar">
  <div class="brand min0">
   <div class="logo"><span class="ms">account_balance</span></div>
   <div class="bt min0"><b>企業財務記帳</b><span>Jvision 財務會計系統 · 純 UI 展示</span></div>
  </div>
  <div class="hspace"></div>
  <div class="fiscal"><span class="dot"></span>會計年度 2026 · 8 月帳期開放中</div>
 </div>
 <nav id="nav" aria-label="系統功能"></nav>
</header>
<main id="view"></main>
<script>
"use strict";
var view=document.getElementById("view"),nav=document.getElementById("nav"),ins={};
var fmt=function(n){try{return(n||0).toLocaleString("en-US")}catch(e){return"0"}};
var MOD=[
 ["account_balance","銀行明細匯入","串接銀行對帳單，自動比對既有分錄與標記待處理交易"],
 ["edit_note","直覺記帳","拖拉分類、套用範本，完成借貸分錄與科目指定"],
 ["request_quote","應收付管理","客戶與供應商帳齡分析、逾期催收與付款排程"],
 ["receipt_long","代墊款核銷","員工代墊款申請、多層審核與撥款進度追蹤"],
 ["insights","專案損益","各專案收支歸集、成本結構與即時毛利"],
 ["summarize","三大財報","損益表、資產負債表與現金流量表互動檢視"]
];
echarts.registerTheme("ledger",{
 color:["#F59E0B","#8B5CF6","#4ADE80","#F87171","#93C5FD","#FBBF24"],
 backgroundColor:"transparent",
 textStyle:{fontFamily:"IBM Plex Sans",color:"#CBD5E1"},
 title:{textStyle:{color:"#F8FAFC"}},
 legend:{textStyle:{color:"#CBD5E1"}},
 categoryAxis:{axisLine:{lineStyle:{color:"#526178"}},axisLabel:{color:"#AEBACB"}},
 valueAxis:{axisLine:{lineStyle:{color:"#526178"}},axisLabel:{color:"#AEBACB"},splitLine:{lineStyle:{color:"#334155"}}}
});
(function(){
 var h="";
 for(var i=0;i<MOD.length;i++)h+='<button type="button" data-i="'+i+'"><span class="num">0'+(i+1)+'</span><span class="ms">'+MOD[i][0]+'</span><span class="lbl">'+MOD[i][1]+"</span></button>";
 nav.innerHTML=h;
 nav.querySelectorAll("button").forEach(function(b){
  b.addEventListener("click",function(){
   location.hash="v"+b.dataset.i;
   show(+b.dataset.i);
   try{window.scrollTo(0,0)}catch(e){}
  });
 });
})();
function head(i,tags){
 var m=MOD[i],t="";
 for(var k=0;k<tags.length;k++)t+='<span class="chip'+(tags[k].hot?" hot":"")+'">'+tags[k].t+"</span>";
 return'<div class="shead"><div class="ic"><span class="ms">'+m[0]+'</span></div><div class="min0"><h1>'+m[1]+"</h1><p>"+m[2]+'</p></div><div class="stag">'+t+"</div></div>";
}
function kpi(o){
 var cls=o.dir==="up"?"up":o.dir==="dn"?"dn":"nu";
 var ar=o.dir==="up"?"trending_up":o.dir==="dn"?"trending_down":"trending_flat";
 return'<div class="kpi min0"><div class="kl"><span class="ms">'+o.ic+"</span>"+o.l+'</div><div class="kv">'+o.v+(o.u?"<small>"+o.u+"</small>":"")+'</div><div class="kd '+cls+'"><span class="ms">'+ar+"</span>"+o.d+"</div></div>";
}
function init(id){return echarts.init(document.getElementById(id),"ledger")}

function s0(){
 var recon=[
  {nm:"O新銀行 #8821 匯款",mt:"2026/08/12 · TXN-2208841",amt:"+286,400",m:"比對成功：AR-INV-2261 應收沖銷",ok:1},
  {nm:"O宏世華 #4507 扣款",mt:"2026/08/12 · TXN-4450722",amt:"-58,900",m:"比對成功：AP-BILL-8842 供應商付款",ok:1},
