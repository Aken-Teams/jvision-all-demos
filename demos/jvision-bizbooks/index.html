<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業財務記帳｜Jvision 財務會計系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --acc:#b45309; --acc2:#f59e0b; --acc-soft:#fef3c7; --acc-line:#fde68a;
 --ink:#1c1917; --sub:#78716c; --line:#eae7e3; --bg:#f8f6f3; --card:#ffffff;
 --green:#15803d; --red:#dc2626; --blue:#1d4ed8; --gs:#f0fdf4; --rs:#fef2f2; --bs:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle}
.min0{min-width:0}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#ffffff,#fffdf9);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(180,83,9,.28)}
.logo .ms{font-size:23px}
.bt{display:flex;flex-direction:column;min-width:0}
.bt b{font-size:16px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.bt span{font-size:11.5px;color:var(--sub);white-space:nowrap}
.hspace{flex:1 1 40px;min-width:10px}
.fiscal{display:flex;align-items:center;gap:8px;padding:7px 13px;background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:999px;color:#92400e;font-size:12.5px;font-weight:600;white-space:nowrap}
.fiscal .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(21,128,61,.15);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
nav{display:flex;gap:6px;padding:0 20px 12px;flex-wrap:wrap}
nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);background:#fff;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:.16s}
nav button:hover{border-color:var(--acc-line);color:var(--acc);background:#fffdf7}
nav button.on{background:linear-gradient(135deg,var(--acc),#c2620a);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(180,83,9,.25)}
nav button .ms{font-size:19px}
nav button .num{font-size:11px;opacity:.6;font-weight:700}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.shead{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.shead .ic{width:46px;height:46px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.shead .ic .ms{font-size:26px}
.shead h1{font-size:21px;font-weight:800;letter-spacing:.2px}
.shead p{font-size:13px;color:var(--sub);margin-top:2px}
.stag{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.hot{background:var(--acc-soft);border-color:var(--acc-line);color:#92400e}
.g{display:grid;gap:16px;margin-bottom:16px}
.g.k4{grid-template-columns:repeat(4,1fr)}
.g.k3{grid-template-columns:repeat(3,1fr)}
.g.k2{grid-template-columns:repeat(2,1fr)}
.g.c64{grid-template-columns:1.4fr 1fr}
.g.c55{grid-template-columns:1fr 1fr}
@media(max-width:820px){
 .g.k4,.g.k3,.g.k2,.g.c64,.g.c55{grid-template-columns:1fr}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:14.5px;font-weight:800}
.ch .ms{color:var(--acc);font-size:20px}
.ch .r{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--acc),var(--acc2))}
.kpi .kl{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .ms{font-size:17px;color:var(--acc)}
.kpi .kv{font-size:26px;font-weight:800;margin-top:9px;letter-spacing:-.5px;font-family:'Inter'}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .kd{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kd.up{color:var(--green)}.kd.dn{color:var(--red)}.kd.nu{color:var(--sub)}
.kd .ms{font-size:15px}
.tw{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;padding:11px 13px;border-bottom:1.5px solid var(--line);background:#fbfaf8;white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fffdf7}
.mono{font-family:'Inter';font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-green{background:var(--gs);color:var(--green)}
.b-red{background:var(--rs);color:var(--red)}
.b-amber{background:var(--acc-soft);color:#92400e}
.b-blue{background:var(--bs);color:var(--blue)}
.b-gray{background:#f5f5f4;color:var(--sub)}
.chart{width:100%;height:280px}
.chart.sm{height:230px}
.chart.lg{height:320px}
.recon{display:flex;flex-direction:column;gap:0}
.rrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px dashed var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .lft{min-width:0}
.rrow .nm{font-size:13.5px;font-weight:700}
.rrow .mt{font-size:11.5px;color:var(--sub);margin-top:2px}
.rrow .amt{font-family:'Inter';font-weight:800;font-size:15px;text-align:right}
.match{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--green);font-weight:700;margin-top:3px}
.jline{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;transition:.16s}
.jline:hover{border-color:var(--acc-line);box-shadow:0 3px 10px rgba(180,83,9,.06)}
.jline .ji{width:38px;height:38px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.jline .jt{font-size:13.5px;font-weight:700}
.jline .js{font-size:11.5px;color:var(--sub);margin-top:2px}
.jline .jv{text-align:right}
.dc{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.dc span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.dc .d{background:var(--bs);color:var(--blue)}
.dc .c{background:var(--gs);color:var(--green)}
.tpl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tpl button{border:1px dashed var(--acc-line);background:#fffdf7;color:#92400e;padding:7px 12px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.tpl button:hover{background:var(--acc-soft)}
.tpl button .ms{font-size:16px}
.bal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-radius:12px;background:var(--gs);border:1px solid #bbf7d0;margin-top:6px;flex-wrap:wrap}
.bal b{font-size:14px;color:var(--green)}
.mtx{overflow-x:auto}
.mtxt{width:100%;border-collapse:collapse;min-width:520px;font-size:12.5px}
.mtxt th,.mtxt td{padding:10px 12px;text-align:center;border:1px solid var(--line)}
.mtxt th:first-child,.mtxt td:first-child{text-align:left;font-weight:700}
.mtxt th{background:#fbfaf8;font-size:11px;color:var(--sub);font-weight:700}
.cell{display:inline-block;padding:3px 9px;border-radius:7px;font-family:'Inter';font-weight:700;font-size:12px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--acc-line)}
.tli{position:relative;padding:0 0 18px 0}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tli.done::before{background:var(--acc)}
.tli .tt{font-size:13px;font-weight:700}
.tli .tm{font-size:11.5px;color:var(--sub);margin-top:2px}
.tli .td{font-size:12px;color:var(--ink);margin-top:4px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:#faf9f7;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.colh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;margin-bottom:11px}
.colh .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--sub)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;border-left:3px solid var(--acc2)}
.tk:last-child{margin-bottom:0}
.tk .tkt{font-size:12.5px;font-weight:700}
.tk .tkm{font-size:11px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk .tka{font-family:'Inter';font-weight:800;font-size:14px;margin-top:7px}
.av{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pj{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;min-width:0}
.pj .pn{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pj .pmeta{font-size:11.5px;color:var(--sub);margin-top:3px}
.prog{height:8px;border-radius:99px;background:#f0eeeb;margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}
@media(max-width:560px){.pgrid{grid-template-columns:1fr 1fr}}
.pcell{background:#faf9f7;border-radius:9px;padding:8px 9px;min-width:0}
.pcell .l{font-size:10.5px;color:var(--sub);font-weight:600}
.pcell .v{font-size:14px;font-weight:800;font-family:'Inter';margin-top:2px}
.stmt{font-size:13px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.srow.sub{color:var(--sub);font-size:12.5px}
.srow.tot{font-weight:800;background:#faf9f7;border-radius:8px;padding:12px;border:none;margin-top:6px}
.srow .sv{font-family:'Inter';font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{text-align:center;color:var(--sub);font-size:12px;padding:26px 10px 4px}
@media(max-width:560px){
 nav button .lbl{display:none}
 nav button{padding:9px 12px}
 .bt span{display:none}
}
</style>
</head>
<body>
<header>
 <div class="bar">
  <div class="brand min0">
   <div class="logo"><span class="ms">account_balance</span></div>
   <div class="bt min0"><b>企業財務記帳</b><span>Jvision 財務會計系統 · 純 UI 展示</span></div>
  </div>
  <div class="hspace"></div>
  <div class="fiscal"><span class="dot"></span>會計年度 2026 · 8 月帳期開放中</div>
 </div>
 <nav id="nav"></nav>
</header>
<main id="view"></main>
<script>
"use strict";
var view=document.getElementById('view'), nav=document.getElementById('nav');
var ins={};
var fmt=function(n){try{return (n||0).toLocaleString('en-US');}catch(e){return '0';}};

var MOD=[
 ['account_balance','銀行明細匯入','串接銀行對帳單，自動比對既有分錄與標記待處理交易'],
 ['edit_note','直覺記帳','拖拉分類、套用範本，完成借貸分錄與科目指定'],
 ['request_quote','應收付管理','客戶與供應商帳齡分析、逾期催收與付款排程'],
 ['receipt_long','代墊款核銷','員工代墊款申請、多層審核與撥款進度追蹤'],
 ['insights','專案損益','各專案收支歸集、成本結構與即時毛利'],
 ['summarize','三大財報','損益表、資產負債表與現金流量表互動檢視']
];

(function(){
 var h='';
 for(var i=0;i<MOD.length;i++){
  h+='<button data-i="'+i+'"><span class="num">0'+(i+1)+'</span><span class="ms">'+MOD[i][0]+'</span><span class="lbl">'+MOD[i][1]+'</span></button>';
 }
 nav.innerHTML=h;
 nav.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click',function(){show(+b.dataset.i);try{window.scrollTo(0,0);}catch(e){}});
 });
})();

function head(i,tags){
 var m=MOD[i];
 var t='';
 for(var k=0;k<tags.length;k++){t+='<span class="chip'+(tags[k].hot?' hot':'')+'">'+tags[k].t+'</span>';}
 return '<div class="shead"><div class="ic"><span class="ms">'+m[0]+'</span></div>'+
  '<div class="min0"><h1>'+m[1]+'</h1><p>'+m[2]+'</p></div>'+
  '<div class="stag">'+t+'</div></div>';
}
function kpi(o){
 var cls=o.dir==='up'?'up':(o.dir==='dn'?'dn':'nu');
 var ar=o.dir==='up'?'trending_up':(o.dir==='dn'?'trending_down':'trending_flat');
 return '<div class="kpi min0"><div class="kl"><span class="ms">'+o.ic+'</span>'+o.l+'</div>'+
  '<div class="kv">'+o.v+(o.u?'<small>'+o.u+'</small>':'')+'</div>'+
  '<div class="kd '+cls+'"><span class="ms">'+ar+'</span>'+o.d+'</div></div>';
}

/* ===== SCREEN 0 : 銀行明細匯入 ===== */
function s0(){
 var recon=[
  {nm:'台新銀行 #8821 匯款',mt:'2026/08/12 · TXN-2208841',amt:'+286,400',m:'比對成功：AR-INV-2261 應收沖銷',ok:1},
  {nm:'國泰世華 #4507 扣款',mt:'2026/08/12 · TXN-4450722',amt:'-58,900',m:'比對成功：AP-BILL-8842 供應商付款',ok:1},
  {nm:'玉山銀行 #3390 存入',mt:'2026/08/11 · TXN-3390155',amt:'+120,000',m:'待確認：疑似專案 P-014 進帳',ok:0},
  {nm:'第一銀行 #1102 手續費',mt:'2026/08/11 · TXN-1102009',amt:'-360',m:'比對成功：銀行手續費支出',ok:1},
  {nm:'兆豐銀行 #7745 匯入',mt:'2026/08/10 · TXN-7745231',amt:'+94,200',m:'待確認：無對應應收單據',ok:0}
 ];
 var rh='';
 for(var i=0;i<recon.length;i++){var r=recon[i];var pos=r.amt.charAt(0)==='+';
  rh+='<div class="rrow"><div class="lft min0"><div class="nm">'+r.nm+'</div><div class="mt">'+r.mt+'</div>'+
   (r.ok?'<div class="match"><span class="ms" style="font-size:15px">check_circle</span>'+r.m+'</div>':'<div class="match" style="color:#92400e"><span class="ms" style="font-size:15px">help</span>'+r.m+'</div>')+
   '</div><div class="amt '+(pos?'pos':'neg')+'">'+r.amt+'</div></div>';}
 return head(0,[{t:'台新 · 國泰 · 玉山 3 帳戶'},{t:'自動比對 88%',hot:1}])+
  '<div class="g k4">'+
   kpi({ic:'sync_alt',l:'本期匯入筆數',v:'1,284',u:'筆',dir:'up',d:'較上期 +142 筆'})+
   kpi({ic:'task_alt',l:'自動比對成功',v:'88.4',u:'%',dir:'up',d:'+5.2 個百分點'})+
   kpi({ic:'pending_actions',l:'待人工確認',v:'149',u:'筆',dir:'dn',d:'較上期 -37 筆'})+
   kpi({ic:'account_balance_wallet',l:'帳上餘額合計',v:'$4.82M',dir:'nu',d:'三帳戶即時彙總'})+
  '</div>'+
  '<div class="g c64">'+
   '<div class="card"><div class="ch"><span class="ms">rule</span><h3>對帳工作台</h3><span class="r">依匯入時間排序</span></div><div class="recon">'+rh+'</div></div>'+
   '<div class="card"><div class="ch"><span class="ms">donut_large</span><h3>比對結果分佈</h3></div><div id="c0" class="chart"></div></div>'+
  '</div>'+
  '<div class="card"><div class="ch"><span class="ms">stacked_line_chart</span><h3>近 6 日匯入與比對趨勢</h3><span class="r">單位：筆</span></div><div id="c0b" class="chart sm"></div></div>';
}
function d0(){
 ins.c0=echarts.init(document.getElementById('c0'));
 ins.c0.setOption({tooltip:{trigger:'item'},legend:{bottom:0,itemWidth:9,itemHeight:9,textStyle:{fontSize:11}},
  series:[{type:'pie',radius:['52%','74%'],center:['50%','44%'],avoidLabelOverlap:true,label:{show:false},
   data:[{value:1135,name:'自動比對成功',itemStyle:{color:'#15803d'}},{value:149,name:'待人工確認',itemStyle:{color:'#f59e0b'}},{value:38,name:'例外未入帳',itemStyle:{color:'#dc2626'}}]}]});
 ins.c0b=echarts.init(document.getElementById('c0b'));
 ins.c0b.setOption({tooltip:{trigger:'axis'},grid:{left:38,right:16,top:24,bottom:26},legend:{top:0,right:0,itemWidth:9,itemHeight:9,textStyle:{fontSize:11}},
  xAxis:{type:'category',data:['08/07','08/08','08/09','08/10','08/11','08/12'],axisLine:{lineStyle:{color:'#d6d3d1'}},axisLabel:{fontSize:11,color:'#78716c'}},
  yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0eeeb'}},axisLabel:{fontSize:11,color:'#78716c'}},
  series:[{name:'匯入筆數',type:'bar',data:[188,210,196,224,232,234],itemStyle:{color:'#fde68a',borderRadius:[4,4,0,0]},barWidth:15},
   {name:'比對成功',type:'line',smooth:true,data:[160,181,172,198,206,207],itemStyle:{color:'#b45309'},lineStyle:{width:3},symbolSize:6,areaStyle:{color:'rgba(180,83,9,.08)'}}]});
}

/* ===== SCREEN 1 : 直覺記帳 ===== */
function s1(){
 var js=[
  {ic:'shopping_cart',t:'採購辦公耗材',s:'2026/08/12 · 憑證 V-2208-041 · 已核准',d:'管理費用',c:'銀行存款',amt:'12,480'},
