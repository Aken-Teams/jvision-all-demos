<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>語音轉錄與智慧校對工作台 · asr-review｜Jvision 系統 Demo</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
    color-scheme:light;
    --color-primary:#7C3AED;
    --color-on-primary:#FFFFFF;
    --color-secondary:#A78BFA;
    --color-on-secondary:#0F172A;
    --color-accent:#0891B2;
    --color-on-accent:#000000;
    --color-background:#FAF5FF;
    --color-foreground:#1E1B4B;
    --color-card:#FFFFFF;
    --color-card-foreground:#1E1B4B;
    --color-muted:#ECEEF9;
    --color-muted-foreground:#475569;
    --color-border:#DDD6FE;
    --color-destructive:#DC2626;
    --color-on-destructive:#FFFFFF;
    --color-ring:#7C3AED;
    --blue:#7C3AED;
    --ink:#1E1B4B;
    --muted:#475569;
    --line:#DDD6FE;
    --bg:#FAF5FF;
    --panel:#FFFFFF;
    --panel2:#F8F7FC;
    --green:#15803D;
    --amber:#A16207;
    --red:#DC2626;
    --violet:#7C3AED;
    --cyan:#0891B2;
    --shadow-sm:0 1px 2px rgba(30,27,75,.05),0 3px 10px rgba(76,29,149,.04);
    --shadow-md:0 12px 28px rgba(76,29,149,.08),0 2px 6px rgba(30,27,75,.05);
  }
  *{box-sizing:border-box}
  html{background:var(--bg);scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(circle at 88% 2%,rgba(167,139,250,.18),transparent 27rem),
      linear-gradient(180deg,#FCFAFF 0,var(--color-background) 42rem);
    color:var(--ink);
    font-family:"DM Sans","Noto Sans TC",system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit}
  button,.btn,.sw,.rail button{cursor:pointer}
  .material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
  .mono{
    font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }
  .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .rail{
    position:sticky;
    top:0;
    z-index:20;
    height:100vh;
    overflow:auto;
    padding:18px 14px;
    background:rgba(255,255,255,.88);
    border-right:1px solid var(--line);
    box-shadow:4px 0 24px rgba(76,29,149,.04);
    backdrop-filter:blur(16px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-height:52px;
    margin:0 4px 18px;
    padding:0 4px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand i{
    display:grid;
    flex:0 0 38px;
    width:38px;
    height:38px;
    place-content:center;
    border-radius:11px;
    background:linear-gradient(135deg,var(--color-primary),#5B21B6);
    color:var(--color-on-primary);
    box-shadow:0 8px 18px rgba(124,58,237,.24);
    font-style:normal;
  }
  .brand b{
    display:block;
    color:var(--ink);
    font-family:"Space Grotesk","DM Sans",sans-serif;
    font-size:13.5px;
    font-weight:700;
    line-height:1.3;
  }
  .brand small{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:9.5px;
    letter-spacing:.08em;
  }
  #nav{display:grid;gap:4px}
  .rail button{
    display:flex;
    width:100%;
    min-height:42px;
    align-items:center;
    gap:10px;
    margin:0;
    padding:9px 10px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    text-align:left;
    transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
  }
  .rail button:hover{
    border-color:#E9E2FD;
    background:#F4F0FF;
    color:#4C1D95;
  }
  .rail button.on{
    border-color:#C4B5FD;
    background:linear-gradient(90deg,#EDE9FE,#F5F3FF);
    color:#5B21B6;
    font-weight:700;
    box-shadow:inset 3px 0 0 var(--color-primary);
  }
  .rail button .material-symbols-outlined{font-size:19px!important}
  .rail .tx{min-width:0;white-space:nowrap}
  .rail .idx{
    margin-left:auto;
    color:#6D5B91;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:9.5px;
    font-weight:500;
  }
  main{width:100%;max-width:1320px;min-width:0;padding:24px 30px 64px}
  .top{
    display:flex;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:17px;
  }
  .eyebrow{
    margin:0 0 4px;
    color:#6D28D9;
    font-family:"Space Grotesk","DM Sans",sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  h1{
    margin:0 0 4px;
    color:var(--ink);
    font-family:"Space Grotesk","DM Sans",sans-serif;
    font-size:clamp(23px,2.2vw,30px);
    font-weight:700;
    letter-spacing:-.035em;
    line-height:1.2;
  }
  .sub{max-width:760px;margin:0;color:var(--muted);font-size:13px}
  .ready{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:34px;
    margin-left:auto;
    padding:6px 12px;
    border:1px solid #A7F3D0;
    border-radius:999px;
    background:#ECFDF5;
    color:#166534;
    font-size:11.5px;
    font-weight:700;
    box-shadow:var(--shadow-sm);
  }
  .dot{
    width:8px;
    height:8px;
    border:2px solid #DCFCE7;
    border-radius:50%;
    background:#16A34A;
    box-shadow:0 0 0 0 rgba(22,163,74,.28);
    animation:servicePulse 2.4s ease-out infinite;
  }
  .steps{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 17px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.74);
    box-shadow:var(--shadow-sm);
  }
  .steps .s{display:flex;min-width:150px;align-items:center;gap:9px}
  .steps b{
    display:grid;
    flex:0 0 27px;
    width:27px;
    height:27px;
    place-content:center;
    border:1px solid #C4B5FD;
    border-radius:8px;
    background:#EDE9FE;
    color:#5B21B6;
    font-family:"Space Grotesk",sans-serif;
    font-size:11px;
  }
  .steps .t{color:var(--ink);font-size:12px;font-weight:700}
  .steps .d{color:var(--muted);font-size:10.5px}
  .steps .bar{height:1px;min-width:22px;flex:1;background:linear-gradient(90deg,#C4B5FD,var(--line))}
  .card{
    position:relative;
    margin-bottom:14px;
    padding:17px 19px;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    box-shadow:var(--shadow-sm);
    animation:revealCard .36s ease-out both;
    transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
  }
  .card:hover{border-color:#C4B5FD;box-shadow:var(--shadow-md)}
  .card h3{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 3px;
    color:var(--ink);
    font-family:"Space Grotesk","DM Sans",sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.015em;
  }
  .card .cs{margin:0 0 13px;color:var(--muted);font-size:11.5px}
  .grow{min-width:0;flex:1}
  .pill{
    display:inline-flex;
    align-items:center;
    padding:3px 9px;
    border:1px solid #DDD6FE;
    border-radius:999px;
    background:#F5F3FF;
    color:#5B21B6;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:10px;
    font-weight:700;
  }
  .drop{
    position:relative;
    margin-bottom:14px;
    padding:24px;
    overflow:hidden;
    border:1.5px dashed #A78BFA;
    border-radius:12px;
    background:
      linear-gradient(rgba(124,58,237,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(124,58,237,.035) 1px,transparent 1px),
      #FCFAFF;
    background-size:22px 22px;
    text-align:center;
  }
  .drop:after{
    position:absolute;
    right:-50px;
    bottom:-70px;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(8,145,178,.06);
    content:"";
    pointer-events:none;
  }
  .drop .up{
    display:grid;
    width:44px;
    height:44px;
    margin:0 auto 9px;
    place-content:center;
    border:1px solid #DDD6FE;
    border-radius:12px;
    background:#EDE9FE;
    color:#6D28D9;
  }
  .drop b{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:14px}
  .drop p{margin:4px 0 8px;color:var(--muted);font-size:11.5px}
  .chip{
    display:inline-block;
    padding:3px 9px;
    border:1px solid #A5F3FC;
    border-radius:7px;
    background:#ECFEFF;
    color:#155E75;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:10.5px;
    font-weight:700;
  }
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
  .tog{
    display:flex;
    min-height:66px;
    align-items:center;
    gap:12px;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--panel2);
    transition:border-color .18s ease,background-color .18s ease;
  }
  .tog:hover{border-color:#C4B5FD;background:#FCFAFF}
  .tog b{display:block;color:var(--ink);font-size:12.5px}
  .tog small{display:block;margin-top:1px;color:var(--muted);font-size:10.5px;line-height:1.45}
  .sw{
    position:relative;
    flex:none;
    width:40px;
    height:23px;
    padding:0;
    border:1px solid #94A3B8;
    border-radius:999px;
    background:#CBD5E1;
    transition:background-color .18s ease,border-color .18s ease;
  }
  .sw:after{
    position:absolute;
    top:3px;
    left:3px;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#FFFFFF;
    box-shadow:0 1px 3px rgba(15,23,42,.25);
    content:"";
    transition:transform .18s ease;
  }
  .sw.on{border-color:var(--color-primary);background:var(--color-primary)}
  .sw.on:after{transform:translateX(17px)}
  label.f{display:block;margin-bottom:11px}
  label.f span{display:block;margin-bottom:5px;color:var(--ink);font-size:11.5px;font-weight:700}
  input,select,textarea{
    width:100%;
    min-height:39px;
    padding:8px 11px;
    border:1px solid #CFC8E8;
    border-radius:9px;
    outline:0;
    background:#FFFFFF;
    color:var(--ink);
    font-size:12.5px;
    transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
  }
  input:hover,select:hover,textarea:hover{border-color:#A78BFA}
  input::placeholder{color:#64748B}
  input[type="password"],input[value*="http"],input[value*="deepseek"]{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
  }
  .hint{margin:4px 0 0;color:var(--muted);font-size:10.5px}
  .btn{
    display:inline-flex;
    min-height:38px;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:7px 14px;
    border:1px solid #CFC8E8;
    border-radius:9px;
    background:#FFFFFF;
    color:#4C1D95;
    font-size:12px;
    font-weight:700;
    box-shadow:0 1px 2px rgba(30,27,75,.04);
    transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease;
  }
  .btn:hover{border-color:var(--color-primary);background:#F5F3FF;box-shadow:0 4px 12px rgba(124,58,237,.1)}
  .btn.p{
    border-color:var(--color-accent);
    background:var(--color-accent);
    color:#FFFFFF;
    box-shadow:0 6px 16px rgba(8,145,178,.2);
  }
  .btn.p:hover{border-color:#0E7490;background:#0E7490}
  .ok{display:inline-flex;align-items:center;gap:5px;color:#166534;font-size:11.5px;font-weight:700}
  .ok:before{display:grid;width:16px;height:16px;place-content:center;border-radius:50%;background:#DCFCE7;content:"✓";font-size:10px}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  table.tbl th{
    padding:8px 10px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#F8F7FC;
    color:#4B5563;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    text-align:left;
    white-space:nowrap;
  }
  table.tbl th:first-child{border-left:1px solid var(--line);border-radius:8px 0 0 8px}
  table.tbl th:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
  table.tbl td{
    padding:9px 10px;
    border-bottom:1px solid #ECE8F7;
    color:#292451;
    vertical-align:middle;
  }
  table.tbl td.mono{text-align:right}
  table.tbl tr:last-child td{border-bottom:0}
  table.tbl tbody tr{transition:background-color .16s ease}
  table.tbl tbody tr:hover{background:#FAF8FF}
  .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 8px;
    border:1px solid transparent;
    border-radius:999px;
    font-size:10.5px;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
  }
  .tag:before{width:6px;height:6px;flex:none;border-radius:50%;background:currentColor;content:""}
  .g-ok{border-color:#BBF7D0;background:#F0FDF4;color:#166534}
  .g-run{border-color:#A5F3FC;background:#ECFEFF;color:#155E75}
  .g-run:before{animation:statusPulse 1.8s ease-in-out infinite}
  .g-warn{border-color:#FDE68A;background:#FFFBEB;color:#854D0E}
  .g-bad{border-color:#FECACA;background:#FEF2F2;color:#B91C1C}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px;margin-bottom:14px}
  .kpi{
    position:relative;
    min-height:105px;
    padding:13px 15px;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
    box-shadow:var(--shadow-sm);
  }
  .kpi:before{position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--color-primary),var(--color-accent));content:""}
  .kpi span{display:block;color:var(--muted);font-size:10.5px;font-weight:700}
  .kpi b{
    display:block;
    margin-top:2px;
    color:var(--ink);
    font-family:"Space Grotesk","DM Sans",sans-serif;
    font-size:25px;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.04em;
    line-height:1.25;
  }
  .kpi i{color:var(--muted);font-size:10.5px;font-style:normal}
  .seg{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid #ECE8F7}
  .seg:last-child{border-bottom:0}
  .seg .ts{min-width:104px;flex:none;color:#5B4B7C;font-size:10.5px;text-align:right}
  .seg .spk{
    flex:none;
    padding:2px 7px;
    border:1px solid #C4B5FD;
    border-radius:6px;
    background:#F5F3FF;
    color:#5B21B6;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:10px;
    font-weight:700;
  }
  .seg p{margin:0;color:#292451;font-size:12.5px}
  .diff{
    position:relative;
    margin-bottom:9px;
    padding:11px 13px 11px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#FCFAFF;
  }
  .diff:before{position:absolute;top:10px;bottom:10px;left:0;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--color-primary),var(--color-accent));content:""}
  .diff .before{color:#B91C1C;text-decoration:line-through;text-decoration-thickness:1.5px}
  .diff .after{color:#166534;font-weight:700}
  .diff .why{margin-top:4px;color:var(--muted);font-size:10.5px}
  .chart{height:230px;border-radius:10px;background:linear-gradient(180deg,#FFFFFF,#FCFAFF)}
  .split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:14px}
  :where(button,input,select,textarea,[tabindex]):focus-visible{
    outline:3px solid rgba(124,58,237,.28);
    outline-offset:2px;
    border-color:var(--color-ring);
  }
  @keyframes servicePulse{0%,45%{box-shadow:0 0 0 0 rgba(22,163,74,.3)}75%,100%{box-shadow:0 0 0 7px rgba(22,163,74,0)}}
  @keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes revealCard{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:1080px){
    .split{grid-template-columns:1fr}
    main{padding-right:22px;padding-left:22px}
  }
  @media(max-width:820px){
    .app{display:block}
    .rail{
      position:sticky;
      top:0;
      height:auto;
      padding:8px 10px;
      overflow-x:auto;
      border-right:0;
      border-bottom:1px solid var(--line);
      box-shadow:0 4px 18px rgba(76,29,149,.06);
    }
    .rail .brand{display:none}
    #nav{display:flex;width:max-content;gap:5px}
    .rail button{width:auto;min-height:40px;padding:8px 11px;white-space:nowrap}
    .rail button.on{box-shadow:inset 0 -3px 0 var(--color-primary)}
    .rail .idx{display:none}
    main{padding:20px 16px 48px}
    .steps{align-items:stretch;overflow-x:auto}
    .steps .s{min-width:145px}
    .steps .bar{min-width:18px;align-self:center}
    .ready{margin-left:0}
  }
  @media(max-width:560px){
    body{font-size:13px}
    main{padding:17px 12px 40px}
    .top{margin-bottom:14px}
    .top>div{width:100%}
    h1{font-size:23px}
    .ready{min-height:32px}
    .steps{margin-right:-12px;margin-left:-12px;padding:10px 12px;border-right:0;border-left:0;border-radius:0}
    .card{padding:15px 13px;border-radius:12px}
    .card h3{align-items:flex-start;flex-wrap:wrap}
    .card h3 .cs{width:100%;margin-left:0!important}
    .drop{padding:20px 12px}
    .row,.kpis{grid-template-columns:1fr}
    .kpi{min-height:96px}
    .seg{display:grid;grid-template-columns:96px 1fr}
    .seg p{grid-column:1/-1;padding-left:4px}
    .seg .ts{text-align:left}
    .split{display:block}
    .tbl{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table.tbl th,table.tbl td{min-width:92px}
    table.tbl th:first-child,table.tbl td:first-child{position:sticky;left:0;z-index:1;background:#F8F7FC}
    .chart{height:210px}
    .card .btn{width:100%}
    .card>div[style*="display:flex"]{align-items:stretch!important;flex-direction:column}
    .card>div[style*="display:flex"] .btn.p{margin-left:0!important}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition-duration:.01ms!important;transition-delay:0ms!important}
    .card{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><i class="material-symbols-outlined">mic</i>
      <span><b>語音轉錄與智慧校對</b><small>MOSS-TRANSCRIBE-DIARIZE</small></span></div>
    <div id="nav">
      <button data-i="0"><span class="material-symbols-outlined" style="font-size:18px">upload_file</span><span class="tx">建立轉錄工作</span><span class="idx">v0</span></button>
      <button data-i="1"><span class="material-symbols-outlined" style="font-size:18px">queue</span><span class="tx">轉錄佇列</span><span class="idx">v1</span></button>
      <button data-i="2"><span class="material-symbols-outlined" style="font-size:18px">subtitles</span><span class="tx">逐字稿與時間軸</span><span class="idx">v2</span></button>
      <button data-i="3"><span class="material-symbols-outlined" style="font-size:18px">record_voice_over</span><span class="tx">說話人分離</span><span class="idx">v3</span></button>
      <button data-i="4"><span class="material-symbols-outlined" style="font-size:18px">difference</span><span class="tx">智慧校對差異</span><span class="idx">v4</span></button>
      <button data-i="5"><span class="material-symbols-outlined" style="font-size:18px">inventory</span><span class="tx">交付與稽核</span><span class="idx">v5</span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
(function(){
  "use strict";
  var charts=[];
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function head(step,title,desc){
    return '<div class="top"><div><p class="eyebrow">STAGE 0'+step+'</p><h1>'+title+'</h1>'+
      '<p class="sub">'+desc+'</p></div>'+
      '<span class="ready"><span class="dot"></span>模型服務就緒</span></div>';
  }
  function steps(active){
    var S=[["選擇檔案","音訊或影片"],["語音轉錄","時間軸與說話人"],["智慧校對","串流比較差異"]];
    return '<div class="steps">'+S.map(function(s,i){
      return '<div class="s"><b>'+(i+1)+'</b><span><span class="t">'+s[0]+'</span><br><span class="d">'+s[1]+'</span></span></div>'+
        (i<2?'<span class="bar"></span>':"");
    }).join("")+'</div>';
  }
  function tog(name,desc,on){
    return '<div class="tog"><div class="grow"><b>'+name+'</b><small>'+desc+'</small></div>'+
      '<button type="button" class="sw'+(on?" on":"")+'" aria-pressed="'+(!!on)+'"></button></div>';
  }

  /* ── 畫面 0：建立轉錄工作 ───────────────────────── */
  function s0(){
    return head(1,"建立轉錄工作","將長音訊轉為可用逐字稿，保留時間軸與說話人，並即時比較智慧校對差異。")+steps(0)+
    '<div class="card"><h3>新的轉錄工作<span class="pill" style="margin-left:auto">API v1.2.4</span></h3>'+
    '<p class="cs">支援 mp3 / wav / m4a 與含音軌的影片，長度以實際音訊為準。</p>'+
    '<div class="drop"><div class="up"><span class="material-symbols-outlined">upload</span></div>'+
    '<b>Lee01.mp3</b><p>或點擊選擇檔案 · 上限 100 MB · 最長 90 分鐘</p>'+
    '<span class="chip">22.2 MB · audio/mpeg</span></div>'+
    '<div class="row" style="margin-bottom:16px">'+
      tog("時間序","產生時間戳與標準 SRT",true)+
      tog("區分說話人","標示 [S01]、[S02] 等角色",false)+
      tog("智慧校對","上下文修正同音與誤辨字詞",true)+
    '</div>'+
    '<div class="row">'+
      '<label class="f"><span>熱詞與專有名詞</span><input value="" placeholder="OpenMOSS, vLLM, 人名, 產品名稱" />'+
      '<p class="hint">以逗號分隔，會加入 ASR 提示。</p></label>'+
      '<label class="f"><span>vLLM 服務位址</span><input value="http://vllm:8000" />'+
      '<p class="hint">容器內預設為 http://vllm:8000。</p></label>'+
    '</div></div>'+
    '<div class="card"><p class="eyebrow">CONTEXT-AWARE REVIEW</p>'+
    '<h3>智慧校對設定<span class="cs" style="margin-left:auto;font-size:11.5px">完整轉錄後才會送出；金鑰僅用於本次請求，不儲存在瀏覽器。</span></h3>'+
    '<div class="row">'+
      '<label class="f"><span>LiteLLM API 位址</span><input value="https://litellm.my-yang.online/v1" /></label>'+
      '<label class="f"><span>API Key</span><input type="password" value="sk-demo-0000000000000000" /></label>'+
      '<label class="f"><span>校對模型</span><input value="deepseek-v4-flash" /></label>'+
      '<label class="f"><span>推理強度</span><select><option>medium — 建議</option><option>low — 最快</option><option>high — 最準</option></select></label>'+
    '</div>'+
    tog("長文智慧加速","100 段以上自動使用 low，避免先耗時推理後重試；關閉後會完整遵照上方推理強度。",true)+
    '<div style="display:flex;gap:12px;align-items:center;margin-top:14px">'+
      '<button class="btn">測試 LiteLLM 連線</button>'+
      '<span class="ok">連線成功，deepseek-v4-flash 可使用。</span>'+
      '<button class="btn p" style="margin-left:auto">開始轉錄</button></div></div>';
  }

  /* ── 畫面 1：轉錄佇列 ───────────────────────────── */
  var JOBS=[
    ["JOB-2418","Lee01.mp3","48:12","轉錄中","g-run","72%","deepseek-v4-flash"],
    ["JOB-2417","法說會_Q3.wav","1:12:40","校對中","g-run","94%","deepseek-v4-flash"],
    ["JOB-2416","客訴電話_0829.m4a","09:35","已完成","g-ok","100%","deepseek-v4-flash"],
    ["JOB-2415","產線教育訓練.mp4","32:08","已完成","g-ok","100%","deepseek-v4-flash"],
    ["JOB-2414","董事會紀錄.wav","1:41:22","需人工確認","g-warn","100%","deepseek-v4-flash"],
    ["JOB-2413","門市晨會.mp3","06:44","失敗｜音軌損毀","g-bad","12%","—"]
  ];
  function s1(){
    return head(2,"轉錄佇列","一次可排入多個檔案，長音訊自動切段並行處理，失敗的段落單獨重試。")+
    '<div class="kpis">'+
      '<div class="kpi"><span>今日轉錄時數</span><b>18.4</b><i>小時音訊</i></div>'+
      '<div class="kpi"><span>平均即時率</span><b>0.18×</b><i>1 小時音訊約 11 分鐘</i></div>'+
      '<div class="kpi"><span>字錯率（抽驗）</span><b>3.2%</b><i>校對前 7.9%</i></div>'+
      '<div class="kpi"><span>待人工確認</span><b>1</b><i>低信心段落過多</i></div>'+
    '</div>'+
    '<div class="card"><h3>工作佇列</h3><p class="cs">狀態每完成一段就更新，不必等整份跑完。</p>'+
    '<table class="tbl"><thead><tr><th>工作編號</th><th>檔案</th><th>長度</th><th>狀態</th><th>進度</th><th>校對模型</th></tr></thead><tbody>'+
    JOBS.map(function(j){return '<tr><td class="mono">'+j[0]+'</td><td>'+esc(j[1])+'</td><td class="mono">'+j[2]+
      '</td><td><span class="tag '+j[4]+'">'+j[3]+'</span></td><td class="mono">'+j[5]+'</td><td class="mono">'+j[6]+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<div class="card"><h3>各階段耗時</h3><p class="cs">切段、轉錄、校對三段分開計時，才看得出瓶頸在哪一段。</p>'+
    '<div id="c1" class="chart"></div></div>';
  }

  /* ── 畫面 2：逐字稿與時間軸 ─────────────────────── */
  var SEGS=[
    ["00:00:04.120","S01","今天想先確認上一版的轉錄品質，特別是專有名詞那部分。"],
    ["00:00:11.480","S02","我們把熱詞清單加進去之後，OpenMOSS 跟 vLLM 這兩個詞就沒有再被拆錯了。"],
    ["00:00:21.905","S01","那時間戳呢？剪輯那邊反映有幾段對不上。"],
    ["00:00:28.310","S02","切段的重疊區調成一點五秒之後，接縫的字就不會重複出現。"],
    ["00:00:37.660","S01","好，那我們就用這個設定跑完整份。"],
    ["00:00:42.015","S02","我把智慧校對也開著，跑完會給你差異對照。"]
  ];
  function s2(){
    return head(3,"逐字稿與時間軸","每一段都保留起訖時間，可直接輸出標準 SRT 給剪輯或字幕系統。")+
    '<div class="split"><div class="card"><h3>逐字稿</h3>'+
    '<p class="cs">JOB-2418 · Lee01.mp3 · 48:12 · 共 312 段</p>'+
    SEGS.map(function(s){return '<div class="seg"><span class="ts mono">'+s[0]+'</span>'+
      '<span class="spk">'+s[1]+'</span><p>'+esc(s[2])+'</p></div>';}).join("")+
    '</div><div><div class="card"><h3>輸出格式</h3><p class="cs">同一份轉錄可以輸出多種格式，時間軸一致。</p>'+
    '<table class="tbl"><thead><tr><th>格式</th><th>用途</th><th>狀態</th></tr></thead><tbody>'+
    [["SRT","影片字幕","已產生","g-ok"],["VTT","網頁播放器","已產生","g-ok"],
     ["TXT","純文字稿","已產生","g-ok"],["JSON","含信心值與詞級時間","已產生","g-ok"]]
      .map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td><span class="tag '+r[3]+'">'+r[2]+'</span></td></tr>';}).join("")+
    '</tbody></table></div>'+
    '<div class="card"><h3>信心值分布</h3><p class="cs">低信心的段落會被標出來優先人工確認。</p>'+
    '<div id="c2" class="chart" style="height:190px"></div></div></div></div>';
  }

  /* ── 畫面 3：說話人分離 ─────────────────────────── */
  function s3(){
    return head(4,"說話人分離","把逐字稿切成不同角色，會議紀錄與客訴分析才用得上。")+
    '<div class="split"><div class="card"><h3>說話人統計</h3><p class="cs">依實際發話時間計算，不是依段數。</p>'+
    '<div id="c3" class="chart"></div></div>'+
    '<div class="card"><h3>角色對應</h3><p class="cs">系統先分出 S01/S02，再由人指定真實姓名，之後同一個聲紋會自動沿用。</p>'+
    '<table class="tbl"><thead><tr><th>系統標記</th><th>指定姓名</th><th>發話時間</th><th>段數</th></tr></thead><tbody>'+
    [["S01","李品瑜（產品）","21:38","142"],["S02","陳孟修（技術）","24:52","158"],
     ["S03","（未指定）","01:42","12"]].map(function(r){
      return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="mono">'+r[3]+'</td></tr>';
    }).join("")+'</tbody></table></div></div>';
  }

  /* ── 畫面 4：智慧校對差異 ───────────────────────── */
  var DIFFS=[
    ["歐盤 MOSS","OpenMOSS","產品名稱，已在熱詞清單中"],
    ["V L L M","vLLM","技術名詞，還原原始拼寫"],
    ["切斷的重疊區","切段的重疊區","同音誤辨，依上下文修正"],
    ["一點五秒","1.5 秒","數值統一為半形數字"],
    ["這個設定跑完整分","這個設定跑完整份","量詞誤辨"]
  ];
  function s4(){
    return head(5,"智慧校對差異","校對只改「明顯錯的」，每一處都留原文與理由，人可以逐條否決。")+
    '<div class="kpis">'+
      '<div class="kpi"><span>建議修正</span><b>47</b><i>全份 312 段</i></div>'+
      '<div class="kpi"><span>已採納</span><b>44</b><i>3 處人工否決</i></div>'+
      '<div class="kpi"><span>字錯率改善</span><b>-4.7</b><i>7.9% → 3.2%</i></div>'+
      '<div class="kpi"><span>校對耗時</span><b>2:18</b><i>與轉錄並行</i></div>'+
    '</div>'+
    '<div class="card"><h3>逐條差異</h3><p class="cs">左邊是轉錄原文，右邊是校對後；理由寫清楚才有辦法判斷該不該採納。</p>'+
    DIFFS.map(function(d){return '<div class="diff"><span class="before">'+esc(d[0])+'</span>'+
      ' <span class="material-symbols-outlined" style="font-size:15px;vertical-align:-3px;color:#5b7398">arrow_forward</span> '+
      '<span class="after">'+esc(d[1])+'</span><div class="why">'+esc(d[2])+'</div></div>';}).join("")+
    '</div>';
  }

  /* ── 畫面 5：交付與稽核 ─────────────────────────── */
  function s5(){
    return head(6,"交付與稽核","誰在什麼時候改了哪一段，都留得下來——逐字稿要當證據時這件事最重要。")+
    '<div class="card"><h3>交付紀錄</h3><p class="cs">每次匯出都記一筆，含當時使用的模型與設定。</p>'+
    '<table class="tbl"><thead><tr><th>時間</th><th>工作編號</th><th>格式</th><th>操作者</th><th>狀態</th></tr></thead><tbody>'+
    [["08-31 14:22","JOB-2416","SRT + TXT","李品瑜","已下載","g-ok"],
     ["08-31 11:05","JOB-2415","JSON","系統排程","已推送 API","g-ok"],
     ["08-30 17:41","JOB-2414","TXT","陳孟修","待覆核","g-warn"],
     ["08-30 09:18","JOB-2412","SRT","李品瑜","已下載","g-ok"]]
      .map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td class="mono">'+r[1]+'</td><td>'+r[2]+
        '</td><td>'+r[3]+'</td><td><span class="tag '+r[5]+'">'+r[4]+'</span></td></tr>';}).join("")+
    '</tbody></table></div>'+
    '<div class="card"><h3>近七日轉錄量</h3><p class="cs">用來估算模型服務要開多少資源。</p>'+
    '<div id="c5" class="chart"></div></div>';
  }

  function paint(i){
    charts.forEach(function(c){try{c.dispose();}catch(e){}});
    charts=[];
    var axis={axisLine:{lineStyle:{color:"#25406b"}},axisLabel:{color:"#8aa2c4",fontSize:11},
              splitLine:{lineStyle:{color:"#17294a"}}};
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;
      var c=window.echarts.init(el);c.setOption(opt);charts.push(c);}
    if(i===1) mk("c1",{grid:{left:52,right:16,top:24,bottom:30},
      tooltip:{trigger:"axis"},legend:{textStyle:{color:"#8aa2c4"},top:0},
      xAxis:Object.assign({type:"category",data:["切段","轉錄","校對"]},axis),
      yAxis:Object.assign({type:"value",name:"分鐘"},axis),
      series:[{name:"Lee01.mp3",type:"bar",data:[0.6,8.4,2.3],itemStyle:{color:"#3b82f6"}},
              {name:"法說會_Q3",type:"bar",data:[1.4,19.2,5.1],itemStyle:{color:"#8b5cf6"}}]});
    if(i===2) mk("c2",{grid:{left:44,right:14,top:18,bottom:28},tooltip:{trigger:"axis"},
      xAxis:Object.assign({type:"category",data:["<0.6","0.6-0.7","0.7-0.8","0.8-0.9",">0.9"]},axis),
      yAxis:Object.assign({type:"value",name:"段"},axis),
      series:[{type:"bar",data:[9,17,38,96,152],itemStyle:{color:"#22c55e"}}]});
    if(i===3) mk("c3",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#8aa2c4"}},
      series:[{type:"pie",radius:["46%","70%"],label:{color:"#c7d8f0"},
        data:[{value:1298,name:"S01 李品瑜",itemStyle:{color:"#3b82f6"}},
              {value:1492,name:"S02 陳孟修",itemStyle:{color:"#8b5cf6"}},
              {value:102,name:"S03 未指定",itemStyle:{color:"#334f7d"}}]}]});
    if(i===5) mk("c5",{grid:{left:50,right:16,top:22,bottom:30},tooltip:{trigger:"axis"},
      xAxis:Object.assign({type:"category",data:["8/25","8/26","8/27","8/28","8/29","8/30","8/31"]},axis),
      yAxis:Object.assign({type:"value",name:"小時"},axis),
      series:[{type:"line",smooth:true,data:[9.2,12.6,11.4,15.8,14.2,16.9,18.4],
        itemStyle:{color:"#22c55e"},areaStyle:{color:"rgba(34,197,94,.16)"}}]});
  }

  var SCREENS=[
    {name:"建立轉錄工作",fn:s0},
    {name:"轉錄佇列",fn:s1},
    {name:"逐字稿與時間軸",fn:s2},
    {name:"說話人分離",fn:s3},
    {name:"智慧校對差異",fn:s4},
    {name:"交付與稽核",fn:s5}
  ];
  var nav=document.getElementById("nav");

  function show(i){
    document.getElementById("main").innerHTML=SCREENS[i].fn();
    var bs=nav.querySelectorAll("button");
    for(var k=0;k<bs.length;k++) bs[k].className=(k===i?"on":"");
    paint(i);
  }
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b) return;
    var n="#go="+b.dataset.i;
    if(location.hash===n) show(+b.dataset.i); else location.hash=n;
  });
  /* 開關只是展示互動，狀態留在畫面上就好 */
  document.addEventListener("click",function(e){
    var sw=e.target.closest(".sw"); if(!sw) return;
    sw.classList.toggle("on");
    sw.setAttribute("aria-pressed",sw.classList.contains("on"));
  });
  window.addEventListener("resize",function(){
    charts.forEach(function(c){try{c.resize();}catch(e){}});});
  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return;}
    show(Math.min(+m[1],SCREENS.length-1));
    try{window.scrollTo(0,0);}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
})();
</script>
</body>
</html>
