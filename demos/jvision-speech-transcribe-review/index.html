<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>語音轉錄與智慧校對工作台 · asr-review｜Jvision 系統 Demo</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0a1424; --panel:#101f36; --panel2:#0d1a2e; --line:#1e3151;
    --ink:#e8f0fb; --muted:#8aa2c4; --blue:#3b82f6; --green:#22c55e;
    --amber:#f59e0b; --red:#f87171; --violet:#8b5cf6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
  .mono{font-family:"JetBrains Mono","Noto Sans TC",monospace}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .rail{background:var(--panel2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);
           display:grid;place-content:center;color:#fff;font-style:normal}
  .brand b{font-size:14px;display:block;line-height:1.25}
  .brand small{color:var(--muted);font-size:10.5px;letter-spacing:.12em}
  .rail button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;margin-bottom:3px;
       border:0;border-radius:9px;background:transparent;color:var(--muted);
       font:inherit;font-size:13px;cursor:pointer;text-align:left}
  .rail button:hover{background:#16294a;color:var(--ink)}
  .rail button.on{background:#1b3congress;}
  .rail button.on{background:#1b355e;color:#fff;font-weight:700}
  .rail .idx{margin-left:auto;font-size:10px;color:#4d6892}
  main{padding:22px 26px 60px;max-width:1280px}
  .top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .eyebrow{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.16em;margin:0 0 4px}
  h1{font-size:24px;margin:0 0 4px;font-weight:900}
  .sub{color:var(--muted);margin:0;font-size:13px}
  .ready{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
         background:#10261c;border:1px solid #1c4634;color:#4ade80;font-size:12px;font-weight:700}
  .dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
  .steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 20px}
  .steps .s{display:flex;align-items:center;gap:9px}
  .steps b{width:26px;height:26px;border-radius:50%;background:#173a2a;color:#4ade80;
           display:grid;place-content:center;font-size:12px;border:1px solid #205540}
  .steps .t{font-size:12.5px;font-weight:700}
  .steps .d{font-size:11px;color:var(--muted)}
  .steps .bar{flex:1;min-width:40px;height:1px;background:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .card h3{margin:0 0 3px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .cs{color:var(--muted);font-size:12px;margin:0 0 14px}
  .grow{flex:1}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#16294a;color:#9db8de}
  .drop{border:1.5px dashed #2a4674;border-radius:12px;background:#0c1b31;padding:26px;text-align:center;margin-bottom:16px}
  .drop .up{width:44px;height:44px;border-radius:12px;background:#173156;display:grid;place-content:center;margin:0 auto 10px;color:#7fb0ff}
  .drop b{font-size:15px}
  .drop p{color:var(--muted);font-size:12px;margin:5px 0 8px}
  .chip{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:8px;background:#123024;color:#5fd39a}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .tog{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);
       border-radius:11px;padding:13px 15px}
  .tog b{display:block;font-size:13px}
  .tog small{color:var(--muted);font-size:11px}
  .sw{width:40px;height:22px;border-radius:999px;background:#2b3f5f;position:relative;flex:none;cursor:pointer;border:0}
  .sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s}
  .sw.on{background:var(--blue)}
  .sw.on:after{left:21px}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
        padding:9px 12px;color:var(--ink);font:inherit;font-size:13px}
  input::placeholder{color:#5b7398}
  .hint{color:var(--muted);font-size:11px;margin:4px 0 0}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);
       background:var(--panel2);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .btn.p{background:var(--blue);border-color:transparent;color:#fff}
  .btn:hover{border-color:var(--blue)}
  .ok{color:#4ade80;font-size:12px}
  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tbl th{text-align:left;padding:9px 10px;color:var(--muted);font-size:11px;font-weight:700;
       border-bottom:1px solid var(--line);white-space:nowrap}
  table.tbl td{padding:10px;border-bottom:1px solid #16294a;vertical-align:top}
  table.tbl tr:last-child td{border-bottom:0}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .g-ok{background:#123024;color:#5fd39a}
  .g-run{background:#132a45;color:#7fb0ff}
  .g-warn{background:#33260f;color:#f0b martial}
  .g-warn{background:#33260f;color:#f0b429}
  .g-bad{background:#3a1a1d;color:#f98a8a}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi span{display:block;color:var(--muted);font-size:11.5px}
  .kpi b{display:block;font-size:25px;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi i{font-style:normal;font-size:11px;color:var(--muted)}
  .seg{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #16294a;align-items:flex-start}
  .seg .ts{color:#6f8db6;font-size:11.5px;min-width:96px;flex:none}
  .seg .spk{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:#1b355e;color:#9dc0f0;flex:none}
  .seg p{margin:0}
  .diff{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .diff .before{color:#f98a8a;text-decoration:line-through;opacity:.75}
  .diff .after{color:#5fd39a;font-weight:700}
  .diff .why{color:var(--muted);font-size:11.5px;margin-top:5px}
  .chart{height:230px}
  .split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media(max-width:1080px){.split{grid-template-columns:1fr}}
  @media(max-width:820px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;display:flex;gap:6px;overflow-x:auto}
    .rail .brand{display:none}.rail button{white-space:nowrap}.rail .idx{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><i class="material-symbols-outlined">mic</i>
      <span><b>語音轉錄與智慧校對</b><small>MOSS-TRANSCRIBE-DIARIZE</small></span></div>
    <div id="nav">
      <button data-i="0"><span class="material-symbols-outlined" style="font-size:18px">upload_file</span><span class="tx">建立轉錄工作</span><span class="idx">v0</span></button>
      <button data-i="1"><span class="material-symbols-outlined" style="font-size:18px">queue</span><span class="tx">轉錄佇列</span><span class="idx">v1</span></button>
      <button data-i="2"><span class="material-symbols-outlined" style="font-size:18px">subtitles</span><span class="tx">逐字稿與時間軸</span><span class="idx">v2</span></button>
      <button data-i="3"><span class="material-symbols-outlined" style="font-size:18px">record_voice_over</span><span class="tx">說話人分離</span><span class="idx">v3</span></button>
      <button data-i="4"><span class="material-symbols-outlined" style="font-size:18px">difference</span><span class="tx">智慧校對差異</span><span class="idx">v4</span></button>
      <button data-i="5"><span class="material-symbols-outlined" style="font-size:18px">inventory</span><span class="tx">交付與稽核</span><span class="idx">v5</span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
(function(){
  "use strict";
  var charts=[];
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function head(step,title,desc){
    return '<div class="top"><div><p class="eyebrow">STAGE 0'+step+'</p><h1>'+title+'</h1>'+
      '<p class="sub">'+desc+'</p></div>'+
      '<span class="ready"><span class="dot"></span>模型服務就緒</span></div>';
  }
  function steps(active){
    var S=[["選擇檔案","音訊或影片"],["語音轉錄","時間軸與說話人"],["智慧校對","串流比較差異"]];
    return '<div class="steps">'+S.map(function(s,i){
      return '<div class="s"><b>'+(i+1)+'</b><span><span class="t">'+s[0]+'</span><br><span class="d">'+s[1]+'</span></span></div>'+
        (i<2?'<span class="bar"></span>':"");
    }).join("")+'</div>';
  }
  function tog(name,desc,on){
    return '<div class="tog"><div class="grow"><b>'+name+'</b><small>'+desc+'</small></div>'+
      '<button type="button" class="sw'+(on?" on":"")+'" aria-pressed="'+(!!on)+'"></button></div>';
  }

  /* ── 畫面 0：建立轉錄工作 ───────────────────────── */
  function s0(){
    return head(1,"建立轉錄工作","將長音訊轉為可用逐字稿，保留時間軸與說話人，並即時比較智慧校對差異。")+steps(0)+
    '<div class="card"><h3>新的轉錄工作<span class="pill" style="margin-left:auto">API v1.2.4</span></h3>'+
    '<p class="cs">支援 mp3 / wav / m4a 與含音軌的影片，長度以實際音訊為準。</p>'+
    '<div class="drop"><div class="up"><span class="material-symbols-outlined">upload</span></div>'+
    '<b>Lee01.mp3</b><p>或點擊選擇檔案 · 上限 100 MB · 最長 90 分鐘</p>'+
    '<span class="chip">22.2 MB · audio/mpeg</span></div>'+
    '<div class="row" style="margin-bottom:16px">'+
      tog("時間序","產生時間戳與標準 SRT",true)+
      tog("區分說話人","標示 [S01]、[S02] 等角色",false)+
      tog("智慧校對","上下文修正同音與誤辨字詞",true)+
    '</div>'+
    '<div class="row">'+
      '<label class="f"><span>熱詞與專有名詞</span><input value="" placeholder="OpenMOSS, vLLM, 人名, 產品名稱" />'+
      '<p class="hint">以逗號分隔，會加入 ASR 提示。</p></label>'+
      '<label class="f"><span>vLLM 服務位址</span><input value="http://vllm:8000" />'+
      '<p class="hint">容器內預設為 http://vllm:8000。</p></label>'+
    '</div></div>'+
    '<div class="card"><p class="eyebrow">CONTEXT-AWARE REVIEW</p>'+
    '<h3>智慧校對設定<span class="cs" style="margin-left:auto;font-size:11.5px">完整轉錄後才會送出；金鑰僅用於本次請求，不儲存在瀏覽器。</span></h3>'+
    '<div class="row">'+
      '<label class="f"><span>LiteLLM API 位址</span><input value="https://litellm.my-yang.online/v1" /></label>'+
      '<label class="f"><span>API Key</span><input type="password" value="sk-demo-0000000000000000" /></label>'+
      '<label class="f"><span>校對模型</span><input value="deepseek-v4-flash" /></label>'+
      '<label class="f"><span>推理強度</span><select><option>medium — 建議</option><option>low — 最快</option><option>high — 最準</option></select></label>'+
    '</div>'+
    tog("長文智慧加速","100 段以上自動使用 low，避免先耗時推理後重試；關閉後會完整遵照上方推理強度。",true)+
    '<div style="display:flex;gap:12px;align-items:center;margin-top:14px">'+
      '<button class="btn">測試 LiteLLM 連線</button>'+
      '<span class="ok">連線成功，deepseek-v4-flash 可使用。</span>'+
      '<button class="btn p" style="margin-left:auto">開始轉錄</button></div></div>';
  }

  /* ── 畫面 1：轉錄佇列 ───────────────────────────── */
  var JOBS=[
    ["JOB-2418","Lee01.mp3","48:12","轉錄中","g-run","72%","deepseek-v4-flash"],
    ["JOB-2417","法說會_Q3.wav","1:12:40","校對中","g-run","94%","deepseek-v4-flash"],
    ["JOB-2416","客訴電話_0829.m4a","09:35","已完成","g-ok","100%","deepseek-v4-flash"],
    ["JOB-2415","產線教育訓練.mp4","32:08","已完成","g-ok","100%","deepseek-v4-flash"],
    ["JOB-2414","董事會紀錄.wav","1:41:22","需人工確認","g-warn","100%","deepseek-v4-flash"],
    ["JOB-2413","門市晨會.mp3","06:44","失敗｜音軌損毀","g-bad","12%","—"]
  ];
  function s1(){
    return head(2,"轉錄佇列","一次可排入多個檔案，長音訊自動切段並行處理，失敗的段落單獨重試。")+
    '<div class="kpis">'+
      '<div class="kpi"><span>今日轉錄時數</span><b>18.4</b><i>小時音訊</i></div>'+
      '<div class="kpi"><span>平均即時率</span><b>0.18×</b><i>1 小時音訊約 11 分鐘</i></div>'+
      '<div class="kpi"><span>字錯率（抽驗）</span><b>3.2%</b><i>校對前 7.9%</i></div>'+
      '<div class="kpi"><span>待人工確認</span><b>1</b><i>低信心段落過多</i></div>'+
    '</div>'+
    '<div class="card"><h3>工作佇列</h3><p class="cs">狀態每完成一段就更新，不必等整份跑完。</p>'+
    '<table class="tbl"><thead><tr><th>工作編號</th><th>檔案</th><th>長度</th><th>狀態</th><th>進度</th><th>校對模型</th></tr></thead><tbody>'+
    JOBS.map(function(j){return '<tr><td class="mono">'+j[0]+'</td><td>'+esc(j[1])+'</td><td class="mono">'+j[2]+
      '</td><td><span class="tag '+j[4]+'">'+j[3]+'</span></td><td class="mono">'+j[5]+'</td><td class="mono">'+j[6]+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<div class="card"><h3>各階段耗時</h3><p class="cs">切段、轉錄、校對三段分開計時，才看得出瓶頸在哪一段。</p>'+
    '<div id="c1" class="chart"></div></div>';
  }

  /* ── 畫面 2：逐字稿與時間軸 ─────────────────────── */
  var SEGS=[
    ["00:00:04.120","S01","今天想先確認上一版的轉錄品質，特別是專有名詞那部分。"],
    ["00:00:11.480","S02","我們把熱詞清單加進去之後，OpenMOSS 跟 vLLM 這兩個詞就沒有再被拆錯了。"],
    ["00:00:21.905","S01","那時間戳呢？剪輯那邊反映有幾段對不上。"],
    ["00:00:28.310","S02","切段的重疊區調成一點五秒之後，接縫的字就不會重複出現。"],
    ["00:00:37.660","S01","好，那我們就用這個設定跑完整份。"],
    ["00:00:42.015","S02","我把智慧校對也開著，跑完會給你差異對照。"]
  ];
  function s2(){
    return head(3,"逐字稿與時間軸","每一段都保留起訖時間，可直接輸出標準 SRT 給剪輯或字幕系統。")+
    '<div class="split"><div class="card"><h3>逐字稿</h3>'+
    '<p class="cs">JOB-2418 · Lee01.mp3 · 48:12 · 共 312 段</p>'+
    SEGS.map(function(s){return '<div class="seg"><span class="ts mono">'+s[0]+'</span>'+
      '<span class="spk">'+s[1]+'</span><p>'+esc(s[2])+'</p></div>';}).join("")+
    '</div><div><div class="card"><h3>輸出格式</h3><p class="cs">同一份轉錄可以輸出多種格式，時間軸一致。</p>'+
    '<table class="tbl"><thead><tr><th>格式</th><th>用途</th><th>狀態</th></tr></thead><tbody>'+
    [["SRT","影片字幕","已產生","g-ok"],["VTT","網頁播放器","已產生","g-ok"],
     ["TXT","純文字稿","已產生","g-ok"],["JSON","含信心值與詞級時間","已產生","g-ok"]]
      .map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td><span class="tag '+r[3]+'">'+r[2]+'</span></td></tr>';}).join("")+
    '</tbody></table></div>'+
    '<div class="card"><h3>信心值分布</h3><p class="cs">低信心的段落會被標出來優先人工確認。</p>'+
    '<div id="c2" class="chart" style="height:190px"></div></div></div></div>';
  }

  /* ── 畫面 3：說話人分離 ─────────────────────────── */
  function s3(){
    return head(4,"說話人分離","把逐字稿切成不同角色，會議紀錄與客訴分析才用得上。")+
    '<div class="split"><div class="card"><h3>說話人統計</h3><p class="cs">依實際發話時間計算，不是依段數。</p>'+
    '<div id="c3" class="chart"></div></div>'+
    '<div class="card"><h3>角色對應</h3><p class="cs">系統先分出 S01/S02，再由人指定真實姓名，之後同一個聲紋會自動沿用。</p>'+
    '<table class="tbl"><thead><tr><th>系統標記</th><th>指定姓名</th><th>發話時間</th><th>段數</th></tr></thead><tbody>'+
    [["S01","李品瑜（產品）","21:38","142"],["S02","陳孟修（技術）","24:52","158"],
     ["S03","（未指定）","01:42","12"]].map(function(r){
      return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="mono">'+r[3]+'</td></tr>';
    }).join("")+'</tbody></table></div></div>';
  }

  /* ── 畫面 4：智慧校對差異 ───────────────────────── */
  var DIFFS=[
    ["歐盤 MOSS","OpenMOSS","產品名稱，已在熱詞清單中"],
    ["V L L M","vLLM","技術名詞，還原原始拼寫"],
    ["切斷的重疊區","切段的重疊區","同音誤辨，依上下文修正"],
    ["一點五秒","1.5 秒","數值統一為半形數字"],
    ["這個設定跑完整分","這個設定跑完整份","量詞誤辨"]
  ];
  function s4(){
    return head(5,"智慧校對差異","校對只改「明顯錯的」，每一處都留原文與理由，人可以逐條否決。")+
    '<div class="kpis">'+
      '<div class="kpi"><span>建議修正</span><b>47</b><i>全份 312 段</i></div>'+
      '<div class="kpi"><span>已採納</span><b>44</b><i>3 處人工否決</i></div>'+
      '<div class="kpi"><span>字錯率改善</span><b>-4.7</b><i>7.9% → 3.2%</i></div>'+
      '<div class="kpi"><span>校對耗時</span><b>2:18</b><i>與轉錄並行</i></div>'+
    '</div>'+
    '<div class="card"><h3>逐條差異</h3><p class="cs">左邊是轉錄原文，右邊是校對後；理由寫清楚才有辦法判斷該不該採納。</p>'+
    DIFFS.map(function(d){return '<div class="diff"><span class="before">'+esc(d[0])+'</span>'+
      ' <span class="material-symbols-outlined" style="font-size:15px;vertical-align:-3px;color:#5b7398">arrow_forward</span> '+
      '<span class="after">'+esc(d[1])+'</span><div class="why">'+esc(d[2])+'</div></div>';}).join("")+
    '</div>';
  }

  /* ── 畫面 5：交付與稽核 ─────────────────────────── */
  function s5(){
    return head(6,"交付與稽核","誰在什麼時候改了哪一段，都留得下來——逐字稿要當證據時這件事最重要。")+
    '<div class="card"><h3>交付紀錄</h3><p class="cs">每次匯出都記一筆，含當時使用的模型與設定。</p>'+
    '<table class="tbl"><thead><tr><th>時間</th><th>工作編號</th><th>格式</th><th>操作者</th><th>狀態</th></tr></thead><tbody>'+
    [["08-31 14:22","JOB-2416","SRT + TXT","李品瑜","已下載","g-ok"],
     ["08-31 11:05","JOB-2415","JSON","系統排程","已推送 API","g-ok"],
     ["08-30 17:41","JOB-2414","TXT","陳孟修","待覆核","g-warn"],
     ["08-30 09:18","JOB-2412","SRT","李品瑜","已下載","g-ok"]]
      .map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td class="mono">'+r[1]+'</td><td>'+r[2]+
        '</td><td>'+r[3]+'</td><td><span class="tag '+r[5]+'">'+r[4]+'</span></td></tr>';}).join("")+
    '</tbody></table></div>'+
    '<div class="card"><h3>近七日轉錄量</h3><p class="cs">用來估算模型服務要開多少資源。</p>'+
    '<div id="c5" class="chart"></div></div>';
  }

  function paint(i){
    charts.forEach(function(c){try{c.dispose();}catch(e){}});
    charts=[];
    var axis={axisLine:{lineStyle:{color:"#25406b"}},axisLabel:{color:"#8aa2c4",fontSize:11},
              splitLine:{lineStyle:{color:"#17294a"}}};
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;
      var c=window.echarts.init(el);c.setOption(opt);charts.push(c);}
    if(i===1) mk("c1",{grid:{left:52,right:16,top:24,bottom:30},
      tooltip:{trigger:"axis"},legend:{textStyle:{color:"#8aa2c4"},top:0},
      xAxis:Object.assign({type:"category",data:["切段","轉錄","校對"]},axis),
      yAxis:Object.assign({type:"value",name:"分鐘"},axis),
      series:[{name:"Lee01.mp3",type:"bar",data:[0.6,8.4,2.3],itemStyle:{color:"#3b82f6"}},
              {name:"法說會_Q3",type:"bar",data:[1.4,19.2,5.1],itemStyle:{color:"#8b5cf6"}}]});
    if(i===2) mk("c2",{grid:{left:44,right:14,top:18,bottom:28},tooltip:{trigger:"axis"},
      xAxis:Object.assign({type:"category",data:["<0.6","0.6-0.7","0.7-0.8","0.8-0.9",">0.9"]},axis),
      yAxis:Object.assign({type:"value",name:"段"},axis),
      series:[{type:"bar",data:[9,17,38,96,152],itemStyle:{color:"#22c55e"}}]});
    if(i===3) mk("c3",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#8aa2c4"}},
      series:[{type:"pie",radius:["46%","70%"],label:{color:"#c7d8f0"},
        data:[{value:1298,name:"S01 李品瑜",itemStyle:{color:"#3b82f6"}},
              {value:1492,name:"S02 陳孟修",itemStyle:{color:"#8b5cf6"}},
              {value:102,name:"S03 未指定",itemStyle:{color:"#334f7d"}}]}]});
    if(i===5) mk("c5",{grid:{left:50,right:16,top:22,bottom:30},tooltip:{trigger:"axis"},
      xAxis:Object.assign({type:"category",data:["8/25","8/26","8/27","8/28","8/29","8/30","8/31"]},axis),
      yAxis:Object.assign({type:"value",name:"小時"},axis),
      series:[{type:"line",smooth:true,data:[9.2,12.6,11.4,15.8,14.2,16.9,18.4],
        itemStyle:{color:"#22c55e"},areaStyle:{color:"rgba(34,197,94,.16)"}}]});
  }

  var SCREENS=[
    {name:"建立轉錄工作",fn:s0},
    {name:"轉錄佇列",fn:s1},
    {name:"逐字稿與時間軸",fn:s2},
    {name:"說話人分離",fn:s3},
    {name:"智慧校對差異",fn:s4},
    {name:"交付與稽核",fn:s5}
  ];
  var nav=document.getElementById("nav");

  function show(i){
    document.getElementById("main").innerHTML=SCREENS[i].fn();
    var bs=nav.querySelectorAll("button");
    for(var k=0;k<bs.length;k++) bs[k].className=(k===i?"on":"");
    paint(i);
  }
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b) return;
    var n="#go="+b.dataset.i;
    if(location.hash===n) show(+b.dataset.i); else location.hash=n;
  });
  /* 開關只是展示互動，狀態留在畫面上就好 */
  document.addEventListener("click",function(e){
    var sw=e.target.closest(".sw"); if(!sw) return;
    sw.classList.toggle("on");
    sw.setAttribute("aria-pressed",sw.classList.contains("on"));
  });
  window.addEventListener("resize",function(){
    charts.forEach(function(c){try{c.resize();}catch(e){}});});
  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return;}
    show(Math.min(+m[1],SCREENS.length-1));
    try{window.scrollTo(0,0);}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
})();
</script>
</body>
</html>
