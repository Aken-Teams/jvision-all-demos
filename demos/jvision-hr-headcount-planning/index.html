<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>編制員額與人力盤點 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E6FFFA;
  --hov:#F0FDFA;
  --track:#D9E7E9;
  --sidebar:#115E59;
  --sidebar2:#115E59;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:10px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tag{
  margin:0;
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:252px;
  height:100vh;
  min-width:0;
  padding:24px 16px;
  overflow:auto;
  color:#FFFFFF;
  background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 8px 22px;
  border-bottom:1px solid rgba(255,255,255,.28);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #FDE68A;
  border-radius:8px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  color:#FFFFFF;
  font-size:17px;
  font-weight:700;
  letter-spacing:.06em;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  overflow:hidden;
  color:#CCFBF1;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
  margin-top:20px;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:44px;
  padding:10px 11px;
  color:#CCFBF1;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  transition:color .18s ease,background-color .18s ease,border-color .18s ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button .txt{font-size:14px;font-weight:700}
.nav button:hover{
  color:#FFFFFF;
  background:#0F766E;
  border-color:#5EEAD4;
}
.nav button.on{
  color:#000000;
  background:var(--color-secondary);
  border-color:#99F6E4;
}
.nav button.on::before{
  content:"";
  position:absolute;
  top:8px;
  bottom:8px;
  left:-12px;
  width:4px;
  background:var(--color-accent);
}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Cinzel",monospace;
  font-size:10px;
  font-weight:600;
  opacity:.8;
}
.side-foot{
  margin-top:auto;
  padding:16px 9px 2px;
  color:#CCFBF1;
  border-top:1px solid rgba(255,255,255,.28);
  font-size:11px;
  line-height:1.75;
}
.side-foot b{color:#FFFFFF}

.main{flex:1;min-width:0;padding:24px 28px 56px}
.topbar{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin:-24px -28px 20px;
  padding:18px 28px;
  background:rgba(240,253,250,.96);
  border-bottom:1px solid var(--line);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
  font-size:25px;
  font-weight:700;
  letter-spacing:.02em;
}
.topbar h1 .material-symbols-outlined{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  color:#000000;
  background:var(--color-secondary);
  border-radius:6px;
  font-size:21px;
}
.topbar .sub{margin-top:3px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  font-size:12px;
  font-weight:600;
}
.chip .dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid #FFFFFF;
  outline:1px solid var(--ok);
  border-radius:50%;
}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#000000;
  background:var(--color-accent);
  border:2px solid #92400E;
  border-radius:7px;
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:14px;
  font-weight:700;
}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
}
.card,.sec{padding:17px}
.sec{margin-bottom:14px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h,.sec>h3{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:35px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--color-muted);
}
.card-h{justify-content:space-between;flex-wrap:wrap}
.card-h h3,.sec>h3{
  color:var(--ink);
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:var(--accent);
  font-size:19px;
}
.card-h .hint{color:var(--muted);font-size:12px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:13px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:16px 17px;border-top:4px solid var(--color-primary)}
.kpi::after{
  content:"";
  position:absolute;
  top:12px;
  right:12px;
  width:7px;
  height:7px;
  background:var(--color-accent);
  border-radius:50%;
}
.kpi .ico{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#000000;
  background:var(--color-secondary);
  border-radius:6px;
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;
  color:var(--ink);
  font-family:"Crimson Pro",Georgia,serif;
  font-size:29px;
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.02em;
}
.kpi .val small,.stat .val small{
  margin-left:4px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:5px;
  font-size:12px;
  font-weight:700;
}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card>div[style*="overflow-x:auto"]{border-radius:0 0 var(--r) var(--r)}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  color:var(--ink);
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
th{
  padding:11px 13px;
  color:#334155;
  text-align:left;
  white-space:nowrap;
  background:var(--th);
  border-bottom:2px solid var(--color-primary);
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
td{
  padding:11px 13px;
  white-space:nowrap;
  background:#FFFFFF;
  border-bottom:1px solid #C7E9E5;
  transition:background-color .16s ease;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hov)}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
td:last-child,th:last-child{text-align:left}
.mono{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-weight:700;
  letter-spacing:.01em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:5px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
}
.tag::before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #B7CFD2;border-radius:3px}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--muted);font-size:11px;font-weight:700;text-align:right}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-24px;
  width:14px;
  height:14px;
  background:#FFFFFF;
  border:3px solid var(--accent);
  border-radius:3px;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:monospace;font-size:11px;font-weight:700}
.tl-item b,.tl-i b{display:block;margin:2px 0;color:var(--ink);font-size:13px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #A7CFCB;font-size:13px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{flex:none;font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px;text-align:right}
.note{
  margin-top:13px;
  padding:12px;
  color:#334155;
  background:#FFFBEB;
  border:1px solid #F59E0B;
  border-left:4px solid var(--color-accent);
  border-radius:5px;
  font-size:12px;
  line-height:1.7;
}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:1px solid var(--line);border-radius:8px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:13px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:4px;font-size:11px}
.pcard{padding:11px 12px;background:#FFFFFF;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px}
.pcard b{font-size:13px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{
  display:inline-flex;
  flex:none;
  align-items:center;
  justify-content:center;
  color:#000000;
  background:var(--color-secondary);
  border-radius:4px;
  font-weight:800;
}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#FFFFFF;border:1px solid var(--line);border-radius:7px}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#000000;background:var(--color-secondary);border-radius:5px;font-family:monospace;font-size:13px;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:#64748B;background:#FFFFFF;border:2px solid #94A3B8;border-radius:4px;font-family:monospace;font-size:11px}
.steps .ln{width:20px;height:2px;background:#94A3B8}
.steps .s.done{color:#000000;background:var(--color-secondary);border-color:var(--color-primary)}
.steps .s.cur{color:#000000;background:#FEF3C7;border-color:var(--color-accent)}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed #A7CFCB}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:3px}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border:1px solid #B7CFD2;border-radius:5px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--accent);border:2px solid #064E3B;border-radius:3px}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px 17px;border-top:4px solid var(--color-primary)}
.tile .ti{display:flex;align-items:center;justify-content:center;width:37px;height:37px;color:#000000;background:var(--color-secondary);border-radius:6px}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:15px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}

#screen{display:grid;grid-template-columns:392px minmax(0,1fr);grid-auto-rows:min-content;gap:14px;align-items:start}
#screen>*{grid-column:1 / -1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px;padding:0!important;background:none!important;border:none!important}
#screen>.grid.g4:first-child>*{flex:none!important;padding:15px 16px!important;background:var(--panel)!important;border:1px solid var(--line)!important;border-top:4px solid var(--color-primary)!important;border-radius:var(--r)!important}
#screen>.grid.g4:first-child>.tile .ti{width:34px;height:34px;margin:0;overflow:visible}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:312px}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:0 4px 12px}
  .nav{flex-direction:row;gap:7px;margin-top:12px;overflow-x:auto;padding-bottom:3px}
  .nav button{flex:0 0 auto;padding:9px 11px}
  .nav button.on::before{top:auto;right:9px;bottom:-4px;left:9px;width:auto;height:4px}
  .nav .idx,.side-foot{display:none}
  .main{padding:20px 16px 44px}
  .topbar{position:static;margin:-20px -16px 18px;padding:16px;flex-wrap:wrap}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
  .top-right{width:100%}
}
@media(max-width:560px){
  body{font-size:14px}
  .main{padding-right:12px;padding-left:12px}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
