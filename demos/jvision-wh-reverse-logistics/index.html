<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>退貨入庫與逆物流管理 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#f0fdf4;
  --track:#e6e8ea;
  --sidebar:#fff;
  --sidebar2:#f8fafc;
  --side-edge:#e6e8ea;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#334155;
  --r:8px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.045);
  --shadow-hover:0 2px 4px rgba(15,23,42,.06),0 12px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  font-family:"Open Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  font-family:"Poppins","Open Sans",sans-serif;
  color:var(--ink);
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
button,[data-i]{cursor:pointer}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px;
}
::selection{background:var(--accent-soft);color:var(--ink)}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:252px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  padding:24px 18px 20px;
  overflow-y:auto;
  background:var(--sidebar);
  color:var(--ink);
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 6px 25px;
  border-bottom:1px solid var(--line);
}
.brand-logo{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em}
.brand-txt span{display:block;margin-top:1px;color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:20px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:44px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  font-weight:600;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
  white-space:nowrap;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{border-color:var(--line);background:var(--color-muted);color:var(--ink);transform:translateX(2px)}
.nav button.on{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
.nav button.on::before{content:"";position:absolute;left:-19px;top:8px;bottom:8px;width:3px;background:var(--accent)}
.nav .idx{margin-left:auto;font-family:"Open Sans",monospace;font-size:10px;font-weight:700;opacity:.7}
.side-foot{
  margin-top:auto;
  padding:18px 7px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10.5px;
  line-height:1.75;
}
.side-foot b{color:var(--ink)}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,42px) 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:22px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(20px,2vw,26px);font-weight:600;letter-spacing:-.025em}
.topbar h1 .material-symbols-outlined{font-size:26px;color:var(--accent)}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  color:var(--muted);
  font-size:11.5px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;border:2px solid var(--ok);border-radius:50%;background:#fff;animation:pulse 2.4s ease-in-out infinite}
.avatar{
  width:36px;
  height:36px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--color-primary);
  border-radius:50%;
  background:var(--color-primary);
  color:#fff;
  font-family:"Poppins",sans-serif;
  font-size:12px;
  font-weight:600;
}

#screen>*,.grid>*{animation:reveal .36s ease-out both}
#screen>*:nth-child(2){animation-delay:.05s}
#screen>*:nth-child(3){animation-delay:.1s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--r);
  background:var(--panel);
  color:var(--ink);
  box-shadow:var(--shadow);
}
.card,.sec{padding:20px}
.card,.kpi,.stat,.tile{transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.card:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#cbd5e1;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:-.01em;
}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card.pad0>.card-h,.card.p0>.card-h{margin-bottom:0!important;padding:18px 20px 15px!important;border-bottom:1px solid var(--line)}
.card-h .hint{color:var(--muted);font-size:11px;font-weight:600}

.kpi,.stat,.tile{position:relative;overflow:hidden;padding:18px 19px;border-left:3px solid var(--accent)}
.kpi::after{display:none}
.kpi .ico,.tile .ti{
  position:absolute;
  top:15px;
  right:16px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #a7f3d0;
  border-radius:6px;
  background:var(--accent-soft);
  color:#047857;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:0;padding-right:42px;color:var(--muted);font-size:11.5px;font-weight:600}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{
  margin-top:10px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:clamp(23px,2.2vw,29px);
  font-weight:600;
  line-height:1.2;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
.tile{display:flex;flex-direction:column;gap:7px;min-height:138px}
.tile b{max-width:calc(100% - 42px);font-family:"Open Sans",sans-serif;font-size:12px;font-weight:600;color:var(--muted)}
.tile p{margin:auto 0 0;color:var(--muted);font-size:11.5px;line-height:1.55}

.card.pad0>div:last-child{scrollbar-width:thin;scrollbar-color:#94a3b8 transparent}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  background:var(--th);
  color:var(--muted);
  text-align:left;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
  white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--hov)}
td:nth-child(3),td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
th:nth-child(3),th:nth-child(4){text-align:right}
.mono,td:first-child,.tl-time,.tl-t,.side-foot,.idx{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.mono,td:first-child{font-weight:600;letter-spacing:.01em}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.35;
  white-space:nowrap;
}
.t-ok{background:#ecfdf5;color:#047857}
.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#f1f5f9;color:#334155}
.t-gray{background:#f8fafc;color:#475569}
.t-acc,.t-pink{background:#ecfdf5;color:#047857}

.bar{height:7px;min-width:56px;overflow:hidden;border-radius:2px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-size:10.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10.5px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--th)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 7px;font-size:12px;font-weight:600}
.col-h .cnt{padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:10.5px}
.pcard{padding:12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;background:#fff;transition:border-color .2s ease,transform .2s ease}
.pcard:hover{border-color:#94a3b8;transform:translateY(-1px)}
.pcard b{font-size:12px;font-weight:600}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10.5px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:10.5px}
.mini-av,.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent-soft);color:#047857;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10.5px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--color-primary);color:#fff;font-family:"Poppins",sans-serif;font-size:12px;font-weight:600}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:12.5px;font-weight:600}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;width:23px;height:23px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{border-color:var(--accent);background:var(--accent);color:#001b12}
.steps .s.cur{border-color:var(--accent);color:#047857;animation:pulse 1.8s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12.5px;font-weight:600}
.rep-row .sku span{color:var(--muted);font-size:10.5px}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;overflow:hidden;border-radius:2px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;border-radius:4px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:2px;background:var(--accent)}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 0 12px;border-bottom:0}
  .brand-logo{width:38px;height:38px}
  .nav{flex-direction:row;gap:6px;margin-top:0;padding-top:11px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
  .nav button{flex:0 0 auto;min-height:42px;padding:9px 12px}
  .nav button.on::before{left:9px;right:9px;top:auto;bottom:-1px;width:auto;height:3px}
  .nav .idx,.side-foot{display:none}
  .main{padding:22px 16px 48px}
  .topbar{align-items:flex-start;margin-bottom:20px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  body{font-size:13px}
  .main{padding-inline:12px}
  .topbar{display:block}
  .top-right{justify-content:flex-start;margin-top:14px}
  .topbar h1{font-size:19px}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .tile{min-height:146px;padding:15px}
  .tile .tv{font-size:22px}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:inline}
  .card,.sec{padding:16px}
  .card.pad0>.card-h,.card.p0>.card-h{padding:15px 16px 13px!important}
  .lane-row{align-items:flex-start}
  .steps{display:none}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .chip:nth-child(2){display:none}
  .nav button{padding-inline:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>*,.grid>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">assignment_return</span></div>
      <div class="brand-txt"><b>逆物流管理台</b><span>REVERSE LOGISTICS</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08 當期<br/>在庫待處置 486 件<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
