<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>網路監控系統（NMS）｜Jvision 系統 Demo</title>
  <meta name="description" content="設備可用性與效能監控、頻寬流量分析、拓樸圖自動繪製、告警分級到可用率稽核的網路監控平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#E2E8F0;
      --good:#15803D;
      --warn:#B45309;
      --bad:#DC2626;
      --info:#0369A1;
      --shadow:0 12px 30px rgba(15,23,42,.07);
      --shadow-hover:0 18px 42px rgba(37,99,235,.11);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
    body{
      min-width:320px;
      background:
        radial-gradient(circle at 85% 0,rgba(59,130,246,.09),transparent 27rem),
        var(--color-background);
      color:var(--ink);
      font-family:"Work Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,.navbtn{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;
    }
    .topnav{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;gap:16px;
      min-width:0;padding:12px clamp(14px,2.4vw,34px);
      color:var(--muted);
      background:rgba(255,255,255,.94);
      border-bottom:1px solid rgba(226,232,240,.92);
      box-shadow:0 4px 20px rgba(15,23,42,.04);
      backdrop-filter:blur(16px);
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .logo,.scr-head .ic{
      display:grid;place-items:center;
      color:var(--color-on-primary);
      background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));
      box-shadow:0 9px 22px rgba(37,99,235,.22);
    }
    .logo{width:40px;height:40px;flex:0 0 40px;border-radius:12px}
    .logo .material-symbols-outlined{font-size:22px}
    .bt{min-width:0}
    .bt b{
      display:block;color:var(--ink);font-family:"Outfit",sans-serif;
      font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap;
    }
    .bt span{display:block;color:var(--muted);font-size:11px;white-space:nowrap}
    .navwrap{
      display:flex;align-items:center;gap:4px;min-width:0;flex:1;
      overflow-x:auto;scrollbar-width:none;
    }
    .navwrap::-webkit-scrollbar{display:none}
    .navbtn{
      display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
      min-height:42px;padding:9px 12px;border:1px solid transparent;border-radius:10px;
      color:var(--muted);background:transparent;
      font-size:13px;font-weight:600;white-space:nowrap;
      transition:color .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
    }
    .navbtn .material-symbols-outlined{font-size:19px}
    .navbtn:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
    .navbtn.on{
      color:var(--color-on-primary);background:var(--color-primary);
      border-color:var(--color-primary);box-shadow:0 7px 16px rgba(37,99,235,.2);
    }
    .navlive{
      display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
      padding:7px 11px;border:1px solid #BBF7D0;border-radius:999px;
      color:#166534;background:#F0FDF4;font-size:12px;font-weight:700;white-space:nowrap;
    }
    .navlive .dot{
      width:8px;height:8px;border-radius:50%;background:var(--good);
      box-shadow:0 0 0 3px rgba(21,128,61,.13);
    }
    .wrap{width:min(100%,1488px);margin:auto;padding:24px clamp(14px,2.5vw,36px) 48px}
    .scr-head{
      position:relative;isolation:isolate;
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      min-width:0;margin-bottom:18px;padding:19px 20px;
      overflow:hidden;border:1px solid #DBEAFE;border-radius:18px;
      background:linear-gradient(125deg,#FFFFFF 0%,#EFF6FF 100%);
      box-shadow:0 8px 26px rgba(37,99,235,.06);
    }
    .scr-head::after{
      content:"";position:absolute;z-index:-1;right:-50px;top:-75px;
      width:220px;height:220px;border-radius:50%;
      background:radial-gradient(circle,rgba(37,99,235,.15),rgba(37,99,235,0) 68%);
    }
    .scr-head .ic{width:46px;height:46px;flex:0 0 46px;border-radius:13px}
    .scr-head .ic .material-symbols-outlined{font-size:25px}
    .scr-head .ht{min-width:0}
    .scr-h{
      margin:0;color:var(--ink);font-family:"Outfit",sans-serif;
      font-size:clamp(20px,2vw,25px);font-weight:700;letter-spacing:-.02em;
    }
    .scr-d{margin:3px 0 0;color:var(--muted);font-size:13px}
    .spacer{flex:1}
    .tag{
      display:inline-flex;align-items:center;gap:6px;
      padding:7px 11px;border:1px solid #BFDBFE;border-radius:999px;
      color:#1D4ED8;background:#FFFFFF;font-size:12px;font-weight:700;white-space:nowrap;
    }
    .tag .material-symbols-outlined{font-size:16px}
    .grid{display:grid;gap:15px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g-2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
    .g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g-topo{grid-template-columns:minmax(0,1fr) 310px}
    .card,.kpi{
      min-width:0;border:1px solid var(--line);border-radius:16px;
      color:var(--color-card-foreground);background:var(--color-card);
      box-shadow:0 5px 18px rgba(15,23,42,.045);
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .card:hover,.kpi:hover{
      transform:translateY(-2px);border-color:#BFDBFE;box-shadow:var(--shadow-hover);
    }
    .card{padding:17px}
    .card h3{
      display:flex;align-items:center;gap:8px;
      margin:0 0 3px;font-family:"Outfit",sans-serif;font-size:14px;font-weight:700;
    }
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--blue)}
    .ch-sub{margin-bottom:13px;color:var(--muted);font-size:11.5px}
    .kpi{position:relative;overflow:hidden;padding:16px 17px}
    .kpi::before{
      content:"";position:absolute;inset:0 auto 0 0;width:4px;
      background:linear-gradient(180deg,var(--blue),var(--color-secondary));
    }
    .kpi::after{
      content:"";position:absolute;right:-25px;top:-28px;width:92px;height:92px;
      border-radius:50%;background:rgba(37,99,235,.055);
    }
    .kl{
      position:relative;z-index:1;display:flex;align-items:center;gap:6px;
      color:var(--muted);font-size:12px;font-weight:600;
    }
    .kl .material-symbols-outlined{font-size:17px;color:var(--blue)}
    .kv{
      position:relative;z-index:1;margin-top:8px;
      font-family:"Outfit",sans-serif;font-size:28px;font-weight:700;
      letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    }
    .kv small{margin-left:4px;color:var(--muted);font-size:13px;font-weight:600}
    .kd{
      position:relative;z-index:1;display:flex;align-items:center;gap:4px;
      margin-top:5px;font-size:11.5px;font-weight:600;
    }
    .kd .material-symbols-outlined{font-size:15px}
    .up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
    .chart-wrap{position:relative;width:100%;overflow:hidden}
    .tbl-scroll{
      overflow-x:auto;-webkit-overflow-scrolling:touch;
      border:1px solid var(--line);border-radius:12px;
    }
    table{width:100%;min-width:540px;border-collapse:collapse;font-size:12.5px}
    th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
    th{
      color:#334155;background:#F1F5F9;
      font-size:11px;font-weight:700;letter-spacing:.035em;
    }
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background .18s ease}
    tbody tr:hover{background:#F8FAFC}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    .mono{
      font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      font-variant-numeric:tabular-nums;
    }
    .pill{
      display:inline-flex;align-items:center;gap:5px;
      padding:4px 9px;border:1px solid transparent;border-radius:999px;
      font-size:11px;font-weight:700;white-space:nowrap;
    }
    .pill .material-symbols-outlined{font-size:14px}
    .p-up{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
    .p-down{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
    .p-warn{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
    .p-info{color:#075985;background:#F0F9FF;border-color:#BAE6FD}
    .p-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
    .p-acc{color:#1D4ED8;background:#EFF6FF;border-color:#BFDBFE}
    .dotb{display:inline-block;width:8px;height:8px;border-radius:50%}
    .bar{height:8px;min-width:60px;overflow:hidden;border-radius:99px;background:#E2E8F0}
    .bar>span{display:block;height:100%;border-radius:99px}
    .topo-box{
      position:relative;width:100%;overflow:hidden;
      border:1px solid #DBEAFE;border-radius:14px;
      background:radial-gradient(circle at 50% 22%,#FFFFFF,#EFF6FF);
    }
    .topo-box svg{display:block;width:100%;height:auto}
    .leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11.5px}
    .leg span{display:inline-flex;align-items:center;gap:5px}
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-width:0}
    .col{min-width:0;padding:12px;border:1px solid var(--line);border-radius:13px;background:#F8FAFC}
    .col h4{display:flex;align-items:center;gap:7px;margin:0 0 10px;font-size:12.5px;font-weight:700}
    .col h4 .cnt{
      margin-left:auto;padding:2px 8px;border:1px solid var(--line);
      border-radius:999px;color:var(--muted);background:#FFF;font-size:11px;
    }
    .acard{
      min-width:0;margin-bottom:9px;padding:10px 11px;
      border:1px solid var(--line);border-left:4px solid var(--muted);
      border-radius:10px;background:#FFF;box-shadow:0 2px 8px rgba(15,23,42,.035);
    }
    .acard:last-child{margin-bottom:0}
    .acard.sev1{border-left-color:var(--bad)}
    .acard.sev2{border-left-color:var(--warn)}
    .acard.sev3{border-left-color:var(--info)}
    .at{font-size:12.5px;font-weight:700}
    .an{margin-top:3px;color:var(--muted);font-size:11px}
    .am{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10.5px}
    .tl{position:relative;padding-left:22px}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl-item{position:relative;padding:0 0 17px 4px}
    .tl-item::before{
      content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;
      border:2px solid var(--blue);border-radius:50%;background:#FFF;
    }
    .tl-item.done::before{background:var(--blue)}
    .tl-t{font-size:12.5px;font-weight:700}
    .tl-s{margin-top:2px;color:var(--muted);font-size:11.5px}
    .health-row{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 4px;border-bottom:1px solid var(--line)}
    .health-row:last-child{border-bottom:0}
    .health-row .nm{
      flex:0 0 110px;min-width:0;overflow:hidden;
      font-size:12.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;
    }
    .health-row .bar{flex:1}
    .health-row .vv{
      flex:0 0 49px;text-align:right;
      font-family:"Outfit",sans-serif;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
    }
    .note{margin-top:12px;padding-top:12px;border-top:1px dashed #CBD5E1;color:var(--muted);font-size:11.5px}
    .statrow{display:flex;gap:10px;flex-wrap:wrap}
    .stat{flex:1;min-width:90px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#F8FAFC}
    .sl{color:var(--muted);font-size:11px;font-weight:600}
    .sv{
      margin-top:4px;font-family:"Outfit",sans-serif;
      font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
    }
    .foot{margin-top:30px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;text-align:center}
    .reveal{opacity:0;transform:translateY(12px)}
    .reveal.is-visible{opacity:1;transform:none;transition:opacity .35s ease,transform .35s ease}
    @media(max-width:1024px){
      .topnav{align-items:flex-start;flex-wrap:wrap}
      .navwrap{order:3;flex-basis:100%}
      .navlive{margin-left:auto}
      .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:768px){
      .g-2,.g-2e,.g-topo{grid-template-columns:1fr}
      .board{grid-template-columns:1fr}
      .g-3{grid-template-columns:1fr}
      .scr-head{align-items:flex-start}
      .scr-head .spacer{display:none}
      .tag{margin-left:60px}
    }
    @media(max-width:480px){
      .topnav{padding:10px 12px}
      .wrap{padding:16px 12px 38px}
      .navbtn{min-width:42px;justify-content:center;padding:9px 10px}
      .navbtn .tx,.navlive .tx{display:none}
      .g-kpi{grid-template-columns:1fr}
      .scr-head{padding:16px}
      .scr-d{font-size:12px}
      .tag{margin-left:0}
      .card{padding:14px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      .reveal{opacity:1!important;transform:none!important}
      .card:hover,.kpi:hover{transform:none}
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="主要功能">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">lan</span></div>
      <div class="bt"><b>NetWatch NMS</b><span>網路監控系統</span></div>
    </div>
    <div class="navwrap" id="nav"></div>
    <div class="navlive" aria-label="系統輪詢中">
      <span class="dot" aria-hidden="true"></span><span class="tx">輪詢中 · 60s</span>
    </div>
  </nav>

  <main class="wrap">
    <div id="app"></div>
    <footer class="foot">網路監控系統（NMS）· 純前端展示原型 · 假資料僅供介面示意 · Jvision Demo</footer>
  </main>

  <script>
  "use strict";

  var charts=[];
  function killCharts(){
    for(var i=0;i<charts.length;i++){
      try{charts[i].destroy();}catch(e){}
    }
    charts=[];
  }
  function mk(id,opt){
    var el=document.getElementById(id);
    if(!el)return;
    opt.chart=opt.chart||{};
    opt.chart.redrawOnParentResize=false;
    opt.chart.redrawOnWindowResize=false;
    opt.chart.animations={enabled:false};
    opt.chart.fontFamily='"Work Sans",sans-serif';
    opt.chart.foreColor="#475569";
    opt.chart.toolbar={show:false};
    try{
      var c=new ApexCharts(el,opt);
      c.render();
      charts.push(c);
    }catch(e){}
  }

  var ACC="#2563EB",ACC2="#3B82F6";

  var SCREENS=[
    {icon:"monitoring",name:"監控總覽",tx:"總覽",title:"監控總覽",desc:"全網設備可用率、健康度與即時效能指標儀表板"},
    {icon:"account_tree",name:"拓樸圖",tx:"拓樸圖",title:"網路拓樸圖",desc:"自動繪製核心到接取層拓樸，即時標示鏈路與節點狀態"},
    {icon:"trending_up",name:"頻寬流量",tx:"頻寬流量",title:"頻寬流量分析",desc:"上下行流量趨勢、介面使用率與 Top Talkers"},
    {icon:"warning",name:"告警管理",tx:"告警",title:"告警管理",desc:"門檻告警彙整、嚴重度分級與通知網管排除"},
    {icon:"dns",name:"設備納管",tx:"設備",title:"設備納管",desc:"SNMP／ICMP 節點納管、輪詢設定與探索狀態"},
    {icon:"insights",name:"可用率報表",tx:"報表",title:"可用率與 SLA 報表",desc:"網路可用率、MTTR 與 SLA 達成率稽核報表"}
  ];

  var HEALTH=[
    {nm:"核心交換器",v:99.8,c:ACC},
    {nm:"分佈層交換",v:99.2,c:ACC2},
    {nm:"防火牆",v:98.6,c:"#0369A1"},
    {nm:"無線 AP",v:96.4,c:"#15803D"},
    {nm:"WAN 路由",v:94.1,c:"#B45309"}
  ];

  var DEVROWS=[
    {name:"CORE-SW-01",ip:"10.0.0.1",type:"核心交換器",loc:"機房 A",poll:"60s",cpu:34,mem:52,st:"up"},
    {name:"CORE-SW-02",ip:"10.0.0.2",type:"核心交換器",loc:"機房 A",poll:"60s",cpu:41,mem:48,st:"up"},
    {name:"DIST-SW-A1",ip:"10.0.1.11",type:"分佈層交換",loc:"廠區一",poll:"120s",cpu:28,mem:39,st:"up"},
    {name:"DIST-SW-B2",ip:"10.0.2.12",type:"分佈層交換",loc:"廠區二",poll:"120s",cpu:88,mem:71,st:"warn"},
    {name:"FW-EDGE-01",ip:"10.0.0.254",type:"防火牆",loc:"機房 A",poll:"60s",cpu:63,mem:66,st:"up"},
    {name:"AP-FLOOR3-07",ip:"10.0.5.37",type:"無線 AP",loc:"三樓辦公",poll:"300s",cpu:0,mem:0,st:"down"},
    {name:"WAN-RT-HQ",ip:"10.0.0.9",type:"WAN 路由",loc:"機房 A",poll:"60s",cpu:57,mem:60,st:"up"},
    {name:"ACC-SW-L2-19",ip:"10.0.3.19",type:"接取交換",loc:"倉儲區",poll:"300s",cpu:22,mem:31,st:"up"}
  ];

  var ALERTS={
    sev1:[
      {t:"AP-FLOOR3-07 無回應",n:"ICMP 逾時 · 節點離線",dev:"10.0.5.37",age:"8 分鐘",rule:"可用性中斷"},
      {t:"DIST-SW-B2 CPU 88%",n:"連續 3 次輪詢超門檻",dev:"10.0.2.12",age:"14 分鐘",rule:"CPU>85%"}
    ],
    sev2:[
      {t:"FW-EDGE-01 連線數偏高",n:"Session 82% 上限",dev:"10.0.0.254",age:"22 分鐘",rule:"容量>80%"},
      {t:"WAN-RT-HQ 延遲上升",n:"RTT 78ms 高於基準",dev:"10.0.0.9",age:"35 分鐘",rule:"延遲>60ms"},
      {t:"Gi0/24 丟包",n:"丟包率 1.9%",dev:"10.0.1.11",age:"41 分鐘",rule:"丟包>1%"}
    ],

      for(var k=0;k<TALKERS.length;k++){tn.push(TALKERS[k].ip);td.push(TALKERS[k].v)}
      mk("c2b",{
        chart:{type:"bar",height:270},series:[{name:"流量 MB",data:td}],colors:[ACC],
        plotOptions:{bar:{borderRadius:5,horizontal:true,barHeight:"58%"}},
        dataLabels:{enabled:true,style:{fontSize:"10px",colors:["#FFFFFF"]}},
        xaxis:{categories:tn,labels:{style:{fontSize:"10px"}}},grid:{borderColor:gridColor},
        tooltip:{y:{formatter:function(v){return v.toLocaleString("en-US")+" MB"}}}
      });
    }else if(i===5){
      mk("c5a",{
        chart:{type:"line",height:260},
        series:[
          {name:"實際可用率 %",data:[98.9,99.0,99.1,99.2,99.3,99.42]},
          {name:"SLA 目標 %",data:[99,99,99,99,99,99]}
        ],
        colors:[ACC,"#64748B"],stroke:{curve:"smooth",width:[3,2],dashArray:[0,5]},
        dataLabels:{enabled:false},
        xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],labels:{style:{fontSize:"10px"}}},
        yaxis:{min:98.5,max:100,labels:{formatter:function(v){return v.toFixed(1)}}},
        legend:{position:"top",fontSize:"12px"},grid:{borderColor:gridColor},tooltip:{shared:true,intersect:false}
      });
      mk("c5b",{
        chart:{type:"bar",height:260},series:[{name:"MTTR 分鐘",data:[125,96,74,52,38,29]}],
        colors:[ACC2],plotOptions:{bar:{borderRadius:5,columnWidth:"52%"}},
        dataLabels:{enabled:true,style:{fontSize:"10px",colors:["#1E293B"]},offsetY:-16},
        xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],labels:{style:{fontSize:"10px"}}},
        yaxis:{labels:{formatter:function(v){return v|0}}},grid:{borderColor:gridColor},
        tooltip:{y:{formatter:function(v){return v+" 分"}}}
      });
      mk("c5c",{
        chart:{type:"pie",height:250},series:[38,22,18,12,10],
        labels:["鏈路／實體","設備故障","容量壅塞","組態異動","外部電力"],
        colors:[ACC,ACC2,"#0369A1","#15803D","#B45309"],
        legend:{position:"bottom",fontSize:"11px"},dataLabels:{enabled:true,style:{fontSize:"10px"}}
      });
    }
  }

  var observer=null;
  function reveal(){
    var els=document.querySelectorAll(".scr-head,.card,.kpi");
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce||!("IntersectionObserver" in window)){
      for(var a=0;a<els.length;a++)els[a].classList.add("is-visible");
      return;
    }
    if(observer)observer.disconnect();
    observer=new IntersectionObserver(function(entries){
      for(var i=0;i<entries.length;i++){
        if(entries[i].isIntersecting){
          entries[i].target.classList.add("is-visible");
          observer.unobserve(entries[i].target);
        }
      }
    },{threshold:.06,rootMargin:"0px 0px -4% 0px"});
    for(var j=0;j<els.length;j++){
      els[j].classList.add("reveal");
      observer.observe(els[j]);
    }
  }

  var RENDER=[s0,s1,s2,s3,s4,s5];
  function show(i){
    killCharts();
    var app=document.getElementById("app");
    if(!app)return;
    var sc=SCREENS[i];
    var head='<header class="scr-head"><div class="ic" aria-hidden="true"><span class="material-symbols-outlined">'+sc.icon+
      '</span></div><div class="ht"><h1 class="scr-h">'+sc.title+'</h1><p class="scr-d">'+sc.desc+
      '</p></div><div class="spacer"></div><span class="tag"><span class="material-symbols-outlined" aria-hidden="true">schedule</span>更新於 60 秒前</span></header>';
    app.innerHTML=head+RENDER[i]();
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){
      var active=+btns[b].getAttribute("data-i")===i;
      btns[b].classList.toggle("on",active);
      btns[b].setAttribute("aria-current",active?"page":"false");
    }
    void app.offsetHeight;
    reveal();
    initCharts(i);
  }

  (function(){
    var nav=document.getElementById("nav"),h="";
    for(var i=0;i<SCREENS.length;i++){
      h+='<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+SCREENS[i].name+
        '"><span class="material-symbols-outlined" aria-hidden="true">'+SCREENS[i].icon+
        '</span><span class="tx">'+SCREENS[i].name+"</span></button>";
    }
    nav.innerHTML=h;
    var btns=nav.querySelectorAll("[data-i]");
    for(var j=0;j<btns.length;j++){
      btns[j].addEventListener("click",function(){
        location.hash="v"+this.getAttribute("data-i");
      });
    }
  })();

  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return}
    var n=document.querySelectorAll("[data-i]").length||6;
    show(Math.min(+m[1],n-1));
    try{window.scrollTo(0,0)}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
  </script>
</body>
