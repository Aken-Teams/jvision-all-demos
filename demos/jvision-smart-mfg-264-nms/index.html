<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>網路監控系統（NMS）｜Jvision 系統 Demo</title>
  <meta name="description" content="設備可用性與效能監控、頻寬流量分析、拓樸圖自動繪製、告警分級到可用率稽核的網路監控平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#a16207;
      --accent2:#eab308;
      --bg:#f6f5f1;
      --panel:#ffffff;
      --ink:#211d13;
      --muted:#7a7263;
      --line:#e8e4d9;
      --nav:#2a2418;
      --nav2:#3a3222;
      --nav-ink:#d6cdb8;
      --good:#15803d;
      --bad:#dc2626;
      --warn:#d97706;
      --info:#0369a1;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,-apple-system,sans-serif;
      background:var(--bg);color:var(--ink);
      -webkit-font-smoothing:antialiased;line-height:1.5;
    }
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    /* top nav */
    .topnav{
      position:sticky;top:0;z-index:50;background:var(--nav);color:var(--nav-ink);
      border-bottom:3px solid var(--accent);
      display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;min-width:0;
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0;padding-right:6px;}
    .brand .logo{
      width:38px;height:38px;border-radius:10px;flex:0 0 38px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;
    }
    .brand .logo .material-symbols-outlined{font-size:23px;}
    .brand .bt{min-width:0;}
    .brand .bt b{display:block;color:#fff;font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap;}
    .brand .bt span{display:block;font-size:11px;color:#a89b7e;white-space:nowrap;}
    .navwrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0;flex:1;}
    .navbtn{
      display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:0;border-radius:9px;
      background:transparent;color:var(--nav-ink);cursor:pointer;
      font-family:inherit;font-size:13px;font-weight:600;min-width:0;transition:.15s;white-space:nowrap;
    }
    .navbtn .material-symbols-outlined{font-size:19px;}
    .navbtn:hover{background:var(--nav2);color:#fff;}
    .navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(161,98,7,.4);}
    .navlive{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(21,128,61,.16);color:#7ee6a5;font-size:12px;font-weight:700;white-space:nowrap;}
    .navlive .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;box-shadow:0 0 0 3px rgba(34,197,94,.2);}
    /* wrap */
    .wrap{padding:22px 24px 46px;min-width:0;max-width:1440px;margin:0 auto;}
    .scr-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0;}
    .scr-head .ic{
      width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    }
    .scr-head .ic .material-symbols-outlined{font-size:25px;}
    .scr-head .ht{min-width:0;}
    .scr-h{margin:0;font-size:19px;font-weight:900;letter-spacing:.2px;}
    .scr-d{margin:2px 0 0;font-size:13px;color:var(--muted);}
    .scr-head .spacer{flex:1;}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;background:#fbf6e8;color:var(--accent);font-size:12px;font-weight:700;border:1px solid #f0e4c2;white-space:nowrap;}
    .tag .material-symbols-outlined{font-size:16px;}
    /* grids */
    .grid{display:grid;gap:15px;min-width:0;}
    .g-kpi{grid-template-columns:repeat(4,1fr);}
    .g-2{grid-template-columns:1.55fr 1fr;}
    .g-2e{grid-template-columns:1fr 1fr;}
    .g-3{grid-template-columns:repeat(3,1fr);}
    .g-topo{grid-template-columns:1fr 300px;}
    @media(max-width:820px){
      .g-kpi,.g-2,.g-2e,.g-3,.g-topo{grid-template-columns:1fr;}
    }
    @media(min-width:521px) and (max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr;}
    }
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;
      box-shadow:0 1px 2px rgba(60,50,20,.03);
    }
    .card h3{margin:0 0 3px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
    .card .ch-sub{font-size:11.5px;color:var(--muted);margin-bottom:12px;}
    /* kpi */
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-width:0;position:relative;overflow:hidden;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
    .kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .kpi .kl .material-symbols-outlined{font-size:16px;color:var(--accent);}
    .kpi .kv{font-size:25px;font-weight:900;letter-spacing:-.5px;margin-top:7px;font-variant-numeric:tabular-nums;}
    .kpi .kv small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
    .kpi .kd{font-size:11.5px;margin-top:5px;font-weight:700;display:flex;align-items:center;gap:3px;}
    .kpi .kd .material-symbols-outlined{font-size:15px;}
    .up{color:var(--good);}.down{color:var(--bad);}.flat{color:var(--muted);}
    /* chart */
    .chart-wrap{position:relative;width:100%;overflow:hidden;}
    /* tables */
    .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:540px;}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
    th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:#faf8f2;}
    tbody tr:hover{background:#fbf9f3;}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
    .mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;}
    /* pills */
    .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
    .pill .material-symbols-outlined{font-size:14px;}
    .p-up{background:#e7f6ec;color:var(--good);}
    .p-down{background:#fdeaea;color:var(--bad);}
    .p-warn{background:#fdf1e0;color:var(--warn);}
    .p-info{background:#e6f2fa;color:var(--info);}
    .p-mut{background:#f0ede4;color:var(--muted);}
    .p-acc{background:#fbf6e8;color:var(--accent);}
    .dotb{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .bar{height:7px;border-radius:99px;background:#eee7d6;overflow:hidden;min-width:60px;}
    .bar>span{display:block;height:100%;border-radius:99px;}
    /* topology */
    .topo-box{position:relative;width:100%;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 50% 30%,#fdfbf5,#f4f0e6);border:1px solid var(--line);}
    .topo-box svg{display:block;width:100%;height:auto;}
    .leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted);}
    .leg span{display:inline-flex;align-items:center;gap:5px;}
    /* alert board */
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;min-width:0;}
    @media(max-width:820px){.board{grid-template-columns:1fr;}}
    .col{background:#faf8f2;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
    .col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
    .col h4 .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted);}
    .acard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;min-width:0;border-left:3px solid var(--muted);}
    .acard.sev1{border-left-color:var(--bad);}
    .acard.sev2{border-left-color:var(--warn);}
    .acard.sev3{border-left-color:var(--info);}
    .acard .at{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;}
    .acard .an{font-size:11px;color:var(--muted);margin-top:3px;}
    .acard .am{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;}
    /* timeline */
    .tl{position:relative;padding-left:22px;}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 16px 4px;}
    .tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--accent);}
    .tl-item.done::before{background:var(--accent);}
    .tl-t{font-size:12.5px;font-weight:800;}
    .tl-s{font-size:11.5px;color:var(--muted);margin-top:2px;}
    /* health row */
    .health-row{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line);min-width:0;}
    .health-row:last-child{border-bottom:0;}
    .health-row .nm{font-size:12.5px;font-weight:700;min-width:0;flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .health-row .bar{flex:1;}
    .health-row .vv{font-size:12px;font-weight:800;flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;}
    /* misc */
    .note{font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
    .statrow{display:flex;gap:10px;flex-wrap:wrap;}
    .stat{flex:1;min-width:80px;background:#faf8f2;border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
    .stat .sl{font-size:11px;color:var(--muted);font-weight:600;}
    .stat .sv{font-size:20px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums;}
    .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);}
    @media(max-width:560px){
      .navbtn .tx{display:none;}
      .navbtn{padding:9px 11px;}
      .navlive .tx{display:none;}
      .wrap{padding:18px 14px 40px;}
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">lan</span></div>
      <div class="bt"><b>NetWatch NMS</b><span>網路監控系統</span></div>
    </div>
    <div class="navwrap" id="nav"></div>
    <div class="navlive"><span class="dot"></span><span class="tx">輪詢中 · 60s</span></div>
  </nav>
  <div class="wrap"><div id="app"></div>
    <div class="foot">網路監控系統（NMS）· 純前端展示原型 · 假資料僅供介面示意 · Jvision Demo</div>
  </div>

  <script>
  "use strict";
  var charts=[];
  function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
  function mk(id,opt){
    var el=document.getElementById(id);
    if(!el)return;
    opt.chart=opt.chart||{};
    opt.chart.redrawOnParentResize=false;
    opt.chart.redrawOnWindowResize=false;
    opt.chart.animations={enabled:false};
    opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
    opt.chart.toolbar={show:false};
    try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
  }
  var ACC="#a16207",ACC2="#eab308";

  var SCREENS=[
    {icon:"monitoring",name:"監控總覽",tx:"總覽",title:"監控總覽",desc:"全網設備可用率、健康度與即時效能指標儀表板"},
    {icon:"account_tree",name:"拓樸圖",tx:"拓樸圖",title:"網路拓樸圖",desc:"自動繪製核心到接取層拓樸，即時標示鏈路與節點狀態"},
    {icon:"trending_up",name:"頻寬流量",tx:"頻寬流量",title:"頻寬流量分析",desc:"上下行流量趨勢、介面使用率與 Top Talkers"},
    {icon:"warning",name:"告警管理",tx:"告警",title:"告警管理",desc:"門檻告警彙整、嚴重度分級與通知網管排除"},
    {icon:"dns",name:"設備納管",tx:"設備",title:"設備納管",desc:"SNMP／ICMP 節點納管、輪詢設定與探索狀態"},
    {icon:"insights",name:"可用率報表",tx:"報表",title:"可用率與 SLA 報表",desc:"網路可用率、MTTR 與 SLA 達成率稽核報表"}
  ];

  /* ---------- data ---------- */
  var HEALTH=[
    {nm:"核心交換器",v:99.8,c:ACC},
    {nm:"分佈層交換",v:99.2,c:ACC2},
    {nm:"防火牆",v:98.6,c:"#0369a1"},
    {nm:"無線 AP",v:96.4,c:"#15803d"},
    {nm:"WAN 路由",v:94.1,c:"#d97706"}
  ];
  var DEVROWS=[
    {name:"CORE-SW-01",ip:"10.0.0.1",type:"核心交換器",loc:"機房 A",poll:"60s",cpu:34,mem:52,st:"up"},
    {name:"CORE-SW-02",ip:"10.0.0.2",type:"核心交換器",loc:"機房 A",poll:"60s",cpu:41,mem:48,st:"up"},
    {name:"DIST-SW-A1",ip:"10.0.1.11",type:"分佈層交換",loc:"廠區一",poll:"120s",cpu:28,mem:39,st:"up"},
    {name:"DIST-SW-B2",ip:"10.0.2.12",type:"分佈層交換",loc:"廠區二",poll:"120s",cpu:88,mem:71,st:"warn"},
    {name:"FW-EDGE-01",ip:"10.0.0.254",type:"防火牆",loc:"機房 A",poll:"60s",cpu:63,mem:66,st:"up"},
    {name:"AP-FLOOR3-07",ip:"10.0.5.37",type:"無線 AP",loc:"三樓辦公",poll:"300s",cpu:0,mem:0,st:"down"},
    {name:"WAN-RT-HQ",ip:"10.0.0.9",type:"WAN 路由",loc:"機房 A",poll:"60s",cpu:57,mem:60,st:"up"},
    {name:"ACC-SW-L2-19",ip:"10.0.3.19",type:"接取交換",loc:"倉儲區",poll:"300s",cpu:22,mem:31,st:"up"}
  ];
  var ALERTS={
    sev1:[
      {t:"AP-FLOOR3-07 無回應",n:"ICMP 逾時 · 節點離線",dev:"10.0.5.37",age:"8 分鐘",rule:"可用性中斷"},
      {t:"DIST-SW-B2 CPU 88%",n:"連續 3 次輪詢超門檻",dev:"10.0.2.12",age:"14 分鐘",rule:"CPU>85%"}
    ],
    sev2:[
      {t:"FW-EDGE-01 連線數偏高",n:"Session 82% 上限",dev:"10.0.0.254",age:"22 分鐘",rule:"容量>80%"},
      {t:"WAN-RT-HQ 延遲上升",n:"RTT 78ms 高於基準",dev:"10.0.0.9",age:"35 分鐘",rule:"延遲>60ms"},
      {t:"Gi0/24 丟包",n:"丟包率 1.9%",dev:"10.0.1.11",age:"41 分鐘",rule:"丟包>1%"}
    ],
    sev3:[
      {t:"AP 韌體版本落後",n:"12 台建議升級",dev:"多節點",age:"2 小時",rule:"組態偏移"},
      {t:"UPS 電池將屆更換",n:"機房 A UPS-2",dev:"10.0.0.240",age:"1 天",rule:"預防維護"}
    ]
  };
  var IFACE=[
    {port:"CORE-SW-01 Te1/1",util:74,inm:6800,outm:5200,err:0,st:"up"},
    {port:"WAN-RT-HQ Gi0/0",util:61,inm:940,outm:1120,err:2,st:"up"},
    {port:"DIST-SW-A1 Gi0/24",util:88,inm:420,outm:380,err:14,st:"warn"},
    {port:"FW-EDGE-01 Po1",util:52,inm:3100,outm:2700,err:0,st:"up"},
    {port:"CORE-SW-02 Te1/2",util:39,inm:2200,outm:1900,err:0,st:"up"}
  ];
  var TALKERS=[
    {ip:"10.0.4.51 檔案伺服器",v:2140},
    {ip:"10.0.4.20 影像備份",v:1680},
    {ip:"10.0.6.12 ERP 主機",v:1120},
    {ip:"10.0.5.88 視訊會議",v:860},
    {ip:"10.0.3.44 MES 終端",v:540}
  ];

  /* ---------- screens ---------- */
  function s0(){return ''
    +grid('g-kpi',[
      kpi("device_hub","納管設備數","248","台","up","arrow_upward","+6 本月新增")
      ,kpi("wifi","網路可用率","99.4","%","up","trending_up","+0.4 vs 上月")
      ,kpi("timer","平均 MTTR","29","分","up","arrow_downward","-11 分改善")
      ,kpi("crisis_alert","未結告警","7","件","down","priority_high","2 件重大")
    ])
    +'<div style="height:15px"></div>'
    +grid('g-2',[
      card("show_chart","全網可用率趨勢","近 12 小時 · 每 5 分鐘輪詢彙整",'<div class="chart-wrap"><div id="c0a"></div></div>')
      ,card("device_thermostat","設備類別健康度","可用率 % · 依設備族群",healthRows())
    ])
    +'<div style="height:15px"></div>'
    +grid('g-3',[
      card("donut_small","設備即時狀態","248 台輪詢結果分佈",'<div class="chart-wrap"><div id="c0b"></div></div>')
      ,card("speed","關鍵鏈路延遲","核心與 WAN 節點 RTT (ms)",'<div class="chart-wrap"><div id="c0c"></div></div>')
      ,statCard()
    ]);
  }
  function s1(){return ''
    +grid('g-topo',[
      card("account_tree","自動拓樸圖","核心 → 分佈 → 接取層即時鏈路狀態",topoSvg())
      ,card("hub","節點摘要","LLDP／SNMP 鄰接偵測",topoSide())
    ]);
  }
  function s2(){return ''
    +grid('g-kpi',[
      kpi("swap_vert","總流量","18.4","Gbps","flat","remove","上下行合計尖峰")
      ,kpi("north_east","上行","8.1","Gbps","up","arrow_upward","+12% 週增")
      ,kpi("south_west","下行","10.3","Gbps","flat","remove","持平")
      ,kpi("error","介面錯誤","16","次","down","arrow_downward","集中於 Gi0/24")
    ])
    +'<div style="height:15px"></div>'
    +grid('g-2',[
      card("area_chart","上下行流量趨勢","近 24 小時 · Mbps",'<div class="chart-wrap"><div id="c2a"></div></div>')
      ,card("leaderboard","Top Talkers","流量前五主機 · MB/5min",'<div class="chart-wrap"><div id="c2b"></div></div>')
    ])
    +'<div style="height:15px"></div>'
    +card("cable","介面使用率明細","埠級頻寬使用率與錯誤統計",ifaceTable());
  }
  function s3(){return ''
    +grid('g-kpi',[
      kpi("crisis_alert","嚴重 P1","2","件","down","priority_high","需立即處理")
      ,kpi("warning","警告 P2","3","件","flat","remove","觀察中")
      ,kpi("info","提示 P3","2","件","flat","remove","可排程處理")
      ,kpi("task_alt","今日已結","19","件","up","arrow_upward","MTTR 29 分")
    ])
    +'<div style="height:15px"></div>'

  function topoSvg(){

        +'<text x="'+x+'" y="'+(y+r+15)+'" text-anchor="middle" font-size="10" fill="#7a7263">'+sub+'</text>';
    }
    function ln(x1,y1,x2,y2,st){
      var col=st==='down'?'#dc2626':(st==='warn'?'#d97706':'#c9c0a8');
      var da=st==='down'?'6 5':'0';
      return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(st==='up'?2:2.5)+'" stroke-dasharray="'+da+'"/>';
    }
    var s='<div class="topo-box"><svg viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet">';
    s+=ln(320,60,320,140,'up');
    s+=ln(320,140,160,220,'up');s+=ln(320,140,480,220,'up');
    s+=ln(160,220,90,310,'up');s+=ln(160,220,240,310,'up');
    s+=ln(480,220,410,310,'warn');s+=ln(480,220,560,310,'down');
    s+=nd(320,60,26,'#0369a1','WAN','WAN-RT-HQ','up');
    s+=nd(320,140,30,ACC,'CORE','核心交換 x2','up');
    s+=nd(160,220,26,ACC2,'D-A1','分佈層 A','up');
    s+=nd(480,220,26,'#d97706','D-B2','分佈層 B','warn');
    s+=nd(90,310,20,'#15803d','ACC','接取 L2','up');
    s+=nd(240,310,20,'#15803d','SRV','伺服器區','up');
    s+=nd(410,310,20,'#15803d','WH','倉儲區','up');
    s+=nd(560,310,20,'#dc2626','AP','AP-07','down');
    s+='</svg></div>';
