<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>土壤與地下水污染防治 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#78c9aa;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#78c9aa;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#d8f6e9;
  --hov:#e0f8ec;
  --track:#cbded8;
  --sidebar:#052e25;
  --sidebar2:#064e3b;
  --side-edge:#000000;
  --ok:#047857;
  --warn:#9a5800;
  --bad:#b91c1c;
  --info:#075985;
  --glow:rgba(5,150,105,.24);
  --r:0px;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(6,78,59,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(6,78,59,.075) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans",sans-serif;font-weight:800;line-height:1.15}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring)!important;outline-offset:3px!important;box-shadow:0 0 0 2px #fff!important}
::selection{background:#fbbf24;color:#052e25}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;top:0;z-index:20;
  display:flex;flex:none;flex-direction:column;
  width:264px;height:100vh;padding:20px 16px;
  overflow:hidden;background:var(--sidebar);color:#ecfdf5;
  border-right:3px solid #000;
}
.sidebar::after{content:"";position:absolute;right:14px;bottom:108px;width:76px;height:76px;border:2px solid #34d399;opacity:.32;transform:rotate(12deg);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 0 22px;border-bottom:2px solid #34d399}
.brand-logo{display:flex;flex:none;align-items:center;justify-content:center;width:46px;height:46px;background:#34d399;color:#000;border:2px solid #000;box-shadow:5px 5px 0 #000}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:16px;font-weight:800;letter-spacing:.03em}
.brand-txt span{display:block;margin-top:3px;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:9px;font-weight:600;letter-spacing:.09em}
.nav{display:flex;flex-direction:column;gap:8px;min-width:0;margin-top:22px}
.nav button{display:flex;align-items:center;gap:11px;min-height:46px;min-width:0;padding:10px 11px;background:transparent;color:#d1fae5;border:1px solid #34d399;text-align:left;font-size:13px;font-weight:600;transition:background-color .16s ease,color .16s ease,transform .16s ease,box-shadow .16s ease}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{background:#065f46;color:#fff;transform:translate(-2px,-2px);box-shadow:3px 3px 0 #000}
.nav button.on{background:#34d399;color:#000;border-color:#000;font-weight:800;box-shadow:5px 5px 0 #000}
.nav .idx{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;opacity:.75}
.side-foot{position:relative;z-index:1;margin-top:auto;padding:14px 2px 0;color:#a7f3d0;border-top:1px solid #34d399;font-family:"Fira Code",monospace;font-size:10px;line-height:1.8}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:27px 30px 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px;padding:0 0 16px;border-bottom:3px solid var(--ink);flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(22px,2.1vw,31px);letter-spacing:-.035em}
.topbar h1 .material-symbols-outlined{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--accent);color:#000;border:2px solid #000;font-size:23px}
.topbar .sub{margin-top:7px;color:var(--muted);font-size:12.5px;font-weight:500}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 11px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid #052e25;animation:pulse 2s steps(2,end) infinite}
.avatar{display:flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;background:#fbbf24;color:#000;border:2px solid #000;font-family:"Fira Code",monospace;font-size:12px;font-weight:800;box-shadow:3px 3px 0 #000}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grid-in{0%{opacity:0;transform:translateY(16px) scale(.94)}70%{transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
#screen>*,#screen>.grid>*{animation:grid-in .4s both cubic-bezier(.34,1.56,.64,1)}
#screen>*:nth-child(2),#screen>.grid>*:nth-child(2){animation-delay:.06s}
#screen>*:nth-child(3),#screen>.grid>*:nth-child(3){animation-delay:.12s}
#screen>*:nth-child(4),#screen>.grid>*:nth-child(4){animation-delay:.18s}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.45fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{min-width:0;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:0;box-shadow:6px 6px 0 rgba(6,78,59,.18)}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-18px -18px 17px;padding:12px 15px;background:var(--th);border-bottom:2px solid var(--ink);flex-wrap:wrap}
.card.pad0 .card-h,.card.p0 .card-h{margin:0;padding:13px 16px!important}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:.015em}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card-h .hint{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:500}
.sec>h3{margin:-18px -18px 15px;padding:12px 15px;background:var(--th);border-bottom:2px solid var(--ink)}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:16px 17px}
.kpi::before,.stat::before,.tile::before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:var(--accent)}
.kpi::after{content:"";position:absolute;right:-23px;top:-23px;width:67px;height:67px;background:var(--accent-soft);border:2px solid var(--ink);transform:rotate(18deg)}
.kpi .ico,.tile .ti{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:39px;height:39px;background:var(--accent-soft);color:var(--ink);border:2px solid var(--ink)}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:11.5px;font-weight:700}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:16px}
.kpi .val,.stat .val,.tile .tv{margin-top:4px;font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11px;font-weight:800}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:17px;overflow:hidden}
.tile b{font-size:13px;font-weight:800}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}
.tile .tv{font-size:22px}
.av,.mini-av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:var(--ink);border:1px solid var(--ink);font-family:"Fira Code",monospace;font-weight:800}
.av{width:27px;height:27px;font-size:10px}
.mini-av{width:19px;height:19px;font-size:8px}
.who{display:inline-flex;align-items:center;gap:6px}

.card.pad0>div[style*="overflow-x"],.card.p0>div[style*="overflow-x"]{border-top:0}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:11px 13px;background:#064e3b;color:#fff;border-right:1px solid #34d399;border-bottom:2px solid #000;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
th:last-child{border-right:0}
td{padding:11px 13px;color:#173e34;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#f1fbf6}
tbody tr:hover{background:#d1fae5}
td:nth-child(n+3){text-align:right}
td .tag{justify-content:center}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:.01em}
table b{font-weight:800;color:#052e25}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:3px 8px;color:#17202a;border:1px solid currentColor;font-size:10.5px;font-weight:800;line-height:1.2;white-space:nowrap}
.tag::before{content:"";display:inline-block;width:6px;height:6px;background:currentColor;border:1px solid currentColor}
.t-ok{background:#d1fae5;color:#065f46}
.t-warn{background:#fff1c2;color:#7c4800}
.t-bad{background:#fee2e2;color:#991b1b}
.t-info{background:#e0f2fe;color:#075985}
.t-gray{background:#eef2f4;color:#475569}
.t-acc,.t-pink{background:#d1fae5;color:#065f46}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:40px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:700;text-align:right}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:2px;width:15px;height:15px;background:#fff;border:4px solid var(--accent)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px;font-weight:800}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--ink);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10.5px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--ink);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:10px;padding:11px;background:var(--th);border:2px solid var(--ink)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 7px;font-size:12px;font-weight:800}
.col-h .cnt{padding:1px 8px;background:#fff;color:var(--muted);border:1px solid var(--ink);font-family:"Fira Code",monospace;font-size:10px}
.pcard{padding:11px;background:#fff;border:1px solid var(--ink);border-left:6px solid var(--accent);box-shadow:3px 3px 0 rgba(6,78,59,.18)}
.pcard b{font-size:12.5px;font-weight:800}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:10.5px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:2px solid var(--ink)}
.lane-row .num{display:flex;align-items:center;justify-content:center;flex:none;width:33px;height:33px;background:var(--accent);color:#000;border:2px solid #000;font-family:"Fira Code",monospace;font-size:12px;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px;font-weight:800}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{display:flex;align-items:center;justify-content:center;z-index:1;width:23px;height:23px;background:#fff;color:var(--muted);border:2px solid var(--line);font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{background:var(--accent);color:#000;border-color:#000}
.steps .s.cur{color:var(--ink);border-color:var(--accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--ink)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px;font-weight:800}
.rep-row .sku span{color:var(--muted);font-size:10.5px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid var(--ink)}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:9.5px;text-align:right}
.band{position:relative;min-width:150px;height:27px;background:var(--track);border:1px solid var(--ink)}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:2px;width:12px;height:21px;background:var(--accent);border:1px solid #000}

.apexcharts-canvas text{font-family:"Fira Code",monospace!important;fill:#475569!important}
.apexcharts-gridline{stroke:#a7d9c7!important;stroke-dasharray:2}
.apexcharts-tooltip{border:2px solid #064e3b!important;border-radius:0!important;box-shadow:4px 4px 0 rgba(6,78,59,.2)!important}
.apexcharts-tooltip-title{background:#d1fae5!important;border-bottom:1px solid #064e3b!important}
.apexcharts-series:nth-child(1) path{stroke:#059669!important}
.apexcharts-series:nth-child(2) path{stroke:#f0a400!important}
.apexcharts-pie-series .apexcharts-series:nth-child(1) path{fill:#064e3b!important}
.apexcharts-pie-series .apexcharts-series:nth-child(2) path{fill:#059669!important}
.apexcharts-pie-series .apexcharts-series:nth-child(3) path{fill:#10b981!important}
.apexcharts-pie-series .apexcharts-series:nth-child(4) path{fill:#34d399!important}
.apexcharts-pie-series .apexcharts-series:nth-child(5) path{fill:#6ee7b7!important}
.apexcharts-pie-series .apexcharts-series:nth-child(6) path{fill:#f0a400!important}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 282px;gap:17px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:2;grid-row:1/span 99;display:flex;flex-direction:column;gap:12px;position:sticky;top:18px;background:transparent;border:0;box-shadow:none}
  #screen>.grid.g4:first-child>*{width:100%}
}
.grid.g4:first-child{gap:12px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:3px solid #000;overflow:visible}
  .sidebar::after,.side-foot{display:none}
  .brand{padding:0 12px 0 0;border:0}
  .brand-logo{width:40px;height:40px;box-shadow:3px 3px 0 #000}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px;margin-top:12px}
  .nav button{flex:1 1 150px;min-height:44px;padding:8px 10px}
  .main{padding:22px 17px 48px}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}.dl{grid-template-columns:1fr;gap:2px}.dl dt{margin-top:9px}}
@media(max-width:560px){
  body{background-size:18px 18px}
  .main{padding:18px 12px 42px}
  .topbar{align-items:stretch;margin-bottom:18px}
  .topbar h1{font-size:20px}
  .top-right{justify-content:flex-start}
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .nav button{flex:1 1 44px;justify-content:center}
  .nav button .txt,.nav .idx{display:none}
  .brand{width:100%}
  .card,.sec{padding:14px}
  .card-h{margin:-14px -14px 14px}
  .sec>h3{margin:-14px -14px 14px}
  .steps{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>*,#screen>.grid>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">landslide</span></div>
      <div class="brand-txt"><b>場址監測台</b><span>SOIL & GROUNDWATER</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">監測井 18 口<br/>列管場址 0 處<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">

var RENDER=[v0,v1,v2,v3];



/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
