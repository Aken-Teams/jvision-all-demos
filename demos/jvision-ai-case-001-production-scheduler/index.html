<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>產線智排中心 · MES｜Jvision 系統 Demo</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --blue:#1e40af; --blue-d:#152c6b; --sky:#3b82f6; --ink:#0f1e46; --body:#3d4a63; --muted:#7688a6; --line:#e2e8f2; --bg:#eef2f9; --green:#16a34a; --amber:#f59e0b; --red:#dc2626; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .shell{ display:grid; grid-template-columns:78px 1fr; min-height:100vh; }
  /* icon rail (navy) */
  .rail{ background:linear-gradient(180deg,var(--blue-d),#0c1b45); display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:5px; position:sticky; top:0; height:100vh; }
  .rail .lg{ width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,var(--sky),var(--blue)); color:#fff; display:grid; place-content:center; margin-bottom:12px; }
  .rail button{ width:60px; padding:9px 4px; border:0; background:none; color:#aec3e8; border-radius:13px; display:flex; flex-direction:column; align-items:center; gap:3px; font:inherit; font-size:10px; font-weight:700; cursor:pointer; }
  .rail button .material-symbols-outlined{ font-size:23px; } .rail button:hover{ background:rgba(255,255,255,.1); color:#fff; } .rail button.on{ background:#fff; color:var(--blue); }
  .rail .sp{ margin-top:auto; }
  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px; }
  .top h1{ margin:0; font-size:19px; font-weight:900; color:var(--ink); } .top .sub{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:14px; } .live{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--green); background:#dcfce7; border-radius:999px; padding:5px 11px; } .live .dot{ width:7px; height:7px; border-radius:50%; background:#16a34a; animation:pulse 2s infinite; } @keyframes pulse{50%{opacity:.3;}}
  .ava{ width:34px; height:34px; border-radius:50%; background:#dbeafe; color:var(--blue); font-weight:800; display:grid; place-content:center; }
  .body{ padding:22px 26px 44px; min-width:0; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--blue); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; } .btn.ghost{ background:#fff; color:var(--blue); border:1px solid var(--line); } .btn .material-symbols-outlined{ font-size:18px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; } .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); } .vh p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:15px; padding:15px 17px; border-left:4px solid var(--blue); } .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--blue); } .kpi .v{ font-size:26px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); } .kpi .d{ font-size:12px; font-weight:800; color:var(--green); margin-top:4px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; } .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--blue); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--blue); cursor:pointer; }
  /* line status cards */
  .lines{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .ln{ background:#f8fafc; border:1px solid var(--line); border-radius:13px; padding:14px; border-top:4px solid var(--green); } .ln.warn{ border-top-color:var(--amber); } .ln.down{ border-top-color:var(--red); }
  .ln-h{ display:flex; align-items:center; justify-content:space-between; } .ln-h b{ color:var(--ink); font-size:14px; } .ln-st{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; } .s-run{ background:#dcfce7; color:#166534; } .s-warn{ background:#fef3c7; color:#92400e; } .s-down{ background:#fee2e2; color:#991b1b; }
  .ln small{ display:block; color:var(--muted); font-size:12px; margin:8px 0 6px; } .ln-bar{ height:7px; border-radius:999px; background:#e2e8f0; overflow:hidden; } .ln-bar span{ display:block; height:100%; } .ln-oee{ display:flex; justify-content:space-between; margin-top:7px; font-size:12px; font-weight:700; color:var(--ink); }
  /* GANTT */
  .gantt{ overflow-x:auto; }
  .gt-head{ display:grid; grid-template-columns:120px repeat(10,1fr); border-bottom:2px solid var(--line); min-width:760px; } .gt-head div{ font-size:11px; font-weight:800; color:var(--muted); padding:6px 4px; text-align:center; } .gt-head div:first-child{ text-align:left; }
  .gt-row{ display:grid; grid-template-columns:120px 1fr; border-bottom:1px solid var(--line); min-width:760px; align-items:center; }
  .gt-lbl{ font-size:13px; font-weight:700; color:var(--ink); padding:12px 4px; }
  .gt-track{ position:relative; height:44px; background:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),#eef2f9 calc(10% - 1px),#eef2f9 10%); }
  .gt-bar{ position:absolute; top:8px; height:28px; border-radius:7px; display:flex; align-items:center; padding:0 8px; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; box-shadow:0 2px 6px rgba(15,30,70,.2); }
  .b-run{ background:linear-gradient(90deg,#1e40af,#3b82f6); } .b-wait{ background:linear-gradient(90deg,#64748b,#94a3b8); } .b-done{ background:linear-gradient(90deg,#059669,#34d399); } .b-late{ background:linear-gradient(90deg,#b91c1c,#ef4444); }
  .gt-now{ position:absolute; top:0; bottom:0; width:2px; background:var(--red); z-index:2; }
  /* table */
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; } .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:#f8fafc; white-space:nowrap; } .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:#f8fafc; }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; } .g-run{ background:#dbeafe; color:#1e40af; } .g-wait{ background:#f1f5f9; color:#64748b; } .g-done{ background:#dcfce7; color:#166534; } .g-late{ background:#fee2e2; color:#991b1b; }
  .pri{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 8px; } .p-h{ background:#fee2e2; color:#dc2626; } .p-m{ background:#fef3c7; color:#b45309; } .p-l{ background:#dbeafe; color:#1e40af; }
  /* alerts */
  .alert{ display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); } .alert:first-of-type{ border-top:0; } .alert-ic{ width:34px; height:34px; border-radius:10px; display:grid; place-content:center; flex:none; } .a-red{ background:#fee2e2; color:#dc2626; } .a-amber{ background:#fef3c7; color:#d97706; } .a-blue{ background:#dbeafe; color:#1e40af; } .alert p{ margin:0; font-size:13px; line-height:1.45; } .alert b{ color:var(--ink); } .alert small{ font-size:11px; color:#94a3b8; }
  .gauges{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; } .gz{ text-align:center; } .gz .g{ height:150px; } .gz b{ font-size:13px; color:var(--ink); }
  .chart{ width:100%; height:270px; }
  @media (max-width:820px){ .body{ padding:16px 14px 30px; } .grid{ grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="top"><div><h1 id="vt">工單管理</h1><div class="sub">東岱工業 · 產線智排中心 · 上午班</div></div><div class="r"><span class="live"><span class="dot"></span>6 條產線運轉中</span><span class="ava">生</span></div></header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MODS=[["assignment","工單"],["calendar_view_week","排程"],["inventory","缺料"],["engineering","報工"],["speed","OEE"],["auto_awesome","AI"]];
const NAMES=["工單管理","智慧排程","缺料與插單","現場報工","設備稼動 OEE","AI 排程建議"];
const DESC=["訂單轉工單、拆併單與派發","依產能、交期、負載與治具自動排程","料況比對、缺料預警與插單重排","派工、報工與進度即時回報","稼動、效率、良率即時監控","瓶頸摘要與替代產線建議"];
const KPI=[["排程作業工時","1.5","小時/日","−81%"],["準時交付率","96","%","+17%"],["插單重排時間","8","分鐘","−82%"],["缺料停線","3","次/月","−75%"]];
const LINES=[["組裝一線","run",82,"MO-001 伺服器滑軌"],["組裝二線","run",90,"MO-002 不鏽鋼閥體"],["沖壓區","warn",64,"MO-005 車用扣件"],["表面處理","run",78,"MO-003 光學底座"],["光學組裝","warn",58,"MO-004 鏡片模組"],["包裝出貨","run",88,"MO-006 成品包裝"]];
const WO=[["MO-001-01","伺服器滑軌 1,500 件","組裝一線","王志明","07/25","high","run",70],["MO-001-02","不鏽鋼閥體 420 件","組裝二線","黃詩涵","07/23","high","run",45],["MO-001-03","車用扣件 3,600 件","沖壓區","李柏翰","07/30","low","wait",0],["MO-001-04","光學底座 760 件","表面處理","陳孟儒","07/26","med","run",30],["MO-001-05","鏡片模組 300 件","光學組裝","吳佳蓉","07/24","high","late",20],["MO-001-06","精密齒輪 2,100 件","組裝一線","張家維","07/28","med","wait",0],["MO-001-07","感測器外殼 900 件","沖壓區","劉建宏","07/27","med","done",100],["MO-001-08","散熱鰭片 5,000 件","表面處理","林怡君","07/29","low","wait",0]];
const GANTT=[
 ["組裝一線",[["MO-001",5,35,"run"],["MO-006",45,30,"wait"]]],
 ["組裝二線",[["MO-002",0,30,"run"],["MO-010",35,25,"wait"],["MO-014",65,25,"wait"]]],
 ["沖壓區",[["MO-005",10,40,"late"],["MO-018",55,20,"wait"]]],
 ["表面處理",[["MO-003",0,25,"done"],["MO-004",28,35,"run"]]],
 ["光學組裝",[["MO-004",20,30,"run"],["MO-021",55,30,"wait"]]],
 ["包裝出貨",[["MO-009",0,20,"done"],["MO-006",40,35,"wait"]]]];
const pcls=p=>p==="high"?"p-h":p==="med"?"p-m":"p-l";
const ptx=p=>p==="high"?"急":p==="med"?"中":"低";
const stx=s=>s==="run"?"生產中":s==="wait"?"待排程":s==="late"?"逾期":"已完成";
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l"><span class="material-symbols-outlined">monitoring</span>${k[0]}</div><div class="v">${k[1]}<small>${k[2]}</small></div><div class="d">${k[3]}</div></div>`).join("")}</div>`;
const lineCards=()=>`<div class="lines">${LINES.map(l=>{const cls=l[1]==="down"?"down":l[1]==="warn"?"warn":"";const st=l[1]==="down"?"s-down":l[1]==="warn"?"s-warn":"s-run";const bar=l[1]==="down"?"#dc2626":l[1]==="warn"?"#f59e0b":"#16a34a";return `<div class="ln ${cls}"><div class="ln-h"><b>${l[0]}</b><span class="ln-st ${st}">${l[1]==="run"?"運轉":l[1]==="warn"?"注意":"停機"}</span></div><small>${l[3]}</small><div class="ln-bar"><span style="width:${l[2]}%;background:${bar};"></span></div><div class="ln-oee"><span>OEE</span><span>${l[2]}%</span></div></div>`;}).join("")}</div>`;
function ganttHtml(){
  const heads=Array.from({length:10},(_,i)=>`<div>${8+i}:00</div>`).join("");
  return `<div class="gantt"><div class="gt-head"><div>產線 \\ 時間</div>${heads}</div>${GANTT.map(r=>`<div class="gt-row"><div class="gt-lbl">${r[0]}</div><div class="gt-track"><div class="gt-now" style="left:42%;"></div>${r[1].map(b=>`<div class="gt-bar b-${b[3]}" style="left:${b[1]}%;width:${b[2]}%;">${b[0]}</div>`).join("")}</div></div>`).join("")}</div>`;
}
const SCREENS={
 0:()=>kpiRow()+`<div class="grid" style="grid-template-columns:1fr;"><div class="card"><h3><span class="material-symbols-outlined">precision_manufacturing</span>產線即時狀態<span class="grow">全部 6 條 ›</span></h3>${lineCards()}</div></div><div class="card" style="margin-top:18px;"><h3><span class="material-symbols-outlined">assignment</span>今日工單</h3><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>優先</th><th>工單號</th><th>品項</th><th>產線</th><th>負責人</th><th>交期</th><th>狀態</th><th>進度</th></tr></thead><tbody>${WO.map(w=>`<tr><td><span class="pri ${pcls(w[5])}">${ptx(w[5])}</span></td><td style="font-weight:800;color:var(--ink);">${w[0]}</td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td><td>${w[4]}</td><td><span class="tag g-${w[6]}">${stx(w[6])}</span></td><td style="min-width:90px;"><div class="ln-bar"><span style="width:${w[7]}%;background:var(--blue);"></span></div></td></tr>`).join("")}</tbody></table></div></div>`,
 1:()=>`<div class="card"><h3><span class="material-symbols-outlined">calendar_view_week</span>今日排程甘特圖<span class="grow" style="color:var(--muted);font-weight:600;">■ 生產中 ■ 待排 ■ 完成 ■ 逾期</span></h3>${ganttHtml()}</div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:18px;"><div class="card"><h3><span class="material-symbols-outlined">tune</span>排程參數</h3><div style="font-size:13px;line-height:2;color:var(--body);">交期權重　<b style="color:var(--ink);">高</b>　·　產能負載上限　<b style="color:var(--ink);">85%</b><br/>治具衝突檢查　<b style="color:var(--green);">啟用</b>　·　換線時間　<b style="color:var(--ink);">20 分</b><br/>插單處理　<b style="color:var(--ink);">自動重排</b>　·　外包門檻　<b style="color:var(--ink);">負載 90%</b></div><button class="btn" style="margin-top:12px;"><span class="material-symbols-outlined">auto_awesome</span>重新自動排程</button></div><div class="card"><h3><span class="material-symbols-outlined">rule</span>排程規則</h3><div class="alert"><span class="alert-ic a-blue">1</span><p><b>承諾交期優先：</b>期限內且未生產者優先排入。</p></div><div class="alert"><span class="alert-ic a-amber">2</span><p><b>缺料不排產：</b>缺料工單在到料確認前不得排入。</p></div><div class="alert"><span class="alert-ic a-red">3</span><p><b>負載上限：</b>設備負載超過 85% 時改排其他產線或委外。</p></div></div></div>`,
 2:()=>`<div class="grid" style="grid-template-columns:1.4fr 1fr;"><div class="card" style="padding:0;"><div style="padding:16px 20px 0;"><h3><span class="material-symbols-outlined">inventory</span>缺料與待到料</h3></div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>料號</th><th>品名</th><th>需求</th><th>庫存</th><th>缺口</th><th>到料</th></tr></thead><tbody>${[["P-2201","伺服滑軌組","1,500","1,180","-320","07/24"],["P-3310","不鏽鋼閥芯","420","420","0","足量"],["P-1180","光學鏡片","300","90","-210","07/25"],["P-4402","車用扣件胚","3,600","4,200","0","足量"],["P-5501","散熱鰭片料","5,000","1,200","-3,800","07/28"]].map(r=>`<tr><td style="font-weight:800;color:var(--ink);">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td style="color:${r[4]==="0"?"var(--green)":"var(--red)"};font-weight:800;">${r[4]==="0"?"充足":r[4]}</td><td>${r[5]}</td></tr>`).join("")}</tbody></table></div></div><div class="card"><h3><span class="material-symbols-outlined">bolt</span>插單重排</h3><div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:13px;margin-bottom:10px;font-size:13px;"><b style="color:#dc2626;">插單 · 急件</b>　客戶 A 加急 500 件伺服滑軌，與 MO-001 共用治具，系統建議改排組裝二線並延後 MO-006。</div><button class="btn ghost" style="width:100%;justify-content:center;">套用建議並重排</button><div class="alert" style="margin-top:8px;"><span class="alert-ic a-amber"><span class="material-symbols-outlined">warning</span></span><p><b>光學鏡片缺料</b>將於 07/25 到料，MO-004 暫緩排產。</p></div></div></div>`,
 3:()=>`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));">${LINES.map(l=>`<div class="card"><h3 style="margin-bottom:8px;">${l[0]} <span class="ln-st ${l[1]==="warn"?"s-warn":"s-run"}" style="margin-left:auto;">${l[1]==="warn"?"注意":"運轉"}</span></h3><div style="font-size:13px;color:var(--body);line-height:1.9;">目前工單　<b style="color:var(--ink);">${l[3]}</b><br/>已完成 / 目標　<b style="color:var(--ink);">${Math.round(l[2]*12)} / ${1200}</b> 件<br/>本班產出　<b style="color:var(--blue);">${l[2]}%</b></div><div class="ln-bar" style="margin:10px 0;"><span style="width:${l[2]}%;background:var(--blue);"></span></div><div style="display:flex;gap:8px;"><button class="btn" style="height:32px;font-size:12px;flex:1;justify-content:center;">報工</button><button class="btn ghost" style="height:32px;font-size:12px;flex:1;justify-content:center;">回報異常</button></div></div>`).join("")}</div>`,
 4:()=>kpiRow()+`<div class="card" style="margin-bottom:18px;"><h3><span class="material-symbols-outlined">speed</span>整廠 OEE 三要素</h3><div class="gauges"><div class="gz"><div id="gA" class="g"></div><b>稼動率</b></div><div class="gz"><div id="gP" class="g"></div><b>效率</b></div><div class="gz"><div id="gQ" class="g"></div><b>良率</b></div><div class="gz"><div id="gO" class="g"></div><b>綜合 OEE</b></div></div></div><div class="grid" style="grid-template-columns:1.4fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">show_chart</span>各產線稼動率</h3><div id="cL" class="chart"></div></div><div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>停機原因 Pareto</h3><div id="cP" class="chart"></div></div></div>`,

let charts=[];
function draw(i){charts.forEach(c=>{try{c.dispose();}catch(e){}});charts=[];if(!window.echarts||i!==4)return;
 const g=(id,v,c2)=>{const el=document.getElementById(id);if(!el)return;const c=echarts.init(el);c.setOption({series:[{type:"gauge",radius:"96%",center:["50%","60%"],startAngle:210,endAngle:-30,min:0,max:100,progress:{show:true,width:12,itemStyle:{color:c2}},axisLine:{lineStyle:{width:12,color:[[1,"#eef2f9"]]}},pointer:{show:false},axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},detail:{valueAnimation:true,formatter:"{value}%",fontSize:24,fontWeight:"bolder",offsetCenter:[0,0],color:"#0f1e46"},data:[{value:v}]}]});charts.push(c);};
 g("gA",89,"#1e40af");g("gP",84,"#3b82f6");g("gQ",97,"#16a34a");g("gO",73,"#7c3aed");
 const l=document.getElementById("cL");if(l){const c=echarts.init(l);c.setOption({grid:{left:6,right:16,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["組一","組二","沖壓","表處","光學","包裝"],axisLabel:{color:"#7688a6"}},yAxis:{type:"value",max:100,splitLine:{lineStyle:{color:"#eef2f9"}},axisLabel:{color:"#7688a6"}},series:[{type:"bar",data:[82,90,64,78,58,88],itemStyle:{color:"#1e40af",borderRadius:[6,6,0,0]}}]});charts.push(c);}
 const p=document.getElementById("cP");if(p){const c=echarts.init(p);c.setOption({grid:{left:6,right:16,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["換模","缺料","故障","待工","品質"],axisLabel:{color:"#7688a6"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef2f9"}},axisLabel:{color:"#7688a6"}},series:[{type:"bar",data:[42,30,15,8,5],itemStyle:{color:"#f59e0b",borderRadius:[6,6,0,0]}}]});charts.push(c);}
}
const rail=document.getElementById("rail"),view=document.getElementById("view"),vt=document.getElementById("vt");
rail.innerHTML=`<div class="lg"><span class="material-symbols-outlined">factory</span></div>`+MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}</button>`).join("")+`<div class="sp"></div><button><span class="material-symbols-outlined">settings</span>設定</button>`;
function show(i){rail.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));vt.textContent=NAMES[i];view.innerHTML=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${DESC[i]}</p></div>${i===0?'<button class="btn"><span class="material-symbols-outlined">add</span>新增工單</button>':''}</div>`+SCREENS[i]();draw(i);}
rail.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
show(0);
