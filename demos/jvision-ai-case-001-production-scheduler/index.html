<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>產線智排中心 · MES｜Jvision 系統 Demo</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --green:#15803D;
  --amber:#A16207;
  --red:#DC2626;
  --grid:rgba(37,99,235,.075);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  font-family:"Fira Sans","Microsoft JhengHei",sans-serif;
  color:var(--color-foreground);
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;z-index:30;
  display:flex;flex-direction:column;
  background:#0F172A;color:#fff;
  border-right:3px solid var(--ink);
}
.brand{
  min-height:116px;padding:20px 18px;
  border-bottom:3px solid #fff;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--color-primary);
}
.brand-mark{
  width:44px;height:44px;display:grid;place-items:center;
  color:#fff;border:2px solid #fff;background:#0F172A;
  box-shadow:5px 5px 0 var(--color-accent);
}
.brand-mark .material-symbols-outlined{font-size:27px}
.brand b{font-size:16px;line-height:1.15;letter-spacing:.02em}
.brand small{
  margin-top:5px;color:#DBEAFE;font-family:"Fira Code",monospace;
  font-size:10px;font-weight:600;letter-spacing:.08em;
}
.nav-label{
  padding:17px 16px 8px;color:#94A3B8;
  font:600 10px/1 "Fira Code",monospace;letter-spacing:.14em;
}
.rail-nav{display:flex;flex-direction:column;padding:0 10px;gap:5px}
.rail button{
  width:100%;min-height:48px;padding:8px 10px;
  border:2px solid transparent;background:transparent;color:#CBD5E1;
  display:flex;align-items:center;gap:11px;text-align:left;
  font-weight:700;font-size:13px;
}
.rail button .material-symbols-outlined{font-size:21px}
.rail button:hover{border-color:#64748B;color:#fff;background:#1E293B}
.rail button.on{
  color:#000;background:#fff;border-color:#fff;
  box-shadow:5px 5px 0 var(--color-accent);
}
.rail button.on .material-symbols-outlined{color:var(--color-primary)}
.rail-foot{margin-top:auto;padding:12px 10px 18px;border-top:1px solid #334155}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:20;min-height:76px;
  padding:12px 28px;display:flex;align-items:center;gap:18px;
  background:rgba(248,250,252,.97);
  border-bottom:3px solid var(--ink);
}
.top h1{margin:0;color:var(--ink);font-size:20px;font-weight:900;letter-spacing:-.02em}
.top .sub{margin-top:3px;color:var(--muted);font-size:11px;font-family:"Fira Code",monospace}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.live{
  display:inline-flex;align-items:center;gap:8px;padding:7px 10px;
  color:#14532D;background:#DCFCE7;border:2px solid #15803D;
  font-size:11px;font-weight:800;
}
.live .dot{
  width:8px;height:8px;background:#15803D;border:2px solid #14532D;
  animation:pulse 2s steps(2,end) infinite;
}
.ava{
  width:38px;height:38px;display:grid;place-items:center;
  color:#fff;background:var(--color-primary);border:2px solid var(--ink);
  font-family:"Fira Code",monospace;font-weight:800;
  box-shadow:3px 3px 0 var(--ink);
}
.body{width:100%;max-width:1680px;margin:0 auto;padding:26px 28px 56px}
.vh{
  position:relative;display:flex;align-items:flex-end;justify-content:space-between;
  gap:18px;margin-bottom:22px;padding:21px 22px;
  color:#fff;background:var(--ink);border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--color-primary);
}
.vh:before{
  content:"LIVE OPERATIONS";position:absolute;right:18px;top:-11px;
  padding:4px 8px;color:#000;background:var(--color-accent);
  border:2px solid var(--ink);font:700 9px/1 "Fira Code",monospace;
  letter-spacing:.12em;
}
.vh h2{margin:0;font-size:clamp(24px,3vw,38px);font-weight:900;letter-spacing:-.045em}
.vh p{margin:6px 0 0;color:#CBD5E1;font-size:13px}
.btn{
  min-height:42px;padding:8px 15px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:3px solid var(--ink);color:var(--color-on-primary);
  background:var(--color-primary);font-size:13px;font-weight:800;
  box-shadow:4px 4px 0 var(--ink);
}
.btn:hover{background:#1D4ED8;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--color-muted)}
.btn.accent{background:var(--color-accent);color:#000}
.btn.accent:hover{background:#C2410C;color:#fff}
.btn .material-symbols-outlined{font-size:19px}
button:focus-visible,.grow:focus-visible{
  outline:4px solid var(--color-ring);outline-offset:3px;
}
.kpis{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;margin-bottom:20px;
}
.kpi{
  position:relative;overflow:hidden;min-height:142px;padding:17px;
  background:var(--color-card);border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi:after{
  content:"";position:absolute;right:-18px;bottom:-24px;width:80px;height:80px;
  background:var(--color-muted);border:3px solid var(--ink);transform:rotate(20deg);
}
.kpi .l{
  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  color:var(--muted);font-size:11px;font-weight:700;
}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .v{
  position:relative;z-index:1;margin-top:13px;color:var(--ink);
  font:800 30px/1 "Fira Code",monospace;letter-spacing:-.05em;
}
.kpi .v small{margin-left:4px;color:var(--muted);font:600 11px/1 "Fira Sans",sans-serif}
.kpi .d{
  position:relative;z-index:1;margin-top:11px;color:#166534;
  font:700 11px/1 "Fira Code",monospace;
}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.card{
  min-width:0;padding:19px;background:var(--color-card);
  border:3px solid var(--ink);box-shadow:6px 6px 0 #94A3B8;
}
.card>h3,.card .section-head h3{
  margin:0 0 16px;color:var(--ink);display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:900;letter-spacing:-.015em;
}
.card>h3 .material-symbols-outlined,.card .section-head .material-symbols-outlined{
  width:29px;height:29px;display:grid;place-items:center;
  color:#fff;background:var(--color-primary);border:2px solid var(--ink);
  font-size:18px;
}
.grow{
  margin-left:auto;padding:4px;border:0;background:transparent;color:var(--color-primary);
  font-size:11px;font-weight:800;cursor:pointer;
}
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ln{
  padding:13px;background:#fff;border:2px solid var(--ink);
  border-left:8px solid var(--green);
}
.ln.warn{border-left-color:var(--amber);background:#FFFBEB}
.ln.down{border-left-color:var(--red);background:#FEF2F2}
.ln-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ln-h b{color:var(--ink);font-size:13px}
.ln-st,.tag,.pri{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
  border:1px solid currentColor;font-size:10px;font-weight:800;white-space:nowrap;
}
.ln-st:before,.tag:before,.pri:before{content:"";width:6px;height:6px;background:currentColor}
.s-run{background:#DCFCE7;color:#166534}
.s-warn{background:#FEF3C7;color:#854D0E}
.s-down{background:#FEE2E2;color:#991B1B}
.ln small{display:block;margin:9px 0 7px;color:var(--muted);font-size:11px}
.ln-bar{height:9px;overflow:hidden;background:#E2E8F0;border:1px solid #94A3B8}
.ln-bar span{display:block;height:100%}
.ln-oee{
  display:flex;justify-content:space-between;margin-top:7px;color:var(--ink);
  font:700 11px/1 "Fira Code",monospace;
}
.table-wrap,.gantt{overflow-x:auto;overscroll-behavior-inline:contain}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:11px 12px;text-align:left;white-space:nowrap;
  color:#fff;background:var(--ink);border:1px solid #475569;
  font:700 10px/1.2 "Fira Code",monospace;letter-spacing:.05em;
}
.tbl td{
  padding:11px 12px;white-space:nowrap;border:1px solid var(--line);
  background:#fff;
}
.tbl tbody tr:nth-child(even) td{background:#F8FAFC}
.tbl tbody tr:hover td{background:#DBEAFE}
.tbl td:nth-child(n+6){font-variant-numeric:tabular-nums}
.tbl th:last-child,.tbl td:last-child{text-align:right}
.code{
  color:var(--ink);font-family:"Fira Code",monospace;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.num{text-align:right!important;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.g-run{background:#DBEAFE;color:#1E40AF}
.g-wait{background:#F1F5F9;color:#475569}
.g-done{background:#DCFCE7;color:#166534}
.g-late{background:#FEE2E2;color:#991B1B}
.p-h{background:#FEE2E2;color:#991B1B}
.p-m{background:#FEF3C7;color:#854D0E}
.p-l{background:#DBEAFE;color:#1E40AF}
.gantt{border:2px solid var(--ink)}
.gt-head{
  min-width:780px;display:grid;grid-template-columns:122px repeat(10,1fr);
  color:#fff;background:var(--ink);border-bottom:2px solid var(--ink);
}
.gt-head div{
  padding:8px 4px;text-align:center;border-left:1px solid #475569;
  font:700 10px/1 "Fira Code",monospace;
}
.gt-head div:first-child{text-align:left;border-left:0}
.gt-row{
  min-width:780px;display:grid;grid-template-columns:122px 1fr;
  align-items:center;border-bottom:1px solid var(--line);
}
.gt-row:last-child{border-bottom:0}
.gt-lbl{
  align-self:stretch;display:flex;align-items:center;padding:10px;
  color:var(--ink);background:var(--color-muted);
  border-right:2px solid var(--ink);font-size:11px;font-weight:800;
}
.gt-track{
  position:relative;height:46px;
  background:repeating-linear-gradient(90deg,#fff,#fff calc(10% - 1px),#CBD5E1 calc(10% - 1px),#CBD5E1 10%);
}
.gt-bar{
  position:absolute;top:8px;height:29px;padding:0 7px;
  display:flex;align-items:center;overflow:hidden;white-space:nowrap;
  color:#fff;border:2px solid var(--ink);
  font:700 10px/1 "Fira Code",monospace;
}
.b-run{background:#2563EB}
.b-wait{background:#64748B}
.b-done{background:#15803D}
.b-late{background:#DC2626}
.gt-now{position:absolute;top:0;bottom:0;width:3px;background:#DC2626;z-index:2}
.gt-now:before{
  content:"NOW";position:absolute;top:0;left:3px;padding:2px 3px;
  color:#fff;background:#DC2626;font:700 8px/1 "Fira Code",monospace;
}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-left:auto;color:var(--muted);font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border:1px solid var(--ink)}
.alert{
  display:flex;gap:11px;padding:13px 0;border-top:2px solid var(--line);
}
.alert:first-of-type{border-top:0}
.alert-ic{
  width:36px;height:36px;display:grid;place-items:center;flex:none;
  border:2px solid var(--ink);font:800 12px/1 "Fira Code",monospace;
}
.alert-ic .material-symbols-outlined{font-size:19px}
.a-red{color:#991B1B;background:#FEE2E2}
.a-amber{color:#854D0E;background:#FEF3C7}
.a-blue{color:#1E40AF;background:#DBEAFE}
.alert p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.alert b{color:var(--ink)}
.notice{
  margin-bottom:12px;padding:13px;color:#7F1D1D;background:#FEF2F2;
  border:2px solid #DC2626;border-left-width:8px;font-size:12px;line-height:1.55;
}
.notice b{color:#991B1B}
.params{color:var(--muted);font-size:12px;line-height:2}
.params b{color:var(--ink)}
.params .ok{color:#166534}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}
.gz{text-align:center;border:2px solid var(--line);background:#F8FAFC}
.gz .g{height:150px}
.gz b{display:block;padding:0 8px 12px;color:var(--ink);font-size:12px}
.chart{width:100%;height:270px}
.ai-best td{background:#EFF6FF!important;border-top:3px solid var(--color-primary);border-bottom:3px solid var(--color-primary)}
.ai-note{
  margin-top:13px;padding:12px;color:var(--muted);background:var(--color-muted);
  border-left:6px solid var(--color-primary);font-size:11px;line-height:1.65;
}
.mobile-brand{display:none}
@keyframes pulse{50%{opacity:.35}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view-enter>.vh,.view-enter>.kpis,.view-enter>.card,.view-enter>.grid{
  animation:reveal .35s ease-out both;
}
.view-enter>.kpis{animation-delay:.04s}
.view-enter>.card,.view-enter>.grid{animation-delay:.08s}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
  .view-enter>.vh,.view-enter>.kpis,.view-enter>.card,.view-enter>.grid{
    opacity:1!important;transform:none!important;
  }
}
@media (max-width:1100px){
  .shell{grid-template-columns:82px minmax(0,1fr)}
  .brand{padding:16px;align-items:center}
  .brand b,.brand small,.nav-label,.rail button .nav-text{display:none}
  .rail-nav{padding:0 9px}
  .rail button{justify-content:center;padding:9px}
  .rail button.on{box-shadow:3px 3px 0 var(--color-accent)}
  .lines{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .top{padding:11px 14px}
  .top .sub{display:none}
  .body{padding:18px 14px 92px}
  .grid{grid-template-columns:1fr!important}
  .gauges{grid-template-columns:repeat(2,minmax(120px,1fr))}
  .vh{align-items:flex-start;padding:18px}
}
@media (max-width:600px){
  .shell{display:block}
  .rail{
    position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:72px;
    border:0;border-top:3px solid var(--ink);background:#0F172A;
  }
  .brand,.nav-label,.rail-foot{display:none}
  .rail-nav{
    height:100%;display:grid;grid-template-columns:repeat(6,1fr);
    padding:6px;gap:3px;
  }
  .rail button{min-width:0;min-height:54px;flex-direction:column;gap:3px;font-size:9px}
  .rail button .nav-text{display:block}
  .rail button .material-symbols-outlined{font-size:19px}
  .rail button.on{box-shadow:none}
  .top{min-height:64px}
  .top h1{font-size:16px}
  .live{padding:6px;font-size:0}
  .live:after{content:"即時";font-size:10px}
  .ava{width:34px;height:34px}
  .vh{display:block;margin-bottom:18px;box-shadow:5px 5px 0 var(--color-primary)}
  .vh h2{font-size:27px}
  .vh .btn{width:100%;margin-top:15px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{min-height:125px;padding:13px;box-shadow:3px 3px 0 var(--ink)}
  .kpi:nth-child(2n){transform:none}
  .kpi .v{font-size:24px}
  .lines{grid-template-columns:1fr}
  .card{padding:14px;box-shadow:4px 4px 0 #94A3B8}
  .legend{width:100%;margin:4px 0 0}
}
@media (max-width:390px){
  .body{padding-left:10px;padding-right:10px}
  .kpis{grid-template-columns:1fr}
  .gauges{grid-template-columns:1fr 1fr}
  .top .r{gap:6px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="主要導覽">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span class="material-symbols-outlined">factory</span></div>
      <div><b>工廠產線<br />自動排程中心</b><small>OPS / 06 LINES</small></div>
    </div>
    <div class="nav-label">CONTROL MODULES</div>
    <nav class="rail-nav" id="rail"></nav>
    <div class="rail-foot">
      <button type="button"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span class="nav-text">系統設定</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="vt">工單管理</h1>
        <div class="sub">東岱工業 / 產線智排中心 / 上午班</div>
      </div>
      <div class="r">
        <span class="live"><span class="dot" aria-hidden="true"></span>6 條產線運轉中</span>
        <span class="ava" aria-label="生產管理員">生</span>
      </div>
    </header>
    <div class="body view-enter" id="view"></div>
  </main>
</div>

<script>
const MODS=[
  ["assignment","工單"],
  ["calendar_view_week","排程"],
  ["inventory","缺料"],
  ["engineering","報工"],
  ["speed","OEE"],
  ["auto_awesome","AI"]
];
const NAMES=["工單管理","智慧排程","缺料與插單","現場報工","設備稼動 OEE","AI 排程建議"];
const DESC=[
  "訂單轉工單、拆併單與派發",
  "依產能、交期、負載與治具自動排程",
  "料況比對、缺料預警與插單重排",
  "派工、報工與進度即時回報",
  "稼動、效率、良率即時監控",
  "瓶頸摘要與替代產線建議"
];
const KPI=[
  ["排程作業工時","1.5","小時/日","−81%"],
  ["準時交付率","96","%","+17%"],
  ["插單重排時間","8","分鐘","−82%"],
  ["缺料停線","3","次/月","−75%"]
];
const LINES=[
  ["組裝一線","run",82,"MO-001 伺服器滑軌"],
  ["組裝二線","run",90,"MO-002 不鏽鋼閥體"],
  ["沖壓區","warn",64,"MO-005 車用扣件"],
  ["表面處理","run",78,"MO-003 光學底座"],
  ["光學組裝","warn",58,"MO-004 鏡片模組"],
  ["包裝出貨","run",88,"MO-006 成品包裝"]
];
const WO=[

function draw(i){
  charts.forEach(c=>{try{c.dispose()}catch(error){}});
  charts=[];
  if(!window.echarts||i!==4)return;

  const gauge=(id,value,color)=>{
    const el=document.getElementById(id);
    if(!el)return;
    const chart=echarts.init(el);
    chart.setOption({
      animation:!window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      series:[{
        type:"gauge",
        radius:"94%",
        center:["50%","61%"],
        startAngle:210,
        endAngle:-30,
        min:0,
        max:100,
        progress:{show:true,width:13,itemStyle:{color}},
        axisLine:{lineStyle:{width:13,color:[[1,"#CBD5E1"]]}},
        pointer:{show:false},
        axisTick:{show:false},
        splitLine:{show:false},
        axisLabel:{show:false},
        detail:{
          valueAnimation:false,
          formatter:"{value}%",
          fontFamily:"Fira Code",
          fontSize:23,
          fontWeight:700,
          offsetCenter:[0,0],
          color:"#1E293B"
        },
        data:[{value}]
      }]
    });
    charts.push(chart);
  };

  gauge("gA",89,"#2563EB");
  gauge("gP",84,"#3B82F6");
  gauge("gQ",97,"#15803D");
  gauge("gO",73,"#EA580C");

  const common={
    animation:!window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    textStyle:{fontFamily:"Fira Sans",color:"#1E293B"},
    grid:{left:8,right:16,top:20,bottom:8,containLabel:true},
    tooltip:{trigger:"axis",backgroundColor:"#0F172A",borderColor:"#0F172A",textStyle:{color:"#FFFFFF"}},
    yAxis:{
      type:"value",
      axisLabel:{color:"#475569",fontFamily:"Fira Code"},
      splitLine:{lineStyle:{color:"#CBD5E1",type:"dashed"}}
    }
  };

  const lineEl=document.getElementById("cL");
  if(lineEl){
    const chart=echarts.init(lineEl);
    chart.setOption({
      ...common,
      xAxis:{
        type:"category",
        data:["組一","組二","沖壓","表處","光學","包裝"],
        axisLabel:{color:"#475569"},
        axisLine:{lineStyle:{color:"#1E293B"}}
      },
      yAxis:{...common.yAxis,max:100},
      series:[{
        type:"bar",
        data:[82,90,64,78,58,88],
        barMaxWidth:34,
        itemStyle:{color:"#2563EB",borderColor:"#1E293B",borderWidth:2},
        label:{show:true,position:"top",formatter:"{c}%",color:"#1E293B",fontFamily:"Fira Code",fontWeight:700}
      }]
    });
    charts.push(chart);
  }

  const paretoEl=document.getElementById("cP");
  if(paretoEl){
    const chart=echarts.init(paretoEl);
    chart.setOption({
      ...common,
      xAxis:{
        type:"category",
        data:["換模","缺料","故障","待工","品質"],
        axisLabel:{color:"#475569"},
        axisLine:{lineStyle:{color:"#1E293B"}}
      },
      series:[{
        type:"bar",
        data:[42,30,15,8,5],
        barMaxWidth:34,
        itemStyle:{color:"#EA580C",borderColor:"#1E293B",borderWidth:2},
        label:{show:true,position:"top",color:"#1E293B",fontFamily:"Fira Code",fontWeight:700}
      }]
    });
    charts.push(chart);
  }
}

function show(i){
  const safe=Math.max(0,Math.min(Number(i)||0,5));
  currentView=safe;
  rail.querySelectorAll("button[data-i]").forEach(button=>{
    const active=Number(button.dataset.i)===safe;
    button.classList.toggle("on",active);
    button.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=NAMES[safe];
  view.classList.remove("view-enter");
  view.innerHTML=`
    <section class="vh">
      <div><h2>${NAMES[safe]}</h2><p>${DESC[safe]}</p></div>
      ${safe===0?`
        <button class="btn accent" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">add</span>新增工單
        </button>`:""}
    </section>
    ${SCREENS[safe]()}`;
  void view.offsetWidth;
  view.classList.add("view-enter");
  document.title=`${NAMES[safe]} · 產線智排中心｜Jvision 系統 Demo`;
  draw(safe);
}

function hashIndex(){
  const match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  return match?Math.min(Number(match[1]),5):0;
}

function fromHash(){
  show(hashIndex());
  try{window.scrollTo(0,0)}catch(error){}
}

rail.addEventListener("click",event=>{
  const button=event.target.closest("button[data-i]");
  if(!button)return;
  const index=Number(button.dataset.i);
  const nextHash=`#v${index}`;
  if(location.hash===nextHash)show(index);
  else location.hash=nextHash;
});

window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>charts.forEach(chart=>chart.resize()));
fromHash();
