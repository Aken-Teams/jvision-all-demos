<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>集團合併報表管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;--bg:#f4f5fb;--panel:#ffffff;
  --ink:#1e2140;--muted:#6b7089;--line:#e6e7f2;--soft:#eef0fb;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.top{background:linear-gradient(120deg,#4f46e5,#6366f1);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:26px;}
.brand h1{font-size:18px;margin:0;font-weight:700;line-height:1.2;}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85;}
.top .spacer{flex:1;}
.top .env{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:5px;}
.chip .material-symbols-outlined{font-size:15px;}
nav{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.navbtn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:8px 13px;font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;min-width:0;transition:.15s;}
.navbtn .material-symbols-outlined{font-size:18px;}
.navbtn:hover{border-color:var(--accent2);color:var(--accent);}
.navbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28);}
.navidx{font-size:11px;font-weight:700;opacity:.6;}
.navbtn.on .navidx{opacity:.9;}
main{padding:18px;flex:1;}
.screen-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.screen-head .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.screen-head h2{margin:0;font-size:19px;}
.screen-head p{margin:2px 0 0;font-size:13px;color:var(--muted);}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0;}
.pane-h{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.pane-h .material-symbols-outlined{font-size:18px;color:var(--accent);}
.pane-b{padding:14px 15px;}
.litem{padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:.15s;background:#fff;}
.litem:hover{border-color:var(--accent2);}
.litem.sel{border-color:var(--accent);background:var(--soft);box-shadow:inset 3px 0 0 var(--accent);}
.litem .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.litem .nm{font-weight:600;font-size:13.5px;min-width:0;}
.litem .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0;}
.kcard .kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kcard .kl .material-symbols-outlined{font-size:16px;color:var(--accent);}
.kcard .kv{font-size:23px;font-weight:700;margin-top:7px;}
.kcard .kd{font-size:11.5px;margin-top:4px;}
.up{color:var(--ok);}.down{color:var(--bad);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;padding:9px 11px;background:var(--soft);color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;}
td{padding:9px 11px;border-top:1px solid var(--line);white-space:nowrap;}
tr:hover td{background:#fafbff;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0e7ff;color:#4338ca;}
.chartwrap{position:relative;height:260px;width:100%;overflow:hidden;}
.chartwrap.sm{height:200px;}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.dcell{background:var(--soft);border-radius:10px;padding:11px;min-width:0;}
.dcell .l{font-size:11.5px;color:var(--muted);}
.dcell .v{font-size:16px;font-weight:700;margin-top:3px;}
.sub-h{font-size:13px;font-weight:600;margin:16px 0 9px;color:var(--ink);display:flex;align-items:center;gap:7px;}
.sub-h .material-symbols-outlined{font-size:17px;color:var(--accent);}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;min-width:640px;}
.bcol{background:var(--soft);border-radius:12px;padding:9px;min-width:0;}
.bcol-h{font-size:12.5px;font-weight:700;padding:4px 6px 9px;display:flex;justify-content:space-between;color:var(--muted);}
.bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;font-size:12px;}
.bcard .t{font-weight:600;margin-bottom:5px;}
.bcard .m{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;margin-bottom:15px;}
.tli:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tli.done:before{background:var(--accent);}
.tli .tt{font-weight:600;font-size:13.5px;}
.tli .td{font-size:12px;color:var(--muted);margin-top:3px;}
.tli .tm{font-size:11px;color:var(--accent);margin-top:3px;font-weight:600;}
.pill{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mini{font-size:11.5px;color:var(--muted);}
.rate{font-weight:700;}
@media(max-width:820px){
  .split{grid-template-columns:1fr;}
  .kgrid{grid-template-columns:repeat(2,1fr);}
  .detail-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .kgrid{grid-template-columns:1fr 1fr;}
  .navbtn .lbl{display:none;}
  .navbtn{padding:8px 10px;}
  .brand h1{font-size:16px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div>
        <h1>集團合併報表管理系統</h1>
        <p>把分散數據變成可下鑽、可決策的經營洞察</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="env">
      <span class="chip"><span class="material-symbols-outlined">calendar_month</span>合併期間 2026Q2</span>
      <span class="chip"><span class="material-symbols-outlined">groups</span>財務 / 會計 / 稽核</span>
      <span class="chip"><span class="material-symbols-outlined">verified</span>純 UI 展示</span>
    </div>
  </header>
  <nav id="nav"></nav>
  <main><div id="screen"></div></main>
</div>
<script>
"use strict";
var chartReg={};
function destroyCharts(){for(var k in chartReg){if(chartReg[k]){try{chartReg[k].destroy();}catch(e){}chartReg[k]=null;}}chartReg={};}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;if(chartReg[id]){try{chartReg[id].destroy();}catch(e){}}chartReg[id]=new Chart(el.getContext("2d"),cfg);}
function esc(s){return String(s==null?"":s);}

var MODS=[
  {icon:"inventory_2",name:"子公司數據匯入",desc:"各子公司財務報表自動收集與格式校驗"},
  {icon:"request_quote",name:"多幣別換算",desc:"匯率維護與外幣財表本位幣換算"},
  {icon:"account_tree",name:"內部交易沖銷",desc:"集團內往來交易與未實現損益消除"},
  {icon:"rule",name:"合併調整分錄",desc:"投資消除與少數股權合併調整"},
  {icon:"description",name:"合併報表產出",desc:"合併資產負債表與損益表編製"},
  {icon:"fact_check",name:"審計覆核軌跡",desc:"稽核勾稽與結帳簽核留痕"}
];

/* SCREEN 0 : 子公司數據匯入 */
var SUBS=[
  {id:"S01",name:"台灣總部",cur:"TWD",status:"已匯入",pkg:"完整",items:428,map:100,err:0,upd:"08/13 09:12",owner:"林孟樺"},
  {id:"S02",name:"上海製造",cur:"CNY",status:"已匯入",pkg:"完整",items:512,map:100,err:0,upd:"08/13 08:40",owner:"王啟綸"},
  {id:"S03",name:"越南廠",cur:"VND",status:"校驗中",pkg:"部分",items:376,map:92,err:6,upd:"08/13 10:05",owner:"阮氏梅"},
  {id:"S04",name:"美國銷售",cur:"USD",status:"已匯入",pkg:"完整",items:295,map:100,err:0,upd:"08/13 07:55",owner:"陳彥廷"},
  {id:"S05",name:"日本子公司",cur:"JPY",status:"待補件",pkg:"缺附註",items:311,map:78,err:14,upd:"08/12 18:20",owner:"佐藤健"},
  {id:"S06",name:"新加坡控股",cur:"SGD",status:"已匯入",pkg:"完整",items:188,map:100,err:0,upd:"08/13 09:48",owner:"李思穎"},
  {id:"S07",name:"德國研發",cur:"EUR",status:"校驗中",pkg:"完整",items:224,map:96,err:3,upd:"08/13 10:22",owner:"Müller"}
];
function statTag(s){var m={"已匯入":"t-ok","校驗中":"t-info","待補件":"t-bad","部分":"t-warn"};return '<span class="tag '+(m[s]||"t-info")+'">'+esc(s)+'</span>';}
function checkRows(s){
  var base=[
    {a:"營業收入",b:"4000",c:"REV-100",ok:true},
    {a:"營業成本",b:"5000",c:"COGS-200",ok:true},
    {a:"應收帳款",b:"1130",c:"AR-050",ok:s.map>=95},
    {a:"應付帳款",b:"2130",c:"AP-060",ok:s.err<10},
    {a:"財報附註",b:"NOTE",c:"—",ok:s.pkg==="完整"}
  ];
  return base.map(function(r){return '<tr><td>'+r.a+'</td><td>'+r.b+'</td><td>'+r.c+'</td><td>'+(r.ok?'<span class="tag t-ok">通過</span>':'<span class="tag t-bad">待補</span>')+'</td></tr>';}).join("");
}
function screen0(c,sel){
  if(sel==null)sel=0;
  var items=SUBS.map(function(s,i){
    return '<div class="litem'+(i===sel?' sel':'')+'" data-sub="'+i+'"><div class="r1"><span class="nm">'+s.id+'　'+esc(s.name)+'</span>'+statTag(s.status)+'</div><div class="sub"><span>'+esc(s.cur)+'</span><span>科目 '+s.items+' 筆</span><span>對映 '+s.map+'%</span></div></div>';
  }).join("");
  var done=SUBS.filter(function(s){return s.status==="已匯入";}).length;
  var totErr=SUBS.reduce(function(a,s){return a+s.err;},0);
  var s=SUBS[sel]||SUBS[0];
  var right=''+
    '<div class="pane"><div class="pane-h"><span><span class="material-symbols-outlined">inventory_2</span>'+esc(s.name)+' 匯入明細</span>'+statTag(s.status)+'</div><div class="pane-b">'+
      '<div class="detail-grid">'+
        '<div class="dcell"><div class="l">申報幣別</div><div class="v">'+esc(s.cur)+'</div></div>'+
        '<div class="dcell"><div class="l">科目筆數</div><div class="v">'+s.items+'</div></div>'+
        '<div class="dcell"><div class="l">對映完成度</div><div class="v">'+s.map+'%</div></div>'+
        '<div class="dcell"><div class="l">校驗錯誤</div><div class="v" style="color:'+(s.err>0?'var(--bad)':'var(--ok)')+'">'+s.err+'</div></div>'+
        '<div class="dcell"><div class="l">負責人</div><div class="v" style="font-size:14px">'+esc(s.owner)+'</div></div>'+
        '<div class="dcell"><div class="l">最後更新</div><div class="v" style="font-size:14px">'+esc(s.upd)+'</div></div>'+
      '</div>'+
      '<div class="sub-h"><span class="material-symbols-outlined">checklist</span>科目對映校驗</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>財報科目</th><th>來源代碼</th><th>集團科目</th><th>狀態</th></tr></thead><tbody>'+checkRows(s)+'</tbody></table></div>'+
    '</div></div>';
  c.innerHTML=''+
    '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">inventory_2</span></div><div><h2>子公司數據匯入</h2><p>各子公司財報包上傳、科目對映與格式校驗，確保合併底稿來源一致</p></div></div>'+
    '<div class="kgrid" style="margin-bottom:16px">'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">factory</span>納入子公司</div><div class="kv">'+SUBS.length+' 家</div><div class="kd mini">2026Q2 合併範圍</div></div>'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">task_alt</span>已完成匯入</div><div class="kv">'+done+' 家</div><div class="kd up">校驗通過</div></div>'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">warning</span>待處理錯誤</div><div class="kv" style="color:var(--bad)">'+totErr+'</div><div class="kd mini">格式 / 對映異常</div></div>'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">history</span>結帳倒數</div><div class="kv">D-4</div><div class="kd mini">08/18 前完成</div></div>'+
    '</div>'+
    '<div class="split"><div class="pane"><div class="pane-h"><span><span class="material-symbols-outlined">list</span>子公司清單</span><span class="pill">'+SUBS.length+' 家</span></div><div class="pane-b" style="max-height:520px;overflow:auto">'+items+'</div></div>'+right+'</div>';
  c.querySelectorAll("[data-sub]").forEach(function(el){el.addEventListener("click",function(){screen0(c,+el.getAttribute("data-sub"));});});
}

/* SCREEN 1 : 多幣別換算 */
var RATES=[
  {cur:"USD",name:"美元",spot:31.80,avg:31.55,close:31.90,d:0.31},
  {cur:"CNY",name:"人民幣",spot:4.42,avg:4.40,close:4.44,d:-0.12},
  {cur:"JPY",name:"日圓",spot:0.2100,avg:0.2085,close:0.2118,d:0.44},
  {cur:"EUR",name:"歐元",spot:34.50,avg:34.20,close:34.66,d:0.28},
  {cur:"SGD",name:"新加坡幣",spot:23.60,avg:23.48,close:23.70,d:0.19},
  {cur:"VND",name:"越南盾",spot:0.00130,avg:0.00129,close:0.00131,d:-0.05}
];
function screen1(c){
  var rows=RATES.map(function(r){
    return '<tr><td><b>'+r.cur+'</b> '+esc(r.name)+'</td><td class="num">'+r.spot.toFixed(4)+'</td><td class="num">'+r.avg.toFixed(4)+'</td><td class="num">'+r.close.toFixed(4)+'</td><td class="num" style="color:'+(r.d>=0?'var(--ok)':'var(--bad)')+'">'+(r.d>=0?'+':'')+r.d.toFixed(2)+'%</td></tr>';
  }).join("");
  c.innerHTML=''+
    '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">request_quote</span></div><div><h2>多幣別換算</h2><p>維護當期匯率並將外幣子公司財表換算為集團本位幣 TWD，計算換算差額</p></div></div>'+
    '<div class="kgrid" style="margin-bottom:16px">'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">payments</span>本位幣</div><div class="kv">TWD</div><div class="kd mini">新台幣</div></div>'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">insights</span>外幣別</div><div class="kv">6 種</div><div class="kd mini">已維護匯率</div></div>'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">trending_up</span>換算差額</div><div class="kv up">+3.2 M</div><div class="kd mini">計入其他綜合損益</div></div>'+
      '<div class="kcard"><div class="kl"><span class="material-symbols-outlined">verified</span>匯率來源</div><div class="kv">央行</div><div class="kd mini">08/13 收盤</div></div>'+
    '</div>'+
    '<div class="split">'+
      '<div class="pane"><div class="pane-h"><span><span class="material-symbols-outlined">monitoring</span>近 6 期匯率走勢</span></div><div class="pane-b"><div class="chartwrap sm"><canvas id="c1line"></canvas></div><div class="legend"><span><i class="dot" style="background:#4f46e5"></i>USD/TWD</span><span><i class="dot" style="background:#818cf8"></i>EUR/TWD</span></div></div></div>'+
      '<div class="pane"><div class="pane-h"><span><span class="material-symbols-outlined">receipt_long</span>當期匯率表</span><span class="pill">即期 / 平均 / 期末</span></div><div class="pane-b"><div style="overflow-x:auto"><table><thead><tr><th>幣別</th><th class="num">即期匯率</th><th class="num">平均匯率</th><th class="num">期末匯率</th><th class="num">週變動</th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>'+
    '</div>'+
    '<div class="pane" style="margin-top:16px"><div class="pane-h"><span><span class="material-symbols-outlined">insights</span>各子公司換算金額 (本位幣 TWD 百萬)</span></div><div class="pane-b"><div class="chartwrap"><canvas id="c1bar"></canvas></div></div></div>';
  void c.offsetHeight;
  mkChart("c1line",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
    {label:"USD/TWD",data:[31.2,31.4,31.3,31.6,31.7,31.8],borderColor:"#4f46e5",backgroundColor:"rgba(79,70,229,.1)",tension:.35,fill:true},
    {label:"EUR/TWD",data:[33.8,34.0,34.1,34.3,34.4,34.5],borderColor:"#818cf8",backgroundColor:"rgba(129,140,248,.08)",tension:.35,fill:true}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:false}}}});
  mkChart("c1bar",{type:"bar",data:{labels:SUBS.map(function(s){return s.name;}),datasets:[
    {label:"換算後營收",data:[1820,2410,832,1560,980,520,410],backgroundColor:"#4f46e5",borderRadius:5},
    {label:"換算後淨利",data:[246,318,92,190,104,88,37],backgroundColor:"#818cf8",borderRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:true}}}});
}

/* SCREEN 2 : 內部交易沖銷 */
var IC=[

function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODS.map(function(m,i){return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="navidx">'+i+'</span></button>';}).join("");
  n.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});});
}

function show(i){
  var n=document.querySelectorAll("[data-i]").length||6;
  if(i<0)i=0;if(i>n-1)i=n-1;
  destroyCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var c=document.getElementById("screen");
  var fn=SCREENS[i]||screen0;
  fn(c);
  void c.offsetHeight;
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
