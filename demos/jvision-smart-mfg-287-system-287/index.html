<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>集團合併報表管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --soft:#E8F1F4;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --radius:4px;
  --shadow:0 1px 0 rgba(19,78,74,.08),0 8px 22px rgba(15,118,110,.07);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:'Crimson Pro','Noto Serif TC','Times New Roman',serif;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[data-sub],[data-ic],[data-au]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
.app{
  width:min(100%,1440px);
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:rgba(240,253,250,.84);
  border-inline:1px solid rgba(94,234,212,.55);
}
.top{
  position:relative;
  overflow:hidden;
  background:#134E4A;
  color:#FFFFFF;
  padding:20px 24px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  border-bottom:4px solid var(--color-secondary);
}
.top:after{
  content:"";
  position:absolute;
  right:-55px;
  top:-105px;
  width:260px;
  height:260px;
  border:1px solid rgba(94,234,212,.25);
  transform:rotate(45deg);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0;position:relative;z-index:1;}
.brand .logo{
  width:44px;
  height:44px;
  border-radius:2px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  box-shadow:5px 5px 0 rgba(255,255,255,.14);
}
.brand .logo .material-symbols-outlined{font-size:25px;}
.brand h1{
  margin:0;
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-size:clamp(20px,2vw,26px);
  font-weight:700;
  line-height:1.05;
  letter-spacing:.02em;
}
.brand p{margin:5px 0 0;font-size:13px;color:#CCFBF1;letter-spacing:.045em;}
.top .spacer{flex:1;}
.top .env{display:flex;gap:7px;flex-wrap:wrap;position:relative;z-index:1;}
.chip{
  min-height:32px;
  padding:6px 10px;
  border:1px solid rgba(153,246,228,.48);
  border-radius:2px;
  background:rgba(255,255,255,.08);
  color:#FFFFFF;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.chip .material-symbols-outlined{font-size:16px;color:#5EEAD4;}
nav{
  position:sticky;
  top:0;
  z-index:20;
  padding:8px 14px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 4px 14px rgba(19,78,74,.06);
  backdrop-filter:blur(10px);
}
.navbtn{
  position:relative;
  min-height:40px;
  min-width:0;
  padding:8px 12px;
  border:1px solid transparent;
  border-radius:2px;
  background:transparent;
  color:#475569;
  display:flex;
  align-items:center;
  gap:7px;
  font-family:'Crimson Pro','Noto Serif TC',serif;
  font-size:14px;
  font-weight:600;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.navbtn:after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-9px;
  height:3px;
  background:transparent;
  transition:background-color .2s ease;
}
.navbtn .material-symbols-outlined{font-size:18px;}
.navbtn:hover{background:#E8F1F4;color:#134E4A;border-color:#99F6E4;transform:translateY(-1px);}
.navbtn.on{background:#CCFBF1;border-color:#0D9488;color:#134E4A;}
.navbtn.on:after{background:#0D9488;}
.navidx{
  min-width:19px;
  color:#0F766E;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-weight:700;
  text-align:center;
}
main{padding:18px;flex:1;min-width:0;}
#screen{min-width:0;}
.screen-head{
  min-height:68px;
  margin-bottom:14px;
  padding:10px 0 12px;
  display:flex;
  align-items:center;
  gap:13px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--color-border);
}
.screen-head .ic{
  width:40px;
  height:40px;
  border-radius:2px;
  background:#CCFBF1;
  color:#0F766E;
  border:1px solid #5EEAD4;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.screen-head h2{
  margin:0;
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-size:24px;
  line-height:1.05;
  font-weight:700;
  letter-spacing:.01em;
  color:#134E4A;
}
.screen-head p{margin:5px 0 0;font-size:13px;color:#475569;}
.split{display:grid;grid-template-columns:minmax(290px,340px) minmax(0,1fr);gap:14px;align-items:start;}
.pane,.kcard{
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.pane{overflow:hidden;min-width:0;}
.pane-h{
  min-height:44px;
  padding:10px 13px;
  border-bottom:1px solid var(--color-border);
  background:linear-gradient(90deg,#FFFFFF,#F0FDFA);
  font-size:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:space-between;
}
.pane-h>span:first-child{display:flex;align-items:center;gap:7px;min-width:0;}
.pane-h .material-symbols-outlined{font-size:18px;color:#0F766E;}
.pane-b{padding:13px;}
.litem{
  position:relative;
  margin-bottom:7px;
  padding:10px 11px;
  border:1px solid #CBD5E1;
  border-radius:2px;
  background:#FFFFFF;
  transition:border-color .2s ease,background-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.litem:last-child{margin-bottom:0;}
.litem:hover{border-color:#0D9488;background:#F0FDFA;transform:translateX(2px);}
.litem.sel{border-color:#0D9488;background:#CCFBF1;box-shadow:inset 4px 0 0 #0D9488;}
.litem .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.litem .nm{font-size:13.5px;font-weight:600;min-width:0;}
.litem .sub{margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;color:#475569;font-size:11.5px;}
.litem .nm,.litem .sub span:first-child,.bcard .t,.tm,.mini{
  font-variant-numeric:tabular-nums;
}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.kcard{
  position:relative;
  min-width:0;
  min-height:112px;
  padding:13px 14px 12px;
  overflow:hidden;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kcard:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:#0D9488;
}
.kcard:hover{transform:translateY(-3px);border-color:#0D9488;box-shadow:0 10px 24px rgba(15,118,110,.12);}
.kcard .kl{display:flex;align-items:center;gap:6px;color:#475569;font-size:12px;font-weight:600;letter-spacing:.025em;}
.kcard .kl .material-symbols-outlined{font-size:17px;color:#0F766E;}
.kcard .kv{
  margin-top:8px;
  color:#134E4A;
  font-family:'Cormorant Garamond','Crimson Pro',serif;
  font-size:26px;
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
}
.kcard .kd{margin-top:7px;font-size:11.5px;}
.up{color:#047857;font-weight:600;}
.down{color:#B91C1C;font-weight:600;}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:13px;}
th{
  padding:9px 10px;
  text-align:left;
  background:#E8F1F4;
  color:#334155;
  border-top:1px solid #CBD5E1;
  border-bottom:1px solid #94A3B8;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.025em;
  white-space:nowrap;
}
th:first-child{border-left:1px solid #CBD5E1;}
th:last-child{border-right:1px solid #CBD5E1;}
td{padding:9px 10px;border-bottom:1px solid #D7E3E6;color:#134E4A;white-space:nowrap;}
tbody tr:nth-child(even) td{background:#F8FAFC;}
tbody tr:hover td{background:#ECFDF5;}
.num{text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums lining-nums;}
td:nth-child(n+2){font-variant-numeric:tabular-nums;}
.tag{
  min-height:22px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  line-height:1.15;
  font-weight:600;
  white-space:nowrap;
}
.tag:before{content:"•";font-size:15px;line-height:0;}
.t-ok{background:#ECFDF5;color:#047857;}
.t-warn{background:#FFFBEB;color:#92400E;}
.t-bad{background:#FEF2F2;color:#B91C1C;}
.t-info{background:#F0FDFA;color:#0F766E;}
.chartwrap{position:relative;width:100%;height:260px;overflow:hidden;}
.chartwrap.sm{height:210px;}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.dcell{min-width:0;padding:10px;border:1px solid #BFE9E3;border-radius:2px;background:#F0FDFA;}
.dcell .l{color:#475569;font-size:11.5px;}
.dcell .v{margin-top:4px;color:#134E4A;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
.sub-h{
  margin:15px 0 8px;
  padding-bottom:7px;
  border-bottom:1px solid #CBD5E1;
  color:#134E4A;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:7px;
}
.sub-h .material-symbols-outlined{font-size:17px;color:#0F766E;}
.board{display:grid;grid-template-columns:repeat(5,minmax(118px,1fr));gap:8px;min-width:660px;}
.bcol{min-width:0;padding:7px;border:1px solid #BFE9E3;border-radius:2px;background:#F0FDFA;}
.bcol-h{padding:4px 4px 8px;display:flex;justify-content:space-between;color:#334155;font-size:12px;font-weight:700;}
.bcol-h span:last-child{min-width:21px;padding:1px 5px;background:#CCFBF1;border:1px solid #5EEAD4;text-align:center;font-family:ui-monospace,monospace;}
.bcard{
  margin-bottom:7px;
  padding:9px;
  border:1px solid #CBD5E1;
  border-radius:2px;
  background:#FFFFFF;
  box-shadow:2px 2px 0 rgba(13,148,136,.08);
  font-size:12px;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.bcard:hover{border-color:#0D9488;transform:translateY(-2px);box-shadow:3px 4px 0 rgba(13,148,136,.13);}
.bcard .t{margin-bottom:5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;}
.bcard .m{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;color:#475569;font-size:11px;}
.tl{position:relative;padding-left:24px;}
.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#94A3B8;}
.tli{position:relative;margin-bottom:16px;padding:1px 4px 1px 0;transition:transform .2s ease;}
.tli:hover{transform:translateX(3px);}
.tli:before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border:3px solid #0D9488;border-radius:50%;background:#FFFFFF;}
.tli.done:before{background:#0D9488;box-shadow:inset 0 0 0 2px #FFFFFF;}
.tli .tt{font-size:13.5px;font-weight:600;}
.tli .td{margin-top:3px;color:#475569;font-size:12px;}
.tli .tm{margin-top:3px;color:#0F766E;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:600;}
.pill{
  padding:3px 8px;
  border:1px solid #99F6E4;
  border-radius:999px;
  background:#F0FDFA;
  color:#475569;
  font-size:11px;
  white-space:nowrap;
}
.legend{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;color:#475569;font-size:12px;}
.legend span{display:flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;border:1px solid #134E4A;border-radius:1px;display:inline-block;}
.mini{color:#475569;font-size:11.5px;}
.rate{font-weight:700;font-variant-numeric:tabular-nums;}
.kcard,.pane,.litem,.bcard,.tli{animation:card-in .4s cubic-bezier(.2,.8,.25,1.18) both;}
.kgrid .kcard:nth-child(2),.pane:nth-child(2),.litem:nth-child(2),.bcard:nth-child(2),.tli:nth-child(2){animation-delay:.06s;}
.kgrid .kcard:nth-child(3),.litem:nth-child(3),.bcard:nth-child(3),.tli:nth-child(3){animation-delay:.12s;}
.kgrid .kcard:nth-child(4),.litem:nth-child(4),.bcard:nth-child(4),.tli:nth-child(4){animation-delay:.18s;}
.litem:nth-child(5),.bcard:nth-child(5),.tli:nth-child(5){animation-delay:.24s;}
.litem:nth-child(6),.bcard:nth-child(6){animation-delay:.30s;}
.litem:nth-child(7),.bcard:nth-child(7){animation-delay:.36s;}
@keyframes card-in{
  from{opacity:0;transform:translateY(12px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@media(max-width:1024px){
  .top{padding:17px 18px;}
  .top .spacer{display:none;}
  .top .env{width:100%;}
  main{padding:15px;}
  .split{grid-template-columns:minmax(250px,310px) minmax(0,1fr);}
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:768px){
  .split{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;}
  .navbtn{flex:0 0 auto;}
  .pane-b{padding:11px;}
}
@media(max-width:560px){
  .app{border-inline:0;}
  .top{padding:15px 14px;}
  .brand{align-items:flex-start;}
  .brand .logo{width:40px;height:40px;}
  .brand h1{font-size:20px;}
  .brand p{font-size:12px;}
  .top .env{gap:5px;}
  .chip{min-height:30px;padding:5px 8px;font-size:11px;}
  nav{padding:7px 10px;}
  .navbtn{min-width:42px;justify-content:center;padding:8px 10px;}
  .navbtn .lbl{display:none;}
  .navbtn:after{bottom:-8px;}
  main{padding:12px;}
  .screen-head{margin-bottom:11px;padding-top:5px;}
  .screen-head h2{font-size:21px;}
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .kcard{min-height:105px;padding:12px 10px;}
  .kcard .kv{font-size:22px;}
  .detail-grid{grid-template-columns:1fr;}
  .pane-h{align-items:flex-start;}
  .chartwrap{height:230px;}
  .chartwrap.sm{height:200px;}
}
@media(max-width:390px){
  .kgrid{grid-template-columns:1fr;}
  .kcard{min-height:auto;}
  .chip:nth-child(2){display:none;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .kcard,.pane,.litem,.bcard,.tli{animation:none!important;transform:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div>
        <h1>集團合併報表管理系統</h1>
        <p>把分散數據變成可下鑽、可決策的經營洞察</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="env">
      <span class="chip"><span class="material-symbols-outlined">calendar_month</span>合併期間 2026Q2</span>
      <span class="chip"><span class="material-symbols-outlined">groups</span>財務 / 會計 / 稽核</span>
      <span class="chip"><span class="material-symbols-outlined">verified</span>純 UI 展示</span>
    </div>
  </header>
  <nav id="nav"></nav>
  <main><div id="screen"></div></main>
</div>
<script>
"use strict";
var chartReg={};
function destroyCharts(){for(var k in chartReg){if(chartReg[k]){try{chartReg[k].destroy();}catch(e){}chartReg[k]=null;}}chartReg={};}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;if(chartReg[id]){try{chartReg[id].destroy();}catch(e){}}chartReg[id]=new Chart(el.getContext("2d"),cfg);}
function esc(s){return String(s==null?"":s);}

var MODS=[
  {icon:"inventory_2",name:"子公司數據匯入",desc:"各子公司財務報表自動收集與格式校驗"},
  {icon:"request_quote",name:"多幣別換算",desc:"匯率維護與外幣財表本位幣換算"},
  {icon:"account_tree",name:"內部交易沖銷",desc:"集團內往來交易與未實現損益消除"},
  {icon:"rule",name:"合併調整分錄",desc:"投資消除與少數股權合併調整"},
  {icon:"description",name:"合併報表產出",desc:"合併資產負債表與損益表編製"},
  {icon:"fact_check",name:"審計覆核軌跡",desc:"稽核勾稽與結帳簽核留痕"}
];

/* SCREEN 0 : 子公司數據匯入 */
var SUBS=[
  {id:"S01",name:"台灣總部",cur:"TWD",status:"已匯入",pkg:"完整",items:428,map:100,err:0,upd:"08/13 09:12",owner:"林孟樺"},
  {id:"S02",name:"上海製造",cur:"CNY",status:"已匯入",pkg:"完整",items:512,map:100,err:0,upd:"08/13 08:40",owner:"王啟綸"},

          '<div class="dcell"><div class="l">處理人</div><div class="v" style="font-size:14px">'+esc(a.who)+'</div></div>'+
        '</div>'+
        '<div style="margin-top:12px;background:var(--soft);padding:11px 13px;border-radius:10px;font-size:13px;color:var(--ink)">'+esc(a.d)+'</div>'+

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];

function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODS.map(function(m,i){return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="navidx">'+i+'</span></button>';}).join("");
  n.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});});
}

function show(i){
  var n=document.querySelectorAll("[data-i]").length||6;
  if(i<0)i=0;if(i>n-1)i=n-1;
  destroyCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var c=document.getElementById("screen");
  var fn=SCREENS[i]||screen0;
  fn(c);
  void c.offsetHeight;
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
