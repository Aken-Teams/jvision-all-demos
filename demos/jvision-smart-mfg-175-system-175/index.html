<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供應商風險管理系統 · Supplier Risk Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#db2777;--accent2:#f472b6;--ink:#2a1420;--bg:#fdf2f8;--card:#ffffff;--line:#f3d9e6;--mut:#8a6076;--soft:#fce7f2;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--info:#6366f1}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(219,39,119,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";white-space:nowrap}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(219,39,119,.28)}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{background:var(--soft);color:var(--accent);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;font-family:"Noto Sans TC"}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 2px 10px rgba(219,39,119,.04)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;font-family:"Noto Sans TC";display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:800;font-family:Inter}
.kpi .sub{font-size:11px;color:var(--mut)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.trend{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:2px}
.up{color:var(--bad)}.dn{color:var(--ok)}
.chart{width:100%;height:280px;overflow:hidden}
.ch-sm{height:220px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl-wrap{overflow-x:auto}
th{text-align:left;font-family:"Noto Sans TC";font-weight:700;color:var(--mut);font-size:12px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;font-family:"Noto Sans TC";white-space:nowrap}
.t-bad{background:#fee2e2;color:var(--bad)}
.t-warn{background:#fef3c7;color:#b45309}
.t-ok{background:#dcfce7;color:var(--ok)}
.t-info{background:#e0e7ff;color:var(--info)}
.t-mut{background:#f1f5f9;color:#64748b}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px}
.col{background:var(--soft);border-radius:14px;padding:11px;min-width:0}
.col h4{margin:0 0 10px;font-size:13px;font-family:"Noto Sans TC";display:flex;justify-content:space-between;align-items:center}
.col h4 span{background:#fff;color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.tk b{font-size:13px;font-family:"Noto Sans TC"}
.tk .m{font-size:11px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:4px}
.ev .body{min-width:0;flex:1}
.ev .body b{font-family:"Noto Sans TC";font-size:14px}
.ev .body p{margin:3px 0 0;font-size:12px;color:var(--mut)}
.ev .when{font-size:11px;color:var(--mut);white-space:nowrap;flex:none}
.mini{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 0}
.mini .nm{min-width:0;flex:1;font-family:"Noto Sans TC"}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 16px}
.tl .it:before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl .it b{font-family:"Noto Sans TC";font-size:13px}
.tl .it p{margin:3px 0 0;font-size:12px;color:var(--mut)}
.sig{background:linear-gradient(135deg,#831843,#db2777);color:#fff;border-radius:16px;padding:18px;min-width:0}
.sig .big{font-size:34px;font-weight:800}
.sig .lab2{font-size:12px;opacity:.85;font-family:"Noto Sans TC"}
.foot{max-width:1280px;margin:6px auto 30px;padding:0 22px;color:var(--mut);font-size:12px;text-align:center;font-family:"Noto Sans TC"}
@media(max-width:560px){.nav button .lbl{display:none}.nav button{padding:8px}.brand span{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">shield</span></div>
    <div><b>供應商風險管理系統</b><span>SUPPLIER RISK</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>
<div class="wrap" id="app"></div>
<div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-175-system-175/</div>

<script>
var NAV=[
  {ic:"monitoring",t:"風險訊號監控"},
  {ic:"warning",t:"風險事件偵測"},
  {ic:"account_tree",t:"供應鏈曝險地圖"},
  {ic:"rule",t:"風險分級評等"},
  {ic:"shield",t:"應變計畫啟動"},
  {ic:"insights",t:"風險成效儀表"}
];
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return m==="&"?"&amp;":m==="<"?"&lt;":"&gt;";});}
function h(html){var a=document.getElementById("app");a.innerHTML=html;}

/* ---------- Screen 0: 風險訊號監控 ---------- */
function s0(){
  var kpis=[
    {lab:"監控供應商",val:"248",sub:"涵蓋 6 大品類",ic:"groups",cl:"#6366f1",tr:"+12",up:false},
    {lab:"高風險占比",val:"9.3%",sub:"23 家 / 目標 <8%",ic:"warning",cl:"#dc2626",tr:"+1.4pt",up:true},
    {lab:"活躍風險訊號",val:"41",sub:"財務 18 · 外部 23",ic:"monitoring",cl:"#db2777",tr:"+6",up:true},
    {lab:"平均反應時間",val:"3.8h",sub:"事件確認至通報",ic:"bolt",cl:"#15803d",tr:"-1.2h",up:false}
  ];
  var kh=kpis.map(function(k){return '<div class="card kpi"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="lab"><span class="material-symbols-outlined" style="font-size:16px">'+k.ic+'</span>'+k.lab+'</div><div class="ic" style="background:'+k.cl+'22;color:'+k.cl+'"><span class="material-symbols-outlined">'+k.ic+'</span></div></div><div class="val">'+k.val+'</div><div class="sub">'+k.sub+' · <span class="trend '+(k.up?"up":"dn")+'"><span class="material-symbols-outlined" style="font-size:13px">'+(k.up?"north":"south")+'</span>'+k.tr+'</span></div></div>';}).join("");
  var watch=[
    {n:"O捷電子",cat:"PCB 板材",fin:34,sig:"應收帳款周轉惡化",lv:"t-bad",lt:"高"},
    {n:"O山金屬",cat:"沖壓件",fin:52,sig:"原物料成本上升",lv:"t-warn",lt:"中"},
    {n:"鴻昇連接器",cat:"連接器",fin:71,sig:"訂單集中度過高",lv:"t-warn",lt:"中"},
    {n:"O華光電",cat:"光學元件",fin:88,sig:"訊號正常",lv:"t-ok",lt:"低"},
    {n:"O茂塑膠",cat:"塑膠射出",fin:46,sig:"信用評等下修",lv:"t-bad",lt:"高"},
    {n:"友O精密",cat:"CNC 加工",fin:79,sig:"交期波動偏大",lv:"t-warn",lt:"中"}
  ];
  var rows=watch.map(function(w){return '<tr><td><b style="font-family:\'Noto Sans TC\'">'+esc(w.n)+'</b></td><td><span class="tag t-mut">'+esc(w.cat)+'</span></td><td style="min-width:120px"><div class="bar"><i style="width:'+w.fin+'%"></i></div><div style="font-size:11px;color:var(--mut);margin-top:3px">'+w.fin+' 分</div></td><td style="font-size:12px">'+esc(w.sig)+'</td><td><span class="tag '+w.lv+'">'+w.lt+'風險</span></td></tr>';}).join("");
  h(
   '<div class="vh"><div><h2>風險訊號監控</h2><p>供應商財務健康度與外部訊號即時監看 · 採購部日常視角</p></div><span class="pill"><span class="material-symbols-outlined" style="font-size:15px">update</span>資料更新 08:12</span></div>'+
   '<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'+
   '<div class="grid g23">'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">財務健康度趨勢（近 8 週）</div><div id="c0a" class="chart"></div></div>'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">風險訊號來源分布</div><div id="c0b" class="chart"></div></div>'+
   '</div>'+
   '<div class="card" style="margin-top:14px"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:10px">重點監控清單</div><div class="tbl-wrap"><table><thead><tr><th>供應商</th><th>品類</th><th>財務健康分</th><th>最新訊號</th><th>風險等級</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
  );
  void document.getElementById("app").offsetHeight;
  mk("c0a",{grid:{left:38,right:14,top:28,bottom:26},tooltip:{trigger:"axis"},legend:{data:["整體均分","高風險群"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLine:{lineStyle:{color:"#e5c9d8"}}},
    yAxis:{type:"value",min:20,max:90,splitLine:{lineStyle:{color:"#f3d9e6"}}},
    series:[
      {name:"整體均分",type:"line",smooth:true,data:[68,66,67,64,63,61,62,60],itemStyle:{color:"#db2777"},areaStyle:{color:"rgba(219,39,119,.12)"}},
      {name:"高風險群",type:"line",smooth:true,data:[42,41,39,37,36,34,33,32],itemStyle:{color:"#dc2626"}}
    ]});
  mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["42%","68%"],center:["50%","44%"],label:{show:false},data:[
      {name:"財務惡化",value:18,itemStyle:{color:"#db2777"}},
      {name:"地緣政治",value:9,itemStyle:{color:"#6366f1"}},
      {name:"天災氣候",value:7,itemStyle:{color:"#0ea5e9"}},
      {name:"交期異常",value:5,itemStyle:{color:"#f59e0b"}},
      {name:"品質事件",value:2,itemStyle:{color:"#10b981"}}
    ]}]});
}

/* ---------- Screen 1: 風險事件偵測 ---------- */
function s1(){
  var evs=[
    {c:"#dc2626",t:"精捷電子 信用評等自 BBB 下修至 BB",p:"外部信評機構調降，付款能力風險升高，影響 PCB 板材供應。",w:"12 分鐘前",tag:"t-bad",tl:"嚴重"},
    {c:"#f59e0b",t:"越南平陽省颱風警報 影響 3 家二階供應商",p:"氣象情資顯示強颱路徑覆蓋生產基地，物流可能中斷 2-4 天。",w:"46 分鐘前",tag:"t-warn",tl:"警示"},
    {c:"#6366f1",t:"連接器料號 CN-4471 單一來源曝險偵測",p:"鴻昇連接器為唯一合格來源，訂單集中度達 92%。",w:"1 小時前",tag:"t-info",tl:"注意"},
    {c:"#dc2626",t:"O茂塑膠 應付帳款逾期天數突破門檻",p:"供應商現金流訊號惡化，DSO 由 58 天升至 87 天。",w:"2 小時前",tag:"t-bad",tl:"嚴重"},
    {c:"#f59e0b",t:"泰山金屬 鋼材報價單週上漲 11%",p:"原物料成本異常波動，超過參考價 8% 說明門檻。",w:"3 小時前",tag:"t-warn",tl:"警示"},
    {c:"#10b981",t:"O華光電 品質稽核結案 風險解除",p:"SCAR 改善驗證通過，風險訊號自動關閉。",w:"5 小時前",tag:"t-ok",tl:"解除"}
  ];
  var feed=evs.map(function(e){return '<div class="ev"><span class="dot" style="background:'+e.c+'"></span><div class="body"><b>'+esc(e.t)+'</b> <span class="tag '+e.tag+'">'+e.tl+'</span><p>'+esc(e.p)+'</p></div><div class="when">'+e.w+'</div></div>';}).join("");
  var stat=[
    {lab:"今日偵測事件",val:"27",cl:"#db2777"},
    {lab:"待確認",val:"8",cl:"#f59e0b"},
    {lab:"已升級",val:"5",cl:"#dc2626"},
    {lab:"自動解除",val:"14",cl:"#15803d"}
  ];
  var sh=stat.map(function(s){return '<div class="card kpi" style="text-align:center"><div class="val" style="color:'+s.cl+'">'+s.val+'</div><div class="lab" style="justify-content:center">'+s.lab+'</div></div>';}).join("");
  h(
   '<div class="vh"><div><h2>風險事件偵測</h2><p>地緣政治、天災與異常事件即時通報 · 供應鏈風險管理部確認影響</p></div><span class="pill"><span class="material-symbols-outlined" style="font-size:15px">notifications_active</span>8 件待確認</span></div>'+
   '<div class="grid g4" style="margin-bottom:14px">'+sh+'</div>'+
   '<div class="grid g23">'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">即時事件流</div>'+feed+'</div>'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">近 7 日事件類型熱度</div><div id="c1a" class="chart"></div></div>'+
   '</div>'
  );
  void document.getElementById("app").offsetHeight;
  var cats=["財務","地緣","天災","交期","品質"];var days=["一","二","三","四","五","六","日"];
  var data=[];var seed=[[2,1,0,3,1,2,1],[1,0,2,1,0,1,0],[0,1,1,0,2,1,3],[3,2,1,2,1,0,1],[1,0,1,0,1,2,0]];
  for(var i=0;i<cats.length;i++){for(var j=0;j<days.length;j++){data.push([j,i,seed[i][j]]);}}
  mk("c1a",{tooltip:{position:"top"},grid:{left:44,right:14,top:14,bottom:44},
    xAxis:{type:"category",data:days,splitArea:{show:true},axisLabel:{fontSize:11}},
    yAxis:{type:"category",data:cats,splitArea:{show:true},axisLabel:{fontSize:11}},
    visualMap:{min:0,max:3,calculable:true,orient:"horizontal",left:"center",bottom:6,inRange:{color:["#fce7f2","#f472b6","#db2777"]},textStyle:{fontSize:10}},
    series:[{type:"heatmap",data:data,label:{show:true,fontSize:10},emphasis:{itemStyle:{shadowBlur:8}}}]});
}

/* ---------- Screen 2: 供應鏈曝險地圖 ---------- */
function s2(){
  var single=[
    {n:"CN-4471 連接器",s:"鴻昇連接器",c:92,lv:"t-bad"},
    {n:"PCB-880 六層板",s:"O捷電子",c:88,lv:"t-bad"},
    {n:"OPT-12 稜鏡",s:"O華光電",c:74,lv:"t-warn"},
    {n:"MTL-31 特殊鋼",s:"O山金屬",c:66,lv:"t-warn"},
    {n:"PLS-07 工程塑膠",s:"O茂塑膠",c:58,lv:"t-warn"}
  ];
  var mh=single.map(function(m){return '<div class="mini"><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">tag</span><div class="nm"><b>'+esc(m.n)+'</b><div style="font-size:11px;color:var(--mut)">'+esc(m.s)+'</div></div><div style="width:90px"><div class="bar"><i style="width:'+m.c+'%"></i></div></div><span class="tag '+m.lv+'" style="width:58px;justify-content:center">'+m.c+'%</span></div>';}).join("");
  h(
   '<div class="vh"><div><h2>供應鏈曝險地圖</h2><p>多層供應網絡與單一來源曝險視覺化 · 通報示警的決策底圖</p></div><span class="pill"><span class="material-symbols-outlined" style="font-size:15px">hub</span>3 層 · 248 節點</span></div>'+
   '<div class="grid g32">'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:10px">單一來源曝險（訂單集中度）</div>'+mh+'<div class="leg"><span><i style="background:#dc2626"></i>&gt;85% 立即備援</span><span><i style="background:#f59e0b"></i>50-85% 觀察</span></div></div>'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">多層供應網絡曝險（品類 × 地區）</div><div id="c2a" class="chart" style="height:320px"></div></div>'+
   '</div>'+
   '<div class="grid g2" style="margin-top:14px">'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">地區集中度風險</div><div id="c2b" class="chart ch-sm"></div></div>'+
     '<div class="card"><div style="font-family:\'Noto Sans TC\';font-weight:700;margin-bottom:6px">供應層級曝險占比</div><div id="c2c" class="chart ch-sm"></div></div>'+
   '</div>'
