<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>供應商風險管理系統 · Supplier Risk Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --soft:#E9EFF8;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#2563EB;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  background:
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button,[onclick]{cursor:pointer}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:68px;
  padding:10px max(20px,calc((100vw - 1320px)/2));
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:245px}
.logo{
  position:relative;
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--blue);
  border-radius:8px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.logo:after{
  content:"";
  position:absolute;
  right:-5px;
  bottom:-5px;
  width:9px;
  height:9px;
  background:var(--color-accent);
  border:2px solid #fff;
}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:1px;
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.16em;
}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  min-height:42px;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{background:#EFF6FF;color:var(--blue);border-color:#BFDBFE}
.nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav button.on:after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:-11px;
  height:3px;
  background:var(--color-accent);
}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.wrap{width:min(1320px,100%);min-height:calc(100vh - 130px);margin:0 auto;padding:30px 20px 38px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  padding-bottom:17px;
  border-bottom:1px solid var(--line);
}
.vh h2{
  position:relative;
  margin:0;
  padding-left:15px;
  font-size:clamp(22px,2.5vw,30px);
  font-weight:700;
  letter-spacing:-.025em;
}
.vh h2:before{content:"";position:absolute;left:0;top:5px;bottom:4px;width:4px;background:var(--blue)}
.vh p{margin:6px 0 0;padding-left:15px;color:var(--muted);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  min-height:34px;
  padding:6px 11px;
  color:#1E40AF;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:5px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.card{
  min-width:0;
  padding:18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#BFDBFE;box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 30px rgba(37,99,235,.07)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.kpi{position:relative;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .val{font-family:"Fira Code",monospace;font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:11px}
.kpi .ic{display:grid;place-items:center;width:35px;height:35px;flex:none;border-radius:6px}
.trend{display:inline-flex;align-items:center;gap:2px;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.up{color:var(--bad)}.dn{color:var(--ok)}
.chart{width:100%;height:280px;overflow:hidden}
.ch-sm{height:220px}
.tbl-wrap{width:100%;overflow-x:auto}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
th{
  padding:10px 11px;
  color:#334155;
  background:#F1F5F9;
  border-top:1px solid var(--line);
  border-bottom:2px solid #CBD5E1;
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em;
  white-space:nowrap;
}
td{padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
tr:last-child td{border-bottom:0}
td:not(:first-child){font-variant-numeric:tabular-nums}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
th:last-child,td:last-child{text-align:left}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.tag:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-warn{color:#92400E;background:#FFFBEB}
.t-ok{color:#166534;background:#F0FDF4}
.t-info{color:#1D4ED8;background:#EFF6FF}
.t-mut{color:#475569;background:#F8FAFC}
.bar{height:8px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--color-secondary));border-radius:2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;min-width:720px}
.col{min-width:0;padding:12px;background:#F8FAFC;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:6px}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;font-size:13px}
.col h4 span{padding:2px 7px;color:#1D4ED8;background:#DBEAFE;border-radius:3px;font-family:"Fira Code",monospace;font-size:10px}
.tk{margin-bottom:9px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:5px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tk:last-child{margin-bottom:0}
.tk b{font-size:13px}
.tk .m{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:11px}
.ev{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.dot{position:relative;width:11px;height:11px;flex:none;margin-top:5px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4px currentColor}
.ev .body{min-width:0;flex:1}
.ev .body b{font-size:14px}
.ev .body p{margin:4px 0 0;color:var(--muted);font-size:12px}
.ev .when{flex:none;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;white-space:nowrap}
.mini{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}
.mini:last-of-type{border-bottom:0}
.mini .nm{min-width:0;flex:1}
.mini .nm b{font-family:"Fira Code","Fira Sans",monospace;font-size:11px}
.leg{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}
.leg i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:middle}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:5px;width:2px;background:#BFDBFE}
.tl .it{position:relative;padding:0 0 17px}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;background:#fff;border:3px solid var(--blue);border-radius:50%}
.tl .it b{font-size:13px}
.tl .it p{margin:3px 0 0;color:var(--muted);font-size:12px}
.sig{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:20px;
  color:#fff;
  background:#1E3A8A;
  border:1px solid #1D4ED8;
  border-radius:8px;
  box-shadow:8px 8px 0 #DBEAFE;
}
.sig:after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border:24px solid rgba(255,255,255,.08);border-radius:50%}
.sig .big{font-family:"Fira Code",monospace;font-size:35px;font-weight:700;font-variant-numeric:tabular-nums}
.sig .lab2{font-size:12px;color:#DBEAFE}
.foot{
  width:min(1320px,100%);
  margin:0 auto 28px;
  padding:18px 20px 0;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .top{align-items:flex-start;gap:10px;flex-wrap:wrap}
  .nav{order:2;width:100%;margin-left:0;padding-top:3px}
  .nav button.on:after{bottom:-4px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .wrap{padding:22px 15px 32px}
  .vh{align-items:flex-start;flex-direction:column}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .card{padding:15px}
  .chart{height:260px}
}
@media(max-width:480px){
  .top{padding:9px 12px}
  .brand{min-width:0}
  .brand span:not(.material-symbols-outlined){display:none}
  .nav button{min-width:42px;justify-content:center;padding:9px}
  .nav button .lbl{display:none}
  .g4{grid-template-columns:1fr}
  .vh h2{font-size:23px}
  .vh p{font-size:12px}
  .pill{align-self:flex-start}
  .ev{flex-wrap:wrap}
  .ev .when{width:100%;padding-left:23px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">shield</span></div>
    <div><b>供應商風險管理系統</b><span>SUPPLIER RISK</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap reveal" id="app"></main>
<footer class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-175-system-175/</footer>
<script>
var NAV=[
  {ic:"monitoring",t:"風險訊號監控"},
  {ic:"warning",t:"風險事件偵測"},
  {ic:"account_tree",t:"供應鏈曝險地圖"},
  {ic:"rule",t:"風險分級評等"},
  {ic:"shield",t:"應變計畫啟動"},
  {ic:"insights",t:"風險成效儀表"}
];
var charts=[];
var C={
  blue:"#2563EB",blue2:"#3B82F6",orange:"#EA580C",red:"#DC2626",
  green:"#15803D",amber:"#B45309",indigo:"#4F46E5",cyan:"#0284C7",
  grid:"#E2E8F0",soft:"#DBEAFE",text:"#475569"
};
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose()}catch(e){}}charts=[]}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return m==="&"?"&amp;":m==="<"?"&lt;":"&gt;"})}
function h(html){
  var a=document.getElementById("app");
  a.classList.remove("reveal");
  a.innerHTML=html;
  void a.offsetWidth;
  a.classList.add("reveal");
}
function title(s){return '<div style="font-weight:700;margin-bottom:8px">'+s+'</div>'}
function s0(){
  var kpis=[
    {lab:"監控供應商",val:"248",sub:"涵蓋 6 大品類",ic:"groups",cl:C.indigo,tr:"+12",up:false},
    {lab:"高風險占比",val:"9.3%",sub:"23 家 / 目標 <8%",ic:"warning",cl:C.red,tr:"+1.4pt",up:true},
    {lab:"活躍風險訊號",val:"41",sub:"財務 18 · 外部 23",ic:"monitoring",cl:C.blue,tr:"+6",up:true},
    {lab:"平均反應時間",val:"3.8h",sub:"事件確認至通報",ic:"bolt",cl:C.green,tr:"-1.2h",up:false}
  ];
  var kh=kpis.map(function(k){return '<section class="card kpi"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:16px">'+k.ic+'</span>'+k.lab+'</div><div class="ic" style="background:'+k.cl+'16;color:'+k.cl+'"><span class="material-symbols-outlined" aria-hidden="true">'+k.ic+'</span></div></div><div class="val">'+k.val+'</div><div class="sub">'+k.sub+' · <span class="trend '+(k.up?"up":"dn")+'"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:13px">'+(k.up?"north":"south")+'</span>'+k.tr+'</span></div></section>'}).join("");
  var watch=[
    {n:"O捷電子",cat:"PCB 板材",fin:34,sig:"應收帳款周轉惡化",lv:"t-bad",lt:"高"},
    {n:"O山金屬",cat:"沖壓件",fin:52,sig:"原物料成本上升",lv:"t-warn",lt:"中"},
    {n:"鴻昇連接器",cat:"連接器",fin:71,sig:"訂單集中度過高",lv:"t-warn",lt:"中"},
    {n:"O華光電",cat:"光學元件",fin:88,sig:"訊號正常",lv:"t-ok",lt:"低"},
    {n:"O茂塑膠",cat:"塑膠射出",fin:46,sig:"信用評等下修",lv:"t-bad",lt:"高"},
    {n:"友O精密",cat:"CNC 加工",fin:79,sig:"交期波動偏大",lv:"t-warn",lt:"中"}
  ];
  var rows=watch.map(function(w){return '<tr><td><b>'+esc(w.n)+'</b></td><td><span class="tag t-mut">'+esc(w.cat)+'</span></td><td style="min-width:130px"><div class="bar"><i style="width:'+w.fin+'%"></i></div><div style="font-family:\'Fira Code\';font-size:10px;color:var(--muted);margin-top:4px;text-align:right">'+w.fin+' 分</div></td><td style="font-size:12px">'+esc(w.sig)+'</td><td><span class="tag '+w.lv+'">'+w.lt+'風險</span></td></tr>'}).join("");
  h('<div class="vh"><div><h2>風險訊號監控</h2><p>供應商財務健康度與外部訊號即時監看 · 採購部日常視角</p></div><span class="pill"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:15px">update</span>資料更新 08:12</span></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'+
  '<div class="grid g23"><section class="card">'+title("財務健康度趨勢（近 8 週）")+'<div id="c0a" class="chart"></div></section><section class="card">'+title("風險訊號來源分布")+'<div id="c0b" class="chart"></div></section></div>'+
  '<section class="card" style="margin-top:14px">'+title("重點監控清單")+'<div class="tbl-wrap"><table><thead><tr><th>供應商</th><th>品類</th><th>財務健康分</th><th>最新訊號</th><th>風險等級</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>');
  void document.getElementById("app").offsetHeight;
  mk("c0a",{grid:{left:38,right:14,top:30,bottom:26},tooltip:{trigger:"axis"},legend:{data:["整體均分","高風險群"],top:0,textStyle:{fontSize:11,color:C.text}},xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLine:{lineStyle:{color:C.grid}}},yAxis:{type:"value",min:20,max:90,splitLine:{lineStyle:{color:C.grid}}},series:[{name:"整體均分",type:"line",smooth:true,data:[68,66,67,64,63,61,62,60],itemStyle:{color:C.blue},lineStyle:{width:3},areaStyle:{color:"rgba(37,99,235,.10)"}},{name:"高風險群",type:"line",smooth:true,data:[42,41,39,37,36,34,33,32],itemStyle:{color:C.red},lineStyle:{width:2,type:"dashed"}}]});
  mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:C.text}},series:[{type:"pie",radius:["44%","69%"],center:["50%","44%"],label:{show:false},itemStyle:{borderColor:"#fff",borderWidth:3},data:[{name:"財務惡化",value:18,itemStyle:{color:C.blue}},{name:"地緣政治",value:9,itemStyle:{color:C.indigo}},{name:"天災氣候",value:7,itemStyle:{color:C.cyan}},{name:"交期異常",value:5,itemStyle:{color:C.orange}},{name:"品質事件",value:2,itemStyle:{color:C.green}}]}]});
}
function s1(){
  var evs=[
    {c:C.red,t:"精捷電子 信用評等自 BBB 下修至 BB",p:"外部信評機構調降，付款能力風險升高，影響 PCB 板材供應。",w:"12 分鐘前",tag:"t-bad",tl:"嚴重"},
