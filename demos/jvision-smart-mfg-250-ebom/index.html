<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>研發BOM管理系統（EBOM）</title>
<meta name="description" content="EBOM 結構、版本控制、EBOM 轉 MBOM 對應、替代料與差異稽核"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#15803d;
  --color-on-primary:#ffffff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#ffffff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#15803d;
  --blue:#15803d;
  --ink:#14532d;
  --muted:#475569;
  --line:#bbf7d0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#dcfce7;
  --ink2:#334e42;
  --ink3:#52675d;
  --bg:var(--color-background);
  --card:var(--color-card);
  --ok:#15803d;
  --warn:#a65306;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --shadow:0 8px 24px rgba(20,83,45,.07);
  --shadow-hover:0 14px 32px rgba(20,83,45,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{
  max-width:100%;overflow-x:hidden;min-height:100vh;
  font-family:"Exo","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(rgba(21,128,61,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;
  font-size:20px;line-height:1;vertical-align:middle;display:inline-block;
  font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;
}
:where(button,a,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px;
  box-shadow:0 0 0 5px rgba(255,255,255,.92);
}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 0 rgba(20,83,45,.04);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.topbar::after{
  content:"";display:block;height:2px;width:100%;
  background:linear-gradient(90deg,var(--color-primary) 0 64%,var(--color-secondary) 64% 86%,var(--color-accent) 86%);
}
.topbar-inner{
  max-width:1440px;margin:0 auto;padding:12px 24px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;min-width:0;
}
.brand{display:flex;align-items:center;gap:12px;min-width:240px}
.brand-logo{
  width:42px;height:42px;border-radius:4px;background:var(--color-primary);
  color:var(--color-on-primary);display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;box-shadow:5px 5px 0 #bbf7d0;
}
.brand-logo .material-symbols-outlined{font-size:24px;color:inherit}
.brand-txt{min-width:0}
.brand-txt b{font-size:15px;font-weight:700;display:block;line-height:1.2;letter-spacing:.02em}
.brand-txt span{
  display:block;margin-top:3px;font-family:"Roboto Mono",monospace;
  font-size:10px;color:var(--color-muted-foreground);letter-spacing:.035em;
}
.nav{display:flex;gap:3px;flex-wrap:wrap;min-width:0;margin-left:auto}
.nav button{
  min-height:42px;display:flex;align-items:center;gap:7px;
  border:1px solid transparent;background:transparent;color:#3d564b;
  font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:3px;
  white-space:nowrap;transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#ecfdf3;border-color:var(--color-border);color:var(--color-primary);transform:translateY(-1px)}
.nav button.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:#86efac;margin-left:1px}
.nav button.on .material-symbols-outlined{color:inherit}
main{max-width:1440px;margin:0 auto;padding:28px 24px 64px}
.head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  flex-wrap:wrap;margin-bottom:20px;min-width:0;padding:0 0 16px;
  border-bottom:1px solid var(--color-border);
}
.head h1{
  font-size:25px;font-weight:700;display:flex;align-items:center;gap:11px;
  letter-spacing:-.025em;line-height:1.2;
}
.head h1::after{content:"/ EBOM";font-family:"Roboto Mono",monospace;font-size:10px;font-weight:500;color:#5b7167;letter-spacing:.08em}
.head h1 .material-symbols-outlined{color:var(--color-primary);font-size:27px}
.head p{font-size:13px;color:#40594e;margin-top:7px;max-width:720px}
.pill{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;
  font-size:11px;font-weight:700;color:#14532d;background:#dcfce7;
  border:1px solid #86efac;padding:7px 12px;border-radius:3px;white-space:nowrap;
  font-family:"Roboto Mono",monospace;text-transform:uppercase;letter-spacing:.035em;
}
.pill .material-symbols-outlined{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{
  background:var(--color-card);border:1px solid var(--color-border);border-radius:4px;
  padding:15px 16px 14px;min-width:0;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-18px;bottom:-24px;width:76px;height:76px;border:1px solid #dcfce7;transform:rotate(45deg)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#86efac}
.kpi .k-lab{
  position:relative;z-index:1;font-size:11px;color:#53675e;font-weight:600;
  display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.045em;
}
.kpi .k-lab .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
.kpi .k-val{
  position:relative;z-index:1;font-family:"Roboto Mono",monospace;
  font-size:27px;font-weight:700;margin-top:7px;letter-spacing:-.055em;
  color:var(--color-card-foreground);font-variant-numeric:tabular-nums;
}
.kpi .k-sub{position:relative;z-index:1;font-size:11px;margin-top:3px;font-weight:600}
.k-up{color:#116530}.k-dn{color:#b42318}.k-fl{color:#52675d}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{
  background:var(--color-card);border:1px solid var(--color-border);border-radius:4px;
  padding:16px;min-width:0;box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#86efac;box-shadow:var(--shadow-hover)}
.card h3{
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
  margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid #dcfce7;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.card h3 .tag{
  margin-left:auto;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:600;
  color:#40594e;background:#f1f5f3;border:1px solid #d6e4dc;padding:4px 8px;border-radius:2px;
  letter-spacing:.025em;
}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:220px}
.board{display:grid;grid-template-columns:repeat(4,minmax(214px,1fr));gap:10px}
.col{
  background:#f7fcf8;border:1px solid var(--color-border);border-radius:3px;
  padding:9px;min-width:0;display:flex;flex-direction:column;gap:8px;
}
.col-h{
  display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  padding:3px 3px 8px;text-transform:uppercase;letter-spacing:.035em;
}
.col-h .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px #fff,0 0 0 4px currentColor}
.col-h .cnt{
  margin-left:auto;font-family:"Roboto Mono",monospace;font-size:10px;color:#40594e;
  background:#fff;border:1px solid var(--color-border);border-radius:2px;padding:1px 7px;font-weight:700;
}
.tk{
  background:#fff;border:1px solid #cdebd7;border-radius:3px;padding:11px;
  box-shadow:0 2px 6px rgba(20,83,45,.05);min-width:0;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.tk:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:0 8px 18px rgba(20,83,45,.1)}
.tk-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tk-code{font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:700;color:#146b35;letter-spacing:.025em}
.tk-pri{margin-left:auto}
.tk-name{font-size:12.5px;font-weight:700;line-height:1.4;margin-bottom:8px;color:#183d29}
.tk-meta{display:flex;align-items:center;gap:9px;font-size:10.5px;color:#53675e;flex-wrap:wrap}
.tk-meta .material-symbols-outlined{font-size:14px}
.tk-lv{display:inline-flex;align-items:center;gap:3px;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:2px;padding:1px 5px}
.tbl-wrap{overflow-x:auto;border:1px solid #d7ede0;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;font-variant-numeric:tabular-nums}
th{
  text-align:left;font-size:10.5px;font-weight:700;color:#40594e;padding:9px 10px;
  border-bottom:1px solid #86efac;white-space:nowrap;background:#ecfdf3;
  text-transform:uppercase;letter-spacing:.035em;
}
td{padding:9px 10px;border-bottom:1px solid #e2eee6;vertical-align:middle;color:#294a38}
td:last-child,th:last-child{text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#f0fdf4}
.mono,.tk-code,.tr-code,.tl-ver,.tl-date,.s-no,.pbar+span{
  font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;
}
.mono{font-weight:600;font-size:11px;letter-spacing:-.02em}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:2px;white-space:nowrap;border:1px solid currentColor;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.b-ok{color:#116530;background:#ecfdf3}.b-ok::after{content:" · 通過";font-size:0}
.b-warn{color:#92520a;background:#fffbeb}.b-warn::after{content:" · 注意";font-size:0}
.b-bad{color:#b42318;background:#fff1f0}.b-bad::after{content:" · 風險";font-size:0}
.b-info{color:#1e40af;background:#eff6ff}
.b-mut{color:#4b6157;background:#f1f5f3}
.b-acc{color:#805007;background:#fff8e7}
.tree{font-size:12px}
.tr-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:2px;min-width:0;border-bottom:1px solid #edf5ef;transition:background .18s ease,transform .18s ease}
.tr-row:hover{background:#ecfdf3;transform:translateX(2px)}
.tr-row .material-symbols-outlined{font-size:17px;color:var(--color-primary);flex:0 0 auto}
.tr-code{font-weight:700;font-size:11px;color:#14532d;flex:0 0 auto}
.tr-nm{font-size:12px;color:#40594e;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-qty{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:10.5px;color:#52675d;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:#bbf7d0}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--color-accent)}
.tl-dot.done{background:var(--color-primary);border-color:var(--color-primary)}
.tl-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-ver{font-weight:700;font-size:12px;color:#146b35}
.tl-date{font-size:10px;color:#52675d;font-weight:500}
.tl-desc{font-size:12px;color:#40594e;margin-top:4px}
.tl-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.rule-row{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid #d7ede0;border-radius:3px;margin-bottom:8px;min-width:0;transition:border-color .2s ease,transform .2s ease,background .2s ease}
.rule-row:hover{border-color:#86efac;background:#f7fcf8;transform:translateX(2px)}
.rule-ic{width:34px;height:34px;border-radius:3px;background:#dcfce7;color:var(--color-primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rule-ic .material-symbols-outlined{font-size:19px;color:inherit}
.rule-b{min-width:0}
.rule-b b{font-size:12px}
.rule-b p{font-size:11px;color:#52675d;margin-top:3px}
.pbar{height:7px;border-radius:1px;background:#d6e4dc;overflow:hidden;min-width:56px;flex:1}
.pbar>i{display:block;height:100%;border-radius:1px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.steps{display:flex;gap:8px;flex-wrap:wrap;counter-reset:phase}
.step{flex:1;min-width:130px;border:1px solid #d7ede0;border-radius:3px;padding:12px;background:#fff;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;top:23px;right:-9px;width:9px;height:2px;background:#86efac;z-index:2}
.step .s-no{width:25px;height:25px;border-radius:2px;background:#e8f0f1;color:#40594e;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.step.done{border-color:#86efac;background:#f7fcf8}
.step.done .s-no{background:var(--color-primary);color:#fff}
.step.now{border-color:var(--color-accent);box-shadow:inset 0 3px 0 var(--color-accent)}
.step.now .s-no{background:var(--color-accent);color:var(--color-on-accent)}
.step .s-t{font-size:12px;font-weight:700;margin:8px 0 3px}
.step .s-r{font-size:10.5px;color:#52675d}
.step .s-st{font-size:10.5px;font-weight:700;margin-top:7px}
.avatar{width:26px;height:26px;border-radius:3px;background:var(--color-primary);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;flex:0 0 auto}
.list-note{font-size:11.5px;color:#40594e;display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #e2eee6}
.list-note:last-child{border-bottom:none}
.list-note .material-symbols-outlined{font-size:17px;color:var(--color-accent);flex:0 0 auto}
.foot{text-align:center;font-family:"Roboto Mono",monospace;font-size:10px;color:#52675d;margin-top:36px;padding-top:18px;border-top:1px solid var(--color-border)}
#app>.head,#app>.kpis,#app>.card,#app>.grid2,#app>.grid2b{animation:section-in .42s cubic-bezier(.2,.8,.2,1) both}
#app>.kpis{animation-delay:.04s}
#app>.card,#app>.grid2,#app>.grid2b{animation-delay:.08s}
.kpi,.tk,.rule-row,.step{animation:item-in .38s cubic-bezier(.2,.85,.25,1.2) both}
.kpi:nth-child(2),.tk:nth-child(2),.rule-row:nth-child(2),.step:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3),.tk:nth-child(3),.rule-row:nth-child(3),.step:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4),.tk:nth-child(4),.rule-row:nth-child(4),.step:nth-child(4){animation-delay:.15s}
@keyframes section-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes item-in{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .topbar-inner{padding:11px 18px;gap:14px}
  .brand{min-width:auto}.nav{width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .nav button{flex:0 0 auto}
  main{padding:24px 18px 56px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2b{grid-template-columns:1fr}
}
@media(max-width:768px){
  .board{grid-template-columns:repeat(2,minmax(210px,1fr))}
  .head{align-items:flex-start}.head h1{font-size:22px}
  .card{padding:14px}.chart{height:240px}
}
@media(max-width:560px){
  .topbar-inner{padding:10px 14px}.brand-logo{width:38px;height:38px}
  .brand-txt b{font-size:14px}.brand-txt span{font-size:9px}
  .nav button{min-width:42px;justify-content:center;padding:9px}
  .nav button span.lbl{display:none}.nav button.on::after{position:absolute;margin:30px 0 0}
  main{padding:20px 14px 48px}.head{margin-bottom:14px;padding-bottom:14px}
  .head h1{font-size:19px}.head h1::after{display:none}.head p{font-size:12px}
  .pill{width:100%;justify-content:center}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:13px 12px}.kpi .k-val{font-size:22px}.kpi .k-lab{font-size:10px}
  .board{grid-template-columns:1fr}.card h3{align-items:flex-start;flex-wrap:wrap}
  .card h3 .tag{margin-left:0}.steps{display:grid;grid-template-columns:1fr 1fr}
  .step:not(:last-child)::after{display:none}
  table{font-size:11px}.chart.sm{height:210px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}.steps{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div class="brand-txt"><b>EBOM 研發BOM管理</b><span>Engineering BOM Platform · 研發管理</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main><div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-250-ebom/</div>
</main>
<script>
var NAV=[
  {i:0,ic:"account_tree",t:"EBOM 結構"},
  {i:1,ic:"history",t:"版本變更"},
  {i:2,ic:"rule",t:"轉 MBOM"},
  {i:3,ic:"inventory_2",t:"替代料"},
  {i:4,ic:"fact_check",t:"差異稽核"},
  {i:5,ic:"verified",t:"審核發行"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
var AX={color:"#8b8683",fontSize:11};

function head(ic,title,desc,pill){
  return '<div class="head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1><p>'+desc+'</p></div>'+
    (pill?'<span class="pill"><span class="material-symbols-outlined">'+pill.ic+'</span>'+pill.t+'</span>':'')+'</div>';
}
function kpi(list){

/* ===== v5 審核發行 ===== */
function s5(){
  var steps=[
    {no:"1",t:"研發專員 提交",r:"林研發",st:"已完成",cls:"done",sc:"k-up"},
    {no:"2",t:"研發主管 覆核",r:"王主管",st:"已核准",cls:"done",sc:"k-up"},

    {no:"4",t:"ERP 同步發行",r:"系統自動",st:"待執行",cls:"",sc:"k-fl"}
  ];
  var sb='<div class="steps">';
  for(var i=0;i<steps.length;i++){var s=steps[i];
    sb+='<div class="step '+s.cls+'"><div class="s-no">'+s.no+'</div><div class="s-t">'+s.t+'</div>'+
      '<div class="s-r">'+s.r+'</div><div class="s-st '+s.sc+'">'+s.st+'</div></div>';
  }
  sb+='</div>';

  var rows=[
    ["REL-3082","主控板 PCBA V3.0","李管理","2026-08-13","已發行","b-ok","92%"],
    ["REL-3079","馬達驅動總成 V3.2","李管理","2026-08-12","已發行","b-ok","100%"],
    ["REL-3075","外殼鈑金件 V2.4","王主管","2026-08-14","審核中","b-warn","65%"],
    ["REL-3070","散熱鰭片模組 V1.3","王主管","2026-08-14","待簽核","b-info","30%"],
    ["REL-3066","連接線束組 V1.1","許研發","2026-08-13","退回","b-bad","0%"]
  ];

  for(var r=0;r<rows.length;r++){var x=rows[r];
    tb+='<tr><td class="mono">'+x[0]+'</td><td>'+x[1]+'</td><td><span class="avatar">'+x[2].charAt(0)+'</span> '+x[2]+'</td><td>'+x[3]+'</td>'+
      '<td><span class="badge '+x[5]+'">'+x[4]+'</span></td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="pbar"><i style="width:'+x[6]+'"></i></div><span class="mono" style="font-size:11px;color:var(--ink3)">'+x[6]+'</span></div></td></tr>';
  }
  tb+='</tbody></table></div>';

  return head("verified","審核與發行","完成簽核放行後發行 BOM，並同步至 ERP 與後段製造系統，全程稽核留痕。",{ic:"published_with_changes",t:"ERP 同步"})+
    kpi([
      {ic:"verified",lab:"本月發行",val:"58",sub:"準時率 86%",cls:"k-up"},
      {ic:"how_to_reg",lab:"待簽核",val:"7",sub:"逾時 1 件",cls:"k-dn"},
      {ic:"sync",lab:"ERP 同步成功",val:"99.2%",sub:"失敗 0.8%",cls:"k-up"},
      {ic:"schedule",lab:"平均簽核",val:"4.1h",sub:"目標 ≤6h",cls:"k-up"}
    ])+
    '<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">approval</span>簽核發行流程　REL-3075 外殼鈑金件 V2.4</h3>'+sb+'</div>'+
    '<div class="grid2"><div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>發行單清單</h3>'+tb+'</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>專案準時率趨勢</h3><div id="c5" class="chart sm"></div></div></div>';

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];

function show(i){
  killCharts();
  var app=document.getElementById("app");
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  void app.offsetHeight;
  DRAW[i]();
}
(function(){
  var nav=document.getElementById("nav");var h="";
  for(var i=0;i<NAV.length;i++){var n=NAV[i];
    h+='<button data-i="'+n.i+'" onclick="location.hash=\'v'+n.i+'\'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
  }
  nav.innerHTML=h;
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
