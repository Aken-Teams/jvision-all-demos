<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>研發BOM管理系統（EBOM）</title>
<meta name="description" content="EBOM 結構、版本控制、EBOM 轉 MBOM 對應、替代料與差異稽核"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#ea580c;--accent2:#fb923c;--accent-soft:#fff4ed;
  --ink:#1c1917;--ink2:#57534e;--ink3:#8b8683;
  --line:#eee5df;--bg:#faf7f4;--card:#ffffff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;display:inline-block}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(28,25,23,.04)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand-logo .material-symbols-outlined{font-size:22px;color:#fff}
.brand-txt{min-width:0}
.brand-txt b{font-family:"Noto Sans TC";font-size:15px;font-weight:900;display:block;line-height:1.2}
.brand-txt span{font-size:11px;color:var(--ink3)}
.nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0;margin-left:auto}
.nav button{
  display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;
  color:var(--ink2);font-family:"Noto Sans TC";font-size:13px;font-weight:700;cursor:pointer;
  padding:8px 12px;border-radius:9px;white-space:nowrap;transition:.15s;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav button.on{background:var(--accent);color:#fff}
.nav button.on .material-symbols-outlined{color:#fff}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;min-width:0}
.head h1{font-family:"Noto Sans TC";font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.head h1 .material-symbols-outlined{color:var(--accent);font-size:26px}
.head p{font-size:13px;color:var(--ink2);margin-top:4px;max-width:640px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid #ffe0cc;padding:6px 12px;border-radius:999px;white-space:nowrap}
.pill .material-symbols-outlined{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .k-lab{font-size:12px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .k-val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .k-sub{font-size:11.5px;margin-top:2px;font-weight:600}
.k-up{color:var(--ok)}.k-dn{color:var(--bad)}.k-fl{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-family:"Noto Sans TC";font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3);background:var(--bg);padding:3px 9px;border-radius:999px}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:220px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:9px}
.col-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;font-family:"Noto Sans TC";padding:2px 4px 6px}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.col-h .cnt{margin-left:auto;font-size:11px;color:var(--ink3);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:700}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;box-shadow:0 1px 2px rgba(28,25,23,.03);min-width:0}
.tk-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.tk-code{font-family:Inter;font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.tk-pri{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px}
.tk-name{font-size:13px;font-weight:700;font-family:"Noto Sans TC";line-height:1.35;margin-bottom:7px}
.tk-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.tk-meta .material-symbols-outlined{font-size:14px}
.tk-lv{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--info);background:#eff6ff;border-radius:6px;padding:1px 6px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-family:"Noto Sans TC";font-size:11.5px;font-weight:700;color:var(--ink3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
.mono{font-family:Inter;font-weight:700;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-ok{color:var(--ok);background:#f0fdf4}
.b-warn{color:var(--warn);background:#fffbeb}
.b-bad{color:var(--bad);background:#fef2f2}
.b-info{color:var(--info);background:#eff6ff}
.b-mut{color:var(--ink3);background:var(--bg)}
.b-acc{color:var(--accent);background:var(--accent-soft)}
.tree{font-family:Inter;font-size:13px}
.tr-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;min-width:0}
.tr-row:hover{background:var(--accent-soft)}
.tr-row .material-symbols-outlined{font-size:18px;color:var(--accent);flex:0 0 auto}
.tr-code{font-weight:800;font-size:12px;color:var(--ink);flex:0 0 auto}
.tr-nm{font-family:"Noto Sans TC";font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-qty{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:700;white-space:nowrap}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-dot.done{background:var(--accent)}
.tl-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-ver{font-family:Inter;font-weight:800;font-size:13px;color:var(--accent)}
.tl-date{font-size:11px;color:var(--ink3);font-weight:600}
.tl-desc{font-size:12.5px;color:var(--ink2);margin-top:3px;font-family:"Noto Sans TC"}
.tl-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rule-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;min-width:0}
.rule-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rule-ic .material-symbols-outlined{font-size:19px;color:var(--accent)}
.rule-b{min-width:0}
.rule-b b{font-size:13px;font-family:"Noto Sans TC"}
.rule-b p{font-size:12px;color:var(--ink2);margin-top:2px}
.pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;min-width:56px;flex:1}
.pbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:130px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.step .s-no{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:Inter}
.step.done .s-no{background:var(--ok);color:#fff}
.step.now .s-no{background:var(--accent);color:#fff}
.step .s-t{font-size:12.5px;font-weight:800;font-family:"Noto Sans TC";margin:8px 0 3px}
.step .s-r{font-size:11px;color:var(--ink3)}
.step .s-st{font-size:10.5px;font-weight:700;margin-top:6px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-family:Inter;flex:0 0 auto}
.list-note{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.list-note:last-child{border-bottom:none}
.list-note .material-symbols-outlined{font-size:17px;color:var(--accent);flex:0 0 auto}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.grid2b{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button span.lbl{display:none}
  .nav button{padding:8px 9px}
  .board{grid-template-columns:1fr}
  .head h1{font-size:19px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div class="brand-txt"><b>EBOM 研發BOM管理</b><span>Engineering BOM Platform · 研發管理</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main><div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-250-ebom/</div>
</main>
<script>
var NAV=[
  {i:0,ic:"account_tree",t:"EBOM 結構"},
  {i:1,ic:"history",t:"版本變更"},
  {i:2,ic:"rule",t:"轉 MBOM"},
  {i:3,ic:"inventory_2",t:"替代料"},
  {i:4,ic:"fact_check",t:"差異稽核"},
  {i:5,ic:"verified",t:"審核發行"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
var AX={color:"#8b8683",fontSize:11};

function head(ic,title,desc,pill){
  return '<div class="head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1><p>'+desc+'</p></div>'+
    (pill?'<span class="pill"><span class="material-symbols-outlined">'+pill.ic+'</span>'+pill.t+'</span>':'')+'</div>';
}
function kpi(list){
  var h='<div class="kpis">';
  for(var i=0;i<list.length;i++){var k=list[i];
    h+='<div class="kpi"><div class="k-lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div>'+
       '<div class="k-val">'+k.val+'</div><div class="k-sub '+(k.cls||'k-fl')+'">'+k.sub+'</div></div>';}
  return h+'</div>';
}

/* ===== v0 EBOM 結構 (kanban signature) ===== */
function s0(){
  var K=[
    {c:"#94a3b8",t:"草稿建立",items:[
      {code:"EB-A310",n:"主控板 PCBA 總成",pri:"中",lv:"L0",own:"林研發",qty:"1 EA",pc:"b-mut"},
      {code:"EB-A312",n:"電源模組子件",pri:"低",lv:"L1",own:"周工程",qty:"1 EA",pc:"b-mut"}
    ]},
    {c:"#fb923c",t:"結構維護中",items:[
      {code:"EB-B205",n:"馬達驅動總成",pri:"高",lv:"L0",own:"陳設計",qty:"1 EA",pc:"b-bad"},
      {code:"EB-B208",n:"齒輪箱組件",pri:"中",lv:"L1",own:"陳設計",qty:"2 EA",pc:"b-warn"},
      {code:"EB-B211",n:"軸承壓板",pri:"低",lv:"L2",own:"許研發",qty:"4 EA",pc:"b-mut"}
    ]},
    {c:"#2563eb",t:"待審核",items:[
      {code:"EB-C104",n:"外殼鈑金件總成",pri:"高",lv:"L0",own:"王主管",qty:"1 EA",pc:"b-bad"},
      {code:"EB-C107",n:"散熱鰭片模組",pri:"中",lv:"L1",own:"王主管",qty:"1 EA",pc:"b-warn"}
    ]},
    {c:"#16a34a",t:"已凍結",items:[
      {code:"EB-D501",n:"感測器介面板",pri:"中",lv:"L0",own:"李管理",qty:"1 EA",pc:"b-warn"},
      {code:"EB-D503",n:"連接線束組",pri:"低",lv:"L1",own:"李管理",qty:"3 EA",pc:"b-mut"}
    ]}
  ];
  var board='<div class="board">';
  for(var i=0;i<K.length;i++){var col=K[i];
    board+='<div class="col"><div class="col-h"><span class="dot" style="background:'+col.c+'"></span>'+col.t+
      '<span class="cnt">'+col.items.length+'</span></div>';
    for(var j=0;j<col.items.length;j++){var it=col.items[j];
      board+='<div class="tk"><div class="tk-top"><span class="tk-code">'+it.code+'</span>'+
        '<span class="tk-pri badge '+it.pc+'">'+it.pri+'</span></div>'+
        '<div class="tk-name">'+it.n+'</div>'+
        '<div class="tk-meta"><span class="tk-lv">'+it.lv+'</span>'+
        '<span><span class="material-symbols-outlined">person</span>'+it.own+'</span>'+
        '<span><span class="material-symbols-outlined">tag</span>'+it.qty+'</span></div></div>';
    }
    board+='</div>';
  }
  board+='</div>';

  var tree=[
    {d:0,ic:"account_tree",code:"EB-B205",n:"馬達驅動總成",qty:"1 EA"},
    {d:1,ic:"subdirectory_arrow_right",code:"EB-B208",n:"齒輪箱組件",qty:"2 EA"},
    {d:2,ic:"subdirectory_arrow_right",code:"EB-B211",n:"軸承壓板",qty:"4 EA"},
    {d:2,ic:"subdirectory_arrow_right",code:"MT-3120",n:"精密軸承 6204",qty:"8 EA"},
    {d:1,ic:"subdirectory_arrow_right",code:"MT-2210",n:"直流無刷馬達 48V",qty:"1 EA"},
    {d:1,ic:"subdirectory_arrow_right",code:"MT-2215",n:"驅動器控制板",qty:"1 EA"}
  ];
  var th='<div class="tree">';
  for(var t=0;t<tree.length;t++){var r=tree[t];
    th+='<div class="tr-row" style="padding-left:'+(10+r.d*22)+'px"><span class="material-symbols-outlined">'+r.ic+'</span>'+
      '<span class="tr-code">'+r.code+'</span><span class="tr-nm">'+r.n+'</span><span class="tr-qty">'+r.qty+'</span></div>';
  }
  th+='</div>';

  return head("account_tree","EBOM 結構管理","以看板檢視各料件的建立狀態，並展開多階 EBOM 樹狀結構、維護用量與屬性。",{ic:"bolt",t:"即時同步"})+
    kpi([
      {ic:"account_tree",lab:"EBOM 品項",val:"1,284",sub:"本月新增 42 項",cls:"k-up"},
      {ic:"layers",lab:"平均結構階數",val:"4.6",sub:"最深 7 階",cls:"k-fl"},
      {ic:"pending_actions",lab:"待審核結構",val:"18",sub:"較上週 -5",cls:"k-up"},
      {ic:"verified",lab:"已凍結版次",val:"93%",sub:"目標 95%",cls:"k-fl"}
    ])+
    '<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">view_kanban</span>EBOM 結構作業看板<span class="tag">拖曳式流轉</span></h3><div style="overflow-x:auto">'+board+'</div></div>'+
    '<div class="grid2"><div class="card"><h3><span class="material-symbols-outlined">account_tree</span>多階結構展開　EB-B205 馬達驅動總成</h3>'+th+'</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>品項階層分布</h3><div id="c0" class="chart sm"></div></div></div>';
}
function d0(){
  mk("c0",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:AX},
    series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],avoidLabelOverlap:true,
      itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
      data:[
        {value:312,name:"L0 總成",itemStyle:{color:"#ea580c"}},
        {value:468,name:"L1 組件",itemStyle:{color:"#fb923c"}},
        {value:340,name:"L2 子件",itemStyle:{color:"#fdba74"}},
        {value:164,name:"L3+ 料件",itemStyle:{color:"#fed7aa"}}
      ]}]});
}

/* ===== v1 版本變更 ===== */
function s1(){
  var tl=[
    {done:true,ver:"V3.2",date:"2026-08-11",d:"馬達驅動總成 齒輪箱齒比修正，替換 MT-2210 至 48V 型號。",chips:[["ECN-2261","b-acc"],["生效中","b-ok"]]},
    {done:true,ver:"V3.1",date:"2026-07-28",d:"新增散熱鰭片模組 EB-C107，調整外殼鈑金開孔。",chips:[["ECN-2247","b-acc"],["已凍結","b-mut"]]},
    {done:true,ver:"V3.0",date:"2026-07-06",d:"主控板 PCBA 大改版，導入新版電源模組子件。",chips:[["ECN-2210","b-acc"],["已凍結","b-mut"]]},
    {done:false,ver:"V3.3",date:"審核中",d:"連接線束組線徑變更提案，等待研發主管簽核。",chips:[["ECN-2274","b-acc"],["待審核","b-warn"]]}
  ];
  var th='<div class="tl">';
  for(var i=0;i<tl.length;i++){var v=tl[i];
    th+='<div class="tl-item"><div class="tl-dot '+(v.done?"done":"")+'"></div>'+
      '<div class="tl-hd"><span class="tl-ver">'+v.ver+'</span><span class="tl-date">'+v.date+'</span></div>'+
      '<div class="tl-desc">'+v.d+'</div><div class="tl-chips">';
    for(var j=0;j<v.chips.length;j++){th+='<span class="badge '+v.chips[j][1]+'">'+v.chips[j][0]+'</span>';}
    th+='</div></div>';
  }
  th+='</div>';
