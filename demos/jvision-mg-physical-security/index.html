<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
--color-primary:#0D9488;--color-on-primary:#000;--color-secondary:#2DD4BF;--color-on-secondary:#0F172A;
--color-accent:#D97706;--color-on-accent:#000;--color-background:#F0FDFA;--color-foreground:#134E4A;
--color-card:#FFF;--color-card-foreground:#134E4A;--color-muted:#E8F1F4;--color-muted-foreground:#475569;
--color-border:#5EEAD4;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#0D9488;
--blue:#0D9488;--ink:#134E4A;--muted:#475569;--line:#5EEAD4;
--ok:#087A55;--warn:#9A4D00;--bad:#B91C1C;--panel:#FFF;--bg:#F0FDFA;--shadow:#134E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Crimson Pro","Noto Serif TC",serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,a{font:inherit}
button{cursor:pointer}
h1,h2,h3,h4,.brand-txt,.nav button,.tag,th{font-family:"Cinzel","Noto Serif TC",serif}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.app{min-height:100vh}
.sidebar{position:sticky;z-index:20;top:0;display:grid;grid-template-columns:minmax(230px,1fr) auto minmax(180px,1fr);align-items:stretch;background:var(--panel);border-bottom:4px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px;border-right:2px solid var(--ink)}
.brand-logo{display:grid;place-items:center;width:46px;height:46px;color:#000;background:var(--color-primary);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.04em}
.brand-txt span{display:block;margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:.16em}
.nav{display:flex;overflow-x:auto;scrollbar-width:thin}
.nav button{position:relative;display:flex;align-items:center;gap:8px;min-height:70px;padding:10px 16px;color:var(--ink);background:#fff;border:0;border-right:2px solid var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.nav button:first-child{border-left:2px solid var(--ink)}
.nav button:hover{background:var(--color-muted)}
.nav button.on{color:#000;background:var(--color-secondary);box-shadow:inset 0 -8px 0 var(--color-accent)}
.nav button .idx{font-family:"Crimson Pro",serif;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.side-foot{align-self:center;padding:8px 20px;color:var(--muted);font-size:12px;text-align:right;line-height:1.4}
.side-foot b{color:var(--ink)}
.main{width:min(1600px,100%);margin:auto;padding:28px 30px 64px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;padding:22px;background:var(--color-primary);color:#000;border:3px solid var(--ink);box-shadow:9px 9px 0 var(--ink)}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(25px,3vw,44px);font-weight:600;line-height:1.05;letter-spacing:-.025em}
.topbar h1 .material-symbols-outlined{font-size:1em}
.topbar .sub{margin-top:8px;font-size:15px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 12px;color:var(--ink);background:#fff;border:2px solid var(--ink);font-family:"Crimson Pro",serif;font-weight:600}
.chip .dot{width:10px;height:10px;background:var(--ok);border:2px solid #000}
.avatar{display:grid;place-items:center;width:38px;height:38px;color:#000;background:var(--color-accent);border:2px solid var(--ink);font-weight:700}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1.4fr 1fr}
.card,.tile{min-width:0;background:var(--panel);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--color-border)}
.card{padding:18px}.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{display:flex;align-items:center;gap:8px;margin:0;font-size:17px;font-weight:600}
.card-h h3 .material-symbols-outlined{color:var(--blue)}
.card-h .hint{color:var(--muted);font-size:13px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:18px;overflow:hidden}
.tile:nth-child(even){transform:translateY(10px)}
.tile::after{content:"";position:absolute;right:-24px;bottom:-28px;width:82px;height:82px;background:var(--color-secondary);border:2px solid var(--ink);transform:rotate(18deg)}
.tile .ti{z-index:1;grid-row:1/4;display:grid;place-items:center;width:42px;height:42px;color:#000;background:var(--color-accent);border:2px solid var(--ink)}
.tile b{z-index:1;font-family:"Cinzel","Noto Serif TC",serif;font-size:14px}
.tile .tv{z-index:1;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile p{z-index:1;margin:2px 0 0;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px 14px;color:#000;background:var(--color-secondary);border-right:1px solid var(--ink);border-bottom:3px solid var(--ink);font-size:12px;font-weight:600;letter-spacing:.035em;white-space:nowrap}
th:last-child{border-right:0}
td{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--ink);white-space:nowrap}
td:last-child{border-right:0}
tbody tr:nth-child(even){background:var(--color-background)}
tbody tr:hover{background:#CCFBF1}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;font-size:11px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;background:currentColor}
.t-ok{color:#066444;background:#D1FAE5}.t-warn{color:#8A4500;background:#FEF3C7}.t-bad{color:#A11212;background:#FEE2E2}
.t-info{color:#3730A3;background:#E0E7FF}.t-gray{color:#334155;background:#E2E8F0}.t-acc,.t-pink{color:#075F58;background:#CCFBF1}
.apexcharts-text{font-family:"Crimson Pro",serif!important}
@media(min-width:901px){
.card:nth-child(2){transform:translateY(12px)}
.grid.g4+.grid{margin-bottom:12px}
}
@media(max-width:1100px){
.sidebar{grid-template-columns:auto 1fr}.side-foot{display:none}.g4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
.sidebar{position:static;display:block}.brand{border-right:0;border-bottom:2px solid var(--ink)}
.nav button{flex:1 0 auto;min-height:52px}.main{padding:18px 14px 48px}
.topbar{align-items:flex-start;flex-direction:column;box-shadow:6px 6px 0 var(--ink)}
.g2,.g3,.g23,.g32{grid-template-columns:1fr}.tile:nth-child(even),.card:nth-child(2){transform:none}
}
@media(max-width:560px){
.g4{grid-template-columns:1fr}.nav button{padding:9px 12px}.nav button .txt{display:none}
.topbar h1{font-size:25px}.top-right{justify-content:flex-start}.card{padding:14px}
}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
#screen>.grid>*{animation:reveal .4s both}
#screen>.grid>*:nth-child(2){animation-delay:.06s}
#screen>.grid>*:nth-child(3){animation-delay:.12s}
#screen>.grid>*:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tbl(h,r){return'<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+r.map(function(x){return'<tr>'+x.map(function(c,i){return'<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function card(t,ic,body,hint){return'<section class="card"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function cardT(t,ic,body,hint){return'<section class="card pad0"><div class="card-h" style="padding:18px 18px 0"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function tile(ic,t,v,p){return'<article class="tile"><div class="ti"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>'}
var AX={style:{colors:"#475569",fontSize:"12px"}};
var CB={redrawOnParentResize:true,redrawOnWindowResize:true,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Crimson Pro",serif'};
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function mkBar(el,cats,data,name){push(el,{chart:Object.assign({},CB,{type:"bar",height:250}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#5EEAD4",strokeDashArray:0},dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:0,columnWidth:"54%"}},colors:["#0D9488"],tooltip:{theme:"light"}})}
function mkDonut(el,labels,data){push(el,{chart:Object.assign({},CB,{type:"donut",height:250}),series:data,labels:labels,colors:["#0D9488","#D97706","#2DD4BF","#134E4A","#94A3B8","#F59E0B"],legend:{position:"bottom",fontSize:"13px"},dataLabels:{enabled:false},plotOptions:{pie:{donut:{size:"52%"}}},stroke:{width:3,colors:["#134E4A"]},tooltip:{theme:"light"}})}
function mkRadar(el,cats,data,name){push(el,{chart:Object.assign({},CB,{type:"radar",height:280}),series:[{name:name,data:data}],xaxis:{categories:cats},yaxis:{show:false},colors:["#0D9488"],markers:{size:5,strokeColors:"#134E4A"},fill:{opacity:.22},dataLabels:{enabled:false},tooltip:{theme:"light"}})}
function mkLine2(el,cats,s1,s2){push(el,{chart:Object.assign({},CB,{type:"line",height:250}),series:[s1,s2],xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#5EEAD4",strokeDashArray:0},dataLabels:{enabled:false},stroke:{curve:"straight",width:[4,3],dashArray:[0,7]},markers:{size:[4,3]},colors:["#0D9488","#D97706"],legend:{position:"top",fontSize:"13px"},tooltip:{theme:"light"}})}

var RENDER=[v0,v1,v2,v3];
function buildNav(){
var n=document.getElementById("nav");
n.innerHTML=MODULES.map(function(m,i){return'<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})});
}
function show(i){
killCharts();
var m=MODULES[i];
document.getElementById("th-ico").textContent=m.icon;
document.getElementById("th-title").textContent=m.name;
document.getElementById("th-sub").textContent=m.sub;
Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
var on=+b.getAttribute("data-i")===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")
});
RENDER[i](document.getElementById("screen"));
}
function fromHash(){
var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
show(m?Math.min(+m[1],MODULES.length-1):0);
try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
