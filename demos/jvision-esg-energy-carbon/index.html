<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>能源與碳排管理｜Jvision 系統 Demo</title>
<meta name="description" content="碳盤查、能源監控到減碳目標的永續管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --vio:#7c3aed; --vio-d:#6d28d9; --vio2:#a78bfa; --ink:#2e1065; --body:#4b4667; --muted:#8a83a6; --line:#eae6f7; --bg:#f6f4fc; --card:#fff; --green:#16a34a; --amber:#d97706; --red:#dc2626; --sky:#0ea5e9; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .shell{ display:grid; grid-template-columns:246px 1fr; min-height:100vh; }
  .side{ background:linear-gradient(180deg,var(--vio),var(--vio-d)); color:#ede9fe; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; min-width:0; }
  .brand{ padding:20px; display:flex; align-items:center; gap:11px; border-bottom:1px solid rgba(255,255,255,.14); }
  .brand .lg{ width:42px; height:42px; border-radius:13px; background:#fff; color:var(--vio); display:grid; place-content:center; } .brand .lg .material-symbols-outlined{ font-size:24px; }
  .brand b{ color:#fff; font-size:15px; display:block; } .brand small{ color:#ddd6fe; font-size:11px; }
  .nav{ flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .nav .t{ font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:#c4b5fd; padding:10px 12px 6px; }
  .nav button{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0; color:#ede9fe; font:inherit; font-size:14px; font-weight:600; padding:11px 12px; border-radius:11px; cursor:pointer; white-space:nowrap; }
  .nav button .material-symbols-outlined{ font-size:21px; color:#d8ccfb; }
  .nav button:hover{ background:rgba(255,255,255,.12); } .nav button.on{ background:#fff; color:var(--vio); } .nav button.on .material-symbols-outlined{ color:var(--vio); }
  .side-f{ padding:16px; border-top:1px solid rgba(255,255,255,.14); }
  .quota{ font-size:11px; color:#ddd6fe; } .quota b{ color:#fff; font-size:18px; display:block; } .qbar{ height:7px; border-radius:999px; background:rgba(255,255,255,.22); overflow:hidden; margin-top:7px; } .qbar span{ display:block; height:100%; background:#c4b5fd; }
  .main{ min-width:0; }
  .top{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px; }
  .top h1{ margin:0; font-size:19px; font-weight:900; color:var(--ink); } .top .sub{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:800; }
  .pill .dot{ width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.5); animation:pulse 2s infinite; } @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(34,197,94,.5);} 70%{ box-shadow:0 0 0 7px rgba(34,197,94,0);} 100%{ box-shadow:0 0 0 0 rgba(34,197,94,0);} }
  .ava{ width:34px; height:34px; border-radius:50%; background:#ddd6fe; color:var(--vio); font-weight:800; display:grid; place-content:center; }
  .body{ padding:22px 26px 44px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--vio); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; } .btn.ghost{ background:#fff; color:var(--vio); border:1px solid var(--line); } .btn.sm{ height:30px; padding:0 11px; font-size:12px; } .btn .material-symbols-outlined{ font-size:18px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; } .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); } .vh p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; } .kpis>*{ min-width:0; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; } .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; align-items:center; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--vio); } .kpi .v{ font-size:26px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; } .kpi .d{ font-size:12px; font-weight:800; margin-top:4px; } .kpi .d.up{ color:var(--green);} .kpi .d.dn{ color:var(--red);} .kpi .d.info{ color:var(--vio);}
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g-3-2{ grid-template-columns:1.4fr 1fr; } .g-2-3{ grid-template-columns:1fr 1.4fr; } .g-11{ grid-template-columns:1fr 1fr; } .g-split{ grid-template-columns:340px 1fr; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; } .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--vio); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--vio); cursor:pointer; }
  .chart{ width:100%; height:270px; }
  /* split list-detail signature */
  .pane{ background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .pane .ph{ padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; color:var(--ink); } .pane .ph .material-symbols-outlined{ color:var(--vio); font-size:20px; } .pane .ph .n{ margin-left:auto; font-size:11px; font-weight:800; color:var(--vio); background:#ede9fe; border-radius:999px; padding:2px 9px; }
  .litem{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer; } .litem:last-child{ border-bottom:0; } .litem.on{ background:#f5f0ff; box-shadow:inset 3px 0 0 var(--vio); } .litem:hover{ background:var(--bg); }
  .lic{ width:38px; height:38px; border-radius:11px; display:grid; place-content:center; flex:none; color:#fff; } .lic .material-symbols-outlined{ font-size:20px; }
  .litem b{ color:var(--ink); font-size:14px; display:block; } .litem small{ color:var(--muted); font-size:11.5px; }
  .litem .rt{ margin-left:auto; text-align:right; } .litem .rt b{ font-size:14px; } .litem .rt small{ font-size:11px; }
  .barmini{ height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px; } .barmini span{ display:block; height:100%; }
  .detail-hero{ display:flex; align-items:center; gap:14px; margin-bottom:16px; } .detail-hero .dh-ic{ width:56px; height:56px; border-radius:16px; display:grid; place-content:center; color:#fff; } .detail-hero .dh-ic .material-symbols-outlined{ font-size:28px; } .detail-hero b{ font-size:19px; color:var(--ink); } .detail-hero small{ color:var(--muted); font-size:13px; }
  .mgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:16px; } .ms{ background:var(--bg); border-radius:13px; padding:12px 14px; } .ms b{ display:block; font-size:20px; color:var(--ink); font-weight:900; } .ms span{ font-size:11px; color:var(--muted); }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; } .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:var(--bg); white-space:nowrap; } .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:var(--bg); } .tbl tfoot td{ font-weight:900; color:var(--ink); background:#faf8ff; }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; } .t-s1{ background:#fee2e2; color:#b91c1c; } .t-s2{ background:#e0f2fe; color:#0369a1; } .t-s3{ background:#f3e8ff; color:#7e22ce; } .t-ok{ background:#dcfce7; color:#166534; } .t-wait{ background:#fef3c7; color:#92400e; } .t-run{ background:#ede9fe; color:#6d28d9; }
  .prog{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; } .prog span{ display:block; height:100%; background:linear-gradient(90deg,var(--vio),var(--vio2)); }
  /* target rings (radial) */
  .ring{ display:flex; align-items:center; gap:16px; padding:14px 0; border-top:1px solid var(--line); } .ring:first-of-type{ border-top:0; } .ring .rc{ width:66px; height:66px; border-radius:50%; flex:none; display:grid; place-content:center; font-weight:900; color:var(--ink); font-size:14px; } .ring b{ color:var(--ink); font-size:14px; } .ring small{ color:var(--muted); font-size:12px; display:block; }
  /* board */
  .board{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(238px,1fr); gap:12px; overflow-x:auto; }
  .bcol{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:11px; min-width:0; } .bch{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .bch b{ color:var(--ink); font-size:13px; } .bch .sum{ font-size:11px; font-weight:800; color:var(--vio); background:#ede9fe; border-radius:999px; padding:2px 9px; }
  .task{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:9px; box-shadow:0 1px 3px rgba(46,16,101,.05); } .task b{ color:var(--ink); font-size:13px; } .task .save{ color:var(--green); font-weight:900; font-size:15px; margin:5px 0; } .task small{ color:var(--muted); font-size:11px; display:block; } .task .tf{ display:flex; align-items:center; gap:6px; margin-top:8px; } .av2{ width:22px; height:22px; border-radius:50%; background:#ddd6fe; color:var(--vio); font-size:10px; font-weight:800; display:grid; place-content:center; }
  /* ai */
  .ai-row{ display:flex; gap:11px; background:#ede9fe; border-radius:13px; padding:13px; margin-bottom:11px; } .ai-ic{ width:34px; height:34px; border-radius:10px; background:var(--vio); color:#fff; display:grid; place-content:center; flex:none; } .ai-row p{ margin:0; font-size:13px; color:var(--body); line-height:1.55; } .ai-row b{ color:var(--ink); }
  .doc{ border:1px solid var(--line); border-radius:13px; padding:16px 18px; background:#fff; font-size:13px; line-height:1.7; color:var(--body); } .doc h4{ margin:0 0 4px; color:var(--ink); font-size:15px; } .doc .sec{ margin-top:14px; } .doc .sec b{ color:var(--vio); font-size:12px; letter-spacing:.03em; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; } .chip{ font-size:11.5px; font-weight:700; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:5px 11px; color:var(--body); } .chip.on{ background:var(--vio); color:#fff; border-color:var(--vio); }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); margin-top:10px; } .legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px; }
  @media (max-width:860px){ .shell{ grid-template-columns:1fr; } .shell>*{ min-width:0; } .side{ position:static; height:auto; } .nav{ flex-direction:row; flex-wrap:wrap; overflow-x:auto; } .nav button{ flex:none; } .nav .t,.side-f{ display:none; } .g-3-2,.g-2-3,.g-11,.g-split{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .nav button span:not(.material-symbols-outlined){ display:none; } .nav button{ padding:11px; } .top{ flex-wrap:wrap; padding:12px 16px; } .body{ padding:16px 14px 30px; } .kpis{ grid-template-columns:1fr 1fr; } .pill span:not(.dot){ } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">eco</span></span><div><b>永續碳管理</b><small>綠源工業 · ESG 平台</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><div class="quota">本年減碳達成<b>18,240 tCO₂e</b><div class="qbar"><span style="width:83%;"></span></div><span style="font-size:11px;">目標 22,000 · 達成 83%</span></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">能源即時監控</h1><div class="sub" id="vsub">永續管理團隊 · 2026/08/13 09:20</div></div>
      <div class="r"><span class="pill"><span class="dot"></span>7 座廠區連線中</span><span class="ava">永</span></div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MODS=[
 ["bolt","能源即時監控"],
 ["co2","溫室氣體盤查"],
 ["category","排放分類係數"],
 ["flag","減碳目標追蹤"],
 ["checklist","減碳任務管理"],
 ["auto_awesome","AI 永續摘要"]
];
const DESC=[
 "各廠區電力、蒸氣、燃氣用能即時看板",
 "範疇一/二/三排放源逐項盤查與活動數據",
 "排放源清冊、係數庫版本與 GWP 對照",
 "SBTi 目標路徑與減碳專案進度看板",
 "減碳措施派工、負責人與節能量追蹤",
 "自動生成盤查摘要與 GRI/ISO 報告草稿"
];

/* ---- screen 0 : energy monitor (split list-detail signature) ---- */
const SITES=[
 {id:"P1",name:"台中沖壓一廠",kw:2840,peak:3200,pct:89,co2:1.42,steam:0,gas:0,st:"高載",cls:"s1",dot:"#dc2626"},
 {id:"P2",name:"彰化組裝二廠",kw:1980,peak:2600,pct:76,co2:0.99,steam:1.2,gas:0.4,st:"正常",cls:"s2",dot:"#0ea5e9"},
 {id:"P3",name:"台南塗裝三廠",kw:2210,peak:2500,pct:88,co2:1.10,steam:2.8,gas:1.6,st:"接近尖峰",cls:"s1",dot:"#d97706"},
 {id:"P4",name:"桃園電鍍四廠",kw:1560,peak:2200,pct:71,co2:0.78,steam:0.6,gas:0.9,st:"正常",cls:"s2",dot:"#0ea5e9"},
 {id:"P5",name:"高雄鑄造五廠",kw:3120,peak:3400,pct:92,co2:1.56,steam:0,gas:3.2,st:"高載",cls:"s1",dot:"#dc2626"},
 {id:"P6",name:"新竹研發六廠",kw:640,peak:1000,pct:64,co2:0.32,steam:0,gas:0,st:"正常",cls:"s2",dot:"#0ea5e9"},
 {id:"P7","name":"苗栗物流七廠",kw:410,peak:800,pct:51,co2:0.21,steam:0,gas:0,st:"低載",cls:"s3",dot:"#7c3aed"}
];
let siteSel=0;
function screen0(){
 const rows=SITES.map((s,i)=>`<div class="litem ${i===siteSel?"on":""}" data-site="${i}">
   <span class="lic" style="background:${s.dot};"><span class="material-symbols-outlined">${s.gas>0?"local_fire_department":s.steam>0?"heat_pump":"factory"}</span></span>
   <div style="min-width:0;"><b>${s.name}</b><small>${s.id} · 即時 ${s.kw.toLocaleString()} kW</small><div class="barmini"><span style="width:${s.pct}%;background:${s.dot};"></span></div></div>
   <div class="rt"><b style="color:${s.dot};">${s.pct}%</b><small>${s.st}</small></div></div>`).join("");
 const s=SITES[siteSel]||SITES[0];
 const total=SITES.reduce((a,x)=>a+x.kw,0);
 return kpiRow([
   ["bolt","即時總用電",total.toLocaleString(),"kW","+3.2% vs 昨日","dn"],
   ["co2","今日碳排",SITES.reduce((a,x)=>a+x.co2,0).toFixed(1),"tCO₂e","範疇二占 71%","info"],
   ["heat_pump","蒸氣總量",SITES.reduce((a,x)=>a+x.steam,0).toFixed(1),"t/h","3 廠使用","info"],
   ["warning","需量預警","2","座","P1、P5 逼近契約容量","dn"]
 ])+
 `<div class="grid g-split">
   <div class="pane"><div class="ph"><span class="material-symbols-outlined">apartment</span>廠區用能清單<span class="n">7 座</span></div>${rows}</div>
   <div class="card">
     <div class="detail-hero"><span class="dh-ic" style="background:${s.dot};"><span class="material-symbols-outlined">factory</span></span><div><b>${s.name}</b><br/><small>${s.id} · 契約容量 ${s.peak.toLocaleString()} kW · 狀態：${s.st}</small></div><button class="btn ghost" style="margin-left:auto;">用能報告</button></div>
     <div class="mgrid">
       <div class="ms"><b>${s.kw.toLocaleString()}</b><span>即時用電 kW</span></div>
       <div class="ms"><b>${s.pct}%</b><span>需量負載率</span></div>
       <div class="ms"><b>${s.steam}</b><span>蒸氣 t/h</span></div>
       <div class="ms"><b>${s.gas}</b><span>天然氣 km³/h</span></div>
       <div class="ms"><b>${s.co2}</b><span>時碳排 tCO₂e</span></div>
     </div>
     <h3 style="font-size:14px;color:var(--ink);margin:4px 0 6px;">今日 24 小時用電負載（kW）</h3>
     <div id="c0load" class="chart" style="height:230px;"></div>
     <div class="legend"><span><i style="background:${s.dot};"></i>即時用電</span><span><i style="background:#cbd5e1;"></i>契約容量上限</span></div>
   </div>
 </div>`;
}

/* ---- screen 1 : GHG inventory ---- */
const GHG=[
 ["範疇一","柴油鍋爐燃燒","移動/固定燃燒","82,400 L","2.68","220.8","s1"],
 ["範疇一","天然氣製程","固定燃燒","46,200 m³","1.88","86.9","s1"],
 ["範疇一","冷媒逸散 R-410A","逸散排放","64 kg","2.09","133.8","s1"],
 ["範疇二","外購電力","電力","3,120,000 kWh","0.494","1541.3","s2"],
 ["範疇二","外購蒸氣","蒸氣","18,600 GJ","0.065","120.9","s2"],
 ["範疇三","上游運輸","貨運物流","214,000 t·km","0.096","20.5","s3"],
 ["範疇三","商務差旅","員工通勤","96,400 km","0.170","16.4","s3"],
 ["範疇三","廢棄物處理","委外處理","128 t","0.580","74.2","s3"]
];
function screen1(){
 const s1=GHG.filter(g=>g[0]==="範疇一").reduce((a,g)=>a+ +g[5],0);
 const s2=GHG.filter(g=>g[0]==="範疇二").reduce((a,g)=>a+ +g[5],0);
 const s3=GHG.filter(g=>g[0]==="範疇三").reduce((a,g)=>a+ +g[5],0);
 const tot=(s1+s2+s3);
 return kpiRow([
   ["co2","盤查總排放",tot.toFixed(1),"tCO₂e","2026 Q2 期間","info"],
   ["local_fire_department","範疇一",s1.toFixed(1),"tCO₂e",(s1/tot*100).toFixed(0)+"%","info"],
   ["bolt","範疇二",s2.toFixed(1),"tCO₂e",(s2/tot*100).toFixed(0)+"%","info"],
   ["local_shipping","範疇三",s3.toFixed(1),"tCO₂e",(s3/tot*100).toFixed(0)+"%","info"]
 ])+
 `<div class="grid g-3-2">
   <div class="card" style="padding:0;"><div style="padding:16px 20px 4px;"><h3><span class="material-symbols-outlined">table_chart</span>排放源盤查明細<span class="grow">匯出 CSV ›</span></h3></div>
     <div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>範疇</th><th>排放源</th><th>類別</th><th>活動數據</th><th>係數(kgCO₂e)</th><th>排放量</th></tr></thead><tbody>
