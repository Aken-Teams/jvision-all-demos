:root{

  --color-muted:#e8f1f3;

  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{

  color:#164e3f;

  font-size:14px;
  line-height:1.5;

}
button{font:inherit}
button,.chip,.litem,[data-i],[data-site],[data-cat]{cursor:pointer}
button:focus-visible,.chip:focus-visible,.litem:focus-visible,a:focus-visible{

}
.material-symbols-outlined{

}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{

}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.15)}
.brand-mark{

}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.01em}
.brand small{display:block;margin-top:2px;color:#a7f3d0;font-size:11px}
.nav{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 12px}
.nav-title{

}
.nav button{

  border:1px solid transparent;border-radius:7px;padding:10px 11px;

}
.nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.13)}
.nav button.on{background:#ecfdf5;border-color:#a7f3d0;color:#064e3b;font-weight:700}
.nav button .material-symbols-outlined{font-size:20px}
.side-foot{padding:17px 18px 20px;border-top:1px solid rgba(255,255,255,.15)}
.quota{color:#a7f3d0;font-size:11px}
.quota b{display:block;margin:3px 0;color:#fff;font:700 18px "Fira Code",monospace}
.qbar,.prog,.barmini{overflow:hidden;background:#dbe8e5;border-radius:999px}
.qbar{height:6px;margin:9px 0 6px;background:rgba(255,255,255,.18)}
.qbar span,.prog span,.barmini span{display:block;height:100%;background:var(--color-secondary)}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  min-height:72px;padding:13px 28px;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px);
}
.top h1{margin:0;color:var(--ink);font-size:19px;line-height:1.3}
.top .sub{margin-top:3px;color:var(--muted);font:500 11px "Fira Code",monospace}
.top-right{margin-left:auto;display:flex;align-items:center;gap:11px}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;
  background:#ecfdf5;border:1px solid #6ee7b7;border-radius:999px;
  color:#065f46;font-size:12px;font-weight:700;
}
.dot{width:8px;height:8px;border-radius:50%;background:#047857}
.avatar{
  width:35px;height:35px;display:grid;place-items:center;border-radius:50%;
  background:#064e3b;color:#fff;font-weight:700;
}
.body{max-width:1600px;margin:auto;padding:24px 28px 48px}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:19px}
.vh h2{margin:0;color:var(--ink);font-size:22px;line-height:1.25;letter-spacing:-.02em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13px}
.btn{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:0 15px;border:1px solid #047857;border-radius:7px;
  background:var(--color-primary);color:#001b12;font-weight:700;

.btn:hover{background:#10b981;box-shadow:0 5px 14px rgba(5,150,105,.2);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:#065f46;border-color:#6ee7b7;box-shadow:none}
.btn.ghost:hover{background:#ecfdf5;border-color:#059669}
.btn.sm{min-height:34px;padding:0 11px;font-size:12px}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi,.card,.pane{
  min-width:0;background:var(--color-card);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);
}
.kpi{position:relative;padding:16px 17px;border-top:3px solid #34d399}
.kpi .label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .label .material-symbols-outlined{color:#047857;font-size:18px}
.kpi .value{margin-top:7px;color:var(--ink);font:700 26px/1.25 "Fira Code",monospace;letter-spacing:-.035em}
.kpi .value small{color:var(--muted);font:500 12px "Fira Sans",sans-serif;letter-spacing:0}
.kpi .delta{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:600}
.delta.good{color:#047857}.delta.risk{color:#b91c1c}.delta.info{color:#075985}
.grid{display:grid;gap:18px}.g-split{grid-template-columns:340px minmax(0,1fr)}
.g-3-2{grid-template-columns:1.4fr 1fr}.g-2-3{grid-template-columns:1fr 1.4fr}.g-11{grid-template-columns:1fr 1fr}
.card{padding:19px 20px}
.card>h3,.pane-head{
  margin:0 0 15px;display:flex;align-items:center;gap:8px;
  color:var(--ink);font-size:15px;font-weight:700;
}
.card>h3 .material-symbols-outlined,.pane-head .material-symbols-outlined{color:#047857;font-size:20px}
.grow{margin-left:auto;color:#047857;font-size:12px;font-weight:600}
.chart{width:100%;height:270px}
.pane{overflow:hidden}
.pane-head{margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.count,.sum{

  background:#ecfdf5;color:#065f46;font:600 10px "Fira Code",monospace;
}
.litem{
  display:flex;align-items:center;gap:11px;width:100%;padding:12px 15px;

}
.litem:last-child{border-bottom:0}.litem:hover{background:#f0fdf8}
.litem.on{background:#ecfdf5;box-shadow:inset 3px 0 #059669}
.list-icon,.detail-icon,.ai-icon{
  display:grid;place-items:center;flex:none;color:#fff;background:#047857;
}
.list-icon{width:38px;height:38px;border-radius:6px}
.list-icon .material-symbols-outlined{font-size:20px}
.litem b{display:block;color:var(--ink);font-size:13px}
.litem small{color:var(--muted);font:400 11px "Fira Code",monospace}
.litem .right{margin-left:auto;text-align:right}.litem .right b{font-family:"Fira Code",monospace}
.barmini{height:5px;margin-top:6px}
.detail-hero{display:flex;align-items:center;gap:13px;margin-bottom:17px}
.detail-icon{width:54px;height:54px;border-radius:7px}
.detail-hero b{color:var(--ink);font-size:18px}.detail-hero small{color:var(--muted);font-size:12px}
.detail-hero .btn{margin-left:auto}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:17px}
.metric{padding:12px 13px;background:#f4fbf8;border:1px solid #d1fae5;border-radius:6px}
.metric b{display:block;color:var(--ink);font:700 19px "Fira Code",monospace}
.metric span{color:var(--muted);font-size:11px}
.table-wrap{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{
  padding:11px 12px;background:#e8f1f3;border-bottom:1px solid #94cdb9;
  color:#334155;font:600 10.5px "Fira Code",monospace;letter-spacing:.025em;
  text-align:left;text-transform:uppercase;white-space:nowrap;
}
.tbl td{padding:11px 12px;border-bottom:1px solid #d8eee7;white-space:nowrap}
.tbl tbody tr:hover td{background:#f0fdf8}
.tbl tfoot td{background:#ecfdf5;color:var(--ink);font-weight:700}
.tbl td:not(:first-child){font-variant-numeric:tabular-nums}
.tbl td[style*="font-weight:800"]{font-family:"Fira Code",monospace}
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;
  border:1px solid currentColor;font-size:10.5px;font-weight:700;white-space:nowrap;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-s1{background:#fef2f2;color:#991b1b}.t-s2{background:#eff6ff;color:#075985}
.t-s3{background:#f5f3ff;color:#6d28d9}.t-ok{background:#ecfdf5;color:#047857}
.t-wait{background:#fffbeb;color:#92400e}.t-run{background:#eff6ff;color:#1d4ed8}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:11px}
.legend i{width:12px;height:4px;display:inline-block;margin-right:5px;vertical-align:2px}
.ai-row{display:flex;gap:11px;margin-bottom:10px;padding:13px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:7px}
.ai-icon{width:34px;height:34px;border-radius:5px}.ai-row p{margin:0;font-size:12.5px;line-height:1.6}
.ai-row b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  min-height:32px;padding:6px 10px;background:#fff;border:1px solid #94cdb9;
  border-radius:5px;color:#334155;font-size:11px;font-weight:600;
  transition:background-color .2s,border-color .2s,color .2s;
}
.chip:hover{border-color:#059669;background:#ecfdf5}.chip.on{background:#064e3b;border-color:#064e3b;color:#fff}
.ring{display:flex;align-items:center;gap:15px;padding:13px 0;border-top:1px solid #d8eee7}
.ring:first-of-type{border-top:0}
.ring-chart{width:66px;height:66px;display:grid;place-items:center;flex:none;border-radius:50%}
.ring-chart span{
  width:50px;height:50px;display:grid;place-items:center;border-radius:50%;
  background:#fff;color:var(--ink);font:700 12px "Fira Code",monospace;
}
.ring b{color:var(--ink);font-size:13px}.ring small{display:block;color:var(--muted);font-size:11px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(235px,1fr);gap:11px;overflow-x:auto;padding-bottom:4px}
.board-col{padding:11px;background:#edf7f3;border:1px solid #b7ddcf;border-radius:7px}
.board-head{display:flex;align-items:center;margin-bottom:10px;color:var(--ink);font-size:12px}
.task{margin-bottom:8px;padding:12px;background:#fff;border:1px solid #c9e5da;border-radius:6px}
.task b{color:var(--ink);font-size:12px}.task .save{margin:5px 0;color:#047857;font:700 14px "Fira Code",monospace}
.task small{display:block;color:var(--muted);font-size:10.5px}
.task-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
.task-status{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:#475569;font-size:10px}
.task-status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.mini-avatar{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#d1fae5;color:#065f46;font-size:9px;font-weight:700}
.doc{padding:17px;background:#fff;border:1px solid #b7ddcf;border-radius:6px;line-height:1.75;font-size:12.5px}
.doc h4{margin:0 0 3px;color:var(--ink);font-size:15px}.doc .sec{margin-top:13px}.doc .sec b{color:#047857;font-size:11px}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.g-split{grid-template-columns:300px minmax(0,1fr)}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}.side{position:static;height:auto}
  .brand{padding:14px 16px}.nav{flex-direction:row;overflow:auto;padding:9px 12px}
  .nav-title,.side-foot{display:none}.nav button{width:auto;flex:none}
  .g-split,.g-3-2,.g-2-3,.g-11{grid-template-columns:1fr}
}
@media(max-width:560px){
  .top{padding:11px 15px}.body{padding:17px 14px 32px}
  .top .pill{display:none}.nav button{padding:10px}.nav button span:last-child{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px 12px}
  .kpi .value{font-size:20px}.card{padding:15px}.detail-hero{align-items:flex-start;flex-wrap:wrap}
  .detail-hero .btn{margin-left:0}.vh h2{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1!important;transform:none!important}
}
</style>
</head>
