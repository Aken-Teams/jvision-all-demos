<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>刀治具管理系統 Tool &amp; Fixture Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal2:#5eead4; --teal-d:#0b5851;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2320; --muted:#5b706c;
  --line:#e0e9e7; --soft:#f6faf9; --amber:#d97706; --red:#dc2626; --green:#059669;
  --shadow:0 1px 2px rgba(15,118,110,.06),0 8px 24px rgba(15,118,110,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
  direction:ltr;vertical-align:middle;font-variation-settings:'opsz' 24}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
.brand{padding:20px 18px 14px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal-d));
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(15,118,110,.3)}
.logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11px;margin:2px 0 0;color:var(--muted);font-weight:500}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nav .lbl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:1px;padding:8px 10px 4px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:none;cursor:pointer;
  background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;
  font-family:inherit;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;color:var(--muted);flex:none;transition:.15s}
.nav button:hover{background:var(--soft)}
.nav button.on{background:linear-gradient(90deg,rgba(15,118,110,.12),rgba(94,234,212,.14));color:var(--teal-d)}
.nav button.on .material-symbols-outlined{color:var(--teal)}
.nav .idx{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);opacity:.7}
.side .foot{padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.side .foot b{color:var(--teal-d)}
.main{flex:1;min-width:0;padding:22px 26px 44px;max-width:1180px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top .h{min-width:0}
.crumb{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.crumb .material-symbols-outlined{font-size:15px}
.top h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;
  font-weight:600;color:var(--teal-d);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.chip .material-symbols-outlined{font-size:16px;color:var(--teal)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(5,150,105,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(5,150,105,.45)}70%{box-shadow:0 0 0 7px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.65fr 1fr}
.g32{grid-template-columns:1fr 1.55fr}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--teal)}
.card .cd{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,rgba(94,234,212,.28),transparent 70%)}
.kpi .k-ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:flex;align-items:center;
  justify-content:center;margin-bottom:10px}
.kpi .k-ic .material-symbols-outlined{font-size:20px;color:var(--teal)}
.kpi .k-lb{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:26px;font-weight:800;letter-spacing:.3px;margin:2px 0 1px}
.kpi .k-v small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .k-d{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:3px}
.kpi .k-d.up{color:var(--green)} .kpi .k-d.dn{color:var(--red)} .kpi .k-d.fl{color:var(--muted)}
.kpi .k-d .material-symbols-outlined{font-size:15px}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
thead th{background:var(--soft);text-align:left;padding:10px 12px;font-weight:700;color:var(--muted);
  font-size:11px;letter-spacing:.4px;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
.mono{font-family:"Inter",monospace;font-weight:700;color:var(--teal-d);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-g{background:#dcfce7;color:#15803d} .t-a{background:#fef3c7;color:#b45309}
.t-r{background:#fee2e2;color:#b91c1c} .t-b{background:#cffafe;color:#0e7490}
.t-n{background:#eef2f1;color:#475569}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.bar>i.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar>i.bad{background:linear-gradient(90deg,#ef4444,#f87171)}
.chart{width:100%;height:280px}
.chart.sm{height:230px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.board>*{min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 10px;min-height:120px}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:10px;padding:0 3px}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,118,110,.04)}
.tk .tk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tk .tk-id{font-size:11px;font-weight:800;color:var(--teal-d)}
.tk .tk-nm{font-size:12.5px;font-weight:700;margin-bottom:5px}
.tk .tk-m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tk .tk-m .material-symbols-outlined{font-size:14px}
.pri{width:8px;height:8px;border-radius:50%;flex:none}
.pri.h{background:var(--red)} .pri.m{background:var(--amber)} .pri.l{background:var(--green)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px 6px}
.tl-i::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:3px solid var(--teal)}
.tl-i.done::before{background:var(--teal)}
.tl-i.warn::before{border-color:var(--amber)}
.tl-t{font-size:12.5px;font-weight:700}
.tl-d{font-size:11.5px;color:var(--muted);margin-top:2px}
.life-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.life-row:last-child{border-bottom:none}
.life-row .lr-nm b{font-size:12.5px;display:block}
.life-row .lr-nm span{font-size:11px;color:var(--muted)}
.ring{width:52px;height:52px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--teal-d)}
.mx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;font-size:11px;min-width:520px}
.mx .mh{font-weight:700;color:var(--muted);text-align:center;padding:6px 2px;font-size:10.5px}
.mx .my{font-weight:700;color:var(--muted);display:flex;align-items:center;padding-right:6px;font-size:11px}
.mx .cell{border-radius:9px;padding:9px 4px;text-align:center;font-weight:800;font-size:12px}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.leg span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.stat-list{display:flex;flex-direction:column;gap:11px}
.sl{display:flex;align-items:center;gap:11px}
.sl .sl-ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.sl .sl-ic .material-symbols-outlined{font-size:18px;color:var(--teal)}
.sl .sl-t{font-size:12px;font-weight:700}
.sl .sl-s{font-size:11px;color:var(--muted)}
.sl .sl-v{margin-left:auto;font-size:15px;font-weight:800;color:var(--teal-d)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:520px}
.cal .cdow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding:3px 0}
.cd-cell{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 6px 8px;min-height:74px}
.cd-cell .n{font-size:11px;font-weight:700;color:var(--muted)}
.cd-cell.tod{border-color:var(--teal);background:rgba(94,234,212,.1)}
.ev{font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 4px;margin-top:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.cal-c{background:var(--teal)} .ev.cal-r{background:var(--red)} .ev.cal-i{background:var(--amber)}
.aud{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.aud:last-child{border-bottom:none}
.aud .a-ic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}
.aud .a-ic .material-symbols-outlined{font-size:17px;color:#fff}
.aud .a-b{min-width:0;flex:1}
.aud .a-t{font-size:12.5px;font-weight:700}
.aud .a-d{font-size:11px;color:var(--muted);margin-top:1px}
.aud .a-ts{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:12px;
  color:var(--muted);display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{font-size:18px;color:var(--teal);flex:none}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:relative;flex-direction:column;border-right:none;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap;overflow:visible;padding:9px 10px;gap:6px}
  .nav .lbl{display:none}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
  .nav .idx{display:none}
  .side .foot{display:none}
  .main{padding:18px 16px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .chart{height:250px}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:9px 11px}
  .top h2{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div>

<script>
var MODULES=[
  {icon:"inventory_2",name:"刀治具建檔",desc:"刀具/治具基本資料與履歷建檔"},
  {icon:"assignment_return",name:"領用歸還",desc:"領用登記、歸還銷帳與在用清冊"},

  {icon:"build_circle",name:"校正更換",desc:"校正排程、更換工單與備品調度"},
  {icon:"fact_check",name:"履歷稽核",desc:"全生命週期履歷歸檔與稽核追溯"}
];
var TITLES=[
  ["刀治具建檔 · 主檔中心","刀具與治具全品項的規格、額定壽命與履歷主檔管理"],
  ["領用歸還 · 現場作業板","現場領用登記、歸還銷帳與在用刀具即時清冊"],
  ["壽命監控 · 剩餘壽命看板","依累計加工次數追蹤剩餘壽命，超壽命前主動預警"],
  ["磨耗趨勢 · 量測分析","刀刃磨耗量測趨勢與加工精度（尺寸偏差）關聯分析"],
  ["校正更換 · 排程調度","校正到期排程、更換工單派發與備品庫存調度"],
  ["履歷稽核 · 追溯歸檔","刀治具全生命週期履歷歸檔、稽核事件與妥善率統計"]
];
var CRUMB=["主檔管理","現場作業","監控預警","品質分析","維護排程","稽核追溯"];

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

function v0(){
  var kpi=[
    {ic:"category",lb:"刀治具品項",v:"1,284",u:"項",d:"+18",dir:"up"},
    {ic:"inventory_2",lb:"在庫可用",v:"946",u:"件",d:"73.7%",dir:"fl"},
    {ic:"handyman",lb:"在用中",v:"228",u:"件",d:"+12",dir:"up"},
    {ic:"warning",lb:"待報廢",v:"31",u:"件",d:"需覆核",dir:"dn"}
  ];
  var rows=[
    {id:"TL-CNC-0421",nm:"外徑車刀 CNMG120408",cls:"車刀",spec:"φ12 / R0.8",life:"1,200",own:"廠區A · 刀具室",st:"可用",t:"t-g"},
    {id:"TL-DRL-1180",nm:"鑽頭 HSS-Co φ8.5",cls:"鑽頭",spec:"φ8.5 / 118°",life:"800",own:"廠區A · 刀具室",st:"可用",t:"t-g"},
    {id:"FX-JIG-3302",nm:"氣壓夾治具 4爪",cls:"治具",spec:"4爪 / 6bar",life:"5,000",own:"廠區B · 治具庫",st:"在用",t:"t-b"},
    {id:"TL-MIL-0765",nm:"端銑刀 4刃 φ10",cls:"銑刀",spec:"φ10 / 4F",life:"600",own:"廠區A · 刀具室",st:"校正中",t:"t-a"},
    {id:"TL-TAP-2091",nm:"螺絲攻 M6×1.0",cls:"攻牙",spec:"M6 / P1.0",life:"400",own:"廠區B · 刀具室",st:"可用",t:"t-g"},
    {id:"FX-VIS-1027",nm:"精密平口鉗 160",cls:"治具",spec:"160mm",life:"8,000",own:"廠區B · 治具庫",st:"待報廢",t:"t-r"}
  ];
  var s=topRow(0,'live');
  s+='<div class="grid g4">';kpi.forEach(function(k){s+=kpiCard(k)});s+='</div>';
  s+='<div class="grid g23" style="margin-top:14px">';
  s+='<div class="card"><h3><span class="material-symbols-outlined">table_view</span>刀治具主檔清冊</h3><div class="cd">依品項分類的規格與履歷主檔（示意資料）</div>';
  s+='<div class="tbl-wrap"><table><thead><tr><th>編號</th><th>品名</th><th>類別</th><th>規格</th><th>額定壽命(次)</th><th>存放位置</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach(function(r){s+='<tr><td class="mono">'+r.id+'</td><td>'+esc(r.nm)+'</td><td>'+r.cls+'</td><td>'+r.spec+'</td><td>'+r.life+'</td><td>'+r.own+'</td><td><span class="tag '+r.t+'">'+r.st+'</span></td></tr>'});
  s+='</tbody></table></div></div>';
  s+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>品項組成</h3><div class="cd">依類別分佈</div><div id="c0" class="chart sm"></div></div>';
  s+='</div>';
  s+='<div class="grid g2" style="margin-top:14px">';
  s+='<div class="card"><h3><span class="material-symbols-outlined">badge</span>建檔完整度</h3><div class="cd">主檔欄位覆蓋率</div><div class="stat-list">';
  [["規格參數","1,284 / 1,284","100"],["額定壽命","1,251 / 1,284","97"],["3D 圖檔連結","1,092 / 1,284","85"],["供應商履歷","968 / 1,284","75"],["QR 標籤綁定","1,247 / 1,284","97"]].forEach(function(x){
    var cl=+x[2]>=95?'':(+x[2]>=80?'warn':'bad');
    s+='<div class="sl"><div class="sl-ic"><span class="material-symbols-outlined">check_circle</span></div><div style="min-width:0;flex:1"><div class="sl-t">'+x[0]+'</div><div class="sl-s">'+x[1]+'</div><div class="bar" style="margin-top:5px"><i class="'+cl+'" style="width:'+x[2]+'%"></i></div></div><div class="sl-v">'+x[2]+'%</div></div>'});
  s+='</div></div>';
  s+='<div class="card"><h3><span class="material-symbols-outlined">location_on</span>存放分佈</h3><div class="cd">各庫別在庫件數</div><div id="c0b" class="chart sm"></div></div>';
  s+='</div>';
  return s;
}
function chart0(){
  mk('c0',{tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},

  var s=topRow(5,'live');
  s+='<div class="grid g4">';kpi.forEach(function(k){s+=kpiCard(k)});s+='</div>';
  s+='<div class="grid g23" style="margin-top:14px">';
  s+='<div class="card"><h3><span class="material-symbols-outlined">manage_history</span>刀治具履歷追溯軌跡</h3><div class="cd">全生命週期稽核事件（示意）</div>';
  auds.forEach(function(a){
    s+='<div class="aud"><div class="a-ic" style="background:'+a.c+'"><span class="material-symbols-outlined">'+a.ic+'</span></div><div class="a-b"><div class="a-t">'+esc(a.t)+'</div><div class="a-d">'+esc(a.d)+'</div></div><div class="a-ts">'+a.ts+'</div></div>'});

  s+='<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>刀具妥善率趨勢</h3><div class="cd">近 6 週妥善率 %</div><div id="c5" class="chart sm"></div>';
  s+='<div class="note" style="margin-top:8px"><span class="material-symbols-outlined">insights</span>妥善率連續 6 週上升，非預期更換由 5 次/月降至 3 次/月。</div></div>';
  s+='</div>';
  s+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">pie_chart</span>履歷事件組成</h3><div class="cd">依事件類型統計本季占比</div><div id="c5b" class="chart"></div></div>';

function kpiCard(k){
  var ar=k.dir==='up'?'trending_up':(k.dir==='dn'?'trending_down':'trending_flat');
  return '<div class="kpi"><div class="k-ic"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
    '<div class="k-lb">'+k.lb+'</div><div class="k-v">'+k.v+'<small>'+k.u+'</small></div>'+
    '<div class="k-d '+k.dir+'"><span class="material-symbols-outlined">'+ar+'</span>'+k.d+'</div></div>';
}
function topRow(i,live){
  var t=TITLES[i];
  var s='<div class="top"><div class="h"><div class="crumb"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span>刀治具管理 · '+CRUMB[i]+'</div><h2>'+t[0]+'</h2><div class="sub">'+t[1]+'</div></div>';
  s+='<div class="chips">';
  if(live)s+='<div class="chip live">即時同步</div>';
  s+='<div class="chip"><span class="material-symbols-outlined">calendar_today</span>2026-08-13</div>';
  s+='<div class="chip"><span class="material-symbols-outlined">sync</span>MES / CMMS</div></div></div>';
  return s;
}
var _charts=[];
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);_charts.push(c);}
function disposeCharts(){_charts.forEach(function(c){try{c.dispose()}catch(e){}});_charts=[];}

var RENDER=[v0,v1,v2,v3,v4,v5];
var CHART=[chart0,chart1,chart2,chart3,chart4,chart5];
var cur=-1;
function show(i){
  if(i===cur)return;
  cur=i;
  disposeCharts();
  var c=document.getElementById('screen');
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  CHART[i]();
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-i')===i)});
}
(function(){
  var nav=document.getElementById('nav');
  MODULES.forEach(function(m,i){
    var b=document.createElement('button');
    b.setAttribute('data-i',i);
    b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">'+i+'</span>';
    b.addEventListener('click',function(){show(i);try{window.scrollTo(0,0);}catch(e){}});
    nav.appendChild(b);
  });
  show(0);
})();
window.addEventListener('resize',function(){_charts.forEach(function(c){try{c.resize()}catch(e){}})});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
