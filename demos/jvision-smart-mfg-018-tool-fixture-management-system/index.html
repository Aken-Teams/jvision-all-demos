<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
  --color-on-secondary:#000;--color-accent:#ea580c;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#1e293b;--color-card:#fff;
  --color-card-foreground:#1e293b;--color-muted:#e9eff8;--color-muted-foreground:#475569;
  --color-border:#e2e8f0;--color-destructive:#dc2626;--color-on-destructive:#fff;

  --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font:14px/1.5 "Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}

.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.app{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.brand{min-height:86px;padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:8px;box-shadow:5px 5px 0 #bfdbfe}
.brand h1{margin:0;font-size:15px;line-height:1.35;font-weight:700}
.brand p{margin:3px 0 0;color:var(--muted);font:10px/1.4 "Fira Code",monospace;text-transform:uppercase;letter-spacing:.08em}
.nav{padding:18px 12px;display:grid;gap:5px;overflow:auto}
.nav-label{padding:0 10px 7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nav button{width:100%;min-height:46px;padding:10px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);display:flex;align-items:center;gap:10px;text-align:left;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .2s}
.nav button:hover{background:#f1f5f9;border-color:var(--line);transform:translateX(2px)}

.nav button .idx{margin-left:auto;color:#64748b;font:11px "Fira Code",monospace}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}

.main{min-width:0;width:100%;max-width:1440px;margin:auto;padding:24px 28px 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}

.top h2{margin:0;font-size:clamp(21px,2.2vw,30px);line-height:1.2;letter-spacing:-.02em}
.sub{margin-top:5px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{min-height:34px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#334155;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px #d1fae5}
.grid{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g23{grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr)}.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.55fr)}
.card,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}
.card{padding:16px}
.card h3{margin:0;display:flex;align-items:center;gap:8px;font-size:14px}
.card h3 .material-symbols-outlined{color:var(--blue)}
.cd{margin:3px 0 13px;color:var(--muted);font-size:11px}
.kpi{position:relative;min-height:142px;padding:15px;overflow:hidden;transition:border-color .22s,box-shadow .22s,transform .22s}
.kpi:hover{border-color:#93c5fd;box-shadow:0 12px 30px rgba(37,99,235,.1);transform:translateY(-2px)}
.kpi::after{content:"";position:absolute;right:0;top:0;width:46px;height:3px;background:var(--blue)}
.k-ic{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:#eff6ff;color:var(--blue)}
.k-lb{margin-top:9px;color:var(--muted);font-size:11px;font-weight:600}
.k-v{margin:1px 0;font:700 25px/1.3 "Fira Code",monospace;letter-spacing:-.04em}
.k-v small{margin-left:4px;color:var(--muted);font:600 11px "Fira Sans",sans-serif}
.k-d{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700}
.k-d.up{color:var(--success)}.k-d.dn{color:var(--color-destructive)}.k-d.fl{color:var(--muted)}
.k-d .material-symbols-outlined{font-size:15px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;min-width:720px;border-collapse:collapse;font-size:12px}
th{padding:9px 11px;background:#f1f5f9;color:#334155;border-bottom:1px solid #cbd5e1;text-align:left;font-size:10px;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border:0}tbody tr:hover{background:#f8fafc}
th:nth-child(5),td:nth-child(5){text-align:right}
.mono,.id,.time{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{color:#1d4ed8;font-weight:600}
.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid}
.tag::before{font-family:"Material Symbols Outlined";font-size:13px}
.t-g{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}.t-g::before{content:"check_circle"}
.t-a{color:#92400e;background:#fffbeb;border-color:#fde68a}.t-a::before{content:"schedule"}
.t-r{color:#991b1b;background:#fef2f2;border-color:#fecaca}.t-r::before{content:"error"}
.t-b{color:#1e40af;background:#eff6ff;border-color:#bfdbfe}.t-b::before{content:"manufacturing"}
.chart{height:280px}.chart.sm{height:230px}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;min-width:680px}
.col{padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:11px;font-weight:700}
.cnt{min-width:25px;padding:1px 7px;border-radius:4px;background:#e2e8f0;text-align:center;font-family:"Fira Code",monospace}
.tk{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-left:3px solid #94a3b8;border-radius:5px;transition:transform .2s,border-color .2s,box-shadow .2s}
.tk:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 6px 16px rgba(15,23,42,.08)}
.tk.h{border-left-color:var(--color-destructive)}.tk.m{border-left-color:var(--warning)}.tk.l{border-left-color:var(--success)}
.tk-top{display:flex;justify-content:space-between;gap:8px;color:#1d4ed8;font:600 10px "Fira Code",monospace}
.priority{font:700 9px "Fira Sans",sans-serif}.priority.h{color:#b91c1c}.priority.m{color:#92400e}.priority.l{color:#065f46}
.tk-nm{margin:5px 0;font-size:12px;font-weight:700}.tk-m{color:var(--muted);font-size:10px}
.stat-list{display:grid;gap:12px}.sl{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px}
.sl-ic{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:#eff6ff;color:var(--blue)}
.sl-t{font-size:11px;font-weight:700}.sl-s{color:var(--muted);font-size:10px}.sl-v{font:700 13px "Fira Code",monospace;color:#1d4ed8}
.bar{height:6px;margin-top:5px;background:#e2e8f0;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bar i.warn{background:var(--warning)}.bar i.bad{background:var(--color-destructive)}
.life-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}.life-row:last-child{border:0}
.ring{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center}.ring span{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:#fff;font:700 10px "Fira Code",monospace}
.life-name{min-width:0;flex:1}.life-name b{display:block;font-size:11px}.life-name small{color:var(--muted);font-size:10px}
.timeline{position:relative;padding-left:18px}.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:8px;width:2px;background:#cbd5e1}
.tl-item{position:relative;padding:0 0 14px 6px}.tl-item::before{content:"";position:absolute;left:-18px;top:3px;width:10px;height:10px;border:2px solid var(--blue);background:#fff;border-radius:50%}.tl-item.warn::before{border-color:var(--color-destructive);box-shadow:0 0 0 3px #fee2e2}
.tl-title{font-size:11px;font-weight:700}.tl-desc{color:var(--muted);font-size:10px}
.note{margin-top:8px;padding:10px 11px;border-left:3px solid var(--blue);background:#eff6ff;color:#334155;display:flex;gap:8px;font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:2px}
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;min-width:520px}.mh,.my{padding:6px;color:var(--muted);font-size:10px;font-weight:700;text-align:center}.my{display:flex;align-items:center;text-align:left}.cell{padding:9px;text-align:center;border-radius:4px;font:700 11px "Fira Code",monospace}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:600px}.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:700}.day{min-height:70px;padding:6px;background:#f8fafc;border:1px solid var(--line);border-radius:5px}.day.today{border:2px solid var(--blue);background:#eff6ff}.day-n{font:600 10px "Fira Code",monospace}.event{margin-top:4px;padding:2px 4px;border-radius:3px;color:#fff;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.c{background:#1d4ed8}.event.r{background:#b91c1c}.event.i{background:#92400e}
.audit{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.audit:last-child{border:0}.audit-ic{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:#fff}.audit-title{font-size:11px;font-weight:700}.audit-desc,.audit-time{color:var(--muted);font-size:10px}.audit-time{font-family:"Fira Code",monospace;white-space:nowrap}
.grid-item{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}.grid-item:nth-child(2){animation-delay:.05s}.grid-item:nth-child(3){animation-delay:.1s}.grid-item:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:scale(.97) translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{display:block}.side{position:relative;width:100%;height:auto}.brand{min-height:72px}.nav{display:flex;overflow-x:auto;padding:9px 12px}.nav-label,.side-foot,.nav .idx{display:none}.nav button{width:auto;min-width:max-content}.main{padding:18px}.g23,.g32,.g2{grid-template-columns:1fr}}
@media(max-width:600px){.g4{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.chips{justify-content:flex-start}.main{padding:14px}.card{padding:13px}.nav button .txt{display:none}.nav button{min-width:44px;justify-content:center}.chart{height:245px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.grid-item{opacity:1;transform:none}}
</style>
</head>

<script>

function baseChart(){

["TL-CNC-0421","外徑車刀 CNMG120408","車刀","φ12 / R0.8","1,200","廠區A · 刀具室","可用","t-g"],
