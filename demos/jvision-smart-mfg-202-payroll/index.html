<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>薪資核算工作台 · Payroll Workbench</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#1a1420;--rose:#e11d48;--rose2:#fb7185;--rose-d:#9f1239;--bg:#f7f2f4;--card:#fff;--line:#f0e2e7;--mut:#8a7d84;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--info:#0ea5e9}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,var(--rose-d),#6b0f2b);color:#ffe4ec;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--rose),var(--rose2));display:grid;place-items:center;font-weight:900;flex:none;font-family:"Noto Sans TC";color:#fff;box-shadow:0 0 16px rgba(225,29,72,.55)}
.brand b{font-size:15px;font-weight:900;display:block;font-family:"Noto Sans TC";color:#fff}
.brand span{font-size:9.5px;color:#fda4c0;letter-spacing:2px}
.nav{flex:1;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{border:0;background:transparent;color:#ffd0de;font:inherit;font-weight:700;font-size:13px;padding:11px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;white-space:nowrap;flex:none}
.nav button .material-symbols-outlined{font-size:20px}
.nav button:hover{background:rgba(255,255,255,.09)}
.nav button.on{background:linear-gradient(135deg,rgba(225,29,72,.5),rgba(251,113,133,.4));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.side-f{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#fda4c0;line-height:1.7}
.main{display:flex;flex-direction:column;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px;position:sticky;top:0;z-index:15;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-family:"Noto Sans TC";font-weight:900}
.top p{margin:2px 0 0;color:var(--mut);font-size:12px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;min-width:0}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:12.5px;width:120px;min-width:0}
.pill{background:#ffe4ec;color:var(--rose-d);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.body{padding:22px 24px 34px;min-width:0}
.view{display:none;animation:f .3s}
.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(225,29,72,.13),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--rose)}
.kpi .v{font-size:25px;font-weight:800;margin-top:5px;font-family:Inter}
.kpi .v small{font-size:12px;font-weight:700}
.kpi .d{font-size:11px;font-weight:800;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .95fr}
.g11{grid-template-columns:1.15fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--rose)}
.card h3 .sp{margin-left:auto;font-size:11px;color:var(--mut);font-weight:700}
.tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-r{background:#ffe4ec;color:#be123c}.t-a{background:#fef3c7;color:#b45309}.t-g{background:#dcfce7;color:#15803d}.t-b{background:#e0f2fe;color:#0369a1}.t-n{background:#f1e9f7;color:#7e22ce}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11.5px;background:#fdf6f8}
table.data td b{font-family:"Noto Sans TC"}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.chartbox{position:relative;height:260px;overflow:hidden}
.chartbox.sm{height:210px}
/* SIGNATURE split workspace */
.ws{display:grid;grid-template-columns:320px 1fr;gap:16px}
.ws>*{min-width:0}
.wlist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:640px;overflow-y:auto}
.wlist .lh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:800;padding:2px 4px 6px}
.wlist .lh .cnt{margin-left:auto;background:#ffe4ec;color:var(--rose-d);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:800}
.emp{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s;border-left:4px solid transparent}
.emp:hover{background:#fdf6f8}
.emp.on{border-left-color:var(--rose);background:#fff5f8;box-shadow:0 4px 14px rgba(225,29,72,.1)}
.emp .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Noto Sans TC";flex:none;font-size:13px}
.emp .mid{flex:1;min-width:0}
.emp .mid b{font-size:13px;font-family:"Noto Sans TC";display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .mid small{color:var(--mut);font-size:11px}
.emp .rt{text-align:right;flex:none}
.emp .rt b{font-size:12.5px;font-family:Inter;font-variant-numeric:tabular-nums}
.wdetail{display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dhead .av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Noto Sans TC";flex:none;font-size:18px}
.dhead h2{margin:0;font-size:18px;font-family:"Noto Sans TC";font-weight:900}
.dhead small{color:var(--mut);font-size:12px}
.dhead .rt{margin-left:auto;text-align:right}
.dhead .rt .big{font-size:24px;font-weight:800;font-family:Inter}
.dhead .rt small{display:block}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.paygrid>*{min-width:0}
.pi{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fdf6f8}
.pi .k{font-size:11.5px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:5px}
.pi .k .material-symbols-outlined{font-size:15px;color:var(--rose)}
.pi .n{font-size:19px;font-weight:800;font-family:Inter;margin-top:4px;font-variant-numeric:tabular-nums}
.pi.ded .n{color:var(--bad)}.pi.add .n{color:var(--ok)}
.slip{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slip .sr{display:flex;justify-content:space-between;padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.slip .sr:last-child{border-bottom:0}
.slip .sr.sub{background:#fdf6f8;font-weight:800}
.slip .sr.tot{background:linear-gradient(90deg,var(--rose),var(--rose2));color:#fff;font-weight:900;font-size:14px}
.slip .sr span:last-child{font-family:Inter;font-variant-numeric:tabular-nums}
.slip .sr.neg span:last-child{color:var(--bad)}
/* rule engine */
.rules{display:flex;flex-direction:column;gap:10px}
.rule{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.rule .rn{width:34px;height:34px;border-radius:10px;background:#ffe4ec;color:var(--rose-d);display:grid;place-items:center;font-weight:800;font-family:Inter;flex:none;font-size:13px}
.rule .mid{flex:1;min-width:0}
.rule .mid b{font-size:13px;font-family:"Noto Sans TC"}
.rule .mid small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.rule .mul{font-size:16px;font-weight:800;font-family:Inter;color:var(--rose);flex:none;white-space:nowrap}
.shiftbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sb{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.sb .t{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.sb .t .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sb .h{font-size:13px;font-weight:800;font-family:"Noto Sans TC";margin-top:3px}
.sb .n{font-size:11.5px;color:var(--mut);margin-top:2px}
/* approval timeline */
.appr{display:flex;flex-direction:column;gap:0}
.ar{display:flex;align-items:flex-start;gap:12px;padding:12px 0;position:relative}
.ar .dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px;box-shadow:0 0 0 4px #ffe4ec}
.ar:not(:last-child)::before{content:"";position:absolute;left:6px;top:22px;bottom:-4px;width:2px;background:var(--line)}
.ar .cnt{flex:1;min-width:0}
.ar .cnt b{font-size:13px;font-family:"Noto Sans TC"}
.ar .cnt small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.ar .st{font-size:11.5px;font-weight:800;white-space:nowrap;flex:none}
.diffrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px}
.diffrow .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.diffrow .mid{flex:1;min-width:0}
.diffrow .mid b{font-size:13px;font-family:"Noto Sans TC"}
.diffrow .mid small{display:block;color:var(--mut);font-size:11.5px}
.diffrow .amt{font-family:Inter;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.diffrow .amt.pos{color:var(--ok)}.diffrow .amt.negc{color:var(--bad)}
.btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{border:0;padding:10px 18px;border-radius:11px;font:inherit;font-weight:800;font-size:13px;font-family:"Noto Sans TC";cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff}
.btn.gho{background:#f4e8ec;color:var(--mut)}
/* payout / bank cards */
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.bc{border:1px solid var(--line);border-radius:14px;padding:14px}
.bc .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bc .hd b{font-family:"Noto Sans TC";font-size:13.5px}
.bc .prog{height:8px;background:#f4e8ec;border-radius:6px;overflow:hidden;margin:9px 0}
.bc .prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--rose2))}
.bc small{color:var(--mut);font-size:11.5px;display:block;line-height:1.7}
.notice{border:1px dashed var(--rose2);background:linear-gradient(135deg,#fff1f5,#fff5f0);border-radius:14px;padding:13px 15px;display:flex;gap:12px;margin-bottom:16px;align-items:center}
.notice .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;flex:none}
.notice b{font-family:"Noto Sans TC";font-size:13.5px}
.notice p{margin:2px 0 0;font-size:12.5px;color:#6b5560;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.warnrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px;border-left:4px solid var(--warn)}
.warnrow.err{border-left-color:var(--bad)}
.warnrow .ic2{color:var(--warn)}.warnrow.err .ic2{color:var(--bad)}
.warnrow .mid{flex:1;min-width:0}
.warnrow .mid b{font-size:13px;font-family:"Noto Sans TC"}
.warnrow .mid small{display:block;color:var(--mut);font-size:11.5px}
@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center}.brand{padding:12px 16px}.nav{flex-direction:row;overflow-x:auto;padding:10px}.side-f{display:none}}
@media(max-width:860px){.ws{grid-template-columns:1fr}.wlist{max-height:none;flex-direction:row;overflow-x:auto}.wlist .lh{display:none}.emp{min-width:220px}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.paygrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.body{padding:16px 14px 30px}.top{padding:12px 16px}.search{display:none}.nav button .t{display:none}.paygrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">薪</div><div><b>薪資核算工作台</b><span>PAYROLL WORKBENCH</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f">2026 年 07 月 薪資期<br/>三班輪班 · 加班費規則引擎<br/>© JVISION Payroll</div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">薪資總覽</h1><p id="vs"></p></div>
      <div class="r">
        <div class="search"><span class="material-symbols-outlined">search</span><input placeholder="搜尋員工 / 工號"/></div>
        <div class="pill" id="clock">● 計薪中 · 07 月期</div>
      </div>
    </header>
    <main class="body">
      <section class="view on" id="v0"></section>
      <section class="view" id="v1"></section>
      <section class="view" id="v2"></section>
      <section class="view" id="v3"></section>
      <section class="view" id="v4"></section>
      <section class="view" id="v5"></section>
    </main>
  </div>
</div>
<script>
var NAV=[
["薪資總覽","dashboard","薪資總覽","本期薪資關鍵指標、成本結構與作業進度一覽"],
["考勤匯入","receipt_long","考勤匯入","三班考勤匯入、工時核對與異常缺卡處理"],
["加班費規則","rule","加班費規則","三班制加班費倍率與夜班津貼規則引擎"],
["薪資試算","request_quote","薪資試算","逐人薪資明細試算：底薪、加班、勞健保與勞退"],
["主管覆核","fact_check","主管覆核","薪資差異覆核、異常調整與簽核推進"],
["轉帳發放","account_tree","轉帳發放","扣繳計算、銀行轉帳檔產出與薪資單發放"]];
var navEl=document.getElementById('nav');
NAV.forEach(function(n,i){var b=document.createElement('button');b.className=i===0?'on':'';b.setAttribute('data-i',i);b.innerHTML='<span class="material-symbols-outlined">'+n[1]+'</span><span class="t">'+n[0]+'</span>';b.onclick=function(){show(i);location.hash='v'+i;};navEl.appendChild(b);});

/* ============ shared fake data ============ */
var AVC=["#e11d48","#fb7185","#be123c","#f43f5e","#db2777","#c026d3","#9333ea"];
/* fields: 0 name,1 no,2 dept,3 shift,4 base,5 otHrs,6 otPay,7 night,8 gross,9 deduct,10 net,11 status */
var EMP=[
["林建成","T-1042","組裝一課","早班",34800,22,4180,0,41260,4820,36440,1],
["陳美玲","T-1088","組裝一課","中班",33200,14,2660,1200,38860,4510,34350,1],
["王志豪","T-1120","沖壓課","夜班",36500,31,7130,3600,49330,5960,43370,0],
["黃淑芬","T-1156","品保課","早班",38200,8,1520,0,42120,4990,37130,2],
["張家豪","T-1203","沖壓課","夜班",35100,28,6440,3600,47540,5710,41830,0],
["李佩珊","T-1245","包裝課","中班",31800,18,3420,1200,38020,4390,33630,1],
["吳承翰","T-1290","組裝二課","早班",33900,12,2280,0,38580,4460,34120,1],
["劉冠廷","T-1312","模具課","夜班",41200,26,6760,3600,53960,6620,47340,0],
["蔡宜庭","T-1355","品保課","中班",34500,6,1140,1200,38240,4420,33820,2],
["周俊宏","T-1398","包裝課","夜班",32400,33,7590,3600,45990,5510,40480,0]];
function nf(n){return Math.round(n).toLocaleString('en-US');}
function initial(s){return s.slice(0,1);}
function statusTag(s){return s===2?'<span class="tag t-g">已覆核</span>':s===1?'<span class="tag t-a">待覆核</span>':'<span class="tag t-r">異常待查</span>';}

/* ============ show ============ */
function show(i){
  document.querySelectorAll('.nav button').forEach(function(b,j){b.classList.toggle('on',i===j);});
  document.querySelectorAll('.view').forEach(function(v,j){v.classList.toggle('on',i===j);});
  document.getElementById('vt').textContent=NAV[i][2];
  document.getElementById('vs').textContent=NAV[i][3];
  var el=document.getElementById('v'+i);
  if(!el.getAttribute('data-built')){RENDER[i](el);el.setAttribute('data-built','1');}
  void el.offsetHeight;
  if(i===0){chartCost();chartTrend();}
  if(i===2){chartOt();}
  if(i===4){chartDiff();}
  if(i===5){chartPayout();}
}

/* ---------- v0 薪資總覽 ---------- */
function r0(el){
  var gross=0;EMP.forEach(function(e){gross+=e[8];});
  var h='';
  h+='<div class="kpis">'
   +'<div class="kpi"><div class="l"><span class="material-symbols-outlined">payments</span>本期薪資總額</div><div class="v">$10.4<small>M</small></div><div class="d up">▲ 較上期 3.2%</div></div>'
   +'<div class="kpi"><div class="l"><span class="material-symbols-outlined">groups</span>計薪人數</div><div class="v">248 <small>人</small></div><div class="d up">▲ 到職 6</div></div>'
   +'<div class="kpi"><div class="l"><span class="material-symbols-outlined">schedule</span>加班費占比</div><div class="v">14.8<small>%</small></div><div class="d dn">▲ 夜班增加</div></div>'
   +'<div class="kpi"><div class="l"><span class="material-symbols-outlined">verified</span>核算正確率</div><div class="v">99.6<small>%</small></div><div class="d up">▲ 規則引擎</div></div>'
   +'</div>';
  h+='<div class="grid g2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>薪資成本結構<span class="sp">07 月期</span></h3><div class="chartbox" id="c_cost"></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">insights</span>薪資作業工時趨勢<span class="sp">近 6 週</span></h3><div class="chartbox sm" id="c_trend"></div>';
  h+='<div class="two" style="margin-top:14px">'
   +'<div class="pi add"><div class="k"><span class="material-symbols-outlined">check_circle</span>已完成覆核</div><div class="n">216 人</div></div>'

function chartDiff(){mk('c_diff',{type:'bar',data:{labels:['組裝一','沖壓','品保','包裝','模具'],datasets:[{label:'差異幅度%',data:[2.1,6.8,-1.4,3.2,4.1],backgroundColor:['#fb7185','#e11d48','#0ea5e9','#fb7185','#fb7185']}]},options:Object.assign({},GO,{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},callback:function(v){return v+'%';}}},y:{ticks:{font:{size:11}}}}})});}
function chartPayout(){mk('c_payout',{type:'line',data:{labels:['02月','03月','04月','05月','06月','07月'],datasets:[{label:'發放準時率',data:[92,94,96,98,99,100],borderColor:'#e11d48',backgroundColor:'rgba(225,29,72,.1)',fill:true,tension:.35,pointRadius:3,borderWidth:3}]},options:Object.assign({},GO,{plugins:{legend:{display:false}},scales:{y:{min:85,max:100,ticks:{font:{size:10},callback:function(v){return v+'%';}}},x:{ticks:{font:{size:10}}}}})});}

window.addEventListener('resize',function(){for(var k in CH){if(CH[k])CH[k].resize();}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
