<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>薪資核算工作台 · Payroll Workbench</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#047857;
  --warn:#A65005;
  --bad:#DC2626;
  --info:#0369A1;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:16px;
  line-height:1.45;
}
button,input{font:inherit}
button,[role="button"],.emp{cursor:pointer}
button:focus-visible,input:focus-visible,.emp:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:21px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 24;
}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  color:#062F2C;
  background:var(--color-secondary);
  border-right:4px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:104px;
  padding:20px 18px;
  background:var(--color-primary);
  border-bottom:4px solid var(--ink);
}
.logo{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--ink);
  border:3px solid #000;
  box-shadow:5px 5px 0 var(--color-accent);
  font-family:Cinzel,serif;
  font-size:25px;
  font-weight:600;
}
.brand b{
  display:block;
  color:#fff;
  font-size:17px;
  font-weight:700;
  letter-spacing:.03em;
}
.brand span{
  display:block;
  margin-top:4px;
  color:#062F2C;
  font-family:Cinzel,serif;
  font-size:8px;
  font-weight:600;
  letter-spacing:.15em;
}
.nav{display:flex;flex:1;flex-direction:column;padding:16px 13px;gap:8px}
.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 13px;
  border:2px solid transparent;
  border-radius:0;
  background:transparent;
  color:#0F3D3A;
  text-align:left;
  font-weight:600;
  transition:background-color .18s,color .18s,transform .18s;
}
.nav button:hover{background:#99F6E4;transform:translateX(3px)}
.nav button.on{
  color:#fff;
  background:var(--ink);
  border-color:#000;
  box-shadow:5px 5px 0 var(--color-accent);
}
.side-f{
  padding:16px 18px;
  color:#164E4A;
  border-top:3px solid var(--ink);
  background:#99F6E4;
  font-family:var(--mono);
  font-size:10px;
  line-height:1.75;
}
.main{min-width:0}
.top{
  position:sticky;
  z-index:20;
  top:0;
  min-height:86px;
  display:flex;
  align-items:center;
  gap:20px;
  padding:15px 28px;
  background:rgba(240,253,250,.96);
  border-bottom:3px solid var(--ink);
}
.top h1{
  margin:0;
  color:var(--ink);
  font-family:Cinzel,"Crimson Pro",serif;
  font-size:25px;
  font-weight:600;
  line-height:1.1;
}
.top p{margin:5px 0 0;color:var(--muted);font-size:14px}
.top .r{display:flex;align-items:center;gap:12px;margin-left:auto}
.search{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--line);
}
.search input{
  width:145px;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--ink);
}
.pill{
  padding:8px 12px;
  color:#fff;
  background:var(--ink);
  border:2px solid #000;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.body{
  position:relative;
  min-width:0;
  padding:28px 30px 48px;
  background-image:
    linear-gradient(rgba(13,148,136,.1) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.1) 1px,transparent 1px);
  background-size:32px 32px;
}
.view{display:none}
.view.on{display:block;animation:reveal .35s ease-out}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpi,.card,.wlist{
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--line);
}
.kpi{
  position:relative;
  min-height:132px;
  padding:17px 18px;
  overflow:hidden;
}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-22px;
  width:68px;
  height:68px;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  transform:rotate(18deg);
}
.kpi .l{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-weight:600;
}
.kpi .l .material-symbols-outlined{color:var(--color-primary)}
.kpi .v{
  position:relative;
  z-index:1;
  margin-top:8px;
  color:var(--ink);
  font-family:Cinzel,serif;
  font-size:28px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{font-size:13px}
.kpi .d{position:relative;z-index:1;margin-top:3px;font-size:12px;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,.95fr)}
.g11{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.card{padding:18px 20px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 15px;
  padding-bottom:10px;
  border-bottom:2px solid var(--ink);
  color:var(--ink);
  font-size:17px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card h3 .sp{
  margin-left:auto;
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.t-r{color:#991B1B;background:#FEE2E2}
.t-a{color:#854D0E;background:#FEF3C7}
.t-g{color:#065F46;background:#D1FAE5}
.t-b{color:#075985;background:#E0F2FE}
.t-n{color:#6B21A8;background:#F3E8FF}
.scroll{overflow-x:auto;border:2px solid var(--ink)}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{
  padding:10px 12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  color:#062F2C;
  background:#99F6E4;
  border-bottom:3px solid var(--ink);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td{background:#F0FDFA}
table.data td.num,table.data th.num{
  text-align:right;
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
}
table.data td:first-child{font-family:var(--mono)}
.chartbox{position:relative;height:260px;overflow:hidden}
.chartbox.sm{height:215px}
.ws{display:grid;grid-template-columns:330px minmax(0,1fr);gap:19px}
.wlist{
  display:flex;
  flex-direction:column;
  gap:9px;
  max-height:680px;
  padding:13px;
  overflow-y:auto;
}
.wlist .lh{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 5px 11px;
  color:var(--muted);
  border-bottom:2px solid var(--ink);
  font-size:13px;
  font-weight:700;
}
.wlist .cnt{
  margin-left:auto;
  padding:2px 8px;
  color:#fff;
  background:var(--ink);
  font-family:var(--mono);
}
.emp{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:2px solid var(--line);
  background:#fff;
  transition:background-color .18s,transform .18s,box-shadow .18s;
}
.emp:hover{background:#CCFBF1;transform:translateX(3px)}
.emp.on{
  border-color:var(--ink);
  background:#99F6E4;
  box-shadow:4px 4px 0 var(--color-accent);
}
.emp .av,.dhead .av{
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--ink)!important;
  border:2px solid #000;
  font-weight:700;
}
.emp .av{width:38px;height:38px}
.emp .mid{min-width:0;flex:1}
.emp .mid b{display:block;overflow:hidden;font-size:14px;text-overflow:ellipsis;white-space:nowrap}
.emp .mid small{color:var(--muted);font-family:var(--mono);font-size:10px}
.emp .rt{text-align:right}
.emp .rt b{font-family:var(--mono);font-size:12px}
.wdetail{display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dhead .av{width:56px;height:56px;font-size:20px}
.dhead h2{margin:0;font-family:Cinzel,"Crimson Pro",serif;font-size:22px}
.dhead small{color:var(--muted);font-family:var(--mono);font-size:11px}
.dhead .rt{margin-left:auto;text-align:right}
.dhead .big{font-family:Cinzel,serif;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.dhead .rt small{display:block}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pi{
  padding:13px;
  background:var(--color-background);
  border:2px solid var(--ink);
}
.pi .k{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.pi .k .material-symbols-outlined{color:var(--color-primary);font-size:17px}
.pi .n{margin-top:5px;font-family:var(--mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.pi.ded .n{color:var(--bad)}.pi.add .n{color:var(--ok)}
.slip{overflow:hidden;border:2px solid var(--ink)}
.slip .sr{
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:9px 13px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
.slip .sr:last-child{border-bottom:0}
.slip .sr.sub{background:var(--color-muted);font-weight:700}
.slip .sr.tot{
  color:#fff;
  background:var(--ink);
  font-size:16px;
  font-weight:700;
}
.slip .sr span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.slip .sr.neg span:last-child{color:var(--bad)}
.notice{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:19px;
  padding:14px 16px;
  color:#422006;
  background:#FEF3C7;
  border:3px solid #854D0E;
  box-shadow:6px 6px 0 #FCD34D;
}
.notice .ic{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:#854D0E;
  border:2px solid #422006;
}
.notice b{font-size:15px}.notice p{margin:3px 0 0;font-size:13px}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#fff;
  border:2px solid var(--ink);
}
.rule:nth-child(even){margin-left:15px;background:#F0FDFA}
.rule .rn{
  width:37px;height:37px;
  display:grid;place-items:center;flex:none;
  color:#fff;background:var(--ink);
  font-family:var(--mono);font-weight:700;
}
.rule .mid{min-width:0;flex:1}
.rule .mid b{font-size:14px}.rule .mid small{display:block;color:var(--muted);font-size:12px}
.rule .mul{color:var(--color-primary);font-family:var(--mono);font-size:17px;font-weight:700;white-space:nowrap}
.shiftbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sb{
  flex:1;
  min-width:170px;
  padding:13px;
  background:#fff;
  border:3px solid var(--ink);
}
.sb:nth-child(2){transform:translateY(6px)}
.sb .t{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600}
.sb .dot{width:11px;height:11px;border:2px solid #000}
.sb .h{margin-top:4px;font-family:var(--mono);font-weight:700}
.sb .n{margin-top:2px;color:var(--muted);font-size:12px}
.appr{display:flex;flex-direction:column}
.ar{position:relative;display:flex;align-items:flex-start;gap:12px;padding:12px 0}
.ar .dot{width:16px;height:16px;flex:none;margin-top:3px;border:3px solid var(--ink)}
.ar:not(:last-child)::before{
  content:"";
  position:absolute;
  top:26px;
  bottom:-4px;
  left:7px;
  width:2px;
  background:var(--ink);
}
.ar .cnt{min-width:0;flex:1}
.ar .cnt b{font-size:14px}.ar .cnt small{display:block;color:var(--muted);font-size:12px}
.ar .st{flex:none;font-family:var(--mono);font-size:11px;font-weight:700}
.diffrow,.warnrow{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:10px;
  padding:10px 12px;
  background:#fff;
  border:2px solid var(--ink);
}
.diffrow:nth-child(odd){transform:translateX(7px)}
.diffrow .ic{
  width:34px;height:34px;
  display:grid;place-items:center;flex:none;
  color:#fff;border:2px solid #000;
}
.diffrow .mid,.warnrow .mid{min-width:0;flex:1}
.diffrow .mid b,.warnrow .mid b{font-size:14px}
.diffrow .mid small,.warnrow .mid small{display:block;color:var(--muted);font-size:12px}
.diffrow .amt{font-family:var(--mono);font-weight:700;white-space:nowrap}
.diffrow .amt.pos{color:var(--ok)}.diffrow .amt.negc{color:var(--bad)}
.warnrow{border-left:8px solid var(--warn)}
.warnrow.err{border-left-color:var(--bad)}
.warnrow .ic2{color:var(--warn)}.warnrow.err .ic2{color:var(--bad)}
.btnrow{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:15px}
.btn{
  min-height:44px;
  padding:9px 17px;
  border:3px solid var(--ink);
  border-radius:0;
  font-weight:700;
  transition:background-color .18s,color .18s,transform .18s,box-shadow .18s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.btn.pri{color:#000;background:var(--color-accent)}
.btn.gho{color:var(--ink);background:#fff}
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:13px}
.bc{padding:14px;background:#fff;border:2px solid var(--ink)}
.bc .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bc .hd b{font-size:14px}
.bc .prog{height:12px;margin:10px 0;background:var(--color-muted);border:2px solid var(--ink)}
.bc .prog i{display:block;height:100%;background:var(--color-primary)}
.bc small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;line-height:1.65}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2,.g11{grid-template-columns:1fr}
}
@media(max-width:920px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{min-height:auto}
  .nav{flex-direction:row;overflow-x:auto;padding:11px}
  .nav button{width:auto;min-width:max-content}
  .side-f{display:none}
}
@media(max-width:760px){
  .ws{grid-template-columns:1fr}
  .wlist{max-height:none;flex-direction:row;overflow-x:auto}
  .wlist .lh{display:none}
  .emp{min-width:225px}
  .two{grid-template-columns:1fr}
  .paygrid{grid-template-columns:1fr 1fr}
  .top{padding:13px 16px}
  .body{padding:21px 16px 38px}
}
@media(max-width:520px){
  .brand{padding:13px}
  .brand span{display:none}
  .nav button .t{display:none}
  .nav button{min-width:48px;justify-content:center}
  .top h1{font-size:20px}
  .top p{font-size:12px}
  .search{display:none}
  .kpis{grid-template-columns:1fr}
  .kpi:nth-child(2n),.sb:nth-child(2){transform:none}
  .paygrid{grid-template-columns:1fr}
  .dhead .rt{width:100%;margin-left:70px;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .view.on{animation:none}
  .nav button:hover,.emp:hover,.btn:hover{transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">薪</div>
      <div><b>薪資核算工作台</b><span>PAYROLL WORKBENCH</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-f">2026 年 07 月 薪資期<br/>三班輪班 · 加班費規則引擎<br/>© JVISION Payroll</div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">薪資總覽</h1><p id="vs"></p></div>
      <div class="r">
        <label class="search">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <input aria-label="搜尋員工或工號" placeholder="搜尋員工 / 工號"/>
        </label>
        <div class="pill" id="clock">計薪中 · 07 月期</div>
      </div>
    </header>
    <main class="body">
      <section class="view on" id="v0"></section>
      <section class="view" id="v1"></section>
      <section class="view" id="v2"></section>
      <section class="view" id="v3"></section>
      <section class="view" id="v4"></section>
      <section class="view" id="v5"></section>
    </main>
  </div>
</div>
<script>
var NAV=[
["薪資總覽","dashboard","薪資總覽","本期薪資關鍵指標、成本結構與作業進度一覽"],

    +'<div class="kpi"><div class="l"><span class="material-symbols-outlined">calendar_month</span>發放日</div><div class="v">07/10</div><div class="d up">達標 · 準時率 100%</div></div>'
    +'<div class="kpi"><div class="l"><span class="material-symbols-outlined">description</span>電子薪資單</div><div class="v">248 <small>份</small></div><div class="d up">完成 · 已寄送</div></div></div>'

var RENDER=[r0,r1,r2,r3,r4,r5];
var CH={};
var COLORS={
  primary:"#0D9488",
  secondary:"#2DD4BF",
  accent:"#D97706",
  ink:"#134E4A",
  line:"#5EEAD4",
  muted:"#475569",
  card:"#FFFFFF",
  info:"#0369A1"
};
function mk(id,cfg){
  var c=document.getElementById(id);
  if(!c)return;
  if(CH[id]){CH[id].destroy();CH[id]=null}
  var w=document.createElement("canvas");
  c.innerHTML="";
  c.appendChild(w);
  CH[id]=new Chart(w.getContext("2d"),cfg);
}
var GO={
  responsive:true,
  maintainAspectRatio:false,
  animation:window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350},
  plugins:{
    tooltip:{
      backgroundColor:COLORS.ink,
      titleFont:{family:"Crimson Pro",size:14},
      bodyFont:{family:"Crimson Pro",size:13},
      padding:10,
      cornerRadius:0
    }
  }
};
function scale(){
  return {
    grid:{color:"rgba(13,148,136,.14)"},
    border:{color:COLORS.ink},
    ticks:{color:COLORS.muted,font:{family:"Crimson Pro",size:11}}
  };
}
function chartCost(){
  mk("c_cost",{
    type:"doughnut",
    data:{
      labels:["本俸底薪","加班費","夜班津貼","勞健保雇主","其他津貼"],
      datasets:[{
        data:[68,15,6,8,3],
        backgroundColor:["#0D9488","#2DD4BF","#D97706","#134E4A","#99F6E4"],
        borderWidth:3,
        borderColor:"#FFFFFF"
      }]
    },
    options:Object.assign({},GO,{
      cutout:"55%",
      plugins:{
        legend:{position:"right",labels:{color:COLORS.ink,font:{family:"Crimson Pro",size:12},boxWidth:14,borderRadius:0}},
        tooltip:GO.plugins.tooltip
      }
    })
  });
}
function chartTrend(){
  mk("c_trend",{
    type:"line",
    data:{
      labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
      datasets:[{
        label:"薪資作業工時",
        data:[38,32,26,20,14,7.5],
        borderColor:COLORS.primary,
        backgroundColor:"rgba(45,212,191,.22)",
        fill:true,
        tension:0,
        pointRadius:4,
        pointBackgroundColor:COLORS.accent,
        pointBorderColor:COLORS.ink,
        pointBorderWidth:2,
        borderWidth:3
      }]
    },
    options:Object.assign({},GO,{
      plugins:{legend:{display:false},tooltip:GO.plugins.tooltip},
      scales:{y:scale(),x:scale()}
    })
  });
}
function chartOt(){
  mk("c_ot",{
    type:"bar",
    data:{
      labels:["早班 A","中班 B","夜班 C"],
      datasets:[
        {label:"平日加班",data:[420,510,680],backgroundColor:COLORS.secondary,borderColor:COLORS.ink,borderWidth:2},
        {label:"假日加班",data:[180,240,390],backgroundColor:COLORS.accent,borderColor:COLORS.ink,borderWidth:2}
      ]
    },
    options:Object.assign({},GO,{
      plugins:{
        legend:{labels:{color:COLORS.ink,font:{family:"Crimson Pro",size:12},boxWidth:14}},
        tooltip:GO.plugins.tooltip
      },
      scales:{x:Object.assign(scale(),{stacked:true}),y:Object.assign(scale(),{stacked:true,title:{display:true,text:"小時",color:COLORS.ink}})}
    })
  });
}
function chartDiff(){
  mk("c_diff",{
    type:"bar",
    data:{
      labels:["組裝一","沖壓","品保","包裝","模具"],
      datasets:[{
        label:"差異幅度%",
        data:[2.1,6.8,-1.4,3.2,4.1],
        backgroundColor:["#2DD4BF","#D97706","#0369A1","#2DD4BF","#0D9488"],
        borderColor:COLORS.ink,
        borderWidth:2
      }]
    },
    options:Object.assign({},GO,{
      indexAxis:"y",
      plugins:{legend:{display:false},tooltip:GO.plugins.tooltip},
      scales:{
        x:Object.assign(scale(),{ticks:{color:COLORS.muted,font:{family:"Crimson Pro",size:11},callback:function(v){return v+"%"}}}),
        y:scale()
      }
    })
  });
}
function chartPayout(){
  mk("c_payout",{
    type:"line",
    data:{
      labels:["02月","03月","04月","05月","06月","07月"],
      datasets:[{
        label:"發放準時率",
        data:[92,94,96,98,99,100],
        borderColor:COLORS.primary,
        backgroundColor:"rgba(45,212,191,.22)",
        fill:true,
        tension:0,
        pointRadius:4,
        pointBackgroundColor:COLORS.accent,
        pointBorderColor:COLORS.ink,
        pointBorderWidth:2,
        borderWidth:3
      }]
    },
    options:Object.assign({},GO,{
      plugins:{legend:{display:false},tooltip:GO.plugins.tooltip},
      scales:{
        y:Object.assign(scale(),{min:85,max:100,ticks:{color:COLORS.muted,font:{family:"Crimson Pro",size:11},callback:function(v){return v+"%"}}}),
        x:scale()
      }
    })
  });
}
window.addEventListener("resize",function(){
  for(var k in CH){if(CH[k])CH[k].resize()}
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
