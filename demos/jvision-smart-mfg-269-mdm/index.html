<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>資料治理與主資料管理平台（MDM）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--pink:#db2777;--pink2:#f472b6;--ink:#1f2937;--muted:#6b7280;--line:#f0d9e6;--bg:#fdf2f8;--card:#ffffff;--soft:#fce7f3;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}
header.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#9d174d,#db2777);color:#fff;box-shadow:0 2px 12px rgba(157,23,77,.25);}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1360px;margin:0 auto;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.3px;}
.brand .sub{font-size:12px;opacity:.82;margin-top:2px;}
.brand .spacer{flex:1;min-width:0;}
.brand .env{font-size:12px;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;white-space:nowrap;}
nav.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:40;}
.navwrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px 20px;max-width:1360px;margin:0 auto;}
.navbtn{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;min-width:0;transition:.15s;}
.navbtn .material-symbols-outlined{font-size:20px;}
.navbtn:hover{background:var(--soft);color:var(--pink);}
.navbtn.active{background:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(219,39,119,.3);}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
.screenhead{margin-bottom:18px;}
.screenhead .eyebrow{font-size:12px;font-weight:700;color:var(--pink);letter-spacing:1px;text-transform:uppercase;}
.screenhead h2{margin:4px 0 4px;font-size:22px;font-weight:800;}
.screenhead p{margin:0;color:var(--muted);font-size:14px;max-width:760px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 3px rgba(157,23,77,.05);}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--pink);}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--pink),var(--pink2));}
.kpi .klabel{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .klabel .material-symbols-outlined{font-size:18px;color:var(--pink);}
.kpi .kval{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:.5px;}
.kpi .kfoot{font-size:12px;margin-top:6px;color:var(--muted);}
.kpi .up{color:var(--ok);font-weight:700;}
.kpi .down{color:var(--bad);font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--soft);}
tbody tr:hover{background:var(--bg);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0e7ff;color:#4338ca;}
.t-pink{background:var(--soft);color:var(--pink);}
.chartbox{position:relative;width:100%;overflow:hidden;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.pill{font-size:12px;font-weight:700;color:var(--pink);background:var(--soft);padding:4px 10px;border-radius:8px;display:inline-block;}
.bar-lite{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;min-width:70px;}
.bar-lite>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pink),var(--pink2));}
.attr-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);min-width:0;}
.attr-row:last-child{border-bottom:none;}
.attr-ic{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--pink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.attr-row .an{font-weight:700;font-size:14px;}
.attr-row .ad{font-size:12px;color:var(--muted);}
.attr-row .aspacer{flex:1;min-width:0;}
.mono{font-family:'Inter',monospace;font-variant-numeric:tabular-nums;}
.rulecard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px;min-width:0;}
.match-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);min-width:0;}
.match-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.match-score{font-size:22px;font-weight:800;color:var(--pink);}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0;}
@media(max-width:560px){.mrow{grid-template-columns:1fr;}}
.mcol{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-width:0;}
.mcol .msrc{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.mcol .mval{font-size:14px;font-weight:600;margin-top:2px;word-break:break-word;}
.mcol .diff{color:var(--bad);}
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlitem{position:relative;padding:0 0 18px 8px;min-width:0;}
.tlitem:last-child{padding-bottom:0;}
.tlitem .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--pink);}
.tlitem .tlt{font-weight:700;font-size:14px;}
.tlitem .tlm{font-size:12px;color:var(--muted);margin-top:2px;}
.tlitem .tld{font-size:13px;margin-top:5px;}
.flowsteps{display:flex;flex-wrap:wrap;gap:10px;}
.fstep{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);}
.fstep .fn{font-size:11px;font-weight:800;color:var(--pink2);}
.fstep .ft{font-weight:700;font-size:14px;margin-top:3px;}
.fstep .fd{font-size:12px;color:var(--muted);margin-top:4px;}
.sync-node{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-width:0;}
.sync-node .sic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
.sync-node .sn{font-weight:700;font-size:14px;}
.sync-node .sd{font-size:12px;color:var(--muted);}
.sync-node .sspacer{flex:1;min-width:0;}
.dot-live{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok);}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.metric-mini{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--line);}
.section-gap{margin-top:16px;}
@media(max-width:560px){.navbtn span.lbl{display:none;}.navbtn{padding:8px 10px;}.brand h1{font-size:15px;}.brand .env{display:none;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">hub</span></div>
    <div style="min-width:0;">
      <h1>資料治理與主資料管理平台（MDM）</h1>
      <div class="sub">從主資料建模、比對去重到下游同步的單一可信資料治理</div>
    </div>
    <div class="spacer"></div>
    <div class="env"><span class="material-symbols-outlined" style="font-size:15px;">database</span> 生產環境 · v2.6</div>
  </div>
</header>
<nav class="nav">
  <div class="navwrap" id="nav"></div>
</nav>
<main><div id="screen"></div></main>

<script>
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function el(id){return document.getElementById(id);}

var MODULES=[
 {icon:'account_tree',name:'主資料建模'},
 {icon:'rule',name:'品質規則'},
 {icon:'fact_check',name:'比對去重'},
 {icon:'verified',name:'審核發佈'},
 {icon:'insights',name:'下游同步'},
 {icon:'monitoring',name:'治理儀表板'}
];

function buildNav(){
 var h='';
 for(var i=0;i<MODULES.length;i++){
  h+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
 }
 el('nav').innerHTML=h;
}

function setActive(i){
 var b=document.querySelectorAll('.navbtn');
 for(var k=0;k<b.length;k++){b[k].classList.toggle('active',k===i);}
}

function head(eyebrow,title,desc){
 return '<div class="screenhead"><div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>';
}

function kpi(icon,label,val,foot,note,dir){
 var n='';if(note){n='<div class="kfoot">'+(dir?'<span class="'+dir+'">'+note+'</span>':note)+'</div>';}
 return '<div class="kpi"><div class="klabel"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div><div class="kval">'+val+'</div><div class="kfoot">'+foot+'</div>'+n+'</div>';
}
function tl(t,m,d){return '<div class="tlitem"><span class="dot"></span><div class="tlt">'+t+'</div><div class="tlm">'+m+'</div><div class="tld">'+d+'</div></div>';}
function fstep(n,t,d){return '<div class="fstep"><div class="fn">'+n+'</div><div class="ft">'+t+'</div><div class="fd">'+d+'</div></div>';}
function chOpt(o){o=o||{};
 var sc={x:{stacked:!!o.stacked,grid:{display:false},ticks:{font:{family:'Inter'}}},y:{stacked:!!o.stacked,beginAtZero:o.min===undefined,grid:{color:'#f3e0ec'},ticks:{font:{family:'Inter'}}}};
 if(o.max!==undefined)sc.y.max=o.max;if(o.min!==undefined)sc.y.min=o.min;
 var opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{family:'Inter'}}}},scales:sc};
 if(o.indexAxis){opt.indexAxis=o.indexAxis;sc.x.beginAtZero=true;if(o.max!==undefined){sc.x.max=o.max;delete sc.y.max;}}
 return opt;
}

/* ---------- SCREEN 0: 主資料建模 ---------- */
function screen0(){
 var attrs=[
  {ic:'tag',n:'物料編號 MaterialNo',d:'必填 · 8碼英數 · 全域唯一',fill:100,req:1},
  {ic:'label',n:'物料名稱 MaterialName',d:'必填 · 中英雙語 · 命名規則 NR-07',fill:98,req:1},
  {ic:'category',n:'物料類別 Category',d:'必填 · 代碼字典 DICT-CAT',fill:96,req:1},
  {ic:'straighten',n:'計量單位 UoM',d:'必填 · 代碼字典 DICT-UOM',fill:94,req:1},
  {ic:'inventory_2',n:'安全庫存 SafetyStock',d:'選填 · 數值 · 由生管維護',fill:71,req:0},
  {ic:'factory',n:'供應廠商 Vendor',d:'選填 · 關聯供應商主檔',fill:83,req:0}
 ];
 var entities=[
  {n:'物料主資料',c:'12,840',own:'資訊部',v:'v3.2'},
  {n:'客戶主資料',c:'4,206',own:'業務部',v:'v2.8'},
  {n:'供應商主資料',c:'1,935',own:'採購部',v:'v2.1'},
  {n:'BOM 結構主資料',c:'8,517',own:'研發部',v:'v1.9'}
 ];
 var h=head('MODULE 01 · MODELING','主資料建模與標準化','定義各主資料實體的模型、必填屬性、命名規則與代碼字典，建立全公司單一標準。');
 h+='<div class="grid g4">';
 h+=kpi('inventory_2','主資料實體','4','個實體域','標準已核定');
 h+=kpi('rule','標準屬性','42','個欄位','含 18 必填');
 h+=kpi('menu_book','代碼字典','9','套字典','1,204 個代碼');
 h+=kpi('verified','標準版本','v3.2','物料主檔','2026/08/10 發佈');
 h+='</div>';
 h+='<div class="grid g32 section-gap">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>主資料實體清單</h3><div class="scroll"><table><thead><tr><th>實體域</th><th>紀錄數</th><th>資料負責人</th><th>版本</th><th>狀態</th></tr></thead><tbody>';
 for(var i=0;i<entities.length;i++){var e=entities[i];
  h+='<tr><td><b>'+e.n+'</b></td><td class="mono">'+e.c+'</td><td>'+e.own+'</td><td>'+e.v+'</td><td><span class="tag t-ok">已核定</span></td></tr>';
 }
 h+='</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">description</span>物料主資料屬性</h3>';
 for(var j=0;j<attrs.length;j++){var a=attrs[j];
  h+='<div class="attr-row"><div class="attr-ic"><span class="material-symbols-outlined">'+a.ic+'</span></div><div style="min-width:0;"><div class="an">'+a.n+' '+(a.req?'<span class="tag t-pink">必填</span>':'')+'</div><div class="ad">'+a.d+'</div></div><div class="aspacer"></div><div style="text-align:right;min-width:70px;"><div class="mono" style="font-weight:700;">'+a.fill+'%</div><div class="bar-lite"><i style="width:'+a.fill+'%"></i></div></div></div>';
 }
 h+='</div></div>';
 h+='<div class="grid g2 section-gap"><div class="card"><h3><span class="material-symbols-outlined">insights</span>各實體屬性填充率</h3><div class="chartbox" style="height:260px"><canvas id="c0a"></canvas></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">history</span>標準版本異動</h3><div class="timeline">'+
  tl('v3.2 · 新增雙語命名規則','2026/08/10 · 資訊部','物料名稱套用 NR-07 命名規則，強制中英雙語欄位。')+
  tl('v3.1 · 擴充計量單位字典','2026/07/22 · 資訊部','DICT-UOM 新增 6 個國際單位代碼。')+
  tl('v3.0 · 主資料模型重構','2026/06/30 · 資料治理委員會','統一 ERP/MES 屬性命名，去除 3 組別名欄位。')+
  '</div></div></div>';
 return h;
}
function initScreen0(){
 charts.c0a=new Chart(el('c0a'),{type:'bar',data:{labels:['物料','客戶','供應商','BOM'],datasets:[{label:'必填填充率 %',data:[97,91,88,84],backgroundColor:'#db2777',borderRadius:6},{label:'選填填充率 %',data:[76,68,71,59],backgroundColor:'#f9a8d4',borderRadius:6}]},options:chOpt({max:100})});
}

/* ---------- SCREEN 1: 品質規則 ---------- */
function screen1(){
 var rules=[
  {id:'DQ-01',t:'物料編號唯一性',d:'MaterialNo 不得重複，跨 ERP/MES 全域唯一。',type:'唯一性',pass:99.6,fail:52},
  {id:'DQ-02',t:'必填欄位完整性',d:'18 個必填欄位不得為空值。',type:'完整性',pass:97.1,fail:372},
  {id:'DQ-03',t:'計量單位有效性',d:'UoM 必須存在於 DICT-UOM 字典。',type:'有效性',pass:99.9,fail:14},
  {id:'DQ-04',t:'命名規則符合度',d:'物料名稱需符合命名規則 NR-07。',type:'一致性',pass:92.4,fail:978},
  {id:'DQ-05',t:'類別代碼參照',d:'Category 需參照 DICT-CAT 有效代碼。',type:'參照完整',pass:98.3,fail:218},
  {id:'DQ-06',t:'安全庫存數值範圍',d:'SafetyStock 需為 0 以上數值。',type:'合理性',pass:99.2,fail:103}
 ];
 var h=head('MODULE 02 · DATA QUALITY','資料品質規則與稽核','設定品質檢核規則，依唯一性、完整性、有效性等維度自動稽核來源資料並產生缺失清單。');
 h+='<div class="grid g4">';
 h+=kpi('rule','啟用規則','24','條規則','6 大維度');
 h+=kpi('task_alt','整體合格率','97.4','%','較上週 +1.8%','up');
 h+=kpi('warning','待處理缺失','1,737','筆','較上週 -412','down');
 h+=kpi('gavel','稽核批次','昨日','已執行','06:00 自動跑批');
 h+='</div>';
 h+='<div class="grid g23 section-gap">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">checklist</span>品質規則檢核結果</h3><div class="scroll"><table><thead><tr><th>規則</th><th>名稱</th><th>維度</th><th>合格率</th><th>缺失數</th><th>狀態</th></tr></thead><tbody>';
 for(var i=0;i<rules.length;i++){var r=rules[i];var st=r.pass>=98?'t-ok':(r.pass>=95?'t-warn':'t-bad');var stx=r.pass>=98?'良好':(r.pass>=95?'關注':'需改善');
  h+='<tr><td><span class="tag t-pink mono">'+r.id+'</span></td><td><b>'+r.t+'</b><div class="ad" style="font-size:11px;color:var(--muted)">'+r.d+'</div></td><td><span class="tag t-info">'+r.type+'</span></td><td class="mono">'+r.pass+'%</td><td class="mono">'+r.fail+'</td><td><span class="tag '+st+'">'+stx+'</span></td></tr>';
 }
 h+='</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>缺失維度分布</h3><div class="chartbox" style="height:240px"><canvas id="c1a"></canvas></div>'+
  '<div class="legend"><span><i style="background:#db2777"></i>一致性 978</span><span><i style="background:#f472b6"></i>完整性 372</span><span><i style="background:#f9a8d4"></i>參照 218</span><span><i style="background:#fbcfe8"></i>其他 169</span></div></div>';
 h+='</div>';
 h+='<div class="card section-gap"><h3><span class="material-symbols-outlined">trending_up</span>近 6 週品質合格率趨勢</h3><div class="chartbox" style="height:230px"><canvas id="c1b"></canvas></div></div>';
 return h;
}
function initScreen1(){
 charts.c1a=new Chart(el('c1a'),{type:'doughnut',data:{labels:['一致性','完整性','參照完整','其他'],datasets:[{data:[978,372,218,169],backgroundColor:['#db2777','#f472b6','#f9a8d4','#fbcfe8'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false}}}});

  h+='<div class="match-card"><div class="match-head"><span class="pill">'+p.src+'</span><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--muted)">相似度</span><span class="match-score">'+p.score+'</span></div></div><div class="mrow">'+

function mcol(label,o,diff){
 function f(k){var isd=diff.indexOf(k)>=0;return '<div class="mval'+(isd?' diff':'')+'">'+o[k]+'</div>';}
 var ud=(diff.indexOf('uom')>=0||diff.indexOf('cat')>=0);
 return '<div class="mcol"><div class="msrc">'+label+'</div>'+
  '<div style="font-size:11px;color:var(--muted);margin-top:6px">料號</div>'+f('no')+
  '<div style="font-size:11px;color:var(--muted);margin-top:6px">名稱</div>'+f('nm')+
  '<div style="font-size:11px;color:var(--muted);margin-top:6px">單位 / 類別</div><div class="mval'+(ud?' diff':'')+'">'+o.uom+' / '+o.cat+'</div></div>';
}
