<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>現場控制系統 SFC · 製造現場控制終端</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e0b1a; --panel:#171331; --panel2:#1f1a3d; --line:#2c2554;
  --ink:#ece9fb; --mut:#9d95c9; --acc:#7c3aed; --acc2:#a78bfa;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC",sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  line-height:1;vertical-align:middle;font-size:20px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#140f2b,#1c1440);
  border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 0 16px rgba(124,58,237,.5)}
.brand b{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--mut);font-weight:500}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);
  background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:20px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.nav{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;
  background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.nav button:hover{color:var(--ink);border-color:var(--acc)}
.nav button.on{background:linear-gradient(135deg,var(--acc),#6d28d9);color:#fff;border-color:var(--acc);
  box-shadow:0 4px 14px rgba(124,58,237,.35)}
.nav button .num{font-size:11px;opacity:.7}
.wrap{padding:18px 16px 48px;max-width:1360px;margin:0 auto}
.head{margin-bottom:16px}
.head h1{margin:0 0 4px;font-size:21px;font-weight:800}
.head p{margin:0;color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ctit{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:0 0 12px;color:var(--ink)}
.ctit .material-symbols-outlined{color:var(--acc2);font-size:19px}
.ctit small{margin-left:auto;color:var(--mut);font-weight:500;font-size:11px}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.35),transparent 70%)}
.kpi .kl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .kv{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:.5px}
.kpi .kd{font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.c-ok{background:rgba(52,211,153,.15);color:var(--ok)}
.c-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.c-bad{background:rgba(248,113,113,.15);color:var(--bad)}
.c-info{background:rgba(96,165,250,.15);color:var(--info)}
.c-acc{background:rgba(167,139,250,.18);color:var(--acc2)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.4px;white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(44,37,84,.6);white-space:nowrap}
tr:hover td{background:rgba(124,58,237,.06)}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.board>*{min-width:0}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.colh{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.colh .cnt{font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--mut)}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk b{font-size:12.5px;display:block}
.tk .meta{font-size:11px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
.pipe{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.node{flex:none;width:132px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center;position:relative}
.node .st{font-size:24px}
.node b{display:block;font-size:12.5px;margin:4px 0 2px}
.node small{font-size:11px;color:var(--mut)}
.node .lk{position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--acc2);z-index:2}
.node.done{border-color:var(--ok)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--acc);border:2px solid var(--panel)}
.tl .ev.b::before{background:var(--bad)}.tl .ev.g::before{background:var(--ok)}.tl .ev.w::before{background:var(--warn)}
.tl .t{font-size:11px;color:var(--mut)}
.tl .ev b{font-size:13px}
.tl .ev p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(44,37,84,.6)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.row .tx{min-width:0;flex:1}
.row .tx b{font-size:12.5px;display:block}
.row .tx small{font-size:11px;color:var(--mut)}
.mx{display:grid;gap:6px;min-width:420px}
.mx .r{display:grid;grid-template-columns:90px repeat(6,1fr);gap:6px;align-items:center}
.mx .r>*{min-width:0}
.mx .hd{font-size:10px;color:var(--mut);text-align:center;padding:2px}
.mx .lb{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0e0b1a}
.canwrap{position:relative;width:100%}
.canwrap.h220{height:220px}.canwrap.h240{height:240px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.foot{margin-top:26px;text-align:center;color:var(--mut);font-size:11px}
@media(max-width:560px){.nav button .lbl{display:none}.nav button{padding:9px 11px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div><b>SFC 現場控制終端</b><span>Shop Floor Control · 工序卡控 · 過站放行</span></div>
  </div>
  <div class="live"><span class="dot"></span>製造現場即時連線 · Line-A / Line-B</div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap"><div id="app"></div>
  <div class="foot">現場控制系統（Shop Floor Control, SFC）· 純前端展示 · 資料為模擬示意</div>
</div>

<script>
var C={ink:"#ece9fb",mut:"#9d95c9",line:"#2c2554",acc:"#7c3aed",acc2:"#a78bfa",
  ok:"#34d399",warn:"#fbbf24",bad:"#f87171",info:"#60a5fa"};
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function gopt(extra){
  var o={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:C.mut,font:{size:11},boxWidth:12}}},
    scales:{x:{ticks:{color:C.mut,font:{size:10}},grid:{color:"rgba(44,37,84,.6)"}},
            y:{ticks:{color:C.mut,font:{size:10}},grid:{color:"rgba(44,37,84,.6)"}}}};
  if(extra&&extra.noleg)o.plugins.legend.display=false;
  return o;
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function kpi(label,val,icon,unit,dir,note){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined" style="font-size:16px;color:var(--acc2)">'+icon+'</span>'+esc(label)+'</div>'+
    '<div class="kv">'+esc(val)+' <span style="font-size:12px;color:var(--mut);font-weight:600">'+esc(unit)+'</span></div>'+
    '<div class="kd '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arrow+'</span> '+esc(note)+'</div></div>';
}

var MODS=[
  {ic:"account_tree",t:"工序流程卡控",s:"Router 工藝路線"},
  {ic:"playlist_add_check",t:"作業許可放行",s:"過站資格判定"},
  {ic:"sensors",t:"現場資料採集",s:"掃碼與設備參數"},
  {ic:"block",t:"異常攔截管理",s:"暫扣與覆核"},
  {ic:"route",t:"在製追溯履歷",s:"批次過站軌跡"},
  {ic:"insights",t:"現場管制指標",s:"攔截率與週期時間"}
];

/* ===== SCREEN 0 : 工序流程卡控 Router ===== */
function ruleRow(id,t,tag,cc){
  return '<div class="row"><div class="ic"><span class="material-symbols-outlined" style="color:var(--acc2)">gavel</span></div>'+
    '<div class="tx"><b>'+esc(t)+'</b><small class="mono">'+esc(id)+'</small></div>'+
    '<span class="chip '+cc+'">'+esc(tag)+'</span></div>';
}
function v0(el){
  var steps=[
    {n:"OP10 上料",st:"done",m:"上料/清洗"},
    {n:"OP20 CNC粗銑",st:"done",m:"CNC-01"},
    {n:"OP30 CNC精銑",st:"cur",m:"CNC-04"},
    {n:"OP40 去毛邊",st:"wait",m:"手動站"},
    {n:"OP50 CMM量測",st:"wait",m:"三次元"},
    {n:"OP60 入庫過站",st:"wait",m:"WIP庫"}
  ];
  var pipe=steps.map(function(s,i){
    var cls=s.st==="done"?"done":"";
    var icon=s.st==="done"?'<span class="material-symbols-outlined" style="color:var(--ok)">check_circle</span>':
             s.st==="cur"?'<span class="material-symbols-outlined" style="color:var(--acc2)">radio_button_checked</span>':
             '<span class="material-symbols-outlined" style="color:var(--mut)">circle</span>';
    var lk=i<steps.length-1?'<span class="material-symbols-outlined lk">chevron_right</span>':'';
    return '<div class="node '+cls+'"><div class="st">'+icon+'</div><b>'+esc(s.n)+'</b><small>'+esc(s.m)+'</small>'+lk+'</div>';
  }).join("");
  var routers=[
    {id:"RT-A320",p:"精密齒輪座",v:"v4.2",op:"8 工序",st:"啟用",cc:"c-ok",lc:98},
    {id:"RT-B117",p:"鋁製散熱鰭片",v:"v2.7",op:"6 工序",st:"啟用",cc:"c-ok",lc:96},
    {id:"RT-C085",p:"不鏽鋼法蘭",v:"v1.9",op:"9 工序",st:"試作",cc:"c-warn",lc:71},
    {id:"RT-D204",p:"醫療植入件",v:"v3.1",op:"11 工序",st:"啟用",cc:"c-ok",lc:99},
    {id:"RT-E060",p:"連接器外殼",v:"v0.8",op:"5 工序",st:"停用",cc:"c-bad",lc:42}
  ];
  var rrows=routers.map(function(r){
    return '<tr><td class="mono">'+esc(r.id)+'</td><td>'+esc(r.p)+'</td><td class="mono">'+esc(r.v)+'</td>'+
      '<td>'+esc(r.op)+'</td><td><span class="chip '+r.cc+'">'+esc(r.st)+'</span></td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+r.lc+'%"></i></div><span class="mono" style="font-size:11px">'+r.lc+'%</span></div></td></tr>';
  }).join("");
  el.innerHTML=
  '<div class="head"><h1>工序流程卡控（Router 管理）</h1><p>定義產品工藝路線、工序前後順序與版本控管，作為過站資格比對的唯一依據。</p></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("已啟用 Router","32","account_tree","組工藝路線","up","+3 本月")+
    kpi("平均工序數","7.4","layers","工序/路線","flat","持平")+
    kpi("版本鎖定率","96%","lock","禁止越版投產","up","+4pt")+
    kpi("待審路線","3","pending_actions","試作待放行","flat","2 已過期")+
  '</div>'+
  '<div class="card" style="margin-bottom:14px"><div class="ctit"><span class="material-symbols-outlined">route</span>工單 WO-2026-0813-07 · Router RT-A320 v4.2 · 精密齒輪座<small>目前工序 OP30</small></div>'+
    '<div class="tw"><div class="pipe">'+pipe+'</div></div></div>'+
  '<div class="grid g23">'+
    '<div class="card pad0"><div class="ctit" style="padding:16px 16px 0">'+
      '<span class="material-symbols-outlined">account_tree</span>工藝路線版本清單</div>'+
      '<div class="tw"><table><thead><tr><th>路線編號</th><th>產品</th><th>版本</th><th>工序</th><th>狀態</th><th>過站合規率</th></tr></thead><tbody>'+rrows+'</tbody></table></div></div>'+
    '<div class="card"><div class="ctit"><span class="material-symbols-outlined">rule</span>卡控規則（現行）</div>'+
      ruleRow("RULE-01","前置工序未完成禁止過站","攔截跳站","c-bad")+
      ruleRow("RULE-02","缺料批次禁止投產放行","到料前暫扣","c-warn")+
      ruleRow("RULE-03","越版投產強制攔截","版本鎖定","c-info")+
      ruleRow("RULE-04","設備負載>85%改排產線","負載保護","c-acc")+
    '</div>'+
  '</div>';
}

/* ===== SCREEN 1 : 作業執行 ===== */
function v1(el){
  var jobs=[
    {b:"批次 LOT-77120",op:"OP30 精銑",m:"CNC-04",qty:"120/150",pct:80,st:"作業中",cc:"c-info"},
    {b:"批次 LOT-77133",op:"OP20 粗銑",m:"CNC-01",qty:"48/200",pct:24,st:"作業中",cc:"c-info"},
    {b:"批次 LOT-77098",op:"OP50 量測",m:"CMM-02",qty:"30/30",pct:100,st:"待過站",cc:"c-ok"},
    {b:"批次 LOT-77145",op:"OP10 上料",m:"LOAD-1",qty:"0/300",pct:2,st:"待投入",cc:"c-warn"}
  ];
  var jrows=jobs.map(function(j){
    return '<div class="card" style="padding:13px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
      '<div style="min-width:0"><b style="font-size:13px">'+esc(j.b)+'</b><div style="font-size:11px;color:var(--mut);margin-top:2px">'+esc(j.op)+' · '+esc(j.m)+'</div></div>'+
      '<span class="chip '+j.cc+'">'+esc(j.st)+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><div class="bar" style="flex:1"><i style="width:'+j.pct+'%"></i></div>'+
      '<span class="mono" style="font-size:12px">'+esc(j.qty)+'</span></div></div>';
  }).join("");
  el.innerHTML=
  '<div class="head"><h1>作業執行 · 現場工站看板</h1><p>放行後執行本工序作業，同步採集設備參數與工時，即時回寫過站履歷與進度。</p></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("在製批次","28","inventory_2","LOT 在線","up","+2")+
    kpi("本班報工數","1,842","done_all","件","up","+6.1%")+
    kpi("平均工序耗時","14.6","timer","分/站","down","-1.2 分")+
    kpi("直通良率","98.2%","verified","FPY","up","+0.7pt")+
  '</div>'+
  '<div class="grid g32">'+
    '<div><div class="ctit"><span class="material-symbols-outlined">precision_manufacturing</span>進行中批次作業</div>'+jrows+'</div>'+
    '<div class="card"><div class="ctit"><span class="material-symbols-outlined">show_chart</span>近 8 小時報工趨勢<small>件/時</small></div>'+
      '<div class="canwrap h240"><canvas id="c-v1a"></canvas></div>'+
      '<div class="legend"><span><i style="background:'+C.acc2+'"></i>實際報工</span><span><i style="background:'+C.info+'"></i>目標節拍</span></div></div>'+
  '</div>';
  void el.offsetHeight;
  charts.push(new Chart(document.getElementById("c-v1a"),{type:"line",
    data:{labels:["08","09","10","11","12","13","14","15"],
      datasets:[
        {label:"實際報工",data:[210,238,255,190,120,244,261,258],borderColor:C.acc2,backgroundColor:"rgba(167,139,250,.15)",fill:true,tension:.35,borderWidth:2,pointRadius:2},
        {label:"目標節拍",data:[240,240,240,240,140,240,240,240],borderColor:C.info,borderDash:[5,4],fill:false,tension:0,borderWidth:2,pointRadius:0}
      ]},options:gopt()}));
}

/* ===== SCREEN 2 : 批次投入 / 現場資料採集 ===== */
function v2(el){
  var scans=[
    {t:"14:38:20",lot:"LOT-77145",op:"OP10 上料",who:"陳志明",r:"放行",cc:"c-ok"},
    {t:"14:37:02",lot:"LOT-77133",op:"OP20 粗銑",who:"林淑芬",r:"放行",cc:"c-ok"},
    {t:"14:35:41",lot:"LOT-77140",op:"OP40 去毛邊",who:"王大同",r:"攔截·漏OP30",cc:"c-bad"},
    {t:"14:34:10",lot:"LOT-77120",op:"OP30 精銑",who:"陳志明",r:"放行",cc:"c-ok"},
    {t:"14:31:55",lot:"LOT-77118",op:"OP50 量測",who:"李美玲",r:"放行",cc:"c-ok"},

var SCREENS=[v0,v1,v2,v3,v4,v5];
function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].ic+'</span><span class="lbl">'+esc(MODS[i].t)+'</span><span class="num">'+i+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  killCharts();
  var app=document.getElementById("app");
  app.innerHTML="";
  var el=document.createElement("div");
  app.appendChild(el);
  SCREENS[i](el);
  void app.offsetHeight;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].className=(+btns[k].getAttribute("data-i")===i)?"on":"";
  }
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
