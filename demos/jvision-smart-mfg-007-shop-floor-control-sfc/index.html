<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>現場控制系統 SFC · 製造現場控制終端</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#EC4899;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#86EFAC;
  --ok:#15803D;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow:7px 7px 0 #14532D;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  overflow-x:hidden;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(21,128,61,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.08) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Fira Sans",sans-serif;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:grid;
  grid-template-columns:minmax(250px,1fr) auto;
  gap:0;
  background:var(--color-card);
  border-bottom:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:12px 18px;
  border-right:3px solid var(--ink);
}
.logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:0 0 auto;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--color-accent);
}
.brand b{
  display:block;
  font-size:16px;
  font-weight:800;
  letter-spacing:.03em;
}
.brand small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 18px;
  color:var(--ink);
  background:#DCFCE7;
  font:600 11px/1.4 "Fira Code",monospace;
}
.dot{
  width:10px;
  height:10px;
  background:var(--ok);
  border:2px solid var(--ink);
}
.nav{
  grid-column:1/-1;
  display:flex;
  overflow-x:auto;
  border-top:3px solid var(--ink);
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:45px;
  padding:9px 15px;
  white-space:nowrap;
  color:var(--ink);
  background:var(--color-card);
  border:0;
  border-right:2px solid var(--ink);
  font-size:12px;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease;
}
.nav button:hover{background:#DCFCE7}
.nav button.on{
  color:var(--color-on-accent);
  background:var(--color-accent);
}
.nav .num{
  padding:1px 4px;
  color:var(--ink);
  background:#fff;
  border:1px solid var(--ink);
  font:700 9px "Fira Code",monospace;
}
.wrap{
  width:min(1440px,100%);
  margin:auto;
  padding:24px 18px 56px;
}
.screen{animation:reveal .35s ease-out both}
.head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:18px;
  margin:0 0 22px;
  padding:22px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.head::after{
  content:"LIVE PRODUCTION / SFC";
  align-self:start;
  padding:6px 8px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #000;
  font:700 10px "Fira Code",monospace;
}
.head h1{
  margin:0 0 7px;
  max-width:900px;
  font-size:clamp(23px,3vw,38px);
  line-height:1.06;
  font-weight:800;
}
.head p{
  max-width:850px;
  margin:0;
  color:#F0FDF4;
  font-size:13px;
  line-height:1.65;
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card,.kpi,.col,.node{
  min-width:0;
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
}
.card{padding:16px}
.card.pad0{padding:0;overflow:hidden}
.kpi{
  position:relative;
  min-height:142px;
  padding:15px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:18px;
  height:100%;
  background:var(--color-border);
  border-left:2px solid var(--ink);
}
.kpi:nth-child(even)::before{background:var(--color-accent)}
.kl{
  display:flex;
  align-items:center;
  gap:7px;
  padding-right:18px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
}
.kv{
  margin:12px 20px 6px 0;
  font:800 28px/1 "Fira Code",monospace;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kv small{
  color:var(--muted);
  font:600 11px "Fira Sans",sans-serif;
  letter-spacing:0;
}
.kd{
  display:flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--warn)}
.ctit{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 13px;
  font-size:13px;
  font-weight:800;
}
.ctit>.material-symbols-outlined{color:var(--color-primary)}
.ctit small{
  margin-left:auto;
  color:var(--muted);
  font:500 10px "Fira Code",monospace;
}
.pad0>.ctit{padding:15px 15px 0}
.tw{overflow-x:auto}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:12px;
}
th{
  padding:10px;
  text-align:left;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid var(--ink);
  font:700 10px "Fira Code",monospace;
  letter-spacing:.04em;
  white-space:nowrap;
}
td{
  padding:10px;
  border:1px solid var(--line);
  white-space:nowrap;
}
tbody tr:nth-child(even){background:#F0FDF4}
tbody tr:hover{background:#DCFCE7}
td:nth-last-child(1){font-variant-numeric:tabular-nums}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  color:var(--ink);
  background:#fff;
  border:1.5px solid currentColor;
  font-size:10px;
  font-weight:800;
  line-height:1.3;
}
.c-ok{color:#166534;background:#DCFCE7}
.c-warn{color:#854D0E;background:#FEF3C7}
.c-bad{color:#991B1B;background:#FEE2E2}
.c-info{color:#075985;background:#E0F2FE}
.c-acc{color:#831843;background:#FCE7F3}
.bar{
  height:9px;
  min-width:70px;
  overflow:hidden;
  background:var(--color-muted);
  border:1px solid var(--ink);
}
.bar i{
  display:block;
  height:100%;
  background:var(--color-primary);
}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:50px;
  padding:8px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.ic{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  flex:none;
  background:#DCFCE7;
  border:2px solid var(--ink);
}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:12px}
.tx small{
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:var(--muted);
  font-size:10px;
  text-overflow:ellipsis;
}
.pipe{
  display:flex;
  gap:0;
  min-width:max-content;
  padding:5px 1px 9px;
}
.node{
  position:relative;
  width:150px;
  min-height:110px;
  padding:13px;
  text-align:center;
  border-right:0;
}
.node:last-child{border-right:2px solid var(--ink)}
.node.done{background:#DCFCE7}
.node.cur{background:#FCE7F3}
.node .st{font-size:24px}
.node b{display:block;margin:5px 0 3px;font-size:12px}
.node small{color:var(--muted);font-size:10px}
.node .lk{
  position:absolute;
  top:50%;
  right:-11px;
  z-index:2;
  display:grid;
  place-items:center;
  width:21px;
  height:21px;
  color:#fff;
  background:var(--ink);
  transform:translateY(-50%);
}
.board{
  display:grid;
  grid-template-columns:repeat(5,minmax(190px,1fr));
  gap:8px;
  min-width:980px;
}
.col{padding:10px;background:#F0FDF4}
.colh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
  padding-bottom:8px;
  border-bottom:2px solid var(--ink);
  font-size:11px;
  font-weight:800;
}
.cnt{
  padding:1px 6px;
  background:#fff;
  border:1px solid var(--ink);
  font:700 10px "Fira Code",monospace;
}
.tk{
  margin-bottom:8px;
  padding:9px;
  background:#fff;
  border:1px solid var(--ink);
  border-left:7px solid var(--color-primary);
}
.tk b{display:block;font-size:11px}
.tk>div{margin-top:4px;color:var(--muted);font-size:10px}
.meta{display:flex;justify-content:space-between;gap:5px}
.tl{
  position:relative;
  padding-left:25px;
}
.tl::before{
  content:"";
  position:absolute;
  top:3px;
  bottom:3px;
  left:7px;
  width:3px;
  background:var(--ink);
}
.ev{position:relative;margin-bottom:15px}
.ev::before{
  content:"i";
  position:absolute;
  top:1px;
  left:-25px;
  display:grid;
  place-items:center;
  width:17px;
  height:17px;
  color:#fff;
  background:var(--info);
  border:2px solid var(--ink);
  font:800 10px "Fira Code",monospace;
}
.ev.b::before{content:"!";background:var(--bad)}
.ev.w::before{content:"!";color:#000;background:#FBBF24}
.ev.g::before{content:"✓";background:var(--ok)}
.ev .t{color:var(--muted);font:600 10px "Fira Code",monospace}
.ev b{font-size:12px}
.ev p{margin:3px 0;color:var(--muted);font-size:11px;line-height:1.5}
.canwrap{position:relative;width:100%}
.h220{height:220px}
.h240{height:240px}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
}
.legend i{
  display:inline-block;
  width:12px;
  height:8px;
  margin-right:5px;
  border:1px solid var(--ink);
  vertical-align:middle;
}
.mx{display:grid;gap:5px;min-width:490px}
.mx .r{
  display:grid;
  grid-template-columns:90px repeat(6,1fr);
  gap:5px;
  align-items:center;
}
.mx .hd{
  padding:4px;
  color:var(--muted);
  text-align:center;
  font:600 9px "Fira Code",monospace;
}
.mx .lb{
  overflow:hidden;
  color:var(--muted);
  font:600 10px "Fira Code",monospace;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.cell{
  display:grid;
  place-items:center;
  height:32px;
  color:#071A0E;
  border:1px solid var(--ink);
  font:800 10px "Fira Code",monospace;
}
.foot{
  margin-top:32px;
  padding:18px;
  color:var(--color-on-primary);
  background:var(--ink);
  border:3px solid var(--ink);
  text-align:center;
  font:500 10px "Fira Code",monospace;
}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .top{grid-template-columns:1fr}
  .brand{border-right:0}
  .live{border-top:2px solid var(--ink)}
  .head{grid-template-columns:1fr}
  .head::after{justify-self:start;grid-row:1}
  .g3,.g2{grid-template-columns:1fr}
}
@media(max-width:480px){
  .wrap{padding:15px 10px 40px}
  .brand{padding:10px}
  .brand small{white-space:normal}
  .live{padding:8px 10px}
  .nav button{min-width:52px;padding:9px 12px}
  .nav .lbl{display:none}
  .head{padding:17px;box-shadow:4px 4px 0 var(--ink)}
  .head h1{font-size:24px}
  .g4{grid-template-columns:1fr}
  .kpi{min-height:122px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">account_tree</span></div>
    <div>
      <b>SFC 現場控制終端</b>
      <small>Shop Floor Control · 工序卡控 · 過站放行</small>
    </div>
  </div>
  <div class="live"><span class="dot" aria-hidden="true"></span>連線正常 · Line-A / Line-B</div>
  <nav class="nav" id="nav" aria-label="系統功能"></nav>
</header>
<main class="wrap">
  <div id="app"></div>
  <footer class="foot">現場控制系統（Shop Floor Control, SFC）· 純前端展示 · 資料為模擬示意</footer>
</main>
<script>
var C={
  ink:"#14532D",mut:"#475569",line:"#BBF7D0",acc:"#15803D",acc2:"#EC4899",
  ok:"#15803D",warn:"#A16207",bad:"#DC2626",info:"#0369A1",card:"#FFFFFF"
};
var charts=[];
function killCharts(){
  charts.forEach(function(c){try{c.destroy()}catch(e){}});
  charts=[];
}
function gopt(extra){
  var o={
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{labels:{color:C.mut,font:{family:"Fira Sans",size:11},boxWidth:12}}
    },
    scales:{
      x:{
        ticks:{color:C.mut,font:{family:"Fira Code",size:10}},
        grid:{color:"rgba(21,83,45,.14)"}
      },
      y:{
        ticks:{color:C.mut,font:{family:"Fira Code",size:10}},
        grid:{color:"rgba(21,83,45,.14)"}
      }
    }
  };
  if(extra&&extra.noleg)o.plugins.legend.display=false;
  return o;
}
function esc(s){
  return String(s).replace(/[&<>]/g,function(c){
    return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];
  });
}
function statusIcon(cc){
  if(cc==="c-ok")return "check_circle";
  if(cc==="c-bad")return "error";
  if(cc==="c-warn")return "warning";
  return "info";
}
function chip(text,cc){
  return '<span class="chip '+cc+'"><span class="material-symbols-outlined" style="font-size:13px" aria-hidden="true">'+statusIcon(cc)+'</span>'+esc(text)+'</span>';
}
function kpi(label,val,icon,unit,dir,note){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<article class="kpi"><div class="kl"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+esc(label)+'</div>'+
    '<div class="kv">'+esc(val)+' <small>'+esc(unit)+'</small></div>'+
    '<div class="kd '+cls+'"><span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">'+arrow+'</span>'+esc(note)+'</div></article>';
}
function heading(title,copy){
  return '<header class="head"><div><h1>'+esc(title)+'</h1><p>'+esc(copy)+'</p></div></header>';
}
var MODS=[
  {ic:"account_tree",t:"工序流程卡控",s:"Router 工藝路線"},
  {ic:"playlist_add_check",t:"作業許可放行",s:"過站資格判定"},
  {ic:"sensors",t:"現場資料採集",s:"掃碼與設備參數"},
  {ic:"block",t:"異常攔截管理",s:"暫扣與覆核"},
  {ic:"route",t:"在製追溯履歷",s:"批次過站軌跡"},
  {ic:"insights",t:"現場管制指標",s:"攔截率與週期時間"}
];
function ruleRow(id,t,tag,cc){
  return '<div class="row"><div class="ic"><span class="material-symbols-outlined" aria-hidden="true">gavel</span></div>'+
    '<div class="tx"><b>'+esc(t)+'</b><small class="mono">'+esc(id)+'</small></div>'+chip(tag,cc)+'</div>';
}
function v0(el){
  var steps=[
    {n:"OP10 上料",st:"done",m:"上料/清洗"},
    {n:"OP20 CNC粗銑",st:"done",m:"CNC-01"},
    {n:"OP30 CNC精銑",st:"cur",m:"CNC-04"},
    {n:"OP40 去毛邊",st:"wait",m:"手動站"},
    {n:"OP50 CMM量測",st:"wait",m:"三次元"},
    {n:"OP60 入庫過站",st:"wait",m:"WIP庫"}
  ];
  var pipe=steps.map(function(s,i){
    var icon=s.st==="done"?"check_circle":s.st==="cur"?"radio_button_checked":"circle";
    var text=s.st==="done"?"已完成":s.st==="cur"?"進行中":"待執行";
    return '<div class="node '+s.st+'"><div class="st"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span></div>'+
      '<b>'+esc(s.n)+'</b><small>'+esc(s.m)+' · '+text+'</small>'+
      (i<steps.length-1?'<span class="material-symbols-outlined lk" aria-hidden="true">chevron_right</span>':'')+'</div>';
  }).join("");
  var routers=[
    ["RT-A320","精密齒輪座","v4.2","8 工序","啟用","c-ok",98],
    ["RT-B117","鋁製散熱鰭片","v2.7","6 工序","啟用","c-ok",96],
    ["RT-C085","不鏽鋼法蘭","v1.9","9 工序","試作","c-warn",71],
    ["RT-D204","醫療植入件","v3.1","11 工序","啟用","c-ok",99],
    ["RT-E060","連接器外殼","v0.8","5 工序","停用","c-bad",42]
  ];
  var rows=routers.map(function(r){
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td>'+r[3]+'</td>'+
      '<td>'+chip(r[4],r[5])+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+r[6]+'%"></i></div><span class="mono">'+r[6]+'%</span></div></td></tr>';
  }).join("");
  el.innerHTML=heading("工序流程卡控（Router 管理）","定義產品工藝路線、工序前後順序與版本控管，作為過站資格比對的唯一依據。")+

function show(i){
  if(!Number.isInteger(i)||i<0||i>=SCREENS.length)i=0;
  killCharts();
  var app=document.getElementById("app");
  app.innerHTML='<section class="screen" aria-live="polite"></section>';
  SCREENS[i](app.firstElementChild);
  document.querySelectorAll("[data-i]").forEach(function(btn){
    var active=Number(btn.getAttribute("data-i"))===i;
    btn.classList.toggle("on",active);
    btn.setAttribute("aria-current",active?"page":"false");
  });
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var i=m?Math.min(Number(m[1]),SCREENS.length-1):0;
  show(i);
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
