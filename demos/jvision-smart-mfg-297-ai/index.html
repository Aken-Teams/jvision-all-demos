<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI經營決策助手</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#be185d;--accent2:#fb7185;--ink:#1f1420;--sub:#6b5563;
  --bg:#f7f2f5;--panel:#ffffff;--line:#efe1e9;--soft:#fdf2f7;
  --good:#0f9d6b;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh;min-width:0}
.side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,#7c1240,#be185d);color:#fff;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:0 0 auto}
.brand .logo .ms{font-size:24px;color:#fff}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;opacity:.8;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#ffe6f0;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;min-width:0}
.nav button .ms{font-size:21px;flex:0 0 auto}
.nav button .nt{min-width:0;overflow:hidden}
.nav button .nt>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button small{display:block;font-size:10.5px;font-weight:500;opacity:.72;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.10)}
.nav button.on{background:#fff;color:var(--accent)}
.nav button.on small{opacity:.7}
.side .foot{margin-top:auto;font-size:11px;opacity:.75;padding:10px 8px;border-top:1px solid rgba(255,255,255,.18)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top .tt{min-width:0}
.top .tt h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.top .tt p{font-size:12.5px;color:var(--sub)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.wrap{padding:22px;min-width:0}
.split{display:grid;grid-template-columns:340px 1fr;gap:18px;min-width:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}
.pane.pad{padding:16px}
.pane-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.pane-h h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.pane-h .ms{font-size:19px;color:var(--accent)}
.lst{display:flex;flex-direction:column;padding:8px;gap:6px}
.row{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;background:#fff;min-width:0}
.row:hover{border-color:var(--accent2);background:var(--soft)}
.row.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent) inset}
.row .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.row .rt{font-size:13.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs{font-size:11.5px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.t-red{background:#fdecef;color:var(--bad)}
.t-amb{background:#fef3e2;color:var(--warn)}
.t-grn{background:#e7f6ef;color:var(--good)}
.t-blu{background:#e8f0fe;color:var(--info)}
.t-gry{background:#f0eaee;color:var(--sub)}
.t-pnk{background:#fdf2f7;color:var(--accent)}
.grid{display:grid;gap:14px;min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.cards2{grid-template-columns:1fr 1fr}
.cards3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kv{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:.3px}
.kpi .kd{font-size:11.5px;margin-top:4px;font-weight:600}
.up{color:var(--good)}.dn{color:var(--bad)}
.sub{color:var(--sub)}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mt12{margin-top:12px}.mt14{margin-top:14px}
.sec-t{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.sec-t .ms{font-size:19px;color:var(--accent)}
.chart{width:100%;overflow:hidden;min-width:0}
.tblw{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--sub);font-weight:700;background:var(--soft)}
tr:last-child td{border-bottom:0}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.tik{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;min-width:0}
.tl{position:relative;padding-left:22px;min-width:0}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 6px;min-width:0}
.tli:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.tli.mut:before{background:var(--line)}
.tli .th{font-size:13px;font-weight:700}
.tli .tm{font-size:11.5px;color:var(--sub);margin-top:2px}
.steps{display:flex;gap:0;min-width:0;overflow-x:auto}
.step{flex:1;text-align:center;position:relative;padding:0 4px;min-width:64px}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;margin:0 auto 6px;font-size:14px;font-weight:800}
.step.done .dot{background:var(--good)}.step.cur .dot{background:var(--accent)}
.step .sl{font-size:11px;font-weight:700}
.step:after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:last-child:after{display:none}
.step.done:after{background:var(--good)}
.step .dot,.step .sl{position:relative;z-index:1}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);border:1px solid var(--line)}
.qbar{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
.qbar .ms{color:var(--accent);font-size:20px;flex:0 0 auto}
.qbar .qt{font-size:13.5px;font-weight:600;min-width:0}
.ai{background:linear-gradient(135deg,#fff5f9,#ffeaf1);border:1px solid #f7cfe0;border-radius:13px;padding:13px 15px;min-width:0}
.ai .ah{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:6px}
.ai p{font-size:13px;color:var(--ink)}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);min-width:0}
.gauge{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:40px}
.gauge>i{display:block;height:100%;border-radius:99px}
.dl{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.dl>div{min-width:0}
.dl dt{font-size:11px;color:var(--sub);font-weight:600}
.dl dd{font-size:13.5px;font-weight:700;margin-top:2px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt h4{font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:6px}
.btnp{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btno{background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:column;padding:12px}
  .brand{padding-bottom:10px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;flex:1 1 130px}
  .nav button small{display:none}
  .side .foot{display:none}
}
@media(max-width:820px){
  .split{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .cards2,.cards3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .nt{display:none}
  .nav button{flex:1 1 auto;justify-content:center}
  .kpis{grid-template-columns:1fr 1fr}
  .wrap{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="ms">insights</span></div>
      <div>
        <h1>AI經營決策助手</h1>
        <p>Executive Decision Copilot</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">總經理室 · 經營企劃部 · 財務部<br/>資料即時同步 BI／ERP／財務系統</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="tt">
        <h2><span class="ms" id="scIcon">dashboard</span><span id="scName">經營決策台</span></h2>
        <p id="scDesc">自然語言問答與經營全景總覽</p>
      </div>
      <div class="sp"></div>
      <span class="chip"><span class="ms" style="font-size:16px">calendar_month</span>FY2026 Q2</span>
      <span class="chip"><span class="ms" style="font-size:16px">bolt</span>AI 已就緒</span>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"經營決策台",desc:"自然語言問答與經營全景總覽"},
  {icon:"insights",name:"異常洞察",desc:"AI 自動摘要異常並分析原因"},
  {icon:"account_tree",name:"情境模擬",desc:"決策選項推演與影響試算"},
  {icon:"task_alt",name:"決策建議",desc:"AI 產出建議與主管核定"},
  {icon:"monitoring",name:"執行追蹤",desc:"決策落地進度與成效追蹤"},
  {icon:"history",name:"決策稽核",desc:"決策紀錄與採納率稽核"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};opt.chart=Object.assign(baseChart,opt.chart||{});try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}
var PINK="#be185d",ROSE="#fb7185",GOOD="#0f9d6b",WARN="#d97706",BAD="#dc2626",INFO="#2563eb",LINE="#efe1e9";
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function splitShell(listTitle,listIcon,n){
  var lh='<div class="pane"><div class="pane-h"><h3><span class="ms">'+listIcon+'</span>'+listTitle+'</h3><span class="pill">'+n+'</span></div><div class="lst" id="lst"></div></div>';
  var dh='<div class="pane pad" id="dtl"></div>';
  return '<div class="split">'+lh+dh+'</div>';
}
function kpiCard(label,icon,val,delta,dir){
  return '<div class="card kpi"><div class="kl"><span class="ms" style="font-size:17px;color:var(--accent)">'+icon+'</span>'+label+'</div><div class="kv">'+val+'</div><div class="kd '+(dir||"sub")+'">'+delta+'</div></div>';
}
function rowHTML(id,title,sub,tagtxt,tagcls,i){
  return '<div class="row" data-r="'+i+'"><div class="r1"><span class="rt">'+esc(title)+'</span><span class="tag '+tagcls+'">'+esc(tagtxt)+'</span></div><div class="rs"><span>'+esc(id)+'</span><span>·</span><span>'+esc(sub)+'</span></div></div>';
}
function bindList(cb){
  var lst=document.getElementById("lst");if(!lst)return;
  var rows=lst.querySelectorAll(".row");
  function sel(el){for(var i=0;i<rows.length;i++)rows[i].classList.remove("on");el.classList.add("on");}
  for(var i=0;i<rows.length;i++){(function(el){el.addEventListener("click",function(){sel(el);cb(+el.getAttribute("data-r"));});})(rows[i]);}
  if(rows[0])rows[0].classList.add("on");
}

/* ============ SCREEN 0 : 經營決策台 ============ */
var Q0=[
  {id:"Q-2211",q:"本季營收與毛利率為何低於預算？",dept:"總經理室",tag:"熱門",tt:"t-pnk",hit:"營收 / 毛利率"},
  {id:"Q-2208",q:"哪些事業部現金流出現緊縮訊號？",dept:"財務部",tag:"現金流",tt:"t-red",hit:"營運現金流"},
  {id:"Q-2205",q:"華中廠稼動率下滑對交期的影響？",dept:"經營企劃部",tag:"營運",tt:"t-blu",hit:"準交率"},
  {id:"Q-2201",q:"研發費用佔比是否高於同業水準？",dept:"經營企劃部",tag:"費用",tt:"t-amb",hit:"研發費用比"}
];
function screen0(){
  var v=document.getElementById("view");
  v.innerHTML='<div class="qbar mb12"><span class="ms">search</span><div class="qt">請以自然語言提問，例如：「本季哪個事業部拖累整體獲利，主因是什麼？」</div><button class="btnp" style="margin-left:auto">AI 分析</button></div>'
    +'<div class="grid kpis mb12">'
    + kpiCard("本季營收","monetization_on","NT$ 12.84 億","較預算 −6.2%","dn")
    + kpiCard("合併毛利率","percent","28.4%","較預算 −2.1pt","dn")
    + kpiCard("營運現金流","account_balance","NT$ 1.92 億","較上季 +8.5%","up")
    + kpiCard("決策回應時間","schedule","1.4 天","縮短 63%","up")
    +'</div>'
    + splitShell("待分析經營問題","forum",Q0.length)
    +'<div class="grid cards2 mt14">'
    +'<div class="card"><div class="sec-t"><span class="ms">trending_up</span>營收 vs 預算（近 6 期）</div><div class="chart" id="c0a"></div></div>'
    +'<div class="card"><div class="sec-t"><span class="ms">donut_large</span>各事業部獲利貢獻</div><div class="chart" id="c0b"></div></div>'
    +'</div>';
  document.getElementById("lst").innerHTML=Q0.map(function(r,i){return rowHTML(r.id,r.q,r.dept+" · 對應 "+r.hit,r.tag,r.tt,i);}).join("");
  bindList(function(i){renderQ0(Q0[i]);});
  renderQ0(Q0[0]);
  void v.offsetHeight;
  mk("c0a",{chart:{type:"bar",height:260},series:[{name:"實際",data:[112,120,131,127,124,128.4]},{name:"預算",data:[118,124,130,132,133,136.8]}],colors:[PINK,"#f3c7d9"],plotOptions:{bar:{columnWidth:"56%",borderRadius:4}},dataLabels:{enabled:false},legend:{position:"top",fontSize:"12px"},grid:{borderColor:LINE},xaxis:{categories:["Q1'25","Q2'25","Q3'25","Q4'25","Q1'26","Q2'26"],labels:{style:{fontSize:"11px"}}},yaxis:{labels:{formatter:function(v){return v+" 千萬";},style:{fontSize:"11px"}}},tooltip:{shared:true,intersect:false}});
  mk("c0b",{chart:{type:"donut",height:260},series:[38,26,19,17],labels:["精密元件","電子模組","材料事業","服務事業"],colors:[PINK,ROSE,"#f9a8c4","#fbcfe0"],legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},plotOptions:{pie:{donut:{size:"62%"}}}});
}
function renderQ0(r){
  var d=document.getElementById("dtl");if(!d)return;
  d.innerHTML='<div class="pane-h" style="border:0;padding:0 0 12px"><h3><span class="ms">psychology</span>'+esc(r.id)+' AI 檢索結果</h3><span class="tag '+r.tt+'">'+esc(r.tag)+'</span></div>'
    +'<div class="qbar mb12"><span class="ms">help</span><div class="qt">'+esc(r.q)+'</div></div>'
    +'<div class="ai mb12"><div class="ah"><span class="ms">auto_awesome</span>AI 摘要</div><p>系統已自 BI、ERP 與財務系統彙整 <b>4 份資料源、8 張報表</b>。'+esc(r.hit)+' 主要受華中廠稼動率下滑與原物料成本上升影響，建議進入「異常洞察」查看歸因。</p></div>'
    +'<div class="dl mb12">'
    +'<div><dt>檢索來源</dt><dd>ERP · BI · 財務 · MES</dd></div>'
    +'<div><dt>資料期間</dt><dd>2026/04 – 2026/06</dd></div>'
    +'<div><dt>命中指標</dt><dd>'+esc(r.hit)+'</dd></div>'
    +'<div><dt>提問單位</dt><dd>'+esc(r.dept)+'</dd></div>'
    +'</div>'
    +'<div class="sec-t"><span class="ms">insights</span>建議下一步</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btnp">產生異常洞察</button><button class="btno">建立情境模擬</button><button class="btno">加入決策追蹤</button></div>';
}

/* ============ SCREEN 1 : 異常洞察 ============ */
var A1=[
  {id:"AN-501",name:"精密元件事業部 毛利率驟降",sev:"高",tag:"t-red",when:"連續 3 期偏離",owner:"財務部",delta:"−3.4pt",cause:"單價下修與良率下降",prob:82,drivers:[["售價下修",42],["材料成本上升",31],["良率下降",27]]},
  {id:"AN-498",name:"應收帳款週轉天數拉長",sev:"高",tag:"t-red",when:"超出上限 8 天",owner:"財務部",delta:"+11 天",cause:"大型客戶延遲付款",prob:76,drivers:[["A客戶逾期",55],["信用政策放寬",28],["對帳延遲",17]]},

    +'<div class="tblw"><table><thead><tr><th>紀錄編號</th><th>決策議題</th><th>動作</th><th>核定人</th><th>時間</th><th>結果</th></tr></thead><tbody>'
    + H5.map(function(r){return '<tr><td><b>'+esc(r.id)+'</b></td><td>'+esc(r.name)+'</td><td>'+esc(r.act)+'</td><td>'+esc(r.who)+'</td><td class="sub">'+esc(r.when)+'</td><td><span class="tag '+r.tag+'">'+esc(r.res)+'</span></td></tr>';}).join("")
    +'</tbody></table></div></div>';
  void v.offsetHeight;
  mk("c5a",{chart:{type:"bar",height:250},series:[{name:"採納率",data:[78,71,66,74]}],colors:[PINK,ROSE,"#f9a8c4","#fbcfe0"],plotOptions:{bar:{horizontal:true,borderRadius:4,barHeight:"56%",distributed:true}},dataLabels:{enabled:true,formatter:function(v){return v+"%";},style:{fontSize:"11px"}},legend:{show:false},grid:{borderColor:LINE},xaxis:{max:100,categories:["總經理室","財務部","經營企劃部","業務部"],labels:{style:{fontSize:"11px"}}}});
  mk("c5b",{chart:{type:"pie",height:250},series:[71,17,12],labels:["採納","退回補件","保留觀察"],colors:[GOOD,BAD,WARN],legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}}});
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  var m=MODS[i];
  document.getElementById("scIcon").textContent=m.icon;
  document.getElementById("scName").textContent=m.name;
  document.getElementById("scDesc").textContent=m.desc;
  var v=document.getElementById("view");
  v.innerHTML="";
  void v.offsetHeight;
  SCREENS[i]();
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="ms">'+m.icon+'</span><span class="nt"><span>'+m.name+'</span><small>'+m.desc+'</small></span></button>';}).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){(function(b){b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i");});})(btns[i]);}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
