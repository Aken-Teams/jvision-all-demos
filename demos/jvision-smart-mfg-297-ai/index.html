<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI經營決策助手</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E7DC;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --sub:#475569;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --soft:#E8F8F5;
  --good:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow:0 8px 22px rgba(19,78,74,.07);
  --shadow-hover:0 13px 28px rgba(19,78,74,.12);
}

*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:"Crimson Pro","Noto Sans TC",serif;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,[role="button"]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;min-width:0}
.side{
  width:248px;
  flex:0 0 248px;
  background:#0F4C47;
  color:#F0FDFA;
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
  min-width:0;
  border-right:1px solid #28766F;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(240,253,250,.17)}
.brand .logo{
  width:40px;
  height:40px;
  border-radius:4px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  display:grid;
  place-items:center;
  flex:0 0 auto;
  box-shadow:4px 4px 0 rgba(0,0,0,.18);
}
.brand .logo .ms{font-size:24px;color:#0F4C47}
.brand h1{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:17px;
  font-weight:700;
  letter-spacing:.035em;
  line-height:1.15;
}
.brand p{
  margin-top:3px;
  font-family:"Cinzel",serif;
  font-size:8px;
  letter-spacing:.09em;
  color:#B9E9E2;
}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:18px;min-width:0}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:48px;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  color:#D7F5F0;
  padding:9px 11px;
  border-radius:4px;
  font-size:15px;
  font-weight:600;
  min-width:0;
  transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease;
}
.nav button .ms{font-size:20px;flex:0 0 auto}
.nav button .nt{min-width:0;overflow:hidden}
.nav button .nt>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button small{
  display:block;
  margin-top:1px;
  font-size:11px;
  font-weight:400;
  color:#ACDCD5;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav button:hover{background:#17665F;border-color:#388C84;transform:translateX(2px)}
.nav button.on{background:#F0FDFA;border-color:#5EEAD4;color:#0F4C47;box-shadow:4px 4px 0 #2DD4BF}
.nav button.on small{color:#426C68}
.side .foot{
  margin-top:auto;
  color:#B9E9E2;
  font-size:11px;
  line-height:1.65;
  padding:14px 8px 4px;
  border-top:1px solid rgba(240,253,250,.17);
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  padding:14px 24px;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 0 rgba(13,148,136,.05);
  backdrop-filter:blur(10px);
}
.top .tt{min-width:0}
.top .tt h2{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:23px;
  font-weight:700;
  line-height:1.15;
  display:flex;
  align-items:center;
  gap:8px;
  letter-spacing:.01em;
}
.top .tt h2 .ms{color:var(--accent);font-size:22px}
.top .tt p{font-size:13px;color:var(--sub);margin-top:2px}
.top .sp{flex:1}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  background:#FFFFFF;
  color:#0F625B;
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 11px;
  font-size:12px;
  font-weight:600;
  box-shadow:2px 2px 0 #C7F3EC;
}
.wrap{padding:22px;min-width:0;max-width:1600px;width:100%;margin:0 auto}
.split{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:16px;min-width:0}
.pane,.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  min-width:0;
  box-shadow:var(--shadow);
}
.pane.pad{padding:17px}
.pane-h{
  min-height:51px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:space-between;
}
.pane-h h3,.sec-t{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:7px;
}
.pane-h .ms,.sec-t .ms{font-size:19px;color:var(--accent)}
.lst{display:flex;flex-direction:column;padding:8px;gap:6px}
.row{
  border:1px solid transparent;
  border-left:3px solid #BCEAE3;
  border-radius:3px;
  padding:10px 11px;
  cursor:pointer;
  background:#FAFEFD;
  min-width:0;
  transition:border-color .2s ease,background-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.row:hover{border-color:var(--accent2);background:#F0FDFA;transform:translateY(-1px)}
.row.on{border-color:var(--accent);border-left-color:var(--accent);background:#E7F8F4;box-shadow:3px 3px 0 #99E7DC}
.row .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.row .rt{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}
.row .rs span:first-child,
td:first-child,
td:nth-child(5),
.dl dd,.kv,.meter b{
  font-variant-numeric:tabular-nums;
}
.row .rs span:first-child,td:first-child,td:nth-child(5){font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
  padding:3px 8px;
  border-radius:3px;
  white-space:nowrap;
  flex:0 0 auto;
  border:1px solid currentColor;
}
.t-red{background:#FEF2F2;color:#B91C1C}
.t-red:before{content:"!";font-weight:800}
.t-amb{background:#FFF7ED;color:#9A5208}
.t-amb:before{content:"△";font-weight:800}
.t-grn{background:#ECFDF5;color:#047857}
.t-grn:before{content:"✓";font-weight:800}
.t-blu{background:#EFF6FF;color:#075985}
.t-blu:before{content:"i";font-weight:800}
.t-gry{background:#F1F5F9;color:#475569}
.t-pnk{background:#E6FFFA;color:#0F766E}
.t-pnk:before{content:"•";font-weight:800}
.grid{display:grid;gap:13px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{padding:15px}
.card,.pane,.row,.opt,.qbar,.ai,.tik{transition:box-shadow .22s ease,border-color .22s ease,transform .22s ease,background-color .22s ease}
.card:hover{border-color:#55D6C5;box-shadow:var(--shadow-hover)}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--accent)}
.kpi:after{content:"";position:absolute;right:-20px;top:-32px;width:74px;height:74px;border:1px solid #99E7DC;transform:rotate(45deg)}
.kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.kpi .kv{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:28px;
  font-weight:700;
  line-height:1.1;
  margin-top:7px;
  letter-spacing:.01em;
  position:relative;
  z-index:1;
}
.kpi .kd{font-size:12px;margin-top:5px;font-weight:600;position:relative;z-index:1}
.up{color:#047857}.up:before{content:"↑ ";font-weight:800}
.dn{color:#B91C1C}.dn:before{content:"↓ ";font-weight:800}
.sub{color:var(--sub)}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mt12{margin-top:12px}.mt14{margin-top:14px}
.sec-t{margin-bottom:10px}
.chart{width:100%;overflow:hidden;min-width:0}
.tblw{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:700px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:10px;
  letter-spacing:.05em;
  color:#315F5B;
  font-weight:600;
  background:#DDF5F1;
  border-bottom:2px solid var(--accent);
}
tbody tr:nth-child(even){background:#F8FCFB}
tbody tr:hover{background:#EAF9F6}
tr:last-child td{border-bottom:0}
td:nth-child(1),td:nth-child(5){font-variant-numeric:tabular-nums}
td:nth-child(n+3){text-align:right}
th:nth-child(n+3){text-align:right}
.bar{height:7px;border-radius:0;background:#D7EBE8;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-secondary),var(--color-primary))}
.tik{background:#FFFFFF;border:1px solid var(--line);border-radius:4px;padding:9px 10px;margin-bottom:8px;min-width:0}
.tl{position:relative;padding-left:22px;min-width:0}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#99E7DC}
.tli{position:relative;padding:0 0 16px 6px;min-width:0}
.tli:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:0;background:var(--accent);box-shadow:0 0 0 3px #DDF5F1;transform:rotate(45deg)}
.tli.mut:before{background:#7B9B98}
.tli .th{font-size:14px;font-weight:700}
.tli .tm{font-size:12px;color:var(--sub);margin-top:2px}
.steps{display:flex;gap:0;min-width:0;overflow-x:auto;padding:2px}
.step{flex:1;text-align:center;position:relative;padding:0 4px;min-width:72px}
.step .dot{
  width:28px;
  height:28px;
  border-radius:3px;
  background:#718A88;
  color:#FFFFFF;
  display:grid;
  place-items:center;
  margin:0 auto 7px;
  font-size:13px;
  font-weight:800;
}
.step.done .dot{background:var(--good)}
.step.cur .dot{background:var(--accent);box-shadow:0 0 0 3px #BDF1E9}
.step .sl{font-size:11px;font-weight:700}
.step:after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#A9BFBC;z-index:0}
.step:last-child:after{display:none}
.step.done:after{background:var(--good)}
.step .dot,.step .sl{position:relative;z-index:1}
.pill{
  font-size:11px;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  background:#E0F6F2;
  color:#0F625B;
  border:1px solid #76D8CB;
}
.qbar{
  display:flex;
  align-items:center;
  gap:10px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:4px;
  padding:11px 13px;
  min-width:0;
  box-shadow:var(--shadow);
}
.qbar .ms{color:var(--accent);font-size:20px;flex:0 0 auto}
.qbar .qt{font-size:14px;font-weight:600;min-width:0}
.ai{
  background:#E7F8F4;
  border:1px solid #76D8CB;
  border-left:4px solid var(--color-accent);
  border-radius:4px;
  padding:13px 14px;
  min-width:0;
}
.ai .ah{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:11px;
  letter-spacing:.04em;
  font-weight:600;
  color:#0F625B;
  margin-bottom:6px;
}
.ai .ah .ms{color:var(--color-accent)}
.ai p{font-size:14px;color:var(--ink)}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);min-width:0}
.gauge{flex:1;height:9px;background:#D1E4E1;border:1px solid #BAD6D2;border-radius:0;overflow:hidden;min-width:40px}
.gauge>i{display:block;height:100%;border-radius:0}
.dl{display:flex;flex-wrap:wrap;gap:9px 24px;margin-top:6px}
.dl>div{min-width:0}
.dl dt{font-size:11px;color:var(--sub);font-weight:600}
.dl dd{font-size:14px;font-weight:700;margin-top:1px}
.opt{border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0;background:#FFFFFF}
.opt:hover{border-color:var(--accent2);box-shadow:3px 3px 0 #C7F3EC}
.opt.sel{border:2px solid var(--accent);background:#ECFBF8;box-shadow:4px 4px 0 #99E7DC}
.opt h4{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}
.btnp,.btno{
  min-height:40px;
  border-radius:3px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btnp{background:var(--color-accent);color:#1F1300;border:1px solid #A85C05;box-shadow:3px 3px 0 #7C4304}
.btnp:hover{background:#F59E0B;transform:translateY(-1px);box-shadow:4px 5px 0 #7C4304}
.btno{background:#FFFFFF;color:#0F625B;border:1px solid #5DBFB3}
.btno:hover{background:#E7F8F4;border-color:var(--accent);transform:translateY(-1px)}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important;fill:#315F5B!important;color:#315F5B!important}
.apexcharts-gridline{stroke:#C7E8E3!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.apexcharts-tooltip-title{background:#E7F8F4!important;border-bottom:1px solid var(--line)!important}
.apexcharts-series[seriesName]:nth-of-type(1) path{stroke:#0D9488!important}

@media (prefers-reduced-motion:no-preference){
  .card,.pane,.qbar{animation:swiss-in .4s cubic-bezier(.2,.8,.25,1) both}
  .grid>.card:nth-child(2){animation-delay:.06s}
  .grid>.card:nth-child(3){animation-delay:.12s}
  .grid>.card:nth-child(4){animation-delay:.18s}
  .lst>.row{animation:swiss-in .36s cubic-bezier(.2,.8,.25,1) both}
  .lst>.row:nth-child(2){animation-delay:.05s}
  .lst>.row:nth-child(3){animation-delay:.1s}
  .lst>.row:nth-child(4){animation-delay:.15s}
  .lst>.row:nth-child(5){animation-delay:.2s}
  @keyframes swiss-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media(max-width:1024px){
  .side{width:220px;flex-basis:220px}
  .wrap{padding:18px}
  .split{grid-template-columns:300px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;padding:11px 12px}
  .brand{padding:2px 5px 10px;border-bottom:0}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:2px;gap:6px}
  .nav button{width:auto;flex:1 1 140px;min-height:44px}
  .nav button small{display:none}
  .nav button:hover{transform:none}
  .side .foot{display:none}
  .top{top:0;padding:11px 16px;min-height:64px}
  .split{grid-template-columns:1fr}
}
@media(max-width:768px){
  .cards2,.cards3{grid-template-columns:1fr}
  .wrap{padding:14px}
  .pane.pad{padding:14px}
}
@media(max-width:560px){
  .brand h1{font-size:16px}
  .nav button .nt{display:none}
  .nav button{flex:1 1 44px;justify-content:center;padding:9px;min-height:44px}
  .nav button.on{box-shadow:2px 2px 0 #2DD4BF}
  .top{align-items:flex-start;gap:7px}
  .top .tt{width:100%}
  .top .tt h2{font-size:21px}
  .top .sp{display:none}
  .chip{font-size:11px;padding:4px 8px}
  .wrap{padding:10px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px}
  .kpi .kv{font-size:22px}
  .kpi .kl{font-size:11px}
  .split{gap:10px}
  .qbar{align-items:flex-start;flex-wrap:wrap}
  .qbar .btnp{width:100%;margin-left:0!important}
  .dl{gap:8px 16px}
  .steps{padding-bottom:6px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}
  .top .tt p{font-size:12px}
  .chip{flex:1;justify-content:center}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="ms">insights</span></div>
      <div>
        <h1>AI經營決策助手</h1>
        <p>Executive Decision Copilot</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">總經理室 · 經營企劃部 · 財務部<br/>資料即時同步 BI／ERP／財務系統</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="tt">
        <h2><span class="ms" id="scIcon">dashboard</span><span id="scName">經營決策台</span></h2>
        <p id="scDesc">自然語言問答與經營全景總覽</p>

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  var m=MODS[i];
  document.getElementById("scIcon").textContent=m.icon;
  document.getElementById("scName").textContent=m.name;
  document.getElementById("scDesc").textContent=m.desc;
  var v=document.getElementById("view");
  v.innerHTML="";
  void v.offsetHeight;
  SCREENS[i]();
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="ms">'+m.icon+'</span><span class="nt"><span>'+m.name+'</span><small>'+m.desc+'</small></span></button>';}).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){(function(b){b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i");});})(btns[i]);}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
