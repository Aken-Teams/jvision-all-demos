<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供應商品質管理 SQM ｜ 品質戰情控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#0a1a18; --panel:#0f2b28; --panel2:#123531; --line:#1d4d47;
    --teal:#0f766e; --teal2:#5eead4; --ink:#e8fbf7; --sub:#8fc9c1; --mut:#5f9a92;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --amber:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden}
  body{font-family:'Inter','Noto Sans TC',sans-serif;background:
    radial-gradient(1200px 600px at 100% -10%,#0f3a35 0%,transparent 55%),
    radial-gradient(900px 500px at -10% 10%,#123531 0%,transparent 50%),
    var(--bg);color:var(--ink);min-height:100vh}
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;
    line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
    direction:ltr;vertical-align:middle;font-size:20px}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(9,24,22,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--teal2));color:#062b26}
  .brand b{font-family:'Noto Sans TC';font-weight:900;font-size:16px;letter-spacing:.5px}
  .brand span{display:block;font-size:11px;color:var(--sub);font-weight:500}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
  nav.tabs{max-width:1360px;margin:0 auto;padding:0 12px 10px;display:flex;gap:8px;flex-wrap:wrap}
  .tab{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--sub);font-size:13px;font-weight:600;
    font-family:'Noto Sans TC';white-space:nowrap;transition:.15s}
  .tab:hover{color:var(--ink);border-color:var(--teal)}
  .tab.on{background:linear-gradient(135deg,var(--teal),#0d6157);color:#eafffb;border-color:var(--teal2);
    box-shadow:0 6px 18px -8px rgba(94,234,212,.5)}
  .tab .material-symbols-outlined{font-size:19px}

  main{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
  .screen-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .screen-head h1{font-family:'Noto Sans TC';font-weight:900;font-size:22px}
  .screen-head p{color:var(--sub);font-size:13px;margin-top:3px}
  .chip{margin-left:auto;font-size:12px;color:var(--teal2);background:rgba(94,234,212,.1);
    border:1px solid rgba(94,234,212,.3);border-radius:20px;padding:5px 12px;white-space:nowrap}

  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g23{grid-template-columns:2fr 1fr}
  .g32{grid-template-columns:1fr 2fr}

  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:14px;padding:16px;min-width:0}
  .card h3{font-family:'Noto Sans TC';font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card h3 .material-symbols-outlined{font-size:19px;color:var(--teal2)}
  .card .sub{font-size:12px;color:var(--mut);font-weight:400;margin-left:auto}

  .kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,rgba(94,234,212,.14),transparent 70%)}
  .kpi .lbl{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
  .kpi .val small{font-size:14px;color:var(--sub);font-weight:600;margin-left:3px}
  .kpi .delta{font-size:12px;margin-top:5px;display:flex;align-items:center;gap:4px}
  .up{color:var(--ok)} .down{color:var(--bad)} .warnc{color:var(--warn)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
    border-bottom:1px solid var(--line)}
  td{border-bottom:1px solid rgba(29,77,71,.5);color:var(--ink)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(94,234,212,.05)}
  .mono{font-variant-numeric:tabular-nums;font-family:'Inter'}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .b-ok{background:rgba(52,211,153,.14);color:var(--ok)}
  .b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
  .b-bad{background:rgba(248,113,113,.14);color:var(--bad)}
  .b-info{background:rgba(94,234,212,.12);color:var(--teal2)}
  .b-mut{background:rgba(143,201,193,.12);color:var(--sub)}

  .bar{height:7px;border-radius:20px;background:rgba(29,77,71,.6);overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--teal),var(--teal2))}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .col{background:rgba(9,24,22,.5);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
  .col h4{font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .col h4 span{background:var(--panel);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--teal2)}
  .tk{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-left:3px solid var(--teal2);border-radius:9px;padding:10px;margin-bottom:9px}
  .tk .id{font-size:11px;color:var(--mut);font-family:'Inter'}
  .tk .t{font-size:12.5px;font-weight:600;margin:4px 0 7px;font-family:'Noto Sans TC';line-height:1.4}
  .tk .m{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--sub)}
  .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));
    color:#062b26;display:inline-grid;place-items:center;font-size:10px;font-weight:800}

  .tl{position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl .it{position:relative;padding-bottom:16px}
  .tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;
    background:var(--teal2);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(94,234,212,.15)}
  .tl .it .h{font-size:12.5px;font-weight:700;font-family:'Noto Sans TC'}
  .tl .it .d{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
  .tl .it .ts{font-size:11px;color:var(--mut);font-family:'Inter'}

  .chartbox{overflow:hidden;min-width:0}
  .gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px}

  .legrow{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:12px;color:var(--sub)}
  .legrow i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

  .doc-row{display:flex;align-items:center;gap:10px}
  .doc-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:rgba(94,234,212,.1);color:var(--teal2)}
  .doc-ic .material-symbols-outlined{font-size:19px}

  .sub-rank{display:flex;align-items:center;gap:10px}
  .rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;
    background:rgba(29,77,71,.6);color:var(--sub)}
  .rk.g1{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3a2600}
  .rk.g2{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#1e293b}
  .rk.g3{background:linear-gradient(135deg,#b45309,#d97706);color:#2b1200}
  .grade{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:15px;font-family:'Inter'}
  .grade.A{background:rgba(52,211,153,.16);color:var(--ok)}
  .grade.B{background:rgba(94,234,212,.14);color:var(--teal2)}
  .grade.C{background:rgba(251,191,36,.16);color:var(--warn)}
  .grade.D{background:rgba(248,113,113,.16);color:var(--bad)}

  .ppm{font-family:'Inter';font-variant-numeric:tabular-nums;font-size:12px}
  .alert-strip{display:flex;align-items:center;gap:10px;background:rgba(248,113,113,.08);
    border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:11px 14px;font-size:13px;color:#fecaca;line-height:1.5}
  .alert-strip .material-symbols-outlined{color:var(--bad);flex:none}

  @media(max-width:820px){
    .g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}
    .board{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){
    .board{grid-template-columns:1fr}
    .tab .txt{display:none}
    .tab{padding:9px 12px}
    .brand span{display:none}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">verified</span></div>
        <div><b>供應商品質管理 SQM</b><span>Supplier Quality Management · 品質戰情控制台</span></div>
      </div>
      <div class="live"><span class="dot"></span>即時連線 · 48 家合格供應商</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<script>
"use strict";
var AX="#8fc9c1", GRID="#1d4d47", TEAL="#0f766e", TEAL2="#5eead4";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);if(!el)return;
  var base={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},foreColor:AX,fontFamily:'Inter, Noto Sans TC'},
    grid:{borderColor:GRID,strokeDashArray:3},tooltip:{theme:'dark'}};
  opt.chart=Object.assign(base.chart,opt.chart||{});
  opt.grid=Object.assign(base.grid,opt.grid||{});
  opt.tooltip=Object.assign(base.tooltip,opt.tooltip||{});
  var c=new ApexCharts(el,opt);c.render();charts.push(c);
}

var TABS=[
  {i:0,ic:"monitoring",t:"品質戰情總覽"},
  {i:1,ic:"fact_check",t:"進料檢驗 IQC"},
  {i:2,ic:"rule",t:"SCAR 改善追蹤"},
  {i:3,ic:"description",t:"供應商文件庫"},
  {i:4,ic:"shield",t:"綠色產品資料"},
  {i:5,ic:"verified",t:"評鑑與稽核"}
];

var SUPPLIERS=[
  {code:"SP-1042",nm:"精鴻精密五金",grade:"A",ppm:180,otd:98.6,scar:0},
  {code:"SP-0871",nm:"泰昌電子材料",grade:"B",ppm:640,otd:95.2,scar:2},
  {code:"SP-1310",nm:"宏達橡塑膠",grade:"C",ppm:1520,otd:88.4,scar:4},
  {code:"SP-0559",nm:"聯欣表面處理",grade:"A",ppm:210,otd:97.9,scar:1},
  {code:"SP-1188",nm:"鼎新沖壓",grade:"B",ppm:520,otd:93.7,scar:1},
  {code:"SP-0733",nm:"永盛化工原料",grade:"D",ppm:3080,otd:81.5,scar:6}
];

function head(t,sub,chip){return '<div class="screen-head"><div><h1>'+t+'</h1><p>'+sub+'</p></div><div class="chip">'+chip+'</div></div>';}
function kpi(l,ic,v,u,cls,d){var ti=cls=="down"?"trending_down":cls=="warnc"?"trending_flat":"trending_up";
  return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined" style="font-size:17px;color:var(--teal2)">'+ic+'</span>'+l+'</div><div class="val mono">'+v+'<small>'+u+'</small></div><div class="delta '+cls+'"><span class="material-symbols-outlined" style="font-size:14px">'+ti+'</span>'+d+'</div></div>';}

/* ===== screen 0 ===== */
function s0(){
  var h=head("品質戰情總覽","即時彙整進料合格率、供應商 PPM、SCAR 閉環與稽核到期，主管一眼掌握品質風險。","更新於 08:42 · 本月至今");
  h+='<div class="grid g4" style="margin-bottom:14px">'
    +kpi("進料合格率","monitoring","96.8","%","up","+1.4% vs 上月")
    +kpi("平均供應商 PPM","warning","842","","down","-118 改善中")
    +kpi("SCAR 閉環率","rule","89","%","up","+7% 驗證通過")
    +kpi("待處理異常","priority_high","7","件","warnc","2 件逾期")
    +'</div>';
  h+='<div class="grid g23" style="margin-bottom:14px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">insights</span>近 8 週合格率 vs 不合格批數<span class="sub">週別</span></h3><div class="chartbox" id="c0a"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>不良類別分佈<span class="sub">本月</span></h3><div class="chartbox" id="c0b"></div></div>'
    +'</div>';
  h+='<div class="grid g2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">groups</span>供應商品質風險排行</h3><div style="overflow-x:auto"><table><thead><tr><th>供應商</th><th>分級</th><th class="mono">PPM</th><th class="mono">準交率</th><th>SCAR</th></tr></thead><tbody>'+riskRows()+'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>今日待辦與預警</h3>'+alertList()+'</div>'
    +'</div>';
  return h;
}
function riskRows(){var r="";for(var i=0;i<SUPPLIERS.length;i++){var s=SUPPLIERS[i];
  r+='<tr><td>'+s.code+' · '+s.nm+'</td><td><span class="grade '+s.grade+'">'+s.grade+'</span></td><td class="mono">'+s.ppm+'</td><td class="mono">'+s.otd+'%</td><td>'+(s.scar>0?'<span class="badge b-warn">'+s.scar+' 件</span>':'<span class="badge b-ok">0</span>')+'</td></tr>';}
  return r;}
function alertList(){
  var a=[
    ["b-bad","block","SP-0733 永盛化工 苯乙烯 PPM 3080 超標，已凍結收料","逾期 1 天"],
    ["b-warn","schedule","SP-1310 宏達橡塑膠 SCAR-2409 對策待驗證","今日到期"],
    ["b-warn","description","SP-0871 泰昌電子 ISO 9001 證書 14 天內到期",""],
    ["b-info","fact_check","批 IQC-24-0913 待品質經理放行覆核",""],
    ["b-info","event","SP-1188 鼎新沖壓 現場稽核排定 08/22",""]
  ];
  var h='';for(var i=0;i<a.length;i++){h+='<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(29,77,71,.5)"><span class="material-symbols-outlined" style="font-size:19px;color:var(--teal2)">'+a[i][1]+'</span><span style="font-size:12.5px;flex:1;line-height:1.4">'+a[i][2]+'</span>'+(a[i][3]?'<span class="badge '+a[i][0]+'">'+a[i][3]+'</span>':'')+'</div>';}
  return h;
}
function c0(){
  mk("c0a",{chart:{type:"line",height:280},series:[
    {name:"進料合格率 %",type:"line",data:[93.1,94.0,93.6,95.2,95.8,96.1,96.4,96.8]},
    {name:"不合格批數",type:"column",data:[9,7,8,6,5,5,4,3]}
  ],stroke:{width:[3,0],curve:"smooth"},colors:[TEAL2,"#f59e0b"],
    plotOptions:{bar:{columnWidth:"40%",borderRadius:3}},
    xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8"]},
    yaxis:[{min:88,max:100,labels:{formatter:function(v){return v.toFixed(0)+"%";}}},{opposite:true,labels:{formatter:function(v){return v.toFixed(0);}}}],
    legend:{labels:{colors:AX}},dataLabels:{enabled:false}});
  mk("c0b",{chart:{type:"donut",height:280},series:[38,22,18,12,10],
    labels:["尺寸超差","外觀刮傷","材質不符","混料","包裝不良"],
    colors:[TEAL,"#0ea5a0",TEAL2,"#f59e0b","#f87171"],
    legend:{position:"bottom",labels:{colors:AX}},dataLabels:{enabled:true,style:{fontSize:"11px"},dropShadow:{enabled:false}},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"不良件",color:AX,formatter:function(){return "100";}}}}}}});
}

/* ===== screen 1 ===== */
var IQC=[
  {b:"IQC-24-0913",s:"SP-1042 精鴻精密",p:"CNC 支架 M6",qty:2000,aql:"II / 1.0",insp:"陳彥廷",st:"pass"},
  {b:"IQC-24-0914",s:"SP-0871 泰昌電子",p:"連接器 12P",qty:5000,aql:"II / 0.65",insp:"林采潔",st:"hold"},
  {b:"IQC-24-0915",s:"SP-1310 宏達橡塑膠",p:"O-Ring NBR-70",qty:12000,aql:"II / 1.5",insp:"陳彥廷",st:"reject"},
  {b:"IQC-24-0916",s:"SP-0559 聯欣表面",p:"陽極處理外殼",qty:800,aql:"S-4 / 1.0",insp:"黃鈺婷",st:"pass"},
  {b:"IQC-24-0917",s:"SP-1188 鼎新沖壓",p:"沖壓端子",qty:30000,aql:"II / 0.65",insp:"林采潔",st:"insp"}
];
function s1(){
  var h=head("進料檢驗 IQC","收料建批、依 AQL 抽樣執行尺寸與外觀量測，合格放行、超差隔離。","抽樣標準 ANSI/ASQ Z1.4");
  h+='<div class="grid g4" style="margin-bottom:14px">'
    +kpi("今日收料批","inventory_2","18","批","up","+3 待檢")
    +kpi("待檢驗","hourglass_top","5","批","warnc","1 批加急")
    +kpi("合格放行","task_alt","11","批","up","91% 一次合格")
    +kpi("隔離扣留","block","2","批","down","已貼標凍結")
    +'</div>';
  h+='<div class="grid g23" style="margin-bottom:14px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>進料檢驗批清單</h3><div style="overflow-x:auto"><table><thead><tr><th>檢驗批號</th><th>供應商 / 料號</th><th class="mono">數量</th><th>抽樣</th><th>檢驗員</th><th>狀態</th></tr></thead><tbody>'+iqcRows()+'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">straighten</span>製程能力 Cpk<span class="sub">M6 支架</span></h3><div class="chartbox gauge" id="c1a"></div><div style="text-align:center;font-size:12px;color:var(--sub);margin-top:-6px">孔徑 Ø6.00 · Cpk = 1.62 · 良好</div></div>'

/* ---------- router ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[c0,c1,c2,c3,c4,c5];
function show(i){
  destroyCharts();
  var tabs=document.querySelectorAll(".tab");
  for(var k=0;k<tabs.length;k++){tabs[k].className="tab"+(+tabs[k].getAttribute("data-i")===i?" on":"");}
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  void app.offsetHeight;
  INIT[i]();
}
(function(){
  var tb=document.getElementById("tabs"),h="";
  for(var i=0;i<TABS.length;i++){h+='<button class="tab" data-i="'+TABS[i].i+'"><span class="material-symbols-outlined">'+TABS[i].ic+'</span><span class="txt">'+TABS[i].t+'</span></button>';}
  tb.innerHTML=h;
  var btns=tb.querySelectorAll(".tab");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){var idx=+this.getAttribute("data-i");show(idx);location.hash="v"+idx;});}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
