<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品不良原因分析</title>
<meta name="description" content="從異常到改善的品質閉環與追溯稽核">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A34309;
  --bad:#B91C1C;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  color:var(--color-foreground);
  background:
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,.tk{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.35);
  outline-offset:3px
}
.ico{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  padding:14px clamp(16px,3vw,36px) 0;
  background:rgba(248,250,252,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(12px)
}
.brand{
  max-width:1380px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:13px
}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
  box-shadow:4px 4px 0 #BFDBFE
}
.logo .ico{font-size:24px}
.brand h1{
  margin:0;
  color:var(--ink);
  font-size:17px;
  font-weight:700;
  letter-spacing:-.01em
}
.brand .sub{color:var(--muted);font-size:11.5px}
.live{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 11px;
  color:#166534;
  background:#F0FDF4;
  border:1px solid #BBF7D0;
  border-radius:6px;
  font-size:11.5px;
  font-weight:600;
  white-space:nowrap
}
.dot{
  width:8px;
  height:8px;
  background:#16A34A;
  border:2px solid #DCFCE7;
  border-radius:50%;
  box-shadow:0 0 0 1px #16A34A
}
.tabs{
  max-width:1380px;
  margin:13px auto 0;
  display:flex;
  gap:2px;
  overflow-x:auto;
  scrollbar-width:thin
}
.tabs button{
  position:relative;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:9px 14px 11px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-bottom:3px solid transparent;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease
}
.tabs button:hover{color:var(--blue);background:#EFF6FF}
.tabs button.active{
  color:var(--blue);
  background:#EFF6FF;
  border-bottom-color:var(--blue)
}
.tabs .idx{
  color:#64748B;
  font:600 10px "Fira Code",monospace
}
.tabs button.active .idx{color:var(--blue)}
main{
  width:min(1380px,100%);
  margin:auto;
  padding:32px clamp(16px,3vw,36px) 64px
}
.screen-head{
  position:relative;
  margin-bottom:22px;
  padding-left:18px;
  animation:reveal .36s ease-out both
}
.screen-head:before{
  content:"";
  position:absolute;
  left:0;
  top:4px;
  bottom:4px;
  width:4px;
  background:var(--blue)
}
.eyebrow{
  margin-bottom:4px;
  color:var(--blue);
  font:600 11px "Fira Code",monospace;
  letter-spacing:.08em
}
.screen-head h2{
  margin:0 0 4px;
  color:var(--ink);
  font-size:clamp(24px,3vw,34px);
  line-height:1.2;
  letter-spacing:-.035em
}
.screen-head p{max-width:760px;margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.card{
  min-width:0;
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  animation:reveal .36s ease-out both;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease
}
.card:hover{border-color:#CBD5E1;box-shadow:0 12px 30px rgba(15,23,42,.09)}
.card.pad0{padding:0;overflow:hidden}
.card h3{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:14px;
  font-weight:600
}
.card h3 .ico{color:var(--blue)}
.card h3 small{
  margin-left:auto;
  color:var(--muted);
  font:500 10.5px "Fira Code",monospace
}
.kpi{position:relative;overflow:hidden}
.kpi:after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:4px;
  background:var(--blue)
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12.5px
}
.kpi .lab .ico{color:var(--blue)}
.kpi .val{
  margin-top:8px;
  color:var(--ink);
  font:700 29px "Fira Code",monospace;
  letter-spacing:-.04em
}
.kpi .val small{
  margin-left:4px;
  color:var(--muted);
  font:500 12px "Fira Sans",sans-serif
}
.delta{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  font-weight:600
}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--warn)}
.bar,.prog{
  overflow:hidden;
  background:var(--color-muted);
  border-radius:2px
}
.bar{height:5px;margin-top:13px}
.bar i,.prog i{
  display:block;
  height:100%;
  background:var(--blue)
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid;
  border-radius:4px;
  font-size:11px;
  font-weight:600;
  line-height:1.3;
  white-space:nowrap
}
.c-hi{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.c-md{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.c-lo{color:#1D4ED8;background:#EFF6FF;border-color:#BFDBFE}
.c-ok{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.c-gy{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.tbl-wrap,.chart-scroll{overflow-x:auto}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:12.5px
}
th,td{
  padding:11px 13px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid var(--line)
}
th{
  color:#334155;
  background:#F1F5F9;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono,.id,.tm{
  color:#1D4ED8;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
.prog{
  width:100px;
  height:6px;
  display:inline-block;
  vertical-align:middle
}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:220px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{
  min-width:0;
  padding:11px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:7px
}
.col-h{
  margin-bottom:10px;
  padding-bottom:9px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#334155;
  border-bottom:1px solid var(--line);
  font-size:12.5px;
  font-weight:700
}
.col-h .n{
  margin-left:auto;
  padding:1px 7px;
  color:#334155;
  background:#E2E8F0;
  border-radius:3px;
  font:600 10px "Fira Code",monospace
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:5px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.tk:hover{transform:translateY(-2px);border-color:#93C5FD;box-shadow:0 7px 16px rgba(37,99,235,.09)}
.tk:last-child{margin-bottom:0}
.tk .id{font-size:10.5px;font-weight:600}
.tk .t{margin:4px 0 7px;color:var(--ink);font-size:12.5px;font-weight:600;white-space:normal}
.tk .m{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:10.5px}
.gtt{min-width:720px}
.gtt .row{
  margin-bottom:9px;
  display:grid;
  grid-template-columns:155px 1fr;
  gap:10px;
  align-items:center
}
.gtt .lab{color:var(--muted);font-size:11px;white-space:nowrap}
.gtt .lab b{display:block;color:var(--ink);font-size:12px}
.track{
  position:relative;
  height:29px;
  overflow:hidden;
  background:#F1F5F9;
  border:1px solid var(--line);
  border-radius:4px
}
.track i{
  position:absolute;
  top:3px;
  bottom:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:3px;
  color:#fff;
  font:600 9.5px "Fira Code",monospace;
  white-space:nowrap
}
.bx{background:var(--blue)}
.bx-w{background:#C2410C}
.bx-d{background:#475569}
.gtt-ax{
  margin-bottom:6px;
  display:grid;
  grid-template-columns:155px 1fr;
  gap:10px
}
.gtt-ax .scl{
  display:flex;
  justify-content:space-between;
  color:#64748B;
  font:500 9.5px "Fira Code",monospace
}
.dcard{
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease
}
.dcard:hover{transform:translateY(-3px);box-shadow:0 13px 25px rgba(15,23,42,.1)}
.dcard .img{
  position:relative;
  height:120px;
  display:grid;
  place-items:center;
  overflow:hidden
}
.dcard .img .ico{
  z-index:1;
  color:#fff;
  font-size:52px;
  filter:drop-shadow(0 2px 5px rgba(15,23,42,.25))
}
.scan{
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 7px)
}
.dcard .cap{padding:12px}
.dcard .cap .h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  color:var(--ink);
  font-size:12px;
  font-weight:700
}
.dcard .cap .d{margin-top:5px;color:var(--muted);font-size:11px}
.tree{font-size:12px}
.tnode{
  margin-bottom:8px;
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:9px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-left:4px solid var(--blue);
  border-radius:5px
}
.tnode .pct{
  margin-left:auto;
  font:700 12px "Fira Code",monospace
}
.tnode.lv2{margin-left:22px;background:#fff}
.tnode.lv3{margin-left:44px;background:#fff}
.tnode .txt b{font-weight:600}
.tnode .txt span{display:block;color:var(--muted);font-size:10.5px}
.tl{position:relative;padding-left:27px}
.tl:before{
  content:"";
  position:absolute;
  left:8px;
  top:4px;
  bottom:4px;
  width:2px;
  background:var(--line)
}
.tl-item{position:relative;margin-bottom:17px}
.tl-item:last-child{margin-bottom:0}
.pt{
  position:absolute;
  left:-25px;
  top:2px;
  width:16px;
  height:16px;
  background:#fff;
  border:3px solid #64748B;
  border-radius:50%
}
.tl-item.done .pt{background:var(--ok);border-color:var(--ok)}
.tl-item.now .pt{background:#fff;border-color:var(--warn);box-shadow:0 0 0 4px #FFEDD5}
.tl-item .th{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
.tl-item .tm{margin-top:2px;color:#64748B;font-size:10px}
.tl-item .td{margin-top:3px;color:var(--muted);font-size:11.5px}
.lrow{
  min-height:40px;
  padding:9px 0;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
  font-size:12px
}
.lrow:last-child{border-bottom:0}
.lrow .k{color:var(--muted)}
.lrow .v{
  margin-left:auto;
  color:var(--ink);
  font:600 11.5px "Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{
  padding:13px;
  text-align:center;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:5px
}
.mini .v{color:var(--blue);font:700 22px "Fira Code",monospace}
.mini .l{margin-top:3px;color:var(--muted);font-size:10.5px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,220px)}
}
@media(max-width:580px){
  .topbar{padding-inline:12px}
  .brand h1{font-size:14px}
  .brand .sub{display:none}
  .live{padding:6px 8px;font-size:10px}
  .tabs button{padding-inline:12px}
  .tabs .lbl{display:none}
  main{padding:23px 12px 48px}
  .g4,.stat-grid{grid-template-columns:1fr}
  .card{padding:15px}
  .screen-head h2{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
  .card,.screen-head{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="ico">fact_check</span></div>
    <div>
      <h1>產品不良原因分析</h1>
      <div class="sub">Failure Analysis Lab · 送測 → 分析 → 判定 → 報告</div>
    </div>
    <div class="live"><span class="dot" aria-hidden="true"></span>系統正常 · 即時看板</div>
  </div>
  <nav class="tabs" id="nav" aria-label="分析流程"></nav>
</header>
<main id="app"></main>
<script>
(function(){
"use strict";
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function el(id){return document.getElementById(id)}
Chart.defaults.color="#475569";
Chart.defaults.font.family="'Fira Sans',sans-serif";
Chart.defaults.borderColor="#E2E8F0";
var MODS=[
{ico:"assignment_add",name:"送測登錄"},
{ico:"biotech",name:"初步檢查"},
{ico:"calendar_month",name:"分析排程"},
{ico:"grain",name:"儀器分析"},
{ico:"account_tree",name:"失效機制判定"},
{ico:"description",name:"報告產出"}
];
function head(eb,t,p){return'<div class="screen-head"><div class="eyebrow">'+eb+'</div><h2>'+t+'</h2><p>'+p+'</p></div>'}
function chip(cls,txt){return'<span class="chip '+cls+'">'+txt+'</span>'}
function pri(p){if(p==="高")return chip("c-hi","高風險");if(p==="中")return chip("c-md","中風險");return chip("c-lo","低風險")}
function trend(dc){return dc==="up"?"trending_up":dc==="down"?"trending_down":"trending_flat"}
function kpiCard(k){return'<div class="card kpi"><div class="lab"><span class="ico">'+k.ico+'</span>'+k.lab+'</div><div class="val">'+k.val+'<small>'+k.u+'</small></div><div class="delta '+k.dc+'"><span class="ico" style="font-size:15px">'+trend(k.dc)+'</span>'+k.d+'</div><div class="bar"><i style="width:'+k.p+'%"></i></div></div>'}
function s0(){
var kpis=[
{ico:"inbox",lab:"本月送測案件",val:"186",u:"件",d:"+12 vs 上月",dc:"up",p:78},
{ico:"pending_actions",lab:"待收件登錄",val:"9",u:"件",d:"平均候收 1.4h",dc:"flat",p:35},
{ico:"priority_high",lab:"高優先客訴案",val:"5",u:"件",d:"含已出貨批號",dc:"down",p:62},
{ico:"schedule",lab:"平均登錄時間",val:"6.2",u:"分",d:"-2.1 分改善",dc:"up",p:44}
],kh="",i;
for(i=0;i<kpis.length;i++)kh+=kpiCard(kpis[i]);
var cols=[
{t:"待收件",ic:"markunread_mailbox",items:[
{id:"FA-2608-0193",tt:"IC 封裝爆米花 · 客訴退回",src:"客訴 · 已出貨",p:"高",who:"林承翰"},
{id:"FA-2608-0192",tt:"PCB 銅箔剝離 · 產線攔截",src:"產線 · 攔截",p:"中",who:"陳品妍"},
{id:"FA-2608-0191",tt:"連接器接觸不良",src:"客訴",p:"中",who:"待指派"}]},
{t:"樣品清點",ic:"inventory_2",items:[
{id:"FA-2608-0189",tt:"MLCC 龜裂 · 批號 K2418",src:"品保 · 隔離",p:"高",who:"黃偉倫"},
{id:"FA-2608-0188",tt:"LED 光衰異常",src:"可靠度",p:"低",who:"吳芷妍"}]},
{t:"資料建檔",ic:"assignment",items:[
{id:"FA-2608-0185",tt:"焊點空洞 · X-ray 待排",src:"產線",p:"中",who:"林承翰"},
{id:"FA-2608-0184",tt:"晶片裂紋 · SEM 待排",src:"研發",p:"高",who:"黃偉倫"}]},
{t:"登錄完成",ic:"task_alt",items:[
{id:"FA-2608-0182",tt:"氧化變色 · 切片待排",src:"客訴",p:"低",who:"陳品妍"},
{id:"FA-2608-0181",tt:"銲錫橋接 · 已排程",src:"產線",p:"中",who:"吳芷妍"},
{id:"FA-2608-0180",tt:"電性開路 · 已排程",src:"研發",p:"高",who:"林承翰"}]}],bh="";
for(var c=0;c<cols.length;c++){
  var col=cols[c],it="";
  for(var j=0;j<col.items.length;j++){
    var t=col.items[j];
