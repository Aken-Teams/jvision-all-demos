<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FA 不良分析實驗室平台</title>
<meta name="description" content="從異常到改善的品質閉環與追溯稽核" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#0369a1; --accent2:#38bdf8;
    --bg:#0b1220; --panel:#111c2e;
    --line:#243449; --txt:#e6eefb; --mut:#93a7c4; --dim:#64789a;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#12325233,transparent),var(--bg);
    color:var(--txt); line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .ico{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  header.topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(90deg,#0a1524,#0e1e33);
    border-bottom:1px solid var(--line); padding:10px 16px;
  }
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .logo{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#04121f;
    box-shadow:0 6px 18px #0369a144;
  }
  .logo .ico{font-size:24px;}
  .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;}
  .brand .sub{font-size:11.5px;color:var(--mut);font-weight:500;}
  .brand .live{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    font-size:11.5px;color:var(--accent2);background:#0d2438;border:1px solid #1c3b56;
    padding:6px 11px;border-radius:999px;flex:none;white-space:nowrap;min-width:0;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px #38bdf833;flex:none;}
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  nav.tabs button{
    flex:none;white-space:nowrap;min-width:0;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    background:#0f1d30;border:1px solid var(--line);color:var(--mut);
    padding:9px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;
    transition:.15s;
  }
  nav.tabs button .ico{font-size:19px;}
  nav.tabs button .idx{font-size:11px;color:var(--dim);font-weight:700;}
  nav.tabs button:hover{border-color:#2f4a68;color:var(--txt);}
  nav.tabs button.active{
    background:linear-gradient(135deg,var(--accent),#0284c7);
    border-color:var(--accent2);color:#fff;box-shadow:0 6px 16px #0369a155;
  }
  nav.tabs button.active .idx{color:#bfe6ff;}
  main{padding:20px 16px 60px;max-width:1360px;margin:0 auto;}
  .screen-head{margin-bottom:18px;}
  .screen-head .eyebrow{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .screen-head h2{margin:4px 0 3px;font-size:22px;font-weight:800;}
  .screen-head p{margin:0;color:var(--mut);font-size:13.5px;}
  .grid{display:grid;gap:14px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g23{grid-template-columns:2fr 1fr;}
  .g32{grid-template-columns:1fr 2fr;}
  @media(max-width:820px){ .g4,.g2,.g23,.g32{grid-template-columns:1fr;} }
  .card{
    background:linear-gradient(180deg,var(--panel),#0f1a2b);
    border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;
  }
  .card.pad0{padding:0;overflow:hidden;}
  .card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card h3 .ico{font-size:19px;color:var(--accent2);}
  .card h3 small{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600;}
  .kpi .lab{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px;}
  .kpi .lab .ico{font-size:18px;color:var(--accent2);}
  .kpi .val{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:.5px;}
  .kpi .val small{font-size:13px;color:var(--dim);font-weight:600;margin-left:3px;}
  .kpi .delta{font-size:12px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--warn);}
  .kpi .bar{height:5px;background:#1b2c44;border-radius:5px;margin-top:12px;overflow:hidden;}
  .kpi .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .c-hi{background:#3a1620;color:#fca5b4;border:1px solid #59202e;}
  .c-md{background:#3a2c12;color:#fcd68b;border:1px solid #5a4318;}
  .c-lo{background:#0f2b3f;color:#8fd3f4;border:1px solid #1c4a66;}
  .c-ok{background:#0f2f1f;color:#86efac;border:1px solid #1c4d33;}
  .c-gy{background:#1b2740;color:#9db3d4;border:1px solid #2b3c58;}
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--dim);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:#0d1727;}
  tbody tr:hover{background:#13233a;}
  td .mono{font-family:"Inter",monospace;color:var(--accent2);font-weight:600;}
  .prog{width:100px;height:6px;background:#1b2c44;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .chart-box{position:relative;height:280px;}
  .chart-box.sm{height:220px;}
  .chart-scroll{overflow-x:auto;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:820px){.board{grid-template-columns:1fr;}}
  .col{background:#0e1a2b;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
  .col-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .col-h .n{margin-left:auto;background:#1b2c44;color:var(--mut);border-radius:999px;padding:1px 8px;font-size:11px;}
  .tk{background:linear-gradient(180deg,#132338,#101d30);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent2);}
  .tk:last-child{margin-bottom:0;}
  .tk .id{font-size:11px;color:var(--accent2);font-weight:700;font-family:monospace;}
  .tk .t{font-size:13px;font-weight:600;margin:3px 0 6px;white-space:normal;}
  .tk .m{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:6px;}
  .gtt{min-width:720px;}
  .gtt .row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:9px;}
  .gtt .lab{font-size:12px;color:var(--mut);white-space:nowrap;}
  .gtt .lab b{color:var(--txt);display:block;font-size:12.5px;}
  .track{position:relative;height:26px;background:#0e1a2b;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .track i{position:absolute;top:3px;bottom:3px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#04121f;overflow:hidden;white-space:nowrap;}
  .bx{background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .bx-w{background:linear-gradient(90deg,#b45309,var(--warn));}
  .bx-d{background:linear-gradient(90deg,#334155,#64789a);color:#e6eefb;}
  .gtt-ax{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:6px;}
  .gtt-ax .scl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);}
  .dcard{background:#0e1a2b;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .dcard .img{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .dcard .img .ico{font-size:54px;opacity:.85;color:#04121f;}
  .dcard .cap{padding:11px;}
  .dcard .cap .h{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center;}
  .dcard .cap .d{font-size:11.5px;color:var(--mut);margin-top:5px;}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff0d 0 1px,transparent 1px 6px);}
  .tree{font-size:12.5px;}
  .tnode{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;background:#0e1a2b;border:1px solid var(--line);margin-bottom:8px;border-left:3px solid var(--accent2);}
  .tnode .ico{font-size:18px;}
  .tnode .pct{margin-left:auto;font-weight:800;font-family:monospace;}
  .tnode.lv2{margin-left:22px;background:#0d1626;}
  .tnode.lv3{margin-left:44px;background:#0b1420;}
  .tnode .txt b{font-weight:700;}.tnode .txt span{color:var(--mut);font-size:11px;display:block;}
  .tl{position:relative;padding-left:26px;}
  .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl-item{position:relative;margin-bottom:16px;}
  .tl-item:last-child{margin-bottom:0;}
  .tl-item .pt{position:absolute;left:-24px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--panel);border:3px solid var(--accent2);}
  .tl-item.done .pt{background:var(--ok);border-color:var(--ok);}
  .tl-item.now .pt{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 4px #f59e0b33;}
  .tl-item .th{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .tl-item .tm{font-size:11px;color:var(--dim);font-family:monospace;}
  .tl-item .td{font-size:12px;color:var(--mut);margin-top:3px;}
  .lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .lrow:last-child{border-bottom:none;}
  .lrow .k{color:var(--mut);}.lrow .v{margin-left:auto;font-weight:700;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:560px){.stat-grid{grid-template-columns:1fr;}}
  .mini{background:#0e1a2b;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .mini .v{font-size:22px;font-weight:800;}
  .mini .l{font-size:11px;color:var(--mut);margin-top:3px;}
  .foot{margin-top:28px;text-align:center;color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);padding-top:18px;}
  @media(max-width:560px){
    nav.tabs button .lbl{display:none;}
    nav.tabs button{padding:9px 12px;}
    .brand h1{font-size:14px;}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="ico">biotech</span></div>
    <div>
      <h1>FA 不良分析實驗室平台</h1>
      <div class="sub">Failure Analysis Lab · 送測 → 分析 → 判定 → 報告</div>
    </div>
    <div class="live"><span class="dot"></span> 實驗室即時看板</div>
  </div>
  <nav class="tabs" id="nav"></nav>
</header>
<main id="app"></main>

<script>
(function(){
  "use strict";
  var charts = [];
  function killCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
  function el(id){ return document.getElementById(id); }
  Chart.defaults.color = "#93a7c4";
  Chart.defaults.font.family = "Inter, 'Noto Sans TC', sans-serif";
  Chart.defaults.borderColor = "#243449";

  var MODS = [
    {ico:"assignment_add", name:"送測登錄"},
    {ico:"biotech", name:"初步檢查"},
    {ico:"calendar_month", name:"分析排程"},
    {ico:"grain", name:"儀器分析"},
    {ico:"account_tree", name:"失效機制判定"},
    {ico:"description", name:"報告產出"}
  ];

  function head(eb,t,p){ return '<div class="screen-head"><div class="eyebrow">'+eb+'</div><h2>'+t+'</h2><p>'+p+'</p></div>'; }
  function chip(cls,txt){ return '<span class="chip '+cls+'">'+txt+'</span>'; }
  function pri(p){ if(p==="高")return chip("c-hi","● 高"); if(p==="中")return chip("c-md","● 中"); return chip("c-lo","● 低"); }
  function trend(dc){ return dc==="up"?"trending_up":dc==="down"?"trending_down":"trending_flat"; }
  function kpiCard(k){
    return '<div class="card kpi"><div class="lab"><span class="ico">'+k.ico+'</span>'+k.lab+'</div>'+
      '<div class="val">'+k.val+'<small>'+k.u+'</small></div>'+
      '<div class="delta '+k.dc+'"><span class="ico" style="font-size:15px">'+trend(k.dc)+'</span>'+k.d+'</div>'+
      '<div class="bar"><i style="width:'+k.p+'%"></i></div></div>';
  }

  // ============ SCREEN 0 : 送測登錄 ============
  function s0(){
    var kpis=[
      {ico:"inbox",lab:"本月送測案件",val:"186",u:"件",d:"+12 vs 上月",dc:"up",p:78},
      {ico:"pending_actions",lab:"待收件登錄",val:"9",u:"件",d:"平均候收 1.4h",dc:"flat",p:35},
      {ico:"priority_high",lab:"高優先客訴案",val:"5",u:"件",d:"含已出貨批號",dc:"down",p:62},
      {ico:"schedule",lab:"平均登錄時間",val:"6.2",u:"分",d:"-2.1 分改善",dc:"up",p:44}
    ];
    var kh=""; for(var i=0;i<kpis.length;i++){ kh+=kpiCard(kpis[i]); }
    var cols=[
      {t:"待收件",ic:"markunread_mailbox",items:[
        {id:"FA-2608-0193",tt:"IC 封裝爆米花 · 客訴退回",src:"客訴 · 已出貨",p:"高",who:"林承翰"},
        {id:"FA-2608-0192",tt:"PCB 銅箔剝離 · 產線攔截",src:"產線 · 攔截",p:"中",who:"陳品妍"},
        {id:"FA-2608-0191",tt:"連接器接觸不良",src:"客訴",p:"中",who:"待指派"}
      ]},
      {t:"樣品清點",ic:"inventory_2",items:[
        {id:"FA-2608-0189",tt:"MLCC 龜裂 · 批號 K2418",src:"品保 · 隔離",p:"高",who:"黃偉倫"},
        {id:"FA-2608-0188",tt:"LED 光衰異常",src:"可靠度",p:"低",who:"吳芷妍"}
      ]},
      {t:"資料建檔",ic:"assignment",items:[
        {id:"FA-2608-0185",tt:"焊點空洞 · X-ray 待排",src:"產線",p:"中",who:"林承翰"},
        {id:"FA-2608-0184",tt:"晶片裂紋 · SEM 待排",src:"研發",p:"高",who:"黃偉倫"}
      ]},
      {t:"登錄完成",ic:"task_alt",items:[
        {id:"FA-2608-0182",tt:"氧化變色 · 切片待排",src:"客訴",p:"低",who:"陳品妍"},
        {id:"FA-2608-0181",tt:"銲錫橋接 · 已排程",src:"產線",p:"中",who:"吳芷妍"},
        {id:"FA-2608-0180",tt:"電性開路 · 已排程",src:"研發",p:"高",who:"林承翰"}
      ]}
    ];
    var bh="";
    for(var c=0;c<cols.length;c++){ var col=cols[c]; var it="";
      for(var j=0;j<col.items.length;j++){ var t=col.items[j];
        it+='<div class="tk"><div class="id">'+t.id+'</div><div class="t">'+t.tt+'</div>'+
            '<div class="m"><span>'+t.src+'</span>'+pri(t.p)+'</div>'+
            '<div class="m" style="margin-top:6px"><span>負責 '+t.who+'</span></div></div>';
      }
      bh+='<div class="col"><div class="col-h"><span class="ico" style="font-size:17px;color:var(--accent2)">'+col.ic+'</span>'+col.t+'<span class="n">'+col.items.length+'</span></div>'+it+'</div>';
    }
    return head("MODULE 01 · 送測登錄","案件收件登錄看板","不良品送測案件依收件流程分欄流轉，記錄失效現象、來源批號與優先序。")+
      '<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'+
      '<div class="card"><h3><span class="ico">view_kanban</span>收件流轉看板<small>拖曳式作業流</small></h3>'+
      '<div class="chart-scroll"><div class="board" style="min-width:720px">'+bh+'</div></div></div>'+
      '<div class="grid g2" style="margin-top:14px">'+
        '<div class="card"><h3><span class="ico">pie_chart</span>案件來源分布</h3><div class="chart-box sm"><canvas id="c0a"></canvas></div></div>'+
        '<div class="card"><h3><span class="ico">bar_chart</span>近 7 日收件量</h3><div class="chart-box sm"><canvas id="c0b"></canvas></div></div>'+
      '</div>';
  }
  function d0(){
    charts.push(new Chart(el("c0a"),{type:"doughnut",data:{labels:["客訴退回","產線攔截","品保隔離","研發送測"],datasets:[{data:[42,28,18,12],backgroundColor:["#ef4444","#f59e0b","#38bdf8","#0369a1"],borderColor:"#0f1a2b",borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{boxWidth:12,padding:12}}}}}));
    charts.push(new Chart(el("c0b"),{type:"bar",data:{labels:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"],datasets:[{label:"收件",data:[24,31,19,27,33,22,30],backgroundColor:"#0369a1",borderRadius:6,barThickness:22}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:"#243449"},beginAtZero:true}}}}));
  }

  // ============ SCREEN 1 : 初步檢查 ============
  function s1(){
    var stat=[{v:"7",l:"待初判樣品"},{v:"63%",l:"外觀已判"},{v:"41%",l:"電性已測"}];
    var sh=""; for(var i=0;i<stat.length;i++){ sh+='<div class="mini"><div class="v">'+stat[i].v+'</div><div class="l">'+stat[i].l+'</div></div>'; }
    var rows=[
      {id:"FA-2608-0189",sp:"MLCC K2418",look:"表面龜裂",elec:"漏電流偏高",path:"破壞",tgt:"切片",r:"高",who:"黃偉倫"},
      {id:"FA-2608-0184",sp:"晶片 W17-04",look:"角落裂紋",elec:"開路",path:"非破壞",tgt:"SEM",r:"高",who:"黃偉倫"},
      {id:"FA-2608-0193",sp:"IC 封裝",look:"膨脹爆裂",elec:"功能失效",path:"非破壞",tgt:"X-ray",r:"高",who:"林承翰"},
      {id:"FA-2608-0185",sp:"BGA 焊球",look:"外觀正常",elec:"間歇開路",path:"非破壞",tgt:"X-ray",r:"中",who:"林承翰"},
      {id:"FA-2608-0192",sp:"PCB 銅箔",look:"銅箔剝離",elec:"導通異常",path:"破壞",tgt:"切片",r:"中",who:"陳品妍"},
      {id:"FA-2608-0188",sp:"LED L09",look:"光衰",elec:"Vf 偏移",path:"非破壞",tgt:"SEM",r:"低",who:"吳芷妍"}
    ];
    var tr=""; for(var j=0;j<rows.length;j++){ var r=rows[j];
      tr+='<tr><td><span class="mono">'+r.id+'</span></td><td>'+r.sp+'</td><td>'+r.look+'</td><td>'+r.elec+'</td>'+
          '<td>'+(r.path==="破壞"?chip("c-md","破壞"):chip("c-lo","非破壞"))+'</td>'+
          '<td>'+chip("c-gy",r.tgt)+'</td><td>'+pri(r.r)+'</td><td>'+r.who+'</td></tr>';
