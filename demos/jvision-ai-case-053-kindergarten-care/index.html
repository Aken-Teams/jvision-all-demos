<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>幼兒園聯絡守門員 · Kindergarten Care</title>
<meta name="description" content="每日聯絡簿、出勤接送、健康紀錄、活動照片到家長收費的幼兒園每日照護與聯繫系統（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--grn:#16a34a;--grn2:#4ade80;--grnd:#15803d;--ink:#14361f;--body:#3d5a45;--mut:#7d9a84;--line:#d9efdf;--bg:#f1faf3;--card:#fff;--amber:#f59e0b;--red:#ef4444;--ok:#22c55e;--blue:#3b82f6;--pink:#ec4899;--purple:#8b5cf6;--sky:#38bdf8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}
/* top nav */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(22,163,74,.07)}
.tb-in{display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.tb-in>*{min-width:0}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--grn),var(--grn2));color:#fff;display:grid;place-content:center;box-shadow:0 6px 16px rgba(22,163,74,.4)}
.brand .lg .material-symbols-outlined{font-size:25px;font-variation-settings:'FILL' 1}
.brand b{color:var(--ink);font-size:16px;font-family:"Noto Sans TC";font-weight:900;display:block;line-height:1.15}
.brand small{color:var(--mut);font-size:10.5px;letter-spacing:1.5px}
.nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.nav button{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--body);font:inherit;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:13px;cursor:pointer;white-space:nowrap;flex:none;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:20px;color:var(--mut)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:linear-gradient(135deg,var(--grn),var(--grn2));color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.35)}
.nav button.on .material-symbols-outlined{color:#fff}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;background:#dcfce7;color:var(--grnd);font-size:12px;font-weight:800;border-radius:999px;padding:7px 13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(22,163,74,.5)}50%{opacity:.4;box-shadow:0 0 0 6px rgba(22,163,74,0)}}
.staff{display:flex;align-items:center;gap:9px}
.staff .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--grn2),var(--grn));color:#fff;display:grid;place-content:center;font-weight:800;font-size:14px}
.staff b{color:var(--ink);font-size:13px;display:block;line-height:1.2}.staff small{color:var(--mut);font-size:11px}
/* main */
.main{max-width:1360px;margin:0 auto;padding:22px 24px 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink)}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--grn),var(--grn2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--grnd);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--grn),var(--grn2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--grn)}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);margin-top:6px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;color:var(--ok);margin-top:3px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr 1fr}
.g2b{grid-template-columns:1fr 1.1fr}
.g2c{grid-template-columns:1.3fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px 19px;min-width:0}
.card>h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .material-symbols-outlined{color:var(--grn);font-size:20px}
.card>h3 .r{margin-left:auto;font-size:12px;font-weight:800;color:var(--grnd)}
/* class overview */
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.classgrid>*{min-width:0}
.classcard{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;position:relative;overflow:hidden}
.classcard .cbar{position:absolute;left:0;top:0;bottom:0;width:5px}
.classcard .cn{font-family:"Noto Sans TC";font-weight:900;color:var(--ink);font-size:15px;display:flex;align-items:center;gap:6px}
.classcard .cn .material-symbols-outlined{font-size:19px}
.classcard .ct{font-size:11.5px;color:var(--mut);margin:2px 0 10px}
.classcard .cstat{display:flex;gap:8px;flex-wrap:wrap}
.cst{flex:1;min-width:56px;text-align:center;background:var(--bg);border-radius:11px;padding:8px 4px}
.cst b{display:block;font-family:Inter;font-weight:900;font-size:17px;color:var(--ink)}
.cst small{font-size:10.5px;color:var(--mut)}
/* signature: contact book punch */
.punch{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:4px}
.punch>*{min-width:0}
.pcell{border:1px solid var(--line);border-radius:15px;padding:13px 11px;text-align:center;background:#fff}
.pcell.done{border-color:var(--grn2);background:linear-gradient(160deg,#f0fdf4,#dcfce7)}
.pcell.now{border-color:var(--amber);background:#fffaf0}
.pcell .pic{width:42px;height:42px;border-radius:14px;display:grid;place-content:center;margin:0 auto 8px;background:#eef7f0;color:var(--grnd)}
.pcell.done .pic{background:var(--grn);color:#fff}
.pcell.now .pic{background:var(--amber);color:#fff;animation:pulse 1.6s infinite}
.pcell .pic .material-symbols-outlined{font-size:24px}
.pcell .pl{font-family:"Noto Sans TC";font-weight:800;color:var(--ink);font-size:13.5px}
.pcell .pv{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.pcell .pt{font-size:11px;font-weight:800;color:var(--grnd);margin-top:6px}
.pcell.now .pt{color:var(--amber)}
.mood{display:flex;gap:10px;justify-content:center;margin-top:6px}
.mood span{font-size:26px;filter:grayscale(.4);opacity:.5}
.mood span.on{filter:none;opacity:1;transform:scale(1.15)}
.kidhead{display:flex;align-items:center;gap:13px;margin-bottom:16px;flex-wrap:wrap}
.kidhead .kav{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--grn2),var(--grn));color:#fff;display:grid;place-content:center;font-size:28px;flex:none}
.kidhead b{font-size:18px;color:var(--ink);font-family:"Noto Sans TC"}
.kidhead small{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}
/* attendance board */
.attboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.attboard>*{min-width:0}
.kid{border-radius:15px;padding:12px;border:1px solid var(--line);background:#fff;position:relative;min-height:112px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kid.in{border-color:var(--grn);background:linear-gradient(160deg,#f2fdf5,#e2f7e8)}
.kid.out{border-color:#bfdbfe;background:#f2f7ff}
.kid.leave{border-color:#e5c9f5;background:#faf3ff}
.kid.absent{border-color:#fecaca;background:#fff4f4}
.kid .kf{display:flex;align-items:center;gap:8px}
.kid .kem{width:34px;height:34px;border-radius:11px;background:#eef7f0;display:grid;place-content:center;font-size:19px;flex:none}
.kid .knm{font-family:"Noto Sans TC";font-weight:900;color:var(--ink);font-size:14px}
.kid .kid2{font-size:10.5px;color:var(--mut)}
.kid .meta{font-size:11px;color:var(--body);margin-top:auto;line-height:1.45}
.kid .meta .material-symbols-outlined{font-size:13px;color:var(--grn);vertical-align:-2px}
.kid .st{position:absolute;right:9px;top:9px;font-size:10px;font-weight:800;border-radius:7px;padding:2px 7px}
.st-in{background:#dcfce7;color:var(--grnd)}.st-out{background:#dbeafe;color:#1d4ed8}.st-leave{background:#f3e8ff;color:#7e22ce}.st-absent{background:#fee2e2;color:#b91c1c}
.attlegend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;font-weight:700;color:var(--body)}
.attlegend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.d-in{background:var(--grn)}.d-out{background:var(--blue)}.d-leave{background:var(--purple)}.d-absent{background:var(--red)}
/* checklist rows */
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk .cbox{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-content:center;font-size:16px}
.chk.done .cbox{background:var(--grn);color:#fff}
.chk.wait .cbox{background:#fff;border:2px solid var(--line);color:transparent}
.chk.now .cbox{background:#fff;border:2px solid var(--amber);color:var(--amber);animation:pulse 1.6s infinite}
.chk .ci{flex:1;min-width:0}.chk .ci b{color:var(--ink);font-size:13.5px;font-family:"Noto Sans TC"}
.chk .ci small{display:block;color:var(--mut);font-size:11.5px}
.chk .ct{font-size:12px;font-weight:800;color:var(--grnd);white-space:nowrap;text-align:right}
.chk.wait .ct{color:var(--mut)}.chk.now .ct{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}
.p-grn{background:#dcfce7;color:var(--grnd)}.p-amber{background:#fef3c7;color:#b45309}.p-blue{background:#dbeafe;color:#1d4ed8}.p-pink{background:#fce7f3;color:#be185d}.p-red{background:#fee2e2;color:#b91c1c}.p-gray{background:#eef5f0;color:var(--mut)}.p-purple{background:#ede9fe;color:#6d28d9}
/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--body)}
.tbl tr:hover td{background:var(--bg)}
.tbl .nm{font-weight:800;color:var(--ink)}
/* timeline apt */
.apt{display:flex;gap:13px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.apt:first-of-type{border-top:0}
.apt .tm{font-weight:900;color:var(--grnd);font-size:14px;width:52px;flex:none}
.apt .ab{min-width:0}.apt .ab b{color:var(--ink);font-family:"Noto Sans TC";font-size:13.5px}
.apt .ab small{display:block;color:var(--mut);font-size:11.5px}
.apt .ar{margin-left:auto;text-align:right;flex:none}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--body)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--grn);box-shadow:0 0 0 3px #dcfce7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#dcfce7;border-color:var(--grn);color:var(--grnd)}
.chip .material-symbols-outlined{font-size:16px}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar span{display:block;height:100%;border-radius:999px}
.chartbox{position:relative;width:100%;height:250px}
.chartbox canvas{max-width:100%}
/* photos */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gallery>*{min-width:0}
.photo{border:2px dashed var(--line);border-radius:16px;background:repeating-linear-gradient(45deg,#f6fcf8,#f6fcf8 10px,#f1faf3 10px,#f1faf3 20px);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);position:relative;overflow:hidden}
.photo .material-symbols-outlined{font-size:34px;color:var(--grn2)}
.photo .pcap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(20,54,31,.72),transparent);color:#fff;font-size:11px;font-weight:700;padding:16px 10px 8px;text-align:left}
.photo .ptag{position:absolute;top:8px;left:8px;background:#fff;color:var(--grnd);font-size:10px;font-weight:800;border-radius:8px;padding:2px 8px}
.photo .plike{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);color:var(--pink);font-size:10px;font-weight:800;border-radius:8px;padding:2px 7px;display:flex;align-items:center;gap:3px}
.photo .plike .material-symbols-outlined{font-size:13px}
/* bill */
.bill{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line);font-size:13px;gap:10px}
.bill:first-of-type{border-top:0}
.bill .bn{color:var(--body)}.bill .bn small{color:var(--mut);font-size:11px;display:block}
.bill .bv{font-weight:800;color:var(--ink);font-family:Inter;white-space:nowrap}
.billtot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:13px;border-top:2px solid var(--ink)}
.billtot b{font-size:15px;color:var(--ink)}.billtot .tv{font-size:26px;font-weight:900;color:var(--grnd);font-family:Inter}
.note{background:var(--bg);border-radius:13px;padding:13px 15px;font-size:12.5px;color:var(--body);line-height:1.7}
.msg{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
.msg:first-of-type{border-top:0}
.msg .mav{width:40px;height:40px;border-radius:13px;background:#dcfce7;color:var(--grnd);display:grid;place-content:center;flex:none;font-size:20px}
.msg .mb{min-width:0;flex:1}.msg .mb b{color:var(--ink);font-family:"Noto Sans TC";font-size:13px}
.msg .mb p{margin:3px 0 0;font-size:12.5px;color:var(--body);line-height:1.5}
.msg .mt{font-size:11px;color:var(--mut);white-space:nowrap;flex:none}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g2b,.g2c{grid-template-columns:1fr}.form{grid-template-columns:1fr}.punch{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav button span.lbl{display:none}.nav button{padding:9px 11px}.brand small{display:none}.tb-r .staff{display:none}.main{padding:16px 14px 34px}.vh h2{font-size:19px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-in">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">child_care</span></span><div><b>幼兒園聯絡守門員</b><small>KINDER CARE · GATEKEEPER</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="tb-r">
      <span class="live"><i></i>聯絡簿即時同步</span>
      <div class="staff"><span class="av">妍</span><div><b>陳雅妍 老師</b><small>向日葵班 · 帶班老師</small></div></div>
    </div>
  </div>
</div>
<main class="main">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div id="vact"></div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[
["dashboard","班級總覽","班級總覽","全園 6 班的出勤、聯絡簿完成度與健康即時看板"],
["menu_book","每日聯絡簿","每日聯絡簿","用餐、午睡、如廁與情緒逐項打卡與家長回覆"],
["directions_bus","出勤接送","出勤與接送","到離園簽到、授權接送人核對與請假管理"],
["health_and_safety","健康紀錄","健康紀錄","晨檢體溫、委託餵藥、過敏管理與異常通報"],
["photo_library","活動照片","活動照片","課程活動花絮相簿整理與家長分享"],
["payments","家長收費","家長收費與聯繫","月費代收款結算、繳費對帳與家長訊息"]];
const ACT=['<button class="btn"><span class="material-symbols-outlined">today</span>今日晨會</button>',
'<button class="btn"><span class="material-symbols-outlined">done_all</span>送出聯絡簿</button>',
'<button class="btn"><span class="material-symbols-outlined">how_to_reg</span>批次簽到</button>',
'<button class="btn"><span class="material-symbols-outlined">thermostat</span>登記晨檢</button>',
'<button class="btn"><span class="material-symbols-outlined">share</span>推送相簿</button>',
'<button class="btn"><span class="material-symbols-outlined">receipt_long</span>產生繳費單</button>'];

const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd'),vact=document.getElementById('vact');
nav.innerHTML=MOD.map((m,i)=>`<button data-i="${i}" class="${i===0?'on':''}"><span class="material-symbols-outlined">${m[0]}</span><span class="lbl">${m[1]}</span></button>`).join('');

/* ---- data ---- */
const KPI=[["今日到園","groups","118","/ 132 位","出席率 89%"],["聯絡簿完成","task_alt","5","/ 6 班","1 班進行中"],["健康關注","health_and_safety","3","位","2 發燒 · 1 餵藥"],["待接送提醒","notifications_active","2","項","娃娃車尚未回報"]];

const CLASSES=[
["櫻花班","幼幼班 · 2–3 歲","#ec4899",18,16,1,1],
["向日葵班","小班 · 3–4 歲","#16a34a",24,22,1,1],
["鬱金香班","小班 · 3–4 歲","#f59e0b",22,20,0,2],
["蒲公英班","中班 · 4–5 歲","#38bdf8",23,21,1,1],
["楓葉班","大班 · 5–6 歲","#8b5cf6",25,23,1,1],
["橡樹班","大班 · 5–6 歲","#0ea5e9",20,16,2,2]];

const PUNCH=[
["restaurant","用餐","午餐 8 分滿·點心全部","done","12:10"],
["bedtime","午睡","13:20–14:35 · 熟睡","done","14:35"],
["wc","如廁","自行如廁 3 次·順利","done","15:00"],

    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{min:36,max:38.5,grid:GRID,ticks:AXF},x:{grid:{display:false},ticks:AXF}}}});}
  if(i===4){mkChart('c_photo',{type:'bar',data:{labels:['一','二','三','四','五'],datasets:[
    {label:'上傳張數',data:[142,168,175,151,189],backgroundColor:'#4ade80',borderRadius:6,barPercentage:.6},
    {label:'家長按讚',data:[210,255,301,240,318],backgroundColor:'#16a34a',borderRadius:6,barPercentage:.6}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{grid:GRID,ticks:AXF},x:{grid:{display:false},ticks:AXF}}}});}

    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{stacked:true,grid:GRID,ticks:AXF},x:{stacked:true,grid:{display:false},ticks:AXF}}}});}
}

function show(i){
  killCharts();
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];vact.innerHTML=ACT[i];
  view.innerHTML=SCREENS[i]();draw(i);
}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
