<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>幼兒園聯絡守門員 · Kindergarten Care</title>
<meta name="description" content="每日聯絡簿、出勤接送、健康紀錄、活動照片到家長收費的幼兒園每日照護與聯繫系統（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#4F46E5;--color-on-primary:#FFFFFF;--color-secondary:#818CF8;
  --color-on-secondary:#0F172A;--color-accent:#EA580C;--color-on-accent:#000000;
  --color-background:#EEF2FF;--color-foreground:#1E1B4B;--color-card:#FFFFFF;
  --color-card-foreground:#1E1B4B;--color-muted:#EBEEF8;--color-muted-foreground:#475569;
  --color-border:#C7D2FE;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;
  --color-ring:#4F46E5;--blue:#4F46E5;--ink:#1E1B4B;--muted:#475569;--line:#C7D2FE;
  --orange:#EA580C;--green:#047857;--amber:#A16207;--red:#B91C1C;--purple:#6D28D9;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  color:var(--color-foreground);background-color:var(--color-background);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;font-family:"Comic Neue","Microsoft JhengHei",sans-serif;
  font-size:16px;-webkit-font-smoothing:antialiased
}
button,input,select,textarea{font:inherit}
button,.chip{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{
  outline:4px solid var(--color-ring);outline-offset:3px
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 24;
  font-size:21px;line-height:1;vertical-align:middle
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--color-card);
  border-bottom:3px solid var(--ink);box-shadow:7px 7px 0 rgba(79,70,229,.18)
}
.tb-in{display:flex;align-items:center;gap:14px;max-width:1500px;margin:auto;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.lg{
  width:48px;height:48px;display:grid;place-items:center;color:#fff;background:var(--blue);
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--orange)
}
.lg .material-symbols-outlined{font-size:28px;font-variation-settings:'FILL' 1,'wght' 700}
.brand b,.vh h2,.card h3,.knm,.cn,.kidhead b{font-family:"Baloo 2","Microsoft JhengHei",sans-serif}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1;color:var(--ink)}
.brand small{display:block;margin-top:4px;color:var(--muted);font:700 10px/1 "Comic Neue",sans-serif;letter-spacing:1.2px}
.nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}
.nav button{
  min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:8px 11px;
  color:var(--ink);background:#fff;border:2px solid var(--ink);border-right:0;font-weight:700;white-space:nowrap
}
.nav button:last-child{border-right:2px solid var(--ink)}
.nav button:hover{color:#fff;background:var(--color-secondary)}
.nav button.on{color:#fff;background:var(--blue);box-shadow:inset 0 -5px 0 var(--orange)}
.nav button.on .material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 700}
.tb-r{display:flex;align-items:center;gap:12px;margin-left:auto;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;color:#fff;background:var(--green);border:2px solid var(--ink);font-size:12px;font-weight:700}
.live i{width:9px;height:9px;background:#fff;border:2px solid var(--ink)}
.staff{display:flex;align-items:center;gap:8px}
.av{width:39px;height:39px;display:grid;place-items:center;background:var(--orange);border:2px solid var(--ink);color:#fff;font-weight:700}
.staff b{display:block;font-size:13px}.staff small{font-size:11px;color:var(--muted)}
.main{width:min(100% - 32px,1400px);margin:auto;padding:25px 0 52px}
.vh{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin:0 0 18px;padding:18px 20px;background:#fff;border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--blue)
}
.vh h2{margin:0;color:var(--ink);font-size:30px;line-height:1;font-weight:700}
.vh p{margin:7px 0 0;color:var(--muted);font-size:14px;font-weight:700}
.btn{
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 15px;color:#fff;background:var(--orange);border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);font-family:"Baloo 2","Microsoft JhengHei",sans-serif;font-weight:700
}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.ghost{color:var(--ink);background:#fff}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr 1fr}.g2b{grid-template-columns:1fr 1.15fr}.g2c{grid-template-columns:1.35fr 1fr}
.card{
  min-width:0;padding:18px;background:var(--color-card);border:3px solid var(--ink);
  box-shadow:7px 7px 0 var(--color-secondary)
}
.card:nth-child(even){box-shadow:7px 7px 0 var(--orange)}
.card>h3,.screen-title{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;color:var(--ink);
  font-size:17px;font-weight:700;line-height:1.2
}
.card>h3:after{content:"";height:5px;min-width:32px;flex:1;background:var(--line);border:1px solid var(--ink)}
.card>h3 .r{order:3;margin-left:auto;padding:3px 7px;background:var(--color-background);border:2px solid var(--ink);font:700 12px "Comic Neue",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{position:relative;padding:14px;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--blue)}
.kpi:nth-child(2n){box-shadow-color:var(--orange)}
.kpi .l{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:700}
.kpi .v{margin-top:5px;color:var(--ink);font:700 30px/1 "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.kpi .v small{font:700 13px "Comic Neue",sans-serif;color:var(--muted)}
.kpi .d{margin-top:7px;padding-top:6px;border-top:2px solid var(--line);color:var(--green);font-size:12px;font-weight:700}
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.classcard{position:relative;padding:14px 12px 12px 17px;background:#fff;border:2px solid var(--ink)}
.cbar{position:absolute;inset:0 auto 0 0;width:7px;border-right:2px solid var(--ink)}
.cn{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:16px;font-weight:700}
.ct{margin:3px 0 10px;color:var(--muted);font-size:12px}
.cstat{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.cst{padding:6px 3px;text-align:center;background:var(--color-muted);border:1px solid var(--ink)}
.cst b{display:block;color:var(--ink);font:700 18px "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.cst small{color:var(--muted);font-size:10px}
.chartbox{position:relative;width:100%;height:245px}
.chartbox canvas{max-width:100%}
.bar{height:13px;margin:7px 0;background:var(--color-muted);border:2px solid var(--ink);overflow:hidden}
.bar span{display:block;height:100%}
.kidhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.kav,.kem{
  display:grid;place-items:center;flex:none;color:#fff;background:var(--blue);border:2px solid var(--ink)
}
.kav{width:56px;height:56px}.kav .material-symbols-outlined{font-size:30px}
.kidhead b{display:block;color:var(--ink);font-size:20px;font-weight:700}
.kidhead small{display:block;color:var(--muted);font-size:12px}
.punch{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pcell{padding:12px 8px;text-align:center;background:#fff;border:2px solid var(--ink)}
.pcell.done{background:#ECFDF5;box-shadow:4px 4px 0 var(--green)}
.pcell.now{background:#FFF7ED;box-shadow:4px 4px 0 var(--orange)}
.pic{width:43px;height:43px;display:grid;place-items:center;margin:0 auto 8px;background:var(--color-muted);border:2px solid var(--ink)}
.done .pic{color:#fff;background:var(--green)}.now .pic{color:#fff;background:var(--orange)}
.pl{color:var(--ink);font-weight:700}.pv{min-height:34px;margin-top:3px;color:var(--muted);font-size:11px}
.pt{margin-top:5px;color:var(--green);font-weight:700;font-size:11px}.now .pt{color:var(--orange)}
.mood{display:flex;justify-content:center;gap:8px;margin-top:7px}
.mood span{width:42px;height:42px;display:grid;place-items:center;color:var(--muted);background:#fff;border:2px solid var(--ink)}
.mood span.on{color:#fff;background:var(--orange);box-shadow:4px 4px 0 var(--ink)}
.note{padding:12px 14px;color:var(--ink);background:var(--color-muted);border:2px solid var(--ink);font-size:13px;line-height:1.55}
.note b{color:var(--blue)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fld{display:flex;flex-direction:column;gap:5px;color:var(--ink);font-size:12px;font-weight:700}.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 11px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{min-height:40px;display:inline-flex;align-items:center;gap:5px;padding:7px 10px;color:var(--ink);background:#fff;border:2px solid var(--ink);font-size:12px;font-weight:700}
.chip.on{color:#fff;background:var(--blue);box-shadow:3px 3px 0 var(--orange)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:2px solid currentColor;font-size:11px;font-weight:700;white-space:nowrap}
.p-grn{color:#065F46;background:#D1FAE5}.p-amber{color:#92400E;background:#FEF3C7}.p-blue{color:#3730A3;background:#E0E7FF}
.p-pink{color:#9D174D;background:#FCE7F3}.p-red{color:#991B1B;background:#FEE2E2}.p-gray{color:#475569;background:#F1F5F9}.p-purple{color:#5B21B6;background:#EDE9FE}
.attlegend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:13px;font-size:12px;font-weight:700}
.attlegend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;display:inline-block;border:2px solid var(--ink)}
.d-in{background:var(--green)}.d-out{background:var(--blue)}.d-leave{background:var(--purple)}.d-absent{background:var(--red)}
.attboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.kid{position:relative;min-height:119px;display:flex;flex-direction:column;gap:4px;padding:12px;background:#fff;border:2px solid var(--ink)}
.kid.in{box-shadow:4px 4px 0 var(--green)}.kid.out{box-shadow:4px 4px 0 var(--blue)}.kid.leave{box-shadow:4px 4px 0 var(--purple)}.kid.absent{box-shadow:4px 4px 0 var(--red)}
.kf{display:flex;align-items:center;gap:7px}.kem{width:35px;height:35px;color:var(--ink);background:var(--color-muted)}
.knm{font-size:15px;font-weight:700}.kid2{color:var(--muted);font:700 10px monospace}
.meta{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.6}.meta .material-symbols-outlined{font-size:14px;color:var(--blue)}
.st{position:absolute;right:7px;top:7px;padding:2px 5px;border:1px solid currentColor;font-size:10px;font-weight:700}
.st-in{color:#065F46;background:#D1FAE5}.st-out{color:#3730A3;background:#E0E7FF}.st-leave{color:#5B21B6;background:#EDE9FE}.st-absent{color:#991B1B;background:#FEE2E2}
.scroll{overflow-x:auto;border:2px solid var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px;text-align:left;color:#fff;background:var(--ink);border-right:1px solid var(--color-secondary);font-size:11px;white-space:nowrap}
.tbl td{padding:10px;color:var(--ink);background:#fff;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:nth-child(even) td{background:var(--color-background)}.tbl tbody tr:hover td{background:#FFF7ED}.tbl .nm{font-weight:700}
.tbl td:nth-child(2),.tbl td:nth-child(4){font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:2px solid var(--line)}
.chk:first-of-type{border-top:0}.cbox{width:28px;height:28px;display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
.chk.done .cbox{color:#fff;background:var(--green)}.chk.now .cbox{color:#fff;background:var(--orange)}.chk.wait .cbox{color:var(--muted);background:#fff}
.ci{flex:1;min-width:0}.ci b{color:var(--ink);font-size:13px}.ci small{display:block;color:var(--muted);font-size:11px}
.chk .ct{color:var(--green);font:700 12px/1.4 monospace;text-align:right}.chk.now .ct{color:var(--orange)}.chk.wait .ct{color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.photo{
  position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;
  color:var(--blue);background:repeating-linear-gradient(135deg,#fff,#fff 12px,var(--color-muted) 12px,var(--color-muted) 24px);
  border:2px solid var(--ink)
}
.photo>.material-symbols-outlined{font-size:40px}.pcap{position:absolute;inset:auto 0 0;padding:18px 8px 7px;color:#fff;background:linear-gradient(transparent,var(--ink));font-size:11px;font-weight:700}
.ptag,.plike{position:absolute;top:6px;padding:2px 6px;color:var(--ink);background:#fff;border:1px solid var(--ink);font-size:10px;font-weight:700}.ptag{left:6px}.plike{right:6px;display:flex;align-items:center;gap:2px}.plike .material-symbols-outlined{font-size:13px;color:var(--red)}
.bill{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:2px dashed var(--line);font-size:13px}.bill:first-of-type{border-top:0}
.bn{color:var(--ink)}.bn small{display:block;color:var(--muted);font-size:11px}.bv{color:var(--ink);font:700 14px monospace;text-align:right}
.billtot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:12px;border-top:4px solid var(--ink)}
.billtot b{font-size:16px}.tv{color:var(--orange);font:700 29px "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.msg{display:flex;gap:10px;padding:11px 0;border-top:2px solid var(--line)}.msg:first-of-type{border-top:0}
.mav{width:40px;height:40px;display:grid;place-items:center;flex:none;color:#fff;background:var(--blue);border:2px solid var(--ink)}
.mb{min-width:0;flex:1}.mb b{font-weight:700}.mb p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.mt{color:var(--muted);font:700 11px monospace;white-space:nowrap}
.mono{font-family:monospace;font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
#view>.card,#view>.grid>.card,.kpi,.classcard,.kid,.photo{animation:enter .4s cubic-bezier(.34,1.56,.64,1) both}
#view .kpi:nth-child(2),#view .classcard:nth-child(2),#view .kid:nth-child(2),#view .photo:nth-child(2){animation-delay:.06s}
#view .kpi:nth-child(3),#view .classcard:nth-child(3),#view .kid:nth-child(3),#view .photo:nth-child(3){animation-delay:.12s}
#view .kpi:nth-child(4),#view .classcard:nth-child(4),#view .kid:nth-child(4),#view .photo:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
}
@media(max-width:1024px){.tb-in{align-items:flex-start;flex-wrap:wrap}.nav{order:3;width:100%}.tb-r{margin-left:auto}.g2,.g2b,.g2c{grid-template-columns:1fr}}
@media(max-width:768px){.kpis{grid-template-columns:repeat(2,1fr)}.punch{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.fld.full{grid-column:auto}.vh h2{font-size:25px}}
@media(max-width:480px){
  .main{width:min(100% - 20px,1400px);padding-top:18px}.tb-in{padding:8px 10px}.brand small,.staff,.live{display:none}
  .nav button{flex:1;justify-content:center;padding:8px}.nav .lbl{display:none}.vh{padding:15px;box-shadow:5px 5px 0 var(--blue)}
  .vh h2{font-size:22px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:10px}.kpi .v{font-size:25px}
  .card{padding:13px;box-shadow:5px 5px 0 var(--color-secondary)}.classgrid{grid-template-columns:1fr}.attboard{grid-template-columns:1fr 1fr}
  .punch{grid-template-columns:1fr 1fr}.mood{gap:4px}.mood span{width:36px;height:36px}.kid{min-height:125px;padding:9px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined" aria-hidden="true">child_care</span></span><div><b>幼兒園聯絡守門員</b><small>KINDER CARE · GATEKEEPER</small></div></div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="tb-r">
      <span class="live"><i aria-hidden="true"></i>聯絡簿即時同步</span>
      <div class="staff"><span class="av">妍</span><div><b>陳雅妍 老師</b><small>向日葵班 · 帶班老師</small></div></div>
    </div>
  </div>
</header>
<main class="main">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div id="vact"></div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[
["dashboard","班級總覽","班級總覽","全園 6 班的出勤、聯絡簿完成度與健康即時看板"],
["menu_book","每日聯絡簿","每日聯絡簿","用餐、午睡、如廁與情緒逐項打卡與家長回覆"],
["directions_bus","出勤接送","出勤與接送","到離園簽到、授權接送人核對與請假管理"],
["health_and_safety","健康紀錄","健康紀錄","晨檢體溫、委託餵藥、過敏管理與異常通報"],
["photo_library","活動照片","活動照片","課程活動花絮相簿整理與家長分享"],
["payments","家長收費","家長收費與聯繫","月費代收款結算、繳費對帳與家長訊息"]];
const ACT=[
["today","今日晨會"],["done_all","送出聯絡簿"],["how_to_reg","批次簽到"],
["thermostat","登記晨檢"],["share","推送相簿"],["receipt_long","產生繳費單"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd"),vact=document.getElementById("vact");
nav.innerHTML=MOD.map((m,i)=>`<button type="button" data-i="${i}" aria-current="${i===0?"page":"false"}"><span class="material-symbols-outlined" aria-hidden="true">${m[0]}</span><span class="lbl">${m[1]}</span></button>`).join("");

const KPI=[["今日到園","groups","118","/ 132 位","出席率 89%"],["聯絡簿完成","task_alt","5","/ 6 班","1 班進行中"],["健康關注","health_and_safety","3","位","2 發燒 · 1 餵藥"],["待接送提醒","notifications_active","2","項","娃娃車尚未回報"]];
const CLASSES=[

function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?+m[1]:0);
  try{window.scrollTo(0,0)}catch(e){}
}
nav.addEventListener("click",e=>{
  const b=e.target.closest("button[data-i]");
  if(!b)return;
  const next=+b.dataset.i,hash="#v"+next;
  if(location.hash===hash)show(next);else location.hash=hash;
});
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
