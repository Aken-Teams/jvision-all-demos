<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人力派遣管理 · Jvision Staff Dispatch</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&amp;family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --ease:180ms ease;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:0;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  color:#FFFFFF;
  background:var(--color-foreground);
  border-bottom:4px solid var(--color-secondary);
}
.tb-inner{
  width:min(100%,1440px);
  min-width:0;
  margin:0 auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
}
.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
  color:#FFFFFF;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:17px;
  font-weight:600;
  letter-spacing:.03em;
}
.brand .logo{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-secondary);
  background:var(--color-secondary);
  border:2px solid #99F6E4;
  border-radius:var(--radius-sm);
}
.brand small{
  display:block;
  margin-top:1px;
  color:#CCFBF1;
  font-family:"Crimson Pro",serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.14em;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 12px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:#CCFBF1;
  font:600 15px/1 "Crimson Pro","Noto Serif TC",serif;
  white-space:nowrap;
  transition:background-color var(--ease),color var(--ease),border-color var(--ease);
}
.nav button:hover{background:#115E59;color:#FFFFFF;border-color:#2DD4BF}
.nav button.on{background:var(--color-secondary);color:var(--color-on-secondary);border-color:var(--color-secondary)}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{
  width:min(100%,1440px);
  min-width:0;
  margin:0 auto;
  padding:26px 24px 64px;
}
.page-head{
  min-width:0;
  margin-bottom:18px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-left:7px solid var(--color-primary);
  border-radius:var(--radius-md);
}
.page-head h1{
  margin:0;
  color:var(--color-foreground);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(27px,3vw,36px);
  font-weight:700;
  line-height:1.05;
  letter-spacing:.01em;
}
.page-head p{margin:5px 0 0;color:var(--color-muted-foreground);font-size:14px;font-weight:500}
.tag{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 13px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #92400E;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:700;
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{
  min-width:0;
  min-height:136px;
  position:relative;
  overflow:hidden;
  padding:17px 18px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-top:4px solid var(--color-primary);
  border-radius:var(--radius-md);
  transition:background-color var(--ease),border-color var(--ease),transform var(--ease);
  animation:card-in 400ms cubic-bezier(.2,.9,.25,1.2) both;
}
.kpi:nth-child(2){animation-delay:60ms}.kpi:nth-child(3){animation-delay:120ms}.kpi:nth-child(4){animation-delay:180ms}
.kpi:hover{background:#F8FFFE;border-color:var(--color-primary);transform:translateY(-2px)}
.kpi .ico{
  position:absolute;
  right:12px;
  top:12px;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#115E59;
  background:#CCFBF1;
  border:1px solid var(--color-border);
  border-radius:var(--radius-sm);
  font-size:23px;
}
.kpi .lab{position:relative;padding-right:45px;color:var(--color-muted-foreground);font-size:13px;font-weight:600}
.kpi .val{position:relative;margin-top:12px;color:var(--color-foreground);font-size:29px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .sub{position:relative;margin-top:9px;font-size:12px;font-weight:600}
.up{color:#166534}.down{color:#B91C1C}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g21{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card,.sig{
  min-width:0;
  padding:17px 18px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
}
.card{animation:card-in 380ms 100ms cubic-bezier(.2,.9,.25,1.2) both}
.sig{background:#ECFEFF;border-left:5px solid var(--color-primary)}
.card h3,.sig h3{
  margin:0 0 13px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-foreground);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:18px;
  font-weight:700;
  line-height:1.2;
}
.card h3 .material-symbols-outlined,.sig h3 .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.card .hint{margin-left:auto;color:var(--color-muted-foreground);font:600 12px/1.2 "Crimson Pro",serif}
.chart-wrap{position:relative;height:260px;min-width:0;overflow:hidden}
.chart-sm{position:relative;height:210px;min-width:0;overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{
  padding:11px 12px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid #B7E9E3;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#134E4A;
  background:var(--color-muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.045em;
}
th:first-child{border-radius:var(--radius-sm) 0 0 0}
th:last-child{border-radius:0 var(--radius-sm) 0 0}
tbody tr{transition:background-color var(--ease)}
tbody tr:hover{background:#ECFEFF}
tbody tr:last-child td{border-bottom:0}
td.money,td:nth-child(n+3){font-variant-numeric:tabular-nums}
td.money{text-align:right;font-family:"Crimson Pro",ui-monospace,SFMono-Regular,Consolas,monospace}
.avatar{
  width:32px;
  height:32px;
  margin-right:8px;
  display:inline-grid;
  place-items:center;
  color:#FFFFFF;
  background:#115E59;
  border:2px solid var(--color-secondary);
  border-radius:50%;
  font-weight:700;
  font-size:13px;
}
.pill{
  min-height:25px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  line-height:1.25;
}
.p-ok{background:#DCFCE7;color:#166534}.p-warn{background:#FEF3C7;color:#92400E}
.p-bad{background:#FEE2E2;color:#B91C1C}.p-info{background:#E0F2FE;color:#075985}
.p-gray{background:#F1F5F9;color:#475569}.p-acc{background:#CCFBF1;color:#115E59}
.bar{height:8px;min-width:60px;overflow:hidden;background:#DDEBEA;border:1px solid #B7D8D4;border-radius:999px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:999px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px}
.col{min-width:0;padding:12px;background:#F8FFFE;border:1px solid var(--color-border);border-radius:var(--radius-md)}
.col-h{
  margin-bottom:10px;
  padding:2px 2px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--color-secondary);
  color:var(--color-foreground);
  font-size:14px;
  font-weight:700;
}
.col-h .cnt{min-width:25px;padding:2px 8px;text-align:center;background:#CCFBF1;color:#115E59;border:1px solid var(--color-border);border-radius:999px;font-size:12px}
.ticket{
  margin-bottom:9px;
  padding:10px 11px;
  background:#FFFFFF;
  border:1px solid #99DCD4;
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  font-size:13px;
  transition:background-color var(--ease),border-color var(--ease),transform var(--ease);
}
.ticket:hover{background:#ECFEFF;border-color:var(--color-primary);transform:translateX(2px)}
.ticket b{font-size:13px}.ticket .meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:11.5px}
.stat-row{min-width:0;padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px dashed #99DCD4;font-size:14px}
.stat-row:last-child{border-bottom:0}
.dot{width:10px;height:10px;flex:none;border:2px solid var(--color-foreground);border-radius:50%}
.legend{margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cand{min-width:0;margin-bottom:10px;padding:11px 12px;display:flex;align-items:center;gap:11px;background:#FFFFFF;border:1px solid #99DCD4;border-radius:var(--radius-sm)}
.cand .score{margin-left:auto;flex:none;text-align:right}
.cand .score b{color:#0F766E;font-size:21px;font-variant-numeric:tabular-nums}
.chips{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:2px 7px;background:#CCFBF1;color:#115E59;border:1px solid #5EEAD4;border-radius:4px;font-size:11px;font-weight:700}
.chip.miss{background:#FEE2E2;color:#B91C1C;border-color:#FCA5A5}
.invoice{overflow:hidden;border:1px solid var(--color-border);border-radius:var(--radius-md);background:#FFFFFF}
.inv-h{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#115E59;color:#FFFFFF;border-bottom:4px solid var(--color-secondary)}
.inv-h b{font-family:"Cormorant Garamond",serif;font-size:18px}.inv-h .amt{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mini{padding:11px;background:#F0FDFA;border:1px solid #99DCD4;border-radius:var(--radius-sm)}
.mini .l{color:var(--color-muted-foreground);font-size:12px}.mini .v{margin-top:3px;color:var(--color-foreground);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
@keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:1100px){
  .tb-inner{align-items:flex-start}
  .nav{width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
}
@media(max-width:820px){
  .g2,.g3,.g21,.mini-grid{grid-template-columns:1fr}
  .wrap{padding-inline:18px}
}
@media(max-width:640px){
  .tb-inner{padding:10px 14px}
  .wrap{padding:18px 14px 48px}
  .page-head{align-items:flex-start;padding:15px 14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{min-height:128px;padding:14px}
  .kpi .val{font-size:24px}
  .board{grid-template-columns:1fr}
  .card,.sig{padding:14px}
}
@media(max-width:420px){
  .brand{font-size:15px}
  .nav button{min-width:43px;justify-content:center;padding:9px 11px}
  .nav button span.txt{display:none}
  .kpis{grid-template-columns:1fr}
  .kpi{min-height:112px}
  .page-head h1{font-size:29px}
  .tag{width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">engineering</span></span>
      <div>人力派遣管理<small>JVISION STAFF DISPATCH</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="view"></div></main>

<script>
"use strict";
var NAV=[
  {i:0,ic:"groups",t:"派遣人力庫"},
  {i:1,ic:"account_tree",t:"客戶案場"},
  {i:2,ic:"engineering",t:"派工調度"},
  {i:3,ic:"fact_check",t:"出勤工時"},
  {i:4,ic:"request_quote",t:"薪資結算"},
  {i:5,ic:"receipt_long",t:"客戶請款"}
];
var chart=null;
function destroyChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }
function el(id){ return document.getElementById(id); }

var STAFF=[
  {id:"D-2041",nm:"陳建志",role:"保全員",cert:["保全證","CPR"],area:"台北信義",st:"派遣中",rate:210,util:96,rank:"A"},
  {id:"D-2088",nm:"林淑芬",role:"清潔員",cert:["清潔證"],area:"台北中山",st:"可派",rate:190,util:71,rank:"B"},
  {id:"D-2103",nm:"黃文雄",role:"堆高機",cert:["堆高機證"],area:"新北五股",st:"派遣中",rate:260,util:88,rank:"A"},
  {id:"D-2117",nm:"張美玲",role:"包裝作業",cert:["食品衛生"],area:"桃園龜山",st:"可派",rate:200,util:64,rank:"B"},
  {id:"D-2129",nm:"吳承恩",role:"保全員",cert:["保全證"],area:"台北大安",st:"休假",rate:210,util:52,rank:"C"},
  {id:"D-2145",nm:"劉家豪",role:"倉儲揀貨",cert:["堆高機證"],area:"新北汐止",st:"可派",rate:220,util:79,rank:"A"},
  {id:"D-2160",nm:"蔡雅婷",role:"櫃檯接待",cert:["日語N2"],area:"台北松山",st:"派遣中",rate:230,util:91,rank:"A"},
  {id:"D-2178",nm:"鄭志偉",role:"技術維修",cert:["電工乙級"],area:"新北板橋",st:"可派",rate:290,util:83,rank:"A"}
];
var SITES=[
  {id:"S-108",nm:"信義金融大樓",cust:"O泰資產",need:12,fill:12,shift:"三班輪值",cert:"保全證",bill:340,pri:"高"},
  {id:"S-115",nm:"五股物流中心",cust:"O捷物流",need:20,fill:17,shift:"日班/夜班",cert:"堆高機證",bill:380,pri:"高"},
  {id:"S-122",nm:"松山商辦大樓",cust:"O華不動產",need:6,fill:6,shift:"日班",cert:"—",bill:320,pri:"中"},
  {id:"S-130",nm:"桃園龜山廠",cust:"O鴻食品",need:15,fill:9,shift:"日班/小夜",cert:"食品衛生",bill:290,pri:"高"},
  {id:"S-141",nm:"汐止科技園區",cust:"O達科技",need:8,fill:7,shift:"日班",cert:"—",bill:330,pri:"中"},
  {id:"S-150",nm:"板橋展覽中心",cust:"O球會展",need:10,fill:4,shift:"活動日",cert:"—",bill:360,pri:"急"}
];

function s0(){
  var rows=STAFF.map(function(s){
    var stc=s.st==="派遣中"?"p-ok":s.st==="可派"?"p-info":s.st==="休假"?"p-warn":"p-gray";
    var certs=s.cert.map(function(c){return '<span class="chip">'+c+'</span>';}).join("");
    return '<tr><td><span class="avatar">'+s.nm.charAt(0)+'</span>'+s.nm+'<div style="font-size:11px;color:var(--muted);margin-left:38px">'+s.id+'</div></td>'
      +'<td>'+s.role+'</td>'
      +'<td><div class="chips">'+certs+'</div></td>'
      +'<td>'+s.area+'</td>'
      +'<td><span class="pill '+stc+'">'+s.st+'</span></td>'
      +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+s.util+'%"></i></div><b style="font-size:12px">'+s.util+'%</b></div></td>'
      +'<td class="money" style="font-weight:700">$'+s.rate+'</td>'
      +'<td><span class="pill p-acc">'+s.rank+' 級</span></td></tr>';
  }).join("");
  return kpiBlock([
    {lab:"派遣人力總數",val:"286 人",sub:"+12 本月新增",cls:"up",ic:"groups"},
    {lab:"目前可派",val:"64 人",sub:"平均可派工時 6.2h",cls:"up",ic:"how_to_reg"},
    {lab:"派遣中",val:"197 人",sub:"稼動率 84%",cls:"up",ic:"engineering"},
    {lab:"證照即將到期",val:"9 人",sub:"30 天內需更新",cls:"down",ic:"warning"}
  ])
  +'<div class="g2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">badge</span>派遣員工名冊<span class="hint">依稼動率</span></h3>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>員工</th><th>職類</th><th>證照</th><th>地緣</th><th>狀態</th><th>稼動率</th><th>時薪</th><th>評級</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    +'<div style="display:flex;flex-direction:column;gap:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>職類人力分佈</h3><div class="chart-sm"><canvas id="c0a"></canvas></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">event_available</span>證照到期提醒</h3>'

  {t:"派遣人力庫",p:"派遣員工建檔、證照與可派狀態管理",render:s0,chart:c0},
  {t:"客戶案場",p:"案場需求、班別與必要資格看板",render:s1,chart:c1},

(function(){
  var nav=el("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }).join("");
  nav.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");
    if(b){ location.hash="v"+b.getAttribute("data-i"); }
  });
})();

function show(i){
  var sc=SCREENS[i]; if(!sc) return;
  destroyChart();
  var view=el("view");
  view.innerHTML='<div class="page-head"><div><h1>'+sc.t+'</h1><p>'+sc.p+'</p></div>'
    +'<div class="tag"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>即時營運</div></div>'
    +sc.render();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
  void view.offsetHeight;
  if(sc.chart){ try{ sc.chart(); }catch(e){} }
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
