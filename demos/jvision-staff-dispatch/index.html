<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人力派遣管理 · Jvision Staff Dispatch</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#ede9fe;
  --bg:#f5f3ff; --panel:#ffffff; --ink:#1e1b2e; --muted:#6b6880;
  --line:#e7e3f3; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; min-width:0;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(100deg,#4c1d95,#6d28d9 55%,#7c3aed);
  color:#fff;box-shadow:0 4px 18px rgba(76,29,149,.28);
}
.tb-inner{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.5px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25)}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.8;letter-spacing:1px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{
  display:flex;align-items:center;gap:7px;border:0;cursor:pointer;
  background:rgba(255,255,255,.08);color:#ede9fe;
  padding:9px 13px;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;
  white-space:nowrap;flex:none;transition:.15s;
}
.nav button:hover{background:rgba(255,255,255,.2);color:#fff}
.nav button.on{background:#fff;color:var(--accent)}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-width:0}
.page-head h1{font-size:21px;margin:0;font-weight:800;font-family:"Noto Sans TC",sans-serif}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi .ico{position:absolute;right:-8px;top:-8px;font-size:64px;color:var(--accent-soft)}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;position:relative}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;position:relative}
.kpi .sub{font-size:11.5px;margin-top:4px;position:relative}
.up{color:var(--ok)} .down{color:var(--bad)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g21{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 17px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;font-family:"Noto Sans TC",sans-serif;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .hint{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.chart-wrap{position:relative;height:260px;overflow:hidden;min-width:0}
.chart-sm{position:relative;height:200px;overflow:hidden;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:#faf9ff}
tbody tr:hover{background:#faf8ff}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-right:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.p-ok{background:#dcfce7;color:#15803d} .p-warn{background:#fef3c7;color:#b45309}
.p-bad{background:#fee2e2;color:#b91c1c} .p-info{background:#dbeafe;color:#1d4ed8}
.p-gray{background:#eee9f6;color:#6b6880} .p-acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;border-radius:4px;background:#ece8f6;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.col{background:#faf9ff;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:9px;padding-bottom:8px;border-bottom:2px solid var(--accent-soft)}
.col-h .cnt{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px}
.ticket{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:9px;font-size:12.5px;box-shadow:0 1px 3px rgba(30,27,46,.05)}
.ticket b{font-size:12.5px} .ticket .meta{color:var(--muted);font-size:11px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.stat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-row:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sig{background:linear-gradient(120deg,#f5f3ff,#ede9fe);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}
.cand{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;min-width:0}
.cand .score{margin-left:auto;text-align:right;flex:none}
.cand .score b{font-size:19px;color:var(--accent)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:10.5px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:6px;font-weight:600}
.chip.miss{background:#fee2e2;color:#b91c1c}
.invoice{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.inv-h{background:linear-gradient(100deg,#4c1d95,#6d28d9);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.inv-h b{font-size:16px} .inv-h .amt{font-size:22px;font-weight:800}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{background:#faf9ff;border:1px solid var(--line);border-radius:11px;padding:11px}
.mini .l{font-size:11.5px;color:var(--muted)} .mini .v{font-size:17px;font-weight:800;margin-top:3px}
@media(max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .g2,.g3,.g21,.mini-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:9px 11px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">engineering</span></span>
      <div>人力派遣管理<small>JVISION STAFF DISPATCH</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="view"></div></main>

<script>
"use strict";
var NAV=[
  {i:0,ic:"groups",t:"派遣人力庫"},
  {i:1,ic:"account_tree",t:"客戶案場"},
  {i:2,ic:"engineering",t:"派工調度"},
  {i:3,ic:"fact_check",t:"出勤工時"},
  {i:4,ic:"request_quote",t:"薪資結算"},
  {i:5,ic:"receipt_long",t:"客戶請款"}
];
var chart=null;
function destroyChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }
function el(id){ return document.getElementById(id); }

var STAFF=[
  {id:"D-2041",nm:"陳建志",role:"保全員",cert:["保全證","CPR"],area:"台北信義",st:"派遣中",rate:210,util:96,rank:"A"},
  {id:"D-2088",nm:"林淑芬",role:"清潔員",cert:["清潔證"],area:"台北中山",st:"可派",rate:190,util:71,rank:"B"},
  {id:"D-2103",nm:"黃文雄",role:"堆高機",cert:["堆高機證"],area:"新北五股",st:"派遣中",rate:260,util:88,rank:"A"},
  {id:"D-2117",nm:"張美玲",role:"包裝作業",cert:["食品衛生"],area:"桃園龜山",st:"可派",rate:200,util:64,rank:"B"},
  {id:"D-2129",nm:"吳承恩",role:"保全員",cert:["保全證"],area:"台北大安",st:"休假",rate:210,util:52,rank:"C"},
  {id:"D-2145",nm:"劉家豪",role:"倉儲揀貨",cert:["堆高機證"],area:"新北汐止",st:"可派",rate:220,util:79,rank:"A"},
  {id:"D-2160",nm:"蔡雅婷",role:"櫃檯接待",cert:["日語N2"],area:"台北松山",st:"派遣中",rate:230,util:91,rank:"A"},
  {id:"D-2178",nm:"鄭志偉",role:"技術維修",cert:["電工乙級"],area:"新北板橋",st:"可派",rate:290,util:83,rank:"A"}
];
var SITES=[
  {id:"S-108",nm:"信義金融大樓",cust:"O泰資產",need:12,fill:12,shift:"三班輪值",cert:"保全證",bill:340,pri:"高"},
  {id:"S-115",nm:"五股物流中心",cust:"O捷物流",need:20,fill:17,shift:"日班/夜班",cert:"堆高機證",bill:380,pri:"高"},
  {id:"S-122",nm:"松山商辦大樓",cust:"O華不動產",need:6,fill:6,shift:"日班",cert:"—",bill:320,pri:"中"},
  {id:"S-130",nm:"桃園龜山廠",cust:"O鴻食品",need:15,fill:9,shift:"日班/小夜",cert:"食品衛生",bill:290,pri:"高"},
  {id:"S-141",nm:"汐止科技園區",cust:"O達科技",need:8,fill:7,shift:"日班",cert:"—",bill:330,pri:"中"},
  {id:"S-150",nm:"板橋展覽中心",cust:"O球會展",need:10,fill:4,shift:"活動日",cert:"—",bill:360,pri:"急"}
];

function s0(){
  var rows=STAFF.map(function(s){
    var stc=s.st==="派遣中"?"p-ok":s.st==="可派"?"p-info":s.st==="休假"?"p-warn":"p-gray";
    var certs=s.cert.map(function(c){return '<span class="chip">'+c+'</span>';}).join("");
    return '<tr><td><span class="avatar">'+s.nm.charAt(0)+'</span>'+s.nm+'<div style="font-size:11px;color:var(--muted);margin-left:38px">'+s.id+'</div></td>'
      +'<td>'+s.role+'</td>'
      +'<td><div class="chips">'+certs+'</div></td>'
      +'<td>'+s.area+'</td>'
      +'<td><span class="pill '+stc+'">'+s.st+'</span></td>'
      +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+s.util+'%"></i></div><b style="font-size:12px">'+s.util+'%</b></div></td>'
      +'<td class="money" style="font-weight:700">$'+s.rate+'</td>'
      +'<td><span class="pill p-acc">'+s.rank+' 級</span></td></tr>';
  }).join("");
  return kpiBlock([
    {lab:"派遣人力總數",val:"286 人",sub:"+12 本月新增",cls:"up",ic:"groups"},
    {lab:"目前可派",val:"64 人",sub:"平均可派工時 6.2h",cls:"up",ic:"how_to_reg"},
    {lab:"派遣中",val:"197 人",sub:"稼動率 84%",cls:"up",ic:"engineering"},
    {lab:"證照即將到期",val:"9 人",sub:"30 天內需更新",cls:"down",ic:"warning"}
  ])
  +'<div class="g2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">badge</span>派遣員工名冊<span class="hint">依稼動率</span></h3>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>員工</th><th>職類</th><th>證照</th><th>地緣</th><th>狀態</th><th>稼動率</th><th>時薪</th><th>評級</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    +'<div style="display:flex;flex-direction:column;gap:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>職類人力分佈</h3><div class="chart-sm"><canvas id="c0a"></canvas></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">event_available</span>證照到期提醒</h3>'
        +certRow("陳建志","保全證","12 天",true)
        +certRow("黃文雄","堆高機證","21 天",true)
        +certRow("張美玲","食品衛生","28 天",false)
        +certRow("鄭志偉","電工乙級","44 天",false)
      +'</div>'
    +'</div>'
  +'</div>';
}
function certRow(n,c,d,warn){
  return '<div class="stat-row"><span class="material-symbols-outlined" style="color:'+(warn?'var(--warn)':'var(--muted)')+'">workspace_premium</span>'
    +'<div style="flex:1"><b>'+n+'</b> · '+c+'</div><span class="pill '+(warn?'p-warn':'p-gray')+'">'+d+'</span></div>';
}
function c0(){
  chart=new Chart(el("c0a"),{type:"doughnut",data:{labels:["保全員","倉儲揀貨","清潔員","技術維修","接待/包裝"],
    datasets:[{data:[92,68,54,38,34],backgroundColor:["#6d28d9","#8b5cf6","#a78bfa","#c4b5fd","#ddd6fe"],borderWidth:2,borderColor:"#fff"}]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"right",labels:{boxWidth:12,font:{size:11}}}},cutout:"58%"}});
}

function s1(){
  var rows=SITES.map(function(s){
    var gap=s.need-s.fill;
    var pc=Math.round(s.fill/s.need*100);
    var pcls=pc>=100?"p-ok":pc>=80?"p-info":"p-bad";
    var pric=s.pri==="急"?"p-bad":s.pri==="高"?"p-warn":"p-gray";
    return '<tr><td><b>'+s.nm+'</b><div style="font-size:11px;color:var(--muted)">'+s.id+'</div></td>'
      +'<td>'+s.cust+'</td>'
      +'<td>'+s.shift+'</td>'
      +'<td>'+(s.cert==="—"?'<span style="color:var(--muted)">不限</span>':'<span class="chip">'+s.cert+'</span>')+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:8px;min-width:120px"><div class="bar" style="flex:1"><i style="width:'+pc+'%"></i></div><span class="pill '+pcls+'">'+s.fill+'/'+s.need+'</span></div></td>'
      +'<td>'+(gap>0?'<span class="pill p-bad">缺 '+gap+'</span>':'<span class="pill p-ok">已滿</span>')+'</td>'
      +'<td class="money" style="font-weight:700">$'+s.bill+'</td>'
      +'<td><span class="pill '+pric+'">'+s.pri+'</span></td></tr>';
  }).join("");
  return kpiBlock([
    {lab:"合作案場",val:"48 處",sub:"6 家主要客戶",cls:"up",ic:"account_tree"},
    {lab:"今日需求人次",val:"312",sub:"含活動臨時單",cls:"up",ic:"assignment"},
    {lab:"缺工缺口",val:"21 人",sub:"3 案場待補",cls:"down",ic:"warning"},
    {lab:"平均填補率",val:"87%",sub:"+4% 較上週",cls:"up",ic:"trending_up"}
  ])
  +'<div class="g2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">store</span>客戶案場需求看板<span class="hint">依優先度</span></h3>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>案場</th><th>客戶</th><th>班別</th><th>必要資格</th><th>填補進度</th><th>缺口</th><th>計費/時</th><th>優先</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    +'<div style="display:flex;flex-direction:column;gap:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各案場填補率</h3><div class="chart-sm"><canvas id="c1a"></canvas></div></div>'
      +'<div class="sig"><h3 style="margin:0 0 10px;font-size:14px;font-weight:800"><span class="material-symbols-outlined" style="color:var(--accent)">priority_high</span> 待補缺口 TOP</h3>'
        +gapRow("板橋展覽中心","活動日 · 不限","缺 6","p-bad")
        +gapRow("桃園龜山廠","小夜 · 食品衛生","缺 6","p-bad")
        +gapRow("五股物流中心","夜班 · 堆高機證","缺 3","p-warn")
      +'</div>'
    +'</div>'
  +'</div>';
}
function gapRow(n,d,g,c){
  return '<div class="stat-row"><span class="dot" style="background:var(--accent)"></span><div style="flex:1"><b>'+n+'</b><div style="font-size:11.5px;color:var(--muted)">'+d+'</div></div><span class="pill '+c+'">'+g+'</span></div>';
}
function c1(){
  chart=new Chart(el("c1a"),{type:"bar",data:{labels:["信義","五股","松山","龜山","汐止","板橋"],
    datasets:[{label:"填補率%",data:[100,85,100,60,88,40],
      backgroundColor:["#16a34a","#8b5cf6","#16a34a","#dc2626","#8b5cf6","#dc2626"],borderRadius:6,maxBarThickness:34}]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,max:100,ticks:{callback:function(v){return v+"%";}}}}}});
}

function s2(){
  var board=[
    {h:"需求待派",items:[
      {t:"板橋展覽中心 · 活動接待 x6",m:["8/15 08:00","不限資格"]},
      {t:"龜山廠 · 包裝作業 x6",m:["小夜班","食品衛生"]}
    ]},
    {h:"資格媒合中",items:[
      {t:"五股物流 · 堆高機 x3",m:["候選 5 人","衝突檢核"]},
      {t:"汐止園區 · 清潔 x1",m:["候選 3 人","距離排序"]}
    ]},
    {h:"派工單已發",items:[
      {t:"信義大樓 · 保全 x2",m:["陳建志 等","待確認"]},
      {t:"松山商辦 · 接待 x1",m:["蔡雅婷","待確認"]}
    ]},
    {h:"到班確認",items:[
      {t:"信義大樓 · 保全 x10",m:["全數到班","09:00"]},
      {t:"松山商辦 · 接待 x6",m:["全數到班","08:30"]}
    ]}
  ];
  var cols=board.map(function(col){
    var tk=col.items.map(function(it){
      var meta=it.m.map(function(m){return '<span><span class="material-symbols-outlined" style="font-size:13px">chevron_right</span>'+m+'</span>';}).join("");
      return '<div class="ticket"><b>'+it.t+'</b><div class="meta">'+meta+'</div></div>';
    }).join("");
    return '<div class="col"><div class="col-h">'+col.h+'<span class="cnt">'+col.items.length+'</span></div>'+tk+'</div>';
  }).join("");

function show(i){
  var sc=SCREENS[i]; if(!sc) return;
  destroyChart();
  var view=el("view");
  view.innerHTML='<div class="page-head"><div><h1>'+sc.t+'</h1><p>'+sc.p+'</p></div>'
    +'<div class="tag"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>即時營運</div></div>'
    +sc.render();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
  void view.offsetHeight;
  if(sc.chart){ try{ sc.chart(); }catch(e){} }
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
