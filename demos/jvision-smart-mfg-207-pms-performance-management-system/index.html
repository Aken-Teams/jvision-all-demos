<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>績效考核管理系統 PMS</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-soft:#dcfce7;
  --ink:#0f2417; --muted:#5c7267; --line:#e3ebe5; --bg:#f4f8f5; --card:#ffffff;
  --amber:#d97706; --red:#dc2626; --blue:#2563eb; --slate:#475569;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh;min-width:0}
.side{width:250px;background:linear-gradient(180deg,#0d3d24,#0a2e1b);color:#e7f4ec;display:flex;flex-direction:column;flex:none;min-width:0}
.brand{padding:20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;margin:2px 0 0;color:#9fd3b4;font-weight:500}
.nav{display:flex;flex-direction:column;padding:12px 10px;gap:3px;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;background:transparent;color:#c8e6d3;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),#15803d);color:#fff;box-shadow:0 6px 16px -6px rgba(22,163,74,.7)}
.nav .navtxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#8fc6a5;line-height:1.6}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.topbar .tt{min-width:0}
.topbar h2{font-size:18px;margin:0;font-weight:800}
.topbar p{font-size:12.5px;margin:3px 0 0;color:var(--muted)}
.cyc{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-soft);color:#15803d}
.pill.amber{background:#fef3c7;color:#b45309}
.pill.blue{background:#dbeafe;color:#1d4ed8}
.wrap{padding:22px 26px 40px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;min-width:0}
.card h3{font-size:14px;margin:0 0 3px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 13px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;position:relative;overflow:hidden;min-width:0}
.kpi .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.kpi .ic .material-symbols-outlined{font-size:22px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin:3px 0 2px;letter-spacing:-.5px}
.kpi .dt{font-size:11.5px;font-weight:700}
.up{color:var(--accent)} .dn{color:var(--red)}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:11px;border-bottom:1px solid #eef3ef;vertical-align:middle}
tr:last-child td{border-bottom:0}
.tbx{overflow-x:auto;min-width:0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-gn{background:var(--accent-soft);color:#15803d}
.t-am{background:#fef3c7;color:#b45309}
.t-rd{background:#fee2e2;color:#b91c1c}
.t-bl{background:#dbeafe;color:#1d4ed8}
.t-gy{background:#eef2f0;color:var(--slate)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .nm{font-weight:700;font-size:13px;line-height:1.2}
.who .rl{font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#eef3ef;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mini{font-size:11px;color:var(--muted)}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;min-width:0}
.split>*{min-width:0}
.listpane{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.listpane .lh{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.listpane .lh .material-symbols-outlined{font-size:19px;color:var(--accent)}
.litem{padding:13px 15px;border-bottom:1px solid #eef3ef;cursor:pointer;display:flex;gap:11px;align-items:center;min-width:0;transition:.12s}
.litem:hover{background:#f6faf7}
.litem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.litem .meta{min-width:0;flex:1}
.litem .meta .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem .meta .sm{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detpane{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px 20px;min-width:0}
.dhead{display:flex;align-items:center;gap:13px;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;min-width:0}
.dhead .big{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex:none}
.dhead .nm{font-size:17px;font-weight:800}
.dhead .rl{font-size:12.5px;color:var(--muted)}
.okr{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:11px}
.okr .obj{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;flex-wrap:wrap}
.okr .obj .material-symbols-outlined{color:var(--accent);font-size:20px}
.kr{display:flex;align-items:center;gap:10px;margin-top:11px;padding-left:6px;flex-wrap:wrap}
.kr .krn{flex:1;min-width:0;font-size:12.5px}
.kr .krn small{color:var(--muted);display:block;font-size:11px;margin-top:2px}
.pct{font-weight:800;font-size:13px;min-width:42px;text-align:right}
.crit{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px}
.crit .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crit .cn{font-weight:700;font-size:13.5px}
.crit .cw{font-size:11px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:22px;border-radius:6px;background:#eef3ef;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.dots i.f{background:var(--accent);color:#fff}
.crit .cd{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.fb{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px}
.fb .fh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.fb .qt{font-size:12.5px;line-height:1.6;color:#33463b;background:#f6faf7;border-left:3px solid var(--accent2);padding:9px 12px;border-radius:0 8px 8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:#15803d}
.ninebox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;min-width:0}
.ninebox .cell{border-radius:10px;padding:11px 12px;min-height:96px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ninebox .cl{font-size:11px;font-weight:800;opacity:.9}
.ninebox .cell .ppl{display:flex;flex-wrap:wrap;gap:4px}
.ninebox .cell .ppl span{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:6px;color:#1f2937}
.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-20px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent)}
.tl.g .dot{background:var(--slate);box-shadow:0 0 0 1px var(--slate)}
.tl .tt2{font-weight:700;font-size:13px}
.tl .td2{font-size:11.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{background:#f6faf7;border:1px dashed var(--accent2);border-radius:11px;padding:12px 14px;font-size:12px;color:#33463b;line-height:1.6}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex-direction:row;align-items:center;flex-wrap:wrap}
  .brand{border-bottom:0;flex:1}
  .nav{flex-direction:row;flex-wrap:wrap;overflow-x:auto;flex:1 0 100%;padding:8px 10px}
  .nav button{width:auto;flex:none}
  .side .foot{display:none}
  .split{grid-template-columns:1fr}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .ninebox{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav .navtxt{display:none}
  .nav button{padding:10px 12px}
  .wrap{padding:16px 14px 34px}
  .topbar{padding:13px 15px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div>
        <h1>PMS 績效考核</h1>
        <p>Performance Mgmt System</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">2026 上半年度考核週期<br/>資料為展示用途 · 假資料</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scTitle">績效總覽</h2>
        <p id="scSub">考核週期進度與完成率儀表板</p>
      </div>
      <div class="cyc">
        <span class="pill blue"><span class="material-symbols-outlined" style="font-size:15px">calendar_month</span>2026 H1</span>
        <span class="pill"><span class="material-symbols-outlined" style="font-size:15px">groups</span>受評 342 人</span>
        <span class="pill amber"><span class="material-symbols-outlined" style="font-size:15px">schedule</span>校準前 6 天</span>
      </div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>

<script>
var MODS=[
  {icon:"dashboard",name:"績效總覽",sub:"考核週期進度與完成率儀表板"},
  {icon:"account_tree",name:"目標與OKR",sub:"KPI/OKR目標設定與權重對齊"},
  {icon:"fact_check",name:"考核評分",sub:"自評與主管評核雙向評分表單"},
  {icon:"groups",name:"360度回饋",sub:"同儕與跨部門多來源評語彙整"},
  {icon:"insights",name:"校準會議",sub:"結果分佈校準與九宮格人才盤點"},
  {icon:"trending_up",name:"結果與獎酬",sub:"評等發佈與調薪獎金連結"}
];

var EMP=[
  {id:"E-2041",nm:"林品瑄",rl:"產品行銷 · 資深專員",dept:"行銷部",self:88,mgr:0,st:"待主管評核",stc:"t-am"},
  {id:"E-2088",nm:"陳冠廷",rl:"後端工程師",dept:"研發部",self:82,mgr:86,st:"已完成評核",stc:"t-gn"},
  {id:"E-2103",nm:"黃詩涵",rl:"客戶成功經理",dept:"客戶成功",self:91,mgr:89,st:"已完成評核",stc:"t-gn"},
  {id:"E-2119",nm:"吳承恩",rl:"財務會計",dept:"財務部",self:0,mgr:0,st:"自評未送出",stc:"t-rd"},
  {id:"E-2150",nm:"張雅筑",rl:"UI/UX 設計師",dept:"研發部",self:79,mgr:77,st:"已完成評核",stc:"t-gn"},
  {id:"E-2176",nm:"劉柏宇",rl:"業務代表",dept:"業務部",self:85,mgr:0,st:"待主管評核",stc:"t-am"},
  {id:"E-2198",nm:"周宜蓁",rl:"人資專員",dept:"人資部",self:80,mgr:81,st:"已完成評核",stc:"t-gn"},
  {id:"E-2210",nm:"許志明",rl:"營運分析師",dept:"營運部",self:0,mgr:0,st:"目標校準中",stc:"t-bl"}
];

var nav=document.getElementById("nav");
MODS.forEach(function(m,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="navtxt">'+m.name+'</span>';
  b.addEventListener("click",function(){location.hash="go="+i;});
  nav.appendChild(b);
});

var view=document.getElementById("view");
var charts=[];
function clearCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
var AX={fontFamily:'"Noto Sans TC",Inter,sans-serif'};

/* ============ SCREEN 0 : 績效總覽 ============ */
function s0(){
  var kpis=[
    {ic:"task_alt",lab:"考核完成率",val:"71%",dt:"+18% 較上週",cls:"up"},
    {ic:"pending_actions",lab:"待主管評核",val:"84",dt:"件 · 需 6 天內完成",cls:"dn"},
    {ic:"grade",lab:"平均績效分數",val:"83.4",dt:"+1.6 較上期",cls:"up"},
    {ic:"groups",lab:"360回饋回收率",val:"88%",dt:"1,204 / 1,368 份",cls:"up"}
  ];
  var kh=kpis.map(function(k){return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="lab">'+k.lab+'</div><div class="val">'+k.val+'</div><div class="dt '+k.cls+'">'+k.dt+'</div></div>';}).join("");
  var deptRows=[
    ["研發部",96,"98 人","A- 平均"],["業務部",58,"64 人","B+ 平均"],["行銷部",72,"41 人","A 平均"],
    ["客戶成功",81,"36 人","A 平均"],["財務部",45,"28 人","B 平均"],["營運部",63,"39 人","B+ 平均"],["人資部",90,"20 人","A- 平均"]
  ];
  var dt=deptRows.map(function(r){var c=r[1]>=80?"var(--accent)":r[1]>=60?"#d97706":"#dc2626";
    return '<tr><td style="font-weight:700">'+r[0]+'</td><td class="mini">'+r[2]+'</td><td style="min-width:120px"><div class="bar"><i style="width:'+r[1]+'%;background:'+c+'"></i></div></td><td style="font-weight:800;color:'+c+'">'+r[1]+'%</td><td class="mini">'+r[3]+'</td></tr>';}).join("");
  view.innerHTML=
    '<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>各階段作業進度</h3><p class="sub">2026 上半年度考核週期 · 六階段流轉件數</p><div id="c0a" class="chart"></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>評等分佈</h3><p class="sub">已完成評核之最終評等佔比</p><div id="c0b" class="chart"></div></div>'+
    '</div>'+
    '<div class="grid g32">'+
      '<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>週期時程</h3><p class="sub">關鍵里程碑</p>'+
        '<div class="timeline">'+
          '<div class="tl"><div class="dot"></div><div class="tt2">目標設定 · 已完成</div><div class="td2">01/06 – 01/24 · 342/342 完成</div></div>'+
          '<div class="tl"><div class="dot"></div><div class="tt2">自評填寫 · 已完成</div><div class="td2">06/01 – 06/12 · 328 已送出</div></div>'+
          '<div class="tl"><div class="dot"></div><div class="tt2">360度回饋 · 進行中</div><div class="td2">06/08 – 06/18 · 回收率 88%</div></div>'+
          '<div class="tl g"><div class="dot"></div><div class="tt2">主管評核 · 待完成</div><div class="td2">06/13 – 06/22 · 84 件待評</div></div>'+
          '<div class="tl g"><div class="dot"></div><div class="tt2">校準會議 · 排定</div><div class="td2">06/25 · 各級主管出席</div></div>'+
          '<div class="tl g"><div class="dot"></div><div class="tt2">結果發佈 · 排定</div><div class="td2">07/01 · 連結調薪獎金</div></div>'+
        '</div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">apartment</span>各部門完成率</h3><p class="sub">部門主管可下鑽至個人考核表</p><div class="tbx"><table style="min-width:420px"><thead><tr><th>部門</th><th>人數</th><th>進度</th><th>完成率</th><th>結果</th></tr></thead><tbody>'+dt+'</tbody></table></div></div>'+
    '</div>';
  void view.offsetHeight;
  var c=mk("c0a");
  if(c)c.setOption({textStyle:AX,grid:{left:38,right:14,top:24,bottom:26},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["目標設定","自評填寫","360回饋","主管評核","校準","結果發佈"],axisLabel:{color:"#5c7267",fontSize:11}},

  var r=RES[cur];
  var dev=r.dev.map(function(d){return '<div class="tl"><div class="dot"></div><div class="tt2">'+d+'</div></div>';}).join("");
  var grades=["C","B","B+","A","A+"];

      '<div class="listpane"><div class="lh"><span class="material-symbols-outlined">trending_up</span>已核定結果</div>'+items+'</div>'+

        '<div class="dhead"><div class="big" style="background:linear-gradient(135deg,#15803d,#16a34a)">'+r.grade+'</div><div style="flex:1;min-width:0"><div class="nm">'+e.nm+'</div><div class="rl">'+e.dept+' · '+e.rl+'</div></div><span class="pill">已發佈 · 07/01</span></div>'+

          '<div class="card"><h3><span class="material-symbols-outlined">rocket_launch</span>個人發展計畫 (IDP)</h3><p class="sub">下一週期發展重點</p><div class="timeline" style="margin-top:6px">'+dev+'</div></div>'+
        '</div>'+
        '<div class="note" style="margin-top:14px"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;color:var(--accent)">verified</span> 結果已同步至 HRIS 與薪資系統，並歸檔至員工績效歷程，供下期回顧與稽核。</div>'+
      '</div>'+
    '</div>';
  bindList(s5);

  if(c)c.setOption({textStyle:AX,tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{color:"#5c7267"}},grid:{left:34,right:16,top:18,bottom:40},
    xAxis:{type:"category",data:grades,axisLabel:{color:"#5c7267"}},

    series:[
      {name:"調薪 %",type:"bar",data:[0,2,3.5,5,7],itemStyle:{color:"#16a34a",borderRadius:[5,5,0,0]},barWidth:"42%",
        markPoint:{data:[{name:"本人",xAxis:grades.indexOf(r.grade),yAxis:r.raise,itemStyle:{color:"#d97706"}}],symbolSize:14}},
      {name:"獎金倍數",type:"line",data:[0.5,1,1.2,1.8,2.4],smooth:true,lineStyle:{color:"#d97706",width:3},itemStyle:{color:"#d97706"}}
    ]});

function bindList(fn){
  var els=view.querySelectorAll("[data-emp]");
  els.forEach(function(el){el.addEventListener("click",function(){clearCharts();fn(el.getAttribute("data-emp"));});});
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  clearCharts();
  document.querySelectorAll("#nav button").forEach(function(b,bi){b.classList.toggle("on",bi===i);});
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].sub;
  SCREENS[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
