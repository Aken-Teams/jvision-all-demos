<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>績效考核管理系統 PMS</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --amber:#D97706;
  --red:#DC2626;
  --slate:#334155;
  --shadow:7px 7px 0 #134E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%;background:var(--color-background)}
body{
  color:var(--ink);
  font-family:"Crimson Pro",Georgia,"Noto Serif TC",serif;
  font-size:16px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea{font:inherit}
button,[data-emp]{cursor:pointer}
button:focus-visible,[data-emp]:focus-visible,a:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
.app{display:flex;min-height:100vh;min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:20;
  width:272px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  color:#fff;
  background:var(--color-foreground);
  border-right:4px solid #000
}
.brand{
  min-height:105px;
  padding:20px 18px;
  display:flex;
  align-items:center;
  gap:13px;
  background:var(--color-primary);
  color:#000;
  border-bottom:4px solid #000
}
.logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  background:var(--color-accent);
  border:3px solid #000;
  box-shadow:4px 4px 0 #000
}
.logo .material-symbols-outlined{font-size:27px}
.brand h1{
  margin:0;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em
}
.brand p{margin:4px 0 0;font-size:12px;font-weight:600}
.nav{display:flex;flex-direction:column;padding:18px 14px;gap:8px}
.nav button{
  width:100%;
  min-height:48px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  border:2px solid transparent;
  color:#CCFBF1;
  background:transparent;
  text-align:left;
  font-weight:600;
  transition:background-color .18s,color .18s,transform .18s
}
.nav button:hover{color:#000;background:var(--color-secondary);border-color:#000;transform:translate(-2px,-2px)}
.nav button.on{
  color:#000;
  background:var(--color-accent);
  border-color:#000;
  box-shadow:4px 4px 0 #000
}
.navtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{
  margin-top:auto;
  padding:18px;
  color:#CCFBF1;
  border-top:2px solid var(--color-secondary);
  font-size:12px;
  line-height:1.6
}
.main{flex:1;min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:15;
  min-height:104px;
  padding:18px 30px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  background:rgba(240,253,250,.96);
  border-bottom:4px solid var(--ink)
}
.topbar .tt{min-width:0}
.topbar h2{
  margin:0;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:clamp(22px,2.4vw,34px);
  line-height:1;
  font-weight:600;
  letter-spacing:-.03em
}
.topbar p{margin:7px 0 0;color:var(--muted);font-size:14px;font-weight:600}
.cyc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill,.tag,.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:2px solid currentColor;
  border-radius:0;
  font-weight:700;
  line-height:1
}
.pill{padding:8px 11px;background:#CCFBF1;color:#115E59;font-size:12px}
.pill.blue{background:#CCFBF1;color:#115E59}
.pill.amber{background:#FEF3C7;color:#92400E}
.wrap{padding:28px 30px 52px;min-width:0}
.grid{display:grid;gap:18px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr)}
.g32{grid-template-columns:minmax(290px,1fr) minmax(0,1.5fr)}
.card,.kpi,.listpane,.detpane{
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:var(--shadow)
}
.card{padding:19px 20px}
.card h3{
  margin:0 0 5px;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:15px;
  font-weight:600
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.sub{margin:0 0 14px;color:var(--muted);font-size:12px;font-weight:600}
.kpi{
  position:relative;
  min-height:160px;
  padding:17px;
  overflow:hidden
}
.kpi:after{
  content:"";
  position:absolute;
  width:42px;
  height:42px;
  right:-3px;
  bottom:-3px;
  background:var(--color-secondary);
  border:3px solid var(--ink)
}
.kpi:nth-child(2n):after{background:var(--color-accent)}
.kpi .ic{
  width:42px;
  height:42px;
  margin-bottom:13px;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid #000
}
.kpi .lab{color:var(--muted);font-size:13px;font-weight:700}
.kpi .val{
  margin:3px 0;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:29px;
  line-height:1.1;
  font-weight:600;
  font-variant-numeric:tabular-nums
}
.kpi .dt{font-size:12px;font-weight:700}
.up{color:#08786F}
.dn{color:var(--red)}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}
.tbx{overflow:auto;min-width:0;border:2px solid var(--ink)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
th{
  padding:10px 11px;
  color:#fff;
  background:var(--ink);
  border-right:1px solid var(--color-secondary);
  text-align:left;
  white-space:nowrap;
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em
}
td{padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:#F0FDFA}
tbody tr:hover{background:#CCFBF1}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td[style*="font-weight:800"]{text-align:right}
.tag{padding:5px 8px;font-size:11px}
.t-gn{color:#065F46;background:#D1FAE5}
.t-am{color:#92400E;background:#FEF3C7}
.t-rd{color:#991B1B;background:#FEE2E2}
.t-bl{color:#115E59;background:#CCFBF1}
.t-gy{color:#334155;background:#E2E8F0}
.av,.dhead .big{
  display:grid;
  place-items:center;
  flex:none;
  color:#000;
  background:var(--color-secondary);
  border:2px solid #000;
  font-family:"Cinzel","Crimson Pro",serif;
  font-weight:600
}
.av{width:34px;height:34px;font-size:13px}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .nm{font-weight:700}
.who .rl,.mini{color:var(--muted);font-size:12px}
.bar{height:10px;min-width:60px;overflow:hidden;background:var(--color-muted);border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:20px;min-width:0}
.split>*{min-width:0}
.listpane{overflow:hidden;align-self:start}
.lh{
  padding:14px 15px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  background:var(--ink);
  border-bottom:3px solid var(--ink);
  font-weight:700
}
.lh .material-symbols-outlined{color:var(--color-secondary)}
.litem{
  min-height:60px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:2px solid var(--line);
  transition:background-color .18s,transform .18s
}
.litem:last-child{border-bottom:0}
.litem:hover{background:#CCFBF1}
.litem.on{color:#000;background:var(--color-accent);box-shadow:inset 8px 0 0 #000}
.litem .meta{flex:1;min-width:0}
.litem .meta .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.litem .meta .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.detpane{padding:20px}
.dhead{
  margin:-20px -20px 20px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  background:#CCFBF1;
  border-bottom:3px solid var(--ink)
}
.dhead .big{width:54px;height:54px;font-size:20px;box-shadow:4px 4px 0 #000}
.dhead .nm{font-size:20px;font-weight:700}
.dhead .rl{color:var(--muted);font-size:13px;font-weight:600}
.okr,.crit,.fb{
  margin-bottom:13px;
  padding:14px 15px;
  border:2px solid var(--ink);
  background:#fff
}
.okr:nth-child(even),.crit:nth-child(even){background:#F0FDFA}
.okr .obj{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.okr .obj .material-symbols-outlined{color:var(--color-primary)}
.kr{display:flex;align-items:center;gap:10px;margin-top:12px;padding-left:7px;flex-wrap:wrap}
.krn{flex:1;min-width:180px;font-size:13px;font-weight:600}
.krn small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.pct{min-width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.crit .ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.crit .cn{font-weight:700}
.crit .cw{color:var(--muted);font-size:12px}
.dots{display:flex;gap:5px}
.dots i{
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  color:var(--muted);
  background:var(--color-muted);
  border:1px solid var(--ink);
  font-style:normal;
  font-weight:700;
  font-size:11px
}
.dots i.f{color:#000;background:var(--color-secondary)}
.crit .cd{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.55}
.fb .fh{display:flex;gap:10px;margin-bottom:9px}
.fb .qt{
  padding:10px 12px;
  color:#1E3A3A;
  background:#F0FDFA;
  border-left:6px solid var(--color-primary);
  font-size:13px;
  line-height:1.6
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 8px;color:#115E59;background:#CCFBF1;font-size:11px}
.ninebox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;min-width:0}
.ninebox .cell{
  min-height:98px;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
  border:2px solid var(--ink)!important
}
.ninebox .cl{font-size:12px;font-weight:700}
.ninebox .ppl{display:flex;flex-wrap:wrap;gap:4px}
.ninebox .ppl span{padding:3px 6px;color:#111827;background:rgba(255,255,255,.92);border:1px solid #111827;font-size:11px;font-weight:700}
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl{position:relative;padding-bottom:17px}
.tl:last-child{padding-bottom:0}
.tl .dot{
  position:absolute;
  left:-25px;
  top:1px;
  width:17px;
  height:17px;
  background:var(--color-secondary);
  border:3px solid var(--ink)
}
.tl.g .dot{background:var(--color-muted)}
.tl .tt2{font-weight:700}
.tl .td2{margin-top:2px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:11px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;display:inline-block;border:1px solid var(--ink)}
.note{
  padding:12px 14px;
  color:#1E3A3A;
  background:#CCFBF1;
  border:2px dashed var(--ink);
  font-size:13px;
  line-height:1.6
}
[data-code],.tag,.pill,.pct,.val,.td2{
  font-variant-numeric:tabular-nums
}
@media(max-width:1120px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:900px){
  .app{display:block}
  .side{position:relative;width:100%;height:auto;border-right:0;border-bottom:4px solid #000}
  .brand{min-height:auto}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);padding:10px}
  .side .foot{display:none}
  .topbar{position:relative}
  .split{grid-template-columns:1fr}
  .listpane{display:grid;grid-template-columns:repeat(2,1fr)}
  .listpane .lh{grid-column:1/-1}
}
@media(max-width:768px){
  .wrap{padding:20px 16px 40px}
  .topbar{padding:17px 16px}
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .ninebox{grid-template-columns:1fr}
  .cyc{width:100%;margin-left:0}
}
@media(max-width:480px){
  .nav{grid-template-columns:repeat(3,1fr)}
  .nav button{justify-content:center;padding:10px}
  .navtxt{display:none}
  .listpane{grid-template-columns:1fr}
  .kr .bar{flex-basis:100%!important}
  .card,.detpane{padding:15px}
  .dhead{margin:-15px -15px 16px;padding:15px}
  .kpi{min-height:145px}
}
@media(prefers-reduced-motion:no-preference){
  .grid>*{animation:arrive .4s both}
  .grid>*:nth-child(2){animation-delay:.06s}
  .grid>*:nth-child(3){animation-delay:.12s}
  .grid>*:nth-child(4){animation-delay:.18s}
  .grid>*:nth-child(5){animation-delay:.24s}
  .grid>*:nth-child(6){animation-delay:.3s}
  @keyframes arrive{
    from{opacity:0;transform:translateY(16px) scale(.92)}
    to{opacity:1;transform:none}
  }
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div><h1>PMS 績效考核</h1><p>Performance Mgmt System</p></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot">2026 上半年度考核週期<br>資料為展示用途 · 假資料</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="tt"><h2 id="scTitle">績效總覽</h2><p id="scSub">考核週期進度與完成率儀表板</p></div>
      <div class="cyc">
        <span class="pill blue"><span class="material-symbols-outlined">calendar_month</span>2026 H1</span>
        <span class="pill"><span class="material-symbols-outlined">groups</span>受評 342 人</span>
        <span class="pill amber"><span class="material-symbols-outlined">schedule</span>校準前 6 天</span>
      </div>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
var MODS=[
 {icon:"dashboard",name:"績效總覽",sub:"考核週期進度與完成率儀表板"},
 {icon:"account_tree",name:"目標與OKR",sub:"KPI/OKR目標設定與權重對齊"},
 {icon:"fact_check",name:"考核評分",sub:"自評與主管評核雙向評分表單"},
 {icon:"groups",name:"360度回饋",sub:"同儕與跨部門多來源評語彙整"},
 {icon:"insights",name:"校準會議",sub:"結果分佈校準與九宮格人才盤點"},
 {icon:"trending_up",name:"結果與獎酬",sub:"評等發佈與調薪獎金連結"}
];
var EMP=[
 {id:"E-2041",nm:"林品瑄",rl:"產品行銷 · 資深專員",dept:"行銷部",self:88,mgr:0,st:"待主管評核",stc:"t-am"},
 {id:"E-2088",nm:"陳冠廷",rl:"後端工程師",dept:"研發部",self:82,mgr:86,st:"已完成評核",stc:"t-gn"},
 {id:"E-2103",nm:"黃詩涵",rl:"客戶成功經理",dept:"客戶成功",self:91,mgr:89,st:"已完成評核",stc:"t-gn"},
 {id:"E-2119",nm:"吳承恩",rl:"財務會計",dept:"財務部",self:0,mgr:0,st:"自評未送出",stc:"t-rd"},
 {id:"E-2150",nm:"張雅筑",rl:"UI/UX 設計師",dept:"研發部",self:79,mgr:77,st:"已完成評核",stc:"t-gn"},
 {id:"E-2176",nm:"劉柏宇",rl:"業務代表",dept:"業務部",self:85,mgr:0,st:"待主管評核",stc:"t-am"},
 {id:"E-2198",nm:"周宜蓁",rl:"人資專員",dept:"人資部",self:80,mgr:81,st:"已完成評核",stc:"t-gn"},
 {id:"E-2210",nm:"許志明",rl:"營運分析師",dept:"營運部",self:0,mgr:0,st:"目標校準中",stc:"t-bl"}
];
var nav=document.getElementById("nav"),view=document.getElementById("view"),charts=[];
MODS.forEach(function(m,i){
 var b=document.createElement("button");
 b.type="button";b.dataset.i=i;b.setAttribute("aria-label",m.name);
 b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="navtxt">'+m.name+'</span>';
 b.onclick=function(){location.hash="go="+i};nav.appendChild(b)
});
function clearCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c}
var AX={fontFamily:'"Crimson Pro",Georgia,serif'},TEAL="#0D9488",MINT="#2DD4BF",AMBER="#D97706",INK="#134E4A",MUTED="#475569",LINE="#5EEAD4";
function chartBase(){return{textStyle:AX,animation:!matchMedia("(prefers-reduced-motion: reduce)").matches}}
function merge(a,b){Object.keys(b).forEach(function(k){a[k]=b[k]});return a}
function personList(pool,cur,extra){
 return pool.map(function(e){
  return '<div class="litem'+(e.id===cur?" on":"")+'" data-emp="'+e.id+'" tabindex="0" role="button"><span class="av">'+e.nm.slice(0,1)+'</span><div class="meta"><div class="nm">'+e.nm+'</div><div class="sm">'+(extra?extra(e):e.dept+" · "+e.rl)+'</div></div></div>'
 }).join("")
}
function bindList(fn){
 view.querySelectorAll("[data-emp]").forEach(function(el){
  function go(){clearCharts();fn(el.dataset.emp)}
  el.onclick=go;el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}
 })
}
function s0(){
 var k=[
  ["task_alt","考核完成率","71%","+18% 較上週","up"],
