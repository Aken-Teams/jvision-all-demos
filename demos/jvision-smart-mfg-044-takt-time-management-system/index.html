<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>節拍時間管理系統（Takt Time Management System）</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化 — Takt Time 純 UI 展示"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#1d4ed8; --accent2:#60a5fa; --bg:#f1f5f9; --panel:#ffffff;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --side:#0b1a3a; --side2:#12234d;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:246px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#dbe4f5;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{display:block;font-size:14px;color:#fff;font-weight:700;line-height:1.3}
.brand span{font-size:11px;color:#8ea3c9}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#c2cfe8;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;min-width:0}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.4)}
.sidefoot{margin-top:auto;padding:14px 10px 4px;font-size:11px;color:#7c8fb5;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .spacer{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:#eef4ff;color:var(--accent);border:1px solid #d6e3ff;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.wrap{padding:22px 26px 40px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px;min-width:0}
.ch .material-symbols-outlined{font-size:20px;color:var(--accent)}
.ch h3{font-size:14.5px;margin:0;font-weight:700}
.ch .cd{font-size:11.5px;color:var(--muted);margin-top:1px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;position:relative;overflow:hidden}
.kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#eef4ff;color:var(--accent);margin-bottom:12px}
.kpi .ic .material-symbols-outlined{font-size:22px}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:500}
.kpi .vl{font-size:26px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.kpi .vl small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .dl{font-size:11.5px;margin-top:7px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.kpi .dl.up{color:var(--ok)} .kpi .dl.down{color:var(--bad)} .kpi .dl.neu{color:var(--muted)}
.chart{width:100%;height:300px;min-width:0}
.chart.sm{height:250px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:#f8fafc;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:#f8fbff}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.tag.g{background:#dcfce7;color:#15803d} .tag.y{background:#fef3c7;color:#b45309}
.tag.r{background:#fee2e2;color:#b91c1c} .tag.b{background:#dbeafe;color:#1d4ed8} .tag.s{background:#e2e8f0;color:#475569}
.bar{height:8px;border-radius:99px;background:#eef2f7;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px}
.mono{font-variant-numeric:tabular-nums}
.formula{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#f8fafc;border:1px dashed #c7d6f0;border-radius:13px;padding:18px}
.fbox{text-align:center;min-width:0}
.fbox .fn{font-size:11px;color:var(--muted);font-weight:600}
.fbox .fv{font-size:19px;font-weight:800;color:var(--accent);margin-top:3px}
.fbox .fv small{font-size:11px;color:var(--muted);font-weight:600}
.fop{font-size:22px;color:#94a3b8;font-weight:800}
.feq{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;border-radius:12px;padding:12px 18px;text-align:center}
.feq .fv{color:#fff;font-size:24px}
.feq .fn{color:#c9dbff}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.board{overflow-x:auto}
.rhythm{display:grid;grid-template-columns:130px repeat(9,1fr);gap:5px;min-width:760px}
.rc{border-radius:8px;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:700;min-width:0}
.rc.hd{background:#0b1a3a;color:#dbe4f5;font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center}
.rc.lbl{background:#f1f5f9;color:var(--ink);text-align:left;padding-left:12px;display:flex;flex-direction:column;justify-content:center;font-size:12.5px}
.rc.lbl small{font-weight:500;color:var(--muted)}
.rc .n{font-size:14px}
.rc .s{font-size:9.5px;font-weight:600;opacity:.85}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px 8px}
.tli:before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tli.r:before{background:var(--bad)} .tli.y:before{background:var(--warn)} .tli.g:before{background:var(--ok)} .tli.b:before{background:var(--accent)}
.tli .tt{font-size:13.5px;font-weight:700}
.tli .tx{font-size:12.5px;color:#334155;line-height:1.5;margin-top:3px}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-width:0}
.kbcol{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}
.kbcol .kbh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px;padding:0 2px}
.kbcol .cnt{background:#e2e8f0;color:#475569;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700}
.kbcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px}
.kbcard .kt{font-size:12.5px;font-weight:700}
.kbcard .kd{font-size:11.5px;color:var(--muted);margin:4px 0 7px;line-height:1.45}
.kbcard .km{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:#475569}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.stat-row:last-child{border-bottom:0}
.stat-row .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-row .vv{font-weight:800;min-width:0}
@media(max-width:860px){
  .app{display:block}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:6px}
  .brand{padding:0 14px 0 4px;border-right:1px solid rgba(255,255,255,.1);margin-right:6px}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;gap:6px;flex:1;min-width:0}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:8px 12px}
  .sidefoot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12,.kb{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .t{display:none}
  .nav button{padding:9px 11px}
  .wrap{padding:16px 14px 34px}
  .top{padding:14px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">avg_pace</span></div>
      <div>
        <b>節拍時間管理</b>
        <span>Takt Time MES</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">純 UI 展示・擬真資料<br/>© JVISION Smart-MFG 044</div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="scTitle">節拍計算</h1>
        <div class="sub" id="scSub">依可用工時與客戶需求量自動推算 Takt Time</div>
      </div>
      <div class="spacer"></div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px">factory</span>第二廠・SMT 組裝線</div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px">schedule</span>2026-08-14 早班</div>
    </header>
    <main class="wrap"><div id="screen"></div></main>
  </div>
</div>
<script>
(function(){
"use strict";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}

var MODS=[
  {icon:"calculate",name:"節拍計算",desc:"依可用工時與客戶需求量自動推算 Takt Time"},
  {icon:"timeline",name:"週期比對",desc:"實際生產週期 (Cycle Time) 與節拍即時對比"},
  {icon:"linear_scale",name:"產線平衡",desc:"各工站作業時間與節拍線的山積平衡分析"},
  {icon:"notification_important",name:"偏離告警",desc:"超節拍、落後產出的即時預警與升級"},
  {icon:"conveyor_belt",name:"節奏看板",desc:"各產線目標／實際產出的節拍達成看板"},
  {icon:"tips_and_updates",name:"節拍對策",desc:"瓶頸工站辨識與節拍調整改善建議"}
];

/* SCREEN 0: 節拍計算 */
function s0(){
  return ''+
  '<div class="grid g4">'+
    kpi("timer","目標 Takt Time","51.1","秒/件","up","符合需求節奏")+
    kpi("inventory_2","今日需求量","528","件","neu","客戶排程 M-2208")+
    kpi("work_history","可用工時","450","分鐘","neu","早班・扣休息 30 分")+
    kpi("percent","節拍達成率","94.3","%","up","+2.1% 週對比")+
  '</div>'+
  '<div class="grid g21" style="margin-top:16px">'+
    '<div class="card">'+
      ch("calculate","Takt Time 計算式","可用生產時間 ÷ 客戶需求量")+
      '<div class="formula">'+
        fbox("可用生產時間","27,000","秒")+
        '<div class="fop">÷</div>'+
        fbox("客戶需求量","528","件")+
        '<div class="fop">=</div>'+
        '<div class="feq"><div class="fn">目標 Takt Time</div><div class="fv">51.1<small> 秒/件</small></div></div>'+
      '</div>'+
      '<div class="note">目前實際節拍 54.5 秒/件（含換線與微停），落後目標 3.4 秒，需檢視插件工站 ST-04。</div>'+
      '<div style="margin-top:16px"><div id="c0a" class="chart sm"></div></div>'+
    '</div>'+
    '<div class="card">'+
      ch("view_list","各產線節拍設定","6 條產線")+
      '<div style="overflow-x:auto">'+
      '<table><thead><tr><th>產線</th><th>需求量</th><th>目標</th><th>實際</th><th>狀態</th></tr></thead><tbody>'+
      taktRow("SMT-A","528 件","51.1s","54.5s","y","偏離")+
      taktRow("SMT-B","480 件","56.3s","55.8s","g","達標")+
      taktRow("插件-A","312 件","86.5s","91.2s","r","瓶頸")+
      taktRow("測試線","640 件","42.2s","41.0s","g","達標")+
      taktRow("組裝-A","400 件","67.5s","66.9s","g","達標")+
      taktRow("包裝線","720 件","37.5s","39.8s","y","偏離")+
      '</tbody></table></div>'+
    '</div>'+
  '</div>';
}
function taktRow(a,b,c,d,st,lb){
  return '<tr><td><b>'+a+'</b></td><td class="mono">'+b+'</td><td class="mono">'+c+'</td><td class="mono"><b>'+d+'</b></td><td><span class="tag '+st+'">'+lb+'</span></td></tr>';
}
function c0init(){
  mk("c0a",{
    tooltip:{trigger:"axis"},
    legend:{data:["目標節拍","實際節拍"],bottom:0,textStyle:{fontSize:11}},
    grid:{left:44,right:16,top:20,bottom:44},
    xAxis:{type:"category",data:["08","09","10","11","12","13","14"],axisLabel:{fontSize:11}},
    yAxis:{type:"value",name:"秒/件",min:40,max:70,axisLabel:{fontSize:11}},
    series:[
      {name:"目標節拍",type:"line",data:[51.1,51.1,51.1,51.1,51.1,51.1,51.1],lineStyle:{type:"dashed",color:"#60a5fa",width:2},symbol:"none",color:"#60a5fa"},
      {name:"實際節拍",type:"line",data:[53.2,54.8,56.1,55.0,54.5,53.9,54.5],smooth:true,areaStyle:{opacity:.12},color:"#1d4ed8",lineStyle:{width:3}}
    ]
  });
}

/* SCREEN 1: 週期比對 */
function s1(){
  return ''+
  '<div class="grid g4">'+
    kpi("timeline","平均 Cycle Time","54.5","秒","neu","目標 51.1 秒")+
    kpi("trending_up","超節拍拍次","7","/ 42","down","占 16.7%")+
    kpi("show_chart","製程 Cpk","1.08","","down","<1.33 需改善")+
    kpi("bolt","最大偏離","+6.2","秒","down","第 11 拍")+
  '</div>'+
  '<div class="grid g21" style="margin-top:16px">'+
    '<div class="card">'+
      ch("monitoring","Cycle Time 管制圖","實際週期 vs 目標節拍（UCL/LCL）")+
      '<div id="c1a" class="chart"></div>'+
      '<div class="legend" style="margin-top:8px"><span><b style="background:#1d4ed8"></b>實際週期</span><span><b style="background:#60a5fa"></b>目標節拍</span><span><b style="background:#dc2626"></b>管制上限</span></div>'+
    '</div>'+
    '<div class="card">'+
      ch("bar_chart","工站週期分佈","各工站實際 vs 目標")+
      '<div id="c1b" class="chart"></div>'+
    '</div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px">'+
    ch("table_rows","超節拍拍次明細","本班採集 42 拍中偏離紀錄")+
    '<div style="overflow-x:auto"><table><thead><tr><th>拍次</th><th>工站</th><th>目標</th><th>實際</th><th>偏離</th><th>推定原因</th><th>狀態</th></tr></thead><tbody>'+
    ctRow("#08","插件-A","86.5s","92.8s","+6.3s","插件對位重工","r","處置中")+
    ctRow("#11","插件-A","86.5s","92.7s","+6.2s","料件供給延遲","r","處置中")+
    ctRow("#19","SMT-A","51.1s","55.4s","+4.3s","貼片校正微停","y","觀察")+
    ctRow("#23","包裝線","37.5s","41.9s","+4.4s","封箱膠帶更換","y","已恢復")+
    ctRow("#31","SMT-A","51.1s","54.2s","+3.1s","首件檢查","s","計畫內")+
    ctRow("#37","插件-A","86.5s","90.1s","+3.6s","作業員交班","y","已恢復")+
    ctRow("#40","SMT-A","51.1s","53.8s","+2.7s","AOI 判定等待","y","觀察")+
    '</tbody></table></div>'+
  '</div>';
}
function ctRow(a,b,c,d,e,f,g){
  return '<tr><td class="mono"><b>'+a+'</b></td><td>'+b+'</td><td class="mono">'+c+'</td><td class="mono"><b>'+d+'</b></td><td class="mono" style="color:#dc2626;font-weight:700">'+e+'</td><td>'+f+'</td><td><span class="tag '+g+'">'+({r:"處置中",y:"觀察",s:"計畫內"}[g]||"已恢復")+'</span></td></tr>';
}
function c1init(){
  var real=[52.1,53.4,55.8,54.2,53.9,55.1,54.6,58.4,53.2,52.9,58.3,54.1,53.5,54.8,55.2,53.1,54.4,52.8,55.4,53.6,54.9];
  var labels=[],ucl=[],takt=[];
  for(var i=0;i<real.length;i++){labels.push("#"+(i+1));ucl.push(57);takt.push(51.1);}
  mk("c1a",{
    tooltip:{trigger:"axis"},
    grid:{left:46,right:18,top:22,bottom:34},
    xAxis:{type:"category",data:labels,axisLabel:{fontSize:10}},
    yAxis:{type:"value",name:"秒",min:45,max:62,axisLabel:{fontSize:11}},
    series:[
      {name:"管制上限",type:"line",data:ucl,lineStyle:{type:"dashed",color:"#dc2626"},symbol:"none",color:"#dc2626"},
      {name:"目標節拍",type:"line",data:takt,lineStyle:{type:"dashed",color:"#60a5fa",width:2},symbol:"none",color:"#60a5fa"},
      {name:"實際週期",type:"line",data:real,color:"#1d4ed8",lineStyle:{width:2.5},symbol:"circle",symbolSize:6,
        markPoint:{data:[{type:"max",name:"最大"}],symbolSize:40,label:{fontSize:10}}}
    ]
  });
  mk("c1b",{
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    legend:{data:["目標","實際"],bottom:0,textStyle:{fontSize:11}},
    grid:{left:46,right:18,top:22,bottom:60},
    xAxis:{type:"category",data:["SMT-A","SMT-B","插件-A","測試","組裝-A","包裝"],axisLabel:{fontSize:10,rotate:20}},
    yAxis:{type:"value",name:"秒",axisLabel:{fontSize:11}},
    series:[
      {name:"目標",type:"bar",data:[51.1,56.3,86.5,42.2,67.5,37.5],color:"#c7d6f0",barGap:"-100%",barWidth:"58%"},
      {name:"實際",type:"bar",data:[54.5,55.8,91.2,41.0,66.9,39.8],color:"#1d4ed8",barWidth:"32%"}
    ]

var SCREENS=[s0,s1,s2,s3,s4,s5];
var INITS=[c0init,c1init,c2init,c3init,c4init,c5init];

function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  disposeCharts();
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].desc;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  void container.offsetHeight;
  INITS[i]();
}

(function buildNav(){
  var nav=document.getElementById("nav");var html="";
  for(var i=0;i<MODS.length;i++){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="t">'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
})();

window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
