<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生產速度與節拍管理系統</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化 — Takt Time 純 UI 展示">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --success:#15803d;
  --warning:#a84600;
  --danger:#dc2626;
  --sidebar:#fff;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;background:var(--color-background)}
body{
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.34);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.mono,.vl,.fv,.vv,.rc .n,td:nth-child(n+3){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  width:240px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  overflow:auto;
  padding:24px 16px 18px;
  color:var(--ink);
  background:var(--sidebar);
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  gap:12px;
  align-items:center;
  padding:0 8px 22px;
  border-bottom:1px solid var(--line);
}
.brand .logo{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  box-shadow:4px 4px 0 #bfdbfe;
}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{
  display:block;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.01em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  letter-spacing:.04em;
}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:22px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 11px;
  overflow:hidden;
  color:var(--muted);
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button::before{
  position:absolute;
  left:0;
  width:3px;
  height:22px;
  background:var(--blue);
  content:"";
  opacity:0;
  transform:scaleY(.4);
  transition:opacity .2s ease,transform .2s ease;
}
.nav button:hover{
  color:var(--blue);
  background:#eff6ff;
  border-color:#dbeafe;
  transform:translateX(2px);
}
.nav button.on{
  color:#1d4ed8;
  font-weight:600;
  background:#eff6ff;
  border-color:#bfdbfe;
}
.nav button.on::before{opacity:1;transform:scaleY(1)}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .t{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.sidefoot{
  margin-top:auto;
  padding:18px 8px 0;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.7;
}
.main{display:flex;flex:1;min-width:0;flex-direction:column}
.top{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:82px;
  padding:15px 28px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.top h1{
  margin:0;
  color:var(--ink);
  font-size:20px;
  font-weight:700;
  letter-spacing:-.025em;
}
.top .sub{margin-top:2px;color:var(--muted);font-size:12px}
.top .spacer{flex:1}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:6px 11px;
  color:#1e40af;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:4px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.wrap{width:100%;max-width:1600px;margin:0 auto;padding:22px 28px 44px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g12{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{
  border-color:#bfdbfe;
  box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 30px rgba(37,99,235,.07);
}
.card{padding:17px}
.card.pad0{padding:0;overflow:hidden}
.kpi{
  position:relative;
  display:grid;
  grid-template-columns:38px minmax(0,1fr);
  grid-template-areas:"ic lb" "ic vl" "dl dl";
  column-gap:12px;
  padding:15px;
  overflow:hidden;
}
.kpi::after{
  position:absolute;
  top:0;
  right:0;
  width:38px;
  height:3px;
  background:var(--blue);
  content:"";
}
.kpi .ic{
  grid-area:ic;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  align-self:start;
  color:var(--blue);
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-radius:4px;
}
.kpi .ic .material-symbols-outlined{font-size:20px}
.kpi .lb{
  grid-area:lb;
  align-self:end;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.kpi .vl{
  grid-area:vl;
  margin-top:1px;
  color:var(--ink);
  font-size:24px;
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.04em;
}
.kpi .vl small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:0;
}
.kpi .dl{
  grid-area:dl;
  display:inline-flex;
  align-items:center;
  gap:4px;
  width:max-content;
  max-width:100%;
  margin-top:11px;
  padding-top:8px;
  border-top:1px solid var(--line);
  font-size:11px;
  font-weight:600;
}
.kpi .dl.up{color:var(--success)}
.kpi .dl.down{color:var(--danger)}
.kpi .dl.neu{color:var(--muted)}
.ch{
  display:flex;
  align-items:flex-start;
  gap:9px;
  min-width:0;
  margin-bottom:13px;
  padding-bottom:11px;
  border-bottom:1px solid var(--line);
}
.ch>.material-symbols-outlined{
  margin-top:1px;
  color:var(--blue);
  font-size:19px;
}
.ch h3{margin:0;color:var(--ink);font-size:14px;font-weight:700}
.ch .cd{margin-top:1px;color:var(--muted);font-size:11px}
.chart{width:100%;height:300px;min-width:0}
.chart.sm{height:250px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{
  height:41px;
  padding:8px 11px;
  text-align:left;
  vertical-align:middle;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#334155;
  background:#f1f5f9;
  border-top:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.035em;
}
td:nth-child(n+3){text-align:right}
th:nth-child(n+3){text-align:right}
th:last-child,td:last-child{text-align:left}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:3px;
  font-family:"Fira Sans",sans-serif;
  font-size:10.5px;
  font-weight:700;
}
.tag::before{
  width:5px;
  height:5px;
  flex:none;
  background:currentColor;
  border-radius:50%;
  content:"";
}
.tag.g{color:#166534;background:#f0fdf4}
.tag.y{color:#92400e;background:#fffbeb}
.tag.r{color:#b91c1c;background:#fef2f2}
.tag.b{color:#1d4ed8;background:#eff6ff}
.tag.s{color:#475569;background:#f1f5f9}
.bar{height:7px;min-width:70px;overflow:hidden;background:#e2e8f0;border-radius:2px}
.bar i{display:block;height:100%;border-radius:2px}
.formula{
  display:flex;
  align-items:center;
  gap:12px;
  padding:17px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:4px;
}
.fbox{min-width:0;text-align:center}
.fbox .fn{color:var(--muted);font-size:10.5px;font-weight:600}
.fbox .fv{margin-top:3px;color:var(--blue);font-size:18px;font-weight:700}
.fbox .fv small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:10px}
.fop{color:#64748b;font-family:"Fira Code",monospace;font-size:20px;font-weight:600}
.feq{
  padding:11px 16px;
  color:#fff;
  text-align:center;
  background:var(--blue);
  border-radius:4px;
  box-shadow:4px 4px 0 #bfdbfe;
}
.feq .fn{color:#dbeafe}
.feq .fv{color:#fff;font-size:22px}
.note{
  margin-top:10px;
  padding:9px 11px;
  color:#334155;
  background:#fff7ed;
  border-left:3px solid var(--color-accent);
  font-size:11px;
  line-height:1.55;
}
.board{overflow-x:auto}
.rhythm{display:grid;grid-template-columns:130px repeat(9,minmax(56px,1fr));gap:4px;min-width:760px}
.rc{
  min-width:0;
  padding:7px 4px;
  color:var(--ink);
  text-align:center;
  border:1px solid rgba(71,85,105,.14);
  border-radius:3px;
  font-size:11px;
  font-weight:700;
}
.rc.hd{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:#1e293b;
  border-color:#1e293b;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.rc.lbl{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-left:11px;
  text-align:left;
  background:#f1f5f9;
  font-size:12px;
}
.rc.lbl small{color:var(--muted);font-size:9.5px;font-weight:500}
.rc .n{font-size:13px}
.rc .s{font-size:9px;font-weight:600;opacity:.88}
.tl{position:relative;padding-left:26px}
.tl::before{
  position:absolute;
  top:4px;
  bottom:4px;
  left:8px;
  width:1px;
  background:var(--line);
  content:"";
}
.tli{position:relative;padding:0 0 18px 8px}
.tli::before{
  position:absolute;
  top:3px;
  left:-22px;
  width:10px;
  height:10px;
  background:#fff;
  border:3px solid currentColor;
  border-radius:50%;
  box-shadow:0 0 0 3px #fff;
  content:"";
}
.tli.r{color:var(--danger)}
.tli.y{color:var(--warning)}
.tli.g{color:var(--success)}
.tli.b{color:var(--blue)}
.tli .tt{color:var(--ink);font-size:12.5px;font-weight:700}
.tli .tx{margin-top:4px;color:#475569;font-size:11.5px;line-height:1.5}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kbcol{
  min-width:0;
  padding:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:4px;
}
.kbcol .kbh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
  padding:0 2px;
  font-size:12px;
  font-weight:700;
}
.kbcol .cnt{
  min-width:22px;
  padding:1px 7px;
  color:#334155;
  text-align:center;
  background:var(--color-muted);
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.kbcard{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:3px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.kbcard:hover{
  border-color:#93c5fd;
  box-shadow:0 6px 16px rgba(37,99,235,.08);
  transform:translateY(-2px);
}
.kbcard .kt{font-size:12px;font-weight:700}
.kbcard .kd{margin:4px 0 7px;color:var(--muted);font-size:10.5px;line-height:1.45}
.kbcard .km{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:#475569;font-size:10px}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
.legend b{
  display:inline-block;
  width:11px;
  height:11px;
  margin-right:5px;
  vertical-align:-2px;
  border:1px solid rgba(15,23,42,.18);
  border-radius:2px;
}
.stat-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:38px;
  padding:7px 0;
  border-bottom:1px solid var(--line);
  font-size:11.5px;
}
.stat-row:last-child{border-bottom:0}
.stat-row .nm{flex:1;min-width:0;font-weight:600}
.stat-row .vv{font-weight:700}
#screen>.grid,#screen>.card{
  animation:screen-in .42s cubic-bezier(.2,.75,.3,1) both;
}
#screen>.grid:nth-child(2),#screen>.card:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3),#screen>.card:nth-child(3){animation-delay:.12s}
@keyframes screen-in{
  from{opacity:0;transform:translateY(12px) scale(.992)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .side{
    position:sticky;
    width:auto;
    height:auto;
    padding:10px 14px;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:center;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand{padding:0 14px 0 0;border:0;border-right:1px solid var(--line)}
  .brand .logo{width:34px;height:34px;box-shadow:3px 3px 0 #bfdbfe}
  .brand span:not(.material-symbols-outlined),.sidefoot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:4px;margin:0}
  .nav button{width:auto;min-height:40px;padding:8px 10px}
  .top{top:59px;padding:13px 18px}
  .wrap{padding:18px}
}
@media(max-width:720px){
  .g2,.g3,.kb{grid-template-columns:1fr}
  .top{align-items:flex-start}
  .top .pill{display:none}
}
@media(max-width:520px){
  .side{align-items:flex-start}
  .brand{width:100%;padding:0 0 9px;border-right:0;border-bottom:1px solid var(--line)}
  .brand span:not(.material-symbols-outlined){display:block}
  .nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:1px}
  .nav button .t{display:none}
  .nav button{flex:none}
  .top{top:104px;min-height:72px;padding:12px 14px}
  .top h1{font-size:18px}
  .wrap{padding:14px 12px 32px}
  .g4{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{grid-template-columns:32px minmax(0,1fr);column-gap:9px;padding:12px}
  .kpi .ic{width:32px;height:32px}
  .kpi .vl{font-size:19px}
  .formula{align-items:stretch;flex-direction:column}
  .fop{height:15px;text-align:center;line-height:15px;transform:rotate(90deg)}
}
@media(max-width:380px){
  .g4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
  #screen>.grid,#screen>.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">avg_pace</span></div>
      <div><b>生產速度與節拍管理系統</b><span>PRODUCTION · TAKT OPS</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="系統功能"></nav>
    <div class="sidefoot">純 UI 展示・擬真資料<br>© JVISION Smart-MFG 044</div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="scTitle">節拍計算</h1>
        <div class="sub" id="scSub">依可用工時與客戶需求量自動推算 Takt Time</div>
      </div>
      <div class="spacer"></div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px">factory</span>第二廠・SMT 組裝線</div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px">schedule</span>2026-08-14 早班</div>
    </header>
    <main class="wrap"><div id="screen"></div></main>
  </div>
</div>
<script>
(function(){
"use strict";
var charts=[];
var C={blue:"#2563eb",blue2:"#3b82f6",pale:"#bfdbfe",red:"#dc2626",orange:"#ea580c",green:"#15803d",grid:"#e2e8f0",text:"#475569"};
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose()}catch(e){}}charts=[]}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  opt.animation=!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  opt.textStyle={fontFamily:"Fira Sans",color:C.text};
  c.setOption(opt);
  charts.push(c);
}
var MODS=[
  {icon:"calculate",name:"節拍計算",desc:"依可用工時與客戶需求量自動推算 Takt Time"},
  {icon:"timeline",name:"週期比對",desc:"實際生產週期 (Cycle Time) 與節拍即時對比"},
  {icon:"linear_scale",name:"產線平衡",desc:"各工站作業時間與節拍線的山積平衡分析"},

  '</div><div class="grid g12" style="margin-top:14px"><div class="card">'+
  ch("leaderboard","瓶頸貢獻排名","對節拍偏離的影響度")+'<div id="c5a" class="chart"></div></div><div class="card">'+
  ch("view_kanban","節拍對策看板","改善提案流轉狀態")+'<div class="kb">'+
  kbcol("待評估","2",[kbcard("插件治具改為快換式","縮短 ST-04 對位時間，估 -12s","王承翰","治具","r"),kbcard("包裝封箱自動化","減少膠帶更換微停","陳冠宇","設備","y")])+
  kbcol("進行中","3",[kbcard("ST-04 增派 0.5 人力","分攤插件工時再平衡","林郁婷","人力","r"),kbcard("SMT-A 換線 SMED","目標換線 <10 分","黃士豪","工序","y"),kbcard("AOI 判定閾值優化","降低誤判等待","吳孟潔","品質","b")])+
  kbcol("已見效","2",[kbcard("測試線程式並行化","節拍 -5.2s 已達標","周立倫","軟體","done"),kbcard("上料整列標準化","減少抓取變異","趙敏","作業","done")])+
  '</div></div></div><div class="card" style="margin-top:14px">'+ch("query_stats","對策成效追蹤","導入前後實際節拍變化")+'<div id="c5b" class="chart sm"></div></div>'
}
function kbcol(t,n,cards){return '<div class="kbcol"><div class="kbh"><span>'+t+'</span><span class="cnt">'+n+'</span></div>'+cards.join("")+'</div>'}
function kbcard(t,d,who,cat,p){
  var pl=p=="done"?"已見效":p=="r"?"P1":p=="y"?"P2":"P3";
  return '<div class="kbcard"><div class="kt">'+t+'</div><div class="kd">'+d+'</div><div class="km"><span class="tag s">'+cat+'</span><span class="tag '+(p=="done"?"g":p)+'">'+pl+'</span><span style="margin-left:auto">'+who+'</span></div></div>'
}
function c5init(){
  mk("c5a",{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},grid:{left:70,right:24,top:14,bottom:24},xAxis:{type:"value",name:"偏離秒數",axisLabel:{fontSize:11}},yAxis:{type:"category",data:["AOI 等待","首件檢查","換線","料件供給","插件對位"],axisLabel:{fontSize:11}},series:[{type:"bar",data:[2.1,2.7,3.4,4.8,15.7],barWidth:"56%",itemStyle:{color:function(p){return p.dataIndex==4?C.red:p.dataIndex==3?C.orange:C.blue},borderRadius:[0,2,2,0]},label:{show:true,position:"right",formatter:"{c}s",fontSize:11}}]});
  mk("c5b",{tooltip:{trigger:"axis"},legend:{data:["實際節拍","目標節拍"],bottom:0,textStyle:{fontSize:11}},grid:{left:46,right:16,top:20,bottom:42},xAxis:{type:"category",data:["導入前","第1週","第2週","第3週","第4週","目標"],axisLabel:{fontSize:11}},yAxis:{type:"value",name:"秒/件",min:48,max:64,axisLabel:{fontSize:11}},series:[
    {name:"實際節拍",type:"line",data:[62.9,60.1,57.8,55.9,54.5,null],smooth:true,color:C.blue,lineStyle:{width:3},symbol:"circle",symbolSize:7,areaStyle:{opacity:.1}},
    {name:"目標節拍",type:"line",data:[51.1,51.1,51.1,51.1,51.1,51.1],lineStyle:{type:"dashed",color:C.blue2,width:2},symbol:"none",color:C.blue2}
  ]})

function kpi(icon,lb,vl,unit,dir,delta){
  var dcls=dir=="up"?"up":dir=="down"?"down":"neu",arrow=dir=="up"?"trending_up":dir=="down"?"trending_down":"remove";
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div><div class="lb">'+lb+'</div><div class="vl">'+vl+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dl '+dcls+'"><span class="material-symbols-outlined" style="font-size:14px">'+arrow+'</span>'+delta+'</div></div>'
}
function ch(icon,title,desc){return '<div class="ch"><span class="material-symbols-outlined">'+icon+'</span><div style="min-width:0"><h3>'+title+'</h3><div class="cd">'+desc+'</div></div></div>'}
function fbox(fn,fv,unit){return '<div class="fbox"><div class="fn">'+fn+'</div><div class="fv">'+fv+'<small> '+unit+'</small></div></div>'}
var SCREENS=[s0,s1,s2,s3,s4,s5],INITS=[c0init,c1init,c2init,c3init,c4init,c5init];
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  disposeCharts();
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].desc;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false")
  }
  void container.offsetHeight;
  INITS[i]()
}
(function buildNav(){
  var nav=document.getElementById("nav"),html="";
  for(var i=0;i<MODS.length;i++)html+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="t">'+MODS[i].name+'</span></button>';
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++)btns[j].addEventListener("click",function(){
    var index=+this.getAttribute("data-i");
    if(location.hash!="#go="+index)location.hash="go="+index;
    else show(index);
    try{window.scrollTo(0,0)}catch(e){}
  })
})();
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize()}catch(e){}}});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash()
})();
</script>
