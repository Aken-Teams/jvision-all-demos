<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QMS 品質管理系統 · Quality Management System</title>
<meta name="description" content="不合格品看板、IQC/IPQC/OQC 檢驗、SPC 管制圖、CAPA/8D 矯正、FMEA 風險矩陣與批次追溯稽核的品質閉環平台（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0d2b33;--bg:#eef6f8;--card:#fff;--line:#d5e8ec;--mut:#5f7d84;--ok:#0d9488;--warn:#d97706;--bad:#dc2626;--soft:#e2f3f6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* top nav */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(8,145,178,.06)}
.top .row{display:flex;align-items:center;gap:14px;padding:11px 22px;flex-wrap:wrap}
.top .row>*{min-width:0}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(8,145,178,.4)}
.brand .lg .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:900;font-family:"Noto Sans TC";display:block;line-height:1.15}
.brand span{font-size:9px;color:var(--accent);letter-spacing:1.4px;font-weight:800}
.tright{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none;flex-wrap:wrap}
.datechip{background:#fef3c7;color:#b45309;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.live{background:var(--soft);color:var(--accent);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.who{display:flex;align-items:center;gap:8px;flex:none}
.who .av{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-family:Inter;flex:none}
.who small{font-size:11px;color:var(--mut);display:block;line-height:1.3}.who b{font-size:12.5px;font-family:"Noto Sans TC"}
nav.tabs{display:flex;gap:4px;padding:0 16px 10px;flex-wrap:wrap}
nav.tabs button{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#3f6169;font:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:11px;cursor:pointer;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
nav.tabs button .material-symbols-outlined{font-size:19px;color:#7fb4bf}
nav.tabs button:hover{background:var(--soft)}
nav.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(8,145,178,.32)}
nav.tabs button.on .material-symbols-outlined{color:#fff}
.main{padding:20px 24px 46px;max-width:1440px;margin:0 auto;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.vhr{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--accent);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24;font-size:30px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}
.g21{grid-template-columns:.9fr 1.4fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#cdf3ee;color:#0f766e}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#cff2f8;color:#0e7490}.t-mut{background:#e6eef0;color:#5f7d84}.t-purple{background:#ede9fe;color:#6d28d9}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11.5px;background:var(--soft)}
table.data tr:last-child td{border-bottom:0}
.chart{height:250px}
.scroll{overflow-x:auto}
.rank{width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:900;display:inline-grid;place-content:center;font-size:12px;flex:none}
.rank.top{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bar{height:8px;background:#dcecef;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* signature: kanban board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:13px}
.board>*{min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:11px;display:flex;flex-direction:column;gap:10px}
.col .ch{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:800;font-size:13px}
.col .ch .dot{width:9px;height:9px;border-radius:50%;flex:none}
.col .ch .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);color:var(--mut);font-size:11px;font-weight:900;padding:1px 9px;border-radius:20px;font-family:Inter}
.ncr{background:#fff;border:1px solid var(--line);border-left:4px solid var(--sev,var(--accent));border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.ncr .id{font-family:Inter;font-weight:800;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ncr .ti{font-family:"Noto Sans TC";font-weight:700;font-size:13px;line-height:1.35}
.ncr .mt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.ncr .who2{display:flex;align-items:center;gap:5px}
.ncr .who2 .a{width:19px;height:19px;border-radius:6px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:900;font-family:Inter;flex:none}
/* inspection lot cards */
.lots{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lots>*{min-width:0}
.lot{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:linear-gradient(160deg,#fff,var(--soft));position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.lot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lc,var(--accent))}
.lot .lh{display:flex;align-items:center;gap:9px}
.lot .lh .li{width:34px;height:34px;border-radius:11px;background:var(--lc,var(--accent));color:#fff;display:grid;place-items:center;flex:none}
.lot .lh .li .material-symbols-outlined{font-size:19px}
.lot .lh b{font-family:"Noto Sans TC";font-size:14px;display:block;line-height:1.2}
.lot .lh small{color:var(--mut);font-size:10.5px}
.lot .lr{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.lot .lr b{color:var(--ink);font-family:Inter}
.lot .lb{border-top:1px dashed var(--line);padding-top:7px;display:flex;align-items:center;gap:8px;font-size:11px}
/* SPC control chart legend row */
.spcstat{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.spcstat>*{min-width:0}
.ss{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.ss .l{font-size:11px;color:var(--mut);font-weight:700}
.ss .v{font-size:20px;font-weight:900;font-family:Inter;margin-top:3px}
.ss .s{font-size:10.5px;font-weight:800;margin-top:2px}
/* 8D steps */
.d8{display:flex;flex-direction:column;gap:9px}
.dstep{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.dstep .dn{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:900;display:grid;place-items:center;font-family:Inter;flex:none;font-size:13px}
.dstep.done .dn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.dstep.cur .dn{background:#fef3c7;color:#b45309}
.dstep .db{flex:1;min-width:0}
.dstep .db b{font-family:"Noto Sans TC";font-size:13px}
.dstep .db small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px;line-height:1.5}
.dstep .dt{flex:none;font-size:10.5px}
/* FMEA risk matrix (signature) */
.rpn{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;font-size:11px}
.rpn>div{min-width:0}
.rpn .hh{display:grid;place-items:center;font-weight:800;color:var(--mut);padding:5px 0}
.rpn .rl{display:grid;place-items:center;font-weight:800;color:var(--mut);padding:0 4px}
.rpn .cell{border-radius:8px;aspect-ratio:1.7/1;display:grid;place-items:center;font-weight:900;color:#fff;font-family:Inter;font-size:12px}
.axl{font-size:11px;color:var(--mut);text-align:center;margin-top:8px;font-weight:700}
/* trace tree */
.trace{display:flex;flex-direction:column;gap:8px}
.tnode{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
.tnode .tic{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tnode.warn{border-left:4px solid var(--warn)}.tnode.bad{border-left:4px solid var(--bad)}.tnode.ok{border-left:4px solid var(--ok)}
.tnode .tb{flex:1;min-width:0}.tnode .tb b{font-family:"Noto Sans TC";font-size:13px}.tnode .tb small{color:var(--mut);font-size:11px;display:block}
.tnode .tv{flex:none;text-align:right}.tnode .tv b{font-family:Inter;font-size:13px;color:var(--accent)}.tnode .tv small{font-size:10px;color:var(--mut);display:block}
.indent1{margin-left:26px}.indent2{margin-left:52px}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.o{border-left-color:var(--ok)}.ri.i{border-left-color:var(--accent)}
.ri .mid{flex:1;min-width:0}.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}.ri .qty b{font-family:Inter;font-size:15px;color:var(--accent)}.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl:not(:last-child)::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl .td{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none;z-index:1}
.tl.bad .td{background:#fee2e2;color:#b91c1c}.tl.ok .td{background:#cdf3ee;color:#0f766e}
.tl .tc b{font-family:"Noto Sans TC";font-size:13px}.tl .tc small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
.tl .tc .tm{font-size:10.5px;color:var(--accent);font-weight:800;font-family:Inter}
@media(max-width:1000px){.board{grid-template-columns:repeat(4,minmax(200px,1fr));overflow-x:auto}}
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g21,.g11{grid-template-columns:1fr}
 .lots{grid-template-columns:repeat(2,1fr)}
 .spcstat{grid-template-columns:repeat(2,1fr)}
 .board{grid-template-columns:repeat(4,minmax(190px,220px))}
}
@media(max-width:560px){
 nav.tabs button span:not(.material-symbols-outlined){display:none}
 nav.tabs button{padding:9px 12px}
 .who small,.who b{display:none}
 .main{padding:16px 13px 40px}
}
@media(max-width:520px){.kpis{grid-template-columns:1fr}.lots{grid-template-columns:1fr}.spcstat{grid-template-columns:1fr}}
</style>
</head>

 <div class="row">
