<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QMS 品質管理系統 · Quality Management System</title>
<meta name="description" content="不合格品看板、IQC/IPQC/OQC 檢驗、SPC 管制圖、CAPA/8D 矯正、FMEA 風險矩陣與批次追溯稽核的品質閉環平台（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
 --color-primary:#2563EB;
 --color-on-primary:#FFFFFF;
 --color-secondary:#3B82F6;
 --color-on-secondary:#000000;
 --color-accent:#EA580C;
 --color-on-accent:#000000;
 --color-background:#F8FAFC;
 --color-foreground:#1E293B;
 --color-card:#FFFFFF;
 --color-card-foreground:#1E293B;
 --color-muted:#E9EFF8;
 --color-muted-foreground:#475569;
 --color-border:#E2E8F0;
 --color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;
 --color-ring:#2563EB;
 --blue:#2563EB;
 --ink:#1E293B;
 --muted:#475569;
 --line:#E2E8F0;
 --ok:#047857;
 --warn:#B45309;
 --bad:#DC2626;
 --violet:#6D28D9;
 --bg:#F8FAFC;
 --card:#FFFFFF;
 --soft:#E9EFF8;
 --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.04);
 --radius:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
 font-family:"Fira Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
 background:
  linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
  var(--color-background);
 background-size:32px 32px;
 color:var(--color-foreground);
 -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid rgba(37,99,235,.3);
 outline-offset:2px;
}
.material-symbols-outlined{
 font-size:20px;
 line-height:1;
 vertical-align:middle;
 font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
.top{
 position:sticky;
 top:0;
 z-index:30;
 background:rgba(255,255,255,.96);
 border-bottom:1px solid var(--color-border);
 box-shadow:0 1px 0 rgba(15,23,42,.02);
 backdrop-filter:blur(12px);
}
.top .row{
 min-height:64px;
 padding:9px clamp(14px,2.4vw,32px);
 display:flex;
 align-items:center;
 gap:18px;
 border-bottom:1px solid var(--color-border);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .lg{
 width:38px;
 height:38px;
 flex:none;
 display:grid;
 place-items:center;
 color:var(--color-on-primary);
 background:var(--color-primary);
 border-radius:4px;
 box-shadow:4px 4px 0 #BFDBFE;
}
.brand .lg .material-symbols-outlined{font-size:22px}
.brand b{
 display:block;
 font-size:15px;
 font-weight:700;
 line-height:1.15;
 letter-spacing:.02em;
}
.brand span:not(.material-symbols-outlined){
 display:block;
 margin-top:4px;
 color:var(--color-primary);
 font:600 9px/1 "Fira Code",monospace;
 letter-spacing:.14em;
}
.tright{
 margin-left:auto;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 gap:8px;
 min-width:0;
}
.datechip,.live,.pill,.tag{
 display:inline-flex;
 align-items:center;
 white-space:nowrap;
}
.datechip{
 padding:6px 9px;
 color:#334155;
 background:#F1F5F9;
 border:1px solid var(--color-border);
 border-radius:4px;
 font:600 11px/1 "Fira Code",monospace;
}
.live{
 gap:7px;
 padding:6px 9px;
 color:#1E40AF;
 background:#EFF6FF;
 border:1px solid #BFDBFE;
 border-radius:4px;
 font-size:11px;
 font-weight:600;
}
.live i{
 width:7px;
 height:7px;
 border-radius:50%;
 background:var(--color-primary);
 box-shadow:0 0 0 3px #DBEAFE;
 animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.45}}
.who{display:flex;align-items:center;gap:8px;margin-left:4px}
.who .av{
 width:32px;
 height:32px;
 display:grid;
 place-items:center;
 flex:none;
 color:#1E40AF;
 background:#DBEAFE;
 border:1px solid #BFDBFE;
 border-radius:50%;
 font-weight:700;
}
.who b{display:block;font-size:12px}
.who small{display:block;margin-top:1px;color:var(--color-muted-foreground);font-size:10px}
nav.tabs{
 display:flex;
 align-items:center;
 gap:0;
 padding:0 clamp(14px,2.4vw,32px);
 overflow-x:auto;
 scrollbar-width:thin;
}
nav.tabs button{
 position:relative;
 min-height:48px;
 padding:0 15px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 flex:none;
 border:0;
 background:transparent;
 color:#475569;
 font-size:12px;
 font-weight:600;
 transition:color .2s ease,background-color .2s ease;
}
nav.tabs button::after{
 content:"";
 position:absolute;
 right:12px;
 bottom:0;
 left:12px;
 height:3px;
 background:transparent;
}
nav.tabs button:hover{color:#1E40AF;background:#F8FAFC}
nav.tabs button.on{color:#1D4ED8;background:#EFF6FF}
nav.tabs button.on::after{background:var(--color-primary)}
nav.tabs button .material-symbols-outlined{font-size:18px;color:#64748B}
nav.tabs button.on .material-symbols-outlined{color:var(--color-primary)}
.main{
 width:min(100%,1440px);
 margin:0 auto;
 padding:22px clamp(14px,2.4vw,32px) 48px;
}
.vh{
 position:relative;
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 gap:18px;
 margin-bottom:18px;
 padding:4px 0 15px 15px;
 border-bottom:1px solid var(--color-border);
}
.vh::before{
 content:"";
 position:absolute;
 top:4px;
 bottom:15px;
 left:0;
 width:3px;
 background:var(--color-primary);
}
.vh h2{
 margin:0;
 color:#0F172A;
 font-size:clamp(20px,2vw,27px);
 line-height:1.15;
 font-weight:700;
 letter-spacing:-.025em;
}
.vh p{
 margin:6px 0 0;
 color:var(--color-muted-foreground);
 font-size:12px;
 line-height:1.55;
}
.vhr{display:flex;align-items:center;gap:8px}
.pill{
 gap:6px;
 padding:7px 10px;
 color:#1E40AF;
 background:#EFF6FF;
 border:1px solid #BFDBFE;
 border-radius:4px;
 font:600 11px/1.2 "Fira Code",monospace;
}
.kpis{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
 margin-bottom:14px;
}
.kpi{
 position:relative;
 min-width:0;
 min-height:112px;
 padding:14px 15px 12px;
 overflow:hidden;
 background:var(--color-card);
 border:1px solid var(--color-border);
 border-top:3px solid var(--color-primary);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.kpi:hover{
 transform:translateY(-2px);
 border-color:#BFDBFE;
 box-shadow:0 8px 24px rgba(37,99,235,.09);
}
.kpi .l{
 padding-right:34px;
 color:var(--color-muted-foreground);
 font-size:11px;
 font-weight:600;
}
.kpi .v{
 margin-top:7px;
 color:#0F172A;
 font:700 26px/1.1 "Fira Code",monospace;
 letter-spacing:-.04em;
}
.kpi .v small{color:#475569;font-size:12px;font-weight:500}
.kpi .d{margin-top:7px;font-size:10.5px;font-weight:600}
.kpi .ic{
 position:absolute;
 top:12px;
 right:12px;
 color:#93C5FD;
 font-size:25px;
}
.up{color:var(--ok)}
.dn{color:#B91C1C}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,.9fr)}
.g21{grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
 min-width:0;
 padding:15px;
 background:var(--color-card);
 border:1px solid var(--color-border);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 transition:border-color .2s ease,box-shadow .2s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:0 8px 25px rgba(15,23,42,.065)}
.card h3{
 min-height:24px;
 margin:0 0 13px;
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
 color:#0F172A;
 font-size:13px;
 font-weight:700;
 letter-spacing:.005em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.tag{
 gap:4px;
 padding:3px 7px;
 border:1px solid currentColor;
 border-radius:3px;
 font-size:10px;
 font-weight:600;
 line-height:1.2;
}
.t-ok{color:#047857;background:#ECFDF5}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-info{color:#1D4ED8;background:#EFF6FF}
.t-mut{color:#475569;background:#F1F5F9}
.t-purple{color:#6D28D9;background:#F5F3FF}
.scroll{max-width:100%;overflow:auto}
table.data{
 width:100%;
 border-spacing:0;
 border-collapse:separate;
 font-size:11.5px;
}
table.data th,table.data td{
 min-height:40px;
 padding:9px 10px;
 border-right:1px solid #F1F5F9;
 border-bottom:1px solid var(--color-border);
 text-align:left;
 white-space:nowrap;
}
table.data th:last-child,table.data td:last-child{border-right:0}
table.data th{
 position:sticky;
 top:0;
 z-index:1;
 color:#334155;
 background:#F1F5F9;
 font-size:10.5px;
 font-weight:700;
 letter-spacing:.025em;
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td,table.data tr:not(:first-child):hover td{background:#F8FAFC}
table.data td:first-child,
table.data td:nth-child(4),
table.data td:nth-child(5),
table.data td:nth-child(6){
 font-family:"Fira Code",monospace;
}
table.data td[style*="font-family:Inter"]{font-family:"Fira Code",monospace!important}
.chart{height:250px}
.board{
 display:grid;
 grid-template-columns:repeat(4,minmax(220px,1fr));
 gap:10px;
}
.col{
 min-width:0;
 padding:10px;
 display:flex;
 flex-direction:column;
 gap:9px;
 background:#F8FAFC;
 border:1px solid var(--color-border);
 border-radius:4px;
}
.col .ch{
 min-height:27px;
 display:flex;
 align-items:center;
 gap:7px;
 color:#334155;
 font-size:11.5px;
 font-weight:700;
}
.col .ch .dot{width:8px;height:8px;border-radius:50%;flex:none}
.col .ch .cnt{
 margin-left:auto;
 min-width:24px;
 padding:2px 6px;
 color:#475569;
 background:#FFF;
 border:1px solid var(--color-border);
 border-radius:3px;
 text-align:center;
 font:600 10px/1.2 "Fira Code",monospace;
}
.ncr{
 padding:10px;
 display:flex;
 flex-direction:column;
 gap:7px;
 background:#FFF;
 border:1px solid var(--color-border);
 border-left:3px solid var(--sev,var(--color-primary));
 border-radius:4px;
 box-shadow:0 1px 2px rgba(15,23,42,.04);
 transition:transform .2s ease,box-shadow .2s ease;
}
.ncr:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.08)}
.ncr .id{
 display:flex;
 align-items:center;
 gap:5px;
 flex-wrap:wrap;
 color:#475569;
 font:600 10px/1.3 "Fira Code",monospace;
}
.ncr .ti{color:#1E293B;font-size:12px;font-weight:600;line-height:1.45}
.ncr .mt{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 color:#64748B;
 font-size:10px;
}
.ncr .who2{display:flex;align-items:center;gap:5px}
.ncr .who2 .a{
 width:19px;
 height:19px;
 display:grid;
 place-items:center;
 flex:none;
 color:#1D4ED8;
 background:#DBEAFE;
 border-radius:50%;
 font-weight:700;
}
.lots{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px;
}
.lot{
 position:relative;
 min-width:0;
 padding:12px 12px 11px 15px;
 display:flex;
 flex-direction:column;
 gap:9px;
 overflow:hidden;
 background:#FFF;
 border:1px solid var(--color-border);
 border-radius:4px;
 transition:transform .2s ease,box-shadow .2s ease;
}
.lot::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--lc,var(--color-primary))}
.lot:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(15,23,42,.07)}
.lot .lh{display:flex;align-items:center;gap:9px}
.lot .lh .li{
 width:32px;
 height:32px;
 display:grid;
 place-items:center;
 flex:none;
 color:#FFF;
 background:var(--lc,var(--color-primary));
 border-radius:3px;
}
.lot .lh .li .material-symbols-outlined{font-size:17px}
.lot .lh b{display:block;color:#1E293B;font-size:12px}
.lot .lh small{display:block;margin-top:2px;color:#64748B;font:500 9.5px/1.3 "Fira Code",monospace}
.lot .lr{display:flex;justify-content:space-between;gap:8px;color:#64748B;font-size:10.5px}
.lot .lr b{color:#1E293B;font-family:"Fira Code",monospace}
.lot .lb{
 padding-top:8px;
 display:flex;
 align-items:center;
 gap:7px;
 border-top:1px dashed #CBD5E1;
 color:#475569;
 font-size:10px;
}
.spcstat{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
 margin-bottom:14px;
}
.ss{
 min-width:0;
 padding:12px 13px;
 background:#FFF;
 border:1px solid var(--color-border);
 border-left:3px solid var(--color-primary);
 border-radius:4px;
 box-shadow:var(--shadow);
}
.ss .l{color:#475569;font-size:10.5px;font-weight:600}
.ss .v{margin-top:5px;color:#0F172A;font:700 19px/1.2 "Fira Code",monospace}
.ss .s{margin-top:5px;font-size:10px;font-weight:600}
.d8{display:flex;flex-direction:column;gap:7px}
.dstep{
 padding:9px 10px;
 display:flex;
 align-items:flex-start;
 gap:10px;
 background:#FFF;
 border:1px solid var(--color-border);
 border-radius:4px;
}
.dstep .dn{
 width:32px;
 height:28px;
 display:grid;
 place-items:center;
 flex:none;
 color:#1D4ED8;
 background:#EFF6FF;
 border:1px solid #BFDBFE;
 border-radius:3px;
 font:700 10.5px/1 "Fira Code",monospace;
}
.dstep.done .dn{color:#FFF;background:#2563EB;border-color:#2563EB}
.dstep.cur{border-color:#FDBA74;background:#FFFBEB}
.dstep.cur .dn{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.dstep .db{flex:1;min-width:0}
.dstep .db b{color:#1E293B;font-size:11.5px}
.dstep .db small{display:block;margin-top:2px;color:#64748B;font-size:10px;line-height:1.45}
.dstep .dt{flex:none}
.rpn{
 display:grid;
 grid-template-columns:auto repeat(5,minmax(0,1fr));
 gap:5px;
 font-size:10px;
}
.rpn .hh,.rpn .rl{
 display:grid;
 place-items:center;
 padding:5px;
 color:#475569;
 font:600 10px/1 "Fira Code",monospace;
}
.rpn .cell{
 aspect-ratio:1.7/1;
 display:grid;
 place-items:center;
 color:#FFF;
 border-radius:3px;
 font:700 11px/1 "Fira Code",monospace;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.axl{margin-top:8px;color:#475569;text-align:center;font-size:10px;font-weight:600}
.trace{display:flex;flex-direction:column;gap:7px}
.tnode{
 padding:9px 10px;
 display:flex;
 align-items:center;
 gap:9px;
 background:#FFF;
 border:1px solid var(--color-border);
 border-left:3px solid var(--color-primary);
 border-radius:4px;
}
.tnode.warn{border-left-color:#B45309}
.tnode.bad{border-left-color:#DC2626}
.tnode.ok{border-left-color:#047857}
.tnode .tic{
 width:29px;
 height:29px;
 display:grid;
 place-items:center;
 flex:none;
 color:#1D4ED8;
 background:#EFF6FF;
 border-radius:3px;
}
.tnode .tic .material-symbols-outlined{font-size:17px}
.tnode .tb{flex:1;min-width:0}
.tnode .tb b{font-size:11.5px}
.tnode .tb small{display:block;margin-top:2px;color:#64748B;font-size:10px}
.tnode .tv{flex:none;text-align:right}
.tnode .tv b{color:#1D4ED8;font:700 12px/1.2 "Fira Code",monospace}
.tnode .tv small{display:block;color:#64748B;font-size:9px}
.indent1{margin-left:25px}.indent2{margin-left:50px}
.rep{display:flex;flex-direction:column;gap:8px}
.ri{
 padding:10px;
 display:flex;
 align-items:center;
 gap:10px;
 border:1px solid var(--color-border);
 border-left:3px solid var(--bad);
 border-radius:4px;
}
.ri.w{border-left-color:var(--warn)}
.ri.o{border-left-color:var(--ok)}
.ri.i{border-left-color:var(--color-primary)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:11.5px}
.ri .mid small{display:block;margin-top:3px;color:#64748B;font-size:10px;line-height:1.4}
.ri .qty{text-align:right;flex:none}
.ri .qty b{color:#1D4ED8;font:700 12px/1.2 "Fira Code",monospace}
.ri .qty small{display:block;margin-top:2px;color:#64748B;font-size:9px}
.timeline{display:flex;flex-direction:column}
.tl{position:relative;padding-bottom:13px;display:flex;gap:11px}
.tl:not(:last-child)::before{content:"";position:absolute;top:29px;bottom:0;left:14px;width:1px;background:#CBD5E1}
.tl .td{
 width:29px;
 height:29px;
 display:grid;
 place-items:center;
 flex:none;
 z-index:1;
 color:#1D4ED8;
 background:#EFF6FF;
 border:1px solid #BFDBFE;
 border-radius:50%;
}
.tl.bad .td{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.tl.ok .td{color:#047857;background:#ECFDF5;border-color:#A7F3D0}
.tl .tc b{font-size:11.5px}
.tl .tc small{display:block;margin-top:2px;color:#64748B;font-size:10px;line-height:1.4}
.tl .tc .tm{color:#1D4ED8;font:600 9.5px/1.3 "Fira Code",monospace}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
 .board{grid-template-columns:repeat(4,minmax(205px,1fr));overflow-x:auto}
}
@media(max-width:820px){
 .kpis,.spcstat{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g2,.g21,.g11{grid-template-columns:1fr}
 .lots{grid-template-columns:repeat(2,minmax(0,1fr))}
 .top .row{gap:10px}
}
@media(max-width:560px){
 .top .row{min-height:58px;padding:8px 13px}
 .brand .lg{width:34px;height:34px}
 .brand b{font-size:13px}
 .brand span:not(.material-symbols-outlined){font-size:8px}
 .datechip{display:none}
 .who b,.who small{display:none}
 nav.tabs{padding:0 8px}
 nav.tabs button{min-width:50px;padding:0 13px}
 nav.tabs button span:not(.material-symbols-outlined){display:none}
 .main{padding:17px 13px 38px}
 .vh{align-items:flex-start;flex-direction:column}
 .vhr{width:100%}
 .pill{max-width:100%;white-space:normal}
 .lots{grid-template-columns:1fr}
 .indent1{margin-left:14px}.indent2{margin-left:28px}
}
@media(max-width:420px){
 .kpis,.spcstat{grid-template-columns:1fr}
 .kpi{min-height:100px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*::before,*::after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  transition-duration:.01ms!important;
  scroll-behavior:auto!important;
 }
 .reveal{animation:none!important}
}
</style>
</head>
<body>
<header class="top">

var charts=[];
var C1="#2563EB",C2="#3B82F6",GRID="#E2E8F0",TEXT="#475569";
var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var BASE={
 toolbar:{show:false},
 animations:{enabled:!reduced,speed:350},
 fontFamily:"Fira Sans, sans-serif"
};
function destroy(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
 var el=document.getElementById(id);
 if(!el||!window.ApexCharts)return;
 var c=new ApexCharts(el,opt);
 c.render();
 charts.push(c);
}
function draw(i){
 destroy();
 if(!window.ApexCharts)return;
 if(i===0)mk("c_type",{
  chart:{type:"donut",height:250,animations:{enabled:!reduced,speed:350},fontFamily:"Fira Sans, sans-serif"},
  series:[14,9,8,6,5],labels:["製程異常","客訴","規格超差","批次隔離","出貨"],
  colors:[C1,"#DC2626","#B45309",C2,"#6D28D9"],
  legend:{position:"bottom",fontSize:"11px",labels:{colors:TEXT}},
  dataLabels:{enabled:true,formatter:function(v){return v.toFixed(0)+"%"}},
  plotOptions:{pie:{donut:{size:"66%"}}},
  stroke:{width:2,colors:["#FFF"]}
 });
 if(i===1)mk("c_insp",{
  chart:Object.assign({type:"bar",height:250},BASE),
  series:[{name:"IQC",data:[3.1,2.8,3.4,2.6,2.2,2]},{name:"IPQC",data:[1.8,1.6,2.1,1.4,1.2,1.1]},{name:"OQC",data:[.6,.5,.7,.4,.3,.3]}],
  colors:[C1,C2,"#6D28D9"],plotOptions:{bar:{borderRadius:2,columnWidth:"62%"}},
  dataLabels:{enabled:false},xaxis:{categories:["W1","W2","W3","W4","W5","W6"],labels:{style:{colors:TEXT,fontSize:"10px",fontFamily:"Fira Code"}}},
  yaxis:{labels:{formatter:function(v){return v.toFixed(1)+"%"},style:{colors:TEXT}}},
  legend:{position:"top",fontSize:"10px"},grid:{borderColor:GRID}
 });
 if(i===2){
  mk("c_xbar",{
   chart:Object.assign({type:"line",height:290},BASE),
   series:[{name:"量測均值 X̄",data:SPC_X},{name:"UCL",data:SPC_X.map(function(){return SPC_UCL})},{name:"CL",data:SPC_X.map(function(){return SPC_CL})},{name:"LCL",data:SPC_X.map(function(){return SPC_LCL})}],
   colors:[C1,"#DC2626","#047857","#DC2626"],stroke:{width:[3,1.5,1.5,1.5],curve:"straight",dashArray:[0,5,3,5]},
   markers:{size:[4,0,0,0]},dataLabels:{enabled:false},
   xaxis:{categories:SPC_X.map(function(v,n){return "#"+(n+1)}),labels:{style:{colors:TEXT,fontSize:"9px",fontFamily:"Fira Code"}}},
   yaxis:{min:19.84,max:20.16,labels:{formatter:function(v){return v.toFixed(2)},style:{colors:TEXT}}},
   legend:{position:"top",fontSize:"10px"},grid:{borderColor:GRID},
   tooltip:{y:{formatter:function(v){return v.toFixed(3)+" mm"}}}
  });
  mk("c_rchart",{
   chart:Object.assign({type:"line",height:250},BASE),
   series:[{name:"全距 R",data:SPC_R},{name:"UCL_R",data:SPC_R.map(function(){return .13})},{name:"R̄",data:SPC_R.map(function(){return .06})}],
   colors:[C2,"#DC2626","#047857"],stroke:{width:[3,1.5,1.5],curve:"straight",dashArray:[0,5,3]},
   markers:{size:[4,0,0]},dataLabels:{enabled:false},
   xaxis:{categories:SPC_R.map(function(v,n){return "#"+(n+1)}),labels:{style:{colors:TEXT,fontSize:"9px",fontFamily:"Fira Code"}}},
   yaxis:{labels:{formatter:function(v){return v.toFixed(2)},style:{colors:TEXT}}},
   legend:{position:"top",fontSize:"10px"},grid:{borderColor:GRID}
  });
 }
 if(i===3)mk("c_capa",{

  stroke:{width:2,curve:"straight"},fill:{type:"gradient",gradient:{opacityFrom:.3,opacityTo:.03}},

  yaxis:{min:50,max:100,labels:{formatter:function(v){return v.toFixed(0)+"%"},style:{colors:TEXT}}},
  legend:{show:false},grid:{borderColor:GRID}
 });

  });
 }
}
function show(i){
 nav.querySelectorAll("button").forEach(function(b){
  var active=+b.getAttribute("data-i")===i;
  b.classList.toggle("on",active);
  b.setAttribute("aria-current",active?"page":"false");
 });
 vt.textContent=MOD[i][2];
 vd.textContent=MOD[i][3];

 view.innerHTML=SCREENS[i]();
 if(!reduced)view.classList.add("reveal");
 draw(i);
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 var i=m?Math.min(+m[1],5):0;
 show(i);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
