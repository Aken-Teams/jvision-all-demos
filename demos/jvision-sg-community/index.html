<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>社區參與與公益支出管理 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:var(--color-accent);
  --accent2:var(--color-secondary);
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#f0fdf4;
  --hov:#ecfdf5;
  --track:#dbece7;
  --sidebar:#ffffff;
  --sidebar2:#f0fdf4;
  --side-edge:var(--color-border);
  --ok:#047857;
  --warn:#9a6700;
  --bad:#b91c1c;
  --info:#0369a1;
  --r:20px;
  --glow:rgba(5,150,105,.22);
  --shadow-sm:0 1px 2px rgba(6,78,59,.06),0 5px 14px rgba(6,78,59,.05);
  --shadow-md:0 12px 30px rgba(6,78,59,.09),0 2px 7px rgba(6,78,59,.05);
  --shadow-lg:0 22px 55px rgba(6,78,59,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",sans-serif;
  background:
    radial-gradient(circle at 92% 5%,rgba(16,185,129,.14),transparent 27rem),
    radial-gradient(circle at 12% 92%,rgba(167,243,208,.42),transparent 32rem),
    var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{margin:0;color:var(--ink);font-family:"Fira Sans",sans-serif;letter-spacing:-.02em}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:10px;
}
::selection{background:#a7f3d0;color:#052e2b}

.app{display:flex;min-height:100vh;position:relative;isolation:isolate}
.app::before,.app::after{
  content:"";
  position:fixed;
  z-index:-1;
  pointer-events:none;
  filter:blur(.1px);
}
.app::before{
  width:330px;height:330px;right:-135px;top:22%;
  border-radius:61% 39% 68% 32% / 42% 58% 42% 58%;
  border:1px solid rgba(5,150,105,.16);
  background:rgba(255,255,255,.28);
}
.app::after{
  width:220px;height:220px;left:190px;bottom:-100px;
  border-radius:35% 65% 47% 53% / 63% 38% 62% 37%;
  background:rgba(16,185,129,.08);
}
.sidebar{
  width:266px;
  flex:none;
  min-width:0;
  height:calc(100vh - 24px);
  position:sticky;
  top:12px;
  margin:12px 0 12px 12px;
  padding:20px 15px;
  display:flex;
  flex-direction:column;
  color:var(--ink);
  background:rgba(255,255,255,.9);
  border:1px solid rgba(167,243,208,.92);
  border-radius:28px 18px 28px 18px;
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(16px);
  overflow:hidden;
}
.sidebar::after{
  content:"";
  position:absolute;
  width:145px;height:145px;
  right:-72px;bottom:54px;
  border-radius:58% 42% 31% 69% / 42% 54% 46% 58%;
  background:linear-gradient(145deg,rgba(16,185,129,.12),rgba(167,243,208,.04));
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 7px 23px;min-width:0;position:relative;z-index:1}
.brand-logo{
  width:44px;height:44px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--color-on-primary);
  background:linear-gradient(145deg,#34d399,var(--color-primary));
  border:1px solid rgba(6,78,59,.12);
  border-radius:15px 22px 15px 22px;
  box-shadow:0 9px 22px var(--glow);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-weight:700;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand-txt span{display:block;margin-top:1px;color:var(--muted);font-family:"Fira Code",monospace;font-size:9.5px;letter-spacing:.08em;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:4px;min-width:0;position:relative;z-index:1}
.nav button{
  min-height:46px;
  min-width:0;
  padding:11px 12px;
  display:flex;align-items:center;gap:11px;
  background:transparent;
  border:1px solid transparent;
  border-radius:15px 20px 15px 20px;
  color:var(--muted);
  text-align:left;
  font-weight:500;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  white-space:nowrap;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:#f0fdf4;border-color:#bbf7d0;color:var(--ink);transform:translateX(2px)}
.nav button.on{
  color:var(--color-on-primary);
  background:linear-gradient(135deg,#34d399 0%,#10b981 46%,#059669 100%);
  border-color:#047857;
  box-shadow:0 9px 20px rgba(5,150,105,.2);
  font-weight:700;
}
.nav .idx{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:10px;font-weight:600;opacity:.7}
.side-foot{
  position:relative;z-index:1;
  margin-top:auto;
  padding:15px 10px 3px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10.5px;
  line-height:1.75;
}
.side-foot b{color:var(--ink);font-family:"Fira Code",monospace}
.main{flex:1;min-width:0;padding:26px 32px 58px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-bottom:22px;
  padding:5px 2px;
  flex-wrap:wrap;
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700}
.topbar h1 .material-symbols-outlined{
  width:38px;height:38px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#047857;background:#d1fae5;
  border:1px solid #a7f3d0;
  border-radius:13px 19px 13px 19px;
  font-size:22px;
}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{
  min-height:34px;
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 12px;
  color:#334155;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:999px;
  box-shadow:0 2px 8px rgba(6,78,59,.04);
  font-size:11.5px;font-weight:600;
}
.chip .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--ok);
  border:2px solid #fff;
  box-shadow:0 0 0 3px rgba(4,120,87,.18);
  animation:pulse 2.2s ease-in-out infinite;
}
.avatar{
  width:36px;height:36px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#022c22;
  background:linear-gradient(145deg,#6ee7b7,#10b981);
  border:1px solid #059669;
  border-radius:50% 42% 50% 42%;
  box-shadow:0 5px 14px rgba(5,150,105,.17);
  font-weight:700;font-size:12px;
}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid rgba(167,243,208,.88);
  box-shadow:var(--shadow-sm);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);border-color:#6ee7b7;box-shadow:var(--shadow-md)}
.card,.sec{min-width:0;padding:18px;border-radius:22px 16px 22px 16px}
.sec{margin-bottom:16px}
.sec>h3{display:flex;align-items:center;gap:8px;margin-bottom:13px;font-size:14.5px;font-weight:700}
.sec>h3 .material-symbols-outlined{font-size:19px;color:#047857}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card.pad0>.card-h,.card.p0>.card-h{padding-right:18px!important;padding-left:18px!important}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:700}
.card-h h3 .material-symbols-outlined{font-size:19px;color:#047857}
.card-h .hint{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.kpi,.stat{
  position:relative;overflow:hidden;min-width:0;
  padding:17px 18px;
  border-radius:19px 25px 19px 25px;
}
.kpi::before,.tile::before{
  content:"";position:absolute;pointer-events:none;
  width:78px;height:78px;right:-28px;top:-31px;
  border-radius:63% 37% 52% 48% / 37% 56% 44% 63%;
  background:linear-gradient(145deg,rgba(167,243,208,.55),rgba(16,185,129,.08));
}
.kpi .ico,.tile .ti{
  width:39px;height:39px;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
  color:#047857;background:#d1fae5;
  border:1px solid #a7f3d0;
  border-radius:13px 18px 13px 18px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:11px;color:var(--muted);font-size:12px;font-weight:500}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:#047857}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:#052e2b;
  font-family:"Fira Code",monospace;
  font-size:25px;font-weight:700;letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11.5px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#b91c1c}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
.card.pad0>div:last-child{scrollbar-width:thin;scrollbar-color:#6ee7b7 #ecfdf5}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:11px 13px;
  color:#334155;background:#f0fdf4;
  border-top:1px solid #d1fae5;
  border-bottom:1px solid var(--line);
  text-align:left;white-space:nowrap;
  font-size:10.5px;font-weight:700;letter-spacing:.035em;
}
th:first-child{padding-left:18px}
th:last-child{padding-right:18px}
td{
  padding:11px 13px;
  color:#134e4a;background:rgba(255,255,255,.72);
  border-bottom:1px solid #d9f5e7;
  white-space:nowrap;
  transition:background-color .18s ease;
}
td:first-child{padding-left:18px}
td:last-child{padding-right:18px}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#ecfdf5}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:.01em}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;font-weight:700;line-height:1.15;white-space:nowrap;
}
.t-ok{color:#047857;background:#d1fae5}
.t-warn{color:#7c5200;background:#fef3c7}
.t-bad{color:#b91c1c;background:#fee2e2}
.t-info{color:#075985;background:#e0f2fe}
.t-gray{color:#475569;background:#f1f5f9}
.t-acc,.t-pink{color:#065f46;background:#d1fae5}
.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border-radius:999px}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#059669,#34d399)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#a7f3d0}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:14px;height:14px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:12px;background:#f0fdf4;border:1px solid var(--line);border-radius:19px 14px 19px 14px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-family:"Fira Code",monospace;font-size:10.5px}
.pcard{padding:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px 17px 12px 17px;box-shadow:0 3px 10px rgba(6,78,59,.05)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#065f46;background:#d1fae5;border:1px solid #a7f3d0;border-radius:50% 42% 50% 42%;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10.5px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:15px 21px 15px 21px}
.lane-row .num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none;color:#065f46;background:#d1fae5;border:1px solid #a7f3d0;border-radius:11px 15px 11px 15px;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:23px;height:23px;display:flex;align-items:center;justify-content:center;z-index:1;color:#64748b;background:#fff;border:2px solid #cbd5e1;border-radius:50%;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:#cbd5e1}
.steps .s.done{color:#001b13;background:#10b981;border-color:#047857}
.steps .s.cur{color:#047857;border-color:#059669;animation:pulse 1.8s ease-in-out infinite}
.steps .ln.done{background:#059669}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:999px}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:27px;background:var(--track);border-radius:9px 13px 9px 13px}
.band .rng{position:absolute;inset-block:0;background:#a7f3d0;border-radius:inherit}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:12px;height:21px;background:var(--accent);border-radius:4px;box-shadow:0 2px 6px var(--glow)}
.tile{
  position:relative;overflow:hidden;min-width:0;
  display:flex;flex-direction:column;gap:8px;
  padding:17px 18px;
  border-radius:19px 26px 19px 26px;
}
.tile b{position:relative;font-size:13.5px;font-weight:700}
.tile p{position:relative;margin:0;color:var(--muted);font-size:11.8px;line-height:1.6}
.tile .tv{position:relative;font-size:22px}
#screen>*{animation:rise-in .42s cubic-bezier(.2,.8,.2,1) both}
#screen>*:nth-child(2){animation-delay:.06s}
#screen>*:nth-child(3){animation-delay:.12s}
#screen>*:nth-child(4){animation-delay:.18s}
.apexcharts-canvas text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip,.apexcharts-menu{border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:var(--shadow-md)!important}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.58;transform:scale(.9)}}
@keyframes rise-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:16px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
