<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>設備維護管理 · CMMS｜Jvision 系統 Demo</title>
<meta name="description" content="保養、維修、預兆到備品的設備全生命週期管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --ink:#0f172a; --body:#334155; --muted:#64748b; --line:#e2e8f0; --amber:#f59e0b; --green:#16a34a; --red:#dc2626; --slate:#334155; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:#eef1f6; color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .cmms-top{ background:linear-gradient(90deg,#0f172a,#1e293b); color:#e2e8f0; position:sticky; top:0; z-index:30; }
  .cmms-top .bar{ display:flex; align-items:center; gap:22px; padding:0 26px; height:60px; }
  .cmms-brand{ display:flex; align-items:center; gap:12px; }
  .cmms-logo{ width:40px; height:40px; border-radius:11px; display:grid; place-content:center; color:#0f172a; background:linear-gradient(135deg,#fbbf24,#f59e0b); box-shadow:0 4px 14px rgba(245,158,11,.4); }
  .cmms-brand b{ color:#fff; font-size:16px; display:block; } .cmms-brand small{ color:#94a3b8; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .cmms-live{ margin-left:8px; display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#4ade80; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3); border-radius:999px; padding:4px 10px; }
  .cmms-live .dot{ width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.25); animation:pulse 2s infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 6px rgba(34,197,94,0);} }
  .cmms-top .right{ margin-left:auto; display:flex; align-items:center; gap:14px; color:#94a3b8; font-size:13px; }
  .cmms-ava{ width:34px; height:34px; border-radius:50%; background:#f59e0b; color:#0f172a; font-weight:800; display:grid; place-content:center; }
  .cmms-tabs{ display:flex; gap:2px; padding:0 20px; overflow-x:auto; border-top:1px solid rgba(255,255,255,.06); }
  .cmms-tabs button{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; background:none; border:0; border-bottom:3px solid transparent; color:#94a3b8; font:inherit; font-size:13px; font-weight:700; padding:13px 16px; cursor:pointer; transition:color .15s; }
  .cmms-tabs button .material-symbols-outlined{ font-size:19px; }
  .cmms-tabs button:hover{ color:#e2e8f0; } .cmms-tabs button.on{ color:#fbbf24; border-bottom-color:#f59e0b; }
  .cmms-body{ max-width:1320px; margin:0 auto; padding:22px 26px 44px; }
  .view-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .view-h h1{ margin:0; font-size:22px; font-weight:900; color:var(--ink); } .view-h p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:#f59e0b; color:#0f172a; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--slate); border:1px solid var(--line); } .btn .material-symbols-outlined{ font-size:18px; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; border-left:4px solid #f59e0b; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; } .kpi .l .material-symbols-outlined{ font-size:18px; color:#b45309; }
  .kpi .v{ font-size:28px; font-weight:900; color:var(--ink); margin-top:8px; letter-spacing:-.02em; } .kpi .v small{ font-size:14px; color:var(--muted); font-weight:700; }
  .kpi .d{ margin-top:5px; font-size:12px; font-weight:800; color:var(--green); }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:#b45309; font-size:20px; }
  .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:#b45309; cursor:pointer; }
  .eq-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .eq{ background:#f8fafc; border:1px solid var(--line); border-radius:13px; padding:14px; border-left:5px solid var(--green); }
  .eq.warn{ border-left-color:var(--amber); } .eq.down{ border-left-color:var(--red); }
  .eq-top{ display:flex; align-items:center; justify-content:space-between; } .eq-top b{ font-size:15px; color:var(--ink); }
  .eq-st{ font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; }
  .st-run{ color:#166534; background:#dcfce7; } .st-warn{ color:#92400e; background:#fef3c7; } .st-down{ color:#991b1b; background:#fee2e2; }
  .eq-meta{ font-size:12px; color:var(--muted); margin:8px 0 10px; }
  .eq-oee{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .eq-bar{ flex:1; height:7px; border-radius:999px; background:#e2e8f0; overflow:hidden; } .eq-bar span{ display:block; height:100%; border-radius:999px; }
  .eq-next{ margin-top:10px; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; } .eq-next .material-symbols-outlined{ font-size:15px; }
  .alert{ display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); } .alert:first-child{ border-top:0; }
  .alert-ic{ width:34px; height:34px; border-radius:10px; display:grid; place-content:center; flex:none; }
  .a-red{ background:#fee2e2; color:#dc2626; } .a-amber{ background:#fef3c7; color:#d97706; } .a-blue{ background:#e0f2fe; color:#0369a1; }
  .alert p{ margin:0; font-size:13px; color:var(--body); line-height:1.45; } .alert b{ color:var(--ink); } .alert small{ font-size:11px; color:#94a3b8; }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-col{ background:#f8fafc; border:1px solid var(--line); border-radius:11px; padding:9px; min-height:150px; }
  .cal-h{ text-align:center; font-size:12px; font-weight:800; color:var(--ink); padding-bottom:8px; } .cal-h small{ display:block; font-weight:600; color:var(--muted); font-size:10px; }
  .cal-ev{ border-radius:8px; padding:7px 8px; margin-bottom:6px; font-size:11px; font-weight:700; color:#fff; } .cal-ev small{ display:block; font-weight:500; opacity:.9; }
  .pm{ background:#0891b2; } .fix{ background:#f59e0b; } .insp{ background:#16a34a; }
  .kb{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(230px,1fr); gap:12px; overflow-x:auto; }
  .kb-col{ background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .kb-h{ display:flex; align-items:center; justify-content:space-between; font-weight:800; color:var(--ink); font-size:13px; padding:2px 4px 10px; } .kb-h .c{ font-size:11px; font-weight:800; color:#b45309; background:#fef3c7; border-radius:999px; padding:2px 8px; }
  .wo{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:8px; box-shadow:0 1px 3px rgba(15,30,70,.05); }
  .wo-top{ display:flex; align-items:center; justify-content:space-between; } .wo-top b{ font-size:13px; color:var(--ink); }
  .wo-pri{ font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; }
  .p-high{ background:#fee2e2; color:#dc2626; } .p-mid{ background:#fef3c7; color:#b45309; } .p-low{ background:#e0f2fe; color:#0369a1; }
  .wo p{ margin:7px 0 8px; font-size:12px; color:var(--body); } .wo-foot{ display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted); }
  .wo-own{ display:inline-flex; align-items:center; gap:6px; }
  .av{ width:22px; height:22px; border-radius:50%; display:grid; place-content:center; font-size:10px; font-weight:800; background:#fde68a; color:#92400e; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; } .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; padding:10px 12px; border-bottom:2px solid var(--line); background:#f8fafc; white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:#fffbeb; }
  .parts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .part{ background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:14px; } .part-t{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .part-t b{ font-size:14px; color:var(--ink); } .part small{ font-size:11px; color:var(--muted); }
  .low-tag{ font-size:10px; font-weight:800; color:#dc2626; background:#fee2e2; border-radius:6px; padding:2px 7px; }
  .tl{ position:relative; padding-left:8px; } .tl-i{ display:flex; gap:14px; padding-bottom:18px; position:relative; }
  .tl-i:not(:last-child)::before{ content:""; position:absolute; left:9px; top:20px; bottom:0; width:2px; background:var(--line); }
  .tl-dot{ width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-content:center; color:#fff; z-index:1; }
  .tl-i b{ color:var(--ink); font-size:14px; } .tl-i small{ display:block; color:var(--muted); font-size:12px; } .tl-i .when{ margin-left:auto; font-size:12px; color:#94a3b8; white-space:nowrap; }
  .chart{ width:100%; height:270px; } .gauges{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; } .gz{ text-align:center; } .gz .g{ height:150px; } .gz b{ font-size:13px; color:var(--ink); }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr !important; } .cmms-body{ padding:16px 14px 30px; } .cal{ grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:140px; overflow-x:auto; } .cmms-top .right .clock{ display:none; } }
</style>
</head>
<body>
<header class="cmms-top">
  <div class="bar">
    <div class="cmms-brand"><span class="cmms-logo"><span class="material-symbols-outlined">build</span></span><div><b>設備維護管理</b><small>CMMS · Predictive Maintenance</small></div></div>
    <span class="cmms-live"><span class="dot"></span>32 台設備連線中</span>
    <div class="right"><span class="clock"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-4px;">schedule</span> 2026-07-23 09:20</span><span class="cmms-ava">維</span></div>
  </div>
  <nav class="cmms-tabs" id="tabs"></nav>
</header>
<main class="cmms-body" id="view"></main>
<script>
const EQ=[{id:"CNC-01",name:"CNC 加工中心 #1",st:"run",oee:88,next:"08/02 PM",tag:"運轉中"},{id:"PUN-02",name:"沖床 #2",st:"warn",oee:64,next:"07/25 保養",tag:"預兆警示"},{id:"INJ-03",name:"射出成型 #3",st:"run",oee:81,next:"08/10 PM",tag:"運轉中"},{id:"WELD-04",name:"焊接機器人 #4",st:"down",oee:0,next:"維修中",tag:"停機"},{id:"AGV-05",name:"AGV 搬運車 #5",st:"run",oee:92,next:"08/05 PM",tag:"運轉中"},{id:"AIR-06",name:"空壓機 #6",st:"warn",oee:71,next:"07/24 點檢",tag:"預兆警示"},{id:"COOL-07",name:"冷卻塔 #7",st:"run",oee:85,next:"08/08 PM",tag:"運轉中"},{id:"CONV-08",name:"輸送帶 #8",st:"run",oee:79,next:"08/12 PM",tag:"運轉中"}];
const WO=[{id:"WO-2401",eq:"WELD-04 焊接機器人",issue:"主軸異音、振動超標",pri:"high",stage:"受理故障",own:"李維修"},{id:"WO-2402",eq:"PUN-02 沖床",issue:"液壓壓力不足",pri:"high",stage:"派工維修",own:"陳志明"},{id:"WO-2403",eq:"AIR-06 空壓機",issue:"溫度偏高、濾網待換",pri:"mid",stage:"派工維修",own:"林技師"},{id:"WO-2404",eq:"CNC-01 加工中心",issue:"定期保養（2000 工時）",pri:"low",stage:"試車確認",own:"黃俊傑"},{id:"WO-2405",eq:"CONV-08 輸送帶",issue:"皮帶張力調整",pri:"mid",stage:"試車確認",own:"王明德"},{id:"WO-2406",eq:"COOL-07 冷卻塔",issue:"風扇軸承更換",pri:"low",stage:"復機完成",own:"李維修"}];
const WOS=["受理故障","派工維修","試車確認","復機完成"];
const PARTS=[{name:"主軸軸承 6205",stk:8,min:10},{name:"液壓油封組",stk:24,min:15},{name:"空壓濾芯",stk:3,min:8},{name:"焊接電極片",stk:42,min:20},{name:"皮帶 A-88",stk:6,min:6},{name:"風扇軸承 6203",stk:2,min:6},{name:"感測器 PT100",stk:18,min:10},{name:"潤滑油 ISO46",stk:12,min:10}];
const KPI=[{l:"非計畫停機",v:"5.6",u:"小時/月",d:"−75%・較導入前 23",ic:"power_off"},{l:"保養準時率",v:"90",u:"%",d:"+27%・較導入前 71%",ic:"event_available"},{l:"備品缺料",v:"1.9",u:"次/月",d:"−80%・較導入前 9.4",ic:"inventory_2"},{l:"平均修復 MTTR",v:"24",u:"分鐘",d:"−72%・較導入前 85",ic:"timer"}];
const av=n=>`<span class="av">${n.slice(-1)}</span>`;
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l"><span class="material-symbols-outlined">${k.ic}</span>${k.l}</div><div class="v">${k.v}<small>${k.u}</small></div><div class="d">${k.d}</div></div>`).join("")}</div>`;
const eqGrid=()=>`<div class="eq-grid">${EQ.map(e=>{const cls=e.st==="down"?"down":e.st==="warn"?"warn":"";const stc=e.st==="down"?"st-down":e.st==="warn"?"st-warn":"st-run";const bar=e.st==="down"?"#dc2626":e.st==="warn"?"#f59e0b":"#16a34a";return `<div class="eq ${cls}"><div class="eq-top"><b>${e.id}</b><span class="eq-st ${stc}">${e.tag}</span></div><div class="eq-meta">${e.name}</div><div class="eq-oee">OEE<div class="eq-bar"><span style="width:${e.oee}%;background:${bar};"></span></div><b>${e.oee}%</b></div><div class="eq-next"><span class="material-symbols-outlined">event</span>下次：${e.next}</div></div>`;}).join("")}</div>`;
function cal(){const days=["一","二","三","四","五","六","日"];const ev=[[["pm","CNC-01 PM","黃俊傑"]],[["fix","PUN-02 保養","陳志明"],["insp","AIR-06 點檢","林技師"]],[["insp","全廠巡檢","李維修"]],[],[["pm","AGV-05 PM","王明德"]],[["fix","焊接校正","李維修"]],[]];return `<div class="cal">${days.map((d,i)=>`<div class="cal-col"><div class="cal-h">週${d}<small>7/${23+i}</small></div>${(ev[i]||[]).map(e=>`<div class="cal-ev ${e[0]}">${e[1]}<small>${e[2]}</small></div>`).join("")}</div>`).join("")}</div>`;}
const SCREENS={
 s0:()=>kpiRow()+`<div class="grid" style="grid-template-columns:1.7fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">precision_manufacturing</span>設備健康總覽<span class="grow">全部設備 ›</span></h3>${eqGrid()}</div><div class="card"><h3><span class="material-symbols-outlined">warning</span>預兆與異常警示</h3><div class="alert"><span class="alert-ic a-red"><span class="material-symbols-outlined">error</span></span><div><p><b>WELD-04</b> 主軸振動 8.2mm/s 超標，已自動開立維修工單。</p><small>3 分鐘前</small></div></div><div class="alert"><span class="alert-ic a-amber"><span class="material-symbols-outlined">thermostat</span></span><div><p><b>AIR-06</b> 出口溫度連續上升，建議 24 小時內點檢濾網。</p><small>26 分鐘前</small></div></div><div class="alert"><span class="alert-ic a-amber"><span class="material-symbols-outlined">vibration</span></span><div><p><b>PUN-02</b> 液壓壓力偏低，預估 7 天內需保養。</p><small>1 小時前</small></div></div><div class="alert"><span class="alert-ic a-blue"><span class="material-symbols-outlined">event_available</span></span><div><p><b>CNC-01</b> 已達 2000 工時，PM 保養已排入 08/02。</p><small>今日</small></div></div></div></div><div class="card" style="margin-top:18px;"><h3><span class="material-symbols-outlined">calendar_month</span>本週保養排程</h3>${cal()}</div>`,
 s1:()=>`<div class="kb">${WOS.map(s=>{const it=WO.filter(w=>w.stage===s);return `<div class="kb-col"><div class="kb-h">${s}<span class="c">${it.length}</span></div>${it.map(w=>`<div class="wo"><div class="wo-top"><b>${w.id}</b><span class="wo-pri p-${w.pri==="high"?"high":w.pri==="mid"?"mid":"low"}">${w.pri==="high"?"緊急":w.pri==="mid"?"一般":"低"}</span></div><p>${w.eq}<br/><span style="color:var(--muted);">${w.issue}</span></p><div class="wo-foot"><span class="wo-own">${av(w.own)}${w.own}</span></div></div>`).join("")||'<div style="font-size:12px;color:#94a3b8;padding:8px 4px;">—</div>'}</div>`;}).join("")}</div>`,
 s2:()=>`<div class="grid" style="grid-template-columns:1fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">vibration</span>WELD-04 主軸振動 (mm/s)</h3><div id="cVib" class="chart"></div></div><div class="card"><h3><span class="material-symbols-outlined">thermostat</span>AIR-06 出口溫度 (°C)</h3><div id="cTmp" class="chart"></div></div></div><div class="card" style="margin-top:18px;"><h3><span class="material-symbols-outlined">sensors</span>異常偵測清單</h3><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>設備</th><th>感測項目</th><th>目前值</th><th>門檻</th><th>狀態</th><th>建議</th></tr></thead><tbody><tr><td>WELD-04</td><td>主軸振動</td><td style="color:#dc2626;font-weight:800;">8.2 mm/s</td><td>6.0</td><td><span class="eq-st st-down">超標</span></td><td>立即停機檢修</td></tr><tr><td>AIR-06</td><td>出口溫度</td><td style="color:#d97706;font-weight:800;">78 °C</td><td>75</td><td><span class="eq-st st-warn">偏高</span></td><td>24h 內點檢濾網</td></tr><tr><td>PUN-02</td><td>液壓壓力</td><td style="color:#d97706;font-weight:800;">11.2 MPa</td><td>12.0</td><td><span class="eq-st st-warn">偏低</span></td><td>7 天內保養</td></tr><tr><td>CNC-01</td><td>主軸溫度</td><td style="color:#16a34a;font-weight:800;">42 °C</td><td>60</td><td><span class="eq-st st-run">正常</span></td><td>—</td></tr></tbody></table></div></div>`,
 s3:()=>`<div class="parts">${PARTS.map(p=>{const pct=Math.min(100,Math.round(p.stk/(p.min*2)*100));const low=p.stk<=p.min;return `<div class="part"><div class="part-t"><b>${p.name}</b>${low?'<span class="low-tag">需補貨</span>':""}</div><div class="eq-bar" style="height:8px;margin-bottom:8px;"><span style="width:${pct}%;background:${low?"#dc2626":"#16a34a"};"></span></div><small>現有 ${p.stk} · 安全量 ${p.min}</small></div>`;}).join("")}</div>`,
 s4:()=>kpiRow()+`<div class="card" style="margin-bottom:18px;"><h3><span class="material-symbols-outlined">speed</span>整線 OEE 三要素</h3><div class="gauges"><div class="gz"><div id="gA" class="g"></div><b>稼動率</b></div><div class="gz"><div id="gP" class="g"></div><b>效率</b></div><div class="gz"><div id="gQ" class="g"></div><b>良率</b></div><div class="gz"><div id="gO" class="g"></div><b>綜合 OEE</b></div></div></div><div class="grid" style="grid-template-columns:1.5fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 6 週 OEE 趨勢</h3><div id="cOee" class="chart"></div></div><div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>停機原因分佈</h3><div id="cStop" class="chart"></div></div></div>`,
 s5:()=>{const H=[["build","#f59e0b","WELD-04 更換主軸軸承","李維修 · 耗時 46 分 · 領用軸承 6205 ×2","今日 08:40"],["event_available","#16a34a","CNC-01 完成 2000 工時 PM 保養","黃俊傑 · 潤滑、精度校正、濾網更換","07/22 15:10"],["warning","#dc2626","PUN-02 液壓異常停機","系統自動偵測 · 已開立 WO-2402","07/22 09:05"],["swap_horiz","#0891b2","AIR-06 更換空壓濾芯","林技師 · 溫度回穩至 68°C","07/20 11:30"],["check_circle","#16a34a","COOL-07 風扇軸承更換完成復機","李維修 · 試車正常","07/19 16:20"]];return `<div class="card"><h3><span class="material-symbols-outlined">history</span>設備維護履歷（全廠）</h3><div class="tl">${H.map(h=>`<div class="tl-i"><span class="tl-dot" style="background:${h[1]};"><span class="material-symbols-outlined" style="font-size:12px;">${h[0]}</span></span><div><b>${h[2]}</b><small>${h[3]}</small></div><span class="when">${h[4]}</span></div>`).join("")}</div></div>`;}
};
const MODS=[["event_repeat","保養排程","預防保養自動排程與設備健康總覽"],["build","維修工單","報修、派工到復機的維修流程"],["sensors","預兆診斷","設備數據異常預警與感測趨勢"],["inventory_2","備品管理","備品庫存與領用管理"],["speed","OEE 稼動","稼動、效率、良率即時分析"],["history","履歷追溯","設備維護履歷與追溯"]];
let charts=[];
function draw(i){charts.forEach(c=>{try{c.dispose();}catch(e){}});charts=[];if(!window.echarts)return;
 const g=(id,val,color)=>{const el=document.getElementById(id);if(!el)return;const c=echarts.init(el);c.setOption({series:[{type:"gauge",radius:"96%",center:["50%","60%"],startAngle:210,endAngle:-30,min:0,max:100,progress:{show:true,width:12,itemStyle:{color}},axisLine:{lineStyle:{width:12,color:[[1,"#eef2f7"]]}},pointer:{show:false},axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},detail:{valueAnimation:true,formatter:"{value}%",fontSize:24,fontWeight:"bolder",offsetCenter:[0,0],color:"#0f172a"},data:[{value:val}]}]});charts.push(c);};
 const line=(id,data,color)=>{const el=document.getElementById(id);if(!el)return;const c=echarts.init(el);c.setOption({grid:{left:8,right:18,top:20,bottom:8,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",boundaryGap:false,data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLabel:{color:"#64748b"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef2f7"}},axisLabel:{color:"#64748b"}},series:[{type:"line",smooth:true,data,symbolSize:7,itemStyle:{color},lineStyle:{color,width:3},areaStyle:{color:color+"22"}}]});charts.push(c);};
 if(i===2){line("cVib",[3.1,3.6,4.2,5.5,6.8,8.2],"#dc2626");line("cTmp",[64,67,70,72,75,78],"#d97706");}
 if(i===4){g("gA",91,"#0891b2");g("gP",86,"#f59e0b");g("gQ",98,"#16a34a");g("gO",77,"#7c3aed");line("cOee",[68,71,74,75,76,77],"#0891b2");const el=document.getElementById("cStop");if(el){const c=echarts.init(el);c.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},data:[{name:"故障停機",value:38,itemStyle:{color:"#dc2626"}},{name:"計畫保養",value:30,itemStyle:{color:"#0891b2"}},{name:"換模換線",value:20,itemStyle:{color:"#f59e0b"}},{name:"待料",value:12,itemStyle:{color:"#94a3b8"}}]}]});charts.push(c);}}
}
const view=document.getElementById("view"),tabs=document.getElementById("tabs");
tabs.innerHTML=MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}</button>`).join("");
function show(i){tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));const act=i===0?'<button class="btn"><span class="material-symbols-outlined">add</span>新增保養工單</button>':i===1?'<button class="btn"><span class="material-symbols-outlined">add</span>開立維修工單</button>':i===3?'<button class="btn"><span class="material-symbols-outlined">add_shopping_cart</span>採購申請</button>':'';view.innerHTML=`<div class="view-h"><div><h1>${MODS[i][1]}</h1><p>${MODS[i][2]}</p></div>${act}</div>`+SCREENS["s"+i]();draw(i);}
tabs.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
