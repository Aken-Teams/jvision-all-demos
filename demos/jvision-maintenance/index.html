<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>設備維護管理 · CMMS｜Jvision 系統 Demo</title>
<meta name="description" content="保養、維修、預兆到備品的設備全生命週期管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#16A34A;--color-on-primary:#000000;
  --color-secondary:#22C55E;--color-on-secondary:#0F172A;
  --color-accent:#DC2626;--color-on-accent:#FFFFFF;
  --color-background:#F0FDF4;--color-foreground:#14532D;
  --color-card:#FFFFFF;--color-card-foreground:#14532D;
  --color-muted:#E8F0F1;--color-muted-foreground:#475569;
  --color-border:#BBF7D0;--color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;--color-ring:#16A34A;
  --blue:#16A34A;--ink:#102A1B;--muted:#52635A;--line:#9BD8AF;
  --amber:#B45309;--green:#15803D;--red:#B91C1C;--cyan:#0369A1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--color-background)}
body{
  font-family:Inter,"Microsoft JhengHei",sans-serif;
  color:var(--ink);background-color:var(--color-background);
  background-image:linear-gradient(rgba(20,83,45,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(20,83,45,.055) 1px,transparent 1px);
  background-size:24px 24px;-webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  line-height:1
}
.cmms-top{
  position:sticky;top:0;z-index:30;color:#fff;
  background:#102A1B;border-bottom:4px solid var(--color-primary)
}
.cmms-top .bar{
  min-height:68px;padding:0 24px;display:flex;align-items:center;gap:18px;
  border-bottom:1px solid #3D6A4D
}
.cmms-brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.cmms-logo{
  width:44px;height:44px;display:grid;place-content:center;
  background:var(--color-secondary);color:#07180D;border:2px solid #07180D;
  box-shadow:5px 5px 0 #07180D
}
.cmms-brand b{display:block;color:#fff;font-size:16px;font-weight:800;letter-spacing:.02em}
.cmms-brand small{
  display:block;margin-top:3px;color:#B7D9C2;font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase
}
.cmms-live{
  display:inline-flex;align-items:center;gap:8px;padding:6px 10px;
  color:#D8FFE4;background:#183D25;border:1px solid #6ED88E;
  font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700
}
.cmms-live .dot{
  width:9px;height:9px;background:#4ADE80;border:2px solid #102A1B;
  outline:1px solid #4ADE80
}
.cmms-top .right{
  margin-left:auto;display:flex;align-items:center;gap:14px;
  color:#D4EADB;font-size:12px
}
.clock{font-family:"JetBrains Mono",monospace}
.cmms-ava{
  width:36px;height:36px;display:grid;place-content:center;
  color:#102A1B;background:#FBBF24;border:2px solid #fff;font-weight:800
}
.cmms-tabs{
  display:flex;gap:0;padding:0 20px;overflow-x:auto;
  scrollbar-width:thin;scrollbar-color:#4ADE80 #102A1B
}
.cmms-tabs button{
  min-height:50px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;
  border:0;border-left:1px solid #365B43;border-right:1px solid transparent;
  background:transparent;color:#C4DDCC;font-size:13px;font-weight:700;
  white-space:nowrap
}
.cmms-tabs button:last-child{border-right-color:#365B43}
.cmms-tabs button:hover{background:#1C482B;color:#fff}
.cmms-tabs button.on{
  background:var(--color-secondary);color:#07180D;
  box-shadow:inset 0 -5px 0 #07180D
}
.cmms-tabs button .material-symbols-outlined{font-size:19px}
.cmms-body{width:min(100%,1440px);margin:auto;padding:26px 28px 52px}
.view-h{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin-bottom:20px;padding:18px 20px;background:#fff;
  border:2px solid var(--ink);box-shadow:7px 7px 0 var(--color-primary)
}
.view-h h1{
  margin:0;color:var(--ink);font-size:clamp(24px,3vw,40px);
  font-weight:800;letter-spacing:-.045em;line-height:1
}
.view-h h1::after{
  content:" /";font-family:"Playfair Display",serif;font-style:italic;
  color:var(--color-primary);font-weight:400
}
.view-h p{margin:9px 0 0;color:var(--muted);font-size:13px}
.btn{
  min-height:44px;padding:0 17px;display:inline-flex;align-items:center;gap:8px;
  flex:none;border:2px solid #490606;background:var(--color-accent);
  color:var(--color-on-accent);font-weight:800;font-size:13px;
  box-shadow:4px 4px 0 #490606
}
.btn:hover{background:#B91C1C;transform:translate(2px,2px);box-shadow:2px 2px 0 #490606}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;margin-bottom:20px
}
.kpi{
  position:relative;min-width:0;padding:16px 17px;background:var(--color-card);
  border:2px solid var(--ink);box-shadow:4px 4px 0 var(--line)
}
.kpi:nth-child(even){transform:translateY(7px)}
.kpi::before{
  content:"";position:absolute;left:-2px;top:-2px;width:10px;height:calc(100% + 4px);
  background:var(--color-primary);border:2px solid var(--ink)
}
.kpi .l{
  display:flex;align-items:center;gap:7px;margin-left:7px;
  color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase
}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--green)}
.kpi .v{
  margin:10px 0 0 7px;color:var(--ink);font-family:"JetBrains Mono",monospace;
  font-size:29px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums
}
.kpi .v small{margin-left:4px;color:var(--muted);font-family:Inter,sans-serif;font-size:12px;font-weight:700}
.kpi .d{margin:5px 0 0 7px;color:#166534;font-size:11px;font-weight:800}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.card{
  min-width:0;padding:18px 20px;background:var(--color-card);
  border:2px solid var(--ink);box-shadow:5px 5px 0 var(--line)
}
.card>h3{
  margin:-18px -20px 16px;padding:12px 15px;display:flex;align-items:center;gap:8px;
  color:#fff;background:#173B24;border-bottom:2px solid var(--ink);
  font-size:13px;font-weight:800;letter-spacing:.02em
}
.card>h3 .material-symbols-outlined{color:#5AF080;font-size:20px}
.card>h3 .grow{
  margin-left:auto;color:#C9F8D5;font-size:11px;font-weight:700;
  text-decoration:underline;text-underline-offset:3px
}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.eq{
  position:relative;padding:13px;background:#F7FFF9;border:1px solid var(--ink);
  border-left:8px solid var(--green)
}
.eq.warn{border-left-color:#D97706}
.eq.down{border-left-color:var(--red)}
.eq-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eq-top b,.wo-top b{
  color:var(--ink);font-family:"JetBrains Mono",monospace;
  font-size:13px;font-variant-numeric:tabular-nums
}
.eq-st,.wo-pri,.low-tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
  border:1px solid currentColor;font-size:10px;font-weight:800;white-space:nowrap
}
.eq-st::before,.wo-pri::before,.low-tag::before{font-size:9px}
.st-run{color:#166534;background:#DCFCE7}
.st-run::before{content:"✓"}
.st-warn{color:#78350F;background:#FEF3C7}
.st-warn::before{content:"!"}
.st-down{color:#991B1B;background:#FEE2E2}
.st-down::before{content:"×"}
.eq-meta{margin:8px 0 11px;color:var(--muted);font-size:11px}
.eq-oee{display:flex;align-items:center;gap:8px;font-size:11px}
.eq-oee>b{min-width:36px;text-align:right;font-family:"JetBrains Mono",monospace}
.eq-bar{flex:1;height:9px;overflow:hidden;background:#D8E7DD;border:1px solid #789483}
.eq-bar span{display:block;height:100%}
.eq-next{
  margin-top:10px;display:flex;align-items:center;gap:5px;color:var(--muted);
  font-family:"JetBrains Mono",monospace;font-size:10px
}
.eq-next .material-symbols-outlined{font-size:15px}
.alert{display:flex;gap:11px;padding:12px 0;border-top:1px dashed #8DAE99}
.alert:first-of-type{border-top:0}
.alert-ic{
  width:35px;height:35px;display:grid;place-content:center;flex:none;
  border:1px solid currentColor
}
.a-red{color:#991B1B;background:#FEE2E2}
.a-amber{color:#78350F;background:#FEF3C7}
.a-blue{color:#075985;background:#E0F2FE}
.alert p{margin:0;color:#273F31;font-size:12px;line-height:1.5}
.alert b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.alert small{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-col{min-height:150px;padding:8px;background:#F7FFF9;border:1px solid var(--ink)}
.cal-h{
  margin:-8px -8px 8px;padding:8px;text-align:center;color:var(--ink);
  background:var(--color-muted);border-bottom:1px solid var(--ink);
  font-size:11px;font-weight:800
}
.cal-h small{
  display:block;margin-top:2px;color:var(--muted);
  font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:500
}
.cal-ev{margin-bottom:5px;padding:7px;color:#fff;border:1px solid #102A1B;font-size:10px;font-weight:700}
.cal-ev small{display:block;margin-top:3px;font-weight:500}
.pm{background:#075985}.fix{background:#9A5B08}.insp{background:#166534}
.kb{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(245px,1fr);
  gap:10px;overflow-x:auto;padding:0 0 8px
}
.kb-col{padding:10px;background:#DCEBE1;border:2px solid var(--ink)}
.kb-h{
  display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;
  color:var(--ink);font-size:13px;font-weight:800
}
.kb-h .c{
  min-width:25px;padding:2px 7px;text-align:center;color:#07180D;
  background:#4ADE80;border:1px solid var(--ink);font-family:"JetBrains Mono",monospace;font-size:10px
}
.wo{margin-bottom:8px;padding:11px;background:#fff;border:1px solid var(--ink);box-shadow:3px 3px 0 #8EB39A}
.wo-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.p-high{color:#991B1B;background:#FEE2E2}.p-high::before{content:"↑"}
.p-mid{color:#78350F;background:#FEF3C7}.p-mid::before{content:"="}
.p-low{color:#075985;background:#E0F2FE}.p-low::before{content:"↓"}
.wo p{margin:7px 0 9px;color:#273F31;font-size:11px;line-height:1.5}
.wo-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.wo-own{display:inline-flex;align-items:center;gap:6px}
.av{
  width:23px;height:23px;display:grid;place-content:center;
  color:#422006;background:#FBBF24;border:1px solid #422006;font-size:9px;font-weight:800
}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:10px 11px;text-align:left;color:#fff;background:#173B24;
  border:1px solid #456B52;font-size:10px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap
}
.tbl td{padding:11px;border:1px solid #A8CDB4;white-space:nowrap}
.tbl tbody tr:nth-child(even) td{background:#F0FAF3}
.tbl tbody tr:hover td{background:#DCFCE7}
.tbl th:nth-child(3),.tbl th:nth-child(4),
.tbl td:nth-child(3),.tbl td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
.tbl td:first-child,.tbl td:nth-child(3),.tbl td:nth-child(4){
  font-family:"JetBrains Mono",monospace
}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.part{padding:14px;background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--line)}
.part-t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.part-t b{color:var(--ink);font-size:12px}
.part small{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10px}
.low-tag{color:#991B1B;background:#FEE2E2}.low-tag::before{content:"!"}
.tl{position:relative}
.tl-i{position:relative;display:flex;gap:14px;padding:0 0 20px}
.tl-i:not(:last-child)::before{
  content:"";position:absolute;left:11px;top:24px;bottom:0;
  width:3px;background:#6DA97F
}
.tl-dot{
  width:25px;height:25px;display:grid;place-content:center;flex:none;
  color:#fff;border:2px solid var(--ink);z-index:1
}
.tl-i b{color:var(--ink);font-size:12px}
.tl-i small{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.tl-i .when{
  margin-left:auto;color:var(--muted);font-family:"JetBrains Mono",monospace;
  font-size:10px;white-space:nowrap
}
.chart{width:100%;height:270px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}
.gz{text-align:center;border-right:1px dashed #8DAE99}
.gz:last-child{border-right:0}
.gz .g{height:150px}
.gz b{color:var(--ink);font-size:12px}
@media (prefers-reduced-motion:no-preference){
  .view-h,.kpi,.card,.kb-col,.part{animation:reveal .35s ease-out both}
  .kpi:nth-child(2),.card:nth-child(2){animation-delay:.04s}
  .kpi:nth-child(3){animation-delay:.08s}
  .kpi:nth-child(4){animation-delay:.12s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .kpi:nth-child(even){transform:none}
}
@media (max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .gauges{grid-template-columns:repeat(2,1fr)}
  .gz:nth-child(2){border-right:0}
}
@media (max-width:820px){
  .cmms-top .bar{padding:10px 14px;flex-wrap:wrap;gap:10px}
  .cmms-top .right{margin-left:auto}.clock{display:none}
  .cmms-live{order:3;width:100%;justify-content:center}
  .cmms-tabs{padding:0}
  .cmms-body{padding:17px 14px 36px}
  .grid{grid-template-columns:1fr!important}
  .cal{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:145px;overflow-x:auto}
}
@media (max-width:520px){
  .cmms-brand small{display:none}
  .view-h{align-items:flex-start;padding:15px;box-shadow:5px 5px 0 var(--color-primary)}
  .view-h h1{font-size:26px}
  .view-h p{max-width:220px}
  .btn{width:44px;padding:0;justify-content:center;font-size:0}
  .btn .material-symbols-outlined{font-size:20px}
  .kpis{grid-template-columns:1fr}
  .kpi:nth-child(even){transform:none}
  .gauges{grid-template-columns:1fr 1fr}
  .card{padding:16px}
  .card>h3{margin:-16px -16px 15px}
  .tl-i{gap:9px}.tl-i .when{font-size:9px}
}
</style>
</head>
<body>
<header class="cmms-top">
  <div class="bar">
    <div class="cmms-brand">
      <span class="cmms-logo"><span class="material-symbols-outlined">build</span></span>
      <div><b>設備維護管理</b><small>CMMS · Predictive Maintenance</small></div>
    </div>
    <span class="cmms-live"><span class="dot" aria-hidden="true"></span>32 台設備連線中</span>
    <div class="right">
      <span class="clock"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-4px">schedule</span> 2026-07-23 09:20</span>
      <span class="cmms-ava">維</span>
    </div>
  </div>
  <nav class="cmms-tabs" id="tabs" aria-label="設備維護功能"></nav>
</header>
<main class="cmms-body" id="view"></main>
<script>
const EQ=[
{id:"CNC-01",name:"CNC 加工中心 #1",st:"run",oee:88,next:"08/02 PM",tag:"運轉中"},
{id:"PUN-02",name:"沖床 #2",st:"warn",oee:64,next:"07/25 保養",tag:"預兆警示"},
{id:"INJ-03",name:"射出成型 #3",st:"run",oee:81,next:"08/10 PM",tag:"運轉中"},
{id:"WELD-04",name:"焊接機器人 #4",st:"down",oee:0,next:"維修中",tag:"停機"},
{id:"AGV-05",name:"AGV 搬運車 #5",st:"run",oee:92,next:"08/05 PM",tag:"運轉中"},
{id:"AIR-06",name:"空壓機 #6",st:"warn",oee:71,next:"07/24 點檢",tag:"預兆警示"},
{id:"COOL-07",name:"冷卻塔 #7",st:"run",oee:85,next:"08/08 PM",tag:"運轉中"},
{id:"CONV-08",name:"輸送帶 #8",st:"run",oee:79,next:"08/12 PM",tag:"運轉中"}];

const WO=[
{id:"WO-2401",eq:"WELD-04 焊接機器人",issue:"主軸異音、振動超標",pri:"high",stage:"受理故障",own:"李維修"},
{id:"WO-2402",eq:"PUN-02 沖床",issue:"液壓壓力不足",pri:"high",stage:"派工維修",own:"陳志明"},
{id:"WO-2403",eq:"AIR-06 空壓機",issue:"溫度偏高、濾網待換",pri:"mid",stage:"派工維修",own:"林技師"},
{id:"WO-2404",eq:"CNC-01 加工中心",issue:"定期保養（2000 工時）",pri:"low",stage:"試車確認",own:"黃俊傑"},
{id:"WO-2405",eq:"CONV-08 輸送帶",issue:"皮帶張力調整",pri:"mid",stage:"試車確認",own:"王明德"},
{id:"WO-2406",eq:"COOL-07 冷卻塔",issue:"風扇軸承更換",pri:"low",stage:"復機完成",own:"李維修"}];

const WOS=["受理故障","派工維修","試車確認","復機完成"];

const PARTS=[
{name:"主軸軸承 6205",stk:8,min:10},{name:"液壓油封組",stk:24,min:15},
{name:"空壓濾芯",stk:3,min:8},{name:"焊接電極片",stk:42,min:20},
{name:"皮帶 A-88",stk:6,min:6},{name:"風扇軸承 6203",stk:2,min:6},
{name:"感測器 PT100",stk:18,min:10},{name:"潤滑油 ISO46",stk:12,min:10}];

const KPI=[
{l:"非計畫停機",v:"5.6",u:"小時/月",d:"−75%・較導入前 23",ic:"power_off"},
{l:"保養準時率",v:"90",u:"%",d:"+27%・較導入前 71%",ic:"event_available"},
{l:"備品缺料",v:"1.9",u:"次/月",d:"−80%・較導入前 9.4",ic:"inventory_2"},
{l:"平均修復 MTTR",v:"24",u:"分鐘",d:"−72%・較導入前 85",ic:"timer"}];

const av=n=>`<span class="av">${n.slice(-1)}</span>`;

const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`
<div class="kpi">
  <div class="l"><span class="material-symbols-outlined">${k.ic}</span>${k.l}</div>
  <div class="v">${k.v}<small>${k.u}</small></div>
  <div class="d">${k.d}</div>
</div>`).join("")}</div>`;

const eqGrid=()=>`<div class="eq-grid">${EQ.map(e=>{
  const cls=e.st==="down"?"down":e.st==="warn"?"warn":"";
  const stc=e.st==="down"?"st-down":e.st==="warn"?"st-warn":"st-run";
  const bar=e.st==="down"?"#B91C1C":e.st==="warn"?"#B45309":"#15803D";
  return `<div class="eq ${cls}">

let charts=[];

function draw(i){
  charts.forEach(c=>{try{c.dispose()}catch(e){}});
  charts=[];
  if(!window.echarts)return;

  const axisColor="#52635A",gridColor="#D2E7D8",ink="#102A1B";

  const g=(id,val,color)=>{
    const el=document.getElementById(id);
    if(!el)return;
    const c=echarts.init(el);
    c.setOption({
      animation:!matchMedia("(prefers-reduced-motion: reduce)").matches,
      series:[{
        type:"gauge",radius:"96%",center:["50%","60%"],startAngle:210,endAngle:-30,min:0,max:100,
        progress:{show:true,width:12,itemStyle:{color}},
        axisLine:{lineStyle:{width:12,color:[[1,"#D8E7DD"]]}},
        pointer:{show:false},axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},
        detail:{valueAnimation:false,formatter:"{value}%",fontSize:23,fontFamily:"JetBrains Mono",fontWeight:"bold",offsetCenter:[0,0],color:ink},
        data:[{value:val}]
      }]
    });
    charts.push(c);
  };

  const line=(id,data,color)=>{
    const el=document.getElementById(id);
    if(!el)return;
    const c=echarts.init(el);
    c.setOption({
      animation:!matchMedia("(prefers-reduced-motion: reduce)").matches,
      grid:{left:8,right:18,top:20,bottom:8,containLabel:true},
      tooltip:{trigger:"axis"},
      xAxis:{
        type:"category",boundaryGap:false,
        data:["第1週","第2週","第3週","第4週","第5週","第6週"],
        axisLine:{lineStyle:{color:"#789483"}},axisLabel:{color:axisColor,fontFamily:"JetBrains Mono"}
      },
      yAxis:{
        type:"value",splitLine:{lineStyle:{color:gridColor,type:"dashed"}},
        axisLabel:{color:axisColor,fontFamily:"JetBrains Mono"}
      },
      series:[{
        type:"line",smooth:false,data,symbol:"rect",symbolSize:8,
        itemStyle:{color,borderColor:ink,borderWidth:1},
        lineStyle:{color,width:3},areaStyle:{color:color+"24"}
      }]
    });
    charts.push(c);
  };

  if(i===2){
    line("cVib",[3.1,3.6,4.2,5.5,6.8,8.2],"#B91C1C");
    line("cTmp",[64,67,70,72,75,78],"#B45309");
  }

  if(i===4){
    g("gA",91,"#0369A1");
    g("gP",86,"#B45309");
    g("gQ",98,"#15803D");
    g("gO",77,"#6D28D9");
    line("cOee",[68,71,74,75,76,77],"#0369A1");

    const el=document.getElementById("cStop");
    if(el){
      const c=echarts.init(el);
      c.setOption({
        animation:!matchMedia("(prefers-reduced-motion: reduce)").matches,
        tooltip:{trigger:"item"},
        legend:{bottom:0,textStyle:{fontSize:11,color:ink}},
        series:[{
          type:"pie",radius:["46%","72%"],center:["50%","44%"],
          itemStyle:{borderColor:"#102A1B",borderWidth:2},
          label:{show:false},
          data:[
            {name:"故障停機",value:38,itemStyle:{color:"#B91C1C"}},
            {name:"計畫保養",value:30,itemStyle:{color:"#0369A1"}},
            {name:"換模換線",value:20,itemStyle:{color:"#B45309"}},
            {name:"待料",value:12,itemStyle:{color:"#64748B"}}
          ]
        }]
      });
      charts.push(c);
    }
  }
}

const view=document.getElementById("view");
const tabs=document.getElementById("tabs");

tabs.innerHTML=MODS.map((m,i)=>`
<button type="button" data-i="${i}" class="${i===0?"on":""}" aria-current="${i===0?"page":"false"}">
  <span class="material-symbols-outlined">${m[0]}</span>${m[1]}
</button>`).join("");

function show(i){
  tabs.querySelectorAll("button").forEach(b=>{
    const active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });

  const act=i===0
    ?'<button type="button" class="btn"><span class="material-symbols-outlined">add</span>新增保養工單</button>'
    :i===1
      ?'<button type="button" class="btn"><span class="material-symbols-outlined">add</span>開立維修工單</button>'
      :i===3
        ?'<button type="button" class="btn"><span class="material-symbols-outlined">add_shopping_cart</span>採購申請</button>'
        :'';

  view.innerHTML=`<div class="view-h"><div><h1>${MODS[i][1]}</h1><p>${MODS[i][2]}</p></div>${act}</div>`+SCREENS["s"+i]();
  draw(i);
}

tabs.addEventListener("click",e=>{
  const b=e.target.closest("button[data-i]");
  if(!b)return;
  const i=+b.dataset.i;
  if(location.hash!==`#v${i}`)location.hash=`v${i}`;
  else show(i);
});

tabs.addEventListener("keydown",e=>{
  const items=[...tabs.querySelectorAll("button[data-i]")];
  const current=items.indexOf(document.activeElement);
  if(current<0)return;
  let next=current;
  if(e.key==="ArrowRight")next=(current+1)%items.length;
  else if(e.key==="ArrowLeft")next=(current-1+items.length)%items.length;
  else if(e.key==="Home")next=0;
  else if(e.key==="End")next=items.length-1;
  else return;
  e.preventDefault();
  items[next].focus();
});

window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));

function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  const n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}

window.addEventListener("hashchange",fromHash);
fromHash();
</script>
