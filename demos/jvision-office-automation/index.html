<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>辦公流程自動化 · Jvision 企業協同辦公平台</title>
<meta name="description" content="任務、專案、知識到流程自動化的團隊協作">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --good:#067647;
  --warn:#9A3412;
  --bad:#B91C1C;
  --violet:#6D28D9;
  --cyan:#075985;
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[role=button],.ktask,.chan,.tg{cursor:pointer}
button:focus-visible,[role=button]:focus-visible,.ktask:focus-visible,.chan:focus-visible,.tg:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:500;font-style:normal;font-size:1.25rem;line-height:1;vertical-align:middle}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px;background:var(--ink);color:#fff;border-right:4px solid #000}
.brand{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:0 0 20px;border-bottom:2px solid var(--color-secondary)}
.logo{width:48px;height:48px;display:grid;place-items:center;background:var(--color-secondary);color:#000;border:2px solid #000;box-shadow:5px 5px 0 var(--color-accent)}
.brand h1{margin:0;font-size:1rem;font-weight:800;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:#CCFBF1;font-size:.72rem}
.nav{display:grid;gap:8px;margin-top:20px}
.nav button{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;color:#D5FAF4;background:transparent;border:2px solid transparent;border-radius:0;font-weight:700}
.nav button:hover{background:#115E59;border-color:var(--color-secondary)}
.nav button.active{background:var(--color-secondary);border-color:#000;color:#000;box-shadow:5px 5px 0 var(--color-accent)}
.navtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{display:flex;align-items:center;gap:11px;margin-top:auto;padding-top:18px;border-top:2px solid var(--color-secondary)}
.av,.avatar{display:inline-grid;place-items:center;flex:none;color:#fff;border:2px solid #000;border-radius:0;font-weight:800}
.av{width:38px;height:38px;background:var(--color-accent)}
.avatar{width:29px;height:29px;font-size:.68rem;vertical-align:middle}
.who{font-size:.72rem}.who b{display:block;font-size:.8rem}.who span{color:#CCFBF1}
.main{padding:30px clamp(16px,3vw,44px) 64px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;padding:18px;background:var(--color-card);border:3px solid #000;box-shadow:8px 8px 0 var(--color-primary)}
.htxt h2{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(1.45rem,3vw,2.2rem);font-weight:800;line-height:1.1;letter-spacing:-.04em}
.htxt h2 .material-symbols-outlined{padding:8px;background:var(--color-primary);color:#000;border:2px solid #000}
.htxt p{margin:8px 0 0;color:var(--muted);font-size:.83rem}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{min-height:44px;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;background:#fff;color:var(--ink);border:2px solid #000;border-radius:0;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{background:var(--color-muted);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn.primary{background:var(--color-accent);color:#000}
.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.card,.kpi{background:var(--color-card);border:3px solid #000;border-radius:0;box-shadow:6px 6px 0 var(--color-primary)}
.card{padding:19px}.kpi{position:relative;overflow:hidden;padding:16px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:.9rem;font-weight:800}
.card h3>.material-symbols-outlined{padding:5px;background:var(--color-secondary);color:#000;border:2px solid #000}
.tag{margin-left:auto;padding:3px 8px;background:var(--color-muted);border:1px solid #000;font-size:.65rem;color:var(--muted)}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:72px;height:72px;background:var(--color-secondary);border:3px solid #000;transform:rotate(12deg)}
.kpi .ic{position:relative;z-index:1;width:38px;height:38px;display:grid;place-items:center;margin-bottom:12px;background:var(--color-accent);color:#000;border:2px solid #000}
.kpi .lbl{position:relative;z-index:1;color:var(--muted);font-size:.73rem;font-weight:700}
.kpi .val{position:relative;z-index:1;font-size:1.75rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:3px;color:var(--muted);font-size:.75rem}
.delta{position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:.68rem;font-weight:800}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}.delta .material-symbols-outlined{font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{padding:10px 11px;text-align:left;white-space:nowrap;background:var(--ink);color:#fff;border:2px solid #000;font-size:.68rem;font-weight:800;letter-spacing:.04em}
td{padding:11px;border:1px solid #5EEAD4;vertical-align:middle}
tbody tr:nth-child(even){background:#F0FDFA}tbody tr:hover{background:#CCFBF1}
td:nth-last-child(-n+2){font-variant-numeric:tabular-nums}
.mono,.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.pill,.prio{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:0;white-space:nowrap;font-size:.66rem;font-weight:800}
.pill.g{background:#D1FAE5;color:#065F46}.pill.y{background:#FFEDD5;color:#9A3412}.pill.r{background:#FEE2E2;color:#991B1B}.pill.b{background:#DBEAFE;color:#1E40AF}.pill.n{background:#E2E8F0;color:#334155}
.prio.h{background:#FEE2E2;color:#991B1B}.prio.m{background:#FFEDD5;color:#9A3412}.prio.l{background:#E0F2FE;color:#075985}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kcol{min-height:130px;padding:12px;background:var(--color-muted);border:2px solid #000}
.kh{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.78rem;font-weight:800}.dot{width:11px;height:11px;border:2px solid #000}.cnt{margin-left:auto;padding:1px 7px;background:#fff;border:1px solid #000;font-size:.65rem}
.ktask{margin-bottom:10px;padding:11px;background:#fff;border:2px solid #000;box-shadow:3px 3px 0 var(--color-primary)}
.ktask:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--color-accent)}
.tt{margin-bottom:9px;font-size:.78rem;font-weight:700}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.code{font-size:.64rem;color:var(--muted)}
.gantt{min-width:650px}.grow{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--line)}.grow.head{border-bottom:3px solid #000;background:var(--ink);color:#fff}
.gname{padding:10px 12px;font-size:.76rem;font-weight:800}.gname small{display:block;color:var(--muted);font-weight:600}.grow.head .gname{color:#fff}
.gtrack{position:relative;height:46px;display:flex;align-items:center;padding:0 6px}.gscale{position:absolute;inset:0 6px;display:grid;grid-template-columns:repeat(8,1fr)}.gscale span{border-left:1px dashed #5EEAD4}
.gbar{position:absolute;height:24px;display:flex;align-items:center;padding:0 8px;color:#fff;border:2px solid #000;font-size:.65rem;font-weight:800;overflow:hidden}.gbar .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.25)}
.gcell{padding:9px 6px;text-align:center;border-left:1px solid #5EEAD4;font-size:.66rem;font-weight:800}.mstone{position:absolute;top:14px;width:17px;height:17px;border:2px solid #000;transform:rotate(45deg)}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.72rem;font-weight:700}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:12px;height:12px;border:2px solid #000}
.flowsteps{display:flex;align-items:center;min-width:560px}.fstep{position:relative;flex:1;text-align:center}.fstep::before{content:"";position:absolute;top:21px;left:-50%;width:100%;height:3px;background:#94A3B8}.fstep:first-child::before{display:none}
.node{position:relative;z-index:1;width:44px;height:44px;display:grid;place-items:center;margin:0 auto 8px;background:#fff;border:3px solid #64748B}.done .node{background:var(--good);color:#fff;border-color:#000}.now .node{background:var(--color-accent);color:#000;border-color:#000;box-shadow:4px 4px 0 var(--color-primary)}.done::before,.now::before{background:var(--good)}
.fn{font-size:.72rem;font-weight:800}.fr{font-size:.66rem;color:var(--muted)}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}.tg{padding:6px 10px;background:var(--color-muted);border:2px solid #000;font-size:.7rem;font-weight:700}.tg:hover{background:var(--color-secondary);color:#000}.tg b{color:#075E54}
.chatlist{display:grid;gap:5px}.chan{display:flex;align-items:center;gap:9px;padding:9px;border:2px solid transparent}.chan:hover,.chan.active{background:#CCFBF1;border-color:#000}.ci{width:34px;height:34px;display:grid;place-items:center;background:var(--color-secondary);border:1px solid #000}.cn{font-size:.75rem;font-weight:800}.cn small{display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.64rem}.badge{margin-left:auto;padding:1px 7px;background:var(--color-accent);color:#000;border:1px solid #000;font-size:.62rem;font-weight:800}
.msg{display:flex;gap:10px;margin-bottom:15px}.mn{margin-bottom:3px;font-size:.7rem;font-weight:800}.mn small{margin-left:6px;color:var(--muted)}.mb{padding:9px 11px;background:var(--color-muted);border:2px solid #000;font-size:.75rem}
.notif{display:flex;gap:10px;padding:11px 0;border-bottom:2px solid var(--line)}.notif:last-child{border:0}.ni{width:32px;height:32px;display:grid;place-items:center;flex:none;border:1px solid #000}.nt{font-size:.72rem}.ntime{margin-top:2px;color:var(--muted);font-size:.64rem}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}.mrow:last-child{border:0}.mi{flex:1;font-size:.76rem;font-weight:700}.mv{font-size:.76rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:10px;background:#D8E5E8;border:1px solid #000}.bar span{display:block;height:100%;background:var(--color-primary)}
.chartbox{position:relative;height:260px}
#screen>*{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .app{display:block}.sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid #000}.side-foot{display:none}.nav{grid-template-columns:repeat(3,1fr)}.nav button{justify-content:center}.navtxt{display:none}
  .main{padding:20px 16px 48px}.topbar{align-items:flex-start;flex-direction:column}.g2,.g21{grid-template-columns:1fr}.actions{width:100%}.btn{flex:1;justify-content:center}.kpi:nth-child(even){transform:none}
}
@media(max-width:520px){.g4,.kanban{grid-template-columns:1fr}.nav{grid-template-columns:repeat(6,1fr)}.nav button{padding:9px}.card{padding:14px}.htxt h2{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen>*{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo"><span class="material-symbols-outlined">hub</span></div><div><h1>Jvision Work</h1><p>企業協同辦公平台</p></div></div>

</div>
<script>
var MODS=[
{icon:"view_kanban",name:"任務看板",sub:"待辦、進行、審核、完成的拖拉式進度追蹤"},
{icon:"account_tree",name:"專案里程碑",sub:"甘特時程、里程碑與跨部門依賴關係"},
{icon:"approval",name:"簽核流程",sub:"表單多關卡電子簽核與自動路由"},
{icon:"folder_shared",name:"知識文件庫",sub:"文件版本、標籤分類與全文檢索"},
{icon:"forum",name:"團隊溝通",sub:"頻道討論、@提及與通知彙整"},
{icon:"monitoring",name:"產能報表",sub:"工時、準時率與流程效率分析"}];
var ACT=[
[{i:"add",t:"新增任務",p:1},{i:"filter_list",t:"篩選"}],
[{i:"add_task",t:"建立里程碑",p:1},{i:"today",t:"本週"}],
[{i:"edit_document",t:"發起申請",p:1},{i:"rule",t:"規則設定"}],
[{i:"upload_file",t:"上傳文件",p:1},{i:"search",t:"檢索"}],
[{i:"campaign",t:"發佈公告",p:1},{i:"notifications",t:"通知"}],
[{i:"download",t:"匯出報表",p:1},{i:"date_range",t:"本季"}]];
var AV=["#0F766E","#1D4ED8","#6D28D9","#BE123C","#075985","#C2410C","#166534","#334155"];
var chart=null,extra=[];
function av(n,i){return'<span class="avatar" style="background:'+AV[i%AV.length]+'">'+n.slice(0,1)+'</span>'}
function killChart(){if(chart){try{chart.destroy()}catch(e){}chart=null}extra.forEach(function(c){try{c.destroy()}catch(e){}});extra=[]}
function kpiCard(k){return'<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="lbl">'+k.l+'</div><div class="val">'+k.v+(k.s?'<small>'+k.s+'</small>':'')+'</div><div class="delta '+(k.up?"up":"dn")+'"><span class="material-symbols-outlined">'+(k.up?"trending_up":"error")+'</span>'+k.d+'</div></div>'}
function kpiRow(a){return'<div class="grid g4" style="margin-bottom:18px">'+a.map(kpiCard).join("")+'</div>'}

function s0(){
var cols=[
{name:"待辦",dot:"#64748B",tasks:[["TSK-2041","Q3 產品發表會場地確認","李承翰",1,"h"],["TSK-2044","新版官網文案審稿","陳映築",2,"m"],["TSK-2049","供應商年度合約續約評估","周雅琪",3,"l"]]},
{name:"進行中",dot:"#EA580C",tasks:[["TSK-2036","CRM 系統教育訓練教材","王思婷",0,"h"],["TSK-2038","行銷素材設計 v2","林冠廷",4,"m"]]},
{name:"待審核",dot:"#6D28D9",tasks:[["TSK-2029","差旅費用報銷單","黃郁涵",5,"m"],["TSK-2031","部門月報彙整","張博鈞",6,"l"]]},
{name:"已完成",dot:"#067647",tasks:[["TSK-2018","客戶滿意度問卷發放","王思婷",0,"l"],["TSK-2021","辦公用品採購請購","周雅琪",3,"m"],["TSK-2024","新進人員報到流程","李承翰",1,"l"]]}];
var h=kpiRow([{ic:"assignment",l:"本週任務",v:"48",d:"+6",up:1},{ic:"schedule",l:"進行中",v:"12",d:"3 逾期",up:0},{ic:"task_alt",l:"本週完成",v:"27",d:"+18%",up:1},{ic:"speed",l:"準時率",v:"96",s:"%",d:"+4%",up:1}]);
h+='<section class="card"><h3><span class="material-symbols-outlined">view_kanban</span>營運企劃部 · 任務看板<span class="tag">拖拉式指派</span></h3><div style="overflow-x:auto"><div class="kanban">';
cols.forEach(function(c){h+='<div class="kcol"><div class="kh"><span class="dot" style="background:'+c.dot+'"></span>'+c.name+'<span class="cnt">'+c.tasks.length+'</span></div>';c.tasks.forEach(function(t){var p=t[4]=="h"?["h","高"]:t[4]=="m"?["m","中"]:["l","低"];h+='<div class="ktask" tabindex="0"><div class="tt">'+t[1]+'</div><div class="meta"><span class="code">'+t[0]+'</span><span class="prio '+p[0]+'">'+p[1]+'優先</span><span style="margin-left:auto">'+av(t[2],t[3])+'</span></div></div>'});h+="</div>"});
return h+"</div></div></section>"}

function s1(){
var months=["1月","2月","3月","4月","5月","6月","7月","8月"],rows=[
["品牌識別重塑","行銷部",0,2.4,100,"#067647"],["官網改版上線","數位團隊",1.2,4,72,"#0D9488"],["CRM 系統導入","資訊部",2,5.6,45,"#EA580C"],["通路夥伴拓展","業務部",3.4,7,20,"#6D28D9"],["年度顧客大會","營運企劃",5,7.8,5,"#075985"]];
var ms=[["官網 Beta",3.2,"#0D9488"],["CRM 上線",5.4,"#EA580C"],["顧客大會",7.6,"#075985"]];
var h=kpiRow([{ic:"flag",l:"進行中專案",v:"5",d:"3 準時",up:1},{ic:"pending_actions",l:"待達里程碑",v:"3",d:"最近 6 天",up:0},{ic:"trending_up",l:"整體完成度",v:"48",s:"%",d:"+7%",up:1},{ic:"warning",l:"逾期風險",v:"1",d:"需關注",up:0}]);
h+='<section class="card"><h3><span class="material-symbols-outlined">account_tree</span>年度專案甘特時程<span class="tag">2026 上半年</span></h3><div style="overflow-x:auto"><div class="gantt"><div class="grow head"><div class="gname">專案 / 負責單位</div><div style="display:grid;grid-template-columns:repeat(8,1fr)">'+months.map(function(m){return'<div class="gcell">'+m+"</div>"}).join("")+"</div></div>";
rows.forEach(function(r){h+='<div class="grow"><div class="gname">'+r[0]+"<small>"+r[1]+'</small></div><div class="gtrack"><div class="gscale">'+("<span></span>".repeat(8))+'</div><div class="gbar" style="left:'+(r[2]/8*100)+"%;width:"+((r[3]-r[2])/8*100)+"%;background:"+r[5]+'"><span class="fill" style="width:'+r[4]+'%"></span><span style="position:relative">'+r[4]+"%</span></div></div></div>"});
h+='<div class="grow"><div class="gname">關鍵里程碑</div><div class="gtrack"><div class="gscale">'+("<span></span>".repeat(8))+"</div>";
ms.forEach(function(m){h+='<div class="mstone" style="left:calc('+(m[1]/8*100)+"% - 8px);background:"+m[2]+'" title="'+m[0]+'" aria-label="'+m[0]+'"></div>'});
