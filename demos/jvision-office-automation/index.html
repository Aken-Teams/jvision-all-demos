<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>辦公流程自動化 · Jvision 企業協同辦公平台</title>
<meta name="description" content="任務、專案、知識到流程自動化的團隊協作"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#b45309;--accent2:#f59e0b;--accent-soft:#fef3c7;
  --sidebar:#1c1917;--sidebar2:#292524;--ink:#1c1917;--muted:#78716c;
  --line:#e7e5e4;--bg:#faf9f7;--card:#ffffff;--good:#15803d;--warn:#b45309;--bad:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{width:248px;flex:none;background:var(--sidebar);color:#e7e5e4;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid #44403c;margin-bottom:16px;}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;font-weight:800;color:#fff;letter-spacing:.3px;}
.brand p{font-size:11px;color:#a8a29e;font-weight:500;}
.nav{display:flex;flex-direction:column;gap:5px;}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border:none;border-radius:11px;background:transparent;color:#d6d3d1;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:.16s;width:100%;}
.nav button .material-symbols-outlined{font-size:21px;flex:none;}
.nav button:hover{background:#3a3532;color:#fff;}
.nav button.active{background:linear-gradient(135deg,var(--accent),#d97706);color:#fff;box-shadow:0 4px 14px rgba(180,83,9,.4);}
.nav .navtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid #44403c;display:flex;align-items:center;gap:10px;}
.side-foot .av{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(135deg,#d97706,#f59e0b);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;}
.side-foot .who{font-size:12px;}
.side-foot .who b{display:block;color:#fff;font-size:13px;}
.side-foot .who span{color:#a8a29e;}
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.topbar .htxt h2{font-size:22px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:9px;}
.topbar .htxt h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.topbar .htxt p{font-size:13px;color:var(--muted);margin-top:2px;}
.topbar .actions{display:flex;gap:9px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn .material-symbols-outlined{font-size:18px;}
.btn.primary{background:linear-gradient(135deg,var(--accent),#d97706);border-color:transparent;color:#fff;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:14px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:20px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:66px;height:66px;border-radius:50%;background:var(--accent-soft);opacity:.6;}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:11px;position:relative;z-index:1;}
.kpi .ic .material-symbols-outlined{font-size:21px;}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;position:relative;z-index:1;}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1;line-height:1.2;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11px;font-weight:700;margin-top:4px;position:relative;z-index:1;display:inline-flex;align-items:center;gap:2px;}
.kpi .delta.up{color:var(--good);}
.kpi .delta.dn{color:var(--bad);}
.kpi .delta .material-symbols-outlined{font-size:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fdfbf7;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.pill.g{background:#dcfce7;color:var(--good);}
.pill.y{background:#fef3c7;color:var(--warn);}
.pill.r{background:#fee2e2;color:var(--bad);}
.pill.b{background:#dbeafe;color:#1d4ed8;}
.pill.n{background:#f5f5f4;color:#57534e;}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none;}
.mono{font-variant-numeric:tabular-nums;}
.bar{height:7px;border-radius:6px;background:#f1efec;overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{position:relative;height:260px;}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
.kcol{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px;}
.kcol .kh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:11px;}
.kcol .kh .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.kcol .kh .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-weight:700;}
.ktask{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);cursor:grab;transition:.14s;}
.ktask:hover{border-color:var(--accent2);transform:translateY(-1px);box-shadow:0 5px 14px rgba(180,83,9,.1);}
.ktask .tt{font-size:13px;font-weight:600;margin-bottom:8px;}
.ktask .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.ktask .code{font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}
.prio{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;}
.prio.h{background:#fee2e2;color:var(--bad);}
.prio.m{background:#fef3c7;color:var(--warn);}
.prio.l{background:#e0f2fe;color:#0369a1;}
.gantt{min-width:640px;}
.grow{display:grid;grid-template-columns:190px 1fr;align-items:center;border-bottom:1px solid var(--line);}
.grow.head{border-bottom:2px solid var(--line);}
.gname{padding:10px 12px;font-size:12.5px;font-weight:600;}
.gname small{display:block;color:var(--muted);font-weight:500;font-size:11px;}
.gtrack{position:relative;height:44px;display:flex;align-items:center;padding:0 6px;}
.gscale{display:grid;grid-template-columns:repeat(8,1fr);height:100%;position:absolute;inset:0;padding:0 6px;}
.gscale span{border-left:1px dashed #eceae7;}
.gbar{position:absolute;height:22px;border-radius:7px;display:flex;align-items:center;padding:0 9px;color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;}
.gbar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.25);}
.gcell{padding:9px 6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;border-left:1px dashed #eceae7;}
.mstone{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;position:absolute;top:14px;}
.flowsteps{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
.fstep{flex:1;min-width:110px;text-align:center;position:relative;padding:0 6px;}
.fstep .node{width:42px;height:42px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#fff;color:var(--muted);position:relative;z-index:1;}
.fstep.done .node{background:var(--good);border-color:var(--good);color:#fff;}
.fstep.now .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-soft);}
.fstep .node .material-symbols-outlined{font-size:22px;}
.fstep .fn{font-size:12px;font-weight:700;}
.fstep .fr{font-size:11px;color:var(--muted);}
.fstep::before{content:"";position:absolute;top:20px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
.fstep:first-child::before{display:none;}
.fstep.done::before,.fstep.now::before{background:var(--good);}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px;}
.tagcloud .tg{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:5px;}
.tagcloud .tg b{color:var(--accent);}
.chatlist{display:flex;flex-direction:column;gap:3px;}
.chan{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;}
.chan.active{background:var(--accent-soft);}
.chan .ci{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:#f5f5f4;color:var(--accent);}
.chan .cn{font-size:13px;font-weight:600;min-width:0;}
.chan .cn small{display:block;color:var(--muted);font-weight:500;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.chan .badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px;flex:none;}
.msg{display:flex;gap:11px;margin-bottom:16px;}
.msg .mb{background:var(--bg);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:9px 13px;font-size:13px;}
.msg .mn{font-size:12px;font-weight:700;margin-bottom:3px;}
.msg .mn small{color:var(--muted);font-weight:500;margin-left:6px;}
.notif{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.notif:last-child{border-bottom:none;}
.notif .ni{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;}
.notif .nt{font-size:12.5px;}
.notif .nt b{font-weight:700;}
.notif .ntime{font-size:11px;color:var(--muted);margin-top:2px;}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:10px;}
.leg span{display:inline-flex;align-items:center;gap:5px;}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.mrow:last-child{border-bottom:none;}
.mrow .mi{flex:1;font-size:13px;font-weight:600;}
.mrow .mv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:column;padding:14px 16px;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px;}
  .nav button{width:auto;flex:none;white-space:nowrap;}
  .side-foot{display:none;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr 1fr;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:560px){
  .nav .navtxt{display:none;}
  .nav button{padding:10px;}
  .kanban{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div><h1>Jvision Work</h1><p>企業協同辦公平台</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="av">王</div>
      <div class="who"><b>王思婷</b><span>營運企劃部 · 專案專員</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="htxt" id="htxt"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
var MODS=[
  {icon:"view_kanban",name:"任務看板",sub:"待辦、進行、審核、完成的拖拉式進度追蹤"},
  {icon:"account_tree",name:"專案里程碑",sub:"甘特時程、里程碑與跨部門依賴關係"},
  {icon:"approval",name:"簽核流程",sub:"表單多關卡電子簽核與自動路由"},
  {icon:"folder_shared",name:"知識文件庫",sub:"文件版本、標籤分類與全文檢索"},
  {icon:"forum",name:"團隊溝通",sub:"頻道討論、@提及與通知彙整"},
  {icon:"monitoring",name:"產能報表",sub:"工時、準時率與流程效率分析"}
];
var ACT=[
  [{i:"add",t:"新增任務",p:1},{i:"filter_list",t:"篩選"}],
  [{i:"add_task",t:"建立里程碑",p:1},{i:"today",t:"本週"}],
  [{i:"edit_document",t:"發起申請",p:1},{i:"rule",t:"規則設定"}],
  [{i:"upload_file",t:"上傳文件",p:1},{i:"search",t:"檢索"}],
  [{i:"campaign",t:"發佈公告",p:1},{i:"notifications",t:"通知"}],
  [{i:"download",t:"匯出報表",p:1},{i:"date_range",t:"本季"}]
];
var AV=["#b45309","#0f766e","#7c3aed","#be123c","#1d4ed8","#c2410c","#0369a1","#4d7c0f"];
function av(name,idx){return '<span class="avatar" style="background:'+AV[idx%AV.length]+'">'+name.slice(0,1)+'</span>';}
var chart=null,extra=[];
function killChart(){
  if(chart){try{chart.destroy();}catch(e){}chart=null;}
  extra.forEach(function(c){try{c.destroy();}catch(e){}});extra=[];
}
function kpiCard(k){
  var dcls=k.up?"up":"dn";var dic=k.up?"trending_up":"trending_flat";
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="lbl">'+k.l+'</div><div class="val">'+k.v+(k.s?'<small>'+k.s+'</small>':'')+'</div><div class="delta '+dcls+'"><span class="material-symbols-outlined">'+dic+'</span>'+k.d+'</div></div>';
}
function kpiRow(list){var h='<div class="grid g4" style="margin-bottom:16px">';list.forEach(function(k){h+=kpiCard(k);});return h+'</div>';}

/* SCREEN 0: KANBAN */
function s0(){
  var cols=[
    {name:"待辦",dot:"#78716c",tasks:[
      {c:"TSK-2041",t:"Q3 產品發表會場地確認",who:"李承翰",wi:1,p:"h"},
      {c:"TSK-2044",t:"新版官網文案審稿",who:"陳映築",wi:2,p:"m"},
      {c:"TSK-2049",t:"供應商年度合約續約評估",who:"周雅琪",wi:3,p:"l"}
    ]},
    {name:"進行中",dot:"#f59e0b",tasks:[
      {c:"TSK-2036",t:"CRM 系統教育訓練教材",who:"王思婷",wi:0,p:"h"},
      {c:"TSK-2038",t:"行銷素材設計 v2",who:"林冠廷",wi:4,p:"m"}
    ]},
    {name:"待審核",dot:"#7c3aed",tasks:[
      {c:"TSK-2029",t:"差旅費用報銷單",who:"黃郁涵",wi:5,p:"m"},
      {c:"TSK-2031",t:"部門月報彙整",who:"張博鈞",wi:6,p:"l"}
    ]},
    {name:"已完成",dot:"#15803d",tasks:[
      {c:"TSK-2018",t:"客戶滿意度問卷發放",who:"王思婷",wi:0,p:"l"},
      {c:"TSK-2021",t:"辦公用品採購請購",who:"周雅琪",wi:3,p:"m"},
      {c:"TSK-2024",t:"新進人員報到流程",who:"李承翰",wi:1,p:"l"}
    ]}
  ];
  var h=kpiRow([
    {ic:"assignment",l:"本週任務",v:"48",d:"+6",up:1},
    {ic:"schedule",l:"進行中",v:"12",d:"3 逾期",up:0},
    {ic:"task_alt",l:"本週完成",v:"27",d:"+18%",up:1},
    {ic:"speed",l:"準時率",v:"96",s:"%",d:"+4%",up:1}
  ]);
  h+='<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>營運企劃部 · 任務看板<span class="tag">拖拉式指派</span></h3>';
  h+='<div style="overflow-x:auto"><div class="kanban">';
  cols.forEach(function(col){
    h+='<div class="kcol"><div class="kh"><span class="dot" style="background:'+col.dot+'"></span>'+col.name+'<span class="cnt">'+col.tasks.length+'</span></div>';
    col.tasks.forEach(function(t){
      var pl=t.p=="h"?'<span class="prio h">高</span>':t.p=="m"?'<span class="prio m">中</span>':'<span class="prio l">低</span>';
      h+='<div class="ktask"><div class="tt">'+t.t+'</div><div class="meta"><span class="code">'+t.c+'</span>'+pl+'<span style="margin-left:auto">'+av(t.who,t.wi)+'</span></div></div>';
    });
    h+='</div>';
  });
  h+='</div></div></div>';
  return h;
}

/* SCREEN 1: GANTT */
function s1(){
  var months=["1月","2月","3月","4月","5月","6月","7月","8月"];
  var rows=[
    {n:"品牌識別重塑",sub:"行銷部",s:0,e:2.4,pct:100,c:"#15803d"},
    {n:"官網改版上線",sub:"數位團隊",s:1.2,e:4,pct:72,c:"#b45309"},
    {n:"CRM 系統導入",sub:"資訊部",s:2,e:5.6,pct:45,c:"#f59e0b"},
    {n:"通路夥伴拓展",sub:"業務部",s:3.4,e:7,pct:20,c:"#7c3aed"},
    {n:"年度顧客大會",sub:"營運企劃",s:5,e:7.8,pct:5,c:"#0369a1"}
  ];
  var ms=[{n:"官網 Beta",x:3.2,c:"#b45309"},{n:"CRM 上線",x:5.4,c:"#f59e0b"},{n:"顧客大會",x:7.6,c:"#0369a1"}];
  var h=kpiRow([
    {ic:"flag",l:"進行中專案",v:"5",d:"3 準時",up:1},
    {ic:"pending_actions",l:"待達里程碑",v:"3",d:"最近 6 天",up:0},
    {ic:"trending_up",l:"整體完成度",v:"48",s:"%",d:"+7%",up:1},
    {ic:"warning",l:"逾期風險",v:"1",d:"需關注",up:0}

function show(i){
  killChart();

  for(var n=0;n<nav.length;n++)nav[n].classList.toggle("active",+nav[n].getAttribute("data-i")===i);

  document.getElementById("htxt").innerHTML='<h2><span class="material-symbols-outlined">'+m.icon+'</span>'+m.name+'</h2><p>'+m.sub+'</p>';

  acts.forEach(function(a){ah+='<button class="btn'+(a.p?' primary':'')+'"><span class="material-symbols-outlined">'+a.i+'</span>'+a.t+'</button>';});
  document.getElementById("actions").innerHTML=ah;

(function(){
  var nav=document.getElementById("nav");var h="";
  MODS.forEach(function(m,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="navtxt">'+m.name+'</span></button>';
  });

  for(var i=0;i<nav.children.length;i++){
    (function(idx){nav.children[idx].addEventListener("click",function(){location.hash="go="+idx;show(idx);});})(i);
  }
})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
