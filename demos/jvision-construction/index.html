<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>營建專案管理 · Jvision</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--panel:#ffffff;
  --line:#e2e8f0;--ink:#1e293b;--mut:#64748b;--soft:#f8fafc;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{
  width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .logo{
  width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:800;display:block;letter-spacing:.5px}
.brand span{font-size:11.5px;color:var(--mut);font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav button{
  display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--mut);
  padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;
  text-align:left;width:100%;min-width:0;transition:.15s;
}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button .d{font-size:10.5px;color:#94a3b8;font-weight:500;display:block;margin-top:1px}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--accent);color:#fff}
.nav button.on .d,.nav button.on .material-symbols-outlined{color:#cbd5e1}
.side .foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:#94a3b8}
.main{flex:1;min-width:0;padding:24px 26px 40px;max-width:1280px;margin:0 auto;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px}
.top .sub{color:var(--mut);font-size:13px;margin-top:3px}
.top .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--accent);box-shadow:var(--shadow)
}
.chip .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.3fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card .hint{font-size:11.5px;color:var(--mut);margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.3px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--mut)}
.kpi .dt{font-size:11.5px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:4px}
.kpi .dt .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--soft)}
tbody tr:hover{background:var(--soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}
.t-mut{background:#f1f5f9;color:#475569}
.prog{height:7px;background:#eef2f7;border-radius:99px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.can-wrap{position:relative;height:250px;min-width:0}
.can-wrap.sm{height:210px}
canvas{max-width:100%}
.ovf{overflow-x:auto;min-width:0}
.gantt{min-width:640px}
.gantt .row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.gantt .nm{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .track{position:relative;height:22px;background:var(--soft);border-radius:6px}
.gantt .seg{position:absolute;top:3px;height:16px;border-radius:5px;background:var(--accent2);opacity:.35}
.gantt .seg.done{background:var(--accent);opacity:1}
.gantt .mile{position:absolute;top:-1px;width:2px;height:24px;background:var(--bad)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:9px;padding:0 2px}
.col .ch .n{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--mut)}
.item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 1px rgba(15,23,42,.03)}
.item .ti{font-size:12.5px;font-weight:700;margin-bottom:5px}
.item .mt{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.item.p-h{border-left-color:var(--bad)}.item.p-m{border-left-color:var(--warn)}.item.p-l{border-left-color:var(--ok)}
.dr-head{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.mini{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-width:0}
.mini .l{font-size:11.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
.mini .l .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.mini .v{font-size:20px;font-weight:800;margin-top:5px}
.mini .v small{font-size:12px;color:var(--mut);font-weight:600}
.tl{position:relative;padding-left:22px;min-width:0}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl .ev .tm{font-size:11px;color:var(--accent2);font-weight:700}
.tl .ev .tx{font-size:12.8px;font-weight:600;margin-top:1px}
.tl .ev .ds{font-size:11.5px;color:var(--mut);margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.photo .im{height:96px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.photo .im .material-symbols-outlined{font-size:34px;opacity:.85}
.photo .im .pt{position:absolute;left:8px;bottom:7px;font-size:10px;background:rgba(15,23,42,.55);padding:2px 7px;border-radius:99px;font-weight:600}
.photo .cap{padding:9px 11px}
.photo .cap .t{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo .cap .m{font-size:10.5px;color:var(--mut);margin-top:3px;display:flex;justify-content:space-between}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:12px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.rl{display:flex;flex-direction:column;gap:0}
.rl .r{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rl .r:last-child{border-bottom:0}
.rl .ic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent2)}
.rl .ic .material-symbols-outlined{font-size:19px}
.rl .bd{flex:1;min-width:0}
.rl .bd .t{font-size:12.8px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .bd .s{font-size:11px;color:var(--mut);margin-top:1px}
.rl .rt{text-align:right;flex:none}
.rl .rt .a{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.rl .rt .b{font-size:10.5px;color:var(--mut)}
.cbar{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.cbar .nm{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .track{height:20px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}
.cbar .bud{position:absolute;left:0;top:0;bottom:0;background:#e2e8f0}
.cbar .act{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.cbar .act.over{background:linear-gradient(90deg,#b91c1c,#ef4444)}
.cbar .rt{text-align:right;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.slist{display:flex;flex-direction:column;gap:9px}
.slist .s{display:flex;align-items:center;gap:10px;font-size:12.5px}
.slist .s .bx{flex:1;height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
.slist .s .bx i{display:block;height:100%;border-radius:99px}
.slist .s .vv{font-weight:700;width:38px;text-align:right;font-variant-numeric:tabular-nums}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.8s ease-in-out infinite}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column;padding:12px}
  .brand{border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
  .nav button .d{display:none}
  .side .foot{display:none}
  .main{padding:18px 16px 34px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .dr-head{grid-template-columns:1fr 1fr}
  .photos{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button .t{display:none}
  .nav button{padding:10px}
  .board{grid-template-columns:1fr}
  .photos{grid-template-columns:1fr}
  .cbar{grid-template-columns:90px 1fr 70px}
  table{min-width:440px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">apartment</span></div>
      <div><b>營建專案管理</b><span>Jvision 工程管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">© 2026 Jvision Demo · 全部為示意資料</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"account_tree",name:"工程進度",desc:"WBS 與里程碑"},
  {icon:"assignment",name:"工地日報",desc:"人機料回報"},
  {icon:"health_and_safety",name:"品質安衛",desc:"巡檢與缺失"},
  {icon:"request_quote",name:"估價發包",desc:"廠商比價"},
  {icon:"payments",name:"成本控管",desc:"預算與請款"},
  {icon:"photo_library",name:"現場紀錄",desc:"照片與文件"}
];
var chart=null;
function destroyChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }
function esc(s){return String(s==null?"":s);}
function money(n){ n=(n==null?0:n); return n.toLocaleString("en-US"); }

function topBar(title,sub,chips){
  var c=(chips||[]).map(function(x){return '<span class="chip"><span class="material-symbols-outlined">'+esc(x.i)+'</span>'+esc(x.t)+'</span>';}).join("");
  return '<div class="top"><div><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub)+'</div></div><div class="meta">'+c+'</div></div>';
}
function kpi(k){
  var cls=k.dir==="up"?"up":(k.dir==="down"?"down":"flat");
  var ic=k.dir==="up"?"trending_up":(k.dir==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="bar"></div><div class="lbl"><span class="material-symbols-outlined">'+esc(k.icon)+'</span>'+esc(k.lbl)+'</div>'
    +'<div class="val">'+esc(k.val)+(k.unit?' <small>'+esc(k.unit)+'</small>':'')+'</div>'
    +'<div class="dt '+cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.dt)+'</div></div>';
}

/* ---------- Screen 0 : 工程進度 (Gantt / WBS) ---------- */
function s0(){
  var kpis=[
    {icon:"donut_large",lbl:"整體實際進度",val:"63.4",unit:"%",dir:"up",dt:"領先基準 +1.8%"},
    {icon:"flag",lbl:"里程碑達成",val:"7 / 11",unit:"",dir:"up",dt:"下一里程碑 10/18"},
    {icon:"warning",lbl:"落後工項",val:"3",unit:"項",dir:"down",dt:"機電需趕工"},
    {icon:"schedule",lbl:"預估竣工",val:"2027/06",unit:"",dir:"flat",dt:"與契約一致"}
  ];
  var wbs=[
    {nm:"A 基礎與地下室",s:0,e:22,d:22,mile:22},
    {nm:"B 主結構體",s:16,e:52,d:44,mile:52},
    {nm:"C 外牆帷幕",s:40,e:70,d:20},
    {nm:"D 機電管線",s:44,e:82,d:12,mile:82},
    {nm:"E 裝修工程",s:66,e:95,d:0},
    {nm:"F 景觀與竣工",s:88,e:100,d:0,mile:100}
  ];
  var rows=wbs.map(function(w){
    var seg='<div class="seg" style="left:'+w.s+'%;width:'+(w.e-w.s)+'%"></div>';
    var done='<div class="seg done" style="left:'+w.s+'%;width:'+(w.d)+'%"></div>';
    var m=(w.mile!=null)?'<div class="mile" style="left:'+w.mile+'%"></div>':'';
    return '<div class="row"><div class="nm">'+esc(w.nm)+'</div><div class="track">'+seg+done+m+'</div></div>';
  }).join("");
  var tbl=[
    ["A 基礎與地下室","100%","已完成","t-ok","已結案"],
    ["B 主結構體","72%","施工中","t-info","+2.1% 領先"],
    ["C 外牆帷幕","48%","施工中","t-info","如期"],
    ["D 機電管線","31%","落後","t-warn","-4.6% 落後"],
    ["E 裝修工程","0%","未開始","t-mut","10/25 進場"],
    ["F 景觀與竣工","0%","未開始","t-mut","待前段"]
  ].map(function(r){
    return '<tr><td>'+r[0]+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog" style="flex:1"><i style="width:'+r[1]+'"></i></div><span style="font-size:11px;color:var(--mut);width:34px">'+r[1]+'</span></div></td><td><span class="tag '+r[3]+'">'+r[2]+'</span></td><td style="color:var(--mut)">'+r[4]+'</td></tr>';
  }).join("");
  return topBar("工程進度","中山路 A 棟集合住宅新建工程 · WBS 排程與進度基準線",[{i:"calendar_month",t:"工期 620 天"},{i:"update",t:"更新 08/13"}])
    +'<div class="grid g4" style="margin-bottom:16px">'+kpis.map(kpi).join("")+'</div>'
    +'<div class="grid g23" style="margin-bottom:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>WBS 進度甘特圖</h3><div class="hint">灰底為排程區間，深色為實際完成，紅線為里程碑查核點</div>'
        +'<div class="ovf"><div class="gantt">'+rows+'</div></div>'
        +'<div class="leg"><span><i class="dot" style="background:#94a3b8;opacity:.35"></i>排程區間</span><span><i class="dot" style="background:var(--accent)"></i>實際完成</span><span><i class="dot" style="background:var(--bad)"></i>里程碑</span></div>'
      +'</div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>進度 S 曲線</h3><div class="hint">計畫 vs 實際累積進度</div><div class="can-wrap sm"><canvas id="c0"></canvas></div></div>'
    +'</div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>工項進度明細</h3><div class="ovf"><table><thead><tr><th>工項</th><th style="width:180px">完成率</th><th>狀態</th><th>備註</th></tr></thead><tbody>'+tbl+'</tbody></table></div></div>';
}
function draw0(){
  var el=document.getElementById("c0"); if(!el)return;
  chart=new Chart(el,{type:"line",data:{labels:["1月","2月","3月","4月","5月","6月","7月","8月"],
    datasets:[
      {label:"計畫進度",data:[6,15,26,38,49,58,66,72],borderColor:"#94a3b8",backgroundColor:"rgba(148,163,184,.08)",fill:true,tension:.35,borderDash:[5,4]},
      {label:"實際進度",data:[7,16,28,40,51,60,63.4,null],borderColor:"#334155",backgroundColor:"rgba(51,65,85,.10)",fill:true,tension:.35,pointRadius:3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},
      scales:{y:{ticks:{callback:function(v){return v+"%";},font:{size:10}},grid:{color:"#eef2f7"}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
}

/* ---------- Screen 1 : 工地日報 ---------- */
function s1(){
  var heads=[
    {i:"groups",l:"出工人數",v:"148",u:"人"},
    {i:"construction",l:"機具進場",v:"12",u:"台"},

  return topBar("現場紀錄","施工照片、工程文件與竣工圖說留存",[{i:"cloud",t:"雲端同步"},{i:"photo_library",t:"2,847 張照片"}])
    +'<div class="dr-head" style="margin-bottom:16px">'+heads+'</div>'
    +'<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">collections</span>近期施工照片</h3><div class="hint">依施工部位與日期標記，可作為估驗計價與竣工佐證</div><div class="photos">'+photos+'</div></div>'
    +'<div class="grid g2">'
      +'<div class="card"><h3><span class="material-symbols-outlined">folder_open</span>工程文件庫</h3><div class="rl">'+docs+'</div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart_4_bars</span>文件類別統計</h3><div class="hint">現場紀錄各類別數量</div><div class="can-wrap sm"><canvas id="c5"></canvas></div></div>'
    +'</div>';
}
function draw5(){
  var el=document.getElementById("c5"); if(!el)return;
  chart=new Chart(el,{type:"polarArea",data:{labels:["施工照片","查驗報告","施工圖說","材料證明","會議紀錄"],
    datasets:[{data:[284,96,84,72,58],backgroundColor:["rgba(51,65,85,.82)","rgba(71,85,105,.78)","rgba(100,116,139,.75)","rgba(148,163,184,.72)","rgba(203,213,225,.72)"],borderWidth:1,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:11,font:{size:11}}}},scales:{r:{ticks:{display:false},grid:{color:"#eef2f7"}}}}});
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAWS=[draw0,draw1,draw2,draw3,draw4,draw5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="t">'+m.name+'<span class="d">'+m.desc+'</span></span></button>';
  }).join("");
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b)return;
    show(+b.getAttribute("data-i"));
  });
}
function show(i){
  destroyChart();
  var buttons=document.querySelectorAll("[data-i]");
  for(var k=0;k<buttons.length;k++){ buttons[k].classList.toggle("on",+buttons[k].getAttribute("data-i")===i); }
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  void container.offsetHeight;
  if(DRAWS[i]) DRAWS[i]();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
