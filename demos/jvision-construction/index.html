<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>營建專案管理 · Jvision</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* Industrial Brutalism — Construction Field Command */
:root{
  --color-primary:#64748b;
  --color-on-primary:#fff;
  --color-secondary:#94a3b8;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#334155;
  --color-card:#fff;
  --color-card-foreground:#334155;
  --color-muted:#ebf0f5;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#64748b;
  --blue:#64748b;
  --ink:#334155;
  --muted:#475569;
  --line:#e2e8f0;
  --accent:#64748b;
  --accent2:#94a3b8;
  --bg:#f8fafc;
  --panel:#fff;
  --mut:#475569;
  --soft:#ebf0f5;
  --ok:#15803d;
  --warn:#a74408;
  --bad:#dc2626;
  --info:#1d4ed8;
  --shadow:7px 7px 0 #0f172a;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(100,116,139,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(100,116,139,.11) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font:400 14px/1.55 "Inter",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}
::selection{background:var(--color-accent);color:#000}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{
  position:sticky;top:0;z-index:20;
  width:272px;height:100vh;flex:none;
  display:flex;flex-direction:column;gap:0;
  padding:0;
  background:#0f172a;color:#fff;
  border-right:4px solid #0f172a;
}
.brand{display:flex;align-items:center;gap:14px;padding:22px 18px;border-bottom:4px solid var(--color-accent);margin:0}
.brand .logo{
  width:48px;height:48px;flex:none;display:grid;place-items:center;
  border:2px solid #fff;border-radius:0;background:var(--color-accent);color:#000;box-shadow:4px 4px 0 #fff;
}
.brand .logo .material-symbols-outlined{font-size:27px;font-weight:700}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:.06em}
.brand span:not(.material-symbols-outlined){display:block;margin-top:2px;color:#cbd5e1;font:400 11px/1.4 var(--mono)}
.nav{display:flex;flex:1;flex-direction:column;gap:0;overflow:auto;padding:16px 0}
.nav button{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;min-width:0;
  padding:15px 18px;border:0;border-bottom:1px solid #334155;border-radius:0;
  background:transparent;color:#cbd5e1;text-align:left;font-size:13px;font-weight:700;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.nav button .material-symbols-outlined{font-size:22px;flex:none;color:#94a3b8}
.nav button .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button .d{display:block;margin-top:2px;color:#94a3b8;font:400 10px/1.35 var(--mono)}
.nav button:hover{background:#1e293b;color:#fff;transform:translateX(4px)}
.nav button.on{background:var(--color-accent);color:#000}
.nav button.on:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:#fff}
.nav button.on .d,.nav button.on .material-symbols-outlined{color:#000}
.side .foot{margin-top:auto;padding:15px 18px;border-top:1px solid #475569;color:#cbd5e1;font:400 10px/1.5 var(--mono)}
.main{flex:1;min-width:0;width:100%;max-width:1500px;margin:0 auto;padding:34px 38px 56px}
#screen{min-width:0}
.top{
  position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  min-height:190px;margin:0 0 26px;padding:30px 32px;
  overflow:hidden;background:#0f172a;color:#fff;border:3px solid #0f172a;box-shadow:10px 10px 0 var(--color-accent);
}
.top:after{
  content:"FIELD / CONTROL";position:absolute;right:-12px;top:7px;
  color:rgba(255,255,255,.07);font:800 clamp(34px,6vw,86px)/1 "Inter",sans-serif;letter-spacing:-.06em;white-space:nowrap;pointer-events:none;
}
.top>div{position:relative;z-index:1}
.top h1{max-width:760px;margin:0;font-size:clamp(34px,4.8vw,68px);font-weight:800;line-height:.94;letter-spacing:-.055em}
.top h1:before{content:"// ";color:var(--color-accent);font-family:var(--mono);font-size:.55em;vertical-align:top}
.top .sub{max-width:720px;margin-top:15px;color:#e2e8f0;font-size:13px;font-weight:500}
.top .meta{display:flex;gap:0;flex-wrap:wrap;align-items:stretch}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:9px 12px;
  background:#fff;color:#0f172a;border:2px solid #0f172a;border-radius:0;box-shadow:4px 4px 0 var(--color-accent);
  font:700 11px/1.2 var(--mono);text-transform:uppercase;
}
.chip+.chip{margin-left:9px}
.chip .material-symbols-outlined{font-size:17px;color:var(--color-accent)}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(290px,1fr)}
.g32{grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr)}
.card,.kpi,.mini,.photo,.col,.item{border-radius:0}
.card{
  min-width:0;padding:20px;background:var(--color-card);color:var(--color-card-foreground);
  border:2px solid #0f172a;box-shadow:6px 6px 0 #cbd5e1;
}
.card h3{display:flex;align-items:center;gap:9px;margin:0 0 4px;font-size:14px;font-weight:800;letter-spacing:.035em;text-transform:uppercase}
.card h3:after{content:"";height:3px;flex:1;margin-left:5px;background:var(--color-accent)}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-accent)}
.card .hint{margin:0 0 16px;color:var(--color-muted-foreground);font-size:11.5px}
.kpi{
  position:relative;min-width:0;overflow:hidden;padding:18px 18px 20px;
  background:#fff;border:2px solid #0f172a;box-shadow:5px 5px 0 #0f172a;
}
.kpi:nth-child(even){transform:translateY(7px);box-shadow:5px 5px 0 var(--color-accent)}
.kpi .bar{position:absolute;inset:0 auto 0 0;width:7px;background:var(--color-accent)}
.kpi .lbl{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.kpi .lbl .material-symbols-outlined{font-size:18px;color:#0f172a}
.kpi .val{margin-top:12px;color:#0f172a;font-size:clamp(25px,2.4vw,35px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.kpi .val small{color:var(--color-muted-foreground);font-size:12px;font-weight:700;letter-spacing:0}
.kpi .dt{display:flex;align-items:center;gap:5px;margin-top:11px;font-size:11px;font-weight:700}
.kpi .dt .material-symbols-outlined{font-size:16px}
.up{color:var(--ok)}.down{color:#b91c1c}.flat{color:var(--color-muted-foreground)}
table{width:100%;min-width:520px;border-collapse:collapse;border:2px solid #0f172a;font-size:12.5px}
th,td{padding:11px 12px;border:1px solid var(--color-border);white-space:nowrap;text-align:left}
th{background:#0f172a;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.075em;text-transform:uppercase}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#ffedd5}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
td[style*="var(--mut)"],td[style*="var(--muted)"]{color:var(--color-muted-foreground)!important}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid currentColor;border-radius:0;font-size:10.5px;font-weight:800}
.tag:before{content:"";width:6px;height:6px;flex:none;background:currentColor}
.t-ok{background:#dcfce7;color:#166534}.t-warn{background:#ffedd5;color:#9a3412}.t-bad{background:#fee2e2;color:#991b1b}.t-info{background:#dbeafe;color:#1e40af}.t-mut{background:#e2e8f0;color:#334155}
.prog{height:10px;min-width:70px;overflow:hidden;background:#e2e8f0;border:1px solid #64748b;border-radius:0}
.prog i{display:block;height:100%;border-radius:0;background:var(--color-accent)}
.can-wrap{position:relative;height:250px;min-width:0}
.can-wrap.sm{height:210px}
canvas{max-width:100%}
.ovf{min-width:0;overflow-x:auto;scrollbar-color:#64748b #e2e8f0}
.gantt{min-width:640px}
.gantt .row{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #94a3b8}
.gantt .nm{min-width:0;overflow:hidden;color:#0f172a;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}
.gantt .track{position:relative;height:25px;background:repeating-linear-gradient(90deg,#e2e8f0 0,#e2e8f0 19px,#f8fafc 20px);border:1px solid #94a3b8;border-radius:0}
.gantt .seg{position:absolute;top:4px;height:15px;border-radius:0;background:#94a3b8;opacity:.65}
.gantt .seg.done{background:#334155;opacity:1}
.gantt .mile{position:absolute;top:-4px;width:3px;height:31px;background:var(--color-destructive)}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;flex:none;border:1px solid #0f172a;border-radius:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:0;min-width:800px;border:2px solid #0f172a}
.col{min-width:0;padding:11px;background:#f8fafc;border:0;border-right:2px solid #0f172a}
.col:last-child{border-right:0}
.col .ch{display:flex;align-items:center;justify-content:space-between;margin:-11px -11px 11px;padding:10px 11px;background:#0f172a;color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.col .ch .n{padding:1px 7px;background:var(--color-accent);color:#000;border:1px solid #fff;border-radius:0;font-family:var(--mono);font-size:10px}
.item{margin-bottom:9px;padding:10px;background:#fff;border:1px solid #0f172a;border-left:7px solid #64748b;box-shadow:3px 3px 0 #cbd5e1}
.item .ti{margin-bottom:7px;color:#0f172a;font-size:12px;font-weight:800}
.item .mt{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:10.5px}
.item.p-h{border-left-color:var(--color-destructive)}.item.p-h:before{content:"高風險";display:block;margin-bottom:5px;color:#991b1b;font:700 9px/1 var(--mono)}
.item.p-m{border-left-color:#d97706}.item.p-m:before{content:"中風險";display:block;margin-bottom:5px;color:#92400e;font:700 9px/1 var(--mono)}
.item.p-l{border-left-color:#15803d}.item.p-l:before{content:"低風險";display:block;margin-bottom:5px;color:#166534;font:700 9px/1 var(--mono)}
.dr-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;min-width:0}
.mini{min-width:0;padding:15px 16px;background:#fff;border:2px solid #0f172a;box-shadow:4px 4px 0 #94a3b8}
.mini:nth-child(2n){background:#ebf0f5}
.mini .l{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:10.5px;font-weight:800;text-transform:uppercase}
.mini .l .material-symbols-outlined{color:var(--color-accent);font-size:18px}
.mini .v{margin-top:8px;color:#0f172a;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mini .v small{color:var(--color-muted-foreground);font-size:11px;font-weight:700}
.tl{position:relative;min-width:0;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:3px;background:#0f172a}
.tl .ev{position:relative;padding:0 0 17px 8px}
.tl .ev:before{content:"";position:absolute;left:-25px;top:2px;width:12px;height:12px;background:var(--color-accent);border:2px solid #0f172a;border-radius:0}
.tl .ev .tm{color:#9a3412;font:700 10.5px/1.4 var(--mono)}
.tl .ev .tx{margin-top:2px;color:#0f172a;font-size:12px;font-weight:800}
.tl .ev .ds{margin-top:2px;color:var(--color-muted-foreground);font-size:11px}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;min-width:0}
.photo{min-width:0;overflow:hidden;background:#fff;border:2px solid #0f172a;box-shadow:4px 4px 0 #94a3b8}
.photo .im{position:relative;display:flex;align-items:center;justify-content:center;height:108px;color:#fff;filter:saturate(.35) contrast(1.15)}
.photo .im:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0,transparent 9px,rgba(255,255,255,.07) 10px,rgba(255,255,255,.07) 11px)}
.photo .im .material-symbols-outlined{z-index:1;font-size:37px;opacity:.95}
.photo .im .pt{position:absolute;z-index:2;left:0;bottom:0;padding:4px 8px;background:var(--color-accent);color:#000;border-radius:0;font:700 9px/1.2 var(--mono)}
.photo .cap{padding:10px 11px;border-top:2px solid #0f172a}
.photo .cap .t{overflow:hidden;color:#0f172a;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:800}
.photo .cap .m{display:flex;justify-content:space-between;margin-top:5px;color:var(--color-muted-foreground);font:400 9.5px/1.3 var(--mono)}
.rl{display:flex;flex-direction:column;gap:0}
.rl .r{display:flex;align-items:center;gap:12px;padding:11px 3px;border-bottom:1px solid var(--color-border)}
.rl .r:last-child{border-bottom:0}
.rl .ic{display:grid;place-items:center;width:36px;height:36px;flex:none;background:#0f172a;color:#fff;border-radius:0}
.rl .ic .material-symbols-outlined{font-size:19px}
.rl .bd{flex:1;min-width:0}
.rl .bd .t{overflow:hidden;color:#0f172a;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}
.rl .bd .s{margin-top:2px;color:var(--color-muted-foreground);font-size:10.5px}
.rl .rt{text-align:right;flex:none}
.rl .rt .a{font:700 12.5px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.rl .rt .b{color:var(--color-muted-foreground);font:400 9.5px/1.3 var(--mono)}
.cbar{display:grid;grid-template-columns:125px 1fr 92px;align-items:center;gap:12px;min-width:0;padding:10px 0;border-bottom:1px solid var(--color-border)}
.cbar .nm{min-width:0;overflow:hidden;color:#0f172a;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:700}
.cbar .track{position:relative;height:22px;overflow:hidden;background:#f8fafc;border:1px solid #64748b;border-radius:0}
.cbar .bud{position:absolute;inset:0 auto 0 0;background:#cbd5e1}
.cbar .act{position:absolute;inset:0 auto 0 0;background:#334155;border-right:4px solid var(--color-accent);border-radius:0}
.cbar .act.over{background:repeating-linear-gradient(135deg,#991b1b 0,#991b1b 6px,#dc2626 7px,#dc2626 12px)}
.cbar .rt{text-align:right;font:700 10.5px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.slist{display:flex;flex-direction:column;gap:11px}
.slist .s{display:flex;align-items:center;gap:10px;font-size:11.5px}
.slist .s .bx{height:11px;flex:1;overflow:hidden;background:#e2e8f0;border:1px solid #64748b;border-radius:0}
.slist .s .bx i{display:block;height:100%;border-radius:0;background-image:repeating-linear-gradient(135deg,transparent 0,transparent 4px,rgba(255,255,255,.35) 5px,rgba(255,255,255,.35) 6px)}
.slist .s .vv{width:38px;text-align:right;font:700 11px/1 var(--mono);font-variant-numeric:tabular-nums}
.live{display:inline-block;width:9px;height:9px;background:var(--ok);border:1px solid #0f172a;border-radius:0}
@keyframes grid-in{0%{opacity:0;transform:translateY(16px) scale(.94)}100%{opacity:1;transform:none}}
#screen>.grid>* ,#screen>.card,#screen>.dr-head>*{animation:grid-in .4s cubic-bezier(.34,1.56,.64,1) both}
#screen>.grid>*:nth-child(2),#screen>.dr-head>*:nth-child(2){animation-delay:.06s}
#screen>.grid>*:nth-child(3),#screen>.dr-head>*:nth-child(3){animation-delay:.12s}
#screen>.grid>*:nth-child(4),#screen>.dr-head>*:nth-child(4){animation-delay:.18s}
@media(max-width:1120px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .app{flex-direction:column}
  .side{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid #0f172a}
  .brand{padding:14px 16px}
  .brand .logo{width:42px;height:42px}
  .nav{flex:auto;flex-direction:row;overflow-x:auto;padding:0}
  .nav button{width:auto;min-width:132px;flex:none;padding:12px 14px;border-right:1px solid #334155;border-bottom:0}
  .nav button:hover{transform:none}
  .nav button .d{display:none}
  .side .foot{display:none}
  .main{padding:24px 20px 44px}
  .top{min-height:170px;padding:25px 24px}
}
@media(max-width:760px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .dr-head{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(even){transform:none}
  .top{align-items:flex-start;box-shadow:7px 7px 0 var(--color-accent)}
  .top .meta{width:100%}
}
@media(max-width:520px){
  body{font-size:13px;background-size:24px 24px}
  .main{padding:18px 13px 36px}
  .brand{padding:11px 13px}
  .brand b{font-size:14px}
  .nav button{min-width:48px;padding:12px 14px;justify-content:center}
  .nav button .t{display:none}
  .top{min-height:210px;margin-bottom:22px;padding:22px 18px}
  .top h1{font-size:37px}
  .top .sub{font-size:11.5px}
  .chip{flex:1;justify-content:center;padding:8px;font-size:9.5px}
  .chip+.chip{margin-left:7px}
  .dr-head{grid-template-columns:1fr 1fr;gap:10px}
  .mini{padding:12px}
  .mini .v{font-size:20px}
  .photos{grid-template-columns:1fr}
  .card{padding:15px;box-shadow:4px 4px 0 #cbd5e1}
  .cbar{grid-template-columns:82px minmax(90px,1fr) 68px;gap:8px}
  table{min-width:440px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #screen>.grid>*,#screen>.card,#screen>.dr-head>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">apartment</span></div>
      <div><b>營建專案管理</b><span>Jvision 工程管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">© 2026 Jvision Demo · 全部為示意資料</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[

    ["第 5 期估驗計價","土建結構","28,600","已核付","t-ok"],

    +'<div class="grid g23" style="margin-bottom:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">payments</span>各科目預算 vs 實支</h3><div class="hint">灰底為預算，深色為實支（超支以紅色顯示，單位：千元）</div>'+cbars+'<div class="leg"><span><i class="dot" style="background:#e2e8f0"></i>預算</span><span><i class="dot" style="background:var(--accent)"></i>實支</span><span><i class="dot" style="background:#dc2626"></i>超支</span></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">area_chart</span>現金流與請款</h3><div class="hint">月度實支與累計請款趨勢</div><div class="can-wrap sm"><canvas id="c4"></canvas></div></div>'
    +'</div>'

}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAWS=[draw0,draw1,draw2,draw3,draw4,draw5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="t">'+m.name+'<span class="d">'+m.desc+'</span></span></button>';
  }).join("");
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b)return;
    show(+b.getAttribute("data-i"));
  });
}
function show(i){
  destroyChart();
  var buttons=document.querySelectorAll("[data-i]");
  for(var k=0;k<buttons.length;k++){ buttons[k].classList.toggle("on",+buttons[k].getAttribute("data-i")===i); }
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  void container.offsetHeight;
  if(DRAWS[i]) DRAWS[i]();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
