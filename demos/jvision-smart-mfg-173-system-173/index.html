<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供應商產能協同管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#4f46e5;
  --accent2:#818cf8;
  --bg:#f4f5fb;
  --panel:#ffffff;
  --ink:#1e2033;
  --muted:#6b6f88;
  --line:#e7e8f3;
  --ok:#16a34a;
  --warn:#f59e0b;
  --bad:#dc2626;
  --soft:#eef0fc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:14px;
  padding:16px 22px;
  background:linear-gradient(120deg,#4f46e5,#6366f1 55%,#818cf8);
  color:#fff;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:44px;height:44px;border-radius:13px;flex:0 0 auto;
  background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;
}
.logo .material-symbols-outlined{font-size:26px}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.3px}
.brand p{font-size:12px;margin:2px 0 0;opacity:.85}
.top-meta{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}
.tm{text-align:right;min-width:0}
.tm b{font-size:16px;display:block}
.tm span{font-size:11px;opacity:.85}
.nav{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.nav button{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:9px 14px;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;min-width:0;
  transition:all .15s;
}
.nav button .material-symbols-outlined{font-size:20px}
.nav button:hover{border-color:var(--accent2);color:var(--accent)}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.stage{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);font-weight:600;
  background:var(--soft);padding:8px 12px;border-radius:10px;min-width:0;
}
.stage .material-symbols-outlined{font-size:18px;color:var(--accent)}
.wrap{padding:20px 18px 40px;flex:1}
.screen-head{margin-bottom:16px}
.screen-head h2{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:10px}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px}
.screen-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.split.wide{grid-template-columns:380px 1fr}
.split.even{grid-template-columns:1fr 1fr}
@media(max-width:820px){.split,.split.wide,.split.even{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.listwrap{display:flex;flex-direction:column;gap:9px}
.li{
  border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
  transition:all .15s;background:#fff;min-width:0;
}
.li:hover{border-color:var(--accent2);background:var(--soft)}
.li.act{border-color:var(--accent);background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.li .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li .code{font-size:11px;font-weight:700;color:var(--accent);background:#eef0fc;padding:2px 7px;border-radius:6px}
.li .nm{font-weight:700;font-size:13px}
.li .r2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.li .r2 b{color:var(--ink)}
.bar{height:7px;border-radius:6px;background:#ecedf7;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.kpi .ic .material-symbols-outlined{color:var(--accent);font-size:22px}
.kpi .v{font-size:24px;font-weight:800;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:5px}
.kpi .d{font-size:11px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:3px}
.kpi .d .material-symbols-outlined{font-size:14px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill .material-symbols-outlined{font-size:14px}
.p-ok{background:#e6f6ec;color:#15803d}
.p-warn{background:#fef3d9;color:#b45309}
.p-bad{background:#fde5e5;color:#b91c1c}
.p-info{background:#e8eaff;color:#4338ca}
.p-mut{background:#eef0f4;color:#5b6070}
.chart-box{position:relative;width:100%;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:#f8f9ff;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col .ct{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.col .ct .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;min-width:0}
.tk:last-child{margin-bottom:0}
.tk .tt{font-size:12px;font-weight:700;margin-bottom:6px}
.tk .mt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk .lft{border-left:3px solid var(--accent);padding-left:8px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;margin-bottom:16px}
.tl-i:last-child{margin-bottom:0}
.tl-i .dot{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center}
.tl-i .dot .material-symbols-outlined{font-size:12px;color:var(--accent)}
.tl-i .tw{font-size:11px;color:var(--muted);font-weight:600}
.tl-i .tx{font-size:13px;font-weight:600;margin:2px 0}
.tl-i .td{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.dl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.dl:last-child{border-bottom:none}
.dl span{color:var(--muted)}
.dl b{font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}
.note{font-size:12px;color:var(--muted);background:#f8f9ff;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:12px;line-height:1.6}
.callout{display:flex;gap:10px;align-items:flex-start;background:#fef6ec;border:1px solid #fbe2bf;border-radius:12px;padding:12px;margin-bottom:14px}
.callout .material-symbols-outlined{color:var(--warn);font-size:22px;flex:0 0 auto}
.callout .t{font-size:13px;font-weight:700}
.callout .d{font-size:12px;color:#7a6320;margin-top:2px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
  .stage{display:none}
  .top-meta{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div>
        <h1>供應商產能協同管理系統</h1>
        <p>需求預測共享 · 產能瓶頸預警 · 協同排產</p>
      </div>
    </div>
    <div class="top-meta">
      <div class="tm"><b>92%</b><span>準時到貨率</span></div>
      <div class="tm"><b>86%</b><span>協同覆蓋率</span></div>
      <div class="tm"><b>採購部</b><span>作業角色</span></div>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="wrap"><div id="screen"></div></main>
  <div class="foot">供應商產能協同管理系統 · 純前端展示原型 · 資料為模擬</div>
</div>

<script>
(function(){
"use strict";

var SCREENS=[
  {i:0,name:"需求預測共享",icon:"trending_up"},
  {i:1,name:"供應商產能回饋",icon:"groups"},
  {i:2,name:"產能負荷可視化",icon:"monitoring"},
  {i:3,name:"產能瓶頸預警",icon:"warning"},
  {i:4,name:"協同排產調整",icon:"account_tree"},
  {i:5,name:"執行追蹤稽核",icon:"fact_check"}
];
var STAGE=["需求預測共享","供應商回饋產能","—","瓶頸辨識","協同調整排產","追蹤執行"];

var chart=null;
function killChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }

function esc(s){return String(s).replace(/[&<>]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch];});}
function loadColor(p){ return p>=100?"#dc2626":p>=90?"#f59e0b":p>=70?"#4f46e5":"#16a34a"; }
function pill(kind,ic,txt){ return '<span class="pill '+kind+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(txt)+'</span>'; }

var SUPPLIERS=[
  {code:"SUP-A17",name:"宏昕精密",part:"CNC 支架 A2",fc:4200,cap:3800,unit:"件/週",lead:7,region:"台中",tier:"A"},
  {code:"SUP-B09",name:"泰鋼扣件",part:"扣件組 B7",fc:6800,cap:7200,unit:"件/週",lead:5,region:"高雄",tier:"A"},
  {code:"SUP-C22",name:"永光電子",part:"連接器 C4",fc:15200,cap:12800,unit:"件/週",lead:10,region:"新竹",tier:"B"},
  {code:"SUP-D14",name:"晉發塑膠",part:"外殼 D3",fc:9600,cap:9800,unit:"件/週",lead:6,region:"桃園",tier:"A"},
  {code:"SUP-E31",name:"銘泰金屬",part:"沖壓件 E1",fc:5400,cap:4200,unit:"件/週",lead:8,region:"台南",tier:"B"},
  {code:"SUP-F05",name:"和成模具",part:"模組 F6",fc:2100,cap:2400,unit:"件/週",lead:12,region:"台中",tier:"A"}
];
function loadPct(s){ return Math.round(s.fc/s.cap*100); }

function s0(c){
  var sel=window.__s0||0; if(sel>=SUPPLIERS.length)sel=0;
  var s=SUPPLIERS[sel];
  var lis=SUPPLIERS.map(function(x,i){
    var p=loadPct(x);
    return '<div class="li'+(i===sel?' act':'')+'" data-s0="'+i+'">'+
      '<div class="r1"><span class="code">'+esc(x.code)+'</span><span class="nm">'+esc(x.name)+'</span></div>'+
      '<div class="r2"><span>料號 <b>'+esc(x.part)+'</b></span><span>負荷 <b>'+p+'%</b></span></div>'+
      '<div class="bar"><i style="width:'+Math.min(p,100)+'%;background:'+loadColor(p)+'"></i></div>'+
      '</div>';
  }).join("");
  c.innerHTML=
    head("trending_up","需求預測共享","將滾動需求預測依料號拆分後發布給對應供應商，建立共同的產能規劃基準。")+
    '<div class="split wide">'+
      '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>發布清單<span class="sub">共 '+SUPPLIERS.length+' 家</span></h3><div class="listwrap">'+lis+'</div></div>'+
      '<div>'+
        '<div class="card"><h3><span class="material-symbols-outlined">description</span>'+esc(s.name)+' · '+esc(s.part)+'</h3>'+
          '<div class="grid2">'+
            '<div>'+
              '<div class="dl"><span>供應商代碼</span><b>'+esc(s.code)+'</b></div>'+
              '<div class="dl"><span>供應區域</span><b>'+esc(s.region)+'</b></div>'+
              '<div class="dl"><span>分級</span><b>Tier '+esc(s.tier)+'</b></div>'+
              '<div class="dl"><span>標準交期</span><b>'+s.lead+' 天</b></div>'+
            '</div>'+
            '<div>'+
              '<div class="dl"><span>四週需求</span><b class="mono">'+(s.fc).toLocaleString()+'</b></div>'+
              '<div class="dl"><span>標準產能</span><b class="mono">'+(s.cap).toLocaleString()+'</b></div>'+
              '<div class="dl"><span>預估負荷率</span><b class="mono" style="color:'+loadColor(loadPct(s))+'">'+loadPct(s)+'%</b></div>'+
              '<div class="dl"><span>發布狀態</span>'+pill("p-ok","check_circle","已共享")+'</div>'+
            '</div>'+
          '</div>'+
          '<div class="note">共享頻率為每週滾動 8 週，供應商須於發布後 48 小時內回饋可承接產能。</div>'+
        '</div>'+
        '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">show_chart</span>未來 8 週滾動需求（'+esc(s.part)+'）</h3>'+
          '<div class="chart-box" style="height:240px"><canvas id="c0"></canvas></div></div>'+
      '</div>'+
    '</div>';
  void c.offsetHeight;
  var base=s.fc/4;
  var demand=[]; for(var w=0;w<8;w++){ demand.push(Math.round(base*(0.85+Math.sin(w/1.6)*0.18+w*0.02))); }
  var capLine=demand.map(function(){return Math.round(s.cap/4);});
  chart=new Chart(document.getElementById("c0"),{
    type:"bar",
    data:{labels:["W1","W2","W3","W4","W5","W6","W7","W8"],
      datasets:[
        {label:"預測需求",data:demand,backgroundColor:"#4f46e5",borderRadius:5,order:2},
        {label:"週產能上限",data:capLine,type:"line",borderColor:"#f59e0b",backgroundColor:"transparent",borderWidth:2,tension:.3,pointRadius:3,order:1}
      ]},
    options:baseOpts()
  });
}

function s1(c){
  var sel=window.__s1||0; if(sel>=SUPPLIERS.length)sel=0;
  var s=SUPPLIERS[sel];
  var lis=SUPPLIERS.map(function(x,i){
    var replied=(i%5!==4);
    return '<div class="li'+(i===sel?' act':'')+'" data-s1="'+i+'">'+
      '<div class="r1"><span class="code">'+esc(x.code)+'</span><span class="nm">'+esc(x.name)+'</span></div>'+
      '<div class="r2"><span>料號 <b>'+esc(x.part)+'</b></span>'+(replied?pill("p-ok","task_alt","已回饋"):pill("p-warn","hourglass_empty","待回饋"))+'</div>'+
      '</div>';
  }).join("");
  var weeks=["W1","W2","W3","W4","W5","W6"];
  var rows=weeks.map(function(w,k){
    var need=Math.round(s.fc/4*(0.9+k*0.04));
    var can=Math.round(s.cap/4*(0.95+(k===2?-0.25:0.02)));
    var gap=can-need;
    var st= gap>=0? pill("p-ok","check","可承接") : pill("p-bad","priority_high","缺口");
    return '<tr><td><b>'+w+'</b></td>'+
      '<td class="mono">'+need.toLocaleString()+'</td>'+
      '<td class="mono">'+can.toLocaleString()+'</td>'+
      '<td class="mono" style="color:'+(gap>=0?"var(--ok)":"var(--bad)")+'">'+(gap>=0?"+":"")+gap.toLocaleString()+'</td>'+
      '<td>'+st+'</td></tr>';
  }).join("");
  c.innerHTML=
    head("groups","供應商產能回饋","供應商在期限內回填各週可承接產能與限制，系統彙整成可比對的產能池。")+
    '<div class="split">'+
      '<div class="card"><h3><span class="material-symbols-outlined">forum</span>回饋進度</h3><div class="listwrap">'+lis+'</div></div>'+
      '<div class="card pad0">'+
        '<div style="padding:16px 16px 4px"><h3 style="margin:0"><span class="material-symbols-outlined">edit_note</span>'+esc(s.name)+' 產能回填（'+esc(s.part)+'）</h3></div>'+
        '<div class="tbl-wrap"><table>'+
          '<thead><tr><th>週次</th><th>需求量</th><th>可承接</th><th>差額</th><th>狀態</th></tr></thead>'+
          '<tbody>'+rows+'</tbody></table></div>'+
        '<div style="padding:0 16px 16px"><div class="callout"><span class="material-symbols-outlined">info</span><div><div class="t">W3 因設備保養產能受限</div><div class="d">供應商回饋 W3 有約 25% 產能缺口，建議提前於瓶頸辨識模組介入。</div></div></div></div>'+
      '</div>'+
    '</div>';
}

function s2(c){
  c.innerHTML=
    head("monitoring","產能負荷可視化","比對整體需求與供應商回饋產能，將負荷率一覽呈現，掌握協同缺口。")+
    '<div class="kpis">'+
      kpi("inventory_2","6 家","協同供應商","up","+1 家")+
      kpi("percent","86%","產能協同覆蓋率","up","+7pt")+
      kpi("warning","2","產能超載料號","down","-1")+
      kpi("local_shipping","92%","插單達交率","up","+8pt")+
    '</div>'+
    '<div class="split even" style="margin-top:16px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各供應商負荷率</h3><div class="chart-box" style="height:280px"><canvas id="c2a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>產能池分佈</h3><div class="chart-box" style="height:280px"><canvas id="c2b"></canvas></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">stacked_line_chart</span>準時到貨率趨勢（近 6 週）</h3><div class="chart-box" style="height:230px"><canvas id="c2c"></canvas></div></div>';
  void c.offsetHeight;
  var names=SUPPLIERS.map(function(x){return x.name;});
  var loads=SUPPLIERS.map(loadPct);
  new Chart(document.getElementById("c2a"),{
    type:"bar",
    data:{labels:names,datasets:[{label:"負荷率 %",data:loads,backgroundColor:loads.map(loadColor),borderRadius:5}]},
    options:baseOpts(true)
  });

function head(ic,t,d){

function kpi(ic,v,l,dir,dv){
  var d;
  if(dir==="up"||dir==="down"){
    d='<div class="d '+dir+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+esc(dv)+'</div>';
  }else{
    d='<div class="d" style="color:var(--muted)">'+esc(dv||"")+'</div>';
  }
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div>'+d+'</div>';
}
function baseOpts(horiz){
  var o={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{family:"Inter",size:12},boxWidth:12,padding:12}}},
    scales:{x:{grid:{display:false},ticks:{font:{family:"Inter",size:11}}},y:{grid:{color:"#eef0f4"},ticks:{font:{family:"Inter",size:11}}}}};
  if(horiz){o.indexAxis="y";o.plugins.legend.display=false;}
  return o;
}

var RENDER=[s0,s1,s2,s3,s4,s5];

function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  window.__cur=i;
  killChart();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
  var st=document.getElementById("stagelbl");
  if(st){ st.textContent=STAGE[i]==="—"?"—":("流程："+STAGE[i]); }
  var c=document.getElementById("screen");
  RENDER[i](c);
  void c.offsetHeight;
  bindSub();
}

function bindSub(){
  var c=document.getElementById("screen");
  ["s0","s1","s3","s4"].forEach(function(key){
    var els=c.querySelectorAll("[data-"+key+"]");
    for(var i=0;i<els.length;i++){
      (function(el){
        el.addEventListener("click",function(){
          window["__"+key]=+el.getAttribute("data-"+key);
          show(window.__cur);
        });
      })(els[i]);
    }
  });
}

(function(){
  var nav=document.getElementById("nav");

    return '<button data-i="'+s.i+'"><span class="material-symbols-outlined">'+s.icon+'</span><span class="lbl">'+esc(s.name)+'</span></button>';
  }).join("");
  html+='<span class="stage"><span class="material-symbols-outlined">conversion_path</span><span id="stagelbl">流程</span></span>';
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    (function(b){ b.addEventListener("click",function(){ location.hash="v"+b.getAttribute("data-i"); }); })(btns[i]);
  }
})();

window.show=show;
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
