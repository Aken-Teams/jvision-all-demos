<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>供應商產能協同管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --panel:#fff;
  --soft:#eff6ff;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-s0],[data-s1],[data-s3],[data-s4]{cursor:pointer}
button:focus-visible,[data-s0]:focus-visible,[data-s1]:focus-visible,
[data-s3]:focus-visible,[data-s4]:focus-visible{
  outline:3px solid rgba(37,99,235,.3);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  -webkit-font-feature-settings:"liga";
  -webkit-font-smoothing:antialiased;
}
.app{width:min(100%,1440px);min-height:100vh;margin:auto;display:flex;flex-direction:column}
.top{
  position:relative;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:92px;
  padding:18px 28px;
  overflow:hidden;
  color:#fff;
  background:#0f2f66;
  border-bottom:4px solid var(--color-accent);
}
.top:after{
  content:"";
  position:absolute;
  right:-70px;
  top:-140px;
  width:430px;
  height:300px;
  border:1px solid rgba(255,255,255,.16);
  transform:rotate(-10deg);
  pointer-events:none;
}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:14px;min-width:0}
.logo{
  width:48px;height:48px;flex:0 0 auto;
  display:grid;place-items:center;
  background:var(--color-primary);
  border:1px solid rgba(255,255,255,.42);
  border-radius:4px;
  box-shadow:5px 5px 0 rgba(0,0,0,.16);
}
.logo .material-symbols-outlined{font-size:27px}
.brand h1{margin:0;font-size:19px;line-height:1.3;font-weight:700;letter-spacing:.02em}
.brand p{margin:4px 0 0;color:#dbeafe;font-size:12px;letter-spacing:.04em}
.top-meta{position:relative;z-index:1;margin-left:auto;display:flex;align-items:stretch}
.tm{
  min-width:108px;
  padding:3px 18px;
  text-align:right;
  border-left:1px solid rgba(255,255,255,.25);
}
.tm b{display:block;font-family:"Fira Code",monospace;font-size:17px;line-height:1.3}
.tm span{display:block;margin-top:3px;color:#dbeafe;font-size:11px}
.nav{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:4px;
  padding:8px 20px;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 14px rgba(15,23,42,.05);
  backdrop-filter:blur(12px);
}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s;
}
.nav button:hover{color:var(--blue);background:var(--soft);border-color:#bfdbfe}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:inset 0 -3px 0 #1d4ed8;
}
.nav button .material-symbols-outlined{font-size:19px}
.stage{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 10px;
  color:#1e40af;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:3px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.stage .material-symbols-outlined{font-size:17px}
.wrap{flex:1;padding:24px 22px 42px}
#screen{animation:screen-in .36s ease-out both}
.screen-head{
  position:relative;
  margin-bottom:18px;
  padding:4px 0 14px 16px;
  border-bottom:1px solid var(--line);
}
.screen-head:before{
  content:"";
  position:absolute;
  left:0;top:4px;bottom:14px;
  width:4px;
  background:var(--blue);
}
.screen-head h2{display:flex;align-items:center;gap:9px;margin:0;font-size:21px;line-height:1.35;font-weight:700}
.screen-head h2 .material-symbols-outlined{color:var(--blue);font-size:24px}
.screen-head p{max-width:860px;margin:5px 0 0;color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.split.wide{grid-template-columns:370px minmax(0,1fr)}
.split.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card,.kpi{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
}
.card{padding:15px}
.card.pad0{padding:0;overflow:hidden}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 12px;
  color:#0f172a;
  font-size:13px;
  line-height:1.4;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:18px}
.card .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.listwrap{display:flex;flex-direction:column;gap:7px}
.li{
  position:relative;
  min-width:0;
  padding:10px 11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:3px;
  transition:background-color .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.li:hover{background:#f8fbff;border-color:#93c5fd;transform:translateY(-1px)}
.li.act{background:#eff6ff;border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.li .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li .code{
  padding:2px 6px;
  color:#1d4ed8;
  background:#dbeafe;
  border-radius:2px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.li .nm{color:#0f172a;font-size:12px;font-weight:700}
.li .r2{display:flex;align-items:center;gap:9px;margin-top:7px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.li .r2 b{color:var(--ink);font-weight:600}
.bar{height:6px;margin-top:8px;background:#e2e8f0;border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:1px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{
  position:relative;
  display:grid;
  grid-template-columns:38px 1fr;
  grid-template-areas:"ic value" "ic label" "ic delta";
  column-gap:11px;
  padding:14px;
  overflow:hidden;
}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#bfdbfe}
.kpi .ic{
  grid-area:ic;
  width:38px;height:38px;
  display:grid;place-items:center;
  color:var(--blue);
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-radius:3px;
}
.kpi .ic .material-symbols-outlined{font-size:21px}
.kpi .v{grid-area:value;color:#0f172a;font-family:"Fira Code",monospace;font-size:22px;line-height:1.1;font-weight:700}
.kpi .l{grid-area:label;margin-top:3px;color:var(--muted);font-size:11px}
.kpi .d{grid-area:delta;display:flex;align-items:center;gap:3px;margin-top:4px;font-size:10px;font-weight:700}
.kpi .d .material-symbols-outlined{font-size:13px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tbl-wrap{width:100%;overflow-x:auto}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th{
  padding:9px 11px;
  color:#334155;
  background:#f1f5f9;
  border-top:1px solid var(--line);
  border-bottom:1px solid #cbd5e1;
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}
td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fbff}
td:nth-child(n+2).mono,.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
td.mono{text-align:right}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid transparent;
  border-radius:2px;
  font-size:10px;
  line-height:1.25;
  font-weight:700;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:13px}
.p-ok{color:#166534;background:#ecfdf3;border-color:#bbf7d0}
.p-warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
.p-bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.p-info{color:#1e40af;background:#eff6ff;border-color:#bfdbfe}
.p-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.chart-box{position:relative;width:100%;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.col{min-width:0;padding:9px;background:#f8fafc;border:1px solid var(--line);border-top:3px solid #94a3b8;border-radius:3px}
.col:nth-child(2){border-top-color:var(--blue)}
.col:nth-child(3){border-top-color:var(--color-accent)}
.col:nth-child(4){border-top-color:var(--ok)}
.col .ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#334155;font-size:11px;font-weight:700}
.col .ct .cnt{
  min-width:22px;
  padding:1px 6px;
  color:#334155;
  background:#fff;
  border:1px solid var(--line);
  border-radius:2px;
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{min-width:0;margin-bottom:7px;padding:9px;background:#fff;border:1px solid var(--line);border-radius:3px}
.tk:last-child{margin-bottom:0}
.tk .tt{margin-bottom:6px;font-size:11px;font-weight:700}
.tk .mt{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px;flex-wrap:wrap}
.tk .lft{padding-left:7px;border-left:3px solid var(--blue)}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:9px;top:5px;bottom:5px;width:1px;background:#cbd5e1}
.tl-i{position:relative;margin-bottom:15px}
.tl-i:last-child{margin-bottom:0}
.tl-i .dot{
  position:absolute;
  left:-27px;top:0;
  width:19px;height:19px;
  display:grid;place-items:center;
  color:var(--blue);
  background:#fff;
  border:2px solid var(--blue);
  border-radius:50%;
}
.tl-i .dot .material-symbols-outlined{font-size:11px}
.tl-i .tw{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.tl-i .tx{margin:2px 0;color:#0f172a;font-size:12px;font-weight:700}
.tl-i .td{color:var(--muted);font-size:11px}
.dl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.dl:last-child{border-bottom:0}
.dl span{color:var(--muted)}
.dl b{color:#0f172a;font-weight:600}
.dl b.mono{text-align:right}
.tag{
  display:inline-block;
  margin:2px 4px 2px 0;
  padding:3px 7px;
  color:#1e40af;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:2px;
  font-size:10px;
  font-weight:600;
}
.note{
  margin-top:12px;
  padding:10px;
  color:#334155;
  background:#f8fafc;
  border-left:3px solid var(--blue);
  font-size:11px;
  line-height:1.65;
}
.callout{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin-bottom:13px;
  padding:11px;
  color:#7c2d12;
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-left:4px solid var(--color-accent);
  border-radius:3px;
}
.callout .material-symbols-outlined{flex:0 0 auto;color:var(--color-accent);font-size:20px}
.callout .t{font-size:12px;font-weight:700}
.callout .d{margin-top:2px;color:#7c2d12;font-size:11px}
.foot{padding:18px;text-align:center;color:var(--muted);border-top:1px solid var(--line);font-size:11px}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .nav{overflow-x:auto}
  .stage{display:none}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .top{padding:16px 18px}
  .top-meta{display:none}
  .wrap{padding:18px 14px 36px}
  .split,.split.wide,.split.even,.grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .top{min-height:82px}
  .logo{width:42px;height:42px}
  .brand h1{font-size:16px}
  .brand p{font-size:10px}
  .nav{padding:7px 10px}
  .nav button{min-width:42px;justify-content:center;padding:8px 10px}
  .nav button .lbl{display:none}
  .screen-head h2{font-size:18px}
  .kpis,.board{grid-template-columns:1fr}
  .card{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #screen{animation:none}
  .li:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">account_tree</span></div>
    <div>
      <h1>供應商產能協同管理系統</h1>
      <p>需求預測共享 · 產能瓶頸預警 · 協同排產</p>
    </div>
  </div>
  <div class="top-meta">
    <div class="tm"><b>92%</b><span>準時到貨率</span></div>
    <div class="tm"><b>86%</b><span>協同覆蓋率</span></div>
    <div class="tm"><b>採購部</b><span>作業角色</span></div>
  </div>
</header>
<nav class="nav" id="nav" aria-label="系統功能"></nav>
<main class="wrap"><div id="screen"></div></main>
<footer class="foot">供應商產能協同管理系統 · 純前端展示原型 · 資料為模擬</footer>
</div>
<script>
(function(){
"use strict";
var SCREENS=[
{i:0,name:"需求預測共享",icon:"trending_up"},
{i:1,name:"供應商產能回饋",icon:"groups"},
{i:2,name:"產能負荷可視化",icon:"monitoring"},
{i:3,name:"產能瓶頸預警",icon:"warning"},
{i:4,name:"協同排產調整",icon:"account_tree"},
{i:5,name:"執行追蹤稽核",icon:"fact_check"}
];
var STAGE=["需求預測共享","供應商回饋產能","—","瓶頸辨識","協同調整排產","追蹤執行"];
var charts=[];
function killChart(){
  charts.forEach(function(x){try{x.destroy()}catch(e){}});
  charts=[];
}
function addChart(id,config){
  var node=document.getElementById(id);
  if(node)charts.push(new Chart(node,config));
}
function esc(s){
  return String(s).replace(/[&<>]/g,function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch];
  });
}
function loadColor(p){return p>=100?"#dc2626":p>=90?"#b45309":p>=70?"#2563eb":"#15803d"}
function pill(kind,ic,txt){
  return '<span class="pill '+kind+'"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+esc(txt)+'</span>';
}
var SUPPLIERS=[
{code:"SUP-A17",name:"O昕精密",part:"CNC 支架 A2",fc:4200,cap:3800,unit:"件/週",lead:7,region:"台中",tier:"A"},
{code:"SUP-B09",name:"O鋼扣件",part:"扣件組 B7",fc:6800,cap:7200,unit:"件/週",lead:5,region:"高雄",tier:"A"},
{code:"SUP-C22",name:"永O電子",part:"連接器 C4",fc:15200,cap:12800,unit:"件/週",lead:10,region:"新竹",tier:"B"},
{code:"SUP-D14",name:"O發塑膠",part:"外殼 D3",fc:9600,cap:9800,unit:"件/週",lead:6,region:"桃園",tier:"A"},
{code:"SUP-E31",name:"銘O金屬",part:"沖壓件 E1",fc:5400,cap:4200,unit:"件/週",lead:8,region:"台南",tier:"B"},
{code:"SUP-F05",name:"O成模具",part:"模組 F6",fc:2100,cap:2400,unit:"件/週",lead:12,region:"台中",tier:"A"}
];
function loadPct(s){return Math.round(s.fc/s.cap*100)}
function itemAttrs(key,i){return ' tabindex="0" role="button" data-'+key+'="'+i+'"'}
function s0(c){
  var sel=window.__s0||0;if(sel>=SUPPLIERS.length)sel=0;
  var s=SUPPLIERS[sel];
  var lis=SUPPLIERS.map(function(x,i){
    var p=loadPct(x);
    return '<div class="li'+(i===sel?' act':'')+'"'+itemAttrs("s0",i)+'>'+
    '<div class="r1"><span class="code">'+esc(x.code)+'</span><span class="nm">'+esc(x.name)+'</span></div>'+
    '<div class="r2"><span>料號 <b>'+esc(x.part)+'</b></span><span>負荷 <b>'+p+'%</b></span></div>'+
    '<div class="bar" role="progressbar" aria-label="負荷率 '+p+'%" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.min(p,100)+'%;background:'+loadColor(p)+'"></i></div></div>';
  }).join("");
  c.innerHTML=head("trending_up","需求預測共享","將滾動需求預測依料號拆分後發布給對應供應商，建立共同的產能規劃基準。")+
  '<div class="split wide"><div class="card"><h3><span class="material-symbols-outlined">list_alt</span>發布清單<span class="sub">共 '+SUPPLIERS.length+' 家</span></h3><div class="listwrap">'+lis+'</div></div>'+
  '<div><div class="card"><h3><span class="material-symbols-outlined">description</span>'+esc(s.name)+' · '+esc(s.part)+'</h3>'+
  '<div class="grid2"><div>'+
  '<div class="dl"><span>供應商代碼</span><b class="mono">'+esc(s.code)+'</b></div>'+
  '<div class="dl"><span>供應區域</span><b>'+esc(s.region)+'</b></div>'+

function show(i){

  killChart();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var active=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("on",active);
    btns[k].setAttribute("aria-current",active?"page":"false");
  }
  var st=document.getElementById("stagelbl");
  if(st)st.textContent=STAGE[i]==="—"?"—":"流程："+STAGE[i];
  var c=document.getElementById("screen");
  RENDER[i](c);
  bindSub();
}
function bindSub(){
  var c=document.getElementById("screen");
  ["s0","s1","s3","s4"].forEach(function(key){
    var els=c.querySelectorAll("[data-"+key+"]");
    function activate(el){
      window["__"+key]=+el.getAttribute("data-"+key);
      show(window.__cur);
    }
    for(var i=0;i<els.length;i++){
      (function(el){
        el.addEventListener("click",function(){activate(el)});
        el.addEventListener("keydown",function(e){
          if(e.key==="Enter"||e.key===" "){e.preventDefault();activate(el)}
        });
      })(els[i]);
    }
  });
}

function fromHash(){

  show(Math.min(+m[1],n-1));

}
