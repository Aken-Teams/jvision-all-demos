<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>差旅與費用報銷系統｜Jvision 系統 Demo</title>
<meta name="description" content="差旅申請、單據 OCR、政策合規檢核到付款撥付與費用稽核的一站式報銷平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#4f46e5;--accent2:#818cf8;--bg:#f4f5fb;--card:#ffffff;--line:#e5e7f0;--ink:#1e2033;--muted:#6b7088;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef0fb;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.layout{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:15px;display:block;}
.brand span{font-size:11px;color:var(--muted);}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;width:100%;min-width:0;}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;}
.navbtn:hover{background:var(--soft);color:var(--accent);}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px var(--accent);}
.navtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidefoot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line);}
.main{flex:1 1 auto;min-width:0;padding:22px 26px 40px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.topbar h1{font-size:20px;margin:0;font-weight:800;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi{display:flex;flex-direction:column;gap:6px;}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.kpi .ic .material-symbols-outlined{font-size:20px;}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.5px;}
.kpi .lab{font-size:12px;color:var(--muted);}
.kpi .chg{font-size:11px;font-weight:700;}
.up{color:var(--bad);}.down{color:var(--ok);}
.chart{width:100%;height:260px;overflow:hidden;}
.chart.sm{height:210px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.t-ok{background:#e7f6ec;color:var(--ok);}
.t-warn{background:#fdf0dc;color:var(--warn);}
.t-bad{background:#fbe6e6;color:var(--bad);}
.t-info{background:var(--soft);color:var(--accent);}
.t-mut{background:#eef0f4;color:var(--muted);}
.bar{height:7px;border-radius:5px;background:#edeef6;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px;}
.col{background:var(--soft);border-radius:12px;padding:10px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.col h4 span{background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;}
.ticket .who{font-size:12.5px;font-weight:700;}
.ticket .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:6px;}
.ticket .amt{font-weight:800;font-size:13px;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlrow{position:relative;padding:0 0 16px;}
.tlrow:last-child{padding-bottom:0;}
.tlrow .d{position:absolute;left:-19px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
.tlrow.done .d{background:var(--accent);border-color:var(--accent);}
.tlrow .tt{font-size:13px;font-weight:700;}
.tlrow .ts{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tlrow .tm{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:2px;}
.receipt{border:1px dashed var(--accent2);border-radius:12px;padding:14px;background:linear-gradient(180deg,#fff,var(--soft));}
.rline{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dotted var(--line);}
.rline:last-child{border-bottom:none;}
.rline .k{color:var(--muted);}
.rline b{font-weight:800;}
.ocrbox{display:flex;gap:14px;flex-wrap:wrap;}
.ocrimg{flex:1 1 220px;min-width:0;border-radius:12px;background:repeating-linear-gradient(45deg,#eef0fb,#eef0fb 12px,#e6e8f7 12px,#e6e8f7 24px);border:1px solid var(--line);min-height:230px;position:relative;overflow:hidden;}
.ocrimg .scan{position:absolute;left:0;right:0;top:38%;height:3px;background:var(--accent);box-shadow:0 0 12px 2px var(--accent2);}
.ocrimg .tagf{position:absolute;background:rgba(79,70,229,.92);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;}
.progwrap{display:flex;align-items:center;gap:10px;}
.progwrap .lab{width:88px;flex:0 0 auto;font-size:12px;color:var(--muted);}
.progwrap .num{width:66px;text-align:right;font-size:12px;font-weight:700;}
.chk{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;}
.chk .ci{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.chk .ci .material-symbols-outlined{font-size:18px;}
.chk .body{min-width:0;flex:1 1 auto;}
.chk .ct{font-size:13px;font-weight:700;}
.chk .cd{font-size:11.5px;color:var(--muted);margin-top:2px;}
.ci-ok{background:#e7f6ec;color:var(--ok);}
.ci-warn{background:#fdf0dc;color:var(--warn);}
.ci-bad{background:#fbe6e6;color:var(--bad);}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.step{flex:1 1 120px;background:var(--soft);border-radius:10px;padding:10px 12px;min-width:0;border-left:3px solid var(--line);}
.step.act{border-left-color:var(--accent);background:#fff;box-shadow:0 6px 16px -10px var(--accent);}
.step.ok{border-left-color:var(--ok);}
.step .sn{font-size:10.5px;color:var(--muted);font-weight:700;}
.step .st{font-size:12.5px;font-weight:700;margin-top:2px;}
.step .sm{font-size:11px;color:var(--muted);margin-top:3px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend b{color:var(--ink);}
.miniflex{display:flex;gap:14px;flex-wrap:wrap;}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
.hint .material-symbols-outlined{font-size:15px;color:var(--accent);}
@media(max-width:860px){
 .layout{flex-direction:column;}
 .sidebar{width:auto;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px;gap:8px;}
 .brand{padding:0 8px 0 4px;}
 .nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
 .navbtn{width:auto;}
 .sidefoot{display:none;}
 .main{padding:18px 16px 40px;}
}
@media(max-width:820px){
 .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
 .navtxt{display:none;}
 .navbtn{padding:9px;}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">flight_takeoff</span></div>
      <div><b>差旅費用中心</b><span>Travel &amp; Expense</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">Jvision Demo · 假資料展示<br/>版本 v2.4 · 2026 財年</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scTitle">差旅費用總覽</h1>
        <div class="sub" id="scSub"></div>
      </div>
      <span class="pill"><span class="dot"></span>ERP／銀行已同步 · 09:41</span>
    </div>
    <div id="screen" class="grid"></div>
  </main>
</div>
<script>
var MODS=[
 {icon:"dashboard",name:"費用總覽",sub:"報銷概況、待辦與預算耗用即時看板"},
 {icon:"calendar_month",name:"差旅申請與預核",sub:"行程規劃、每日額度試算與線上預核"},
 {icon:"receipt_long",name:"單據上傳與OCR",sub:"發票拍照辨識金額稅別並自動歸科目"},
 {icon:"rule",name:"報銷政策檢核",sub:"每日限額、超支與重複請款自動比對"},
 {icon:"fact_check",name:"簽核與付款撥付",sub:"多關卡覆核、產生付款批次與回寫狀態"},
 {icon:"insights",name:"費用分析與稽核",sub:"科目分佈、超支趨勢與異常抽查稽核"}
];
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function nf(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function buildNav(){
 var nav=document.getElementById("nav");var h="";
 for(var i=0;i<MODS.length;i++){
  h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="navtxt">'+MODS[i].name+'</span></button>';
 }
 nav.innerHTML=h;
 var btns=nav.querySelectorAll("[data-i]");
 for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});}
}

function setActive(i){
 var btns=document.querySelectorAll(".navbtn");
 for(var k=0;k<btns.length;k++){btns[k].className="navbtn"+(+btns[k].getAttribute("data-i")===i?" on":"");}
 document.getElementById("scTitle").textContent=MODS[i].name;
 document.getElementById("scSub").textContent=MODS[i].sub;
}

/* ---------- Screen renderers ---------- */
function s0(){return ''+
 '<div class="grid g4" style="grid-column:1/-1">'+
  kpi("account_balance_wallet","本月報銷總額","NT$ 3,842,600","較上月 +6.4%","up")+
  kpi("pending_actions","待簽核單據","37 筆","逾 3 日 5 筆","up")+
  kpi("savings","差旅預算耗用","68%","剩餘 NT$1.18M","down")+
  kpi("warning","合規例外","9 件","重複請款 2 件","up")+
 '</div>'+
 '<div class="card" style="grid-column:1/-1"><div class="g32 grid">'+
   '<div class="card" style="border:none;padding:0"><h3><span class="material-symbols-outlined">monitoring</span>近 6 週報銷金額與逾期率</h3><div id="c0a" class="chart"></div></div>'+
   '<div class="card" style="border:none;padding:0"><h3><span class="material-symbols-outlined">donut_large</span>費用科目分佈</h3><div id="c0b" class="chart"></div></div>'+
 '</div></div>'+
 '<div class="card" style="grid-column:1/-1"><h3><span class="material-symbols-outlined">list_alt</span>待處理報銷單</h3><div style="overflow-x:auto">'+
   '<table><thead><tr><th>單號</th><th>申請人</th><th>部門</th><th>用途</th><th>金額</th><th>狀態</th><th>停留</th></tr></thead><tbody>'+
    row0("EXP-24810","林祐廷","業務一部","北高客戶拜訪差旅","NT$ 18,640","t-warn","待預核","1 日")+
    row0("EXP-24807","陳曉薇","研發處","上海供應商稽查","NT$ 62,300","t-info","OCR 辨識中","3 小時")+
    row0("EXP-24799","黃俊霖","採購部","展會住宿與交通","NT$ 27,180","t-bad","超支待釐清","2 日")+
    row0("EXP-24788","蘇怡君","財務部","月結對帳出差","NT$ 9,420","t-ok","已核准","—")+
    row0("EXP-24775","王柏丞","業務二部","客戶教育訓練","NT$ 33,900","t-warn","待簽核","4 日")+
   '</tbody></table></div></div>';
}
function s1(){return ''+
 '<div class="card" style="grid-column:1/-1"><div class="stepbar">'+
   step("STEP 1","填寫行程","出差地點與起訖日","act")+
   step("STEP 2","費用試算","依每日額度預估","")+
   step("STEP 3","主管預核","線上簽核放行","")+
 '</div></div>'+
 '<div class="card"><h3><span class="material-symbols-outlined">map</span>行程規劃</h3>'+
   '<div class="tl">'+
    tlr("2/18 09:00","出發 · 台北","高鐵 台北→台南 · 商務洽談","done")+
    tlr("2/18 22:00","住宿 · 台南","商務旅館一晚（含早餐）","done")+
    tlr("2/19 全日","客戶會議 · 台南","供應商稽查與合約議定","")+
    tlr("2/19 20:30","返程 · 台北","高鐵 台南→台北","")+
   '</div>'+
   '<div class="hint"><span class="material-symbols-outlined">info</span>系統依差旅政策自動帶入每日膳雜費上限。</div>'+
 '</div>'+
 '<div class="card"><h3><span class="material-symbols-outlined">request_quote</span>每日額度試算</h3>'+
   '<div id="c1" class="chart sm"></div>'+
   '<div class="legend"><span><b style="color:var(--accent)">■</b> 預估支出</span><span><b style="color:var(--accent2)">■</b> 政策上限</span></div>'+
 '</div>'+
 '<div class="card" style="grid-column:1/-1"><h3><span class="material-symbols-outlined">calculate</span>預算試算明細</h3><div style="overflow-x:auto">'+
   '<table><thead><tr><th>費用科目</th><th>單價</th><th>數量</th><th>預估</th><th>政策上限</th><th>檢核</th></tr></thead><tbody>'+
    row1("交通 · 高鐵來回","1,490","2","NT$ 2,980","不限","t-ok","符合")+
    row1("住宿 · 商務旅館","2,800","1","NT$ 2,800","3,500/晚","t-ok","符合")+
    row1("膳雜費","700","2","NT$ 1,400","800/日","t-ok","符合")+
    row1("計程車 · 市內","—","—","NT$ 900","1,000/日","t-ok","符合")+
    row1("客戶餐敘","3,200","1","NT$ 3,200","2,500/次","t-warn","超上限")+
   '</tbody></table></div>'+
   '<div class="hint"><span class="material-symbols-outlined">check_circle</span>合計預估 NT$ 11,280，其中 1 項超政策上限，送主管預核時將標示。</div>'+
 '</div>';
}
function s2(){return ''+
 '<div class="card"><h3><span class="material-symbols-outlined">photo_camera</span>單據影像 · OCR 辨識中</h3>'+
   '<div class="ocrbox">'+
    '<div class="ocrimg"><div class="scan"></div>'+
     '<div class="tagf" style="left:14px;top:18px">統一編號 84512367</div>'+
     '<div class="tagf" style="left:14px;top:120px">金額 $2,880</div>'+
     '<div class="tagf" style="right:14px;bottom:20px">2026/02/19</div>'+
    '</div>'+
    '<div class="receipt" style="flex:1 1 220px">'+
     rl("店家","台南商務旅館")+rl("發票號碼","AB-49275108")+rl("日期","2026/02/19")+
     rl("稅別","應稅 5%")+rl("未稅金額","NT$ 2,743")+rl("稅額","NT$ 137")+
     '<div class="rline"><span class="k">合計</span><b>NT$ 2,880</b></div>'+
    '</div>'+
   '</div>'+
   '<div class="hint"><span class="material-symbols-outlined">auto_awesome</span>OCR 信心度 97.4%，自動歸類為「住宿費」。</div>'+
 '</div>'+
 '<div class="card"><h3><span class="material-symbols-outlined">insights</span>各科目辨識信心度</h3><div id="c2" class="chart sm"></div></div>'+
 '<div class="card" style="grid-column:1/-1"><h3><span class="material-symbols-outlined">receipt_long</span>本次上傳批次（8 張）</h3><div style="overflow-x:auto">'+
   '<table><thead><tr><th>影像</th><th>店家</th><th>發票號碼</th><th>辨識金額</th><th>歸類科目</th><th>信心度</th><th>狀態</th></tr></thead><tbody>'+
    row2("IMG-01","台南商務旅館","AB-49275108","NT$ 2,880","住宿費","97.4%","t-ok","已歸類")+
    row2("IMG-02","O岸高鐵","CD-11820394","NT$ 2,980","交通費","99.1%","t-ok","已歸類")+
    row2("IMG-03","大車隊計程車","—","NT$ 380","交通費","91.2%","t-ok","已歸類")+
    row2("IMG-04","府城餐館","EE-77410265","NT$ 3,200","餐飲費","95.8%","t-warn","超額標示")+
    row2("IMG-05","便利商店","—","NT$ 165","膳雜費","72.4%","t-bad","需人工確認")+
   '</tbody></table></div></div>';
}
function s3(){return ''+
 '<div class="grid g3" style="grid-column:1/-1">'+
  kpi("rule","本批檢核項目","6 條規則","全數執行","")+
  kpi("task_alt","通過項","4 項","符合政策","down")+
  kpi("gpp_maybe","例外標記","2 項","待人工釐清","up")+
 '</div>'+

/* ---------- html helpers ---------- */
function kpi(ic,lab,val,chg,dir){return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div><div class="val">'+val+'</div><div class="lab">'+lab+'</div><div class="chg '+(dir||'')+'">'+chg+'</div></div>';}
function row0(a,b,c,d,cls,st,e){return '<tr><td><b>'+a+'</b></td><td>'+b+'</td><td>'+c+'</td><td>'+d+'</td><td>'+(cls&&st&&e?'<span class="tag '+cls+'">'+st+'</span></td><td>'+e:e)+'</td></tr>';}
function row1(a,b,c,d,e,cls,st){return '<tr><td>'+a+'</td><td>'+b+'</td><td>'+c+'</td><td><b>'+d+'</b></td><td>'+e+'</td><td><span class="tag '+cls+'">'+st+'</span></td></tr>';}
function row2(a,b,c,d,e,f,cls,st){return '<tr><td><b>'+a+'</b></td><td>'+b+'</td><td>'+c+'</td><td>'+d+'</td><td>'+e+'</td><td>'+f+'</td><td><span class="tag '+cls+'">'+st+'</span></td></tr>';}
function row3(a,b,c,cls,st){return '<tr><td><b>'+a+'</b></td><td>'+b+'</td><td>'+c+'</td><td><span class="tag '+cls+'">'+st+'</span></td></tr>';}

function step(sn,st,sm,cls){return '<div class="step '+(cls||'')+'"><div class="sn">'+sn+'</div><div class="st">'+st+'</div><div class="sm">'+sm+'</div></div>';}
function tlr(tm,tt,ts,cls){return '<div class="tlrow '+(cls||'')+'"><span class="d"></span><div class="tm">'+tm+'</div><div class="tt">'+tt+'</div><div class="ts">'+ts+'</div></div>';}
