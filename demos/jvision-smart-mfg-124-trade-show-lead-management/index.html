<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>展會/名單管理 Trade Show & Lead Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#0d9488; --accent2:#2dd4bf;
  --bg:#0b1220; --panel:#121b2e; --panel2:#0f1830; --card:#16233d;
  --line:#243350; --txt:#e6edf6; --muted:#93a4c2; --dim:#647394;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;-webkit-font-smoothing:antialiased}
.msym{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#0a1424,#0d1b30);border-bottom:1px solid var(--line);box-shadow:0 2px 18px rgba(0,0,0,.35)}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04211d;font-size:22px;flex:0 0 auto}
.brand .btxt b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.brand .btxt span{font-size:11px;color:var(--dim)}
.livebar{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.livebar .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.nav{background:var(--panel2);border-bottom:1px solid var(--line)}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap}
.nav button{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.nav button .msym{font-size:20px}
.nav button:hover{background:#182642;color:var(--txt)}
.nav button.on{background:linear-gradient(135deg,rgba(13,148,136,.28),rgba(45,212,191,.14));color:#5eead4;border-color:rgba(45,212,191,.4)}

.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.scr-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.scr-head .ico{width:44px;height:44px;border-radius:11px;background:rgba(13,148,136,.16);border:1px solid rgba(45,212,191,.28);display:flex;align-items:center;justify-content:center;color:var(--accent2);font-size:24px;flex:0 0 auto}
.scr-head h2{font-size:19px;font-weight:800}
.scr-head p{font-size:13px;color:var(--muted);margin-top:2px}
.scr-head .tag{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);padding:5px 11px;border-radius:20px;white-space:nowrap}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split-2-1{grid-template-columns:2fr 1fr}
.split-1-2{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g2,.g3,.g4,.split-2-1,.split-1-2{grid-template-columns:1fr}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h .msym{font-size:19px;color:var(--accent2)}
.card-h b{font-size:14px;font-weight:700}
.card-h .sub{font-size:11px;color:var(--dim);margin-left:auto}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.16),transparent 70%)}
.kpi .k-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.kpi .k-top .msym{font-size:18px;color:var(--accent2)}
.kpi .k-val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .k-sub{font-size:11px;margin-top:4px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}

.chart-box{width:100%;overflow:hidden}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
tbody tr:hover{background:rgba(45,212,191,.05)}
td.num{font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent}
.p-a{background:rgba(52,211,153,.14);color:var(--good);border-color:rgba(52,211,153,.3)}
.p-b{background:rgba(96,165,250,.14);color:var(--info);border-color:rgba(96,165,250,.3)}
.p-c{background:rgba(147,164,194,.12);color:var(--muted);border-color:rgba(147,164,194,.25)}
.p-warn{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.3)}
.p-bad{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.3)}

.bar-mini{height:7px;border-radius:5px;background:#1e2c48;overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:4px 6px 10px}
.col-h .cnt{background:#1e2c48;color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px}
.tk{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px;margin-bottom:9px}
.tk b{font-size:13px;display:block}
.tk .m{font-size:11px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk .m .msym{font-size:14px}

.feed{position:relative;padding-left:6px}
.feed .it{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line)}
.feed .it:last-child{border-left-color:transparent;padding-bottom:0}
.feed .it::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(45,212,191,.12)}
.feed .it .t{font-size:11px;color:var(--dim)}
.feed .it .h{font-size:13px;font-weight:600;margin-top:2px}
.feed .it .d{font-size:12px;color:var(--muted);margin-top:2px}

.stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row .l{color:var(--muted);display:flex;align-items:center;gap:7px}
.stat-row .l .msym{font-size:16px;color:var(--accent2)}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums}

.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.funnel-row .fl{width:96px;font-size:12px;color:var(--muted);flex:0 0 auto}
.funnel-row .fbar{flex:1;height:26px;background:#1a2743;border-radius:7px;overflow:hidden;position:relative}
.funnel-row .fbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding-left:9px;color:#04211d;font-size:12px;font-weight:800}
.funnel-row .fn{width:64px;text-align:right;font-size:12px;font-weight:700;flex:0 0 auto}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.notice{display:flex;gap:10px;align-items:flex-start;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:11px;padding:12px;font-size:12.5px;color:#fde68a}
.notice .msym{color:var(--warn);font-size:20px;flex:0 0 auto}

.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mini-cal .dow{text-align:center;font-size:10px;color:var(--dim);padding:3px 0}
.mini-cal .cell{aspect-ratio:1;border-radius:7px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;position:relative;color:var(--muted)}
.mini-cal .cell.evt{background:linear-gradient(135deg,rgba(13,148,136,.35),rgba(45,212,191,.18));border-color:rgba(45,212,191,.5);color:#5eead4;font-weight:700}
.mini-cal .cell .ev{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent2)}

.avat{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04211d;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto}

.gauge-wrap{display:flex;align-items:center;justify-content:center}
.scanline{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:8px}
.scanline .msym{color:var(--accent2)}

@media(max-width:560px){
  .nav button span.lbl{display:none}
  .nav button{padding:9px 11px}
  .brand .btxt span{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="msym">groups</span></div>
      <div class="btxt"><b>展會/名單管理平台</b><span>Trade Show &amp; Lead Management</span></div>
    </div>
    <div class="livebar"><span class="dot"></span>即時同步 · 2026 智慧製造展</div>
  </div>
</div>
<div class="nav">
  <div class="nav-in" id="nav"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var NAV=[
  {i:0,ic:"calendar_month",t:"展會規劃排程"},
  {i:1,ic:"fact_check",t:"現場名單掃描"},
  {i:2,ic:"insights",t:"潛客評分分類"},
  {i:3,ic:"account_tree",t:"名單分派跟進"},
  {i:4,ic:"trending_up",t:"轉化成效追蹤"},
  {i:5,ic:"monitoring",t:"展會投報表"}
];
(function(){
  var navEl=document.getElementById("nav"),h="";
  for(var k=0;k<NAV.length;k++){
    h+='<button data-i="'+NAV[k].i+'"><span class="msym">'+NAV[k].ic+'</span><span class="lbl">'+NAV[k].t+'</span></button>';
  }
  navEl.innerHTML=h;
  navEl.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();CHARTS.push(c);}
var AXIS={labels:{style:{colors:"#93a4c2",fontFamily:"Inter"}}};
var BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},foreColor:"#93a4c2",fontFamily:"Inter"}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function head(ic,t,p,tag){return '<div class="scr-head"><div class="ico"><span class="msym">'+ic+'</span></div><div style="min-width:0"><h2>'+t+'</h2><p>'+p+'</p></div><div class="tag">'+tag+'</div></div>';}
function kpi(ic,label,val,sub,cls,delta){
  var d = delta? '<span class="'+cls+'" style="font-weight:700"> '+delta+'</span>':'';
  return '<div class="kpi"><div class="k-top"><span class="msym">'+ic+'</span>'+esc(label)+'</div><div class="k-val">'+val+'</div><div class="k-sub '+cls+'">'+sub+d+'</div></div>';
}
function merge(o){
  var out={};
  out.chart=Object.assign({},BASE.chart,o.chart||{});
  for(var k in o){if(k!=="chart")out[k]=o[k];}
  if(!out.tooltip)out.tooltip={theme:"dark"};else if(!out.tooltip.theme)out.tooltip.theme="dark";
  if(!out.grid)out.grid={borderColor:"#243350"};
  return out;
}

/* ============ SCREEN 0 : 展會規劃排程 ============ */
function s0(){
  var events=[
    {d:"04/18-04/20",n:"台北國際工具機展 TIMTOS",loc:"南港展覽館",booth:"K618",budget:"NT$ 2.4M",target:420,team:6,st:"籌備中",sp:"p-warn"},
    {d:"05/09-05/11",n:"台中自動化工業展",loc:"台中國際會展",booth:"C204",budget:"NT$ 1.1M",target:260,team:4,st:"已排定",sp:"p-b"},
    {d:"06/21-06/24",n:"上海機器人展 CIROS",loc:"上海新國際博覽",booth:"E1-88",budget:"NT$ 3.6M",target:560,team:8,st:"評估中",sp:"p-c"},
    {d:"03/12-03/14",n:"高雄智慧製造論壇",loc:"高雄展覽館",booth:"A102",budget:"NT$ 0.6M",target:150,team:3,st:"已結束",sp:"p-a"}
  ];
  var budgetRows=[
    {c:"攤位租金與搭建",b:38},{c:"人力差旅",b:22},{c:"文宣與樣品",b:16},{c:"廣告推廣",b:14},{c:"招待與餐飲",b:10}
  ];
  var er="";
  for(var i=0;i<events.length;i++){var e=events[i];
    er+='<tr><td><b>'+esc(e.n)+'</b><div style="font-size:11px;color:var(--dim)">'+esc(e.loc)+' · 攤位 '+esc(e.booth)+'</div></td>'
    +'<td class="num">'+e.d+'</td><td class="num">'+e.budget+'</td>'
    +'<td class="num">'+e.target+' 筆</td><td class="num">'+e.team+' 人</td>'
    +'<td><span class="pill '+e.sp+'">'+esc(e.st)+'</span></td></tr>';
  }
  var dow=["日","一","二","三","四","五","六"],cal="";
  for(var w=0;w<dow.length;w++)cal+='<div class="dow">'+dow[w]+'</div>';
  for(var d=0;d<21;d++){var day=15+d;var isE=(day===18||day===19||day===20);
    cal+='<div class="cell'+(isE?' evt':'')+'">'+day+(isE?'<span class="ev"></span>':'')+'</div>';
  }
  var brows="";
  for(var j=0;j<budgetRows.length;j++){var br=budgetRows[j];
    brows+='<div class="stat-row"><span class="l">'+esc(br.c)+'</span><span style="display:flex;align-items:center;gap:9px"><span class="bar-mini" style="width:90px"><i style="width:'+br.b+'%"></i></span><span class="v" style="width:34px;text-align:right">'+br.b+'%</span></span></div>';
  }
  var html=head("calendar_month","展會規劃排程","展會檔期、攤位預算與參展人力配置管理","模組 1 / 6")
  +'<div class="grid g4" style="margin-bottom:14px">'
    +kpi("event","本季展會","4","場 · 2 場籌備中","flat","")
    +kpi("payments","年度預算","7.7","<small>M</small> NT$ 已編列","up","+12%")
    +kpi("flag","名單目標","1,390","筆 累計目標","flat","")
    +kpi("groups","參展人力","21","人次 排班","up","+3")
  +'</div>'
  +'<div class="grid split-2-1" style="margin-bottom:14px">'
    +'<div class="card pad0"><div class="card-h" style="padding:14px 16px 0"><span class="msym">calendar_month</span><b>展會檔期總覽</b><span class="sub">2026 年度</span></div><div style="overflow-x:auto"><table><thead><tr><th>展會 / 地點</th><th>日期</th><th>預算</th><th>名單目標</th><th>人力</th><th>狀態</th></tr></thead><tbody>'+er+'</tbody></table></div></div>'
    +'<div class="card"><div class="card-h"><span class="msym">event_available</span><b>四月檔期</b></div><div class="mini-cal">'+cal+'</div><div class="notice" style="margin-top:12px"><span class="msym">campaign</span><div>TIMTOS 展前 <b>14 天</b>，攤位設計稿待主管簽核，樣機物流已預約。</div></div></div>'
  +'</div>'
  +'<div class="grid g2">'
    +'<div class="card"><div class="card-h"><span class="msym">donut_small</span><b>各展會預算佔比</b></div><div class="chart-box" id="c0a"></div></div>'
    +'<div class="card"><div class="card-h"><span class="msym">receipt_long</span><b>費用結構配置</b><span class="sub">TIMTOS</span></div>'+brows+'</div>'
  +'</div>';
  render(html,function(){
    mkChart("c0a",merge({series:[2.4,1.1,3.6,0.6],labels:["TIMTOS","台中自動化","上海 CIROS","高雄論壇"],
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:260},colors:["#0d9488","#2dd4bf","#60a5fa","#93a4c2"],
      legend:{position:"bottom",labels:{colors:"#93a4c2"}},stroke:{colors:["#16233d"]},
      dataLabels:{enabled:true,formatter:function(v){return v.toFixed(0)+"%";}},
      plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總預算",color:"#93a4c2",formatter:function(){return"7.7M";}}}}}}}));
  });
}

/* ============ SCREEN 1 : 現場名單掃描 ============ */
function s1(){
  var scans=[
    {t:"14:38:20",name:"陳志明",co:"鴻運精機股份有限公司",title:"廠長",ind:"金屬加工",src:"名片 OCR",dup:false,ok:true},
    {t:"14:36:05",name:"林淑芬",co:"台灣自動化科技",title:"採購經理",ind:"自動化設備",src:"QR 掃描",dup:false,ok:true},
    {t:"14:33:47",name:"王大維",co:"日精工業",title:"總經理",ind:"工具機",src:"名片 OCR",dup:true,ok:true},
    {t:"14:30:12",name:"—",co:"（欄位辨識中）",title:"—",ind:"—",src:"名片 OCR",dup:false,ok:false},
    {t:"14:27:33",name:"張家豪",co:"精湛模具",title:"研發工程師",ind:"模具射出",src:"QR 掃描",dup:false,ok:true},
    {t:"14:24:58",name:"黃美玲",co:"宏達智慧製造",title:"專案副理",ind:"系統整合",src:"名片 OCR",dup:false,ok:true}
  ];
  var rows="";
  for(var i=0;i<scans.length;i++){var s=scans[i];
    var badge = !s.ok? '<span class="pill p-warn">補件中</span>' : (s.dup? '<span class="pill p-c">已去重</span>':'<span class="pill p-a">已建檔</span>');
    rows+='<tr><td class="num">'+s.t+'</td><td><b>'+esc(s.name)+'</b></td><td>'+esc(s.co)+'</td><td>'+esc(s.title)+'</td><td><span class="pill p-b">'+esc(s.ind)+'</span></td><td>'+esc(s.src)+'</td><td>'+badge+'</td></tr>';
  }

      xaxis:{categories:["3月","4月","5月","6月","7月","8月"],labels:AXIS.labels,axisBorder:{color:"#243350"}},
      yaxis:{labels:AXIS.labels}}));
  });
}

/* ============ core ============ */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function render(html,after){
  var c=document.getElementById("screen");
  killCharts();
  c.innerHTML=html;
  void c.offsetHeight;
  if(after)after();
}
function show(i){
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
