<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>展會/名單管理 Trade Show & Lead Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#C8D6F0;
  --accent:#2563EB;
  --accent2:#059669;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --panel2:#F1F5FD;
  --card:#FFFFFF;
  --txt:#0F172A;
  --dim:#52647B;
  --good:#047857;
  --warn:#A54B08;
  --bad:#B91C1C;
  --info:#1D4ED8;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{max-width:100%;overflow-x:hidden;background:var(--color-background);scroll-behavior:auto}
body{max-width:100%;overflow-x:hidden;font-family:"Fira Sans",sans-serif;background-color:var(--color-background);background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);background-size:32px 32px;color:var(--color-foreground);line-height:1.55;-webkit-font-smoothing:antialiased}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
.msym{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}

.topbar{position:sticky;top:0;z-index:50;background:var(--color-primary);color:var(--color-on-primary);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:44px;height:44px;border:2px solid var(--color-on-primary);border-radius:0;background:var(--color-accent);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:25px;flex:0 0 auto}
.brand .btxt b{display:block;max-width:54vw;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand .btxt span{display:block;color:#DBEAFE;font-family:"Fira Code",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.livebar{margin-left:auto;display:flex;align-items:center;gap:8px;border:2px solid #FFFFFF;background:#0F172A;padding:6px 9px;color:#FFFFFF;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;white-space:nowrap}
.livebar .dot{width:9px;height:9px;border:2px solid #FFFFFF;border-radius:0;background:#10B981}
.nav{position:relative;z-index:40;background:var(--color-card);border-bottom:3px solid var(--ink)}
.nav-in{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:thin}
.nav button{display:flex;min-height:54px;align-items:center;gap:8px;background:var(--color-card);border:0;border-right:1px solid var(--line);border-radius:0;color:var(--color-muted-foreground);padding:10px 15px;font:700 12px "Fira Sans",sans-serif;white-space:nowrap;transition:background-color .18s ease,color .18s ease}
.nav button:first-child{border-left:1px solid var(--line)}
.nav button .msym{font-size:20px}
.nav button:hover{background:#DBEAFE;color:var(--ink)}
.nav button.on{background:var(--color-accent);color:#FFFFFF;border-color:var(--ink);box-shadow:inset 0 -5px 0 var(--ink)}

.wrap{max-width:1440px;margin:0 auto;padding:30px 20px 72px}
#screen{animation:screen-in .4s cubic-bezier(.2,.8,.2,1) both}
.scr-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;gap:0;margin:0 0 22px;border:3px solid var(--ink);background:var(--color-card)}
.scr-head .ico{width:68px;min-height:68px;border-right:3px solid var(--ink);border-radius:0;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:30px}
.scr-head>div:nth-child(2){padding:10px 16px!important;align-self:center}
.scr-head h2{font-size:clamp(20px,2.3vw,30px);font-weight:800;line-height:1.1;letter-spacing:-.04em}
.scr-head p{margin-top:5px;color:var(--color-muted-foreground);font-size:13px}
.scr-head .tag{align-self:stretch;margin-left:0;border:0;border-left:3px solid var(--ink);border-radius:0;background:var(--color-muted);padding:0 15px;display:flex;align-items:center;color:var(--ink);font-family:"Fira Code",monospace;font-size:11px;font-weight:700;white-space:nowrap}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split-2-1{grid-template-columns:2fr 1fr}
.split-1-2{grid-template-columns:1fr 2fr}
.card,.kpi,.col,.tk{border-radius:0}
.card{min-width:0;border:2px solid var(--ink);background:var(--color-card);padding:18px;color:var(--color-card-foreground)}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;min-height:30px;align-items:center;gap:9px;margin-bottom:14px}
.card-h .msym{color:var(--color-primary);font-size:21px}
.card-h b{font-size:14px;font-weight:800;letter-spacing:-.01em}
.card-h .sub{margin-left:auto;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px;font-weight:500;text-align:right}

.kpi{position:relative;overflow:hidden;border:2px solid var(--ink);background:var(--color-card);padding:16px}
.kpi::before{content:"";position:absolute;left:0;top:0;width:8px;height:100%;background:var(--color-primary)}
.kpi:nth-child(2n)::before{background:var(--color-accent)}
.kpi::after{content:none}
.kpi .k-top{display:flex;align-items:center;gap:8px;padding-left:4px;color:var(--color-muted-foreground);font-size:12px;font-weight:700}
.kpi .k-top .msym{color:var(--color-primary);font-size:19px}
.kpi .k-val{margin-top:10px;padding-left:4px;color:var(--ink);font-family:"Fira Code",monospace;font-size:clamp(25px,3vw,34px);font-weight:700;letter-spacing:-.07em;line-height:1}
.kpi .k-val small{margin-left:4px;color:var(--color-muted-foreground);font:600 12px "Fira Sans",sans-serif;letter-spacing:0}
.kpi .k-sub{margin-top:8px;padding-left:4px;font-size:11px;font-weight:600}
.up{color:var(--good)}
.down{color:var(--bad)}
.flat{color:var(--color-muted-foreground)}
.chart-box{width:100%;overflow:hidden}

.card.pad0 .card-h{margin-bottom:12px!important;border-bottom:2px solid var(--ink);background:var(--color-muted);padding:12px 14px!important}
table{width:100%;border-collapse:collapse;background:var(--color-card);font-size:12.5px}
th,td{padding:11px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{background:var(--ink);color:#FFFFFF;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tbody tr:nth-child(even){background:var(--color-muted)}
tbody tr:hover{background:#DBEAFE}
td.num{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;text-align:right}
td b{font-weight:700}

.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:0;padding:3px 7px;font-size:10px;font-weight:800;line-height:1.35;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border:1px solid currentColor;background:currentColor}
.p-a{background:#ECFDF5;color:#047857}
.p-b{background:#EFF6FF;color:#1D4ED8}
.p-c{background:#F1F5F9;color:#475569}
.p-warn{background:#FFF7ED;color:#9A3412}
.p-bad{background:#FEF2F2;color:#B91C1C}

.bar-mini{height:9px;min-width:60px;overflow:hidden;border:1px solid var(--ink);border-radius:0;background:#E2E8F0}
.bar-mini i{display:block;height:100%;border-radius:0;background:var(--color-accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{min-width:0;border:2px solid var(--ink);background:var(--color-muted);padding:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding:2px 2px 10px;color:var(--color-muted-foreground);font-size:12px;font-weight:800}
.col-h .cnt{border:1px solid var(--ink);border-radius:0;background:var(--ink);padding:1px 7px;color:#FFFFFF;font:600 10px "Fira Code",monospace}
.tk{margin:10px 0 0;border:1px solid var(--ink);border-left:7px solid var(--color-primary);background:var(--color-card);padding:11px}
.tk b{display:block;font-size:13px}
.tk .m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;color:var(--color-muted-foreground);font-size:11px}
.tk .m .msym{font-size:14px}

.feed{position:relative;padding-left:4px}
.feed .it{position:relative;border-left:3px solid var(--ink);padding:0 0 18px 22px}
.feed .it:last-child{border-left-color:transparent;padding-bottom:0}
.feed .it::before{content:"";position:absolute;left:-8px;top:2px;width:13px;height:13px;border:2px solid var(--ink);border-radius:0;background:var(--color-accent)}
.feed .it .t{color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px}
.feed .it .h{margin-top:3px;font-size:13px;font-weight:800}
.feed .it .d{margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.stat-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px dashed #94A3B8;padding:10px 0;font-size:13px}
.stat-row:last-child{border-bottom:0}
.stat-row .l{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground)}
.stat-row .l .msym{color:var(--color-primary);font-size:17px}
.stat-row .v{font-family:"Fira Code",monospace;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.funnel-row .fl{width:96px;flex:0 0 auto;color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.funnel-row .fbar{position:relative;flex:1;height:28px;overflow:hidden;border:1px solid var(--ink);border-radius:0;background:#E2E8F0}
.funnel-row .fbar i{display:flex;height:100%;align-items:center;border-radius:0;background:var(--color-primary);padding-left:8px;color:#FFFFFF;font:700 11px "Fira Code",monospace;white-space:nowrap}
.funnel-row .fn{width:70px;flex:0 0 auto;font:700 12px "Fira Code",monospace;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--color-muted-foreground);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:13px;height:13px;border:1px solid var(--ink);border-radius:0}
.notice{display:flex;align-items:flex-start;gap:10px;border:2px solid #9A3412;border-radius:0;background:#FFF7ED;padding:12px;color:#7C2D12;font-size:12.5px}
.notice .msym{flex:0 0 auto;color:#9A3412;font-size:21px}

.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.mini-cal .dow{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--ink);padding:5px 0;color:#FFFFFF;font:600 10px "Fira Code",monospace;text-align:center}
.mini-cal .cell{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);border-radius:0;background:var(--color-card);color:var(--color-muted-foreground);font:500 11px "Fira Code",monospace}
.mini-cal .cell.evt{background:var(--color-primary);color:#FFFFFF;font-weight:700}
.mini-cal .cell .ev{position:absolute;right:3px;top:3px;width:6px;height:6px;border:1px solid #FFFFFF;border-radius:0;background:var(--color-accent)}
.avat{width:27px;height:27px;display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:0;background:var(--color-accent);color:#FFFFFF;font:800 11px "Fira Code",monospace}
.gauge-wrap{display:flex;align-items:center;justify-content:center}
.scanline{display:flex;align-items:center;gap:8px;margin-bottom:9px;border:1px solid var(--ink);border-left:7px solid var(--color-accent);border-radius:0;background:#ECFDF5;padding:9px 10px;color:#065F46;font-size:12px}
.scanline .msym{color:#047857}

.apexcharts-canvas text{font-family:"Fira Code",monospace!important}
.apexcharts-gridline{stroke:#C8D6F0}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:2px solid var(--ink)!important;border-radius:0!important;background:var(--ink)!important;color:#FFFFFF!important;box-shadow:none!important}
.apexcharts-tooltip-title{border-bottom:1px solid #64748B!important;background:var(--ink)!important}

@keyframes screen-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split-2-1,.split-1-2{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr)}
  .wrap{padding-top:22px}
}
@media(max-width:768px){
  .g2,.g3,.split-2-1,.split-1-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,minmax(170px,1fr))}
  .nav-in{padding:0 12px}
  .wrap{padding:18px 12px 52px}
  .topbar-in{padding:10px 12px}
  .scr-head{grid-template-columns:auto minmax(0,1fr)}
  .scr-head .tag{grid-column:1/-1;min-height:34px;border-top:3px solid var(--ink);border-left:0}
}
@media(max-width:560px){
  .topbar-in{gap:8px}
  .brand .btxt span{display:none}
  .brand .btxt b{max-width:68vw;font-size:14px}
  .brand .logo{width:38px;height:38px}
  .livebar{width:100%;margin-left:0;justify-content:center;font-size:10px}
  .nav button{min-width:52px;justify-content:center;padding:10px 14px}
  .nav button span.lbl{display:none}
  .g4{grid-template-columns:1fr}
  .card{padding:14px}
  .scr-head .ico{width:54px;min-height:62px}
  .scr-head>div:nth-child(2){padding:9px 11px!important}
  .scr-head h2{font-size:19px}
  .scr-head p{font-size:11px}
  .funnel-row{gap:6px}
  .funnel-row .fl{width:72px;font-size:11px}
  .funnel-row .fn{width:54px;font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  #screen{animation:none!important}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="msym">groups</span></div>
      <div class="btxt"><b>展會/名單管理平台</b><span>Trade Show &amp; Lead Management</span></div>
    </div>
    <div class="livebar"><span class="dot"></span>即時同步 · 2026 智慧製造展</div>
  </div>
</div>
<div class="nav">
  <div class="nav-in" id="nav"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var NAV=[
  {i:0,ic:"calendar_month",t:"展會規劃排程"},
  {i:1,ic:"fact_check",t:"現場名單掃描"},
  {i:2,ic:"insights",t:"潛客評分分類"},
  {i:3,ic:"account_tree",t:"名單分派跟進"},
  {i:4,ic:"trending_up",t:"轉化成效追蹤"},
  {i:5,ic:"monitoring",t:"展會投報表"}
];
(function(){
  var navEl=document.getElementById("nav"),h="";
  for(var k=0;k<NAV.length;k++){
    h+='<button data-i="'+NAV[k].i+'"><span class="msym">'+NAV[k].ic+'</span><span class="lbl">'+NAV[k].t+'</span></button>';
  }
  navEl.innerHTML=h;
  navEl.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();CHARTS.push(c);}
var AXIS={labels:{style:{colors:"#93a4c2",fontFamily:"Inter"}}};
var BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},foreColor:"#93a4c2",fontFamily:"Inter"}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function head(ic,t,p,tag){return '<div class="scr-head"><div class="ico"><span class="msym">'+ic+'</span></div><div style="min-width:0"><h2>'+t+'</h2><p>'+p+'</p></div><div class="tag">'+tag+'</div></div>';}
function kpi(ic,label,val,sub,cls,delta){
  var d = delta? '<span class="'+cls+'" style="font-weight:700"> '+delta+'</span>':'';
  return '<div class="kpi"><div class="k-top"><span class="msym">'+ic+'</span>'+esc(label)+'</div><div class="k-val">'+val+'</div><div class="k-sub '+cls+'">'+sub+d+'</div></div>';
}
function merge(o){
  var out={};
  out.chart=Object.assign({},BASE.chart,o.chart||{});
  for(var k in o){if(k!=="chart")out[k]=o[k];}
  if(!out.tooltip)out.tooltip={theme:"dark"};else if(!out.tooltip.theme)out.tooltip.theme="dark";
  if(!out.grid)out.grid={borderColor:"#243350"};
  return out;
}

/* ============ SCREEN 0 : 展會規劃排程 ============ */
function s0(){
  var events=[
    {d:"04/18-04/20",n:"台北國際工具機展 TIMTOS",loc:"南港展覽館",booth:"K618",budget:"NT$ 2.4M",target:420,team:6,st:"籌備中",sp:"p-warn"},
    {d:"05/09-05/11",n:"台中自動化工業展",loc:"台中國際會展",booth:"C204",budget:"NT$ 1.1M",target:260,team:4,st:"已排定",sp:"p-b"},
    {d:"06/21-06/24",n:"上海機器人展 CIROS",loc:"上海新國際博覽",booth:"E1-88",budget:"NT$ 3.6M",target:560,team:8,st:"評估中",sp:"p-c"},
    {d:"03/12-03/14",n:"高雄智慧製造論壇",loc:"高雄展覽館",booth:"A102",budget:"NT$ 0.6M",target:150,team:3,st:"已結束",sp:"p-a"}
  ];
  var budgetRows=[
    {c:"攤位租金與搭建",b:38},{c:"人力差旅",b:22},{c:"文宣與樣品",b:16},{c:"廣告推廣",b:14},{c:"招待與餐飲",b:10}
  ];
  var er="";
  for(var i=0;i<events.length;i++){var e=events[i];
    er+='<tr><td><b>'+esc(e.n)+'</b><div style="font-size:11px;color:var(--dim)">'+esc(e.loc)+' · 攤位 '+esc(e.booth)+'</div></td>'
    +'<td class="num">'+e.d+'</td><td class="num">'+e.budget+'</td>'
    +'<td class="num">'+e.target+' 筆</td><td class="num">'+e.team+' 人</td>'
    +'<td><span class="pill '+e.sp+'">'+esc(e.st)+'</span></td></tr>';
  }
  var dow=["日","一","二","三","四","五","六"],cal="";
  for(var w=0;w<dow.length;w++)cal+='<div class="dow">'+dow[w]+'</div>';
  for(var d=0;d<21;d++){var day=15+d;var isE=(day===18||day===19||day===20);
    cal+='<div class="cell'+(isE?' evt':'')+'">'+day+(isE?'<span class="ev"></span>':'')+'</div>';
  }

/* ============ core ============ */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function render(html,after){
  var c=document.getElementById("screen");
  killCharts();
  c.innerHTML=html;
  void c.offsetHeight;
  if(after)after();
}
function show(i){
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
