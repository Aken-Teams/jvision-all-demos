<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>美業預約回訪所 · Beauty Booking &amp; CRM</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#ec4899;--accent2:#f472b6;--ink:#3a2733;--bg:#fdf2f8;--card:#fff;--line:#f4d9e8;--mut:#9a7887;--ok:#10b981;--warn:#f59e0b;--bad:#e11d48;--soft:#fbe8f2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(236,72,153,.4)}
.side .lg .material-symbols-outlined{font-size:24px}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:10px;color:var(--accent);letter-spacing:1.3px}
.side .nav{display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#7a5c69;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#d69bbb}
.side button:hover{background:var(--soft)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.6}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:var(--soft);color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent2);opacity:.4}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:var(--soft);color:var(--accent)}
.t-pk{background:#fce7f3;color:#be185d}.t-pp{background:#ede9fe;color:#7c3aed}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--soft)}
table.data tr:last-child td{border-bottom:0}
.chart{height:250px}
.scroll{overflow-x:auto}
/* calendar */
.cal{border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:640px}
.cal .row{display:grid;grid-template-columns:78px repeat(5,1fr);border-bottom:1px solid var(--line)}
.cal .row:last-child{border-bottom:0}
.cal .hd{background:var(--soft);font-weight:800;font-size:12px;font-family:"Noto Sans TC";color:var(--accent)}
.cal .cell{border-left:1px solid var(--line);padding:5px;min-height:52px;position:relative}
.cal .cell:first-child{border-left:0}
.cal .tm{display:grid;place-items:center;font-size:11px;color:var(--mut);font-weight:700;border-left:0}
.blk{border-radius:9px;padding:6px 8px;font-size:11px;color:#fff;font-weight:600;line-height:1.35;box-shadow:0 3px 8px rgba(0,0,0,.08);height:100%}
.blk b{font-size:11.5px;font-family:"Noto Sans TC"}
.blk small{opacity:.9;font-size:10px;display:block}
.b-cut{background:linear-gradient(135deg,#ec4899,#f472b6)}
.b-color{background:linear-gradient(135deg,#a855f7,#c084fc)}
.b-perm{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.b-spa{background:linear-gradient(135deg,#14b8a6,#2dd4bf)}
.b-nail{background:linear-gradient(135deg,#f43f5e,#fb7185)}
.empty{color:#e6c4d7;font-size:11px;display:grid;place-items:center;height:100%;border:1px dashed #f2d6e5;border-radius:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* retention list */
.rlist{display:flex;flex-direction:column;gap:10px}
.rl{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px}
.rl.due{border-left-color:var(--bad)}.rl.low{border-left-color:var(--warn)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-family:"Noto Sans TC";flex:none}
.rl.due .av{background:linear-gradient(135deg,#e11d48,#fb7185)}.rl.low .av{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.rl .mid{flex:1;min-width:0}
.rl .mid b{font-size:13px;font-family:"Noto Sans TC"}
.rl .mid small{color:var(--mut);font-size:11.5px;display:block;margin-top:1px}
.rl .rt{text-align:right;flex:none}
.rl .rt b{font-family:Inter;font-size:13px;color:var(--accent)}
.rl .rt small{display:block;font-size:10px;color:var(--mut)}
.stars{color:#f59e0b;font-size:12px;letter-spacing:1px}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--soft);color:var(--accent);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
/* member cards */
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mcards>*{min-width:0}
.mc{border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:120px}
.mc.g{background:linear-gradient(135deg,#ec4899,#a855f7)}
.mc.s{background:linear-gradient(135deg,#f472b6,#f9a8d4)}
.mc.b{background:linear-gradient(135deg,#fb7185,#f59e0b)}
.mc .lvl{font-size:11px;font-weight:800;letter-spacing:1px;opacity:.9}
.mc .nm{font-size:16px;font-weight:800;font-family:"Noto Sans TC";margin-top:4px}
.mc .bal{font-size:24px;font-weight:800;font-family:Inter;margin-top:10px}
.mc .bal small{font-size:12px;font-weight:600;opacity:.85}
.mc .ico{position:absolute;right:14px;bottom:10px;opacity:.25;font-size:52px}
.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 14px 12px}
.ti:last-child{padding-bottom:0}
.ti:before{content:"";position:absolute;left:-16px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--soft)}
.ti b{font-size:13px;font-family:"Noto Sans TC"}
.ti small{color:var(--mut);font-size:11.5px;display:block}
.ti .tm{font-size:11px;color:var(--accent);font-weight:700}
.hamb{display:none}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible;align-items:center}
 .side .bd{width:100%;padding-bottom:8px}
 .side .nav{flex-direction:row;flex-wrap:wrap;width:100%}
 .side button{width:auto;flex:none;white-space:nowrap}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.g21{grid-template-columns:1fr}
 .mcards{grid-template-columns:1fr}
}
@media(max-width:560px){
 .side button .txt{display:none}
 .side button{padding:9px 11px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg"><span class="material-symbols-outlined">spa</span></div><div><b>美業預約回訪所</b><span>BEAUTY BOOKING CRM</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="foot">綻美空間 · 松江旗艦店<br/>設計師 5 · 本月會員 862<br/>今日預約 28 · 儲值卡 340</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">營運總覽</h2><p id="vd"></p></div><div class="live"><i></i>即時同步中</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["營運總覽","dashboard","今日預約、到店與業績即時戰情"],
["預約排班","calendar_month","設計師 × 時段預約日曆與衝突提醒"],
["顧客回訪","campaign","回訪名單、週期提醒與低評分跟催"],
["療程紀錄","spa","顧客服務歷程、用料與滿意度紀錄"],
["會員儲值","card_membership","儲值卡餘額、方案購買與扣款明細"],
["營運報表","query_stats","營收、設計師產值與客源結構分析"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span class="txt">'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

/* ---- data ---- */
const TODO=[
["11:30","陳O華 · 設計燙","逾時未報到 5 分","due"],
["13:00","林O婷 · 首次染髮","VIP 需提前備色","low"],
["15:30","王O安 · 頭皮 SPA","儲值餘額不足 · 建議加值","low"],
["18:00","張O綺 · 剪髮+護","線上預約待確認","low"]];
/* calendar: designers x time slots */
const DS=["Amy 設計師","Bella 設計師","Cindy 設計師","David 設計師","Eva 設計師"];
const SLOTS=[
["10:00",[["剪髮","陳O華","cut"],["染髮","黃O琳","color"],null,["燙髮","周O妤","perm"],["美甲","蔡O恩","nail"]]],
["11:30",[["設計燙","許O倫","perm"],["剪髮","趙O廷","cut"],["頭皮SPA","郭O瑄","spa"],null,["光療","何O潔","nail"]]],
["13:00",[null,["首染","林O婷","color"],["剪護","楊O睿","cut"],["接髮","吳O菱","color"],["美甲","鄭O妍","nail"]]],
["15:30",[["護髮","蘇O偉","spa"],null,["漂染","馮O青","color"],["頭皮SPA","王O安","spa"],["剪髮","呂O均","cut"]]],
["18:00",[["剪+護","張O綺","cut"],["補染","孫O豪","color"],null,["燙髮","江O蓉","perm"],["卸甲","高O琪","nail"]]]];
const BC={cut:"b-cut",color:"b-color",perm:"b-perm",spa:"b-spa",nail:"b-nail"};
const BN={cut:"剪髮",color:"染髮",perm:"燙髮",spa:"頭皮SPA",nail:"美甲"};
/* retention */
const RET=[
["陳O華","CH","設計燙 · 上次 68 天前","建議染護回訪 · 已超週期","due","",""],
["林O琪","LC","染髮 · 上次 52 天前","補色最佳時機 · 本週提醒","due","",""],
["王O安","WA","頭皮SPA · 服務後 3.2 分","低評分待關懷 · 主管跟催","low","★★★☆☆",""],
["蔡O恩","TE","美甲 · 上次 41 天前","光療約 4 週回填","","",""],
["黃O琳","HL","剪髮 · 上次 35 天前","週期未到 · 觀察","","",""],
["周O妤","CY","燙髮 · 服務後 4.0 分","可推薦護髮方案","low","★★★★☆",""]];
/* treatment records */
const TRE=[
["#TR-20871","陳O華","設計燙 + 結構護","Amy","染膏 6/0 · 燙劑 A2","4.8","已扣次"],
["#TR-20870","林O婷","首次染髮","Bella","染膏 8/43 · 護色","4.9","儲值扣款"],
["#TR-20869","王O安","頭皮深層SPA","David","舒緩精油 · 導入","3.2","現金"],
["#TR-20868","蔡O恩","法式光療美甲","Eva","單色膠 · 貼鑽","5.0","方案次數"],
["#TR-20867","周O妤","冷塑燙 + 護髮","Amy","燙劑 B1 · 修護膜","4.6","儲值扣款"]];
/* member cards */
const MEM=[
["g","GOLD 尊榮","陳O華","12,400","累積 48,600 · 回饋 3%","diamond"],
["s","SILVER 星耀","林O婷","6,850","累積 22,300 · 回饋 2%","auto_awesome"],
["b","BRONZE 悅享","王O安","980","累積 8,900 · 建議加值","favorite"]];
const TXN=[
["今日 13:20","林O婷 首次染髮扣款","-2,800","儲值扣款"],
["今日 11:05","陳O華 加值儲值金","+10,000","儲值加值"],
["今日 10:40","周O妤 燙髮方案扣次","-1 次","方案扣次"],
["昨日 19:10","蔡O恩 光療美甲","-1,200","儲值扣款"],
["昨日 16:30","新會員 郭O瑄 開卡","+5,000","開卡儲值"]];

/* ---- screens ---- */
const SCREENS=[
/* 0 dashboard */
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">event_available</span><div class="l">今日預約</div><div class="v">28</div><div class="d up">▲ 到店 21 · 待確認 4</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">payments</span><div class="l">今日營收</div><div class="v">86.4<small style="font-size:12px"> K</small></div><div class="d up">▲ 較昨 +12%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">campaign</span><div class="l">待回訪</div><div class="v" style="color:var(--bad)">17</div><div class="d" style="color:var(--mut)">2 超週期 · 1 低評分</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">card_membership</span><div class="l">儲值卡餘額</div><div class="v">1.28<small style="font-size:12px"> M</small></div><div class="d up">▲ 本月加值 +214K</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>今日待辦提醒 <span class="tag t-bad" style="margin-left:auto">需處理 4</span></h3><div class="rlist">${TODO.map(t=>`<div class="rl ${t[3]}"><div class="av">${t[0].slice(0,2)}</div><div class="mid"><b>${t[1]}</b><small>${t[0]} · ${t[2]}</small></div><div class="rt"><span class="tag ${t[3]=='due'?'t-bad':'t-warn'}">${t[3]=='due'?'待處理':'提醒'}</span></div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">insights</span>本日時段人流</h3><div class="chart" id="c_flow" style="height:220px"></div><div class="pill" style="margin-top:8px"><span class="chip">尖峰 15:00-18:00</span><span class="chip">空檔 11:00</span></div></div>
</div>`,

/* 1 calendar (signature) */
()=>`<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>2026/08/13（四）設計師預約日曆 <span class="tag t-info" style="margin-left:auto">松江旗艦店</span></h3>
<div class="scroll"><div class="cal">
 <div class="row"><div class="cell tm hd">時段</div>${DS.map(d=>`<div class="cell hd" style="display:flex;align-items:center;justify-content:center;text-align:center">${d}</div>`).join('')}</div>
 ${SLOTS.map(s=>`<div class="row"><div class="cell tm">${s[0]}</div>${s[1].map(b=>b?`<div class="cell"><div class="blk ${BC[b[2]]}"><b>${b[0]}</b><small>${b[1]}</small></div></div>`:`<div class="cell"><div class="empty">＋ 可預約</div></div>`).join('')}</div>`).join('')}
</div></div>
<div class="legend">${Object.keys(BN).map(k=>`<span><i class="${BC[k]}" style="background:${k=='cut'?'#ec4899':k=='color'?'#a855f7':k=='perm'?'#f59e0b':k=='spa'?'#14b8a6':'#f43f5e'}"></i>${BN[k]}</span>`).join('')}<span style="margin-left:auto;color:var(--bad);font-weight:700"><span class="material-symbols-outlined" style="font-size:16px">error</span>Cindy 13:00 與 15:30 間隔不足，已提醒</span></div>
</div>`,

/* 2 retention (signature) */
()=>`<div class="grid g21">
 <div class="card"><h3><span class="material-symbols-outlined">campaign</span>顧客回訪提醒名單 <span class="tag t-bad" style="margin-left:auto">超週期 2 · 低評分 2</span></h3><div class="rlist">${RET.map(r=>`<div class="rl ${r[4]}"><div class="av">${r[1]}</div><div class="mid"><b>${r[0]} ${r[5]?`<span class="stars">${r[5]}</span>`:''}</b><small>${r[2]}</small></div><div class="rt"><b>${r[3].split(' · ')[0]}</b><small>${r[3].split(' · ')[1]||''}</small></div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_small</span>回訪原因分佈</h3><div class="chart" id="c_ret" style="height:210px"></div>
 <h3 style="margin-top:14px"><span class="material-symbols-outlined">forum</span>本月回訪成效</h3>
 <div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">已聯繫</b><span style="color:var(--accent);font-weight:700">142 / 178</span></div><div class="bar"><i style="width:80%"></i></div></div>
 <div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">成功回店</b><span style="color:var(--accent);font-weight:700">63 / 142</span></div><div class="bar"><i style="width:44%"></i></div></div>
 <div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">升級方案</b><span style="color:var(--accent);font-weight:700">21 / 63</span></div><div class="bar"><i style="width:33%"></i></div></div>
 </div>
</div>`,

/* 3 treatment records */
