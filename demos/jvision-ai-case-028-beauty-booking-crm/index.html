<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>美業預約回訪所 · Beauty Booking &amp; CRM</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --mut:#475569;
  --line:#A7F3D0;
  --accent:#059669;
  --accent2:#10B981;
  --bg:#ECFDF5;
  --card:#FFFFFF;
  --ok:#047857;
  --warn:#9A3412;
  --bad:#DC2626;
  --soft:#E8F1F3;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 24px rgba(6,78,59,.05);
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(5,150,105,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{color:#022C22;background:#6EE7B7}
.material-symbols-outlined{
  font-size:19px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:5px;
  height:100vh;
  padding:20px 14px 16px;
  overflow:auto;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.96);
  border-right:1px solid var(--color-border);
  box-shadow:4px 0 18px rgba(6,78,59,.035);
}
.side .bd{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:58px;
  padding:2px 8px 16px;
  margin-bottom:7px;
  border-bottom:1px solid var(--color-border);
}
.side .lg{
  display:grid;
  flex:none;
  place-items:center;
  width:40px;
  height:40px;
  color:#FFFFFF;
  background:var(--color-primary);
  border:1px solid #047857;
  border-radius:8px;
  box-shadow:4px 4px 0 #D1FAE5;
}
.side .lg .material-symbols-outlined{font-size:23px}
.side .bd b{
  display:block;
  max-width:150px;
  overflow:hidden;
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:-.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.side .bd span:not(.material-symbols-outlined){
  display:block;
  margin-top:1px;
  color:var(--color-muted-foreground);
  font-size:9px;
  font-weight:600;
  letter-spacing:.11em;
}
.side .nav{display:flex;flex-direction:column;gap:3px}
.side button{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:42px;
  padding:9px 11px;
  color:#334155;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:13px;
  font-weight:500;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.side button .material-symbols-outlined{color:#64748B;transition:color .2s ease}
.side button:hover{
  color:#064E3B;
  background:#ECFDF5;
  border-color:#A7F3D0;
  transform:translateX(2px);
}
.side button:hover .material-symbols-outlined{color:var(--color-primary)}
.side button.on{
  color:#FFFFFF;
  background:var(--color-primary);
  border-color:#047857;
  box-shadow:inset 3px 0 0 #FDE68A;
}
.side button.on .material-symbols-outlined{color:#FFFFFF}
.side .foot{
  margin-top:auto;
  padding:13px 10px 2px;
  color:var(--color-muted-foreground);
  border-top:1px solid var(--color-border);
  font-size:10.5px;
  line-height:1.75;
}
.main{width:100%;max-width:1600px;padding:24px clamp(18px,2.3vw,36px) 40px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  min-height:58px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--color-border);
}
.vh h2{
  margin:0;
  color:var(--color-foreground);
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:clamp(20px,2vw,26px);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.035em;
}
.vh p{margin:5px 0 0;color:var(--color-muted-foreground);font-size:12.5px}
.live{
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  min-height:32px;
  padding:5px 11px;
  color:#065F46;
  background:#D1FAE5;
  border:1px solid #6EE7B7;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.live i{
  display:inline-block;
  width:7px;
  height:7px;
  background:var(--color-primary);
  border:2px solid #A7F3D0;
  border-radius:50%;
  animation:pulse-status 1.8s ease-in-out infinite;
}
@keyframes pulse-status{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.75)}}
#view>*,.kpi,.card{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpis>*{min-width:0}
.kpi{
  position:relative;
  min-height:118px;
  padding:15px 16px 14px;
  overflow:hidden;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:9px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi:before{position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-primary);content:""}
.kpi:hover{border-color:#34D399;box-shadow:0 2px 4px rgba(6,78,59,.08),0 12px 28px rgba(6,78,59,.08);transform:translateY(-2px)}
.kpi .l{color:var(--color-muted-foreground);font-size:11.5px;font-weight:500;letter-spacing:.02em}
.kpi .v{
  margin-top:6px;
  color:#022C22;
  font-family:Inter,ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:26px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .d{margin-top:3px;font-size:10.5px;font-weight:600}
.kpi .ic{position:absolute;top:14px;right:14px;color:var(--color-primary);opacity:.3}
.up{color:#047857}.dn{color:var(--color-destructive)}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.card{
  min-width:0;
  padding:15px 16px 16px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:9px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.card:hover{border-color:#6EE7B7;box-shadow:0 2px 4px rgba(6,78,59,.07),0 10px 25px rgba(6,78,59,.07)}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  min-height:25px;
  margin:0 0 12px;
  color:#064E3B;
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#065F46;background:#D1FAE5}
.t-warn{color:#9A3412;background:#FFEDD5}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#065F46;background:#ECFDF5}
.t-pk{color:#9A3412;background:#FFEDD5}
.t-pp{color:#5B21B6;background:#EDE9FE}
.scroll{max-width:100%;overflow-x:auto;scrollbar-color:#6EE7B7 #ECFDF5;scrollbar-width:thin}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid #D1FAE5;text-align:left;vertical-align:middle}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  color:#334155;
  background:#E8F1F3;
  border-top:1px solid #CBD5E1;
  border-bottom-color:#CBD5E1;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.035em;
  white-space:nowrap;
}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:#F0FDFA}
table.data td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data td:nth-last-child(2),table.data th:nth-last-child(2){text-align:right;font-variant-numeric:tabular-nums}
.chart{height:250px}
.cal{min-width:680px;overflow:hidden;background:#FFFFFF;border:1px solid var(--color-border);border-radius:7px}
.cal .row{display:grid;grid-template-columns:76px repeat(5,minmax(108px,1fr));border-bottom:1px solid var(--color-border)}
.cal .row:last-child{border-bottom:0}
.cal .hd{color:#065F46;background:#D1FAE5;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600}
.cal .cell{position:relative;min-height:54px;padding:5px;border-left:1px solid var(--color-border)}
.cal .cell:first-child{border-left:0}
.cal .tm{display:grid;place-items:center;color:var(--color-muted-foreground);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.blk{
  height:100%;
  min-height:43px;
  padding:6px 8px;
  color:#FFFFFF;
  border:1px solid rgba(0,0,0,.18);
  border-radius:5px;
  box-shadow:2px 2px 0 rgba(6,78,59,.12);
  font-size:10.5px;
  font-weight:500;
  line-height:1.35;
}
.blk b{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600}
.blk small{display:block;font-size:9.5px;opacity:.95}
.b-cut{background:#047857}.b-color{background:#6D28D9}.b-perm{background:#B45309}.b-spa{background:#0F766E}.b-nail{background:#BE123C}
.empty{display:grid;place-items:center;height:100%;min-height:43px;color:#475569;background:#F8FAFC;border:1px dashed #94A3B8;border-radius:5px;font-size:10px}
.legend{display:flex;gap:13px;flex-wrap:wrap;align-items:center;margin-top:11px;color:var(--color-muted-foreground);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid rgba(0,0,0,.2);border-radius:2px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rl{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:60px;
  padding:9px 11px;
  background:#FFFFFF;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-primary);
  border-radius:7px;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.rl:hover{background:#F0FDFA;border-color:#6EE7B7;transform:translateX(2px)}
.rl.due{border-left-color:var(--color-destructive)}
.rl.low{border-left-color:var(--color-accent)}
.av{
  display:grid;
  flex:none;
  place-items:center;
  width:37px;
  height:37px;
  color:#FFFFFF;
  background:#047857;
  border:1px solid #065F46;
  border-radius:6px;
  font-family:Inter,ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.rl.due .av{background:#B91C1C;border-color:#991B1B}
.rl.low .av{color:#FFFFFF;background:#C2410C;border-color:#9A3412}
.rl .mid{flex:1;min-width:0}
.rl .mid b{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:600}
.rl .mid small{display:block;margin-top:1px;color:var(--color-muted-foreground);font-size:10.5px}
.rl .rt{flex:none;max-width:45%;text-align:right}
.rl .rt b{color:#065F46;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600}
.rl .rt small{display:block;color:var(--color-muted-foreground);font-size:9.5px}
.stars{color:#9A3412;font-size:11px;letter-spacing:.04em}
.bar{height:7px;overflow:hidden;background:#DCE7E9;border:1px solid #CBD5E1;border-radius:2px}
.bar i{display:block;height:100%;background:var(--color-primary);border-radius:1px}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 8px;color:#065F46;background:#D1FAE5;border:1px solid #6EE7B7;border-radius:999px;font-size:10px;font-weight:600}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcards>*{min-width:0}
.mc{
  position:relative;
  min-height:132px;
  padding:16px;
  overflow:hidden;
  color:#FFFFFF;
  border:1px solid rgba(0,0,0,.25);
  border-radius:8px;
  box-shadow:4px 4px 0 rgba(6,78,59,.12);
}
.mc:before{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.13));content:""}
.mc.g{background:#065F46}.mc.s{background:#475569}.mc.b{background:#9A3412}
.mc .lvl{position:relative;font-size:9.5px;font-weight:600;letter-spacing:.12em}
.mc .nm{position:relative;margin-top:4px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;font-weight:600}
.mc .bal{position:relative;margin-top:11px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mc .bal small{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:10px;font-weight:500;opacity:.9}
.mc .ico{position:absolute;right:12px;bottom:9px;font-size:48px;opacity:.18}
.timeline{position:relative;padding-left:18px}
.timeline:before{position:absolute;top:4px;bottom:4px;left:5px;width:2px;background:var(--color-border);content:""}
.ti{position:relative;padding:0 0 13px 12px}
.ti:last-child{padding-bottom:0}
.ti:before{position:absolute;top:3px;left:-16px;width:10px;height:10px;background:var(--color-primary);border:2px solid #FFFFFF;border-radius:50%;box-shadow:0 0 0 2px #6EE7B7;content:""}
.ti b{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600}
.ti small{display:block;color:var(--color-muted-foreground);font-size:10.5px}
.ti .tm{color:#065F46;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.hamb{display:none}
@media(max-width:1024px){
  .shell{grid-template-columns:218px minmax(0,1fr)}
  .main{padding-inline:18px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g21{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:768px){
  .shell{display:block}
  .side{position:relative;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--color-border)}
  .side .bd{min-height:48px;margin:0;padding:0 4px 10px}
  .side .lg{width:36px;height:36px}
  .side .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .side button{justify-content:flex-start;min-height:40px;padding:8px}
  .side button:hover{transform:none}
  .side .foot{display:none}
  .main{padding:18px 14px 30px}
  .vh{align-items:flex-start;margin-bottom:13px}
  .g11{grid-template-columns:minmax(0,1fr)}
  .mcards{grid-template-columns:minmax(0,1fr)}
  .chart{height:230px}
}
@media(max-width:560px){
  .side .nav{grid-template-columns:repeat(6,minmax(40px,1fr))}
  .side button{justify-content:center;min-height:44px;padding:9px 6px}
  .side button .txt{display:none}
  .side button .material-symbols-outlined{font-size:20px}
  .main{padding-inline:10px}
  .vh{align-items:flex-start}
  .vh p{max-width:235px;font-size:11.5px}
  .live{padding-inline:9px}
  .kpis{gap:8px}
  .kpi{min-height:110px;padding:13px 12px}
  .kpi .v{font-size:22px}
  .card{padding:13px 11px}
  .rl{gap:8px;padding:8px}
  .rl .rt{max-width:42%}
  .av{width:34px;height:34px}
}
@media(max-width:390px){
  .vh{display:block}
  .live{width:max-content;margin-top:10px}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  #view>*,.kpi,.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg"><span class="material-symbols-outlined">spa</span></div><div><b>美業預約回訪所</b><span>BEAUTY BOOKING CRM</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="foot">綻美空間 · 松江旗艦店<br/>設計師 5 · 本月會員 862<br/>今日預約 28 · 儲值卡 340</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">營運總覽</h2><p id="vd"></p></div><div class="live"><i></i>即時同步中</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["營運總覽","dashboard","今日預約、到店與業績即時戰情"],
["預約排班","calendar_month","設計師 × 時段預約日曆與衝突提醒"],
["顧客回訪","campaign","回訪名單、週期提醒與低評分跟催"],
["療程紀錄","spa","顧客服務歷程、用料與滿意度紀錄"],
["會員儲值","card_membership","儲值卡餘額、方案購買與扣款明細"],
["營運報表","query_stats","營收、設計師產值與客源結構分析"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span class="txt">'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

/* ---- data ---- */
const TODO=[
