<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>合約追加管制室 · Contract Change-Order</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#64748B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#334155;
  --color-card:#FFFFFF;
  --color-card-foreground:#334155;
  --color-muted:#EBF0F5;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#64748B;
  --blue:#64748B;
  --ink:#0F172A;
  --muted:#475569;
  --line:#CBD5E1;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --accent:#EA580C;
}
*{box-sizing:border-box}
html{background:var(--color-background)}
body{margin:0;background-color:var(--color-background);background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);background-size:32px 32px;color:var(--color-foreground);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;z-index:20;height:100vh;overflow:auto;display:flex;flex-direction:column;background:#0F172A;color:#F8FAFC;border-right:5px solid var(--color-accent)}
.bd{padding:24px 20px 22px;border-bottom:2px solid #475569;display:grid;grid-template-columns:52px 1fr;gap:13px;align-items:center}
.lg{width:52px;height:52px;display:grid;place-items:center;background:var(--color-accent);border:2px solid #F8FAFC;color:#0F172A;font-size:24px;font-weight:800}
.bd b{display:block;color:#fff;font-size:17px;font-weight:800;letter-spacing:.03em}
.bd span{display:block;margin-top:2px;color:#CBD5E1;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em}
#nav{padding:14px 0}
.side button{position:relative;width:100%;min-height:50px;padding:13px 18px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid #334155;background:transparent;color:#E2E8F0;text-align:left;font-size:14px;font-weight:700}
.side button::after{content:"";position:absolute;right:0;top:0;width:0;height:100%;background:var(--color-accent)}
.side button:hover{background:#1E293B;color:#fff}
.side button.on{background:#F8FAFC;color:#0F172A}
.side button.on::after{width:8px}
.side button.on .material-symbols-outlined{color:var(--color-accent)}
.side .foot{margin-top:auto;padding:18px 20px;border-top:2px solid #475569;color:#CBD5E1;font:11px/1.8 "JetBrains Mono",monospace}
.main{min-width:0;padding:0 28px 40px}
.vh{min-height:188px;margin:0 -28px 22px;padding:34px 32px 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--color-accent);color:#0F172A;border-bottom:5px solid #0F172A}
.vh::before{content:"CHANGE / CONTROL";position:absolute;right:32px;top:16px;font:12px "JetBrains Mono",monospace;letter-spacing:.2em}
.vh h2{margin:0;max-width:760px;font-size:clamp(34px,5vw,72px);font-weight:800;line-height:.93;letter-spacing:-.06em}
.vh p{margin:14px 0 0;font-size:14px;font-weight:700}
.live{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0F172A;border:2px solid #0F172A;color:#fff;font-size:12px;font-weight:800}
.live i{width:10px;height:10px;background:#22C55E;border:2px solid #fff}
.kpis,.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:20px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.kpi,.st{position:relative;min-height:126px;padding:18px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kpi:nth-child(even),.st:nth-child(even){background:var(--color-muted)}
.kpi .l,.st .l{max-width:85%;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.kpi .v,.st .v{margin-top:13px;color:var(--ink);font-size:clamp(20px,2vw,29px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{margin-top:7px;color:var(--muted);font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:14px;color:var(--color-primary);font-size:24px}
.grid{display:grid;gap:20px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{min-width:0;padding:18px;background:var(--card);border:2px solid var(--ink);box-shadow:7px 7px 0 #CBD5E1}
.card h3{margin:0 -18px 16px;padding:0 18px 13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);color:var(--ink);font-size:14px;font-weight:800}
.card h3 .material-symbols-outlined{color:var(--color-accent)}
.tag{display:inline-flex;align-items:center;min-height:23px;padding:2px 8px;border:1px solid currentColor;font-size:10px;font-weight:800;white-space:nowrap}
.t-ok{background:#ECFDF5;color:#047857}.t-warn{background:#FFF7ED;color:#9A3412}.t-bad{background:#FEF2F2;color:#B91C1C}.t-info{background:#F1F5F9;color:#334155}.t-mut{background:#E2E8F0;color:#475569}
.scroll{overflow-x:auto;border:1px solid var(--ink)}
table.data{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
table.data th,table.data td{padding:11px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.data th{background:#0F172A;color:#F8FAFC;font-size:10px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
table.data tr:nth-child(even) td{background:#F8FAFC}
table.data tr:hover td{background:#FFF7ED}
table.data td:nth-child(n+2){font-variant-numeric:tabular-nums}
table.data td:first-child,table.data td:nth-child(2){white-space:nowrap}
table.data td:first-child{font-family:"JetBrains Mono",monospace}
table.data td:nth-last-child(2):not(:first-child){text-align:right}
.pos,.neg{font-family:"JetBrains Mono",monospace;font-weight:700;white-space:nowrap;text-align:right}
.pos{color:var(--bad)}.neg{color:var(--ok)}
.bar{height:10px;overflow:hidden;background:#E2E8F0;border:1px solid #94A3B8}
.bar i{display:block;height:100%;background:var(--color-primary)}
.chart{height:250px}
.alist,.co{display:flex;flex-direction:column;gap:10px}
.al{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;background:#FFF7ED;border:1px solid var(--ink);border-left:8px solid var(--warn)}
.al.bad{background:#FEF2F2;border-left-color:var(--bad)}.al.info{background:#F1F5F9;border-left-color:var(--blue)}
.al .material-symbols-outlined{flex:none;color:var(--warn)}.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--blue)}
.al b{color:var(--ink);font-size:12px}.al small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.cc{padding:13px 14px;background:#fff;border:1px solid var(--ink);border-left:8px solid var(--blue)}
.cc.warn{border-left-color:var(--warn);background:#FFFBEB}.cc.bad{border-left-color:var(--bad);background:#FEF2F2}.cc.ok{border-left-color:var(--ok);background:#ECFDF5}
.cc .ct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cc .ct b{color:var(--ink);font-size:13px}
.cc .steps{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.step{padding:4px 8px;background:#E2E8F0;border:1px solid #94A3B8;color:#334155;font-size:10px;font-weight:800}
.step.done{background:#D1FAE5;border-color:#047857;color:#065F46}.step.now{background:var(--color-accent);border-color:#0F172A;color:#0F172A}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:4px;background:#CBD5E1}
.ti{position:relative;padding:0 0 18px 5px}
.ti::before{content:"";position:absolute;left:-27px;top:2px;width:17px;height:17px;background:var(--blue);border:3px solid #fff;outline:2px solid var(--ink)}
.ti.w::before{background:var(--warn)}.ti.b::before{background:var(--bad)}.ti.g::before{background:var(--ok)}
.ti .tt{color:var(--ink);font-size:12px;font-weight:800}.ti small{color:var(--muted);font:10px "JetBrains Mono",monospace}.ti .dsc{margin-top:3px;color:#334155;font-size:11px}
.appr{display:flex;flex-direction:column}
.ap{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:15px}
.ap::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:3px;background:#CBD5E1}.ap:last-child::before{display:none}
.ap .dot{z-index:1;width:34px;height:34px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);color:#fff;font:700 12px "JetBrains Mono",monospace}
.ap .dot.done{background:var(--ok)}.ap .dot.now{background:var(--color-accent);color:#0F172A}.ap .dot.wait{background:#E2E8F0;color:#475569}.ap .dot.bad{background:var(--bad)}
.ap .ab{flex:1;min-width:0;padding:9px 11px;background:#fff;border:1px solid var(--ink)}
.ap .ab b{color:var(--ink);font-size:12px}.ap .ab small{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.mc{padding:13px;background:#fff;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.mc small{color:var(--muted);font-size:10px}.mc .num{margin:7px 0 6px;color:var(--ink);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.vh,.kpi,.st,.card{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.kpi:nth-child(2),.st:nth-child(2){animation-delay:.05s}.kpi:nth-child(3),.st:nth-child(3){animation-delay:.1s}.kpi:nth-child(4),.st:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
@media(max-width:1024px){.shell{grid-template-columns:220px minmax(0,1fr)}.main{padding-left:20px;padding-right:20px}.vh{margin-left:-20px;margin-right:-20px}.g2{grid-template-columns:1fr}.kpis,.stat{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.shell{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:5px solid var(--color-accent)}.bd{padding:14px 16px}.lg{width:44px;height:44px}#nav{display:flex;padding:0;overflow-x:auto;scrollbar-width:thin}.side button{width:auto;min-width:max-content;border-right:1px solid #334155;border-bottom:0}.side button.on::after{top:auto;bottom:0;width:100%;height:6px}.side .foot{display:none}.vh{min-height:170px;padding:40px 20px 22px}.vh::before{right:20px}.vh h2{font-size:42px}.main{padding-bottom:28px}.two,.g11{grid-template-columns:1fr}}
@media(max-width:480px){.kpis,.stat{grid-template-columns:1fr}.kpi,.st{min-height:105px}.main{padding-left:12px;padding-right:12px}.vh{margin-left:-12px;margin-right:-12px;padding-left:14px;padding-right:14px}.vh h2{font-size:36px}.card{padding:14px;box-shadow:4px 4px 0 #CBD5E1}.card h3{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.chart{height:225px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<div class="bd"><div class="lg">追</div><div><b>合約追加管制室</b><span>CHANGE-ORDER</span></div></div>
<div id="nav"></div>
<div class="foot">主約 8 件 · 變更單 34 張<br/>待核 6 · 爭議追蹤 2</div>
</aside>
<main class="main">
<div class="vh"><div><h2 id="vt">變更總覽</h2><p id="vd"></p></div><div class="live"><i aria-hidden="true"></i>合約金額即時彙整</div></div>
<div id="view"></div>
</main>
</div>
<script>
const MOD=[["變更總覽","dashboard","變更總覽","合約金額、追加減帳與待核戰情"],["合約管理","description","合約管理","主約金額、現行合約額與增補協議"],["追加減帳","swap_horiz","追加減帳登記表","變更事由、增減金額與狀態登記"],["核准流程","approval","核准流程","變更分級簽核與權限關卡"],["金額影響","monitoring","金額影響","累計合約金額瀑布與趨勢"],["爭議追蹤","gavel","爭議追蹤","計價爭議與協議進度"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{const b=document.createElement("button");b.dataset.i=i;b.className=i===0?"on":"";b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+"</span>"+m[0];b.onclick=()=>show(i);nav.appendChild(b)});
const CHG=[["CO-2041","地質異常追加基樁","追加","A棟基礎工程","warn","估價中",4820000],["CO-2040","業主變更外牆石材","追加","立面裝修","ok","已核准",6350000],["CO-2039","取消地下機械車位","減帳","停車場結構","ok","已核准",-3180000],["CO-2038","機電管線改道","追加","水電工程","bad","爭議中",1240000],["CO-2037","增設雨水回收系統","追加","給排水","info","待核准",2760000],["CO-2036","景觀植栽規格降級","減帳","景觀工程","ok","已核准",-960000],["CO-2035","消防泡沫系統升級","追加","消防工程","info","待核准",1880000],["CO-2034","結構補強鋼構","追加","主體結構","ok","已核准",5410000],["CO-2033","刪除頂樓花架","減帳","屋突工程","ok","已核准",-540000],["CO-2032","停車場地坪材質變更","追加","裝修工程","warn","估價中",720000]];
const ALERTS=[["CO-2038 機電管線改道 進入爭議","計價單價與合約不符，差額 NT$412,000 待協議","bad"],["CO-2041 地質異常追加基樁 逾估價時效","估價已 5 日未回，恐影響下週開工","warn"],["累計追加金額達主約 8.4%","已接近 10% 契約變更上限，需董事會核備","info"]];
const CONT=[["C-A2 台中七期商辦新建",182000000,15240000,"施工中","warn"],["C-B5 中科廠房擴建",96500000,4820000,"施工中","ok"],["C-C1 高雄住宅公設",64200000,-1500000,"施工中","ok"],["C-D3 捷運聯開站體",320000000,22600000,"施工中","bad"],["C-E7 舊廠辦整建",28800000,860000,"竣工估驗","ok"]];
const DISP=[["CO-2038","機電管線改道","單價認定差異","業主主張沿用原合約單價，承商依變更後材料報價","協議會議","bad",412000],["CO-2029","土方外運追加","數量認定差異","實際外運量與估算量差 380m³，待地磅單佐證","補件審查","warn",286000],["CO-2018","假設工程展延","工期關聯費用","展延 22 天之管理費計算基礎雙方未達共識","已協議","ok",540000]];
const fmt=n=>n.toLocaleString("en-US"),money=n=>(n<0?"-":"+")+"NT$"+fmt(Math.abs(n)),m2=n=>"NT$"+fmt(n);
const icon=n=>'<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>";
const SCREENS=[
()=>`<div class="kpis">
<div class="kpi">${icon("description")}<div class="l">原合約總額</div><div class="v">NT$ 6.92<small> 億</small></div><div class="d">8 件主約</div></div>
<div class="kpi">${icon("trending_up")}<div class="l">累計追加</div><div class="v" style="color:var(--bad)">+58.0M</div><div class="d">占主約 8.4%</div></div>
<div class="kpi">${icon("trending_down")}<div class="l">累計減帳</div><div class="v" style="color:var(--ok)">-6.2M</div><div class="d">占主約 0.9%</div></div>
<div class="kpi">${icon("pending_actions")}<div class="l">待核 / 爭議</div><div class="v">6 / 2</div><div class="d">警示：6 待核 · 2 爭議</div></div></div>
<div class="grid g2"><div class="card"><h3>${icon("waterfall_chart")}現行合約金額結構（原合約 → 追加 → 減帳）</h3><div class="chart" id="c_wf"></div><h3 style="margin-top:18px">${icon("notifications_active")}變更預警</h3><div class="alist">${ALERTS.map(a=>`<div class="al ${a[2]}">${icon(a[2]==="bad"?"error":a[2]==="warn"?"warning":"info")}<div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join("")}</div></div>
<div class="card"><h3>${icon("donut_small")}變更單狀態分佈</h3><div class="chart" id="c_pie" style="height:220px"></div><h3>${icon("summarize")}本月變更彙總</h3><div class="mg"><div class="mc"><small>新增變更單</small><div class="num">12</div><span class="tag t-info">張</span></div><div class="mc"><small>核准通過</small><div class="num" style="color:var(--ok)">7</div><span class="tag t-ok">已增修</span></div><div class="mc"><small>淨影響金額</small><div class="num" style="color:var(--bad)">+8.9M</div><span class="tag t-warn">追加為主</span></div></div></div></div>`,
()=>`<div class="stat"><div class="st"><div class="l">在管主約</div><div class="v">8 件</div></div><div class="st"><div class="l">原合約總額</div><div class="v">NT$ 6.92 億</div></div><div class="st"><div class="l">現行合約總額</div><div class="v">NT$ 7.44 億</div></div><div class="st"><div class="l">變更增補協議</div><div class="v">31 版</div></div></div>
<div class="card"><h3>${icon("table_chart")}主約現行合約金額</h3><div class="scroll"><table class="data"><tr><th>合約</th><th>原合約金額</th><th>累計變更</th><th>現行合約金額</th><th>變更比</th><th>狀態</th></tr>${CONT.map(c=>{const cur=c[1]+c[2],p=c[2]/c[1]*100,col=Math.abs(p)>=8?"var(--bad)":Math.abs(p)>=4?"var(--warn)":"var(--blue)";return`<tr><td><b>${c[0]}</b></td><td>${m2(c[1])}</td><td class="${c[2]<0?"neg":"pos"}">${money(c[2])}</td><td><b>${m2(cur)}</b></td><td style="min-width:130px"><div class="bar"><i style="width:${Math.min(100,Math.abs(p)*8)}%;background:${col}"></i></div><small>${p>=0?"+":""}${p.toFixed(1)}%</small></td><td><span class="tag t-${c[4]==="bad"?"bad":c[4]==="warn"?"warn":"ok"}">${c[3]}</span></td></tr>`}).join("")}</table></div></div>

let charts=[];
function clr(){charts.forEach(c=>{try{c.dispose()}catch(e){}});charts=[]}
function mk(id){const e=document.getElementById(id);if(!e)return null;const c=echarts.init(e);charts.push(c);return c}
const BLUE="#64748B",BLUE2="#94A3B8",ORANGE="#EA580C",RED="#B91C1C",GRN="#047857",GREY="#CBD5E1";
