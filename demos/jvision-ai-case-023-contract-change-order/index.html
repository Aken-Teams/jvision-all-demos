<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>合約追加管制室 · Contract Change-Order</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#0f172a;--accent:#1d4ed8;--accent2:#3b82f6;--bg:#eef2fb;--card:#fff;--line:#dbe3f2;--mut:#64748b;--ok:#059669;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#1e3a8a,#172554);color:#c7d2fe;padding:18px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 6px 18px rgba(29,78,216,.5)}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:#93a7f0;letter-spacing:1.2px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#c7d2fe;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#93a7f0}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#93a7f0;border-top:1px solid rgba(255,255,255,.12)}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#dbeafe;color:#1e40af;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px;color:var(--ok)}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.4}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1e40af}.t-mut{background:#e2e8f0;color:#475569}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f2f6fd}
.pos{color:var(--bad);font-weight:800;font-family:Inter}
.neg{color:var(--ok);font-weight:800;font-family:Inter}
.bar{height:8px;background:#eef2fb;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.scroll{overflow-x:auto}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.st{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.st .l{font-size:11.5px;color:var(--mut);font-weight:600}
.st .v{font-size:19px;font-weight:800;font-family:Inter;margin-top:3px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:9px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}.al.info{border-color:var(--accent);background:#eff4ff}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--accent)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.co{display:flex;flex-direction:column;gap:10px}
.cc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px}
.cc.warn{border-left-color:var(--warn)}.cc.bad{border-left-color:var(--bad)}.cc.ok{border-left-color:var(--ok)}
.cc .ct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cc .ct b{font-family:"Noto Sans TC";font-size:13.5px}
.cc .steps{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.step{font-size:10.5px;padding:3px 9px;border-radius:20px;background:#eef2fb;color:var(--mut);font-weight:700}
.step.done{background:#d1fae5;color:#047857}.step.now{background:#1d4ed8;color:#fff}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 16px 4px}
.ti::before{content:"";position:absolute;left:-21px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.w::before{background:var(--warn)}.ti.b::before{background:var(--bad)}.ti.g::before{background:var(--ok)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:12px;color:#475569;margin-top:2px}
.appr{display:flex;flex-direction:column;gap:0}
.ap{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.ap::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.ap:last-child::before{display:none}
.ap .dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.ap .dot.done{background:var(--ok)}.ap .dot.now{background:var(--accent)}.ap .dot.wait{background:#cbd5e1;color:#64748b}.ap .dot.bad{background:var(--bad)}
.ap .ab{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.ap .ab b{font-family:"Noto Sans TC";font-size:13px}
.ap .ab small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mc{border:1px solid var(--line);border-radius:14px;padding:14px}
.mc b{font-family:"Noto Sans TC";font-size:14px;display:block}
.mc small{color:var(--mut);font-size:11px}
.mc .num{font-size:22px;font-weight:800;font-family:Inter;margin:8px 0 6px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto}.side .foot{display:none}.side #nav{display:flex;flex-wrap:wrap;gap:4px}.kpis,.stat{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">追</div><div><b>合約追加管制室</b><span>CHANGE-ORDER</span></div></div>
    <div id="nav"></div>
    <div class="foot">主約 8 件 · 變更單 34 張<br/>待核 6 · 爭議追蹤 2</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">變更總覽</h2><p id="vd"></p></div><div class="live"><i></i>合約金額即時彙整</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["變更總覽","dashboard","變更總覽","合約金額、追加減帳與待核戰情"],
["合約管理","description","合約管理","主約金額、現行合約額與增補協議"],
["追加減帳","swap_horiz","追加減帳登記表","變更事由、增減金額與狀態登記"],
["核准流程","approval","核准流程","變更分級簽核與權限關卡"],
["金額影響","monitoring","金額影響","累計合約金額瀑布與趨勢"],
["爭議追蹤","gavel","爭議追蹤","計價爭議與協議進度"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const CHG=[
["CO-2041","地質異常追加基樁","追加","A棟基礎工程","warn","估價中",4820000],
["CO-2040","業主變更外牆石材","追加","立面裝修","ok","已核准",6350000],
["CO-2039","取消地下機械車位","減帳","停車場結構","ok","已核准",-3180000],
["CO-2038","機電管線改道","追加","水電工程","bad","爭議中",1240000],
["CO-2037","增設雨水回收系統","追加","給排水","info","待核准",2760000],
["CO-2036","景觀植栽規格降級","減帳","景觀工程","ok","已核准",-960000],
["CO-2035","消防泡沫系統升級","追加","消防工程","info","待核准",1880000],
["CO-2034","結構補強鋼構","追加","主體結構","ok","已核准",5410000],
["CO-2033","刪除頂樓花架","減帳","屋突工程","ok","已核准",-540000],
["CO-2032","停車場地坪材質變更","追加","裝修工程","warn","估價中",720000]];

const ALERTS=[
["CO-2038 機電管線改道 進入爭議","計價單價與合約不符，差額 NT$412,000 待協議","bad"],
["CO-2041 地質異常追加基樁 逾估價時效","估價已 5 日未回，恐影響下週開工","warn"],
["累計追加金額達主約 8.4%","已接近 10% 契約變更上限，需董事會核備","info"]];

const CONT=[
["C-A2 台中七期商辦新建",182000000,15240000,"施工中","warn"],
["C-B5 中科廠房擴建",96500000,4820000,"施工中","ok"],
["C-C1 高雄住宅公設",64200000,-1500000,"施工中","ok"],
["C-D3 捷運聯開站體",320000000,22600000,"施工中","bad"],
["C-E7 舊廠辦整建",28800000,860000,"竣工估驗","ok"]];

const DISP=[
["CO-2038","機電管線改道","單價認定差異","業主主張沿用原合約單價，承商依變更後材料報價","協議會議","bad",412000],
["CO-2029","土方外運追加","數量認定差異","實際外運量與估算量差 380m³，待地磅單佐證","補件審查","warn",286000],
["CO-2018","假設工程展延","工期關聯費用","展延 22 天之管理費計算基礎雙方未達共識","已協議","ok",540000]];

const fmt=n=>n.toLocaleString('en-US');
const money=n=>(n<0?'-':'+')+'NT$'+fmt(Math.abs(n));
const m2=n=>'NT$'+fmt(n);

const SCREENS=[
// 0 變更總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">description</span><div class="l">原合約總額</div><div class="v">NT$ 6.92<small style="font-size:12px"> 億</small></div><div class="d" style="color:var(--mut)">8 件主約</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">trending_up</span><div class="l">累計追加</div><div class="v" style="color:var(--bad)">+58.0M</div><div class="d" style="color:var(--mut)">占主約 8.4%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">trending_down</span><div class="l">累計減帳</div><div class="v" style="color:var(--ok)">-6.2M</div><div class="d" style="color:var(--mut)">占主約 0.9%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">pending_actions</span><div class="l">待核 / 爭議</div><div class="v">6<small style="font-size:14px"> / </small>2</div><div class="d" style="color:var(--warn)">6 待核 · 2 爭議</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">waterfall_chart</span>現行合約金額結構（原合約 → 追加 → 減帳）</h3><div class="chart" id="c_wf"></div>
  <h3 style="margin-top:14px"><span class="material-symbols-outlined">notifications_active</span>變更預警</h3><div class="alist">${ALERTS.map(a=>`<div class="al ${a[2]}"><span class="material-symbols-outlined">${a[2]=='bad'?'error':a[2]=='warn'?'warning':'info'}</span><div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_small</span>變更單狀態分佈</h3><div class="chart" id="c_pie" style="height:220px"></div>
  <h3 style="margin-top:10px"><span class="material-symbols-outlined">summarize</span>本月變更彙總</h3>
  <div class="mg"><div class="mc"><small>新增變更單</small><div class="num">12</div><span class="tag t-info">張</span></div>
  <div class="mc"><small>核准通過</small><div class="num" style="color:var(--ok)">7</div><span class="tag t-ok">已增修</span></div>
  <div class="mc"><small>淨影響金額</small><div class="num" style="color:var(--bad);font-size:17px">+8.9M</div><span class="tag t-warn">追加為主</span></div></div></div>
</div>`,
// 1 合約管理
()=>`<div class="stat">
 <div class="st"><div class="l">在管主約</div><div class="v">8 件</div></div>
 <div class="st"><div class="l">原合約總額</div><div class="v">NT$ 6.92 億</div></div>
 <div class="st"><div class="l">現行合約總額</div><div class="v" style="color:var(--accent)">NT$ 7.44 億</div></div>
 <div class="st"><div class="l">變更增補協議</div><div class="v">31 版</div></div>
</div>
<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>主約現行合約金額</h3><div class="scroll"><table class="data"><tr><th>合約</th><th>原合約金額</th><th>累計變更</th><th>現行合約金額</th><th>變更比</th><th>狀態</th></tr>${CONT.map(c=>{const cur=c[1]+c[2];const p=(c[2]/c[1]*100);const col=Math.abs(p)>=8?'var(--bad)':Math.abs(p)>=4?'var(--warn)':'var(--accent)';return `<tr><td><b>${c[0]}</b></td><td>${m2(c[1])}</td><td class="${c[2]<0?'neg':'pos'}">${money(c[2])}</td><td style="font-weight:700">${m2(cur)}</td><td style="min-width:130px"><div class="bar"><i style="width:${Math.min(100,Math.abs(p)*8)}%;background:${col}"></i></div><small style="color:var(--mut);font-size:10.5px">${p>=0?'+':''}${p.toFixed(1)}%</small></td><td><span class="tag t-${c[4]=='bad'?'bad':c[4]=='warn'?'warn':'ok'}">${c[3]}</span></td></tr>`;}).join('')}</table></div></div>
<div class="two" style="margin-top:16px"><div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各主約原合約 vs 現行合約</h3><div class="chart" id="c_cont"></div></div>
<div class="card"><h3><span class="material-symbols-outlined">history_edu</span>C-D3 捷運聯開 · 合約增補協議版本</h3><div class="tl">
 <div class="ti g"><div class="tt">V0 原始合約</div><small>2025-02-10 · NT$320,000,000</small><div class="dsc">主體結構、機電、裝修統包，工期 720 日曆天。</div></div>
 <div class="ti"><div class="tt">V1 增補協議（追加）</div><small>2025-06-18 · +NT$8,400,000</small><div class="dsc">站體與商場連通道結構補強，追加鋼構工項。</div></div>
 <div class="ti w"><div class="tt">V2 增補協議（追減）</div><small>2025-11-05 · 淨 +NT$5,600,000</small><div class="dsc">取消部分景觀並增設消防，工期展延 22 日。</div></div>
 <div class="ti b"><div class="tt">V3 增補協議（審議中）</div><small>2026-08-05 · +NT$8,600,000（估）</small><div class="dsc">機電管線改道爭議未決，現行金額暫計 NT$342,600,000。</div></div>
</div></div></div>`,
// 2 追加減帳登記表
()=>`<div class="stat">
 <div class="st"><div class="l">變更單總數</div><div class="v">34 張</div></div>
 <div class="st"><div class="l">追加金額</div><div class="v" style="color:var(--bad)">+NT$ 24.9M</div></div>
 <div class="st"><div class="l">減帳金額</div><div class="v" style="color:var(--ok)">-NT$ 4.6M</div></div>
 <div class="st"><div class="l">淨變更影響</div><div class="v" style="color:var(--accent)">+NT$ 20.3M</div></div>
</div>
<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>追加減帳登記表 <span class="tag t-info" style="margin-left:auto">C-A2 台中七期商辦</span></h3><div class="scroll"><table class="data"><tr><th>編號</th><th>變更事由</th><th>類別</th><th>影響工項</th><th>金額 ±</th><th>狀態</th></tr>${CHG.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td><span class="tag t-${c[2]=='追加'?'bad':'ok'}">${c[2]}</span></td><td>${c[3]}</td><td class="${c[6]<0?'neg':'pos'}">${money(c[6])}</td><td><span class="tag t-${c[4]=='bad'?'bad':c[4]=='warn'?'warn':c[4]=='info'?'info':'ok'}">${c[5]}</span></td></tr>`).join('')}</table></div>
<p style="font-size:11.5px;color:var(--mut);margin:12px 0 0">追加以紅色、減帳以綠色標示；狀態流轉：待核准 → 估價中 → 已核准／爭議中。單筆逾 NT$5M 需升級主管核准。</p></div>
