<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warranty/RMA Management（保固退貨管理）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;

  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#EFF6FF;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --ok:#15803D;
  --warn:#A34509;
  --bad:var(--color-destructive);
  --info:#0369A1;
  --radius:4px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.045);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:"Fira Sans",sans-serif;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#DBEAFE;color:#172554}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  letter-spacing:normal;
  vertical-align:middle;
  display:inline-block;
}

.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:248px;
  flex:0 0 248px;
  min-width:0;
  height:100vh;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  color:#DBEAFE;
  background:#172554;
  border-right:1px solid #1E3A8A;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  margin-bottom:18px;
  padding:0 4px 18px;
  border-bottom:1px solid rgba(255,255,255,.16);
}
.brand .logo{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#172554;
  background:#FFFFFF;
  border-radius:2px;
  box-shadow:6px 6px 0 #2563EB;
}
.brand .logo .material-symbols-outlined{font-size:23px;color:#1D4ED8}
.brand h1{margin:0;color:#FFFFFF;font-size:15px;font-weight:700;letter-spacing:.03em}
.brand p{margin:3px 0 0;color:#BFDBFE;font-size:10.5px;letter-spacing:.025em}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav-label{
  padding:7px 10px 5px;
  color:#93C5FD;
  font-size:10px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-width:0;
  padding:10px 11px;
  color:#DBEAFE;
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  text-align:left;
  font-size:13px;
  font-weight:500;
  transition:background-color 200ms ease,border-color 200ms ease,color 200ms ease,transform 200ms ease;
}
.nav button .material-symbols-outlined{flex:0 0 20px;font-size:20px}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{color:#FFFFFF;background:rgba(59,130,246,.24);border-color:rgba(147,197,253,.32);transform:translateX(2px)}
.nav button.active{
  color:#172554;
  background:#FFFFFF;
  border-color:#FFFFFF;
  box-shadow:inset 4px 0 0 var(--color-accent),0 8px 18px rgba(0,0,0,.18);
}
.nav button.active .material-symbols-outlined{color:var(--color-primary)}
.side-foot{
  margin-top:auto;
  padding:13px 8px 3px;
  color:#BFDBFE;
  border-top:1px solid rgba(255,255,255,.16);
  font-size:10.5px;
  line-height:1.7;
}
.side-foot b{color:#FFFFFF;letter-spacing:.08em}

.main{flex:1 1 auto;min-width:0;max-width:100%;padding:24px 28px 48px}
#screen{max-width:1540px;margin:0 auto;animation:screen-in 360ms ease-out both}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding:0 0 14px;
  border-bottom:1px solid var(--line);
}
.topbar::after{content:"";position:absolute;left:0;bottom:-1px;width:68px;height:3px;background:var(--color-primary)}
.topbar .htxt{min-width:0}
.topbar h2{margin:0;color:#0F172A;font-size:22px;font-weight:700;letter-spacing:-.025em}
.topbar p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  padding:7px 11px;
  color:#1E3A8A;
  background:#DBEAFE;
  border:1px solid #93C5FD;
  border-radius:2px;
  font-family:"Fira Code",monospace;
  font-size:11.5px;
  font-weight:600;
}

.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.card{
  min-width:0;
  padding:15px 16px;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:border-color 220ms ease,box-shadow 220ms ease,transform 220ms ease;
}
.card:hover{border-color:#BFDBFE;box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(37,99,235,.07);transform:translateY(-1px)}
.card h3{margin:0 0 3px;color:#172554;font-size:14px;font-weight:700;letter-spacing:.005em}
.card .sub{margin:0 0 11px;color:var(--muted);font-size:11.5px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid #EEF2F7}
.card-head h3{margin:0}

.kpi{position:relative;overflow:hidden;padding-top:14px;border-top:3px solid var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-22px;bottom:-30px;width:76px;height:76px;border:1px solid #DBEAFE;transform:rotate(45deg)}
.kpi .k-ico{
  position:absolute;
  right:12px;
  top:11px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1D4ED8;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:2px;
}
.kpi .k-ico .material-symbols-outlined{font-size:19px}
.kpi .k-lab{max-width:calc(100% - 42px);color:var(--muted);font-size:11.5px;font-weight:500}
.kpi .k-val{margin:7px 0 2px;color:#0F172A;font-family:"Fira Code",monospace;font-size:26px;font-weight:700;letter-spacing:-.055em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .k-val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:0}
.kpi .k-tag{position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.up{color:#166534}.down{color:#B91C1C}.flat{color:#475569}

.chart-wrap{position:relative;width:100%;overflow:hidden}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:2px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:8px 10px;
  color:#334155;
  background:#E9EFF8;
  border-bottom:1px solid #CBD5E1;
  text-align:left;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
}
td{padding:9px 10px;color:#334155;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color 180ms ease,box-shadow 180ms ease}
tbody tr:hover{background:#EFF6FF;box-shadow:inset 3px 0 0 var(--color-primary)}
td:has(.bar),td:nth-child(n+3):has(.mono){text-align:right}
.mono,.t-id,.a-t{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.mono{font-size:11.5px;font-weight:600;letter-spacing:-.02em}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:10px;
  font-weight:600;
  line-height:1.25;
  white-space:nowrap;
}
.b-ok{color:#166534;background:#F0FDF4;border-color:#86EFAC}
.b-warn{color:#92400E;background:#FFFBEB;border-color:#FCD34D}
.b-bad{color:#B91C1C;background:#FEF2F2;border-color:#FCA5A5}
.b-info{color:#075985;background:#F0F9FF;border-color:#7DD3FC}
.b-mut{color:#475569;background:#F8FAFC;border-color:#CBD5E1}
.b-acc{color:#1E40AF;background:#EFF6FF;border-color:#93C5FD}

.bar{height:6px;min-width:60px;overflow:hidden;background:#E2E8F0;border-radius:1px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:1px}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;min-width:900px}
.col{min-width:0;padding:9px;background:#F8FAFC;border:1px solid var(--line);border-top:3px solid #94A3B8;border-radius:2px}
.col:nth-child(2){border-top-color:var(--color-primary)}
.col:nth-child(3){border-top-color:#0369A1}
.col:nth-child(4){border-top-color:#15803D}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px 7px;border-bottom:1px solid var(--line);color:#334155;font-size:11.5px;font-weight:700}
.col-h .cnt{min-width:23px;padding:1px 6px;color:#334155;background:#FFFFFF;border:1px solid #CBD5E1;border-radius:2px;text-align:center;font-family:"Fira Code",monospace;font-size:10px}
.ticket{margin-bottom:7px;padding:8px 9px;background:#FFFFFF;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:2px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:border-color 180ms ease,box-shadow 180ms ease,transform 180ms ease}
.ticket:hover{border-color:#93C5FD;box-shadow:0 5px 14px rgba(37,99,235,.09);transform:translateY(-1px)}
.ticket:last-child{margin-bottom:0}
.ticket .t-id{color:#475569;font-size:10px;font-weight:600}
.ticket .t-tt{margin:3px 0 6px;color:#1E293B;font-size:11.5px;font-weight:600}
.ticket .t-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;color:#475569;font-size:10px}

.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow .li-ico{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;border-radius:2px}
.lrow .li-ico .material-symbols-outlined{font-size:19px}
.lrow .li-main{flex:1 1 auto;min-width:0}
.lrow .li-t{color:#1E293B;font-size:12px;font-weight:600}
.lrow .li-s{color:var(--muted);font-size:10.5px}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.gauge-center .g-v{color:var(--color-primary);font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em}
.gauge-center .g-l{color:var(--muted);font-size:10px;font-weight:500}

.field{min-width:0;padding:9px 10px;background:#F8FAFC;border:1px solid var(--line);border-left:3px solid #CBD5E1;border-radius:2px}
.field .f-l{margin-bottom:3px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.035em}
.field .f-v{color:#1E293B;font-size:12.5px;font-weight:600}
.stepline{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:4px}
.step{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600}
.step .s-n{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#475569;background:#E2E8F0;border:1px solid #CBD5E1;border-radius:2px;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.step.done{color:#1E3A8A}
.step.done .s-n{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary)}
.step.now{color:#9A3412}
.step.now .s-n{color:#000000;background:var(--color-accent);border-color:#C2410C;box-shadow:0 0 0 3px #FFEDD5}
.step-sep{flex:1 1 20px;min-width:12px;height:1px;margin:0 7px;background:#CBD5E1}

.audit{font-family:"Fira Sans",sans-serif;font-size:11.5px}
.audit .a-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed #CBD5E1}
.audit .a-row:last-child{border-bottom:none}
.audit .a-t{flex:0 0 88px;color:#475569;font-size:10px;font-weight:500}
.audit .a-b{flex:1 1 auto;min-width:0;color:#334155}
.dot-lg{width:8px;height:8px;display:inline-block;margin-right:6px;border:2px solid currentColor;border-radius:50%;box-shadow:0 0 0 2px #FFFFFF}
.callout{display:flex;gap:9px;padding:10px 11px;color:#1E3A8A;background:#EFF6FF;border:1px solid #93C5FD;border-left:4px solid var(--color-primary);border-radius:2px;font-size:11.5px}
.callout .material-symbols-outlined{flex:0 0 auto;color:var(--color-primary);font-size:19px}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hbar .h-l{flex:0 0 92px;color:#475569;font-size:11px;font-weight:500;text-align:right}
.hbar .h-t{flex:1 1 auto;min-width:0}
.hbar .h-v{flex:0 0 44px;color:#1E293B;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.hbar .bar{width:100%}

/* Inline action button: orange denotes the primary row action. */
table button{
  min-height:30px;
  padding:5px 11px!important;
  color:#000000!important;
  background:var(--color-accent)!important;
  border:1px solid #C2410C!important;
  border-radius:2px!important;
  font-weight:700!important;
  box-shadow:0 1px 2px rgba(124,45,18,.18);
  transition:background-color 180ms ease,box-shadow 180ms ease,transform 180ms ease!important;
}
table button:hover{background:#F97316!important;box-shadow:0 4px 10px rgba(194,65,12,.2);transform:translateY(-1px)}
table button:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}

@keyframes screen-in{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,3fr) minmax(280px,2fr)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;flex:none;position:static;padding:12px 14px;border-right:none;border-bottom:1px solid #1E3A8A}
  .brand{margin-bottom:0;padding:0;border-bottom:none}
  .brand .logo{width:36px;height:36px;flex-basis:36px;box-shadow:4px 4px 0 #2563EB}
  .nav{width:100%;margin-top:11px;display:grid;grid-template-columns:repeat(6,minmax(42px,1fr));gap:5px}
  .nav-label{display:none}
  .nav button{justify-content:center;padding:9px 7px;text-align:center}
  .nav button .txt{display:none}
  .nav button:hover{transform:none}
  .side-foot{display:none}
  .main{padding:18px 16px 40px}
}
@media(max-width:768px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column;gap:10px}
  .pill{align-self:flex-start}
  .board{grid-template-columns:repeat(4,minmax(210px,1fr))}
  .card{padding:14px}
}
@media(max-width:560px){
  .main{padding:16px 12px 34px}
  .g4{grid-template-columns:1fr}
  .topbar h2{font-size:19px}
  .topbar p{font-size:12px}
  .nav{grid-template-columns:repeat(6,1fr)}
  .nav button{min-height:42px;padding:9px 5px}
  .nav button .material-symbols-outlined{font-size:19px}
  .kpi .k-val{font-size:24px}
  .stepline{align-items:flex-start;flex-direction:column;gap:6px}
  .step-sep{width:1px;height:10px;min-height:10px;min-width:1px;flex:0 0 10px;margin:0 0 0 10px}
  .hbar .h-l{flex-basis:86px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #screen{animation:none;opacity:1;transform:none}
  .card:hover,.ticket:hover,table button:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div>
        <h1>保固退貨管理</h1>
        <p>Warranty / RMA Management</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">功能模組</div>
      <button data-i="0" class="active"><span class="material-symbols-outlined">receipt_long</span><span class="txt">RMA 申請受理</span></button>
      <button data-i="1"><span class="material-symbols-outlined">fact_check</span><span class="txt">退貨檢驗判定</span></button>
      <button data-i="2"><span class="material-symbols-outlined">build</span><span class="txt">維修換貨處理</span></button>
      <button data-i="3"><span class="material-symbols-outlined">inventory_2</span><span class="txt">退料庫存管理</span></button>
      <button data-i="4"><span class="material-symbols-outlined">insights</span><span class="txt">退貨分析看板</span></button>
      <button data-i="5"><span class="material-symbols-outlined">verified</span><span class="txt">保固結案稽核</span></button>
    </nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br /><b>JVISION</b> Smart MFG · 098</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var screenEl=document.getElementById("screen");
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;var c=new Chart(el.getContext("2d"),cfg);charts.push(c);return c;}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}

var TEAL="#0f766e",TEAL2="#5eead4",TEAL3="#0d635c";
var gridColor="rgba(15,118,110,.08)";
Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
Chart.defaults.color="#5f7d78";
Chart.defaults.font.size=11.5;

function kpiCard(o){
  return '<div class="card kpi"><div class="k-ico"><span class="material-symbols-outlined">'+o.icon+'</span></div>'+
    '<div class="k-lab">'+o.lab+'</div><div class="k-val">'+o.val+(o.unit?' <small>'+o.unit+'</small>':'')+'</div>'+
    '<div class="k-tag '+o.dir+'"><span class="material-symbols-outlined" style="font-size:15px">'+(o.dir==="up"?"trending_up":o.dir==="down"?"trending_down":"remove")+'</span>'+o.tag+'</div></div>';
}
function bd(cls,txt){return '<span class="badge '+cls+'">'+txt+'</span>';}
function head(t){
  var titles={0:["RMA 申請受理","客戶退貨申請登錄、保固判定與授權編號核發"],
  1:["退貨檢驗判定","到貨檢驗、不良現象分類與責任歸屬判定"],
  2:["維修換貨處理","維修工單派工、換貨出貨與進度追蹤"],
  3:["退料庫存管理","退回品入庫、報廢再生與物料流向控管"],
  4:["退貨分析看板","退貨率、機種缺陷分佈與處理時效趨勢"],
  5:["保固結案稽核","結案回饋、保固成本歸集與稽核軌跡"]};
  var pills={0:"本月受理 218 件",1:"待檢驗 34 件",2:"維修中 27 件",3:"退料庫存 1,462 件",4:"退貨率 1.9%",5:"本月結案 196 件"};
  var d=titles[t];
  return '<div class="topbar"><div class="htxt"><h2>'+d[0]+'</h2><p>'+d[1]+'</p></div>'+
    '<div class="pill"><span class="material-symbols-outlined" style="font-size:17px">bolt</span>'+pills[t]+'</div></div>';
}

var screens=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  (screens[i]||s0)();
}
var navEl=document.getElementById("nav");
navEl.addEventListener("click",function(e){
  var t=e.target;while(t&&t!==navEl&&!t.hasAttribute("data-i")){t=t.parentNode;}
  if(t&&t.hasAttribute("data-i")){location.hash="v"+t.getAttribute("data-i");}
});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
