<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warranty/RMA Management（保固退貨管理）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0f766e;--accent2:#5eead4;--accent-soft:#e6fbf6;
  --bg:#f1f5f4;--panel:#ffffff;--ink:#12312e;--muted:#5f7d78;--line:#dce8e5;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;
  --radius:14px;--shadow:0 1px 3px rgba(15,118,110,.08),0 8px 24px rgba(15,118,110,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;vertical-align:middle;display:inline-block}
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{width:250px;flex:0 0 250px;background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#0d5f59);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11px;margin:2px 0 0;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav-label{font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px 4px;letter-spacing:.5px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:none;border-radius:10px;padding:11px 12px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;flex:0 0 21px}
.nav button .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav button.active{background:linear-gradient(135deg,var(--accent),#0d635c);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28)}
.nav button.active .material-symbols-outlined{color:#fff}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.side-foot b{color:var(--accent)}
.main{flex:1 1 auto;min-width:0;padding:22px 26px 44px;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar .htxt{min-width:0}
.topbar h2{margin:0;font-size:21px;font-weight:800}
.topbar p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:3fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h3{margin:0}
.kpi{position:relative;overflow:hidden}
.kpi .k-ico{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.kpi .k-lab{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .k-val{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
.kpi .k-val small{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .k-tag{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11.5px;padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap;background:#f7fbfa}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
.mono{font-family:"Inter",monospace;font-weight:600;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-ok{background:#e7f6ec;color:var(--ok)}
.b-warn{background:#fdf1e0;color:var(--warn)}
.b-bad{background:#fdeaea;color:var(--bad)}
.b-info{background:#e2f5f8;color:var(--info)}
.b-mut{background:#eef2f1;color:var(--muted)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;border-radius:5px;background:#eef2f1;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:#f7fbfa;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:9px;padding:0 3px}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ticket:last-child{margin-bottom:0}
.ticket .t-id{font-size:11px;color:var(--muted);font-weight:700}
.ticket .t-tt{font-size:12.5px;font-weight:700;margin:3px 0 6px}
.ticket .t-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);gap:6px;flex-wrap:wrap}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow .li-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.lrow .li-main{flex:1 1 auto;min-width:0}
.lrow .li-t{font-size:13px;font-weight:700}
.lrow .li-s{font-size:11.5px;color:var(--muted)}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.gauge-center .g-v{font-size:26px;font-weight:800;color:var(--accent)}
.gauge-center .g-l{font-size:11px;color:var(--muted);font-weight:600}
.field{background:#f7fbfa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.field .f-l{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
.field .f-v{font-size:13.5px;font-weight:700}
.stepline{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:4px}
.step{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.step .s-n{width:22px;height:22px;border-radius:50%;background:#eef2f1;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step.done .s-n{background:var(--accent);color:#fff}
.step.now .s-n{background:var(--accent2);color:#083c38;box-shadow:0 0 0 4px var(--accent-soft)}
.step.now{color:var(--accent)}
.step-sep{flex:1 1 20px;height:2px;background:var(--line);margin:0 8px;min-width:12px}
.audit{font-family:"Inter","Noto Sans TC",sans-serif;font-size:12px}
.audit .a-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.audit .a-row:last-child{border-bottom:none}
.audit .a-t{color:var(--muted);flex:0 0 90px;font-size:11px;font-weight:600}
.audit .a-b{flex:1 1 auto;min-width:0}
.dot-lg{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.callout{display:flex;gap:10px;background:var(--accent-soft);border:1px solid #c7efe7;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#0b4f49}
.callout .material-symbols-outlined{color:var(--accent);flex:0 0 auto}
.hbar{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.hbar .h-l{flex:0 0 92px;font-size:12px;font-weight:600;text-align:right;color:var(--muted)}
.hbar .h-t{flex:1 1 auto;min-width:0}
.hbar .h-v{flex:0 0 44px;font-size:12px;font-weight:800;text-align:right}
.hbar .bar{width:100%}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px}
  .brand{border-bottom:none;margin-bottom:0;padding:0;flex:1 1 auto}
  .nav{flex-direction:row;flex-wrap:wrap;width:100%;margin-top:10px;gap:6px}
  .nav-label{display:none}
  .nav button{width:auto}
  .side-foot{display:none}
  .main{padding:18px 16px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:10px}
  .board{grid-template-columns:1fr}
  .topbar h2{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div>
        <h1>保固退貨管理</h1>
        <p>Warranty / RMA Management</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">功能模組</div>
      <button data-i="0" class="active"><span class="material-symbols-outlined">receipt_long</span><span class="txt">RMA 申請受理</span></button>
      <button data-i="1"><span class="material-symbols-outlined">fact_check</span><span class="txt">退貨檢驗判定</span></button>
      <button data-i="2"><span class="material-symbols-outlined">build</span><span class="txt">維修換貨處理</span></button>
      <button data-i="3"><span class="material-symbols-outlined">inventory_2</span><span class="txt">退料庫存管理</span></button>
      <button data-i="4"><span class="material-symbols-outlined">insights</span><span class="txt">退貨分析看板</span></button>
      <button data-i="5"><span class="material-symbols-outlined">verified</span><span class="txt">保固結案稽核</span></button>
    </nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br /><b>JVISION</b> Smart MFG · 098</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var screenEl=document.getElementById("screen");
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;var c=new Chart(el.getContext("2d"),cfg);charts.push(c);return c;}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}

var TEAL="#0f766e",TEAL2="#5eead4",TEAL3="#0d635c";
var gridColor="rgba(15,118,110,.08)";
Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
Chart.defaults.color="#5f7d78";
Chart.defaults.font.size=11.5;

function kpiCard(o){
  return '<div class="card kpi"><div class="k-ico"><span class="material-symbols-outlined">'+o.icon+'</span></div>'+
    '<div class="k-lab">'+o.lab+'</div><div class="k-val">'+o.val+(o.unit?' <small>'+o.unit+'</small>':'')+'</div>'+
    '<div class="k-tag '+o.dir+'"><span class="material-symbols-outlined" style="font-size:15px">'+(o.dir==="up"?"trending_up":o.dir==="down"?"trending_down":"remove")+'</span>'+o.tag+'</div></div>';
}
function bd(cls,txt){return '<span class="badge '+cls+'">'+txt+'</span>';}
function head(t){
  var titles={0:["RMA 申請受理","客戶退貨申請登錄、保固判定與授權編號核發"],
  1:["退貨檢驗判定","到貨檢驗、不良現象分類與責任歸屬判定"],
  2:["維修換貨處理","維修工單派工、換貨出貨與進度追蹤"],
  3:["退料庫存管理","退回品入庫、報廢再生與物料流向控管"],
  4:["退貨分析看板","退貨率、機種缺陷分佈與處理時效趨勢"],
  5:["保固結案稽核","結案回饋、保固成本歸集與稽核軌跡"]};
  var pills={0:"本月受理 218 件",1:"待檢驗 34 件",2:"維修中 27 件",3:"退料庫存 1,462 件",4:"退貨率 1.9%",5:"本月結案 196 件"};
  var d=titles[t];
  return '<div class="topbar"><div class="htxt"><h2>'+d[0]+'</h2><p>'+d[1]+'</p></div>'+
    '<div class="pill"><span class="material-symbols-outlined" style="font-size:17px">bolt</span>'+pills[t]+'</div></div>';
}

/* ---------- SCREEN 0 : RMA 申請受理 ---------- */
function s0(){
  var kpis=[
    {icon:"receipt_long",lab:"本月受理件數",val:"218",unit:"件",dir:"up",tag:"較上月 +12"},
    {icon:"verified",lab:"保固內比例",val:"71.5",unit:"%",dir:"up",tag:"+3.1%"},
    {icon:"schedule",lab:"平均受理時效",val:"3.4",unit:"小時",dir:"down",tag:"-0.6 小時"},
    {icon:"warning",lab:"待補件申請",val:"9",unit:"件",dir:"flat",tag:"需客服跟催"}
  ];
  var rows=[
    ["RMA-2608-0451","AX-8800 智慧閘道器","O碩電子","保固內","開機無反應","高","待寄回"],
    ["RMA-2608-0450","TP-320 溫控模組","立群自動化","保固內","顯示異常","中","已收貨"],
    ["RMA-2608-0449","PW-15 電源供應器","O翔科技","逾保","風扇噪音","中","待報價"],
    ["RMA-2608-0448","SN-40 感測器","O銓機械","保固內","量測漂移","高","已受理"],
    ["RMA-2608-0447","AX-8800 智慧閘道器","O碩電子","保固內","網路斷線","中","待寄回"],
    ["RMA-2608-0446","MC-77 馬達控制器","群O工業","逾保","過熱保護","低","待補件"]
  ];
  var trb={"高":"b-bad","中":"b-warn","低":"b-mut"};
  var stb={"待寄回":"b-info","已收貨":"b-acc","待報價":"b-warn","已受理":"b-ok","待補件":"b-bad"};
  var tr=rows.map(function(r){
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+
      (r[3]==="逾保"?bd("b-mut","逾保"):bd("b-ok","保固內"))+'</td><td>'+r[4]+'</td><td>'+
      bd(trb[r[5]],r[5])+'</td><td>'+bd(stb[r[6]],r[6])+'</td></tr>';
  }).join("");

  var html=head(0)+
  '<div class="grid g4" style="margin-bottom:14px">'+kpis.map(kpiCard).join("")+'</div>'+
  '<div class="grid g23" style="margin-bottom:14px">'+
    '<div class="card"><div class="card-head"><h3>近 30 日申請受理趨勢</h3><span class="badge b-acc">保固內 vs 逾保</span></div>'+
      '<div class="chart-wrap" style="height:230px"><canvas id="c0a"></canvas></div></div>'+
    '<div class="card"><h3>渠道來源分佈</h3><p class="sub">本月 218 件 RMA 申請來源</p>'+
      '<div class="chart-wrap" style="height:210px"><canvas id="c0b"></canvas></div></div>'+
  '</div>'+
  '<div class="card" style="margin-bottom:14px"><div class="card-head"><h3>RMA 授權編號受理流程</h3><span class="badge b-acc">RULE-01 · 序號與保固期核對</span></div>'+
    '<div class="stepline">'+
      '<div class="step done"><span class="s-n">1</span>登錄申請</div><span class="step-sep"></span>'+
      '<div class="step done"><span class="s-n">2</span>序號核對</div><span class="step-sep"></span>'+
      '<div class="step now"><span class="s-n">3</span>保固判定</div><span class="step-sep"></span>'+
      '<div class="step"><span class="s-n">4</span>核發 RMA 編號</div><span class="step-sep"></span>'+
      '<div class="step"><span class="s-n">5</span>通知寄回</div>'+
    '</div>'+
    '<div class="grid g4" style="margin-top:14px">'+
      '<div class="field"><div class="f-l">產品序號</div><div class="f-v mono">AX8800-24J-01472</div></div>'+
      '<div class="field"><div class="f-l">購買日期</div><div class="f-v">2025-02-18</div></div>'+
      '<div class="field"><div class="f-l">保固到期</div><div class="f-v" style="color:var(--ok)">2027-02-18</div></div>'+
      '<div class="field"><div class="f-l">判定結果</div><div class="f-v" style="color:var(--accent)">保固內受理</div></div>'+
    '</div></div>'+
  '<div class="card"><div class="card-head"><h3>最新 RMA 申請</h3><span class="badge b-mut">共 218 件</span></div>'+
    '<div class="tbl-scroll"><table><thead><tr><th>RMA 編號</th><th>產品</th><th>客戶</th><th>保固</th><th>不良現象</th><th>優先</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
  screenEl.innerHTML=html;
  void screenEl.offsetHeight;
  mk("c0a",{type:"line",data:{labels:["8/1","8/5","8/9","8/13","8/17","8/21","8/25","8/29"],
    datasets:[
      {label:"保固內",data:[9,12,8,14,11,15,13,10],borderColor:TEAL,backgroundColor:"rgba(15,118,110,.10)",fill:true,tension:.35,borderWidth:2,pointRadius:0},
      {label:"逾保",data:[4,5,3,6,4,5,6,4],borderColor:"#94a3a0",backgroundColor:"rgba(148,163,160,.08)",fill:true,tension:.35,borderWidth:2,pointRadius:0}
    ]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom"}},scales:{x:{grid:{display:false}},y:{grid:{color:gridColor},beginAtZero:true}}}});
  mk("c0b",{type:"doughnut",data:{labels:["客服專線","經銷商","線上表單","業務轉入"],
    datasets:[{data:[86,64,48,20],backgroundColor:[TEAL,TEAL2,"#0891b2","#cbd5d1"],borderWidth:0}]},
    options:{maintainAspectRatio:false,responsive:true,cutout:"58%",plugins:{legend:{position:"right"}}}});
}

/* ---------- SCREEN 1 : 退貨檢驗判定 ---------- */
function s1(){
  var kpis=[
    {icon:"fact_check",lab:"待檢驗到貨",val:"34",unit:"件",dir:"flat",tag:"今日新增 11"},
    {icon:"task_alt",lab:"本月完檢",val:"182",unit:"件",dir:"up",tag:"+9.5%"},

var screens=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  (screens[i]||s0)();
}
var navEl=document.getElementById("nav");
navEl.addEventListener("click",function(e){
  var t=e.target;while(t&&t!==navEl&&!t.hasAttribute("data-i")){t=t.parentNode;}
  if(t&&t.hasAttribute("data-i")){location.hash="v"+t.getAttribute("data-i");}
});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
