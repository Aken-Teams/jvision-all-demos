<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../../favicon.svg"/>
<title>員工留任與離職預警系統（AI Attrition Prediction）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--card:#ffffff;--line:#e2e8f0;--txt:#1e293b;--mut:#64748b;--ok:#059669;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;vertical-align:middle;}
.wrap{display:flex;min-height:100vh;align-items:stretch;}
.side{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand .logo{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;font-weight:700;line-height:1.25;}
.brand p{font-size:11px;color:var(--mut);margin-top:2px;}
.navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;border:none;background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;text-align:left;width:100%;min-width:0;transition:.15s;}
.navbtn:hover{background:var(--bg);color:var(--accent);}
.navbtn.on{background:var(--accent);color:#fff;}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navidx{margin-left:auto;font-size:11px;opacity:.55;flex:0 0 auto;}
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.head{margin-bottom:22px;}
.head h2{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;}
.head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.head p{color:var(--mut);font-size:13.5px;margin-top:5px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0;}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.kpi .lbl{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;}
.kpi .lbl .material-symbols-outlined{font-size:18px;}
.kpi .val{font-size:29px;font-weight:700;margin:8px 0 3px;letter-spacing:-.5px;}
.kpi .sub{font-size:11.5px;color:var(--mut);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;}
.c-bad{background:#fef2f2;color:var(--bad);}
.c-warn{background:#fffbeb;color:var(--warn);}
.c-ok{background:#ecfdf5;color:var(--ok);}
.c-info{background:#eef2ff;color:#4f46e5;}
.c-mut{background:#f1f5f9;color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11.5px;letter-spacing:.4px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.tovf{overflow-x:auto;}
.chartbox{position:relative;width:100%;overflow:hidden;}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto;}
.risk-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
.col{background:var(--bg);border-radius:12px;padding:12px;min-width:0;}
.col>.ch{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;color:var(--txt);}
.col .cnt{background:#fff;border-radius:20px;font-size:11px;padding:1px 9px;color:var(--mut);border:1px solid var(--line);}
.ticket{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px;font-size:12.5px;border-left:3px solid var(--accent2);}
.ticket .tt{font-weight:600;margin-bottom:5px;}
.ticket .tm{color:var(--mut);font-size:11.5px;display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px;}
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px 0;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev:before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line);}
.tl .ev .et{font-weight:600;font-size:13px;}
.tl .ev .ed{color:var(--mut);font-size:12px;margin-top:2px;}
.tl .ev .ex{font-size:11px;color:var(--accent2);margin-top:3px;}
.mrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.mrow:last-child{border-bottom:none;}
.mrow .mn{font-weight:600;font-size:13px;}
.mrow .md{font-size:11.5px;color:var(--mut);}
.gauge{text-align:center;padding:6px 0;}
.gauge .gv{font-size:34px;font-weight:700;color:var(--accent);}
.gauge .gl{font-size:12px;color:var(--mut);margin-top:2px;}
.feat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.feat:last-child{border-bottom:none;}
.feat .fn{font-size:13px;font-weight:500;flex:0 0 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.feat .fb{flex:1;min-width:0;}
.feat .fv{font-size:12px;font-weight:600;color:var(--accent);flex:0 0 44px;text-align:right;}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;}
.leg span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
@media(max-width:860px){
.wrap{flex-direction:column;}
.side{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px;gap:6px;align-items:center;}
.brand{border-bottom:none;padding:0 12px 0 4px;margin:0;flex:0 0 auto;}
.navbtn{width:auto;padding:9px 12px;}
.navidx{display:none;}
.main{padding:20px 16px 50px;}
}
@media(max-width:820px){
.g4,.g3,.g2,.g21{grid-template-columns:1fr;}
.board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
.navbtn .nt{display:none;}
.navbtn{padding:9px;}
.board{grid-template-columns:1fr;}
.head h2{font-size:19px;}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div>
        <h1>留任預警系統</h1>
        <p>AI Attrition Prediction</p>
      </div>
    </div>
    <button class="navbtn" data-i="0"><span class="material-symbols-outlined">monitoring</span><span class="nt">留任風險總覽</span><span class="navidx">01</span></button>
    <button class="navbtn" data-i="1"><span class="material-symbols-outlined">insights</span><span class="nt">AI 風險評分模型</span><span class="navidx">02</span></button>
    <button class="navbtn" data-i="2"><span class="material-symbols-outlined">warning</span><span class="nt">高風險預警名單</span><span class="navidx">03</span></button>
    <button class="navbtn" data-i="3"><span class="material-symbols-outlined">groups</span><span class="nt">一對一面談管理</span><span class="navidx">04</span></button>
    <button class="navbtn" data-i="4"><span class="material-symbols-outlined">task_alt</span><span class="nt">留才措施執行</span><span class="navidx">05</span></button>
    <button class="navbtn" data-i="5"><span class="material-symbols-outlined">trending_up</span><span class="nt">成效追蹤分析</span><span class="navidx">06</span></button>
  </nav>
  <main class="main" id="app"></main>
</div>
<script>
var CH={};
function destroyAll(){for(var k in CH){if(CH[k]){try{CH[k].destroy();}catch(e){}CH[k]=null;}}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(CH[id]){try{CH[id].destroy();}catch(e){}}CH[id]=new Chart(el,cfg);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function riskChip(r){if(r>=80)return'<span class="chip c-bad">極高 '+r+'</span>';if(r>=60)return'<span class="chip c-warn">高 '+r+'</span>';if(r>=40)return'<span class="chip c-info">中 '+r+'</span>';return'<span class="chip c-ok">低 '+r+'</span>';}
function riskColor(r){if(r>=80)return'#dc2626';if(r>=60)return'#d97706';if(r>=40)return'#4f46e5';return'#059669';}

var EMP=[
 {id:"E-2041",name:"陳美玲",dept:"沖壓一課",role:"作業員",tenure:1.2,risk:88,driver:"連續加班+薪資落後"},
 {id:"E-1830",name:"林建宏",dept:"組裝二課",role:"領班",tenure:0.8,risk:83,driver:"晉升停滯"},
 {id:"E-2277",name:"黃雅婷",dept:"品保課",role:"檢驗員",tenure:2.1,risk:76,driver:"夜班比例過高"},
 {id:"E-1502",name:"吳志豪",dept:"沖壓一課",role:"作業員",tenure:0.6,risk:72,driver:"新人適應不良"},
 {id:"E-2015",name:"張淑芬",dept:"包裝課",role:"作業員",tenure:3.4,risk:64,driver:"通勤距離增加"},
 {id:"E-1988",name:"劉家豪",dept:"組裝二課",role:"作業員",tenure:1.9,risk:58,driver:"績效評等下滑"},
 {id:"E-2130",name:"鄭怡君",dept:"品保課",role:"檢驗員",tenure:5.2,risk:41,driver:"薪資略低於市場"},
 {id:"E-1745",name:"謝俊傑",dept:"物流課",role:"堆高機手",tenure:4.0,risk:33,driver:"—"}
];

function show(i){
  destroyAll();
  var app=document.getElementById("app");
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var fn=[s0,s1,s2,s3,s4,s5][i]||s0;
  app.innerHTML=fn();
  void app.offsetHeight;
  var cc=[c0,c1,c2,c3,c4,c5][i];
  if(cc)cc();
}

function kpi(ic,l,v,s,c){return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+esc(l)+'</div><div class="val">'+esc(v)+'</div><div class="sub"><span class="chip '+c+'">'+esc(s)+'</span></div></div>';}

/* ---------- Screen 0 : 留任風險總覽 ---------- */
function s0(){
  return ''+
  '<div class="head"><h2><span class="material-symbols-outlined">monitoring</span>留任風險總覽</h2><p>全廠離職風險指標、部門分佈與六個月流動率趨勢</p></div>'+
  '<div class="grid g4">'+
    kpi("groups","在職員工","1,284","本月異動 -12 人","c-mut")+
    kpi("warning","高風險員工","47","佔比 3.7%（+5）","c-bad")+
    kpi("trending_down","年化流動率","14.8%","較上季 -2.3%","c-ok")+
    kpi("verified","模型準確率","91.2%","近 90 日回測","c-info")+
  '</div>'+
  '<div class="grid g21" style="margin-top:16px;">'+
    '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近六月流動率與高風險人數趨勢</h3><div class="chartbox" style="height:270px"><canvas id="c0trend"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>風險等級分佈</h3><div class="chartbox" style="height:200px"><canvas id="c0donut"></canvas></div>'+
      '<div class="leg"><span><i class="dot" style="background:#dc2626"></i>極高 47</span><span><i class="dot" style="background:#d97706"></i>高 118</span><span><i class="dot" style="background:#4f46e5"></i>中 246</span><span><i class="dot" style="background:#059669"></i>低 873</span></div>'+
    '</div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:16px;">'+
    '<div class="card"><h3><span class="material-symbols-outlined">factory</span>各部門風險指數</h3><div class="chartbox" style="height:250px"><canvas id="c0dept"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">priority_high</span>今日待處理示警</h3>'+
      alertRow("沖壓一課 陳美玲 風險升至 88","2 分鐘前","c-bad")+
      alertRow("組裝二課 林建宏 提出調薪未果","1 小時前","c-warn")+
      alertRow("品保課 3 名夜班檢驗員風險同步上升","3 小時前","c-warn")+
      alertRow("包裝課 留才面談逾期未安排","今日","c-info")+
    '</div>'+
  '</div>';
}
function alertRow(t,tm,c){return '<div class="mrow"><span class="chip '+c+'" style="flex:0 0 auto"><span class="material-symbols-outlined" style="font-size:15px">notifications_active</span></span><div style="flex:1;min-width:0"><div class="mn">'+esc(t)+'</div><div class="md">'+esc(tm)+'</div></div></div>';}
function c0(){
  mk("c0trend",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
    {label:"流動率%",data:[19.1,18.4,17.6,16.2,15.5,14.8],borderColor:"#334155",backgroundColor:"rgba(51,65,85,.08)",fill:true,tension:.35,yAxisID:"y"},
    {label:"高風險人數",data:[62,58,55,51,49,47],borderColor:"#dc2626",backgroundColor:"rgba(220,38,38,.05)",tension:.35,yAxisID:"y1"}
  ]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom"}},scales:{y:{position:"left",grid:{color:"#eef2f7"}},y1:{position:"right",grid:{drawOnChartArea:false}}}}});
  mk("c0donut",{type:"doughnut",data:{labels:["極高","高","中","低"],datasets:[{data:[47,118,246,873],backgroundColor:["#dc2626","#d97706","#4f46e5","#059669"],borderWidth:2,borderColor:"#fff"}]},options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{display:false}}}});
  mk("c0dept",{type:"bar",data:{labels:["沖壓一課","組裝二課","品保課","包裝課","物流課","塗裝課"],datasets:[{label:"風險指數",data:[74,68,61,52,38,44],backgroundColor:["#dc2626","#d97706","#d97706","#4f46e5","#059669","#4f46e5"],borderRadius:6}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,grid:{color:"#eef2f7"}}}}});
}

/* ---------- Screen 1 : AI 風險評分模型 ---------- */
function s1(){
  var feats=[
   {n:"月加班時數",w:0.24},{n:"薪資市場落差",w:0.19},{n:"晉升停滯月數",w:0.16},
   {n:"夜班比例",w:0.13},{n:"績效評等變化",w:0.11},{n:"通勤距離",w:0.09},{n:"到職年資",w:0.08}
  ];
  var fh='';for(var i=0;i<feats.length;i++){var pct=Math.round(feats[i].w*100);fh+='<div class="feat"><div class="fn">'+esc(feats[i].n)+'</div><div class="fb"><div class="bar"><i style="width:'+(pct*4)+'%;background:linear-gradient(90deg,#334155,#64748b)"></i></div></div><div class="fv">'+pct+'%</div></div>';}
  return ''+
  '<div class="head"><h2><span class="material-symbols-outlined">insights</span>AI 風險評分模型</h2><p>特徵權重、模型效能與單一員工風險分數拆解</p></div>'+
  '<div class="grid g3">'+
    '<div class="card gauge"><div class="gv">0.912</div><div class="gl">AUC 曲線下面積</div></div>'+
    '<div class="card gauge"><div class="gv">88.6%</div><div class="gl">精確率 Precision</div></div>'+
    '<div class="card gauge"><div class="gv">84.1%</div><div class="gl">召回率 Recall</div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:16px;">'+
    '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>特徵重要度（SHAP 權重）</h3>'+fh+'</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">radar</span>陳美玲（E-2041）風險因子雷達</h3><div class="chartbox" style="height:300px"><canvas id="c1radar"></canvas></div></div>'+
  '</div>'+
  '<div class="grid g21" style="margin-top:16px;">'+
    '<div class="card"><h3><span class="material-symbols-outlined">scatter_plot</span>風險分數 vs 年資分佈</h3><div class="chartbox" style="height:260px"><canvas id="c1scatter"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">tune</span>模型版本</h3>'+
      verRow("v3.2","上線中","2026-08-01","AUC 0.912","c-ok")+
      verRow("v3.1","已下線","2026-06-15","AUC 0.897","c-mut")+
      verRow("v3.0","已下線","2026-04-02","AUC 0.881","c-mut")+
      '<div style="margin-top:12px;font-size:12px;color:var(--mut)">下次重訓：<b style="color:var(--txt)">2026-09-01</b>　樣本 12,840 筆</div>'+
    '</div>'+
  '</div>';
}
function verRow(v,st,d,a,c){return '<div class="mrow"><div style="flex:1;min-width:0"><div class="mn">模型 '+v+' <span class="chip '+c+'">'+st+'</span></div><div class="md">'+d+'　'+a+'</div></div></div>';}
function c1(){
  mk("c1radar",{type:"radar",data:{labels:["加班時數","薪資落差","晉升停滯","夜班比例","績效變化","通勤距離"],datasets:[
    {label:"該員工",data:[92,85,70,78,55,40],borderColor:"#dc2626",backgroundColor:"rgba(220,38,38,.18)",pointBackgroundColor:"#dc2626"},
    {label:"部門平均",data:[55,60,45,50,48,42],borderColor:"#64748b",backgroundColor:"rgba(100,116,139,.12)",pointBackgroundColor:"#64748b"}
  ]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom"}},scales:{r:{beginAtZero:true,max:100,ticks:{display:false}}}}});
  var pts=[];for(var i=0;i<EMP.length;i++){pts.push({x:EMP[i].tenure,y:EMP[i].risk});}
  mk("c1scatter",{type:"scatter",data:{datasets:[{label:"員工",data:pts,pointRadius:7,pointHoverRadius:9,backgroundColor:pts.map(function(p){return riskColor(p.y);})}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return "年資 "+c.raw.x+" 年 / 風險 "+c.raw.y;}}}},scales:{x:{title:{display:true,text:"到職年資（年）"},grid:{color:"#eef2f7"}},y:{title:{display:true,text:"風險分數"},max:100,grid:{color:"#eef2f7"}}}}});
}

/* ---------- Screen 2 : 高風險預警名單 ---------- */
function s2(){
  var rows='';for(var i=0;i<EMP.length;i++){var e=EMP[i];
    rows+='<tr>'+
