<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--color-foreground);font-family:"Crimson Pro",serif;font-size:17px;line-height:1.45}
button{font:inherit}
button,.navbtn{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:1.25rem;line-height:1;vertical-align:middle}
.skip{position:fixed;left:12px;top:-60px;z-index:99;background:var(--color-accent);color:var(--color-on-accent);padding:10px 14px;border:2px solid var(--ink);font-weight:600}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.wrap{display:flex;min-height:100vh}
.side{position:sticky;top:0;width:264px;height:100vh;flex:0 0 264px;overflow-y:auto;background:var(--color-card);border-right:2px solid var(--color-border);padding:22px 14px;display:flex;flex-direction:column;gap:5px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;margin-bottom:12px;border-bottom:2px solid var(--color-border)}
.logo{width:44px;height:44px;display:grid;place-items:center;flex:0 0 44px;background:var(--color-primary);color:#fff;border:2px solid var(--ink);border-radius:10px}
.logo .material-symbols-outlined{font-size:25px}
.brand h1{margin:0;font-family:"Cinzel","Crimson Pro",serif;font-size:15px;line-height:1.25;letter-spacing:.02em}
.brand p{margin:3px 0 0;color:var(--color-muted-foreground);font-size:12px}
.navbtn{width:100%;min-height:46px;border:2px solid transparent;border-radius:8px;background:transparent;color:var(--color-muted-foreground);display:flex;align-items:center;gap:11px;padding:10px 11px;text-align:left;font-size:15px;font-weight:600;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.navbtn:hover{background:var(--color-muted);border-color:var(--color-border);color:var(--color-foreground)}
.navbtn.on{background:var(--color-primary);border-color:var(--ink);color:#fff}
.navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navidx{margin-left:auto;font-family:"Cinzel",serif;font-size:10px;letter-spacing:.08em;opacity:.8}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,44px) 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--color-border)}
.head h2{display:flex;align-items:center;gap:10px;margin:0;font-family:"Cinzel","Crimson Pro",serif;font-size:clamp(22px,2.4vw,30px);line-height:1.2;letter-spacing:.01em}
.head h2 .material-symbols-outlined{width:36px;height:36px;display:grid;place-items:center;background:var(--color-secondary);border:2px solid var(--ink);border-radius:8px;color:var(--color-on-secondary)}
.head p{max-width:620px;margin:6px 0 0;color:var(--color-muted-foreground);font-size:15px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.card{min-width:0;background:var(--color-card);border:2px solid var(--color-border);border-radius:10px;padding:17px;transition:border-color .18s ease,background-color .18s ease}
.card:hover{border-color:var(--color-primary)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-family:"Cinzel","Crimson Pro",serif;font-size:14px;font-weight:600;letter-spacing:.02em}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.kpi{position:relative;border-top:5px solid var(--color-primary)}
.kpi .lbl{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground);font-size:14px;font-weight:600}
.kpi .val,.gauge .gv{margin:8px 0 3px;font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .sub,.gauge .gl{color:var(--color-muted-foreground);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:25px;padding:3px 9px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap}
.c-bad{background:#FEF2F2;color:var(--bad)}
.c-warn{background:#FFFBEB;color:var(--warn)}
.c-ok{background:#ECFDF5;color:var(--ok)}
.c-info{background:#EFF6FF;color:var(--info)}
.c-mut{background:var(--color-muted);color:var(--color-muted-foreground)}
.chartbox{position:relative;width:100%;overflow:hidden}
.tovf{overflow-x:auto;scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
th{padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--color-muted);color:var(--color-foreground);font-size:12px;font-weight:600;letter-spacing:.04em;text-align:left;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--color-border);white-space:nowrap}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
td:nth-last-child(1),td.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.bar{height:8px;min-width:60px;overflow:hidden;background:var(--color-muted);border:1px solid var(--color-border);border-radius:3px}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.avatar{width:31px;height:31px;display:inline-grid;place-items:center;flex:0 0 auto;background:var(--color-primary);border:2px solid currentColor;border-radius:50%;color:#fff;font-weight:600}
.risk-dot,.dot{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-radius:2px}
.risk-dot{margin-right:6px}
.leg{display:flex;flex-wrap:wrap;gap:9px 15px;margin-top:10px;color:var(--color-muted-foreground);font-size:13px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}
.col{min-width:0;padding:11px;background:var(--color-muted);border:1px solid var(--color-border);border-radius:8px}
.col>.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.cnt{padding:1px 8px;background:#fff;border:1px solid var(--color-border);border-radius:999px;font-family:ui-monospace,monospace;font-size:12px}
.ticket{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--color-border);border-left:4px solid var(--color-primary);border-radius:6px;font-size:14px}
.ticket .tt{font-weight:600}
.ticket .tm{display:flex;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-size:12px}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:2px;background:var(--color-border)}
.ev{position:relative;padding-bottom:18px}
.ev:last-child{padding-bottom:0}
.ev:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;background:var(--color-primary);border:3px solid #fff;outline:2px solid var(--color-primary);border-radius:50%}
.et{font-weight:600}
.ed{margin-top:2px;color:var(--color-muted-foreground);font-size:14px}
.ex{margin-top:3px;color:#0F766E;font-size:13px;font-weight:600}
.mrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--color-border)}
.mrow:last-child{border-bottom:0}
.mn{font-weight:600}
.md{color:var(--color-muted-foreground);font-size:13px}
.gauge{text-align:center;border-top:5px solid var(--color-accent)}
.gauge .gv{color:var(--color-primary);font-size:39px}
.feat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-border)}
.feat:last-child{border-bottom:0}
.fn{width:126px;flex:0 0 126px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fb{flex:1;min-width:0}
.fv{width:46px;flex:0 0 46px;color:var(--color-primary);font-family:ui-monospace,monospace;font-size:13px;font-weight:700;text-align:right}
.grid-item{animation:enter .4s both cubic-bezier(.2,.85,.35,1.25)}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .wrap{display:block}
  .side{position:sticky;z-index:20;width:100%;height:auto;overflow-x:auto;flex-direction:row;align-items:center;padding:10px;border-right:0;border-bottom:2px solid var(--color-border)}
  .brand{min-width:max-content;margin:0 8px 0 0;padding:0 14px 0 2px;border:0;border-right:2px solid var(--color-border)}
  .brand .logo{width:38px;height:38px;flex-basis:38px}
  .navbtn{width:auto;min-width:46px}
  .navidx{display:none}
  .main{padding:22px 16px 50px}
  .g3,.g2,.g21{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand h1,.brand p,.navbtn .nt{display:none}
  .brand{padding-right:9px}
  .navbtn{padding:9px;justify-content:center}
  .head{display:block}
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .card{padding:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>

<script>
var CH={};
var C={primary:"#0D9488",secondary:"#2DD4BF",accent:"#D97706",bad:"#DC2626",warn:"#B45309",ok:"#047857",info:"#1D4ED8",muted:"#64748B",grid:"#CCFBF1",card:"#FFFFFF"};
Chart.defaults.color="#475569";
Chart.defaults.font.family='"Crimson Pro",serif';
Chart.defaults.borderColor=C.grid;
function destroyAll(){for(var k in CH){if(CH[k]){try{CH[k].destroy()}catch(e){}CH[k]=null}}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(CH[id])try{CH[id].destroy()}catch(e){}CH[id]=new Chart(el,cfg)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function riskChip(r){if(r>=80)return'<span class="chip c-bad"><span class="material-symbols-outlined" aria-hidden="true">crisis_alert</span>極高 '+r+'</span>';if(r>=60)return'<span class="chip c-warn"><span class="material-symbols-outlined" aria-hidden="true">warning</span>高 '+r+'</span>';if(r>=40)return'<span class="chip c-info"><span class="material-symbols-outlined" aria-hidden="true">visibility</span>中 '+r+'</span>';return'<span class="chip c-ok"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span>低 '+r+'</span>'}
function riskColor(r){return r>=80?C.bad:r>=60?C.warn:r>=40?C.info:C.ok}
var EMP=[
{id:"E-2041",name:"陳美玲",dept:"沖壓一課",role:"作業員",tenure:1.2,risk:88,driver:"連續加班+薪資落後"},

{id:"E-2130",name:"鄭怡君",dept:"品保課",role:"檢驗員",tenure:5.2,risk:41,driver:"薪資略低於市場"},
{id:"E-1745",name:"謝俊傑",dept:"物流課",role:"堆高機手",tenure:4,risk:33,driver:"—"}];
function icon(n){return'<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
function head(ic,t,p){return'<div class="head"><div><h2>'+icon(ic)+t+'</h2><p>'+p+"</p></div></div>"}
function kpi(ic,l,v,s,c){return'<div class="card kpi grid-item"><div class="lbl">'+icon(ic)+esc(l)+'</div><div class="val">'+esc(v)+'</div><div class="sub"><span class="chip '+c+'">'+esc(s)+"</span></div></div>"}
function card(t,ic,x){return'<section class="card grid-item"><h3>'+icon(ic)+t+"</h3>"+x+"</section>"}
function canvas(id,h){return'<div class="chartbox" style="height:'+h+'px"><canvas id="'+id+'" role="img" aria-label="資料圖表"></canvas></div>'}
function show(i){
 destroyAll();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){var on=+btns[b].dataset.i===i;btns[b].classList.toggle("on",on);btns[b].setAttribute("aria-current",on?"page":"false")}
 document.getElementById("app").innerHTML=([s0,s1,s2,s3,s4,s5][i]||s0)();
 var cc=[c0,c1,c2,c3,c4,c5][i];if(cc)cc()
}

function c0(){
 mk("c0trend",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"流動率%",data:[19.1,18.4,17.6,16.2,15.5,14.8],borderColor:C.primary,backgroundColor:"#CCFBF1",fill:true,tension:.35,yAxisID:"y"},{label:"高風險人數",data:[62,58,55,51,49,47],borderColor:C.bad,backgroundColor:"#FEE2E2",tension:.35,yAxisID:"y1"}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{position:"left"},y1:{position:"right",grid:{drawOnChartArea:false}}}}});

function s1(){
 var feats=[["月加班時數",24],["薪資市場落差",19],["晉升停滯月數",16],["夜班比例",13],["績效評等變化",11],["通勤距離",9],["到職年資",8]],fh="";

 return head("insights","AI 風險評分模型","特徵權重、模型效能與單一員工風險分數拆解")+
