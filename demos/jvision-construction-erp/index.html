<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>營建工程 ERP｜Jvision 系統 Demo</title>
  <meta name="description" content="專案、採購用料、出工日報、估驗計價、合約成本與品質缺失一體的營建營運中樞" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#1d4ed8; --accent2:#60a5fa; --accent-soft:#eff4ff;
      --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
      --line:#e6ebf3; --bg:#f4f6fb; --card:#ffffff;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
      --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    /* ===== Top nav ===== */
    header.top{
      position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92);
      backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    }
    .topbar{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none;}
    .brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(29,78,216,.35);}
    .brand .logo .msi{font-size:22px}
    .brand b{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
    .brand small{display:block;color:var(--ink3);font-size:11px;font-weight:600;white-space:nowrap}
    nav.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
    nav.tabs button{
      flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
      border:1px solid var(--line);background:#fff;color:var(--ink2);
      padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
      transition:.15s;
    }
    nav.tabs button .msi{font-size:19px;color:var(--ink3)}
    nav.tabs button:hover{border-color:var(--accent2);color:var(--accent)}
    nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.28)}
    nav.tabs button.active .msi{color:#fff}
    .env{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px;font-weight:600}
    .env .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);animation:pulse 2.4s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    /* ===== Layout ===== */
    main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
    .scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .scr-head h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
    .scr-head h1 .msi{color:var(--accent);font-size:26px}
    .scr-head p{margin:4px 0 0;color:var(--ink2);font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
    .pill .msi{font-size:15px}
    .pill.blue{background:var(--accent-soft);color:var(--accent)}
    .pill.ok{background:#e9f7ef;color:var(--ok)}
    .pill.warn{background:#fdf1e1;color:var(--warn)}
    .pill.bad{background:#fdeaea;color:var(--bad)}
    .pill.grey{background:#eef1f6;color:var(--ink2)}
    /* grids */
    .grid{display:grid;gap:16px}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g-2-1{grid-template-columns:2fr 1fr}
    .g-1-2{grid-template-columns:1fr 2fr}
    .g-3-2{grid-template-columns:3fr 2fr}
    @media(max-width:820px){
      .g4,.g3,.g2,.g-2-1,.g-1-2,.g-3-2{grid-template-columns:1fr}
    }
    .grid>*{min-width:0}
    /* cards */
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
    .card.pad{padding:16px 18px}
    .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .card-h h3{margin:0;font-size:14px;font-weight:800}
    .card-h .sub{color:var(--ink3);font-size:12px;font-weight:600}
    /* KPI */
    .kpi{padding:16px 18px;position:relative;overflow:hidden}
    .kpi .kh{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;font-weight:700}
    .kpi .kh .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
    .kpi .kh .ic .msi{font-size:18px}
    .kpi .v{font-size:27px;font-weight:900;margin-top:10px;letter-spacing:.3px}
    .kpi .v small{font-size:13px;font-weight:700;color:var(--ink3);margin-left:3px}
    .kpi .d{margin-top:6px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
    .kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--bad)} .kpi .d.flat{color:var(--ink3)}
    .kpi .d .msi{font-size:15px}
    .kpi .spark{position:absolute;right:-6px;bottom:-6px;opacity:.12;color:var(--accent);font-size:74px}
    /* tables */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{color:var(--ink3);font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:#fafbfe}
    tbody tr:hover{background:#f7f9fd}
    td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
    .bar{height:7px;border-radius:5px;background:#eef1f7;overflow:hidden;min-width:70px}
    .bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:800}
    .tag.ok{background:#e9f7ef;color:var(--ok)} .tag.warn{background:#fdf1e1;color:var(--warn)}
    .tag.bad{background:#fdeaea;color:var(--bad)} .tag.info{background:var(--accent-soft);color:var(--accent)} .tag.grey{background:#eef1f6;color:var(--ink2)}
    .avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
    /* gantt */
    .gantt{width:100%;font-size:12px}
    .gantt .gr{display:grid;grid-template-columns:170px 1fr;align-items:center;border-bottom:1px solid var(--line)}
    .gantt .gname{padding:9px 12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gantt .gtrack{position:relative;height:38px}
    .gantt .gmonths{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:2px solid var(--line)}
    .gantt .gmonths span{padding:8px 4px;font-size:11px;font-weight:800;color:var(--ink3);text-align:center;border-left:1px solid var(--line)}
    .gantt .gtrack .gbar{position:absolute;top:9px;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 8px;color:#fff;font-size:10.5px;font-weight:800;overflow:hidden;box-shadow:0 3px 8px rgba(29,78,216,.28)}
    .gantt .gtrack .gbar.done{background:linear-gradient(90deg,#16a34a,#4ade80);box-shadow:0 3px 8px rgba(22,163,74,.25)}
    .gantt .gtrack .gbar.risk{background:linear-gradient(90deg,#d97706,#fbbf24);box-shadow:0 3px 8px rgba(217,119,6,.25)}
    .gantt .gtrack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--line) calc(12.5% - 1px),var(--line) 12.5%)}
    /* daily report board */
    .crew{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:820px){.crew{grid-template-columns:1fr}}
    .crew>*{min-width:0}
    .crewcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
    .crewcard .ch{padding:11px 14px;background:linear-gradient(135deg,#eff4ff,#f8fbff);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .crewcard .ch b{font-size:13.5px}
    .crewcard .cb{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
    .rowb{display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
    .rowb .lbl{color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
    .rowb .lbl .msi{font-size:16px;color:var(--accent)}
    .rowb b{font-variant-numeric:tabular-nums}
    /* valuation */
    .money{font-variant-numeric:tabular-nums;font-weight:800}
    .prog-lg{height:10px;border-radius:6px;background:#eef1f7;overflow:hidden}
    .prog-lg>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    /* cost matrix */
    .matrix td.b{font-weight:700}
    .over{color:var(--bad);font-weight:800}
    .under{color:var(--ok);font-weight:800}
    /* defect board (kanban) */
    .kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    @media(max-width:820px){.kb{grid-template-columns:1fr}}
    .kb>*{min-width:0}
    .kcol{background:#f7f9fd;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
    .kcol .kh2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:13px}
    .kcol .cnt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:11.5px;color:var(--ink2)}
    .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .kcard:last-child{margin-bottom:0}
    .kcard .kt{font-weight:800;font-size:12.5px;margin-bottom:5px}
    .kcard .km{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .kcard .kbar{margin-top:9px;height:5px;border-radius:4px;background:#eef1f7;overflow:hidden}
    .kcard .kbar>i{display:block;height:100%;border-radius:4px}
    .lbar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:14px 0 0 14px}
    /* misc */
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);font-weight:600}
    .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
    .miles{display:flex;flex-direction:column;gap:0}
    .mile{display:flex;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line);position:relative}
    .mile:last-child{border-bottom:0}
    .mile .mk{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800}
    .mile .mk .msi{font-size:18px}
    .mile .mi b{font-size:13px}
    .mile .mi span{display:block;color:var(--ink3);font-size:11.5px;font-weight:600;margin-top:1px}
    .chartbox{width:100%}
    .foot{margin-top:26px;text-align:center;color:var(--ink3);font-size:11.5px}
    .scroll{overflow-x:auto}
    @media(max-width:560px){
      nav.tabs button .lab{display:none}
      nav.tabs button{padding:8px 11px}
      .env{display:none}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><span class="msi">architecture</span></div>
        <div><b>營建工程 ERP</b><small>Jvision Construction ERP</small></div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="env"><span class="dot"></span> 正式環境 · 城中段捷運聯開案</div>
    </div>
  </header>
  <main><div id="view"></div>
    <div class="foot">Jvision 營建工程 ERP · 純前端展示原型 · 資料為模擬示意</div>
  </main>

  <script>
  "use strict";
  /* ---------- helpers ---------- */
  function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
  function nf(n){try{return (n||0).toLocaleString("en-US");}catch(e){return String(n);}}
  function avatarColor(s){var c=["#1d4ed8","#0891b2","#7c3aed","#c026d3","#db2777","#ea580c","#16a34a","#0d9488"];var h=0;s=s||"";for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return c[h%c.length];}
  function AV(name){name=name||"？";return '<span class="avatar" style="background:'+avatarColor(name)+'">'+name.slice(0,1)+'</span>';}

  /* ---------- nav config ---------- */
  var NAV=[
    {icon:"architecture",label:"專案總覽"},
    {icon:"local_shipping",label:"採購用料"},
    {icon:"engineering",label:"出工日報"},
    {icon:"request_quote",label:"估驗計價"},
    {icon:"savings",label:"成本控管"},
    {icon:"fact_check",label:"品質缺失"}
  ];

  var view=document.getElementById("view");
  var chart=null; // single apexcharts instance holder per screen render

  function destroyChart(){ if(chart){try{chart.destroy();}catch(e){} chart=null;} }

  /* ================= SCREEN 0 : 專案工程總覽 ================= */
  function screen0(){
    var kpis=[
      {ic:"foundation",lab:"進行中專案",v:"14",u:"案",d:"+2 本季",dir:"up"},
      {ic:"trending_up",lab:"整體工程進度",v:"63.4",u:"%",d:"+4.1% 本月",dir:"up"},
      {ic:"warning",lab:"進度落後工項",v:"9",u:"項",d:"-3 已改善",dir:"up"},
      {ic:"payments",lab:"累計已計價",v:"7.42",u:"億",d:"契約 11.8 億",dir:"flat"}
    ];
    var projects=[
      {name:"城中段捷運聯開案",pm:"陳建豪",prog:72,due:"2026-11-30",st:"ok",budget:"3.8億"},
      {name:"民生河濱住宅新建",pm:"林雅琪",prog:58,due:"2027-03-15",st:"ok",budget:"2.1億"},
      {name:"科技園區廠辦大樓",pm:"王志明",prog:41,due:"2027-06-30",st:"warn",budget:"2.6億"},
      {name:"高鐵特定區道路工程",pm:"張惠雯",prog:88,due:"2026-09-20",st:"ok",budget:"9,400萬"},
      {name:"污水處理廠擴建",pm:"黃國榮",prog:33,due:"2027-09-30",st:"bad",budget:"1.5億"},
      {name:"校園活動中心改建",pm:"李佩珊",prog:95,due:"2026-08-31",st:"ok",budget:"6,200萬"}
    ];
    var miles=[
      {mk:"done",ic:"check",t:"城中段 B1 結構體完成",s:"2026-08-02 · 陳建豪"},
      {mk:"now",ic:"bolt",t:"民生河濱 3F 樓版澆置",s:"2026-08-14 · 進行中"},
      {mk:"warn",ic:"schedule",t:"科技園區 帷幕試裝",s:"2026-08-22 · 落後 4 天"},
      {mk:"plan",ic:"flag",t:"污水廠 機電管線進場",s:"2026-09-05 · 待採購到料"}
    ];
    var stColor={ok:"tag ok",warn:"tag warn",bad:"tag bad"};
    var stText={ok:"如期",warn:"注意",bad:"落後"};

    var root=el('<div></div>');
    root.appendChild(el(
      '<div class="scr-head"><div>'+
      '<h1><span class="msi">architecture</span> 專案工程總覽</h1>'+
      '<p>跨工地進度、里程碑與甘特排程一頁掌握 · 資料截至 2026-08-13</p></div>'+
      '<span class="pill blue"><span class="msi">update</span> 6 座工地 · 14 案在建</span></div>'
    ));
    var kg=el('<div class="grid g4" style="margin-bottom:16px"></div>');
    kpis.forEach(function(k){
      kg.appendChild(el(
        '<div class="card kpi"><div class="kh"><span class="ic"><span class="msi">'+k.ic+'</span></span>'+k.lab+'</div>'+
        '<div class="v">'+k.v+'<small>'+k.u+'</small></div>'+
        '<div class="d '+k.dir+'"><span class="msi">'+(k.dir==="up"?"arrow_upward":k.dir==="down"?"arrow_downward":"remove")+'</span>'+k.d+'</div>'+
        '<span class="msi spark">'+k.ic+'</span></div>'
      ));
    });
    root.appendChild(kg);

    var mid=el('<div class="grid g-2-1" style="margin-bottom:16px"></div>');
    // gantt signature
    var gwrap=el('<div class="card pad"></div>');
    gwrap.appendChild(el('<div class="card-h"><h3>工程甘特排程</h3><span class="sub">2026 Q3 – 2027 Q2</span></div>'));
    var gscroll=el('<div class="scroll"></div>');
    var gant=el('<div class="gantt" style="min-width:640px"></div>');
    gant.appendChild(el('<div class="gr"><div class="gname" style="color:#94a3b8;font-size:11px">工項 / 月份</div>'+
      '<div class="gmonths"><span>7月</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span><span>1月</span><span>2月</span></div></div>'));
    var gdata=[
      {n:"基礎與地下結構",s:0,w:2.5,cls:"done",p:"100%"},
      {n:"地上結構工程",s:1.5,w:3,cls:"",p:"72%"},
      {n:"帷幕與外牆",s:3,w:2.2,cls:"risk",p:"落後"},
      {n:"機電管線",s:3.5,w:2.5,cls:"",p:"41%"},
      {n:"裝修工程",s:5,w:2.5,cls:"",p:"排程"},
      {n:"景觀與收尾",s:6.5,w:1.5,cls:"",p:"排程"}
    ];
    gdata.forEach(function(g){
      var r=el('<div class="gr"><div class="gname">'+g.n+'</div><div class="gtrack"></div></div>');
      var bar=el('<div class="gbar '+g.cls+'">'+g.p+'</div>');
      bar.style.left=(g.s/8*100)+"%"; bar.style.width=(g.w/8*100)+"%";
      r.querySelector(".gtrack").appendChild(bar);
      gant.appendChild(r);
    });
    gscroll.appendChild(gant); gwrap.appendChild(gscroll);
    gwrap.appendChild(el('<div class="legend" style="margin-top:12px"><span><i style="background:#16a34a"></i>已完成</span><span><i style="background:#1d4ed8"></i>進行中</span><span><i style="background:#d97706"></i>落後預警</span></div>'));
    mid.appendChild(gwrap);

    // milestones
    var mcard=el('<div class="card pad"></div>');
    mcard.appendChild(el('<div class="card-h"><h3>近期里程碑</h3><span class="sub">4 筆</span></div>'));
    var mlist=el('<div class="miles"></div>');
    var mkc={done:"background:#e9f7ef;color:#16a34a",now:"background:#eff4ff;color:#1d4ed8",warn:"background:#fdf1e1;color:#d97706",plan:"background:#eef1f6;color:#64748b"};
    miles.forEach(function(m){
      mlist.appendChild(el('<div class="mile"><div class="mk" style="'+mkc[m.mk]+'"><span class="msi">'+m.ic+'</span></div>'+
        '<div class="mi"><b>'+m.t+'</b><span>'+m.s+'</span></div></div>'));
    });
    mcard.appendChild(mlist);
    mid.appendChild(mcard);
    root.appendChild(mid);

    // projects table
    var pcard=el('<div class="card pad"></div>');
    pcard.appendChild(el('<div class="card-h"><h3>在建專案清單</h3><span class="sub">依進度排序</span></div>'));
    var psc=el('<div class="scroll"></div>');

  /* ---------- render dispatch ---------- */
  var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
  var INITS=[null,initChart1,initChart2,initChart3,initChart4,initChart5];
  var current=-1;

  function show(i){
    i=Math.max(0,Math.min(i,SCREENS.length-1));
    destroyChart();
    if(chart4b){try{chart4b.destroy();}catch(e){} chart4b=null;}
    current=i;
    // nav active
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i); }
    view.innerHTML="";
    view.appendChild(SCREENS[i]());
    void view.offsetHeight; // force layout before charts
    if(INITS[i]) INITS[i]();
  }

  /* ---------- build nav ---------- */
  (function(){
    var tabs=document.getElementById("tabs");
    NAV.forEach(function(n,i){
      var btn=el('<button data-i="'+i+'"><span class="msi">'+n.icon+'</span><span class="lab">'+n.label+'</span></button>');
      btn.addEventListener("click",function(){ show(i); });
      tabs.appendChild(btn);
    });
  })();

  show(0);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
