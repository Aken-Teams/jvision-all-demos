<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>營建工程 ERP｜Jvision 系統 Demo</title>
  <meta name="description" content="專案、採購用料、出工日報、估驗計價、合約成本與品質缺失一體的營建營運中樞" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
:root{
  --color-primary:#64748B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#334155;
  --color-card:#FFFFFF;
  --color-card-foreground:#334155;
  --color-muted:#EBF0F5;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#64748B;
  --blue:#64748B;
  --ink:#0F172A;
  --muted:#475569;
  --line:#CBD5E1;
  --accent:#EA580C;
  --accent2:#94A3B8;
  --accent-soft:#FFF1E8;
  --ink2:#475569;
  --ink3:#64748B;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --shadow:8px 8px 0 #CBD5E1;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-height:100%}
body{
  overflow-x:hidden;
  background-color:var(--color-background);
  background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:48px 48px;
  color:var(--ink);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-on-accent);
  outline-offset:3px;
  box-shadow:0 0 0 6px var(--color-accent);
}
::selection{background:var(--color-accent);color:var(--color-on-accent)}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
header.top{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:3px solid var(--ink);
  background:rgba(248,250,252,.97);
}
.topbar{
  width:100%;
  max-width:1600px;
  min-height:78px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  align-items:stretch;
  gap:0;
}
.brand{
  min-width:262px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 20px 10px 0;
  border-right:2px solid var(--ink);
}
.brand .logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:4px 4px 0 var(--ink);
}
.brand .logo .msi{font-size:28px}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;margin-top:1px;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.02em;white-space:nowrap}
nav.tabs{
  min-width:0;
  display:flex;
  flex:1;
  align-items:stretch;
  overflow-x:auto;
  scrollbar-width:thin;
}
nav.tabs button{
  min-height:75px;
  min-width:94px;
  flex:1 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 13px;
  border:0;
  border-right:1px solid var(--line);
  border-radius:0;
  background:transparent;
  color:var(--ink2);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,box-shadow 180ms ease;
}
nav.tabs button .msi{font-size:20px;color:currentColor}
nav.tabs button:hover{background:var(--color-muted);color:var(--ink)}
nav.tabs button.active{
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:inset 0 -7px 0 var(--ink);
}
.env{
  max-width:244px;
  flex:none;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 0 0 20px;
  color:var(--ink2);
  font-size:11px;
  font-weight:700;
  line-height:1.35;
}
.env .dot{
  width:12px;
  height:12px;
  flex:none;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--ok);
}
main{width:min(100%,1600px);margin:0 auto;padding:34px 24px 72px}
#view>div{display:block}
.scr-head{
  position:relative;
  min-height:260px;
  margin:0 0 28px;
  padding:42px clamp(24px,5vw,72px);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:32px;
  overflow:hidden;
  border:3px solid var(--ink);
  background:var(--ink);
  color:#FFF;
  box-shadow:12px 12px 0 var(--color-accent);
}
.scr-head::before{
  content:"FIELD / ERP";
  position:absolute;
  top:16px;
  right:-12px;
  color:transparent;
  -webkit-text-stroke:1px #94A3B8;
  font-family:var(--mono);
  font-size:clamp(42px,8vw,112px);
  font-weight:400;
  line-height:1;
  letter-spacing:-.08em;
  opacity:.35;
  pointer-events:none;
}
.scr-head>div,.scr-head>.pill{position:relative;z-index:1}
.scr-head h1{
  max-width:900px;
  margin:0;
  display:flex;
  align-items:center;
  gap:16px;
  color:#FFF;
  font-size:clamp(34px,5.2vw,76px);
  font-weight:800;
  line-height:.98;
  letter-spacing:-.055em;
}
.scr-head h1 .msi{
  width:64px;
  height:64px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid #FFF;
  background:var(--color-accent);
  color:var(--color-on-accent);
  font-size:38px;
}
.scr-head p{max-width:760px;margin:20px 0 0;color:#E2E8F0;font-size:14px;font-weight:600}
.pill{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 13px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:12px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
}
.pill .msi{font-size:17px}
.pill.blue,.pill.ok,.pill.warn,.pill.bad,.pill.grey{background:#FFF;color:var(--ink)}
.scr-head .pill.blue,.scr-head .pill.ok,.scr-head .pill.warn,.scr-head .pill.bad,.scr-head .pill.grey{
  border-color:#FFF;
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:5px 5px 0 #FFF;
}
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(320px,2fr)}
.grid>*{min-width:0}
.card{
  min-width:0;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:var(--shadow);
}
.card.pad{padding:20px}
.card-h{
  min-height:42px;
  margin:-20px -20px 18px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:2px solid var(--ink);
  background:var(--color-muted);
}
.card-h h3{margin:0;color:var(--ink);font-size:14px;font-weight:800;letter-spacing:.01em}
.card-h .sub{color:var(--muted);font-family:var(--mono);font-size:10.5px;font-weight:400}
.kpi{
  position:relative;
  min-height:174px;
  overflow:hidden;
  padding:18px;
  background:var(--color-card);
}
.kpi:nth-child(2n){transform:translateY(10px)}
.kpi .kh{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.kpi .kh .ic{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-accent);
  color:var(--color-on-accent);
}
.kpi .kh .ic .msi{font-size:21px}
.kpi .v{
  margin-top:16px;
  color:var(--ink);
  font-size:clamp(30px,3vw,45px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{margin-left:5px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0}
.kpi .d{margin-top:12px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800}
.kpi .d.up{color:var(--ok)}
.kpi .d.down{color:var(--bad)}
.kpi .d.flat{color:var(--muted)}
.kpi .d .msi{font-size:16px}
.kpi .spark{position:absolute;right:-10px;bottom:-13px;color:var(--color-primary);font-size:84px;opacity:.1}
.scroll{width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
table{width:100%;border-collapse:collapse;color:var(--ink);font-size:12.5px}
th,td{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{
  background:var(--ink);
  color:#FFF;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#FFEDD5}
tfoot td{border-top:3px solid var(--ink);background:var(--color-muted)}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:400}
td b,td[class],.money{font-variant-numeric:tabular-nums}
td:nth-child(n+2){font-feature-settings:"tnum" 1}
.bar,.prog-lg,.kcard .kbar{
  min-width:70px;
  overflow:hidden;
  border:1px solid var(--ink);
  border-radius:0;
  background:#FFF;
}
.bar{height:10px}
.prog-lg{height:14px}
.bar>i,.prog-lg>i,.kcard .kbar>i{display:block;height:100%;border-radius:0;background:var(--color-accent)!important}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:800;
}
.tag.ok{background:#DCFCE7;color:#166534}
.tag.warn{background:#FFEDD5;color:#9A3412}
.tag.bad{background:#FEE2E2;color:#991B1B}
.tag.info{background:#E2E8F0;color:#1E293B}
.tag.grey{background:#F1F5F9;color:#475569}
.avatar{
  width:28px;
  height:28px;
  display:inline-grid;
  place-items:center;
  border:1px solid var(--ink);
  border-radius:0;
  color:#FFF;
  font-size:10px;
  font-weight:800;
  vertical-align:middle;
}
.gantt{width:100%;border:2px solid var(--ink);font-size:11px}
.gantt .gr{display:grid;grid-template-columns:170px 1fr;align-items:center;border-bottom:1px solid var(--line)}
.gantt .gr:last-child{border-bottom:0}
.gantt .gname{padding:10px 12px;overflow:hidden;border-right:2px solid var(--ink);font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.gantt .gmonths{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:2px solid var(--ink)}
.gantt .gmonths span{padding:8px 4px;border-left:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:10px;text-align:center}
.gantt .gtrack{position:relative;height:40px}
.gantt .gtrack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--line) calc(12.5% - 1px),var(--line) 12.5%)}
.gantt .gtrack .gbar{
  position:absolute;
  top:8px;
  height:24px;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding:0 8px;
  border:1px solid var(--ink);
  border-radius:0;
  background:var(--color-primary);
  color:#FFF;
  font-family:var(--mono);
  font-size:9px;
  font-weight:400;
  box-shadow:3px 3px 0 var(--ink);
}
.gantt .gtrack .gbar.done{background:var(--ok)}
.gantt .gtrack .gbar.risk{background:var(--warn)}
.crew{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.crewcard{overflow:hidden;border:2px solid var(--ink);border-radius:0;background:#FFF}
.crewcard .ch{padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);background:var(--color-muted)}
.crewcard .ch b{font-size:12.5px}
.crewcard .cb{padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px}
.rowb .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.rowb .lbl .msi{color:var(--color-primary);font-size:16px}
.rowb b{font-variant-numeric:tabular-nums}
.matrix td.b{font-weight:800}
.over{color:#B91C1C;font-weight:800}
.under{color:#166534;font-weight:800}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kcol{min-height:150px;padding:12px;border:2px solid var(--ink);border-radius:0;background:var(--color-muted)}
.kcol .kh2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800}
.kcol .cnt{min-width:28px;padding:2px 7px;border:1px solid var(--ink);border-radius:0;background:#FFF;color:var(--ink);font-family:var(--mono);font-size:10px;text-align:center}
.kcard{margin-bottom:10px;padding:12px;border:1px solid var(--ink);border-radius:0;background:#FFF;box-shadow:3px 3px 0 var(--color-secondary)}
.kcard:last-child{margin-bottom:0}
.kcard .kt{margin-bottom:6px;color:var(--ink);font-size:12px;font-weight:800}
.kcard .km{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
.kcard .kbar{height:7px;margin-top:10px}
.lbar{position:absolute;inset:0 auto 0 0;width:8px;border-radius:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px;font-weight:700}
.legend i{display:inline-block;width:13px;height:13px;margin-right:6px;border:1px solid var(--ink);border-radius:0;vertical-align:-2px}
.miles{display:flex;flex-direction:column}
.mile{position:relative;display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:0}
.mile .mk{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--ink);border-radius:0;font-size:10px;font-weight:800}
.mile .mk .msi{font-size:20px}
.mile .mi b{color:var(--ink);font-size:12px}
.mile .mi span{display:block;margin-top:3px;color:var(--muted);font-family:var(--mono);font-size:9.5px}
.chartbox{width:100%;min-height:280px}
.apexcharts-canvas text{font-family:"Inter",sans-serif!important}
.apexcharts-gridline{stroke:var(--line)!important}
.apexcharts-tooltip,.apexcharts-menu{border:2px solid var(--ink)!important;border-radius:0!important;box-shadow:5px 5px 0 var(--color-secondary)!important}
.apexcharts-series:nth-of-type(1) path{stroke:var(--color-accent)}
.foot{
  margin-top:42px;
  padding:17px;
  border-top:2px solid var(--ink);
  background:var(--color-muted);
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  text-align:center;
}
@keyframes grid-enter{
  0%{opacity:0;transform:translateY(16px) scale(.96)}
  70%{transform:translateY(-2px) scale(1.01)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
#view .grid>*{animation:grid-enter 400ms cubic-bezier(.2,1.35,.45,1) both}
#view .grid>*:nth-child(2){animation-delay:60ms}
#view .grid>*:nth-child(3){animation-delay:120ms}
#view .grid>*:nth-child(4){animation-delay:180ms}
#view .grid>*:nth-child(5){animation-delay:240ms}
#view .grid>*:nth-child(6){animation-delay:300ms}
@media(max-width:1180px){
  .topbar{padding:0 18px;flex-wrap:wrap}
  .brand{min-width:230px;border-right:0}
  nav.tabs{order:3;width:100%;border-top:2px solid var(--ink)}
  nav.tabs button{min-height:54px}
  .env{margin-left:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3-2,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
@media(max-width:768px){
  main{padding:20px 16px 54px}
  .env{display:none}
  .brand{min-height:68px}
  .scr-head{min-height:300px;padding:34px 22px;align-items:flex-start;flex-direction:column;justify-content:flex-end;box-shadow:7px 7px 0 var(--color-accent)}
  .scr-head h1{font-size:clamp(32px,10vw,52px)}
  .scr-head h1 .msi{width:52px;height:52px;font-size:30px}
  .scr-head>.pill{align-self:flex-start}
  .crew{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:1fr}
  .card.pad{padding:16px}
  .card-h{margin:-16px -16px 16px;padding:11px 16px}
}
@media(max-width:560px){
  .topbar{padding:0 12px}
  .brand{min-width:0}
  .brand .logo{width:42px;height:42px}
  .brand b{font-size:15px}
  nav.tabs button{min-width:58px;padding:8px 12px}
  nav.tabs button .lab{display:none}
  nav.tabs button .msi{font-size:23px}
  .g4,.crew{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
  .scr-head{margin-bottom:22px}
  .scr-head::before{top:20px;font-size:54px}
  .scr-head h1{align-items:flex-start;flex-direction:column}
  .scr-head p{font-size:12px}
  .pill{white-space:normal}
  th,td{padding:10px 11px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  #view .grid>*{animation:none!important}
}
</style>
</head>
<body>
  <header class="top">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><span class="msi">architecture</span></div>
        <div><b>營建工程 ERP</b><small>Jvision Construction ERP</small></div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="env"><span class="dot"></span> 正式環境 · 城中段捷運聯開案</div>
    </div>
  </header>
  <main><div id="view"></div>
    <div class="foot">Jvision 營建工程 ERP · 純前端展示原型 · 資料為模擬示意</div>
  </main>

  <script>
  "use strict";
  /* ---------- helpers ---------- */
  function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
  function nf(n){try{return (n||0).toLocaleString("en-US");}catch(e){return String(n);}}
  function avatarColor(s){var c=["#1d4ed8","#0891b2","#7c3aed","#c026d3","#db2777","#ea580c","#16a34a","#0d9488"];var h=0;s=s||"";for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return c[h%c.length];}

  function show(i){
    i=Math.max(0,Math.min(i,SCREENS.length-1));
    destroyChart();
    if(chart4b){try{chart4b.destroy();}catch(e){} chart4b=null;}
    current=i;
    // nav active
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i); }
    view.innerHTML="";
    view.appendChild(SCREENS[i]());
    void view.offsetHeight; // force layout before charts
    if(INITS[i]) INITS[i]();
  }

  /* ---------- build nav ---------- */
  (function(){
    var tabs=document.getElementById("tabs");
    NAV.forEach(function(n,i){
      var btn=el('<button data-i="'+i+'"><span class="msi">'+n.icon+'</span><span class="lab">'+n.label+'</span></button>');
      btn.addEventListener("click",function(){ show(i); });

    });
  })();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
