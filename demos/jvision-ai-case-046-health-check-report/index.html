<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>健檢報告提醒台 · Health Check Report Hub</title>
<meta name="description" content="健檢預約、報告判讀、紅字追蹤到複檢提醒與健康趨勢（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFFFFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --ok:#047857;
  --warn:#A35A00;
  --bad:#B91C1C;
  --surface-shadow:-6px -6px 16px rgba(255,255,255,.9),6px 6px 18px rgba(8,145,178,.12);
  --pressed-shadow:inset -3px -3px 7px rgba(255,255,255,.9),inset 3px 3px 8px rgba(8,145,178,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Atkinson Hyperlegible","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button,a,input,select{transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease,color .18s ease,transform .18s ease}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.icon{width:1.2em;height:1.2em;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;
  padding:12px clamp(14px,3vw,30px);background:rgba(236,254,255,.94);
  border-bottom:1px solid rgba(8,145,178,.2);backdrop-filter:blur(12px)
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#063E4D;
  background:linear-gradient(145deg,#d8fbff,#9cebf6);box-shadow:var(--surface-shadow)
}
.logo .icon{width:24px;height:24px}
.brand b{display:block;font-size:16px}
.brand small{display:block;margin-top:2px;color:#087A96;font-size:10px;letter-spacing:.16em}
.nav{margin-left:auto;display:flex;gap:7px;overflow-x:auto;padding:4px}
.nav button{
  min-height:42px;padding:8px 11px;border:1px solid transparent;border-radius:13px;
  background:transparent;color:var(--muted);font-weight:700;white-space:nowrap
}
.nav button:hover{background:#fff;color:#066E88;box-shadow:var(--surface-shadow)}
.nav button.on{background:#bceff6;color:#073E4D;border-color:#91DFEA;box-shadow:var(--pressed-shadow)}
.nav .icon{margin-right:5px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:#FEE2E2;color:#991B1B;font-size:11px}
.who{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#D5F7FA;color:#075E73;font-weight:700;box-shadow:var(--pressed-shadow)}
.who b,.who small{display:block}.who b{font-size:13px}.who small{color:var(--muted);font-size:11px}
.wrap{width:min(1340px,100%);margin:auto;padding:24px clamp(14px,3vw,28px) 40px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.view-head h1{margin:0;font-size:clamp(24px,3vw,32px);line-height:1.1;letter-spacing:-.02em}
.view-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.date-pill,.tag{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-weight:700;white-space:nowrap
}
.date-pill{padding:8px 13px;background:#D6F7FA;color:#075E73;box-shadow:var(--pressed-shadow);font-size:13px}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.95fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}
.card,.kpi{
  background:var(--color-card);border:1px solid rgba(8,145,178,.16);
  border-radius:16px;box-shadow:var(--surface-shadow)
}
.card{padding:18px}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 15px;font-size:16px}
.card h2 .icon{color:#087C98}
.grow{margin-left:auto;color:#08728A;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;padding:17px}
.kpi:after{content:"";position:absolute;right:-20px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:#D9F8FB}
.kpi .ki{position:absolute;right:16px;top:16px;color:#07819D;z-index:1}
.kpi .label{color:var(--muted);font-size:12px;font-weight:700}
.kpi .value{margin-top:7px;font-size:29px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:13px;color:var(--muted)}
.delta{margin-top:4px;color:var(--ok);font-size:12px;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.stat div{padding:13px;text-align:center;border-radius:13px;background:#EDF9FA;box-shadow:var(--pressed-shadow)}
.stat b,.stat span{display:block}.stat b{font-size:23px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:12px}
.tag{padding:4px 9px;font-size:11px}
.ok{background:#D1FAE5;color:#065F46}.warn{background:#FEF3C7;color:#854D0E}.bad{background:#FEE2E2;color:#991B1B}.info{background:#CFFAFE;color:#155E75}.neutral{background:#E2E8F0;color:#334155}
.row,.track,.reminder{display:flex;align-items:center;gap:12px;border-top:1px solid #D7EEF2}
.row:first-of-type,.reminder:first-of-type{border-top:0}
.row{min-height:59px;padding:10px 0}
.time,.code,.number{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.time{width:56px;color:#087893;font-weight:700}
.row-main,.track-main,.reminder-main{min-width:0;flex:1}
.row-main b,.row-main small,.track-main b,.track-main small,.reminder-main b,.reminder-main small{display:block}
.row-main b,.track-main b,.reminder-main b{font-size:14px}
.row-main small,.track-main small,.reminder-main small{margin-top:2px;color:var(--muted);font-size:12px}
.package{padding:4px 9px;border-radius:999px;background:#E3F8FA;color:#075E73;font-size:11px;font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px;font-weight:700}
.field.full{grid-column:1/-1}
.field input,.field select{
  width:100%;min-height:43px;padding:9px 11px;border:1px solid #8FD7E0;border-radius:11px;
  background:#F8FFFF;color:var(--ink);box-shadow:inset 2px 2px 5px rgba(8,145,178,.08)
}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{
  min-height:43px;padding:9px 15px;border:1px solid #047E68;border-radius:12px;
  background:#A7F3D0;color:#064E3B;font-weight:700;box-shadow:var(--surface-shadow)
}
.btn:hover{background:#6EE7B7;transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:var(--pressed-shadow)}
.btn.secondary{border-color:#8ADAE4;background:#F8FFFF;color:#075E73}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:11px}
.slot{padding:11px 8px;text-align:center;border:1px solid #B5E8ED;border-radius:13px;background:#FAFFFF;box-shadow:var(--surface-shadow)}
.slot b,.slot small{display:block}.slot b{font-size:15px}.slot small{margin-top:3px;color:var(--muted);font-size:11px}
.meter{height:7px;margin-top:9px;overflow:hidden;border-radius:999px;background:#D9EDF0}
.meter i{display:block;height:100%;border-radius:inherit;background:#0891B2}
.slot.full{border-color:#FCA5A5;background:#FFF7F7}.slot.full .meter i{background:#B91C1C}
.report-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.patient-avatar{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:#BAF1F6;color:#075E73;font-size:22px;font-weight:700;box-shadow:var(--surface-shadow)}
.report-head b,.report-head small{display:block}.report-head b{font-size:19px}.report-head small{margin-top:3px;color:var(--muted);font-size:12px}
.score{margin-left:auto;padding:8px 17px;text-align:center;border-radius:14px;background:#E7F7F9;box-shadow:var(--pressed-shadow)}
.score b,.score span{display:block}.score b{color:#087B95;font-size:25px}.score span{color:var(--muted);font-size:11px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{padding:12px 13px;border:1px solid #C9E9ED;border-left:5px solid #047857;border-radius:13px;background:#FCFFFF}
.item.flag{border-left-color:#B91C1C;background:#FFF9F9}.item.caution{border-left-color:#A35A00;background:#FFFCF4}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item-name{font-size:13px;font-weight:700}.item-value{margin-top:6px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.item-value small,.reference{color:var(--muted);font-size:11px}.reference{margin-top:3px}
.value-ok{color:#047857}.value-warn{color:#8A4B00}.value-bad{color:#B91C1C}
.track-list{display:flex;flex-direction:column;gap:11px}
.track{padding:12px 13px;border:1px solid #CDE9EC;border-left:5px solid #A35A00;border-radius:13px;background:#FCFFFF}
.track.hi{border-left-color:#B91C1C}.track.lo{border-left-color:#087B95}
.risk{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:11px;color:#fff;font-size:12px;font-weight:700}
.risk.hi{background:#B91C1C}.risk.mid{background:#A35A00}.risk.lo{background:#087B95}
.track-end{text-align:right;flex:none}.due{margin-top:4px;color:var(--muted);font-size:11px}
.reminder{padding:12px 0}.reminder .avatar{width:40px;height:40px}
.channel{padding:4px 8px;border-radius:7px;font-size:11px;font-weight:700}
.line-channel{background:#D1FAE5;color:#065F46}.sms-channel{background:#CFFAFE;color:#155E75}.call-channel{background:#FEF3C7;color:#854D0E}
.note{margin:14px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
.callout{margin-top:12px;padding:14px;border-radius:13px;background:#EAF8FA;color:#234E5B;line-height:1.75;box-shadow:var(--pressed-shadow);font-size:13px}
.chart{width:100%;min-height:100px}
.mt{margin-top:18px}
[data-animate]{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .top{align-items:flex-start;flex-wrap:wrap}.nav{order:3;width:100%;margin-left:0}
  .kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21{grid-template-columns:1fr}
}
@media(max-width:768px){.who{display:none}.items{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.package{display:none}}
@media(max-width:480px){
  .wrap{padding-top:18px}.view-head{align-items:flex-start;flex-direction:column}.date-pill{align-self:flex-start}
  .kpis{grid-template-columns:1fr 1fr;gap:11px}.kpi{padding:14px}.kpi .value{font-size:24px}
  .brand small{display:none}.nav button{min-width:44px;padding:9px}.nav button .nav-label{display:none}
  .track{align-items:flex-start;flex-wrap:wrap}.track-end{width:100%;text-align:left;padding-left:52px}
  .reminder{flex-wrap:wrap}.reminder-main{min-width:160px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>

<script>
var ICONS={

};
var MOD=[
 ["健檢總覽","dashboard","受檢人次、報告完成與紅字異常戰情",""],
 ["健檢預約","calendar","套餐預約、報到與各時段容量排程",""],
 ["報告判讀","report","檢查項目數值與正常 / 紅字自動判讀",""],

var nav=document.getElementById("nav"),view=document.getElementById("view"),title=document.getElementById("viewTitle"),description=document.getElementById("viewDescription");
nav.innerHTML=MOD.map(function(m,i){return '<button type="button" data-i="'+i+'" class="'+(i===0?'on':'')+'" aria-current="'+(i===0?'page':'false')+'">'+ICONS[m[1]]+'<span class="nav-label">'+m[0]+'</span>'+(m[3]?'<span class="badge">'+m[3]+'</span>':'')+'</button>'}).join("");
function heading(icon,text,extra){return '<h2>'+ICONS[icon]+text+(extra?'<span class="grow">'+extra+'</span>':'')+'</h2>'}
function kpis(){
 var rows=[["報告完成時效","1.5","天","▼ 較 4.2 天"],["本月紅字追蹤","28","案","複檢率 96%"],["複檢提醒回覆率","91","%","▲ 較 62%"],["判讀待處理","6","筆","今日已判 34"]];
 return '<section class="kpis">'+rows.map(function(x,i){return '<article class="kpi" data-animate><span class="ki">'+ICONS[["report","alert","bell","check"][i]]+'</span><div class="label">'+x[0]+'</div><div class="value">'+x[1]+' <small>'+x[2]+'</small></div><div class="delta">'+x[3]+'</div></article>'}).join("")+'</section>'

function show(i){
 i=Math.max(0,Math.min(i,MOD.length-1));
 nav.querySelectorAll("[data-i]").forEach(function(button){var active=Number(button.dataset.i)===i;button.classList.toggle("on",active);button.setAttribute("aria-current",active?"page":"false")});
 title.textContent=MOD[i][0];description.textContent=MOD[i][2];view.innerHTML=SCREENS[i]();draw(i)
}
function fromHash(){
 var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(match?Number(match[1]):0);
 try{window.scrollTo(0,0)}catch(e){}
}
nav.addEventListener("click",function(event){
 var button=event.target.closest("button[data-i]");
 if(!button)return;
 var i=Number(button.dataset.i);
 if(location.hash!=="#v"+i)location.hash="v"+i;else show(i)
});
