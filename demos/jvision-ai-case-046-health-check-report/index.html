<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>健檢報告提醒台 · Health Check Report Hub</title>
<meta name="description" content="健檢預約、報告判讀、紅字追蹤到複檢提醒與健康趨勢（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#0284c7;--accent2:#38bdf8;--ink:#0c2740;--bg:#f0f7fb;--card:#fff;--line:#dbeafe;--soft:#eff6fc;--mut:#5b708a;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* top nav */
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(2,132,199,.32)}
.logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav button .badge{font-size:10px;font-weight:800;background:#fee2e2;color:#b91c1c;border-radius:999px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
.who{display:flex;align-items:center;gap:9px;padding-left:6px;border-left:1px solid var(--line);flex:none}
.who .av{width:34px;height:34px;border-radius:50%;background:#cfeafd;color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px}
.who small{color:var(--mut);font-size:11px;display:block}
.who b{font-size:12.5px}
/* main */
.wrap{max-width:1300px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);padding:6px 13px;border-radius:999px;font-size:12px;font-weight:800}
.pill .material-symbols-outlined{font-size:16px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* grid */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.5fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#eef2f6;color:#64748b}
/* table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft);text-transform:uppercase;letter-spacing:.03em}
table.data tr:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.chart{width:100%;min-height:60px}
/* report card */
.rc-hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.rc-av{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:grid;place-items:center;font-size:21px;font-weight:800;flex:none}
.rc-hd b{font-size:18px;color:var(--ink)}
.rc-hd small{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}
.rc-score{margin-left:auto;text-align:center;background:var(--soft);border-radius:13px;padding:8px 16px;flex:none}
.rc-score b{font-size:24px;font-weight:900;color:var(--accent)}
.rc-score span{font-size:11px;color:var(--mut);display:block}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.itm{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;border-left:4px solid var(--ok)}
.itm.flag{border-left-color:var(--bad);background:#fffafa}
.itm.warn{border-left-color:var(--warn);background:#fffdf5}
.itm .in{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.itm .nm{font-size:12.5px;font-weight:700;color:var(--ink);font-family:"Noto Sans TC"}
.itm .val{font-size:17px;font-weight:900;font-family:Inter}
.itm .val.g-ok{color:var(--ok)}.itm .val.g-bad{color:var(--bad)}.itm .val.g-warn{color:var(--warn)}
.itm .ref{font-size:11px;color:var(--mut);margin-top:3px}
/* appointment */
.apt{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--line);align-items:center}.apt:first-of-type{border-top:0}
.apt .tm{font-weight:900;color:var(--accent);font-size:14px;width:52px;flex:none}
.apt .nm b{color:var(--ink);font-size:13.5px}.apt .nm small{display:block;color:var(--mut);font-size:11.5px}
.apt .pk{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent);background:var(--soft);border-radius:999px;padding:3px 10px;height:max-content;flex:none}
/* slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.slot{border:1px solid var(--line);border-radius:11px;padding:10px 6px;text-align:center;background:#fff}
.slot b{display:block;font-size:14px;font-weight:800;color:var(--ink)}
.slot small{font-size:10.5px;color:var(--mut)}
.slot .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:7px}
.slot .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.slot.full{background:#fff5f5;border-color:#fecaca}.slot.full .bar i{background:var(--bad)}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--mut)}
.fld.full{grid-column:1/-1}
.fld input,.fld select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
.fld input:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #cfeafd}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
/* track / risk rows */
.trk{display:flex;flex-direction:column;gap:10px}
.tk{border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--warn)}
.tk.hi{border-left-color:var(--bad)}.tk.lo{border-left-color:var(--accent)}
.tk .bx{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;font-weight:900;font-size:12px}
.tk .bx.hi{background:var(--bad)}.tk .bx.mid{background:var(--warn)}.tk .bx.lo{background:var(--accent)}
.tk .in{min-width:0;flex:1}
.tk .in b{font-size:13px;font-family:"Noto Sans TC";color:var(--ink);display:block}
.tk .in small{color:var(--mut);font-size:11.5px}
.tk .rt{text-align:right;flex:none}
.tk .rt .dt{font-size:11.5px;color:var(--mut)}
/* reminder */
.rem{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.rem:first-of-type{border-top:0}
.rem .av{width:38px;height:38px;border-radius:50%;background:#cfeafd;color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none;font-size:13px}
.rem .in{flex:1;min-width:0}.rem .in b{font-size:13px;color:var(--ink)}.rem .in small{display:block;color:var(--mut);font-size:11.5px}
.rem .ch{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;flex:none}
.ch-line{background:#dcfce7;color:#15803d}.ch-sms{background:#e0f2fe;color:#0369a1}.ch-call{background:#fef3c7;color:#b45309}
/* stat cards */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.sc b{display:block;font-size:22px;font-weight:900;color:var(--ink)}
.sc span{font-size:11.5px;color:var(--mut)}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21{grid-template-columns:1fr}.items{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.who{display:none}.kpis{grid-template-columns:1fr 1fr}.apt .pk{display:none}}
</style>
</head>

// chart lifecycle
var charts=[];
function clearCharts(){charts.forEach(function(c){try{c.destroy();}catch(e){}});charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var SKY=['#0284c7','#38bdf8','#7dd3fc','#0369a1','#bae6fd'];
function base(extra){return Object.assign({chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:'Inter,Noto Sans TC,sans-serif',toolbar:{show:false},animations:{enabled:true,speed:500}},dataLabels:{enabled:false},grid:{borderColor:'#e5eef6'},legend:{fontSize:'12px'},tooltip:{style:{fontSize:'12px'}}},extra);}

 if(i===0){

  mk('c_pkg',base({chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'bar',height:250},series:[{name:'人次',data:[142,96,78,54,16]}],plotOptions:{bar:{horizontal:true,borderRadius:4,barHeight:'60%',distributed:true}},colors:SKY,xaxis:{categories:['標準健檢','尊榮全身','三高追蹤','企業員工','心血管進階']},legend:{show:false},dataLabels:{enabled:true,style:{fontSize:'11px',colors:['#fff']}}}));

function show(i){
 nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
 view.innerHTML=SCREENS[i]();
 draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
