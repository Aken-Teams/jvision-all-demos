<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智慧門市 POS · Jvision Smart POS</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800&family=Rubik:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#D1FAE5;
  --sub:var(--color-muted-foreground);
  --bg:var(--color-background);
  --card:var(--color-card);
  --ok:#047857;
  --okbg:#D1FAE5;
  --warn:#9A4A08;
  --warnbg:#FFEDD5;
  --danger:var(--color-destructive);
  --dangerbg:#FEE2E2;
  --shadow-sm:0 2px 0 rgba(6,78,59,.06),0 8px 22px rgba(6,78,59,.07);
  --shadow-md:0 4px 0 rgba(5,150,105,.12),0 18px 42px rgba(6,78,59,.12);
  --radius-sm:12px;
  --radius-md:18px;
  --radius-lg:26px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 92% 4%,rgba(16,185,129,.18),transparent 24rem),
    linear-gradient(135deg,rgba(255,255,255,.68) 0 1px,transparent 1px 24px),
    var(--bg);
  background-size:auto,24px 24px,auto;
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i],.li,.keypad button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.msy{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;max-width:100%}
.side{
  width:248px;
  flex:0 0 248px;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  color:#ECFDF5;
  background:
    radial-gradient(circle at 18% 8%,rgba(16,185,129,.34),transparent 13rem),
    #053C30;
  border-right:1px solid rgba(167,243,208,.2);
}
.brand{
  min-height:92px;
  padding:20px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(167,243,208,.18);
}
.brand .logo{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#031C16;
  background:linear-gradient(135deg,#34D399,#A7F3D0);
  border:1px solid rgba(255,255,255,.48);
  border-radius:14px 14px 14px 5px;
  box-shadow:0 8px 22px rgba(0,0,0,.2);
}
.brand .logo .msy{font-size:25px}
.brand b{
  display:block;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.2px;
}
.brand span{display:block;font-size:11px;color:#A7F3D0;font-weight:600}
.nav{padding:18px 12px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
  min-height:46px;
  padding:11px 13px;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:#D1FAE5;
  text-align:left;
  font-size:13.5px;
  font-weight:700;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.nav button .msy{font-size:21px;flex:0 0 auto}
.nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(167,243,208,.11);border-color:rgba(167,243,208,.2);color:#FFFFFF;transform:translateX(3px)}
.nav button.on{
  color:#022C22;
  background:linear-gradient(135deg,#A7F3D0,#34D399);
  border-color:#D1FAE5;
  box-shadow:0 6px 0 rgba(0,0,0,.16),0 14px 26px rgba(0,0,0,.2);
}
.side .foot{margin-top:auto;padding:16px 18px;font-size:11px;color:#A7F3D0;border-top:1px solid rgba(167,243,208,.18)}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{
  min-height:92px;
  padding:16px 28px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 18px rgba(6,78,59,.06);
  backdrop-filter:blur(16px);
}
.top .tt{min-width:0}
.top .tt h1{
  margin:0;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:clamp(21px,2.1vw,30px);
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.025em;
}
.top .tt p{margin:5px 0 0;font-size:13px;color:var(--sub);font-weight:600}
.top .spacer{flex:1 1 auto;min-width:10px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:7px 12px;
  border:1px solid var(--line);
  border-radius:10px 10px 10px 4px;
  background:#F0FDF4;
  color:#065F46;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.pill .msy{font-size:17px}
.wrap{padding:30px clamp(16px,3vw,40px) 56px;min-width:0}
#screen{animation:screen-in .35s ease-out both}
.grid{display:grid;gap:20px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:350px minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1fr) 390px}
.card,.kpi,.pane-list{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.card{
  position:relative;
  padding:20px;
  border-radius:var(--radius-md);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#6EE7B7;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card h3{
  margin:0 0 4px;
  display:flex;
  align-items:center;
  gap:9px;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.01em;
}
.card h3 .msy{font-size:20px;color:var(--accent)}
.card .csub{margin:0 0 16px;font-size:12px;color:var(--sub);font-weight:600}
.kpi{
  position:relative;
  overflow:hidden;
  padding:18px;
  border-radius:16px 16px 16px 5px;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi:after{
  content:"";
  position:absolute;
  width:76px;
  height:76px;
  right:-32px;
  top:-32px;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(5,150,105,.18),rgba(16,185,129,.04));
  transform:rotate(18deg);
}
.kpi:hover{transform:translateY(-3px);border-color:#6EE7B7;box-shadow:var(--shadow-md)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-ico{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#022C22;
  background:linear-gradient(135deg,#A7F3D0,#6EE7B7);
  border:1px solid #6EE7B7;
  border-radius:12px 12px 12px 4px;
}
.kpi .k-val{
  margin:12px 0 1px;
  color:#022C22;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:clamp(24px,2.2vw,30px);
  font-weight:700;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.kpi .k-lbl{font-size:12.5px;color:var(--sub);font-weight:700}
.kpi .k-dl{margin-top:8px;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800}
.up{color:#047857}.down{color:#B91C1C}
.chartbox{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  color:#334155;
  background:#E8F8F1;
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.35px;
  text-transform:uppercase;
}
th:first-child{border-radius:10px 0 0 0}
th:last-child{border-radius:0 10px 0 0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDF4}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{
  text-align:right;
  font-family:"Rubik",ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
small,.csub,.em,.ex,.st,.ec,[class*="sku"]{font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11.5px;
  font-weight:800;
  line-height:1.2;
}
.t-ok{background:var(--okbg);color:#047857}
.t-warn{background:var(--warnbg);color:#92400E}
.t-dan{background:var(--dangerbg);color:#B91C1C}
.t-info{background:#E0E7FF;color:#3730A3}
.t-mute{background:#E8F1F3;color:#475569}
.pane-list{height:fit-content;overflow:hidden;border-radius:var(--radius-md)}
.pane-list .ph{
  padding:15px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:#F0FDF4;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:13.5px;
  font-weight:700;
}
.li{
  min-width:0;
  min-height:64px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid var(--line);
  transition:background-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.li:last-child{border-bottom:0}
.li:hover{background:#F0FDF4;transform:translateX(2px)}
.li.on{background:#D1FAE5;box-shadow:inset 4px 0 0 var(--accent)}
.li .av{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px 12px 12px 4px;
  color:#fff;
  font-size:14px;
  font-weight:800;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.li .lm{min-width:0;flex:1 1 auto}
.li .lm .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:800}
.li .lm .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--sub)}
.li .lr{text-align:right;flex:0 0 auto}
.li .lr .amt{font-family:"Rubik",sans-serif;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.li .lr .st{font-size:11px;color:var(--sub)}
.cart-row{min-width:0;padding:12px 0;display:flex;align-items:center;gap:12px;border-bottom:1px dashed #86E7BD}
.cart-row:last-child{border-bottom:0}
.cart-row .cn{min-width:0;flex:1 1 auto}
.cart-row .cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:800}
.cart-row .cn small{font-size:11.5px;color:var(--sub);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.cart-row .cq{flex:0 0 auto;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:#E8F8F1;font-size:12.5px;font-weight:800}
.cart-row .cp{flex:0 0 auto;font-family:"Rubik",sans-serif;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{
  min-height:52px;
  padding:13px 0;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:18px;
  font-weight:700;
  box-shadow:0 3px 0 #D1FAE5;
  transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.keypad button:hover{background:#D1FAE5;border-color:var(--accent);transform:translateY(-2px);box-shadow:0 5px 0 #A7F3D0}
.keypad button:active{transform:translateY(1px);box-shadow:0 1px 0 #A7F3D0}
.keypad button.pay{
  grid-column:span 3;
  min-height:56px;
  padding:15px 10px;
  border:1px solid #C2410C;
  background:linear-gradient(135deg,#F97316,var(--color-accent));
  color:#111827;
  font-size:16px;
  box-shadow:0 5px 0 #9A3412,0 12px 24px rgba(234,88,12,.22);
}
.keypad button.pay:hover{background:#FB923C;border-color:#9A3412;color:#111827}
.totline{padding:6px 0;display:flex;justify-content:space-between;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.totline.big{margin-top:8px;padding-top:13px;border-top:2px solid var(--ink);color:var(--ink);font-family:"Rubik",sans-serif;font-size:21px;font-weight:700}
.bar{height:10px;min-width:60px;overflow:hidden;border-radius:999px;background:#DDEBE7;border:1px solid #C8DED7}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#34D399)}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:13px;min-width:780px}
.col{min-width:0;padding:12px;border:1px solid var(--line);border-radius:15px;background:#E8F8F1}
.col>h4{margin:0 0 11px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800}
.chip-cnt{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub);font-size:11px;font-weight:800}
.tk{min-width:0;margin-bottom:9px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 3px 9px rgba(6,78,59,.06)}
.tk:last-child{margin-bottom:0}
.tk .tkt{font-size:12.5px;font-weight:800}
.tk .tkm{margin-top:3px;color:var(--sub);font-size:11px}
.tk .tkb{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl{position:relative;min-width:0;padding-left:25px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#86E7BD}
.tl .ev{position:relative;padding:0 0 20px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev:before{content:"";position:absolute;left:-21px;top:3px;width:11px;height:11px;border:3px solid #fff;border-radius:4px;background:var(--accent);box-shadow:0 0 0 2px #6EE7B7}
.tl .ev .et{font-size:13px;font-weight:800}
.tl .ev .em{font-size:11.5px;color:var(--sub)}
.tl .ev .ex{color:#047857;font-size:11px;font-weight:800}
.esl{
  min-width:0;
  padding:13px 14px;
  border:2px solid #6B7F78;
  border-radius:11px;
  background:linear-gradient(180deg,#fff,#F3FAF7);
  box-shadow:inset 0 0 0 3px #fff,0 5px 14px rgba(6,78,59,.1);
}
.esl .en{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:800}
.esl .ep{color:#047857;font-family:"Rubik",sans-serif;font-size:23px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.esl .eo{font-size:12px;color:var(--sub);text-decoration:line-through;font-variant-numeric:tabular-nums}
.esl .ec{margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--sub);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px}
.legend{margin-top:13px;display:flex;flex-wrap:wrap;gap:12px;color:var(--sub);font-size:12px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;display:inline-block;border:1px solid currentColor;border-radius:3px}
.ai{background:linear-gradient(145deg,#D1FAE5,#fff 62%);border-color:#6EE7B7}
.ai .airow{min-width:0;padding:12px 0;display:flex;gap:11px;border-bottom:1px dashed #86E7BD}
.ai .airow:last-child{border-bottom:0}
.ai .aic{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;border:1px solid #6EE7B7;border-radius:10px 10px 10px 4px;background:#A7F3D0;color:#064E3B}
.ai .airow .at{font-size:13px;font-weight:800}
.ai .airow .ad{color:#3F5663;font-size:12px}
.card[style*="background:#fbf5f0"]{background:#E8F8F1!important;border:1px solid var(--line)!important}
@keyframes screen-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.split2{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;flex:none;flex-direction:row;align-items:center}
  .brand{min-height:72px;padding:12px 14px;border-right:1px solid rgba(167,243,208,.18);border-bottom:0}
  .brand .logo{width:40px;height:40px;flex-basis:40px}
  .nav{flex:1;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;scroll-snap-type:x proximity}
  .nav button{width:auto;flex:0 0 auto;scroll-snap-align:start}
  .nav button:hover{transform:translateY(-2px)}
  .side .foot{display:none}
  .top{position:static;min-height:78px;padding:13px 18px}
}
@media(max-width:820px){
  .g3,.g2{grid-template-columns:1fr}
  .board{gap:10px}
}
@media(max-width:560px){
  .brand>div:last-child{display:none}
  .nav button .lbl{display:none}
  .nav button{min-width:46px;padding:10px;justify-content:center}
  .wrap{padding:20px 14px 42px}
  .top{padding:13px 15px}
  .top .tt{flex:1 1 100%}
  .top .spacer{display:none}
  .pill{flex:1 1 auto;justify-content:center}
  .g4{grid-template-columns:1fr}
  .card{padding:16px}
  .kpi{padding:16px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="msy">storefront</span></div>
      <div><b>智慧門市 POS</b><span>Jvision Smart POS</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">單店範例資料 · 純前端展示<br/>© 2026 Jvision Demo</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="tt"><h1 id="scrTitle">前台收銀結帳</h1><p id="scrDesc">掃碼開單、混合支付與快速結帳</p></div>
      <div class="spacer"></div>
      <span class="pill"><span class="msy">wifi</span>門市連線正常</span>

var AC="#059669", AC2="#10B981";
function copt(legend){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:!!legend,labels:{boxWidth:12,padding:12,font:{size:11}}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:"#f1eae4"},ticks:{font:{size:10}}}}};}
function initCharts(i){
  Chart.defaults.font.family="'Nunito Sans', sans-serif";
  Chart.defaults.color="#475569";
  if(i===1){
    mkChart("c1a",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"月消費 $",data:[4200,5800,4900,7200,6100,8600],borderColor:AC,backgroundColor:"rgba(194,65,12,.12)",fill:true,tension:.35,pointRadius:3}]},options:copt(true)});
  }else if(i===2){
    mkChart("c2a",{type:"doughnut",data:{labels:["充足","偏低","缺貨"],datasets:[{data:[1180,102,2],backgroundColor:["#15803d","#f59e0b","#dc2626"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});
  }else if(i===3){
    mkChart("c3a",{type:"bar",data:{labels:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"],datasets:[{label:"推送次數",data:[22,18,31,27,40,55,64],backgroundColor:AC2,borderRadius:6,maxBarThickness:26}]},options:copt(false)});
  }else if(i===4){
    mkChart("c4a",{type:"bar",data:{labels:["4月","5月","6月","7月","8月"],datasets:[{label:"門市營收 $",data:[812000,768000,905000,884000,964800],backgroundColor:AC,borderRadius:6,maxBarThickness:30},{label:"應撥分潤 $",data:[154280,145920,171950,167960,183312],backgroundColor:AC2,borderRadius:6,maxBarThickness:30}]},options:copt(true)});
  }else if(i===5){
    mkChart("c5a",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"熱銷掌握率 %",data:[62,68,74,80,86,92],borderColor:AC,backgroundColor:"rgba(251,146,60,.18)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:AC}]},options:copt(false)});
    mkChart("c5b",{type:"doughnut",data:{labels:["咖啡飲品","烘焙","禮盒","生活雜貨","零食"],datasets:[{data:[38,22,18,14,8],backgroundColor:[AC,AC2,"#fdba74","#fed7aa","#d6c8bd"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{boxWidth:12,padding:10,font:{size:11}}}}}});
  }
}

var RENDER=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="msy">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';}).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});});
}
function show(i){
  var cur=RENDER[i]?i:0;
  var container=document.getElementById("screen");
  document.getElementById("scrTitle").textContent=MODS[cur].name;
  document.getElementById("scrDesc").textContent=MODS[cur].desc;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===cur);});
  container.innerHTML=RENDER[cur]();
  void container.offsetHeight;
  initCharts(cur);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
