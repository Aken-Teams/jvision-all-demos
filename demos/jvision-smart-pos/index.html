<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智慧門市 POS · Jvision Smart POS</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#c2410c; --accent2:#fb923c; --accent-soft:#fff1e9;
  --ink:#1c1917; --sub:#78716c; --line:#eee2da; --bg:#faf6f2; --card:#ffffff;
  --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --danger:#b91c1c; --dangerbg:#fee2e2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
.msy{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.app{display:flex;min-height:100vh;max-width:100%}
.side{width:230px;flex:0 0 230px;background:#2a1a12;color:#fdece1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
.brand{padding:20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px}
.brand .logo .msy{font-size:22px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:#c9a893;font-weight:500}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#e7cdbd;padding:11px 13px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;min-width:0}
.nav button .msy{font-size:21px;flex:0 0 auto}
.nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(194,65,12,.35)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:11px;color:#9c7c6a;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:15px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top .tt{min-width:0}
.top .tt h1{margin:0;font-size:18px;font-weight:800}
.top .tt p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
.top .spacer{flex:1 1 auto;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .msy{font-size:17px}
.wrap{padding:22px 24px 44px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:340px 1fr}
.split2{grid-template-columns:1fr 380px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .msy{font-size:19px;color:var(--accent)}
.card .csub{font-size:12px;color:var(--sub);margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.kpi .k-val{font-size:26px;font-weight:800;margin:10px 0 1px;letter-spacing:-.5px}
.kpi .k-lbl{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .k-dl{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--danger)}
.chartbox{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fbf5f0}
tbody tr:hover{background:#fdf7f2}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Inter"}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-warn{background:var(--warnbg);color:var(--warn)}
.t-dan{background:var(--dangerbg);color:var(--danger)}
.t-info{background:#e0e7ff;color:#4338ca}
.t-mute{background:#f1eae4;color:#78716c}
.pane-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;height:fit-content}
.pane-list .ph{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
.li{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center;min-width:0}
.li:hover{background:#fdf7f2}
.li.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.li .av{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.li .lm{min-width:0;flex:1 1 auto}
.li .lm .n{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .lm .s{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .lr{text-align:right;flex:0 0 auto}
.li .lr .amt{font-weight:800;font-size:14px}
.li .lr .st{font-size:11px;color:var(--sub)}
.cart-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);min-width:0}
.cart-row .cn{flex:1 1 auto;min-width:0}
.cart-row .cn b{font-size:13.5px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-row .cn small{font-size:11.5px;color:var(--sub)}
.cart-row .cq{background:#f1eae4;border-radius:8px;padding:2px 9px;font-weight:700;font-size:12.5px;flex:0 0 auto}
.cart-row .cp{font-weight:800;font-size:14px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px 0;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.keypad button:hover{background:var(--accent-soft);border-color:var(--accent2)}
.keypad button.pay{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;grid-column:span 3;font-size:16px;padding:16px 0}
.totline{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--sub)}
.totline.big{border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-size:20px;color:var(--ink);font-weight:800}
.bar{height:9px;border-radius:999px;background:#f1eae4;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.col{background:#fbf5f0;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col > h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.chip-cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--sub)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;min-width:0}
.tk .tkt{font-weight:700;font-size:12.5px}
.tk .tkm{font-size:11px;color:var(--sub);margin-top:3px}
.tk .tkb{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl{position:relative;padding-left:24px;min-width:0}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
.tl .ev .et{font-weight:700;font-size:13px}
.tl .ev .em{font-size:11.5px;color:var(--sub)}
.tl .ev .ex{font-size:11px;color:var(--accent);font-weight:700}
.esl{border:2px solid #d6c8bd;border-radius:10px;padding:11px 13px;background:linear-gradient(180deg,#fffdfb,#fbf5f0);min-width:0}
.esl .en{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esl .ep{font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.esl .eo{font-size:12px;color:var(--sub);text-decoration:line-through}
.esl .ec{font-size:10.5px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.ai{background:linear-gradient(135deg,#fff7f2,#fff);border:1px solid var(--accent2)}
.ai .airow{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);min-width:0}
.ai .airow:last-child{border-bottom:0}
.ai .aic{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.ai .airow .at{font-weight:700;font-size:13px}
.ai .airow .ad{font-size:12px;color:var(--sub)}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center}
  .brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.08);flex:0 0 auto}
  .nav{flex-direction:row;flex-wrap:wrap;overflow-x:auto;padding:10px}
  .nav button{width:auto}
  .side .foot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.split,.split2,.board{grid-template-columns:1fr}
  .board{gap:10px}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:10px}
  .wrap{padding:16px 14px 40px}
  .top{padding:13px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="msy">storefront</span></div>
      <div><b>智慧門市 POS</b><span>Jvision Smart POS</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">單店範例資料 · 純前端展示<br/>© 2026 Jvision Demo</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="tt"><h1 id="scrTitle">前台收銀結帳</h1><p id="scrDesc">掃碼開單、混合支付與快速結帳</p></div>
      <div class="spacer"></div>
      <span class="pill"><span class="msy">wifi</span>門市連線正常</span>
      <span class="pill"><span class="msy">badge</span>收銀員 A03</span>
    </header>
    <div class="wrap"><div id="screen"></div></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"receipt_long",name:"前台收銀結帳",desc:"掃碼開單、混合支付與快速結帳"},
  {icon:"groups",name:"OMO 會員整合",desc:"線上線下會員、點數與消費軌跡"},
  {icon:"inventory_2",name:"門市進銷存",desc:"即時庫存、自動補貨與調撥"},
  {icon:"bolt",name:"電子標籤 ESL",desc:"電子貨架標籤與變價同步"},
  {icon:"request_quote",name:"分潤與對帳",desc:"門市分潤、金流對帳與撥款"},
  {icon:"insights",name:"AI 店務分析",desc:"營收、熱銷與班表智慧建議"}
];
var charts={};
function destroyChart(id){ if(charts[id]){ try{charts[id].destroy();}catch(e){} charts[id]=null; } }
function mkChart(id,cfg){ var el=document.getElementById(id); if(!el)return; destroyChart(id); charts[id]=new Chart(el.getContext("2d"),cfg); }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function nt(n){return n.toString().replace(/\B(?=([0-9]{3})+(?!\d))/g,",");}

function kpi(lbl,ic,val,unit,dir,dl){
  var dc=dir==="down"?"down":(dir==="up"?"up":"");
  var arrow=dir==="down"?"south_east":(dir==="up"?"north_east":"trending_flat");
  return '<div class="kpi"><div class="k-top"><div class="k-ico"><span class="msy">'+ic+'</span></div></div>'
    +'<div class="k-val">'+val+(unit?'<span style="font-size:14px;color:var(--sub);font-weight:600"> '+unit+'</span>':'')+'</div>'
    +'<div class="k-lbl">'+lbl+'</div>'
    +'<div class="k-dl '+dc+'"><span class="msy" style="font-size:15px">'+arrow+'</span>'+dl+'</div></div>';
}
function miniStat(l,v,s){return '<div class="card" style="padding:12px;background:#fbf5f0;border:0"><div style="font-size:11.5px;color:var(--sub);font-weight:600">'+l+'</div><div style="font-size:19px;font-weight:800;margin:2px 0">'+v+'</div><div style="font-size:11px;color:var(--sub)">'+s+'</div></div>';}

/* SCREEN 0 : 前台收銀結帳 */
function s0(){
  var cart=[
    {n:"手沖耶加雪菲 掛耳包",sku:"BEV-1042",q:2,p:180},
    {n:"經典拿鐵 中杯",sku:"BEV-2088",q:1,p:120},
    {n:"檸檬磅蛋糕",sku:"BKY-3301",q:1,p:95},
    {n:"環保保溫杯 480ml",sku:"GDS-7720",q:1,p:390},
    {n:"季節限定 果乾禮盒",sku:"GFT-9010",q:1,p:560}
  ];
  var sub=cart.reduce(function(a,c){return a+c.q*c.p;},0);
  var disc=Math.round(sub*0.1), tot=sub-disc;
  var rows=cart.map(function(c){return '<div class="cart-row"><div class="cq">x'+c.q+'</div><div class="cn"><b>'+esc(c.n)+'</b><small>'+c.sku+' · 單價 $'+c.p+'</small></div><div class="cp">$'+nt(c.q*c.p)+'</div></div>';}).join("");
  var pays=[
    {ic:"credit_card",n:"信用卡",c:"var(--accent)"},{ic:"qr_code_2",n:"行動支付",c:"#4338ca"},
    {ic:"payments",n:"現金",c:"#15803d"},{ic:"card_giftcard",n:"儲值卡",c:"#b45309"}
  ];
  var recent=[
    {no:"#T-20418",m:"王小美 · 金卡",amt:1290,t:"14:02",st:"已完成"},
    {no:"#T-20417",m:"散客",amt:220,t:"13:58",st:"已完成"},
    {no:"#T-20416",m:"陳大文 · 銀卡",amt:845,t:"13:51",st:"已退貨"},
    {no:"#T-20415",m:"林悠然 · 白金",amt:2640,t:"13:44",st:"已完成"},
    {no:"#T-20414",m:"散客",amt:95,t:"13:39",st:"已完成"}
  ];
  var recL=recent.map(function(r){var col=r.st==="已退貨"?"#a8a29e":"linear-gradient(135deg,var(--accent),var(--accent2))";var stc=r.st==="已退貨"?"t-mute":"t-ok";return '<div class="li"><div class="av" style="background:'+col+'">'+r.m.charAt(0)+'</div><div class="lm"><div class="n">'+r.no+'</div><div class="s">'+esc(r.m)+' · '+r.t+'</div></div><div class="lr"><div class="amt">$'+nt(r.amt)+'</div><div class="st"><span class="tag '+stc+'">'+r.st+'</span></div></div></div>';}).join("");
  return '<div class="grid split2">'
    + '<div class="grid" style="gap:16px">'
      + '<div class="grid g4">'
        + kpi("本日交易","point_of_sale","182","筆","up","較昨 +12%")
        + kpi("本日營收","payments","$96,840","","up","客單價 $532")
        + kpi("會員結帳占比","loyalty","64","%","up","+8pt")
        + kpi("平均結帳","timer","1.5","分","up","-4.9 分")
      + '</div>'
      + '<div class="card"><h3><span class="msy">shopping_cart</span>目前購物車 · #T-20419</h3><p class="csub">收銀員 A03 · 通道 2 · 會員：王小美（金卡）</p>'
        + rows
        + '<div style="margin-top:10px">'
          + '<div class="totline"><span>小計</span><span>$'+nt(sub)+'</span></div>'
          + '<div class="totline"><span>金卡會員 9 折</span><span style="color:var(--danger)">-$'+nt(disc)+'</span></div>'
          + '<div class="totline"><span>點數折抵</span><span>-$0</span></div>'
          + '<div class="totline big"><span>應收</span><span>$'+nt(tot)+'</span></div>'
        + '</div></div>'
      + '<div class="card"><h3><span class="msy">history</span>最近交易</h3><div style="overflow-x:auto">'+recL+'</div></div>'
    + '</div>'
    + '<div class="grid" style="gap:16px">'
      + '<div class="card"><h3><span class="msy">account_balance_wallet</span>支付方式</h3><p class="csub">選擇後可混合結帳</p>'
        + '<div class="grid g2" style="gap:10px">'+pays.map(function(p){return '<div class="card" style="text-align:center;padding:16px 8px;border-color:'+p.c+'"><span class="msy" style="font-size:30px;color:'+p.c+'">'+p.ic+'</span><div style="font-weight:700;font-size:13px;margin-top:6px">'+p.n+'</div></div>';}).join("")+'</div></div>'
      + '<div class="card"><h3><span class="msy">dialpad</span>快速輸入</h3>'
        + '<div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button>'+n+'</button>';}).join("")+'<button>·</button><button>0</button><button><span class="msy">backspace</span></button><button class="pay"><span class="msy">check_circle</span> 完成結帳 $'+nt(tot)+'</button></div></div>'
    + '</div>'
  + '</div>';
}

/* SCREEN 1 : OMO 會員整合 */
function s1(){
  var members=[
    {id:0,n:"王小美",lv:"金卡",pt:8420,sp:64200,ch:"門市+App",col:"#c2410c"},
    {id:1,n:"林悠然",lv:"白金",pt:15380,sp:142800,ch:"官網+門市",col:"#4338ca"},
    {id:2,n:"陳大文",lv:"銀卡",pt:2140,sp:18600,ch:"門市",col:"#15803d"},
    {id:3,n:"張家豪",lv:"金卡",pt:6720,sp:51200,ch:"App+外送",col:"#b45309"},
    {id:4,n:"李思妤",lv:"銀卡",pt:980,sp:9400,ch:"官網",col:"#0e7490"}
  ];

var RENDER=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="msy">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';}).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});});
}
function show(i){
  var cur=RENDER[i]?i:0;
  var container=document.getElementById("screen");
  document.getElementById("scrTitle").textContent=MODS[cur].name;
  document.getElementById("scrDesc").textContent=MODS[cur].desc;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===cur);});
  container.innerHTML=RENDER[cur]();
  void container.offsetHeight;
  initCharts(cur);
}
buildNav();
