<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart POS｜JVision Demo</title>
    <style>
      :root { color-scheme: dark; --bg:#08101c; --panel:rgba(22,32,51,.86); --line:rgba(139,211,255,.24); --text:#eef6ff; --muted:#9fb0c6; --blue:#8bd3ff; --green:#72e3a5; --purple:#a99cff; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 20% 10%,rgba(139,211,255,.24),transparent 28rem),radial-gradient(circle at 90% 0%,rgba(114,227,165,.18),transparent 30rem),linear-gradient(135deg,#07101c,#111827 48%,#070b12); }
      main { width:min(980px,100%); border:1px solid var(--line); border-radius:34px; background:linear-gradient(145deg,rgba(27,39,62,.92),rgba(12,18,30,.82)); box-shadow:0 24px 80px rgba(0,0,0,.38); padding:42px; }
      .eyebrow { margin:0 0 14px; color:var(--blue); font-size:.82rem; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
      h1 { margin:0 0 18px; font-size:clamp(2.4rem,6vw,5rem); line-height:1; letter-spacing:-.06em; }
      p { color:var(--muted); font-size:1.08rem; line-height:1.8; }
      .meta { display:flex; flex-wrap:wrap; gap:10px; margin:26px 0; }
      .pill { border:1px solid var(--line); border-radius:999px; padding:10px 14px; color:var(--blue); background:rgba(139,211,255,.1); font-weight:900; }
      .box { margin:24px 0; border:1px solid rgba(114,227,165,.28); border-radius:24px; padding:22px; background:rgba(114,227,165,.08); }
      .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
      a { min-height:46px; display:inline-flex; align-items:center; justify-content:center; padding:0 20px; border-radius:999px; color:inherit; font-weight:900; text-decoration:none; border:1px solid var(--line); background:rgba(255,255,255,.08); }
      a.primary { border:0; color:#07101c; background:linear-gradient(135deg,var(--blue),var(--purple)); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">JVision Legacy Project</p>
      <h1>Smart POS</h1>
      <p>此專案已整合進 JVision 單一入口網域。原始碼與專案資料已保留在 monorepo，後續可以再升級為互動式 Demo 頁面。</p>
      <div class="meta">
        <span class="pill">#25</span>
        <span class="pill">零售與服務</span>
        <span class="pill">既有系統 / 舊專案</span>
      </div>
      <section class="box">
        <p><strong>統一網址：</strong>/demos/jvision-smart-pos/</p>
        <p><strong>本地目錄：</strong>demos/jvision-smart-pos</p>
      </section>
      <div class="actions">
        <a class="primary" href="../../">回到 Demo Hub</a>
        <a href="https://github.com/JVision-pj/jvision-smart-pos" target="_blank" rel="noreferrer">查看 GitHub</a>
      </div>
    </main>
  </body>
</html>
