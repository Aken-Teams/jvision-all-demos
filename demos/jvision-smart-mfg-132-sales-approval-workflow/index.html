<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>業務簽核流程 Sales Approval Workflow</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#059669;
  --color-on-accent:#fff;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#2563eb;
  --radius:8px;
  --mono:"Fira Code",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,[role="button"],.tk,.qi{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:#fff;
  background:#0f172a;
  border-bottom:1px solid #334155
}
.tb-in{
  max-width:1440px;
  min-height:62px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:1px solid #60a5fa;
  border-radius:6px
}
.logo .material-symbols-outlined{font-size:22px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand span{display:block;margin-top:-2px;color:#cbd5e1;font-size:11px}
.spacer{flex:1}
.tb-user{
  min-height:36px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#e2e8f0;
  background:#1e293b;
  border:1px solid #475569;
  border-radius:6px;
  font-size:12px;
  white-space:nowrap
}
.av,.mini-av{
  display:inline-grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  font-weight:700
}
.av{width:24px;height:24px;border-radius:4px}
.mini-av{width:22px;height:22px;border-radius:4px;font-size:10px}
.nav{
  position:sticky;
  top:62px;
  z-index:29;
  background:#fff;
  border-bottom:1px solid var(--line)
}
.nav-in{
  max-width:1440px;
  margin:auto;
  padding:0 24px;
  display:flex;
  gap:2px;
  overflow-x:auto;
  scrollbar-width:thin
}
.nav button{
  min-height:48px;
  padding:0 15px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  color:#475569;
  background:transparent;
  border:0;
  border-bottom:3px solid transparent;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:color .18s ease,background-color .18s ease,border-color .18s ease
}
.nav button:hover{color:#1d4ed8;background:#eff6ff}
.nav button.on{color:#1d4ed8;background:#eff6ff;border-bottom-color:#2563eb}
.nav button .material-symbols-outlined{font-size:19px}
main{max-width:1440px;margin:auto;padding:22px 24px 64px}
.pg-head{
  margin-bottom:17px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  flex-wrap:wrap
}
.pg-head>div{flex:1;min-width:220px}
.pg-head h1{font-size:23px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.pg-head p{margin-top:5px;color:var(--muted);font-size:13px}
.pill,.chip,.cond{
  display:inline-flex;
  align-items:center;
  width:max-content;
  max-width:100%;
  font-weight:600;
  line-height:1.4
}
.pill{
  padding:5px 9px;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:5px;
  font-family:var(--mono);
  font-size:11px
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.k,.card,.appr{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius)
}
.k{
  min-height:136px;
  padding:14px;
  border-top:3px solid var(--color-primary);
  transition:border-color .18s ease,background-color .18s ease
}
.k:hover{border-color:#93b4fb;background:#fbfdff}
.k .ic{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:5px
}
.k .ic .material-symbols-outlined{font-size:20px}
.k .lb{margin-top:9px;color:var(--muted);font-size:12px;font-weight:500}
.k .vl{
  margin-top:1px;
  font-family:var(--mono);
  font-size:25px;
  font-weight:700;
  font-variant-numeric:tabular-nums
}
.k .dt{margin-top:1px;font-size:11px;font-weight:600}
.up{color:#047857}.dn{color:#b91c1c}.fl{color:#92400e}
.card{padding:16px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:3px;
  font-size:15px;
  font-weight:700
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.sub{margin-bottom:13px;color:var(--muted);font-size:12px}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px}
.g2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:1px solid var(--line);
  border-radius:var(--radius)
}
.col-h{padding:1px 2px 10px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:2px;border:1px solid rgba(15,23,42,.18)}
.col-h b{font-size:13px}
.cnt{
  margin-left:auto;
  padding:1px 7px;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  font-family:var(--mono);
  font-size:11px
}
.tk{
  margin-bottom:8px;
  padding:11px;
  background:#fff;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:6px;
  transition:border-color .18s ease,background-color .18s ease,transform .18s ease
}
.tk:hover{background:#f8fbff;border-color:#93b4fb;transform:translateY(-1px)}
.tk .no,.queue .no{
  color:var(--muted);
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600
}
.tk .ti{margin:3px 0 6px;font-size:13px;font-weight:600}
.tk .amt{
  color:#1d4ed8;
  font-family:var(--mono);
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums
}
.tk-meta,.tk-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.tk-meta{margin-top:8px;color:var(--muted)}
.tk-foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.chip{padding:3px 7px;border:1px solid currentColor;border-radius:4px;font-size:10.5px}
.steps{display:flex;gap:3px;margin-top:9px}
.st{height:5px;flex:1;background:#cbd5e1;border-radius:1px}
.st.done{background:#059669}.st.cur{background:#2563eb}.st.rej{background:#dc2626}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12.5px}
th{
  padding:10px;
  text-align:left;
  color:#334155;
  background:#f1f5fd;
  border-bottom:2px solid #cbdaf7;
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8fbff}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
td.b,td:first-child{
  font-family:var(--mono);
  font-weight:600
}
td.b:nth-child(n+3){text-align:right}
.b{font-weight:700}
.rt{overflow:hidden;border:1px solid var(--line);border-radius:6px}
.rt-row{
  padding:12px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap
}
.rt-row:last-child{border-bottom:0}
.rt-lv{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  border-radius:5px;
  font-family:var(--mono);
  font-weight:700
}
.rt-body{min-width:0;flex:1}
.rt-body b{font-size:13px}
.rt-body .d{color:var(--muted);font-size:11px}
.cond{
  padding:4px 7px;
  color:#1e40af;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:4px;
  font-size:11px
}
.appr{overflow:hidden}
.appr-h{
  padding:15px 17px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  color:#fff;
  background:#1e3a8a;
  border-bottom:4px solid #3b82f6
}
.appr-h .no{color:#dbeafe;font-family:var(--mono);font-size:11px}
.appr-h .t{font-size:17px;font-weight:700}
.appr-h .amt{
  margin-left:auto;
  font-family:var(--mono);
  font-size:19px;
  font-weight:700;
  font-variant-numeric:tabular-nums
}
.appr-b{padding:16px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:15px}
.cell{min-width:0;padding:9px;background:var(--color-muted);border:1px solid var(--line);border-radius:5px}
.cell .l{color:var(--muted);font-size:10.5px}
.cell .v{margin-top:2px;font-family:var(--mono);font-size:13px;font-weight:600}
.trail{position:relative;margin:7px 0 4px;padding-left:23px}
.trail:before{content:"";position:absolute;top:4px;bottom:4px;left:6px;width:2px;background:#cbdaf7}
.tr-item{position:relative;padding:0 0 15px 6px}
.tr-item:before{
  content:"";
  position:absolute;
  top:2px;
  left:-20px;
  width:13px;
  height:13px;
  background:#fff;
  border:3px solid #2563eb;
  border-radius:50%
}
.tr-item.ok:before{border-color:#059669}
.tr-item.now:before{border-color:#2563eb;background:#dbeafe}
.tr-item.wait:before{border-color:#94a3b8;background:#f1f5f9}
.tr-item .who{font-size:12.5px;font-weight:700}
.tr-item .meta{color:var(--muted);font-family:var(--mono);font-size:10.5px}
.tr-item .cmt{
  margin-top:5px;
  padding:7px 9px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:5px;
  font-size:11.5px
}
.btns{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  min-height:42px;
  padding:9px 15px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:5px;
  font-size:13px;
  font-weight:600;
  transition:background-color .18s ease,border-color .18s ease,color .18s ease
}
.btn-ok{color:#fff;background:#047857;border-color:#047857}
.btn-ok:hover{background:#065f46}
.btn-rej{color:#b91c1c;background:#fff;border-color:#dc2626}
.btn-rej:hover{background:#fef2f2}
.btn-more{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.btn-more:hover{background:#dbeafe}
.queue .qi{
  min-width:0;
  min-height:54px;
  margin-bottom:8px;
  padding:9px;
  display:flex;
  align-items:center;
  gap:9px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px;
  transition:border-color .18s ease,background-color .18s ease
}
.queue .qi:hover,.queue .qi.act{background:#eff6ff;border-color:#60a5fa}
.queue .n{min-width:0;flex:1}
.queue .t{overflow:hidden;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.au-item{
  min-width:0;
  margin-bottom:8px;
  padding:10px;
  display:flex;
  gap:11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px
}
.au-ic{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  border-radius:4px
}
.au-ic .material-symbols-outlined{font-size:18px}
.au-body{min-width:0;flex:1}
.au-body .l1{font-size:12.5px;font-weight:600}
.au-body .l2{margin-top:2px;color:var(--muted);font-size:11px}
.au-time{flex:none;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.legend{margin-top:10px;display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:2px}
.bar{position:relative;height:13px;overflow:hidden;border:1px solid #dbe4f5;border-radius:3px}
.note{
  margin-top:12px;
  padding:9px 10px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#334155;
  background:#f1f5fd;
  border:1px solid #cbdaf7;
  border-left:4px solid #2563eb;
  border-radius:5px;
  font-size:11.5px
}
.note .material-symbols-outlined{color:#1d4ed8;font-size:18px}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.mt{margin-top:14px}
.reveal{animation:reveal .36s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .tb-in,.nav-in{padding-left:16px;padding-right:16px}
  main{padding:18px 16px 50px}
  .g2,.g2b,.g3{grid-template-columns:1fr}
  .nav{top:62px}
}
@media(max-width:560px){
  .tb-in{min-height:58px}
  .brand span,.tb-user .nm{display:none}
  .nav{top:58px}
  .nav button{min-height:46px;padding:0 13px}
  .nav button .tx{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .k{min-height:126px;padding:11px}
  .k .vl{font-size:21px}
  .board,.kv{grid-template-columns:1fr}
  .pg-head h1{font-size:21px}
  .appr-h .amt{margin-left:0;width:100%}
  .au-time{white-space:normal;text-align:right}
}
@media(max-width:375px){
  main{padding-left:12px;padding-right:12px}
  .tb-in,.nav-in{padding-left:12px;padding-right:12px}
  .kpis{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
  .reveal{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
      <div><b>SignFlow 簽核中樞</b><span>業務簽核流程 · Sales Approval Workflow</span></div>

</header>
<nav class="nav" aria-label="主要導覽">
  <div class="nav-in" id="nav"></div>
</nav>
<main id="view"></main>
<script>

var NAV=[

function money(n){return "NT$ "+n.toLocaleString("en-US")}
var TYPES={quote:"報價",disc:"折扣",contract:"合約"};
var CASES=[
  {no:"AP-24817",title:"O昇精密 CNC 產線報價",cust:"O昇精密工業",type:"quote",amt:2860000,disc:0,rep:"林彥廷",repi:"林",cur:2,max:3,age:"3.2h",stat:"run",risk:"warn",due:"07/25",lvl:"財務長"},

  {no:"AP-24825",title:"O暘光電 面板模組合約",cust:"O暘光電",type:"contract",amt:5320000,disc:8,rep:"蔡雅涵",repi:"蔡",cur:0,max:4,age:"1.1h",stat:"wait",risk:"ok",due:"07/28",lvl:"業務經理"},
  {no:"AP-24829",title:"研O科技 IPC 主機報價",cust:"研O科技",type:"quote",amt:680000,disc:0,rep:"郭柏翰",repi:"郭",cur:1,max:2,age:"5.4h",stat:"run",risk:"ok",due:"07/26",lvl:"業務經理"},

function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1))
}
