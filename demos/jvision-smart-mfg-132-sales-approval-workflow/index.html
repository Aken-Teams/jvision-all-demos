<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務簽核流程 Sales Approval Workflow</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --c:#0891b2; --c2:#22d3ee; --ink:#0f2b33; --mut:#5b7480;
  --bg:#f1f6f8; --card:#ffffff; --line:#dbe8ec; --soft:#e8f5f8;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#06525f,#0891b2 60%,#0e7490);color:#fff;box-shadow:0 2px 14px rgba(6,82,95,.28)}
.tb-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.28)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{font-size:11px;opacity:.82;display:block;margin-top:-2px}
.spacer{flex:1;min-width:8px}
.tb-user{display:flex;align-items:center;gap:9px;font-size:12.5px;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:20px;white-space:nowrap}
.tb-user .av{width:24px;height:24px;border-radius:50%;background:var(--c2);color:#06333c;display:grid;place-items:center;font-weight:800;font-size:12px}
.nav{background:#06525f;border-bottom:3px solid var(--c2)}
.nav-in{max-width:1360px;margin:0 auto;padding:0 10px;display:flex;gap:2px;flex-wrap:wrap}
.nav button{min-width:0;flex:none;white-space:nowrap;background:transparent;border:0;color:#bfeef6;padding:11px 15px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;display:flex;align-items:center;gap:7px;transition:.15s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav button.on{color:#fff;border-bottom-color:var(--c2);background:rgba(34,211,238,.12)}
.nav button .material-symbols-outlined{font-size:19px}
main{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
.pg-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pg-head h1{font-size:21px;font-weight:800;letter-spacing:.3px}
.pg-head p{font-size:13px;color:var(--mut);margin-top:2px}
.pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--c);border:1px solid #bfe6ee;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.k::after{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:var(--soft)}
.k .ic{width:36px;height:36px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;position:relative;z-index:1}
.k .ic .material-symbols-outlined{font-size:21px}
.k .lb{font-size:12px;color:var(--mut);margin-top:9px;font-weight:600}
.k .vl{font-size:25px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1}
.k .dt{font-size:11.5px;font-weight:700;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:14.5px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--c)}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:13px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.col{background:#eaf4f7;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding:0 3px}
.col-h .dot{width:10px;height:10px;border-radius:50%}
.col-h b{font-size:13.5px;font-weight:800}
.col-h .cnt{margin-left:auto;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:11px;padding:11px;margin-bottom:9px;cursor:pointer;transition:.15s}
.tk:hover{box-shadow:0 4px 14px rgba(8,145,178,.14);transform:translateY(-1px)}
.tk .no{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.4px}
.tk .ti{font-size:13.5px;font-weight:700;margin:2px 0 6px}
.tk .amt{font-size:15px;font-weight:800;color:var(--c)}
.tk-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--mut)}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;display:inline-block}
.tk-foot{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px}
.mini-av{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.steps{display:flex;align-items:center;gap:3px;margin-top:8px}
.st{flex:1;height:5px;border-radius:4px;background:#d6e6ea}
.st.done{background:var(--ok)}.st.cur{background:var(--c2)}.st.rej{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#f6fbfc}
td{padding:10px;border-bottom:1px solid #eef4f6;vertical-align:middle}
tr:hover td{background:#f7fcfd}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.b{font-weight:800}
.bar{position:relative;height:15px;border-radius:8px;overflow:hidden}
.rt{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rt-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid #eef4f6;flex-wrap:wrap}
.rt-row:last-child{border-bottom:0}
.rt-lv{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.rt-body{min-width:0;flex:1}
.rt-body b{font-size:14px}
.rt-body .d{font-size:12px;color:var(--mut)}
.cond{font-size:12px;font-weight:700;background:var(--soft);border:1px solid #bfe6ee;color:var(--c);padding:3px 9px;border-radius:8px;white-space:nowrap}
.appr{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.appr-h{background:linear-gradient(100deg,#06525f,#0e7490);color:#fff;padding:15px 17px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.appr-h .no{font-size:12px;opacity:.85;font-weight:700}
.appr-h .t{font-size:17px;font-weight:800}
.appr-h .amt{margin-left:auto;font-size:20px;font-weight:800}
.appr-b{padding:16px 17px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
.kv .cell{background:#f6fbfc;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.kv .cell .l{font-size:11px;color:var(--mut);font-weight:600}
.kv .cell .v{font-size:14px;font-weight:800;margin-top:1px}
.trail{position:relative;padding-left:22px;margin:6px 0 4px}
.trail::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tr-item{position:relative;padding:0 0 15px 6px}
.tr-item::before{content:"";position:absolute;left:-19px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--c)}
.tr-item.ok::before{border-color:var(--ok)}
.tr-item.now::before{border-color:var(--c2);box-shadow:0 0 0 4px rgba(34,211,238,.22)}
.tr-item.wait::before{border-color:#c7d7dc;background:#eef4f6}
.tr-item .who{font-size:13px;font-weight:800}
.tr-item .meta{font-size:11.5px;color:var(--mut)}
.tr-item .cmt{font-size:12px;background:#f6fbfc;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:5px}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-ok{background:var(--ok);color:#fff}
.btn-rej{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn-more{background:var(--soft);color:var(--c);border:1px solid #bfe6ee}
.queue .qi{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;min-width:0}
.queue .qi:hover{border-color:var(--c);background:#f7fcfd}
.queue .qi.act{border-color:var(--c);background:var(--soft)}
.queue .qi .n{min-width:0;flex:1}
.queue .qi .n .no{font-size:11px;color:var(--mut);font-weight:700}
.queue .qi .n .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-item{display:flex;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff;min-width:0}
.au-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.au-ic .material-symbols-outlined{font-size:20px}
.au-body{min-width:0;flex:1}
.au-body .l1{font-size:13px;font-weight:700}
.au-body .l2{font-size:11.5px;color:var(--mut);margin-top:1px}
.au-time{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.mt{margin-top:14px}
.note{font-size:12px;color:var(--mut);background:#f6fbfc;border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.note .material-symbols-outlined{font-size:18px;color:var(--c)}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .g2,.g2b,.g3{grid-template-columns:1fr}
}
@media(max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button span.tx{display:none}
  .nav button{padding:11px 13px}
  .brand span{display:none}
  .tb-user .nm{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
      <div><b>SignFlow 簽核中樞</b><span>業務簽核流程 · Sales Approval Workflow</span></div>
    </div>
    <div class="spacer"></div>
    <div class="tb-user"><span class="material-symbols-outlined" style="font-size:18px">notifications</span><span class="nm">待我簽核 6</span></div>
    <div class="tb-user"><span class="av">陳</span><span class="nm">陳品妤 · 業務主管</span></div>
  </div>
</header>
<nav class="nav">
  <div class="nav-in" id="nav"></div>
</nav>
<main id="view"></main>

<script>
"use strict";
var view=document.getElementById("view");
var charts={};
function destroyCharts(){for(var k in charts){try{charts[k].destroy();}catch(e){}}charts={};}

var NAV=[
  {i:0,ic:"dashboard",t:"簽核看板"},
  {i:1,ic:"account_tree",t:"路由設定"},
  {i:2,ic:"request_quote",t:"申請單管理"},
  {i:3,ic:"fact_check",t:"簽核作業台"},
  {i:4,ic:"monitoring",t:"時效與合規"},
  {i:5,ic:"history",t:"歸檔稽核"}
];

var STATUS={
  ok:{bg:"#dcfce7",fg:"#166534",t:"核准"},
  wait:{bg:"#fef3c7",fg:"#92400e",t:"待審"},
  run:{bg:"#e0f2fe",fg:"#075985",t:"簽核中"},
  rej:{bg:"#fee2e2",fg:"#991b1b",t:"退回"},
  done:{bg:"#e8f5f8",fg:"#0e7490",t:"完成"}
};
function chip(s){var o=STATUS[s]||STATUS.wait;return '<span class="chip" style="background:'+o.bg+';color:'+o.fg+'">'+o.t+'</span>';}
function money(n){return "NT$ "+n.toLocaleString("en-US");}

var TYPES={quote:"報價",disc:"折扣",contract:"合約"};

var CASES=[
  {no:"AP-24817",title:"達昇精密 CNC 產線報價",cust:"達昇精密工業",type:"quote",amt:2860000,disc:0,rep:"林彥廷",repi:"林",cur:2,max:3,age:"3.2h",stat:"run",risk:"warn",due:"07/25",lvl:"財務長"},
  {no:"AP-24820",title:"宏翊採購 年度折扣 12%",cust:"宏翊股份",type:"disc",amt:1540000,disc:12,rep:"周孟儒",repi:"周",cur:1,max:3,age:"7.8h",stat:"run",risk:"bad",due:"07/24",lvl:"業務協理"},
  {no:"AP-24825",title:"友暘光電 面板模組合約",cust:"友暘光電",type:"contract",amt:5320000,disc:8,rep:"蔡雅涵",repi:"蔡",cur:0,max:4,age:"1.1h",stat:"wait",risk:"ok",due:"07/28",lvl:"業務經理"},
  {no:"AP-24829",title:"研宸科技 IPC 主機報價",cust:"研宸科技",type:"quote",amt:680000,disc:0,rep:"郭柏翰",repi:"郭",cur:1,max:2,age:"5.4h",stat:"run",risk:"ok",due:"07/26",lvl:"業務經理"},
  {no:"AP-24812",title:"和翊聯合 折扣 18% 申請",cust:"和翊聯合科技",type:"disc",amt:3210000,disc:18,rep:"林彥廷",repi:"林",cur:1,max:4,age:"9.6h",stat:"wait",risk:"bad",due:"07/24",lvl:"財務長"},
  {no:"AP-24833",title:"廣宸電腦 伺服器報價",cust:"廣宸電腦",type:"quote",amt:940000,disc:3,rep:"周孟儒",repi:"周",cur:0,max:2,age:"0.6h",stat:"wait",risk:"ok",due:"07/27",lvl:"業務經理"},
  {no:"AP-24805",title:"仁昱電腦 維運服務合約",cust:"仁昱電腦",type:"contract",amt:1180000,disc:5,rep:"蔡雅涵",repi:"蔡",cur:2,max:2,age:"—",stat:"done",risk:"ok",due:"07/22",lvl:"完成"},
  {no:"AP-24799",title:"奕嘉科技 折扣 9% 申請",cust:"奕嘉科技",type:"disc",amt:760000,disc:9,rep:"郭柏翰",repi:"郭",cur:1,max:1,age:"—",stat:"done",risk:"ok",due:"07/21",lvl:"完成"},
  {no:"AP-24818",title:"緯昌資通 特案報價 (超折扣)",cust:"緯昌資通",type:"quote",amt:2050000,disc:22,rep:"林彥廷",repi:"林",cur:1,max:4,age:"退回",stat:"rej",risk:"bad",due:"07/23",lvl:"退回補正"},
  {no:"AP-24790",title:"英昇達 產線改造合約",cust:"英昇達",type:"contract",amt:4470000,disc:6,rep:"蔡雅涵",repi:"蔡",cur:3,max:4,age:"12h",stat:"run",risk:"warn",due:"07/29",lvl:"財務長"}
];

function riskChip(r){
  if(r==="bad")return '<span class="chip" style="background:#fee2e2;color:#991b1b">逾時風險</span>';
  if(r==="warn")return '<span class="chip" style="background:#fef3c7;color:#92400e">留意</span>';
  return '<span class="chip" style="background:#dcfce7;color:#166534">正常</span>';
}
function stepBar(cur,max,rej){
  var h='<div class="steps">';
  for(var i=0;i<max;i++){
    var c="st";
    if(rej&&i===cur)c+=" rej";
    else if(i<cur)c+=" done";
    else if(i===cur&&!rej)c+=" cur";
    h+='<div class="'+c+'"></div>';
  }
  return h+'</div>';
}
function kpi(ic,lb,vl,cls,dt){
  return '<div class="k"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'
    +'<div class="lb">'+lb+'</div><div class="vl">'+vl+'</div><div class="dt '+cls+'">'+dt+'</div></div>';
}

/* ============ SCREEN 0 : KANBAN ============ */
function s0(){
  var cols=[
    {key:"wait",name:"待審",dot:"#d97706"},
    {key:"run",name:"簽核中",dot:"#0891b2"},
    {key:"rej",name:"退回補正",dot:"#dc2626"},
    {key:"done",name:"完成歸檔",dot:"#16a34a"}
  ];
  var h='';
  h+='<div class="pg-head"><div><h1>簽核看板</h1><p>待審、簽核中、退回、完成 — 拖曳式即時簽核狀態總覽</p></div><span class="pill">即時 · 10 筆申請單</span></div>';
  h+='<div class="kpis">'
    +kpi("inbox","待我簽核","6","fl","+2 今日新增")
    +kpi("schedule","平均簽核時效","5.6h","up","↓ 18.4h 較上季")
    +kpi("verified","簽核合規率","96.8%","up","↑ 3.1%")
    +kpi("warning","逾時風險案","3","dn","需即刻催辦")
    +'</div>';
  h+='<div class="board">';
  cols.forEach(function(col){
    var items=CASES.filter(function(c){return c.stat===col.key;});
    h+='<div class="col"><div class="col-h"><span class="dot" style="background:'+col.dot+'"></span><b>'+col.name+'</b><span class="cnt">'+items.length+'</span></div>';
    items.forEach(function(c){
      h+='<div class="tk" style="border-left-color:'+col.dot+'">'
        +'<div class="no">'+c.no+' · '+TYPES[c.type]+(c.disc?' '+c.disc+'%':'')+'</div>'
        +'<div class="ti">'+c.title+'</div>'
        +'<div class="amt">'+money(c.amt)+'</div>'
        +'<div class="tk-meta">'+riskChip(c.risk)+'<span>期限 '+c.due+'</span></div>'
        +stepBar(c.cur,c.max,c.stat==="rej")
        +'<div class="tk-foot"><span class="mini-av">'+c.repi+'</span><span>'+c.rep+'</span><span style="margin-left:auto;color:var(--mut)">'+(c.stat==="done"?"已歸檔":c.stat==="rej"?"待補正":c.lvl+" 簽核中")+'</span></div>'
        +'</div>';
    });
    if(!items.length)h+='<div style="text-align:center;color:var(--mut);font-size:12px;padding:18px 0">目前無案件</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="note"><span class="material-symbols-outlined">bolt</span><div>系統依<b>金額與折扣門檻</b>自動套用簽核路由，卡片進度條顯示目前簽核層級。折扣 ≥ 15% 或金額 ≥ 300 萬需加簽財務長。</div></div>';
  view.innerHTML=h;
  void view.offsetHeight;
}

/* ============ SCREEN 1 : ROUTING RULES ============ */
function s1(){

  });
  h+='<div class="legend"><span><i style="background:#16a34a"></i>核准</span><span><i style="background:#dc2626"></i>退回</span><span><i style="background:#0891b2"></i>作業</span><span><i style="background:#7c3aed"></i>最終核准</span></div>';
  h+='</div>';
  h+='</div>';
  view.innerHTML=h;
  void view.offsetHeight;
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  NAV.forEach(function(n){
    var b=document.getElementById("nb"+n.i);
    if(b)b.className=(n.i===i?"on":"");
  });
  (SCREENS[i]||s0)();
  try{window.scrollTo(0,0);}catch(e){}
}
(function(){
  var nh='';
  NAV.forEach(function(n){
    nh+='<button id="nb'+n.i+'" data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="tx">'+n.t+'</span></button>';
  });
  document.getElementById("nav").innerHTML=nh;
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
