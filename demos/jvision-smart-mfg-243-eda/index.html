<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EDA整合管理系統（電子電路設計整合平台）｜Jvision 系統 Demo</title>
  <meta name="description" content="電路原理圖與 Layout 版本管理、元件庫集中維護、DRC 流程整合的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#be185d;
      --accent2:#fb7185;
      --bg:#0b0e17;
      --panel:#121826;
      --panel2:#182033;
      --line:#243049;
      --txt:#e7ecf5;
      --muted:#93a0bd;
      --ok:#34d399;
      --warn:#fbbf24;
      --bad:#f87171;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,rgba(190,24,93,.18),transparent 60%),var(--bg);
      color:var(--txt);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    /* nav */
    .topnav{
      position:sticky;top:0;z-index:30;
      background:rgba(11,14,23,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand-logo{
      width:38px;height:38px;border-radius:10px;flex:0 0 auto;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 4px 16px rgba(190,24,93,.5);
    }
    .brand-logo .msi{font-size:22px;}
    .brand-txt{min-width:0;}
    .brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand-txt span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nav-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
    .nbtn{
      display:inline-flex;align-items:center;gap:7px;
      padding:8px 13px;border-radius:9px;cursor:pointer;
      background:transparent;border:1px solid transparent;color:var(--muted);
      font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;
      transition:.15s;
    }
    .nbtn .msi{font-size:18px;}
    .nbtn:hover{color:var(--txt);background:var(--panel2);}
    .nbtn.active{color:#fff;background:linear-gradient(135deg,var(--accent),#9d174d);border-color:var(--accent);box-shadow:0 4px 14px rgba(190,24,93,.4);}
    .live-dot{margin-left:6px;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
    .live-dot i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2);display:inline-block;}
    /* layout */
    .wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px;}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
    .sh-icon{
      width:46px;height:46px;border-radius:12px;flex:0 0 auto;
      background:var(--panel2);border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;color:var(--accent2);
    }
    .sh-icon .msi{font-size:26px;}
    .sh-txt{min-width:0;}
    .sh-txt h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.3px;}
    .sh-txt p{margin:3px 0 0;font-size:13px;color:var(--muted);}
    .sh-tag{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:var(--panel);}
    /* grids */
    .grid{display:grid;gap:14px;}
    .g-kpi{grid-template-columns:repeat(4,1fr);}
    .g-2{grid-template-columns:1.6fr 1fr;}
    .g-2e{grid-template-columns:1fr 1fr;}
    .g-3{grid-template-columns:repeat(3,1fr);}
    .g-side{grid-template-columns:240px 1fr;}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:repeat(2,1fr);}
      .g-2,.g-2e,.g-3,.g-side{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .g-kpi{grid-template-columns:1fr;}
      .nbtn span.lbl{display:none;}
      .nbtn{padding:8px 10px;}
    }
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
    .card.pad0{padding:0;overflow:hidden;}
    .card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
    .card-h h3{margin:0;font-size:14px;font-weight:700;}
    .card-h .msi{font-size:18px;color:var(--accent2);}
    .card-h .sub{font-size:12px;color:var(--muted);margin-left:auto;}
    /* kpi */
    .kpi{position:relative;overflow:hidden;}
    .kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
    .kpi .lab .msi{font-size:16px;color:var(--accent2);}
    .kpi .val{font-size:28px;font-weight:900;margin-top:8px;letter-spacing:.5px;}
    .kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;}
    .kpi .delta{font-size:12px;margin-top:6px;display:inline-flex;align-items:center;gap:4px;font-weight:600;}
    .kpi .delta.up{color:var(--ok);}
    .kpi .delta.down{color:var(--bad);}
    .kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(251,113,133,.14),transparent 70%);}
    /* chart */
    .chartbox{position:relative;width:100%;overflow:hidden;}
    /* table */
    .tbl-scroll{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{text-align:left;font-size:11px;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;}
    tbody td{padding:11px 12px;border-bottom:1px solid rgba(36,48,73,.5);white-space:nowrap;}
    tbody tr:hover{background:var(--panel2);}
    .mono{font-family:"Inter",monospace;letter-spacing:.5px;}
    /* pill */
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
    .pill .msi{font-size:14px;}
    .p-ok{background:rgba(52,211,153,.15);color:var(--ok);}
    .p-warn{background:rgba(251,191,36,.15);color:var(--warn);}
    .p-bad{background:rgba(248,113,113,.15);color:var(--bad);}
    .p-info{background:rgba(251,113,133,.15);color:var(--accent2);}
    .p-mute{background:var(--panel2);color:var(--muted);}
    /* progress */
    .bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:70px;}
    .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    /* board / kanban */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    @media(max-width:820px){.board{grid-template-columns:1fr;}}
    .col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
    .col-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-bottom:10px;color:var(--muted);}
    .col-h .n{margin-left:auto;background:var(--panel);border-radius:20px;padding:1px 8px;font-size:11px;}
    .tick{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;min-width:0;}
    .tick b{font-size:12.5px;display:block;}
    .tick .m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    /* timeline */
    .tl{position:relative;padding-left:22px;}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 16px 4px;}
    .tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(251,113,133,.2);}
    .tl-item.done::before{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2);}
    .tl-item .t{font-size:13px;font-weight:700;}
    .tl-item .d{font-size:11.5px;color:var(--muted);margin-top:3px;}
    .tl-item .ts{font-size:11px;color:var(--accent2);}
    /* lib tree */
    .libitem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:9px;min-width:0;}
    .libitem .ic{width:34px;height:34px;border-radius:9px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--accent2);flex:0 0 auto;}
    .libitem .info{min-width:0;flex:1;}
    .libitem .info b{font-size:13px;display:block;}
    .libitem .info span{font-size:11px;color:var(--muted);}
    /* stat row */
    .stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(36,48,73,.5);font-size:13px;gap:10px;}
    .stat-row:last-child{border-bottom:none;}
    .stat-row .k{color:var(--muted);min-width:0;}
    .stat-row .v{font-weight:700;white-space:nowrap;}
    /* donut center */
    .donut-wrap{position:relative;}
    .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
    .donut-center b{font-size:26px;font-weight:900;}
    .donut-center span{font-size:11px;color:var(--muted);}
    /* diff */
    .diffline{font-family:"Inter",monospace;font-size:12px;padding:5px 10px;border-radius:6px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .diff-add{background:rgba(52,211,153,.12);color:#7ee2bd;border-left:3px solid var(--ok);}
    .diff-del{background:rgba(248,113,113,.12);color:#f4a7a7;border-left:3px solid var(--bad);}
    .diff-mod{background:rgba(251,191,36,.1);color:#f5d489;border-left:3px solid var(--warn);}
    /* footer note */
    .note{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
    .note .msi{font-size:15px;}
    .flow-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .flow-strip .fs{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 11px;}
    .flow-strip .fs.on{color:#fff;border-color:var(--accent);background:linear-gradient(135deg,rgba(190,24,93,.4),rgba(157,23,77,.3));}
    .flow-strip .fs .msi{font-size:15px;color:var(--accent2);}
    .gauge-list .gl{margin-bottom:14px;}
    .gauge-list .gl .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
    .gauge-list .gl .top b{font-weight:700;}
    .gauge-list .gl .top span{color:var(--muted);}
    .layerbar{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(36,48,73,.5);font-size:12.5px;}
    .layerbar:last-child{border-bottom:none;}
    .layerbar .lc{width:16px;height:16px;border-radius:4px;flex:0 0 auto;}
    .layerbar .ln{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-logo"><span class="msi">memory</span></div>
        <div class="brand-txt">
          <b>EDA 整合管理系統</b>
          <span>電子電路設計整合平台 · Control Room</span>
        </div>
      </div>
      <div class="nav-btns" id="navBtns"></div>
    </div>
  </nav>
  <div class="wrap"><div id="view"></div></div>

  <script>
  (function(){
    "use strict";
    var C = document.getElementById("view");
    var charts = {};
    var accent = "#be185d", accent2 = "#fb7185";
    var gridColor = "rgba(148,160,189,.15)";
    var tickColor = "#93a0bd";

    var SCREENS = [
      {icon:"account_tree", name:"原理圖版本", title:"原理圖版本管理", desc:"Schematic 版本控管、分支與差異比對"},
      {icon:"precision_manufacturing", name:"Layout 佈局", title:"Layout 佈局管理", desc:"PCB 佈局版次、疊層與變更追蹤"},
      {icon:"inventory_2", name:"元件庫", title:"元件庫集中維護", desc:"Library 符號封裝集中維護與版本同步"},
      {icon:"rule", name:"DRC 檢查", title:"DRC 設計規則檢查", desc:"設計規則檢查違規清單與判定"},
      {icon:"fact_check", name:"審查放行", title:"設計審查放行", desc:"設計凍結審查、簽核與 Tape-out 放行"},
      {icon:"insights", name:"洞察站", title:"EDA 洞察站", desc:"版本、違規與專案準時率整合洞察"}
    ];

    // ---------- helpers ----------
    function el(html){var d=document.createElement("div");d.innerHTML=html;return d;}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
    function chartCommon(){
      return {
        maintainAspectRatio:false,
        responsive:true,
        plugins:{legend:{labels:{color:tickColor,font:{size:11},boxWidth:12}}},
        scales:{
          x:{ticks:{color:tickColor,font:{size:11}},grid:{color:gridColor}},
          y:{ticks:{color:tickColor,font:{size:11}},grid:{color:gridColor}}
        }
      };
    }
    function mkChart(id,cfg){
      var cv = document.getElementById(id);
      if(!cv) return;
      if(charts[id]){try{charts[id].destroy();}catch(e){}charts[id]=null;}
      charts[id] = new Chart(cv.getContext("2d"), cfg);
    }
    function destroyAll(){
      for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}}}
      charts={};
    }
    function head(i){
      var s=SCREENS[i];
      var strip = SCREENS.map(function(x,idx){
        return '<span class="fs'+(idx===i?' on':'')+'"><span class="msi">'+x.icon+'</span>'+x.name+'</span>';
      }).join('');
      return '<div class="screen-head">'
        + '<div class="sh-icon"><span class="msi">'+s.icon+'</span></div>'
        + '<div class="sh-txt"><h1>'+s.title+'</h1><p>'+s.desc+'</p></div>'
        + '<div class="sh-tag">v'+i+' · 即時終端</div>'
        + '</div>'
        + '<div class="flow-strip">'+strip+'</div>';
    }
    function kpi(lab,ic,val,unit,delta,dir){
      return '<div class="card kpi"><div class="lab"><span class="msi">'+ic+'</span>'+lab+'</div>'
        +'<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
        +(delta?'<div class="delta '+dir+'"><span class="msi">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div>':'')
        +'</div>';
    }

    // ================= SCREEN 0 : 原理圖版本管理 =================
    function s0(){
      var rows=[
        {p:"PWR-CTRL 電源控管板",ver:"v4.2",br:"main",eng:"林昀珊",st:"進行中",stc:"p-info",chg:18,pct:72},
        {p:"RF-FE 射頻前端模組",ver:"v2.7",br:"feat/lna",eng:"陳柏叡",st:"待審查",stc:"p-warn",chg:9,pct:55},
        {p:"MCU-Core 主控板",ver:"v6.1",br:"main",eng:"黃詩涵",st:"已凍結",stc:"p-ok",chg:3,pct:100},
        {p:"SENS-HUB 感測集線板",ver:"v1.9",br:"feat/i2c",eng:"吳承翰",st:"進行中",stc:"p-info",chg:24,pct:41},
        {p:"PWR-CTRL 電源控管板",ver:"v4.1",br:"hotfix",eng:"林昀珊",st:"衝突",stc:"p-bad",chg:6,pct:88}
      ];
      var diff=[
        {t:"add",x:"+ 新增 U12 LDO 穩壓器 (TPS7A47)"},
        {t:"mod",x:"~ R33 阻值 10k → 4.7k（分壓調整）"},
        {t:"del",x:"- 移除 C21 旁路電容（DRC 建議）"},
        {t:"add",x:"+ 新增 TP7/TP8 測試點"},
        {t:"mod",x:"~ NET_VBUS 重新命名為 NET_5V0"}
      ];
      var html = head(0)
        + '<div class="grid g-kpi" style="margin-bottom:14px;">'
        + kpi("進行中版本","account_tree","12","版本","本週 +3","up")
        + kpi("待審查","pending_actions","4","件","2 件逾時","down")
        + kpi("已凍結版本","lock","7","版本","+1","up")
        + kpi("版本衝突","merge_type","1","件","需人工合併","down")
        + '</div>'
        + '<div class="grid g-2" style="margin-bottom:14px;">'
        + '<div class="card pad0"><div class="card-h" style="padding:16px 16px 0;"><span class="msi">rule_folder</span><h3>原理圖版本清單</h3><span class="sub">共 5 筆</span></div>'
        + '<div class="tbl-scroll"><table><thead><tr><th>專案 / 圖檔</th><th>版次</th><th>分支</th><th>負責人</th><th>狀態</th><th>變更</th><th>完成度</th></tr></thead><tbody>'
        + rows.map(function(r){
            return '<tr><td>'+esc(r.p)+'</td><td class="mono">'+r.ver+'</td><td><span class="pill p-mute">'+r.br+'</span></td><td>'+r.eng+'</td>'
              +'<td><span class="pill '+r.stc+'">'+r.st+'</span></td><td class="mono">'+r.chg+'</td>'
              +'<td><div style="display:flex;align-items:center;gap:8px;"><div class="bar"><i style="width:'+r.pct+'%"></i></div><span style="font-size:11px;color:var(--muted)">'+r.pct+'%</span></div></td></tr>';
          }).join('')
        + '</tbody></table></div></div>'
        + '<div class="card"><div class="card-h"><span class="msi">difference</span><h3>版本差異比對</h3><span class="sub">v4.1 → v4.2</span></div>'
        + diff.map(function(d){return '<div class="diffline diff-'+d.t+'">'+esc(d.x)+'</div>';}).join('')
        + '<div class="note"><span class="msi">info</span>共 5 項變更，其中 2 項由 DRC 觸發</div></div>'
        + '</div>'
        + '<div class="card"><div class="card-h"><span class="msi">show_chart</span><h3>近 8 週原理圖提交量</h3><span class="sub">建版 / 審查</span></div>'
        + '<div class="chartbox" style="height:260px"><canvas id="c0a"></canvas></div></div>';
      C.innerHTML = html;
      void C.offsetHeight;
      mkChart("c0a",{type:"bar",data:{labels:["W1","W2","W3","W4","W5","W6","W7","W8"],
        datasets:[
          {label:"建版",data:[6,8,7,11,9,13,12,14],backgroundColor:accent,borderRadius:5},
          {label:"審查通過",data:[4,5,6,8,7,10,9,12],backgroundColor:accent2,borderRadius:5}
        ]},options:chartCommon()});
    }

    // ================= SCREEN 1 : Layout 佈局管理 =================
    function s1(){
      var layers=[
        {n:"Top Copper (訊號)",c:"#fb7185",pct:82},
        {n:"GND Plane (接地)",c:"#34d399",pct:96},
        {n:"PWR Plane (電源)",c:"#fbbf24",pct:71},
        {n:"Inner Signal 1",c:"#60a5fa",pct:64},
        {n:"Inner Signal 2",c:"#a78bfa",pct:58},
        {n:"Bottom Copper",c:"#be185d",pct:77}
      ];
      var rows=[
        {b:"PWR-CTRL",lv:"L4.2",layer:"6 層",area:"88×62mm",via:342,rt:"92%",st:"佈線中",stc:"p-info"},
        {b:"RF-FE",lv:"L2.7",layer:"4 層",area:"45×40mm",via:118,rt:"78%",st:"阻抗調整",stc:"p-warn"},
        {b:"MCU-Core",lv:"L6.1",layer:"8 層",area:"120×90mm",via:986,rt:"100%",st:"完成",stc:"p-ok"},
        {b:"SENS-HUB",lv:"L1.9",layer:"4 層",area:"52×36mm",via:204,rt:"41%",st:"擺件中",stc:"p-info"}
      ];
      var html = head(1)

      i = Math.max(0, Math.min(i, RENDER.length-1));

      var btns = document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){
        if(+btns[b].getAttribute("data-i")===i) btns[b].classList.add("active");

    var nb = document.querySelectorAll("[data-i]");
    for(var q=0;q<nb.length;q++){
      (function(btn){
        btn.addEventListener("click",function(){
          var idx=+btn.getAttribute("data-i");
          if(location.hash!=="#v"+idx){location.hash="v"+idx;} else {show(idx);}
        });
      })(nb[q]);
    }

    window.show = show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
