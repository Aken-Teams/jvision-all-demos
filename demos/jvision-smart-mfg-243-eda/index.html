<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EDA整合管理系統（電子電路設計整合平台）｜Jvision 系統 Demo</title>
  <meta name="description" content="電路原理圖與 Layout 版本管理、元件庫集中維護、DRC 流程整合的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap');

:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:#F5FBF7;
  --txt:var(--color-foreground);
  --ok:#15803D;
  --warn:#A15C05;
  --bad:#B91C1C;
  --shadow:0 1px 2px rgba(20,83,45,.06),0 8px 24px rgba(20,83,45,.06);
  --shadow-raised:0 2px 4px rgba(20,83,45,.08),0 14px 32px rgba(20,83,45,.10);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(21,128,61,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Exo",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[data-i]{cursor:pointer;}
::selection{color:var(--color-on-primary);background:var(--color-primary);}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}

:where(button,a,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(21,128,61,.15);
}

.topnav{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 0 rgba(20,83,45,.04);
  backdrop-filter:blur(14px);
}
.nav-inner{
  width:min(100%,1440px);
  min-height:66px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:250px;}
.brand-logo{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid #126B35;
  border-radius:4px;
  box-shadow:4px 4px 0 rgba(21,128,61,.16);
}
.brand-logo .msi{font-size:23px;}
.brand-txt{min-width:0;}
.brand-txt b{
  display:block;
  overflow:hidden;
  color:var(--color-foreground);
  font-size:15px;
  font-weight:700;
  letter-spacing:.035em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  overflow:hidden;
  color:var(--color-muted-foreground);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav-btns{display:flex;align-items:center;gap:4px;margin-left:auto;min-width:0;}
.nbtn{
  min-height:40px;
  padding:8px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nbtn .msi{font-size:18px;}
.nbtn:hover{color:var(--color-primary);background:#ECFDF3;border-color:var(--color-border);}
.nbtn.active{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.14);
}
.live-dot{
  margin-left:7px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--color-muted-foreground);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  font-weight:500;
}
.live-dot i{
  width:8px;
  height:8px;
  display:inline-block;
  background:var(--color-secondary);
  border:2px solid #FFFFFF;
  border-radius:50%;
  box-shadow:0 0 0 2px var(--color-primary);
}

.wrap{width:min(100%,1440px);margin:0 auto;padding:24px 24px 64px;}
.screen-head{
  position:relative;
  margin-bottom:14px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-left:5px solid var(--color-primary);
  border-radius:4px;
  box-shadow:var(--shadow);
}
.sh-icon{
  width:44px;
  height:44px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#ECFDF3;
  border:1px solid var(--color-border);
  border-radius:3px;
}
.sh-icon .msi{font-size:25px;}
.sh-txt{min-width:0;}
.sh-txt h1{margin:0;color:var(--color-foreground);font-size:21px;font-weight:700;letter-spacing:.015em;line-height:1.25;}
.sh-txt p{margin:4px 0 0;color:var(--color-muted-foreground);font-size:12px;}
.sh-tag{
  margin-left:auto;
  padding:5px 9px;
  align-self:center;
  color:var(--color-primary);
  background:#ECFDF3;
  border:1px solid var(--color-border);
  border-radius:2px;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}

.flow-strip{
  position:relative;
  margin:0 0 14px;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:5px;
  background:rgba(255,255,255,.72);
  border:1px solid var(--color-border);
  border-radius:4px;
}
.flow-strip::after{
  content:"";
  position:absolute;
  right:8px;
  bottom:-1px;
  left:8px;
  height:2px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
}
.flow-strip .fs{
  min-height:34px;
  padding:6px 8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:1px solid transparent;
  border-radius:2px;
  font-size:10px;
  font-weight:600;
  text-align:center;
}
.flow-strip .fs.on{color:var(--color-on-primary);background:var(--color-primary);border-color:var(--color-primary);}
.flow-strip .fs .msi{color:currentColor;font-size:15px;}

.grid{display:grid;gap:12px;}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-side{grid-template-columns:240px minmax(0,1fr);}

.card{
  min-width:0;
  padding:15px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:4px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#86E9AA;box-shadow:var(--shadow-raised);}
.card.pad0{padding:0;overflow:hidden;}
.card-h{
  min-height:28px;
  margin-bottom:10px;
  padding-bottom:9px;
  display:flex;
  align-items:center;
  gap:7px;
  border-bottom:1px solid var(--color-border);
}
.card-h h3{margin:0;color:var(--color-foreground);font-size:13px;font-weight:700;letter-spacing:.02em;}
.card-h .msi{color:var(--color-primary);font-size:18px;}
.card-h .sub{margin-left:auto;color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10px;}
.card.pad0>.card-h{margin-bottom:0;}

.kpi{position:relative;min-height:112px;overflow:hidden;border-top:3px solid var(--color-primary);}
.kpi::after{
  content:"";
  position:absolute;
  right:-18px;
  bottom:-32px;
  width:88px;
  height:88px;
  border:14px solid rgba(34,197,94,.09);
  border-radius:50%;
}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:11px;font-weight:600;}
.kpi .lab .msi{color:var(--color-primary);font-size:16px;}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:7px;
  color:var(--color-foreground);
  font-family:"Roboto Mono",monospace;
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
  line-height:1.15;
}
.kpi .val small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Exo",sans-serif;font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .delta{margin-top:6px;display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;}
.kpi .delta .msi{font-size:14px;}
.kpi .delta.up{color:#126B35;}
.kpi .delta.down{color:#9F1239;}

.chartbox{position:relative;width:100%;overflow:hidden;}
.tbl-scroll{overflow-x:auto;scrollbar-color:#86E9AA #F0FDF4;}
table{width:100%;border-collapse:collapse;color:#243C2C;font-size:12px;font-variant-numeric:tabular-nums;}
thead th{
  padding:9px 11px;
  color:#315B42;
  background:#E7F8ED;
  border-bottom:2px solid var(--color-primary);
  font-size:10px;
  font-weight:700;
  letter-spacing:.055em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
tbody td{padding:9px 11px;border-bottom:1px solid #D7EFDF;white-space:nowrap;}
tbody tr:nth-child(even){background:#FAFEFB;}
tbody tr:hover{background:#ECFDF3;}
tbody tr:last-child td{border-bottom:0;}
td:nth-last-child(-n+3){font-variant-numeric:tabular-nums;}
.mono,.diffline,.sh-tag,.brand-txt span{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:0;}
td.mono{text-align:right;}
td:first-child.mono{text-align:left;}

.pill{
  min-height:22px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.pill .msi{font-size:13px;}
.p-ok{color:#126B35;background:#DCFCE7;}
.p-warn{color:#854D0E;background:#FEF3C7;}
.p-bad{color:#991B1B;background:#FEE2E2;}
.p-info{color:#14532D;background:#DCFCE7;}
.p-mute{color:#475569;background:#EEF2F2;}

.bar{height:6px;min-width:70px;overflow:hidden;background:#DCE9E1;border:1px solid #CAE3D3;border-radius:1px;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:0;}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
.col{min-width:0;padding:9px;background:#F5FBF7;border:1px solid var(--color-border);border-top:3px solid var(--color-primary);border-radius:3px;}
.col-h{margin-bottom:8px;display:flex;align-items:center;gap:5px;color:#315B42;font-size:11px;font-weight:700;}
.col-h .n{margin-left:auto;padding:1px 7px;color:var(--color-on-primary);background:var(--color-primary);border-radius:10px;font-family:"Roboto Mono",monospace;font-size:9px;}
.tick{min-width:0;margin-bottom:7px;padding:9px;background:var(--color-card);border:1px solid var(--color-border);border-radius:2px;box-shadow:0 1px 2px rgba(20,83,45,.06);}
.tick:last-child{margin-bottom:0;}
.tick b{display:block;font-size:11px;}
.tick .m{margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:10px;}

.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--color-border);}
.tl-item{position:relative;padding:0 0 16px 5px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:"schedule";
  position:absolute;
  top:1px;
  left:-23px;
  width:16px;
  height:16px;
  display:grid;
  place-items:center;
  color:#854D0E;
  background:#FEF3C7;
  border:1px solid #D97706;
  border-radius:50%;
  font-family:"Material Symbols Outlined";
  font-size:10px;
}
.tl-item.done::before{content:"check";color:var(--color-on-primary);background:var(--color-primary);border-color:var(--color-primary);}
.tl-item .t{font-size:12px;font-weight:700;}
.tl-item .d{margin-top:2px;color:var(--color-muted-foreground);font-size:10.5px;}
.tl-item .ts{color:var(--color-primary);font-family:"Roboto Mono",monospace;font-size:9px;font-weight:700;}

.libitem{min-width:0;margin-bottom:7px;padding:9px;display:flex;align-items:center;gap:9px;background:#F8FCF9;border:1px solid var(--color-border);border-radius:3px;}
.libitem:last-child{margin-bottom:0;}
.libitem .ic{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;color:var(--color-primary);background:#E7F8ED;border:1px solid var(--color-border);border-radius:2px;}
.libitem .info{min-width:0;flex:1;}
.libitem .info b{display:block;font-size:12px;}
.libitem .info span{color:var(--color-muted-foreground);font-size:10px;}

.stat-row{padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #D7EFDF;font-size:12px;}
.stat-row:last-child{border-bottom:0;}
.stat-row .k{min-width:0;color:var(--color-muted-foreground);}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

.donut-wrap{position:relative;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-center b{color:var(--color-foreground);font-family:"Roboto Mono",monospace;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
.donut-center span{color:var(--color-muted-foreground);font-size:10px;}

.diffline{margin-bottom:5px;padding:6px 9px;overflow:hidden;border-radius:2px;font-size:10.5px;text-overflow:ellipsis;white-space:nowrap;}
.diff-add{color:#126B35;background:#E7F8ED;border-left:3px solid var(--color-primary);}
.diff-del{color:#991B1B;background:#FEE2E2;border-left:3px solid var(--color-destructive);}
.diff-mod{color:#854D0E;background:#FEF3C7;border-left:3px solid var(--color-accent);}

.note{margin-top:9px;display:flex;align-items:flex-start;gap:6px;color:var(--color-muted-foreground);font-size:10.5px;line-height:1.5;}
.note .msi{margin-top:1px;color:var(--color-primary);font-size:14px;}
.gauge-list .gl{margin-bottom:12px;}
.gauge-list .gl:last-child{margin-bottom:0;}
.gauge-list .gl .top{margin-bottom:5px;display:flex;justify-content:space-between;gap:10px;font-size:11px;}
.gauge-list .gl .top b{font-weight:700;}
.gauge-list .gl .top span{color:var(--color-muted-foreground);}
.layerbar{padding:7px 0;display:flex;align-items:center;gap:9px;border-bottom:1px solid #D7EFDF;font-size:11px;}
.layerbar:last-child{border-bottom:0;}
.layerbar .lc{width:14px;height:14px;flex:0 0 auto;border:1px solid rgba(20,83,45,.22);border-radius:2px;}
.layerbar .ln{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

@media (hover:hover){
  .nbtn:hover{transform:translateY(-1px);}
  .card:hover{transform:translateY(-1px);}
}

@media (prefers-reduced-motion:no-preference){
  .screen-head,.flow-strip,.card{animation:reveal .36s ease-out both;}
  .grid>.card:nth-child(2){animation-delay:.04s;}
  .grid>.card:nth-child(3){animation-delay:.08s;}
  .grid>.card:nth-child(4){animation-delay:.12s;}
  @keyframes reveal{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}

@media(max-width:1100px){
  .nav-inner{align-items:flex-start;flex-wrap:wrap;}
  .brand{min-width:0;}
  .nav-btns{width:100%;margin-left:0;overflow-x:auto;padding-bottom:2px;}
  .nbtn{flex:0 0 auto;}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:820px){
  .wrap{padding:18px 16px 48px;}
  .nav-inner{padding:9px 16px;}
  .g-2,.g-2e,.g-3,.g-side{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
  .flow-strip{display:flex;overflow-x:auto;}
  .flow-strip .fs{min-width:130px;}
  .screen-head{align-items:flex-start;}
  .sh-tag{margin-left:auto;}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .wrap{padding:14px 12px 40px;}
  .nav-inner{padding:8px 12px;}
  .brand-logo{width:36px;height:36px;}
  .brand-txt b{font-size:13px;}
  .brand-txt span{font-size:9px;}
  .nbtn{min-width:42px;min-height:42px;justify-content:center;padding:9px;}
  .nbtn span.lbl{display:none;}
  .live-dot{margin-left:auto;}
  .screen-head{padding:14px;}
  .sh-icon{width:38px;height:38px;}
  .sh-txt h1{font-size:17px;}
  .sh-txt p{font-size:11px;}
  .sh-tag{width:100%;margin:2px 0 0 52px;}
  .g-kpi,.board{grid-template-columns:1fr;}
  .card{padding:12px;}
  .kpi{min-height:102px;}
  .kpi .val{font-size:24px;}
  .stat-row{align-items:flex-start;flex-direction:column;}
  .stat-row .v{width:100%;text-align:left;white-space:normal;}
  .gauge-list .gl .top{align-items:flex-start;flex-direction:column;}
  .layerbar .bar{width:82px!important;}
}
</style>
</head>
<body>
  <nav class="topnav">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-logo"><span class="msi">memory</span></div>
        <div class="brand-txt">
          <b>EDA 整合管理系統</b>
          <span>電子電路設計整合平台 · Control Room</span>
        </div>
      </div>
      <div class="nav-btns" id="navBtns"></div>
    </div>
  </nav>
  <div class="wrap"><div id="view"></div></div>

  <script>
  (function(){
    "use strict";
    var C = document.getElementById("view");
    var charts = {};
    var accent = "#15803D", accent2 = "#22C55E";
    var gridColor = "rgba(20,83,45,.12)";
    var tickColor = "#475569";

    var SCREENS = [
      {icon:"account_tree", name:"原理圖版本", title:"原理圖版本管理", desc:"Schematic 版本控管、分支與差異比對"},

        + '<div class="card" style="margin-bottom:14px;"><div class="card-h"><span class="msi">view_kanban</span><h3>審查放行看板</h3><span class="sub">送審 → 放行</span></div>'
        + '<div class="board">'
        + cols.map(function(c){
            var list=board[c.k]||[];
            return '<div class="col"><div class="col-h"><span class="msi" style="font-size:16px;color:var(--accent2)">'+c.ic+'</span>'+c.n+'<span class="n">'+list.length+'</span></div>'
              + list.map(function(x){return '<div class="tick"><b>'+esc(x.t)+'</b><div class="m"><span class="pill '+x.p+'">'+esc(x.m)+'</span></div></div>';}).join('')
              + '</div>';
          }).join('')
        + '</div></div>'
        + '<div class="grid g-2">'
        + '<div class="card"><div class="card-h"><span class="msi">history</span><h3>審查放行歷程</h3><span class="sub">PWR-CTRL v4.2</span></div>'
        + '<div class="tl">'
        + tl.map(function(t){return '<div class="tl-item'+(t.done?' done':'')+'"><div class="ts">'+t.ts+'</div><div class="t">'+esc(t.t)+'</div><div class="d">'+esc(t.d)+'</div></div>';}).join('')
        + '</div></div>'
        + '<div class="card"><div class="card-h"><span class="msi">fact_check</span><h3>放行檢核清單</h3></div>'
        + [["DRC 違規清零","done"],["元件庫版本一致","done"],["BOM 與原理圖對齊","done"],["設計凍結審查簽核","doing"],["Tape-out 製造檔歸檔","wait"]].map(function(x){
            var pill = x[1]==="done"?'<span class="pill p-ok"><span class="msi">check</span>完成</span>'
              : x[1]==="doing"?'<span class="pill p-warn">進行中</span>'
              : '<span class="pill p-mute">待辦</span>';
            return '<div class="stat-row"><span class="k">'+esc(x[0])+'</span><span class="v">'+pill+'</span></div>';
          }).join('')
        + '<div class="note"><span class="msi">gavel</span>RULE-03：共享設備排程衝突時，依量產承諾日排序放行</div></div>'
        + '</div>';
      C.innerHTML = html;
      void C.offsetHeight;
    }

    // ================= SCREEN 5 : EDA 洞察站 =================
    function s5(){
      var kpis=[
        {label:"設計變更工時",before:8.3,after:2,unit:"小時"},
        {label:"文件版本錯誤",before:6.1,after:1,unit:"件/月"},
        {label:"專案準時率",before:70,after:86,unit:"%"},
        {label:"資料查找時間",before:29,after:5.3,unit:"分鐘"}
      ];
      var html = head(5)
        + '<div class="grid g-kpi" style="margin-bottom:14px;">'
        + kpi("在管專案","folder_special","16","案","4 案凍結中","")
        + kpi("專案準時率","trending_up","86","%","+16pt","up")
        + kpi("版本一致率","verified","93","%","+9pt","up")
        + kpi("待處理告警","notifications_active","6","件","2 高風險","down")
        + '</div>'
        + '<div class="grid g-2" style="margin-bottom:14px;">'
        + '<div class="card"><div class="card-h"><span class="msi">insights</span><h3>專案準時率趨勢</h3><span class="sub">近 6 週</span></div>'
        + '<div class="chartbox" style="height:250px"><canvas id="c5a"></canvas></div></div>'
        + '<div class="card"><div class="card-h"><span class="msi">query_stats</span><h3>導入前後對比</h3><span class="sub">關鍵指標</span></div>'
        + '<div style="margin-top:4px;">'
        + kpis.map(function(k){
            var imp;
            if(k.label==="專案準時率"){imp="+"+(k.after-k.before).toFixed(0)+" pt";}
            else{imp="-"+Math.round((1-k.after/k.before)*100)+"%";}
            return '<div class="stat-row"><span class="k">'+esc(k.label)+'</span>'
              +'<span class="v"><span style="color:var(--muted);text-decoration:line-through;font-weight:500">'+k.before+'</span>'
              +' <span class="msi" style="font-size:14px;color:var(--accent2)">arrow_forward</span> '
              +'<span style="color:var(--ok)">'+k.after+k.unit+'</span> '
              +'<span class="pill p-info" style="margin-left:6px">'+imp+'</span></span></div>';
          }).join('')
        + '</div></div>'
        + '</div>'
        + '<div class="grid g-2e">'
        + '<div class="card"><div class="card-h"><span class="msi">stacked_bar_chart</span><h3>各專案版本 / 違規量</h3></div>'
        + '<div class="chartbox" style="height:250px"><canvas id="c5b"></canvas></div></div>'
        + '<div class="card"><div class="card-h"><span class="msi">lightbulb</span><h3>AI 洞察與建議</h3></div>'
        + [["priority_high","p-bad","USB-C 連接器庫版本落後 2 版，已造成 1 件放行阻擋，建議立即同步 lib-2026.03。"],
           ["schedule","p-warn","RF-FE 阻抗調整占用最多工時，建議導入預設疊層模板縮短返工。"],
           ["trending_up","p-ok","原理圖建版審查週期較上月縮短 22%，版本控管流程收斂良好。"]].map(function(x){
            return '<div class="libitem"><div class="ic"><span class="msi">'+x[0]+'</span></div><div class="info"><span style="font-size:12.5px;color:var(--txt);line-height:1.55">'+esc(x[2])+'</span></div></div>';
          }).join('')
        + '<div class="note"><span class="msi">bolt</span>洞察每日依版本、違規與準時率自動彙整</div></div>'
        + '</div>';
      C.innerHTML = html;
      void C.offsetHeight;
      mkChart("c5a",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
        datasets:[{label:"專案準時率 %",data:[70,73,76,80,83,86],borderColor:accent2,backgroundColor:"rgba(251,113,133,.18)",fill:true,tension:.35,pointBackgroundColor:accent,pointRadius:4,borderWidth:2}]},
        options:(function(){var o=chartCommon();o.scales.y.min=60;o.scales.y.max=100;return o;})()});
      mkChart("c5b",{type:"bar",data:{labels:["PWR-CTRL","RF-FE","MCU-Core","SENS-HUB","BMS"],
        datasets:[
          {label:"版本數",data:[12,7,18,5,9],backgroundColor:accent,borderRadius:5,stack:"a"},
          {label:"未結違規",data:[3,5,0,8,2],backgroundColor:accent2,borderRadius:5,stack:"a"}
        ]},options:(function(){var o=chartCommon();o.scales.x.stacked=true;o.scales.y.stacked=true;return o;})()});
    }

    var RENDER=[s0,s1,s2,s3,s4,s5];

    function show(i){
      i = Math.max(0, Math.min(i, RENDER.length-1));
      destroyAll();
      var btns = document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){
        if(+btns[b].getAttribute("data-i")===i) btns[b].classList.add("active");
        else btns[b].classList.remove("active");
      }
      RENDER[i]();
    }

    // build nav
    var nav = document.getElementById("navBtns");
    nav.innerHTML = SCREENS.map(function(s,i){
      return '<button class="nbtn" data-i="'+i+'"><span class="msi">'+s.icon+'</span><span class="lbl">'+s.name+'</span></button>';
    }).join('') + '<span class="live-dot"><i></i>Live</span>';
    var nb = document.querySelectorAll("[data-i]");
    for(var q=0;q<nb.length;q++){
      (function(btn){
        btn.addEventListener("click",function(){
          var idx=+btn.getAttribute("data-i");
          if(location.hash!=="#v"+idx){location.hash="v"+idx;} else {show(idx);}
        });
      })(nb[q]);
    }

    window.show = show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
