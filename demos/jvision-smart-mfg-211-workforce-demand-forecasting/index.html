<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產線人力需求預測系統 Workforce Demand Forecasting</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --mut:#475569;
  --line:#99E7DD;
  --bg:#F0FDFA;
  --card:#FFFFFF;
  --side:#073F3B;
  --side2:#0B5B54;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --ok:#15803D;
  --warn:#A65405;
  --bad:#B91C1C;
  --shadow:0 8px 24px rgba(19,78,74,.08);
  --shadow-hover:0 14px 34px rgba(19,78,74,.13);
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-body:"Crimson Pro",Georgia,serif;
  --font-label:"Cinzel","Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:#062E2B}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.side{
  width:264px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  color:#F0FDFA;
  background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);
  border-right:1px solid rgba(94,234,212,.32);
}
.brand{
  min-height:88px;
  padding:21px 20px;
  border-bottom:1px solid rgba(240,253,250,.16);
  display:flex;
  gap:13px;
  align-items:center;
}
.blogo{
  width:44px;
  height:44px;
  border-radius:8px;
  background:var(--color-secondary);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:5px 5px 0 rgba(0,0,0,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.blogo .material-symbols-outlined{font-size:25px;color:#073F3B}
.btxt b{
  display:block;
  font-family:var(--font-display);
  font-size:17px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.15;
}
.btxt span{
  display:block;
  margin-top:4px;
  font-family:var(--font-label);
  font-size:9px;
  letter-spacing:.09em;
  color:#BDEDE7;
}
.nav{
  padding:18px 12px;
  display:flex;
  flex:1;
  flex-direction:column;
  gap:7px;
  overflow-y:auto;
}
.navb{
  width:100%;
  min-height:50px;
  padding:10px 12px;
  display:flex;
  gap:12px;
  align-items:center;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:#CDECE8;
  text-align:left;
  font-size:15px;
  font-weight:600;
  transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
}
.navb .material-symbols-outlined{font-size:21px;flex-shrink:0}
.navb:hover{
  color:#FFFFFF;
  border-color:rgba(94,234,212,.35);
  background:rgba(255,255,255,.08);
  transform:translateX(2px);
}
.navb.on{
  color:#062E2B;
  background:var(--color-secondary);
  border-color:#8FF3E7;
  box-shadow:4px 4px 0 rgba(0,0,0,.18);
}
.navb small{
  display:block;
  margin-top:1px;
  color:inherit;
  font-size:11px;
  font-weight:400;
  line-height:1.25;
  opacity:.82;
}
.sfoot{
  padding:17px 20px;
  border-top:1px solid rgba(240,253,250,.16);
  color:#BDEDE7;
  font-family:var(--font-label);
  font-size:9px;
  line-height:1.65;
  letter-spacing:.07em;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  min-height:88px;
  padding:15px clamp(18px,3vw,38px);
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 3px 12px rgba(19,78,74,.05);
  backdrop-filter:blur(12px);
}
.top h1{
  font-family:var(--font-display);
  font-size:clamp(21px,2.1vw,27px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:.01em;
}
.top .sub{margin-top:4px;color:var(--muted);font-size:13px;font-weight:400}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:30px;
  padding:5px 11px;
  border:1px solid #F2BE7C;
  border-radius:999px;
  background:#FFF7E8;
  color:#854305;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:7px;
  height:7px;
  margin-right:7px;
  border-radius:50%;
  background:var(--color-accent);
}
.tag.o{background:#E9FBF8;border-color:var(--line);color:#0B625B}
.tag.o::before{background:var(--color-primary)}
.wrap{width:100%;max-width:1440px;padding:30px clamp(18px,3vw,38px) 48px}
#view{animation:view-in .35s ease both}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hd{
  margin-bottom:23px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.hd h2{
  display:flex;
  gap:10px;
  align-items:center;
  font-family:var(--font-display);
  font-size:clamp(26px,3vw,36px);
  font-weight:700;
  line-height:1.1;
}
.hd h2 .material-symbols-outlined{color:var(--color-primary);font-size:27px}
.hd p{max-width:780px;margin-top:8px;color:var(--muted);font-size:15px}
.grid{display:grid;gap:17px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c2b{grid-template-columns:minmax(0,2fr) minmax(290px,1fr)}
.c1b{grid-template-columns:minmax(290px,1fr) minmax(0,2fr)}
.card{
  padding:20px;
  background:var(--card);
  color:var(--color-card-foreground);
  border:1px solid var(--line);
  border-radius:9px;
  box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:var(--shadow-hover)}
.card.pad0{padding:0;overflow:hidden}
.kpi{position:relative;overflow:hidden;padding-left:23px}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-28px;
  width:88px;
  height:88px;
  border:1px solid rgba(13,148,136,.13);
  transform:rotate(45deg);
}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--color-primary)}
.kpi .lab{
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--muted);
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .val{
  margin-top:9px;
  font-family:var(--font-display);
  font-size:clamp(30px,3vw,38px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small{color:var(--muted);font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:0}
.kpi .dt{margin-top:9px;font-size:12px;font-weight:600}
.up{color:#116A35}.dn{color:#A51D1D}.fl{color:#8A4706}
.ctitle{
  min-height:24px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  line-height:1.25;
}
.ctitle .material-symbols-outlined{font-size:20px;color:var(--color-primary)}
.ctitle .more{margin-left:auto;color:var(--muted);font-family:var(--font-body);font-size:12px;font-weight:400}
.cw{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:11px 13px;
  border-bottom:1px solid var(--line);
  background:#E7F8F5;
  color:#365F5C;
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
td{padding:12px 13px;border-bottom:1px solid #DDEDEA;white-space:nowrap}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:none}
td:first-child b{font-family:var(--font-mono);font-size:12px;letter-spacing:-.02em}
td.mono,.mono{
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums lining-nums;
}
td.mono{text-align:right}
.bdg{
  display:inline-flex;
  min-height:25px;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
}
.bdg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.b-ok{background:#E7F7EC;color:#116A35}
.b-warn{background:#FFF4DC;color:#865009}
.b-bad{background:#FDEBEC;color:#A51D1D}
.b-info{background:#E3F5F3;color:#09645C}
.b-mut{background:#EDF2F4;color:#475569}
.mini{height:8px;min-width:70px;overflow:hidden;border:1px solid #D6E5E3;border-radius:2px;background:#E8F1F4}
.mini i{display:block;height:100%;border-radius:1px}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:0 0 20px}
.tli:last-child{padding-bottom:0}
.tli::before{
  content:"";
  position:absolute;
  left:-25px;
  top:4px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--color-primary);
  border:3px solid #FFFFFF;
  box-shadow:0 0 0 1px var(--color-primary);
}
.tli.mut::before{background:#64748B;box-shadow:0 0 0 1px #64748B}
.tli .tm{color:#0B625B;font-family:var(--font-mono);font-size:11px;font-weight:700}
.tli .th{margin:2px 0;font-family:var(--font-display);font-size:17px;font-weight:700}
.tli .td{color:var(--muted);font-size:13px}
.matrix{min-width:520px;width:100%;border-collapse:separate;border-spacing:5px;font-size:12px;text-align:center}
.matrix th{padding:7px 5px;border:0;background:transparent;text-align:center}
.matrix .cell{border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.cell{padding:9px 4px;border-radius:4px;color:#FFFFFF;font-family:var(--font-mono);font-size:12px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;display:inline-block;border:1px solid rgba(0,0,0,.2);border-radius:2px}
.gauge{display:flex;gap:13px;flex-wrap:wrap}
.stat{
  flex:1;
  min-width:120px;
  padding:15px;
  border:1px solid #C8E9E4;
  border-radius:6px;
  background:#F4FCFB;
}
.stat .n{font-family:var(--font-display);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{margin-top:2px;color:var(--muted);font-size:12px;font-weight:600}
.alert{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-bottom:10px;
  padding:13px 15px;
  border:1px solid #EAC17D;
  border-left:4px solid var(--color-accent);
  border-radius:6px;
  background:#FFF8EA;
}
.alert:last-child{margin-bottom:0}
.alert.red{border-color:#F0B2B2;border-left-color:var(--color-destructive);background:#FFF1F1}
.alert .material-symbols-outlined{color:#965006;font-size:21px;flex-shrink:0}
.alert.red .material-symbols-outlined{color:var(--color-destructive)}
.alert b{display:block;font-size:14px}
.alert p{margin-top:3px;color:var(--muted);font-size:13px}
.slider{display:flex;flex-direction:column;gap:16px}
.srow{display:grid;grid-template-columns:130px 1fr 70px;gap:12px;align-items:center}
.srow .nm{font-size:13px;font-weight:600}
.track{height:9px;overflow:hidden;position:relative;border:1px solid #D6E5E3;border-radius:2px;background:#E8F1F4}
.track i{position:absolute;inset:0 auto 0 0;border-radius:1px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.srow .vv{text-align:right;font-family:var(--font-mono);font-size:12px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}
.chip{
  padding:7px 13px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#FFFFFF;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.chip.on{border-color:var(--color-primary);background:#DDF7F3;color:#075A53}
.chip.on::before{content:"✓";margin-right:6px;font-weight:700}
.plan{
  display:flex;
  gap:14px;
  align-items:center;
  margin-bottom:11px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#FFFFFF;
  transition:border-color .2s ease,background-color .2s ease,transform .2s ease;
}
.plan:hover{transform:translateX(2px);border-color:var(--color-primary);background:#F7FFFD}
.plan:last-child{margin-bottom:0}
.plan .ic{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border-radius:6px;
  color:#FFFFFF;
  box-shadow:3px 3px 0 rgba(19,78,74,.15);
}
.plan .ic .material-symbols-outlined{font-size:22px}
.plan .bd{flex:1;min-width:0}
.plan .bd b{font-family:var(--font-display);font-size:17px}
.plan .bd p{margin-top:2px;color:var(--muted);font-size:12px}
.plan .rt{text-align:right;flex-shrink:0}
.plan .rt .big{font-family:var(--font-display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .rt .sm{color:var(--muted);font-size:11px}
.appr{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #DDEDEA}
.appr:last-child{border-bottom:none}
.av{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border:2px solid #FFFFFF;
  border-radius:50%;
  box-shadow:0 0 0 1px var(--line);
  color:#FFFFFF;
  font-family:var(--font-display);
  font-size:14px;
  font-weight:700;
}
.hint{display:flex;gap:7px;align-items:flex-start;margin-top:11px;color:var(--muted);font-size:12px}
.hint .material-symbols-outlined{margin-top:1px;color:var(--color-primary);font-size:16px}
@media(max-width:1100px){
  .c2b,.c1b{grid-template-columns:1fr}
}
@media(max-width:960px){
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .brand{min-height:72px;padding:14px 18px}
  .nav{
    padding:9px 12px 12px;
    flex-direction:row;
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .navb{width:auto;min-width:max-content;min-height:44px;flex:0 0 auto;justify-content:center}
  .navb:hover{transform:translateY(-1px)}
  .navb small{display:none}
  .sfoot{display:none}
  .top{top:0;min-height:76px}
}
@media(max-width:820px){
  .k3,.k2{grid-template-columns:1fr}
  .srow{grid-template-columns:105px 1fr 58px}
}
@media(max-width:560px){
  .btxt span{display:none}
  .navb span.lbl{display:none}
  .navb{padding:10px 13px}
  .k4{grid-template-columns:1fr}
  .wrap{padding:22px 14px 38px}
  .top{padding:12px 14px;align-items:flex-start}
  .pill{width:100%;margin-left:0}
  .card{padding:16px}
  .hd h2{font-size:28px}
  .ctitle{font-size:17px}
  .srow{grid-template-columns:1fr 58px}
  .srow .nm{grid-column:1/-1}
  table{font-size:13px}
  th,td{padding:10px 11px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #view{animation:none}
  .card:hover,.navb:hover,.plan:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="blogo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div class="btxt"><b>人力需求預測</b><span>Workforce Forecasting</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">產線人力需求預測系統<br/>MES · 生產規劃部 · v2.1</div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="tt">訂單需求預測</h1>
        <div class="sub" id="ts">彙整訂單預測與淡旺季曲線</div>
      </div>
      <div class="pill">
        <span class="tag">旺季預警</span>
        <span class="tag o">W34 產能 92%</span>
      </div>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
var MODS=[
  {i:"trending_up",n:"訂單需求預測",s:"彙整訂單預測與淡旺季曲線"},
  {i:"precision_manufacturing",n:"產能人力換算",s:"換算各產線所需人力工時"},
  {i:"groups",n:"技能別缺口分析",s:"計算各產線技能別人力缺口"},
  {i:"calendar_month",n:"彈性配置建議",s:"招募/調度/加班配置方案"},
  {i:"fact_check",n:"主管審核派工",s:"審核配置建議與確認執行"},
  {i:"insights",n:"預測準確追蹤",s:"追蹤預測準確率與缺工天數"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function el(id){return document.getElementById(id);}
function mk(pct,col){return '<div class="mini"><i style="width:'+pct+'%;background:'+col+'"></i></div>';}
function heatColor(v){
  if(v<=0)return '#16a34a';
  if(v<=3)return '#84cc16';
  if(v<=6)return '#f59e0b';
  if(v<=10)return '#f97316';
  return '#dc2626';
}
function heatColor2(p){return p>=88?'#dc2626':p>=80?'#f97316':p>=70?'#f59e0b':'#16a34a';}

function kpi(ic,lab,val,unit,dt,cls){
  return '<div class="card kpi"><div class="bar"></div><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+cls+'">'+dt+'</div></div>';
}
function srow(nm,pct,vv){
  return '<div class="srow"><div class="nm">'+nm+'</div><div class="track"><i style="width:'+pct+'%"></i></div><div class="vv">'+vv+'</div></div>';
}
function plan(c,ic,t,d,n,u){
  return '<div class="plan"><div class="ic" style="background:'+c+'"><span class="material-symbols-outlined">'+ic+'</span></div><div class="bd"><b>'+t+'</b><p>'+d+'</p></div><div class="rt"><div class="big">'+n+'</div><div class="sm">'+u+'</div></div></div>';
}
function appr(av,nm,ro,b,st,c){
  return '<div class="appr"><div class="av" style="background:'+c+'">'+av+'</div><div style="flex:1;min-width:0"><b style="font-size:13px">'+nm+'</b><div style="font-size:11px;color:var(--mut)">'+ro+'</div></div><span class="bdg '+b+'">'+st+'</span></div>';
}
function tli(tm,th,td,mut){
  return '<div class="tli'+(mut?' mut':'')+'"><div class="tm">'+tm+'</div><div class="th">'+th+'</div><div class="td">'+td+'</div></div>';
}

function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navb" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].i+'</span><span class="lbl">'+MODS[i].n+'<small>'+MODS[i].s+'</small></span></button>';
  }
  el("nav").innerHTML=h;
  var bs=document.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
}

function show(i){
  destroyCharts();
  var c=el("view");
  c.innerHTML=VIEWS[i]();
  el("tt").textContent=MODS[i].n;
  el("ts").textContent=MODS[i].s;
  var bs=document.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].classList.toggle("on",+bs[k].getAttribute("data-i")===i);}
  void c.offsetHeight;
  initCharts(i);
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
