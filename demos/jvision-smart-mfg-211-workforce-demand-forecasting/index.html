<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產線人力需求預測系統 Workforce Demand Forecasting</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#dc2626;--accent2:#f97316;--ink:#1e293b;--mut:#64748b;--line:#e5e7eb;
  --bg:#f5f6f8;--card:#ffffff;--side:#1a1420;--side2:#241a2c;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{width:248px;background:linear-gradient(180deg,var(--side),var(--side2));color:#e7e2ec;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center}
.blogo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.blogo .material-symbols-outlined{font-size:24px;color:#fff}
.btxt b{font-size:14px;font-weight:800;display:block;letter-spacing:.3px}
.btxt span{font-size:11px;color:#a99fb3}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.navb{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:10px;background:none;border:none;color:#c8bfd1;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left;width:100%;transition:.15s;font-weight:500}
.navb .material-symbols-outlined{font-size:21px;flex-shrink:0}
.navb:hover{background:rgba(255,255,255,.06);color:#fff}
.navb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.32)}
.navb small{display:block;font-size:10.5px;opacity:.7;font-weight:400}
.sfoot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#a99fb3}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;font-weight:800}
.top .sub{font-size:12px;color:var(--mut);font-weight:500}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:5px 11px;border-radius:20px;background:#fef2f2;color:var(--accent);font-weight:700}
.tag.o{background:#fff7ed;color:#c2410c}
.wrap{padding:24px 26px;max-width:1280px;width:100%}
.hd{margin-bottom:18px}
.hd h2{font-size:20px;font-weight:800;display:flex;gap:9px;align-items:center}
.hd h2 .material-symbols-outlined{color:var(--accent);font-size:24px}
.hd p{font-size:13px;color:var(--mut);margin-top:4px}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.c2b{grid-template-columns:2fr 1fr}
.c1b{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.pad0{padding:0;overflow:hidden}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:29px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .dt{font-size:11.5px;margin-top:6px;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--warn)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--accent),var(--accent2))}
.ctitle{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ctitle .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.ctitle .more{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}
.cw{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:10px 12px;background:#faf7f9;color:var(--mut);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f1f3f5;white-space:nowrap}
tbody tr:hover{background:#fef8f8}
tbody tr:last-child td{border-bottom:none}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.b-ok{background:#dcfce7;color:#15803d}.b-warn{background:#fef3c7;color:#b45309}.b-bad{background:#fee2e2;color:#b91c1c}.b-info{background:#e0f2fe;color:#0369a1}.b-mut{background:#f1f5f9;color:#475569}
.mini{height:7px;border-radius:6px;background:#eef0f3;overflow:hidden;min-width:60px}
.mini i{display:block;height:100%;border-radius:6px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px 0}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tli.mut::before{background:#cbd5e1;box-shadow:0 0 0 2px #cbd5e1}
.tli .tm{font-size:11px;color:var(--accent);font-weight:700}
.tli .th{font-size:13.5px;font-weight:700;margin:2px 0}
.tli .td{font-size:12px;color:var(--mut)}
.matrix{width:100%;border-collapse:separate;border-spacing:4px;font-size:11.5px;text-align:center;min-width:520px}
.matrix th{background:none;padding:6px 4px;text-align:center;border:none}
.cell{border-radius:7px;padding:9px 4px;font-weight:700;color:#fff;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.gauge{display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:#faf8fa;border:1px solid var(--line);border-radius:11px;padding:13px}
.stat .n{font-size:23px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:11px;background:#fff7ed;border:1px solid #fed7aa;align-items:flex-start;margin-bottom:10px}
.alert:last-child{margin-bottom:0}
.alert.red{background:#fef2f2;border-color:#fecaca}
.alert .material-symbols-outlined{color:var(--accent2);font-size:21px;flex-shrink:0}
.alert.red .material-symbols-outlined{color:var(--accent)}
.alert b{font-size:13px;display:block}
.alert p{font-size:11.5px;color:var(--mut);margin-top:2px}
.slider{display:flex;flex-direction:column;gap:14px}
.srow{display:grid;grid-template-columns:130px 1fr 70px;gap:12px;align-items:center}
.srow .nm{font-size:12.5px;font-weight:600}
.track{height:9px;border-radius:6px;background:#eef0f3;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.srow .vv{font-size:12.5px;font-weight:700;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--mut)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px;display:flex;gap:13px;align-items:center}
.plan:last-child{margin-bottom:0}
.plan .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.plan .ic .material-symbols-outlined{font-size:22px}
.plan .bd{flex:1;min-width:0}
.plan .bd b{font-size:13.5px}
.plan .bd p{font-size:11.5px;color:var(--mut);margin-top:2px}
.plan .rt{text-align:right;flex-shrink:0}
.plan .rt .big{font-size:19px;font-weight:800}
.plan .rt .sm{font-size:10.5px;color:var(--mut)}
.appr{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #f1f3f5}
.appr:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.hint{font-size:11px;color:var(--mut);margin-top:10px;display:flex;gap:6px;align-items:center}
.hint .material-symbols-outlined{font-size:15px}
.mono{font-variant-numeric:tabular-nums}
@media(max-width:1100px){.c2b,.c1b{grid-template-columns:1fr}}
@media(max-width:960px){.k4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap;overflow-x:visible}
  .navb{width:auto;flex:1 1 auto;justify-content:center}
  .navb small{display:none}
  .sfoot{display:none}
}
@media(max-width:820px){.k3,.k2{grid-template-columns:1fr}.srow{grid-template-columns:100px 1fr 56px}}
@media(max-width:560px){
  .navb span.lbl{display:none}
  .navb{flex:0 0 auto;padding:11px}
  .k4{grid-template-columns:1fr}
  .wrap{padding:18px 15px}.top{padding:14px 15px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="blogo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div class="btxt"><b>人力需求預測</b><span>Workforce Forecasting</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">產線人力需求預測系統<br/>MES · 生產規劃部 · v2.1</div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="tt">訂單需求預測</h1>
        <div class="sub" id="ts">彙整訂單預測與淡旺季曲線</div>
      </div>
      <div class="pill">
        <span class="tag">旺季預警</span>
        <span class="tag o">W34 產能 92%</span>
      </div>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
var MODS=[
  {i:"trending_up",n:"訂單需求預測",s:"彙整訂單預測與淡旺季曲線"},
  {i:"precision_manufacturing",n:"產能人力換算",s:"換算各產線所需人力工時"},
  {i:"groups",n:"技能別缺口分析",s:"計算各產線技能別人力缺口"},
  {i:"calendar_month",n:"彈性配置建議",s:"招募/調度/加班配置方案"},
  {i:"fact_check",n:"主管審核派工",s:"審核配置建議與確認執行"},
  {i:"insights",n:"預測準確追蹤",s:"追蹤預測準確率與缺工天數"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function el(id){return document.getElementById(id);}
function mk(pct,col){return '<div class="mini"><i style="width:'+pct+'%;background:'+col+'"></i></div>';}
function heatColor(v){
  if(v<=0)return '#16a34a';
  if(v<=3)return '#84cc16';
  if(v<=6)return '#f59e0b';
  if(v<=10)return '#f97316';
  return '#dc2626';
}
function heatColor2(p){return p>=88?'#dc2626':p>=80?'#f97316':p>=70?'#f59e0b':'#16a34a';}

function kpi(ic,lab,val,unit,dt,cls){
  return '<div class="card kpi"><div class="bar"></div><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+cls+'">'+dt+'</div></div>';
}
function srow(nm,pct,vv){
  return '<div class="srow"><div class="nm">'+nm+'</div><div class="track"><i style="width:'+pct+'%"></i></div><div class="vv">'+vv+'</div></div>';
}
function plan(c,ic,t,d,n,u){
  return '<div class="plan"><div class="ic" style="background:'+c+'"><span class="material-symbols-outlined">'+ic+'</span></div><div class="bd"><b>'+t+'</b><p>'+d+'</p></div><div class="rt"><div class="big">'+n+'</div><div class="sm">'+u+'</div></div></div>';
}
function appr(av,nm,ro,b,st,c){
  return '<div class="appr"><div class="av" style="background:'+c+'">'+av+'</div><div style="flex:1;min-width:0"><b style="font-size:13px">'+nm+'</b><div style="font-size:11px;color:var(--mut)">'+ro+'</div></div><span class="bdg '+b+'">'+st+'</span></div>';
}
function tli(tm,th,td,mut){
  return '<div class="tli'+(mut?' mut':'')+'"><div class="tm">'+tm+'</div><div class="th">'+th+'</div><div class="td">'+td+'</div></div>';
}

function view0(){
  return ''+
  '<div class="hd"><h2><span class="material-symbols-outlined">trending_up</span>訂單需求預測</h2><p>匯入各週訂單預測與淡旺季曲線，推估各產線目標產出量與人力工時需求。</p></div>'+
  '<div class="grid k4" style="margin-bottom:16px">'+
    kpi("receipt_long","本季訂單量","18,420","K pcs","+14.2% 對比上季","up")+
    kpi("factory","旺季峰值週","W34","","產能負載 92%","fl")+
    kpi("groups","預估用工缺口","+186","人","高峰週最大缺口","dn")+
    kpi("verified","預測準確率","91.4","%","近 8 週滾動平均","up")+
  '</div>'+
  '<div class="grid c2b" style="margin-bottom:16px">'+
    '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">show_chart</span>訂單預測 vs 產能上限（週）<span class="more">單位：K pcs</span></div><div class="cw" style="height:300px"><canvas id="c0a"></canvas></div></div>'+
    '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">donut_small</span>訂單來源占比</div><div class="cw" style="height:210px"><canvas id="c0b"></canvas></div>'+
      '<div class="legend"><span><i class="dot" style="background:#dc2626"></i>車用電子 42%</span><span><i class="dot" style="background:#f97316"></i>消費電子 31%</span><span><i class="dot" style="background:#fbbf24"></i>工控 18%</span><span><i class="dot" style="background:#94a3b8"></i>其他 9%</span></div></div>'+
  '</div>'+
  '<div class="card pad0"><div style="padding:16px 18px 0"><div class="ctitle"><span class="material-symbols-outlined">table_rows</span>各產線需求推估</div></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>產線</th><th>主力產品</th><th>本週訂單(K)</th><th>旺季峰值週</th><th>目標日產出</th><th>負載</th><th>狀態</th></tr></thead><tbody>'+
    lineRows()+'</tbody></table></div></div>';
}
function lineRows(){
  var d=[
    ["SMT-A","車用控制板",4.2,"W34",1180,86,"warn","負載偏高"],
    ["SMT-B","電源模組",3.1,"W33",920,72,"ok","正常"],
    ["組裝-C","感測器總成",2.8,"W35",760,91,"bad","接近上限"],
    ["組裝-D","連接器",2.2,"W32",640,64,"ok","正常"],
    ["測試-E","車用終測",1.9,"W34",540,88,"warn","負載偏高"],
    ["包裝-F","出貨包裝",4.0,"W35",1350,58,"ok","正常"]
  ];
  var b={ok:"b-ok",warn:"b-warn",bad:"b-bad"};
  var s="";
  for(var i=0;i<d.length;i++){var r=d[i];
    s+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="mono">'+r[2].toFixed(1)+'</td><td>'+r[3]+'</td><td class="mono">'+r[4]+' pcs</td><td>'+mk(r[5],heatColor2(r[5]))+'</td><td><span class="bdg '+b[r[6]]+'">'+r[7]+'</span></td></tr>';
  }
  return s;
}

function view1(){
  return ''+
  '<div class="hd"><h2><span class="material-symbols-outlined">precision_manufacturing</span>產能人力換算</h2><p>以標準工時、稼動率與班次結構，換算各產線達成目標產出所需的人力工時。</p></div>'+
  '<div class="grid k4" style="margin-bottom:16px">'+
    kpi("schedule","目標人力工時","14,860","hr/週","旺季 W34 需求","dn")+
    kpi("speed","平均稼動率","83.6","%","綜合六條產線","up")+
    kpi("engineering","換算應配人力","512","人","三班制含彈性","fl")+
    kpi("timer","平均標準工時","6.8","min/pcs","加權平均","fl")+
  '</div>'+
  '<div class="grid c1b" style="margin-bottom:16px">'+
    '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">tune</span>換算參數</div>'+
      '<div class="slider">'+
        srow("標準工時 (min)",68,"6.8")+
        srow("稼動率 (%)",84,"83.6")+
        srow("良率 (%)",96,"96.2")+
        srow("出勤率 (%)",92,"91.5")+
        srow("班次係數",75,"1.85")+
      '</div>'+
      '<div class="hint"><span class="material-symbols-outlined">calculate</span>應配人力 = 目標工時 ÷（標準產能 × 稼動 × 出勤）</div>'+
    '</div>'+
    '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">stacked_bar_chart</span>各產線班次人力工時堆疊（hr/週）</div><div class="cw" style="height:300px"><canvas id="c1a"></canvas></div></div>'+
  '</div>'+
  '<div class="card pad0"><div style="padding:16px 18px 0"><div class="ctitle"><span class="material-symbols-outlined">functions</span>換算明細</div></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>產線</th><th>目標產出(pcs)</th><th>標準工時</th><th>稼動率</th><th>需求工時</th><th>應配人力</th><th>三班分配</th></tr></thead><tbody>'+
    calcRows()+'</tbody></table></div></div>';
}
function calcRows(){
  var d=[
    ["SMT-A",8260,7.2,86,"3,120","108","36/36/36"],
    ["SMT-B",6440,6.1,72,"2,140","74","28/28/18"],
    ["組裝-C",5320,8.4,91,"3,010","104","40/40/24"],
    ["組裝-D",4480,5.6,64,"1,680","58","22/22/14"],
    ["測試-E",3780,9.1,88,"2,290","80","30/30/20"],
    ["包裝-F",9450,3.4,58,"2,620","90","32/32/26"]
  ];
  var s="";
  for(var i=0;i<d.length;i++){var r=d[i];
    s+='<tr><td><b>'+r[0]+'</b></td><td class="mono">'+r[1]+'</td><td class="mono">'+r[2].toFixed(1)+' min</td><td class="mono">'+r[3]+'%</td><td class="mono">'+r[4]+' hr</td><td><span class="bdg b-info">'+r[5]+' 人</span></td><td class="mono">'+r[6]+'</td></tr>';
  }
  return s;
}

function view2(){
  var skills=["SMT操作","銲錫","AOI檢測","組裝","終測","包裝"];

function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navb" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].i+'</span><span class="lbl">'+MODS[i].n+'<small>'+MODS[i].s+'</small></span></button>';
  }
  el("nav").innerHTML=h;
  var bs=document.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
}

function show(i){
  destroyCharts();
  var c=el("view");
  c.innerHTML=VIEWS[i]();
  el("tt").textContent=MODS[i].n;
  el("ts").textContent=MODS[i].s;
  var bs=document.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].classList.toggle("on",+bs[k].getAttribute("data-i")===i);}
  void c.offsetHeight;
  initCharts(i);
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
