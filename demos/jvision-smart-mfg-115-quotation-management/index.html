<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotation Management 報價管理｜Jvision 系統 Demo</title>
  <meta name="description" content="報價單範本與自動編號、價格政策與折扣控管、多幣別稅制計算、內部核准與版本追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --blue:#1d4ed8;--blue2:#60a5fa;--ink:#0f1c3f;--sub:#5a6b8c;
      --line:#e3e9f5;--bg:#f4f7fd;--card:#ffffff;--ok:#0f9d6a;--warn:#e0891b;--bad:#dc2b3d;
      --chip:#eef3fe;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#12307f,#1d4ed8);color:#fff;box-shadow:0 4px 18px rgba(23,54,140,.22)}
    .tb-in{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25)}
    .logo .ms{font-size:22px;color:#fff}
    .brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
    .brand span{display:block;font-size:11px;color:#cfe0ff;font-weight:500}
    .tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
    .tb-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
    .tb-user .av{width:24px;height:24px;border-radius:50%;background:var(--blue2);display:grid;place-items:center;font-size:12px;font-weight:800;color:#0f1c3f}
    nav.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
    .nav-in{max-width:1360px;margin:0 auto;padding:0 14px;display:flex;gap:4px;flex-wrap:wrap;min-width:0}
    .nav button{flex:none;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--sub);padding:14px 15px 11px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
    .nav button .ms{font-size:19px}
    .nav button:hover{color:var(--blue)}
    .nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
    main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;min-width:0}
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0}
    .head h1{font-size:21px;margin:0 0 3px;font-weight:800}
    .head p{margin:0;color:var(--sub);font-size:13px;max-width:640px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .btn .ms{font-size:17px}
    .btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
    .g2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .g-form{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px}
    .card h3 .ms{font-size:19px;color:var(--blue)}
    .card .sub{color:var(--sub);font-size:12px;margin:0 0 14px}
    .kpi{position:relative;overflow:hidden}
    .kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lab .ms{font-size:17px;color:var(--blue)}
    .kpi .val{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-.5px}
    .kpi .val small{font-size:14px;font-weight:700;color:var(--sub);margin-left:3px}
    .kpi .dt{font-size:12px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:4px}
    .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--sub)}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    th{text-align:left;font-size:11.5px;letter-spacing:.4px;color:var(--sub);text-transform:uppercase;font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fafcff}
    td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr:hover{background:#f7faff}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .chart{width:100%;overflow:hidden}
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
    .p-ok{background:#e4f6ee;color:#0c7a53}
    .p-warn{background:#fdf1de;color:#b06a12}
    .p-bad{background:#fce6e9;color:#b81f30}
    .p-info{background:var(--chip);color:var(--blue)}
    .p-mute{background:#eef1f6;color:#5a6b8c}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .live{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .fld{margin-bottom:13px}
    .fld label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
    .fld input,.fld select{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfdff;color:var(--ink)}
    .fld input:focus,.fld select:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(96,165,250,.2)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .totbox{background:linear-gradient(160deg,#12307f,#1d4ed8);color:#fff;border-radius:13px;padding:16px 18px}
    .totbox .r{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#dbe6ff}
    .totbox .r b{color:#fff;font-variant-numeric:tabular-nums}
    .totbox .big{border-top:1px solid rgba(255,255,255,.22);margin-top:8px;padding-top:11px;font-size:15px;color:#fff;font-weight:800}
    .totbox .big b{font-size:24px;font-weight:900}
    .meter{height:9px;border-radius:99px;background:#eaeff8;overflow:hidden}
    .meter i{display:block;height:100%;border-radius:99px}
    .tl{position:relative;padding-left:26px}
    .tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
    .tl-item{position:relative;padding:0 0 18px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item .mk{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--blue2);display:grid;place-items:center}
    .tl-item.cur .mk{border-color:var(--blue);background:var(--blue)}
    .tl-item .tt{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .tl-item .mt{color:var(--sub);font-size:12px;margin-top:2px}
    .tl-item .dd{background:#fafcff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:7px;font-size:12.5px;color:var(--sub)}
    .apr{display:flex;gap:0;flex-wrap:wrap}
    .apr .st{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px}
    .apr .st .c{width:38px;height:38px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;font-weight:900;font-size:15px;background:#eef1f6;color:#8a97ad;border:2px solid #e3e9f5}
    .apr .st.done .c{background:var(--ok);color:#fff;border-color:var(--ok)}
    .apr .st.cur .c{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(29,78,216,.16)}
    .apr .st .n{font-size:12.5px;font-weight:800}
    .apr .st .r{font-size:11px;color:var(--sub)}
    .apr .st:not(:last-child):after{content:"";position:absolute;top:19px;left:64%;right:-36%;height:2px;background:#e3e9f5}
    .apr .st.done:not(:last-child):after{background:var(--ok)}
    .flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .flag{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;display:flex;align-items:center;gap:7px;background:#fff}
    .muted{color:var(--sub)}
    .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .tag{font-size:11px;font-weight:700;color:var(--blue);background:var(--chip);padding:2px 8px;border-radius:6px;white-space:nowrap}
    @media(max-width:960px){.g2,.g-form{grid-template-columns:1fr}}
    @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2b,.g3{grid-template-columns:1fr}}
    @media(max-width:560px){
      .nav button span.lbl{display:none}
      .nav button{padding:13px 12px}
      .row2{grid-template-columns:1fr}
      .head h1{font-size:18px}
      .brand span{display:none}
    }
    @media(max-width:430px){.kpis{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="tb-in">
      <div class="brand">
        <div class="logo"><span class="ms">request_quote</span></div>
        <div><b>報價管理平台</b><span>Quotation Management · 智慧製造業務中樞</span></div>
      </div>
      <div class="tb-right">
        <span class="tb-user"><span class="dot live" style="background:#7cf5b8"></span>ERP 已同步</span>
        <span class="tb-user"><span class="av">陳</span>陳雅婷 · 業務部</span>
      </div>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-in" id="navbar"></div>
  </nav>
  <main><div id="view"></div></main>

  <script>
  "use strict";
  var BLUE="#1d4ed8",BLUE2="#60a5fa",OK="#0f9d6a",WARN="#e0891b",BAD="#dc2b3d",SUB="#5a6b8c",LINE="#e3e9f5";
  var charts=[];
  function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
  var NAV=[
    {i:0,ic:"request_quote",t:"報價單建立"},
    {i:1,ic:"rule",t:"價格政策"},
    {i:2,ic:"receipt_long",t:"幣別稅制"},
    {i:3,ic:"fact_check",t:"核准簽核"},
    {i:4,ic:"history",t:"版本追蹤"},
    {i:5,ic:"trending_up",t:"轉單分析"}
  ];
  function buildNav(){
    var h="";
    for(var k=0;k<NAV.length;k++){
      var n=NAV[k];
      h+='<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="ms">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
    }
    document.getElementById("navbar").innerHTML=h;
  }
  function setOn(i){
    var b=document.querySelectorAll("[data-i]");
    for(var k=0;k<b.length;k++){b[k].classList.toggle("on",+b[k].getAttribute("data-i")===i);}
  }
  function money(n){return "$"+Number(n).toLocaleString("en-US");}

  /* ============ helpers ============ */
  function head(t,d,actions){return '<div class="head"><div><h1>'+t+'</h1><p>'+d+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(actions||'')+'</div></div>';}
  function kpi(lab,ic,val,note,dt,dir,unit){
    var d=dt?'<div class="dt '+dir+'"><span class="ms" style="font-size:15px">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"remove")+'</span>'+dt+' · '+note+'</div>':'<div class="dt flat">'+note+'</div>';
    return '<div class="card kpi"><div class="lab"><span class="ms">'+ic+'</span>'+lab+'</div><div class="val mono">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+d+'</div>';
  }
  function aprStep(cls,n,name,role){return '<div class="st '+cls+'"><div class="c">'+(cls==="done"?'<span class="ms" style="font-size:18px">check</span>':n)+'</div><div class="n">'+name+'</div><div class="r">'+role+'</div></div>';}

  /* ============ SCREEN 0: 報價單建立 ============ */
  function s0(){
    var items=[
      {no:"CNC-4020",nm:"CNC 精密車削件 (SUS304)",qty:1200,u:"件",up:186,lt:"14天"},
      {no:"MLD-A17",nm:"射出模具 A17 (三板模)",qty:2,u:"套",up:412000,lt:"45天"},
      {no:"PCB-6L",nm:"六層 PCB 板 (ENIG)",qty:800,u:"片",up:74,lt:"21天"},
      {no:"ASM-LN3",nm:"線束總成 LN3 (含端子)",qty:3000,u:"組",up:38,lt:"10天"},
      {no:"CST-SUR",nm:"表面陽極處理 (加工費)",qty:1200,u:"件",up:12,lt:"7天"}
    ];
    var rows="",sub=0;
    for(var i=0;i<items.length;i++){var it=items[i];var amt=it.qty*it.up;sub+=amt;
      rows+='<tr><td><b>'+it.no+'</b></td><td>'+it.nm+'</td><td class="num mono">'+it.qty.toLocaleString()+'</td><td>'+it.u+'</td><td class="num mono">'+money(it.up)+'</td><td class="num mono"><b>'+money(amt)+'</b></td><td><span class="tag">'+it.lt+'</span></td></tr>';}
    var tax=Math.round(sub*0.05);
    var tpl=[
      {n:"標準製造報價 (含 5% 稅)",on:true},{n:"OEM 長約年度報價",on:false},{n:"樣品/小批試產報價",on:false},{n:"含運保 CIF 出口報價",on:false}
    ];
    var tplH="";for(var t=0;t<tpl.length;t++){tplH+='<div class="flag" style="'+(tpl[t].on?'border-color:'+BLUE+';background:#eef3fe':'')+'"><span class="ms" style="color:'+(tpl[t].on?BLUE:SUB)+'">'+(tpl[t].on?'radio_button_checked':'radio_button_unchecked')+'</span>'+tpl[t].n+'</div>';}

    return ''
    +head("報價單建立","套用產業範本自動編號，逐項帶入品項、數量與基準單價，組出完整報價明細。",
        '<button class="btn"><span class="ms">description</span>選擇範本</button><button class="btn pri"><span class="ms">save</span>儲存草稿</button>')
    +'<div class="kpis">'
      +kpi("進行中報價單","monitoring","38","本月","+6","up","件")
      +kpi("今日新建","note_add","7","昨日 5","+2","up","件")
      +kpi("平均組價耗時","schedule","11","目標 15","-4","up","分")
      +kpi("範本覆蓋率","library_books","92","上季 78","+14","up","%")
    +'</div>'
    +'<div class="g-form">'
      +'<div class="card"><h3><span class="ms">list_alt</span>報價明細 · QT-2026-08-0417</h3><p class="sub">客戶：O昇精密工業 · 幣別 TWD · 稅別 應稅 5%</p>'
        +'<div class="scroll"><table><thead><tr><th>料號</th><th>品名 / 規格</th><th class="num">數量</th><th>單位</th><th class="num">基準單價</th><th class="num">小計</th><th>交期</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        +'<div class="totbox" style="margin-top:14px"><div class="r"><span>未稅小計</span><b class="mono">'+money(sub)+'</b></div><div class="r"><span>營業稅 5%</span><b class="mono">'+money(tax)+'</b></div><div class="big"><span>報價總額 (含稅)</span><b class="mono">'+money(sub+tax)+'</b></div></div>'
      +'</div>'
      +'<div>'
        +'<div class="card"><h3><span class="ms">badge</span>報價單資訊</h3><p class="sub">自動編號依範本規則產生</p>'
          +'<div class="fld"><label>報價單號 (自動)</label><input value="QT-2026-08-0417" readonly></div>'
          +'<div class="row2"><div class="fld"><label>客戶</label><select><option>O昇精密工業</option><option>O昇電子</option></select></div><div class="fld"><label>有效期限</label><input value="2026-08-31"></div></div>'
          +'<div class="row2"><div class="fld"><label>負責業務</label><input value="陳雅婷"></div><div class="fld"><label>付款條件</label><select><option>月結 60 天</option><option>月結 30 天</option><option>預付 30%</option></select></div></div>'
        +'</div>'
        +'<div class="card" style="margin-top:16px"><h3><span class="ms">description</span>套用範本</h3><p class="sub">依產業/交易型態帶入版面與稅則</p>'+tplH+'</div>'
      +'</div>'
    +'</div>';
  }

  /* ============ SCREEN 1: 價格政策與折扣 ============ */
  function s1(){
    var lines=[
      {no:"CNC-4020",cost:132,list:186,disc:8},
      {no:"MLD-A17",cost:305000,list:412000,disc:5},
      {no:"PCB-6L",cost:58,list:74,disc:14},
      {no:"ASM-LN3",cost:30,list:38,disc:18},
      {no:"CST-SUR",cost:9,list:12,disc:0}
    ];
    var rows="";
    for(var i=0;i<lines.length;i++){var l=lines[i];
      var net=l.list*(1-l.disc/100);var gm=((net-l.cost)/net*100);
      var cap=l.disc>15;var floor=gm<15;
      var st=floor?'<span class="pill p-bad"><span class="ms" style="font-size:14px">block</span>低於毛利底線</span>':(cap?'<span class="pill p-warn"><span class="ms" style="font-size:14px">warning</span>逾折扣上限</span>':'<span class="pill p-ok"><span class="ms" style="font-size:14px">check</span>符合政策</span>');
      rows+='<tr><td><b>'+l.no+'</b></td><td class="num mono">'+money(l.list)+'</td><td class="num mono"><span class="pill '+(cap?'p-warn':'p-info')+'">'+l.disc+'%</span></td><td class="num mono">'+money(Math.round(net))+'</td><td class="num mono"><b style="color:'+(floor?BAD:gm<25?WARN:OK)+'">'+gm.toFixed(1)+'%</b></td><td>'+st+'</td></tr>';}
    return ''
    +head("價格政策與折扣控管","依客戶價格帶套用折扣，系統即時檢核折扣上限與毛利底線並提示逾越。",
        '<button class="btn"><span class="ms">tune</span>價格帶設定</button><button class="btn pri"><span class="ms">verified</span>套用政策</button>')
    +'<div class="kpis">'
      +kpi("客戶等級","verified","金級","折扣上限 15%","","flat","")
      +kpi("平均毛利率","savings","23.6","底線 15","+8.6","up","%")
      +kpi("逾上限項目","warning","1","需主管核准","","flat","項")
      +kpi("低於底線項目","block","1","已阻擋","","flat","項")
    +'</div>'
    +'<div class="g2">'
      +'<div class="card"><h3><span class="ms">rule</span>逐項政策檢核</h3><p class="sub">紅色代表低於毛利底線需退回、橘色代表逾折扣上限需簽核</p>'
        +'<div class="scroll"><table><thead><tr><th>料號</th><th class="num">牌價</th><th class="num">折扣</th><th class="num">淨價</th><th class="num">毛利率</th><th>檢核</th></tr></thead><tbody>'+rows+'</tbody></table></div>'

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
