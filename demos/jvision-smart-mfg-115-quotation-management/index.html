<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotation Management 報價管理｜Jvision 系統 Demo</title>
  <meta name="description" content="報價單範本與自動編號、價格政策與折扣控管、多幣別稅制計算、內部核准與版本追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#059669;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#0F172A;
      --color-card:#FFFFFF;
      --color-card-foreground:#0F172A;
      --color-muted:#F1F5FD;
      --color-muted-foreground:#475569;
      --color-border:#E4ECFC;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#0F172A;
      --muted:#475569;
      --line:#E4ECFC;
      --blue2:#3B82F6;
      --sub:#475569;
      --bg:#F8FAFC;
      --card:#FFFFFF;
      --ok:#047857;
      --warn:#A54B08;
      --bad:#DC2626;
      --chip:#F1F5FD;
      --display:"Cormorant Garamond","Crimson Pro",Georgia,serif;
      --body:"Crimson Pro",Georgia,serif;
      --label:"Cinzel","Crimson Pro",serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px),
        var(--color-background);
      background-size:48px 48px;
      color:var(--ink);
      font-family:var(--body);
      font-size:17px;
      line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    button,input,select{font:inherit}
    button,a,select{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .ms{
      font-family:"Material Symbols Outlined";
      font-weight:500;
      font-style:normal;
      font-size:1.15em;
      line-height:1;
      vertical-align:middle;
      font-feature-settings:"liga";
    }
    .topbar{
      position:relative;
      z-index:30;
      color:var(--color-on-primary);
      background:var(--color-primary);
      border-bottom:4px solid var(--ink);
    }
    .topbar:after{
      content:"QUOTATION / CONTROL DESK";
      position:absolute;
      right:20px;
      bottom:-28px;
      z-index:2;
      padding:4px 10px;
      border:2px solid var(--ink);
      background:#fff;
      color:var(--ink);
      font-family:var(--label);
      font-size:10px;
      font-weight:600;
      letter-spacing:.12em;
    }
    .tb-in{
      max-width:1440px;
      min-height:78px;
      margin:0 auto;
      padding:12px 22px;
      display:flex;
      align-items:center;
      gap:18px;
      min-width:0;
    }
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .logo{
      width:50px;
      height:50px;
      flex:none;
      display:grid;
      place-items:center;
      color:var(--ink);
      background:#fff;
      border:3px solid var(--ink);
    }
    .logo .ms{font-size:28px}
    .brand b{
      display:block;
      font-family:var(--display);
      font-size:23px;
      font-weight:700;
      line-height:1;
      letter-spacing:.01em;
      white-space:nowrap;
    }
    .brand span{
      display:block;
      margin-top:5px;
      color:#DBEAFE;
      font-family:var(--label);
      font-size:10px;
      font-weight:600;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .tb-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      min-width:0;
    }
    .tb-user{
      min-height:38px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border:2px solid rgba(255,255,255,.9);
      background:rgba(15,23,42,.16);
      color:#fff;
      font-size:14px;
      font-weight:700;
      white-space:nowrap;
    }
    .tb-user .av{
      width:25px;
      height:25px;
      display:grid;
      place-items:center;
      background:#fff;
      color:var(--blue);
      border:2px solid var(--ink);
      font-weight:700;
    }
    nav.nav{
      position:sticky;
      top:0;
      z-index:20;
      background:#fff;
      border-bottom:3px solid var(--ink);
    }
    .nav-in{
      max-width:1440px;
      margin:0 auto;
      padding:0 18px;
      display:flex;
      min-width:0;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    .nav button{
      min-height:54px;
      flex:1 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:12px 16px;
      border:0;
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
      background:#fff;
      color:var(--muted);
      font-family:var(--label);
      font-size:11px;
      font-weight:600;
      letter-spacing:.05em;
      white-space:nowrap;
      transition:background-color .18s ease,color .18s ease;
    }
    .nav button:hover{background:var(--color-muted);color:var(--blue)}
    .nav button.on{
      position:relative;
      z-index:1;
      background:var(--ink);
      color:#fff;
      border-color:var(--ink);
    }
    .nav button.on:after{
      content:"";
      position:absolute;
      right:7px;
      bottom:6px;
      width:8px;
      height:8px;
      background:var(--color-accent);
      border:1px solid #fff;
    }
    main{
      max-width:1440px;
      margin:0 auto;
      padding:42px 22px 70px;
      min-width:0;
    }
    #view{min-width:0}
    .head{
      position:relative;
      min-height:130px;
      display:grid;
      grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);
      align-items:end;
      gap:24px;
      margin-bottom:20px;
      padding:22px 24px;
      background:#fff;
      border:3px solid var(--ink);
    }
    .head:before{
      content:"ACTIVE WORKSPACE";
      position:absolute;
      top:-13px;
      left:18px;
      padding:3px 9px;
      color:#fff;
      background:var(--ink);
      font-family:var(--label);
      font-size:9px;
      font-weight:600;
      letter-spacing:.12em;
    }
    .head h1{
      margin:0 0 6px;
      font-family:var(--display);
      font-size:clamp(31px,4vw,52px);
      font-weight:700;
      line-height:.94;
      letter-spacing:-.025em;
    }
    .head p{
      max-width:760px;
      margin:0;
      color:var(--muted);
      font-size:16px;
      line-height:1.45;
    }
    .head>div:last-child{
      display:flex;
      justify-content:flex-end;
      align-items:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }
    .btn{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:9px 15px;
      border:2px solid var(--ink);
      border-radius:0;
      background:#fff;
      color:var(--ink);
      font-family:var(--label);
      font-size:11px;
      font-weight:600;
      letter-spacing:.035em;
      transition:background-color .18s ease,color .18s ease,transform .18s ease;
    }
    .btn:hover{background:var(--color-muted);transform:translate(-2px,-2px)}
    .btn.pri{
      background:var(--color-accent);
      color:#fff;
      border-color:var(--ink);
      box-shadow:5px 5px 0 var(--ink);
    }
    .btn.pri:hover{background:#047857}
    .kpis{
      display:grid;
      grid-template-columns:1.25fr .75fr 1fr 1fr;
      gap:0;
      margin-bottom:20px;
      border:3px solid var(--ink);
      background:var(--ink);
    }
    .g2{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}
    .g2b{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .g-form{display:grid;grid-template-columns:1.6fr .8fr;gap:18px}
    .card{
      min-width:0;
      position:relative;
      padding:18px;
      background:var(--card);
      color:var(--ink);
      border:2px solid var(--ink);
      border-radius:0;
      box-shadow:6px 6px 0 var(--line);
    }
    .card h3{
      margin:0 0 4px;
      display:flex;
      align-items:center;
      gap:8px;
      font-family:var(--display);
      font-size:21px;
      font-weight:700;
      line-height:1.15;
    }
    .card h3 .ms{
      width:30px;
      height:30px;
      display:grid;
      place-items:center;
      flex:none;
      color:#fff;
      background:var(--blue);
      border:2px solid var(--ink);
      font-size:18px;
    }
    .card .sub{
      margin:0 0 16px;
      color:var(--muted);
      font-size:14px;
    }
    .kpi{
      min-height:154px;
      padding:18px;
      border:0;
      border-right:2px solid var(--ink);
      box-shadow:none;
      overflow:hidden;
    }
    .kpi:last-child{border-right:0}
    .kpi:nth-child(2){background:var(--color-muted)}
    .kpi:nth-child(3){background:#DBEAFE}
    .kpi:nth-child(4){background:#ECFDF5}
    .kpi .lab{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-family:var(--label);
      font-size:10px;
      font-weight:600;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .kpi .lab .ms{color:var(--blue);font-size:20px}
    .kpi .val{
      margin-top:12px;
      font-family:var(--display);
      font-size:39px;
      font-weight:700;
      line-height:1;
      letter-spacing:-.025em;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{
      margin-left:4px;
      color:var(--muted);
      font-family:var(--body);
      font-size:14px;
      font-weight:600;
    }
    .kpi .dt{
      margin-top:11px;
      display:flex;
      align-items:center;
      gap:5px;
      font-size:13px;
      font-weight:700;
    }
    .up{color:#047857}
    .down{color:#B91C1C}
    .flat{color:var(--muted)}
    .scroll{
      max-width:100%;
      overflow-x:auto;
      border:1px solid var(--ink);
      -webkit-overflow-scrolling:touch;
    }
    table{
      width:100%;
      min-width:560px;
      border-collapse:collapse;
      background:#fff;
      font-size:15px;
    }
    th{
      padding:11px 12px;
      text-align:left;
      color:#fff;
      background:var(--ink);
      border-right:1px solid #334155;
      border-bottom:2px solid var(--ink);
      font-family:var(--label);
      font-size:9px;
      font-weight:600;
      letter-spacing:.07em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    td{
      padding:12px;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      vertical-align:middle;
    }
    tbody tr:nth-child(even){background:#F8FAFC}
    tbody tr:hover{background:#DBEAFE}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    td:first-child b,.mono{
      font-family:var(--mono);
      font-variant-numeric:tabular-nums;
      font-feature-settings:"tnum";
    }
    .chart{width:100%;overflow:hidden}
    .pill{
      min-height:25px;
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:3px 8px;
      border:1px solid currentColor;
      border-radius:0;
      font-family:var(--label);
      font-size:9px;
      font-weight:600;
      letter-spacing:.025em;
      white-space:nowrap;
    }
    .p-ok{background:#D1FAE5;color:#065F46}
    .p-warn{background:#FEF3C7;color:#92400E}
    .p-bad{background:#FEE2E2;color:#991B1B}
    .p-info{background:#DBEAFE;color:#1E40AF}
    .p-mute{background:#E2E8F0;color:#334155}
    .dot{
      width:9px;
      height:9px;
      display:inline-block;
      border:1px solid currentColor;
      border-radius:0;
    }
    .live{animation:pulse 1.6s steps(2,end) infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .fld{margin-bottom:14px}
    .fld label{
      display:block;
      margin-bottom:5px;
      color:var(--muted);
      font-family:var(--label);
      font-size:10px;
      font-weight:600;
      letter-spacing:.055em;
      text-transform:uppercase;
    }
    .fld input,.fld select{
      width:100%;
      min-height:43px;
      padding:8px 10px;
      color:var(--ink);
      background:#fff;
      border:2px solid var(--ink);
      border-radius:0;
      font-size:16px;
    }
    .fld input[readonly]{background:var(--color-muted);font-family:var(--mono)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .totbox{
      padding:17px 18px;
      color:#fff;
      background:var(--blue);
      border:3px solid var(--ink);
      border-radius:0;
      box-shadow:5px 5px 0 var(--ink);
    }
    .totbox .r{
      display:flex;
      justify-content:space-between;
      gap:18px;
      padding:5px 0;
      color:#EFF6FF;
      font-size:15px;
    }
    .totbox .r b{color:#fff;font-variant-numeric:tabular-nums}
    .totbox .big{
      margin-top:8px;
      padding-top:12px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
      border-top:2px solid #fff;
      color:#fff;
      font-family:var(--display);
      font-size:20px;
      font-weight:700;
    }
    .totbox .big b{font-size:27px}
    .meter{
      height:14px;
      overflow:hidden;
      background:#E2E8F0;
      border:1px solid var(--ink);
      border-radius:0;
    }
    .meter i{display:block;height:100%;border-radius:0}
    .tl{position:relative;padding-left:31px}
    .tl:before{
      content:"";
      position:absolute;
      left:9px;
      top:5px;
      bottom:5px;
      width:3px;
      background:var(--ink);
    }
    .tl-item{position:relative;padding:0 0 20px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item .mk{
      position:absolute;
      left:-31px;
      top:1px;
      width:21px;
      height:21px;
      display:grid;
      place-items:center;
      background:#fff;
      border:3px solid var(--blue);
      border-radius:0;
    }
    .tl-item.cur .mk{background:var(--blue)}
    .tl-item .tt{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:15px;
      font-weight:700;
    }
    .tl-item .mt{margin-top:3px;color:var(--muted);font-size:14px}
    .tl-item .dd{
      margin-top:7px;
      padding:10px;
      color:var(--muted);
      background:var(--color-muted);
      border:1px solid var(--ink);
      border-radius:0;
      font-size:14px;
    }
    .apr{display:flex;flex-wrap:wrap}
    .apr .st{
      position:relative;
      flex:1;
      min-width:120px;
      padding:0 7px;
      text-align:center;
    }
    .apr .st .c{
      width:39px;
      height:39px;
      margin:0 auto 8px;
      display:grid;
      place-items:center;
      color:#475569;
      background:#E2E8F0;
      border:2px solid var(--ink);
      border-radius:0;
      font-family:var(--mono);
      font-weight:700;
    }
    .apr .st.done .c{color:#fff;background:var(--ok)}
    .apr .st.cur .c{color:#fff;background:var(--blue);box-shadow:4px 4px 0 var(--ink)}
    .apr .st .n{font-size:14px;font-weight:700}
    .apr .st .r{color:var(--muted);font-size:12px}
    .apr .st:not(:last-child):after{
      content:"";
      position:absolute;
      z-index:0;
      top:19px;
      left:64%;
      right:-36%;
      height:2px;
      background:var(--ink);
    }
    .apr .st.done:not(:last-child):after{background:var(--ok)}
    .flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .flag{
      min-height:37px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      background:#fff;
      border:1px solid var(--ink);
      border-radius:0;
      font-size:14px;
    }
    .muted{color:var(--muted)}
    hr.sep{margin:15px 0;border:0;border-top:2px solid var(--ink)}
    .legend{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
    }
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .tag{
      display:inline-block;
      padding:2px 7px;
      color:#1E40AF;
      background:#DBEAFE;
      border:1px solid #1E40AF;
      border-radius:0;
      font-family:var(--mono);
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }
    .grid-item,.card,.kpi{animation:reveal .4s both}
    .kpi:nth-child(2){animation-delay:.06s}
    .kpi:nth-child(3){animation-delay:.12s}
    .kpi:nth-child(4){animation-delay:.18s}
    @keyframes reveal{
      from{opacity:0;transform:translateY(16px) scale(.96)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1024px){
      .g2,.g-form{grid-template-columns:1fr}
      .head{grid-template-columns:1fr}
      .head>div:last-child{justify-content:flex-start}
      .kpis{grid-template-columns:repeat(2,1fr)}
      .kpi:nth-child(2){border-right:0}
      .kpi:nth-child(-n+2){border-bottom:2px solid var(--ink)}
    }
    @media(max-width:768px){
      main{padding:36px 14px 54px}
      .tb-in{padding:10px 14px}
      .tb-right .tb-user:first-child{display:none}
      .g2b,.g3{grid-template-columns:1fr}
      .card{padding:15px}
      .head{padding:20px 16px}
      .head h1{font-size:36px}
      .nav-in{padding:0}
      .nav button{min-width:54px;padding:12px}
      .nav button .lbl{display:none}
    }
    @media(max-width:480px){
      .brand span{display:none}
      .brand b{font-size:19px}
      .logo{width:42px;height:42px}
      .tb-user{padding:5px 7px;font-size:12px}
      .tb-user .av{display:none}
      .topbar:after{display:none}
      .kpis{grid-template-columns:1fr}
      .kpi{border-right:0;border-bottom:2px solid var(--ink)}
      .kpi:last-child{border-bottom:0}
      .row2{grid-template-columns:1fr}
      .head h1{font-size:32px}
      .totbox .big{display:block}
      .totbox .big b{display:block;margin-top:5px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      .live{animation:none}
      .grid-item,.card,.kpi{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="tb-in">
      <div class="brand">
        <div class="logo"><span class="ms">request_quote</span></div>
        <div><b>報價管理平台</b><span>Quotation Management · 智慧製造業務中樞</span></div>
      </div>
      <div class="tb-right">
        <span class="tb-user"><span class="dot live" style="background:#7cf5b8"></span>ERP 已同步</span>
        <span class="tb-user"><span class="av">陳</span>陳雅婷 · 業務部</span>
      </div>
    </div>
  </header>
  <nav class="nav" aria-label="主要功能">
    <div class="nav-in" id="navbar"></div>
  </nav>
  <main><div id="view"></div></main>

  <script>
  "use strict";
  var BLUE="#2563EB",BLUE2="#3B82F6",OK="#047857",WARN="#A54B08",BAD="#DC2626",SUB="#475569",LINE="#E4ECFC";
  var charts=[];

    +'<div class="kpis">'+kpi("QT-0417 版本數","history","4","含 1 目前","","flat","版")+kpi("累計議價回合","forum","3","客戶端","","flat","次")+kpi("首末版差額","trending_down","-9.9","降幅","","flat","%")+kpi("版本鎖定狀態","lock","已鎖","送簽中","","flat","")+'</div>'

  }

  function s5(){

  }

  function baseGrid(){return {borderColor:LINE,strokeDashArray:0,padding:{left:6,right:10}};}
  function commonChart(type,height){
    return {redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:type,height:height,toolbar:{show:false},fontFamily:"Crimson Pro,Georgia,serif",foreColor:SUB,background:"transparent"};
  }
  function drawCharts(i){
    if(i===1){
      var el=document.getElementById("c1");if(!el)return;
      var c=new ApexCharts(el,{chart:commonChart("bar",280),series:[{name:"折扣%",data:[8,5,14,18,0]},{name:"毛利率%",data:[29,26,21.6,16.7,25]}],colors:[BLUE2,BLUE],plotOptions:{bar:{columnWidth:"58%",borderRadius:0}},dataLabels:{enabled:false},xaxis:{categories:["CNC-4020","MLD-A17","PCB-6L","ASM-LN3","CST-SUR"],labels:{style:{fontFamily:"SFMono-Regular,Consolas,monospace",fontSize:"10px",colors:SUB}}},yaxis:{labels:{style:{colors:SUB},formatter:function(v){return v+"%";}}},grid:baseGrid(),legend:{position:"top",fontSize:"13px"},annotations:{yaxis:[{y:15,borderColor:BAD,strokeDashArray:5,label:{text:"毛利底線 15%",style:{color:"#fff",background:BAD,fontSize:"11px"}}}]},tooltip:{shared:true,intersect:false}});
      c.render();charts.push(c);
    }else if(i===2){
      var el2=document.getElementById("c2");if(!el2)return;
      var c2=new ApexCharts(el2,{chart:commonChart("area",300),series:[{name:"USD/TWD",data:[31.42,31.55,31.48,31.62,31.70,31.58,31.66,31.74,31.69,31.80,31.77,31.85]}],colors:[BLUE],stroke:{curve:"straight",width:3},fill:{type:"solid",opacity:.12},dataLabels:{enabled:false},xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8","W9","W10","W11","W12"],labels:{style:{fontFamily:"SFMono-Regular,Consolas,monospace",colors:SUB,fontSize:"10px"}}},yaxis:{min:31.2,max:32,labels:{style:{colors:SUB},formatter:function(v){return v.toFixed(2);}}},grid:baseGrid(),tooltip:{y:{formatter:function(v){return v.toFixed(3);}}}});
      c2.render();charts.push(c2);
    }else if(i===3){
      var el3=document.getElementById("c3");if(!el3)return;
      var c3=new ApexCharts(el3,{chart:commonChart("donut",300),series:[42,9,12,3],labels:["已核准","待核准","自動放行","已退回"],colors:[OK,BLUE,BLUE2,BAD],stroke:{colors:["#0F172A"],width:2},legend:{position:"bottom",fontSize:"13px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},plotOptions:{pie:{donut:{size:"58%",labels:{show:true,total:{show:true,label:"本月報價",fontSize:"14px",color:SUB,formatter:function(){return "66 件";}}}}}}});
      c3.render();charts.push(c3);
    }else if(i===4){
      var el4=document.getElementById("c4");if(!el4)return;
      var c4=new ApexCharts(el4,{chart:commonChart("line",250),series:[{name:"報價總額 (萬)",data:[304,286,279,274]}],colors:[BLUE],stroke:{curve:"straight",width:3},markers:{size:6,shape:"square",colors:["#fff"],strokeColors:BLUE,strokeWidth:3},dataLabels:{enabled:true,formatter:function(v){return v;},style:{colors:[BLUE],fontSize:"11px"},background:{enabled:true,foreColor:"#fff",borderWidth:1,borderColor:"#0F172A",borderRadius:0}},xaxis:{categories:["v1","v2","v3","v4"],labels:{style:{fontFamily:"SFMono-Regular,Consolas,monospace",colors:SUB}}},yaxis:{labels:{style:{colors:SUB},formatter:function(v){return v+"萬";}}},grid:baseGrid()});
      c4.render();charts.push(c4);
    }else if(i===5){
      var a=document.getElementById("c5a");
      if(a){var ca=new ApexCharts(a,{chart:commonChart("bar",280),series:[{name:"件數",data:[142,98,71,52,41]}],plotOptions:{bar:{horizontal:true,borderRadius:0,barHeight:"60%",distributed:true}},colors:["#93C5FD","#60A5FA","#3B82F6","#2563EB","#1D4ED8"],dataLabels:{enabled:true,style:{colors:["#0F172A"],fontSize:"13px"}},xaxis:{categories:["收到詢價","已出報價","客戶議價","主管核准","成交轉單"],labels:{style:{colors:SUB}}},yaxis:{labels:{style:{colors:SUB,fontSize:"12px"}}},legend:{show:false},grid:baseGrid(),tooltip:{enabled:true}});ca.render();charts.push(ca);}
      var b=document.getElementById("c5b");
      if(b){var cb=new ApexCharts(b,{chart:commonChart("line",280),series:[{name:"轉單率 %",type:"column",data:[48,51,53,56,58,61.5]},{name:"產出時效 (天)",type:"line",data:[2.6,2.3,2.1,1.9,1.6,1.4]}],colors:[BLUE2,WARN],stroke:{width:[0,3],curve:"straight"},plotOptions:{bar:{columnWidth:"50%",borderRadius:0}},dataLabels:{enabled:false},xaxis:{categories:["3月","4月","5月","6月","7月","8月"],labels:{style:{colors:SUB}}},yaxis:[{labels:{style:{colors:SUB},formatter:function(v){return v+"%";}}},{opposite:true,labels:{style:{colors:SUB},formatter:function(v){return v+"天";}}}],legend:{position:"top",fontSize:"13px"},grid:baseGrid()});cb.render();charts.push(cb);}
      var dd=document.getElementById("c5c");
      if(dd){var cd=new ApexCharts(dd,{chart:commonChart("bar",280),series:[{name:"件數",data:[18,14,11,8,5]}],colors:[BAD],plotOptions:{bar:{columnWidth:"52%",borderRadius:0}},dataLabels:{enabled:true,style:{colors:["#fff"]}},xaxis:{categories:["價格過高","交期過長","競品替代","規格不符","客戶取消"],labels:{style:{colors:SUB,fontSize:"11px"}}},yaxis:{labels:{style:{colors:SUB}}},legend:{show:false},grid:baseGrid()});cd.render();charts.push(cd);}
    }
  }

  var SCREENS=[s0,s1,s2,s3,s4,s5];
  function show(i){
    if(i<0||i>=SCREENS.length)i=0;
    killCharts();
    var view=document.getElementById("view");
    view.innerHTML=SCREENS[i]();
    setOn(i);
    void view.offsetHeight;
    drawCharts(i);
  }
  buildNav();
  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return;}
    var n=document.querySelectorAll("[data-i]").length||6;
    show(Math.min(+m[1],n-1));
    try{window.scrollTo(0,0);}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
  </script>
