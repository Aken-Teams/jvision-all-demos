<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>財務會計系統 · FAS｜Jvision 系統 Demo</title>
<meta name="description" content="傳票、應收付、現金流、預算到月結的財務即時掌握（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root {
  --color-primary: #0f172a;
  --color-on-primary: #ffffff;
  --color-secondary: #1e293b;
  --color-on-secondary: #ffffff;
  --color-accent: #22c55e;
  --color-on-accent: #0f172a;
  --color-background: #020617;
  --color-foreground: #f8fafc;
  --color-card: #0e1223;
  --color-card-foreground: #f8fafc;
  --color-muted: #1a1e2f;
  --color-muted-foreground: #94a3b8;
  --color-border: #334155;
  --color-destructive: #ef4444;
  --color-ring: #ffffff;
  --blue: #22c55e;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --line: #334155;
  --body: #cbd5e1;
  --bg: #020617;
  --card: #0e1223;
  --pri: #22c55e;
  --pri2: #4ade80;
  --pri-d: #020617;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;
  --sky: #60a5fa;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 82% -10%, rgba(34,197,94,.08), transparent 30rem),
    var(--bg);
  color: var(--body);
  font-family: "IBM Plex Sans", "Microsoft JhengHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  line-height: 1;
}
:focus-visible {
  outline: 2px solid var(--color-ring);
  outline-offset: 3px;
}

.shell {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}
.side {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  padding: 20px 14px;
  overflow-y: auto;
  background: #070b16;
  border-right: 1px solid var(--line);
  color: var(--body);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 2px 8px 22px;
  border-bottom: 1px solid rgba(148,163,184,.18);
}
.brand .lg {
  display: grid;
  place-content: center;
  flex: none;
  width: 38px;
  height: 38px;
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-radius: 5px;
  box-shadow: 0 8px 22px rgba(34,197,94,.16);
}
.brand .lg .material-symbols-outlined { font-size: 22px; }
.brand b {
  display: block;
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .04em;
}
.brand span:not(.material-symbols-outlined) {
  display: block;
  margin-top: 1px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding-top: 18px;
}
.nav button {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-width: 0;
  min-height: 42px;
  padding: 9px 11px;
  color: #aebdd1;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  transition: color 200ms ease, background 200ms ease, border-color 200ms ease, transform 200ms ease;
}
.nav button:hover {
  color: var(--ink);
  background: var(--color-muted);
  border-color: var(--line);
  transform: translateX(2px);
}
.nav button.on {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(34,197,94,.13);
}
.nav button.on::before {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: -12px;
  width: 3px;
  background: #86efac;
  content: "";
}
.nav button .material-symbols-outlined { flex: none; font-size: 19px; }
.nav button .nx {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.side .foot {
  margin-top: auto;
  padding: 16px 8px 0;
  color: var(--muted);
  border-top: 1px solid rgba(148,163,184,.18);
  font-size: 10px;
  line-height: 1.65;
}
.side .foot b { color: #dbe4ef; font-weight: 600; }

.main { display: flex; flex-direction: column; min-width: 0; }
.top {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  min-height: 64px;
  padding: 12px 24px;
  background: rgba(2,6,23,.9);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.top h1 {
  min-width: 0;
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.top .r { display: flex; align-items: center; flex: none; gap: 10px; margin-left: auto; }
.live {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 9px;
  color: #bbf7d0;
  background: rgba(34,197,94,.1);
  border: 1px solid rgba(74,222,128,.32);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.live .dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border: 2px solid #14532d;
  border-radius: 50%;
}
.ava {
  display: grid;
  place-content: center;
  flex: none;
  width: 34px;
  height: 34px;
  color: var(--ink);
  background: var(--color-secondary);
  border: 1px solid #475569;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 700;
}
.body { min-width: 0; padding: 22px 24px 42px; }
.vh {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.vh h2 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(20px, 2vw, 25px);
  font-weight: 600;
  letter-spacing: -.025em;
}
.vh p { max-width: 680px; margin: 3px 0 0; color: #a7b5c8; font-size: 12px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 40px;
  padding: 0 15px;
  color: var(--color-on-accent);
  background: var(--color-accent);
  border: 1px solid var(--color-accent);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 700;
  transition: background 200ms ease, border-color 200ms ease, transform 200ms ease;
}
.btn:hover { background: #4ade80; border-color: #4ade80; transform: translateY(-1px); }
.btn .material-symbols-outlined { font-size: 18px; }

.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi {
  position: relative;
  min-width: 0;
  padding: 14px 15px 13px;
  overflow: hidden;
  background: linear-gradient(145deg, rgba(30,41,59,.42), transparent 70%), var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 10px 32px rgba(0,0,0,.16);
  transition: border-color 220ms ease, transform 220ms ease, box-shadow 220ms ease;
}
.kpi::after {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 2px;
  background: var(--color-accent);
  content: "";
}
.kpi:hover {
  border-color: #4b5f76;
  transform: translateY(-2px);
  box-shadow: 0 14px 38px rgba(0,0,0,.24);
}
.kpi .l {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #a7b5c8;
  font-size: 11px;
  font-weight: 500;
}
.kpi .l .material-symbols-outlined { color: var(--green); font-size: 16px; }
.kpi .v {
  margin-top: 7px;
  color: var(--ink);
  font-family: "IBM Plex Sans", monospace;
  font-size: clamp(21px, 2vw, 27px);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: -.04em;
  line-height: 1.1;
}
.kpi .v small { color: #a7b5c8; font-size: 11px; font-weight: 500; letter-spacing: 0; }
.kpi .d {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 6px;
  color: #86efac;
  font-size: 11px;
  font-weight: 600;
}
.kpi .d.dn { color: #fca5a5; }
.kpi .d .material-symbols-outlined { font-size: 14px; }

.grid { display: grid; gap: 14px; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g2b { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card {
  min-width: 0;
  padding: 16px 17px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 12px 34px rgba(0,0,0,.14);
  transition: border-color 220ms ease, box-shadow 220ms ease;
}
.card:hover { border-color: #405269; box-shadow: 0 16px 42px rgba(0,0,0,.2); }
.card > h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 13px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .01em;
}
.card > h3 .material-symbols-outlined { color: var(--green); font-size: 18px; }
.card > h3 .grow {
  margin-left: auto;
  color: #86efac;
  font-family: ui-monospace, "IBM Plex Mono", monospace;
  font-size: 11px;
  font-weight: 500;
}
.chart { width: 100%; overflow: hidden; }
.scroll { overflow-x: auto; scrollbar-color: #475569 #111827; scrollbar-width: thin; }

.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th {
  padding: 9px 10px;
  color: #b6c2d1;
  background: #111827;
  border-bottom: 1px solid #475569;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .07em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}
.tbl td {
  padding: 9px 10px;
  color: #cbd5e1;
  border-bottom: 1px solid rgba(51,65,85,.72);
  white-space: nowrap;
  transition: background 180ms ease, color 180ms ease;
}
.tbl tbody tr:hover td { color: var(--ink); background: rgba(30,41,59,.62); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num {
  color: var(--ink);
  font-family: ui-monospace, "IBM Plex Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  text-align: right;
}
.tbl td:nth-child(2) { font-family: ui-monospace, "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.tag {
  display: inline-flex;
  align-items: center;
  min-height: 21px;
  padding: 2px 8px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  line-height: 1.2;
}
.t-g { color: #86efac; background: rgba(34,197,94,.11); }
.t-a { color: #fde68a; background: rgba(245,158,11,.12); }
.t-r { color: #fca5a5; background: rgba(239,68,68,.12); }
.t-b { color: #c4b5fd; background: rgba(139,92,246,.13); }
.t-s { color: #93c5fd; background: rgba(59,130,246,.13); }
.t-n { color: #cbd5e1; background: rgba(148,163,184,.1); }

.vrow {
  display: grid;
  grid-template-columns: 1.6fr 2.4fr 1fr 1fr;
  align-items: center;
  min-width: 520px;
  color: #cbd5e1;
  border-bottom: 1px solid rgba(51,65,85,.75);
  font-size: 12px;
}
.vrow.h {
  color: #b6c2d1;
  background: #111827;
  border-bottom-color: #475569;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.vrow > div { padding: 9px 10px; }
.vrow .num {
  font-family: ui-monospace, "IBM Plex Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  text-align: right;
}
.vrow .num.dr { color: #93c5fd; }
.vrow .num.cr { color: #86efac; }
.vtot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  padding: 10px 11px;
  color: var(--ink);
  background: rgba(34,197,94,.08);
  border: 1px solid rgba(74,222,128,.3);
  border-radius: 4px;
  font-family: ui-monospace, "IBM Plex Mono", monospace;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  flex-wrap: wrap;
}
.vtot .ok { display: inline-flex; align-items: center; gap: 4px; color: #86efac; font-family: "IBM Plex Sans", sans-serif; }
.vtot .ok .material-symbols-outlined { font-size: 16px; }
.fld { margin: 0 0 5px; color: #a7b5c8; font-size: 10px; font-weight: 500; letter-spacing: .04em; }
.inp {
  display: flex;
  align-items: center;
  min-height: 36px;
  padding: 0 10px;
  color: #e2e8f0;
  background: #090e1c;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }

.agebar { display: flex; height: 13px; overflow: hidden; background: #111827; border: 1px solid #475569; border-radius: 2px; }
.agebar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; color: #cbd5e1; font-size: 11px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 1px solid rgba(255,255,255,.35); border-radius: 2px; vertical-align: -1px; }

.kb { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kcol { min-width: 0; padding: 10px; background: #090e1c; border: 1px solid var(--line); border-radius: 5px; }
.kcol > h4 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 9px; color: var(--ink); font-size: 11px; font-weight: 600; }
.kcol > h4 .cnt { padding: 1px 7px; color: #bbf7d0; background: rgba(34,197,94,.11); border: 1px solid rgba(74,222,128,.28); border-radius: 999px; font-size: 10px; }
.kcard { margin-bottom: 8px; padding: 10px 10px 9px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 4px; transition: border-color 200ms ease, transform 200ms ease; }
.kcard:last-child { margin-bottom: 0; }
.kcard:hover { border-color: #64748b; transform: translateY(-1px); }
.kcard b { display: block; color: var(--ink); font-size: 11px; font-weight: 600; }
.kcard .m { margin: 5px 0 2px; color: var(--ink); font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; }
.kcard small { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 5px; color: #a7b5c8; font-size: 10px; }

.ccy { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ccy .c { min-width: 0; padding: 12px 13px; background: #090e1c; border: 1px solid var(--line); border-radius: 4px; transition: border-color 200ms ease, transform 200ms ease; }
.ccy .c:hover { border-color: #64748b; transform: translateY(-1px); }
.ccy .c .fx { display: flex; align-items: center; gap: 6px; color: #a7b5c8; font-size: 10px; font-weight: 500; }
.ccy .c .fx b { padding: 2px 6px; color: #bbf7d0; background: rgba(34,197,94,.1); border: 1px solid rgba(74,222,128,.28); border-radius: 2px; }
.ccy .c .amt { margin-top: 7px; color: var(--ink); font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -.03em; }
.ccy .c .twd { margin-top: 2px; color: #a7b5c8; font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10px; }

.bprog { height: 7px; margin-top: 5px; overflow: hidden; background: #1e293b; border-radius: 1px; }
.bprog span { display: block; height: 100%; background: var(--green); }
.bprog span.over { background: var(--red); }
.bprog span.warn { background: var(--amber); }
.steps { position: relative; padding-left: 25px; }
.steps::before { position: absolute; top: 6px; bottom: 6px; left: 9px; width: 1px; background: #475569; content: ""; }
.step { position: relative; padding: 0 0 18px; }
.step:last-child { padding-bottom: 0; }
.step .dot { position: absolute; top: 1px; left: -25px; display: grid; place-content: center; width: 19px; height: 19px; color: #020617; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; }
.step .dot .material-symbols-outlined { font-size: 13px; }
.d-ok { background: var(--green); }
.d-run { background: #60a5fa; }
.d-wait { color: #e2e8f0 !important; background: #475569; }
.step b { color: var(--ink); font-size: 12px; font-weight: 600; }
.step small { display: block; margin-top: 2px; color: #a7b5c8; font-size: 11px; }
.step .when { margin-left: 7px; color: #86efac; font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; }
.audit { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(51,65,85,.76); }
.audit:first-of-type { border-top: 0; }
.audit .ic { display: grid; place-content: center; flex: none; width: 30px; height: 30px; color: #86efac; background: rgba(34,197,94,.1); border: 1px solid rgba(74,222,128,.25); border-radius: 4px; }
.audit .ic .material-symbols-outlined { font-size: 17px; }
.audit p { margin: 0; color: #cbd5e1; font-size: 11px; line-height: 1.55; }
.audit b { color: var(--ink); font-weight: 600; }
.audit .tm { color: #a7b5c8; font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10px; }
.hint { display: flex; align-items: flex-start; gap: 6px; margin-top: 11px; color: #a7b5c8; font-size: 10px; }
.hint .material-symbols-outlined { flex: none; color: #86efac; font-size: 15px; }

.apexcharts-canvas text { fill: #a7b5c8 !important; font-family: "IBM Plex Sans", sans-serif !important; }
.apexcharts-gridline { stroke: #263449 !important; }
.apexcharts-xaxis line, .apexcharts-yaxis line { stroke: #475569 !important; }
.apexcharts-legend-text { color: #cbd5e1 !important; }
.apexcharts-tooltip, .apexcharts-tooltip-title {
  color: var(--ink) !important;
  background: #111827 !important;
  border-color: #475569 !important;
}
.apexcharts-series:nth-child(1) path { stroke: #22c55e !important; }
.apexcharts-series:nth-child(2) path { stroke: #60a5fa !important; }

#view > * { animation: enter 400ms cubic-bezier(.2,.8,.2,1) both; }
#view > *:nth-child(2) { animation-delay: 45ms; }
#view > *:nth-child(3) { animation-delay: 90ms; }
#view > *:nth-child(4) { animation-delay: 135ms; }
@keyframes enter {
  from { opacity: 0; transform: translateY(12px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 1024px) {
  .shell { grid-template-columns: 210px minmax(0, 1fr); }
  .body { padding: 20px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ccy { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .shell { grid-template-columns: 1fr; }
  .side {
    position: sticky;
    height: auto;
    max-height: none;
    padding: 10px 12px 8px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .brand { padding: 0 2px 9px; border-bottom: 0; }
  .brand .lg { width: 34px; height: 34px; }
  .side .foot { display: none; }
  .nav { flex-direction: row; gap: 5px; padding: 0 0 2px; overflow-x: auto; }
  .nav button { flex: 0 0 auto; width: auto; min-height: 40px; padding: 8px 10px; }

  var SCREENS=[s0,s1,s2,s3,s4,s5];

  function mkChart(id,opt){
    var el=document.getElementById(id);
    if(!el) return;
    try{ var ch=new ApexCharts(el,opt); ch.render(); }catch(e){}
  }

  function show(i){
    if(chart){ try{ chart.destroy(); }catch(e){} chart=null; }
    document.querySelectorAll("[data-i]").forEach(function(b){
      b.classList.toggle("on", +b.getAttribute("data-i")===i);
    });
    document.getElementById("ttl").textContent=MODS[i].name;
    SCREENS[i]();
  }
  window.__show=show;
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){window.__show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;window.__show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
