<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多廠協同管理平台（Multi-Plant Collaboration Platform）｜Jvision 系統 Demo</title>
<meta name="description" content="跨廠產能可視化、訂單跨廠分配建議、跨廠庫存調撥與各廠績效比較的集團協同平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --pink:#db2777; --pink2:#f472b6; --pink-soft:#fce7f3; --pink-soft2:#fbcfe8;
  --ink:#1f2937; --muted:#6b7280; --line:#eee1e9; --bg:#fdf6fa; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#9d174d,#db2777 55%,#f472b6);color:#fff;box-shadow:0 2px 14px rgba(157,23,77,.25)}
.topbar-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.32);flex:none}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:11px;opacity:.82;white-space:nowrap}
.brand-txt{min-width:0}
.topbar .spacer{flex:1 1 auto;min-width:8px}
.env{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.env .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}
.env .pill .material-symbols-outlined{font-size:16px}

nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tabs-inner{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px}
.tab{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab .material-symbols-outlined{font-size:19px}
.tab:hover{background:var(--pink-soft);color:var(--pink)}
.tab.active{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(219,39,119,.3)}
.tab .idx{font-size:11px;opacity:.6;font-weight:700}
.tab.active .idx{opacity:.85}
@media(max-width:560px){ .tab .tlabel{display:none} }

main{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.screen-head .ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--pink2));display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(219,39,119,.3)}
.screen-head .ic .material-symbols-outlined{color:#fff;font-size:26px}
.screen-head h2{margin:0;font-size:20px;font-weight:800}
.screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:640px}
.screen-head .tag{margin-left:auto;align-self:center;background:var(--pink-soft);color:var(--pink);border:1px solid var(--pink-soft2);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;flex:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(157,23,77,.05);min-width:0}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.card-h .material-symbols-outlined{font-size:20px;color:var(--pink)}
.card-h h3{margin:0;font-size:15px;font-weight:800}
.card-h .sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-32{grid-template-columns:2fr 1fr}
.g-23{grid-template-columns:1fr 2fr}
.grid>*{min-width:0}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr}
  .g-2,.g-3,.g-32,.g-23{grid-template-columns:1fr}
}
@media(max-width:480px){ .g-kpi{grid-template-columns:1fr} }

.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--pink),var(--pink2))}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--pink)}
.kpi .val{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .dt{font-size:11px;margin-top:5px;font-weight:700;display:flex;align-items:center;gap:3px}
.kpi .dt.up{color:var(--ok)} .kpi .dt.down{color:var(--bad)} .kpi .dt.flat{color:var(--muted)}
.kpi .dt .material-symbols-outlined{font-size:15px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fdf3f8}
tbody tr:hover{background:#fef6fb}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.6}
.chip .material-symbols-outlined{font-size:14px}
.c-ok{background:#dcfce7;color:#166534} .c-warn{background:#fef3c7;color:#92400e}
.c-bad{background:#fee2e2;color:#991b1b} .c-info{background:#dbeafe;color:#1e40af}
.c-pink{background:var(--pink-soft);color:var(--pink)} .c-mut{background:#f1f0f3;color:#555}

.bar{height:8px;border-radius:999px;background:#f0e6ee;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--pink2))}
.bar.g>i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bar.w>i{background:linear-gradient(90deg,#d97706,#fbbf24)}
.bar.r>i{background:linear-gradient(90deg,#dc2626,#f87171)}

.chartbox{position:relative;width:100%;height:280px}
.chartbox.sm{height:230px}

.plant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plant-grid>*{min-width:0}
@media(max-width:820px){.plant-grid{grid-template-columns:1fr}}
.plant{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.plant .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.plant .dot{width:10px;height:10px;border-radius:50%;flex:none}
.plant .nm{font-weight:800;font-size:14px}
.plant .loc{font-size:11px;color:var(--muted);margin-left:auto}
.plant .mrow{display:flex;justify-content:space-between;font-size:12px;margin:5px 0}
.plant .mrow span:last-child{font-weight:800}

.alloc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alloc .ord{min-width:150px;flex:1 1 150px}
.alloc .ord .id{font-weight:800;font-size:14px}
.alloc .ord .meta{font-size:11px;color:var(--muted);margin-top:2px}
.alloc .arrow{color:var(--pink)}
.alloc .plants-pick{display:flex;gap:8px;flex-wrap:wrap;flex:2 1 260px;min-width:0}
.pk{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;min-width:0}
.pk.best{border-color:var(--pink);background:var(--pink-soft)}
.pk .pn{font-weight:800}
.pk .sc{font-size:11px;color:var(--muted)}
.pk.best .sc{color:var(--pink);font-weight:700}

.tf{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;flex-wrap:wrap}
.tf .node{font-weight:800;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;white-space:nowrap}
.tf .flowline{flex:1 1 60px;height:2px;background:repeating-linear-gradient(90deg,var(--pink) 0 8px,transparent 8px 14px);position:relative;min-width:40px}
.tf .flowline .material-symbols-outlined{position:absolute;right:-6px;top:-11px;color:var(--pink);font-size:20px}
.tf .item{font-size:12px;color:var(--muted);min-width:0}
.tf .qty{font-weight:800;color:var(--pink)}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--pink-soft2)}
.tl .ev{position:relative;padding:0 0 16px 8px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pink)}
.tl .ev.ok::before{border-color:var(--ok)}
.tl .ev.warn::before{border-color:var(--warn)}
.tl .ev .t{font-size:11px;color:var(--muted);font-weight:700}
.tl .ev .m{font-weight:700;font-size:13px;margin-top:1px}
.tl .ev .d{font-size:12px;color:var(--muted);margin-top:1px}

.sync-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;flex-wrap:wrap}
.sync-row .sysic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--pink-soft)}
.sync-row .sysic .material-symbols-outlined{color:var(--pink);font-size:22px}
.sync-row .info{flex:1 1 160px;min-width:0}
.sync-row .info .n{font-weight:800;font-size:14px}
.sync-row .info .s{font-size:11px;color:var(--muted)}

.note{font-size:12px;color:var(--muted);background:#fdf3f8;border:1px dashed var(--pink-soft2);border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.note .material-symbols-outlined{font-size:17px;color:var(--pink);flex:none}
.mb{margin-bottom:14px}
.foot{max-width:1360px;margin:0 auto;padding:14px 18px 34px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div class="brand-txt">
        <h1>多廠協同管理平台</h1>
        <p>Multi-Plant Collaboration Platform</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="env">
      <span class="pill"><span class="material-symbols-outlined">factory</span>6 廠區</span>
      <span class="pill"><span class="material-symbols-outlined">sync</span>ERP／APS／WMS 已同步</span>
    </div>
  </div>
</header>
<nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>
<main><div id="view"></div></main>
<div class="foot">Jvision 系統 Demo · 純前端展示 · 內容為模擬數據</div>

<script>
"use strict";
var PINK="#db2777", PINK2="#f472b6", GRID="#f0e6ee", MUT="#9ca3af";

var MODULES=[
  {icon:"hub",name:"多廠協同總覽",desc:"集團各廠產能、負載與狀態即時彙整"},
  {icon:"speed",name:"跨廠產能可視化",desc:"各廠產能利用率與均衡度分析"},
  {icon:"alt_route",name:"訂單跨廠分配",desc:"訂單依產能與成本智慧分派各廠"},
  {icon:"swap_horiz",name:"跨廠庫存調撥",desc:"缺料與呆滯料的廠際調撥管理"},
  {icon:"leaderboard",name:"各廠績效比較",desc:"交期、良率、稼動的跨廠對標"},
  {icon:"sync_alt",name:"系統整合同步",desc:"與 ERP／APS／WMS 資料同步"}
];

var PLANTS=[
  {code:"TN",name:"台南廠",loc:"台灣·台南",util:92,orders:38,queue:6,st:"忙碌",color:"#dc2626"},
  {code:"TC",name:"台中廠",loc:"台灣·台中",util:74,orders:29,queue:2,st:"正常",color:"#16a34a"},
  {code:"KS",name:"高雄廠",loc:"台灣·高雄",util:63,orders:21,queue:1,st:"有餘裕",color:"#2563eb"},
  {code:"SZ",name:"蘇州廠",loc:"中國·蘇州",util:88,orders:34,queue:4,st:"忙碌",color:"#d97706"},
  {code:"VN",name:"越南廠",loc:"越南·河內",util:57,orders:18,queue:0,st:"有餘裕",color:"#2563eb"},
  {code:"MX",name:"墨西哥廠",loc:"墨西哥·蒙特雷",util:81,orders:26,queue:3,st:"正常",color:"#16a34a"}
];
var PNAMES=["台南","台中","高雄","蘇州","越南","墨西哥"];

var charts=[];
function killCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function C(id){ return document.getElementById(id); }
function mk(id,cfg){ var el=C(id); if(!el) return; charts.push(new Chart(el,cfg)); }
function view(){ return C("view"); }
function head(i){
  var m=MODULES[i];
  return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+m.icon+'</span></div>'+
    '<div><h2>'+m.name+'</h2><p>'+m.desc+'</p></div>'+
    '<span class="tag">模組 0'+(i+1)+' / 06</span></div>';
}

/* ============ SCREEN 0 : 多廠協同總覽 ============ */
function s0(){
  var kpis=[
    {lab:"集團在製訂單",val:"166",unit:"張",dt:"+12 vs 上週",cls:"up"},
    {lab:"平均產能利用率",val:"75.8",unit:"%",dt:"+3.1%",cls:"up"},
    {lab:"跨廠調撥在途",val:"9",unit:"單",dt:"2 張逾期",cls:"down"},
    {lab:"產能均衡度",val:"0.82",unit:"",dt:"+0.05",cls:"up"}
  ];
  var icons=["receipt_long","speed","local_shipping","balance"];
  var h=head(0)+'<div class="grid g-kpi mb">';
  kpis.forEach(function(k,idx){
    h+='<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icons[idx]+'</span>'+k.lab+'</div>'+
       '<div class="val">'+k.val+'<small>'+k.unit+'</small></div>'+
       '<div class="dt '+k.cls+'"><span class="material-symbols-outlined">'+(k.cls==="up"?"trending_up":"trending_down")+'</span>'+k.dt+'</div></div>';
  });
  h+='</div>';

  h+='<div class="grid g-32 mb">';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">factory</span><h3>各廠即時狀態看板</h3><span class="sub">更新於 08:20</span></div><div class="plant-grid">';
  PLANTS.forEach(function(p){
    var bcls=p.util>=88?"r":(p.util>=75?"w":"g");
    h+='<div class="plant"><div class="top"><span class="dot" style="background:'+p.color+'"></span><span class="nm">'+p.name+'</span><span class="loc">'+p.loc+'</span></div>'+
       '<div class="mrow"><span>產能利用率</span><span>'+p.util+'%</span></div>'+
       '<div class="bar '+bcls+'"><i style="width:'+p.util+'%"></i></div>'+
       '<div class="mrow"><span>在製訂單</span><span>'+p.orders+' 張</span></div>'+
       '<div class="mrow"><span>候排佇列</span><span>'+p.queue+'</span></div>'+
       '<div style="margin-top:8px"><span class="chip '+(p.st==="忙碌"?"c-bad":(p.st==="正常"?"c-warn":"c-ok"))+'">'+p.st+'</span></div></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">donut_large</span><h3>集團訂單分佈</h3></div>'+
     '<div class="chartbox sm"><canvas id="c0donut"></canvas></div>'+
     '<div class="note"><span class="material-symbols-outlined">insights</span>台南廠與蘇州廠合計承接集團 43% 訂單，建議往高雄／越南廠分流以提升均衡度。</div></div>';
  h+='</div>';

  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">show_chart</span><h3>集團近 8 週產能利用率趨勢</h3><span class="sub">%</span></div>'+
     '<div class="chartbox"><canvas id="c0line"></canvas></div></div>';

  view().innerHTML=h;
  void view().offsetHeight;

  mk("c0donut",{type:"doughnut",data:{labels:PLANTS.map(function(p){return p.name;}),datasets:[{data:PLANTS.map(function(p){return p.orders;}),backgroundColor:["#db2777","#f472b6","#9d174d","#fbcfe8","#be185d","#f9a8d4"],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
  mk("c0line",{type:"line",data:{labels:["W1","W2","W3","W4","W5","W6","W7","W8"],datasets:[
    {label:"集團平均",data:[68,70,69,72,74,73,76,76],borderColor:PINK,backgroundColor:"rgba(219,39,119,.12)",fill:true,tension:.35,borderWidth:3,pointRadius:3},
    {label:"目標線",data:[72,72,72,72,72,72,72,72],borderColor:MUT,borderDash:[6,4],fill:false,pointRadius:0,borderWidth:2}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},
    scales:{y:{min:50,max:100,grid:{color:GRID}},x:{grid:{display:false}}}}});
}

/* ============ SCREEN 1 : 跨廠產能可視化 ============ */
function s1(){
  var rows=[
    {p:"台南廠",cap:1200,used:1104,util:92,gap:"+4"},
    {p:"台中廠",cap:980,used:725,util:74,gap:"-14"},
    {p:"高雄廠",cap:860,used:542,util:63,gap:"-25"},
    {p:"蘇州廠",cap:1350,used:1188,util:88,gap:"0"},
    {p:"越南廠",cap:760,used:433,util:57,gap:"-31"},
    {p:"墨西哥廠",cap:900,used:729,util:81,gap:"-7"}
  ];
  var h=head(1);
  h+='<div class="grid g-3 mb">'+
     '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">bolt</span>集團總產能</div><div class="val">6,050<small>MH/日</small></div><div class="dt flat"><span class="material-symbols-outlined">bar_chart</span>6 廠合計</div></div>'+
     '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">insights</span>平均利用率</div><div class="val">75.8<small>%</small></div><div class="dt up"><span class="material-symbols-outlined">trending_up</span>目標 88%</div></div>'+
     '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">warning</span>過載廠數</div><div class="val">1<small>座</small></div><div class="dt down"><span class="material-symbols-outlined">trending_up</span>台南廠 92%</div></div>'+
     '</div>';
  h+='<div class="grid g-2 mb">';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">stacked_bar_chart</span><h3>各廠產能負載對比</h3><span class="sub">MH/日</span></div>'+
     '<div class="chartbox"><canvas id="c1bar"></canvas></div></div>';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">radar</span><h3>產能能力雷達（多維）</h3></div>'+
     '<div class="chartbox"><canvas id="c1radar"></canvas></div></div>';
  h+='</div>';

/* ============ nav / router ============ */
var RENDER=[s0,s1,s2,s3,s4,s5];

function buildTabs(){
  var t=C("tabs"), h="";
  MODULES.forEach(function(m,i){
    h+='<button class="tab" data-i="'+i+'"><span class="idx">0'+(i+1)+'</span><span class="material-symbols-outlined">'+m.icon+'</span><span class="tlabel">'+m.name+'</span></button>';
  });
  t.innerHTML=h;
  Array.prototype.forEach.call(t.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); });
  });
}

function show(i){
  var n=RENDER.length;
  i=Math.max(0,Math.min(i,n-1));
  killCharts();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs [data-i]"),function(b){
    b.classList.toggle("active",+b.getAttribute("data-i")===i);
  });
  var container=view();
  RENDER[i]();
  void container.offsetHeight;
}

buildTabs();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
