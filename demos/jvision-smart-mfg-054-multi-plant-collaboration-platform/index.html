<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多廠協同管理平台（Multi-Plant Collaboration Platform）｜Jvision 系統 Demo</title>
<meta name="description" content="跨廠產能可視化、訂單跨廠分配建議、跨廠庫存調撥與各廠績效比較的集團協同平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  background:var(--color-background);
  color:var(--ink);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.skip-link{
  position:fixed;
  top:8px;
  left:8px;
  z-index:100;
  padding:8px 12px;
  background:#fff;
  color:var(--ink);
  border:2px solid var(--color-primary);
  transform:translateY(-160%);
}
.skip-link:focus{transform:none}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:#115E59;
  border-bottom:4px solid var(--color-secondary);
}
.topbar-inner{
  width:min(1440px,100%);
  margin:auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid #5EEAD4;
  border-radius:8px;
  background:#CCFBF1;
  color:#134E4A;
}
.brand-txt{min-width:0}
.brand h1{
  margin:0;
  font-size:16px;
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand p{margin:1px 0 0;color:#CCFBF1;font-size:10px;letter-spacing:.04em}
.spacer{flex:1}
.env{display:flex;gap:7px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:30px;
  padding:4px 10px;
  border:1px solid #5EEAD4;
  border-radius:7px;
  background:#134E4A;
  color:#fff;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:16px}
.tabs{
  position:sticky;
  top:64px;
  z-index:40;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.tabs-inner{
  width:min(1440px,100%);
  margin:auto;
  display:flex;
  gap:4px;
  padding:7px 20px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tab{
  min-height:40px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:7px 11px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.tab:hover{background:#CCFBF1;color:#115E59;border-color:var(--line)}
.tab.active{background:var(--color-primary);color:#001F1D;border-color:#0F766E}
.tab .idx{
  font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;
  opacity:.75;
}
.tab .material-symbols-outlined{font-size:18px}
main{width:min(1440px,100%);margin:auto;padding:20px 20px 56px}
.screen-head{
  position:relative;
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:2px solid var(--line);
}
.screen-head .ic{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:8px;
  background:var(--color-primary);
  color:#001F1D;
}
.screen-head h2{margin:0;font-size:20px;line-height:1.25;font-weight:700}
.screen-head p{max-width:680px;margin:3px 0 0;color:var(--muted);font-size:12px}
.screen-head .tag{
  margin-left:auto;
  padding:5px 9px;
  flex:none;
  border:1px solid var(--line);
  border-radius:6px;
  background:#CCFBF1;
  color:#115E59;
  font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;
}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g-23{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.mb{margin-bottom:12px}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid var(--line);
  border-radius:10px;
}
.card{padding:14px}
.card-h{
  min-height:30px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:11px;
  padding-bottom:9px;
  border-bottom:1px solid var(--color-muted);
}
.card-h .material-symbols-outlined{color:#0F766E}
.card-h h3{margin:0;font-size:13px;font-weight:700}
.card-h .sub{margin-left:auto;color:var(--muted);font-size:10px;font-weight:600}
.kpi{
  position:relative;
  padding:13px 14px 13px 17px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--color-primary);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{font-size:17px;color:#0F766E}
.kpi .val{
  margin-top:5px;
  font-size:25px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{
  margin-left:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:0;
}
.kpi .dt{
  display:flex;
  align-items:center;
  gap:3px;
  margin-top:5px;
  font-size:10px;
  font-weight:700;
}
.kpi .dt .material-symbols-outlined{font-size:14px}
.dt.up{color:#166534}
.dt.down{color:#B91C1C}
.dt.flat{color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:9px 10px;
  text-align:left;
  border-bottom:1px solid var(--color-muted);
  white-space:nowrap;
}
th{
  color:#334155;
  background:#E6FFFB;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:#F0FDFA}
td.num{
  text-align:right;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
}
.chip::before{
  content:"";
  width:6px;
  height:6px;
  border:1px solid currentColor;
  border-radius:50%;
  background:currentColor;
}
.c-ok{background:#F0FDF4;color:#166534}
.c-warn{background:#FFFBEB;color:#92400E}
.c-bad{background:#FEF2F2;color:#991B1B}
.c-info{background:#EFF6FF;color:#1E40AF}
.c-pink{background:#CCFBF1;color:#115E59}
.c-mut{background:#F1F5F9;color:#475569}
.bar{
  height:8px;
  min-width:70px;
  overflow:hidden;
  border:1px solid #CBD5E1;
  border-radius:3px;
  background:#E8F1F4;
}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.bar.g>i{background:#15803D}
.bar.w>i{background:#D97706}
.bar.r>i{background:#DC2626}
.chartbox{position:relative;width:100%;height:275px}
.chartbox.sm{height:225px}
.plant-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.plant{
  min-width:0;
  padding:11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}
.plant .top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.plant .dot{width:9px;height:9px;flex:none;border:2px solid #fff;outline:1px solid currentColor}
.plant .nm{font-weight:700}
.plant .loc{margin-left:auto;color:var(--muted);font-size:10px}
.plant .mrow{display:flex;justify-content:space-between;margin:5px 0;font-size:11px}
.plant .mrow span:last-child{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-weight:700;
}
.alloc,.tf,.sync-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}
.alloc{flex-wrap:wrap}
.alloc .ord{min-width:150px;flex:1 1 150px}
.alloc .id{
  font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;
}
.alloc .meta{margin-top:2px;color:var(--muted);font-size:10px}
.alloc .arrow{color:#0F766E}
.plants-pick{display:flex;gap:7px;flex:2 1 260px;flex-wrap:wrap}
.pk{
  min-width:0;
  padding:5px 9px;
  border:1px solid var(--line);
  border-radius:6px;
  font-size:11px;
}
.pk.best{border:2px solid var(--color-primary);background:#CCFBF1}
.pk .pn{font-weight:700}
.pk .sc{color:var(--muted);font-size:10px}
.pk.best .sc{color:#115E59;font-weight:700}
.best-mark{margin-right:4px;color:#0F766E}
.tf{flex-wrap:wrap}
.tf .node{
  padding:5px 9px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#F8FAFC;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.tf .flowline{
  position:relative;
  height:2px;
  min-width:42px;
  flex:1 1 55px;
  border-top:2px dashed var(--color-primary);
}
.tf .flowline .material-symbols-outlined{
  position:absolute;
  right:-5px;
  top:-11px;
  color:#0F766E;
  font-size:18px;
}
.tf .item{min-width:0;color:var(--muted);font-size:11px}
.tf .qty{
  color:#115E59;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-weight:700;
}
.tl{position:relative;padding-left:22px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:7px;
  width:2px;
  background:var(--line);
}
.tl .ev{position:relative;padding:0 0 15px 7px}
.tl .ev::before{
  content:"";
  position:absolute;
  top:3px;
  left:-20px;
  width:10px;
  height:10px;
  border:3px solid var(--color-primary);
  background:#fff;
}
.tl .ev.ok::before{border-color:#15803D}
.tl .ev.warn::before{border-color:#D97706}
.tl .t{
  color:var(--muted);
  font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;
}
.tl .m{margin-top:1px;font-size:12px;font-weight:700}
.tl .d{margin-top:1px;color:var(--muted);font-size:11px}
.sync-row{flex-wrap:wrap}
.sysic{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid var(--line);
  border-radius:7px;
  background:#CCFBF1;
  color:#0F766E;
}
.sync-row .info{min-width:0;flex:1 1 160px}
.sync-row .info .n{font-size:12px;font-weight:700}
.sync-row .info .s{color:var(--muted);font-size:10px}
.note{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:10px;
  padding:8px 10px;
  border:1px dashed var(--color-primary);
  border-radius:7px;
  background:#F0FDFA;
  color:#334155;
  font-size:11px;
}
.note .material-symbols-outlined{flex:none;color:#0F766E;font-size:16px}
.foot{
  width:min(1440px,100%);
  margin:auto;
  padding:12px 20px 28px;
  color:var(--muted);
  text-align:center;
  font-size:10px;
}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.rank{
  display:inline-grid;
  width:25px;
  height:25px;
  place-items:center;
  border:1px solid var(--line);
  border-radius:5px;
  background:#F8FAFC;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-weight:700;
}
.rank.top{background:#CCFBF1;border-color:var(--color-primary);color:#115E59}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-32,.g-23{grid-template-columns:1fr}
  .plant-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .topbar-inner,main{padding-left:14px;padding-right:14px}
  .tabs-inner{padding-left:14px;padding-right:14px}
  .tabs{top:64px}
  .g-2,.g-3{grid-template-columns:1fr}
  .screen-head{align-items:center}
  .screen-head .tag{align-self:flex-start}
}
@media(max-width:480px){
  body{font-size:12px}
  .topbar{position:relative}
  .tabs{top:0}
  .brand{width:100%}
  .spacer{display:none}
  .env{width:100%}
  .pill{flex:1;justify-content:center}
  .tab{min-width:43px;justify-content:center;padding:7px 9px}
  .tab .tlabel{display:none}
  main{padding-top:14px}
  .screen-head{align-items:flex-start}
  .screen-head .ic{width:38px;height:38px}
  .screen-head h2{font-size:17px}
  .screen-head .tag{margin-left:0}
  .g-kpi{grid-template-columns:1fr}
  .plant-grid{grid-template-columns:1fr}
  .chartbox{height:245px}
  .tf .item{width:100%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<a class="skip-link" href="#view">跳至主要內容</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">hub</span></div>
      <div class="brand-txt">
        <h1>多廠協同管理平台</h1>
        <p>Multi-Plant Collaboration Platform</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="env">
      <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">factory</span>6 廠區</span>
      <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">sync</span>ERP／APS／WMS 已同步</span>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="平台模組">
  <div class="tabs-inner" id="tabs"></div>
</nav>
<main id="main">
  <div id="view" tabindex="-1"></div>
</main>
<footer class="foot">Jvision 系統 Demo · 純前端展示 · 內容為模擬數據</footer>

<script>
"use strict";

var PRIMARY="#0D9488";
var SECONDARY="#14B8A6";
var DARK="#115E59";
var PALE="#99F6E4";
var GRID="#D8E7E8";
var MUT="#64748B";

var MODULES=[
  {icon:"hub",name:"多廠協同總覽",desc:"集團各廠產能、負載與狀態即時彙整"},
  {icon:"speed",name:"跨廠產能可視化",desc:"各廠產能利用率與均衡度分析"},
  {icon:"alt_route",name:"訂單跨廠分配",desc:"訂單依產能與成本智慧分派各廠"},
  {icon:"swap_horiz",name:"跨廠庫存調撥",desc:"缺料與呆滯料的廠際調撥管理"},
  {icon:"leaderboard",name:"各廠績效比較",desc:"交期、良率、稼動的跨廠對標"},
  {icon:"sync_alt",name:"系統整合同步",desc:"與 ERP／APS／WMS 資料同步"}
];

var PLANTS=[
  {code:"TN",name:"台南廠",loc:"台灣·台南",util:92,orders:38,queue:6,st:"忙碌",color:"#DC2626"},
  {code:"TC",name:"台中廠",loc:"台灣·台中",util:74,orders:29,queue:2,st:"正常",color:"#15803D"},
  {code:"KS",name:"高雄廠",loc:"台灣·高雄",util:63,orders:21,queue:1,st:"有餘裕",color:"#1D4ED8"},
  {code:"SZ",name:"蘇州廠",loc:"中國·蘇州",util:88,orders:34,queue:4,st:"忙碌",color:"#B45309"},
  {code:"VN",name:"越南廠",loc:"越南·河內",util:57,orders:18,queue:0,st:"有餘裕",color:"#1D4ED8"},
  {code:"MX",name:"墨西哥廠",loc:"墨西哥·蒙特雷",util:81,orders:26,queue:3,st:"正常",color:"#15803D"}
];

var PNAMES=["台南","台中","高雄","蘇州","越南","墨西哥"];
var charts=[];

Chart.defaults.font.family='"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif';
Chart.defaults.color="#475569";
Chart.defaults.borderColor=GRID;

function C(id){return document.getElementById(id)}
function view(){return C("view")}
function killCharts(){
  charts.forEach(function(chart){
    try{chart.destroy()}catch(error){}
  });
  charts=[];
}
function mk(id,config){
  var element=C(id);
  if(element) charts.push(new Chart(element,config));
}
function icon(name){
  return '<span class="material-symbols-outlined" aria-hidden="true">'+name+'</span>';
}
function chip(text,cls){
  return '<span class="chip '+cls+'">'+text+'</span>';
}
function head(i){
  var module=MODULES[i];
  return '<section class="screen-head">'+
    '<div class="ic">'+icon(module.icon)+'</div>'+
    '<div><h2>'+module.name+'</h2><p>'+module.desc+'</p></div>'+
    '<span class="tag">模組 0'+(i+1)+' / 06</span>'+
  '</section>';
}
function kpi(label,value,unit,detail,state,iconName){
  return '<article class="kpi">'+
    '<div class="lab">'+icon(iconName)+label+'</div>'+
    '<div class="val">'+value+'<small>'+unit+'</small></div>'+
    '<div class="dt '+state+'">'+
      icon(state==="up"?"trending_up":state==="down"?"warning":"bar_chart")+detail+
    '</div>'+
  '</article>';
}
function statusClass(status){
  return status==="忙碌"?"c-bad":status==="正常"?"c-warn":"c-ok";
}
function barClass(value){
  return value>=88?"r":value>=75?"w":"g";

var RENDER=[s0,s1,s2,s3,s4,s5];

function buildTabs(){
  var container=C("tabs");
  var h="";
  MODULES.forEach(function(module,i){
    h+='<button class="tab" type="button" data-i="'+i+'" aria-controls="view">'+
      '<span class="idx">0'+(i+1)+'</span>'+
      icon(module.icon)+
      '<span class="tlabel">'+module.name+'</span></button>';
  });
  container.innerHTML=h;
  Array.prototype.forEach.call(container.querySelectorAll("[data-i]"),function(button){
    button.addEventListener("click",function(){
      var index=+button.getAttribute("data-i");
      var nextHash="#v"+index;
      if(location.hash===nextHash){
        show(index,true);
      }else{
        location.hash=nextHash;
      }
    });
  });
}

function show(index,focusView){
  index=Math.max(0,Math.min(index,RENDER.length-1));
  killCharts();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs [data-i]"),function(button){
    var active=+button.getAttribute("data-i")===index;
    button.classList.toggle("active",active);
    button.setAttribute("aria-current",active?"page":"false");
  });
  RENDER[index]();
  if(focusView){
    try{view().focus({preventScroll:true})}catch(error){view().focus()}
  }
}

function fromHash(){
  var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var index=match?Math.min(+match[1],RENDER.length-1):0;
  show(index,false);
  try{window.scrollTo(0,0)}catch(error){}
}

buildTabs();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
