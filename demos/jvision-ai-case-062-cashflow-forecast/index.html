<html lang="zh-Hant">
<head>

<style>
:root{
 --color-primary:#F59E0B;--color-on-primary:#0F172A;--color-secondary:#FBBF24;
 --color-on-secondary:#0F172A;--color-accent:#8B5CF6;--color-on-accent:#000;
 --color-background:#0F172A;--color-foreground:#F8FAFC;--color-card:#222735;
 --color-card-foreground:#F8FAFC;--color-muted:#272F42;--color-muted-foreground:#AAB7CA;
 --color-border:#334155;--color-destructive:#EF4444;--color-on-destructive:#000;
 --color-ring:#F59E0B;--blue:#8B5CF6;--ink:#F8FAFC;--muted:#AAB7CA;--line:#334155;
 --ok:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#60A5FA;--radius:8px
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"IBM Plex Sans","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
svg{display:block}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;min-height:68px;padding:10px 24px;background:rgba(15,23,42,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.logo{display:grid;place-items:center;width:40px;height:40px;border:1px solid #D78A08;border-radius:7px;background:var(--color-primary);color:var(--color-on-primary);box-shadow:4px 4px 0 #6D28D9}
.logo svg{width:23px;height:23px}
.brand b{display:block;font-size:15px;letter-spacing:.04em}
.brand small{display:block;color:var(--color-primary);font-size:10px;font-weight:600;letter-spacing:.18em}
.monitor{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #7C5B16;border-radius:5px;background:#2D291F;color:#FCD67A;font-size:12px;font-weight:600;white-space:nowrap}
.monitor i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;padding:3px}
.nav button{display:flex;align-items:center;gap:7px;min-height:40px;padding:8px 11px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{border-color:var(--line);background:var(--color-muted);color:var(--ink);transform:translateY(-1px)}
.nav button.on{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--color-destructive);color:#0F172A;text-align:center;font-size:10px;font-weight:700}
.nav button.on .badge{background:#0F172A;color:#fff}
.wrap{width:min(1400px,100%);margin:auto;padding:24px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.eyebrow{margin:0 0 5px;color:var(--color-primary);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
h1{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.16;letter-spacing:-.025em}
.subtitle{margin:6px 0 0;color:var(--muted);font-size:13px}
.context{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:5px;background:var(--color-card);font-size:12px;font-weight:600;white-space:nowrap}
.context svg{color:var(--color-primary)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:minmax(0,1.55fr) minmax(300px,.9fr)}.g21{grid-template-columns:minmax(330px,.9fr) minmax(0,1.3fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card,.kpi{border:1px solid var(--line);border-radius:var(--radius);background:var(--color-card);box-shadow:0 9px 24px rgba(0,0,0,.16)}
.card{padding:16px}.card+.card-spacer{margin-top:14px}
.kpi{position:relative;min-height:130px;padding:15px;overflow:hidden;transition:border-color .22s,transform .22s,box-shadow .22s}
.kpi:hover,.card:hover{border-color:#526179}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.24)}
.kpi:before{position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-primary);content:""}
.kpi .label{color:var(--muted);font-size:12px;font-weight:600}
.kpi .value{margin:12px 0 5px;font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .value small{color:var(--muted);font-size:13px}
.delta{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;letter-spacing:.01em}
.card h2 svg{color:var(--color-primary)}
.grow{margin-left:auto;color:var(--color-primary);font-size:11px;font-weight:600}
.accounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.account,.option,.alert,.schedule{border:1px solid var(--line);border-radius:6px;background:#1B2030}
.account{padding:13px}
.account.attention{border-color:#80601C}
.account-name{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600}
.balance{margin:8px 0 2px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:10px}
.meter{height:5px;margin-top:10px;background:#343C50}.meter i{display:block;height:100%;background:var(--color-primary)}
.chart{min-height:200px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{padding:10px;border:1px solid var(--line);background:var(--color-muted);text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:10px}
.scroll{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#191E2C;color:#CBD5E1;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tbody tr{transition:background .18s}tbody tr:hover{background:#2A3143}tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code,time,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid currentColor;border-radius:3px;font-size:10px;font-weight:700}
.tag:before{width:5px;height:5px;border-radius:50%;background:currentColor;content:""}
.t-ok{color:#6EE7B7;background:#17372F}.t-warn{color:#FCD67A;background:#3B3019}.t-bad{color:#FDA4AF;background:#441F29}.t-info{color:#93C5FD;background:#192E4A}.t-mut{color:#CBD5E1;background:#2B3345}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px;border-left:3px solid var(--muted)}
.alert.r{border-left-color:var(--bad)}.alert.a{border-left-color:var(--warn)}.alert.g{border-left-color:var(--ok)}
.alert .signal{display:grid;place-items:center;width:30px;height:30px;border:1px solid currentColor;border-radius:4px}
.alert b{display:block;font-size:12px}.alert small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.alert .amount{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:12px}.bar{display:grid;grid-template-columns:150px 1fr 65px;gap:10px;align-items:center;font-size:11px}.track{height:8px;background:#161B28}.track i{display:block;height:100%}.bar strong{text-align:right}
.options{display:grid;gap:8px}.option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px}.option b{font-size:12px}.option small{display:block;color:var(--muted);font-size:10px}
.chips{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}.chip{padding:3px 8px;border:1px solid #8B6414;border-radius:3px;background:#372D18;color:#FCD67A;font-size:10px;font-weight:600}.chip.off{border-color:var(--line);background:transparent;color:var(--muted)}
.scenarios{display:grid;gap:8px}.scenario{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:5px}.scenario.selected{border-color:var(--color-primary);background:#302A1F}.radio{width:16px;height:16px;border:2px solid var(--muted);border-radius:50%}.selected .radio{border:4px solid var(--color-primary)}.scenario b{display:block;font-size:12px}.scenario small{color:var(--muted);font-size:10px}.scenario .result{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border:1px solid var(--color-primary);border-radius:5px;background:var(--color-primary);color:var(--color-on-primary);font-weight:700;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:4px 4px 0 #6D28D9}.btn.secondary{border-color:#7C5AC7;background:var(--color-accent);color:#080B12}.btn.ghost{border-color:var(--line);background:transparent;color:var(--ink)}
.schedule{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding:9px;font-size:11px}.schedule .right{margin-left:auto;color:var(--muted)}
.note{margin:12px 0 0;color:var(--muted);font-size:11px}
.report{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(0,1.15fr);gap:14px}
.preview{padding:14px;border:1px dashed #566279;background:#191E2C}.preview-head{display:flex;justify-content:space-between;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--line)}.preview-head small{display:block;color:var(--muted)}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%}
.screen{animation:enter .4s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.accounts{grid-template-columns:repeat(2,1fr)}.g2,.g21,.report{grid-template-columns:1fr}.monitor{display:none}}
@media(max-width:720px){.top{align-items:flex-start;padding:10px 14px;flex-wrap:wrap}.nav{order:3;width:100%;margin:0}.wrap{padding:16px}.view-head{align-items:flex-start;flex-direction:column}.accounts{grid-template-columns:1fr}.bar{grid-template-columns:105px 1fr 56px}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}.context{white-space:normal}.brand small{display:none}.card{padding:13px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.kpi:hover,.nav button:hover,.btn:hover{transform:none}}
</style>
</head>
<body>

<script>

function screen1(){
 return kpis([["13 週最低餘額","91.8 <small>M</small>","! W36 低於安全水位","warn"],["安全水位缺口","-8.2 <small>M</small>","! W36 需補資金","bad"],["13 週淨現金流","+18.3 <small>M</small>","↑ 期末回升","ok"],["滾動預測視窗","13 <small>週</small>","每週一自動更新"]])+
