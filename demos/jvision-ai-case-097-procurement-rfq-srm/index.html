<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>採購詢價協作所｜Jvision 系統 Demo</title>
  <meta name="description" content="供應商協同、詢比議價到交期風險控管的 SRM 採購協作平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#e11d48; --accent2:#fb7185;
      --ink:#1a1024; --muted:#6b6577; --line:#ece7f0; --bg:#f6f4f8; --card:#ffffff;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
      --side:#2a0f1e; --side2:#3d1226;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
    .shell{display:flex;min-height:100vh;align-items:stretch}
    /* sidebar */
    .side{width:242px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#e7cfd9;display:flex;flex-direction:column;padding:18px 14px;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto}
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:8px}
    .brand .logo{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(225,29,72,.45)}
    .brand b{color:#fff;font-size:15px;font-weight:800;display:block;line-height:1.2}
    .brand span{font-size:11px;color:#c99bad;letter-spacing:.04em}
    .navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#d3a9bd;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.16s;min-width:0}
    .navbtn .material-symbols-outlined{font-size:21px;flex:none}
    .navbtn .txt{min-width:0}
    .navbtn small{display:block;font-size:11px;font-weight:500;color:#a97e91;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .navbtn:hover{background:rgba(251,113,133,.14);color:#fff}
    .navbtn.on{background:linear-gradient(135deg,rgba(225,29,72,.92),rgba(251,113,133,.5));color:#fff;box-shadow:0 6px 16px rgba(225,29,72,.35)}
    .sidefoot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#a97e91;line-height:1.7}
    .sidefoot b{color:#e7bccd}
    /* main */
    .main{flex:1;min-width:0;padding:20px clamp(13px,2.2vw,28px) 40px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
    .top .h{min-width:0}
    .top h1{margin:0;font-size:clamp(18px,2.3vw,24px);font-weight:900;letter-spacing:-.02em}
    .top p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--accent)}
    .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
    /* grids */
    .grid{display:grid;gap:14px}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:2fr 1fr}
    .g-2e{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:repeat(3,1fr)}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g-2,.g-2e,.g-3{grid-template-columns:1fr}
    }
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0;box-shadow:0 1px 2px rgba(26,16,36,.03)}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800}
    .card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
    .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .cardhead h3{margin:0}
    /* kpi */
    .kpi{position:relative;overflow:hidden}
    .kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent)}
    .kpi .val{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:8px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:4px}
    .up{color:var(--ok)} .down{color:var(--bad)}
    .bar{height:7px;border-radius:5px;background:#f1ecf3;overflow:hidden;margin-top:10px}
    .bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    /* chart */
    .chartwrap{position:relative;width:100%;height:290px;min-width:0}
    .chartwrap.sm{height:230px}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11.5px;letter-spacing:.03em;color:var(--muted);font-weight:700;background:#faf7fb}
    tbody tr:hover{background:#faf7fb}
    td b{font-weight:800}
    .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
    .t-ok{background:#dcfce7;color:#15803d} .t-warn{background:#fef3c7;color:#b45309} .t-bad{background:#fee2e2;color:#b91c1c} .t-info{background:#dbeafe;color:#1d4ed8} .t-mut{background:#f1eef4;color:#6b5f76} .t-acc{background:#ffe4ea;color:#be123c}
    .mono{font-variant-numeric:tabular-nums}
    .tprog{width:110px;height:6px;border-radius:4px;background:#f1ecf3;display:inline-block;overflow:hidden;vertical-align:middle}
    .tprog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    /* ===== SPLIT two-pane workspace (signature) ===== */
    .split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
    @media(max-width:960px){.split{grid-template-columns:1fr}}
    .listpane{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;box-shadow:0 1px 2px rgba(26,16,36,.03)}
    .listpane .lh{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
    .listpane .lh b{font-size:13.5px;font-weight:800}
    .listpane .lh span{font-size:11.5px;color:var(--muted);font-weight:700}
    .lrow{border:1px solid transparent;border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;background:#faf7fb;min-width:0}
    .lrow.on{border-color:var(--accent);background:#fff;box-shadow:0 4px 14px rgba(225,29,72,.12)}
    .lrow .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .lrow .code{font-size:11.5px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
    .lrow .nm{font-size:13.5px;font-weight:800;margin:4px 0 3px;line-height:1.35}
    .lrow .mt{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
    .detpane{min-width:0;display:flex;flex-direction:column;gap:14px}
    .drow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .dkv{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#faf7fb}
    .dkv .l{font-size:11.5px;color:var(--muted);font-weight:600}
    .dkv .v{font-size:19px;font-weight:900;margin-top:3px}
    /* board / kanban */
    .kb{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
    @media(max-width:960px){.kb{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:640px){.kb{grid-template-columns:1fr}}
    .kbcol{background:#faf7fb;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
    .kbcol .kh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:9px;padding:0 2px}
    .kbcol .kh span.cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
    .ticket{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(26,16,36,.04)}
    .ticket .tt{font-size:12.5px;font-weight:800;line-height:1.35}
    .ticket .meta{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;color:var(--muted);flex-wrap:wrap}
    .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
    /* chat */
    .chat{display:flex;flex-direction:column;gap:12px}
    .msg{display:flex;gap:10px;max-width:88%}
    .msg .b{border-radius:14px;padding:10px 13px;font-size:12.5px;line-height:1.5;box-shadow:0 1px 2px rgba(26,16,36,.05)}
    .msg .who{font-size:11px;font-weight:800;margin-bottom:3px}
    .msg .tm{font-size:10.5px;color:var(--muted);margin-top:4px}
    .msg.buy{align-self:flex-end;flex-direction:row-reverse}
    .msg.buy .b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .msg.buy .who,.msg.buy .tm{color:#ffe4ea;text-align:right}
    .msg.sup .b{background:#fff;border:1px solid var(--line)}
    .msg.sup .who{color:var(--info)}
    .msg .av{width:30px;height:30px;font-size:12px}
    .msg.sup .av{background:linear-gradient(135deg,#2563eb,#60a5fa)}
    /* approval steps */
    .steps{display:flex;flex-direction:column;gap:0;position:relative;padding-left:26px}
    .steps:before{content:"";position:absolute;left:10px;top:6px;bottom:16px;width:2px;background:var(--line)}
    .stp{position:relative;padding:0 0 16px}
    .stp .dot{position:absolute;left:-22px;top:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
    .stp .st{font-size:13.5px;font-weight:800}
    .stp .sd{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
    .stp .sm{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
    /* scorecard */
    .scard{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,#fdfafb);min-width:0}
    .scard .sn{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .scard .snm{font-weight:800;font-size:14px}
    .scard .grade{font-size:22px;font-weight:900;line-height:1;padding:6px 12px;border-radius:12px}
    .scard .metrics{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    .scard .mrow{display:flex;align-items:center;gap:8px;font-size:11.5px}
    .scard .mrow .ml{width:52px;flex:none;color:var(--muted);font-weight:700}
    .scard .mrow .mb{flex:1;height:7px;border-radius:5px;background:#f1ecf3;overflow:hidden;min-width:0}
    .scard .mrow .mb>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .scard .mrow .mv{width:30px;flex:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
    .rowflex{display:flex;gap:12px;flex-wrap:wrap}
    .stat{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff}
    .stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
    .stat .v{font-size:20px;font-weight:900;margin-top:4px}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f1eef4;color:#6b5f76}
    .best{outline:2px solid var(--accent);outline-offset:-2px;background:#fff5f7}
    /* mobile nav */
    .mobbrand{display:none}
    @media(max-width:860px){
      .shell{flex-direction:column}
      .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:11px 12px;gap:8px}
      .brand{display:none}
      .mobbrand{display:flex;align-items:center;gap:9px;width:100%;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:2px}
      .mobbrand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
      .mobbrand b{color:#fff;font-size:14px;font-weight:800}
      .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
      .navbtn small{display:none}
      .sidefoot{display:none}
    }
    @media(max-width:560px){
      .navbtn .txt{display:none}
      .navbtn{padding:9px 11px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="mobbrand">
        <div class="logo"><span class="material-symbols-outlined">diversity_3</span></div>
        <b>採購詢價協作所</b>
      </div>
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">diversity_3</span></div>
        <div><b>採購詢價協作所</b><span>Procurement RFQ · SRM</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidefoot">
        <b>本期 128 張詢價單</b> · 46 家供應商<br/>
        資料為展示用途 · <b>Jvision</b> Demo
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div class="h">
          <h1 id="scr-title">請購需求池</h1>
          <p id="scr-sub">彙整各廠請購、合併料件並排定詢價優先序</p>
        </div>
        <span class="pill"><span class="dot"></span>即時同步 · 2026/08/13 14:20</span>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script>
  var MODS=[
    {icon:"assignment",name:"請購需求池",sub:"合併料件與詢價優先序"},
    {icon:"mail",name:"詢價單發送",sub:"RFQ 發送與回覆追蹤"},
    {icon:"table_view",name:"報價比對",sub:"多家並排比價分析"},
    {icon:"forum",name:"線上議價",sub:"議價往返與讓步歷程"},
    {icon:"verified",name:"核決簽核",sub:"分層簽核與下單"},
    {icon:"grade",name:"供應商評鑑",sub:"綜合評分與分級"}
  ];

  var nav=document.getElementById("nav");
  MODS.forEach(function(m,i){
    var b=document.createElement("button");
    b.className="navbtn"; b.setAttribute("data-i",i);
    b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt"><span>'+m.name+'</span><small>'+m.sub+'</small></span>';
    b.addEventListener("click",function(){show(i)});
    nav.appendChild(b);
  });

  var view=document.getElementById("view");
  var chart=null;
  function killCharts(){ if(chart){try{chart.destroy()}catch(e){}} chart=null; }
  Chart.defaults.font.family='"Inter","Noto Sans TC",sans-serif';
  Chart.defaults.font.size=11.5;
  Chart.defaults.color='#6b6577';

  // ================= SCREEN 0 : 請購需求池 (SPLIT signature) =================
  function v0(){
    var reqs=[
      {code:"PR-2408-091",nm:"CNC 加工中心 主軸軸承 7014C",qty:"120 pcs",plant:"台中三廠",need:"08/22",prio:"急件",pc:"t-bad",ref:"NT$ 4,850/pcs",cat:"機械件",spec:"角接觸球軸承 · P4 級精度 · NSK/SKF 認可品牌",supN:5,merged:2},
      {code:"PR-2408-092",nm:"注塑機 液壓比例閥 DG4V-3S",qty:"18 pcs",plant:"桃園二廠",need:"08/28",prio:"一般",pc:"t-mut",ref:"NT$ 12,300/pcs",cat:"液壓件",spec:"先導式比例方向閥 · 24VDC · Vickers 相容規格",supN:4,merged:0},
      {code:"PR-2408-093",nm:"電控櫃 塑殼斷路器 3P 100A",qty:"64 pcs",plant:"台中三廠",need:"09/02",prio:"一般",pc:"t-mut",ref:"NT$ 2,180/pcs",cat:"電控件",spec:"過載短路保護 · IEC 60947 認證 · 附輔助接點",supN:6,merged:1},
      {code:"PR-2408-094",nm:"輸送帶 PU 平皮帶 3.0mm",qty:"340 m",plant:"高雄一廠",need:"08/25",prio:"急件",pc:"t-bad",ref:"NT$ 620/m",cat:"耗材",spec:"食品級 PU 材質 · 抗油耐磨 · 表面壓花防滑",supN:3,merged:0},
      {code:"PR-2408-095",nm:"伺服馬達 750W 附煞車",qty:"22 pcs",plant:"桃園二廠",need:"09/10",prio:"一般",pc:"t-mut",ref:"NT$ 18,600/pcs",cat:"電控件",spec:"AC 伺服 · 內建 23-bit 編碼器 · IP67 防護",supN:4,merged:0}
    ];
    var sel=(window.__v0sel==null?0:window.__v0sel);
    if(sel>=reqs.length)sel=0;
    var kpis=[
      {ic:"assignment",lab:"待處理請購",val:"37",un:"張",d:"+6 今日新增",up:true},
      {ic:"merge",lab:"可合併料件",val:"12",un:"組",d:"預估省 NT$ 2.4M",up:true},
      {ic:"priority_high",lab:"急件需求",val:"8",un:"張",d:"3 張今日到期",up:false},
      {ic:"schedule",lab:"平均詢價前置",val:"1.4",un:"天",d:"▼ 較上季 -0.6",up:true}
    ];
    var h='<div class="grid g-kpi">';
    kpis.forEach(function(k){
      h+='<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div>'+
         '<div class="val">'+k.val+' <small>'+k.un+'</small></div>'+
         '<div class="delta '+(k.up?'up':'down')+'">'+k.d+'</div></div>';
    });
    h+='</div>';

    h+='<div class="split" style="margin-top:14px">';
    h+='<div class="listpane"><div class="lh"><b>請購需求佇列</b><span>依急迫度排序</span></div>';
    reqs.forEach(function(r,i){
      h+='<div class="lrow'+(i===sel?' on':'')+'" onclick="__pick(0,'+i+')"><div class="r1"><span class="code">'+r.code+'</span><span class="tag '+r.pc+'">'+r.prio+'</span></div>'+
         '<div class="nm">'+r.nm+'</div>'+
         '<div class="mt"><span class="chip">'+r.cat+'</span><span><span class="material-symbols-outlined" style="font-size:13px">factory</span> '+r.plant+'</span><span><span class="material-symbols-outlined" style="font-size:13px">event</span> '+r.need+'</span></div></div>';
    });
    h+='</div>';
    var d=reqs[sel];
    h+='<div class="detpane">';
    h+='<div class="card"><div class="cardhead"><h3>'+d.nm+'</h3><span class="tag '+d.pc+'">'+d.prio+'</span></div>'+
       '<div class="sub" style="margin-bottom:10px">'+d.code+' · '+d.spec+'</div>'+
       '<div class="drow"><div class="dkv"><div class="l">需求數量</div><div class="v">'+d.qty+'</div></div>'+
       '<div class="dkv"><div class="l">需求交期</div><div class="v">'+d.need+'</div></div>'+

  var SCREENS=[v0,v1,v2,v3,v4,v5];

  window.__pick=function(scr,i){
    window["__v"+scr+"sel"]=i;
    show(scr);
  };

  function show(i){
    i=Math.max(0,Math.min(i,SCREENS.length-1));
    killCharts();
    document.querySelectorAll("[data-i]").forEach(function(b){
      b.classList.toggle("on",+b.getAttribute("data-i")===i);
    });
    document.getElementById("scr-title").textContent=MODS[i].name;
    document.getElementById("scr-sub").textContent=MODS[i].sub;
    SCREENS[i]();
  }

  show(0);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
