<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>採購詢價協作所｜Jvision 系統 Demo</title>
  <meta name="description" content="供應商協同、詢比議價到交期風險控管的 SRM 採購協作平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#E2E8F0;
      --ok:#15803D;
      --warn:#9A3412;
      --bad:#DC2626;
      --info:#1D4ED8;
      --grid:rgba(37,99,235,.075);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    body{
      margin:0;
      min-width:320px;
      overflow-x:hidden;
      background-color:var(--color-background);
      background-image:
        linear-gradient(var(--grid) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:24px 24px;
      color:var(--ink);
      font-family:"Fira Sans",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,a,[onclick]{cursor:pointer}
    button,input,select,textarea{font:inherit}
    :focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .icon{
      width:20px;
      height:20px;
      display:inline-block;
      flex:none;
      stroke:currentColor;
      stroke-width:2;
      fill:none;
      stroke-linecap:square;
      stroke-linejoin:miter;
    }
    .shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
    .side{
      position:sticky;
      top:0;
      z-index:20;
      height:100vh;
      overflow:auto;
      padding:18px 14px;
      color:#fff;
      background:#172033;
      border-right:4px solid var(--ink);
      display:flex;
      flex-direction:column;
    }
    .brand,.mobbrand{
      display:flex;
      align-items:center;
      gap:11px;
      padding:4px 4px 18px;
      border-bottom:2px solid #fff;
      margin-bottom:16px;
    }
    .mobbrand{display:none}
    .logo{
      width:43px;
      height:43px;
      display:grid;
      place-items:center;
      flex:none;
      color:#fff;
      background:var(--color-primary);
      border:2px solid #fff;
      box-shadow:5px 5px 0 var(--color-accent);
    }
    .brand b,.mobbrand b{
      display:block;
      font-size:16px;
      font-weight:700;
      line-height:1.2;
      letter-spacing:.02em;
    }
    .brand small{
      display:block;
      margin-top:4px;
      color:#CBD5E1;
      font-family:"Fira Code",monospace;
      font-size:10px;
    }
    nav{display:grid;gap:8px}
    .navbtn{
      position:relative;
      width:100%;
      min-height:52px;
      padding:9px 10px;
      border:2px solid #94A3B8;
      border-radius:0;
      color:#E2E8F0;
      background:transparent;
      display:flex;
      align-items:center;
      gap:10px;
      text-align:left;
      font-weight:700;
      transition:background-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease;
    }
    .navbtn:hover{
      color:#fff;
      background:#25324A;
      transform:translate(-2px,-2px);
      box-shadow:4px 4px 0 #94A3B8;
    }
    .navbtn.on{
      color:#000;
      background:var(--color-accent);
      border-color:#000;
      transform:translate(-3px,-3px);
      box-shadow:6px 6px 0 var(--color-primary);
    }
    .navbtn small{
      display:block;
      margin-top:2px;
      color:inherit;
      opacity:.78;
      font-size:10px;
      font-weight:500;
    }
    .sidefoot{
      margin-top:auto;
      padding:16px 5px 2px;
      border-top:2px solid #94A3B8;
      color:#CBD5E1;
      font-size:11px;
      line-height:1.7;
    }
    .sidefoot b{color:#fff}
    .main{min-width:0;padding:24px clamp(14px,2.4vw,36px) 48px}
    .top{
      position:sticky;
      top:0;
      z-index:15;
      margin:-24px calc(clamp(14px,2.4vw,36px) * -1) 20px;
      padding:20px clamp(14px,2.4vw,36px);
      border-bottom:3px solid var(--ink);
      background:rgba(248,250,252,.96);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .top h1{
      margin:0;
      font-size:clamp(24px,3.2vw,42px);
      line-height:1;
      font-weight:700;
      letter-spacing:-.05em;
    }
    .top p{margin:8px 0 0;color:var(--muted);font-size:13px}
    .sync{
      flex:none;
      min-height:42px;
      padding:9px 12px;
      border:2px solid var(--ink);
      background:#fff;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-weight:600;
      box-shadow:4px 4px 0 var(--color-primary);
    }
    .sync svg{color:var(--ok)}
    .grid{display:grid;gap:14px}
    .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card,.stat,.listpane,.ticket,.scard,.dkv{
      min-width:0;
      border:2px solid var(--ink);
      border-radius:0;
      background:var(--color-card);
    }
    .card{padding:16px;box-shadow:6px 6px 0 var(--line)}
    .card:nth-child(2n){box-shadow:6px 6px 0 #BFDBFE}
    .cardhead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      padding-bottom:10px;
      margin-bottom:12px;
      border-bottom:2px solid var(--ink);
    }
    .card h3,.cardhead h3{margin:0;font-size:15px;font-weight:700}
    .sub{color:var(--muted);font-size:12px;line-height:1.55}
    .kpi{
      position:relative;
      padding-top:42px;
      overflow:hidden;
    }
    .kpi:before{
      content:attr(data-index);
      position:absolute;
      top:0;
      left:0;
      width:34px;
      height:30px;
      display:grid;
      place-items:center;
      color:#fff;
      background:var(--ink);
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-weight:700;
    }
    .kpi .lab{
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      text-transform:uppercase;
    }
    .kpi .val{
      margin-top:8px;
      font-family:"Fira Code",monospace;
      font-size:clamp(23px,2.5vw,32px);
      font-weight:700;
      line-height:1;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{font:600 12px "Fira Sans";color:var(--muted)}
    .delta{margin-top:9px;font-size:11px;font-weight:700}
    .up{color:var(--ok)}
    .down{color:var(--bad)}
    .status-mark{
      display:inline-grid;
      place-items:center;
      width:15px;
      height:15px;
      margin-right:4px;
      border:1px solid currentColor;
      font-family:"Fira Code",monospace;
      font-size:9px;
      font-weight:700;
    }
    .rowflex{display:flex;gap:12px;flex-wrap:wrap}
    .stat{
      flex:1 1 145px;
      padding:12px 13px;
      box-shadow:4px 4px 0 var(--line);
    }
    .stat .l{color:var(--muted);font-size:11px;font-weight:600}
    .stat .v{
      margin-top:5px;
      font-family:"Fira Code",monospace;
      font-size:18px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }
    .split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
    .listpane{padding:12px;box-shadow:6px 6px 0 var(--color-primary)}
    .lh{
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding:2px 3px 10px;
      margin-bottom:9px;
      border-bottom:2px solid var(--ink);
    }
    .lh b{font-size:13px}
    .lh span{color:var(--muted);font-size:10px}
    .lrow{
      width:100%;
      margin-bottom:9px;
      padding:11px;
      border:2px solid var(--line);
      background:var(--color-background);
      transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    .lrow:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--line)}
    .lrow.on{
      border-color:var(--ink);
      background:#EFF6FF;
      transform:translate(-3px,-3px);
      box-shadow:5px 5px 0 var(--color-primary);
    }
    .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .code,.mono{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }
    .code{color:var(--color-primary);font-size:11px;font-weight:700}
    .nm{margin:6px 0;font-size:13px;font-weight:700;line-height:1.35}
    .mt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:10px}
    .detpane{min-width:0;display:grid;gap:14px}
    .drow{display:flex;gap:10px;flex-wrap:wrap}
    .dkv{flex:1 1 120px;padding:10px;background:var(--color-muted)}
    .dkv .l{color:var(--muted);font-size:10px}
    .dkv .v{
      margin-top:4px;
      font-family:"Fira Code",monospace;
      font-size:17px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }
    .tag,.chip{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      padding:3px 7px;
      border:1px solid currentColor;
      border-radius:0;
      font-size:10px;
      font-weight:700;
      line-height:1;
    }
    .tag:before{content:"";width:6px;height:6px;background:currentColor}
    .t-ok{color:#166534;background:#DCFCE7}
    .t-warn{color:#9A3412;background:#FFEDD5}
    .t-bad{color:#991B1B;background:#FEE2E2}
    .t-info{color:#1E40AF;background:#DBEAFE}
    .t-mut{color:#475569;background:#F1F5F9}
    .t-acc{color:#9A3412;background:#FFEDD5}
    .chip{color:#334155;background:#fff;border-color:#94A3B8}
    .action{
      min-height:42px;
      padding:8px 12px;
      border:2px solid var(--ink);
      color:#fff;
      background:var(--color-primary);
      font-weight:700;
      box-shadow:4px 4px 0 var(--ink);
      transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease;
    }
    .action:hover{background:#1D4ED8;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
    .action.secondary{color:var(--ink);background:#fff;box-shadow:4px 4px 0 var(--line)}
    .tablewrap{overflow-x:auto;border:2px solid var(--ink)}
    table{width:100%;min-width:600px;border-collapse:collapse;font-size:12px}
    th,td{padding:10px 11px;border-right:1px solid #CBD5E1;border-bottom:1px solid #CBD5E1;white-space:nowrap;text-align:left}
    th{
      color:#fff;
      background:var(--ink);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
      letter-spacing:.02em;
    }
    td:nth-child(n+2){font-variant-numeric:tabular-nums}
    tbody tr:nth-child(even){background:#F1F5F9}
    tbody tr:hover{background:#DBEAFE}
    td.num,th.num{text-align:right}
    .best{
      outline:3px solid var(--color-accent);
      outline-offset:-3px;
      color:#7C2D12;
      background:#FFEDD5;
      font-weight:700;
    }
    .chartwrap{position:relative;width:100%;height:290px}
    .chartwrap.sm{height:235px}
    .tprog{display:block;width:100%;height:9px;border:1px solid var(--ink);background:#fff}
    .tprog i{display:block;height:100%;background:var(--color-primary)}
    .chat{display:flex;flex-direction:column;gap:14px}
    .msg{display:flex;gap:9px;max-width:88%}
    .msg.buy{align-self:flex-end;flex-direction:row-reverse}
    .avatar{
      width:30px;
      height:30px;
      display:grid;
      place-items:center;
      flex:none;
      border:2px solid var(--ink);
      background:#DBEAFE;
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
    }
    .msg .bubble{padding:10px 12px;border:2px solid var(--ink);background:#fff;font-size:12px;line-height:1.55;box-shadow:4px 4px 0 var(--line)}
    .msg.buy .bubble{color:#fff;background:var(--color-primary);box-shadow:4px 4px 0 var(--ink)}
    .who{margin-bottom:4px;font-size:10px;font-weight:700}
    .tm{margin-top:5px;color:var(--muted);font:9px "Fira Code",monospace}
    .msg.buy .tm{text-align:right}
    .kb{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;min-width:790px}
    .kbcol{padding:8px;border:2px dashed #94A3B8;background:#F8FAFC}
    .kh{display:flex;justify-content:space-between;gap:5px;margin-bottom:9px}
    .cnt{
      min-width:24px;
      height:24px;
      display:grid;
      place-items:center;
      border:1px solid var(--ink);
      background:#fff;
      font:700 10px "Fira Code",monospace;
    }
    .ticket{padding:9px;margin-bottom:8px;box-shadow:3px 3px 0 var(--line)}
    .ticket .tt{font-size:11px;font-weight:700;line-height:1.45}
    .ticket .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:9px}
    .steps{position:relative;padding-left:29px}
    .steps:before{content:"";position:absolute;left:10px;top:8px;bottom:16px;width:3px;background:var(--ink)}
    .stp{position:relative;padding:0 0 18px}
    .stp-dot{
      position:absolute;
      left:-29px;
      top:0;
      width:23px;
      height:23px;
      display:grid;
      place-items:center;
      border:2px solid var(--ink);
      color:#fff;
      background:var(--color-primary);
      font:700 10px "Fira Code",monospace;
    }
    .stp .st{font-size:13px;font-weight:700}
    .stp .sd{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.5}
    .stp .sm{margin-top:4px;font:600 9px "Fira Code",monospace;color:var(--muted)}
    .scard{padding:13px;box-shadow:4px 4px 0 var(--line)}
    .sn{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .snm{font-size:14px;font-weight:700}
    .grade{
      min-width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:2px solid currentColor;
      font:700 22px "Fira Code",monospace;
    }
    .metrics{display:grid;gap:8px;margin-top:13px}
    .mrow{display:grid;grid-template-columns:40px 1fr 28px;align-items:center;gap:7px;font-size:10px}
    .ml{color:var(--muted);font-weight:600}
    .mb{height:8px;border:1px solid var(--ink);background:#fff}
    .mb i{display:block;height:100%;background:var(--color-primary)}
    .mv{text-align:right;font:700 10px "Fira Code",monospace}
    .rule{
      margin-top:10px;
      padding:11px;
      border:2px dashed var(--ink);
      background:var(--color-muted);
      color:var(--muted);
      font-size:11px;
      line-height:1.55;
    }
    .screen{animation:enter .4s cubic-bezier(.22,1.35,.55,1) both}
    .grid-item{animation:stagger .4s cubic-bezier(.22,1.35,.55,1) both}
    .grid-item:nth-child(2){animation-delay:.06s}
    .grid-item:nth-child(3){animation-delay:.12s}
    .grid-item:nth-child(4){animation-delay:.18s}
    .grid-item:nth-child(5){animation-delay:.24s}
    @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes stagger{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
    @media(max-width:1024px){
      .shell{grid-template-columns:220px minmax(0,1fr)}
      .split{grid-template-columns:300px minmax(0,1fr)}
      .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:860px){
      .shell{display:block}
      .side{position:static;width:100%;height:auto;padding:10px;border-right:0;border-bottom:4px solid var(--ink)}
      .brand,.sidefoot{display:none}
      .mobbrand{display:flex;padding:2px 2px 10px;margin-bottom:10px}
      .mobbrand .logo{width:34px;height:34px;box-shadow:3px 3px 0 var(--color-accent)}
      nav{display:flex;overflow-x:auto;padding:3px 3px 7px}
      .navbtn{width:auto;min-width:132px;flex:none}
      .main{padding-top:18px}
      .top{position:static;margin:-18px calc(clamp(14px,2.4vw,36px) * -1) 18px}
      .split,.g-2{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .main{padding-left:12px;padding-right:12px}
      .top{align-items:flex-start;flex-direction:column;margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
      .sync{width:100%;justify-content:center}
      .g-kpi,.g-2e{grid-template-columns:1fr}
      .card{padding:13px}
      .kpi{padding-top:40px}
      .lrow{min-height:44px}
      .msg{max-width:96%}
      .chartwrap{height:245px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
      }
      .screen,.grid-item{animation:none!important;opacity:1!important;transform:none!important}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="mobbrand">
        <div class="logo" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M7 4v6m10-6v6M5 12h5v7H5zm9 0h5v7h-5z"/></svg>
        </div>
        <b>採購詢價協作所</b>
      </div>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M7 4v6m10-6v6M5 12h5v7H5zm9 0h5v7h-5z"/></svg>
        </div>
        <div>
          <b>採購詢價協作所</b>
          <small>PROCUREMENT / RFQ / SRM</small>
        </div>
      </div>
      <nav id="nav" aria-label="主要功能"></nav>
      <div class="sidefoot">
        <b>本期 128 張詢價單</b> · 46 家供應商<br />
        資料為展示用途 · <b>Jvision</b> Demo
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 id="scr-title">請購需求池</h1>
          <p id="scr-sub">彙整各廠請購、合併料件並排定詢價優先序</p>
        </div>
        <div class="sync">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
          <span>即時同步 · 2026/08/13 14:20</span>
        </div>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const ICONS={
      assignment:'<path d="M7 4h10v3H7zM5 6h14v14H5zM8 11h8M8 15h6"/>',
      mail:'<path d="M3 5h18v14H3zM3 7l9 7 9-7"/>',
      table:'<path d="M3 5h18v14H3zM3 10h18M9 5v14M15 5v14"/>',
      forum:'<path d="M4 4h16v11H9l-5 4zM8 8h8M8 11h5"/>',
      verified:'<path d="m12 3 8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8 12l3 3 5-6"/>',
      grade:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>'
    };

    const SCREENS=[v0,v1,v2,v3,v4,v5];

    function pick(screen,index){
      window["__v"+screen+"sel"]=index;
      show(screen);
    }

    function show(index){
      const i=Math.max(0,Math.min(Number(index)||0,SCREENS.length-1));
      killChart();
      document.querySelectorAll("[data-i]").forEach(b=>{
        const on=Number(b.dataset.i)===i;
        b.classList.toggle("on",on);
        b.setAttribute("aria-current",on?"page":"false");
      });
      document.getElementById("scr-title").textContent=MODS[i].name;
      document.getElementById("scr-sub").textContent=MODS[i].sub;
      SCREENS[i]();
    }

    function fromHash(){
      const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      show(m?Math.min(Number(m[1]),5):0);
      try{window.scrollTo(0,0)}catch(e){}
    }

    window.addEventListener("hashchange",fromHash);
    fromHash();
  </script>
