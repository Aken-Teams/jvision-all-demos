<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>董事會治理管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.msi{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:1.25rem;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:74px;
  padding:10px clamp(16px,3vw,40px);
  background:rgba(255,255,255,.97);
  border-bottom:2px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:max-content;
}
.logo{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  flex:0 0 auto;
  border:2px solid var(--ink);
  border-radius:8px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
}
.logo .msi{font-size:25px}
.tt b{
  display:block;
  color:var(--ink);
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.04em;
  white-space:nowrap;
}
.tt span{
  display:block;
  color:var(--muted);
  font-family:"Crimson Pro",serif;
  font-size:12px;
  letter-spacing:.08em;
}
.nav{
  display:flex;
  flex:1;
  justify-content:flex-end;
  gap:5px;
  min-width:0;
}
.nav button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:42px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button:hover{
  border-color:var(--line);
  background:var(--color-background);
  color:var(--ink);
}
.nav button.on{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:#001A17;
}
main{
  width:min(100%,1440px);
  margin:auto;
  padding:clamp(20px,3vw,40px);
}
.screen-head{
  position:relative;
  margin-bottom:22px;
  padding:4px 0 18px 18px;
  border-bottom:1px solid var(--line);
}
.screen-head::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:18px;
  left:0;
  width:5px;
  background:var(--color-accent);
}
.screen-head h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--ink);
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(23px,3vw,31px);
  font-weight:600;
  line-height:1.25;
  letter-spacing:.02em;
}
.screen-head h2 .msi{
  color:var(--color-primary);
  font-size:30px;
}
.screen-head p{
  max-width:800px;
  margin:7px 0 0;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
}
.grid{
  display:grid;
  gap:16px;
  min-width:0;
}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-31{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.card,.kpi{
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card{
  min-width:0;
  padding:18px;
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 15px;
  color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;
  font-weight:700;
}
.card h3 .msi{color:var(--color-primary)}
.kpi{
  position:relative;
  min-height:132px;
  padding:17px;
  overflow:hidden;
  transition:background-color .18s ease,border-color .18s ease,transform .18s ease;
}
.kpi::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:42px;
  height:5px;
  background:var(--color-secondary);
}
.kpi:hover{
  border-color:var(--color-primary);
  background:#F8FFFE;
  transform:translateY(-2px);
}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
}
.kpi .lbl .msi{color:var(--color-primary)}
.kpi .val{
  margin-top:12px;
  color:var(--ink);
  font-family:"Cinzel","Crimson Pro","Noto Sans TC",serif;
  font-size:34px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.kpi .val small{
  margin-left:5px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
}
.kpi .dt{
  margin-top:10px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:600;
}
.muted{color:var(--muted);font-size:12px}
.up,.down{
  display:flex;
  align-items:center;
  gap:4px;
}
.up{color:#166534}
.down{color:#B91C1C}
.up::before,.down::before{
  font-family:"Material Symbols Outlined";
  font-size:15px;
  line-height:1;
}
.up::before{content:"check_circle"}
.down::before{content:"error"}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.tw{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:8px;
}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
}
th,td{
  padding:12px;
  border-bottom:1px solid #B8E5DF;
  text-align:left;
  white-space:nowrap;
}
th{
  background:var(--color-muted);
  color:#334155;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
tr:last-child td{border-bottom:0}
td:nth-last-child(-n+4).mono{text-align:right}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:10px;
  font-weight:700;
  line-height:1.3;
}
.pill::before{
  content:"";
  width:6px;
  height:6px;
  border:1px solid currentColor;
  border-radius:50%;
  background:currentColor;
}
.pill .msi{font-size:13px}
.p-ok{background:#ECFDF5;color:#166534}
.p-warn{background:#FFFBEB;color:#92400E}
.p-run{background:#EFF6FF;color:#1E40AF}
.p-risk{background:#FEF2F2;color:#B91C1C}
.p-mut{background:#F1F5F9;color:#475569}
.board{
  display:grid;
  grid-template-columns:repeat(5,minmax(190px,1fr));
  gap:12px;
  min-width:1000px;
}
.col{
  min-width:0;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#F6FFFD;
}
.col .top{height:4px;margin-bottom:10px;border-radius:2px}
.col .ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
  padding:0 2px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.cnt{
  min-width:24px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:999px;
  background:white;
  color:var(--muted);
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.kc{
  margin-bottom:9px;
  padding:11px;
  border:1px solid #99DDD3;
  border-radius:7px;
  background:white;
  transition:border-color .18s ease,background-color .18s ease;
}
.kc:hover{border-color:var(--color-primary);background:#F8FFFE}
.kc:last-child{margin-bottom:0}
.kc .t{
  margin-bottom:7px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
  line-height:1.5;
}
.kc .m{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:4px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:10px;
}
.kc .m .msi{font-size:14px}
.tag{
  display:inline-block;
  margin-top:8px;
  padding:3px 7px;
  border-left:3px solid var(--color-accent);
  background:#FFF7ED;
  color:#7C2D12;
  font-family:"Noto Sans TC",sans-serif;
  font-size:9px;
  font-weight:700;
}
.tl{position:relative;padding-left:28px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:8px;
  width:2px;
  background:var(--line);
}
.tl .it{position:relative;padding:0 0 20px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";
  position:absolute;
  top:4px;
  left:-25px;
  width:11px;
  height:11px;
  border:3px solid var(--color-primary);
  border-radius:50%;
  background:white;
}
.tl .tm{
  color:var(--color-primary);
  font-size:11px;
  font-weight:700;
}
.tl .tx{
  margin-top:2px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:700;
}
.tl .ds{
  margin-top:3px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
}
.bar{
  height:8px;
  overflow:hidden;
  border:1px solid #99DDD3;
  border-radius:2px;
  background:#E6F4F2;
}
.bar>i{
  display:block;
  height:100%;
  background:var(--color-primary);
}
.lr{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:12px 3px;
  border-bottom:1px solid #B8E5DF;
}
.lr:last-child{border-bottom:0}
.lr .ic{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  flex:0 0 auto;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--color-background);
  color:var(--color-primary);
}
.lr .bd{min-width:0;flex:1}
.lr .bd b{
  display:block;
  color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.lr .bd span{
  display:block;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
}
.avatar{
  display:inline-grid;
  place-items:center;
  width:27px;
  height:27px;
  margin-right:4px;
  border:1px solid var(--color-primary);
  border-radius:50%;
  background:var(--color-muted);
  color:var(--ink);
  font-weight:700;
}
.hint{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:12px 14px;
  border:1px solid var(--color-accent);
  border-left-width:5px;
  border-radius:6px;
  background:#FFFBEB;
  color:#78350F;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
}
.hint .msi{flex:0 0 auto;color:#92400E}
.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.grid-item,.kpi,.card,.col{
  animation:enter .4s cubic-bezier(.2,.8,.2,1) both;
}
.grid-item:nth-child(2),.grid>*:nth-child(2),.board>*:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3),.grid>*:nth-child(3),.board>*:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4),.grid>*:nth-child(4),.board>*:nth-child(4){animation-delay:.18s}
.grid-item:nth-child(5),.grid>*:nth-child(5),.board>*:nth-child(5){animation-delay:.24s}
@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .topbar{align-items:flex-start;flex-direction:column;gap:8px}
  .nav{
    width:100%;
    justify-content:flex-start;
    overflow-x:auto;
    padding-bottom:3px;
  }
}
@media(max-width:820px){
  .g2,.g3,.g4,.g-31{grid-template-columns:1fr}
  main{padding:20px 16px 32px}
}
@media(max-width:560px){
  .topbar{padding:9px 12px}
  .logo{width:40px;height:40px}
  .tt b{font-size:13px}
  .nav button{min-width:44px;padding:8px 10px}
  .nav button .lb{display:none}
  .screen-head{padding-left:14px}
  .screen-head h2{font-size:22px}
  .card{padding:14px}
  .lr{align-items:flex-start;flex-wrap:wrap}
  .lr .bd{min-width:calc(100% - 54px)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .kpi:hover{transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="msi">gavel</span></div>
    <div class="tt"><b>董事會治理管理系統</b><span>Board Governance Platform</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main>
  <div id="app" aria-live="polite"></div>
</main>
<script>
"use strict";
var charts=[];
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return null;
  void el.offsetHeight;
  var ch=echarts.init(el,null,{renderer:"canvas"});
  ch.setOption(opt);
  return ch;
}
function pushChart(ch){if(ch)charts.push(ch)}
function disposeAll(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].dispose()}catch(e){}
  }
  charts=[];
}
var MODS=[
  {icon:"calendar_month",name:"會議與議程"},
  {icon:"description",name:"電子 Book"},
  {icon:"fact_check",name:"簽核出席"},
  {icon:"gavel",name:"決議記錄"},
  {icon:"task_alt",name:"執行追蹤"},
  {icon:"shield",name:"治理稽核"}
];
function s0(c){
  var kpis=[
    {l:"本季會議",v:"14",u:"場",dt:"董事會 4 · 委員會 10",ic:"event"},
    {l:"待審議案",v:"27",u:"案",dt:"其中 6 案需迴避",ic:"pending_actions"},
    {l:"議程完成率",v:"82",u:"%",dt:"距下次會期 9 天",ic:"donut_large"},
    {l:"平均審定天數",v:"3.4",u:"天",dt:"較上季 -1.2 天",ic:"schedule"}
  ];
  var cols=[
    {t:"議案徵集",top:"#64748B",items:[
      {t:"2024 年度財務報表核閱案",m:"財務部 · 8/26",tag:"審計委員會"},
      {t:"庫藏股買回計畫提案",m:"財務部 · 8/27",tag:"董事會"}
    ]},
    {t:"議程草擬",top:"#0F766E",items:[
      {t:"獨立董事改選提名案",m:"董事會辦公室 · 8/24",tag:"提名委員會"},
      {t:"ESG 永續報告書核備",m:"永續辦公室 · 8/25",tag:"董事會"}
    ]},
    {t:"審定中",top:"#D97706",items:[
      {t:"經理人薪酬調整案",m:"人資 · 待董事長",tag:"薪酬委員會"},
      {t:"重大投資額度授權",m:"策略部 · 待迴避確認",tag:"董事會"}
    ]},
    {t:"已排入議程",top:"#0D9488",items:[
      {t:"第 9 屆第 4 次董事會議程",m:"9/03 09:30 · 已定案",tag:"董事會"},
      {t:"審計委員會第 12 次會議",m:"9/03 08:30 · 已定案",tag:"審計委員會"}
    ]},
    {t:"已發送通知",top:"#166534",items:[
      {t:"股東常會前置議程",m:"已發送 11 位董事",tag:"董事會"}
    ]}
  ];
  var kpih="",boardh="";
  kpis.forEach(function(k){
    kpih+='<div class="kpi"><div class="lbl"><span class="msi" aria-hidden="true">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="dt muted">'+k.dt+'</div></div>';
  });
  cols.forEach(function(col){
    var cards="";
    col.items.forEach(function(it){
      cards+='<div class="kc"><div class="t">'+it.t+'</div><div class="m"><span class="msi" aria-hidden="true">person</span>'+it.m+'</div><span class="tag">'+it.tag+'</span></div>';
    });
    boardh+='<div class="col"><div class="top" style="background:'+col.top+'"></div><div class="ch">'+col.t+'<span class="cnt" aria-label="'+col.items.length+' 項">'+col.items.length+'</span></div>'+cards+'</div>';
  });
  c.innerHTML=
    '<div class="screen-head"><h2><span class="msi" aria-hidden="true">calendar_month</span>會議與議程管理</h2><p>董事會與各功能性委員會的會期排程、議案徵集到議程審定的完整看板。</p></div>'+
    '<div class="grid g4" style="margin-bottom:16px">'+kpih+'</div>'+
    '<section class="card"><h3><span class="msi" aria-hidden="true">view_kanban</span>議程作業看板　<span class="muted" style="font-weight:400">第 9 屆第 4 次會期</span></h3><div style="overflow-x:auto"><div class="board">'+boardh+'</div></div></section>'+
    '<div class="hint" style="margin-top:14px"><span class="msi" aria-hidden="true">rule</span>RULE-01：涉及現金流且金額超過 50 萬元之議案優先排入議程，並標記需利害關係迴避之董事。</div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  disposeAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  var app=document.getElementById("app");
  app.innerHTML="";
  void app.offsetHeight;
  (SCREENS[i]||s0)(app);
}
(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'"><span class="msi" aria-hidden="true">'+MODS[i].icon+'</span><span class="lb">'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var bs=nav.querySelectorAll("[data-i]");
  for(var j=0;j<bs.length;j++){
    bs[j].addEventListener("click",function(){
      var k=+this.getAttribute("data-i");
      location.hash="v"+k;
      if(location.hash==="#v"+k)show(k);
    });
  }
})();
window.addEventListener("resize",function(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].resize()}catch(e){}
  }
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
