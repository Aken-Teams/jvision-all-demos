<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>董事會治理管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#e11d48;--accent2:#fb7185;--ink:#1f2937;--sub:#6b7280;
  --bg:#f5f5f7;--card:#ffffff;--line:#e9e6ea;--soft:#fdf2f4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand .logo .msi{font-size:22px;}
.brand .tt{min-width:0;}
.brand .tt b{display:block;font-size:15px;font-weight:700;white-space:nowrap;}
.brand .tt span{display:block;font-size:11px;color:var(--sub);}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  color:var(--sub);font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;
  min-width:0;transition:.15s;
}
.nav button .msi{font-size:19px;}
.nav button:hover{border-color:var(--accent2);color:var(--accent);}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(225,29,72,.28);}
main{padding:20px;max-width:1240px;margin:0 auto;}
.screen-head{margin-bottom:16px;}
.screen-head h2{margin:0;font-size:21px;font-weight:700;display:flex;align-items:center;gap:9px;}
.screen-head h2 .msi{color:var(--accent);font-size:26px;}
.screen-head p{margin:4px 0 0;color:var(--sub);font-size:13px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .msi{color:var(--accent);font-size:19px;}
.muted{color:var(--sub);font-size:12px;}
.grid{display:grid;gap:14px;min-width:0;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:repeat(4,1fr);}
.g-31{grid-template-columns:2fr 1fr;}
.grid>*{min-width:0;}
@media(max-width:820px){
  .g2,.g3,.g4,.g-31{grid-template-columns:1fr;}
}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0;}
.kpi .lbl{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.kpi .lbl .msi{font-size:17px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;line-height:1;}
.kpi .val small{font-size:13px;color:var(--sub);font-weight:600;margin-left:3px;}
.kpi .dt{font-size:11px;margin-top:6px;font-weight:600;}
.up{color:#16a34a;}.down{color:#dc2626;}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:230px;}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--soft);color:var(--sub);font-weight:600;font-size:12px;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.pill .msi{font-size:14px;}
.p-ok{background:#dcfce7;color:#15803d;}
.p-warn{background:#fef3c7;color:#b45309;}
.p-run{background:#e0e7ff;color:#4338ca;}
.p-risk{background:#fee2e2;color:#b91c1c;}
.p-mut{background:#f1f0f2;color:#6b7280;}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;min-width:0;}
@media(max-width:980px){.board{grid-template-columns:1fr;}}
.col{background:#faf7f8;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:9px;padding:0 2px;}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--sub);}
.col .top{height:3px;border-radius:3px;margin-bottom:9px;}
.kc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.kc:last-child{margin-bottom:0;}
.kc .t{font-size:13px;font-weight:700;margin-bottom:5px;line-height:1.35;}
.kc .m{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.kc .m .msi{font-size:14px;}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--accent);margin-top:6px;}
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px;}
.tl .it:last-child{padding-bottom:0;}
.tl .it::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl .it .tm{font-size:11px;color:var(--sub);font-weight:600;}
.tl .it .tx{font-size:13px;font-weight:600;margin-top:2px;}
.tl .it .ds{font-size:12px;color:var(--sub);margin-top:2px;}
.bar{height:8px;border-radius:8px;background:#f1e5e8;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.lr{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0;}
.lr:last-child{border-bottom:none;}
.lr .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.lr .ic .msi{font-size:20px;}
.lr .bd{min-width:0;flex:1;}
.lr .bd b{font-size:13px;display:block;}
.lr .bd span{font-size:11.5px;color:var(--sub);}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.hint{background:var(--soft);border:1px dashed var(--accent2);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#9f1239;display:flex;gap:8px;align-items:flex-start;}
.hint .msi{color:var(--accent);font-size:18px;flex:0 0 auto;}
.mono{font-variant-numeric:tabular-nums;}
@media(max-width:560px){
  .nav button span.lb{display:none;}
  .nav button{padding:8px 10px;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="msi">gavel</span></div>
    <div class="tt"><b>董事會治理管理系統</b><span>Board Governance Platform</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>
<main>
  <div id="app"></div>
</main>
<script>
"use strict";
var chart=null;
function disposeChart(){ if(chart){ try{chart.dispose();}catch(e){} chart=null; } }
function mkChart(id,opt){
  var el=document.getElementById(id); if(!el) return null;
  void el.offsetHeight;
  var ch=echarts.init(el); ch.setOption(opt); return ch;
}

var MODS=[
  {icon:"calendar_month",name:"會議與議程"},
  {icon:"description",name:"電子 Book"},
  {icon:"fact_check",name:"簽核出席"},
  {icon:"gavel",name:"決議記錄"},
  {icon:"task_alt",name:"執行追蹤"},
  {icon:"shield",name:"治理稽核"}
];
var charts=[];
function pushChart(ch){ if(ch){ charts.push(ch); } }
function disposeAll(){ for(var i=0;i<charts.length;i++){ try{charts[i].dispose();}catch(e){} } charts=[]; chart=null; }

/* ---------- Screen 0 : 會議與議程管理 (KANBAN signature) ---------- */
function s0(c){
  var kpis=[
    {l:"本季會議",v:"14",u:"場",dt:"董事會 4 · 委員會 10",ic:"event"},
    {l:"待審議案",v:"27",u:"案",dt:"其中 6 案需迴避",ic:"pending_actions"},
    {l:"議程完成率",v:"82",u:"%",dt:"距下次會期 9 天",ic:"donut_large"},
    {l:"平均審定天數",v:"3.4",u:"天",dt:"較上季 -1.2 天",ic:"schedule"}
  ];
  var cols=[
    {t:"議案徵集",top:"#94a3b8",items:[
      {t:"2024 年度財務報表核閱案",m:"財務部 · 8/26",tag:"審計委員會"},
      {t:"庫藏股買回計畫提案",m:"財務部 · 8/27",tag:"董事會"}
    ]},
    {t:"議程草擬",top:"#6366f1",items:[
      {t:"獨立董事改選提名案",m:"董事會辦公室 · 8/24",tag:"提名委員會"},
      {t:"ESG 永續報告書核備",m:"永續辦公室 · 8/25",tag:"董事會"}
    ]},
    {t:"審定中",top:"#f59e0b",items:[
      {t:"經理人薪酬調整案",m:"人資 · 待董事長",tag:"薪酬委員會"},
      {t:"重大投資額度授權",m:"策略部 · 待迴避確認",tag:"董事會"}
    ]},
    {t:"已排入議程",top:"#e11d48",items:[
      {t:"第 9 屆第 4 次董事會議程",m:"9/03 09:30 · 已定案",tag:"董事會"},
      {t:"審計委員會第 12 次會議",m:"9/03 08:30 · 已定案",tag:"審計委員會"}
    ]},
    {t:"已發送通知",top:"#10b981",items:[
      {t:"股東常會前置議程",m:"已發送 11 位董事",tag:"董事會"}
    ]}
  ];
  var kpih="";
  kpis.forEach(function(k){
    kpih+='<div class="kpi"><div class="lbl"><span class="msi">'+k.ic+'</span>'+k.l+'</div>'+
    '<div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="dt muted">'+k.dt+'</div></div>';
  });
  var boardh="";
  cols.forEach(function(col){
    var cards="";
    col.items.forEach(function(it){
      cards+='<div class="kc"><div class="t">'+it.t+'</div><div class="m"><span class="msi">person</span>'+it.m+'</div><span class="tag">'+it.tag+'</span></div>';
    });
    boardh+='<div class="col"><div class="top" style="background:'+col.top+'"></div>'+
      '<div class="ch">'+col.t+'<span class="cnt">'+col.items.length+'</span></div>'+cards+'</div>';
  });
  c.innerHTML=
  '<div class="screen-head"><h2><span class="msi">calendar_month</span>會議與議程管理</h2><p>董事會與各功能性委員會的會期排程、議案徵集到議程審定的完整看板。</p></div>'+
  '<div class="grid g4" style="margin-bottom:16px">'+kpih+'</div>'+
  '<div class="card"><h3><span class="msi">view_kanban</span>議程作業看板　<span class="muted" style="font-weight:400">第 9 屆第 4 次會期</span></h3>'+
  '<div style="overflow-x:auto"><div class="board">'+boardh+'</div></div></div>'+
  '<div class="hint" style="margin-top:14px"><span class="msi">rule</span>RULE-01：涉及現金流且金額超過 50 萬元之議案優先排入議程，並標記需利害關係迴避之董事。</div>';
}

/* ---------- Screen 1 : 電子 Board Book ---------- */
function s1(c){
  c.innerHTML=
  '<div class="screen-head"><h2><span class="msi">description</span>電子 Board Book 分發</h2><p>會議資料加密封裝、逐位董事發送與閱讀行為控管，取代紙本以確保保密性。</p></div>'+
  '<div class="grid g4" style="margin-bottom:16px">'+
    '<div class="kpi"><div class="lbl"><span class="msi">menu_book</span>已封裝手冊</div><div class="val">6<small>本</small></div><div class="dt muted">共 142 份附件</div></div>'+
    '<div class="kpi"><div class="lbl"><span class="msi">send</span>發送完成</div><div class="val">11<small>/ 11</small></div><div class="dt up">全體董事已送達</div></div>'+
    '<div class="kpi"><div class="lbl"><span class="msi">visibility</span>平均閱讀率</div><div class="val">74<small>%</small></div><div class="dt up">較上次 +12%</div></div>'+
    '<div class="kpi"><div class="lbl"><span class="msi">lock</span>安全事件</div><div class="val">0<small>件</small></div><div class="dt muted">近 30 天無外洩</div></div>'+
  '</div>'+
  '<div class="grid g-31">'+
    '<div class="card"><h3><span class="msi">groups</span>董事閱讀進度</h3>'+
      '<div class="tw"><table><thead><tr><th>董事</th><th>職務</th><th>發送時間</th><th>閱讀進度</th><th>狀態</th></tr></thead><tbody>'+
      readerRow("王","王志文","董事長","08-30 14:02",100,"ok","已閱畢")+
      readerRow("陳","陳品妍","獨立董事","08-30 15:20",100,"ok","已閱畢")+
      readerRow("林","林建宏","董事","08-30 16:41",68,"run","閱讀中")+
      readerRow("黃","黃淑芬","獨立董事","08-31 09:10",45,"run","閱讀中")+
      readerRow("張","張家豪","董事","—",0,"warn","尚未開啟")+
      '</tbody></table></div></div>'+
    '<div class="card"><h3><span class="msi">shield</span>權限與到期</h3>'+
      '<div class="lr"><div class="ic"><span class="msi">enhanced_encryption</span></div><div class="bd"><b>AES-256 加密封裝</b><span>浮水印標記閱讀者身分</span></div></div>'+
      '<div class="lr"><div class="ic"><span class="msi">block</span></div><div class="bd"><b>禁止下載/列印</b><span>螢幕截圖偵測已啟用</span></div></div>'+
      '<div class="lr"><div class="ic"><span class="msi">timer</span></div><div class="bd"><b>會後 7 日自動封存</b><span>2025-09-10 到期回收</span></div></div>'+
      '<div class="hint" style="margin-top:12px"><span class="msi">rule</span>RULE-03：跨部門議題未完成期限前，Board Book 不得提前封存。</div>'+
    '</div>'+
  '</div>';
}
function readerRow(av,nm,role,tm,pct,cls,st){
  var pm={ok:"p-ok",run:"p-run",warn:"p-warn"};
  return '<tr><td><span class="avatar">'+av+'</span> '+nm+'</td><td>'+role+'</td><td class="mono">'+tm+'</td>'+
  '<td style="min-width:120px"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="muted">'+pct+'%</span></td>'+
  '<td><span class="pill '+pm[cls]+'">'+st+'</span></td></tr>';
}

/* ---------- Screen 2 : 簽核與出席 ---------- */
function s2(c){
  c.innerHTML=
  '<div class="screen-head"><h2><span class="msi">fact_check</span>簽核與出席表決</h2><p>會議出席與利害關係迴避登記、各議案電子表決結果即時彙整。</p></div>'+
  '<div class="grid g-31" style="margin-bottom:16px">'+
    '<div class="card"><h3><span class="msi">how_to_vote</span>議案表決彙整</h3>'+
      '<div class="tw"><table><thead><tr><th>議案</th><th>類別</th><th>同意</th><th>反對</th><th>迴避</th><th>結果</th></tr></thead><tbody>'+
      voteRow("財務報表核閱案","審計",8,0,1,"通過","ok")+
      voteRow("庫藏股買回計畫","財務",7,1,1,"通過","ok")+
      voteRow("經理人薪酬調整案","薪酬",6,2,1,"通過","ok")+
      voteRow("重大投資額度授權","投資",5,3,1,"待複議","warn")+
      voteRow("獨立董事提名案","提名",9,0,0,"通過","ok")+
      '</tbody></table></div></div>'+
    '<div class="card"><h3><span class="msi">donut_large</span>整體表決分布</h3>'+
      '<div id="c2" class="chart sm"></div></div>'+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="msi">groups</span>出席與迴避登記</h3>'+
      '<div class="lr"><div class="ic"><span class="msi">event_available</span></div><div class="bd"><b>應出席 11 人 · 實際 10 人</b><span>林建宏董事委託出席</span></div><span class="pill p-ok">法定人數足</span></div>'+
      '<div class="lr"><div class="ic"><span class="msi">no_accounts</span></div><div class="bd"><b>利害關係迴避 1 人</b><span>薪酬案：張家豪董事迴避</span></div><span class="pill p-warn">已登記</span></div>'+
      '<div class="lr"><div class="ic"><span class="msi">videocam</span></div><div class="bd"><b>視訊出席 3 人</b><span>身分驗證通過</span></div><span class="pill p-run">連線中</span></div>'+
    '</div>'+
    '<div class="card"><h3><span class="msi">verified</span>各議案表決人數</h3>'+
      '<div id="c2b" class="chart sm"></div></div>'+
  '</div>';
  void c.offsetHeight;
  disposeAll();
  pushChart(mkChart("c2",{
    tooltip:{trigger:"item"},
    series:[{type:"pie",radius:["45%","72%"],avoidLabelOverlap:false,
      label:{formatter:"{b}\n{c}",fontSize:11},
      data:[{value:35,name:"同意",itemStyle:{color:"#e11d48"}},{value:6,name:"反對",itemStyle:{color:"#fb7185"}},{value:4,name:"迴避",itemStyle:{color:"#94a3b8"}}]
    }]
  }));
  pushChart(mkChart("c2b",{
    grid:{left:6,right:14,top:16,bottom:24,containLabel:true},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["財務報表","庫藏股","薪酬案","投資授權","提名案"],axisLabel:{fontSize:10,interval:0}},
    yAxis:{type:"value",max:11,axisLabel:{fontSize:10}},
    series:[{type:"bar",data:[9,9,8,8,9],itemStyle:{color:"#fb7185",borderRadius:[5,5,0,0]},barWidth:"48%"}]
  }));
}
function voteRow(n,cat,y,no,ab,res,cls){
  var pm={ok:"p-ok",warn:"p-warn"};
  return '<tr><td>'+n+'</td><td><span class="pill p-mut">'+cat+'</span></td><td class="mono">'+y+'</td><td class="mono">'+no+'</td><td class="mono">'+ab+'</td><td><span class="pill '+pm[cls]+'">'+res+'</span></td></tr>';
}

/* ---------- Screen 3 : 決議記錄 ---------- */
function s3(c){
  c.innerHTML=
  '<div class="screen-head"><h2><span class="msi">gavel</span>決議記錄與存證</h2><p>每項議案的表決結果與會議決議內容留存，形成不可竄改的治理存證軌跡。</p></div>'+
  '<div class="grid g-31">'+
    '<div class="card"><h3><span class="msi">history</span>決議形成軌跡　<span class="muted" style="font-weight:400">第 9 屆第 4 次董事會</span></h3>'+
      '<div class="tl">'+
      tlItem("09:32","議程確認","主席宣布出席人數符合法定門檻，議程照案通過。")+

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  disposeAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
  var app=document.getElementById("app");
  app.innerHTML="";
  void app.offsetHeight;
  (SCREENS[i]||s0)(app);
}

(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="msi">'+MODS[i].icon+'</span><span class="lb">'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var bs=nav.querySelectorAll("[data-i]");
  for(var j=0;j<bs.length;j++){ bs[j].addEventListener("click",function(){ var k=+this.getAttribute("data-i"); show(k); location.hash="v"+k; }); }
})();

window.addEventListener("resize",function(){ for(var i=0;i<charts.length;i++){ try{charts[i].resize();}catch(e){} } });

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
