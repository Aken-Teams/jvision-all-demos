<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DFM/DFA分析系統（可製造性/可組裝性分析）｜Jvision Demo</title>
<meta name="description" content="PCB 可製造性規則檢查、零件間距/公差分析、組裝流程模擬與良率預估的單一分析平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap');

:root{
  --color-primary:#15803d;
  --color-on-primary:#fff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#fff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#15803d;
  --blue:#15803d;
  --ink:#14532d;
  --muted:#475569;
  --line:#bbf7d0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --card:var(--color-card);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --good:#15803d;
  --warn:#b45309;
  --bad:#b91c1c;
  --shadow-sm:0 5px 16px rgba(20,83,45,.07);
  --shadow-md:0 18px 44px rgba(20,83,45,.11);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:"Exo",sans-serif;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 92% 2%,rgba(34,197,94,.13),transparent 28rem),
    radial-gradient(circle at 3% 92%,rgba(217,119,6,.08),transparent 24rem),
    var(--color-background);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[role="button"],a{cursor:pointer;}
::selection{color:#052e16;background:#86efac;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.shell{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  position:sticky;
  top:0;
  width:276px;
  height:100vh;
  flex:0 0 276px;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
  overflow:auto;
  color:#dcfce7;
  background:
    radial-gradient(circle at 8% 8%,rgba(134,239,172,.18),transparent 13rem),
    linear-gradient(165deg,#14532d 0%,#166534 54%,#0f3d25 100%);
  border-right:1px solid rgba(255,255,255,.12);
  box-shadow:12px 0 38px rgba(20,83,45,.12);
}
.sidebar:after{
  content:"";
  position:absolute;
  right:-44px;
  bottom:8%;
  width:92px;
  height:160px;
  pointer-events:none;
  border:1px solid rgba(134,239,172,.13);
  border-radius:72% 28% 70% 30% / 46% 58% 42% 54%;
  transform:rotate(22deg);
}
.brand{
  display:flex;
  gap:12px;
  align-items:center;
  padding:4px 8px 20px;
  margin-bottom:10px;
  border-bottom:1px solid rgba(220,252,231,.18);
}
.brand .logo{
  width:46px;
  height:46px;
  border-radius:64% 36% 58% 42% / 42% 58% 42% 58%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 46px;
  color:#052e16;
  background:linear-gradient(145deg,#bbf7d0,#4ade80);
  box-shadow:0 10px 24px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.7);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em;color:#fff;}
.brand span{font-size:11px;color:#bbf7d0;}
.nav{display:flex;flex-direction:column;gap:6px;}
.navbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:46px;
  min-width:0;
  padding:11px 12px;
  border:1px solid transparent;
  border-radius:16px 12px 16px 10px;
  background:transparent;
  color:#dcfce7;
  font-size:13.5px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  transition:background-color .22s ease,color .22s ease,transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;color:#86efac;}
.navbtn:hover{color:#fff;background:rgba(255,255,255,.09);border-color:rgba(220,252,231,.18);transform:translateX(3px);}
.navbtn.on{
  color:#052e16;
  background:linear-gradient(135deg,#f0fdf4,#bbf7d0);
  border-color:#dcfce7;
  box-shadow:0 12px 28px rgba(0,0,0,.2);
}
.navbtn.on .material-symbols-outlined{color:#15803d;}
.navbtn .idx{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;opacity:.7;}
.sidenote{
  margin-top:auto;
  padding:14px;
  border:1px solid rgba(220,252,231,.2);
  border-radius:18px 12px 20px 14px;
  color:#dcfce7;
  background:rgba(255,255,255,.07);
  font-size:11px;
  line-height:1.7;
  backdrop-filter:blur(10px);
}
.main{flex:1 1 auto;min-width:0;padding:30px clamp(20px,3vw,48px) 52px;}
#screen{width:100%;max-width:1580px;margin:0 auto;}
.topbar{
  position:relative;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  min-height:88px;
  margin-bottom:20px;
  padding:18px 22px;
  border:1px solid rgba(187,247,208,.9);
  border-radius:24px 18px 26px 16px;
  background:rgba(255,255,255,.8);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);
  overflow:hidden;
}
.topbar:after{
  content:"";
  position:absolute;
  right:-28px;
  top:-58px;
  width:170px;
  height:130px;
  border-radius:55% 45% 62% 38% / 48% 62% 38% 52%;
  background:linear-gradient(145deg,rgba(34,197,94,.16),rgba(217,119,6,.06));
  pointer-events:none;
}
.topbar>div{position:relative;z-index:1;}
.topbar h1{margin:0;font-size:clamp(20px,2vw,28px);font-weight:700;line-height:1.2;letter-spacing:-.025em;color:#14532d;}
.topbar .sub{margin-top:6px;font-size:13px;font-weight:500;color:#475569;}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:6px 11px;
  border:1px solid #bbf7d0;
  border-radius:999px;
  color:#166534;
  background:#f0fdf4;
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.chip .material-symbols-outlined{font-size:16px;color:#15803d;}
.grid{display:grid;gap:18px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr);}
.card{
  position:relative;
  min-width:0;
  padding:20px;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid var(--color-border);
  border-radius:20px 15px 22px 16px;
  box-shadow:var(--shadow-sm);
  transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease;
}
.card:hover{transform:translateY(-2px);border-color:#86efac;box-shadow:var(--shadow-md);}
.card h3{display:flex;align-items:center;gap:9px;margin:0 0 5px;font-size:14px;font-weight:700;color:#14532d;}
.card h3 .material-symbols-outlined{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border-radius:60% 40% 55% 45% / 45% 58% 42% 55%;
  color:#15803d;
  background:#dcfce7;
  font-size:18px;
}
.card .csub{margin:0 0 16px;font-size:11.5px;font-weight:500;color:#475569;}
.kpi{overflow:hidden;}
.kpi:after{
  content:"";
  position:absolute;
  right:-28px;
  bottom:-44px;
  width:108px;
  height:92px;
  border-radius:66% 34% 48% 52% / 46% 58% 42% 54%;
  background:linear-gradient(145deg,rgba(34,197,94,.11),rgba(187,247,208,.03));
  pointer-events:none;
}
.kpi .lab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;color:#475569;font-size:12px;font-weight:600;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:#15803d;}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:9px;
  color:#14532d;
  font-family:"Roboto Mono",monospace;
  font-size:clamp(27px,3vw,34px);
  font-weight:700;
  letter-spacing:-.05em;
  line-height:1.15;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small{margin-left:4px;color:#475569;font-family:"Exo",sans-serif;font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:11.5px;font-weight:700;}
.kpi .delta .material-symbols-outlined{font-size:16px;}
.up{color:#166534;}.down{color:#b91c1c;}.flat{color:#475569;}
.ovf{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-color:#86efac transparent;}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;}
th{
  padding:10px 12px;
  border-bottom:1px solid #86efac;
  color:#475569;
  background:#f0fdf4;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:first-child{border-radius:10px 0 0 10px;}
th:last-child{border-radius:0 10px 10px 0;}
td{padding:12px;border-bottom:1px solid #dcfce7;vertical-align:middle;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#f0fdf4;}
tr:last-child td{border-bottom:none;}
td:nth-child(n+3){text-align:right;}
td:first-child,td:nth-child(2){text-align:left;}
td b{font-weight:700;}
td .tag{margin-left:auto;}
.mini,.tk .id,.tl .bd .t,td:first-child,.kpi .val{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums lining-nums;
}
.mini{font-size:10.5px;color:#475569;font-weight:500;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.8);}
.t-red{color:#991b1b;background:#fef2f2;}
.t-amb{color:#92400e;background:#fffbeb;}
.t-grn{color:#166534;background:#f0fdf4;}
.t-gry{color:#475569;background:#f1f5f9;}
.t-blu{color:#1e40af;background:#eff6ff;}
.bar{height:9px;min-width:60px;overflow:hidden;border:1px solid #bbf7d0;border-radius:999px;background:#ecfdf5;}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22c55e,#15803d);}
.chartbox{overflow:hidden;min-width:0;}
.apexcharts-canvas{margin-inline:auto;}
.apexcharts-text,.apexcharts-legend-text{font-family:"Exo",sans-serif!important;}
.apexcharts-gridline{stroke:#dcfce7;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:#475569;font-size:11.5px;}
.legend b{display:inline-flex;align-items:center;gap:6px;color:#14532d;font-weight:600;}
.dot{display:inline-block;width:10px;height:10px;border:2px solid rgba(20,83,45,.16);border-radius:50%;}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;min-width:800px;}
.col{min-width:0;padding:11px;border:1px solid #bbf7d0;border-radius:18px 13px 20px 14px;background:linear-gradient(155deg,#f0fdf4,#f8fafc);}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;font-size:12px;font-weight:700;}
.col h4 span{padding:3px 8px;border:1px solid #bbf7d0;border-radius:999px;color:#166534;background:#fff;font-family:"Roboto Mono",monospace;font-size:10px;}
.tk{margin-bottom:9px;padding:11px;border:1px solid #bbf7d0;border-left:4px solid #22c55e;border-radius:13px 9px 14px 10px;background:#fff;box-shadow:0 4px 12px rgba(20,83,45,.05);}
.tk:last-child{margin-bottom:0;}
.tk .id{color:#475569;font-size:10px;font-weight:700;letter-spacing:.04em;}
.tk .ti{margin:4px 0 7px;font-size:12.5px;font-weight:700;line-height:1.4;}
.tk .mt{display:flex;gap:8px;flex-wrap:wrap;color:#475569;font-size:10.5px;}
.tl{position:relative;padding-left:7px;}
.tl .row{position:relative;display:flex;gap:14px;padding-bottom:18px;}
.tl .row:before{content:"";position:absolute;left:10px;top:24px;bottom:-3px;width:2px;background:#bbf7d0;}
.tl .row:last-child:before{display:none;}
.tl .mk{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;border:2px solid #fff;border-radius:58% 42% 54% 46%;color:#fff;box-shadow:0 0 0 2px #bbf7d0;}
.tl .mk .material-symbols-outlined{font-size:13px;}
.tl .bd{flex:1;min-width:0;}
.tl .bd .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;}
.tl .bd .t{color:#475569;font-size:10.5px;font-weight:600;}
.tl .bd .d{margin-top:4px;color:#475569;font-size:11.5px;line-height:1.55;}
.heat{display:grid;grid-template-columns:auto repeat(6,1fr);gap:6px;min-width:420px;}
.heat .hc{display:flex;align-items:center;justify-content:center;padding:4px 2px;color:#475569;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;text-align:center;}
.heat .cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1.6;border:2px solid rgba(255,255,255,.8);border-radius:11px 8px 12px 9px;color:#fff;font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:700;box-shadow:0 4px 10px rgba(20,83,45,.08);}
.stepflow{display:flex;flex-direction:column;gap:0;}
.step{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed #bbf7d0;}
.step:last-child{border-bottom:none;}
.step .no{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex:0 0 28px;border-radius:60% 40% 58% 42%;color:#fff;background:#15803d;font-family:"Roboto Mono",monospace;font-size:11px;font-weight:700;box-shadow:0 5px 12px rgba(21,128,61,.2);}
.step .sb{flex:1;min-width:0;}
.step .sb .st{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;}
.step .sb .sd{margin-top:3px;color:#475569;font-size:11px;}
.gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.donut-c{min-width:0;}
.reslist{display:flex;flex-direction:column;gap:10px;}
.resitem{display:flex;align-items:center;gap:12px;min-width:0;padding:11px;border:1px solid #bbf7d0;border-radius:15px 11px 16px 12px;}
.resitem .ic{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border-radius:60% 40% 56% 44%;color:#15803d;background:#dcfce7;}
.resitem .ic .material-symbols-outlined{font-size:19px;}
.resitem .rb{flex:1;min-width:0;}
.resitem .rb .rt{font-size:12.5px;font-weight:700;}
.resitem .rb .rd{margin-top:2px;color:#475569;font-size:11px;line-height:1.45;}
.sig{
  color:#fff;
  border-color:rgba(187,247,208,.35);
  background:
    radial-gradient(circle at 92% 8%,rgba(134,239,172,.25),transparent 14rem),
    linear-gradient(145deg,#14532d,#166534 60%,#0f3d25);
  box-shadow:0 20px 46px rgba(20,83,45,.22);
}
.sig:hover{border-color:#86efac;}
.sig h3{color:#fff;}
.sig h3 .material-symbols-outlined{color:#052e16;background:#86efac;}
.sig .csub,.sig .lab,.sig .resitem .rb .rd{color:#dcfce7!important;}
.sig .big{color:#fff;font-family:"Roboto Mono",monospace;font-size:clamp(36px,5vw,48px);font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;}
.sig .lab{font-size:12px;font-weight:600;}
.ring{position:relative;width:96px;height:96px;flex:0 0 96px;}

.navbtn:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #fbbf24;
  outline-offset:3px;
  box-shadow:0 0 0 6px rgba(255,255,255,.78);
}
.ovf:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;}

@keyframes chapter-in{
  from{opacity:0;transform:translateY(18px) scale(.975);}
  to{opacity:1;transform:none;}
}
@keyframes item-in{
  from{opacity:0;transform:translateY(12px) scale(.94);}
  to{opacity:1;transform:none;}
}
#screen>.topbar{animation:chapter-in .42s cubic-bezier(.2,.8,.2,1) both;}
#screen>.grid,#screen>.card{animation:chapter-in .42s cubic-bezier(.2,.8,.2,1) both;}
#screen>.grid:nth-child(2),#screen>.card:nth-child(2){animation-delay:.06s;}
#screen>.grid:nth-child(3),#screen>.card:nth-child(3){animation-delay:.12s;}
#screen>.grid:nth-child(4),#screen>.card:nth-child(4){animation-delay:.18s;}
.grid>.card,.resitem,.step,.tl .row,.tk{animation:item-in .38s cubic-bezier(.34,1.35,.64,1) both;}
.grid>.card:nth-child(2),.resitem:nth-child(2),.step:nth-child(2),.tl .row:nth-child(2),.tk:nth-child(2){animation-delay:.06s;}
.grid>.card:nth-child(3),.resitem:nth-child(3),.step:nth-child(3),.tl .row:nth-child(3),.tk:nth-child(3){animation-delay:.12s;}
.grid>.card:nth-child(4),.resitem:nth-child(4),.step:nth-child(4),.tl .row:nth-child(4),.tk:nth-child(4){animation-delay:.18s;}
.step:nth-child(n+5),.tl .row:nth-child(n+5){animation-delay:.22s;}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .board{grid-template-columns:repeat(4,minmax(180px,1fr));}
}
@media(max-width:860px){
  .shell{display:block;}
  .sidebar{
    position:relative;
    width:auto;
    height:auto;
    min-height:0;
    padding:12px 14px;
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,.16);
    overflow:visible;
  }
  .sidebar:after,.sidenote{display:none;}
  .brand{margin:0;padding:2px 4px 12px;border-bottom-color:rgba(255,255,255,.15);}
  .brand .logo{width:40px;height:40px;flex-basis:40px;}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(42px,1fr));gap:6px;}
  .navbtn{justify-content:center;min-height:44px;padding:9px 7px;text-align:center;}
  .navbtn .lbl,.navbtn .idx{display:none;}
  .navbtn:hover{transform:translateY(-2px);}
  .main{padding:20px 16px 36px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .topbar{align-items:flex-start;}
  .pill{width:100%;margin-left:0;}
}
@media(max-width:560px){
  .main{padding:14px 12px 30px;}
  .topbar{min-height:0;padding:16px;border-radius:20px 14px 22px 15px;}
  .topbar h1{font-size:20px;}
  .card{padding:16px;border-radius:18px 13px 20px 14px;}
  .g4{grid-template-columns:1fr 1fr;gap:10px;}
  .kpi .val{font-size:24px;}
  .kpi .lab{font-size:11px;}
  .chip{font-size:10.5px;}
  .gauge-wrap{justify-content:center;text-align:center;}
}
@media(max-width:390px){

/* nav */
(function buildNav(){
  var nav=document.getElementById("nav");var hh="";
  for(var i=0;i<MODS.length;i++){
    hh+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="lbl">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=hh;
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){(function(btn){btn.addEventListener("click",function(){location.hash="v"+btn.getAttribute("data-i");});})(btns[b]);}
})();

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
window.__show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
