<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DFM/DFA分析系統（可製造性/可組裝性分析）｜Jvision Demo</title>
<meta name="description" content="PCB 可製造性規則檢查、零件間距/公差分析、組裝流程模擬與良率預估的單一分析平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--card:#ffffff;--line:#e2e8f0;--txt:#1e293b;--mut:#64748b;--good:#16a34a;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.shell{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 38px;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:14.5px;font-weight:800;letter-spacing:.2px;display:block;}
.brand span{font-size:11px;color:var(--mut);}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;background:transparent;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;width:100%;min-width:0;transition:.12s;}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;}
.navbtn:hover{background:#f1f5f9;color:var(--txt);}
.navbtn.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(51,65,85,.28);}
.navbtn .idx{margin-left:auto;font-size:10.5px;font-weight:700;opacity:.5;}
.sidenote{margin-top:auto;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:11px;color:var(--mut);line-height:1.6;}
.main{flex:1 1 auto;min-width:0;padding:24px 28px 40px;}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.topbar h1{font-size:19px;margin:0;font-weight:800;}
.topbar .sub{font-size:12.5px;color:var(--mut);}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.chip{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:20px;background:#e2e8f0;color:#334155;display:inline-flex;align-items:center;gap:5px;}
.chip .material-symbols-outlined{font-size:15px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;}
.card h3{margin:0 0 4px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.card .csub{font-size:11.5px;color:var(--mut);margin:0 0 14px;}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .val{font-size:30px;font-weight:900;margin-top:8px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:700;color:var(--mut);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.up{color:var(--good);}.down{color:var(--bad);}.flat{color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px;}
td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;display:inline-block;}
.t-red{background:#fef2f2;color:#dc2626;}
.t-amb{background:#fffbeb;color:#d97706;}
.t-grn{background:#f0fdf4;color:#16a34a;}
.t-gry{background:#f1f5f9;color:#475569;}
.t-blu{background:#eff6ff;color:#2563eb;}
.bar{height:7px;border-radius:4px;background:#e2e8f0;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.ovf{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chartbox{overflow:hidden;min-width:0;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px;}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--txt);}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;}
.col h4 span{font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--mut);}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;border-left:3px solid var(--accent2);}
.tk .id{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;}
.tk .ti{font-size:12.5px;font-weight:700;margin:3px 0 6px;}
.tk .mt{font-size:10.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;}
/* timeline */
.tl{position:relative;padding-left:8px;}
.tl .row{display:flex;gap:14px;padding-bottom:16px;position:relative;}
.tl .row:before{content:"";position:absolute;left:9px;top:22px;bottom:-4px;width:2px;background:var(--line);}
.tl .row:last-child:before{display:none;}
.tl .mk{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:flex;align-items:center;justify-content:center;color:#fff;z-index:1;}
.tl .mk .material-symbols-outlined{font-size:13px;}
.tl .bd{flex:1;min-width:0;}
.tl .bd .h{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.tl .bd .t{font-size:11px;color:var(--mut);font-weight:600;}
.tl .bd .d{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.5;}
/* heat grid */
.heat{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px;min-width:420px;}
.heat .hc{font-size:10px;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;padding:4px 2px;text-align:center;}
.heat .cell{aspect-ratio:1.6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;}
.stepflow{display:flex;flex-direction:column;gap:0;}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);}
.step:last-child{border-bottom:none;}
.step .no{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 26px;}
.step .sb{flex:1;min-width:0;}
.step .sb .st{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.step .sb .sd{font-size:11px;color:var(--mut);margin-top:2px;}
.mini{font-size:10.5px;color:var(--mut);font-weight:600;}
.gauge-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.donut-c{min-width:0;}
.reslist{display:flex;flex-direction:column;gap:10px;}
.resitem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;min-width:0;}
.resitem .ic{width:34px;height:34px;border-radius:9px;background:#eef2ff;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
.resitem .rb{flex:1;min-width:0;}
.resitem .rb .rt{font-size:12.5px;font-weight:700;}
.resitem .rb .rd{font-size:11px;color:var(--mut);margin-top:1px;}
.sig{background:linear-gradient(135deg,#334155,#475569);color:#fff;border:none;}
.sig h3{color:#fff;}
.sig h3 .material-symbols-outlined{color:#cbd5e1;}
.sig .big{font-size:44px;font-weight:900;letter-spacing:-1px;}
.sig .lab{font-size:12px;color:#cbd5e1;font-weight:600;}
.ring{position:relative;width:96px;height:96px;flex:0 0 96px;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .shell{display:block;}
  .sidebar{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px;}
  .brand{border-bottom:none;margin:0;padding:0 8px 0 0;}
  .sidenote{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;}
  .navbtn{width:auto;padding:8px 12px;}
  .navbtn .idx{display:none;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .navbtn span.lbl{display:none;}
  .navbtn{padding:9px 11px;}
  .main{padding:16px 14px 30px;}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>DFM / DFA 分析</b><span>可製造性・可組裝性平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidenote">Demo 示意資料，數據皆為模擬。適用角色：研發專案管理師、研發經理、技術長。</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {icon:"dashboard",name:"DFM/DFA 儀表板",short:"儀表板"},
  {icon:"rule",name:"PCB 可製造性檢查",short:"可製造性"},
  {icon:"precision_manufacturing",name:"間距與公差分析",short:"間距公差"},
  {icon:"account_tree",name:"組裝流程模擬",short:"組裝模擬"},
  {icon:"insights",name:"良率預估",short:"良率預估"},
  {icon:"task_alt",name:"設計凍結與放行",short:"凍結放行"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var BASE={chart:{fontFamily:'Inter,"Noto Sans TC",sans-serif',redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false}}};
function merge(o){var c=JSON.parse(JSON.stringify(BASE));c.chart.height=o.height;c.chart.type=o.type;if(o.stacked)c.chart.stacked=true;for(var k in o){if(k==="height"||k==="type"||k==="stacked")continue;c[k]=o[k];}return c;}

/* ---------- screen builders ---------- */
function head(title,sub,chips){
  var h='<div class="topbar"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="pill">';
  for(var i=0;i<chips.length;i++){h+='<span class="chip"><span class="material-symbols-outlined">'+chips[i][0]+'</span>'+chips[i][1]+'</span>';}
  return h+'</div></div>';
}
function kpi(icon,lab,val,unit,delta,dir){
  var da=delta?'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat")+'</span>'+delta+'</div>':'';
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+da+'</div>';
}

/* screen 0 : dashboard */
function s0(){
  var h=head("DFM/DFA 儀表板","專案可製造性總覽與待辦",[["folder_open","進行專案 6"],["schedule","更新 3 分鐘前"]]);
  h+='<div class="grid g4">'
    +kpi("verified","綜合可製造性評分","82","/100","+6 較上版","up")
    +kpi("rule","未關閉 DFM 違規","23","項","-11 本週","up")
    +kpi("insights","預估首件良率","91.4","%","+2.3%","up")
    +kpi("history","累計改板次數","4","次","-2 vs 前案","up")
    +'</div>';
  h+='<div class="grid g23" style="margin-top:16px">';
  h+='<div class="card chartbox"><h3><span class="material-symbols-outlined">monitoring</span>各專案可製造性評分趨勢</h3><p class="csub">近 6 版設計評審評分（越高越可製造）</p><div id="c0a"></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">warning</span>違規嚴重度分布</h3><p class="csub">目前開放中違規</p><div id="c0b"></div>'
    +'<div class="legend"><b><span class="dot" style="background:#dc2626"></span>嚴重</b><b><span class="dot" style="background:#d97706"></span>次要</b><b><span class="dot" style="background:#64748b"></span>提示</b></div></div>';
  h+='</div>';
  h+='<div class="grid g2" style="margin-top:16px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">folder_open</span>進行中分析專案</h3><p class="csub">依風險排序</p><div class="ovf"><table><thead><tr><th>專案</th><th>階段</th><th>評分</th><th>違規</th><th>狀態</th></tr></thead><tbody>';
  var rows=[["PJ-3391 車載電源板","規則檢查","78",8,"t-amb","分析中"],["PJ-3384 感測模組","組裝模擬","85",3,"t-blu","模擬中"],["PJ-3378 主控板 v3","良率預估","91",1,"t-grn","待簽核"],["PJ-3402 快充轉板","規則檢查","64",11,"t-red","高風險"],["PJ-3369 IoT 閘道","凍結放行","96",0,"t-grn","已放行"]];
  for(var i=0;i<rows.length;i++){var r=rows[i];h+='<tr><td><b>'+r[0]+'</b></td><td class="mini">'+r[1]+'</td><td><b>'+r[2]+'</b></td><td>'+r[3]+'</td><td><span class="tag '+r[4]+'">'+r[5]+'</span></td></tr>';}
  h+='</tbody></table></div></div>';
  h+='<div class="card sig"><h3><span class="material-symbols-outlined">insights</span>本週 AI 改善重點</h3><p class="csub" style="color:#cbd5e1">依違規密度與良率影響排序</p>'
    +'<div class="reslist" style="margin-top:6px">'
    +'<div class="resitem" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)"><div class="ic" style="background:rgba(255,255,255,.14);color:#fff"><span class="material-symbols-outlined">bolt</span></div><div class="rb"><div class="rt" style="color:#fff">U7 周邊焊墊間距不足</div><div class="rd" style="color:#cbd5e1">影響回流焊良率約 -3.1%，建議加大 0.08mm</div></div></div>'
    +'<div class="resitem" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)"><div class="ic" style="background:rgba(255,255,255,.14);color:#fff"><span class="material-symbols-outlined">build</span></div><div class="rb"><div class="rt" style="color:#fff">J3 連接器貼裝方向受阻</div><div class="rd" style="color:#cbd5e1">DFA 模擬第 4 站治具干涉，建議翻轉封裝</div></div></div>'
    +'<div class="resitem" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)"><div class="ic" style="background:rgba(255,255,255,.14);color:#fff"><span class="material-symbols-outlined">rule</span></div><div class="rb"><div class="rt" style="color:#fff">Layer3 線寬低於製程下限</div><div class="rd" style="color:#cbd5e1">6 處 < 0.10mm，建議改走 0.12mm 或加銅</div></div></div>'
    +'</div></div>';
  h+='</div>';
  document.getElementById("screen").innerHTML=h;
  void document.getElementById("screen").offsetHeight;
  mkChart("c0a",merge({type:"line",height:280,
    series:[{name:"車載電源板",data:[58,64,66,72,75,78]},{name:"主控板 v3",data:[70,76,82,86,89,91]},{name:"快充轉板",data:[48,52,55,58,61,64]}],
    colors:["#334155","#16a34a","#dc2626"],stroke:{width:3,curve:"smooth"},
    xaxis:{categories:["v1","v2","v3","v4","v5","v6"],labels:{style:{fontSize:"11px"}}},
    yaxis:{min:40,max:100,labels:{style:{fontSize:"11px"}}},
    grid:{borderColor:"#eef2f6"},legend:{fontSize:"11px"},dataLabels:{enabled:false},markers:{size:3}}));
  mkChart("c0b",merge({type:"donut",height:250,
    series:[7,10,6],labels:["嚴重","次要","提示"],colors:["#dc2626","#d97706","#64748b"],
    legend:{show:false},dataLabels:{enabled:true,style:{fontSize:"11px"}},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"開放違規",fontSize:"12px",formatter:function(){return "23 項";}}}}}}}));
}

/* screen 1 : PCB manufacturability check */
function s1(){
  var h=head("PCB 可製造性檢查","依製程規則庫自動檢出設計違規",[["memory","PJ-3391 車載電源板"],["rule","規則庫 IPC-A / 廠規 v4"]]);
  h+='<div class="grid g4">'
    +kpi("checklist","已檢核規則","148","項","涵蓋 6 層","flat")
    +kpi("error","違規總數","19","處","嚴重 5","down")
    +kpi("straighten","最小線寬","0.09","mm","低於下限 0.10","down")
    +kpi("adjust","最小鑽孔孔環","0.11","mm","符合","flat")
    +'</div>';
  h+='<div class="grid g32" style="margin-top:16px">';
  h+='<div class="card chartbox"><h3><span class="material-symbols-outlined">bar_chart</span>各類別違規數</h3><p class="csub">依規則類別統計</p><div id="c1a"></div></div>';

    [["ECR-218","J3 連接器改向","組裝","次要","#d97706"],["ECR-219","翻板治具重設計","治具","嚴重","#dc2626"]],
    [["ECR-215","Layer3 線寬加寬","線路","嚴重","#dc2626"]],
    [["ECR-210","板邊淨空校正","板框","次要","#64748b"],["ECR-208","阻焊開窗校正","阻焊","提示","#64748b"],["ECR-205","絲印避讓焊墊","絲印","提示","#64748b"]]

var SCREENS=[s0,s1,s2,s3,s4,s5];

/* nav */
(function buildNav(){
  var nav=document.getElementById("nav");var hh="";
  for(var i=0;i<MODS.length;i++){
    hh+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="lbl">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=hh;
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){(function(btn){btn.addEventListener("click",function(){location.hash="v"+btn.getAttribute("data-i");});})(btns[b]);}
})();

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
window.__show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
