<style>
:root{
  --c1:#0891b2; --c2:#22d3ee; --bg:#f1f5f9; --card:#ffffff;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f8fafc;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --pur:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#083344,#0891b2);color:#fff;box-shadow:0 2px 14px rgba(8,51,68,.25)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--c2),#fff3);display:flex;align-items:center;justify-content:center;color:#083344}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.8}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e0f2fe;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.2)}
.nav button.on{background:#fff;color:#0891b2;border-color:#fff}
.nav button .material-symbols-outlined{font-size:19px}
.who{display:flex;align-items:center;gap:9px;white-space:nowrap}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--c2);color:#083344;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.who small{font-size:11px;opacity:.85;display:block}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.head{margin-bottom:18px}
.head h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.head h1 .material-symbols-outlined{color:var(--c1);font-size:26px}
.head p{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{color:var(--c1);font-size:20px}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--c1),var(--c2))}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--c1)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .dt{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--soft)}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-blue{background:#cffafe;color:#0e7490}
.p-green{background:#dcfce7;color:#15803d}
.p-amber{background:#fef3c7;color:#b45309}
.p-red{background:#fee2e2;color:#b91c1c}
.p-gray{background:#e2e8f0;color:#475569}
.p-pur{background:#ede9fe;color:#6d28d9}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:980px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--line)}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 1px 2px rgba(15,23,42,.05);border-left:3px solid var(--c1)}
.tk.hi{border-left-color:var(--bad)}
.tk.mid{border-left-color:var(--warn)}
.tk .no{font-size:11px;color:var(--muted);font-weight:700}
.tk .nm{font-size:13px;font-weight:700;margin:3px 0 6px}
.tk .mt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.tk .amt{font-weight:800;color:var(--c1);font-size:12.5px}
.chartbox{overflow:hidden}
.flex{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.mb{margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
.bar-row .bn{width:90px;font-weight:600;flex-shrink:0}
.bar-track{flex:1;height:9px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:6px}
.bar-row .bv{width:48px;text-align:right;font-weight:700;color:var(--c1);flex-shrink:0}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--c1);border:2px solid #fff;box-shadow:0 0 0 2px var(--c2)}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .td{font-size:11.5px;color:var(--muted)}
.tl-item .tm{font-size:11px;color:var(--c1);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip .material-symbols-outlined{font-size:15px;color:var(--c1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.spec{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff}
.spec .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spec .ic .material-symbols-outlined{font-size:20px}
.spec .body{flex:1;min-width:0}
.spec .body .t{font-size:13px;font-weight:700}
.spec .body .d{font-size:11.5px;color:var(--muted)}
.miniStat{text-align:center;padding:12px;border-radius:11px;background:var(--soft);border:1px solid var(--line)}
.miniStat .n{font-size:22px;font-weight:800;color:var(--c1)}
.miniStat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.progress{height:7px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.sign{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#fff}
.sign .av{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
@media(max-width:560px){.hideSm{display:none!important}}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px}
</style>
</head>

function show(i){

  clearCharts();
  var btns=document.querySelectorAll("[data-i]");

}
