<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RFQ 詢報價管理 | JVision 智慧製造</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#cbd7ed;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#cbd7ed;
  --c1:#2563eb;
  --c2:#3b82f6;
  --bg:#f8fafc;
  --card:#fff;
  --soft:#f1f5fd;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --pur:#6d28d9;
}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
html{scroll-behavior:auto}
html,body{max-width:100%;overflow-x:hidden}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[onclick],[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:"liga";
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:#0f172a;
  border-bottom:4px solid var(--blue);
}
.topbar-inner{
  width:100%;
  max-width:1440px;
  min-height:76px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:stretch;
  gap:0;
}
.brand{
  width:285px;
  padding:11px 18px 11px 0;
  display:flex;
  align-items:center;
  gap:11px;
  border-right:1px solid #64748b;
  font-size:17px;
  font-weight:800;
  letter-spacing:-.02em;
  white-space:nowrap;
}
.brand .logo{
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid #fff;
}
.brand small{
  display:block;
  margin-top:2px;
  color:#cbd5e1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:0;
}
.nav{
  display:flex;
  flex:1;
  align-items:stretch;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-width:74px;
  padding:9px 12px;
  display:flex;
  flex:1;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#e2e8f0;
  background:transparent;
  border:0;
  border-right:1px solid #475569;
  border-radius:0;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s,color .18s;
}
.nav button:hover{color:#fff;background:#1e3a8a}
.nav button.on{
  color:#fff;
  background:var(--blue);
  box-shadow:inset 0 -5px 0 #fff;
}
.nav button .material-symbols-outlined{font-size:19px}
.who{
  padding-left:16px;
  display:flex;
  align-items:center;
  gap:9px;
  white-space:nowrap;
}
.who .av{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-accent);
  border:2px solid #fff;
  font-family:"Fira Code",monospace;
  font-size:13px;
  font-weight:800;
}
.who small{display:block;color:#cbd5e1;font-size:11px}
.wrap{
  width:min(1400px,calc(100% - 28px));
  margin:0 auto;
  padding:26px 0 54px;
}
.head{
  position:relative;
  margin:0 0 18px;
  padding:18px 22px 18px 26px;
  background:#fff;
  border:2px solid var(--ink);
}
.head::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:8px;
  background:var(--blue);
}
.head h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(23px,2.2vw,34px);
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1.15;
}
.head h1 .material-symbols-outlined{
  color:#fff;
  background:var(--blue);
  padding:8px;
  font-size:25px;
}
.head p{
  max-width:960px;
  margin-top:9px;
  color:var(--muted);
  font-size:13.5px;
  font-weight:500;
}
.card,.kpi,.miniStat{
  color:var(--card-foreground);
  background:var(--card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.card{padding:16px}
.card h3{
  margin-bottom:13px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14.5px;
  font-weight:800;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{
  padding:4px;
  color:#fff;
  background:var(--blue);
  font-size:18px;
}
.sub{color:var(--muted);font-size:12px;font-weight:500}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.mb{margin-bottom:15px}
.flex{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.kpi{
  position:relative;
  min-height:122px;
  padding:15px 16px 14px 20px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:7px;
  background:var(--blue);
}
.kpi:nth-child(even)::before{background:var(--color-accent)}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .lbl .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  margin-top:5px;
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small{
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  font-weight:700;
}
.kpi .dt{
  margin-top:5px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  font-weight:700;
}
.up{color:var(--ok)}
.down{color:var(--bad)}
.tw{
  width:100%;
  overflow-x:auto;
  background:#fff;
  border:2px solid var(--ink);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  font-variant-numeric:tabular-nums;
}
th{
  padding:10px;
  color:#fff;
  background:var(--ink);
  border-right:1px solid #64748b;
  border-bottom:2px solid var(--ink);
  text-align:left;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
}
td{
  padding:10px;
  background:#fff;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#eff6ff}
td:first-child,
td:nth-child(3),
td:nth-child(4),
td:nth-child(5),
td:nth-child(6){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td:nth-child(n+3){text-align:right}
th:nth-child(n+3){text-align:right}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-family:"Fira Sans",sans-serif;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}
.pill::before{content:"";width:6px;height:6px;background:currentColor}
.p-blue{color:#1d4ed8;background:#dbeafe}
.p-green{color:#047857;background:#d1fae5}
.p-amber{color:#92400e;background:#fef3c7}
.p-red{color:#b91c1c;background:#fee2e2}
.p-gray{color:#475569;background:#e2e8f0}
.p-pur{color:#6d28d9;background:#ede9fe}
.board{
  min-width:760px;
  display:grid;
  grid-template-columns:repeat(5,minmax(150px,1fr));
  gap:0;
  border:2px solid var(--ink);
}
.col{
  min-width:0;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:9px;
  background:var(--soft);
  border-right:2px solid var(--ink);
}
.col:last-child{border-right:0}
.col-h{
  padding:2px 0 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--blue);
  font-size:12px;
  font-weight:800;
}
.col-h .cnt{
  min-width:24px;
  padding:1px 6px;
  color:#fff;
  background:var(--ink);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
.tk{
  padding:10px;
  background:#fff;
  border:1px solid var(--ink);
  border-left:5px solid var(--blue);
  border-radius:0;
}
.tk.hi{border-left-color:var(--bad)}
.tk.mid{border-left-color:var(--warn)}
.tk .no{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:700;
}
.tk .nm{margin:4px 0 7px;font-size:12.5px;font-weight:800}
.tk .mt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10.5px;
}
.tk .amt{
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:11.5px;
  font-weight:700;
}
.chartbox{overflow:hidden}
.bar-row{
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
}
.bar-row .bn{width:75px;flex-shrink:0;font-family:"Fira Code",monospace;font-weight:600}
.bar-track{
  height:12px;
  flex:1;
  overflow:hidden;
  background:#e2e8f0;
  border:1px solid var(--ink);
}
.bar-fill{height:100%;background:var(--blue)}
.bar-row .bv{
  width:52px;
  flex-shrink:0;
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-weight:700;
  text-align:right;
}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;
  left:8px;
  top:4px;
  bottom:4px;
  width:3px;
  background:var(--ink);
}
.tl-item{position:relative;padding:0 0 18px 7px}
.tl-item::before{
  content:"";
  position:absolute;
  left:-24px;
  top:2px;
  width:13px;
  height:13px;
  background:#fff;
  border:4px solid var(--blue);
}
.tl-item .tt{font-size:13px;font-weight:800}
.tl-item .td{color:var(--muted);font-size:11.5px}
.tl-item .tm{color:#1d4ed8;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:700}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  color:#334155;
  background:var(--soft);
  border:1px solid var(--ink);
  border-radius:0;
  font-size:11.5px;
  font-weight:700;
}
.chip .material-symbols-outlined{color:var(--blue);font-size:16px}
.legend{
  margin-top:8px;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  color:var(--muted);
  font-size:11.5px;
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;display:inline-block;border:1px solid var(--ink)}
.spec{
  margin-bottom:9px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid var(--ink);
}
.spec .ic{
  width:36px;
  height:36px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid currentColor;
}
.spec .ic .material-symbols-outlined{font-size:20px}
.spec .body{flex:1}
.spec .body .t{font-size:12.5px;font-weight:800}
.spec .body .d{color:var(--muted);font-size:11.5px}
.miniStat{
  padding:13px;
  text-align:center;
}
.miniStat .n{
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:22px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.miniStat .l{color:var(--muted);font-size:11.5px;font-weight:700}
.progress{
  height:10px;
  margin-top:7px;
  overflow:hidden;
  background:#e2e8f0;
  border:1px solid var(--ink);
}
.progress i{display:block;height:100%;background:var(--blue)}
.sign{
  margin-bottom:10px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid var(--ink);
}
.sign .av{
  width:37px;
  height:37px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:13px;
  font-weight:700;
}
.foot{
  margin-top:28px;
  padding:12px;
  color:#334155;
  background:#fff;
  border:1px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  text-align:center;
}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
@media(max-width:1024px){
  .topbar-inner{padding:0 14px}
  .brand{width:auto;min-width:238px}
  .who{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .topbar-inner{min-height:auto;flex-wrap:wrap;padding:0}
  .brand{
    width:100%;
    min-width:0;
    padding:10px 14px;
    border-right:0;
    border-bottom:1px solid #475569;
  }
  .nav{width:100%;flex-basis:100%}
  .nav button{min-height:48px}
  .wrap{width:min(100% - 20px,1400px);padding-top:16px}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .card{padding:14px}
}
@media(max-width:560px){
  .hideSm{display:none!important}
  .nav button{min-width:52px;padding:9px}
  .nav button .material-symbols-outlined{font-size:21px}
  .head{padding:16px 14px 16px 21px}
  .head h1{font-size:23px}
  .head p{font-size:12.5px}
  .g4{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{min-height:112px;padding:13px 10px 12px 16px;box-shadow:3px 3px 0 var(--line)}
  .kpi .val{font-size:23px}
  .miniStat{padding:10px 6px;box-shadow:3px 3px 0 var(--line)}
  .between{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">request_quote</span></div>
      <div>RFQ 詢報價管理<small>JVision 智慧製造 · Request for Quotation</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="who">

  </div>
</div>
<div class="wrap">
  <main id="app"></main>
  <div class="foot">JVision 智慧製造展示系統 · RFQ 詢報價管理 · 本頁為純前端 UI 展示，資料皆為模擬</div>
</div>
<script>
"use strict";
var NAV=[
  {i:"request_quote",t:"詢價看板"},
  {i:"fact_check",t:"規格比對"},
  {i:"account_tree",t:"跨部門會簽"},
  {i:"receipt_long",t:"成本試算"},
  {i:"task_alt",t:"報價產出"},
  {i:"trending_up",t:"詢價分析"}
];
var app=document.getElementById("app");
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[]}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='"Fira Sans", sans-serif';
  opt.chart.foreColor="#475569";
  var c=new ApexCharts(el,opt);
  c.render();
  charts.push(c);
}
function reveal(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var els=app.querySelectorAll(".head,.kpi,.card");
  if(!("IntersectionObserver" in window)){
    for(var i=0;i<els.length;i++)els[i].classList.add("reveal");
    return;
  }
  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add("reveal");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.05,rootMargin:"0px 0px -5% 0px"});
  for(var j=0;j<els.length;j++)observer.observe(els[j]);
}
function v0(){
  var kpis=[
    {l:"本月新進詢價",v:"48",u:"件",ic:"inbox",dt:"+12%",up:1},
    {l:"進行中詢價",v:"23",u:"件",ic:"pending_actions",dt:"3 件逾期",up:0},
    {l:"平均回覆時效",v:"6.4",u:"小時",ic:"schedule",dt:"-19.6h",up:1},
    {l:"本月轉單率",v:"32",u:"%",ic:"trending_up",dt:"+4pt",up:1}
  ];
  var cols=[
    {t:"詢價登錄",tk:[
      {no:"RFQ-2608-041",nm:"CNC 精密外殼 x2,000",cust:"O山機電",amt:"$186萬",tag:"p-blue",tt:"新進",lv:""},
      {no:"RFQ-2608-045",nm:"沖壓端子連接件",cust:"O達電子",amt:"$52萬",tag:"p-blue",tt:"新進",lv:""}
    ]},
    {t:"規格比對",tk:[
      {no:"RFQ-2608-038",nm:"鋁擠型散熱鰭片",cust:"聯O精密",amt:"$94萬",tag:"p-amber",tt:"比對中",lv:"mid"},
      {no:"RFQ-2608-036",nm:"塑膠射出上蓋",cust:"O暘光電",amt:"$128萬",tag:"p-amber",tt:"比對中",lv:"mid"}
    ]},
    {t:"跨部門會簽",tk:[
      {no:"RFQ-2608-030",nm:"車床軸類件 x5,000",cust:"O昇動力",amt:"$240萬",tag:"p-pur",tt:"會簽中",lv:""},
      {no:"RFQ-2608-028",nm:"PCB 治具組",cust:"O興電路",amt:"$36萬",tag:"p-pur",tt:"會簽中",lv:""}

var SCREENS=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=+i||0;
  if(i<0)i=0;
  if(i>=SCREENS.length)i=SCREENS.length-1;
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  SCREENS[i]();
  reveal();
}
(function buildNav(){
  var nav=document.getElementById("nav"),html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button type="button" data-i="'+i+'" aria-label="'+NAV[i].t+'" onclick="location.hash=\'v'+i+'\'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].i+'</span><span class="hideSm">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=html;
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
