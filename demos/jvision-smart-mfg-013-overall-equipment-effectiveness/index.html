<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OEE系統（Overall Equipment Effectiveness）｜Jvision 系統 Demo</title>
<meta name="description" content="稼動率×效能×良率綜合指標，六大損失分析與改善行動追蹤" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
Chart.defaults.color="#CBD5E1";
Chart.defaults.borderColor="#334155";
Chart.defaults.font.family='Inter, system-ui, sans-serif';

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap');

:root{
  color-scheme:dark;
  --color-primary:#16A34A;
  --color-on-primary:#000000;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#DC2626;
  --color-on-accent:#FFFFFF;
  --color-background:#0F172A;
  --color-foreground:#F8FAFC;
  --color-card:#111827;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1E293B;
  --color-muted-foreground:#CBD5E1;
  --color-border:#334155;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#16A34A;
  --maintenance:#F59E0B;
  --blue:#16A34A;
  --ink:#F8FAFC;
  --muted:#CBD5E1;
  --line:#334155;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --card:var(--color-card);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --ok:#22C55E;
  --warn:#F59E0B;
  --bad:#EF4444;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{background:#070B12;scroll-behavior:smooth;}
html,body{
  color:var(--color-foreground);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{
  display:flex;
  min-height:100vh;
  background:
    radial-gradient(circle at 82% 2%,rgba(22,163,74,.12),transparent 28rem),
    linear-gradient(145deg,#070B12 0%,var(--color-background) 50%,#0B1220 100%);
}
button,a{font:inherit;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(22,163,74,.2);
}

.sidebar{
  width:260px;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
  display:flex;
  flex-direction:column;
  min-width:0;
  padding:24px 16px 18px;
  background:rgba(7,11,18,.94);
  border-right:1px solid rgba(148,163,184,.2);
  box-shadow:16px 0 48px rgba(0,0,0,.22);
  backdrop-filter:blur(18px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:2px 8px 24px;
  border-bottom:1px solid rgba(148,163,184,.14);
}
.brand .logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:#031108;
  border:1px solid #4ADE80;
  border-radius:12px;
  background:linear-gradient(145deg,#4ADE80,var(--color-primary));
  box-shadow:0 0 24px rgba(34,197,94,.22),inset 0 1px 0 rgba(255,255,255,.34);
}
.brand .logo .material-symbols-outlined{font-size:23px;}
.brand b{
  display:block;
  overflow:hidden;
  color:#FFFFFF;
  font-size:15px;
  font-weight:800;
  letter-spacing:.05em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:3px;
  color:var(--color-muted-foreground);
  font-size:11px;
  line-height:1.4;
}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:22px;}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:46px;
  min-width:0;
  padding:11px 13px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:#CBD5E1;
  font-size:13px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button::before{
  content:"";
  position:absolute;
  left:-1px;
  width:3px;
  height:22px;
  border-radius:0 4px 4px 0;
  background:transparent;
}
.nav button .material-symbols-outlined{flex:none;font-size:21px;color:#94A3B8;}
.nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.nav button:hover{
  color:#FFFFFF;
  border-color:rgba(74,222,128,.25);
  background:rgba(30,41,59,.75);
  transform:translateX(2px);
}
.nav button:hover .material-symbols-outlined{color:#86EFAC;}
.nav button.on{
  color:#FFFFFF;
  border-color:rgba(74,222,128,.34);
  background:linear-gradient(90deg,rgba(22,163,74,.22),rgba(30,41,59,.78));
  box-shadow:inset 0 0 22px rgba(22,163,74,.06),0 8px 22px rgba(0,0,0,.16);
}
.nav button.on::before{background:#4ADE80;box-shadow:0 0 12px rgba(74,222,128,.75);}
.nav button.on .material-symbols-outlined{color:#4ADE80;text-shadow:0 0 10px rgba(74,222,128,.55);}
.sidebar .foot{
  margin-top:auto;
  padding:16px 10px 2px;
  border-top:1px solid rgba(148,163,184,.14);
  color:#94A3B8;
  font-size:11px;
  line-height:1.65;
}

.main{flex:1;min-width:0;padding:34px clamp(20px,3vw,46px) 56px;}
#view{width:100%;max-width:1500px;margin:0 auto;}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid rgba(148,163,184,.17);
}
.top h1{
  display:flex;
  align-items:center;
  gap:11px;
  color:#FFFFFF;
  font-size:clamp(21px,2.2vw,29px);
  font-weight:800;
  letter-spacing:-.025em;
  line-height:1.2;
}
.top h1 .material-symbols-outlined{
  color:#4ADE80;
  font-size:28px;
  text-shadow:0 0 10px rgba(74,222,128,.42);
}
.top p{max-width:720px;margin-top:8px;color:#CBD5E1;font-size:13px;line-height:1.6;}
.pill{
  display:inline-flex;
  align-items:center;
  min-height:34px;
  padding:7px 12px;
  border:1px solid rgba(74,222,128,.38);
  border-radius:8px;
  background:rgba(22,163,74,.1);
  color:#BBF7D0;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  font-weight:600;
  line-height:1.4;
  white-space:nowrap;
  box-shadow:inset 0 0 16px rgba(22,163,74,.05);
}
.pill::before{
  content:"";
  width:7px;
  height:7px;
  margin-right:8px;
  border:2px solid #BBF7D0;
  border-radius:50%;
  background:#16A34A;
  box-shadow:0 0 8px rgba(74,222,128,.6);
}

.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);}

.card,.kpi{
  position:relative;
  min-width:0;
  border:1px solid var(--color-border);
  border-radius:12px;
  background:linear-gradient(155deg,rgba(17,24,39,.98),rgba(12,18,30,.98));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.025);
}
.card{padding:19px 20px;overflow:hidden;}
.card::before,.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto auto 0;
  width:100%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(74,222,128,.32),transparent);
  pointer-events:none;
}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:4px;
  color:#F8FAFC;
  font-size:13.5px;
  font-weight:750;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{color:#4ADE80;font-size:19px;text-shadow:0 0 9px rgba(74,222,128,.25);}
.card .sub{margin-bottom:15px;color:#AEBED2;font-size:11.5px;line-height:1.55;}

.kpi{
  min-height:154px;
  padding:17px 18px 16px;
  overflow:hidden;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.kpi:hover{border-color:#475569;transform:translateY(-2px);box-shadow:0 22px 56px rgba(0,0,0,.34);}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.kpi .k-ic{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  flex:none;
  border:1px solid currentColor;
  border-radius:9px;
  filter:saturate(.9) brightness(1.16);
}
.kpi .k-ic .material-symbols-outlined{font-size:20px;}
.kpi .k-lbl{margin-top:13px;color:#CBD5E1;font-size:11.5px;font-weight:600;letter-spacing:.015em;}
.kpi .k-val,.strip .s-v,.six-r .rv,.tl-row .vv{
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .k-val{
  margin-top:4px;
  color:#FFFFFF;
  font-size:clamp(25px,2.2vw,31px);
  font-weight:800;
  letter-spacing:-.035em;
  line-height:1.15;
  text-shadow:0 0 10px rgba(248,250,252,.1);
}
.kpi .k-val small{color:#CBD5E1;font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .k-dt{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 7px;
  border:1px solid currentColor;
  border-radius:6px;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:700;
}
.kpi .k-dt .material-symbols-outlined{font-size:14px;}
.up{color:#86EFAC;background:rgba(22,163,74,.11);}
.down{color:#FCA5A5;background:rgba(220,38,38,.11);}
.bar{height:5px;margin-top:13px;overflow:hidden;border-radius:2px;background:#263449;}
.bar>i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--color-primary),#4ADE80);box-shadow:0 0 10px rgba(34,197,94,.45);animation:grow .7s ease-out both;}
@keyframes grow{from{width:0;}}

.tw{min-width:0;overflow-x:auto;scrollbar-color:#475569 #111827;}
table{width:100%;min-width:600px;border-collapse:separate;border-spacing:0;color:#E5EDF7;font-size:12px;font-variant-numeric:tabular-nums lining-nums;}
th{
  padding:10px 12px;
  border-bottom:1px solid #475569;
  background:#162033;
  color:#CBD5E1;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.055em;
  text-align:left;
  text-transform:none;
  white-space:nowrap;
}
th:first-child{border-radius:7px 0 0 0;}
th:last-child{border-radius:0 7px 0 0;}
td{padding:12px;border-bottom:1px solid rgba(51,65,85,.72);color:#E2E8F0;white-space:nowrap;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:rgba(30,41,59,.76);}
tbody tr:last-child td{border-bottom:0;}
td b{color:#FFFFFF;font-weight:700;}
td:first-child b,td:first-child,td:nth-child(2){font-variant-numeric:tabular-nums;}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.25;
}
.tag::before{content:"";width:6px;height:6px;margin-right:6px;border:1px solid currentColor;border-radius:50%;background:currentColor;}
.t-ok{color:#86EFAC;background:rgba(22,163,74,.13);}
.t-warn{color:#FCD34D;background:rgba(245,158,11,.12);}
.t-bad{color:#FCA5A5;background:rgba(220,38,38,.14);}
.t-info{color:#A5B4FC;background:rgba(79,70,229,.16);}
.t-mut{color:#CBD5E1;background:#263449;}
.mini{height:7px;min-width:72px;overflow:hidden;border-radius:2px;background:#263449;}
.mini>i{display:block;height:100%;border-radius:2px;box-shadow:0 0 8px currentColor;}

.cwrap{position:relative;width:100%;}
.h180{height:180px;}.h220{height:220px;}.h260{height:260px;}
canvas{max-width:100%;}
.donutbox{position:relative;height:200px;}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-c b{color:#86EFAC;font-size:30px;font-weight:800;letter-spacing:-.04em;text-shadow:0 0 10px rgba(74,222,128,.24);}
.donut-c span{margin-top:2px;color:#CBD5E1;font-size:11px;font-weight:600;}

.tl{display:flex;flex-direction:column;gap:11px;}
.tl-row{display:flex;align-items:center;gap:11px;min-width:0;}
.tl-row .nm{width:96px;flex:none;overflow:hidden;color:#E2E8F0;font-size:11.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.tl-bar{display:flex;flex:1;height:23px;min-width:0;overflow:hidden;border:1px solid #334155;border-radius:5px;background:#1E293B;}
.tl-bar>i{display:flex;align-items:center;justify-content:center;height:100%;color:#FFFFFF;font-size:10px;font-weight:700;}
.tl-row .vv{width:54px;flex:none;color:#F8FAFC;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;text-align:right;}
.lgd{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;color:#CBD5E1;font-size:11px;}
.lgd span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;flex:none;border:1px solid rgba(255,255,255,.45);border-radius:2px;}

.strip{
  display:flex;
  flex-wrap:wrap;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:12px;
  background:linear-gradient(100deg,#111827,#0D1523);
  box-shadow:var(--shadow);
}
.strip>div{flex:1;min-width:130px;padding:15px 18px;border-right:1px solid var(--color-border);}
.strip>div:last-child{border-right:0;}
.strip .s-l{color:#B8C5D6;font-size:10.5px;font-weight:600;letter-spacing:.025em;}
.strip .s-v{margin-top:5px;color:#FFFFFF;font-size:21px;font-weight:800;letter-spacing:-.025em;}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0;}
.col{min-width:0;padding:11px;border:1px solid #334155;border-radius:10px;background:#0B1220;}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:2px 3px 7px;color:#F8FAFC;font-size:12px;font-weight:800;border-bottom:1px solid rgba(51,65,85,.7);}
.col-h .cnt{min-width:23px;padding:2px 7px;border:1px solid #4ADE80;border-radius:5px;background:rgba(22,163,74,.14);color:#BBF7D0;font-family:"JetBrains Mono",monospace;font-size:10px;text-align:center;}
.tk{margin-bottom:9px;padding:11px;border:1px solid #334155;border-radius:8px;background:#151E2E;box-shadow:0 8px 18px rgba(0,0,0,.16);transition:border-color .2s ease,transform .2s ease;}
.tk:hover{border-color:#4B607A;transform:translateY(-1px);}
.tk:last-child{margin-bottom:0;}
.tk .tk-t{margin-bottom:7px;color:#F8FAFC;font-size:12px;font-weight:700;line-height:1.45;}
.tk .tk-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#B8C5D6;font-size:10.5px;}
.tk .tk-b{display:flex;align-items:center;justify-content:space-between;margin-top:9px;}
.ava{display:grid;place-items:center;width:24px;height:24px;flex:none;border:1px solid #4ADE80;border-radius:7px;background:#153522;color:#D1FAE5;font-size:10px;font-weight:800;}

.six{display:flex;flex-direction:column;gap:9px;}
.six-r{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 11px;border:1px solid #334155;border-radius:8px;background:#0E1727;}
.six-r .rk{display:grid;place-items:center;width:25px;height:25px;flex:none;border:1px solid #4ADE80;border-radius:6px;background:rgba(22,163,74,.14);color:#BBF7D0;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:800;}
.six-r .rt{flex:1;min-width:0;}
.six-r .rt b{display:block;color:#F8FAFC;font-size:12px;}
.six-r .rt span{color:#AEBED2;font-size:10.5px;}
.six-r .rv{flex:none;color:#FFFFFF;font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:800;text-align:right;}
.hint{display:flex;align-items:flex-start;gap:7px;margin-top:13px;padding:10px 11px;border-left:3px solid var(--maintenance);border-radius:0 6px 6px 0;background:rgba(245,158,11,.08);color:#FDE68A;font-size:11px;line-height:1.55;}
.hint .material-symbols-outlined{flex:none;color:#FBBF24;font-size:16px;}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:860px){
  body{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;padding:10px 14px;gap:10px;border-right:0;border-bottom:1px solid #334155;}
  .brand{flex:none;padding:0 12px 0 0;border:0;border-right:1px solid #334155;}
  .brand .logo{width:36px;height:36px;border-radius:9px;}
  .brand div:last-child{display:none;}
  .sidebar .foot{display:none;}
  .nav{flex:1;flex-direction:row;gap:5px;margin:0;overflow-x:auto;scrollbar-width:thin;}
  .nav button{width:auto;min-height:40px;padding:8px 11px;}
  .nav button::before{inset:auto 8px -1px;width:auto;height:2px;}
  .nav button:hover{transform:none;}
  .main{padding:23px 16px 44px;}
}
@media(max-width:620px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .top{align-items:flex-start;margin-bottom:18px;}
  .top h1{font-size:21px;}
  .pill{width:100%;white-space:normal;}
  .card{padding:16px;}
  .kpi{min-height:142px;}
  .strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .strip>div{min-width:0;border-right:1px solid #334155;border-bottom:1px solid #334155;}
  .strip>div:nth-child(2n){border-right:0;}
  .strip>div:last-child{border-bottom:0;}
  .h260{height:240px;}
}
@media(max-width:420px){
  .sidebar{padding-inline:10px;}
  .nav button .lbl{display:inline;}
  .nav button{gap:7px;padding-inline:9px;font-size:11.5px;}
  .nav button .material-symbols-outlined{font-size:18px;}
  .strip{grid-template-columns:1fr;}
  .strip>div,.strip>div:nth-child(2n){border-right:0;}
  .tl-row .nm{width:78px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  .bar>i{animation:none!important;}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">speed</span></div>
    <div><b>OEE 綜效</b><span>設備綜合效率平台</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="foot">Jvision Demo · 純前端展示<br/>資料為模擬數據</div>
</aside>
<main class="main">
  <div id="view"></div>
</main>

<script>
var MODS=[
  {icon:"dashboard",name:"OEE 總覽"},
  {icon:"hourglass_bottom",name:"稼動率分析"},
  {icon:"bolt",name:"效能損失"},
  {icon:"verified",name:"良率追蹤"},
  {icon:"insights",name:"損失帕累托"},
  {icon:"task_alt",name:"改善追蹤"}

var A="#334155",A2="#64748b";

function head(icon,title,desc,pill){

function kpi(ic,bg,cl,lbl,val,unit,dir,dt,pct){
  return '<div class="kpi"><div class="k-top"><div class="k-ic" style="background:'+bg+';color:'+cl+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
  (dt?'<div class="k-dt '+(dir>0?"up":"down")+'"><span class="material-symbols-outlined">'+(dir>0?"trending_up":"trending_down")+'</span>'+dt+'</div>':'')+
  '</div><div class="k-lbl">'+lbl+'</div><div class="k-val">'+val+(unit?'<small> '+unit+'</small>':'')+'</div>'+
  (pct!=null?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'')+'</div>';
}

/* ===== render engine ===== */
var RENDER=[v0,v1,v2,v3,v4,v5];
var INIT=[v0c,v1c,v2c,v3c,v4c,v5c];
var container=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  INIT[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
