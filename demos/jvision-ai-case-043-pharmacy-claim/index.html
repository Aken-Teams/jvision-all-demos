<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>藥局調劑申報台｜Jvision 系統 Demo</title>
<meta name="description" content="處方受理、調劑核對、用藥指導到健保申報核刪的藥局調劑流程（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0891b2;
  --color-on-primary:#000;
  --color-secondary:#22d3ee;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfeff;
  --color-foreground:#164e63;
  --color-card:#fff;
  --color-card-foreground:#164e63;
  --color-muted:#e8f1f6;
  --color-muted-foreground:#475569;
  --color-border:#a5f3fc;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#0891b2;
  --blue:#0891b2;
  --ink:#164e63;
  --muted:#475569;
  --line:#a5f3fc;
  --amber:#9a5400;
  --red:#b91c1c;
  --green:#047857;
  --surface:#edfafd;
  --shadow:-6px -6px 16px rgba(255,255,255,.96),6px 6px 16px rgba(8,105,130,.14);
  --shadow-small:-3px -3px 9px rgba(255,255,255,.94),3px 3px 9px rgba(8,105,130,.13);
  --inset:inset 3px 3px 7px rgba(8,105,130,.11),inset -3px -3px 7px rgba(255,255,255,.95);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Atkinson Hyperlegible","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 86% 4%,rgba(34,211,238,.12),transparent 24rem),
    var(--color-background);
  color:var(--color-foreground);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button,a,select{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:18px 13px;
  background:rgba(236,254,255,.91);
  border-right:1px solid rgba(8,145,178,.18);
  backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:12px;padding:8px 9px 24px}
.logo{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid rgba(255,255,255,.7);
  border-radius:16px;
  color:#003944;
  background:#67e8f9;
  box-shadow:var(--shadow);
}
.brand b{display:block;color:var(--ink);font-size:16px}
.brand small{display:block;margin-top:1px;color:var(--muted);font-size:10px;letter-spacing:.11em}
.nav{display:flex;flex:1;flex-direction:column;gap:8px;overflow:auto;padding:5px}
.nav-title{padding:4px 11px 8px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.13em}
.nav button{
  width:100%;
  min-height:46px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid transparent;
  border-radius:15px;
  padding:11px 12px;
  text-align:left;
  color:#28596a;
  background:transparent;
  font-weight:700;
  transition:background .2s,box-shadow .2s,transform .15s,border-color .2s;
}
.nav button:hover{
  border-color:rgba(165,243,252,.7);
  background:rgba(255,255,255,.7);
  box-shadow:var(--shadow-small);
}
.nav button:active{transform:translateY(1px);box-shadow:var(--inset)}
.nav button.on{
  color:#003e4b;
  background:#b8f3fa;
  border-color:#67e8f9;
  box-shadow:var(--inset);
}
.nav button.on .material-symbols-outlined{color:#005b70}
.badge{
  margin-left:auto;
  min-width:25px;
  padding:1px 7px;
  border:1px solid #fecaca;
  border-radius:999px;
  color:#7f1d1d;
  background:#fee2e2;
  text-align:center;
  font-size:11px;
}
.profile{
  margin:13px 5px 2px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid rgba(165,243,252,.65);
  border-radius:15px;
  color:var(--muted);
  background:var(--color-muted);
  box-shadow:var(--inset);
  font-size:12px;
}
.avatar{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:12px;
  color:#00483e;
  background:#6ee7b7;
  font-weight:700;
  box-shadow:var(--shadow-small);
}
.profile b{display:block;color:var(--ink);font-size:13px}
.main{min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:15;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:12px 30px;
  border-bottom:1px solid rgba(8,145,178,.16);
  background:rgba(236,254,255,.87);
  backdrop-filter:blur(18px);
}
.top h1{margin:0;color:var(--ink);font-size:20px}
.sub{color:var(--muted);font-size:12px}
.top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}
.pill,.tag,.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  font-weight:700;
  white-space:nowrap;
}
.pill{
  padding:6px 11px;
  border:1px solid #67e8f9;
  color:#075267;
  background:#cffafe;
  font-size:12px;
}
.pill.warn{border-color:#f5cf73;color:#713d00;background:#fef3c7}
.body{max-width:1480px;margin:auto;padding:27px 30px 52px}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.view-head h2{margin:0;color:var(--ink);font-size:25px;line-height:1.2}
.view-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.hero{
  position:relative;
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:26px;
  align-items:center;
  margin-bottom:22px;
  padding:31px;
  overflow:hidden;
  border:1px solid rgba(8,145,178,.22);
  border-radius:22px;
  background:#f3fdff;
  box-shadow:var(--shadow);
}
.hero:before{
  content:"";
  position:absolute;
  top:-90px;
  right:-50px;
  width:290px;
  height:290px;
  border:44px solid rgba(8,145,178,.065);
  border-radius:50%;
}
.hero:after{
  content:"";
  position:absolute;
  right:200px;
  bottom:-120px;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(5,150,105,.055);
  box-shadow:var(--inset);
}
.hero>div{position:relative;z-index:1}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#075e70;
  font-size:12px;
  font-weight:700;
  letter-spacing:.07em;
}
.hero h3{
  max-width:680px;
  margin:10px 0 9px;
  color:#0e4b5c;
  font-size:clamp(27px,3vw,41px);
  line-height:1.12;
  letter-spacing:-.02em;
}
.hero p{max-width:650px;margin:0 0 20px;color:#365d6b}
.hero-actions,.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 17px;
  border:1px solid #047857;
  border-radius:13px;
  color:#002f2a;
  background:#34d399;
  font-weight:700;
  box-shadow:-3px -3px 8px rgba(255,255,255,.95),4px 4px 10px rgba(5,150,105,.22);
  transition:transform .15s,box-shadow .15s,background .2s;
}
.btn:hover{background:#6ee7b7}
.btn:active{transform:translateY(1px);box-shadow:var(--inset)}
.btn.secondary{border-color:var(--color-border);color:#075267;background:#fff}
.hero-flow{
  display:grid;
  gap:11px;
  padding:16px;
  border:1px solid rgba(165,243,252,.75);
  border-radius:18px;
  background:rgba(232,241,246,.7);
  box-shadow:var(--inset);
}
.flow-step{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border:1px solid rgba(165,243,252,.56);
  border-radius:12px;
  color:#244f5d;
  background:rgba(255,255,255,.82);
  box-shadow:var(--shadow-small);
  font-size:13px;
  font-weight:700;
}
.flow-step span:first-child{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  color:#075267;
  background:#a5f3fc;
  box-shadow:var(--inset);
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:21px}
.kpi,.card,.rstep,.expiry{
  border:1px solid rgba(8,145,178,.18);
  background:var(--color-card);
  box-shadow:var(--shadow);
}
.kpi{padding:18px 19px;border-radius:18px}
.kpi-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi-label .material-symbols-outlined{color:var(--blue)}
.kpi-value{
  margin-top:6px;
  color:var(--ink);
  font-size:29px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi-value small{margin-left:3px;color:var(--muted);font-size:13px}
.delta{color:#047857;font-size:12px;font-weight:700}
.grid{display:grid;gap:19px}
.grid>*{min-width:0}
.g-53{grid-template-columns:1.15fr .85fr}
.g-64{grid-template-columns:1.35fr 1fr}
.g-11{grid-template-columns:1fr 1fr}
.card{padding:20px 21px;border-radius:19px}
.card-title{display:flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--ink);font-size:16px}
.card-title .material-symbols-outlined{color:var(--blue)}
.grow{margin-left:auto;color:#076b80;font-size:12px}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.rstep{padding:13px;border-radius:14px;background:#f6feff;box-shadow:var(--inset)}
.rstep.on{border-color:#2dd4bf;background:#ccfbf1}
.rname{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:700}
.rcount{color:var(--ink);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.rstep.on .rname,.rstep.on .rcount{color:#065f46}
.queue{display:flex;align-items:center;gap:13px;padding:13px 2px;border-top:1px solid #d8f3f7}
.queue:first-of-type{border-top:0}
.qno{
  width:50px;
  min-height:43px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:12px;
  color:#075267;
  background:#cffafe;
  box-shadow:var(--inset);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-weight:700;
}
.queue.current .qno{color:#003b49;background:#67e8f9;box-shadow:0 0 0 4px #cffafe,var(--inset)}
.qinfo{flex:1;min-width:0}
.qinfo b{display:block;color:var(--ink);font-size:14px}
.qinfo small{color:var(--muted);font-size:12px}
.status,.tag{padding:3px 9px;border:1px solid transparent;font-size:11px}
.s-recv,.g-info{border-color:#a5f3fc;color:#164e63;background:#cffafe}
.s-disp,.g-wait{border-color:#f5cf73;color:#713d00;background:#fef3c7}
.s-check,.g-pur{border-color:#cfc6fc;color:#493681;background:#ede9fe}
.s-give,.g-ok{border-color:#86e8bf;color:#065f46;background:#d1fae5}
.s-done{border-color:#d8e0e9;color:#475569;background:#f1f5f9}
.g-rej{border-color:#fecaca;color:#991b1b;background:#fee2e2}
.scroll{overflow:auto;border-radius:0 0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  padding:12px;
  border-bottom:2px solid #78dce8;
  color:#285460;
  background:#ddf8fb;
  text-align:left;
  font-size:11px;
  white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid #d8f3f7;white-space:nowrap}
tbody tr:hover td{background:#f0fdff}
td:nth-last-child(2),th:nth-last-child(2){text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;color:#315662;font-size:12px;font-weight:700}
.field input,.field select{
  width:100%;
  min-height:43px;
  padding:10px 11px;
  border:1px solid #8fd4df;
  border-radius:12px;
  color:var(--ink);
  background:#f9feff;
  box-shadow:var(--inset);
}
.drug{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #d8f3f7}
.drug:first-of-type{border-top:0}
.check{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:10px;
  color:#065f46;
  background:#d1fae5;
  box-shadow:var(--inset);
}
.check.warn{color:#713d00;background:#fef3c7}
.drug b{color:var(--ink);font-size:13px}
.drug small{display:block;color:var(--muted);font-size:12px}
.amount{
  margin-left:auto;
  color:var(--ink);
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.alert{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  padding:12px 13px;
  border:1px solid #e7bd6f;
  border-left:5px solid var(--amber);
  border-radius:13px;
  background:#fffdfa;
}
.alert.danger{border-color:#fecaca;border-left-color:var(--red);background:#fffafa}
.alert.ok{border-color:#86e8bf;border-left-color:var(--green);background:#f6fffb}
.alert b{color:var(--ink);font-size:13px}
.alert small{display:block;color:var(--muted);font-size:12px}
.note{
  padding:15px;
  border:1px solid rgba(165,243,252,.5);
  border-radius:14px;
  color:#315662;
  background:var(--color-muted);
  box-shadow:var(--inset);
  font-size:13px;
}
.metric{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #d8f3f7;font-size:13px}
.metric:first-of-type{border-top:0}
.metric b{color:var(--ink)}
.metric span{color:#07667a;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.exp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.expiry{padding:14px;border-radius:15px}
.expiry-head{display:flex;align-items:start;gap:6px}
.expiry-head b{color:var(--ink);font-size:13px}
.expiry-head .tag{margin-left:auto}
.expiry small{color:var(--muted)}
.bar{
  height:10px;
  margin:9px 0 6px;
  overflow:hidden;
  border-radius:999px;
  background:#dceef2;
  box-shadow:var(--inset);
}
.bar span{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.chart{position:relative;height:250px}
.testimonials{margin-top:21px}
.quote{
  display:none;
  min-height:128px;
  padding:20px;
  border:1px solid rgba(165,243,252,.6);
  border-radius:17px;
  color:#315662;
  background:#f9feff;
  box-shadow:var(--inset);
}
.quote.on{display:block}
.quote blockquote{margin:0 0 11px;font-size:15px}
.quote b{color:var(--ink)}
.quote small{display:block;color:var(--muted)}
.carousel-controls{display:flex;align-items:center;gap:8px;margin-top:13px}
.icon-btn{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:1px solid var(--color-border);
  border-radius:13px;
  color:#075267;
  background:#fff;
  box-shadow:var(--shadow-small);
  transition:box-shadow .15s,transform .15s,background .2s;
}
.icon-btn:hover{background:#ecfeff}
.icon-btn:active{box-shadow:var(--inset);transform:translateY(1px)}
.slide-pos{color:var(--muted);font-size:12px}
.final-cta{
  position:sticky;
  bottom:14px;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-top:21px;
  padding:22px;
  border:1px solid #5eead4;
  border-radius:19px;
  color:#164e63;
  background:rgba(204,251,241,.94);
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}
.final-cta h3{margin:0 0 3px}
.final-cta p{margin:0;color:#315f60;font-size:13px}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
  .g-53,.g-64{grid-template-columns:1fr}
  .exp-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-bottom:8px}
  .brand{padding-bottom:10px}
  .nav{flex-direction:row}
  .nav-title,.profile{display:none}
  .nav button{width:auto;flex:none;white-space:nowrap}
  .top{padding:11px 16px}
  .body{padding:19px 15px 38px}
  .rail{grid-template-columns:repeat(2,1fr)}
  .g-11{grid-template-columns:1fr}
  .final-cta{position:static;align-items:flex-start;flex-direction:column}
}
@media(max-width:480px){
  .top{align-items:flex-start;flex-wrap:wrap}
  .top-actions{width:100%;margin-left:0}
  .view-head{align-items:flex-start;flex-direction:column}
  .view-head h2{font-size:22px}
  .hero{padding:21px}
  .kpis,.form,.exp-grid{grid-template-columns:1fr}
  .rail{grid-template-columns:1fr}
  .queue{align-items:flex-start}
  .status{margin-left:auto}
  .actions,.hero-actions{flex-direction:column}
  .btn{width:100%}
  .card{padding:17px}
  .chart{height:220px}
}
@media(prefers-reduced-motion:no-preference){
  .view-enter{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
  .view-enter>*{animation:item .4s cubic-bezier(.18,.89,.32,1.28) both}
  .view-enter>*:nth-child(2){animation-delay:.05s}
  .view-enter>*:nth-child(3){animation-delay:.1s}
  .view-enter>*:nth-child(4){animation-delay:.15s}
  @keyframes enter{from{opacity:0}to{opacity:1}}
  @keyframes item{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><span class="logo"><span class="material-symbols-outlined">local_pharmacy</span></span><div><b>藥局調劑申報台</b><small>PHARMACY CLAIM DESK</small></div></div>
  <nav class="nav" id="nav" aria-label="功能模組"></nav>
  <div class="profile"><span class="avatar">林</span><div><b>林藥師</b>主責藥師 · 第 1 調劑台</div></div>
</aside>
<main class="main">
  <header class="top"><div><h1 id="title">調劑總覽</h1><div class="sub" id="subtitle"></div></div><div class="top-actions"><span class="pill"><span class="material-symbols-outlined">receipt_long</span>候調 7 張</span><span class="pill warn"><span class="material-symbols-outlined">pending_actions</span>待申報 12</span></div></header>
  <div class="body"><div id="view" aria-live="polite"></div></div>
</main>
</div>
<script>
const MODS=[["dashboard","調劑總覽",""],["assignment_turned_in","處方調劑","7"],["psychiatry","用藥指導",""],["receipt_long","健保申報","12"],["event_busy","藥品效期","3"],["monitoring","申報報表",""]];

()=>`<div class="grid g-64"><section class="card">${heading("psychiatry","交互作用與用藥檢核 · 王美玲")}${INTER.map(a=>`<div class="alert ${a[0]}">${icon(a[1])}<div><b>${a[2]}</b><small>${a[3]}</small></div></div>`).join("")}${heading("menu_book","用藥指導單")}${GUIDE.map(g=>`<div class="drug"><span class="check">${icon("medication_liquid")}</span><div><b>${g[0]}</b><small>${g[1]}</small></div></div>`).join("")}<div class="actions"><button class="btn">${icon("print")}列印用藥指導單</button><button class="btn secondary">${icon("task_alt")}完成衛教發藥</button></div></section><section class="card">${heading("donut_large","本月用藥指導分類")}${chart("c_guide")}<div class="note">系統自動比對 <b>病患用藥史、過敏紀錄與外院處方</b>，即時標示交互作用、重複用藥與劑量異常，藥師確認後才可發藥。<br/><br/>本週已完成衛教 <b>142</b> 人次，攔阻潛在交互作用 <b>9</b> 件。</div></section></div>`,

()=>`<div class="grid g-11" style="margin-bottom:19px"><section class="card">${heading("bar_chart","近半年調劑量統計")}${chart("c_vol")}</section><section class="card">${heading("show_chart","申報點數與核刪率")}${chart("c_pts")}</section></div><div class="grid g-11"><section class="card">${heading("leaderboard","調劑量前五藥品")}${[["Amlodipine 5mg",92],["Metformin 500mg",81],["Atorvastatin 10mg",74],["Omeprazole 20mg",63],["Loratadine 10mg",51]].map(x=>`<div><div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div><div class="bar"><span style="width:${x[1]}%;background:#0891b2"></span></div></div>`).join("")}</section><section class="card">${heading("summarize","月結申報彙總")}${metrics([["總調劑張數","1,286 張"],["慢箋佔比","58%"],["申報總點數","482,530 點"],["平均核刪率","0.8%"],["請款金額","NT$ 482,530"]])}<div class="actions"><button class="btn">${icon("download")}匯出月結報表</button></div></section></div>`
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle");
nav.innerHTML=`<div class="nav-title">功能模組</div>`+MODS.map((m,i)=>`<button data-i="${i}" aria-current="${i===0?"page":"false"}">${icon(m[0])}${m[1]}${m[2]?`<span class="badge">${m[2]}</span>`:""}</button>`).join("");
let charts={},slide=0,paused=false,slideTimer;
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}
function mk(id,type,data,options={}){
  let el=document.getElementById(id);
  if(el)charts[id]=new Chart(el,{type,data,options:{responsive:true,maintainAspectRatio:false,...options}});
}
const colors={cyan:"#0891b2",cyan2:"#22d3ee",green:"#059669",amber:"#9a5400",red:"#b91c1c",grid:"#d8f3f7"};
function draw(i){
  const legend={display:true,position:"bottom",labels:{boxWidth:12,color:"#315662",font:{family:"Atkinson Hyperlegible"}}};
  const scales={x:{grid:{display:false},ticks:{color:"#475569"}},y:{beginAtZero:true,grid:{color:colors.grid},ticks:{color:"#475569"}}};
  if(i===0)mk("c_disp","bar",{labels:["一","二","三","四","五","六","日"],datasets:[{label:"調劑張數",data:[78,92,85,101,96,64,40],backgroundColor:colors.cyan,borderRadius:7}]},{plugins:{legend:{display:false}},scales});
  if(i===2)mk("c_guide","doughnut",{labels:["慢性病","抗生素","止痛","腸胃","其他"],datasets:[{data:[42,18,15,14,11],backgroundColor:[colors.cyan,colors.cyan2,colors.amber,"#0e7490","#99f6e4"],borderWidth:0}]},{cutout:"62%",plugins:{legend}});
  if(i===3)mk("c_claim","line",{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"申報件數",data:[1180,1210,1245,1260,1272,1286],borderColor:colors.cyan,backgroundColor:"rgba(8,145,178,.12)",fill:true,tension:.35,yAxisID:"y"},{label:"核刪率%",data:[3.1,2.4,1.8,1.3,1,.8],borderColor:colors.red,tension:.35,yAxisID:"y1"}]},{plugins:{legend},scales:{x:scales.x,y:scales.y,y1:{position:"right",min:0,max:4,grid:{display:false}}}});
  if(i===4)mk("c_exp","pie",{labels:["足量","近效","即期"],datasets:[{data:[68,22,10],backgroundColor:[colors.green,colors.amber,colors.red],borderWidth:0}]},{plugins:{legend}});
  if(i===5){
    mk("c_vol","bar",{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"慢箋",data:[640,668,702,728,740,746],backgroundColor:colors.cyan,borderRadius:5,stack:"s"},{label:"一般",data:[520,530,520,522,520,540],backgroundColor:colors.cyan2,borderRadius:5,stack:"s"}]},{plugins:{legend},scales:{x:{...scales.x,stacked:true},y:{...scales.y,stacked:true}}});
    mk("c_pts","line",{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"申報點數(千)",data:[441,449,461,470,478,482],borderColor:colors.cyan,backgroundColor:"rgba(8,145,178,.12)",fill:true,tension:.35,yAxisID:"y"},{label:"核刪率%",data:[3.1,2.4,1.8,1.3,1,.8],borderColor:colors.amber,tension:.35,yAxisID:"y1"}]},{plugins:{legend},scales:{x:scales.x,y:scales.y,y1:{position:"right",min:0,max:4,grid:{display:false}}}});
  }
}
function updateSlide(n){
  const slides=[...document.querySelectorAll(".quote")];
  if(!slides.length)return;
  slide=(n+slides.length)%slides.length;
  slides.forEach((s,i)=>{
    s.classList.toggle("on",i===slide);
    s.setAttribute("aria-hidden",i===slide?"false":"true");
  });
  document.getElementById("slidePos").textContent=`第 ${slide+1} 則，共 ${slides.length} 則`;
}
function scheduleSlide(){
  clearTimeout(slideTimer);
  if(!paused&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    slideTimer=setTimeout(()=>{
      updateSlide(slide+1);
      scheduleSlide();
    },5500);
  }
}
function setupCarousel(){
  let box=document.querySelector(".testimonials");
  if(!box)return;
  updateSlide(slide);
  document.getElementById("prev").onclick=()=>{
    updateSlide(slide-1);
    scheduleSlide();
  };
  document.getElementById("next").onclick=()=>{
    updateSlide(slide+1);
    scheduleSlide();
  };
  document.getElementById("pause").onclick=e=>{
    paused=!paused;
    e.currentTarget.setAttribute("aria-pressed",paused);
    e.currentTarget.setAttribute("aria-label",paused?"繼續自動播放":"暫停自動播放");
    e.currentTarget.innerHTML=icon(paused?"play_arrow":"pause");
    scheduleSlide();
  };
  box.addEventListener("mouseenter",()=>clearTimeout(slideTimer));
  box.addEventListener("mouseleave",scheduleSlide);
  box.addEventListener("focusin",()=>clearTimeout(slideTimer));
  box.addEventListener("focusout",scheduleSlide);
  box.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"){
      e.preventDefault();
      updateSlide(slide-1);
    }
    if(e.key==="ArrowRight"){
      e.preventDefault();
      updateSlide(slide+1);
    }
  });
  scheduleSlide();
}
function show(i,hash=false){
  i=Math.max(0,Math.min(5,+i||0));
  clearTimeout(slideTimer);
  destroyCharts();
  nav.querySelectorAll("[data-i]").forEach(b=>{
    let on=+b.dataset.i===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  title.textContent=MODS[i][1];
  subtitle.textContent="康和藥局 · "+SUBS[i];
  view.innerHTML=`<div class="view-enter"><div class="view-head"><div><h2>${MODS[i][1]}</h2><p>${SUBS[i]}</p></div></div>${SCREENS[i]()}</div>`;
  draw(i);
  if(i===0)setupCarousel();
  if(hash&&location.hash!==`#v${i}`)location.hash=`v${i}`;
}
nav.addEventListener("click",e=>{
  let b=e.target.closest("[data-i]");
  if(b)show(b.dataset.i,true);
});
view.addEventListener("click",e=>{
  let b=e.target.closest("[data-go]");
  if(b)show(b.dataset.go,true);
});
function fromHash(){
  let m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?m[1]:0);
}
