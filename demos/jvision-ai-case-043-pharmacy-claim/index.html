<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>藥局調劑申報台｜Jvision 系統 Demo</title>
<meta name="description" content="處方受理、調劑核對、用藥指導到健保申報核刪的藥局調劑流程（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--acc:#16a34a;--acc2:#4ade80;--acc-d:#15803d;--ink:#0b2417;--body:#39554a;--mut:#7a9488;--line:#dcece3;--bg:#eff7f2;--card:#fff;--amber:#d97706;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand .lg{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-content:center;flex:none;box-shadow:0 8px 18px rgba(22,163,74,.32)}
.brand b{color:var(--ink);font-size:15px;display:block;font-family:"Noto Sans TC"}
.brand small{color:var(--mut);font-size:10.5px;letter-spacing:.12em}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav .t{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:10px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:var(--body);font:inherit;font-size:13.5px;font-weight:600;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:21px;color:#9db6ab}
.nav button:hover{background:var(--bg)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff}
.nav button.on .material-symbols-outlined{color:#fff}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:#fee2e2;color:#dc2626;border-radius:999px;padding:1px 8px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
.side-f{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.doc{display:flex;align-items:center;gap:10px}
.doc .av{width:34px;height:34px;border-radius:50%;background:#d6f4e2;color:var(--acc-d);font-weight:800;display:grid;place-content:center}
/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.top h1{margin:0;font-size:19px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.top .sub{font-size:12px;color:var(--mut)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--acc-d);background:#d6f4e2;border-radius:999px;padding:6px 12px}
.pill.amber{background:#fef3c7;color:#92400e}
.body{padding:22px 26px 44px}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.vh p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--acc-d);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--acc)}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);margin-top:7px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:12px;font-weight:800;color:var(--acc-d);margin-top:4px}
.kpi .d.bad{color:var(--red)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g-53{grid-template-columns:1.15fr .85fr}
.g-64{grid-template-columns:1.35fr 1fr}
.g-11{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.card>h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Noto Sans TC"}
.card>h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card>h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc)}
/* dispensing queue rail */
.rail{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rstep{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;background:var(--bg)}
.rstep .rn{font-size:11px;font-weight:800;color:var(--mut);display:flex;align-items:center;gap:6px}
.rstep .rc{font-size:24px;font-weight:900;color:var(--ink);margin-top:4px;font-family:Inter}
.rstep .rl{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.rstep.on{background:linear-gradient(135deg,#dcfce7,#f0fdf4);border-color:var(--acc2)}
.rstep.on .rn,.rstep.on .rc{color:var(--acc-d)}
/* queue rows */
.q{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.q-no{width:44px;height:44px;border-radius:12px;background:#d6f4e2;color:var(--acc-d);font-weight:900;font-size:14px;display:grid;place-content:center;flex:none;line-height:1.1;text-align:center}
.q.cur .q-no{background:var(--acc);color:#fff;box-shadow:0 0 0 4px #d6f4e2}
.q .info{flex:1;min-width:0}.q .info b{color:var(--ink);font-size:14px}.q .info small{display:block;color:var(--mut);font-size:12px}
.q .st{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.s-recv{background:#dbeafe;color:#1e40af}.s-disp{background:#fef3c7;color:#92400e}.s-check{background:#ede9fe;color:#6d28d9}.s-give{background:#d1fae5;color:#065f46}.s-done{background:#f1f5f9;color:#64748b}
/* table */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl tr:hover td{background:var(--bg)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.g-ok{background:#d1fae5;color:#065f46}.g-wait{background:#fef3c7;color:#92400e}.g-rej{background:#fee2e2;color:#991b1b}.g-info{background:#dbeafe;color:#1e40af}.g-pur{background:#ede9fe;color:#6d28d9}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--body)}.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;color:var(--ink);outline:none;font-family:"Noto Sans TC"}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #d6f4e2}
/* drug rows */
.drow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.drow:first-of-type{border-top:0}
.drow .ck{width:26px;height:26px;border-radius:8px;background:#d6f4e2;color:var(--acc-d);display:grid;place-content:center;flex:none}
.drow .ck .material-symbols-outlined{font-size:17px}
.drow b{color:var(--ink);font-size:13.5px}.drow small{display:block;color:var(--mut);font-size:12px}
.drow .amt{margin-left:auto;font-weight:800;color:var(--ink);font-family:Inter;white-space:nowrap}
/* alert / interaction */
.alert{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:11px;padding:11px 14px;display:flex;gap:11px;align-items:flex-start;margin-bottom:10px}
.alert.red{border-left-color:var(--red)}.alert.ok{border-left-color:var(--acc)}
.alert .material-symbols-outlined{font-size:20px;color:var(--amber);flex:none;margin-top:1px}
.alert.red .material-symbols-outlined{color:var(--red)}.alert.ok .material-symbols-outlined{color:var(--acc)}
.alert b{color:var(--ink);font-size:13px}.alert small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
/* expiry bars */
.exp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.exc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.exc b{color:var(--ink);font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:9px 0 7px}
.bar span{display:block;height:100%}
.exc small{font-size:11.5px;color:var(--mut)}
.lowt{font-size:10px;font-weight:800;color:var(--red);background:#fee2e2;border-radius:6px;padding:2px 7px;margin-left:auto}
.warnt{font-size:10px;font-weight:800;color:var(--amber);background:#fef3c7;border-radius:6px;padding:2px 7px;margin-left:auto}
.chart-wrap{position:relative;height:270px;width:100%}
.chart-wrap.sm{height:230px}
.note{background:var(--bg);border-radius:12px;padding:14px;font-size:13px;color:var(--body);line-height:1.7}
.miniq{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.miniq:first-of-type{border-top:0}
.miniq b{color:var(--ink);font-weight:700}.miniq span{color:var(--acc-d);font-weight:800;font-family:Inter}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;flex:none}.nav .t{display:none}.side-f{display:none}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g-53,.g-64,.g-11{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .exp{grid-template-columns:1fr}
  .rail{flex-direction:column}.rstep{min-width:0}
}
@media(max-width:420px){
  .top{flex-wrap:wrap;padding:12px 16px;gap:8px}.top h1{font-size:17px}.body{padding:16px 14px 30px}
  .kpis{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">local_pharmacy</span></span><div><b>藥局調劑申報台</b><small>PHARMACY CLAIM DESK</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><div class="doc"><span class="av">林</span><div><b style="color:var(--ink)">林藥師</b><div>主責藥師 · 第 1 調劑台</div></div></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">調劑總覽</h1><div class="sub" id="vsub">康和藥局 · 2026-08-13 上午班</div></div>
      <div class="r">
        <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">receipt_long</span>候調 7 張</span>
        <span class="pill amber">待申報 12</span>
      </div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MODS=[["dashboard","調劑總覽",""],["assignment_turned_in","處方調劑","7"],["psychiatry","用藥指導",""],["receipt_long","健保申報","12"],["event_busy","藥品效期","3"],["monitoring","申報報表",""]];
const NAMES=["調劑總覽","處方調劑","用藥指導","健保申報","藥品效期","申報報表"];
const SUBS=["處方受理→調劑核對→發藥全流程戰情","處方受理、揀藥核對與雙簽發藥","交互作用檢核與用藥衛教","健保申報媒體檔上傳與核刪追蹤","藥品批號效期與安全庫存","調劑量與申報點數統計"];

const KPI=[["candidate","候調處方","7","張","+2 尖峰"],["timer","平均調劑","6.4","分","−41%"],["fact_check","雙核通過率","99.2","%","+0.6%"],["gavel","申報核刪率","0.8","%","−82%"]];
/* dispensing queue: 處方→調劑→核對→發藥 */
const RAIL=[["receipt_long","處方受理",3,"pending"],["medication","調劑中",2,"on"],["fact_check","核對中",1,"pending"],["local_pharmacy","待發藥",1,"pending"]];
const QUEUE=[
 ["A-208","王美玲","慢箋 · 高血壓 3 項","disp","調劑中","cur"],
 ["A-209","陳建宏","急性 · 感冒 4 項","recv","處方受理",""],
 ["A-210","林淑芬","慢箋 · 糖尿病 5 項","recv","處方受理",""],
 ["A-207","黃志偉","急性 · 腸胃 2 項","check","核對中",""],
 ["A-206","吳雅婷","慢箋 · 高血脂 3 項","give","待發藥",""],
 ["A-211","張家豪","急性 · 皮膚 2 項","recv","處方受理",""],
 ["A-205","劉冠廷","慢箋 · 氣喘 4 項","done","已發藥",""],
 ["A-204","蔡宜臻","急性 · 止痛 1 項","done","已發藥",""]];
/* NHI claim / rejection table */
const CLAIMS=[
 ["RX-8801","王美玲","慢性病連續處方","342","已上傳","ok"],
 ["RX-8802","陳建宏","一般調劑","118","待申報","wait"],
 ["RX-8803","林淑芬","慢性病連續處方","505","已上傳","ok"],
 ["RX-8804","黃志偉","一般調劑","96","核刪補正","rej"],
 ["RX-8805","吳雅婷","慢性病連續處方","287","待申報","wait"],
 ["RX-8806","張家豪","一般調劑","134","已上傳","ok"],
 ["RX-8807","劉冠廷","慢性病連續處方","418","核刪補正","rej"],
 ["RX-8808","蔡宜臻","一般調劑","72","待申報","wait"]];
const STAT={ok:["g-ok","已上傳"],wait:["g-wait","待申報"],rej:["g-rej","核刪補正"]};
/* rx line items for 處方調劑 */
const RXITEMS=[
 ["Amlodipine 5mg","降血壓 · 台廠 A 批","28 顆","check"],
 ["Atorvastatin 10mg","降血脂 · B 批","28 顆","check"],
 ["Metformin 500mg","降血糖 · C 批","56 顆","check"],
 ["Aspirin 100mg","抗血小板 · D 批","28 顆","warn"]];
/* interaction / guidance alerts */
const INTER=[
 ["red","warning","Aspirin × Warfarin 交互作用","併用增加出血風險，建議醫師評估劑量或改用替代藥。"],
 ["","report","Metformin 重複用藥提醒","與外院處方 Glucophage 同成分，已提示藥師確認。"],
 ["ok","verified","過敏史比對通過","病患對 Penicillin 過敏，本次處方無相關成分。"]];
const GUIDE=[
 ["Amlodipine 5mg","每日一次，飯後服用，可能出現下肢水腫。"],
 ["Atorvastatin 10mg","睡前服用，避免與葡萄柚汁併服。"],
 ["Metformin 500mg","隨餐服用以減少腸胃不適，注意低血糖症狀。"]];
/* expiry / batch */
const EXP=[
 ["Amoxicillin 250mg","LOT A2409",120,60,4,"low"],
 ["Loratadine 10mg","LOT B2411",340,150,9,"ok"],
 ["Omeprazole 20mg","LOT C2408",64,100,2,"warn"],
 ["Amlodipine 5mg","LOT D2412",520,200,11,"ok"],
 ["Metformin 500mg","LOT E2410",180,250,3,"warn"],
 ["Insulin 筆針","LOT F2407",28,40,1,"low"]];
const EXPTAG={low:["lowt","即期"],warn:["warnt","近效"],ok:["","足量"]};

const av=n=>`<span style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6ee7b7,#16a34a);color:#fff;display:grid;place-content:center;font-size:18px;font-weight:800;flex:none">${n.slice(-1)}</span>`;
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l"><span class="material-symbols-outlined">${k[0]}</span>${k[1]}</div><div class="v">${k[2]}<small>${k[3]}</small></div><div class="d">${k[4]}</div></div>`).join("")}</div>`;
const railRow=()=>`<div class="rail">${RAIL.map(r=>`<div class="rstep ${r[3]==="on"?"on":""}"><div class="rn"><span class="material-symbols-outlined" style="font-size:16px">${r[0]}</span>${r[1]}</div><div class="rc">${r[2]}</div><div class="rl">張處方</div></div>`).join("")}</div>`;
const claimTable=()=>`<div class="scroll"><table class="tbl"><thead><tr><th>調劑單號</th><th>病患</th><th>案別</th><th>申報點數</th><th>狀態</th></tr></thead><tbody>${CLAIMS.map(c=>{const s=STAT[c[5]];return `<tr><td style="font-weight:800;color:var(--ink)">${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td style="font-weight:700;font-family:Inter">${c[3]}</td><td><span class="tag ${s[0]}">${s[1]}</span></td></tr>`;}).join("")}</tbody></table></div>`;

const SCREENS={
 0:()=>kpiRow()+`
  <div class="card" style="margin-bottom:18px"><h3><span class="material-symbols-outlined">conveyor_belt</span>調劑動線佇列（處方 → 調劑 → 核對 → 發藥）</h3>${railRow()}</div>
  <div class="grid g-53">
   <div class="card"><h3><span class="material-symbols-outlined">groups</span>調劑佇列<span class="grow">叫號 ›</span></h3>${QUEUE.map(q=>`<div class="q ${q[5]}"><span class="q-no">${q[0]}</span><div class="info"><b>${q[1]}</b><small>${q[2]}</small></div><span class="st s-${q[3]}">${q[4]}</span></div>`).join("")}</div>
   <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>本週調劑量趨勢</h3><div class="chart-wrap sm"><canvas id="c_disp"></canvas></div>
    <h3 style="margin-top:18px"><span class="material-symbols-outlined">receipt_long</span>當日申報結案</h3>
    ${[["已完成調劑","86 張"],["已上傳申報","74 張"],["待申報","12 張"],["核刪補正","2 張"]].map(m=>`<div class="miniq"><b>${m[0]}</b><span>${m[1]}</span></div>`).join("")}
   </div>
  </div>`,
 1:()=>`<div class="grid g-64">
   <div class="card"><h3><span class="material-symbols-outlined">assignment_turned_in</span>處方受理 · 王美玲（A-208）</h3>
    <div class="form">
     <label class="fld"><span>病歷號 / 健保卡</span><input value="A00218 · 已讀取" /></label>
     <label class="fld"><span>開立院所</span><input value="康和聯合診所 · 陳醫師" /></label>
     <label class="fld"><span>案別</span><select><option>慢性病連續處方（第 2 次）</option><option>一般調劑</option></select></label>
     <label class="fld"><span>給藥日數</span><input value="28 日" /></label>
    </div>

/* Chart.js — init only when screen shows; destroy against double-init */
let CH={};
function destroyAll(){Object.values(CH).forEach(c=>{try{c.destroy();}catch(e){}});CH={};}
const GREEN="#16a34a",GREEN2="#4ade80",AMBER="#d97706",RED="#dc2626",BLUE="#2563eb",PURP="#7c3aed";
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;CH[id]=new Chart(el,cfg);}
function draw(i){
 destroyAll();
 const gc={plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false};
 if(i===0){mk("c_disp",{type:"bar",data:{labels:["一","二","三","四","五","六","日"],datasets:[{label:"調劑張數",data:[78,92,85,101,96,64,40],backgroundColor:GREEN,borderRadius:6}]},options:{...gc,scales:{y:{beginAtZero:true,grid:{color:"#eef4f0"}},x:{grid:{display:false}}}}});}
 if(i===2){mk("c_guide",{type:"doughnut",data:{labels:["慢性病","抗生素","止痛","腸胃","其他"],datasets:[{data:[42,18,15,14,11],backgroundColor:[GREEN,GREEN2,AMBER,BLUE,"#a7f3d0"],borderWidth:0}]},options:{...gc,cutout:"62%",plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});}
 if(i===3){mk("c_claim",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"申報件數",data:[1180,1210,1245,1260,1272,1286],borderColor:GREEN,backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35,yAxisID:"y"},{label:"核刪率%",data:[3.1,2.4,1.8,1.3,1.0,0.8],borderColor:RED,backgroundColor:"transparent",tension:.35,yAxisID:"y1"}]},options:{...gc,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{position:"left",grid:{color:"#eef4f0"}},y1:{position:"right",grid:{display:false},min:0,max:4},x:{grid:{display:false}}}}});}
 if(i===4){mk("c_exp",{type:"pie",data:{labels:["足量","近效","即期"],datasets:[{data:[68,22,10],backgroundColor:[GREEN,AMBER,RED],borderWidth:0}]},options:{...gc,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});}
 if(i===5){
  mk("c_vol",{type:"bar",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"慢箋",data:[640,668,702,728,740,746],backgroundColor:GREEN,borderRadius:5,stack:"s"},{label:"一般",data:[520,530,520,522,520,540],backgroundColor:GREEN2,borderRadius:5,stack:"s"}]},options:{...gc,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{stacked:true,grid:{color:"#eef4f0"}},x:{stacked:true,grid:{display:false}}}}});
  mk("c_pts",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"申報點數(千)",data:[441,449,461,470,478,482],borderColor:GREEN,backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35,yAxisID:"y"},{label:"核刪率%",data:[3.1,2.4,1.8,1.3,1.0,0.8],borderColor:AMBER,tension:.35,yAxisID:"y1"}]},options:{...gc,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{position:"left",grid:{color:"#eef4f0"}},y1:{position:"right",grid:{display:false},min:0,max:4},x:{grid:{display:false}}}}});
 }
}

const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vsub=document.getElementById("vsub");
nav.innerHTML=`<div class="t">功能模組</div>`+MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}${m[2]?`<span class="badge">${m[2]}</span>`:""}</button>`).join("");
function show(i){
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
 vt.textContent=NAMES[i];vsub.textContent="康和藥局 · "+SUBS[i];
 view.innerHTML=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${SUBS[i]}</p></div></div>`+SCREENS[i]();
 draw(i);
}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
