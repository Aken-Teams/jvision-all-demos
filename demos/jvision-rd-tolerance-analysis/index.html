<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品尺寸公差風險管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow:7px 7px 0 #14532D;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(21,128,61,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.08) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font:400 14px/1.55 "Exo",sans-serif;
  -webkit-font-smoothing:antialiased
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4,.brand-name,.nav button{font-family:"Exo",sans-serif}
:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}
.sidebar{
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  background:#0D2918;
  color:#fff;
  border-right:4px solid var(--ink)
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:105px;
  padding:20px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  border-bottom:4px solid var(--ink)
}
.brand-logo{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink)
}
.brand-logo .icon{width:27px;height:27px}
.brand-name{display:block;font-size:17px;font-weight:800;line-height:1.2}
.brand-sub{display:block;margin-top:5px;font:500 10px/1.2 "Roboto Mono",monospace;letter-spacing:.08em}
.nav{display:grid;gap:0}
.nav button{
  width:100%;
  min-height:64px;
  display:grid;
  grid-template-columns:24px minmax(0,1fr) auto;
  align-items:center;
  gap:11px;
  padding:13px 16px;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.22);
  background:transparent;
  color:#DCFCE7;
  text-align:left;
  font-weight:700
}
.nav button:hover{background:#164E2A;color:#fff}
.nav button.on{
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:inset 7px 0 0 #fff
}
.nav .idx{font:700 11px "Roboto Mono",monospace}
.side-foot{
  margin-top:auto;
  padding:18px 20px;
  border-top:4px solid var(--color-secondary);
  color:#DCFCE7;
  font:400 11px/1.8 "Roboto Mono",monospace
}
.side-foot b{color:#fff}
.main{min-width:0;padding:0 32px 64px}
.progress{
  position:fixed;
  z-index:20;
  top:0;
  left:270px;
  width:calc(100% - 270px);
  height:6px;
  background:#DCFCE7;
  border-bottom:1px solid var(--ink)
}
.progress span{display:block;width:25%;height:100%;background:var(--color-accent)}
.topbar{
  min-height:142px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin:0 -32px 26px;
  padding:34px 32px 20px;
  background:#fff;
  border-bottom:4px solid var(--ink)
}
.eyebrow{
  margin:0 0 8px;
  color:var(--color-primary);
  font:700 11px/1.2 "Roboto Mono",monospace;
  letter-spacing:.15em;
  text-transform:uppercase
}
.topbar h1{margin:0;font-size:clamp(25px,3vw,44px);line-height:1;font-weight:800;letter-spacing:-.04em}
.topbar .sub{margin-top:9px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  background:#fff;
  border:2px solid var(--ink);
  color:var(--ink);
  font:600 11px "Roboto Mono",monospace
}
.status-mark{
  width:15px;
  height:15px;
  display:grid;
  place-items:center;
  background:var(--ok);
  color:#fff;
  font-size:10px;
  font-weight:800
}
.avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  background:var(--color-primary);
  color:#fff;
  border:2px solid var(--ink);
  font-weight:800
}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr)}
.grid>*{min-width:0}
.story-marker{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 12px;
  font:700 11px "Roboto Mono",monospace;
  letter-spacing:.12em;
  text-transform:uppercase
}
.story-marker:after{content:"";height:3px;flex:1;background:var(--ink)}
.tile,.card{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:3px solid var(--ink)
}
.tile{
  min-height:194px;
  display:flex;
  flex-direction:column;
  padding:17px;
  position:relative;
  box-shadow:var(--shadow)
}
.tile:nth-child(even){transform:translateY(9px)}
.tile .ti{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  margin-bottom:22px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  border:2px solid var(--ink)
}
.tile b{font-size:13px}
.tile .tv{
  margin-top:auto;
  font:700 clamp(22px,2.5vw,31px)/1.1 "Roboto Mono",monospace;
  letter-spacing:-.05em
}
.tile p{margin:8px 0 0;color:var(--muted);font-size:12px}
.card{padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin:-18px -18px 16px;
  padding:14px 16px;
  background:var(--color-muted);
  border-bottom:3px solid var(--ink)
}
.pad0 .card-h{margin:0}
.card-h h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  font-size:15px;
  font-weight:800
}
.card-h .hint{
  color:var(--muted);
  font:500 10px/1.4 "Roboto Mono",monospace;
  text-align:right
}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  padding:12px 13px;
  background:#0D2918;
  color:#fff;
  border-right:1px solid #4ADE80;
  border-bottom:3px solid var(--ink);
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap
}
th:last-child{border-right:0}
td{
  padding:12px 13px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fff;
  white-space:nowrap
}
td:last-child{border-right:0}
tbody tr:nth-child(even) td{background:#F7FFF9}
tbody tr:hover td{background:#DCFCE7}
.mono,.num{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.num{text-align:right}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:25px;
  padding:3px 8px;
  border:2px solid currentColor;
  font-size:10.5px;
  font-weight:800;
  white-space:nowrap
}
.tag:before{content:"";width:7px;height:7px;background:currentColor}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#1E40AF;background:#DBEAFE}
.t-acc,.t-pink{color:#14532D;background:#BBF7D0}
.chart{min-height:230px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Roboto Mono",monospace!important}
.chapter-cta{
  margin-top:18px;
  display:flex;
  justify-content:flex-end
}
.chapter-cta button{
  min-height:44px;
  padding:9px 16px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  font-weight:800
}
.chapter-cta button:hover{background:#F59E0B;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.reveal{opacity:0;transform:translateY(16px) scale(.98)}
.reveal.in{animation:reveal .42s cubic-bezier(.2,.8,.2,1.25) forwards}
@keyframes reveal{to{opacity:1;transform:none}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{min-height:78px;padding:13px 16px}
  .brand-logo{width:42px;height:42px}
  .nav{grid-template-columns:repeat(4,minmax(0,1fr));overflow:auto}
  .nav button{min-width:135px;grid-template-columns:20px minmax(0,1fr);padding:10px}
  .nav .idx{display:none}
  .side-foot{display:none}
  .progress{left:0;width:100%}
  .main{padding:0 18px 45px}
  .topbar{margin:0 -18px 24px;padding:28px 18px 18px;min-height:125px}
}
@media(max-width:650px){
  .g2,.g4{grid-template-columns:1fr}
  .tile:nth-child(even){transform:none}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
  .chip:nth-child(2){display:none}
  .card{padding:13px}
  .card-h{margin:-13px -13px 14px}
}
@media(max-width:400px){
  .nav button{min-width:112px}
  .nav .txt{font-size:11px}
  .main{padding-left:12px;padding-right:12px}
  .topbar{margin-left:-12px;margin-right:-12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
  .reveal{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 4v16M20 4v16M4 8h16M4 16h16M8 6v4M12 6v4M16 6v4M8 14v4M12 14v4M16 14v4"/></svg>
      </div>
      <div>
        <span class="brand-name">產品尺寸公差<br>風險管理</span>
        <span class="brand-sub">TOLERANCE / RISK</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">NPD-2026-08 機構<br>尺寸鏈 18 條<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>

  <main class="main">
    <div class="progress" aria-hidden="true"><span id="route-progress"></span></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">Research development / dimensional control</p>
        <h1 id="th-title"></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="status-mark" aria-hidden="true">✓</span>系統連線正常</span>
        <span class="chip">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 2v4M18 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"/></svg>
          2026/08/20
        </span>
        <div class="avatar" aria-label="使用者：資">資</div>
      </div>
    </header>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>

<script>
var charts=[];
var ICONS={
 dashboard:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v10h-6zM4 14h6v6H4zM14 18h6v2h-6z"/></svg>',
 straighten:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 7h18v10H3zM7 7v4M11 7v2M15 7v4M19 7v2"/></svg>',
 analytics:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 precision_manufacturing:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 15 4-4 3 3 6-7 3 3M3 20h18M4 4v3M20 4v3"/></svg>',
 layers:'<svg class="icon" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>',
 donut_large:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9h9V3Z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15V3.5Z"/></svg>',
 compare_arrows:'<svg class="icon" viewBox="0 0 24 24"><path d="m7 7-4 4 4 4M3 11h14M17 3l4 4-4 4M21 7H7"/></svg>',
 warning:'<svg class="icon" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 17h.01"/></svg>',
 check_circle:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
 savings:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 9c1-4 5-6 9-4 3 1 5 4 5 7 0 5-4 8-9 8H6v-4H3v-5h3"/><path d="M14 8h.01M8 20v2M16 19v3"/></svg>',
 build:'<svg class="icon" viewBox="0 0 24 24"><path d="m14 6 4-4 4 4-4 4M15 9 5 19M3 17l4 4"/></svg>',
 percent:'<svg class="icon" viewBox="0 0 24 24"><path d="m5 19 14-14"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
 error:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>',
 published_with_changes:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 7h-6V1M4 17h6v6"/><path d="M20 7a9 9 0 0 0-15-2M4 17a9 9 0 0 0 15 2"/></svg>',
 bar_chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 20V11h4v9M10 20V4h4v16M16 20v-6h4v6M2 20h20"/></svg>',
 insights:'<svg class="icon" viewBox="0 0 24 24"><path d="m3 17 5-6 4 3 7-9M16 5h3v3"/></svg>'
};
function icon(name){return ICONS[name]||ICONS.dashboard}
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tile(ic,t,v,p){return '<article class="tile reveal"><div class="ti">'+icon(ic)+'</div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>'}
function marker(n,t){return '<div class="story-marker"><span>CHAPTER '+n+'</span><b>'+t+'</b></div>'}
function card(t,ic,body,hint){return '<section class="card reveal"><div class="card-h"><h3>'+icon(ic)+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function cardT(t,ic,body,hint){return '<section class="card pad0 reveal"><div class="card-h"><h3>'+icon(ic)+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function strip(v){var d=document.createElement("div");d.innerHTML=v;return d.textContent.trim()}
function isNum(v){return /^[-+±]?(?:\d[\d,.]*|—)(?:\s*(?:mm|%|件|條|節))?(?:\s*[~–]\s*[-+]?\d[\d,.]*(?:\s*mm)?)?$/.test(strip(v))}
function tbl(h,r){
 return '<div class="table-wrap"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(row){return '<tr>'+row.map(function(c,i){return '<td class="'+(i===0?'mono ':'')+(isNum(c)?'num':'')+'">'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'
}
function cta(){return '<div class="chapter-cta"><button type="button" onclick="document.querySelector(\'.topbar\').scrollIntoView()">返回章節起點 ↑</button></div>'}
var AX={style:{colors:"#475569",fontSize:"11px",fontFamily:"Roboto Mono"}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Roboto Mono"};
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function mkBar(el,cats,data,name){
 push(el,{chart:Object.assign({},CB,{type:"bar",height:245}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:AX},yaxis:{labels:AX},grid:{borderColor:"#BBF7D0",strokeDashArray:0},dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:0,columnWidth:"58%"}},colors:["#15803D"],tooltip:{theme:"light"}})
}
function mkDonut(el,labels,data){
 push(el,{chart:Object.assign({},CB,{type:"donut",height:245}),series:data,labels:labels,colors:["#15803D","#D97706","#DC2626","#22C55E","#14532D","#86EFAC"],legend:{position:"bottom",fontSize:"11px"},dataLabels:{enabled:false},plotOptions:{pie:{donut:{size:"52%"}}},stroke:{width:3,colors:["#14532D"]},tooltip:{theme:"light"}})
}
function mkLine2(el,cats,s1,s2){
 push(el,{chart:Object.assign({},CB,{type:"line",height:245}),series:[s1,s2],xaxis:{categories:cats,labels:AX},yaxis:{labels:AX},grid:{borderColor:"#BBF7D0",strokeDashArray:0},dataLabels:{enabled:false},stroke:{curve:"stepline",width:[3,3],dashArray:[0,5]},colors:["#15803D","#D97706"],markers:{size:4,shape:"square"},legend:{position:"top",fontSize:"11px"},tooltip:{theme:"light"}})
}
var MODULES=[
 {icon:"dashboard",name:"分析總覽",sub:"尺寸鏈數量、合格率與風險項"},
 {icon:"straighten",name:"尺寸鏈明細",sub:"每條鏈的環節、公差與累積結果"},
 {icon:"analytics",name:"統計分析",sub:"最壞情況與統計法的差異比較"},
 {icon:"precision_manufacturing",name:"量產回饋",sub:"實際量測與分析預測的落差"}
];
function v0(c){
 c.innerHTML=marker("01","風險概況")+
 '<div class="grid g4">'+
 tile("straighten","尺寸鏈","18 條","涵蓋 6 個關鍵配合")+
 tile("check_circle","Cpk 達標","14 條","Cpk ≥ 1.33")+
 tile("warning","高風險鏈","3 條","Cpk < 1.0，干涉風險")+
 tile("savings","可放寬公差","6 條","過度嚴格，可降成本")+
 '</div>'+marker("02","風險分布")+
 '<div class="grid g32">'+
 card("各尺寸鏈 Cpk","bar_chart",'<div id="a1" class="chart"></div>',"1.33 為門檻")+
 card("風險分級","donut_large",'<div id="a2" class="chart"></div>',"共 18 條")+
 '</div>'+marker("03","尺寸鏈總表")+
 cardT("尺寸鏈總表","straighten",tbl(["鏈編號","配合部位","環節數","設計值","規格範圍","最壞情況","統計法 ±3σ","Cpk","判定"],[

var RENDER=[v0,v1,v2,v3];
function buildNav(){
 var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'">'+icon(m.icon)+'<span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 n.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){location.hash="go="+b.dataset.i})})
}
function animateIn(){
 var items=document.querySelectorAll(".reveal");
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){items.forEach(function(x){x.classList.add("in")});return}
 if(!("IntersectionObserver" in window)){items.forEach(function(x){x.classList.add("in")});return}
 var observer=new IntersectionObserver(function(entries){
  entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add("in");observer.unobserve(entry.target)}})
 },{threshold:.08});
 items.forEach(function(x){observer.observe(x)})
}
function show(i){
 killCharts();
 var m=MODULES[i];
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 document.getElementById("route-progress").style.width=((i+1)/MODULES.length*100)+"%";
 document.querySelectorAll("[data-i]").forEach(function(b){
  var on=+b.dataset.i===i;
  b.classList.toggle("on",on);
  if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
 });
 RENDER[i](document.getElementById("screen"));
 animateIn()
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 var i=m?Math.min(+m[1],MODULES.length-1):0;
 show(i);
 try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
