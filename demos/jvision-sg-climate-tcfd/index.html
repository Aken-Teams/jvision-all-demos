<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>氣候風險情境分析 TCFD · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#D1FAE5;
  --accent-soft2:#A7F3D0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#DFF7EC;
  --hov:#F0FDF4;
  --track:#D7E9E3;
  --sidebar:#064E3B;
  --sidebar2:#022C22;
  --side-edge:#000000;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#075985;
  --r:0px;
  --glow:rgba(5,150,105,.24);
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-width:320px}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(6,78,59,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(6,78,59,.055) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff;
}
::selection{background:#10B981;color:#000}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:260px;
  height:100vh;
  min-width:0;
  padding:0;
  overflow:hidden;
  color:#ECFDF5;
  background:var(--sidebar);
  border-right:4px solid #000;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:22px 18px;
  background:var(--color-secondary);
  border-bottom:4px solid #000;
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  color:#000;
  background:#ECFDF5;
  border:3px solid #000;
  border-radius:0;
  box-shadow:5px 5px 0 #000;
}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#000;font-size:16px;font-weight:900;letter-spacing:.02em}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:#063B2E;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
}
.nav{display:flex;flex-direction:column;gap:0;min-width:0;margin-top:0}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:52px;
  min-width:0;
  padding:13px 16px;
  color:#D1FAE5;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:0;
  border-bottom:1px solid rgba(167,243,208,.35);
  border-radius:0;
  font-weight:600;
  transition:background-color 160ms ease,color 160ms ease,transform 160ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav button:hover{color:#000;background:#A7F3D0;transform:translateX(4px)}
.nav button.on{
  color:#000;
  background:#10B981;
  box-shadow:inset 8px 0 0 #000;
  font-weight:800;
}
.nav button.on::after{
  content:"ACTIVE";
  position:absolute;
  right:13px;
  top:5px;
  color:#064E3B;
  font-family:"Fira Code",monospace;
  font-size:8px;
  letter-spacing:.08em;
}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  opacity:.72;
}
.side-foot{
  margin-top:auto;
  padding:16px 18px 18px;
  color:#A7F3D0;
  border-top:3px solid #10B981;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.8;
}
.side-foot b{color:#fff}

.main{flex:1;min-width:0;padding:26px 32px 64px}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin:0 0 22px;
  padding:20px 22px;
  background:#fff;
  border:3px solid #000;
  box-shadow:8px 8px 0 var(--color-secondary);
}
.topbar::before{
  content:"CLIMATE / RISK / INTELLIGENCE";
  position:absolute;
  right:20px;
  bottom:-18px;
  padding:3px 8px;
  color:#D1FAE5;
  background:#064E3B;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.08em;
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(20px,2vw,28px);font-weight:900;line-height:1.2}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:30px}
.topbar .sub{margin-top:6px;color:var(--muted);font-size:12.5px;font-weight:500}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:600;
}
.chip .dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid #064E3B;
  border-radius:0;
  animation:pulse 2s steps(2,end) infinite;
}
.chip .dot::after{content:""}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:#000;
  background:#10B981;
  border:2px solid #000;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-weight:700;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
#screen>.grid{animation:grid-in 420ms cubic-bezier(.2,.8,.2,1) both}
#screen>.grid:nth-child(2){animation-delay:60ms}
#screen>.grid:nth-child(3){animation-delay:120ms}
@keyframes grid-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.card,.sec{padding:17px}
.sec{margin-bottom:15px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--ink);
  flex-wrap:wrap;
}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;padding:16px 16px 12px!important;background:var(--th);border-bottom:2px solid var(--ink)}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.01em;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card-h .hint{
  padding:3px 7px;
  color:#064E3B;
  background:#D1FAE5;
  border:1px solid #064E3B;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.sec>h3{margin-bottom:13px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}

.kpi,.stat,.tile{position:relative;overflow:hidden;padding:16px 17px;border-left:7px solid var(--accent)}
.kpi::after{display:none}
.kpi .ico,.tile .ti{
  display:flex;
  position:absolute;
  right:12px;
  top:12px;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  color:#064E3B;
  background:#A7F3D0;
  border:2px solid #064E3B;
  border-radius:0;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:0;padding-right:38px;color:var(--muted);font-size:11.5px;font-weight:600}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:9px;
  color:#052E24;
  font-family:"Fira Code",monospace;
  font-size:clamp(22px,2vw,29px);
  font-weight:700;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:2px 5px;border:1px solid currentColor;font-size:10.5px;font-weight:700}
.delta.up,.d.up{color:#047857}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:7px;min-height:140px}
.tile b{padding-right:40px;font-size:13px;font-weight:800}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}

.card.pad0>div:last-child,.card.p0>div:last-child{scrollbar-color:var(--accent) var(--th);scrollbar-width:thin}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:11px 12px;
  color:#064E3B;
  text-align:left;
  white-space:nowrap;
  background:#D1FAE5;
  border-right:1px solid #6EE7B7;
  border-bottom:2px solid #064E3B;
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.02em;
}
th:last-child{border-right:0}
td{
  padding:11px 12px;
  white-space:nowrap;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F7FFFB}
tbody tr:hover{background:#DFF7EC}
td:not(:first-child){font-variant-numeric:tabular-nums}
td b{font-weight:800}
.mono{
  color:#064E3B;
  font-family:"Fira Code",monospace;
  font-weight:600;
  letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:700;
}
.tag::before{content:"■";font-size:7px;line-height:1}
.t-ok{color:#065F46;background:#D1FAE5}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#065F46;background:#A7F3D0}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #64748B;border-radius:0}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(135deg,#059669 0,#059669 6px,#10B981 6px,#10B981 12px);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--muted);text-align:right;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-27px;top:3px;width:17px;height:17px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #64748B;font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed #64748B;font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:2px solid var(--ink);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;border-bottom:2px solid var(--ink);font-size:12.5px;font-weight:800}
.col-h .cnt{padding:1px 7px;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.pcard{padding:11px 12px;background:#fff;border:1px solid var(--ink);border-left:5px solid var(--accent);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:flex;flex:none;align-items:center;justify-content:center;color:#064E3B;background:#A7F3D0;border:1px solid #064E3B;border-radius:0;font-weight:800}
.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:11px}.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:0}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#000;background:#10B981;border:2px solid #000;border-radius:0;font-family:"Fira Code",monospace;font-size:12px;font-weight:800}
.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13.5px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:#64748B;background:#fff;border:2px solid #64748B;border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:18px;height:3px;background:#94A3B8}
.steps .s.done{color:#000;background:#10B981;border-color:#064E3B}.steps .s.cur{color:#064E3B;border:3px double #059669;animation:pulse 1.6s steps(2,end) infinite}.steps .ln.done{background:#059669}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed #64748B}
.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:13px}.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid #64748B;border-radius:0}.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}.gauge small{display:block;margin-top:3px;color:var(--muted);text-align:right;font-family:"Fira Code",monospace;font-size:10px}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border:1px solid #64748B;border-radius:0}.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted)}.band .me{position:absolute;top:2px;width:12px;height:20px;background:var(--accent);border:2px solid #064E3B;border-radius:0}

.apexcharts-canvas{margin-inline:auto}
.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Code","Noto Sans TC",monospace!important}
.apexcharts-gridline{stroke:#A7F3D0}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:2px solid #064E3B!important;border-radius:0!important;box-shadow:4px 4px 0 #A7F3D0!important}
.apexcharts-tooltip-title{background:#D1FAE5!important;border-bottom:1px solid #064E3B!important}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:15px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid #000}
  .brand{padding:14px 16px}
  .brand-logo{width:40px;height:40px;box-shadow:4px 4px 0 #000}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .nav button{justify-content:center;padding:10px 8px;border-right:1px solid rgba(167,243,208,.35);border-bottom:0}
  .nav button:hover{transform:translateY(-2px)}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
