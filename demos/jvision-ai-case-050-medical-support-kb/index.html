<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>衛教客服知識站 · Health Education KB</title>
<meta name="description" content="患者衛教知識庫、民眾諮詢工單、多渠道客服與 AI 衛教問答"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0891b2;
  --color-on-primary:#000;
  --color-secondary:#22d3ee;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfeff;
  --color-foreground:#164e63;
  --color-card:#fff;
  --color-card-foreground:#164e63;
  --color-muted:#e8f1f6;
  --color-muted-foreground:#475569;
  --color-border:#a5f3fc;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#0891b2;
  --blue:#0891b2;
  --ink:#164e63;
  --muted:#475569;
  --line:#a5f3fc;
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#1d4ed8;
  --shadow:7px 7px 0 #164e63;
  --shadow-sm:4px 4px 0 #164e63;
}
*{box-sizing:border-box}
html{background:var(--color-background)}
body{
  margin:0;
  min-width:320px;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(8,145,178,.1) 1px,transparent 1px),
    linear-gradient(90deg,rgba(8,145,178,.1) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Atkinson Hyperlegible",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
button{font:inherit}
button,.pill{cursor:pointer}
.material-symbols-outlined{font-size:21px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:10px;
  padding:22px 18px;
  background:#fff;
  border-right:3px solid var(--ink);
}
.bd{
  display:flex;align-items:center;gap:12px;
  margin:-22px -18px 16px;padding:22px 18px;
  background:var(--color-secondary);
  border-bottom:3px solid var(--ink);
}
.lg{
  display:grid;place-items:center;flex:none;
  width:52px;height:52px;
  background:var(--color-primary);color:#000;
  border:3px solid #000;
  box-shadow:4px 4px 0 #000;
  font-size:24px;font-weight:700;
}
.bd b{display:block;font-size:17px;font-weight:700;line-height:1.2;color:#0f172a}
.bd span{display:block;margin-top:4px;color:#0f172a;font-size:10px;font-weight:700;letter-spacing:.12em}
#nav{display:flex;flex-direction:column;gap:8px}
.side button{
  width:100%;min-height:48px;
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;
  background:#fff;color:var(--ink);
  border:2px solid var(--ink);
  text-align:left;font-weight:700;
  box-shadow:3px 3px 0 transparent;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.side button:hover{background:var(--color-muted);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.side button.on{background:var(--color-primary);color:#000;box-shadow:4px 4px 0 #000;transform:translate(-2px,-2px)}
.side button.on .material-symbols-outlined{font-variation-settings:"FILL" 1}
.foot{
  margin-top:auto;padding:15px 2px 0;
  border-top:3px solid var(--ink);
  color:var(--muted);font-size:12px;line-height:1.7;
}
.main{min-width:0;padding:30px clamp(16px,3vw,44px) 48px}
.vh{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin-bottom:24px;padding:0 0 18px;border-bottom:4px solid var(--ink);
}
.vh h2{margin:0;font-size:clamp(28px,4vw,48px);font-weight:700;line-height:1;letter-spacing:-.035em}
.vh p{max-width:680px;margin:9px 0 0;color:var(--muted);font-size:15px}
.live{
  display:flex;align-items:center;gap:8px;flex:none;
  padding:9px 13px;
  background:#fff;color:var(--ink);
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  font-size:13px;font-weight:700;
}
.live i{width:10px;height:10px;background:var(--color-accent);border:2px solid #000}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi,.card,.npc,.acard,.qc,.cl,.sug,.fc{
  background:var(--color-card);color:var(--color-card-foreground);
  border:2px solid var(--ink);
}
.kpi{
  position:relative;min-height:154px;overflow:hidden;
  padding:18px;box-shadow:var(--shadow-sm);
}
.kpi:nth-child(even){transform:translateY(9px)}
.kpi .l{max-width:75%;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.045em}
.kpi .v{margin-top:8px;font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px}
.kpi .d{margin-top:12px;font-size:12px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:14px;font-size:34px;color:var(--color-primary)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:20px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:20px;box-shadow:var(--shadow)}
.card h3{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:0 0 17px;padding-bottom:11px;
  border-bottom:2px solid var(--ink);
  color:var(--ink);font-size:16px;font-weight:700;
}
.card h3>.material-symbols-outlined{display:grid;place-items:center;width:30px;height:30px;background:var(--color-secondary);border:2px solid var(--ink);color:#000}
.tag,.catlab,.conf{
  display:inline-flex;align-items:center;
  padding:3px 8px;border:1px solid currentColor;
  font-size:11px;font-weight:700;line-height:1.3;
}
.t-ok{background:#d1fae5;color:#065f46}
.t-warn{background:#fef3c7;color:#92400e}
.t-bad{background:#fee2e2;color:#991b1b}
.t-info{background:#dbeafe;color:#1e40af}
.t-sky,.catlab,.conf{background:#cffafe;color:#155e75}
.chartbox{position:relative;width:100%}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{padding:12px 10px;border:1px solid var(--ink);vertical-align:top}
table.data th{background:var(--color-secondary);color:#0f172a;font-size:13px;font-weight:700;text-align:left}
table.data td{background:#fff}
table.data tr:hover td{background:#ecfeff}
.kbcat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{
  min-height:38px;padding:7px 12px;
  background:#fff;color:var(--muted);
  border:2px solid var(--ink);
  font-weight:700;
  transition:background-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.pill:hover{background:var(--color-muted);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.pill.on{background:var(--color-primary);color:#000;box-shadow:3px 3px 0 #000}
.kbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.acard{
  position:relative;display:flex;flex-direction:column;gap:10px;
  min-height:174px;padding:14px;
  box-shadow:4px 4px 0 var(--ink);
}
.acard:nth-child(3n+2){transform:translateY(5px)}
.acard:before{content:"";position:absolute;left:-2px;top:-2px;width:10px;height:calc(100% + 4px);background:var(--color-primary);border:2px solid var(--ink)}
.acard>div,.acard>b{margin-left:6px}
.acard .ic{
  display:grid;place-items:center;width:38px;height:38px;flex:none;
  border:2px solid #000;color:#000;
}
.ty-art{background:var(--color-secondary)}.ty-vid{background:#bfdbfe}.ty-pdf{background:#a7f3d0}
.acard b{font-size:14px;line-height:1.35}
.acard .m{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;color:var(--muted);font-size:12px}
.acard .m span{display:flex;align-items:center;gap:4px}
.acard .m .material-symbols-outlined{font-size:16px}
.queue{display:flex;flex-direction:column;gap:12px}
.qc{padding:13px 14px 13px 17px;border-left-width:9px;box-shadow:3px 3px 0 var(--ink)}
.qc.hi{border-left-color:var(--bad);background:#fff7f7}
.qc.mid{border-left-color:var(--warn)}
.qc.lo{border-left-color:var(--info)}
.qc .qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qc .qt b{font-size:14px}
.qc .id,.sla .num,.cl .n b,.npc .v,.gaprow .n{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.qc .id{font-size:13px;font-weight:700;color:#0e7490}
.qc .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
.qc .meta span{display:flex;align-items:center;gap:4px}
.qc .meta .material-symbols-outlined{font-size:16px}
.sla{margin-left:auto;text-align:right;flex:none}
.sla .num{font-size:17px;font-weight:700;line-height:1}
.sla small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.sla.red .num{color:var(--bad)}.sla.amb .num{color:var(--warn)}.sla.grn .num{color:var(--ok)}
.chan{
  display:grid;place-items:center;flex:none;width:30px;height:30px;
  border:2px solid #000;color:#000;
}
.chan .material-symbols-outlined{font-size:17px}
.c-phone{background:#67e8f9}.c-line{background:#86efac}.c-web{background:#bfdbfe}.c-visit{background:#fde68a}
.ava{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;background:var(--color-secondary);border:1px solid var(--ink);color:#0f172a;font-size:11px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:13px}
.msg{
  max-width:84%;padding:12px 14px;
  border:2px solid var(--ink);
  font-size:14px;line-height:1.65;
  box-shadow:3px 3px 0 var(--ink);
}
.msg.cust{align-self:flex-start;background:var(--color-muted)}
.msg.ai{align-self:flex-end;background:#cffafe}
.msg .who{display:flex;align-items:center;gap:5px;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:700}
.msg .who .material-symbols-outlined{font-size:16px;color:#0e7490}
.chanlist{display:flex;flex-direction:column;gap:10px}
.cl{display:flex;align-items:center;gap:11px;padding:11px 12px}
.cl b{font-size:14px}.cl small{display:block;color:var(--muted);font-size:12px}
.cl .n{margin-left:auto;text-align:right;flex:none}
.cl .n b{font-size:17px;color:#0e7490}
.sug{margin-bottom:11px;padding:12px 14px;background:#ecfeff}
.sug b{display:block;margin-bottom:4px;font-size:14px}
.sug small{color:var(--muted);font-size:12px;line-height:1.6}
.conf{margin-left:7px}
.kbrow{display:flex;align-items:flex-start;gap:9px;padding:11px 0;border-bottom:2px dashed var(--line)}
.kbrow>.material-symbols-outlined{flex:none;margin-top:2px;color:#0e7490}
.kbrow b{font-size:14px}.kbrow small{display:block;color:var(--muted);font-size:12px}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  min-height:42px;padding:8px 14px;
  border:2px solid var(--ink);
  font-size:13px;font-weight:700;
  box-shadow:3px 3px 0 var(--ink);
  transition:background-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn.ok{background:var(--color-accent);color:#000}.btn.no{background:#fee2e2;color:#991b1b}.btn.gh{background:#fff;color:var(--ink)}
.stars{color:#925f00;font-size:16px;letter-spacing:1px}
.fbk{display:flex;flex-direction:column;gap:11px}
.fc{padding:12px 14px}
.fc .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.fc .fh b{font-size:14px}
.fc p{margin:5px 0;color:#334155;font-size:13px;line-height:1.6}
.nps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.npc{padding:18px;text-align:center;box-shadow:var(--shadow-sm)}
.npc:nth-child(2){background:var(--color-secondary);transform:translateY(-7px)}
.npc .v{font-size:32px;font-weight:700}.npc .l{margin-top:3px;color:var(--muted);font-size:13px;font-weight:700}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:12px;height:12px;border:2px solid var(--ink)}
.gaprow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:13px}
.gaprow .material-symbols-outlined{flex:none;color:var(--warn)}
.gaprow .n{margin-left:auto;flex:none;color:var(--warn);font-weight:700;text-align:right}
:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  @keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  #view>.kpis>*,
  #view>.grid>*,
  #view>.card,
  #view>.nps>*{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
  #view>.kpis>*:nth-child(2),#view>.grid>*:nth-child(2),#view>.nps>*:nth-child(2){animation-delay:.06s}
  #view>.kpis>*:nth-child(3),#view>.nps>*:nth-child(3){animation-delay:.12s}
  #view>.kpis>*:nth-child(4){animation-delay:.18s}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
@media(max-width:1024px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kbgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .shell{display:block}
  .side{position:static;height:auto;padding:14px;border-right:0;border-bottom:3px solid var(--ink)}
  .bd{margin:-14px -14px 4px;padding:14px}
  #nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .side button{justify-content:center;min-width:0;padding:9px 7px;font-size:12px;text-align:center}
  .side button .material-symbols-outlined{display:none}
  .foot{display:none}
  .main{padding-top:22px}
  .vh{align-items:flex-start}.live{white-space:nowrap}
  .g2,.g11,.two{grid-template-columns:1fr}
}
@media(max-width:520px){
  .main{padding:18px 12px 34px}
  .vh{display:block}.live{display:inline-flex;margin-top:14px}
  #nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis,.kbgrid,.nps{grid-template-columns:1fr}
  .kpi:nth-child(even),.acard:nth-child(3n+2),.npc:nth-child(2){transform:none}
  .card{padding:14px;box-shadow:4px 4px 0 var(--ink)}
  .msg{max-width:94%}
  .sla{width:100%;margin-left:39px;text-align:left}
  .mini .btn{flex:1}
}
</style>
</head>
