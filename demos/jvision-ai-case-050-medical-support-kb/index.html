let CH=[];
function dispose(){CH.forEach(c=>{try{c.destroy();}catch(e){}});CH=[];}
function mk(id,cfg){const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;CH.push(new Chart(el,cfg));}

function draw(i){
 dispose();
 if(i==0){
  mk('c_topic',{type:'bar',data:{labels:['慢性病照護','術後照護','婦幼衛教','用藥安全','預防保健'],datasets:[{label:'諮詢量',data:[38,22,19,11,6],backgroundColor:'#0284c7',borderRadius:5,barThickness:22}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true}}}});
  mk('c_views',{type:'line',data:{labels:['一','二','三','四','五','六','日'],datasets:[{label:'瀏覽數',data:[3200,3600,3900,4100,4600,3800,4200],borderColor:'#0284c7',backgroundColor:'rgba(2,132,199,.14)',fill:true,tension:.4,pointRadius:2,borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true,ticks:{...AX.ticks,callback:v=>v/1000+'k'}}}}});
 }
 if(i==1){
  mk('c_cat',{type:'doughnut',data:{labels:['慢性病照護','術後照護','婦幼衛教','預防保健','用藥安全'],datasets:[{data:[88,52,46,34,28],backgroundColor:['#0284c7','#38bdf8','#7c3aed','#0d9488','#f59e0b'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{font:{size:10.5,family:'Noto Sans TC'},padding:9,boxWidth:11}}}}});
 }
 if(i==3){
  mk('c_resp',{type:'bar',data:{labels:['<5分','5-15分','15-30分','>30分'],datasets:[{label:'工單數',data:[34,41,17,4],backgroundColor:['#0d9488','#0284c7','#f59e0b','#e11d48'],borderRadius:5,barThickness:26}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true}}}});

 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
