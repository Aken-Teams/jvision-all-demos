<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>薪酬結構與市場對標 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E7DC;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#F0FDFA;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#E6FAF6;
  --hov:#F0FDFA;
  --track:#DDEBEF;
  --sidebar:#0B3B38;
  --sidebar2:#134E4A;
  --side-edge:rgba(255,255,255,.16);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:4px;
  --glow:rgba(13,148,136,.18);
  --shadow:0 2px 0 rgba(19,78,74,.08),0 10px 30px rgba(19,78,74,.06);
  --font-display:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  --font-body:"Crimson Pro","Noto Serif TC",Georgia,serif;
  --font-label:"Cinzel","Noto Sans TC",Arial,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:var(--font-body);
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums lining-nums;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);letter-spacing:-.01em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus{outline:none}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:3px}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.app{display:flex;min-height:100vh}
.sidebar{
  width:258px;flex:none;min-width:0;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:28px 18px 20px;
  color:#ECFEFF;background:var(--sidebar);border-right:5px solid var(--color-secondary)
}
.brand{display:flex;align-items:center;gap:13px;padding:0 6px 25px;border-bottom:1px solid rgba(255,255,255,.18);min-width:0}
.brand-logo{
  width:43px;height:43px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--color-on-accent);background:var(--color-accent);border:1px solid #F59E0B;border-radius:2px;
  box-shadow:5px 5px 0 rgba(0,0,0,.18)
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.03em;color:#FFF}
.brand-txt span{display:block;margin-top:2px;font-family:var(--font-label);font-size:8px;line-height:1.4;color:#99F6E4;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:22px;min-width:0}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;min-height:46px;min-width:0;padding:10px 11px;
  border:1px solid transparent;border-radius:2px;background:transparent;color:#CCFBF1;text-align:left;
  font-family:var(--font-body);font-size:15px;font-weight:600;transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{color:#FFF;background:rgba(45,212,191,.13);border-color:rgba(94,234,212,.38);transform:translateX(3px)}
.nav button.on{color:#062F2D;background:var(--color-secondary);border-color:#99F6E4;box-shadow:4px 4px 0 rgba(0,0,0,.2)}
.nav button.on::before{content:"";position:absolute;left:-12px;width:4px;height:24px;background:var(--color-accent)}
.nav .idx{margin-left:auto;font-family:var(--font-mono);font-size:10px;opacity:.7;font-weight:700}
.side-foot{margin-top:auto;padding:16px 7px 0;border-top:1px solid rgba(255,255,255,.18);font-size:12px;color:#B8EEE7;line-height:1.65}
.side-foot b{color:#FFF;font-weight:600}

.main{flex:1;min-width:0;max-width:1580px;padding:28px 32px 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:700;line-height:1.08}
.topbar h1 .material-symbols-outlined{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--color-on-primary);background:var(--color-secondary);font-size:21px;border-radius:2px}
.topbar .sub{margin-top:7px;font-size:14px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 11px;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:2px;font-size:12px;font-weight:600;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.14);animation:pulse 2s ease-in-out infinite}
.avatar{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:2px;background:var(--color-accent);color:var(--color-on-accent);font-family:var(--font-display);font-weight:700;font-size:15px;border:1px solid #B45309}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.55}}
@keyframes card-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
#screen>.grid>*,#screen>.card,#screen>.sec{animation:card-in .4s cubic-bezier(.2,.8,.2,1) both}
#screen>.grid>*:nth-child(2){animation-delay:.06s}
#screen>.grid>*:nth-child(3){animation-delay:.12s}
#screen>.grid>*:nth-child(4){animation-delay:.18s}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:0 3px 0 rgba(13,148,136,.15),0 14px 30px rgba(19,78,74,.09)}
.card,.sec{padding:17px}
.sec{margin-bottom:15px}
.sec>h3,.card-h h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec>h3{margin-bottom:12px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.sec>p{margin:0 0 13px;color:var(--muted);line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card.pad0>.card-h{padding:16px 18px 0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.card-h .hint{font-size:12px;color:var(--muted);font-weight:600}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:14px;margin:0}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:16px 17px;border-top:3px solid var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-24px;top:-27px;width:84px;height:84px;border:1px solid var(--color-border);transform:rotate(45deg);background:var(--accent-soft2)}
.kpi .ico{position:relative;z-index:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--color-primary);border:1px solid var(--color-border);border-radius:2px}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.kpi .val,.stat .val{margin-top:1px;font-family:var(--font-display);font-size:31px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted)}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:12px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card>div[style*="overflow-x"]{scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{padding:11px 14px;border-bottom:2px solid var(--color-primary);background:var(--th);color:#315B58;font-family:var(--font-label);font-size:9px;font-weight:600;letter-spacing:.05em;text-align:left;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;color:#183F3C}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--hov)}
.mono{font-family:var(--font-mono);font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap}
.t-ok{background:#DCFCE7;color:#166534}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#B91C1C}
.t-info{background:#E0F2FE;color:#075985}
.t-gray{background:#F1F5F9;color:#475569}
.t-acc,.t-pink{background:#CCFBF1;color:#115E59}

.bar{height:7px;min-width:56px;border-radius:1px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:1px;background:var(--color-primary)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:38px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:600}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--color-primary)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-24px;top:3px;width:13px;height:13px;border-radius:50%;background:#FFF;border:3px solid var(--color-primary)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{font-family:var(--font-mono);font-size:10px;color:var(--muted);font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px;font-family:var(--font-body)}
.tl-item p,.tl-i p{margin:0;font-size:12px;color:var(--muted)}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:#64748B}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px;text-align:right}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--th);border:1px solid var(--line);border-radius:2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;font-family:var(--font-display);font-size:16px;font-weight:700}
.col-h .cnt{padding:1px 8px;background:#FFF;border:1px solid var(--line);border-radius:999px;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.pcard{padding:11px 11px 10px;background:#FFF;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:2px;box-shadow:2px 2px 0 rgba(13,148,136,.08);transition:transform .2s ease,border-color .2s ease}
.pcard:hover{transform:translateY(-2px);border-color:var(--color-primary)}
.pcard b{font-family:var(--font-mono);font-size:12px}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--muted)}
.pcard .who,.who{display:inline-flex;align-items:center;gap:6px}
.pcard .who{margin-top:8px;font-size:11px;color:var(--ink)}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:var(--color-primary);border:1px solid var(--color-border);font-weight:800}
.mini-av{width:19px;height:19px;border-radius:50%;font-size:9px}
.av{width:27px;height:27px;border-radius:50%;font-size:11px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#FFF;border:1px solid var(--line);border-radius:2px}
.lane-row .num{width:31px;height:31px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:2px;background:var(--accent-soft);color:var(--color-primary);font-family:var(--font-mono);font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:22px;height:22px;display:flex;align-items:center;justify-content:center;z-index:1;border:2px solid var(--line);border-radius:50%;background:#FFF;color:#64748B;font-family:var(--font-mono);font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{background:var(--color-primary);border-color:var(--color-primary);color:#FFF}
.steps .s.cur{border-color:var(--color-primary);color:var(--color-primary);animation:pulse 1.6s infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 3px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{font-size:11px;color:var(--muted)}
.gauge{width:112px;flex:none}
.gauge .track{height:8px;position:relative;overflow:hidden;border-radius:1px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:1px;background:var(--color-primary)}
.gauge small{display:block;margin-top:4px;text-align:right;font-family:var(--font-mono);font-size:9px;color:var(--muted)}
.band{position:relative;height:25px;min-width:150px;border-radius:2px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:19px;border-radius:1px;background:var(--color-accent);border:1px solid #92400E;box-shadow:2px 2px 0 rgba(146,64,14,.18)}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px 17px}
.tile .ti{width:37px;height:37px;display:flex;align-items:center;justify-content:center;border-radius:2px;background:var(--accent-soft);color:var(--color-primary);border:1px solid var(--line)}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:15px}
.tile p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.tile .tv{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em}

.apexcharts-text,.apexcharts-legend-text{font-family:var(--font-body)!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:2px!important;box-shadow:var(--shadow)!important}
.apexcharts-canvas:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:0 13px 0 0;border:0}
  .brand-logo{width:38px;height:38px;box-shadow:3px 3px 0 rgba(0,0,0,.16)}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:0}
  .nav button{min-height:40px;padding:8px 10px}
  .nav button.on::before{display:none}
  .nav .idx{display:none}
  .main{padding:20px 16px 46px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{gap:14px}
}
@media(max-width:560px){
  body{font-size:14px}
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .brand-txt span{display:none}
  .nav button{flex:1 1 42px;justify-content:center;padding:8px}
  .nav button .txt{display:none}
  .topbar h1{font-size:25px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .card,.sec{padding:14px}
  .kpi,.stat{padding:14px 15px}
  .kpi .val,.stat .val{font-size:28px}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
  .rep-row{align-items:flex-start;flex-direction:column}
  .gauge{width:100%}
}
@media(max-width:390px){
  .main{padding-left:12px;padding-right:12px}
  .brand-txt{display:none}
  .topbar h1{font-size:23px}
  .chip{font-size:11px;padding-inline:8px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">paid</span></div>
      <div class="brand-txt"><b>薪酬對標台</b><span>COMPENSATION BENCHMARK</span></div>
    </div>

function col(title,cnt,items){
  return '<div class="col"><div class="col-h">'+title+'<span class="cnt">'+cnt+'</span></div>'+
    items.map(function(it){

    }).join("")+'</div>';
}

var RENDER = [v0,v1,v2,v3,v4,v5];

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
