<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>能源管理系統（Energy Management System, EMS）｜Jvision 系統 Demo</title>
  <meta name="description" content="碳盤查、能源監控到減碳目標的永續管理" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#6d28d9;--accent2:#8b5cf6;--accent-soft:#ede9fe;
      --bg:#f5f4fb;--panel:#ffffff;--ink:#1e1b2e;--muted:#6b7280;--line:#e7e5ef;
      --ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--info:#3b82f6;
      --shadow:0 1px 2px rgba(24,16,48,.04),0 8px 28px rgba(60,40,120,.07);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    a{color:inherit;text-decoration:none}
    /* top nav */
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#5b21b6,#6d28d9 55%,#7c3aed);color:#fff;box-shadow:0 4px 18px rgba(60,20,120,.18)}
    .topbar-inner{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand .sub{font-size:11.5px;opacity:.82;white-space:nowrap}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .live-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.28)}
    .avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
    /* nav tabs */
    nav.tabs{max-width:1360px;margin:0 auto;padding:10px 18px 0;display:flex;gap:8px;flex-wrap:wrap}
    nav.tabs button{flex:none;white-space:nowrap;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:11px 11px 0 0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;border-bottom:none;position:relative;top:1px}
    nav.tabs button .material-symbols-outlined{font-size:18px}
    nav.tabs button:hover{color:var(--accent);background:var(--accent-soft)}
    nav.tabs button.active{color:var(--accent);background:var(--panel);box-shadow:0 -3px 0 var(--accent) inset;font-weight:800;border-color:var(--line)}
    main{max-width:1360px;margin:0 auto;padding:14px 18px 60px}
    /* generic */
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 2px 16px}
    .page-head h2{margin:0;font-size:20px;font-weight:800}
    .page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .pad{padding:16px}
    .card-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:0 0 12px}
    .card-title .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card-title .sp{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
    .grid{display:grid;gap:14px}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:repeat(3,1fr)}
    .g-2-3{grid-template-columns:1.4fr 1fr}
    .g-3-2{grid-template-columns:1fr 1.35fr}
    .min0{min-width:0}
    /* kpi */
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);opacity:.6}
    .kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px;position:relative;z-index:1}
    .kpi .ic .material-symbols-outlined{font-size:22px}
    .kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;position:relative;z-index:1}
    .kpi .val{font-size:25px;font-weight:800;margin-top:3px;letter-spacing:.3px;position:relative;z-index:1}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;position:relative;z-index:1}
    .kpi .delta .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
    .chart{width:100%;height:280px}
    .chart.sm{height:220px}
    .chart.lg{height:330px}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;background:#faf9fe}
    tbody tr:hover{background:#faf9fe}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
    .t-ok{background:#dcfce7;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-acc{background:var(--accent-soft);color:var(--accent)}.t-mut{background:#f1f0f6;color:#64748b}
    .bar{height:7px;border-radius:999px;background:#eee;overflow:hidden;min-width:60px}
    .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
    /* kanban board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .col{background:#faf9fe;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
    .col-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:2px 4px 10px}
    .col-h .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px}
    .col-h .dot{width:9px;height:9px;border-radius:50%}
    .tk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,20,60,.05);border-left:4px solid var(--accent2)}
    .tk .tk-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
    .tk .code{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.3px}
    .tk h4{margin:0 0 5px;font-size:13.5px;font-weight:700;line-height:1.35;white-space:normal}
    .tk .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
    .tk .who{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:800}
    .tk .kwh{margin-left:auto;font-weight:800;font-size:12px;color:var(--ink)}
    /* progress ring / gauge etc handled by echarts */
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
    /* matrix */
    .matrix{display:grid;grid-template-columns:auto repeat(6,1fr);gap:5px;font-size:11px}
    .matrix .mh{font-weight:700;color:var(--muted);text-align:center;padding:4px 2px;white-space:nowrap}
    .matrix .ml{font-weight:700;color:var(--muted);padding:6px 6px;white-space:nowrap;display:flex;align-items:center}
    .cell{height:38px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:11px}
    /* timeline */
    .tl{position:relative;padding-left:22px}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl-item{position:relative;padding:0 0 16px 8px}
    .tl-item::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
    .tl-item .tt{font-size:12.5px;font-weight:800}
    .tl-item .td{font-size:12px;color:var(--muted);margin-top:2px}
    .tl-item .tm{font-size:11px;color:var(--accent);font-weight:700}
    /* stat rows */
    .srow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line)}
    .srow:last-child{border-bottom:none}
    .srow .nm{font-weight:700;font-size:13px;min-width:0}
    .srow .vv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
    .flow-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .flow-strip .st{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
    .flow-strip .st .n{font-size:11px;color:var(--accent);font-weight:800}
    .flow-strip .st .t{font-size:13px;font-weight:800;margin-top:2px}
    .flow-strip .st .r{font-size:11px;color:var(--muted);margin-top:2px}
    .note{font-size:12px;color:var(--muted);line-height:1.6}
    .foot{max-width:1360px;margin:0 auto;padding:20px 18px 40px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g-2,.g-3,.g-2-3,.g-3-2{grid-template-columns:1fr}
      .g-3{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
    }
    @media(max-width:560px){
      nav.tabs button .lbl{display:none}
      nav.tabs button{padding:9px 12px}
      .g-kpi{grid-template-columns:1fr 1fr}
      .board{grid-template-columns:1fr}
      .brand .sub{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand min0">
        <div class="logo"><span class="material-symbols-outlined">bolt</span></div>
        <div class="min0">
          <h1>能源管理系統 EMS</h1>
          <div class="sub">碳盤查・能源監控・減碳目標的永續管理平台</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="live-chip"><span class="live-dot"></span>即時連線 · IoT Gateway</div>
        <div class="live-chip">南科三廠</div>
        <div class="avatar">廠務</div>
      </div>
    </div>
    <nav class="tabs" id="nav"></nav>
  </header>
  <main id="app"></main>
  <div class="foot">Jvision 系統 Demo · 能源管理系統（EMS）· 全為示意假資料，無後端串接</div>

  <script>
  (function(){
    "use strict";
    var accent="#6d28d9",accent2="#8b5cf6";
    var charts=[];
    function disposeAll(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
    function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
    var palette=[accent,accent2,"#a78bfa","#c4b5fd","#7c3aed","#5b21b6"];
    var esc=function(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];});};

    var MODS=[
      {ic:"dashboard",name:"能耗即時看板",sub:"全廠用電/用能即時監控看板"},
      {ic:"pie_chart",name:"分項能耗分析",sub:"分區/分設備能耗結構拆解"},
      {ic:"electric_meter",name:"需量與尖峰管理",sub:"契約容量與需量預測控制"},
      {ic:"notification_important",name:"異常耗能告警",sub:"耗能異常偵測與告警派工"},
      {ic:"savings",name:"節能專案追蹤",sub:"節能對策執行與效益驗證"},
      {ic:"eco",name:"碳排與能效指標",sub:"單位產品能耗與碳排放追蹤"}
    ];

    // ---------- helpers ----------
    function kpi(icon,lab,val,unit,delta,dir){
      var d=dir==="up"?'<span class="delta up"><span class="material-symbols-outlined">trending_up</span>'+delta+'</span>'
        :dir==="down"?'<span class="delta down"><span class="material-symbols-outlined">trending_down</span>'+delta+'</span>'
        :dir==="gup"?'<span class="delta up"><span class="material-symbols-outlined">arrow_upward</span>'+delta+'</span>'
        :dir==="gdown"?'<span class="delta down"><span class="material-symbols-outlined">arrow_downward</span>'+delta+'</span>'
        :'<span class="delta flat"><span class="material-symbols-outlined">remove</span>'+delta+'</span>';
      return '<div class="kpi min0"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div>'+
        '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+d+'</div>';
    }
    function head(title,sub,pill){
      return '<div class="page-head"><div class="min0"><h2>'+title+'</h2><p>'+sub+'</p></div>'+
        (pill?'<span class="pill"><span class="material-symbols-outlined" style="font-size:16px">'+pill.ic+'</span>'+pill.t+'</span>':'')+'</div>';
    }

    // ============================================================
    // SCREEN 0 — 能耗即時看板（KANBAN signature board）
    // ============================================================
    function v0(){
      var lanes=[
        {t:"正常運轉",dot:"var(--ok)",cnt:0,cards:[]},
        {t:"接近上限",dot:"var(--warn)",cnt:0,cards:[]},
        {t:"超標告警",dot:"var(--bad)",cnt:0,cards:[]},
        {t:"停機/待機",dot:"var(--muted)",dotv:"#94a3b8",cnt:0,cards:[]}
      ];
      var data=[
        {lane:0,code:"AHU-A1",n:"A棟空調主機",who:"廠",kwh:"412 kW",m:"負載 68% · 溫度 22°C"},
        {lane:0,code:"CHW-02",n:"二號冰水主機",who:"廠",kwh:"388 kW",m:"COP 4.6 · 正常"},
        {lane:0,code:"AIR-C1",n:"無塵室空壓站",who:"設",kwh:"296 kW",m:"壓力 7.2 bar"},
        {lane:1,code:"PROD-L3",n:"第三產線動力盤",who:"廠",kwh:"628 kW",m:"達契約 82% · 留意"},
        {lane:1,code:"BOIL-1",n:"蒸氣鍋爐",who:"設",kwh:"254 kW",m:"效率略降 3%"},
        {lane:2,code:"CDA-B2",n:"B棟冷卻水泵",who:"廠",kwh:"471 kW",m:"較基線 +23% 異常"},
        {lane:2,code:"OVEN-7",n:"烘烤爐 #7",who:"設",kwh:"512 kW",m:"待機耗能偏高"},
        {lane:3,code:"PACK-2",n:"包裝線 #2",who:"廠",kwh:"12 kW",m:"排程停機中"},
        {lane:3,code:"WWT-1",n:"廢水處理",who:"設",kwh:"88 kW",m:"待機保溫"}
      ];
      data.forEach(function(d){lanes[d.lane].cards.push(d);lanes[d.lane].cnt++;});
      var board='<div class="board">';
      lanes.forEach(function(L){
        board+='<div class="col"><div class="col-h"><span class="dot" style="background:'+(L.dotv||L.dot)+'"></span>'+L.t+'<span class="cnt">'+L.cnt+'</span></div>';
        L.cards.forEach(function(c){
          board+='<div class="tk" style="border-left-color:'+(L.dotv||L.dot)+'"><div class="tk-top"><span class="code">'+c.code+'</span></div>'+
            '<h4>'+esc(c.n)+'</h4><div class="meta"><span class="who">'+c.who+'</span>'+esc(c.m)+'<span class="kwh">'+c.kwh+'</span></div></div>';
        });
        board+='</div>';
      });
      board+='</div>';

      var flow='<div class="flow-strip">'+
        [['採集','能耗數據採集','廠務工程師'],['分析','分項統計分析','廠務工程師'],['告警','異常耗能告警','廠務工程師'],['對策','節能對策執行','設備工程師'],['驗證','效益驗證追蹤','永續發展部門']]
        .map(function(s){return '<div class="st"><div class="n">'+s[0]+'</div><div class="t">'+s[1]+'</div><div class="r">'+s[2]+'</div></div>';}).join('')+'</div>';

      var html=head("能耗即時看板","以看板檢視全廠各設備即時運轉與耗能狀態，異常一眼定位",{ic:"grid_view",t:"即時 KANBAN"})+flow+
        '<div class="grid g-kpi" style="margin-bottom:14px">'+
          kpi("bolt","全廠即時總負載","3,712","kW","較昨日 -4.1%","down")+
          kpi("speed","即時需量","6,850","kW","契約 88%","gup")+
          kpi("co2","今日碳排放","18.4","tCO₂e","較基準 -6.2%","down")+
          kpi("insights","單位產品能耗","0.842","kWh/pc","較上月 -3.5%","down")+
        '</div>'+
        '<div class="grid g-2-3" style="margin-bottom:14px">'+
          '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">show_chart</span>今日 24 小時全廠負載曲線<span class="sp">kW · 每小時</span></div><div id="c0a" class="chart"></div></div></div>'+
          '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">donut_large</span>即時能源別占比</div><div id="c0b" class="chart"></div></div></div>'+
        '</div>'+
        '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">grid_view</span>設備運轉看板<span class="sp">共 '+data.length+' 台監控設備</span></div><div style="overflow-x:auto">'+board+'</div></div></div>';
      return {html:html,init:function(){
        var c0a=mk("c0a");
        if(c0a){var hrs=[];for(var i=0;i<24;i++)hrs.push(i+":00");
          var load=[2650,2480,2390,2360,2410,2680,3120,3580,3910,4020,3980,3760,3540,3820,3990,4050,3880,3620,3410,3180,2980,2860,2740,2680];
          var base=hrs.map(function(){return 3200;});
          c0a.setOption({grid:{left:44,right:14,top:24,bottom:28},tooltip:{trigger:"axis"},
            xAxis:{type:"category",data:hrs,axisLine:{lineStyle:{color:"#ddd"}},axisLabel:{color:"#888",fontSize:10,interval:2}},
            yAxis:{type:"value",splitLine:{lineStyle:{color:"#f0eef8"}},axisLabel:{color:"#888",fontSize:10}},
            series:[
              {name:"實際負載",type:"line",smooth:true,data:load,symbol:"none",lineStyle:{width:3,color:accent},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"rgba(109,40,217,.28)"},{offset:1,color:"rgba(109,40,217,.02)"}])}},
              {name:"能耗基線",type:"line",data:base,symbol:"none",lineStyle:{width:1.5,color:"#cbb8f5",type:"dashed"}}
            ]});
        }
        var c0b=mk("c0b");
        if(c0b){c0b.setOption({tooltip:{trigger:"item",formatter:"{b}: {c} kW ({d}%)"},
          legend:{bottom:0,textStyle:{fontSize:11,color:"#666"}},color:palette,

          var seriesData=bars.map(function(b,i){return {value:[i,b.v[0],b.v[1]],itemStyle:{color:b.c}};});
          c4a.setOption({
            grid:{left:88,right:16,top:16,bottom:30},
            tooltip:{formatter:function(p){return cats[p.data.value[0]]+"<br/>第 "+p.data.value[1]+"~"+p.data.value[2]+" 月";}},
            xAxis:{type:"value",min:6,max:13,interval:1,axisLabel:{formatter:"{value}月",color:"#888",fontSize:10},splitLine:{lineStyle:{color:"#f0eef8"}}},
            yAxis:{type:"category",data:cats,axisLabel:{color:"#666",fontSize:11},axisTick:{show:false}},
            series:[{type:"custom",renderItem:function(params,api){
              var yv=api.value(0);var start=api.coord([api.value(1),yv]);var end=api.coord([api.value(2),yv]);
              var h=api.size([0,1])[1]*0.5;
              return {type:"rect",shape:{x:start[0],y:start[1]-h/2,width:end[0]-start[0],height:h,r:5},style:api.style()};
            },encode:{x:[1,2],y:0},data:seriesData}]
          });
        }
        var c4b=mk("c4b");
        if(c4b){
          c4b.setOption({
            grid:{left:52,right:20,top:20,bottom:44},
            tooltip:{formatter:function(p){return p.data[3]+"<br/>投資 "+p.data[0]+" 萬 · 回收 "+p.data[1]+" 年 · 年省 "+p.data[2]+" 萬";}},
            xAxis:{name:"投資額 (萬)",nameLocation:"middle",nameGap:28,nameTextStyle:{color:"#888",fontSize:11},type:"value",splitLine:{lineStyle:{color:"#f0eef8"}},axisLabel:{color:"#888",fontSize:10}},
            yAxis:{name:"回收年限",nameTextStyle:{color:"#888",fontSize:11},type:"value",min:2,max:4,splitLine:{lineStyle:{color:"#f0eef8"}},axisLabel:{color:"#888",fontSize:10}},
            series:[{type:"scatter",symbolSize:function(d){return Math.sqrt(d[2])*5;},
              data:[[180,2.9,62,"冰水群控"],[240,2.7,88,"空壓變頻"],[95,2.3,41,"照明LED"],[320,3.3,96,"熱回收"],[130,3.4,38,"馬達汰換"]],
              itemStyle:{color:new echarts.graphic.RadialGradient(0.4,0.3,1,[{offset:0,color:accent2},{offset:1,color:accent}]),opacity:.85},
              label:{show:true,formatter:function(d){return d.data[3];},position:"top",color:"#666",fontSize:10}}]
          });
        }
      }};
    }

    // ============================================================
    // SCREEN 5 — 碳排與能效指標（radar + target progress + carbon）
    // ============================================================
    function v5(){
      var targets=[
        {n:"單位產品能耗",cur:"0.842",u:"kWh/pc",tg:"0.800",pg:79,c:"t-info"},
        {n:"再生能源占比",cur:"18.5",u:"%",tg:"25",pg:74,c:"t-warn"},
        {n:"年減碳目標達成",cur:"83",u:"%",tg:"100",pg:83,c:"t-ok"},
        {n:"能源密集度改善",cur:"6.4",u:"%",tg:"8",pg:80,c:"t-acc"}
      ];
      var trows=targets.map(function(t){
        return '<div class="srow min0"><span class="nm">'+t.n+'</span><span style="font-size:12px;color:var(--muted)">目標 '+t.tg+' '+t.u+'</span><div class="bar" style="width:100px;margin-left:auto"><i style="width:'+t.pg+'%"></i></div><span class="vv">'+t.cur+' <small style="font-size:11px;color:var(--muted)">'+t.u+'</small></span></div>';
      }).join('');
      var html=head("碳排與能效指標","追蹤單位產品能耗、碳排放與減碳目標達成，回饋永續績效",{ic:"eco",t:"永續績效"})+
        '<div class="grid g-kpi" style="margin-bottom:14px">'+
          kpi("co2","本年累計碳排","2,184","tCO₂e","較基準 -11%","down")+
          kpi("energy_savings_leaf","累計節能","1.42","GWh","年度","up")+
          kpi("flag","減碳目標達成","83","%","超前 3%","up")+
          kpi("solar_power","再生能源占比","18.5","%","目標 25%","gup")+
        '</div>'+
        '<div class="grid g-2" style="margin-bottom:14px">'+
          '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">radar</span>各廠區能效綜合評分<span class="sp">滿分 100</span></div><div id="c5a" class="chart"></div></div></div>'+
          '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">show_chart</span>月碳排放趨勢 vs 目標路徑<span class="sp">tCO₂e</span></div><div id="c5b" class="chart"></div></div></div>'+
        '</div>'+
        '<div class="grid g-2">'+
          '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">track_changes</span>減碳與能效目標達成</div>'+trows+'<div class="note" style="margin-top:12px">依 ISO 50001 能源基線與 SBTi 減碳路徑檢視，目前整體進度超前季度里程碑。</div></div></div>'+
          '<div class="card min0"><div class="pad"><div class="card-title"><span class="material-symbols-outlined">layers</span>範疇別碳排放結構<span class="sp">tCO₂e</span></div><div id="c5c" class="chart"></div></div></div>'+
        '</div>';
      return {html:html,init:function(){
        var c5a=mk("c5a");
        if(c5a){c5a.setOption({tooltip:{},legend:{bottom:0,textStyle:{fontSize:11,color:"#666"}},
          radar:{indicator:[{name:"用電效率",max:100},{name:"再生能源",max:100},{name:"設備能效",max:100},{name:"需量管理",max:100},{name:"減碳達成",max:100},{name:"數據完整",max:100}],
            radius:"64%",axisName:{color:"#888",fontSize:11},splitLine:{lineStyle:{color:"#eee7f9"}},splitArea:{areaStyle:{color:["#faf9fe","#fff"]}}},
          series:[{type:"radar",data:[
            {value:[82,74,80,88,83,99],name:"A棟無塵室",itemStyle:{color:accent},areaStyle:{opacity:.25}},
            {value:[76,62,72,79,78,96],name:"B棟組裝廠",itemStyle:{color:accent2},areaStyle:{opacity:.18}}
          ]}]});
        }
        var c5b=mk("c5b");
        if(c5b){var mo=["1月","2月","3月","4月","5月","6月","7月","8月"];
          c5b.setOption({tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:11,color:"#666"}},
            grid:{left:44,right:14,top:32,bottom:24},
            xAxis:{type:"category",data:mo,axisLabel:{color:"#888",fontSize:10}},
            yAxis:{type:"value",splitLine:{lineStyle:{color:"#f0eef8"}},axisLabel:{color:"#888",fontSize:10}},
            series:[
              {name:"實際碳排",type:"bar",data:[298,286,272,264,258,246,238,232],itemStyle:{borderRadius:[3,3,0,0],color:accent2},barWidth:"48%"},
              {name:"目標路徑",type:"line",smooth:true,data:[300,290,280,270,260,250,240,230],symbol:"none",lineStyle:{width:2.5,color:"#ef4444",type:"dashed"}}
            ]});
        }
        var c5c=mk("c5c");
        if(c5c){c5c.setOption({tooltip:{trigger:"item",formatter:"{b}: {c} tCO₂e ({d}%)"},legend:{bottom:0,textStyle:{fontSize:11,color:"#666"}},color:[accent,accent2,"#c4b5fd"],
          series:[{type:"pie",radius:["48%","74%"],center:["50%","44%"],roseType:"radius",itemStyle:{borderColor:"#fff",borderWidth:2,borderRadius:4},label:{show:false},
            data:[{name:"範疇一 直接排放",value:486},{name:"範疇二 外購電力",value:1420},{name:"範疇三 其他間接",value:278}]}]});
        }
      }};
    }

    var SCREENS=[v0,v1,v2,v3,v4,v5];

    // ---------- nav + render ----------
    var navEl=document.getElementById("nav");
    var container=document.getElementById("app");
    MODS.forEach(function(m,i){
      var b=document.createElement("button");
      b.setAttribute("data-i",i);
      b.innerHTML='<span class="material-symbols-outlined">'+m.ic+'</span><span class="lbl">'+m.name+'</span>';
      b.addEventListener("click",function(){show(i);});
      navEl.appendChild(b);
    });

    var current=-1;
    function show(i){
      if(i===current)return;
      current=i;
      disposeAll();
      var btns=navEl.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
      var res=SCREENS[i]();
      container.innerHTML=res.html;
      void container.offsetHeight;
      if(res.init)res.init();
      try{window.scrollTo(0,0);}catch(e){}
    }
    window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
    show(0);

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
<script src="/shared/jv-agent-bridge.js?v=2" defer></script>
