<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>能源管理系統（Energy Management System, EMS）｜Jvision 系統 Demo</title>
  <meta name="description" content="碳盤查、能源監控到減碳目標的永續管理" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#059669;
      --color-on-primary:#000000;
      --color-secondary:#10b981;
      --color-on-secondary:#0f172a;
      --color-accent:#059669;
      --color-on-accent:#000000;
      --color-background:#ecfdf5;
      --color-foreground:#064e3b;
      --color-card:#ffffff;
      --color-card-foreground:#064e3b;
      --color-muted:#e8f1f3;
      --color-muted-foreground:#475569;
      --color-border:#a7f3d0;
      --color-destructive:#dc2626;
      --color-on-destructive:#ffffff;
      --color-ring:#059669;
      --blue:#059669;
      --ink:#064e3b;
      --muted:#475569;
      --line:#a7f3d0;
      --ok:#047857;
      --warn:#92400e;
      --bad:#b91c1c;
      --info:#1d4ed8;
      --solar:#fbbf24;
      --canvas:#d1fae5;
      --black:#052e26;
      --shadow:7px 7px 0 #064e3b;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    html,body{margin:0;min-height:100%}
    body{
      color:var(--ink);
      background-color:var(--color-background);
      background-image:
        linear-gradient(rgba(5,150,105,.11) 1px,transparent 1px),
        linear-gradient(90deg,rgba(5,150,105,.11) 1px,transparent 1px);
      background-size:32px 32px;
      font-family:"Space Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
      -webkit-font-smoothing:antialiased;
    }
    button,a{color:inherit}
    button{font:inherit}
    button,[role="button"]{cursor:pointer}
    :focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-size:20px;
      line-height:1;
      font-style:normal;
      font-weight:500;
      vertical-align:middle;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      color:#ecfdf5;
      background:var(--black);
      border-bottom:4px solid var(--solar);
    }
    .topbar-inner{
      max-width:1440px;
      min-height:78px;
      margin:auto;
      padding:12px 20px;
      display:flex;
      align-items:center;
      gap:20px;
    }
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .logo{
      width:48px;
      height:48px;
      flex:none;
      display:grid;
      place-items:center;
      color:var(--color-on-primary);
      background:var(--solar);
      border:2px solid #000;
      box-shadow:4px 4px 0 var(--color-primary);
    }
    .logo .material-symbols-outlined{font-size:29px;font-weight:700}
    h1,h2,h3,.brand-title{
      font-family:"Syncopate","Space Mono",sans-serif;
      text-transform:uppercase;
    }
    .brand-title{
      margin:0;
      color:#fff;
      font-size:15px;
      font-weight:700;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .brand-sub{margin-top:5px;color:#a7f3d0;font-size:11px}
    .topbar-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }
    .live-chip,.avatar{
      min-height:36px;
      padding:8px 11px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:#ecfdf5;
      background:#064e3b;
      border:1px solid #6ee7b7;
      font-size:11px;
      font-weight:700;
    }
    .live-dot{
      width:10px;
      height:10px;
      background:#34d399;
      border:2px solid #ecfdf5;
    }
    .avatar{
      width:40px;
      justify-content:center;
      padding:0;
      color:#000;
      background:var(--solar);
      border-color:#000;
    }
    .tabs-shell{background:var(--color-card);border-bottom:2px solid var(--ink)}
    nav.tabs{
      max-width:1440px;
      margin:auto;
      padding:0 20px;
      display:flex;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    nav.tabs button{
      min-height:52px;
      flex:1 0 auto;
      padding:10px 15px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:var(--muted);
      background:#fff;
      border:0;
      border-right:1px solid var(--line);
      border-bottom:6px solid transparent;
      font-size:12px;
      font-weight:700;
      transition:background-color .18s,color .18s;
    }
    nav.tabs button:first-child{border-left:1px solid var(--line)}
    nav.tabs button:hover{color:var(--ink);background:#d1fae5}
    nav.tabs button.active{
      color:#000;
      background:var(--solar);
      border-bottom-color:#000;
    }
    main{max-width:1440px;margin:auto;padding:26px 20px 64px}
    .view{animation:reveal .35s ease-out both}
    .page-head{
      margin:0 0 20px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:end;
      gap:16px;
    }
    .eyebrow{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:9px;
      color:var(--ok);
      font-size:11px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .eyebrow:before{content:"";width:34px;height:4px;background:var(--solar);border:1px solid #000}
    .page-head h2{
      margin:0;
      max-width:900px;
      color:var(--black);
      font-size:clamp(21px,3vw,37px);
      line-height:1.2;
      letter-spacing:-.035em;
    }
    .page-head p{max-width:850px;margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
    .pill{
      min-height:42px;
      padding:9px 12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#000;
      background:var(--solar);
      border:2px solid #000;
      box-shadow:4px 4px 0 var(--ink);
      font-size:11px;
      font-weight:700;
    }
    .grid{display:grid;gap:15px}
    .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-2-3{grid-template-columns:1.35fr 1fr}
    .g-3-2{grid-template-columns:1fr 1.35fr}
    .section-gap{margin-bottom:16px}
    .min0{min-width:0}
    .card,.kpi,.flow-step{
      background:var(--color-card);
      border:2px solid var(--ink);
      box-shadow:var(--shadow);
    }
    .pad{padding:17px}
    .card-title{
      min-height:32px;
      margin:0 0 12px;
      padding-bottom:10px;
      display:flex;
      align-items:center;
      gap:8px;
      border-bottom:2px solid var(--line);
      color:var(--black);
      font-size:13px;
      font-weight:700;
    }
    .card-title>.material-symbols-outlined{
      width:29px;
      height:29px;
      display:grid;
      place-items:center;
      color:#000;
      background:var(--solar);
      border:1px solid #000;
    }
    .card-title .sp{margin-left:auto;color:var(--muted);font-size:10px;font-weight:400}
    .kpi{
      min-height:174px;
      padding:15px;
      position:relative;
      overflow:hidden;
    }
    .kpi:before{
      content:"";
      position:absolute;
      top:0;
      right:0;
      width:35%;
      height:8px;
      background:var(--solar);
      border-left:2px solid var(--ink);
      border-bottom:2px solid var(--ink);
    }
    .kpi:nth-child(even):before{width:55%;background:var(--color-secondary)}
    .kpi .ic{
      width:40px;
      height:40px;
      margin-bottom:19px;
      display:grid;
      place-items:center;
      color:#fff;
      background:var(--ink);
      border:2px solid #000;
    }
    .kpi .lab{color:var(--muted);font-size:11px;font-weight:700}
    .kpi .val{
      margin-top:4px;
      color:var(--black);
      font-size:clamp(21px,2vw,29px);
      font-weight:700;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.05em;
    }
    .kpi .val small{color:var(--muted);font-size:11px;letter-spacing:0}
    .delta{
      margin-top:8px;
      display:inline-flex;
      align-items:center;
      gap:4px;
      font-size:10px;
      font-weight:700;
    }
    .delta .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)}
    .down{color:var(--bad)}
    .flat{color:var(--muted)}
    .chart{width:100%;height:285px}
    .chart.sm{height:230px}
    .chart.lg{height:340px}
    .table-wrap{overflow:auto;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{
      min-height:44px;
      padding:11px 12px;
      text-align:left;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      white-space:nowrap;
    }
    th:last-child,td:last-child{border-right:0}
    th{
      color:#fff;
      background:var(--ink);
      font-size:10px;
      font-weight:700;
      letter-spacing:.04em;
    }
    tbody tr:nth-child(even){background:#f0fdf4}
    tbody tr:hover{background:#d1fae5}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    td:first-child,.code,.mono,time{font-variant-numeric:tabular-nums}
    .tag{
      min-height:25px;
      padding:4px 8px;
      display:inline-flex;
      align-items:center;
      gap:5px;
      color:var(--ink);
      background:var(--color-muted);
      border:1px solid currentColor;
      font-size:10px;
      font-weight:700;
    }
    .tag:before{content:"";width:7px;height:7px;background:currentColor}
    .t-ok{color:#065f46;background:#d1fae5}
    .t-warn{color:#78350f;background:#fef3c7}
    .t-bad{color:#991b1b;background:#fee2e2}
    .t-info{color:#1e3a8a;background:#dbeafe}
    .t-acc{color:#065f46;background:#a7f3d0}
    .t-mut{color:#334155;background:#e2e8f0}
    .bar{height:11px;min-width:64px;background:#d7e7e5;border:1px solid var(--ink)}
    .bar>i{display:block;height:100%;background:var(--color-primary)}
    .flow-strip{margin-bottom:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .flow-step{padding:11px;box-shadow:3px 3px 0 var(--ink)}
    .flow-step .n{color:var(--ok);font-size:10px;font-weight:700}
    .flow-step .t{margin-top:4px;color:var(--black);font-size:12px;font-weight:700}
    .flow-step .r{margin-top:5px;color:var(--muted);font-size:9px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px}
    .col{padding:9px;background:var(--color-muted);border:2px solid var(--ink)}
    .col-h{
      margin-bottom:9px;
      padding:7px;
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--black);
      background:#fff;
      border:1px solid var(--ink);
      font-size:11px;
      font-weight:700;
    }
    .dot{width:10px;height:10px;background:currentColor;border:1px solid #000}
    .cnt{
      margin-left:auto;
      min-width:24px;
      padding:2px 6px;
      text-align:center;
      color:#fff;
      background:var(--ink);
    }
    .tk{
      margin-bottom:8px;
      padding:10px;
      background:#fff;
      border:1px solid var(--ink);
      border-left:7px solid var(--color-primary);
    }
    .tk:last-child{margin-bottom:0}
    .tk .code{color:var(--ok);font-size:10px;font-weight:700}
    .tk h4{margin:6px 0;color:var(--black);font-size:12px;line-height:1.4}
    .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:9px}
    .who{
      width:25px;
      height:25px;
      display:grid;
      place-items:center;
      color:#000;
      background:var(--solar);
      border:1px solid #000;
      font-weight:700;
    }
    .kwh{margin-left:auto;color:var(--black);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
    .srow{
      min-height:52px;
      padding:9px 4px;
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:1px dashed #6ee7b7;
      font-size:11px;
    }
    .srow:last-child{border-bottom:0}
    .srow .nm{min-width:0;color:var(--black);font-weight:700}
    .srow .vv{margin-left:auto;color:var(--black);font-weight:700;font-variant-numeric:tabular-nums}
    .tl{position:relative;padding-left:25px}
    .tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:3px;background:var(--ink)}
    .tl-item{position:relative;padding:0 0 18px 8px}
    .tl-item:before{
      content:"";
      position:absolute;
      top:3px;
      left:-24px;
      width:13px;
      height:13px;
      background:var(--solar);
      border:2px solid #000;
    }
    .tl-item .tm{color:var(--ok);font-size:10px;font-weight:700}
    .tl-item .tt{margin-top:3px;color:var(--black);font-size:12px;font-weight:700}
    .tl-item .td{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.55}
    .project{
      margin-bottom:10px;
      padding:13px;
      background:#f0fdf4;
      border:1px solid var(--ink);
    }
    .project:last-child{margin-bottom:0}
    .project-top,.project-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .project-top b{font-size:12px}
    .project-top .owner{margin-left:auto;color:var(--muted);font-size:10px}
    .project-meta{margin-top:11px;font-size:10px}
    .project-meta .progress{min-width:150px;flex:1;display:flex;align-items:center;gap:7px}
    .note{color:var(--muted);font-size:10px;line-height:1.7}
    .foot{
      max-width:1440px;
      margin:auto;
      padding:24px 20px 42px;
      color:#065f46;
      border-top:2px solid var(--ink);
      font-size:10px;
      text-align:center;
    }
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1024px){
      .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g-2,.g-2-3,.g-3-2{grid-template-columns:1fr}
      .flow-strip{grid-template-columns:repeat(3,1fr)}
      .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
    }
    @media(max-width:768px){
      .topbar-inner{align-items:flex-start;flex-wrap:wrap}
      .topbar-right{width:100%;margin:0;justify-content:flex-start}
      .page-head{grid-template-columns:1fr;align-items:start}
      .pill{justify-self:start}
      main{padding-inline:14px}
      nav.tabs{padding-inline:14px}
      .flow-strip{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:560px){
      .brand-sub{display:none}
      .brand-title{font-size:12px}
      .live-chip:nth-child(2){display:none}
      nav.tabs button{min-width:52px;padding-inline:13px}
      nav.tabs .lbl{display:none}
      .g-kpi{grid-template-columns:1fr}
      .flow-strip,.board{grid-template-columns:1fr}
      .kpi{min-height:150px}
      .chart,.chart.lg{height:285px}
      .srow{align-items:flex-start;flex-wrap:wrap}
      .srow .vv{margin-left:0}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      .view{animation:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand min0">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">bolt</span></div>
        <div class="min0">
          <div class="brand-title">能源管理系統 EMS</div>
          <div class="brand-sub">碳盤查・能源監控・減碳目標的永續管理平台</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="live-chip"><span class="live-dot" aria-hidden="true"></span>即時連線 · IoT Gateway</div>
        <div class="live-chip">南科三廠</div>
        <div class="avatar" aria-label="目前使用者：廠務">廠務</div>
      </div>
    </div>
    <div class="tabs-shell"><nav class="tabs" id="nav" aria-label="能源管理功能"></nav></div>
  </header>

  <main id="app"></main>
  <footer class="foot">Jvision 系統 Demo · 能源管理系統（EMS）· 全為示意假資料，無後端串接</footer>

  <script>
  (function(){
    "use strict";

    var accent="#059669",accent2="#10b981",solar="#fbbf24",ink="#064e3b";
    var charts=[];
    var palette=[accent,accent2,"#34d399","#6ee7b7",solar,"#0f766e"];
    var esc=function(s){
      return String(s).replace(/[&<>"]/g,function(m){
        return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];
      });
    };

    function disposeAll(){
      charts.forEach(function(c){try{c.dispose();}catch(e){}});
      charts=[];
    }
    function mk(id){
      var el=document.getElementById(id);
      if(!el)return null;
      var c=echarts.init(el);
      charts.push(c);
      return c;
    }
    function axes(){
      return{
        axisLine:{lineStyle:{color:"#6ee7b7"}},
        axisLabel:{color:"#475569",fontFamily:"Space Mono",fontSize:10},
        splitLine:{lineStyle:{color:"#d1fae5"}}
      };
    }

    var MODS=[
      {ic:"dashboard",name:"能耗即時看板",sub:"全廠用電/用能即時監控看板"},
      {ic:"pie_chart",name:"分項能耗分析",sub:"分區/分設備能耗結構拆解"},
      {ic:"electric_meter",name:"需量與尖峰管理",sub:"契約容量與需量預測控制"},
      {ic:"notification_important",name:"異常耗能告警",sub:"耗能異常偵測與告警派工"},
      {ic:"savings",name:"節能專案追蹤",sub:"節能對策執行與效益驗證"},
      {ic:"eco",name:"碳排與能效指標",sub:"單位產品能耗與碳排放追蹤"}
    ];

    function icon(name){
      return '<span class="material-symbols-outlined" aria-hidden="true">'+name+'</span>';
    }
    function kpi(ic,lab,val,unit,delta,dir){
      var map={
        up:["trending_up","up"],
        down:["trending_down","down"],
        gup:["arrow_upward","down"],
        gdown:["arrow_downward","up"],
        flat:["remove","flat"]
      };
      var state=map[dir]||map.flat;
      return '<article class="kpi min0"><div class="ic">'+icon(ic)+'</div>'+
        '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
        '<div class="delta '+state[1]+'">'+icon(state[0])+delta+'</div></article>';
    }
    function head(title,sub,pill){
      return '<div class="page-head"><div class="min0"><div class="eyebrow">Energy intelligence / 2026</div>'+
        '<h2>'+title+'</h2><p>'+sub+'</p></div>'+
        '<div class="pill">'+icon(pill.ic)+pill.t+'</div></div>';
    }
    function card(title,ic,id,size,sp){
      return '<section class="card min0"><div class="pad"><div class="card-title">'+icon(ic)+title+
        (sp?'<span class="sp">'+sp+'</span>':'')+'</div><div id="'+id+'" class="chart '+(size||"")+'"></div></div></section>';
    }

    function v0(){
      var lanes=[
        {t:"正常運轉",c:"#047857",cards:[]},
        {t:"接近上限",c:"#92400e",cards:[]},
        {t:"超標告警",c:"#b91c1c",cards:[]},
        {t:"停機/待機",c:"#475569",cards:[]}
      ];
      var data=[
        [0,"AHU-A1","A棟空調主機","廠","412 kW","負載 68% · 溫度 22°C"],
        [0,"CHW-02","二號冰水主機","廠","388 kW","COP 4.6 · 正常"],
        [0,"AIR-C1","無塵室空壓站","設","296 kW","壓力 7.2 bar"],

            tooltip:{formatter:function(p){return cats[p.data.value[0]]+"<br>第 "+p.data.value[1]+"～"+p.data.value[2]+" 月"}},
            xAxis:Object.assign({type:"value",min:6,max:13,interval:1,axisLabel:{formatter:"{value}月",color:"#475569",fontSize:9}},axes()),
            yAxis:{type:"category",data:cats,axisLabel:{color:"#475569",fontSize:9},axisTick:{show:false}},
            series:[{type:"custom",renderItem:function(params,api){
              var y=api.value(0),start=api.coord([api.value(1),y]),end=api.coord([api.value(2),y]),h=api.size([0,1])[1]*.52;
              return{type:"rect",shape:{x:start[0],y:start[1]-h/2,width:end[0]-start[0],height:h},style:api.style({stroke:ink,lineWidth:1})};
            },encode:{x:[1,2],y:0},data:data}]
          });
        }
        c=mk("c4b");
        if(c)c.setOption({
          grid:{left:52,right:20,top:20,bottom:46},
          tooltip:{formatter:function(p){return p.data[3]+"<br>投資 "+p.data[0]+" 萬 · 回收 "+p.data[1]+" 年 · 年省 "+p.data[2]+" 萬"}},
          xAxis:Object.assign({name:"投資額 (萬)",nameLocation:"middle",nameGap:28,type:"value"},axes()),
          yAxis:Object.assign({name:"回收年限",type:"value",min:2,max:4},axes()),
          series:[{type:"scatter",symbol:"rect",symbolSize:function(d){return Math.sqrt(d[2])*5},
            data:[[180,2.9,62,"冰水群控"],[240,2.7,88,"空壓變頻"],[95,2.3,41,"照明LED"],[320,3.3,96,"熱回收"],[130,3.4,38,"馬達汰換"]],
            itemStyle:{color:accent,borderColor:ink,borderWidth:2,opacity:.9},
            label:{show:true,formatter:function(d){return d.data[3]},position:"top",color:ink,fontFamily:"Space Mono",fontSize:9}}]
        });
      }};
    }

    function v5(){
      var targets=[
        ["單位產品能耗","0.842","kWh/pc","0.800",79],
        ["再生能源占比","18.5","%","25",74],
        ["年減碳目標達成","83","%","100",83],
        ["能源密集度改善","6.4","%","8",80]
      ];
      var rows=targets.map(function(t){
        return '<div class="srow"><span class="nm">'+t[0]+'</span><span style="color:var(--muted)">目標 '+t[3]+' '+t[2]+'</span>'+
          '<div class="bar" style="width:100px;margin-left:auto"><i style="width:'+t[4]+'%"></i></div>'+
          '<span class="vv">'+t[1]+' <small>'+t[2]+'</small></span></div>';
      }).join("");

      var html=head("碳排與能效指標","追蹤單位產品能耗、碳排放與減碳目標達成，回饋永續績效",{ic:"eco",t:"永續績效"})+
        '<div class="grid g-kpi section-gap">'+
          kpi("co2","本年累計碳排","2,184","tCO₂e","較基準 -11%","down")+
          kpi("energy_savings_leaf","累計節能","1.42","GWh","年度","up")+
          kpi("flag","減碳目標達成","83","%","超前 3%","up")+
          kpi("solar_power","再生能源占比","18.5","%","目標 25%","gup")+
        '</div><div class="grid g-2 section-gap">'+
          card("各廠區能效綜合評分","radar","c5a","","滿分 100")+
          card("月碳排放趨勢 vs 目標路徑","show_chart","c5b","","tCO₂e")+
        '</div><div class="grid g-2"><section class="card"><div class="pad"><div class="card-title">'+icon("track_changes")+
          '減碳與能效目標達成</div>'+rows+'<div class="note" style="margin-top:12px">依 ISO 50001 能源基線與 SBTi 減碳路徑檢視，目前整體進度超前季度里程碑。</div>'+
          '</div></section>'+card("範疇別碳排放結構","layers","c5c","","tCO₂e")+'</div>';

      return{html:html,init:function(){
        var c=mk("c5a");
        if(c)c.setOption({
          tooltip:{},legend:{bottom:0,textStyle:{fontFamily:"Space Mono",fontSize:9,color:"#475569"}},
          radar:{radius:"64%",axisName:{color:"#475569",fontSize:9},
            splitLine:{lineStyle:{color:"#6ee7b7"}},splitArea:{areaStyle:{color:["#ecfdf5","#fff"]}},
            indicator:[{name:"用電效率",max:100},{name:"再生能源",max:100},{name:"設備能效",max:100},{name:"需量管理",max:100},{name:"減碳達成",max:100},{name:"數據完整",max:100}]},
          series:[{type:"radar",data:[
            {value:[82,74,80,88,83,99],name:"A棟無塵室",itemStyle:{color:accent},lineStyle:{width:3},areaStyle:{opacity:.25}},
            {value:[76,62,72,79,78,96],name:"B棟組裝廠",itemStyle:{color:solar},lineStyle:{width:3},areaStyle:{opacity:.18}}
          ]}]
        });
        c=mk("c5b");
        if(c)c.setOption({
          tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontFamily:"Space Mono",fontSize:9,color:"#475569"}},
          grid:{left:44,right:13,top:34,bottom:24},
          xAxis:Object.assign({type:"category",data:["1月","2月","3月","4月","5月","6月","7月","8月"]},axes()),
          yAxis:Object.assign({type:"value"},axes()),
          series:[
            {name:"實際碳排",type:"bar",barWidth:"48%",data:[298,286,272,264,258,246,238,232],itemStyle:{color:accent,borderColor:ink,borderWidth:1}},
            {name:"目標路徑",type:"line",data:[300,290,280,270,260,250,240,230],symbol:"rect",symbolSize:6,lineStyle:{width:3,color:"#dc2626",type:"dashed"}}
          ]
        });
        c=mk("c5c");
        if(c)c.setOption({
          tooltip:{trigger:"item",formatter:"{b}: {c} tCO₂e ({d}%)"},
          legend:{bottom:0,textStyle:{fontFamily:"Space Mono",fontSize:9,color:"#475569"}},
          color:[accent,accent2,solar],
          series:[{type:"pie",radius:["48%","74%"],center:["50%","43%"],roseType:"radius",label:{show:false},
            itemStyle:{borderColor:"#fff",borderWidth:3},
            data:[{name:"範疇一 直接排放",value:486},{name:"範疇二 外購電力",value:1420},{name:"範疇三 其他間接",value:278}]}]
        });
      }};
    }

    var SCREENS=[v0,v1,v2,v3,v4,v5];
    var nav=document.getElementById("nav");
    var app=document.getElementById("app");
    var current=-1;

    MODS.forEach(function(m,i){
      var b=document.createElement("button");
      b.type="button";
      b.setAttribute("data-i",i);
      b.setAttribute("aria-label",m.name+"："+m.sub);
      b.innerHTML=icon(m.ic)+'<span class="lbl">'+m.name+'</span>';
      b.addEventListener("click",function(){
        if(location.hash!=="#v"+i)location.hash="v"+i;
        else show(i);
      });
      nav.appendChild(b);
    });

    function show(i){
      if(i===current)return;
      current=i;
      disposeAll();
      Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
        var active=Number(b.getAttribute("data-i"))===i;
        b.classList.toggle("active",active);
        b.setAttribute("aria-current",active?"page":"false");
      });
      var screen=SCREENS[i]();
      app.innerHTML='<div class="view">'+screen.html+'</div>';
      if(screen.init)screen.init();
      try{window.scrollTo(0,0)}catch(e){}
    }

    function fromHash(){
      var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      show(match?Math.min(Number(match[1]),SCREENS.length-1):0);
    }

    var resizeQueued=false;
    window.addEventListener("resize",function(){
      if(resizeQueued)return;
      resizeQueued=true;
      requestAnimationFrame(function(){
        charts.forEach(function(c){try{c.resize()}catch(e){}});
        resizeQueued=false;
      });
    });
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
</html>
