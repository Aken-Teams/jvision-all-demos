<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>勞工健檢與職業病管理 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&amp;family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#D7FAF4;
  --hov:#E6FFFA;
  --track:#CDE7E5;
  --sidebar:#0F3D3A;
  --sidebar2:#134E4A;
  --side-edge:#000000;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#075985;
  --r:0px;
  --glow:rgba(13,148,136,.24);
  --shadow:6px 6px 0 #134E4A;
  --shadow-small:3px 3px 0 #134E4A;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(rgba(19,78,74,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(19,78,74,.075) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,b,strong{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-weight:700;
}
h1,h2,h3,h4,p{margin-top:0}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:4px solid var(--color-ring)!important;
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff;
}
::selection{background:var(--color-secondary);color:#000}

.app{display:flex;min-height:100vh}
.sidebar{
  width:268px;
  flex:none;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  padding:22px 18px;
  overflow:auto;
  color:#fff;
  background:var(--sidebar);
  border-right:4px solid #000;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  margin:-22px -18px 24px;
  padding:22px 18px;
  background:var(--color-secondary);
  color:#000;
  border-bottom:4px solid #000;
}
.brand-logo{
  width:46px;
  height:46px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-accent);
  border:3px solid #000;
  box-shadow:4px 4px 0 #000;
}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;line-height:1.05;letter-spacing:.02em}
.brand-txt span{
  display:block;
  margin-top:4px;
  color:#0F172A;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.11em;
}
.nav{display:flex;flex-direction:column;gap:9px;min-width:0}
.nav button{
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border:2px solid #5EEAD4;
  border-radius:0;
  background:transparent;
  color:#ECFEFF;
  text-align:left;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  font-weight:600;
  box-shadow:none;
  transition:background-color 180ms ease,color 180ms ease,transform 180ms ease,box-shadow 180ms ease;
}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button:hover{background:#CCFBF1;color:#0F172A;transform:translate(-2px,-2px);box-shadow:4px 4px 0 #000}
.nav button.on{background:var(--color-accent);color:#000;border-color:#000;box-shadow:5px 5px 0 #000;font-weight:700}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Cinzel",monospace;
  font-size:10px;
  font-weight:600;
  opacity:.8;
}
.side-foot{
  margin-top:auto;
  padding:18px 2px 2px;
  border-top:2px solid var(--color-border);
  color:#CCFBF1;
  font-size:12px;
  line-height:1.65;
}
.side-foot b{color:#fff;font-family:"Crimson Pro","Noto Sans TC",serif}

.main{flex:1;min-width:0;padding:26px 30px 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:24px;
  padding:18px 20px;
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--ink);
  font-size:clamp(25px,2.6vw,38px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.025em;
}
.topbar h1 .material-symbols-outlined{
  width:40px;
  height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--color-primary);
  color:#000;
  border:2px solid #000;
  font-size:25px;
}
.topbar .sub{margin-top:8px;color:var(--muted);font-size:13px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  min-height:36px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 10px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  color:var(--ink);
  font-size:12px;
  font-weight:700;
}
.chip .dot{
  width:10px;
  height:10px;
  background:var(--ok);
  border:2px solid #000;
}
.avatar{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--color-accent);
  color:#000;
  border:2px solid #000;
  font-family:"Cinzel",serif;
  font-weight:700;
}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  background:var(--panel);
  color:var(--color-card-foreground);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:var(--shadow-small);
}
.card,.sec{padding:16px}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  color:var(--ink);
  font-size:17px;
  font-weight:700;
  line-height:1.15;
}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:21px;
}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
  flex-wrap:wrap;
}
.card-h .hint{
  padding:3px 7px;
  background:var(--color-muted);
  border:1px solid var(--ink);
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.kpi,.stat{position:relative;overflow:hidden;padding:15px 16px;border-top-width:7px}
.kpi:nth-child(even),.stat:nth-child(even){border-top-color:var(--color-accent)}
.kpi:nth-child(odd),.stat:nth-child(odd){border-top-color:var(--color-primary)}
.kpi::after{
  content:"";
  position:absolute;
  right:-20px;
  top:-24px;
  width:72px;
  height:72px;
  background:var(--accent-soft);
  border:2px solid var(--ink);
  transform:rotate(14deg);
}
.kpi .ico{
  width:38px;
  height:38px;
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--color-secondary);
  color:#000;
  border:2px solid #000;
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:16px;color:var(--color-primary)}
.kpi .val,.stat .val{
  margin-top:3px;
  color:var(--ink);
  font-family:"Cinzel","Courier New",monospace;
  font-size:clamp(24px,2.4vw,32px);
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.04em;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Crimson Pro","Noto Sans TC",serif;font-size:13px;font-weight:700;letter-spacing:0}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:5px;
  padding:2px 6px;
  border:1px solid currentColor;
  background:#fff;
  font-size:11px;
  font-weight:700;
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0 .card-h{margin-bottom:0!important;padding:14px 16px!important;background:var(--th);border-bottom:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:10px 12px;
  background:var(--sidebar);
  color:#fff;
  border-right:1px solid #5EEAD4;
  border-bottom:3px solid #000;
  text-align:left;
  white-space:nowrap;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
th:last-child{border-right:none}
td{
  padding:10px 12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fff;
  white-space:nowrap;
  vertical-align:middle;
}
td:last-child{border-right:none}
tbody tr:nth-child(even) td{background:#F7FFFD}
tbody tr:hover td{background:#CCFBF1}
tr:last-child td{border-bottom:none}
td:nth-child(n+3){font-variant-numeric:tabular-nums lining-nums}
td:has(.prog),td:has(.band){min-width:130px}
.mono{
  font-family:"Courier New",monospace;
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:.02em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:2px solid currentColor;
  border-radius:0;
  background:#fff;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}
.t-ok{background:#DCFCE7;color:#166534}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#B91C1C}
.t-info{background:#E0F2FE;color:#075985}
.t-gray{background:#F1F5F9;color:#475569}
.t-acc,.t-pink{background:#CCFBF1;color:#0F766E}

.bar{height:10px;min-width:58px;overflow:hidden;background:var(--track);border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--color-primary);border-right:2px solid var(--ink)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{
  width:40px;
  flex:none;
  color:var(--ink);
  font-family:"Courier New",monospace;
  font-size:11px;
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  left:-29px;
  top:1px;
  width:17px;
  height:17px;
  background:#fff;
  border:4px solid var(--color-primary);
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Courier New",monospace;font-size:11px;font-weight:700}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}

.chk{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:45px;
  padding:9px 3px;
  border-bottom:2px dashed var(--line);
  font-size:13px;
}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:21px;flex:none}
.chk .ok{color:#15803D}
.chk .wait{color:#475569}
.chk .bad{color:#DC2626}
.chk .warn{color:#B45309}
.chk .n{flex:1;min-width:0;font-weight:600}
.chk small{color:var(--muted);font-size:11px;text-align:right}
.note{
  margin-top:13px;
  padding:12px;
  background:#FFFBEB;
  color:#713F12;
  border:2px solid var(--color-accent);
  font-size:12px;
  font-weight:600;
  line-height:1.65;
}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:10px;padding:11px;background:var(--th);border:2px solid var(--ink)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 7px;font-size:14px;font-weight:700}
.col-h .cnt{padding:1px 7px;background:#fff;border:2px solid var(--ink);color:var(--ink);font-family:"Courier New",monospace;font-size:11px}
.pcard{padding:11px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--color-primary);box-shadow:3px 3px 0 var(--ink)}
.pcard b{font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--color-secondary);
  color:#000;
  border:1px solid #000;
  font-weight:800;
}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--color-accent);color:#000;border:2px solid #000;font-family:"Cinzel",monospace;font-weight:700;font-size:13px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:24px;height:24px;z-index:1;display:flex;align-items:center;justify-content:center;background:#fff;color:#475569;border:2px solid var(--ink);font-family:"Courier New",monospace;font-size:11px}
.steps .ln{width:20px;height:3px;background:var(--line)}
.steps .s.done{background:var(--color-primary);color:#000;border-color:#000}
.steps .s.cur{background:#FEF3C7;color:#92400E;border-color:#92400E}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:2px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{height:10px;position:relative;overflow:hidden;background:var(--track);border:1px solid var(--ink)}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Courier New",monospace;font-size:10px;text-align:right}
.band{position:relative;height:27px;min-width:150px;background:var(--track);border:1px solid var(--ink)}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft2)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.band .me{position:absolute;top:3px;width:12px;height:19px;background:var(--color-accent);border:1px solid #000}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px}
.tile .ti{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--color-secondary);color:#000;border:2px solid #000}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{font-size:15px}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.tile .tv{color:var(--ink);font-family:"Cinzel","Courier New",monospace;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important}
.apexcharts-canvas{max-width:100%!important}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr);gap:17px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:1/-1;grid-row:2}
  #screen>*:nth-child(3){grid-column:1/-1}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}

.grid.g4:first-child{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  padding:0;
  overflow:hidden;
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{
  min-width:0;
  padding:16px 17px;
  background:transparent;
  border:0;
  border-right:2px solid var(--ink);
  border-top:7px solid var(--color-primary);
  box-shadow:none;
}
.grid.g4:first-child>*:nth-child(even){border-top-color:var(--color-accent)}
.grid.g4:first-child>*:last-child{border-right:0}
.grid.g4:first-child>.tile .ti,.grid.g4:first-child>.kpi .ico{width:34px;height:34px}
.grid.g4:first-child>.tile{gap:5px}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
