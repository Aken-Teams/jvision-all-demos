<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>包裝減量與綠色包裝設計 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:#059669;
  --accent2:#10b981;
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:#ecfdf5;
  --panel:#ffffff;
  --th:#f0fdf4;
  --hov:#ecfdf5;
  --track:#dbe9e5;
  --sidebar:#043f31;
  --sidebar2:#065f46;
  --side-edge:rgba(255,255,255,.14);
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#0369a1;
  --r:20px;
  --shadow:0 12px 36px rgba(6,78,59,.08),0 2px 8px rgba(6,78,59,.05);
  --shadow-hover:0 18px 42px rgba(6,78,59,.13),0 4px 12px rgba(6,78,59,.07);
  --glow:rgba(16,185,129,.24);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  background:
    radial-gradient(circle at 96% 3%,rgba(16,185,129,.14),transparent 25rem),
    radial-gradient(circle at 8% 86%,rgba(5,150,105,.09),transparent 30rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans",sans-serif;color:var(--ink)}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:8px}
::selection{color:#022c22;background:#6ee7b7}

.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;
  flex:none;
  min-width:0;
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  overflow:hidden;
  color:#ecfdf5;
  border-right:1px solid var(--side-edge);
  background:
    radial-gradient(circle at 15% 5%,rgba(110,231,183,.18),transparent 10rem),
    linear-gradient(165deg,var(--sidebar),var(--sidebar2));
}
.sidebar::before,.sidebar::after{content:"";position:absolute;pointer-events:none;border:1px solid rgba(167,243,208,.16);border-radius:46% 54% 68% 32%/52% 34% 66% 48%}
.sidebar::before{width:210px;height:210px;right:-128px;top:27%}
.sidebar::after{width:160px;height:160px;left:-105px;bottom:9%}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-width:0;padding:3px 7px 22px}
.brand-logo{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:#022c22;border:1px solid rgba(255,255,255,.28);border-radius:45% 55% 58% 42%/55% 43% 57% 45%;background:linear-gradient(135deg,#6ee7b7,#10b981);box-shadow:0 10px 28px rgba(0,0,0,.2)}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#fff;font-size:16px;font-weight:700;letter-spacing:.03em}
.brand-txt span{display:block;margin-top:2px;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:10px;letter-spacing:.12em}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:5px}
.nav button{display:flex;align-items:center;gap:11px;min-width:0;min-height:46px;padding:11px 12px;color:#d1fae5;text-align:left;border:1px solid transparent;border-radius:14px;background:transparent;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#fff;border-color:rgba(167,243,208,.22);background:rgba(255,255,255,.09);transform:translateX(2px)}
.nav button.on{color:#022c22;border-color:#6ee7b7;background:linear-gradient(135deg,#a7f3d0,#6ee7b7);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.nav button.on .material-symbols-outlined{font-variation-settings:"FILL" 1}
.nav .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nav .idx{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;opacity:.7}
.side-foot{position:relative;z-index:1;margin-top:auto;padding:15px 9px 2px;color:#bbf7d0;border-top:1px solid rgba(255,255,255,.14);font-size:11px;line-height:1.75}
.side-foot b{color:#fff;font-family:"Fira Code",monospace}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;padding:2px 1px;flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:700;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;color:#047857;border:1px solid var(--line);border-radius:42% 58% 55% 45%/55% 42% 58% 45%;background:#d1fae5;font-size:22px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 12px;color:#334155;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.86);box-shadow:0 2px 8px rgba(6,78,59,.04);font-size:11.5px;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(5,150,105,.14);animation:pulse 2s ease-in-out infinite}
.avatar{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;color:#022c22;border:1px solid #34d399;border-radius:44% 56% 60% 40%/55% 42% 58% 45%;background:linear-gradient(135deg,#a7f3d0,#34d399);font-weight:700}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.86)}}

.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.card,.sec{min-width:0;padding:18px;border-radius:var(--r)}
.card,.sec,.tile,.kpi,.stat{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.card:hover,.sec:hover,.tile:hover,.kpi:hover,.stat:hover{border-color:#6ee7b7;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.sec{margin-bottom:15px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{min-width:0;color:#064e3b}
.card-h .hint{color:var(--muted);font-size:11.5px}

.kpi,.stat{position:relative;min-width:0;overflow:hidden;padding:16px 17px;border-radius:18px 22px 17px 21px}
.kpi::after{content:"";position:absolute;right:-24px;top:-27px;width:92px;height:92px;border-radius:42% 58% 65% 35%/55% 41% 59% 45%;background:linear-gradient(145deg,#d1fae5,#ecfdf5);opacity:.9;transform:rotate(18deg)}
.kpi .ico{position:relative;z-index:1;width:39px;height:39px;display:flex;align-items:center;justify-content:center;color:#047857;border:1px solid #a7f3d0;border-radius:44% 56% 62% 38%/56% 43% 57% 44%;background:#d1fae5}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:11px;color:var(--muted);font-size:12px;font-weight:500}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val{margin-top:3px;color:#064e3b;font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11.5px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#b91c1c}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0 .card-h{padding:18px 18px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:11px 14px;color:#334155;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--th);font-size:11px;font-weight:700;letter-spacing:.025em;text-align:left;white-space:nowrap}
th:first-child{padding-left:18px}
th:last-child{padding-right:18px}
td{padding:11px 14px;color:#153f35;border-bottom:1px solid #d8f5e7;white-space:nowrap}
td:first-child{padding-left:18px}
td:last-child{padding-right:18px}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--hov)}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
.mono,td:first-child{font-family:"Fira Code",monospace;font-weight:500;letter-spacing:.01em}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.t-ok{color:#065f46;border-color:#86efac;background:#dcfce7}
.t-warn{color:#854d0e;border-color:#fde68a;background:#fef9c3}
.t-bad{color:#991b1b;border-color:#fecaca;background:#fee2e2}
.t-info{color:#075985;border-color:#bae6fd;background:#e0f2fe}
.t-gray{color:#475569;border-color:#cbd5e1;background:#f1f5f9}
.t-acc,.t-pink{color:#065f46;border-color:#a7f3d0;background:#d1fae5}

.bar{height:8px;min-width:56px;overflow:hidden;border-radius:999px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#047857,#34d399)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-25px;top:3px;width:14px;height:14px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line);border-radius:18px 22px 17px 20px;background:rgba(240,253,244,.85)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;color:var(--muted);border:1px solid var(--line);border-radius:999px;background:#fff;font-family:"Fira Code",monospace;font-size:10.5px}
.pcard{padding:12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px 17px 13px 15px;background:#fff;box-shadow:0 4px 14px rgba(6,78,59,.05)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#065f46;border:1px solid #a7f3d0;border-radius:45% 55% 58% 42%;background:#d1fae5;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:15px 20px 16px 18px;background:#fff}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;color:#065f46;border:1px solid #a7f3d0;border-radius:44% 56% 58% 42%;background:#d1fae5;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:23px;height:23px;z-index:1;display:flex;align-items:center;justify-content:center;color:#64748b;border:2px solid #cbd5e1;border-radius:50%;background:#fff;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:#cbd5e1}
.steps .s.done{color:#fff;border-color:#047857;background:#047857}
.steps .s.cur{color:#047857;border-color:#047857;box-shadow:0 0 0 4px rgba(5,150,105,.12);animation:pulse 1.6s infinite}
.steps .ln.done{background:#047857}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;border-radius:999px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#047857,#34d399)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right}
.band{position:relative;height:27px;min-width:150px;border-radius:999px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:999px;background:#a7f3d0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:12px;height:21px;border-radius:999px;background:#047857;box-shadow:0 2px 6px var(--glow)}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;padding:17px 18px;border-radius:19px 24px 18px 22px}
.tile::after{content:"";position:absolute;right:-33px;bottom:-43px;width:104px;height:104px;border:1px solid #d1fae5;border-radius:42% 58% 64% 36%/54% 40% 60% 46%;transform:rotate(-18deg)}
.tile .ti{position:relative;z-index:1;width:39px;height:39px;display:flex;align-items:center;justify-content:center;color:#047857;border:1px solid #a7f3d0;border-radius:45% 55% 60% 40%/56% 42% 58% 44%;background:#d1fae5}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{position:relative;z-index:1;font-size:13.5px;font-weight:700}
.tile p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}
.tile .tv{position:relative;z-index:1;color:#064e3b;font-family:"Fira Code",monospace;font-size:22px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.apexcharts-canvas text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:15px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:2;grid-row:1/span 99;display:flex;flex-direction:column;gap:12px;position:sticky;top:18px}
  #screen>.grid.g4:first-child>*{width:100%}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:7px;border-right:none;border-bottom:1px solid var(--side-edge)}
  .sidebar::before,.sidebar::after{display:none}
  .brand{padding:0 12px 0 3px}
  .brand-logo{width:39px;height:39px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}
  .nav button{min-height:42px;padding:9px 11px}
  .nav .idx{display:none}
  .main{padding:21px 16px 48px}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:700px){.dl{grid-template-columns:1fr;gap:2px 0}.dl dt{margin-top:9px}}
@media(max-width:560px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
  .nav button{flex:1 1 42px;justify-content:center;padding:9px}
  .nav button .txt{display:none}
  .topbar{align-items:flex-start}
  .topbar h1{font-size:19px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .tile{padding:15px}
  .tile .tv{font-size:19px}
  .kpi .val,.stat .val{font-size:21px}
}
@media(max-width:390px){.main{padding-inline:12px}.g4{gap:10px}.tile,.kpi,.stat{padding:13px}.chip{padding-inline:9px;font-size:10.5px}}

   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
