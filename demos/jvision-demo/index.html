<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業提案與會簽追蹤系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;

  --bg:#F0FDFA;
  --card:#FFFFFF;
  --primary-soft:#CCFBF1;
  --accent-soft:#FFEDD5;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --purple:#6D28D9;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --transition:180ms ease;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"],.kcard,.doc-cat,.doc-item,.chan{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,.kcard:focus-visible,.doc-cat:focus-visible,.doc-item:focus-visible,.chan:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.mono,.kc-id,.code,tbody td:first-child,.msg-head span{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--color-border);
}
.topbar-inner{
  width:min(1400px,100%);
  min-height:66px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-badge{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:var(--radius-sm);
  color:#fff;
  background:var(--color-primary);
  border:2px solid #0F766E;
}
.brand-badge .ms{font-size:23px}
.brand-txt{min-width:0}
.brand-name{
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand-sub{color:var(--muted);font-size:11px;white-space:nowrap}
.topbar-spacer{flex:1}
.top-user{display:flex;align-items:center;gap:9px}
.avatar,.av{
  display:inline-grid;
  place-items:center;
  flex:none;
  color:#fff;
  font-weight:700;
}
.avatar{width:36px;height:36px;border-radius:9px;background:#0F766E;font-size:13px}
.top-user-meta{font-size:12px;line-height:1.35}
.top-user-meta b{display:block;color:var(--ink);font-size:12px}
.top-user-meta span{color:var(--muted)}
.nav{
  width:min(1400px,100%);
  margin:auto;
  padding:0 24px 12px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:42px;
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 13px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color var(--transition),color var(--transition),border-color var(--transition);
}
.nav button:hover{background:var(--primary-soft);color:#115E59}
.nav button.active{
  background:var(--color-primary);
  border-color:#0F766E;
  color:#fff;
}
.nav button.active .ms{font-variation-settings:"FILL" 1}
main{width:min(1400px,100%);margin:auto;padding:18px 24px 64px}
.screen-head{
  margin:4px 0 18px;
  padding:19px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-left:5px solid var(--color-primary);
  border-radius:var(--radius-md);
}
.screen-head h1{margin:0;color:var(--ink);font-size:clamp(20px,2vw,25px);line-height:1.3}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  flex:none;
  padding:5px 9px;
  border-radius:6px;
  background:var(--primary-soft);
  color:#115E59;
  font-size:11px;
  font-weight:700;
}
.pill .ms{font-size:15px}
.grid{display:grid;gap:14px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card,.kpi{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
}
.card{padding:18px}
.card-title{
  min-height:26px;
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}
.card-title>.ms{color:var(--color-primary)}
.card-title .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.kpi{
  position:relative;
  overflow:hidden;
  padding:16px;
  border-top:4px solid var(--color-primary);
}
.kpi .k-ico,.k-ico{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:var(--radius-sm);
  background:var(--primary-soft);
  color:#0F766E;
}
.kpi .k-val{
  margin-top:12px;
  color:var(--ink);
  font-size:25px;
  font-weight:700;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .k-lab{margin-top:4px;color:var(--muted);font-size:12px}
.k-delta{
  margin-top:8px;
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
}
.k-delta.up{color:#166534}
.k-delta.down{color:#991B1B}
.k-delta .ms{font-size:15px}
.chart{width:100%;height:300px}
.chart-sm{width:100%;height:240px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
th{
  background:var(--primary-soft);
  color:#115E59;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FFFD}
#screen table th:nth-child(n+4),#screen table td:nth-child(n+4){text-align:right}
#screen table th:first-child,#screen table td:first-child{text-align:left}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.35;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-red{background:#FEE2E2;color:#991B1B}
.t-amber{background:#FEF3C7;color:#92400E}
.t-green{background:#DCFCE7;color:#166534}
.t-blue{background:#DBEAFE;color:#1E40AF}
.t-gray{background:#F1F5F9;color:#475569}
.t-purple{background:#EDE9FE;color:#5B21B6}
.who{display:inline-flex;align-items:center;gap:7px}
.who .av{width:24px;height:24px;border-radius:6px;font-size:10px}
.bar{height:8px;min-width:90px;overflow:hidden;border:1px solid var(--line);border-radius:3px;background:var(--muted)}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.board-wrap{overflow-x:auto;padding-bottom:5px}
.board{display:flex;gap:12px}
.col{
  flex:1;
  min-width:235px;
  padding:11px;
  display:flex;
  flex-direction:column;
  gap:9px;
  background:#F8FFFD;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
}
.col-head{
  min-height:34px;
  padding:2px 4px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:12.5px;
  font-weight:700;
}
.col-head .dot{width:8px;height:8px;border-radius:2px}
.col-head .cnt{
  margin-left:auto;
  min-width:24px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#fff;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}
.kcard{
  padding:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  transition:background-color var(--transition),border-color var(--transition),transform var(--transition);
}
.kcard:hover{background:#F0FDFA;border-color:var(--color-primary);transform:translateY(-2px)}
.kc-top,.kc-foot{display:flex;align-items:center;gap:7px}
.kc-top{margin-bottom:8px}
.kc-pri{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.kc-id{margin-left:auto;color:var(--muted);font-size:10.5px}
.kcard h4{margin:0 0 8px;color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.5}
.kc-tags{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:5px}
.kc-foot{color:var(--muted);font-size:10.5px}
.kc-foot .who .av{width:21px;height:21px;border-radius:5px;font-size:9px}
.kc-due{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.kc-due .ms{font-size:14px}
.gantt{min-width:640px}
.gantt-row{
  padding:9px 0;
  display:grid;
  grid-template-columns:180px 1fr;
  align-items:center;
  border-bottom:1px solid var(--line);
}
.gantt-row:last-child{border-bottom:0}
.gantt-lab{padding-right:12px;color:var(--ink);font-size:12px;font-weight:600}
.gantt-lab small{display:block;color:var(--muted);font-size:10.5px;font-weight:400}
.gantt-track{position:relative;height:28px;background:var(--color-muted);border:1px solid var(--line);border-radius:5px}
.gantt-bar{
  position:absolute;
  top:4px;
  height:18px;
  padding:0 7px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-radius:3px;
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  white-space:nowrap;
}
.gantt-head{padding-bottom:6px;display:grid;grid-template-columns:180px 1fr;color:var(--muted);font-size:10.5px}
.gantt-months{display:flex}
.gantt-months span{flex:1;text-align:center}
.mstone{display:flex;flex-direction:column;gap:11px}
.mstone-item{display:flex;align-items:center;gap:11px}
.mstone-di{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:6px}
.mstone-di .ms{color:#fff;font-size:16px}
.mstone-tx h4{margin:0;color:var(--ink);font-size:12.5px}
.mstone-tx p{margin:2px 0 0;color:var(--muted);font-size:11px}
.doc-tree{display:flex;flex-direction:column;gap:4px}
.doc-cat{
  min-height:42px;
  padding:8px 9px;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  color:var(--ink);
  font-size:12.5px;
  font-weight:600;
  transition:background-color var(--transition),border-color var(--transition);
}
.doc-cat:hover{background:var(--color-muted)}
.doc-cat .ms{color:var(--muted)}
.doc-cat .cnt{margin-left:auto;color:var(--muted);font-size:10.5px}
.doc-cat.on{background:var(--primary-soft);border-color:var(--color-primary);color:#115E59}
.doc-cat.on .ms{color:var(--color-primary)}
.doc-item{
  min-height:66px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  transition:background-color var(--transition),border-color var(--transition);
}
.doc-item:hover{background:#F8FFFD;border-color:var(--color-primary)}
.doc-ficon{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:7px;color:#fff}
.doc-meta{min-width:0;flex:1}
.doc-meta h4{margin:0;overflow:hidden;color:var(--ink);font-size:12.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.doc-meta p{margin:3px 0 0;color:var(--muted);font-size:10.5px}
.doc-ver{padding:3px 8px;flex:none;border:1px solid var(--color-primary);border-radius:5px;background:var(--primary-soft);color:#115E59;font-size:10px;font-weight:700}
.appr{display:flex;flex-direction:column;gap:12px}
.appr-card{padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#F8FFFD}
.appr-top{margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.appr-top h4{margin:0;color:var(--ink);font-size:13px}
.appr-top .code{color:var(--muted);font-size:10.5px}
.steps{display:flex;align-items:flex-start;overflow-x:auto;padding:2px 0 5px}
.step{position:relative;min-width:110px;flex:1;padding:0 4px;text-align:center}
.step:not(:last-child)::after{content:"";position:absolute;z-index:0;top:16px;left:50%;width:100%;height:2px;background:var(--line)}
.step.done:not(:last-child)::after{background:var(--ok)}
.step-dot{
  position:relative;
  z-index:1;
  width:34px;
  height:34px;
  margin:0 auto 7px;
  display:grid;
  place-items:center;
  border:2px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--muted);
}
.step-dot .ms{font-size:18px}
.step.done .step-dot{border-color:#166534;background:#DCFCE7;color:#166534}
.step.cur .step-dot{border-color:var(--color-accent);background:#FFEDD5;color:#9A3412;animation:pulse 1.8s ease-in-out infinite}
.step-name{color:var(--ink);font-size:11px;font-weight:600}
.step-who{margin-top:2px;color:var(--muted);font-size:10px}
@keyframes pulse{50%{outline:5px solid rgba(234,88,12,.18)}}
.chat-list{display:flex;flex-direction:column;gap:5px}
.chan{
  min-height:54px;
  padding:9px;
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  transition:background-color var(--transition),border-color var(--transition);
}
.chan:hover{background:var(--color-muted)}
.chan.on{background:var(--primary-soft);border-color:var(--color-primary)}
.chan .hash{width:32px;height:32px;display:grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--color-primary)}
.chan-meta{min-width:0;flex:1}
.chan-meta h4,.chan-meta p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan-meta h4{margin:0;color:var(--ink);font-size:12px}
.chan-meta p{margin:2px 0 0;color:var(--muted);font-size:10px}
.chan .badge{min-width:20px;padding:2px 6px;border-radius:5px;background:var(--color-accent);color:#fff;text-align:center;font-size:10px;font-weight:700}
.msg{margin-bottom:15px;display:flex;gap:10px}
.msg>.av{width:34px;height:34px;border-radius:7px;font-size:11px}
.msg-body{min-width:0}
.msg-head{display:flex;align-items:baseline;gap:7px}
.msg-head b{color:var(--ink);font-size:12px}
.msg-head span{color:var(--muted);font-size:10px}
.msg-txt{max-width:100%;margin-top:4px;padding:9px 11px;display:inline-block;border:1px solid var(--line);border-radius:3px 9px 9px;background:var(--color-muted);color:var(--ink);font-size:12px}
.mention{color:#115E59;font-weight:700;text-decoration:underline}
.muted{color:var(--muted)}
.fw7{font-weight:700}
.hint{margin-top:12px;display:flex;align-items:flex-start;gap:6px;color:var(--muted);font-size:11px}
.hint .ms{color:var(--color-primary);font-size:16px}
#screen>*{animation:enter .38s ease both}
#screen .grid>*{animation:enter .4s ease both}
#screen .grid>*:nth-child(2){animation-delay:.05s}
#screen .grid>*:nth-child(3){animation-delay:.1s}
#screen .grid>*:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-2e{grid-template-columns:1fr}
  .board{min-width:990px}
}
@media(max-width:768px){
  .topbar-inner{padding:9px 16px}
  .nav{padding:0 16px 10px}
  main{padding:14px 16px 48px}
  .screen-head{align-items:flex-start;padding:16px}
  .g-3{grid-template-columns:1fr}
}
@media(max-width:480px){
  .brand-name{font-size:13px}
  .brand-sub,.top-user-meta,.top-user .pill{display:none}
  .topbar-inner{min-height:58px}
  .nav button{min-width:42px;justify-content:center;padding:8px 10px}
  .nav button .nav-txt{display:none}
  main{padding:12px 12px 42px}
  .screen-head{gap:10px}
  .screen-head .pill{display:none}
  .screen-head h1{font-size:19px}
  .g-kpi{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px}
  .kpi .k-val{font-size:21px}
  .card{padding:14px}
  .card-title{align-items:flex-start}
  .card-title .sub{max-width:46%;text-align:right}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #screen>*,#screen .grid>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-badge"><span class="ms" aria-hidden="true">approval</span></div>
      <div class="brand-txt">
        <div class="brand-name">企業提案與會簽追蹤系統</div>
        <div class="brand-sub">ProposalFlow · 團隊協作平台</div>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="top-user">
      <span class="pill"><span class="ms" aria-hidden="true">database</span>示範資料</span>
      <div class="avatar" aria-hidden="true">陳</div>
      <div class="top-user-meta"><b>陳品豪</b><span>專案協調人</span></div>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="系統功能"></nav>
</header>
<main><div id="screen" aria-live="polite"></div></main>
<script>
"use strict";
var C=document.getElementById("screen"),_chart=null;
var NAV=[
  {ic:"view_kanban",t:"任務看板"},
  {ic:"account_tree",t:"專案里程碑"},
  {ic:"menu_book",t:"知識文件庫"},
  {ic:"rule",t:"簽核流程"},
  {ic:"forum",t:"團隊溝通"},
  {ic:"insights",t:"產能報表"}
];
function avColor(n){
  var c=["#0F766E","#1D4ED8","#6D28D9","#15803D","#B45309","#0369A1","#BE185D"],s=0;
  for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);
  return c[s%c.length];
}

  h+='</div><div class="grid g-2" style="margin-bottom:14px"><div class="card"><div class="card-title"><span class="ms" aria-hidden="true">stacked_bar_chart</span>各週任務完成與逾期<span class="sub">近 6 週</span></div><div id="c-bar" class="chart"></div></div><div class="card"><div class="card-title"><span class="ms" aria-hidden="true">radar</span>團隊產能維度</div><div id="c-radar" class="chart"></div></div></div>';
  var mem=[
    {n:"陳品豪",done:38,late:1,load:82},
    {n:"張文茜",done:31,late:0,load:74},
    {n:"王啟明",done:27,late:2,load:88},
    {n:"周雅涵",done:24,late:1,load:66},
    {n:"林郁婷",done:22,late:3,load:79}
  ];
  h+='<div class="card"><div class="card-title"><span class="ms" aria-hidden="true">groups</span>成員產能明細<span class="sub">本週</span></div><div class="tbl-wrap"><table><thead><tr><th>成員</th><th>完成任務</th><th>逾期</th><th>負載</th><th style="width:180px">負載視覺</th></tr></thead><tbody>';
  mem.forEach(function(m){
    var cls=m.late>=3?"t-red":m.late>=1?"t-amber":"t-green";
    var state=m.late>=3?"高風險":m.late>=1?"需注意":"正常";
    h+='<tr><td>'+who(m.n)+'</td><td class="fw7">'+m.done+'</td><td><span class="tag '+cls+'">'+state+' · '+m.late+'</span></td><td>'+m.load+'%</td><td><div class="bar" role="progressbar" aria-label="'+m.n+'負載 '+m.load+'%" aria-valuenow="'+m.load+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+m.load+'%"></i></div></td></tr>';
  });
  h+='</tbody></table></div></div>';
  C.innerHTML=h;
  disposeChart();
  var bar=echarts.init(document.getElementById("c-bar"));
  bar.setOption({
    tooltip:{trigger:"axis"},
    legend:{data:["完成","逾期"],bottom:0,textStyle:{color:"#475569"}},
    grid:{left:38,right:14,top:16,bottom:38},
    xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLine:{lineStyle:{color:"#99F6E4"}},axisLabel:{color:"#475569"}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#E8F1F4"}},axisLabel:{color:"#475569"}},
    series:[
      {name:"完成",type:"bar",stack:"a",data:[98,112,121,130,138,142],itemStyle:{color:"#0D9488"}},
      {name:"逾期",type:"bar",stack:"a",data:[14,12,10,9,8,7],itemStyle:{color:"#EA580C"}}
    ]
  });
  var radar=echarts.init(document.getElementById("c-radar"));
  radar.setOption({
    tooltip:{},
    legend:{data:["本週","上週"],bottom:0,textStyle:{color:"#475569"}},
    radar:{
      indicator:[
        {name:"準時率",max:100},{name:"完成量",max:100},{name:"協作度",max:100},
        {name:"文件歸檔",max:100},{name:"回應速度",max:100}
      ],
      radius:"62%",
      splitLine:{lineStyle:{color:"#99F6E4"}},
      splitArea:{areaStyle:{color:["#FFFFFF","#F0FDFA"]}},
      axisName:{color:"#475569"}
    },
    series:[{type:"radar",data:[
      {value:[86,90,78,98,82],name:"本週",areaStyle:{color:"rgba(13,148,136,.20)"},lineStyle:{color:"#0D9488"},itemStyle:{color:"#0D9488"}},
      {value:[72,70,68,84,74],name:"上週",areaStyle:{color:"rgba(234,88,12,.08)"},lineStyle:{color:"#EA580C"},itemStyle:{color:"#EA580C"}}
    ]}]
  });
  _chart={dispose:function(){try{bar.dispose()}catch(e){}try{radar.dispose()}catch(e){}}};
}
var SCREENS=[s0,s1,s2,s3,s4,s5];
function renderNav(active){
  var nav=document.getElementById("nav"),h="";
  NAV.forEach(function(n,i){
    h+='<button type="button" data-i="'+i+'" aria-label="'+n.t+'" aria-current="'+(i===active?"page":"false")+'"'+(i===active?' class="active"':"")+'><span class="ms" aria-hidden="true">'+n.ic+'</span><span class="nav-txt">'+n.t+'</span></button>';
  });
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){
      var index=+this.getAttribute("data-i");
      if(location.hash!=="#go="+index)location.hash="go="+index;
      else show(index);
    });
  }
}
function show(i){
  i=Math.max(0,Math.min(Number(i)||0,SCREENS.length-1));
  disposeChart();
  renderNav(i);
  SCREENS[i]();
  try{window.scrollTo(0,0)}catch(e){}
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],SCREENS.length-1):0);
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){if(_chart&&_chart.resize)try{_chart.resize()}catch(e){}});
fromHash();
</script>
</body>
</html>
