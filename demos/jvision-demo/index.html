<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>企業協作示範系統</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent2:#fb7185; --accent-soft:#ffe4e9;
  --ink:#1f2430; --muted:#6b7280; --line:#eceef2; --bg:#f6f7f9; --card:#ffffff;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --blue:#2563eb; --purple:#7c3aed;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
img{max-width:100%;}
button{font-family:inherit;cursor:pointer;}

/* top nav */
.topbar{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(20,24,40,.04);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-badge{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(225,29,72,.35);
}
.brand-badge .ms{font-size:22px;}
.brand-txt{min-width:0;}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap;}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap;}
.topbar-spacer{flex:1;min-width:0;}
.top-user{display:flex;align-items:center;gap:9px;min-width:0;}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.top-user-meta{font-size:12px;line-height:1.3;min-width:0;}
.top-user-meta b{display:block;font-size:13px;}
.top-user-meta span{color:var(--muted);}

/* nav row */
.nav{
  max-width:1360px;margin:0 auto;padding:0 20px 12px;
  display:flex;gap:8px;flex-wrap:wrap;
}
.nav button{
  flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;
  transition:.15s;
}
.nav button .ms{font-size:19px;}
.nav button:hover{border-color:var(--accent2);color:var(--accent);}
.nav button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(225,29,72,.28);
}

main{max-width:1360px;margin:0 auto;padding:8px 20px 60px;}

/* screen head */
.screen-head{margin:14px 0 18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.screen-head h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.4px;}
.screen-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px;}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
}
.pill .ms{font-size:15px;}

/* generic cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.card-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:0 0 14px;}
.card-title .ms{font-size:20px;color:var(--accent);}
.card-title .sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;}

/* grids */
.grid{display:grid;gap:16px;min-width:0;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr;}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
}

/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);opacity:.6;}
.kpi .k-ico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
.kpi .k-ico .ms{font-size:21px;}
.kpi .k-val{font-size:26px;font-weight:800;margin-top:10px;letter-spacing:.5px;}
.kpi .k-lab{font-size:12.5px;color:var(--muted);margin-top:2px;}
.kpi .k-delta{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px;}
.k-delta.up{color:var(--ok);} .k-delta.down{color:var(--bad);}
.k-delta .ms{font-size:15px;}

/* chart box */
.chart{width:100%;height:300px;min-width:0;}
.chart-sm{width:100%;height:240px;min-width:0;}

/* tables */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;background:#fbfbfc;}
tbody tr:hover{background:#fcfcfd;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.t-red{background:#fee2e2;color:#b91c1c;} .t-amber{background:#fef3c7;color:#b45309;}
.t-green{background:#dcfce7;color:#15803d;} .t-blue{background:#dbeafe;color:#1d4ed8;}
.t-gray{background:#eef0f3;color:#4b5563;} .t-purple{background:#ede9fe;color:#6d28d9;}
.who{display:inline-flex;align-items:center;gap:7px;}
.who .av{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}

/* progress */
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;min-width:80px;}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent));}

/* ===== KANBAN board ===== */
.board-wrap{overflow-x:auto;padding-bottom:6px;}
.board{display:flex;gap:14px;min-width:0;}
.col{flex:1;min-width:230px;background:#f4f5f7;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.col-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:2px 4px;}
.col-head .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.col-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:#fff;border-radius:999px;padding:1px 9px;font-weight:700;}
.kcard{background:#fff;border-radius:12px;padding:12px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,24,40,.04);transition:.15s;cursor:grab;}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,24,40,.10);border-color:var(--accent2);}
.kcard .kc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.kc-pri{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;}
.kc-id{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;}
.kcard h4{margin:0 0 8px;font-size:13.5px;font-weight:600;line-height:1.45;}
.kc-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
.kc-foot .who .av{width:22px;height:22px;font-size:10px;}
.kc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.kc-due{margin-left:auto;display:inline-flex;align-items:center;gap:3px;}
.kc-due .ms{font-size:14px;}

/* milestone / gantt */
.gantt{display:flex;flex-direction:column;gap:0;min-width:640px;}
.gantt-row{display:grid;grid-template-columns:180px 1fr;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;}
.gantt-row:last-child{border-bottom:none;}
.gantt-lab{font-size:13px;font-weight:600;padding-right:12px;}
.gantt-lab small{display:block;color:var(--muted);font-weight:400;font-size:11px;}
.gantt-track{position:relative;height:26px;background:#f4f5f7;border-radius:8px;}
.gantt-bar{position:absolute;top:4px;height:18px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}
.gantt-head{display:grid;grid-template-columns:180px 1fr;font-size:11px;color:var(--muted);padding-bottom:6px;}
.gantt-months{display:flex;}
.gantt-months span{flex:1;text-align:center;}
.mstone{display:flex;flex-direction:column;gap:10px;}
.mstone-item{display:flex;align-items:center;gap:12px;}
.mstone-di{width:26px;height:26px;border-radius:7px;transform:rotate(45deg);flex:none;display:flex;align-items:center;justify-content:center;}
.mstone-di .ms{transform:rotate(-45deg);font-size:15px;color:#fff;}
.mstone-tx{min-width:0;}
.mstone-tx h4{margin:0;font-size:13px;font-weight:700;}
.mstone-tx p{margin:1px 0 0;font-size:11.5px;color:var(--muted);}

/* docs library */
.doc-tree{display:flex;flex-direction:column;gap:4px;}
.doc-cat{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;}
.doc-cat .ms{font-size:19px;color:var(--muted);}
.doc-cat .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);}
.doc-cat.on{background:var(--accent-soft);color:var(--accent);}
.doc-cat.on .ms{color:var(--accent);}
.doc-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;transition:.15s;}
.doc-item:hover{border-color:var(--accent2);box-shadow:0 4px 12px rgba(20,24,40,.06);}
.doc-ficon{width:40px;height:40px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;}
.doc-ficon .ms{font-size:20px;}
.doc-meta{min-width:0;flex:1;}
.doc-meta h4{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-meta p{margin:3px 0 0;font-size:11.5px;color:var(--muted);}
.doc-ver{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;flex:none;}

/* approval flow */
.appr{display:flex;flex-direction:column;gap:14px;}
.appr-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.appr-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.appr-top h4{margin:0;font-size:14px;font-weight:700;}
.appr-top .code{font-size:11.5px;color:var(--muted);font-weight:600;}
.steps{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:4px;}
.step{flex:1;min-width:110px;text-align:center;position:relative;padding:0 4px;}
.step:not(:last-child)::after{content:"";position:absolute;top:17px;left:50%;width:100%;height:2px;background:var(--line);z-index:0;}
.step.done:not(:last-child)::after{background:var(--ok);}
.step-dot{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;background:#fff;border:2px solid var(--line);color:var(--muted);}
.step-dot .ms{font-size:19px;}
.step.done .step-dot{background:var(--ok);border-color:var(--ok);color:#fff;}
.step.cur .step-dot{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 1.8s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.4);}70%{box-shadow:0 0 0 9px rgba(225,29,72,0);}100%{box-shadow:0 0 0 0 rgba(225,29,72,0);}}
.step-name{font-size:12px;font-weight:600;}
.step-who{font-size:11px;color:var(--muted);margin-top:2px;}

/* chat / communication */
.chat-list{display:flex;flex-direction:column;gap:6px;}
.chan{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;cursor:pointer;}
.chan:hover,.chan.on{background:var(--accent-soft);}
.chan .hash{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);}
.chan .hash .ms{font-size:18px;}
.chan-meta{min-width:0;flex:1;}
.chan-meta h4{margin:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chan-meta p{margin:1px 0 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chan .badge{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;flex:none;}
.msg{display:flex;gap:11px;margin-bottom:16px;}
.msg .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.msg-body{min-width:0;}
.msg-head{display:flex;align-items:baseline;gap:8px;}
.msg-head b{font-size:13px;}
.msg-head span{font-size:11px;color:var(--muted);}
.msg-txt{font-size:13px;margin-top:3px;background:#f4f5f7;padding:9px 12px;border-radius:3px 12px 12px 12px;display:inline-block;max-width:100%;}
.msg-txt .mention{color:var(--accent);font-weight:600;}

/* report list */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}

/* utilities */
.muted{color:var(--muted);} .fw7{font-weight:700;}
.hint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:12px;}
.hint .ms{font-size:16px;color:var(--accent);}

@media(max-width:560px){
  .nav button .nav-txt{display:none;}
  .nav button{padding:9px 12px;}
  .top-user-meta{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-badge"><span class="ms">hub</span></div>
      <div class="brand-txt">
        <div class="brand-name">企業協作示範系統</div>
        <div class="brand-sub">CollabHub · 團隊協作平台</div>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="top-user">
      <span class="pill"><span class="ms">wifi_tethering</span>示範資料</span>
      <div class="avatar">陳</div>
      <div class="top-user-meta"><b>陳品豪</b><span>專案協調人</span></div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main><div id="screen"></div></main>

<script>
"use strict";
var C=document.getElementById("screen");
var _chart=null;

var NAV=[
  {ic:"view_kanban",t:"任務看板"},
  {ic:"account_tree",t:"專案里程碑"},
  {ic:"menu_book",t:"知識文件庫"},
  {ic:"rule",t:"簽核流程"},
  {ic:"forum",t:"團隊溝通"},
  {ic:"insights",t:"產能報表"}
];

/* helpers */
function avColor(n){var c=["#e11d48","#2563eb","#7c3aed","#16a34a","#f59e0b","#0891b2","#db2777"];var s=0;for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);return c[s%c.length];}
function who(name){return '<span class="who"><span class="av" style="background:'+avColor(name)+'">'+name.charAt(0)+'</span>'+name+'</span>';}
function av(name){return '<span class="av" style="background:'+avColor(name)+'">'+name.charAt(0)+'</span>';}

function disposeChart(){ if(_chart){try{_chart.dispose();}catch(e){} _chart=null;} }

function headHtml(title,sub,ic){
  return '<div class="screen-head"><span class="pill"><span class="ms">'+ic+'</span>模組</span>'+
         '<div><h1>'+title+'</h1><p>'+sub+'</p></div></div>';
}

/* ============ SCREEN 0 : KANBAN ============ */
function s0(){
  var kpi=[
    {ic:"assignment",v:"142",l:"進行中任務",d:"+12",up:true},
    {ic:"schedule",v:"18",l:"本週到期",d:"-4",up:true},
    {ic:"warning",v:"7",l:"逾期任務",d:"+2",up:false},
    {ic:"task_alt",v:"86%",l:"任務準時率",d:"+5%",up:true}
  ];
  var cols=[
    {name:"待處理",color:"#94a3b8",cards:[
      {id:"T-318",pri:"高",pc:"#fee2e2;color:#b91c1c",t:"新品發表會場地與流程確認",who:"林郁婷",due:"08/16",tags:[["活動","t-purple"],["提案","t-blue"]]},
      {id:"T-325",pri:"中",pc:"#fef3c7;color:#b45309",t:"Q3 供應商評估報告初稿",who:"王啟明",due:"08/20",tags:[["採購","t-amber"]]},
      {id:"T-330",pri:"低",pc:"#eef0f3;color:#4b5563",t:"官網 FAQ 內容更新",who:"周雅涵",due:"08/25",tags:[["行銷","t-green"]]}
    ]},
    {name:"進行中",color:"#2563eb",cards:[
      {id:"T-301",pri:"高",pc:"#fee2e2;color:#b91c1c",t:"跨部門會簽流程導入測試",who:"陳品豪",due:"08/15",tags:[["流程","t-blue"],["IT","t-gray"]]},
      {id:"T-309",pri:"中",pc:"#fef3c7;color:#b45309",t:"年度預算彙整與部門分攤",who:"張文茜",due:"08/18",tags:[["財務","t-amber"]]}
    ]},
    {name:"審核中",color:"#f59e0b",cards:[
      {id:"T-288",pri:"高",pc:"#fee2e2;color:#b91c1c",t:"客戶合約條款法務會簽",who:"許志強",due:"08/14",tags:[["法務","t-red"]]},
      {id:"T-294",pri:"中",pc:"#fef3c7;color:#b45309",t:"員工旅遊方案提案審核",who:"林郁婷",due:"08/17",tags:[["人資","t-purple"]]}
    ]},
    {name:"已完成",color:"#16a34a",cards:[
      {id:"T-276",pri:"中",pc:"#fef3c7;color:#b45309",t:"第二季產能報表發布",who:"陳品豪",due:"08/09",tags:[["報表","t-green"]]},
      {id:"T-281",pri:"低",pc:"#eef0f3;color:#4b5563",t:"知識庫文件分類重整",who:"周雅涵",due:"08/08",tags:[["文件","t-gray"]]}
    ]}
  ];
  var h=headHtml("任務看板","以拖拉式看板管理任務狀態流轉、指派與到期提醒","view_kanban");
  h+='<div class="grid g-kpi" style="margin-bottom:16px">';
  kpi.forEach(function(k){
    h+='<div class="kpi"><div class="k-ico"><span class="ms">'+k.ic+'</span></div>'+
       '<div class="k-val">'+k.v+'</div><div class="k-lab">'+k.l+'</div>'+
       '<div class="k-delta '+(k.up?'up':'down')+'"><span class="ms">'+(k.up?'trending_up':'priority_high')+'</span>'+k.d+' 較上週</div></div>';
  });
  h+='</div>';
  h+='<div class="card"><div class="card-title"><span class="ms">dashboard</span>「新品上市」專案看板<span class="sub">共 9 張任務卡 · 4 位負責人</span></div>';
  h+='<div class="board-wrap"><div class="board">';
  cols.forEach(function(col){
    h+='<div class="col"><div class="col-head"><span class="dot" style="background:'+col.color+'"></span>'+col.name+'<span class="cnt">'+col.cards.length+'</span></div>';
    col.cards.forEach(function(c){
