<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESG供應鏈盡職調查系統｜Jvision 系統 Demo</title>
<meta name="description" content="ESG 問卷、供應商自評、第三方評級整合、風險分級看板與改善追蹤" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#9333ea; --accent2:#c084fc; --accent-soft:#f5edff;
  --bg:#f6f4fb; --card:#ffffff; --ink:#221833; --muted:#6b6480; --line:#ece7f5;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

/* top nav */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#4c1d95,#9333ea);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand-t{min-width:0}
.brand-t b{display:block;font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap}
.brand-t span{font-size:11px;color:rgba(255,255,255,.7)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill .material-symbols-outlined{font-size:16px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-weight:800;color:#3b0764;flex:none}

/* nav tabs */
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:20}
.nav-inner{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:4px;flex-wrap:wrap}
.navbtn{border:none;background:none;cursor:pointer;font-family:inherit;padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;min-width:0}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn:hover{color:var(--accent)}
.navbtn.active{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{margin:2px 0 18px}
.screen-head h1{font-size:21px;margin:0 0 4px;font-weight:800}
.screen-head p{margin:0;color:var(--muted);font-size:13px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h .material-symbols-outlined{font-size:20px;color:var(--accent)}
.card-h b{font-size:14px;font-weight:800}
.card-h .sub{margin-left:auto;font-size:11px;color:var(--muted)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
.grid>*{min-width:0}

/* kpi */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:11px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.kpi .ic{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.kpi .ic .material-symbols-outlined{font-size:20px;color:var(--accent)}

.chartwrap{position:relative;overflow:hidden}

/* table */
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#dbeafe;color:#1d4ed8}
.t-mut{background:#eef0f4;color:#555}
.t-purple{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

.bar{height:7px;border-radius:4px;background:#eee;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.avatar-sm{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}

/* kanban board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.board>*{min-width:0}
.col{background:#faf8fe;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px}
.col-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:2px 2px 8px;border-bottom:1px dashed var(--line)}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;box-shadow:0 1px 2px rgba(30,10,60,.04)}
.kcard .kt{font-weight:700;font-size:12.5px;margin-bottom:5px}
.kcard .km{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kcard .kb{margin-top:8px;display:flex;align-items:center;gap:6px}
.risk-l{border-left:3px solid transparent}
.rl-hi{border-left-color:var(--bad)}
.rl-md{border-left-color:var(--warn)}
.rl-lo{border-left-color:var(--ok)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-19px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item.done .tl-dot{background:var(--accent)}
.tl-t{font-weight:700;font-size:13px}
.tl-m{font-size:11.5px;color:var(--muted);margin-top:2px}

/* gauge row */
.score-ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}

/* form-ish self assess */
.qrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.qrow .qx{flex:1;min-width:0}
.qrow .qx b{font-size:13px;display:block}
.qrow .qx span{font-size:11px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg span{padding:5px 9px;font-size:11px;font-weight:700;color:var(--muted);background:#fff}
.seg span.on{background:var(--accent);color:#fff}

.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:default}
.chip.on{background:var(--accent-soft);border-color:var(--accent2);color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

.fileitem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}
.fileitem .fi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft)}
.fileitem .fi .material-symbols-outlined{color:var(--accent);font-size:19px}
.fileitem .fx{flex:1;min-width:0}
.fileitem .fx b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileitem .fx span{font-size:11px;color:var(--muted)}

.mini-stat{display:flex;align-items:center;gap:10px;padding:8px 0}
.mini-stat .ms-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.mini-stat b{font-size:16px;font-weight:800}
.mini-stat span{font-size:11px;color:var(--muted)}

.foot{max-width:1360px;margin:0 auto;padding:14px 18px 30px;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div class="brand-t">
        <b>ESG 供應鏈盡職調查系統</b>
        <span>Supply Chain ESG Due Diligence</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="pill"><span class="material-symbols-outlined">calendar_month</span>2026 Q3 盤查週期</div>
      <div class="pill"><span class="material-symbols-outlined">groups</span>採購 / 永續 / 法遵</div>
      <div class="avatar">陳</div>
    </div>
  </div>
</div>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>
<main id="app"></main>
<div class="foot">ESG 供應鏈盡職調查系統 Demo · 純前端展示 · 資料為模擬示意</div>

<script>
"use strict";
var charts={};
function destroyChart(k){ if(charts[k]){ try{charts[k].destroy();}catch(e){} charts[k]=null; } }
function mkChart(id,cfg,key){
  var el=document.getElementById(id); if(!el) return;
  destroyChart(key||id);
  charts[key||id]=new Chart(el,cfg);
}
var ACC="#9333ea",ACC2="#c084fc";
function initial(s){return (s||"?").slice(0,1);}
function avColor(i){var c=["#9333ea","#c084fc","#2563eb","#16a34a","#f59e0b","#db2777"];return c[i%c.length];}

var MODS=[
  {icon:"checklist",name:"ESG 問卷管理",desc:"問卷發送與回收追蹤"},
  {icon:"fact_check",name:"供應商自評",desc:"填報與佐證上傳"},
  {icon:"verified",name:"第三方評級整合",desc:"外部評級資料匯入"},
  {icon:"shield",name:"風險分級看板",desc:"高風險供應商標記"},
  {icon:"task_alt",name:"改善追蹤",desc:"缺失改善計畫管理"},
  {icon:"gavel",name:"稽核佐證庫",desc:"佐證歸檔與調閱"}
];

/* ---------- shared render helpers ---------- */
function kpi(o){
  var cls=o.dir==="up"?"up":(o.dir==="down"?"down":"flat");
  var ar=o.dir==="up"?"trending_up":(o.dir==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+o.icon+'</span></div>'+
    '<div class="lab">'+o.lab+'</div>'+
    '<div class="val">'+o.val+(o.unit?'<small>'+o.unit+'</small>':'')+'</div>'+
    '<div class="delta '+cls+'"><span class="material-symbols-outlined">'+ar+'</span>'+o.delta+'</div></div>';
}
function bar(pct){return '<div class="bar"><i style="width:'+pct+'%"></i></div>';}

/* ============ SCREEN 0 : ESG 問卷管理 (signature KPI + chart + table) ============ */
function s0(){
  var rows=[
    {c:"台鏈精密工業",tpl:"2026 綜合問卷 v3",sent:"07/02",due:"07/20",st:"已回覆",prog:100,pri:"高"},
    {c:"綠洋電子材料",tpl:"2026 綜合問卷 v3",sent:"07/02",due:"07/20",st:"填報中",prog:62,pri:"高"},
    {c:"宏達金屬表面",tpl:"化學品管理附冊",sent:"07/05",due:"07/22",st:"填報中",prog:41,pri:"中"},
    {c:"順風物流通運",tpl:"2026 綜合問卷 v3",sent:"07/02",due:"07/20",st:"未開啟",prog:0,pri:"低"},
    {c:"晶越封裝科技",tpl:"2026 綜合問卷 v3",sent:"07/03",due:"07/21",st:"已回覆",prog:100,pri:"高"},
    {c:"永康塑膠射出",tpl:"化學品管理附冊",sent:"07/05",due:"07/22",st:"逾期未回",prog:18,pri:"中"}
  ];
  var stMap={"已回覆":"t-ok","填報中":"t-info","未開啟":"t-mut","逾期未回":"t-bad"};
  var trs=rows.map(function(r,i){
    return '<tr><td><div style="display:flex;align-items:center;gap:9px"><span class="avatar-sm" style="background:'+avColor(i)+'">'+initial(r.c)+'</span><b style="font-weight:700">'+r.c+'</b></div></td>'+
      '<td>'+r.tpl+'</td><td>'+r.sent+'</td><td>'+r.due+'</td>'+
      '<td><span class="tag '+stMap[r.st]+'">'+r.st+'</span></td>'+
      '<td><div style="display:flex;align-items:center;gap:8px">'+bar(r.prog)+'<span style="font-size:11px;color:var(--muted)">'+r.prog+'%</span></div></td>'+
      '<td><span class="tag '+(r.pri==="高"?"t-bad":r.pri==="中"?"t-warn":"t-mut")+'">'+r.pri+'</span></td></tr>';
  }).join("");

  return '<div class="screen-head"><h1>ESG 問卷管理</h1><p>依採購佔比與風險屬性挑選受評供應商，派發盡職調查問卷並追蹤回收進度</p></div>'+
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi({icon:"send",lab:"本週期已發送",val:"184",unit:"家",delta:"+22 家",dir:"up"})+
      kpi({icon:"fact_check",lab:"問卷回覆率",val:"78.3",unit:"%",delta:"+9.1%",dir:"up"})+
      kpi({icon:"pending_actions",lab:"填報中",val:"29",unit:"家",delta:"-4 家",dir:"down"})+
      kpi({icon:"warning",lab:"逾期未回",val:"12",unit:"家",delta:"+3 家",dir:"down"})+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="card-h"><span class="material-symbols-outlined">table_rows</span><b>問卷派發進度</b><span class="sub">共 184 家 · 顯示前 6</span></div>'+
        '<div class="tbl-scroll"><table><thead><tr><th>供應商</th><th>問卷模板</th><th>發送</th><th>期限</th><th>狀態</th><th>完成度</th><th>優先</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>'+
      '<div class="card"><div class="card-h"><span class="material-symbols-outlined">monitoring</span><b>回覆率趨勢（6 週）</b></div>'+
        '<div class="chartwrap" style="height:250px"><canvas id="c0a"></canvas></div>'+
        '<div class="legend"><span><i style="background:'+ACC+'"></i>累積回覆率</span><span><i style="background:'+ACC2+'"></i>當週回收</span></div></div>'+
    '</div>';
}
function s0charts(){
  mkChart("c0a",{type:"bar",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
    datasets:[
      {type:"line",label:"累積回覆率",data:[21,38,51,63,72,78],borderColor:ACC,backgroundColor:"rgba(147,51,234,.12)",fill:true,tension:.35,yAxisID:"y",pointRadius:3},
      {type:"bar",label:"當週回收",data:[38,31,24,22,17,14],backgroundColor:ACC2,borderRadius:5,yAxisID:"y1"}
    ]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},
      scales:{y:{position:"left",min:0,max:100,ticks:{callback:function(v){return v+"%"}},grid:{color:"#f0ecf7"}},
        y1:{position:"right",grid:{display:false},min:0,max:45}}}},"c0a");
}

/* ============ SCREEN 1 : 供應商自評 (self-assessment form-style) ============ */
function s1(){
  var qs=[
    {q:"是否設有溫室氣體盤查（範疇一/二）",cat:"環境 E",lvl:3,note:"已導入 ISO 14064-1"},
    {q:"再生能源使用佔比政策",cat:"環境 E",lvl:2,note:"目標 2028 達 30%"},
    {q:"危害性化學品管理程序",cat:"環境 E",lvl:3,note:"SDS 齊備"},
    {q:"勞工工時與加班合規",cat:"社會 S",lvl:2,note:"部分產線待改善"},
    {q:"職業安全衛生管理系統",cat:"社會 S",lvl:3,note:"ISO 45001 認證"},
    {q:"反貪腐與商業道德政策",cat:"治理 G",lvl:3,note:"年度教育訓練"},
    {q:"供應商行為準則簽署",cat:"治理 G",lvl:2,note:"覆蓋率 71%"}
  ];
  var lvName=["未建立","規劃中","部分導入","全面落實"];
  var qhtml=qs.map(function(x){
    var segs="";for(var i=0;i<4;i++){segs+='<span class="'+(i===x.lvl?"on":"")+'">'+["未","規","部","全"][i]+'</span>';}
    var catCls=x.cat[0]==="環"?"t-ok":x.cat[0]==="社"?"t-info":"t-purple";
    return '<div class="qrow"><div class="qx"><b>'+x.q+'</b><span>'+x.note+' · 目前：'+lvName[x.lvl]+'</span></div>'+
      '<span class="tag '+catCls+'" style="flex:none">'+x.cat+'</span>'+
      '<div class="seg">'+segs+'</div></div>';
  }).join("");

  return '<div class="screen-head"><h1>供應商自評｜綠洋電子材料</h1><p>供應商線上填報環境、社會、治理三構面題項，並上傳佐證文件供後段查驗</p></div>'+
    '<div class="grid g32">'+
      '<div class="card"><div class="card-h"><span class="material-symbols-outlined">donut_small</span><b>自評三構面得分</b></div>'+
        '<div class="chartwrap" style="height:230px"><canvas id="c1a"></canvas></div>'+
        '<div style="margin-top:12px">'+
          miniStat("eco","#16a34a","環境 E","82 / 100")+
          miniStat("diversity_3","#2563eb","社會 S","68 / 100")+
          miniStat("account_balance","#9333ea","治理 G","74 / 100")+
        '</div></div>'+
      '<div class="card"><div class="card-h"><span class="material-symbols-outlined">checklist_rtl</span><b>題項填報</b><span class="sub">已完成 21 / 34 題</span></div>'+
        qhtml+
      '</div>'+
    '</div>'+
    '<div class="grid g3" style="margin-top:14px">'+
      fileCard("carbon_report_2025.pdf","溫室氣體盤查報告 · 2.4MB","fact_check")+
      fileCard("iso45001_cert.pdf","職安衛認證證書 · 880KB","verified")+
      fileCard("supplier_coc_signed.pdf","供應商行為準則簽署 · 1.1MB","gavel")+
    '</div>';
}
function miniStat(ic,col,lab,val){
  return '<div class="mini-stat"><div class="ms-ic" style="background:'+col+'22"><span class="material-symbols-outlined" style="color:'+col+';font-size:18px">'+ic+'</span></div>'+

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="nlab">'+m.name+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){ location.hash="go="+this.getAttribute("data-i"); });
  }
}
function show(i){
  var app=document.getElementById("app");
  var sc=SCREENS[i]||SCREENS[0];
  app.innerHTML=sc.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i); }
  void app.offsetHeight;
  try{ if(sc.c) sc.c(); }catch(e){}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
