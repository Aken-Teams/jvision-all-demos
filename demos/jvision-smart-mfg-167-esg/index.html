<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>供應商永續風險調查系統｜Jvision 系統 Demo</title>
<meta name="description" content="ESG 問卷、供應商自評、第三方評級整合、風險分級看板與改善追蹤" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#047857;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --bg:#ecfdf5;
  --card:#ffffff;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#0369a1;
  --gold:#d97706;
  --shadow:0 18px 44px rgba(6,78,59,.09);
  --shadow-sm:0 8px 24px rgba(6,78,59,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 9%,rgba(16,185,129,.16),transparent 23rem),
    radial-gradient(circle at 93% 34%,rgba(217,119,6,.08),transparent 20rem),
    linear-gradient(180deg,#f5fff9 0,var(--bg) 46%,#f8fffb 100%);
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body:before,body:after{
  position:fixed;
  z-index:-1;
  content:"";
  pointer-events:none;
  filter:blur(1px);
}
body:before{
  top:110px;right:-120px;width:330px;height:230px;
  border:1px solid rgba(5,150,105,.15);
  border-radius:63% 37% 68% 32%/42% 58% 42% 58%;
  transform:rotate(-14deg);
}
body:after{
  bottom:-100px;left:-100px;width:360px;height:270px;
  background:rgba(167,243,208,.22);
  border-radius:32% 68% 35% 65%/61% 38% 62% 39%;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;top:0;z-index:30;
  color:#fff;
  background:rgba(4,78,59,.96);
  border-bottom:1px solid rgba(167,243,208,.28);
  box-shadow:0 8px 30px rgba(6,78,59,.16);
  backdrop-filter:blur(18px);
}
.topbar:after{
  position:absolute;right:8%;bottom:-18px;width:190px;height:38px;
  content:"";pointer-events:none;background:#047857;
  border-radius:35% 65% 50% 50%/65% 55% 45% 35%;
  opacity:.42;
}
.topbar-inner{
  max-width:1400px;margin:auto;padding:12px 22px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:43px;height:43px;flex:none;display:grid;place-items:center;
  color:#022c22;background:linear-gradient(145deg,#d1fae5,#6ee7b7);
  border:1px solid rgba(255,255,255,.4);
  border-radius:56% 44% 58% 42%/44% 55% 45% 56%;
  box-shadow:inset 0 1px rgba(255,255,255,.7),0 7px 20px rgba(0,0,0,.13);
}
.logo .material-symbols-outlined{font-size:25px}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:15px;line-height:1.25;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-t span{display:block;margin-top:2px;color:#d1fae5;font:500 10px/1.3 "Fira Code",monospace;letter-spacing:.06em}
.topbar-right{display:flex;align-items:center;gap:9px;margin-left:auto}
.pill{
  min-height:34px;padding:7px 12px;display:flex;align-items:center;gap:7px;
  color:#ecfdf5;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;
  font-size:11px;font-weight:600;
}
.pill .material-symbols-outlined{font-size:16px}
.avatar{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  color:#022c22;background:#fbbf24;border:2px solid rgba(255,255,255,.5);
  border-radius:47% 53% 42% 58%/56% 44% 56% 44%;font-weight:700;
}
.nav{
  position:sticky;top:68px;z-index:20;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid rgba(5,150,105,.18);
  backdrop-filter:blur(16px);
}
.nav-inner{
  max-width:1400px;margin:auto;padding:5px 16px;
  display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;
}
.navbtn{
  min-height:45px;padding:9px 13px;display:flex;align-items:center;gap:7px;flex:none;
  color:var(--muted);background:transparent;border:1px solid transparent;
  border-radius:13px;font-size:12px;font-weight:600;
  transition:color .2s,background .2s,border-color .2s,transform .2s;
}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn:hover{color:#065f46;background:#ecfdf5;border-color:#a7f3d0;transform:translateY(-1px)}
.navbtn.active{
  color:#fff;background:#047857;border-color:#047857;
  box-shadow:0 7px 18px rgba(5,150,105,.2);
}
main{max-width:1400px;margin:auto;padding:27px 22px 64px}
.screen-head{
  position:relative;margin:0 0 22px;padding:3px 0 3px 17px;
  border-left:4px solid var(--color-primary);
}
.screen-head:before{
  position:absolute;left:-4px;bottom:-4px;width:52px;height:7px;
  content:"";background:#fbbf24;border-radius:999px;opacity:.82;
}
.screen-head h1{margin:0 0 5px;color:#064e3b;font-size:clamp(22px,2.2vw,31px);font-weight:700;letter-spacing:-.025em}
.screen-head p{max-width:860px;margin:0;color:#475569;font-size:13px;line-height:1.7}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.55fr)}
.grid>*{min-width:0}
.card,.kpi{
  position:relative;min-width:0;background:rgba(255,255,255,.94);
  border:1px solid rgba(5,150,105,.18);
  box-shadow:var(--shadow-sm);
}
.card{
  padding:18px;border-radius:22px 18px 24px 17px;
}
.card:nth-child(even){border-radius:18px 25px 17px 22px}
.card:before{
  position:absolute;top:0;left:24px;width:58px;height:3px;
  content:"";background:linear-gradient(90deg,#059669,#fbbf24);border-radius:0 0 999px 999px;
}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:25px}
.card-h>.material-symbols-outlined{
  width:29px;height:29px;display:grid;place-items:center;flex:none;
  color:#047857;background:#d1fae5;border-radius:10px;font-size:18px;
}
.card-h b{font-size:14px;font-weight:700}
.card-h .sub{margin-left:auto;color:var(--muted);font:500 10px/1.4 "Fira Code",monospace;text-align:right}
.kpi{
  overflow:hidden;padding:17px 18px;
  border-radius:19px 23px 18px 25px;
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.kpi:nth-child(even){border-radius:25px 18px 23px 18px}
.kpi:hover{transform:translateY(-3px);border-color:#6ee7b7;box-shadow:var(--shadow)}
.kpi:after{
  position:absolute;right:-31px;bottom:-46px;width:112px;height:95px;
  content:"";background:#d1fae5;opacity:.65;
  border-radius:62% 38% 55% 45%/39% 57% 43% 61%;transform:rotate(20deg);
}
.kpi .lab{padding-right:44px;color:#475569;font-size:11px;font-weight:600}
.kpi .val{
  position:relative;z-index:1;margin-top:8px;color:#064e3b;
  font:700 28px/1.1 "Fira Code",monospace;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:#475569;font:600 12px "Fira Sans",sans-serif;letter-spacing:0}
.kpi .delta{
  position:relative;z-index:1;margin-top:8px;
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
}
.kpi .delta .material-symbols-outlined{font-size:15px}
.kpi .ic{
  position:absolute;right:14px;top:13px;width:38px;height:38px;
  display:grid;place-items:center;color:#047857;background:#d1fae5;
  border:1px solid #a7f3d0;border-radius:54% 46% 58% 42%/44% 55% 45% 56%;
}
.kpi .ic .material-symbols-outlined{font-size:20px}
.up{color:#047857}.down{color:#b91c1c}.flat{color:#475569}
.chartwrap{position:relative;overflow:hidden}
.tbl-scroll{overflow-x:auto;border:1px solid #d1fae5;border-radius:15px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th{
  padding:10px 11px;color:#065f46;background:#ecfdf5;
  border-bottom:2px solid #a7f3d0;text-align:left;white-space:nowrap;
  font-size:10.5px;font-weight:700;letter-spacing:.025em;
}
td{padding:11px;border-bottom:1px solid #d9f6e8;vertical-align:middle}
tbody tr{transition:background .18s}
tbody tr:hover{background:#f0fdf7}
tr:last-child td{border-bottom:0}
th:nth-child(n+3),td:nth-child(n+3){font-variant-numeric:tabular-nums}
td:nth-child(3),td:nth-child(4),td:nth-child(6){font-family:"Fira Code",monospace}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 8px;
  border:1px solid transparent;border-radius:999px;white-space:nowrap;
  font-size:10px;font-weight:700;
}
.tag:before{width:6px;height:6px;content:"";border:2px solid currentColor;border-radius:50%}
.t-ok{color:#065f46;background:#d1fae5;border-color:#6ee7b7}
.t-warn{color:#854d0e;background:#fef3c7;border-color:#fcd34d}
.t-bad{color:#991b1b;background:#fee2e2;border-color:#fca5a5}
.t-info{color:#075985;background:#e0f2fe;border-color:#7dd3fc}
.t-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.t-purple{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.bar{height:8px;min-width:64px;overflow:hidden;background:#e2e8f0;border-radius:999px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#047857,#10b981);border-radius:999px}
.avatar-sm{
  width:29px;height:29px;display:inline-grid;place-items:center;flex:none;
  color:#fff;border:2px solid #fff;border-radius:48% 52% 43% 57%/57% 42% 58% 43%;
  box-shadow:0 0 0 1px #a7f3d0;font-size:10px;font-weight:700;
}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
.col{
  min-width:0;padding:10px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(180deg,#f0fdf7,#f8fffb);
  border:1px solid #b7efd4;border-radius:17px 21px 16px 23px;
}
.col:nth-child(even){border-radius:23px 16px 22px 17px}
.col-h{
  min-height:31px;padding:3px 3px 9px;display:flex;align-items:center;gap:7px;
  color:#065f46;border-bottom:1px dashed #86efac;font-size:11px;font-weight:700;
}
.col-h .cnt{
  margin-left:auto;padding:2px 7px;color:#065f46;background:#fff;
  border:1px solid #a7f3d0;border-radius:999px;
  font:600 10px "Fira Code",monospace;
}
.kcard{
  position:relative;padding:11px;background:#fff;border:1px solid #d1fae5;
  border-radius:14px 11px 16px 12px;box-shadow:0 4px 12px rgba(6,78,59,.06);
}
.kcard .kt{margin-bottom:6px;font-size:12px;font-weight:700}
.kcard .km{display:flex;align-items:center;gap:5px;color:#475569;font-size:10.5px;line-height:1.45}
.kcard .kb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px}
.risk-l:before{
  position:absolute;left:-1px;top:10px;bottom:10px;width:4px;
  content:"";border-radius:0 5px 5px 0;
}
.rl-hi:before{background:#b91c1c}.rl-md:before{background:#a16207}.rl-lo:before{background:#047857}
.tl{position:relative;padding-left:25px}
.tl:before{position:absolute;left:8px;top:4px;bottom:4px;width:2px;content:"";background:#a7f3d0}
.tl-item{position:relative;padding:0 0 19px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;left:-23px;top:1px;width:14px;height:14px;
  background:#fff;border:3px solid #059669;border-radius:54% 46% 58% 42%;
}
.tl-item.done .tl-dot{background:#047857;box-shadow:0 0 0 4px #d1fae5}
.tl-t{font-size:12px;font-weight:700}.tl-m{margin-top:3px;color:#475569;font-size:10.5px;line-height:1.5}
.qrow{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid #d9f6e8}
.qrow:last-child{border-bottom:0}
.qrow .qx{flex:1;min-width:0}
.qrow .qx b{display:block;font-size:12px;line-height:1.4}
.qrow .qx span{display:block;margin-top:3px;color:#475569;font-size:10.5px}
.seg{display:flex;overflow:hidden;flex:none;border:1px solid #a7f3d0;border-radius:10px}
.seg span{padding:5px 8px;color:#475569;background:#fff;border-right:1px solid #d1fae5;font-size:10px;font-weight:700}
.seg span:last-child{border-right:0}
.seg span.on{color:#fff;background:#047857}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:34px;padding:7px 12px;display:inline-flex;align-items:center;
  color:#475569;background:#fff;border:1px solid #a7f3d0;border-radius:999px;
  font-size:11px;font-weight:600;
}
.chip.on{color:#fff;background:#047857;border-color:#047857;box-shadow:0 5px 15px rgba(5,150,105,.16)}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;color:#475569;font-size:11px}
.legend i{width:10px;height:10px;display:inline-block;margin-right:5px;border-radius:50%;vertical-align:middle}
.fileitem{
  min-width:0;padding:11px;display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid #c8f3df;border-radius:15px 12px 17px 13px;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.fileitem:hover{transform:translateY(-2px);border-color:#6ee7b7;box-shadow:0 8px 20px rgba(6,78,59,.08)}
.fileitem .fi{
  width:36px;height:36px;display:grid;place-items:center;flex:none;
  color:#047857;background:#d1fae5;border-radius:50% 50% 43% 57%/55% 43% 57% 45%;
}
.fileitem .fi .material-symbols-outlined{font-size:19px}
.fileitem .fx{flex:1;min-width:0}
.fileitem .fx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 11px "Fira Code",monospace}
.fileitem .fx span{display:block;margin-top:3px;color:#475569;font-size:10px}
.mini-stat{padding:9px 0;display:flex;align-items:center;gap:10px}
.mini-stat .ms-ic{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:12px 9px 13px 10px}
.mini-stat b{font:700 15px "Fira Code",monospace;font-variant-numeric:tabular-nums}
.mini-stat span{color:#475569;font-size:10.5px}
.foot{max-width:1400px;margin:auto;padding:15px 22px 34px;color:#475569;text-align:center;font:500 10px "Fira Code",monospace}
@keyframes reveal{
  from{opacity:0;transform:translateY(14px) scale(.97)}
  to{opacity:1;transform:none}
}
.screen-head,.grid>*{animation:reveal .42s cubic-bezier(.2,.8,.25,1) both}
.grid>*:nth-child(2){animation-delay:.05s}
.grid>*:nth-child(3){animation-delay:.1s}
.grid>*:nth-child(4){animation-delay:.15s}
@media(max-width:1120px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .topbar-inner{padding:10px 16px}
  main{padding:23px 16px 52px}
  .nav{top:64px}
}
@media(max-width:600px){
  .brand-t b{font-size:13px}.brand-t span{display:none}
  .pill{display:none}.topbar-inner{flex-wrap:nowrap}.topbar-right{margin-left:auto}
  .navbtn{padding:9px 12px}.nlab{display:none}
  .g4,.board{grid-template-columns:1fr}
  .card{padding:14px;border-radius:18px}
  .qrow{align-items:flex-start;flex-wrap:wrap}
  .qrow .qx{flex-basis:100%}
  .fileitem{flex-wrap:wrap}
  .screen-head p{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .screen-head,.grid>*{animation:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">eco</span></div>
      <div class="brand-t">
        <b>供應商永續風險調查系統</b>
        <span>SUPPLY CHAIN ESG DUE DILIGENCE</span>

    </div>

      <div class="pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>2026 Q3 盤查週期</div>
      <div class="pill"><span class="material-symbols-outlined" aria-hidden="true">groups</span>採購 / 永續 / 法遵</div>
      <div class="avatar" aria-label="使用者陳小姐">陳</div>
    </div>

</header>
<nav class="nav" aria-label="系統功能"><div class="nav-inner" id="nav"></div></nav>
<main id="app"></main>
<footer class="foot">供應商永續風險調查系統 Demo · 純前端展示 · 資料為模擬示意</footer>

<script>
"use strict";
var charts={};
var ACC="#059669",ACC2="#10b981",GRID="#d9f6e8",TEXT="#475569";
function destroyChart(k){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}
function mkChart(id,cfg,key){
  var el=document.getElementById(id);if(!el)return;
  destroyChart(key||id);
  Chart.defaults.color=TEXT;
  Chart.defaults.font.family='"Fira Sans",sans-serif';
  charts[key||id]=new Chart(el,cfg);
}
function initial(s){return(s||"?").slice(0,1)}
function avColor(i){return["#047857","#0f766e","#0369a1","#7c3aed","#b45309","#be123c"][i%6]}
var MODS=[
  {icon:"checklist",name:"ESG 問卷管理"},
  {icon:"fact_check",name:"供應商自評"},
  {icon:"verified",name:"第三方評級整合"},
  {icon:"shield",name:"風險分級看板"},
  {icon:"task_alt",name:"改善追蹤"},
  {icon:"gavel",name:"稽核佐證庫"}
];
function kpi(o){
  var cls=o.dir==="up"?"up":o.dir==="down"?"down":"flat";
  var ar=o.dir==="up"?"trending_up":o.dir==="down"?"trending_down":"trending_flat";
  return'<div class="kpi"><div class="ic"><span class="material-symbols-outlined" aria-hidden="true">'+o.icon+'</span></div>'+
  '<div class="lab">'+o.lab+'</div><div class="val">'+o.val+(o.unit?'<small>'+o.unit+'</small>':'')+'</div>'+
  '<div class="delta '+cls+'"><span class="material-symbols-outlined" aria-hidden="true">'+ar+'</span>'+o.delta+'</div></div>'
}
function bar(p){return'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div>'}
function miniStat(ic,col,lab,val){
  return'<div class="mini-stat"><div class="ms-ic" style="background:'+col+'20"><span class="material-symbols-outlined" style="color:'+col+';font-size:18px" aria-hidden="true">'+ic+'</span></div>'+

function s5charts(){
  mkChart("c5a",{type:"bar",data:{labels:["環境 E","社會 S","治理 G"],datasets:[
    {label:"已驗證",data:[560,352,258],backgroundColor:ACC,borderRadius:6,stack:"a"},
    {label:"待處理",data:[52,36,26],backgroundColor:"#d97706",borderRadius:6,stack:"a"}]},
    options:{maintainAspectRatio:false,responsive:true,indexAxis:"y",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:10}}}},
    scales:{x:{stacked:true,grid:{color:GRID}},y:{stacked:true,grid:{display:false}}}}})
}
var SCREENS=[{r:s0,c:s0charts},{r:s1,c:s1charts},{r:s2,c:s2charts},{r:s3,c:s3charts},{r:s4,c:s4charts},{r:s5,c:s5charts}];
function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return'<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="nlab">'+m.name+'</span></button>'}).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++)btns[i].addEventListener("click",function(){location.hash="go="+this.getAttribute("data-i")})
}
function show(i){
  var app=document.getElementById("app"),sc=SCREENS[i]||SCREENS[0];
  app.innerHTML=sc.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("active",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  try{if(sc.c)sc.c()}catch(e){}
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
