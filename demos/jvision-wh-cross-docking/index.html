<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>越庫作業管理 · WMS 倉儲物流系統</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#34d399;
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#ecfdf5;
  --track:#e6e8ea;
  --sidebar:#0f172a;
  --sidebar2:#334155;
  --side-edge:#64748b;
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#334155;
  --r:0px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{color-scheme:light}
html,body{margin:0;padding:0;min-width:320px}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Open Sans",sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  font-family:"Poppins","Open Sans",sans-serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:252px;
  height:100vh;
  min-width:0;
  padding:0;
  overflow:hidden;
  color:#fff;
  background:var(--sidebar);
  border-right:4px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:22px 18px;
  background:var(--accent);
  color:#001b11;
  border-bottom:4px solid var(--ink);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  color:#001b11;
  background:transparent;
  border:3px solid #001b11;
  border-radius:0;
  box-shadow:none;
}
.brand-logo .material-symbols-outlined{font-size:26px;font-weight:700}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.03em}
.brand-txt span{display:block;margin-top:1px;font-size:10px;font-weight:700;letter-spacing:.18em}
.nav{display:flex;flex-direction:column;gap:0;min-width:0;margin:0}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  min-height:52px;
  padding:13px 16px;
  color:#e2e8f0;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:0;
  border-bottom:1px solid #475569;
  border-radius:0;
  font-family:"Open Sans",sans-serif;
  font-size:13px;
  font-weight:700;
  transition:background-color 180ms ease,color 180ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav button:hover{color:#fff;background:#334155}
.nav button.on{color:#001b11;background:var(--accent);box-shadow:none}
.nav button.on::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:#fff}
.nav .idx{margin-left:auto;color:inherit;font-family:"Poppins",sans-serif;font-size:10px;font-weight:700;opacity:.8}
.side-foot{
  margin-top:auto;
  padding:16px 18px;
  color:#cbd5e1;
  border-top:4px solid #475569;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:10px;
  line-height:1.8;
  letter-spacing:.04em;
}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:22px 28px 56px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin:-22px -28px 22px;
  padding:18px 28px;
  background:#fff;
  border-bottom:4px solid var(--ink);
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;letter-spacing:-.025em}
.topbar h1 .material-symbols-outlined{padding:6px;color:#001b11;background:var(--accent);font-size:25px;border:2px solid var(--ink)}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:11px;
  font-weight:700;
}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid var(--ink);border-radius:0;box-shadow:none;animation:pulse 1.8s steps(2,end) infinite}
.avatar{display:flex;flex:none;align-items:center;justify-content:center;width:38px;height:38px;color:#001b11;background:var(--accent);border:2px solid var(--ink);border-radius:0;font-weight:700}
@keyframes pulse{50%{opacity:.35}}
@keyframes grid-in{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
#screen>*{animation:grid-in 380ms cubic-bezier(.34,1.56,.64,1) both}
#screen>*:nth-child(2){animation-delay:60ms}
#screen>*:nth-child(3){animation-delay:120ms}
#screen>*:nth-child(4){animation-delay:180ms}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--ink);
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--ink);
}
.card,.sec{padding:15px}
.sec{margin-bottom:14px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.sec>h3{margin-bottom:12px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:19px;font-weight:700}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:12px}
.dl dt{color:var(--muted);font-weight:700}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card.pad0>.card-h,.card.p0>.card-h{border-bottom:2px solid var(--ink)}
.card-h .hint{padding:3px 7px;color:var(--ink);background:var(--color-muted);border:1px solid var(--ink);font-size:10px;font-weight:700}

.kpi,.stat{position:relative;overflow:hidden;padding:14px}
.kpi::after{content:"";position:absolute;top:0;right:0;width:28px;height:28px;background:var(--accent);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kpi .ico{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:#001b11;background:var(--accent);border:2px solid var(--ink);border-radius:0}
.kpi .ico .material-symbols-outlined{font-size:21px;font-weight:700}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:11px;font-weight:700}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;
  color:var(--ink);
  font-family:"Poppins",sans-serif;
  font-size:25px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.035em;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;padding:2px 5px;border:1px solid currentColor;font-size:10px;font-weight:700}
.delta.up,.d.up{color:#047857}.delta.down,.d.down{color:#b91c1c}.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:10px 11px;
  color:var(--ink);
  background:var(--th);
  border-right:1px solid #cbd5e1;
  border-bottom:2px solid var(--ink);
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{padding:10px 11px;border-right:1px solid var(--line);border-bottom:1px solid #cbd5e1;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th:not(:first-child),td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hov)}
.mono,td:first-child{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:.01em;
}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:0;font-size:10px;font-weight:700;white-space:nowrap}
.t-ok{color:#065f46;background:#d1fae5}
.t-warn{color:#854d0e;background:#fef3c7}
.t-bad{color:#991b1b;background:#fee2e2}
.t-info{color:#1e3a8a;background:#dbeafe}
.t-gray{color:#334155;background:#e2e8f0}
.t-acc,.t-pink{color:#064e3b;background:#a7f3d0}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--muted);font-family:ui-monospace,monospace;font-size:10px;font-weight:700;text-align:right}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 16px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-25px;width:15px;height:15px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:ui-monospace,monospace;font-size:10px;font-weight:700}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #94a3b8;font-size:12px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:10px}
.note{margin-top:12px;padding-top:11px;color:var(--muted);border-top:1px dashed #94a3b8;font-size:11px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--th);border:2px solid var(--ink);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;font-size:12px;font-weight:700}
.col-h .cnt{padding:1px 7px;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:0;font-family:ui-monospace,monospace;font-size:10px}
.pcard{padding:10px 11px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--accent);border-radius:0}
.pcard b{font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:10px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#001b11;background:var(--accent);border:1px solid var(--ink);border-radius:0;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 12px;background:#fff;border:2px solid var(--ink);border-radius:0}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#001b11;background:var(--accent);border:2px solid var(--ink);border-radius:0;font-family:ui-monospace,monospace;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--muted);background:#fff;border:2px solid var(--ink);border-radius:0;font-family:ui-monospace,monospace;font-size:10px}
.steps .ln{width:18px;height:3px;background:var(--line)}
.steps .s.done{color:#001b11;background:var(--accent);border-color:var(--ink)}
.steps .s.cur{color:var(--ink);border:4px solid var(--accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 3px;border-bottom:1px dashed #94a3b8}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12px}.rep-row .sku span{color:var(--muted);font-size:10px}
.gauge{flex:none;width:110px}.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid var(--ink);border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:ui-monospace,monospace;font-size:9px;text-align:right}
.band{position:relative;height:27px;min-width:150px;background:var(--track);border:1px solid var(--ink);border-radius:0}
.band .rng{position:absolute;inset-block:0;background:var(--accent-soft);border-radius:0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:2px;width:12px;height:21px;background:var(--accent);border:1px solid var(--ink);border-radius:0;box-shadow:none}

.tile{display:flex;flex-direction:column;gap:6px;padding:14px}
.tile .ti{display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:#001b11;background:var(--accent);border:2px solid var(--ink);border-radius:0}
.tile .ti .material-symbols-outlined{font-size:21px;font-weight:700}
.tile b{font-family:"Poppins","Open Sans",sans-serif;font-size:13px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.tile .tv{font-size:22px}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:14px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{padding:12px 14px}
  .brand-logo{width:38px;height:38px}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .nav button{justify-content:center;min-height:48px;padding:10px 8px;border-right:1px solid #64748b;border-bottom:0}
  .nav button.on::before{inset:auto 0 0;width:auto;height:6px}
  .nav .idx,.side-foot{display:none}
  .main{padding:18px 15px 44px}
  .topbar{align-items:flex-start;margin:-18px -15px 18px;padding:15px;flex-direction:column}
  .top-right{justify-content:flex-start}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:560px){
  body{font-size:12px}
  .g4,.board{grid-template-columns:1fr}
  .nav button{gap:0}.nav button .txt{display:none}.nav button .material-symbols-outlined{font-size:23px}
  .topbar h1{font-size:19px}
  .top-right{display:grid;width:100%;grid-template-columns:1fr auto}
  .top-right .chip:first-child{grid-column:1/-1}
  .chip{justify-content:center}
  .card,.sec{padding:12px}
  .card,.sec,.kpi,.stat,.tile{box-shadow:4px 4px 0 var(--ink)}
  .dl{grid-template-columns:1fr;gap:2px}.dl dt{margin-top:8px}
  .lane-row{align-items:flex-start;flex-wrap:wrap}.steps{width:100%;justify-content:flex-end}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #screen>*{opacity:1!important;transform:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">swap_horiz</span></div>
      <div class="brand-txt"><b>越庫調度台</b><span>CROSS DOCKING</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08/21<br/>越庫率 18.6%<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

/* ── 圖表（曲線與圓角為變化點）── */
var AX={style:{colors:"#928482",fontSize:"11px"}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};
var CURVE="smooth", BR=5;
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function _h(x,d){return typeof x==="number"?(x>0&&x<20?Math.round(d*x):x):d}
function mkArea(el,data,cats,name,x){push(el,{chart:Object.assign({},CB,{type:"area",height:_h(x,230)}),series:[{name:name,data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#f8eee6",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:3},colors:[typeof x==="string"?x:"#b45309"],
 fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.38,opacityTo:.04,stops:[0,90]}},tooltip:{theme:"light"}})}
function mkBar(el,cats,data,name,horiz,a6,a7){
 var color=typeof a6==="string"?a6:"#b45309", min=typeof a6==="number"?a6:undefined, h=_h(a7,230);
 push(el,{chart:Object.assign({},CB,{type:"bar",height:h}),series:[{name:name||"數值",data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{min:min,labels:{style:AX.style}},grid:{borderColor:"#f8eee6",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR,horizontal:!!horiz,columnWidth:"54%",barHeight:"60%"}},
 colors:[color],tooltip:{theme:"light"}})}
function mkStack(el,cats,series,horiz,h){push(el,{chart:Object.assign({},CB,{type:"bar",height:_h(h,245),stacked:true}),series:series,
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#f8eee6",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR?3:0,horizontal:!!horiz,columnWidth:"55%",barHeight:"62%"}},
 legend:{position:"bottom",fontSize:"11.5px"},colors:["#b45309","#f0b45e","#f6d29e","#823c06","#ecd2bf","#562804"],tooltip:{theme:"light"}})}
function mkDonut(el,labels,data,h){push(el,{chart:Object.assign({},CB,{type:"donut",height:_h(h,240)}),series:data,labels:labels,
 colors:["#b45309","#f0b45e","#f6d29e","#823c06","#ecd2bf","#562804"],legend:{position:"bottom",fontSize:"11.5px"},dataLabels:{enabled:false},
 plotOptions:{pie:{donut:{size:BR?"64%":"52%"}}},stroke:{width:2},tooltip:{theme:"light"}})}
function mkRadar(el,cats,data,name,h){push(el,{chart:Object.assign({},CB,{type:"radar",height:_h(h,270)}),series:[{name:name||"分數",data:data}],
 xaxis:{categories:cats},yaxis:{show:false},colors:["#b45309"],markers:{size:4},dataLabels:{enabled:false},tooltip:{theme:"light"}})}
function mkLine2(el,cats,s1,s2,h){push(el,{chart:Object.assign({},CB,{type:"line",height:_h(h,240)}),series:[s1,s2],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#f8eee6",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:[3,3],dashArray:[0,5]},colors:["#b45309","#f0b45e"],
 legend:{position:"top",fontSize:"11.5px"},tooltip:{theme:"light"}})}
function mkHeat(el,series,h){push(el,{chart:Object.assign({},CB,{type:"heatmap",height:_h(h,300)}),series:series,
 dataLabels:{enabled:false},xaxis:{labels:AX},yaxis:{labels:{style:AX.style}},
 legend:{position:"bottom",fontSize:"11px"},tooltip:{theme:"light"},stroke:{width:2,colors:["#fff"]}})}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
