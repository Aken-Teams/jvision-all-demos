<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>課程教學工具 · 學習管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b524c; --mint:#5eead4; --mint-soft:#ccfbf1;
  --ink:#0f172a; --slate:#475569; --muted:#94a3b8; --line:#e2e8f0;
  --bg:#f1f5f9; --card:#ffffff; --amber:#d97706; --rose:#e11d48; --sky:#0284c7; --violet:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:linear-gradient(180deg,#fbfffe,#f4faf9);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--mint));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28)}
.logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:700;display:block}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;color:var(--slate);font:inherit;font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:.15s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:20px;color:var(--muted);flex:none}
.nav button:hover{background:var(--mint-soft);color:var(--teal-d)}
.nav button.on{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.3)}
.nav button.on .material-symbols-outlined{color:#fff}
.sidefoot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 8px 2px;border-top:1px solid var(--line)}
.main{flex:1;padding:26px 30px 46px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.top .sub{font-size:13px;color:var(--slate);margin-top:3px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--slate);font-weight:500}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.col-2-1{grid-template-columns:2fr 1fr}
.col-1-2{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--teal)}
.card .cs{font-size:12px;color:var(--muted);margin-bottom:14px}
.kpi{position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--mint-soft);color:var(--teal);margin-bottom:12px}
.kpi .lab{font-size:12.5px;color:var(--slate);font-weight:500}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.5px;margin-top:3px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:11.5px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--teal)} .down{color:var(--rose)}
.kpi .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--mint))}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafc}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.t-green{background:#d1fae5;color:#047857} .t-amber{background:#fef3c7;color:#b45309}
.t-rose{background:#ffe4e6;color:#be123c} .t-sky{background:#e0f2fe;color:#0369a1}
.t-slate{background:#f1f5f9;color:#475569} .t-violet{background:#ede9fe;color:#6d28d9}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.who{display:flex;align-items:center;gap:9px}
.pbar{height:7px;border-radius:99px;background:#eef2f6;overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--mint))}
.chart{width:100%;height:280px}
.chart.sm{height:230px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bcol{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:11px;color:var(--slate)}
.bcol .bh .n{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
.bcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bcard:last-child{margin-bottom:0}
.bcard .tt{font-size:13px;font-weight:600;margin-bottom:5px}
.bcard .mt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bl{width:100%;height:4px;border-radius:99px;margin-bottom:9px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px 0}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--mint-soft)}
.tli .th{font-size:13px;font-weight:600}
.tli .tm{font-size:11.5px;color:var(--muted)}
.tli .td{font-size:12.5px;color:var(--slate);margin-top:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{background:#f8fafc;border:1px solid var(--line);border-radius:10px;min-height:78px;padding:7px 8px;font-size:11px}
.cell .dn{font-size:12px;font-weight:700;color:var(--slate)}
.cell.dim{opacity:.4}
.ev{display:block;margin-top:4px;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.a{background:var(--mint-soft);color:var(--teal-d)} .ev.b{background:#e0f2fe;color:#0369a1}
.ev.c{background:#fef3c7;color:#b45309} .ev.d{background:#ede9fe;color:#6d28d9}
.thread{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:11px;align-items:flex-start}
.msg .bub{background:#f1f5f9;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:13px;color:var(--ink);max-width:78%}
.msg .nm{font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--mint-soft);border-radius:14px 4px 14px 14px;color:var(--teal-d)}
.msg.me .avatar{background:var(--violet)}
.cert{border:2px dashed var(--mint);background:linear-gradient(135deg,#f0fdfa,#fff);border-radius:16px;padding:22px 20px;text-align:center;position:relative}
.cert .seal{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--mint));display:inline-flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px;box-shadow:0 6px 16px rgba(15,118,110,.3)}
.cert .seal .material-symbols-outlined{font-size:28px}
.cert .cn{font-size:16px;font-weight:700}
.cert .cd{font-size:12px;color:var(--slate);margin:4px 0 12px}
.cert .cno{font-size:11px;color:var(--muted);letter-spacing:.5px}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rowb{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.rowb:last-child{border-bottom:none}
.mini{font-size:11px;color:var(--muted)}
.hn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.hn .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.hn b{font-size:19px;font-weight:700}
.hn .l{font-size:11.5px;color:var(--muted)}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column;padding:14px 16px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px}
  .nav button{width:auto;flex:none;padding:9px 13px}
  .sidefoot{display:none}
  .main{padding:20px 18px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.col-2-1,.col-1-2,.board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button{padding:10px 12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">school</span></div>
      <div><b>課程教學工具</b><span>學習管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">Jvision LMS Demo · 純 UI 展示<br/>資料為擬真示範</div>
  </aside>
  <main class="main">
    <div id="stage"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"menu_book",name:"課程與教材"},
  {icon:"groups",name:"班級名冊"},
  {icon:"quiz",name:"作業測驗"},
  {icon:"trending_up",name:"學習進度"},
  {icon:"forum",name:"提問輔導"},
  {icon:"workspace_premium",name:"結業證書"}
];
var chart=null;
function disposeChart(){ if(chart){ try{chart.dispose();}catch(e){} chart=null; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function head(t,s,chips){
  var c=(chips||[]).map(function(x){return '<span class="chip"><span class="dot" style="background:'+(x.c||'var(--teal)')+'"></span>'+esc(x.t)+'</span>';}).join('');
  return '<div class="top"><div><h1>'+esc(t)+'</h1><div class="sub">'+esc(s)+'</div></div><div class="chipbar">'+c+'</div></div>';
}
function kpi(ic,lab,val,unit,delta,dir,w){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+(dir||'up')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dir==='down'?'arrow_downward':'arrow_upward')+'</span>'+delta+'</div>'+
    '<div class="bar" style="width:'+(w||70)+'%"></div></div>';
}
function pbar(p){return '<div style="display:flex;align-items:center;gap:8px"><div class="pbar" style="flex:1"><i style="width:'+p+'%"></i></div><span class="mini" style="width:34px;text-align:right">'+p+'%</span></div>';}

/* ===== SCREEN 0 : 課程與教材 ===== */
function s0(){
  var courses=[
    {c:"C-2401",n:"Python 資料分析入門",cat:"資料科學",teacher:"林筱涵",units:12,pub:11,ver:"v3.2",st:"上架中",stg:"t-green"},
    {c:"C-2402",n:"UI/UX 設計實戰",cat:"設計",teacher:"陳冠宇",units:10,pub:10,ver:"v2.0",st:"上架中",stg:"t-green"},
    {c:"C-2405",n:"數位行銷策略",cat:"商業",teacher:"王思穎",units:8,pub:5,ver:"v1.4",st:"編修中",stg:"t-amber"},
    {c:"C-2408",n:"雲端架構與 DevOps",cat:"雲端",teacher:"張博勛",units:14,pub:14,ver:"v4.1",st:"上架中",stg:"t-green"},
    {c:"C-2411",n:"英語簡報表達",cat:"語言",teacher:"李珮瑄",units:6,pub:2,ver:"v0.9",st:"草稿",stg:"t-slate"},
    {c:"C-2414",n:"財務報表判讀",cat:"商業",teacher:"吳承翰",units:9,pub:9,ver:"v2.6",st:"待審核",stg:"t-sky"}
  ];
  var rows=courses.map(function(o){
    return '<tr><td><b>'+o.c+'</b></td><td>'+esc(o.n)+'</td><td><span class="tag t-slate">'+o.cat+'</span></td>'+
      '<td><div class="who"><span class="avatar">'+esc(o.teacher.slice(-2))+'</span>'+esc(o.teacher)+'</div></td>'+
      '<td style="min-width:140px">'+pbar(Math.round(o.pub/o.units*100))+'<div class="mini">'+o.pub+'/'+o.units+' 單元</div></td>'+
      '<td>'+o.ver+'</td><td><span class="tag '+o.stg+'">'+o.st+'</span></td></tr>';
  }).join('');
  return head("課程與教材","建立課程單元、上傳教材並管理版本上架狀態",[{t:"本季 24 門課"},{t:"教材 318 份",c:"var(--sky)"}])+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("library_books","上架課程","24","門","本季 +6 門","up",78)+
    kpi("description","教材資源","318","份","+42 份","up",64)+
    kpi("update","待審核版本","3","件","2 件今日到期","down",30)+
    kpi("visibility","平均完課曝光","92","%","+7pt","up",92)+
  '</div>'+
  '<div class="grid col-2-1">'+
    '<div class="card"><h3><span class="material-symbols-outlined">menu_book</span>課程清單</h3><div class="cs">依上架狀態排序，可追蹤教材版本</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>課程編號</th><th>課程名稱</th><th>分類</th><th>授課老師</th><th>教材完成度</th><th>版本</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>教材類型分佈</h3><div class="cs">318 份教材資源</div><div id="c0" class="chart sm"></div></div>'+
  '</div>';
}
function c0(){
  chart=echarts.init(document.getElementById('c0'));
  chart.setOption({
    tooltip:{trigger:'item'},
    legend:{bottom:0,itemWidth:9,itemHeight:9,textStyle:{fontSize:11}},
    series:[{type:'pie',radius:['46%','70%'],center:['50%','44%'],avoidLabelOverlap:false,
      itemStyle:{borderColor:'#fff',borderWidth:2},label:{show:false},
      data:[
        {value:118,name:'影片教學',itemStyle:{color:'#0f766e'}},
        {value:86,name:'簡報講義',itemStyle:{color:'#5eead4'}},
        {value:64,name:'練習題組',itemStyle:{color:'#0284c7'}},
        {value:32,name:'補充讀物',itemStyle:{color:'#7c3aed'}},
        {value:18,name:'外部連結',itemStyle:{color:'#f59e0b'}}
      ]}]
  });
}

/* ===== SCREEN 1 : 班級名冊 ===== */
function s1(){
  var cls=[
    {c:"A 班 · 資料分析",cap:32,en:30,att:94},
    {c:"B 班 · UI/UX 設計",cap:28,en:28,att:88},
    {c:"C 班 · 雲端 DevOps",cap:24,en:21,att:91},
    {c:"D 班 · 數位行銷",cap:30,en:26,att:82}
  ];
  var hn=cls.map(function(o){
    var col=o.att>=90?'var(--teal)':o.att>=85?'var(--sky)':'var(--amber)';
    return '<div class="hn"><div class="ic" style="background:var(--mint-soft);color:var(--teal)"><span class="material-symbols-outlined">diversity_3</span></div>'+
      '<div style="flex:1"><b>'+o.en+'<span style="font-size:13px;color:var(--muted)">/'+o.cap+'</span></b><div class="l">'+esc(o.c)+' · 出勤 <span style="color:'+col+';font-weight:600">'+o.att+'%</span></div></div></div>';
  }).join('');
  var students=[
    {n:"黃冠傑",cls:"A 班",att:96,late:1,st:"正常",stg:"t-green"},
    {n:"周雅琳",cls:"A 班",att:71,late:4,st:"出勤偏低",stg:"t-amber"},
    {n:"蔡明軒",cls:"B 班",att:100,late:0,st:"全勤",stg:"t-green"},
    {n:"許庭瑄",cls:"C 班",att:58,late:6,st:"需關懷",stg:"t-rose"},
    {n:"鄭宇翔",cls:"D 班",att:83,late:2,st:"正常",stg:"t-green"},
    {n:"劉思妤",cls:"B 班",att:90,late:1,st:"正常",stg:"t-green"}
  ];
  var srows=students.map(function(o){
    return '<tr><td><div class="who"><span class="avatar">'+esc(o.n.slice(-2))+'</span>'+esc(o.n)+'</div></td>'+
      '<td>'+o.cls+'</td><td style="min-width:120px">'+pbar(o.att)+'</td><td>'+o.late+' 次</td><td><span class="tag '+o.stg+'">'+o.st+'</span></td></tr>';
  }).join('');
  return head("班級名冊","學員分班、名冊管理與出勤掌握",[{t:"4 個班級"},{t:"在籍 105 人",c:"var(--sky)"},{t:"需關懷 1 人",c:"var(--rose)"}])+
  '<div class="grid g4" style="margin-bottom:16px">'+hn+'</div>'+
  '<div class="grid col-1-2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>近 6 週出勤趨勢</h3><div class="cs">全機構平均出席率</div><div id="c1" class="chart sm"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">badge</span>學員名冊</h3><div class="cs">依出勤風險排序，需關懷者優先</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>學員</th><th>班級</th><th>出勤率</th><th>遲到</th><th>狀態</th></tr></thead><tbody>'+srows+'</tbody></table></div></div>'+
  '</div>';
}
function c1(){
  chart=echarts.init(document.getElementById('c1'));
  chart.setOption({
    grid:{left:38,right:14,top:20,bottom:26},
    tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:['第1週','第2週','第3週','第4週','第5週','第6週'],axisLine:{lineStyle:{color:'#cbd5e1'}},axisLabel:{fontSize:11,color:'#64748b'}},

function buildNav(){

  });
}

function show(i){
  disposeChart();
  var nav=document.getElementById('nav');
  nav.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',+b.getAttribute('data-i')===i); });
  var stage=document.getElementById('stage');

  stage.innerHTML=s.f();
  void stage.offsetHeight;
  if(s.c) s.c();
}
