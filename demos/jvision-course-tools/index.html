<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>課程教學工具 · 學習管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
/* Minimal Swiss Learning Operations */
:root{
  --color-primary:#4F46E5;
  --color-on-primary:#FFFFFF;
  --color-secondary:#818CF8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#EEF2FF;
  --color-foreground:#1E1B4B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E1B4B;
  --color-muted:#EBEEF8;
  --color-muted-foreground:#475569;
  --color-border:#C7D2FE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#4F46E5;

  /* Public compatibility variables */
  --blue:#4F46E5;
  --ink:#1E1B4B;
  --muted:#64748B;
  --line:#C7D2FE;

  /* Legacy aliases used by the existing markup and scripts */
  --teal:#4F46E5;
  --teal-d:#3730A3;
  --mint:#818CF8;
  --mint-soft:#E0E7FF;
  --slate:#475569;
  --bg:#EEF2FF;
  --card:#FFFFFF;
  --amber:#C2410C;
  --rose:#DC2626;
  --sky:#0369A1;
  --violet:#6D28D9;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --shadow-sm:0 2px 0 rgba(30,27,75,.06);
  --shadow-md:0 8px 24px rgba(49,46,129,.09);
}

*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;scroll-behavior:smooth}
body{
  overflow-x:hidden;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Comic Neue","Noto Sans TC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[role="button"]{cursor:pointer}
button{font-family:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#C7D2FE;color:#1E1B4B}

.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:'liga';
  -webkit-font-feature-settings:'liga';
}

.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  gap:8px;
  width:264px;
  height:100vh;
  padding:24px 18px 18px;
  overflow-y:auto;
  background:#FFFFFF;
  border-right:1px solid var(--color-border);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  padding:0 6px 20px;
  border-bottom:1px solid var(--color-border);
}
.logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  border-radius:10px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:4px 4px 0 #C7D2FE;
}
.logo .material-symbols-outlined{font-size:24px}
.brand b,.top h1,.card h3,.kpi .val,.hn b,.cert .cn{
  font-family:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.brand span:not(.material-symbols-outlined){display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:var(--color-muted-foreground);
  font-size:14px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{flex:none;color:#64748B;font-size:21px}
.nav button:hover{transform:translateX(2px);border-color:var(--color-border);background:#EEF2FF;color:#312E81}
.nav button.on{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:4px 4px 0 #C7D2FE;
}
.nav button.on .material-symbols-outlined{color:var(--color-on-primary)}
.sidefoot{
  margin-top:auto;
  padding:15px 7px 2px;
  border-top:1px solid var(--color-border);
  color:#64748B;
  font-size:11px;
  line-height:1.6;
}

.main{flex:1;min-width:0;padding:32px clamp(20px,3vw,44px) 52px}
#stage{max-width:1500px;margin:0 auto;animation:stage-in .35s ease-out both}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:2px solid var(--color-foreground);
}
.top h1{font-size:clamp(27px,2.5vw,36px);font-weight:700;line-height:1.08;letter-spacing:-.025em}
.top .sub{max-width:680px;margin-top:6px;color:var(--color-muted-foreground);font-size:14px}
.chipbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  border:1px solid var(--color-border);
  border-radius:999px;
  background:var(--color-card);
  color:#334155;
  font-size:12px;
  font-weight:700;
  box-shadow:var(--shadow-sm);
}
.chip .dot{width:8px;height:8px;flex:none;border-radius:2px;background:var(--color-primary)}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.col-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.col-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  position:relative;
  padding:20px;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{transform:translateY(-2px);border-color:#A5B4FC;box-shadow:var(--shadow-md)}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:17px;font-weight:700;line-height:1.3}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.card .cs{margin-bottom:16px;color:var(--color-muted-foreground);font-size:12px}

.kpi{min-height:174px;padding-bottom:25px}
.kpi::after{content:"";position:absolute;top:0;right:0;width:42px;height:42px;border-bottom:1px solid var(--color-border);border-left:1px solid var(--color-border);background:#EEF2FF}
.kpi .ic{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  margin-bottom:14px;
  border:1px solid #C7D2FE;
  border-radius:var(--radius-sm);
  background:#E0E7FF;
  color:#3730A3;
}
.kpi .lab{color:#475569;font-size:12px;font-weight:700}
.kpi .val{margin-top:2px;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:4px;color:#64748B;font-family:"Comic Neue",sans-serif;font-size:13px;font-weight:700;letter-spacing:0}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;font-weight:700}
.up{color:#047857}.down{color:#B91C1C}
.kpi .bar{position:absolute;bottom:0;left:0;height:4px;background:var(--color-primary)}

/* Data tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
th{
  padding:10px 12px;
  border-top:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);
  background:#EEF2FF;
  color:#3730A3;
  font-size:11px;
  font-weight:700;
  letter-spacing:.045em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:first-child{border-left:1px solid var(--color-border);border-radius:8px 0 0 8px}
th:last-child{border-right:1px solid var(--color-border);border-radius:0 8px 8px 0}
td{padding:12px;border-bottom:1px solid #E2E8F0;color:#273054;white-space:nowrap}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFF}
tbody tr:last-child td{border-bottom:none}
td:first-child b,.cno{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td[style*="min-width"]{font-variant-numeric:tabular-nums}

.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:26px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:11.5px;
  font-weight:700;
  line-height:1.2;
}
.tag::before{content:"";width:6px;height:6px;flex:none;border-radius:1px;background:currentColor}
.t-green{background:#ECFDF5;color:#047857}
.t-amber{background:#FFF7ED;color:#9A3412}
.t-rose{background:#FEF2F2;color:#B91C1C}
.t-sky{background:#F0F9FF;color:#0369A1}
.t-slate{background:#F1F5F9;color:#475569}
.t-violet{background:#F5F3FF;color:#6D28D9}

.avatar{
  display:inline-flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border-radius:8px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  font-size:12px;
  font-weight:700;
}
.who{display:flex;align-items:center;gap:9px}
.pbar{height:7px;min-width:70px;overflow:hidden;border-radius:2px;background:#E2E8F0}
.pbar i{display:block;height:100%;border-radius:2px;background:var(--color-primary)}
.mini{color:#64748B;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:280px}
.chart.sm{height:230px}

/* Workflow board */
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px}
.bcol{min-height:140px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:#F8FAFF}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#334155;font-size:13px;font-weight:700}
.bcol .bh .n{min-width:25px;padding:2px 7px;border:1px solid var(--color-border);border-radius:5px;background:#FFFFFF;color:#475569;font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.bcard{margin-bottom:9px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:#FFFFFF;box-shadow:var(--shadow-sm);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.bcard:hover{transform:translateY(-2px);border-color:#818CF8;box-shadow:0 5px 14px rgba(49,46,129,.1)}
.bcard:last-child{margin-bottom:0}
.bcard .tt{margin-bottom:6px;font-size:13px;font-weight:700}
.bcard .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#64748B;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
.bl{width:100%;height:4px;margin-bottom:10px;border-radius:1px}

/* Timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--color-border)}
.tli{position:relative;padding:0 0 20px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;top:4px;left:-22px;width:10px;height:10px;border:2px solid #FFFFFF;border-radius:2px;background:var(--color-primary);box-shadow:0 0 0 2px #A5B4FC}
.tli .th{font-size:13px;font-weight:700}
.tli .tm{color:#64748B;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-variant-numeric:tabular-nums}
.tli .td{margin-top:3px;color:#475569;font-size:12.5px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:6px;min-width:560px}
.cal .dow{padding:5px;color:#475569;font-size:11px;font-weight:700;text-align:center}
.cell{min-height:82px;padding:7px 8px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:#F8FAFF;font-size:11px}
.cell .dn{color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cell.dim{opacity:.52}
.ev{display:block;margin-top:5px;padding:3px 6px;overflow:hidden;border-left:3px solid currentColor;border-radius:3px;background:#FFFFFF;font-size:10.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.ev.a{color:#3730A3}.ev.b{color:#0369A1}.ev.c{color:#9A3412}.ev.d{color:#6D28D9}

/* Messages */
.thread{display:flex;flex-direction:column;gap:15px}
.msg{display:flex;align-items:flex-start;gap:10px}
.msg .bub{max-width:78%;padding:10px 13px;border:1px solid #CBD5E1;border-radius:3px 12px 12px 12px;background:#F8FAFC;color:#1E293B;font-size:13px}
.msg .nm{margin-bottom:4px;color:#64748B;font-size:11.5px;font-weight:700}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{border-color:#A5B4FC;border-radius:12px 3px 12px 12px;background:#E0E7FF;color:#312E81}
.msg.me .avatar{background:#6D28D9}

/* Certificate */
.cert{position:relative;padding:24px 20px;overflow:hidden;border:2px solid var(--color-primary);border-radius:var(--radius-md);background:#FFFFFF;text-align:center;box-shadow:5px 5px 0 #C7D2FE}
.cert::before,.cert::after{content:"";position:absolute;width:28px;height:28px;border-color:#A5B4FC}
.cert::before{top:8px;left:8px;border-top:2px solid;border-left:2px solid}
.cert::after{right:8px;bottom:8px;border-right:2px solid;border-bottom:2px solid}
.cert .seal{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;margin-bottom:11px;border-radius:50%;background:var(--color-primary);color:var(--color-on-primary);box-shadow:0 0 0 5px #E0E7FF}
.cert .seal .material-symbols-outlined{font-size:29px}
.cert .cn{font-size:19px;font-weight:700}
.cert .cd{margin:4px 0 12px;color:#475569;font-size:12px}
.cert .cno{color:#64748B;font-size:11px;letter-spacing:.05em}
.pulse{animation:pulse 2.2s ease-in-out infinite}

.rowb{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #E2E8F0;font-size:13px}
.rowb:last-child{border-bottom:none}
.hn{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-card);box-shadow:var(--shadow-sm);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.hn:hover{transform:translateY(-2px);border-color:#A5B4FC;box-shadow:var(--shadow-md)}
.hn .ic{display:flex;flex:none;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid #C7D2FE!important;border-radius:var(--radius-sm)!important;background:#E0E7FF!important;color:#3730A3!important}
.hn b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.hn .l{color:#64748B;font-size:11.5px}

/* Existing inline action buttons receive the same product styling */
td button{
  min-height:34px;
  padding:6px 12px!important;
  border:1px solid var(--color-primary)!important;
  border-radius:var(--radius-sm)!important;
  background:#FFFFFF!important;
  color:#3730A3!important;
  font-weight:700!important;
  transition:background-color .2s ease,color .2s ease,box-shadow .2s ease,transform .2s ease;
}
td button:hover{transform:translateY(-1px);background:var(--color-primary)!important;color:var(--color-on-primary)!important;box-shadow:3px 3px 0 #C7D2FE}

@keyframes stage-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px #E0E7FF}50%{box-shadow:0 0 0 9px #C7D2FE}}

@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col-2-1,.col-1-2{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:static;width:100%;height:auto;padding:14px 16px;border-right:0;border-bottom:1px solid var(--color-border)}
  .brand{margin-bottom:4px;padding-bottom:13px}
  .nav{flex-direction:row;gap:7px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:thin}
  .nav button{width:auto;flex:none;padding:9px 12px}
  .nav button:hover{transform:translateY(-1px)}
  .sidefoot{display:none}
  .main{padding:24px 18px 42px}
  .top{align-items:flex-start;flex-direction:column}
  .chipbar{justify-content:flex-start}
}
@media(max-width:768px){
  .g3,.g2,.col-2-1,.col-1-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,minmax(220px,1fr))}
  .card{padding:17px}
}
@media(max-width:560px){
  .main{padding:20px 14px 36px}
  .g4{grid-template-columns:1fr}
  .top{gap:14px;margin-bottom:18px;padding-bottom:16px}
  .top h1{font-size:27px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button{min-width:44px;justify-content:center;padding:10px}
  .chip{min-height:32px}
  .kpi{min-height:158px}
  .rowb{align-items:flex-start;gap:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  #stage,.pulse{animation:none!important}
  .card:hover,.hn:hover,.bcard:hover,td button:hover,.nav button:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">school</span></div>
      <div><b>課程教學工具</b><span>學習管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">Jvision LMS Demo · 純 UI 展示<br/>資料為擬真示範</div>
  </aside>
  <main class="main">
    <div id="stage"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"menu_book",name:"課程與教材"},
  {icon:"groups",name:"班級名冊"},
  {icon:"quiz",name:"作業測驗"},
  {icon:"trending_up",name:"學習進度"},
  {icon:"forum",name:"提問輔導"},
  {icon:"workspace_premium",name:"結業證書"}
];
var chart=null;
function disposeChart(){ if(chart){ try{chart.dispose();}catch(e){} chart=null; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function head(t,s,chips){
  var c=(chips||[]).map(function(x){return '<span class="chip"><span class="dot" style="background:'+(x.c||'var(--teal)')+'"></span>'+esc(x.t)+'</span>';}).join('');
  return '<div class="top"><div><h1>'+esc(t)+'</h1><div class="sub">'+esc(s)+'</div></div><div class="chipbar">'+c+'</div></div>';
}
function kpi(ic,lab,val,unit,delta,dir,w){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+(dir||'up')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dir==='down'?'arrow_downward':'arrow_upward')+'</span>'+delta+'</div>'+
    '<div class="bar" style="width:'+(w||70)+'%"></div></div>';
}

var SCREENS=[{f:s0,c:c0},{f:s1,c:c1},{f:s2,c:c2},{f:s3,c:c3},{f:s4,c:null},{f:s5,c:null}];

function buildNav(){
  var nav=document.getElementById('nav');
  nav.innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span>'+m.name+'</span></button>';
  }).join('');
  nav.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){show(+b.getAttribute('data-i'));});
  });
}

function show(i){
  disposeChart();
  var nav=document.getElementById('nav');
  nav.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',+b.getAttribute('data-i')===i); });
  var stage=document.getElementById('stage');
  var s=SCREENS[i]||SCREENS[0];
  stage.innerHTML=s.f();
  void stage.offsetHeight;
  if(s.c) s.c();
}

buildNav();
show(0);
window.addEventListener('resize',function(){ if(chart){ try{chart.resize();}catch(e){} } });

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
