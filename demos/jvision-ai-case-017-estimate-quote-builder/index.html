<style>
:root{
--color-primary:#64748B;--color-on-primary:#FFF;--color-secondary:#94A3B8;
--color-on-secondary:#0F172A;--color-accent:#EA580C;--color-on-accent:#000;

--color-card-foreground:#334155;--color-muted:#EBF0F5;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFF;
--color-ring:#64748B;--blue:#64748B;--ink:#334155;--muted:#475569;--line:#E2E8F0;
--bg:var(--color-background);--card:var(--color-card);--mut:var(--muted);

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC",sans-serif;line-height:1.5}
button,[onclick]{cursor:pointer}
button:focus-visible,[onclick]:focus-visible{outline:3px solid rgba(234,88,12,.32);outline-offset:2px}
.material-symbols-outlined{font-size:19px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;padding:10px clamp(16px,3vw,42px);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;min-width:238px}
.logo{width:38px;height:38px;display:grid;place-items:center;background:#0F172A;color:#FFF;border-radius:5px;font:800 15px Inter;box-shadow:5px 5px 0 var(--accent)}

.wrap{max-width:1440px;margin:auto;padding:18px clamp(14px,2.6vw,36px) 40px}

.vh:after{width:250px;height:118px;right:8%;top:31px;border:1px solid rgba(255,255,255,.3);transform:skewY(-10deg) rotate(-3deg);box-shadow:18px 15px 0 rgba(234,88,12,.18),36px 30px 0 rgba(255,255,255,.06)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi,.card,.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 18px rgba(15,23,42,.035)}
.kpi{position:relative;min-width:0;padding:15px 16px;border-top:3px solid var(--color-primary);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .l{color:var(--mut);font-size:11px;font-weight:600}
.kpi .v{margin-top:3px;color:#0F172A;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:2px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:13px;top:13px;color:var(--accent)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}.g11,.two,.upa{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr 350px}
.card{padding:15px 16px}
.card h3{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px;color:#0F172A;font-size:13px}

.tag{display:inline-flex;align-items:center;border-radius:3px;padding:3px 7px;font-size:10px;font-weight:700;white-space:nowrap}
.t-ok{background:#D1FAE5;color:#065F46}.t-warn{background:#FEF3C7;color:#92400E}.t-bad{background:#FEE2E2;color:#991B1B}.t-info{background:#E2E8F0;color:#334155}.t-mut{background:#EEF2F6;color:#475569}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:#F1F5F9;color:#475569;font-size:10.5px;font-weight:800;letter-spacing:.035em;text-transform:uppercase}
table.data tbody tr:hover,table.data tr:not(:first-child):hover{background:#FFF7ED}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data td.num{font-family:"JetBrains Mono",monospace}
table.data tr.grp td{background:#E8EDF3;color:#334155;font-weight:800}
table.data tr.sum td{background:#172033;color:#FFF;font-weight:800}
.chart{height:250px}
.wi{display:flex;flex-direction:column;gap:3px}
.wig{padding:10px 6px 3px;color:#334155;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid transparent;border-radius:5px;transition:.18s}
.wrow:hover{background:#F1F5F9}
.wrow.sel{border-color:#FDBA74;background:#FFF7ED;box-shadow:inset 3px 0 var(--accent)}
.wrow .code{width:52px;flex:none;color:#475569;font:400 10px "JetBrains Mono"}
.wrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.wrow .amt{flex:none;font:600 11px "JetBrains Mono"}
.qpanel{position:sticky;top:74px}
.qhd{margin-bottom:12px;padding:17px;border-radius:var(--radius);background:#172033;color:#FFF;border-left:5px solid var(--accent)}
.qhd .t{color:#CBD5E1;font-size:11px}.qhd .big{margin-top:2px;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}.qhd .sub{margin-top:3px;color:#CBD5E1;font-size:10.5px}
.qrow{display:flex;justify-content:space-between;gap:15px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12px}
.qrow b{font-variant-numeric:tabular-nums}
.qrow.tot{margin-top:3px;padding-top:10px;border-top:2px solid #0F172A;border-bottom:0;font-size:13px;font-weight:800}
.cbar{display:flex;height:12px;margin:7px 0 11px;overflow:hidden;border-radius:2px}.cbar i{display:block;height:100%}
.leg{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:7px;color:var(--mut);font-size:10.5px}.leg span{display:flex;align-items:center;gap:5px}.leg em{width:9px;height:9px;display:inline-block;border-radius:2px}
.upah{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:13px;background:#F1F5F9;border-left:4px solid var(--accent)}
.upah .bg{width:40px;height:40px;display:grid;place-items:center;flex:none;background:#172033;color:#FFF;border-radius:4px}
.upah b{display:block;color:#0F172A;font-size:14px}.upah small{color:var(--mut);font-size:10.5px}.upah .big{margin-left:auto;text-align:right}.upah .big b{color:var(--accent);font-size:20px;font-variant-numeric:tabular-nums}
.doc{max-width:800px;margin:auto;padding:27px 30px}
.dochd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:15px;border-bottom:4px solid #172033}
.dochd h1{margin:0;color:#0F172A;font-size:25px}.dochd h1:after{content:" QUOTATION";display:block;color:var(--accent);font:italic 12px "Playfair Display";letter-spacing:.14em}
.dochd .meta,.dochd .co{color:var(--mut);font-size:10.5px;line-height:1.8}.dochd .co{text-align:right}.dochd .co b{display:block;color:#0F172A;font-size:14px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}.parties>div,.terms .tm{padding:11px 13px;border:1px solid var(--line);border-radius:5px}.parties .k,.terms .k{color:var(--mut);font-size:10px;font-weight:700}.parties .val,.terms .v{margin-top:3px;font-size:12px;font-weight:700}
.terms{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.terms .tm{flex:1;min-width:130px}.terms .v{font-size:11px}
.sign{display:flex;justify-content:flex-end;gap:35px;margin-top:22px;color:var(--mut);font-size:11px}.sign .sg{text-align:center}.sign .ln{width:125px;margin-top:32px;padding-top:5px;border-top:1px solid var(--ink)}
.dline{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:5px}.dline .dot{width:31px;height:31px;display:grid;place-items:center;flex:none;border-radius:3px;color:#FFF}.dline .m{flex:1;min-width:0}.dline .m b{font-size:12px}.dline .m small,.vi small{display:block;color:var(--mut);font-size:10.5px}.dline .delta{flex:none;font:800 13px "JetBrains Mono"}
.ver{position:relative;display:flex;flex-direction:column;gap:7px;padding-left:6px}.ver:before{content:"";position:absolute;left:11px;top:6px;bottom:14px;width:2px;background:var(--line)}.vi{position:relative;display:flex;padding:0 0 14px 23px}.vi:before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border:3px solid #FFF;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--line)}.vi.old:before{background:var(--color-primary)}.vi b{color:#0F172A;font-size:12px}.mini{margin-top:2px;color:var(--mut);font-size:10px}
.note{margin-top:13px;padding:10px 12px;border-left:3px solid var(--accent);background:#F1F5F9;color:var(--mut);font-size:11px}.note .material-symbols-outlined{color:var(--accent);font-size:15px}
@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#view>.kpis>* ,#view>.grid>*,#view>.card,#view>.doc{animation:reveal .42s cubic-bezier(.2,.8,.2,1) both}
#view>.kpis>*:nth-child(2),#view>.grid>*:nth-child(2){animation-delay:.06s}
#view>.kpis>*:nth-child(3){animation-delay:.12s}#view>.kpis>*:nth-child(4){animation-delay:.18s}
@media(max-width:900px){.top{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}.wrap{padding:12px}.vh{min-height:175px;padding:21px}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.split,.upa,.two{grid-template-columns:1fr}.qpanel{position:static}.doc{padding:18px}.parties{grid-template-columns:1fr}}
@media(max-width:520px){.brand{min-width:0}.brand span{display:none}.nav button{padding:8px}.nav button .material-symbols-outlined{display:none}.vh{align-items:flex-start;flex-direction:column}.vh:after{opacity:.35}.pill{align-self:flex-start}.kpis{grid-template-columns:1fr}.card{padding:13px}.sign{gap:14px}.sign .ln{width:105px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
<div class="brand"><div class="logo">EQ</div><div><b>工程估價報價管理台</b><span>FIELD ESTIMATE CONTROL</span></div></div>

</header>
<main class="wrap">
<section class="vh" aria-labelledby="vt"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><i aria-hidden="true"></i><span>編修中 · QT-2026-088 · v2</span></div></section>
<div id="view"></div>
</main>
<script>
const MOD=[
["報價總覽","request_quote","報價總覽","工程總價、毛利與料工費占比戰情"],
["工項估價","construction","工項估價","工項清單 × 報價彙總的分項估價工作台"],
["單價分析","science","單價分析","料工費組成拆解與工項單價明細"],
["BOQ 明細","table_rows","BOQ 明細","工項/單位/數量/單價/複價成本彙總表"],
["報價單","description","報價單","含加成、稅金與付款條件的正式報價文件"],
["版本比較","difference","版本比較","報價版本差異追溯與核定歷程"]];
const nav=document.querySelector("#nav"),view=document.querySelector("#view"),vt=document.querySelector("#vt"),vd=document.querySelector("#vd");
MOD.forEach((m,i)=>{let b=document.createElement("button");b.dataset.i=i;b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span>${m[0]}`;b.onclick=()=>{location.hash=`v${i}`};nav.appendChild(b)});
const NT=v=>Math.round(v).toLocaleString("en-US");
const BOQ=[
["A 假設工程","A-01","工地圍籬與大門","式",1,186000,"e"],["A 假設工程","A-02","施工架搭設拆除","m2",4200,285,"l"],["A 假設工程","A-03","安全衛生設施","式",1,342000,"e"],
["B 土方與基礎","B-01","整地挖填方","m3",6800,168,"m"],["B 土方與基礎","B-02","連續壁 (地下)","m2",1980,4850,"m"],["B 土方與基礎","B-03","基礎版澆置","m3",860,3620,"m"],
["C 結構工程","C-01","鋼筋混凝土 (RC 柱樑)","m3",2450,4180,"m"],["C 結構工程","C-02","鋼構製作吊裝","T",520,42800,"m"],["C 結構工程","C-03","樓板鋼承板","m2",9600,720,"m"],["C 結構工程","C-04","模板組立拆除","m2",18500,368,"l"],
["D 外牆與屋頂","D-01","帷幕牆玻璃單元","m2",3200,6850,"m"],["D 外牆與屋頂","D-02","金屬屋面板","m2",4100,1180,"m"],["D 外牆與屋頂","D-03","外牆防水塗裝","m2",5600,420,"l"],
["E 機電與消防","E-01","配電盤與幹線","式",1,4860000,"m"],["E 機電與消防","E-02","空調風管製作安裝","m2",8200,980,"l"],["E 機電與消防","E-03","消防灑水系統","點",1450,3200,"m"],
["F 裝修工程","F-01","輕隔間牆","m2",6800,1080,"l"],["F 裝修工程","F-02","地坪環氧樹脂","m2",7200,860,"m"],["F 裝修工程","F-03","天花板系統","m2",6400,1240,"l"]];
const CATC={m:"var(--mat)",l:"var(--lab)",e:"var(--ovh)"},CATN={m:"材料",l:"人工",e:"費用/雜項"};
const amt=b=>b[4]*b[5],DIRECT=BOQ.reduce((a,b)=>a+amt(b),0);
function groups(){let g={};BOQ.forEach(b=>g[b[0]]=(g[b[0]]||0)+amt(b));return g}
function mleSplit(){let x={m:0,l:0,e:0};BOQ.forEach(b=>x[b[6]]+=amt(b));return x}
function rollup(){let direct=DIRECT,mgmt=direct*.045,profit=(direct+mgmt)*.09,sub=direct+mgmt+profit,tax=sub*.05;return{direct,mgmt,profit,sub,tax,total:sub+tax}}
const icon=n=>`<span class="material-symbols-outlined" aria-hidden="true">${n}</span>`;
const tag=(c,t)=>`<span class="tag ${c}">${t}</span>`;
const SCREENS=[
()=>{let r=rollup(),g=groups(),arr=Object.entries(g).sort((a,b)=>b[1]-a[1]),mx=arr[0][1];return `<div class="kpis">
<div class="kpi">${icon("payments")}<div class="l">工程報價總額 (含稅)</div><div class="v">$${(r.total/1e6).toFixed(2)}M</div><div class="d up">下降 · 較 v1 降 3.4%</div></div>
<div class="kpi">${icon("trending_up")}<div class="l">預估毛利率</div><div class="v">12.4%</div><div class="d up">達標 · 高於目標 12%</div></div>
<div class="kpi">${icon("table_rows")}<div class="l">BOQ 工項數</div><div class="v">${BOQ.length}</div><div class="d">完整 · 6 分項均已估價</div></div>
<div class="kpi">${icon("warning")}<div class="l">待覆核單價</div><div class="v" style="color:var(--bad)">3</div><div class="d dn">注意 · 2 高於行情、1 缺分析</div></div></div>
<div class="grid g2"><section class="card"><h3>${icon("donut_large")}料工費結構占比</h3><div class="chart" id="c_mle"></div></section>
<section class="card"><h3>${icon("bar_chart")}分項工程金額占比</h3>${arr.map(h=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:11px"><b>${h[0]}</b><span style="font-family:JetBrains Mono">$${NT(h[1])}</span></div><div style="height:7px;margin-top:5px;background:#E2E8F0"><i style="display:block;width:${h[1]/mx*100}%;height:100%;background:var(--accent)"></i></div></div>`).join("")}<div class="note">${icon("bolt")} 機電與結構工程占直接工程費最大宗，配電幹線與鋼構單價議價空間最大。</div></section></div>
<section class="card" style="margin-top:14px"><h3>${icon("timeline")}近六版報價總額走勢</h3><div class="chart" id="c_trend" style="height:225px"></div></section>`},
