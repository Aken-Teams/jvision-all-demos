<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工程報價生成所 · Estimate & Quote Builder</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0e7490;--accent2:#0891b2;--ink:#0b1e26;--bg:#eef4f6;--card:#fff;--line:#d7e4e8;--mut:#5a7581;--ok:#0f9d76;--warn:#d97706;--bad:#dc2626;--mat:#0e7490;--lab:#0891b2;--ovh:#f59e0b;--profit:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(14,116,144,.34)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.nav button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#e3f0f3;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(14,116,144,.3)}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:#cffafe;color:#0e7490;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.split{grid-template-columns:1fr 360px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#cffafe;color:#0e7490}.t-mut{background:#e9eff1;color:#5a7581}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef5f7}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
table.data tr.grp td{background:#e6f2f5;font-weight:800;font-family:"Noto Sans TC";color:var(--accent)}
table.data tr.sum td{background:#0e7490;color:#fff;font-weight:800}
.chart{height:250px}
.scroll{overflow-x:auto}
/* work item list (signature left) */
.wi{display:flex;flex-direction:column;gap:6px}
.wig{font-size:11px;font-weight:800;color:var(--accent);font-family:"Noto Sans TC";padding:8px 6px 3px;letter-spacing:.5px}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.wrow:hover{background:#eef5f7}
.wrow.sel{background:#e6f2f5;border-color:#a9d4de}
.wrow .code{font-family:Inter;font-weight:700;font-size:11px;color:var(--accent);flex:none;width:52px}
.wrow .nm{font-family:"Noto Sans TC";flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.wrow .amt{font-family:Inter;font-weight:800;font-size:12px;flex:none}
/* right quote summary panel (signature) */
.qpanel{position:sticky;top:80px}
.qhd{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.qhd .t{font-size:12px;opacity:.85;font-family:"Noto Sans TC"}
.qhd .big{font-family:Inter;font-weight:800;font-size:30px;margin-top:2px}
.qhd .sub{font-size:11.5px;opacity:.85;margin-top:3px}
.qrow{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 2px;border-bottom:1px solid var(--line)}
.qrow b{font-family:Inter;font-variant-numeric:tabular-nums}
.qrow.tot{border-bottom:0;border-top:2px solid var(--accent);margin-top:3px;padding-top:11px;font-weight:800;font-size:14px}
.cbar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:6px 0 12px}
.cbar i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.leg span{display:flex;align-items:center;gap:5px}
.leg em{width:10px;height:10px;border-radius:3px;font-style:normal;display:inline-block}
/* unit price analysis (料工費) */
.upa{display:grid;grid-template-columns:1fr 1fr;gap:16px}.upa>*{min-width:0}
.upah{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#cffafe,#a5f3fc);margin-bottom:14px}
.upah .bg{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(14,116,144,.2)}
.upah .bg .material-symbols-outlined{color:var(--accent);font-size:24px}
.upah b{font-family:"Noto Sans TC";font-size:15px;display:block}
.upah small{color:#0e6474;font-size:11.5px}
.upah .big{margin-left:auto;text-align:right}
.upah .big b{font-family:Inter;font-size:22px;color:#0c5866}
.upah .big small{color:#0e6474}
/* report / quote doc */
.doc{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 30px;box-shadow:0 12px 30px rgba(11,30,38,.07)}
.dochd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:16px;margin-bottom:16px}
.dochd h1{margin:0;font-family:"Noto Sans TC";font-size:22px}
.dochd .meta{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.7}
.dochd .co{text-align:right;font-size:11.5px;color:var(--mut)}
.dochd .co b{font-family:"Noto Sans TC";font-size:15px;color:var(--ink);display:block}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.parties>div{border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.parties .k{font-size:11px;color:var(--mut);font-weight:700}
.parties .val{font-family:"Noto Sans TC";font-weight:700;margin-top:3px}
.terms{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.terms .tm{flex:1;min-width:130px;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.terms .tm .k{font-size:11px;color:var(--mut);font-weight:700}
.terms .tm .v{font-family:"Noto Sans TC";font-weight:700;font-size:13px;margin-top:2px}
.sign{display:flex;justify-content:flex-end;gap:40px;margin-top:22px;font-size:12px;color:var(--mut)}
.sign .sg{text-align:center}
.sign .ln{border-top:1px solid var(--ink);width:130px;margin-top:34px;padding-top:5px}
/* version diff */
.dline{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px}
.dline .dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.dline .m{flex:1;min-width:0}
.dline .m b{font-family:"Noto Sans TC";font-size:13px}
.dline .m small{color:var(--mut);font-size:11.5px;display:block}
.dline .delta{font-family:Inter;font-weight:800;font-size:15px;flex:none}
.ver{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:6px}
.ver::before{content:"";position:absolute;left:11px;top:6px;bottom:16px;width:2px;background:var(--line)}
.vi{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;position:relative;padding-left:22px}
.vi::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.vi.old::before{background:var(--mut)}
.vi b{font-family:Inter;font-weight:800;font-size:13.5px}
.vi small{color:var(--mut);font-size:11.5px;display:block}
.mini{font-size:11px;color:var(--mut);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.note{margin-top:14px;padding:10px 12px;background:#eef5f7;border-radius:10px;font-size:12px;color:var(--mut)}
.note .material-symbols-outlined{color:var(--accent);font-size:16px}
@media(max-width:900px){.wrap{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.split,.upa,.two{grid-template-columns:1fr}.parties{grid-template-columns:1fr}.qpanel{position:static}.doc{padding:18px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">報</div><div><b>工程報價生成所</b><span>ESTIMATE &amp; QUOTE BUILDER</span></div></div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><i></i><span>報價 QT-2026-088 v2 編修中</span></div></div>
  <div id="view"></div>
</div>
<script>
const MOD=[
["報價總覽","request_quote","報價總覽","工程總價、毛利與料工費占比戰情"],
["工項估價","construction","工項估價","工項清單 × 報價彙總的分項估價工作台"],
["單價分析","science","單價分析","料工費組成拆解與工項單價明細"],
["BOQ 明細","table_rows","BOQ 明細","工項/單位/數量/單價/複價成本彙總表"],
["報價單","description","報價單","含加成、稅金與付款條件的正式報價文件"],
["版本比較","difference","版本比較","報價版本差異追溯與核定歷程"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const NT=v=>Math.round(v).toLocaleString('en-US');
// BOQ line items — 建案：某科技廠房新建工程. [group,code,name,unit,qty,unitPrice,cat] cat: m=料 l=工 e=費
const BOQ=[
["A 假設工程","A-01","工地圍籬與大門","式",1,186000,"e"],
["A 假設工程","A-02","施工架搭設拆除","m2",4200,285,"l"],
["A 假設工程","A-03","安全衛生設施","式",1,342000,"e"],
["B 土方與基礎","B-01","整地挖填方","m3",6800,168,"m"],
["B 土方與基礎","B-02","連續壁 (地下)","m2",1980,4850,"m"],
["B 土方與基礎","B-03","基礎版澆置","m3",860,3620,"m"],
["C 結構工程","C-01","鋼筋混凝土 (RC 柱樑)","m3",2450,4180,"m"],
["C 結構工程","C-02","鋼構製作吊裝","T",520,42800,"m"],
["C 結構工程","C-03","樓板鋼承板","m2",9600,720,"m"],
["C 結構工程","C-04","模板組立拆除","m2",18500,368,"l"],
["D 外牆與屋頂","D-01","帷幕牆玻璃單元","m2",3200,6850,"m"],
["D 外牆與屋頂","D-02","金屬屋面板","m2",4100,1180,"m"],
["D 外牆與屋頂","D-03","外牆防水塗裝","m2",5600,420,"l"],
["E 機電與消防","E-01","配電盤與幹線","式",1,4860000,"m"],
["E 機電與消防","E-02","空調風管製作安裝","m2",8200,980,"l"],
["E 機電與消防","E-03","消防灑水系統","點",1450,3200,"m"],
["F 裝修工程","F-01","輕隔間牆","m2",6800,1080,"l"],
["F 裝修工程","F-02","地坪環氧樹脂","m2",7200,860,"m"],
["F 裝修工程","F-03","天花板系統","m2",6400,1240,"l"]];
const CATC={m:"var(--mat)",l:"var(--lab)",e:"var(--ovh)"};
const CATN={m:"材料",l:"人工",e:"費用/雜項"};
function amt(b){return b[4]*b[5];}
const DIRECT=BOQ.reduce((a,b)=>a+amt(b),0);
function groups(){const g={};BOQ.forEach(b=>{g[b[0]]=(g[b[0]]||0)+amt(b);});return g;}
function mleSplit(){let m=0,l=0,e=0;BOQ.forEach(b=>{const a=amt(b);if(b[6]=='m')m+=a;else if(b[6]=='l')l+=a;else e+=a;});return{m,l,e};}
const MARKUP=0.09, MGMT=0.045, TAX=0.05;
function rollup(){
 const direct=DIRECT;
 const mgmt=direct*MGMT;
 const profit=(direct+mgmt)*MARKUP;
 const sub=direct+mgmt+profit;
 const tax=sub*TAX;
 const total=sub+tax;
 return {direct,mgmt,profit,sub,tax,total};
}

const SCREENS=[
// 0 報價總覽
()=>{const r=rollup();return `<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">payments</span><div class="l">工程報價總額 (含稅)</div><div class="v">$${(r.total/1e6).toFixed(2)}<small style="font-size:12px">M</small></div><div class="d up">▼ 較 v1 降 3.4%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">trending_up</span><div class="l">預估毛利率</div><div class="v">12.4<small style="font-size:12px">%</small></div><div class="d up">▲ 達目標 12%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">table_rows</span><div class="l">BOQ 工項數</div><div class="v">${BOQ.length}</div><div class="d" style="color:var(--mut)">6 分項 · 均已估價</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">待覆核單價</div><div class="v" style="color:var(--bad)">3</div><div class="d" style="color:var(--mut)">2 高於行情 · 1 缺分析</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>料工費結構占比</h3><div class="chart" id="c_mle"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>分項工程金額占比</h3>${
   (()=>{const g=groups();const arr=Object.keys(g).map(k=>[k,g[k]]).sort((a,b)=>b[1]-a[1]);const mx=arr[0][1];return arr.map(h=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">${h[0]}</b><span style="color:var(--accent);font-weight:800;font-family:Inter">$${NT(h[1])}</span></div><div style="height:8px;background:#e6eef1;border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${(h[1]/mx*100).toFixed(0)}%;background:linear-gradient(90deg,var(--accent2),var(--accent))"></i></div></div>`).join('');})()
   }<div class="note"><span class="material-symbols-outlined">bolt</span> 機電與結構工程占直接工程費 <b style="color:var(--ink)">最大宗</b>，配電幹線與鋼構單價議價空間最大。</div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">timeline</span>近六版報價總額走勢</h3><div class="chart" id="c_trend" style="height:230px"></div></div>`;},

// 1 工項估價 — SIGNATURE split workspace
()=>`<div class="grid split">
 <div class="card"><h3><span class="material-symbols-outlined">construction</span>工項清單 · 分項估價 <span class="tag t-mut" style="margin-left:auto">某科技廠房新建工程</span></h3>
  <div class="leg"><span><em style="background:var(--mat)"></em>材料主導</span><span><em style="background:var(--lab)"></em>人工主導</span><span><em style="background:var(--ovh)"></em>費用/雜項</span></div>
  <div class="wi" id="wi"></div></div>
 <div class="qpanel"><div id="qsum"></div></div>
</div>`,

// 2 單價分析 (料工費)
()=>`<div class="upa">
 <div class="card"><div id="upaHd"></div>
  <div class="chart" id="c_upa" style="height:230px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">science</span>C-02 鋼構製作吊裝 · 單價分析明細 <span class="tag t-info" style="margin-left:auto">每 T</span></h3>
  <div class="scroll"><table class="data"><tr><th>項目</th><th>類別</th><th class="num">單位用量</th><th class="num">單價</th><th class="num">小計</th></tr>${
   [["A36 鋼材","m","1.05 T",28500,29925],["防鏽底漆","m","3.2 kg",180,576],["高強度螺栓","m","組",1450,1450],["工廠製作工資","l","1.0 T",4200,4200],["現場吊裝工資","l","1.0 T",3800,3800],["起重機租賃","e","0.05 台日",26000,1300],["損耗與雜項","e","式",1549,1549]]
   .map(r=>`<tr><td><b>${r[0]}</b></td><td><span class="tag" style="background:${CATC[r[1]]}22;color:${CATC[r[1]]}">${CATN[r[1]]}</span></td><td class="num">${r[2]}</td><td class="num">$${NT(r[3])}</td><td class="num" style="font-weight:800">$${NT(r[4])}</td></tr>`).join('')}
   <tr class="sum"><td colspan="4" style="text-align:right">綜合單價 (每 T)</td><td class="num">$${NT(42800)}</td></tr></table></div>
  <div class="note"><span class="material-symbols-outlined">rule</span> 料:工:費 = <b style="color:var(--ink)">75 : 19 : 6</b>，鋼材佔比高，行情波動時應優先鎖價。</div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">fact_check</span>單價合理性檢核 (對比工料行情基準)</h3><div class="scroll"><table class="data"><tr><th>工項</th><th class="num">綜合單價</th><th class="num">行情基準</th><th class="num">偏差</th><th>判定</th></tr>${
