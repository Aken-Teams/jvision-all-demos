<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>考試成績分析站 · Exam Score Analytics</title>
<meta name="description" content="成績登錄、分數分布等第、班級科目比較、個人弱點雷達到進退步追蹤與成績報表的考試成績分析站（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap');

:root{
  --color-primary:#4F46E5;
  --color-on-primary:#FFFFFF;
  --color-secondary:#818CF8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#EEF2FF;
  --color-foreground:#1E1B4B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E1B4B;
  --color-muted:#EBEEF8;
  --color-muted-foreground:#475569;
  --color-border:#C7D2FE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#4F46E5;
  --blue:#4F46E5;
  --ink:#1E1B4B;
  --muted:#475569;
  --line:#C7D2FE;
  --acc:#4F46E5;
  --acc2:#818CF8;
  --acc-d:#3730A3;
  --body:#334155;
  --mut:#475569;
  --bg:#EEF2FF;
  --card:#FFFFFF;
  --ok:#166534;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#3730A3;
  --purp:#6D28D9;
  --teal:#0F766E;
  --pink:#BE185D;
  --shadow-clay:8px 9px 0 rgba(79,70,229,.12),0 16px 30px rgba(30,27,75,.08),inset 0 2px 0 rgba(255,255,255,.95);
  --shadow-small:4px 5px 0 rgba(79,70,229,.11),0 9px 20px rgba(30,27,75,.07),inset 0 1px 0 #fff;
  --shadow-press:2px 3px 0 rgba(79,70,229,.14),0 5px 12px rgba(30,27,75,.08),inset 0 2px 5px rgba(79,70,229,.08);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Comic Neue","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 8% 5%,rgba(129,140,248,.24) 0 92px,transparent 93px),
    radial-gradient(circle at 93% 24%,rgba(234,88,12,.10) 0 120px,transparent 121px),
    linear-gradient(145deg,#f8f9ff 0%,var(--color-background) 48%,#e8edff 100%);
  color:var(--body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#C7D2FE;color:var(--color-foreground)}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  color:var(--color-foreground);
  background:rgba(238,242,255,.92);
  border-bottom:3px solid var(--color-border);
  box-shadow:0 8px 24px rgba(30,27,75,.10),inset 0 -1px 0 #fff;
  backdrop-filter:blur(14px);
}
.tin{
  max-width:1360px;
  margin:0 auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
  width:46px;
  height:46px;
  flex:none;
  display:grid;
  place-items:center;
  border:3px solid #3730A3;
  border-radius:16px;
  color:#fff;
  background:linear-gradient(145deg,#818CF8,#4F46E5);
  box-shadow:4px 5px 0 #C7D2FE,inset 2px 2px 0 rgba(255,255,255,.35);
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:22px;
  font-weight:700;
}
.brand b{
  display:block;
  color:var(--color-foreground);
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:17px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  margin-top:-2px;
  color:var(--color-muted-foreground);
  font-family:"Baloo 2",sans-serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:1.7px;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:thin;
  padding:3px 3px 6px;
}
.nav button{
  min-height:42px;
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border:2px solid transparent;
  border-radius:14px;
  color:#3730A3;
  background:transparent;
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:transform .2s ease-out,background-color .2s ease-out,box-shadow .2s ease-out,border-color .2s ease-out;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:#fff;border-color:var(--color-border);box-shadow:var(--shadow-small);transform:translateY(-2px)}
.nav button.on{
  color:var(--color-on-primary);
  background:linear-gradient(145deg,var(--color-secondary),var(--color-primary));
  border-color:#3730A3;
  box-shadow:4px 5px 0 #C7D2FE,inset 0 2px 0 rgba(255,255,255,.25);
}
.nav button:active{transform:translateY(2px);box-shadow:var(--shadow-press)}

.wrap{width:min(100%,1360px);margin:0 auto;padding:28px 22px 42px}
.vh{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  padding:22px 24px;
  overflow:hidden;
  border:3px solid var(--color-border);
  border-radius:24px;
  background:linear-gradient(135deg,#fff 0%,#f7f7ff 65%,#E0E7FF 100%);
  box-shadow:var(--shadow-clay);
}
.vh::after{
  content:"";
  position:absolute;
  right:15%;
  bottom:-46px;
  width:150px;
  height:90px;
  border:18px solid rgba(129,140,248,.16);
  border-radius:50%;
  transform:rotate(-8deg);
  pointer-events:none;
}
.vh>div{position:relative;z-index:1}
.vh h2{
  margin:0;
  color:var(--color-foreground);
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:clamp(24px,3vw,34px);
  font-weight:700;
  line-height:1.15;
}
.vh p{margin:6px 0 0;color:var(--color-muted-foreground);font-size:14px;font-weight:700}
.live{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  border:2px solid #FDBA74;
  border-radius:999px;
  color:#7C2D12;
  background:#FFF7ED;
  box-shadow:3px 4px 0 rgba(234,88,12,.16),inset 0 1px 0 #fff;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.live .pulse{width:9px;height:9px;border:2px solid #7C2D12;border-radius:50%;background:var(--color-accent);animation:bp 1.8s ease-in-out infinite}
@keyframes bp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.5}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:18px;
  border:3px solid var(--color-border);
  border-radius:21px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  box-shadow:var(--shadow-clay);
  transition:transform .2s ease-out,box-shadow .2s ease-out;
}
.kpi:nth-child(2n){transform:rotate(.25deg)}
.kpi:hover{transform:translateY(-3px) rotate(0);box-shadow:10px 12px 0 rgba(79,70,229,.13),0 20px 32px rgba(30,27,75,.10),inset 0 2px 0 #fff}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  top:-24px;
  width:88px;
  height:88px;
  border:16px solid rgba(129,140,248,.13);
  border-radius:50%;
  pointer-events:none;
}
.kpi .l{position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:var(--color-muted-foreground);font-size:12px;font-weight:700}
.kpi .l .material-symbols-outlined{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;color:#3730A3;background:#E0E7FF;box-shadow:inset 0 2px 3px rgba(79,70,229,.10)}
.kpi .v{position:relative;z-index:1;margin-top:8px;color:var(--color-foreground);font-family:"Baloo 2",sans-serif;font-size:29px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{color:var(--color-muted-foreground);font-family:"Comic Neue","Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.kpi .d{position:relative;z-index:1;margin-top:5px;font-size:12px;font-weight:700}
.up{color:#166534}.dn{color:#991B1B}.neu{color:#475569}.wn{color:#9A3412}

.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr)}
.g21{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;
  padding:19px 20px;
  border:3px solid var(--color-border);
  border-radius:22px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  box-shadow:var(--shadow-clay);
}
.card>h3,.card h3{
  color:var(--color-foreground);
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-weight:700;
}
.card>h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;font-size:16px}
.card>h3 .material-symbols-outlined,.card h3>.material-symbols-outlined{color:var(--color-primary);font-size:21px}
.card>h3 .r{margin-left:auto;font-size:11px;font-weight:700}
.chart-wrap{position:relative;width:100%;height:270px}.chart-wrap.sm{height:220px}.chart-wrap.lg{height:320px}

.tag{
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:3px 10px;
  border:1.5px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}.t-warn{color:#854D0E;background:#FEF9C3}.t-bad{color:#991B1B;background:#FEE2E2}.t-info{color:#3730A3;background:#E0E7FF}.t-pur{color:#6D28D9;background:#F3E8FF}.t-mut{color:#475569;background:#F1F5F9}
.scroll{max-width:100%;overflow-x:auto;border-radius:15px;scrollbar-color:#818CF8 #EEF2FF}

table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th{
  padding:12px 11px;
  border-bottom:3px solid var(--color-border);
  color:#3730A3;
  background:#EEF2FF;
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
table.data th:first-child{border-radius:12px 0 0 0}table.data th:last-child{border-radius:0 12px 0 0}
table.data td{padding:11px;border-bottom:1px solid var(--color-border);white-space:nowrap}
table.data tbody tr:last-child td{border-bottom:0}
table.data tr:hover td{background:#F8FAFF}
table.data td b{color:var(--color-foreground);font-family:"Baloo 2",monospace;font-variant-numeric:tabular-nums}
table.data th:nth-child(n+3),table.data td:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
table.data td:first-child{font-family:"Comic Neue",monospace;font-variant-numeric:tabular-nums}
.nm{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:600}

.note{
  padding:14px 16px;
  border:2px solid var(--color-border);
  border-left:6px solid var(--color-secondary);
  border-radius:15px;
  color:#334155;
  background:#F7F8FF;
  box-shadow:inset 0 2px 5px rgba(79,70,229,.06);
  font-size:12.5px;
  line-height:1.75;
}
.miniq{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--color-border);font-size:13px}.miniq:first-of-type{border-top:0}
.miniq b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:600}.miniq span{color:#3730A3;font-family:"Comic Neue",monospace;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--color-muted-foreground);font-size:11.5px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}.dot{display:inline-block;width:11px;height:11px;border:1px solid rgba(30,27,75,.35);border-radius:4px}

.gradebox{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.gb{
  padding:13px 8px;
  border:2px solid var(--color-border);
  border-top-width:6px;
  border-radius:17px;
  text-align:center;
  background:#FAFBFF;
  box-shadow:3px 4px 0 rgba(79,70,229,.09),inset 0 1px 0 #fff;
}
.gb .lv{font-family:"Baloo 2",sans-serif;font-size:25px;font-weight:700;line-height:1}.gb b{display:block;margin-top:5px;color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:12.5px}.gb small{display:block;margin-top:2px;color:var(--color-muted-foreground);font-size:11px;font-variant-numeric:tabular-nums}
.lines{display:flex;flex-direction:column;gap:12px}.lr{display:grid;grid-template-columns:70px minmax(0,1fr) 62px;gap:11px;align-items:center}.lr b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px}.lr small{color:#3730A3;font-family:"Comic Neue",monospace;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:14px;overflow:hidden;border:2px solid #D5DCF7;border-radius:999px;background:#E8EBF8;box-shadow:inset 0 2px 4px rgba(30,27,75,.10)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}

.entry{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ec{
  padding:14px;
  border:2px solid var(--color-border);
  border-left:6px solid var(--color-primary);
  border-radius:17px;
  background:#FAFBFF;
  box-shadow:3px 4px 0 rgba(79,70,229,.10),inset 0 1px 0 #fff;
}
.ec.warn{border-color:#FDBA74;border-left-color:#C2410C;background:#FFF7ED}.ec.bad{border-color:#FCA5A5;border-left-color:#B91C1C;background:#FEF2F2}
.ec .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}.ec .h b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px}.ec .sc{color:#3730A3;font-family:"Baloo 2",monospace;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}.ec small{display:block;color:var(--color-muted-foreground);font-size:11.5px;line-height:1.6}
.inrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--color-border);border-radius:14px;background:#FAFBFF}.inrow .nm2{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px;font-weight:600}.inrow small{display:block;color:var(--color-muted-foreground);font-size:11px}
.score-in{width:62px;min-height:38px;padding:6px;border:2px solid var(--color-border);border-radius:11px;color:var(--color-foreground);background:#fff;font-family:"Comic Neue",monospace;font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;transition:border-color .2s ease-out,box-shadow .2s ease-out}.score-in:hover{border-color:var(--color-secondary)}.score-in:focus{border-color:var(--color-primary);box-shadow:0 0 0 4px rgba(79,70,229,.14)}.score-in.err{border-color:#B91C1C;color:#991B1B;background:#FEF2F2;box-shadow:inset 0 0 0 1px #FCA5A5}

.stu-hd{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
  padding:17px 19px;
  border:3px solid var(--color-border);
  border-radius:22px;
  background:linear-gradient(120deg,#fff,#EEF2FF);
  box-shadow:var(--shadow-clay);
}
.stu-hd .av{width:58px;height:58px;flex:none;display:grid;place-content:center;border:3px solid #3730A3;border-radius:19px;color:#fff;background:linear-gradient(145deg,var(--color-secondary),var(--color-primary));box-shadow:4px 5px 0 #C7D2FE,inset 0 2px 0 rgba(255,255,255,.3);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:22px;font-weight:700}.stu-hd .si b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:18px}.stu-hd .si small{display:block;margin-top:2px;color:var(--color-muted-foreground);font-size:12px}.stu-hd .rk{margin-left:auto;text-align:right}.stu-hd .rk b{color:#3730A3;font-family:"Baloo 2",monospace;font-size:26px;font-variant-numeric:tabular-nums}.stu-hd .rk small{display:block;color:var(--color-muted-foreground);font-size:11px}
.weakrow{display:flex;flex-direction:column;gap:11px}.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 13px;border:2px solid var(--color-border);border-radius:15px;background:#FAFBFF;box-shadow:2px 3px 0 rgba(79,70,229,.08)}.wk .bar{margin-top:7px}.wk .nm3{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px;font-weight:600}.wk .sc2{min-width:36px;font-family:"Comic Neue",monospace;font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.trace{display:flex;flex-direction:column;gap:10px}.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 13px;border:2px solid var(--color-border);border-radius:16px;background:#FAFBFF;box-shadow:2px 3px 0 rgba(79,70,229,.08);transition:transform .2s ease-out,box-shadow .2s ease-out}.tr:hover{transform:translateX(3px);box-shadow:4px 5px 0 rgba(79,70,229,.11)}.tr .ic{width:40px;height:40px;display:grid;place-items:center;border:2px solid rgba(30,27,75,.20);border-radius:13px;box-shadow:inset 0 2px 0 rgba(255,255,255,.28)}.tr .ic .material-symbols-outlined{color:#fff;font-size:21px}.tr .mid b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px}.tr .mid small{display:block;color:var(--color-muted-foreground);font-size:11.5px;font-variant-numeric:tabular-nums}.tr .rt{font-family:"Comic Neue",monospace;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.tr .rt b{font-size:16px}.tr .rt small{display:block;color:var(--color-muted-foreground);font-size:10.5px}

.imp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.ic2{padding:15px;border:2px solid var(--color-border);border-top:6px solid var(--color-primary);border-radius:17px;background:#FAFBFF;box-shadow:3px 4px 0 rgba(79,70,229,.10),inset 0 1px 0 #fff}.ic2 b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px}.ic2 .big{margin-top:4px;color:#3730A3;font-family:"Baloo 2",monospace;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.ic2 small{display:block;color:var(--color-muted-foreground);font-size:11px}
.msg{margin-bottom:11px;padding:12px 14px;border:2px solid var(--color-border);border-left:6px solid var(--color-primary);border-radius:15px;background:#FAFBFF;box-shadow:2px 3px 0 rgba(79,70,229,.08)}.msg b{color:var(--color-foreground);font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:13px}.msg small{display:block;margin-top:4px;color:var(--color-muted-foreground);font-size:12px;line-height:1.6}.msg .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 16px;
  border:3px solid #9A3412;
  border-radius:14px;

/* ---- Chart.js: init only on shown screen, destroy-guard ---- */
var CH={};
function destroyAll(){Object.keys(CH).forEach(function(k){try{CH[k].destroy();}catch(e){}});CH={};}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;CH[id]=new Chart(el,cfg);}
var BASE={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
function grid(y){return {y:Object.assign({grid:{color:C.grid}},y||{}),x:{grid:{display:false}}};}

function draw(i){
 destroyAll();
 if(i===0){
  var hcol=HIST.map(function(h,ix){return ix<6?C.bad:ix>=9?C.ok:C.acc;});
  mk("c_hist",{type:"bar",data:{labels:HIST.map(function(h){return h[0];}),datasets:[{label:"人數",data:HIST.map(function(h){return h[1];}),backgroundColor:hcol,borderRadius:5}]},options:Object.assign({},BASE,{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+" 人";}}}},scales:grid({beginAtZero:true,title:{display:true,text:"人數"}})})});
  mk("c_pass",{type:"bar",data:{labels:SUBJ.map(function(s){return s[0];}),datasets:[{label:"及格率%",data:SUBJ.map(function(s){return s[2];}),backgroundColor:SUBJ.map(function(s){return s[2]>=80?C.ok:s[2]<66?C.warn:C.acc;}),borderRadius:6}]},options:Object.assign({},BASE,{indexAxis:"y",scales:{x:{beginAtZero:true,max:100,grid:{color:C.grid},ticks:{callback:function(v){return v+"%";}}},y:{grid:{display:false}}}})});
 }
 if(i===2){
  var order=CLSOVR.slice().sort(function(a,b){return b[1]-a[1];});
  mk("c_cls",{type:"bar",data:{labels:order.map(function(c){return c[0];}),datasets:[{label:"平均分",data:order.map(function(c){return c[1];}),backgroundColor:order.map(function(c){return c[1]>=76?C.acc:c[1]<68?C.warn:C.acc2;}),borderRadius:6}]},options:Object.assign({},BASE,{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y.toFixed(1)+" 分";}}}},scales:grid({beginAtZero:true,max:100})})});
  var subs=["國文","英文","數學","自然","社會"];
  var cols=[C.acc,C.purp,C.bad,C.teal,C.warn];
  mk("c_clssub",{type:"line",data:{labels:CLS,datasets:subs.map(function(s,si){return {label:s,data:CLSAVG.map(function(r){return r[si];}),borderColor:cols[si],backgroundColor:"transparent",tension:.3,pointRadius:3};})},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({min:50,max:90})})});
 }
 if(i===3){
  mk("c_radar",{type:"radar",data:{labels:STU.sub.map(function(s){return s[0];}),datasets:[{label:STU.name,data:STU.sub.map(function(s){return s[1];}),borderColor:C.acc,backgroundColor:"rgba(29,78,216,.18)",pointBackgroundColor:C.acc},{label:"班平均",data:STU.sub.map(function(s){return s[2];}),borderColor:C.acc2,backgroundColor:"rgba(96,165,250,.12)",pointBackgroundColor:C.acc2}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{r:{min:40,max:100,ticks:{stepSize:20,font:{size:9},backdropColor:"transparent"},grid:{color:C.grid},angleLines:{color:C.grid},pointLabels:{font:{size:12}}}}})});
  mk("c_ptrend",{type:"line",data:{labels:EXAMS,datasets:[{label:STU.name+" 總分",data:PSTOT,borderColor:C.acc,backgroundColor:"rgba(29,78,216,.14)",fill:true,tension:.35},{label:"班平均總分",data:PSCLASSAVG,borderColor:C.mut||"#94a3b8",borderDash:[5,4],backgroundColor:"transparent",pointRadius:0}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({min:300,max:500})})});
 }
 if(i===4){
  mk("c_alltrend",{type:"line",data:{labels:EXAMS,datasets:[{label:"全校平均",data:[68.5,70.1,69.3,72.4],borderColor:C.acc,backgroundColor:"rgba(29,78,216,.14)",fill:true,tension:.35},{label:"及格率%",data:[68,71,69,74],borderColor:C.ok,backgroundColor:"transparent",tension:.35}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({min:50,max:90})})});
  mk("c_bandmove",{type:"bar",data:{labels:["<60","60-69","70-79","80-89","90-100"],datasets:[{label:"前次",data:[80,66,82,64,30],backgroundColor:"#cbd5e1",borderRadius:5},{label:"本次",data:[68,62,88,71,39],backgroundColor:C.acc,borderRadius:5}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({beginAtZero:true,title:{display:true,text:"人數"}})})});
 }
 if(i===5){
  mk("c_gradepie",{type:"doughnut",data:{labels:GRADE.map(function(g){return g[0]+" ("+g[1]+")";}),datasets:[{data:GRADE.map(function(g){return g[2];}),backgroundColor:GRADE.map(function(g){return g[3];}),borderWidth:0}]},options:Object.assign({},BASE,{cutout:"58%",plugins:{legend:{display:true,position:"right",labels:{boxWidth:12,font:{size:11}}}}})});
 }
}

var nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
nav.innerHTML=MOD.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?"on":"")+'"><span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span></button>';}).join("");
function show(i){
 nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
nav.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
