<style>
:root{--acc:#1d4ed8;--acc2:#60a5fa;--acc-d:#1e3a8a;--ink:#0f1b33;--body:#3f4d63;--mut:#64748b;--line:#dce4f2;--bg:#eef3fb;--card:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#2563eb;--purp:#7c3aed;--teal:#0891b2;--pink:#db2777}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;line-height:1;vertical-align:middle}
/* top nav */
.top{background:linear-gradient(100deg,#1e3a8a,#1d4ed8);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(29,78,216,.24)}
.tin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:11px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#93c5fd);display:grid;place-items:center;font-weight:900;color:#0f2a6b;flex:none;box-shadow:0 6px 16px rgba(96,165,250,.5);font-family:"Noto Sans TC"}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:#bfdbfe;letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:rgba(255,255,255,.08);color:#dbeafe;font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.16);color:#fff}
.nav button.on{background:#fff;color:var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.18)}
/* main */
.wrap{max-width:1360px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink)}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.live{background:#dbeafe;color:#1d4ed8;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.live .pulse{width:8px;height:8px;border-radius:50%;background:#1d4ed8;animation:bp 1.6s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.3}}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(29,78,216,.12),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--acc)}
.kpi .v{font-size:25px;font-weight:900;margin-top:6px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:12px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}.neu{color:var(--mut)}.wn{color:var(--warn)}
/* grid */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .9fr}
.g21{grid-template-columns:1fr 1.25fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card>h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card>h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card>h3 .r{margin-left:auto;font-size:12px;font-weight:700}
.chart-wrap{position:relative;height:270px;width:100%}
.chart-wrap.sm{height:220px}
.chart-wrap.lg{height:320px}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-warn{background:#fef3c7;color:#92400e}.t-bad{background:#fee2e2;color:#991b1b}.t-info{background:#dbeafe;color:#1e40af}.t-pur{background:#ede9fe;color:#6d28d9}.t-mut{background:#e2e8f0;color:#475569}
.scroll{overflow-x:auto}
/* tables */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{text-align:left;color:var(--mut);font-weight:800;font-size:11px;padding:10px 11px;border-bottom:2px solid var(--line);background:#eef3fc;white-space:nowrap;text-transform:uppercase}
table.data td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data tr:hover td{background:#f7faff}
table.data td b{font-family:Inter;color:var(--ink)}
.nm{font-family:"Noto Sans TC";font-weight:700;color:var(--ink)}
/* note */
.note{background:var(--bg);border-radius:12px;padding:13px 14px;font-size:12.5px;color:var(--body);line-height:1.7}
.miniq{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.miniq:first-of-type{border-top:0}
.miniq b{color:var(--ink);font-weight:700;font-family:"Noto Sans TC"}.miniq span{color:var(--acc-d);font-weight:800;font-family:Inter}
/* grade histogram signature bars */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
/* grade pill row */
.gradebox{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.gradebox>*{min-width:0}
.gb{border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;border-top:4px solid var(--acc)}
.gb .lv{font-family:Inter;font-weight:900;font-size:22px}
.gb b{font-family:"Noto Sans TC";font-size:12.5px;display:block;color:var(--ink);margin-top:2px}
.gb small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
/* subject bars */
.lines{display:flex;flex-direction:column;gap:11px}
.lr{display:grid;grid-template-columns:70px 1fr 62px;gap:11px;align-items:center}
.lr b{font-size:12.5px;font-family:"Noto Sans TC";color:var(--ink)}
.bar{height:12px;background:#e8eefb;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.lr small{font-size:12.5px;font-weight:800;text-align:right;font-family:Inter}
/* entry / registration */
.entry{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ec{border:1px solid var(--line);border-radius:13px;padding:13px;border-left:4px solid var(--acc)}
.ec.warn{border-left-color:#d97706;background:#fffbeb}
.ec.bad{border-left-color:#dc2626;background:#fef2f2}
.ec .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ec .h b{font-family:"Noto Sans TC";font-size:13px;color:var(--ink)}
.ec .sc{font-family:Inter;font-weight:900;font-size:20px;color:var(--acc-d)}
.ec small{color:var(--mut);font-size:11.5px;display:block;line-height:1.6}
/* form-ish input row */
.inrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.inrow .nm2{font-family:"Noto Sans TC";font-weight:700;color:var(--ink);font-size:13px}
.inrow small{color:var(--mut);font-size:11px;display:block}
.score-in{width:58px;text-align:center;font-family:Inter;font-weight:800;font-size:15px;border:1.5px solid var(--line);border-radius:8px;padding:5px;color:var(--ink);background:#fff}
.score-in.err{border-color:#dc2626;background:#fef2f2;color:#b91c1c}
/* person diag */
.stu-hd{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;background:linear-gradient(100deg,#f5f9ff,#fff)}
.stu-hd .av{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-content:center;font-weight:900;font-size:20px;flex:none;font-family:"Noto Sans TC"}
.stu-hd .si b{font-family:"Noto Sans TC";font-size:16px;color:var(--ink)}
.stu-hd .si small{color:var(--mut);font-size:12px;display:block;margin-top:2px}
.stu-hd .rk{margin-left:auto;text-align:right}
.stu-hd .rk b{font-family:Inter;font-size:24px;color:var(--acc-d)}
.stu-hd .rk small{display:block;color:var(--mut);font-size:11px}
.weakrow{display:flex;flex-direction:column;gap:10px}
.wk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.wk .bar{margin-top:6px}
.wk .nm3{font-family:"Noto Sans TC";font-weight:700;color:var(--ink);font-size:12.5px}
.wk .sc2{font-family:Inter;font-weight:900;font-size:17px}
/* progress trace */
.trace{display:flex;flex-direction:column;gap:9px}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.tr .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.tr .ic .material-symbols-outlined{font-size:20px;color:#fff}
.tr .mid b{font-family:"Noto Sans TC";font-size:13px;color:var(--ink)}
.tr .mid small{color:var(--mut);font-size:11.5px;display:block}
.tr .rt{text-align:right;white-space:nowrap;font-family:Inter}
.tr .rt b{font-size:15px}.tr .rt small{display:block;font-size:10.5px;color:var(--mut)}
/* report */
.imp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.imp>*{min-width:0}
.ic2{border:1px solid var(--line);border-radius:13px;padding:14px;border-top:4px solid var(--acc)}
.ic2 b{font-family:"Noto Sans TC";font-size:13px;color:var(--ink)}
.ic2 .big{font-family:Inter;font-weight:900;font-size:23px;color:var(--acc-d);margin-top:4px}
.ic2 small{color:var(--mut);font-size:11px;display:block}
.msg{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;padding:11px 14px;margin-bottom:10px}
.msg b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.msg small{display:block;color:var(--mut);font-size:12px;margin-top:3px;line-height:1.6}
.msg .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--acc-d);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
/* rwd */
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g21,.g11,.g3{grid-template-columns:1fr}
 .gradebox{grid-template-columns:repeat(2,1fr)}
 .imp{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .wrap{padding:14px}
 .nav button span:not(.material-symbols-outlined){display:none}
 .nav button{padding:9px}
 .kpis{grid-template-columns:1fr}
}
</style>

/* ---- Chart.js: init only on shown screen, destroy-guard ---- */
var CH={};
function destroyAll(){Object.keys(CH).forEach(function(k){try{CH[k].destroy();}catch(e){}});CH={};}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;CH[id]=new Chart(el,cfg);}
var BASE={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
function grid(y){return {y:Object.assign({grid:{color:C.grid}},y||{}),x:{grid:{display:false}}};}

function draw(i){
 destroyAll();
 if(i===0){
  var hcol=HIST.map(function(h,ix){return ix<6?C.bad:ix>=9?C.ok:C.acc;});
  mk("c_hist",{type:"bar",data:{labels:HIST.map(function(h){return h[0];}),datasets:[{label:"人數",data:HIST.map(function(h){return h[1];}),backgroundColor:hcol,borderRadius:5}]},options:Object.assign({},BASE,{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+" 人";}}}},scales:grid({beginAtZero:true,title:{display:true,text:"人數"}})})});
  mk("c_pass",{type:"bar",data:{labels:SUBJ.map(function(s){return s[0];}),datasets:[{label:"及格率%",data:SUBJ.map(function(s){return s[2];}),backgroundColor:SUBJ.map(function(s){return s[2]>=80?C.ok:s[2]<66?C.warn:C.acc;}),borderRadius:6}]},options:Object.assign({},BASE,{indexAxis:"y",scales:{x:{beginAtZero:true,max:100,grid:{color:C.grid},ticks:{callback:function(v){return v+"%";}}},y:{grid:{display:false}}}})});
 }
 if(i===2){
  var order=CLSOVR.slice().sort(function(a,b){return b[1]-a[1];});
  mk("c_cls",{type:"bar",data:{labels:order.map(function(c){return c[0];}),datasets:[{label:"平均分",data:order.map(function(c){return c[1];}),backgroundColor:order.map(function(c){return c[1]>=76?C.acc:c[1]<68?C.warn:C.acc2;}),borderRadius:6}]},options:Object.assign({},BASE,{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y.toFixed(1)+" 分";}}}},scales:grid({beginAtZero:true,max:100})})});
  var subs=["國文","英文","數學","自然","社會"];
  var cols=[C.acc,C.purp,C.bad,C.teal,C.warn];
  mk("c_clssub",{type:"line",data:{labels:CLS,datasets:subs.map(function(s,si){return {label:s,data:CLSAVG.map(function(r){return r[si];}),borderColor:cols[si],backgroundColor:"transparent",tension:.3,pointRadius:3};})},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({min:50,max:90})})});
 }
 if(i===3){
  mk("c_radar",{type:"radar",data:{labels:STU.sub.map(function(s){return s[0];}),datasets:[{label:STU.name,data:STU.sub.map(function(s){return s[1];}),borderColor:C.acc,backgroundColor:"rgba(29,78,216,.18)",pointBackgroundColor:C.acc},{label:"班平均",data:STU.sub.map(function(s){return s[2];}),borderColor:C.acc2,backgroundColor:"rgba(96,165,250,.12)",pointBackgroundColor:C.acc2}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{r:{min:40,max:100,ticks:{stepSize:20,font:{size:9},backdropColor:"transparent"},grid:{color:C.grid},angleLines:{color:C.grid},pointLabels:{font:{size:12}}}}})});
  mk("c_ptrend",{type:"line",data:{labels:EXAMS,datasets:[{label:STU.name+" 總分",data:PSTOT,borderColor:C.acc,backgroundColor:"rgba(29,78,216,.14)",fill:true,tension:.35},{label:"班平均總分",data:PSCLASSAVG,borderColor:C.mut||"#94a3b8",borderDash:[5,4],backgroundColor:"transparent",pointRadius:0}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({min:300,max:500})})});
 }
 if(i===4){

  mk("c_bandmove",{type:"bar",data:{labels:["<60","60-69","70-79","80-89","90-100"],datasets:[{label:"前次",data:[80,66,82,64,30],backgroundColor:"#cbd5e1",borderRadius:5},{label:"本次",data:[68,62,88,71,39],backgroundColor:C.acc,borderRadius:5}]},options:Object.assign({},BASE,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:grid({beginAtZero:true,title:{display:true,text:"人數"}})})});

  mk("c_gradepie",{type:"doughnut",data:{labels:GRADE.map(function(g){return g[0]+" ("+g[1]+")";}),datasets:[{data:GRADE.map(function(g){return g[2];}),backgroundColor:GRADE.map(function(g){return g[3];}),borderWidth:0}]},options:Object.assign({},BASE,{cutout:"58%",plugins:{legend:{display:true,position:"right",labels:{boxWidth:12,font:{size:11}}}}})});

var nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");

function show(i){
 nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
nav.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
