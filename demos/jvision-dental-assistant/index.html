let charts=[];
function destroyCharts(){charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];}
function drawCharts(i){
 destroyCharts();
 if(!window.Chart)return;
 Chart.defaults.font.family="Inter, Noto Sans TC, sans-serif";
 Chart.defaults.color="#8480a3";
 if(i===4){
  const el=document.getElementById("c_recall");
  if(el)charts.push(new Chart(el,{type:"doughnut",data:{labels:["已預約","已發送","待聯繫"],datasets:[{data:[78,54,24],backgroundColor:["#4f46e5","#818cf8","#e11d48"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,padding:14}}}}}));
 }
 if(i===5){
  const v=document.getElementById("c_visits");
  if(v)charts.push(new Chart(v,{type:"bar",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"門診人次",data:[820,865,910,948,1002,1080],backgroundColor:"#4f46e5",borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:"#eceafa"}},x:{grid:{display:false}}}}}));
  const r=document.getElementById("c_rev");
  if(r)charts.push(new Chart(r,{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"健保",data:[512,528,540,556,571,592],borderColor:"#4f46e5",backgroundColor:"rgba(79,70,229,.12)",fill:true,tension:.35,borderWidth:2.5,pointRadius:3},{label:"自費",data:[188,205,221,236,244,250],borderColor:"#818cf8",backgroundColor:"rgba(129,140,248,.1)",fill:true,tension:.35,borderWidth:2.5,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,padding:14}}},scales:{y:{grid:{color:"#eceafa"}},x:{grid:{display:false}}}}}));
 }
}

const rail=document.getElementById("rail"),view=document.getElementById("view"),vt=document.getElementById("vt"),vs=document.getElementById("vs");
rail.innerHTML=`<div class="lg"><span class="material-symbols-outlined">dentistry</span></div>`+MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?'on':''}"><span class="material-symbols-outlined">${m[0]}</span><span>${m[1]}</span></button>`).join("")+`<div class="sp"></div><button><span class="material-symbols-outlined">settings</span><span>設定</span></button>`;

function show(i){
 rail.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
 vt.textContent=NAMES[i];
 vs.textContent="康和牙醫診所 · 內湖分院 · "+DESC[i];
 const head=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${DESC[i]}</p></div>${i===0?'<button class="btn"><span class="material-symbols-outlined">person_add</span>新增預約</button>':i===3?'<button class="btn"><span class="material-symbols-outlined">upload_file</span>產生申報檔</button>':''}</div>`;
 view.innerHTML=head+SCREENS[i]();
 void view.offsetHeight;
 drawCharts(i);
}
rail.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
view.addEventListener("click",e=>{const q=e.target.closest("[data-q]");if(q){selQ=+q.dataset.q;show(0);}});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
