<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>牙科診療助理｜Jvision 系統 Demo</title>
<meta name="description" content="從線上預約、牙位病歷、診療處置、健保申報到回診召回的牙科診所照護流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFFFFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --green:#047857;
  --amber:#B45309;
  --red:#B91C1C;
  --shadow:7px 7px 0 #164E63;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(8,145,178,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(8,145,178,.09) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--color-foreground);
  font-family:"Atkinson Hyperlegible","Microsoft JhengHei",sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a,[data-q],.th,.grow{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[data-q]:focus-visible,.th:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;z-index:20;height:100vh;
  display:flex;flex-direction:column;gap:8px;
  padding:18px 14px;
  background:var(--color-foreground);
  border-right:4px solid #0F172A;
}
.rail .lg{
  width:100%;min-height:78px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
  padding:14px;
  color:#001E27;background:var(--color-secondary);
  border:3px solid #0F172A;box-shadow:5px 5px 0 #0F172A;
  font-size:17px;font-weight:700;
}
.rail .lg::after{content:"牙科診療助理";line-height:1.05}
.rail .lg .material-symbols-outlined{font-size:34px}
.rail button{
  width:100%;min-height:48px;
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  border:2px solid #67E8F9;
  border-radius:0;
  color:#ECFEFF;background:transparent;
  font-size:15px;font-weight:700;text-align:left;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.rail button:hover{color:#001E27;background:#A5F3FC;transform:translate(-2px,-2px)}
.rail button.on{
  color:#001E27;background:#FFFFFF;
  border-color:#FFFFFF;box-shadow:4px 4px 0 var(--color-secondary);
}
.rail button .material-symbols-outlined{font-size:22px}
.rail .sp{margin-top:auto}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:18px;
  min-height:78px;padding:12px 26px;
  background:rgba(255,255,255,.97);
  border-bottom:4px solid var(--color-foreground);
}
.top h1{margin:0;color:var(--ink);font-size:22px;line-height:1.05;font-weight:700}
.top .sub{margin-top:5px;color:var(--muted);font-size:13px}
.top .r{display:flex;align-items:center;gap:12px;margin-left:auto}
.live{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 11px;
  color:#064E3B;background:#D1FAE5;
  border:2px solid #047857;
  font-size:13px;font-weight:700;
}
.live .dot{
  width:10px;height:10px;background:#047857;
  border:2px solid #022C22;
}
.ava,.avaS{
  display:inline-grid;place-content:center;
  flex:none;color:#001E27;background:var(--color-secondary);
  border:2px solid var(--color-foreground);font-weight:700;
}
.ava{width:40px;height:40px}
.avaS{width:30px;height:30px;font-size:13px;vertical-align:middle}
.body{min-width:0;max-width:1700px;margin:auto;padding:28px 30px 54px}
.vh{
  position:relative;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  min-height:146px;margin:0 0 24px;padding:24px 28px;
  color:#001E27;background:var(--color-secondary);
  border:4px solid var(--color-foreground);box-shadow:var(--shadow);
}
.vh::before{
  content:"CLINICAL OPERATIONS";
  position:absolute;right:20px;top:14px;
  color:#0E7490;font:700 12px/1 "SFMono-Regular",Consolas,monospace;
  letter-spacing:.12em;
}
.vh h2{max-width:700px;margin:0;color:#001E27;font-size:clamp(30px,4vw,56px);line-height:.92;font-weight:700;letter-spacing:-.035em}
.vh p{margin:10px 0 0;color:#164E63;font-size:15px;font-weight:700}
.btn{
  min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 15px;
  color:#001E27;background:var(--color-accent);
  border:3px solid #022C22;border-radius:0;
  box-shadow:4px 4px 0 #022C22;
  font-weight:700;font-size:14px;
  transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.btn:hover{background:#10B981;transform:translate(2px,2px);box-shadow:2px 2px 0 #022C22}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.ghost{color:var(--ink);background:#FFFFFF;border-color:var(--color-foreground);box-shadow:3px 3px 0 var(--color-foreground)}
.btn.ghost:hover{background:#CFFAFE}
.btn .material-symbols-outlined{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{
  position:relative;min-width:0;padding:16px 17px;
  background:var(--color-card);border:3px solid var(--color-foreground);
}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi::after{
  content:"";position:absolute;right:-3px;bottom:-3px;
  width:25px;height:25px;background:var(--color-secondary);
  border-top:3px solid var(--color-foreground);border-left:3px solid var(--color-foreground);
}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:700}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.kpi .v{margin-top:7px;color:var(--ink);font-size:31px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{color:var(--muted);font-size:14px;font-weight:700}
.kpi .d{margin-top:7px;font-size:13px;font-weight:700}
.up::before{content:"改善 ";font-size:11px}
.dn::before{content:"注意 ";font-size:11px}
.up{color:#047857}.dn{color:#B91C1C}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g13{grid-template-columns:1.3fr 1fr}
.g21{grid-template-columns:2fr 1fr}
.split{grid-template-columns:360px minmax(0,1fr);align-items:start}
.card,.qwrap{
  min-width:0;background:var(--color-card);
  border:3px solid var(--color-foreground);border-radius:0;
  box-shadow:5px 5px 0 rgba(22,78,99,.2);
}
.card{padding:18px 20px}
.card>h3,.qwrap .qh{
  display:flex;align-items:center;gap:8px;
  margin:0 0 15px;padding-bottom:11px;
  color:var(--ink);border-bottom:3px solid var(--color-foreground);
  font-size:16px;font-weight:700;
}
.card>h3 .material-symbols-outlined,.qwrap .qh .material-symbols-outlined{color:var(--color-primary);font-size:22px}
.card>h3 .grow{margin-left:auto;color:#075985;font-size:13px;font-weight:700}
.qwrap{overflow:hidden}
.qwrap .qh{margin:0;padding:15px 16px;background:#CFFAFE}
.qi{
  display:flex;align-items:center;gap:11px;
  min-height:72px;padding:11px 14px;
  border-bottom:2px solid var(--line);background:#FFFFFF;
  transition:background-color .18s ease,transform .18s ease;
}
.qi:last-child{border-bottom:0}
.qi:hover{background:#ECFEFF}
.qi.act{padding-left:10px;background:#BAE6FD;border-left:7px solid var(--color-primary)}
.qi .num{
  width:39px;height:39px;display:grid;place-content:center;flex:none;
  color:#001E27;background:var(--color-secondary);
  border:2px solid var(--color-foreground);
  font:700 16px/1 "SFMono-Regular",Consolas,monospace;
}
.qi .num.wait{background:#FEF3C7}
.qi .num.done{background:#A7F3D0}
.qi .qn{color:var(--ink);font-size:14px;font-weight:700}
.qi .qm{margin-top:2px;color:var(--muted);font-size:12px}
.qi .qr{margin-left:auto;text-align:right}
.qi .qr b{color:var(--ink);font:700 13px/1 "SFMono-Regular",Consolas,monospace}
.dhero{
  position:relative;margin-bottom:17px;padding:20px 22px;
  color:#001E27;background:var(--color-secondary);
  border:4px solid var(--color-foreground);box-shadow:6px 6px 0 var(--color-foreground);
}
.dhero::after{
  content:"ACTIVE RECORD";position:absolute;right:14px;top:12px;
  font:700 10px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.12em;
}
.dhero .dn{color:#001E27;font-size:24px;font-weight:700}
.dhero .dm{margin-top:5px;color:#164E63;font-size:14px;font-weight:700}
.dhero .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.dhero .chip{padding:4px 9px;color:#0F172A;background:#FFFFFF;border:2px solid #164E63;font-size:12px;font-weight:700}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--line)}
.fld{min-height:65px;padding:10px 12px;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.fld:nth-child(2n){border-right:0}
.fld:nth-last-child(-n+2){border-bottom:0}
.fld .k{color:var(--muted);font-size:12px;font-weight:700}
.fld .v{margin-top:3px;color:var(--ink);font-size:15px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  padding:11px 12px;text-align:left;white-space:nowrap;
  color:#ECFEFF;background:var(--color-foreground);
  border:2px solid var(--color-foreground);
  font-size:12px;font-weight:700;letter-spacing:.035em;
}
.tbl td{
  padding:11px 12px;white-space:nowrap;
  border:2px solid var(--line);background:#FFFFFF;
  font-variant-numeric:tabular-nums;
}
.tbl tbody tr:nth-child(even) td{background:#F0FDFF}
.tbl tbody tr:hover td{background:#CFFAFE}
.tbl td:nth-last-child(3),.tbl td:nth-last-child(2){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;white-space:nowrap;
  border:2px solid currentColor;border-radius:0;
  font-size:12px;font-weight:700;
}
.tag::before{content:"■";font-size:7px}
.t-ok{color:#065F46;background:#D1FAE5}
.t-warn{color:#92400E;background:#FEF3C7}
.t-red{color:#991B1B;background:#FEE2E2}
.t-blue{color:#075985;background:#CFFAFE}
.t-gray{color:#334155;background:#E2E8F0}
.teeth{display:flex;flex-direction:column;gap:9px}
.trow{display:flex;justify-content:center;gap:5px;flex-wrap:nowrap}
.th{
  width:32px;height:43px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;
  color:var(--muted);background:#FFFFFF;border:2px solid var(--color-foreground);
  font:700 11px/1 "SFMono-Regular",Consolas,monospace;
}
.th:hover{transform:translateY(-3px);box-shadow:0 3px 0 var(--color-foreground)}
.th.caries{color:#991B1B;background:#FEE2E2;border-color:#B91C1C}
.th.caries::before{content:"×";font-size:10px}
.th.filled{color:#075985;background:#CFFAFE;border-color:#0891B2}
.th.filled::before{content:"●";font-size:8px}
.th.crown{color:#92400E;background:#FEF3C7;border-color:#B45309}
.th.crown::before{content:"▲";font-size:8px}
.th.miss{color:#475569;background:#E2E8F0;border-color:#64748B;text-decoration:line-through}
.lgd{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;color:var(--color-foreground);font-size:13px}
.lgd span{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.lgd i{width:14px;height:14px;display:inline-block;border-radius:0}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:4px;background:var(--color-foreground)}
.tli{position:relative;padding:0 0 19px}
.tli:last-child{padding-bottom:0}
.tli .d{position:absolute;left:-26px;top:2px;width:18px;height:18px;background:#FEF3C7;border:4px solid #B45309}
.tli.ok .d{background:#D1FAE5;border-color:#047857}
.tli b{color:var(--ink);font-size:14px}
.tli small{color:var(--muted);font:400 12px/1.5 "SFMono-Regular",Consolas,monospace}
.tli p{margin:4px 0 0;font-size:14px}
.note{padding:13px 15px;color:#334155;background:var(--color-muted);border:2px solid var(--color-foreground);font-size:14px;line-height:1.7}
.miniK{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk{padding:11px 13px;background:#CFFAFE;border:2px solid var(--color-foreground)}
.mk .l{color:var(--muted);font-size:12px;font-weight:700}
.mk .v{margin-top:3px;color:var(--ink);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{min-width:0;padding:10px;background:#ECFEFF;border:2px solid var(--color-foreground)}
.col h4{display:flex;align-items:center;gap:6px;margin:0 0 10px;color:var(--ink);font-size:14px;font-weight:700}
.col h4 .cnt{margin-left:auto;padding:1px 7px;color:#001E27;background:var(--color-secondary);border:2px solid var(--color-foreground);font-size:11px}
.cc{margin-bottom:10px;padding:10px;background:#FFFFFF;border:2px solid var(--color-foreground);border-top:7px solid var(--color-primary)}
.cc:last-child{margin-bottom:0}
.cc b{display:block;color:var(--ink);font-size:13px}
.cc small{color:var(--muted);font-size:12px}
.cc .f{display:flex;align-items:center;gap:6px;margin-top:9px;color:#334155;font-size:12px}
.alert{display:flex;gap:11px;padding:12px 0;border-top:2px solid var(--line)}
.alert:first-of-type{border-top:0}
.aic{width:37px;height:37px;display:grid;place-content:center;flex:none;border:2px solid currentColor}
.a-red{color:#991B1B;background:#FEE2E2}
.a-amb{color:#92400E;background:#FEF3C7}
.a-blue{color:#075985;background:#CFFAFE}
.alert p{margin:0;font-size:14px;line-height:1.45}
.alert b{color:var(--ink)}
.chart{position:relative;width:100%;height:275px}
.chartS{position:relative;width:100%;height:235px}
.bar{height:13px;background:#E2E8F0;border:2px solid var(--color-foreground);overflow:hidden}
.bar span{display:block;height:100%;background:var(--color-primary)!important}
.stars{color:#92400E;font-size:14px;letter-spacing:1px}
.rev{padding:14px 0;border-top:2px solid var(--line)}
.rev:first-of-type{border-top:0}
.rev .rh{display:flex;align-items:center;gap:8px}
.rev .rh b{color:var(--ink);font-size:14px}
.rev p{margin:6px 0 0;font-size:14px;line-height:1.55}
code,.mono,.tbl td:first-child{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
@keyframes grid-in{
  0%{opacity:0;transform:translateY(16px) scale(.92)}
  75%{transform:translateY(-2px) scale(1.01)}
  100%{opacity:1;transform:none}
}
.view-enter .kpi,.view-enter .card,.view-enter .qwrap,.view-enter .dhero{
  animation:grid-in .4s both;
}
.view-enter .kpi:nth-child(2),.view-enter .card:nth-child(2){animation-delay:.06s}
.view-enter .kpi:nth-child(3){animation-delay:.12s}
.view-enter .kpi:nth-child(4){animation-delay:.18s}
@media (max-width:1180px){
  .shell{grid-template-columns:94px minmax(0,1fr)}
  .rail .lg{justify-content:center;padding:10px}
  .rail .lg::after,.rail button span:not(.material-symbols-outlined){display:none}
  .rail button{justify-content:center}
  .split{grid-template-columns:320px minmax(0,1fr)}
  .board{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .shell{display:block}
  .rail{
    position:sticky;top:0;height:auto;width:100%;
    display:flex;flex-direction:row;overflow-x:auto;
    padding:8px 10px;border-right:0;border-bottom:4px solid #0F172A;
  }
  .rail .lg{width:48px;min-width:48px;min-height:46px;margin:0 5px 0 0;box-shadow:none}
  .rail button{width:auto;min-width:48px;min-height:46px;padding:8px 12px}
  .rail .sp{display:none}
  .top{top:66px;padding:10px 16px}
  .body{padding:21px 16px 42px}
  .g2,.g13,.g21,.split{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .top{min-height:68px}
  .top h1{font-size:18px}
  .top .sub{max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{padding:6px;font-size:0}
  .live .dot{margin:0}
  .body{padding:16px 10px 34px}
  .vh{min-height:132px;padding:22px 16px;align-items:flex-start;flex-direction:column}
  .vh::before{right:12px;top:10px}
  .vh h2{font-size:38px}
  .kpis{grid-template-columns:1fr;gap:10px}
  .kpi:nth-child(2n){transform:none}
  .card{padding:15px 13px}
  .board{grid-template-columns:1fr}
  .flds,.miniK{grid-template-columns:1fr}
  .fld{border-right:0}
  .fld:nth-last-child(2){border-bottom:2px solid var(--line)}
  .dhero{padding:18px 14px}
  .dhero::after{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail" aria-label="主要功能"></aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">線上預約報到</h1><div class="sub" id="vs">康和牙醫診所 · 內湖分院 · 診次 A 診</div></div>
      <div class="r"><span class="live"><span class="dot" aria-hidden="true"></span>今日看診中</span><span class="ava" aria-label="護理人員帳號">護</span></div>
    </header>
    <main class="body" id="view" tabindex="-1"></main>
  </div>
</div>
<script>
const MODS=[["event_available","預約"],["dentistry","病歷"],["medical_services","診療"],["receipt_long","申報"],["notifications_active","召回"],["insights","績效"]];
const NAMES=["線上預約報到","牙位病歷","診療處置","健保申報","回診召回","診所績效"];
const DESC=["網路預約、候診叫號與報到管理","牙位圖、療程規劃與就診紀錄","診間醫囑、處置與處方開立","健保碼核對、申報與退件管理","定檢通知、術後追蹤與回診召回","營運指標、醫師產值與評價分析"];

const rail=document.getElementById("rail"),view=document.getElementById("view"),vt=document.getElementById("vt"),vs=document.getElementById("vs");
rail.innerHTML=`<div class="lg"><span class="material-symbols-outlined" aria-hidden="true">dentistry</span></div>`+MODS.map((m,i)=>`<button type="button" data-i="${i}" class="${i===0?'on':''}" aria-current="${i===0?'page':'false'}"><span class="material-symbols-outlined" aria-hidden="true">${m[0]}</span><span>${m[1]}</span></button>`).join("")+`<div class="sp"></div><button type="button"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span>設定</span></button>`;

function show(i){
 rail.querySelectorAll("button[data-i]").forEach(b=>{
  const on=+b.dataset.i===i;
  b.classList.toggle("on",on);
  b.setAttribute("aria-current",on?"page":"false")
 });
 vt.textContent=NAMES[i];
 vs.textContent="康和牙醫診所 · 內湖分院 · "+DESC[i];
 const head=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${DESC[i]}</p></div>${i===0?'<button class="btn"><span class="material-symbols-outlined" aria-hidden="true">person_add</span>新增預約</button>':i===3?'<button class="btn"><span class="material-symbols-outlined" aria-hidden="true">upload_file</span>產生申報檔</button>':''}</div>`;
 view.classList.remove("view-enter");
 view.innerHTML=head+SCREENS[i]();
 void view.offsetHeight;
 view.classList.add("view-enter");
 drawCharts(i)
}
function activateQueue(el){
 selQ=+el.dataset.q;
 show(0)
}
rail.addEventListener("click",e=>{
 const b=e.target.closest("button[data-i]");
 if(b){
  const i=+b.dataset.i;
  const hash="#v"+i;
  if(location.hash===hash)show(i);else location.hash=hash
 }
});
view.addEventListener("click",e=>{
 const q=e.target.closest("[data-q]");
 if(q)activateQueue(q)
});
view.addEventListener("keydown",e=>{
 const q=e.target.closest("[data-q]");
 if(q&&(e.key==="Enter"||e.key===" ")){e.preventDefault();activateQueue(q)}
});
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 const n=document.querySelectorAll("[data-i]").length||6;
 const i=m?Math.min(+m[1],n-1):0;
 show(i);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
