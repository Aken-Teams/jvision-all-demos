<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>租賃合約與 IFRS 16 管理 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99DDD5;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#F0FDFA;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E5F7F4;
  --hov:#ECFDF9;
  --track:#DCECEA;
  --sidebar:#FFFFFF;
  --sidebar2:#FFFFFF;
  --side-edge:#5EEAD4;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:3px;
  --glow:rgba(13,148,136,.2);
  --shadow:0 1px 0 rgba(19,78,74,.08),0 8px 24px rgba(19,78,74,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Crimson Pro",Georgia,"Times New Roman",serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,.brand-txt,.nav button,.tag{font-family:"Cormorant Garamond",Georgia,serif;margin:0}
h1,h2,h3,h4{color:var(--ink);font-weight:700;letter-spacing:.01em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:1.25em;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#99F6E4;color:#0F172A}

.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex:none;min-width:0;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;padding:22px 18px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);box-shadow:4px 0 22px rgba(19,78,74,.035);z-index:10}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:2px 4px 25px;border-bottom:1px solid var(--line)}
.brand-logo{width:42px;height:42px;flex:none;border:1px solid var(--color-primary);border-radius:2px;background:var(--color-primary);color:var(--color-on-primary);display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 #99F6E4}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:17px;font-weight:700;letter-spacing:.03em;line-height:1.15}
.brand-txt span{display:block;margin-top:3px;color:var(--muted);font-family:"Cinzel",serif;font-size:9px;font-weight:600;letter-spacing:.17em}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:19px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;min-width:0;min-height:44px;padding:10px 11px;background:transparent;border:1px solid transparent;border-radius:2px;color:var(--muted);font-size:15px;font-weight:600;text-align:left;white-space:nowrap;transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease}
.nav button::before{content:"";position:absolute;left:-19px;top:8px;bottom:8px;width:3px;background:transparent;transition:background-color .22s ease}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav button:hover{background:var(--color-background);border-color:var(--line);color:var(--ink);transform:translateX(2px)}
.nav button.on{background:#CCFBF1;border-color:var(--color-primary);color:#0F4F49;font-weight:700}
.nav button.on::before{background:var(--color-accent)}
.nav .idx{margin-left:auto;color:#52646F;font-family:"Cinzel",serif;font-size:9px;font-weight:600;letter-spacing:.12em}
.side-foot{margin-top:auto;padding:17px 4px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
.side-foot b{color:var(--ink);font-family:"Cinzel",serif;font-size:10px}
.main{flex:1;min-width:0;max-width:1660px;padding:26px 32px 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:19px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:26px;line-height:1.1}
.topbar h1 .material-symbols-outlined{display:flex;width:34px;height:34px;align-items:center;justify-content:center;background:#CCFBF1;border:1px solid var(--line);color:#0F766E;font-size:20px}
.topbar .sub{margin-top:6px;color:var(--muted);font-size:13px;letter-spacing:.015em}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;background:var(--panel);border:1px solid var(--line);border-radius:2px;color:#334155;font-size:12px;font-weight:600;box-shadow:0 1px 0 rgba(19,78,74,.04)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid #fff;box-shadow:0 0 0 2px #86EFAC;animation:pulse 2s ease-in-out infinite}
.avatar{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--color-accent);border:1px solid #92400E;border-radius:2px;color:var(--color-on-accent);font-family:"Cormorant Garamond",serif;font-size:14px;font-weight:700;box-shadow:3px 3px 0 #FDE68A}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0;animation:ledger-in .42s cubic-bezier(.2,.85,.3,1.18) both}
.grid>*:nth-child(2){animation-delay:.06s}
.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}
.grid>*:nth-child(5){animation-delay:.24s}
.grid>*:nth-child(6){animation-delay:.3s}
.grid>*:nth-child(7){animation-delay:.36s}
.grid>*:nth-child(8){animation-delay:.42s}
.card,.sec,.kpi,.stat,.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:var(--color-primary);box-shadow:0 1px 0 rgba(19,78,74,.08),0 12px 28px rgba(13,148,136,.1);transform:translateY(-2px)}
.card,.sec{min-width:0;padding:16px}
.sec{margin-bottom:12px}
.sec>h3,.card-h{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:13px}
.sec>h3{display:flex;align-items:center;gap:8px;font-size:16px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:#0F766E;font-size:18px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:16px;font-weight:700}
.card-h .hint{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.025em}
.card.pad0>.card-h,.card.p0>.card-h{margin-bottom:0}

.kpi,.stat{position:relative;min-width:0;overflow:hidden;padding:15px 16px}
.kpi::before,.stat::before,.tile::before{content:"";position:absolute;left:-1px;top:-1px;width:45px;height:3px;background:var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-28px;top:-31px;width:84px;height:84px;border:1px solid #99F6E4;transform:rotate(45deg);background:var(--color-background)}
.kpi .ico{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:#CCFBF1;border:1px solid var(--line);border-radius:2px;color:#0F766E}
.kpi .ico .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:#0F766E}
.kpi .val,.stat .val,.tile .tv{margin-top:2px;color:#0F3F3B;font-family:"Cinzel",serif;font-size:24px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Crimson Pro",serif;font-size:13px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:12px;font-weight:600}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0>div[style*="overflow-x"],.card.p0>div[style*="overflow-x"]{border-top:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th{padding:10px 13px;background:var(--th);border-bottom:1px solid var(--line);color:#3D5A58;font-family:"Cinzel","Cormorant Garamond",serif;font-size:10px;font-weight:600;letter-spacing:.055em;text-align:left;white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid #D5EAE7;color:#244D49;white-space:nowrap;transition:background-color .2s ease}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFEFD}
tbody tr:hover td{background:var(--hov)}
.mono{font-family:"Cinzel","SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.025em;text-align:left!important}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:2px;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap}
.t-ok{background:#F0FDF4;color:#166534}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#F0F9FF;color:#075985}
.t-gray{background:#F1F5F9;color:#475569}
.t-acc,.t-pink{background:#CCFBF1;color:#0F766E}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border-radius:1px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:1px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:var(--muted);font-family:"Cinzel",serif;font-size:10px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;background:#fff;border:3px solid var(--color-primary);border-radius:1px}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--th);border:1px solid var(--line);border-radius:2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;font-size:14px;font-weight:700}
.col-h .cnt{padding:1px 8px;background:#fff;border:1px solid var(--line);border-radius:2px;color:var(--muted);font-family:"Cinzel",serif;font-size:10px}
.pcard{padding:10px 11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:2px;box-shadow:0 2px 8px rgba(19,78,74,.04)}
.pcard b{font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#CCFBF1;border:1px solid var(--line);border-radius:2px;color:#0F766E;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:2px;transition:border-color .22s ease,transform .22s ease}
.lane-row:hover{border-color:var(--color-primary);transform:translateX(2px)}
.lane-row .num{display:flex;align-items:center;justify-content:center;width:31px;height:31px;flex:none;background:#CCFBF1;border:1px solid var(--line);border-radius:2px;color:#0F766E;font-family:"Cinzel",serif;font-size:12px;font-weight:600}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;background:#fff;border:2px solid var(--line);border-radius:2px;color:#64748B;font-family:"Cinzel",serif;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.steps .s.cur{border-color:var(--color-accent);color:#92400E;animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:1px}
.gauge .track i{display:block;height:100%;background:var(--color-primary);border-radius:1px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Cinzel",serif;font-size:9px;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:2px}
.band .rng{position:absolute;top:0;bottom:0;background:#99F6E4;border-radius:2px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--color-primary);border:1px solid #115E59;border-radius:1px;box-shadow:2px 2px 0 #99F6E4}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden;padding:15px 16px}
.tile .ti{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:#CCFBF1;border:1px solid var(--line);border-radius:2px;color:#0F766E}
.tile .ti .material-symbols-outlined{font-size:19px}
.tile b{font-size:15px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro",Georgia,serif!important;fill:#475569!important;color:#475569!important}
.apexcharts-gridline{stroke:#CDE7E3!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:1px solid var(--line)!important;border-radius:2px!important;box-shadow:var(--shadow)!important}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.58;transform:scale(.9)}}
@keyframes ledger-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px;border-right:0;border-bottom:1px solid var(--line);box-shadow:none}
  .brand{padding:0 13px 0 2px;border:0}
  .brand-logo{width:38px;height:38px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:0}
  .nav button{min-height:40px;padding:8px 10px}
  .nav button::before{display:none}
  .nav .idx{display:none}
  .main{width:100%;padding:20px 16px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button{min-width:42px;justify-content:center}
  .topbar h1{font-size:22px}
  .top-right{justify-content:flex-start}
  .chip{min-height:38px}
  .tile{padding:13px}
  .tile .tv{font-size:20px}
  th,td{padding:9px 11px}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .brand-txt{display:none}
  .main{padding-left:12px;padding-right:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .grid>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">real_estate_agent</span></div>
      <div class="brand-txt"><b>租賃管理艙</b><span>LEASE & IFRS 16</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">有效租約 46 份<br/>使用權資產 8.4 億<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
