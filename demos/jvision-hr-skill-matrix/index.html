<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>技能矩陣與多能工管理 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E7DC;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#FDE7C2;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E6F8F5;
  --hov:#ECFDF9;
  --track:#DCEBEA;
  --sidebar:#FFFFFF;
  --sidebar2:#FFFFFF;
  --side-edge:var(--line);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:8px;
  --glow:rgba(13,148,136,.22);
  --shadow:4px 4px 0 rgba(19,78,74,.09);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC","PMingLiU",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.kpi .val,.stat .val,.tile b{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC","PMingLiU",serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(13,148,136,.18);
}
::selection{background:var(--color-secondary);color:#0F172A}

.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;
  flex:none;
  min-width:0;
  height:100vh;
  padding:26px 18px 20px;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  color:var(--ink);
  background:rgba(255,255,255,.96);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 5px 25px;min-width:0}
.brand-logo{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid #08786F;
  border-radius:4px;
  box-shadow:4px 4px 0 var(--accent-soft2);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt b{display:block;font-size:18px;font-weight:700;letter-spacing:.04em;line-height:1.1}
.brand-txt span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.18em;
}
.nav{display:flex;flex-direction:column;gap:7px;margin-top:3px;min-width:0}
.nav button{
  min-height:44px;
  min-width:0;
  padding:10px 11px;
  display:flex;
  align-items:center;
  gap:11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  text-align:left;
  white-space:nowrap;
  font-size:15px;
  font-weight:600;
  transition:color .22s ease,background-color .22s ease,border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{color:var(--ink);background:var(--color-muted);border-color:var(--line);transform:translateX(3px)}
.nav button.on{
  color:#062E2A;
  background:var(--color-secondary);
  border-color:#0F9F92;
  box-shadow:3px 3px 0 var(--accent-soft2);
}
.nav .idx{margin-left:auto;color:inherit;font-family:"Cinzel",serif;font-size:10px;font-weight:600;opacity:.75}
.side-foot{
  margin-top:auto;
  padding:16px 7px 2px;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-size:12px;
  line-height:1.65;
}
.side-foot b{color:var(--ink);font-family:"Cinzel",serif}

.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,46px) 64px}
.topbar{
  margin-bottom:23px;
  padding-bottom:18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(27px,3vw,38px);font-weight:700;line-height:1}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:29px}
.topbar .sub{max-width:720px;margin-top:7px;color:var(--muted);font-size:14px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  min-height:36px;
  padding:7px 11px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  font-size:12px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #DCFCE7;animation:pulse 2s ease-in-out infinite}
.avatar{
  width:36px;
  height:36px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:1px solid #A85D05;
  border-radius:4px;
  font-weight:700;
}

#screen>*{animation:reveal .42s cubic-bezier(.2,.8,.2,1) both}
#screen>*:nth-child(2){animation-delay:.06s}
#screen>*:nth-child(3){animation-delay:.12s}
#screen>*:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(270px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr)}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:5px 5px 0 rgba(13,148,136,.15)}
.card,.sec{padding:19px}
.sec{margin-bottom:16px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h,.sec>h3{
  min-height:34px;
  margin-bottom:15px;
  padding-bottom:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card-h .hint{color:var(--muted);font-size:12px}
.sec>p{margin:0 0 13px;color:var(--muted);line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:17px 18px}
.kpi::before,.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi::after{content:"";position:absolute;right:-24px;top:-26px;width:82px;height:82px;border:1px solid var(--line);transform:rotate(45deg)}
.kpi .ico{width:36px;height:36px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:#075E57;background:var(--accent-soft);border-radius:4px}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{margin-top:11px;display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  font-size:29px;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.1;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .delta,.stat .d{margin-top:7px;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:12px 14px;
  color:#245752;
  background:var(--th);
  border-bottom:1px solid var(--line);
  font-size:11px;
  font-weight:600;
  letter-spacing:.05em;
  text-align:left;
  white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid #D5EEEA;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .2s ease}
tbody tr:hover{background:var(--hov)}
.mono{
  font-family:"Cinzel","SFMono-Regular",Consolas,monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
td[style*="text-align:center"],th[style*="text-align:center"]{font-variant-numeric:tabular-nums}
.tag{
  min-height:25px;
  padding:3px 9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#B91C1C;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#075E57;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #C6DFDC;border-radius:2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:1px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:14px;height:14px;background:#fff;border:3px solid var(--accent);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}

.chk{min-height:43px;padding:8px 2px;display:flex;align-items:center;gap:9px;border-bottom:1px dashed var(--line);font-size:13px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding:12px 13px;color:#3B5552;background:var(--color-muted);border-left:3px solid var(--color-accent);font-size:12px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--th);border:1px solid var(--line);border-radius:6px}
.col-h{padding:2px 4px 7px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-family:"Cinzel",monospace;font-size:10px}
.pcard{padding:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;box-shadow:2px 2px 0 rgba(19,78,74,.07)}
.pcard b{font-size:14px}
.pcard .meta{margin-top:5px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}
.pcard .who{margin-top:8px}
.mini-av,.av{flex:none;display:inline-flex;align-items:center;justify-content:center;color:#075E57;background:var(--accent-soft);border:1px solid var(--line);border-radius:50%;font-weight:700}
.mini-av{width:20px;height:20px;font-size:9px}
.av{width:28px;height:28px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{min-width:0;padding:12px 14px;display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:5px}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;color:#075E57;background:var(--accent-soft);border-radius:3px;font-family:"Cinzel",monospace;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:23px;height:23px;z-index:1;display:flex;align-items:center;justify-content:center;color:#64748B;background:#fff;border:2px solid var(--line);border-radius:50%;font-family:"Cinzel",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#000;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:#075E57;border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{min-width:0;padding:12px 4px;display:flex;align-items:center;gap:13px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;overflow:hidden;background:var(--track);border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:2px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;text-align:right;font-variant-numeric:tabular-nums}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:3px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:3px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:2px;box-shadow:2px 2px 0 var(--glow)}
.tile{padding:17px 18px;display:flex;flex-direction:column;gap:8px}
.tile .ti{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#075E57;background:var(--accent-soft);border-radius:4px}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:17px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:16px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:2;grid-row:1 / span 99;position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
  #screen>.grid.g4:first-child>*{width:100%}
}

.grid.g4:first-child{gap:12px}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;padding:12px 14px;flex-direction:row;align-items:center;gap:8px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 10px 0 2px}
  .brand-logo{width:38px;height:38px}
  .brand-txt span{display:none}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin:0}
  .nav button{min-height:42px;padding:8px 11px}
  .nav button:hover{transform:translateY(-2px)}
  .nav .idx{display:none}
  .main{padding:20px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button{min-width:42px;justify-content:center}
  .topbar h1{font-size:26px}
  .top-right{width:100%;justify-content:flex-start}
  .kpi,.stat{padding:14px}
  .kpi .val,.stat .val{font-size:25px}
  .card,.sec{padding:15px}
  .steps{transform:scale(.9);transform-origin:right center}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .chip{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">diversity_3</span></div>
      <div class="brand-txt"><b>技能矩陣台</b><span>SKILL MATRIX</span></div>
    </div>
    <nav class="nav" id="nav"></nav>

var RENDER=[v0,v1,v2,v3];



/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>

</body>
