<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>綠色採購評分台 — Green Procurement Score Terminal</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#be185d; --accent2:#fb7185;
  --bg:#0b0e14; --panel:#141925; --panel2:#1b2231; --line:#2a3346;
  --txt:#e6edf6; --muted:#8b98ad; --dim:#5f6c82;
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa; --violet:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:'Inter','Noto Sans TC',sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%, #1a1220 0%, transparent 60%), var(--bg);
  color:var(--txt); min-height:100vh; font-size:14px; line-height:1.5;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;vertical-align:middle;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}

/* ===== TOP NAV ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,#120a12,#0d1017 60%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.topbar-in{display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(190,24,93,.4)}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.topbar-status{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:20px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* ===== NAV TABS ===== */
nav.tabs{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(20,25,37,.5)}
nav.tabs button{
  flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;
  background:var(--panel);color:var(--muted);border:1px solid var(--line);
  padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.18s}
nav.tabs button .material-symbols-outlined{font-size:19px}
nav.tabs button:hover{color:var(--txt);border-color:var(--accent2);transform:translateY(-1px)}
nav.tabs button.active{
  background:linear-gradient(135deg,var(--accent),#9d174d);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(190,24,93,.35)}

/* ===== LAYOUT ===== */
main{padding:20px 18px 60px;max-width:1400px;margin:0 auto}
.screen-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.screen-head .st{min-width:0}
.screen-head h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.screen-head h2 .material-symbols-outlined{font-size:26px;color:var(--accent2)}
.screen-head p{color:var(--muted);font-size:13px;margin-top:3px}
.badge-live{margin-left:auto;font-size:11px;color:var(--accent2);border:1px solid var(--accent);
  padding:4px 10px;border-radius:20px;background:rgba(190,24,93,.12);white-space:nowrap}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.grid>*{min-width:0}

.card{background:linear-gradient(180deg,var(--panel),#111623);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--dim);font-weight:500}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,113,133,.18),transparent 70%)}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:6px;font-family:'Inter'}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .delta{font-size:12px;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}

/* chart box */
.chartbox{position:relative;height:260px}
.chartbox.sm{height:210px}
.chartbox.lg{height:320px}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:rgba(190,24,93,.06)}
td.num{font-variant-numeric:tabular-nums;font-weight:600}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.tag .material-symbols-outlined{font-size:14px}
.t-green{background:rgba(52,211,153,.15);color:var(--green)}
.t-amber{background:rgba(251,191,36,.15);color:var(--amber)}
.t-red{background:rgba(248,113,113,.15);color:var(--red)}
.t-blue{background:rgba(96,165,250,.15);color:var(--blue)}
.t-violet{background:rgba(167,139,250,.15);color:var(--violet)}
.t-pink{background:rgba(251,113,133,.15);color:var(--accent2)}

/* grade pill */
.grade{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;font-weight:800;font-size:14px;color:#0b0e14}
.gA{background:var(--green)} .gB{background:var(--blue)} .gC{background:var(--amber)} .gD{background:var(--red)}

/* score bar */
.sbar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:80px}
.sbar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ===== leaderboard (signature screen 0) ===== */
.board{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(90deg,var(--panel2),#141a27);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
.brow>*{min-width:0}
.brow .rk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.brow.top1 .rk{background:linear-gradient(135deg,#f0d264,#c99a2a);color:#231a00}
.brow.top2 .rk{background:linear-gradient(135deg,#d4dbe6,#9aa5b4);color:#1a1f28}
.brow.top3 .rk{background:linear-gradient(135deg,#e0a06a,#b06e34);color:#1e1206}
.brow .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.brow .nm span{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:2px}
.brow .sc{text-align:right}
.brow .sc b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.brow .sc small{display:block;font-size:11px;color:var(--muted)}

/* ===== cert matrix (screen 2) ===== */
.certgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.certgrid>*{min-width:0}
.certcard{background:linear-gradient(180deg,var(--panel2),#131824);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.certcard .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;background:rgba(190,24,93,.14);color:var(--accent2)}
.certcard .ic .material-symbols-outlined{font-size:23px}
.certcard h4{font-size:14px;font-weight:700}
.certcard .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.certcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.certcard .exp{font-size:11px;color:var(--dim)}
.leftbar{position:absolute;left:0;top:0;bottom:0;width:4px}
.lb-green{background:var(--green)} .lb-amber{background:var(--amber)} .lb-red{background:var(--red)}

/* ===== timeline (screen 2) ===== */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 12px}
.tl-item::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(190,24,93,.2)}
.tl-item .d{font-size:11px;color:var(--dim)}
.tl-item .t{font-weight:700;font-size:13px;margin:2px 0}
.tl-item .x{font-size:12px;color:var(--muted)}

/* ===== weight sliders (screen 3) ===== */
.wrow{display:grid;grid-template-columns:130px 1fr 54px;gap:12px;align-items:center;margin-bottom:14px}
.wrow>*{min-width:0}
.wrow .wl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.wrow .wl .material-symbols-outlined{font-size:18px}
.wtrack{height:10px;border-radius:8px;background:var(--panel2);position:relative;overflow:hidden}
.wtrack > i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.wval{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.rulebox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.rulebox .rr{display:flex;gap:10px;font-size:12.5px;color:var(--muted);padding:6px 0;border-bottom:1px dashed var(--line)}
.rulebox .rr:last-child{border-bottom:0}
.rulebox .rr .material-symbols-outlined{font-size:17px;color:var(--accent2);flex:none}
.rulebox .rr b{color:var(--txt)}

/* ===== procurement decision (screen 4) ===== */
.alloc{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:1fr 90px 1fr 100px;gap:12px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:0}
.arow>*{min-width:0}
.arow .an{font-weight:700;font-size:13px}
.arow .an span{display:block;font-size:11px;color:var(--dim);font-weight:500}
.arow .abar{height:9px;border-radius:6px;background:var(--panel);overflow:hidden}
.arow .abar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}

/* misc */
.note{font-size:12px;color:var(--dim);margin-top:10px;display:flex;gap:6px;align-items:flex-start}
.note .material-symbols-outlined{font-size:16px;color:var(--accent2);flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ===== RWD ===== */
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .certgrid{grid-template-columns:1fr}
  .wrow{grid-template-columns:110px 1fr 46px}
  .arow{grid-template-columns:1fr 70px 1fr 84px}
}
@media(max-width:560px){
  nav.tabs button .lab{display:none}
  nav.tabs button{padding:9px 12px}
  .brand .sub{display:none}
  .kpi .val{font-size:26px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div style="min-width:0">
        <h1>綠色採購評分台</h1>
        <div class="sub">Green Procurement Score Terminal · SRM ESG</div>
      </div>
    </div>
    <div class="topbar-status">
      <span class="chip"><span class="dot"></span>資料同步中</span>
      <span class="chip"><span class="material-symbols-outlined" style="font-size:15px">database</span>ERP 已連線</span>
      <span class="chip"><span class="material-symbols-outlined" style="font-size:15px">calendar_today</span>2026 Q3</span>
    </div>
  </div>
  <nav class="tabs" id="nav"></nav>
</header>

<main id="app"></main>

<script>
"use strict";

/* ---------- palette for charts (light labels for dark terminal) ---------- */
var ACC="#be185d", ACC2="#fb7185";
var C_GRID="rgba(138,152,173,.16)", C_TICK="#8b98ad", C_TXT="#e6edf6";
Chart.defaults.color=C_TICK;
Chart.defaults.font.family="'Inter','Noto Sans TC',sans-serif";
Chart.defaults.borderColor=C_GRID;

/* ---------- fake data ---------- */
var suppliers=[
  {name:"台鋼綠能材料",cat:"金屬原料",score:94,grade:"A",ontime:99,region:"高雄"},
  {name:"永續紙業股份",cat:"包裝耗材",score:91,grade:"A",ontime:98,region:"台中"},
  {name:"淨源電子",cat:"電子零件",score:87,grade:"B",ontime:96,region:"新竹"},
  {name:"綠碳化工",cat:"化學品",score:83,grade:"B",ontime:94,region:"桃園"},
  {name:"日昇塑膠",cat:"塑膠原料",score:78,grade:"C",ontime:91,region:"台南"},
  {name:"宏達物流",cat:"運輸服務",score:74,grade:"C",ontime:88,region:"新北"},
  {name:"金鼎五金",cat:"零組件",score:69,grade:"C",ontime:85,region:"彰化"},
  {name:"大川溶劑",cat:"化學品",score:58,grade:"D",ontime:79,region:"雲林"}
];
function gradeCls(g){return g==="A"?"gA":g==="B"?"gB":g==="C"?"gC":"gD";}

/* charts registry */
var charts={};
function killChart(k){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}
function killAll(){Object.keys(charts).forEach(killChart);}

/* ---------- SCREEN 0 : 綠色評分總覽 ---------- */
function s0(){
  var rows=suppliers.map(function(s,i){
    var cls=i===0?"top1":i===1?"top2":i===2?"top3":"";
    return '<div class="brow '+cls+'">'+
      '<div class="rk">'+(i+1)+'</div>'+
      '<div class="nm">'+s.name+'<span>'+s.cat+' · '+s.region+' · 準時 '+s.ontime+'%</span></div>'+
      '<div class="sc"><b>'+s.score+'</b><small>綠分 <span class="grade '+gradeCls(s.grade)+'" style="width:auto;height:auto;padding:1px 5px;font-size:11px;display:inline-grid">'+s.grade+'</span></small></div>'+
    '</div>';
  }).join("");
  return ''+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("factory","納管供應商","128","up","+9 本季","家")+
    kpi("eco","平均綠分","82.4","up","+5.1 vs 上季","分")+
    kpi("workspace_premium","綠色合格率","71%","up","+8%","")+
    kpi("co2","供應鏈碳強度","0.34","down","-12% 減碳","tCO₂e/單位")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">leaderboard</span>供應商綠分排行榜<span class="r">依 ESG 綜合評分</span></h3>'+
      '<div class="board">'+rows+'</div></div>'+
    '<div class="grid" style="gap:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>評級分佈</h3><div class="chartbox sm"><canvas id="c0a"></canvas></div>'+
        '<div class="legend"><span><i style="background:'+ACC+'"></i>A 級 22%</span><span><i style="background:'+ACC2+'"></i>B 級 31%</span><span><i style="background:#fbbf24"></i>C 級 34%</span><span><i style="background:#5f6c82"></i>D 級 13%</span></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">insights</span>綠採佔比走勢</h3><div class="chartbox sm"><canvas id="c0b"></canvas></div></div>'+
    '</div>'+
  '</div>';
}
function drawS0(){
  var a=document.getElementById("c0a");
  if(a) charts.c0a=new Chart(a,{type:"doughnut",data:{labels:["A 級","B 級","C 級","D 級"],
    datasets:[{data:[22,31,34,13],backgroundColor:[ACC,ACC2,"#fbbf24","#5f6c82"],borderColor:"#141925",borderWidth:3}]},
    options:{cutout:"64%",plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false}});
  var b=document.getElementById("c0b");
  if(b) charts.c0b=new Chart(b,{type:"line",data:{labels:["Q1","Q2","Q3","Q4","Q1","Q2"],
    datasets:[{label:"綠採佔比 %",data:[38,44,49,55,61,68],borderColor:ACC2,backgroundColor:"rgba(251,113,133,.15)",fill:true,tension:.4,pointRadius:3,pointBackgroundColor:ACC}]},
    options:respLine(0,80)});
}

/* ---------- SCREEN 1 : 碳足跡盤查 ---------- */
var carbon=[
  {name:"台鋼綠能材料",s1:4.2,s2:3.1,s3:5.1,unit:12.4,status:"已驗證",cls:"t-green",ic:"verified"},
  {name:"永續紙業股份",s1:2.6,s2:2.0,s3:3.5,unit:8.1,status:"已驗證",cls:"t-green",ic:"verified"},
  {name:"淨源電子",s1:6.8,s2:5.2,s3:9.7,unit:21.7,status:"複核中",cls:"t-amber",ic:"hourglass_top"},
  {name:"綠碳化工",s1:11.2,s2:8.4,s3:13.9,unit:33.5,status:"複核中",cls:"t-amber",ic:"hourglass_top"},
  {name:"日昇塑膠",s1:14.6,s2:9.8,s3:16.8,unit:41.2,status:"待補件",cls:"t-red",ic:"error"},
  {name:"大川溶劑",s1:26.1,s2:18.3,s3:28.2,unit:72.6,status:"待補件",cls:"t-red",ic:"error"}
];
function s1(){
  var tr=carbon.map(function(c){
    return '<tr><td>'+c.name+'</td>'+
      '<td class="num">'+c.s1.toFixed(1)+'</td>'+
      '<td class="num">'+c.s2.toFixed(1)+'</td>'+
      '<td class="num">'+c.s3.toFixed(1)+'</td>'+
      '<td class="num" style="color:var(--accent2)">'+c.unit.toFixed(1)+'</td>'+
      '<td><span class="tag '+c.cls+'"><span class="material-symbols-outlined">'+c.ic+'</span>'+c.status+'</span></td></tr>';
  }).join("");
  return ''+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("co2","總盤查碳排","189.5","down","-8.4% YoY","tCO₂e")+
    kpi("category","範疇三占比","54%","flat","上游最高","")+
    kpi("fact_check","驗證完成率","67%","up","+14%","")+
    kpi("pending_actions","待補件供應商","2","down","-3 家","家")+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>範疇一/二/三 排放結構</h3><div class="chartbox"><canvas id="c1a"></canvas></div>'+
      '<div class="legend"><span><i style="background:'+ACC+'"></i>範疇一 直接排放</span><span><i style="background:'+ACC2+'"></i>範疇二 電力</span><span><i style="background:#60a5fa"></i>範疇三 價值鏈</span></div></div>'+

/* ---------- shared helpers ---------- */
function kpi(icon,lbl,val,dir,delta,unit){
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+icon+'</span>'+lbl+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+dir+'"><span class="material-symbols-outlined">'+arrow+'</span>'+delta+'</div></div>';
}
function respLine(min,max,legend){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:legend?{labels:{color:C_TICK,boxWidth:12,font:{size:11}}}:{display:false}},
    scales:{x:{grid:{display:false},ticks:{color:C_TICK,font:{size:10}}},
      y:{min:min,max:max,grid:{color:C_GRID},ticks:{color:C_TICK}}}};
}

}).join("");
nav.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]"); if(!b) return;
  show(+b.getAttribute("data-i"));
  try{window.scrollTo(0,0);}catch(err){}
});

/* ---------- show ---------- */
var app=document.getElementById("app");
function show(i){
  var s=SCREENS[i]; if(!s) return;
  killAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  app.innerHTML=
    '<div class="screen-head"><div class="st"><h2><span class="material-symbols-outlined">'+s.icon+'</span>'+s.title+'</h2>'+
    '<p>'+s.sub+'</p></div><span class="badge-live">● 即時資料 · 純 UI 展示</span></div>'+
    s.render();
  void app.offsetHeight;
  if(s.draw) s.draw();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
