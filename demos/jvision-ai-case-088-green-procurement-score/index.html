<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFF;--color-secondary:#3B82F6;--color-on-secondary:#000;
--color-accent:#EA580C;--color-on-accent:#000;--color-background:#F8FAFC;--color-foreground:#1E293B;
--color-card:#FFF;--color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
--green:#087A55;--amber:#9A5700;--red:#B91C1C;--shadow:0 8px 22px rgba(30,41,59,.07)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font:14px/1.5 "Fira Sans",sans-serif}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.mono,.num,.value,time{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topline{max-width:1440px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:8px;box-shadow:4px 4px 0 #BFDBFE}
.logo svg{width:23px}
.brand{min-width:0}.brand b{font-size:17px;letter-spacing:.02em}.brand small{display:block;color:var(--muted)}
.sync{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip,.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.tabs{max-width:1440px;margin:auto;padding:0 22px 11px;display:flex;gap:7px;overflow:auto}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 12px;border-radius:7px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .2s}
.tabs button:hover{color:var(--blue);border-color:#93C5FD;transform:translateY(-1px)}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 0 #BFDBFE}
main{max-width:1440px;margin:auto;padding:24px 22px 70px}
.head{display:flex;align-items:end;gap:14px;margin-bottom:18px}
.head h1{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.15}.head p{margin:5px 0 0;color:var(--muted)}
.live{margin-left:auto;border-left:3px solid var(--green);background:#ECFDF5;color:#065F46;padding:7px 10px;font-weight:600}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.two{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}.equal{grid-template-columns:repeat(2,1fr)}
.card{background:var(--color-card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:4px;height:17px;background:var(--blue)}
.kpi{position:relative;border-top:3px solid var(--blue);animation:enter .4s backwards}.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}
.label{color:var(--muted);font-weight:600}.value{font-size:27px;font-weight:700;margin:7px 0 3px;letter-spacing:-.04em}.value small{font:600 12px "Fira Sans";margin-left:4px;color:var(--muted)}
.delta{font-size:12px;font-weight:600}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.board{display:grid;gap:8px}.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:7px;transition:.2s}
.row:hover{border-color:#93C5FD;background:#F8FBFF}.rank{width:34px;height:34px;display:grid;place-items:center;background:var(--color-muted);font:700 13px "Fira Code";border-radius:5px}
.row:nth-child(-n+3) .rank{background:#DBEAFE;color:#1D4ED8}.name{font-weight:700}.meta{font-size:12px;color:var(--muted)}.score{text-align:right;font:700 20px "Fira Code"}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:29px;padding:3px 7px;border:1px solid;border-radius:5px;font:700 12px "Fira Code"}
.A{color:#066147;background:#ECFDF5}.B{color:#1D4ED8;background:#EFF6FF}.C{color:#854D0E;background:#FEFCE8}.D{color:#991B1B;background:#FEF2F2}
.chart{height:235px}.chart.small{height:205px}
.tablewrap{overflow:auto;margin:0 -16px -16px}
table{width:100%;border-collapse:collapse;min-width:570px}th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#F1F5F9;color:#334155;font-size:12px;position:sticky;top:0}td.num{text-align:right}tbody tr:hover{background:#F8FAFC}
.ok{color:#066147;background:#ECFDF5}.warn{color:#854D0E;background:#FEFCE8}.bad{color:#991B1B;background:#FEF2F2}
.certgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cert{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:7px;padding:13px}.cert.warn{border-left-color:#D97706}.cert.bad{border-left-color:var(--red)}
.cert h3{margin:0 0 3px;font-size:14px}.certfoot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px}
.timeline{border-left:2px solid #BFDBFE;margin-left:7px;padding-left:18px}.event{position:relative;margin-bottom:16px}.event:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--blue);left:-24px;top:5px}.event b{display:block}
.weight{display:grid;grid-template-columns:145px 1fr 48px;gap:10px;align-items:center;margin:13px 0}.bar{height:9px;background:var(--color-muted);overflow:hidden;border-radius:2px}.bar i{display:block;height:100%;background:var(--blue)}
.rule{padding:10px;border-bottom:1px dashed var(--line)}.rule b{color:var(--blue)}
.alloc{display:grid;gap:9px}.allocation{display:grid;grid-template-columns:1fr 65px 1fr 105px;gap:10px;align-items:center;border:1px solid var(--line);padding:11px;border-radius:7px}.allocation .end{text-align:right}
.progress{height:9px;background:var(--color-muted)}.progress i{display:block;height:100%;background:var(--color-accent)}
.note{margin-top:12px;padding:10px;border-left:3px solid var(--blue);background:#EFF6FF;color:#334155}
.track{margin-bottom:13px}.tracktop{display:flex;justify-content:space-between;gap:10px}.track p{color:var(--muted);margin:3px 0 6px}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.equal{grid-template-columns:1fr}.certgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.topline,main{padding-left:14px;padding-right:14px}.tabs{padding-left:14px;padding-right:14px}.sync .chip:nth-child(2){display:none}.kpis{grid-template-columns:1fr 1fr}.value{font-size:22px}.certgrid{grid-template-columns:1fr}.allocation{grid-template-columns:1fr 58px}.allocation .progress{grid-column:1/-1}.head{align-items:start}.live{display:none}.weight{grid-template-columns:115px 1fr 42px}}
@media(max-width:390px){.kpis{grid-template-columns:1fr}.brand small{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
