<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>銀行對帳與金流核銷系統</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0d9488;--accent2:#2dd4bf;--bg:#f1f5f6;--panel:#ffffff;
  --ink:#0f2f2c;--muted:#5c7a76;--line:#dde8e7;--soft:#effaf8;
  --good:#059669;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --shadow:0 1px 3px rgba(13,148,136,.08),0 6px 20px rgba(13,148,136,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#0b7a71,#0d9488 60%,#12b0a4);color:#fff;box-shadow:0 4px 18px rgba(13,148,136,.28)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:11px;opacity:.85;font-weight:400}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:rgba(255,255,255,.82);
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav button .material-symbols-outlined{font-size:19px}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.shead h1{font-size:20px;margin:0 0 3px;font-weight:700}
.shead p{margin:0;color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accent);border:1px solid var(--line);
  padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23{grid-template-columns:1fr}}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:700;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .sub{font-size:11px;font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}.neu{color:var(--muted)}
.chartwrap{position:relative;width:100%;overflow:hidden}
.tblwrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.4px}
tbody tr:hover{background:#f6fdfc}
.mono{font-variant-numeric:tabular-nums}
.tr-right{text-align:right}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.p-good{background:#dcfce7;color:#15803d}.p-warn{background:#fef3c7;color:#b45309}
.p-bad{background:#fee2e2;color:#b91c1c}.p-info{background:#dbeafe;color:#1d4ed8}.p-neu{background:#e2e8f0;color:#475569}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.board>*{min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col .ch{font-weight:700;font-size:12.5px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tk b{font-size:12.5px;display:block}
.tk .m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 0}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tli.ok::before{background:var(--good)}.tli.wa::before{background:var(--warn)}.tli.er::before{background:var(--bad)}
.tli b{font-size:13px}.tli .tm{font-size:11px;color:var(--muted)}
.tli p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.match{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff}
.match .side{flex:1;min-width:0}
.match .side .t{font-weight:600;font-size:12.5px}
.match .side .s{font-size:11px;color:var(--muted)}
.match .link{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.list li:last-child{border-bottom:0}
.stat-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px}
.stat-row .lab{flex:0 0 84px;color:var(--muted)}
.stat-row .bar{flex:1}
.stat-row .num{flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--accent);font-weight:600}
.recon .r{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.recon .r.tot{font-weight:700;border-top:2px solid var(--accent);border-bottom:0;margin-top:4px;color:var(--accent)}
.recon .r .v{font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:560px){.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:8px 10px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_balance</span></div>
      <div><b>金流核銷智慧站</b><small>Bank Reconciliation &amp; Cash Application</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main><div id="screen"></div></main>

<script>
"use strict";
var accent="#0d9488",accent2="#2dd4bf",line="#dde8e7";
var charts={};
function destroyCharts(){for(var kk in charts){try{charts[kk].destroy();}catch(e){}}charts={};}
function fmt(n){return (n<0?"-":"")+"NT$"+Math.abs(n).toLocaleString("en-US");}
function kn(n){return n.toLocaleString("en-US");}

var MODS=[
  {icon:"account_tree",name:"對帳單匯入"},
  {icon:"rule",name:"自動比對核銷"},
  {icon:"request_quote",name:"金流核銷入帳"},
  {icon:"fact_check",name:"未明款項調查"},
  {icon:"verified",name:"覆核與拋轉"},
  {icon:"monitoring",name:"餘額調節稽核"}
];

(function(){
  var nav=document.getElementById("nav"),html="";
  for(var i=0;i<MODS.length;i++){
    html+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span>'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=html;
})();

function shead(t,d,bi,bt){
  return '<div class="shead"><div><h1>'+t+'</h1><p>'+d+'</p></div><span class="badge"><span class="material-symbols-outlined">'+bi+'</span>'+bt+'</span></div>';
}
function kpi(lab,icon,val,sub,cls){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+'</div><div class="sub '+(cls||'neu')+'">'+sub+'</div></div>';
}
function pill(txt,cls){return '<span class="pill '+cls+'">'+txt+'</span>';}

/* SCREEN 0 — 對帳單匯入 */
function s0(c){
  var banks=[
    {n:"O宏世華 THX",acc:"012-***-4821",ch:"H2H",cnt:342,amt:18240500,st:"完成",cls:"p-good",t:"06:02"},
    {n:"台北富O FSX",acc:"012-***-1907",ch:"API",cnt:288,amt:12980300,st:"完成",cls:"p-good",t:"06:04"},
    {n:"O華信託 CHX",acc:"822-***-6650",ch:"H2H",cnt:401,amt:22610700,st:"完成",cls:"p-good",t:"06:07"},
    {n:"O山銀行 YSX",acc:"808-***-3312",ch:"API",cnt:156,amt:7420900,st:"處理中",cls:"p-warn",t:"—"},
    {n:"首O銀行 SSX",acc:"007-***-9004",ch:"H2H",cnt:97,amt:3115400,st:"待重試",cls:"p-bad",t:"—"}
  ];
  var rows="";
  for(var i=0;i<banks.length;i++){var b=banks[i];
    rows+='<tr><td><b>'+b.n+'</b><br><span class="mono" style="color:var(--muted);font-size:11px">'+b.acc+'</span></td>'
      +'<td><span class="tag">'+b.ch+'</span></td><td class="mono tr-right">'+kn(b.cnt)+'</td>'
      +'<td class="mono tr-right">'+fmt(b.amt)+'</td><td class="mono">'+b.t+'</td><td>'+pill(b.st,b.cls)+'</td></tr>';
  }
  c.innerHTML=shead("對帳單匯入","每日自 H2H／API 自動擷取多家銀行對帳單，正規化並去重後進入待比對佇列","account_tree","擷取批次 #20260814-06")
   +'<div class="grid g4" style="margin-bottom:14px">'
   +kpi("已匯入銀行","account_balance","5","H2H 3 · API 2","neu")
   +kpi("擷取交易筆數","receipt_long",kn(1284),"去重後 1,241 筆","up")
   +kpi("匯入總金額","request_quote","NT$64.4M","入帳 52 · 出帳 12","neu")
   +kpi("格式正規化率","rule","99.2%","10 筆待人工校正","up")
   +'</div>'
   +'<div class="grid g23">'
   +'<div class="card"><h3><span class="material-symbols-outlined">table_view</span>各銀行匯入狀態</h3>'
     +'<div class="tblwrap"><table><thead><tr><th>銀行／帳戶</th><th>通道</th><th class="tr-right">筆數</th><th class="tr-right">金額</th><th>完成時間</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
     +'<div class="note" style="margin-top:12px">首O銀行 H2H 連線逾時，系統將於 06:20 自動重試第 2 次；O山 API 分頁擷取中。</div></div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>擷取通道分布</h3><div class="chartwrap" style="height:210px"><canvas id="c0a"></canvas></div>'
     +'<h3 style="margin-top:14px"><span class="material-symbols-outlined">schedule</span>近 6 日匯入筆數</h3><div class="chartwrap" style="height:150px"><canvas id="c0b"></canvas></div></div>'
   +'</div>';
  void c.offsetHeight;
  charts.c0a=new Chart(document.getElementById("c0a"),{type:"doughnut",
    data:{labels:["H2H 直連","API 介接","人工上傳"],datasets:[{data:[840,388,56],backgroundColor:[accent,accent2,"#94d8d0"],borderWidth:0}]},
    options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
  charts.c0b=new Chart(document.getElementById("c0b"),{type:"bar",
    data:{labels:["8/09","8/10","8/11","8/12","8/13","8/14"],datasets:[{data:[1102,1188,1044,1256,1197,1284],backgroundColor:accent,borderRadius:4}]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:line}},x:{grid:{display:false}}}}});
}

/* SCREEN 1 — 自動比對核銷 */
function s1(c){
  var matches=[
    {pay:"匯入 NT$286,400",payer:"O達精機 匯款備註 INV-24817",inv:"發票 INV-24817 · NT$286,400",score:98,cls:"p-good",lc:"var(--good)"},
    {pay:"匯入 NT$150,000",payer:"晶元電子 客戶代碼 C-2207",inv:"發票 INV-24793 · NT$150,000",score:95,cls:"p-good",lc:"var(--good)"},
    {pay:"匯入 NT$92,340",payer:"備註空白 帳號末四碼 8841",inv:"發票 INV-24802 · NT$92,300",score:71,cls:"p-warn",lc:"var(--warn)"},
    {pay:"匯入 NT$44,120",payer:"個人戶 王O明 無備註",inv:"未找到對應發票",score:22,cls:"p-bad",lc:"var(--bad)"}
  ];
  var mh="";
  for(var i=0;i<matches.length;i++){var m=matches[i];
    mh+='<div class="match"><div class="side"><div class="t">'+m.pay+'</div><div class="s">'+m.payer+'</div></div>'
      +'<div class="link" style="background:'+m.lc+'">'+m.score+'</div>'
      +'<div class="side" style="text-align:right"><div class="t">'+m.inv+'</div><div class="s">'+pill(m.score>=90?"自動核銷":m.score>=50?"待確認":"進例外池",m.cls)+'</div></div></div>';
  }
  c.innerHTML=shead("自動比對核銷引擎","比對引擎依金額、匯款備註與客戶代碼將入帳交易與應收發票自動配對，命中即完成核銷","rule","規則集 v12 · 4 條主規則")
   +'<div class="grid g4" style="margin-bottom:14px">'
   +kpi("自動核銷率","task_alt","86.4%","↑ 5.1% vs 上月","up")
   +kpi("命中筆數","fact_check",kn(1073)+" / 1241","一次配對成功","up")
   +kpi("待人工確認","help","112","分數 50–89 區間","neu")
   +kpi("進例外池","report","56","無對應或差異","down")
   +'</div>'
   +'<div class="grid g23">'
   +'<div class="card"><h3><span class="material-symbols-outlined">join_inner</span>比對配對明細（信心分數）</h3>'+mh
     +'<div class="note" style="margin-top:4px">規則優先序：① 匯款備註含發票號 ② 金額精確相符 ③ 客戶代碼＋金額區間 ④ 帳號末四碼比對。</div></div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>規則命中占比</h3><div class="chartwrap" style="height:200px"><canvas id="c1a"></canvas></div>'
     +'<h3 style="margin-top:12px"><span class="material-symbols-outlined">insights</span>信心分數分布</h3><div class="chartwrap" style="height:160px"><canvas id="c1b"></canvas></div></div>'
   +'</div>';
  void c.offsetHeight;
  charts.c1a=new Chart(document.getElementById("c1a"),{type:"polarArea",
    data:{labels:["備註含發票號","金額精確相符","客戶代碼配對","帳號末四碼"],datasets:[{data:[512,388,141,32],backgroundColor:[accent,accent2,"#7bccc4","#bfeae5"],borderWidth:0}]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:10.5}}}},scales:{r:{grid:{color:line},ticks:{display:false}}}}});
  charts.c1b=new Chart(document.getElementById("c1b"),{type:"bar",
    data:{labels:["<50","50-69","70-89","90-100"],datasets:[{data:[56,44,68,1073],backgroundColor:["#dc2626","#d97706","#2dd4bf","#0d9488"],borderRadius:4}]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:line}},x:{grid:{display:false}}}}});
}

/* SCREEN 2 — 金流核銷入帳 */
function s2(c){
  var rows=[
    {cust:"O達精機股份有限公司",code:"C-1102",inv:"INV-24817",due:"逾期 3 天",amt:286400,pay:286400,st:"全額沖銷",cls:"p-good",age:0},
    {cust:"O元電子有限公司",code:"C-2207",inv:"INV-24793",due:"未到期",amt:150000,pay:150000,st:"全額沖銷",cls:"p-good",age:0},
    {cust:"O豐工業社",code:"C-3341",inv:"INV-24756",due:"逾期 12 天",amt:320000,pay:200000,st:"部分沖銷",cls:"p-warn",age:120000},
    {cust:"O曜儀器行",code:"C-4419",inv:"INV-24810",due:"未到期",amt:88500,pay:88500,st:"全額沖銷",cls:"p-good",age:0},
    {cust:"O茂精密製造",code:"C-5507",inv:"INV-24721",due:"逾期 28 天",amt:540000,pay:0,st:"待入帳",cls:"p-info",age:540000}
  ];
  var body="",totInv=0,totPay=0,totAge=0;
  for(var i=0;i<rows.length;i++){var r=rows[i];totInv+=r.amt;totPay+=r.pay;totAge+=r.age;
    body+='<tr><td><b>'+r.cust+'</b><br><span class="mono" style="font-size:11px;color:var(--muted)">'+r.code+'</span></td>'
      +'<td class="mono">'+r.inv+'</td><td>'+r.due+'</td>'
      +'<td class="mono tr-right">'+fmt(r.amt)+'</td><td class="mono tr-right">'+fmt(r.pay)+'</td>'
      +'<td class="mono tr-right" style="color:'+(r.age?"var(--bad)":"var(--good)")+'">'+fmt(r.age)+'</td>'
      +'<td>'+pill(r.st,r.cls)+'</td></tr>';
  }
  c.innerHTML=shead("金流核銷入帳","已配對交易依核銷金額沖抵對應發票與客戶應收帳，更新帳齡並記錄沖銷分錄","request_quote","當日沖銷分錄 1,073 筆")
   +'<div class="grid g4" style="margin-bottom:14px">'
   +kpi("已沖銷金額","payments","NT$52.1M","佔應收 81%","up")

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var c=document.getElementById("screen");
  c.innerHTML="";
  void c.offsetHeight;
  (SCREENS[i]||s0)(c);
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
