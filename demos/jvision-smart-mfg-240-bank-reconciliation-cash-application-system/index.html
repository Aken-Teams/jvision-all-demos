<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銀行對帳與金流核銷系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --good:#4ADE80;
  --warn:#FBBF24;
  --bad:#FB7185;
  --info:#60A5FA;
  --panel:#0E1223;
  --soft:#161B2E;
  --shadow:0 12px 32px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.025) inset;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  max-width:100%;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 78% -10%,rgba(34,197,94,.08),transparent 27rem),
    linear-gradient(180deg,#050A16 0,var(--color-background) 28rem);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
}
button{font:inherit}
button,[onclick]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  border-bottom:1px solid rgba(148,163,184,.22);
  background:rgba(2,6,23,.9);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
  backdrop-filter:blur(18px);
}
.topbar::after{
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,197,94,.6),transparent);
  content:"";
}
.topbar-inner{
  width:min(100%,1480px);
  margin:auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{
  min-width:260px;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand .logo{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:1px solid rgba(74,222,128,.35);
  border-radius:10px;
  background:linear-gradient(145deg,rgba(34,197,94,.2),rgba(34,197,94,.05));
  color:var(--good);
  box-shadow:0 0 18px rgba(34,197,94,.1);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
}
.brand small{
  display:block;
  margin-top:1px;
  color:#94A3B8;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  letter-spacing:.025em;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:3px;
}
.nav button{
  min-height:42px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#A8B6CA;
  font-size:12px;
  font-weight:500;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease;
}
.nav button:hover{
  border-color:#334155;
  background:#11182A;
  color:#F8FAFC;
}
.nav button.on{
  border-color:rgba(34,197,94,.42);
  background:rgba(34,197,94,.12);
  color:#86EFAC;
  box-shadow:0 0 14px rgba(34,197,94,.06);
}
.nav button .material-symbols-outlined{font-size:18px}
button:focus-visible,
[tabindex]:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
}
main{
  width:min(100%,1480px);
  margin:auto;
  padding:24px 20px 64px;
}
#screen{animation:screen-in .34s ease-out both}
.shead{
  min-height:66px;
  margin-bottom:17px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
}
.shead h1{
  margin:0 0 4px;
  color:#fff;
  font-size:22px;
  font-weight:600;
  letter-spacing:-.02em;
  text-shadow:0 0 10px rgba(255,255,255,.09);
}
.shead p{
  max-width:900px;
  margin:0;
  color:#9EACC0;
  font-size:12.5px;
}
.badge{
  min-height:30px;
  padding:5px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid rgba(34,197,94,.3);
  border-radius:6px;
  background:rgba(34,197,94,.08);
  color:#86EFAC;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:500;
  white-space:nowrap;
}
.badge .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.card,.kpi{
  border:1px solid var(--line);
  border-radius:9px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.018),transparent 42%),
    var(--panel);
  box-shadow:var(--shadow);
}
.card{padding:15px}
.card h3{
  margin:0 0 12px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#E7EDF6;
  font-size:13px;
  font-weight:600;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  color:var(--good);
  font-size:17px;
}
.kpi{
  min-height:112px;
  padding:14px 15px 13px;
  position:relative;
  overflow:hidden;
}
.kpi::before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:2px;
  background:linear-gradient(90deg,var(--color-accent),rgba(34,197,94,.12),transparent);
  content:"";
}
.kpi::after{
  position:absolute;
  top:-40px;
  right:-34px;
  width:100px;
  height:100px;
  border-radius:50%;
  background:rgba(34,197,94,.035);
  content:"";
}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:6px;
  color:#9EACC0;
  font-size:11.5px;
  font-weight:500;
}
.kpi .lab .material-symbols-outlined{
  color:#6EE7A0;
  font-size:16px;
}
.kpi .val{
  position:relative;
  z-index:1;
  margin:6px 0 2px;
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;
  text-shadow:0 0 10px rgba(255,255,255,.08);
}
.kpi .sub{
  position:relative;
  z-index:1;
  font-size:10.5px;
  font-weight:500;
}
.up{color:var(--good)}
.down{color:var(--bad)}
.neu{color:#A5B4C8}
.chartwrap{position:relative;width:100%;overflow:hidden}
.tblwrap{
  overflow-x:auto;
  border:1px solid #263248;
  border-radius:7px;
  scrollbar-color:#475569 #111827;
}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #263248;
  text-align:left;
  white-space:nowrap;
}
th{
  background:#171D2E;
  color:#B5C1D3;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.055em;
  text-transform:none;
}
td{color:#DCE4F0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#141B2D}
tbody tr:last-child td{border-bottom:0}
.mono,
td[class*="mono"],
.recon .v{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.tr-right{text-align:right}
.pill{
  min-height:22px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:600;
  line-height:1.25;
}
.pill::before{
  width:6px;
  height:6px;
  flex:0 0 auto;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 6px currentColor;
  content:"";
}
.p-good{border-color:rgba(74,222,128,.28);background:rgba(34,197,94,.11);color:#86EFAC}
.p-warn{border-color:rgba(251,191,36,.3);background:rgba(245,158,11,.11);color:#FCD34D}
.p-bad{border-color:rgba(251,113,133,.3);background:rgba(239,68,68,.12);color:#FDA4AF}
.p-info{border-color:rgba(96,165,250,.3);background:rgba(59,130,246,.12);color:#93C5FD}
.p-neu{border-color:#475569;background:#20283A;color:#CBD5E1}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.board>*{min-width:0}
.col{
  min-width:0;
  padding:10px;
  border:1px solid #2C384E;
  border-radius:8px;
  background:#101626;
}
.col .ch{
  margin-bottom:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#DCE5F1;
  font-size:11.5px;
  font-weight:600;
}
.col .ch .cnt{
  padding:1px 7px;
  border:1px solid #3A485E;
  border-radius:999px;
  background:#1A2234;
  color:#C0CCDB;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:7px;
  padding:9px;
  border:1px solid #303C52;
  border-left:2px solid var(--color-accent);
  border-radius:6px;
  background:#171E30;
  box-shadow:0 5px 14px rgba(0,0,0,.14);
}
.tk:last-child{margin-bottom:0}
.tk b{
  display:block;
  color:#E6EDF6;
  font-family:"Fira Code",monospace;
  font-size:11.5px;
  font-weight:500;
}
.tk .m{
  margin-top:5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  flex-wrap:wrap;
  color:#A8B6C9;
  font-size:10.5px;
}
.tl{position:relative;padding-left:22px}
.tl::before{
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:1px;
  background:#3A465C;
  content:"";
}
.tli{position:relative;padding:0 0 16px}
.tli:last-child{padding-bottom:0}
.tli::before{
  position:absolute;
  top:4px;
  left:-20px;
  width:9px;
  height:9px;
  border:2px solid #0E1223;
  border-radius:50%;
  background:#94A3B8;
  box-shadow:0 0 0 2px #475569;
  content:"";
}
.tli.ok::before{background:var(--good);box-shadow:0 0 0 2px rgba(74,222,128,.3)}
.tli.wa::before{background:var(--warn);box-shadow:0 0 0 2px rgba(251,191,36,.3)}
.tli.er::before{background:var(--bad);box-shadow:0 0 0 2px rgba(251,113,133,.3)}
.tli b{color:#E8EEF6;font-size:12px}
.tli .tm{
  color:#97A8BD;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
}
.tli p{margin:3px 0 0;color:#A8B6C9;font-size:11px}
.bar{
  height:7px;
  overflow:hidden;
  border-radius:999px;
  background:#252E42;
}
.bar span{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#16A34A,#4ADE80);
  box-shadow:0 0 8px rgba(34,197,94,.3);
}
.match{
  margin-bottom:8px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #2E3A50;
  border-radius:7px;
  background:#12192A;
}
.match .side{min-width:0;flex:1}
.match .side .t{color:#E3EAF3;font-size:11.5px;font-weight:500}
.match .side .s{margin-top:2px;color:#9DACC0;font-size:10.5px}
.match .link{
  width:35px;
  height:35px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:2px solid rgba(255,255,255,.18);
  border-radius:7px;
  color:#08120C;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  box-shadow:0 0 12px rgba(34,197,94,.08);
}
.list{margin:0;padding:0;list-style:none}
.list li{
  padding:9px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px dashed #38445A;
  color:#C9D4E2;
  font-size:11.5px;
}
.list li:last-child{border-bottom:0}
.stat-row{
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
}
.stat-row .lab{flex:0 0 78px;color:#AAB7C9}
.stat-row .bar{flex:1}
.stat-row .num{
  flex:0 0 auto;
  color:#E8EEF6;
  font-family:"Fira Code",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.note{
  padding:9px 11px;
  border:1px solid #38465D;
  border-left:2px solid #64748B;
  border-radius:6px;
  background:#151C2D;
  color:#B3C0D1;
  font-size:11px;
}
.tag{
  padding:2px 7px;
  display:inline-block;
  border:1px solid rgba(96,165,250,.28);
  border-radius:4px;
  background:rgba(59,130,246,.1);
  color:#93C5FD;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.recon .r{
  padding:8px 3px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid #2A354A;
  color:#C8D2DF;
  font-size:11.5px;
}
.recon .r.tot{
  margin-top:4px;
  padding-top:10px;
  border-top:2px solid var(--color-accent);
  border-bottom:0;
  color:#86EFAC;
  font-weight:600;
}
.recon .r .v{
  color:#E9EFF7;
  font-weight:500;
  text-align:right;
}
.recon .r.tot .v{color:#86EFAC}
@keyframes screen-in{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
@media(max-width:1180px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:8px}
  .brand{min-width:0}
  .nav{
    width:100%;
    margin:0;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .nav button{flex:0 0 auto}
}
@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.g23{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  main{padding:18px 12px 48px}
  .topbar-inner{padding:9px 12px}
  .brand b{font-size:14px}
  .brand small{font-size:8.5px}
  .nav button{min-height:44px;padding:9px 11px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .shead{align-items:flex-start;flex-direction:column}
  .shead h1{font-size:19px}
  .badge{white-space:normal}
  .g4,.board{grid-template-columns:1fr}
  .card{padding:12px}
  .kpi{min-height:104px}
  .match{align-items:stretch;flex-direction:column}
  .match .link{width:auto;height:27px}
  .match .side[style]{text-align:left!important}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #screen{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">account_balance</span></div>
      <div><b>金流核銷智慧站</b><small>Bank Reconciliation &amp; Cash Application</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="系統功能"></nav>
  </div>
</header>
<main><div id="screen"></div></main>
<script>
"use strict";
var accent="#22C55E",accent2="#4ADE80",line="#334155";
var charts={};

Chart.defaults.color="#A8B6C9";
Chart.defaults.borderColor=line;
Chart.defaults.font.family='"Fira Sans", sans-serif';
Chart.defaults.plugins.tooltip.backgroundColor="#111827";
Chart.defaults.plugins.tooltip.titleColor="#F8FAFC";
Chart.defaults.plugins.tooltip.bodyColor="#DCE4F0";
Chart.defaults.plugins.tooltip.borderColor="#475569";
Chart.defaults.plugins.tooltip.borderWidth=1;
Chart.defaults.plugins.tooltip.padding=10;

function destroyCharts(){
  for(var kk in charts){
    try{charts[kk].destroy()}catch(e){}
  }
  charts={};
}
function fmt(n){return(n<0?"-":"")+"NT$"+Math.abs(n).toLocaleString("en-US")}
function kn(n){return n.toLocaleString("en-US")}

var MODS=[
  {icon:"account_tree",name:"對帳單匯入"},
  {icon:"rule",name:"自動比對核銷"},
  {icon:"request_quote",name:"金流核銷入帳"},
  {icon:"fact_check",name:"未明款項調查"},
  {icon:"verified",name:"覆核與拋轉"},
  {icon:"monitoring",name:"餘額調節稽核"}
];

(function(){
  var nav=document.getElementById("nav"),html="";
  for(var i=0;i<MODS.length;i++){
    html+='<button type="button" data-i="'+i+'" onclick="show('+i+')" aria-label="'+MODS[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].icon+'</span><span>'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=html;
})();

function shead(t,d,bi,bt){
  return '<div class="shead"><div><h1>'+t+'</h1><p>'+d+'</p></div><span class="badge"><span class="material-symbols-outlined" aria-hidden="true">'+bi+'</span>'+bt+'</span></div>';
}
function kpi(lab,icon,val,sub,cls){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+lab+'</div><div class="val">'+val+'</div><div class="sub '+(cls||"neu")+'">'+sub+'</div></div>';
}
function pill(txt,cls){return '<span class="pill '+cls+'">'+txt+'</span>'}

function s0(c){
  var banks=[
    {n:"O宏世華 THX",acc:"012-***-4821",ch:"H2H",cnt:342,amt:18240500,st:"完成",cls:"p-good",t:"06:02"},
    {n:"台北富O FSX",acc:"012-***-1907",ch:"API",cnt:288,amt:12980300,st:"完成",cls:"p-good",t:"06:04"},
    {n:"O華信託 CHX",acc:"822-***-6650",ch:"H2H",cnt:401,amt:22610700,st:"完成",cls:"p-good",t:"06:07"},
    {n:"O山銀行 YSX",acc:"808-***-3312",ch:"API",cnt:156,amt:7420900,st:"處理中",cls:"p-warn",t:"—"},
    {n:"首O銀行 SSX",acc:"007-***-9004",ch:"H2H",cnt:97,amt:3115400,st:"待重試",cls:"p-bad",t:"—"}
  ];
  var rows="";
  for(var i=0;i<banks.length;i++){
    var b=banks[i];

function recr(l,v){return '<div class="r"><span>'+l+'</span><span class="v">'+v+'</span></div>'}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  var c=document.getElementById("screen");
  c.style.animation="none";
  c.innerHTML="";
  void c.offsetHeight;
  c.style.animation="";
  (SCREENS[i]||s0)(c);
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
