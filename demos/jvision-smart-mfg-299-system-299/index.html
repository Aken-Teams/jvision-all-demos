<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>集團關係企業管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="集團組織架構、關係人交易檢核、轉投資效益與法定揭露的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#B8E5DF;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --sub:var(--color-muted-foreground);
  --bg:var(--color-background);
  --card:var(--color-card);
  --soft:#DDF8F4;
  --ok:#087F5B;
  --warn:#A65800;
  --bad:#B91C1C;
  --shadow-sm:0 1px 0 rgba(19,78,74,.08),0 5px 14px rgba(19,78,74,.05);
  --shadow-md:0 1px 0 rgba(19,78,74,.10),0 12px 28px rgba(19,78,74,.09);
  --radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Crimson Pro","Noto Sans TC",Georgia,serif;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  width:244px;
  height:100vh;
  flex:0 0 244px;
  background:rgba(255,255,255,.96);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  gap:6px;
  min-width:0;
  backdrop-filter:blur(14px);
}
.brand{
  display:flex;
  gap:11px;
  align-items:center;
  padding:4px 4px 17px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.brand .logo{
  width:40px;
  height:40px;
  border-radius:6px;
  background:var(--color-primary);
  border:1px solid #087E75;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#001F1C;
  flex:0 0 40px;
  box-shadow:4px 4px 0 #99F6E4;
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand h1,.topbar h2,.ch h3{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.03em;line-height:1.15}
.brand p{font-size:11px;margin:3px 0 0;color:var(--sub);letter-spacing:.08em}
.navwrap{display:flex;flex-direction:column;gap:3px}
.navbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
  padding:9px 10px;
  border-radius:6px;
  border:1px solid transparent;
  background:transparent;
  color:#3F5E5B;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:14px;
  font-weight:600;
  text-align:left;
  width:100%;
  min-width:0;
  transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:#E2F8F4;color:#075E57;border-color:#A7E8DE;transform:translateX(2px)}
.navbtn.on{
  background:var(--color-primary);
  color:#001F1C;
  border-color:#087E75;
  box-shadow:3px 3px 0 #99F6E4;
}
.navbtn.on::before{content:"";position:absolute;left:-15px;top:9px;bottom:9px;width:3px;background:var(--color-accent)}
.navnum{
  margin-left:auto;
  font-family:"Cinzel",monospace;
  font-size:10px;
  font-weight:600;
  opacity:.72;
  flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.sidefoot{margin-top:auto;padding:14px 4px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);line-height:1.6;letter-spacing:.03em}
.main{flex:1;min-width:0;padding:22px 26px 38px;max-width:1600px;margin:0 auto}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  margin:-22px -26px 18px;
  padding:19px 26px 13px;
  background:rgba(240,253,250,.92);
  border-bottom:1px solid rgba(94,234,212,.7);
  backdrop-filter:blur(12px);
}
.topbar .tt{min-width:0}
.topbar h2{margin:0;font-size:26px;font-weight:700;line-height:1;letter-spacing:.01em}
.topbar p{margin:5px 0 0;font-size:12px;color:var(--sub);letter-spacing:.035em}
.chip{
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#fff;
  border:1px solid #94D9D0;
  border-radius:4px;
  padding:6px 10px;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
  color:#075E57;
  box-shadow:var(--shadow-sm);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid #D1FAE5;box-shadow:0 0 0 1px var(--ok)}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px;
  min-width:0;
  box-shadow:var(--shadow-sm);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
  animation:card-enter .4s cubic-bezier(.2,.8,.2,1) both;
}
.card:hover{transform:translateY(-2px);border-color:#55CABE;box-shadow:var(--shadow-md)}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:12px;min-height:24px}
.ch .material-symbols-outlined{font-size:19px;color:#087E75}
.ch h3{margin:0;font-size:17px;font-weight:700;line-height:1.1}
.ch .sm{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.03em}
.kpi{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px 15px 12px;
  min-width:0;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
  animation:card-enter .4s cubic-bezier(.2,.8,.2,1) both;
}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}
.kpi:hover{transform:translateY(-2px);border-color:#55CABE;box-shadow:var(--shadow-md)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-20px;bottom:-25px;width:72px;height:72px;border:1px solid #CCFBF1;transform:rotate(45deg)}
.kpi .kl{position:relative;z-index:1;font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:17px;color:#087E75}
.kpi .kv{position:relative;z-index:1;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-size:29px;font-weight:700;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums}
.kpi .kv small{font-family:"Crimson Pro","Noto Sans TC",serif;font-size:12px;font-weight:600;color:var(--sub);margin-left:4px;letter-spacing:0}
.kpi .kd{position:relative;z-index:1;font-size:11px;margin-top:2px;font-weight:600}
.up{color:#067455}.down{color:#B91C1C}.flat{color:#526B68}
.chartbox{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;font-variant-numeric:tabular-nums lining-nums}
thead th{
  text-align:left;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:10px;
  color:#345B57;
  letter-spacing:.045em;
  padding:9px 11px;
  border-top:1px solid var(--line);
  border-bottom:1px solid #7DD3C7;
  background:#E8F7F4;
  white-space:nowrap;
  font-weight:600;
}
tbody td{padding:9px 11px;border-bottom:1px solid #D8EFEB;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
td[style*="text-align:right"],th[style*="text-align:right"]{text-align:right!important}
.num{
  font-family:"Roboto Mono","SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:600;
  letter-spacing:-.02em;
}
.scrollx{overflow-x:auto;border-radius:5px;scrollbar-color:#67CFC3 #E5F5F2;scrollbar-width:thin}
.scrollx:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border-radius:4px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
}
.t-ok{background:#E6F8F0;color:#067455}
.t-warn{background:#FFF4D6;color:#8A4600}
.t-bad{background:#FEECEC;color:#B91C1C}
.t-info{background:#DDF8F4;color:#075E57}
.t-mut{background:#EDF3F4;color:#405B59}
.tree{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px;min-width:520px}
.node{
  background:#fff;
  border:1px solid var(--color-primary);
  border-radius:5px;
  padding:9px 14px;
  text-align:center;
  min-width:150px;
  box-shadow:3px 3px 0 #CCFBF1;
  transition:transform .22s ease,box-shadow .22s ease;
}
.node:hover{transform:translateY(-2px);box-shadow:5px 5px 0 #99F6E4}
.node.root{background:var(--color-primary);color:#001F1C;border-color:#087E75;box-shadow:4px 4px 0 #99F6E4}
.node .nm{font-weight:700;font-size:13px}
.node .pct{font-family:"Cinzel","Noto Sans TC",serif;font-size:10px;margin-top:3px;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
.node.sub{border-color:#48BFB2}
.node.sub .nm{font-size:12.5px}
.connv{width:1px;height:20px;background:#48BFB2}
.lvl{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;min-width:0}
.branch{display:flex;flex-direction:column;align-items:center}
.bar{height:7px;border-radius:2px;background:#E3EEEF;overflow:hidden;min-width:60px;border:1px solid #D4E4E5}
.bar>i{display:block;height:100%;border-radius:1px;background:var(--color-primary);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;min-width:900px}
.col{background:#F3FAF9;border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
.col>.colh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:9px;padding-bottom:7px;border-bottom:2px solid #A6DED7}
.col>.colh .cnt{font-family:"Cinzel",monospace;font-size:10px;color:#345B57;font-weight:600;background:#DDF8F4;border:1px solid #A6DED7;padding:1px 6px;border-radius:3px}
.tk{background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 10px;margin-bottom:8px;box-shadow:2px 2px 0 rgba(13,148,136,.08);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.tk:hover{transform:translateY(-2px);border-color:#55CABE;box-shadow:3px 3px 0 #CCFBF1}
.tk .tkt{font-size:12.5px;font-weight:700;line-height:1.35}
.tk .tkm{font-size:11px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.tk .tkb{border-left:3px solid var(--color-accent);padding-left:8px}
.tl{position:relative;padding-left:26px;min-width:0}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:1px;background:#78CFC5}
.tli{position:relative;padding:0 0 17px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:2px;background:#fff;border:2px solid var(--color-primary);transform:rotate(45deg)}
.tli.done::before{background:var(--color-primary);border-color:#087E75}
.tli.wait::before{border-color:#6D8784;background:#EDF3F4}
.tli .tt2{font-size:13px;font-weight:700}
.tli .td2{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.45}
.gauge{display:flex;flex-direction:column;align-items:center;gap:8px}
.glist{display:flex;flex-direction:column;gap:11px}
.grow{display:flex;align-items:center;gap:10px;min-width:0}
.grow .glab{font-size:12px;font-weight:600;flex:0 0 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .gval{font-family:"Cinzel",monospace;font-size:10px;font-weight:600;flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums}
.grow .bar{flex:1}
.miniLegend{display:flex;flex-wrap:wrap;gap:11px;margin-top:10px;font-size:11.5px;color:var(--sub)}
.miniLegend span{display:inline-flex;align-items:center;gap:6px}
.miniLegend i{width:9px;height:9px;border-radius:1px;display:inline-block;border:1px solid rgba(19,78,74,.16)}
.note{
  background:#FFF9E8;
  border:1px solid #E8B85F;
  border-left:4px solid var(--color-accent);
  border-radius:5px;
  padding:10px 12px;
  font-size:12px;
  color:#704000;
  line-height:1.55;
  display:flex;
  gap:9px;
}
.note .material-symbols-outlined{font-size:18px;flex:0 0 auto;color:#8A4B00}
@keyframes card-enter{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr)}
}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{position:relative;width:100%;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:11px 14px;border-right:none;border-bottom:1px solid var(--line);gap:8px}
  .brand{border-bottom:none;padding:0;margin:0;flex:1 1 auto;min-width:180px}
  .navwrap{flex-direction:row;flex-wrap:nowrap;width:100%;order:3;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:thin}
  .navbtn{width:auto;flex:0 0 auto;min-height:42px}
  .navbtn.on::before{left:8px;right:8px;top:auto;bottom:-3px;width:auto;height:3px}
  .navnum{display:none}
  .sidefoot{display:none}
  .main{padding:17px 15px 32px;width:100%}
  .topbar{position:relative;top:auto;margin:-17px -15px 15px;padding:15px;background:rgba(240,253,250,.96)}
}
@media(max-width:720px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr;min-width:640px}
  .topbar h2{font-size:23px}
  .card{padding:13px}
}
@media(max-width:480px){
  .brand .logo{width:36px;height:36px;flex-basis:36px}
  .brand h1{font-size:15px}
  .navbtn{padding:9px 11px}
  .navbtn .nlab{display:none}
  .navbtn .material-symbols-outlined{font-size:21px}
  .chip{width:100%;margin-left:0;justify-content:center}
  .kpi .kv{font-size:27px}
  .grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px}
  .grow .glab{flex:auto;width:auto}
  .grow .bar{grid-column:1/2;width:100%}
  .grow .gval{grid-column:2/3;grid-row:2/3}
  .grow>div:last-child{grid-column:2/3;grid-row:1/2}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .card,.kpi{animation:none!important}
}
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
        <div>
          <h1>集團關係企業</h1>
          <p>管理系統 · BI 平台</p>
        </div>
      </div>
      <nav class="navwrap" id="nav"></nav>
      <div class="sidefoot">
        資料倉儲 · 多源整合<br/>2026 財務年度 · Demo 資料
      </div>
    </aside>
    <main class="main">
      <div class="topbar" id="topbar"></div>
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var accent="#0D9488", accent2="#2DD4BF", grid="#B8E5DF", subInk="#475569";
    var charts={};

    var MODS=[
      {icon:"account_tree",  name:"集團組織架構", sub:"母子公司持股比例圖與層級關係"},
      {icon:"receipt_long",  name:"關係人交易登錄", sub:"關係人交易建檔與交易明細維護"},
      {icon:"fact_check",    name:"交易合理性檢核", sub:"價格與條件合理性自動比對檢核"},
      {icon:"trending_up",   name:"轉投資效益分析", sub:"轉投資損益與回收效益追蹤"},
      {icon:"gavel",         name:"法定文件產出", sub:"揭露報表與法定文件自動彙整"},
      {icon:"verified",      name:"申報揭露追蹤", sub:"法定申報進度與揭露完整率監控"}
    ];

    function el(id){return document.getElementById(id);}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
    function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}

    function kpi(o){
      var cls=o.dir==="up"?"up":o.dir==="down"?"down":"flat";
      var arrow=o.dir==="up"?"▲":o.dir==="down"?"▼":"–";
      return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+o.icon+'</span>'+esc(o.label)+'</div>'+
        '<div class="kv">'+esc(o.val)+(o.unit?'<small>'+esc(o.unit)+'</small>':'')+'</div>'+
        '<div class="kd '+cls+'">'+arrow+' '+esc(o.delta)+'</div></div>';
    }
    function chartBox(id,h){return '<div class="chartbox" style="height:'+h+'px"><canvas id="'+id+'"></canvas></div>';}

    /* ---------- SCREEN 0 : 集團組織架構 ---------- */

         kpi({icon:"forum",label:"待申報項目",val:"3",unit:"項",dir:"down",delta:"本期剩餘"}),
         kpi({icon:"error",label:"逾期風險",val:"1",unit:"項",dir:"flat",delta:"合併財報附註"})].join("")+'</div>'+
        '<div class="grid g23">'+
          '<div class="card"><div class="ch"><span class="material-symbols-outlined">checklist</span><h3>各法定申報項目進度</h3><span class="sm">本申報期</span></div>'+
            '<div class="glist" style="margin-top:6px">'+glist+'</div>'+
            '<div style="height:14px"></div><div class="ch"><span class="material-symbols-outlined">donut_small</span><h3>整體揭露完整率</h3></div>'+chartBox("c5a",200)+
          '</div>'+
          '<div class="card"><div class="ch"><span class="material-symbols-outlined">history</span><h3>申報作業時程</h3></div>'+
            '<div class="tl" style="margin-top:6px">'+tl+'</div>'+
          '</div>'+
        '</div>';
    }
    function init5(){
      var c=el("c5a"); if(!c)return;
      charts.c5a=new Chart(c,{type:"doughnut",data:{labels:["已揭露","待補","逾期"],
        datasets:[{data:[92,7,1],backgroundColor:[accent,accent2,"#dc2626"],borderWidth:2,borderColor:"#fff"}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"66%",plugins:{legend:{position:"bottom",labels:{color:subInk,font:{size:11},boxWidth:12,padding:14}}}}});
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];
    var INITS=[init0,init1,init2,init3,null,init5];

    /* build nav */
    var nav=el("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="nlab">'+esc(m.name)+'</span><span class="navnum">0'+(i+1)+'</span></button>';
    }).join("");
    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]"); if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function show(i){
      destroyCharts();
      var m=MODS[i];
      el("topbar").innerHTML='<div class="tt"><h2>'+esc(m.name)+'</h2><p>'+esc(m.sub)+'</p></div>'+
        '<div class="chip"><span class="dot"></span>系統連線正常</div>';
      var host=el("screen");
      host.innerHTML=SCREENS[i]();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
      void host.offsetHeight;
      if(INITS[i]) INITS[i]();
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
<script src="/shared/jv-agent-bridge.js?v=2" defer></script>
</body>
