<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>集團關係企業管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="集團組織架構、關係人交易檢核、轉投資效益與法定揭露的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#1d4ed8; --accent2:#60a5fa; --ink:#0f172a; --sub:#64748b;
      --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff; --soft:#eff6ff;
      --ok:#059669; --warn:#d97706; --bad:#dc2626;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .layout{display:flex;min-height:100vh;align-items:stretch}
    .sidebar{
      width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:20px 16px;gap:6px;min-width:0;
    }
    .brand{display:flex;gap:12px;align-items:center;padding:6px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
    .brand .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 42px}
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
    .brand p{font-size:11px;margin:2px 0 0;color:var(--sub)}
    .navwrap{display:flex;flex-direction:column;gap:4px}
    .navbtn{
      display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
      border:1px solid transparent;background:transparent;color:var(--sub);cursor:pointer;
      font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;min-width:0;
      transition:background .15s,color .15s;
    }
    .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
    .navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .navbtn:hover{background:var(--soft);color:var(--accent)}
    .navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.28)}
    .navnum{margin-left:auto;font-size:11px;font-weight:700;opacity:.6;flex:0 0 auto}
    .sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);line-height:1.6}
    .main{flex:1;min-width:0;padding:26px 30px 40px;max-width:100%}
    .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
    .topbar .tt{min-width:0}
    .topbar h2{margin:0;font-size:21px;font-weight:800}
    .topbar p{margin:4px 0 0;font-size:12.5px;color:var(--sub)}
    .chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--accent)}
    .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(5,150,105,.15)}

    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:2fr 1fr}
    .g32{grid-template-columns:1fr 2fr}

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
    .card.pad0{padding:0;overflow:hidden}
    .ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .ch .material-symbols-outlined{font-size:20px;color:var(--accent)}
    .ch h3{margin:0;font-size:14.5px;font-weight:800}
    .ch .sm{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:600}

    .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
    .kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent)}
    .kpi .kv{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.5px}
    .kpi .kv small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px}
    .kpi .kd{font-size:11.5px;margin-top:6px;font-weight:700}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--sub)}

    .chartbox{position:relative;width:100%;overflow:hidden}

    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
    thead th{text-align:left;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;padding:11px 12px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap;font-weight:700}
    tbody td{padding:11px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover{background:#f8fafc}
    .num{font-variant-numeric:tabular-nums;font-weight:700}
    .scrollx{overflow-x:auto;border-radius:12px}

    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
    .t-ok{background:#ecfdf5;color:var(--ok)}
    .t-warn{background:#fffbeb;color:var(--warn)}
    .t-bad{background:#fef2f2;color:var(--bad)}
    .t-info{background:var(--soft);color:var(--accent)}
    .t-mut{background:#f1f5f9;color:var(--sub)}

    /* org tree signature */
    .tree{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px;min-width:520px}
    .node{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:10px 16px;text-align:center;min-width:150px;box-shadow:0 6px 16px rgba(29,78,216,.12)}
    .node.root{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
    .node .nm{font-weight:800;font-size:13.5px}
    .node .pct{font-size:11px;margin-top:3px;font-weight:700;opacity:.9}
    .node.sub{border-color:var(--accent2);border-width:1px}
    .node.sub .nm{font-size:12.5px}
    .connv{width:2px;height:22px;background:var(--accent2)}
    .lvl{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;min-width:0}
    .branch{display:flex;flex-direction:column;align-items:center}

    .bar{height:8px;border-radius:999px;background:#eef2f7;overflow:hidden;min-width:60px}
    .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
    .col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
    .col > .colh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:10px}
    .col > .colh .cnt{font-size:11px;color:var(--sub);font-weight:700}
    .tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 2px 6px rgba(15,23,42,.04)}
    .tk .tkt{font-size:12.5px;font-weight:700;line-height:1.4}
    .tk .tkm{font-size:11px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
    .tk .tkb{border-left:3px solid var(--accent2);padding-left:8px}

    /* timeline */
    .tl{position:relative;padding-left:26px;min-width:0}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 18px 0}
    .tli:last-child{padding-bottom:0}
    .tli::before{content:"";position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
    .tli.done::before{background:var(--accent);border-color:var(--accent)}
    .tli.wait::before{border-color:var(--line)}
    .tli .tt2{font-size:13px;font-weight:800}
    .tli .td2{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}

    .gauge{display:flex;flex-direction:column;align-items:center;gap:8px}
    .glist{display:flex;flex-direction:column;gap:12px}
    .grow{display:flex;align-items:center;gap:12px;min-width:0}
    .grow .glab{font-size:12px;font-weight:700;flex:0 0 110px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .grow .gval{font-size:12px;font-weight:800;flex:0 0 auto;font-variant-numeric:tabular-nums}
    .grow .bar{flex:1}

    .miniLegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--sub)}
    .miniLegend span{display:inline-flex;align-items:center;gap:6px}
    .miniLegend i{width:10px;height:10px;border-radius:3px;display:inline-block}

    .note{background:var(--soft);border:1px solid #dbeafe;border-radius:12px;padding:12px 14px;font-size:12px;color:#1e40af;line-height:1.6;display:flex;gap:10px}
    .note .material-symbols-outlined{font-size:19px;flex:0 0 auto}

    @media(max-width:860px){
      .layout{flex-direction:column}
      .sidebar{width:100%;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;border-right:none;border-bottom:1px solid var(--line);gap:8px}
      .brand{border-bottom:none;padding:0;margin:0;flex:1 1 auto;min-width:180px}
      .navwrap{flex-direction:row;flex-wrap:wrap;width:100%;order:3}
      .navbtn{width:auto;flex:0 0 auto}
      .navnum{display:none}
      .sidefoot{display:none}
      .main{padding:18px 16px 34px}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
    }
    @media(max-width:560px){
      .navbtn .nlab{display:none}
      .navbtn{padding:9px 11px}
      .board{grid-template-columns:1fr}
      .topbar h2{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
        <div>
          <h1>集團關係企業</h1>
          <p>管理系統 · BI 平台</p>
        </div>
      </div>
      <nav class="navwrap" id="nav"></nav>
      <div class="sidefoot">
        資料倉儲 · 多源整合<br/>2026 財務年度 · Demo 資料
      </div>
    </aside>
    <main class="main">
      <div class="topbar" id="topbar"></div>
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var accent="#1d4ed8", accent2="#60a5fa", grid="#e2e8f0", subInk="#64748b";
    var charts={};

    var MODS=[
      {icon:"account_tree",  name:"集團組織架構", sub:"母子公司持股比例圖與層級關係"},
      {icon:"receipt_long",  name:"關係人交易登錄", sub:"關係人交易建檔與交易明細維護"},
      {icon:"fact_check",    name:"交易合理性檢核", sub:"價格與條件合理性自動比對檢核"},
      {icon:"trending_up",   name:"轉投資效益分析", sub:"轉投資損益與回收效益追蹤"},
      {icon:"gavel",         name:"法定文件產出", sub:"揭露報表與法定文件自動彙整"},
      {icon:"verified",      name:"申報揭露追蹤", sub:"法定申報進度與揭露完整率監控"}
    ];

    function el(id){return document.getElementById(id);}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
    function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}

    function kpi(o){
      var cls=o.dir==="up"?"up":o.dir==="down"?"down":"flat";
      var arrow=o.dir==="up"?"▲":o.dir==="down"?"▼":"–";
      return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+o.icon+'</span>'+esc(o.label)+'</div>'+
        '<div class="kv">'+esc(o.val)+(o.unit?'<small>'+esc(o.unit)+'</small>':'')+'</div>'+
        '<div class="kd '+cls+'">'+arrow+' '+esc(o.delta)+'</div></div>';
    }
    function chartBox(id,h){return '<div class="chartbox" style="height:'+h+'px"><canvas id="'+id+'"></canvas></div>';}

    /* ---------- SCREEN 0 : 集團組織架構 ---------- */
    function s0(){
      var kpis=[
        {icon:"apartment",label:"集團成員公司",val:"18",unit:"家",dir:"up",delta:"本季 +2 家"},
        {icon:"layers",label:"組織層級",val:"4",unit:"層",dir:"flat",delta:"與上季持平"},
        {icon:"pie_chart",label:"平均持股比例",val:"71.4",unit:"%",dir:"up",delta:"較上季 +3.2%"},
        {icon:"public",label:"跨境據點",val:"5",unit:"地",dir:"up",delta:"新增 越南廠"}
      ];
      var subs=[
        {nm:"睿群電子(股)",pct:"持股 100%",loc:"台灣·新竹"},
        {nm:"睿群精密(股)",pct:"持股 85%",loc:"台灣·台中"},
        {nm:"Ruiqun HK Ltd.",pct:"持股 78%",loc:"香港"},
        {nm:"睿群越南責任公司",pct:"持股 60%",loc:"越南·北寧"}
      ];
      var grandkids=[
        {nm:"睿群蘇州科技",pct:"間接 54.6%"},
        {nm:"睿群材料(股)",pct:"間接 68.0%"}
      ];
      var tree='<div class="scrollx"><div class="tree">'+
        '<div class="node root"><div class="nm">睿群控股(股)公司</div><div class="pct">集團母公司 · 上市</div></div>'+
        '<div class="connv"></div>'+
        '<div class="lvl">'+subs.map(function(s){
          return '<div class="branch"><div class="node"><div class="nm">'+esc(s.nm)+'</div><div class="pct">'+esc(s.pct)+'</div></div></div>';
        }).join("")+'</div>'+
        '<div class="connv"></div>'+
        '<div class="lvl">'+grandkids.map(function(g){
          return '<div class="node sub"><div class="nm">'+esc(g.nm)+'</div><div class="pct">'+esc(g.pct)+'</div></div>';
        }).join("")+'</div>'+
        '</div></div>';

      return '<div class="grid g4" style="margin-bottom:16px">'+kpis.map(kpi).join("")+'</div>'+
        '<div class="grid g23">'+
          '<div class="card"><div class="ch"><span class="material-symbols-outlined">account_tree</span><h3>集團持股架構圖</h3><span class="sm">2026/08 版本</span></div>'+tree+
            '<div class="note" style="margin-top:14px"><span class="material-symbols-outlined">info</span><div>間接持股 = 母公司對子公司持股 × 子公司對孫公司持股，系統自動計算最終受益比例，供法定揭露引用。</div></div>'+
          '</div>'+
          '<div class="card"><div class="ch"><span class="material-symbols-outlined">donut_large</span><h3>各層級資本額占比</h3></div>'+
            chartBox("c0a",230)+
            '<div class="miniLegend"><span><i style="background:'+accent+'"></i>母公司</span><span><i style="background:'+accent2+'"></i>直接子公司</span><span><i style="background:#93c5fd"></i>孫公司</span></div>'+
          '</div>'+
        '</div>';
    }
    function init0(){
      var c=el("c0a"); if(!c)return;
      charts.c0a=new Chart(c,{type:"doughnut",data:{labels:["母公司","直接子公司","孫公司"],
        datasets:[{data:[42,38,20],backgroundColor:[accent,accent2,"#93c5fd"],borderWidth:2,borderColor:"#fff"}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});
    }

    /* ---------- SCREEN 1 : 關係人交易登錄 ---------- */
    function s1(){
      var rows=[
        {id:"RPT-2608-041",cp:"睿群精密(股)",type:"貨品採購",amt:"12,480,000",date:"2026/08/03",owner:"陳映蓉",st:"已登錄",cls:"t-ok"},
        {id:"RPT-2608-042",cp:"Ruiqun HK Ltd.",type:"資金貸與",amt:"30,000,000",date:"2026/08/05",owner:"林柏宏",st:"待補件",cls:"t-warn"},
        {id:"RPT-2608-043",cp:"睿群越南責任公司",type:"技術授權",amt:"4,650,000",date:"2026/08/06",owner:"王思婷",st:"已登錄",cls:"t-ok"},
        {id:"RPT-2608-044",cp:"睿群材料(股)",type:"設備租賃",amt:"1,920,000",date:"2026/08/08",owner:"陳映蓉",st:"審核中",cls:"t-info"},
        {id:"RPT-2608-045",cp:"睿群蘇州科技",type:"貨品銷售",amt:"18,730,000",date:"2026/08/09",owner:"張哲維",st:"已登錄",cls:"t-ok"},
        {id:"RPT-2608-046",cp:"睿群電子(股)",type:"背書保證",amt:"25,000,000",date:"2026/08/11",owner:"林柏宏",st:"待補件",cls:"t-warn"}
      ];
      var trows=rows.map(function(r){
        return '<tr><td class="num">'+esc(r.id)+'</td><td>'+esc(r.cp)+'</td><td><span class="tag t-mut">'+esc(r.type)+'</span></td>'+
          '<td class="num" style="text-align:right">'+esc(r.amt)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.owner)+'</td>'+
          '<td><span class="tag '+r.cls+'">'+esc(r.st)+'</span></td></tr>';
      }).join("");
      return '<div class="grid g4" style="margin-bottom:16px">'+
        [kpi({icon:"receipt_long",label:"本月登錄筆數",val:"46",unit:"筆",dir:"up",delta:"較上月 +9 筆"}),
         kpi({icon:"pending_actions",label:"待補件",val:"7",unit:"筆",dir:"down",delta:"清理中 -3"}),
         kpi({icon:"payments",label:"交易總金額",val:"3.42",unit:"億",dir:"up",delta:"季內累計"}),
         kpi({icon:"groups",label:"往來關係人",val:"11",unit:"家",dir:"flat",delta:"與上月持平"})].join("")+'</div>'+
        '<div class="grid g23">'+
          '<div class="card pad0"><div class="ch" style="padding:16px 18px 0"><span class="material-symbols-outlined">table_rows</span><h3>關係人交易登錄清單</h3><span class="sm">2026 年 8 月</span></div>'+
            '<div class="scrollx" style="margin:12px"><table><thead><tr><th>交易編號</th><th>關係人</th><th>交易類型</th><th style="text-align:right">金額(元)</th><th>登錄日</th><th>登錄人</th><th>狀態</th></tr></thead><tbody>'+trows+'</tbody></table></div>'+
          '</div>'+
          '<div class="card"><div class="ch"><span class="material-symbols-outlined">stacked_bar_chart</span><h3>交易類型金額分佈</h3></div>'+
            chartBox("c1a",250)+
          '</div>'+
        '</div>';
    }
    function init1(){
      var c=el("c1a"); if(!c)return;
      charts.c1a=new Chart(c,{type:"bar",data:{labels:["貨品採購","貨品銷售","資金貸與","背書保證","技術授權","設備租賃"],
        datasets:[{label:"金額(百萬)",data:[124.8,187.3,300,250,46.5,19.2],backgroundColor:accent,borderRadius:6,maxBarThickness:26}]},
        options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{x:{grid:{color:grid},ticks:{color:subInk}},y:{grid:{display:false},ticks:{color:subInk,font:{size:11}}}}}});
    }

    /* ---------- SCREEN 2 : 交易合理性檢核 ---------- */
    function s2(){
      var checks=[
        {id:"RPT-2608-045",cp:"睿群蘇州科技",base:"市場行情",dev:"+2.1%",res:"合理",cls:"t-ok",note:"單價落於同業區間內"},

          '<div class="gval">'+f.p+'%</div><div style="flex:0 0 auto"><span class="tag '+f.cls+'">'+esc(f.st)+'</span></div></div>';

        return '<div class="tli '+s.c+'"><div class="tt2">'+esc(s.t)+'</div><div class="td2">'+esc(s.d)+'</div></div>';

         kpi({icon:"error",label:"逾期風險",val:"1",unit:"項",dir:"flat",delta:"合併財報附註"})].join("")+'</div>'+
        '<div class="grid g23">'+
          '<div class="card"><div class="ch"><span class="material-symbols-outlined">checklist</span><h3>各法定申報項目進度</h3><span class="sm">本申報期</span></div>'+

    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];
    var INITS=[init0,init1,init2,init3,null,init5];

    /* build nav */
    var nav=el("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="nlab">'+esc(m.name)+'</span><span class="navnum">0'+(i+1)+'</span></button>';
    }).join("");
    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]"); if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function show(i){
      destroyCharts();
      var m=MODS[i];
      el("topbar").innerHTML='<div class="tt"><h2>'+esc(m.name)+'</h2><p>'+esc(m.sub)+'</p></div>'+
        '<div class="chip"><span class="dot"></span>系統連線正常</div>';
      var host=el("screen");
      host.innerHTML=SCREENS[i]();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
      void host.offsetHeight;
      if(INITS[i]) INITS[i]();
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}

  })();
