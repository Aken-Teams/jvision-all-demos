<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>委外代工採購管理系統</title>
<meta name="description" content="委外訂單、供料出庫、委外工序追蹤、回廠驗收到費用結算的單一平台">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#047857;
  --ok-bg:#ecfdf5;
  --warn:#9a3412;
  --warn-bg:#fff7ed;
  --bad:#b91c1c;
  --bad-bg:#fef2f2;
  --blue-bg:#eff6ff;
  --shadow:0 10px 28px rgba(15,23,42,.06);
  --shadow-hover:0 16px 34px rgba(15,23,42,.1);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:1.25rem;line-height:1;font-feature-settings:"liga";vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topbar-in{width:min(1440px,100%);margin:auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:6px;box-shadow:4px 4px 0 #bfdbfe}
.brand h1{margin:0;font-size:1rem;line-height:1.25;letter-spacing:.01em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:.72rem}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;padding:3px}
.nav button{min-height:42px;display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-size:.78rem;font-weight:600;white-space:nowrap;transition:background-color .2s,border-color .2s,color .2s,transform .2s}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 12px rgba(37,99,235,.2)}
.wrap{width:min(1440px,100%);margin:auto;padding:32px 24px 56px}
.screen{animation:reveal .35s ease-out both}
.screen-head{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;margin-bottom:24px;padding:22px 24px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:7px;box-shadow:var(--shadow)}
.screen-head .hi{width:48px;height:48px;display:grid;place-items:center;border-radius:5px;background:var(--blue-bg);color:var(--blue)}
.screen-head .hi .material-symbols-outlined{font-size:1.55rem}
.screen-head h2{margin:0;font-size:clamp(1.25rem,2vw,1.65rem);letter-spacing:-.025em;line-height:1.2}
.screen-head p{margin:6px 0 0;color:var(--muted);font-size:.87rem}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 13px;border:1px solid #fdba74;border-radius:5px;background:#fff7ed;color:#9a3412;font-size:.78rem;font-weight:700;white-space:nowrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.col-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.col-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.section-gap{margin-bottom:16px}
.card,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow)}
.card{padding:20px}
.card-t{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:.92rem;font-weight:700}
.card-t>.material-symbols-outlined{color:var(--blue)}
.card-t small{margin-left:auto;color:var(--muted);font-size:.72rem;font-weight:500}
.kpi{position:relative;overflow:hidden;padding:18px 18px 17px;transition:transform .22s,box-shadow .22s,border-color .22s}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.kpi:hover{transform:translateY(-2px);border-color:#bfdbfe;box-shadow:var(--shadow-hover)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.76rem;font-weight:500}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:1.05rem}
.kpi .val{margin-top:8px;font-family:"Fira Code",monospace;font-size:clamp(1.45rem,2.4vw,1.85rem);font-weight:700;letter-spacing:-.04em}
.kpi .val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:.75rem;letter-spacing:0}
.kpi .dl{margin-top:5px;font-size:.7rem;font-weight:600}
.up{color:var(--ok)}
.down{color:var(--bad)}
.chart{width:100%;height:280px}
.chart.sm{height:230px}
.tbl-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:.8rem}
th{padding:11px 13px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;color:#334155;text-align:left;font-size:.69rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
td{padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
th:nth-last-child(-n+4),td:nth-last-child(-n+4){font-variant-numeric:tabular-nums}
td.mono,td.num,.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
td.num{text-align:right}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid currentColor;border-radius:4px;font-size:.68rem;font-weight:700;white-space:nowrap}
.bdg:before{font-family:"Material Symbols Outlined";font-size:.85rem;font-weight:400}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-ok:before{content:"check_circle"}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-warn:before{content:"warning"}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-bad:before{content:"error"}
.b-blue{background:var(--blue-bg);color:#1d4ed8}
.b-blue:before{content:"schedule"}
.b-gray{background:#f1f5f9;color:#475569}
.b-gray:before{content:"pause_circle"}
.b-rose{background:#fff7ed;color:#9a3412}
.b-rose:before{content:"approval"}
.meter{height:7px;overflow:hidden;border-radius:2px;background:#e2e8f0}
.meter i{display:block;height:100%;background:var(--blue)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.li{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:5px;background:var(--blue-bg);color:var(--blue)}
.li .material-symbols-outlined{font-size:1.1rem}
.lg{flex:1}
.lg .a{font-size:.8rem;font-weight:600}
.lg .b,.sub{color:var(--muted);font-size:.7rem}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;min-width:1100px;padding:12px;background:#f1f5f9}
.bcol{padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:5px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:3px 4px 12px;font-size:.78rem;font-weight:700}
.dot{width:9px;height:9px;flex:none;border-radius:2px}
.cnt{margin-left:auto;min-width:24px;padding:1px 7px;background:#fff;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:.66rem;text-align:center}
.ktile{margin-bottom:9px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:5px;box-shadow:0 2px 5px rgba(15,23,42,.04);transition:transform .22s,border-color .22s,box-shadow .22s}
.ktile:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 8px 18px rgba(37,99,235,.1)}
.ktile .no{color:var(--muted);font-family:"Fira Code",monospace;font-size:.68rem;font-weight:600}
.ktile .nm{margin:4px 0 9px;font-size:.8rem;font-weight:700}
.ktile .mt,.kfoot{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.68rem}
.ktile .mt .material-symbols-outlined{font-size:.9rem}
.kfoot{justify-content:space-between;margin-top:10px}
.av{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;background:var(--blue-bg);color:#1d4ed8;font-family:"Fira Code",monospace;font-size:.62rem;font-weight:700}
.dot-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.dot-legend span{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;background:#fff;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:.72rem}
.dot-legend i{width:9px;height:9px;border-radius:2px}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;background:#fff;border:3px solid var(--blue);border-radius:50%}
.tl-i.done:before{background:var(--blue)}
.tl-i .tm{color:#1d4ed8;font-family:"Fira Code",monospace;font-size:.67rem;font-weight:600}
.tl-i .tt{font-size:.79rem;font-weight:700}
.tl-i .td{color:var(--muted);font-size:.7rem}
.tag{display:inline-block;padding:3px 7px;background:#f1f5f9;border:1px solid var(--line);border-radius:3px;color:#334155;font-family:"Fira Code",monospace;font-size:.66rem;font-weight:600}
.foot{padding:0 20px 28px;color:var(--muted);font-size:.72rem;text-align:center}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .topbar-in{align-items:flex-start;flex-direction:column;gap:9px}
  .nav{width:100%;margin:0}
  .g4{grid-template-columns:repeat(2,1fr)}
  .col-2-1,.col-1-2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar-in,.wrap{padding-left:16px;padding-right:16px}
  .wrap{padding-top:20px}
  .screen-head{grid-template-columns:auto 1fr;padding:18px}
  .screen-head .pill{grid-column:1/-1;width:max-content}
  .g2{grid-template-columns:1fr}
}
@media(max-width:480px){
  .brand p{display:none}
  .nav button{min-width:42px;justify-content:center}
  .nav .txt{display:none}
  .g4{grid-template-columns:1fr}
  .card{padding:15px}
  .screen-head{align-items:start}
  .screen-head .hi{width:42px;height:42px}
  .chart{height:250px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important;transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><h1>委外代工採購管理</h1><p>供料 · 委外工序 · 回廠驗收 · 費用結算</p></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>
<footer class="foot">純 UI 展示頁 · 擬真示範資料 · 與專案詳細頁功能模組與運作流程一致</footer>
<script>
var CH={};
var NAV=[
  {i:0,icon:"dashboard",label:"委外看板總覽"},
  {i:1,icon:"receipt_long",label:"委外訂單管理"},
  {i:2,icon:"inventory_2",label:"供料出庫管理"},
  {i:3,icon:"account_tree",label:"委外工序追蹤"},
  {i:4,icon:"fact_check",label:"回廠驗收管理"},
  {i:5,icon:"request_quote",label:"損耗與費用結算"}
];
function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function disposeAll(){Object.keys(CH).forEach(function(k){try{CH[k].dispose()}catch(e){}});CH={}}
function mk(id){var d=document.getElementById(id);if(!d)return null;var c=echarts.init(d);CH[id]=c;return c}
function head(ic,title,sub,pill){return '<section class="screen"><div class="screen-head"><div class="hi">'+icon(ic)+'</div><div><h2>'+title+'</h2><p>'+sub+'</p></div><span class="pill">'+icon(pill.ic)+pill.t+'</span></div>'}
function end(){return "</section>"}
function kpi(lab,ic,val,unit,dl,cls){return '<article class="kpi"><div class="lab">'+icon(ic)+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+(dl?'<div class="dl '+(cls||"")+'">'+dl+'</div>':"")+'</article>'}
function bdg(cls,t){return '<span class="bdg '+cls+'">'+t+'</span>'}
function meter(p){return '<div class="meter" role="meter" aria-label="負荷 '+p+'%" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>'}
function card(title,small,body){return '<div class="card"><div class="card-t">'+title+(small?'<small>'+small+'</small>':'')+'</div>'+body+'</div>'}
function chart(id,sm){return '<div id="'+id+'" class="chart'+(sm?' sm':'')+'" role="img" aria-label="資料圖表"></div>'}
function plants(){
  var d=[["鴻昌精密加工","CNC 車銑",14,92],["永順表面處理","陽極/電鍍",11,78],["大立熱處理","真空熱處理",9,64],["O泰沖壓","精密沖壓",7,55],["昱豐塑膠射出","射出成型",6,41]];
  return d.map(function(r){return '<div class="lrow"><div class="li">'+icon("factory")+'</div><div class="lg"><div class="a">'+r[0]+'</div><div class="b">'+r[1]+' · 在製 '+r[2]+' 張</div></div><div style="width:34%;min-width:90px">'+meter(r[3])+'<div class="sub" style="text-align:right;margin-top:3px">負荷 '+r[3]+'%</div></div></div>'}).join("")
}
function alerts(){
  var d=[
    ["OS-24098","鴻昌精密加工","交期剩 1 天，工序未回報","b-bad","逾期風險"],
    ["OS-24072","永順表面處理","供料領用差異 3.2%，待對帳","b-warn","對帳異常"],
    ["OS-24051","大立熱處理","回廠檢驗不良率 4.1%","b-warn","品質異常"],
    ["OS-24110","昱豐塑膠射出","單一委外來源，需經理核准","b-rose","核准阻擋"],
    ["OS-24033","O泰沖壓","加工費高於參考價 9%","b-bad","價格異常"]
  ];
  return d.map(function(r){return '<div class="lrow"><div class="li" style="background:var(--bad-bg);color:var(--bad)">'+icon("priority_high")+'</div><div class="lg"><div class="a mono">'+r[0]+' · '+r[1]+'</div><div class="b">'+r[2]+'</div></div>'+bdg(r[3],r[4])+'</div>'}).join("")
}
function s0(){
  return head("dashboard","委外看板總覽","即時掌握委外訂單狀態、交期風險與各廠負荷",{ic:"monitoring",t:"即時營運"})+
  '<div class="grid g4 section-gap">'+
  kpi("進行中委外單","account_tree","48","張","本週新增 12 張","up")+
  kpi("委外準時交貨率","task_alt","94.2","%","▲ 較上月 +3.1%","up")+
  kpi("在外料帳金額","inventory_2","¥ 2.86M","","32 張未回帳","")+
  kpi("委外損耗率","science","1.7","%","▼ 較目標 -0.3%","up")+"</div>"+
  '<div class="grid col-2-1 section-gap">'+card(icon("monitoring")+"委外交貨與損耗趨勢","近 6 週",chart("c0a"))+card(icon("account_tree")+"委外訂單狀態分佈","共 88 張",chart("c0b"))+"</div>"+
  '<div class="grid col-1-2">'+card(icon("factory")+"委外廠負荷 TOP5","在製工單數",plants())+card(icon("warning")+"交期與異常預警","需優先處理",alerts())+"</div>"+end()
}
function rulesList(){
  var d=[
    ["交期不足","需求日落在委外廠標準交期內 → 標記缺料風險","b-warn"],
    ["價格異常","加工費高於參考價 8% 以上 → 須說明原因","b-bad"],
    ["單一來源","單一委外來源且影響生產 → 供應鏈經理核准","b-rose"]
  ];
  return d.map(function(r){return '<div class="lrow"><div class="li">'+icon("rule")+'</div><div class="lg"><div class="a">'+r[0]+'</div><div class="b">'+r[1]+'</div></div>'+bdg(r[2],"啟用")+'</div>'}).join("")
}
function ordersTbl(){
  var rows=[
    ["OS-24110","精密軸承座","CNC 車銑","昱豐塑膠射出",1200,"08/16","待核准","b-rose"],
    ["OS-24098","傳動齒輪","滾齒加工","鴻昌精密加工",800,"08/15","加工中","b-blue"],
    ["OS-24095","外殼組件","陽極處理","永順表面處理",2400,"08/17","已下單","b-ok"],
    ["OS-24088","連桿","真空熱處理","大立熱處理",600,"08/18","已下單","b-ok"],
    ["OS-24072","支架","精密沖壓","O泰沖壓",3000,"08/16","加工中","b-blue"],
    ["OS-24051","端蓋","射出成型","昱豐塑膠射出",1500,"08/14","逾期","b-bad"]
  ];
  return '<div class="tbl-wrap"><table><thead><tr><th>委外單號</th><th>品名</th><th>委外工序</th><th>委外廠</th><th>數量</th><th>交期</th><th>狀態</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="num">'+r[4].toLocaleString("zh-TW")+'</td><td class="mono">'+r[5]+'</td><td>'+bdg(r[7],r[6])+'</td></tr>'}).join("")+'</tbody></table></div>'
}
function s1(){
  return head("receipt_long","委外訂單管理","開立委外工單、指派委外廠、約定加工單價與交期",{ic:"add_task",t:"新增委外單"})+
  '<div class="grid g4 section-gap">'+kpi("本月委外單","receipt_long","136","張","","")+kpi("待核准","gavel","5","張","單一來源需經理核准","down")+kpi("平均加工單價","request_quote","¥ 38.6","/件","▼ 議價後 -6%","up")+kpi("平均約定交期","calendar_month","6.4","天","標準內","")+"</div>"+
  '<div class="grid col-2-1 section-gap">'+card(icon("request_quote")+"各委外廠加工費比較","本月結案",chart("c1a"))+card(icon("rule")+"訂單決策規則","自動判定",rulesList())+"</div>"+
  card(icon("receipt_long")+"委外工單清單","依交期排序",ordersTbl())+end()
}
function issueTbl(){
  var rows=[
