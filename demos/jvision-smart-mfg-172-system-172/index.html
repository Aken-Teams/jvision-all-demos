<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>委外代工採購管理系統</title>
<meta name="description" content="委外訂單、供料出庫、委外工序追蹤、回廠驗收到費用結算的單一平台"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent2:#fb7185; --accent-soft:#fff1f2;
  --ink:#1f2937; --muted:#6b7280; --line:#eceef1; --bg:#f6f7f9; --card:#ffffff;
  --ok:#059669; --okbg:#ecfdf5; --warn:#d97706; --warnbg:#fffbeb; --bad:#dc2626; --badbg:#fef2f2;
  --blue:#2563eb; --bluebg:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(15,23,42,.04)}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 5px 14px rgba(225,29,72,.32)}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand h1{font-size:16px;font-weight:800;white-space:nowrap}
.brand p{font-size:11px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 12px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{border-color:var(--accent2);color:var(--accent)}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(225,29,72,.28)}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.screen-head .hi{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.screen-head .hi .material-symbols-outlined{font-size:24px}
.screen-head h2{font-size:20px;font-weight:800}
.screen-head p{font-size:13px;color:var(--muted)}
.screen-head .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.pill .material-symbols-outlined{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:14px}
.card-t .material-symbols-outlined{font-size:18px;color:var(--accent)}
.card-t small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.col-2-1{grid-template-columns:2fr 1fr}
.col-1-2{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g4,.g3,.g2,.col-2-1,.col-1-2{grid-template-columns:1fr}
}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .dl{font-size:11px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.tbl-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfbfc}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:none}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-blue{background:var(--bluebg);color:var(--blue)}
.b-gray{background:#f1f5f9;color:#64748b}
.b-rose{background:var(--accent-soft);color:var(--accent)}
.meter{height:7px;border-radius:6px;background:#eef0f3;overflow:hidden;min-width:70px}
.meter > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px}
.bcol{background:#f4f5f7;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.bcol-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:4px 6px 10px}
.bcol-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.bcol-h .cnt{margin-left:auto;font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted)}
.ktile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:.15s}
.ktile:hover{border-color:var(--accent2);transform:translateY(-1px);box-shadow:0 6px 14px rgba(225,29,72,.1)}
.ktile .no{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ktile .nm{font-size:13px;font-weight:700;margin:3px 0 8px}
.ktile .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.ktile .mt .material-symbols-outlined{font-size:14px}
.ktile .kfoot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:11px}
.ktile .av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
@media(max-width:860px){.board{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:78%;overflow-x:auto;padding-bottom:6px}}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px}
.tl-i::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tl-i.done::before{background:var(--accent);border-color:var(--accent)}
.tl-i .tt{font-size:13px;font-weight:700}
.tl-i .td{font-size:12px;color:var(--muted)}
.tl-i .tm{font-size:11px;color:var(--accent);font-weight:600}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow .li{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.lrow .li .material-symbols-outlined{font-size:19px}
.lrow .lg{flex:1;min-width:0}
.lrow .lg .a{font-size:13px;font-weight:600}
.lrow .lg .b{font-size:11px;color:var(--muted)}
.hl{font-weight:800;color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:#f1f5f9;border-radius:6px;padding:2px 7px;margin:2px 3px 0 0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:26px 10px 6px}
.dot-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.dot-legend span{display:inline-flex;align-items:center;gap:5px}
.dot-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:8px}
  .brand p{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><h1>委外代工採購管理</h1><p>供料 · 委外工序 · 回廠驗收 · 費用結算</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>
<div class="foot">純 UI 展示頁 · 擬真示範資料 · 與專案詳細頁功能模組與運作流程一致</div>

<script>
var CH = {};

var NAV = [
  {i:0, icon:"dashboard", label:"委外看板總覽"},
  {i:1, icon:"receipt_long", label:"委外訂單管理"},
  {i:2, icon:"inventory_2", label:"供料出庫管理"},
  {i:3, icon:"account_tree", label:"委外工序追蹤"},
  {i:4, icon:"fact_check", label:"回廠驗收管理"},
  {i:5, icon:"request_quote", label:"損耗與費用結算"}
];

function el(tag, cls, html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function icon(n){return '<span class="material-symbols-outlined">'+n+'</span>';}
function disposeAll(){for(var k in CH){if(CH[k]){try{CH[k].dispose();}catch(e){}CH[k]=null;}}CH={};}
function mk(id){var d=document.getElementById(id);if(!d)return null;if(CH[id]){try{CH[id].dispose();}catch(e){}}var c=echarts.init(d);CH[id]=c;return c;}
function head(ic,title,sub,pill){
  return '<div class="screen-head"><div class="hi">'+icon(ic)+'</div>'+
    '<div><h2>'+title+'</h2><p>'+sub+'</p></div><div class="spacer"></div>'+
    (pill?'<span class="pill">'+icon(pill.ic)+pill.t+'</span>':'')+'</div>';
}
function kpi(lab,ic,val,unit,dl,cls){
  return '<div class="kpi"><div class="lab">'+icon(ic)+lab+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (dl?'<div class="dl '+(cls||'')+'">'+dl+'</div>':'')+'</div>';
}
function bdg(cls,t){return '<span class="bdg '+cls+'">'+t+'</span>';}
function meter(p){return '<div class="meter"><i style="width:'+p+'%"></i></div>';}

/* ===== SCREEN 0 : 委外看板總覽 ===== */
function s0(){
  var h='';
  h+=head("dashboard","委外看板總覽","即時掌握委外訂單狀態、交期風險與各廠負荷",{ic:"monitoring",t:"即時營運"});
  h+='<div class="grid g4" style="margin-bottom:14px">'+
    kpi("進行中委外單","account_tree","48","張","本週新增 12 張","up")+
    kpi("委外準時交貨率","task_alt","94.2","%","▲ 較上月 +3.1%","up")+
    kpi("在外料帳金額","inventory_2","¥ 2.86M","","32 張未回帳","")+
    kpi("委外損耗率","science","1.7","%","▼ 較目標 -0.3%","up")+
    '</div>';
  h+='<div class="grid col-2-1" style="margin-bottom:14px">'+
    '<div class="card"><div class="card-t">'+icon("monitoring")+'委外交貨與損耗趨勢<small>近 6 週</small></div><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><div class="card-t">'+icon("account_tree")+'委外訂單狀態分佈<small>共 88 張</small></div><div id="c0b" class="chart"></div></div>'+
    '</div>';
  h+='<div class="grid col-1-2">'+
    '<div class="card"><div class="card-t">'+icon("factory")+'委外廠負荷 TOP5<small>在製工單數</small></div>'+plants()+'</div>'+
    '<div class="card"><div class="card-t">'+icon("warning")+'交期與異常預警<small>需優先處理</small></div>'+alerts()+'</div>'+
    '</div>';
  return h;
}
function plants(){
  var d=[["鴻昌精密加工","CNC 車銑",14,92],["永順表面處理","陽極/電鍍",11,78],["大立熱處理","真空熱處理",9,64],["O泰沖壓","精密沖壓",7,55],["昱豐塑膠射出","射出成型",6,41]];
  var h='';
  d.forEach(function(r){
    h+='<div class="lrow"><div class="li">'+icon("factory")+'</div><div class="lg"><div class="a">'+r[0]+'</div><div class="b">'+r[1]+' · 在製 '+r[2]+' 張</div></div>'+
      '<div style="width:34%;min-width:90px">'+meter(r[3])+'<div class="sub" style="text-align:right;margin-top:3px">負荷 '+r[3]+'%</div></div></div>';
  });
  return h;
}
function alerts(){
  var d=[
    ["OS-24098","鴻昌精密加工","交期剩 1 天，工序未回報","b-bad","逾期風險"],
    ["OS-24072","永順表面處理","供料領用差異 3.2%，待對帳","b-warn","對帳異常"],
    ["OS-24051","大立熱處理","回廠檢驗不良率 4.1%","b-warn","品質異常"],
    ["OS-24110","昱豐塑膠射出","單一委外來源，需經理核准","b-rose","核准阻擋"],
    ["OS-24033","O泰沖壓","加工費高於參考價 9%","b-bad","價格異常"]
  ];
  var h='';
  d.forEach(function(r){
    h+='<div class="lrow"><div class="li" style="background:var(--badbg);color:var(--bad)">'+icon("priority_high")+'</div>'+
      '<div class="lg"><div class="a">'+r[0]+' · '+r[1]+'</div><div class="b">'+r[2]+'</div></div>'+bdg(r[3],r[4])+'</div>';
  });
  return h;
}
function d0(){
  var c=mk("c0a");
  if(c)c.setOption({
    grid:{left:44,right:16,top:30,bottom:28},
    tooltip:{trigger:"axis"},
    legend:{data:["委外準時交貨率 %","委外損耗率 %"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6"],axisLine:{lineStyle:{color:"#cbd5e1"}}},
    yAxis:[{type:"value",min:80,max:100,splitLine:{lineStyle:{color:"#f1f5f9"}}},
           {type:"value",min:0,max:5,position:"right",splitLine:{show:false}}],
    series:[
      {name:"委外準時交貨率 %",type:"line",smooth:true,data:[85,88,89,91,93,94],lineStyle:{width:3,color:"#e11d48"},itemStyle:{color:"#e11d48"},areaStyle:{color:"rgba(225,29,72,.08)"}},
      {name:"委外損耗率 %",type:"line",yAxisIndex:1,smooth:true,data:[2.6,2.4,2.2,2.0,1.9,1.7],lineStyle:{width:3,color:"#fb7185"},itemStyle:{color:"#fb7185"}}
    ]
  });
  var b=mk("c0b");
  if(b)b.setOption({
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["46%","70%"],center:["50%","44%"],avoidLabelOverlap:true,
      label:{show:false},itemStyle:{borderColor:"#fff",borderWidth:2},
      data:[
        {value:22,name:"待供料出庫",itemStyle:{color:"#fb7185"}},
        {value:26,name:"委外加工中",itemStyle:{color:"#e11d48"}},
        {value:18,name:"待回廠驗收",itemStyle:{color:"#f59e0b"}},
        {value:14,name:"待費用結算",itemStyle:{color:"#2563eb"}},
        {value:8,name:"異常暫停",itemStyle:{color:"#94a3b8"}}
      ]}]
  });
}

/* ===== SCREEN 1 : 委外訂單管理 ===== */
function s1(){
  var h='';
  h+=head("receipt_long","委外訂單管理","開立委外工單、指派委外廠、約定加工單價與交期",{ic:"add_task",t:"新增委外單"});
  h+='<div class="grid g4" style="margin-bottom:14px">'+
    kpi("本月委外單","receipt_long","136","張","","")+
    kpi("待核准","gavel","5","張","單一來源需經理核准","down")+
    kpi("平均加工單價","request_quote","¥ 38.6","/件","▼ 議價後 -6%","up")+
    kpi("平均約定交期","calendar_month","6.4","天","標準內","")+
    '</div>';
  h+='<div class="grid col-2-1" style="margin-bottom:14px">'+
    '<div class="card"><div class="card-t">'+icon("request_quote")+'各委外廠加工費比較<small>本月結案</small></div><div id="c1a" class="chart"></div></div>'+
    '<div class="card"><div class="card-t">'+icon("rule")+'訂單決策規則<small>自動判定</small></div>'+rulesList()+'</div>'+
    '</div>';
  h+='<div class="card"><div class="card-t">'+icon("receipt_long")+'委外工單清單<small>依交期排序</small></div>'+ordersTbl()+'</div>';
  return h;
}
function rulesList(){
  var d=[
    ["交期不足","需求日落在委外廠標準交期內 → 標記缺料風險","b-warn"],
    ["價格異常","加工費高於參考價 8% 以上 → 須說明原因","b-bad"],
    ["單一來源","單一委外來源且影響生產 → 供應鏈經理核准","b-rose"]
  ];
  var h='';
  d.forEach(function(r){
    h+='<div class="lrow"><div class="li">'+icon("rule")+'</div><div class="lg"><div class="a">'+r[0]+'</div><div class="b">'+r[1]+'</div></div>'+bdg(r[2],"啟用")+'</div>';
  });
  return h;
}
function ordersTbl(){
  var rows=[
    ["OS-24110","精密軸承座","CNC 車銑","昱豐塑膠射出",1200,"08/16","待核准","b-rose"],
    ["OS-24098","傳動齒輪","滾齒加工","鴻昌精密加工",800,"08/15","加工中","b-blue"],
    ["OS-24095","外殼組件","陽極處理","永順表面處理",2400,"08/17","已下單","b-ok"],
    ["OS-24088","連桿","真空熱處理","大立熱處理",600,"08/18","已下單","b-ok"],
    ["OS-24072","支架","精密沖壓","O泰沖壓",3000,"08/16","加工中","b-blue"],
    ["OS-24051","端蓋","射出成型","昱豐塑膠射出",1500,"08/14","逾期","b-bad"]
  ];
  var h='<div class="tbl-wrap"><table><thead><tr><th>委外單號</th><th>品名</th><th>委外工序</th><th>委外廠</th><th>數量</th><th>交期</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="mono">'+r[4]+'</td><td class="mono">'+r[5]+'</td><td>'+bdg(r[7],r[6])+'</td></tr>';
  });
  return h+'</tbody></table></div>';

  app.innerHTML=SCREENS[i]();

}
