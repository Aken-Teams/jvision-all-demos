<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>業務目標配額管理 Sales Quota &amp; Target Management｜Jvision 系統 Demo</title>
  <meta name="description" content="年度目標制定、配額分攤看板、達成追蹤、調整審核與年終結算的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#15803d; --accent2:#4ade80; --accent-soft:#dcfce7;
      --ink:#0f2417; --ink2:#4b5c52; --muted:#7a8a80;
      --bg:#f2f6f3; --card:#ffffff; --line:#e2ebe4;
      --warn:#c2410c; --warn-bg:#ffedd5; --danger:#b91c1c; --danger-bg:#fee2e2;
      --ok:#15803d; --ok-bg:#dcfce7; --blue:#1d4ed8; --blue-bg:#dbeafe;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink);
      -webkit-font-smoothing:antialiased; line-height:1.6;
    }
    .msym{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#ffffff,#f7fbf8);border-bottom:1px solid var(--line);}
    .topbar-inner{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(21,128,61,.28);}
    .brand-logo .msym{font-size:22px;}
    .brand-txt{min-width:0;}
    .brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand-txt span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
    .navbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;}
    .navbtn .msym{font-size:18px;}
    .navbtn:hover{border-color:var(--accent2);color:var(--accent);}
    .navbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(21,128,61,.25);}
    .wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
    .screen-head .ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
    .screen-head .ic .msym{font-size:26px;}
    .screen-head h1{font-size:21px;margin:0;font-weight:800;}
    .screen-head p{margin:2px 0 0;color:var(--ink2);font-size:13px;}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;}
    .chip .msym{font-size:15px;}
    .chip.ok{background:var(--ok-bg);color:var(--ok);}
    .chip.warn{background:var(--warn-bg);color:var(--warn);}
    .chip.danger{background:var(--danger-bg);color:var(--danger);}
    .chip.blue{background:var(--blue-bg);color:var(--blue);}
    .chip.grey{background:#eef2ef;color:var(--ink2);}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
    .card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .msym{font-size:19px;color:var(--accent);}
    .sub{color:var(--muted);font-size:12px;font-weight:600;}
    .g2,.g3,.g4{display:grid;gap:16px;}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g4{grid-template-columns:repeat(4,1fr);}
    .split{display:grid;gap:16px;grid-template-columns:1.55fr 1fr;}
    .split-r{display:grid;gap:16px;grid-template-columns:1fr 1.4fr;}
    @media(max-width:820px){
      .g2,.g3,.g4,.split,.split-r{grid-template-columns:1fr;}
    }
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;position:relative;overflow:hidden;}
    .kpi .lbl{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;}
    .kpi .lbl .msym{font-size:17px;color:var(--accent);}
    .kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
    .kpi .foot{font-size:12px;margin-top:6px;font-weight:600;}
    .up{color:var(--ok);} .down{color:var(--danger);}
    .kpi .bar{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
    th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:800;background:#fafcfb;}
    tbody tr:hover{background:#f6fbf7;}
    td.num{font-variant-numeric:tabular-nums;font-weight:700;}
    .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);}
    .scrollx table{min-width:600px;}
    .scrollx th:first-child,.scrollx td:first-child{white-space:normal;}
    .pb{height:8px;border-radius:999px;background:#eef2ef;overflow:hidden;min-width:80px;}
    .pb>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .pb.warn>i{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
    .pb.danger>i{background:linear-gradient(90deg,#dc2626,#f87171);}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    @media(max-width:980px){.board{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:560px){.board{grid-template-columns:1fr;}}
    .col{background:#f7faf8;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
    .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:13px;}
    .col-h .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2);}
    .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;border-left:4px solid var(--accent2);}
    .kcard:last-child{margin-bottom:0;}
    .kcard .kt{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
    .kcard .km{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
    .kcard .kq{font-size:12px;margin-top:8px;font-weight:700;}
    .kcard.hot{border-left-color:var(--danger);}
    .kcard.warn{border-left-color:#f59e0b;}
    .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;}
    .tl{position:relative;padding-left:26px;}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 16px;}
    .tl-item:last-child{padding-bottom:0;}
    .tl-item .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
    .tl-item.done .dot{background:var(--accent);}
    .tl-item .tt{font-weight:800;font-size:13px;}
    .tl-item .td{font-size:12px;color:var(--ink2);}
    .tl-item .tm{font-size:11px;color:var(--muted);}
    .chartbox{position:relative;width:100%;overflow:hidden;}
    .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;}
    .row:last-child{border-bottom:none;}
    .row .grow{flex:1;min-width:0;}
    .row .t{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .row .s{font-size:12px;color:var(--muted);}
    .seg{display:inline-flex;background:#eef2ef;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;}
    .seg span{padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink2);}
    .seg span.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .flexbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
    .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}
    .btn .msym{font-size:17px;}
    .btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);}
    .stat-line{display:flex;gap:18px;flex-wrap:wrap;}
    .stat-line .s{min-width:0;}
    .stat-line .s b{display:block;font-size:20px;font-weight:900;}
    .stat-line .s span{font-size:11px;color:var(--muted);font-weight:700;}
    .donut-cap{display:flex;flex-direction:column;gap:8px;}
    .lg{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;}
    .lg .sw{width:11px;height:11px;border-radius:3px;flex:none;}
    .note{background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#14532d;display:flex;gap:10px;align-items:flex-start;}
    .note .msym{color:var(--accent);font-size:20px;flex:none;}
    .mt16{margin-top:16px;} .mt12{margin-top:12px;}
    .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2ef;color:var(--ink2);}
    .hbar{display:flex;flex-direction:column;gap:12px;}
    .hbar .hrow{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;min-width:0;}
    @media(max-width:560px){.hbar .hrow{grid-template-columns:80px 1fr 46px;}}
    .hbar .hn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hbar .hv{font-size:12px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;}
    @media(max-width:560px){
      .navtxt{display:none;}
      .navbtn{padding:8px;}
      .navbtn .msym{font-size:20px;}
    }
    .footer{max-width:1360px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px;}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo"><span class="msym">trending_up</span></div>
        <div class="brand-txt">
          <b>業務目標配額管理</b>
          <span>Sales Quota &amp; Target Management</span>
        </div>
      </div>
      <nav class="topnav" id="nav"></nav>
    </div>
  </header>
  <main class="wrap"><div id="screen"></div></main>
  <div class="footer">Jvision Demo · 純前端展示 · 假資料僅供介面示意</div>

  <script>
  (function(){
    "use strict";
    var accent="#15803d", accent2="#4ade80";
    var NAV=[
      {i:0,ic:"trending_up",t:"年度目標制定"},
      {i:1,ic:"account_tree",t:"配額分攤看板"},
      {i:2,ic:"monitoring",t:"達成進度追蹤"},
      {i:3,ic:"gavel",t:"配額調整審核"},
      {i:4,ic:"insights",t:"業績預測分析"},
      {i:5,ic:"receipt_long",t:"年終績效結算"}
    ];
    var charts=[];

    function el(id){return document.getElementById(id);}
    function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}

    function head(ic,title,desc,chips){
      var c="";
      if(chips){for(var i=0;i<chips.length;i++){c+='<span class="chip '+chips[i].c+'"><span class="msym">'+chips[i].ic+'</span>'+chips[i].t+'</span>';}}
      return '<div class="screen-head"><div class="ic"><span class="msym">'+ic+'</span></div>'+
        '<div style="min-width:0"><h1>'+title+'</h1><p>'+desc+'</p></div>'+
        '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'+c+'</div></div>';
    }
    function pb(v,cls){cls=cls||"";return '<div class="pb '+cls+'"><i style="width:'+Math.max(2,Math.min(100,v))+'%"></i></div>';}
    function kpi(lbl,ic,val,unit,foot,footcls){
      return '<div class="kpi"><div class="lbl"><span class="msym">'+ic+'</span>'+lbl+'</div>'+
        '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
        (foot?'<div class="foot '+(footcls||'')+'">'+foot+'</div>':'')+
        '<div class="bar" style="width:100%"></div></div>';
    }

    /* ===================== SCREEN 0 : 年度目標制定 ===================== */
    function s0(c){
      c.innerHTML=head("trending_up","年度目標制定","依歷史業績與市場成長率設定 2026 年度營收目標基準",
        [{c:"grey",ic:"calendar_month",t:"FY2026"},{c:"ok",ic:"verified",t:"已核定"}])+
        '<div class="g4">'+
          kpi("年度營收目標","flag","4.80","億元","較 FY2025 +12.5%","up")+
          kpi("市場成長率基準","query_stats","6.8","%","產業預估中位","")+
          kpi("既有客戶續約","autorenew","2.65","億元","佔目標 55.2%","")+
          kpi("新客開發目標","person_add","2.15","億元","佔目標 44.8%","")+
        '</div>'+
        '<div class="split mt16">'+
          '<div class="card"><h3><span class="msym">bar_chart</span>五年營收與目標趨勢</h3>'+
            '<div class="chartbox" style="height:300px"><canvas id="c0a"></canvas></div>'+
            '<div class="note mt12"><span class="msym">lightbulb</span>目標線採「三年複合成長率 9.2% + 市場成長率權重 6.8%」計算，避免主觀拍板。</div>'+
          '</div>'+
          '<div class="card"><h3><span class="msym">tune</span>目標組成權重</h3>'+
            '<div class="chartbox" style="height:210px"><canvas id="c0b"></canvas></div>'+
            '<div class="donut-cap mt12">'+
              '<div class="lg"><span class="sw" style="background:'+accent+'"></span>既有客戶續約 · 2.65 億</div>'+
              '<div class="lg"><span class="sw" style="background:'+accent2+'"></span>新客開發 · 2.15 億</div>'+
              '<div class="lg"><span class="sw" style="background:#a7f3d0"></span>交叉銷售增購 · 0.62 億</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="card mt16"><h3><span class="msym">table_chart</span>各事業處目標基準拆解</h3>'+
          '<div class="scrollx"><table><thead><tr><th>事業處</th><th>FY2025 實績</th><th>市場成長率</th><th>策略權重</th><th>FY2026 目標</th><th>年增率</th></tr></thead><tbody>'+
          bizRows()+
          '</tbody></table></div>'+
        '</div>';
      void c.offsetHeight;
      var line=new Chart(el("c0a"),{type:"bar",data:{
        labels:["FY2022","FY2023","FY2024","FY2025","FY2026(目標)"],
        datasets:[
          {label:"實績營收(億)",data:[3.12,3.48,3.86,4.27,null],backgroundColor:accent,borderRadius:6,maxBarThickness:46},
          {type:"line",label:"目標(億)",data:[3.10,3.45,3.90,4.30,4.80],borderColor:"#065f46",backgroundColor:"transparent",borderWidth:2,tension:.3,pointRadius:4,pointBackgroundColor:"#065f46"}
        ]},options:baseOpts({yUnit:"億"})});
      charts.push(line);
      var d=new Chart(el("c0b"),{type:"doughnut",data:{
        labels:["既有客戶續約","新客開發","交叉銷售增購"],
        datasets:[{data:[2.65,2.15,0.62],backgroundColor:[accent,accent2,"#a7f3d0"],borderWidth:2,borderColor:"#fff"}]},
        options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{display:false}}}});
      charts.push(d);
    }
    function bizRows(){
      var r=[
        ["北區事業處","1.42","6.5%","1.08","1.62","+14.1%"],
        ["中區事業處","0.98","7.2%","1.02","1.12","+14.3%"],
        ["南區事業處","0.86","6.0%","0.98","0.94","+9.3%"],
        ["海外事業處","0.61","9.1%","1.15","0.78","+27.9%"],
        ["策略客戶處","0.40","5.5%","0.90","0.34","-15.0%"]
      ],o="";
      for(var i=0;i<r.length;i++){var neg=r[i][5].indexOf("-")===0;
        o+='<tr><td>'+r[i][0]+'</td><td class="num">'+r[i][1]+' 億</td><td class="num">'+r[i][2]+'</td><td class="num">×'+r[i][3]+'</td><td class="num">'+r[i][4]+' 億</td>'+
          '<td><span class="chip '+(neg?"danger":"ok")+'">'+r[i][5]+'</span></td></tr>';}
      return o;
    }

    /* ===================== SCREEN 1 : 配額分攤看板 (signature kanban) ===================== */
    function s1(c){
      c.innerHTML=head("account_tree","配額分攤看板","將 4.80 億年度目標拖曳分攤至區域、產品線與各業務個人",
        [{c:"ok",ic:"check_circle",t:"已分攤 92%"},{c:"warn",ic:"pending",t:"待確認 0.38 億"}])+
        '<div class="flexbar">'+
          '<div class="seg"><span class="on">依團隊</span><span>依產品線</span><span>依區域</span></div>'+
          '<div class="stat-line"><div class="s"><b>4.80億</b><span>總配額</span></div><div class="s"><b>4.42億</b><span>已分攤</span></div><div class="s"><b>0.38億</b><span>未分攤</span></div></div>'+
        '</div>'+
        '<div class="board">'+
          kol("北區團隊","1.62","hot",[
            {n:"陳建宏",r:"資深業務",q:"0.52 億",t:"HOT",cls:"hot",m:["重點客戶 8","續約 3"]},
            {n:"林雅婷",r:"業務專員",q:"0.44 億",t:"",cls:"",m:["新客 6"]},
            {n:"王志明",r:"業務專員",q:"0.38 億",t:"",cls:"",m:["交叉銷售 4"]},
            {n:"待分攤",r:"缺口",q:"0.28 億",t:"待補",cls:"warn",m:["需指派"]}
          ])+
          kol("中區團隊","1.12","",[
            {n:"張淑芬",r:"團隊長",q:"0.46 億",t:"",cls:"",m:["重點客戶 5"]},
            {n:"李國榮",r:"業務專員",q:"0.36 億",t:"",cls:"",m:["新客 5"]},
            {n:"吳佩珊",r:"業務專員",q:"0.30 億",t:"",cls:"",m:["續約 2"]}
          ])+
          kol("南區團隊","0.94","warn",[
            {n:"黃俊傑",r:"團隊長",q:"0.40 億",t:"",cls:"",m:["重點客戶 4"]},
            {n:"周庭瑋",r:"業務專員",q:"0.34 億",t:"",cls:"",m:["新客 4"]},
            {n:"待分攤",r:"缺口",q:"0.20 億",t:"待補",cls:"warn",m:["需指派"]}
          ])+
          kol("海外／策略","1.12","",[

      var r=[
        ["Kevin Lin","0.45 億","0.58 億",129,"S",68],
        ["陳建宏","0.50 億","0.56 億",112,"A",42],
        ["張淑芬","0.44 億","0.47 億",107,"A",31],
        ["林雅婷","0.42 億","0.42 億",100,"A",22],
        ["黃俊傑","0.38 億","0.33 億",87,"B",9],
        ["Amy Chen","0.40 億","0.29 億",73,"C",0]
      ],o="";
      for(var i=0;i<r.length;i++){var g=r[i][4],cls=g==="S"?"blue":g==="A"?"ok":g==="B"?"grey":"danger";
        o+='<tr><td>'+r[i][0]+'</td><td class="num">'+r[i][1]+'</td><td class="num">'+r[i][2]+'</td><td class="num">'+r[i][3]+'%</td>'+
          '<td><span class="chip '+cls+'">'+g+' 級</span></td><td class="num">'+r[i][5]+'</td></tr>';}
      return o;
    }

    /* ===================== chart base options ===================== */
    function baseOpts(o){o=o||{};
      return {maintainAspectRatio:false,responsive:true,
        plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{family:"Inter, Noto Sans TC"}}}},
        scales:{
          x:{grid:{display:false},ticks:{font:{family:"Inter"}}},
          y:{beginAtZero:true,max:o.max,grid:{color:"#eef2ef"},ticks:{font:{family:"Inter"},callback:function(v){return v+(o.yUnit||"");}}}
        }};
    }

    /* ===================== router ===================== */
    var RENDER=[s0,s1,s2,s3,s4,s5];
    function buildNav(){
      var n=el("nav"),o="";
      for(var i=0;i<NAV.length;i++){o+='<button class="navbtn" data-i="'+NAV[i].i+'"><span class="msym">'+NAV[i].ic+'</span><span class="navtxt">'+NAV[i].t+'</span></button>';}
      n.innerHTML=o;
      var btns=n.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){(function(b){b.addEventListener("click",function(){location.hash="go="+(+b.getAttribute("data-i"));});})(btns[j]);}
    }
    function show(i){
      destroyCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
      var c=el("screen");
      (RENDER[i]||s0)(c);
    }
    buildNav();

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
