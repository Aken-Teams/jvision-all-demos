<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>業務目標配額管理 Sales Quota &amp; Target Management｜Jvision 系統 Demo</title>
  <meta name="description" content="年度目標制定、配額分攤看板、達成追蹤、調整審核與年終結算的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#001a10;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;

  /* External interface aliases — keep these names stable. */
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;

  --ink2:#334155;
  --bg:var(--color-background);
  --card:var(--color-card);
  --accent:var(--color-primary);
  --accent2:var(--color-accent);
  --accent-soft:#eff6ff;
  --blue-bg:#dbeafe;
  --ok:#047857;
  --ok-bg:#d1fae5;
  --warn:#9a5808;
  --warn-bg:#fff7d6;
  --danger:#b91c1c;
  --danger-bg:#fee2e2;
  --radius-sm:4px;
  --radius-md:7px;
  --radius-lg:10px;
  --transition:180ms ease;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[data-i]{cursor:pointer;}
::selection{background:#bfdbfe;color:#0f172a;}

:where(button,a,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:2px;
}

.msym{
  display:inline-block;
  flex:none;
  font-family:"Material Symbols Outlined";
  font-size:19px;
  font-style:normal;
  font-weight:normal;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#ffffff;
  border-bottom:1px solid var(--color-border);
}
.topbar-inner{
  width:min(100%,1440px);
  min-height:64px;
  margin:0 auto;
  padding:8px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:250px;}
.brand-logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid var(--color-primary);
  border-radius:var(--radius-md);
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.brand-logo .msym{font-size:22px;}
.brand-txt{min-width:0;line-height:1.25;}
.brand-txt b{
  display:block;
  overflow:hidden;
  color:var(--color-foreground);
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:var(--color-muted-foreground);
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.topnav{
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  min-width:0;
}
.navbtn{
  min-height:40px;
  padding:8px 10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:var(--radius-md);
  background:transparent;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color var(--transition),border-color var(--transition),color var(--transition);
}
.navbtn:hover{background:var(--color-muted);color:var(--color-primary);}
.navbtn.on{
  background:var(--color-primary);
  border-color:var(--color-primary);
  color:var(--color-on-primary);
}
.navbtn.on:hover{background:#1d4ed8;border-color:#1d4ed8;}
.navbtn .msym{font-size:18px;}

.wrap{width:min(100%,1440px);margin:0 auto;padding:22px 24px 48px;}
#screen>*,.screen-head{animation:screen-reveal 350ms ease both;}
#screen>*:nth-child(2){animation-delay:35ms;}
#screen>*:nth-child(3){animation-delay:70ms;}
#screen>*:nth-child(4){animation-delay:105ms;}
@keyframes screen-reveal{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.screen-head{
  min-height:62px;
  margin-bottom:16px;
  padding-bottom:16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--color-border);
}
.screen-head .ic{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid #bfdbfe;
  border-radius:var(--radius-md);
  background:var(--accent-soft);
  color:var(--color-primary);
}
.screen-head .ic .msym{font-size:23px;}
.screen-head h1{margin:0;color:var(--color-foreground);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;}
.screen-head p{margin:3px 0 0;color:var(--color-muted-foreground);font-size:12px;}

.g2,.g3,.g4{display:grid;gap:12px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:12px;}
.split-r{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.4fr);gap:12px;}
.mt16{margin-top:12px;}
.mt12{margin-top:10px;}

.card,.kpi{
  min-width:0;
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card{padding:15px;}
.card h3{
  margin:0 0 12px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:7px;
  border-bottom:1px solid var(--color-border);
  color:var(--color-foreground);
  font-size:14px;
  font-weight:700;
  line-height:1.3;
}
.card h3 .msym{color:var(--color-primary);font-size:18px;}
.sub{color:var(--color-muted-foreground);font-size:11px;font-weight:500;}

.kpi{position:relative;overflow:hidden;padding:14px 15px 16px;border-top:3px solid var(--color-primary);}
.kpi .lbl{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:11px;font-weight:600;letter-spacing:.01em;}
.kpi .lbl .msym{color:var(--color-primary);font-size:17px;}
.kpi .val{
  margin-top:6px;
  color:var(--color-foreground);
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.04em;
  line-height:1.2;
}
.kpi .val small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .foot{margin-top:6px;font-size:11px;font-weight:500;}
.kpi .bar{position:absolute;right:0;bottom:0;left:0;height:3px;background:var(--color-primary);}
.up{color:var(--ok)!important;}
.down{color:var(--danger)!important;}

.chip{
  min-height:24px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  line-height:1.1;
  white-space:nowrap;
}
.chip .msym{font-size:14px;}
.chip.ok{background:var(--ok-bg);color:var(--ok);}
.chip.warn{background:var(--warn-bg);color:var(--warn);}
.chip.danger{background:var(--danger-bg);color:var(--danger);}
.chip.blue{background:var(--blue-bg);color:#1d4ed8;}
.chip.grey{background:#f1f5f9;color:#475569;}

.scrollx{max-width:100%;overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);-webkit-overflow-scrolling:touch;scrollbar-color:#94a3b8 #f1f5f9;}
table{width:100%;min-width:560px;border-collapse:collapse;background:#fff;font-size:12px;}
th,td{padding:9px 11px;border-bottom:1px solid var(--color-border);text-align:left;vertical-align:middle;white-space:nowrap;}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--color-muted);
  color:#334155;
  font-size:10px;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:uppercase;
}
tbody tr{transition:background-color var(--transition);}
tbody tr:hover{background:#eff6ff;}
tbody tr:last-child td{border-bottom:0;}
td.num{
  font-family:"Fira Code",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  text-align:right;
}
.scrollx table{min-width:600px;}
.scrollx th:first-child,.scrollx td:first-child{white-space:normal;}

.pb{height:8px;min-width:80px;overflow:hidden;border:1px solid #dbe4f4;border-radius:2px;background:#edf2f9;}
.pb>i{display:block;height:100%;border-radius:0;background:var(--color-primary);}
.pb.warn>i{background:#c7790a;}
.pb.danger>i{background:var(--color-destructive);}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.col{min-width:0;padding:10px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-muted);}
.col-h{margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--color-foreground);font-size:12px;font-weight:700;}
.col-h .cnt{padding:2px 7px;border:1px solid var(--color-border);border-radius:999px;background:#fff;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px;}
.kcard{margin-bottom:8px;padding:10px;border:1px solid var(--color-border);border-left:4px solid var(--color-primary);border-radius:var(--radius-md);background:#fff;}
.kcard:last-child{margin-bottom:0;}
.kcard.hot{border-left-color:var(--color-destructive);}
.kcard.warn{border-left-color:#c7790a;}
.kcard .kt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;}
.kcard .km{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px 8px;color:var(--color-muted-foreground);font-size:10px;}
.kcard .kq{margin-top:7px;color:#1e293b;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;}
.av{width:22px;height:22px;display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--color-primary);color:#fff;font-size:9px;font-weight:700;}
.tag{display:inline-block;padding:2px 7px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:#f1f5f9;color:#334155;font-family:"Fira Code",monospace;font-size:10px;font-weight:600;}

.flexbar{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.seg{padding:3px;display:inline-flex;gap:2px;flex-wrap:wrap;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-muted);}
.seg span{padding:5px 10px;border-radius:var(--radius-sm);color:var(--color-muted-foreground);font-size:11px;font-weight:600;}
.seg span.on{background:var(--color-primary);color:#fff;}
.stat-line{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.stat-line .s{min-width:0;}
.stat-line .s b{display:block;color:var(--color-foreground);font-family:"Fira Code",monospace;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-line .s span{display:block;color:var(--color-muted-foreground);font-size:10px;font-weight:600;}

.row{min-width:0;padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--color-border);}
.row:last-child{border-bottom:0;}
.row .grow{min-width:0;flex:1;}
.row .t{overflow:hidden;color:var(--color-foreground);font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.row .s{margin-top:2px;color:var(--color-muted-foreground);font-size:11px;}

.btn{
  min-height:40px;
  padding:8px 13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid var(--color-accent);
  border-radius:var(--radius-md);
  background:var(--color-accent);
  color:var(--color-on-accent);
  font-size:12px;
  font-weight:700;
  transition:background-color var(--transition),border-color var(--transition),color var(--transition),opacity var(--transition);
}
.btn:hover{background:#047857;border-color:#047857;color:#fff;}
.btn.ghost{border-color:var(--color-border);background:#fff;color:#334155;}
.btn.ghost:hover{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8;}
.btn .msym{font-size:17px;}

.note{padding:10px 12px;display:flex;align-items:flex-start;gap:9px;border:1px solid #bfdbfe;border-left:4px solid var(--color-primary);border-radius:var(--radius-md);background:#eff6ff;color:#1e3a5f;font-size:11.5px;}
.note .msym{color:var(--color-primary);font-size:18px;}
.chartbox{position:relative;width:100%;overflow:hidden;}
.donut-cap{display:flex;flex-direction:column;gap:7px;}
.lg{display:flex;align-items:center;gap:7px;color:#334155;font-size:11px;font-weight:500;}
.lg .sw{width:11px;height:11px;flex:none;border:1px solid rgba(15,23,42,.2);border-radius:2px;}

.hbar{display:flex;flex-direction:column;gap:11px;}
.hbar .hrow{min-width:0;display:grid;grid-template-columns:96px 1fr 50px;align-items:center;gap:9px;}
.hbar .hn{overflow:hidden;color:#334155;font-size:11px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.hbar .hv{text-align:right;color:#0f172a;font-family:"Fira Code",monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}

.tl{position:relative;padding-left:25px;}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:var(--color-border);}
.tl-item{position:relative;padding:0 0 14px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .dot{position:absolute;top:2px;left:-22px;width:13px;height:13px;border:3px solid var(--color-primary);border-radius:50%;background:#fff;}
.tl-item.done .dot{background:var(--color-primary);}
.tl-item .tt{color:var(--color-foreground);font-size:12px;font-weight:700;}
.tl-item .tm{color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px;font-variant-numeric:tabular-nums;}
.tl-item .td{margin-top:1px;color:#334155;font-size:11px;}

.footer{width:min(100%,1440px);margin:0 auto;padding:0 24px 28px;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px;}

@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:7px;padding-block:8px;}
  .brand{min-width:0;}
  .topnav{width:100%;margin-left:0;justify-content:flex-start;overflow-x:auto;padding-bottom:2px;}
  .navbtn{flex:0 0 auto;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:980px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:820px){
  .wrap{padding:18px 16px 40px;}
  .g2,.g3,.split,.split-r{grid-template-columns:1fr;}
  .screen-head{align-items:flex-start;}
  .screen-head>div:last-child{width:100%;margin-left:54px!important;}
  .footer{padding-inline:16px;}
}
@media(max-width:560px){
  .topbar-inner{padding-inline:12px;}
  .brand-logo{width:36px;height:36px;}
  .brand-txt b{font-size:14px;}
  .navtxt{display:none;}
  .navbtn{width:42px;height:40px;padding:7px;}
  .navbtn .msym{font-size:20px;}
  .wrap{padding:14px 12px 36px;}
  .screen-head{gap:10px;padding-bottom:13px;}
  .screen-head .ic{width:38px;height:38px;}
  .screen-head h1{font-size:18px;}
  .screen-head p{font-size:11px;}
  .screen-head>div:last-child{margin-left:48px!important;}
  .g4,.board{grid-template-columns:1fr;}
  .card{padding:12px;}
  .kpi{padding:12px 13px 14px;}
  .kpi .val{font-size:23px;}
  .hbar .hrow{grid-template-columns:80px 1fr 45px;}
  .stat-line{gap:13px;}
  .footer{padding-inline:12px;}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #screen>*{opacity:1;transform:none;}
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo"><span class="msym">trending_up</span></div>
        <div class="brand-txt">
          <b>業務目標配額管理</b>
          <span>Sales Quota &amp; Target Management</span>
        </div>
      </div>
      <nav class="topnav" id="nav"></nav>
    </div>
  </header>
  <main class="wrap"><div id="screen"></div></main>
  <div class="footer">Jvision Demo · 純前端展示 · 假資料僅供介面示意</div>

  <script>
  (function(){
    "use strict";
    var accent="#2563eb", accent2="#059669";
    Chart.defaults.font.family='"Fira Sans", sans-serif';
    Chart.defaults.color="#475569";
    Chart.defaults.borderColor="#e4ecfc";
    var NAV=[
      {i:0,ic:"trending_up",t:"年度目標制定"},
      {i:1,ic:"account_tree",t:"配額分攤看板"},
      {i:2,ic:"monitoring",t:"達成進度追蹤"},
      {i:3,ic:"gavel",t:"配額調整審核"},
      {i:4,ic:"insights",t:"業績預測分析"},
      {i:5,ic:"receipt_long",t:"年終績效結算"}
    ];
    var charts=[];

    function el(id){return document.getElementById(id);}
    function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}

    function head(ic,title,desc,chips){
      var c="";
      if(chips){for(var i=0;i<chips.length;i++){c+='<span class="chip '+chips[i].c+'"><span class="msym">'+chips[i].ic+'</span>'+chips[i].t+'</span>';}}
      return '<div class="screen-head"><div class="ic"><span class="msym">'+ic+'</span></div>'+
        '<div style="min-width:0"><h1>'+title+'</h1><p>'+desc+'</p></div>'+
        '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'+c+'</div></div>';
    }
    function pb(v,cls){cls=cls||"";return '<div class="pb '+cls+'"><i style="width:'+Math.max(2,Math.min(100,v))+'%"></i></div>';}
    function kpi(lbl,ic,val,unit,foot,footcls){
      return '<div class="kpi"><div class="lbl"><span class="msym">'+ic+'</span>'+lbl+'</div>'+
        '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
        (foot?'<div class="foot '+(footcls||'')+'">'+foot+'</div>':'')+
        '<div class="bar" style="width:100%"></div></div>';
    }

    /* ===================== SCREEN 0 : 年度目標制定 ===================== */
    function s0(c){
      c.innerHTML=head("trending_up","年度目標制定","依歷史業績與市場成長率設定 2026 年度營收目標基準",
        [{c:"grey",ic:"calendar_month",t:"FY2026"},{c:"ok",ic:"verified",t:"已核定"}])+
        '<div class="g4">'+
          kpi("年度營收目標","flag","4.80","億元","較 FY2025 +12.5%","up")+

        options:{maintainAspectRatio:false,responsive:true,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:"#eef2ef"}},y:{grid:{display:false}}}}});

      ],o="";

    /* ===================== SCREEN 5 : 年終績效結算 ===================== */

        [{c:"ok",ic:"verified",t:"FY2025 已結算"},{c:"grey",ic:"payments",t:"獎金池 1,850 萬"}])+

          kpi("整體達成率","donut_large","103.5","%","超標 0.16 億","up")+

            '<div class="donut-cap mt12">'+
              '<div class="lg"><span class="sw" style="background:#065f46"></span>S 級 (≥120%) · 3 人</div>'+
              '<div class="lg"><span class="sw" style="background:'+accent+'"></span>A 級 (100-119%) · 9 人</div>'+
              '<div class="lg"><span class="sw" style="background:'+accent2+'"></span>B 級 (80-99%) · 8 人</div>'+
              '<div class="lg"><span class="sw" style="background:#fca5a5"></span>C 級 (&lt;80%) · 4 人</div>'+
            '</div></div>'+
          '<div class="card"><h3><span class="msym">military_tech</span>年終績效結算明細</h3>'+
            '<div class="scrollx"><table><thead><tr><th>業務</th><th>配額</th><th>實績</th><th>達成率</th><th>評等</th><th>獎金(萬)</th></tr></thead><tbody>'+
            settleRows()+'</tbody></table></div></div>'+
        '</div>'+
        '<div class="split mt16">'+
          '<div class="card"><h3><span class="msym">bar_chart</span>獎金級距與達成率對應</h3>'+
            '<div class="chartbox" style="height:250px"><canvas id="c5b"></canvas></div></div>'+
          '<div class="card"><h3><span class="msym">timeline</span>結算作業里程碑</h3>'+
            '<div class="tl mt12">'+

              tl("實績資料勾稽","2026-01-08","與 Sales Dashboard、財務營收對帳",true)+
              tl("達成率計算","2026-01-12","系統套用級距規則自動評等",true)+
              tl("獎金試算簽核","2026-01-18","業務主管與人資部雙簽核定",true)+
              tl("績效面談發放","2026-01-25","面談回饋並發放獎金",false)+
            '</div></div>'+
        '</div>';
      void c.offsetHeight;
      var d=new Chart(el("c5a"),{type:"doughnut",data:{labels:["S 級","A 級","B 級","C 級"],
        datasets:[{data:[3,9,8,4],backgroundColor:["#065f46",accent,accent2,"#fca5a5"],borderWidth:2,borderColor:"#fff"}]},
        options:{maintainAspectRatio:false,responsive:true,cutout:"60%",plugins:{legend:{display:false}}}});
      charts.push(d);
      var b=new Chart(el("c5b"),{type:"bar",data:{labels:["<80%","80-89%","90-99%","100-109%","110-119%","≥120%"],
        datasets:[
          {label:"人數",data:[4,3,5,6,3,3],backgroundColor:accent2,borderRadius:5,yAxisID:"y",maxBarThickness:38},
          {type:"line",label:"獎金係數",data:[0,0.4,0.7,1.0,1.4,2.0],borderColor:"#065f46",backgroundColor:"transparent",tension:.3,borderWidth:2.5,pointRadius:4,yAxisID:"y1"}
        ]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{family:"Inter"}}}},
          scales:{y:{position:"left",beginAtZero:true,grid:{color:"#eef2ef"},title:{display:true,text:"人數"}},y1:{position:"right",beginAtZero:true,grid:{display:false},title:{display:true,text:"係數"}}}}});
      charts.push(b);
    }
    function tl(t,d,desc,done){
      return '<div class="tl-item '+(done?"done":"")+'"><div class="dot"></div><div class="tt">'+t+'</div><div class="tm">'+d+'</div><div class="td">'+desc+'</div></div>';
    }
    function settleRows(){
      var r=[
        ["Kevin Lin","0.45 億","0.58 億",129,"S",68],
        ["陳建宏","0.50 億","0.56 億",112,"A",42],
        ["張淑芬","0.44 億","0.47 億",107,"A",31],
        ["林雅婷","0.42 億","0.42 億",100,"A",22],
        ["黃俊傑","0.38 億","0.33 億",87,"B",9],
        ["Amy Chen","0.40 億","0.29 億",73,"C",0]
      ],o="";
      for(var i=0;i<r.length;i++){var g=r[i][4],cls=g==="S"?"blue":g==="A"?"ok":g==="B"?"grey":"danger";
        o+='<tr><td>'+r[i][0]+'</td><td class="num">'+r[i][1]+'</td><td class="num">'+r[i][2]+'</td><td class="num">'+r[i][3]+'%</td>'+
          '<td><span class="chip '+cls+'">'+g+' 級</span></td><td class="num">'+r[i][5]+'</td></tr>';}
      return o;
    }

    /* ===================== chart base options ===================== */
    function baseOpts(o){o=o||{};
      return {maintainAspectRatio:false,responsive:true,
        plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{family:"Inter, Noto Sans TC"}}}},
        scales:{
          x:{grid:{display:false},ticks:{font:{family:"Inter"}}},
          y:{beginAtZero:true,max:o.max,grid:{color:"#eef2ef"},ticks:{font:{family:"Inter"},callback:function(v){return v+(o.yUnit||"");}}}
        }};
    }

    /* ===================== router ===================== */
    var RENDER=[s0,s1,s2,s3,s4,s5];
    function buildNav(){
      var n=el("nav"),o="";
      for(var i=0;i<NAV.length;i++){o+='<button class="navbtn" data-i="'+NAV[i].i+'"><span class="msym">'+NAV[i].ic+'</span><span class="navtxt">'+NAV[i].t+'</span></button>';}
      n.innerHTML=o;
      var btns=n.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){(function(b){b.addEventListener("click",function(){location.hash="go="+(+b.getAttribute("data-i"));});})(btns[j]);}
    }
    function show(i){
      destroyCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
      var c=el("screen");
      (RENDER[i]||s0)(c);
    }
    buildNav();

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
