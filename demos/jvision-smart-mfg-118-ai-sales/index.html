<style>
  :root{
    --accent:#c2410c; --accent2:#fb923c; --accent-soft:#fff1e9;
    --bg:#f6f5f3; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#eceae6; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}

  .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);flex:0 0 auto}
  .logo .ms{font-size:22px;color:#fff}
  .brand h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{font-size:11px;margin:2px 0 0;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .pill{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:800;color:#7c2d12;font-size:13px;flex:0 0 auto}

  .nav-btn:hover{border-color:var(--accent2);color:var(--accent)}
  .nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(194,65,12,.28)}
  .wrap{padding:20px;max-width:1500px;margin:0 auto}

  .kpis{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:340px 1fr}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .lab .ms{font-size:17px;color:var(--accent)}
  .kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
  .kpi .sub{font-size:11px;margin-top:4px;font-weight:600;display:flex;align-items:center;gap:3px}
  .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  th{text-align:left;padding:9px 10px;font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}

  .oppo:hover{border-color:var(--accent2)}
  .oppo.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 10px rgba(194,65,12,.12)}
  .oppo .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .oppo .nm{font-weight:700;font-size:14px}
  .oppo .co{font-size:12px;color:var(--muted);margin-top:2px}

  .oppo .amt{font-weight:800;font-size:14px;color:var(--accent)}

  .field .fl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

  .mail-b{padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
  .tl{position:relative;padding-left:26px}
  .tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-i{position:relative;margin-bottom:16px}
  .tl-i:before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
  .tl-t{font-size:11px;color:var(--muted);font-weight:700}
  .tl-c{font-weight:700;font-size:13px;margin:2px 0 3px}
  .tl-d{font-size:12px;color:var(--muted);line-height:1.6}
  .qa-q{background:var(--accent-soft);border-radius:12px 12px 12px 0;padding:12px 14px;font-size:13px;font-weight:600;color:#7c2d12;max-width:88%}
  .qa-a{background:#faf9f7;border:1px solid var(--line);border-radius:12px 12px 0 12px;padding:14px;font-size:13px;line-height:1.8;margin-left:auto;max-width:92%}
  .src{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12px;margin-top:8px;background:#fff}
  .src .ms{color:var(--accent);font-size:18px;flex:0 0 auto}
  .src .rk{margin-left:auto;font-weight:800;color:var(--accent);font-size:12px}
  .diff{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;line-height:1.8}
  .diff .row{padding:7px 12px}
  .d-add{background:#eafbf0;border-left:3px solid var(--ok)}
  .d-del{background:#fdeeee;border-left:3px solid var(--bad);text-decoration:line-through;color:#9b9b9b}
  .d-eq{border-left:3px solid transparent}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  @media(max-width:1080px){ .kpis{grid-template-columns:1fr 1fr} }
  @media(max-width:820px){
    .g2,.g3,.split,.kpis{grid-template-columns:1fr}
    .top{padding:10px 14px}
    .wrap{padding:14px}
  }
  @media(max-width:560px){
    .nav-btn .lbl{display:none}
    .nav-btn{padding:9px 11px}
    .pill.hidesm{display:none}
  }
</style>
</head>
<body>
<div class="top">

<script>
"use strict";
var C={accent:"#c2410c",accent2:"#fb923c",ink:"#1f2430",muted:"#6b7280",line:"#eceae6",ok:"#16a34a",bad:"#dc2626",info:"#2563eb",warn:"#d97706"};
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};opt.chart=Object.assign(baseChart,opt.chart||{});try{var ch=new ApexCharts(el,opt);ch.render();charts.push(ch);}catch(e){}}

var NAV=[

var OPPOS=[
  {id:"OPP-2041",nm:"精機三廠 產線 MES 擴充",co:"鴻昱精密機械",amt:"NT$ 2,850,000",stage:"報價議合",prob:72,cls:"t-warn",owner:"陳彥廷",next:"08/16 回覆規格疑問",risk:"報價 08/25 到期",ai:["客戶關注交期與教育訓練，建議提案強調 4 週上線與到府教育。","競品為 A 廠，我方在售後支援得分較高，可附客戶見證。","決策者為廠長王先生，尚未確認，建議本週約定線上會議。"]},
  {id:"OPP-2038",nm:"CNC 稼動監控雲平台",co:"昇O智慧工廠",amt:"NT$ 1,420,000",stage:"方案評估",prob:55,cls:"t-info",owner:"陳彥廷",next:"08/18 提供 POC 計畫",risk:"預算待核准",ai:["客戶對稼動率 (OEE) 提升幅度有疑慮，建議附上同業 +12% 案例。","IT 部門要求私有雲部署，需確認資安白名單。","建議先推 30 天試用降低導入門檻。"]},

function s0(){

    list+='<div class="oppo'+(i===0?" sel":"")+'" data-op="'+i+'" onclick="selOp('+i+')">'+

function selOp(i){

}
function renderOpChart(i){
  var seeds=[[3,5,4,7,6,9,8,11],[2,3,5,4,6,5,7,8],[1,2,2,3,4,3,5,6],[4,6,5,8,7,10,12,14],[2,4,3,5,6,5,7,7],[5,7,9,8,10,12,11,13]];

  var one=charts.filter(function(c){return c.__op;});
  for(var z=0;z<one.length;z++){try{one[z].destroy();}catch(e){}}
  charts=charts.filter(function(c){return !c.__op;});
  var el=document.getElementById("c0a");if(!el)return;

  '<div class="scr-head"><h2><span class="ms">description</span>AI 郵件草擬</h2><p>依商機情境自動生成跟進郵件與提案草稿，業務審核採納後發送</p></div>'+
