<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Sales 智慧業務助理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#2563EB;
  --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden
}
button,a{font:inherit}
button,[role="button"],a{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24
}
.mono,.val,.amt,.co,.tl-t,td:nth-child(n+2){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
.app-header{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  min-height:68px;
  align-items:center;
  gap:18px;
  padding:12px clamp(16px,3vw,32px);
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:1px solid #1D4ED8
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;
  width:40px;
  height:40px;
  flex:0 0 auto;
  place-items:center;
  background:#fff;
  color:var(--color-primary);
  border:2px solid #BFDBFE;
  border-radius:9px
}
.brand-copy{min-width:0}
.brand h1{
  margin:0;
  overflow:hidden;
  font-size:17px;
  font-weight:700;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap
}
.brand p{
  margin:3px 0 0;
  overflow:hidden;
  color:#DBEAFE;
  font-size:11px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.system-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid #93C5FD;
  border-radius:999px;
  background:#1D4ED8;
  color:#fff;
  font-size:12px;
  font-weight:600;
  white-space:nowrap
}
.avatar{
  display:grid;
  width:36px;
  height:36px;
  flex:0 0 auto;
  place-items:center;
  border:2px solid #BFDBFE;
  border-radius:50%;
  background:#fff;
  color:#1E40AF;
  font-weight:700
}
.nav-shell{
  position:sticky;
  top:68px;
  z-index:40;
  overflow-x:auto;
  background:var(--color-card);
  border-bottom:1px solid var(--line);
  scrollbar-width:thin
}
nav{
  display:flex;
  width:max-content;
  min-width:100%;
  gap:4px;
  padding:8px clamp(12px,3vw,32px)
}
.nav-btn{
  display:inline-flex;
  min-height:42px;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.nav-btn:hover{background:var(--color-muted);color:var(--color-primary)}
.nav-btn.active{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:#fff
}
.wrap{width:min(1500px,100%);margin:0 auto;padding:22px clamp(14px,3vw,32px) 42px}
.scr-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:17px;
  padding-bottom:13px;
  border-bottom:2px solid var(--ink)
}
.scr-head h2{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  font-size:22px;
  line-height:1.25
}
.scr-head h2 .ms{color:var(--color-primary);font-size:25px}
.scr-head p{
  max-width:760px;
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  text-align:right
}
.grid{display:grid;gap:12px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{grid-template-columns:minmax(290px,340px) minmax(0,1fr)}
.card,.kpi,.mail,.ai-box{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--color-card)
}
.card{padding:15px}
.card-t{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 12px;
  color:var(--ink);
  font-size:13px;
  font-weight:700
}
.card-t .ms{color:var(--color-primary);font-size:18px}
.kpi{
  position:relative;
  padding:15px;
  border-top:3px solid var(--color-primary)
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600
}
.kpi .lab .ms{color:var(--color-primary);font-size:18px}
.kpi .val{
  margin-top:9px;
  color:var(--ink);
  font-size:25px;
  font-weight:700;
  letter-spacing:-.04em
}
.kpi .sub{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:5px;
  font-size:11px;
  font-weight:600
}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--muted)}
.b{font-weight:700}
.sm{font-size:12px}
.mut{color:var(--muted)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th{
  padding:10px;
  border-bottom:2px solid #CBD5E1;
  background:var(--color-muted);
  color:#334155;
  font-size:11px;
  font-weight:700;
  text-align:left;
  white-space:nowrap
}
td{
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle
}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
tbody tr:hover{background:#F8FAFF}
tbody tr:last-child td{border-bottom:0}
.table-scroll{overflow-x:auto}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-family:"Fira Sans",sans-serif;
  font-size:11px;
  font-weight:700;
  line-height:1;
  white-space:nowrap
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-mut{background:#F1F5F9;color:#475569}
.t-acc{background:#ECFDF5;color:#047857}
.bar{height:6px;overflow:hidden;border-radius:999px;background:#E2E8F0}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--color-primary)}
.ws-list{max-height:640px;overflow:auto;padding-right:3px}
.oppo{
  display:block;
  width:100%;
  margin:0 0 8px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  transition:background-color .18s ease,border-color .18s ease
}
.oppo:hover{border-color:#93C5FD;background:#F8FAFF}
.oppo.sel{border-color:var(--color-primary);background:#EFF6FF}
.oppo .r1,.oppo .r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oppo .nm{overflow:hidden;font-size:14px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.oppo .co{margin-top:3px;color:var(--muted);font-size:11px}
.oppo .r2{margin-top:10px}
.oppo .amt{color:#1D4ED8;font-size:13px;font-weight:700}
.ai-box{
  padding:15px;
  border-left:4px solid var(--color-primary);
  background:#F8FAFF
}
.ai-line{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;font-size:13px;line-height:1.55}
.ai-line:last-of-type{margin-bottom:0}
.ai-line .ms{flex:0 0 auto;margin-top:1px;color:var(--color-primary);font-size:18px}
.btn{
  display:inline-flex;
  min-height:40px;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 14px;
  border:1px solid transparent;
  border-radius:7px;
  font-size:13px;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.btn-p{background:var(--color-accent);color:#fff}
.btn-p:hover{background:#047857}
.btn-o{border-color:var(--color-primary);background:#fff;color:var(--color-primary)}
.btn-o:hover{background:#EFF6FF}
.btn .ms{font-size:18px}
.field{
  padding:11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--color-muted)
}
.field .fl{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase
}
.risk-field{border-color:#FDE68A;background:#FFFBEB}
.risk-field .fl{color:#854D0E}
.mail{overflow:hidden}
.mail-h{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  background:var(--color-muted);
  font-size:13px;
  line-height:1.55
}
.mail-b{padding:17px;font-size:13px;line-height:1.9;white-space:pre-wrap}
.hl{
  padding:1px 3px;
  border-bottom:2px solid var(--color-accent);
  background:#D1FAE5;
  color:#064E3B
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;
  min-height:30px;
  align-items:center;
  padding:5px 10px;
  border:1px solid #BFDBFE;
  border-radius:999px;
  background:#EFF6FF;
  color:#1E40AF;
  font-size:12px;
  font-weight:600
}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:#BFDBFE}
.tl-i{position:relative;margin-bottom:17px}
.tl-i:last-child{margin-bottom:0}
.tl-i::before{
  content:"";
  position:absolute;
  top:3px;
  left:-24px;
  width:11px;
  height:11px;
  border:3px solid #DBEAFE;
  border-radius:50%;
  background:var(--color-primary)
}
.tl-t{color:#1D4ED8;font-size:11px;font-weight:700}
.tl-c{margin:3px 0;font-size:13px;font-weight:700}
.tl-d{color:var(--muted);font-size:12px;line-height:1.55}
.qa-q{
  max-width:88%;
  padding:12px 14px;
  border-left:4px solid var(--color-primary);
  border-radius:7px;
  background:#EFF6FF;
  color:#1E3A8A;
  font-size:13px;
  font-weight:600
}
.qa-a{
  max-width:92%;
  margin:12px 0 0 auto;
  padding:14px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  font-size:13px;
  line-height:1.8
}
.src{
  display:flex;
  min-height:42px;
  align-items:center;
  gap:8px;
  margin-top:7px;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  font-size:12px
}
.src .ms{flex:0 0 auto;color:var(--color-primary);font-size:18px}
.src .rk{margin-left:auto;color:#1D4ED8;font-family:"Fira Code",monospace;font-weight:700}
.diff{overflow:hidden;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.7}
.diff .row{padding:8px 12px;border-bottom:1px solid var(--line)}
.diff .row:last-child{border-bottom:0}
.d-add{border-left:4px solid var(--ok);background:#ECFDF5}
.d-add::before{content:"+ 新增  ";color:var(--ok);font-family:"Fira Code",monospace;font-weight:700}
.d-del{border-left:4px solid var(--bad);background:#FEF2F2;color:#64748B;text-decoration:line-through}
.d-del::before{content:"− 刪除  ";color:#B91C1C;font-family:"Fira Code",monospace;font-weight:700;text-decoration:none}
.d-eq{border-left:4px solid transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px}
.chart-box{min-width:0;overflow:hidden}
.screen-enter>.scr-head,.screen-enter>.grid,.grid-item{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.screen-enter>.grid:nth-child(2){animation-delay:.05s}
.screen-enter>.grid:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:300px minmax(0,1fr)}
}
@media(max-width:820px){
  .g2,.g3,.split{grid-template-columns:1fr}
  .scr-head{display:block}
  .scr-head p{margin-top:6px;text-align:left}
  .ws-list{max-height:420px}
}
@media(max-width:560px){
  .app-header{min-height:62px;padding:10px 14px}
  .nav-shell{top:62px}
  .brand p,.system-pill{display:none}
  .brand h1{font-size:15px}
  nav{padding:7px 10px}
  .nav-btn{min-width:43px;justify-content:center;padding:9px 10px}
  .nav-btn .lbl{display:none}
  .wrap{padding:16px 12px 32px}
  .kpis{grid-template-columns:1fr}
  .scr-head h2{font-size:19px}
  .card,.kpi,.ai-box{padding:13px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
}
</style>
</head>

<script>
"use strict";

var charts=[];

}

function kpi(ic,lab,val,sub,dir){

var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++)h+='<button type="button" class="nav-btn" data-i="'+i+'" aria-label="'+esc(NAV[i].t)+'" onclick="location.hash=\'v'+i+'\'"><span class="ms" aria-hidden="true">'+NAV[i].ic+'</span><span class="lbl">'+esc(NAV[i].t)+'</span></button>';
  document.getElementById("nav").innerHTML=h
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll(".nav-btn");
  for(var k=0;k<btns.length;k++){
    btns[k].className="nav-btn"+(k===i?" active":"");
    btns[k].setAttribute("aria-current",k===i?"page":"false")
  }
  var container=document.getElementById("screen");
  container.className="";
  container.innerHTML=(SCREENS[i]||s0)();
  if(i===0){
    var d=document.getElementById("opDetail");
    if(d)d.innerHTML=opDetailHTML(0)
  }
  void container.offsetHeight;
  container.className="screen-enter";
  initCharts(i)
}
buildNav();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
