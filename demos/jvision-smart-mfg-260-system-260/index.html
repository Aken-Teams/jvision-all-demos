<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>技術路線圖管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="技術路線圖視覺化、TRL 成熟度評估與產品世代對應的研發管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#2563EB;
  --ink:var(--color-foreground);
  --muted:var(--color-muted-foreground);
  --line:var(--color-border);

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#DCFCE7;
  --bg:var(--color-background);
  --card:var(--color-card);
  --amber:var(--color-accent);
  --red:var(--color-destructive);
  --slate:#64748B;

  --font-display:"Exo",system-ui,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --shadow-sm:0 2px 8px rgba(20,83,45,.06);
  --shadow-md:0 14px 34px rgba(20,83,45,.09),0 2px 8px rgba(20,83,45,.05);
  --shadow-hover:0 18px 42px rgba(20,83,45,.13),0 4px 12px rgba(20,83,45,.06);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  min-height:100vh;
  font-family:var(--font-display);
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 5%,rgba(34,197,94,.14),transparent 24rem),
    radial-gradient(circle at 96% 32%,rgba(217,119,6,.07),transparent 25rem),
    linear-gradient(180deg,#F7FFF9 0,var(--color-background) 42%,#ECF9F0 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.36;
  background-image:
    linear-gradient(rgba(21,128,61,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.035) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,#000,transparent 78%);
}
button,a,[data-i]{cursor:pointer;}
button,input,select,textarea{font:inherit;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:8px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:var(--color-on-primary);
  background:rgba(20,83,45,.96);
  border-bottom:1px solid rgba(187,247,208,.24);
  box-shadow:0 10px 28px rgba(20,83,45,.18);
  backdrop-filter:blur(16px);
}
.topbar::after{
  content:"";
  position:absolute;
  right:-5rem;
  top:-7rem;
  width:23rem;
  height:15rem;
  pointer-events:none;
  border-radius:47% 53% 62% 38% / 42% 43% 57% 58%;
  background:linear-gradient(135deg,rgba(34,197,94,.25),rgba(255,255,255,.04));
  transform:rotate(-9deg);
}
.topbar-in{
  position:relative;
  z-index:1;
  max-width:1400px;
  margin:0 auto;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .logo{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.34);
  border-radius:17px 12px 18px 11px;
  color:#fff;
  background:linear-gradient(145deg,rgba(34,197,94,.5),rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 8px 18px rgba(0,0,0,.12);
}
.brand .logo .material-symbols-outlined{font-size:24px;color:#F0FDF4;}
.brand h1{margin:0;font-size:17px;font-weight:700;line-height:1.2;letter-spacing:.02em;}
.brand p{margin:3px 0 0;color:#DCFCE7;font-family:var(--font-mono);font-size:10.5px;font-weight:400;letter-spacing:.02em;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px;}
.top-actions .chip{
  min-height:36px;
  padding:7px 12px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#F0FDF4;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:500;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.top-actions .chip:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.4);transform:translateY(-1px);}
.top-actions .chip .material-symbols-outlined{font-size:17px;}
.avatar{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  color:#052E16;
  background:#86EFAC;
  border:2px solid rgba(255,255,255,.72);
  border-radius:48% 52% 45% 55% / 55% 43% 57% 45%;
  box-shadow:0 5px 13px rgba(0,0,0,.14);
  font-size:13px;
  font-weight:700;
}

.navtabs{
  position:sticky;
  top:72px;
  z-index:45;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);
  box-shadow:0 5px 20px rgba(20,83,45,.06);
  backdrop-filter:blur(14px);
}
.navtabs-in{
  max-width:1400px;
  margin:0 auto;
  padding:7px 16px;
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.navbtn{
  appearance:none;
  min-height:44px;
  padding:9px 13px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  color:#3E5F4B;
  background:transparent;
  border:1px solid transparent;
  border-radius:14px 10px 15px 11px;
  font-family:inherit;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.navbtn .material-symbols-outlined{font-size:19px;}
.navbtn:hover{color:var(--color-primary);background:#ECFDF3;border-color:#D1FAE0;transform:translateY(-1px);}
.navbtn.active{
  color:#fff;
  background:linear-gradient(135deg,#166534,var(--color-primary));
  border-color:#166534;
  box-shadow:0 7px 16px rgba(21,128,61,.2);
}

main{max-width:1400px;margin:0 auto;padding:30px 22px 72px;}
#screen{animation:chapter-reveal .38s ease-out both;}
.screen-head{
  position:relative;
  margin:0 0 22px;
  padding:9px 0 10px 18px;
}
.screen-head::before{
  content:"";
  position:absolute;
  left:0;
  top:5px;
  bottom:5px;
  width:5px;
  border-radius:6px;
  background:linear-gradient(180deg,var(--color-secondary),var(--color-primary));
}
.screen-head h2{margin:0;display:flex;align-items:center;gap:10px;color:#123F25;font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1.2;letter-spacing:-.02em;}
.screen-head h2 .material-symbols-outlined{display:grid;place-items:center;color:var(--color-primary);font-size:29px;}
.screen-head p{max-width:780px;margin:7px 0 0;color:var(--muted);font-size:13.5px;line-height:1.7;}

.grid{display:grid;gap:16px;min-width:0;}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#86EFAC;box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.card{
  position:relative;
  overflow:hidden;
  padding:20px;
  border-radius:22px 17px 24px 18px;
}
.card::after{
  content:"";
  position:absolute;
  right:-34px;
  top:-42px;
  width:104px;
  height:86px;
  pointer-events:none;
  border-radius:44% 56% 66% 34% / 47% 38% 62% 53%;
  background:rgba(34,197,94,.055);
  transform:rotate(18deg);
}
.card > *{position:relative;z-index:1;}
.card h3{margin:0 0 16px;display:flex;align-items:center;gap:8px;color:#174B2B;font-size:14px;font-weight:700;line-height:1.45;letter-spacing:.01em;}
.card h3 .material-symbols-outlined{
  width:29px;
  height:29px;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#E7FBEF;
  border-radius:11px 8px 12px 9px;
  font-size:18px;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:18px 18px 17px;
  border-radius:19px 14px 21px 15px;
}
.kpi::before{
  content:"";
  position:absolute;
  left:0;
  top:15px;
  bottom:15px;
  width:4px;
  border-radius:0 6px 6px 0;
  background:linear-gradient(180deg,var(--color-secondary),var(--color-primary));
}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-35px;
  width:90px;
  height:70px;
  border-radius:58% 42% 45% 55% / 51% 58% 42% 49%;
  background:rgba(34,197,94,.07);
}
.kpi .lab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:600;}
.kpi .lab .material-symbols-outlined{color:var(--color-primary);font-size:18px;}
.kpi .val{position:relative;z-index:1;margin-top:8px;color:#123F25;font-family:var(--font-mono);font-size:27px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.kpi .val small{color:var(--muted);font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .delta{position:relative;z-index:1;margin-top:7px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;}
.kpi .delta.up{color:#137038;}
.kpi .delta.down{color:#B91C1C;}

.chart-wrap{position:relative;width:100%;height:280px;overflow:hidden;}
.chart-wrap.sm{height:230px;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-color:#86EFAC #ECFDF3;}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:12.5px;}
th,td{padding:12px 13px;text-align:left;white-space:nowrap;border-bottom:1px solid #D9F4E2;}
th{
  color:#345344;
  background:#EFFBF3;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.055em;
  text-transform:uppercase;
}
th:first-child{border-radius:11px 0 0 0;}
th:last-child{border-radius:0 11px 0 0;}
td{color:#244C34;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#F4FCF6;}
tbody tr:last-child td{border-bottom:0;}
td:nth-child(n+2){font-variant-numeric:tabular-nums;}
td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(6){font-family:var(--font-mono);}
td:has(.bar){text-align:right;}

.badge{
  min-height:25px;
  padding:4px 9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.b-green{color:#14532D;background:#DCFCE7;}
.b-amber{color:#78350F;background:#FEF3C7;}
.b-red{color:#991B1B;background:#FEE2E2;}
.b-blue{color:#1E3A8A;background:#DBEAFE;}
.b-slate{color:#334155;background:#E2E8F0;}
.bar{height:9px;min-width:60px;overflow:hidden;background:#E4EEE7;border:1px solid #D3E6D8;border-radius:999px;}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));}

.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;min-width:940px;}
.col{
  min-width:0;
  padding:13px;
  background:linear-gradient(180deg,#F0FAF3,#F8FCF9);
  border:1px solid var(--line);
  border-radius:18px 13px 20px 15px;
}
.col-h{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;color:#174B2B;font-size:12.5px;font-weight:700;}
.col-h .cnt{min-width:27px;padding:3px 8px;text-align:center;color:#315843;background:#fff;border:1px solid var(--line);border-radius:999px;font-family:var(--font-mono);font-size:10px;}
.tk{
  margin-bottom:10px;
  padding:13px;
  color:#244C34;
  background:#fff;
  border:1px solid #CDEFD8;
  border-left:4px solid var(--color-primary);
  border-radius:13px 9px 15px 10px;
  box-shadow:0 4px 12px rgba(20,83,45,.05);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.tk:last-child{margin-bottom:0;}
.tk:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(20,83,45,.1);border-color:#86EFAC;}
.tk .tk-t{font-size:12.5px;font-weight:700;line-height:1.45;}
.tk .tk-m{margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-family:var(--font-mono);font-size:10px;}
.tk .tk-f{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tk .who{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-weight:600;}
.tk .dot{width:24px;height:24px;display:grid;place-items:center;color:#14532D;background:#DCFCE7;border:1px solid #86EFAC;border-radius:48% 52% 42% 58% / 52% 45% 55% 48%;font-size:10px;font-weight:700;}

.rm{min-width:660px;}
.rm-row{display:grid;grid-template-columns:155px 1fr;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed #CDEFD8;}
.rm-lab{min-width:0;color:#234C33;font-size:12px;font-weight:700;}
.rm-lab small{display:block;margin-top:3px;color:var(--muted);font-family:var(--font-mono);font-size:9.5px;font-weight:400;}
.rm-track{position:relative;height:29px;overflow:hidden;background:repeating-linear-gradient(90deg,#EDF7F0 0,#EDF7F0 calc(25% - 1px),#D4EBDD calc(25% - 1px),#D4EBDD 25%);border:1px solid #D9EEE0;border-radius:10px;}
.rm-seg{position:absolute;top:4px;height:19px;padding:0 8px;display:flex;align-items:center;overflow:hidden;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px 6px 10px 7px;box-shadow:0 2px 5px rgba(20,83,45,.16);font-size:9.5px;font-weight:700;white-space:nowrap;}
.rm-scale{display:grid;grid-template-columns:155px 1fr;gap:12px;margin-bottom:5px;}
.rm-scale .yrs{display:grid;grid-template-columns:repeat(4,1fr);color:var(--muted);font-family:var(--font-mono);font-size:9.5px;font-weight:500;text-align:center;}
.rm-scale .yrs span{padding:4px 0;border-left:1px solid var(--line);}

.ladder{display:flex;flex-direction:column-reverse;gap:6px;}
.rung{padding:9px 11px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px 9px 14px 10px;transition:transform .18s ease,border-color .18s ease;}
.rung:hover{transform:translateX(3px);border-color:#86EFAC;}
.rung .n{width:30px;height:30px;flex:none;display:grid;place-items:center;color:#fff;border:2px solid rgba(255,255,255,.65);border-radius:10px 7px 11px 8px;font-family:var(--font-mono);font-size:12px;font-weight:700;box-shadow:0 3px 8px rgba(20,83,45,.12);}
.rung .tx{font-size:12px;font-weight:600;}
.rung .tx small{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:400;}

.matrix{width:100%;min-width:580px;border-collapse:separate;border-spacing:4px;font-size:11.5px;}
.matrix th,.matrix td{padding:9px 8px;text-align:center;border:0;border-radius:9px;}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;text-align:left;font-weight:700;background:#EFFBF3;box-shadow:5px 0 10px rgba(20,83,45,.04);}
.cell{width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px 7px 11px 8px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;box-shadow:0 2px 5px rgba(20,83,45,.1);}

.res-row{display:grid;grid-template-columns:minmax(130px,1fr) 130px 70px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #D9F4E2;}
.res-row:last-of-type{border-bottom:0;}
.res-row .nm{font-size:12.5px;font-weight:700;}
.res-row .nm small{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:400;}
.res-row .pct{text-align:right;font-family:var(--font-mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:linear-gradient(var(--color-secondary),var(--color-border));}
.tl-item{position:relative;padding:0 0 18px 13px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-20px;top:4px;width:11px;height:11px;background:var(--color-primary);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #86EFAC;}
.tl-item .tl-t{margin-top:3px;color:#174B2B;font-size:12.5px;font-weight:700;}
.tl-item .tl-d{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.6;}
.tl-item .tl-time{color:#166534;font-family:var(--font-mono);font-size:9.5px;font-weight:500;}
.note{margin-top:12px;padding:12px 14px;color:#3F5448;background:#F4FAF6;border:1px solid #CDEFD8;border-left:4px solid var(--color-accent);border-radius:12px 9px 14px 10px;font-size:11.5px;line-height:1.7;}
.note b{color:#174B2B;}
.legend{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;color:#455B4E;font-size:10.5px;font-weight:600;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;display:inline-block;border:1px solid rgba(0,0,0,.12);border-radius:4px 3px 5px 3px;}

@keyframes chapter-reveal{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g-2{grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);}
  main{padding-inline:18px;}
}
@media(max-width:820px){
  .topbar-in{padding:11px 16px;}
  .navtabs{top:66px;}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,minmax(230px,1fr));min-width:500px;}
  .card{padding:17px;}
}
@media(max-width:560px){
  .brand h1{font-size:14px;}
  .brand p{display:none;}
  .brand .logo{width:40px;height:40px;}
  .top-actions .chip{width:38px;padding:7px;justify-content:center;}
  .top-actions .chip span.lbl{display:none;}
  .avatar{width:35px;height:35px;}
  .navtabs{top:63px;}
  .navtabs-in{padding:6px 10px;}
  .navbtn{min-width:44px;padding:9px 11px;justify-content:center;}
  .navbtn span.lbl{display:none;}
  main{padding:22px 12px 52px;}
  .screen-head{margin-bottom:17px;padding-left:14px;}
  .screen-head h2{font-size:21px;}
  .screen-head p{font-size:12px;}

  var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];

  function buildNav(){
    var nav=document.getElementById("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
      b.addEventListener("click",function(){ location.hash="v"+b.getAttribute("data-i"); });
    });
  }

  function show(i){
    var cont=document.getElementById("screen");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
      b.classList.toggle("active",+b.getAttribute("data-i")===i);
    });
    SCREENS[i](cont);
  }

  buildNav();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
