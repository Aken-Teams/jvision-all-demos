<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>技術路線圖管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="技術路線圖視覺化、TRL 成熟度評估與產品世代對應的研發管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#15803d;--accent2:#4ade80;--accent-soft:#dcfce7;
      --ink:#0f2417;--muted:#5b6b60;--line:#e3ebe4;--bg:#f4f8f4;--card:#ffffff;
      --amber:#d97706;--red:#dc2626;--blue:#2563eb;--slate:#64748b;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    /* top nav */
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#14532d,#15803d 55%,#166534);color:#fff;box-shadow:0 2px 14px rgba(20,83,45,.28);}
    .topbar-in{max-width:1400px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);flex:none;}
    .brand .logo .material-symbols-outlined{font-size:23px;color:#eafff0;}
    .brand h1{font-size:16px;margin:0;font-weight:800;line-height:1.2;letter-spacing:.3px;}
    .brand p{font-size:11.5px;margin:2px 0 0;color:#c7f2d5;font-weight:500;}
    .top-actions{margin-left:auto;display:flex;align-items:center;gap:9px;}
    .top-actions .chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#eafff0;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;}
    .top-actions .chip .material-symbols-outlined{font-size:16px;}
    .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent2);color:#0b3d1f;font-weight:800;display:grid;place-items:center;font-size:13px;flex:none;}
    /* nav tabs */
    .navtabs{background:#0f3d22;}
    .navtabs-in{max-width:1400px;margin:0 auto;padding:0 12px;display:flex;gap:4px;flex-wrap:wrap;}
    .navbtn{appearance:none;border:0;background:transparent;color:#bfe6cd;font-family:inherit;font-size:13px;font-weight:600;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;border-bottom:3px solid transparent;white-space:nowrap;}
    .navbtn .material-symbols-outlined{font-size:19px;}
    .navbtn:hover{color:#fff;}
    .navbtn.active{color:#fff;border-bottom-color:var(--accent2);background:rgba(255,255,255,.05);}
    main{max-width:1400px;margin:0 auto;padding:20px 18px 60px;}
    .screen-head{margin:0 0 16px;}
    .screen-head h2{font-size:21px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px;}
    .screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
    .screen-head p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:760px;line-height:1.6;}
    /* generic */
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 1px 3px rgba(16,36,23,.04);min-width:0;}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
    .grid{display:grid;gap:14px;min-width:0;}
    .g-kpi{grid-template-columns:repeat(4,1fr);}
    .g-2{grid-template-columns:2fr 1fr;}
    .g-2e{grid-template-columns:1fr 1fr;}
    .g-3{grid-template-columns:repeat(3,1fr);}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0;position:relative;overflow:hidden;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
    .kpi .val{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:.3px;}
    .kpi .val small{font-size:13px;color:var(--muted);font-weight:600;}
    .kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;}
    .kpi .delta.up{color:var(--accent);}
    .kpi .delta.down{color:var(--red);}
    .chart-wrap{position:relative;height:280px;width:100%;overflow:hidden;}
    .chart-wrap.sm{height:230px;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
    th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
    th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#f8fbf8;}
    tbody tr:hover{background:#f6faf6;}
    .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
    .b-green{background:var(--accent-soft);color:#14532d;}
    .b-amber{background:#fef3c7;color:#92400e;}
    .b-red{background:#fee2e2;color:#991b1b;}
    .b-blue{background:#dbeafe;color:#1e40af;}
    .b-slate{background:#e2e8f0;color:#334155;}
    .bar{height:8px;border-radius:6px;background:#eef3ee;overflow:hidden;min-width:60px;}
    .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    /* kanban / roadmap */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0;}
    .col{background:#f0f6f1;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
    .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:800;}
    .col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted);}
    .tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,36,23,.05);border-left:4px solid var(--accent);}
    .tk .tk-t{font-size:13px;font-weight:700;line-height:1.35;}
    .tk .tk-m{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .tk .tk-f{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px;}
    .tk .who{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);}
    .tk .dot{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:#14532d;font-size:10.5px;font-weight:800;display:grid;place-items:center;}
    /* roadmap gantt */
    .rm{min-width:640px;}
    .rm-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
    .rm-lab{font-size:12.5px;font-weight:700;min-width:0;}
    .rm-lab small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px;}
    .rm-track{position:relative;height:26px;background:#f0f6f1;border-radius:7px;overflow:hidden;}
    .rm-seg{position:absolute;top:4px;height:18px;border-radius:6px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;}
    .rm-scale{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:4px;}
    .rm-scale .yrs{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--muted);font-weight:700;text-align:center;}
    .rm-scale .yrs span{border-left:1px solid var(--line);padding:3px 0;}
    /* trl ladder */
    .ladder{display:flex;flex-direction:column-reverse;gap:5px;}
    .rung{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;}
    .rung .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;}
    .rung .tx{font-size:12.5px;font-weight:600;}
    .rung .tx small{display:block;color:var(--muted);font-weight:500;font-size:11px;}
    /* matrix */
    .matrix{border-collapse:separate;border-spacing:0;min-width:560px;font-size:12px;width:100%;}
    .matrix th,.matrix td{border:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap;}
    .matrix th:first-child,.matrix td:first-child{text-align:left;font-weight:700;background:#f8fbf8;position:sticky;left:0;}
    .cell{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;}
    /* resource rows */
    .res-row{display:grid;grid-template-columns:1fr 130px 70px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
    .res-row .nm{font-size:13px;font-weight:700;}
    .res-row .nm small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px;}
    .res-row .pct{font-size:13px;font-weight:800;text-align:right;}
    .timeline{position:relative;padding-left:20px;}
    .timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 16px 12px;}
    .tl-item::before{content:"";position:absolute;left:-18px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
    .tl-item .tl-t{font-size:13px;font-weight:700;}
    .tl-item .tl-d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
    .tl-item .tl-time{font-size:11px;color:var(--accent);font-weight:700;}
    .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;background:#f8fbf8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:10px;}
    .legend span{display:inline-flex;align-items:center;gap:5px;}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
    @media(max-width:1024px){
      .g-kpi{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:820px){
      .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
      .board{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:560px){
      .navbtn span.lbl{display:none;}
      .navbtn{padding:11px 12px;}
      .brand p{display:none;}
      .top-actions .chip span.lbl{display:none;}
      .g-kpi{grid-template-columns:1fr 1fr;}
      .board{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
        <div>
          <h1>技術路線圖管理系統</h1>
          <p>Roadmap · TRL 評估 · 世代對應矩陣</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="chip"><span class="material-symbols-outlined">calendar_month</span><span class="lbl">FY2026 Q3</span></span>
        <span class="chip"><span class="material-symbols-outlined">notifications</span><span class="lbl">5 提醒</span></span>
        <div class="avatar">陳</div>
      </div>
    </div>
  </header>
  <nav class="navtabs"><div class="navtabs-in" id="nav"></div></nav>
  <main><div id="screen"></div></main>

  <script>
  var charts={};
  function destroyChart(id){ if(charts[id]){ try{charts[id].destroy();}catch(e){} charts[id]=null; } }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  var MODS=[
    {icon:"account_tree",name:"路線圖規劃",desc:"多世代技術路線圖視覺化排布與里程碑管理"},
    {icon:"science",name:"TRL 評估",desc:"技術就緒等級 TRL1-9 評估與晉級審查"},
    {icon:"rule",name:"世代對應矩陣",desc:"產品世代與關鍵技術對應與缺口盤點"},
    {icon:"insights",name:"市場需求對齊",desc:"市場趨勢與技術投資方向對齊分析"},
    {icon:"engineering",name:"研發資源配置",desc:"人力、預算與設備跨專案負載調配"},
    {icon:"monitoring",name:"里程碑追蹤",desc:"研發任務進度、風險與延誤即時追蹤"}
  ];

  var GREEN="#15803d",GREEN2="#4ade80",AMBER="#d97706",RED="#dc2626",BLUE="#2563eb",SLATE="#94a3b8";

  function head(i){
    var m=MODS[i];
    return '<div class="screen-head"><h2><span class="material-symbols-outlined">'+m.icon+'</span>'+m.name+'</h2><p>'+m.desc+'</p></div>';
  }

  /* ===== Screen 0: Roadmap board (signature) ===== */
  function screen0(c){
    var kpis=[
      {l:"技術主題",v:"34",u:"項",d:"+5 本季新增",up:1,ic:"account_tree"},
      {l:"進行中里程碑",v:"18",u:"個",d:"3 已提前",up:1,ic:"flag"},
      {l:"路線圖達成率",v:"78",u:"%",d:"+6% vs 上季",up:1,ic:"trending_up"},
      {l:"延誤主題",v:"4",u:"項",d:"需介入",up:0,ic:"warning"}
    ];
    var rm=[
      {n:"下世代電源模組",t:"平台 P3",segs:[{s:0,w:32,c:GREEN,x:"概念"},{s:33,w:34,c:BLUE,x:"開發"},{s:68,w:32,c:AMBER,x:"驗證"}]},
      {n:"800V SiC 逆變器",t:"核心零組件",segs:[{s:12,w:40,c:BLUE,x:"開發"},{s:54,w:46,c:AMBER,x:"驗證"}]},
      {n:"熱管理散熱系統",t:"共通技術",segs:[{s:0,w:50,c:GREEN,x:"概念"},{s:52,w:30,c:BLUE,x:"開發"}]},
      {n:"AI 診斷韌體",t:"軟體平台",segs:[{s:20,w:30,c:GREEN,x:"概念"},{s:52,w:48,c:BLUE,x:"開發"}]},
      {n:"高密度電池封裝",t:"平台 P4",segs:[{s:40,w:60,c:GREEN,x:"概念"}]}
    ];
    var cols=[
      {t:"規劃中",cnt:2,tasks:[
        {t:"下世代電源模組平台定義",m:["P3","2026 Q4"],w:"李",b:'<span class="badge b-slate">TRL3</span>'},
        {t:"AI 診斷韌體技術選型",m:["軟體","2027 Q1"],w:"周",b:'<span class="badge b-slate">TRL2</span>'}
      ]},
      {t:"開發中",cnt:3,tasks:[
        {t:"800V SiC 逆變器樣機",m:["核心","2026 Q3"],w:"陳",b:'<span class="badge b-blue">TRL5</span>'},
        {t:"熱管理散熱系統設計",m:["共通","2026 Q4"],w:"林",b:'<span class="badge b-blue">TRL4</span>'},
        {t:"高密度電池封裝概念驗證",m:["P4","2027 Q2"],w:"黃",b:'<span class="badge b-blue">TRL4</span>'}
      ]},
      {t:"驗證中",cnt:2,tasks:[
        {t:"逆變器 DVT 溫升驗證",m:["核心","2026 Q3"],w:"陳",b:'<span class="badge b-amber">TRL6</span>'},
        {t:"電源模組 EMC 測試",m:["P3","2026 Q3"],w:"李",b:'<span class="badge b-red">溫升超標</span>'}
      ]},
      {t:"已發布",cnt:2,tasks:[
        {t:"車規級 MCU 平台導入",m:["軟體","2026 Q2"],w:"周",b:'<span class="badge b-green">TRL9</span>'},
        {t:"第二代散熱基板量產",m:["共通","2026 Q1"],w:"林",b:'<span class="badge b-green">TRL9</span>'}
      ]}
    ];
    var h=head(0);
    h+='<div class="grid g-kpi" style="margin-bottom:14px">'+kpis.map(function(k){
      return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="delta '+(k.up?'up':'down')+'"><span class="material-symbols-outlined" style="font-size:14px">'+(k.up?'north_east':'priority_high')+'</span>'+k.d+'</div></div>';
    }).join('')+'</div>';
    // roadmap gantt
    h+='<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">account_tree</span>多世代技術路線圖（2026–2029）</h3><div class="tbl-scroll"><div class="rm"><div class="rm-scale"><div></div><div class="yrs"><span>2026</span><span>2027</span><span>2028</span><span>2029</span></div></div>';
    rm.forEach(function(r){
      var segs=r.segs.map(function(g){return '<div class="rm-seg" style="left:'+g.s+'%;width:'+g.w+'%;background:'+g.c+'">'+g.x+'</div>';}).join('');
      h+='<div class="rm-row"><div class="rm-lab">'+r.n+'<small>'+r.t+'</small></div><div class="rm-track">'+segs+'</div></div>';
    });
    h+='</div></div><div class="legend"><span><i style="background:'+GREEN+'"></i>概念</span><span><i style="background:'+BLUE+'"></i>開發</span><span><i style="background:'+AMBER+'"></i>驗證</span></div></div>';
    // kanban board
    h+='<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>技術主題看板</h3><div class="tbl-scroll"><div class="board">';
    cols.forEach(function(col){
      h+='<div class="col"><div class="col-h">'+col.t+'<span class="cnt">'+col.cnt+'</span></div>';
      col.tasks.forEach(function(tk){
        h+='<div class="tk"><div class="tk-t">'+tk.t+'</div><div class="tk-m"><span class="material-symbols-outlined" style="font-size:15px">sell</span>'+tk.m.join(' · ')+'</div><div class="tk-f"><span class="who"><span class="dot">'+tk.w+'</span>'+tk.w+'工程師</span>'+tk.b+'</div></div>';
      });
      h+='</div>';
    });
    h+='</div></div></div>';
    c.innerHTML=h;
  }

  /* ===== Screen 1: TRL assessment ===== */
  function screen1(c){
    var rungs=[
      {n:9,c:GREEN,t:"實際系統驗證完成",s:"量產環境成功運行"},
      {n:8,c:GREEN,t:"系統完成與認證",s:"測試與展示完成"},
      {n:7,c:GREEN2,t:"系統原型於運作環境",s:"車規 MCU 平台"},
      {n:6,c:AMBER,t:"相關環境技術展示",s:"逆變器 DVT 進行中"},
      {n:5,c:AMBER,t:"相關環境元件驗證",s:"熱管理系統"},
      {n:4,c:BLUE,t:"實驗室元件驗證",s:"電池封裝"},
      {n:3,c:SLATE,t:"概念驗證",s:"電源模組平台"},
      {n:2,c:SLATE,t:"技術概念形成",s:"AI 診斷韌體"},
      {n:1,c:SLATE,t:"基礎原理觀察",s:"—"}
    ];
    var rows=[
      {t:"800V SiC 逆變器",cur:5,tgt:7,owner:"陳工程師",due:"2026 Q4",st:'<span class="badge b-blue">審查中</span>'},
      {t:"下世代電源模組",cur:3,tgt:6,owner:"李工程師",due:"2027 Q1",st:'<span class="badge b-slate">待評估</span>'},
      {t:"熱管理散熱系統",cur:5,tgt:6,owner:"林工程師",due:"2026 Q4",st:'<span class="badge b-green">通過</span>'},

  function show(i){
    var cont=document.getElementById("screen");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
      b.classList.toggle("active",+b.getAttribute("data-i")===i);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
