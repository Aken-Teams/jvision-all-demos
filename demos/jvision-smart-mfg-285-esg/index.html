<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESG永續管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#ede9fe;
  --bg:#f5f4fb; --card:#ffffff; --ink:#1e1b2e; --muted:#6b6880; --line:#e7e5f0;
  --sidebar:#231c3a; --sidebar2:#2f2650; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 1px 3px rgba(35,28,58,.08),0 8px 24px rgba(35,28,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:linear-gradient(185deg,var(--sidebar),var(--sidebar2));color:#e9e6f5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;display:block;letter-spacing:.3px}
.brand span{font-size:11px;color:#b6aede;letter-spacing:1px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.nav .lbl{font-size:11px;color:#8b83b8;padding:8px 12px 4px;letter-spacing:1px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;background:transparent;color:#cfc9e8;font-family:inherit;font-size:14px;font-weight:500;border-radius:10px;cursor:pointer;text-align:left;width:100%;transition:.15s;min-width:0}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn small{display:block;font-size:11px;color:#9089bd;font-weight:400}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(109,40,217,.4)}
.navbtn.on small{color:#e6ddff}
.sidefoot{padding:14px 18px;font-size:11px;color:#8b83b8;border-top:1px solid rgba(255,255,255,.08)}
.sidefoot .dot{width:7px;height:7px;border-radius:50%;background:#34d399;display:inline-block;margin-right:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px;font-weight:800}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.topbar .spacer{flex:1;min-width:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.chip .material-symbols-outlined{font-size:16px}
.content{padding:22px 26px 40px;min-width:0}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.4fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .cap{font-size:12px;color:var(--muted);margin-bottom:14px}
.kpi .material-symbols-outlined{font-size:22px}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .d{font-size:12px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:var(--accent-soft);color:var(--accent)}.t-mut{background:#eef0f4;color:#64748b}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9fd}
td{padding:11px 12px;border-bottom:1px solid #f1eff7;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.bar{height:7px;border-radius:99px;background:#eceaf4;overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chartbox{overflow:hidden;min-width:0}
.section-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin:6px 0 12px;display:flex;align-items:center;gap:7px}
.section-title .material-symbols-outlined{font-size:18px;color:var(--accent)}
.flowinfo{background:linear-gradient(120deg,#f3f0fe,#faf9ff);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:18px;display:flex;gap:14px;align-items:flex-start}
.flowinfo .material-symbols-outlined{color:var(--accent);font-size:22px;flex:0 0 auto;margin-top:1px}
.flowinfo b{font-size:13px}.flowinfo p{font-size:12.5px;color:var(--muted);margin-top:2px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px}
.col{background:#faf9fd;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col .h{font-size:12.5px;font-weight:700;padding:4px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.col .h .n{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 11px;margin-bottom:8px}
.tk .ti{font-size:12.5px;font-weight:700}
.tk .mt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 18px}
.tl .it::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .it.done::before{background:var(--accent)}
.tl .it .tt{font-size:13px;font-weight:700}
.tl .it .tm{font-size:11.5px;color:var(--muted)}
.tl .it .td{font-size:12.5px;color:#4a4763;margin-top:3px}
.progline{display:flex;flex-direction:column;gap:14px}
.progline .row{display:flex;align-items:center;gap:12px;font-size:13px}
.progline .row .nm{flex:0 0 130px;font-weight:600;min-width:0}
.progline .row .pct{flex:0 0 46px;text-align:right;font-weight:700;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.alertitem{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start}
.alertitem .ic{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:flex;align-items:center;justify-content:center}
.alertitem .ic .material-symbols-outlined{font-size:20px}
.alertitem .bd{min-width:0;flex:1}
.alertitem .bd .t{font-size:13px;font-weight:700}
.alertitem .bd .s{font-size:12px;color:var(--muted);margin-top:2px}
.mini-kpi{display:flex;gap:10px;align-items:center}
.mini-kpi .mv{font-size:22px;font-weight:800}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:column}
  .brand{border-bottom:1px solid rgba(255,255,255,.08)}
  .nav{flex-direction:row;flex-wrap:wrap;padding:10px;gap:6px;overflow:visible}
  .nav .lbl{display:none}
  .navbtn{width:auto;flex:1 1 auto;justify-content:center;padding:9px 12px}
  .navbtn small{display:none}
  .sidefoot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  .navbtn span.txt{display:none}
  .navbtn{flex:0 0 auto}
  .content{padding:16px 14px 34px}
  .topbar{padding:12px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div><b>ESG 永續平台</b><span>SUSTAINABILITY HUB</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">功能模組</div>
    </nav>
    <div class="sidefoot"><span class="dot"></span>資料同步正常 · v2.8.1</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">永續總覽</h1>
        <div class="sub" id="scr-sub">碳排強度、再生能源占比與各廠區數據完整率</div>
      </div>
      <div class="spacer"></div>
      <span class="chip"><span class="material-symbols-outlined">calendar_month</span>2026 Q3 · 揭露週期</span>
      <span class="chip"><span class="material-symbols-outlined">verified</span>純 UI 展示</span>
    </div>
    <div class="content"><div id="view"></div></div>
  </div>
</div>

<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"永續總覽",sub:"碳排強度、再生能源占比與各廠區數據完整率"},
  {icon:"co2",name:"碳盤查作業",sub:"範疇一、二、三活動數據蒐集與係數換算"},
  {icon:"bolt",name:"能源即時監控",sub:"各廠區用電負載、需量尖峰與異常告警"},
  {icon:"account_tree",name:"供應鏈盡職調查",sub:"供應商ESG問卷、回覆進度與風險分級"},
  {icon:"flag",name:"減碳目標追蹤",sub:"SBTi減碳路徑、年度目標與減量專案進度"},
  {icon:"fact_check",name:"報告與查證",sub:"GRI/SASB對應、報告草擬與第三方查證"}
];

(function(){
  var nav=document.getElementById("nav");
  for(var i=0;i<MODS.length;i++){
    var b=document.createElement("button");
    b.className="navbtn";b.setAttribute("data-i",i);
    b.innerHTML='<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
      '<span class="txt" style="min-width:0"><span>'+MODS[i].name+'</span><small>'+MODS[i].sub+'</small></span>';
    b.onclick=(function(k){return function(){location.hash="v"+k;};})(i);
    nav.appendChild(b);
  }
})();

var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
var PURPLE=["#6d28d9","#8b5cf6","#a78bfa","#c4b5fd","#ddd6fe"];
function bars(pct){return '<div class="bar"><span style="width:'+pct+'%"></span></div>';}

// ---------- SCREEN 0 : 永續總覽 ----------
function s0(){
  var kpi=[
    {ic:"co2",c:"#6d28d9",bg:"#ede9fe",v:"3.42",u:"tCO₂e/M營收",l:"碳排放強度",d:"-11%",dc:"up",di:"trending_down"},
    {ic:"solar_power",c:"#16a34a",bg:"#dcfce7",v:"38.6%",u:"",l:"再生能源占比",d:"+6.2pt",dc:"up",di:"trending_up"},
    {ic:"fact_check",c:"#0891b2",bg:"#cffafe",v:"91%",u:"",l:"數據完整率",d:"+30pt",dc:"up",di:"trending_up"},
    {ic:"flag",c:"#d97706",bg:"#fef3c7",v:"83%",u:"",l:"減碳目標達成",d:"+33pt",dc:"up",di:"trending_up"}
  ];
  var h='<div class="screen"><div class="grid g4">';
  for(var i=0;i<kpi.length;i++){var k=kpi[i];
    h+='<div class="card kpi"><div class="ico" style="background:'+k.bg+';color:'+k.c+'"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
       '<div class="v">'+k.v+' <span style="font-size:12px;color:var(--muted);font-weight:600">'+k.u+'</span></div>'+
       '<div class="l">'+k.l+'</div><div class="d '+k.dc+'"><span class="material-symbols-outlined" style="font-size:15px">'+k.di+'</span>'+k.d+' vs 去年</div></div>';
  }
  h+='</div>';
  h+='<div class="grid g23" style="margin-top:16px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">insights</span>月度碳排放趨勢（範疇別 tCO₂e）</h3><div class="cap">近 8 個月三大範疇排放量堆疊</div><div class="chartbox" id="c0a"></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>能源結構占比</h3><div class="cap">2026 Q3 用能來源</div><div class="chartbox" id="c0b"></div>'+
     '<div class="legend"><span><i style="background:#6d28d9"></i>市電</span><span><i style="background:#8b5cf6"></i>太陽能</span><span><i style="background:#a78bfa"></i>綠電憑證</span><span><i style="background:#c4b5fd"></i>天然氣</span></div></div>';
  h+='</div>';
  var plants=[
    {n:"台中一廠",e:1842,r:"42%",c:92,st:"達標",t:"t-ok"},
    {n:"台南二廠",e:2210,r:"31%",c:88,st:"追蹤中",t:"t-warn"},
    {n:"高雄三廠",e:1560,r:"46%",c:95,st:"達標",t:"t-ok"},
    {n:"桃園四廠",e:2680,r:"22%",c:79,st:"需改善",t:"t-bad"},
    {n:"竹科五廠",e:990,r:"51%",c:96,st:"達標",t:"t-ok"}
  ];
  h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">factory</span>各廠區永續指標</h3><div class="cap">單位排放、再生能源占比與數據完整率</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>廠區</th><th>月排放 tCO₂e</th><th>再生能源占比</th><th style="width:180px">數據完整率</th><th>狀態</th></tr></thead><tbody>';
  for(var p=0;p<plants.length;p++){var x=plants[p];
    h+='<tr><td><b>'+x.n+'</b></td><td>'+x.e+'</td><td>'+x.r+'</td><td><div style="display:flex;align-items:center;gap:8px">'+bars(x.c)+'<span style="font-size:12px;font-weight:700">'+x.c+'%</span></div></td><td><span class="tag '+x.t+'">'+x.st+'</span></td></tr>';
  }
  h+='</tbody></table></div></div></div>';
  document.getElementById("view").innerHTML=h;
  void document.getElementById("view").offsetHeight;
  mk("c0a",{
    chart:{type:"bar",height:300,stacked:true},
    series:[{name:"範疇一",data:[420,410,398,405,388,372,360,351]},{name:"範疇二",data:[980,965,940,928,905,880,861,842]},{name:"範疇三",data:[1520,1495,1470,1440,1410,1382,1350,1321]}],
    xaxis:{categories:["1月","2月","3月","4月","5月","6月","7月","8月"]},
    colors:["#6d28d9","#a78bfa","#ddd6fe"],
    plotOptions:{bar:{columnWidth:"56%",borderRadius:3}},
    dataLabels:{enabled:false},legend:{position:"top"},
    grid:{borderColor:"#eceaf4"},tooltip:{shared:true,intersect:false}
  });
  mk("c0b",{
    chart:{type:"donut",height:270},
    series:[54,26,12,8],labels:["市電","太陽能","綠電憑證","天然氣"],
    colors:PURPLE,legend:{show:false},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    plotOptions:{pie:{donut:{size:"64%"}}},stroke:{width:2}
  });
}

// ---------- SCREEN 1 : 碳盤查作業 ----------
function s1(){
  var h='<div class="screen">';
  h+='<div class="flowinfo"><span class="material-symbols-outlined">upload_file</span><div><b>階段 1 · 數據收集</b><p>由永續管理師自 EMS、電表與各廠區彙整範疇一、二、三活動數據，並上傳原始憑證作為佐證（RULE-01：無原始憑證的活動數據不得納入正式盤查）。</p></div></div>';
  h+='<div class="grid g4">';
  var mini=[
    {ic:"co2",l:"本期總排放",v:"2,614",u:"tCO₂e",c:"#6d28d9"},
    {ic:"local_fire_department",l:"範疇一（直接）",v:"351",u:"tCO₂e",c:"#dc2626"},
    {ic:"bolt",l:"範疇二（電力）",v:"842",u:"tCO₂e",c:"#d97706"},
    {ic:"local_shipping",l:"範疇三（價值鏈）",v:"1,321",u:"tCO₂e",c:"#0891b2"}
  ];
  for(var i=0;i<mini.length;i++){var m=mini[i];
    h+='<div class="card"><div class="mini-kpi"><span class="material-symbols-outlined" style="font-size:26px;color:'+m.c+'">'+m.ic+'</span><div><div class="mv">'+m.v+'</div><div style="font-size:11.5px;color:var(--muted)">'+m.l+' · '+m.u+'</div></div></div></div>';
  }
  h+='</div>';
  h+='<div class="grid g32" style="margin-top:16px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>排放源占比</h3><div class="cap">依活動類別</div><div class="chartbox" id="c1a"></div></div>';
  var rows=[
    {src:"外購電力",sc:"範疇二",act:"1,286,400 kWh",f:"0.494 kg/kWh",e:"635.4",st:"已佐證",t:"t-ok"},
    {src:"天然氣鍋爐",sc:"範疇一",act:"48,200 m³",f:"1.879 kg/m³",e:"90.6",st:"已佐證",t:"t-ok"},
    {src:"柴油發電機",sc:"範疇一",act:"12,400 L",f:"2.606 kg/L",e:"32.3",st:"待補憑證",t:"t-warn"},
    {src:"外購蒸汽",sc:"範疇二",act:"3,120 GJ",f:"66.3 kg/GJ",e:"206.9",st:"已佐證",t:"t-ok"},

  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=MODS[i].name;
  document.getElementById("scr-sub").textContent=MODS[i].sub;
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
