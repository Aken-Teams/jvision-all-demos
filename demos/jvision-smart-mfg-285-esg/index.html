<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESG永續管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:#059669;
  --accent2:#10b981;
  --accent-soft:#d1fae5;
  --bg:#ecfdf5;
  --card:#ffffff;
  --sidebar:#043c30;
  --sidebar2:#064e3b;
  --ok:#047857;
  --warn:#92400e;
  --bad:#b91c1c;
  --shadow:0 1px 2px rgba(6,78,59,.08),0 10px 30px rgba(6,78,59,.06);
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:12px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-width:320px;
  font-family:"Fira Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#a7f3d0;color:#022c22}

.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:1.25rem;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  direction:ltr;
  vertical-align:middle;
}

.app{display:flex;min-height:100vh}
.sidebar{
  width:264px;
  flex:0 0 264px;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  color:#ecfdf5;
  background:var(--sidebar);
  border-right:1px solid rgba(167,243,208,.24);
}
.brand{
  min-height:88px;
  padding:20px 20px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(167,243,208,.18);
}
.brand .logo{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#022c22;
  background:#6ee7b7;
  border:1px solid #a7f3d0;
  border-radius:var(--radius-sm);
  box-shadow:4px 4px 0 rgba(2,44,34,.45);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:10px;color:#a7f3d0;letter-spacing:.14em}
.nav{
  padding:18px 12px;
  display:flex;
  flex:1;
  flex-direction:column;
  gap:5px;
  overflow-y:auto;
}
.nav .lbl{
  padding:4px 12px 9px;
  color:#a7f3d0;
  font-size:10px;
  font-weight:600;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.navbtn{
  width:100%;
  min-width:0;
  min-height:48px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:#d1fae5;
  font-size:13px;
  font-weight:500;
  line-height:1.35;
  text-align:left;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.navbtn .material-symbols-outlined{flex:0 0 auto;font-size:20px;color:#6ee7b7}
.navbtn small{
  display:block;
  margin-top:2px;
  overflow:hidden;
  color:#a7f3d0;
  font-size:10px;
  font-weight:400;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.navbtn:hover{background:rgba(209,250,229,.09);border-color:rgba(167,243,208,.28);color:#fff}
.navbtn:hover .material-symbols-outlined{transform:translateX(2px)}
.navbtn.on{
  color:#022c22;
  background:#6ee7b7;
  border-color:#a7f3d0;
  box-shadow:4px 4px 0 #022c22;
}
.navbtn.on .material-symbols-outlined{color:#022c22}
.navbtn.on small{color:#064e3b}
.navbtn:focus-visible{outline-color:#fef3c7;outline-offset:2px}
.sidefoot{
  padding:15px 18px;
  color:#d1fae5;
  border-top:1px solid rgba(167,243,208,.18);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.sidefoot .dot{
  width:8px;
  height:8px;
  margin-right:7px;
  display:inline-block;
  border:2px solid #d1fae5;
  border-radius:50%;
  background:#34d399;
}

.main{display:flex;flex:1;min-width:0;flex-direction:column}
.topbar{
  min-height:76px;
  padding:13px clamp(16px,2.5vw,34px);
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(12px);
}
.topbar h1{font-size:clamp(18px,2vw,22px);font-weight:700;line-height:1.2;letter-spacing:-.02em}
.topbar .sub{margin-top:4px;color:var(--color-muted-foreground);font-size:11px;font-weight:400}
.topbar .spacer{flex:1;min-width:12px}
.chip{
  min-height:34px;
  padding:6px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#065f46;
  background:#ecfdf5;
  border:1px solid var(--color-border);
  border-radius:var(--radius-sm);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.chip .material-symbols-outlined{font-size:16px}
.content{width:100%;max-width:1600px;margin:0 auto;padding:24px clamp(14px,2.5vw,34px) 48px;min-width:0}
.screen{animation:screen-in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.4fr)}
.card{
  min-width:0;
  padding:19px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#34d399;box-shadow:0 2px 3px rgba(6,78,59,.08),0 14px 34px rgba(6,78,59,.09);transform:translateY(-2px)}
.card h3{
  margin-bottom:5px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#064e3b;
  font-size:13px;
  font-weight:700;
  letter-spacing:.005em;
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.card .cap{margin-bottom:15px;color:var(--color-muted-foreground);font-size:11px}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;top:0;right:0;width:40px;height:4px;background:var(--color-primary)}
.kpi .ico{
  width:40px;
  height:40px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(6,78,59,.1);
  border-radius:var(--radius-sm)!important;
}
.kpi .material-symbols-outlined{font-size:21px}
.kpi .v,.mini-kpi .mv{
  color:#022c22;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.04em;
}
.kpi .v{font-size:clamp(24px,2.5vw,29px)}
.kpi .l{margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.kpi .d{margin-top:9px;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700}
.up{color:#047857}.down{color:#b91c1c}

.tag{
  min-height:24px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{background:#ecfdf5;color:#047857}
.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#eff6ff;color:#1d4ed8}
.t-mut{background:#f1f5f9;color:#475569}

.tbl-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-sm)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:10px 12px;
  color:#334155;
  background:#e8f5f1;
  border-bottom:1px solid #6ee7b7;
  font-size:10px;
  font-weight:700;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid #d8eee6;vertical-align:middle}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f0fdf8}
tr:last-child td{border-bottom:none}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
table td:last-child,table th:last-child{text-align:right}
table td:nth-child(2):not(:first-child){font-family:"Fira Code",monospace}

.bar{height:7px;min-width:60px;overflow:hidden;background:#dbe7e5;border-radius:2px}
.bar>span{display:block;height:100%;background:var(--color-primary);border-radius:2px;transition:width .4s ease}
.chartbox{overflow:hidden;min-width:0}
.apexcharts-canvas,.apexcharts-text{font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif!important}
.apexcharts-text{fill:#475569!important}
.apexcharts-gridline{stroke:#d8eee6}
.apexcharts-tooltip{border:1px solid var(--color-border)!important;box-shadow:var(--shadow)!important}
.apexcharts-series[rel="1"] .apexcharts-bar-area,.apexcharts-series[rel="1"] .apexcharts-pie-area{fill:#059669!important;stroke:#059669!important}
.apexcharts-series[rel="2"] .apexcharts-bar-area,.apexcharts-series[rel="2"] .apexcharts-pie-area{fill:#10b981!important;stroke:#10b981!important}
.apexcharts-series[rel="3"] .apexcharts-bar-area,.apexcharts-series[rel="3"] .apexcharts-pie-area{fill:#6ee7b7!important;stroke:#6ee7b7!important}
.apexcharts-series[rel="4"] .apexcharts-pie-area{fill:#a7f3d0!important;stroke:#a7f3d0!important}

.section-title{
  margin:8px 0 12px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#475569;
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.section-title .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.flowinfo{
  margin-bottom:18px;
  padding:16px 18px;
  display:flex;
  align-items:flex-start;
  gap:13px;
  background:#ffffff;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  box-shadow:0 1px 2px rgba(6,78,59,.05);
}
.flowinfo>.material-symbols-outlined{margin-top:1px;flex:0 0 auto;color:var(--color-primary);font-size:21px}
.flowinfo b{color:#064e3b;font-size:12px}
.flowinfo p{margin-top:3px;color:var(--color-muted-foreground);font-size:11.5px}

.board{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:10px;min-width:640px}
.col{min-width:0;padding:10px;background:#f0fdf8;border:1px solid var(--color-border);border-radius:var(--radius-sm)}
.col .h{padding:4px 5px 10px;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700}
.col .h .n{padding:1px 7px;color:#475569;background:#fff;border:1px solid var(--color-border);border-radius:999px;font-family:"Fira Code",monospace;font-size:10px}
.tk{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:var(--radius-sm);box-shadow:0 1px 2px rgba(6,78,59,.05)}
.tk .ti{font-size:11.5px;font-weight:700}
.tk .mt{margin-top:5px;display:flex;justify-content:space-between;gap:6px;color:var(--color-muted-foreground);font-size:10px}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--color-border)}
.tl .it{position:relative;padding:0 0 18px}
.tl .it::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;background:#fff;border:3px solid var(--color-primary);border-radius:2px}
.tl .it.done::before{background:var(--color-primary);box-shadow:inset 0 0 0 2px #fff}
.tl .it .tt{font-size:12px;font-weight:700}
.tl .it .tm{color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px}
.tl .it .td{margin-top:3px;color:#334155;font-size:11.5px}

.progline{display:flex;flex-direction:column;gap:15px}
.progline .row{display:flex;align-items:center;gap:12px;font-size:12px}
.progline .row .nm{min-width:0;flex:0 0 130px;font-weight:600}
.progline .row .pct{flex:0 0 46px;color:#064e3b;font-family:"Fira Code",monospace;font-size:11px;font-weight:700;text-align:right}
.legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:13px;color:var(--color-muted-foreground);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block;border:1px solid rgba(6,78,59,.2);border-radius:2px}

.alertitem{margin-bottom:9px;padding:11px;display:flex;align-items:flex-start;gap:11px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:#fff}
.alertitem .ic{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(6,78,59,.1);border-radius:var(--radius-sm)!important}
.alertitem .ic .material-symbols-outlined{font-size:19px}
.alertitem .bd{min-width:0;flex:1}
.alertitem .bd .t{color:#064e3b;font-size:12px;font-weight:700}
.alertitem .bd .s{margin-top:2px;color:var(--color-muted-foreground);font-size:11px}
.mini-kpi{display:flex;align-items:center;gap:11px}
.mini-kpi .mv{font-size:21px}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex:none}
  .brand{min-height:70px;padding:14px 16px}
  .brand .logo{width:36px;height:36px;flex-basis:36px}
  .nav{padding:9px 10px;flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:thin}
  .nav .lbl{display:none}
  .navbtn{width:auto;min-width:48px;flex:1 0 auto;justify-content:center;padding:9px 11px}
  .navbtn small{display:none}
  .sidefoot{display:none}
  .topbar{top:0}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .card{padding:16px}
}
@media(max-width:560px){
  .navbtn span.txt{display:none}
  .navbtn{flex:0 0 48px;padding:9px}
  .topbar{padding:11px 14px}
  .topbar .sub{max-width:290px}
  .chip{min-height:32px;padding:5px 8px}
  .content{padding:16px 12px 34px}
  .flowinfo{padding:14px}
  .progline .row{gap:8px}
  .progline .row .nm{flex-basis:112px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .screen{animation:none}
  .card:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div><b>ESG 永續平台</b><span>SUSTAINABILITY HUB</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">功能模組</div>
    </nav>
    <div class="sidefoot"><span class="dot"></span>資料同步正常 · v2.8.1</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">永續總覽</h1>
        <div class="sub" id="scr-sub">碳排強度、再生能源占比與各廠區數據完整率</div>
      </div>
      <div class="spacer"></div>
      <span class="chip"><span class="material-symbols-outlined">calendar_month</span>2026 Q3 · 揭露週期</span>
      <span class="chip"><span class="material-symbols-outlined">verified</span>純 UI 展示</span>
    </div>
    <div class="content"><div id="view"></div></div>
  </div>
</div>

<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"永續總覽",sub:"碳排強度、再生能源占比與各廠區數據完整率"},
  {icon:"co2",name:"碳盤查作業",sub:"範疇一、二、三活動數據蒐集與係數換算"},
  {icon:"bolt",name:"能源即時監控",sub:"各廠區用電負載、需量尖峰與異常告警"},
  {icon:"account_tree",name:"供應鏈盡職調查",sub:"供應商ESG問卷、回覆進度與風險分級"},
  {icon:"flag",name:"減碳目標追蹤",sub:"SBTi減碳路徑、年度目標與減量專案進度"},
  {icon:"fact_check",name:"報告與查證",sub:"GRI/SASB對應、報告草擬與第三方查證"}
];

(function(){
  var nav=document.getElementById("nav");
  for(var i=0;i<MODS.length;i++){
    var b=document.createElement("button");
    b.className="navbtn";b.setAttribute("data-i",i);
    b.innerHTML='<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
      '<span class="txt" style="min-width:0"><span>'+MODS[i].name+'</span><small>'+MODS[i].sub+'</small></span>';
    b.onclick=(function(k){return function(){location.hash="v"+k;};})(i);
    nav.appendChild(b);
  }
})();

var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
var PURPLE=["#6d28d9","#8b5cf6","#a78bfa","#c4b5fd","#ddd6fe"];
function bars(pct){return '<div class="bar"><span style="width:'+pct+'%"></span></div>';}

// ---------- SCREEN 0 : 永續總覽 ----------
function s0(){

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=MODS[i].name;
  document.getElementById("scr-sub").textContent=MODS[i].sub;
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
