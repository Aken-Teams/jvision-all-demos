<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子發票管理系統（E-Invoice Management System）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#1e3a5f;--color-on-primary:#fff;
  --color-secondary:#2563eb;--color-on-secondary:#fff;
  --color-accent:#059669;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#0f172a;
  --color-card:#fff;--color-card-foreground:#0f172a;
  --color-muted:#f1f3f5;--color-muted-foreground:#475569;
  --color-border:#e4e7eb;--color-destructive:#dc2626;
  --color-on-destructive:#fff;--color-ring:#1e3a5f;
  --blue:#2563eb;--ink:#0f172a;--muted:#475569;--line:#e4e7eb;
  --ok:#047857;--warn:#a15c00;--bad:#b91c1c;--info:#1d4ed8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);color:var(--ink);
  font-family:"Source Sans 3",sans-serif;font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased
}
button{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);outline-offset:3px
}
.skip{
  position:fixed;left:14px;top:-80px;z-index:100;
  padding:10px 15px;background:#fff;color:var(--ink);
  border:2px solid var(--color-ring);text-decoration:none
}
.skip:focus{top:14px}
.icon{width:20px;height:20px;display:inline-block;flex:0 0 auto}
.topbar{
  position:sticky;top:0;z-index:50;color:#fff;
  background:var(--color-primary);
  border-bottom:1px solid rgba(255,255,255,.16);
  box-shadow:0 3px 10px rgba(15,23,42,.12)
}
.topbar-inner{
  max-width:1440px;margin:auto;padding:10px 22px;
  display:flex;align-items:center;gap:18px
}
.brand{display:flex;align-items:center;gap:11px;min-width:244px}
.logo{
  width:40px;height:40px;display:grid;place-items:center;
  background:#fff;color:var(--color-primary);border-radius:6px
}
.brand b{
  display:block;font:600 15px/1.3 Lexend,sans-serif;
  letter-spacing:.01em;white-space:nowrap
}
.brand small{display:block;color:#dce6f2;font-size:11px}
.nav{
  display:flex;gap:4px;margin-left:auto;overflow-x:auto;
  scrollbar-width:none;padding:2px
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;padding:8px 11px;border:1px solid transparent;
  border-radius:5px;background:transparent;color:#dce6f2;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  font-weight:600;transition:background .2s,color .2s,border-color .2s
}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.on{
  background:#fff;color:var(--color-primary);
  border-color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.12)
}
.wrap{max-width:1440px;margin:auto;padding:24px 22px 64px}
.screen{animation:reveal .35s ease-out both}
.scr-head{
  display:flex;align-items:flex-end;gap:16px;
  margin-bottom:16px;padding-bottom:14px;
  border-bottom:1px solid var(--line)
}
.scr-head h1{
  margin:0;font:600 clamp(21px,2vw,27px)/1.2 Lexend,sans-serif;
  letter-spacing:-.025em
}
.scr-head p{margin:5px 0 0;color:var(--muted);font-size:14px}
.tag{
  margin-left:auto;white-space:nowrap;color:var(--color-primary);
  background:#e8eef5;border-left:3px solid var(--color-secondary);
  padding:5px 10px;font:600 11px/1.4 Lexend,sans-serif;
  letter-spacing:.055em
}
.grid{display:grid;gap:12px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{
  background:var(--color-card);color:var(--color-card-foreground);
  border:1px solid var(--line);border-radius:7px;
  box-shadow:0 2px 5px rgba(15,23,42,.045)
}
.card{padding:16px}
.card h2{
  margin:0 0 13px;display:flex;align-items:center;gap:8px;
  font:600 14px/1.4 Lexend,sans-serif
}
.card h2 .icon{color:var(--color-secondary)}
.kpi{
  padding:15px 16px;position:relative;overflow:hidden;
  min-height:128px;transition:transform .2s,box-shadow .2s,border-color .2s
}
.kpi:hover{
  transform:translateY(-2px);border-color:#cbd5e1;
  box-shadow:0 5px 12px rgba(15,23,42,.08)
}
.kpi:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--color-secondary)
}
.kpi .lbl{
  color:var(--muted);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;padding-right:38px
}
.kpi .val{
  margin-top:8px;font:600 28px/1.1 Lexend,sans-serif;
  font-variant-numeric:tabular-nums
}
.kpi .val small{font:500 12px Source Sans 3,sans-serif;color:var(--muted)}
.kpi .dt{
  margin-top:8px;color:var(--muted);font-size:12px;
  display:flex;align-items:center;gap:5px
}
.kpi .ic{
  position:absolute;right:13px;top:13px;width:32px;height:32px;
  display:grid;place-items:center;background:#edf3f9;
  color:var(--color-primary);border-radius:5px
}
.up{color:var(--ok)!important}.dn{color:var(--bad)!important}.warn{color:var(--warn)!important}
.scroll{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{
  padding:9px 11px;border-bottom:1px solid var(--line);
  text-align:left;white-space:nowrap
}
th{
  background:#eef2f6;color:#334155;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:none
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f4f7fa}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.code,.date,.time{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:23px;
  padding:2px 8px;border:1px solid currentColor;border-radius:999px;
  font-size:11px;font-weight:700;line-height:1.2
}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:#ecfdf5;color:#047857}.c-warn{background:#fff7e6;color:#8a4b00}
.c-bad{background:#fef2f2;color:#b91c1c}.c-info{background:#eff6ff;color:#1d4ed8}
.c-mut{background:#f1f5f9;color:#475569}
.chart-wrap{position:relative;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:9px;min-width:1000px}
.col{background:#f1f4f7;border-top:3px solid var(--color-primary);padding:10px;min-width:0}
.col .ch{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:9px;font:600 12px Lexend,sans-serif
}
.col .n{
  min-width:24px;text-align:center;background:#fff;border:1px solid var(--line);
  padding:2px 6px;border-radius:999px;color:var(--color-primary)
}
.tk{
  background:#fff;border:1px solid var(--line);border-radius:5px;
  padding:9px;margin-bottom:8px;font-size:12px;
  transition:border-color .2s,transform .2s
}
.tk:hover{border-color:#94a3b8;transform:translateY(-1px)}
.tk b{display:block;margin-bottom:3px;font-size:12px}
.tk .m{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:6px;margin-top:7px;color:var(--muted)
}
.tl{position:relative;padding-left:23px}
.tl:before{
  content:"";position:absolute;left:7px;top:5px;bottom:5px;
  width:1px;background:#aebdca
}
.tl .it{position:relative;margin-bottom:16px}
.tl .it:last-child{margin-bottom:0}
.tl .it:before{
  content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;
  background:#fff;border:3px solid var(--color-secondary);border-radius:50%
}
.tl .t{color:var(--muted);font:600 11px var(--mono)}
.tl .d{margin:2px 0;font-weight:600;font-size:13px}
.tl .s,.mini{color:var(--muted);font-size:11px}
.bar{height:7px;background:#e2e8f0;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--color-secondary)}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.invoice{
  border:1px solid #94a3b8;padding:16px;background:#fff;
  box-shadow:inset 4px 0 var(--color-primary)
}
.invoice .hd{
  text-align:center;border-bottom:2px solid var(--color-primary);
  padding-bottom:10px;margin-bottom:8px
}
.invoice .tt{font:600 15px Lexend,sans-serif;letter-spacing:.08em}
.invoice .hd .num{
  margin-top:3px;color:var(--color-primary);
  font:700 21px var(--mono);letter-spacing:.1em
}
.invoice .rows{font-size:12px}
.invoice .rr{
  display:flex;justify-content:space-between;gap:10px;
  padding:5px 0;border-bottom:1px dotted #cbd5e1
}
.invoice .rr span:last-child{font-family:var(--mono);text-align:right}
.invoice .qr{
  width:74px;height:74px;margin:12px auto 0;
  background:
    linear-gradient(90deg,#0f172a 50%,transparent 50%) 0 0/12px 12px,
    linear-gradient(#0f172a 50%,transparent 50%) 0 0/12px 12px;
  border:7px solid #0f172a;outline:3px solid #fff;box-shadow:0 0 0 1px #0f172a
}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:12px}
.donut-legend .li{display:flex;align-items:center;gap:8px}
.donut-legend .dot{width:10px;height:10px;flex:0 0 auto}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px
}
.stat-row b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gauge{text-align:center}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .topbar-inner{align-items:flex-start;flex-wrap:wrap}
  .nav{order:2;width:100%;margin:0}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar-inner,.wrap{padding-left:14px;padding-right:14px}
  .brand{min-width:0}
  .scr-head{align-items:flex-start}
  .g2,.g3{grid-template-columns:1fr}
  .card{padding:13px}
  .hide560{display:none}
  .nav button{flex:1;justify-content:center;min-width:48px}
}
@media(max-width:480px){
  .brand small{display:none}
  .wrap{padding-top:18px}
  .g4{grid-template-columns:1fr}
  .scr-head{display:block}
  .tag{display:inline-block;margin:10px 0 0}
  .kpi{min-height:116px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important
  }
  .screen,.kpi:hover,.tk:hover{animation:none;transform:none}
}
</style>
</head>

function icon(name){return '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.monitoring)+'</svg>'}

const nav=document.getElementById("nav");
nav.innerHTML=NAV.map(x=>'<button type="button" data-i="'+x.i+'" aria-label="'+x.t+'">'+icon(x.ic)+'<span class="hide560">'+x.t+"</span></button>").join("");
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)location.hash="v"+b.dataset.i});
let charts={};
function C(id){return document.getElementById(id)}
function kill(id){if(charts[id]){try{charts[id].destroy()}catch(e){}delete charts[id]}}

function cardTitle(ic,t){return "<h2>"+icon(ic)+t+"</h2>"}
function chip(cls,txt){return '<span class="chip '+cls+'">'+txt+"</span>"}

 const cls=dir==="up"?"up":dir==="down"?"dn":dir==="warn"?"warn":"";

}
function opts(){return{maintainAspectRatio:false,responsive:true,animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:undefined,plugins:{legend:{position:"bottom",labels:{color:"#334155",font:{family:"Source Sans 3"}}}},scales:{y:{grid:{color:gridc},ticks:{color:"#475569"}},x:{grid:{display:false},ticks:{color:"#475569"}}}}}

function show(i){
 Object.keys(charts).forEach(k=>kill(k));
 const app=C("app");app.innerHTML='<div class="screen">'+SCREENS[i]()+"</div>";
 document.querySelectorAll("[data-i]").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 try{INITS[i]()}catch(e){}
}
function fromHash(){
