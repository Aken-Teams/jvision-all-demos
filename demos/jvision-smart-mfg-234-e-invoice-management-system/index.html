<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>電子發票管理系統（E-Invoice Management System）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0d9488;--accent2:#2dd4bf;--ink:#0f2926;--muted:#5b7a76;
  --bg:#f0f6f5;--card:#ffffff;--line:#dcebe9;--soft:#e8f4f2;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter','Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b7d73,#0d9488);color:#fff;box-shadow:0 4px 18px rgba(13,148,136,.25)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand b{font-size:16px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.85;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.12);color:#fff;padding:8px 13px;border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.24)}
.nav button.on{background:#fff;color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.scr-head h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.3px}
.scr-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.scr-head .tag{margin-left:auto;background:var(--soft);color:var(--accent);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .dt{font-size:11.5px;margin-top:4px;font-weight:600}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.up{color:var(--ok)}.dn{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--muted);font-weight:700;font-size:12px}
tbody tr:hover{background:#f7fcfb}
td.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.c-ok{background:#dcfce7;color:#15803d}
.c-warn{background:#fef3c7;color:#b45309}
.c-bad{background:#fee2e2;color:#b91c1c}
.c-info{background:#cffafe;color:#0e7490}
.c-mut{background:#eef2f1;color:#64756f}
.chart-wrap{position:relative;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-width:0}
@media(max-width:820px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:var(--soft);border-radius:12px;padding:10px;min-width:0}
.col .ch{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:var(--ink)}
.col .ch .n{background:#fff;border-radius:20px;padding:1px 8px;font-size:11px;color:var(--accent)}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tk b{font-size:12.5px;display:block;margin-bottom:3px}
.tk .m{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;margin-top:5px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;margin-bottom:15px}
.tl .it:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl .it .t{font-size:11px;color:var(--muted);font-weight:600}
.tl .it .d{font-size:13px;font-weight:600;margin:2px 0}
.tl .it .s{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mini{font-size:11.5px;color:var(--muted)}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.invoice{border:1.5px dashed var(--accent);border-radius:12px;padding:16px;background:linear-gradient(180deg,#fff,#f5fbfa)}
.invoice .hd{text-align:center;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}
.invoice .hd .tt{font-weight:800;font-size:15px;letter-spacing:2px}
.invoice .hd .num{font-family:'Inter',monospace;font-size:22px;font-weight:800;color:var(--accent);letter-spacing:3px;margin-top:3px}
.invoice .rows{font-size:12.5px}
.invoice .rr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--line)}
.invoice .qr{width:74px;height:74px;border-radius:8px;background:conic-gradient(from 45deg,#0d9488 0 25%,#0f2926 0 50%,#0d9488 0 75%,#0f2926 0);image-rendering:pixelated;margin:0 auto}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.donut-legend .li{display:flex;align-items:center;gap:8px}
.donut-legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-row b{font-variant-numeric:tabular-nums}
.gauge{text-align:center}
.hide560{}
@media(max-width:560px){.hide560{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">receipt_long</span></div>
      <div><b>電子發票管理系統</b><small>E-Invoice Management System</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<div class="wrap"><div id="app"></div></div>

<script>
"use strict";
var NAV=[
  {i:0,ic:"receipt_long",t:"發票開立"},
  {i:1,ic:"inventory_2",t:"字軌配號"},
  {i:2,ic:"account_tree",t:"平台上傳"},
  {i:3,ic:"history",t:"作廢折讓"},
  {i:4,ic:"fact_check",t:"對帳勾稽"},
  {i:5,ic:"monitoring",t:"營運儀表"}
];
(function(){
  var nv=document.getElementById("nav"),h="";
  for(var k=0;k<NAV.length;k++){
    h+='<button data-i="'+NAV[k].i+'"><span class="material-symbols-outlined">'+NAV[k].ic+'</span><span class="hide560">'+NAV[k].t+'</span></button>';
  }
  nv.innerHTML=h;
  nv.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

var charts={};
function killChart(id){ if(charts[id]){try{charts[id].destroy();}catch(e){} delete charts[id]; } }
function C(id){ return document.getElementById(id); }
var accent="#0d9488",accent2="#2dd4bf",gridc="#e2efed";

function head(t,p,tag){
  return '<div class="scr-head"><div><h1>'+t+'</h1><p>'+p+'</p></div><span class="tag">'+tag+'</span></div>';
}
function kpi(lbl,ic,val,unit,dt,dir){
  var cls=dir==="up"?"up":dir==="down"?"dn":dir==="warn"?"warn":"";
  var arr=dir==="up"?"▲":dir==="down"?"▼":"•";
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lbl">'+lbl+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    '<div class="dt '+cls+'">'+arr+' '+dt+'</div></div>';
}
function chip(cls,txt){return '<span class="chip '+cls+'">'+txt+'</span>';}

/* ===== SCREEN 0 : 發票開立 ===== */
function s0(){
  var rows=[
    ["INV-2026081-0918","B2B","O鑫科技股份有限公司","24681357","24,850","5%","已開立","c-ok"],
    ["INV-2026081-0919","B2C","一般消費者（手機載具）","—","1,299","5%","已開立","c-ok"],
    ["INV-2026081-0920","B2B","O昌實業有限公司","53197284","118,300","5%","待開立","c-warn"],
    ["INV-2026081-0921","B2C","一般消費者（會員載具）","—","688","5%","已開立","c-ok"],
    ["INV-2026081-0922","B2B","O達精密工業","78451236","9,450","0%","零稅率","c-info"],
    ["INV-2026081-0923","B2C","一般消費者（捐贈碼919）","—","2,100","5%","已開立","c-ok"],
    ["INV-2026081-0924","B2B","O群貿易股份有限公司","46820913","356,000","5%","待開立","c-warn"]
  ];
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td style="font-family:Inter">'+r[0]+'</td><td>'+chip(r[1]==="B2B"?"c-info":"c-mut",r[1])+'</td>'+
    '<td>'+r[2]+'</td><td>'+r[3]+'</td><td class="num">'+r[4]+'</td><td class="num">'+r[5]+'</td>'+
    '<td>'+chip(r[7],r[6])+'</td></tr>';
  }
  return head("發票開立","由 POS／ERP 匯入銷貨交易，自動帶入品項與稅別，一鍵開立 B2B／B2C 電子發票。","STAGE｜資料匯入")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("今日開立張數","receipt_long","1,284","張","較昨日 +8.6%","up")+
    kpi("今日銷售額","request_quote","5.72","百萬","含稅金額","")+
    kpi("待開立佇列","pending_actions","37","筆","其中 5 筆逾時","down")+
    kpi("開立成功率","task_alt","99.4","%","失敗 8 張","up")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">table_view</span>今日開立明細</h3>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>發票號碼</th><th>類型</th><th>買方</th><th>統一編號</th><th>金額</th><th>稅率</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">preview</span>電子發票預覽</h3>'+
      '<div class="invoice"><div class="hd"><div class="tt">電子發票證明聯</div><div class="mini" style="text-align:center">2026年07-08月</div><div class="num">UV-49001286</div></div>'+
      '<div class="rows"><div class="rr"><span>開立日期</span><span>2026-08-14 10:24</span></div>'+
      '<div class="rr"><span>隨機碼</span><span>7421</span></div>'+
      '<div class="rr"><span>賣方統編</span><span>90015678</span></div>'+
      '<div class="rr"><span>買方統編</span><span>24681357</span></div>'+
      '<div class="rr"><span>銷售額</span><span>23,667</span></div>'+
      '<div class="rr"><span>稅額(5%)</span><span>1,183</span></div>'+
      '<div class="rr" style="font-weight:800;color:var(--accent)"><span>總計</span><span>24,850</span></div></div>'+
      '<div style="margin-top:12px" class="qr"></div><div class="mini" style="text-align:center;margin-top:6px">QR-Code 條碼載具</div></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近 7 日開立量（張）</h3><div class="chart-wrap" style="height:230px"><canvas id="c0a"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>發票類型占比</h3>'+
      '<div class="grid g2"><div class="chart-wrap" style="height:190px"><canvas id="c0b"></canvas></div>'+
      '<div class="donut-legend" style="justify-content:center"><div class="li"><span class="dot" style="background:'+accent+'"></span>B2B 三聯式　58%</div>'+
      '<div class="li"><span class="dot" style="background:'+accent2+'"></span>B2C 載具　34%</div>'+
      '<div class="li"><span class="dot" style="background:#0891b2"></span>捐贈發票　5%</div>'+
      '<div class="li"><span class="dot" style="background:#94a3b8"></span>紙本列印　3%</div></div></div></div>'+
  '</div>';
}
function s0init(){
  killChart("c0a");killChart("c0b");
  charts["c0a"]=new Chart(C("c0a"),{type:"bar",data:{labels:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"],
    datasets:[{label:"開立張數",data:[1120,1245,980,1310,1188,1402,1284],backgroundColor:accent,borderRadius:6}]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:gridc}},x:{grid:{display:false}}}}});
  charts["c0b"]=new Chart(C("c0b"),{type:"doughnut",data:{labels:["B2B","B2C","捐贈","紙本"],
    datasets:[{data:[58,34,5,3],backgroundColor:[accent,accent2,"#0891b2","#94a3b8"],borderWidth:0}]},
    options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{display:false}}}});
}

/* ===== SCREEN 1 : 字軌配號 ===== */
function s1(){
  var tracks=[
    ["UV","2026年07-08月","10000000","19999999","49001286","89.9","c-ok","使用中"],
    ["XY","2026年07-08月","20000000","24999999","23100050","62.0","c-ok","使用中"],
    ["AB","2026年05-06月","30000000","34999999","34999210","99.8","c-bad","將用罄"],
    ["CD","2026年09-10月","40000000","49999999","0","0.0","c-info","已配發"],
    ["EF","2026年07-08月","50000000","52999999","51780400","89.3","c-warn","監控中"]
  ];
  var tr="";
  for(var i=0;i<tracks.length;i++){var t=tracks[i];
    tr+='<tr><td><b style="font-family:Inter;color:var(--accent)">'+t[0]+'</b></td><td>'+t[1]+'</td>'+
    '<td class="num">'+t[2]+'</td><td class="num">'+t[3]+'</td><td class="num">'+t[4]+'</td>'+
    '<td style="min-width:120px"><div class="bar"><i style="width:'+t[5]+'%"></i></div><div class="mini">'+t[5]+'%</div></td>'+
    '<td>'+chip(t[6],t[7])+'</td></tr>';
  }
  return head("字軌配號","管理各期發票字軌與號碼區間，即時監控剩餘可用號碼，避免號碼用罄或跳號。","MODULE｜字軌配號")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("啟用字軌","inventory_2","5","組","本期 3 組","")+
    kpi("剩餘可用號","confirmation_number","3.42","萬","跨字軌合計","")+
    kpi("號碼使用率","speed","78.6","%","本期平均","up")+
    kpi("預估用罄","hourglass_bottom","6","天","AB 字軌最急","down")+
  '</div>'+
  '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">grid_view</span>字軌配號一覽</h3>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>字軌</th><th>期別</th><th>起號</th><th>迄號</th><th>目前號碼</th><th>使用率</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>本期各字軌消耗趨勢</h3><div class="chart-wrap" style="height:250px"><canvas id="c1a"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">warning</span>配號預警</h3>'+
      '<div class="tl">'+
        '<div class="it"><div class="t">AB 字軌　剩餘 790 號</div><div class="d">預估 6 天內用罄</div><div class="s">建議立即申請新字軌並完成配號</div></div>'+
        '<div class="it"><div class="t">EF 字軌　使用率 89.3%</div><div class="d">進入監控門檻</div><div class="s">請於 8/20 前確認下期字軌</div></div>'+
        '<div class="it"><div class="t">CD 字軌　已配發</div><div class="d">2026 年 9-10 月期別待啟用</div><div class="s">將於 9/1 自動啟用接手開立</div></div>'+
        '<div class="it"><div class="t">跳號檢查</div><div class="d">全字軌連續性正常</div><div class="s">最近一次檢核 08-14 09:00</div></div>'+
      '</div></div>'+
  '</div>';
}
function s1init(){
  killChart("c1a");
  charts["c1a"]=new Chart(C("c1a"),{type:"line",data:{labels:["07/01","07/08","07/15","07/22","07/29","08/07","08/14"],
    datasets:[
      {label:"UV",data:[5,22,38,55,68,80,90],borderColor:accent,backgroundColor:"transparent",tension:.3},
      {label:"XY",data:[3,12,22,31,42,52,62],borderColor:accent2,backgroundColor:"transparent",tension:.3},
      {label:"AB",data:[40,58,72,84,92,97,99.8],borderColor:"#dc2626",backgroundColor:"transparent",tension:.3},
      {label:"EF",data:[6,20,35,50,64,78,89],borderColor:"#0891b2",backgroundColor:"transparent",tension:.3}
    ]},
    options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom"}},scales:{y:{grid:{color:gridc},ticks:{callback:function(v){return v+"%"}}},x:{grid:{display:false}}}}});
}

/* ===== SCREEN 2 : 平台上傳 ===== */
function s2(){
  var rows=[
    ["MIG-C0401","開立發票","512","510","2","10:05","已完成","c-ok"],
    ["MIG-C0501","作廢發票","18","18","0","10:05","已完成","c-ok"],
    ["MIG-D0401","折讓證明","24","23","1","10:32","部分退件","c-warn"],
    ["MIG-B0401","發票彙整","1","1","0","11:00","已完成","c-ok"],
    ["MIG-C0401","開立發票","486","—","—","11:30","上傳中","c-info"],
    ["MIG-F0401","發票查詢","1","0","1","09:12","退件","c-bad"]

var SCREENS=[s0,s1,s2,s3,s4,s5];
var INITS=[s0init,s1init,s2init,s3init,s4init,s5init];

function show(i){
  var app=document.getElementById("app");
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  }
  void app.offsetHeight;
  try{ INITS[i](); }catch(e){}
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
