<style>
:root{
--color-primary:#16A34A;--color-on-primary:#000;--color-secondary:#22C55E;--color-on-secondary:#0F172A;
--color-accent:#DC2626;--color-on-accent:#fff;--color-background:#0F172A;--color-foreground:#F8FAFC;
--color-card:#111827;--color-card-foreground:#F8FAFC;--color-muted:#1E293B;--color-muted-foreground:#CBD5E1;
--color-border:#334155;--color-destructive:#DC2626;--color-on-destructive:#fff;--color-ring:#16A34A;
--blue:#22C55E;--ink:#F8FAFC;--muted:#CBD5E1;--line:#334155;
--amber:#F59E0B;--black:#080D16;--panel-hi:#172033;--shadow:0 12px 30px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100vh;overflow-x:hidden;background:
radial-gradient(900px 460px at 78% -12%,rgba(22,163,74,.13),transparent 68%),
linear-gradient(180deg,#080d16 0,var(--color-background) 24rem);color:var(--ink);
font-family:"Fira Sans",sans-serif;line-height:1.5}
button{font:inherit}
button,.kcard{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:11px max(16px,calc((100vw - 1400px)/2));
background:rgba(8,13,22,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
.logo{display:grid;place-items:center;width:39px;height:39px;border:1px solid rgba(34,197,94,.7);border-radius:8px;color:var(--blue);
background:linear-gradient(145deg,rgba(34,197,94,.18),rgba(15,23,42,.2));box-shadow:0 0 18px rgba(22,163,74,.2)}
.brand h1,.brand p{margin:0;white-space:nowrap}.brand h1{font-size:15px;letter-spacing:.02em}.brand p{font:500 10px/1.5 "Fira Code",monospace;color:var(--muted)}
.navbtns{display:flex;justify-content:flex-end;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding:3px}
.navbtns button{display:flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:8px 11px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,border-color .2s,color .2s}
.navbtns button:hover{color:var(--ink);background:var(--color-muted);border-color:var(--line)}
.navbtns button.on{color:#dcfce7;background:rgba(22,163,74,.16);border-color:var(--color-primary);box-shadow:inset 0 -2px var(--blue),0 0 14px rgba(22,163,74,.12)}
.wrap{width:min(1400px,100%);margin:auto;padding:22px 16px 52px}
.scr-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:15px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.scr-head h2,.scr-head p{margin:0}.scr-head h2{display:flex;align-items:center;gap:9px;font-size:clamp(19px,2vw,24px);letter-spacing:-.02em}
.scr-head h2 .material-symbols-outlined,.panel h3 .material-symbols-outlined{color:var(--blue);filter:drop-shadow(0 0 7px rgba(34,197,94,.35))}
.scr-head p{margin-top:4px;color:var(--muted);font-size:12px}.chip{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.chip span{padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:rgba(30,41,59,.6);color:var(--muted);font:500 10.5px "Fira Code",monospace}
.chip b{color:#86efac}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
.panel,.kpi,.kcol{border:1px solid var(--line);background:linear-gradient(145deg,rgba(23,32,51,.92),rgba(17,24,39,.98));box-shadow:var(--shadow)}
.panel{min-width:0;padding:15px;border-radius:8px}.panel h3{display:flex;align-items:center;gap:7px;margin:0 0 12px;font-size:13px;letter-spacing:.01em}
.kpi{position:relative;min-width:0;overflow:hidden;padding:13px 14px;border-radius:7px}
.kpi:before{position:absolute;content:"";inset:0 auto 0 0;width:3px;background:var(--color-primary)}
.kpi:after{position:absolute;content:"";width:80px;height:80px;right:-35px;top:-40px;background:radial-gradient(circle,rgba(34,197,94,.17),transparent 68%)}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.kpi .lab .material-symbols-outlined{font-size:16px;color:#86efac}
.kpi .val{margin-top:5px;font:700 25px "Fira Code",monospace;letter-spacing:-.04em;text-shadow:0 0 10px rgba(248,250,252,.12)}
.kpi .val small{color:var(--muted);font:500 11px "Fira Sans",sans-serif}.kpi .sub{margin-top:4px;color:var(--muted);font-size:10.5px}
.up{color:#fca5a5}.dn{color:#86efac}.tbl-scroll,.kbwrap{overflow-x:auto}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{text-align:left;background:rgba(8,13,22,.5);color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.06em}
td{color:var(--ink)}td:nth-child(n+5){font-family:"Fira Code",monospace;text-align:right}tbody tr{transition:background .18s}tbody tr:hover{background:rgba(34,197,94,.06)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;border-radius:4px;font-size:10px;font-weight:600}
.tag:before{font-family:"Material Symbols Outlined";font-size:13px}.tag.bad{color:#fca5a5;background:rgba(220,38,38,.12)}.tag.bad:before{content:"error"}
.tag.warn{color:#fcd34d;background:rgba(245,158,11,.1)}.tag.warn:before{content:"warning"}
.tag.ok{color:#86efac;background:rgba(22,163,74,.11)}.tag.ok:before{content:"check_circle"}
.tag.plan{color:#cbd5e1;background:rgba(148,163,184,.1)}.tag.plan:before{content:"event"}
.chart-box{position:relative;width:100%;height:270px}.chart-box.tall{height:320px}.mini{color:var(--muted);font-size:11px}
.evstrip,.tree,.slist{display:flex;flex-direction:column;gap:8px}
.evrow{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 11px;border:1px solid var(--line);border-left:3px solid var(--color-accent);border-radius:6px;background:rgba(30,41,59,.55)}
.evrow.run{border-left-color:var(--color-primary)}.evrow.plan{border-left-color:#94a3b8}
.pulse{width:9px;height:9px;flex:none;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px rgba(220,38,38,.18)}
.run .pulse{background:var(--blue);box-shadow:0 0 0 3px rgba(34,197,94,.18)}.plan .pulse{background:#cbd5e1;box-shadow:none}
.m1{min-width:90px;font:600 12px "Fira Code",monospace}.m2{flex:1;min-width:140px;color:var(--muted);font-size:11.5px}
.m3{min-width:60px;text-align:right;color:#fca5a5;font:700 13px "Fira Code",monospace}.run .m3{color:#86efac}.plan .m3{color:#cbd5e1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10.5px}.legend span{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px}
.tnode{padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:rgba(30,41,59,.52)}
.thead{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}.thead .material-symbols-outlined{font-size:17px;color:#86efac}
.thead .n{margin-left:auto;color:var(--muted);font:500 10px "Fira Code",monospace}.tleaves{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tleaves span{padding:3px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:10.5px}.tleaves span.hot{border-color:#f59e0b;color:#fcd34d}
.bar,.track,.gb{overflow:hidden;background:#080d16;border:1px solid var(--line);border-radius:2px}.bar{height:6px;margin-top:8px}
.bar i,.track i,.gb i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kcol{min-width:0;padding:11px;border-radius:7px}
.kh{display:flex;align-items:center;gap:6px;margin-bottom:9px;font-size:12px;font-weight:600}.kh .cnt{margin-left:auto;padding:1px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted);font:500 10px "Fira Code",monospace}
.kcard{margin-bottom:8px;padding:10px;border:1px solid var(--line);border-top:2px solid var(--color-primary);border-radius:5px;background:var(--color-muted);transition:transform .18s,border-color .18s}
.kcard:hover{transform:translateY(-2px);border-color:var(--color-primary)}.kcard:last-child{margin-bottom:0}.kcard .id{color:#86efac;font:600 10px "Fira Code",monospace}
.kcard .ti{margin:3px 0 7px;font-size:12px;font-weight:600}.kcard .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font:500 10px "Fira Code",monospace}
.av{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--color-primary);border-radius:4px;background:#10251a;color:#dcfce7;font-family:"Fira Sans",sans-serif}
.sitem{display:flex;align-items:center;gap:10px}.sitem .nm{width:72px;flex:none;font:500 11px "Fira Code",monospace}.track{flex:1;height:8px}.vv{width:48px;text-align:right;color:#86efac;font:600 11px "Fira Code",monospace}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gauge{padding:14px;text-align:center;border:1px solid var(--line);border-radius:7px;background:linear-gradient(145deg,var(--panel-hi),var(--color-card))}
.gv{color:#86efac;font:700 28px "Fira Code",monospace;text-shadow:0 0 10px rgba(34,197,94,.24)}.gl{margin-top:3px;color:var(--muted);font-size:11px}.gb{height:6px;margin-top:9px}
.foot{margin-top:24px;color:#94a3b8;text-align:center;font-size:10px}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}.kb{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.topnav{align-items:flex-start;flex-direction:column;gap:7px}.navbtns{justify-content:flex-start;width:100%}.scr-head{align-items:flex-start;flex-direction:column}.chip{margin-left:0}.gauges{grid-template-columns:1fr}.chart-box.tall{height:290px}}
@media(max-width:480px){.wrap{padding:16px 12px 40px}.g4,.g3,.g2,.kb{grid-template-columns:1fr}.brand p{display:none}.navbtns button{min-width:42px;justify-content:center}.navbtns .lb{display:none}.evrow{align-items:flex-start}.m1{min-width:76px}.m2{min-width:120px}.panel{padding:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.kcard:hover{transform:none}}
</style>
</head>
