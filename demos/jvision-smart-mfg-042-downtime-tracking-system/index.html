<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>停機/當機追蹤系統 Downtime Tracking System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#be185d; --accent2:#fb7185;
  --bg:#0b0e14; --panel:#141924; --panel2:#1b2130; --line:#2a3244;
  --txt:#e8ecf4; --muted:#8b97ad; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;overflow-x:hidden;}
body{
  font-family:'Inter','Noto Sans TC',sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#1a1024 0%,var(--bg) 55%);
  color:var(--txt); min-height:100vh; line-height:1.5;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
/* NAV */
.topnav{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg,#12070f,#0d0710);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 16px rgba(190,24,93,.5);
}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand p{font-size:11px;color:var(--muted);white-space:nowrap;}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;justify-content:flex-end;}
.navbtns button{
  flex:none;white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;
  transition:.15s;
}
.navbtns button .material-symbols-outlined{font-size:18px;}
.navbtns button:hover{color:var(--txt);border-color:var(--accent2);}
.navbtns button.on{
  background:linear-gradient(135deg,var(--accent),#9d174d);
  color:#fff;border-color:var(--accent2);
  box-shadow:0 3px 14px rgba(190,24,93,.45);
}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px;}
/* generic */
.scr-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0;}
.scr-head .t{min-width:0;}
.scr-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scr-head h2 .material-symbols-outlined{color:var(--accent2);font-size:24px;}
.scr-head p{font-size:12.5px;color:var(--muted);margin-top:3px;}
.chip{margin-left:auto;flex:none;display:flex;gap:8px;flex-wrap:wrap;}
.chip span{
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:5px 12px;font-size:11.5px;color:var(--muted);white-space:nowrap;
}
.chip span b{color:var(--accent2);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.panel h3{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.panel h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
/* KPI */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:14px 15px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(190,24,93,.25),transparent 70%);}
.kpi .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-family:'Inter';}
.kpi .val small{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .sub{font-size:11px;margin-top:4px;color:var(--muted);}
.kpi .sub b.up{color:var(--bad);} .kpi .sub b.dn{color:var(--ok);}
/* table */
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
td{color:var(--txt);}
tbody tr:hover{background:rgba(190,24,93,.06);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tag.bad{background:rgba(251,113,133,.15);color:var(--bad);}
.tag.warn{background:rgba(251,191,36,.15);color:var(--warn);}
.tag.ok{background:rgba(52,211,153,.15);color:var(--ok);}
.tag.plan{background:rgba(139,151,173,.18);color:#b6c1d6;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.chart-box{position:relative;height:280px;width:100%;}
.chart-box.tall{height:320px;}
.mini{font-size:11.5px;color:var(--muted);}
/* signature: live event strip */
.evstrip{display:flex;flex-direction:column;gap:9px;}
.evrow{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:11px 13px;min-width:0;flex-wrap:wrap;}
.evrow.plan{border-left-color:var(--muted);}
.evrow.run{border-left-color:var(--ok);}
.evrow .pulse{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(251,113,133,.2);flex:none;}
.evrow.run .pulse{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.2);}
.evrow.plan .pulse{background:var(--muted);box-shadow:none;}
.evrow .m1{font-weight:700;font-size:13px;min-width:96px;}
.evrow .m2{font-size:12px;color:var(--muted);flex:1;min-width:120px;}
.evrow .m3{font-family:'Inter';font-weight:700;font-size:15px;color:var(--accent2);min-width:64px;text-align:right;}
/* cause tree board */
.tree{display:flex;flex-direction:column;gap:8px;}
.tnode{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;}
.tnode .thead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;}
.tnode .thead .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.tnode .thead .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;}
.tleaves{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tleaves span{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--muted);}
.tleaves span.hot{border-color:var(--accent2);color:var(--accent2);}
.bar{height:7px;background:var(--panel);border-radius:6px;overflow:hidden;margin-top:8px;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;}
/* kanban */
.kbwrap{overflow-x:auto;}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.kb{grid-template-columns:1fr;}}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.kcol .kh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:10px;}
.kcol .kh .cnt{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--muted);}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;border-top:3px solid var(--accent);}
.kcard:last-child{margin-bottom:0;}
.kcard .id{font-size:10.5px;color:var(--accent2);font-weight:700;letter-spacing:.5px;}
.kcard .ti{font-size:12.5px;font-weight:700;margin:3px 0 6px;}
.kcard .mt{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
.kcard .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;}
/* stat list */
.slist{display:flex;flex-direction:column;gap:10px;}
.sitem{display:flex;align-items:center;gap:12px;min-width:0;}
.sitem .nm{font-size:12.5px;min-width:70px;flex:none;}
.sitem .track{flex:1;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:0;}
.sitem .track>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.sitem .vv{font-family:'Inter';font-weight:700;font-size:12.5px;min-width:52px;text-align:right;color:var(--accent2);flex:none;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:6px;}
/* gauge grid */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:820px){.gauges{grid-template-columns:1fr;}}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;min-width:0;}
.gauge .gv{font-size:30px;font-weight:800;font-family:'Inter';background:linear-gradient(135deg,var(--accent2),#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.gauge .gl{font-size:12px;color:var(--muted);margin-top:4px;}
.gauge .gb{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;margin-top:9px;}
.gauge .gb>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);}
@media(max-width:560px){.navbtns button .lb{display:none;}.navbtns button{padding:8px 10px;}}
</style>
</head>
<body>
<nav class="topnav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">timer_off</span></div>
    <div>
      <h1>停機追蹤戰情室</h1>
      <p>Downtime Tracking System · MES</p>
    </div>
  </div>
  <div class="navbtns" id="nav"></div>
</nav>
<div class="wrap"><div id="app"></div>
  <div class="foot">停機/當機追蹤系統（Downtime Tracking System）· 純前端展示 · 假資料 demo</div>
</div>
<script>
"use strict";
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(canvasId,cfg){var c=el(canvasId);if(!c)return;var ch=new Chart(c.getContext("2d"),cfg);charts.push(ch);return ch;}

var AX="#8b97ad", GRID="rgba(120,132,156,.16)", LT="#e8ecf4";
Chart.defaults.color=AX; Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
function scales(opts){opts=opts||{};return{
  x:{ticks:{color:AX},grid:{color:GRID}},
  y:{ticks:{color:AX},grid:{color:GRID},beginAtZero:opts.zero!==false}
};}

var MODULES=[
  {ic:"sensors",nm:"事件擷取"},
  {ic:"label",nm:"原因分類"},
  {ic:"timeline",nm:"時間統計"},
  {ic:"bar_chart",nm:"帕累托"},
  {ic:"build_circle",nm:"改善追蹤"},
  {ic:"monitoring",nm:"戰情看板"}
];

function kpi(ic,lab,val,unit,sub){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}

/* ---------- SCREEN 0: Event capture ---------- */
function s0(){
  var events=[
    {t:"run",line:"CNC-01",cnt:"銑床加工",dur:"—"},
    {t:"down",line:"CNC-03",cnt:"刀具異常停機",dur:"18 分"},
    {t:"down",line:"沖壓-02",cnt:"模具卡料",dur:"32 分"},
    {t:"plan",line:"組裝-A",cnt:"換線調機",dur:"25 分"},
    {t:"run",line:"CNC-02",cnt:"車削加工",dur:"—"},
    {t:"down",line:"焊接-01",cnt:"氣體供應中斷",dur:"9 分"},
    {t:"plan",line:"塗裝-01",cnt:"預防保養 PM",dur:"40 分"}
  ];
  var rows=events.map(function(e){
    var cls=e.t==="run"?"run":(e.t==="plan"?"plan":"");
    var badge=e.t==="run"?'<span class="tag ok">運轉</span>':(e.t==="plan"?'<span class="tag plan">計畫停機</span>':'<span class="tag bad">非計畫停機</span>');
    return '<div class="evrow '+cls+'"><span class="pulse"></span><span class="m1">'+e.line+'</span><span class="m2">'+e.cnt+' '+badge+'</span><span class="m3">'+e.dur+'</span></div>';
  }).join("");
  return ''+
  '<div class="scr-head"><div class="t"><h2><span class="material-symbols-outlined">sensors</span>停機事件擷取</h2>'+
  '<p>自 PLC / OEE 訊號自動觸發停機事件並即時計時，現場可人工補登遺漏事件</p></div>'+
  '<div class="chip"><span>資料來源 <b>PLC · OEE</b></span><span>今日事件 <b>26 筆</b></span></div></div>'+
  '<div class="grid g4" style="margin-bottom:14px;">'+
    kpi("bolt","今日停機事件","26","筆",'<b class="up">+4</b> 較昨日')+
    kpi("timer_off","非計畫停機","143","分",'<b class="up">+22 分</b> 需關注')+
    kpi("engineering","進行中停機","2","線","刀具異常 · 模具卡料")+
    kpi("fact_check","已回機","19","筆",'<b class="dn">92%</b> 復機達成')+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="panel"><h3><span class="material-symbols-outlined">monitor_heart</span>即時事件擷取串流</h3>'+
      '<div class="evstrip">'+rows+'</div></div>'+
    '<div class="panel"><h3><span class="material-symbols-outlined">donut_small</span>近 8 小時停機分佈</h3>'+
      '<div class="chart-box"><canvas id="c0a"></canvas></div>'+
      '<div class="legend"><span><i class="dot" style="background:var(--bad)"></i>非計畫</span><span><i class="dot" style="background:var(--muted)"></i>計畫</span><span><i class="dot" style="background:var(--ok)"></i>運轉</span></div></div>'+
  '</div>';
}
function s0init(){
  mk("c0a",{type:"bar",data:{labels:["08","09","10","11","12","13","14","15"],
    datasets:[
      {label:"非計畫(分)",data:[12,0,32,18,0,9,0,24],backgroundColor:"#fb7185",stack:"s"},
      {label:"計畫(分)",data:[0,25,0,0,40,0,0,0],backgroundColor:"#6b7488",stack:"s"},
      {label:"運轉(分)",data:[48,35,28,42,20,51,60,36],backgroundColor:"rgba(52,211,153,.55)",stack:"s"}
    ]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,ticks:{color:AX},grid:{color:GRID}},y:{stacked:true,ticks:{color:AX},grid:{color:GRID},beginAtZero:true}}}});
}

/* ---------- SCREEN 1: Cause classification ---------- */
function s1(){
  var tree=[
    {ic:"handyman",nm:"設備故障",n:9,fill:72,leaves:[["刀具磨耗/斷裂",1],["軸承過熱",1],["感測器失效",0],["驅動器報警",0]]},
    {ic:"precision_manufacturing",nm:"換線/調機",n:6,fill:48,leaves:[["換模",1],["首件校驗",0],["參數調整",0]]},
    {ic:"inventory_2",nm:"物料/供給",n:5,fill:40,leaves:[["缺料等待",1],["氣體中斷",1],["來料不良",0]]},
    {ic:"cleaning_services",nm:"計畫保養",n:4,fill:32,leaves:[["PM 保養",1],["點檢",0]]},
    {ic:"person",nm:"人員/其他",n:2,fill:16,leaves:[["交接班",0],["培訓",0]]}
  ];
  var board=tree.map(function(x){
    var lv=x.leaves.map(function(l){return '<span class="'+(l[1]?"hot":"")+'">'+l[0]+'</span>';}).join("");
    return '<div class="tnode"><div class="thead"><span class="material-symbols-outlined">'+x.ic+'</span>'+x.nm+'<span class="n">'+x.n+' 筆</span></div>'+
      '<div class="tleaves">'+lv+'</div><div class="bar"><i style="width:'+x.fill+'%"></i></div></div>';
  }).join("");
  var recent=[
    ["EV-2418","CNC-03","設備故障","刀具磨耗/斷裂","18","非計畫","warn"],
    ["EV-2417","沖壓-02","設備故障","模具卡料","32","非計畫","bad"],
    ["EV-2416","焊接-01","物料/供給","氣體中斷","9","非計畫","warn"],
    ["EV-2415","組裝-A","換線/調機","換模","25","計畫","plan"],
    ["EV-2414","塗裝-01","計畫保養","PM 保養","40","計畫","plan"],
    ["EV-2413","CNC-01","人員/其他","交接班","6","非計畫","ok"]
  ];
  var tr=recent.map(function(r){
    return '<tr><td style="color:var(--accent2);font-weight:700">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+' 分</td><td><span class="tag '+r[6]+'">'+r[5]+'</span></td></tr>';
  }).join("");
  return ''+
  '<div class="scr-head"><div class="t"><h2><span class="material-symbols-outlined">label</span>停機原因分類</h2>'+
  '<p>依原因樹標記計畫 / 非計畫停機、故障設備與損失工時，完成事件登錄與稽核</p></div>'+
  '<div class="chip"><span>原因樹 <b>5 大類</b></span><span>待分類 <b>3 筆</b></span></div></div>'+
  '<div class="grid g32">'+
    '<div class="panel"><h3><span class="material-symbols-outlined">account_tree</span>停機原因樹（本班）</h3>'+
      '<div class="tree">'+board+'</div></div>'+
    '<div class="panel"><h3><span class="material-symbols-outlined">pie_chart</span>原因類別佔比</h3>'+
      '<div class="chart-box"><canvas id="c1a"></canvas></div></div>'+
  '</div>'+
  '<div class="panel" style="margin-top:14px;"><h3><span class="material-symbols-outlined">history</span>最近登錄事件</h3>'+
    '<div class="tbl-scroll"><table><thead><tr><th>事件</th><th>產線</th><th>大類</th><th>細項原因</th><th>損失</th><th>類型</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function s1init(){
  mk("c1a",{type:"doughnut",data:{labels:["設備故障","換線/調機","物料/供給","計畫保養","人員/其他"],
    datasets:[{data:[9,6,5,4,2],backgroundColor:["#be185d","#fb7185","#f472b6","#6b7488","#94a3b8"],borderColor:"#141924",borderWidth:2}]},
    options:{maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom",labels:{color:LT,boxWidth:12,padding:12}}}}});
}

/* ---------- SCREEN 2: Time statistics ---------- */
function s2(){
  var lines=[
    ["CNC-01",92],["CNC-02",88],["CNC-03",61],
    ["沖壓-02",57],["焊接-01",79],["組裝-A",84],["塗裝-01",90]
  ];
  var slist=lines.map(function(l){

  '<div class="scr-head"><div class="t"><h2><span class="material-symbols-outlined">bar_chart</span>帕累托分析</h2>'+
  '<p>以柏拉圖排序停機主因，鎖定佔比最高的關鍵少數作為改善標的（80/20 法則）</p></div>'+

var SCREENS=[s0,s1,s2,s3,s4,s5];

function buildNav(){
  var h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].ic+'</span><span class="lb">'+MODULES[i].nm+'</span></button>';
  }
  el("nav").innerHTML=h;
  var btns=el("nav").querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var container=el("app");
  container.innerHTML=SCREENS[i]();
  var btns=el("nav").querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  void container.offsetHeight;
  INITS[i]();
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
