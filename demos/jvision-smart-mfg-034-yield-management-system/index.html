<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>良率管理系統 Yield Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#D97706;
  --accent2:#2DD4BF;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --sidebar:#CCFBF1;
  --sidebar2:#F0FDFA;
  --good:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --ease:180ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--color-background);scroll-behavior:smooth}
body{
  min-width:320px;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.sidebar{
  width:260px;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  color:var(--ink);
  background:var(--sidebar);
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 6px 22px;
  border-bottom:1px solid rgba(13,148,136,.32);
}
.brand .logo{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--ink);
  border-radius:var(--radius-sm);
  color:var(--color-on-primary);
  background:var(--color-primary);
}
.brand .logo .material-symbols-outlined{font-size:25px}
.brand h1{
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.035em;
}
.brand p{
  margin-top:2px;
  font-family:"Crimson Pro",serif;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:.025em;
}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.nav button{
  min-width:0;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  color:var(--ink);
  background:transparent;
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:600;
  text-align:left;
  transition:color var(--ease),background-color var(--ease),border-color var(--ease);
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:#99F6E4;border-color:var(--color-primary)}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--ink);
}
.nav .idx{
  margin-left:auto;
  min-width:24px;
  padding:2px 6px;
  border:1px solid currentColor;
  border-radius:4px;
  font-family:"Crimson Pro",monospace;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  text-align:center;
  opacity:.82;
}
.sidebar .foot{
  margin-top:auto;
  padding:18px 6px 2px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:500;
  line-height:1.7;
}
.main{flex:1;min-width:0;padding:32px clamp(18px,3vw,42px) 64px}
#view{max-width:1480px;margin:0 auto}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:24px;
  padding-bottom:18px;
  border-bottom:2px solid var(--ink);
}
.top h2{
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(22px,2.2vw,30px);
  font-weight:600;
  line-height:1.2;
  letter-spacing:.015em;
}
.top .sub{
  margin-top:6px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:500;
}
.top .tag{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 12px;
  border:1px solid var(--color-primary);
  border-radius:var(--radius-sm);
  color:var(--ink);
  background:#CCFBF1;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.top .tag .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(300px,2fr)}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  transition:background-color var(--ease),border-color var(--ease),transform var(--ease);
}
.card{padding:20px}
.card:hover,.kpi:hover{border-color:var(--color-primary);background:#FCFFFE}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;
  font-weight:800;
  line-height:1.4;
}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary)}
.card .csub{
  margin-bottom:16px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:500;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 18px 18px;
  border-top:4px solid var(--color-primary);
}
.kpi:nth-child(2n){border-top-color:var(--color-secondary)}
.kpi:nth-child(3n){border-top-color:var(--color-accent)}
.kpi .lb{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.kpi .lb .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .vl{
  margin-top:9px;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:30px;
  font-weight:600;
  line-height:1.1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .vl small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .dl{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:7px;
  padding:2px 6px;
  border:1px solid currentColor;
  border-radius:4px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:800;
}
.kpi .dl .material-symbols-outlined{font-size:15px}
.up{color:#166534}.dn{color:#B91C1C}
.bar{
  height:8px;
  overflow:hidden;
  margin-top:11px;
  border:1px solid #CBD5E1;
  border-radius:3px;
  background:var(--color-muted);
}
.bar span{
  display:block;
  height:100%;
  border-radius:1px;
  background:var(--color-primary);
  transition:width 200ms ease,background-color var(--ease);
}
.scroll{max-width:100%;overflow-x:auto;scrollbar-color:var(--color-primary) var(--color-muted)}
table{
  width:100%;
  border-collapse:collapse;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;
}
th{
  padding:10px 11px;
  border-bottom:2px solid var(--ink);
  color:var(--ink);
  background:var(--color-muted);
  font-size:11px;
  font-weight:800;
  line-height:1.35;
  letter-spacing:.035em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
td{
  padding:11px;
  border-bottom:1px solid #BCECE5;
  color:var(--ink);
  white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums;
}
tbody tr{transition:background-color var(--ease)}
tbody tr:hover{background:#E6FFFA}
tbody tr:last-child td{border-bottom:0}
td.mono{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums lining-nums;
  text-align:right;
}
td:first-child.mono{text-align:left}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:800;
  line-height:1.25;
}
.pill::before{content:"";width:6px;height:6px;flex:none;border:2px solid currentColor;border-radius:50%}
.p-good{color:#166534;background:#DCFCE7}
.p-warn{color:#92400E;background:#FEF3C7}
.p-bad{color:#991B1B;background:#FEE2E2}
.p-info{color:#115E59;background:#CCFBF1}
.p-mut{color:#475569;background:#F1F5F9}
.dot{width:9px;height:9px;display:inline-block;border:1px solid var(--ink);border-radius:2px}
.mono{font-variant-numeric:tabular-nums lining-nums}
.wafer{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;max-width:370px;margin:4px auto 0;padding:8px;border:1px solid var(--line);border-radius:50%;background:#F8FFFD}
.wafer div{aspect-ratio:1;border:1px solid rgba(19,78,74,.14);border-radius:2px}
.wlegend,.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px 16px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:11.5px;
  font-weight:700;
}
.wlegend{justify-content:center;margin-top:16px}
.legend{margin-top:14px}
.wlegend span,.legend span{display:inline-flex;align-items:center;gap:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{
  min-width:0;
  padding:11px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--color-muted);
}
.col .ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
  color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:800;
}
.col .ch .cnt{
  min-width:25px;
  padding:1px 7px;
  border:1px solid var(--ink);
  border-radius:4px;
  color:var(--ink);
  background:#FFFFFF;
  font-family:ui-monospace,Consolas,monospace;
  font-size:11px;
  font-weight:700;
  text-align:center;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  border:1px solid #99DCD2;
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  background:#FFFFFF;
  transition:border-color var(--ease),background-color var(--ease),transform var(--ease);
}
.tk:last-child{margin-bottom:0}
.tk:hover{border-color:var(--color-primary);background:#F0FDFA;transform:translateY(-1px)}
.tk .tkt{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;font-weight:700;line-height:1.45}
.tk .tkm{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:10.5px;
}
.tk .av{
  width:22px;
  height:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--ink);
  border-radius:50%;
  color:var(--color-on-secondary);
  background:var(--color-secondary);
  font-family:"Noto Sans TC",sans-serif;
  font-size:10px;
  font-weight:800;
}
.mtx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-family:"Noto Sans TC",sans-serif;font-size:11px}
.mtx .hd{padding:7px;color:var(--muted);font-weight:800;text-align:center}
.mtx .rl{display:flex;align-items:center;padding:7px;color:var(--ink);font-weight:800}
.mtx .cell{
  aspect-ratio:2.4;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(19,78,74,.32);
  border-radius:4px;
  color:#FFFFFF;
  font-family:ui-monospace,Consolas,monospace;
  font-size:12px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #BCECE5}
.prow:last-child{border-bottom:0}
.prow .nm{
  width:120px;
  flex:none;
  min-width:0;
  overflow:hidden;
  color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.prow .barw{flex:1;min-width:0}
.prow .pc{
  width:48px;
  flex:none;
  font-family:ui-monospace,Consolas,monospace;
  font-size:12px;
  font-weight:800;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.verify{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
  padding:14px 15px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  background:var(--color-muted);
}
.verify .ic{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--ink);
  border-radius:var(--radius-sm);
  color:#FFFFFF;
}
.verify .ic .material-symbols-outlined{font-size:24px}
.verify .txt{flex:1;min-width:0}
.verify .txt b{font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:800}
.verify .txt p{margin-top:3px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:500}
.hint{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:13px;
  padding:10px 12px;
  border-left:4px solid var(--color-accent);
  color:#334155;
  background:#FFFBEB;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11.5px;
  font-weight:600;
  line-height:1.65;
}
.hint .material-symbols-outlined{flex:none;margin-top:1px;color:var(--color-accent);font-size:17px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Noto Sans TC",sans-serif!important;fill:var(--muted)!important;color:var(--muted)!important}
.apexcharts-gridline{stroke:#CDEBE6}
.apexcharts-tooltip{border:1px solid var(--line)!important;box-shadow:none!important}
@supports (animation-timeline:view()){
  .card,.kpi{
    animation:reveal linear both;
    animation-timeline:view();
    animation-range:entry 0% entry 24%;
  }
}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:1360px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1024px){
  .sidebar{width:230px}
  .main{padding:26px 22px 56px}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    width:auto;
    height:auto;
    position:static;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:center;
    padding:12px 14px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand{width:100%;padding:2px 4px 12px;border-bottom:1px solid rgba(13,148,136,.32)}
  .brand .logo{width:38px;height:38px}
  .nav{width:100%;flex-direction:row;flex-wrap:nowrap;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:3px}
  .nav button{flex:none;white-space:nowrap;padding:9px 11px}
  .nav .idx{display:none}
  .sidebar .foot{display:none}
  .main{padding:22px 16px 48px}
  .top{align-items:flex-start}
}
@media(max-width:768px){
  .g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:17px}
  .mtx{font-size:10px}
}
@media(max-width:560px){
  .nav button{width:44px;justify-content:center;padding:9px}
  .nav button .lbl{display:none}
  .board{grid-template-columns:1fr}
  .top{margin-bottom:18px;padding-bottom:15px}
  .top h2{font-size:21px}
  .top .tag{width:100%;justify-content:center}
  .kpi .vl{font-size:27px}
  .verify{align-items:flex-start;flex-wrap:wrap}
  .verify .txt{min-width:calc(100% - 58px)}
  .verify>.pill{margin-left:56px}
}
@media(max-width:375px){
  .main{padding-left:12px;padding-right:12px}
  .card,.kpi{border-radius:8px}
  .card{padding:15px}
  .prow{gap:8px}
  .prow .nm{width:96px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .card,.kpi,.tk{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div>
        <h1>良率管理系統</h1>
        <p>Yield Management System</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">MES · SPC · AOI/AVI 整合<br/>Demo 資料 · 純前端展示</div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"monitoring",name:"良率總覽",sub:"各產品線良率即時彙整與趨勢監控"},
  {icon:"grid_on",name:"晶圓缺陷圖",sub:"Wafer Map 缺陷分布與熱點分析"},
  {icon:"category",name:"缺陷模式分類",sub:"缺陷樣態分群統計與 Pareto 排序"},
  {icon:"account_tree",name:"良率損失歸因",sub:"良率損失依製程站點與根因拆解"},
  {icon:"build_circle",name:"改善對策追蹤",sub:"改善措施看板與負責人進度管理"},
  {icon:"verified",name:"效果驗證",sub:"改善前後良率對比與驗證放行"}
];
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

function wrap(i,inner){
  var m=MODS[i];
  return '<div class="top"><div><h2>'+m.name+'</h2><div class="sub">'+m.sub+'</div></div>'+
         '<div class="tag"><span class="material-symbols-outlined">'+m.icon+'</span>良率管理 · 模組 '+(i+1)+'/6</div></div>'+inner;
}

function screen1(){
  var R=6.5, cells="";
  var seedHot=[[3,4],[3,5],[4,4],[4,5],[9,8],[9,9],[10,8]];
  function isHot(x,y){for(var i=0;i<seedHot.length;i++){if(seedHot[i][0]===x&&seedHot[i][1]===y)return true;}return false;}
  for(var y=0;y<13;y++){for(var x=0;x<13;x++){
    var dx=x-R, dy=y-R, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>R+0.3){cells+='<div style="background:transparent"></div>';continue;}
    var col="#dcfce7";
    var edge=dist>5.4;
    if(isHot(x,y)) col="#e11d48";

  });
  h+='</div>';
  el("view").innerHTML=wrap(4,h);
  void el("view").offsetHeight;
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];

function buildNav(){
  var nav=el("nav"),h="";
  MODS.forEach(function(m,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="idx">'+i+'</span></button>';
  });
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});})(btns[j]);}
}

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  clearCharts();
  SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
  try{window.scrollTo(0,0);}catch(e){}
}

buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
