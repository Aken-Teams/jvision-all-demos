<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>良率管理系統 Yield Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --bg:#f6f4f6; --panel:#ffffff;
  --ink:#2a1f28; --muted:#7d6f79; --line:#ecdfe8; --sidebar:#3b1b30; --sidebar2:#5a2545;
  --good:#0f9d58; --warn:#f59e0b; --bad:#e11d48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#fff;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11px;color:#e9c4dc;font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:none;color:#e7d3e0;font-family:inherit;font-size:13.5px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px rgba(219,39,119,.7)}
.nav .idx{margin-left:auto;font-size:10px;font-weight:700;opacity:.6;background:rgba(255,255,255,.14);border-radius:6px;padding:2px 6px}
.sidebar .foot{margin-top:auto;padding:14px 8px 2px;font-size:11px;color:#d9aecb;line-height:1.6}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:22px;font-weight:800}
.top .sub{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
.top .tag{display:inline-flex;align-items:center;gap:6px;background:#fce7f3;color:var(--accent);font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px}
.top .tag .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:3fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .csub{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lb .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .vl{font-size:26px;font-weight:800;margin-top:9px;letter-spacing:-.5px}
.kpi .vl small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .dl{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kpi .dl .material-symbols-outlined{font-size:15px}
.up{color:var(--good)}.dn{color:var(--bad)}
.bar{height:7px;border-radius:6px;background:#f1e3ec;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #f4ebf1;white-space:nowrap}
tbody tr:hover{background:#fdf2f8}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.p-good{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}.p-bad{background:#ffe4e6;color:#9f1239}.p-info{background:#e0e7ff;color:#3730a3}.p-mut{background:#f1f5f9;color:#475569}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.scroll{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums}
.wafer{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;max-width:360px;margin:0 auto}
.wafer div{aspect-ratio:1;border-radius:3px}
.wlegend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;font-size:11.5px;font-weight:600;color:var(--muted)}
.wlegend span{display:inline-flex;align-items:center;gap:5px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#faf5f9;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col .ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--sidebar)}
.col .ch .cnt{font-size:10.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent)}
.tk .tkt{font-size:12.5px;font-weight:700;line-height:1.35}
.tk .tkm{font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.mtx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:11px}
.mtx .hd{font-weight:700;color:var(--muted);padding:6px;text-align:center}
.mtx .rl{font-weight:700;color:var(--sidebar);padding:6px;display:flex;align-items:center}
.mtx .cell{aspect-ratio:2.4;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
.prow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f4ebf1}
.prow:last-child{border-bottom:none}
.prow .nm{font-size:12.5px;font-weight:600;width:120px;flex:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .barw{flex:1;min-width:0}
.prow .pc{font-size:12px;font-weight:800;width:44px;text-align:right;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.verify{display:flex;align-items:center;gap:14px;background:#faf5f9;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.verify .ic{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.verify .ic .material-symbols-outlined{font-size:24px}
.verify .txt{flex:1;min-width:0}
.verify .txt b{font-size:13.5px}
.verify .txt p{font-size:11.5px;color:var(--muted);margin-top:2px}
.hint{font-size:11px;color:var(--muted);margin-top:12px;display:flex;align-items:flex-start;gap:6px;line-height:1.6}
.hint .material-symbols-outlined{font-size:15px;color:var(--accent);flex:none;margin-top:1px}
@media(max-width:1360px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .brand{padding:2px 10px 2px 4px;width:100%}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:8px;gap:7px;width:100%}
  .nav button{flex:none;white-space:nowrap;padding:9px 12px}
  .nav .idx{display:none}
  .sidebar .foot{display:none}
  .main{padding:20px 16px 50px}
}
@media(max-width:820px){
  .g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .mtx{font-size:10px}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px}
  .board{grid-template-columns:1fr}
  .top h2{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div>
        <h1>良率管理系統</h1>
        <p>Yield Management System</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">MES · SPC · AOI/AVI 整合<br/>Demo 資料 · 純前端展示</div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"monitoring",name:"良率總覽",sub:"各產品線良率即時彙整與趨勢監控"},
  {icon:"grid_on",name:"晶圓缺陷圖",sub:"Wafer Map 缺陷分布與熱點分析"},
  {icon:"category",name:"缺陷模式分類",sub:"缺陷樣態分群統計與 Pareto 排序"},
  {icon:"account_tree",name:"良率損失歸因",sub:"良率損失依製程站點與根因拆解"},
  {icon:"build_circle",name:"改善對策追蹤",sub:"改善措施看板與負責人進度管理"},
  {icon:"verified",name:"效果驗證",sub:"改善前後良率對比與驗證放行"}
];
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

function wrap(i,inner){
  var m=MODS[i];
  return '<div class="top"><div><h2>'+m.name+'</h2><div class="sub">'+m.sub+'</div></div>'+
         '<div class="tag"><span class="material-symbols-outlined">'+m.icon+'</span>良率管理 · 模組 '+(i+1)+'/6</div></div>'+inner;
}

/* ---------- SCREEN 0 : 良率總覽 ---------- */
function screen0(){
  var kpis=[
    {lb:"line_axis",t:"整廠平均良率",v:"94.6",u:"%",d:"+1.8",up:true,bar:94},
    {lb:"warning",t:"缺陷密度 DPPM",v:"1,240",u:"ppm",d:"-320",up:true,bar:62},
    {lb:"folder_open",t:"開立改善案",v:"18",u:"件",d:"+3",up:false,bar:45},
    {lb:"task_alt",t:"驗證達標率",v:"87",u:"%",d:"+6",up:true,bar:87}
  ];
  var lines=[
    {n:"CMOS 影像感測 IS-8",y:96.8,dp:820,st:"good",tr:"+0.9"},
    {n:"電源管理 PMIC-5",y:95.2,dp:1050,st:"good",tr:"+1.4"},
    {n:"射頻前端 RF-3",y:92.1,dp:1680,st:"warn",tr:"-0.6"},
    {n:"微控制器 MCU-7",y:94.4,dp:1210,st:"good",tr:"+0.3"},
    {n:"記憶體 DRAM-2",y:89.7,dp:2340,st:"bad",tr:"-1.2"},
    {n:"類比訊號 ADC-4",y:95.9,dp:940,st:"good",tr:"+2.1"}
  ];
  var h='<div class="grid g4">';
  kpis.forEach(function(k){
    h+='<div class="kpi"><div class="lb"><span class="material-symbols-outlined">'+k.lb+'</span>'+k.t+'</div>'+
       '<div class="vl">'+k.v+' <small>'+k.u+'</small></div>'+
       '<div class="dl '+(k.up?'up':'dn')+'"><span class="material-symbols-outlined">'+(k.up?'trending_up':'trending_down')+'</span>'+k.d+' 週變化</div>'+
       '<div class="bar"><span style="width:'+k.bar+'%"></span></div></div>';
  });
  h+='</div>';
  h+='<div class="grid g23" style="margin-top:16px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>週良率趨勢（近 8 週）</h3><div class="csub">整廠良率 vs 缺陷密度 DPPM 對照</div><div id="c0a" style="height:280px"></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>良率損失構成</h3><div class="csub">依損失類別佔比</div><div id="c0b" style="height:280px"></div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">precision_manufacturing</span>產品線良率明細</h3><div class="csub">各產品線即時良率與缺陷密度</div><div class="scroll"><table><thead><tr><th>產品線</th><th>批號良率</th><th>DPPM</th><th>週趨勢</th><th>狀態</th></tr></thead><tbody>';
  lines.forEach(function(r){
    var pc=r.st==="good"?"p-good":r.st==="warn"?"p-warn":"p-bad";
    var lbl=r.st==="good"?"達標":r.st==="warn"?"觀察":"異常";
    var tup=r.tr.charAt(0)==="+";
    h+='<tr><td style="font-weight:700">'+r.n+'</td><td class="mono">'+r.y.toFixed(1)+'%</td><td class="mono">'+r.dp.toLocaleString()+'</td>'+
       '<td class="mono '+(tup?'up':'dn')+'" style="font-weight:700">'+r.tr+'%</td><td><span class="pill '+pc+'">'+lbl+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';
  el("view").innerHTML=wrap(0,h);
  void el("view").offsetHeight;
  var c1=new ApexCharts(el("c0a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:280,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:"良率 %",type:"line",data:[92.1,92.8,93.4,93.1,93.9,94.2,94.1,94.6]},{name:"DPPM",type:"column",data:[1980,1860,1720,1790,1560,1440,1380,1240]}],
    stroke:{width:[3,0],curve:"smooth"},colors:["#db2777","#f9a8d4"],
    xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8"]},
    yaxis:[{min:88,max:98,labels:{formatter:function(v){return v.toFixed(0)+"%";}},title:{text:"良率"}},{opposite:true,title:{text:"DPPM"}}],
    dataLabels:{enabled:false},legend:{position:"top"},grid:{borderColor:"#f0e5ee"}
  });c1.render();charts.push(c1);
  var c2=new ApexCharts(el("c0b"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:280,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[34,26,18,12,10],labels:["微粒缺陷","蝕刻不良","對位偏移","薄膜厚度","其他"],
    colors:["#db2777","#f472b6","#f9a8d4","#c026d3","#fbcfe8"],
    dataLabels:{enabled:true,formatter:function(v){return v.toFixed(0)+"%";}},
    legend:{position:"bottom"},plotOptions:{pie:{donut:{size:"62%"}}}
  });c2.render();charts.push(c2);
}

/* ---------- SCREEN 1 : 晶圓缺陷圖 ---------- */
function screen1(){
  var R=6.5, cells="";
  var seedHot=[[3,4],[3,5],[4,4],[4,5],[9,8],[9,9],[10,8]];
  function isHot(x,y){for(var i=0;i<seedHot.length;i++){if(seedHot[i][0]===x&&seedHot[i][1]===y)return true;}return false;}
  for(var y=0;y<13;y++){for(var x=0;x<13;x++){
    var dx=x-R, dy=y-R, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>R+0.3){cells+='<div style="background:transparent"></div>';continue;}
    var col="#dcfce7";
    var edge=dist>5.4;
    if(isHot(x,y)) col="#e11d48";
    else if(edge && ((x+y)%3===0)) col="#f59e0b";
    else if(((x*3+y*7)%17)===0) col="#f472b6";
    cells+='<div style="background:'+col+'"></div>';
  }}
  var zones=[
    {z:"中心區 Center",d:0.4,y:97.8,st:"p-good",n:"正常"},
    {z:"中環 Mid-Ring",d:1.1,y:95.2,st:"p-good",n:"正常"},
    {z:"外環 Edge",d:3.8,y:88.4,st:"p-warn",n:"邊緣密集"},
    {z:"缺口區 Notch",d:5.2,y:83.1,st:"p-bad",n:"熱點聚集"}
  ];
  var h='<div class="grid g23">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">grid_on</span>Wafer Map · Lot #WF-2408-117</h3><div class="csub">單片晶圓 Die 級缺陷分布（13×13 sample）</div>';
  h+='<div class="wafer">'+cells+'</div>';
  h+='<div class="wlegend"><span><i class="dot" style="background:#dcfce7"></i>良品 Pass</span><span><i class="dot" style="background:#f472b6"></i>隨機缺陷</span><span><i class="dot" style="background:#f59e0b"></i>邊緣缺陷</span><span><i class="dot" style="background:#e11d48"></i>叢集熱點</span></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">radar</span>缺陷分布徑向剖析</h3><div class="csub">依晶圓方位缺陷密度</div><div id="c1a" style="height:290px"></div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">travel_explore</span>徑向分區良率統計</h3><div class="csub">依晶圓半徑分區彙整</div><div class="scroll"><table><thead><tr><th>分區</th><th>缺陷密度 (/cm²)</th><th>分區良率</th><th>研判</th></tr></thead><tbody>';
  zones.forEach(function(r){
    h+='<tr><td style="font-weight:700">'+r.z+'</td><td class="mono">'+r.d.toFixed(1)+'</td><td class="mono">'+r.y.toFixed(1)+'%</td><td><span class="pill '+r.st+'">'+r.n+'</span></td></tr>';
  });
  h+='</tbody></table></div><div class="hint"><span class="material-symbols-outlined">lightbulb</span>邊緣與缺口區缺陷密度顯著偏高，研判為外環製程均勻度問題，建議轉入根因歸因。</div></div>';
  el("view").innerHTML=wrap(1,h);
  void el("view").offsetHeight;
  var c=new ApexCharts(el("c1a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radar",height:290,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:"缺陷密度 (/cm²)",data:[0.4,1.1,2.6,3.8,5.2,2.1]}],
    labels:["Center","Mid","Edge-N","Edge-E","Notch","Edge-W"],
    stroke:{width:2},colors:["#db2777"],fill:{opacity:0.28},markers:{size:4},
    dataLabels:{enabled:false},yaxis:{show:false}
  });c.render();charts.push(c);
}

/* ---------- SCREEN 2 : 缺陷模式分類 ---------- */
function screen2(){
  var defs=[
    {code:"D-01",n:"金屬微粒 (Particle)",cnt:428,rate:34,st:"p-bad",trend:"↑"},
    {code:"D-02",n:"蝕刻殘留 (Etch Residue)",cnt:327,rate:26,st:"p-warn",trend:"→"},
    {code:"D-03",n:"光罩對位偏移 (Overlay)",cnt:226,rate:18,st:"p-warn",trend:"↓"},
    {code:"D-04",n:"薄膜厚度異常 (Thickness)",cnt:151,rate:12,st:"p-info",trend:"→"},

function buildNav(){
  var nav=el("nav"),h="";
  MODS.forEach(function(m,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="idx">'+i+'</span></button>';
  });
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});})(btns[j]);}
}

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  clearCharts();
  SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
  try{window.scrollTo(0,0);}catch(e){}
}

buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
