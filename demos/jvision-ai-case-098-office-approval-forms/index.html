<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表單簽核流程艙 · 簽核作業終端</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --success:#047857;
  --warning:#9A3412;
  --info:#0369A1;
  --purple:#7C3AED;
  --shadow:0 10px 32px rgba(15,118,110,.08);
  --shadow-hover:0 16px 38px rgba(15,118,110,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
svg{display:block}
.icon{
  width:20px;
  height:20px;
  flex:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none;
}
.icon-sm{width:16px;height:16px}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:72px;
  padding:12px clamp(16px,3vw,40px);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  border-radius:11px;
  color:#fff;
  background:var(--color-primary);
  box-shadow:0 6px 18px rgba(13,148,136,.22);
}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:1px 0 0;color:var(--color-muted-foreground);font-size:10px;letter-spacing:.08em}
.tag-live{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
  padding:7px 11px;
  border:1px solid var(--color-border);
  border-radius:999px;
  background:#fff;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 0 4px rgba(4,120,87,.12);
}
nav{
  position:sticky;
  top:72px;
  z-index:35;
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding:8px clamp(16px,3vw,40px);
  background:rgba(240,253,250,.96);
  border-bottom:1px solid var(--color-border);
  scrollbar-width:thin;
}
.nbtn{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:42px;
  padding:9px 13px;
  border:1px solid transparent;
  border-radius:8px;
  color:var(--color-muted-foreground);
  background:transparent;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nbtn:hover{color:var(--color-primary);background:#fff;border-color:var(--color-border)}
.nbtn.on{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.nbtn.on small{color:#fff;background:rgba(0,0,0,.18)}
.nbtn small{
  padding:1px 5px;
  border-radius:4px;
  color:var(--color-primary);
  background:rgba(13,148,136,.09);
  font-size:9px;
}
main{width:min(1360px,100%);margin:auto;padding:clamp(24px,4vw,48px) clamp(16px,3vw,40px) 64px}
.scr-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:24px;
  margin-bottom:22px;
  padding-bottom:20px;
  border-bottom:1px solid var(--color-border);
}
.kick{color:var(--color-primary);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.scr-head h2{display:flex;align-items:center;gap:10px;margin:5px 0 2px;font-size:clamp(23px,3vw,32px);line-height:1.25;letter-spacing:-.04em}
.scr-head p{margin:0;color:var(--color-muted-foreground);font-size:13px}
.screen-index{color:var(--color-primary);font-size:12px;font-weight:700;letter-spacing:.12em}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.card{
  min-width:0;
  padding:18px;
  border:1px solid var(--color-border);
  border-radius:12px;
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:var(--shadow);
}
.ctitle{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:24px;
  margin-bottom:15px;
  color:var(--color-foreground);
  font-size:13px;
  font-weight:700;
}
.ctitle .ico{color:var(--color-primary)}
.ctitle .sub{margin-left:auto;color:var(--color-muted-foreground);font-size:10px;font-weight:500}
.kpi{position:relative;overflow:hidden;padding-top:20px}
.kpi:before{position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--bar,var(--color-primary));content:""}
.kpi .lbl{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.kpi .lbl .ico{color:var(--color-primary)}
.kpi .val{
  margin-top:10px;
  color:var(--color-foreground);
  font-size:29px;
  font-weight:700;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--color-muted-foreground);font-size:12px;letter-spacing:0}
.delta{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;font-weight:700}
.up{color:var(--success)}.down{color:var(--color-destructive)}.neu{color:var(--warning)}
.table-wrap{overflow:auto}
table{width:100%;border-spacing:0;border-collapse:collapse;font-size:12px;white-space:nowrap}
th{
  padding:10px 12px;
  border-bottom:1px solid var(--color-border);
  background:#F7FFFD;
  color:var(--color-muted-foreground);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-align:left;
}
td{padding:12px;border-bottom:1px solid #D5F5EE;color:var(--color-foreground)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .2s ease}
tbody tr:hover{background:#F4FCFA}
td.num,th.num{text-align:right}
.mono,.code,.no,time{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.who{display:flex;align-items:center;gap:8px}
.av{
  display:inline-grid;
  place-items:center;
  width:26px;
  height:26px;
  flex:none;
  border-radius:8px;
  color:#fff;
  font-size:10px;
  font-weight:700;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1;
}
.badge:before{width:5px;height:5px;border-radius:50%;background:currentColor;content:""}
.b-g{color:#047857;background:#ECFDF5}.b-r{color:#B91C1C;background:#FEF2F2}
.b-a{color:#9A3412;background:#FFF7ED}.b-b{color:#0F766E;background:#F0FDFA}
.b-c{color:#0369A1;background:#F0F9FF}.b-n{color:#475569;background:#F8FAFC}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:10px}
.col{padding:10px;border:1px solid var(--color-border);border-radius:10px;background:#F7FFFD}
.col h4{display:flex;align-items:center;gap:7px;margin:0 0 10px;padding:2px;font-size:11px}
.cnt{margin-left:auto;padding:1px 7px;border-radius:999px;background:var(--color-muted);color:var(--color-muted-foreground)}
.tik{
  margin-bottom:8px;
  padding:11px;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary);
  border-radius:8px;
  background:#fff;
  box-shadow:0 2px 8px rgba(15,118,110,.04);
  transition:transform .2s ease,box-shadow .2s ease;
}
.tik:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tik:last-child{margin-bottom:0}
.tik .no{color:var(--color-muted-foreground);font-size:9px;letter-spacing:.04em}
.tik .tt{margin:5px 0 9px;font-size:12px;font-weight:700}
.tik .mt{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:10px}
.tik .amt{margin-left:auto;color:var(--color-primary);font-weight:700;font-variant-numeric:tabular-nums}
.flowmap{display:flex;align-items:stretch;overflow-x:auto;padding:6px 2px}
.fnode{
  width:154px;
  flex:none;
  padding:14px;
  border:1px solid var(--color-border);
  border-radius:10px;
  background:#fff;
}
.fn-ic{display:grid;place-items:center;width:34px;height:34px;margin-bottom:10px;border-radius:8px;color:#fff}
.fnode h5{margin:0;font-size:12px}
.fnode .rl{margin-top:2px;color:var(--color-muted-foreground);font-size:10px}
.fnode .cond{margin-top:10px;padding:6px 7px;border-radius:6px;background:var(--color-muted);color:var(--color-foreground);font-size:9px}
.farrow{display:grid;place-items:center;width:34px;flex:none;color:var(--color-primary)}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #D5F5EE}
.srow:last-child{border-bottom:0}.srow .nm{flex:1;font-size:12px;font-weight:600}
.tl{position:relative;padding-left:28px}
.tl:before{position:absolute;top:7px;bottom:7px;left:9px;width:1px;background:var(--color-border);content:""}
.tl-item{position:relative;padding-bottom:20px}.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:2px;
  left:-27px;
  display:grid;
  place-items:center;
  width:18px;
  height:18px;
  border:3px solid #fff;
  border-radius:50%;
  color:#fff;
  box-shadow:0 0 0 1px var(--color-border);
}
.tl-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tl-hd b{font-size:12px}
.tl-hd time{margin-left:auto;color:var(--color-muted-foreground);font-size:10px}
.tl-bd{margin-top:6px;padding:10px 12px;border:1px solid var(--color-border);border-radius:8px;background:#F7FFFD;color:var(--color-muted-foreground);font-size:11px}
.tpl{
  position:relative;
  padding:15px;
  border:1px solid var(--color-border);
  border-radius:10px;
  background:#fff;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.tpl:hover{transform:translateY(-3px);border-color:var(--color-primary);box-shadow:var(--shadow-hover)}
.tpl .th{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tic{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:8px;color:#fff}
.tpl h4{margin:0;font-size:13px}.tpl .code{color:var(--color-muted-foreground);font-size:9px}
.tpl .desc{min-height:36px;color:var(--color-muted-foreground);font-size:10px}
.tpl .foot{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid #D5F5EE;color:var(--color-muted-foreground);font-size:10px}
.tpl .used{margin-left:auto;color:var(--color-primary);font-weight:700;font-variant-numeric:tabular-nums}
.frm{padding:15px;border:1px solid var(--color-border);border-radius:10px;background:#F7FFFD}
.frm .row{display:flex;gap:10px;margin-bottom:11px}.frm .row:last-child{margin-bottom:0}
.fld{min-width:120px;flex:1}
.frm label{display:block;margin-bottom:5px;color:var(--color-muted-foreground);font-size:10px;font-weight:600}
.inp{min-height:38px;padding:9px 10px;border:1px solid var(--color-border);border-radius:7px;background:#fff;color:var(--color-foreground);font-size:11px}
.inp.big{color:var(--color-primary);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.heat{display:grid;min-width:630px;gap:5px;font-size:10px}
.hc{padding:9px 4px;border-radius:5px;color:#fff;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.hh{padding:4px;color:var(--color-muted-foreground);font-weight:700;text-align:center}
.legend{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--color-muted-foreground);font-size:10px}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px}
.chartbox{width:100%;min-height:280px}
.foot-note{margin-top:30px;padding-top:16px;border-top:1px solid var(--color-border);color:var(--color-muted-foreground);font-size:10px;text-align:center}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(230px,1fr))}
}
@media(max-width:720px){
  .topbar{min-height:64px;padding:10px 16px}.brand p{display:none}.tag-live{font-size:0;padding:8px}
  nav{top:64px;padding:7px 16px}.nbtn{padding:9px 11px}.nbtn .lab,.nbtn small{display:none}
  main{padding:25px 16px 48px}.scr-head{grid-template-columns:1fr}.screen-index{display:none}
  .g4,.g3,.g2{grid-template-columns:1fr}.board{grid-template-columns:1fr}
  .frm .row{display:grid;grid-template-columns:1fr}.card{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M8 6h11M8 12h11M8 18h7"/><path d="m3 6 1 1 2-2m-3 7 1 1 2-2m-3 7 1 1 2-2"/></svg></div>
    <div><h1>表單簽核流程艙</h1><p>OFFICE APPROVAL WORKFLOW TERMINAL</p></div>
  </div>
  <div class="tag-live"><span class="dot" aria-hidden="true"></span><span>引擎運行中 · 今日 137 筆單據</span></div>
</header>
<nav id="nav" aria-label="主要畫面"></nav>
<main id="app"></main>
<script>
"use strict";
var C={accent:"#0D9488",accent2:"#14B8A6",green:"#047857",red:"#DC2626",amber:"#EA580C",cyan:"#0369A1",purple:"#7C3AED",grid:"#99F6E4",lab:"#475569",panel:"#FFFFFF"};
var ICONS={
 dashboard:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
 assignment:'<svg class="icon" viewBox="0 0 24 24"><path d="M9 5h6"/><path d="M9 3h6v4H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="m8 13 2 2 5-5"/></svg>',
 account_tree:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><path d="M6 8v4h12v4M6 12v4"/></svg>',
 history:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg>',
 receipt_long:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 3v18l3-2 3 2 3-2 3 2 2-1.3V3l-2 1-3-1-3 1-3-1-3 1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 monitoring:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/><path d="M2 21h20"/></svg>',
 check:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
 clock:'<svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 warning:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 9v4m0 3h.01"/></svg>',
 trend:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
 chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>',
 circle:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 4"/></svg>',
 alert:'<svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',
 board:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>',
 flow:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 4v16m0-8h7m0 0-3-3m3 3-3 3"/><circle cx="5" cy="4" r="2"/><circle cx="5" cy="20" r="2"/><circle cx="15" cy="12" r="2"/></svg>',
 document:'<svg class="icon" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6m-6 4h6"/></svg>',
 grid:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>'
};
function ico(n){return ICONS[n]||ICONS.document}
var MODS=[
 {icon:"dashboard",name:"簽核總覽",kick:"OVERVIEW"},
 {icon:"assignment",name:"待簽清單",kick:"MY QUEUE"},
 {icon:"account_tree",name:"流程設計",kick:"FLOW DESIGN"},
 {icon:"history",name:"簽核軌跡",kick:"AUDIT TRAIL"},
 {icon:"receipt_long",name:"表單範本",kick:"TEMPLATES"},
 {icon:"monitoring",name:"效率分析",kick:"ANALYTICS"}
];
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function av(name,color){return '<span class="av" style="background:'+color+'" aria-hidden="true">'+name.charAt(0)+'</span>'}
function nfmt(n){try{return Number(n||0).toLocaleString("en-US")}catch(e){return String(n||0)}}
function title(icon,text,sub){return '<div class="ctitle"><span class="ico">'+ico(icon)+'</span>'+text+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'}
function kpi(k){
 return '<div class="card kpi" style="--bar:'+k.c+'"><div class="lbl"><span class="ico">'+ico(k.ic)+'</span>'+k.lbl+'</div><div class="val">'+k.v+(k.u?' <small>'+k.u+'</small>':'')+'</div>'+(k.d?'<div class="delta '+k.cls+'">'+ico(k.cls==="down"?"warning":k.cls==="up"?"trend":"clock")+k.d+'</div>':'')+'</div>'
}
(function(){
