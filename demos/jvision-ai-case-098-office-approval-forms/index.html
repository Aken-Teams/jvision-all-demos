<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>表單簽核流程艙 · 簽核作業終端</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;
  --bg:#0b0e1a;--panel:#141a2e;--panel2:#1b2340;--line:#28304f;
  --txt:#e6e9f5;--mut:#8b93b5;--dim:#5c6488;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--cyan:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#10152a,#0d1122);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(79,70,229,.5);flex:none}
.logo .ms{color:#fff;font-size:22px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand p{font-size:11px;color:var(--dim);white-space:nowrap}
.tag-live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);background:var(--panel2);padding:6px 12px;border-radius:20px;border:1px solid var(--line);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.5)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(52,211,153,0)}}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;background:#0d1122;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:35}
.nbtn{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s}
.nbtn:hover{border-color:var(--accent2);color:var(--txt)}
.nbtn.on{background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.4)}
.nbtn .ms{font-size:19px}
.nbtn small{background:rgba(0,0,0,.25);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700}
main{padding:20px 18px 60px;max-width:1360px;margin:0 auto}
.scr-head{margin-bottom:18px}
.scr-head .kick{font-size:11px;letter-spacing:2px;color:var(--accent2);font-weight:700;text-transform:uppercase}
.scr-head h2{font-size:23px;font-weight:800;margin-top:3px;display:flex;align-items:center;gap:10px}
.scr-head p{color:var(--mut);font-size:13px;margin-top:4px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23{grid-template-columns:1fr}}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.ctitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:14px;flex-wrap:wrap}
.ctitle .ms{font-size:18px;color:var(--accent2)}
.ctitle .sub{margin-left:auto;font-size:11px;color:var(--dim);font-weight:500}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lbl .ms{font-size:16px}
.kpi .val{font-size:29px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;color:var(--mut);font-weight:600}
.kpi .delta{font-size:11px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:3px}
.kpi .delta .ms{font-size:14px}
.up{color:var(--green)}.down{color:var(--red)}.neu{color:var(--amber)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:10px 12px;border-bottom:1px solid var(--line);letter-spacing:.5px;text-transform:uppercase}
td{padding:11px 12px;border-bottom:1px solid rgba(40,48,79,.5);color:var(--txt)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(79,70,229,.07)}
.mono{font-family:'Inter';font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-g{background:rgba(52,211,153,.15);color:var(--green)}
.b-r{background:rgba(248,113,113,.15);color:var(--red)}
.b-a{background:rgba(251,191,36,.15);color:var(--amber)}
.b-b{background:rgba(129,140,248,.18);color:var(--accent2)}
.b-c{background:rgba(56,189,248,.15);color:var(--cyan)}
.b-n{background:rgba(139,147,181,.15);color:var(--mut)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.who{display:flex;align-items:center;gap:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.board>*{min-width:0}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.col h4{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:2px 4px}
.col h4 .cnt{margin-left:auto;background:var(--panel);color:var(--mut);border-radius:20px;padding:1px 8px;font-size:11px}
.tik{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;border-left:3px solid var(--accent)}
.tik .no{font-size:10px;color:var(--dim);font-family:'Inter';letter-spacing:.5px}
.tik .tt{font-size:12.5px;font-weight:600;margin:4px 0 8px}
.tik .mt{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.tik .amt{margin-left:auto;font-weight:700;color:var(--accent2);font-family:'Inter'}
.flowmap{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px}
.fnode{flex:none;width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;position:relative}
.fnode .fn-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.fnode .fn-ic .ms{font-size:19px;color:#fff}
.fnode h5{font-size:13px;font-weight:700}
.fnode .rl{font-size:11px;color:var(--mut);margin-top:3px}
.fnode .cond{margin-top:9px;font-size:10.5px;color:var(--accent2);background:rgba(79,70,229,.12);border-radius:6px;padding:4px 7px;line-height:1.4}
.farrow{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.farrow .ms{font-size:22px}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center}
.tl-item .tl-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-item .tl-hd b{font-size:13px}
.tl-item .tl-hd time{font-size:11px;color:var(--dim);font-family:'Inter';margin-left:auto}
.tl-item .tl-bd{font-size:12px;color:var(--mut);margin-top:5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.tl-item .tl-bd .cmt{color:var(--txt);font-style:italic}
.tpl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;transition:.15s;position:relative;overflow:hidden}
.tpl:hover{border-color:var(--accent2);transform:translateY(-2px)}
.tpl .th{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tpl .tic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.tpl .tic .ms{color:#fff;font-size:22px}
.tpl h4{font-size:14px;font-weight:700}
.tpl .code{font-size:10px;color:var(--dim);font-family:'Inter'}
.tpl .desc{font-size:11.5px;color:var(--mut);line-height:1.5;min-height:34px}
.tpl .foot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.tpl .foot .used{margin-left:auto;color:var(--accent2);font-weight:700;font-family:'Inter'}
.frm{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.frm .row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.frm .fld{flex:1;min-width:120px}
.frm label{font-size:11px;color:var(--dim);display:block;margin-bottom:5px}
.frm .inp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--txt)}
.frm .inp.big{font-size:16px;font-weight:700;color:var(--accent2);font-family:'Inter'}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(40,48,79,.5)}
.srow:last-child{border-bottom:none}
.srow .nm{font-size:12.5px;font-weight:500;flex:1;min-width:0}
.heat{display:grid;gap:5px;font-size:11px}
.heat .hc{border-radius:6px;padding:9px 4px;text-align:center;font-weight:600;font-family:'Inter';color:#fff}
.heat .hh{color:var(--dim);font-weight:600;text-align:center;padding:4px 0;font-size:10.5px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:12px;flex-wrap:wrap}
.legend i{width:22px;height:10px;border-radius:3px;display:inline-block}
.chartbox{width:100%}
.foot-note{text-align:center;color:var(--dim);font-size:11px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:560px){.nbtn .lab{display:none}.nbtn{padding:9px 11px}.brand p{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="ms">approval_delegation</span></div>
    <div><h1>表單簽核流程艙</h1><p>Office Approval Workflow Terminal</p></div>
  </div>
  <div class="tag-live"><span class="dot"></span>簽核引擎運行中 · 今日 137 筆單據</div>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<script>
"use strict";
var C={accent:"#4f46e5",accent2:"#818cf8",green:"#34d399",red:"#f87171",amber:"#fbbf24",cyan:"#38bdf8",grid:"#28304f",lab:"#8b93b5"};
var MODS=[
 {icon:"dashboard",name:"簽核總覽",kick:"OVERVIEW"},
 {icon:"assignment",name:"待簽清單",kick:"MY QUEUE"},
 {icon:"account_tree",name:"流程設計",kick:"FLOW DESIGN"},
 {icon:"history",name:"簽核軌跡",kick:"AUDIT TRAIL"},
 {icon:"receipt_long",name:"表單範本",kick:"TEMPLATES"},
 {icon:"monitoring",name:"效率分析",kick:"ANALYTICS"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function av(name,color){var c=name.charAt(0);return '<span class="av" style="background:'+color+'">'+c+'</span>';}
function nfmt(n){try{return (n||0).toLocaleString('en-US');}catch(e){return String(n||0);}}

(function(){var nav=document.getElementById("nav");
 for(var i=0;i<MODS.length;i++){(function(i){
   var b=el("button","nbtn"+(i===0?" on":""));
   b.setAttribute("data-i",i);
   b.innerHTML='<span class="ms">'+MODS[i].icon+'</span><span class="lab">'+MODS[i].name+'</span><small>v'+i+'</small>';
   b.addEventListener("click",function(){show(i);});
   nav.appendChild(b);
 })(i);}
})();
function head(i,desc){var m=MODS[i];return '<div class="scr-head"><div class="kick">'+m.kick+' · v'+i+'</div><h2><span class="ms" style="color:var(--accent2)">'+m.icon+'</span>'+m.name+'</h2><p>'+desc+'</p></div>';}

/* SCREEN 0 : 簽核總覽 */
function scr0(app){
 var kpis=[
  {ic:"pending_actions",lbl:"待簽核單據",val:"137",u:"筆",d:"+12 較昨日",cls:"neu",bar:C.amber},
  {ic:"schedule",lbl:"平均簽核耗時",val:"6.4",u:"小時",d:"-1.8h 優化",cls:"up",bar:C.green},
  {ic:"warning",lbl:"逾期關卡",val:"9",u:"關",d:"+3 需關注",cls:"down",bar:C.red},
  {ic:"task_alt",lbl:"今日核准率",val:"91",u:"%",d:"+4% 週提升",cls:"up",bar:C.accent2}
 ];
 var g=el("div","grid g4");
 kpis.forEach(function(k){g.appendChild(el("div","card kpi",
  '<span class="bar" style="background:'+k.bar+'"></span>'+
  '<div class="lbl"><span class="ms">'+k.ic+'</span>'+k.lbl+'</div>'+
  '<div class="val">'+k.val+' <small>'+k.u+'</small></div>'+
  '<div class="delta '+k.cls+'"><span class="ms">'+(k.cls==="down"?"trending_down":k.cls==="up"?"trending_up":"remove")+'</span>'+k.d+'</div>'));});
 app.appendChild(g);

 var row=el("div","grid g23");row.style.marginTop="14px";
 var c1=el("div","card");
 c1.innerHTML='<div class="ctitle"><span class="ms">stacked_line_chart</span>本週各表單類型簽核量<span class="sub">單位：筆</span></div><div id="ch0a" class="chartbox"></div>';
 var c2=el("div","card");
 c2.innerHTML='<div class="ctitle"><span class="ms">donut_small</span>單據狀態分佈</div><div id="ch0b" class="chartbox"></div>';
 row.appendChild(c1);row.appendChild(c2);app.appendChild(row);

 var c3=el("div","card");c3.style.marginTop="14px";
 c3.innerHTML='<div class="ctitle"><span class="ms">notifications_active</span>急件與逾期提醒<span class="sub">依規則自動升級</span></div>';
 var alerts=[
  {no:"REQ-24817",t:"IT 設備採購 · NT$ 428,000",who:"陳品妤",dep:"資訊部",wait:"52 小時",st:"b-r",sl:"逾期升級主管"},
  {no:"EXP-19023",t:"海外參展差旅費核銷",who:"林郁翔",dep:"行銷部",wait:"31 小時",st:"b-a",sl:"即將逾期"},
  {no:"PO-33120",t:"原物料月度採購合約",who:"黃冠廷",dep:"採購部",wait:"27 小時",st:"b-a",sl:"跨部門待回覆"},
  {no:"REQ-24790",t:"新產線工具機請購",who:"吳承恩",dep:"生產部",wait:"18 小時",st:"b-c",sl:"財務審核中"}
 ];
 var wrap=el("div");wrap.style.cssText="overflow-x:auto";
 var cols=[C.accent,C.cyan,C.amber,C.green];
 var t='<table><thead><tr><th>單號</th><th>摘要</th><th>申請人</th><th>已等待</th><th>狀態</th></tr></thead><tbody>';
 alerts.forEach(function(a,i){t+='<tr><td class="mono" style="color:var(--accent2)">'+a.no+'</td><td>'+a.t+'</td><td><div class="who">'+av(a.who,cols[i%4])+a.who+' · '+a.dep+'</div></td><td class="mono">'+a.wait+'</td><td><span class="badge '+a.st+'">'+a.sl+'</span></td></tr>';});
 t+='</tbody></table>';
 wrap.innerHTML=t;c3.appendChild(wrap);app.appendChild(c3);

 void app.offsetHeight;
 var o1=new ApexCharts(document.querySelector("#ch0a"),{
   chart:{type:"bar",height:300,stacked:true,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},foreColor:C.lab},
   series:[{name:"核准",data:[42,38,55,29,31]},{name:"進行中",data:[18,22,14,20,12]},{name:"退回",data:[5,3,7,4,6]}],
   colors:[C.accent2,C.cyan,C.red],
   plotOptions:{bar:{columnWidth:"52%",borderRadius:4}},
   dataLabels:{enabled:false},
   xaxis:{categories:["請購單","費用核銷","請假單","合約審批","加班申請"],labels:{style:{colors:C.lab}}},
   yaxis:{labels:{style:{colors:C.lab}}},
   legend:{labels:{colors:C.lab},position:"top"},
   grid:{borderColor:C.grid},tooltip:{theme:"dark"}
 });o1.render();charts.push(o1);

 var o2=new ApexCharts(document.querySelector("#ch0b"),{
   chart:{type:"donut",height:300,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},foreColor:C.lab},
   series:[137,64,21,9],labels:["待簽核","進行中","已完成","逾期"],
   colors:[C.accent2,C.cyan,C.green,C.red],
   stroke:{width:2,colors:["#141a2e"]},
   dataLabels:{enabled:false},
   legend:{position:"bottom",labels:{colors:C.lab}},
   plotOptions:{pie:{donut:{size:"66%",labels:{show:true,total:{show:true,label:"單據總數",color:C.lab,formatter:function(){return "231";}}}}}},
   tooltip:{theme:"dark"}
 });o2.render();charts.push(o2);
}

/* SCREEN 1 : 待簽清單 (board) */
function scr1(app){
 var top=el("div","grid g4");
 [{ic:"inbox",lbl:"我的待簽",v:"14",c:C.accent2},{ic:"hourglass_top",lbl:"今日到期",v:"5",c:C.amber},{ic:"payments",lbl:"待核金額",v:"NT$ 2.1M",c:C.green},{ic:"swap_horiz",lbl:"代理簽核",v:"3",c:C.cyan}].forEach(function(k){
  top.appendChild(el("div","card kpi",'<span class="bar" style="background:'+k.c+'"></span><div class="lbl"><span class="ms">'+k.ic+'</span>'+k.lbl+'</div><div class="val">'+k.v+'</div>'));});
 app.appendChild(top);

 var bcard=el("div","card");bcard.style.marginTop="14px";
 bcard.innerHTML='<div class="ctitle"><span class="ms">view_kanban</span>我的簽核工作區 · 王振宏（財務長）<span class="sub">拖曳象徵操作，資料為擬真</span></div>';
 var cols=[
  {h:"待我簽核",ic:"radio_button_unchecked",cl:C.amber,items:[
    {no:"EXP-19023",t:"海外參展差旅費核銷",who:"林郁翔",amt:"NT$ 86,400",due:"今日 17:00",b:"b-a",bt:"急件"},
    {no:"REQ-24817",t:"IT 設備採購請購單",who:"陳品妤",amt:"NT$ 428,000",due:"逾期 4h",b:"b-r",bt:"逾期"},
    {no:"OT-08841",t:"季末結算加班申請",who:"財務團隊",amt:"32 小時",due:"明日",b:"b-b",bt:"批次"}
  ]},
  {h:"審核中",ic:"pending",cl:C.cyan,items:[
    {no:"PO-33120",t:"原物料月度採購合約",who:"黃冠廷",amt:"NT$ 1,240,000",due:"3 天",b:"b-c",bt:"法務中"},
    {no:"REQ-24790",t:"新產線工具機請購",who:"吳承恩",amt:"NT$ 310,000",due:"2 天",b:"b-b",bt:"技審"}
  ]},
  {h:"已核准",ic:"check_circle",cl:C.green,items:[
    {no:"LEA-55210",t:"特休請假單",who:"張雅涵",amt:"3 天",due:"—",b:"b-g",bt:"完成"},
    {no:"EXP-18990",t:"客戶招待費用",who:"周世豪",amt:"NT$ 12,300",due:"—",b:"b-g",bt:"完成"}
