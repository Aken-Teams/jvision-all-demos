<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
--color-primary:#0D9488;--color-on-primary:#000;--color-secondary:#2DD4BF;--color-on-secondary:#0F172A;
--color-accent:#D97706;--color-on-accent:#000;--color-background:#F0FDFA;--color-foreground:#134E4A;
--color-card:#FFF;--color-card-foreground:#134E4A;--color-muted:#E8F1F4;--color-muted-foreground:#475569;
--color-border:#5EEAD4;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#0D9488;
--blue:#0D9488;--ink:#134E4A;--muted:#475569;--line:#5EEAD4;
--ok:#047857;--warn:#B45309;--bad:#B91C1C;--radius:8px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{background:var(--color-background);color:var(--ink);font-family:"Crimson Pro","Noto Serif TC",serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.msi{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--color-primary)}
.topbar-inner{max-width:1400px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;min-width:245px}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--color-primary);color:#001C19;border:2px solid var(--color-primary);border-radius:6px;font-size:24px}
.brand b,.screen-head h1,.kpi .val{font-family:"Cormorant Garamond","Noto Serif TC",serif}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:.03em}
.brand span{display:block;color:var(--muted);font-family:"Cinzel",serif;font-size:9px;letter-spacing:.11em}
.nav{display:flex;gap:5px;margin-left:auto;overflow-x:auto;padding:3px}
.nav button{min-height:42px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);padding:8px 11px;display:flex;align-items:center;gap:6px;font-family:"Crimson Pro","Noto Serif TC",serif;font-size:14px;font-weight:600;white-space:nowrap;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.nav button .msi{font-size:19px}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.active{background:var(--color-primary);border-color:var(--color-primary);color:#001C19}
.wrap{max-width:1400px;margin:auto;padding:28px 20px 64px}
.screen-head{border-left:5px solid var(--color-accent);padding:4px 0 5px 16px;margin-bottom:22px}
.screen-head h1{margin:0 0 4px;font-size:clamp(25px,3vw,34px);line-height:1.12;font-weight:700;letter-spacing:.01em}
.screen-head p{margin:0;color:var(--muted);font-size:15px}
.tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:7px;color:#0F615B;font-family:"Cinzel","Noto Serif TC",serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.tag .msi{font-size:16px}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g-23{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.panel,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius)}
.panel{padding:18px}
.panel h3{margin:0 0 14px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.panel h3 .msi{color:var(--color-primary);font-size:20px}
.kpi{position:relative;padding:17px 18px;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-primary)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .lab .msi{color:var(--color-primary);font-size:18px}
.kpi .val{margin-top:6px;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val small{color:var(--muted);font-family:"Crimson Pro","Noto Serif TC",serif;font-size:14px;font-weight:600}
.kpi .delta{margin-top:5px;font-size:13px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart-wrap{position:relative;overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid #B9EAE4;text-align:left;white-space:nowrap}
th{background:#E0F7F4;color:#315E5A;font-family:"Cinzel","Noto Serif TC",serif;font-size:11px;font-weight:600;letter-spacing:.04em}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#ECFDF9}
.num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-family:"Crimson Pro",monospace}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.3}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:#ECFDF5;color:#047857}.p-warn{background:#FFFBEB;color:#92400E}.p-bad{background:#FEF2F2;color:#B91C1C}.p-neu{background:#F0FDFA;color:#0F766E}
.board{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:10px;min-width:1080px}
.col{min-width:0;padding:10px;background:#F4FBFA;border:1px solid #B9EAE4;border-radius:6px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 10px}
.col-head b{font-size:14px}.cnt{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.card{margin-bottom:9px;padding:11px;background:#fff;border:1px solid #B9EAE4;border-left:4px solid var(--color-primary);border-radius:5px;transition:background-color .18s ease,border-color .18s ease}
.card:hover{background:#F0FDFA;border-color:var(--color-primary)}
.card:last-child{margin-bottom:0}.card .ttl{margin-bottom:6px;font-size:14px;font-weight:600}.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px}.card .meta .msi{font-size:15px}
.chip{display:inline-flex;border:1px solid var(--color-secondary);border-radius:4px;background:#E6FFFB;color:#0F615B;padding:1px 7px;font-size:11px;font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;margin-left:7px;padding:0 0 18px 27px;border-left:2px solid #99DCD4}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:var(--color-primary);outline:1px solid var(--color-primary)}
.tl .t{font-size:14px;font-weight:600}.tl .d{margin-top:2px;color:var(--muted);font-size:13px}.tl .tm{color:#0F766E;font-family:monospace;font-size:11px;font-weight:700}
.srcrow{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:11px;border:1px solid #B9EAE4;border-radius:6px;background:#fff}
.srcrow:last-child{margin-bottom:0}
.src-ic{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border-radius:5px;color:#001C19;font-size:22px}
.src-main{flex:1;min-width:120px}.src-main b{font-size:15px}.src-main .m{color:var(--muted);font-size:12px}
.bar{height:7px;margin-top:6px;overflow:hidden;border-radius:2px;background:#D7EAE8}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--color-primary)}
.ins{margin-bottom:10px;padding:13px;border:1px solid #B9EAE4;border-left:5px solid var(--color-primary);border-radius:5px;background:#fff}
.ins:last-child{margin-bottom:0}.ins .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}.ins .h .msi{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;border-radius:4px;color:#fff;font-size:19px}.ins .h b{font-size:15px}.ins p{margin:0;color:var(--muted);font-size:13px}.ins .sev{margin-left:auto}
.sc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #B9EAE4}.sc:last-child{border:0}.sc .nm{flex:1;min-width:110px;font-size:14px;font-weight:600}.mini{margin-top:2px;color:var(--muted);font-size:12px}
.status-icon{font-size:17px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:3px;display:inline-block}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}
.reveal{animation:reveal .36s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.topbar-inner{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:768px){.wrap{padding:22px 14px 50px}.g2,.g3,.g-32,.g-23{grid-template-columns:1fr}.panel{padding:15px}.screen-head h1{font-size:27px}}
@media(max-width:480px){.topbar-inner{padding:10px 12px}.brand{min-width:0}.brand span{display:none}.nav button{min-width:43px;justify-content:center;padding:9px}.nav .lbl{display:none}.g4{grid-template-columns:1fr}.kpi .val{font-size:28px}.srcrow{align-items:flex-start;flex-wrap:wrap}.screen-head{padding-left:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<div class="brand">
<div class="logo msi" aria-hidden="true">insights</div>
<div><b>企業經營數據分析儀表板</b><span>EXECUTIVE MANAGEMENT INTELLIGENCE</span></div>
</div>

</div>

<main class="wrap">

<script>
(function(){
"use strict";
var C={a:"#0D9488",a2:"#2DD4BF",soft:"#CCFBF1",ink:"#134E4A",mut:"#475569",ok:"#047857",warn:"#B45309",bad:"#B91C1C",line:"#B9EAE4"};
var charts={};
var MODULES=[
{i:"account_tree",n:"資料源整合"},{i:"dashboard",n:"經營儀表板"},{i:"trending_up",n:"趨勢與下鑽"},
{i:"insights",n:"AI 異常洞察"},{i:"task_alt",n:"決策議題看板"},{i:"receipt_long",n:"排程報表"}
];
function killCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function mkChart(id,cfg){
var el=document.getElementById(id);if(!el)return;
if(charts[id])try{charts[id].destroy()}catch(e){}
cfg.options=cfg.options||{};cfg.options.responsive=true;cfg.options.maintainAspectRatio=false;
charts[id]=new Chart(el.getContext("2d"),cfg)
}
Chart.defaults.font.family="'Crimson Pro','Noto Serif TC',serif";
Chart.defaults.color=C.mut;
Chart.defaults.plugins.legend.labels.boxWidth=12;
Chart.defaults.plugins.legend.labels.padding=14;
function kpi(ic,lab,val,unit,delta){
return '<div class="kpi"><div class="lab"><span class="msi" aria-hidden="true">'+ic+'</span>'+lab+'</div><div class="val">'+val+' <small>'+(unit||"")+'</small></div><div class="delta">'+(delta||"")+'</div></div>'
}
function s0(){
var srcs=[
{n:"ERP 財務主檔",t:"A 牌 ERP · 每 15 分鐘",ic:"receipt_long",bg:"#0D9488",rows:"1,284,900",fresh:99,st:"ok"},
{n:"MES 生產實績",t:"廠區即時串流",ic:"factory",bg:"#2DD4BF",rows:"842,110",fresh:97,st:"ok"},
{n:"CRM 客戶訂單",t:"每小時同步",ic:"groups",bg:"#14B8A6",rows:"318,540",fresh:92,st:"warn"},
{n:"倉儲庫存",t:"每 30 分鐘",ic:"inventory_2",bg:"#5EEAD4",rows:"96,220",fresh:100,st:"ok"},
{n:"財務預算表",t:"每日 06:00",ic:"request_quote",bg:"#0F766E",rows:"12,880",fresh:88,st:"warn"}],rows="";
srcs.forEach(function(s){
var pill=s.st==="ok"?'<span class="pill p-ok">健康</span>':'<span class="pill p-warn">延遲</span>';
rows+='<div class="srcrow"><div class="src-ic" style="background:'+s.bg+'"><span class="msi" aria-hidden="true">'+s.ic+'</span></div><div class="src-main"><b>'+s.n+'</b><div class="m">'+s.t+' · '+s.rows+' 筆</div><div class="bar"><i style="width:'+s.fresh+'%"></i></div></div><div class="num"><b>'+s.fresh+'%</b><br>'+pill+'</div></div>'
});
var etl=[
{t:"擷取 Extract",d:"5 個來源系統原始資料落地",tm:"06:00",st:"完成"},
{t:"清洗 Cleanse",d:"去重、空值補齊、單位對齊",tm:"06:12",st:"完成"},
{t:"轉換 Transform",d:"欄位對映與主檔 Key 統一",tm:"06:31",st:"完成"},
{t:"載入 Load",d:"寫入資料倉儲維度表",tm:"06:48",st:"進行中"},
{t:"驗證 Validate",d:"筆數核對與品質規則檢核",tm:"—",st:"待處理"}],tl="";
etl.forEach(function(e){var cl=e.st==="完成"?"p-ok":e.st==="進行中"?"p-neu":"p-warn";tl+='<li><div class="t">'+e.t+' <span class="pill '+cl+'">'+e.st+'</span></div><div class="d">'+e.d+'</div><div class="tm">'+e.tm+'</div></li>'});
return '<div class="screen-head"><span class="tag"><span class="msi">account_tree</span>模組一</span><h1>資料源整合 · ETL 管線</h1><p>接取 ERP / MES / CRM / 財務等來源，完成清洗對齊，建立可信單一資料底層。</p></div>'+
'<div class="grid g4" style="margin-bottom:14px">'+kpi("hub","接入來源系統","5","個 · 全連線",'<span class="up">＋1 本季</span>')+kpi("sync","今日同步筆數","2.55M","筆",'<span class="up">上升 4.2%</span>')+kpi("timer","平均延遲","3.4","分鐘",'<span class="up">改善 1.1 分</span>')+kpi("verified","資料品質分","96.2","分/100",'<span class="up">上升 2.0</span>')+'</div>'+
'<div class="grid g-32"><section class="panel"><h3><span class="msi">lan</span>資料源接取狀態</h3>'+rows+'</section><section class="panel"><h3><span class="msi">conveyor_belt</span>今日 ETL 排程</h3><ul class="tl">'+tl+'</ul></section></div>'+
'<div class="grid g2" style="margin-top:14px"><section class="panel"><h3><span class="msi">monitoring</span>近 7 日資料量趨勢（萬筆）</h3><div class="chart-wrap" style="height:230px"><canvas id="c0a"></canvas></div></section><section class="panel"><h3><span class="msi">rule</span>資料品質檢核分佈</h3><div class="chart-wrap" style="height:230px"><canvas id="c0b"></canvas></div></section></div>'
}
function s0charts(){
mkChart("c0a",{type:"line",data:{labels:["7/08","7/09","7/10","7/11","7/12","7/13","7/14"],datasets:[
{label:"ERP",data:[118,121,120,125,124,128,128],borderColor:C.a,backgroundColor:"rgba(13,148,136,.10)",fill:true,tension:.25},
{label:"MES",data:[80,82,79,83,84,85,84],borderColor:C.a2,backgroundColor:"rgba(45,212,191,.08)",fill:true,tension:.25},
{label:"CRM",data:[29,30,31,30,32,31,32],borderColor:"#D97706",backgroundColor:"rgba(217,119,6,.05)",fill:true,tension:.25}]},options:{plugins:{legend:{position:"bottom"}},scales:{y:{grid:{color:C.line}},x:{grid:{display:false}}}}});
mkChart("c0b",{type:"doughnut",data:{labels:["通過","警示","失敗"],datasets:[{data:[912,64,11],backgroundColor:[C.a,C.warn,C.bad],borderWidth:2,borderColor:"#fff"}]},options:{cutout:"62%",plugins:{legend:{position:"bottom"}}}})
}
function s1(){
var sc=[
{nm:"營收達成率",v:92,tgt:"目標 100%",st:"warn"},{nm:"毛利率",v:100,tgt:"目標 28%（現 29.4%）",st:"ok"},
{nm:"現金週轉天數",v:78,tgt:"目標 ≤ 45 天（現 52 天）",st:"warn"},{nm:"訂單準交率",v:96,tgt:"目標 95%",st:"ok"},
{nm:"客訴率",v:60,tgt:"目標 ≤ 0.8%（現 1.3%）",st:"bad"}],scr="";
sc.forEach(function(s){
var col=s.st==="ok"?C.ok:s.st==="warn"?C.warn:C.bad,txt=s.st==="ok"?"達標":s.st==="warn"?"注意":"偏離",ic=s.st==="ok"?"check_circle":s.st==="warn"?"warning":"error";
scr+='<div class="sc"><span class="msi status-icon" style="color:'+col+'" aria-hidden="true">'+ic+'</span><div class="nm">'+s.nm+' · '+txt+'<div class="mini">'+s.tgt+'</div></div><div class="bar" style="width:120px"><i style="width:'+s.v+'%;background:'+col+'"></i></div><b class="num" style="width:44px">'+s.v+'%</b></div>'
});
return '<div class="screen-head"><span class="tag"><span class="msi">dashboard</span>模組二</span><h1>經營儀表板 · 總經理視圖</h1><p>關鍵指標即時彙整，一眼掌握本月營運全貌與策略計分卡。</p></div>'+
'<div class="grid g4" style="margin-bottom:14px">'+kpi("payments","本月營收","4.82","億",'<span class="up">上升 6.8% MoM</span>')+kpi("trending_up","毛利率","29.4","%",'<span class="up">上升 1.2pt</span>')+kpi("shopping_cart","在手訂單","9.1","億",'<span class="flat">持平</span>')+kpi("warning","逾期應收","3,240","萬",'<span class="down">風險上升 8.5%</span>')+'</div>'+
'<div class="grid g-32"><section class="panel"><h3><span class="msi">bar_chart</span>各廠區月營收 vs 目標（百萬）</h3><div class="chart-wrap" style="height:270px"><canvas id="c1a"></canvas></div></section><section class="panel"><h3><span class="msi">scoreboard</span>策略計分卡</h3>'+scr+'</section></div>'+
'<div class="grid g2" style="margin-top:14px"><section class="panel"><h3><span class="msi">donut_small</span>營收產品線佔比</h3><div class="chart-wrap" style="height:240px"><canvas id="c1b"></canvas></div></section><section class="panel"><h3><span class="msi">show_chart</span>近 6 個月營收與毛利趨勢</h3><div class="chart-wrap" style="height:240px"><canvas id="c1c"></canvas></div></section></div>'
}
function s1charts(){
