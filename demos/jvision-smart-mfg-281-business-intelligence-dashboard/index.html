<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BI 商業智慧儀表板 | 經營洞察平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#9333ea; --accent2:#c084fc; --accent-soft:#f3e8ff;
  --bg:#f6f4fb; --panel:#ffffff; --ink:#1f1330; --muted:#6b647a;
  --line:#ece7f3; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 6px 24px rgba(80,40,120,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(100deg,#3a1360,#9333ea 60%,#a855f7);
  color:#fff; box-shadow:0 4px 18px rgba(76,29,149,.25);
}
.topbar-inner{
  max-width:1360px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:11px;
  background:rgba(255,255,255,.16); display:grid;place-items:center; font-size:22px;
}
.brand b{font-size:16px; font-weight:800; letter-spacing:.3px; white-space:nowrap;}
.brand span{font-size:11px; opacity:.8; display:block;}
.nav{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; min-width:0;}
.nav button{
  border:0; cursor:pointer; border-radius:10px;
  background:rgba(255,255,255,.1); color:#fff;
  padding:8px 12px; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:7px; font-family:inherit; transition:.15s;
}
.nav button .msi{font-size:19px;}
.nav button:hover{background:rgba(255,255,255,.22);}
.nav button.active{background:#fff; color:var(--accent);}
.wrap{max-width:1360px; margin:0 auto; padding:20px 18px 60px;}
.screen-head{margin-bottom:18px;}
.screen-head h1{font-size:22px; margin:0 0 4px; font-weight:800;}
.screen-head p{margin:0; color:var(--muted); font-size:13.5px;}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--accent-soft); color:var(--accent);
  font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; margin-bottom:8px;
}
.tag .msi{font-size:15px;}
.panel{
  background:var(--panel); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--shadow); padding:18px;
}
.panel h3{margin:0 0 12px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;}
.panel h3 .msi{font-size:19px; color:var(--accent);}
.grid{display:grid; gap:16px; min-width:0;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g-32{grid-template-columns:1.4fr 1fr;}
.g-23{grid-template-columns:1fr 1.4fr;}
.grid>*{min-width:0;}
@media(max-width:820px){
  .g2,.g3,.g4,.g-32,.g-23{grid-template-columns:1fr;}
}
.kpi{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:15px 16px; box-shadow:var(--shadow); min-width:0;
}
.kpi .lab{font-size:12.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px;}
.kpi .lab .msi{font-size:17px; color:var(--accent);}
.kpi .val{font-size:26px; font-weight:800; margin-top:6px; letter-spacing:.5px;}
.kpi .val small{font-size:13px; color:var(--muted); font-weight:600;}
.kpi .delta{font-size:12px; font-weight:700; margin-top:3px;}
.up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}
.chart-wrap{position:relative; overflow:hidden;}
.tbl-scroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:520px;}
th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700;}
tbody tr:hover{background:var(--accent-soft);}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;}
.p-ok{background:#dcfce7;color:#15803d;}
.p-warn{background:#fef3c7;color:#b45309;}
.p-bad{background:#fee2e2;color:#b91c1c;}
.p-neu{background:#ede9fe;color:#6d28d9;}
.board{display:grid; grid-template-columns:repeat(5,minmax(200px,1fr)); gap:12px; min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.board>*{min-width:0;}
.col{background:#faf8fe; border:1px solid var(--line); border-radius:14px; padding:10px; min-width:0;}
.col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; padding:0 3px;}
.col-head b{font-size:12.5px;}
.col-head .cnt{font-size:11px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted);}
.card{
  background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:11px; padding:10px 11px; margin-bottom:9px; box-shadow:0 2px 6px rgba(80,40,120,.05);
}
.card:last-child{margin-bottom:0;}
.card .ttl{font-size:13px; font-weight:700; margin-bottom:5px;}
.card .meta{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.card .meta .msi{font-size:14px;}
.chip{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:6px; background:var(--accent-soft); color:var(--accent);}
.tl{list-style:none; margin:0; padding:0;}
.tl li{position:relative; padding:0 0 16px 26px; border-left:2px solid var(--line); margin-left:6px;}
.tl li:last-child{border-left-color:transparent; padding-bottom:0;}
.tl li::before{content:""; position:absolute; left:-7px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 2px var(--accent-soft);}
.tl .t{font-size:13px; font-weight:700;}
.tl .d{font-size:12px; color:var(--muted); margin-top:2px;}
.tl .tm{font-size:11px; color:var(--accent); font-weight:700;}
.srcrow{display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fff; min-width:0; flex-wrap:wrap;}
.srcrow:last-child{margin-bottom:0;}
.src-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:22px;flex-shrink:0;}
.src-main{flex:1; min-width:120px;}
.src-main b{font-size:14px;}
.src-main .m{font-size:11.5px; color:var(--muted);}
.bar{height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px;}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px;}
.ins{border:1px solid var(--line); border-radius:13px; padding:13px; margin-bottom:12px; background:#fff; border-left:5px solid var(--accent);}
.ins:last-child{margin-bottom:0;}
.ins .h{display:flex; align-items:center; gap:9px; margin-bottom:6px; flex-wrap:wrap;}
.ins .h .msi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:19px;color:#fff;flex-shrink:0;}
.ins .h b{font-size:14px;}
.ins p{margin:0; font-size:12.5px; color:var(--muted);}
.ins .sev{margin-left:auto;}
.sc{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap;}
.sc:last-child{border-bottom:0;}
.sc .nm{font-size:13px; font-weight:600; flex:1; min-width:110px;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.mini{font-size:11px;color:var(--muted);margin-top:2px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:10px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.foot{margin-top:26px; text-align:center; color:var(--muted); font-size:12px;}
@media(max-width:560px){
  .nav button span.lbl{display:none;}
  .nav button{padding:9px 11px;}
  .brand span{display:none;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo msi">insights</div>
      <div>
        <b>BI 經營智慧平台</b>
        <span>Business Intelligence Dashboard</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<div class="wrap">
  <div id="app"></div>
  <div class="foot">BI 商業智慧儀表板 · 純前端展示 Demo · 假資料僅供介面示意</div>
</div>

<script>
(function(){
"use strict";
var C={a:"#9333ea",a2:"#c084fc",soft:"#f3e8ff",ink:"#1f1330",mut:"#6b647a",ok:"#16a34a",warn:"#d97706",bad:"#dc2626",line:"#ece7f3"};
var charts={};

var MODULES=[
  {i:"account_tree",n:"資料源整合"},
  {i:"dashboard",n:"經營儀表板"},
  {i:"trending_up",n:"趨勢與下鑽"},
  {i:"insights",n:"AI 異常洞察"},
  {i:"task_alt",n:"決策議題看板"},
  {i:"receipt_long",n:"排程報表"}
];

function killCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  if(charts[id]){try{charts[id].destroy();}catch(e){}}
  cfg.options=cfg.options||{};
  cfg.options.responsive=true;
  cfg.options.maintainAspectRatio=false;
  charts[id]=new Chart(el.getContext("2d"),cfg);
}
Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
Chart.defaults.color=C.mut;
Chart.defaults.plugins.legend.labels.boxWidth=12;
Chart.defaults.plugins.legend.labels.padding=14;

function kpi(ic,lab,val,unit,delta){
  return '<div class="kpi"><div class="lab"><span class="msi">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+' <small>'+(unit||"")+'</small></div><div class="delta">'+(delta||"")+'</div></div>';
}

/* ---------- screen 0: 資料源整合 ---------- */
function s0(){
  var srcs=[
    {n:"ERP 財務主檔",t:"SAP · 每 15 分鐘",ic:"receipt_long",bg:"#9333ea",rows:"1,284,900",fresh:99,st:"ok"},
    {n:"MES 生產實績",t:"廠區即時串流",ic:"factory",bg:"#c084fc",rows:"842,110",fresh:97,st:"ok"},
    {n:"CRM 客戶訂單",t:"每小時同步",ic:"groups",bg:"#7c3aed",rows:"318,540",fresh:92,st:"warn"},
    {n:"倉儲庫存",t:"每 30 分鐘",ic:"inventory_2",bg:"#a855f7",rows:"96,220",fresh:100,st:"ok"},
    {n:"財務預算表",t:"每日 06:00",ic:"request_quote",bg:"#6d28d9",rows:"12,880",fresh:88,st:"warn"}
  ];
  var rows="";
  srcs.forEach(function(s){
    var pill=s.st==="ok"?'<span class="pill p-ok">健康</span>':'<span class="pill p-warn">延遲</span>';
    rows+='<div class="srcrow"><div class="src-ic" style="background:'+s.bg+'"><span class="msi">'+s.ic+'</span></div>'+
      '<div class="src-main"><b>'+s.n+'</b><div class="m">'+s.t+' · '+s.rows+' 筆</div>'+
      '<div class="bar"><i style="width:'+s.fresh+'%"></i></div></div>'+
      '<div style="text-align:right"><div style="font-weight:800;font-size:15px">'+s.fresh+'%</div>'+pill+'</div></div>';
  });
  var etl=[
    {t:"擷取 Extract",d:"5 個來源系統原始資料落地",tm:"06:00",st:"完成"},
    {t:"清洗 Cleanse",d:"去重、空值補齊、單位對齊",tm:"06:12",st:"完成"},
    {t:"轉換 Transform",d:"欄位對映與主檔 Key 統一",tm:"06:31",st:"完成"},
    {t:"載入 Load",d:"寫入資料倉儲維度表",tm:"06:48",st:"進行中"},
    {t:"驗證 Validate",d:"筆數核對與品質規則檢核",tm:"—",st:"待處理"}
  ];
  var tl="";
  etl.forEach(function(e){
    var cl=e.st==="完成"?"p-ok":(e.st==="進行中"?"p-neu":"p-warn");
    tl+='<li><div class="t">'+e.t+' <span class="pill '+cl+'">'+e.st+'</span></div><div class="d">'+e.d+'</div><div class="tm">'+e.tm+'</div></li>';
  });
  return '<div class="screen-head"><span class="tag"><span class="msi">account_tree</span>模組一</span>'+
    '<h1>資料源整合 · ETL 管線</h1><p>接取 ERP / MES / CRM / 財務等來源，完成清洗對齊，建立可信單一資料底層。</p></div>'+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("hub","接入來源系統","5","個 · 全連線",'<span class="up">+1 本季</span>')+
      kpi("sync","今日同步筆數","2.55M","筆",'<span class="up">▲ 4.2%</span>')+
      kpi("timer","平均延遲","3.4","分鐘",'<span class="up">▼ 1.1 分</span>')+
      kpi("verified","資料品質分","96.2","分/100",'<span class="up">▲ 2.0</span>')+
    '</div>'+
    '<div class="grid g-32">'+
      '<div class="panel"><h3><span class="msi">lan</span>資料源接取狀態</h3>'+rows+'</div>'+
      '<div class="panel"><h3><span class="msi">conveyor_belt</span>今日 ETL 排程</h3><ul class="tl">'+tl+'</ul></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:16px">'+
      '<div class="panel"><h3><span class="msi">monitoring</span>近 7 日資料量趨勢（萬筆）</h3><div class="chart-wrap" style="height:230px"><canvas id="c0a"></canvas></div></div>'+
      '<div class="panel"><h3><span class="msi">rule</span>資料品質檢核分佈</h3><div class="chart-wrap" style="height:230px"><canvas id="c0b"></canvas></div></div>'+
    '</div>';
}
function s0charts(){
  mkChart("c0a",{type:"line",
    data:{labels:["7/08","7/09","7/10","7/11","7/12","7/13","7/14"],
      datasets:[
        {label:"ERP",data:[118,121,120,125,124,128,128],borderColor:C.a,backgroundColor:"rgba(147,51,234,.10)",fill:true,tension:.35},
        {label:"MES",data:[80,82,79,83,84,85,84],borderColor:C.a2,backgroundColor:"rgba(192,132,252,.08)",fill:true,tension:.35},
        {label:"CRM",data:[29,30,31,30,32,31,32],borderColor:"#6d28d9",backgroundColor:"rgba(109,40,217,.06)",fill:true,tension:.35}
      ]},
    options:{plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:false,grid:{color:C.line}},x:{grid:{display:false}}}}});
  mkChart("c0b",{type:"doughnut",
    data:{labels:["通過","警示","失敗"],datasets:[{data:[912,64,11],backgroundColor:[C.a,C.a2,"#f0abfc"],borderWidth:2,borderColor:"#fff"}]},
    options:{cutout:"62%",plugins:{legend:{position:"bottom"}}}});
}

/* ---------- screen 1: 經營儀表板 ---------- */
function s1(){
  var sc=[
    {nm:"營收達成率",v:92,tgt:"目標 100%",st:"warn"},
    {nm:"毛利率",v:100,tgt:"目標 28%（現 29.4%）",st:"ok"},
    {nm:"現金週轉天數",v:78,tgt:"目標 ≤ 45 天（現 52 天）",st:"warn"},
    {nm:"訂單準交率",v:96,tgt:"目標 95%",st:"ok"},
    {nm:"客訴率",v:60,tgt:"目標 ≤ 0.8%（現 1.3%）",st:"bad"}
  ];
  var scr="";
  sc.forEach(function(s){
    var col=s.st==="ok"?C.ok:(s.st==="warn"?C.warn:C.bad);
    scr+='<div class="sc"><span class="dot" style="background:'+col+'"></span><div class="nm">'+s.nm+'<div class="mini">'+s.tgt+'</div></div>'+
      '<div class="bar" style="width:120px;flex-shrink:0"><i style="width:'+s.v+'%;background:'+col+'"></i></div><b style="width:44px;text-align:right">'+s.v+'%</b></div>';
  });
  return '<div class="screen-head"><span class="tag"><span class="msi">dashboard</span>模組二</span>'+
    '<h1>經營儀表板 · 總經理視圖</h1><p>關鍵指標即時彙整，一眼掌握本月營運全貌與策略計分卡。</p></div>'+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("payments","本月營收","4.82","億",'<span class="up">▲ 6.8% MoM</span>')+
      kpi("trending_up","毛利率","29.4","%",'<span class="up">▲ 1.2pt</span>')+
      kpi("shopping_cart","在手訂單","9.1","億",'<span class="flat">— 持平</span>')+
      kpi("warning","逾期應收","3,240","萬",'<span class="down">▲ 8.5%</span>')+
    '</div>'+
    '<div class="grid g-32">'+
      '<div class="panel"><h3><span class="msi">bar_chart</span>各廠區月營收 vs 目標（百萬）</h3><div class="chart-wrap" style="height:270px"><canvas id="c1a"></canvas></div></div>'+
      '<div class="panel"><h3><span class="msi">scoreboard</span>策略計分卡</h3>'+scr+'</div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:16px">'+
      '<div class="panel"><h3><span class="msi">donut_small</span>營收產品線佔比</h3><div class="chart-wrap" style="height:240px"><canvas id="c1b"></canvas></div></div>'+
      '<div class="panel"><h3><span class="msi">show_chart</span>近 6 個月營收與毛利趨勢</h3><div class="chart-wrap" style="height:240px"><canvas id="c1c"></canvas></div></div>'+
    '</div>';
}
function s1charts(){
  mkChart("c1a",{type:"bar",
    data:{labels:["台中廠","台南廠","昆山廠","越南廠"],
      datasets:[
        {label:"實際",data:[168,132,118,64],backgroundColor:C.a,borderRadius:6},
        {label:"目標",data:[175,140,130,70],backgroundColor:"#e9d5ff",borderRadius:6}
      ]},
    options:{plugins:{legend:{position:"bottom"}},scales:{y:{grid:{color:C.line},beginAtZero:true},x:{grid:{display:false}}}}});
  mkChart("c1b",{type:"doughnut",
    data:{labels:["精密機件","電子模組","車用零組","醫療器材","其他"],
      datasets:[{data:[38,26,19,11,6],backgroundColor:[C.a,C.a2,"#7c3aed","#c4b5fd","#e9d5ff"],borderWidth:2,borderColor:"#fff"}]},
    options:{cutout:"58%",plugins:{legend:{position:"right"}}}});
  mkChart("c1c",{type:"line",
    data:{labels:["3月","4月","5月","6月","7月","8月"],
      datasets:[
        {label:"營收（億）",yAxisID:"y",data:[4.1,4.3,4.2,4.5,4.6,4.82],borderColor:C.a,backgroundColor:"rgba(147,51,234,.10)",fill:true,tension:.35},
        {label:"毛利率（%）",yAxisID:"y1",data:[27.1,27.6,28.0,28.4,28.9,29.4],borderColor:C.warn,backgroundColor:"transparent",tension:.35}
      ]},
    options:{plugins:{legend:{position:"bottom"}},scales:{
      y:{position:"left",grid:{color:C.line}},
      y1:{position:"right",grid:{display:false},min:25,max:32},
      x:{grid:{display:false}}}}});
}

/* ---------- screen 2: 趨勢與下鑽 ---------- */
function s2(){
  var rows=[
    {r:"精密機件 / 台中廠",rev:"168.2",gm:"31.2%",yoy:"+9.4%",st:"ok"},
    {r:"精密機件 / 台南廠",rev:"96.4",gm:"28.8%",yoy:"+4.1%",st:"ok"},
    {r:"電子模組 / 昆山廠",rev:"118.0",gm:"22.6%",yoy:"-3.2%",st:"bad"},

(function(){
  var nav=document.getElementById("nav");
  var htmlN="";
  MODULES.forEach(function(m,i){
    htmlN+='<button data-i="'+i+'"><span class="msi">'+m.i+'</span><span class="lbl">'+m.n+'</span></button>';
  });
  nav.innerHTML=htmlN;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      location.hash="go="+this.getAttribute("data-i");
    });
  }
})();

function show(i){
  var app=document.getElementById("app");
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].className=(+btns[j].getAttribute("data-i")===i)?"active":"";
  }
  app.innerHTML=SCREENS[i].r();
  void app.offsetHeight;
  if(SCREENS[i].c)SCREENS[i].c();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
