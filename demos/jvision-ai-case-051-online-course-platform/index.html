<style>
:root{--accent:#7c3aed;--accent2:#a78bfa;--ink:#1c1330;--bg:#f5f3fc;--card:#fff;--line:#e7e0f7;--soft:#f2eefc;--mut:#6b5f86;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* top nav */
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(124,58,237,.34)}
.logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";line-height:1.2}
.brand span{font-size:9.5px;color:var(--accent);letter-spacing:1.6px;font-weight:800}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav button .badge{font-size:10px;font-weight:800;background:#ede9fe;color:#6d28d9;border-radius:999px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
.who{display:flex;align-items:center;gap:9px;padding-left:6px;border-left:1px solid var(--line);flex:none}
.who .av{width:34px;height:34px;border-radius:50%;background:#ede9fe;color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px}
.who small{color:var(--mut);font-size:11px;display:block}
.who b{font-size:12.5px}
/* main */
.wrap{max-width:1300px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);padding:6px 13px;border-radius:999px;font-size:12px;font-weight:800}
.pill .material-symbols-outlined{font-size:16px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.6s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.26;font-size:30px}
.up{color:var(--ok)}.dn{color:var(--bad)}

.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.5fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#ede9fe;color:#6d28d9}.t-mut{background:#eef2f6;color:#64748b}.t-vio{background:#f2eefc;color:#7c3aed}

table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft);text-transform:uppercase;letter-spacing:.03em}
table.data tr:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.chart{width:100%;min-height:60px}
.bar{height:8px;background:#ece5fb;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.cc{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.cc .thumb{height:98px;border:2px dashed #cdbdf3;border-radius:12px;margin:12px 12px 0;display:grid;place-items:center;color:var(--accent);background:repeating-linear-gradient(45deg,#faf8ff,#faf8ff 9px,#f2eefc 9px,#f2eefc 18px);position:relative}
.cc .thumb .material-symbols-outlined{font-size:34px;opacity:.55}

.pr .nm{width:118px;flex:none;min-width:0}

.pr .nm small{font-size:10.5px;color:var(--mut)}
.pr .pb{flex:1;min-width:0}
.pr .pv{width:48px;text-align:right;flex:none;font-family:Inter;font-weight:800;color:var(--accent);font-size:13px}

.pr.risk .pb .bar i{background:linear-gradient(90deg,#dc2626,#f87171)}
.pr.risk .pv{color:var(--bad)}

.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.sc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}

.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}

.rows{display:flex;flex-direction:column;gap:10px}
.rw{border:1px solid var(--line);border-radius:13px;padding:11px 13px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--accent)}

.rw .bx.w{background:var(--warn)}.rw .bx.b{background:var(--bad)}.rw .bx.o{background:var(--ok)}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--mut)}
.fld.full{grid-column:1/-1}
.fld input,.fld select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
.fld input:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e9e2fb}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}

.chap{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12.5px}
.ch .no{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:900;display:grid;place-items:center;flex:none;font-family:Inter;font-size:12px}
.ch .ci{flex:1;min-width:0}.ch .ci b{font-family:"Noto Sans TC"}.ch .ci small{display:block;color:var(--mut);font-size:11px}
.ch .st{flex:none;font-size:11px;font-weight:800}
.ch .st .material-symbols-outlined{font-size:19px}
.ok-i{color:var(--ok)}.pl-i{color:var(--accent)}.mut-i{color:#c3b8dd}
/* quiz cards */
.qz{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qz>*{min-width:0}
.qc{border:1px solid var(--line);border-radius:13px;padding:13px 15px;border-top:4px solid var(--accent)}
.qc.b{border-top-color:var(--bad)}.qc.w{border-top-color:var(--warn)}.qc.o{border-top-color:var(--ok)}
.qc .qt{font-family:"Noto Sans TC";font-weight:800;font-size:13.5px;margin-bottom:4px}
.qc .qm{font-size:11.5px;color:var(--mut);margin-bottom:10px}
.qc .qg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}
.qc .qg>div{background:var(--soft);border-radius:9px;padding:7px 4px}
.qc .qg span{font-size:10px;color:var(--mut);display:block}
.qc .qg b{font-family:Inter;font-size:15px;color:var(--accent)}
/* certificate */
.cert{border:2px solid var(--accent2);border-radius:15px;padding:18px 20px;background:linear-gradient(155deg,#fff,#f6f2fe);position:relative;overflow:hidden}
.cert::before{content:"workspace_premium";font-family:"Material Symbols Outlined";position:absolute;right:-14px;bottom:-24px;font-size:130px;color:#ede9fe;opacity:.7}
.cert .ct{display:flex;align-items:center;gap:12px;position:relative}
.cert .seal{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none}
.cert .ct b{font-size:16px;font-family:"Noto Sans TC"}
.cert .ct small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.cert .cbody{position:relative;margin-top:14px;font-size:12.5px;line-height:1.9;color:#3a2d52}
.cert .cbody b{color:var(--accent)}
/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fr{display:flex;align-items:center;gap:10px}
.fr .fn{width:82px;font-weight:800;font-size:12px;font-family:"Noto Sans TC";flex:none}
.fr .fb{flex:1;min-width:0;background:#ece5fb;border-radius:8px;overflow:hidden;height:26px;position:relative}
.fr .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px}
.fr .fb span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#fff}
.fr .fv{width:66px;text-align:right;font-weight:800;color:var(--accent);flex:none;font-family:Inter;font-size:12px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21{grid-template-columns:1fr}.courses{grid-template-columns:1fr 1fr}.qz{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.who{display:none}.kpis{grid-template-columns:1fr 1fr}.courses{grid-template-columns:1fr}.pr .nm{width:96px}}
</style>
</head>

function show(i){
 nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
 view.innerHTML=SCREENS[i]();
 draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
