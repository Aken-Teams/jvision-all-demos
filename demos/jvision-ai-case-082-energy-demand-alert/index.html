<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企業用電尖峰預警台｜Jvision 系統 Demo</title>
  <meta name="description" content="15 分鐘需量週期即時監控、逼近契約容量分級告警、負載卸載派工與電費碳盤查" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#059669;
      --color-on-primary:#000000;
      --color-secondary:#10b981;
      --color-on-secondary:#0f172a;
      --color-accent:#059669;
      --color-on-accent:#000000;
      --color-background:#ecfdf5;
      --color-foreground:#064e3b;
      --color-card:#ffffff;
      --color-card-foreground:#064e3b;
      --color-muted:#e8f1f3;
      --color-muted-foreground:#475569;
      --color-border:#a7f3d0;
      --color-destructive:#dc2626;
      --color-on-destructive:#ffffff;
      --color-ring:#059669;
      --blue:#059669;
      --ink:#064e3b;
      --muted:#475569;
      --line:#a7f3d0;
      --accent:#059669;
      --accent2:#10b981;
      --accent-dk:#047857;
      --bg:#ecfdf5;
      --panel:#ffffff;
      --soft:#f2faf7;
      --warn:#b45309;
      --alert:#c2410c;
      --danger:#dc2626;
      --ok:#047857;
      --info:#1d4ed8;
      --radius:20px;
      --radius-sm:14px;
      --shadow:0 14px 35px rgba(6,78,59,.09),0 2px 8px rgba(6,78,59,.05);
      --shadow-hover:0 18px 44px rgba(6,78,59,.14),0 4px 12px rgba(6,78,59,.07);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 2%,rgba(16,185,129,.18),transparent 28rem),
        radial-gradient(circle at 95% 20%,rgba(251,191,36,.12),transparent 24rem),
        linear-gradient(145deg,#f7fffb 0%,var(--color-background) 45%,#e5f8ef 100%);
      font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    body::before,body::after{
      content:"";
      position:fixed;
      z-index:-1;
      pointer-events:none;
      filter:blur(1px);
    }
    body::before{
      width:360px;height:360px;right:-190px;top:32%;
      border:1px solid rgba(5,150,105,.14);
      border-radius:37% 63% 55% 45%/45% 35% 65% 55%;
      transform:rotate(18deg);
    }
    body::after{
      width:280px;height:190px;left:-145px;bottom:5%;
      background:rgba(16,185,129,.07);
      border-radius:64% 36% 72% 28%/47% 65% 35% 53%;
    }
    button{font:inherit}
    button,.litem{cursor:pointer}
    button:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      display:inline-block;
      direction:ltr;
      font-family:"Material Symbols Outlined";
      font-size:22px;
      font-style:normal;
      font-weight:400;
      letter-spacing:normal;
      line-height:1;
      text-transform:none;
      vertical-align:middle;
      white-space:nowrap;
      word-wrap:normal;
    }
    .wrap{width:min(100% - 32px,1400px);margin:0 auto;padding:20px 0 64px}
    .topbar{
      position:relative;
      isolation:isolate;
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
      overflow:hidden;
      padding:18px 22px;
      color:#fff;
      background:
        linear-gradient(115deg,rgba(4,120,87,.98),rgba(5,150,105,.96) 55%,rgba(16,185,129,.9)),
        var(--accent);
      border:1px solid rgba(255,255,255,.22);
      border-radius:28px 18px 30px 20px;
      box-shadow:0 20px 45px rgba(4,120,87,.23);
    }
    .topbar::before{
      content:"";
      position:absolute;
      z-index:-1;
      width:330px;height:200px;
      right:-70px;top:-115px;
      background:rgba(255,255,255,.12);
      border-radius:42% 58% 32% 68%/52% 39% 61% 48%;
      transform:rotate(-9deg);
    }
    .topbar::after{
      content:"";
      position:absolute;
      z-index:-1;
      width:190px;height:110px;
      right:230px;bottom:-75px;
      border:1px solid rgba(255,255,255,.2);
      border-radius:65% 35% 53% 47%/43% 62% 38% 57%;
    }
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .brand .logo{
      width:48px;height:48px;
      display:grid;
      place-items:center;
      flex:none;
      color:#043f30;
      background:#d1fae5;
      border:1px solid rgba(255,255,255,.7);
      border-radius:16px 12px 18px 13px;
      box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(4,78,59,.17);
    }
    .brand .logo .material-symbols-outlined{font-size:27px}
    .brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
    .brand p{
      max-width:680px;
      margin:2px 0 0;
      overflow:hidden;
      font-size:12px;
      opacity:.9;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .topbar .spacer{flex:1;min-width:8px}
    .pill{
      display:flex;
      align-items:center;
      gap:7px;
      flex:none;
      padding:7px 12px;
      font-size:12px;
      font-weight:600;
      color:#fff;
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.23);
      border-radius:999px;
      backdrop-filter:blur(8px);
      white-space:nowrap;
    }
    .pill .dot{
      width:8px;height:8px;
      flex:none;
      background:#d1fae5;
      border:2px solid #fff;
      border-radius:50%;
      box-shadow:0 0 0 4px rgba(209,250,229,.18);
      animation:pulse 1.8s ease-out infinite;
    }
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 3px rgba(209,250,229,.18)}
      50%{box-shadow:0 0 0 8px rgba(209,250,229,0)}
    }
    nav{
      position:sticky;
      z-index:10;
      top:8px;
      display:flex;
      gap:8px;
      margin:16px 0 20px;
      padding:7px;
      overflow-x:auto;
      scrollbar-width:thin;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(167,243,208,.9);
      border-radius:18px 24px 16px 22px;
      box-shadow:0 8px 24px rgba(6,78,59,.08);
      backdrop-filter:blur(14px);
    }
    nav button{
      display:flex;
      align-items:center;
      gap:8px;
      flex:none;
      min-height:44px;
      padding:9px 13px;
      color:var(--muted);
      background:transparent;
      border:1px solid transparent;
      border-radius:13px 16px 12px 15px;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,transform .2s;
    }
    nav button:hover{
      color:var(--accent-dk);
      background:#ecfdf5;
      border-color:var(--line);
      transform:translateY(-1px);
    }
    nav button.on{
      color:#fff;
      background:linear-gradient(130deg,var(--accent-dk),var(--accent));
      border-color:var(--accent-dk);
      box-shadow:0 7px 17px rgba(5,150,105,.24);
    }
    nav button .material-symbols-outlined{font-size:19px}
    nav button .idx{
      display:grid;
      width:20px;height:20px;
      place-items:center;
      color:inherit;
      background:rgba(71,85,105,.08);
      border-radius:7px;
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
    }
    nav button.on .idx{background:rgba(255,255,255,.18)}
    .screen{animation:screen-in .42s cubic-bezier(.22,1,.36,1)}
    @keyframes screen-in{
      from{opacity:0;transform:translateY(12px) scale(.992)}
      to{opacity:1;transform:none}
    }
    .scr-head{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      margin-bottom:15px;
    }
    .scr-head .ico{
      display:grid;
      width:43px;height:43px;
      place-items:center;
      flex:none;
      color:var(--accent-dk);
      background:linear-gradient(145deg,#fff,#dff9ec);
      border:1px solid var(--line);
      border-radius:14px 20px 14px 17px;
      box-shadow:0 7px 18px rgba(5,150,105,.1);
    }
    .scr-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em}
    .scr-head p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
    .card,.kpi{
      min-width:0;
      color:var(--color-card-foreground);
      background:rgba(255,255,255,.94);
      border:1px solid rgba(167,243,208,.9);
      box-shadow:var(--shadow);
    }
    .card{border-radius:22px 16px 24px 18px}
    .card.pad{padding:17px}
    .card-title{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 13px;
      font-size:14px;
      font-weight:700;
    }
    .card-title .material-symbols-outlined{font-size:20px;color:var(--accent)}
    .muted{color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .kpi{
      position:relative;
      overflow:hidden;
      padding:15px;
      border-radius:18px 23px 17px 21px;
      transition:transform .22s,box-shadow .22s,border-color .22s;
    }
    .kpi::after{
      content:"";
      position:absolute;
      width:70px;height:70px;
      right:-30px;bottom:-36px;
      background:rgba(16,185,129,.07);
      border-radius:64% 36% 54% 46%/43% 62% 38% 57%;
    }
    .kpi:hover{transform:translateY(-3px);border-color:#6ee7b7;box-shadow:var(--shadow-hover)}
    .kpi .lbl{
      display:flex;
      align-items:center;
      gap:6px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }
    .kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent-dk)}
    .kpi .val{
      margin-top:5px;
      color:var(--ink);
      font-family:"Fira Code",monospace;
      font-size:25px;
      font-variant-numeric:tabular-nums;
      font-weight:700;
      letter-spacing:-.05em;
      line-height:1.25;
    }
    .kpi .val small{
      margin-left:4px;
      color:var(--muted);
      font-family:"Fira Sans",sans-serif;
      font-size:12px;
      font-weight:600;
      letter-spacing:0;
    }
    .kpi .sub{margin-top:4px;font-size:11.5px;font-weight:600}
    .up{color:#b91c1c}.down{color:#047857}
    .split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px;align-items:start}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .listpane{max-height:568px;overflow-y:auto}
    .litem{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      margin-bottom:8px;
      padding:11px 12px;
      background:#f4faf7;
      border:1px solid transparent;
      border-radius:15px 12px 17px 13px;
      transition:background-color .2s,border-color .2s,transform .2s;
    }
    .litem:hover{background:#ecfdf5;border-color:var(--line);transform:translateX(2px)}
    .litem.sel{background:#e4f9ed;border-color:#6ee7b7;box-shadow:0 6px 16px rgba(5,150,105,.1)}
    .litem .nm{overflow:hidden;font-size:13px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .litem .mt{margin-top:2px;color:var(--muted);font-size:11px}
    .litem .rt{flex:none;margin-left:auto;text-align:right}
    .litem .rt b{font-family:"Fira Code",monospace;font-size:14px;font-variant-numeric:tabular-nums}
    .bar{height:7px;margin-top:6px;overflow:hidden;background:#dcebe4;border-radius:999px}
    .bar>i{display:block;height:100%;border-radius:999px}
    .chartbox{position:relative;height:260px;min-width:0}
    .chartbox.sm{height:210px}
    table{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:12.5px}
    thead th{
      padding:10px;
      color:#334155;
      background:#edf8f3;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      font-size:11px;
      font-weight:700;
      letter-spacing:.03em;
      text-align:left;
      white-space:nowrap;
    }
    thead th:first-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px}
    thead th:last-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0}
    tbody td{padding:10px;border-bottom:1px solid #e4efe9;white-space:nowrap}
    tbody tr{transition:background-color .18s}
    tbody tr:hover{background:#f0faf5}
    th:nth-child(n+3),td:nth-child(n+3){text-align:right}
    .num{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
      font-weight:600;
      text-align:right;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 9px;
      border:1px solid transparent;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      line-height:1.3;
      white-space:nowrap;
    }
    .tag .material-symbols-outlined{font-size:14px}
    .t-ok{color:#065f46;background:#dff7e9;border-color:#a7e8c8}
    .t-warn{color:#854d0e;background:#fff4ce;border-color:#f3d277}
    .t-alert{color:#9a3412;background:#ffeadc;border-color:#fdba8c}
    .t-danger{color:#991b1b;background:#fee2e2;border-color:#fca5a5}
    .t-info{color:#1e40af;background:#e6efff;border-color:#b8cdfb}
    .t-gray{color:#475569;background:#eef2f3;border-color:#d7e0e3}
    .gauge{display:flex;flex-direction:column;align-items:center;gap:9px}
    .gring{position:relative;width:170px;height:170px}
    .gring .big{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
    .gring .big b{
      font-family:"Fira Code",monospace;
      font-size:32px;
      font-variant-numeric:tabular-nums;
      font-weight:700;
      letter-spacing:-.06em;
      line-height:1;
    }
    .gring .big span{color:var(--muted);font-size:11px;font-weight:600}
    .alert-row{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width:0;
      margin-bottom:9px;
      padding:12px;
      background:#f5faf8;
      border:1px solid #e0eee7;
      border-left:5px solid var(--line);
      border-radius:8px 16px 16px 8px;
    }
    .alert-row .ai{
      display:grid;
      width:34px;height:34px;
      place-items:center;
      flex:none;
      color:#fff;
      border-radius:10px 14px 9px 12px;
    }
    .alert-row .body{flex:1;min-width:0}
    .alert-row .body h4{margin:0;font-size:13px;font-weight:700}
    .alert-row .body p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
    .alert-row .tm{
      flex:none;
      color:var(--muted);
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-variant-numeric:tabular-nums;
      font-weight:600;
    }
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .col{min-width:0;padding:12px;background:#f0f8f4;border:1px solid var(--line);border-radius:17px 13px 19px 15px}
    .col h4{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:12.5px;font-weight:700}
    .col h4 .cnt{
      margin-left:auto;
      padding:1px 8px;
      color:var(--muted);
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      font-family:"Fira Code",monospace;
      font-size:10px;
    }
    .dcard{min-width:0;margin-bottom:9px;padding:11px;background:#fff;border:1px solid #d7ebe1;border-radius:12px 17px 13px 15px;box-shadow:0 4px 10px rgba(6,78,59,.04)}
    .dcard .dt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}
    .dcard .dm{margin-top:4px;color:var(--muted);font-size:11px}
    .dcard .dm b{color:var(--ink);font-family:"Fira Code",monospace}
    .prio{width:9px;height:9px;flex:none;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px currentColor}
    .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:11.5px;font-weight:600}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .sw{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-radius:4px;box-shadow:0 0 0 1px #94a3b8}
    .stripwrap{display:flex;flex-direction:column;gap:9px}
    .strip{display:flex;align-items:center;gap:10px;min-width:0}
    .strip .h{
      width:52px;
      flex:none;
      color:var(--muted);
      font-family:"Fira Code",monospace;
      font-size:11.5px;
      font-variant-numeric:tabular-nums;
      font-weight:600;
    }
    .strip .track{position:relative;flex:1;height:22px;min-width:0;overflow:hidden;background:#e6f0eb;border-radius:8px 12px 9px 11px}
    .strip .track>i{display:block;height:100%;background:linear-gradient(90deg,#34d399,var(--accent));border-radius:inherit}
    .strip .track.warn>i{background:repeating-linear-gradient(135deg,#d97706 0 8px,#f59e0b 8px 16px)}
    .strip .track.danger>i{background:repeating-linear-gradient(135deg,#b91c1c 0 8px,#ef4444 8px 16px)}
    .strip .v{
      width:64px;
      flex:none;
      font-family:"Fira Code",monospace;
      font-size:12px;
      font-variant-numeric:tabular-nums;
      font-weight:700;
      text-align:right;
    }
    hr.sep{margin:14px 0;border:0;border-top:1px dashed var(--line)}
    .inline-note{
      display:flex;
      align-items:flex-start;
      gap:8px;
      padding:10px 12px;
      color:#334155;
      background:#edf8f3;
      border:1px solid var(--line);
      border-radius:12px 17px 12px 15px;
      font-size:11.5px;
    }
    .inline-note .material-symbols-outlined{flex:none;color:var(--accent-dk);font-size:18px}
    .mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mt14{margin-top:14px}
    .flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
    @media(max-width:980px){
      .topbar{flex-wrap:wrap}
      .topbar .spacer{display:none}
      .pill{margin-left:61px}
      .pill+.pill{margin-left:0}
      .split{grid-template-columns:310px minmax(0,1fr)}
    }
    @media(max-width:860px){
      .split{grid-template-columns:1fr}
      .listpane{max-height:none}
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .grid2,.grid3{grid-template-columns:1fr}
    }
    @media(max-width:700px){
      .board{grid-template-columns:1fr}
      .pill{margin-left:0}
    }
    @media(max-width:560px){
      .wrap{width:min(100% - 20px,1400px);padding-top:10px}
      .topbar{padding:15px;border-radius:20px 14px 23px 16px}
      .brand{width:100%}
      .brand .logo{width:42px;height:42px}
      .brand h1{font-size:17px}
      .brand p{display:none}
      .pill{padding:6px 9px;font-size:10.5px}
      nav{top:4px;margin:10px 0 17px}
      nav button{padding:9px 11px}
      nav button .txt{display:none}
      .kpis{gap:9px}
      .kpi{padding:12px}
      .kpi .val{font-size:20px}
      .kpi .lbl{font-size:11px}
      .card.pad{padding:13px}
      .scr-head h2{font-size:17px}
      .scr-head p{font-size:11.5px}
      .chartbox{height:235px}
      .chartbox.sm{height:195px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
      }
      .pill .dot{animation:none}
      .screen{animation:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">energy_savings_leaf</span></div>
        <div style="min-width:0">
          <h1>企業用電尖峰預警台</h1>
          <p>15 分鐘需量週期即時監控 · 逼近契約容量分級告警 · 削峰派工</p>
        </div>

      {h:"13:30",v:3010,mx:3600,cls:"",state:"正常"},
      {h:"14:00",v:3240,mx:3600,cls:"warn",state:"注意"},
      {h:"14:30",v:3480,mx:3600,cls:"danger",state:"高風險"},
      {h:"15:00",v:3390,mx:3600,cls:"warn",state:"注意"},
      {h:"15:30",v:3120,mx:3600,cls:"",state:"正常"},
      {h:"16:00",v:2940,mx:3600,cls:"",state:"正常"}
    ];
    var kpi=[
      {l:"預測今日峰值",v:n(3480),u:"kW",i:"trending_up",s:"14:30 週期"},
      {l:"超約機率",v:72,u:"%",i:"percent",s:"高於契約 280 kW"},
      {l:"模型準確度",v:"94.2",u:"%",i:"target",s:"近 30 日 MAPE 5.8%"},
      {l:"建議提前削峰",v:35,u:"分",i:"schedule_send",s:"14:00 前介入"}
    ];
    var h=scrHead(MODULES[4])+'<div class="kpis mb14">';
    kpi.forEach(function(k){h+='<div class="kpi"><div class="lbl"><span class="material-symbols-outlined" aria-hidden="true">'+k.i+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="sub muted">'+esc(k.s)+'</div></div>';});
    h+='</div><div class="grid2 mb14"><div class="card pad"><div class="card-title"><span class="material-symbols-outlined" aria-hidden="true">query_stats</span>當日需量預測曲線（含信賴區間）</div><div class="chartbox"><canvas id="c4l" aria-label="當日需量預測曲線"></canvas></div></div>';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined" aria-hidden="true">leaderboard</span>各時段預測需量</div><div class="stripwrap">';
    strips.forEach(function(s){var w=Math.round(s.v/s.mx*100);h+='<div class="strip" aria-label="'+s.h+' 預測 '+n(s.v)+' kW，'+s.state+'"><span class="h">'+esc(s.h)+'</span><span class="track '+s.cls+'"><i style="width:'+w+'%"></i></span><span class="v">'+n(s.v)+'</span></div>';});
    h+='</div><div class="inline-note mt14"><span class="material-symbols-outlined" aria-hidden="true">warning</span>高風險：14:30 預測突破契約容量，建議 14:00 前啟動負載卸載排程。</div></div></div>';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined" aria-hidden="true">psychology</span>預測影響因子權重</div><div class="chartbox sm"><canvas id="c4r" aria-label="預測影響因子權重雷達圖"></canvas></div></div>';
    return {html:h,init:function(){
      var lbl=["12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00"];
      var pred=[2600,2760,2870,3010,3240,3480,3390,3120,2940];
      var up=pred.map(function(v){return v+140;}),lo=pred.map(function(v){return v-140;});
      charts.push(new Chart(document.getElementById("c4l"),{type:"line",data:{labels:lbl,datasets:[
        {label:"上界",data:up,borderColor:"transparent",backgroundColor:"rgba(16,185,129,.20)",fill:"+1",pointRadius:0},
        {label:"下界",data:lo,borderColor:"transparent",backgroundColor:"transparent",fill:false,pointRadius:0},
        {label:"預測需量",data:pred,borderColor:C.accent,borderWidth:2.5,tension:.35,pointRadius:0,fill:false},
        {label:"契約容量",data:lbl.map(function(){return CONTRACT;}),borderColor:C.danger,borderDash:[6,5],pointRadius:0,borderWidth:1.5,fill:false}
      ]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:false,grid:{color:"#e4efe9"},ticks:{callback:function(v){return n(v);}}},x:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));
      charts.push(new Chart(document.getElementById("c4r"),{type:"radar",data:{labels:["歷史負載","生產排程","外氣溫度","時間電價","設備起停","週末效應"],datasets:[{label:"權重",data:[92,84,71,66,58,44],borderColor:C.accent,backgroundColor:"rgba(5,150,105,.18)",borderWidth:2,pointBackgroundColor:C.accent}]},options:{plugins:{legend:{display:false}},scales:{r:{beginAtZero:true,max:100,grid:{color:"#dcebe4"},angleLines:{color:"#dcebe4"},pointLabels:{font:{size:11}},ticks:{display:false}}},responsive:true,maintainAspectRatio:false}}));
    }};
  }

  function s5(){
    var rows=[
      {item:"基本電費（契約容量）",kwh:"—",amt:745600,co2:0,cat:"固定"},
      {item:"尖峰時段流動電費",kwh:"186,400",amt:1231000,co2:92.4,cat:"尖峰"},
      {item:"半尖峰流動電費",kwh:"241,800",amt:892300,co2:119.9,cat:"半尖峰"},
      {item:"離峰流動電費",kwh:"318,200",amt:604500,co2:157.8,cat:"離峰"},
      {item:"超約附加費",kwh:"—",amt:186000,co2:0,cat:"罰款"},
      {item:"功率因數調整",kwh:"—",amt:-42800,co2:0,cat:"折扣"}
    ];
    function tagCat(c){var m={"尖峰":"t-danger","半尖峰":"t-warn","離峰":"t-info","固定":"t-gray","罰款":"t-alert","折扣":"t-ok"};return '<span class="tag '+(m[c]||"t-gray")+'">'+esc(c)+'</span>';}
    var total=0,co2t=0;
    rows.forEach(function(r){total+=r.amt;co2t+=r.co2;});
    var kpi=[
      {l:"本月電費合計",v:(total/10000).toFixed(1),u:"萬",i:"receipt_long",s:"含超約附加費"},
      {l:"總用電量",v:"746.4",u:"MWh",i:"bolt",s:"三時段合計"},
      {l:"範疇二碳排",v:co2t.toFixed(1),u:"tCO₂e",i:"co2",s:"電力係數 0.474"},
      {l:"平均電價",v:"3.32",u:"元/度",i:"payments",s:"含尖離峰加權"}
    ];
    var h=scrHead(MODULES[5])+'<div class="kpis mb14">';
    kpi.forEach(function(k){h+='<div class="kpi"><div class="lbl"><span class="material-symbols-outlined" aria-hidden="true">'+k.i+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="sub muted">'+esc(k.s)+'</div></div>';});
    h+='</div><div class="grid2 mb14"><div class="card pad"><div class="card-title"><span class="material-symbols-outlined" aria-hidden="true">pie_chart</span>電費結構占比</div><div class="chartbox sm"><canvas id="c5p" aria-label="電費結構占比圖"></canvas></div></div>';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined" aria-hidden="true">co2</span>各時段用電碳排（tCO₂e）</div><div class="chartbox sm"><canvas id="c5b" aria-label="各時段用電碳排圖"></canvas></div></div></div>';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined" aria-hidden="true">table_chart</span>本月電費與碳盤查明細</div><div style="overflow-x:auto"><table><thead><tr><th>費用項目</th><th>類別</th><th>用電量(度)</th><th>金額(NT$)</th><th>碳排(tCO₂e)</th></tr></thead><tbody>';
    rows.forEach(function(r){h+='<tr><td><b>'+esc(r.item)+'</b></td><td>'+tagCat(r.cat)+'</td><td class="num">'+esc(r.kwh)+'</td><td class="num'+(r.amt<0?' down':'')+'">'+n(r.amt)+'</td><td class="num">'+(r.co2?r.co2.toFixed(1):"—")+'</td></tr>';});
    h+='<tr style="background:var(--soft)"><td><b>合計</b></td><td></td><td></td><td class="num" style="font-size:14px">'+n(total)+'</td><td class="num" style="font-size:14px">'+co2t.toFixed(1)+'</td></tr></tbody></table></div></div>';
    return {html:h,init:function(){
      charts.push(new Chart(document.getElementById("c5p"),{type:"doughnut",data:{labels:["基本電費","尖峰","半尖峰","離峰","超約"],datasets:[{data:[745600,1231000,892300,604500,186000],backgroundColor:["#7ba990",C.danger,C.warn,"#1d4ed8",C.alert],borderWidth:0}]},options:{cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},responsive:true,maintainAspectRatio:false}}));
      charts.push(new Chart(document.getElementById("c5b"),{type:"bar",data:{labels:["尖峰","半尖峰","離峰"],datasets:[{label:"碳排 tCO₂e",data:[92.4,119.9,157.8],backgroundColor:[C.danger,C.warn,"#1d4ed8"],borderRadius:8,maxBarThickness:56}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:"#e4efe9"}},y:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));
    }};
  }

  var SCREENS=[s0,s1,s2,s3,s4,s5];
  var nav=document.getElementById("nav"),navHtml="";
  for(var i=0;i<MODULES.length;i++){
    navHtml+='<button type="button" data-i="'+i+'" aria-label="'+esc(MODULES[i].name)+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODULES[i].icon+'</span><span class="txt">'+esc(MODULES[i].name)+'</span><span class="idx">'+i+'</span></button>';
  }
  nav.innerHTML=navHtml;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");
    if(!b)return;
    var i=+b.getAttribute("data-i");
    var next="#v"+i;
    if(location.hash===next){show(i);}else{location.hash=next;}
  });

  var app=document.getElementById("app");
  function show(i){
    i=Math.max(0,Math.min(i,SCREENS.length-1));
    killCharts();
    var btns=document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){
      var active=+btns[k].getAttribute("data-i")===i;
      btns[k].classList.toggle("on",active);
      btns[k].setAttribute("aria-current",active?"page":"false");
    }
    var r=SCREENS[i]();
    app.innerHTML='<section class="screen" data-screen="'+i+'">'+r.html+'</section>';
    void app.offsetHeight;
    if(r.init){try{r.init();}catch(e){}}
  }
  window.show=show;
  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    var total=document.querySelectorAll("[data-i]").length||6;
    show(m?Math.min(+m[1],total-1):0);
    try{window.scrollTo(0,0);}catch(e){}
  }
  window.addEventListener("hashchange",fromHash);
  fromHash();
})();
</script>
