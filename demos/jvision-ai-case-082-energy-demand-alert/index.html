<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>能源需量告警塔｜Jvision 系統 Demo</title>
  <meta name="description" content="15 分鐘需量週期即時監控、逼近契約容量分級告警、負載卸載派工與電費碳盤查" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#16a34a; --accent2:#4ade80; --accent-dk:#0f7a35;
      --bg:#eef3ee; --panel:#ffffff; --ink:#122016; --muted:#5b6b60;
      --line:#dbe6dd; --soft:#f4f8f4;
      --warn:#f59e0b; --alert:#f97316; --danger:#ef4444; --ok:#16a34a;
      --radius:16px; --shadow:0 10px 28px rgba(16,90,45,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Noto Sans TC","Inter",system-ui,sans-serif;
      background:radial-gradient(1200px 600px at 15% -10%,#dff0e2 0%,transparent 60%),var(--bg);
      color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
    .wrap{max-width:1320px;margin:0 auto;padding:18px 18px 60px}
    /* top bar */
    .topbar{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--accent-dk),var(--accent) 55%,var(--accent2));color:#fff;border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);min-width:0}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
    .brand .logo .material-symbols-outlined{font-size:26px}
    .brand h1{font-size:19px;margin:0;font-weight:900;letter-spacing:.5px;white-space:nowrap}
    .brand p{margin:2px 0 0;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar .spacer{flex:1;min-width:8px}
    .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;white-space:nowrap}
    .pill .dot{width:8px;height:8px;border-radius:50%;background:#eaffef;box-shadow:0 0 0 0 rgba(234,255,239,.8);animation:pulse 1.8s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(234,255,239,.7)}70%{box-shadow:0 0 0 8px rgba(234,255,239,0)}100%{box-shadow:0 0 0 0 rgba(234,255,239,0)}}
    /* nav */
    nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 18px}
    nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 15px;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(16,90,45,.05)}
    nav button .material-symbols-outlined{font-size:19px}
    nav button:hover{border-color:var(--accent2);color:var(--accent-dk)}
    nav button.on{background:linear-gradient(120deg,var(--accent-dk),var(--accent));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(22,163,74,.3)}
    nav button .idx{font-size:11px;opacity:.7;font-weight:800}
    /* generic */
    .screen{animation:fade .35s ease}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .scr-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-width:0}
    .scr-head .ico{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent-dk);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
    .scr-head h2{margin:0;font-size:18px;font-weight:900}
    .scr-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
    .card.pad{padding:16px}
    .card-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:0 0 12px}
    .card-title .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .muted{color:var(--muted)}
    /* KPI */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
    .kpi .lbl{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
    .kpi .lbl .material-symbols-outlined{font-size:16px;color:var(--accent)}
    .kpi .val{font-size:26px;font-weight:900;margin-top:6px;font-family:"Inter",sans-serif;letter-spacing:-.5px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
    .kpi .sub{font-size:11.5px;margin-top:4px;font-weight:700}
    .up{color:var(--danger)} .down{color:var(--ok)}
    /* split layout */
    .split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
    .listpane{max-height:560px;overflow-y:auto}
    .litem{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:12px;border:1px solid transparent;cursor:default;margin-bottom:8px;background:var(--soft);min-width:0}
    .litem.sel{border-color:var(--accent2);background:#eafff0;box-shadow:0 4px 12px rgba(22,163,74,.12)}
    .litem .nm{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .litem .mt{font-size:11.5px;color:var(--muted);margin-top:2px}
    .litem .rt{margin-left:auto;text-align:right;flex:none}
    .litem .rt b{font-size:15px;font-family:"Inter",sans-serif}
    .bar{height:6px;border-radius:4px;background:#e3ece4;overflow:hidden;margin-top:6px}
    .bar>i{display:block;height:100%;border-radius:4px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    /* chart box */
    .chartbox{position:relative;height:260px;min-width:0}
    .chartbox.sm{height:210px}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
    tbody td{padding:10px;border-bottom:1px solid var(--soft);white-space:nowrap}
    tbody tr:hover{background:var(--soft)}
    .num{font-family:"Inter",sans-serif;font-weight:700}
    /* tags */
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .tag .material-symbols-outlined{font-size:14px}
    .t-ok{background:#e6f6ec;color:#0f7a35}
    .t-warn{background:#fef3d7;color:#a5620a}
    .t-alert{background:#ffe9d6;color:#b4470d}
    .t-danger{background:#fde2e2;color:#b91c1c}
    .t-info{background:#e5eefb;color:#1e5fa8}
    .t-gray{background:#eef2ef;color:#5b6b60}
    /* gauge */
    .gauge{display:flex;flex-direction:column;align-items:center;gap:8px}
    .gring{position:relative;width:170px;height:170px}
    .gring .big{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
    .gring .big b{font-size:34px;font-weight:900;font-family:"Inter",sans-serif;letter-spacing:-1px;line-height:1}
    .gring .big span{font-size:12px;color:var(--muted);font-weight:700}
    /* board / timeline */
    .alert-row{display:flex;align-items:flex-start;gap:12px;padding:13px;border-radius:12px;background:var(--soft);margin-bottom:10px;border-left:4px solid var(--line);min-width:0}
    .alert-row .ai{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
    .alert-row .body{min-width:0;flex:1}
    .alert-row .body h4{margin:0;font-size:13.5px;font-weight:800}
    .alert-row .body p{margin:3px 0 0;font-size:12px;color:var(--muted)}
    .alert-row .tm{font-size:11.5px;color:var(--muted);font-weight:700;flex:none;font-family:"Inter",sans-serif}
    /* dispatch board */
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .col{background:var(--soft);border-radius:14px;padding:12px;border:1px solid var(--line);min-width:0}
    .col h4{margin:0 0 10px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
    .col h4 .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
    .dcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;min-width:0}
    .dcard .dt{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
    .dcard .dm{font-size:11.5px;color:var(--muted);margin-top:4px}
    .dcard .dm b{color:var(--ink)}
    .prio{width:8px;height:8px;border-radius:50%;flex:none}
    /* matrix */
    .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:700}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
    /* forecast strips */
    .stripwrap{display:flex;flex-direction:column;gap:9px}
    .strip{display:flex;align-items:center;gap:10px;min-width:0}
    .strip .h{font-size:12px;font-weight:800;width:52px;flex:none;font-family:"Inter",sans-serif;color:var(--muted)}
    .strip .track{flex:1;height:22px;border-radius:7px;background:var(--soft);overflow:hidden;position:relative;min-width:0}
    .strip .track>i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
    .strip .track.danger>i{background:linear-gradient(90deg,#fca5a5,var(--danger))}
    .strip .track.warn>i{background:linear-gradient(90deg,#fcd77f,var(--alert))}
    .strip .v{width:64px;text-align:right;flex:none;font-family:"Inter",sans-serif;font-weight:800;font-size:12.5px}
    hr.sep{border:none;border-top:1px dashed var(--line);margin:14px 0}
    .inline-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
    .inline-note .material-symbols-outlined{font-size:17px;color:var(--accent)}
    .mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mt14{margin-top:14px}
    .flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
    /* RWD */
    @media(max-width:860px){
      .split{grid-template-columns:1fr}
      .listpane{max-height:none}
    }
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr}
      .grid2{grid-template-columns:1fr}
      .grid3{grid-template-columns:1fr}
      .board{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      nav button .txt{display:none}
      nav button{padding:10px 12px}
      .kpis{grid-template-columns:1fr 1fr}
      .brand p{display:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">cell_tower</span></div>
        <div style="min-width:0">
          <h1>能源需量告警塔</h1>
          <p>15 分鐘需量週期即時監控 · 逼近契約容量分級告警 · 削峰派工</p>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="pill"><span class="dot"></span>即時連線 · 42 迴路</div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px">schedule</span>需量週期 12:47</div>
    </header>

    <nav id="nav"></nav>
    <main id="app"></main>
  </div>

<script>
(function(){
  "use strict";
  var C={accent:"#16a34a",accent2:"#4ade80",warn:"#f59e0b",alert:"#f97316",danger:"#ef4444",ink:"#122016",muted:"#5b6b60",line:"#dbe6dd"};
  var charts=[];
  function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function n(v){return (v==null?0:v).toLocaleString("en-US");}

  var MODULES=[
    {icon:"monitoring",name:"即時需量監視",desc:"42 迴路 15 分鐘週期即時追蹤"},
    {icon:"notifications_active",name:"需量告警塔",desc:"逼近契約容量分級預警與事件單"},
    {icon:"gavel",name:"契約容量管理",desc:"契約容量與超約罰款試算"},
    {icon:"bolt",name:"負載卸載排程",desc:"可控負載優先序削峰派工"},
    {icon:"insights",name:"尖峰預測",desc:"當日需量峰值走勢預測"},
    {icon:"receipt_long",name:"電費與碳盤查",desc:"電費結算與排放係數對應"}
  ];

  /* ---------- data ---------- */
  var CONTRACT=3200; // kW
  var circuits=[
    {id:"熔煉爐 A 線",area:"鑄造區",demand:1180,cap:1300,status:"alert",trend:"+8%"},
    {id:"空壓機群",area:"公用設施",demand:640,cap:720,status:"warn",trend:"+3%"},
    {id:"冰水主機 #1",area:"空調",demand:520,cap:600,status:"ok",trend:"-2%"},
    {id:"表面處理線",area:"電鍍區",demand:410,cap:480,status:"ok",trend:"+1%"},
    {id:"沖壓廠房",area:"沖壓區",demand:295,cap:400,status:"ok",trend:"0%"},
    {id:"辦公與照明",area:"行政",demand:132,cap:220,status:"ok",trend:"-4%"},
    {id:"廢水處理",area:"環保",demand:88,cap:150,status:"ok",trend:"+2%"}
  ];
  function pct(v,c){return Math.round(v/c*100);}
  function stColor(s){return s==="alert"?C.danger:s==="warn"?C.warn:C.accent;}

  var demandSeries=[2180,2240,2310,2470,2590,2760,2880,2950,3010,2870,2690,2540]; // by 15min blocks
  var demandLabels=["12:00","12:15","12:30","12:45","13:00","13:15","13:30","13:45","14:00","14:15","14:30","14:45"];

  /* ---------- render helpers ---------- */
  function scrHead(m){return '<div class="scr-head"><div class="ico"><span class="material-symbols-outlined">'+m.icon+'</span></div><div style="min-width:0"><h2>'+esc(m.name)+'</h2><p>'+esc(m.desc)+'</p></div></div>';}

  /* ===== screen 0: 即時需量監視 (SPLIT signature) ===== */
  function s0(){
    var sel=circuits[0];
    var totalNow=demandSeries[8];
    var kpi=[
      {l:"即時總需量",v:n(totalNow),u:"kW",s:"契約 "+n(CONTRACT)+" kW",cls:"up",i:"speed"},
      {l:"週期使用率",v:Math.round(totalNow/CONTRACT*100),u:"%",s:"逼近上限",cls:"up",i:"battery_charging_full"},
      {l:"本日最高需量",v:n(3010),u:"kW",s:"14:00 週期",cls:"up",i:"trending_up"},
      {l:"距離告警",v:190,u:"kW",s:"約 2 個週期",cls:"down",i:"warning"}
    ];
    var h=scrHead(MODULES[0]);
    h+='<div class="kpis mb14">';
    kpi.forEach(function(k){h+='<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="sub '+k.cls+'">'+esc(k.s)+'</div></div>';});
    h+='</div>';
    h+='<div class="split">';
    // left list pane
    h+='<div class="card pad listpane"><div class="card-title"><span class="material-symbols-outlined">list_alt</span>迴路即時需量</div>';
    circuits.forEach(function(c,i){
      var p=pct(c.demand,c.cap);
      h+='<div class="litem'+(i===0?' sel':'')+'"><div style="min-width:0"><div class="nm">'+esc(c.id)+'</div><div class="mt">'+esc(c.area)+' · 契約 '+n(c.cap)+' kW</div><div class="bar"><i style="width:'+Math.min(p,100)+'%;background:'+stColor(c.status)+'"></i></div></div><div class="rt"><b class="num">'+n(c.demand)+'</b><div class="mt">'+p+'%</div></div></div>';
    });
    h+='</div>';
    // right detail
    h+='<div style="display:flex;flex-direction:column;gap:14px;min-width:0">';
    h+='<div class="grid2">';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined">gauge</span>'+esc(sel.id)+' 需量錶</div><div class="gauge"><div class="gring"><canvas id="c0g"></canvas><div class="big"><b>'+n(sel.demand)+'</b><span>kW / 契約 '+n(sel.cap)+'</span></div></div><div class="tag t-alert"><span class="material-symbols-outlined">bolt</span>使用率 '+pct(sel.demand,sel.cap)+'% · '+esc(sel.trend)+'</div></div></div>';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined">show_chart</span>全廠需量走勢（15 分鐘）</div><div class="chartbox sm"><canvas id="c0l"></canvas></div></div>';
    h+='</div>';
    h+='<div class="card pad"><div class="card-title"><span class="material-symbols-outlined">insights</span>各迴路需量占比</div><div class="chartbox"><canvas id="c0b"></canvas></div></div>';
    h+='</div>';
    h+='</div>';
    return {html:h,init:function(){
      var g=document.getElementById("c0g");
      charts.push(new Chart(g,{type:"doughnut",data:{labels:["需量","餘裕"],datasets:[{data:[sel.demand,Math.max(sel.cap-sel.demand,0)],backgroundColor:[C.alert,"#eaf2ec"],borderWidth:0}]},options:{cutout:"74%",plugins:{legend:{display:false},tooltip:{enabled:false}},responsive:true,maintainAspectRatio:false}}));
      var l=document.getElementById("c0l");
      charts.push(new Chart(l,{type:"line",data:{labels:demandLabels,datasets:[{label:"總需量 kW",data:demandSeries,borderColor:C.accent,backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35,pointRadius:0,borderWidth:2.5},{label:"契約容量",data:demandLabels.map(function(){return CONTRACT;}),borderColor:C.danger,borderDash:[6,5],pointRadius:0,borderWidth:1.5,fill:false}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:false,grid:{color:"#eef3ef"}},x:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));
      var b=document.getElementById("c0b");
      charts.push(new Chart(b,{type:"bar",data:{labels:circuits.map(function(c){return c.id;}),datasets:[{label:"需量 kW",data:circuits.map(function(c){return c.demand;}),backgroundColor:circuits.map(function(c){return stColor(c.status);}),borderRadius:6,maxBarThickness:34}]},options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:"#eef3ef"}},x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:false,font:{size:10}}}},responsive:true,maintainAspectRatio:false}}));
    }};
  }

  /* ===== screen 1: 需量告警塔 ===== */
  function s1(){
    var alerts=[
      {lv:"danger",ic:"crisis_alert",t:"熔煉爐 A 線逼近契約容量",p:"迴路需量 1,180 kW（91%）· 全廠合計預估 14:15 週期突破 3,200 kW",tm:"14:02",st:"處理中"},
      {lv:"alert",ic:"warning",t:"全廠需量進入橙色警戒",p:"連續 2 個週期高於 90% 契約容量，已推播值班與能源工程師",tm:"13:47",st:"已派工"},
      {lv:"warn",ic:"error",t:"空壓機群負載上升",p:"需量 640 kW（89%），建議調整卸載順序或錯開起動",tm:"13:30",st:"待確認"},
      {lv:"ok",ic:"task_alt",t:"冰水主機 #1 回落安全區",p:"降載後需量由 92% 回落至 87%，事件單自動結案",tm:"12:58",st:"已結案"},
      {lv:"info",ic:"schedule",t:"預估 14:30 進入尖峰時段",p:"時間電價尖峰時段將啟動，需量門檻自動下修 5%",tm:"12:40",st:"已通知"}
    ];

  }
  nav.innerHTML=navHtml;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");if(!b)return;show(+b.getAttribute("data-i"));
  });

  var app=document.getElementById("app");
  function show(i){
    killCharts();
    var btns=document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
    var r=SCREENS[i]();
    app.innerHTML='<section class="screen">'+r.html+'</section>';
    void app.offsetHeight;
    if(r.init){try{r.init();}catch(e){}}
  }
  window.show=show;
  show(0);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
