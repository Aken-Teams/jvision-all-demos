var RENDER=[v0,v1,v2,v3,v4,v5];
function buildNav(){
var n=document.getElementById("nav");
n.innerHTML=MODULES.map(function(m,i){return'<button type="button" data-i="'+i+'" aria-label="'+m.name+'">'+icon(m.icon)+'<span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})
}
function show(i){
killCharts();var m=MODULES[i],screen=document.getElementById("screen");
document.getElementById("th-ico").innerHTML=icon(m.icon);
document.getElementById("th-title").textContent=m.name;
document.getElementById("th-sub").textContent=m.sub;
Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){var on=+b.getAttribute("data-i")===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
screen.classList.remove("reveal");RENDER[i](screen);void screen.offsetHeight;screen.classList.add("reveal")
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
