<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>六標準差改善專案管理 | Six Sigma DMAIC</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --acc:#0369a1; --acc2:#38bdf8; --acc-soft:#e0f2fe;
  --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --purple:#7c3aed;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.brand .logo .ms{font-size:24px}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11px;color:var(--sub);font-weight:500}
.navlab{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:1.2px;padding:10px 10px 4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.15s}
.nav button .ms{font-size:21px;color:var(--sub)}
.nav button .stg{margin-left:auto;font-size:10px;font-weight:800;color:var(--acc);background:var(--acc-soft);padding:2px 7px;border-radius:20px}
.nav button:hover{background:#f1f5f9}
.nav button.on{background:linear-gradient(135deg,var(--acc),#0284c7);color:#fff}
.nav button.on .ms{color:#fff}
.nav button.on .stg{background:rgba(255,255,255,.22);color:#fff}
.sidefoot{margin-top:auto;padding:12px 10px;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}
.sidefoot b{color:var(--acc)}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top .htitle{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.top .htitle .ms{color:var(--acc);font-size:26px}
.top .hsub{font-size:13px;color:var(--sub);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.7fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .ms{font-size:19px;color:var(--acc)}
.card .cdesc{font-size:11.5px;color:var(--sub);margin-bottom:14px}
.kpi .klab{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .klab .ms{font-size:18px;color:var(--acc)}
.kpi .kval{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .kval small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .ktrend{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.kpi .ktrend .ms{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--sub)}
.kpi .kbar{height:5px;background:#eef2f7;border-radius:5px;margin-top:12px;overflow:hidden}
.kpi .kbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.5px;color:var(--sub);font-weight:700;text-transform:uppercase;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-blue{background:var(--acc-soft);color:var(--acc)}
.t-green{background:#dcfce7;color:var(--ok)}
.t-amber{background:#fef3c7;color:var(--warn)}
.t-red{background:#fee2e2;color:var(--bad)}
.t-gray{background:#f1f5f9;color:var(--sub)}
.t-purple{background:#ede9fe;color:var(--purple)}
.who{display:flex;align-items:center;gap:8px}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.prog{height:7px;background:#eef2f7;border-radius:6px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;border-radius:6px}
.scroll{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col h4{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--acc-soft)}
.col h4 span.n{font-size:10px;background:#fff;border:1px solid var(--line);color:var(--sub);padding:1px 7px;border-radius:20px}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk .id{font-size:9.5px;color:var(--sub);font-weight:700;letter-spacing:.4px}
.tk .tt{font-size:12px;font-weight:600;margin:3px 0 7px;line-height:1.35}
.tk .mt{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--sub)}
.tg{display:flex;flex-direction:column;gap:0}
.tgi{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tgi:last-child{padding-bottom:0}
.tgi .rail{display:flex;flex-direction:column;align-items:center;flex:0 0 34px}
.tgi .node{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;z-index:1;flex:0 0 34px}
.tgi .line{flex:1;width:2px;background:var(--line);margin-top:2px}
.tgi:last-child .line{display:none}
.tgi .body{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-width:0}
.tgi .body .th{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.tgi .body h5{font-size:13.5px;font-weight:800}
.tgi .body p{font-size:11.5px;color:var(--sub);margin-top:5px}
.tgi .body .dl{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;font-size:11px}
.tgi .body .dl b{display:block;color:var(--sub);font-weight:600;font-size:10px}
.tgi .body .dl span{font-weight:700;font-size:12.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.chartbox{width:100%;overflow:hidden}
.split{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.stat{flex:1;min-width:120px}
.stat .l{font-size:11px;color:var(--sub);font-weight:600}
.stat .v{font-size:22px;font-weight:800;margin-top:2px}
.rule{background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.rule .rt{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.rule .rt .ms{color:var(--acc);font-size:17px}
.rule p{font-size:11.5px;color:var(--sub);margin-top:5px}
.datacap{font-size:11.5px;color:var(--sub);margin-top:12px;display:flex;align-items:center;gap:6px}
.datacap .ms{font-size:15px;color:var(--acc)}
.gate{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;margin-top:9px}
.gate.pass{background:#dcfce7;color:var(--ok)}
.gate.hold{background:#fef3c7;color:var(--warn)}
.factor{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.factor .fn{flex:0 0 92px;font-size:12px;font-weight:600}
.factor .fbar{flex:1;height:14px;background:#eef2f7;border-radius:7px;overflow:hidden}
.factor .fbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.factor .fv{flex:0 0 46px;text-align:right;font-size:12px;font-weight:800;color:var(--acc)}
.hint{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:11px 13px;font-size:11.5px;color:#075985;display:flex;gap:9px;align-items:flex-start}
.hint .ms{color:var(--acc);font-size:18px;flex:0 0 18px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .brand{padding:2px 4px 12px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:8px}
  .nav button{width:auto;flex:0 0 auto;padding:9px 13px}
  .nav button .stg{display:none}
  .navlab,.sidefoot{display:none}
  .main{padding:20px 16px 50px}
}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){
  .nav button .nlab{display:none}
  .nav button{padding:9px 11px}
  .g4{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .top .htitle{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="ms">account_tree</span></div>
      <div><h1>DMAIC 專案管理</h1><p>Six Sigma 改善平台</p></div>
    </div>
    <div class="navlab">功能模組</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">品保部 · 製程工程部 · 研發部<br/>本季進行中專案 <b>18</b> 件</div>
  </aside>
  <main class="main">
    <div class="top" id="top"></div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
  {icon:"account_tree",name:"專案立案與里程碑",stage:"Define",title:"專案立案與里程碑管理",sub:"DMAIC 專案章程、範疇界定與里程碑排程"},
  {icon:"insights",name:"統計分析工具",stage:"Measure",title:"統計分析工具整合",sub:"假設檢定、迴歸分析與製程能力量測"},
  {icon:"checklist",name:"DMAIC 階段關卡",stage:"Analyze",title:"DMAIC 階段關卡審查",sub:"各階段交付物審查與 Tollgate 放行"},
  {icon:"monitoring",name:"進度追蹤看板",stage:"Improve",title:"專案進度追蹤看板",sub:"時程、任務與風險即時追蹤"},
  {icon:"trending_up",name:"效益驗證",stage:"Benefit",title:"改善效益驗證",sub:"年度效益金額與改善成效量化"},
  {icon:"verified",name:"控制計畫稽核",stage:"Control",title:"控制計畫落地稽核",sub:"控制計畫維持與成果稽核"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(id,cfg){var node=el(id);if(!node)return;var c=new ApexCharts(node,cfg);c.render();charts.push(c);}
var COMMON={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'inherit'}};
function money(n){return n.toLocaleString('en-US');}

/* ---------- SCREEN 0 : 立案與里程碑 ---------- */
function s0(){
  var kp=[
    {l:"進行中專案",v:"18",u:"件",t:"本季 +4",c:"up",i:"account_tree",p:72},
    {l:"待立案審查",v:"5",u:"件",t:"含 2 件加急",c:"flat",i:"pending_actions",p:40},
    {l:"里程碑準時率",v:"86",u:"%",t:"較上季 +7%",c:"up",i:"event_available",p:86},
    {l:"逾期里程碑",v:"3",u:"個",t:"需介入",c:"down",i:"warning",p:22}
  ];
  var kh="";
  for(var i=0;i<kp.length;i++){var k=kp[i];
    kh+='<div class="card kpi"><div class="klab"><span class="ms">'+k.i+'</span>'+k.l+'</div>'+
    '<div class="kval">'+k.v+'<small>'+k.u+'</small></div>'+
    '<div class="ktrend '+k.c+'"><span class="ms">'+(k.c=='up'?'trending_up':k.c=='down'?'trending_down':'trending_flat')+'</span>'+k.t+'</div>'+
    '<div class="kbar"><i style="width:'+k.p+'%"></i></div></div>';
  }
  var proj=[
    {id:"SS-2408",n:"SMT 焊點空洞率改善",bb:"林建誠",dept:"製程",sav:2400000,st:"Analyze",cl:"t-purple",pr:52},
    {id:"SS-2411",n:"注塑短射不良降低",bb:"陳怡君",dept:"品保",sav:1850000,st:"Measure",cl:"t-blue",pr:34},
    {id:"SS-2415",n:"CNC 尺寸 Cpk 提升",bb:"王志豪",dept:"製程",sav:3120000,st:"Improve",cl:"t-amber",pr:71},
    {id:"SS-2419",n:"包裝線停機時間縮減",bb:"張淑芬",dept:"研發",sav:960000,st:"Define",cl:"t-gray",pr:15},
    {id:"SS-2402",n:"鍍膜厚度變異控制",bb:"李冠廷",dept:"品保",sav:2760000,st:"Control",cl:"t-green",pr:94}
  ];
  var rows="";
  for(var j=0;j<proj.length;j++){var p=proj[j];
    rows+='<tr><td><b>'+p.id+'</b></td><td>'+p.n+'</td>'+
    '<td><div class="who"><div class="av">'+p.bb.charAt(0)+'</div>'+p.bb+'</div></td>'+
    '<td><span class="tag t-gray">'+p.dept+'</span></td>'+
    '<td style="font-weight:700">NT$ '+money(p.sav)+'</td>'+
    '<td><span class="tag '+p.cl+'">'+p.st+'</span></td>'+
    '<td><div style="display:flex;align-items:center;gap:8px"><div class="prog"><i style="width:'+p.pr+'%;background:linear-gradient(90deg,var(--acc),var(--acc2))"></i></div><span style="font-size:11px;font-weight:700;color:var(--sub)">'+p.pr+'%</span></div></td></tr>';
  }
  var ms=[
    {n:"D",t:"專案章程核准",d:"08/02",st:"完成",cl:"var(--ok)"},
    {n:"M",t:"量測系統分析 MSA",d:"08/16",st:"進行中",cl:"var(--acc)"},
    {n:"A",t:"關鍵因子確認",d:"08/30",st:"待啟動",cl:"var(--sub)"},
    {n:"I",t:"改善對策驗證",d:"09/20",st:"待啟動",cl:"var(--sub)"},
    {n:"C",t:"控制計畫落地",d:"10/10",st:"待啟動",cl:"var(--sub)"}
  ];
  var mh="";
  for(var m=0;m<ms.length;m++){var g=ms[m];
    mh+='<div class="tgi"><div class="rail"><div class="node" style="background:'+g.cl+'">'+g.n+'</div><div class="line"></div></div>'+
    '<div class="body"><div class="th"><h5>'+g.t+'</h5><span class="tag '+(g.st=='完成'?'t-green':g.st=='進行中'?'t-blue':'t-gray')+'">'+g.st+'</span></div>'+
    '<div class="dl"><div><b>目標日期</b><span>'+g.d+'</span></div><div><b>DMAIC 階段</b><span>'+g.n+' Phase</span></div></div></div></div>';
  }
  el('screen').innerHTML=
    '<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'+
    '<div class="grid g23">'+
      '<div class="card"><h3><span class="ms">list_alt</span>進行中改善專案</h3><div class="cdesc">依 DMAIC 階段與預估年度效益金額排序</div>'+
        '<div class="scroll"><table><thead><tr><th>專案編號</th><th>改善主題</th><th>黑帶</th><th>部門</th><th>預估年效益</th><th>階段</th><th>進度</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<div class="datacap"><span class="ms">insights</span>資料來源：專案章程資料庫 · 每日同步 QMS / CAPA</div></div>'+
      '<div class="card"><h3><span class="ms">flag</span>當前專案里程碑</h3><div class="cdesc">SS-2408 SMT 焊點空洞率改善</div><div class="tg">'+mh+'</div></div>'+
    '</div>';
}

/* ---------- SCREEN 1 : 統計分析工具 (Measure) ---------- */
function s1(){
  el('screen').innerHTML=
    '<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="card kpi"><div class="klab"><span class="ms">straighten</span>製程能力 Cpk</div><div class="kval">1.12</div><div class="ktrend down"><span class="ms">trending_down</span>目標 1.33 未達</div><div class="kbar"><i style="width:84%"></i></div></div>'+
      '<div class="card kpi"><div class="klab"><span class="ms">show_chart</span>製程 Sigma 水準</div><div class="kval">3.4<small>σ</small></div><div class="ktrend flat"><span class="ms">trending_flat</span>基線值</div><div class="kbar"><i style="width:57%"></i></div></div>'+
      '<div class="card kpi"><div class="klab"><span class="ms">query_stats</span>DPMO</div><div class="kval">21,800</div><div class="ktrend down"><span class="ms">trending_down</span>每百萬缺陷數</div><div class="kbar"><i style="width:44%"></i></div></div>'+
      '<div class="card kpi"><div class="klab"><span class="ms">rule</span>良率</div><div class="kval">97.8<small>%</small></div><div class="ktrend up"><span class="ms">trending_up</span>基線量測</div><div class="kbar"><i style="width:98%"></i></div></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-bottom:16px">'+
      '<div class="card"><h3><span class="ms">bar_chart</span>量測值分佈與規格界限</h3><div class="cdesc">焊點空洞率 (%) 直方圖 vs USL 上規格</div><div class="chartbox" id="c1a"></div>'+
        '<div class="legend"><span><i style="background:var(--acc)"></i>量測次數</span><span><i style="background:var(--bad)"></i>USL 上規格 2.5%</span></div></div>'+
      '<div class="card"><h3><span class="ms">monitoring</span>SPC 管制圖 (X-bar)</h3><div class="cdesc">近 12 批次平均值與 UCL / LCL 管制界限</div><div class="chartbox" id="c1b"></div></div>'+

var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){var m=MODS[i];
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="ms">'+m.icon+'</span><span class="nlab">'+m.name+'</span><span class="stg">'+m.stage+'</span></button>';
  }
  el('nav').innerHTML=h;
}
function show(i){
  var mod=MODS[i]||MODS[0];
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle('on',+btns[b].getAttribute('data-i')===i);}
  el('top').innerHTML='<div><div class="htitle"><span class="ms">'+mod.icon+'</span>'+mod.title+'</div><div class="hsub">'+mod.sub+'</div></div>'+
    '<div class="pill"><span class="dot"></span>DMAIC · '+mod.stage+' 階段</div>';
  destroyCharts();
  (SCREENS[i]||s0)();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
