<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品質改善專案管理 | Six Sigma DMAIC</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A84B08;
  --bad:#DC2626;
  --purple:#6D28D9;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 24px rgba(15,23,42,.055);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px;border-bottom:1px solid var(--line)}
.logo{display:grid;place-items:center;width:42px;height:42px;background:var(--blue);color:#fff;border-radius:8px;box-shadow:5px 5px 0 #BFDBFE}
.logo svg{width:23px;height:23px}
.brand h1{margin:0;font-size:15px;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}
.navlab{padding:22px 10px 8px;color:var(--muted);font:600 10px "Fira Code";letter-spacing:.14em;text-transform:uppercase}
.nav{display:grid;gap:5px}
.nav button{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 11px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);text-align:left;font-size:13px;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .2s}
.nav button svg{width:19px;height:19px;color:var(--muted)}
.nav button:hover{background:#F1F5F9;border-color:var(--line);transform:translateX(2px)}
.nav button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.nav button.on svg{color:#fff}
.stg{padding:2px 6px;border:1px solid #CBD5E1;border-radius:4px;color:var(--muted);font:600 9px "Fira Code"}
.nav button.on .stg{border-color:rgba(255,255,255,.55);color:#fff}
.sidefoot{margin-top:auto;padding:18px 9px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.sidefoot b{color:var(--blue);font-family:"Fira Code"}
.main{width:100%;padding:28px clamp(18px,3vw,42px) 64px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:-28px calc(clamp(18px,3vw,42px)*-1) 24px;padding:22px clamp(18px,3vw,42px) 18px;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.htitle{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(20px,2vw,28px);font-weight:700;letter-spacing:-.025em}
.htitle svg{width:25px;height:25px;color:var(--blue)}
.hsub{margin-top:3px;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:7px 11px;background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:600 11px "Fira Code";box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #DCFCE7}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.6fr)}
.mb{margin-bottom:14px}
.card{background:var(--color-card);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:var(--shadow);transition:border-color .22s,box-shadow .22s,transform .22s}
.card:hover{border-color:#BFDBFE;box-shadow:0 1px 2px rgba(15,23,42,.05),0 14px 30px rgba(37,99,235,.08)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;font-size:14px}
.card h3 svg{width:18px;height:18px;color:var(--blue)}
.cdesc{margin-bottom:15px;color:var(--muted);font-size:11.5px}
.kpi{position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
.klab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:600}
.klab svg{width:17px;height:17px;color:var(--blue)}
.kval{margin-top:8px;font:700 27px "Fira Code";letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kval small{margin-left:4px;color:var(--muted);font:600 12px "Fira Sans"}
.ktrend{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:600}
.ktrend svg{width:14px;height:14px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kbar,.prog,.fbar{overflow:hidden;background:var(--color-muted)}
.kbar{height:4px;margin-top:13px}
.kbar i,.prog i,.fbar i{display:block;height:100%;background:var(--blue)}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 11px;background:#F8FAFC;border-block:1px solid var(--line);color:var(--muted);font:600 10px "Fira Code";letter-spacing:.04em;text-align:left;white-space:nowrap}
td{padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .18s}
tbody tr:hover{background:#EFF6FF}
td:first-child,td:nth-child(4),td:nth-child(5),td:nth-child(6),td:nth-child(7){font-variant-numeric:tabular-nums}
td:first-child{font-family:"Fira Code"}
th:nth-last-child(1),td:nth-last-child(1){text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:4px;font-size:10.5px;font-weight:600;white-space:nowrap}
.t-blue{background:#EFF6FF;color:#1D4ED8}.t-green{background:#F0FDF4;color:#166534}.t-amber{background:#FFF7ED;color:#9A3412}.t-red{background:#FEF2F2;color:#B91C1C}.t-gray{background:#F8FAFC;color:#475569}.t-purple{background:#F5F3FF;color:#6D28D9}
.who{display:flex;align-items:center;gap:7px}
.av{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;background:#DBEAFE;border:1px solid #93C5FD;border-radius:50%;color:#1E40AF;font-size:10px;font-weight:700}
.prog{min-width:66px;height:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px}
.col{padding:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:7px}
.col h4{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid #DBEAFE;font-size:11.5px}
.n{padding:1px 6px;background:#fff;border:1px solid var(--line);border-radius:4px;color:var(--muted);font:600 9px "Fira Code"}
.tk{margin-bottom:8px;padding:9px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;transition:transform .2s,box-shadow .2s}
.tk:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.id{color:var(--muted);font:600 9px "Fira Code"}
.tt{margin:4px 0 8px;font-size:11.5px;font-weight:600;line-height:1.4}
.mt{display:flex;justify-content:space-between;align-items:center}
.tg{display:grid}
.tgi{display:grid;grid-template-columns:34px 1fr;gap:13px}
.rail{display:flex;flex-direction:column;align-items:center}
.node{display:grid;place-items:center;z-index:1;width:34px;height:34px;border-radius:50%;color:#fff;font:700 12px "Fira Code"}
.line{width:1px;flex:1;background:var(--line)}
.tgi:last-child .line{display:none}
.tgi .body{margin-bottom:13px;padding:12px 13px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px}
.th{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap}
.th h5{margin:0;font-size:13px}
.tgi p,.rule p{margin:5px 0 0;color:var(--muted);font-size:11px}
.dl{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.dl b{display:block;color:var(--muted);font-size:9.5px;font-weight:500}
.dl span{font:600 11px "Fira Code"}
.gate{display:flex;align-items:center;gap:6px;margin-top:9px;padding:7px 9px;border-left:3px solid currentColor;font-size:10.5px;font-weight:600}
.gate svg{width:15px;height:15px}.pass{background:#F0FDF4;color:#166534}.hold{background:#FFF7ED;color:#9A3412}
.factor{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.fn{flex:0 0 96px;font-size:11px}.fbar{height:12px;flex:1}.fv{flex:0 0 42px;color:var(--blue);font:700 11px "Fira Code";text-align:right}
.hint{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:5px;color:#1E3A8A;font-size:11px}
.hint svg{flex:0 0 17px;width:17px;height:17px}
.rule{margin-bottom:9px;padding:10px 12px;background:#F8FAFC;border:1px solid var(--line);border-left:3px solid var(--color-accent);border-radius:5px}
.rt{font-size:11.5px;font-weight:600}
.split,.legend,.datacap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat{flex:1;min-width:90px}.stat .l{color:var(--muted);font-size:10px}.stat .v{font:700 20px "Fira Code"}
.legend,.datacap{margin-top:10px;color:var(--muted);font-size:10.5px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
.chartbox{width:100%;overflow:hidden}
.grid-item{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;width:auto;height:auto;padding:14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding-bottom:13px}.navlab,.sidefoot{display:none}.nav{grid-template-columns:repeat(3,1fr);margin-top:12px}.nav button{grid-template-columns:20px 1fr}.nav .stg{display:none}.main{padding-top:22px}.top{position:static;margin:-22px 0 20px;padding:0 0 17px;background:transparent;backdrop-filter:none}.board{grid-template-columns:repeat(2,minmax(210px,1fr))}}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.nav button{flex:0 0 48px;display:grid;place-items:center;padding:10px}.nlab{display:none}.board{grid-template-columns:1fr}.card{padding:15px}}
@media(max-width:420px){.g4{grid-template-columns:1fr}.main{padding-inline:12px}.pill{white-space:normal}.htitle{font-size:19px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.nav button:hover,.tk:hover{transform:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><span class="logo" data-icon="workflow"></span><div><h1>品質改善專案管理</h1><p>Six Sigma DMAIC 平台</p></div></div>
  <div class="navlab">Quality workflow</div>
  <nav class="nav" id="nav" aria-label="功能模組"></nav>
  <div class="sidefoot">品保部 · 製程工程部 · 研發部<br>本季進行中專案 <b>18</b> 件</div>
</aside>
<main class="main"><header class="top" id="top"></header><section id="screen" aria-live="polite"></section></main>
</div>
<script>
"use strict";
const ICONS={
workflow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/><path d="M9 6h5a3 3 0 0 1 3 3v6M6 9v9h9"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 2 5-7"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16M15 4v16"/></svg>',
trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>',
shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>',
alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 2.9 1.8 17a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 2.9a2 2 0 0 0-3.4 0"/><path d="M12 9v4M12 17h.01"/></svg>',
clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h.01M17 9h.01"/><circle cx="12" cy="12" r="2"/></svg>',
doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></svg>'
};
const icon=n=>ICONS[n]||ICONS.chart;
document.querySelectorAll("[data-icon]").forEach(x=>x.innerHTML=icon(x.dataset.icon));
const MODS=[
["workflow","專案立案與里程碑","Define","專案立案與里程碑管理","DMAIC 專案章程、範疇界定與里程碑排程"],
["chart","統計分析工具","Measure","統計分析工具整合","假設檢定、迴歸分析與製程能力量測"],
["check","DMAIC 階段關卡","Analyze","DMAIC 階段關卡審查","各階段交付物審查與 Tollgate 放行"],
["board","進度追蹤看板","Improve","專案進度追蹤看板","時程、任務與風險即時追蹤"],
["trend","效益驗證","Benefit","改善效益驗證","年度效益金額與改善成效量化"],
["shield","控制計畫稽核","Control","控制計畫落地稽核","控制計畫維持與成果稽核"]
];
let charts=[];
const $=s=>document.querySelector(s);
const money=n=>n.toLocaleString("en-US");
function destroyCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function mk(id,cfg){const node=document.getElementById(id);if(node&&window.ApexCharts){const c=new ApexCharts(node,cfg);c.render();charts.push(c)}}
const common={chart:{toolbar:{show:false},animations:{enabled:false},fontFamily:"Fira Sans"},dataLabels:{enabled:false},grid:{borderColor:"#E2E8F0"},tooltip:{theme:"light"}};
const card=(title,desc,body,ic="chart")=>`<article class="card grid-item"><h3>${icon(ic)}${title}</h3><div class="cdesc">${desc}</div>${body}</article>`;
function kpi(l,v,u,t,state,ic,p){
 const arrows=state==="up"?"trend":state==="down"?"alert":"clock";
 return `<article class="card kpi grid-item"><div class="klab">${icon(ic)}${l}</div><div class="kval">${v}<small>${u||""}</small></div><div class="ktrend ${state}">${icon(arrows)}${t}</div>${p==null?"":`<div class="kbar"><i style="width:${p}%"></i></div>`}</article>`
}
function s0(){
 const ks=[
 ["進行中專案","18","件","本季 +4","up","workflow",72],["待立案審查","5","件","含 2 件加急","flat","clock",40],
 ["里程碑準時率","86","%","較上季 +7%","up","check",86],["逾期里程碑","3","個","需介入","down","alert",22]
 ].map(x=>kpi(...x)).join("");
 const ps=[
 ["SS-2408","SMT 焊點空洞率改善","林建誠","製程",2400000,"Analyze","t-purple",52],
 ["SS-2411","注塑短射不良降低","陳怡君","品保",1850000,"Measure","t-blue",34],
 ["SS-2415","CNC 尺寸 Cpk 提升","王志豪","製程",3120000,"Improve","t-amber",71],
 ["SS-2419","包裝線停機時間縮減","張淑芬","研發",960000,"Define","t-gray",15],
 ["SS-2402","鍍膜厚度變異控制","李冠廷","品保",2760000,"Control","t-green",94]
 ];
 const rows=ps.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td><div class="who"><span class="av">${p[2][0]}</span>${p[2]}</div></td><td><span class="tag t-gray">${p[3]}</span></td><td style="text-align:right;font-weight:700">NT$ ${money(p[4])}</td><td><span class="tag ${p[6]}">${p[5]}</span></td><td><div style="display:flex;align-items:center;justify-content:flex-end;gap:7px"><div class="prog"><i style="width:${p[7]}%"></i></div><b>${p[7]}%</b></div></td></tr>`).join("");
 const ms=[["D","專案章程核准","08/02","完成","var(--ok)"],["M","量測系統分析 MSA","08/16","進行中","var(--blue)"],["A","關鍵因子確認","08/30","待啟動","var(--muted)"],["I","改善對策驗證","09/20","待啟動","var(--muted)"],["C","控制計畫落地","10/10","待啟動","var(--muted)"]];
 const miles=ms.map(g=>`<div class="tgi"><div class="rail"><div class="node" style="background:${g[4]}">${g[0]}</div><div class="line"></div></div><div class="body"><div class="th"><h5>${g[1]}</h5><span class="tag ${g[2]==="完成"?"t-green":g[2]==="進行中"?"t-blue":"t-gray"}">${g[2]}</span></div><div class="dl"><div><b>目標日期</b><span>${g[2]}</span></div><div><b>DMAIC 階段</b><span>${g[0]} Phase</span></div></div></div></div>`).join("");
 $("#screen").innerHTML=`<div class="grid g4 mb">${ks}</div><div class="grid g23">${card("進行中改善專案","依 DMAIC 階段與預估年度效益金額排序",`<div class="scroll"><table><thead><tr><th>專案編號</th><th>改善主題</th><th>黑帶</th><th>部門</th><th>預估年效益</th><th>階段</th><th>進度</th></tr></thead><tbody>${rows}</tbody></table></div><div class="datacap">${icon("chart")}資料來源：專案章程資料庫 · 每日同步 QMS / CAPA</div>`,"doc")}${card("當前專案里程碑","SS-2408 SMT 焊點空洞率改善",`<div class="tg">${miles}</div>`,"workflow")}</div>`;
