<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Customer Audit Portal 客戶稽核入口</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#b45309; --accent2:#f59e0b; --bg:#faf7f2; --panel:#ffffff;
  --ink:#2b2118; --muted:#8a7a68; --line:#eadfce; --soft:#fdf6ec;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#0e7490;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}
header.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#7c3d06,#b45309);color:#fff;box-shadow:0 2px 14px rgba(120,60,10,.22);}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand-t{min-width:0;}
.brand-t b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-t span{font-size:11px;opacity:.82;}
nav.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
nav.nav button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);color:#fff;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0;}
nav.nav button:hover{background:rgba(255,255,255,.22);}
nav.nav button.on{background:#fff;color:var(--accent);border-color:#fff;}
nav.nav button .material-symbols-outlined{font-size:18px;flex:0 0 auto;}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.screen-head h2{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px;}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.grid{display:grid;gap:14px;}
.kpi4{grid-template-columns:repeat(4,1fr);}
.kpi3{grid-template-columns:repeat(3,1fr);}
.col2{grid-template-columns:1fr 1fr;}
.col2b{grid-template-columns:1.4fr 1fr;}
.col3{grid-template-columns:repeat(3,1fr);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(90,60,20,.04);}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.kpi{position:relative;overflow:hidden;}
.kpi .ic{position:absolute;right:10px;top:8px;font-size:40px;opacity:.10;color:var(--accent);}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .val{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.5px;}
.kpi .sub{font-size:11.5px;margin-top:5px;color:var(--muted);}
.kpi .up{color:var(--ok);font-weight:700;}
.kpi .dn{color:var(--bad);font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--soft);}
tbody tr:hover{background:#fffdf8;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.p-ok{background:#e7f6ec;color:var(--ok);}
.p-warn{background:#fdf0dd;color:var(--warn);}
.p-bad{background:#fbe6e6;color:var(--bad);}
.p-info{background:#e0f2f7;color:var(--info);}
.p-mut{background:#f0ebe2;color:var(--muted);}
.chart{width:100%;height:300px;overflow:hidden;}
.chart.sm{height:240px;}
.barrow{min-width:0;}
.barrow .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.barrow .track{height:9px;background:#f0e8db;border-radius:6px;overflow:hidden;}
.barrow .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.lane{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.lane h4{margin:0 0 9px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.lane h4 .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;box-shadow:0 1px 2px rgba(90,60,20,.05);}
.tk .tt{font-size:12.5px;font-weight:700;}
.tk .mt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center;}
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlit{position:relative;margin-bottom:15px;}
.tlit::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tlit .th{font-size:13px;font-weight:700;}
.tlit .td{font-size:12px;color:var(--muted);margin-top:2px;}
.tlit .tm{font-size:11px;color:var(--accent);font-weight:600;}
.doc{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff;min-width:0;}
.doc .di{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--soft);}
.doc .di .material-symbols-outlined{color:var(--accent);font-size:22px;}
.doc .dinfo{min-width:0;flex:1;}
.doc .dinfo b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc .dinfo span{font-size:11px;color:var(--muted);}
.chk{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;background:#fff;}
.chk .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.chk .ch b{font-size:13px;}
.chk .cd{font-size:11.5px;color:var(--muted);margin-top:5px;}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap;}
.seg .s{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:default;}
.seg .s.on{background:var(--accent);color:#fff;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent2);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0;}
.list-row:last-child{border-bottom:none;}
.list-row .lr-t{min-width:0;flex:1;}
.list-row .lr-t b{font-size:13px;display:block;}
.list-row .lr-t span{font-size:11.5px;color:var(--muted);}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.mini{font-size:11px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.footnote{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px;}
@media(max-width:820px){
  .kpi4,.kpi3,.col2,.col2b,.col3{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  nav.nav button span.lbl{display:none;}
  nav.nav button{padding:8px 10px;}
  .board{grid-template-columns:1fr;}
  main{padding:16px 12px 50px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div class="brand-t">
        <b>Customer Audit Portal</b>
        <span>客戶稽核入口 / 線上稽核系統</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-i="0" onclick="show(0)"><span class="material-symbols-outlined">groups</span><span class="lbl">帳號權限</span></button>
      <button data-i="1" onclick="show(1)"><span class="material-symbols-outlined">calendar_month</span><span class="lbl">申請排程</span></button>
      <button data-i="2" onclick="show(2)"><span class="material-symbols-outlined">description</span><span class="lbl">文件庫</span></button>
      <button data-i="3" onclick="show(3)"><span class="material-symbols-outlined">fact_check</span><span class="lbl">稽核執行</span></button>
      <button data-i="4" onclick="show(4)"><span class="material-symbols-outlined">rule</span><span class="lbl">缺失追蹤</span></button>
      <button data-i="5" onclick="show(5)"><span class="material-symbols-outlined">verified</span><span class="lbl">結案留存</span></button>
    </nav>
  </div>
</header>
<main>
  <div id="app"></div>
  <div class="footnote">Customer Audit Portal · 純前端展示 Demo · 資料為模擬數據</div>
</main>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}

var PAL=["#b45309","#f59e0b","#0e7490","#15803d","#a16207","#c2410c"];
function baseGrid(){return{left:8,right:14,top:24,bottom:8,containLabel:true};}

// ---------- kpi helper ----------
function kpi(lab,val,unit,dir,sub,ic){
  var subc=dir==="up"?"up":dir==="dn"?"dn":"";
  var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px">arrow_upward</span>':dir==="dn"?'<span class="material-symbols-outlined" style="font-size:14px">arrow_downward</span>':"";
  return '<div class="card kpi"><span class="material-symbols-outlined ic">'+ic+'</span>'+
  '<div class="lab">'+lab+'</div><div class="val">'+val+'<span style="font-size:14px;color:var(--muted);font-weight:600;margin-left:3px">'+unit+'</span></div>'+
  '<div class="sub '+subc+'">'+arrow+sub+'</div></div>';
}

// ================= SCREEN 0 : 客戶帳號權限 =================
function screen0(){
  var custs=[
    {n:"O捷精密",acc:"audit_hongjie",role:"稽核主帳號",docs:12,st:"啟用",last:"2026-08-13 09:22"},
    {n:"泰豐O子",acc:"qa_taifeng",role:"文件檢視",docs:8,st:"啟用",last:"2026-08-12 16:40"},
    {n:"日盛車料",acc:"audit_nissei",role:"稽核主帳號",docs:15,st:"待審核",last:"2026-08-14 08:05"},
    {n:"綠源能源",acc:"view_greensrc",role:"文件檢視",docs:5,st:"啟用",last:"2026-08-10 11:12"},
    {n:"優力汽車",acc:"audit_uli",role:"稽核主帳號",docs:9,st:"已停用",last:"2026-06-28 14:00"},
    {n:"華光醫材",acc:"qa_huaguang",role:"文件檢視",docs:11,st:"待審核",last:"2026-08-14 07:31"}
  ];
  function stp(s){return s==="啟用"?"p-ok":s==="待審核"?"p-warn":"p-bad";}
  var rows="";
  for(var i=0;i<custs.length;i++){var c=custs[i];
    rows+='<tr><td><div style="display:flex;align-items:center;gap:9px"><span class="avatar">'+c.n.charAt(0)+'</span><b>'+c.n+'</b></div></td>'+
    '<td><span class="mini">'+c.acc+'</span></td><td>'+c.role+'</td><td>'+c.docs+' 份</td>'+
    '<td><span class="pill '+stp(c.st)+'">'+c.st+'</span></td><td class="mini">'+c.last+'</td></tr>';
  }
  app.innerHTML=
  '<div class="screen-head"><div><h2><span class="material-symbols-outlined">groups</span>客戶帳號權限管理</h2>'+
  '<p>開通客戶稽核帳號、指派文件檢視範圍，控管誰能看到哪些品質文件。</p></div>'+
  '<span class="tag" style="background:var(--soft);color:var(--accent)"><span class="material-symbols-outlined" style="font-size:16px">lock</span>權限稽核軌</span></div>'+
  '<div class="grid kpi4">'+
  kpi("已開通客戶","28","家","up","本月 +3","badge")+
  kpi("待審核申請","2","筆","dn","需業務確認","hourglass_top")+
  kpi("啟用帳號","24","個","up","活躍度 86%","how_to_reg")+
  kpi("敏感文件授權","47","份","","含 NDA 管控","encrypted")+
  '</div>'+
  '<div class="grid col2b" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">manage_accounts</span>客戶帳號清單</h3>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>客戶</th><th>帳號</th><th>權限角色</th><th>可閱文件</th><th>狀態</th><th>最近登入</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">shield</span>權限模板</h3>'+
      permRow("稽核主帳號","可申請稽核、填檢核表、下載報告","#b45309")+
      permRow("文件檢視","僅可線上查閱授權文件，不可下載","#0e7490")+
      permRow("改善協作","可回覆缺失、上傳佐證","#15803d")+
      '<div class="card" style="margin-top:12px;padding:12px;background:var(--soft)"><div class="mini" style="margin-bottom:8px;font-weight:700;color:var(--ink)">今日權限異動</div>'+
      logRow("開通 日盛車料 稽核主帳號","08:05","p-info")+
      logRow("華光醫材 申請 NDA 文件授權","07:31","p-warn")+
      logRow("停用 優力汽車 過期帳號","06:28","p-bad")+
      '</div></div>'+
  '</div>';
}
function permRow(t,d,c){return '<div class="list-row"><span class="dot" style="background:'+c+'"></span><div class="lr-t"><b>'+t+'</b><span>'+d+'</span></div><span class="material-symbols-outlined" style="color:var(--muted)">chevron_right</span></div>';}
function logRow(t,tm,cls){return '<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:12px"><span>'+t+'</span><span class="pill '+cls+'">'+tm+'</span></div>';}

// ================= SCREEN 1 : 稽核申請排程 =================
function screen1(){
  var reqs=[
    {c:"O捷精密",type:"現場稽核",scope:"CNC 加工線",date:"2026-08-20",st:"已確認"},
    {c:"泰豐O子",type:"遠端稽核",scope:"PCBA 表面貼裝",date:"2026-08-22",st:"待排程"},
    {c:"日盛車料",type:"現場稽核",scope:"沖壓 / 焊接",date:"2026-08-27",st:"協調中"},
    {c:"綠源能源",type:"文件稽核",scope:"品質系統文件",date:"2026-09-02",st:"已確認"}
  ];
  function stp(s){return s==="已確認"?"p-ok":s==="待排程"?"p-warn":"p-info";}
  var reqRows="";
  for(var i=0;i<reqs.length;i++){var r=reqs[i];
    reqRows+='<div class="tk"><div class="tt">'+r.c+' · '+r.type+'</div>'+
    '<div class="mt"><span>'+r.scope+'</span><span class="pill '+stp(r.st)+'">'+r.st+'</span></div>'+
    '<div class="mt"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">event</span><span>'+r.date+'</span></div></div>';
  }
  var marked={20:"現",22:"遠",27:"現"};
  var cal="";
  for(var d=17;d<=30;d++){
    var mk=marked[d];
    cal+='<div style="border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;background:'+(mk?"var(--soft)":"#fff")+';min-width:0">'+
    '<div class="mini">8/'+d+'</div>'+(mk?'<div class="pill p-warn" style="margin-top:5px">'+mk+'</div>':'<div class="mini" style="margin-top:5px;opacity:.4">—</div>')+'</div>';
  }
  app.innerHTML=
  '<div class="screen-head"><div><h2><span class="material-symbols-outlined">calendar_month</span>稽核申請與排程</h2>'+
  '<p>客戶線上提交稽核申請，業務部確認稽核類型與範圍，協調可行日期並發送邀請。</p></div>'+
  '<div class="seg"><span class="s on">本月</span><span class="s">下月</span><span class="s">全部</span></div></div>'+
  '<div class="grid kpi4">'+
  kpi("本月稽核","6","場","up","現場4 遠端2","event_available")+
  kpi("待排程","2","筆","dn","待客戶回覆","pending_actions")+
  kpi("平均準備天數","4.2","天","up","較上季 -1.8","timer")+
  kpi("排程達成率","95","%","up","準時開場","task_alt")+
  '</div>'+
  '<div class="grid col2b" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>稽核類型分布（近12週）</h3><div id="c1a" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">inbox</span>稽核申請單</h3>'+reqRows+'</div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">date_range</span>8 月稽核日曆</h3>'+
    '<div style="overflow-x:auto"><div class="grid" style="grid-template-columns:repeat(7,minmax(70px,1fr));gap:8px">'+cal+'</div></div>'+
    '<div class="legend"><span><i style="background:var(--accent2)"></i>已排定稽核</span><span>現＝現場稽核　遠＝遠端稽核</span></div></div>';
  void app.offsetHeight;
  mkChart("c1a",{
    color:PAL,tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    legend:{data:["現場","遠端","文件"],bottom:0,textStyle:{fontSize:11}},
    grid:{left:8,right:14,top:20,bottom:36,containLabel:true},
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8","W9","W10","W11","W12"],axisLabel:{fontSize:10}},
    yAxis:{type:"value",name:"場",nameTextStyle:{fontSize:10}},
    series:[
      {name:"現場",type:"bar",stack:"a",data:[2,3,2,4,3,2,3,4,3,2,4,3]},
      {name:"遠端",type:"bar",stack:"a",data:[1,1,2,1,2,2,1,2,2,3,1,2]},
      {name:"文件",type:"bar",stack:"a",data:[1,0,1,1,0,1,1,0,1,1,1,1]}
    ]
  });
}

// ================= SCREEN 2 : 品質文件庫 =================
function screen2(){
  var docs=[
    {n:"ISO 9001:2015 品質證書",cat:"證書",ver:"v3",up:"2026-01-10",sz:"1.2 MB",st:"最新",ic:"workspace_premium"},
    {n:"IATF 16949 汽車品質證書",cat:"證書",ver:"v2",up:"2025-11-04",sz:"1.8 MB",st:"最新",ic:"verified"},

// ---------- screen router ----------
var screens=[screen0,screen1,screen2,screen3,screen4,screen5];
window.show=function(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  (screens[i]||screens[0])();
};

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
