<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Audit Portal 客戶稽核入口</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#9a3412;
  --bad:#b91c1c;
  --info:#0369a1;
  --panel:#fff;
  --soft:#f1f5f9;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  min-width:320px;
  background:
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:40px 40px;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:var(--ink);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 20px rgba(15,23,42,.06);
  backdrop-filter:blur(14px);
}
.topbar-in{
  max-width:1440px;
  min-height:72px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:235px;
}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#fff;
  background:var(--blue);
  border-radius:9px;
  box-shadow:5px 5px 0 #bfdbfe;
}
.logo .material-symbols-outlined{font-size:24px}
.brand-t{min-width:0}
.brand-t b{
  display:block;
  font-size:15px;
  line-height:1.2;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand-t span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}
.nav{
  display:flex;
  justify-content:flex-end;
  gap:4px;
  margin-left:auto;
}
.nav button{
  min-height:44px;
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:12px;
  font-weight:600;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  color:var(--blue);
  background:#eff6ff;
  border-color:#bfdbfe;
  transform:translateY(-1px);
}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 3px 0 #1e40af;
}
.nav button .material-symbols-outlined{font-size:18px}
main{
  width:min(100% - 36px,1392px);
  margin:auto;
  padding:34px 0 64px;
}
.screen-head{
  position:relative;
  min-height:118px;
  margin-bottom:18px;
  padding:24px 28px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  overflow:hidden;
  color:#fff;
  background:linear-gradient(120deg,#172554 0%,#1d4ed8 65%,#2563eb 100%);
  border:1px solid #1d4ed8;
  border-radius:12px;
  box-shadow:0 9px 0 #dbeafe;
}
.screen-head::after{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  right:-55px;
  top:-105px;
  border:38px solid rgba(255,255,255,.11);
  border-radius:50%;
  pointer-events:none;
}
.screen-head>div,.screen-head>.tag,.screen-head>.seg{position:relative;z-index:1}
.screen-head h2{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(20px,2vw,27px);
  line-height:1.25;
  letter-spacing:-.02em;
}
.screen-head h2 .material-symbols-outlined{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#172554;
  background:#fff;
  border-radius:7px;
  font-size:22px;
}
.screen-head p{
  max-width:760px;
  margin:9px 0 0;
  color:#dbeafe;
  font-size:13px;
}
.grid{display:grid;gap:14px}
.kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi3,.col3{grid-template-columns:repeat(3,minmax(0,1fr))}
.col2{grid-template-columns:repeat(2,minmax(0,1fr))}
.col2b{grid-template-columns:minmax(0,1.42fr) minmax(300px,1fr)}
.card{
  min-width:0;
  padding:18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{
  border-color:#bfdbfe;
  box-shadow:0 2px 4px rgba(15,23,42,.05),0 14px 32px rgba(37,99,235,.08);
}
.card h3{
  margin:0 0 15px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#0f172a;
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  color:var(--blue);
  font-size:20px;
}
.kpi{
  position:relative;
  min-height:134px;
  overflow:hidden;
  border-top:3px solid var(--blue);
}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{
  position:absolute;
  right:13px;
  top:14px;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:var(--blue);
  background:#eff6ff;
  border-radius:8px;
  font-size:22px;
}
.kpi .lab{
  max-width:calc(100% - 46px);
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .val{
  margin-top:8px;
  color:#0f172a;
  font-family:"Fira Code",monospace;
  font-size:28px;
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kpi .unit{
  margin-left:4px;
  color:var(--muted);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0;
}
.kpi .sub{
  margin-top:9px;
  display:flex;
  align-items:center;
  gap:3px;
  color:var(--muted);
  font-size:11.5px;
}
.up{color:var(--ok)!important;font-weight:700}
.dn{color:var(--bad)!important;font-weight:700}
.tag{
  min-height:32px;
  padding:6px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#172554!important;
  background:#fff!important;
  border:1px solid rgba(255,255,255,.75);
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.seg{
  padding:4px;
  display:flex;
  gap:3px;
  flex-wrap:wrap;
  background:rgba(15,23,42,.18);
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
}
.seg .s{
  padding:6px 11px;
  color:#e2e8f0;
  border-radius:5px;
  font-size:12px;
  font-weight:600;
}
.seg .s.on{
  color:#172554;
  background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.15);
}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
}
th,td{
  padding:11px 12px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid var(--line);
}
th{
  color:#334155;
  background:#f1f5f9;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#eff6ff}
tbody tr:last-child td{border-bottom:0}
td:nth-child(2),td:nth-child(6){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
.pill{
  min-height:25px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.pill::before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 auto;
  background:currentColor;
  border-radius:50%;
}
.p-ok{color:#166534;background:#f0fdf4}
.p-warn{color:#9a3412;background:#fff7ed}
.p-bad{color:#b91c1c;background:#fef2f2}
.p-info{color:#075985;background:#f0f9ff}
.p-mut{color:#475569;background:#f1f5f9}
.chart{width:100%;height:300px;overflow:hidden}
.chart.sm{height:240px}
.barrow{min-width:0}
.barrow .t{
  margin-bottom:6px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
}
.barrow .track{
  height:8px;
  overflow:hidden;
  background:#e2e8f0;
  border-radius:2px;
}
.barrow .fill{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--color-secondary));
  border-radius:2px;
}
.board{
  min-width:800px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.lane{
  min-width:0;
  padding:12px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-top:3px solid var(--blue);
  border-radius:8px;
}
.lane h4{
  margin:0 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:#0f172a;
  font-size:12px;
}
.cnt{
  min-width:23px;
  padding:2px 7px;
  text-align:center;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  box-shadow:0 2px 5px rgba(15,23,42,.04);
  transition:border-color .2s ease,transform .2s ease;
}
.tk:hover{border-color:#93c5fd;transform:translateY(-2px)}
.tk:last-child{margin-bottom:0}
.tk .tt{color:#0f172a;font-size:12px;font-weight:700}
.tk .mt{
  margin-top:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:10.5px;
}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  left:7px;
  top:5px;
  bottom:7px;
  width:2px;
  background:#bfdbfe;
}
.tlit{position:relative;margin-bottom:18px}
.tlit::before{
  content:"";
  position:absolute;
  left:-23px;
  top:4px;
  width:10px;
  height:10px;
  background:#fff;
  border:3px solid var(--blue);
  border-radius:50%;
}
.tlit .th{color:#0f172a;font-size:12.5px;font-weight:700}
.tlit .td{margin-top:3px;color:var(--muted);font-size:11.5px}
.tlit .tm{
  margin-top:3px;
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:600;
}
.doc{
  min-width:0;
  min-height:62px;
  margin-bottom:8px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}
.doc:hover{background:#eff6ff;border-color:#93c5fd;transform:translateX(3px)}
.doc .di{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:var(--blue);
  background:#dbeafe;
  border-radius:7px;
}
.doc .di .material-symbols-outlined{font-size:21px}
.doc .dinfo{min-width:0;flex:1}
.doc .dinfo b{
  display:block;
  overflow:hidden;
  color:#0f172a;
  font-size:12.5px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.doc .dinfo span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.chk{
  margin-bottom:8px;
  padding:11px 12px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid #93c5fd;
  border-radius:7px;
}
.chk .ch{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:9px;
}
.chk .ch b{font-size:12px}
.chk .cd{margin-top:5px;color:var(--muted);font-size:11px}
.avatar{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#fff;
  background:#1d4ed8;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}
.list-row{
  min-width:0;
  padding:11px 0;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:0}
.lr-t{min-width:0;flex:1}
.lr-t b{display:block;font-size:12.5px}
.lr-t span{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.status-icon{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#fff;
  background:var(--blue);
  border-radius:5px;
}
.status-icon .material-symbols-outlined{font-size:15px}
.mini{color:var(--muted);font-size:10.5px}
.legend{
  margin-top:10px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px;
}
.legend i{
  width:10px;
  height:10px;
  display:inline-block;
  margin-right:5px;
  vertical-align:middle;
  border:1px solid currentColor;
  border-radius:2px;
}
.footnote{
  margin-top:28px;
  padding-top:18px;
  color:var(--muted);
  border-top:1px solid var(--line);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
}
.grid-item{animation:gridIn .4s both cubic-bezier(.2,.9,.3,1.25)}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes gridIn{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .topbar-in{align-items:flex-start;flex-direction:column;gap:8px}
  .nav{width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:3px}
  .nav button{flex:0 0 auto}
  .col2b{grid-template-columns:1.15fr .85fr}
}
@media(max-width:820px){
  main{width:min(100% - 24px,1392px);padding-top:20px}
  .topbar-in{padding:9px 12px}
  .kpi4,.kpi3,.col2,.col2b,.col3{grid-template-columns:1fr 1fr}
  .screen-head{min-height:145px;align-items:flex-start;flex-direction:column}
}
@media(max-width:560px){
  .brand{min-width:0}
  .brand-t span{font-size:10px}
  .nav button{min-width:44px;justify-content:center;padding:9px}
  .nav .lbl{display:none}
  .kpi4,.kpi3,.col2,.col2b,.col3{grid-template-columns:1fr}
  .screen-head{padding:20px;border-radius:9px}
  .screen-head h2{font-size:20px}
  .screen-head p{font-size:12px}
  .card{padding:15px}
  .kpi{min-height:122px}
  .chart{height:270px}
  .chart.sm{height:225px}
  .doc{align-items:flex-start;flex-wrap:wrap}
  .doc .dinfo{width:calc(100% - 50px);flex:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0s!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .grid-item,.card,.tk,.doc,.nav button{transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">verified_user</span></div>
      <div class="brand-t">
        <b>Customer Audit Portal</b>
        <span>客戶稽核入口 / 線上稽核系統</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能">
      <button type="button" data-i="0" onclick="go(0)"><span class="material-symbols-outlined" aria-hidden="true">groups</span><span class="lbl">帳號權限</span></button>
      <button type="button" data-i="1" onclick="go(1)"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span><span class="lbl">申請排程</span></button>
      <button type="button" data-i="2" onclick="go(2)"><span class="material-symbols-outlined" aria-hidden="true">description</span><span class="lbl">文件庫</span></button>
      <button type="button" data-i="3" onclick="go(3)"><span class="material-symbols-outlined" aria-hidden="true">fact_check</span><span class="lbl">稽核執行</span></button>
      <button type="button" data-i="4" onclick="go(4)"><span class="material-symbols-outlined" aria-hidden="true">rule</span><span class="lbl">缺失追蹤</span></button>
      <button type="button" data-i="5" onclick="go(5)"><span class="material-symbols-outlined" aria-hidden="true">verified</span><span class="lbl">結案留存</span></button>
    </nav>
  </div>
</header>
<main>
  <div id="app"></div>
  <div class="footnote">Customer Audit Portal · 純前端展示 Demo · 資料為模擬數據</div>
</main>
<script>
(function(){
"use strict";
var app=document.getElementById("app"),charts=[];
var PAL=["#2563eb","#3b82f6","#ea580c","#15803d","#0369a1","#dc2626"];
var AX="#475569",GRID="#e2e8f0";
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function chartBase(){
  return{
    textStyle:{fontFamily:"Fira Sans,Noto Sans TC,sans-serif",color:AX},
    animationDuration:400,
    animationEasing:"cubicOut"
  };
}
function grid(){return{left:8,right:14,top:24,bottom:8,containLabel:true}}
function icon(n){return'<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function pill(text,cls){return'<span class="pill '+cls+'">'+text+'</span>'}
function kpi(lab,val,unit,dir,sub,ic){
  var arrow=dir==="up"?"arrow_upward":dir==="dn"?"arrow_downward":"";
  return'<div class="card kpi grid-item">'+icon(ic)+'<div class="lab">'+lab+'</div>'+
  '<div class="val">'+val+'<span class="unit">'+unit+'</span></div>'+
  '<div class="sub '+(dir==="up"?"up":dir==="dn"?"dn":"")+'">'+
  (arrow?icon(arrow):icon("horizontal_rule"))+sub+'</div></div>';
}
function head(ic,title,desc,tail){
  return'<div class="screen-head grid-item"><div><h2>'+icon(ic)+title+'</h2><p>'+desc+
  '</p></div>'+(tail||"")+'</div>';
}
function cardTitle(ic,title){return'<h3>'+icon(ic)+title+'</h3>'}
function statusClass(s){
  if(["啟用","已確認","最新","符合","已結","已關閉"].indexOf(s)>-1)return"p-ok";
  if(["缺失","已停用","逾期"].indexOf(s)>-1)return"p-bad";
  if(["待審核","待排程","待更新","觀察"].indexOf(s)>-1)return"p-warn";
  return"p-info";
}
function innerCard(content){
  return'<div class="card" style="margin-top:12px;padding:12px;background:var(--soft);box-shadow:none">'+content+'</div>';
}
function permRow(t,d,ic){
  return'<div class="list-row"><span class="status-icon">'+icon(ic)+'</span><div class="lr-t"><b>'+t+
  '</b><span>'+d+'</span></div>'+icon("chevron_right")+'</div>';
}
function logRow(t,tm,cls){
  return'<div style="padding:6px 0;display:flex;justify-content:space-between;gap:8px;font-size:11.5px"><span>'+t+'</span>'+pill(tm,cls)+'</div>';
}

      yAxis:[{type:"value",name:"滿意度",min:3,max:5,axisLabel:{color:AX},splitLine:{lineStyle:{color:GRID}}},
      {type:"value",name:"天",axisLabel:{color:AX},splitLine:{show:false}}],
      series:[{name:"客戶滿意度",type:"line",smooth:true,data:[4,4.1,4.3,4.4,4.5,4.6],symbol:"circle",symbolSize:7,areaStyle:{opacity:.1}},
      {name:"準備天數",type:"bar",yAxisIndex:1,data:[6,5.4,5,4.6,4.4,4.2],barWidth:"34%",itemStyle:{borderRadius:[3,3,0,0]}}]});
    mkChart("c5a",a);
    var b=chartBase();
    Object.assign(b,{color:["#2563eb"],tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},grid:grid(),
      xAxis:{type:"category",data:["1★","2★","3★","4★","5★"],axisLabel:{color:AX},axisLine:{lineStyle:{color:GRID}}},
      yAxis:{type:"value",name:"客戶數",axisLabel:{color:AX},splitLine:{lineStyle:{color:GRID}}},
      series:[{type:"bar",data:[0,1,3,14,24],barWidth:"50%",itemStyle:{borderRadius:[3,3,0,0]},
      label:{show:true,position:"top",color:"#1e293b",fontFamily:"Fira Code",fontSize:11}}]});

  });
}
var screens=[screen0,screen1,screen2,screen3,screen4,screen5];
window.show=function(i){
  i=Math.max(0,Math.min(5,+i||0));
  disposeCharts();
  document.querySelectorAll("[data-i]").forEach(function(btn){
    var active=+btn.getAttribute("data-i")===i;
    btn.classList.toggle("on",active);
    btn.setAttribute("aria-current",active?"page":"false");
  });
  screens[i]();
};
window.go=function(i){
  var hash="#go="+i;
  if(location.hash===hash)window.show(i);
  else location.hash=hash;
};
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  window.show(m?Math.min(+m[1],5):0);
  try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})},{passive:true});
fromHash();
})();
</script>
