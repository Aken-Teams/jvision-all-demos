<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HRIS 人事異動作業平台 · Human Resource Information System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --bg:var(--color-background);
  --card:var(--color-card);
  --mut:var(--color-muted-foreground);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --cy:#0F766E;
  --vio:var(--color-primary);
  --vio2:var(--color-secondary);
  --vio-d:#115E59;
  --radius:10px;
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--color-background);color:var(--color-foreground);font-family:"Crimson Pro","Noto Sans TC",serif;font-size:16px;line-height:1.45;text-rendering:optimizeLegibility}
button,input{font:inherit}
button,[role="button"],.kc{cursor:pointer}
button:focus-visible,input:focus-visible,.kc:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-family:"Material Symbols Outlined"}
.wrap{display:flex;min-width:0;min-height:100vh;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#FFFFFF;border-bottom:2px solid var(--color-primary)}
.tbar{display:flex;align-items:center;gap:18px;min-height:72px;padding:12px clamp(14px,3vw,34px);border-bottom:1px solid var(--color-border)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;width:42px;height:42px;flex:none;place-items:center;background:var(--color-primary);border:2px solid #115E59;border-radius:8px;color:var(--color-on-primary);font-family:"Cinzel","Noto Sans TC",serif;font-size:21px;font-weight:600}
.brand b{display:block;color:#0F3D3A;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-size:19px;font-weight:700;line-height:1.1;letter-spacing:.01em}
.brand span{display:block;margin-top:3px;color:var(--color-muted-foreground);font-family:"Cinzel",serif;font-size:9px;font-weight:600;letter-spacing:.16em}
.tbar .r{display:flex;align-items:center;gap:10px;min-width:0;margin-left:auto}
.search{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 11px;background:var(--color-muted);border:1px solid #94A3B8;border-radius:8px;color:var(--color-foreground);transition:border-color 180ms ease,background-color 180ms ease}
.search:focus-within{background:#FFFFFF;border-color:var(--color-primary);outline:3px solid rgba(13,148,136,.2)}
.search input{width:150px;min-width:0;padding:1px 0;background:transparent;border:0;outline:0;color:#0F172A;font-size:14px}
.search input::placeholder{color:#64748B;opacity:1}
.who{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;background:#FFFFFF;border:1px solid var(--color-border);border-radius:8px;white-space:nowrap}
.who .av{display:grid;width:30px;height:30px;place-items:center;background:#CCFBF1;border:1px solid var(--color-primary);border-radius:6px;color:#115E59;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-weight:700}
.who small{color:#334155;font-size:12px;line-height:1.25}
.nav{display:flex;gap:2px;padding:0 clamp(10px,2vw,26px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.nav button{display:flex;min-height:46px;flex:none;align-items:center;gap:8px;padding:9px 14px;background:transparent;border:0;border-bottom:3px solid transparent;color:#475569;font-family:"Crimson Pro","Noto Sans TC",serif;font-size:15px;font-weight:600;white-space:nowrap;transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease}
.nav button:hover{background:#CCFBF1;color:#115E59}
.nav button.on{background:#F0FDFA;border-bottom-color:var(--color-accent);color:#0F5F58}
.nav button.on .material-symbols-outlined{color:var(--color-accent)}
.main{width:100%;max-width:1600px;margin:0 auto;padding:clamp(20px,3vw,34px) clamp(14px,3vw,34px) 44px;min-width:0}
h1.pt{margin:0;color:#0F3D3A;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-size:clamp(28px,3vw,38px);font-weight:700;line-height:1.1;letter-spacing:-.015em}
p.ps{max-width:760px;margin:5px 0 20px;color:var(--color-muted-foreground);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{position:relative;overflow:hidden;padding:16px;background:var(--color-card);border:1px solid var(--color-border);border-top:4px solid var(--color-primary);border-radius:var(--radius);transition:background-color 180ms ease,border-color 180ms ease,transform 180ms ease}
.kpi:hover{background:#F8FFFE;border-color:var(--color-primary);transform:translateY(-2px)}
.kpi::after{position:absolute;right:12px;bottom:10px;width:24px;height:4px;background:var(--color-secondary);content:""}
.kpi .l{display:flex;align-items:center;gap:7px;color:#475569;font-size:13px;font-weight:600}
.kpi .l .material-symbols-outlined{color:#0F766E;font-size:18px}
.kpi .v{margin-top:6px;color:#0F3D3A;font-family:"Crimson Pro",serif;font-size:31px;font-variant-numeric:tabular-nums lining-nums;font-weight:600;line-height:1}
.kpi .d{margin-top:7px;color:#475569;font-size:12px;font-weight:600}
.up{color:#166534!important}.dn{color:#B91C1C!important}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.g11{grid-template-columns:minmax(0,1.15fr) minmax(300px,1fr)}
.card{min-width:0;padding:18px;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;color:#0F3D3A;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-size:18px;font-weight:700;line-height:1.25;flex-wrap:wrap}
.card h3::after{width:32px;height:2px;background:var(--color-accent);content:""}
.card h3 .material-symbols-outlined{color:#0F766E}
.card h3 .sp{margin-left:auto;color:var(--color-muted-foreground);font-family:"Crimson Pro","Noto Sans TC",serif;font-size:12px;font-weight:400}
.card h3 .sp+::after{display:none}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:600;line-height:1.2;white-space:nowrap}
.t-a{background:#F0FDFA;color:#0F766E}.t-b{background:#ECFEFF;color:#155E75}.t-c{background:#FFFBEB;color:#92400E}.t-d{background:#F0FDF4;color:#166534}
.t-hi{background:#FEF2F2;color:#991B1B}.t-mid{background:#FFFBEB;color:#92400E}.t-lo{background:#F0FDF4;color:#166534}
.scroll{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid #B8E9E2;border-radius:8px}
table.data{width:100%;border-collapse:collapse;color:#1E293B;font-size:14px}
table.data th,table.data td{height:44px;padding:9px 11px;border-bottom:1px solid #C7EDE8;text-align:left;white-space:nowrap}
table.data th{background:#E6FAF7;color:#334155;font-size:12px;font-weight:600;letter-spacing:.03em}
table.data tbody tr{transition:background-color 160ms ease}
table.data tbody tr:hover{background:#F0FDFA}
table.data tbody tr:last-child td{border-bottom:0}
table.data td:first-child,table.data td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
table.data td:last-child{text-align:right}
table.data td b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600}
.av-s{display:inline-grid;width:25px;height:25px;margin-right:7px;place-items:center;border:1px solid rgba(0,0,0,.22);border-radius:6px;color:#FFFFFF;font-family:"Crimson Pro","Noto Sans TC",serif;font-size:12px;font-weight:700;vertical-align:middle}
.chart{height:270px;overflow:hidden}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;padding-bottom:8px;overflow-x:auto;overscroll-behavior-x:contain}
.col{display:flex;min-width:0;flex-direction:column;gap:10px;padding:12px;background:#EAF8F6;border:1px solid #9ADFD5;border-radius:8px}
.col-h{display:flex;align-items:center;gap:8px;color:#0F3D3A;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-size:16px;font-weight:700}
.col-h .cnt{margin-left:auto;padding:2px 8px;background:#FFFFFF;border:1px solid #5EEAD4;border-radius:999px;color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600}
.col-h .dt{width:9px;height:9px;flex:none;border:1px solid #334155;border-radius:2px}
.kc{padding:12px;background:#FFFFFF;border:1px solid #8BD8CE;border-left:4px solid var(--color-primary);border-radius:7px;transition:background-color 180ms ease,border-color 180ms ease,transform 180ms ease}
.kc:hover{background:#F7FFFD;border-color:#0D9488;transform:translateY(-2px)}
.kc .id{display:flex;align-items:center;gap:5px;color:#0F766E;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.kc .ti{margin:6px 0 8px;color:#1E293B;font-size:14px;font-weight:600;line-height:1.45}
.kc .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .foot{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px dashed #94D8CF;color:#475569;font-size:12px}
.kc .foot .av{display:grid;width:23px;height:23px;place-items:center;border:1px solid rgba(0,0,0,.22);border-radius:5px;color:#FFFFFF;font-weight:700}
.mini{display:flex;align-items:center;gap:4px;color:#475569;font-size:11px}
.mini .material-symbols-outlined{font-size:15px}
.org{display:flex;flex-direction:column;gap:8px}
.on{display:flex;align-items:center;gap:11px;padding:11px 13px;background:#FFFFFF;border:1px solid #9ADFD5;border-radius:8px;transition:background-color 180ms ease,border-color 180ms ease}
.on:hover{background:#F0FDFA;border-color:#0D9488}
.on .ic{display:grid;width:36px;height:36px;flex:none;place-items:center;border:1px solid rgba(0,0,0,.22);border-radius:6px;color:#FFFFFF}
.on b{color:#1E293B;font-size:14px;font-weight:600}
.on small{display:block;color:#475569;font-size:12px}
.on .rt{flex:none;margin-left:auto;text-align:right}
.on .rt .num{color:#0F3D3A;font-family:"Crimson Pro",serif;font-size:19px;font-variant-numeric:tabular-nums;font-weight:600}
.on .rt .u{color:#475569;font-size:11px}
.i1{margin-left:26px}.i2{margin-left:52px}
.tl{display:flex;flex-direction:column}
.tr{position:relative;display:flex;align-items:flex-start;gap:13px;padding:12px 0}
.tr .dot{width:15px;height:15px;flex:none;margin-top:3px;border:3px solid #FFFFFF;border-radius:3px;outline:2px solid #0F766E}
.tr:not(:last-child)::before{position:absolute;top:23px;bottom:-4px;left:7px;width:1px;background:#5EEAD4;content:""}
.tr .cnt{min-width:0}
.tr .cnt .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr .cnt b{color:#1E293B;font-size:14px;font-weight:600}
.tr .cnt small{display:block;margin-top:4px;color:#475569;font-size:12px;line-height:1.5}
.tr .cnt .dt{color:#0F766E;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-variant-numeric:tabular-nums;font-weight:700}
.ck{display:flex;flex-direction:column;gap:10px}
.ci{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FFFFFF;border:1px solid #9ADFD5;border-radius:8px}
.ci .no{display:grid;width:36px;height:36px;flex:none;place-items:center;border:1px solid rgba(0,0,0,.22);border-radius:6px;color:#FFFFFF}
.ci .mid{min-width:0;flex:1}
.ci .mid b{color:#1E293B;font-size:14px;font-weight:600}
.ci .mid small{display:block;color:#475569;font-size:12px;line-height:1.45}
.sync{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sync>*{min-width:0}
.sc{padding:14px;background:#FFFFFF;border:1px solid #9ADFD5;border-radius:8px}
.sc .hd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sc .hd .ic{display:grid;width:34px;height:34px;flex:none;place-items:center;border:1px solid rgba(0,0,0,.22);border-radius:6px;color:#FFFFFF}
.sc .hd b{color:#1E293B;font-size:14px;font-weight:600}
.sc .prog{height:9px;margin:5px 0 9px;overflow:hidden;background:#DCEBEF;border:1px solid #B2D7D2;border-radius:3px}
.sc .prog i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.sc small{display:block;color:#475569;font-size:12px;line-height:1.55}
.q{display:flex;flex-direction:column;gap:9px}
.qi{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#FFFFFF;border:1px solid #9ADFD5;border-left:4px solid var(--color-primary);border-radius:7px}
.qi .no{display:flex;flex:none;align-items:center;color:#0F766E;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700}
.qi .mid{min-width:0;flex:1}
.qi .mid b{color:#1E293B;font-size:14px;font-weight:600}
.qi .mid small{display:block;color:#475569;font-size:12px;line-height:1.45}
.banner{display:flex;align-items:center;gap:13px;margin-bottom:16px;padding:15px;background:#FFFBEB;border:1px solid #D97706;border-left:6px solid #D97706;border-radius:8px;flex-wrap:wrap}
.banner .ic{display:grid;width:40px;height:40px;flex:none;place-items:center;background:var(--color-accent);border:1px solid #92400E;border-radius:6px;color:var(--color-on-accent)}
.banner .tx{min-width:180px;flex:1}
.banner b{color:#78350F;font-size:14px;font-weight:600}
.banner p{margin:3px 0 0;color:#4B3A1E;font-size:13px;line-height:1.55}
.btn{min-height:44px;padding:9px 16px;border:1px solid transparent;border-radius:7px;font-size:14px;font-weight:600;transition:background-color 180ms ease,border-color 180ms ease,color 180ms ease,transform 180ms ease}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--color-accent);border-color:#92400E;color:var(--color-on-accent)}
.btn.pri:hover{background:#B45309;color:#FFFFFF}
.btn.gho{background:#FFFFFF;border-color:#0D9488;color:#0F5F58}
.btn.gho:hover{background:#CCFBF1}
.btnrow{display:flex;justify-content:flex-end;gap:10px;margin-top:13px;flex-wrap:wrap}
#app>.kpis,#app>.grid,#app>.card,#app>.banner{animation:reveal 380ms cubic-bezier(.2,.8,.2,1) both}
#app>.grid,#app>.card{animation-delay:60ms}
.kpis .kpi,.sync .sc,.board .col{animation:stagger-in 400ms cubic-bezier(.18,.89,.32,1.18) both}
.kpis .kpi:nth-child(2),.sync .sc:nth-child(2),.board .col:nth-child(2){animation-delay:60ms}
.kpis .kpi:nth-child(3),.sync .sc:nth-child(3),.board .col:nth-child(3){animation-delay:120ms}
.kpis .kpi:nth-child(4),.sync .sc:nth-child(4),.board .col:nth-child(4){animation-delay:180ms}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes stagger-in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){.g2,.g11{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.chart{height:250px}}
@media(max-width:768px){.tbar{min-height:64px}.brand span{display:none}.nav{padding-inline:8px}.nav button{padding-inline:11px}.main{padding-top:20px}.card{padding:15px}.i2{margin-left:38px}}
@media(max-width:560px){.tbar{gap:10px;padding:10px 12px}.logo{width:38px;height:38px}.brand b{font-size:16px}.search{display:none}.who{padding-right:5px}.who small{display:none}.nav button{min-width:46px;justify-content:center}.nav button .t{display:none}.main{padding:18px 12px 30px}.kpis{grid-template-columns:1fr;gap:10px}.kpi{padding:14px}.card{padding:14px}.card h3 .sp{width:100%;margin-left:28px}.board{grid-auto-columns:minmax(252px,86vw)}.on{padding:10px}.i1{margin-left:14px}.i2{margin-left:28px}.ci{align-items:flex-start;flex-wrap:wrap}.ci .tag{margin-left:48px}.btnrow .btn,.banner .btn{width:100%}.chart{height:235px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.kpi:hover,.kc:hover,.btn:hover{transform:none}}
@media(forced-colors:active){.tag,.btn,.kc,.card,.kpi,.on,.ci,.qi,.sc{border:1px solid CanvasText}.nav button.on{border-bottom:4px solid Highlight}.col-h .dt,.tr .dot{forced-color-adjust:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="tbar">
      <div class="brand"><div class="logo">人</div><div><b>HRIS 人事異動作業平台</b><span>HUMAN RESOURCE INFORMATION SYSTEM</span></div></div>
      <div class="r">
        <div class="search"><span class="material-symbols-outlined">search</span><input placeholder="搜尋 員編 / 姓名 / 案號"/></div>
        <div class="who"><span class="av">陳</span><small>陳靜宜<br/>人資部</small></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
  <main class="main">
    <h1 class="pt" id="pt"></h1>
    <p class="ps" id="ps"></p>
    <div id="app"></div>
  </main>
</div>
<script>
var NAV=[
 ["員工主檔","groups","員工主檔","員工基本資料、到職建檔與在職狀態總覽"],
 ["組織架構","account_tree","組織架構","部門職位對應、編制與各單位人力配置"],
 ["異動簽核","task_alt","異動簽核","調職、升遷、離職異動簽核看板與流轉"],
 ["異動履歷","history","異動履歷","人事異動軌跡時間軸與異動類型分析"],
 ["HR覆核","fact_check","HR覆核","資料正確率、文件齊備度與決策規則檢核"],
 ["系統同步","insights","系統同步","主檔同步至薪資、考勤排班與 ESS 狀態"]
];
var nav=document.getElementById('nav');
NAV.forEach(function(n,i){var b=document.createElement('button');b.className=i===0?'on':'';b.setAttribute('data-i',i);b.innerHTML='<span class="material-symbols-outlined">'+n[1]+'</span><span class="t">'+n[0]+'</span>';b.onclick=function(){show(i);try{history.replaceState(null,'','#v'+i);}catch(e){}};nav.appendChild(b);});

var AVC=["#6d28d9","#0891b2","#7c3aed","#db2777","#0ea5e9","#059669","#d97706","#6366f1"];
function avc(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%AVC.length;return AVC[h];}

var app=document.getElementById('app');
var _charts={};
function dispose(){Object.keys(_charts).forEach(function(k){try{_charts[k].dispose();}catch(e){}});_charts={};}

function kc(icon,l,v,d,cls){
  return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+icon+'</span>'+l+'</div><div class="v">'+v+'</div><div class="d '+cls+'">'+d+'</div></div>';
}

function show(i){
  dispose();
  document.querySelectorAll('.nav button').forEach(function(b,j){b.classList.toggle('on',i===j);});
  document.getElementById('pt').textContent=NAV[i][2];
  document.getElementById('ps').textContent=NAV[i][3];
  app.innerHTML=SCREENS[i]();
  void app.offsetHeight;
  if(i===0)chartHead();
  if(i===1)chartOrg();
