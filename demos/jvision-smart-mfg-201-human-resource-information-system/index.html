<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HRIS 人事異動作業平台 · Human Resource Information System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#1e1b2e;--vio:#6d28d9;--vio2:#8b5cf6;--vio-d:#4c1d95;--bg:#f4f2fb;--card:#fff;--line:#e7e3f4;--mut:#6b6580;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--cy:#0891b2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.wrap{min-height:100vh;display:flex;flex-direction:column;min-width:0}
.top{background:linear-gradient(120deg,var(--vio-d),var(--vio));color:#fff;position:sticky;top:0;z-index:20}
.tbar{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900;flex:none;font-family:"Noto Sans TC";box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.brand b{font-size:16px;font-weight:900;display:block;font-family:"Noto Sans TC";color:#fff;line-height:1.2}
.brand span{font-size:10px;color:#ddd6fe;letter-spacing:2px}
.tbar .r{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.search{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:7px;color:#ede9fe;font-size:12.5px;min-width:0}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:12.5px;width:120px;min-width:0;color:#fff}
.search input::placeholder{color:#ddd6fe}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 12px 5px 6px;white-space:nowrap}
.who .av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--vio);display:grid;place-items:center;font-weight:900;font-size:13px;font-family:"Noto Sans TC"}
.who small{font-size:11px;color:#ede9fe;line-height:1.2}
.nav{display:flex;gap:4px;padding:0 14px 10px;overflow-x:auto;flex-wrap:wrap}
.nav button{border:0;background:transparent;color:#ddd6fe;font:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.on{background:var(--bg);color:var(--vio);box-shadow:0 -2px 0 var(--vio2) inset}
.main{padding:20px 22px 36px;min-width:0}
h1.pt{margin:0 0 3px;font-size:19px;font-family:"Noto Sans TC";font-weight:900}
p.ps{margin:0 0 16px;color:var(--mut);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(109,40,217,.12),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--vio)}
.kpi .v{font-size:26px;font-weight:800;margin-top:5px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr 1fr}
.g11{grid-template-columns:1.15fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--vio)}
.card h3 .sp{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-a{background:#ede9fe;color:#6d28d9}.t-b{background:#cffafe;color:#0e7490}.t-c{background:#fef3c7;color:#b45309}.t-d{background:#dcfce7;color:#15803d}
.t-hi{background:#fee2e2;color:#b91c1c}.t-mid{background:#fef3c7;color:#b45309}.t-lo{background:#dcfce7;color:#15803d}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf9fe}
table.data td b{font-family:"Noto Sans TC"}
.av-s{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;font-family:"Noto Sans TC";vertical-align:middle;margin-right:6px}
.chart{height:270px;overflow:hidden}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:#f7f5fd;border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:800;font-size:13.5px}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--mut);font-weight:700}
.col-h .dt{width:9px;height:9px;border-radius:50%;flex:none}
.kc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s;border-left:4px solid var(--vio)}
.kc:hover{box-shadow:0 6px 18px rgba(109,40,217,.14);transform:translateY(-2px)}
.kc .id{font-size:11px;font-weight:800;color:var(--vio);font-family:Inter;display:flex;align-items:center;gap:6px}
.kc .ti{font-size:13px;font-family:"Noto Sans TC";font-weight:700;margin:5px 0 7px;line-height:1.4}
.kc .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .foot{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11px;color:var(--mut)}
.kc .foot .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;font-family:"Noto Sans TC"}
.mini{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mut)}
.mini .material-symbols-outlined{font-size:14px}
.org{display:flex;flex-direction:column;gap:8px}
.on{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.on .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.on b{font-size:13.5px;font-family:"Noto Sans TC"}
.on small{color:var(--mut);font-size:11.5px;display:block}
.on .rt{margin-left:auto;text-align:right;flex:none}
.on .rt .num{font-size:16px;font-weight:800;font-family:Inter}
.on .rt .u{font-size:10.5px;color:var(--mut)}
.i1{margin-left:26px}.i2{margin-left:52px}
.tl{display:flex;flex-direction:column;gap:0}
.tr{display:flex;align-items:flex-start;gap:13px;padding:12px 0;position:relative}
.tr .dot{width:15px;height:15px;border-radius:50%;flex:none;margin-top:2px;box-shadow:0 0 0 4px #ede9fe}
.tr:not(:last-child)::before{content:"";position:absolute;left:7px;top:21px;bottom:-5px;width:2px;background:var(--line)}
.tr .cnt{min-width:0}
.tr .cnt .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr .cnt b{font-size:13px;font-family:"Noto Sans TC"}
.tr .cnt small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
.tr .cnt .dt{font-size:11px;color:var(--vio);font-weight:700;font-family:Inter}
.ck{display:flex;flex-direction:column;gap:10px}
.ci{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ci .no{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.ci .mid{flex:1;min-width:0}
.ci .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ci .mid small{color:var(--mut);font-size:11.5px;display:block}
.sync{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.sync>*{min-width:0}
.sc{border:1px solid var(--line);border-radius:14px;padding:14px}
.sc .hd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sc .hd .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.sc .hd b{font-family:"Noto Sans TC";font-size:13.5px}
.sc .prog{height:8px;background:#eef0f8;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.sc .prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--vio),var(--vio2))}
.sc small{color:var(--mut);font-size:11.5px;display:block;line-height:1.7}
.q{display:flex;flex-direction:column;gap:9px}
.qi{border:1px solid var(--line);border-left:4px solid var(--vio2);border-radius:11px;padding:11px 13px;display:flex;align-items:center;gap:12px}
.qi .no{font-weight:800;font-size:12.5px;font-family:Inter;color:var(--vio);flex:none;display:flex;align-items:center}
.qi .mid{flex:1;min-width:0}
.qi .mid b{font-size:13px;font-family:"Noto Sans TC"}
.qi .mid small{color:var(--mut);font-size:11.5px;display:block}
.banner{border:1px dashed #c4b5fd;background:linear-gradient(135deg,#f5f3ff,#faf5ff);border-radius:14px;padding:14px;display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.banner .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff;display:grid;place-items:center;flex:none}
.banner .tx{flex:1;min-width:180px}
.banner b{font-family:"Noto Sans TC";font-size:13.5px}
.banner p{margin:3px 0 0;font-size:12.5px;color:#4b4560;line-height:1.6}
.btn{border:0;padding:10px 16px;border-radius:11px;font:inherit;font-weight:800;font-size:13px;font-family:"Noto Sans TC";cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff}
.btn.gho{background:#efeafb;color:var(--vio)}
.btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
@media(max-width:860px){.g2,.g11{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.main{padding:16px 14px 30px}.search{display:none}.kpis{grid-template-columns:1fr 1fr}.nav button .t{display:none}.who small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="tbar">
      <div class="brand"><div class="logo">人</div><div><b>HRIS 人事異動作業平台</b><span>HUMAN RESOURCE INFORMATION SYSTEM</span></div></div>
      <div class="r">
        <div class="search"><span class="material-symbols-outlined">search</span><input placeholder="搜尋 員編 / 姓名 / 案號"/></div>
        <div class="who"><span class="av">陳</span><small>陳靜宜<br/>人資部</small></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
  <main class="main">
    <h1 class="pt" id="pt"></h1>
    <p class="ps" id="ps"></p>
    <div id="app"></div>
  </main>
</div>
<script>
var NAV=[
 ["員工主檔","groups","員工主檔","員工基本資料、到職建檔與在職狀態總覽"],
 ["組織架構","account_tree","組織架構","部門職位對應、編制與各單位人力配置"],
 ["異動簽核","task_alt","異動簽核","調職、升遷、離職異動簽核看板與流轉"],
 ["異動履歷","history","異動履歷","人事異動軌跡時間軸與異動類型分析"],
 ["HR覆核","fact_check","HR覆核","資料正確率、文件齊備度與決策規則檢核"],
 ["系統同步","insights","系統同步","主檔同步至薪資、考勤排班與 ESS 狀態"]
];
var nav=document.getElementById('nav');
NAV.forEach(function(n,i){var b=document.createElement('button');b.className=i===0?'on':'';b.setAttribute('data-i',i);b.innerHTML='<span class="material-symbols-outlined">'+n[1]+'</span><span class="t">'+n[0]+'</span>';b.onclick=function(){show(i);try{history.replaceState(null,'','#v'+i);}catch(e){}};nav.appendChild(b);});

var AVC=["#6d28d9","#0891b2","#7c3aed","#db2777","#0ea5e9","#059669","#d97706","#6366f1"];
function avc(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%AVC.length;return AVC[h];}

var app=document.getElementById('app');
var _charts={};
function dispose(){Object.keys(_charts).forEach(function(k){try{_charts[k].dispose();}catch(e){}});_charts={};}

function kc(icon,l,v,d,cls){
  return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+icon+'</span>'+l+'</div><div class="v">'+v+'</div><div class="d '+cls+'">'+d+'</div></div>';
}

function show(i){
  dispose();
  document.querySelectorAll('.nav button').forEach(function(b,j){b.classList.toggle('on',i===j);});
  document.getElementById('pt').textContent=NAV[i][2];
  document.getElementById('ps').textContent=NAV[i][3];
  app.innerHTML=SCREENS[i]();
  void app.offsetHeight;
  if(i===0)chartHead();
  if(i===1)chartOrg();
  if(i===3)chartMove();
  if(i===4)chartAcc();
  if(i===5)chartSync();
}

/* ========= v0 員工主檔 ========= */
var EMP=[
 ["A10231","王思妤","製造一課","課長","在職","2019-03-11","t-d"],
 ["A10488","林哲宇","品保部","工程師","在職","2021-07-05","t-d"],
 ["A10702","張淑芬","人資部","專員","在職","2020-11-18","t-d"],
 ["A10913","陳柏翰","製造二課","作業員","試用","2026-07-28","t-c"],
 ["A11045","黃于庭","財會部","會計","在職","2018-02-14","t-d"],
 ["A11288","吳承恩","資訊部","工程師","留職停薪","2017-09-30","t-a"],
 ["A11390","劉冠廷","業務部","副理","在職","2016-05-22","t-d"],
 ["A11502","周雅婷","製造一課","作業員","試用","2026-08-01","t-c"]
];

var SCREENS=[
function(){
  var kpi='<div class="kpis">'
   +kc('groups','在職員工','1,284','▲ 本月到職 18','up')
   +kc('person_add','試用期','36','試用轉正待審 6','')
   +kc('fact_check','資料正確率','98.6%','▲ 2.4%','up')
   +kc('badge','待補件','9','報到文件未齊','dn')
   +'</div>';
  var head='<tr><th>員編</th><th>姓名</th><th>部門</th><th>職稱</th><th>狀態</th><th>到職日</th></tr>';
  var rows='';
  EMP.forEach(function(e){
    rows+='<tr><td><b>'+e[0]+'</b></td><td><span class="av-s" style="background:'+avc(e[1])+'">'+e[1][0]+'</span>'+e[1]+'</td><td>'+e[2]+'</td><td>'+e[3]+'</td><td><span class="tag '+e[6]+'">'+e[4]+'</span></td><td>'+e[5]+'</td></tr>';
  });
  return kpi+'<div class="grid g2">'
   +'<div class="card"><h3><span class="material-symbols-outlined">badge</span>員工主檔清單<span class="sp">共 1,284 筆 · 顯示前 8 筆</span></h3><div class="scroll"><table class="data">'+head+rows+'</table></div></div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>各廠區在職人數<span class="sp">4 廠區</span></h3><div class="chart" id="c_head"></div></div>'
   +'</div>';
},
/* ========= v1 組織架構 ========= */
function(){
  var tree=[
   [0,"精機製造股份有限公司","factory","#6d28d9","總員額 1,284 人",1284,"人"],
   [1,"製造事業處","precision_manufacturing","#7c3aed","4 課 · 生產核心",612,"人"],
   [2,"製造一課","engineering","#0891b2","三班輪值",214,"人"],
   [2,"製造二課","engineering","#0891b2","二班制",198,"人"],
   [1,"品質管理處","fact_check","#db2777","品保 / 品檢",148,"人"],
   [1,"管理本部","account_tree","#059669","人資 / 財會 / 資訊",176,"人"],
   [2,"人力資源部","groups","#d97706","招募 / 訓練 / 薪酬",22,"人"]
  ];
  var org='';
  tree.forEach(function(t){
    org+='<div class="on '+(t[0]===1?'i1':t[0]===2?'i2':'')+'">'
     +'<div class="ic" style="background:'+t[3]+'"><span class="material-symbols-outlined" style="font-size:19px">'+t[2]+'</span></div>'
     +'<div style="min-width:0"><b>'+t[1]+'</b><small>'+t[4]+'</small></div>'
     +'<div class="rt"><div class="num">'+t[5].toLocaleString()+'</div><div class="u">'+t[6]+'</div></div></div>';
  });
  return '<div class="grid g11">'
   +'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>組織編制樹狀圖<span class="sp">4 事業處 · 22 單位</span></h3><div class="org">'+org+'</div></div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各部門編制 vs 實到<span class="sp">缺額淡紫標示</span></h3><div class="chart" id="c_org"></div></div>'
   +'</div>';
},
/* ========= v2 異動簽核 KANBAN ========= */
function(){
  var COLS=[["待處理","#6d28d9"],["主管確認","#0891b2"],["HR覆核","#d97706"],["歸檔完成","#16a34a"]];
  var CARDS=[
   [0,"HR-2026-311","王思妤 調職 製造一課→品保部","調職","王","用人主管","event","生效 09/01","高","schedule"],
   [0,"HR-2026-315","周雅婷 試用轉正","轉正","周","製造一課","how_to_reg","文件齊備","中","schedule"],
   [1,"HR-2026-308","陳柏翰 升遷 作業員→領班","升遷","陳","製造二課","trending_up","加薪 8%","中","hourglass_top"],
   [1,"HR-2026-309","劉冠廷 升遷 副理→經理","升遷","劉","業務部","trending_up","待處長核","高","priority_high"],
   [2,"HR-2026-302","吳承恩 留停復職","復職","吳","資訊部","fact_check","覆核勞保","中","hourglass_top"],
   [2,"HR-2026-304","黃于庭 部門調整","調職","黃","財會部","fact_check","對照職等","低","schedule"],
   [3,"HR-2026-297","林哲宇 加給調整","調薪","林","品保部","check_circle","已同步","低","done_all"],
   [3,"HR-2026-295","張淑芬 離職 09/30","離職","張","人資部","check_circle","結算完成","中","done_all"]
  ];
  var board='';
  COLS.forEach(function(c,ci){
    var cnt=CARDS.filter(function(k){return k[0]===ci;}).length;
    var col='<div class="col"><div class="col-h"><span class="dt" style="background:'+c[1]+'"></span>'+c[0]+'<span class="cnt">'+cnt+'</span></div>';
    CARDS.filter(function(k){return k[0]===ci;}).forEach(function(k){
      var pr=k[8]==='高'?'t-hi':k[8]==='中'?'t-mid':'t-lo';
