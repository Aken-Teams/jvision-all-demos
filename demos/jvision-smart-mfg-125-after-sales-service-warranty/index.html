<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>售後服務/保固管理 After-Sales Service &amp; Warranty｜Jvision Demo</title>
  <meta name="description" content="保固驗證、服務維修工單、客訴處理與 SLA 時效監控的單一售後平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Fira+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#059669;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#0f172a;
      --color-card:#fff;
      --color-card-foreground:#0f172a;
      --color-muted:#f1f5fd;
      --color-muted-foreground:#475569;
      --color-border:#e4ecfc;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#0f172a;
      --muted:#475569;
      --line:#e4ecfc;
      --bg:#f8fafc;
      --card:#fff;
      --ok:#047857;
      --warn:#9a6700;
      --bad:#b91c1c;
      --info:#1d4ed8;
      --radius:10px;
      --shadow:0 1px 2px rgba(15,23,42,.05),0 7px 20px rgba(37,99,235,.045);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:
        linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
        var(--color-background);
      background-size:32px 32px;
      color:var(--ink);
      font-family:"Fira Sans",system-ui,sans-serif;
      font-size:14px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,.chipf{cursor:pointer}
    button:focus-visible,.chipf:focus-visible{
      outline:3px solid rgba(37,99,235,.28);
      outline-offset:3px;
    }
    .msy{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
      font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
    }
    header.topbar{
      position:sticky;
      top:0;
      z-index:30;
      color:var(--ink);
      background:rgba(255,255,255,.95);
      border-bottom:1px solid var(--line);
      box-shadow:0 1px 0 rgba(15,23,42,.02);
      backdrop-filter:blur(14px);
    }
    .topwrap{
      width:min(1440px,100%);
      margin:auto;
      padding:12px clamp(16px,3vw,34px);
      display:flex;
      align-items:center;
      gap:24px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:260px}
    .brand .logo{
      width:40px;
      height:40px;
      flex:none;
      display:grid;
      place-items:center;
      color:#fff;
      background:var(--blue);
      border-radius:9px;
      box-shadow:3px 3px 0 #bfdbfe;
    }
    .brand .logo .msy{font-size:23px}
    .brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
    .brand p{
      margin:1px 0 0;
      color:var(--muted);
      font-family:"Fira Code",monospace;
      font-size:10px;
      letter-spacing:.02em;
      white-space:nowrap;
    }
    nav.tabs{
      min-width:0;
      margin-left:auto;
      display:flex;
      gap:3px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{
      min-height:42px;
      flex:none;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 11px;
      border:1px solid transparent;
      border-radius:8px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
    }
    nav.tabs button .msy{font-size:18px}
    nav.tabs button:hover{background:var(--color-muted);color:var(--blue)}
    nav.tabs button.on{
      color:var(--blue);
      background:#eff6ff;
      border-color:#bfdbfe;
    }
    main{width:min(1440px,100%);margin:auto;padding:30px clamp(16px,3vw,34px) 64px}
    .screen-head{
      position:relative;
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom:22px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
    }
    .screen-head::after{
      content:"";
      position:absolute;
      bottom:-1px;
      left:0;
      width:84px;
      height:2px;
      background:var(--blue);
    }
    .screen-head .ic{
      width:44px;
      height:44px;
      flex:none;
      display:grid;
      place-items:center;
      border:1px solid #bfdbfe;
      border-radius:9px;
      background:#eff6ff;
      color:var(--blue);
    }
    .screen-head .ic .msy{font-size:24px}
    .screen-head h2{margin:0;font-size:clamp(20px,2vw,25px);font-weight:700;letter-spacing:-.025em}
    .screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .grid{display:grid;gap:14px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
    .card,.kpi{
      min-width:0;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .card{padding:18px}
    .card h3{
      margin:0 0 15px;
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--ink);
      font-size:14px;
      font-weight:700;
      letter-spacing:.005em;
    }
    .card h3 .msy{color:var(--blue);font-size:19px}
    .kpi{
      position:relative;
      overflow:hidden;
      padding:16px 17px 15px;
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .kpi:hover{
      transform:translateY(-2px);
      border-color:#bfdbfe;
      box-shadow:0 8px 22px rgba(37,99,235,.09);
    }
    .kpi::before{
      content:"";
      position:absolute;
      top:0;
      right:0;
      width:34px;
      height:3px;
      background:var(--blue);
    }
    .kpi .lab{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }
    .kpi .lab .msy{color:var(--blue);font-size:17px}
    .kpi .val{
      margin-top:7px;
      color:var(--ink);
      font-family:"Fira Code",monospace;
      font-size:26px;
      font-weight:700;
      letter-spacing:-.055em;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;letter-spacing:0}
    .kpi .sub{margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:600}
    .up{color:var(--ok)!important}.down{color:var(--bad)!important}
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      padding:2px 8px;
      border:1px solid currentColor;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }
    .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
    .tag.ok{background:#ecfdf5;color:#047857}
    .tag.warn{background:#fffbeb;color:#8a5a00}
    .tag.bad{background:#fef2f2;color:#b91c1c}
    .tag.info{background:#eff6ff;color:#1d4ed8}
    .tag.mut{background:#f8fafc;color:#475569}
    .scroll{
      max-width:100%;
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:8px;
      -webkit-overflow-scrolling:touch;
    }
    table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
    th{
      padding:10px 12px;
      border-bottom:1px solid #cbd5e1;
      background:var(--color-muted);
      color:#334155;
      text-align:left;
      font-size:11px;
      font-weight:700;
      letter-spacing:.035em;
      white-space:nowrap;
    }
    td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background-color .18s ease}
    tbody tr:hover{background:#f8fbff}
    td:nth-last-child(-n+2){font-variant-numeric:tabular-nums}
    .mono{
      font-family:"Fira Code",monospace!important;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.02em;
    }
    .chart{width:100%;height:290px;overflow:hidden}
    .chart.sm{height:230px}
    .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:13px;font-size:12px}
    .bar-row .nm{width:90px;flex:none;color:#334155;font-weight:600}
    .bar-track{height:8px;flex:1;min-width:0;overflow:hidden;background:#e8eef9;border-radius:2px}
    .bar-fill{height:100%;background:var(--blue);border-radius:2px}
    .bar-row .vv{width:48px;flex:none;text-align:right;font-family:"Fira Code",monospace;font-weight:600}
    .board{display:grid;grid-template-columns:repeat(4,minmax(155px,1fr));gap:10px;min-width:0}
    .col{min-width:0;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:8px}
    .col h4{margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}
    .col h4 .cnt{
      min-width:24px;
      padding:1px 7px;
      border:1px solid #bfdbfe;
      border-radius:999px;
      background:#eff6ff;
      color:var(--blue);
      text-align:center;
      font-family:"Fira Code",monospace;
      font-size:10px;
    }
    .tk{
      margin-bottom:8px;
      padding:10px;
      border:1px solid var(--line);
      border-left:3px solid var(--blue);
      border-radius:7px;
      background:#fff;
      transition:transform .2s ease,border-color .2s ease;
    }
    .tk:hover{transform:translateY(-2px);border-color:#93c5fd}
    .tk:last-child{margin-bottom:0}
    .tk.hi{border-left-color:var(--bad)}
    .tk.med{border-left-color:var(--warn)}
    .tk .tid{color:var(--blue);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:700}
    .tk .tt{margin:3px 0 5px;font-size:12px;font-weight:700}
    .tk .meta{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
    .tl{position:relative;margin:0;padding-left:27px}
    .tl::before{content:"";position:absolute;top:5px;bottom:5px;left:9px;width:1px;background:#cbd5e1}
    .tl li{position:relative;margin-bottom:17px;list-style:none}
    .tl li::before{
      content:"";
      position:absolute;
      top:3px;
      left:-23px;
      width:11px;
      height:11px;
      border:2px solid #fff;
      border-radius:50%;
      background:#64748b;
      box-shadow:0 0 0 2px #cbd5e1;
    }
    .tl li.done::before{background:var(--ok);box-shadow:0 0 0 2px #a7f3d0}
    .tl li.now::before{background:var(--warn);box-shadow:0 0 0 2px #fde68a}
    .tl .tlh{font-size:12.5px;font-weight:700}
    .tl .tlm{margin-top:2px;color:var(--muted);font-size:11px}
    .prog{height:7px;overflow:hidden;background:#e8eef9;border-radius:2px}
    .prog i{display:block;height:100%;background:var(--blue)}
    .list{margin:0;padding:0;list-style:none}
    .list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
    .list li:last-child{border-bottom:0}
    .list .dot{width:8px;height:8px;flex:none;border-radius:50%}
    .avatar{
      width:26px;
      height:26px;
      display:inline-grid;
      place-items:center;
      flex:none;
      border:1px solid #bfdbfe;
      border-radius:7px;
      background:#eff6ff;
      color:var(--blue);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
    }
    .pill{
      display:inline-block;
      padding:2px 7px;
      border:1px solid #d6deeb;
      border-radius:5px;
      background:#f8fafc;
      color:#334155;
      font-size:10.5px;
      font-weight:600;
    }
    .flt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
    .chipf{
      min-height:34px;
      padding:6px 11px;
      border:1px solid var(--line);
      border-radius:7px;
      background:#fff;
      color:#334155;
      font-size:11.5px;
      font-weight:600;
      transition:background-color .2s ease,color .2s ease,border-color .2s ease;
    }
    .chipf:hover{border-color:#93c5fd;color:var(--blue)}
    .chipf.on{border-color:var(--blue);background:var(--blue);color:#fff}
    .stat-mini{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .stat-mini .sm-c{min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--color-muted)}
    .stat-mini .sm-c .v{font-family:"Fira Code",monospace;font-size:19px;font-weight:700}
    .stat-mini .sm-c .l{color:var(--muted);font-size:11px;font-weight:600}
    .grid-item{animation:reveal .4s cubic-bezier(.2,.8,.2,1) both}
    .grid-item:nth-child(2){animation-delay:.06s}
    .grid-item:nth-child(3){animation-delay:.12s}
    .grid-item:nth-child(4){animation-delay:.18s}
    @keyframes reveal{
      from{opacity:0;transform:translateY(12px) scale(.97)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1100px){
      .topwrap{align-items:flex-start;flex-direction:column;gap:9px}
      nav.tabs{width:100%;margin-left:0}
      .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:820px){
      main{padding-top:22px}
      .g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}
      .board{grid-template-columns:repeat(2,minmax(190px,1fr))}
      .card{padding:15px}
    }
    @media(max-width:560px){
      body{background-size:24px 24px}
      .topwrap{padding:10px 14px}
      .brand{min-width:0}
      .brand p{display:none}
      nav.tabs button{min-width:42px;justify-content:center;padding:8px 10px}
      nav.tabs button .txt{display:none}
      main{padding:18px 14px 48px}
      .screen-head{margin-bottom:16px;padding-bottom:14px}
      .screen-head .ic{width:40px;height:40px}
      .screen-head p{font-size:12px}
      .g-kpi{grid-template-columns:1fr}
      .board{grid-template-columns:1fr}
      .kpi .val{font-size:24px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .grid-item,.kpi,.tk{transform:none!important}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topwrap">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="msy">verified</span></div>
        <div>
          <h1>售後服務・保固管理</h1>
          <p>After-Sales Service &amp; Warranty Platform</p>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="售後服務功能"></nav>
    </div>
  </header>
  <main><div id="app" aria-live="polite"></div></main>

  <script>
  (function(){
    "use strict";
    var charts=[];
    function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
    var PINK="#2563eb",PINK2="#059669",AXIS="#475569",SPLIT="#e4ecfc";
    function axisCommon(){return{axisLine:{lineStyle:{color:SPLIT}},axisLabel:{color:AXIS,fontSize:11,fontFamily:"Fira Code"},axisTick:{show:false}};}

    var MODS=[
      {ic:"verified",t:"保固主檔管理",d:"註冊保固、條款期限與序號綁定查驗"},
      {ic:"build",t:"服務維修工單",d:"工單建立、技師派工與維修進度追蹤"},
      {ic:"receipt_long",t:"客訴案件處理",d:"客訴受理、分派升級與退換貨決策"},
      {ic:"monitoring",t:"SLA 時效看板",d:"回應與結案時效即時監控與預警"},
      {ic:"inventory_2",t:"備品耗材與費用",d:"維修用料領用、保固內外費用歸屬"},
      {ic:"insights",t:"售後品質洞察",d:"故障類型分析與退換率趨勢回饋"}
    ];

    function head(i){var m=MODS[i];return '<div class="screen-head"><div class="ic" aria-hidden="true"><span class="msy">'+m.ic+'</span></div><div style="min-width:0"><h2>'+m.t+'</h2><p>'+m.d+'</p></div></div>';}
    function kpi(lab,ic,val,unit,sub,cls){return '<div class="kpi grid-item"><div class="lab"><span class="msy" aria-hidden="true">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="sub '+(cls||'')+'">'+(sub||'')+'</div></div>';}
    function barRows(arr){return arr.map(function(a){return '<div class="bar-row"><div class="nm">'+a[0]+'</div><div class="bar-track" role="progressbar" aria-label="'+a[0]+'" aria-valuenow="'+a[1]+'" aria-valuemin="0" aria-valuemax="100"><div class="bar-fill" style="width:'+a[1]+'%;background:'+(a[2]||PINK)+'"></div></div><div class="vv">'+a[1]+'%</div></div>';}).join('');}

    function s0(){
      var rows=[
        {sn:"WM-2401-88213",prod:"CNC 立式加工中心 VX-650",cust:"鼎O精密工業",exp:"2027-03-10",type:"整機保固",st:"保固中",cls:"ok",left:573},
        {sn:"WM-2312-77104",prod:"伺服馬達模組 SM-220",cust:"O昇機械",exp:"2025-12-01",type:"零件保固",st:"即將到期",cls:"warn",left:110},
        {sn:"WM-2208-51930",prod:"視覺檢測系統 AOI-9",cust:"O鑫電子",exp:"2024-08-18",type:"整機保固",st:"已逾保",cls:"bad",left:-361},
        {sn:"WM-2405-90621",prod:"機械手臂 RB-6 六軸",cust:"O達自動化",exp:"2026-05-27",type:"延長保固",st:"保固中",cls:"ok",left:286},
        {sn:"WM-2401-88990",prod:"雷射切割頭 LC-30",cust:"O屬世家",exp:"2025-10-14",type:"零件保固",st:"即將到期",cls:"warn",left:62},
        {sn:"WM-2307-60077",prod:"冷卻循環機 CH-15",cust:"O能製冷",exp:"2026-07-07",type:"整機保固",st:"保固中",cls:"ok",left:327}
      ];
      var trs=rows.map(function(r){return '<tr><td class="mono" style="font-weight:700;color:var(--blue)">'+r.sn+'</td><td>'+r.prod+'</td><td>'+r.cust+'</td><td class="mono">'+r.exp+'</td><td><span class="pill">'+r.type+'</span></td><td><span class="tag '+r.cls+'">'+r.st+'</span></td><td class="mono" style="text-align:right;font-weight:700">'+(r.left>0?r.left+' 天':'逾 '+(-r.left)+' 天')+'</td></tr>';}).join('');
      return head(0)+
      '<div class="grid g-kpi" style="margin-bottom:14px">'+
        kpi("有效保固合約","verified","4,182","筆","本月新增 128","up")+
        kpi("90 天內到期","hourglass_bottom","213","筆","需主動提醒續保","")+
        kpi("平均保固覆蓋率","shield","91.4","%","+2.6% vs 上季","up")+
        kpi("已逾保產品","event_busy","1,036","筆","轉付費維修機會","")+

          [["同型號 30 日內 3 件同故障 → 觸發 8D","var(--bad)"],["退換率連 2 月 >1% → 通知研發","var(--warn)"],["保固內故障回流品保週報","var(--info)"],["逾保高故障品 → 主動召修評估","var(--blue)"]].map(function(x){return '<li><span class="dot" style="background:'+x[1]+'"></span><span style="font-size:12.5px">'+x[0]+'</span></li>';}).join('')+
        '</ul></div>'+
        '<div class="card grid-item"><h3><span class="msy">fact_check</span>重複故障品項追蹤</h3><div class="scroll"><table style="min-width:500px"><thead><tr><th>品項</th><th>近30日</th><th>主要故障</th><th>趨勢</th><th>改善狀態</th></tr></thead><tbody>'+
          [["主軸組件",7,"軸承磨耗","up","8D 進行中","warn"],["伺服驅動",5,"過熱保護","down","已改版","ok"],["冷卻系統",4,"密封洩漏","up","調查中","warn"],["AOI 光源",3,"亮度衰減","flat","監控","info"],["切割噴嘴",6,"堵塞","up","供應商換料","warn"]].map(function(r){var ai=r[3]==="up"?"trending_up":r[3]==="down"?"trending_down":"trending_flat";var ac=r[3]==="up"?"var(--bad)":r[3]==="down"?"var(--ok)":"var(--muted)";var tx=r[3]==="up"?"上升":r[3]==="down"?"下降":"持平";return '<tr><td style="font-weight:600">'+r[0]+'</td><td class="mono" style="text-align:right">'+r[1]+'</td><td>'+r[2]+'</td><td><span class="msy" style="color:'+ac+'" aria-hidden="true">'+ai+'</span><span class="mono" style="margin-left:4px">'+tx+'</span></td><td><span class="tag '+r[5]+'">'+r[4]+'</span></td></tr>';}).join('')+
        '</tbody></table></div></div>'+
      '</div>';
    }
    function d5(){
      mk("c5a",{grid:{left:8,right:40,top:20,bottom:40,containLabel:true},tooltip:{trigger:"axis"},xAxis:Object.assign({type:"category",data:["軸承磨耗","過熱","密封洩漏","堵塞","亮度衰減","面板"],axisLabel:{color:AXIS,fontSize:10,interval:0,rotate:20}},axisCommon()),yAxis:[Object.assign({type:"value",splitLine:{lineStyle:{color:SPLIT}}},axisCommon()),{type:"value",max:100,axisLabel:{formatter:"{value}%",color:AXIS,fontSize:10},splitLine:{show:false},axisLine:{show:false},axisTick:{show:false}}],series:[{name:"件數",type:"bar",data:[42,31,24,18,12,7],barWidth:"48%",itemStyle:{color:PINK,borderRadius:[3,3,0,0]}},{name:"累積%",type:"line",yAxisIndex:1,smooth:true,data:[31,54,72,85,94,100],lineStyle:{color:PINK2,width:2.5},itemStyle:{color:PINK2}}]});
      mk("c5b",{grid:{left:8,right:14,top:30,bottom:22,containLabel:true},tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:11,color:AXIS}},xAxis:Object.assign({type:"category",boundaryGap:false,data:["3月","4月","5月","6月","7月","8月"]},axisCommon()),yAxis:Object.assign({type:"value",axisLabel:{formatter:"{value}%",color:AXIS,fontSize:11},splitLine:{lineStyle:{color:SPLIT}}},axisCommon()),series:[{name:"故障率",type:"line",smooth:true,data:[1.62,1.55,1.48,1.39,1.31,1.24],lineStyle:{width:3,color:PINK},itemStyle:{color:PINK}},{name:"退換率",type:"line",smooth:true,data:[1.18,1.09,1.02,0.97,0.91,0.86],lineStyle:{width:3,color:PINK2},itemStyle:{color:PINK2}}]});
    }

    var SCR=[s0,s1,s2,s3,s4,s5];
    var DRAW=[d0,d1,d2,d3,d4,d5];
    var app=document.getElementById("app");
    var tabs=document.getElementById("tabs");
    tabs.innerHTML=MODS.map(function(m,i){return '<button type="button" data-i="'+i+'" aria-label="'+m.t+'"><span class="msy" aria-hidden="true">'+m.ic+'</span><span class="txt">'+m.t+'</span></button>';}).join('');

    tabs.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]");
      if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function show(i){
      disposeCharts();
      app.innerHTML=SCR[i]();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){
        var active=+btns[k].getAttribute("data-i")===i;
        btns[k].classList.toggle("on",active);
        btns[k].setAttribute("aria-current",active?"page":"false");
      }
      void app.offsetHeight;
      DRAW[i]();
    }

    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return;}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0);}catch(e){}
    }

    window.addEventListener("resize",function(){
      for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}
    });
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
</html>
