<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>售後服務/保固管理 After-Sales Service & Warranty｜Jvision Demo</title>
  <meta name="description" content="保固驗證、服務維修工單、客訴處理與 SLA 時效監控的單一售後平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#db2777; --accent2:#f472b6; --accent-soft:#fce7f3;
      --ink:#1f2937; --muted:#6b7280; --line:#f0d6e4; --bg:#fdf2f8; --card:#ffffff;
      --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#6366f1;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
    .msy{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    /* top nav */
    header.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#9d174d,#db2777 60%,#f472b6);color:#fff;box-shadow:0 4px 18px rgba(157,23,77,.25)}
    .topwrap{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
    .brand .logo .msy{font-size:24px;color:#fff}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap}
    .brand p{font-size:11px;margin:0;opacity:.82;white-space:nowrap}
    nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
    nav.tabs button{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;transition:.15s;min-width:0}
    nav.tabs button .msy{font-size:19px}
    nav.tabs button:hover{background:rgba(255,255,255,.24)}
    nav.tabs button.on{background:#fff;color:var(--accent)}
    main{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .screen-head .ic{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
    .screen-head .ic .msy{font-size:26px}
    .screen-head h2{margin:0;font-size:20px;font-weight:800}
    .screen-head p{margin:3px 0 0;font-size:13px;color:var(--muted)}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
    .tag.ok{background:#dcfce7;color:#15803d}.tag.warn{background:#fef3c7;color:#b45309}
    .tag.bad{background:#ffe4e6;color:#be123c}.tag.info{background:#e0e7ff;color:#4338ca}
    .tag.mut{background:#f1f5f9;color:#475569}
    /* generic cards */
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(219,39,119,.05);min-width:0}
    .card h3{margin:0 0 14px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .msy{font-size:19px;color:var(--accent)}
    .grid{display:grid;gap:14px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g2{grid-template-columns:1fr 1fr}
    .g3{grid-template-columns:1fr 1fr 1fr}
    .g-2-1{grid-template-columns:2fr 1fr}
    .g-1-2{grid-template-columns:1fr 2fr}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden;min-width:0}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lab .msy{font-size:17px;color:var(--accent)}
    .kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .sub{font-size:11.5px;margin-top:3px;font-weight:600}
    .up{color:var(--ok)}.down{color:var(--bad)}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fef6fa}
    td{padding:10px 12px;border-bottom:1px solid #f5eaf1;vertical-align:middle}
    tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#fdf2f8}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
    .scroll table{border-radius:12px;overflow:hidden}
    .chart{width:100%;height:290px;overflow:hidden}
    .chart.sm{height:230px}
    .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
    .bar-row .nm{width:88px;flex:none;font-weight:600;color:#374151}
    .bar-track{flex:1;height:9px;background:#f3e0eb;border-radius:6px;overflow:hidden;min-width:0}
    .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .bar-row .vv{width:52px;text-align:right;font-weight:700;flex:none}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    .col{background:#fbeef5;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
    .col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
    .col h4 .cnt{background:#fff;color:var(--accent);border-radius:999px;padding:1px 9px;font-size:11px}
    .tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 10px;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
    .tk .tid{font-size:11px;color:var(--accent);font-weight:800}
    .tk .tt{font-size:12.5px;font-weight:700;margin:2px 0 4px}
    .tk .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
    .tk.hi{border-left-color:var(--bad)}
    .tk.med{border-left-color:var(--warn)}
    /* timeline */
    .tl{position:relative;padding-left:26px;margin:0}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl li{position:relative;list-style:none;margin-bottom:16px}
    .tl li::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
    .tl li.done::before{background:var(--ok)}
    .tl li.now::before{background:var(--warn)}
    .tl .tlh{font-size:13px;font-weight:700}
    .tl .tlm{font-size:11.5px;color:var(--muted)}
    .prog{height:8px;background:#f3e0eb;border-radius:6px;overflow:hidden}
    .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .list{margin:0;padding:0;list-style:none}
    .list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5eaf1;font-size:13px}
    .list li:last-child{border-bottom:0}
    .list .dot{width:9px;height:9px;border-radius:50%;flex:none}
    .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex:none}
    .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569}
    .mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
    .flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .chipf{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);color:#475569}
    .chipf.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .stat-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat-mini .sm-c{background:#fbeef5;border-radius:12px;padding:11px 13px;min-width:0}
    .stat-mini .sm-c .v{font-size:20px;font-weight:900}
    .stat-mini .sm-c .l{font-size:11.5px;color:var(--muted);font-weight:600}
    .sec-title{font-size:13px;font-weight:800;margin:0 0 10px;color:#374151}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
    }
    @media(max-width:560px){
      nav.tabs button span.txt{display:none}
      nav.tabs button{padding:9px 11px}
      .board{grid-template-columns:1fr}
      .g-kpi{grid-template-columns:1fr 1fr}
      .brand p{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topwrap">
      <div class="brand">
        <div class="logo"><span class="msy">verified</span></div>
        <div>
          <h1>售後服務・保固管理</h1>
          <p>After-Sales Service &amp; Warranty Platform</p>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main><div id="app"></div></main>

  <script>
  (function(){
    "use strict";
    var charts=[];
    function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
    var PINK="#db2777",PINK2="#f472b6",AXIS="#9ca3af",SPLIT="#f0d6e4";
    function axisCommon(){return{axisLine:{lineStyle:{color:SPLIT}},axisLabel:{color:AXIS,fontSize:11},axisTick:{show:false}};}

    var MODS=[
      {ic:"verified",t:"保固主檔管理",d:"註冊保固、條款期限與序號綁定查驗"},
      {ic:"build",t:"服務維修工單",d:"工單建立、技師派工與維修進度追蹤"},
      {ic:"receipt_long",t:"客訴案件處理",d:"客訴受理、分派升級與退換貨決策"},
      {ic:"monitoring",t:"SLA 時效看板",d:"回應與結案時效即時監控與預警"},
      {ic:"inventory_2",t:"備品耗材與費用",d:"維修用料領用、保固內外費用歸屬"},
      {ic:"insights",t:"售後品質洞察",d:"故障類型分析與退換率趨勢回饋"}
    ];

    // ---------- helpers ----------
    function head(i){var m=MODS[i];return '<div class="screen-head"><div class="ic"><span class="msy">'+m.ic+'</span></div><div style="min-width:0"><h2>'+m.t+'</h2><p>'+m.d+'</p></div></div>';}
    function kpi(lab,ic,val,unit,sub,cls){return '<div class="kpi"><div class="lab"><span class="msy">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="sub '+(cls||'')+'">'+(sub||'')+'</div></div>';}

    // ============ SCREEN 0 : 保固主檔管理 ============
    function s0(){
      var rows=[
        {sn:"WM-2401-88213",prod:"CNC 立式加工中心 VX-650",cust:"鼎宸精密工業",buy:"2024-03-11",exp:"2027-03-10",type:"整機保固",st:"保固中",cls:"ok",left:573},
        {sn:"WM-2312-77104",prod:"伺服馬達模組 SM-220",cust:"泰昇機械",buy:"2023-12-02",exp:"2025-12-01",type:"零件保固",st:"即將到期",cls:"warn",left:110},
        {sn:"WM-2208-51930",prod:"視覺檢測系統 AOI-9",cust:"宏鑫電子",buy:"2022-08-19",exp:"2024-08-18",type:"整機保固",st:"已逾保",cls:"bad",left:-361},
        {sn:"WM-2405-90621",prod:"機械手臂 RB-6 六軸",cust:"力達自動化",buy:"2024-05-28",exp:"2026-05-27",type:"延長保固",st:"保固中",cls:"ok",left:286},
        {sn:"WM-2401-88990",prod:"雷射切割頭 LC-30",cust:"金屬世家",buy:"2024-01-15",exp:"2025-10-14",type:"零件保固",st:"即將到期",cls:"warn",left:62},
        {sn:"WM-2307-60077",prod:"冷卻循環機 CH-15",cust:"綠能製冷",buy:"2023-07-08",exp:"2026-07-07",type:"整機保固",st:"保固中",cls:"ok",left:327}
      ];
      var trs=rows.map(function(r){
        return '<tr><td class="mono" style="font-weight:700;color:var(--accent)">'+r.sn+'</td><td>'+r.prod+'</td><td>'+r.cust+'</td><td class="mono">'+r.exp+'</td><td><span class="pill">'+r.type+'</span></td><td><span class="tag '+r.cls+'">'+r.st+'</span></td><td class="mono" style="text-align:right;font-weight:700">'+(r.left>0?r.left+' 天':'逾 '+(-r.left)+' 天')+'</td></tr>';
      }).join('');
      var html=head(0)+
      '<div class="grid g-kpi" style="margin-bottom:14px">'+
        kpi("有效保固合約","verified","4,182","筆","本月新增 128","up")+
        kpi("90 天內到期","hourglass_bottom","213","筆","需主動提醒續保","")+
        kpi("平均保固覆蓋率","shield","91.4","%","+2.6% vs 上季","up")+
        kpi("已逾保產品","event_busy","1,036","筆","轉付費維修機會","")+
      '</div>'+
      '<div class="grid g-2-1" style="margin-bottom:14px">'+
        '<div class="card"><h3><span class="msy">table_chart</span>保固主檔查詢</h3><div class="scroll"><table><thead><tr><th>序號</th><th>產品</th><th>客戶</th><th>到期日</th><th>類型</th><th>狀態</th><th style="text-align:right">剩餘</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>'+
        '<div class="card"><h3><span class="msy">donut_small</span>保固狀態分佈</h3><div id="c0a" class="chart sm"></div></div>'+
      '</div>'+
      '<div class="grid g2">'+
        '<div class="card"><h3><span class="msy">calendar_month</span>未來 6 個月到期趨勢</h3><div id="c0b" class="chart"></div></div>'+
        '<div class="card"><h3><span class="msy">category</span>各產品線保固覆蓋</h3>'+
          barRows([["加工中心",94,PINK],["自動化設備",89,PINK],["檢測系統",96,PINK],["動力模組",82,PINK],["切割系統",90,PINK]])+
          '<div style="margin-top:12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px"><span class="msy" style="font-size:16px;color:var(--accent)">info</span>覆蓋率＝已註冊保固／已出貨產品</div>'+
        '</div>'+
      '</div>';
      return html;
    }
    function barRows(arr){return arr.map(function(a){return '<div class="bar-row"><div class="nm">'+a[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+a[1]+'%;background:'+(a[2]||PINK)+'"></div></div><div class="vv">'+a[1]+'%</div></div>';}).join('');}
    function d0(){
      mk("c0a",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],avoidLabelOverlap:true,itemStyle:{borderRadius:6,borderColor:"#fff",borderWidth:2},label:{show:false},data:[{value:2841,name:"保固中",itemStyle:{color:PINK}},{value:213,name:"即將到期",itemStyle:{color:"#f59e0b"}},{value:1036,name:"已逾保",itemStyle:{color:"#e11d48"}},{value:92,name:"待審核",itemStyle:{color:"#a78bfa"}}]}]});
      mk("c0b",{grid:{left:8,right:12,top:24,bottom:22,containLabel:true},tooltip:{trigger:"axis"},xAxis:Object.assign({type:"category",data:["9月","10月","11月","12月","1月","2月"]},axisCommon()),yAxis:Object.assign({type:"value",splitLine:{lineStyle:{color:SPLIT}}},axisCommon()),series:[{type:"bar",data:[38,52,213,74,61,45],barWidth:"46%",itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:PINK2},{offset:1,color:PINK}]),borderRadius:[6,6,0,0]}}]});
    }

    // ============ SCREEN 1 : 服務維修工單 ============
    function s1(){
      var board={
        "待派工":[{id:"WO-5521",t:"主軸異音檢修",c:"泰昇機械",p:"high",who:"未指派",due:"今日 17:00"},{id:"WO-5522",t:"控制面板故障",c:"宏鑫電子",p:"med",who:"未指派",due:"明日"}],
        "維修中":[{id:"WO-5510",t:"伺服驅動更換",c:"力達自動化",p:"high",who:"陳志明",due:"進行 62%"},{id:"WO-5514",t:"冷卻管路清潔",c:"綠能製冷",p:"low",who:"林佩珊",due:"進行 30%"},{id:"WO-5518",t:"AOI 鏡頭校正",c:"鼎宸精密",p:"med",who:"王建豪",due:"進行 85%"}],
        "待驗收":[{id:"WO-5502",t:"雷射頭校準",c:"金屬世家",p:"med",who:"陳志明",due:"等待客戶"}],
        "已結案":[{id:"WO-5490",t:"編碼器更換",c:"泰昇機械",p:"low",who:"林佩珊",due:"08-11 結案"},{id:"WO-5488",t:"氣壓閥維修",c:"宏鑫電子",p:"med",who:"王建豪",due:"08-10 結案"}]
      };
      var cols=Object.keys(board).map(function(k){
        var cards=board[k].map(function(w){
          var pc=w.p==="high"?"hi":(w.p==="med"?"med":"");
          return '<div class="tk '+pc+'"><div class="tid">'+w.id+'</div><div class="tt">'+w.t+'</div><div class="meta"><span>'+w.c+'</span><span>'+w.due+'</span></div><div class="meta" style="margin-top:5px"><span><span class="avatar" style="width:20px;height:20px;font-size:9px">'+w.who.slice(0,1)+'</span> '+w.who+'</span><span class="pill">'+(w.p==="high"?"急件":w.p==="med"?"一般":"低")+'</span></div></div>';
        }).join('');
        return '<div class="col"><h4>'+k+'<span class="cnt">'+board[k].length+'</span></h4>'+cards+'</div>';
      }).join('');
      return head(1)+
      '<div class="grid g-kpi" style="margin-bottom:14px">'+
        kpi("進行中工單","build","37","張","急件 6 張","")+
        kpi("今日新建","note_add","14","張","+3 vs 昨日","up")+
        kpi("平均修復工時","schedule","4.8","小時","-0.6 hr","up")+
        kpi("一次修復率","task_alt","87.2","%","目標 85%","up")+
      '</div>'+
      '<div class="card" style="margin-bottom:14px"><h3><span class="msy">view_kanban</span>維修工單派工看板</h3><div class="scroll"><div class="board" style="min-width:680px">'+cols+'</div></div></div>'+
      '<div class="grid g2">'+
        '<div class="card"><h3><span class="msy">engineering</span>技師負荷與績效</h3>'+
          '<div class="scroll"><table style="min-width:440px"><thead><tr><th>技師</th><th>在手</th><th>今日結案</th><th>準時率</th><th>負荷</th></tr></thead><tbody>'+
          [["陳志明",5,3,"96%",78],["林佩珊",4,4,"92%",64],["王建豪",6,2,"88%",90],["張永昌",3,3,"99%",48]].map(function(t){
            return '<tr><td><span class="avatar">'+t[0].slice(0,1)+'</span> '+t[0]+'</td><td class="mono">'+t[1]+'</td><td class="mono">'+t[2]+'</td><td><span class="tag ok">'+t[3]+'</span></td><td style="min-width:110px"><div class="prog"><i style="width:'+t[4]+'%"></i></div></td></tr>';
          }).join('')+'</tbody></table></div></div>'+
