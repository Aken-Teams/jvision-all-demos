<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>車隊成本油耗儀 · Fleet Cost &amp; Fuel Analytics</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --accent:#4f46e5; --accent2:#818cf8; --accent-soft:#eef2ff;
  --bg:#f5f6fb; --panel:#ffffff; --ink:#1e1f2b; --muted:#6b6f80;
  --line:#e8e9f2; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 1px 2px rgba(30,31,43,.04),0 8px 24px rgba(79,70,229,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
/* Sidebar */
.sidebar{
  width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;}
.brand .logo{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px;}
.brand p{font-size:11px;margin:2px 0 0;color:var(--muted);font-weight:500;}
.nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-width:0;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border:none;background:transparent;
  border-radius:11px;cursor:pointer;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
  text-align:left;width:100%;transition:background .15s,color .15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:none;}
.navbtn .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:var(--accent-soft);color:var(--accent);}
.navbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow);}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;}
.side-foot b{color:var(--ink);}
/* Main */
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.screen{animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.head{margin-bottom:20px;}
.head .eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;}
.head h2{font-size:23px;margin:6px 0 4px;font-weight:800;}
.head p{margin:0;color:var(--muted);max-width:720px;}
/* generic grid classes */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0;}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700;}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.card-h h3{margin:0;}
/* KPI */
.kpi{position:relative;overflow:hidden;}
.kpi .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi .ic .material-symbols-outlined{font-size:22px;}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.kpi .lbl{color:var(--muted);font-size:12.5px;margin-top:2px;}
.kpi .delta{font-size:12px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:3px;}
.delta.up{color:var(--good);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted);}
.delta .material-symbols-outlined{font-size:15px;}
/* chart box */
.chart{width:100%;height:280px;}
.chart.sm{height:220px;}
.chart.lg{height:340px;}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;background:#fafbff;position:sticky;top:0;}
tbody tr:hover{background:#fafbff;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.t-good{background:#e7f6ee;color:var(--good);}
.t-warn{background:#fdf1de;color:var(--warn);}
.t-bad{background:#fce8e8;color:var(--bad);}
.t-idle{background:#eef0f6;color:var(--muted);}
.t-info{background:var(--accent-soft);color:var(--accent);}
.bar{height:7px;border-radius:6px;background:#eef0f6;overflow:hidden;min-width:70px;}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.plate{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:760px;}
.col{background:#fafbff;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
.col .col-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:10px;}
.col .col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(30,31,43,.03);}
.ticket .tt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
.ticket .plate{font-size:13px;}
.ticket .mt{color:var(--muted);font-size:11.5px;}
.ticket .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11.5px;color:var(--muted);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
/* timeline */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .node{position:absolute;left:-22px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
.tl-item.done .node{background:var(--accent);border-color:var(--accent);}
.tl-item.warn .node{border-color:var(--warn);}
.tl-item .tl-t{font-weight:700;font-size:13.5px;}
.tl-item .tl-m{color:var(--muted);font-size:12px;margin-top:2px;}
.tl-item .tl-time{font-size:11px;color:var(--accent);font-weight:700;}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
/* stat rows */
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);}
.srow:last-child{border-bottom:none;}
.srow .lab{color:var(--muted);font-size:12.5px;min-width:0;}
.srow .v{font-weight:700;font-variant-numeric:tabular-nums;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.hero-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow);min-width:0;}
.chip .material-symbols-outlined{font-size:17px;color:var(--accent);}
.chip b{color:var(--accent);}
/* map */
#fleetmap{height:420px;width:100%;border-radius:14px;overflow:hidden;z-index:0;min-width:280px;}
.leaflet-container{font-family:inherit;background:#eaecf3;}
.maplegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;}
.maplegend .mi{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;}
.maplegend .mi b{color:var(--ink);}
/* Responsive sidebar -> topnav */
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px;}
  .brand{padding:0 12px 0 4px;flex:1 1 auto;min-width:0;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;overflow:visible;}
  .navbtn{width:auto;flex:none;white-space:nowrap;}
  .side-foot{display:none;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:560px){
  .navbtn .txt{display:none;}
  .navbtn{padding:9px 11px;}
  .head h2{font-size:20px;}
  .board,.col{min-width:0;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_gas_station</span></div>
      <div>
        <h1>車隊成本油耗儀</h1>
        <p>Fleet Cost &amp; Fuel Analytics</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      車隊規模 <b>68 輛</b> · 本月里程 <b>214,600 km</b><br/>資料更新 2026-08-13
    </div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>

<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"成本總覽",tag:"Overview"},
  {icon:"local_gas_station",name:"油耗分析",tag:"Fuel"},
  {icon:"directions_car",name:"車輛成本明細",tag:"Cost"},
  {icon:"build",name:"保養維修",tag:"Maintenance"},
  {icon:"receipt_long",name:"加油卡帳",tag:"Fuel Card"},
  {icon:"map",name:"路線油耗地圖",tag:"Map"}
];
var nf=function(n){try{return Number(n).toLocaleString("en-US");}catch(e){return String(n);}};
var money=function(n){return "NT$"+nf(n);};

/* ---------- shared render helpers ---------- */
function kpi(ic,val,lbl,delta,dir){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arw=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="val">'+val+'</div><div class="lbl">'+lbl+'</div>'+
    (delta?'<div class="delta '+cls+'"><span class="material-symbols-outlined">'+arw+'</span>'+delta+'</div>':'')+'</div>';
}
function headHtml(idx,title,desc){
  return '<div class="head"><span class="eyebrow"><span class="material-symbols-outlined" style="font-size:16px">'+MODS[idx].icon+'</span>'+MODS[idx].tag+'</span>'+
    '<h2>'+title+'</h2><p>'+desc+'</p></div>';
}

/* ---------- chart registry ---------- */
var CHARTS=[];
function disposeCharts(){
  for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].dispose();}catch(e){}}
  CHARTS=[];
}
function mk(el,opt){ if(!el)return; var c=echarts.init(el); c.setOption(opt); CHARTS.push(c); return c; }
var AXt={fontFamily:'Inter,"Noto Sans TC",sans-serif'};
var PAL=['#4f46e5','#818cf8','#a5b4fc','#c7d2fe','#6366f1','#4338ca'];

/* map state */
var MAP=null;

/* ============ SCREEN 0 : 成本總覽 ============ */
function s0(){
  var v='<div class="screen">'+headHtml(0,"車隊成本總覽","彙整加油、里程與保養，掌握每公里成本、月度費用與成本結構走勢。");
  v+='<div class="hero-strip">'+
     '<div class="chip"><span class="material-symbols-outlined">savings</span>本月總成本 <b>NT$4,182,900</b></div>'+
     '<div class="chip"><span class="material-symbols-outlined">speed</span>平均每公里 <b>NT$19.5</b></div>'+
     '<div class="chip"><span class="material-symbols-outlined">local_gas_station</span>油料佔比 <b>58%</b></div>'+
     '<div class="chip"><span class="material-symbols-outlined">directions_car</span>在營車輛 <b>64 / 68</b></div></div>';
  v+='<div class="grid g4">'+
    kpi("payments","NT$4.18M","本月車隊總成本","3.1% 較上月","down")+
    kpi("route","19.5","每公里成本(元)","0.8 元優化","down")+
    kpi("local_gas_station","6.8","平均油耗(km/L)","2.4% 改善","up")+
    kpi("warning","5","成本異常車輛","2 輛新增","down")+
    '</div>';
  v+='<div class="grid g23" style="margin-top:16px">'+
    '<div class="card"><div class="card-h"><h3>月度成本結構走勢</h3><span class="tag t-info">近 8 個月</span></div><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><h3>本月成本組成</h3><div class="sub">依費用類別佔比</div><div id="c0b" class="chart sm"></div></div>'+
    '</div>';
  v+='<div class="grid g32" style="margin-top:16px">'+
    '<div class="card"><h3>各車型每公里成本</h3><div class="sub">元/公里 · 越低越佳</div>'+
      '<div class="srow"><span class="lab">4.5噸廂式貨車</span><span class="v">16.2</span></div>'+
      '<div class="srow"><span class="lab">3.5噸冷藏車</span><span class="v">24.8</span></div>'+
      '<div class="srow"><span class="lab">11噸大貨車</span><span class="v">21.4</span></div>'+
      '<div class="srow"><span class="lab">1噸小貨車</span><span class="v">12.9</span></div>'+
      '<div class="srow"><span class="lab">拖板車</span><span class="v">28.6</span></div></div>'+
    '<div class="card"><div class="card-h"><h3>車隊成本效率快照</h3></div><div id="c0c" class="chart"></div></div>'+
    '</div>';
  v+='</div>';
  return v;
}
function init0(){
  mk(document.getElementById("c0a"),{
    tooltip:{trigger:"axis"},legend:{data:["油料","保養維修","折舊攤提","稅險其他"],bottom:0,icon:"roundRect"},
    grid:{left:8,right:14,top:16,bottom:36,containLabel:true},textStyle:AXt,
    xAxis:{type:"category",data:["1月","2月","3月","4月","5月","6月","7月","8月"],axisLine:{lineStyle:{color:"#d7d9e6"}}},
    yAxis:{type:"value",axisLabel:{formatter:"{value}萬"},splitLine:{lineStyle:{color:"#eef0f6"}}},
    series:[
      {name:"油料",type:"bar",stack:"a",data:[218,224,231,240,228,236,244,242],itemStyle:{color:"#4f46e5"}},
      {name:"保養維修",type:"bar",stack:"a",data:[58,62,49,71,55,64,60,58],itemStyle:{color:"#818cf8"}},
      {name:"折舊攤提",type:"bar",stack:"a",data:[72,72,72,72,72,72,72,72],itemStyle:{color:"#a5b4fc"}},
      {name:"稅險其他",type:"bar",stack:"a",data:[36,34,38,35,37,36,39,36],itemStyle:{color:"#c7d2fe"}}
    ]
  });
  mk(document.getElementById("c0b"),{
    tooltip:{trigger:"item",formatter:"{b}: {d}%"},textStyle:AXt,
    series:[{type:"pie",radius:["48%","74%"],center:["50%","48%"],avoidLabelOverlap:true,
      label:{formatter:"{b}\n{d}%",fontSize:11},
      data:[
        {value:58,name:"油料",itemStyle:{color:"#4f46e5"}},
        {value:16,name:"保養維修",itemStyle:{color:"#818cf8"}},
        {value:17,name:"折舊攤提",itemStyle:{color:"#a5b4fc"}},
        {value:9,name:"稅險其他",itemStyle:{color:"#c7d2fe"}}
      ]}]
  });
  mk(document.getElementById("c0c"),{
    tooltip:{trigger:"axis",axisPointer:{type:"cross"}},grid:{left:8,right:20,top:26,bottom:8,containLabel:true},textStyle:AXt,
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLine:{lineStyle:{color:"#d7d9e6"}}},
    yAxis:[{type:"value",name:"km/L",splitLine:{lineStyle:{color:"#eef0f6"}}},{type:"value",name:"元/km",position:"right"}],
    series:[
      {name:"平均油耗",type:"line",smooth:true,data:[6.3,6.4,6.4,6.6,6.5,6.7,6.8,6.8],itemStyle:{color:"#4f46e5"},areaStyle:{color:"rgba(79,70,229,.10)"}},
      {name:"每公里成本",type:"line",yAxisIndex:1,smooth:true,data:[20.3,20.1,20.4,19.9,19.8,19.6,19.5,19.5],itemStyle:{color:"#d97706"}}
    ]
  });
}

/* ============ SCREEN 1 : 油耗分析 ============ */
var FUEL=[
  {plate:"KEB-2871",type:"4.5噸廂式",base:6.9,cur:5.4,km:4820,st:"bad",note:"較同型低22%"},
  {plate:"RGH-0143",type:"11噸大貨",base:4.2,cur:4.0,km:6210,st:"warn",note:"連3週下滑"},
  {plate:"BQL-5590",type:"3.5噸冷藏",base:5.1,cur:5.3,km:3980,st:"good",note:"表現穩定"},
  {plate:"TPD-6624",type:"1噸小貨",base:9.2,cur:9.5,km:2740,st:"good",note:"最佳油耗"},
  {plate:"MSC-3308",type:"4.5噸廂式",base:6.9,cur:6.1,km:5120,st:"warn",note:"胎壓偏低"},
  {plate:"WJN-7752",type:"拖板車",base:3.4,cur:2.9,km:7360,st:"bad",note:"疑似漏油"}
];
function s1(){
  var v='<div class="screen">'+headHtml(1,"油耗異常分析","比對各車即時油耗與同型車基準，標記突降或偏高車輛，鎖定耗油熱點與可疑駕駛行為。");
  v+='<div class="grid g4">'+
    kpi("water_drop","6.8 km/L","車隊平均油耗","2.4% 改善","up")+
    kpi("crisis_alert","2","嚴重偏離車輛","1 輛新增","down")+
    kpi("local_gas_station","28,140 L","本月加油量","1.2% 下降","up")+
    kpi("eco","-4.1 t","CO₂ 較上月","減碳持續","up")+
    '</div>';
  v+='<div class="grid g2" style="margin-top:16px">'+
    '<div class="card"><div class="card-h"><h3>油耗基準 vs 實際</h3><span class="tag t-info">同型車比對</span></div><div id="c1a" class="chart"></div>'+
      '<div class="legend"><span><i style="background:#4f46e5"></i>基準油耗</span><span><i style="background:#d97706"></i>實際油耗</span></div></div>'+
    '<div class="card"><div class="card-h"><h3>單車油耗偏離分布</h3></div><div id="c1b" class="chart"></div>'+
      '<div class="legend"><span><i style="background:#4f46e5"></i>正常區間</span><span><i style="background:#dc2626"></i>偏離>15%</span></div></div>'+

    v+='<tr><td class="plate">'+r.plate+'</td><td>'+r.zone+'</td><td class="num">'+nf(r.km)+' km</td><td class="num">'+r.cpk.toFixed(1)+'</td><td><span class="tag '+tg+'">'+stx+'</span></td></tr>';
  });
  v+='</tbody></table></div></div></div>';
  return v;
}
function mColor(st){return st==="bad"?"#dc2626":st==="warn"?"#d97706":"#16a34a";}
function init5(){
  var el=document.getElementById("fleetmap");
  if(!el||MAP) return;
  MAP=L.map(el,{scrollWheelZoom:false,attributionControl:false}).setView([25.02,121.44],11);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(MAP);
  ROUTES.forEach(function(r){
    var c=mColor(r.st);
    L.circleMarker([r.lat,r.lng],{radius:9+Math.min(9,r.km/1200),color:c,weight:2,fillColor:c,fillOpacity:.55}).addTo(MAP)
     .bindPopup("<b>"+r.plate+"</b><br/>"+r.zone+"<br/>里程 "+nf(r.km)+" km<br/>每公里 "+r.cpk.toFixed(1)+" 元");
    L.circleMarker([r.lat,r.lng],{radius:3,color:c,fillColor:"#fff",fillOpacity:1,weight:2}).addTo(MAP);
  });
  requestAnimationFrame(function(){ if(MAP) MAP.invalidateSize(); });
}
function destroyMap(){ if(MAP){ try{MAP.remove();}catch(e){} MAP=null; } }

/* ---------- controller ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[init0,init1,init2,init3,init4,init5];
var cur=-1;
function buildNav(){
  var nav=document.getElementById("nav"),h="";
  MODS.forEach(function(m,i){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span></button>';
  });
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){ show(+this.getAttribute("data-i")); });
  }
}
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  if(i===cur) return;
  if(cur===5) destroyMap();
  disposeCharts();
  cur=i;
  var view=document.getElementById("view");
  view.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i); }
  void view.offsetHeight;
  try{ INIT[i](); }catch(e){}
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
