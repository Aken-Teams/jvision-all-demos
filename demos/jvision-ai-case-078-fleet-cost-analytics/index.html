.head:after{content:"";position:absolute;left:0;bottom:-1px;width:86px;height:2px;background:var(--color-primary)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--color-primary);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

}

.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

}

.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card-h h3{margin:0}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:0;top:0;width:2px;height:100%;background:var(--color-primary);opacity:.7}
.kpi .ic{width:34px;height:34px;display:grid;place-items:center;margin-bottom:13px;color:var(--color-primary);background:#10281a;border:1px solid #216c35;border-radius:2px}

.delta{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:11px;font-weight:700}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.delta .material-symbols-outlined{font-size:15px}
.chart{width:100%;height:280px}.chart.sm{height:220px}.chart.lg{height:340px}
.scroll{overflow:auto;scrollbar-color:#526069 #10181b}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{position:sticky;top:0;z-index:1;color:#c5d0dd;background:#111a1e;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

.plate{font-weight:700;letter-spacing:.04em}

.t-bad{color:#ff9999;background:#3a1717;border-color:#914141}
.t-idle{color:#c4ccd6;background:#25292f;border-color:#56606c}
.t-info{color:#71ff94;background:#102d19;border-color:#26783a}
.bar{height:7px;min-width:78px;overflow:hidden;background:#10171a;border:1px solid #48525b;border-radius:1px}

.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:10px;min-width:790px}

.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:12px}
.cnt{padding:1px 7px;color:var(--muted);background:#20292d;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ticket{margin-bottom:9px;padding:10px;background:#1b2828;border:1px solid var(--line);border-left:2px solid var(--color-primary)}
.ticket:last-child{margin-bottom:0}
.ticket .tt,.ticket .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket .mt,.ticket .meta{color:var(--muted);font-size:11px}.ticket .meta{margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border:2px solid currentColor;border-radius:50%}
.tl{position:relative;padding-left:25px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 17px}.tl-item:last-child{padding-bottom:0}
.node{position:absolute;left:-23px;top:3px;width:12px;height:12px;background:#11191c;border:3px solid var(--color-primary);border-radius:50%}
.tl-item.warn .node{border-color:var(--warn)}.tl-item.done .node{background:var(--good)}
.tl-t{font-weight:700;font-size:12px}.tl-m{margin:2px 0;color:var(--muted);font-size:11px}.tl-time{color:var(--color-primary);font-size:10px}
.legend,.maplegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:11px;color:var(--muted);font-size:11px}
.legend span,.maplegend .mi{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:7px;border:1px solid rgba(255,255,255,.35)}
.maplegend .mi b{color:var(--ink)}
.srow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border:0}.srow .lab{color:var(--muted);font-size:12px}.srow .v{font-weight:700;font-variant-numeric:tabular-nums}
#fleetmap{width:100%;height:420px;min-width:280px;border:1px solid var(--line);border-radius:2px;overflow:hidden;z-index:0}
.leaflet-container{font-family:var(--mono);background:#172326}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#182424;color:#e6edf3}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:860px){

@media(max-width:560px){

}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}
 .card:hover,.navbtn:hover{transform:none}
}
</style>

 var nav=document.getElementById("nav");nav.innerHTML=MODS.map(function(m,i){return'<button class="navbtn" type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="txt">'+m.name+'</span></button>'}).join("");
 nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b){location.hash="v"+b.getAttribute("data-i")}})
}
function show(i){
 i=Math.max(0,Math.min(i,5));if(i===cur)return;if(cur===5)destroyMap();disposeCharts();cur=i;
 var view=document.getElementById("view");view.innerHTML=RENDER[i]();
 document.querySelectorAll("[data-i]").forEach(function(b){var on=+b.getAttribute("data-i")===i;b.classList.toggle("active",on);b.setAttribute("aria-current",on?"page":"false")});
 try{INIT[i]()}catch(e){}
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],5):0);
 try{window.scrollTo(0,0)}catch(e){}
}
buildNav();window.addEventListener("hashchange",fromHash);window.addEventListener("resize",function(){CHARTS.forEach(function(c){c.resize()});if(MAP)MAP.invalidateSize()});fromHash();
</script>
</body>
</html>
