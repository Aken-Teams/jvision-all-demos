<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AMHS 自動化物料搬運系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#db2777;--accent2:#f472b6;--ink:#1f1230;--muted:#6b5b74;
  --bg:#faf5f8;--card:#ffffff;--line:#f0dbe7;--soft:#fdeef6;
  --ok:#059669;--warn:#d97706;--bad:#dc2626;--info:#7c3aed;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
h1,h2,h3,h4,p{margin:0;}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#831843,#be185d);color:#fff;padding:10px 18px;box-shadow:0 4px 18px rgba(131,24,67,.25);}
.topbar-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),#fff3);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #fff5;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff;}
.brand-txt b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block;line-height:1.2;}
.brand-txt span{font-size:11px;opacity:.8;}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{flex:none;white-space:nowrap;border:none;cursor:pointer;background:#ffffff1a;color:#fff;padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:.18s;}
.nav button:hover{background:#ffffff33;}
.nav button.on{background:#fff;color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.15);}
.nav button .material-symbols-outlined{font-size:19px;}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0;}
.screen-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0;}
.screen-head .ttl{min-width:0;}
.screen-head h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px;}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.screen-head p{color:var(--muted);font-size:13px;margin-top:4px;}
.badge{margin-left:auto;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--line);flex:none;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.split-2-1{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.split-1-2{display:grid;grid-template-columns:1fr 2fr;gap:14px;}
.mt14{margin-top:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 2px 10px rgba(131,24,67,.04);}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 small{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);}
.kpi .k-ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
.kpi .k-ico .material-symbols-outlined{color:var(--accent);font-size:22px;}
.kpi .k-val{font-size:26px;font-weight:800;line-height:1;}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .k-lab{font-size:12px;color:var(--muted);margin-top:6px;}
.kpi .k-delta{font-size:11px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;}
.kpi .k-delta.up{color:var(--ok);}.kpi .k-delta.down{color:var(--bad);}
.kpi .k-delta .material-symbols-outlined{font-size:15px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--soft);}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.t-ok{background:#dcfce7;color:#166534;}
.t-run{background:#fce7f3;color:#9d174d;}
.t-wait{background:#fef3c7;color:#92400e;}
.t-bad{background:#fee2e2;color:#991b1b;}
.t-info{background:#ede9fe;color:#5b21b6;}
.chart{width:100%;height:280px;min-width:0;}
.chart.sm{height:220px;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.veh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.veh{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);position:relative;min-width:0;}
.veh .vh{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.veh .vh b{font-size:14px;font-weight:800;}
.veh .vid{width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.veh .vid .material-symbols-outlined{color:var(--accent);font-size:20px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:auto;}
.dot.g{background:var(--ok);box-shadow:0 0 0 3px #05966922;}
.dot.p{background:var(--accent);box-shadow:0 0 0 3px #db277722;animation:pulse 1.6s infinite;}
.dot.y{background:var(--warn);box-shadow:0 0 0 3px #d9770622;}
.dot.r{background:var(--bad);box-shadow:0 0 0 3px #dc262622;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.veh .vrow{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;color:var(--muted);}
.veh .vrow b{color:var(--ink);font-weight:700;}
.batt{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px;}
.batt>i{display:block;height:100%;border-radius:5px;}
.pathmap{position:relative;background:linear-gradient(180deg,#fff,#fdf2f8);border:1px solid var(--line);border-radius:14px;padding:0;height:340px;overflow:hidden;min-width:520px;}
.legwrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.leg i{width:14px;height:6px;border-radius:4px;display:inline-block;}
.matrix{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;min-width:560px;}
.cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;transition:.15s;}
.cell:hover{transform:scale(1.12);z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.2);}
.c-full{background:var(--accent);}
.c-mid{background:var(--accent2);}
.c-low{background:#fbcfe8;color:#9d174d;}
.c-empty{background:#f1f5f9;color:#94a3b8;}
.c-lock{background:#7c3aed;}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);}
.mlegend span{display:flex;align-items:center;gap:5px;}
.mlegend i{width:13px;height:13px;border-radius:4px;display:inline-block;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 0;}
.tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl-item.done::before{background:var(--ok);box-shadow:0 0 0 2px #a7f3d0;}
.tl-item.wait::before{background:var(--warn);box-shadow:0 0 0 2px #fde68a;}
.tl-item .tl-t{font-size:11px;color:var(--muted);font-weight:600;}
.tl-item .tl-b{font-size:13px;font-weight:700;margin-top:2px;}
.tl-item .tl-d{font-size:12px;color:var(--muted);margin-top:2px;}
.port{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);min-width:0;}
.port .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.port .ph b{font-weight:800;font-size:15px;}
.port .pmeta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px;}
.port .pmeta b{color:var(--ink);}
.exc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin-bottom:10px;min-width:0;}
.exc .eic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
.exc .eic .material-symbols-outlined{font-size:22px;color:#fff;}
.exc .etxt{min-width:0;flex:1;}
.exc .etxt b{font-size:14px;font-weight:700;display:block;}
.exc .etxt span{font-size:12px;color:var(--muted);}
.exc .ecnt{font-size:20px;font-weight:800;flex:none;}
.sev-hi{background:var(--bad);}.sev-mid{background:var(--warn);}.sev-lo{background:var(--info);}
.stat-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;}
.stat-row .s{min-width:0;}
.stat-row .s b{font-size:20px;font-weight:800;display:block;}
.stat-row .s span{font-size:11px;color:var(--muted);}
.pri{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;}
.pri.p1{color:var(--bad);}.pri.p2{color:var(--warn);}.pri.p3{color:var(--muted);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--soft);color:var(--accent);border:1px solid var(--line);}
.chip.act{background:var(--accent);color:#fff;}
@media(max-width:1080px){
  .veh-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:860px){
  .g4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:820px){
  .g4,.g3,.g2,.split-2-1,.split-1-2,.veh-grid{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button span.lab{display:none;}
  .nav button{padding:8px 11px;}
  .g4{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div class="brand-txt"><b>AMHS 智慧搬運</b><span>Automated Material Handling System</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main id="app"></main>

<script>
"use strict";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(el,opt){if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);return c;}

var MODS=[
  {icon:"assignment",name:"搬運任務調度"},
  {icon:"precision_manufacturing",name:"車隊監控"},
  {icon:"route",name:"路徑優化"},
  {icon:"warehouse",name:"Stocker 儲位"},
  {icon:"swap_horiz",name:"交遞站對接"},
  {icon:"report",name:"異常處理"}
];

function kpiCard(ic,v,u,l){
  return '<div class="kpi"><div class="k-ico"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="k-val">'+v+'<small>'+u+'</small></div><div class="k-lab">'+l+'</div></div>';
}

/* ============ SCREEN 0 : 搬運任務調度 ============ */
function s0(c){
  var kpis=[
    {ic:"pending_actions",v:"128",u:"件",l:"待派工任務",d:"+14",up:false},
    {ic:"local_shipping",v:"342",u:"件",l:"今日搬運總量",d:"+8%",up:true},
    {ic:"schedule",v:"3.2",u:"分",l:"平均等待時間",d:"-0.7",up:true},
    {ic:"verified",v:"97.4",u:"%",l:"搬運及時率",d:"+2.1",up:true}
  ];
  var rows=[
    ["MV-24081","黃光區 PH-03","Stocker ST-A2","FOUP×2","P1",92,"派工中","t-run"],
    ["MV-24082","蝕刻 ET-07","黃光區 PH-01","FOUP×1","P1",78,"待派工","t-wait"],
    ["MV-24083","量測 MT-02","擴散 DF-05","Cassette×3","P2",55,"待派工","t-wait"],
    ["MV-24084","擴散 DF-05","Stocker ST-B1","FOUP×4","P2",40,"待派工","t-wait"],
    ["MV-24085","出貨暫存 OUT","封裝 PK-01","Reticle×1","P3",22,"排程中","t-info"],
    ["MV-24086","黃光 PH-02","蝕刻 ET-03","FOUP×2","P3",15,"排程中","t-info"]
  ];
  var priMap={"P1":"p1","P2":"p2","P3":"p3"};
  var html='<div class="screen-head"><div class="ttl"><h2><span class="material-symbols-outlined">assignment</span>搬運任務調度中心</h2>'+
    '<p>彙整 MES／WMS 觸發之搬運需求，依優先序與截止時間自動排入派工佇列</p></div>'+
    '<div class="badge">流程 v0 · 搬運需求產生</div></div>';
  html+='<div class="g4">';
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    html+='<div class="kpi"><div class="k-ico"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
      '<div class="k-val">'+k.v+'<small>'+k.u+'</small></div><div class="k-lab">'+k.l+'</div>'+
      '<div class="k-delta '+(k.up?"up":"down")+'"><span class="material-symbols-outlined">'+(k.up?"trending_up":"trending_down")+'</span>'+k.d+'</div></div>';
  }
  html+='</div>';
  html+='<div class="split-2-1 mt14">';
  html+='<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>待派工任務佇列<small>依優先序排列</small></h3><div class="scroll"><table><thead><tr>'+
    '<th>任務單號</th><th>起點</th><th>終點</th><th>載具</th><th>優先序</th><th>就緒度</th><th>狀態</th></tr></thead><tbody>';
  for(var r=0;r<rows.length;r++){var x=rows[r];
    html+='<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td>'+
      '<td><span class="pri '+priMap[x[4]]+'"><span class="material-symbols-outlined" style="font-size:14px">flag</span>'+x[4]+'</span></td>'+
      '<td><div class="bar"><i style="width:'+x[5]+'%"></i></div></td>'+
      '<td><span class="tag '+x[7]+'">'+x[6]+'</span></td></tr>';
  }
  html+='</tbody></table></div></div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>任務優先序分布</h3><div id="c0pie" class="chart sm"></div>'+
    '<div class="stat-row"><div class="s"><b>128</b><span>待派工</span></div><div class="s"><b>46</b><span>執行中</span></div><div class="s"><b>168</b><span>已完成</span></div></div></div>';
  html+='</div>';
  html+='<div class="card mt14"><h3><span class="material-symbols-outlined">timeline</span>近 12 小時搬運需求量與派工完成量</h3><div id="c0line" class="chart"></div></div>';
  c.innerHTML=html;
  void c.offsetHeight;
  mkChart(document.getElementById("c0pie"),{
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["45%","70%"],center:["50%","42%"],
      label:{show:true,formatter:"{b}\n{d}%",fontSize:10},
      data:[{value:34,name:"P1 緊急"},{value:52,name:"P2 一般"},{value:42,name:"P3 排程"}],
      color:["#db2777","#f472b6","#fbcfe8"]}]
  });
  var hrs=["06","07","08","09","10","11","12","13","14","15","16","17"];
  mkChart(document.getElementById("c0line"),{
    tooltip:{trigger:"axis"},
    legend:{data:["搬運需求","派工完成"],top:0,textStyle:{fontSize:11}},
    grid:{left:40,right:16,top:34,bottom:28},
    xAxis:{type:"category",data:hrs,axisLine:{lineStyle:{color:"#d9c2d0"}}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#f0dbe7"}}},
    series:[
      {name:"搬運需求",type:"bar",data:[24,31,38,42,35,40,28,33,45,39,30,26],itemStyle:{color:"#f9a8d4",borderRadius:[4,4,0,0]}},
      {name:"派工完成",type:"line",smooth:true,data:[22,29,35,40,34,38,27,31,43,38,29,25],itemStyle:{color:"#db2777"},areaStyle:{color:"rgba(219,39,119,.1)"}}
    ]
  });
}

/* ============ SCREEN 1 : AGV/OHT 車隊監控 ============ */
function s1(c){
  var fleet=[
    {id:"OHT-01",st:"搬運中",dot:"p",task:"MV-24081",batt:82,bc:"#059669",loc:"黃光環軌 P3",spd:"1.4 m/s"},
    {id:"OHT-02",st:"搬運中",dot:"p",task:"MV-24079",batt:64,bc:"#059669",loc:"蝕刻環軌 E1",spd:"1.2 m/s"},
    {id:"OHT-03",st:"待命",dot:"g",task:"—",batt:96,bc:"#059669",loc:"充電站 CS-2",spd:"0 m/s"},
    {id:"AGV-11",st:"搬運中",dot:"p",task:"MV-24083",batt:48,bc:"#d97706",loc:"量測走道 M2",spd:"0.9 m/s"},
    {id:"AGV-12",st:"充電中",dot:"y",task:"—",batt:31,bc:"#d97706",loc:"充電站 CS-1",spd:"0 m/s"},
    {id:"AGV-13",st:"待命",dot:"g",task:"—",batt:88,bc:"#059669",loc:"擴散待命區",spd:"0 m/s"},
    {id:"AGV-14",st:"異常",dot:"r",task:"MV-24077",batt:57,bc:"#dc2626",loc:"交會口 X-04",spd:"0 m/s"},
    {id:"OHT-04",st:"搬運中",dot:"p",task:"MV-24085",batt:73,bc:"#059669",loc:"封裝環軌 K1",spd:"1.5 m/s"}
  ];
  var html='<div class="screen-head"><div class="ttl"><h2><span class="material-symbols-outlined">precision_manufacturing</span>AGV／OHT 車隊即時監控</h2>'+
    '<p>依任務優先序與電量狀態自動派車，即時追蹤搬運車狀態、位置與載具</p></div>'+
    '<div class="badge">流程 v1 · 派車調度</div></div>';
  html+='<div class="g4">'+
    kpiCard("directions_car","8","台","車隊總數")+
    kpiCard("bolt","5","台","搬運中")+
    kpiCard("battery_charging_full","2","台","充電／待命")+
    kpiCard("error","1","台","異常待處理")+'</div>';
  html+='<div class="card mt14"><h3><span class="material-symbols-outlined">grid_view</span>車隊狀態看板<small>即時更新</small></h3><div class="veh-grid">';
  for(var i=0;i<fleet.length;i++){var f=fleet[i];
    html+='<div class="veh"><div class="vh"><div class="vid"><span class="material-symbols-outlined">'+(f.id.indexOf("OHT")===0?"conveyor_belt":"agriculture")+'</span></div>'+

var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var nav=document.getElementById("nav");var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="lab">'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("button");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  disposeCharts();
  var app=document.getElementById("app");
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i](app);
}
buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
