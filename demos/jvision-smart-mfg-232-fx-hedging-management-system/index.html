<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外幣避險管理系統（FX Hedging Management System）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --good:#4ADE80;
  --warn:#FBBF24;
  --bad:#F87171;
  --info:#38BDF8;
  --radius:8px;
  --shadow:0 14px 30px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(51,65,85,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.08) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Fira Sans",system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
.msi{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.topnav{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:1px solid var(--color-border);
  background:rgba(2,6,23,.94);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
  backdrop-filter:blur(14px);
}
.navwrap{
  width:min(1440px,100%);
  min-width:0;
  margin:auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{
  min-width:214px;
  display:flex;
  align-items:center;
  gap:11px;
}
.logo{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:1px solid #3F5268;
  border-radius:7px;
  background:var(--color-secondary);
  color:var(--color-accent);
}
.brand b{
  display:block;
  font-family:"Fira Code",monospace;
  font-size:15px;
  letter-spacing:-.02em;
}
.brand small{
  display:block;
  margin-top:1px;
  color:#AEBBCD;
  font-size:11px;
}
.navbtns{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}
.navbtns button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#AEBBCD;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
}
.navbtns button:hover{
  border-color:var(--color-border);
  background:var(--color-muted);
  color:#FFF;
  transform:translateY(-1px);
}
.navbtns button.on{
  border-color:#4ADE80;
  background:var(--color-accent);
  color:var(--color-on-accent);
}
.navbtns button:focus-visible,
button:focus-visible,
[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
main{
  width:min(1440px,100%);
  min-width:0;
  margin:auto;
  padding:28px 24px 64px;
}
.shead{
  min-width:0;
  margin:0 0 24px;
  padding-bottom:20px;
  display:flex;
  align-items:flex-start;
  gap:14px;
  border-bottom:1px solid var(--color-border);
}
.sic{
  width:46px;
  height:46px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:1px solid #365068;
  border-radius:7px;
  background:var(--color-secondary);
  color:var(--color-accent);
  font-size:25px;
}
.shead h1{
  margin:0;
  font-size:clamp(20px,2.2vw,27px);
  font-weight:600;
  line-height:1.25;
  letter-spacing:-.025em;
}
.shead p{
  max-width:780px;
  margin:5px 0 0;
  color:#AEBBCD;
  font-size:13px;
}
.tag{
  min-height:32px;
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border:1px solid var(--color-border);
  border-radius:999px;
  background:var(--color-muted);
  color:#DCE4EE;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:500;
  white-space:nowrap;
}
.grid{min-width:0;display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{
  min-width:0;
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(30,41,59,.25),transparent 55%),var(--color-card);
  box-shadow:0 1px 0 rgba(255,255,255,.025);
  transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.card:hover,.kpi:hover{
  border-color:#4B6078;
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}
.card{padding:17px}
.card h3{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#F8FAFC;
  font-size:14px;
  font-weight:600;
}
.card h3 .msi{color:var(--color-accent)}
.kpi{
  position:relative;
  min-height:138px;
  padding:16px 16px 15px;
  overflow:hidden;
}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--color-accent);
}
.kpi:after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  right:-45px;
  top:-55px;
  border:1px solid rgba(74,222,128,.13);
  transform:rotate(45deg);
}
.kl{
  color:#AEBBCD;
  font-size:12px;
  font-weight:500;
  letter-spacing:.02em;
}
.kv{
  margin-top:10px;
  color:#FFF;
  font-family:"Fira Code",monospace;
  font-size:clamp(18px,2vw,25px);
  font-weight:600;
  letter-spacing:-.05em;
  line-height:1.2;
}
.kd{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:500;
}
.kd:before{
  font-family:"Material Symbols Outlined";
  font-size:15px;
}
.up{color:var(--good)}
.down{color:var(--bad)}
.flat{color:#B7C2D0}
.kd.up:before{content:"check_circle"}
.kd.down:before{content:"warning"}
.kd.flat:before{content:"info"}
.chartbox{position:relative;width:100%;overflow:hidden}
.tw{
  max-width:100%;
  overflow:auto;
  border:1px solid var(--color-border);
  border-radius:6px;
  scrollbar-color:#475569 #111827;
}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:12.5px;
}
thead th{
  padding:10px 12px;
  border-bottom:1px solid #475569;
  background:#151C2E;
  color:#C7D2E0;
  text-align:left;
  font-size:11px;
  font-weight:600;
  letter-spacing:.025em;
  white-space:nowrap;
}
tbody td{
  padding:11px 12px;
  border-bottom:1px solid rgba(51,65,85,.72);
  color:#E5EAF1;
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#171E30}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
thead th:nth-last-child(-n+4),
tbody td:nth-last-child(-n+4){text-align:right}
.mono,.cur,.rp,.ts{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.pill:before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 auto;
  border-radius:50%;
  background:currentColor;
}
.p-g{border-color:#236A43;background:#102B21;color:#7EE2A8}
.p-y{border-color:#70591B;background:#2B2412;color:#F9D26C}
.p-r{border-color:#783C42;background:#30171E;color:#FF9B9B}
.p-b{border-color:#256282;background:#10283A;color:#7DD3FC}
.p-n{border-color:#475569;background:#1E293B;color:#CBD5E1}
.cur{
  display:inline-block;
  padding:2px 7px;
  border:1px solid #336047;
  border-radius:4px;
  background:#10271D;
  color:#86EFAC;
  font-size:11px;
  font-weight:600;
}
.board{
  min-width:980px;
  display:grid;
  grid-template-columns:repeat(4,minmax(220px,1fr));
  gap:12px;
}
.col{
  min-width:0;
  padding:11px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:#090E1D;
}
.ch{
  min-height:35px;
  margin-bottom:8px;
  padding:2px 3px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--color-border);
  font-size:12px;
  font-weight:600;
}
.cnt{
  min-width:24px;
  padding:2px 7px;
  border:1px solid var(--color-border);
  border-radius:999px;
  color:#CBD5E1;
  font:500 10px "Fira Code",monospace;
  text-align:center;
}
.kc{
  min-width:0;
  margin-bottom:9px;
  padding:11px;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-accent);
  border-radius:6px;
  background:var(--color-card);
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}
.kc:hover{
  border-color:#64748B;
  background:#141A2B;
  transform:translateY(-1px);
}
.kc:last-child{margin-bottom:0}
.kt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  font-weight:600;
}
.km{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:5px 12px;
  color:#AEBBCD;
  font-size:10.5px;
}
.km span{display:inline-flex;align-items:center;gap:4px}
.kb{
  height:5px;
  margin-top:9px;
  overflow:hidden;
  border-radius:0;
  background:#263247;
}
.kb>i,.rbar>i{display:block;height:100%}
.tl{
  position:relative;
  padding-left:26px;
}
.tl:before{
  content:"";
  position:absolute;
  left:7px;
  top:4px;
  bottom:6px;
  width:1px;
  background:#475569;
}
.it{
  position:relative;
  padding:0 0 18px;
}
.it:last-child{padding-bottom:0}
.it:before{
  content:"";
  position:absolute;
  left:-23px;
  top:3px;
  width:9px;
  height:9px;
  border:2px solid var(--color-card);
  border-radius:50%;
  background:var(--color-accent);
  box-shadow:0 0 0 1px #4ADE80;
}
.tt{font-size:12.5px;font-weight:600}
.td{margin-top:3px;color:#B7C2D0;font-size:11.5px}
.ts{margin-top:4px;color:#8FA0B5;font-size:10px}
.rrow{
  min-width:0;
  padding:10px 0;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(51,65,85,.7);
}
.rrow:last-child{border-bottom:0}
.rn{
  width:65px;
  flex:0 0 auto;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:600;
}
.rbar{
  min-width:0;
  height:7px;
  flex:1;
  overflow:hidden;
  background:#263247;
}
.rp{
  width:100px;
  flex:0 0 auto;
  color:#D9E2EC;
  text-align:right;
  font-size:10.5px;
  font-weight:600;
}
.note{
  margin-top:11px;
  display:flex;
  align-items:flex-start;
  gap:7px;
  color:#AEBBCD;
  font-size:11px;
}
.note .msi{
  flex:0 0 auto;
  color:var(--info);
  font-size:16px;
}
.legwrap{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:9px 14px;
  color:#AEBBCD;
  font-size:11px;
}
.legwrap span{display:inline-flex;align-items:center;gap:6px}
.dot{
  width:8px;
  height:8px;
  display:inline-block;
  flex:0 0 auto;
  border-radius:2px;
}
.big{
  font-family:"Fira Code",monospace;
  font-size:32px;
  font-weight:600;
  letter-spacing:-.06em;
}
.sub{color:#AEBBCD;font-size:11px}
.foot{
  width:min(1440px,100%);
  margin:auto;
  padding:18px 24px 38px;
  border-top:1px solid rgba(51,65,85,.65);
  color:#8FA0B5;
  font-size:10.5px;
  text-align:center;
}
.view-enter{animation:viewEnter .35s ease both}
@keyframes viewEnter{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .navwrap{align-items:flex-start;flex-direction:column;gap:8px}
  .navbtns{width:100%;margin-left:0;overflow-x:auto;padding-bottom:2px}
  .navbtns button{flex:0 0 auto}
  .topnav{position:relative}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .shead{flex-wrap:wrap}
  .tag{margin-left:60px}
}
@media(max-width:560px){
  .navwrap,main{padding-left:15px;padding-right:15px}
  .brand{min-width:0}
  .navbtns button{min-width:43px;justify-content:center;padding:8px 10px}
  .navbtns .lbl{display:none}
  .navbtns .msi{font-size:21px}
  .g4{grid-template-columns:1fr}
  .shead{gap:11px}
  .shead p{font-size:12px}
  .tag{width:100%;margin-left:0;justify-content:center}
  .card{padding:14px}
  .kpi{min-height:124px}
  .foot{padding-left:15px;padding-right:15px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .view-enter{animation:none}
  .card:hover,.kpi:hover,.kc:hover,.navbtns button:hover{transform:none}
}
</style>
</head>
<body>
<nav class="topnav" aria-label="主要功能">
  <div class="navwrap">
    <div class="brand">
      <div class="logo msi" aria-hidden="true">currency_exchange</div>
      <div><b>FX HEDGING</b><small>外幣避險管理系統</small></div>
    </div>
    <div class="navbtns" id="nav"></div>
  </div>
</nav>
<main id="app" tabindex="-1"></main>
<footer class="foot">純 UI 系統展示（無後端）；畫面與資料皆為擬真示範。© 外幣避險管理系統 FX Hedging Management System</footer>
<script>
"use strict";
var NAV=[
  {i:0,ic:"account_tree",t:"曝險彙總"},
  {i:1,ic:"monitoring",t:"避險看板"},
  {i:2,ic:"request_quote",t:"交易管理"},
  {i:3,ic:"rule",t:"比率策略"},
  {i:4,ic:"trending_up",t:"評價損益"},
  {i:5,ic:"fact_check",t:"避險稽核"}
];
var charts={};
var CCY=[
  {c:"USD",name:"美元",exp:12480000,hedged:8600000,ratio:.69,net:"應收"},
  {c:"JPY",name:"日圓",exp:-9200000,hedged:5400000,ratio:.59,net:"應付"},
  {c:"EUR",name:"歐元",exp:6350000,hedged:5200000,ratio:.82,net:"應收"},
  {c:"CNY",name:"人民幣",exp:-4180000,hedged:1900000,ratio:.45,net:"應付"},
  {c:"AUD",name:"澳幣",exp:2260000,hedged:1600000,ratio:.71,net:"應收"}
];
function el(id){return document.getElementById(id)}
function money(n){return Number(n).toLocaleString("en-US")}
function destroyChart(k){
  if(charts[k]){
    try{charts[k].destroy()}catch(e){}
    charts[k]=null;
  }
}
function statusIcon(cls){
  return cls==="up"?"check_circle":cls==="down"?"warning":"info";
}
function kpiCard(l,v,d,cls,ic){
  return '<div class="kpi"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">'+
    '<div class="kl">'+l+'</div><span class="msi" aria-hidden="true" style="color:#4ADE80">'+ic+'</span></div>'+
    '<div class="kv">'+v+'</div><div class="kd '+cls+'"><span class="msi" aria-hidden="true">'+statusIcon(cls)+'</span>'+d+'</div></div>';
}
function baseChart(){
  return{
    color:"#CBD5E1",
    borderColor:"rgba(51,65,85,.75)",
    font:{family:"Fira Sans"}
  };
}
Chart.defaults.color="#AEBBCD";
Chart.defaults.font.family="Fira Sans";
Chart.defaults.borderColor="rgba(51,65,85,.72)";

function screen0(){
  var totExp=0,totHedge=0,rows="";
  CCY.forEach(function(r){
    totExp+=Math.abs(r.exp);
    totHedge+=r.hedged;
    var g=Math.abs(r.exp)-r.hedged;
    var pc=Math.round(r.ratio*100);
    var pcls=pc>=70?"p-g":pc>=50?"p-y":"p-r";
    var netcls=r.net==="應收"?"p-b":"p-n";
    rows+='<tr><td><b class="mono">'+r.c+'</b> <span class="sub">'+r.name+'</span></td>'+
      '<td><span class="pill '+netcls+'">'+r.net+'</span></td>'+
      '<td class="mono">'+money(Math.abs(r.exp))+'</td>'+
      '<td class="mono">'+money(r.hedged)+'</td>'+
      '<td class="mono">'+money(g)+'</td>'+
      '<td><span class="pill '+pcls+'">'+pc+'%</span></td></tr>';
  });
  var gap=totExp-totHedge;
  return{
    head:{ic:"account_tree",t:"外幣曝險彙總",p:"多幣別收付匯部位淨額(Exposure Netting)彙整，辨識待避險缺口。",tag:"會計專員 · v0"},
    html:
      '<div class="grid g4" style="margin-bottom:16px">'+
      kpiCard("總曝險部位","NT$ "+money(totExp),"5 幣別淨額彙總","flat","layers")+
      kpiCard("已避險金額","NT$ "+money(totHedge),"整體避險比率 68%","up","verified_user")+
      kpiCard("未避險缺口","NT$ "+money(gap),"較上週 -6.4%","down","report_problem")+
      kpiCard("匯率評估損益","NT$ +123,000","本月累計 MtM","up","trending_up")+
      '</div><div class="grid g21">'+
      '<section class="card"><h3><span class="msi" aria-hidden="true">table_chart</span>各幣別曝險與避險彙總</h3>'+

function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var i=m?Math.min(Number(m[1]),SCREENS.length-1):0;
  show(i);
  try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
