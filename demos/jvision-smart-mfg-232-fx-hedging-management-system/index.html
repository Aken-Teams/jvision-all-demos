<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>外幣避險管理系統（FX Hedging Management System）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0891b2;--accent2:#22d3ee;--ink:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--bg:#f1f5f9;--card:#ffffff;--soft:#ecfeff;
  --good:#059669;--warn:#d97706;--bad:#dc2626;--radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topnav{
  position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#083344,#0891b2 65%,#0e7490);
  color:#fff;box-shadow:0 2px 14px rgba(8,51,68,.28);
}
.navwrap{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand small{display:block;font-size:11px;opacity:.8;font-weight:500;white-space:nowrap;}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.navbtns button{
  display:flex;align-items:center;gap:6px;border:0;cursor:pointer;
  background:rgba(255,255,255,.10);color:#e0f2fe;padding:8px 12px;border-radius:9px;
  font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0;
}
.navbtns button:hover{background:rgba(255,255,255,.22);}
.navbtns button.on{background:#fff;color:#0e7490;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.navbtns button .msi{font-size:19px;}
main{max-width:1280px;margin:0 auto;padding:22px 18px 60px;min-width:0;}
.shead{display:flex;align-items:flex-start;gap:14px;margin:2px 0 20px;flex-wrap:wrap;min-width:0;}
.shead .sic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;}
.shead h1{font-size:21px;margin:0;font-weight:800;}
.shead p{margin:2px 0 0;color:var(--muted);font-size:13px;}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:#0e7490;border:1px solid #a5f3fc;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .msi{font-size:19px;color:var(--accent);}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.g12{grid-template-columns:1fr 2fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;}
}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .kv{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
.kpi .kd{font-size:12px;margin-top:4px;font-weight:600;}
.up{color:var(--good);}.down{color:var(--bad);}.flat{color:var(--muted);}
.chartbox{position:relative;width:100%;overflow:hidden;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
thead th{background:#f8fafc;text-align:left;padding:10px 12px;font-weight:700;color:#475569;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover{background:#f8fafc;}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.p-g{background:#dcfce7;color:#166534;}
.p-y{background:#fef3c7;color:#92400e;}
.p-r{background:#fee2e2;color:#991b1b;}
.p-b{background:#cffafe;color:#155e75;}
.p-n{background:#e2e8f0;color:#475569;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px;padding:2px 4px;}
.col .ch .cnt{background:#e2e8f0;color:#475569;border-radius:999px;padding:1px 9px;font-size:11px;}
.kc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:10px 11px;margin-bottom:9px;min-width:0;}
.kc:last-child{margin-bottom:0;}
.kc .kt{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.kc .cur{font-family:"Inter",monospace;background:var(--soft);color:#0e7490;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;flex:0 0 auto;}
.kc .km{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:5px 12px;}
.kc .kb{margin-top:8px;height:6px;border-radius:4px;background:#e2e8f0;overflow:hidden;}
.kc .kb>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 0;}
.tl .it:last-child{padding-bottom:0;}
.tl .it::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl .it .tt{font-size:13px;font-weight:700;}
.tl .it .td{font-size:12px;color:var(--muted);margin-top:2px;}
.tl .it .ts{font-size:11px;color:#94a3b8;font-family:"Inter",monospace;}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed #eef2f7;min-width:0;}
.rrow:last-child{border-bottom:0;}
.rrow .rn{width:64px;font-weight:700;font-size:13px;flex:0 0 auto;}
.rbar{flex:1;height:9px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:0;}
.rbar>i{display:block;height:100%;border-radius:6px;}
.rrow .rp{width:96px;text-align:right;font-size:12px;font-family:"Inter",monospace;font-weight:700;flex:0 0 auto;}
.note{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:flex-start;}
.note .msi{font-size:16px;color:var(--accent);flex:0 0 auto;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.legwrap{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;}
.legwrap span{display:inline-flex;align-items:center;gap:5px;}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;}
.sub{font-size:12px;color:var(--muted);}
.foot{max-width:1280px;margin:0 auto;padding:16px 18px 40px;color:#94a3b8;font-size:12px;text-align:center;}
@media(max-width:560px){
  .navbtns button span.lbl{display:none;}
  .navbtns button{padding:8px 10px;}
  .brand small{display:none;}
}
</style>
</head>
<body>
<nav class="topnav">
  <div class="navwrap">
    <div class="brand">
      <div class="logo msi">currency_exchange</div>
      <div>
        <b>FX Hedging</b>
        <small>外幣避險管理系統</small>
      </div>
    </div>
    <div class="navbtns" id="nav"></div>
  </div>
</nav>
<main id="app"></main>
<div class="foot">純 UI 系統展示（無後端）；畫面與資料皆為擬真示範。© 外幣避險管理系統 FX Hedging Management System</div>

<script>
"use strict";
var NAV=[
  {i:0,ic:"account_tree",t:"曝險彙總"},
  {i:1,ic:"monitoring",t:"避險看板"},
  {i:2,ic:"request_quote",t:"交易管理"},
  {i:3,ic:"rule",t:"比率策略"},
  {i:4,ic:"trending_up",t:"評價損益"},
  {i:5,ic:"fact_check",t:"避險稽核"}
];
var charts={};
function destroyChart(k){ if(charts[k]){ try{charts[k].destroy();}catch(e){} charts[k]=null; } }
function el(id){ return document.getElementById(id); }
function money(n){ return n.toLocaleString("en-US"); }

var CCY=[
  {c:"USD",name:"美元",exp:12480000,hedged:8600000,ratio:0.69,net:"應收"},
  {c:"JPY",name:"日圓",exp:-9200000,hedged:5400000,ratio:0.59,net:"應付"},
  {c:"EUR",name:"歐元",exp:6350000,hedged:5200000,ratio:0.82,net:"應收"},
  {c:"CNY",name:"人民幣",exp:-4180000,hedged:1900000,ratio:0.45,net:"應付"},
  {c:"AUD",name:"澳幣",exp:2260000,hedged:1600000,ratio:0.71,net:"應收"}
];

function kpiCard(l,v,d,cls,ic){
  return '<div class="kpi"><div style="display:flex;justify-content:space-between;align-items:flex-start">'+
    '<div class="kl">'+l+'</div><span class="msi" style="color:#22d3ee;font-size:20px">'+ic+'</span></div>'+
    '<div class="kv">'+v+'</div><div class="kd '+cls+'">'+d+'</div></div>';
}

function screen0(){
  var totExp=0,totHedge=0,gap=0;
  for(var i=0;i<CCY.length;i++){ totExp+=Math.abs(CCY[i].exp); totHedge+=CCY[i].hedged; }
  gap=totExp-totHedge;
  var rows="";
  for(var j=0;j<CCY.length;j++){
    var r=CCY[j];
    var g=Math.abs(r.exp)-r.hedged;
    var pc=Math.round(r.ratio*100);
    var pcls=pc>=70?"p-g":pc>=50?"p-y":"p-r";
    var netcls=r.net==="應收"?"p-b":"p-n";
    rows+='<tr><td><b>'+r.c+'</b> <span class="sub">'+r.name+'</span></td>'+
      '<td><span class="pill '+netcls+'">'+r.net+'</span></td>'+
      '<td class="mono">'+money(Math.abs(r.exp))+'</td>'+
      '<td class="mono">'+money(r.hedged)+'</td>'+
      '<td class="mono">'+money(g)+'</td>'+
      '<td><span class="pill '+pcls+'">'+pc+'%</span></td></tr>';
  }
  return {
    head:{ic:"account_tree",t:"外幣曝險彙總",p:"多幣別收付匯部位淨額(Exposure Netting)彙整，辨識待避險缺口。",tag:"會計專員 · v0"},
    html:
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpiCard("總曝險部位","NT$ "+money(totExp),"5 幣別淨額彙總","flat","layers")+
      kpiCard("已避險金額","NT$ "+money(totHedge),"整體避險比率 68%","up","verified_user")+
      kpiCard("未避險缺口","NT$ "+money(gap),"較上週 -6.4%","down","report_problem")+
      kpiCard("匯率評估損益","NT$ +123,000","本月累計 MtM","up","trending_up")+
    '</div>'+
    '<div class="grid g21">'+
      '<div class="card"><h3><span class="msi">table_chart</span>各幣別曝險與避險彙總</h3>'+
        '<div class="tw"><table><thead><tr><th>幣別</th><th>淨部位</th><th>曝險金額(TWD)</th><th>已避險(TWD)</th><th>缺口(TWD)</th><th>避險比率</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<div class="note"><span class="msi">info</span>缺口 = 曝險金額 − 已避險金額；避險比率低於 50% 之幣別將於看板優先提示。</div>'+
      '</div>'+
      '<div class="card"><h3><span class="msi">donut_large</span>曝險幣別占比</h3>'+
        '<div class="chartbox" style="height:220px"><canvas id="c0pie"></canvas></div>'+
        '<div class="legwrap" id="c0leg"></div>'+
      '</div>'+
    '</div>',
    init:function(){
      var labels=[],data=[],colors=["#0891b2","#22d3ee","#0e7490","#67e8f9","#155e75"];
      for(var k=0;k<CCY.length;k++){ labels.push(CCY[k].c); data.push(Math.abs(CCY[k].exp)); }
      destroyChart("c0pie");
      charts["c0pie"]=new Chart(el("c0pie"),{
        type:"doughnut",
        data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:2,borderColor:"#fff"}]},
        options:{maintainAspectRatio:false,responsive:true,cutout:"58%",plugins:{legend:{display:false}}}
      });
      var lg="";
      for(var m=0;m<labels.length;m++){ lg+='<span><i class="dot" style="background:'+colors[m]+'"></i>'+labels[m]+'</span>'; }
      el("c0leg").innerHTML=lg;
    }
  };
}

function screen1(){
  var cols=[
    {t:"待避險缺口",cls:"#dc2626",items:[
      {c:"USD",tit:"設備進口款",d:"到期 T+30",amt:"3,880,000",ratio:31,ref:"缺口優先"},
      {c:"CNY",tit:"原料採購應付",d:"到期 T+45",amt:"2,280,000",ratio:45,ref:"低於門檻"}
    ]},
    {t:"策略研判中",cls:"#d97706",items:[
      {c:"JPY",tit:"日系零件應付",d:"波動率 9.1%",amt:"3,800,000",ratio:59,ref:"選擇權評估"},
      {c:"AUD",tit:"外銷貨款應收",d:"到期 T+60",amt:"660,000",ratio:71,ref:"遠期補足"}
    ]},
    {t:"下單處理",cls:"#0891b2",items:[
      {c:"EUR",tit:"歐洲外銷應收",d:"詢價 3 家",amt:"1,150,000",ratio:82,ref:"待成交"}
    ]},
    {t:"已避險",cls:"#059669",items:[
      {c:"USD",tit:"美系外銷貨款",d:"遠期已成交",amt:"8,600,000",ratio:100,ref:"FWD-2214"},
      {c:"EUR",tit:"授權金收入",d:"買權已成交",amt:"5,200,000",ratio:100,ref:"OPT-1180"}
    ]}
  ];
  var board="";
  for(var i=0;i<cols.length;i++){
    var col=cols[i],cards="";
    for(var j=0;j<col.items.length;j++){
      var it=col.items[j];
      cards+='<div class="kc" style="border-left-color:'+col.cls+'">'+
        '<div class="kt"><span>'+it.tit+'</span><span class="cur">'+it.c+'</span></div>'+
        '<div class="km"><span><span class="msi" style="font-size:14px">schedule</span>'+it.d+'</span><span><span class="msi" style="font-size:14px">payments</span>NT$ '+it.amt+'</span></div>'+
        '<div class="km"><span><span class="msi" style="font-size:14px">bookmark</span>'+it.ref+'</span></div>'+
        '<div class="kb"><i style="width:'+it.ratio+'%;background:'+col.cls+'"></i></div>'+
      '</div>';
    }
    board+='<div class="col"><div class="ch"><span>'+col.t+'</span><span class="cnt">'+col.items.length+'</span></div>'+cards+'</div>';
  }
  return {
    head:{ic:"monitoring",t:"避險看板",p:"各幣別避險缺口、策略研判到成交的即時流轉看板。",tag:"財務經理 · v1"},
    html:
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpiCard("整體避險比率","68%","目標區間 60–80%","up","speed")+
      kpiCard("待避險缺口","2 筆","合計 NT$ 6.16M","down","report_problem")+
      kpiCard("本週新增避險","4 筆","名目 NT$ 11.6M","up","add_task")+
      kpiCard("逾門檻幣別","2","USD / CNY 待補足","flat","warning")+
    '</div>'+
    '<div class="card"><h3><span class="msi">view_kanban</span>避險作業看板</h3>'+
      '<div style="overflow-x:auto"><div class="board">'+board+'</div></div>'+
      '<div class="note"><span class="msi">info</span>卡片左側色條與底部進度代表該筆部位之避險完成度；跨欄流轉代表避險策略推進階段。</div>'+
    '</div>',
    init:function(){}
  };
}

function screen2(){
  var deals=[
    {id:"FWD-2214",c:"USD",type:"遠期",dir:"賣出",notional:"8,600,000",rate:"31.28",mat:"2026-09-30",bank:"第一銀行",st:"已成交",stc:"p-g"},
    {id:"OPT-1180",c:"EUR",type:"買權",dir:"買入",notional:"5,200,000",rate:"34.05",mat:"2026-10-15",bank:"中國信託",st:"已成交",stc:"p-g"},
    {id:"FWD-2231",c:"EUR",type:"遠期",dir:"賣出",notional:"1,150,000",rate:"34.20",mat:"2026-08-28",bank:"玉山銀行",st:"詢價中",stc:"p-y"},
    {id:"OPT-1195",c:"JPY",type:"賣權",dir:"買入",notional:"3,800,000",rate:"0.2071",mat:"2026-11-05",bank:"台北富邦",st:"待核定",stc:"p-b"},
    {id:"FWD-2240",c:"USD",type:"遠期",dir:"賣出",notional:"3,880,000",rate:"31.35",mat:"2026-09-15",bank:"兆豐銀行",st:"待下單",stc:"p-n"},
    {id:"FWD-2205",c:"AUD",type:"遠期",dir:"賣出",notional:"1,600,000",rate:"20.48",mat:"2026-08-20",bank:"國泰世華",st:"已成交",stc:"p-g"}
  ];
  var rows="";
  for(var i=0;i<deals.length;i++){
    var d=deals[i];
    var tc=d.type==="遠期"?"p-b":"p-y";
    rows+='<tr><td class="mono"><b>'+d.id+'</b></td>'+
      '<td><span class="cur">'+d.c+'</span></td>'+
      '<td><span class="pill '+tc+'">'+d.type+'</span></td>'+
      '<td>'+d.dir+'</td>'+
      '<td class="mono">'+d.notional+'</td>'+
      '<td class="mono">'+d.rate+'</td>'+
      '<td class="mono">'+d.mat+'</td>'+
      '<td>'+d.bank+'</td>'+
      '<td><span class="pill '+d.stc+'">'+d.st+'</span></td></tr>';
  }
  var tls=[
    {t:"FWD-2214 遠期外匯成交確認",d:"USD 8.6M 賣出 @ 31.28，第一銀行",s:"今日 10:24"},
    {t:"OPT-1195 選擇權詢價回覆",d:"JPY 賣權，3 家報價比較中",s:"今日 09:50"},
    {t:"FWD-2240 交易指示送出",d:"USD 3.88M，待兆豐回覆額度",s:"昨日 16:12"},
    {t:"OPT-1180 買權部位入帳",d:"EUR 5.2M，權利金 NT$ 62,000",s:"昨日 11:05"}
  ];
  var tl="";
  for(var j=0;j<tls.length;j++){ tl+='<div class="it"><div class="tt">'+tls[j].t+'</div><div class="td">'+tls[j].d+'</div><div class="ts">'+tls[j].s+'</div></div>'; }
  return {
    head:{ic:"request_quote",t:"避險交易管理",p:"遠期外匯與選擇權詢價、下單、成交登錄與到期時程管理。",tag:"會計專員 · v2"},
    html:
    '<div class="grid g4" style="margin-bottom:16px">'+

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];

function show(i){
  var s=SCREENS[i]();
  var app=el("app");
  var h=s.head;
  app.innerHTML=
    '<div class="shead"><div class="sic msi">'+h.ic+'</div>'+
    '<div style="min-width:0;flex:1"><h1>'+h.t+'</h1><p>'+h.p+'</p></div>'+
    '<span class="tag"><span class="msi" style="font-size:15px">badge</span>'+h.tag+'</span></div>'+
    s.html;
  var btns=document.querySelectorAll("#nav button");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
  void app.offsetHeight;
  if(s.init) s.init();
}

(function buildNav(){
  var nav=el("nav"),h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+NAV[i].i+'"><span class="msi">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("button");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ location.hash="v"+this.getAttribute("data-i"); });
  }
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
