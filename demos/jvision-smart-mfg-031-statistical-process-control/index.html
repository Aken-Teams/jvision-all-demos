<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPC統計製程管制系統（Statistical Process Control）｜Jvision 系統 Demo</title>
<meta name="description" content="管制圖即時繪製、製程能力分析與超規則自動預警的品質閉環" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --acc:#0891b2; --acc2:#22d3ee; --ink:#0f2530; --mut:#5c7480;
  --bg:#eef4f6; --card:#ffffff; --line:#d7e4ea;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#083344,#0891b2 60%,#0e7490);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(8,51,68,.25)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.25)}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:#c7eef5;font-weight:500}
.tstat{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;min-width:0}
.tpill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tpill .dot{width:8px;height:8px;border-radius:50%;background:#22d3ee;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}70%{box-shadow:0 0 0 8px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}

.nav{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:58px;z-index:15}
.nav button{flex:none;white-space:nowrap;border:1px solid var(--line);background:#f6fafc;color:var(--mut);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--acc2);color:var(--acc)}
.nav button.on{background:linear-gradient(120deg,#0891b2,#0e7490);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(8,145,178,.32)}
.nav .idx{font-size:11px;opacity:.6;font-weight:800}

main{max-width:1280px;margin:0 auto;padding:18px}
.wrap{display:flex;flex-direction:column;gap:16px}

.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hd h2{margin:0;font-size:20px;font-weight:800}
.hd p{margin:0;color:var(--mut);font-size:13px}
.hd .chip{margin-left:auto;background:#e0f5fa;color:#0e7490;border:1px solid #b7e6f0;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(15,37,48,.05)}
.card h3{margin:0 0 4px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--acc)}
.card .sub{color:var(--mut);font-size:12px;margin:0 0 12px}

.g{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.4fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.g>*{min-width:0}
@media(max-width:820px){.g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}}

.kpi{background:linear-gradient(160deg,#ffffff,#f2fbfd);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--acc)}
.kpi .val{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--mut)}
.kpi .foot{font-size:11px;margin-top:6px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--warn)}

.chartbox{position:relative;height:260px;min-width:0}
.chartbox.sm{height:210px}

table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef3f5;white-space:nowrap}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;background:#f7fbfc}
tbody tr:hover{background:#f4fbfd}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#cffafe;color:#0e7490}
.b-mut{background:#eef2f4;color:#64748b}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.board>*{min-width:0}
@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:#f4f9fb;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.col .colh{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;padding:4px 4px 8px;border-bottom:2px solid var(--acc2)}
.col .colh .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 9px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;box-shadow:0 1px 2px rgba(15,37,48,.05);border-left:4px solid var(--acc)}
.tk.crit{border-left-color:var(--bad)}
.tk.warn{border-left-color:var(--warn)}
.tk.done{border-left-color:var(--ok);opacity:.92}
.tk .tt{font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tk .meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.tk .meta b{color:var(--ink)}
.tk .who{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11px}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#22d3ee);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}

.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(#22d3ee,#0891b2)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tl .ev.crit:before{border-color:var(--bad)}
.tl .ev.ok:before{border-color:var(--ok)}
.tl .ev .t{font-size:11px;color:var(--mut);font-weight:700}
.tl .ev .d{font-weight:700;font-size:13px;margin-top:2px}
.tl .ev .x{font-size:12px;color:var(--mut);margin-top:2px}

.bar{display:block;height:8px;border-radius:6px;background:#e6eef1;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0891b2,#22d3ee)}

.rule-list{display:flex;flex-direction:column;gap:9px}
.rule-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fbfeff}
.rule-item .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-size:19px}
.rule-item .body{min-width:0}
.rule-item .body .rn{font-weight:800;font-size:13px}
.rule-item .body .rd{font-size:12px;color:var(--mut);margin-top:2px}

.station{display:flex;flex-direction:column;gap:8px}
.st-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fbfeff}
.st-row .sid{font-weight:800;font-size:12px;background:#083344;color:#fff;border-radius:8px;padding:4px 8px;flex:none}
.st-row .sname{font-weight:700;font-size:13px;min-width:0}
.st-row .sval{margin-left:auto;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.st-row .sbar{flex:none;width:30%}
@media(max-width:560px){.st-row{flex-wrap:wrap}.st-row .sbar{width:100%;order:5}}

.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.note{background:#ecfeff;border:1px solid #b7e6f0;border-radius:11px;padding:11px 13px;font-size:12px;color:#0e7490;display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.note .material-symbols-outlined{font-size:18px}
.foot{color:var(--mut);font-size:11px;text-align:center;padding:12px}

@media(max-width:560px){
  .nav button .lab{display:none}
  .nav button{padding:8px 10px}
  .brand span{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo material-symbols-outlined">monitoring</div>
    <div><b>SPC 統計製程管制</b><span>Statistical Process Control · 品質閉環平台</span></div>
  </div>
  <div class="tstat">
    <div class="tpill"><span class="dot"></span>即時採集中</div>
    <div class="tpill"><span class="material-symbols-outlined" style="font-size:16px">factory</span>竹科 A2 廠</div>
    <div class="tpill"><span class="material-symbols-outlined" style="font-size:16px">calendar_today</span>2026-08-13</div>
  </div>
</div>

<nav class="nav" id="nav"></nav>
<main><div class="wrap" id="app"></div></main>
<div class="foot">Jvision Demo · 純前端展示 · 假資料 SPC 統計製程管制系統</div>

<script>
var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}

var NAVS=[
  {icon:"sensors",lab:"量測採集"},
  {icon:"show_chart",lab:"管制圖"},
  {icon:"rule",lab:"超規則判定"},
  {icon:"notifications_active",lab:"異常派工"},
  {icon:"analytics",lab:"製程能力"},
  {icon:"task_alt",lab:"對策驗證"}
];

var GRID="#e6eef1", ACC="#0891b2", ACC2="#22d3ee";
function baseOpts(){return {responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}}};}

function kpi(icon,lab,val,unit,dir){
  var foot="";
  if(dir==="up")foot='<div class="foot up">▲ 較上期改善</div>';
  else if(dir==="dn")foot='<div class="foot dn">▼ 需關注</div>';
  else if(dir==="fl")foot='<div class="foot fl">● 監控中</div>';
  var u=unit?(' <small>'+unit+'</small>'):'';
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+u+'</div>'+foot+'</div>';
}

/* ============ Screen 0 : 量測數據採集 ============ */
function screen0(c){
  var stations=[
    {id:"OP-10",name:"曝光尺寸 CD",val:"0.248 µm",fill:82,tag:"b-ok",st:"正常"},
    {id:"OP-20",name:"蝕刻深度",val:"312 nm",fill:64,tag:"b-ok",st:"正常"},
    {id:"OP-30",name:"薄膜厚度",val:"48.6 nm",fill:91,tag:"b-warn",st:"接近上限"},
    {id:"OP-40",name:"線寬 CD",val:"0.132 µm",fill:55,tag:"b-ok",st:"正常"},
    {id:"OP-50",name:"套刻對位",val:"3.1 nm",fill:47,tag:"b-ok",st:"正常"},
    {id:"OP-60",name:"CMP 平坦度",val:"11.2 Å",fill:73,tag:"b-ok",st:"正常"}
  ];
  var rows=[
    ["09:42:18","OP-30","LOT-A2-8841","T-3","48.61","b-warn","偏移"],
    ["09:41:55","OP-10","LOT-A2-8840","T-1","0.2478","b-ok","OK"],
    ["09:41:30","OP-40","LOT-A2-8840","T-2","0.1321","b-ok","OK"],
    ["09:40:12","OP-20","LOT-A2-8839","T-1","311.8","b-ok","OK"],
    ["09:39:47","OP-50","LOT-A2-8839","T-4","3.09","b-ok","OK"],
    ["09:38:20","OP-60","LOT-A2-8838","T-3","11.24","b-ok","OK"],
    ["09:37:05","OP-30","LOT-A2-8838","T-2","48.55","b-ok","OK"],
    ["09:36:41","OP-10","LOT-A2-8837","T-1","0.2481","b-ok","OK"]
  ];
  c.innerHTML=''+
   '<div class="hd"><div><h2>製程量測數據採集</h2><p>量測站即時上傳各站點關鍵尺寸與子組（subgroup），作為管制圖與能力分析的資料來源</p></div><div class="chip">6 量測站上線 · 采樣 n=5</div></div>'+
   '<div class="g g4">'+
     kpi("sensors","今日採集點數","4,182","+318 vs 昨","up")+
     kpi("check_circle","有效樣本率","99.4","%","up")+
     kpi("timer","平均上傳延遲","2.4","秒","fl")+
     kpi("warning","偏移待覆核","3","筆","dn")+
   '</div>'+
   '<div class="g g23">'+
     '<div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>OP-30 薄膜厚度 · 近 40 子組平均</h3><p class="sub">目標 48.5nm，虛線為規格上下限 USL/LSL</p><div class="chartbox"><canvas id="c0a"></canvas></div><div class="legend"><span><i style="background:'+ACC+'"></i>子組平均</span><span><i style="background:#dc2626"></i>USL/LSL</span></div></div>'+
     '<div class="card"><h3><span class="material-symbols-outlined">precision_manufacturing</span>量測站狀態</h3><p class="sub">填充度＝當前值於規格帶位置</p><div class="station">'+
       stations.map(function(s){return '<div class="st-row"><span class="sid">'+s.id+'</span><span class="sname">'+s.name+'</span><span class="sbar"><span class="bar"><i style="width:'+s.fill+'%"></i></span></span><span class="sval mono">'+s.val+'</span><span class="badge '+s.tag+'">'+s.st+'</span></div>';}).join('')+
     '</div></div>'+
   '</div>'+
   '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>即時量測串流</h3><p class="sub">最新上傳量測值（含子組樣本）</p><div class="tw"><table><thead><tr><th>時間</th><th>站點</th><th>批號</th><th>治具</th><th>量測值</th><th>判定</th></tr></thead><tbody>'+
     rows.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td><b>'+r[1]+'</b></td><td class="mono">'+r[2]+'</td><td>'+r[3]+'</td><td class="mono">'+r[4]+'</td><td><span class="badge '+r[5]+'">'+r[6]+'</span></td></tr>';}).join('')+
   '</tbody></table></div></div>';

  void c.offsetHeight;
  var seq=[48.48,48.52,48.50,48.55,48.49,48.53,48.51,48.57,48.54,48.50,48.52,48.58,48.55,48.51,48.49,48.53,48.56,48.60,48.55,48.52,48.50,48.54,48.57,48.61,48.58,48.53,48.51,48.55,48.59,48.62,48.57,48.54,48.52,48.56,48.60,48.63,48.58,48.55,48.61,48.59];
  var labels=seq.map(function(_,i){return i+1;});
  CHARTS.push(new Chart(document.getElementById("c0a"),{type:"line",
    data:{labels:labels,datasets:[
      {data:seq,borderColor:ACC,backgroundColor:"rgba(8,145,178,.10)",borderWidth:2,pointRadius:2,pointBackgroundColor:ACC,fill:true,tension:.3},
      {data:labels.map(function(){return 49.0;}),borderColor:"#dc2626",borderWidth:1.4,borderDash:[6,4],pointRadius:0,fill:false},
      {data:labels.map(function(){return 48.0;}),borderColor:"#dc2626",borderWidth:1.4,borderDash:[6,4],pointRadius:0,fill:false}
    ]},
    options:Object.assign(baseOpts(),{scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10,font:{size:10}}},y:{min:47.8,max:49.2,grid:{color:GRID}}}})
  }));
}

/* ============ Screen 1 : 管制圖繪製 ============ */
function screen1(c){
  c.innerHTML=''+
   '<div class="hd"><div><h2>管制圖即時繪製</h2><p>系統即時計算 CL / UCL / LCL 並繪製 X̄-R 與 I-MR 管制圖，呈現製程集中趨勢與變異</p></div><div class="chip">OP-30 薄膜厚度 · X̄-R</div></div>'+
   '<div class="g g4">'+
     kpi("straighten","中心線 CL","48.53","nm","")+
     kpi("north","管制上限 UCL","48.94","nm","")+
     kpi("south","管制下限 LCL","48.12","nm","")+
     kpi("blur_on","組內全距 R̄","0.24","nm","")+
   '</div>'+
   '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>X̄ 管制圖（Mean Chart）</h3><p class="sub">紅點為超出管制界限之失控子組</p><div class="chartbox"><canvas id="c1a"></canvas></div><div class="legend"><span><i style="background:'+ACC+'"></i>子組平均 X̄</span><span><i style="background:#94a3b8"></i>CL</span><span><i style="background:#dc2626"></i>UCL / LCL</span></div></div>'+
   '<div class="g g2">'+
     '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>R 管制圖（Range Chart）</h3><p class="sub">組內變異，反映製程一致性</p><div class="chartbox sm"><canvas id="c1b"></canvas></div></div>'+
     '<div class="card"><h3><span class="material-symbols-outlined">insights</span>製程分布直方圖</h3><p class="sub">量測值分布 vs 規格帶（USL 49.0 / LSL 48.0）</p><div class="chartbox sm"><canvas id="c1c"></canvas></div></div>'+
   '</div>';

  void c.offsetHeight;
  var xbar=[48.50,48.54,48.51,48.57,48.53,48.49,48.55,48.60,48.56,48.52,48.58,48.97,48.55,48.51,48.48,48.54,48.59,48.63,48.57,48.53,48.50,48.56,48.61,48.58,48.54];
  var lab=xbar.map(function(_,i){return i+1;});
  var CL=48.53,UCL=48.94,LCL=48.12;
  var pts=xbar.map(function(v){return (v>UCL||v<LCL)?"#dc2626":ACC;});
  CHARTS.push(new Chart(document.getElementById("c1a"),{type:"line",
    data:{labels:lab,datasets:[
      {data:xbar,borderColor:ACC,borderWidth:2,pointRadius:3,pointBackgroundColor:pts,pointBorderColor:pts,tension:.25,fill:false},
      {data:lab.map(function(){return CL;}),borderColor:"#94a3b8",borderWidth:1.4,pointRadius:0},
      {data:lab.map(function(){return UCL;}),borderColor:"#dc2626",borderWidth:1.4,borderDash:[6,4],pointRadius:0},
      {data:lab.map(function(){return LCL;}),borderColor:"#dc2626",borderWidth:1.4,borderDash:[6,4],pointRadius:0}
    ]},
    options:Object.assign(baseOpts(),{scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{min:47.9,max:49.1,grid:{color:GRID}}}})
  }));
  var rng=[0.21,0.26,0.19,0.24,0.22,0.28,0.20,0.25,0.31,0.23,0.27,0.42,0.22,0.19,0.24,0.26,0.21,0.29,0.23,0.25,0.20,0.27,0.24,0.22,0.26];

function show(i){
  killCharts();
  var btns=document.querySelectorAll("#nav button");
