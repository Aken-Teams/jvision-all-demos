<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPC統計製程管制系統（Statistical Process Control）｜Jvision 系統 Demo</title>
<meta name="description" content="管制圖即時繪製、製程能力分析與超規則自動預警的品質閉環" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --acc:#2563EB;
  --acc2:#3B82F6;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --shadow:7px 7px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",sans-serif;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{color:#fff;background:var(--color-primary)}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  min-height:72px;
  padding:10px clamp(14px,3vw,38px);
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:4px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  flex:none;
  color:var(--ink);
  background:#fff;
  border:3px solid var(--ink);
  border-radius:0;
  font-size:26px;
  box-shadow:4px 4px 0 var(--ink);
}
.brand b{display:block;font-size:clamp(16px,2vw,21px);font-weight:900;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand span{display:block;margin-top:3px;color:#DBEAFE;font-family:"Fira Code",monospace;font-size:10px;font-weight:500;letter-spacing:.04em}
.tstat{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;min-width:0}
.tpill{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 10px;
  color:#fff;
  background:#1D4ED8;
  border:2px solid #fff;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.tpill .dot{width:10px;height:10px;flex:none;background:#fff;border:2px solid var(--ink);animation:pulse 1.8s steps(2,end) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.nav{
  position:sticky;
  top:72px;
  z-index:15;
  display:flex;
  gap:0;
  padding:0 clamp(10px,2vw,28px);
  overflow-x:auto;
  background:#fff;
  border-bottom:4px solid var(--ink);
  scrollbar-width:thin;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:50px;
  flex:1 0 auto;
  padding:9px 14px;
  color:var(--muted);
  background:#fff;
  border:0;
  border-right:2px solid var(--ink);
  border-radius:0;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  transition:color 160ms ease,background-color 160ms ease;
}
.nav button:first-child{border-left:2px solid var(--ink)}
.nav button:hover{color:var(--ink);background:var(--color-muted)}
.nav button.on{color:#fff;background:var(--ink)}
.nav button.on::after{content:"";position:absolute;right:0;bottom:0;left:0;height:5px;background:var(--color-accent)}
.nav button .material-symbols-outlined{font-size:20px}
.nav .idx{color:inherit;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;opacity:.75}

main{width:min(100%,1440px);margin:0 auto;padding:clamp(18px,3vw,38px)}
.wrap{display:flex;flex-direction:column;gap:20px}
.hd{
  position:relative;
  display:flex;
  align-items:flex-end;
  gap:18px;
  flex-wrap:wrap;
  padding:clamp(20px,4vw,42px);
  overflow:hidden;
  color:#fff;
  background:var(--ink);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.hd::before{content:"SPC / LIVE CONTROL";position:absolute;top:10px;right:-18px;color:rgba(255,255,255,.08);font-family:"Fira Code",monospace;font-size:clamp(28px,6vw,78px);font-weight:900;line-height:1;white-space:nowrap;pointer-events:none}
.hd>div:first-child{position:relative;z-index:1;max-width:850px}
.hd h2{margin:0 0 9px;font-size:clamp(25px,4vw,46px);font-weight:900;letter-spacing:-.045em;line-height:1.02}
.hd p{max-width:780px;margin:0;color:#E2E8F0;font-size:13px;line-height:1.75}
.hd .chip{position:relative;z-index:1;margin-left:auto;padding:10px 13px;color:var(--color-on-accent);background:var(--color-accent);border:2px solid #fff;border-radius:0;font-family:"Fira Code",monospace;font-size:11px;font-weight:800;box-shadow:4px 4px 0 #fff;white-space:nowrap}

.g{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.g>*{min-width:0}
.card,.kpi,.col,.rule-item,.st-row,.tk{border-radius:0}
.card{
  min-width:0;
  padding:clamp(15px,2vw,22px);
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:15px;font-weight:900;line-height:1.35}
.card h3 .material-symbols-outlined{display:grid;place-items:center;width:30px;height:30px;flex:none;color:#fff;background:var(--color-primary);font-size:19px;border:2px solid var(--ink)}
.card .sub{margin:0 0 16px;color:var(--muted);font-size:12px;line-height:1.6}

.kpi{
  position:relative;
  min-width:0;
  min-height:132px;
  padding:15px;
  overflow:hidden;
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--color-primary);
}
.kpi:nth-child(even){transform:translateY(6px);box-shadow:5px 5px 0 var(--color-accent)}
.kpi::after{content:"";position:absolute;right:-22px;bottom:-25px;width:74px;height:74px;background:var(--color-muted);transform:rotate(35deg)}
.kpi .lab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.02em}
.kpi .lab .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.kpi .val{position:relative;z-index:1;margin-top:12px;font-family:"Fira Code",monospace;font-size:clamp(24px,3vw,33px);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:11px;font-weight:700;letter-spacing:0}
.kpi .foot{position:relative;z-index:1;margin-top:10px;text-align:left;font-size:11px;font-weight:800}
.up{color:#166534}.dn{color:#B91C1C}.fl{color:#92400E}

.chartbox{position:relative;height:270px;min-width:0;padding-top:4px}
.chartbox.sm{height:220px}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:5px;border:1px solid var(--ink);border-radius:0}

.tw{overflow-x:auto;border:3px solid var(--ink);border-radius:0;background:#fff}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{color:#fff;background:var(--ink);font-family:"Fira Code",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#DBEAFE}
tbody tr:last-child td{border-bottom:0}
td.mono{font-family:"Fira Code",monospace;text-align:right;font-variant-numeric:tabular-nums}
td b{font-weight:800}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:2px solid currentColor;border-radius:0;font-size:10px;font-weight:800;line-height:1.1;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;flex:none;background:currentColor}
.b-ok{color:#166534;background:#DCFCE7}
.b-warn{color:#92400E;background:#FEF3C7}
.b-bad{color:#991B1B;background:#FEE2E2}
.b-info{color:#1E40AF;background:#DBEAFE}
.b-mut{color:#475569;background:#F1F5F9}

.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:920px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--color-muted);border:3px solid var(--ink)}
.col .colh{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 10px;border-bottom:4px solid var(--color-primary);font-size:13px;font-weight:900}
.col .colh .cnt{padding:2px 8px;color:#fff;background:var(--ink);border:2px solid var(--ink);border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.tk{padding:11px;background:#fff;border:2px solid var(--ink);border-left:8px solid var(--color-primary);box-shadow:3px 3px 0 var(--ink)}
.tk.crit{border-left-color:var(--bad)}
.tk.warn{border-left-color:#B45309}
.tk.done{border-left-color:var(--ok);background:#F0FDF4}
.tk .tt{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;font-size:12px;font-weight:900}
.tk .meta{display:flex;flex-direction:column;gap:4px;margin-top:8px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;line-height:1.4}
.tk .meta b{color:var(--ink)}
.tk .who{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;font-weight:700}
.av{display:grid;place-items:center;width:24px;height:24px;flex:none;color:#fff;background:var(--color-primary);border:2px solid var(--ink);border-radius:0;font-family:"Fira Code",monospace;font-size:10px;font-weight:800}

.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:4px;background:var(--ink)}
.tl .ev{position:relative;padding:0 0 20px 8px}
.tl .ev::before{content:"";position:absolute;top:2px;left:-28px;width:16px;height:16px;background:#fff;border:4px solid var(--color-primary)}
.tl .ev.crit::before{border-color:var(--bad);background:#FEE2E2}
.tl .ev.ok::before{border-color:var(--ok);background:#DCFCE7}
.tl .ev .t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.tl .ev .d{margin-top:3px;font-size:13px;font-weight:900}
.tl .ev .x{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.55}

.bar{display:block;height:11px;overflow:hidden;background:#E2E8F0;border:2px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;border-radius:0;background:var(--color-primary)}
.rule-list{display:flex;flex-direction:column;gap:10px}
.rule-item{display:flex;align-items:flex-start;gap:11px;padding:11px;background:#fff;border:2px solid var(--ink)}
.rule-item .ico{display:grid;place-items:center;width:38px;height:38px;flex:none;color:#fff;border:2px solid var(--ink);border-radius:0;font-size:19px}
.rule-item .body{min-width:0}
.rule-item .body .rn{font-size:12px;font-weight:900;line-height:1.7}
.rule-item .body .rd{margin-top:2px;color:var(--muted);font-size:11px;line-height:1.55}
.station{display:flex;flex-direction:column;gap:8px}
.st-row{display:flex;align-items:center;gap:9px;padding:9px;background:#fff;border:2px solid var(--ink)}
.st-row .sid{flex:none;padding:4px 7px;color:#fff;background:var(--ink);border-radius:0;font-family:"Fira Code",monospace;font-size:10px;font-weight:800}
.st-row .sname{min-width:0;font-size:12px;font-weight:800}
.st-row .sval{margin-left:auto;font-family:"Fira Code",monospace;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.st-row .sbar{width:27%;flex:none}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.note{display:flex;align-items:flex-start;gap:9px;margin-top:14px;padding:13px;color:#1E3A8A;background:#DBEAFE;border:3px solid var(--color-primary);border-radius:0;font-size:12px;font-weight:600;line-height:1.6;box-shadow:4px 4px 0 var(--color-primary)}
.note .material-symbols-outlined{flex:none;font-size:20px}
body>.foot{padding:20px 14px;color:#fff;background:var(--ink);border-top:4px solid var(--color-accent);font-family:"Fira Code",monospace;font-size:10px;text-align:center}

.wrap>.hd,.wrap>.g,.wrap>.card,.wrap>.note{animation:grid-in 400ms cubic-bezier(.2,.9,.3,1.25) both}
.wrap>.g:nth-child(2),.wrap>.card:nth-child(2){animation-delay:60ms}
.wrap>.g:nth-child(3),.wrap>.card:nth-child(3){animation-delay:120ms}
.wrap>.g:nth-child(4),.wrap>.card:nth-child(4),.wrap>.note{animation-delay:180ms}
@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1fr)}
  .topbar{min-height:68px}
  .nav{top:68px}
}
@media(max-width:768px){
  main{padding:18px 14px 26px}
  .topbar{position:relative;padding:11px 14px}
  .tstat{width:100%;margin-left:0}
  .nav{top:0;padding:0;scroll-snap-type:x proximity}
  .nav button{min-width:108px;scroll-snap-align:start}
  .hd{align-items:flex-start;padding:24px 19px}
  .hd .chip{margin-left:0}
  .card{padding:15px}
  .g2,.g3{grid-template-columns:1fr}
  .chartbox{height:245px}
}
@media(max-width:560px){
  .brand span{display:none}
  .brand b{white-space:normal}
  .tstat{gap:6px}
  .tpill{min-height:32px;padding:5px 7px;font-size:9px}
  .nav button{min-width:58px;padding:9px 10px}
  .nav button .lab{display:none}
  .g4{grid-template-columns:1fr}
  .kpi,.kpi:nth-child(even){min-height:112px;transform:none}
  .hd h2{font-size:28px}
  .hd::before{display:none}
  .st-row{flex-wrap:wrap}
  .st-row .sbar{width:100%;order:5}
  .st-row .sval{margin-left:auto}
  .chartbox,.chartbox.sm{height:220px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  .wrap>.hd,.wrap>.g,.wrap>.card,.wrap>.note{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo material-symbols-outlined">monitoring</div>
    <div><b>SPC 統計製程管制</b><span>Statistical Process Control · 品質閉環平台</span></div>
  </div>
  <div class="tstat">
    <div class="tpill"><span class="dot"></span>即時採集中</div>
    <div class="tpill"><span class="material-symbols-outlined" style="font-size:16px">factory</span>竹科 A2 廠</div>
    <div class="tpill"><span class="material-symbols-outlined" style="font-size:16px">calendar_today</span>2026-08-13</div>
  </div>
</div>

<nav class="nav" id="nav"></nav>
<main><div class="wrap" id="app"></div></main>
<div class="foot">Jvision Demo · 純前端展示 · 假資料 SPC 統計製程管制系統</div>

<script>
var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}

var NAVS=[
  {icon:"sensors",lab:"量測採集"},
  {icon:"show_chart",lab:"管制圖"},
  {icon:"rule",lab:"超規則判定"},
  {icon:"notifications_active",lab:"異常派工"},
  {icon:"analytics",lab:"製程能力"},
  {icon:"task_alt",lab:"對策驗證"}
];

var GRID="#e6eef1", ACC="#0891b2", ACC2="#22d3ee";
function baseOpts(){return {responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}}};}

function kpi(icon,lab,val,unit,dir){
  var foot="";
  if(dir==="up")foot='<div class="foot up">▲ 較上期改善</div>';
  else if(dir==="dn")foot='<div class="foot dn">▼ 需關注</div>';
  else if(dir==="fl")foot='<div class="foot fl">● 監控中</div>';
  var u=unit?(' <small>'+unit+'</small>'):'';
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+u+'</div>'+foot+'</div>';
}

/* ============ Screen 0 : 量測數據採集 ============ */
function screen0(c){
  var stations=[
    {id:"OP-10",name:"曝光尺寸 CD",val:"0.248 µm",fill:82,tag:"b-ok",st:"正常"},
    {id:"OP-20",name:"蝕刻深度",val:"312 nm",fill:64,tag:"b-ok",st:"正常"},
    {id:"OP-30",name:"薄膜厚度",val:"48.6 nm",fill:91,tag:"b-warn",st:"接近上限"},
    {id:"OP-40",name:"線寬 CD",val:"0.132 µm",fill:55,tag:"b-ok",st:"正常"},
    {id:"OP-50",name:"套刻對位",val:"3.1 nm",fill:47,tag:"b-ok",st:"正常"},
    {id:"OP-60",name:"CMP 平坦度",val:"11.2 Å",fill:73,tag:"b-ok",st:"正常"}
  ];
  var rows=[
    ["09:42:18","OP-30","LOT-A2-8841","T-3","48.61","b-warn","偏移"],
    ["09:41:55","OP-10","LOT-A2-8840","T-1","0.2478","b-ok","OK"],
    ["09:41:30","OP-40","LOT-A2-8840","T-2","0.1321","b-ok","OK"],
    ["09:40:12","OP-20","LOT-A2-8839","T-1","311.8","b-ok","OK"],
    ["09:39:47","OP-50","LOT-A2-8839","T-4","3.09","b-ok","OK"],
    ["09:38:20","OP-60","LOT-A2-8838","T-3","11.24","b-ok","OK"],
    ["09:37:05","OP-30","LOT-A2-8838","T-2","48.55","b-ok","OK"],
    ["09:36:41","OP-10","LOT-A2-8837","T-1","0.2481","b-ok","OK"]
  ];
  c.innerHTML=''+
   '<div class="hd"><div><h2>製程量測數據採集</h2><p>量測站即時上傳各站點關鍵尺寸與子組（subgroup），作為管制圖與能力分析的資料來源</p></div><div class="chip">6 量測站上線 · 采樣 n=5</div></div>'+
   '<div class="g g4">'+
     kpi("sensors","今日採集點數","4,182","+318 vs 昨","up")+
     kpi("check_circle","有效樣本率","99.4","%","up")+

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];

function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=NAVS.map(function(m,i){return '<button data-i="'+i+'" onclick="show('+i+')"><span class="idx">0'+(i+1)+'</span><span class="material-symbols-outlined">'+m.icon+'</span><span class="lab">'+m.lab+'</span></button>';}).join('');
}

function show(i){
  killCharts();
  var btns=document.querySelectorAll("#nav button");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",b===i);}
  var c=document.getElementById("app");
  c.innerHTML="";
  SCREENS[i](c);
  void c.offsetHeight;
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
