<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業報表與資料分析平台｜Jvision</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#1E40AF;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E3A8A;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E3A8A;
  --color-muted:#E9EEF6;
  --color-muted-foreground:#475569;
  --color-border:#DBEAFE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#1E40AF;
  --blue:#1E40AF;
  --ink:#172554;
  --muted:#475569;
  --line:#DBEAFE;
  --success:#047857;
  --warning:#B45309;
  --danger:#B91C1C;
  --violet:#6D28D9;
  --surface-alt:#F1F5F9;
  --shadow:0 10px 30px rgba(30,58,138,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(30,64,175,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,64,175,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font:400 14px/1.55 "Fira Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;font-style:normal;font-size:21px;line-height:1;
  letter-spacing:normal;text-transform:none;white-space:nowrap;
  word-wrap:normal;direction:ltr;display:inline-block;vertical-align:middle
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;z-index:10;
  display:flex;flex-direction:column;padding:22px 16px;
  color:#E0E7FF;background:#172554;
  border-right:1px solid rgba(255,255,255,.1)
}
.brand{display:flex;align-items:center;gap:12px;padding:3px 7px 22px}
.logo{
  display:grid;place-items:center;width:42px;height:42px;flex:none;
  color:#172554;background:#F59E0B;border:1px solid #FCD34D;border-radius:6px;
  box-shadow:5px 5px 0 rgba(59,130,246,.35)
}
.logo .material-symbols-outlined{font-size:25px}
.brand h1{margin:0;color:#FFF;font-size:16px;line-height:1.2;letter-spacing:.02em}
.brand span{display:block;margin-top:4px;color:#BFDBFE;font-size:11px}
.navtitle{
  padding:9px 10px 7px;color:#93C5FD;font:600 10px/1 "Fira Code",monospace;
  letter-spacing:.14em;text-transform:uppercase
}
#nav{display:grid;gap:5px}
.navbtn{
  position:relative;display:grid;grid-template-columns:23px minmax(0,1fr) auto;
  align-items:center;gap:10px;width:100%;min-height:46px;padding:10px 11px;
  color:#CBD5E1;background:transparent;border:1px solid transparent;border-radius:5px;
  text-align:left;transition:background .2s,color .2s,border-color .2s,transform .2s
}
.navbtn:hover{color:#FFF;background:rgba(59,130,246,.14);border-color:rgba(147,197,253,.25);transform:translateX(2px)}
.navbtn.on{color:#FFF;background:#1E40AF;border-color:#60A5FA;box-shadow:inset 3px 0 #F59E0B}
.navbtn .nb-tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.navbtn .idx{color:#93C5FD;font:600 10px "Fira Code",monospace}
.side-foot{
  margin-top:auto;padding:15px 9px 2px;border-top:1px solid rgba(219,234,254,.16);
  color:#CBD5E1;font-size:11px;line-height:1.8
}
.side-foot b{color:#FCD34D}
.main{min-width:0;padding:30px clamp(18px,3vw,44px) 52px}
.topbar{
  display:flex;align-items:flex-end;gap:20px;margin-bottom:22px;padding-bottom:18px;
  border-bottom:1px solid var(--line)
}
.topbar .th{min-width:0}
.topbar h2{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(21px,2.2vw,28px);line-height:1.2;letter-spacing:-.025em}
.topbar h2 .material-symbols-outlined{color:var(--blue);font-size:28px}
.topbar p{margin:6px 0 0;color:var(--muted);font-size:13px}
.tb-tags{display:flex;justify-content:flex-end;gap:7px;margin-left:auto;flex-wrap:wrap}
.pill,.tag{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-weight:600;white-space:nowrap
}
.pill{min-height:30px;padding:5px 11px;color:#1E3A8A;background:#EFF6FF;border:1px solid #BFDBFE;font-size:12px}
.pill.g,.tag.ok{color:#065F46;background:#ECFDF5;border-color:#A7F3D0}
.pill.w,.tag.warn{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.pill.p{color:#5B21B6;background:#F5F3FF;border-color:#DDD6FE}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  min-width:0;padding:18px;background:var(--color-card);
  border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);
  transition:border-color .22s,box-shadow .22s,transform .22s
}
.card:hover{border-color:#93C5FD;box-shadow:0 14px 34px rgba(30,58,138,.11);transform:translateY(-2px)}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:15px}
.card-h h3{margin:0;font-size:14px;letter-spacing:.005em}
.card-h>.material-symbols-outlined{color:var(--blue)}
.card-h .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
.kpi::after{
  content:"";position:absolute;right:-24px;bottom:-32px;width:100px;height:100px;
  border:16px solid rgba(59,130,246,.06);border-radius:50%
}
.kpi .ic{
  display:grid;place-items:center;width:38px;height:38px;margin-bottom:15px;
  color:var(--blue);background:#EFF6FF;border:1px solid #BFDBFE;border-radius:5px
}
.kpi.v2{border-top-color:#2563EB}.kpi.v2 .ic{color:#2563EB}
.kpi.v3{border-top-color:var(--success)}.kpi.v3 .ic{color:var(--success);background:#ECFDF5;border-color:#A7F3D0}
.kpi.v4{border-top-color:var(--violet)}.kpi.v4 .ic{color:var(--violet);background:#F5F3FF;border-color:#DDD6FE}
.kpi .lab{color:var(--muted);font-size:12px;font-weight:500}
.kpi .val{position:relative;z-index:1;margin-top:3px;font:700 clamp(23px,2.5vw,29px)/1.2 "Fira Code",monospace;letter-spacing:-.04em}
.kpi .dt{display:inline-flex;align-items:center;gap:3px;margin-top:9px;font:600 11px "Fira Code",monospace}
.kpi .dt.up{color:var(--success)}.kpi .dt.dn{color:var(--danger)}
.kpi .dt .material-symbols-outlined{font-size:15px}
.tbl-wrap,.mtx-wrap{overflow-x:auto}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12.5px}
th{
  padding:11px 12px;color:#334155;background:#EFF6FF;border-bottom:2px solid #93C5FD;
  font-size:11px;font-weight:700;letter-spacing:.035em;text-align:left;white-space:nowrap
}
td{padding:11px 12px;border-bottom:1px solid #E2E8F0;white-space:nowrap}
tbody tr{transition:background .2s}
tbody tr:hover{background:#F8FAFF}
td.num{text-align:right;font:600 12px "Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{padding:3px 8px;border:1px solid transparent;font-size:11px}
.tag.bad{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.tag.info{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.tag.mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.bar{height:7px;min-width:60px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
.src-list{display:grid;gap:9px}
.src{
  display:flex;align-items:center;gap:12px;min-width:0;padding:12px;
  background:#FFF;border:1px solid var(--line);border-radius:5px;
  transition:border-color .2s,background .2s,transform .2s
}
.src:hover{background:#F8FAFF;border-color:#60A5FA;transform:translateX(3px)}
.src .si{display:grid;place-items:center;width:38px;height:38px;flex:none;color:#FFF;border-radius:4px}
.src .sm{min-width:0;flex:1}.src .sm b{display:block}.src .sm span,.src .sr span{color:var(--muted);font-size:11px}
.src .sr{flex:none;text-align:right}.src .sr b{font:600 13px "Fira Code",monospace}.src .sr span{display:block}
.pipe{display:flex;align-items:stretch;min-width:620px}
.pstep{position:relative;flex:1;margin-right:28px;padding:14px;background:#F8FAFC;border:1px solid var(--line);border-radius:5px}
.pstep:last-child{margin-right:0}
.pstep::after{
  content:"chevron_right";position:absolute;right:-25px;top:50%;color:#64748B;
  font:22px "Material Symbols Outlined";transform:translateY(-50%)
}
.pstep:last-child::after{display:none}
.pstep .pn{color:var(--blue);font:600 10px "Fira Code",monospace;letter-spacing:.08em}
.pstep .pt{margin:6px 0 2px;font-weight:700}.pstep .pd{color:var(--muted);font-size:11px}.pstep .pb{margin-top:10px}
.model-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.ent{overflow:hidden;background:#FFF;border:1px solid var(--line);border-radius:5px}
.ent .eh{display:flex;align-items:center;gap:8px;padding:11px 13px;color:#FFF;font-weight:700}
.ent ul{list-style:none;margin:0;padding:6px 0}
.ent li{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid #EDF2F7;font-size:12px}
.ent li:last-child{border:0}.ent li .material-symbols-outlined{color:var(--muted);font-size:15px}
.ent li.key .material-symbols-outlined{color:var(--warning)}.ent li.meas .material-symbols-outlined{color:var(--blue)}
.ent .kt{margin-left:auto;color:#64748B;font:600 10px "Fira Code",monospace}
.measure-box{margin-bottom:9px;padding:12px;background:#F8FAFF;border:1px dashed #60A5FA;border-radius:5px;font-size:12px}
.measure-box .mn{display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--blue);font-weight:700}
.measure-box code,.api-row code,.code-block,.tt{font-family:"Fira Code",monospace}
.measure-box code{display:inline-block;max-width:100%;padding:3px 6px;overflow-x:auto;color:#172554;background:#FFF;border:1px solid var(--line);border-radius:3px;font-size:10.5px}
.insight{margin-bottom:11px;padding:14px 15px;background:#FFF;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:5px;box-shadow:0 5px 16px rgba(30,58,138,.05)}
.insight.warn{border-left-color:var(--warning)}.insight.bad{border-left-color:var(--danger)}.insight.ok{border-left-color:var(--success)}
.insight .ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.insight .ih b{font-size:13px}.insight.warn .ih>.material-symbols-outlined{color:var(--warning)}
.insight.bad .ih>.material-symbols-outlined{color:var(--danger)}.insight.ok .ih>.material-symbols-outlined{color:var(--success)}
.insight .sc{margin-left:auto;padding:3px 8px;color:#1E40AF;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;font-size:10px;font-weight:700}
.insight p{margin:0;color:#334155;font-size:12px;line-height:1.7}
.insight .imp{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--blue);font-weight:700;font-size:11px}
.insight .imp .material-symbols-outlined{font-size:16px}
.mtx{min-width:640px}
.mtx th,.mtx td{padding:9px;border:1px solid var(--line);text-align:center}
.mtx td:first-child,.mtx th:first-child{position:sticky;left:0;z-index:1;color:var(--ink);background:#FFF;text-align:left;font-weight:700}
.mtx .yes{color:var(--success)}.mtx .no{color:#64748B}.mtx .part{color:var(--warning)}
.mtx .material-symbols-outlined{font-size:18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:11px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}.dot{display:inline-block;width:8px;height:8px;border-radius:2px}
.tl{position:relative;padding-left:23px}.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 4px}.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;background:#FFF;border:3px solid var(--blue);border-radius:50%}
.tl-item.w::before{border-color:var(--warning)}.tl-item.g::before{border-color:var(--success)}
.tl-item .tt{color:var(--muted);font-size:10px}.tl-item .tb{margin-top:2px;font-weight:600}.tl-item .td{color:var(--muted);font-size:11px}
.embed-preview{overflow:hidden;background:#FFF;border:1px solid var(--line);border-radius:6px}
.embed-bar{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#EFF6FF;border-bottom:1px solid var(--line)}
.embed-bar .d{width:9px;height:9px;flex:none;border-radius:50%}
.embed-bar .u{min-width:0;flex:1;overflow:hidden;padding:5px 9px;color:var(--muted);background:#FFF;border:1px solid var(--line);border-radius:3px;font:10px "Fira Code",monospace;text-overflow:ellipsis;white-space:nowrap}
.embed-body{padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;background:#FFF;border:1px solid var(--line);border-radius:4px;font-size:11px;font-weight:600}
.chip .material-symbols-outlined{color:var(--blue);font-size:16px}
.code-block{overflow-x:auto;padding:15px;color:#D7E3F4;background:#0F1E3A;border:1px solid #1E3A8A;border-radius:5px;font-size:11px;line-height:1.8}
.code-block .k{color:#93C5FD}.code-block .s{color:#FCD34D}.code-block .c{color:#94A3B8}
.api-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E2E8F0}
.api-row:last-child{border:0}.api-row code{min-width:0;flex:1;overflow:hidden;color:#334155;font-size:11px;text-overflow:ellipsis}
.method{width:48px;flex:none;padding:3px 6px;border-radius:3px;text-align:center;font:700 10px "Fira Code",monospace}
.method.get{color:#065F46;background:#D1FAE5}.method.post{color:#1E40AF;background:#DBEAFE}
.mini-stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #E2E8F0}
.mini-stat:last-child{border:0}.ms-l{min-width:0;flex:1}.ms-l b{display:block;font-size:12px}.ms-l span{color:var(--muted);font-size:11px}
.ms-v{font:700 14px "Fira Code",monospace;font-variant-numeric:tabular-nums}
.chart-box{width:100%;min-width:0}
.screen{animation:screen-in .42s cubic-bezier(.2,.8,.2,1)}
.screen .grid>.card{animation:card-in .4s backwards}
.screen .grid>.card:nth-child(2){animation-delay:.06s}.screen .grid>.card:nth-child(3){animation-delay:.12s}.screen .grid>.card:nth-child(4){animation-delay:.18s}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{display:block}.side{position:static;width:auto;height:auto;padding:12px 14px;border:0;border-bottom:1px solid #1E40AF}
  .brand{padding:0 0 11px}.brand h1{font-size:14px}.navtitle,.side-foot{display:none}
  #nav{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px}
  .navbtn{display:flex;width:auto;min-width:max-content;min-height:42px;padding:9px 11px}.navbtn .idx{display:none}
  .main{padding:20px 16px 40px}.g-2-1,.g-1-2{grid-template-columns:1fr}.model-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  body{font-size:13px}.topbar{align-items:flex-start;flex-direction:column}.tb-tags{justify-content:flex-start;margin-left:0}
  .g2,.g3,.g4{grid-template-columns:1fr}.card{padding:15px}.navbtn .nb-tx{display:none}.navbtn{min-width:42px;justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .screen,.screen .grid>.card{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">analytics</span></div>
      <div><h1>Jvision BI</h1><span>商業智慧分析平台</span></div>
    </div>
    <div class="navtitle">功能模組</div>
    <nav id="nav" aria-label="功能模組"></nav>
    <div class="side-foot">環境：<b>營運資料倉儲</b><br>最後同步：2026-08-13 07:40<br>版本 v4.2 · 純 UI 展示</div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<script>
var MODULES=[
 {icon:"cable",name:"資料連接整合",desc:"多源連線、排程同步與資料品質檢核"},
 {icon:"schema",name:"語意模型建構",desc:"維度量值、關聯與計算欄位建模"},
 {icon:"dashboard_customize",name:"互動報表儀表板",desc:"拖拉視覺化、篩選與逐層下鑽"},
 {icon:"auto_awesome",name:"AI 洞察引擎",desc:"自動偵測異常、趨勢與關鍵因子"},
 {icon:"admin_panel_settings",name:"治理與分享",desc:"權限、資料列安全與版本稽核"},
 {icon:"integration_instructions",name:"內嵌分析發布",desc:"報表內嵌外部系統與 API 存取"}
];
(function(){
 var nav=document.getElementById("nav"),h="";
 for(var i=0;i<MODULES.length;i++)h+='<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+MODULES[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODULES[i].icon+'</span><span class="nb-tx">'+MODULES[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
 nav.innerHTML=h;
 nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;location.hash="v"+b.getAttribute("data-i")});
})();
var _charts=[];
function killCharts(){for(var i=0;i<_charts.length;i++)try{_charts[i].destroy()}catch(e){}_charts=[]}
function mkChart(el,opt){if(!el)return;var c=new ApexCharts(el,opt);c.render();_charts.push(c)}
var BASE={chart:{fontFamily:'"Fira Sans",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},dataLabels:{enabled:false},grid:{borderColor:"#DBEAFE",strokeDashArray:4},tooltip:{style:{fontSize:"12px"}},legend:{fontSize:"12px",markers:{radius:2}},theme:{mode:"light"}};
function merge(o){var r=JSON.parse(JSON.stringify(BASE));for(var k in o){if(k==="chart")for(var c in o.chart)r.chart[c]=o.chart[c];else r[k]=o[k]}return r}
var SOURCES=[
 {n:"ERP 主資料庫",t:"商用資料庫 A · 財務／訂單",st:"ok",rows:"1.82M",freq:"每 15 分",clr:"#1E40AF",ic:"database"},
 {n:"CRM 客戶系統",t:"CRM API",st:"ok",rows:"426K",freq:"每小時",clr:"#2563EB",ic:"contacts"},
 {n:"電商交易平台",t:"MySQL · 訂單／流量",st:"warn",rows:"3.14M",freq:"即時串流",clr:"#6D28D9",ic:"shopping_cart"},
