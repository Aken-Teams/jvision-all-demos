<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>商業智慧分析 BI｜Jvision</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --a:#0369a1; --a2:#38bdf8; --a-soft:#e0f2fe; --a-soft2:#f0f9ff;
  --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
  --ok:#059669; --warn:#d97706; --bad:#dc2626; --purple:#7c3aed;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
/* Sidebar */
.side{
  width:250px;flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(3,105,161,.32);}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px;}
.brand span{font-size:11px;color:var(--sub);font-weight:600;}
.navtitle{font-size:11px;color:#94a3b8;font-weight:700;padding:10px 10px 4px;letter-spacing:.5px;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border:none;background:transparent;
  border-radius:11px;cursor:pointer;color:var(--sub);font-family:inherit;font-size:13.5px;font-weight:600;
  text-align:left;width:100%;transition:all .15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:none;}
.navbtn .nb-tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:var(--a-soft2);color:var(--a);}
.navbtn.on{background:linear-gradient(100deg,var(--a),#0284c7);color:#fff;box-shadow:0 5px 14px rgba(3,105,161,.28);}
.navbtn .idx{margin-left:auto;font-size:11px;font-weight:700;opacity:.55;}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:#94a3b8;line-height:1.7;}
.side-foot b{color:var(--a);}
/* Main */
.main{flex:1;min-width:0;padding:24px 28px 44px;}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.topbar .th{min-width:0;}
.topbar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:10px;}
.topbar h2 .material-symbols-outlined{color:var(--a);font-size:26px;}
.topbar p{margin:3px 0 0;color:var(--sub);font-size:13px;}
.tb-tags{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;background:var(--a-soft);color:var(--a);}
.pill.g{background:#dcfce7;color:var(--ok);}
.pill.w{background:#fef3c7;color:var(--warn);}
.pill.p{background:#f3e8ff;color:var(--purple);}
/* Grids */
.grid{display:grid;gap:16px;min-width:0;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g-2-1{grid-template-columns:2fr 1fr;}
.g-1-2{grid-template-columns:1fr 2fr;}
.span2{grid-column:span 2;}
@media(max-width:820px){
  .g2,.g3,.g4,.g-2-1,.g-1-2{grid-template-columns:1fr;}
  .span2{grid-column:auto;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.card.pad0{padding:0;overflow:hidden;}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.card-h .material-symbols-outlined{font-size:20px;color:var(--a);}
.card-h h3{margin:0;font-size:14.5px;font-weight:700;}
.card-h .sub{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600;}
/* KPI */
.kpi{position:relative;overflow:hidden;}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--a-soft);color:var(--a);margin-bottom:12px;}
.kpi .ic .material-symbols-outlined{font-size:23px;}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:2px;font-family:"Inter";}
.kpi .val small{font-size:14px;font-weight:700;color:var(--sub);margin-left:2px;}
.kpi .dt{margin-top:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi .dt.up{color:var(--ok);} .kpi .dt.dn{color:var(--bad);}
.kpi .dt .material-symbols-outlined{font-size:15px;}
.kpi.v2 .ic{background:#ecfeff;color:var(--a2);}
.kpi.v3 .ic{background:#dcfce7;color:var(--ok);}
.kpi.v4 .ic{background:#f3e8ff;color:var(--purple);}
/* table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;padding:11px 12px;font-size:11.5px;color:var(--sub);font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap;background:#f8fafc;letter-spacing:.3px;}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
tbody tr:hover{background:var(--a-soft2);}
td.num{font-family:"Inter";font-weight:700;text-align:right;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:14px;font-size:11.5px;font-weight:700;}
.tag.ok{background:#dcfce7;color:var(--ok);}
.tag.warn{background:#fef3c7;color:var(--warn);}
.tag.bad{background:#fee2e2;color:var(--bad);}
.tag.info{background:var(--a-soft);color:var(--a);}
.tag.mut{background:#f1f5f9;color:var(--sub);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
/* bars */
.bar{height:7px;border-radius:5px;background:#eef2f6;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--a2));}
.barcell{display:flex;align-items:center;gap:8px;}
.barcell .bar{flex:1;}
.barcell .pc{font-family:"Inter";font-weight:700;font-size:12px;width:38px;text-align:right;}
/* chip row */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;background:#fff;display:flex;align-items:center;gap:7px;min-width:0;}
.chip .material-symbols-outlined{font-size:17px;color:var(--a);}
/* connectors screen 0 */
.src-list{display:flex;flex-direction:column;gap:11px;}
.src{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;min-width:0;transition:.15s;}
.src:hover{border-color:var(--a2);box-shadow:0 4px 12px rgba(56,189,248,.14);}
.src .si{width:40px;height:40px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;}
.src .si .material-symbols-outlined{font-size:22px;}
.src .sm{min-width:0;flex:1;}
.src .sm b{font-size:13.5px;display:block;}
.src .sm span{font-size:11.5px;color:var(--sub);}
.src .sr{text-align:right;flex:none;}
.src .sr b{font-family:"Inter";font-size:14px;}
.src .sr span{font-size:11px;color:var(--sub);display:block;}
/* pipeline steps */
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px;}
.pstep{flex:1;min-width:130px;padding:14px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;position:relative;margin-right:22px;}
.pstep:last-child{margin-right:0;}
.pstep::after{content:"chevron_right";font-family:"Material Symbols Outlined";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:#cbd5e1;font-size:22px;z-index:2;}
.pstep:last-child::after{display:none;}
.pstep .pn{font-size:11px;color:var(--a);font-weight:800;}
.pstep .pt{font-size:13px;font-weight:700;margin:6px 0 3px;}
.pstep .pd{font-size:11.5px;color:var(--sub);}
.pstep .pb{margin-top:9px;}
/* semantic model screen 1 */
.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:820px){.model-grid{grid-template-columns:1fr;}}
.ent{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;min-width:0;}
.ent .eh{padding:11px 13px;font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:8px;}
.ent .eh .material-symbols-outlined{font-size:18px;}
.ent ul{list-style:none;margin:0;padding:8px 0;}
.ent li{padding:7px 13px;font-size:12.5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f5f7fa;}
.ent li:last-child{border-bottom:none;}
.ent li .material-symbols-outlined{font-size:15px;color:var(--sub);}
.ent li .kt{margin-left:auto;font-size:10.5px;font-weight:700;color:#94a3b8;}
.ent li.key .material-symbols-outlined{color:var(--warn);}
.ent li.meas .material-symbols-outlined{color:var(--a);}
.measure-box{border:1px dashed var(--a2);border-radius:12px;padding:13px 15px;background:var(--a-soft2);font-size:12.5px;margin-bottom:10px;}
.measure-box .mn{font-weight:800;color:var(--a);font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.measure-box code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:#0f172a;font-size:11.5px;font-family:"Inter",monospace;}
/* insights screen 3 */
.insight{border:1px solid var(--line);border-left:4px solid var(--a);border-radius:12px;padding:14px 16px;background:#fff;margin-bottom:12px;min-width:0;}
.insight.warn{border-left-color:var(--warn);}
.insight.bad{border-left-color:var(--bad);}
.insight.ok{border-left-color:var(--ok);}
.insight .ih{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.insight .ih .material-symbols-outlined{font-size:20px;}
.insight.warn .ih .material-symbols-outlined{color:var(--warn);}
.insight.bad .ih .material-symbols-outlined{color:var(--bad);}
.insight.ok .ih .material-symbols-outlined{color:var(--ok);}
.insight .ih b{font-size:13.5px;}
.insight .ih .sc{margin-left:auto;font-size:11px;font-weight:800;background:var(--a-soft);color:var(--a);padding:3px 9px;border-radius:12px;}
.insight p{margin:0;font-size:12.5px;color:#475569;line-height:1.7;}
.insight .imp{margin-top:9px;font-size:12px;font-weight:700;color:var(--a);display:inline-flex;align-items:center;gap:5px;}
.insight .imp .material-symbols-outlined{font-size:16px;}
/* governance screen 4 - permission matrix */
.mtx-wrap{overflow-x:auto;}
.mtx{border-collapse:collapse;min-width:560px;width:100%;font-size:12.5px;}
.mtx th,.mtx td{border:1px solid var(--line);padding:9px 11px;text-align:center;white-space:nowrap;}
.mtx th{background:#f8fafc;font-weight:700;color:var(--sub);}
.mtx td:first-child,.mtx th:first-child{text-align:left;font-weight:700;background:#fff;color:var(--ink);position:sticky;left:0;}
.mtx .yes{color:var(--ok);} .mtx .no{color:#cbd5e1;} .mtx .part{color:var(--warn);}
.mtx .material-symbols-outlined{font-size:18px;}
/* audit timeline */
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 4px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--a);}
.tl-item.w::before{border-color:var(--warn);}
.tl-item.g::before{border-color:var(--ok);}
.tl-item .tt{font-size:11px;color:var(--sub);font-weight:700;font-family:"Inter";}
.tl-item .tb{font-size:13px;font-weight:600;margin-top:2px;}
.tl-item .td{font-size:12px;color:var(--sub);margin-top:1px;}
/* embed screen 5 */
.embed-preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
.embed-bar{display:flex;align-items:center;gap:8px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);}
.embed-bar .u{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11.5px;color:var(--sub);font-family:"Inter";min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.embed-bar .d{width:10px;height:10px;border-radius:50%;flex:none;}
.embed-body{padding:16px;}
.code-block{background:#0f2237;border-radius:12px;padding:15px 17px;color:#cbd5e1;font-family:"Inter",monospace;font-size:12px;line-height:1.8;overflow-x:auto;}
.code-block .k{color:#7dd3fc;} .code-block .s{color:#86efac;} .code-block .c{color:#64748b;}
.api-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f1f5f9;}
.api-row:last-child{border-bottom:none;}
.method{font-family:"Inter";font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;flex:none;width:52px;text-align:center;}
.method.get{background:#dcfce7;color:var(--ok);}
.method.post{background:var(--a-soft);color:var(--a);}
.api-row code{flex:1;font-family:"Inter",monospace;font-size:12px;color:#334155;min-width:0;overflow:hidden;text-overflow:ellipsis;}
/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);font-weight:600;margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
/* mini stat */
.mini-stat{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5f9;}
.mini-stat:last-child{border-bottom:none;}
.mini-stat .ms-l{flex:1;min-width:0;}
.mini-stat .ms-l b{font-size:13px;display:block;}
.mini-stat .ms-l span{font-size:11.5px;color:var(--sub);}
.mini-stat .ms-v{font-family:"Inter";font-weight:800;font-size:16px;}
/* fade */
.screen{animation:fade .28s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.chart-box{width:100%;min-width:0;}
/* mobile nav */
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;border-right:none;border-bottom:1px solid var(--line);}
  .brand{padding:0 10px 0 0;flex:none;}
  .navtitle,.side-foot{display:none;}
  .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 13px;}
  .navbtn .idx{display:none;}
  .main{padding:18px 16px 40px;}
}
@media(max-width:560px){
  .navbtn .nb-tx{display:none;}
  .navbtn{padding:9px;}
  .topbar h2{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div>
        <h1>Jvision BI</h1>
        <span>商業智慧分析平台</span>
      </div>
    </div>
    <div class="navtitle">功能模組</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      環境：<b>營運資料倉儲</b><br/>
      最後同步：2026-08-13 07:40<br/>
      版本 v4.2 · 純 UI 展示
    </div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>

<script>
/* ======================= 模組定義 ======================= */
var MODULES=[
  {icon:"cable",name:"資料連接整合",desc:"多源連線、排程同步與資料品質檢核"},
  {icon:"schema",name:"語意模型建構",desc:"維度量值、關聯與計算欄位建模"},
  {icon:"dashboard_customize",name:"互動報表儀表板",desc:"拖拉視覺化、篩選與逐層下鑽"},
  {icon:"auto_awesome",name:"AI 洞察引擎",desc:"自動偵測異常、趨勢與關鍵因子"},
  {icon:"admin_panel_settings",name:"治理與分享",desc:"權限、資料列安全與版本稽核"},
  {icon:"integration_instructions",name:"內嵌分析發布",desc:"報表內嵌外部系統與 API 存取"}
];

/* build nav */
(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button class="navbtn" data-i="'+i+'">'+
       '<span class="material-symbols-outlined">'+MODULES[i].icon+'</span>'+
       '<span class="nb-tx">'+MODULES[i].name+'</span>'+
       '<span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b)return;
    show(+b.getAttribute("data-i"));
    try{window.scrollTo(0,0);}catch(err){}
  });
})();

/* ======================= 工具 ======================= */
var _charts=[];
function killCharts(){for(var i=0;i<_charts.length;i++){try{_charts[i].destroy();}catch(e){}}_charts=[];}
function mkChart(el,opt){if(!el)return;var c=new ApexCharts(el,opt);c.render();_charts.push(c);}
var BASE={chart:{fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},dataLabels:{enabled:false},grid:{borderColor:"#eef2f6",strokeDashArray:4},tooltip:{style:{fontSize:"12px"}},legend:{fontSize:"12px",markers:{radius:4}}};
function merge(o){var r=JSON.parse(JSON.stringify(BASE));for(var k in o){if(k==="chart"){for(var c in o.chart)r.chart[c]=o.chart[c];}else{r[k]=o[k];}}return r;}

/* ======================= 資料 ======================= */
var SOURCES=[
  {n:"ERP 主資料庫",t:"商用資料庫 A · 財務／訂單",st:"ok",rows:"1.82M",freq:"每 15 分",clr:"#0369a1",ic:"database"},
  {n:"CRM 客戶系統",t:"CRM API",st:"ok",rows:"426K",freq:"每小時",clr:"#38bdf8",ic:"contacts"},
  {n:"電商交易平台",t:"MySQL · 訂單／流量",st:"warn",rows:"3.14M",freq:"即時串流",clr:"#7c3aed",ic:"shopping_cart"},
  {n:"行銷投放 API",t:"Google／Meta Ads",st:"ok",rows:"88K",freq:"每日 03:00",clr:"#059669",ic:"campaign"},
  {n:"門市 POS 匯出",t:"CSV · 每日批次",st:"bad",rows:"612K",freq:"每日 01:00",clr:"#d97706",ic:"point_of_sale"},
  {n:"人資考勤系統",t:"商用資料庫 B",st:"ok",rows:"54K",freq:"每日 06:00",clr:"#0284c7",ic:"badge"}
];
var STMAP={ok:{t:"info",x:"連線正常"},warn:{t:"warn",x:"延遲同步"},bad:{t:"bad",x:"需檢核"}};

var REPORTS=[
  {n:"營收總覽儀表板",own:"分析部",v:"12 視覺件",up:"08-13 07:12",tag:"info",tt:"已發布",views:"1,284"},
  {n:"通路業績下鑽",own:"營運處",v:"8 視覺件",up:"08-12 18:44",tag:"info",tt:"已發布",views:"962"},

/* ======================= show ======================= */
var RENDER=[v0,v1,v2,v3,v4,v5];
var CHARTS=[v0charts,v1charts,v2charts,v3charts,v4charts,v5charts];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var container=document.getElementById("view");
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  CHARTS[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
