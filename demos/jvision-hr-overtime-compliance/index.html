<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>加班工時管控與法遵預警 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#D97706;
  --accent2:#2DD4BF;
  --accent-soft:#FEF3C7;
  --accent-soft2:#CCFBF1;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#E6FFFA;
  --hov:#F0FDFA;
  --track:#CCFBF1;
  --sidebar:#0F766E;
  --sidebar2:#0F766E;
  --side-edge:#5EEAD4;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:12px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Sans TC",Georgia,serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.kpi .lbl,.stat .lbl,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  font-family:"Cormorant Garamond","Noto Sans TC",Georgia,serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  width:264px;
  height:100vh;
  min-width:0;
  padding:24px 16px;
  overflow-y:auto;
  color:#FFFFFF;
  background:var(--sidebar);
  border-right:3px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 8px 24px;
  border-bottom:1px solid rgba(255,255,255,.35);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #FFFFFF;
  border-radius:10px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;line-height:1.15;letter-spacing:.03em}
.brand-txt span{
  display:block;
  margin-top:4px;
  overflow:hidden;
  color:#CCFBF1;
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.09em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav{display:flex;flex-direction:column;gap:6px;min-width:0;margin-top:22px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  min-width:0;
  padding:10px 12px;
  color:#FFFFFF;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{background:#115E59;border-color:#5EEAD4}
.nav button.on{
  color:#0F172A;
  background:#FFFFFF;
  border-color:#FFFFFF;
}
.nav button.on .material-symbols-outlined{color:var(--color-primary)}
.nav .txt{overflow:hidden;text-overflow:ellipsis}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  opacity:.75;
}
.side-foot{
  margin-top:auto;
  padding:16px 9px 2px;
  color:#CCFBF1;
  border-top:1px solid rgba(255,255,255,.35);
  font-family:"Crimson Pro",serif;
  font-size:12px;
  line-height:1.7;
}
.side-foot b{color:#FFFFFF}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,42px) 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
  padding-bottom:18px;
  border-bottom:2px solid var(--color-primary);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
  font-size:clamp(25px,2.6vw,34px);
  line-height:1.1;
  letter-spacing:-.015em;
}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:28px}
.topbar .sub{max-width:720px;margin-top:6px;color:var(--muted);font-size:14px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 11px;
  color:#334155;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.chip .dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid #FFFFFF;
  border-radius:50%;
  outline:1px solid var(--ok);
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #92400E;
  border-radius:8px;
  font-family:"Cinzel",serif;
  font-weight:600;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0;animation:enter 400ms ease both}
.grid>*:nth-child(2){animation-delay:60ms}
.grid>*:nth-child(3){animation-delay:120ms}
.grid>*:nth-child(4){animation-delay:180ms}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
}
.card,.sec{padding:18px}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:var(--color-primary)}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:18px;
  line-height:1.25;
}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font-size:12px}

.kpi,.stat{
  position:relative;
  min-height:148px;
  padding:18px;
  overflow:hidden;
  border-top:4px solid var(--color-primary);
}
.kpi::after{display:none}
.kpi .ico{
  position:absolute;
  top:15px;
  right:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  color:#0F766E;
  background:#CCFBF1;
  border:1px solid var(--color-border);
  border-radius:8px;
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  max-width:calc(100% - 42px);
  margin-top:0;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.stat .lbl .material-symbols-outlined{color:var(--color-primary);font-size:16px}
.kpi .val,.stat .val{
  margin-top:15px;
  color:#0F172A;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:30px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
  line-height:1;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:14px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:10px;
  font-size:12px;
  font-weight:600;
}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:16px}

.card.pad0>.card-h{padding:18px 18px 0!important}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{
  padding:12px 14px;
  color:#134E4A;
  background:var(--th);
  border-bottom:2px solid var(--color-primary);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:.025em;
  text-align:left;
  white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid #99F6E4;white-space:nowrap}
th:nth-child(n+4),td:nth-child(n+4){text-align:right}
tr:last-child td{border-bottom:0}
tbody tr{transition:background-color 180ms ease}
tbody tr:hover{background:var(--hov)}
.mono{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#B91C1C;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #99F6E4;border-radius:4px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:3px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:42px;color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 19px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-26px;width:15px;height:15px;background:#FFFFFF;border:4px solid var(--color-primary);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:3px 0;color:var(--ink);font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}

.chk{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{flex:none;font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:12px;text-align:right}
.note{margin-top:14px;padding:12px 13px;color:#334155;background:var(--color-muted);border-left:4px solid var(--color-accent);font-size:12px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--th);border:1px solid var(--line);border-radius:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 7px;color:var(--ink);font-size:14px;font-weight:700}
.col-h .cnt{padding:2px 8px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:6px;font-family:"SFMono-Regular",Consolas,monospace;font-size:11px}
.pcard{padding:12px;color:var(--ink);background:#FFFFFF;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:8px}
.pcard:hover{border-color:var(--color-primary)}
.pcard b{font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:9px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#115E59;background:#CCFBF1;border:1px solid var(--line);font-weight:700}
.mini-av{width:20px;height:20px;border-radius:5px;font-size:9px}
.av{width:27px;height:27px;border-radius:6px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;background:#FFFFFF;border:1px solid var(--line);border-radius:9px}
.lane-row:hover{border-color:var(--color-primary)}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#FFFFFF;background:var(--color-primary);border-radius:7px;font-family:"Cinzel",serif;font-weight:600}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:15px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:#64748B;background:#FFFFFF;border:2px solid #94A3B8;border-radius:50%;font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;z-index:1}
.steps .ln{width:20px;height:2px;background:#94A3B8}
.steps .s.done{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:#115E59;border-color:var(--color-primary);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 4px;border-bottom:1px solid var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{height:8px;overflow:hidden;background:var(--track);border-radius:4px}
.gauge .track i{display:block;height:100%;background:var(--color-primary);border-radius:4px}
.gauge small{display:block;margin-top:4px;color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border:1px solid var(--line);border-radius:5px}
.band .rng{position:absolute;top:0;bottom:0;background:#99F6E4;border-radius:4px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--color-accent);border:1px solid #92400E;border-radius:3px}

.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:17px;border-top:4px solid var(--color-primary)}
.tile .ti{position:absolute;top:13px;right:13px;display:flex;align-items:center;justify-content:center;width:32px;height:32px;color:#0F766E;background:#CCFBF1;border:1px solid var(--line);border-radius:7px}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:16px}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
.tile .tv{color:#0F172A;font-family:"Cinzel","Crimson Pro",serif;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;box-shadow:none!important}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;flex-direction:row;align-items:center;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:3px solid var(--color-secondary)}
  .brand{padding:0 14px 0 2px;border:0}
  .brand-logo{width:40px;height:40px}
  .brand-txt span{display:none}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}
  .nav button{width:auto;min-height:42px;padding:9px 11px}
  .nav .idx{display:none}
  .main{padding:22px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{flex-direction:column}
  .top-right{justify-content:flex-start}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .sidebar{align-items:flex-start;flex-wrap:wrap}
  .brand{width:100%;padding-bottom:9px}
  .nav{width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
  .nav button{justify-content:center;width:100%;min-width:44px;padding:10px}
  .nav button .txt{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .topbar h1{font-size:25px}
  .chip{font-size:11px}
  .card,.sec{padding:15px}
  .kpi,.stat{min-height:136px}
  .chk{align-items:flex-start;flex-wrap:wrap}
  .chk small{width:100%;padding-left:30px;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">

function buildNav(){var n=document.getElementById("nav");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}

window.addEventListener("hashchange",fromHash);fromHash();
