<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出勤打卡管理系統（Attendance Management）｜Jvision 系統 Demo</title>
  <meta name="description" content="多廠區出勤打卡即時監控、代打卡攔截、異常稽核與薪傳鎖定" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --good:#047857;
  --warn:#A14800;
  --bad:#B91C1C;
  --info:#155E75;
  --shadow:8px 8px 0 #134E4A;
  --shadow-sm:4px 4px 0 #134E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  overflow-x:hidden;
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(13,148,136,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.12) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Serif TC","PMingLiU",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
button,a,[data-i]{cursor:pointer}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}
:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--color-card);
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  padding:0;
  background:var(--color-card);
  border-bottom:4px solid var(--ink);
}
.topbar-in{
  min-width:0;
  display:flex;
  align-items:stretch;
  gap:0;
  border-bottom:2px solid var(--ink);
}
.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px clamp(16px,3vw,34px);
}
.brand .logo{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:4px 4px 0 var(--color-accent);
}
.brand .logo .ms{font-size:29px}
.brand b{
  display:block;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:clamp(15px,2vw,21px);
  font-weight:600;
  line-height:1.15;
  letter-spacing:.025em;
  white-space:nowrap;
}
.brand span:not(.ms){
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.live{
  min-width:0;
  margin-left:auto;
  padding:14px clamp(16px,3vw,32px);
  display:flex;
  align-items:center;
  gap:9px;
  color:#000;
  background:var(--color-accent);
  border-left:3px solid var(--ink);
  border-radius:0;
  font-family:"Crimson Pro",serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}
.live .dot{
  width:12px;
  height:12px;
  flex:0 0 auto;
  background:#065F46;
  border:2px solid #000;
  border-radius:50%;
  box-shadow:none;
}
nav.tabs{
  min-width:0;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:0;
  margin:0;
  padding:0;
}
nav.tabs button{
  min-width:0;
  min-height:52px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--ink);
  background:var(--color-card);
  border:0;
  border-right:2px solid var(--ink);
  border-radius:0;
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:14px;
  font-weight:700;
  transition:background-color 180ms ease,color 180ms ease,transform 180ms ease;
}
nav.tabs button:last-child{border-right:0}
nav.tabs button .ms{font-size:20px}
nav.tabs button:hover{color:#000;background:var(--color-secondary)}
nav.tabs button.on{
  color:#000;
  background:var(--color-primary);
  border-color:var(--ink);
  box-shadow:inset 0 -6px 0 var(--color-accent);
}
nav.tabs button.on::after{content:"｜目前畫面";font-size:10px;text-transform:uppercase}
main{
  width:min(100%,1460px);
  min-height:calc(100vh - 190px);
  margin:0 auto;
  padding:clamp(22px,4vw,54px) clamp(14px,3vw,40px);
}
#view{min-width:0}
.scr-head{
  position:relative;
  min-width:0;
  margin-bottom:24px;
  padding:clamp(20px,3vw,34px);
  display:flex;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  color:#000;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.scr-head::before{
  content:"ATTENDANCE / WORKFORCE";
  position:absolute;
  top:-13px;
  left:18px;
  padding:3px 8px;
  color:#fff;
  background:var(--ink);
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.13em;
}
.scr-head h1{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(30px,5vw,54px);
  font-weight:700;
  line-height:.95;
  letter-spacing:-.035em;
}
.scr-head p{margin:9px 0 0;color:#0F3D3A;font-size:15px;font-weight:600}
.scr-head .tag{
  min-width:0;
  margin-left:auto;
  padding:8px 12px;
  color:#000;
  background:var(--color-accent);
  border:2px solid #000;
  border-radius:0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  font-weight:800;
  box-shadow:3px 3px 0 #000;
}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card{
  min-width:0;
  padding:20px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:var(--shadow-sm);
}
.grid>.card:nth-child(even){transform:translateY(7px)}
.card h3{
  margin:0 0 5px;
  display:flex;
  align-items:center;
  gap:9px;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:20px;
  font-weight:700;
  line-height:1.1;
}
.card h3 .ms{
  width:31px;
  height:31px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-size:19px;
}
.card .sub{margin:0 0 16px;color:var(--muted);font-size:13px;font-weight:600}
.kpi{position:relative;overflow:hidden;padding-top:52px}
.kpi::before{
  content:"METRIC";
  position:absolute;
  top:0;
  right:0;
  padding:7px 10px;
  color:#fff;
  background:var(--ink);
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:700}
.kpi .lbl .ms{color:var(--color-primary);font-size:22px}
.kpi .val{
  margin-top:10px;
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(39px,5vw,58px);
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.045em;
  line-height:.82;
}
.kpi .val small{margin-left:6px;color:var(--muted);font-family:"Crimson Pro",serif;font-size:14px;font-weight:700;letter-spacing:0}
.kpi .delta{
  margin-top:15px;
  padding:4px 7px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:2px solid currentColor;
  font-size:12px;
  font-weight:700;
}
.kpi .delta.up{color:#065F46;background:#D1FAE5}
.kpi .delta.down{color:#991B1B;background:#FEE2E2}
.kpi .delta.flat{color:#854D0E;background:#FEF3C7}
.scroll{max-width:100%;overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums lining-nums}
th,td{padding:12px 14px;text-align:left;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);white-space:nowrap}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
th{
  color:#fff;
  background:var(--ink);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
}
tbody tr:nth-child(even){background:var(--color-muted)}
tbody tr:hover{background:#CCFBF1}
td:nth-last-child(-n+3){font-variant-numeric:tabular-nums}
td div[style*="font-size:11px"],td span[style*="font-size:11px"]{font-family:ui-monospace,SFMono-Regular,Consolas,monospace!important;color:var(--muted)!important}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:12px;
  font-weight:800;
}
.pill::before{content:"■";font-size:8px}
.p-good{color:#065F46;background:#D1FAE5}
.p-warn{color:#854D0E;background:#FEF3C7}
.p-bad{color:#991B1B;background:#FEE2E2}
.p-idle{color:#334155;background:#E2E8F0}
.p-info{color:#155E75;background:#CFFAFE}
.chartbox{overflow:hidden;min-width:0}
.apexcharts-canvas{font-family:"Crimson Pro",serif!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  color:var(--ink)!important;
  background:#fff!important;
  border:2px solid var(--ink)!important;
  border-radius:0!important;
  box-shadow:4px 4px 0 var(--ink)!important;
}
.bar{height:12px;min-width:0;overflow:hidden;background:#D8E5E7;border:2px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.punchgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;min-width:0}
.gate{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:15px 12px 13px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  border-radius:0;
}
.gate::after{content:"";position:absolute;left:0;right:0;top:0;width:auto;height:7px;background:var(--muted)}
.gate.ok::after{background:var(--good)}
.gate.busy::after{background:var(--color-primary);background-image:repeating-linear-gradient(45deg,transparent 0 4px,#000 4px 6px)}
.gate.alert::after{background:var(--bad);background-image:repeating-linear-gradient(90deg,transparent 0 5px,#fff 5px 7px)}
.gate .nm{overflow:hidden;font-size:13px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.gate .cnt{margin-top:7px;font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.gate .st{margin-top:4px;color:var(--muted);font-size:12px;font-weight:700}
.facepanel{display:flex;flex-direction:column;gap:10px;min-width:0}
.facerow{
  min-width:0;
  padding:11px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  border-radius:0;
}
.facerow .av{
  width:45px;
  height:45px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  font-weight:700;
}
.facerow .meta{min-width:0;flex:1}
.facerow .meta b{font-size:15px}
.facerow .meta>span{font-family:ui-monospace,SFMono-Regular,Consolas,monospace!important;color:var(--muted)!important}
.facerow .meta div{color:var(--muted);font-size:12px;font-weight:600}
.facerow .score{flex:0 0 auto;text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:800}
.tl{position:relative;min-width:0;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:3px;background:var(--ink)}
.tl .item{position:relative;min-width:0;padding:0 0 19px 8px}
.tl .item::before{content:"◆";position:absolute;top:-2px;left:-25px;color:var(--color-primary);background:#fff;font-size:15px;line-height:1}
.tl .item.bad::before{content:"!";width:16px;height:16px;color:#fff;background:var(--bad);text-align:center;font-weight:800}
.tl .item.good::before{content:"✓";width:16px;height:16px;color:#fff;background:var(--good);text-align:center;font-weight:800}
.tl .item .t{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.tl .item .m{margin-top:2px;font-size:14px;font-weight:800}
.tl .item .d{margin-top:2px;color:var(--muted);font-size:12px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0}
.col{min-width:0;padding:12px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.col>.ch{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800}
.col .cnt{padding:2px 8px;color:#fff;background:var(--ink);border:0;border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.ticket{min-width:0;margin-bottom:10px;padding:12px;background:#fff;border:2px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--color-border)}
.ticket:last-child{margin-bottom:0}
.ticket b{font-size:14px}
.ticket .row{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ticket .who{color:var(--muted);font-size:12px;font-weight:600}
.steps{display:flex;gap:11px;flex-wrap:wrap;min-width:0}
.step{position:relative;min-width:145px;flex:1;padding:13px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.step .n{width:31px;height:31px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:800}
.step.done{background:#CCFBF1}
.step.done .n{color:#000;background:var(--color-primary);border-color:var(--ink)}
.step.done::after{content:"✓ 完成";position:absolute;top:10px;right:10px;color:#065F46;font-size:11px;font-weight:800}
.step .st{margin-top:10px;font-size:14px;font-weight:800}
.step .ds{margin-top:4px;color:var(--muted);font-size:12px;font-weight:600}
.step .badge{margin-top:9px;font-size:11px}
.split{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.chip{min-width:0;padding:6px 9px;color:var(--muted);background:var(--color-muted);border:2px solid var(--ink);border-radius:0;font-size:12px;font-weight:600}
.chip b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.foot{
  margin-top:20px;
  padding:18px;
  color:#fff;
  background:var(--ink);
  border-top:4px solid var(--color-accent);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.08em;
  text-align:center;
}
#view>.scr-head,#view>.grid,#view>.card{animation:brutal-in 400ms cubic-bezier(.2,.9,.3,1.25) both}
#view>.grid:nth-child(2),#view>.card:nth-child(2){animation-delay:60ms}
#view>.grid:nth-child(3),#view>.card:nth-child(3){animation-delay:120ms}
#view>.grid:nth-child(4),#view>.card:nth-child(4){animation-delay:180ms}
@keyframes brutal-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .punchgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  nav.tabs button{font-size:13px}
}
@media(max-width:820px){
  .topbar{position:relative}
  .topbar-in{align-items:stretch;flex-direction:column}
  .live{width:100%;margin:0;border-top:2px solid var(--ink);border-left:0}
  nav.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  nav.tabs button{border-bottom:2px solid var(--ink)}
  nav.tabs button:nth-child(3n){border-right:0}
  nav.tabs button:nth-last-child(-n+3){border-bottom:0}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .grid>.card:nth-child(even){transform:none}
}
@media(max-width:560px){
  .brand{padding:12px}
  .brand .logo{width:42px;height:42px}
  .brand b{white-space:normal}
  .brand span:not(.ms){font-size:11px}
  .live{padding:10px 12px;font-size:12px}
  nav.tabs button{min-height:50px;padding:8px 5px}
  nav.tabs button .lab{display:none}
  nav.tabs button .ms{font-size:23px}
  nav.tabs button.on::after{content:"目前";font-size:10px}
  main{padding:28px 12px}
  .scr-head{align-items:flex-start;padding:24px 17px 18px;box-shadow:5px 5px 0 var(--ink)}
  .scr-head .tag{width:100%;margin-left:0}
  .g4{grid-template-columns:1fr}
  .card{padding:15px;box-shadow:4px 4px 0 var(--ink)}
  .kpi{padding-top:45px}
  .punchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facerow{align-items:flex-start;flex-wrap:wrap}
  .facerow .score{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left}
  .steps{flex-direction:column}
  table{font-size:13px}
  th,td{padding:10px}
}
@media(max-width:375px){
  .brand .logo{display:none}
  .punchgrid{grid-template-columns:1fr}
  .scr-head h1{font-size:34px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="ms">fingerprint</span></div>
        <div style="min-width:0;">
          <b>出勤打卡管理系統</b>
          <span>Attendance Management · 智慧製造出勤控管平台</span>
        </div>
      </div>
      <div class="live"><span class="dot"></span>即時連線 · 3 廠區 · 12 門禁裝置</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main><div id="view"></div></main>
  <div class="foot">Jvision Demo · 純前端展示 · 假資料，無後端連線</div>

  <script>
  (function(){
    var NAV=[
      {i:"monitoring",t:"即時打卡監控"},
      {i:"shield",t:"代打卡攔截"},

      var v='';
      v+=head("資料鎖定薪傳","月結出勤鎖定 · 核可後傳送薪資系統計薪","08 月週期 · 鎖定進行中");
      v+='<div class="grid g4" style="margin-bottom:14px;">'+
        kpi("本期工時","schedule","268,940","小時","flat","1,620 人")+
        kpi("薪資作業","payments","8.3","小時/月","up","-30.7 小時")+
        kpi("異常清零","task_alt","100","%","up","38 → 0")+
        kpi("鎖定進度","lock","3","/ 5","flat","步驟 4 進行中")+
        '</div>';
      v+='<div class="card" style="margin-bottom:14px;"><h3><span class="ms">checklist</span>月結鎖定流程</h3><p class="sub">全數異常清零並經主管核可後方可鎖定薪傳</p>'+
        '<div class="steps">'+steps.map(function(s){
          return '<div class="step '+(s.done?"done":"")+'"><div class="n">'+s.n+'</div><div class="st">'+s.st+'</div>'+
            '<div class="ds">'+s.ds+'</div><span class="pill '+s.b+' badge">'+s.bt+'</span></div>';
        }).join("")+'</div></div>';
      v+='<div class="grid g32">';
      v+='<div class="card chartbox"><h3><span class="ms">trending_down</span>薪資作業工時下降趨勢</h3><p class="sub">出勤自動化後每月薪資作業工時大幅縮短</p><div id="c5a"></div></div>';
      v+='<div class="card"><h3><span class="ms">history</span>稽核軌跡</h3><p class="sub">鎖定與核可全程留痕，可回溯</p><div class="tl">'+
        log.map(function(l){
          return '<div class="item '+(l.g||"")+'"><div class="t">'+l.t+'</div><div class="m">'+l.m+'</div><div class="d">'+l.d+'</div></div>';
        }).join("")+'</div></div>';
      v+='</div>';
      document.getElementById("view").innerHTML=v;
      void document.getElementById("view").offsetHeight;
      mkChart("c5a",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:320},
        series:[{name:"薪資作業工時",data:[39,33,27,21,14,8.3]}],
        xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],labels:AXIS.labels},
        yaxis:AXIS,grid:GRID,dataLabels:{enabled:false},stroke:{curve:"smooth",width:2},
        colors:["#4f46e5"],fill:{type:"gradient",gradient:{opacityFrom:.5,opacityTo:.05}}
      });
    }

    function kpi(lbl,ic,val,unit,dir,note){
      var cls=dir==="up"?"up":(dir==="down"?"down":"flat");
      var arrow=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");
      return '<div class="card kpi"><div class="lbl"><span class="ms">'+ic+'</span>'+lbl+'</div>'+
        '<div class="val">'+val+'<small>'+unit+'</small></div>'+
        '<div class="delta '+cls+'"><span class="ms" style="font-size:16px;">'+arrow+'</span>'+note+'</div></div>';
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];
    function show(i){
      killCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
      SCREENS[i]();
    }
    window.__show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
