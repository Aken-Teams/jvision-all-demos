<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNC 程式傳輸管理系統 · 控制台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
  --color-on-secondary:#000;--color-accent:#ea580c;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#1e293b;--color-card:#fff;
  --color-card-foreground:#1e293b;--color-muted:#e9eff8;--color-muted-foreground:#475569;
  --color-border:#cbd5e1;--color-destructive:#dc2626;--color-on-destructive:#fff;
  --color-ring:#2563eb;--ok:#166534;--warn:#92400e;--info:#1d4ed8;
  --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#cbd5e1
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:auto}
body{margin:0;background-color:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.mono,.num,time,.value,.code,td:nth-child(n+2){font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;border-bottom:3px solid var(--ink);background:rgba(248,250,252,.97)}
.topline{display:flex;align-items:center;gap:18px;padding:12px clamp(14px,3vw,30px)}
.logo{display:grid;place-items:center;width:48px;height:48px;border:3px solid var(--ink);background:var(--blue);color:#fff;font:800 21px "Fira Code";box-shadow:6px 6px 0 var(--ink)}
.brand{display:flex;align-items:center;gap:15px}
.brand h1{margin:0;font-size:clamp(16px,2vw,22px);font-weight:800;line-height:1.05}
.brand p{margin:4px 0 0;color:var(--muted);font:600 10px "Fira Code";letter-spacing:.12em;text-transform:uppercase}
.live{margin-left:auto;padding:8px 11px;border:2px solid var(--ink);background:#dcfce7;color:#14532d;font:700 11px "Fira Code";white-space:nowrap}
.live::before{content:"●";margin-right:7px}
.nav{display:flex;gap:0;overflow-x:auto;padding:0 clamp(14px,3vw,30px)}
.nav button{display:flex;align-items:center;gap:8px;min-height:46px;padding:10px 15px;border:2px solid var(--ink);border-bottom:0;background:#fff;color:var(--muted);font-weight:700;white-space:nowrap}
.nav button+button{border-left:0}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--color-accent);color:var(--color-on-accent);box-shadow:inset 0 -6px 0 var(--ink)}
.ico{width:19px;height:19px;display:inline-grid;place-items:center;font:800 13px "Fira Code";border:2px solid currentColor}
.wrap{width:min(1440px,100%);margin:auto;padding:clamp(18px,3vw,34px)}
.screen-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px;margin-bottom:20px;padding:clamp(20px,4vw,42px);border:3px solid var(--ink);background:#fff;box-shadow:10px 10px 0 var(--blue)}
.eyebrow{color:var(--blue);font:700 12px "Fira Code";letter-spacing:.14em}
h2{margin:6px 0;font-size:clamp(28px,5vw,58px);line-height:.96;letter-spacing:-.045em}
.screen-head p{max-width:760px;margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.7}
.badge,.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;padding:5px 8px;background:#fff;font:700 11px "Fira Code";white-space:nowrap}
.badge.ok,.pill.ok{color:var(--ok);background:#dcfce7}
.badge.warn,.pill.warn{color:var(--warn);background:#fef3c7}
.badge.bad,.pill.bad{color:#991b1b;background:#fee2e2}
.badge.info,.pill.info{color:var(--info);background:#dbeafe}
.badge.muted,.pill.muted{color:var(--muted);background:var(--color-muted)}
.grid{display:grid;gap:15px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:15px}
.cols{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.cols.reverse{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
.card{border:3px solid var(--ink);background:var(--color-card);box-shadow:6px 6px 0 var(--line);padding:17px}
.card h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.sub{margin:5px 0 14px;color:var(--muted);font-size:12px}
.kpi{position:relative;overflow:hidden;min-height:145px}
.kpi::before{content:"";position:absolute;right:-18px;top:-18px;width:66px;height:66px;background:var(--color-muted);border:3px solid var(--ink);transform:rotate(12deg)}
.kpi:nth-child(2n)::before{background:#dbeafe}
.kpi-label{font-size:12px;font-weight:700}
.value{margin-top:17px;font-size:clamp(27px,4vw,38px);font-weight:700;letter-spacing:-.08em}
.value small{font:600 13px "Fira Sans";letter-spacing:0;color:var(--muted)}
.delta{margin-top:8px;color:var(--muted);font-size:11px;font-weight:700}
.delta.up::before{content:"↑ ";color:var(--ok)}
.delta.down::before{content:"↓ ";color:var(--color-destructive)}
.table-wrap{overflow:auto;border:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
th{padding:12px;text-align:left;border-right:1px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--color-muted);font:700 11px "Fira Code";white-space:nowrap}
td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:#eff6ff}
.numeric{text-align:right}
.timeline{border-left:4px solid var(--ink);margin-left:9px;padding-left:20px}
.event{position:relative;margin-bottom:12px;padding:13px;border:2px solid var(--ink);background:#fff}
.event::before{content:"";position:absolute;left:-32px;top:17px;width:14px;height:14px;border:3px solid var(--ink);background:var(--blue)}
.event.old::before{background:var(--color-muted)}
.event.bad::before{background:var(--color-destructive)}
.event-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.event-title{font-weight:800}
.meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:11px}
.code{margin-top:8px;padding:8px;border:2px solid var(--ink);background:#0f172a;color:#e2e8f0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert{display:grid;grid-template-columns:35px 1fr auto;gap:11px;align-items:start;margin-bottom:10px;padding:12px;border:2px solid var(--ink)}
.alert.ok{background:#f0fdf4}.alert.warn{background:#fffbeb}.alert.bad{background:#fef2f2}
.alert-icon{display:grid;place-items:center;width:34px;height:34px;border:2px solid var(--ink);font:800 16px "Fira Code"}
.alert strong{font-size:13px}.alert p{margin:4px 0 0;color:var(--muted);font-size:11.5px;line-height:1.5}
.queue-item{display:grid;grid-template-columns:42px 1fr minmax(130px,200px);gap:13px;align-items:center;padding:13px 0;border-bottom:2px solid var(--line)}
.queue-item:last-child{border-bottom:0}
.queue-icon{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--ink);background:#dbeafe;font:800 12px "Fira Code"}
.queue-name{font-weight:800}.queue-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:11px}
.progress{height:12px;border:2px solid var(--ink);background:#fff}
.progress span{display:block;height:100%;background:var(--blue)}
.progress-label{text-align:right;margin-bottom:5px;font:700 11px "Fira Code"}
.machine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.machine{position:relative;border:2px solid var(--ink);padding:14px;background:#fff}
.machine::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--blue)}
.machine.warn::before{background:#d97706}.machine.bad::before{background:var(--color-destructive)}
.machine-head{display:flex;justify-content:space-between;gap:8px;margin-left:7px}
.machine-id{font:800 16px "Fira Code"}.machine-type{color:var(--muted);font-size:11px}
.machine-foot,.stat{display:flex;justify-content:space-between;gap:12px}
.machine-foot{margin:9px 0 6px 7px;color:var(--muted);font-size:10px}
.stat{padding:10px 0;border-bottom:2px solid var(--line);font-size:12px}
.stat:last-child{border:0}.stat span:last-child{font:700 12px "Fira Code"}
.matrix-status{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid currentColor;font-weight:800}
.matrix-status.ok{color:var(--ok);background:#dcfce7}.matrix-status.warn{color:var(--warn);background:#fef3c7}.matrix-status.bad{color:#991b1b;background:#fee2e2}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:11px}
.legend span::before{content:"■";margin-right:6px}.legend .l-ok::before{color:var(--ok)}.legend .l-warn::before{color:#d97706}.legend .l-bad::before{color:var(--color-destructive)}
.chart{min-height:235px}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.screen-head,.card,.machine{animation:enter .4s cubic-bezier(.2,.9,.25,1.25) both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
@media(max-width:1024px){.machine-grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.cols,.cols.reverse{grid-template-columns:1fr}.screen-head{grid-template-columns:1fr}.live{display:none}.nav{padding-right:0}.wrap{padding:17px}.queue-item{grid-template-columns:42px 1fr}.queue-progress{grid-column:1/-1}.brand p{display:none}}
@media(max-width:480px){.kpis,.machine-grid{grid-template-columns:1fr}.nav button{padding:10px}.nav .label{display:none}.topline{padding:10px 14px}.logo{width:42px;height:42px;box-shadow:4px 4px 0 var(--ink)}.alert{grid-template-columns:35px 1fr}.alert>.pill{grid-column:2}.screen-head{box-shadow:6px 6px 0 var(--blue)}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="topline">
    <div class="brand"><div class="logo">DNC</div><div><h1>工具機程式傳輸管理系統</h1><p>Distributed Numerical Control</p></div></div>
    <div class="live">連線正常 · 12 台機台</div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap"><div id="screen"></div></main>
</div>
<script>
"use strict";
var modules=[
 ["VC","程式版本控管"],["MP","機台配對管理"],["TX","程式傳輸執行"],
 ["SF","機台加工監看"],["AR","傳輸紀錄歸檔"],["SG","誤傳防呆稽核"]
],charts=[];

function esc(v){return String(v).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function kill(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function chart(id,o){var node=document.getElementById(id);if(node&&window.ApexCharts){var c=new ApexCharts(node,o);c.render();charts.push(c)}}
function badge(text,type){return '<span class="badge '+type+'">'+esc(text)+'</span>'}
function kpi(label,value,delta,dir){
 return '<article class="card kpi"><div class="kpi-label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div>'+(delta?'<div class="delta '+(dir||"")+'">'+esc(delta)+'</div>':"")+'</article>'
}
function head(k,t,p,b){return '<header class="screen-head"><div><div class="eyebrow">'+k+'</div><h2>'+t+'</h2><p>'+p+'</p></div>'+b+'</header>'}
function alertBox(type,icon,title,desc,status){
 return '<div class="alert '+type+'"><div class="alert-icon" aria-hidden="true">'+icon+'</div><div><strong>'+title+'</strong><p>'+desc+'</p></div>'+badge(status,type)+'</div>'
}
var base={
 chart:{fontFamily:"Fira Code",toolbar:{show:false},animations:{enabled:false},foreColor:"#475569"},
 grid:{borderColor:"#cbd5e1",strokeDashArray:0},dataLabels:{enabled:false},
 tooltip:{theme:"light"},legend:{labels:{colors:"#475569"}}
};

function v0(){
 var data=[
 ["v4.2.0","HSG-4021-FINISH.nc","陳彥廷","2026-08-13 09:12","已發行","HEAD · +18 / -6 行","精修進給率 F1200→F980，補刀補償 D07",""],
 ["v4.1.3","HSG-4021-ROUGH.nc","陳彥廷","2026-08-12 16:40","已發行","+4 / -4 行","修正 Z 軸安全高度 G43 H01",""],
 ["v4.1.0","HSG-4021-ROUGH.nc","林孟潔","2026-08-11 11:05","已封存","+52 / -12 行","新增第二把面銑刀路徑","old"],
 ["v4.0.0","HSG-4021-BASE.nc","林孟潔","2026-08-08 14:22","已封存","初版","由 CAM 匯出建立基準版","old"]
 ];
 var events=data.map(function(x){return '<div class="event '+x[7]+'"><div class="event-head"><span class="event-title mono">'+x[0]+'</span>'+badge(x[4],x[4]==="已發行"?"ok":"muted")+'</div><div class="meta"><span>'+x[1]+'</span><span>'+x[2]+'</span><time>'+x[3]+'</time><span>'+x[5]+'</span></div><div class="code">'+x[6]+'</div></div>'}).join("");
 return head("VERSION CONTROL","程式版本控管","NC 加工程式上傳後自動比對前一版差異，標註變更行號並送出簽核發行；發行版才可進入傳輸佇列。",badge("狀態正常 · 本月發行 46 版","ok"))+
 '<section class="grid kpis">'+kpi("本月上傳版次","128","+22","up")+kpi("待簽核發行","3","須今日內完成")+kpi("平均變更行數","24","較上月減少 3 行","up")+kpi("版本回溯次數","5","本月")+'</section>'+
 '<section class="grid cols"><article class="card"><h3>工件 HSG-4021 版本樹</h3><p class="sub">鋁合金外殼加工程式 · 分支 main</p><div class="timeline">'+events+'</div></article>'+
 '<article class="card"><h3>每週發行版次趨勢</h3><p class="sub">上傳 vs 正式發行</p><div id="c0" class="chart"></div><div class="stat"><span>發行通過率</span><span>94.6%</span></div><div class="stat"><span>平均簽核時效</span><span>2.4 小時</span></div><div class="stat"><span>被退回重工版次</span><span>7</span></div></article></section>'
}
function c0(){chart("c0",Object.assign({},base,{chart:{type:"bar",height:235,fontFamily:"Fira Code",toolbar:{show:false},animations:{enabled:false}},series:[{name:"上傳",data:[22,31,26,34,29,28]},{name:"正式發行",data:[18,25,21,27,24,25]}],colors:["#93c5fd","#2563eb"],plotOptions:{bar:{columnWidth:"62%",borderRadius:0}},xaxis:{categories:["W28","W29","W30","W31","W32","W33"]}}))}

function v1(){
 var machines=[["MC-01","5軸"],["MC-04","臥式"],["MC-07","車銑"],["LT-02","車床"],["GD-03","磨床"]];
 var rows=[["HSG-4021-FINISH","ok","warn","bad","bad","bad"],["BRK-2210-TURN","bad","bad","ok","ok","bad"],["SFT-8830-GRIND","bad","bad","bad","bad","ok"],["PLT-1140-MILL","ok","ok","warn","bad","bad"],["CAM-5502-5AX","ok","bad","bad","bad","bad"]];
 var th='<th>程式 \\ 機台</th>'+machines.map(function(x){return'<th style="text-align:center">'+x[0]+'<br>'+x[1]+'</th>'}).join("");
 var body=rows.map(function(r){return'<tr><td class="mono">'+r[0]+'</td>'+r.slice(1).map(function(s){return'<td style="text-align:center"><span class="matrix-status '+s+'" aria-label="'+(s==="ok"?"可下發":s==="warn"?"條件相符":"不相容")+'">'+(s==="ok"?"✓":s==="warn"?"!":"×")+'</span></td>'}).join("")+'</tr>'}).join("");
 return head("MACHINE PAIRING","機台配對管理","依配對規則交叉驗證「程式 ↔ 機台 ↔ 刀具 ↔ 夾治具」是否相符，任一項不符即阻擋下發，杜絕錯機台誤傳。",badge("注意 · 1 組待確認","warn"))+
 '<section class="grid kpis">'+kpi("啟用配對規則","86","跨 12 台機")+kpi("本日通過配對","41")+kpi("阻擋誤配","6","含 2 錯版","up")+kpi("配對相符率","96.1%","+1.8%","up")+'</section>'+
 '<section class="grid cols"><article class="card"><h3>程式 × 機台 相容矩陣</h3><p class="sub">符號與文字同步標示相容狀態</p><div class="table-wrap"><table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div><div class="legend"><span class="l-ok">✓ 可下發</span><span class="l-warn">! 條件相符</span><span class="l-bad">× 不相容</span></div></article>'+
 '<article class="card"><h3>HSG-4021-FINISH 刀具/治具檢核</h3><p class="sub">目標機台 MC-01（5 軸）</p>'+
 alertBox("warn","!","T07 面銑刀 Ø63","需求 D=63.0 L=120 · 現況 D=63.0 L=118","刀長偏差 2mm")+
 alertBox("ok","✓","T12 鑽頭 Ø8.5","需求 D=8.5 · 現況 D=8.5","符合")+
 alertBox("ok","✓","夾治具 FX-220","需求 FX-220 · 現況 FX-220","符合")+
 alertBox("bad","×","T03 精修球刀 Ø6","需求 D=6.0 R3 · 現況 未安裝","缺件，禁止傳輸")+'</article></section>'
}

function v2(){
 var q=[
 ["TX","HSG-4021-FINISH.nc v4.2.0","MC-01","1.8 MB","CRC 校驗中",72,"傳輸中","info"],
 ["OK","PLT-1140-MILL.nc v2.0.1","MC-04","940 KB","CRC OK · 0x8A2F",100,"完成","ok"],
 ["RT","BRK-2210-TURN.nc v3.4.0","LT-02","612 KB","自 41% 續傳",38,"斷點續傳","warn"],
 ["Q3","CAM-5502-5AX.nc v1.9.0","MC-01","3.2 MB","排隊 #3",0,"佇列等待","muted"],
 ["OK","SFT-8830-GRIND.nc v5.1.2","GD-03","420 KB","CRC OK · 0x1C7D",100,"完成","ok"]
 ];
 var list=q.map(function(x){return'<div class="queue-item"><div class="queue-icon">'+x[0]+'</div><div><div class="queue-name">'+x[1]+'</div><div class="queue-meta"><span>目標 '+x[2]+'</span><span>'+x[3]+'</span><span>'+x[4]+'</span></div></div><div class="queue-progress"><div class="progress-label">'+x[5]+'% · '+x[6]+'</div><div class="progress" role="progressbar" aria-valuenow="'+x[5]+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+x[5]+'%"></span></div></div></div>'}).join("");
 return head("TRANSFER QUEUE","程式傳輸執行","將發行版程式加入 DNC 佇列下發至指定機台，即時監看傳輸進度、CRC 校驗與斷點續傳狀態。",badge("即時 · 佇列 5 筆 / 1 傳輸中","info"))+
 '<section class="grid kpis">'+kpi("今日傳輸筆數","238")+kpi("傳輸成功率","99.2%","+0.6%","up")+kpi("平均傳輸耗時","4.8s","減少 1.1s","up")+kpi("校驗失敗重傳","2","已自動續傳")+'</section>'+
 '<section class="grid cols"><article class="card"><h3>DNC 傳輸佇列</h3>'+list+'</article><article class="card"><h3>各時段傳輸吞吐（今日）</h3><p class="sub">單位：MB</p><div id="c2" class="chart"></div></article></section>'
}
function c2(){chart("c2",Object.assign({},base,{chart:{type:"area",height:250,fontFamily:"Fira Code",toolbar:{show:false},animations:{enabled:false}},series:[{name:"傳輸量 MB",data:[6,9,14,11,18,22,17,24,20]}],colors:["#2563eb"],stroke:{curve:"straight",width:3},fill:{type:"solid",opacity:.16},xaxis:{categories:["08","09","10","11","12","13","14","15","16"]}}))}

function v3(){
 var ms=[
 ["MC-01","5 軸加工中心","加工中","ok","N2480 G01 X128.5 Z-42.0 F980","WO-88231","68%","6800 rpm"],
 ["MC-04","臥式加工中心","加工中","ok","N1120 G43 H02 Z5.0","WO-88240","41%","4200 rpm"],
 ["MC-07","車銑複合機","換刀中","info","— 待載入程式 —","WO-88255","0%","待機"],
