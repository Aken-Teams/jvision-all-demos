<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DNC 程式傳輸管理系統 · 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#0d9488; --accent2:#2dd4bf;
  --bg:#0a1416; --panel:#122528; --panel2:#0d1e21;
  --line:#1e3a3d; --txt:#e6f2f1; --mut:#7ea6a4; --dim:#5a8482;
  --ok:#2dd4bf; --warn:#f5b942; --bad:#ef6461; --info:#5fa8e8;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#12363555,transparent),var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
.mi{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0c1c1eee,#0a1416ee);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#03201d;box-shadow:0 0 18px #0d948855}
.logo .mi{font-size:24px}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand p{font-size:10.5px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
.livepill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent2);background:#0d948822;border:1px solid #0d948855;padding:5px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2dd4bf99}70%{box-shadow:0 0 0 7px #2dd4bf00}100%{box-shadow:0 0 0 0 #2dd4bf00}}
.nav{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.nav button:hover{color:var(--txt);border-color:#2a5a5c}
.nav button.on{background:linear-gradient(135deg,var(--accent),#0b7d73);color:#eafffb;border-color:var(--accent2);box-shadow:0 4px 16px #0d948844}
.nav button .mi{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.scr-head .t .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);font-weight:700}
.scr-head .t h2{font-size:22px;font-weight:800;margin-top:3px}
.scr-head .t p{font-size:13px;color:var(--mut);margin-top:4px;max-width:640px}
.tag{font-size:11px;padding:5px 11px;border-radius:20px;font-weight:700;border:1px solid;white-space:nowrap}
.tag.g{color:var(--ok);border-color:#2dd4bf55;background:#2dd4bf14}
.tag.y{color:var(--warn);border-color:#f5b94255;background:#f5b94214}
.tag.r{color:var(--bad);border-color:#ef646155;background:#ef646114}
.tag.b{color:var(--info);border-color:#5fa8e855;background:#5fa8e814}
.tag.m{color:var(--mut);border-color:var(--line);background:#ffffff08}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
@media(max-width:820px){.g4,.g23,.g32{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card h3 .mi{font-size:18px;color:var(--accent2)}
.card .sub{font-size:11.5px;color:var(--dim);margin-bottom:12px}
.card-hd{padding:15px 16px 12px;border-bottom:1px solid var(--line)}
.card-hd h3{margin:0}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#2dd4bf22,transparent 70%)}
.kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:600}
.kpi .lab .mi{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:30px;font-weight:800;margin-top:8px;font-family:'Inter';letter-spacing:-.5px}
.kpi .val small{font-size:14px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;font-weight:600}
.kpi .delta.up{color:var(--ok)}.kpi .delta.down{color:var(--bad)}
.tbl-w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid #ffffff08;white-space:nowrap;color:var(--txt)}
tbody tr:hover{background:#ffffff06}
.mono{font-family:'Inter';font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.g{color:var(--ok);background:#2dd4bf1c}.pill.y{color:var(--warn);background:#f5b9421c}.pill.r{color:var(--bad);background:#ef64611c}.pill.b{color:var(--info);background:#5fa8e81c}.pill.m{color:var(--mut);background:#ffffff0e}
.bar{height:6px;border-radius:5px;background:#ffffff12;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.vtree{position:relative;padding-left:6px}
.vnode{display:flex;gap:14px;position:relative}
.vline{display:flex;flex-direction:column;align-items:center;flex:none;width:34px}
.vdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent2);background:var(--panel);z-index:2;flex:none;margin-top:16px}
.vdot.head{background:var(--accent2);box-shadow:0 0 12px #2dd4bf}
.vdot.old{border-color:var(--dim)}
.vconn{flex:1;width:2px;background:var(--line);margin:2px 0}
.vbody{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:12px}
.vbody .r1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vbody .ver{font-family:'Inter';font-weight:800;font-size:15px;color:var(--accent2)}
.vbody .meta{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.vbody .meta b{color:var(--txt);font-weight:600}
.diffchip{font-size:11px;font-family:'Inter';padding:2px 8px;border-radius:6px;background:#0d948818;color:var(--accent2);border:1px solid #0d948833}
.mtx{overflow-x:auto}
.chk{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:16px}
.chk.ok{background:#2dd4bf1c;color:var(--ok)}
.chk.no{background:#ef64611c;color:var(--bad)}
.chk.wn{background:#f5b9421c;color:var(--warn)}
.q-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 15px;border-bottom:1px solid #ffffff08}
.q-item:last-child{border-bottom:none}
.q-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:#0d948815;border:1px solid #0d948833}
.q-ic .mi{font-size:22px;color:var(--accent2)}
.q-mid .nm{font-weight:700;font-size:13.5px;white-space:normal}
.q-mid .sb{font-size:11.5px;color:var(--mut);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.q-prog{width:180px;max-width:38vw}
.q-prog .pct{font-size:11px;color:var(--accent2);font-weight:700;text-align:right;margin-bottom:5px;font-family:'Inter'}
@media(max-width:560px){.q-item{grid-template-columns:auto 1fr}.q-prog{grid-column:1/-1;width:100%;max-width:100%}}
.mboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.mboard{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.mboard{grid-template-columns:1fr}}
.mcell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.mcell .st-strip{position:absolute;left:0;top:0;bottom:0;width:4px}
.mcell.run .st-strip{background:var(--ok)}
.mcell.idle .st-strip{background:var(--warn)}
.mcell.down .st-strip{background:var(--bad)}
.mcell.setup .st-strip{background:var(--info)}
.mcell .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcell .mid{font-weight:800;font-size:15px;font-family:'Inter'}
.mcell .mt{font-size:11px;color:var(--dim);margin-top:2px}
.mcell .prog-nc{font-family:'Inter';font-size:12px;color:var(--accent2);margin-top:10px;background:#0a1416;border:1px solid var(--line);border-radius:7px;padding:7px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcell .prog-nc.cno{color:var(--bad)}
.mcell .foot{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--mut)}
.mcell .foot b{color:var(--txt);font-family:'Inter'}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.arch{position:relative;padding-left:20px}
.arch::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.aitem{position:relative;padding:0 0 16px 16px}
.aitem::before{content:"";position:absolute;left:-18px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--accent2)}
.aitem.err::before{border-color:var(--bad)}
.aitem .at{font-size:11px;color:var(--dim);font-family:'Inter'}
.aitem .ah{font-size:13px;font-weight:700;margin:3px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aitem .ad{font-size:12px;color:var(--mut)}
.hashv{font-family:'Inter';font-size:11px;color:var(--dim);background:#ffffff08;padding:2px 7px;border-radius:5px}
.alrt{display:flex;gap:12px;padding:13px;border-radius:11px;border:1px solid;align-items:flex-start}
.alrt.r{border-color:#ef646140;background:#ef64610d}
.alrt.y{border-color:#f5b94240;background:#f5b9420d}
.alrt.g{border-color:#2dd4bf40;background:#2dd4bf0d}
.alrt .ai{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.alrt.r .ai{background:#ef646120;color:var(--bad)}
.alrt.y .ai{background:#f5b94220;color:var(--warn)}
.alrt.g .ai{background:#2dd4bf20;color:var(--ok)}
.alrt .nm{font-weight:700;font-size:13px}
.alrt .ds{font-size:11.5px;color:var(--mut);margin-top:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.ld{width:10px;height:10px;border-radius:3px}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff08;font-size:12.5px}
.stat-row:last-child{border:none}
.stat-row .k{color:var(--mut)}
.stat-row .v{font-weight:700;font-family:'Inter'}
.chip-row{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:560px){.nav button .lbl{display:none}.nav button{padding:9px 11px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="mi">lan</span></div>
      <div><h1>DNC 程式傳輸管理系統</h1><p>Distributed Numerical Control</p></div>
    </div>
    <div style="flex:1"></div>
    <div class="livepill"><span class="dot"></span> 12 台機台連線中</div>
  </div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var AX={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},foreColor:"#7ea6a4",toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
  grid:{borderColor:"#1e3a3d",strokeDashArray:3},
  tooltip:{theme:"dark"},
  legend:{labels:{colors:"#7ea6a4"}}};
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(el2,opt){if(!el2)return;var c=new ApexCharts(el2,opt);c.render();charts.push(c);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function el(id){return document.getElementById(id);}

var MODULES=[
  {icon:"account_tree",name:"程式版本控管"},
  {icon:"hub",name:"機台配對管理"},
  {icon:"cable",name:"程式傳輸執行"},
  {icon:"precision_manufacturing",name:"機台加工監看"},
  {icon:"receipt_long",name:"傳輸紀錄歸檔"},
  {icon:"shield",name:"誤傳防呆稽核"}
];

function kpi(icon,lab,val,delta,dir){
  var vv=String(val), unit="";
  var m=vv.match(/^([\d.,]+)(.*)$/);
  if(m){vv=m[1];unit=m[2];}
  var d="";
  if(delta){d='<div class="delta '+(dir==="up"?"up":dir==="down"?"down":"")+'">'+
    (dir==="up"?'<span class="mi" style="font-size:15px">trending_up</span>':dir==="down"?'<span class="mi" style="font-size:15px">trending_down</span>':'')+esc(delta)+'</div>';}
  return '<div class="card kpi"><div class="lab"><span class="mi">'+icon+'</span>'+esc(lab)+'</div>'+
    '<div class="val">'+esc(vv)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div>'+d+'</div>';
}

/* ---------- SCREEN 0 ---------- */
function v0(){
  var vers=[
    {v:"v4.2.0",head:true,old:false,prog:"HSG-4021-FINISH.nc",eng:"陳彥廷",time:"2026-08-13 09:12",st:"已發行",tag:"g",diff:"+18 / -6 行",note:"精修進給率 F1200→F980，補刀補償 D07"},
    {v:"v4.1.3",head:false,old:false,prog:"HSG-4021-ROUGH.nc",eng:"陳彥廷",time:"2026-08-12 16:40",st:"已發行",tag:"g",diff:"+4 / -4 行",note:"修正 Z 軸安全高度 G43 H01"},
    {v:"v4.1.0",head:false,old:false,prog:"HSG-4021-ROUGH.nc",eng:"林孟潔",time:"2026-08-11 11:05",st:"已封存",tag:"m",diff:"+52 / -12 行",note:"新增第二把面銑刀路徑"},
    {v:"v4.0.0",head:false,old:true,prog:"HSG-4021-BASE.nc",eng:"林孟潔",time:"2026-08-08 14:22",st:"已封存",tag:"m",diff:"初版",note:"由 CAM 匯出建立基準版"}
  ];
  var rows=vers.map(function(x){
    return '<div class="vnode"><div class="vline">'+
      '<div class="vdot '+(x.head?"head":"")+' '+(x.old?"old":"")+'"></div>'+
      '<div class="vconn"></div></div>'+
      '<div class="vbody"><div class="r1"><span class="ver">'+esc(x.v)+(x.head?' <span class="tag g" style="margin-left:8px">HEAD</span>':'')+'</span>'+
      '<span class="tag '+x.tag+'">'+esc(x.st)+'</span></div>'+
      '<div class="meta"><span><span class="mi" style="font-size:14px">description</span> '+esc(x.prog)+'</span>'+
      '<span><span class="mi" style="font-size:14px">person</span> '+esc(x.eng)+'</span>'+
      '<span class="diffchip">'+esc(x.diff)+'</span></div>'+
      '<div class="meta" style="margin-top:8px;color:var(--dim)">'+esc(x.time)+' · '+esc(x.note)+'</div></div></div>';
  }).join("");
  return '<div class="scr-head"><div class="t"><div class="k">VERSION CONTROL</div><h2>程式版本控管</h2>'+
    '<p>NC 加工程式上傳後自動比對前一版差異，標註變更行號並送出簽核發行；發行版才可進入傳輸佇列。</p></div>'+
    '<span class="tag g">本月發行 46 版</span></div>'+
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi("upload_file","本月上傳版次","128","+22","up")+
      kpi("verified","待簽核發行","3","須今日內完成","")+
      kpi("difference","平均變更行數","24","−3 較上月","up")+
      kpi("history","版本回溯次數","5","本月","")+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><h3><span class="mi">account_tree</span> 工件 HSG-4021 版本樹</h3><div class="sub">鋁合金外殼加工程式 · 分支 main</div><div class="vtree">'+rows+'</div></div>'+
      '<div class="card"><h3><span class="mi">insights</span> 每週發行版次趨勢</h3><div class="sub">上傳 vs 正式發行</div><div id="c0" style="min-height:220px"></div>'+
        '<div class="stat-row"><span class="k">發行通過率</span><span class="v" style="color:var(--ok)">94.6%</span></div>'+
        '<div class="stat-row"><span class="k">平均簽核時效</span><span class="v">2.4 小時</span></div>'+
        '<div class="stat-row"><span class="k">被退回重工版次</span><span class="v" style="color:var(--warn)">7</span></div>'+
      '</div>'+
    '</div>';
}
function c0(){
  mk(el("c0"),Object.assign({},AX,{
    chart:Object.assign({},AX.chart,{type:"bar",height:220}),
    series:[{name:"上傳",data:[22,31,26,34,29,28]},{name:"正式發行",data:[18,25,21,27,24,25]}],
    colors:["#2a5a5c","#2dd4bf"],
    plotOptions:{bar:{columnWidth:"55%",borderRadius:3}},
    dataLabels:{enabled:false},
    xaxis:{categories:["W28","W29","W30","W31","W32","W33"],labels:{style:{colors:"#7ea6a4"}}},
    yaxis:{labels:{style:{colors:"#7ea6a4"}}}
  }));
}

/* ---------- SCREEN 1 ---------- */
function v1(){
  var machines=[["MC-01","5軸"],["MC-04","臥式"],["MC-07","車銑"],["LT-02","車床"],["GD-03","磨床"]];
  var progs=[
    {p:"HSG-4021-FINISH", cells:["ok","wn","no","no","no"]},
    {p:"BRK-2210-TURN", cells:["no","no","ok","ok","no"]},
    {p:"SFT-8830-GRIND", cells:["no","no","no","no","ok"]},
    {p:"PLT-1140-MILL", cells:["ok","ok","wn","no","no"]},
    {p:"CAM-5502-5AX", cells:["ok","no","no","no","no"]}
  ];
  var head='<th>程式 \\ 機台</th>'+machines.map(function(m){return '<th style="text-align:center">'+esc(m[0])+'<br><span style="color:var(--dim);font-weight:400">'+esc(m[1])+'</span></th>';}).join("");
  var body=progs.map(function(r){
    return '<tr><td class="mono" style="font-weight:600">'+esc(r.p)+'</td>'+r.cells.map(function(c){
      var m={ok:["ok","check"],no:["no","block"],wn:["wn","priority_high"]}[c];
      return '<td style="text-align:center"><span class="chk '+m[0]+'"><span class="mi">'+m[1]+'</span></span></td>';
    }).join("")+'</tr>';
  }).join("");
  var toolReq=[
    {t:"T07 面銑刀 Ø63",need:"D=63.0 L=120",have:"D=63.0 L=118",st:"warn",stt:"刀長偏差 2mm"},
    {t:"T12 鑽頭 Ø8.5",need:"D=8.5",have:"D=8.5",st:"ok",stt:"符合"},
    {t:"夾治具 FX-220",need:"FX-220",have:"FX-220",st:"ok",stt:"符合"},

var INIT=[c0,null,c2,null,c4,c5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var nav=document.querySelectorAll("#nav button");
  for(var n=0;n<nav.length;n++){nav[n].classList.toggle("on",+nav[n].getAttribute("data-i")===i);}
  var c=el("screen");
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  if(INIT[i])INIT[i]();
}
(function(){
  var nav=el("nav");
  nav.innerHTML=MODULES.map(function(m,i){
    return '<button data-i="'+i+'"><span class="mi">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span></button>';
  }).join("");
  for(var i=0;i<nav.children.length;i++){(function(idx){nav.children[idx].addEventListener("click",function(){location.hash="go="+idx;show(idx);});})(i);}
  show(0);
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
