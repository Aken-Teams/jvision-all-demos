<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>庫存管理系統（Inventory Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#334155;
      --color-on-primary:#fff;
      --color-secondary:#475569;
      --color-on-secondary:#fff;
      --color-accent:#059669;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#0f172a;
      --color-card:#fff;
      --color-card-foreground:#0f172a;
      --color-muted:#f2f3f4;
      --color-muted-foreground:#475569;
      --color-border:#e6e8ea;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#334155;
      --blue:#334155;
      --ink:#0f172a;
      --muted:#475569;
      --line:#e6e8ea;
      --accent:#059669;
      --accent-soft:#d1fae5;
      --bg:#f8fafc;
      --card:#fff;
      --ok:#047857;
      --warn:#a16207;
      --bad:#dc2626;
      --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 20px rgba(15,23,42,.035);
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:var(--color-background);
      color:var(--color-foreground);
      font-family:"Open Sans",system-ui,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button,a{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid rgba(51,65,85,.32);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .shell{display:flex;min-height:100vh}
    .side{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      flex:0 0 252px;
      flex-direction:column;
      width:252px;
      height:100vh;
      padding:24px 16px;
      overflow:auto;
      background:#fff;
      border-right:1px solid var(--line);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:26px;
      padding:0 8px;
    }
    .brand .logo{
      display:grid;
      flex:0 0 42px;
      width:42px;
      height:42px;
      place-items:center;
      color:#fff;
      background:var(--color-primary);
      border-radius:8px;
    }
    .brand .logo .material-symbols-outlined{font-size:23px}
    .brand b{
      display:block;
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:14px;
      font-weight:600;
      letter-spacing:-.01em;
    }
    .brand span:not(.material-symbols-outlined){
      display:block;
      margin-top:1px;
      color:var(--muted);
      font-size:10.5px;
      letter-spacing:.02em;
    }
    .nav{display:flex;flex-direction:column;gap:5px}
    .nav button{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      min-width:0;
      min-height:48px;
      padding:8px 10px;
      color:var(--color-secondary);
      text-align:left;
      background:transparent;
      border:1px solid transparent;
      border-radius:8px;
      transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
    }
    .nav button:hover{
      color:var(--ink);
      background:var(--color-muted);
      border-color:var(--line);
      transform:translateX(2px);
    }
    .nav button.on{
      color:#fff;
      background:var(--color-primary);
      border-color:var(--color-primary);
    }
    .nav button.on::before{
      position:absolute;
      top:12px;
      bottom:12px;
      left:-17px;
      width:3px;
      content:"";
      background:var(--accent);
    }
    .nav button .material-symbols-outlined{
      flex:0 0 auto;
      color:#64748b;
      font-size:21px;
      transition:color .2s ease;
    }
    .nav button.on .material-symbols-outlined{color:#6ee7b7}
    .nav button .lbl{
      min-width:0;
      overflow:hidden;
      font-size:13px;
      font-weight:700;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .nav button small{
      display:block;
      margin-top:1px;
      color:#64748b;
      font-size:10.5px;
      font-weight:500;
    }
    .nav button.on small{color:#cbd5e1}
    .side .foot{
      margin-top:auto;
      padding:18px 8px 0;
      color:#64748b;
      font-size:10.5px;
      line-height:1.7;
      border-top:1px solid var(--line);
    }
    .main{
      flex:1 1 auto;
      min-width:0;
      max-width:1600px;
      margin:0 auto;
      padding:30px 32px 48px;
    }
    #screen{min-width:0}
    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:22px;
    }
    .topbar h1{
      margin:0;
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:25px;
      font-weight:600;
      line-height:1.25;
      letter-spacing:-.025em;
    }
    .topbar .sub{
      max-width:720px;
      margin-top:6px;
      color:var(--muted);
      font-size:12.5px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      min-height:34px;
      padding:6px 11px;
      color:var(--color-secondary);
      font-size:11.5px;
      font-weight:700;
      background:#fff;
      border:1px solid var(--line);
      border-radius:6px;
      box-shadow:0 1px 1px rgba(15,23,42,.03);
    }
    .pill .material-symbols-outlined{color:var(--accent);font-size:17px}
    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
    .card{
      min-width:0;
      padding:18px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      box-shadow:var(--shadow);
      transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
    }
    .card:hover{
      border-color:#cbd5e1;
      box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 28px rgba(15,23,42,.055);
      transform:translateY(-2px);
    }
    .card h3{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 3px;
      color:var(--ink);
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:13.5px;
      font-weight:600;
    }
    .card h3 .material-symbols-outlined{
      color:var(--accent);
      font-size:19px;
    }
    .card .ch3-sub{
      margin:0 0 14px;
      color:var(--muted);
      font-size:11.5px;
    }
    .kpi{position:relative;overflow:hidden}
    .kpi::after{
      position:absolute;
      top:0;
      right:0;
      width:54px;
      height:3px;
      content:"";
      background:var(--accent);
    }
    .kpi .lab{
      display:flex;
      align-items:center;
      gap:9px;
      color:var(--muted);
      font-size:11.5px;
      font-weight:700;
    }
    .kpi .lab .ic{
      display:grid;
      flex:0 0 32px;
      width:32px;
      height:32px;
      place-items:center;
      color:var(--color-primary);
      background:#f1f5f9;
      border:1px solid #e2e8f0;
      border-radius:7px;
    }
    .kpi .lab .ic .material-symbols-outlined{font-size:18px}
    .kpi .val{
      margin-top:12px;
      color:var(--ink);
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:27px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.04em;
    }
    .kpi .val small{
      color:var(--muted);
      font-family:"Open Sans",sans-serif;
      font-size:12px;
      font-weight:700;
      letter-spacing:0;
    }
    .kpi .delta{
      display:inline-flex;
      align-items:center;
      gap:3px;
      margin-top:6px;
      font-size:11px;
      font-weight:700;
    }
    .kpi .delta.up{color:var(--ok)}
    .kpi .delta.down{color:var(--bad)}
    .kpi .delta.flat{color:var(--muted)}
    .kpi .delta .material-symbols-outlined{font-size:15px}
    .chart{width:100%;height:270px;overflow:hidden}
    .chart.sm{height:210px}
    .scroll{
      max-width:100%;
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:7px;
      -webkit-overflow-scrolling:touch;
    }
    table{
      width:100%;
      min-width:520px;
      font-size:12px;
      border-collapse:collapse;
      font-variant-numeric:tabular-nums;
    }
    th,td{
      padding:10px 12px;
      text-align:left;
      white-space:nowrap;
      border-bottom:1px solid var(--line);
    }
    th{
      color:#334155;
      font-size:10.5px;
      font-weight:700;
      letter-spacing:.035em;
      background:#f1f5f9;
    }
    td:first-child,td:nth-child(4),td:nth-child(5),td:nth-child(6){
      font-variant-numeric:tabular-nums;
    }
    td:first-child b{font-family:var(--mono);font-size:11.5px}
    tbody tr{transition:background-color .18s ease}
    tbody tr:hover{background:#f8fafc}
    tbody tr:last-child td{border-bottom:0}
    .tag{
      display:inline-flex;
      align-items:center;
      min-height:24px;
      padding:3px 8px;
      font-size:10.5px;
      font-weight:700;
      line-height:1.2;
      border:1px solid currentColor;
      border-radius:5px;
    }
    .t-ok{color:#047857;background:#ecfdf5}
    .t-warn{color:#92400e;background:#fffbeb}
    .t-bad{color:#b91c1c;background:#fef2f2}
    .t-info{color:#334155;background:#f1f5f9}
    .t-mut{color:#475569;background:#f8fafc}
    .bar{
      height:7px;
      min-width:66px;
      overflow:hidden;
      background:#e2e8f0;
      border-radius:2px;
    }
    .bar>i{
      display:block;
      height:100%;
      background:var(--accent);
      border-radius:2px;
      transition:width .45s ease;
    }
    .board{
      display:grid;
      grid-template-columns:repeat(4,minmax(210px,1fr));
      gap:12px;
      min-width:900px;
    }
    .col{
      min-width:0;
      padding:11px;
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:8px;
    }
    .col .ch{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
      color:#334155;
      font-size:11.5px;
      font-weight:800;
    }
    .col .ch .cnt{
      min-width:24px;
      padding:2px 7px;
      color:#fff;
      text-align:center;
      background:var(--color-primary);
      border-radius:4px;
    }
    .ticket{
      margin-bottom:8px;
      padding:10px;
      background:#fff;
      border:1px solid var(--line);
      border-left:3px solid var(--accent);
      border-radius:6px;
      transition:border-color .2s ease,transform .2s ease;
    }
    .ticket:hover{border-color:#94a3b8;transform:translateY(-1px)}
    .ticket:last-child{margin-bottom:0}
    .ticket b{font-family:var(--mono);font-size:11.5px}
    .ticket .m{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-top:5px;
      color:var(--muted);
      font-size:10.5px;
    }
    .tl{
      position:relative;
      margin:0;
      padding-left:24px;
      list-style:none;
    }
    .tl::before{
      position:absolute;
      top:4px;
      bottom:4px;
      left:7px;
      width:1px;
      content:"";
      background:#cbd5e1;
    }
    .tl li{position:relative;padding:0 0 17px 6px}
    .tl li::before{
      position:absolute;
      top:4px;
      left:-21px;
      width:9px;
      height:9px;
      content:"";
      background:var(--accent);
      border:2px solid #fff;
      border-radius:50%;
      box-shadow:0 0 0 1px var(--color-primary);
    }
    .tl li b{font-size:12.5px}
    .tl li .tm{
      color:var(--muted);
      font-family:var(--mono);
      font-size:10.5px;
    }
    .tl li p{margin:5px 0 0;color:#334155;font-size:11.5px}
    .legend{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:10px;
      color:var(--muted);
      font-size:11px;
    }
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .dot{
      display:inline-block;
      width:10px;
      height:10px;
      border:1px solid rgba(15,23,42,.18);
      border-radius:2px;
    }
    .mini{display:flex;flex-wrap:wrap;gap:8px}
    .mini .m{
      flex:1 1 100px;
      min-width:0;
      padding:10px;
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:6px;
    }
    .mini .m .k{color:var(--muted);font-size:10.5px;font-weight:700}
    .mini .m .v{
      margin-top:3px;
      font-family:"Poppins",sans-serif;
      font-size:18px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
    }
    .hb{display:flex;align-items:center;gap:10px;margin-bottom:11px}
    .hb .n{
      flex:0 0 76px;
      width:76px;
      min-width:0;
      overflow:hidden;
      font-size:11px;
      font-weight:700;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .hb .bar{flex:1 1 auto;height:13px}
    .hb .v{
      flex:0 0 42px;
      width:42px;
      font-family:var(--mono);
      font-size:11px;
      font-weight:700;
      text-align:right;
    }
    .heat{
      display:grid;
      grid-template-columns:auto repeat(6,1fr);
      gap:5px;
      min-width:420px;
      padding:8px;
    }
    .heat .hc{
      display:flex;
      align-items:center;
      justify-content:center;
      height:34px;
      color:#fff;
      font-family:var(--mono);
      font-size:11px;
      font-weight:700;
      border-radius:4px;
    }
    .heat .rl{display:flex;align-items:center;font-size:10.5px;font-weight:700}
    .heat .cl{color:var(--muted);font-size:10px;font-weight:600;text-align:center}
    .screen-enter .card{
      animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both;
    }
    .screen-enter .card:nth-child(2){animation-delay:.05s}
    .screen-enter .card:nth-child(3){animation-delay:.1s}
    .screen-enter .card:nth-child(4){animation-delay:.15s}
    @keyframes cardIn{
      from{opacity:0;transform:translateY(12px) scale(.98)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    @media(max-width:1100px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g21,.g12{grid-template-columns:1fr}
    }
    @media(max-width:860px){
      .shell{flex-direction:column}
      .side{
        position:static;
        width:100%;
        height:auto;
        padding:12px 14px 10px;
        border-right:0;
        border-bottom:1px solid var(--line);
      }
      .brand{margin-bottom:10px;padding:0}
      .brand .logo{width:36px;height:36px;flex-basis:36px}
      .side .foot{display:none}
      .nav{
        flex-direction:row;
        gap:6px;
        padding-bottom:4px;
        overflow-x:auto;
      }
      .nav button{
        flex:0 0 auto;
        width:auto;
        min-height:42px;
        padding:7px 10px;
      }
      .nav button.on::before{display:none}
      .nav button small{display:none}
      .main{width:100%;padding:22px 18px 36px}
      .topbar{align-items:flex-start}
    }
    @media(max-width:700px){
      .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
      .topbar{flex-direction:column}
      .topbar h1{font-size:22px}
      .card{padding:15px}
      .chart{height:250px}
    }
    @media(max-width:480px){
      .main{padding:18px 12px 30px}
      .brand b{font-size:13px}
      .nav button .lbl{display:none}
      .nav button{min-width:42px;justify-content:center}
      .topbar{margin-bottom:17px}
      .pill{min-height:32px}
      .kpi .val{font-size:25px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">warehouse</span></div>
        <div><b>庫存管理系統</b><span>Inventory Management</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能"></nav>
      <div class="foot">Jvision WMS Demo · 純前端假資料<br />倉儲物流 · 多倉多庫別</div>
    </aside>
    <main class="main">
      <div id="screen" aria-live="polite"></div>
    </main>
  </div>

  <script>
  (function(){
    var MODS=[
      {icon:"monitoring",name:"庫存總覽",sub:"即時庫存與周轉"},
      {icon:"receipt_long",name:"收貨上架",sub:"驗收與智慧上架"},
      {icon:"checklist",name:"揀貨出貨",sub:"波次揀貨覆核"},
      {icon:"inventory_2",name:"盤點調撥",sub:"循環盤點差異"},
      {icon:"trending_up",name:"安全庫存補貨",sub:"再訂購點補貨"},
      {icon:"history",name:"異動稽核",sub:"批號序號追溯"}
    ];
    var charts=[];
    var COLORS={
      primary:"#334155",secondary:"#64748b",accent:"#059669",
      accent2:"#34d399",soft:"#d1fae5",grid:"#e6e8ea",
      warn:"#d97706",bad:"#dc2626",pale:"#cbd5e1"
    };
    function killCharts(){
      for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}
      charts=[];
    }
    function mk(id){
      var el=document.getElementById(id);
      if(!el)return null;
      var c=echarts.init(el);
      charts.push(c);
      return c;
    }
    var nav=document.getElementById("nav");
    var navHtml="";
    for(var i=0;i<MODS.length;i++){
      navHtml+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'：'+MODS[i].sub+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].icon+'</span>'+
        '<span class="lbl">'+MODS[i].name+'<small>'+MODS[i].sub+'</small></span></button>';
    }
    nav.innerHTML=navHtml;
    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]");
      if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });
    function topbar(t,sub,pills){
      var p="";
      for(var i=0;i<pills.length;i++){
        p+='<span class="pill"><span class="material-symbols-outlined" aria-hidden="true">'+pills[i][0]+'</span>'+pills[i][1]+'</span>';
      }
      return '<div class="topbar"><div><h1>'+t+'</h1><div class="sub">'+sub+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+p+'</div></div>';
    }
    function kpi(ic,lab,val,unit,delta,dir){
      var d=dir==="up"?'<span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>':dir==="down"?'<span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>':'';
      return '<div class="card kpi"><div class="lab"><span class="ic"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></span>'+lab+'</div>'+
        '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
        (delta?'<div class="delta '+dir+'">'+d+delta+'</div>':'')+'</div>';
    }

        '</div>'+
        '<div class="grid g12">'+

            '<div class="mini" style="margin-top:8px"><div class="m"><div class="k">入庫</div><div class="v">312</div></div><div class="m"><div class="k">出庫</div><div class="v">468</div></div><div class="m"><div class="k">調撥</div><div class="v">96</div></div></div></div>'+

          color:[COLORS.accent,COLORS.primary,COLORS.secondary,"#94a3b8",COLORS.pale]}]
      });
    }

    var SCR=[[s0,d0],[s1,d1],[s2,d2],[s3,d3],[s4,d4],[s5,d5]];
    function show(i){
      killCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){
        var active=+btns[k].getAttribute("data-i")===i;
        btns[k].classList.toggle("on",active);
        btns[k].setAttribute("aria-current",active?"page":"false");
      }
      var c=document.getElementById("screen");
      c.classList.remove("screen-enter");
      c.innerHTML=SCR[i][0]();
      void c.offsetHeight;
      c.classList.add("screen-enter");
      SCR[i][1]();
    }
    window.addEventListener("resize",function(){
      for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}
    });
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return;}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0);}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
