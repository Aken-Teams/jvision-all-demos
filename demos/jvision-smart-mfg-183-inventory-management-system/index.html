<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>庫存管理系統（Inventory Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#4f46e5; --accent2:#818cf8; --ink:#1e1b2e; --muted:#6b7280;
      --line:#e7e6f2; --bg:#f4f4fb; --card:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .shell{display:flex; min-height:100vh; align-items:stretch;}
    .side{
      width:246px; flex:0 0 246px; min-width:0; background:#fff; border-right:1px solid var(--line);
      display:flex; flex-direction:column; padding:20px 14px; gap:6px; position:sticky; top:0; height:100vh;
    }
    .brand{display:flex; gap:11px; align-items:center; padding:4px 8px 16px;}
    .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;}
    .brand .logo .material-symbols-outlined{font-size:24px;}
    .brand b{font-size:15px;display:block;line-height:1.25;}
    .brand span{font-size:11.5px;color:var(--muted);}
    .nav{display:flex; flex-direction:column; gap:4px; min-width:0;}
    .nav button{
      display:flex; align-items:center; gap:11px; width:100%; border:0; cursor:pointer; text-align:left;
      background:transparent; color:#4b4a5e; padding:10px 12px; border-radius:10px; font:inherit; font-size:13.5px; font-weight:600; min-width:0;
    }
    .nav button .material-symbols-outlined{font-size:21px;color:#9a99b5;flex:0 0 auto;}
    .nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .nav button small{display:block;font-weight:500;font-size:11px;color:#a3a2bd;margin-top:1px;}
    .nav button:hover{background:#f2f1fb;}
    .nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
    .nav button.on .material-symbols-outlined{color:#fff;}
    .nav button.on small{color:rgba(255,255,255,.85);}
    .side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#a3a2bd;border-top:1px solid var(--line);}
    .main{flex:1 1 auto; min-width:0; padding:22px 26px 40px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
    .topbar h1{font-size:20px;margin:0;font-weight:800;}
    .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:#4b4a5e;}
    .pill .material-symbols-outlined{font-size:17px;color:var(--accent);}
    .grid{display:grid;gap:14px;min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g21{grid-template-columns:2fr 1fr;}
    .g12{grid-template-columns:1fr 2fr;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;min-width:0;}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
    .card .ch3-sub{font-size:11.5px;color:var(--muted);margin:0 0 12px;}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
    .kpi .lab .ic{width:30px;height:30px;border-radius:9px;background:#eeecfb;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .kpi .lab .ic .material-symbols-outlined{font-size:18px;}
    .kpi .val{font-size:26px;font-weight:900;margin-top:9px;letter-spacing:-.5px;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);}
    .kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;}
    .kpi .delta.up{color:var(--ok);} .kpi .delta.down{color:var(--bad);} .kpi .delta.flat{color:var(--muted);}
    .kpi .delta .material-symbols-outlined{font-size:15px;}
    .chart{width:100%;height:270px;overflow:hidden;}
    .chart.sm{height:210px;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
    th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
    th{font-size:11px;color:var(--muted);font-weight:700;text-transform:none;background:#faf9ff;}
    tbody tr:hover{background:#faf9ff;}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
    .t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
    .t-bad{background:#fee2e2;color:#b91c1c;} .t-info{background:#e0e7ff;color:#4338ca;} .t-mut{background:#eef0f4;color:#5b6472;}
    .bar{height:7px;border-radius:99px;background:#eeecf7;overflow:hidden;min-width:66px;}
    .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:11px;}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
    .col{background:#faf9ff;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
    .col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:10px;}
    .col .ch .cnt{background:#eeecfb;color:var(--accent);border-radius:999px;font-size:11px;padding:1px 8px;}
    .ticket{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;}
    .ticket b{font-size:12.5px;} .ticket .m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:8px;}
    .tl{position:relative;padding-left:22px;margin:0;list-style:none;}
    .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl li{position:relative;padding:0 0 15px 6px;}
    .tl li:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
    .tl li b{font-size:13px;} .tl li .tm{font-size:11px;color:var(--muted);}
    .tl li p{margin:4px 0 0;font-size:12px;color:#4b4a5e;}
    .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:6px;}
    .legend span{display:inline-flex;align-items:center;gap:5px;}
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
    .mini{display:flex;flex-wrap:wrap;gap:9px;}
    .mini .m{flex:1 1 120px;min-width:0;background:#faf9ff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;}
    .mini .m .k{font-size:11px;color:var(--muted);font-weight:600;} .mini .m .v{font-size:18px;font-weight:900;margin-top:4px;}
    .hb{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
    .hb .n{width:70px;flex:0 0 70px;font-size:12px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hb .bar{flex:1 1 auto;height:15px;}
    .hb .v{width:44px;flex:0 0 44px;text-align:right;font-size:12px;font-weight:700;}
    .heat{display:grid;grid-template-columns:auto repeat(6,1fr);gap:5px;min-width:420px;}
    .heat .hc{border-radius:6px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
    .heat .rl{font-size:11px;font-weight:700;display:flex;align-items:center;}
    .heat .cl{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600;}
    @media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:860px){
      .shell{flex-direction:column;}
      .side{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px;}
      .brand{padding:0 8px 0 4px;}
      .side .foot{display:none;}
      .nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;gap:6px;}
      .nav button{width:auto;flex:0 0 auto;padding:8px 12px;}
      .nav button small{display:none;}
      .main{padding:18px 16px 34px;}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .nav button .lbl{display:none;}
      .nav button{padding:9px 11px;}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">warehouse</span></div>
        <div><b>庫存管理系統</b><span>Inventory Management</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="foot">Jvision WMS Demo · 純前端假資料<br/>倉儲物流 · 多倉多庫別</div>
    </aside>
    <main class="main">
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    var MODS=[
      {icon:"monitoring",name:"庫存總覽",sub:"即時庫存與周轉"},
      {icon:"receipt_long",name:"收貨上架",sub:"驗收與智慧上架"},
      {icon:"checklist",name:"揀貨出貨",sub:"波次揀貨覆核"},
      {icon:"inventory_2",name:"盤點調撥",sub:"循環盤點差異"},
      {icon:"trending_up",name:"安全庫存補貨",sub:"再訂購點補貨"},
      {icon:"history",name:"異動稽核",sub:"批號序號追溯"}
    ];
    var charts=[];
    function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

    var nav=document.getElementById("nav");
    var navHtml="";
    for(var i=0;i<MODS.length;i++){
      navHtml+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
        '<span class="lbl">'+MODS[i].name+'<small>'+MODS[i].sub+'</small></span></button>';
    }
    nav.innerHTML=navHtml;
    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]"); if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function topbar(t,sub,pills){
      var p=""; for(var i=0;i<pills.length;i++){p+='<span class="pill"><span class="material-symbols-outlined">'+pills[i][0]+'</span>'+pills[i][1]+'</span>';}
      return '<div class="topbar"><div><h1>'+t+'</h1><div class="sub">'+sub+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+p+'</div></div>';
    }
    function kpi(ic,lab,val,unit,delta,dir){
      var d=dir==="up"?'<span class="material-symbols-outlined">arrow_upward</span>':dir==="down"?'<span class="material-symbols-outlined">arrow_downward</span>':'';
      return '<div class="card kpi"><div class="lab"><span class="ic"><span class="material-symbols-outlined">'+ic+'</span></span>'+lab+'</div>'+
        '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
        (delta?'<div class="delta '+dir+'">'+d+delta+'</div>':'')+'</div>';
    }
    function tag(cls,txt){return '<span class="tag '+cls+'">'+txt+'</span>';}

    // ---------- Screen 0: 庫存總覽 ----------
    function s0(){
      var wh=[["台中中央倉",92,"高"],["桃園北區倉",78,"中"],["台南南區倉",64,"中"],["高雄港倉",41,"低"]];
      var whRows="";
      for(var i=0;i<wh.length;i++){
        var t=wh[i][1]>=85?"t-bad":wh[i][1]>=70?"t-warn":"t-ok";
        whRows+='<div class="hb"><span class="n">'+wh[i][0]+'</span><span class="bar"><i style="width:'+wh[i][1]+'%"></i></span><span class="v">'+wh[i][1]+'%</span></div>';
      }
      var alerts=[
        ["SKU-A2381","不鏽鋼軸承 6204","台中中央倉","可售 2.1 天","t-bad","低於安全庫存"],
        ["SKU-B1190","PVC 管件 25mm","桃園北區倉","呆滯 96 天","t-warn","建議調撥"],
        ["SKU-C7742","鋰電池模組 48V","高雄港倉","批號將到期","t-warn","效期預警"],
        ["SKU-D3055","伺服馬達 750W","台南南區倉","可售 4.8 天","t-info","接近再訂購點"]
      ];
      var ar="";
      for(var j=0;j<alerts.length;j++){
        ar+='<tr><td><b>'+alerts[j][0]+'</b></td><td>'+alerts[j][1]+'</td><td>'+alerts[j][2]+'</td><td>'+alerts[j][3]+'</td><td>'+tag(alerts[j][4],alerts[j][5])+'</td></tr>';
      }
      return topbar("庫存總覽","跨 4 座倉庫、12 個庫別的即時庫存與周轉表現",[["update","更新 2 分鐘前"],["groups","倉儲部視角"]])+
        '<div class="grid g4" style="margin-bottom:14px">'+
          kpi("inventory_2","庫存 SKU 總數","3,842","項","+128 本月","up")+
          kpi("attach_money","庫存金額","NT$ 2.41億","","週轉 6.8 次","flat")+
          kpi("verified","庫存準確率","99.2","%","+6.2pt","up")+
          kpi("warning","低於安全庫存","37","項","需補貨","down")+
        '</div>'+
        '<div class="grid g21" style="margin-bottom:14px">'+
          '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>庫存準確率 vs 缺料次數（近 6 週）</h3><div class="ch3-sub">導入後準確率穩定爬升、缺料次數同步下降</div><div id="c0a" class="chart"></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>庫別金額占比</h3><div class="ch3-sub">依 ABC 分級</div><div id="c0b" class="chart"></div></div>'+
        '</div>'+
        '<div class="grid g2">'+
          '<div class="card"><h3><span class="material-symbols-outlined">warehouse</span>各倉庫容使用率</h3><div class="ch3-sub">紅色代表庫容吃緊、建議調撥分流</div><div style="margin-top:6px">'+whRows+'</div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>庫存異常快照</h3><div class="ch3-sub">系統自動排序、優先處理紅色項目</div><div class="scroll"><table><thead><tr><th>料號</th><th>品名</th><th>倉庫</th><th>狀況</th><th>標記</th></tr></thead><tbody>'+ar+'</tbody></table></div></div>'+
        '</div>';
    }
    function d0(){
      var a=mk("c0a");
      if(a)a.setOption({
        tooltip:{trigger:"axis"},legend:{data:["庫存準確率 %","缺料次數"],bottom:0,textStyle:{fontSize:11}},
        grid:{left:44,right:44,top:20,bottom:44},
        xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLine:{lineStyle:{color:"#c9c8dd"}},axisLabel:{fontSize:11}},
        yAxis:[{type:"value",min:88,max:100,axisLabel:{formatter:"{value}%",fontSize:11},splitLine:{lineStyle:{color:"#f0eff8"}}},{type:"value",axisLabel:{fontSize:11},splitLine:{show:false}}],
        series:[
          {name:"庫存準確率 %",type:"line",smooth:true,data:[93,94,95,97,98,99.2],lineStyle:{width:3,color:"#4f46e5"},itemStyle:{color:"#4f46e5"},areaStyle:{color:"rgba(129,140,248,.18)"}},
          {name:"缺料次數",type:"bar",yAxisIndex:1,data:[14,11,9,6,4,3],barWidth:16,itemStyle:{color:"#818cf8",borderRadius:[4,4,0,0]}}
        ]
      });
      var b=mk("c0b");
      if(b)b.setOption({
        tooltip:{trigger:"item",formatter:"{b}: {d}%"},legend:{bottom:0,textStyle:{fontSize:11}},
        series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],avoidLabelOverlap:true,label:{show:false},
          data:[{value:58,name:"A 級（高值）"},{value:29,name:"B 級（中值）"},{value:13,name:"C 級（低值）"}],
          color:["#4f46e5","#818cf8","#c7d2fe"]}]
      });
    }

    // ---------- Screen 1: 收貨上架 (v1) ----------
    function s1(){
      var rows=[
        ["ASN-24081","震旦精機","不鏽鋼軸承 6204","1,200","已驗收","B-03-12","t-ok","批號 LOT-8841"],
        ["ASN-24082","台塑化工","PVC 管件 25mm","3,500","上架中","A-01-07","t-info","批號 LOT-8842"],
        ["ASN-24083","日月光電","鋰電池模組 48V","480","待驗收","—","t-warn","效期控管"],
        ["ASN-24084","中鋼結構","H 型鋼 200x100","96","異常","QC 區","t-bad","數量短少 4"],
        ["ASN-24085","大同馬達","伺服馬達 750W","240","已上架","C-04-21","t-ok","序號採集完成"]
      ];
      var r="";
      for(var i=0;i<rows.length;i++){
        r+='<tr><td><b>'+rows[i][0]+'</b></td><td>'+rows[i][1]+'</td><td>'+rows[i][2]+'</td><td style="text-align:right">'+rows[i][3]+'</td><td>'+tag(rows[i][6],rows[i][4])+'</td><td>'+rows[i][5]+'</td><td>'+rows[i][7]+'</td></tr>';
      }
      var sug=[
        ["A-01-07","距揀貨口最近 · 快速流通品","92%"],
        ["B-03-12","溫控區 · 適用電池模組","88%"],
        ["C-04-21","重物低層儲位 · 承重達標","81%"]
      ];
      var sr="";
      for(var j=0;j<sug.length;j++){
        sr+='<div class="ticket"><b>'+sug[j][0]+'</b> '+tag("t-info","建議")+'<div class="m"><span>'+sug[j][1]+'</span><span style="color:var(--accent);font-weight:800">適配 '+sug[j][2]+'</span></div></div>';
      }
      return topbar("收貨上架","到貨驗收、批次序號採集與智慧儲位上架建議",[["today","今日到貨 5 筆"],["qr_code_scanner","PDA 掃碼作業"]])+
        '<div class="grid g4" style="margin-bottom:14px">'+
          kpi("local_shipping","今日到貨單","5","筆","2 筆待驗收","flat")+
          kpi("fact_check","驗收合格率","98.4","%","+1.2pt","up")+
          kpi("schedule","平均上架工時","6.2","分/筆","-3.1 分","down")+
          kpi("report","收貨異常","1","筆","數量短少","down")+
        '</div>'+
        '<div class="grid g21">'+
          '<div class="card"><h3><span class="material-symbols-outlined">move_to_inbox</span>到貨作業看板</h3><div class="ch3-sub">掃碼驗收 → 批次序號採集 → 智慧上架</div><div class="scroll"><table><thead><tr><th>到貨單</th><th>供應商</th><th>品名</th><th>數量</th><th>狀態</th><th>儲位</th><th>備註</th></tr></thead><tbody>'+r+'</tbody></table></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">pin_drop</span>智慧上架建議</h3><div class="ch3-sub">依儲位策略與品項屬性推薦</div>'+sr+'</div>'+
        '</div>'+
        '<div class="grid g2" style="margin-top:14px">'+
