<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contract Management 合約管理</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#9333ea;--accent2:#c084fc;--accent-soft:#f5edff;
  --bg:#f6f4fb;--card:#ffffff;--ink:#1e1633;--muted:#6b6580;--line:#ece7f4;
  --ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#2563eb;
  --shadow:0 1px 2px rgba(30,22,51,.05),0 8px 24px rgba(147,51,234,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#5b1a97,#9333ea 55%,#a855f7);color:#fff;box-shadow:0 6px 18px rgba(91,26,151,.25)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand .sub{font-size:11px;opacity:.8;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-width:0}
.nav button:hover{background:rgba(255,255,255,.22)}
.nav button.active{background:#fff;color:var(--accent);border-color:#fff}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.screen-head{margin:4px 0 18px}
.screen-head h2{margin:0;font-size:22px;font-weight:800}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.kpi .val{font-size:26px;font-weight:800;margin:10px 0 2px;letter-spacing:.5px}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px}
.up{color:var(--ok);background:#e7f7ed}.down{color:var(--bad);background:#fdeaef}.flat{color:var(--info);background:#e8f0fe}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-purple{background:var(--accent-soft);color:var(--accent)}
.b-green{background:#e7f7ed;color:var(--ok)}
.b-amber{background:#fef3e2;color:#b45309}
.b-red{background:#fdeaef;color:var(--bad)}
.b-blue{background:#e8f0fe;color:var(--info)}
.b-gray{background:#eef0f4;color:#64748b}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf7ff}
.tbl-scroll{overflow-x:auto;border-radius:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;min-width:0}
.col{background:#f4f0fb;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.col-head .t{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.col-head .cnt{font-size:11px;font-weight:700;background:#fff;color:var(--accent);border-radius:20px;padding:2px 8px;border:1px solid var(--line)}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(30,22,51,.04)}
.ticket:last-child{margin-bottom:0}
.ticket .id{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.ticket .nm{font-size:13px;font-weight:700;margin:3px 0 8px;line-height:1.35}
.ticket .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted)}
.ticket .amt{font-weight:700;color:var(--ink)}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar{height:8px;border-radius:20px;background:#eee7f6;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chartbox{position:relative;width:100%;overflow:hidden}
.h220{height:220px}.h260{height:260px}.h280{height:280px}
.muted{color:var(--muted)}
.row-flex{display:flex;align-items:center;gap:10px;min-width:0}
.clause{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.clause:last-child{margin-bottom:0}
.clause .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.clause .cn{font-weight:700;font-size:13.5px}
.diff{font-size:12.5px;line-height:1.7;background:#faf8fe;border-radius:8px;padding:10px 12px}
.del{background:#fdeaef;color:#9f1239;text-decoration:line-through;border-radius:3px;padding:0 3px}
.ins{background:#e7f7ed;color:#166534;border-radius:3px;padding:0 3px}
.sign-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.sign-row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ver{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.ver:last-child{margin-bottom:0}
.ver .vtag{font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:7px;padding:5px 8px;flex:0 0 auto}
.ver .vtag.old{background:#b9a9d6}
.small{font-size:11.5px}
.renew-card{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.renew-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:8px 10px}
  .brand h1{font-size:14px}
  .brand .sub{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
      <div style="min-width:0">
        <h1>Contract Management 合約管理</h1>
        <div class="sub">合約全生命週期・草擬到續約的單一平台</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap">
  <div id="app"></div>
</main>
<script>
(function(){
"use strict";
var C={accent:"#9333ea",accent2:"#c084fc",soft:"#f5edff",ok:"#16a34a",warn:"#f59e0b",bad:"#e11d48",info:"#2563eb",grid:"#ece7f4",muted:"#6b6580"};
var MODS=[
  {icon:"dashboard",name:"合約看板"},
  {icon:"description",name:"範本與草擬"},
  {icon:"fact_check",name:"法務審閱"},
  {icon:"verified",name:"電子簽署"},
  {icon:"history",name:"版本與歸檔"},
  {icon:"calendar_month",name:"到期續約"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function ic(n){return '<span class="material-symbols-outlined">'+n+'</span>';}

var nav=document.getElementById("nav");
var navHtml="";
for(var i=0;i<MODS.length;i++){
  navHtml+='<button data-i="'+i+'">'+ic(MODS[i].icon)+'<span class="lbl">'+MODS[i].name+'</span></button>';
}
nav.innerHTML=navHtml;
nav.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});

var contracts=[
  {id:"CT-2601",nm:"精密齒輪年度採購合約",party:"O豐機械",amt:820,owner:"陳",col:0,risk:"low"},
  {id:"CT-2602",nm:"雲端ERP授權服務合約",party:"宏O資通",amt:1560,owner:"林",col:0,risk:"mid"},
  {id:"CT-2605",nm:"廠房設備維護外包合約",party:"O邦工程",amt:640,owner:"王",col:1,risk:"mid"},
  {id:"CT-2606",nm:"原物料長約供貨協議",party:"O塑石化",amt:2380,owner:"黃",col:1,risk:"high"},
  {id:"CT-2609",nm:"物流配送框架合約",party:"O光貨運",amt:410,owner:"李",col:2,risk:"low"},
  {id:"CT-2610",nm:"軟體技術支援續約",party:"O揚資訊",amt:290,owner:"陳",col:2,risk:"mid"},
  {id:"CT-2612",nm:"廠區保全服務合約",party:"O興保全",amt:520,owner:"林",col:3,risk:"low"},
  {id:"CT-2615",nm:"品保檢測委外合約",party:"O證台灣",amt:180,owner:"王",col:4,risk:"low"},
  {id:"CT-2616",nm:"廣告代理年度合約",party:"O美行銷",amt:960,owner:"黃",col:4,risk:"mid"}
];
var cols=[
  {t:"合約草擬",ic:"edit_document"},
  {t:"法務審閱",ic:"fact_check"},
  {t:"電子簽署",ic:"verified"},
  {t:"待歸檔",ic:"inventory_2"},
  {t:"已完成",ic:"task_alt"}
];

function s0(el){
  var kpis=[
    {ic:"account_tree",val:"48",lbl:"進行中合約",d:"+6",cls:"up"},
    {ic:"schedule",val:"4.2 天",lbl:"平均簽署時效",d:"-1.6 天",cls:"up"},
    {ic:"warning",val:"7",lbl:"高風險條款",d:"+2",cls:"down"},
    {ic:"trending_up",val:"91%",lbl:"如期簽署率",d:"+8%",cls:"up"}
  ];
  var h='<div class="screen-head"><h2>合約看板</h2><p>依生命週期階段檢視全公司合約狀態，一眼掌握卡關與到期風險。</p></div>';
  h+='<div class="grid g4" style="margin-bottom:18px">';
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    h+='<div class="kpi"><div class="top"><div class="ic">'+ic(k.ic)+'</div><span class="delta '+k.cls+'">'+ic(k.cls==="up"?"trending_up":"trending_down")+k.d+'</span></div><div class="val">'+k.val+'</div><div class="lbl">'+k.lbl+'</div></div>';
  }
  h+='</div>';
  h+='<div class="card" style="margin-bottom:18px"><h3>'+ic("view_kanban")+'合約流轉看板</h3><div style="overflow-x:auto"><div class="board">';
  for(var c=0;c<cols.length;c++){
    var items=contracts.filter(function(x){return x.col===c;});
    h+='<div class="col"><div class="col-head"><span class="t">'+ic(cols[c].ic)+cols[c].t+'</span><span class="cnt">'+items.length+'</span></div>';
    for(var j=0;j<items.length;j++){var t=items[j];
      var rb=t.risk==="high"?"b-red":t.risk==="mid"?"b-amber":"b-green";
      var rt=t.risk==="high"?"高風險":t.risk==="mid"?"中風險":"低風險";
      h+='<div class="ticket"><div class="id">'+t.id+'</div><div class="nm">'+t.nm+'</div><div style="margin-bottom:8px"><span class="badge '+rb+'">'+rt+'</span></div><div class="meta"><span class="amt">NT$'+t.amt+'萬</span><span class="row-flex"><span class="avatar">'+t.owner+'</span></span></div></div>';
    }
    h+='</div>';
  }
  h+='</div></div></div>';
  h+='<div class="grid g2"><div class="card"><h3>'+ic("monitoring")+'各階段合約金額分布（萬元）</h3><div class="chartbox h260"><canvas id="c0a"></canvas></div></div>';
  h+='<div class="card"><h3>'+ic("insights")+'近6週簽署時效趨勢（天）</h3><div class="chartbox h260"><canvas id="c0b"></canvas></div></div></div>';
  el.innerHTML=h;
  void el.offsetHeight;
  var stageAmt=[0,0,0,0,0];
  contracts.forEach(function(x){stageAmt[x.col]+=x.amt;});
  charts.c0a=new Chart(document.getElementById("c0a"),{type:"bar",data:{labels:cols.map(function(x){return x.t;}),datasets:[{label:"合約金額",data:stageAmt,backgroundColor:C.accent,borderRadius:8,maxBarThickness:44}]},options:baropt()});
  charts.c0b=new Chart(document.getElementById("c0b"),{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"平均簽署時效",data:[7.2,6.5,5.8,5.1,4.6,4.2],borderColor:C.accent,backgroundColor:"rgba(147,51,234,.12)",fill:true,tension:.4,pointBackgroundColor:C.accent,pointRadius:4}]},options:lineopt()});
}

function s1(el){
  var tpls=[
    {nm:"標準採購合約範本",cat:"採購",ver:"v3.2",use:126,upd:"2026-07-10"},
    {nm:"軟體授權服務合約",cat:"授權",ver:"v2.0",use:58,upd:"2026-06-28"},
    {nm:"委外服務框架合約",cat:"服務",ver:"v4.1",use:94,upd:"2026-07-22"},
    {nm:"保密協議 NDA",cat:"法務",ver:"v1.5",use:212,upd:"2026-05-15"},
    {nm:"長期供貨協議範本",cat:"採購",ver:"v2.3",use:41,upd:"2026-07-18"}
  ];
  var h='<div class="screen-head"><h2>範本與草擬</h2><p>從標準化範本庫選用範本、套用條款模組，快速產出合規草稿。</p></div>';
  h+='<div class="grid g4" style="margin-bottom:18px">';
  var kk=[{ic:"description",v:"32",l:"範本總數"},{ic:"edit_document",v:"14",l:"草擬中合約"},{ic:"rule",v:"96%",l:"條款覆蓋率"},{ic:"bolt",v:"2.4 天",l:"平均草擬時間"}];
  for(var i=0;i<kk.length;i++){h+='<div class="kpi"><div class="top"><div class="ic">'+ic(kk[i].ic)+'</div></div><div class="val">'+kk[i].v+'</div><div class="lbl">'+kk[i].l+'</div></div>';}
  h+='</div>';
  h+='<div class="grid g23">';
  h+='<div class="card"><h3>'+ic("library_books")+'範本庫</h3><div class="tbl-scroll"><table><thead><tr><th>範本名稱</th><th>類別</th><th>版本</th><th>使用次數</th><th>更新日</th></tr></thead><tbody>';
  for(var j=0;j<tpls.length;j++){var t=tpls[j];
    h+='<tr><td style="font-weight:600">'+t.nm+'</td><td><span class="badge b-purple">'+t.cat+'</span></td><td>'+t.ver+'</td><td>'+t.use+'</td><td class="muted">'+t.upd+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  h+='<div class="card"><h3>'+ic("category")+'條款模組使用占比</h3><div class="chartbox h260"><canvas id="c1a"></canvas></div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:18px"><h3>'+ic("construction")+'草稿組裝：CT-2618 智慧倉儲系統採購合約</h3>';
  var clauses=[{n:"第一條 標的與範圍",s:"已套用",cls:"b-green"},{n:"第二條 價金與付款方式",s:"編輯中",cls:"b-amber"},{n:"第三條 交付與驗收",s:"已套用",cls:"b-green"},{n:"第四條 保固與維護",s:"待補",cls:"b-gray"},{n:"第五條 違約與賠償",s:"已套用",cls:"b-green"}];
  h+='<div class="grid g2">';
  for(var m=0;m<clauses.length;m++){var cl=clauses[m];
    h+='<div class="clause"><div class="ch"><span class="cn">'+cl.n+'</span><span class="badge '+cl.cls+'">'+cl.s+'</span></div><div class="bar"><span style="width:'+(cl.s==="已套用"?100:cl.s==="編輯中"?55:15)+'%"></span></div></div>';
  }
  h+='</div></div>';
  el.innerHTML=h;
  void el.offsetHeight;
  charts.c1a=new Chart(document.getElementById("c1a"),{type:"doughnut",data:{labels:["採購","服務","授權","法務","其他"],datasets:[{data:[38,24,16,14,8],backgroundColor:[C.accent,C.accent2,"#7c3aed","#d8b4fe","#ede9fe"],borderWidth:2,borderColor:"#fff"}]},options:donutopt()});
}

function s2(el){
  var h='<div class="screen-head"><h2>法務審閱</h2><p>條款逐條比對標準範本，自動標記風險偏離，退回修訂或核准放行。</p></div>';
  h+='<div class="grid g4" style="margin-bottom:18px">';
  var kk=[{ic:"pending_actions",v:"9",l:"待審閱合約"},{ic:"warning",v:"7",l:"高風險標記"},{ic:"fact_check",v:"142",l:"本月已審閱"},{ic:"schedule",v:"1.8 天",l:"平均審閱時效"}];
  for(var i=0;i<kk.length;i++){h+='<div class="kpi"><div class="top"><div class="ic">'+ic(kk[i].ic)+'</div></div><div class="val">'+kk[i].v+'</div><div class="lbl">'+kk[i].l+'</div></div>';}
  h+='</div>';
  h+='<div class="grid g32">';
  h+='<div class="card"><h3>'+ic("bar_chart")+'風險類別分布</h3><div class="chartbox h280"><canvas id="c2a"></canvas></div></div>';
  h+='<div class="card"><h3>'+ic("difference")+'條款比對：CT-2606 原物料長約供貨協議</h3>';

function gridcfg(){return{color:C.grid,drawBorder:false};}
function baropt(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:C.muted,font:{size:11}}},y:{grid:gridcfg(),ticks:{color:C.muted,font:{size:11}},beginAtZero:true}}};}
function lineopt(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:C.muted,font:{size:11}}},y:{grid:gridcfg(),ticks:{color:C.muted,font:{size:11}},beginAtZero:true}}};}
function stackopt(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:C.muted,font:{size:11},boxWidth:12,padding:12}}},scales:{x:{stacked:true,grid:{display:false},ticks:{color:C.muted,font:{size:10}}},y:{stacked:true,grid:gridcfg(),ticks:{color:C.muted,font:{size:11}},beginAtZero:true}}};}
function donutopt(){return{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{color:C.muted,font:{size:11},boxWidth:12,padding:12}}}};}
function polaropt(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:C.muted,font:{size:11},boxWidth:12,padding:12}}},scales:{r:{grid:{color:C.grid},ticks:{display:false}}}};}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  var el=document.getElementById("app");
  el.innerHTML="";
  SCREENS[i](el);
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
