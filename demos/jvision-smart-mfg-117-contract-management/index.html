<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Management 合約管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFF;--color-secondary:#3B82F6;--color-on-secondary:#000;
--color-accent:#059669;--color-on-accent:#000;--color-background:#F8FAFC;--color-foreground:#0F172A;
--color-card:#FFF;--color-card-foreground:#0F172A;--color-muted:#F1F5FD;--color-muted-foreground:#475569;
--color-border:#E4ECFC;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#0F172A;--muted:#475569;--line:#E4ECFC;
--ok:#047857;--warn:#92400E;--bad:#B91C1C;--info:#1D4ED8;--paper:#FFF;--grid:rgba(37,99,235,.09)
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background-color:var(--color-background);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:"Crimson Pro","Noto Sans TC",serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#FFF;border-bottom:4px solid var(--blue)}
.topbar-inner{max-width:1440px;margin:auto;display:flex;align-items:stretch;gap:0;padding:0 24px}
.brand{display:flex;align-items:center;gap:14px;padding:14px 24px 14px 0;border-right:2px solid #FFF;min-width:345px}
.logo{width:46px;height:46px;display:grid;place-items:center;color:#FFF;background:var(--blue);border:2px solid #FFF;flex:none}
.logo .material-symbols-outlined{font-size:27px}
.brand h1{margin:0;font-family:"Cinzel","Noto Sans TC",serif;font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand .sub{margin-top:3px;color:#CBD5E1;font-size:12px;font-family:"Noto Sans TC",sans-serif}
.nav{display:flex;align-items:stretch;margin-left:auto;overflow-x:auto}
.nav button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:76px;padding:10px 14px;border:0;border-left:1px solid #475569;background:transparent;color:#E2E8F0;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700;white-space:nowrap;transition:background-color .18s,color .18s}
.nav button:hover{background:#1E293B;color:#FFF}
.nav button.active{background:var(--blue);color:#FFF;box-shadow:inset 0 -6px 0 #FFF}
.nav button:focus-visible,.ticket:focus-visible{outline:4px solid #93C5FD;outline-offset:-4px}
.wrap{max-width:1440px;margin:auto;padding:36px 24px 72px}
.screen-head{position:relative;margin:0 0 24px;padding:25px 28px;background:var(--color-card);border:2px solid var(--ink)}
.screen-head:before{content:"CONTRACT OPERATIONS";display:block;margin-bottom:7px;color:var(--blue);font-family:"Cinzel",serif;font-size:11px;font-weight:600;letter-spacing:.2em}
.screen-head:after{content:"";position:absolute;right:-2px;top:-2px;width:84px;height:16px;background:var(--color-accent);border:2px solid var(--ink)}
.screen-head h2{margin:0;font-family:"Cormorant Garamond","Noto Sans TC",serif;font-size:clamp(32px,4vw,54px);font-weight:700;line-height:.95;letter-spacing:-.025em}
.screen-head p{max-width:760px;margin:12px 0 0;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:13px}
.grid{display:grid;gap:16px;min-width:0}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
.card,.kpi{min-width:0;background:var(--paper);border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink)}
.card{padding:20px}
.card h3{display:flex;align-items:center;gap:9px;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:14px;font-weight:900}
.card h3 .material-symbols-outlined{color:var(--blue)}
.kpi{position:relative;padding:18px;overflow:hidden}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi:after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:var(--blue)}
.kpi .top{display:flex;align-items:start;justify-content:space-between;gap:8px}
.kpi .ic{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);border:2px solid var(--ink);color:#FFF}
.kpi .val{margin:15px 0 0;font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .lbl{margin-top:6px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.delta,.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid currentColor;padding:3px 8px;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:900;white-space:nowrap}
.delta .material-symbols-outlined{font-size:15px}.up,.b-green{color:#065F46;background:#D1FAE5}.down,.b-red{color:#991B1B;background:#FEE2E2}.flat,.b-blue{color:#1E40AF;background:#DBEAFE}.b-amber{color:#78350F;background:#FEF3C7}.b-purple{color:#1E40AF;background:#DBEAFE}.b-gray{color:#334155;background:#E2E8F0}
.tbl-scroll{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:540px;border-collapse:collapse;font-family:"Noto Sans TC",sans-serif;font-size:12px}
th{padding:11px 12px;background:var(--ink);color:#FFF;border-right:1px solid #64748B;text-align:left;font-size:11px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
td{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}tbody tr:hover{background:#EFF6FF}
td:nth-last-child(2):not(:first-child){font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:0;border:2px solid var(--ink);min-width:1080px}
.col{min-width:0;background:var(--color-muted);border-right:2px solid var(--ink)}
.col:last-child{border-right:0}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:var(--ink);color:#FFF}
.col-head .t{display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:900}
.cnt{min-width:25px;padding:1px 7px;background:#FFF;color:var(--ink);border:1px solid #FFF;text-align:center;font-weight:900}
.ticket{margin:12px;padding:12px;background:#FFF;border:2px solid var(--ink);border-left:7px solid var(--blue)}
.ticket:hover{background:#EFF6FF}
.ticket .id,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.ticket .id{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em}
.ticket .nm{margin:4px 0 9px;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:900;line-height:1.45}
.ticket .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px}
.ticket .amt{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:800}
.avatar{width:24px;height:24px;display:inline-grid;place-items:center;background:var(--color-accent);border:1px solid var(--ink);color:#FFF;font-family:"Noto Sans TC",sans-serif;font-size:10px;font-weight:900}
.bar{height:12px;background:#DBEAFE;border:1px solid var(--ink);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue)}
.chartbox{position:relative;width:100%;overflow:hidden}.h220{height:220px}.h260{height:260px}.h280{height:280px}
.muted{color:var(--muted)}.small{font-size:12px}.row-flex{display:flex;align-items:center;gap:10px;min-width:0}
.clause{margin-bottom:12px;padding:14px;background:#FFF;border:2px solid var(--ink)}.clause:last-child{margin-bottom:0}
.clause .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.clause .cn{font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:900}
.diff{padding:11px 13px;background:var(--color-muted);border-left:5px solid var(--blue);font-size:14px;line-height:1.75}
.del{padding:0 3px;background:#FEE2E2;color:#991B1B;text-decoration:line-through}.ins{padding:0 3px;background:#D1FAE5;color:#065F46;text-decoration:underline}
.sign-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}.sign-row:last-child{border-bottom:0}
.dot{width:14px;height:14px;border:2px solid var(--ink);flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:13px;height:13px;border:1px solid var(--ink)}
.ver{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;padding:13px;border:2px solid var(--ink)}.ver:last-child{margin-bottom:0}
.vtag{flex:none;padding:5px 8px;background:var(--blue);border:1px solid var(--ink);color:#FFF;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:800}.vtag.old{background:#64748B}
.renew-card{position:relative;overflow:hidden;padding:15px;background:#FFF;border:2px solid var(--ink)}
.renew-card:before{content:"";position:absolute;left:0;top:0;width:7px;height:100%;background:var(--blue)}
.grid-item{animation:enter .4s cubic-bezier(.34,1.56,.64,1) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}.grid-item:nth-child(5){animation-delay:.24s}.grid-item:nth-child(6){animation-delay:.3s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.grid-item{opacity:1;transform:none}}
@media(max-width:1100px){.topbar-inner{display:block;padding:0}.brand{min-width:0;padding:12px 18px;border-right:0;border-bottom:1px solid #475569}.nav{margin:0}.nav button{flex:1;min-height:54px}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.wrap{padding:24px 16px 56px}.g3,.g2,.g23,.g32{grid-template-columns:1fr}.screen-head{padding:22px 18px}.card,.kpi{box-shadow:4px 4px 0 var(--ink)}}
@media(max-width:560px){.brand h1{white-space:normal}.brand .sub{display:none}.nav button{min-width:52px;padding:10px}.nav button .lbl{display:none}.g4{grid-template-columns:1fr}.kpi:nth-child(2n){transform:none}.screen-head h2{font-size:37px}.screen-head:after{width:50px}.card{padding:15px}}
</style>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<div class="brand">
<div class="logo"><span class="material-symbols-outlined">gavel</span></div>
<div><h1>Contract Management 合約管理</h1><div class="sub">合約全生命週期・草擬到續約的單一平台</div></div>
</div>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
</div>
</header>
<main class="wrap"><div id="app"></div></main>
<script>
(function(){
"use strict";
var C={accent:"#2563EB",accent2:"#3B82F6",soft:"#DBEAFE",ok:"#047857",warn:"#B45309",bad:"#DC2626",info:"#2563EB",grid:"#E4ECFC",muted:"#475569"};
var MODS=[
{icon:"dashboard",name:"合約看板"},{icon:"description",name:"範本與草擬"},
{icon:"fact_check",name:"法務審閱"},{icon:"verified",name:"電子簽署"},
{icon:"history",name:"版本與歸檔"},{icon:"calendar_month",name:"到期續約"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function ic(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
function animateItems(){var nodes=document.querySelectorAll(".kpi,.card,.renew-card");for(var i=0;i<nodes.length;i++)nodes[i].classList.add("grid-item")}
var nav=document.getElementById("nav"),navHtml="";
for(var i=0;i<MODS.length;i++)navHtml+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'">'+ic(MODS[i].icon)+'<span class="lbl">'+MODS[i].name+"</span></button>";
nav.innerHTML=navHtml;
nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)location.hash="v"+b.getAttribute("data-i")});

var contracts=[
{id:"CT-2601",nm:"精密齒輪年度採購合約",party:"O豐機械",amt:820,owner:"陳",col:0,risk:"low"},
{id:"CT-2602",nm:"雲端ERP授權服務合約",party:"宏O資通",amt:1560,owner:"林",col:0,risk:"mid"},
{id:"CT-2605",nm:"廠房設備維護外包合約",party:"O邦工程",amt:640,owner:"王",col:1,risk:"mid"},
{id:"CT-2606",nm:"原物料長約供貨協議",party:"O塑石化",amt:2380,owner:"黃",col:1,risk:"high"},
{id:"CT-2609",nm:"物流配送框架合約",party:"O光貨運",amt:410,owner:"李",col:2,risk:"low"},
{id:"CT-2610",nm:"軟體技術支援續約",party:"O揚資訊",amt:290,owner:"陳",col:2,risk:"mid"},
{id:"CT-2612",nm:"廠區保全服務合約",party:"O興保全",amt:520,owner:"林",col:3,risk:"low"},
{id:"CT-2615",nm:"品保檢測委外合約",party:"O證台灣",amt:180,owner:"王",col:4,risk:"low"},
{id:"CT-2616",nm:"廣告代理年度合約",party:"O美行銷",amt:960,owner:"黃",col:4,risk:"mid"}
];
var cols=[{t:"合約草擬",ic:"edit_document"},{t:"法務審閱",ic:"fact_check"},{t:"電子簽署",ic:"verified"},{t:"待歸檔",ic:"inventory_2"},{t:"已完成",ic:"task_alt"}];
function head(t,p){return '<div class="screen-head"><h2>'+t+"</h2><p>"+p+"</p></div>"}
function kpis(a){var h='<div class="grid g4" style="margin-bottom:24px">';for(var i=0;i<a.length;i++){var k=a[i];h+='<div class="kpi"><div class="top"><div class="ic">'+ic(k.ic)+"</div>"+(k.d?'<span class="delta '+k.cls+'">'+ic(k.cls==="up"?"trending_up":"trending_down")+k.d+"</span>":"")+'</div><div class="val">'+k.v+'</div><div class="lbl">'+k.l+"</div></div>"}return h+"</div>"}
function s0(el){
var h=head("合約看板","依生命週期階段檢視全公司合約狀態，一眼掌握卡關與到期風險。");
h+=kpis([{ic:"account_tree",v:"48",l:"進行中合約",d:"+6",cls:"up"},{ic:"schedule",v:"4.2 天",l:"平均簽署時效",d:"-1.6 天",cls:"up"},{ic:"warning",v:"7",l:"高風險條款",d:"+2",cls:"down"},{ic:"trending_up",v:"91%",l:"如期簽署率",d:"+8%",cls:"up"}]);
h+='<div class="card" style="margin-bottom:24px"><h3>'+ic("view_kanban")+'合約流轉看板</h3><div style="overflow-x:auto"><div class="board">';
for(var c=0;c<cols.length;c++){var items=contracts.filter(function(x){return x.col===c});h+='<section class="col"><div class="col-head"><span class="t">'+ic(cols[c].ic)+cols[c].t+'</span><span class="cnt" aria-label="'+items.length+' 件">'+items.length+"</span></div>";
for(var j=0;j<items.length;j++){var t=items[j],rb=t.risk==="high"?"b-red":t.risk==="mid"?"b-amber":"b-green",rt=t.risk==="high"?"高風險":t.risk==="mid"?"中風險":"低風險";h+='<article class="ticket" tabindex="0"><div class="id">'+t.id+'</div><div class="nm">'+t.nm+'</div><div style="margin-bottom:8px"><span class="badge '+rb+'">'+ic(t.risk==="high"?"error":t.risk==="mid"?"warning":"check_circle")+rt+'</span></div><div class="meta"><span class="amt">NT$'+t.amt.toLocaleString("zh-TW")+'萬</span><span class="avatar" aria-label="負責人 '+t.owner+'">'+t.owner+"</span></div></article>"}h+="</section>"}
h+='</div></div></div><div class="grid g2"><div class="card"><h3>'+ic("monitoring")+'各階段合約金額分布（萬元）</h3><div class="chartbox h260"><canvas id="c0a"></canvas></div></div><div class="card"><h3>'+ic("insights")+'近6週簽署時效趨勢（天）</h3><div class="chartbox h260"><canvas id="c0b"></canvas></div></div></div>';
el.innerHTML=h;var amt=[0,0,0,0,0];contracts.forEach(function(x){amt[x.col]+=x.amt});
charts.c0a=new Chart(document.getElementById("c0a"),{type:"bar",data:{labels:cols.map(function(x){return x.t}),datasets:[{label:"合約金額",data:amt,backgroundColor:C.accent,borderWidth:0,maxBarThickness:44}]},options:baropt()});
charts.c0b=new Chart(document.getElementById("c0b"),{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"平均簽署時效",data:[7.2,6.5,5.8,5.1,4.6,4.2],borderColor:C.accent,backgroundColor:"rgba(37,99,235,.12)",fill:true,tension:0,pointBackgroundColor:C.accent,pointRadius:4}]},options:lineopt()})}
function s1(el){
var t=[{nm:"標準採購合約範本",cat:"採購",ver:"v3.2",use:126,upd:"2026-07-10"},{nm:"軟體授權服務合約",cat:"授權",ver:"v2.0",use:58,upd:"2026-06-28"},{nm:"委外服務框架合約",cat:"服務",ver:"v4.1",use:94,upd:"2026-07-22"},{nm:"保密協議 NDA",cat:"法務",ver:"v1.5",use:212,upd:"2026-05-15"},{nm:"長期供貨協議範本",cat:"採購",ver:"v2.3",use:41,upd:"2026-07-18"}];
var h=head("範本與草擬","從標準化範本庫選用範本、套用條款模組，快速產出合規草稿。")+kpis([{ic:"description",v:"32",l:"範本總數"},{ic:"edit_document",v:"14",l:"草擬中合約"},{ic:"rule",v:"96%",l:"條款覆蓋率"},{ic:"bolt",v:"2.4 天",l:"平均草擬時間"}]);
h+='<div class="grid g23"><div class="card"><h3>'+ic("library_books")+'範本庫</h3><div class="tbl-scroll"><table><thead><tr><th>範本名稱</th><th>類別</th><th>版本</th><th>使用次數</th><th>更新日</th></tr></thead><tbody>';
for(var i=0;i<t.length;i++)h+='<tr><td style="font-weight:700">'+t[i].nm+'</td><td><span class="badge b-purple">'+t[i].cat+'</span></td><td class="mono">'+t[i].ver+'</td><td style="text-align:right;font-variant-numeric:tabular-nums">'+t[i].use.toLocaleString("zh-TW")+'</td><td class="muted mono">'+t[i].upd+"</td></tr>";
h+='</tbody></table></div></div><div class="card"><h3>'+ic("category")+'條款模組使用占比</h3><div class="chartbox h260"><canvas id="c1a"></canvas></div></div></div>';
