<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工地日報 AI 站 · Construction Daily Report</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#a16207;--accent2:#ca8a04;--ink:#2c2410;--bg:#f7f3ea;--card:#fffdf7;--line:#e7ddc7;--mut:#7a6f56;--ok:#5b8c3e;--warn:#d98a1f;--bad:#c2451f;--sky:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#fffdf7,#f3ead6);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(161,98,7,.3);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9.5px;color:var(--accent);letter-spacing:1.1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#5c5133;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#b3a37c}
.side button:hover{background:#efe6d1}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.7}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#f3e8cf;color:#8a5a08;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#e2f0d4;color:#40691f}.t-warn{background:#fbeecb;color:#96620c}.t-bad{background:#f7ded1;color:#9c3213}.t-info{background:#dde9fb;color:#2451a8}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f4ecd8}
table.data td b{font-family:"Noto Sans TC"}
.wx{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#fef3d0,#f7e6bd);border:1px solid var(--line);border-radius:14px;padding:16px}
.wx .sun{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fde68a,#d98a1f);box-shadow:0 0 22px rgba(217,138,31,.5);flex:none;display:grid;place-items:center}
.wx .sun .material-symbols-outlined{font-size:34px;color:#7c4a06}
.wx .wt{flex:1;min-width:0}
.wx .wt b{font-size:26px;font-family:Inter;font-weight:800}
.wx .wt small{display:block;color:var(--mut);font-size:12px}
.wx .wmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.wx .wmeta span b{color:var(--ink);font-family:Inter}
.wh{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.wh .whc{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--card)}
.wh .whc .material-symbols-outlined{font-size:20px;color:var(--accent2)}
.wh .whc small{display:block;font-size:10px;color:var(--mut)}
.wh .whc b{display:block;font-size:12.5px;font-family:Inter;margin-top:2px}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.b{border-left-color:var(--bad)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:16px;color:var(--accent)}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.bar{height:9px;background:#efe6d1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar i.late{background:linear-gradient(90deg,var(--bad),#e07a4a)}
.chart{height:250px}
.diary{display:flex;flex-direction:column;gap:10px}
.de{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:13px}
.de .tl{flex:none;text-align:center;width:52px}
.de .tl b{display:block;font-size:15px;font-family:Inter;color:var(--accent)}
.de .tl small{font-size:10px;color:var(--mut)}
.de .bd2{flex:1;min-width:0}
.de .bd2 b{font-size:13.5px;font-family:"Noto Sans TC"}
.de .bd2 p{margin:3px 0 0;font-size:12px;color:var(--mut);line-height:1.6}
.de .bd2 .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph{aspect-ratio:4/3;border:2px dashed #c9b98c;border-radius:12px;background:repeating-linear-gradient(45deg,#faf3e2,#faf3e2 10px,#f4ead2 10px,#f4ead2 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#a1926a;position:relative;overflow:hidden}
.ph .material-symbols-outlined{font-size:30px}
.ph small{font-size:11px;font-weight:700}
.ph .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(44,36,16,.72);color:#fdf7e6;font-size:10px;padding:4px 7px;text-align:left;font-weight:600}
.ph .pin{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:20px}
.aibox{background:linear-gradient(135deg,#4a3712,#6b4d14);color:#fdf3d8;border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.aibox:before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(202,138,4,.25)}
.aibox h3{color:#fde9b6;margin:0 0 10px}
.aibox h3 .material-symbols-outlined{color:#fbcf62}
.aibox p{margin:0 0 12px;font-size:13px;line-height:1.75;position:relative}
.aibox .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(253,243,216,.14);border:1px solid rgba(253,243,216,.25);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;margin:0 6px 6px 0}
.todo{display:flex;flex-direction:column;gap:8px}
.td{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px}
.td .cbx{width:16px;height:16px;border-radius:4px;border:2px solid var(--accent);flex:none;display:grid;place-items:center}
.td .cbx.done{background:var(--accent);border-color:var(--accent)}
.td .cbx.done:after{content:"check";font-family:"Material Symbols Outlined";font-size:12px;color:#fff}
.td .mt{margin-left:auto;color:var(--mut);font-size:11px}
.scroll{overflow-x:auto}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:700;background:var(--card)}
.pill b{color:var(--accent);font-family:Inter}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side .foot{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.wh{grid-template-columns:repeat(3,1fr)}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}.photos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">日</div><div><b>工地日報 AI 站</b><span>DAILY REPORT AI</span></div></div>
    <div id="nav"></div>
    <div class="foot">A7 商辦新建工程<br/>08/13（三）· 晴時多雲<br/>出工 68 人 · 進度 62.4%</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">日報總覽</h2><p id="vd"></p></div><div class="live"><i></i>現場即時回報中</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["日報總覽","dashboard","日報總覽","當日天氣、出工與進度戰情一覽"],
["施工日誌","menu_book","施工日誌","逐日施工項目與工序紀事"],
["人力機具","engineering","人力機具","工班出工與機具進場統計"],
["進度回報","trending_up","進度回報","各分項工程完成率與落後預警"],
["照片紀錄","photo_camera","照片紀錄","現場施工照片與缺失標註"],
["AI 日報摘要","smart_toy","AI 日報摘要","自動彙整當日重點、待辦與異常"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const WHOUR=[["06:00","clear_day","23°"],["09:00","partly_cloudy_day","27°"],["12:00","sunny","31°"],["15:00","cloud","30°"],["18:00","rainy","26°"],["21:00","nights_stay","24°"]];
const LABOR=[["模板工班","泓昌營造","12","12","0","t-ok"],["鋼筋工班","金鋼鐵工","10","9","1 遲","t-warn"],["混凝土工","嘉信預拌","8","8","0","t-ok"],["水電工班","協力機電","14","14","0","t-ok"],["泥作工班","順發泥作","9","7","2 假","t-warn"],["安衛管理","本工地","3","3","0","t-ok"]];
const MACH=[["塔式起重機","T-01","運轉中","6.5 hr","t-ok"],["混凝土泵浦車","P-03","進場澆置","4.0 hr","t-info"],["挖土機","E-02","待命","1.5 hr","t-warn"],["發電機","G-04","運轉中","8.0 hr","t-ok"],["高空作業車","L-05","保養中","0 hr","t-bad"]];
const PROG=[["地下室結構","B3~B1 樓層",100,"完成","t-ok"],["1F 樑柱鋼筋","綁紮與檢查",88,"進行中","t-info"],["2F 樓板模板","支撐與封板",74,"進行中","t-info"],["外牆防水","B2 施作",46,"落後 3 天","t-bad"],["機電管線","1F 預埋",61,"進行中","t-info"],["帷幕牆放樣","立面定位",22,"備料中","t-warn"]];
const DIARY=[["07:30","晨會與安全宣導","全體 68 人出席晨會，宣導高處作業繫掛與吊掛管制，發放今日作業許可 5 張。",["晨會","safety"],"t-ok"],
["09:10","1F 樑柱鋼筋綁紮","進行 1F 主樑主筋綁紮，完成 A~C 軸共 12 支，監造抽查合格。",["鋼筋","抽查合格"],"t-info"],
["11:20","B2 外牆防水施作","外牆防水底塗完成 46%，因昨日局部滲水，複驗仍待改善。",["防水","待改善"],"t-warn"],
["14:00","2F 樓板混凝土澆置","泵浦車進場澆置 2F 局部樓板 42m³，坍度試驗 18cm 合格。",["混凝土","澆置"],"t-info"],
["16:40","收工整理與清潔","各工班收工前完成料具歸位與環境清潔，塔吊回定位鎖定。",["收工","5S"],"t-ok"]];
const PHOTOS=[["1F 鋼筋綁紮","A-C 軸主樑","t-ok","合格"],["B2 外牆防水","局部滲水點","t-bad","缺失"],["2F 樓板澆置","坍度試驗","t-ok","合格"],["塔吊吊掛作業","管制範圍","t-info","紀錄"],["安全圍籬","西側臨路","t-warn","待補"],["臨時用電盤","漏電斷路器","t-ok","合格"],["模板支撐","2F 支撐架","t-info","紀錄"],["現場清潔","收工前","t-ok","合格"]];
const TODO=[["外牆防水缺失指定改善責任人並排定複驗（08/15）",1],["補齊西側安全圍籬並拍照回報",0],["高空作業車保養完成後回報可用時數",0],["2F 樓板混凝土養護灑水紀錄建檔",0],["明日鋼筋進場 8t 通知門禁與吊掛排程",1]];

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">groups</span><div class="l">今日出工</div><div class="v">68<small style="font-size:12px"> 人</small></div><div class="d dn">▼ 缺 3 人（請假）</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">precision_manufacturing</span><div class="l">機具進場</div><div class="v">5<small style="font-size:12px"> 台</small></div><div class="d up">4 運轉 · 1 保養</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">trending_up</span><div class="l">累計進度</div><div class="v">62.4<small style="font-size:12px">%</small></div><div class="d up">▲ 較昨 +1.8%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">落後分項</div><div class="v" style="color:var(--bad)">1</div><div class="d" style="color:var(--mut)">外牆防水 落後 3 天</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">wb_sunny</span>當日天氣（工地現場）</h3>
  <div class="wx"><div class="sun"><span class="material-symbols-outlined">wb_sunny</span></div><div class="wt"><b>31°C</b><small>晴時多雲 · 台北市 內湖區</small><div class="wmeta"><span>濕度 <b>68%</b></span><span>風速 <b>3 m/s</b></span><span>降雨 <b>20%</b></span><span>紫外線 <b>強</b></span></div></div></div>
  <div class="wh">${WHOUR.map(w=>`<div class="whc"><small>${w[0]}</small><span class="material-symbols-outlined">${w[1]}</span><b>${w[2]}</b></div>`).join('')}</div>
  <p style="font-size:11.5px;color:var(--mut);margin:12px 0 0"><span class="material-symbols-outlined" style="font-size:15px;color:var(--warn)">umbrella</span> 18:00 後有短暫陣雨，戶外混凝土澆置建議於 16:00 前完成收面。</p>
 </div>
 <div class="card"><h3><span class="material-symbols-outlined">assignment</span>今日重點回報</h3><div class="rep">
  <div class="ri"><div class="mid"><b>1F 樑柱鋼筋綁紮</b><small>A~C 軸 · 監造抽查合格</small></div><div class="qty"><b>88%</b><small>完成率</small></div></div>
  <div class="ri b"><div class="mid"><b>B2 外牆防水</b><small>局部滲水 · 複驗待改善</small></div><div class="qty"><b style="color:var(--bad)">46%</b><small>落後 3 天</small></div></div>
  <div class="ri"><div class="mid"><b>2F 樓板混凝土澆置</b><small>42m³ · 坍度 18cm 合格</small></div><div class="qty"><b>74%</b><small>完成率</small></div></div>
  <div class="ri w"><div class="mid"><b>安全圍籬（西側）</b><small>臨路段待補強</small></div><div class="qty"><b style="color:var(--warn)">待補</b><small>安衛缺失</small></div></div>
 </div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">insights</span>近 7 日出工與進度趨勢</h3><div class="chart" id="c_ov"></div></div>`,

()=>`<div class="stat"><span class="pill">工地日誌 · <b>08/13（三）</b></span><span class="pill">記錄人 <b>陳工地</b></span><span class="pill">工項 <b>5</b></span><span class="pill">監造抽查 <b>1</b></span></div>
<div class="card"><h3><span class="material-symbols-outlined">menu_book</span>施工日誌 · 逐時紀事</h3><div class="diary">${DIARY.map(d=>`<div class="de"><div class="tl"><b>${d[0]}</b><small>時刻</small></div><div class="bd2"><b>${d[1]}</b><p>${d[2]}</p><div class="tags"><span class="tag ${d[4]}">${d[3][0]}</span><span class="tag t-info">${d[3][1]}</span></div></div></div>`).join('')}</div>
<p style="font-size:11.5px;color:var(--mut);margin:14px 0 0"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">edit_note</span> 本日誌由現場專員即時填報，AI 於收工後彙整為正式日報（見 AI 日報摘要）。</p></div>`,

()=>`<div class="grid g11">
 <div class="card"><h3><span class="material-symbols-outlined">engineering</span>工班出工 <span class="tag t-info" style="margin-left:auto">應到 59 · 實到 53</span></h3><div class="scroll"><table class="data"><tr><th>工班</th><th>協力廠商</th><th>應到</th><th>實到</th><th>異動</th></tr>${LABOR.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}</b></td><td><span class="tag ${r[5]}">${r[4]==='0'?'全到':r[4]}</span></td></tr>`).join('')}</table></div></div>

function draw(i){
 if(i===0){var el=document.getElementById('c_ov');if(el){var c=echarts.init(el);c.setOption({grid:{left:38,right:16,top:28,bottom:26},tooltip:{trigger:'axis'},legend:{data:['出工人數','累計進度%'],top:0,textStyle:{fontSize:11}},xAxis:{type:'category',data:['8/7','8/8','8/9','8/10','8/11','8/12','8/13'],axisLine:{lineStyle:{color:'#c9b98c'}},axisLabel:{fontSize:11}},yAxis:[{type:'value',axisLabel:{fontSize:10}},{type:'value',min:50,max:70,axisLabel:{fontSize:10,formatter:'{value}%'}}],series:[{name:'出工人數',type:'bar',data:[61,64,66,0,63,66,68],barWidth:'46%',itemStyle:{color:'#ca8a04',borderRadius:[4,4,0,0]}},{name:'累計進度%',type:'line',yAxisIndex:1,smooth:true,data:[54.1,56.0,57.9,58.2,59.5,60.6,62.4],lineStyle:{color:'#a16207',width:3},itemStyle:{color:'#a16207'}}]});}}
 if(i===2){var el2=document.getElementById('c_lb');if(el2){var c2=echarts.init(el2);c2.setOption({grid:{left:70,right:36,top:14,bottom:24},tooltip:{trigger:'axis'},xAxis:{type:'value',axisLabel:{fontSize:10}},yAxis:{type:'category',data:['安衛管理','泥作工班','水電工班','混凝土工','鋼筋工班','模板工班'],axisLabel:{fontSize:11}},series:[{type:'bar',data:[3,7,14,8,9,12],barWidth:'58%',itemStyle:{color:function(p){return['#c2451f','#d98a1f','#ca8a04','#a16207','#b98a2a','#8a6a1a'][p.dataIndex];},borderRadius:[0,5,5,0]},label:{show:true,position:'right',fontSize:11,formatter:'{c} 人'}}]});}}
 if(i===3){var el3=document.getElementById('c_pg');if(el3){var c3=echarts.init(el3);c3.setOption({grid:{left:38,right:16,top:28,bottom:26},tooltip:{trigger:'axis'},legend:{data:['計畫','實際'],top:0,textStyle:{fontSize:11}},xAxis:{type:'category',data:['第4週','第6週','第8週','第10週','第12週','第14週','本週'],axisLine:{lineStyle:{color:'#c9b98c'}},axisLabel:{fontSize:10}},yAxis:{type:'value',max:100,axisLabel:{fontSize:10,formatter:'{value}%'}},series:[{name:'計畫',type:'line',smooth:true,data:[18,30,42,52,60,66,72],lineStyle:{color:'#b3a37c',type:'dashed',width:2},itemStyle:{color:'#b3a37c'},areaStyle:{color:'rgba(179,163,124,.12)'}},{name:'實際',type:'line',smooth:true,data:[16,28,40,50,57,60.6,62.4],lineStyle:{color:'#a16207',width:3},itemStyle:{color:'#a16207'},areaStyle:{color:'rgba(161,98,7,.18)'}}]});}}
 if(i===5){var el5=document.getElementById('c_ai');if(el5){var c5=echarts.init(el5);c5.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['46%','72%'],center:['50%','44%'],label:{fontSize:11},data:[{value:2,name:'已完成',itemStyle:{color:'#5b8c3e'}},{value:4,name:'進行中',itemStyle:{color:'#ca8a04'}},{value:1,name:'待補/待改善',itemStyle:{color:'#d98a1f'}},{value:1,name:'落後',itemStyle:{color:'#c2451f'}}]}]});}}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
