<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工地日報 AI 站 · Construction Daily Report</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>

<style>
:root{
  --color-primary:#64748B;--color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;--color-on-secondary:#0F172A;
  --color-accent:#EA580C;--color-on-accent:#000000;
  --color-background:#F8FAFC;--color-foreground:#334155;
  --color-card:#FFFFFF;--color-card-foreground:#334155;
  --color-muted:#EBF0F5;--color-muted-foreground:#475569;
  --color-border:#E2E8F0;--color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;--color-ring:#64748B;
  --blue:#64748B;--ink:#334155;--muted:#475569;--line:#E2E8F0;
  --ok:#15803D;--warn:#B45309;--bad:#DC2626;--info:#1D4ED8;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 30px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;z-index:20;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:20px 14px 14px;background:#fff;border-right:1px solid var(--line)}
.bd{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.lg{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:10px;background:#0F172A;color:#fff;font-size:18px;font-weight:800;box-shadow:inset 0 -4px 0 var(--color-accent)}
.bd b{display:block;color:#0F172A;font-size:15px;font-weight:800;letter-spacing:.01em}
.bd span{display:block;margin-top:3px;color:var(--color-accent);font:10px/1 JetBrains Mono,monospace;letter-spacing:.11em}
#nav{display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:#475569;text-align:left;font-size:13px;font-weight:650;transition:background .2s,border-color .2s,color .2s,transform .2s}
.side button .material-symbols-outlined{color:#64748B}
.side button:hover{background:#F1F5F9;border-color:#E2E8F0;color:#0F172A;transform:translateX(2px)}
.side button.on{background:#0F172A;color:#fff;border-color:#0F172A;box-shadow:inset 4px 0 0 var(--color-accent)}
.side button.on .material-symbols-outlined{color:#FB923C}
.foot{margin-top:auto;padding:15px 10px 4px;border-top:1px solid var(--line);color:#475569;font:11px/1.8 JetBrains Mono,monospace}
.main{min-width:0;padding:22px 26px 36px}
.vh{position:relative;isolation:isolate;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;min-height:174px;margin-bottom:18px;padding:26px 28px;overflow:hidden;border-radius:14px;background:#0F172A;color:#fff;box-shadow:var(--shadow)}
.vh:before,.vh:after{content:"";position:absolute;z-index:-1;pointer-events:none}
.vh:before{right:4%;top:20px;width:245px;height:120px;border:1px solid rgba(148,163,184,.32);transform:skewY(-12deg);background:repeating-linear-gradient(90deg,transparent 0 39px,rgba(148,163,184,.13) 40px),repeating-linear-gradient(0deg,transparent 0 29px,rgba(148,163,184,.12) 30px)}
.vh:after{right:10%;bottom:-54px;width:190px;height:150px;border:2px solid rgba(234,88,12,.72);transform:rotateX(58deg) rotateZ(45deg);background:rgba(234,88,12,.07);box-shadow:18px 18px 0 rgba(100,116,139,.08),36px 36px 0 rgba(100,116,139,.05)}
.vh h2{margin:0;font-size:clamp(27px,4vw,45px);line-height:1.05;letter-spacing:-.04em;font-weight:800}
.vh h2:after{content:" / FIELD REPORT";display:block;margin-top:10px;color:#CBD5E1;font:italic 13px/1.2 "Playfair Display",serif;letter-spacing:.08em}
.vh p{max-width:570px;margin:10px 0 0;color:#CBD5E1;font-size:13px;line-height:1.6}
.live{display:flex;align-items:center;gap:8px;flex:none;min-height:38px;padding:8px 13px;border:1px solid rgba(255,255,255,.22);border-radius:7px;background:rgba(255,255,255,.08);color:#fff;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}
.live i{width:8px;height:8px;border-radius:50%;background:#FB923C;box-shadow:0 0 0 3px rgba(251,146,60,.18)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi,.card{background:var(--color-card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.kpi{position:relative;min-height:116px;padding:16px;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:#CBD5E1;box-shadow:var(--shadow)}
.kpi:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:#CBD5E1}
.kpi .l{color:#475569;font-size:11px;font-weight:700;letter-spacing:.06em}
.kpi .v{margin-top:8px;color:#0F172A;font-size:27px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px}
.kpi .d{margin-top:8px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:14px;color:#94A3B8;font-size:23px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:16px}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;color:#0F172A;font-size:13px;font-weight:800}
.card h3 .material-symbols-outlined{color:var(--color-accent)}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:3px 8px;border:1px solid transparent;border-radius:5px;font-size:10px;font-weight:800;line-height:1.2;white-space:nowrap}
.t-ok{background:#ECFDF3;border-color:#BBF7D0;color:#166534}
.t-warn{background:#FFF7ED;border-color:#FED7AA;color:#9A3412}
.t-bad{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
.t-info{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.scroll{max-width:100%;overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{position:sticky;top:0;background:#F1F5F9;color:#334155;font-size:10px;font-weight:800;letter-spacing:.055em}
table.data tr:hover td{background:#F8FAFC}
table.data td:nth-child(n+3){font-variant-numeric:tabular-nums}
table.data th:nth-child(n+3),table.data td:nth-child(n+3){text-align:right}
table.data td:nth-child(2){font-family:JetBrains Mono,monospace}
.wx{display:flex;align-items:center;gap:18px;padding:17px;border:1px solid #FED7AA;border-radius:9px;background:#FFF7ED}
.sun{display:grid;place-items:center;width:60px;height:60px;flex:none;border-radius:8px;background:var(--color-accent);color:#fff;box-shadow:8px 8px 0 #FED7AA}
.sun .material-symbols-outlined{font-size:34px}
.wt{flex:1;min-width:0}.wt>b{color:#0F172A;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}
.wt small{display:block;margin-top:2px;color:#475569;font-size:11px}
.wmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:#475569;font-size:10px}
.wmeta b{color:#0F172A;font-variant-numeric:tabular-nums}
.wh{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:11px}
.whc{padding:8px 4px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:center}
.whc small,.whc b{display:block}.whc small{color:#475569;font:9px JetBrains Mono,monospace}.whc b{margin-top:2px;font-size:11px;font-variant-numeric:tabular-nums}
.whc .material-symbols-outlined{margin:4px 0;color:#EA580C;font-size:19px}
.rep,.diary,.todo{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;align-items:center;gap:12px;padding:10px 11px;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:7px}
.ri.w{border-left-color:var(--warn)}.ri.b{border-left-color:var(--bad)}
.ri .mid{flex:1;min-width:0}.ri .mid b{color:#0F172A;font-size:12px}.ri .mid small{display:block;margin-top:3px;color:#475569;font-size:10px}
.qty{flex:none;text-align:right}.qty b{color:#334155;font-size:15px;font-variant-numeric:tabular-nums}.qty small{display:block;color:#475569;font-size:9px}
.chart{height:250px}
.bar{height:8px;overflow:hidden;border-radius:2px;background:#E2E8F0}
.bar i{display:block;height:100%;border-radius:2px;background:#64748B}
.bar i.late{background:#DC2626}
.stat{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#475569;font-size:10px;font-weight:700}
.pill b{color:#0F172A;font-variant-numeric:tabular-nums}
.de{position:relative;display:flex;gap:14px;padding:12px 12px 12px 18px;border:1px solid var(--line);border-radius:7px;background:#fff}
.de:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#94A3B8}
.de:after{content:"";position:absolute;left:-4px;top:18px;width:8px;height:8px;border:2px solid #fff;border-radius:50%;background:#EA580C;box-shadow:0 0 0 1px #EA580C}
.de .tl{width:55px;flex:none;text-align:center}.de .tl b{display:block;color:#0F172A;font:13px JetBrains Mono,monospace}.de .tl small{color:#475569;font-size:9px}
.bd2{flex:1;min-width:0}.bd2>b{color:#0F172A;font-size:12px}.bd2 p{margin:3px 0 0;color:#475569;font-size:11px;line-height:1.6}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ph{position:relative;display:flex;aspect-ratio:4/3;overflow:hidden;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px dashed #94A3B8;border-radius:8px;background:repeating-linear-gradient(135deg,#F8FAFC 0 12px,#F1F5F9 12px 24px);color:#64748B}
.ph .material-symbols-outlined{font-size:28px}.ph small{font-size:10px;font-weight:800}
.cap{position:absolute;right:0;bottom:0;left:0;padding:6px 8px;background:rgba(15,23,42,.88);color:#fff;font-size:9px;font-weight:600}
.pin{position:absolute;z-index:2;right:6px;top:6px}
.aibox{position:relative;isolation:isolate;overflow:hidden;padding:22px;border-radius:12px;background:#0F172A;color:#F8FAFC;box-shadow:var(--shadow)}
.aibox:before{content:"AI";position:absolute;z-index:-1;right:-8px;bottom:-31px;color:rgba(234,88,12,.18);font:800 132px/1 Inter,sans-serif;letter-spacing:-.1em}
.aibox h3{display:flex;align-items:center;gap:8px;margin:0 0 11px;color:#fff;font-size:15px}.aibox h3 .material-symbols-outlined{color:#FB923C}
.aibox p{position:relative;max-width:1050px;margin:0 0 13px;color:#E2E8F0;font-size:12px;line-height:1.8}.aibox p b{color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;margin:0 5px 5px 0;padding:5px 9px;border:1px solid rgba(255,255,255,.2);border-radius:5px;background:rgba(255,255,255,.06);color:#F8FAFC;font-size:10px;font-weight:700}
.td{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;color:#334155;font-size:11px}
.cbx{display:grid;place-items:center;width:17px;height:17px;flex:none;border:2px solid #64748B;border-radius:3px}
.cbx.done{border-color:#15803D;background:#15803D}.cbx.done:after{content:"check";color:#fff;font-family:"Material Symbols Outlined";font-size:12px}
.mt{margin-left:auto;color:#475569;font-size:9px;white-space:nowrap}
.mono{font-family:JetBrains Mono,monospace}
.grid-item{animation:reveal .42s both cubic-bezier(.2,.8,.2,1)}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){.shell{grid-template-columns:210px minmax(0,1fr)}.main{padding:18px}.g2{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){
  .shell{display:block}.side{position:sticky;height:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.bd{padding:2px 4px 9px}.lg{width:38px;height:38px}#nav{display:flex;flex-direction:row;gap:6px;overflow-x:auto;padding:2px 0}.side button{width:auto;min-width:max-content;min-height:40px}.side button.on{box-shadow:inset 0 -3px 0 var(--color-accent)}.foot{display:none}
  .main{padding:14px}.vh{min-height:154px;padding:22px}.live{align-self:flex-start}.kpis{grid-template-columns:repeat(2,1fr)}.g11{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.wh{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:430px){.vh{align-items:flex-start;flex-direction:column}.vh:before{opacity:.35}.kpis{grid-template-columns:1fr}.photos{grid-template-columns:1fr}.wx{align-items:flex-start}.wmeta{gap:7px 12px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

}
function show(i){
disposeCharts();
nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();requestAnimationFrame(()=>draw(i))
}
function fromHash(){
const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
const n=document.querySelectorAll("[data-i]").length||6;
show(m?Math.min(+m[1],n-1):0);
try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>activeChart.forEach(c=>c.resize()));
fromHash();
</script>
