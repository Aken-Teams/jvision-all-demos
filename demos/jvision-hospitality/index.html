<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>旅宿營運管理｜Jvision Demo</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#0891b2; --accent2:#22d3ee; --ink:#0f2b34; --muted:#5b7480;
    --bg:#f2f7f9; --card:#ffffff; --line:#dbe8ed; --soft:#eaf4f7;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --purple:#7c3aed;
    --radius:16px; --shadow:0 6px 24px rgba(8,145,178,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif; color:var(--ink);
    background:linear-gradient(180deg,#eef6f9 0%,#f2f7f9 260px,#f2f7f9 100%);
    -webkit-font-smoothing:antialiased;
  }
  .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  header.topbar{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(100deg,#083f4a,#0891b2 55%,#0e7490);
    color:#fff;box-shadow:0 4px 18px rgba(8,63,74,.28);
  }
  .topwrap{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.28);}
  .brand .logo .material-symbols-outlined{font-size:24px;color:#cffafe;}
  .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
  .brand p{margin:0;font-size:11.5px;color:#a5e9f4;font-weight:500;white-space:nowrap;}
  .topmeta{margin-left:auto;display:flex;align-items:center;gap:14px;min-width:0;}
  .topmeta .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .topmeta .pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.28);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#0891b2);display:grid;place-items:center;font-weight:700;font-size:13px;color:#083f4a;flex:none;border:2px solid rgba(255,255,255,.4);}
  nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:25;box-shadow:0 2px 8px rgba(8,145,178,.05);}
  .tabwrap{max-width:1360px;margin:0 auto;padding:9px 16px;display:flex;gap:8px;flex-wrap:wrap;}
  nav.tabs button{
    flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;font-family:inherit;transition:.16s;
  }
  nav.tabs button .material-symbols-outlined{font-size:20px;}
  nav.tabs button:hover{border-color:var(--accent2);color:var(--accent);background:var(--soft);}
  nav.tabs button.on{background:linear-gradient(120deg,#0891b2,#0e7490);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(8,145,178,.32);}
  nav.tabs button .idx{font-size:11px;opacity:.7;font-weight:700;}
  main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
  .shead{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .shead .sic{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:var(--shadow);}
  .shead .sic .material-symbols-outlined{font-size:28px;color:#fff;}
  .shead h2{margin:0;font-size:21px;font-weight:800;}
  .shead p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:500;}
  .shead .stag{margin-left:auto;align-self:center;background:var(--soft);color:var(--accent);border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
  .card h3 .sub{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:auto;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .grid-7-5{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .grid-5-7{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;}
  @media(max-width:820px){
    .kpis{grid-template-columns:1fr 1fr;}
    .grid2,.grid3,.grid-7-5,.grid-5-7{grid-template-columns:1fr;}
  }
  @media(max-width:480px){.kpis{grid-template-columns:1fr;}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
  .kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
  .kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent);}
  .kpi .kv{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  .kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);}
  .kpi .kd{font-size:11.5px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px;}
  .kpi .kd.up{color:var(--ok);} .kpi .kd.down{color:var(--bad);} .kpi .kd.flat{color:var(--muted);}
  .kpi .kd .material-symbols-outlined{font-size:15px;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft);}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--soft);}
  tbody tr:last-child td{border-bottom:none;}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .tag.g{background:#dcfce7;color:#15803d;} .tag.y{background:#fef3c7;color:#b45309;}
  .tag.r{background:#fee2e2;color:#b91c1c;} .tag.b{background:#cffafe;color:#0e7490;}
  .tag.p{background:#ede9fe;color:#6d28d9;} .tag.gr{background:#f1f5f9;color:#475569;}
  .chan{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
  .chan .cd{width:9px;height:9px;border-radius:2px;flex:none;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.board{grid-template-columns:1fr 1fr;}}
  @media(max-width:480px){.board{grid-template-columns:1fr;}}
  .bcol{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
  .bcol .bh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;margin-bottom:11px;padding-bottom:9px;border-bottom:2px solid var(--line);}
  .bcol .bh .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 9px;color:var(--muted);}
  .bcol .bh .bd{width:11px;height:11px;border-radius:3px;flex:none;}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 2px 6px rgba(8,145,178,.05);position:relative;}
  .rcard:last-child{margin-bottom:0;}
  .rcard .rn{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
  .rcard .rt{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;}
  .rcard .rf{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .rcard .g{font-size:11.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:4px;}
  .rcard .g .material-symbols-outlined{font-size:15px;color:var(--muted);}
  .rcard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:11px 0 0 11px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted);margin-top:12px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:60px;}
  .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .tl{position:relative;padding-left:26px;}
  .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl .ti{position:relative;margin-bottom:16px;}
  .tl .ti:last-child{margin-bottom:0;}
  .tl .ti .dot{position:absolute;left:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
  .tl .ti .tm{font-size:11.5px;color:var(--accent);font-weight:800;}
  .tl .ti .tt{font-size:13.5px;font-weight:700;margin-top:2px;}
  .tl .ti .td{font-size:12px;color:var(--muted);margin-top:2px;}
  .matrix{width:100%;border-collapse:separate;border-spacing:0;min-width:560px;font-size:12.5px;}
  .matrix th,.matrix td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);}
  .matrix th{background:var(--soft);font-size:11px;color:var(--muted);font-weight:700;}
  .matrix td:first-child,.matrix th:first-child{text-align:left;font-weight:700;white-space:nowrap;}
  .cell{display:inline-grid;place-items:center;width:38px;height:30px;border-radius:8px;font-weight:800;font-size:13px;}
  .cell.full{background:#fee2e2;color:#b91c1c;} .cell.tight{background:#fef3c7;color:#b45309;}
  .cell.open{background:#dcfce7;color:#15803d;} .cell.closed{background:#e2e8f0;color:#64748b;}
  .funnel{display:flex;flex-direction:column;gap:8px;}
  .frow{display:flex;align-items:center;gap:12px;}
  .frow .fl{width:96px;flex:none;font-size:12.5px;font-weight:700;text-align:right;color:var(--muted);}
  .fbar{height:34px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:800;font-size:13px;box-shadow:var(--shadow);min-width:56px;}
  .frow .fv{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .svc{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;box-shadow:var(--shadow);min-width:0;}
  .svc .sic2{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;margin-bottom:11px;}
  .svc .sic2 .material-symbols-outlined{font-size:24px;color:#fff;}
  .svc .sn{font-weight:800;font-size:15px;}
  .svc .sp{font-size:12px;color:var(--muted);margin:3px 0 10px;}
  .svc .srow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:7px;}
  .svc .srow b{font-size:15px;color:var(--ink);}
  .chart-box{position:relative;height:260px;width:100%;}
  .chart-sm{position:relative;height:220px;width:100%;}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .mrow:last-child{border-bottom:none;}
  .mrow .ml{color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
  .mrow .ml .material-symbols-outlined{font-size:18px;color:var(--accent);}
  .mrow .mv{font-weight:800;}
  .avatar-sm{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#0891b2);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#083f4a;flex:none;}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);}
  .nav-txt{display:inline;}
  @media(max-width:560px){.nav-txt{display:none;} nav.tabs button{padding:9px 11px;} .brand p{display:none;} .topmeta .pill span.plabel{display:none;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hotel</span></div>
      <div>
        <h1>旅宿營運管理</h1>
        <p>Jvision Hospitality Operations Suite</p>
      </div>
    </div>
    <div class="topmeta">
      <div class="pill"><span class="dot"></span><span class="plabel">通路同步正常</span></div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px">calendar_today</span>2026/08/13</div>
      <div class="avatar">陳</div>
    </div>
  </div>
</header>
<nav class="tabs"><div class="tabwrap" id="tabs"></div></nav>
<main><div id="screen"></div>
  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範　·　Jvision 旅宿營運管理　·　/demos/jvision-hospitality/</div>
</main>

<script>
"use strict";
var NAV=[
  {ic:"grid_view",name:"房況看板"},
  {ic:"event_available",name:"訂房中心"},
  {ic:"hub",name:"通路控房"},
  {ic:"trending_up",name:"動態房價"},
  {ic:"room_service",name:"加購服務"},
  {ic:"summarize",name:"結算報表"}
];
var chart=null;
function destroyChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }
function head(ic,title,desc,tag){
  return '<div class="shead"><div class="sic"><span class="material-symbols-outlined">'+ic+'</span></div>'
    +'<div style="min-width:0"><h2>'+title+'</h2><p>'+desc+'</p></div>'
    +'<div class="stag">'+tag+'</div></div>';
}
function kpi(label,ic,val,unit,dir,delta){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var dic=dir==="up"?"trending_up":dir==="down"?"trending_down":"remove";
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+ic+'</span>'+label+'</div>'
    +'<div class="kv">'+val+(unit?'<small> '+unit+'</small>':'')+'</div>'
    +'<div class="kd '+cls+'"><span class="material-symbols-outlined">'+dic+'</span>'+delta+'</div></div>';
}

/* SCREEN 0 : 房況看板 */
function s0(){
  var cols=[
    {t:"可售 (Vacant)",c:"#16a34a",rooms:[
      {n:"201",type:"標準雙人房",st:"已清潔",price:"NT$2,880",tag:["g","可售"]},
      {n:"305",type:"豪華雙人房",st:"已清潔",price:"NT$3,680",tag:["g","可售"]},
      {n:"512",type:"家庭四人房",st:"已清潔",price:"NT$4,980",tag:["g","可售"]}
    ]},
    {t:"已入住 (Occupied)",c:"#0891b2",rooms:[
      {n:"202",type:"標準雙人房",st:"林先生 · 2晚",price:"退房 08/15",tag:["b","住宿中"]},
      {n:"308",type:"豪華雙人房",st:"Wang · 1晚",price:"退房 08/14",tag:["b","住宿中"]},
      {n:"401",type:"景觀套房",st:"陳小姐 · 3晚",price:"退房 08/16",tag:["b","住宿中"]},
      {n:"506",type:"家庭四人房",st:"李家 · 2晚",price:"退房 08/15",tag:["b","住宿中"]}
    ]},
    {t:"待清潔 (Dirty)",c:"#d97706",rooms:[
      {n:"203",type:"標準雙人房",st:"客已退 09:20",price:"指派：阿美",tag:["y","清潔中"]},
      {n:"310",type:"豪華雙人房",st:"客已退 10:05",price:"待指派",tag:["y","待清潔"]}
    ]},
    {t:"維修/停售 (OOO)",c:"#dc2626",rooms:[
      {n:"409",type:"景觀套房",st:"冷氣維修",price:"預計 08/14 復售",tag:["r","維修中"]}
    ]}
  ];
  var boardH="";
  cols.forEach(function(col){
    var cards="";
    col.rooms.forEach(function(r){
      cards+='<div class="rcard"><div class="stripe" style="background:'+col.c+'"></div>'
        +'<div class="rn"><span class="material-symbols-outlined" style="font-size:18px;color:'+col.c+'">meeting_room</span>'+r.n+'</div>'
        +'<div class="rt">'+r.type+'</div>'
        +'<div class="rf"><span class="g"><span class="material-symbols-outlined">schedule</span>'+r.st+'</span></div>'
        +'<div class="rf"><span class="tag '+r.tag[0]+'">'+r.tag[1]+'</span><span style="margin-left:auto;font-weight:800;font-size:12px;color:var(--muted)">'+r.price+'</span></div>'
        +'</div>';
    });
    boardH+='<div class="bcol"><div class="bh"><span class="bd" style="background:'+col.c+'"></span>'+col.t+'<span class="cnt">'+col.rooms.length+'</span></div>'+cards+'</div>';
  });
  var kpis='<div class="kpis">'
    +kpi("今日住房率","hotel","82","%","up","+6% vs 昨日")
    +kpi("可售房","meeting_room","14","間","flat","共 68 間")
    +kpi("今日入住","login","23","組","up","+4 組")
    +kpi("今日退房","logout","18","組","down","-2 組")
    +'</div>';
  var legend='<div class="legend">'
    +'<span><i style="background:#16a34a"></i>可售</span>'
    +'<span><i style="background:#0891b2"></i>已入住</span>'
    +'<span><i style="background:#d97706"></i>待清潔</span>'
    +'<span><i style="background:#dc2626"></i>維修/停售</span></div>';
  return head("grid_view","房況看板","全房型即時房態、清潔與維修狀態一覽，可指派入住與清潔任務","即時房態")
    + kpis
    + '<div class="card"><h3><span class="material-symbols-outlined">dashboard</span>房態總覽看板<span class="sub">2026/08/13 · 68 間客房</span></h3>'
    + '<div style="overflow-x:auto"><div class="board">'+boardH+'</div></div>'+legend+'</div>';
}

/* SCREEN 1 : 訂房中心 */
function s1(){
  var rows=[
    {id:"BK-38210",g:"林俊傑",ch:["#0891b2","官網"],rt:"景觀套房",inn:"08/13",night:2,amt:9600,st:["g","已確認"]},
    {id:"BK-38209",g:"Sarah Lin",ch:["#2563eb","Booking"],rt:"豪華雙人房",inn:"08/14",night:1,amt:3680,st:["y","待入住"]},
    {id:"BK-38208",g:"王大明",ch:["#dc2626","Agoda"],rt:"標準雙人房",inn:"08/13",night:3,amt:8640,st:["g","已確認"]},
    {id:"BK-38207",g:"陳美惠",ch:["#7c3aed","官網"],rt:"家庭四人房",inn:"08/15",night:2,amt:9960,st:["b","已付訂"]},
    {id:"BK-38206",g:"John Chen",ch:["#059669","Expedia"],rt:"豪華雙人房",inn:"08/13",night:1,amt:3680,st:["r","待處理"]},
    {id:"BK-38205",g:"張雅婷",ch:["#0891b2","官網"],rt:"標準雙人房",inn:"08/16",night:2,amt:5760,st:["g","已確認"]}
  ];
  var body="";
  rows.forEach(function(r){

  return head("summarize","結算報表","彙整住房率、RevPAR 與營收結構，產出結算報表並保存稽核紀錄","營運分析")
    + kpis
    + '<div class="grid-7-5" style="margin-bottom:16px">'
    +   '<div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>營收與 RevPAR 月趨勢</h3><div class="chart-box"><canvas id="c5a"></canvas></div></div>'
    +   '<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>營收結構占比</h3><div class="chart-sm"><canvas id="c5b"></canvas></div></div>'
    + '</div>'
    + '<div class="grid-7-5">'
    +   '<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>各房型營收明細<span class="sub">2026 年 8 月</span></h3>'
    +     '<div style="overflow-x:auto"><table><thead><tr><th>房型</th><th style="text-align:center">已售間夜</th><th>住房率</th><th>ADR</th><th>營收</th></tr></thead><tbody>'+body+'</tbody></table></div></div>'
    +   '<div class="card"><h3><span class="material-symbols-outlined">lightbulb</span>營運洞察</h3>'+ptH+'</div>'
    + '</div>';
}
function s5charts(){
  var a=document.getElementById("c5a");
  chart=new Chart(a,{data:{labels:["3月","4月","5月","6月","7月","8月"],
    datasets:[
      {type:"bar",label:"總營收(M)",data:[3.9,4.1,4.3,4.5,4.6,4.82],backgroundColor:"#22d3ee",borderRadius:6,maxBarThickness:34,yAxisID:"y"},
      {type:"line",label:"RevPAR",data:[2510,2620,2710,2780,2820,2896],borderColor:"#0891b2",backgroundColor:"#0891b2",borderWidth:3,tension:.35,pointRadius:4,yAxisID:"y1"}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{family:"Noto Sans TC",size:11},usePointStyle:true,padding:12}}},
    scales:{y:{position:"left",beginAtZero:true,grid:{color:"#eef2f4"},ticks:{callback:function(v){return v+"M";}}},
      y1:{position:"right",grid:{display:false},ticks:{callback:function(v){return "$"+v;}}},x:{grid:{display:false}}}}});
  var b=document.getElementById("c5b");
  b._c=new Chart(b,{type:"doughnut",data:{labels:["家庭四人房","豪華雙人房","標準雙人房","景觀套房"],
    datasets:[{data:[27,27,25,21],backgroundColor:["#0891b2","#22d3ee","#0e7490","#67e8f9"],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom",labels:{font:{family:"Noto Sans TC",size:11},usePointStyle:true,padding:9}}}}});
}

var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[null,s1charts,s2charts,s3charts,s4charts,s5charts];

function buildTabs(){
  var h="";
  NAV.forEach(function(n,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="nav-txt">'+n.name+'</span><span class="idx">0'+i+'</span></button>';
  });
  var t=document.getElementById("tabs");
  t.innerHTML=h;
  var btns=t.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); }); })(btns[i]); }
}
function show(i){
  destroyChart();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
  void container.offsetHeight;
  if(CHARTS[i]){ CHARTS[i](); }
}
buildTabs();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
