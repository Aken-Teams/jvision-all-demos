<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>移轉訂價管理系統（Transfer Pricing Management System）｜Jvision 系統 Demo</title>
<meta name="description" content="關係人交易彙整、訂價政策模擬到常規區間比對的移轉訂價一站式管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#16a34a;--accent2:#4ade80;--accent-dark:#15803d;
  --bg:#f1f5f4;--panel:#ffffff;--ink:#0f2a1e;--muted:#6b8578;
  --line:#e3ece7;--soft:#f6faf8;--warn:#e0632c;--danger:#dc2626;--amber:#d99a15;
  --shadow:0 1px 2px rgba(16,60,40,.05),0 8px 26px rgba(16,60,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
.shell{max-width:1360px;margin:0 auto;padding:0 18px 60px}
/* Top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.3);flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11.5px;margin:2px 0 0;color:var(--muted);font-weight:500}
.badge{margin-left:auto;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--accent-dark);box-shadow:var(--shadow)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(74,222,128,.25)}
/* Nav */
nav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.navbtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.16s;min-width:0}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn .idx{font-size:10px;font-weight:800;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 6px}
.navbtn:hover{border-color:var(--accent2);color:var(--accent-dark)}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(22,163,74,.28)}
.navbtn.on .idx{background:rgba(255,255,255,.22);color:#fff}
/* Split workspace signature */
.screen{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.pane-hd{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line)}
.pane-hd .material-symbols-outlined{font-size:20px;color:var(--accent)}
.pane-hd h2{font-size:14.5px;margin:0;font-weight:800}
.pane-hd .sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.pane-hd .spacer{margin-left:auto}
.pane-bd{padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.chip.g{background:#e7f6ee;color:var(--accent-dark)}
.chip.a{background:#fdf3dc;color:#8a6410}
.chip.r{background:#fdeaea;color:#b42121}
.chip.b{background:#e8f0fb;color:#28558f}
/* List (left pane) */
.listitem{display:flex;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s;min-width:0}
.listitem:hover{background:var(--soft)}
.listitem.sel{background:#eaf7f0;box-shadow:inset 3px 0 0 var(--accent)}
.listitem .av{width:36px;height:36px;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800;font-size:12px;color:var(--accent-dark)}
.listitem .mn{min-width:0;flex:1}
.listitem .mn .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .mn .d{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .amt{text-align:right;flex:0 0 auto;font-size:12px;font-weight:800}
.listitem .amt small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .k-t{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .k-t .material-symbols-outlined{font-size:16px;color:var(--accent)}
.kpi .k-v{font-size:23px;font-weight:900;margin-top:7px;letter-spacing:-.5px}
.kpi .k-v small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .k-s{font-size:11px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px}
.kpi .k-s .material-symbols-outlined{font-size:14px}
.up{color:var(--accent-dark)}.down{color:var(--danger)}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* charts */
.cwrap{position:relative;width:100%;overflow:hidden}
/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .hd .material-symbols-outlined{font-size:18px;color:var(--accent)}
.card .hd h3{font-size:13px;margin:0;font-weight:800}
.card .hd .spacer{margin-left:auto}
.card .bd{padding:15px 16px}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:9px;padding:0 2px}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:10px;padding:1px 7px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,60,40,.04)}
.tk:last-child{margin-bottom:0}
.tk .tt{font-size:12px;font-weight:700;line-height:1.35}
.tk .tm{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.tk .tm .who{margin-left:auto;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px 0}
.tl .ev:last-child{padding-bottom:0}
.tl .ev .dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 3px #eaf7f0}
.tl .ev.a .dot{border-color:var(--amber);box-shadow:0 0 0 3px #fdf3dc}
.tl .ev.r .dot{border-color:var(--danger);box-shadow:0 0 0 3px #fdeaea}
.tl .ev .et{font-size:12.5px;font-weight:700}
.tl .ev .ed{font-size:11.5px;color:var(--muted);margin-top:2px}
.tl .ev .ex{font-size:10.5px;color:var(--accent-dark);font-weight:700;margin-top:3px}
/* misc rows */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.stat-row:last-child{border-bottom:none}
.stat-row b{font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:600;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.quart{position:relative;height:38px;background:var(--soft);border:1px solid var(--line);border-radius:10px;margin:12px 0}
.quart .rng{position:absolute;top:0;bottom:0;background:rgba(22,163,74,.16);border-left:2px dashed var(--accent);border-right:2px dashed var(--accent)}
.quart .med{position:absolute;top:0;bottom:0;width:2px;background:var(--accent-dark)}
.quart .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--warn);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.quart .lbl{position:absolute;top:-2px;font-size:9.5px;color:var(--muted);transform:translateX(-50%)}
.notice{display:flex;gap:10px;background:#fdf3dc;border:1px solid #f0dca6;border-radius:12px;padding:12px 14px;font-size:12px;color:#7a5a0f;align-items:flex-start}
.notice .material-symbols-outlined{font-size:19px;color:var(--amber);flex:0 0 auto}
.doc-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.doc-row:last-child{border-bottom:none}
.doc-row .di{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--line);color:var(--accent);flex:0 0 auto}
.doc-row .dn{flex:1;min-width:0}
.doc-row .dn .t{font-size:12.5px;font-weight:700}
.doc-row .dn .d{font-size:11px;color:var(--muted);margin-top:1px}
.ring{position:relative;width:120px;height:120px;margin:0 auto}
.foot{margin-top:22px;text-align:center;font-size:11px;color:var(--muted)}
@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .navbtn .lbl{display:none}
  .board{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div>
        <h1>移轉訂價管理系統</h1>
        <p>Transfer Pricing Management System · 集團關係人交易與常規區間治理</p>
      </div>
    </div>
    <div class="badge"><span class="dot"></span>FY2025 · 12 個集團實體</div>
  </div>
  <nav id="nav"></nav>
  <div id="screen"></div>
  <div class="foot">Jvision 系統 Demo · 純前端展示，資料為模擬數據</div>
</div>

<script>
"use strict";
var MODS=[
  {icon:"account_tree",name:"關係人與交易架構",desc:"集團實體與功能風險畫像"},
  {icon:"receipt_long",name:"關係人交易彙整",desc:"跨國交易紀錄集中勾稽"},
  {icon:"rule",name:"訂價政策與模擬",desc:"訂價方法設定與利潤試算"},
  {icon:"insights",name:"常規交易比對",desc:"四分位 Benchmarking 分析"},
  {icon:"shield",name:"風險預警塔",desc:"偏離常規區間即時預警"},
  {icon:"gavel",name:"文據與合規",desc:"三層文據與國別報告"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* ---------- fake data ---------- */
var ENTITIES=[
  {code:"TW-HQ",name:"台灣總部（母公司）",role:"策略/研發/品牌",fn:"完整功能",risk:"高",cty:"台灣",tx:38},

  {code:"US-DIST",name:"美國銷售子公司",role:"經銷/售後",fn:"行銷/配銷",risk:"中",cty:"美國",tx:44},
  {code:"NL-IP",name:"荷蘭 IP 控股",role:"無形資產持有",fn:"IP 授權",risk:"高",cty:"荷蘭",tx:17},
  {code:"SG-HUB",name:"新加坡採購中心",role:"區域採購/物流",fn:"採購/協調",risk:"中",cty:"新加坡",tx:33}
];
var TXROWS=[
  {id:"IC-1042",from:"TW-HQ",to:"CN-MFG",type:"有形貨物",method:"CPM 成本加成",amt:"NT$ 128.4M",st:"已勾稽",cls:"g"},
  {id:"IC-1043",from:"CN-MFG",to:"US-DIST",type:"製成品銷售",method:"TNMM 交易淨利",amt:"NT$ 264.0M",st:"已勾稽",cls:"g"},
  {id:"IC-1051",from:"NL-IP",to:"TW-HQ",type:"權利金授權",method:"CUP 可比未受控",amt:"NT$ 42.6M",st:"待補件",cls:"a"},
  {id:"IC-1058",from:"TW-HQ",to:"SG-HUB",type:"服務費/管理費",method:"成本加成 5%",amt:"NT$ 18.9M",st:"已勾稽",cls:"g"},
  {id:"IC-1063",from:"SG-HUB",to:"VN-MFG",type:"原料採購",method:"CUP 可比未受控",amt:"NT$ 76.2M",st:"待勾稽",cls:"a"},
  {id:"IC-1071",from:"TW-HQ",to:"NL-IP",type:"研發成本分攤",method:"CCA 成本分攤",amt:"NT$ 33.1M",st:"異常",cls:"r"},
  {id:"IC-1077",from:"VN-MFG",to:"US-DIST",type:"製成品銷售",method:"TNMM 交易淨利",amt:"NT$ 91.5M",st:"已勾稽",cls:"g"}
];
var COMPARABLES=[
  {name:"可比公司 A（電子代工）",npm:3.8},
  {name:"可比公司 B（精密組裝）",npm:4.6},
  {name:"可比公司 C（EMS）",npm:5.1},
  {name:"可比公司 D（機電製造）",npm:5.9},
  {name:"可比公司 E（零件製造）",npm:6.4},
  {name:"可比公司 F（消費電子）",npm:7.2},
  {name:"可比公司 G（工業製造）",npm:8.1}
];
var ALERTS=[
  {sev:"r",t:"CN-MFG 營業淨利率 2.9% 低於常規區間下限 4.0%",who:"財務經理",tag:"偏離下限",time:"今日 09:12",act:"建議提列年度調整 NT$ 21.4M"},
  {sev:"r",t:"IC-1071 研發成本分攤缺少功能分析佐證文件",who:"會計專員",tag:"文據缺件",time:"今日 08:40",act:"補齊 CCA 分攤基礎與受益分析"},
  {sev:"a",t:"US-DIST 銷售毛利率接近常規區間上緣（第 74 百分位）",who:"財務經理",tag:"接近邊界",time:"昨日 17:20",act:"觀察季度趨勢，暫不調整"},
  {sev:"a",t:"NL-IP 權利金費率 4.5% 待與 CUP 樣本重新驗證",who:"會計專員",tag:"待驗證",time:"昨日 14:05",act:"更新可比授權合約樣本"},
  {sev:"g",t:"VN-MFG 加工利潤率 5.3% 落於常規區間內",who:"系統",tag:"符合常規",time:"昨日 11:30",act:"維持現行加成率"}
];
var DOCS=[
  {icon:"public",t:"集團主檔 Master File",d:"集團架構、無形資產與融資政策 · v3.2",st:"已核定",cls:"g"},
  {icon:"description",t:"當地檔 Local File（TW-HQ）",d:"受測交易、功能分析與比對結果",st:"編製中",cls:"a"},
  {icon:"description",t:"當地檔 Local File（CN-MFG）",d:"含年度調整說明附件",st:"待覆核",cls:"a"},
  {icon:"assessment",t:"國別報告 CbCR",d:"12 個管轄區收入/稅負/員工彙總",st:"已提交",cls:"g"},
  {icon:"gavel",t:"預先訂價協議 APA 追蹤",d:"台灣—美國雙邊 APA 申請進度",st:"審核中",cls:"b"}
];

/* ---------- nav ---------- */
function buildNav(){
  var n=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')">'+
       '<span class="idx">'+i+'</span>'+
       '<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="lbl">'+esc(MODS[i].name)+'</span></button>';
  }
  n.innerHTML=h;
}

/* ---------- screens ---------- */
function scr0(){
  var rows="";
  for(var i=0;i<ENTITIES.length;i++){
    var e=ENTITIES[i],rc=e.risk==="高"?"r":(e.risk==="中"?"a":"g");
    rows+='<div class="listitem'+(i===0?" sel":"")+'" onclick="selEntity('+i+')" id="ent'+i+'">'+
      '<div class="av">'+esc(e.code.split("-")[0])+'</div>'+
      '<div class="mn"><div class="t">'+esc(e.name)+'</div>'+
      '<div class="d">'+esc(e.role)+' · '+esc(e.cty)+'</div></div>'+
      '<div class="amt">'+e.tx+'<small>筆交易</small></div></div>';
  }
  return '<div class="split">'+
    '<div class="pane"><div class="pane-hd"><span class="material-symbols-outlined">account_tree</span>'+
      '<div><h2>集團實體</h2><div class="sub">點選檢視功能風險畫像</div></div></div>'+
      '<div>'+rows+'</div></div>'+
    '<div class="pane"><div class="pane-hd"><span class="material-symbols-outlined">hub</span>'+
      '<div><h2 id="e-name">實體功能風險畫像</h2><div class="sub" id="e-sub">受測方判定基礎</div></div>'+
      '<div class="spacer"></div><span class="chip g" id="e-risk">—</span></div>'+
      '<div class="pane-bd">'+

var RENDER=[scr0,scr1,scr2,scr3,scr4,scr5];
var INIT=[initScr0,initScr1,initScr2,initScr3,initScr4,initScr5];
var POST=[function(){selEntity(0);},null,null,null,function(){selAlert(0);},null];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  destroyCharts();
  var btns=document.querySelectorAll(".navbtn");
  for(var b=0;b<btns.length;b++){btns[b].className="navbtn"+(+btns[b].getAttribute("data-i")===i?" on":"");}
  var c=el("screen");
  c.innerHTML='<div class="screen">'+RENDER[i]()+'</div>';
  void c.offsetHeight;
  if(POST[i])POST[i]();
  if(INIT[i])INIT[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
