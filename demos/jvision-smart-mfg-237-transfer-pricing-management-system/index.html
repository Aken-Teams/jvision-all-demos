<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>移轉訂價管理系統（Transfer Pricing Management System）｜Jvision 系統 Demo</title>
<meta name="description" content="關係人交易彙整、訂價政策模擬到常規區間比對的移轉訂價一站式管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --amber:#FBBF24;
  --danger:#F87171;
  --info:#60A5FA;
  --panel:#0E1223;
  --soft:#151A2B;
  --shadow:0 18px 44px rgba(0,0,0,.34),0 0 0 1px rgba(255,255,255,.018);
  --glow:0 0 20px rgba(34,197,94,.14);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 10% -10%,rgba(34,197,94,.10),transparent 29rem),
    radial-gradient(circle at 93% 8%,rgba(59,130,246,.07),transparent 26rem),
    var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[onclick]{cursor:pointer}
.material-symbols-outlined{
  display:inline-block;vertical-align:middle;white-space:nowrap;
  font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;
  line-height:1;letter-spacing:normal;text-transform:none
}
:focus-visible{outline:2px solid var(--color-ring);outline-offset:3px}
.shell{width:min(1440px,100%);margin:auto;padding:0 24px 56px}
.topbar{
  position:relative;display:flex;align-items:center;gap:18px;
  min-height:92px;padding:18px 4px;border-bottom:1px solid rgba(51,65,85,.75)
}
.topbar:after{
  content:"";position:absolute;right:0;bottom:-1px;width:26%;height:1px;
  background:linear-gradient(90deg,transparent,var(--color-accent))
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{
  display:grid;place-items:center;flex:0 0 auto;width:46px;height:46px;
  border:1px solid rgba(74,222,128,.42);border-radius:13px;
  color:var(--color-accent);
  background:linear-gradient(145deg,#172033,#09100f);
  box-shadow:var(--glow),inset 0 1px rgba(255,255,255,.08)
}
.logo .material-symbols-outlined{font-size:25px;text-shadow:0 0 10px rgba(34,197,94,.65)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.03em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:11.5px;font-weight:400}
.badge{
  display:flex;align-items:center;gap:8px;margin-left:auto;padding:8px 13px;
  border:1px solid var(--line);border-radius:8px;background:rgba(14,18,35,.9);
  color:#CBD5E1;font-family:"Fira Code",monospace;font-size:11px;font-weight:500
}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
nav{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;
  padding:18px 0 20px
}
.navbtn{
  display:flex;align-items:center;gap:8px;min-height:48px;padding:10px 12px;
  border:1px solid var(--line);border-radius:9px;background:#0A0F1E;
  color:#AEBBD0;font-size:12px;font-weight:600;text-align:left;
  transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s
}
.navbtn:hover{border-color:#64748B;color:#FFF;transform:translateY(-1px)}
.navbtn.on{
  border-color:rgba(34,197,94,.75);background:linear-gradient(145deg,#17241E,#0C1713);
  color:#FFF;box-shadow:0 0 20px rgba(34,197,94,.11),inset 0 1px rgba(255,255,255,.05)
}
.navbtn .material-symbols-outlined{font-size:19px;color:var(--blue)}
.navbtn .idx{
  padding:2px 5px;border-radius:4px;background:var(--color-muted);color:var(--muted);
  font-family:"Fira Code",monospace;font-size:9px
}
.navbtn.on .idx{background:var(--blue);color:var(--color-on-accent)}
.screen{animation:screen-in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.pane,.card{
  min-width:0;border:1px solid var(--line);background:linear-gradient(155deg,#101527,var(--panel));
  box-shadow:var(--shadow)
}
.pane{border-radius:14px;overflow:hidden}
.card{border-radius:11px}
.pane-hd,.card .hd{
  display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);
  background:rgba(2,6,23,.33)
}
.pane-hd{min-height:62px;padding:13px 17px}
.card .hd{min-height:48px;padding:11px 14px}
.pane-hd>.material-symbols-outlined,.card .hd>.material-symbols-outlined{color:var(--blue);font-size:19px}
.pane-hd h2,.card .hd h3{margin:0;color:#F8FAFC;font-size:13.5px;font-weight:600;letter-spacing:.015em}
.card .hd h3{font-size:12.5px}
.pane-hd .sub{margin-top:2px;color:var(--muted);font-size:10.5px}
.spacer{margin-left:auto}
.pane-bd{padding:16px}
.card .bd{padding:14px}
.listitem{
  display:flex;gap:11px;min-width:0;padding:12px 17px;border-bottom:1px solid rgba(51,65,85,.72);
  transition:background-color .18s,box-shadow .18s
}
.listitem:last-child{border-bottom:0}
.listitem:hover{background:#151B2C}
.listitem.sel{background:linear-gradient(90deg,rgba(34,197,94,.12),rgba(34,197,94,.02));box-shadow:inset 3px 0 var(--blue)}
.listitem .av{
  display:grid;place-items:center;flex:0 0 auto;width:36px;height:36px;border:1px solid var(--line);
  border-radius:8px;background:#0A0F1E;color:#86EFAC;font-family:"Fira Code",monospace;
  font-size:11px;font-weight:700
}
.listitem .mn{min-width:0;flex:1}
.listitem .t{overflow:hidden;color:#E8EEF8;font-size:12.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.listitem .d{overflow:hidden;margin-top:3px;color:var(--muted);font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}
.listitem .amt{flex:0 0 auto;text-align:right;font-family:"Fira Code",monospace;font-size:11.5px;font-weight:600}
.listitem .amt small{display:block;margin-top:2px;color:var(--muted);font:10px "Fira Sans",sans-serif}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid transparent;
  border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap
}
.chip.g{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.11);color:#86EFAC}
.chip.g:before{content:"✓ "}
.chip.a{border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.1);color:#FDE68A}
.chip.a:before{content:"△ "}
.chip.r{border-color:rgba(248,113,113,.35);background:rgba(239,68,68,.11);color:#FCA5A5}
.chip.r:before{content:"! "}
.chip.b{border-color:rgba(96,165,250,.34);background:rgba(59,130,246,.11);color:#93C5FD}
.chip.b:before{content:"• "}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{
  min-width:0;padding:13px;border:1px solid var(--line);border-radius:10px;
  background:linear-gradient(145deg,#151A2B,#0B1020)
}
.kpi .k-t{display:flex;align-items:center;gap:5px;color:#A7B4C7;font-size:10.5px;font-weight:500}
.kpi .k-t .material-symbols-outlined{color:var(--blue);font-size:15px}
.kpi .k-v{
  margin-top:8px;color:#FFF;font-family:"Fira Code",monospace;font-size:22px;
  font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums
}
.kpi .k-v small{color:var(--muted);font-size:11px;letter-spacing:0}
.kpi .k-s{display:flex;align-items:center;gap:3px;margin-top:4px;font-size:10.5px;font-weight:500}
.kpi .k-s .material-symbols-outlined{font-size:13px}
.up{color:#86EFAC!important}.down{color:#FCA5A5!important}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.tbl th{
  padding:9px 10px;border-bottom:1px solid var(--line);background:#0A0F1E;color:#AAB7CA;
  font-size:10.5px;font-weight:500;letter-spacing:.035em;text-align:left;white-space:nowrap
}
.tbl td{padding:10px;border-bottom:1px solid rgba(51,65,85,.68);color:#DCE5F2;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#151A2B}
.tbl th:nth-child(5),.tbl td:nth-child(5),.mono{
  font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums
}
.tbl th:nth-child(5),.tbl td:nth-child(5){text-align:right}
.mono{font-weight:500}
.cwrap{position:relative;width:100%;overflow:hidden}
.bar{min-width:60px;height:5px;overflow:hidden;border-radius:5px;background:#253047}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#15803D,#4ADE80);box-shadow:0 0 8px rgba(34,197,94,.45)}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;
  border-bottom:1px dashed rgba(51,65,85,.75);color:#B7C3D4;font-size:11.5px
}
.stat-row:last-child{border-bottom:0}
.stat-row b{color:#F1F5F9;font-weight:600;text-align:right}
.pill{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:4px;background:#11182A;color:#AAB7CA;font-size:10px;font-weight:500}
.notice{
  display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid rgba(251,191,36,.35);
  border-radius:9px;background:rgba(251,191,36,.08);color:#FDE9A9;font-size:11.5px
}
.notice .material-symbols-outlined{flex:0 0 auto;color:var(--amber);font-size:18px}
.quart{position:relative;height:40px;margin:25px 0 28px;border:1px solid var(--line);border-radius:8px;background:#11172A}
.quart .rng{position:absolute;inset-block:0;background:rgba(34,197,94,.14);border-inline:1px dashed #4ADE80}
.quart .med{position:absolute;inset-block:0;width:2px;background:#86EFAC}
.quart .mk{
  position:absolute;top:50%;width:17px;height:17px;transform:translate(-50%,-50%);
  border:3px solid var(--amber);border-radius:50%;background:#0A0F1E;box-shadow:0 0 10px rgba(251,191,36,.4)
}
.quart .lbl{position:absolute;top:-20px;transform:translateX(-50%);color:var(--muted);font:9px "Fira Code",monospace;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:13px;color:var(--muted);font-size:10.5px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:middle}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:17px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{
  position:absolute;left:-24px;top:3px;width:14px;height:14px;border:3px solid var(--blue);
  border-radius:50%;background:#080D1B;box-shadow:0 0 8px rgba(34,197,94,.3)
}
.tl .ev.a .dot{border-color:var(--amber)}
.tl .ev.r .dot{border-color:var(--danger)}
.tl .et{color:#E6EDF7;font-size:11.5px;font-weight:600}
.tl .ed{margin-top:2px;color:var(--muted);font:10.5px "Fira Code",monospace}
.tl .ex{margin-top:3px;color:#86EFAC;font-size:10px;font-weight:500}
.foot{margin-top:24px;color:#718096;font:10px "Fira Code",monospace;text-align:center}
@media(max-width:1100px){
  nav{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:300px minmax(0,1fr)}
}
@media(max-width:860px){
  .shell{padding-inline:16px}
  .split{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
  .topbar{align-items:flex-start}
  .badge{margin-left:0}
  nav{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
}
@media(max-width:420px){
  .shell{padding-inline:12px}
  .topbar{flex-direction:column}
  .brand p{white-space:normal}
  nav{gap:6px}
  .navbtn{justify-content:center;padding:9px}
  .navbtn .lbl{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .k-v{font-size:19px}
  .pane-bd{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .screen{animation:none}
  .navbtn:hover{transform:none}
}
</style>
</head>

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
