<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品AI視覺缺陷檢測</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --ok:#15803D;
  --warn:#A34405;
  --bad:#DC2626;
  --info:#1D4ED8;
  --black:#0F172A;
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,[role=button],a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.mono,.kval,td:first-child,.tid,.cmcell,.pill,.live{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.icon{width:1.25rem;height:1.25rem;display:block;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:var(--black);color:#FFF;border-right:4px solid var(--black);display:flex;flex-direction:column}
.brand{padding:22px 18px;border-bottom:2px solid #64748B;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;background:var(--color-accent);color:#000;border:3px solid #FFF;display:grid;place-items:center;box-shadow:5px 5px 0 var(--color-primary)}
.logo .icon{width:25px;height:25px;stroke-width:2.5}
.brand h1{font-size:15px;line-height:1.25;margin:0;font-weight:700}
.brand p{font:11px "Fira Code",monospace;color:#CBD5E1;margin:4px 0 0}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.navlbl{font:600 10px "Fira Code",monospace;letter-spacing:.14em;color:#CBD5E1;padding:6px}
.navbtn{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:12px;border:2px solid transparent;background:transparent;color:#E2E8F0;border-radius:0;font-weight:700}
.navbtn:hover{background:#1E293B;border-color:#94A3B8}
.navbtn.active{background:var(--color-primary);border-color:#FFF;color:#FFF;box-shadow:5px 5px 0 var(--color-accent)}
.navbtn small{display:block;color:#CBD5E1;font:11px "Fira Code",monospace;margin-top:2px}
.navbtn.active small{color:#FFF}
.sidefoot{margin-top:auto;padding:16px 18px;border-top:2px solid #64748B;color:#CBD5E1;font:11px/1.7 "Fira Code",monospace}
.sidefoot b{color:#FFF}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.96);border-bottom:3px solid var(--black);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;backdrop-filter:blur(8px)}
.topbar h2{font-size:22px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.03em}
.topbar .sub{color:var(--muted);font:12px "Fira Code",monospace;margin-top:5px}
.spacer{flex:1}
.live,.pill{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--black);padding:7px 10px;font-size:11px;font-weight:700;background:#FFF}
.pill{background:var(--color-accent);color:#000;box-shadow:3px 3px 0 var(--black)}
.dot{width:9px;height:9px;background:var(--ok);border:2px solid var(--black)}
.content{padding:24px;max-width:1600px;margin:auto}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card,.kpi,.cam,.imgcell,.ticket,.col{border:2px solid var(--black);border-radius:0;background:var(--color-card)}
.card{padding:17px;box-shadow:6px 6px 0 var(--line)}
.card h3{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.card h3 .icon{color:var(--color-primary)}
.ch-sub{margin-bottom:14px;color:var(--muted);font:11px "Fira Code",monospace}
.kpi{padding:16px;position:relative;overflow:hidden;min-height:142px;box-shadow:6px 6px 0 var(--black)}
.kpi:nth-child(2n){transform:translateY(8px);box-shadow:6px 6px 0 var(--color-primary)}
.klbl{max-width:calc(100% - 45px);font-size:12px;color:var(--muted);font-weight:700}
.kval{font-size:29px;font-weight:700;letter-spacing:-.06em;margin-top:11px}
.kval span{font-size:12px;color:var(--muted);letter-spacing:0}
.kfoot{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:700}
.kfoot .icon{width:15px;height:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kicon{position:absolute;right:12px;top:12px;width:38px;height:38px;display:grid;place-items:center;background:var(--color-muted);border:2px solid var(--black)}
.kicon .icon{color:var(--color-primary)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;padding:10px;border:1px solid var(--black);background:var(--black);color:#FFF;font:600 10px "Fira Code",monospace;letter-spacing:.04em;white-space:nowrap}
td{padding:10px;border:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#DBEAFE}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;padding:3px 7px;font:700 10px "Fira Code",monospace;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;background:currentColor}
.t-ok{background:#DCFCE7;color:#166534}.t-ng{background:#FEE2E2;color:#991B1B}
.t-warn{background:#FFEDD5;color:#9A3412}.t-info{background:#DBEAFE;color:#1E40AF}
.t-mut{background:#E2E8F0;color:#334155}.t-pur{background:#DBEAFE;color:#1D4ED8}
.bar-mini{height:10px;background:#E2E8F0;border:1px solid var(--black);overflow:hidden;min-width:70px}
.bar-mini>i{display:block;height:100%;background:var(--color-primary)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{padding:11px;background:var(--color-muted);display:flex;flex-direction:column;gap:10px}
.colh{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px}
.cnt{background:#FFF;border:2px solid var(--black);padding:1px 7px;font:700 10px "Fira Code",monospace}
.ticket{padding:10px;border-left-width:7px}
.tid{font-size:10px;color:var(--muted);font-weight:700}
.tt{font-size:12px;font-weight:700;margin:4px 0 7px}
.tm{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.imgcell{overflow:hidden}
.thumb{height:120px;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--black)}
.thumb>.icon{width:46px;height:46px;color:#FFF}
.conf{position:absolute;top:7px;left:7px;color:#FFF;border:2px solid #FFF;padding:2px 6px;font:700 10px "Fira Code",monospace}
.bx{position:absolute;border:3px solid #FDE047}
.meta{padding:9px}
.mt{display:flex;justify-content:space-between;align-items:center;gap:5px;font:700 11px "Fira Code",monospace}
.ms{font-size:10px;color:var(--muted);margin-top:4px}
.cam{padding:13px;display:flex;flex-direction:column;gap:9px}
.camtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.camname{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.camname .icon{color:var(--color-primary)}
.camstat{border:1px solid currentColor;padding:2px 6px;font:700 10px "Fira Code",monospace}
.qrow{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.qrow b{color:var(--ink);font:700 12px "Fira Code",monospace;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:9px 15px;color:var(--muted);font-size:11px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border:1px solid var(--black)}
.hint{display:flex;align-items:flex-start;gap:9px;margin-top:16px;padding:12px;border:2px dashed var(--black);background:#FFF7ED;color:#7C2D12;font-size:12px}
.hint .icon{color:var(--color-accent)}
.seg{display:inline-flex;border:2px solid var(--black);background:var(--color-muted)}
.seg b{padding:6px 11px;font:700 11px "Fira Code",monospace;border-right:1px solid var(--black)}
.seg b:last-child{border-right:0}
.seg b.on{background:var(--color-primary);color:#FFF}
.avatar{width:29px;height:29px;display:grid;place-items:center;background:var(--color-primary);color:#FFF;border:2px solid var(--black);font-weight:700}
.metrline{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12px}
.mv{font:700 12px "Fira Code",monospace}
.tl{position:relative;padding-left:25px}
.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;border-left:3px solid var(--black)}
.tlitem{position:relative;padding:0 0 18px 8px}
.tlitem:before{content:"";position:absolute;left:-25px;top:3px;width:13px;height:13px;background:#FFF;border:3px solid var(--black)}
.tlitem.done:before{background:var(--ok)}.tlitem.run:before{background:var(--color-accent)}
.tlh{font-size:12px;font-weight:700}.tls{font:10px/1.5 "Fira Code",monospace;color:var(--muted)}
.cm{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px;min-width:440px;font:11px "Fira Code",monospace}
.cmh,.cmr{font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:7px}
.cmr{justify-content:flex-end}
.cmcell{padding:15px 4px;text-align:center;color:#FFF;border:1px solid var(--black);font-weight:700}
.alert{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.alert>.icon{margin-top:1px}.alert-main{flex:1}.alert-title{font-size:12px;font-weight:700}
.alert-sub,.alert-time{font-size:10px;color:var(--muted)}.alert-time{white-space:nowrap}
.qline{padding:9px 0;border-bottom:1px dashed var(--line)}
.qline-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.content>.grid>*,.content>.card,.content>.board>*{animation:enter .4s cubic-bezier(.34,1.56,.64,1) both}
.content>.grid>*:nth-child(2),.content>.board>*:nth-child(2){animation-delay:.06s}
.content>.grid>*:nth-child(3),.content>.board>*:nth-child(3){animation-delay:.12s}
.content>.grid>*:nth-child(4),.content>.board>*:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}.wall{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .app{display:block}.sidebar{position:static;width:100%;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}
  .navlbl,.sidefoot{display:none}.brand{padding:14px}.navbtn{justify-content:center}.topbar{position:sticky}
  .g3{grid-template-columns:repeat(2,1fr)}.g2,.g23,.g32{grid-template-columns:1fr}.wall{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .content{padding:15px}.topbar{padding:12px 14px}.topbar .live{display:none}
  .nav{grid-template-columns:repeat(6,1fr);gap:4px;padding:8px}.navbtn{padding:10px 6px}.navbtn .nt{display:none}
  .g4,.g3,.board{grid-template-columns:1fr}.wall{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(2n){transform:none}.card{padding:13px}.pill{font-size:9px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="logo" data-icon="scan"></div>
    <div><h1>產品AI視覺缺陷檢測</h1><p>QUALITY INSPECTION / AOI</p></div>
  </div>
  <nav class="nav" id="nav"><div class="navlbl">INSPECTION MODULES</div></nav>
  <div class="sidefoot">產線 <b>SMT-L3</b> · 班別 <b>白班</b><br>純 UI 展示 · 擬真資料</div>
</aside>
<main class="main">
  <header class="topbar">
    <div><h2 id="pgTitle">檢測總覽</h2><div class="sub" id="pgSub">戰情看板</div></div>
    <div class="spacer"></div>
    <span class="live"><span class="dot"></span>運行中 · 模型 v3.4</span>
    <span class="pill"><span data-icon="cpu"></span>AI 即時判讀</span>
  </header>
  <div class="content" id="screen"></div>
</main>
</div>
<script>
(function(){
"use strict";
var ICONS={
scan:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5M7 12h10M12 7v10"/></svg>',
dashboard:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
camera:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg>',
grid:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>',
check:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/><rect x="3" y="3" width="18" height="18"/></svg>',
train:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>',
chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
cpu:'<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/><path d="M9 9h6v6H9M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M18 9h4M2 15h4M18 15h4"/></svg>',
image:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 3-3 6 5"/></svg>',
shield:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3 9-8 11-5-2-8-6-8-11V5z"/><path d="M8 12l3 3 5-6"/></svg>',
alert:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3L2 21h20zM12 9v5M12 18h.01"/></svg>',
clock:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>',
trend:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9M15 6h6v6"/></svg>',
down:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 9M15 18h6v-6"/></svg>',
flat:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M17 8l4 4-4 4"/></svg>',
layers:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3L2 8l10 5 10-5zM2 12l10 5 10-5M2 16l10 5 10-5"/></svg>',
user:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.cpu}
function hydrate(root){
  (root||document).querySelectorAll("[data-icon]").forEach(function(el){
    el.innerHTML=icon(el.getAttribute("data-icon"));
  });
}
var NAV=[
 {i:"dashboard",t:"檢測總覽",s:"戰情看板"},
 {i:"camera",t:"影像擷取站",s:"取像佇列"},
 {i:"grid",t:"缺陷判讀牆",s:"AI 標註"},
 {i:"check",t:"人工複判",s:"誤判複判"},
 {i:"train",t:"模型訓練",s:"再訓練排程"},
 {i:"chart",t:"缺陷分析",s:"帕累托 / 矩陣"}
];
var nav=document.getElementById("nav");
NAV.forEach(function(n,i){
  var b=document.createElement("button");
  b.type="button";b.className="navbtn";b.dataset.i=i;
  b.innerHTML=icon(n.i)+'<span class="nt">'+n.t+"<small>"+n.s+"</small></span>";
  b.addEventListener("click",function(){location.hash="v"+i});
  nav.appendChild(b);
});
var charts=[];
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
  var el=document.getElementById(id);if(!el)return;
  opt.chart=opt.chart||{};opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};
  opt.chart.fontFamily='"Fira Sans",sans-serif';opt.chart.foreColor="#475569";
  opt.grid=opt.grid||{};opt.grid.borderColor="#CBD5E1";
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}
}
function n2(v){return Number(v||0).toLocaleString("zh-Hant")}
function kpi(l,ic,v,u,f,dir,note){
 return '<div class="kpi"><div class="kicon">'+icon(ic)+'</div><div class="klbl">'+l+'</div><div class="kval">'+v+' <span>'+u+'</span></div><div class="kfoot '+dir+'">'+icon(dir==="up"?"trend":dir==="down"?"down":"flat")+'<span>'+f+" · "+note+"</span></div></div>"
}
function stRow(st,m,c,y,load,cls,sv){
 var tag=cls==="ok"?"t-ok":cls==="warn"?"t-warn":"t-mut";
 return "<tr><td><b>"+st+"</b></td><td>"+m+"</td><td>"+c+"</td><td>"+y+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar-mini" style="width:80px"><i style="width:'+load+'%"></i></div><span class="mono">'+load+'%</span></div></td><td><span class="tag '+tag+'">'+sv+"</span></td></tr>"
}
function alertRow(cls,t,d,tm){
 var color=cls==="bad"?"#DC2626":cls==="warn"?"#A34405":"#1D4ED8";
 return '<div class="alert"><span style="color:'+color+'">'+icon("alert")+'</span><div class="alert-main"><div class="alert-title">'+t+'</div><div class="alert-sub">'+d+'</div></div><div class="alert-time">'+tm+"</div></div>"
}
function v0(){
 return '<div class="grid g4">'+
 kpi("今日檢測片數","image","24,860","片","+8.2%","up","vs 昨日")+
 kpi("AI 直通良率","shield","96.4","%","+0.7pt","up","含複判修正")+
 kpi("誤判率 (誤殺)","alert","1.8","%","-0.9pt","up","較上週改善")+
 kpi("待複判佇列","clock","132","張","+21","down","需人工確認")+"</div>"+
