<head>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFFFFF;--color-secondary:#3B82F6;--color-on-secondary:#000000;
--color-accent:#EA580C;--color-on-accent:#000000;--color-background:#F8FAFC;--color-foreground:#1E293B;
--color-card:#FFFFFF;--color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
--accent:#2563EB;--accent2:#3B82F6;--bg:#F8FAFC;--card:#FFFFFF;--mut:#475569;
--ok:#047857;--warn:#9A3412;--bad:#DC2626;--mat:#2563EB;--lab:#0891B2;--ovh:#7C3AED;--amt:#047857;
--shadow:0 12px 30px rgba(15,23,42,.07);--shadow-hover:0 18px 38px rgba(15,23,42,.11)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button,input{font:inherit}
button,.chip,.node,input[type=range]{cursor:pointer}
button:focus-visible,.chip:focus-visible,.node:focus-visible,input:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;min-height:72px;padding:12px max(20px,calc((100vw - 1360px)/2));background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.top>*{min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:240px}
.logo{display:grid;place-items:center;width:42px;height:42px;flex:none;background:var(--blue);border-radius:8px;color:#fff;font-family:"Fira Code",monospace;font-size:18px;font-weight:700;box-shadow:4px 4px 0 #BFDBFE}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.brand span{display:block;margin-top:1px;color:var(--blue);font-family:"Fira Code",monospace;font-size:9px;font-weight:600;letter-spacing:.13em}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:7px;flex:none;min-height:42px;padding:9px 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{background:var(--color-muted);color:var(--blue)}
.nav button.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 16px rgba(37,99,235,.22)}
.nav button:active{transform:translateY(1px)}
.nav button .material-symbols-outlined{font-size:18px}
.wrap{width:min(1360px,100%);margin:auto;padding:30px 28px 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;padding-bottom:19px;border-bottom:1px solid var(--line)}
.vh h2{margin:0;font-size:clamp(23px,2.2vw,31px);font-weight:700;letter-spacing:-.025em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;color:#1D4ED8;font-family:"Fira Code",monospace;font-size:11px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border:2px solid #fff;border-radius:50%;background:#047857;box-shadow:0 0 0 1px #047857;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{position:relative;overflow:hidden;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 15px rgba(15,23,42,.035);transition:border-color .22s,box-shadow .22s,transform .22s}
.kpi::before{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--blue);content:""}
.kpi:hover{border-color:#BFDBFE;box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{margin-top:4px;color:var(--ink);font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em}
.kpi .d{margin-top:3px;font-size:11px;font-weight:600}
.kpi .ic{position:absolute;top:14px;right:14px;padding:7px;background:#EFF6FF;border-radius:6px;color:var(--blue)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}.g11{grid-template-columns:1fr 1fr}.split{grid-template-columns:410px 1fr}
.card{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 5px 18px rgba(15,23,42,.04);transition:border-color .22s,box-shadow .22s}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow)}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;color:var(--ink);font-size:14px;font-weight:700}
.card h3 .material-symbols-outlined{display:grid;place-items:center;width:29px;height:29px;background:#EFF6FF;border-radius:6px;color:var(--blue);font-size:18px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:4px;font-size:10.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.tag::before{font-family:"Material Symbols Outlined";font-size:13px;font-weight:500}
.t-ok{background:#ECFDF5;color:#047857}.t-ok::before{content:"check_circle"}
.t-warn{background:#FFF7ED;color:#9A3412}.t-warn::before{content:"warning"}
.t-bad{background:#FEF2F2;color:#B91C1C}.t-bad::before{content:"error"}
.t-info{background:#EFF6FF;color:#1D4ED8}.t-info::before{content:"info"}
.t-mut{background:#F1F5F9;color:#475569}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:#F1F5F9;color:#334155;font-size:11.5px;font-weight:700;letter-spacing:.015em}
table.data tr:hover td{background:#F8FAFC}
table.data td.num,table.data th.num{text-align:right}
table.data td.num,table.data th.num,table.data td:first-child{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.chart{width:100%;height:250px;overflow:hidden}
.scroll{overflow-x:auto;border-radius:6px}
.leg{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:9px;color:var(--muted);font-size:11.5px}
.leg span{display:flex;align-items:center;gap:6px}
.leg em{display:inline-block;width:9px;height:9px;border-radius:2px;font-style:normal}
.tree{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.node{display:flex;align-items:center;gap:8px;min-height:39px;padding:8px 9px;border:1px solid transparent;border-radius:6px;transition:background .2s,border-color .2s}
.node:hover{background:#F1F5F9}
.node.sel{background:#EFF6FF;border-color:#93C5FD;box-shadow:inset 3px 0 var(--blue)}
.node .tw{width:16px;flex:none;color:var(--muted);font-size:16px;text-align:center}
.node .code{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cost{flex:none;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.node .lv{width:7px;height:7px;flex:none;border-radius:2px}
.detail-hd{display:flex;align-items:center;gap:12px;margin-bottom:15px;padding:14px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:7px}
.detail-hd .bg{display:grid;place-items:center;width:43px;height:43px;flex:none;background:#fff;border:1px solid #BFDBFE;border-radius:6px}
.detail-hd .bg .material-symbols-outlined{color:var(--blue);font-size:23px}
.detail-hd b{display:block;font-size:15px}
.detail-hd small{color:#475569;font-family:"Fira Code",monospace;font-size:11px}
.detail-hd .big{margin-left:auto;text-align:right}
.detail-hd .big b{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:21px}
.cbar{display:flex;height:11px;overflow:hidden;margin:5px 0 15px;border-radius:3px;background:#F1F5F9}
.cbar i{display:block;height:100%}
.pline{display:flex;flex-direction:column;gap:10px}
.pstep{position:relative;display:flex;align-items:stretch;gap:12px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:7px;transition:border-color .2s,box-shadow .2s,transform .2s}
.pstep:hover{border-color:#93C5FD;box-shadow:0 8px 20px rgba(37,99,235,.08);transform:translateX(2px)}
.pstep .idx{display:grid;place-items:center;width:34px;height:34px;flex:none;background:var(--blue);border-radius:5px;color:#fff;font-family:"Fira Code",monospace;font-weight:700}
.pstep .pm{flex:1;min-width:0}
.pstep .pm b{font-size:13.5px}
.pstep .pmeta{display:flex;gap:13px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:11.5px}
.pstep .pmeta b{color:var(--ink);font-family:"Fira Code",monospace;font-weight:600}
.pstep .pcost{align-self:center;flex:none;text-align:right}
.pstep .pcost b{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:16px;font-weight:700}
.pstep .pcost small{display:block;color:var(--muted);font-size:10.5px}
.pbar{height:5px;overflow:hidden;margin-top:8px;background:#E2E8F0;border-radius:2px}
.pbar i{display:block;height:100%;background:var(--blue)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.qgrid>*{min-width:0}
.qc{position:relative;padding:15px;background:#fff;border:1px solid var(--line);border-radius:7px;transition:border-color .2s,box-shadow .2s,transform .2s}
.qc:hover{border-color:#93C5FD;box-shadow:var(--shadow);transform:translateY(-2px)}
.qc.best{border:2px solid var(--blue);background:#F8FBFF}
.qc .badge{position:absolute;top:-11px;right:11px;padding:3px 8px;background:var(--blue);border-radius:4px;color:#fff;font-size:10px;font-weight:700}
.qc .badge::before{margin-right:3px;font-family:"Material Symbols Outlined";content:"verified"}
.qc>b{font-size:13.5px}
.qc .pr{margin:8px 0 3px;font-family:"Fira Code",monospace;font-size:24px;font-weight:700}
.qc .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px}
.qc .row b{color:var(--ink);font-family:"Fira Code",monospace}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:22px}.sim>*{min-width:0}
.ctrl{display:flex;flex-direction:column;gap:18px}
.slb{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12.5px;font-weight:600}
.slb span{color:#1D4ED8;font-family:"Fira Code",monospace;font-weight:700}
input[type=range]{width:100%;accent-color:var(--blue)}
.simout{padding:20px;background:#F1F5F9;border:1px solid var(--line);border-radius:7px}
.simout .big{font-family:"Fira Code",monospace;font-size:34px;font-weight:700;letter-spacing:-.04em}
.simrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.simrow:last-child{border:0}.simrow b{font-family:"Fira Code",monospace}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:7px 12px;background:#fff;border:1px solid #CBD5E1;border-radius:5px;font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .2s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on::before{font-family:"Material Symbols Outlined";font-size:16px;content:"check"}
.chip:active{transform:translateY(1px)}
.mini{margin-top:2px;color:var(--muted);font-size:11px}
.ver{position:relative;display:flex;flex-direction:column;gap:2px;padding-left:6px}
.ver::before{position:absolute;top:7px;bottom:16px;left:11px;width:2px;background:var(--line);content:""}
.vi{position:relative;display:flex;gap:12px;align-items:flex-start;padding:0 0 17px 24px}
.vi::before{position:absolute;top:3px;left:0;width:12px;height:12px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px var(--blue);content:""}
.vi.old::before{background:#64748B;box-shadow:0 0 0 1px #64748B}
.vi.ok::before{background:#047857;box-shadow:0 0 0 1px #047857}
.vi b{font-family:"Fira Code",monospace;font-size:13px;font-weight:700}
.vi .who{color:var(--muted);font-family:"Fira Code",monospace;font-size:11px}
.vi .msg{margin-top:4px;padding:9px 11px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.vi .amt{font-family:"Fira Code",monospace;font-size:13px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.gap-hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:17px;padding:15px 17px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px}
.gap-hd .lbl{color:#475569;font-size:11.5px}
.gap-hd .num{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:19px;font-weight:700}
.gap-hd .sep{width:1px;align-self:stretch;background:#BFDBFE}
.info-box{margin-top:11px;padding:10px 12px;background:#F1F5F9;border-left:3px solid var(--blue);border-radius:4px;color:var(--muted);font-size:12px}
@media(max-width:1024px){.top{padding-inline:18px}.wrap{padding:24px 20px 42px}.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:360px 1fr}}
@media(max-width:820px){.top{align-items:flex-start;gap:10px;flex-wrap:wrap}.brand{min-width:0}.nav{width:100%;margin:0}.g2,.g11,.split,.sim,.two,.qgrid{grid-template-columns:1fr}.vh{align-items:flex-start}.gap-hd .sep{display:none}}
@media(max-width:560px){.wrap{padding:20px 14px 36px}.top{padding:10px 14px}.brand span{display:none}.nav{flex-wrap:nowrap}.nav button{padding:9px 10px}.nav button span:not(.material-symbols-outlined){display:none}.kpis{grid-template-columns:1fr}.vh{display:block}.pill{margin-top:13px;white-space:normal}.card{padding:14px}.pstep{gap:9px}.pstep .pcost{width:70px}.detail-hd{align-items:flex-start;flex-wrap:wrap}.detail-hd .big{width:100%;margin-left:55px;text-align:left}.qgrid{gap:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.kpi:hover,.qc:hover,.pstep:hover{transform:none}}
</style>
</head>

const SCREENS=[
