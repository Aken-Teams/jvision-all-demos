<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Should-cost 成本分析系統 · Should-Cost Analytics</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#b45309;--accent2:#f59e0b;--ink:#1f1608;--bg:#faf6ef;--card:#fff;--line:#ece1cd;--mut:#8b7a5d;--ok:#059669;--warn:#d97706;--bad:#dc2626;--mat:#b45309;--lab:#0284c7;--ovh:#7c3aed;--amt:#0d9488}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top>*{min-width:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(180,83,9,.32);font-family:"Noto Sans TC"}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
.nav button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#fbf1de;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(180,83,9,.3)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:#fef3c7;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.split{grid-template-columns:410px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#f1ece2;color:#8a7a5f}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fbf6ec}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.chart{height:250px;width:100%;overflow:hidden}
.scroll{overflow-x:auto}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.leg span{display:flex;align-items:center;gap:5px}
.leg em{width:10px;height:10px;border-radius:3px;font-style:normal;display:inline-block}
/* cost model tree */
.tree{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.node{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.node:hover{background:#fbf1de}
.node.sel{background:#fef3c7;border-color:#f4d089}
.node .tw{color:var(--mut);width:16px;text-align:center;flex:none;font-size:16px}
.node .code{font-family:Inter;font-weight:700;font-size:11.5px;color:var(--accent)}
.node .nm{font-family:"Noto Sans TC";flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .cost{font-family:Inter;font-weight:800;font-size:12px;flex:none}
.node .lv{width:6px;height:6px;border-radius:50%;flex:none}
.detail-hd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#fef3c7,#fde68a);margin-bottom:14px}
.detail-hd .bg{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(180,83,9,.2)}
.detail-hd .bg .material-symbols-outlined{color:var(--accent);font-size:24px}
.detail-hd b{font-family:"Noto Sans TC";font-size:15px;display:block}
.detail-hd small{color:#a06a12;font-size:11.5px}
.detail-hd .big{margin-left:auto;text-align:right}
.detail-hd .big b{font-family:Inter;font-size:22px;color:#92610d}
.detail-hd .big small{color:#a06a12}
.cbar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:4px 0 14px}
.cbar i{display:block;height:100%}
/* process steps signature */
.pline{display:flex;flex-direction:column;gap:10px}
.pstep{display:flex;align-items:stretch;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px 13px;position:relative;background:#fff}
.pstep .idx{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-family:Inter}
.pstep .pm{flex:1;min-width:0}
.pstep .pm b{font-family:"Noto Sans TC";font-size:13.5px}
.pstep .pmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--mut)}
.pstep .pmeta b{font-family:Inter;color:var(--ink);font-weight:800}
.pstep .pcost{text-align:right;flex:none;align-self:center}
.pstep .pcost b{font-family:Inter;font-weight:800;font-size:16px;color:var(--accent)}
.pstep .pcost small{color:var(--mut);font-size:10.5px;display:block}
.pbar{height:6px;border-radius:5px;background:#f5ecda;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* quote compare */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qgrid>*{min-width:0}
.qc{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.qc.best{border-color:var(--accent2);box-shadow:0 8px 20px rgba(180,83,9,.14)}
.qc .badge{position:absolute;top:-9px;right:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.qc b{font-family:"Noto Sans TC";font-size:13.5px}
.qc .pr{font-family:Inter;font-weight:800;font-size:24px;margin:8px 0 2px}
.qc .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);padding:5px 0;border-top:1px dashed var(--line)}
/* sim */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sim>*{min-width:0}
.ctrl{display:flex;flex-direction:column;gap:16px}
.slb{display:flex;justify-content:space-between;font-size:12.5px;font-family:"Noto Sans TC";font-weight:700;margin-bottom:7px}
.slb span{color:var(--accent);font-family:Inter;font-weight:800}
input[type=range]{width:100%;accent-color:var(--accent)}
.simout{background:#fbf6ec;border:1px solid var(--line);border-radius:14px;padding:18px}
.simout .big{font-family:Inter;font-weight:800;font-size:34px}
.simrow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.simrow:last-child{border:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fbf1de;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;font-family:"Noto Sans TC";cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini{font-size:11px;color:var(--mut);margin-top:2px}
/* negotiation timeline */
.ver{display:flex;flex-direction:column;gap:2px;position:relative;padding-left:6px}
.ver::before{content:"";position:absolute;left:11px;top:6px;bottom:16px;width:2px;background:var(--line)}
.vi{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative;padding-left:24px}
.vi::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.vi.old::before{background:var(--mut)}
.vi.ok::before{background:var(--ok)}
.vi b{font-family:Inter;font-weight:800;font-size:13.5px}
.vi .who{color:var(--mut);font-size:11.5px}
.vi .msg{font-family:"Noto Sans TC";font-size:12.5px;margin-top:3px;background:#fbf6ec;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.vi .amt{font-family:Inter;font-weight:800;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.gap-hd{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;background:linear-gradient(135deg,#fef3c7,#fde68a);margin-bottom:16px;flex-wrap:wrap}
.gap-hd .lbl{font-size:11.5px;color:#a06a12}
.gap-hd .num{font-family:Inter;font-weight:800;font-size:20px;color:#92610d}
.gap-hd .sep{width:1px;align-self:stretch;background:rgba(146,97,13,.25)}
@media(max-width:900px){.wrap{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g11,.split,.sim,.two,.qgrid{grid-template-columns:1fr}}
@media(max-width:560px){.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px 10px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">成</div><div><b>Should-cost 成本分析</b><span>SHOULD-COST ANALYTICS</span></div></div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><i></i><span>應然成本模型 v2.4 已核定</span></div></div>
  <div id="view"></div>
</div>
<script>
const MOD=[
["成本戰情","insights","成本戰情總覽","應然成本、報價落差與降本機會一覽"],
["成本模型","account_tree","成本模型建置","料/工/費多層成本結構拆解"],
["製程工時","precision_manufacturing","製程工時推算","工序節拍、機時費率與良率損耗"],
["報價比對","request_quote","報價合理性比對","供應商報價對比應然成本落差"],
["情境模擬","trending_up","議價情境模擬","原物料/匯率/量產目標價試算"],
["議價紀錄","gavel","議價談判紀錄","談判回合、讓步與節省金額追蹤"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const NT=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const N0=v=>v.toLocaleString('en-US',{maximumFractionDigits:0});

// Cost model for target part: 精密齒輪箱殼體 CNC 加工件
// [level,code,name,qty,unit,cost,cat]  cat: m材料 l工時 o費用 asm群組
const MODEL=[
[0,"GB-CASE-07","精密齒輪箱殼體 (應然成本)",1,"件",348.20,"asm"],
[1,"MAT","材料成本",1,"式",112.40,"asm"],
[2,"RAW-AL6061","AL6061-T6 鋁棒料 φ120",2.85,"kg",78.60,"m"],
[2,"SCRAP","切屑回收抵扣",1,"式",-9.20,"m"],
[2,"COAT-ANO","陽極硬質氧化處理",1,"件",43.00,"m"],
[1,"MC","機加工成本",1,"式",156.80,"asm"],
[2,"OP-ROUGH","粗車工序 (CNC 車床)",1,"工",38.50,"l"],
[2,"OP-CNC5","五軸 CNC 銑削工序",1,"工",82.30,"l"],
[2,"OP-DRILL","鑽孔攻牙工序",1,"工",21.60,"l"],
[2,"OP-DEBUR","去毛邊清洗",1,"工",14.40,"l"],
[1,"QC","品檢與治具",1,"式",34.60,"asm"],
[2,"OP-CMM","三次元量測 CMM",1,"工",22.80,"l"],
[2,"FIXTURE","專用治具攤提",1,"式",11.80,"o"],
[1,"OVH","製造費用與利潤",1,"式",44.40,"asm"],
[2,"OVH-FACTORY","廠務管銷攤提",1,"式",26.10,"o"],
[2,"PROFIT","合理利潤 (8%)",1,"式",18.30,"o"]];
const CATC={m:"var(--mat)",l:"var(--lab)",o:"var(--ovh)",asm:"var(--accent)"};
const CATN={m:"材料",l:"工時",o:"費用",asm:"群組"};

// process steps [name,machine,cycle(min),rate($/hr),yield%,cost]
const PROC=[
["粗車成型","CNC 車床 CK6150",6.5,340,99.2,38.50],
["五軸銑削","五軸加工中心 DMU50",13.8,540,97.5,82.30],
["鑽孔攻牙","立式加工中心 V850",3.9,320,99.0,21.60],
["去毛邊清洗","超音波清洗機",2.6,240,99.8,14.40],
["三次元量測","CMM Zeiss Contura",4.2,420,99.9,22.80]];

const SCREENS=[
// 0 成本戰情總覽 (推算應然成本 v0)
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">payments</span><div class="l">單件應然成本</div><div class="v">$348<small style="font-size:12px">.20</small></div><div class="d up">▼ 較供應商報價 12.3%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">request_quote</span><div class="l">供應商報價</div><div class="v">$391<small style="font-size:12px">.00</small></div><div class="d dn">▲ 高於應然 $42.80</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">savings</span><div class="l">年度潛在降本</div><div class="v">$1.03<small style="font-size:12px">M</small></div><div class="d" style="color:var(--mut)">年用量 24,000 件</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">rule</span><div class="l">超標待議件</div><div class="v" style="color:var(--bad)">5</div><div class="d" style="color:var(--mut)">3 材料 · 2 工時</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>應然成本結構占比</h3><div class="chart" id="c_ov"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>應然成本 vs 供應商報價落差</h3>${
   [["OP-CNC5 五軸銑削",82.3,98.4,"+19.6%"],["RAW-AL6061 鋁棒料",78.6,86.2,"+9.7%"],["COAT-ANO 陽極處理",43.0,48.5,"+12.8%"],["OP-ROUGH 粗車工序",38.5,40.1,"+4.2%"],["OVH 管銷攤提",26.1,31.4,"+20.3%"]]
   .map(h=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">${h[0]}</b><span style="color:var(--bad);font-weight:800;font-family:Inter">${h[3]}</span></div><div style="height:9px;background:#f5ecda;border-radius:6px;overflow:hidden;position:relative"><i style="position:absolute;left:0;top:0;height:100%;width:${(h[1]/h[2]*100).toFixed(1)}%;background:linear-gradient(90deg,var(--accent2),var(--accent))"></i></div></div>`).join('')}
   <div style="margin-top:12px;padding:10px 12px;background:#fbf6ec;border-radius:10px;font-size:12px;color:var(--mut)"><span class="material-symbols-outlined" style="color:var(--accent);font-size:16px">bolt</span> 填色比例=應然成本佔報價，缺口即議價空間。五軸銑削與管銷攤提落差最大，優先議價。</div></div>
</div>
<div class="grid g11" style="margin-top:16px">
 <div class="card"><h3><span class="material-symbols-outlined">timeline</span>近六期應然成本走勢</h3><div class="chart" id="c_trend" style="height:220px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">fact_check</span>模型準確度校驗</h3>
  <div style="display:flex;gap:12px;margin-bottom:12px">
   <div style="flex:1;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center"><div style="font-size:11.5px;color:var(--mut)">模型準確度</div><div style="font-family:Inter;font-weight:800;font-size:22px;color:var(--ok)">94.6%</div></div>
   <div style="flex:1;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center"><div style="font-size:11.5px;color:var(--mut)">已建模零件</div><div style="font-family:Inter;font-weight:800;font-size:22px">186</div></div>
   <div style="flex:1;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center"><div style="font-size:11.5px;color:var(--mut)">本月議省</div><div style="font-family:Inter;font-weight:800;font-size:22px;color:var(--accent)">$286K</div></div>
  </div>
  <div class="scroll"><table class="data"><tr><th>零件</th><th class="num">應然成本</th><th class="num">實際成交</th><th class="num">誤差</th></tr>${
   [["GB-CASE-07",348.2,352.0,"1.1%"],["BR-FLANGE-12",128.6,124.3,"3.4%"],["SH-SHAFT-04",96.4,98.8,"2.5%"],["MT-BRKT-09",64.2,66.0,"2.8%"],["CV-PLATE-03",212.5,204.9,"3.7%"]]
   .map(r=>`<tr><td><b>${r[0]}</b></td><td class="num">$${NT(r[1])}</td><td class="num">$${NT(r[2])}</td><td class="num" style="color:var(--ok);font-weight:800">${r[3]}</td></tr>`).join('')}</table></div></div>
</div>`,

// 1 成本模型建置 — SIGNATURE tree split (v1)
()=>`<div class="grid split">
 <div class="card"><h3><span class="material-symbols-outlined">account_tree</span>應然成本模型 <span class="tag t-mut" style="margin-left:auto">GB-CASE-07</span></h3>
  <div class="leg"><span><em style="background:var(--mat)"></em>材料</span><span><em style="background:var(--lab)"></em>工時</span><span><em style="background:var(--ovh)"></em>費用</span><span><em style="background:var(--accent)"></em>群組</span></div>
  <div class="tree" id="tree"></div></div>
 <div class="card" id="mdlDetail"></div>
</div>`,

// 2 製程工時推算 — SIGNATURE process line (v2)

function mdlSel(idx){
 document.querySelectorAll('#tree .node').forEach(n=>n.classList.toggle('sel',+n.dataset.idx===idx));

 for(let i=idx+1;i<MODEL.length;i++){if(MODEL[i][0]<=b[0])break;desc.push(MODEL[i]);if(MODEL[i][0]===b[0]+1)kids.push(MODEL[i]);}
