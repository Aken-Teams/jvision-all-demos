<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>碳費情境模擬器</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#334155; --accent2:#64748b;
  --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0;
  --text:#1e293b; --muted:#64748b; --soft:#94a3b8;
  --ok:#059669; --warn:#d97706; --bad:#dc2626;
  --chip:#f1f5f9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.layout{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:6px;min-width:0;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;min-width:0;}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand .txt{min-width:0;}
.brand .txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px;}
.brand .txt span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.navlbl{font-size:11px;color:var(--soft);padding:8px 10px 4px;letter-spacing:1px;font-weight:600;}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;min-width:0;}
.navbtn .material-symbols-outlined{font-size:21px;flex:none;}
.navbtn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .idx{margin-left:auto;font-size:11px;color:var(--soft);font-weight:600;}
.navbtn:hover{background:var(--chip);color:var(--text);}
.navbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.navbtn.on .idx{color:rgba(255,255,255,.7);}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);}
.side-foot .u{display:flex;align-items:center;gap:10px;min-width:0;}
.side-foot .av{width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
.side-foot .u b{font-size:12.5px;display:block;}
.side-foot .u span{font-size:11px;color:var(--muted);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;}
.topbar .ttl{min-width:0;}
.topbar .ttl h1{font-size:18px;margin:0;font-weight:700;}
.topbar .ttl p{font-size:12.5px;color:var(--muted);margin:3px 0 0;}
.topbar .sp{margin-left:auto;}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--chip);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap;}
.tag .material-symbols-outlined{font-size:16px;}
.wrap{padding:24px 26px 48px;min-width:0;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.5fr 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 14px;}
.sechd{display:flex;align-items:flex-end;gap:10px;margin:2px 0 16px;flex-wrap:wrap;}
.sechd h2{margin:0;font-size:16px;font-weight:700;}
.sechd p{margin:0;font-size:12.5px;color:var(--muted);}
.sechd .rt{margin-left:auto;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
.kpi .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lb .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .vl{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.5px;}
.kpi .vl small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .dl{font-size:11.5px;margin-top:6px;display:inline-flex;align-items:center;gap:3px;font-weight:600;}
.kpi .dl.up{color:var(--bad);} .kpi .dl.dn{color:var(--ok);} .kpi .dl.nu{color:var(--muted);}
.kpi .dl .material-symbols-outlined{font-size:15px;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8fafc;}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.pill.s1{background:#dcfce7;color:#15803d;}
.pill.s2{background:#fef3c7;color:#b45309;}
.pill.s3{background:#fee2e2;color:#b91c1c;}
.pill.s4{background:#e0e7ff;color:#4338ca;}
.pill.s5{background:#f1f5f9;color:#475569;}
.scope-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:2px;}
.bar-cell{position:relative;background:#eef2f7;border-radius:6px;height:8px;width:100px;overflow:hidden;display:inline-block;vertical-align:middle;}
.bar-cell i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;min-width:0;}
.scen{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;min-width:0;display:flex;flex-direction:column;}
.scen .top{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-width:0;}
.scen .top .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;}
.scen .top .ic .material-symbols-outlined{font-size:20px;}
.scen .top b{font-size:14px;display:block;}
.scen .top span{font-size:11px;color:var(--muted);}
.scen .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0;}
.scen .row{display:flex;justify-content:space-between;font-size:12.5px;align-items:center;gap:8px;}
.scen .row span{color:var(--muted);}
.scen .row b{font-variant-numeric:tabular-nums;}
.scen .ft{padding:12px 16px;background:#f8fafc;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.scen .ft .big{font-size:19px;font-weight:700;letter-spacing:-.5px;}
.slider{height:6px;border-radius:4px;background:#e2e8f0;position:relative;margin-top:2px;}
.slider i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.slider b{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent);transform:translateX(-7px);}
.mtx-wrap{overflow-x:auto;}
.mtx{width:100%;border-collapse:separate;border-spacing:0;min-width:560px;font-size:13px;}
.mtx th,.mtx td{padding:12px 14px;text-align:center;border-bottom:1px solid var(--line);}
.mtx th{background:#f8fafc;font-size:12px;color:var(--muted);}
.mtx td:first-child,.mtx th:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:var(--panel);}
.mtx th:first-child{background:#f8fafc;}
.mtx .best{background:#ecfdf5;}
.mtx .win{color:var(--ok);font-weight:700;}
.tl{position:relative;}
.roi-card{background:linear-gradient(135deg,var(--accent),#475569);color:#fff;border:none;}
.roi-card h3{color:#fff;}
.roi-card .sub{color:rgba(255,255,255,.75);}
.roi-big{font-size:34px;font-weight:700;letter-spacing:-1px;}
.roi-sub{font-size:12.5px;color:rgba(255,255,255,.8);}
.mini-stat{display:flex;flex-direction:column;gap:2px;min-width:0;}
.mini-stat b{font-size:20px;font-weight:700;}
.mini-stat span{font-size:11px;color:rgba(255,255,255,.8);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
.wf{display:flex;flex-direction:column;gap:2px;min-width:0;}
.wf .r{display:grid;grid-template-columns:130px 1fr 92px;gap:12px;align-items:center;font-size:12.5px;padding:7px 0;min-width:0;}
.wf .r .track{height:24px;background:#f1f5f9;border-radius:6px;position:relative;overflow:hidden;min-width:0;}
.wf .r .track i{position:absolute;top:0;bottom:0;border-radius:6px;}
.wf .r .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
.note{font-size:12px;color:var(--muted);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:9px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:18px;color:var(--accent2);flex:none;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.chip{padding:5px 11px;border-radius:8px;background:var(--chip);font-size:12px;font-weight:600;color:var(--accent);}
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} .g23,.g32{grid-template-columns:1fr;} }
@media(max-width:860px){
  .layout{flex-direction:column;}
  .sidebar{width:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line);align-items:center;padding:12px 14px;gap:8px;}
  .brand{padding:0 10px 0 4px;}
  .navlbl,.side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;}
  .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 13px;}
  .navbtn .idx{display:none;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.board{grid-template-columns:1fr;}
  .wf .r{grid-template-columns:96px 1fr 74px;}
}
@media(max-width:560px){
  .navbtn .nm{display:none;}
  .navbtn{padding:9px 11px;}
  .wrap{padding:18px 14px 40px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div class="txt"><b>碳費情境模擬器</b><span>Carbon Fee Simulator</span></div>
    </div>
    <div class="navlbl">模擬流程</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="u">
        <div class="av"><span class="material-symbols-outlined">person</span></div>
        <div><b>林詠珊</b><span>永續管理師</span></div>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="ttl"><h1 id="scr-title">排放基線</h1><p id="scr-desc">盤查排放量與活動數據基線</p></div>
      <div class="sp"></div>
      <span class="tag"><span class="material-symbols-outlined">calendar_today</span>模擬年度 2027</span>
      <span class="tag"><span class="material-symbols-outlined">bolt</span>純 UI 展示</span>
    </div>
    <div class="wrap"><div id="screen"></div></div>
  </div>
</div>

<script>
var MODS=[
  {icon:"database",name:"排放基線",desc:"盤查排放量與活動數據基線"},
  {icon:"tune",name:"費率情境",desc:"碳費費率與優惠係數設定"},
  {icon:"calculate",name:"碳費試算",desc:"多情境碳費金額即時試算"},
  {icon:"compare_arrows",name:"情境比較",desc:"不同情境成本並排比較"},
  {icon:"savings",name:"減碳投資回收",desc:"減碳專案 ROI 與回收年限"},
  {icon:"insights",name:"衝擊分析",desc:"碳費對營運與毛利衝擊"}
];
var SCEN=[
  {k:"A",name:"基準情境",tag:"維持現狀",col:"#64748b",rate:300,cut:0,fee:3465,co2:11550},
  {k:"B",name:"自主減量",tag:"優惠費率",col:"#334155",rate:100,cut:14,fee:993,co2:9933},
  {k:"C",name:"高標減碳",tag:"技術投資",col:"#059669",rate:100,cut:31,fee:748,co2:7970}
];
function nfmt(n){return (Math.round(n)).toLocaleString("en-US");}
var chart=null;
function killChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }

function v0(c){
  var kpis=[
    {lb:"年度總排放量",ic:"co2",v:"11,550",u:"tCO2e",dl:"較去年 -6.4%",cl:"dn",di:"trending_down"},
    {lb:"排放源數量",ic:"factory",v:"27",u:"個",dl:"覆蓋 6 廠區",cl:"nu",di:"remove"},
    {lb:"數據完整率",ic:"verified",v:"95",u:"%",dl:"+33pt 佐證齊備",cl:"dn",di:"check"},
    {lb:"適用碳費排放",ic:"payments",v:"9,050",u:"tCO2e",dl:"扣除額 2,500t",cl:"nu",di:"remove"}
  ];
  var rows=[
    {s:"1",sc:"#dc2626",src:"天然氣鍋爐",act:"1,240,000 Nm³",fac:"2.10",em:2604,r:22.5,st:1,stt:"已查證"},
    {s:"1",sc:"#dc2626",src:"柴油發電機",act:"185,000 L",fac:"2.61",em:483,r:4.2,st:1,stt:"已查證"},
    {s:"2",sc:"#d97706",src:"外購電力",act:"9,850,000 kWh",fac:"0.494",em:4866,r:42.1,st:1,stt:"已查證"},
    {s:"2",sc:"#d97706",src:"外購蒸汽",act:"12,400 GJ",fac:"0.065",em:806,r:7.0,st:2,stt:"複核中"},
    {s:"3",sc:"#2563eb",src:"原料上游運輸",act:"2,150,000 t·km",fac:"0.62",em:1258,r:10.9,st:2,stt:"複核中"},
    {s:"3",sc:"#2563eb",src:"廢棄物處理",act:"3,400 t",fac:"0.45",em:1533,r:13.3,st:3,stt:"待補佐證"}
  ];
  var html='<div class="grid g4" style="margin-bottom:18px">';
  kpis.forEach(function(k){
    html+='<div class="kpi"><div class="bar"></div><div class="lb"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lb+'</div>'+
      '<div class="vl">'+k.v+'<small>'+k.u+'</small></div>'+
      '<div class="dl '+k.cl+'"><span class="material-symbols-outlined">'+k.di+'</span>'+k.dl+'</div></div>';
  });
  html+='</div><div class="grid g23">';
  html+='<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>排放源清冊（基線）</h3>'+
    '<p class="sub">依範疇分類的活動數據 × 排放係數，做為所有情境試算的共同基礎</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>範疇</th><th>排放源</th><th>活動數據</th><th>係數</th><th class="num">排放量(t)</th><th>佔比</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var ps=r.st==1?"s1":r.st==2?"s2":"s3";
    html+='<tr><td><span class="scope-dot" style="background:'+r.sc+'"></span>範疇'+r.s+'</td>'+
      '<td><b>'+r.src+'</b></td><td style="color:var(--muted)">'+r.act+'</td><td class="num">'+r.fac+'</td>'+
      '<td class="num">'+nfmt(r.em)+'</td>'+
      '<td><span class="bar-cell"><i style="width:'+r.r+'%"></i></span> <span style="font-size:11px;color:var(--muted)">'+r.r+'%</span></td>'+
      '<td><span class="pill '+ps+'">'+r.stt+'</span></td></tr>';
  });
  html+='</tbody></table></div></div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>範疇別排放結構</h3>'+
    '<p class="sub">範疇一 / 二 / 三 佔比</p><div id="c0" style="min-height:250px"></div>'+
    '<div class="note"><span class="material-symbols-outlined">info</span>範疇二（外購電力）為最大排放來源，是減碳與碳費模擬的優先標的。</div></div>';
  html+='</div>';
  c.innerHTML=html;
  void c.offsetHeight;
  killChart();
  chart=new ApexCharts(document.querySelector("#c0"),{
    chart:{type:"donut",height:250,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[3087,5672,2791],labels:["範疇一 直接排放","範疇二 能源間接","範疇三 其他間接"],
    colors:["#dc2626","#d97706","#2563eb"],
    dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    legend:{position:"bottom",fontSize:"12px"},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總排放 tCO2e",fontSize:"12px",formatter:function(){return "11,550";}}}}}},
    stroke:{width:2},tooltip:{y:{formatter:function(v){return nfmt(v)+" tCO2e";}}}
  });
  chart.render();
}

function v1(c){
  var html='<div class="sechd"><div><h2>費率情境設定</h2><p>組合碳費費率、自主減量優惠與扣除額，建立多組模擬情境</p></div>'+
    '<span class="tag rt"><span class="material-symbols-outlined">tune</span>3 組進行中</span></div>';
  html+='<div class="board">';
  SCEN.forEach(function(s){
    var pos=(s.rate/300*100);
    html+='<div class="scen"><div class="top"><div class="ic" style="background:'+s.col+'"><span class="material-symbols-outlined">bookmark</span></div>'+
      '<div style="min-width:0"><b>情境 '+s.k+'・'+s.name+'</b><span>'+s.tag+'</span></div></div>'+
      '<div class="bd">'+
      '<div class="row"><span>徵收費率 ($/tCO2e)</span><b>$'+s.rate+'</b></div>'+
      '<div class="slider"><i style="width:'+pos+'%"></i><b style="left:'+pos+'%"></b></div>'+
      '<div class="row"><span>自主減量目標</span><b>'+s.cut+'%</b></div>'+
      '<div class="row"><span>起徵門檻扣除</span><b>2,500 tCO2e</b></div>'+
      '<div class="row"><span>高碳洩漏係數</span><b>'+(s.k=="A"?"1.00":"0.20")+'</b></div>'+
      '<div class="row"><span>適用排放量</span><b>'+nfmt(s.co2)+' t</b></div>'+
      '</div>'+
      '<div class="ft"><span style="font-size:12px;color:var(--muted)">預估年碳費</span><span class="big" style="color:'+s.col+'">$'+nfmt(s.fee)+'萬</span></div></div>';
  });
  html+='</div>';

function show(i){
  i=+i; if(isNaN(i)||i<0) i=0; if(i>5) i=5;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
  document.getElementById("scr-title").textContent=MODS[i].name;
  document.getElementById("scr-desc").textContent=MODS[i].desc;
  var c=document.getElementById("screen");
  killChart();
  RENDER[i](c);
  try{window.scrollTo(0,0);}catch(e){}
}
