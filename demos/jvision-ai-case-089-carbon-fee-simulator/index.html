<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>碳費情境模擬器</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --gold:#fbbf24;
  --orange:#b45309;
  --panel:#fff;
  --shadow:6px 6px 0 #064e3b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.layout{min-height:100vh;display:grid;grid-template-columns:276px minmax(0,1fr)}
.sidebar{background:var(--ink);color:#fff;border-right:4px solid #000;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding-bottom:18px;border-bottom:2px solid var(--color-secondary)}
.logo{width:48px;height:48px;display:grid;place-items:center;background:var(--gold);color:#000;border:3px solid #000;box-shadow:4px 4px 0 var(--color-secondary)}
.logo .material-symbols-outlined{font-size:28px}
.brand b{display:block;font-size:16px;line-height:1.25}
.brand small{display:block;margin-top:4px;color:#d1fae5;font:10px "Fira Code",monospace;text-transform:uppercase;letter-spacing:.08em}
.navlbl{color:var(--gold);font:700 11px "Fira Code",monospace;letter-spacing:.16em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:8px}
.navbtn{min-height:48px;width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;color:#d1fae5;background:transparent;border:2px solid #6ee7b7;padding:10px}
.navbtn:hover{background:#065f46;color:#fff}
.navbtn.on{background:var(--gold);color:#000;border-color:#000;box-shadow:4px 4px 0 var(--color-secondary);font-weight:700}
.navbtn .idx{font:600 10px "Fira Code",monospace}
.side-foot{margin-top:auto;border-top:2px solid var(--color-secondary);padding-top:16px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;display:grid;place-items:center;background:var(--color-secondary);color:#000;border:2px solid #000}
.user b,.user span{display:block}
.user b{font-size:13px}.user span{font-size:11px;color:#d1fae5}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:17px 24px;background:#fff;border-bottom:4px solid var(--ink)}
.title h1{margin:0;font-size:21px;line-height:1.1;text-transform:uppercase}
.title p{margin:5px 0 0;color:var(--muted);font-size:12px}
.spacer{margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 10px;background:var(--color-muted);border:2px solid var(--ink);font:600 11px "Fira Code",monospace}
.tag.primary{background:var(--gold);color:#000}
.wrap{padding:28px 28px 54px}
.screen{max-width:1500px;margin:auto}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)}
.card,.kpi,.scenario{min-width:0;background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow)}
.card{padding:18px}
.card.accent{background:var(--ink);color:#fff;box-shadow:6px 6px 0 var(--gold)}
.card h2,.card h3{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;line-height:1.25}
.card h3 .material-symbols-outlined{color:var(--blue)}
.card.accent h3 .material-symbols-outlined{color:var(--gold)}
.sub{margin:5px 0 16px;color:var(--muted);font-size:12px;line-height:1.55}
.card.accent .sub{color:#d1fae5}
.section-head{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.section-head h2{margin:0;font-size:20px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.section-head .tag{margin-left:auto}
.kpis{margin-bottom:20px}
.kpi{position:relative;padding:17px 16px 15px;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;width:100%;height:8px;background:var(--gold);border-bottom:3px solid var(--ink)}
.kpi:nth-child(even):before{background:var(--color-secondary)}
.kpi-label{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--muted);font-size:12px;font-weight:600}
.kpi-value{margin-top:9px;font:700 28px "Fira Code",monospace;letter-spacing:-.06em}
.kpi-value small{margin-left:5px;color:var(--muted);font:600 12px "Fira Sans",sans-serif;letter-spacing:0}
.delta{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:700}
.delta.good{color:#047857}.delta.bad{color:#b91c1c}.delta.neutral{color:var(--muted)}
.table-wrap,.matrix-wrap{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:600px;border-collapse:collapse;font-size:12px}
th,td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{background:var(--ink);color:#fff;text-align:left;font:700 11px "Fira Code",monospace;letter-spacing:.03em}
tbody tr:nth-child(even){background:#f0fdf4}
tbody tr:hover{background:#d1fae5}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.code{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:2px solid currentColor;font-size:11px;font-weight:700}
.pill:before{font-family:"Material Symbols Outlined";font-size:14px}
.s1{background:#d1fae5;color:#065f46}.s1:before{content:"check_circle"}
.s2{background:#fef3c7;color:#92400e}.s2:before{content:"pending"}
.s3{background:#fee2e2;color:#991b1b}.s3:before{content:"warning"}
.s4{background:#dbeafe;color:#1e40af}.s4:before{content:"science"}
.scope{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.scope:before{content:"";width:11px;height:11px;background:var(--scope);border:2px solid #000}
.bar-cell{display:inline-block;position:relative;width:95px;height:12px;background:#dbe7e4;border:2px solid var(--ink);vertical-align:middle}
.bar-cell i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:12px;background:var(--color-muted);border:2px dashed var(--ink);font-size:12px;line-height:1.5}
.note .material-symbols-outlined{flex:none;color:var(--blue)}
.scenarios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.scenario{display:flex;flex-direction:column}
.scenario-head{display:flex;align-items:center;gap:10px;padding:14px;background:var(--scene);color:var(--scene-text);border-bottom:3px solid #000}
.scenario-icon{width:36px;height:36px;display:grid;place-items:center;background:#fff;color:#000;border:2px solid #000}
.scenario-head b,.scenario-head small{display:block}
.scenario-head small{margin-top:2px;font-size:10px}
.scenario-body{display:flex;flex:1;flex-direction:column;gap:13px;padding:16px}
.data-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px}
.data-row span{color:var(--muted)}
.data-row b{font-family:"Fira Code",monospace;text-align:right}
.slider{height:13px;background:#dbe7e4;border:2px solid var(--ink);position:relative}
.slider i{display:block;height:100%;background:var(--gold);border-right:2px solid var(--ink)}
.scenario-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:#f0fdf4;border-top:3px solid var(--ink)}
.scenario-foot span{font-size:11px}.scenario-foot b{font:700 20px "Fira Code",monospace}
.rule{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:2px dashed var(--line)}
.rule:last-child{border:0}
.rule b{font-size:12px}.rule p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:12px}
.calc-row span{color:var(--muted)}.calc-row b{font-family:"Fira Code",monospace;text-align:right}
.calc-total{display:flex;justify-content:space-between;align-items:center;padding-top:16px;font-weight:700}
.calc-total b{font:700 24px "Fira Code",monospace;color:var(--blue)}
.matrix th,.matrix td{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix .best{background:#d1fae5;color:var(--ink)}
.matrix th.best{background:var(--gold);color:#000}
.win{font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--color-secondary)}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;background:#d1fae5;border:2px solid var(--ink)}
.roi{font:700 48px "Fira Code",monospace;color:var(--gold);letter-spacing:-.08em}
.roi-unit{color:#d1fae5}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mini{border:2px solid #6ee7b7;padding:10px}
.mini b,.mini span{display:block}.mini b{font:700 18px "Fira Code",monospace}.mini span{margin-top:4px;color:#d1fae5;font-size:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:6px 9px;border:2px solid var(--ink);background:#d1fae5;font-size:11px;font-weight:700}
.accent .chip{border-color:#fff;background:#065f46;color:#fff}
.waterfall{display:flex;flex-direction:column;gap:4px}
.wf-row{display:grid;grid-template-columns:140px 1fr 90px;gap:12px;align-items:center;padding:7px 0;font-size:12px}
.track{height:26px;background:#dbe7e4;border:2px solid var(--ink);position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;background:var(--bar)}
.wf-row strong{text-align:right;font-family:"Fira Code",monospace}
.chart{min-height:260px}
.skip{position:fixed;left:12px;top:-100px;z-index:99;padding:10px;background:var(--gold);color:#000;border:3px solid #000;font-weight:700}
.skip:focus{top:12px}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:900px){
  .layout{display:block}
  .sidebar{border-right:0;border-bottom:4px solid #000;padding:13px}
  .brand{padding:0 0 12px}.navlbl,.side-foot{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .navbtn{display:flex;justify-content:center;padding:9px;min-height:46px}
  .navbtn .nm,.navbtn .idx{display:none}
  .topbar{position:relative}
  .scenarios{grid-template-columns:1fr}
}
@media(max-width:720px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .wrap{padding:20px 14px 42px}
  .topbar{padding:14px}
  .spacer{display:none}
  .title{width:100%}
  .mini-grid{grid-template-columns:1fr}
  .wf-row{grid-template-columns:105px 1fr 72px;gap:7px}
}
@media(max-width:420px){
  .brand small{display:none}
  .navbtn{min-width:0}
  .tag{font-size:10px}
  .kpi-value{font-size:25px}
}
</style>
</head>
<body>
<a class="skip" href="#screen">跳至主要內容</a>
<div class="layout">
<aside class="sidebar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">eco</span></div>
    <div><b>碳費情境模擬器</b><small>Carbon Fee Simulator</small></div>

<script>
var MODS=[
{icon:"database",name:"排放基線",desc:"盤查排放量與活動數據基線"},
{icon:"tune",name:"費率情境",desc:"碳費費率與優惠係數設定"},
{icon:"calculate",name:"碳費試算",desc:"多情境碳費金額即時試算"},
{icon:"compare_arrows",name:"情境比較",desc:"不同情境成本並排比較"},
{icon:"savings",name:"減碳投資回收",desc:"減碳專案 ROI 與回收年限"},
{icon:"insights",name:"衝擊分析",desc:"碳費對營運與毛利衝擊"}
];
var SCEN=[
{k:"A",name:"基準情境",tag:"維持現狀",col:"#64748b",text:"#fff",rate:300,cut:0,fee:3465,co2:11550},
{k:"B",name:"自主減量",tag:"優惠費率",col:"#fbbf24",text:"#000",rate:100,cut:14,fee:993,co2:9933},
{k:"C",name:"高標減碳",tag:"技術投資",col:"#10b981",text:"#000",rate:100,cut:31,fee:748,co2:7970}
];
var chart=null;
function nfmt(n){return Math.round(n).toLocaleString("en-US")}
function killChart(){if(chart){try{chart.destroy()}catch(e){}chart=null}}
function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function pill(c,t){return '<span class="pill '+c+'">'+t+'</span>'}
function kpis(items){
return '<div class="grid g4 kpis">'+items.map(function(k){

function card(title,ic,sub,body,cls){

function chartBase(type,height){
return {chart:{type:type,height:height,animations:{enabled:false},toolbar:{show:false},fontFamily:"Fira Sans"},dataLabels:{enabled:false},legend:{position:"top",fontFamily:"Fira Sans"},grid:{borderColor:"#a7f3d0"},tooltip:{theme:"light"}}

}

];

{lb:"適用碳費排放",ic:"payments",v:"9,050",u:"tCO2e",dl:"扣除額 2,500t",di:"remove"}

}

function show(i){
i=Number(i);if(!Number.isFinite(i)||i<0)i=0;if(i>5)i=5;
document.querySelectorAll("[data-i]").forEach(function(b){
var on=Number(b.getAttribute("data-i"))===i;
b.classList.toggle("on",on);
b.setAttribute("aria-current",on?"page":"false")
});
document.getElementById("scr-title").textContent=MODS[i].name;
document.getElementById("scr-desc").textContent=MODS[i].desc;
var c=document.getElementById("screen");
killChart();
c.classList.remove("reveal");
RENDER[i](c);
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){void c.offsetWidth;c.classList.add("reveal")}
try{window.scrollTo(0,0)}catch(e){}
}
function fromHash(){
var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);

}
