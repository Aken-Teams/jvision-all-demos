<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>合約風險標記台 · Contract Risk Review</title>
<meta name="description" content="AI 逐條標記合約條款風險、分級與修改建議的法律審閱協作平台"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#7c3aed;--accent2:#a78bfa;--ink:#1a1526;--bg:#f5f3fc;--card:#fff;--line:#e7e0f3;--mut:#6b6280;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--hi:#e11d48;--md:#f59e0b;--lo:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(124,58,237,.35)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#f4f1fb;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#ede9fe;color:#6d28d9;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.3}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-hi{background:#ffe4e6;color:#be123c}.t-md{background:#fef3c7;color:#b45309}.t-lo{background:#dcfce7;color:#15803d}
.t-info{background:#ede9fe;color:#6d28d9}.t-mut{background:#eee9f6;color:#6b6280}.t-ok{background:#dcfce7;color:#15803d}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf8fe}
table.data tr:last-child td{border-bottom:0}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.scroll{overflow-x:auto}
.bar{height:8px;background:#f0eafb;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* signature clause list */
.doc{display:flex;flex-direction:column;gap:11px}
.cl{border:1px solid var(--line);border-radius:13px;padding:0;overflow:hidden;border-left:5px solid var(--lo)}
.cl.hi{border-left-color:var(--hi)}.cl.md{border-left-color:var(--md)}.cl.lo{border-left-color:var(--lo)}
.cl .hd{display:flex;align-items:center;gap:9px;padding:11px 14px;background:#faf8fe;flex-wrap:wrap}
.cl .no{font-family:Inter;font-weight:800;font-size:12.5px;color:var(--accent)}
.cl .ttl{font-family:"Noto Sans TC";font-weight:700;font-size:13.5px}
.cl .hd .tag{margin-left:auto}
.cl .bd{padding:11px 14px}
.cl .txt{font-size:12.5px;line-height:1.75;color:#3a3350}
.cl .txt mark{background:#ffe4e6;color:#be123c;padding:1px 3px;border-radius:4px;font-weight:600}
.cl.md .txt mark{background:#fef3c7;color:#b45309}
.cl.lo .txt mark{background:#dcfce7;color:#15803d}
.cl .ai{margin-top:10px;background:#f4f1fb;border:1px dashed #cdbdf2;border-radius:10px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start}
.cl .ai .material-symbols-outlined{font-size:18px;color:var(--accent);flex:none;margin-top:1px}
.cl .ai b{font-size:11.5px;font-family:"Noto Sans TC";color:var(--accent)}
.cl .ai small{display:block;color:#4b4460;font-size:11.5px;margin-top:2px;line-height:1.6}
.cl .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--mut)}
.cl .meta span{display:flex;align-items:center;gap:4px}
.cl .meta .material-symbols-outlined{font-size:15px}
/* case cards */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.cc{border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--accent)}
.cc.hi{border-top-color:var(--hi)}.cc.md{border-top-color:var(--md)}.cc.lo{border-top-color:var(--lo)}
.cc b{font-family:"Noto Sans TC";font-size:14px;display:block}
.cc .sub{color:var(--mut);font-size:11px;margin:2px 0 9px}
.cc .row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;border-top:1px solid var(--line)}
.cc .row b{font-size:11.5px;font-family:Inter}
.cc .prog{height:6px;background:#f0eafb;border-radius:5px;overflow:hidden;margin-top:9px}
.cc .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* legend */
.rl{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-bottom:12px}
.rl span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.hi{background:var(--hi)}.dot.md{background:var(--md)}.dot.lo{background:var(--lo)}
/* suggest diff */
.sg{display:flex;flex-direction:column;gap:12px}
.sr{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sr .st{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sr .st b{font-family:"Noto Sans TC";font-size:13.5px}
.diff{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff>*{min-width:0}
.dh{font-size:10.5px;font-weight:800;color:var(--mut);margin-bottom:4px;letter-spacing:.5px}
.dbox{border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.65}
.dbox.old{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
.dbox.new{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
/* collab */
.cmt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;font-family:"Noto Sans TC"}
.cmt .cb b{font-family:"Noto Sans TC";font-size:12.5px}
.cmt .cb small{color:var(--mut);font-size:11px;margin-left:6px}
.cmt .cb p{margin:3px 0 0;font-size:12px;color:#3a3350;line-height:1.6}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.g::before{background:var(--ok)}.ti.w::before{background:var(--warn)}.ti.b::before{background:var(--bad)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:12px;color:#4b4460;margin-top:2px;line-height:1.6}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat>*{min-width:0}
.st{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.st .l{font-size:11.5px;color:var(--mut);font-weight:600}
.st .v{font-size:19px;font-weight:800;font-family:Inter;margin-top:3px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:9px 12px}
.al.bad{border-color:var(--bad);background:#fff1f2}.al.info{border-color:var(--accent);background:#f4f1fb}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--accent)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
/* version */
.vlist{display:flex;flex-direction:column;gap:0}
.vr{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:15px}
.vr::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.vr:last-child::before{display:none}
.vr .vd{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;font-family:Inter;background:var(--accent)}
.vr .vd.done{background:var(--ok)}.vr .vd.now{background:var(--accent)}.vr .vd.wait{background:#cbbfe2;color:#6b6280}
.vr .vb{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.vr .vb .vt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.vr .vb b{font-family:"Noto Sans TC";font-size:13px}
.vr .vb small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:10.5px;padding:2px 8px;border-radius:20px;background:#f0eafb;color:#6d28d9;font-weight:700}
@media(max-width:900px){.kpis,.stat{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.diff{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">審</div><div><b>合約風險標記台</b><span>CONTRACT RISK REVIEW</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">審閱總覽</h2><p id="vd"></p></div><div class="live"><i></i>AI 逐條標記即時彙整</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["審閱總覽","dashboard","審閱總覽","合約案量、風險分布與待辦戰情全局視圖"],
["合約案件","folder_shared","合約案件","審閱中合約建檔、標的與進度追蹤"],
["條款風險","flag","條款風險標記","AI 逐條標紅與高中低風險註記"],
["風險分級","shield","風險分級統計","風險類型分布、等級占比與趨勢"],
["修改建議","edit_note","修改建議","AI 建議條文、替代方案與採納狀態"],
["版本定稿","task_alt","版本定稿","版本比對、覆核簽核與封存留存"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

// clauses for signature view: [no, title, level(hi/md/lo), text-with-<mark>, aiTitle, aiText, cat]
const CLAUSES=[
["第 5.2 條","違約金與損害賠償","hi","乙方如遲延交付，除按日給付合約總價 <mark>千分之五</mark> 之違約金外，甲方並得<mark>不經催告逕行解除契約</mark>，且乙方應賠償甲方一切直接與間接損害。","違約金比率偏高、且免催告解約","建議將違約金上限訂為合約總價 5%，並增列 7 日補正催告期；「間接損害」範圍過廣，建議刪除或明確定義。","賠償責任"],
["第 8.1 條","責任限制","hi","本合約項下乙方之賠償責任<mark>不設任何上限</mark>，包含因第三人請求所生之全部費用與律師費。","無責任上限條款","高度不利。建議加入責任總額上限（如合約總價之 100%），並排除間接、附隨與懲罰性損害。","賠償責任"],
["第 12 條","準據法與管轄","md","本合約之解釋與爭議，以<mark>乙方所在地法院</mark>為第一審管轄法院，並適用該地法律。","管轄約定不利甲方","建議改為甲方所在地或雙方合意之仲裁機構；跨境合約宜約定仲裁以利執行。","管轄爭議"],
["第 9.3 條","智慧財產權歸屬","md","開發成果之智慧財產權於<mark>價金全額付清後</mark>始移轉予甲方，此前權利均歸乙方所有。","權利移轉時點延後","建議約定分階段付款且對應階段成果權利即時移轉，避免付款糾紛致成果無法使用。","智財權"],
["第 15 條","保密義務","lo","雙方對於因履約所知悉之營業秘密應負保密義務，保密期間至合約終止後 <mark>三年</mark> 為止。","條款合理","保密期間與範圍尚屬合理，建議補充違反保密之違約金約定即可。","保密"],
["第 3.1 條","付款條件","md","甲方應於乙方請款後 <mark>15 日</mark> 內付款，逾期乙方得暫停履約並加計年息 <mark>15%</mark> 遲延利息。","遲延利息偏高","法定遲延利息為年息 5%，約定 15% 恐部分無效；建議調整為 5%~10% 區間。","付款"],
["第 18 條","不可抗力","lo","因天災、戰爭、疫情等不可抗力致無法履約者，雙方均<mark>不負遲延責任</mark>，並應即時通知他方。","條款完整","不可抗力定義涵蓋疫情，條款完整，建議增列持續逾 60 日得終止之機制。","履約"]];

const CASES=[
["C-2408","科技業軟體開發委外合約","乙方：睿智科技","hi",5,2,62,"覆核中"],
["C-2407","不動產租賃合約（總部辦公室）","出租方：宏昌置產","md",3,4,88,"待定稿"],
["C-2406","供應商採購框架協議","乙方：長興材料","hi",6,3,45,"AI 標記中"],
["C-2405","經銷代理合約（東南亞）","代理商：Global Trade","md",4,5,70,"覆核中"],
["C-2404","股權投資協議（A 輪）","投資方：創投基金","hi",8,4,30,"AI 標記中"],
["C-2403","顧問服務合約","乙方：普華顧問","lo",1,3,95,"待定稿"],
["C-2402","保密協議 NDA","相對方：日商三和","lo",0,2,100,"已定稿"],
["C-2401","勞動契約（高階主管）","相對方：陳executive","md",2,3,80,"覆核中"]];

const SUGGEST=[
["第 5.2 條 違約金","hi","已採納","按日千分之五違約金，且免催告逕行解約","按日千分之三，違約金總額上限為合約總價 5%，並須經 7 日書面催告補正"],
["第 8.1 條 責任限制","hi","協商中","乙方賠償責任不設上限，含第三人請求全部費用","乙方賠償責任總額以本合約總價之 100% 為上限，且不含間接與懲罰性損害"],
["第 12 條 管轄","md","已採納","以乙方所在地法院為第一審管轄","雙方同意提交台北律師公會仲裁，仲裁判斷為終局"],
["第 3.1 條 遲延利息","md","待客戶確認","逾期加計年息 15% 遲延利息","逾期加計年息 8% 遲延利息，符合民法相關規定"]];

const COMMENTS=[
["王","王志明","主審律師","#7c3aed","2h","第 8.1 條無責任上限風險極高，已標記為必談判項，請談判團隊列為紅線條款。"],
["林","林佳蓉","法務","#a78bfa","1h","已採用 AI 對第 5.2 條之替代文字，違約金改按日千分之三並加催告期，等待對方回覆。"],
["陳","陳律師","合夥人","#6d28d9","35m","第 12 條管轄建議改仲裁我同意，跨境執行較有保障，請一併調整第 13 條爭議解決。"],
["張","張心怡","案件專員","#8b5cf6","10m","對方已回覆第 3.1 條，同意遲延利息調降至年息 8%，已更新至 v3 版本。"]];

const draws={};
let _ch=[];
function clr(){_ch.forEach(c=>{try{c.dispose();}catch(e){}});_ch=[];}
function mk(id){const el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);_ch.push(c);return c;}
const AC='#7c3aed',AC2='#a78bfa',HI='#e11d48',MD='#f59e0b',LO='#16a34a',GREY='#cbbfe2';
