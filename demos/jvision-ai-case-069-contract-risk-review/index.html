<title>合約風險標記台 · Contract Risk Review</title>

<style>
:root{
--color-primary:#0F172A;--color-on-primary:#FFFFFF;--color-secondary:#334155;--color-on-secondary:#FFFFFF;
--color-accent:#0369A1;--color-on-accent:#FFFFFF;--color-background:#F8FAFC;--color-foreground:#020617;
--color-card:#FFFFFF;--color-card-foreground:#020617;--color-muted:#E8ECF1;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;--color-ring:#0F172A;
--blue:#0369A1;--ink:#020617;--muted:#475569;--line:#E2E8F0;
--ok:#166534;--warn:#9A6700;--bad:#DC2626;--hi:#DC2626;--md:#B45309;--lo:#166534;
--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font:400 15px/1.5 Lato,"Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:stretch;min-height:74px;background:var(--color-primary);border-bottom:4px solid var(--color-accent)}
.brand{display:flex;align-items:center;gap:13px;padding:10px 22px;min-width:310px;border-right:1px solid #64748B}
.logo{display:grid;place-items:center;width:44px;height:44px;flex:none;background:var(--color-on-primary);color:var(--color-primary);border:2px solid var(--color-on-primary);font:700 24px/1 "EB Garamond",serif}
.brand b{display:block;color:#FFF;font:700 19px/1.1 "EB Garamond","Noto Serif TC",serif;letter-spacing:.04em}
.brand span{display:block;margin-top:4px;color:#CBD5E1;font:700 9px/1.2 var(--mono);letter-spacing:.16em}
.nav{display:flex;align-items:stretch;margin-left:auto;overflow-x:auto}
.nav button{display:flex;align-items:center;gap:7px;min-height:54px;padding:10px 14px;border:0;border-left:1px solid #334155;background:transparent;color:#CBD5E1;font-size:13px;font-weight:700;white-space:nowrap}
.nav button:hover{background:#1E293B;color:#FFF}
.nav button.on{background:var(--color-accent);color:#FFF;box-shadow:inset 0 -4px 0 #FFF}
.nav button .material-symbols-outlined{font-size:18px}
.wrap{width:min(100%,1440px);margin:auto;padding:30px 30px 54px}
.vh{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px;padding:0 0 18px;border-bottom:3px solid var(--color-primary)}
.vh:after{content:"";position:absolute;right:0;bottom:-3px;width:22%;height:3px;background:var(--color-accent)}
.vh h2{margin:0;font:700 clamp(29px,4vw,48px)/.95 "EB Garamond","Noto Serif TC",serif;letter-spacing:-.02em}
.vh p{margin:10px 0 0;color:var(--muted);font-size:13px}
.live{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#E0F2FE;color:#075985;border:1px solid #7DD3FC;font-size:12px;font-weight:700;white-space:nowrap}
.live i{width:9px;height:9px;background:var(--blue);border:2px solid #FFF;box-shadow:0 0 0 1px var(--blue);animation:pulse 1.6s steps(2,end) infinite}
@keyframes pulse{50%{opacity:.35}}
#view{animation:reveal .35s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}}
.kpis,.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:22px;border:2px solid var(--color-primary)}
.kpi,.st{position:relative;min-width:0;padding:17px 18px;background:var(--color-card);border-right:1px solid #94A3B8}
.kpi:last-child,.st:last-child{border-right:0}
.kpi:before,.st:before{content:"";position:absolute;left:0;top:0;width:34px;height:5px;background:var(--blue)}
.kpi .l,.st .l{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.kpi .v,.st .v{margin-top:6px;font:700 27px/1 var(--mono);font-variant-numeric:tabular-nums}
.kpi .d{margin-top:8px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:13px;color:#64748B;font-size:23px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid,.two{display:grid;gap:20px}
.grid>*,.two>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{min-width:0;padding:19px;background:var(--color-card);border:2px solid var(--color-primary);box-shadow:7px 7px 0 var(--color-muted)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #94A3B8;font:700 17px/1.2 "EB Garamond","Noto Serif TC",serif;letter-spacing:.02em}
.card h3 .material-symbols-outlined{color:var(--blue)}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border:1px solid currentColor;font-size:10px;font-weight:700;line-height:1.3;white-space:nowrap}
.t-hi{background:#FEF2F2;color:#991B1B}.t-md{background:#FFF7ED;color:#9A3412}.t-lo,.t-ok{background:#F0FDF4;color:#166534}
.t-info{background:#E0F2FE;color:#075985}.t-mut{background:#F1F5F9;color:#475569}
table.data{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:10px;border:1px solid #CBD5E1;text-align:left}
table.data th{background:var(--color-primary);color:#FFF;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
table.data td:nth-child(n+2){text-align:right;font-family:var(--mono)}
table.data td:last-child{text-align:left;font-family:inherit}
table.data tr:nth-child(even) td{background:#F8FAFC}
.chart{height:250px}
.scroll{overflow-x:auto}
.bar,.prog{height:8px;background:#CBD5E1;border:1px solid #94A3B8;overflow:hidden}
.bar i,.prog i{display:block;height:100%;background:var(--blue)}
.doc,.sg,.alist{display:flex;flex-direction:column;gap:12px}
.cl{overflow:hidden;border:1px solid #94A3B8;border-left:8px solid var(--lo);background:#FFF}
.cl.hi{border-left-color:var(--hi)}.cl.md{border-left-color:var(--md)}.cl.lo{border-left-color:var(--lo)}
.cl .hd{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;background:#F1F5F9;border-bottom:1px solid #CBD5E1;flex-wrap:wrap}
.cl .no{color:var(--blue);font:700 12px var(--mono)}
.cl .ttl{font:700 15px "EB Garamond","Noto Serif TC",serif}
.cl .hd .tag{margin-left:auto}
.cl .bd{padding:14px}
.cl .txt{color:#1E293B;font-size:13px;line-height:1.8}
.cl .txt mark{padding:2px 4px;background:#FEE2E2;color:#7F1D1D;border-bottom:2px solid var(--hi);font-weight:700}
.cl.md .txt mark{background:#FFEDD5;color:#7C2D12;border-color:var(--md)}
.cl.lo .txt mark{background:#DCFCE7;color:#14532D;border-color:var(--lo)}
.cl .ai{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:11px;background:#F0F9FF;border:1px solid #7DD3FC}
.cl .ai .material-symbols-outlined{flex:none;margin-top:2px;color:var(--blue)}
.cl .ai b{color:#075985;font-size:12px}
.cl .ai small{display:block;margin-top:3px;color:#334155;font-size:12px;line-height:1.65}
.cl .meta{display:flex;gap:13px;margin-top:10px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.cl .meta span{display:flex;align-items:center;gap:4px}
.cl .meta .material-symbols-outlined{font-size:15px}
.cl .meta span:nth-child(n+2){font-family:var(--mono)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cc{position:relative;padding:14px;background:#FFF;border:1px solid #94A3B8;border-top:7px solid var(--blue)}
.cc.hi{border-top-color:var(--hi)}.cc.md{border-top-color:var(--md)}.cc.lo{border-top-color:var(--lo)}
.cc>b{display:block;font:700 14px var(--mono)}
.cc .sub{min-height:34px;margin:4px 0 10px;color:var(--muted);font-size:11px}
.cc .row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);font-size:11px}
.cc .row b{font:700 11px var(--mono);font-variant-numeric:tabular-nums}
.cc .prog{margin-top:9px}
.rl{display:flex;gap:15px;margin-bottom:13px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.rl span{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border:1px solid #0F172A}
.dot.hi{background:var(--hi)}.dot.md{background:var(--md)}.dot.lo{background:var(--lo)}
.sr{padding:14px;border:1px solid #94A3B8}
.sr>.st{display:flex;align-items:center;gap:8px;padding:0;border:0;background:transparent}
.sr>.st:before{display:none}
.sr .st b{font:700 14px "EB Garamond","Noto Serif TC",serif}
.diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.dh{margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em}
.dbox{height:100%;padding:10px;border:1px solid;font-size:12px;line-height:1.65}
.dbox.old{background:#FEF2F2;border-color:#FCA5A5;color:#7F1D1D}
.dbox.new{background:#F0FDF4;border-color:#86EFAC;color:#14532D}
.cmt{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #CBD5E1}
.cmt:last-child{border-bottom:0}
.av{display:grid;place-items:center;width:32px;height:32px;flex:none;border:2px solid var(--color-primary);color:#FFF;font-weight:700;font-size:12px}
.cmt .cb b{font-size:12px}
.cmt .cb small{margin-left:6px;color:var(--muted);font:10px var(--mono)}
.cmt .cb p{margin:4px 0 0;color:#334155;font-size:12px;line-height:1.65}
.al{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;background:#FFFBEB;border:1px solid #F59E0B;border-left:6px solid var(--md)}
.al.bad{background:#FEF2F2;border-color:#F87171;border-left-color:var(--bad)}
.al.info{background:#F0F9FF;border-color:#7DD3FC;border-left-color:var(--blue)}
.al .material-symbols-outlined{flex:none;color:#92400E;font-size:19px}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--blue)}
.al b{font-size:12px}.al small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.vlist{display:flex;flex-direction:column}
.vr{position:relative;display:flex;align-items:flex-start;gap:12px;padding-bottom:15px}
.vr:before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:#94A3B8}
.vr:last-child:before{display:none}
.vr .vd{display:grid;place-items:center;width:34px;height:34px;z-index:1;flex:none;background:var(--blue);border:2px solid var(--color-primary);color:#FFF;font:700 11px var(--mono)}
.vr .vd.done{background:var(--ok)}.vr .vd.now{background:var(--blue)}.vr .vd.wait{background:#E2E8F0;color:#334155}
.vr .vb{flex:1;min-width:0;padding:11px 13px;border:1px solid #94A3B8}
.vr .vt{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vr .vb b{font:700 14px "EB Garamond","Noto Serif TC",serif}
.vr .vb small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{padding:2px 7px;background:#E0F2FE;border:1px solid #7DD3FC;color:#075985;font:700 10px var(--mono)}
@media(max-width:1024px){
.top{align-items:center;flex-wrap:wrap}.brand{min-width:0;border-right:0}.nav{width:100%;margin:0;border-top:1px solid #334155}
.nav button{flex:1;justify-content:center}.g2,.g11,.two{grid-template-columns:1fr}
}
@media(max-width:768px){
.wrap{padding:22px 18px 42px}.kpis,.stat{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi:nth-child(2),.st:nth-child(2){border-right:0}.kpi:nth-child(-n+2),.st:nth-child(-n+2){border-bottom:1px solid #94A3B8}
.vh{align-items:flex-start;flex-direction:column}.live{white-space:normal}
}
@media(max-width:480px){
.brand{padding:10px 14px}.brand b{font-size:17px}.nav button{min-width:54px;padding:10px 8px}.nav button span:not(.material-symbols-outlined){display:none}
.wrap{padding:18px 12px 38px}.vh h2{font-size:34px}.kpis,.stat{grid-template-columns:1fr}
.kpi,.st{border-right:0;border-bottom:1px solid #94A3B8}.kpi:last-child,.st:last-child{border-bottom:0}
.card{padding:14px;box-shadow:4px 4px 0 var(--color-muted)}.diff{grid-template-columns:1fr}.cases{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
#view{animation:none}.live i{animation:none}
}
</style>
</head>
