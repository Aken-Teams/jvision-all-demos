<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>設備能耗監控系統（Equipment Energy Monitoring System）｜Jvision Demo</title>
<meta name="description" content="設備級電流/功率監測、待機能耗辨識、設備能效比較與節能效益追蹤" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--acc:#0d9488;--acc2:#2dd4bf;--bg:#f1f5f6;--card:#fff;--ink:#0f2b29;--sub:#5b7572;--line:#e2ecea;--warn:#dc2626;--amber:#d97706;--ok:#0d9488;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.wrap{display:flex;min-height:100vh;align-items:stretch;}
.side{width:242px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;overflow:auto;}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 14px;}
.blogo{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.32);}
.blogo .material-symbols-outlined{font-size:24px;}
.btit{font-weight:800;font-size:15px;line-height:1.25;}
.bsub{font-size:11px;color:var(--sub);margin-top:2px;letter-spacing:.02em;}
.nav{display:flex;flex-direction:column;gap:4px;}
.nbtn{display:flex;gap:11px;align-items:center;border:0;background:transparent;color:var(--sub);font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer;min-width:0;transition:.16s;}
.nbtn .material-symbols-outlined{font-size:21px;flex:none;}
.nbtn:hover{background:#eefaf8;color:var(--acc);}
.nbtn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.3);}
.nidx{margin-left:auto;font-size:11px;opacity:.6;font-weight:700;}
.sfoot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:var(--sub);border-top:1px solid var(--line);}
.main{flex:1;min-width:0;padding:22px 26px 40px;}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.h1{font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;}
.h1 .pill{font-size:11px;font-weight:700;color:var(--acc);background:#d7f5f0;padding:4px 10px;border-radius:20px;}
.sub{font-size:13px;color:var(--sub);margin-top:5px;}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);font-weight:600;background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:22px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 4px rgba(45,212,191,.22);}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.7fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0;}
.ctit{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.ctit .material-symbols-outlined{font-size:19px;color:var(--acc);}
.cdesc{font-size:11.5px;color:var(--sub);margin-bottom:12px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.16),transparent 70%);}
.kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;}
.kl .material-symbols-outlined{font-size:17px;color:var(--acc);}
.kv{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-.02em;}
.kv small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px;}
.kd{font-size:11.5px;margin-top:5px;font-weight:700;}
.up{color:var(--warn);}.down{color:var(--ok);}
.chart{width:100%;height:270px;}
.chart.sm{height:210px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:11px;color:var(--sub);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em;}
td{padding:10px;border-bottom:1px solid #eef4f3;white-space:nowrap;}
tr:last-child td{border-bottom:0;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.t-ok{background:#d7f5f0;color:#0d7a70;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-mut{background:#eef2f2;color:#647b78;}
.bar{height:7px;border-radius:6px;background:#eef4f3;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));}
.dev{border:1px solid var(--line);border-radius:13px;padding:12px 13px;min-width:0;background:linear-gradient(180deg,#fff,#fafefd);}
.devh{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.devn{font-weight:800;font-size:13px;}
.devm{font-size:20px;font-weight:900;margin-top:9px;letter-spacing:-.02em;}
.devm small{font-size:11px;color:var(--sub);font-weight:700;}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin-top:9px;}
.spark>i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc));opacity:.85;}
.hm{display:grid;grid-template-columns:auto repeat(12,1fr);gap:5px;font-size:11px;align-items:center;}
.hm .hlbl{color:var(--sub);font-weight:700;padding-right:4px;white-space:nowrap;}
.hm .hh{text-align:center;color:var(--sub);font-weight:700;}
.cell{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0d3b37;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 15px 6px;}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 2px var(--acc);background:var(--acc);}
.tli.warn::before{box-shadow:0 0 0 2px var(--amber);background:var(--amber);}
.tli.bad::before{box-shadow:0 0 0 2px var(--warn);background:var(--warn);}
.tlt{font-weight:800;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tlm{font-size:11.5px;color:var(--sub);margin-top:3px;}
.tltime{font-size:11px;color:var(--sub);font-weight:700;}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kcol{background:#f6faf9;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
.kch{font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 3px;}
.kch .cnt{font-size:11px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 8px;}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,43,41,.04);}
.kcard:last-child{margin-bottom:0;}
.kct{font-size:12.5px;font-weight:700;line-height:1.35;}
.kcm{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:10.5px;color:var(--sub);flex-wrap:wrap;}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.roi{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:linear-gradient(180deg,#fff,#f5fdfb);}
.roih{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;}
.roiv{font-size:24px;font-weight:900;margin-top:8px;color:var(--acc);letter-spacing:-.02em;}
.roiv small{font-size:12px;color:var(--sub);font-weight:700;}
.roib{font-size:11px;color:var(--sub);margin-top:6px;}
.mb8{margin-bottom:8px;}
@media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr);}.kb{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
 .wrap{flex-direction:column;}
 .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--line);}
 .brand{padding:0 8px 0 0;margin-right:4px;}
 .nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
 .nbtn{flex:none;white-space:nowrap;padding:8px 12px;}
 .nidx{display:none;}
 .sfoot{display:none;}
}
@media(max-width:820px){
 .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
 .hm{grid-template-columns:auto repeat(12,1fr);font-size:9px;}
}
@media(max-width:560px){
 .nbtn .ntxt{display:none;}
 .nbtn{padding:9px 11px;}
 .main{padding:16px 14px 32px;}
 .h1{font-size:19px;}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="blogo"><span class="material-symbols-outlined">bolt</span></div>
      <div style="min-width:0"><div class="btit">設備能耗監控</div><div class="bsub">Equipment Energy Monitor</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">Jvision Demo · 純前端假資料<br/>ESG 永續 / 能源管理</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <div class="h1" id="scr-title">—</div>
        <div class="sub" id="scr-sub">—</div>
      </div>
      <div class="live"><span class="dot"></span>即時連線 · IoT Gateway 128 點</div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
var MODS=[
 {icon:"monitoring",name:"能耗即時監測",sub:"設備級電流/功率即時採集，掌握全廠用電負載"},
 {icon:"leaderboard",name:"能效比較分析",sub:"同型設備單位能耗排名，鎖定高耗能設備"},
 {icon:"bedtime",name:"待機浪費辨識",sub:"非生產時段待機能耗熱點，找出隱形浪費"},
 {icon:"warning",name:"異常用能告警",sub:"功率異常與尖峰需量即時預警與處置"},
 {icon:"savings",name:"節能對策執行",sub:"改善措施派工看板與完成進度追蹤"},
 {icon:"trending_down",name:"節能效益追蹤",sub:"改善前後能耗、節省度數與投資回收期"}
];

var _charts=[];
function disposeCharts(){for(var i=0;i<_charts.length;i++){try{_charts[i].dispose();}catch(e){}}_charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);_charts.push(c);}
var GRID={left:8,right:14,top:26,bottom:6,containLeft:true};

function fmt(n){try{return n.toLocaleString();}catch(e){return String(n);}}

/* ---------- SCREEN 0 : 能耗即時監測 ---------- */
function s0(){
 var kpis=[
  {l:"即時總功率",v:"3,842",u:"kW",d:"↑ 5.2% 較昨同時",c:"up",i:"bolt"},
  {l:"今日累積用電",v:"48,210",u:"kWh",d:"占日目標 71%",c:"down",i:"battery_charging_full"},
  {l:"設備平均負載",v:"63.4",u:"%",d:"↓ 2.1% 較上週",c:"down",i:"speed"},
  {l:"線上設備",v:"124 / 128",u:"",d:"4 台離線待檢",c:"up",i:"lan"}
 ];
 var devs=[
  {n:"射出成型 IM-07",m:"418",st:"t-warn",lb:"高負載",sp:[5,6,7,8,7,9,8,9]},
  {n:"空壓機 AC-02",m:"286",st:"t-ok",lb:"正常",sp:[4,4,5,4,5,4,5,5]},
  {n:"冰水主機 CH-01",m:"512",st:"t-warn",lb:"高負載",sp:[6,7,7,8,8,9,9,8]},
  {n:"CNC 加工 MC-14",m:"197",st:"t-ok",lb:"正常",sp:[3,4,3,4,4,3,4,4]},
  {n:"熱處理爐 FN-03",m:"631",st:"t-bad",lb:"超載",sp:[7,8,9,9,10,9,10,10]},
  {n:"輸送帶 CV-09",m:"58",st:"t-ok",lb:"正常",sp:[1,2,1,2,1,2,2,1]}
 ];
 var html=''
 +'<div class="grid g4 mb8" style="margin-bottom:14px">'+kpis.map(function(k){return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div><div class="kv">'+k.v+'<small>'+k.u+'</small></div><div class="kd '+k.c+'">'+k.d+'</div></div>';}).join('')+'</div>'
 +'<div class="grid g23" style="margin-bottom:14px">'
 +'<div class="card"><div class="ctit"><span class="material-symbols-outlined">show_chart</span>全廠即時功率曲線（近 24 小時）</div><div class="cdesc">綠：實測功率 kW　·　點虛線：契約容量上限</div><div id="c0a" class="chart"></div></div>'
 +'<div class="card"><div class="ctit"><span class="material-symbols-outlined">donut_large</span>用電結構占比</div><div class="cdesc">依設備類別分攤即時負載</div><div id="c0b" class="chart"></div></div>'
 +'</div>'
 +'<div class="card"><div class="ctit"><span class="material-symbols-outlined">grid_view</span>重點設備即時功率</div><div class="cdesc">每格顯示即時功率（kW）與近 8 時段趨勢</div>'
 +'<div class="grid g3">'+devs.map(function(d){var mx=Math.max.apply(null,d.sp);return '<div class="dev"><div class="devh"><span class="devn">'+d.n+'</span><span class="tag '+d.st+'">'+d.lb+'</span></div><div class="devm">'+d.m+' <small>kW</small></div><div class="spark">'+d.sp.map(function(v){return '<i style="height:'+Math.round(v/mx*100)+'%"></i>';}).join('')+'</div></div>';}).join('')+'</div></div>';
 setScreen(html);
 var hrs=[];for(var i=0;i<24;i++)hrs.push((i<10?'0':'')+i+':00');
 var pw=[2600,2450,2400,2380,2500,2900,3400,3800,4050,4200,4180,4300,4100,4250,4380,4200,4050,3900,3600,3300,3100,2900,2750,2650];
 mk('c0a',{grid:{left:44,right:16,top:26,bottom:28},tooltip:{trigger:'axis'},xAxis:{type:'category',data:hrs,axisLabel:{fontSize:10,interval:3,color:'#5b7572'},axisLine:{lineStyle:{color:'#d6e3e1'}}},yAxis:{type:'value',name:'kW',nameTextStyle:{fontSize:10,color:'#5b7572'},axisLabel:{fontSize:10,color:'#5b7572'},splitLine:{lineStyle:{color:'#eef4f3'}}},series:[{type:'line',data:pw,smooth:true,symbol:'none',lineStyle:{width:2.5,color:'#0d9488'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(45,212,191,.35)'},{offset:1,color:'rgba(45,212,191,.02)'}])}},{type:'line',data:hrs.map(function(){return 4500;}),symbol:'none',lineStyle:{width:1.5,type:'dashed',color:'#dc2626'}}]});
 mk('c0b',{tooltip:{trigger:'item',formatter:'{b}: {c} kW ({d}%)'},legend:{bottom:0,itemWidth:9,itemHeight:9,textStyle:{fontSize:10}},series:[{type:'pie',radius:['46%','72%'],center:['50%','44%'],avoidLabelOverlap:true,label:{show:false},data:[{value:1160,name:'冷凍空調',itemStyle:{color:'#0d9488'}},{value:960,name:'成型設備',itemStyle:{color:'#2dd4bf'}},{value:720,name:'加工機台',itemStyle:{color:'#5eead4'}},{value:560,name:'空壓系統',itemStyle:{color:'#0f766e'}},{value:442,name:'照明其他',itemStyle:{color:'#99f6e4'}}]}]});
}

/* ---------- SCREEN 1 : 能效比較分析 ---------- */
function s1(){
 var rows=[
  {n:"熱處理爐 FN-03",t:"熱處理",uec:"2.84",base:"2.10",r:135,st:"t-bad",lb:"待改善"},
  {n:"冰水主機 CH-01",t:"冷凍空調",uec:"0.68",base:"0.55",r:124,st:"t-warn",lb:"偏高"},
  {n:"射出成型 IM-07",t:"成型",uec:"0.52",base:"0.46",r:113,st:"t-warn",lb:"偏高"},
  {n:"空壓機 AC-02",t:"空壓",uec:"0.118",base:"0.115",r:103,st:"t-ok",lb:"良好"},
  {n:"CNC 加工 MC-14",t:"加工",uec:"0.089",base:"0.092",r:97,st:"t-ok",lb:"優良"},
  {n:"輸送帶 CV-09",t:"輸送",uec:"0.021",base:"0.023",r:91,st:"t-ok",lb:"優良"}
 ];
 var html=''
 +'<div class="grid g3 mb8" style="margin-bottom:14px">'
 +'<div class="kpi"><div class="kl"><span class="material-symbols-outlined">factory</span>納入比較設備</div><div class="kv">128 <small>台</small></div><div class="kd down">涵蓋 6 大類別</div></div>'
 +'<div class="kpi"><div class="kl"><span class="material-symbols-outlined">priority_high</span>能效低於基準</div><div class="kv">17 <small>台</small></div><div class="kd up">↑ 3 台較上月</div></div>'
 +'<div class="kpi"><div class="kl"><span class="material-symbols-outlined">insights</span>潛在節能空間</div><div class="kv">14.6 <small>%</small></div><div class="kd down">約 6,900 kWh/日</div></div>'
 +'</div>'
 +'<div class="grid g23">'
 +'<div class="card"><div class="ctit"><span class="material-symbols-outlined">table_chart</span>設備單位能耗排名（單位能耗 = kWh/單位產出）</div><div class="cdesc">比值 = 實測單位能耗 / 同型基準，越高代表能效越差</div>'
 +'<div style="overflow-x:auto"><table><thead><tr><th>排名</th><th>設備</th><th>類別</th><th>單位能耗</th><th>基準</th><th>比值</th><th>評等</th></tr></thead><tbody>'
 +rows.map(function(r,i){return '<tr><td style="font-weight:800;color:var(--acc)">#'+(i+1)+'</td><td style="font-weight:700">'+r.n+'</td><td>'+r.t+'</td><td>'+r.uec+'</td><td style="color:var(--sub)">'+r.base+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:70px"><i style="width:'+Math.min(r.r,150)/150*100+'%"></i></div><span style="font-weight:700;font-size:11.5px">'+r.r+'%</span></div></td><td><span class="tag '+r.st+'">'+r.lb+'</span></td></tr>';}).join('')
 +'</tbody></table></div></div>'
 +'<div class="card"><div class="ctit"><span class="material-symbols-outlined">radar</span>能效面向雷達</div><div class="cdesc">FN-03 vs 同型平均（100=基準）</div><div id="c1b" class="chart"></div></div>'
 +'</div>'
