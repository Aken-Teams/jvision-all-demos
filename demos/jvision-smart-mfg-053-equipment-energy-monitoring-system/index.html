<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>設備能耗監控系統（Equipment Energy Monitoring System）｜Jvision Demo</title>
<meta name="description" content="設備級電流/功率監測、待機能耗辨識、設備能效比較與節能效益追蹤" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --amber:#b45309;
  --ok:#047857;
  --shadow:0 18px 45px rgba(6,78,59,.08);
  --shadow-soft:0 8px 24px rgba(6,78,59,.065);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 78% -8%,rgba(16,185,129,.18),transparent 26rem),
    radial-gradient(circle at 12% 88%,rgba(167,243,208,.45),transparent 28rem),
    var(--color-background);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"],a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.wrap{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:none;
  flex-direction:column;
  gap:12px;
  width:268px;
  height:100vh;
  padding:22px 16px;
  overflow:auto;
  color:#ecfdf5;
  background:
    radial-gradient(circle at 12% 8%,rgba(52,211,153,.3),transparent 13rem),
    linear-gradient(165deg,#043c30 0%,#064e3b 52%,#073b31 100%);
  border-right:1px solid rgba(167,243,208,.32);
  box-shadow:16px 0 48px rgba(6,78,59,.11);
}
.side::after{
  content:"";
  position:absolute;
  right:-1px;
  bottom:9%;
  width:30px;
  height:180px;
  border-radius:80% 0 0 80%;
  background:rgba(52,211,153,.08);
  pointer-events:none;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 8px 19px;
  border-bottom:1px solid rgba(167,243,208,.22);
}
.blogo{
  display:grid;
  place-items:center;
  flex:none;
  width:48px;
  height:48px;
  color:#022c22;
  background:linear-gradient(145deg,#6ee7b7,#10b981);
  border:1px solid rgba(255,255,255,.46);
  border-radius:18px 13px 19px 12px;
  box-shadow:0 12px 26px rgba(0,0,0,.22);
}
.blogo .material-symbols-outlined{font-size:27px}
.btit{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:.02em}
.bsub{margin-top:3px;color:#a7f3d0;font-size:10px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:6px}
.nbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:48px;
  padding:11px 12px;
  overflow:hidden;
  color:#d1fae5;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:17px 13px 18px 12px;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease,color .2s ease;
}
.nbtn::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:0;
  background:linear-gradient(120deg,rgba(110,231,183,.15),rgba(255,255,255,.05));
  transition:opacity .2s ease;
}
.nbtn:hover{
  color:#fff;
  border-color:rgba(167,243,208,.28);
  transform:translateX(2px);
}
.nbtn:hover::before{opacity:1}
.nbtn.on{
  color:#022c22;
  background:linear-gradient(135deg,#d1fae5,#6ee7b7);
  border-color:#ecfdf5;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.nbtn>*{position:relative;z-index:1}
.nbtn .material-symbols-outlined{flex:none;font-size:21px}
.ntxt{font-size:13px;font-weight:600}
.nidx{
  margin-left:auto;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  opacity:.72;
}
.sfoot{
  margin-top:auto;
  padding:15px 9px 2px;
  color:#a7f3d0;
  font-size:10px;
  line-height:1.7;
  border-top:1px solid rgba(167,243,208,.22);
}
.main{flex:1;min-width:0;padding:27px clamp(16px,3vw,42px) 48px}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
}
.h1{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  color:#052e25;
  font-size:clamp(21px,2vw,29px);
  font-weight:700;
  letter-spacing:-.025em;
}
.h1 .pill{
  padding:5px 11px;
  color:#065f46;
  background:rgba(255,255,255,.72);
  border:1px solid var(--line);
  border-radius:999px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.01em;
}
.sub{max-width:680px;margin-top:7px;color:var(--muted);font-size:13px;line-height:1.6}
.live{
  display:flex;
  align-items:center;
  gap:9px;
  flex:none;
  min-height:42px;
  padding:9px 14px;
  color:#065f46;
  font-size:11px;
  font-weight:600;
  background:rgba(255,255,255,.76);
  border:1px solid rgba(5,150,105,.28);
  border-radius:18px 13px 19px 12px;
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(12px);
}
.dot{
  position:relative;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#059669;
}
.dot::after{
  content:"";
  position:absolute;
  inset:-4px;
  border:1px solid rgba(5,150,105,.34);
  border-radius:50%;
}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr)}
.mb8{margin-bottom:14px}
.card,.kpi{
  min-width:0;
  background:rgba(255,255,255,.91);
  border:1px solid rgba(5,150,105,.2);
  box-shadow:var(--shadow-soft);
}
.card{
  padding:18px 19px;
  border-radius:22px 16px 24px 17px;
}
.kpi{
  position:relative;
  padding:17px;
  overflow:hidden;
  border-radius:20px 15px 23px 16px;
}
.kpi::before{
  content:"";
  position:absolute;
  right:-35px;
  top:-44px;
  width:116px;
  height:116px;
  background:radial-gradient(circle,rgba(16,185,129,.18),rgba(16,185,129,0) 68%);
  border-radius:45% 55% 68% 32%;
}
.kpi::after{
  content:"";
  position:absolute;
  right:17px;
  bottom:0;
  width:42px;
  height:3px;
  background:linear-gradient(90deg,#10b981,#6ee7b7);
  border-radius:999px 999px 0 0;
}
.ctit{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
  color:#064e3b;
  font-size:13.5px;
  font-weight:700;
}
.ctit .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  color:#047857;
  background:#d1fae5;
  border-radius:11px 8px 12px 8px;
  font-size:17px;
}
.cdesc{margin-bottom:13px;color:var(--muted);font-size:11.5px;line-height:1.55}
.kl{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600;
}
.kl .material-symbols-outlined{color:#047857;font-size:18px}
.kv{
  position:relative;
  margin-top:9px;
  color:#052e25;
  font-family:"Fira Code",monospace;
  font-size:clamp(23px,2.2vw,29px);
  font-weight:700;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
}
.kv small{
  margin-left:3px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:0;
}
.kd{
  position:relative;
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  font-size:11px;
  font-weight:600;
}
.kd::before{
  font-family:"Material Symbols Outlined";
  font-size:15px;
}
.up{color:#b91c1c}
.up::before{content:"warning"}
.down{color:#047857}
.down::before{content:"verified"}
.chart{width:100%;height:270px}
.chart.sm{height:216px}
table{width:100%;border-spacing:0;border-collapse:separate;font-size:12px}
th{
  padding:10px 11px;
  color:#334155;
  text-align:left;
  white-space:nowrap;
  background:#ecfdf5;
  border-top:1px solid #d1fae5;
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.035em;
}
th:first-child{border-radius:10px 0 0 10px}
th:last-child{border-radius:0 10px 10px 0}
td{
  padding:11px;
  white-space:nowrap;
  border-bottom:1px solid #e2f4ed;
  font-variant-numeric:tabular-nums;
}
td:not(:first-child){text-align:right}
td:last-child{text-align:left}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f0fdf8}
tbody tr:last-child td{border-bottom:0}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  border-radius:50%;
  background:currentColor;
}
.t-ok{color:#047857;background:#d1fae5;border-color:#a7f3d0}
.t-warn{color:#92400e;background:#fef3c7;border-color:#fde68a}
.t-bad{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
.t-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.bar{min-width:66px;height:7px;overflow:hidden;background:#e2e8f0;border-radius:999px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#059669,#34d399);border-radius:999px}
.dev{
  min-width:0;
  padding:14px;
  background:linear-gradient(145deg,#fff,#f0fdf8);
  border:1px solid #bbf7d0;
  border-radius:18px 13px 20px 14px;
  transition:transform .2s ease,box-shadow .2s ease;
}
.dev:hover{transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.devh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.devn{font-size:12.5px;font-weight:700}
.devm{
  margin-top:10px;
  color:#052e25;
  font-family:"Fira Code",monospace;
  font-size:21px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.devm small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:10.5px;font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;margin-top:9px}
.spark>i{flex:1;min-height:3px;background:linear-gradient(180deg,#6ee7b7,#059669);border-radius:4px 4px 1px 1px}
.hm{display:grid;grid-template-columns:auto repeat(12,minmax(37px,1fr));align-items:center;gap:5px;font-size:10px}
.hm .hlbl{padding-right:5px;color:var(--muted);font-weight:700;white-space:nowrap}
.hm .hh{color:var(--muted);text-align:center;font-family:"Fira Code",monospace;font-size:9px;font-weight:600}
.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  height:28px;
  border:1px solid rgba(6,78,59,.08);
  border-radius:8px 5px 9px 6px;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  left:7px;
  top:6px;
  bottom:9px;
  width:2px;
  background:linear-gradient(#dc2626,#f59e0b,#10b981);
}
.tli{position:relative;padding:0 0 18px 7px}
.tli::before{
  content:"";
  position:absolute;
  left:-24px;
  top:4px;
  width:11px;
  height:11px;
  background:#059669;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 0 2px #059669;
}
.tli.warn::before{background:#d97706;box-shadow:0 0 0 2px #d97706}
.tli.bad::before{background:#dc2626;box-shadow:0 0 0 2px #dc2626}
.tlt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.tlm{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}
.tltime{margin-top:3px;color:#64748b;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kcol{min-width:0;padding:12px;background:#f0fdf8;border:1px solid #bbf7d0;border-radius:18px 13px 20px 14px}
.kch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
  padding:0 3px;
  font-size:12px;
  font-weight:700;
}
.kch .cnt{
  min-width:24px;
  padding:2px 7px;
  color:#475569;
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.kcard{
  margin-bottom:9px;
  padding:11px;
  background:#fff;
  border:1px solid #d1fae5;
  border-radius:14px 10px 16px 11px;
  box-shadow:0 5px 14px rgba(6,78,59,.05);
}
.kcard:last-child{margin-bottom:0}
.kct{font-size:12px;font-weight:700;line-height:1.45}
.kcm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10px}
.av{
  display:grid;
  place-items:center;
  flex:none;
  width:24px;
  height:24px;
  color:#fff;
  background:linear-gradient(145deg,#059669,#10b981);
  border-radius:50%;
  font-size:10px;
  font-weight:700;
}
.roi{
  padding:15px;
  background:linear-gradient(145deg,#fff,#ecfdf5);
  border:1px solid #bbf7d0;
  border-radius:19px 13px 21px 15px;
}
.roih{display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:12px;font-weight:700}
.roiv{
  margin-top:10px;
  color:#047857;
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.04em;
}
.roiv small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:11px}
.roib{margin-top:6px;color:var(--muted);font-size:10.5px}
#screen>.grid,#screen>.card{
  animation:rise .42s cubic-bezier(.2,.75,.25,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:none}
}
@media(max-width:1120px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kb{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .wrap{display:block}
  .side{
    position:static;
    width:auto;
    height:auto;
    padding:13px 14px;
    overflow:visible;
    border-right:0;
    border-bottom:1px solid rgba(167,243,208,.35);
  }
  .brand{padding:0 2px 12px}
  .blogo{width:41px;height:41px}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .nbtn{min-height:44px;padding:9px 10px}
  .nidx,.sfoot{display:none}
  .main{padding-top:21px}
}
@media(max-width:768px){
  .top{align-items:flex-start}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .card{padding:16px}
}
@media(max-width:560px){
  .side{padding:11px}
  .nav{grid-template-columns:repeat(6,1fr)}
  .nbtn{justify-content:center;min-width:0;padding:9px 6px;border-radius:13px 9px 14px 10px}
  .nbtn .material-symbols-outlined{font-size:20px}
  .ntxt{display:none}
  .main{padding:17px 13px 34px}
  .top{display:block}
  .live{width:max-content;max-width:100%;margin-top:13px}
  .g4{grid-template-columns:1fr}
  .h1{font-size:21px}
  .kv{font-size:26px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="blogo"><span class="material-symbols-outlined" aria-hidden="true">bolt</span></div>
      <div style="min-width:0">
        <div class="btit">設備能耗監控</div>
        <div class="bsub">Equipment Energy Monitor</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="系統模組"></nav>
    <div class="sfoot">Jvision Demo · 純前端假資料<br />ESG 永續 / 能源管理</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <div class="h1" id="scr-title">—</div>
        <div class="sub" id="scr-sub">—</div>
      </div>
      <div class="live"><span class="dot" aria-hidden="true"></span>即時連線 · IoT Gateway 128 點</div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
var MODS=[
 {icon:"monitoring",name:"能耗即時監測",sub:"設備級電流/功率即時採集，掌握全廠用電負載"},
 {icon:"leaderboard",name:"能效比較分析",sub:"同型設備單位能耗排名，鎖定高耗能設備"},
 {icon:"bedtime",name:"待機浪費辨識",sub:"非生產時段待機能耗熱點，找出隱形浪費"},
 {icon:"warning",name:"異常用能告警",sub:"功率異常與尖峰需量即時預警與處置"},
 {icon:"savings",name:"節能對策執行",sub:"改善措施派工看板與完成進度追蹤"},
 {icon:"trending_down",name:"節能效益追蹤",sub:"改善前後能耗、節省度數與投資回收期"}
];
var _charts=[];
var chartText="#475569",chartLine="#d7eee5",green="#059669",green2="#10b981",red="#dc2626",amber="#d97706";
function disposeCharts(){for(var i=0;i<_charts.length;i++){try{_charts[i].dispose()}catch(e){}}_charts=[]}
function mk(id,opt){
 var el=document.getElementById(id);
 if(!el)return;
 var c=echarts.init(el);
 c.setOption(opt);
 _charts.push(c);
}
function axisCategory(data){
 return {type:"category",data:data,axisLabel:{fontSize:10,color:chartText},axisLine:{lineStyle:{color:"#a7f3d0"}},axisTick:{show:false}};
}
function axisValue(name){

 for(var b=0;b<btns.length;b++){

 }

}
(function(){

}
