<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
--color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;--color-on-secondary:#000;
--color-accent:#ea580c;--color-on-accent:#000;--color-background:#f8fafc;--color-foreground:#1e293b;
--color-card:#fff;--color-card-foreground:#1e293b;--color-muted:#e9eff8;--color-muted-foreground:#475569;
--color-border:#e2e8f0;--color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#2563eb;
--blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
--ok:#15803d;--ok-bg:#dcfce7;--danger:#b91c1c;--danger-bg:#fee2e2;--warning:#a16207;--warning-bg:#fef3c7;
--shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.055)
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:21px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 16px;background:#0f172a;color:#fff;border-right:1px solid #1e293b}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px;border-bottom:1px solid #334155}
.logo{width:44px;height:44px;display:grid;place-items:center;background:var(--blue);border-radius:8px;box-shadow:0 6px 0 #1d4ed8}
.brand b{display:block;font-size:16px;letter-spacing:.02em}
.brand small{display:block;margin-top:3px;color:#cbd5e1;font-size:11px;letter-spacing:.08em}
.nav{display:grid;gap:5px;margin-top:22px}
.nav button{width:100%;min-height:46px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:#cbd5e1;text-align:left;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{background:#1e293b;color:#fff;border-color:#334155;transform:translateX(2px)}
.nav button.on{background:#fff;color:#0f172a;border-color:#fff;box-shadow:inset 4px 0 var(--color-accent)}
.nav .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.nav .n{margin-left:auto;color:#94a3b8;font:500 10px "Fira Code",monospace}
.foot{margin-top:auto;padding:18px 8px 2px;border-top:1px solid #334155;color:#94a3b8;font-size:10.5px;line-height:1.8}
.main{min-width:0}
.top{position:sticky;top:0;z-index:10;min-height:79px;display:flex;align-items:center;gap:20px;padding:14px 30px;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.top h1{margin:0;font-size:20px;line-height:1.25;letter-spacing:-.02em}
.top .sub{margin-top:4px;color:var(--muted);font-size:12px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #bbf7d0;border-radius:6px;background:#f0fdf4;color:#166534;font-size:11px;font-weight:700;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px #dcfce7;animation:pulse 1.8s ease-out infinite}
.wrap{max-width:1600px;margin:auto;padding:26px 30px 54px}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}.c12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{min-width:0;background:var(--color-card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card{padding:18px}.kpi{position:relative;padding:17px;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--kpi,var(--blue))}
.kpi:hover,.card:hover{border-color:#cbd5e1}.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.1)}
.ico{width:38px;height:38px;display:grid;place-items:center;margin-bottom:13px;border-radius:7px;background:var(--ico-bg);color:var(--ico)}
.lab{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em}.val{margin-top:4px;font:700 28px/1.2 "Fira Code",monospace;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.val small{font:600 12px "Fira Sans",sans-serif;color:var(--muted);letter-spacing:0}.delta{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:11px;font-weight:700}
.up{color:#166534}.down{color:#991b1b}
.ct{display:flex;align-items:center;gap:9px;min-width:0;margin-bottom:15px}.ct>.material-symbols-outlined{color:var(--blue)}.ct b{font-size:14px}
.tag{margin-left:auto;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--color-muted);color:var(--muted);font:600 10px "Fira Code",monospace;white-space:nowrap}
.scroll{max-width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}th{padding:10px 12px;background:#f1f5f9;border-block:1px solid var(--line);color:#334155;font-size:10.5px;letter-spacing:.04em;text-align:left;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr{transition:background .18s}tbody tr:hover{background:#f8fafc}
td:last-child,th:last-child{text-align:right}.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid currentColor;border-radius:5px;font-size:10.5px;font-weight:700;line-height:1;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:#166534}.p-ng{background:var(--danger-bg);color:#991b1b}.p-wa{background:var(--warning-bg);color:#854d0e}.p-mut{background:#f1f5f9;color:#475569}.p-acc{background:#ffedd5;color:#9a3412}
.scanhead{display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:10px;background:#172554;color:#fff;box-shadow:0 8px 0 #dbeafe}
.laser{position:relative;width:68px;height:68px;flex:none;display:grid;place-items:center;overflow:hidden;border:1px solid #60a5fa;border-radius:8px;background:#1e3a8a;color:#bfdbfe}
.laser .material-symbols-outlined{font-size:34px}.laser:after{content:"";position:absolute;left:7px;right:7px;top:10px;height:2px;background:#fb923c;box-shadow:0 0 9px #fb923c;animation:scan 1.7s ease-in-out infinite}
.scanhead .big{font-size:22px;font-weight:700}.scanhead .lab{color:#dbeafe}.scan-total{text-align:right}.scan-total .big{color:#fb923c;font-family:"Fira Code",monospace}
.matchrow{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:10px 12px;border:1px solid var(--line);border-radius:7px}.matchrow .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:6px}
.matchrow .info{flex:1;min-width:0}.matchrow b{display:block;font-size:12px}.matchrow .info span{color:var(--muted);font-size:11px}
.alert{display:flex;align-items:center;gap:8px;margin-top:12px;padding:12px;border:1px solid #fecaca;border-left:4px solid var(--danger);border-radius:7px;background:#fff1f2;color:#881337;font-size:12px;font-weight:700}
.logrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.iboard,.imgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.station,.imcell{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.station{padding:13px}.station.run{border-left:4px solid var(--ok)}.station.lock{border-left:4px solid var(--danger);background:#fff7f7}.station.wait{border-left:4px solid #ca8a04;background:#fffdf3}
.sh{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px}.sh b{font-size:12px}.meta{color:var(--muted);font-size:10.8px;line-height:1.8}.meta em{color:var(--ink);font-style:normal;font-weight:700}
.imcell .ph{height:96px;display:grid;place-items:center;color:#fff}.ph .material-symbols-outlined{font-size:32px}.ph.ok{background:#166534}.ph.ng{background:#b91c1c}.ph.rv{background:#a16207}
.cap{padding:10px}.cap b{font-size:12px}.cap>span{display:block;margin-top:3px;color:var(--muted);font-size:10.5px}
.chartbox{position:relative;height:230px}.chartbox.sm{height:190px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:10.5px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.tl{position:relative;padding-left:26px}.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:8px;width:2px;background:var(--line)}.tlitem{position:relative;padding:0 0 18px 5px}
.tlitem:before{content:"";position:absolute;left:-23px;top:2px;width:11px;height:11px;border:3px solid #fff;outline:1px solid #94a3b8;border-radius:50%;background:#64748b}
.tlitem.ng:before{background:var(--danger)}.tlitem.ok:before{background:var(--ok)}.tlitem.wa:before{background:#ca8a04}.tm{color:var(--muted);font:600 10.5px "Fira Code",monospace}.hd{margin:3px 0;font-size:13px;font-weight:700}.bd{color:var(--muted);font-size:11.5px;line-height:1.6}
.seg{display:inline-flex;gap:2px;margin-top:6px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#f1f5f9}.seg span{padding:4px 8px;border-radius:4px;color:var(--muted);font-size:10px;font-weight:700}.seg .on{background:var(--blue);color:#fff}
.toggle{position:relative;width:40px;height:22px;margin-left:auto;border:1px solid #166534;border-radius:20px;background:var(--ok)}.toggle:after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}.toggle.off{border-color:#94a3b8;background:#cbd5e1}.toggle.off:after{right:20px}
.bar{height:7px;overflow:hidden;border-radius:2px;background:#e2e8f0}.bar i{display:block;height:100%;background:var(--blue)}
.mt{margin-top:16px}.note{padding:12px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:7px;background:#f8fafc;color:var(--muted);font-size:11.5px;line-height:1.7}
.grid-item{animation:enter .4s backwards cubic-bezier(.2,.8,.2,1)}.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(21,128,61,0)}}@keyframes scan{50%{top:54px}}
@media(max-width:1100px){.k4,.iboard,.imgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.shell{display:block}.side{position:static;width:auto;height:auto;padding:12px}.brand{padding:0 4px 12px}.foot{display:none}.nav{display:flex;overflow-x:auto;margin-top:10px;padding-bottom:4px}.nav button{width:auto;flex:none}.nav .n{display:none}.top{top:0;padding:13px 16px}.wrap{padding:18px 16px 44px}.c23,.c12{grid-template-columns:1fr}}
@media(max-width:560px){.brand small,.nav .tx{display:none}.nav button{min-width:44px;justify-content:center;padding:10px}.top{align-items:flex-start}.top h1{font-size:17px}.top .sub{max-width:210px}.live{padding:7px;font-size:0}.live:after{content:"連線正常";font-size:10px}.k4,.k3,.iboard,.imgrid{grid-template-columns:1fr}.scanhead{align-items:flex-start;padding:18px}.scanhead .big{font-size:17px}.scan-total{width:100%;text-align:left}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.grid-item{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<div class="brand"><div class="logo"><span class="material-symbols-outlined">shield</span></div><div><b>PokaGuard</b><small>防呆稽核平台</small></div></div>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
<div class="foot">產線 A｜第二廠<br>版本 v3.9 · MES/SFC 整合<br>© 2026 Jvision 智慧製造</div>
</aside>
<main class="main">
<header class="top"><div><h1 id="ttl">—</h1><div class="sub" id="sub">—</div></div><div class="live"><span class="dot"></span>連線正常 · 攔截引擎運轉中</div></header>
<div class="wrap"><div id="view"></div></div>
</main>
</div>
<script>
const SCREENS=[
["qr_code_scanner","條碼防呆比對","上料掃碼即時比對工單 BOM，錯料立即阻擋"],
["linked_services","製程連鎖攔截","前工序未完/參數超標即鎖定設備，禁止流入下站"],
["photo_camera","影像防呆檢測","AOI 視覺比對方向、極性、漏裝並判定 OK/NG"],
["gpp_maybe","異常攔截處置","攔截事件推播、線長覆核與放行授權留痕"],
["verified_user","防呆規則設定","維護防呆點、扭力/數量門檻與連鎖條件"],
["insights","防呆成效分析","攔截率、誤操作事件與漏檢逃逸統計趨勢"]
];
let charts=[];
const $=id=>document.getElementById(id);
const icon=n=>`<span class="material-symbols-outlined">${n}</span>`;
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function chart(id,cfg){const node=$(id);if(node)charts.push(new Chart(node,cfg))}
Chart.defaults.font.family="'Fira Sans',sans-serif";Chart.defaults.color="#475569";
function kpi(i,c,b,l,v,u,d,x){return `<div class="kpi grid-item" style="--kpi:${c};--ico:${c};--ico-bg:${b}"><div class="ico">${icon(i)}</div><div class="lab">${l}</div><div class="val">${v} <small>${u}</small></div><div class="delta ${d}">${icon(d==="up"?"trending_up":"trending_down")}${x}</div></div>`}
function match(s,t,x){return `<div class="matchrow"><div class="ic" style="background:${s==="ok"?"var(--ok-bg)":"var(--danger-bg)"};color:${s==="ok"?"var(--ok)":"var(--danger)"}">${icon(s==="ok"?"task_alt":"cancel")}</div><div class="info"><b>${t}</b><span>${x}</span></div><span class="pill ${s==="ok"?"p-ok":"p-ng"}">${s==="ok"?"符合":"攔截"}</span></div>`}
function screen0(){
const logs=[["08:42:16","C0402-104K","OK"],["08:42:09","C0402-104K","OK"],["08:41:58","R33-333","OK"],["08:41:44","C0104-錯置","NG"],["08:41:31","C0603-475K","OK"],["08:41:22","U12-STM32","OK"],["08:41:05","LOT-過期","NG"],["08:40:51","J01-連接器","OK"]];
return `<section class="scanhead grid-item"><div class="laser">${icon("barcode_reader")}</div><div style="min-width:0;flex:1"><div class="lab">目前掃描工單 · WO-24-0817-03</div><div class="big">PCBA 主板組裝 · 站別 ST-04</div><div class="lab" style="margin-top:5px">操作員 陳建宏 · 08:42:17 · 第 128 片</div></div><div class="scan-total"><div class="lab">本班掃描</div><div class="big">1,284</div></div></section>
<div class="grid k4 mt">${kpi("qr_code_2","#2563eb","#dbeafe","本班掃描筆數","1,284","筆","up","即時累計")}${kpi("block","#dc2626","#fee2e2","錯料攔截","23","次","down","-38% vs 昨")}${kpi("check_circle","#15803d","#dcfce7","比對通過率","98.2","%","up","+0.6%")}${kpi("timer","#ea580c","#ffedd5","平均比對耗時","0.34","秒","up","-0.05s")}</div>
<div class="grid c23 mt"><section class="card grid-item"><div class="ct">${icon("fact_check")}<b>當前掃描比對明細</b><span class="tag">WO-24-0817-03</span></div>${match("ok","料號比對 · C0402-104K","BOM 需求 C0402-104K｜掃得 C0402-104K")}${match("ok","批號效期 · LOT-2604-A17","效期 2026-11-30 · 未過期")}${match("ok","站別權限 · ST-04","操作員具備 SMT 認證")}${match("ng","上料槽位 · Feeder #7","應上 R33，實測偵測到 C104 錯置")}<div class="alert">${icon("gpp_bad")}偵測到料槽錯置，已阻擋貼裝並要求重新上料</div></section>
<section class="card grid-item"><div class="ct">${icon("history")}<b>最近掃碼</b></div>${logs.map(d=>`<div class="logrow"><span class="mono" style="font-size:10px;color:var(--muted)">${d[0]}</span><span class="mono" style="flex:1;font-size:11px">${d[1]}</span><span class="pill ${d[2]==="NG"?"p-ng":"p-ok"}">${d[2]}</span></div>`).join("")}</section></div>`}
function screen1(){
const stations=[["run","ST-01 錫膏印刷","作業中","OP 王琳｜良品 214","循環 32s"],["run","ST-02 SPI 檢測","作業中","自動｜通過 98.4%","循環 18s"],["run","ST-03 貼片 SMT","作業中","OP 陳建宏｜貼裝 128","循環 41s"],["lock","ST-04 回焊爐","已鎖定","上游 SPI 判 NG 未處置","連鎖阻斷"],["wait","ST-05 AOI 檢查","待料","上游未放行","閒置 6m"],["wait","ST-06 ICT 測試","待料","前工序未完成","閒置 6m"],["run","ST-07 分板","作業中","OP 林佳蓉｜分板 96","循環 12s"],["run","ST-08 包裝入庫","作業中","OP 張士豪｜入庫 88","循環 25s"]];
const rules=[["IL-14","SPI 判 NG 未覆核 → 鎖回焊爐","ST-04","觸發中","p-ng"],["IL-07","上游未報完工 → 鎖下站","ST-05/06","觸發中","p-wa"],["IL-22","扭力未達 8.0N·m → 鎖鎖附","ST-07","監控中","p-ok"],["IL-31","首件未確認 → 鎖批量生產","全線","監控中","p-ok"],["IL-09","治具版本不符 → 鎖上料","ST-03","監控中","p-ok"]];
return `<div class="grid k4">${kpi("link","#2563eb","#dbeafe","連鎖規則啟用","42","條","up","全線覆蓋")}${kpi("lock","#dc2626","#fee2e2","目前鎖定站別","1","站","down","ST-04")}${kpi("pending_actions","#a16207","#fef3c7","待放行工序","2","站","down","等候處置")}${kpi("bolt","#15803d","#dcfce7","阻斷回應時間","120","ms","up","即時鎖機")}</div>
