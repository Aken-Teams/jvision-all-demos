<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>眼鏡門市管理 · Jvision Optical SaaS</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --red:#dc2626; --orange:#f97316; --ink:#1f2430; --muted:#6b7280;
  --line:#eceef2; --bg:#f5f6f8; --card:#ffffff; --soft:#fef2f2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}

.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--orange));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(220,38,38,.28);}
.logo .material-symbols-outlined{font-size:22px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px;}
.brand p{font-size:11px;margin:0;color:var(--muted);}
.spacer{flex:1;min-width:0;}
.store-pill{display:flex;align-items:center;gap:7px;background:var(--soft);color:var(--red);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;flex:none;}
.store-pill .material-symbols-outlined{font-size:16px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#334155,#0f172a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}

.nav{background:#fff;border-bottom:1px solid var(--line);}
.nav-inner{max-width:1360px;margin:0 auto;display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap;}
.navbtn{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
.navbtn .material-symbols-outlined{font-size:19px;}
.navbtn:hover{border-color:var(--red);color:var(--red);}
.navbtn.on{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(220,38,38,.25);}

main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.screen-head .t{min-width:0;}
.screen-head h2{margin:0;font-size:21px;font-weight:800;}
.screen-head p{margin:3px 0 0;font-size:13px;color:var(--muted);}
.chip{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px;flex:none;}
.chip .material-symbols-outlined{font-size:15px;}

.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.grid>*{min-width:0;}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--red);}
.card .sub{font-size:11px;color:var(--muted);margin:0 0 12px;}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px;}
.kpi .ico .material-symbols-outlined{font-size:21px;}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .val{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.5px;}
.kpi .dt{font-size:11px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;}
.kpi .dt .material-symbols-outlined{font-size:14px;}
.up{color:#16a34a;} .down{color:var(--red);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
tbody tr:hover{background:#fafbfc;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.tag .material-symbols-outlined{font-size:13px;}
.t-red{background:var(--soft);color:var(--red);}
.t-org{background:#fff7ed;color:#c2410c;}
.t-grn{background:#ecfdf5;color:#059669;}
.t-blu{background:#eff6ff;color:#2563eb;}
.t-gry{background:#f3f4f6;color:#4b5563;}
.mini{width:100%;height:6px;background:#f0f1f4;border-radius:6px;overflow:hidden;}
.mini>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--orange));}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#fbfbfc;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:800;}
.col-h .cdot{width:9px;height:9px;border-radius:50%;flex:none;}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:11px;padding:11px;margin-bottom:9px;}
.ticket:last-child{margin-bottom:0;}
.ticket .time{font-size:11px;font-weight:800;color:var(--red);display:flex;align-items:center;gap:5px;}
.ticket .nm{font-size:13px;font-weight:700;margin:5px 0 2px;}
.ticket .mt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}

.rxwrap{display:flex;gap:6px;flex-wrap:wrap;}
.rxbox{flex:1;min-width:90px;background:#fbfbfc;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center;}
.rxbox .k{font-size:11px;color:var(--muted);font-weight:700;}
.rxbox .v{font-size:19px;font-weight:800;margin-top:3px;}
.rxbox .u{font-size:10px;color:var(--muted);}

.mrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.mrow:last-child{border-bottom:none;}
.mrow .mav{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none;}
.mrow .mi{min-width:0;flex:1;}
.mrow .mi b{font-size:13px;}
.mrow .mi span{font-size:11px;color:var(--muted);display:block;}

.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlitem{position:relative;padding:0 0 16px;}
.tlitem:last-child{padding-bottom:0;}
.tldot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--red);}
.tlitem .th{font-size:12px;font-weight:800;}
.tlitem .tt{font-size:11px;color:var(--muted);}
.tlitem .td{font-size:12px;margin-top:3px;background:#fbfbfc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}

.funnel{display:flex;flex-direction:column;gap:8px;}
.fstep{display:flex;align-items:center;gap:10px;}
.fstep .fbar{height:34px;border-radius:9px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:800;font-size:13px;min-width:60px;}
.fstep .fmeta{font-size:12px;color:var(--muted);}
.fstep .fmeta b{color:var(--ink);}

.segrow{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.segrow .sn{width:88px;font-size:12px;font-weight:700;flex:none;}
.segrow .sv{width:56px;text-align:right;font-size:12px;font-weight:800;flex:none;}

.cdot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}

.foot{max-width:1360px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:11px;}

@media(max-width:560px){.navtxt{display:none;} .navbtn{padding:9px 11px;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">visibility</span></div>
      <div><h1>眼鏡門市管理</h1><p>Jvision Optical Store SaaS</p></div>
    </div>
    <div class="spacer"></div>
    <div class="store-pill"><span class="material-symbols-outlined">storefront</span>中山旗艦店</div>
    <div class="avatar">陳</div>
  </div>
</header>
<nav class="nav">
  <div class="nav-inner" id="nav"></div>
</nav>
<main><div id="app"></div></main>
<div class="foot">Jvision 眼鏡門市預約會員經營 Demo · 純前台展示，資料皆為模擬 · #dc2626 / #f97316</div>

<script>
var CH = [];
function killCharts(){ CH.forEach(function(c){ try{c.destroy();}catch(e){} }); CH=[]; }
function px(v){ return (v||0).toLocaleString('en-US'); }

var NAV = [
  {icon:"view_kanban",   t:"預約看板"},
  {icon:"visibility",    t:"驗光處方"},
  {icon:"diversity_3",   t:"會員 CRM"},
  {icon:"chat",          t:"LINE 推播"},
  {icon:"inventory_2",   t:"進銷存"},
  {icon:"insights",      t:"營運分析"}
];

var nav = document.getElementById("nav");
NAV.forEach(function(n,i){
  var b=document.createElement("button");
  b.className="navbtn"; b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+n.icon+'</span><span class="navtxt">'+n.t+'</span>';
  b.addEventListener("click",function(){ show(i); });
  nav.appendChild(b);
});

var boardCols=[
  {name:"待報到",color:"#f97316",items:[
    {time:"10:00",nm:"林佩",tag:"驗光",who:"王",t:"t-org"},
    {time:"10:30",nm:"張哲宇",tag:"配鏡諮詢",who:"李",t:"t-blu"},
    {time:"11:15",nm:"黃思婷",tag:"隱形眼鏡",who:"王",t:"t-grn"}
  ]},
  {name:"驗光中",color:"#dc2626",items:[
    {time:"09:40",nm:"陳冠廷",tag:"複驗",who:"周",t:"t-red"},
    {time:"10:10",nm:"吳雅琪",tag:"兒童視力",who:"李",t:"t-blu"}
  ]},
  {name:"選配 / 製作",color:"#2563eb",items:[
    {time:"09:00",nm:"劉建宏",tag:"漸進多焦",who:"周",t:"t-blu"},
    {time:"09:20",nm:"蔡宜芳",tag:"抗藍光",who:"王",t:"t-org"},
    {time:"09:35",nm:"許志偉",tag:"變色片",who:"李",t:"t-gry"}
  ]},
  {name:"待取件",color:"#059669",items:[
    {time:"昨 18:00",nm:"鄭雅文",tag:"已完工",who:"周",t:"t-grn"},
    {time:"昨 19:10",nm:"謝孟儒",tag:"待通知",who:"王",t:"t-org"}
  ]}
];

var rxRows=[
  {eye:"右眼 OD",sph:"-2.75",cyl:"-0.50",axis:"180",add:"+1.00"},
  {eye:"左眼 OS",sph:"-3.00",cyl:"-0.75",axis:"175",add:"+1.00"}
];

var members=[
  {nm:"鄭雅文",lv:"鑽石",c:"#dc2626",spend:48200,visit:14,risk:"t-grn",rk:"回訪達成"},
  {nm:"謝孟儒",lv:"白金",c:"#f97316",spend:31600,visit:9,risk:"t-org",rk:"30天內回購"},
  {nm:"林佩",lv:"黃金",c:"#eab308",spend:18400,visit:6,risk:"t-blu",rk:"待回訪"},
  {nm:"張哲宇",lv:"銀卡",c:"#64748b",spend:9800,visit:3,risk:"t-red",rk:"90天未到店"},
  {nm:"黃思婷",lv:"黃金",c:"#eab308",spend:15200,visit:5,risk:"t-grn",rk:"回訪達成"}
];

var stock=[
  {sku:"FR-3410",nm:"鈦金屬光學框 · 玳瑁",cat:"鏡框",qty:6,rop:8,st:"t-red",sl:"低於安全量"},
  {sku:"LN-1189",nm:"1.60 抗藍光非球面",cat:"鏡片",qty:42,rop:20,st:"t-grn",sl:"充足"},
  {sku:"CL-0725",nm:"日拋隱形眼鏡 30入",cat:"隱眼",qty:14,rop:24,st:"t-org",sl:"建議補貨"},
  {sku:"FR-2205",nm:"膠框圓框 · 透明",cat:"鏡框",qty:19,rop:10,st:"t-grn",sl:"充足"},
  {sku:"LN-2260",nm:"漸進多焦 1.67",cat:"鏡片",qty:3,rop:6,st:"t-red",sl:"低於安全量"},
  {sku:"CL-0930",nm:"月拋散光片 6入",cat:"隱眼",qty:27,rop:18,st:"t-grn",sl:"充足"}
];

function head(ic,t,d,chip){
  return '<div class="screen-head"><div class="t"><h2>'+t+'</h2><p>'+d+'</p></div>'+
    '<div class="chip"><span class="material-symbols-outlined">'+ic+'</span>'+chip+'</div></div>';
}
function kpi(c,ic,lab,val,dt,dir){
  return '<div class="kpi"><div class="ico" style="background:'+c+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+'</div>'+
    '<div class="dt '+dir+'"><span class="material-symbols-outlined">'+(dir=="up"?"trending_up":"trending_down")+'</span>'+dt+'</div></div>';
}
function rxbox(k,v,u){ return '<div class="rxbox"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="u">'+u+'</div></div>'; }
function chk(t,done){
  return '<div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)">'+
    '<span class="material-symbols-outlined" style="font-size:20px;color:'+(done?'#059669':'#cbd5e1')+'">'+(done?'check_circle':'radio_button_unchecked')+'</span>'+
    '<span style="font-size:13px;font-weight:600;'+(done?'':'color:var(--muted)')+'">'+t+'</span>'+
    (done?'<span class="tag t-grn" style="margin-left:auto">完成</span>':'<span class="tag t-org" style="margin-left:auto">待處理</span>')+'</div>';
}
function segbar(n,v,p,c){
  return '<div class="segrow"><div class="sn">'+n+'</div>'+
    '<div class="mini" style="flex:1"><i style="width:'+p+'%;background:'+c+'"></i></div>'+
    '<div class="sv">$'+(v/10000).toFixed(0)+'萬</div></div>';
}
function ex(t,ic,ti,de){
  return '<div style="display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)">'+
    '<span class="tag '+t+'" style="height:26px;flex:none"><span class="material-symbols-outlined">'+ic+'</span></span>'+
    '<div style="min-width:0"><div style="font-size:13px;font-weight:700">'+ti+'</div><div style="font-size:11px;color:var(--muted)">'+de+'</div></div></div>';
}

function s0(){
  var cols=boardCols.map(function(c){
    var items=c.items.map(function(it){
      return '<div class="ticket" style="border-left-color:'+c.color+'">'+
        '<div class="time"><span class="material-symbols-outlined">schedule</span>'+it.time+'</div>'+
        '<div class="nm">'+it.nm+'</div>'+
        '<div class="mt"><span class="tag '+it.t+'">'+it.tag+'</span><span class="ava">'+it.who+'</span></div>'+
      '</div>';
    }).join('');
    return '<div class="col"><div class="col-h"><span class="cdot" style="background:'+c.color+'"></span>'+c.name+
      '<span class="cnt">'+c.items.length+'</span></div>'+items+'</div>';
  }).join('');
  return head("view_kanban","24H 預約看板","顧客到店動線一覽 · 看板管理驗光與配鏡進度","即時 · 今日 11 筆")+
   '<div class="grid g4" style="margin-bottom:14px">'+
     kpi("#dc2626","event_available","今日預約","28","+6 vs 昨","up")+
     kpi("#f97316","how_to_reg","已報到","11","39% 進場","up")+
     kpi("#2563eb","hourglass_top","平均等候","8.5 分","-2.1 分","up")+
     kpi("#059669","local_mall","待取件","2","今日通知","down")+
   '</div>'+
   '<div class="card"><h3><span class="material-symbols-outlined">dashboard</span>門市作業看板</h3>'+
   '<p class="sub">依時段自動排入驗光師，狀態流轉：待報到 → 驗光中 → 選配製作 → 待取件</p>'+
   '<div style="overflow-x:auto"><div class="board">'+cols+'</div></div></div>';
}

function s1(){
  var rx=rxRows.map(function(r){
    return '<tr><td><b>'+r.eye+'</b></td><td>'+r.sph+'</td><td>'+r.cyl+'</td><td>'+r.axis+'°</td><td>'+r.add+'</td></tr>';
  }).join('');
  return head("visibility","驗光處方","屈光檢查、瞳距與處方紀錄 · 配鏡選片建議","顧客：陳冠廷 · 複驗")+
   '<div class="grid g32">'+
     '<div class="card"><h3><span class="material-symbols-outlined">description</span>本次處方單</h3>'+
       '<p class="sub">驗光師：周宗翰 · 2026-08-13</p>'+
       '<div class="rxwrap" style="margin-bottom:14px">'+
         rxbox("PD 瞳距","62","mm")+rxbox("裸視","0.3","OD/OS")+rxbox("矯正視力","1.0","雙眼")+rxbox("建議鏡片","1.60","抗藍光")+
       '</div>'+
       '<div style="overflow-x:auto"><table><thead><tr><th>眼別</th><th>球面 SPH</th><th>散光 CYL</th><th>軸度 AXIS</th><th>ADD</th></tr></thead><tbody>'+rx+'</tbody></table></div>'+
     '</div>'+
     '<div class="card"><h3><span class="material-symbols-outlined">radar</span>視覺需求評估</h3>'+
       '<p class="sub">依用眼情境評估選片方向</p>'+
       '<div id="c_rx" style="min-height:280px"></div>'+
     '</div>'+
   '</div>'+
   '<div class="grid g2" style="margin-top:14px">'+
     '<div class="card"><h3><span class="material-symbols-outlined">timeline</span>近一年度數趨勢</h3><p class="sub">追蹤近視加深情形</p><div id="c_trend" style="min-height:230px"></div></div>'+
     '<div class="card"><h3><span class="material-symbols-outlined">checklist</span>驗光流程檢核</h3><p class="sub">本次已完成項目</p>'+
       chk("問診與病史",1)+chk("裸視與電腦驗光",1)+chk("綜合驗光 (自覺式)",1)+chk("瞳距與鏡框調整",1)+chk("處方確認與簽核",0)+
     '</div>'+
   '</div>';
}

function s2(){
  var rows=members.map(function(m){

function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  btns.forEach(function(b){ b.classList.toggle("on", +b.getAttribute("data-i")===i); });
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  void app.offsetHeight;
  initCharts(i);
}

if(!location.hash){show(0);}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
