<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>眼鏡門市管理 · Jvision Optical SaaS</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;

  --red:#dc2626;
  --orange:#ea580c;
  --bg:#ecfdf5;
  --card:#ffffff;
  --soft:#d1fae5;
  --black:#071d16;
  --shadow:#064e3b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(var(--color-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-border) 1px,transparent 1px),
    var(--color-background);
  background-size:42px 42px;
  color:var(--color-foreground);
  font-family:"Nunito Sans",sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-bottom:3px solid var(--black);
}
.topbar-inner{
  width:min(100%,1440px);
  min-height:76px;
  margin:auto;
  padding:10px 22px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  background:var(--color-accent);
  color:var(--black);
  border:3px solid var(--black);
  box-shadow:5px 5px 0 var(--black);
}
.logo .material-symbols-outlined{font-size:28px;font-weight:700}
.brand h1{
  margin:0;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:20px;
  font-weight:900;
  letter-spacing:-.4px;
  line-height:1.1;
}
.brand p{
  margin:3px 0 0;
  color:#071d16;
  font-family:"Rubik",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.spacer{flex:1}
.store-pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  flex:none;
  background:#fff;
  border:2px solid var(--black);
  color:var(--black);
  font-size:12px;
  font-weight:900;
  box-shadow:3px 3px 0 var(--black);
}
.store-pill .material-symbols-outlined{font-size:18px}
.avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  background:var(--black);
  border:2px solid var(--black);
  color:#fff;
  font-family:"Rubik",sans-serif;
  font-size:13px;
  font-weight:900;
}
.nav{
  position:sticky;
  top:76px;
  z-index:35;
  background:#fff;
  border-bottom:3px solid var(--black);
}
.nav-inner{
  width:min(100%,1440px);
  margin:auto;
  display:flex;
  gap:0;
  padding:0 22px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.navbtn{
  min-height:50px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:8px 17px;
  border:0;
  border-left:2px solid var(--black);
  background:#fff;
  color:var(--color-muted-foreground);
  white-space:nowrap;
  font-size:13px;
  font-weight:900;
}
.navbtn:last-child{border-right:2px solid var(--black)}
.navbtn .material-symbols-outlined{font-size:20px}
.navbtn:hover{background:var(--color-muted);color:var(--black)}
.navbtn.on{
  background:var(--color-accent);
  color:var(--black);
  box-shadow:inset 0 -7px 0 var(--black);
}
main{
  width:min(100%,1440px);
  min-height:calc(100vh - 190px);
  margin:auto;
  padding:26px 22px 70px;
}
.screen-head{
  position:relative;
  display:flex;
  align-items:flex-end;
  gap:18px;
  margin:0 0 22px;
  padding:18px 20px;
  background:var(--black);
  border:3px solid var(--black);
  color:#fff;
  box-shadow:8px 8px 0 var(--color-secondary);
}
.screen-head:before{
  content:"STORE / LIVE";
  position:absolute;
  top:-13px;
  left:22px;
  padding:2px 9px;
  background:var(--color-accent);
  border:2px solid var(--black);
  color:var(--black);
  font-family:"Rubik",sans-serif;
  font-size:10px;
  font-weight:900;
  letter-spacing:.1em;
}
.screen-head .t{min-width:0}
.screen-head h2{
  margin:0;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:clamp(25px,4vw,42px);
  font-weight:900;
  letter-spacing:-1.4px;
  line-height:1;
}
.screen-head p{
  margin:8px 0 0;
  color:#d1fae5;
  font-size:13px;
  font-weight:700;
}
.chip{
  margin-left:auto;
  padding:8px 12px;
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--color-secondary);
  border:2px solid #fff;
  color:var(--black);
  font-size:12px;
  font-weight:900;
}
.chip .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:16px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:3px solid var(--black);
  color:var(--color-card-foreground);
  box-shadow:7px 7px 0 var(--shadow);
}
.card{padding:18px}
.card:nth-child(even){box-shadow:7px 7px 0 var(--color-accent)}
.card h3{
  margin:0 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:-.2px;
}
.card h3 .material-symbols-outlined{
  display:grid;
  width:29px;
  height:29px;
  place-items:center;
  background:var(--color-primary);
  border:2px solid var(--black);
  color:var(--black);
  font-size:18px;
}
.card .sub{
  margin:0 0 14px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
}
.kpi{
  position:relative;
  min-height:170px;
  padding:15px;
  overflow:hidden;
}
.kpi:after{
  content:"";
  position:absolute;
  right:-31px;
  bottom:-31px;
  width:80px;
  height:80px;
  background:var(--color-border);
  border:3px solid var(--black);
  transform:rotate(45deg);
}
.kpi:nth-child(even){transform:translateY(10px)}
.kpi .ico{
  width:42px;
  height:42px;
  margin-bottom:14px;
  display:grid;
  place-items:center;
  border:2px solid var(--black);
  color:var(--black)!important;
  box-shadow:3px 3px 0 var(--black);
}
.kpi .ico .material-symbols-outlined{font-size:23px;font-weight:700}
.kpi .lab{
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:800;
}
.kpi .val{
  margin-top:1px;
  color:var(--black);
  font-family:"Rubik",sans-serif;
  font-size:30px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-1px;
}
.kpi .dt{
  margin-top:7px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 6px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:900;
}
.kpi .dt .material-symbols-outlined{font-size:15px}
.up{color:#047857}
.down{color:#b91c1c}
table{
  width:100%;
  border-collapse:collapse;
  color:var(--color-card-foreground);
  font-size:13px;
}
th,td{
  padding:11px 10px;
  border:2px solid var(--black);
  text-align:left;
  white-space:nowrap;
}
th{
  background:var(--color-primary);
  color:var(--black);
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:var(--color-muted)}
tbody tr:hover{background:#d1fae5}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  color:var(--black);
  font-size:11px;
  font-weight:900;
  line-height:1.4;
}
.tag .material-symbols-outlined{font-size:14px}
.t-red{background:#fee2e2;color:#991b1b}
.t-org{background:#ffedd5;color:#9a3412}
.t-grn{background:#d1fae5;color:#065f46}
.t-blu{background:#dbeafe;color:#1e40af}
.t-gry{background:#e2e8f0;color:#334155}
.mini{
  width:100%;
  height:10px;
  overflow:hidden;
  background:#e2e8f0;
  border:1px solid var(--black);
}
.mini>i{
  display:block;
  height:100%;
  background:var(--color-primary)!important;
}
.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  min-width:920px;
}
.col{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:2px solid var(--black);
}
.col:nth-child(even){transform:translateY(12px)}
.col-h{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:2px solid var(--black);
  color:var(--black);
  font-family:"Rubik",sans-serif;
  font-size:13px;
  font-weight:900;
}
.col-h .cnt{
  margin-left:auto;
  min-width:24px;
  padding:1px 7px;
  background:#fff;
  border:2px solid var(--black);
  color:var(--black);
  text-align:center;
  font-family:"Rubik",sans-serif;
  font-size:11px;
}
.cdot{
  width:10px;
  height:10px;
  display:inline-block;
  flex:none;
  border:1px solid var(--black);
}
.ticket{
  margin-bottom:9px;
  padding:11px;
  background:#fff;
  border:2px solid var(--black);
  border-left-width:7px;
  box-shadow:3px 3px 0 var(--black);
}
.ticket:last-child{margin-bottom:0}
.ticket .time{
  display:flex;
  align-items:center;
  gap:5px;
  color:#065f46;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  font-weight:900;
}
.ticket .time .material-symbols-outlined{font-size:15px}
.ticket .nm{margin:7px 0 4px;color:var(--black);font-size:14px;font-weight:900}
.ticket .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ava{
  width:24px;
  height:24px;
  display:inline-grid;
  place-items:center;
  background:var(--black)!important;
  border:1px solid var(--black);
  color:#fff;
  font-size:10px;
  font-weight:900;
}
.rxwrap{display:flex;gap:8px;flex-wrap:wrap}
.rxbox{
  min-width:90px;
  flex:1;
  padding:11px;
  background:var(--color-muted);
  border:2px solid var(--black);
  text-align:center;
}
.rxbox .k{color:var(--color-muted-foreground);font-size:11px;font-weight:800}
.rxbox .v{
  margin-top:3px;
  color:var(--black);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:20px;
  font-weight:900;
}
.rxbox .u{color:var(--color-muted-foreground);font-size:10px}
.mrow{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:2px solid var(--black);
}
.mrow:last-child{border-bottom:0}
.mrow .mav{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid var(--black);
  color:var(--black)!important;
  font-size:14px;
  font-weight:900;
  box-shadow:3px 3px 0 var(--black);
}
.mrow .mi{min-width:0;flex:1}
.mrow .mi b{font-size:13px;font-weight:900}
.mrow .mi span{display:block;color:var(--color-muted-foreground);font-size:11px}
.tl{position:relative;padding-left:25px}
.tl:before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:7px;
  width:3px;
  background:var(--black);
}
.tlitem{position:relative;padding:0 0 17px}
.tlitem:last-child{padding-bottom:0}
.tldot{
  position:absolute;
  top:2px;
  left:-25px;
  width:16px;
  height:16px;
  background:var(--color-accent);
  border:3px solid var(--black);
}
.tlitem .th{font-size:13px;font-weight:900}
.tlitem .tt{
  color:var(--color-muted-foreground);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
}
.tlitem .td{
  margin-top:5px;
  padding:9px 10px;
  background:var(--color-muted);
  border:2px solid var(--black);
  font-size:12px;
}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:flex;align-items:center;gap:10px}
.fstep .fbar{
  min-width:72px;
  height:36px;
  display:flex;
  align-items:center;
  padding:0 11px;
  border:2px solid var(--black);
  color:var(--black);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px;
  font-weight:900;
}
.fstep .fmeta{color:var(--color-muted-foreground);font-size:12px}
.fstep .fmeta b{color:var(--black)}
.segrow{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.segrow .sn{width:92px;flex:none;font-size:12px;font-weight:900}
.segrow .sv{
  width:60px;
  flex:none;
  text-align:right;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;
  font-weight:900;
}
.legend{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:12px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:700;
}
.legend span{display:flex;align-items:center;gap:5px}
.foot{
  width:min(100%,1440px);
  margin:auto;
  padding:0 22px 40px;
  color:#334155;
  font-size:11px;
  font-weight:700;
}
.mono,td:first-child,.time{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.num{text-align:right;font-variant-numeric:tabular-nums}
.apexcharts-text{font-family:"Nunito Sans",sans-serif!important}
.apexcharts-legend-text{color:var(--color-muted-foreground)!important}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar-inner{padding-inline:14px}
  .nav{top:76px}
  .nav-inner{padding-inline:14px}
  main{padding:24px 14px 60px}
  .screen-head{align-items:flex-start;flex-direction:column}
  .chip{margin-left:0}
  .g2,.g3{grid-template-columns:1fr}
  .card,.kpi{box-shadow:5px 5px 0 var(--shadow)}
  .card:nth-child(even){box-shadow:5px 5px 0 var(--color-accent)}
}
@media(max-width:560px){
  .brand p{display:none}
  .store-pill{max-width:142px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avatar{display:none}
  .navtxt{display:none}
  .navbtn{min-width:52px;padding:8px 15px}
  .g4{grid-template-columns:1fr}
  .kpi:nth-child(even),.col:nth-child(even){transform:none}
  .screen-head h2{font-size:30px}
}
@media(prefers-reduced-motion:no-preference){
  #app>.screen-head,
  #app>.grid,
  #app>.card{
    animation:brutal-in .42s cubic-bezier(.2,.8,.2,1) both;
  }
  #app>.grid:nth-child(2){animation-delay:.06s}
  #app>.grid:nth-child(3),#app>.card:nth-child(3){animation-delay:.12s}
  .grid>.kpi,.grid>.card,.board>.col{
    animation:grid-in .4s cubic-bezier(.2,.85,.25,1.25) both;
  }
  .grid>:nth-child(2),.board>:nth-child(2){animation-delay:.06s}
  .grid>:nth-child(3),.board>:nth-child(3){animation-delay:.12s}
  .grid>:nth-child(4),.board>:nth-child(4){animation-delay:.18s}
  .navbtn:hover,.ticket:hover,.card:hover{
    transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease;
  }
  .ticket:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--black)}
  .card:hover{transform:translate(-1px,-1px)}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
@keyframes brutal-in{
  from{opacity:0;transform:translateY(16px) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">visibility</span></div>
      <div><h1>眼鏡門市管理</h1><p>Jvision Optical Store SaaS</p></div>
    </div>
    <div class="spacer"></div>
    <div class="store-pill"><span class="material-symbols-outlined">storefront</span>中山旗艦店</div>
    <div class="avatar">陳</div>
  </div>
</header>
<nav class="nav" aria-label="主要功能">
  <div class="nav-inner" id="nav"></div>
</nav>
<main><div id="app"></div></main>
<div class="foot">Jvision 眼鏡門市預約會員經營 Demo · 純前台展示，資料皆為模擬 · #059669 / #EA580C</div>

<script>
var CH=[];
function killCharts(){CH.forEach(function(c){try{c.destroy()}catch(e){}});CH=[]}
function px(v){return(v||0).toLocaleString("en-US")}

var NAV=[
  {icon:"view_kanban",t:"預約看板"},
  {icon:"visibility",t:"驗光處方"},
  {icon:"diversity_3",t:"會員 CRM"},
  {icon:"chat",t:"LINE 推播"},
  {icon:"inventory_2",t:"進銷存"},
  {icon:"insights",t:"營運分析"}
];

var nav=document.getElementById("nav");
NAV.forEach(function(n,i){
  var b=document.createElement("button");
  b.className="navbtn";
  b.type="button";
  b.setAttribute("data-i",i);
  b.setAttribute("aria-label",n.t);
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+n.icon+'</span><span class="navtxt">'+n.t+"</span>";
  b.addEventListener("click",function(){
    if(location.hash!=="#v"+i){location.hash="v"+i}else{show(i)}
  });
  nav.appendChild(b)
});

var boardCols=[
  {name:"待報到",color:"#ea580c",items:[

      dataLabels:{enabled:false},
      legend:{position:"top"},
      grid:{borderColor:"#a7f3d0"}
    });

      chart:{type:"pie",height:250},

    })
  }else if(i===5){
    chart("#c_rev",{
      chart:{type:"line",height:280,stacked:false},
      series:[
        {name:"營收(萬)",type:"column",data:[38,42,45,41,48,52]},

}

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  btns.forEach(function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false")
  });
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  void app.offsetHeight;
  initCharts(i)
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
