<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Factory Copilot（AI工廠智慧助理）｜Jvision 系統 Demo</title>
<meta name="description" content="自然語言查詢生產數據、異常事件自動摘要、跨系統知識問答" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:var(--color-background);
  --card:var(--color-card);
  --soft:var(--color-muted);
  --ok:#15803D;
  --warn:#B45309;
  --bad:var(--color-destructive);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Fira Sans",system-ui,sans-serif;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input{font:inherit}
button,[role="button"],.chip{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.35);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.mono,time,td:nth-last-child(-n+2){font-family:"Fira Code",monospace}
.wrap{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  position:sticky;
  top:0;
  width:272px;
  height:100vh;
  flex:none;
  background:rgba(255,255,255,.96);
  border-right:1px solid var(--line);
  padding:22px 16px 18px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:20;
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;border-bottom:1px solid var(--line)}
.brand .logo{
  width:42px;height:42px;flex:none;border-radius:8px;
  background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  color:var(--color-on-primary);
  box-shadow:4px 4px 0 #BFDBFE;
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;display:block;line-height:1.25;letter-spacing:-.01em}
.brand span:not(.material-symbols-outlined){font-size:11px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{
  position:relative;
  display:flex;align-items:center;gap:12px;
  min-width:0;
  padding:11px 12px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  white-space:nowrap;
  font-size:13.5px;
  font-weight:600;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav-btn::before{
  content:"";
  position:absolute;
  left:-17px;
  width:3px;
  height:22px;
  background:transparent;
}
.nav-btn .material-symbols-outlined{font-size:20px;flex:none}
.nav-btn small{display:block;margin-top:2px;font-size:10px;font-weight:400;color:#64748B}
.nav-btn:hover{background:#F1F5F9;color:var(--blue);transform:translateX(2px)}
.nav-btn.active{
  background:#EFF6FF;
  border-color:#BFDBFE;
  color:#1D4ED8;
}
.nav-btn.active::before{background:var(--blue)}
.nav-btn.active small{color:#475569}
.side-foot{
  margin-top:auto;
  padding:16px 8px 2px;
  border-top:1px solid var(--line);
  color:#64748B;
  font:10.5px/1.7 "Fira Code",monospace;
}
.side-foot::before{
  content:"ONLINE";
  display:inline-block;
  margin-right:7px;
  padding:2px 6px;
  border:1px solid #86EFAC;
  border-radius:4px;
  color:#166534;
  background:#F0FDF4;
  font-size:9px;
  font-weight:700;
}
.main{flex:1 1 auto;min-width:0;padding:28px clamp(18px,3vw,44px) 56px}
.top{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin:0 auto 22px;
  padding:0 0 19px;
  max-width:1500px;
  border-bottom:1px solid var(--line);
}
.top::after{
  content:"";
  position:absolute;
  bottom:-1px;left:0;
  width:72px;height:3px;
  background:var(--blue);
}
.top h1{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:700;letter-spacing:-.035em}
.top p{margin:6px 0 0;max-width:720px;font-size:13px;line-height:1.55;color:var(--muted)}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  flex:none;
  padding:8px 12px;
  border:1px solid #BFDBFE;
  border-radius:6px;
  background:#EFF6FF;
  color:#1D4ED8;
  font:600 11px "Fira Code",monospace;
}
.pill .material-symbols-outlined{font-size:16px}
#view{max-width:1500px;margin:auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
.card,.sug,.kb-item{
  animation:card-enter .4s both cubic-bezier(.2,.85,.35,1.2);
}
.grid>.card:nth-child(2),.grid>.sug:nth-child(2){animation-delay:.06s}
.grid>.card:nth-child(3),.grid>.sug:nth-child(3){animation-delay:.12s}
.grid>.card:nth-child(4),.grid>.sug:nth-child(4){animation-delay:.18s}
@keyframes card-enter{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:none}
}
.card{
  position:relative;
  min-width:0;
  padding:19px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:0 2px 3px rgba(15,23,42,.05),0 12px 30px rgba(15,23,42,.07)}
.card h3{margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card .sub{margin:0 0 15px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:7px;border-top:3px solid #DBEAFE}
.kpi .lab{
  display:flex;align-items:center;gap:7px;
  color:var(--muted);font-size:11.5px;font-weight:600;
}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--blue)}
.kpi .val{
  font:700 clamp(24px,2.3vw,31px)/1.1 "Fira Code",monospace;
  letter-spacing:-.06em;
}
.kpi .val small{font:600 12px "Fira Sans",sans-serif;color:var(--muted);letter-spacing:0}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.delta.up{color:#166534}
.delta.down{color:#B91C1C}
.delta .material-symbols-outlined{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{
  background:#F8FAFC;
  color:#475569;
  font:600 10.5px "Fira Code",monospace;
  letter-spacing:.05em;
  text-transform:uppercase;
}
td:nth-child(3){font-variant-numeric:tabular-nums}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
tbody tr:last-child td{border-bottom:0}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10.5px;
  font-weight:600;
  line-height:1;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.g{background:#F0FDF4;color:#166534}
.tag.y{background:#FFFBEB;color:#92400E}
.tag.r{background:#FEF2F2;color:#B91C1C}
.tag.b{background:#EFF6FF;color:#1D4ED8}
.tag.gray{background:#F1F5F9;color:#475569}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{
  width:32px;height:32px;flex:none;
  border:1px solid var(--line);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
}
.msg .av .material-symbols-outlined{font-size:18px}
.msg.u .av{background:#F8FAFC;color:#475569}
.msg.a .av{background:var(--blue);border-color:var(--blue);color:#fff}
.bub{
  max-width:100%;min-width:0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#F8FAFC;
  font-size:13px;
  line-height:1.65;
}
.msg.u .bub{background:#fff}
.bub b{color:#1D4ED8}
.bub .cite{
  display:inline-flex;align-items:center;gap:4px;
  margin:7px 4px 0 0;
  padding:3px 7px;
  border:1px solid #BFDBFE;
  border-radius:4px;
  background:#EFF6FF;
  color:#1D4ED8;
  font:600 10px "Fira Code",monospace;
}
.qbar{
  display:flex;align-items:center;gap:9px;
  margin-top:17px;padding:7px 7px 7px 12px;
  border:1px solid #93C5FD;
  border-radius:7px;
  background:#fff;
  box-shadow:0 0 0 3px rgba(37,99,235,.06);
}
.qbar:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.qbar>.material-symbols-outlined{color:var(--blue);font-size:19px}
.qbar input{
  flex:1;min-width:0;
  border:0;outline:0;
  background:transparent;color:var(--ink);
  font-size:12.5px;
}
.go,.b-ok{
  min-height:34px;
  padding:7px 15px;
  border:1px solid #C2410C;
  border-radius:5px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  font-weight:700;
  font-size:12px;
  box-shadow:0 2px 0 #9A3412;
  transition:background-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.go:hover,.b-ok:hover{background:#C2410C;color:#fff;transform:translateY(-1px)}
.go:active,.b-ok:active{transform:translateY(1px);box-shadow:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#F8FAFC;
  color:#1D4ED8;
  font-size:11px;font-weight:600;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.chip:hover{background:#EFF6FF;border-color:#93C5FD;transform:translateY(-1px)}
.src-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:0}
.src-ico{
  width:38px;height:38px;flex:none;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.bar{height:7px;border-radius:2px;background:#E2E8F0;overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--blue)}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:#CBD5E1}
.tl-item{position:relative;padding:0 0 18px 7px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{
  content:"資訊";
  position:absolute;left:-24px;top:1px;
  width:15px;height:15px;
  border:2px solid var(--blue);
  border-radius:50%;
  background:#fff;
  overflow:hidden;text-indent:-999px;
}
.tl-item.warn::before{border-color:var(--warn);background:#FFFBEB}
.tl-item.bad::before{border-color:var(--bad);background:#FEF2F2}
.tl-item .tm{font:600 10.5px "Fira Code",monospace;color:var(--muted)}
.tl-item .tt{margin:3px 0;font-size:13px;font-weight:700}
.tl-item.warn .tt::before{content:"注意 · ";color:#92400E}
.tl-item.bad .tt::before{content:"高風險 · ";color:#B91C1C}
.tl-item .td{color:var(--muted);font-size:12px;line-height:1.55}
.sug{
  display:flex;flex-direction:column;gap:10px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  box-shadow:var(--shadow);
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.sug:hover{border-color:#93C5FD;transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.08)}
.sug .hd{display:flex;align-items:center;gap:10px}
.sug .ico{
  width:36px;height:36px;flex:none;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.sug .ico .material-symbols-outlined{font-size:19px}
.sug .tt{font-size:13.5px;font-weight:700}
.sug .impact{margin-top:2px;color:#166534;font-size:10.5px;font-weight:600}
.sug p{margin:0;color:#334155;font-size:12.5px;line-height:1.6}
.sug .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:auto}
.mini-cite{display:inline-flex;align-items:center;gap:4px;color:#1D4ED8;font:600 10px "Fira Code",monospace}
.btnrow{display:flex;gap:7px}
.b-gh{
  min-height:34px;padding:7px 13px;
  border:1px solid #CBD5E1;border-radius:5px;
  background:#fff;color:#334155;
  font-weight:600;font-size:12px;
  transition:background-color .2s ease,border-color .2s ease;
}
.b-gh:hover{background:#F1F5F9;border-color:#94A3B8}
.kb{display:flex;flex-direction:column;gap:8px}
.kb-item{
  display:flex;gap:11px;align-items:flex-start;
  padding:11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  transition:border-color .2s ease,background-color .2s ease,transform .2s ease;
}
.kb-item:hover{border-color:#93C5FD;background:#F8FAFC;transform:translateX(2px)}
.kb-item .kbi{
  width:36px;height:36px;flex:none;
  border-radius:5px;background:#EFF6FF;color:#1D4ED8;
  display:flex;align-items:center;justify-content:center;
}
.kb-item .kbi .material-symbols-outlined{font-size:19px}
.kb-item .kbt{font-size:12.5px;font-weight:700}
.kb-item .kbd{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.5}
.kb-item .score{flex:none;color:#1D4ED8;font:700 10.5px "Fira Code",monospace}
.matrix{width:100%;border-collapse:separate;border-spacing:5px}
.matrix td{padding:0;border:0;white-space:normal}
.mc{padding:9px 8px;border-radius:5px;text-align:center;color:var(--ink);font-size:11.5px;font-weight:700}
.mc small{display:block;font-size:9.5px;font-weight:500;opacity:.75}
.progress-wrap{display:flex;flex-direction:column;gap:12px}
.pg-row{display:flex;align-items:center;gap:11px}
.pg-row .nm{width:110px;flex:none;font-size:12px;font-weight:600}
.pg-row .num{width:52px;flex:none;text-align:right;font:700 11.5px "Fira Code",monospace}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11.5px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:-1px}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .wrap{flex-direction:column}
  .sidebar{
    position:sticky;width:auto;height:auto;
    flex-direction:row;flex-wrap:wrap;align-items:center;
    padding:11px 14px;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .brand{padding:0 14px 0 0;border:0}
  .brand .logo{width:36px;height:36px;box-shadow:3px 3px 0 #BFDBFE}
  nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px}
  .nav-btn{flex:none;padding:9px}
  .nav-btn::before,.nav-btn small,.side-foot{display:none}
  .main{padding:20px 15px 40px}
}
@media(max-width:620px){
  body{background-size:24px 24px}
  .sidebar{gap:9px}
  .brand{width:100%;padding-bottom:9px;border-bottom:1px solid var(--line)}
  nav{flex-wrap:nowrap;overflow-x:auto;padding:1px 1px 4px}
  .nav-btn span.lbl{display:none}
  .nav-btn{min-width:42px;justify-content:center}
  .top{align-items:flex-start;margin-bottom:16px}
  .top p{font-size:12px}
  .pill{position:sticky;top:10px;padding:7px 9px}
  .pill span:last-child{display:none}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .card{padding:15px}
  .qbar{align-items:stretch;flex-wrap:wrap}
  .qbar input{width:calc(100% - 32px)}
  .qbar .go{width:100%}
  .sug .foot{align-items:flex-start;flex-direction:column}
  .btnrow{width:100%}
  .btnrow button{flex:1}
  th,td{padding:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .card,.sug,.kb-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>AI Factory Copilot</b><span>AI 工廠智慧助理</span></div>
    </div>
    <nav id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">MES · OEE · CMMS 已連線<br />資料為示範用途</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="scr-title">—</h1>
        <p id="scr-sub">—</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">sync</span><span>即時同步 · 3 系統</span></div>
    </div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
{i:"forum",t:"自然語言問答",s:"以中文提問生產數據，AI 即時回覆並附引用來源"},
{i:"hub",t:"跨系統檢索",s:"串接 MES、OEE、CMMS 語意檢索，統一查詢入口"},
{i:"summarize",t:"異常事件摘要",s:"自動彙整停機、缺料、品質異常並生成事件摘要"},
{i:"lightbulb",t:"改善建議產出",s:"依瓶頸與根因分析產出可執行的改善建議"},
{i:"menu_book",t:"知識庫問答",s:"SOP、工藝參數與過往案例語意檢索與引用"},
{i:"fact_check",t:"決策採納追蹤",s:"記錄人員採納/駁回建議與成效追蹤"}
];
var navEl=document.getElementById("nav"),view=document.getElementById("view"),charts=[],cur=-1;
MODS.forEach(function(m,idx){
  var b=document.createElement("button");

function gid(id){return document.getElementById(id)}
function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy()}catch(e){}}charts=[]}
function mkChart(id,opt){
  var el=gid(id);if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.toolbar={show:false};
  opt.chart.fontFamily='"Fira Sans",sans-serif';
  opt.chart.foreColor="#475569";
  opt.tooltip=opt.tooltip||{};
  opt.tooltip.theme="light";
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}
}

}
function show(i){
i=Math.max(0,Math.min(i,MODS.length-1));
if(i===cur)return;
cur=i;destroyCharts();
var btns=document.querySelectorAll("[data-i]");
for(var k=0;k<btns.length;k++){
var active=+btns[k].getAttribute("data-i")===i;
btns[k].classList.toggle("active",active);
btns[k].setAttribute("aria-current",active?"page":"false")
}
gid("scr-title").textContent=MODS[i].t;
gid("scr-sub").textContent=MODS[i].s;
view.innerHTML=BUILDERS[i]();
void view.offsetHeight;
initCharts(i)
}
window.__show=show;
show(0);
function fromHash(){
var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
if(!m){show(0);return}
var n=document.querySelectorAll("[data-i]").length||6;
show(Math.min(+m[1],n-1));
try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash()
})();
</script>
