<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Factory Copilot（AI工廠智慧助理）｜Jvision 系統 Demo</title>
<meta name="description" content="自然語言查詢生產數據、異常事件自動摘要、跨系統知識問答" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#0369a1; --accent2:#38bdf8; --ink:#0f2231; --muted:#5b7285;
  --line:#e2ecf3; --bg:#f1f6fa; --card:#ffffff; --soft:#eef6fb;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.wrap{display:flex; min-height:100vh; align-items:stretch}
.sidebar{
  width:250px; flex:none; background:var(--card); border-right:1px solid var(--line);
  padding:18px 14px; display:flex; flex-direction:column; gap:6px;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 14px}
.brand .logo{
  width:40px;height:40px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;display:block;line-height:1.25}
.brand span{font-size:11px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{
  display:flex;align-items:center;gap:11px; text-align:left; cursor:pointer;
  border:1px solid transparent; background:transparent; color:var(--muted);
  padding:10px 11px;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:600;
  min-width:0; white-space:nowrap;
}
.nav-btn .material-symbols-outlined{font-size:21px;flex:none}
.nav-btn small{display:block;font-size:10.5px;font-weight:500;color:#9db1c0}
.nav-btn:hover{background:var(--soft);color:var(--accent)}
.nav-btn.active{background:linear-gradient(135deg,var(--accent),#0284c7);color:#fff;border-color:transparent}
.nav-btn.active small{color:#dbeefb}
.nav-btn.active .material-symbols-outlined{color:#fff}
.side-foot{margin-top:auto;padding:12px 8px 4px;font-size:10.5px;color:#9db1c0;border-top:1px solid var(--line)}
.main{flex:1 1 auto; min-width:0; padding:22px 26px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:20px;font-weight:800}
.top p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.pill .material-symbols-outlined{font-size:16px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:14px;font-weight:800}
.card .sub{margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:900;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
.delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta .material-symbols-outlined{font-size:15px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tbody tr:hover{background:var(--soft)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.tag.g{background:#e7f6ec;color:#137a3a}
.tag.y{background:#fdf0dd;color:#a25c05}
.tag.r{background:#fbe4e4;color:#b02121}
.tag.b{background:#e3f1fb;color:#0369a1}
.tag.gray{background:#eef2f5;color:#5b7285}

.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.msg.u .av{background:#e3f1fb;color:var(--accent)}
.msg.a .av{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bub{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.65;max-width:100%;min-width:0}
.msg.u .bub{background:#fff}
.bub .cite{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--accent);background:#e3f1fb;padding:2px 7px;border-radius:6px;margin:0 3px 3px 0}
.bub b{color:var(--accent)}
.qbar{display:flex;gap:8px;margin-top:4px;align-items:center;background:#fff;border:1.5px solid var(--accent2);border-radius:12px;padding:8px 12px}
.qbar .material-symbols-outlined{color:var(--accent)}
.qbar input{border:none;outline:none;flex:1;font-family:inherit;font-size:13px;min-width:0;background:transparent;color:var(--ink)}
.qbar .go{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:7px 14px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--accent);cursor:pointer}

.src-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:none}
.src-ico{width:38px;height:38px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.bar{height:7px;border-radius:5px;background:#e6eef4;overflow:hidden;flex:1;min-width:60px}
.bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 6px}
.tl-item::before{content:"";position:absolute;left:-17px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
.tl-item.warn::before{border-color:var(--warn)}
.tl-item.bad::before{border-color:var(--bad)}
.tl-item .tm{font-size:11px;color:var(--muted);font-weight:700}
.tl-item .tt{font-size:13px;font-weight:700;margin:2px 0}
.tl-item .td{font-size:12px;color:var(--muted);line-height:1.55}

.sug{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:9px}
.sug .hd{display:flex;align-items:center;gap:9px}
.sug .ico{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
.sug .tt{font-size:13.5px;font-weight:800}
.sug .impact{font-size:11px;color:var(--muted)}
.sug p{margin:0;font-size:12.5px;line-height:1.6;color:#33485a}
.sug .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mini-cite{font-size:10.5px;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.btnrow{display:flex;gap:7px}
.b-ok{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 13px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}
.b-gh{background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}

.kb{display:flex;flex-direction:column;gap:9px}
.kb-item{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}
.kb-item .kbi{width:36px;height:36px;flex:none;border-radius:9px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.kb-item .kbt{font-size:13px;font-weight:700}
.kb-item .kbd{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.kb-item .score{font-size:11px;font-weight:800;color:var(--accent);flex:none}

.matrix{width:100%;border-collapse:separate;border-spacing:5px}
.matrix td{padding:0;border:none;white-space:normal}
.mc{border-radius:9px;padding:9px 8px;text-align:center;font-size:11.5px;font-weight:700;color:#0f2231}
.mc small{display:block;font-size:9.5px;font-weight:600;opacity:.7}

.progress-wrap{display:flex;flex-direction:column;gap:12px}
.pg-row{display:flex;align-items:center;gap:11px}
.pg-row .nm{width:110px;flex:none;font-size:12px;font-weight:600}
.pg-row .num{width:52px;flex:none;text-align:right;font-size:12px;font-weight:800}
@media(max-width:560px){.pg-row .nm{width:80px}}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* responsive: sidebar -> top nav */
@media(max-width:860px){
  .wrap{flex-direction:column}
  .sidebar{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px;gap:8px}
  .brand{padding:0 8px 0 0;flex:none}
  nav{flex-direction:row;flex-wrap:wrap;gap:7px;flex:1}
  .nav-btn{flex:none}
  .nav-btn small{display:none}
  .side-foot{display:none}
  .main{padding:18px 15px 36px}
}
@media(max-width:560px){
  .nav-btn span.lbl{display:none}
  .nav-btn{padding:9px}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">smart_toy</span></div>
      <div><b>AI Factory Copilot</b><span>AI 工廠智慧助理</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">MES · OEE · CMMS 已連線<br/>資料為示範用途</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="scr-title">—</h1>
        <p id="scr-sub">—</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">bolt</span><span>即時同步 · 3 系統</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
"use strict";

var MODS=[
  {i:"forum",t:"自然語言問答",s:"以中文提問生產數據，AI 即時回覆並附引用來源"},
  {i:"hub",t:"跨系統檢索",s:"串接 MES、OEE、CMMS 語意檢索，統一查詢入口"},
  {i:"summarize",t:"異常事件摘要",s:"自動彙整停機、缺料、品質異常並生成事件摘要"},
  {i:"lightbulb",t:"改善建議產出",s:"依瓶頸與根因分析產出可執行的改善建議"},
  {i:"menu_book",t:"知識庫問答",s:"SOP、工藝參數與過往案例語意檢索與引用"},
  {i:"fact_check",t:"決策採納追蹤",s:"記錄人員採納/駁回建議與成效追蹤"}
];

var navEl=document.getElementById("nav");
var view=document.getElementById("view");
var charts=[];
var cur=-1;

MODS.forEach(function(m,idx){
  var b=document.createElement("button");
  b.className="nav-btn";
  b.setAttribute("data-i",idx);
  b.innerHTML='<span class="material-symbols-outlined">'+m.i+'</span><span class="lbl"><span>'+m.t+'</span><small>'+m.s.slice(0,14)+'</small></span>';
  b.addEventListener("click",function(){show(idx);location.hash="v"+idx;});
  navEl.appendChild(b);
});

function gid(id){return document.getElementById(id);}
function esc(x){return String(x);}

function destroyCharts(){
  for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}
  charts=[];
}

function mkChart(id,opt){
  var el=gid(id); if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.toolbar={show:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}

/* ---------- screen builders ---------- */
function SCR0(){
  return ''+
  '<div class="grid g23">'+
    '<div class="card">'+
      '<h3>對話式生產數據問答</h3>'+
      '<p class="sub">生產人員以自然語言提問，AI 回覆並標註跨系統引用來源</p>'+
      '<div class="chat">'+
        '<div class="msg u"><div class="av"><span class="material-symbols-outlined">person</span></div><div class="bub">今天 A3 產線的稼動率怎麼樣？有沒有異常停機？</div></div>'+
        '<div class="msg a"><div class="av"><span class="material-symbols-outlined">smart_toy</span></div><div class="bub">A3 產線今日稼動率為 <b>84.6%</b>（較昨日 +2.1pp）。共發生 <b>2 次</b>非計畫停機：09:14 換模逾時 18 分、13:40 上料感測器誤觸停機 6 分。整體 OEE 為 <b>78.3%</b>，瓶頸集中於換模環節。<br/><span class="cite"><span class="material-symbols-outlined" style="font-size:13px">database</span>MES 報工</span><span class="cite"><span class="material-symbols-outlined" style="font-size:13px">speed</span>OEE 系統</span></div></div>'+
        '<div class="msg u"><div class="av"><span class="material-symbols-outlined">person</span></div><div class="bub">那 09:14 那次換模逾時的原因是什麼？</div></div>'+
        '<div class="msg a"><div class="av"><span class="material-symbols-outlined">smart_toy</span></div><div class="bub">依 CMMS 保養紀錄，該次換模因 <b>治具定位銷磨耗</b> 需人工微調，實際耗時 33 分（標準 15 分）。相同治具過去 30 天已出現 <b>4 次</b>類似延遲，建議排入預防保養。<br/><span class="cite"><span class="material-symbols-outlined" style="font-size:13px">build</span>CMMS 工單</span></div></div>'+
      '</div>'+
      '<div class="qbar"><span class="material-symbols-outlined">edit</span><input value="比較本週各產線良率趨勢" readonly/><button class="go">送出</button></div>'+
      '<div class="chips"><span class="chip"># 缺料風險工單</span><span class="chip"># 昨日 OEE 排名</span><span class="chip"># 換模逾時彙總</span><span class="chip"># 交期預警</span></div>'+
    '</div>'+
    '<div class="grid" style="grid-template-columns:1fr;gap:14px">'+
      '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">query_stats</span>今日提問次數</div><div class="val">1,284 <small>則</small></div><span class="delta up"><span class="material-symbols-outlined">trending_up</span>+18% vs 上週</span></div>'+
      '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">timer</span>平均回應時效</div><div class="val">2.4 <small>秒</small></div><span class="delta up"><span class="material-symbols-outlined">trending_down</span>-63% vs 人工查詢</span></div>'+
      '<div class="card"><h3 style="margin-bottom:2px">意圖分類命中率</h3><p class="sub">近 7 日</p><div id="c0" style="min-height:150px"></div></div>'+
    '</div>'+
  '</div>';
}

function SCR1(){
  var rows=[
    ["MES 製造執行","報工/工單/在製",99.8,"g","即時"],
    ["OEE 稼動系統","稼動/效率/良率",99.6,"g","即時"],
    ["CMMS 保養","設備/保養/備件",98.9,"g","30 秒"],
    ["ERP 物料","庫存/採購/BOM",97.4,"y","5 分"],
    ["WMS 倉儲","入出庫/儲位",99.1,"g","即時"],
    ["SPC 品質","量測/管制圖",96.2,"y","2 分"]
  ];
  var tb="";
  rows.forEach(function(r){
    tb+='<tr><td><b>'+r[0]+'</b></td><td style="color:var(--muted)">'+r[1]+'</td>'+
    '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:120px"><i style="width:'+r[2]+'%"></i></div><span style="font-weight:800">'+r[2]+'%</span></div></td>'+
    '<td><span class="tag '+r[3]+'">'+(r[3]==="g"?"健康":"延遲")+'</span></td><td style="color:var(--muted)">'+r[4]+'</td></tr>';
  });
  return ''+
  '<div class="grid g4" style="margin-bottom:14px">'+
    '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">hub</span>已連線系統</div><div class="val">6 <small>個</small></div><span class="delta up"><span class="material-symbols-outlined">check_circle</span>全部在線</span></div>'+
    '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">description</span>索引文件</div><div class="val">42.8k</div><span class="delta up"><span class="material-symbols-outlined">trending_up</span>+960 今日</span></div>'+
    '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">bolt</span>檢索延遲 P95</div><div class="val">0.42 <small>秒</small></div><span class="delta up"><span class="material-symbols-outlined">trending_down</span>-0.1s</span></div>'+
    '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">verified</span>來源引用率</div><div class="val">96.5 <small>%</small></div><span class="delta up"><span class="material-symbols-outlined">trending_up</span>+1.2pp</span></div>'+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3>來源系統連線狀態</h3><p class="sub">語意檢索覆蓋範圍與資料新鮮度</p><div style="overflow-x:auto"><table><thead><tr><th>系統</th><th>涵蓋主題</th><th>可用度</th><th>狀態</th><th>更新頻率</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>'+
    '<div class="card"><h3>各系統檢索命中分佈</h3><p class="sub">近 7 日檢索命中次數（次）</p><div id="c1" style="min-height:250px"></div></div>'+
  '</div>';
}

function SCR2(){
  var items=[

/* ---------- show ---------- */
function show(i){
  i=Math.max(0,Math.min(i,MODS.length-1));
  if(i===cur)return;
  cur=i;
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  gid("scr-title").textContent=MODS[i].t;
  gid("scr-sub").textContent=MODS[i].s;
  view.innerHTML=BUILDERS[i]();
  void view.offsetHeight;
  initCharts(i);
}
window.__show=show;
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
