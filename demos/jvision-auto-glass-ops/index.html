<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>汽車玻璃服務管理 · GlassOps 營運終端</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0c0a14;--panel:#151125;--panel2:#1c1630;--line:#2b2342;
  --ink:#ece9f6;--mut:#9a92b8;--dim:#6f6790;
  --acc:#7c3aed;--acc2:#a78bfa;--acc3:#c4b5fd;
  --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 80% -10%,rgba(124,58,237,.16),transparent),radial-gradient(900px 400px at -10% 10%,rgba(167,139,250,.08),transparent);
  min-height:100vh;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:30;background:rgba(15,12,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tbrow{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.45)}
.logo .material-symbols-outlined{font-size:20px}
.bname{font-weight:800;font-size:15px;letter-spacing:.3px}
.bsub{font-size:11px;color:var(--dim);letter-spacing:2px}
.tbspacer{flex:1;min-width:0}
.livechip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:20px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.nav{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}
.nav button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:var(--panel);color:var(--mut);border:1px solid var(--line);padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.nav button:hover{color:var(--ink);border-color:var(--acc)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(124,58,237,.4)}
.nav button .material-symbols-outlined{font-size:18px}
.wrap{max-width:1360px;margin:0 auto;padding:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px;font-weight:800}
.head p{margin:3px 0 0;color:var(--mut);font-size:13px}
.tag{font-size:11px;color:var(--acc3);background:rgba(124,58,237,.14);border:1px solid rgba(124,58,237,.3);padding:4px 10px;border-radius:20px;font-weight:600}
.grid{display:grid;gap:14px;min-width:0}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.c73{grid-template-columns:1.9fr 1fr}
.c64{grid-template-columns:1.4fr 1fr}
.c55{grid-template-columns:1fr 1fr}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.ctitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 0 12px}
.ctitle .material-symbols-outlined{font-size:19px;color:var(--acc2)}
.ctitle small{margin-left:auto;font-weight:500;font-size:11px;color:var(--dim)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%)}
.kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--acc2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--mut)}
.kpi .delta{font-size:11px;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}
.delta .material-symbols-outlined{font-size:14px}
.chartbox{position:relative;width:100%}
.h180{height:180px}.h200{height:200px}.h220{height:220px}.h240{height:240px}.h260{height:260px}.h300{height:300px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid rgba(43,35,66,.6);white-space:nowrap}
.tbl tr:hover td{background:rgba(124,58,237,.06)}
.tbl .mono{font-variant-numeric:tabular-nums;font-family:"Inter"}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.14);color:var(--ok)}
.p-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.p-bad{background:rgba(251,113,133,.14);color:var(--bad)}
.p-info{background:rgba(96,165,250,.14);color:var(--info)}
.p-acc{background:rgba(167,139,250,.16);color:var(--acc3)}
.bar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.board>*{min-width:0}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.colh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:9px;color:var(--acc3)}
.colh .cnt{background:rgba(124,58,237,.2);color:var(--acc3);border-radius:20px;padding:1px 8px;font-size:11px}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:10px;margin-bottom:8px}
.tk:last-child{margin-bottom:0}
.tk .plate{font-weight:800;font-size:13px;letter-spacing:.5px}
.tk .meta{font-size:11px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk .meta .material-symbols-outlined{font-size:14px}
.sched{display:grid;grid-template-columns:90px 1fr 1fr 1fr;gap:0;min-width:640px}
.sched .hd{font-size:11px;font-weight:700;color:var(--acc3);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.sched .tm{font-size:12px;color:var(--dim);padding:12px 10px;border-bottom:1px solid rgba(43,35,66,.5);font-variant-numeric:tabular-nums}
.sched .cell{border-bottom:1px solid rgba(43,35,66,.5);border-left:1px solid rgba(43,35,66,.5);padding:6px;min-height:52px}
.ev{border-radius:8px;padding:6px 8px;font-size:11px;font-weight:600;line-height:1.35;height:100%}
.ev small{display:block;font-weight:500;opacity:.85;margin-top:2px}
.ev.a{background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.4);color:var(--acc3)}
.ev.b{background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.35);color:#bcd6ff}
.ev.c{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.ev.d{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.3);color:#fde68a}
.tech{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:9px}
.tech:last-child{margin-bottom:0}
.tface{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.tech .info{flex:1;min-width:0}
.tech .nm{font-weight:700;font-size:13px}
.tech .sk{font-size:11px;color:var(--mut);margin-top:2px}
.tech .load{width:110px;flex:none}
.tech .load .lab{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:3px}
.step{display:flex;gap:12px;position:relative;padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.snode{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;z-index:1}
.snode.done{background:var(--ok);color:#04120c}
.snode.now{background:var(--acc);color:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.25)}
.snode.wait{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.step .sc{flex:1;min-width:0}
.step .st{font-weight:700;font-size:13px}
.step .sd{font-size:11.5px;color:var(--mut);margin-top:2px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.gauge .gv{font-size:20px;font-weight:800}
.gauge .gl{font-size:11px;color:var(--mut);text-align:center}
.claimrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:10px}
.claimrow:last-child{margin-bottom:0}
.claimrow .ci{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.claimrow .cbody{flex:1;min-width:0}
.claimrow .ct{font-weight:700;font-size:13px}
.claimrow .cm{font-size:11px;color:var(--mut);margin-top:2px}
.claimrow .camt{text-align:right;flex:none}
.claimrow .camt .a{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.claimrow .camt .u{font-size:10px;color:var(--dim)}
.led{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(43,35,66,.6);font-size:13px}
.led:last-child{border-bottom:none}
.led .lv{font-variant-numeric:tabular-nums;font-weight:700}
.mininote{font-size:11px;color:var(--dim);margin-top:10px;display:flex;gap:6px;align-items:flex-start}
.mininote .material-symbols-outlined{font-size:15px;color:var(--acc2);flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lgd{width:10px;height:10px;border-radius:3px}
@media(max-width:820px){
  .k4,.k3,.k2,.c73,.c64,.c55{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:9px 11px}
  .wrap{padding:12px}
  .bsub{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">directions_car</span></div>
      <div>
        <div class="bname">GlassOps 汽車玻璃服務管理</div>
        <div class="bsub">AUTO GLASS · OPERATIONS TERMINAL</div>
      </div>
    </div>
    <div class="tbspacer"></div>
    <div class="livechip"><span class="dot"></span>即時營運中 · 台北旗艦門市</div>
    <div class="avatar">陳</div>
  </div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap"><div id="view"></div></div>

<script>
"use strict";
var C={ink:"#ece9f6",mut:"#9a92b8",dim:"#6f6790",line:"#2b2342",acc:"#7c3aed",acc2:"#a78bfa",acc3:"#c4b5fd",ok:"#34d399",warn:"#fbbf24",bad:"#fb7185",info:"#60a5fa",panel2:"#1c1630"};
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function reg(c){charts.push(c);return c;}
if(window.Chart){
  Chart.defaults.color=C.mut;
  Chart.defaults.borderColor=C.line;
  Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
  Chart.defaults.font.size=11;
}
function gridOpt(extra){
  var o={responsive:true,maintainAspectRatio:false,animation:{duration:500},
    plugins:{legend:{labels:{color:C.mut,boxWidth:12,font:{size:11}}},tooltip:{backgroundColor:"#1c1630",borderColor:C.line,borderWidth:1,titleColor:C.ink,bodyColor:C.mut}},
    scales:{x:{ticks:{color:C.dim},grid:{color:"rgba(43,35,66,.55)"}},y:{ticks:{color:C.dim},grid:{color:"rgba(43,35,66,.55)"}}}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}

var NAV=[
  {i:0,ic:"event_available",t:"預約排程"},
  {i:1,ic:"engineering",t:"技師派工"},
  {i:2,ic:"inventory_2",t:"料件訂購"},
  {i:3,ic:"sensors",t:"ADAS 校正"},
  {i:4,ic:"verified_user",t:"保險理賠"},
  {i:5,ic:"payments",t:"收款對帳"}
];
(function(){
  var n=document.getElementById("nav");
  n.innerHTML=NAV.map(function(x){return '<button data-i="'+x.i+'"><span class="material-symbols-outlined">'+x.ic+'</span><span class="txt">'+x.t+'</span></button>';}).join("");
  n.addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");if(!b)return;
    show(+b.getAttribute("data-i"));
    try{window.scrollTo(0,0);}catch(err){}
  });
})();

/* ===================== SCREEN 0 : 預約排程 ===================== */
function scr0(){
  var kpis=[
    {l:"今日預約",v:"38",u:"筆",d:"+6",dir:"up",ic:"event"},
    {l:"到店報到率",v:"92",u:"%",d:"+3pt",dir:"up",ic:"how_to_reg"},
    {l:"平均候修",v:"46",u:"分",d:"-8分",dir:"up",ic:"timer"},
    {l:"取消/改期",v:"4",u:"筆",d:"+1",dir:"down",ic:"event_busy"}
  ];
  var rows=[
    ["ABC-1234","Aurion Altis","前擋更換","09:00","王小明","保險","已報到","p-ok"],
    ["BDE-5678","Haruna CR-V","前擋修補","09:30","李佳玲","自付","已報到","p-ok"],
    ["FGH-9012","Voltra Model 3","前擋+ADAS","10:00","張志強","保險","候修中","p-warn"],
    ["JKL-3456","Ford Kuga","側窗更換","10:30","陳美惠","自付","已預約","p-acc"],
    ["MNP-7788","Mazda CX-5","前擋更換","11:00","林大衛","保險","已預約","p-acc"],
    ["QRS-2244","Nordis Kicks","後擋更換","13:30","黃淑芬","自付","已預約","p-acc"],
    ["TUV-6600","BMW 320i","前擋+ADAS","14:00","吳建宏","保險","已預約","p-acc"],
    ["WXY-8899","Lexus RX","天窗更換","15:00","蔡宗翰","保險","已預約","p-acc"]
  ];
  var sched=[
    {tm:"09:00",bays:[{c:"a",t:"ABC-1234 前擋更換",s:"施作中 · 阿德"},{c:"b",t:"BDE-5678 修補",s:"施作中 · 阿豪"},{c:"",t:"",s:""}]},
    {tm:"10:00",bays:[{c:"a",t:"FGH-9012 前擋+ADAS",s:"預約 · 阿德"},{c:"",t:"",s:""},{c:"d",t:"JKL-3456 側窗",s:"預約 · 小柯"}]},
    {tm:"11:00",bays:[{c:"c",t:"MNP-7788 前擋",s:"預約 · 阿德"},{c:"b",t:"保養檢查",s:"預約 · 阿豪"},{c:"",t:"",s:""}]},
    {tm:"13:30",bays:[{c:"",t:"",s:""},{c:"a",t:"QRS-2244 後擋",s:"預約 · 阿豪"},{c:"d",t:"備料整理",s:"小柯"}]},
    {tm:"14:00",bays:[{c:"a",t:"TUV-6600 前擋+ADAS",s:"預約 · 阿德"},{c:"",t:"",s:""},{c:"",t:"",s:""}]}
  ];
  var h=head("預約排程","線上預約、到店報到與服務工位時段調配","event_available");
  h+='<div class="grid k4" style="margin-bottom:14px">'+kpis.map(kpiCard).join("")+'</div>';
  h+='<div class="grid c64">';
  h+='<div class="card"><div class="ctitle"><span class="material-symbols-outlined">calendar_view_day</span>工位時段表 <small>Bay 1–3 · 今日</small></div><div style="overflow-x:auto"><div class="sched">';
  h+='<div class="hd">時段</div><div class="hd">Bay 1 更換</div><div class="hd">Bay 2 修補</div><div class="hd">Bay 3 ADAS</div>';
  sched.forEach(function(r){
    h+='<div class="tm">'+r.tm+'</div>';
    r.bays.forEach(function(b){
      h+='<div class="cell">'+(b.t?'<div class="ev '+b.c+'">'+b.t+'<small>'+b.s+'</small></div>':'')+'</div>';
    });
  });
  h+='</div></div></div>';
  h+='<div class="card"><div class="ctitle"><span class="material-symbols-outlined">insights</span>預約來源 <small>近 30 日</small></div><div class="chartbox h240"><canvas id="c0a"></canvas></div></div>';
  h+='</div>';
  h+='<div class="grid" style="margin-top:14px"><div class="card"><div class="ctitle"><span class="material-symbols-outlined">list_alt</span>今日預約清單 <small>共 38 筆 · 顯示前 8</small></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>車牌</th><th>車型</th><th>服務項目</th><th>時段</th><th>車主</th><th>付款</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td class="mono" style="font-weight:700">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td><td>'+r[4]+'</td><td><span class="pill p-info">'+r[5]+'</span></td><td><span class="pill '+r[7]+'">'+r[6]+'</span></td></tr>';
  });
  h+='</tbody></table></div></div></div>';
  view.innerHTML=h;
  void view.offsetHeight;
  reg(new Chart(document.getElementById("c0a"),{type:"doughnut",
    data:{labels:["官網預約","LINE 客服","電話","保險轉介","現場"],datasets:[{data:[42,28,14,11,5],backgroundColor:[C.acc,C.acc2,C.info,C.ok,C.warn],borderColor:C.panel2,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{color:C.mut,boxWidth:11,font:{size:11}}},tooltip:gridOpt().plugins.tooltip}}}));
}

/* ===================== SCREEN 1 : 技師派工 ===================== */
function scr1(){
  var techs=[
    {n:"阿德",r:"資深技師 · 前擋/黏合",jobs:5,load:88},
    {n:"阿豪",r:"技師 · 修補/側窗",jobs:4,load:72},
    {n:"小柯",r:"技師 · 側後窗",jobs:3,load:55},
    {n:"阿凱",r:"見習技師 · 拆裝",jobs:2,load:34}
  ];
  var board=[
    {col:"待派工",items:[
      {p:"JKL-3456",v:"Ford Kuga",job:"側窗更換",prio:"p-warn",pt:"急件"},
      {p:"QRS-2244",v:"Nordis Kicks",job:"後擋更換",prio:"p-info",pt:"一般"}

  h+='<div class="card"><div class="ctitle"><span class="material-symbols-outlined">query_stats</span>營收與收款趨勢 <small>近 6 個月 (萬)</small></div><div class="chartbox h260"><canvas id="c5a"></canvas></div>';
  h+='<div class="legend"><span><span class="lgd" style="background:'+C.acc+'"></span>總營收</span><span><span class="lgd" style="background:'+C.ok+'"></span>已收款</span><span><span class="lgd" style="background:'+C.bad+'"></span>應收未收</span></div></div>';
  h+='<div class="card"><div class="ctitle"><span class="material-symbols-outlined">account_tree</span>收入結構 <small>本月</small></div>';
  var tot=ledger.reduce(function(a,b){return a+b.v;},0);
  ledger.forEach(function(l){
    var pct=Math.round(l.v/tot*100);
    h+='<div style="margin-bottom:12px"><div class="led" style="border:none;padding:0 0 5px"><span style="display:flex;align-items:center;gap:8px"><span class="lgd" style="background:'+l.c+'"></span>'+l.t+'</span><span class="lv">'+l.v.toLocaleString()+'</span></div><div class="bar"><span style="width:'+pct+'%;background:'+l.c+'"></span></div></div>';
  });
  h+='<div class="led" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px"><span style="font-weight:700">合計</span><span class="lv" style="color:var(--acc3);font-size:16px">NT$ '+tot.toLocaleString()+'</span></div></div>';
  h+='</div>';
  h+='<div class="grid" style="margin-top:14px"><div class="card"><div class="ctitle"><span class="material-symbols-outlined">receipt</span>發票與收款對帳 <small>近 6 筆</small></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>發票號</th><th>車主</th><th>車型</th><th>付款別</th><th>金額</th><th>對帳狀態</th></tr></thead><tbody>';
  recon.forEach(function(r){
    h+='<tr><td class="mono" style="font-weight:700;color:var(--acc3)">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="pill '+(r[3]==="保險"?"p-info":"p-acc")+'">'+r[3]+'</span></td><td class="mono" style="font-weight:700">NT$ '+r[4]+'</td><td><span class="pill '+r[6]+'">'+r[5]+'</span></td></tr>';
  });
  h+='</tbody></table></div><div class="mininote"><span class="material-symbols-outlined">warning</span>INV-24-1096 自付未收已逾 7 日，系統已排入催收提醒。</div></div></div>';
  view.innerHTML=h;
  void view.offsetHeight;
  reg(new Chart(document.getElementById("c5a"),{
    data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
      {type:"bar",label:"總營收",data:[58,62,66,70,74,78.5],backgroundColor:"rgba(124,58,237,.55)",borderRadius:5,order:2},
      {type:"line",label:"已收款",data:[52,56,60,64,68,71.2],borderColor:C.ok,backgroundColor:"rgba(52,211,153,.1)",tension:.4,order:1},
      {type:"line",label:"應收未收",data:[6,6,6,6,6,7.3],borderColor:C.bad,tension:.4,order:0}
    ]},options:gridOpt()}));
}

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function head(t,s,ic){
  return '<div class="head"><div><h1>'+t+'</h1><p>'+s+'</p></div><div class="tag"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">'+ic+'</span> 模組即時檢視</div></div>';
}
function kpiCard(k){
  var arrow=k.dir==="up"?"arrow_upward":k.dir==="down"?"arrow_downward":"remove";
  var cls=k.dir==="up"?"up":k.dir==="down"?"down":"flat";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="delta '+cls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+k.d+'</div></div>';
}
var view=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
