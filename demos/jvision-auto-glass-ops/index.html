<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汽車玻璃服務管理 · GlassOps 營運終端</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#00ff41;
  --color-on-primary:#0f172a;
  --color-secondary:#008f11;
  --color-on-secondary:#000;
  --color-accent:#ff3333;
  --color-on-accent:#000;
  --color-background:#0d1117;
  --color-foreground:#e6edf3;
  --color-card:#182424;
  --color-card-foreground:#e6edf3;
  --color-muted:#25292f;
  --color-muted-foreground:#94a3b8;
  --color-border:#30363d;
  --color-destructive:#ef4444;
  --color-on-destructive:#000;
  --color-ring:#00ff41;
  --blue:#00ff41;
  --ink:#e6edf3;
  --muted:#94a3b8;
  --line:#30363d;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:var(--color-muted);
  --mut:var(--muted);
  --dim:#a8b3c2;
  --acc:var(--color-primary);
  --acc2:var(--color-secondary);
  --acc3:#79ff91;
  --ok:#00ff41;
  --warn:#ffd43b;
  --bad:#ff5c5c;
  --info:#62b5ff;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Josefin Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:#0d1117;
  border-bottom:3px solid var(--ink);
}
.tbrow{
  display:flex;
  align-items:stretch;
  min-height:68px;
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:320px;
  padding:11px 18px;
  border-right:2px solid var(--line);
}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid var(--ink);
  background:var(--acc);
  color:var(--color-on-primary);
  box-shadow:5px 5px 0 var(--color-secondary);
}
.logo .material-symbols-outlined{font-size:25px}
.bname{
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.03em;
}
.bsub{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  letter-spacing:.18em;
}
.tbspacer{flex:1}
.livechip{
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 18px;
  border-left:2px solid var(--line);
  color:var(--ink);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.dot{
  width:11px;
  height:11px;
  border:2px solid var(--ink);
  background:var(--ok);
  animation:pulse 1.8s steps(2,end) infinite;
}
.avatar{
  width:68px;
  display:grid;
  place-items:center;
  border-left:2px solid var(--ink);
  background:var(--acc);
  color:var(--color-on-primary);
  font-weight:700;
}
.nav{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 12px;
  border:0;
  border-right:1px solid var(--line);
  background:#111820;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s,color .18s;
}
.nav button:last-child{border-right:0}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{
  background:var(--acc);
  color:var(--color-on-primary);
  box-shadow:inset 0 -5px 0 #fff;
}
.wrap{max-width:1500px;margin:auto;padding:20px}
.head{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  min-height:105px;
  margin-bottom:16px;
  padding:20px 22px 17px 26px;
  overflow:hidden;
  border:2px solid var(--ink);
  background:#111820;
  box-shadow:7px 7px 0 var(--acc2);
}
.head:before{
  content:"GLASSOPS / OPERATIONS";
  position:absolute;
  top:8px;
  right:12px;
  color:rgba(230,237,243,.08);
  font-family:"Cinzel",serif;
  font-size:clamp(22px,4vw,58px);
  font-weight:700;
  letter-spacing:.06em;
  white-space:nowrap;
  pointer-events:none;
}
.head>div{position:relative}
.head h1{
  margin:0;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(23px,3vw,37px);
  font-weight:700;
  letter-spacing:.02em;
}
.head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border:1px solid var(--acc);
  background:#102419;
  color:var(--acc3);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.grid{display:grid;gap:12px;min-width:0}
.grid>*{min-width:0}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2,.c55{grid-template-columns:repeat(2,1fr)}
.c73{grid-template-columns:1.9fr 1fr}
.c64{grid-template-columns:1.4fr 1fr}
.card,.kpi{
  min-width:0;
  border:2px solid var(--line);
  border-radius:0;
  background:var(--panel);
}
.card{padding:15px}
.card:nth-child(even){background:#141f21}
.ctitle{
  display:flex;
  align-items:center;
  gap:8px;
  margin:-15px -15px 14px;
  padding:10px 13px;
  border-bottom:2px solid var(--line);
  background:#0f171d;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
}
.ctitle .material-symbols-outlined{color:var(--acc)}
.ctitle small{
  margin-left:auto;
  color:var(--muted);
  font-family:"Josefin Sans","Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:500;
}
.kpi{
  position:relative;
  min-height:126px;
  padding:15px;
  overflow:hidden;
  border-color:var(--ink);
  background:#111820;
  box-shadow:4px 4px 0 var(--line);
}
.kpi:after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:-25px;
  width:86px;
  height:86px;
  border:12px solid rgba(0,255,65,.08);
  transform:rotate(15deg);
}
.kpi:nth-child(2n){transform:translateY(5px)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
}
.kpi .lab .material-symbols-outlined{color:var(--acc)}
.kpi .val{
  margin-top:6px;
  font-family:"Cinzel","Josefin Sans",sans-serif;
  font-size:29px;
  font-weight:700;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--muted);font-size:12px}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:8px;
  padding:2px 5px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.kpi .delta .material-symbols-outlined{font-size:14px}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:#c6d0dc}
.chartbox{position:relative;width:100%}
.h180{height:180px}.h200{height:200px}.h220{height:220px}
.h240{height:240px}.h260{height:260px}.h300{height:300px}
.tbl{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  font-size:13px;
}
.tbl th{
  padding:10px;
  border:1px solid var(--line);
  background:#0d141a;
  color:#c4cfdb;
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl td{
  padding:10px;
  border:1px solid var(--line);
  background:#182424;
  white-space:nowrap;
}
.tbl tbody tr:nth-child(even) td{background:#141e20}
.tbl tbody tr:hover td{background:#21302c}
.tbl th:nth-last-child(-n+3),
.tbl td.mono,
.tbl td[style*="font-weight:700"]{font-variant-numeric:tabular-nums}
.mono{
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace!important;
  font-variant-numeric:tabular-nums;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.pill:before{content:"■";font-size:7px}
.p-ok{background:#102a18;color:#69ff8a}
.p-warn{background:#302910;color:#ffe477}
.p-bad{background:#381717;color:#ff8c8c}
.p-info{background:#12283a;color:#8dceff}
.p-acc{background:#12341a;color:#79ff91}
.bar{
  height:8px;
  min-width:60px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#0d1117;
}
.bar>span{display:block;height:100%;background:var(--acc)}
.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  min-width:780px;
}
.col{
  padding:9px;
  border:1px solid var(--line);
  background:var(--panel2);
}
.colh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
  padding-bottom:7px;
  border-bottom:2px solid var(--ink);
  color:var(--acc3);
  font-size:12px;
  font-weight:700;
}
.cnt{
  min-width:23px;
  padding:1px 6px;
  border:1px solid var(--acc);
  text-align:center;
}
.tk{
  margin-bottom:8px;
  padding:9px;
  border:1px solid var(--line);
  border-left:5px solid var(--acc);
  background:#111820;
}
.tk:last-child{margin-bottom:0}
.plate{
  font-family:ui-monospace,Consolas,monospace;
  font-size:13px;
  font-weight:700;
  letter-spacing:.05em;
}
.meta{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}
.meta .material-symbols-outlined{font-size:14px}
.sched{
  display:grid;
  grid-template-columns:80px repeat(3,1fr);
  min-width:660px;
}
.sched .hd{
  padding:8px;
  border:1px solid var(--line);
  background:#0d141a;
  color:var(--acc3);
  font-size:10px;
  font-weight:700;
}
.sched .tm{
  padding:12px 8px;
  border:1px solid var(--line);
  color:#c4cfdb;
  font-family:ui-monospace,Consolas,monospace;
  font-size:11px;
}
.sched .cell{
  min-height:55px;
  padding:5px;
  border:1px solid var(--line);
}
.ev{
  height:100%;
  padding:6px 7px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.ev small{display:block;margin-top:2px;font-weight:500}
.ev.a{background:#10331a;color:#79ff91}
.ev.b{background:#112a3c;color:#8dceff}
.ev.c{background:#163124;color:#8df0ad}
.ev.d{background:#302910;color:#ffe477}
.tech{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  padding:9px;
  border:1px solid var(--line);
  background:var(--panel2);
}
.tech:last-child{margin-bottom:0}
.tface{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid var(--ink);
  background:var(--acc);
  color:var(--color-on-primary);
  font-weight:700;
}
.tech .info{flex:1;min-width:0}
.tech .nm{font-weight:700}
.tech .sk{margin-top:2px;color:var(--muted);font-size:11px}
.tech .load{width:100px;flex:none}
.tech .load .lab{
  display:flex;
  justify-content:space-between;
  margin-bottom:3px;
  color:#b5c0ce;
  font-size:10px;
}
.step{position:relative;display:flex;gap:12px;padding-bottom:17px}
.step:last-child{padding-bottom:0}
.step:before{
  content:"";
  position:absolute;
  top:31px;
  bottom:0;
  left:15px;
  width:2px;
  background:var(--line);
}
.step:last-child:before{display:none}
.snode{
  z-index:1;
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid var(--line);
  background:#111820;
  font-weight:700;
}
.snode.done{border-color:var(--ok);background:var(--ok);color:#061209}
.snode.now{border-color:#fff;background:var(--accent,var(--color-accent));color:#000;box-shadow:4px 4px 0 #7b1717}
.snode.wait{color:var(--muted)}
.sc{flex:1}.st{font-weight:700}.sd{margin-top:2px;color:var(--muted);font-size:11px}
.gauge{
  padding:10px 6px;
  border:2px solid var(--line);
  background:#0f171d;
  text-align:center;
}
.gv{
  font-family:"Cinzel",serif;
  font-size:19px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.gl{margin-top:4px;color:var(--muted);font-size:10px}
.claimrow{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:8px;
  padding:10px;
  border:1px solid var(--line);
  background:var(--panel2);
}
.claimrow:last-child{margin-bottom:0}
.ci{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid var(--ink);
  color:#000;
}
.cbody{flex:1;min-width:0}
.ct{font-weight:700}
.cm{margin-top:3px;color:var(--muted);font-size:11px}
.camt{flex:none;text-align:right}
.camt .a{
  font-family:ui-monospace,Consolas,monospace;
  font-size:15px;
  font-weight:700;
}
.camt .u{color:var(--muted);font-size:10px}
.led{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
}
.led:last-child{border-bottom:0}
.lv{
  font-family:ui-monospace,Consolas,monospace;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.mininote{
  display:flex;
  align-items:flex-start;
  gap:6px;
  margin-top:11px;
  padding:8px;
  border-left:4px solid var(--acc);
  background:#101b17;
  color:#b8c5d3;
  font-size:11px;
}
.mininote .material-symbols-outlined{flex:none;color:var(--acc);font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lgd{width:11px;height:11px;border:1px solid #fff}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.3,1.35) both}
.grid-item:nth-child(2){animation-delay:.05s}
.grid-item:nth-child(3){animation-delay:.1s}
.grid-item:nth-child(4){animation-delay:.15s}
@keyframes enter{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(0,255,65,.5)}
  50%{box-shadow:0 0 0 5px rgba(0,255,65,0)}
}
@media(max-width:1024px){
  .k4{grid-template-columns:repeat(2,1fr)}
  .c73,.c64{grid-template-columns:1fr}
}
@media(max-width:768px){
  .tbrow{min-height:58px}
  .brand{min-width:0;flex:1;border-right:0}
  .livechip{padding:0 12px}
  .avatar{width:52px}
  .nav{display:flex}
  .nav button{min-width:145px;flex:1}
  .k2,.k3,.c55{grid-template-columns:1fr}
  .wrap{padding:14px}
  .head{align-items:flex-start;flex-direction:column}
}
@media(max-width:480px){
  .brand{padding:9px 11px}
  .logo{width:36px;height:36px}
  .bname{font-size:13px}
  .bsub{display:none}
  .livechip{font-size:0}
  .livechip:after{content:"LIVE";font-size:10px}
  .avatar{display:none}
  .nav button{min-width:52px;padding:9px}
  .nav button .txt{display:none}
  .k4{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
  .head{padding:17px}
  .head p{font-size:12px}
  .tag{white-space:normal}
  .claimrow{align-items:flex-start;flex-wrap:wrap}
  .camt{width:100%;text-align:left;padding-left:49px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">directions_car</span></div>
      <div>
        <div class="bname">GlassOps 汽車玻璃服務管理</div>
        <div class="bsub">AUTO GLASS · OPERATIONS TERMINAL</div>
      </div>
    </div>
    <div class="tbspacer"></div>
    <div class="livechip" aria-label="即時營運中，台北旗艦門市"><span class="dot" aria-hidden="true"></span>即時營運中 · 台北旗艦門市</div>
    <div class="avatar" aria-label="使用者陳先生">陳</div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap"><div id="view"></div></main>
<script>
"use strict";
var C={ink:"#e6edf3",mut:"#94a3b8",dim:"#a8b3c2",line:"#30363d",acc:"#00ff41",acc2:"#008f11",acc3:"#79ff91",ok:"#00ff41",warn:"#ffd43b",bad:"#ff5c5c",info:"#62b5ff",panel2:"#182424"};
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function reg(c){charts.push(c);return c}
if(window.Chart){
  Chart.defaults.color=C.mut;
  Chart.defaults.borderColor=C.line;
  Chart.defaults.font.family="'Josefin Sans','Noto Sans TC',sans-serif";
  Chart.defaults.font.size=11;
}
function gridOpt(extra){
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var o={
    responsive:true,
    maintainAspectRatio:false,
    animation:reduced?false:{duration:400},
    plugins:{
      legend:{labels:{color:C.mut,boxWidth:12,font:{size:11}}},
      tooltip:{backgroundColor:"#0d1117",borderColor:C.acc,borderWidth:1,titleColor:C.ink,bodyColor:C.mut}
    },
    scales:{
      x:{ticks:{color:C.dim},grid:{color:"rgba(148,163,184,.14)"}},
      y:{ticks:{color:C.dim},grid:{color:"rgba(148,163,184,.14)"}}
    }
  };
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}
var NAV=[
  {i:0,ic:"event_available",t:"預約排程"},

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
var view=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  SCREENS[i]()
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],5):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
