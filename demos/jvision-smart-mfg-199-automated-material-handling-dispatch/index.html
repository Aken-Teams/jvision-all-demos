<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGV/AMR智慧搬運調度系統｜純 UI 展示</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#FFFFFF;
  --color-secondary:#475569;
  --color-on-secondary:#FFFFFF;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F2F3F4;
  --color-muted-foreground:#475569;
  --color-border:#E6E8EA;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E6E8EA;
  --accent:#059669;
  --accent2:#34D399;
  --accent-soft:#D1FAE5;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Open Sans","Noto Sans TC",system-ui,sans-serif;
  color:var(--color-foreground);
  background:var(--color-background);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:248px;
  flex:0 0 248px;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:20px 16px;
  background:var(--color-card);
  border-right:1px solid var(--color-border);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:52px;
  padding:4px 8px 18px;
  border-bottom:1px solid var(--color-border);
  margin-bottom:8px;
}
.brand .logo{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:4px;
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand h1{
  margin:0;
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.35;
  font-weight:700;
  letter-spacing:.01em;
}
.brand span{font-size:10.5px;color:var(--color-muted-foreground);font-weight:600}
.navlabel{
  padding:8px 10px 5px;
  color:var(--color-muted-foreground);
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0}
.nav button{
  width:100%;
  min-width:0;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:var(--color-secondary);
  text-align:left;
  font-size:13px;
  font-weight:600;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{
  flex:0 0 auto;
  color:var(--color-muted-foreground);
  font-size:19px;
}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button .idx{
  margin-left:auto;
  color:#64748B;
  font-family:"Poppins",sans-serif;
  font-size:10px;
  font-weight:600;
}
.nav button:hover{
  background:var(--color-muted);
  border-color:var(--color-border);
  transform:translateX(2px);
}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.nav button.on .material-symbols-outlined,.nav button.on .idx{color:#FFFFFF}
.sidefoot{
  margin-top:auto;
  padding:13px 10px 0;
  border-top:1px solid var(--color-border);
  color:var(--color-muted-foreground);
  font-size:10.5px;
  line-height:1.7;
}
.main{flex:1;min-width:0;padding:24px clamp(18px,2.4vw,36px) 56px}
.topbar{
  display:flex;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:18px;
  padding-bottom:17px;
  border-bottom:1px solid var(--color-border);
}
.topbar .head{min-width:0;flex:1}
.crumb{
  margin-bottom:4px;
  color:var(--color-accent);
  font-family:"Poppins",sans-serif;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.topbar h2{
  margin:0;
  color:var(--color-foreground);
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:clamp(20px,2vw,25px);
  line-height:1.25;
  font-weight:600;
  letter-spacing:-.02em;
}
.topbar p{max-width:720px;margin:6px 0 0;color:var(--color-muted-foreground);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:8px 12px;
  border:1px solid #A7F3D0;
  border-radius:4px;
  background:#ECFDF5;
  color:#065F46;
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}
.grid>*{min-width:0}
.card{
  min-width:0;
  padding:16px;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:0 4px 12px rgba(15,23,42,.07);transform:translateY(-1px)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 3px;
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{color:var(--color-accent);font-size:18px}
.card .sub{margin:0 0 13px;color:var(--color-muted-foreground);font-size:11.5px}
.kpi{position:relative;padding-top:14px}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:var(--color-accent);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-size:11.5px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:var(--color-primary);font-size:17px}
.kpi .val{
  margin:7px 0 1px;
  color:var(--color-foreground);
  font-family:"Poppins",sans-serif;
  font-size:27px;
  line-height:1.25;
  font-weight:600;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--color-muted-foreground);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta{display:inline-flex;align-items:center;gap:2px;margin-right:3px;font-size:11px;font-weight:700}
.kpi .delta .material-symbols-outlined{font-size:14px}
.up{color:#047857}.down{color:#B91C1C}.flat{color:var(--color-muted-foreground)}
.kpi .bar{height:4px;margin-top:9px;overflow:hidden;border-radius:2px;background:#E2E8F0}
.kpi .bar>i{display:block;height:100%;border-radius:2px;background:var(--color-accent)}
.tblwrap{width:100%;overflow-x:auto;border:1px solid var(--color-border);border-radius:4px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:9px 11px;border-bottom:1px solid var(--color-border);text-align:left;white-space:nowrap}
th{
  background:var(--color-muted);
  color:var(--color-secondary);
  font-family:"Poppins","Noto Sans TC",sans-serif;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.035em;
  text-transform:uppercase;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
td.mono,th.mono{
  text-align:right;
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
}
td:first-child.mono{text-align:left}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:10.5px;
  line-height:1.3;
  font-weight:700;
}
.t-ok{background:#ECFDF5;color:#065F46}
.t-run{background:#EFF6FF;color:#1E40AF}
.t-wait{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#991B1B}
.t-idle{background:#F1F5F9;color:#475569}
.t-chg{background:#F5F3FF;color:#5B21B6}
.bat{
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  min-width:82px;
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:11.5px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.batbar{width:40px;height:6px;overflow:hidden;border-radius:2px;background:#E2E8F0}
.batbar>i{display:block;height:100%}
.col{min-width:0;padding:10px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-muted)}
.tk{
  margin-bottom:7px;
  padding:9px 10px;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-accent);
  border-radius:4px;
  background:var(--color-card);
  box-shadow:0 1px 1px rgba(15,23,42,.04);
}
.tk:last-child{margin-bottom:0}
.tk .id{
  color:var(--color-muted-foreground);
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:10px;
  font-weight:700;
}
.tk .ti{margin:2px 0 4px;font-size:12px;font-weight:700}
.tk .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:10.5px}
.tk .mt .material-symbols-outlined{font-size:13px}
.tk.b-warn{border-left-color:var(--warn)}
.tk.b-bad{border-left-color:var(--bad)}
.tk.b-run{border-left-color:var(--info)}
.tk.b-ok{border-left-color:var(--ok)}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:1px;background:var(--color-border)}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{
  content:"";
  position:absolute;
  top:3px;
  left:-21px;
  width:9px;
  height:9px;
  border:2px solid #FFFFFF;
  outline:2px solid var(--color-accent);
  border-radius:50%;
  background:var(--color-accent);
}
.tl .ev.bad::before{outline-color:var(--bad);background:var(--bad)}
.tl .ev.warn::before{outline-color:var(--warn);background:var(--warn)}
.tl .tt{
  color:var(--color-muted-foreground);
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:10px;
  font-weight:700;
}
.tl .tx{margin:1px 0;color:var(--color-foreground);font-size:12px;font-weight:600}
.tl .td{color:var(--color-muted-foreground);font-size:11px}
.chartbox{position:relative;width:100%;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--color-muted-foreground);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border:1px solid rgba(15,23,42,.16);border-radius:2px}
.rowline{display:flex;align-items:center;gap:11px;min-width:0;padding:9px 0;border-bottom:1px solid var(--color-border)}
.rowline:last-child{border-bottom:0}
.rowline .ic{
  width:34px;
  height:34px;
  flex:0 0 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  background:var(--accent-soft);
  color:#047857;
}
.rowline .ic .material-symbols-outlined{font-size:18px}
.rowline .gr{flex:1;min-width:0}
.rowline .gr b{font-size:12px}
.rowline .gr p{margin:1px 0 0;overflow:hidden;color:var(--color-muted-foreground);font-size:11px;text-overflow:ellipsis}
.rowline .rt{text-align:right;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rowline .rt small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:10px;font-weight:600}
.hbar{display:flex;flex-direction:column;gap:10px}
.hbar .r{min-width:0}
.hbar .r .top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11.5px}
.hbar .r .top b{font-weight:700}
.hbar .r .top span{color:var(--color-muted-foreground);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.hbar .track{height:7px;overflow:hidden;border-radius:2px;background:#E2E8F0}
.hbar .track>i{display:block;height:100%;border-radius:2px}
.donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.map{position:relative;overflow:hidden;border:1px solid var(--color-border);border-radius:4px;background:var(--color-muted)}
.station{position:absolute;text-align:center;transform:translate(-50%,-50%)}
.station .pin{width:14px;height:14px;margin:0 auto;border:3px solid #FFFFFF;border-radius:50%;background:var(--color-accent);box-shadow:0 1px 3px rgba(15,23,42,.25)}
.station .pin.agv{background:var(--warn)}
.station .pin.charge{background:#6D28D9}
.station .lb{margin-top:3px;padding:1px 4px;border:1px solid var(--color-border);border-radius:2px;background:rgba(255,255,255,.94);color:var(--color-secondary);font-size:9.5px;font-weight:700;white-space:nowrap}
.pathsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.notice{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:10px 12px;
  border:1px solid #F59E0B;
  border-left-width:4px;
  border-radius:4px;
  background:#FFFBEB;
  color:#78350F;
  font-size:11.5px;
}
.notice.bad{border-color:var(--color-destructive);background:#FEF2F2;color:#991B1B}
.notice .material-symbols-outlined{flex:0 0 auto;font-size:18px}
.statline{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.statline .s b{font-family:"Poppins",sans-serif;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.statline .s span{display:block;color:var(--color-muted-foreground);font-size:10.5px}
#view{animation:view-enter .35s ease-out both}
.avhalo{animation:avp 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes view-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes avp{0%,100%{opacity:.22}50%{opacity:.6}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    width:auto;
    height:auto;
    position:static;
    flex:none;
    flex-direction:row;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    padding:12px 16px;
    border-right:0;
    border-bottom:1px solid var(--color-border);
  }
  .brand{padding:0;margin:0 auto 0 0;border:0}
  .navlabel,.sidefoot{display:none}
  .nav{width:100%;flex-direction:row;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding-bottom:2px}
  .nav button{width:auto;flex:0 0 auto;padding:9px 11px}
  .nav button:hover{transform:none}
  .nav button .idx{display:none}
  .main{padding:18px 16px 48px}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:600px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .topbar{gap:12px}
  .pill{width:100%;justify-content:center}
  .card{padding:14px}
  .kpi .val{font-size:25px}
  .nav button .txt{display:none}
  .nav button{min-width:44px;justify-content:center;padding:9px}
  .brand .logo{width:36px;height:36px;flex-basis:36px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #view,.avhalo{animation:none!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div>
        <h1>智搬調度</h1>
        <span>AGV/AMR Dispatch</span>
      </div>
    </div>
    <div class="navlabel">功能模組</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">純 UI 展示 · 擬真資料<br/>v2026.08 · 廠區 A 線</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="head">
        <div class="crumb" id="crumb">功能模組</div>
        <h2 id="scr-title">—</h2>
        <p id="scr-desc">—</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">radio_button_checked</span>即時連線 · WMS/WCS</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
"use strict";
var C={accent:"#0f766e",accent2:"#5eead4",teal3:"#0d9488",amber:"#d97706",red:"#dc2626",info:"#0891b2",violet:"#7c3aed",slate:"#94a3b8",grid:"#e2e8f0",ink:"#334155"};

var MODS=[
  {icon:"receipt_long",name:"搬運任務池",desc:"接收 WMS/MES 搬運需求，依優先級、時窗與物料類型自動排程等待派車。"},
  {icon:"precision_manufacturing",name:"車隊調度指派",desc:"綜合車輛電量、距離與載重，計算最適 AGV/AMR 派車並鎖定資源。"},
  {icon:"account_tree",name:"路徑規劃避障",desc:"多車無衝突路徑規劃、路口交通管制與動態避障策略。"},
  {icon:"monitoring",name:"即時車隊監控",desc:"全廠 AGV/AMR 位置、任務進度與異常事件即時看板。"},
  {icon:"bolt",name:"充電能源管理",desc:"電量預測、自動排隊充電與能耗統計，維持車隊續航。"},
  {icon:"insights",name:"稼動效率分析",desc:"稼動率、完成率、週期時間與異常統計的營運分析。"}
];

var charts={};
function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].destroy();}catch(e){}}charts[id]=new Chart(el.getContext("2d"),cfg);}
function batColor(p){return p>=60?C.teal3:(p>=30?C.amber:C.red);}

function kpi(icon,lab,val,delta,dir,note,barPct){
  var d="";
  if(delta){var ar=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");d='<span class="delta '+dir+'"><span class="material-symbols-outlined">'+ar+'</span>'+delta+'</span> ';}
  var bar=barPct?'<div class="bar"><i style="width:'+barPct+'%"></i></div>':'';
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'
    +'<div class="val">'+val+'</div>'+d+'<span class="flat" style="font-size:11.5px;font-weight:600">'+note+'</span>'+bar+'</div>';
}

var view=document.getElementById("view");
var navEl=document.getElementById("nav");
var navHtml="";
for(var i=0;i<MODS.length;i++){
  navHtml+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="txt">'+MODS[i].name+'</span><span class="idx">v'+i+'</span></button>';
}
navEl.innerHTML=navHtml;
var btns=navEl.querySelectorAll("[data-i]");
for(var b=0;b<btns.length;b++){
  btns[b].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
}

function show(i){
  i=Math.max(0,Math.min(i,MODS.length-1));
  destroyAll();
  var m=MODS[i];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-desc").textContent=m.desc;
  document.getElementById("crumb").textContent="功能模組 · v"+i;
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  view.innerHTML=R[i]();
  void view.offsetHeight;
  if(CH[i])CH[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
