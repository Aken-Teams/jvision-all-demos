<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGV/AMR智慧搬運調度系統｜純 UI 展示</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0f766e; --accent2:#5eead4; --accent-soft:#ccfbf1;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0891b2;
  --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:250px;flex:0 0 250px;min-width:0;background:var(--panel);
  border-right:1px solid var(--line);padding:22px 16px;
  display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;}
.brand .logo{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#0d5c56);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(15,118,110,.35);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.2px;}
.brand span{font-size:11px;color:var(--muted);font-weight:500;}
.navlabel{font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px 4px;letter-spacing:.5px;}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;min-width:0;
  border:0;background:transparent;color:#334155;cursor:pointer;
  padding:11px 12px;border-radius:11px;font-size:13.5px;font-weight:600;
  font-family:inherit;text-align:left;transition:all .15s;
}
.nav button .material-symbols-outlined{font-size:21px;color:var(--muted);flex:0 0 auto;}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav button .idx{margin-left:auto;font-size:11px;color:#94a3b8;font-weight:700;}
.nav button:hover{background:#f1f5f9;}
.nav button.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28);}
.nav button.on .material-symbols-outlined,.nav button.on .idx{color:#c6fff5;}
.sidefoot{margin-top:auto;padding:12px 10px 0;font-size:11px;color:#94a3b8;border-top:1px solid var(--line);}
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.topbar .head{min-width:0;flex:1;}
.crumb{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.topbar h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.4px;}
.topbar p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:640px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:#115e59;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;}
.pill .material-symbols-outlined{font-size:17px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.5fr 1fr;}
.grid>*{min-width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0;}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 14px;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .val{font-size:29px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px;}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);}
.kpi .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}
.kpi .bar{height:6px;border-radius:6px;background:#e2e8f0;margin-top:10px;overflow:hidden;}
.kpi .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.tblwrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#f8fafc;}
tbody tr:hover{background:#f8fafc;}
td.mono,th.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.t-ok{background:#dcfce7;color:#166534;}
.t-run{background:#cffafe;color:#155e75;}
.t-wait{background:#fef3c7;color:#92400e;}
.t-bad{background:#fee2e2;color:#991b1b;}
.t-idle{background:#e2e8f0;color:#475569;}
.t-chg{background:#ede9fe;color:#5b21b6;}
.bat{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;}
.batbar{width:44px;height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;}
.batbar>i{display:block;height:100%;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.tk .id{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
.tk .ti{font-size:13px;font-weight:700;margin:2px 0 4px;}
.tk .mt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tk .mt .material-symbols-outlined{font-size:13px;}
.tk.b-warn{border-left-color:var(--warn);}
.tk.b-bad{border-left-color:var(--bad);}
.tk.b-run{border-left-color:var(--info);}
.tk.b-ok{border-left-color:var(--ok);}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px;}
.tl .ev::before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl .ev.bad::before{background:var(--bad);box-shadow:0 0 0 2px #fecaca;}
.tl .ev.warn::before{background:var(--warn);box-shadow:0 0 0 2px #fde68a;}
.tl .tt{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
.tl .tx{font-size:13px;font-weight:600;margin:1px 0;}
.tl .td{font-size:12px;color:var(--muted);}
.chartbox{position:relative;width:100%;overflow:hidden;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.rowline{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;}
.rowline:last-child{border-bottom:0;}
.rowline .ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
.rowline .ic .material-symbols-outlined{font-size:20px;}
.rowline .gr{flex:1;min-width:0;}
.rowline .gr b{font-size:13.5px;}
.rowline .gr p{margin:1px 0 0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
.rowline .rt{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rowline .rt small{display:block;font-size:11px;color:var(--muted);font-weight:600;}
.hbar{display:flex;flex-direction:column;gap:12px;}
.hbar .r{min-width:0;}
.hbar .r .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.hbar .r .top b{font-weight:700;}
.hbar .r .top span{color:var(--muted);font-variant-numeric:tabular-nums;}
.hbar .track{height:9px;background:#e2e8f0;border-radius:6px;overflow:hidden;}
.hbar .track>i{display:block;height:100%;border-radius:6px;}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.map{position:relative;background:#f8fafc;border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.station{position:absolute;transform:translate(-50%,-50%);text-align:center;}
.station .pin{width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.25);margin:0 auto;}
.station .pin.agv{background:var(--warn);}
.station .pin.charge{background:#7c3aed;}
.station .lb{font-size:10px;font-weight:700;color:#475569;margin-top:3px;white-space:nowrap;background:rgba(255,255,255,.8);border-radius:5px;padding:0 4px;}
.pathsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.notice{display:flex;gap:10px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#92400e;}
.notice.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
.notice .material-symbols-outlined{font-size:19px;flex:0 0 auto;}
.statline{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px;}
.statline .s b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.statline .s span{display:block;font-size:11.5px;color:var(--muted);}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line);}
  .brand{padding:0;margin-right:auto;}
  .navlabel,.sidefoot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;}
  .nav button{width:auto;padding:9px 12px;}
  .nav button .idx{display:none;}
  .main{padding:20px 18px 50px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:9px 11px;}
  .topbar h2{font-size:20px;}
}
/*avhalo*/.avhalo{animation:avp 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes avp{0%,100%{opacity:.22}50%{opacity:.6}}</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div>
        <h1>智搬調度</h1>
        <span>AGV/AMR Dispatch</span>
      </div>
    </div>
    <div class="navlabel">功能模組</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">純 UI 展示 · 擬真資料<br/>v2026.08 · 廠區 A 線</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="head">
        <div class="crumb" id="crumb">功能模組</div>
        <h2 id="scr-title">—</h2>
        <p id="scr-desc">—</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">radio_button_checked</span>即時連線 · WMS/WCS</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
"use strict";
var C={accent:"#0f766e",accent2:"#5eead4",teal3:"#0d9488",amber:"#d97706",red:"#dc2626",info:"#0891b2",violet:"#7c3aed",slate:"#94a3b8",grid:"#e2e8f0",ink:"#334155"};

var MODS=[
  {icon:"receipt_long",name:"搬運任務池",desc:"接收 WMS/MES 搬運需求，依優先級、時窗與物料類型自動排程等待派車。"},
  {icon:"precision_manufacturing",name:"車隊調度指派",desc:"綜合車輛電量、距離與載重，計算最適 AGV/AMR 派車並鎖定資源。"},
  {icon:"account_tree",name:"路徑規劃避障",desc:"多車無衝突路徑規劃、路口交通管制與動態避障策略。"},
  {icon:"monitoring",name:"即時車隊監控",desc:"全廠 AGV/AMR 位置、任務進度與異常事件即時看板。"},
  {icon:"bolt",name:"充電能源管理",desc:"電量預測、自動排隊充電與能耗統計，維持車隊續航。"},
  {icon:"insights",name:"稼動效率分析",desc:"稼動率、完成率、週期時間與異常統計的營運分析。"}
];

var charts={};
function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].destroy();}catch(e){}}charts[id]=new Chart(el.getContext("2d"),cfg);}
function batColor(p){return p>=60?C.teal3:(p>=30?C.amber:C.red);}

function kpi(icon,lab,val,delta,dir,note,barPct){
  var d="";
  if(delta){var ar=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");d='<span class="delta '+dir+'"><span class="material-symbols-outlined">'+ar+'</span>'+delta+'</span> ';}
  var bar=barPct?'<div class="bar"><i style="width:'+barPct+'%"></i></div>':'';
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'
    +'<div class="val">'+val+'</div>'+d+'<span class="flat" style="font-size:11.5px;font-weight:600">'+note+'</span>'+bar+'</div>';
}

var R=[];

R[0]=function(){
  var tasks=[
    {id:"HT-24817",from:"收貨區 R2",to:"高架 A-14",mat:"鋼捲 · 1.2t",pri:"急件",cls:"t-bad",win:"14:20",st:"待派車",sc:"t-wait"},
    {id:"HT-24818",from:"組裝線 L3",to:"暫存 B-07",mat:"半成品箱 ×12",pri:"高",cls:"t-run",win:"14:35",st:"待派車",sc:"t-wait"},
    {id:"HT-24819",from:"高架 A-09",to:"出貨月台 D1",mat:"棧板 ×4",pri:"一般",cls:"t-idle",win:"15:10",st:"排程中",sc:"t-run"},
    {id:"HT-24820",from:"塗裝線 P1",to:"烘乾區 K2",mat:"掛具料架",pri:"高",cls:"t-run",win:"14:48",st:"待派車",sc:"t-wait"},
    {id:"HT-24821",from:"收貨區 R1",to:"檢驗區 Q",mat:"進料箱 ×8",pri:"一般",cls:"t-idle",win:"15:25",st:"排程中",sc:"t-run"},
    {id:"HT-24822",from:"暫存 B-03",to:"組裝線 L1",mat:"物料車 ×2",pri:"急件",cls:"t-bad",win:"14:30",st:"待派車",sc:"t-wait"}
  ];
  var rows=tasks.map(function(t){
    return '<tr><td class="mono"><b>'+t.id+'</b></td><td>'+t.from+' <span style="color:#94a3b8">&rarr;</span> '+t.to+'</td><td>'+t.mat+'</td><td><span class="tag '+t.cls+'">'+t.pri+'</span></td><td class="mono">'+t.win+'</td><td><span class="tag '+t.sc+'">'+t.st+'</span></td></tr>';
  }).join("");
  return ''
  +'<div class="grid g4" style="margin-bottom:16px">'
    +kpi("pending_actions","待派任務","38","+6","up","較上時段","82")
    +kpi("bolt","急件比例","21%","-4pt","up","占任務池","40")
    +kpi("timer","平均等待","4.7 <small>分</small>","-1.2","up","入池到派車","62")
    +kpi("inventory_2","已排程","124","","flat","本班累計","70")
  +'</div>'
  +'<div class="grid g23">'
    +'<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>搬運任務優先佇列</h3><p class="sub">依時窗與優先級自動排序，急件置頂等待派車</p>'
      +'<div class="tblwrap"><table><thead><tr><th>任務單號</th><th>起點 / 終點</th><th>物料</th><th>優先級</th><th class="mono">時窗</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>需求來源分布</h3><p class="sub">本班各區搬運需求筆數</p>'
      +'<div class="chartbox" style="height:230px"><canvas id="c0"></canvas></div></div>'
  +'</div>';
};

R[1]=function(){
  var fleet=[
    {id:"AGV-01",type:"堆高型",bat:88,st:"執行中",sc:"t-run",task:"HT-24810",eta:"3 分"},
    {id:"AGV-02",type:"潛伏頂升",bat:64,st:"待命",sc:"t-idle",task:"—",eta:"—"},
    {id:"AMR-05",type:"自主移動",bat:41,st:"執行中",sc:"t-run",task:"HT-24812",eta:"6 分"},
    {id:"AGV-03",type:"堆高型",bat:27,st:"返充中",sc:"t-chg",task:"—",eta:"12 分"},
    {id:"AMR-06",type:"自主移動",bat:95,st:"待命",sc:"t-idle",task:"—",eta:"—"},
    {id:"AGV-04",type:"潛伏頂升",bat:73,st:"執行中",sc:"t-run",task:"HT-24815",eta:"2 分"}
  ];
  var rows=fleet.map(function(f){
    var col=batColor(f.bat);
    return '<tr><td class="mono"><b>'+f.id+'</b></td><td>'+f.type+'</td>'
      +'<td><span class="bat"><span class="batbar"><i style="width:'+f.bat+'%;background:'+col+'"></i></span>'+f.bat+'%</span></td>'
      +'<td><span class="tag '+f.sc+'">'+f.st+'</span></td><td class="mono">'+f.task+'</td><td class="mono">'+f.eta+'</td></tr>';
  }).join("");
  return ''
  +'<div class="notice"><span class="material-symbols-outlined">info</span>建議：<b style="margin:0 4px">HT-24817（急件）</b>指派給 <b style="margin:0 4px">AMR-06（電量 95%，距收貨區 42m）</b>，預估到位 2 分 10 秒。</div>'
  +'<div class="grid g4" style="margin:16px 0">'
    +kpi("directions_car","線上車輛","14 / 16","","flat","2 台維護中","88")
    +kpi("battery_charging_full","平均電量","64%","+3","up","車隊平均","64")
    +kpi("route","本班完成","287","+41","up","任務數","76")
    +kpi("percent","指派成功率","98.6%","+0.4","up","首次派車命中","98")
  +'</div>'
  +'<div class="grid g32">'

var view=document.getElementById("view");
var navEl=document.getElementById("nav");
var navHtml="";
for(var i=0;i<MODS.length;i++){
  navHtml+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="txt">'+MODS[i].name+'</span><span class="idx">v'+i+'</span></button>';
}
navEl.innerHTML=navHtml;
var btns=navEl.querySelectorAll("[data-i]");
for(var b=0;b<btns.length;b++){
  btns[b].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
}

function show(i){
  i=Math.max(0,Math.min(i,MODS.length-1));
  destroyAll();
  var m=MODS[i];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-desc").textContent=m.desc;
  document.getElementById("crumb").textContent="功能模組 · v"+i;
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  view.innerHTML=R[i]();
  void view.offsetHeight;
  if(CH[i])CH[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
