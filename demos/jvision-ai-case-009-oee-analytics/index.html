<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OEE 稼動洞察站 · OEE Analytics</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0d9488;--accent2:#14b8a6;--ink:#0f2320;--bg:#f1f6f5;--card:#fff;--line:#dbe8e5;--mut:#5f7a75;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--slate:#334155}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap;box-shadow:0 1px 0 rgba(13,148,136,.06)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(13,148,136,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#e6f2f0;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(13,148,136,.35)}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#ccfbf1;color:#0f766e;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(13,148,136,.12),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.30}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.25fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .r{margin-left:auto}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#cffafe;color:#0e7490}.t-run{background:#ccfbf1;color:#0f766e}
.chart{height:250px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef6f4}
table.data td b{font-family:Inter}
.scroll{overflow-x:auto}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gauges>*{min-width:0}
.gcard{border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;background:#fbfdfd}
.gcard .gc{height:150px}
.gcard b{font-family:"Noto Sans TC";font-size:13px;display:block}
.gcard small{color:var(--mut);font-size:11px}
.lines{display:flex;flex-direction:column;gap:11px}
.lr{display:grid;grid-template-columns:56px 1fr 48px;gap:11px;align-items:center}
.lr b{font-size:12.5px;font-family:"Noto Sans TC"}
.bar{height:13px;background:#eef4f3;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lr small{font-size:12.5px;font-weight:700;text-align:right;font-family:Inter}
.loss{display:flex;flex-direction:column;gap:9px}
.lo{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lo .ix{width:34px;height:34px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:800;font-family:Inter;flex:none}
.lo .mid b{font-size:13px;font-family:"Noto Sans TC"}
.lo .mid small{color:var(--mut);font-size:11px}
.lo .rt{text-align:right}.lo .rt b{font-family:Inter;font-size:15px}.lo .rt small{display:block;font-size:10px;color:var(--mut)}
.cell{display:inline-block;min-width:44px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:11.5px;color:#fff;font-family:Inter}
.mtx{width:100%;border-collapse:collapse;font-size:12.5px}
.mtx th,.mtx td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
.mtx th{color:var(--mut);font-weight:700;font-size:11.5px}
.mtx td:first-child,.mtx th:first-child{text-align:left;font-family:"Noto Sans TC"}
.ev{display:flex;flex-direction:column;gap:9px}
.ei{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:10px 12px}
.ei.bad{border-color:var(--bad);background:#fef2f2}.ei.info{border-color:var(--accent);background:#f0fdfa}
.ei .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.ei.bad .material-symbols-outlined{color:var(--bad)}.ei.info .material-symbols-outlined{color:var(--accent)}
.ei b{font-size:12.5px;font-family:"Noto Sans TC"}
.ei small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ei .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.imp{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ic2{border:1px solid var(--line);border-radius:13px;padding:13px;border-top:4px solid var(--accent)}
.ic2 b{font-family:"Noto Sans TC";font-size:13.5px}
.ic2 .big{font-family:Inter;font-weight:800;font-size:22px;color:var(--accent);margin-top:4px}
.ic2 small{color:var(--mut);font-size:11px;display:block}
.kaizen{display:flex;flex-direction:column;gap:11px}
.kz{border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.kz .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.kz .hd b{font-family:"Noto Sans TC";font-size:13.5px}
.kz .hd .id{font-family:Inter;font-weight:800;font-size:12px;color:var(--accent)}
.kz small{color:var(--mut);font-size:11.5px;display:block;margin-top:5px}
.kz .prog{height:7px;background:#eef4f3;border-radius:6px;overflow:hidden;margin-top:9px}
.kz .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.kz .meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.two,.gauges{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">稼</div><div><b>OEE 稼動洞察站</b><span>OEE ANALYTICS STATION</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">稼動總覽</h2><p id="vd"></p></div><div class="live" id="live">● 監控 5 條產線 · 3 班別</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["稼動總覽","dashboard","稼動總覽","全廠 OEE 戰情、即時稼動與當班產出"],
["OEE 分析","donut_large","OEE 三率分析","稼動率×性能×良率拆解與損失落點"],
["六大損失","bar_chart","六大損失分析","六大損失 Pareto 歸因與時間佔比"],
["產線比較","compare_arrows","產線班別比較","跨產線與班別稼動熱力對比"],
["停機分析","timer_off","停機事件分析","停機事件明細、Pareto 與趨勢"],
["改善追蹤","trending_up","改善追蹤","改善行動看板與 OEE 回升軌跡"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

// 產線稼動明細 [線, 稼動率A, 性能P, 良率Q, OEE]
const LINES=[["A 線",92,88,99.2,80],["B 線",85,91,98.7,76],["C 線",96,84,99.5,80],["D 線",79,95,99.1,74],["E 線",81,79,98.2,63]];
function oeeColor(v){return v>=80?'#15803d':v>=70?'#0d9488':v>=60?'#d97706':'#dc2626';}
// 六大損失 [名稱, 分鐘, 說明, 色]
const LOSS=[["設備故障停機",312,"E 線治具磨損、C 線伺服異常","#dc2626"],["換線換模",248,"多線換型頻繁、SMED 未落實","#ea580c"],["小停機與空轉",186,"卡料、感測誤停、待料空轉","#d97706"],["速度降載",142,"刀具磨耗導致降速運轉","#ca8a04"],["製程不良重工",96,"首件與過程不良品重工","#0d9488"],["起機與暖機損失",58,"開班暖機與試模損失","#0891b2"]];
// 停機事件 [時間, 產線, 類別, 時長, 狀態, 說明]
const DOWN=[["08:12","E 線","設備故障","42 分","t-bad","治具磨損停機，維修中"],["09:40","C 線","換線換模","28 分","t-warn","切換感測外殼型號"],["11:05","B 線","小停機","9 分","t-warn","卡料排除"],["13:22","A 線","製程不良","15 分","t-info","首件重工調機"],["14:50","D 線","速度降載","22 分","t-warn","刀具磨耗降速"],["16:18","C 線","小停機","7 分","t-warn","感測誤停復歸"]];
// 改善行動 [id, 標題, 負責, 目標, 進度, 狀態, 狀態tag]
const KZ=[["KZ-034","C 線導入 SMED 快速換模","製造課 · 李","換線 38→18 分",72,"進行中","t-run"],["KZ-031","E 線治具預防性更換","保養組 · 王","MTBF +40%",100,"已結案","t-ok"],["KZ-029","B 線防呆感測校正","工程 · 陳","小停機 -50%",55,"進行中","t-run"],["KZ-027","刀具壽命監控上線","工程 · 張","降載損失 -60%",30,"啟動","t-warn"]];

const SCREENS=[
// v0 稼動總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">insights</span><div class="l">全廠 OEE</div><div class="v">75<small style="font-size:12px">%</small></div><div class="d up">▲ 較上月 +6%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">check_circle</span><div class="l">綜合良率 Q</div><div class="v">98.9<small style="font-size:12px">%</small></div><div class="d up">▲ +0.4%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">timer_off</span><div class="l">當班停機時間</div><div class="v">18.4<small style="font-size:12px"> min</small></div><div class="d up">▼ 較昨日 -32%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">factory</span><div class="l">產出達成率</div><div class="v">94<small style="font-size:12px">%</small></div><div class="d" style="color:var(--mut)">目標 24,000 pcs</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 7 日全廠 OEE 趨勢<span class="tag t-run r">目標 80%</span></h3><div class="chart" id="c_trend" style="height:290px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">speed</span>各產線即時 OEE</h3><div class="lines">${LINES.map(l=>`<div class="lr"><b>${l[0]}</b><div class="bar"><i style="width:${l[4]}%;background:${l[4]>=80?'linear-gradient(90deg,#0d9488,#14b8a6)':l[4]>=70?'#d97706':'#dc2626'}"></i></div><small style="color:${oeeColor(l[4])}">${l[4]}%</small></div>`).join('')}</div>
  <div class="legend"><span><i class="dot" style="background:#15803d"></i>達標 ≥80%</span><span><i class="dot" style="background:#d97706"></i>觀察 70-79%</span><span><i class="dot" style="background:#dc2626"></i>待改善 &lt;70%</span></div></div>
</div>`,
// v1 OEE 三率分析
()=>`<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>C 線 OEE 三率拆解<span class="tag t-run r">當班 · 早班</span></h3>
 <div class="gauges">
  <div class="gcard"><div class="gc" id="g_a"></div><b>稼動率 Availability</b><small>運轉 442 / 計畫 460 分</small></div>
  <div class="gcard"><div class="gc" id="g_p"></div><b>性能 Performance</b><small>實際 / 理論節拍</small></div>
  <div class="gcard"><div class="gc" id="g_q"></div><b>良率 Quality</b><small>良品 11,940 / 12,000</small></div>
 </div>
 <p style="font-size:12px;color:var(--mut);margin:14px 0 0">OEE = 稼動率 96% × 性能 84% × 良率 99.5% = <b style="color:var(--accent);font-family:Inter">80.2%</b>。性能為最大拉低因子，對應速度降載與小停機損失。</p>
</div>
<div class="grid g11" style="margin-top:16px">
 <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各產線三率堆疊對比</h3><div class="chart" id="c_stack" style="height:270px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">table_rows</span>各產線稼動明細</h3><div class="scroll"><table class="data"><tr><th>產線</th><th>稼動率</th><th>性能</th><th>良率%</th><th>OEE</th></tr>${LINES.map(l=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}%</td><td>${l[2]}%</td><td>${l[3]}</td><td><b style="color:${oeeColor(l[4])}">${l[4]}%</b></td></tr>`).join('')}</table></div></div>
</div>`,
// v2 六大損失
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>六大損失 Pareto（本週 · 分鐘）</h3><div class="chart" id="c_pareto" style="height:300px"></div><p style="font-size:11.5px;color:var(--mut);margin:10px 0 0">柱為各類損失時間，折線為累積佔比；前 3 類即佔 <b style="color:var(--accent)">67%</b> 損失，為改善優先項。</p></div>
 <div class="card"><h3><span class="material-symbols-outlined">format_list_bulleted</span>損失類別歸因</h3><div class="loss">${LOSS.map((l,i)=>{const tot=LOSS.reduce((s,x)=>s+x[1],0);const p=Math.round(l[1]/tot*100);return `<div class="lo"><span class="ix" style="background:${l[3]}">${i+1}</span><div class="mid"><b>${l[0]}</b><small>${l[2]}</small></div><div class="rt"><b>${l[1]}</b><small>${p}% · 分</small></div></div>`;}).join('')}</div></div>
</div>`,
// v3 產線班別比較
()=>`<div class="card"><h3><span class="material-symbols-outlined">grid_on</span>產線 × 班別 OEE 熱力矩陣（%）</h3>
 <div class="scroll"><table class="mtx" id="heat"></table></div>
 <div class="legend"><span><i class="dot" style="background:#15803d"></i>≥80</span><span><i class="dot" style="background:#0d9488"></i>75-79</span><span><i class="dot" style="background:#d97706"></i>65-74</span><span><i class="dot" style="background:#dc2626"></i>&lt;65</span><span style="margin-left:auto">早/中/夜三班別，數字為當班 OEE</span></div>
</div>
<div class="grid g11" style="margin-top:16px">
 <div class="card"><h3><span class="material-symbols-outlined">radar</span>產線稼動能力雷達</h3><div class="chart" id="c_radar" style="height:280px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">groups</span>班別 OEE 對比</h3><div class="chart" id="c_shift" style="height:280px"></div></div>
</div>`,
// v4 停機分析
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">timer_off</span><div class="l">當班停機事件</div><div class="v">6 <small style="font-size:12px">件</small></div><div class="d" style="color:var(--mut)">累計 123 分</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">bolt</span><div class="l">MTBF 平均間隔</div><div class="v">84 <small style="font-size:12px">min</small></div><div class="d up">▲ +18%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">restart_alt</span><div class="l">MTTR 平均修復</div><div class="v">20.5 <small style="font-size:12px">min</small></div><div class="d up">▼ -9%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">error</span><div class="l">最長單次停機</div><div class="v" style="color:var(--bad)">42 <small style="font-size:12px">min</small></div><div class="d" style="color:var(--mut)">E 線 · 設備故障</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">event_note</span>當班停機事件明細</h3><div class="scroll"><table class="data"><tr><th>時間</th><th>產線</th><th>類別</th><th>時長</th><th>說明</th></tr>${DOWN.map(d=>`<tr><td><b>${d[0]}</b></td><td>${d[1]}</td><td><span class="tag ${d[4]}">${d[2]}</span></td><td><b>${d[3]}</b></td><td style="color:var(--mut)">${d[5]}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>近 7 日停機時間趨勢</h3><div class="chart" id="c_down" style="height:270px"></div></div>
</div>`,
// v5 改善追蹤
