<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#F8FAFC"/>
<title>工廠設備稼動分析站</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-size:19px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}
.skip{
  position:fixed;
  left:12px;
  top:-60px;
  z-index:100;
  padding:10px 14px;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  font-weight:700;
  text-decoration:none;
}
.skip:focus{top:12px}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:22px;
  min-height:66px;
  padding:10px clamp(14px,2.5vw,34px);
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.96);
  box-shadow:0 2px 12px rgba(15,23,42,.04);
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:245px;
}
.logo{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  flex:none;
  color:var(--color-on-primary);
  background:var(--blue);
  border:1px solid #1D4ED8;
  border-radius:4px;
  box-shadow:4px 4px 0 #BFDBFE;
  font-family:"Fira Code",monospace;
  font-size:15px;
  font-weight:700;
}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9px;
  letter-spacing:.12em;
}
.nav{
  display:flex;
  align-items:center;
  gap:3px;
  margin-left:auto;
  padding:3px;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:6px;
  background:#F8FAFC;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:flex;
  align-items:center;
  gap:6px;
  min-height:38px;
  flex:none;
  padding:8px 10px;
  color:var(--muted);
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  color:var(--blue);
  border-color:#BFDBFE;
  background:#EFF6FF;
  transform:translateY(-1px);
}
.nav button.on{
  color:var(--color-on-primary);
  border-color:#1D4ED8;
  background:var(--blue);
  box-shadow:0 2px 5px rgba(37,99,235,.22);
}
.wrap{
  width:min(100%,1440px);
  margin:0 auto;
  padding:clamp(16px,2.4vw,32px);
}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
  padding:4px 0 14px;
  border-bottom:2px solid var(--ink);
}
.vh h1{
  margin:0;
  font-size:clamp(22px,2vw,30px);
  line-height:1.15;
  letter-spacing:-.025em;
}
.vh p{
  max-width:720px;
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:32px;
  padding:6px 10px;
  flex:none;
  color:#166534;
  border:1px solid #86EFAC;
  border-radius:4px;
  background:#F0FDF4;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.live::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:#16A34A;
  box-shadow:0 0 0 3px #DCFCE7;
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px;
}
.kpi,.card,.gcard,.lo,.ic2,.kz{
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.kpi{
  position:relative;
  min-height:126px;
  padding:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--blue);
}
.kpi:hover{
  border-color:#93C5FD;
  box-shadow:0 10px 28px rgba(37,99,235,.1);
  transform:translateY(-2px);
}
.kpi .l{
  padding-right:32px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.03em;
}
.kpi .v{
  margin-top:8px;
  font-family:"Fira Code",monospace;
  font-size:clamp(24px,2.5vw,31px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{font-size:11px!important;letter-spacing:0}
.kpi .d{
  margin-top:6px;
  font-size:11px;
  font-weight:600;
}
.kpi .ic{
  position:absolute;
  right:13px;
  top:13px;
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  color:var(--blue);
  border:1px solid #BFDBFE;
  border-radius:4px;
  background:#EFF6FF;
}
.up{color:#166534}
.dn{color:#B91C1C}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  min-width:0;
  padding:16px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease;
}
.card:hover{
  border-color:#CBD5E1;
  box-shadow:0 12px 30px rgba(15,23,42,.07);
}
.card h2{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:25px;
  margin:0 0 13px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h2>.material-symbols-outlined{color:var(--blue)}
.card h2 .r,.hd .r{margin-left:auto}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-info{color:#075985;background:#F0F9FF}
.t-run{color:#1D4ED8;background:#EFF6FF}
.chart{height:250px}
.scroll{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:4px;
}
table.data,.mtx{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
table.data th,table.data td,.mtx th,.mtx td{
  padding:10px 11px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
table.data tr:last-child td,.mtx tr:last-child td{border-bottom:0}
table.data th,.mtx th{
  color:#334155;
  background:#F1F5F9;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.035em;
}
table.data tbody tr:hover td,.mtx tr:hover td{background:#F8FAFC}
table.data td:nth-child(n+2),.mtx td:not(:first-child){
  font-variant-numeric:tabular-nums;
}
table.data td b,.mtx td b{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
table.data.num-right th:nth-last-child(-n+4),
table.data.num-right td:nth-last-child(-n+4){text-align:right}
.gauges{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.gcard{
  padding:10px;
  text-align:center;
  background:#FCFDFE;
}
.gcard .gc{height:150px}
.gcard b{display:block;font-size:12px}
.gcard small{color:var(--muted);font-size:10.5px}
.lines{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.lr{
  display:grid;
  grid-template-columns:44px minmax(100px,1fr) 58px;
  gap:10px;
  align-items:center;
}
.lr b{font-size:12px}
.lr small{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.bar,.prog{
  overflow:hidden;
  background:#E2E8F0;
  border-radius:2px;
}
.bar{height:10px}
.bar i,.prog i{
  display:block;
  height:100%;
  background:var(--blue);
  border-radius:2px;
}
.loss{display:flex;flex-direction:column;gap:8px}
.lo{
  display:grid;
  grid-template-columns:32px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:9px 10px;
  transition:transform .2s ease,border-color .2s ease;
}
.lo:hover{border-color:#93C5FD;transform:translateX(2px)}
.lo .ix{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  color:#fff;
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.lo .mid{min-width:0}
.lo .mid b{display:block;font-size:12px}
.lo .mid small{
  display:block;
  overflow:hidden;
  color:var(--muted);
  font-size:10.5px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.lo .rt{text-align:right}
.lo .rt b{
  font-family:"Fira Code",monospace;
  font-size:14px;
  font-variant-numeric:tabular-nums;
}
.lo .rt small{display:block;color:var(--muted);font-size:9.5px}
.mtx th,.mtx td{text-align:center}
.mtx td:first-child,.mtx th:first-child{text-align:left}
.cell{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  padding:5px 7px;
  color:#fff;
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.cell::before{
  content:attr(data-status);
  margin-right:4px;
  font-family:"Fira Sans",sans-serif;
  font-size:8px;
  font-weight:600;
}
.legend{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:10px;
  color:var(--muted);
  font-size:10.5px;
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{
  display:inline-block;
  width:9px;
  height:9px;
  border:1px solid rgba(15,23,42,.18);
  border-radius:2px;
}
.ev{display:flex;flex-direction:column;gap:8px}
.ei{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 11px;
  color:#78350F;
  border:1px solid #FDE68A;
  border-left:4px solid #D97706;
  border-radius:4px;
  background:#FFFBEB;
}
.ei.bad{color:#991B1B;border-color:#FECACA;border-left-color:var(--bad);background:#FEF2F2}
.ei.info{color:#1E40AF;border-color:#BFDBFE;border-left-color:var(--blue);background:#EFF6FF}
.ei .material-symbols-outlined{flex:none;color:currentColor}
.ei b{font-size:12px}
.ei small{display:block;margin-top:1px;color:var(--muted);font-size:10.5px}
.ei .tm{
  margin-left:auto;
  flex:none;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9.5px;
}
.imp{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.ic2{
  position:relative;
  min-height:105px;
  padding:13px;
  overflow:hidden;
}
.ic2::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:34px;
  height:4px;
  background:var(--color-accent);
}
.ic2 b{font-size:12px}
.ic2 .big{
  margin-top:4px;
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:22px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.ic2 small{display:block;color:var(--muted);font-size:10.5px}
.kaizen{display:flex;flex-direction:column;gap:9px}
.kz{
  padding:11px 12px;
  transition:border-color .2s ease,transform .2s ease;
}
.kz:hover{border-color:#93C5FD;transform:translateY(-1px)}
.kz .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kz .hd b{font-size:12px}
.kz .id{
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:700;
}
.kz small{display:block;margin-top:4px;color:var(--muted);font-size:10.5px}
.kz .prog{height:6px;margin-top:8px}
.kz .meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:4px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9.5px;
}
.view-enter>*{animation:stagger-in .4s cubic-bezier(.2,.8,.2,1) both}
.view-enter>*:nth-child(2){animation-delay:.06s}
.view-enter>*:nth-child(3){animation-delay:.12s}
@keyframes stagger-in{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .top{align-items:flex-start;flex-direction:column;gap:8px}
  .brand{min-width:0}
  .nav{width:100%;margin-left:0}
  .g2,.g11{grid-template-columns:1fr}
  .imp{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gauges,.g3,.two{grid-template-columns:1fr}
  .vh{align-items:flex-start;flex-direction:column}
  .live{align-self:flex-start}
}
@media(max-width:480px){
  .top{padding:9px 12px}
  .brand span{letter-spacing:.08em}
  .wrap{padding:14px 12px 24px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{min-height:116px;padding:13px}
  .kpi .v{font-size:22px}
  .kpi .ic{width:27px;height:27px}
  .nav button{min-width:42px;justify-content:center;padding:8px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .card{padding:13px}
  .imp{grid-template-columns:1fr 1fr}
  .legend span:last-child{margin-left:0!important}
}
@media(max-width:375px){
  .kpis,.imp{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .view-enter>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<a class="skip" href="#view">跳至主要內容</a>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">OEE</div>
    <div><b>工廠設備稼動分析站</b><span>PRODUCTION OPERATIONS</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="分析畫面"></nav>
</header>
<main class="wrap">
  <div class="vh">
    <div><h1 id="vt">稼動總覽</h1><p id="vd"></p></div>
    <div class="live" id="live">監控 5 條產線 · 3 班別</div>
  </div>
  <div id="view" class="view-enter" tabindex="-1"></div>
</main>
<script>
const MOD=[
["稼動總覽","dashboard","稼動總覽","全廠 OEE 戰情、即時稼動與當班產出"],
["OEE 分析","donut_large","OEE 三率分析","稼動率×性能×良率拆解與損失落點"],
["六大損失","bar_chart","六大損失分析","六大損失 Pareto 歸因與時間佔比"],
["產線比較","compare_arrows","產線班別比較","跨產線與班別稼動熱力對比"],
["停機分析","timer_off","停機事件分析","停機事件明細、Pareto 與趨勢"],
["改善追蹤","trending_up","改善追蹤","改善行動看板與 OEE 回升軌跡"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+'</span><span>'+m[0]+"</span>";
  b.onclick=()=>{location.hash="v"+i};
  nav.appendChild(b);
});

const LINES=[["A 線",92,88,99.2,80],["B 線",85,91,98.7,76],["C 線",96,84,99.5,80],["D 線",79,95,99.1,74],["E 線",81,79,98.2,63]];

function show(i){

  nav.querySelectorAll("button").forEach(b=>{

  vd.textContent=MOD[i][3];
  view.classList.remove("view-enter");
  view.innerHTML=SCREENS[i]();
  void view.offsetWidth;
  view.classList.add("view-enter");
  draw(i);
