<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研發工時與投入管理 · PLM 研發管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#DCFCE7;
  --accent-soft2:#BBF7D0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#DCFCE7;
  --hov:#ECFDF3;
  --track:#D7E9DD;
  --sidebar:#052E16;
  --sidebar2:#14532D;
  --side-edge:#4ADE80;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#0369A1;
  --r:0;
  --glow:rgba(20,83,45,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:auto}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(21,128,61,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.07) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Exo",sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Exo",sans-serif}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:none;
  flex-direction:column;
  width:264px;
  height:100vh;
  padding:0;
  overflow:hidden;
  color:#F0FDF4;
  background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  padding:24px 18px;
  background:var(--color-primary);
  border-bottom:3px solid #052E16;
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  color:#052E16;
  background:var(--color-secondary);
  border:3px solid #052E16;
  box-shadow:5px 5px 0 #052E16;
}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt b{
  display:block;
  font-size:16px;
  font-weight:800;
  letter-spacing:.06em;
}
.brand-txt span{
  display:block;
  margin-top:3px;
  color:#DCFCE7;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  letter-spacing:.14em;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:0;
  min-width:0;
  margin-top:18px;
  border-top:1px solid rgba(187,247,208,.35);
}
.nav button{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  min-height:52px;
  padding:12px 17px;
  color:#DCFCE7;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:0;
  border-bottom:1px solid rgba(187,247,208,.35);
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.nav button:hover{
  color:#FFFFFF;
  background:#166534;
}
.nav button.on{
  color:#052E16;
  font-weight:800;
  background:var(--color-secondary);
  box-shadow:inset 7px 0 0 var(--color-accent);
}
.nav button.on:hover{background:#4ADE80}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav .idx{
  margin-left:auto;
  font-family:"Roboto Mono",monospace;
  font-size:11px;
  font-weight:700;
}
.side-foot{
  margin-top:auto;
  padding:17px 18px 20px;
  color:#BBF7D0;
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
  line-height:1.8;
  border-top:3px solid var(--color-primary);
}
.side-foot b{color:#FFFFFF}
.main{
  flex:1;
  min-width:0;
  padding:26px 30px 64px;
}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  min-height:104px;
  margin-bottom:22px;
  padding:21px 22px;
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--color-primary);
}
.topbar::before{
  content:"CURRENT VIEW / 研發投入監測";
  position:absolute;
  top:-11px;
  left:18px;
  padding:3px 8px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid var(--ink);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(22px,3vw,34px);
  font-weight:800;
  line-height:1.15;
  letter-spacing:-.035em;
}
.topbar h1 .material-symbols-outlined{
  color:var(--accent);
  font-size:31px;
}
.topbar .sub{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}
.top-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 10px;
  color:var(--ink);
  background:var(--panel);
  border:2px solid var(--ink);
  font-size:11px;
  font-weight:700;
}
.chip .dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid var(--ink);
  animation:pulse 2s infinite;
}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--ink);
  font-weight:800;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
  padding-bottom:12px;
  border-bottom:2px solid var(--ink);
  flex-wrap:wrap;
}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.035em;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:var(--accent);
  font-size:20px;
}
.card-h .hint{
  color:var(--muted);
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
}
.sec>h3{
  margin-bottom:14px;
  padding-bottom:11px;
  border-bottom:2px solid var(--ink);
}
.sec>p{
  margin:0 0 13px;
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}
.dl{
  display:grid;
  grid-template-columns:136px minmax(0,1fr);
  gap:10px 18px;
  margin:0;
  font-size:13px;
}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.8}
.kpi,.stat{
  position:relative;
  overflow:hidden;
  padding:16px 17px;
}
.kpi:nth-child(even),.tile:nth-child(even){transform:translateY(8px)}
.kpi::after{
  content:"";
  position:absolute;
  top:-28px;
  right:-28px;
  width:72px;
  height:72px;
  background:var(--accent-soft);
  border:2px solid var(--ink);
  transform:rotate(20deg);
}
.kpi .ico{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  color:#052E16;
  background:var(--color-secondary);
  border:2px solid var(--ink);
}
.kpi .ico .material-symbols-outlined{font-size:22px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:13px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.stat .lbl{margin-top:0}
.kpi .val,.stat .val,.tile .tv{
  margin-top:4px;
  color:var(--ink);
  font-family:"Roboto Mono",monospace;
  font-size:26px;
  font-weight:700;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Exo",sans-serif;
  font-size:12px;
  font-weight:700;
}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:7px;
  padding:2px 5px;
  border:1px solid currentColor;
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
  font-weight:700;
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
}
th{
  padding:12px 14px;
  color:#14532D;
  text-align:left;
  white-space:nowrap;
  background:var(--th);
  border-right:1px solid #86EFAC;
  border-bottom:3px solid var(--ink);
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.06em;
}
th:last-child{border-right:0}
td{
  padding:12px 14px;
  white-space:nowrap;
  border-right:1px solid var(--line);
  border-bottom:1px solid #86EFAC;
  font-variant-numeric:tabular-nums;
}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hov)}
tbody tr:focus-within{outline:3px solid var(--color-ring);outline-offset:-3px}
.mono{
  font-family:"Roboto Mono",monospace;
  font-weight:700;
  letter-spacing:.015em;
}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  white-space:nowrap;
  border:1px solid currentColor;
  font-size:10.5px;
  font-weight:800;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#14532D;background:#BBF7D0}
.bar{
  min-width:62px;
  height:10px;
  overflow:hidden;
  background:var(--track);
  border:1px solid var(--ink);
}
.bar>i{
  display:block;
  height:100%;
  background:repeating-linear-gradient(135deg,var(--accent),var(--accent) 5px,var(--color-secondary) 5px,var(--color-secondary) 9px);
}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{
  flex:none;
  width:38px;
  color:var(--muted);
  text-align:right;
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
  font-weight:700;
}
.tile{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:17px;
}
.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  color:#052E16;
  background:var(--color-secondary);
  border:2px solid var(--ink);
}
.tile .ti .material-symbols-outlined{font-size:22px}
.tile b{font-size:13px;font-weight:800;letter-spacing:.03em}
.tile p{
  margin:0;
  color:var(--muted);
  font-size:11.5px;
  line-height:1.6;
}
.tile .tv{font-size:23px}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:7px;
  width:3px;
  background:var(--ink);
}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-24px;
  width:15px;
  height:15px;
  background:#FFFFFF;
  border:4px solid var(--accent);
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{
  color:var(--muted);
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
  font-weight:700;
}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 2px;
  border-bottom:1px dashed var(--ink);
  font-size:12.5px;
}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{
  margin-top:13px;
  padding-top:12px;
  color:var(--muted);
  border-top:1px dashed var(--ink);
  font-size:11.5px;
  line-height:1.7;
}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.board>*{min-width:0}
.col{
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:11px;
  background:var(--th);
  border:2px solid var(--ink);
}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 4px 6px;
  font-size:12.5px;
  font-weight:800;
}
.col-h .cnt{
  padding:1px 8px;
  color:var(--ink);
  background:#FFFFFF;
  border:1px solid var(--ink);
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
}
.pcard{
  padding:11px 12px;
  background:#FFFFFF;
  border:2px solid var(--ink);
  border-left:7px solid var(--accent);
}
.pcard b{font-size:12.5px}
.pcard .meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}
.pcard .who,.who{display:inline-flex;align-items:center;gap:6px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{
  display:inline-flex;
  flex:none;
  align-items:center;
  justify-content:center;
  color:var(--ink);
  background:var(--accent-soft);
  border:1px solid var(--ink);
  font-weight:800;
}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  padding:12px 14px;
  background:#FFFFFF;
  border:2px solid var(--ink);
}
.lane-row .num{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  color:#052E16;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-family:"Roboto Mono",monospace;
  font-size:13px;
  font-weight:700;
}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  color:#64748B;
  background:#FFFFFF;
  border:2px solid #64748B;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
}
.steps .ln{width:20px;height:2px;background:#64748B}
.steps .s.done{color:#FFFFFF;background:var(--accent);border-color:var(--ink)}
.steps .s.cur{color:var(--accent);border:3px solid var(--accent);animation:pulse 1.6s infinite}
.steps .ln.done{height:4px;background:var(--accent)}
.rep-row{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  padding:12px 4px;
  border-bottom:1px dashed var(--ink);
}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{
  position:relative;
  height:9px;
  overflow:hidden;
  background:var(--track);
  border:1px solid var(--ink);
}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  text-align:right;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
}
.band{
  position:relative;
  min-width:150px;
  height:27px;
  background:var(--track);
  border:1px solid var(--ink);
}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.band .me{
  position:absolute;
  top:3px;
  width:12px;
  height:20px;
  background:var(--accent);
  border:1px solid var(--ink);
}
@media(min-width:1080px){
  #screen{
    display:grid;
    grid-template-columns:minmax(0,1fr) 286px;
    gap:18px;
    align-items:start;
  }
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{
    position:sticky;
    top:20px;
    grid-column:2;
    grid-row:1/span 99;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #screen>.grid.g4:first-child>*{width:100%}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    position:static;
    width:100%;
    height:auto;
    border-right:0;
    border-bottom:4px solid var(--color-secondary);
  }
  .brand{padding:14px 16px}
  .brand-logo{width:42px;height:42px;box-shadow:4px 4px 0 #052E16}

function show(i){
 killCharts();
 var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
  var active=+b.getAttribute("data-i")===i;
  b.classList.toggle("on",active);
  b.setAttribute("aria-current",active?"page":"false")
 });
 RENDER[i](document.getElementById("screen"))
}
buildNav();
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],MODULES.length-1):0);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
