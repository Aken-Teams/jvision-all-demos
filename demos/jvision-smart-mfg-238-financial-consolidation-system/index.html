<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>財務合併報表系統｜Financial Consolidation System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa;
  --bg:#0e0a1e; --bg2:#160f2e; --panel:#1c1436; --panel2:#241a45;
  --line:#342a56; --txt:#ece9f7; --mut:#a79fc6; --dim:#7d75a3;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#241a45 0%,var(--bg) 55%);
  color:var(--txt); -webkit-font-smoothing:antialiased;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topnav{
  position:sticky;top:0;z-index:20;background:rgba(14,10,30,.9);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:0 0 auto}
.logo .ms{font-size:22px}
.brand b{font-size:15px;font-weight:800;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--dim);white-space:nowrap}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.navbtns button{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--mut);
  padding:8px 12px;border-radius:9px;font-size:12.5px;font-weight:600;
  font-family:inherit;transition:.15s;white-space:nowrap;min-width:0;
}
.navbtns button:hover{color:var(--txt);border-color:var(--accent2)}
.navbtns button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.navbtns button .ms{font-size:18px}
.wrap{max-width:1360px;margin:0 auto;padding:18px}
.scr-head{margin:2px 0 16px}
.scr-head h1{font-size:20px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.scr-head h1 .ms{color:var(--accent2);font-size:24px}
.scr-head p{margin:0;color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .ms{font-size:18px;color:var(--accent2)}
.card .sub{font-size:11px;color:var(--dim);font-weight:500;margin-left:auto}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;
  border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%)}
.kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lab .ms{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .dl{font-size:11.5px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.tbl th{text-align:left;color:var(--dim);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.3px;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(52,42,86,.5);white-space:nowrap}
.tbl tr:hover td{background:rgba(124,58,237,.07)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Inter"}
.ovf{overflow-x:auto;border-radius:10px}
.chartbox{overflow:hidden;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.15);color:var(--ok)}
.p-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.p-bad{background:rgba(248,113,113,.15);color:var(--bad)}
.p-info{background:rgba(96,165,250,.15);color:var(--info)}
.p-mut{background:rgba(167,159,198,.13);color:var(--mut)}
.p-acc{background:rgba(124,58,237,.2);color:var(--accent2)}
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tree{display:flex;flex-direction:column;gap:10px}
.node{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;min-width:0}
.node.lvl2{margin-left:26px;border-left:3px solid var(--accent)}
.node.lvl3{margin-left:52px;border-left:3px solid var(--accent2)}
.node .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:rgba(124,58,237,.18);color:var(--accent2)}
.node .ic .ms{font-size:19px}
.node .nm{font-weight:700;font-size:13px}
.node .mt{font-size:11px;color:var(--dim)}
.node .rt{margin-left:auto;text-align:right;flex:0 0 auto}
.node .rt b{font-size:15px;font-weight:800}
.node .rt small{display:block;font-size:10px;color:var(--dim)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .item{position:relative;padding:0 0 16px 6px}
.tl .item::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg)}
.tl .item.done::before{background:var(--ok)}
.tl .item.now::before{background:var(--warn)}
.tl .t{font-weight:700;font-size:13px}
.tl .d{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl .tm{font-size:10.5px;color:var(--dim);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%}
.match{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.match .side{flex:1;padding:11px 13px;min-width:0}
.match .side.l{background:rgba(96,165,250,.08)}
.match .side.r{background:rgba(52,211,153,.08)}
.match .mid{width:44px;flex:0 0 auto;display:grid;place-items:center;background:var(--panel2);color:var(--accent2)}
.match .co{font-size:11px;color:var(--dim)}
.match .amt{font-size:14px;font-weight:800;margin-top:2px}
.match .desc{font-size:11px;color:var(--mut);margin-top:2px}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--dim)}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--mut);font-weight:600}
@media(max-width:560px){
  .navbtns button .lbl{display:none}
  .navbtns button{padding:8px 10px}
  .brand span{display:none}
}
</style>
</head>
<body>
<div class="topnav">
  <div class="brand">
    <div class="logo"><span class="ms">account_balance_wallet</span></div>
    <div><b>財務合併報表系統</b><span>Financial Consolidation System · 集團合併決策室</span></div>
  </div>
  <div class="navbtns" id="nav"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var C = document.getElementById("screen");
var charts = [];
function killCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function el(id){ return document.getElementById(id); }

var NAV = [
  {i:0,ic:"account_tree",t:"組織架構"},
  {i:1,ic:"receipt_long",t:"帳套彙整"},
  {i:2,ic:"trending_up",t:"幣別換算"},
  {i:3,ic:"rule",t:"內部沖銷"},
  {i:4,ic:"groups",t:"少數股權"},
  {i:5,ic:"fact_check",t:"合併產出"}
];

/* ===== SCREEN 0 : 合併組織架構 ===== */
function scr0(){
  return ''
  +head("account_tree","合併組織架構","維護母子公司持股結構與合併範圍，決定納入合併之個體")
  +'<div class="grid g4">'
    +kpi("apartment","合併個體","14 家","+2 家較上季","up")
    +kpi("public","涉及幣別","5 種","TWD 為表達幣別","flat")
    +kpi("percent","平均持股","82.4%","控股集中","up")
    +kpi("verified","合併範圍確認","12 / 14","2 家待評估","warn")
  +'</div>'
  +'<div class="grid g23" style="margin-top:14px">'
    +'<div class="card"><h3><span class="ms">account_tree</span>集團持股架構<span class="sub">母公司：晶睿控股 JVISION Holdings</span></h3>'
      + orgTree()
      +'<div class="legend"><span><i class="dot" style="background:var(--accent)"></i>直接子公司</span>'
      +'<span><i class="dot" style="background:var(--accent2)"></i>孫公司</span>'
      +'<span><i class="dot" style="background:var(--warn)"></i>權益法（不合併）</span></div>'
    +'</div>'
    +'<div class="card"><h3><span class="ms">donut_large</span>合併淨資產貢獻</h3><div class="chartbox" id="c0a"></div></div>'
  +'</div>'
  +'<div class="grid g2" style="margin-top:14px">'
    +'<div class="card"><h3><span class="ms">fact_check</span>合併範圍決議</h3><div class="ovf"><table class="tbl">'
      +'<tr><th>個體</th><th>持股</th><th>控制</th><th>合併方式</th><th>狀態</th></tr>'
      + scopeRows()
    +'</table></div></div>'
    +'<div class="card"><h3><span class="ms">insights</span>持股比例分布</h3><div class="chartbox" id="c0b"></div></div>'
  +'</div>';
}
function orgTree(){
  var d=[
    {n:"晶睿控股（母公司）",m:"表達幣別 TWD",r:"100%",c:"母",lv:1},
    {n:"晶睿製造（台灣）",m:"TWD · 直接持股",r:"100%",c:"直",lv:2},
    {n:"晶睿電子（深圳）",m:"CNY · 直接持股",r:"90%",c:"直",lv:2},
    {n:"JVISION USA Inc.",m:"USD · 直接持股",r:"75%",c:"直",lv:2},
    {n:"深圳晶芯科技",m:"CNY · 透過晶睿電子",r:"60%",c:"孫",lv:3},
    {n:"JVISION Europe GmbH",m:"EUR · 直接持股",r:"55%",c:"直",lv:2},
    {n:"聯營—睿聯物流",m:"TWD · 權益法認列",r:"30%",c:"聯",lv:2}
  ];
  var h="<div class='tree'>";
  for(var i=0;i<d.length;i++){var x=d[i];
    var cls=x.lv===1?"":x.lv===2?" lvl2":" lvl3";
    var icc=x.c==="母"?"corporate_fare":x.c==="聯"?"handshake":"apartment";
    h+="<div class='node"+cls+"'><div class='ic'><span class='ms'>"+icc+"</span></div>"
     +"<div style='min-width:0'><div class='nm'>"+x.n+"</div><div class='mt'>"+x.m+"</div></div>"
     +"<div class='rt'><b>"+x.r+"</b><small>持股</small></div></div>";
  }
  return h+"</div>";
}
function scopeRows(){
  var d=[
    {n:"晶睿製造（台灣）",p:"100%",c:"完全控制",m:"完全合併",s:"ok"},
    {n:"晶睿電子（深圳）",p:"90%",c:"控制",m:"完全合併",s:"ok"},
    {n:"JVISION USA Inc.",p:"75%",c:"控制",m:"完全合併",s:"ok"},
    {n:"深圳晶芯科技",p:"60%",c:"間接控制",m:"完全合併",s:"ok"},
    {n:"JVISION Europe GmbH",p:"55%",c:"控制",m:"完全合併",s:"warn"},
    {n:"O聯物流",p:"30%",c:"重大影響",m:"權益法",s:"info"}
  ];
  var h="";
  for(var i=0;i<d.length;i++){var x=d[i];
    var pl=x.s==="ok"?'<span class="pill p-ok">已納入</span>':x.s==="warn"?'<span class="pill p-warn">待覆核</span>':'<span class="pill p-info">不合併</span>';
    h+="<tr><td>"+x.n+"</td><td class='num'>"+x.p+"</td><td>"+x.c+"</td><td>"+x.m+"</td><td>"+pl+"</td></tr>";
  }
  return h;
}
function ch0(){
  var o1={chart:{type:"donut",height:280,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[38,22,18,12,10],labels:["晶睿製造","晶O電子","JVISION USA","O芯科技","Europe GmbH"],
    colors:["#7c3aed","#a78bfa","#60a5fa","#34d399","#fbbf24"],
    legend:{position:"bottom",labels:{colors:"#a79fc6"}},dataLabels:{enabled:false},
    stroke:{colors:["#160f2e"]},
    plotOptions:{pie:{donut:{labels:{show:true,total:{show:true,label:"淨資產(億)",color:"#a79fc6",formatter:function(){return"42.6";}},value:{color:"#ece9f7"}}}}},
    tooltip:{theme:"dark"}};
  var a=new ApexCharts(el("c0a"),o1);a.render();charts.push(a);
  var o2={chart:{type:"bar",height:280,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false}},
    series:[{name:"持股比例",data:[100,90,75,60,55,30]}],
    colors:["#a78bfa"],
    plotOptions:{bar:{horizontal:true,borderRadius:4,barHeight:"60%"}},
    dataLabels:{enabled:true,formatter:function(v){return v+"%";},style:{colors:["#ece9f7"],fontSize:"11px"}},
    xaxis:{categories:["晶睿製造","晶O電子","JVISION USA","O芯科技","Europe","O聯物流"],max:100,labels:{style:{colors:"#a79fc6"}}},
    yaxis:{labels:{style:{colors:"#a79fc6"}}},
    grid:{borderColor:"#342a56"},tooltip:{theme:"dark"}};
  var b=new ApexCharts(el("c0b"),o2);b.render();charts.push(b);
}

/* ===== SCREEN 1 : 多帳套彙整 ===== */
function scr1(){
  return ''
  +head("receipt_long","多帳套彙整","收集各子公司試算表，映射至集團統一科目表並檢核借貸平衡")
  +'<div class="grid g4">'
    +kpi("upload_file","已收帳套","12 / 14","2 家未上傳","warn")
    +kpi("balance","借貸平衡","10 家","2 家差異待查","warn")
    +kpi("swap_horiz","科目映射率","96.8%","未映射 24 筆","up")
    +kpi("schedule","結帳截止","T+3 日","距截止 18 小時","flat")
  +'</div>'
  +'<div class="grid g32" style="margin-top:14px">'
    +'<div class="card"><h3><span class="ms">domain</span>各帳套上傳與檢核狀態</h3>'
      + ledgerList()
    +'</div>'
    +'<div class="card"><h3><span class="ms">account_tree</span>科目映射進度</h3><div class="chartbox" id="c1a"></div></div>'
  +'</div>'
  +'<div class="card" style="margin-top:14px"><h3><span class="ms">rule_folder</span>統一科目表映射明細<span class="sub">Local GAAP → Group Chart of Accounts</span></h3>'
    +'<div class="ovf"><table class="tbl">'
    +'<tr><th>子公司</th><th>本地科目</th><th>集團科目</th><th class="num">金額</th><th>幣別</th><th>狀態</th></tr>'
    + mapRows()
    +'</table></div></div>';
}
function ledgerList(){
  var d=[
    {n:"晶睿製造",cur:"TWD",p:100,s:"ok",t:"平衡"},
    {n:"晶O電子",cur:"CNY",p:100,s:"ok",t:"平衡"},
    {n:"JVISION USA",cur:"USD",p:100,s:"warn",t:"差異 $1,240"},
    {n:"O芯科技",cur:"CNY",p:96,s:"ok",t:"平衡"},
    {n:"Europe GmbH",cur:"EUR",p:88,s:"warn",t:"差異 €860"},
    {n:"O聯物流",cur:"TWD",p:0,s:"bad",t:"未上傳"}
  ];
  var h="";
  for(var i=0;i<d.length;i++){var x=d[i];
    var col=x.s==="ok"?"var(--ok)":x.s==="warn"?"var(--warn)":"var(--bad)";
    h+="<div style='margin-bottom:12px'><div style='display:flex;gap:8px;align-items:center;font-size:12.5px'>"
     +"<b>"+x.n+"</b><span class='pill p-mut'>"+x.cur+"</span>"
     +"<span style='margin-left:auto;font-size:11px;color:"+col+"'>"+x.t+"</span></div>"
     +"<div class='bar' style='margin-top:6px'><i style='width:"+x.p+"%;background:"+(x.s==="bad"?"var(--bad)":"linear-gradient(90deg,var(--accent),var(--accent2))")+"'></i></div></div>";
  }
  return h;
}
function mapRows(){
  var d=[
    {s:"晶睿製造",l:"1131 應收帳款",g:"AR-Trade 應收帳款",a:"128,400,000",c:"TWD",ok:1},
    {s:"晶O電子",l:"1122 存貨-製成品",g:"INV-FG 製成品存貨",a:"86,200,000",c:"CNY",ok:1},
    {s:"JVISION USA",l:"6100 SG&A Expense",g:"OPEX-SGA 營業費用",a:"2,340,000",c:"USD",ok:1},
    {s:"O芯科技",l:"4001 主營業務收入",g:"REV-Product 產品收入",a:"54,900,000",c:"CNY",ok:1},
    {s:"Europe GmbH",l:"3400 Sonstige Rücklagen",g:"— 未映射 —",a:"1,120,000",c:"EUR",ok:0},
    {s:"JVISION USA",l:"1500 Fixed Assets",g:"PPE-Net 不動產廠房",a:"9,860,000",c:"USD",ok:1}
  ];
  var h="";
  for(var i=0;i<d.length;i++){var x=d[i];
    var pl=x.ok?'<span class="pill p-ok">已映射</span>':'<span class="pill p-bad">待映射</span>';
    h+="<tr><td>"+x.s+"</td><td>"+x.l+"</td><td>"+x.g+"</td><td class='num'>"+x.a+"</td><td>"+x.c+"</td><td>"+pl+"</td></tr>";
  }
  return h;
}
function ch1(){
  var o={chart:{type:"radialBar",height:300,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[96.8],colors:["#7c3aed"],
    plotOptions:{radialBar:{hollow:{size:"58%"},track:{background:"#241a45"},
      dataLabels:{name:{color:"#a79fc6",fontSize:"13px",offsetY:22},
      value:{color:"#ece9f7",fontSize:"30px",fontWeight:800,formatter:function(v){return v+"%";}}}}},
    labels:["科目已映射"],
    fill:{type:"gradient",gradient:{shade:"dark",gradientToColors:["#a78bfa"],stops:[0,100]}}};
  var a=new ApexCharts(el("c1a"),o);a.render();charts.push(a);
}

/* ===== SCREEN 2 : 多幣別換算 ===== */
function scr2(){
  return ''

function kpi(ic,lab,val,dl,dir){

function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++){var x=NAV[i];
    h+='<button data-i="'+x.i+'" onclick="show('+x.i+')"><span class="ms">'+x.ic+'</span><span class="lbl">'+x.t+'</span></button>';
  }
  el("nav").innerHTML=h;
}
function show(i){
  killCharts();
  C.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].className = (+btns[k].getAttribute("data-i")===i)?"on":""; }
  void C.offsetHeight;
  try{ CHARTS[i](); }catch(e){}
}
buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
