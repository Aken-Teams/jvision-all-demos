<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>財務合併報表系統｜Financial Consolidation System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;

  --blue:#38BDF8;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;

  --accent:var(--color-accent);
  --accent2:#86EFAC;
  --bg:var(--color-background);
  --bg2:#080D1C;
  --panel:var(--color-card);
  --panel2:var(--color-muted);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --dim:#A8B4C7;
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#FB7185;
  --info:#38BDF8;
}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg)}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"IBM Plex Sans","Noto Sans TC",sans-serif;
  color:var(--txt);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(51,65,85,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.18) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"CONSOLIDATION / CONTROL DESK";
  position:fixed;
  right:-2px;
  bottom:24px;
  z-index:-1;
  max-width:72vw;
  overflow:hidden;
  color:rgba(248,250,252,.025);
  font-size:clamp(48px,9vw,148px);
  font-weight:700;
  line-height:.8;
  letter-spacing:-.07em;
  text-align:right;
  white-space:nowrap;
  pointer-events:none;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topnav{
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:minmax(260px,.7fr) minmax(0,1.6fr);
  align-items:stretch;
  padding:0;
  background:#020617;
  border-bottom:2px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:12px 18px;
  border-right:2px solid var(--line);
}
.logo{
  width:44px;
  height:44px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--accent);
  border:2px solid var(--accent);
  border-radius:0;
  box-shadow:5px 5px 0 #14532D;
}
.logo .ms{font-size:24px}
.brand b{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand span{
  display:block;
  margin-top:3px;
  color:var(--dim);
  font-size:10px;
  font-weight:500;
  letter-spacing:.06em;
  white-space:nowrap;
  text-transform:uppercase;
}
.navbtns{
  display:grid;
  grid-template-columns:repeat(6,minmax(92px,1fr));
  min-width:0;
  margin-left:0;
}
.navbtns button{
  position:relative;
  display:flex;
  min-width:0;
  min-height:68px;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 8px;
  color:#CBD5E1;
  background:#020617;
  border:0;
  border-left:1px solid var(--line);
  border-radius:0;
  font:600 11.5px/1.25 inherit;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;
}
.navbtns button:hover{color:#fff;background:var(--panel2)}
.navbtns button.on{
  color:var(--color-on-accent);
  background:var(--accent);
  box-shadow:inset 0 -5px 0 #15803D;
}
.navbtns button.on::before{
  content:"ACTIVE";
  position:absolute;
  top:4px;
  right:5px;
  font-size:7px;
  font-weight:700;
  letter-spacing:.08em;
}
.navbtns button .ms{font-size:18px}
.wrap{width:min(100%,1440px);margin:0 auto;padding:24px 22px 42px}
.scr-head{
  position:relative;
  margin:0 0 18px;
  padding:22px 24px 22px 78px;
  background:var(--color-primary);
  border:2px solid var(--line);
  border-left:8px solid var(--accent);
}
.scr-head::before{
  content:"FIN / 06";
  position:absolute;
  left:14px;
  top:16px;
  color:var(--accent);
  font:700 10px/1 "IBM Plex Sans",sans-serif;
  letter-spacing:.12em;
  writing-mode:vertical-rl;
}
.scr-head h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 5px;
  color:#fff;
  font-size:clamp(22px,2.5vw,34px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.035em;
}
.scr-head h1 .ms{color:var(--accent);font-size:30px}
.scr-head p{max-width:820px;margin:0;color:#CBD5E1;font-size:13px;line-height:1.6}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.6fr)}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:0;
  box-shadow:6px 6px 0 rgba(0,0,0,.38);
}
.card{padding:17px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:-17px -17px 16px;
  padding:12px 14px;
  color:#fff;
  background:var(--color-secondary);
  border-bottom:1px solid var(--line);
  font-size:13px;
  font-weight:700;
  letter-spacing:.015em;
}
.card h3 .ms{color:var(--accent);font-size:19px}
.card .sub{
  margin-left:auto;
  color:#B8C3D4;
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.02em;
}
.kpi{
  position:relative;
  min-height:134px;
  overflow:hidden;
  padding:16px 16px 18px;
  border-top:4px solid var(--line);
}
.kpi:nth-child(1){border-top-color:var(--accent)}
.kpi:nth-child(2){transform:translateY(8px)}
.kpi:nth-child(3){border-top-color:var(--info)}
.kpi:nth-child(4){transform:translateY(-5px);border-top-color:var(--warn)}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-31px;
  width:88px;
  height:88px;
  border:1px solid rgba(148,163,184,.22);
  transform:rotate(45deg);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:#CBD5E1;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.03em;
}
.kpi .lab .ms{color:var(--accent);font-size:17px}
.kpi .val{
  position:relative;
  z-index:1;
  margin:10px 0 5px;
  color:#fff;
  font-size:clamp(25px,2.5vw,34px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .dl{font-size:11px;font-weight:600;line-height:1.45}
.up::before{content:"▲ ";font-size:.8em}
.down::before{content:"▼ ";font-size:.8em}
.flat::before{content:"— ";font-weight:700}
.up{color:var(--ok)}
.down{color:#FDA4AF}
.flat{color:#CBD5E1}
.warn{color:var(--warn)}
.bad{color:#FDA4AF}
.ovf{
  max-width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:0;
  scrollbar-color:var(--accent) var(--panel2);
}
.tbl{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  color:#E2E8F0;
  background:#090E1D;
  font-size:12px;
}
.tbl th{
  padding:10px 11px;
  color:#E2E8F0;
  background:#1E293B;
  border-right:1px solid var(--line);
  border-bottom:2px solid var(--accent);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.07em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl th:last-child{border-right:0}
.tbl td{
  padding:10px 11px;
  border-right:1px solid rgba(51,65,85,.6);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.tbl td:last-child{border-right:0}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td,.tbl tr:nth-child(even) td{background:rgba(30,41,59,.36)}
.tbl tr:hover td{background:#162033}
.tbl .num,.num{
  text-align:right;
  font-family:"IBM Plex Sans",monospace;
  font-variant-numeric:tabular-nums lining-nums;
}
.chartbox{min-width:0;overflow:hidden}
.apexcharts-canvas text{font-family:"IBM Plex Sans","Noto Sans TC",sans-serif!important}
.apexcharts-gridline{stroke:#334155!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:1px solid #475569!important;border-radius:0!important;box-shadow:4px 4px 0 #000!important}
[fill="#7c3aed"]{fill:#22C55E!important}
[stroke="#7c3aed"]{stroke:#22C55E!important}
[fill="#a78bfa"]{fill:#38BDF8!important}
[stroke="#a78bfa"]{stroke:#38BDF8!important}
[fill="#160f2e"]{fill:#080D1C!important}
[stroke="#160f2e"]{stroke:#080D1C!important}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:700;
  line-height:1.3;
  white-space:nowrap;
}
.pill::before{content:"■";font-size:7px}
.p-ok{color:#86EFAC;background:#0C2A1B}
.p-warn{color:#FCD34D;background:#2B2108}
.p-bad{color:#FDA4AF;background:#310F18}
.p-info{color:#7DD3FC;background:#082638}
.p-mut{color:#CBD5E1;background:#1E293B}
.p-acc{color:#86EFAC;background:#12311F}
.bar{
  height:9px;
  overflow:hidden;
  background:#050916;
  border:1px solid var(--line);
  border-radius:0;
}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0}
.tree{display:flex;flex-direction:column;gap:8px}
.node{
  display:flex;
  min-width:0;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  background:#0A1020;
  border:1px solid var(--line);
  border-radius:0;
}
.node.lvl2{margin-left:28px;border-left:5px solid var(--accent)}
.node.lvl3{margin-left:56px;border-left:5px double var(--info)}
.node .ic{
  display:grid;
  width:34px;
  height:34px;
  flex:0 0 auto;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--accent);
  border-radius:0;
}
.node .ic .ms{font-size:19px}
.node .nm{color:#F8FAFC;font-size:12.5px;font-weight:700}
.node .mt{margin-top:2px;color:#A8B4C7;font-size:10.5px}
.node .rt{margin-left:auto;flex:0 0 auto;text-align:right}
.node .rt b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.node .rt small{display:block;color:#A8B4C7;font-size:9.5px}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .item{position:relative;padding:0 0 17px 8px}
.tl .item::before{
  content:"";
  position:absolute;
  left:-24px;
  top:3px;
  width:11px;
  height:11px;
  background:#64748B;
  border:2px solid #F8FAFC;
  border-radius:0;
}
.tl .item.done::before{background:var(--ok);transform:rotate(45deg)}
.tl .item.now::before{background:var(--warn);box-shadow:0 0 0 3px #422F08}
.tl .item.done .t::after{content:" / DONE";color:var(--ok);font-size:9px;letter-spacing:.08em}
.tl .item.now .t::after{content:" / CURRENT";color:var(--warn);font-size:9px;letter-spacing:.08em}
.tl .t{color:#F8FAFC;font-size:12.5px;font-weight:700}
.tl .d{margin-top:2px;color:#CBD5E1;font-size:11px}
.tl .tm{margin-top:3px;color:#A8B4C7;font-family:"IBM Plex Sans",monospace;font-size:10px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:#CBD5E1;font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border:1px solid #fff;border-radius:0}
.match{
  display:flex;
  align-items:stretch;
  overflow:hidden;
  margin-bottom:10px;
  border:1px solid var(--line);
  border-radius:0;
}
.match .side{min-width:0;flex:1;padding:11px 12px}
.match .side.l{background:#0A1C2A;border-left:4px solid var(--info)}
.match .side.r{background:#0C2518;border-right:4px solid var(--ok)}
.match .mid{display:grid;width:46px;flex:0 0 auto;place-items:center;color:var(--accent);background:#1E293B;border-right:1px solid var(--line);border-left:1px solid var(--line)}
.match .co{color:#B8C3D4;font-size:10.5px;font-weight:600;text-transform:uppercase}
.match .amt{margin-top:3px;color:#fff;font-size:13px;font-weight:700}
.match .desc{margin-top:3px;color:#CBD5E1;font-size:10.5px}
.mono{font-family:"IBM Plex Sans",monospace;font-variant-numeric:tabular-nums lining-nums}
.foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
  padding-top:13px;
  color:#A8B4C7;
  border-top:1px dashed #64748B;
  font-size:11px;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  color:#E2E8F0;
  background:#111827;
  border:1px solid var(--line);
  border-radius:0;
  font-size:10.5px;
  font-weight:600;
}
@media(max-width:1024px){
  .topnav{grid-template-columns:1fr}
  .brand{border-right:0;border-bottom:1px solid var(--line)}
  .navbtns button{min-height:54px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .wrap{padding:16px 14px 34px}
  .navbtns{grid-template-columns:repeat(3,1fr)}
  .navbtns button{border-top:1px solid var(--line)}
  .g3,.g2{grid-template-columns:1fr}
  .scr-head{padding:19px 16px 19px 57px}
  .card{padding:14px}
  .card h3{margin:-14px -14px 14px}
}
@media(max-width:560px){
  .brand{padding:10px 12px}
  .logo{width:40px;height:40px;box-shadow:4px 4px 0 #14532D}
  .brand span{display:none}
  .navbtns button{min-height:48px;padding:8px 6px}
  .navbtns button .lbl{font-size:10px}
  .navbtns button.on::before{display:none}
  .g4{grid-template-columns:1fr}
  .kpi:nth-child(2),.kpi:nth-child(4){transform:none}
  .scr-head h1{font-size:21px}
  .scr-head p{font-size:12px}
  .node.lvl2{margin-left:14px}
  .node.lvl3{margin-left:28px}
  .match{display:grid;grid-template-columns:1fr}
  .match .mid{width:100%;height:32px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .match .side.l,.match .side.r{border-right:0;border-left:4px solid var(--info)}
  .match .side.r{border-left-color:var(--ok)}
}
@media(max-width:390px){
  .navbtns button .lbl{display:none}
  .navbtns button .ms{font-size:20px}
  .scr-head{padding-left:49px}
  .wrap{padding-right:10px;padding-left:10px}
}
@media(hover:hover){
  .card,.kpi{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .card:hover,.kpi:hover{border-color:#64748B;box-shadow:9px 9px 0 rgba(0,0,0,.5)}
  .kpi:hover{transform:translate(-2px,-2px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .kpi:nth-child(2),.kpi:nth-child(4){transform:none}
}
</style>
</head>
<body>
<div class="topnav">
  <div class="brand">
    <div class="logo"><span class="ms">account_balance_wallet</span></div>
    <div><b>財務合併報表系統</b><span>Financial Consolidation System · 集團合併決策室</span></div>
  </div>
  <div class="navbtns" id="nav"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var C = document.getElementById("screen");
var charts = [];
function killCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function el(id){ return document.getElementById(id); }

var NAV = [
  {i:0,ic:"account_tree",t:"組織架構"},
  {i:1,ic:"receipt_long",t:"帳套彙整"},
  {i:2,ic:"trending_up",t:"幣別換算"},
  {i:3,ic:"rule",t:"內部沖銷"},
  {i:4,ic:"groups",t:"少數股權"},
  {i:5,ic:"fact_check",t:"合併產出"}
];

/* ===== SCREEN 0 : 合併組織架構 ===== */
function scr0(){
  return ''
  +head("account_tree","合併組織架構","維護母子公司持股結構與合併範圍，決定納入合併之個體")
  +'<div class="grid g4">'
    +kpi("apartment","合併個體","14 家","+2 家較上季","up")
    +kpi("public","涉及幣別","5 種","TWD 為表達幣別","flat")
    +kpi("percent","平均持股","82.4%","控股集中","up")
    +kpi("verified","合併範圍確認","12 / 14","2 家待評估","warn")
  +'</div>'
  +'<div class="grid g23" style="margin-top:14px">'
    +'<div class="card"><h3><span class="ms">account_tree</span>集團持股架構<span class="sub">母公司：晶睿控股 JVISION Holdings</span></h3>'
      + orgTree()
      +'<div class="legend"><span><i class="dot" style="background:var(--accent)"></i>直接子公司</span>'
      +'<span><i class="dot" style="background:var(--accent2)"></i>孫公司</span>'
      +'<span><i class="dot" style="background:var(--warn)"></i>權益法（不合併）</span></div>'
    +'</div>'
    +'<div class="card"><h3><span class="ms">donut_large</span>合併淨資產貢獻</h3><div class="chartbox" id="c0a"></div></div>'
  +'</div>'
  +'<div class="grid g2" style="margin-top:14px">'
    +'<div class="card"><h3><span class="ms">fact_check</span>合併範圍決議</h3><div class="ovf"><table class="tbl">'
      +'<tr><th>個體</th><th>持股</th><th>控制</th><th>合併方式</th><th>狀態</th></tr>'
      + scopeRows()
    +'</table></div></div>'
    +'<div class="card"><h3><span class="ms">insights</span>持股比例分布</h3><div class="chartbox" id="c0b"></div></div>'
  +'</div>';
}
function orgTree(){
  var d=[

/* ===== shared builders ===== */
function head(ic,t,p){
  return '<div class="scr-head"><h1><span class="ms">'+ic+'</span>'+t+'</h1><p>'+p+'</p></div>';
}
function kpi(ic,lab,val,dl,dir){
  return '<div class="kpi"><div class="lab"><span class="ms">'+ic+'</span>'+lab+'</div>'
    +'<div class="val">'+val+'</div><div class="dl '+dir+'">'+dl+'</div></div>';
}

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
var CHARTS=[ch0,ch1,ch2,ch3,ch4,ch5];

function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++){var x=NAV[i];
    h+='<button data-i="'+x.i+'" onclick="show('+x.i+')"><span class="ms">'+x.ic+'</span><span class="lbl">'+x.t+'</span></button>';
  }
  el("nav").innerHTML=h;
}
function show(i){
  killCharts();
  C.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].className = (+btns[k].getAttribute("data-i")===i)?"on":""; }
  void C.offsetHeight;
  try{ CHARTS[i](); }catch(e){}
}
buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
