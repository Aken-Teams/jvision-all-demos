<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>採購合約管理系統 CLM for Procurement</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"],.tpl{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,.tpl:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:0 0 268px;
  flex-direction:column;
  width:268px;
  height:100vh;
  padding:20px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-right:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  margin:-20px -20px 20px;
  padding:20px;
  background:#fff;
  color:var(--ink);
  border-bottom:3px solid var(--ink);
}
.logo{
  display:flex;
  flex:0 0 46px;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent);
}
.logo .material-symbols-outlined{font-size:25px}
.btxt{min-width:0}
.btxt b{
  display:block;
  font-family:"Fira Code",monospace;
  font-size:16px;
  font-weight:700;
  letter-spacing:-.03em;
}
.btxt span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:9px;min-width:0}
.navbtn{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-width:0;
  min-height:46px;
  padding:10px 12px;
  color:#fff;
  background:transparent;
  border:2px solid transparent;
  text-align:left;
  transition:background-color .18s,color .18s,box-shadow .18s,transform .18s;
}
.navbtn:hover{background:#fff;color:var(--ink);border-color:var(--ink)}
.navbtn.on{
  color:var(--color-on-accent);
  background:var(--color-accent);
  border-color:var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  transform:translate(-2px,-2px);
}
.navbtn .material-symbols-outlined{flex:0 0 auto;font-size:21px}
.navbtn .ntxt{
  min-width:0;
  overflow:hidden;
  font-size:13px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.navbtn .nidx{
  margin-left:auto;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  opacity:.8;
}
.sidefoot{
  margin-top:auto;
  padding-top:17px;
  color:#dbeafe;
  border-top:2px solid rgba(255,255,255,.6);
  font-size:11px;
  line-height:1.7;
}
.sidefoot b{color:#fff}
.main{display:flex;flex:1;flex-direction:column;min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:8;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  min-height:86px;
  padding:15px 28px;
  background:#fff;
  border-bottom:3px solid var(--ink);
}
.topbar .th{flex:1;min-width:0}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:21px;
  font-weight:700;
  letter-spacing:-.03em;
}
.topbar h1 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
  font-size:20px;
}
.topbar p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--color-primary);
  font-size:11px;
  font-weight:700;
}
.pill .material-symbols-outlined{font-size:16px;color:var(--color-primary)}
.content{min-width:0;padding:26px 28px 48px}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.65fr 1fr}
.g32{grid-template-columns:1fr 1.55fr}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:2px solid var(--ink);
  box-shadow:var(--shadow);
}
.card{padding:19px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  font-size:15px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  color:#fff;
  background:var(--color-primary);
  border:1px solid var(--ink);
  font-size:17px;
}
.card .sub{margin:0 0 16px;color:var(--muted);font-size:11.5px}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 18px 16px;
}
.kpi::before{
  position:absolute;
  top:0;
  right:0;
  width:34px;
  height:10px;
  background:var(--color-accent);
  border-bottom:2px solid var(--ink);
  border-left:2px solid var(--ink);
  content:"";
}
.kpi:nth-child(even)::before{background:var(--color-primary)}
.klabel{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.klabel .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
.kval{
  margin:10px 0 4px;
  font-family:"Fira Code",monospace;
  font-size:28px;
  font-weight:700;
  letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;
}
.kval small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0;
}
.kdelta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 6px;
  color:var(--ink);
  border:1px solid currentColor;
  font-size:10.5px;
  font-weight:700;
}
.kdelta .material-symbols-outlined{font-size:14px}
.up{background:#dcfce7;color:#166534}
.down{background:#fee2e2;color:#991b1b}
.chartbox{position:relative;width:100%;overflow:hidden}
.tablewrap{overflow-x:auto;border:2px solid var(--ink)}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  background:#fff;
  font-size:12.5px;
}
th{
  padding:11px 12px;
  color:#fff;
  background:var(--ink);
  border-right:1px solid #64748b;
  text-align:left;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#eff6ff}
td:first-child,td:last-child,.mini,.tmeta,.tlm{
  font-variant-numeric:tabular-nums;
}
td:first-child,.mini,.nidx{font-family:"Fira Code",monospace}
td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap;
}
.t-red{background:#fee2e2;color:#991b1b}
.t-org{background:#ffedd5;color:#9a3412}
.t-grn{background:#dcfce7;color:#166534}
.t-blu{background:#dbeafe;color:#1e40af}
.t-gry{background:#e2e8f0;color:#334155}
.bar{height:10px;min-width:60px;background:var(--color-muted);border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.mini{color:var(--muted);font-size:10.5px}
.divider{height:2px;margin:15px 0;background:var(--ink)}
.sig{background:#fff7ed}
.tpl{
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
  padding:15px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-muted);
  transition:background-color .18s,box-shadow .18s,transform .18s;
}
.tpl:hover,.tpl:focus-visible{
  background:#eff6ff;
  box-shadow:5px 5px 0 var(--color-primary);
  transform:translate(-2px,-2px);
}
.tpl .ticon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
}
.tpl .ticon .material-symbols-outlined{font-size:21px}
.tpl b{font-size:13.5px}
.tpl p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}
.tpl .tmeta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:auto;
  color:var(--muted);
  font-size:10px;
}
.tpl .tmeta span{padding:2px 5px;background:var(--color-muted);border:1px solid var(--line)}
.diffrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}
.diffcol{min-width:0;overflow:hidden;border:2px solid var(--ink)}
.diffcol .dh{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px 13px;
  background:var(--color-muted);
  border-bottom:2px solid var(--ink);
  font-size:11.5px;
  font-weight:700;
}
.diffcol .db{padding:14px;color:#334155;font-size:12.5px;line-height:1.9}
.del{padding:1px 3px;background:#fee2e2;color:#991b1b;text-decoration:line-through}
.ins{padding:1px 3px;background:#dcfce7;color:#166534}
.clause{
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-width:0;
  padding:12px 13px;
  border:2px solid var(--ink);
}
.clause .cn{
  display:grid;
  flex:0 0 34px;
  place-items:center;
  width:34px;
  height:34px;
  color:#fff;
  border:2px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.clause b{font-size:12.5px}
.clause p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:820px}
.col{
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
  padding:11px;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.colh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px;
  font-size:11.5px;
  font-weight:700;
}
.cnt{
  padding:1px 7px;
  background:#fff;
  border:1px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{min-width:0;padding:11px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--color-accent)}
.tk b{display:block;font-size:11.5px}
.tkm{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-top:6px;
  color:var(--muted);
  font-size:10.5px;
}
.avatar{
  display:inline-grid;
  flex:0 0 23px;
  place-items:center;
  width:23px;
  height:23px;
  color:#fff;
  background:var(--color-primary);
  border:1px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
}
.tl{position:relative;min-width:0;padding-left:28px}
.tl::before{position:absolute;top:3px;bottom:3px;left:9px;width:3px;background:var(--ink);content:""}
.tli{position:relative;min-width:0;padding:0 0 21px}
.tli:last-child{padding-bottom:0}
.dot{
  position:absolute;
  top:1px;
  left:-25px;
  width:17px;
  height:17px;
  background:#fff;
  border:3px solid var(--color-primary);
}
.tli.done .dot{background:var(--color-primary)}
.tli.done .dot::after{position:absolute;inset:2px;background:#fff;content:""}
.tli.warn .dot{background:#ffedd5;border-color:var(--color-accent)}
.tli b{font-size:12.5px}
.tlm{margin-top:3px;color:var(--muted);font-size:10.5px}
.oblig{display:flex;flex-direction:column;gap:9px}
.ob{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:10px 11px;
  background:#fff;
  border:2px solid var(--ink);
}
.obic{
  display:grid;
  flex:0 0 35px;
  place-items:center;
  width:35px;
  height:35px;
  border:1px solid var(--ink);
}
.obt{flex:1;min-width:0}
.obt b{display:block;font-size:12px}
.obt span{color:var(--muted);font-size:10px}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    position:static;
    flex:none;
    flex-direction:row;
    align-items:center;
    width:auto;
    height:auto;
    padding:11px 13px;
    border-right:0;
    border-bottom:3px solid var(--ink);
  }
  .brand{margin:0 8px 0 0;padding:0;background:transparent;color:#fff;border:0}
  .brand .logo{background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--color-accent)}
  .brand .btxt span{color:#dbeafe}
  .nav{flex:1;flex-direction:row;gap:7px;flex-wrap:wrap}
  .navbtn{width:auto;min-height:42px;padding:8px 10px}
  .navbtn .nidx{display:none}
  .sidefoot{display:none}
  .topbar{position:static}
}
@media(max-width:720px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .diffrow{grid-template-columns:1fr}
}
@media(max-width:560px){
  .sidebar{align-items:flex-start;flex-wrap:wrap}
  .brand{width:100%;margin-bottom:3px}
  .brand .logo{width:40px;height:40px;flex-basis:40px}
  .nav{display:grid;grid-template-columns:repeat(6,1fr);width:100%}
  .navbtn{justify-content:center;width:100%;padding:8px}
  .navbtn .ntxt{display:none}
  .topbar{padding:13px 15px}
  .topbar h1{font-size:17px}
  .pill{width:100%;justify-content:center}
  .content{padding:17px 14px 34px}
  .card{padding:15px}
  .kpi{padding:15px}
  .kval{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
    <div class="btxt"><b>CLM Pro</b><span>採購合約管理系統</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <div class="sidefoot">模組 <b>採購合約管理（CLM for Procurement）</b><br>合約起草 · 條款審核 · 電子簽署 · 到期續約<br><b>DEMO</b> 純前端展示 · 假資料</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="th">
      <h1><span class="material-symbols-outlined" id="tbicon">dashboard</span><span id="tbtitle">合約總覽儀表</span></h1>
      <p id="tbsub">在案合約、到期與風險一覽</p>
    </div>
    <span class="pill"><span class="material-symbols-outlined">shield</span>ISO 9001 稽核就緒</span>
  </header>
  <div class="content" id="view"></div>
</main>
</div>
<script>
"use strict";
var SCREENS=[
{icon:"dashboard",name:"合約總覽儀表",sub:"在案合約、到期與風險一覽",fn:s0},
{icon:"description",name:"範本庫與起草",sub:"條款範本庫與線上合約起草",fn:s1},
{icon:"rule",name:"條款審核比對",sub:"版本差異比對與條款風險標註",fn:s2},
{icon:"gavel",name:"電子簽署",sub:"簽核流程與電子簽章整合",fn:s3},
{icon:"fact_check",name:"履約義務追蹤",sub:"付款里程碑與義務到期監控",fn:s4},
{icon:"history",name:"到期續約評估",sub:"到期預警、續約決策與稽核軌跡",fn:s5}
];
var charts={};
var chartText="#475569",chartGrid="#E2E8F0",blue="#2563EB",orange="#EA580C",red="#DC2626",green="#15803D";
Chart.defaults.color=chartText;
Chart.defaults.font.family='"Fira Sans",system-ui,sans-serif';
Chart.defaults.animation=false;
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function el(id){return document.getElementById(id)}
function activateView(){
  el("view").classList.remove("reveal");
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    void el("view").offsetHeight;
    el("view").classList.add("reveal");
  }
}
function tableRows(rows){
  var tr="";
  rows.forEach(function(r){
    tr+='<tr><td><b>'+r.c+'</b></td><td>'+r.s+'</td><td><span class="mini">'+r.cat+'</span></td><td>'+r.amt+'</td><td><span class="tag '+r.cls+'">'+r.st+'</span></td><td class="mini">'+r.due+'</td></tr>';
  });
  return tr;
}
function s0(){
var kpis=[
{l:"在案合約",v:"128",u:"件",d:"+9 本月",up:true,ic:"description"},
{l:"30 天內到期",v:"14",u:"件",d:"需提前續約",up:false,ic:"warning"},
{l:"平均簽署時效",v:"5.2",u:"天",d:"較上季 -6.8",up:true,ic:"schedule"},
{l:"到期預警覆蓋",v:"86",u:"%",d:"+45 pt",up:true,ic:"insights"}
],k="";

function buildNav(){
var h="";
SCREENS.forEach(function(s,i){h+='<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+s.name+'"><span class="material-symbols-outlined">'+s.icon+'</span><span class="ntxt">'+s.name+'</span><span class="nidx">0'+(i+1)+"</span></button>"});
el("nav").innerHTML=h;
document.querySelectorAll("[data-i]").forEach(function(btn){btn.addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i")})});
}
function show(i){
var n=SCREENS.length;
if(i<0)i=0;
if(i>n-1)i=n-1;
destroyCharts();
var s=SCREENS[i];
el("tbicon").textContent=s.icon;
el("tbtitle").textContent=s.name;
el("tbsub").textContent=s.sub;
document.querySelectorAll("[data-i]").forEach(function(btn){
var on=+btn.getAttribute("data-i")===i;
btn.classList.toggle("on",on);
btn.setAttribute("aria-current",on?"page":"false");
});
s.fn();
try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
function fromHash(){
var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
if(!m){show(0);return}
show(Math.min(+m[1],SCREENS.length-1));
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
