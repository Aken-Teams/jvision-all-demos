<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>採購合約管理系統 CLM for Procurement</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#dc2626;
  --accent2:#f97316;
  --ink:#1f2430;
  --muted:#6b7280;
  --line:#e6e8ee;
  --bg:#f4f5f8;
  --side:#1a1d29;
  --side-ink:#c9cedd;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:250px;flex:0 0 250px;min-width:0;
  background:linear-gradient(180deg,var(--side),#12141d);
  color:var(--side-ink);
  display:flex;flex-direction:column;
  padding:20px 16px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px;min-width:0;}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand .btxt{min-width:0;}
.brand .btxt b{display:block;font-size:15px;color:#fff;font-weight:800;letter-spacing:.5px;}
.brand .btxt span{display:block;font-size:11px;color:#8b90a3;margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:6px;flex-wrap:wrap;min-width:0;}
.navbtn{
  display:flex;align-items:center;gap:12px;
  padding:11px 13px;border-radius:11px;border:0;cursor:pointer;
  background:transparent;color:var(--side-ink);
  font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;min-width:0;
  transition:.15s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .ntxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .nidx{margin-left:auto;font-size:11px;opacity:.4;font-weight:700;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.35);}
.navbtn.on .nidx{opacity:.7;}
.sidefoot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#71768a;line-height:1.6;}
.sidefoot b{color:#aeb3c6;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;
}
.topbar .th{min-width:0;flex:1;}
.topbar .th h1{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px;}
.topbar .th h1 .material-symbols-outlined{color:var(--accent);font-size:22px;}
.topbar .th p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:#fef2f2;color:var(--accent);border:1px solid #fddede;}
.pill .material-symbols-outlined{font-size:15px;}
.content{padding:24px 26px 40px;min-width:0;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(20,20,40,.03);}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.kpi .klabel{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .klabel .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .kval{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px;}
.kpi .kval small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .kdelta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi .kdelta .material-symbols-outlined{font-size:15px;}
.up{color:#059669;}.down{color:var(--accent);}
.chartbox{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
.tablewrap{overflow-x:auto;border-radius:12px;}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fafbfc;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:#fafbfc;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.t-red{background:#fef2f2;color:#dc2626;}
.t-org{background:#fff7ed;color:#ea580c;}
.t-grn{background:#ecfdf5;color:#059669;}
.t-blu{background:#eff6ff;color:#2563eb;}
.t-gry{background:#f3f4f6;color:#6b7280;}
.bar{height:8px;border-radius:999px;background:#eef0f4;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.mini{font-size:11.5px;color:var(--muted);}
.divider{height:1px;background:var(--line);margin:14px 0;}
.sig{background:linear-gradient(135deg,#fff5f5,#fff);border:1px solid #fbdada;}
.tpl{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;min-width:0;transition:.15s;cursor:pointer;}
.tpl:hover{border-color:var(--accent);box-shadow:0 8px 20px rgba(220,38,38,.08);transform:translateY(-2px);}
.tpl .ticon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));}
.tpl .ticon .material-symbols-outlined{font-size:22px;}
.tpl b{font-size:14px;}
.tpl p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5;}
.tpl .tmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:auto;}
.diffrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0;}
.diffcol{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;}
.diffcol .dh{padding:10px 14px;font-size:12px;font-weight:700;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;}
.diffcol .db{padding:14px;font-size:12.5px;line-height:1.9;color:#3a4150;}
.del{background:#fdecec;color:#b91c1c;text-decoration:line-through;padding:1px 3px;border-radius:4px;}
.ins{background:#e7f6ee;color:#047857;padding:1px 3px;border-radius:4px;}
.clause{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;align-items:flex-start;min-width:0;}
.clause .cn{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;}
.clause b{font-size:13px;}
.clause p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
.col{background:#f9fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px;}
.col .colh{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:2px 4px;}
.col .colh .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0;border-left:3px solid var(--accent);}
.tk b{font-size:12.5px;display:block;}
.tk .tkm{font-size:11px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tl{position:relative;padding-left:26px;min-width:0;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 20px;min-width:0;}
.tli:last-child{padding-bottom:0;}
.tli .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tli.done .dot{background:var(--accent);}
.tli.warn .dot{border-color:var(--accent2);}
.tli b{font-size:13px;}
.tli .tlm{font-size:11.5px;color:var(--muted);margin-top:2px;}
.oblig{display:flex;flex-direction:column;gap:9px;}
.oblig .ob{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;min-width:0;}
.oblig .ob .obic{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.oblig .ob .obt{min-width:0;flex:1;}
.oblig .ob .obt b{font-size:13px;display:block;}
.oblig .ob .obt span{font-size:11px;color:var(--muted);}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;padding:12px 14px;flex-wrap:wrap;gap:10px;}
  .brand{border-bottom:0;margin-bottom:0;padding:0;margin-right:8px;}
  .sidefoot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:8px;flex:1;}
  .navbtn{width:auto;padding:9px 12px;}
  .navbtn .nidx{display:none;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .diffrow{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .navbtn .ntxt{display:none;}
  .navbtn{padding:9px 11px;}
  .content{padding:16px 14px 32px;}
  .topbar{padding:12px 16px;}
  .board{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
      <div class="btxt"><b>CLM Pro</b><span>採購合約管理系統</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      模組 <b>採購合約管理（CLM for Procurement）</b><br/>
      合約起草 · 條款審核 · 電子簽署 · 到期續約<br/>
      <b>DEMO</b> 純前端展示 · 假資料
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="th">
        <h1><span class="material-symbols-outlined" id="tbicon">dashboard</span><span id="tbtitle">合約總覽儀表</span></h1>
        <p id="tbsub">在案合約、到期與風險一覽</p>
      </div>
      <span class="pill"><span class="material-symbols-outlined">shield</span>ISO 9001 稽核就緒</span>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<script>
"use strict";
var SCREENS=[
  {icon:"dashboard",name:"合約總覽儀表",sub:"在案合約、到期與風險一覽",fn:s0},
  {icon:"description",name:"範本庫與起草",sub:"條款範本庫與線上合約起草",fn:s1},
  {icon:"rule",name:"條款審核比對",sub:"版本差異比對與條款風險標註",fn:s2},
  {icon:"gavel",name:"電子簽署",sub:"簽核流程與電子簽章整合",fn:s3},
  {icon:"fact_check",name:"履約義務追蹤",sub:"付款里程碑與義務到期監控",fn:s4},
  {icon:"history",name:"到期續約評估",sub:"到期預警、續約決策與稽核軌跡",fn:s5}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function el(id){return document.getElementById(id);}

/* ---------- SCREEN 0 : dashboard ---------- */
function s0(){
  var kpis=[
    {l:"在案合約",v:"128",u:"件",d:"+9 本月",up:true,ic:"description"},
    {l:"30 天內到期",v:"14",u:"件",d:"需提前續約",up:false,ic:"warning"},
    {l:"平均簽署時效",v:"5.2",u:"天",d:"較上季 -6.8",up:true,ic:"schedule"},
    {l:"到期預警覆蓋",v:"86",u:"%",d:"+45 pt",up:true,ic:"insights"}
  ];
  var k="";kpis.forEach(function(x){
    k+='<div class="kpi"><div class="klabel"><span class="material-symbols-outlined">'+x.ic+'</span>'+x.l+'</div>'+
       '<div class="kval">'+x.v+'<small>'+x.u+'</small></div>'+
       '<div class="kdelta '+(x.up?"up":"down")+'"><span class="material-symbols-outlined">'+(x.up?"trending_up":"priority_high")+'</span>'+x.d+'</div></div>';
  });
  var rows=[
    {c:"C-2026-0417",s:"O晶供應鏈材料",cat:"原物料採購",amt:"NT$ 4,820,000",st:"履約中",cls:"t-grn",due:"2026-11-30"},
    {c:"C-2026-0392",s:"鴻運精密機械",cat:"設備維護",amt:"NT$ 1,260,000",st:"待簽署",cls:"t-org",due:"2026-08-28"},
    {c:"C-2026-0388",s:"永盛物流服務",cat:"外包服務",amt:"NT$ 960,000",st:"審核中",cls:"t-blu",due:"2026-09-15"},
    {c:"C-2025-1180",s:"晶研化工原料",cat:"原物料採購",amt:"NT$ 3,410,000",st:"即將到期",cls:"t-red",due:"2026-08-22"},
    {c:"C-2026-0365",s:"宏達檢測技術",cat:"技術服務",amt:"NT$ 780,000",st:"履約中",cls:"t-grn",due:"2027-01-10"}
  ];
  var tr="";rows.forEach(function(r){
    tr+='<tr><td><b>'+r.c+'</b></td><td>'+r.s+'</td><td><span class="mini">'+r.cat+'</span></td><td>'+r.amt+'</td><td><span class="tag '+r.cls+'">'+r.st+'</span></td><td class="mini">'+r.due+'</td></tr>';
  });
  el("view").innerHTML=
    '<div class="grid g4">'+k+'</div>'+
    '<div class="grid g23" style="margin-top:16px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>合約狀態流量（近 6 週）</h3><p class="sub">起草／審核／簽署 各階段件數變化</p><div class="chartbox" style="height:280px"><canvas id="c0a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>合約類別占比</h3><p class="sub">依採購合約類型分布</p><div class="chartbox" style="height:280px"><canvas id="c0b"></canvas></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">receipt_long</span>在案重點合約</h3><p class="sub">依到期日與風險排序，紅色為 30 天內到期</p>'+
      '<div class="tablewrap"><table><thead><tr><th>合約編號</th><th>供應商</th><th>類別</th><th>合約金額</th><th>狀態</th><th>到期日</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
  void el("view").offsetHeight;
  charts.c0a=new Chart(el("c0a"),{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[
    {label:"起草",data:[18,22,20,26,24,29],borderColor:"#f97316",backgroundColor:"rgba(249,115,22,.08)",tension:.35,fill:true},
    {label:"審核",data:[9,12,14,11,16,15],borderColor:"#2563eb",backgroundColor:"rgba(37,99,235,.06)",tension:.35,fill:true},
    {label:"簽署",data:[6,8,7,10,12,14],borderColor:"#dc2626",backgroundColor:"rgba(220,38,38,.08)",tension:.35,fill:true}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{beginAtZero:true,grid:{color:"#eef0f4"}},x:{grid:{display:false}}}}});
  charts.c0b=new Chart(el("c0b"),{type:"doughnut",data:{labels:["原物料採購","設備維護","外包服務","技術服務","其他"],datasets:[{data:[42,24,18,11,5],backgroundColor:["#dc2626","#f97316","#fbbf24","#2563eb","#94a3b8"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
}

/* ---------- SCREEN 1 : template library + draft ---------- */
function s1(){
  var tpls=[
    {ic:"inventory_2",n:"原物料採購合約",d:"含交期、品質規格與價格調整條款，適用長期供料。",m:["v4.2","法務已核可","使用 42 次"]},
    {ic:"build",n:"設備維護服務合約",d:"保養頻率、備品供應與 SLA 罰則條款範本。",m:["v3.1","法務已核可","使用 27 次"]},
    {ic:"factory",n:"物流外包合約",d:"運送時效、貨損責任與保險條款範本。",m:["v2.0","審核中","使用 18 次"]},
    {ic:"science",n:"技術服務合約",d:"智財歸屬、保密與階段驗收付款條款。",m:["v2.4","法務已核可","使用 15 次"]},
    {ic:"account_tree",n:"框架採購協議",d:"年度框架量價、下單方式與最低採購承諾。",m:["v1.6","法務已核可","使用 9 次"]},
    {ic:"shield",n:"保密協議 NDA",d:"雙向保密、資料返還與違約賠償條款。",m:["v5.0","法務已核可","使用 63 次"]}
  ];
  var g="";tpls.forEach(function(t){
    var mm="";t.m.forEach(function(x){mm+='<span>'+x+'</span>';});
    g+='<div class="tpl"><div class="ticon"><span class="material-symbols-outlined">'+t.ic+'</span></div>'+
       '<b>'+t.n+'</b><p>'+t.d+'</p><div class="tmeta">'+mm+'</div></div>';
  });
  el("view").innerHTML=
    '<div class="grid g32">'+
      '<div class="card sig"><h3><span class="material-symbols-outlined">description</span>線上合約起草</h3><p class="sub">選定範本後帶入交易條件，即時產生合約草稿</p>'+
        '<div style="display:flex;flex-direction:column;gap:12px">'+
          drow("採購需求單","REQ-2026-0871 · 精密軸承 12,000 pcs")+

      '<div class="card sig"><h3><span class="material-symbols-outlined">calendar_month</span>到期預警時間軸</h3><p class="sub">依到期日排序，紅點為 30 天內須決策</p><div class="tl" style="margin-top:6px">'+tl+'</div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">insights</span>續約決策分布</h3><p class="sub">到期合約評估後的處置建議</p><div class="chartbox" style="height:290px"><canvas id="c5a"></canvas></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">verified</span>供應商履約評分與續約建議</h3><p class="sub">綜合交期、品質與價格表現，系統給出處置建議</p>'+
      '<div class="tablewrap"><table><thead><tr><th>供應商</th><th>履約評分</th><th>表現</th><th>續約建議</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
  void el("view").offsetHeight;
  charts.c5a=new Chart(el("c5a"),{type:"polarArea",data:{labels:["優先續約","建議續約","重議條款","評估替代","已終止"],datasets:[{data:[8,6,4,2,1],backgroundColor:["#059669","#22c55e","#f97316","#dc2626","#94a3b8"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{r:{ticks:{display:false},grid:{color:"#eef0f4"}}}}});
}

/* ---------- shell ---------- */
function buildNav(){
  var h="";SCREENS.forEach(function(s,i){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+s.icon+'</span><span class="ntxt">'+s.name+'</span><span class="nidx">0'+(i+1)+'</span></button>';
  });
  el("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
}
function show(i){
  var n=SCREENS.length;if(i<0)i=0;if(i>n-1)i=n-1;
  destroyCharts();
  var s=SCREENS[i];
  el("tbicon").textContent=s.icon;
  el("tbtitle").textContent=s.name;
  el("tbsub").textContent=s.sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
  s.fn();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
