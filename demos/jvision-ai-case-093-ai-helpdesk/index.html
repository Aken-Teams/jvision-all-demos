<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客服 AI 回覆站 · 服務終端</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0c0a09; --bg2:#161210; --panel:#1c1815; --panel2:#241d18;
  --line:#39302a; --line2:#4a3d33;
  --txt:#f5ede6; --mut:#a99e93; --dim:#7a6f64;
  --acc:#c2410c; --acc2:#fb923c; --acc3:#fdba74;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --blue:#60a5fa; --purple:#c084fc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:"Inter","Noto Sans TC",sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ico{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle}

/* top nav */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#171310,#120f0d);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 14px rgba(194,65,12,.4);
}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--dim);white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{
  flex:none;white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  background:transparent;border:1px solid transparent;
  color:var(--mut);font-family:inherit;font-size:13px;font-weight:500;
  padding:7px 12px;border-radius:9px;transition:.15s;
}
.nav button:hover{background:var(--panel);color:var(--txt)}
.nav button.on{background:linear-gradient(135deg,rgba(194,65,12,.25),rgba(251,146,60,.15));color:var(--acc3);border-color:var(--line2)}
.nav button .ico{font-size:19px}
@media(max-width:560px){.nav button .lab{display:none}.nav button{padding:7px 9px}.status{display:none}}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 48px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:21px;margin:0;font-weight:800;font-family:"Noto Sans TC"}
.head p{margin:4px 0 0;color:var(--mut);font-size:13px}
.crumb{font-size:12px;color:var(--acc3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.head .r{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.chip .ico{font-size:16px;color:var(--acc2)}

/* generic panels & grids */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h3 .ico{color:var(--acc2);font-size:19px}
.sub{color:var(--dim);font-size:12px;font-weight:400}

.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpirow{grid-template-columns:repeat(4,1fr)}
.split-72{grid-template-columns:2fr 1fr}
.split-64{grid-template-columns:1.6fr 1fr}
.split-46{grid-template-columns:1fr 1.5fr}
@media(max-width:820px){
  .g2,.g3,.g4,.kpirow,.split-72,.split-64,.split-46{grid-template-columns:1fr}
}
.grid>*{min-width:0}

/* kpi */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lbl .ico{font-size:17px;color:var(--acc2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--mut);margin-left:3px}
.kpi .delta{font-size:12px;margin-top:5px;font-weight:600}
.kpi .up{color:var(--ok)}.kpi .down{color:var(--bad)}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.16),transparent 70%)}

.chart{width:100%;height:280px}
.chart.sm{height:220px}
.chart.lg{height:320px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bg2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.t-ok{background:rgba(74,222,128,.14);color:var(--ok)}
.t-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.t-bad{background:rgba(248,113,113,.14);color:var(--bad)}
.t-blue{background:rgba(96,165,250,.14);color:var(--blue)}
.t-acc{background:rgba(251,146,60,.16);color:var(--acc3)}
.t-purple{background:rgba(192,132,252,.14);color:var(--purple)}
.t-mut{background:var(--panel2);color:var(--mut)}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter"}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* progress bar */
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}

/* inbox board */
.inbox{display:grid;grid-template-columns:300px 1fr;gap:14px;min-width:0}
@media(max-width:820px){.inbox{grid-template-columns:1fr}}
.inbox>*{min-width:0}
.convlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.conv{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.conv:last-child{border-bottom:none}
.conv.act{background:linear-gradient(90deg,rgba(194,65,12,.18),transparent);border-left:3px solid var(--acc2)}
.conv .who{font-weight:600;font-size:13px}
.conv .pre{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.conv .meta{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chan{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.chan .ico{font-size:14px}

/* thread */
.thread{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:11px}
.msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.55}
.msg.cust{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.agent{background:linear-gradient(135deg,rgba(194,65,12,.22),rgba(251,146,60,.12));border:1px solid var(--line2);align-self:flex-end;border-bottom-right-radius:3px}
.msg .mh{font-size:11px;color:var(--dim);margin-bottom:4px}

/* ai draft */
.draft{border:1px dashed var(--acc);border-radius:12px;padding:14px;background:linear-gradient(160deg,rgba(194,65,12,.1),transparent)}
.draft .dh{display:flex;align-items:center;gap:8px;color:var(--acc3);font-weight:700;font-size:13px;margin-bottom:9px}
.cite{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--acc3);margin:2px 4px 2px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--txt);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px;cursor:default}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.btn .ico{font-size:17px}

/* kb list */
.kbrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bg2)}
.kbrow:last-child{border-bottom:none}
.kbico{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--acc2)}

/* gap cards */
.gapcard{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--panel2)}
.gapcard .q{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* SLA timeline */
.slabar{position:relative;height:26px;background:var(--panel2);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.slabar>.fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.slabar>.lbl{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;font-weight:700}

/* compensation cards */
.compcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));position:relative}
.compcard .amt{font-size:22px;font-weight:800;color:var(--acc3)}
.appr{display:flex;gap:6px;margin-top:10px}
.stepdot{flex:1;text-align:center;font-size:11px;color:var(--dim);position:relative}
.stepdot i{display:block;width:11px;height:11px;border-radius:50%;background:var(--line);margin:0 auto 5px;border:2px solid var(--panel)}
.stepdot.done i{background:var(--ok)}
.stepdot.cur i{background:var(--acc2);box-shadow:0 0 0 4px rgba(251,146,60,.2)}

/* satisfaction faces */
.facegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:560px){.facegrid{grid-template-columns:repeat(3,1fr)}}
.face{text-align:center;border:1px solid var(--line);border-radius:11px;padding:12px 6px;background:var(--panel2)}
.face .ico{font-size:30px}
.face .n{font-size:19px;font-weight:800;margin-top:4px}
.face .p{font-size:11px;color:var(--dim)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

.mt14{margin-top:14px}
.scrollx{overflow-x:auto}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="ico">support_agent</span></div>
    <div><b>客服 AI 回覆站</b><span>Helpdesk Terminal · v4.3</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="status"><span class="dot"></span> 線上服務中 · 台北 UTC+8</div>
</div>
<div class="wrap"><div id="view"></div>
  <div class="foot">客服 AI 回覆站 · 純前端展示 Demo · 假資料僅供介面示意</div>
</div>

<script>
var NAV=[
  {ico:"inbox",name:"共享收件箱"},
  {ico:"smart_toy",name:"AI 回覆草擬"},
  {ico:"menu_book",name:"知識庫"},
  {ico:"timer",name:"SLA 時效台"},
  {ico:"redeem",name:"客訴補償"},
  {ico:"sentiment_satisfied",name:"滿意度分析"}
];
var view=document.getElementById("view");
var chart=null;
function disposeChart(){ if(chart){try{chart.dispose();}catch(e){} chart=null;} }
function initChart(id,opt){
  var el=document.getElementById(id); if(!el) return;
  var c=echarts.init(el,null,{renderer:"canvas"});
  c.setOption(opt); chart=c;
}
var AX="#a99e93", GRID="#2c241e";
function av(name,color){var ini=name.slice(0,1);return '<span class="avatar" style="background:'+color+'">'+ini+'</span>';}

/* ============ SCREEN 0 · 共享收件箱 ============ */
function s0(){
  var convs=[
    {who:"陳美惠",pre:"訂單 #A2391 到貨破損想退換…",cc:"#2563eb",ci:"mail",t:"2 分前",tag:'<span class="tag t-bad">未認領</span>',act:true,mood:"憤怒"},
    {who:"林建宏",pre:"帳號無法登入，一直跳驗證碼",cc:"#16a34a",ci:"chat",t:"6 分前",tag:'<span class="tag t-warn">待回覆</span>',act:false,mood:"焦急"},
    {who:"黃雅琪",pre:"想詢問月租方案升級的費用",cc:"#c2410c",ci:"language",t:"11 分前",tag:'<span class="tag t-blue">處理中</span>',act:false,mood:"中性"},
    {who:"吳志明",pre:"發票開錯統編需要重開",cc:"#2563eb",ci:"mail",t:"18 分前",tag:'<span class="tag t-blue">處理中</span>',act:false,mood:"中性"},
    {who:"周佩珊",pre:"物流三天沒更新，貨到底在哪",cc:"#16a34a",ci:"chat",t:"24 分前",tag:'<span class="tag t-warn">待回覆</span>',act:false,mood:"焦急"},
    {who:"蔡承翰",pre:"優惠碼結帳時顯示失效",cc:"#c2410c",ci:"language",t:"33 分前",tag:'<span class="tag t-ok">已解決</span>',act:false,mood:"中性"}
  ];
  var agents=[
    {n:"王思婷",c:"#c2410c",load:8,cap:10},
    {n:"李冠廷",c:"#2563eb",load:6,cap:10},
    {n:"張淑芬",c:"#16a34a",load:9,cap:10},
    {n:"許家豪",c:"#9333ea",load:4,cap:10}
  ];
  var listHtml=convs.map(function(c){
    return '<div class="conv '+(c.act?"act":"")+'">'+
      '<span class="chan" style="background:'+c.cc+'"><span class="ico">'+c.ci+'</span></span>'+
      '<div style="min-width:0;flex:1"><div class="who">'+c.who+'</div>'+
      '<div class="pre">'+c.pre+'</div>'+
      '<div class="meta">'+c.tag+'<span>'+c.mood+'</span><span>'+c.t+'</span></div></div></div>';
  }).join("");
  var agentHtml=agents.map(function(a){
    var pct=Math.round(a.load/a.cap*100);
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">'+av(a.n,a.c)+
      '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>'+a.n+'</span><span class="mono" style="color:var(--mut)">'+a.load+'/'+a.cap+'</span></div>'+
      '<div class="bar" style="margin-top:5px"><i style="width:'+pct+'%"></i></div></div></div>';
  }).join("");

  view.innerHTML=head("共享收件箱","INBOX","多渠道進線集中分派，AI 依技能與負載自動配單",[
     chip("hub","4 渠道整合"),chip("groups","4 位在線客服")
  ])+
  '<div class="grid kpirow" style="margin-bottom:14px">'+
    kpi("mark_email_unread","待認領","23","+5 尖峰時段","down")+
    kpi("bolt","AI 自動分派率","86%","本班提升 12pt","up")+
    kpi("schedule","平均首應","1.8","分鐘 · 目標 3","up")+
    kpi("inbox","今日進線","417","件 · 較昨 +6%","up")+
  '</div>'+
  '<div class="grid split-72" style="margin-bottom:14px">'+
    '<div class="panel"><h3><span class="ico">forum</span>進線佇列 <span class="sub">依 SLA 到期時間排序</span></h3>'+
      '<div class="inbox"><div class="convlist scrollx">'+listHtml+'</div>'+
      '<div class="panel" style="background:var(--panel2)"><h3><span class="ico">insights</span>渠道分布</h3><div id="c0" class="chart sm"></div>'+
        '<div class="legend"><span><i style="background:#2563eb"></i>Email</span><span><i style="background:#16a34a"></i>LINE</span><span><i style="background:#c2410c"></i>網站</span><span><i style="background:#9333ea"></i>電話</span></div>'+
      '</div></div>'+
    '</div>'+
    '<div class="panel"><h3><span class="ico">groups</span>客服負載</h3>'+agentHtml+
      '<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:12px;color:var(--mut)"><span class="ico" style="color:var(--acc2);font-size:16px">auto_awesome</span> 智能配單建議：將破損退換案 <b style="color:var(--acc3)">#A2391</b> 分派給 <b>許家豪</b>（負載最低）</div>'+
    '</div>'+
  '</div>';
  void view.offsetHeight;
  initChart("c0",{
    tooltip:{trigger:"item"},
    series:[{type:"pie",radius:["45%","72%"],center:["50%","50%"],
      label:{color:AX,fontSize:11},labelLine:{lineStyle:{color:GRID}},
      data:[
        {value:186,name:"Email",itemStyle:{color:"#2563eb"}},
        {value:142,name:"LINE",itemStyle:{color:"#16a34a"}},
        {value:63,name:"網站",itemStyle:{color:"#c2410c"}},
        {value:26,name:"電話",itemStyle:{color:"#9333ea"}}
      ]}]
  });
}

/* ============ SCREEN 1 · AI 回覆草擬 ============ */
function s1(){
  view.innerHTML=head("AI 回覆草擬","AI DRAFT","AI 依對話脈絡生成回覆草稿並附知識庫引用，客服編修後送出",[
    chip("verified","來源可追溯"),chip("translate","支援 4 語系")
  ])+
  '<div class="grid kpirow" style="margin-bottom:14px">'+
    kpi("draft","今日草稿數","342","AI 產出","up")+
    kpi("thumb_up","採用率","78%","含微調後採用","up")+
    kpi("edit","平均編修字數","24","字 · 越低越好","up")+
    kpi("timer","省下回覆時間","3.4","分鐘/件","up")+
  '</div>'+
  '<div class="grid split-64">'+
    '<div class="panel"><h3><span class="ico">chat</span>對話串 <span class="sub">#A2391 · 陳美惠 · Email</span></h3>'+
      '<div class="thread">'+
        '<div class="msg cust"><div class="mh">陳美惠 · 09:12</div>訂單 #A2391 昨天收到，外箱完好但裡面的陶瓷杯裂了兩個，我要退換貨，這樣還要自己付運費嗎？</div>'+
        '<div class="msg agent"><div class="mh">AI 草稿 · 待客服確認</div>美惠您好，很抱歉讓您收到破損商品 🙏 破損退換由本店負擔全額運費，您無需付費。我已為您建立換貨單，明日安排新品出貨並附回收單，物流到府直接交換即可。</div>'+

/* ============ helpers ============ */
function head(title,crumb,sub,chips){
  return '<div class="head"><div><div class="crumb">'+crumb+'</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="r">'+chips.join("")+'</div></div>';
}
function chip(ico,txt){return '<span class="chip"><span class="ico">'+ico+'</span>'+txt+'</span>';}
function kpi(ico,lbl,val,delta,dir){
  var vm=String(val).match(/^([^0-9]*)([0-9.,]+)(.*)$/);
  var body= vm ? vm[1]+vm[2]+'<small>'+vm[3]+'</small>' : val;
  return '<div class="kpi"><div class="lbl"><span class="ico">'+ico+'</span>'+lbl+'</div>'+
    '<div class="val">'+body+'</div>'+
    '<div class="delta '+(dir==="up"?"up":"down")+'"><span class="ico" style="font-size:15px">'+(dir==="up"?"arrow_upward":"arrow_downward")+'</span>'+delta+'</div></div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  disposeChart();
  var btns=document.querySelectorAll("#nav button");
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  SCREENS[i]();
}
(function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="ico">'+NAV[i].ico+'</span><span class="lab">'+NAV[i].name+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
