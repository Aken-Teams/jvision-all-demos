<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>產品型錄管理 · Product Catalog Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0c2028;--bg:#f2f7f9;--card:#fff;--line:#dbe8ee;--mut:#5b7683;--ok:#059669;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--vio:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 18px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(8,145,178,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;min-width:0;flex-wrap:wrap;-webkit-overflow-scrolling:touch}
.nav button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#e6f6fb;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(8,145,178,.3)}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:#cffafe;color:#0e7490;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.split{grid-template-columns:340px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#eef2f4;color:#5b7683}.t-vio{background:#ede9fe;color:#6d28d9}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef6f9}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
table.data tr:hover td{background:#f6fbfd}
.chart{height:250px;overflow:hidden;width:100%}
.scroll{overflow-x:auto}
.muted{color:var(--mut)}
.mono{font-family:Inter;font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.pitem{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;background:#fff;transition:.15s}
.pitem:hover{border-color:var(--accent2);background:#f2fdff}
.pitem.on{border-color:var(--accent);background:#e6f9fd;box-shadow:0 4px 12px rgba(8,145,178,.14)}
.pitem .pn{font-weight:800;font-size:13px}
.pitem .pc{font-size:11px;color:var(--mut);margin-top:2px}
.pitem .pmeta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec>*{min-width:0}
.srow{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;background:#fafdfe}
.srow b{font-weight:700}
.bar{height:8px;border-radius:6px;background:#e6eef2;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 6px}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tli .tt{font-weight:800;font-size:13px}
.tli .td{font-size:12px;color:var(--mut);margin-top:2px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.board>*{min-width:0}
.col{background:#eef6f9;border:1px solid var(--line);border-radius:14px;padding:10px}
.col h4{margin:0 0 9px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;font-family:"Noto Sans TC"}
.col h4 span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--mut)}
.ccard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:8px;font-size:12px}
.ccard b{font-size:12.5px}
.ccard .cm{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut);font-size:11px}
.lang-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.lang-ok{background:#d1fae5;color:#047857;border-color:#a7f3d0}
.lang-no{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.lang-pend{background:#fef3c7;color:#b45309;border-color:#fde68a}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.notice{display:flex;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fafdfe;margin-bottom:9px;align-items:flex-start}
.notice .material-symbols-outlined{flex:none;margin-top:1px}
.notice .nt{font-weight:800;font-size:13px}
.notice .nd{font-size:12px;color:var(--mut);margin-top:2px}
@media(max-width:820px){
 .g2,.g11,.split{grid-template-columns:1fr}
 .kpis{grid-template-columns:1fr 1fr}
 .board{grid-template-columns:1fr 1fr}
 .spec{grid-template-columns:1fr}
}
@media(max-width:560px){
 .kpis{grid-template-columns:1fr 1fr}
 .board{grid-template-columns:1fr}
 .nav button .lbl{display:none}
 .nav button{padding:9px}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo">型</div>
    <div><b>產品型錄管理</b><span>PRODUCT CATALOG MGMT</span></div>
  </div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap" id="app"></div>

<script>
var NAV=[
 {i:0,ic:"inventory_2",t:"產品主檔"},
 {i:1,ic:"account_tree",t:"規格與 BOM"},
 {i:2,ic:"description",t:"多語系型錄"},
 {i:3,ic:"request_quote",t:"價格版本"},
 {i:4,ic:"history",t:"更新停產"},
 {i:5,ic:"verified",t:"品質稽核"}
];

var PRODUCTS=[
 {id:"PC-A200",name:"高精度伺服馬達 A200",cat:"驅動元件",status:"上市",statusTag:"t-ok",price:"NT$ 42,800",langs:3,accuracy:98,ver:"v4.2",bom:"BOM-A200-4",spec:{額定功率:"2.0 kW",轉速:"3000 rpm",扭矩:"6.4 N·m",防護等級:"IP65",重量:"8.2 kg",認證:"CE / UL"}},
 {id:"PC-B110",name:"工業級變頻器 B110",cat:"控制元件",status:"上市",statusTag:"t-ok",price:"NT$ 28,500",langs:3,accuracy:95,ver:"v3.1",bom:"BOM-B110-3",spec:{輸入電壓:"380V 三相",容量:"5.5 kW",控制方式:"V/F 向量",防護等級:"IP20",重量:"3.6 kg",認證:"CE"}},
 {id:"PC-C305",name:"精密減速機 C305",cat:"傳動元件",status:"更新中",statusTag:"t-warn",price:"NT$ 15,200",langs:2,accuracy:82,ver:"v2.0-rc",bom:"BOM-C305-2",spec:{減速比:"1:50",背隙:"< 1 arcmin",額定扭矩:"120 N·m",效率:"92%",重量:"5.1 kg",認證:"—"}},
 {id:"PC-D420",name:"線性滑軌模組 D420",cat:"傳動元件",status:"上市",statusTag:"t-ok",price:"NT$ 9,800",langs:3,accuracy:91,ver:"v5.0",bom:"BOM-D420-5",spec:{行程:"600 mm",精度:"±5 μm",負載:"800 N",材質:"不鏽鋼",重量:"2.4 kg",認證:"CE"}},
 {id:"PC-E512",name:"視覺檢測相機 E512",cat:"感測元件",status:"缺內容",statusTag:"t-bad",price:"待定價",langs:1,accuracy:58,ver:"v0.9",bom:"未對應",spec:{解析度:"500 萬畫素",幀率:"120 fps",介面:"GigE",鏡頭:"C-Mount",重量:"0.4 kg",認證:"—"}},
 {id:"PC-F088",name:"氣壓夾爪 F088",cat:"執行元件",status:"停產",statusTag:"t-mut",price:"NT$ 6,400",langs:3,accuracy:88,ver:"v1.7",bom:"BOM-F088-1",spec:{夾持力:"420 N",行程:"20 mm",氣壓:"0.4–0.7 MPa",防護等級:"IP54",重量:"0.9 kg",認證:"CE"}}
];

var charts={};
function disposeCharts(){for(var k in charts){try{charts[k].dispose();}catch(e){}}charts={};}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts[id]=c;}
window.addEventListener("resize",function(){for(var k in charts){try{charts[k].resize();}catch(e){}}});

function vhead(t,p,pill){return '<div class="vh"><div><h2>'+t+'</h2><p>'+p+'</p></div><div class="pill"><i></i>'+pill+'</div></div>';}
function kpi(l,v,d,cls,ic){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d '+(cls||'')+'">'+(d||'')+'</div><span class="ic material-symbols-outlined">'+ic+'</span></div>';}

/* ===== Screen 0: 產品主檔 — split workspace (signature) ===== */
var selP=0;
function screen0(){
 var h=vhead("產品主檔","集中管理產品編號、分類與規格屬性，左側清單、右側詳情","即時同步 PLM");
 h+='<div class="kpis">'+
   kpi("產品總數","1,284","本季 +46 項","up","inventory_2")+
   kpi("上市中","1,036","81% 佔比","","task_alt")+
   kpi("待補內容","37","缺規格/圖片","dn","warning")+
   kpi("停產待同步","9","需通知通路","dn","history")+
 '</div>';
 var list='<div class="plist">';
 for(var i=0;i<PRODUCTS.length;i++){var p=PRODUCTS[i];
   list+='<div class="pitem'+(i===selP?' on':'')+'" data-p="'+i+'"><div class="pn">'+p.id+' · '+p.name+'</div>'+
     '<div class="pc">'+p.cat+' ｜ 版本 '+p.ver+'</div>'+
     '<div class="pmeta"><span class="tag '+p.statusTag+'">'+p.status+'</span><span class="tag t-info">'+p.langs+' 語系</span><span class="tag t-mut">'+p.price+'</span></div></div>';
 }
 list+='</div>';
 h+='<div class="grid split"><div class="card"><h3><span class="material-symbols-outlined">list_alt</span>產品清單</h3>'+list+'</div>'+
   '<div class="card" id="pdetail"></div></div>';
 document.getElementById("app").innerHTML=h;
 renderDetail();
 var items=document.querySelectorAll("[data-p]");
 for(var j=0;j<items.length;j++){items[j].addEventListener("click",function(){selP=+this.getAttribute("data-p");
   var all=document.querySelectorAll("[data-p]");for(var k=0;k<all.length;k++){all[k].classList.remove("on");}
   this.classList.add("on");renderDetail();});}
}
function renderDetail(){
 var p=PRODUCTS[selP];var el=document.getElementById("pdetail");if(!el)return;
 var sp='';for(var key in p.spec){sp+='<div class="srow"><span class="muted">'+key+'</span><b>'+p.spec[key]+'</b></div>';}
 el.innerHTML='<h3><span class="material-symbols-outlined">description</span>'+p.id+' · '+p.name+' <span class="tag '+p.statusTag+'">'+p.status+'</span></h3>'+
  '<div class="grid g11" style="margin-bottom:14px">'+
   '<div class="srow"><span class="muted">分類</span><b>'+p.cat+'</b></div>'+
   '<div class="srow"><span class="muted">建議售價</span><b>'+p.price+'</b></div>'+
   '<div class="srow"><span class="muted">BOM 對應</span><b>'+p.bom+'</b></div>'+
   '<div class="srow"><span class="muted">內容版本</span><b>'+p.ver+'</b></div>'+
  '</div>'+
  '<div style="font-size:12.5px;font-weight:800;margin:4px 0 8px">規格屬性</div>'+
  '<div class="spec">'+sp+'</div>'+
  '<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span class="muted">資訊完整度</span><b class="mono">'+p.accuracy+'%</b></div><div class="bar"><i style="width:'+p.accuracy+'%"></i></div></div>';
}

/* ===== Screen 1: 規格與 BOM 對應 ===== */
function screen1(){
 var h=vhead("規格與 BOM 對應","技術規格、選配與 BOM/PLM 版本對應，追蹤未對應與版本落差","PLM 版本 R42");
 h+='<div class="kpis">'+
   kpi("BOM 對應率","94.2%","+3.1pt","up","account_tree")+
   kpi("未對應品項","74","需技術補件","dn","link_off")+
   kpi("版本落差","12","PLM 已更新","dn","difference")+
   kpi("選配組合","318","跨產品共用","","tune")+
 '</div>';
 h+='<div class="grid g2">'+
   '<div class="card"><h3><span class="material-symbols-outlined">difference</span>規格版本落差比對</h3><div class="scroll"><table class="data"><thead><tr><th>產品</th><th>規格項</th><th>型錄現值</th><th>PLM 最新</th><th>狀態</th></tr></thead><tbody>'+
     row1("PC-A200","額定功率","1.8 kW","2.0 kW","落差","t-bad")+
     row1("PC-A200","防護等級","IP54","IP65","落差","t-bad")+
     row1("PC-B110","容量","5.5 kW","5.5 kW","一致","t-ok")+
     row1("PC-C305","背隙","< 3 arcmin","< 1 arcmin","落差","t-warn")+
     row1("PC-D420","行程","600 mm","600 mm","一致","t-ok")+
     row1("PC-E512","介面","USB3","GigE","落差","t-bad")+
     row1("PC-F088","夾持力","420 N","420 N","一致","t-ok")+
   '</tbody></table></div></div>'+
   '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>BOM 對應分布</h3><div class="chart" id="c1a"></div></div>'+
 '</div>';
 h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">bar_chart</span>各分類未對應品項數</h3><div class="chart" id="c1b" style="height:230px"></div></div>';
 document.getElementById("app").innerHTML=h;
 void document.getElementById("app").offsetHeight;
 mkChart("c1a",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:"pie",radius:["42%","68%"],center:["50%","45%"],label:{show:false},data:[
   {value:1096,name:"完整對應",itemStyle:{color:"#0891b2"}},
   {value:114,name:"版本落差",itemStyle:{color:"#22d3ee"}},
   {value:74,name:"未對應",itemStyle:{color:"#f59e0b"}}
 ]}]});
 mkChart("c1b",{grid:{left:50,right:16,top:20,bottom:30},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["驅動","控制","傳動","感測","執行","電源"],axisLabel:{fontSize:11}},yAxis:{type:"value"},series:[{type:"bar",data:[8,11,19,22,9,5],itemStyle:{color:"#22d3ee",borderRadius:[6,6,0,0]},barWidth:"46%"}]});
}
function row1(a,b,c,d,s,t){return '<tr><td><b>'+a+'</b></td><td>'+b+'</td><td class="mono">'+c+'</td><td class="mono">'+d+'</td><td><span class="tag '+t+'">'+s+'</span></td></tr>';}

/* ===== Screen 2: 多語系型錄產出 — board ===== */
var CONTENT=[
 {p:"PC-A200 伺服馬達",stage:"素材彙整",zh:"ok",en:"ok",ja:"pend",owner:"陳彥廷",due:"08/16"},
 {p:"PC-B110 變頻器",stage:"素材彙整",zh:"ok",en:"pend",ja:"no",owner:"林郁婷",due:"08/18"},
 {p:"PC-C305 減速機",stage:"翻譯校對",zh:"ok",en:"ok",ja:"pend",owner:"王思翰",due:"08/15"},
 {p:"PC-D420 滑軌模組",stage:"翻譯校對",zh:"ok",en:"ok",ja:"ok",owner:"張筱雯",due:"08/14"},
 {p:"PC-E512 檢測相機",stage:"設計排版",zh:"pend",en:"no",ja:"no",owner:"陳彥廷",due:"08/20"},
 {p:"PC-F088 氣壓夾爪",stage:"待發布",zh:"ok",en:"ok",ja:"ok",owner:"林郁婷",due:"08/13"}
];
function langChip(s,lb){var cls=s==="ok"?"lang-ok":s==="pend"?"lang-pend":"lang-no";var ic=s==="ok"?"check":s==="pend"?"schedule":"close";return '<span class="lang-chip '+cls+'"><span class="material-symbols-outlined" style="font-size:13px">'+ic+'</span>'+lb+'</span>';}
function screen2(){
 var h=vhead("多語系型錄產出","多語系內容編排、範本套版與 PDF 發布，看板追蹤各語系進度","範本 CATv6");
 h+='<div class="kpis">'+
   kpi("進行中型錄","24","6 個階段","","description")+
   kpi("繁中完成率","96%","+2pt","up","translate")+
   kpi("英日待譯","11","本週到期","dn","hourglass_top")+
   kpi("本月已發布","58","PDF + 線上","up","publish")+
 '</div>';
 var stages=["素材彙整","翻譯校對","設計排版","待發布"];
 var b='<div class="board">';
 for(var s=0;s<stages.length;s++){
   var cards='';var cnt=0;
   for(var i=0;i<CONTENT.length;i++){var c=CONTENT[i];if(c.stage!==stages[s])continue;cnt++;
     cards+='<div class="ccard"><b>'+c.p+'</b><div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">'+langChip(c.zh,"繁中")+langChip(c.en,"EN")+langChip(c.ja,"JP")+'</div><div class="cm"><span>'+c.owner+'</span><span>截 '+c.due+'</span></div></div>';
   }
   b+='<div class="col"><h4>'+stages[s]+' <span>'+cnt+'</span></h4>'+cards+'</div>';
 }

function show(i){
 disposeCharts();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}

 fn();
}
function buildNav(){
 var n=document.getElementById("nav");var html="";
 for(var i=0;i<NAV.length;i++){var x=NAV[i];
   html+='<button data-i="'+x.i+'"><span class="material-symbols-outlined">'+x.ic+'</span><span class="lbl">'+x.t+'</span></button>';
 }
 n.innerHTML=html;
 var btns=n.querySelectorAll("[data-i]");
 for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
