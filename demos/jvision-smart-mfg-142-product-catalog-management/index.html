<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>產品型錄管理 · Product Catalog Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --ok:#047857;
  --warn:#A15C00;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --vio:#6D28D9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Nunito Sans",sans-serif;
  font-size:15px;
  line-height:1.5;
}
button{font:inherit}
button,[data-p]{cursor:pointer}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:22px;
  min-height:72px;
  padding:10px clamp(16px,3vw,36px);
  background:var(--color-card);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex:none;
  min-width:0;
}
.logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--color-primary);
  border-radius:10px;
  font-family:Rubik,sans-serif;
  font-size:17px;
  font-weight:700;
}
.brand b{
  display:block;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
}
.brand span{
  display:block;
  margin-top:1px;
  color:var(--blue);
  font-family:Rubik,sans-serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.15em;
}
.nav{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.nav button{
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  min-height:44px;
  padding:9px 12px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button:hover{
  color:var(--blue);
  background:var(--color-muted);
  border-color:var(--line);
}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.nav button .material-symbols-outlined{font-size:18px}
button:focus-visible,[data-p]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.wrap{
  width:min(100%,1380px);
  margin:0 auto;
  padding:clamp(20px,3vw,36px);
}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
}
.vh h2{
  margin:0;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:clamp(24px,3vw,31px);
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.025em;
}
.vh p{
  max-width:760px;
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex:none;
  min-height:34px;
  padding:6px 12px;
  color:#065F46;
  background:#D1FAE5;
  border:1px solid #A7F3D0;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.pill i{
  width:8px;
  height:8px;
  background:var(--color-accent);
  border-radius:2px;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px 18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:10px;
  transition:border-color 180ms ease,background-color 180ms ease;
}
.kpi:hover{border-color:#B9CDF7;background:#FCFDFF}
.kpi .l{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .v{
  margin-top:4px;
  padding-right:34px;
  font-family:Rubik,sans-serif;
  font-size:26px;
  line-height:1.25;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi .d{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
.kpi .ic{
  position:absolute;
  top:15px;
  right:15px;
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  color:var(--blue);
  background:#EFF6FF;
  border-radius:7px;
}
.up{color:var(--ok)!important}
.dn{color:var(--bad)!important}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(290px,340px) minmax(0,1fr)}
.card{
  min-width:0;
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:10px;
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 15px;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:15px;
  line-height:1.35;
  font-weight:600;
}
.card h3 .material-symbols-outlined{color:var(--blue)}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:23px;
  padding:2px 8px;
  border:1px solid transparent;
  border-radius:6px;
  font-size:10.5px;
  line-height:1.25;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#065F46;background:#D1FAE5;border-color:#A7F3D0}
.t-warn{color:#92400E;background:#FEF3C7;border-color:#FDE68A}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FECACA}
.t-info{color:#1E40AF;background:#DBEAFE;border-color:#BFDBFE}
.t-mut{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.t-vio{color:#5B21B6;background:#EDE9FE;border-color:#DDD6FE}
.scroll{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:8px;
}
table.data{
  width:100%;
  min-width:580px;
  border-collapse:collapse;
  font-size:12.5px;
}
table.data th,table.data td{
  padding:10px 11px;
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:middle;
}
table.data th{
  color:#334155;
  background:var(--color-muted);
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.01em;
}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr{transition:background-color 160ms ease}
table.data tbody tr:hover{background:#F8FAFF}
table.data td.num,table.data th.num{
  text-align:right;
  font-family:Rubik,monospace;
  font-variant-numeric:tabular-nums;
}
table.data td:first-child b{font-family:Rubik,monospace}
.chart{width:100%;height:250px;overflow:hidden}
.muted{color:var(--muted)}
.mono{
  font-family:Rubik,ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.plist{
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:560px;
  overflow:auto;
}
.pitem{
  min-height:44px;
  padding:11px 12px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  transition:background-color 180ms ease,border-color 180ms ease;
}
.pitem:hover{background:#F8FAFF;border-color:#9EB9F2}
.pitem.on{
  background:#EFF6FF;
  border-color:var(--blue);
  box-shadow:inset 4px 0 0 var(--blue);
}
.pitem .pn{
  font-size:13px;
  font-weight:700;
}
.pitem .pc{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}
.pitem .pmeta{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px;
}
.spec{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.srow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-width:0;
  padding:10px 11px;
  background:#FBFCFF;
  border:1px solid var(--line);
  border-radius:7px;
  font-size:12.5px;
}
.srow b{
  text-align:right;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.bar{
  height:9px;
  overflow:hidden;
  background:#E2E8F0;
  border-radius:3px;
}
.bar>i{
  display:block;
  height:100%;
  background:var(--color-accent);
  border-radius:3px;
}
.tl{position:relative;padding-left:24px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:7px;
  width:2px;
  background:var(--line);
}
.tli{position:relative;padding:0 0 18px 7px}
.tli:last-child{padding-bottom:2px}
.tli::before{
  content:"";
  position:absolute;
  top:3px;
  left:-21px;
  width:12px;
  height:12px;
  background:var(--color-card);
  border:3px solid var(--blue);
  border-radius:3px;
}
.tli .tt{
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:13px;
  font-weight:600;
}
.tli .td{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:11px;
}
.col{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:1px solid var(--line);
  border-radius:8px;
}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 9px;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:12.5px;
  font-weight:600;
}
.col h4 span{
  min-width:25px;
  padding:2px 7px;
  color:var(--muted);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:5px;
  text-align:center;
  font-family:Rubik,monospace;
  font-size:11px;
}
.ccard{
  margin-bottom:8px;
  padding:10px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:7px;
  font-size:12px;
}
.ccard:last-child{margin-bottom:0}
.ccard b{font-size:12.5px}
.ccard .cm{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.lang-chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:23px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:6px;
  font-size:10.5px;
  font-weight:700;
}
.lang-ok{color:#065F46;background:#D1FAE5;border-color:#A7F3D0}
.lang-no{color:#991B1B;background:#FEE2E2;border-color:#FECACA}
.lang-pend{color:#92400E;background:#FEF3C7;border-color:#FDE68A}
.legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:9px;
  color:var(--muted);
  font-size:11.5px;
}
.legend i{
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:5px;
  border-radius:2px;
  vertical-align:middle;
}
.notice{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:9px;
  padding:11px 12px;
  background:#FBFCFF;
  border:1px solid var(--line);
  border-left:4px solid var(--blue);
  border-radius:7px;
}
.notice:last-child{margin-bottom:0}
.notice .material-symbols-outlined{
  flex:none;
  margin-top:1px;
}
.notice .nt{
  font-size:13px;
  font-weight:700;
}
.notice .nd{
  margin-top:2px;
  color:var(--muted);
  font-size:12px;
}
.grid-item{
  animation:grid-in 400ms cubic-bezier(.2,.8,.2,1) both;
}
.grid-item:nth-child(2){animation-delay:60ms}
.grid-item:nth-child(3){animation-delay:120ms}
.grid-item:nth-child(4){animation-delay:180ms}
@keyframes grid-in{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .top{align-items:flex-start;flex-direction:column;gap:8px}
  .nav{width:100%;margin-left:0}
  .g2{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr)}
  .split{grid-template-columns:300px minmax(0,1fr)}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .wrap{padding:20px 16px 28px}
  .vh{align-items:flex-start;flex-direction:column}
  .g2,.g11,.split{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plist{max-height:370px}
}
@media(max-width:480px){
  .top{padding:9px 12px}
  .brand b{font-size:14px}
  .nav button{min-width:44px;justify-content:center;padding:9px}
  .nav button .lbl{display:none}
  .kpis{grid-template-columns:1fr}
  .board,.spec{grid-template-columns:1fr}
  .kpi .v{font-size:24px}
  .card{padding:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">型</div>
    <div><b>產品型錄管理</b><span>PRODUCT CATALOG MGMT</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap" id="app"></main>
<script>
var NAV=[
 {i:0,ic:"inventory_2",t:"產品主檔"},
 {i:1,ic:"account_tree",t:"規格與 BOM"},
 {i:2,ic:"description",t:"多語系型錄"},
 {i:3,ic:"request_quote",t:"價格版本"},
 {i:4,ic:"history",t:"更新停產"},
 {i:5,ic:"verified",t:"品質稽核"}
];

var PRODUCTS=[
 {id:"PC-A200",name:"高精度伺服馬達 A200",cat:"驅動元件",status:"上市",statusTag:"t-ok",price:"NT$ 42,800",langs:3,accuracy:98,ver:"v4.2",bom:"BOM-A200-4",spec:{額定功率:"2.0 kW",轉速:"3000 rpm",扭矩:"6.4 N·m",防護等級:"IP65",重量:"8.2 kg",認證:"CE / UL"}},
 {id:"PC-B110",name:"工業級變頻器 B110",cat:"控制元件",status:"上市",statusTag:"t-ok",price:"NT$ 28,500",langs:3,accuracy:95,ver:"v3.1",bom:"BOM-B110-3",spec:{輸入電壓:"380V 三相",容量:"5.5 kW",控制方式:"V/F 向量",防護等級:"IP20",重量:"3.6 kg",認證:"CE"}},
 {id:"PC-C305",name:"精密減速機 C305",cat:"傳動元件",status:"更新中",statusTag:"t-warn",price:"NT$ 15,200",langs:2,accuracy:82,ver:"v2.0-rc",bom:"BOM-C305-2",spec:{減速比:"1:50",背隙:"< 1 arcmin",額定扭矩:"120 N·m",效率:"92%",重量:"5.1 kg",認證:"—"}},
 {id:"PC-D420",name:"線性滑軌模組 D420",cat:"傳動元件",status:"上市",statusTag:"t-ok",price:"NT$ 9,800",langs:3,accuracy:91,ver:"v5.0",bom:"BOM-D420-5",spec:{行程:"600 mm",精度:"±5 μm",負載:"800 N",材質:"不鏽鋼",重量:"2.4 kg",認證:"CE"}},
 {id:"PC-E512",name:"視覺檢測相機 E512",cat:"感測元件",status:"缺內容",statusTag:"t-bad",price:"待定價",langs:1,accuracy:58,ver:"v0.9",bom:"未對應",spec:{解析度:"500 萬畫素",幀率:"120 fps",介面:"GigE",鏡頭:"C-Mount",重量:"0.4 kg",認證:"—"}},
 {id:"PC-F088",name:"氣壓夾爪 F088",cat:"執行元件",status:"停產",statusTag:"t-mut",price:"NT$ 6,400",langs:3,accuracy:88,ver:"v1.7",bom:"BOM-F088-1",spec:{夾持力:"420 N",行程:"20 mm",氣壓:"0.4–0.7 MPa",防護等級:"IP54",重量:"0.9 kg",認證:"CE"}}
];

var charts={};
function disposeCharts(){
 for(var k in charts){try{charts[k].dispose()}catch(e){}}
 charts={};
}
function mkChart(id,opt){
 var el=document.getElementById(id);
 if(!el)return;
 var c=echarts.init(el);
 c.setOption(opt);
 charts[id]=c;
}
window.addEventListener("resize",function(){
 for(var k in charts){try{charts[k].resize()}catch(e){}}
});
function vhead(t,p,pill){
 return '<div class="vh"><div><h2>'+t+'</h2><p>'+p+'</p></div><div class="pill"><i aria-hidden="true"></i>'+pill+'</div></div>';
}
function kpi(l,v,d,cls,ic){
 return '<div class="kpi grid-item"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d '+(cls||"")+'">'+(d||"")+'</div><span class="ic material-symbols-outlined" aria-hidden="true">'+ic+'</span></div>';
}

var selP=0;
function screen0(){
 var h=vhead("產品主檔","集中管理產品編號、分類與規格屬性，左側清單、右側詳情","即時同步 PLM");
 h+='<div class="kpis">'+
 kpi("產品總數","1,284","本季 +46 項","up","inventory_2")+
 kpi("上市中","1,036","81% 佔比","","task_alt")+
 kpi("待補內容","37","缺規格/圖片","dn","warning")+
 kpi("停產待同步","9","需通知通路","dn","history")+
 '</div>';
 var list='<div class="plist">';
 for(var i=0;i<PRODUCTS.length;i++){
  var p=PRODUCTS[i];
  list+='<div class="pitem'+(i===selP?' on':'')+'" data-p="'+i+'" tabindex="0" role="button" aria-pressed="'+(i===selP?'true':'false')+'"><div class="pn">'+p.id+' · '+p.name+'</div><div class="pc">'+p.cat+' ｜ 版本 '+p.ver+'</div><div class="pmeta"><span class="tag '+p.statusTag+'">'+p.status+'</span><span class="tag t-info">'+p.langs+' 語系</span><span class="tag t-mut">'+p.price+'</span></div></div>';
 }

  var x=NAV[i];
  html+='<button type="button" data-i="'+x.i+'" aria-label="'+x.t+'"><span class="material-symbols-outlined" aria-hidden="true">'+x.ic+'</span><span class="lbl">'+x.t+'</span></button>';
 }
 n.innerHTML=html;
 var btns=n.querySelectorAll("[data-i]");
 for(var j=0;j<btns.length;j++){
  btns[j].addEventListener("click",function(){
   location.hash="v"+this.getAttribute("data-i");
  });
 }
}
buildNav();
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 if(!m){show(0);return}
 var n=document.querySelectorAll("[data-i]").length||6;
 show(Math.min(+m[1],n-1));
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
