<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產品追溯管理 Traceability Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;

  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --sub:var(--color-muted-foreground);
  --bg:var(--color-background);
  --card:var(--color-card);
  --sidebar:#ffffff;
  --sidebar2:#f8fafc;
  --ok:#15803d;
  --warn:#a16207;
  --danger:var(--color-destructive);
  --shadow-xs:0 1px 2px rgba(15,23,42,.05);
  --shadow-sm:0 6px 18px rgba(15,23,42,.06);
  --shadow-md:0 14px 32px rgba(15,23,42,.09);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button{cursor:pointer;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-size:1.25rem;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}

.app{display:flex;min-height:100vh;}
.sidebar{
  width:264px;
  flex:0 0 264px;
  height:100vh;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:24px 16px 18px;
  overflow-y:auto;
  color:var(--color-foreground);
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  border-right:1px solid var(--color-border);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  margin-bottom:14px;
  padding:0 8px 20px;
  border-bottom:1px solid var(--color-border);
}
.brand .logo{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:8px;
  box-shadow:6px 6px 0 #bfdbfe;
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{
  display:block;
  color:var(--color-foreground);
  font-size:15px;
  font-weight:700;
  line-height:1.35;
  letter-spacing:.02em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:3px;
  color:var(--color-muted-foreground);
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.4;
  letter-spacing:.08em;
}
.nav{display:flex;flex-direction:column;gap:6px;}
.navbtn{
  width:100%;
  min-width:0;
  min-height:46px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:14px;
  font-weight:500;
  line-height:1.25;
  text-align:left;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;}
.navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .idx{
  margin-left:auto;
  color:#64748b;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.08em;
}
.navbtn:hover{
  color:var(--color-primary);
  background:#eff6ff;
  border-color:#bfdbfe;
  transform:translateX(2px);
}
.navbtn.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:4px 4px 0 #bfdbfe;
}
.navbtn.on .idx{color:#dbeafe;}
.side-foot{
  margin-top:auto;
  padding:16px 8px 0;
  color:#64748b;
  border-top:1px solid var(--color-border);
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.7;
}

.main{flex:1 1 auto;min-width:0;padding:30px clamp(18px,3vw,44px) 64px;}
.topbar{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin:-30px calc(clamp(18px,3vw,44px) * -1) 24px;
  padding:22px clamp(18px,3vw,44px) 18px;
  background:rgba(248,250,252,.94);
  border-bottom:1px solid rgba(226,232,240,.9);
  backdrop-filter:blur(12px);
}
.topbar h1{
  margin:0 0 5px;
  color:var(--color-foreground);
  font-size:clamp(21px,2.2vw,28px);
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.025em;
}
.topbar .crumb{
  color:var(--color-muted-foreground);
  font-family:"Fira Code",monospace;
  font-size:11px;
  line-height:1.5;
}
.pill{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 13px;
  color:#334155;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:999px;
  box-shadow:var(--shadow-xs);
  font-size:12px;
  font-weight:500;
  line-height:1.35;
  white-space:nowrap;
}
.pill .material-symbols-outlined{position:relative;font-size:15px!important;}
.pill .material-symbols-outlined::after{
  content:"";
  position:absolute;
  inset:-4px;
  border:1px solid #86efac;
  border-radius:50%;
}

.grid{display:grid;gap:18px;min-width:0;}
#screen{align-content:start;}
#screen>.grid+#screen>.grid{margin-top:0;}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.card{
  min-width:0;
  padding:20px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:10px;
  box-shadow:var(--shadow-xs);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
  animation:card-enter .4s both cubic-bezier(.2,.8,.2,1);
}
.grid>.card:nth-child(2){animation-delay:.06s;}
.grid>.card:nth-child(3){animation-delay:.12s;}
.grid>.card:nth-child(4){animation-delay:.18s;}
.card:hover{border-color:#cbd5e1;box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  color:var(--color-foreground);
  font-size:15px;
  font-weight:700;
  line-height:1.4;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:0 0 30px;
  color:var(--color-primary);
  background:#eff6ff;
  border-radius:6px;
  font-size:18px;
}
.card .sub{
  margin:0 0 16px 39px;
  color:var(--color-muted-foreground);
  font-size:12px;
  line-height:1.55;
}

.kpi{position:relative;overflow:hidden;padding:18px 19px;}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:54px;
  height:4px;
  background:var(--color-primary);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
  line-height:1.4;
}
.kpi .lab .material-symbols-outlined{color:var(--color-primary);font-size:18px;}
.kpi .val{
  margin:12px 0 7px;
  color:#0f172a;
  font-family:"Fira Code",monospace;
  font-size:clamp(26px,2.6vw,34px);
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  line-height:1;
  letter-spacing:-.045em;
}
.kpi .val small{
  margin-left:6px;
  color:var(--color-muted-foreground);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  font-weight:500;
  letter-spacing:0;
}
.kpi .dt{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
}
.kpi .dt .material-symbols-outlined{font-size:14px;}
.up{color:#166534;background:#f0fdf4;}
.down{color:#991b1b;background:#fff1f2;}
.flat{color:#334155;background:#f1f5f9;}

.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:240px;}

table{width:100%;border-spacing:0;border-collapse:separate;font-size:12.5px;line-height:1.45;}
th,td{
  padding:12px 11px;
  text-align:left;
  vertical-align:middle;
  border-bottom:1px solid var(--color-border);
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#334155;
  background:var(--color-muted);
  border-top:1px solid #d8e2f0;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.075em;
  text-transform:uppercase;
}
th:first-child{border-radius:6px 0 0 0;}
th:last-child{border-radius:0 6px 0 0;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#f1f5f9;}
tbody tr:last-child td{border-bottom:0;}
th:nth-child(4),td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.tag::before{content:"";width:6px;height:6px;flex:0 0 6px;background:currentColor;border-radius:50%;}
.t-ok{color:#166534;background:#f0fdf4;}
.t-warn{color:#854d0e;background:#fefce8;}
.t-bad{color:#991b1b;background:#fff1f2;}
.t-info{color:#1e40af;background:#eff6ff;}
.t-mut{color:#334155;background:#f1f5f9;}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.015em;
}

.tree{display:flex;flex-direction:column;gap:0;}
.trow{display:flex;align-items:stretch;gap:0;}
.tlvl{flex:0 0 210px;min-width:0;padding:8px 0;}
.tnode{
  position:relative;
  padding:12px 13px;
  background:#f8fafc;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-primary);
  border-radius:7px;
  box-shadow:var(--shadow-xs);
}
.tnode.mat{border-left-color:#0369a1;}
.tnode.proc{border-left-color:#6d28d9;}
.tnode.fin{border-left-color:var(--color-primary);}
.tnode.ship{border-left-color:var(--color-accent);}
.tnode .tt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;line-height:1.4;}
.tnode .tt .material-symbols-outlined{font-size:18px;}
.tnode .tm{margin-top:4px;color:var(--color-muted-foreground);font-size:11px;line-height:1.45;}
.tconn{position:relative;flex:1 1 auto;min-width:24px;display:flex;align-items:center;justify-content:center;}
.tconn::before{content:"";position:absolute;right:0;left:0;top:50%;height:1px;background:var(--color-primary);}
.tconn .material-symbols-outlined{position:relative;z-index:1;color:var(--color-primary);background:var(--color-card);font-size:19px;}

.tl{position:relative;padding-left:29px;}
.tl::before{content:"";position:absolute;top:5px;bottom:5px;left:8px;width:1px;background:#cbd5e1;}
.tli{position:relative;padding:0 0 20px;}
.tli:last-child{padding-bottom:0;}
.tli .dot{
  position:absolute;
  top:1px;
  left:-29px;
  width:17px;
  height:17px;
  background:var(--color-card);
  border:4px solid var(--color-primary);
  border-radius:50%;
  box-shadow:0 0 0 3px var(--color-card);
}
.tli.ok .dot{border-color:var(--ok);}
.tli.warn .dot{border-color:var(--warn);}
.tli.bad .dot{border-color:var(--danger);}
.tli .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;line-height:1.45;}
.tli .tmeta{margin-top:4px;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10.5px;line-height:1.5;}
.tli .tsub{margin-top:7px;padding:9px 11px;color:#334155;background:#f8fafc;border:1px solid var(--color-border);border-radius:6px;font-size:12px;line-height:1.5;}

.board{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))!important;gap:12px;min-width:0;}
.col{min-width:0;padding:11px;background:#f1f5f9;border:1px solid var(--color-border);border-radius:8px;}
.col h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:#334155;font-size:12px;font-weight:700;line-height:1.4;}
.col h4 .cnt{min-width:23px;padding:2px 7px;color:var(--color-on-primary);background:var(--color-primary);border-radius:999px;font-family:"Fira Code",monospace;font-size:10px;text-align:center;}
.tk{margin-bottom:9px;padding:11px;background:var(--color-card);border:1px solid var(--color-border);border-radius:6px;box-shadow:var(--shadow-xs);transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;}
.tk:hover{border-color:#93c5fd;box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.tk:last-child{margin-bottom:0;}
.tk .tkid{color:var(--color-primary);font-size:10.5px;font-weight:600;}
.tk .tkt{margin:4px 0 8px;font-size:12px;font-weight:600;line-height:1.45;}
.tk .tkf{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;color:var(--color-muted-foreground);font-size:10px;line-height:1.4;}
.col .tag,.col .pill,.col .chip,.col span[class*="t-"]{white-space:nowrap;}

.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;}
.fld label{color:#334155;font-size:11.5px;font-weight:600;}
.fld .inp{
  min-height:44px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 12px;
  overflow:hidden;
  color:var(--color-foreground);
  background:var(--color-card);
  border:1px solid #cbd5e1;
  border-radius:6px;
  font-family:"Fira Code",monospace;
  font-size:12px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.fld .inp .material-symbols-outlined{flex:0 0 auto;color:var(--color-primary);font-size:19px;}
.btn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 18px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:1px solid #c2410c;
  border-radius:6px;
  box-shadow:3px 3px 0 #fed7aa;
  font-size:13px;
  font-weight:700;
  line-height:1.3;
  white-space:nowrap;
  transition:background-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btn:hover{background:#c2410c;box-shadow:5px 5px 0 #fed7aa;transform:translate(-1px,-1px);}
.btn:active{box-shadow:1px 1px 0 #fed7aa;transform:translate(2px,2px);}
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.mini{min-width:0;padding:12px 13px;background:#f8fafc;border:1px solid var(--color-border);border-radius:6px;}
.mini .ml{color:var(--color-muted-foreground);font-size:10.5px;line-height:1.4;}
.mini .mv{margin-top:5px;color:#0f172a;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.recall-banner{
  display:flex;
  align-items:flex-start;
  gap:13px;
  padding:16px 18px;
  color:#7f1d1d;
  background:#fff7ed;
  border:1px solid #fdba74;
  border-left:5px solid var(--color-destructive);
  border-radius:8px;
  box-shadow:var(--shadow-xs);
  animation:card-enter .4s both cubic-bezier(.2,.8,.2,1);
}
.recall-banner>.material-symbols-outlined{flex:0 0 auto;color:var(--color-destructive);font-size:27px;}
.recall-banner b{font-weight:700;}
.chk{display:flex;align-items:flex-start;gap:9px;color:#334155;font-size:12.5px;line-height:1.5;}
.chk .box{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;margin-top:1px;border:2px solid var(--color-primary);border-radius:4px;}
.chk .box.on{background:var(--color-primary);}
.chk .box.on .material-symbols-outlined{color:var(--color-on-primary);font-size:13px;}
.sec-title{display:flex;align-items:center;gap:8px;margin:2px 0 10px;color:var(--color-foreground);font-size:13px;font-weight:700;line-height:1.4;}
.sec-title .material-symbols-outlined{color:var(--color-primary);font-size:19px;}

button:focus-visible,
.navbtn:focus-visible,
.btn:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px var(--color-card);
}
::selection{color:var(--color-on-primary);background:var(--color-primary);}

@keyframes card-enter{
  from{opacity:0;transform:translateY(16px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g3{grid-template-columns:minmax(0,1.45fr) minmax(260px,1fr);}
}
@media(max-width:900px){
  .app{display:block;}
  .sidebar{
    width:100%;
    height:auto;
    position:sticky;
    top:0;
    flex:none;
    padding:11px 14px;
    border-right:0;
    border-bottom:1px solid var(--color-border);
    box-shadow:0 4px 16px rgba(15,23,42,.06);
  }
  .brand{margin:0;padding:0 4px 10px;border-bottom:0;}
  .brand .logo{width:36px;height:36px;flex-basis:36px;box-shadow:4px 4px 0 #bfdbfe;}
  .brand span:not(.material-symbols-outlined){display:none;}
  .nav{width:100%;display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px;overflow-x:auto;}
  .navbtn{min-height:44px;justify-content:center;padding:9px 10px;}
  .navbtn .nt,.navbtn .idx{display:none;}
  .navbtn:hover{transform:none;}
  .side-foot{display:none;}
  .main{padding:22px 18px 52px;}
  .topbar{position:static;margin:-22px -18px 22px;padding:20px 18px 16px;backdrop-filter:none;}
}
@media(max-width:768px){
  .g2,.g3,.search-row{grid-template-columns:1fr;}
  .topbar{align-items:flex-start;flex-direction:column;gap:12px;}
  .pill{white-space:normal;}
  .card{padding:17px;}
  .card .sub{margin-left:0;margin-top:7px;}
  .chart,.chart.sm{height:230px;}
  .btn{width:100%;}
  .tlvl{flex-basis:175px;}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .main{padding-right:14px;padding-left:14px;}
  .topbar{margin-right:-14px;margin-left:-14px;padding-right:14px;padding-left:14px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .kpi{padding:15px;}

  return '<div class="chk"><div class="box'+(on?' on':'')+'">'+(on?ic("check"):"")+'</div><span style="'+(on?'color:var(--sub);text-decoration:line-through':'')+'">'+txt+'</span></div>';
}

/* ---------- render ---------- */
var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  var n=NAV.length;
  if(i<0)i=0;if(i>n-1)i=n-1;
  disposeCharts();
  var meta=NAV[i];
  document.getElementById("scTitle").textContent=meta.title;
  document.getElementById("scCrumb").textContent="產品追溯管理 / "+meta.crumb;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  void container.offsetHeight;
  initCharts(i);
}
(function buildNav(){
  var nav=document.getElementById("nav");
  var html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button class="navbtn" data-i="'+i+'">'+ic(NAV[i].icon)+'<span class="nt">'+NAV[i].label+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var k=+this.getAttribute("data-i");show(k);try{history.replaceState(null,"","#go="+k);}catch(e){}});
  }
})();
window.addEventListener("resize",function(){for(var k in chartRegistry){try{chartRegistry[k].resize();}catch(e){}}});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
