<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產品追溯管理 Traceability Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#1d4ed8; --accent2:#60a5fa; --ink:#0f172a; --sub:#64748b;
  --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --sidebar:#0b1220; --sidebar2:#111a2e;
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#cbd5e1;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
.brand .logo{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{color:#fff;font-size:15px;font-family:"Noto Sans TC";display:block;line-height:1.3;}
.brand span{font-size:11px;color:#94a3b8;letter-spacing:.5px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;border:none;background:transparent;color:#cbd5e1;cursor:pointer;font-family:"Noto Sans TC";font-size:14px;text-align:left;width:100%;transition:.15s;min-width:0;}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.35);}
.navbtn .idx{margin-left:auto;font-size:11px;opacity:.5;font-weight:600;}
.side-foot{margin-top:auto;font-size:11px;color:#64748b;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.topbar h1{font-family:"Noto Sans TC";font-size:22px;margin:0 0 3px;font-weight:900;}
.topbar .crumb{font-size:12.5px;color:var(--sub);}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--sub);}
.grid{display:grid;gap:16px;min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:2fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.card h3{margin:0 0 3px;font-size:14.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:12px;color:var(--sub);margin-bottom:12px;}
.kpi .lab{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:800;margin:8px 0 2px;font-family:"Inter";}
.kpi .val small{font-size:14px;color:var(--sub);font-weight:600;margin-left:3px;}
.kpi .dt{font-size:11.5px;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;}
.up{background:#dcfce7;color:#166534;}.down{background:#fee2e2;color:#991b1b;}.flat{background:#e2e8f0;color:#475569;}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:230px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#f8fafc;}
tbody tr:hover{background:#f8fafc;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
.t-ok{background:#dcfce7;color:#166534;}.t-warn{background:#fef3c7;color:#92400e;}.t-bad{background:#fee2e2;color:#991b1b;}.t-info{background:#dbeafe;color:#1e40af;}.t-mut{background:#e2e8f0;color:#475569;}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums;letter-spacing:.2px;}
/* signature: genealogy tree */
.tree{display:flex;flex-direction:column;gap:0;}
.trow{display:flex;align-items:stretch;gap:0;}
.tlvl{flex:0 0 190px;min-width:0;padding:10px 0;}
.tnode{background:#f8fafc;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 12px;position:relative;}
.tnode.mat{border-left-color:#0891b2;}
.tnode.proc{border-left-color:#7c3aed;}
.tnode.fin{border-left-color:var(--accent);}
.tnode.ship{border-left-color:#ea580c;}
.tnode .tt{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
.tnode .tt .material-symbols-outlined{font-size:18px;}
.tnode .tm{font-size:11.5px;color:var(--sub);margin-top:3px;}
.tconn{flex:1 1 auto;min-width:20px;display:flex;align-items:center;justify-content:center;position:relative;}
.tconn:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.tconn .material-symbols-outlined{color:var(--accent);background:var(--card);position:relative;z-index:1;font-size:20px;}
/* timeline */
.tl{position:relative;padding-left:24px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 18px;}
.tli:last-child{padding-bottom:0;}
.tli .dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tli.ok .dot{border-color:var(--ok);}.tli.warn .dot{border-color:var(--warn);}.tli.bad .dot{border-color:var(--danger);}
.tli .th{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tli .tmeta{font-size:12px;color:var(--sub);margin-top:3px;}
.tli .tsub{font-size:12.5px;margin-top:4px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
/* kanban board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col h4{margin:0 0 9px;font-size:12.5px;font-family:"Noto Sans TC";display:flex;align-items:center;justify-content:space-between;}
.col h4 .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.tk:last-child{margin-bottom:0;}
.tk .tkid{font-size:11px;color:var(--sub);}
.tk .tkt{font-size:12.5px;font-weight:600;margin:2px 0 6px;font-family:"Noto Sans TC";}
.tk .tkf{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);gap:6px;}
/* form/search */
.search-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;}
.fld label{font-size:12px;color:var(--sub);font-weight:600;}
.fld .inp{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;background:#f8fafc;font-family:"Inter";display:flex;align-items:center;gap:8px;color:var(--ink);}
.fld .inp .material-symbols-outlined{color:var(--accent);font-size:19px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:13.5px;font-weight:600;font-family:"Noto Sans TC";cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.mini{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;}
.mini .ml{font-size:11.5px;color:var(--sub);}
.mini .mv{font-size:19px;font-weight:800;margin-top:3px;}
.recall-banner{background:linear-gradient(135deg,#fef2f2,#fff);border:1px solid #fecaca;border-left:4px solid var(--danger);border-radius:12px;padding:14px 16px;display:flex;gap:13px;align-items:flex-start;}
.recall-banner .material-symbols-outlined{color:var(--danger);font-size:26px;flex:0 0 auto;}
.recall-banner b{font-family:"Noto Sans TC";}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;}
.chk .box{width:16px;height:16px;flex:0 0 auto;border-radius:4px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;}
.chk .box.on{background:var(--accent);}
.chk .box.on .material-symbols-outlined{color:#fff;font-size:13px;}
.sec-title{font-family:"Noto Sans TC";font-size:14px;font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:7px;}
.sec-title .material-symbols-outlined{color:var(--accent);font-size:19px;}
@media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr;}.stat-strip{grid-template-columns:1fr 1fr;}.board{grid-template-columns:1fr 1fr;}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px;}
  .brand{border-bottom:none;padding:0 8px 0 4px;margin:0;flex:1 1 auto;}
  .side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;}
  .navbtn{width:auto;flex:0 0 auto;padding:9px 12px;}
  .navbtn .idx{display:none;}
  .main{padding:18px 16px 50px;}
}
@media(max-width:820px){
  .kpis,.g2,.g3,.search-row,.stat-strip,.board{grid-template-columns:1fr;}
  .tlvl{flex-basis:150px;}
}
@media(max-width:560px){
  .navbtn .nt{display:none;}
  .navbtn{padding:9px 11px;}
  .kpis{grid-template-columns:1fr 1fr;}
}
@media(max-width:390px){.kpis{grid-template-columns:1fr;}}
/*polish094*/.board{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))!important;gap:12px}.col .tag,.col .pill,.col .chip,.col span[class*="t-"]{white-space:nowrap}</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div><b>產品追溯管理</b><span>TRACEABILITY MGMT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br/>v094 · 品保 / 生產 / 倉儲</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scTitle">原料批號綁定</h1>
        <div class="crumb" id="scCrumb">產品追溯管理 / 模組</div>
      </div>
      <div class="pill"><span class="material-symbols-outlined" style="font-size:16px;color:var(--ok)">circle</span> 系統連線正常 · MES / ERP / WMS 同步</div>
    </div>
    <div id="screen" class="grid"></div>
  </main>
</div>
<script>
"use strict";
var NAV=[
  {icon:"inventory_2",label:"原料批號綁定",title:"原料批號綁定",crumb:"原料入庫 / 收料綁定"},
  {icon:"account_tree",label:"製程履歷樹",title:"製程履歷樹",crumb:"批次序號 / 製程履歷"},
  {icon:"precision_manufacturing",label:"成品序號生成",title:"成品序號生成",crumb:"完工入庫 / 序號管理"},
  {icon:"receipt_long",label:"出貨對應登錄",title:"出貨對應登錄",crumb:"揀貨出貨 / 序號對應"},
  {icon:"history",label:"正逆向追溯查詢",title:"正逆向追溯查詢",crumb:"追溯 / 全鏈鑽取"},
  {icon:"shield",label:"批次隔離召回",title:"批次隔離召回",crumb:"品保 / 隔離與召回"}
];
var chartRegistry={};
function ic(n){return '<span class="material-symbols-outlined">'+n+'</span>';}
function disposeCharts(){for(var k in chartRegistry){try{chartRegistry[k].dispose();}catch(e){}}chartRegistry={};}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=echarts.init(el);c.setOption(opt);chartRegistry[id]=c;}catch(e){}}

/* ---------- data ---------- */
var MAT=[
  {lot:"RM-2408-A417",mat:"鋁合金板 6061-T6",sup:"晶鋼金屬",qty:"1,200 kg",loc:"A-03-12",date:"08/12 09:14",coa:"ok",st:"已綁定"},
  {lot:"RM-2408-C902",mat:"環氧樹脂 EP-330",sup:"宏達化工",qty:"480 kg",loc:"C-01-05",date:"08/12 10:02",coa:"ok",st:"已綁定"},
  {lot:"RM-2408-B155",mat:"鋰電芯 21700",sup:"力泰能源",qty:"8,000 pcs",loc:"B-02-08",date:"08/12 11:31",coa:"warn",st:"待檢"},
  {lot:"RM-2408-D671",mat:"PCB 基板 FR4",sup:"聯茂電子",qty:"3,500 pcs",loc:"A-05-02",date:"08/12 13:47",coa:"ok",st:"已綁定"},
  {lot:"RM-2408-E230",mat:"導熱矽膠 TIM-9",sup:"信越化學",qty:"260 kg",loc:"C-03-11",date:"08/12 14:20",coa:"bad",st:"隔離"},
  {lot:"RM-2408-F088",mat:"不鏽鋼螺絲 M3",sup:"世豐緊固",qty:"52,000 pcs",loc:"B-04-19",date:"08/12 15:05",coa:"ok",st:"已綁定"}
];
var PROC=[
  {op:"OP10 裁切",eq:"CNC-07",mat:"RM-2408-A417",param:"進給 320mm/min",oper:"陳志明",time:"08/13 08:12",st:"ok"},
  {op:"OP20 CNC 加工",eq:"MC-12",mat:"RM-2408-A417",param:"轉速 8,600 rpm",oper:"林佩珊",time:"08/13 09:40",st:"ok"},
  {op:"OP30 電芯組裝",eq:"AL-03",mat:"RM-2408-B155",param:"內阻 18.2 mΩ",oper:"王建華",time:"08/13 11:05",st:"warn"},
  {op:"OP40 SMT 貼片",eq:"SMT-05",mat:"RM-2408-D671",param:"回流 245°C",oper:"張雅婷",time:"08/13 13:22",st:"ok"},
  {op:"OP50 灌膠固化",eq:"PU-02",mat:"RM-2408-C902",param:"固化 4h @60°C",oper:"李國樑",time:"08/13 15:48",st:"ok"},
  {op:"OP60 終檢",eq:"FT-09",mat:"—",param:"氣密 3.2 kPa",oper:"品保-趙敏",time:"08/13 17:10",st:"ok"}
];
var SN=[
  {sn:"SN-EV24081300127",model:"EVX-200 電池模組",wo:"WO-24-0813-07",bat:"BAT-0813-A",qc:"合格",time:"08/13 17:31"},
  {sn:"SN-EV24081300128",model:"EVX-200 電池模組",wo:"WO-24-0813-07",bat:"BAT-0813-A",qc:"合格",time:"08/13 17:33"},
  {sn:"SN-EV24081300129",model:"EVX-200 電池模組",wo:"WO-24-0813-07",bat:"BAT-0813-A",qc:"複判",time:"08/13 17:35"},
  {sn:"SN-EV24081300130",model:"EVX-200 電池模組",wo:"WO-24-0813-08",bat:"BAT-0813-B",qc:"合格",time:"08/13 17:40"},
  {sn:"SN-EV24081300131",model:"EVX-200 電池模組",wo:"WO-24-0813-08",bat:"BAT-0813-B",qc:"不合格",time:"08/13 17:44"},
  {sn:"SN-EV24081300132",model:"EVX-200 電池模組",wo:"WO-24-0813-08",bat:"BAT-0813-B",qc:"合格",time:"08/13 17:47"}
];
var SHIP=[
  {so:"SO-2408-3391",cust:"泰達汽車",sn:"SN-EV24081300127~130",qty:"4",dest:"台中廠",ship:"08/14 09:00",st:"已出貨"},
  {so:"SO-2408-3392",cust:"綠動能源",sn:"SN-EV24081200088~095",qty:"8",dest:"高雄倉",ship:"08/14 10:30",st:"已出貨"},
  {so:"SO-2408-3393",cust:"新普科技",sn:"SN-EV24081300132",qty:"1",dest:"桃園廠",ship:"08/14 13:00",st:"備貨中"},
  {so:"SO-2408-3388",cust:"泰達汽車",sn:"SN-EV24081100210~225",qty:"16",dest:"台中廠",ship:"08/13 08:00",st:"已簽收"},
  {so:"SO-2408-3390",cust:"欣運物流",sn:"SN-EV24081200340~347",qty:"8",dest:"新竹倉",ship:"08/13 16:00",st:"已簽收"}
];

/* ---------- screens ---------- */
function scr0(){
  var rows=MAT.map(function(m){
    var coa=m.coa==="ok"?'<span class="tag t-ok">COA 合格</span>':m.coa==="warn"?'<span class="tag t-warn">待覆核</span>':'<span class="tag t-bad">不符</span>';
    var st=m.st==="已綁定"?'t-info':m.st==="待檢"?'t-warn':'t-bad';
    return '<tr><td class="mono">'+m.lot+'</td><td>'+m.mat+'</td><td>'+m.sup+'</td><td class="mono">'+m.qty+'</td><td class="mono">'+m.loc+'</td><td>'+coa+'</td><td><span class="tag '+st+'">'+m.st+'</span></td><td class="mono" style="color:var(--sub)">'+m.date+'</td></tr>';
  }).join("");
  return ''+
  '<div class="grid kpis">'+
    kpi("inventory_2","今日收料批次","28","批","up","+6 較昨日")+
    kpi("qr_code_2","已完成綁定","26","批","up","93% 綁定率")+
    kpi("pending_actions","待檢/待覆核","3","批","flat","COA 審核中")+
    kpi("block","隔離批次","1","批","down","導熱矽膠 TIM-9")+
  '</div>'+
  '<div class="grid g3">'+
    '<div class="card"><h3>'+ic("qr_code_scanner")+'原物料收料綁定作業</h3><div class="sub">掃描供應商批號，綁定內部料號、儲位與 COA 品質文件</div>'+
      '<div class="search-row" style="margin-bottom:14px">'+
        '<div class="fld"><label>掃描 / 輸入供應商批號</label><div class="inp">'+ic("barcode_scanner")+'RM-2408-A417 · 晶鋼金屬</div></div>'+
        '<button class="btn">'+ic("link")+'綁定入庫</button>'+
      '</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>批號</th><th>物料</th><th>供應商</th><th>數量</th><th>儲位</th><th>COA</th><th>狀態</th><th>收料時間</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="card"><h3>'+ic("factory")+'供應商入料佔比</h3><div class="sub">本週各供應商批次數</div><div id="c0a" class="chart sm"></div></div>'+
  '</div>';
}
function scr1(){
  var proc=PROC.map(function(p){
    var cls=p.st==="ok"?"ok":p.st==="warn"?"warn":"bad";
    var tg=p.st==="ok"?'<span class="tag t-ok">正常</span>':p.st==="warn"?'<span class="tag t-warn">參數警示</span>':'<span class="tag t-bad">異常</span>';
    return '<div class="tli '+cls+'"><div class="dot"></div><div class="th">'+p.op+' '+tg+'</div>'+
      '<div class="tmeta">設備 '+p.eq+' · 作業員 '+p.oper+' · '+p.time+'</div>'+
      '<div class="tsub">用料批號 <b class="mono">'+p.mat+'</b> · 製程參數 '+p.param+'</div></div>';
  }).join("");

/* ---------- helpers ---------- */
function kpi(icon,lab,val,unit,dir,note){
  var dc=dir==="up"?"up":dir==="down"?"down":"flat";
  var arw=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="card kpi"><div class="lab">'+ic(icon)+lab+'</div><div class="val">'+val+'<small>'+unit+'</small></div><span class="dt '+dc+'">'+ic(arw)+note+'</span></div>';
}
function mini(l,v){return '<div class="mini"><div class="ml">'+l+'</div><div class="mv mono">'+v+'</div></div>';}
function treeRow(cls,icon,title,meta,next){
  var conn=next?'<div class="tconn">'+ic(next)+'</div>':'';
  return '<div class="trow"><div class="tlvl"><div class="tnode '+cls+'"><div class="tt">'+ic(icon)+title+'</div><div class="tm">'+meta+'</div></div></div>'+conn+'</div>';
}
function chk(on,txt){
  return '<div class="chk"><div class="box'+(on?' on':'')+'">'+(on?ic("check"):"")+'</div><span style="'+(on?'color:var(--sub);text-decoration:line-through':'')+'">'+txt+'</span></div>';
}

/* ---------- render ---------- */
var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  var n=NAV.length;
  if(i<0)i=0;if(i>n-1)i=n-1;
  disposeCharts();
  var meta=NAV[i];
  document.getElementById("scTitle").textContent=meta.title;
  document.getElementById("scCrumb").textContent="產品追溯管理 / "+meta.crumb;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  void container.offsetHeight;
  initCharts(i);
}
(function buildNav(){
  var nav=document.getElementById("nav");
  var html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button class="navbtn" data-i="'+i+'">'+ic(NAV[i].icon)+'<span class="nt">'+NAV[i].label+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var k=+this.getAttribute("data-i");show(k);try{history.replaceState(null,"","#go="+k);}catch(e){}});
  }
})();
window.addEventListener("resize",function(){for(var k in chartRegistry){try{chartRegistry[k].resize();}catch(e){}}});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
