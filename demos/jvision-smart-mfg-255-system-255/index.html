<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>技術文件管理系統 | JVision Demo</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
/* Organic Biophilic · dense research dashboard */
:root{
  --color-primary:#15803d;
  --color-on-primary:#fff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#fff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#15803d;

  /* External interface variables — names must remain stable. */
  --blue:#15803d;
  --ink:#163b29;
  --muted:#52645d;
  --line:#c9e8d3;

  --red:#dc2626;
  --red-d:#b91c1c;
  --org:#d97706;
  --org-d:#b45309;
  --bg:#f0fdf4;
  --card:#fff;
  --ok:#15803d;
  --warn:#b45309;
  --info:#2563eb;
  --purple:#7c3aed;
  --shadow-sm:0 2px 8px rgba(20,83,45,.06);
  --shadow-md:0 12px 30px rgba(20,83,45,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Exo","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 3%,rgba(34,197,94,.13),transparent 25rem),
    radial-gradient(circle at 92% 30%,rgba(217,119,6,.07),transparent 22rem),
    linear-gradient(180deg,#f7fff9 0,var(--color-background) 48%,#edf9f1 100%);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit}
button{cursor:pointer}
::selection{color:#052e16;background:#bbf7d0}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:'liga';
  -webkit-font-feature-settings:'liga';
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:var(--color-on-primary);
  background:linear-gradient(112deg,#0d592b 0%,#15803d 54%,#1b6e39 100%);
  border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 8px 24px rgba(20,83,45,.17);
}
.topbar:after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:3px;
  background:linear-gradient(90deg,var(--color-secondary),#86efac,var(--color-accent));
}
.topbar-inner{
  display:flex;
  align-items:center;
  gap:18px;
  max-width:1440px;
  min-width:0;
  margin:0 auto;
  padding:11px 22px 14px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:250px}
.brand .logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:0 0 42px;
  color:#fff;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);
  border-radius:55% 45% 58% 42% / 43% 58% 42% 57%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.brand .logo .ms{font-size:23px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand span{display:block;font-size:11px;font-weight:500;letter-spacing:.02em;opacity:.83}
.nav{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;margin-left:auto}
.nav button{
  display:flex;
  align-items:center;
  gap:6px;
  min-height:40px;
  padding:8px 11px;
  color:#f0fdf4;
  background:rgba(255,255,255,.08);
  border:1px solid transparent;
  border-radius:14px 10px 14px 10px;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.nav button:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.nav button.on{color:#14532d;background:#fff;border-color:#dcfce7;box-shadow:0 5px 14px rgba(5,46,22,.18)}
.nav button .ms{font-size:18px}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #fbbf24;
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(255,255,255,.8);
}
main{max-width:1440px;margin:0 auto;padding:22px}
#app{animation:chapter-in .36s ease-out both}
.screen-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  min-width:0;
  margin:2px 0 18px;
  padding:0 2px;
  flex-wrap:wrap;
}
.screen-head h1{display:flex;align-items:center;gap:10px;margin:0;color:#123d27;font-size:23px;font-weight:700;letter-spacing:-.015em}
.screen-head h1 .ms{display:grid;place-items:center;width:38px;height:38px;color:var(--color-primary);background:#dcfce7;border:1px solid var(--color-border);border-radius:55% 45% 60% 40% / 45% 60% 40% 55%;font-size:22px}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:12.5px;font-weight:500}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 12px;
  color:#274b38;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:999px;
  box-shadow:var(--shadow-sm);
  font-family:"Roboto Mono","Noto Sans TC",monospace;
  font-size:11.5px;
  font-weight:600;
}
.pill .ms{font-size:16px}
.card{
  min-width:0;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:20px 16px 22px 16px;
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.card:hover{border-color:#91d6a8;box-shadow:var(--shadow-md)}
.card.pad,.pad{padding:16px}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
  padding:13px 16px;
  background:linear-gradient(90deg,rgba(240,253,244,.9),rgba(255,255,255,.96));
  border-bottom:1px solid var(--line);
}
.card-h h3{display:flex;align-items:center;gap:7px;margin:0;color:#18492f;font-size:14.5px;font-weight:700}
.card-h h3 .ms{color:var(--color-primary);font-size:19px}
.card-h .sub{color:var(--muted);font-size:11.5px;font-weight:500}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-board{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-cls{grid-template-columns:300px minmax(0,1fr)}
.kpi{position:relative;padding:15px 16px 14px;overflow:hidden}
.kpi:after{content:"";position:absolute;top:-22px;right:-18px;width:74px;height:74px;background:rgba(34,197,94,.07);border-radius:60% 40% 54% 46% / 42% 60% 40% 58%;pointer-events:none}
.kpi .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:600}
.kpi .lbl .ms{color:#3b7251;font-size:17px}
.kpi .val{margin-top:5px;color:#123d27;font-family:"Roboto Mono","Noto Sans TC",monospace;font-size:26px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .dt{margin-top:3px;font-size:11.5px;font-weight:600}
.up{color:#166534}.down{color:#b91c1c}
.kpi .bar{height:5px;margin-top:10px;background:#e5eee8;border-radius:999px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:999px}
.board-col{min-width:0;padding:10px;background:#f5faf6;border:1px solid #d7eddd;border-radius:16px 12px 18px 12px}
.board-col h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:#284d38;font-size:12.5px;font-weight:700}
.board-col h4 .cnt{padding:1px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-family:"Roboto Mono",monospace;font-size:11px;font-variant-numeric:tabular-nums}
.docard{margin-bottom:8px;padding:10px 10px 10px 11px;background:#fff;border:1px solid #dcebe1;border-left:4px solid var(--color-primary);border-radius:10px 14px 10px 14px;box-shadow:0 2px 5px rgba(20,83,45,.035);cursor:default;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.docard:hover{transform:translateY(-2px);border-color:#9dd9b0;box-shadow:0 7px 16px rgba(20,83,45,.09)}
.docard:last-child{margin-bottom:0}
.docard .dt{font-size:12.5px;font-weight:700;line-height:1.4}
.docard .dno{margin-top:3px;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px;font-variant-numeric:tabular-nums}
.docard .drow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag,.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;font-size:10.5px;font-weight:700;line-height:1.4}
.tag{padding:2px 7px;border-radius:7px 10px 7px 10px}
.chip{padding:3px 9px;border-radius:999px}
.tag .ms{font-size:13px}
.av{display:inline-grid;place-items:center;width:23px;height:23px;color:#fff;background:linear-gradient(135deg,#166534,#22c55e);border:1px solid rgba(20,83,45,.1);border-radius:60% 40% 55% 45%;font-size:10px;font-weight:700}
.t-blue{color:#1e40af;background:#e8f0ff;border-color:#bfdbfe}
.t-org{color:#92400e;background:#fff4de;border-color:#fed7aa}
.t-grn{color:#166534;background:#e5f8ea;border-color:#bbf7d0}
.t-red{color:#991b1b;background:#feecec;border-color:#fecaca}
.t-pur{color:#5b21b6;background:#f2ebff;border-color:#ddd6fe}
.t-gray{color:#46574f;background:#edf2ef;border-color:#d7e0db}
.t-warn{color:#854d0e;background:#fef3c7;border-color:#fde68a}
.scroll{max-width:100%;overflow-x:auto;scrollbar-color:#86c89d #edf7f0}
table{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{padding:10px 12px;color:#486258;background:#f2f9f4;border-bottom:2px solid #b7dfc4;font-size:10.5px;font-weight:700;letter-spacing:.045em;text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #deebe2;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover td{background:#f2faf4}
td:nth-last-child(-n+2){font-variant-numeric:tabular-nums}
.mono,.ver,.tm,.rm,.kbd{font-family:"Roboto Mono","Noto Sans TC",monospace;font-variant-numeric:tabular-nums}
.mono{font-weight:600}
.ver{display:inline-block;padding:2px 7px;color:#315040;background:#eef5f0;border:1px solid #d8e8dd;border-radius:6px;font-size:11px;font-weight:700}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:2px;background:linear-gradient(var(--color-primary),#bbf7d0)}
.tli{position:relative;padding:0 0 17px}
.tli:last-child{padding-bottom:0}
.tli .dot{position:absolute;top:1px;left:-27px;display:grid;place-items:center;width:20px;height:20px;color:#4b5563;background:#fff;border:3px solid #64748b;border-radius:50%}
.tli .dot.ok{color:#166534;border-color:#15803d}
.tli .dot.wait{color:#92400e;border-color:#d97706}
.tli .dot.rej{color:#991b1b;border-color:#dc2626}
.tli .dot .ms{font-size:10px}
.tli .tt{font-size:12.5px;font-weight:700}
.tli .tm{margin-top:2px;color:var(--muted);font-size:10.5px}
.tli .tx{margin-top:3px;color:#425c4e;font-size:12px}
.diff{min-width:420px;overflow:hidden;border:1px solid var(--line);border-radius:13px;font-family:"Roboto Mono",monospace;font-size:11.5px}
.diff .dl{display:flex;border-bottom:1px solid #e4eee7}
.diff .dl:last-child{border-bottom:0}
.diff .gut{width:40px;flex:0 0 40px;padding:5px 8px;color:#64748b;background:#f4f8f5;text-align:right;user-select:none;font-size:10px;font-variant-numeric:tabular-nums}
.diff .cnt2{flex:1;min-width:0;padding:5px 10px;white-space:pre-wrap;word-break:break-word}
.diff .add{color:#14532d;background:#e5f8ea;border-left:3px solid #15803d}
.diff .add .gut{background:#d4f1dc}
.diff .del{color:#7f1d1d;background:#feecec;border-left:3px solid #dc2626;text-decoration-color:#b91c1c}
.diff .del .gut{background:#fbd8d8}
.tree{font-size:12.5px}
.tnode{display:flex;align-items:center;gap:8px;margin-bottom:3px;padding:7px 9px;border:1px solid transparent;border-radius:9px 13px 9px 13px;cursor:default;transition:background-color .18s ease,border-color .18s ease}
.tnode:hover{background:#f0f9f3;border-color:#d3ebda}
.tnode.sel{color:#166534;background:#e5f8ea;border-color:#a7dfb9;font-weight:700}
.tnode .ms{color:#b45309;font-size:17px}
.tnode .cc{margin-left:auto;padding:1px 7px;color:var(--muted);background:#edf3ef;border-radius:999px;font-family:"Roboto Mono",monospace;font-size:10px;font-variant-numeric:tabular-nums}
.tnode.ind1{margin-left:18px}.tnode.ind2{margin-left:36px}
.searchbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:2px solid var(--color-primary);border-radius:18px 13px 20px 13px;box-shadow:0 7px 20px rgba(21,128,61,.1)}
.searchbar .ms{color:var(--color-primary);font-size:22px}
.searchbar input{min-width:0;flex:1;color:var(--ink);background:transparent;border:0;outline:0;font-size:14.5px}
.searchbar .kbd{padding:2px 7px;color:#52645d;background:#f2f7f3;border:1px solid var(--line);border-radius:6px;font-size:10px}
.res{display:flex;gap:12px;min-width:0;padding:12px 14px;border-bottom:1px solid var(--line);transition:background-color .18s ease}
.res:hover{background:#f5fbf6}
.res:last-child{border-bottom:0}
.res .ic{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;color:#166534;background:#e4f7e9;border:1px solid #c4e9ce;border-radius:55% 45% 58% 42% / 44% 58% 42% 56%;font-size:19px}
.res .rt{font-size:13.5px;font-weight:700}
.res .rm{margin-top:2px;color:var(--muted);font-size:10.5px}
.res .rd{margin-top:5px;color:#425c4e;font-size:12px}
.res mark{padding:0 2px;color:#713f12;background:#fef3c7;border-radius:3px;font-weight:700}
.facet{display:flex;flex-wrap:wrap;gap:7px}
.facet button{min-height:34px;padding:5px 11px;color:#415a4c;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11.5px;font-weight:600;transition:color .18s ease,background-color .18s ease,border-color .18s ease,transform .18s ease}
.facet button:hover{color:#166534;background:#f0fdf4;border-color:#86c99c;transform:translateY(-1px)}
.facet button.on{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.perm{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.perm:last-child{border-bottom:0}
.perm .rn{font-size:13px;font-weight:700}
.perm .rr,.rr{color:var(--muted);font-size:10.5px}
.toggle{position:relative;width:38px;height:22px;flex:0 0 38px;background:#cbd5d1;border:1px solid #aab8b1;border-radius:999px;cursor:default}
.toggle:after{content:"關";position:absolute;right:4px;top:3px;color:#3f5048;font-size:8px;font-weight:700}
.toggle.on{background:#15803d;border-color:#166534}
.toggle.on:after{content:"開";right:auto;left:4px;color:#fff}
.toggle i{position:absolute;top:2px;left:2px;z-index:1;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:left .2s ease}
.toggle.on i{left:18px}
.audit-row .ms{font-size:16px}
.note{display:flex;align-items:flex-start;gap:6px;margin-top:8px;color:var(--muted);font-size:11.5px}
.note .ms{flex:0 0 auto;margin-top:2px;color:#356b4b;font-size:14px}
.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border:1px solid rgba(15,23,42,.16);border-radius:50%;vertical-align:-1px}
.stat-mini{display:flex;align-items:center;gap:8px;padding-top:6px}
.stat-mini .b{height:8px;flex:1;overflow:hidden;background:#e4ece7;border-radius:999px}
.stat-mini .b i{display:block;height:100%;border-radius:999px}
.chartbox{min-width:0;overflow:hidden}
.apexcharts-text,.apexcharts-legend-text{font-family:"Exo","Noto Sans TC",sans-serif!important;fill:#476052}
.apexcharts-tooltip{border-color:var(--line)!important;box-shadow:var(--shadow-md)!important}
.footer-note{padding:20px 0 7px;color:#587064;text-align:center;font-size:11.5px}
@keyframes chapter-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1180px){
  .topbar-inner{align-items:flex-start;flex-wrap:wrap}
  .nav{width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .g-board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .topbar-inner{padding:10px 14px 12px}
  main{padding:16px 14px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-2e,.g-3,.g-cls{grid-template-columns:1fr}
  .screen-head{align-items:flex-start}
  .screen-head h1{font-size:20px}
}
@media(max-width:560px){
  body{font-size:13px}
  .brand{min-width:0}
  .brand span{display:none}
  .nav{gap:5px}
  .nav button{min-width:42px;justify-content:center;padding:8px 10px}
  .nav button span.tx{display:none}
  main{padding:13px 10px}
  .screen-head{margin-bottom:13px}
  .screen-head h1 .ms{width:34px;height:34px}
  .pill{width:100%;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-kpi,.g-board{grid-template-columns:1fr}
  .grid{gap:10px}
  .card{border-radius:16px 13px 18px 13px}
  .card.pad,.pad{padding:13px}
  .card-h{padding:12px 13px}
  .kpi{padding:13px 14px}
  .kpi .val{font-size:24px}
  .perm{align-items:flex-start;flex-direction:column}
  .perm>div:last-child{margin-left:0!important;width:100%;justify-content:flex-end}
  .searchbar{padding:9px 11px}
  .searchbar .kbd{display:none}
  .tnode.ind1{margin-left:12px}.tnode.ind2{margin-left:24px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #app{animation:none;opacity:1;transform:none}
  .nav button:hover,.docard:hover,.facet button:hover{transform:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="ms">description</span></div>
      <div><b>技術文件管理系統</b><span>TechDoc Control Platform · 研發管理</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main>
  <div id="app"></div>
  <div class="footer-note">JVision 純前端展示 · 假資料僅供介面演示 · 技術文件版本控制 / 簽核 / 檢索 / 稽核</div>
</main>
<script>
"use strict";
var charts=[];
function destroyCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function el(id){ return document.getElementById(id); }

function head(m,extra){
  return '<div class="screen-head"><div><h1><span class="ms">'+m.icon+'</span>'+esc(m.name)+'</h1><p>'+esc(m.sub)+'</p></div>'+(extra||'')+'</div>';
