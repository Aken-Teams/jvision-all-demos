<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>技術文件管理系統 | JVision Demo</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --red:#dc2626; --red-d:#b91c1c; --org:#f97316; --org-d:#ea580c;
  --ink:#1f2430; --muted:#6b7280; --line:#e8e9ee; --bg:#f4f5f7; --card:#ffffff;
  --ok:#16a34a; --warn:#f59e0b; --info:#2563eb; --purple:#7c3aed;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';}
.topbar{
  position:sticky; top:0; z-index:50; background:linear-gradient(90deg,#7f1d1d,#dc2626 55%,#f97316);
  color:#fff; box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.topbar-inner{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1360px;margin:0 auto;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{display:block;font-size:11px;opacity:.85;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{
  display:flex;align-items:center;gap:6px;border:0;cursor:pointer;
  background:rgba(255,255,255,.12);color:#fff;padding:8px 12px;border-radius:9px;
  font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;
}
.nav button:hover{background:rgba(255,255,255,.25)}
.nav button.on{background:#fff;color:var(--red-d)}
.nav button .ms{font-size:19px}
main{max-width:1360px;margin:0 auto;padding:18px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;min-width:0}
.screen-head h1{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h1 .ms{color:var(--red);font-size:26px}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.pill .ms{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(20,20,40,.04);min-width:0}
.card.pad{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);min-width:0}
.card-h h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-h h3 .ms{font-size:19px;color:var(--red)}
.card-h .sub{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:2fr 1fr}
.g-2e{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-board{grid-template-columns:repeat(4,1fr)}
.g-cls{grid-template-columns:300px 1fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-2e,.g-3,.g-board,.g-cls{grid-template-columns:1fr}
}
.kpi{padding:15px 16px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .ms{font-size:17px}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .dt{font-size:12px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--red)}
.kpi .bar{height:5px;border-radius:4px;background:#eee;margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px}
.board-col{background:#f7f7f9;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.board-col h4{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.board-col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--muted)}
.docard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;border-left:4px solid var(--red);cursor:default}
.docard:last-child{margin-bottom:0}
.docard .dt{font-size:13px;font-weight:700;line-height:1.35}
.docard .dno{font-size:11px;color:var(--muted);font-family:Inter;margin-top:2px}
.docard .drow{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.tag .ms{font-size:13px}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--org));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.t-blue{background:#e0edff;color:#1d4ed8}.t-org{background:#fff0e0;color:#c2410c}.t-grn{background:#e3f6e9;color:#15803d}
.t-red{background:#fde5e5;color:#b91c1c}.t-pur{background:#efe6fd;color:#6d28d9}.t-gray{background:#eef0f3;color:#4b5563}
.t-warn{background:#fef3c8;color:#a16207}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fafafb}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fafafb}
.scroll{overflow-x:auto}
.mono{font-family:Inter;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.ver{font-family:Inter;font-weight:700;font-size:12px;background:#f1f2f5;border-radius:6px;padding:2px 7px}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px}
.tli:last-child{padding-bottom:0}
.tli .dot{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--red);display:flex;align-items:center;justify-content:center}
.tli .dot.ok{border-color:var(--ok)} .tli .dot.wait{border-color:var(--warn)} .tli .dot.rej{border-color:var(--red)}
.tli .dot .ms{font-size:11px;color:var(--red)}
.tli .tt{font-size:13px;font-weight:700}
.tli .tm{font-size:11.5px;color:var(--muted);font-family:Inter}
.tli .tx{font-size:12.5px;color:#4b5563;margin-top:3px}
.diff{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:420px}
.diff .dl{display:flex;gap:0;border-bottom:1px solid #f0f0f3}
.diff .dl:last-child{border-bottom:0}
.diff .gut{width:38px;flex:0 0 38px;text-align:right;padding:4px 8px;color:#9aa0aa;background:#fafafb;user-select:none;font-size:11px}
.diff .cnt2{padding:4px 10px;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.diff .add{background:#e7f8ec}.diff .add .gut{background:#d3f0dc}
.diff .del{background:#fdecec}.diff .del .gut{background:#f8d7d7}
.tree{font-size:13.5px}
.tnode{padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:default;margin-bottom:3px}
.tnode:hover{background:#f7f7f9}
.tnode.sel{background:#fef2f2;color:var(--red-d);font-weight:700}
.tnode .ms{font-size:18px;color:var(--org)}
.tnode .cc{margin-left:auto;font-size:11px;color:var(--muted);background:#f1f2f5;border-radius:20px;padding:1px 8px}
.tnode.ind1{margin-left:20px}.tnode.ind2{margin-left:40px}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--red);border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px rgba(220,38,38,.08)}
.searchbar .ms{font-size:22px;color:var(--red)}
.searchbar input{border:0;outline:0;flex:1;font-family:inherit;font-size:15px;background:transparent;min-width:0}
.searchbar .kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);font-family:Inter}
.res{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);min-width:0}
.res:last-child{border-bottom:0}
.res .ic{width:38px;height:38px;flex:0 0 38px;border-radius:9px;background:#fef2f2;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:20px}
.res .rt{font-size:14px;font-weight:700}
.res .rt mark{background:#fff3cd;color:inherit;border-radius:3px;padding:0 2px}
.res .rm{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:Inter}
.res .rd{font-size:12.5px;color:#4b5563;margin-top:5px}
.res .rd mark{background:#fff3cd;color:inherit;border-radius:3px;padding:0 2px}
.facet{display:flex;flex-wrap:wrap;gap:7px}
.facet button{border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:20px;padding:5px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.facet button.on{background:var(--red);color:#fff;border-color:var(--red)}
.perm{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.perm:last-child{border-bottom:0}
.perm .rn{font-weight:700;font-size:13.5px}.perm .rr{font-size:11.5px;color:var(--muted)}
.toggle{width:38px;height:22px;border-radius:20px;background:#dcdde2;position:relative;flex:0 0 38px;cursor:default}
.toggle.on{background:var(--ok)}
.toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{left:18px}
.audit-row .ms{font-size:16px}
.note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:8px}
.note .ms{font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.stat-mini{display:flex;gap:8px;align-items:center;padding:6px 0 0}
.stat-mini .b{flex:1;height:8px;border-radius:5px;background:#eee;overflow:hidden}
.stat-mini .b i{display:block;height:100%}
.chartbox{overflow:hidden;min-width:0}
.footer-note{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 6px}
@media(max-width:560px){ .nav button span.tx{display:none} .nav button{padding:8px 10px} .brand span{display:none} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="ms">description</span></div>
      <div><b>技術文件管理系統</b><span>TechDoc Control Platform · 研發管理</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main>
  <div id="app"></div>
  <div class="footer-note">JVision 純前端展示 · 假資料僅供介面演示 · 技術文件版本控制 / 簽核 / 檢索 / 稽核</div>
</main>
<script>
"use strict";
var charts=[];
function destroyCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[ch];}); }

var MODS=[
  {icon:"dashboard",name:"文件總覽看板",sub:"待簽核 / 修訂中 / 有效版本一覽"},
  {icon:"history",name:"版本控制與比對",sub:"版次歷程與差異比對"},
  {icon:"fact_check",name:"簽核流程",sub:"多關卡電子簽核追蹤"},
  {icon:"account_tree",name:"分類與權限",sub:"分類樹與角色權限管控"},
  {icon:"search",name:"全文檢索與關聯",sub:"全文搜尋與料號關聯"},
  {icon:"shield",name:"稽核與合規",sub:"存取軌跡與稽核報表"}
];

function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="ms">'+MODS[i].icon+'</span><span class="tx">'+esc(MODS[i].name)+'</span></button>';
  }
  el("nav").innerHTML=h;
}

function head(m,extra){
  return '<div class="screen-head"><div><h1><span class="ms">'+m.icon+'</span>'+esc(m.name)+'</h1><p>'+esc(m.sub)+'</p></div>'+(extra||'')+'</div>';
}
function kpi(lbl,icon,val,dt,dir,col,pct){
  return '<div class="card kpi"><div class="lbl"><span class="ms">'+icon+'</span>'+lbl+'</div><div class="val">'+val+'</div><div class="dt '+dir+'">'+dt+'</div><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div></div>';
}

/* SCREEN 0 : 文件總覽看板 */
function s0(c){
  var extra='<span class="pill"><span class="ms" style="color:var(--red)">calendar_today</span>2026-08-14 · 生管廠</span>';
  var cols=[
    {t:"草擬 / 修訂中",cnt:5,acc:"#9ca3af",items:[
      {t:"注塑機夾模力校正作業指導書",no:"WI-INJ-0421",v:"v0.3",tc:"t-gray",tl:"草擬",ti:"edit_note",who:"陳"},
      {t:"CNC 刀具壽命管理規範",no:"SP-CNC-0188",v:"v2.1-d",tc:"t-org",tl:"修訂中",ti:"history",who:"林"},
      {t:"表面處理鍍層厚度標準",no:"SP-SUR-0093",v:"v1.4-d",tc:"t-org",tl:"修訂中",ti:"history",who:"黃"}
    ]},
    {t:"待簽核",cnt:4,acc:"#f59e0b",items:[
      {t:"新產品 A72 外殼設計圖說",no:"DR-A72-0011",v:"v3.0",tc:"t-warn",tl:"待技術長核准",ti:"pending",who:"王"},
      {t:"SMT 迴焊溫度曲線標準",no:"SP-SMT-0245",v:"v2.0",tc:"t-warn",tl:"會簽中",ti:"group",who:"李"},
      {t:"物料進料檢驗規範 IQC",no:"SP-IQC-0077",v:"v4.2",tc:"t-warn",tl:"待研發經理",ti:"pending",who:"周"}
    ]},
    {t:"有效版本",cnt:128,acc:"#16a34a",items:[
      {t:"沖壓模具維護保養手冊",no:"MN-STP-0032",v:"v5.0",tc:"t-grn",tl:"現行有效",ti:"verified",who:"張"},
      {t:"ESD 靜電防護作業標準",no:"SP-ESD-0009",v:"v3.1",tc:"t-grn",tl:"現行有效",ti:"verified",who:"吳"},
      {t:"組裝線扭力管理規範",no:"SP-ASM-0156",v:"v2.4",tc:"t-grn",tl:"現行有效",ti:"verified",who:"蔡"}
    ]},
    {t:"即將到期複審",cnt:3,acc:"#dc2626",items:[
      {t:"危害物質 RoHS 管制清單",no:"CL-RHS-0002",v:"v6.0",tc:"t-red",tl:"5 日內到期",ti:"event_busy",who:"許"},
      {t:"焊接製程參數標準書",no:"SP-WLD-0128",v:"v3.3",tc:"t-red",tl:"逾期複審",ti:"warning",who:"鄭"}
    ]}
  ];
  var board="";
  for(var i=0;i<cols.length;i++){
    var col=cols[i]; var cards="";
    for(var j=0;j<col.items.length;j++){
      var it=col.items[j];
      cards+='<div class="docard" style="border-left-color:'+col.acc+'">'+
        '<div class="dt">'+esc(it.t)+'</div><div class="dno">'+it.no+' · <span class="ver">'+it.v+'</span></div>'+
        '<div class="drow"><span class="tag '+it.tc+'"><span class="ms">'+it.ti+'</span>'+it.tl+'</span><span class="av">'+it.who+'</span></div></div>';
    }
    board+='<div class="board-col"><h4>'+col.t+'<span class="cnt">'+col.cnt+'</span></h4>'+cards+'</div>';
  }
  c.innerHTML=head(MODS[0],extra)+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("文件總數","folder_open","1,842","本月 +36","up","var(--red)",78)+
      kpi("待簽核","pending_actions","4","需 2 日內處理","down","var(--org)",40)+
      kpi("版本錯誤(月)","error","1","去年同期 6.2","up","var(--ok)",16)+
      kpi("平均查找時間","timer","5.1 分","原 32 分 ↓84%","up","var(--info)",84)+
    '</div>'+
    '<div class="grid g-2" style="margin-bottom:14px">'+
      '<div class="card"><div class="card-h"><h3><span class="ms">view_kanban</span>文件狀態看板</h3><span class="sub">依生命週期分欄</span></div>'+
        '<div class="pad"><div class="grid g-board">'+board+'</div></div></div>'+
      '<div class="card"><div class="card-h"><h3><span class="ms">donut_large</span>文件分類佔比</h3></div><div class="pad chartbox"><div id="c0a"></div>'+
        '<div class="legend" style="margin-top:10px"><span><i style="background:var(--red)"></i>作業標準</span><span><i style="background:var(--org)"></i>設計圖說</span><span><i style="background:var(--info)"></i>檢驗規範</span><span><i style="background:var(--purple)"></i>作業手冊</span><span><i style="background:var(--ok)"></i>管制清單</span></div></div></div>'+
    '</div>'+
    '<div class="card"><div class="card-h"><h3><span class="ms">insights</span>近 6 週文件簽核完成量</h3><span class="sub">已核准 / 退回重審</span></div><div class="pad chartbox"><div id="c0b"></div></div></div>';

  void c.offsetHeight;
  charts.push(new ApexCharts(el("c0a"),{
    chart:{type:"donut",height:230,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[642,318,286,412,184],labels:["作業標準","設計圖說","檢驗規範","作業手冊","管制清單"],
    colors:["#dc2626","#f97316","#2563eb","#7c3aed","#16a34a"],
    dataLabels:{enabled:false},legend:{show:false},
    plotOptions:{pie:{donut:{size:"64%",labels:{show:true,total:{show:true,label:"文件總數",fontWeight:700,formatter:function(){return "1,842";}}}}}}
  }));
  charts[charts.length-1].render();
  charts.push(new ApexCharts(el("c0b"),{
    chart:{type:"bar",height:250,stacked:true,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false,toolbar:{show:false}},
    series:[{name:"已核准",data:[18,22,25,21,28,31]},{name:"退回重審",data:[6,5,4,5,3,2]}],
    colors:["#16a34a","#dc2626"],
    plotOptions:{bar:{columnWidth:"45%",borderRadius:4}},dataLabels:{enabled:false},
    xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},
    legend:{position:"top"},tooltip:{shared:true,intersect:false},grid:{borderColor:"#eee"}
  }));
  charts[charts.length-1].render();
}

/* SCREEN 1 : 版本控制與比對 */
function s1(c){
