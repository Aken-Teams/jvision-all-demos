<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>材料資料庫管理系統｜MatDB Control</title>
<meta name="description" content="材料規格與物性資料庫、AVL 核准清單、材料替代方案比對的單一平台"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1116;--panel:#171c24;--panel2:#1f2630;--line:#2a323d;
  --txt:#e7ecf2;--sub:#93a1b3;--muted:#6b7688;
  --acc:#c2410c;--acc2:#fb923c;--acc-soft:rgba(194,65,12,.16);
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;
}
html,body{background:var(--bg);color:var(--txt);font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#12161d,#0e1116);border-bottom:1px solid var(--line)}
.tbrow{display:flex;align-items:center;gap:14px;padding:11px 18px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.logo .material-symbols-outlined{font-size:20px}
.bname{font-weight:800;font-size:15px;letter-spacing:.3px;line-height:1.15}
.bsub{font-size:11px;color:var(--sub);font-weight:500}
.tbstat{margin-left:auto;display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
.livedot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.livedot i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.tbstat .k{font-size:11px;color:var(--muted)}.tbstat .v{font-size:13px;font-weight:700}
.nav{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;background:#0e1116;border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:29}
.nav button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--sub);padding:9px 14px;border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{color:var(--txt);border-color:#3a444f}
.nav button.on{background:var(--acc-soft);color:var(--acc2);border-color:var(--acc)}
.wrap{padding:18px;max-width:1360px;margin:0 auto}
.scr-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap;min-width:0}
.scr-head h1{font-size:20px;font-weight:800;line-height:1.2}
.scr-head p{font-size:13px;color:var(--sub);margin-top:3px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc2);border:1px solid var(--acc)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ctitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:12px;min-width:0}
.ctitle .material-symbols-outlined{font-size:18px;color:var(--acc2)}
.ctitle small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.kpi .kl{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:16px;color:var(--acc2)}
.kpi .kv{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.3px}
.kpi .kv span{font-size:13px;color:var(--sub);font-weight:600}
.kpi .kd{font-size:11px;margin-top:5px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}
.chart.lg{height:300px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.p-ok{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.3)}
.p-warn{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.p-bad{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.3)}
.p-info{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.3)}
.p-acc{background:var(--acc-soft);color:var(--acc2);border-color:var(--acc)}
.p-mut{background:#252c36;color:var(--sub);border-color:var(--line)}
.mini{display:flex;align-items:center;gap:8px;min-width:0}
.mbar{flex:1;height:6px;border-radius:99px;background:#252c36;overflow:hidden;min-width:40px}
.mbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.board{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.col h4 span{font-size:11px;background:#0e1116;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--muted)}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;min-width:0}
.ticket:last-child{margin-bottom:0}
.ticket .t1{font-size:12.5px;font-weight:700;line-height:1.35}
.ticket .t2{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tk-l{width:100%;height:3px;border-radius:99px;margin-bottom:8px}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:"";position:absolute;left:-17px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--acc)}
.tl .ev.mut::before{background:var(--muted);box-shadow:0 0 0 2px var(--muted)}
.tl .et{font-size:11px;color:var(--muted);font-family:monospace}
.tl .eh{font-size:13px;font-weight:700;margin:2px 0 3px}
.tl .ed{font-size:12px;color:var(--sub);line-height:1.5}
.cmp{display:grid;gap:10px}
.cmprow{display:grid;grid-template-columns:110px 1fr 1fr 1fr;gap:10px;align-items:center;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-width:0}
.cmprow.head{background:transparent;border:none;padding:2px 12px}
.cmprow .cl{font-size:12px;color:var(--sub);font-weight:600;min-width:0}
.cmpcell{font-size:13px;font-weight:700;min-width:0}
.cmpcell small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.win{color:#4ade80}
.donut-legend{display:flex;flex-direction:column;gap:8px;justify-content:center}
.dl{display:flex;align-items:center;gap:9px;font-size:12.5px;min-width:0}
.dl i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dlist{display:flex;flex-direction:column;gap:0}
.drow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.drow:last-child{border-bottom:none}
.drow .di{width:34px;height:34px;border-radius:9px;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.drow .di .material-symbols-outlined{font-size:19px;color:var(--acc2)}
.drow .dt{min-width:0;flex:1}
.drow .dt b{font-size:13px;font-weight:700}
.drow .dt small{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}
.drow .dv{font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gau{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.gau .gc{width:100%;height:120px;overflow:hidden}
.gau .gt{font-size:12px;color:var(--sub);font-weight:600;margin-top:4px}
.alert{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--acc-soft),transparent);border:1px solid var(--acc);border-left-width:3px;border-radius:11px;padding:12px 14px;margin-bottom:14px;min-width:0;flex-wrap:wrap}
.alert .material-symbols-outlined{color:var(--acc2);font-size:22px;flex:0 0 auto}
.alert .abody{min-width:0;flex:1}
.alert .at{font-size:13px;font-weight:700}
.alert .ad{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.alert .ax{font-size:12px;font-weight:700;color:var(--acc2);border:1px solid var(--acc);border-radius:8px;padding:6px 11px;white-space:nowrap;flex:0 0 auto}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#252c36;color:var(--sub);margin-right:4px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;padding:22px 12px 30px;line-height:1.7}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .gauges{grid-template-columns:1fr}
  .cmprow{grid-template-columns:90px 1fr 1fr 1fr}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .cmprow{grid-template-columns:78px 1fr 1fr}
  .cmprow .c3{display:none}
  .tbstat .seg{display:none}
  .alert .ax{margin-top:6px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
      <div>
        <div class="bname">材料資料庫管理系統</div>
        <div class="bsub">MatDB Control · 研發材料資料中樞</div>
      </div>
    </div>
    <div class="tbstat">
      <div class="livedot seg"><i></i>資料庫連線正常</div>
      <div class="seg"><div class="k">材料筆數</div><div class="v">3,842</div></div>
      <div class="seg"><div class="k">待審 AVL</div><div class="v" style="color:var(--acc2)">17</div></div>
      <div><div class="k">值班</div><div class="v">技術長 · 陳彥廷</div></div>
    </div>
  </div>
</header>
<nav class="nav" id="nav"></nav>
<main class="wrap"><div id="app"></div></main>
<div class="foot">
  本頁為純 UI 系統展示（無後端），所有畫面與數據皆為擬真示範資料，僅供介面設計參考。<br/>
  材料資料庫管理系統 · MatDB Control ｜ /demos/jvision-smart-mfg-248-system-248/
</div>

<script>
"use strict";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
var AX="#93a1b3",GRID="#2a323d",ACC="#c2410c",ACC2="#fb923c";
function axTxt(){return{color:AX,fontSize:11};}
function ln(){return{lineStyle:{color:GRID}};}
function baseGrid(){return{left:6,right:14,top:26,bottom:6,containLabel:true};}

var NAV=[
  {icon:"inventory_2",label:"材料主檔"},
  {icon:"science",label:"物性資料庫"},
  {icon:"fact_check",label:"AVL 核准"},
  {icon:"account_tree",label:"替代比對"},
  {icon:"biotech",label:"測試規格"},
  {icon:"insights",label:"儀表板"}
];

/* helpers */
function kpi(icon,label,val,unit,delta,dir){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arrow=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'+
    '<div class="kv">'+val+(unit?'<span> '+unit+'</span>':'')+'</div>'+
    '<div class="kd '+cls+'"><span class="material-symbols-outlined" style="font-size:14px">'+arrow+'</span>'+delta+'</div></div>';
}
function drow(icon,t,v){
  return '<div class="drow"><div class="di"><span class="material-symbols-outlined">'+icon+'</span></div>'+
    '<div class="dt"><b>'+t+'</b></div><div class="dv">'+v+'</div></div>';
}
function drow2(icon,t,s,pill){
  return '<div class="drow"><div class="di"><span class="material-symbols-outlined">'+icon+'</span></div>'+
    '<div class="dt"><b>'+t+'</b><small>'+s+'</small></div><span class="pill '+pill+'" style="flex:0 0 auto">•</span></div>';
}
function dleg(c,t,v){return '<div class="dl"><i style="background:'+c+'"></i>'+t+'<b>'+v+'</b></div>';}
function tl(time,head,desc,mut){
  return '<div class="ev'+(mut?' mut':'')+'"><div class="et">'+time+'</div><div class="eh">'+head+'</div><div class="ed">'+desc+'</div></div>';
}
function gau(id,mx,val,color){
  var g=mk(id);if(!g)return;
  g.setOption({series:[{type:"gauge",radius:"96%",center:["50%","62%"],min:0,max:mx,startAngle:210,endAngle:-30,
    progress:{show:true,width:8,itemStyle:{color:color}},axisLine:{lineStyle:{width:8,color:[[1,"#2a323d"]]}},
    axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},pointer:{show:false},anchor:{show:false},
    detail:{valueAnimation:false,fontSize:18,color:"#e7ecf2",offsetCenter:[0,"6%"],formatter:function(v){return v;}},
    data:[{value:val}]}]});
}

/* ---------- SCREEN 0 : 材料主檔 ---------- */
function s0(){
  var rows=[
    ["MAT-AL6061","AL6061-T6 鋁合金","金屬結構件","結構","啟用",92,"研發A組"],
    ["MAT-PA66GF","PA66-GF30 尼龍","工程塑膠","外殼","啟用",88,"研發B組"],
    ["MAT-CU-C1100","C1100 無氧銅","導電材料","電子","啟用",95,"電子組"],
    ["MAT-ABS-PC","ABS/PC 合金","工程塑膠","外殼","審核中",61,"研發B組"],
    ["MAT-SUS304","SUS304 不鏽鋼","金屬結構件","結構","啟用",90,"研發A組"],
    ["MAT-SI-RUB","矽膠 60 Shore","彈性體","密封","啟用",84,"製程組"],
    ["MAT-FR4","FR-4 玻纖基板","基板材料","電子","啟用",93,"電子組"],
    ["MAT-TIM-3W","導熱膏 3W/mK","熱介面","散熱","停用",40,"熱管理"]
  ];
  var st={"啟用":"p-ok","審核中":"p-warn","停用":"p-mut"};
  var body="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    body+='<tr><td class="mono">'+r[0]+'</td><td><b>'+r[1]+'</b></td><td>'+r[2]+'</td>'+
    '<td><span class="tag">'+r[3]+'</span></td>'+
    '<td><span class="pill '+st[r[4]]+'">'+r[4]+'</span></td>'+
    '<td><div class="mini"><div class="mbar"><i style="width:'+r[5]+'%"></i></div><span class="mono" style="font-size:12px;color:var(--sub)">'+r[5]+'%</span></div></td>'+
    '<td>'+r[6]+'</td></tr>';
  }
  return ''+
  '<div class="scr-head"><div><h1>材料主檔</h1><p>材料編碼、分類與基本屬性的單一資料源</p></div><span class="badge">v0 · 材料建檔</span></div>'+
  '<div class="alert"><span class="material-symbols-outlined">rule</span><div class="abody"><div class="at">3 筆材料屬性欄位缺漏，資料完整度低於 70%</div><div class="ad">MAT-ABS-PC、MAT-TIM-3W 缺少熱膨脹係數與供應來源，建議補齊以供設計引用。</div></div><a class="ax">補件清單</a></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("database","材料總筆數","3,842","","+126 本季","up")+
    kpi("task_alt","資料完整度","81.4","%","+4.2%","up")+
    kpi("category","材料分類","24","類","結構/塑膠/電子…","flat")+
    kpi("history","本週更新","57","筆","跨 6 組","up")+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card"><div class="ctitle"><span class="material-symbols-outlined">donut_small</span>分類分布<small>依材料類別</small></div><div id="c0a" class="chart sm"></div></div>'+
    '<div class="card pad0"><div class="ctitle" style="padding:16px 16px 8px"><span class="material-symbols-outlined">table_rows</span>材料清單<small>共 3,842 筆 · 顯示 8</small></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>材料編碼</th><th>名稱</th><th>類別</th><th>用途</th><th>狀態</th><th>完整度</th><th>負責組</th></tr></thead><tbody>'+body+'</tbody></table></div></div>'+
  '</div>';
}
function d0(){
  var c=mk("c0a");if(!c)return;
  c.setOption({
    tooltip:{trigger:"item"},
    series:[{type:"pie",radius:["52%","78%"],center:["50%","52%"],avoidLabelOverlap:true,
      itemStyle:{borderColor:"#171c24",borderWidth:2},
      label:{color:AX,fontSize:11},
      data:[
        {value:1180,name:"金屬結構件",itemStyle:{color:ACC}},
        {value:960,name:"工程塑膠",itemStyle:{color:ACC2}},
        {value:720,name:"電子/基板",itemStyle:{color:"#38bdf8"}},
        {value:520,name:"熱介面/散熱",itemStyle:{color:"#22c55e"}},
        {value:462,name:"彈性體/其他",itemStyle:{color:"#a78bfa"}}
      ]}]
  });
}

/* ---------- SCREEN 1 : 物性資料庫 ---------- */
function s1(){
  return ''+
  '<div class="scr-head"><div><h1>物性資料庫</h1><p>機械、熱、電性等物性參數與測試數據集中管理</p></div><span class="badge">v1 · 物性登錄</span></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("science","已登錄物性","28,904","","含 12 類參數","up")+
    kpi("verified","數據佐證率","76.3","%","有測試報告","up")+
    kpi("thermostat","熱物性覆蓋","68","%","散熱設計關鍵","flat")+

var SCR=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];
function show(i){
  disposeCharts();
  var app=document.getElementById("app");
  app.innerHTML=SCR[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}

  DRAW[i]();
}
(function buildNav(){
  var n=document.getElementById("nav"),h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="lbl">'+NAV[i].label+'</span></button>';
  }
  n.innerHTML=h;
  var btns=n.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){(function(el){el.addEventListener("click",function(){location.hash="v"+el.getAttribute("data-i");});})(btns[j]);}
})();
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
