<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPQC 製程在線檢驗 · 純 UI 展示</title>
<meta name="description" content="從異常到改善的品質閉環與追溯稽核">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A84300;
  --bad:#DC2626;
  --paper:#FFFFFF;
  --grid:rgba(37,99,235,.075);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:3px solid var(--ink);
  background:rgba(248,250,252,.97);
}
.topbar-in{
  max-width:1440px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.logo .ms{font-size:24px}
.brand b{
  display:block;
  font-size:15px;
  font-weight:800;
  letter-spacing:.02em;
}
.brand span:not(.ms){
  display:block;
  color:var(--muted);
  font:500 10px/1.4 "Fira Code",monospace;
  text-transform:uppercase;
}
nav{
  display:flex;
  justify-content:flex-end;
  gap:0;
  flex:1;
  overflow-x:auto;
  scrollbar-width:thin;
}
nav button{
  min-height:42px;
  padding:8px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  border:1px solid var(--ink);
  border-right:0;
  border-radius:0;
  color:var(--ink);
  background:#fff;
  font-weight:700;
}
nav button:last-child{border-right:1px solid var(--ink)}
nav button:hover{background:var(--color-muted)}
nav button.on{
  color:#fff;
  background:var(--blue);
  box-shadow:inset 0 -4px 0 #93C5FD;
}
nav button:focus-visible,
button:focus-visible{
  position:relative;
  z-index:2;
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
main{
  max-width:1440px;
  margin:auto;
  padding:28px 18px 64px;
}
.screen-head{
  position:relative;
  margin:0 0 18px;
  padding:24px clamp(18px,3vw,38px);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  overflow:hidden;
  color:#fff;
  background:var(--blue);
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);
}
.screen-head::after{
  content:"QUALITY / CONTROL";
  position:absolute;
  right:-10px;
  bottom:-21px;
  color:rgba(255,255,255,.1);
  font:800 clamp(34px,6vw,82px)/1 "Fira Code",monospace;
  white-space:nowrap;
  pointer-events:none;
}
.screen-head>div,.screen-head>.tag{position:relative;z-index:1}
.screen-head h1{
  margin:0;
  max-width:850px;
  font-size:clamp(25px,4vw,50px);
  line-height:1.04;
  font-weight:800;
  letter-spacing:-.045em;
}
.screen-head p{
  max-width:820px;
  margin:12px 0 0;
  color:#EFF6FF;
  font-size:13px;
}
.tag{
  min-height:38px;
  padding:7px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  font:700 11px/1.2 "Fira Code",monospace;
  white-space:nowrap;
}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2a{grid-template-columns:1.4fr 1fr}
.g-2b{grid-template-columns:1fr 1.5fr}
.card{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 rgba(30,41,59,.2);
}
.card-p{padding:17px}
.card h3{
  margin:0 0 3px;
  font-size:15px;
  font-weight:800;
  letter-spacing:.01em;
}
.card .sub{
  margin-bottom:14px;
  color:var(--muted);
  font-size:12px;
}
.kpi{
  position:relative;
  min-height:148px;
  padding:15px 16px 16px;
  overflow:hidden;
}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-28px;
  width:76px;
  height:76px;
  border:14px solid var(--color-muted);
  transform:rotate(20deg);
}
.kpi:nth-child(2n){border-top:8px solid var(--blue)}
.kpi:nth-child(2n+1){border-top:8px solid var(--color-accent)}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:8px;
  font:800 28px/1.1 "Fira Code",monospace;
  letter-spacing:-.05em;
}
.kpi .val small{
  margin-left:5px;
  color:var(--muted);
  font:600 12px "Fira Sans","Noto Sans TC",sans-serif;
}
.kpi .dl{
  position:relative;
  z-index:1;
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  font-weight:700;
}
.up{color:var(--ok)}
.dn{color:var(--bad)}
.chip{
  min-height:25px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.c-ok{color:#166534;background:#DCFCE7}
.c-warn{color:#8A3800;background:#FFEDD5}
.c-bad{color:#991B1B;background:#FEE2E2}
.c-info{color:#1E40AF;background:#DBEAFE}
.c-mut{color:#334155;background:#E2E8F0}
.dot{
  width:8px;
  height:8px;
  display:inline-block;
  border:1px solid currentColor;
  border-radius:50%;
}
.scroll{overflow-x:auto;border:1px solid var(--ink)}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  background:#fff;
}
th,td{
  padding:11px 12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
th:last-child,td:last-child{border-right:0}
th{
  color:#fff;
  background:var(--ink);
  font:700 11px/1.3 "Fira Code",monospace;
  letter-spacing:.025em;
}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#DBEAFE}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono{
  font-family:"Fira Code",monospace!important;
  font-variant-numeric:tabular-nums;
}
.chart{width:100%;height:300px}
.board{
  min-width:1000px;
  display:grid;
  grid-template-columns:repeat(4,minmax(230px,1fr));
  gap:0;
}
.col{
  min-width:0;
  padding:11px;
  background:#F8FAFC;
  border-right:2px solid var(--ink);
}
.col:last-child{border-right:0}
.col-h{
  margin-bottom:11px;
  padding:3px 2px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--ink);
}
.col-h b{font-size:13px}
.cnt{
  padding:1px 8px;
  color:#fff;
  background:var(--ink);
  font:700 11px "Fira Code",monospace;
}
.tk{
  margin-bottom:10px;
  padding:11px;
  background:#fff;
  border:1px solid var(--ink);
  border-left:7px solid var(--blue);
  box-shadow:3px 3px 0 #CBD5E1;
}
.tk .id{
  color:var(--muted);
  font:700 10px "Fira Code",monospace;
}
.tk .t{
  margin:4px 0 8px;
  font-size:13px;
  font-weight:700;
  white-space:normal;
}
.tk .m{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px;
}
.av{
  width:24px;
  height:24px;
  display:inline-grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:1px solid var(--ink);
  font-weight:700;
}
.matrix .bar,.prog{
  position:relative;
  min-width:90px;
  height:10px;
  overflow:hidden;
  background:repeating-linear-gradient(90deg,#CBD5E1 0,#CBD5E1 8px,#fff 8px,#fff 10px);
  border:1px solid var(--ink);
}
.matrix .bar i{
  position:absolute;
  top:-3px;
  width:5px;
  height:16px;
  background:var(--color-accent);
  border:1px solid var(--ink);
}
.prog i{display:block;height:100%}
.gauge{
  padding:12px 0;
  display:grid;
  grid-template-columns:150px minmax(100px,1fr) 75px 58px;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.gauge:last-child{border-bottom:0}
.gauge .nm{font-size:12px;font-weight:700}
.track{
  position:relative;
  height:16px;
  background:linear-gradient(90deg,#FECACA 0 8%,#DCFCE7 8% 92%,#FECACA 92%);
  border:1px solid var(--ink);
}
.track .lsl,.track .usl{
  position:absolute;
  top:-4px;
  width:3px;
  height:22px;
  background:var(--bad);
}
.track .pin{
  position:absolute;
  top:-5px;
  width:5px;
  height:24px;
  background:var(--ink);
  transform:translateX(-50%);
}
.gauge .rd{
  text-align:right;
  font:700 12px "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.legend{
  margin-top:12px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:12px;
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tl{
  position:relative;
  padding-left:28px;
}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:9px;
  width:3px;
  background:var(--ink);
}
.tl-i{position:relative;padding:0 0 18px}
.tl-i::before{
  content:"";
  position:absolute;
  top:2px;
  left:-24px;
  width:13px;
  height:13px;
  background:#fff;
  border:4px solid var(--blue);
}
.tl-i.bad::before{border-color:var(--bad)}
.tl-i.warn::before{border-color:var(--color-accent)}
.tl-i.ok::before{border-color:var(--ok)}
.tl-i .tm{
  color:var(--muted);
  font:700 11px "Fira Code",monospace;
}
.tl-i .bd{margin-top:3px;font-size:13px}
.note{
  margin-top:15px;
  padding:12px;
  color:#7C2D12;
  background:#FFEDD5;
  border:2px solid var(--color-accent);
  font-size:12px;
  font-weight:700;
}
.foot{
  margin-top:34px;
  padding:16px;
  color:var(--muted);
  border-top:2px solid var(--ink);
  font:500 11px "Fira Code",monospace;
  text-align:center;
}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .topbar-in{align-items:flex-start;flex-wrap:wrap}
  nav{flex-basis:100%;justify-content:flex-start}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  main{padding:20px 12px 48px}
  .screen-head{align-items:flex-start;flex-direction:column}
  .g-2a,.g-2b{grid-template-columns:1fr}
  .gauge{grid-template-columns:1fr 70px 58px}
  .gauge .nm{grid-column:1/-1}
}
@media(max-width:480px){
  .brand span:not(.ms){display:none}
  nav button{min-width:44px;justify-content:center;padding:8px}
  nav button .lab{display:none}
  .g-kpi{grid-template-columns:1fr}
  .screen-head h1{font-size:30px}
  .tag{white-space:normal}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
  .reveal{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="ms">fact_check</span></div>
      <div><b>IPQC 製程在線檢驗</b><span>In-Process Quality Control · QMS</span></div>
    </div>
    <nav id="nav" aria-label="系統功能"></nav>
  </div>
</header>
<main>
  <div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · IPQC 製程在線檢驗</div>
</main>
<script>
(function(){
"use strict";
var charts=[];
var NAVS=[
 {icon:"checklist_rtl",label:"檢驗點設定"},
 {icon:"event_available",label:"巡檢排程"},
 {icon:"edit_note",label:"現場量測"},
 {icon:"monitoring",label:"異常/SPC"},
 {icon:"notifications_active",label:"即時通報"},
 {icon:"task_alt",label:"處置追蹤"}
];
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function chip(cls,text,icon){return '<span class="chip '+cls+'">'+(icon?'<span class="ms">'+icon+'</span>':'')+text+'</span>'}
function head(title,sub,tag){
 return '<div class="screen-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><span class="tag"><span class="ms">bolt</span>'+tag+'</span></div>';
}
function kpi(lab,icon,val,unit,delta,up){
 return '<div class="card kpi"><div class="lab"><span class="ms" style="font-size:17px;color:var(--blue)">'+icon+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dl '+(up?'up':'dn')+'"><span class="ms" style="font-size:15px">'+(up?'trending_up':'trending_down')+'</span>'+delta+'</div></div>';
}
var nav=el("nav");
nav.innerHTML=NAVS.map(function(n,i){
 return '<button type="button" data-i="'+i+'" aria-label="'+n.label+'"><span class="ms">'+n.icon+'</span><span class="lab">'+n.label+'</span></button>';
}).join("");
nav.addEventListener("click",function(e){
 var b=e.target.closest("button[data-i]");
 if(!b)return;
 location.hash="v"+b.getAttribute("data-i");
});

function s0(){
 var pts=[
  ["IPQC-CNC01","CNC 銑削-外徑","外徑 Ø",23.95,24.05,24.01,1.42,"每 2 小時","A 線",true],
  ["IPQC-CNC02","CNC 銑削-深度","孔深",12.40,12.60,12.57,1.05,"每 2 小時","A 線",true],
  ["IPQC-INJ07","射出-重量","淨重 g",37.90,38.50,38.44,.92,"每 1 小時","B 線",true],
  ["IPQC-INJ08","射出-外觀","外觀判定",0,0,0,null,"每批","B 線",true],
  ["IPQC-WELD3","焊接-拉力","拉力 N",480,9999,498,1.18,"每 4 小時","C 線",true],
  ["IPQC-ASM12","組裝-扭力","鎖付扭力 N·m",8,9,8.7,1.33,"每 2 小時","D 線",false],
  ["IPQC-PLT05","電鍍-膜厚","膜厚 μm",12,18,14.2,1.51,"每 3 小時","E 線",true],
  ["IPQC-PCB09","SMT-錫膏厚","錫膏 μm",100,140,132,1.09,"每 1 小時","F 線",true]
 ];
 function cap(v){
  if(v===null)return chip("c-info","計數型","category");
  return chip(v>=1.33?"c-ok":v>=1?"c-warn":"c-bad","Cpk "+v.toFixed(2),v>=1.33?"check_circle":v>=1?"warning":"error");
 }
 var rows=pts.map(function(p){
  var no=p[4]===9999||p[3]===p[4],pos=no?0:Math.max(4,Math.min(96,(p[5]-p[3])/(p[4]-p[3])*100));
  return '<tr><td class="mono" style="font-weight:700">'+p[0]+'</td><td>'+p[1]+'<div style="font-size:11px;color:var(--muted)">'+p[2]+'</div></td><td class="mono">'+(p[3]===p[4]?"—":p[3])+'</td><td class="mono">'+(no?"—":p[4])+'</td><td class="matrix">'+(no?"—":'<div class="bar" aria-label="現值位於規格區間 '+pos.toFixed(0)+'%"><i style="left:'+pos.toFixed(0)+'%"></i></div>')+'</td><td class="mono" style="font-weight:700">'+(p[6]===null?"—":p[5])+'</td><td>'+cap(p[6])+'</td><td>'+chip("c-mut",p[7],"schedule")+'</td><td>'+p[8]+'</td><td>'+(p[9]?chip("c-ok","啟用","check_circle"):chip("c-mut","停用","pause_circle"))+'</td></tr>';
 }).join("");
 return head("檢驗點設定","維護製程檢驗點、規格上下限（LSL/USL）與抽驗頻率，作為巡檢排程與異常判定的基準。","IPQC 設定基準")+
 '<div class="grid g-kpi" style="margin-bottom:14px">'+kpi("檢驗點總數","checklist",8,"點","本月新增 2 點",true)+kpi("啟用中","toggle_on",7,"點","覆蓋 6 條產線",true)+kpi("能力不足 Cpk&lt;1.33","warning",4,"點","需加嚴監控",false)+kpi("平均抽驗頻率","schedule","2.1","小時","符合管制計畫",true)+'</div>'+
 '<div class="card card-p"><h3>製程檢驗點清單</h3><div class="sub">「製程分布」標記量測值相對規格中線的位置；計數型項目以外觀判定管理。</div><div class="scroll"><table><thead><tr><th>檢驗點</th><th>項目 / 特性</th><th>LSL</th><th>USL</th><th>製程分布</th><th>現值</th><th>製程能力</th><th>頻率</th><th>產線</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function s1(){
