<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
:root{
 --color-primary:#00FF41;--color-on-primary:#0F172A;--color-secondary:#008F11;
 --color-on-secondary:#000;--color-accent:#FF3333;--color-on-accent:#000;
 --color-background:#0D1117;--color-foreground:#E6EDF3;--color-card:#182424;
 --color-card-foreground:#E6EDF3;--color-muted:#25292F;--color-muted-foreground:#A7B3C4;
 --color-border:#46505B;--color-destructive:#EF4444;--color-on-destructive:#000;
 --color-ring:#00FF41;--blue:#00FF41;--ink:#E6EDF3;--muted:#A7B3C4;--line:#46505B;
 --green:#00FF41;--amber:#FFD43B;--red:#FF5C5C;--cyan:#42D9FF;--purple:#C69CFF;
 --mono:"Josefin Sans","Noto Sans Mono",monospace;--display:"Cinzel",serif;
 --sans:"Josefin Sans","Noto Sans TC","Microsoft JhengHei",sans-serif
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--color-foreground);font-family:var(--sans);font-size:16px;line-height:1.45}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 24;line-height:1;vertical-align:middle}
.shell{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr);background-image:linear-gradient(rgba(70,80,91,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(70,80,91,.13) 1px,transparent 1px);background-size:32px 32px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#080B0F;border-right:3px solid var(--color-primary)}
.brand{display:flex;gap:12px;align-items:center;padding:22px 18px;border-bottom:2px solid var(--line)}
.logo{width:50px;height:50px;display:grid;place-items:center;background:var(--color-primary);color:var(--color-on-primary);border:2px solid var(--color-foreground);box-shadow:6px 6px 0 var(--color-secondary)}
.brand b{display:block;color:#fff;font-weight:700}
.brand small{display:block;margin-top:3px;color:var(--color-primary);font:600 10px/1 var(--mono);letter-spacing:.18em}
.nav{flex:1;overflow:auto;padding:16px 12px}
.nav-title{padding:7px 10px 12px;color:var(--muted);font:700 11px/1 var(--mono);letter-spacing:.18em}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:13px 11px;margin-bottom:7px;border:2px solid transparent;border-radius:0;background:transparent;color:#C9D2DC;text-align:left;font-weight:600}
.nav button:hover{border-color:var(--line);background:var(--color-muted);color:#fff}
.nav button.on{background:var(--color-primary);border-color:#fff;color:var(--color-on-primary);box-shadow:5px 5px 0 var(--color-secondary)}
.nav button .material-symbols-outlined{font-size:21px}
.badge{margin-left:auto;min-width:23px;padding:1px 6px;background:#080B0F;color:var(--color-primary);border:1px solid currentColor;text-align:center;font:700 12px/1.4 var(--mono)}
.side-foot{padding:15px 18px;border-top:2px solid var(--line);color:var(--muted);font-size:12px}
.user{display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--color-primary);color:#fff;font-weight:700}
.user b{color:#fff}
.main{min-width:0}
.top{position:sticky;z-index:20;top:0;display:flex;align-items:center;gap:20px;padding:15px 26px;background:rgba(13,17,23,.96);border-bottom:2px solid var(--line);backdrop-filter:blur(8px)}
.top h1{margin:0;color:#fff;font-size:20px;font-weight:700}
.sub{color:var(--muted);font-size:12px}
.top-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.signal{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:2px solid var(--line);background:var(--color-card);color:#fff;font:700 12px/1 var(--mono)}
.signal strong{color:var(--color-primary)}
.signal.alert{border-color:var(--color-accent)}
.body{padding:25px 26px 50px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:19px;border-bottom:3px solid var(--color-primary);padding-bottom:13px}
.view-head h2{margin:0;color:#fff;font:700 clamp(23px,3vw,36px)/1.05 var(--display);letter-spacing:.03em}
.view-head p{margin:7px 0 0;color:var(--muted)}
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border:2px solid #fff;border-radius:0;background:var(--color-primary);color:var(--color-on-primary);font-weight:700;box-shadow:4px 4px 0 var(--color-secondary)}
.btn:hover{background:#7DFF9E}
.btn.secondary{background:var(--color-card);color:#fff;border-color:var(--line);box-shadow:4px 4px 0 #080B0F}
.btn.danger{background:var(--color-accent);color:var(--color-on-accent);box-shadow:4px 4px 0 #A40000}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{position:relative;min-width:0;padding:16px;background:var(--color-card);border:2px solid var(--line);box-shadow:6px 6px 0 #080B0F}
.kpi:nth-child(odd){border-top-color:var(--color-primary)}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi-label .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.kpi-value{margin-top:8px;color:#fff;font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums}
.kpi-value small{color:var(--muted);font-size:13px}
.kpi-note{margin-top:7px;color:var(--color-primary);font-size:12px;font-weight:700}
.grid{display:grid;gap:17px}.grid>*{min-width:0}
.g53{grid-template-columns:1.2fr .8fr}.g64{grid-template-columns:1.35fr 1fr}.g46{grid-template-columns:1fr 1.35fr}
.card{min-width:0;padding:18px;background:var(--color-card);border:2px solid var(--line);box-shadow:7px 7px 0 #080B0F}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;color:#fff;font-size:15px}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.grow{margin-left:auto;color:var(--color-primary);font:700 12px/1 var(--mono)}
.chart{position:relative;height:245px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:13px}
.list-row:first-of-type{border-top:0}
.list-row b{color:#fff}
.code,.number,.plate,.date,.sku,.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.number,.money{text-align:right}
.note{padding:13px 14px;background:#0B1014;border:2px solid var(--line);border-left:5px solid var(--color-primary);color:#C9D2DC;font-size:13px;line-height:1.65}
.note b{color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;background:#10161B;font:700 11px/1.2 var(--mono);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border:1px solid currentColor;background:currentColor}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.info{color:var(--cyan)}.muted-tag{color:#C5CED8}.purple{color:var(--purple)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:12px;text-align:left;white-space:nowrap;background:#080B0F;color:var(--color-primary);border:1px solid var(--line);font:700 11px/1 var(--mono);letter-spacing:.08em}
.tbl td{padding:12px;border:1px solid var(--line);white-space:nowrap;color:#D3DBE5}
.tbl tbody tr:hover td{background:#202E2E}
.tbl td:nth-last-child(n+2):has(+td),.tbl td.number{text-align:right}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:13px}
.column{padding:11px;background:#0B1014;border:2px solid var(--line)}
.column-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#fff;font-weight:700}
.column-head .count{margin-left:auto;padding:1px 7px;border:1px solid var(--line);font-family:var(--mono)}
.column-head .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.work{padding:11px;margin-top:9px;background:var(--color-card);border:2px solid var(--line);border-left:6px solid var(--color-primary)}
.work:hover{border-color:var(--color-primary)}
.work .work-top{display:flex;justify-content:space-between;gap:8px}
.work .plate{color:#fff;font-weight:700}
.work .model{color:var(--muted);font-size:12px}
.work .symptom{margin-top:8px;color:#E3E9EF;font-size:12px}
.work .tech{margin-top:9px;color:var(--muted);font-size:11px}
.work.recv{border-left-color:var(--amber)}.work.fix{border-left-color:var(--cyan)}.work.done{border-left-color:var(--green)}.work.pick{border-left-color:var(--purple)}
.quote-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.quote-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px;margin-bottom:8px;border:2px solid var(--line);background:#10161B}
.quote-row.selected{border-color:var(--color-primary)}
.check{width:23px;height:23px;display:grid;place-items:center;border:2px solid var(--line)}
.selected .check{background:var(--color-primary);border-color:var(--color-primary);color:#000}
.quote-row b{display:block;color:#fff;font-size:13px}
.quote-row small{color:var(--muted)}
.invoice{border:2px solid var(--color-primary)}
.invoice-head{display:flex;justify-content:space-between;gap:15px;padding:16px;background:var(--color-primary);color:#071009}
.invoice-head b{font-size:17px}.invoice-head small{display:block}
.invoice-total{text-align:right;font:700 25px/1.1 var(--mono)}
.invoice-body{padding:8px 15px 15px}
.sum{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed var(--line)}
.sum.total{color:var(--color-primary);font-weight:700;font-size:16px;border-bottom:0}
.reminder{display:grid;grid-template-columns:43px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px;margin-bottom:9px;border:2px solid var(--line);background:#10161B}
.reminder-icon{width:43px;height:43px;display:grid;place-items:center;border:2px solid currentColor}
.reminder b{display:block;color:#fff}.reminder small{color:var(--muted)}
.reminder-right{text-align:right}
.vehicle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.vehicle{background:var(--color-card);border:2px solid var(--line);box-shadow:6px 6px 0 #080B0F}
.vehicle-head{display:flex;gap:12px;align-items:center;padding:14px;background:var(--color-primary);color:#071009;border-bottom:2px solid #fff}
.vehicle-icon{width:42px;height:42px;display:grid;place-items:center;border:2px solid #071009}
.vehicle-head .plate{font-size:19px;font-weight:700}
.vehicle-head small{display:block}
.vehicle-body{padding:14px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{padding:8px;background:#0B1014;border:1px solid var(--line)}
.spec span{display:block;color:var(--muted);font-size:10px}
.spec b{display:block;margin-top:3px;color:#fff;font-size:13px}
.progress{height:10px;margin:7px 0;border:1px solid var(--line);background:#080B0F}
.progress span{display:block;height:100%;background:var(--color-primary)}
.history{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.history-row{display:flex;gap:10px;padding:5px 0;font-size:12px}
.history-row .date{width:50px;color:var(--muted)}
.history-row span:last-child{color:#DDE4EB}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn:first-child{flex:1}
.grid-item{animation:enter .4s backwards cubic-bezier(.2,.9,.3,1.25)}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.94)}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(2,minmax(220px,1fr))}}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:3px solid var(--color-primary)}
 .brand{padding:14px 16px}.logo{width:42px;height:42px}.nav{display:flex;gap:7px;padding:10px;overflow-x:auto}
 .nav-title,.side-foot{display:none}.nav button{width:auto;flex:none;margin:0;white-space:nowrap}
 .top{top:0}.g53,.g64,.g46,.quote-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
 .top{padding:12px 14px;align-items:flex-start}.top-right .signal:last-child{display:none}.body{padding:18px 13px 35px}
 .view-head{align-items:flex-start}.kpis{grid-template-columns:1fr}.kpi:nth-child(even){transform:none}
 .kanban{grid-template-columns:1fr}.vehicle-grid{grid-template-columns:1fr}.reminder{grid-template-columns:38px minmax(0,1fr)}
 .reminder-right{grid-column:2;text-align:left}.specs{grid-template-columns:1fr 1fr}.chart{height:220px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}.grid-item{animation:none!important}
}
</style>
</head>

var charts={};
function clearCharts(){Object.keys(charts).forEach(function(k){charts[k].destroy()});charts={}}

 clearCharts();

 Chart.defaults.color=text;Chart.defaults.font.family='"Josefin Sans",sans-serif';

 }

}

function show(i){

}
