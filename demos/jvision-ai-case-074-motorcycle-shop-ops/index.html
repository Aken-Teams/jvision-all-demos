<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>機車行工單管家｜Jvision 系統 Demo</title>
<meta name="description" content="機車行維修保養工單、快速報價、零件庫存、定保里程提醒、顧客車輛檔案到日結營收的營運管理（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--acc:#1d4ed8;--acc2:#60a5fa;--acc-d:#1e3a8a;--ink:#0b1526;--body:#33415c;--mut:#7c8aa5;--line:#e4e9f2;--bg:#eef2fb;--card:#fff;--amber:#d97706;--red:#dc2626;--green:#16a34a;--blue:#2563eb;--purp:#7c3aed;--cyan:#0891b2}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
/* sidebar */
.side{background:linear-gradient(180deg,#0b1526,#132548);border-right:1px solid #0d1a33;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .lg{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-content:center;flex:none;box-shadow:0 8px 20px rgba(29,78,216,.5)}
.brand b{color:#fff;font-size:15px;display:block;font-family:"Noto Sans TC"}
.brand small{color:#8ea6d6;font-size:10px;letter-spacing:.14em}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav .t{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6f83ab;padding:10px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#c3d2ec;font:inherit;font-size:13.5px;font-weight:600;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:21px;color:#6f88b8}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff}
.nav button.on .material-symbols-outlined{color:#fff}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:rgba(96,165,250,.22);color:#bfd6ff;border-radius:999px;padding:1px 8px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
.side-f{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8ea6d6}
.doc{display:flex;align-items:center;gap:10px}
.doc .av{width:34px;height:34px;border-radius:50%;background:rgba(96,165,250,.22);color:#dbe8ff;font-weight:800;display:grid;place-content:center}
/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.top h1{margin:0;font-size:19px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.top .sub{font-size:12px;color:var(--mut)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--acc-d);background:#dbe6ff;border-radius:999px;padding:6px 12px}
.pill.live i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.body{padding:22px 26px 44px}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.vh p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--acc-d);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,rgba(29,78,216,.12),transparent 70%)}
.kpi .l{font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--acc)}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);margin-top:7px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:12px;font-weight:800;color:var(--acc-d);margin-top:4px}
.kpi .d.bad{color:var(--red)}.kpi .d.good{color:var(--green)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g-53{grid-template-columns:1.15fr .85fr}
.g-64{grid-template-columns:1.35fr 1fr}
.g-46{grid-template-columns:1fr 1.35fr}
.g-11{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.card>h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Noto Sans TC"}
.card>h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card>h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc)}
.scroll{overflow-x:auto}
.chart-wrap{position:relative;height:270px;width:100%}
.chart-wrap.sm{height:230px}
.note{background:var(--bg);border-radius:12px;padding:14px;font-size:13px;color:var(--body);line-height:1.7}
.miniq{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.miniq:first-of-type{border-top:0}
.miniq b{color:var(--ink);font-weight:700}.miniq span{color:var(--acc-d);font-weight:800;font-family:Inter}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl tr:hover td{background:var(--bg)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block}
.g-ok{background:#dcfce7;color:#166534}.g-wait{background:#fef3c7;color:#92400e}.g-rej{background:#fee2e2;color:#991b1b}.g-info{background:#dbeafe;color:#1e40af}.g-pur{background:#ede9fe;color:#6d28d9}.g-mut{background:#eef2f8;color:#54637d}.g-cyan{background:#cffafe;color:#155e75}
/* ── signature 1: kanban 受理→維修→完工→取車 ── */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:14px}
.kanban>*{min-width:0}
.kcol{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.kcol .kh{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);font-size:14px;padding:2px 4px}
.kcol .kh i{width:9px;height:9px;border-radius:50%;display:inline-block}
.kcol .kh span.cnt{margin-left:auto;font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:1px 8px}
.wo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;border-left:4px solid var(--acc);cursor:pointer;transition:.15s}
.wo:hover{transform:translateX(3px);box-shadow:0 4px 14px rgba(29,78,216,.1)}
.wo .wt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wo .plate{font-family:Inter;font-weight:900;font-size:14px;color:var(--ink);letter-spacing:.5px}
.wo .model{font-size:11.5px;color:var(--mut);margin-top:2px}
.wo .sym{font-size:12px;color:var(--body);margin-top:7px;line-height:1.5}
.wo .wf{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.wo .wf .av{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;font-weight:800;display:grid;place-content:center;font-family:"Noto Sans TC"}
.k-recv{border-left-color:#f59e0b}.k-fix{border-left-color:var(--acc)}.k-done{border-left-color:var(--green)}.k-pick{border-left-color:var(--cyan)}
/* ── signature 2: vehicle profile card ── */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.vcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.vcard .vhd{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.vcard .vhd .ico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-content:center;flex:none}
.vcard .vhd .plate{font-family:Inter;font-weight:900;font-size:18px;letter-spacing:1px}
.vcard .vhd small{font-size:11.5px;opacity:.92;display:block;margin-top:1px}
.vcard .vbd{padding:14px 16px}
.vspec{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-bottom:12px}
.vspec .s{background:var(--bg);border-radius:10px;padding:8px 10px}
.vspec .s .l{font-size:10.5px;color:var(--mut);font-weight:700}
.vspec .s .v{font-size:14px;font-weight:800;color:var(--ink);font-family:Inter;margin-top:2px}
.mbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.mbar span{display:block;height:100%}
.hist{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.hist .hr{display:flex;gap:8px;font-size:12px;padding:5px 0}
.hist .hr .dt{color:var(--mut);font-family:Inter;flex:none;width:52px}
.hist .hr .tx{color:var(--body)}
/* ── quote builder ── */
.qb{display:flex;flex-direction:column;gap:9px}
.qrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.qrow.on{border-color:var(--acc);background:#f2f6ff}
.qrow .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-content:center;flex:none;color:#fff}
.qrow.on .ck{background:var(--acc);border-color:var(--acc)}
.qrow .qi{flex:1;min-width:0}
.qrow .qi b{font-size:13.5px;color:var(--ink);font-family:"Noto Sans TC"}
.qrow .qi small{display:block;color:var(--mut);font-size:11.5px}
.qrow .qp{font-family:Inter;font-weight:800;color:var(--ink);white-space:nowrap}
/* invoice */
.inv{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.inv .ih{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.inv .ih b{font-size:16px;font-family:"Noto Sans TC"}
.inv .ih span{font-size:11.5px;opacity:.94;display:block;margin-top:2px}
.inv .ihr{text-align:right}.inv .ihr .big{font-size:23px;font-weight:900;font-family:Inter}
.inv .ib{padding:6px 18px 16px}
.sr{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.sr.tot{border-bottom:0;font-weight:900;font-size:15px;color:var(--acc-d)}
.sr .rn{font-family:Inter}
/* bar list */
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:9px 0 7px}
.bar span{display:block;height:100%}
/* reminders */
.rem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px}
.rem .rc{width:44px;height:44px;border-radius:12px;display:grid;place-content:center;color:#fff;flex:none}
.rem .ri{flex:1;min-width:0}
.rem .ri b{font-size:14px;color:var(--ink);font-family:"Noto Sans TC"}
.rem .ri small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.rem .rr{text-align:right;flex:none}
.rem .rr .big{font-family:Inter;font-weight:900;font-size:15px}
@media(max-width:980px){.kanban{grid-template-columns:repeat(2,minmax(200px,1fr))}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;flex:none}.nav .t{display:none}.side-f{display:none}
  .brand{border-bottom:0}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g-53,.g-64,.g-46,.g-11{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
}
@media(max-width:420px){
  .top{flex-wrap:wrap;padding:12px 16px;gap:8px}.top h1{font-size:17px}.body{padding:16px 14px 30px}
  .kpis{grid-template-columns:1fr}.vspec{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">two_wheeler</span></span><div><b>機車行工單管家</b><small>MOTO SHOP OPS</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><div class="doc"><span class="av">阿</span><div><b style="color:#fff">陳志明</b><div>服務人員 · 明宏機車行</div></div></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">門市總覽</h1><div class="sub" id="vsub">明宏機車行 · 本日營運戰情</div></div>
      <div class="r">
        <span class="pill live"><i></i>維修中 4 台</span>
        <span class="pill">待取車 3</span>
      </div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
var MODS=[["dashboard","門市總覽",""],["view_kanban","維修工單","4"],["request_quote","快速報價",""],["inventory_2","零件庫存","2"],["notifications_active","定保提醒","6"],["two_wheeler","顧客車輛",""]];
var NAMES=["門市總覽","維修工單","快速報價","零件庫存","定保提醒","顧客車輛"];
var SUBS=["本日工單、營收與待辦戰情","受理到取車的維修工單看板","選工項與零件即時試算報價","機油輪胎等零件耗材庫存與補貨","依里程時間推算定保到期通知","車牌車型里程與歷次保養履歷"];

var nt=function(n){return (typeof n==="number"?n:parseInt(String(n).replace(/,/g,""),10)).toLocaleString("en-US");};

/* ── KPI ── */
var KPI=[["assignment","本日工單","23","張","+5"],["build","維修中","4","台","平均 42 分"],["payments","本日營收","38,600","元","毛利 62%"],["notifications_active","定保到期","6","位","已通知 4"]];
var kpiRow=function(){return '<div class="kpis">'+KPI.map(function(k){return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[0]+'</span>'+k[1]+'</div><div class="v">'+k[2]+'<small> '+k[3]+'</small></div><div class="d good">'+k[4]+'</div></div>';}).join("")+'</div>';};

/* ── kanban work orders ── */
/* [plate,model,symptom,tech,status,mileage] status: recv/fix/done/pick */
var WO=[
 ["ABC-1234","三陽 Woo 115","起步異音、皮帶疑鬆","峰","recv","18,240"],
 ["MKG-582","光陽 GP125","定期保養 + 換機油","峰","recv","9,860"],
 ["7291-XY","山葉 勁戰六代","前煞車不靈、來令片磨耗","豪","fix","24,570"],
 ["JQP-036","三陽 DRG158","儀表電系異常、電瓶弱","豪","fix","12,030"],
 ["EBR-778","光陽 雷霆S","後輪換胎 + 定保","峰","fix","31,420"],
 ["MND-441","山葉 BWS水冷","水箱漏水檢修","豪","fix","6,540"],
 ["KPL-259","三陽 Woo 115","更換火星塞完工待檢","峰","done","22,110"],
 ["3608-AB","光陽 Many110","保養完成待結帳","豪","done","14,780"],
 ["TCH-190","山葉 勁戰五代","已完工結帳、通知取車","峰","pick","28,900"],
 ["QWE-457","三陽 活力125","換機油完成、已付款","豪","pick","41,260"],
 ["LMB-823","光陽 GP125","定保完成待取車","峰","pick","7,320"]];
var KCOL=[["受理","recv","#f59e0b","k-recv"],["維修中","fix","var(--acc)","k-fix"],["完工待檢","done","var(--green)","k-done"],["待取車","pick","var(--cyan)","k-pick"]];
function kanban(){
 var h='<div class="kanban">';
 KCOL.forEach(function(c){
  var items=WO.filter(function(w){return w[4]===c[1];});
  h+='<div class="kcol"><div class="kh"><i style="background:'+c[2]+'"></i>'+c[0]+'<span class="cnt">'+items.length+'</span></div>';
  items.forEach(function(w){
   h+='<div class="wo '+c[3]+'"><div class="wt"><span class="plate">'+w[0]+'</span><span class="tag g-mut">'+nt(w[5])+' km</span></div><div class="model">'+w[1]+'</div><div class="sym">'+w[2]+'</div><div class="wf"><span class="av">'+w[3]+'</span>技師 '+w[3]+' 師傅</div></div>';
  });
  h+='</div>';
 });
 h+='</div>';
 return h;
}

/* ── quote items ── */
/* [name,detail,price,checked,type] type: labor/part */
var QITEMS=[
 ["定期保養工資","更換機油、檢查全車","300",true,"labor"],
 ["原廠全合成機油","1L · 10W-40","520",true,"part"],
 ["更換前來令片","含工資","480",true,"part"],
 ["更換火星塞","銥合金 · 含工","260",false,"part"],
 ["傳動皮帶檢修","清潔調整 · 含工","350",false,"labor"],
 ["空氣濾清器","更換 · 含工","220",false,"part"],
 ["電瓶檢測充電","免費檢測","0",true,"labor"]];

/* ── parts inventory ── */
/* [sku,name,cat,qty,safe,unit,price] */
var PARTS=[
 ["OIL-1040","全合成機油 10W-40","機油耗材",42,20,"瓶","520"],
 ["OIL-1050","礦物機油 10W-50","機油耗材",8,15,"瓶","280"],
 ["BRK-F12","前來令片(通用)","煞車系統",26,12,"組","320"],
 ["BRK-R08","後煞車皮","煞車系統",4,10,"組","260"],
 ["TIR-90/90","前輪胎 90/90-12","輪胎",6,6,"條","880"],
 ["TIR-100/90","後輪胎 100/90-10","輪胎",3,6,"條","980"],
 ["SPK-IR7","銥合金火星塞","電系點火",31,15,"支","180"],
 ["BAT-GTZ7","啟動電瓶 GTZ7S","電系點火",5,8,"顆","1,050"],
 ["BLT-STD","傳動皮帶(標準)","傳動系統",18,10,"條","640"],
 ["AIR-STD","空氣濾清器","進氣系統",11,12,"個","150"]];

/* ── maintenance reminders ── */
/* [plate,model,owner,mileage,nextMile,due,level] level: over/soon/ok */
var REMIND=[

var CH={};

var ACC="#1d4ed8",ACC2="#60a5fa",BLUE="#2563eb",GREEN="#16a34a",PURP="#7c3aed",AMBER="#d97706",RED="#dc2626",CYAN="#0891b2";
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;CH[id]=new Chart(el,cfg);}
function draw(i){
 destroyAll();
 var gc={plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false};
 if(i===0){
  mk("c_week",{type:"bar",data:{labels:["8/7","8/8","8/9","8/10","8/11","8/12","8/13"],datasets:[{label:"維修台數",data:[16,19,14,21,18,24,23],backgroundColor:ACC,borderRadius:6,yAxisID:"y"},{type:"line",label:"營收(千)",data:[26,31,22,36,30,42,38.6],borderColor:AMBER,backgroundColor:"transparent",tension:.35,yAxisID:"y1",pointRadius:3}]},options:Object.assign({},gc,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{beginAtZero:true,grid:{color:"#eaf0fa"},position:"left"},y1:{beginAtZero:true,position:"right",grid:{display:false}},x:{grid:{display:false}}}})});
  mk("c_mix",{type:"doughnut",data:{labels:["工資","機油耗材","煞車系統","輪胎","電系其他"],datasets:[{data:[38,22,14,18,8],backgroundColor:[ACC,ACC2,AMBER,GREEN,PURP],borderWidth:0}]},options:Object.assign({},gc,{cutout:"58%",plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}}})});
 }
 if(i===3){
  var cat={};PARTS.forEach(function(p){var amt=p[3]*parseInt(p[6].replace(/,/g,""),10);cat[p[2]]=(cat[p[2]]||0)+amt;});
  var labels=Object.keys(cat);
  mk("c_stock",{type:"bar",data:{labels:labels,datasets:[{label:"庫存金額",data:labels.map(function(l){return cat[l];}),backgroundColor:[ACC,AMBER,GREEN,PURP,CYAN,BLUE],borderRadius:6}]},options:Object.assign({},gc,{indexAxis:"y",scales:{x:{beginAtZero:true,grid:{color:"#eaf0fa"}},y:{grid:{display:false}}}})});
 }
 if(i===4){
  mk("c_ret",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"定保回廠率%",data:[64,68,71,74,79,83],borderColor:ACC,backgroundColor:"rgba(29,78,216,.14)",fill:true,tension:.35},{label:"目標",data:[80,80,80,80,80,80],borderColor:AMBER,borderDash:[5,4],backgroundColor:"transparent",pointRadius:0}]},options:Object.assign({},gc,{plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{min:50,max:100,grid:{color:"#eaf0fa"}},x:{grid:{display:false}}}})});
