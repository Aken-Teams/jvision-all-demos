<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客戶滿意度調查 Customer Satisfaction Survey/NPS｜Jvision 系統 Demo</title>
  <meta name="description" content="問卷設計、多管道發送、回收看板、NPS/CSAT 分析、意見洞察與低分案件跟進的一站式滿意度管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --sidebar:#FFFFFF;
  --sidebar2:#F8FAFC;
  --good:#047857;
  --warn:#B45309;
  --bad:#DC2626;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.shell{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:0 0 256px;
  flex-direction:column;
  gap:6px;
  width:256px;
  height:100vh;
  min-width:0;
  padding:24px 16px;
  overflow-y:auto;
  background:var(--sidebar);
  color:var(--ink);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.brand .logo{
  display:flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:10px;
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand h1{margin:0;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:10.5px;font-weight:500}
#nav{display:flex;flex-direction:column;gap:5px}
.navbtn{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
  min-height:48px;
  padding:9px 12px;
  color:var(--muted);
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.navbtn .material-symbols-outlined{flex:0 0 auto;font-size:21px;color:var(--color-primary)}
.navbtn .txt{min-width:0;overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.navbtn small{display:block;margin-top:1px;color:#64748B;font-size:10.5px;font-weight:400}
.navbtn:hover{background:var(--color-muted);color:var(--ink);border-color:var(--line)}
.navbtn.on{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
.navbtn.on .material-symbols-outlined,.navbtn.on small{color:var(--color-on-primary)}
.sbfoot{margin-top:auto;padding:18px 10px 0;color:#64748B;font-size:11px;border-top:1px solid var(--line)}
.main{flex:1 1 auto;min-width:0;padding:28px 32px 48px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.topbar .htxt{min-width:0}
.topbar h2{display:flex;align-items:center;gap:10px;margin:0;color:var(--ink);font-size:23px;font-weight:700;letter-spacing:-.02em}
.topbar h2 .material-symbols-outlined{color:var(--color-primary);font-size:26px}
.topbar p{max-width:760px;margin:5px 0 0;color:var(--muted);font-size:13px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 13px;
  color:#1E40AF;
  font-size:12px;
  font-weight:600;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:999px;
}
.pill .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:12px;
  transition:border-color 180ms ease,background-color 180ms ease;
}
.card:hover{border-color:#BFDBFE}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;color:var(--ink);font-size:14px;font-weight:700}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.card h3 .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.kpi{display:flex;flex-direction:column;gap:7px;border-top:3px solid var(--color-primary)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .val,.stat b,.chn .cv,.npsscore b{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.kpi .val{color:var(--ink);font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.04em}
.kpi .val small{color:var(--muted);font-size:13px;font-weight:600}
.kpi .delta{display:inline-flex;align-items:center;align-self:flex-start;gap:4px;font-size:11.5px;font-weight:600}
.kpi .delta .material-symbols-outlined{font-size:16px}
.up{color:var(--good)}
.down{color:var(--bad)}
.flat{color:var(--muted)}
.chartwrap{position:relative;width:100%;overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-color:#CBD5E1 transparent}
.tbl{width:100%;min-width:520px;font-size:12.5px;border-collapse:collapse}
.tbl th{
  padding:10px 12px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  text-align:left;
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
  background:var(--color-muted);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.tbl th:first-child{border-left:1px solid var(--line);border-radius:8px 0 0 0}
.tbl th:last-child{border-right:1px solid var(--line);border-radius:0 8px 0 0}
.tbl td{padding:11px 12px;vertical-align:middle;border-bottom:1px solid var(--line)}
.tbl tbody tr{transition:background-color 160ms ease}
.tbl tbody tr:hover{background:#F8FAFC}
.tbl td:nth-child(n+2){font-variant-numeric:tabular-nums}
.tbl td[style*="font-weight:700"],.tbl td:last-child{white-space:nowrap}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 9px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:999px;
}
.t-good{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-mut{background:#F8FAFC;color:#475569}
.bar{height:8px;overflow:hidden;background:#E2E8F0;border-radius:4px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:4px}
.avatar{
  display:inline-flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  color:var(--color-on-primary);
  font-size:11px;
  font-weight:700;
  background:var(--color-primary);
  border-radius:50%;
}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:920px}
.col{min-width:0;padding:12px;background:var(--color-muted);border:1px solid var(--line);border-radius:10px}
.col>.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;font-size:12px;font-weight:700}
.col>.ch .cnt{padding:2px 8px;color:var(--muted);font:600 10.5px "Fira Code",monospace;background:#FFF;border:1px solid var(--line);border-radius:999px}
.tk{margin-bottom:8px;padding:10px 11px;background:#FFF;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:8px}
.tk:last-child{margin-bottom:0}
.tk .tt{font-size:12.5px;font-weight:600;line-height:1.4}
.tk .mt{display:flex;align-items:center;gap:6px;margin-top:7px;color:var(--muted);font-size:10.5px;flex-wrap:wrap}
.tl{position:relative;padding-left:23px}
.tl:before{position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line);content:""}
.tl .it{position:relative;padding:0 0 17px}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{position:absolute;top:4px;left:-20px;width:10px;height:10px;background:var(--color-primary);border:3px solid #FFF;border-radius:50%;content:""}
.tl .it .tm{color:#1D4ED8;font:600 11px "Fira Code",monospace}
.tl .it .tx{margin-top:3px;font-size:12.5px;line-height:1.45}
.tl .it .who{margin-top:3px;color:var(--muted);font-size:10.5px}
.npsface{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.npsdial{position:relative;flex:0 0 auto}
.npsscore{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.npsscore b{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.06em}
.npsscore span{margin-top:4px;color:var(--muted);font-size:11px;font-weight:600}
.npssplit{display:flex;flex:1 1 220px;min-width:0;flex-direction:column;gap:11px}
.npsrow{display:flex;align-items:center;gap:10px}
.npsrow .lb{flex:0 0 auto;width:64px;font-size:12px;font-weight:600}
.npsrow .bar{flex:1 1 auto}
.npsrow .pc{flex:0 0 auto;width:46px;font:600 12px "Fira Code",monospace;text-align:right}
.qlist{display:flex;flex-direction:column;gap:9px}
.qrow{display:flex;align-items:center;gap:11px;min-width:0;padding:11px 13px;background:var(--color-muted);border:1px solid var(--line);border-radius:9px}
.qrow .gr{flex:0 0 auto;color:#64748B;cursor:grab}
.qrow .qi{display:flex;flex:0 0 auto;align-items:center;justify-content:center;width:32px;height:32px;background:#FFF;border:1px solid var(--line);border-radius:7px}
.qrow .qi .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.qrow .qb{flex:1 1 auto;min-width:0}
.qrow .qb .qt{overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.qrow .qb .qtype{margin-top:2px;color:var(--muted);font-size:11px}
.palette{display:flex;flex-direction:column;gap:8px}
.pchip{display:flex;align-items:center;gap:9px;padding:10px 11px;font-size:12.5px;font-weight:600;background:#FFF;border:1px dashed #93C5FD;border-radius:8px}
.pchip .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.prev{padding:15px;background:var(--color-muted);border:1px solid var(--line);border-radius:9px}
.prev .pq{margin-bottom:11px;font-size:13px;font-weight:700}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale span{display:flex;align-items:center;justify-content:center;width:32px;height:32px;font:600 12px "Fira Code",monospace;background:#FFF;border:1px solid var(--line);border-radius:6px}
.scale span.hi{color:var(--color-on-primary);background:var(--color-primary);border-color:var(--color-primary)}
.chn{display:flex;align-items:center;gap:12px;min-width:0;padding:13px;background:#FFF;border:1px solid var(--line);border-radius:9px}
.chn .ic{display:flex;flex:0 0 auto;align-items:center;justify-content:center;width:40px;height:40px;color:#FFF;border-radius:8px}
.chn .ic .material-symbols-outlined{font-size:22px}
.chn .cb{flex:1 1 auto;min-width:0}
.chn .cb .cn{font-size:13px;font-weight:700}
.chn .cb .cs{margin-top:2px;color:var(--muted);font-size:11px}
.chn .cv{flex:0 0 auto;font-size:18px;font-weight:700}
.segrow{display:grid;grid-template-columns:110px 1fr 52px;gap:12px;align-items:center;margin-bottom:12px}
.segrow:last-child{margin-bottom:0}
.segrow .sl{min-width:0;overflow:hidden;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.segrow .sv{font:600 12.5px "Fira Code",monospace;text-align:right}
.cloud{display:flex;gap:8px;flex-wrap:wrap}
.ttag{padding:6px 12px;font-weight:600;line-height:1.2;border:1px solid transparent;border-radius:999px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.muted{color:var(--muted)}
.divider{height:1px;margin:14px 0;background:var(--line)}
.stat{display:flex;align-items:baseline;gap:7px}
.stat b{font-size:22px;font-weight:700}
.stat span{color:var(--muted);font-size:12px;font-weight:500}
.quote{margin-bottom:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;background:var(--color-muted);border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:8px}
.quote:last-child{margin-bottom:0}
.quote .qm{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:11px;flex-wrap:wrap}
#screen>.grid{animation:grid-enter 400ms cubic-bezier(.34,1.4,.64,1) both}
#screen>.grid:nth-child(2){animation-delay:60ms}
#screen>.grid:nth-child(3){animation-delay:120ms}
@keyframes grid-enter{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:1100px){
  .main{padding-right:24px;padding-left:24px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .sidebar{position:static;width:auto;height:auto;padding:12px;flex:none;flex-direction:row;align-items:center;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  .brand{width:100%;padding:2px 6px 8px}
  #nav{width:100%;flex-direction:row;overflow-x:auto;padding-bottom:3px}
  .navbtn{flex:0 0 auto;width:auto;min-height:44px;padding:8px 11px}
  .navbtn small{display:none}
  .sbfoot{display:none}
  .main{padding:20px 16px 36px}
}
@media(max-width:768px){
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
  .topbar{margin-bottom:18px}
  .topbar h2{font-size:20px}
  .pill{width:100%;justify-content:center}
}
@media(max-width:560px){
  .navbtn .txt{display:none}
  .navbtn{min-width:44px;justify-content:center;padding:9px}
  .g4{grid-template-columns:minmax(0,1fr)}
  .main{padding-right:12px;padding-left:12px}
  .topbar h2{font-size:18px}
  .topbar p{font-size:12px}
  .segrow{grid-template-columns:82px minmax(0,1fr) 44px;gap:8px}
  .npsface{justify-content:center}
  .npssplit{flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen>.grid{animation:none!important;opacity:1;transform:none}
}
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">reviews</span></div>
        <div>
          <h1>NPS 滿意度中樞</h1>
          <p>Customer Satisfaction / NPS</p>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sbfoot">品保部 · 業務部 · 客服部<br/>資料為示範用途 · Jvision Demo</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="htxt">
          <h2 id="scTitle"><span class="material-symbols-outlined">reviews</span><span></span></h2>
          <p id="scDesc"></p>
        </div>
        <div class="pill"><span class="material-symbols-outlined">calendar_month</span>2026 Q3 · 半年度滿意度調查</div>
      </div>
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var accent="#ea580c", accent2="#fb923c";
    var charts={};
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}charts={};}

    var SCREENS=[
      {icon:"description", name:"問卷範本設計", sub:"Template Builder", desc:"拖曳題型、配置 NPS/CSAT 題組與品牌化版型，完成後送審發送。"},
      {icon:"campaign", name:"多管道發送", sub:"Dispatch", desc:"依名單分群，透過 Email、簡訊與入口網站排程發送並設定提醒。"},
      {icon:"monitoring", name:"回收即時看板", sub:"Collection", desc:"即時追蹤回收率、作答進度與各管道到達狀態，對未回覆自動催填。"},
      {icon:"insights", name:"NPS/CSAT 分析", sub:"Analytics", desc:"推薦者/貶抑者分佈、指標趨勢與客戶分群比較，量化滿意度。"},
      {icon:"science", name:"意見文字洞察", sub:"Voice of Customer", desc:"開放意見情緒分類、主題標籤與熱點彙整，聽見客戶真實聲音。"},
      {icon:"task_alt", name:"低分案件跟進", sub:"Recovery", desc:"貶抑者與低分回覆自動建案、指派負責人並追蹤改善至結案。"}
    ];

    // build nav
    var nav=document.getElementById("nav");
    nav.innerHTML=SCREENS.map(function(s,i){
      return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+s.icon+'</span>'+
      '<span class="txt">'+esc(s.name)+'<small>'+esc(s.sub)+'</small></span></button>';
    }).join("");
    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]"); if(!b) return;
      location.hash="v"+b.getAttribute("data-i");
    });

    // ---------- helpers ----------
    function barpct(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}

    // ---------- screen renderers ----------
    function s0(){ // 問卷範本設計
      var qs=[
        {t:"整體而言，您有多大可能將我們推薦給同業或朋友？",ty:"NPS · 0–10 分",ic:"tag"},
        {t:"對本次交付品質的整體滿意度",ty:"CSAT · 五星量表",ic:"star"},
        {t:"客服團隊的回應速度是否符合期待？",ty:"李克特量表 · 1–5",ic:"linear_scale"},
        {t:"下列哪些面向最影響您的評價？（可複選）",ty:"複選題 · 6 選項",ic:"checklist"},
        {t:"若有任何建議，請告訴我們（選填）",ty:"開放意見 · 文字",ic:"chat"}

        },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{family:fontStack,size:10}}},y:{grid:{color:"#f0ede8"},ticks:{font:{family:fontStack,size:10}}}}}});
        var e3=gc("c2b"); if(e3) charts.c2b=new Chart(e3,{type:"bar",data:{
          labels:["Email","網站","簡訊","LINE"],
          datasets:[{label:"回收率 %",data:[31,26,18,9],backgroundColor:["#ea580c","#fb923c","#fdba74","#fed7aa"],borderRadius:6,maxBarThickness:44}]
        },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{family:fontStack,size:11}}},y:{grid:{color:"#f0ede8"},ticks:{font:{family:fontStack,size:10},callback:function(v){return v+"%";}}}}}});
      }else if(i===3){
        var e4=gc("c3a"); if(e4) charts.c3a=new Chart(e4,{type:"doughnut",data:{
          labels:["推薦者","中立者","貶抑者"],
          datasets:[{data:[52,34,14],backgroundColor:["#16a34a","#f59e0b","#dc2626"],borderWidth:2,borderColor:"#fff"}]
        },options:{responsive:true,maintainAspectRatio:false,cutout:"72%",plugins:{legend:{display:false}}}});
        var e5=gc("c3b"); if(e5) charts.c3b=new Chart(e5,{type:"line",data:{
          labels:["3月","4月","5月","6月","7月","8月"],
          datasets:[
            {label:"NPS",data:[24,27,31,33,36,38],borderColor:accent,backgroundColor:"rgba(234,88,12,.1)",fill:true,tension:.35,pointRadius:3,borderWidth:2,yAxisID:"y"},
            {label:"CSAT",data:[3.9,4.0,4.1,4.1,4.2,4.3],borderColor:"#0ea5e9",backgroundColor:"rgba(14,165,233,.05)",fill:false,tension:.35,pointRadius:3,borderWidth:2,yAxisID:"y1"}
          ]
        },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{family:fontStack,size:11},usePointStyle:true,padding:12}}},scales:{x:{grid:{display:false},ticks:{font:{family:fontStack,size:11}}},y:{position:"left",grid:{color:"#f0ede8"},ticks:{font:{family:fontStack,size:10}}},y1:{position:"right",min:3.5,max:5,grid:{display:false},ticks:{font:{family:fontStack,size:10}}}}}});
      }else if(i===4){
        var e6=gc("c4a"); if(e6) charts.c4a=new Chart(e6,{type:"polarArea",data:{
          labels:["正面","中立","負面"],
          datasets:[{data:[58,23,19],backgroundColor:["rgba(22,163,74,.75)","rgba(245,158,11,.75)","rgba(220,38,38,.75)"],borderWidth:1,borderColor:"#fff"}]
        },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{family:fontStack,size:11},usePointStyle:true,padding:12}}},scales:{r:{ticks:{display:false},grid:{color:"#eee"}}}}});
      }
    }

    // ---------- show ----------
    var RENDER=[s0,s1,s2,s3,s4,s5];
    var container=document.getElementById("screen");
    function show(i){
      destroyCharts();
      var s=SCREENS[i]||SCREENS[0];
      document.querySelector("#scTitle span:last-child").textContent=s.name;
      var ic=document.querySelector("#scTitle .material-symbols-outlined"); if(ic) ic.textContent=s.icon;
      document.getElementById("scDesc").textContent=s.desc;
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
      container.innerHTML=(RENDER[i]||RENDER[0])();
      void container.offsetHeight;
      initCharts(i);
    }

    window.show=show;
    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
