<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>偏差放行管理 Deviation/Waiver Management｜Jvision Demo</title>
<meta name="description" content="偏差／讓步放行的申請、風險評估、跨部門會簽、核准放行與期限追蹤閉環" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#be185d;--accent2:#fb7185;
  --bg:#0d0b12;--panel:#171320;--panel2:#1f1a2b;--line:#2c2438;
  --txt:#f2ecf6;--muted:#a99cba;--dim:#7d7090;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#2a1024 0%,transparent 60%),var(--bg);
  color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
a{color:inherit;text-decoration:none}

/* nav */
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(13,11,18,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:0 0 auto}
.brand b{font-size:15px;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:var(--muted)}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nb{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.nb:hover{border-color:var(--accent2);color:var(--txt)}
.nb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.nb .material-symbols-outlined{font-size:18px}

.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0}
.head h1{margin:0;font-size:22px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(52,211,153,.15)}

/* grid helpers */
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.g5{grid-template-columns:repeat(5,1fr)}
.grid>*{min-width:0}

.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{color:var(--accent2);font-size:19px}
.sub{font-size:12px;color:var(--dim);font-weight:500}

/* kpi */
.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(190,24,93,.25),transparent 70%)}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .delta{font-size:12px;margin-top:4px;font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.kpi .material-symbols-outlined{font-size:16px;color:var(--accent2)}

/* chart */
.cwrap{position:relative;width:100%;overflow:hidden}

/* table */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:none;position:sticky;top:0}
tbody tr:hover{background:rgba(190,24,93,.06)}
td b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-good{background:rgba(52,211,153,.15);color:var(--good)}
.t-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.t-bad{background:rgba(248,113,113,.15);color:var(--bad)}
.t-info{background:rgba(96,165,250,.15);color:var(--info)}
.t-acc{background:rgba(251,113,133,.16);color:var(--accent2)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.board>*{min-width:0}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{margin:0 0 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.col h4 em{font-style:normal;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
.tk{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-left:3px solid var(--accent2);
  border-radius:9px;padding:9px 10px;margin-bottom:9px}
.tk .id{font-size:11px;color:var(--dim);font-weight:700}
.tk .ti{font-size:13px;font-weight:600;margin:3px 0}
.tk .mt{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;margin-bottom:16px}
.tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px rgba(190,24,93,.2)}
.tl .tm{font-size:11px;color:var(--dim);font-weight:700}
.tl .tt{font-size:13px;font-weight:600;margin:2px 0}
.tl .td{font-size:12px;color:var(--muted)}

/* misc */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{display:flex;align-items:center;gap:10px;min-width:0}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:rgba(190,24,93,.15);color:var(--accent2)}
.mini{font-size:12px;color:var(--muted)}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.big{font-size:34px;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;font-size:11px}
.matrix .mh{color:var(--dim);text-align:center;padding:4px}
.matrix .rl{color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.mc{border-radius:6px;text-align:center;padding:10px 0;font-weight:700;color:#0d0b12}
.stepbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stepbar .s{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.stepbar .s.done{border-color:var(--good);color:var(--good)}
.stepbar .s.cur{border-color:var(--accent2);color:var(--accent2);background:rgba(190,24,93,.12)}
.stepbar .s b{display:block;font-size:12px}
.stepbar .s span{font-size:10px;color:var(--dim)}

@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12,.g5{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .board{grid-template-columns:1fr}
  .nb span.lb{display:none}
  .nb{padding:8px 10px}
  .head h1{font-size:19px}
}
</style>
</head>
<body>
<div class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">gavel</span></div>
    <div><b>偏差放行管理</b><span>Deviation / Waiver Management</span></div>
  </div>
  <div class="navbtns" id="navbtns"></div>
</div>
<div class="wrap">
  <div class="head" id="head"></div>
  <div id="app"></div>
</div>

<script>
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  var c=new Chart(el,cfg);
  charts.push(c);
  return c;
}
var AX="#a99cba", GRID="rgba(255,255,255,.06)";
Chart.defaults.color=AX;
Chart.defaults.font.family="Inter, Noto Sans TC, sans-serif";

var NAV=[
  {i:0,ic:"description",t:"偏差申請登錄"},
  {i:1,ic:"science",t:"風險評估"},
  {i:2,ic:"account_tree",t:"跨部門會簽"},
  {i:3,ic:"gavel",t:"核准放行"},
  {i:4,ic:"calendar_month",t:"期限追蹤"},
  {i:5,ic:"history",t:"追溯稽核"}
];
var HEAD=[
  {t:"偏差申請登錄",d:"製程工程師登錄偏差／讓步放行申請，附批號、規格差異與暫行對策"},
  {t:"風險評估分級",d:"依嚴重度、發生度與可偵測度量化風險，判定隔離範圍與放行條件"},
  {t:"跨部門會簽",d:"品保、研發、製程依關卡順序會簽，補件退回或加註放行條件"},
  {t:"核准放行決議",d:"彙整會簽結論做出核准 / 有條件放行 / 駁回，電子簽章生效"},
  {t:"期限追蹤",d:"追蹤放行有效期與逾期未關閉件，到期前提醒關案"},
  {t:"追溯稽核",d:"放行批號追溯、稽核軌跡與作業紀錄完整留存"}
];

function navRender(cur){
  var h="";
  for(var k=0;k<NAV.length;k++){
    var n=NAV[k];
    h+='<button class="nb'+(n.i===cur?' on':'')+'" data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="lb">'+n.t+'</span></button>';
  }
  document.getElementById("navbtns").innerHTML=h;
  var hd=HEAD[cur];
  document.getElementById("head").innerHTML='<div style="min-width:0"><h1>'+hd.t+'</h1><p>'+hd.d+'</p></div><div class="pill"><span class="dot"></span>即時連線 QMS · NCR · CAPA</div>';
  var bs=document.querySelectorAll("[data-i]");
  for(var j=0;j<bs.length;j++){
    bs[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{history.replaceState(null,"","#v"+this.getAttribute("data-i"));}catch(e){}try{window.scrollTo(0,0);}catch(e){}});
  }
}

/* ---------- helpers ---------- */
function kpi(lab,ic,val,unit,delta,dir){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (delta?'<div class="delta '+(dir||'up')+'">'+delta+'</div>':'')+'</div>';
}
function tagFor(s){
  var m={'待評估':'t-warn','待會簽':'t-info','待核准':'t-acc','已放行':'t-good','已駁回':'t-bad','逾期':'t-bad','進行中':'t-info','已關閉':'t-good','高':'t-bad','中':'t-warn','低':'t-good'};
  return '<span class="tag '+(m[s]||'t-info')+'">'+s+'</span>';
}

/* ================= SCREEN 0 : 偏差申請登錄 ================= */
function s0(){
  var apps=[
    {id:"DV-2408-117",part:"轉軸外殼 A32",lot:"L240811-07",type:"尺寸超差",dev:"外徑 +0.06mm",qty:1200,by:"林昱誠",st:"待評估"},
    {id:"DV-2408-116",part:"密封墊圈 R7",lot:"L240810-22",type:"外觀瑕疵",dev:"表面刮痕 3處",qty:540,by:"陳品豪",st:"待會簽"},
    {id:"DV-2408-115",part:"控制板 M9",lot:"L240810-05",type:"材料替代",dev:"電容改料號",qty:320,by:"黃雅琪",st:"待核准"},
    {id:"DV-2408-114",part:"齒輪組 G12",lot:"L240809-18",type:"製程偏離",dev:"熱處理溫差",qty:880,by:"李承翰",st:"已放行"},
    {id:"DV-2408-113",part:"外殼上蓋 C4",lot:"L240809-03",type:"尺寸超差",dev:"孔位偏移 0.15",qty:210,by:"林昱誠",st:"已駁回"}
  ];
  var rows="";
  for(var i=0;i<apps.length;i++){var a=apps[i];
    rows+='<tr><td><b>'+a.id+'</b></td><td>'+a.part+'</td><td>'+a.lot+'</td><td>'+a.type+'</td><td style="color:var(--accent2);font-weight:600">'+a.dev+'</td><td>'+a.qty+'</td><td>'+a.by+'</td><td>'+tagFor(a.st)+'</td></tr>';
  }
  var typs=[
    {n:"尺寸超差",c:38},{n:"外觀瑕疵",c:24},{n:"材料替代",c:16},{n:"製程偏離",c:14},{n:"文件偏差",c:8}
  ];
  var tr="";
  for(var j=0;j<typs.length;j++){var t=typs[j];
    tr+='<div class="row"><div class="l"><span class="ic"><span class="material-symbols-outlined">label</span></span><div><div style="font-size:13px;font-weight:600">'+t.n+'</div><div class="mini">占比 '+t.c+'%</div></div></div><div style="flex:1;max-width:160px"><div class="bar"><i style="width:'+t.c+'%"></i></div></div></div>';
  }
  return '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("本月新登錄","note_add","64","件","較上月 +12","up")+
    kpi("待評估","pending_actions","9","件","需 24h 內分派","down")+
    kpi("平均登錄工時","timer","6.4","分/件","-38%","up")+
    kpi("附件完整率","attach_file","96","%","+7pt","up")+
    '</div>'+
    '<div class="grid g21">'+
      '<div class="card"><h3><span class="material-symbols-outlined">description</span>偏差申請清單 <span class="sub">最新登錄案件</span></h3>'+
        '<div class="tbl"><table><thead><tr><th>單號</th><th>品項</th><th>批號</th><th>偏差類別</th><th>規格差異</th><th>數量</th><th>登錄人</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>偏差類別分佈</h3>'+
        '<div class="rows">'+tr+'</div>'+
        '<div class="note">本月共 128 件，尺寸超差為最大宗，多集中於 CNC 加工站。</div></div>'+
    '</div>';
}

/* ================= SCREEN 1 : 風險評估 ================= */
function s1(){
  var cells="";
  var rl=["嚴重 5","高 4","中 3","低 2","輕微 1"];
  var vals=[[8,12,20,34,45],[15,24,40,58,30],[22,40,62,44,18],[35,55,38,20,10],[48,30,15,8,4]];
  cells+='<div></div>';
  for(var c=1;c<=5;c++)cells+='<div class="mh">發生度 '+c+'</div>';
  for(var r=0;r<5;r++){
    cells+='<div class="rl">'+rl[r]+'</div>';
    for(var cc=0;cc<5;cc++){
      var score=(5-r)*(cc+1);
      var col=score>=15?'#f87171':score>=8?'#fbbf24':'#34d399';
      cells+='<div class="mc" style="background:'+col+'">'+vals[r][cc]+'</div>';
    }
  }
  return '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("待評估案件","assignment_late","9","件","","up")+
    kpi("高風險占比","priority_high","18","%","-5pt","up")+
    kpi("平均 RPN","calculate","96","分","嚴重×發生×偵測","down")+
    kpi("需隔離批次","block","4","批","已自動凍結","down")+
    '</div>'+
    '<div class="grid g12">'+
      '<div class="card"><h3><span class="material-symbols-outlined">science</span>風險等級分佈</h3>'+
        '<div class="cwrap" style="height:230px"><canvas id="c1a"></canvas></div>'+
        '<div class="legend"><span><i class="sw" style="background:#f87171"></i>高風險</span><span><i class="sw" style="background:#fbbf24"></i>中風險</span><span><i class="sw" style="background:#34d399"></i>低風險</span></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">grid_on</span>嚴重度 × 發生度 風險矩陣 <span class="sub">數字為案件數</span></h3>'+
        '<div style="overflow-x:auto"><div class="matrix" style="min-width:420px">'+cells+'</div></div>'+
        '<div class="note">紅區案件必先隔離批次並進入強制會簽；規格超差且影響功能者不得逕行放行。</div></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">radar</span>三維風險評分（近5案）</h3>'+
        '<div class="cwrap" style="height:250px"><canvas id="c1b"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">bolt</span>影響範圍研判</h3>'+
        '<div class="rows">'+
          '<div class="row"><div class="l"><span class="ic"><span class="material-symbols-outlined">verified</span></span><div><div style="font-size:13px;font-weight:600">功能安全</div><div class="mini">是否影響裝配與功能</div></div></div>'+tagFor("高")+'</div>'+
          '<div class="row"><div class="l"><span class="ic"><span class="material-symbols-outlined">factory</span></span><div><div style="font-size:13px;font-weight:600">後段製程</div><div class="mini">是否可能造成連鎖不良</div></div></div>'+tagFor("中")+'</div>'+
          '<div class="row"><div class="l"><span class="ic"><span class="material-symbols-outlined">local_shipping</span></span><div><div style="font-size:13px;font-weight:600">客戶端</div><div class="mini">是否涉及已出貨批號</div></div></div>'+tagFor("低")+'</div>'+
          '<div class="row"><div class="l"><span class="ic"><span class="material-symbols-outlined">gavel</span></span><div><div style="font-size:13px;font-weight:600">法規符合</div><div class="mini">是否影響認證與規範</div></div></div>'+tagFor("中")+'</div>'+
        '</div></div>'+
    '</div>';
}

/* ================= SCREEN 2 : 跨部門會簽 ================= */
function s2(){
  var cols=[

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  navRender(i);
  var container=document.getElementById("app");
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  initCharts(i);
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
