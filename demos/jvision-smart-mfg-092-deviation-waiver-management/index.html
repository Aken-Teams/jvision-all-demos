<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>產品偏差放行管理｜Jvision Demo</title>
<meta name="description" content="偏差／讓步放行的申請、風險評估、跨部門會簽、核准放行與期限追蹤閉環" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --good:#047857;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --surface-soft:#F1F5F9;
  --shadow:0 12px 28px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.35);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.nav{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:22px;
  min-height:72px;
  padding:10px max(18px,calc((100vw - 1400px)/2));
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(14px);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
}
.brand{display:flex;align-items:center;gap:12px;min-width:235px}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-radius:8px;
  box-shadow:5px 5px 0 #BFDBFE;
}
.brand b{display:block;font-size:16px;letter-spacing:.02em}
.brand span:not(.material-symbols-outlined){display:block;color:var(--muted);font-size:11px}
.navbtns{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.navbtns::-webkit-scrollbar{display:none}
.nb{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nb:hover{background:var(--color-muted);color:var(--ink);border-color:#CBD5E1}
.nb:active{transform:translateY(1px)}
.nb.on{
  background:var(--color-primary);
  border-color:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:0 4px 12px rgba(37,99,235,.2);
}
.nb .material-symbols-outlined{font-size:18px}
.wrap{width:min(1400px,100%);margin:auto;padding:30px 22px 64px}
.head{
  position:relative;
  display:flex;
  align-items:flex-end;
  gap:20px;
  min-height:112px;
  margin-bottom:20px;
  padding:24px 26px;
  overflow:hidden;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-left:5px solid var(--color-primary);
  border-radius:10px;
  box-shadow:var(--shadow);
}
.head::after{
  content:"QMS / NCR / CAPA";
  position:absolute;
  right:24px;
  top:12px;
  color:#DBEAFE;
  font:700 clamp(24px,4vw,58px)/1 "Fira Code",monospace;
  letter-spacing:-.08em;
  pointer-events:none;
}
.head>div{position:relative;z-index:1}
.head h1{margin:0;font-size:clamp(23px,2.2vw,32px);line-height:1.15;letter-spacing:-.03em}
.head p{max-width:780px;margin:9px 0 0;color:var(--muted);font-size:13px}
.pill{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
  padding:8px 12px;
  background:#ECFDF5;
  border:1px solid #A7F3D0;
  border-radius:999px;
  color:#065F46;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(4,120,87,.12)}
.grid{display:grid;gap:14px;min-width:0}
.grid>*{min-width:0}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:9px;
  box-shadow:0 2px 4px rgba(15,23,42,.025);
}
.card{padding:18px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 15px;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{color:var(--blue)}
.sub{color:var(--muted);font-size:11px;font-weight:400}
.kpi{
  position:relative;
  min-height:126px;
  padding:17px;
  overflow:hidden;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi::after{
  content:"";
  position:absolute;
  right:-23px;
  bottom:-32px;
  width:88px;
  height:88px;
  border:14px solid #EFF6FF;
  border-radius:50%;
}
.kpi:hover{transform:translateY(-3px);border-color:#93C5FD;box-shadow:var(--shadow)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:17px}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:7px;
  color:var(--ink);
  font:700 28px/1.2 "Fira Code",monospace;
  letter-spacing:-.04em;
}
.kpi .val small{color:var(--muted);font:500 12px "Fira Sans",sans-serif}
.kpi .delta{position:relative;z-index:1;margin-top:5px;font-size:11px;font-weight:600}
.up{color:var(--good)}
.down{color:var(--bad)}
.cwrap{position:relative;width:100%;overflow:hidden}
.tbl{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:7px;
}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--surface-soft);
  color:#334155;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
}
td{color:#334155}
td:first-child,td:nth-child(3),td time,.id,.tm{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td:nth-last-child(3):not(:first-child){font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
td b{color:var(--ink);font-weight:600}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10px;
  font-weight:700;
}
.tag::before{content:"";width:6px;height:6px;border:2px solid currentColor;border-radius:50%}
.t-good{background:#ECFDF5;color:#047857}
.t-warn{background:#FFF7ED;color:#9A3412}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-acc{background:#FFF7ED;color:#C2410C}
.bar{min-width:62px;height:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
.rows{display:flex;flex-direction:column}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:10px;min-width:0}
.ic{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:6px;
  color:var(--blue);
}
.mini{color:var(--muted);font-size:11px}
.note{
  margin-top:12px;
  padding:10px 12px;
  background:#F8FAFC;
  border-left:3px solid var(--blue);
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px}
.col{padding:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:7px}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
  color:#334155;
  font-size:11px;
}
.col h4 em{
  padding:2px 7px;
  background:#DBEAFE;
  border-radius:3px;
  color:#1E40AF;
  font:600 10px "Fira Code",monospace;
  font-style:normal;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#FFF;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:6px;
  transition:transform .2s ease,box-shadow .2s ease;
}
.tk:hover{transform:translateX(2px);box-shadow:0 6px 14px rgba(15,23,42,.08)}
.tk:last-child{margin-bottom:0}
.tk .id{color:var(--blue);font-size:10px;font-weight:600}
.tk .ti{margin:4px 0;color:var(--ink);font-size:12px;font-weight:600}
.tk .mt{display:flex;justify-content:space-between;gap:7px;margin-top:7px;color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:4px;width:2px;background:#CBD5E1}
.tl .it{position:relative;margin-bottom:17px}
.tl .it:last-child{margin-bottom:0}
.tl .it::before{
  content:"";
  position:absolute;
  left:-22px;
  top:3px;
  width:10px;
  height:10px;
  background:#FFF;
  border:3px solid var(--blue);
  border-radius:50%;
}
.tl .tm{color:var(--blue);font-size:10px;font-weight:600}
.tl .tt{margin:2px 0;color:var(--ink);font-size:12px;font-weight:600}
.tl .td{color:var(--muted);font-size:11px}
.matrix{display:grid;grid-template-columns:auto repeat(5,minmax(62px,1fr));gap:5px;font-size:10px}
.matrix .mh,.matrix .rl{color:var(--muted)}
.matrix .mh{text-align:center}
.matrix .rl{display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.mc{padding:10px 0;border-radius:4px;text-align:center;font:700 11px "Fira Code",monospace}
.stepbar{display:flex;gap:6px;margin-top:14px}
.stepbar .s{
  flex:1;
  min-width:70px;
  padding:8px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:5px;
  text-align:center;
}
.stepbar .s.done{background:#ECFDF5;border-color:#6EE7B7;color:#047857}
.stepbar .s.cur{background:#EFF6FF;border-color:#60A5FA;color:#1D4ED8}
.stepbar .s b{display:block;font-size:11px}
.stepbar .s span{color:var(--muted);font-size:9px}
.gauge{text-align:center}
.big{color:var(--blue);font:700 40px "Fira Code",monospace}
#app>.grid,#app>.card{animation:reveal .4s cubic-bezier(.2,.8,.2,1) both}
#app>.grid:nth-child(2),#app>.card:nth-child(2){animation-delay:.06s}
#app>.grid:nth-child(3),#app>.card:nth-child(3){animation-delay:.12s}
@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .nav{align-items:flex-start;flex-direction:column;gap:7px}
  .navbtns{width:100%;margin:0}
  .g5{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:820px){
  .wrap{padding:20px 14px 48px}
  .head{align-items:flex-start;flex-direction:column;padding:20px}
  .pill{margin-left:0}
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .g5{grid-template-columns:repeat(2,1fr)}
  .board{min-width:900px}
}
@media(max-width:560px){
  .nav{padding:9px 12px}
  .brand{min-width:0}
  .brand span:not(.material-symbols-outlined){display:none}
  .nb{min-width:42px;justify-content:center;padding:9px}
  .nb .lb{display:none}
  .head{min-height:0}
  .head::after{display:none}
  .head h1{font-size:22px}
  .head p{font-size:12px}
  .pill{white-space:normal}
  .g5,.g4{grid-template-columns:1fr}
  .card{padding:14px}
  .stepbar{overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #app>.grid,#app>.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="nav">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">gavel</span></div>
    <div><b>產品偏差放行管理</b><span>Deviation / Waiver Management</span></div>
  </div>
  <nav class="navbtns" id="navbtns" aria-label="主要功能"></nav>
</header>

<main class="wrap">
  <section class="head" id="head" aria-live="polite"></section>
  <div id="app"></div>
</main>

<script>
"use strict";
var charts=[];
var AX="#475569",GRID="rgba(148,163,184,.22)";
Chart.defaults.color=AX;
Chart.defaults.font.family="Fira Sans, sans-serif";

var NAV=[
  ["description","偏差申請登錄"],
  ["science","風險評估"],
  ["account_tree","跨部門會簽"],
  ["gavel","核准放行"],
  ["calendar_month","期限追蹤"],
  ["history","追溯稽核"]
];
var HEAD=[
  ["偏差申請登錄","製程工程師登錄偏差／讓步放行申請，附批號、規格差異與暫行對策"],
  ["風險評估分級","依嚴重度、發生度與可偵測度量化風險，判定隔離範圍與放行條件"],
  ["跨部門會簽","品保、研發、製程依關卡順序會簽，補件退回或加註放行條件"],
  ["核准放行決議","彙整會簽結論做出核准 / 有條件放行 / 駁回，電子簽章生效"],
  ["期限追蹤","追蹤放行有效期與逾期未關閉件，到期前提醒關案"],
  ["追溯稽核","放行批號追溯、稽核軌跡與作業紀錄完整留存"]
];

function destroyCharts(){
  charts.forEach(function(c){try{c.destroy()}catch(e){}});
  charts=[];
}
function mk(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  var c=new Chart(el,cfg);
  charts.push(c);
}
function navRender(cur){
  document.getElementById("navbtns").innerHTML=NAV.map(function(n,i){
    return '<button type="button" class="nb'+(i===cur?' on':'')+'" data-i="'+i+'" aria-current="'+(i===cur?'page':'false')+'"><span class="material-symbols-outlined" aria-hidden="true">'+n[0]+'</span><span class="lb">'+n[1]+'</span></button>';
  }).join("");
  document.getElementById("head").innerHTML='<div><h1>'+HEAD[cur][0]+'</h1><p>'+HEAD[cur][1]+'</p></div><div class="pill"><span class="dot" aria-hidden="true"></span>即時連線 QMS · NCR · CAPA</div>';
  document.querySelectorAll("[data-i]").forEach(function(b){
    b.addEventListener("click",function(){
      var i=+this.dataset.i;
      if(location.hash!=="#v"+i)location.hash="v"+i;
      else show(i);
    });
  });
}
function kpi(lab,ic,val,unit,delta,dir){
  return '<article class="kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+(delta?'<div class="delta '+(dir||"up")+'">'+delta+'</div>':'')+'</article>';
}
function tagFor(s){
  var m={"待評估":"t-warn","待會簽":"t-info","待核准":"t-acc","已放行":"t-good","已駁回":"t-bad","逾期":"t-bad","進行中":"t-info","已關閉":"t-good","高":"t-bad","中":"t-warn","低":"t-good"};
  return '<span class="tag '+(m[s]||"t-info")+'">'+s+'</span>';
}
function chartBox(id,h){return '<div class="cwrap" style="height:'+h+'px"><canvas id="'+id+'"></canvas></div>'}

function s0(){
  var data=[
    ["DV-2408-117","轉軸外殼 A32","L240811-07","尺寸超差","外徑 +0.06mm","1,200","林昱誠","待評估"],
    ["DV-2408-116","密封墊圈 R7","L240810-22","外觀瑕疵","表面刮痕 3處","540","陳品豪","待會簽"],
    ["DV-2408-115","控制板 M9","L240810-05","材料替代","電容改料號","320","黃雅琪","待核准"],
    ["DV-2408-114","齒輪組 G12","L240809-18","製程偏離","熱處理溫差","880","李承翰","已放行"],
    ["DV-2408-113","外殼上蓋 C4","L240809-03","尺寸超差","孔位偏移 0.15","210","林昱誠","已駁回"]
  ];
  var rows=data.map(function(a){return '<tr><td><b>'+a[0]+'</b></td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td><td style="color:var(--info);font-weight:600">'+a[4]+'</td><td style="text-align:right">'+a[5]+'</td><td>'+a[6]+'</td><td>'+tagFor(a[7])+'</td></tr>'}).join("");
  var types=[["尺寸超差",38],["外觀瑕疵",24],["材料替代",16],["製程偏離",14],["文件偏差",8]].map(function(t){
    return '<div class="row"><div class="l"><span class="ic"><span class="material-symbols-outlined">label</span></span><div><b style="font-size:12px">'+t[0]+'</b><div class="mini">占比 '+t[1]+'%</div></div></div><div style="width:42%"><div class="bar"><i style="width:'+t[1]+'%"></i></div></div></div>';
  }).join("");
