<style>
:root{
--color-primary:#0D9488;--color-on-primary:#000;--color-secondary:#14B8A6;
--color-on-secondary:#0F172A;--color-accent:#EA580C;--color-on-accent:#000;
--color-background:#F0FDFA;--color-foreground:#134E4A;--color-card:#FFF;
--color-card-foreground:#134E4A;--color-muted:#E8F1F4;--color-muted-foreground:#475569;
--color-border:#99F6E4;--color-destructive:#DC2626;--color-on-destructive:#FFF;
--color-ring:#0D9488;--blue:#0D9488;--ink:#134E4A;--muted:#475569;--line:#99F6E4;
--ok:#15803D;--warn:#A14505;--info:#075985;--shadow:6px 6px 0 #134E4A
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Plus Jakarta Sans",sans-serif;line-height:1.55}
button{font:inherit}
button,[role=button],.mitem{cursor:pointer}
button:focus-visible,.mitem:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;background:#134E4A;color:#FFF;border-right:4px solid #000;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:2px 4px 22px;border-bottom:2px solid #5EEAD4}
.logo{width:48px;height:48px;display:grid;place-items:center;background:#14B8A6;border:3px solid #000;box-shadow:4px 4px 0 #000;color:#000}
.icon{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.brand h1{margin:0;font-size:17px;font-weight:800}
.brand p{margin:2px 0 0;color:#CCFBF1;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.nav{display:grid;gap:8px;margin-top:22px}
.nav button{width:100%;min-height:48px;border:2px solid #5EEAD4;background:transparent;color:#FFF;text-align:left;padding:10px 11px;display:flex;align-items:center;gap:10px;font-weight:700}
.nav button:hover{background:#0F766E}
.nav button.on{background:#14B8A6;color:#000;border-color:#000;box-shadow:4px 4px 0 #000}
.idx{margin-left:auto;font:700 11px ui-monospace,monospace}
.foot{margin-top:auto;padding-top:15px;border-top:2px solid #5EEAD4;color:#CCFBF1;font-size:11px}
.main{min-width:0;padding:28px clamp(16px,3vw,44px) 54px;background-image:linear-gradient(#CCFBF1 1px,transparent 1px),linear-gradient(90deg,#CCFBF1 1px,transparent 1px);background-size:32px 32px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px;padding:22px;background:#FFF;border:3px solid #134E4A;box-shadow:var(--shadow)}
.top h2{margin:0;display:flex;align-items:center;gap:10px;font-size:clamp(24px,4vw,42px);line-height:1.05;font-weight:800;letter-spacing:-.04em}
.top p{margin:8px 0 0;color:var(--muted);font-size:13px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 10px;border:2px solid #134E4A;background:#E8F1F4;font-size:11px;font-weight:600}
.chip b{font:800 12px ui-monospace,monospace}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:20px}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}
.card,.kpi{min-width:0;background:#FFF;border:3px solid #134E4A;box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 3px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.sub{margin-bottom:16px;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-16px;top:-16px;width:58px;height:58px;background:#14B8A6;border:3px solid #000;transform:rotate(15deg)}
.kpi .ic{width:38px;height:38px;display:grid;place-items:center;background:#99F6E4;border:2px solid #134E4A}
.lab{margin-top:12px;color:var(--muted);font-size:11px;font-weight:700}
.val{font:800 27px ui-monospace,monospace}
.val small{font:700 12px "Plus Jakarta Sans",sans-serif;margin-left:4px}
.dt{margin-top:6px;font-size:11px;font-weight:800}.up{color:#166534}.down{color:#B91C1C}
.mlist{display:grid;gap:9px;max-height:570px;overflow:auto}
.mitem{padding:12px;border:2px solid var(--line);background:#FFF}
.mitem:hover,.mitem.on{border-color:#134E4A;background:#CCFBF1}
.mitem.on{box-shadow:4px 4px 0 #134E4A}
.r1{display:flex;justify-content:space-between;gap:8px}.mt{font-size:13px;font-weight:800}
.md{margin-top:4px;color:var(--muted);font:500 11px ui-monospace,monospace}
.state{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800}
.state:before{content:"";width:8px;height:8px;background:currentColor;border:1px solid #000}
.detail{padding:18px;background:#F0FDFA;border:2px solid #134E4A}
.dh{display:flex;gap:12px;padding-bottom:14px;border-bottom:2px dashed #134E4A}
.dh .av{width:46px;height:46px;display:grid;place-items:center;background:#14B8A6;border:2px solid #000;color:#000}
.dh h4{margin:0;font-size:16px}.dh p{margin:3px 0 0;color:var(--muted);font:500 11px ui-monospace,monospace}
.ai-box{margin-top:13px;padding:13px;background:#FFF;border:2px solid #134E4A;border-left:8px solid #0D9488}
.lbl{margin-bottom:7px;color:#0F766E;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.actrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.actrow:last-child{border:0}.ck{width:19px;height:19px;flex:none;border:2px solid #134E4A;background:#99F6E4}
.tx{font-size:12px}.tx small{color:var(--muted);font:500 10px ui-monospace,monospace}
.note{margin-top:13px;padding:9px;border-left:5px solid #EA580C;background:#FFEDD5;color:#7C2D12;font-size:11px;font-weight:700}
.table-wrap,.scroll{overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:12px}
th{padding:10px;text-align:left;border:2px solid #134E4A;background:#134E4A;color:#FFF;font-size:11px;white-space:nowrap}
td{padding:11px 10px;border:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#F0FDFA}tbody tr:hover{background:#CCFBF1}
td:nth-child(3){font:700 11px ui-monospace,monospace}
.who{display:flex;align-items:center;gap:8px}.av-s{width:29px;height:29px;display:grid;place-items:center;flex:none;border:2px solid #000;background:#14B8A6;color:#000;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:2px solid currentColor;font-size:10px;font-weight:800;white-space:nowrap}
.b-ok{background:#DCFCE7;color:#166534}.b-warn{background:#FFEDD5;color:#9A3412}.b-bad{background:#FEE2E2;color:#B91C1C}.b-info{background:#E0F2FE;color:#075985}.b-gray{background:#E8F1F4;color:#334155}
.pri{font-weight:800}.p-h{color:#B91C1C}.p-m{color:#9A3412}.p-l{color:#475569}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:790px}
.col{padding:10px;background:#E8F1F4;border:2px solid #134E4A}
.ch{display:flex;justify-content:space-between;padding:5px 3px 10px;border-bottom:3px solid #134E4A;font-size:12px;font-weight:800}
.cnt{padding:0 7px;background:#FFF;border:1px solid #134E4A;font:800 11px ui-monospace,monospace}
.tk{margin-top:10px;padding:10px;background:#FFF;border:2px solid #134E4A;border-left:7px solid var(--tone)}
.tk .tt{font-size:12px;font-weight:800}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{padding:2px 6px;background:#CCFBF1;border:1px solid #134E4A;font-size:9px;font-weight:800}
.mrow{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font:600 10px ui-monospace,monospace;color:var(--muted)}
.tl{padding-left:28px;border-left:4px solid #134E4A}
.ev{position:relative;padding:0 0 22px 10px}.ev:before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;background:#FFF;border:3px solid #0D9488}
.ev.bad:before{background:#DC2626}.ev.warn:before{background:#EA580C}
.th{font-size:12px;font-weight:800}.tm{margin-top:3px;font:600 10px ui-monospace,monospace;color:var(--muted)}.td{margin-top:4px;color:var(--muted);font-size:11px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sbox{padding:13px;border:2px solid #134E4A;background:#F0FDFA}.sv{font:800 24px ui-monospace,monospace}.sl{color:var(--muted);font-size:11px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:650px}.cd{text-align:center;font-size:10px;font-weight:800}
.cell{min-height:76px;padding:6px;background:#FFF;border:1px solid #134E4A}.cell.dim{background:#E8F1F4}.cell.today{border:4px solid #0D9488}.dn{font:800 10px ui-monospace,monospace}
.evt{display:block;margin-top:3px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid currentColor;font-size:9px;font-weight:800}
.e-mtg{background:#CCFBF1;color:#115E59}.e-due{background:#FEE2E2;color:#B91C1C}.e-done{background:#DCFCE7;color:#166534}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:10px;font-weight:700}.legend span{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border:1px solid #000}
.rows{display:grid;gap:12px}.srow{display:grid;grid-template-columns:70px 1fr 45px;align-items:center;gap:8px;font-size:11px;font-weight:700}.ba{height:12px;background:#E8F1F4;border:1px solid #134E4A}.ba i{display:block;height:100%;background:#0D9488}.vv{text-align:right;font:800 11px ui-monospace,monospace}.mt16{margin-top:16px}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.card,.kpi{animation:enter .4s cubic-bezier(.2,.9,.3,1.2) both}.card:nth-child(2),.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:4px solid #000}.nav{grid-template-columns:repeat(3,1fr)}.foot{display:none}.grid2,.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.main{padding:16px 12px 40px}.side{padding:16px 12px}.nav{grid-template-columns:repeat(6,1fr);gap:5px}.nav button{justify-content:center;padding:8px}.nav .lbl,.idx{display:none}.top{padding:16px;box-shadow:4px 4px 0 #134E4A}.top h2{font-size:25px}.kpis{grid-template-columns:1fr}.card,.kpi{box-shadow:4px 4px 0 #134E4A}}
</style>
</head>

["Q3 產品上線衝刺會議","08/12 10:00","產品部","6","擷取完成",[["設計團隊確認 v2.3 UI 稿並凍結","王品瑄","08/15","高"],["後端補上金流 webhook 重試機制","陳彥廷","08/16","高"],["整理上線 checklist 給 QA","林曉柔","08/14","中"]],"確認 8/20 上線；金流與 UI 為關鍵路徑，QA 需提前一週介入。"],

["月度營運檢討會","08/10 09:30","營運部","7","擷取完成",[["彙整各部門 KPI 達成率","蔡宜靜","08/16","高"],["規劃 Q4 人力配置草案","周柏翰","08/20","低"]],"整體 KPI 達標 86%，物流成本偏高需專案追蹤。"],

["業務更新報價單並寄客戶","黃冠宇","業務部","08/14","中","已完成","跨部門報價協調會"]

}

}
var SC=[s0,s1,s2,s3,s4,s5];
function draw(i){
if(chart){chart.destroy();chart=null}
document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("on",+b.dataset.i===i);b.setAttribute("aria-current",+b.dataset.i===i?"page":"false")});
var t=TOPS[i];document.getElementById("top").innerHTML='<div><h2>'+icon(NAV[i][0])+t[0]+'</h2><p>'+t[1]+'</p></div><div class="meta">'+t[2].map(function(m){return '<span class="chip">'+m[0]+'：<b>'+m[1]+'</b></span>'}).join("")+'</div>';
screen.innerHTML=SC[i]();if(i===0)pick(0);if(i===1)donut();if(i===3)bars("c3",[2,1,1,1,0,0],["財務","資訊","業務","客服","研發","營運"],"#DC2626");if(i===4)stack();if(i===5)area()
}
function base(type,h){return {chart:{type:type,height:h,toolbar:{show:false},animations:{enabled:false},fontFamily:"Plus Jakarta Sans"},dataLabels:{enabled:false},grid:{borderColor:"#99F6E4"},stroke:{width:3},legend:{position:"bottom"}}}

function bars(id,data,cats,color){var o=base("bar",220);o.series=[{name:"逾期",data:data}];o.xaxis={categories:cats};o.colors=[color];o.plotOptions={bar:{columnWidth:"52%",borderRadius:0}};chart=new ApexCharts(document.querySelector("#"+id),o);chart.render()}
function stack(){var o=base("bar",270);o.chart.stacked=true;o.series=[{name:"已結案",data:[5,7,6,8,9,10]},{name:"進行中",data:[3,2,3,2,2,2]},{name:"逾期",data:[2,1,1,1,1,0]}];o.xaxis={categories:["第1週","第2週","第3週","第4週","第5週","第6週"]};o.colors=["#15803D","#0D9488","#DC2626"];chart=new ApexCharts(document.querySelector("#c4"),o);chart.render()}
function area(){var o=base("area",270);o.series=[{name:"任務準時率 %",data:[64,68,73,77,82,86]}];o.xaxis={categories:["第1週","第2週","第3週","第4週","第5週","第6週"]};o.yaxis={min:50,max:100};o.colors=["#0D9488"];o.fill={type:"solid",opacity:.18};o.stroke={curve:"straight",width:4};chart=new ApexCharts(document.querySelector("#c5"),o);chart.render()}
document.getElementById("nav").innerHTML=NAV.map(function(n,i){return '<button type="button" data-i="'+i+'" onclick="location.hash=\'v'+i+'\'">'+icon(n[0])+'<span class="lbl">'+n[1]+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),i=m?Math.min(+m[1],5):0;draw(i);try{scrollTo(0,0)}catch(e){}}
addEventListener("hashchange",fromHash);fromHash();
</script>
