:root{

  --bg:#f6f4fb; --panel:#ffffff; --ink:#1e1630; --muted:#71708a;
  --line:#ece8f5; --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#2563eb;
  --shadow:0 6px 22px rgba(80,40,140,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.min0{min-width:0}
.side{width:246px;flex:none;background:linear-gradient(180deg,#2a1147,#3d1a63);color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(147,51,234,.5)}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;color:#c9b8e6;font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;border-radius:11px;background:transparent;color:#d9cbef;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;width:100%}
.nav button .material-symbols-outlined{font-size:21px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(147,51,234,.4)}
.nav .idx{margin-left:auto;font-size:11px;opacity:.55;font-weight:700}
.side .foot{margin-top:auto;font-size:11px;color:#b9a6dc;padding:8px;border-top:1px solid rgba(255,255,255,.12)}
.main{flex:1;min-width:0;padding:24px 28px 48px;overflow-x:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top .tt h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px}
.top .tt h2 .material-symbols-outlined{color:var(--accent);font-size:26px}
.top .tt p{font-size:13px;color:var(--muted);margin-top:3px}
.top .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.chip .material-symbols-outlined{font-size:16px;color:var(--accent)}
.chip b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft)}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.kpi .ic .material-symbols-outlined{font-size:22px}
.kpi .lab{font-size:12px;color:var(--muted);margin-top:11px;font-weight:600}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .dt{font-size:11px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent)}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow-y:auto;padding-right:2px}
.mitem{border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;transition:.15s;background:#fff;min-width:0}
.mitem:hover{border-color:var(--accent2);background:var(--accent-soft)}
.mitem.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 14px rgba(147,51,234,.15)}
.mitem .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mitem .mt{font-size:13.5px;font-weight:700}
.mitem .md{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.mitem .md .material-symbols-outlined{font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.detail{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(180deg,#fbf8ff,#fff)}
.detail .dh{display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--line);margin-bottom:14px}
.detail .dh .av{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.detail .dh h4{font-size:16px;font-weight:800}
.detail .dh p{font-size:12px;color:var(--muted);margin-top:2px}
.ai-box{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.ai-box .lbl{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.5px;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.ai-box .lbl .material-symbols-outlined{font-size:15px}
.actrow{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.actrow:last-child{border-bottom:0}
.actrow .ck{width:19px;height:19px;border-radius:6px;border:2px solid var(--accent2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.actrow .ck .material-symbols-outlined{font-size:14px;color:var(--accent)}
.actrow .tx{font-size:13px;min-width:0}
.actrow .tx small{color:var(--muted);font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap;background:#faf8fe}
td{padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#faf8fe}
.who{display:flex;align-items:center;gap:8px}
.av-s{width:28px;height:28px;border-radius:8px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge .material-symbols-outlined{font-size:13px}
.b-ok{background:#e7f8ee;color:#128a45}
.b-warn{background:#fef3e0;color:#c67d0b}
.b-bad{background:#fde8ee;color:#c81e46}
.b-info{background:#e7eefe;color:#2154c9}
.b-gray{background:#eeecf4;color:#6a6880}
.pri{font-weight:800;font-size:12px}
.p-h{color:var(--bad)} .p-m{color:var(--warn)} .p-l{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:760px}
.col{background:#faf8fe;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;padding:4px 6px 10px;margin-bottom:4px;border-bottom:2px solid var(--line)}
.col .ch .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 2px 6px rgba(80,40,140,.05);border-left:3px solid var(--accent2)}
.tk .tt{font-size:12.5px;font-weight:700;line-height:1.4}
.tk .mrow{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.tk .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px 6px}
.tl .ev::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev.bad::before{border-color:var(--bad)}
.tl .ev.warn::before{border-color:var(--warn)}
.tl .ev .th{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .ev .tm{font-size:11px;color:var(--muted);font-weight:600}
.tl .ev .td{font-size:12px;color:var(--muted);margin-top:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:640px}
.cal .cd{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
.cell{border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px;background:#fff;min-width:0;display:flex;flex-direction:column;gap:3px}
.cell.dim{background:#faf9fc}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset}
.cell .dn{font-size:11px;font-weight:700}
.evt{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-mtg{background:#ede4fb;color:#7a29c4}
.e-due{background:#fde8ee;color:#c81e46}
.e-done{background:#e7f8ee;color:#128a45}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.rows{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:11px}
.srow .nm{font-size:12.5px;font-weight:600;width:96px;flex:none}
.srow .ba{flex:1;height:9px;border-radius:99px;background:#eee7f6;overflow:hidden;min-width:0}
.srow .ba i{display:block;height:100%;border-radius:99px}
.srow .vv{font-size:12px;font-weight:800;width:44px;text-align:right;flex:none}
.mt16{margin-top:16px}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:6px}
.note .material-symbols-outlined{font-size:15px;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.sbox{border:1px solid var(--line);border-radius:12px;padding:13px;background:#faf8fe;min-width:0}
.sbox .sv{font-size:22px;font-weight:800}
.sbox .sl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
@media(max-width:860px){
  .side{width:100%;height:auto;position:static;flex-direction:column}
  .app{flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;flex:none;white-space:nowrap}
  .nav .idx{display:none}
  .side .foot{display:none}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.split,.statgrid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .lbl-t{display:none}
  .nav button{padding:10px}
  .main{padding:18px 14px 40px}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>

function stBadge(st){
  if(st==="已完成")return '<span class="badge b-ok"><span class="material-symbols-outlined">check_circle</span>已完成</span>';
  if(st==="進行中")return '<span class="badge b-info"><span class="material-symbols-outlined">bolt</span>進行中</span>';
  if(st==="逾期")return '<span class="badge b-bad"><span class="material-symbols-outlined">error</span>逾期</span>';

function priCls(p){return p==="高"?"p-h":p==="中"?"p-m":"p-l";}

  var rows=MEETINGS.map(function(m,i){
    return '<div class="mitem'+(i===0?' on':'')+'" data-mi="'+i+'" onclick="pickMtg('+i+')">'+
      '<div class="r1"><div class="mt">'+m.t+'</div><span class="dot" style="background:'+m.c+'"></span></div>'+
      '<div class="md"><span class="material-symbols-outlined">schedule</span>'+m.time+' · '+m.owner+' · '+m.n+' 待辦</div>'+
    '</div>';
  }).join("");
  return '<div class="split">'+
    '<div class="card"><h3><span class="material-symbols-outlined">event_note</span>會議清單</h3>'+
      '<div class="sub">本週共 12 場，已 AI 擷取重點</div>'+
      '<div class="mlist">'+rows+'</div></div>'+
    '<div class="card min0"><h3><span class="material-symbols-outlined">summarize</span>擷取結果</h3>'+
      '<div class="sub">AI 從逐字稿產生的重點與待辦，可逐條確認</div>'+
      '<div id="mtgDetail"></div></div>'+
  '</div>';
}
function pickMtg(i){
  var m=MEETINGS[i];
  document.querySelectorAll("[data-mi]").forEach(function(n){n.classList.toggle("on",+n.getAttribute("data-mi")===i);});
  var acts=m.items.map(function(a){
    return '<div class="actrow"><div class="ck"><span class="material-symbols-outlined">check</span></div>'+
      '<div class="tx min0"><div>'+a[0]+'</div><small>負責人 '+a[1]+' · 期限 '+a[2]+' · '+
      '<b class="'+priCls(a[3])+'">'+a[3]+'優先</b></small></div></div>';
  }).join("");
  var d=document.getElementById("mtgDetail");
  if(!d)return;
  d.innerHTML='<div class="detail">'+
    '<div class="dh"><div class="av"><span class="material-symbols-outlined">record_voice_over</span></div>'+
      '<div class="min0"><h4>'+m.t+'</h4><p>'+m.time+'　·　主辦 '+m.owner+'　·　狀態 '+m.st+'</p></div></div>'+
    '<div class="ai-box"><div class="lbl"><span class="material-symbols-outlined">auto_awesome</span>AI 會議摘要</div>'+m.sum+'</div>'+
    '<div class="ai-box"><div class="lbl"><span class="material-symbols-outlined">checklist</span>擷取待辦（'+m.items.length+'）</div>'+acts+'</div>'+
    '<div class="note"><span class="material-symbols-outlined">info</span>確認後即進入「待辦指派」流程，設定負責人與期限。</div>'+
  '</div>';
}
function s1(){

function s2(){
  var cols=[["待處理","待處理","#94a3b8"],["進行中","進行中","#2563eb"],["逾期","逾期","#e11d48"],["已完成","已完成","#16a34a"]];
  var board=cols.map(function(c){
    var list=TASKS.filter(function(t){return t.st===c[1];});
    var cards=list.map(function(t){
      return '<div class="tk" style="border-left-color:'+c[2]+'"><div class="tt">'+t.t+'</div>'+
        '<div class="tags"><span class="tag">'+t.dep+'</span><span class="tag" style="background:#f3e9ff">'+t.pri+'優先</span></div>'+
        '<div class="mrow"><span style="font-size:11px;color:var(--muted);font-weight:600"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px">event</span> '+t.due+'</span>'+
        '<span class="av-s" style="width:24px;height:24px;background:'+c[2]+'">'+t.who.slice(0,1)+'</span></div></div>';
    }).join("")||'<div style="font-size:11px;color:var(--muted);padding:8px 4px">目前無項目</div>';
    return '<div class="col"><div class="ch"><span style="color:'+c[2]+'">'+c[0]+'</span><span class="cnt">'+list.length+'</span></div>'+cards+'</div>';
  }).join("");

    '<div class="sub">依狀態追蹤每筆待辦進度（示意）</div>'+

    '<div class="note"><span class="material-symbols-outlined">rule</span>RULE-02：影響客戶上線且期限在兩天內者優先。</div></div>';
}

        '<div class="sbox"><div class="sv" style="color:var(--warn)">7</div><div class="sl">今明到期</div></div>'+
        '<div class="sbox"><div class="sv" style="color:var(--accent)">2</div><div class="sl">已升級主管</div></div>'+

function s4(){

    11:[["e-mtg","客服週會"],["e-due","客訴彙整"]],
    12:[["e-mtg","上線衝刺"],["e-mtg","報價協調"]],
    13:[["e-due","VPN 憑證"],["e-due","折扣核准"]],
    14:[["e-done","報價單"],["e-due","checklist"]],
    15:[["e-due","UI 凍結"]],16:[["e-due","webhook"],["e-due","KPI"]],
    18:[["e-mtg","下週例會"]],20:[["e-due","人力草案"]],22:[["e-due","主視覺"]],25:[["e-due","釣魚演練"]]
  };
  for(var a=0;a<start;a++)cells.push('<div class="cell dim"></div>');
  for(var d=1;d<=days;d++){
    var ev=evtMap[d]||[];
    var evh=ev.map(function(e){return '<span class="evt '+e[0]+'">'+e[1]+'</span>';}).join("");

  }
  var wk=["日","一","二","三","四","五","六"].map(function(w){return '<div class="cd">'+w+'</div>';}).join("");

    '<div class="card min0"><h3><span class="material-symbols-outlined">calendar_month</span>2026 年 8 月會議日程</h3>'+
      '<div class="sub">會議、待辦到期與結案分布一覽</div>'+
      '<div style="overflow-x:auto"><div class="cal">'+wk+cells.join("")+'</div></div>'+
      '<div class="legend"><span><span class="dot" style="background:#7a29c4"></span>會議</span>'+
      '<span><span class="dot" style="background:#c81e46"></span>待辦到期</span>'+
      '<span><span class="dot" style="background:#128a45"></span>已結案</span></div></div>'+

  '</div>';
}

function kpi(ic,lab,val,unit,dir,dt){
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+'<small>'+unit+'</small></div>'+
    '<div class="dt '+dir+'"><span class="material-symbols-outlined" style="font-size:14px">'+(dir==="up"?"arrow_upward":"arrow_downward")+'</span>'+dt+'</div></div>';
}
function c5(){

    yaxis:{min:50,max:100,labels:{style:{fontSize:"11px"}}},markers:{size:4,colors:["#9333ea"]}
  });chart.render();
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var INITS=[null,c1,null,c3,c4,c5];
var afterPick=[function(){pickMtg(0);},null,null,null,null,null];

function show(i){
  killChart();
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var tp=TOPS[i];
  document.getElementById("top").innerHTML=
    '<div class="tt"><h2><span class="material-symbols-outlined">'+NAV[i].i+'</span>'+tp.t+'</h2><p>'+tp.d+'</p></div>'+
    '<div class="meta">'+tp.m.map(function(x){return '<span class="chip"><span class="material-symbols-outlined">'+x[0]+'</span>'+x[1]+'：<b>'+x[2]+'</b></span>';}).join("")+'</div>';
  el.innerHTML=SCREENS[i]();
  void el.offsetHeight;
  if(afterPick[i])afterPick[i]();
  if(INITS[i])INITS[i]();
}
(function(){
  document.getElementById("nav").innerHTML=NAV.map(function(n,i){
    return '<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+n.i+'</span><span class="lbl-t">'+n.t+'</span><span class="idx">'+i+'</span></button>';
  }).join("");
  show(0);
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
