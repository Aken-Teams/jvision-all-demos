<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交期協同管理 Delivery & Lead Time Coordination｜Jvision 系統 Demo</title>
  <meta name="description" content="交期承諾與產能即時對接、交期異常自動告警、客戶交期變更協調" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#9333ea;--accent2:#c084fc;--accent-soft:#f5edff;
      --ink:#1e1630;--muted:#6b6480;--line:#ece7f4;--bg:#f6f4fb;--card:#ffffff;
      --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .app{max-width:1360px;margin:0 auto;padding:0 16px 48px;}
    /* header */
    .top{display:flex;align-items:center;gap:14px;padding:16px 4px 12px;flex-wrap:wrap;min-width:0;}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;}
    .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:0 6px 18px rgba(147,51,234,.32);}
    .logo .ms{font-size:26px;}
    .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px;}
    .brand p{font-size:12px;margin:2px 0 0;color:var(--muted);font-weight:500;}
    .top-meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;}
    .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;}
    .pill .ms{font-size:15px;color:var(--accent);}
    .pill b{color:var(--ink);}
    /* nav */
    .nav{display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 16px;min-width:0;}
    .nav button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:11px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;min-width:0;}
    .nav button .ms{font-size:18px;}
    .nav button .idx{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;font-weight:800;}
    .nav button:hover{border-color:var(--accent2);color:var(--accent);}
    .nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(147,51,234,.28);}
    .nav button.on .idx{background:rgba(255,255,255,.24);color:#fff;}
    .nav button.on .ms{color:#fff;}
    /* screen framing */
    .scr-head{display:flex;align-items:flex-end;gap:12px;margin:2px 4px 14px;flex-wrap:wrap;min-width:0;}
    .scr-head .t{min-width:0;}
    .scr-head h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;}
    .scr-head h2 .ms{color:var(--accent);font-size:24px;}
    .scr-head p{margin:5px 0 0;color:var(--muted);font-size:13px;font-weight:500;}
    .scr-head .tag{margin-left:auto;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;white-space:nowrap;}
    /* cards / grids */
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
    .card-h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:800;}
    .card-h .ms{font-size:19px;color:var(--accent);}
    .card-h .sub{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    .kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0;position:relative;overflow:hidden;}
    .kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:52px;height:52px;border-radius:50%;background:var(--accent-soft);}
    .kpi .lb{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;position:relative;z-index:1;}
    .kpi .lb .ms{font-size:16px;color:var(--accent);}
    .kpi .v{font-size:26px;font-weight:900;margin-top:7px;position:relative;z-index:1;}
    .kpi .v small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px;}
    .kpi .d{font-size:11px;font-weight:700;margin-top:4px;position:relative;z-index:1;}
    .up{color:var(--ok);}.down{color:var(--bad);}
    /* split workspace signature */
    .split{display:grid;grid-template-columns:340px 1fr;gap:14px;min-width:0;}
    .listpane{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;}
    .lp-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--muted);margin-bottom:10px;}
    .lp-search .ms{font-size:17px;}
    .lrow{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;min-width:0;}
    .lrow:hover{border-color:var(--accent2);}
    .lrow.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 12px rgba(147,51,234,.12);}
    .lrow .r1{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0;}
    .lrow .oid{font-size:13px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .lrow .cust{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;}
    .lrow .r3{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
    .detpane{min-width:0;display:flex;flex-direction:column;gap:14px;}
    /* badges */
    .bdg{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
    .b-ok{background:#e7f6ec;color:var(--ok);}
    .b-warn{background:#fdf0dd;color:var(--warn);}
    .b-bad{background:#fbe4e4;color:var(--bad);}
    .b-info{background:#e5edfb;color:var(--info);}
    .b-mut{background:#efecf5;color:var(--muted);}
    .b-acc{background:var(--accent-soft);color:var(--accent);}
    /* tables */
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
    th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    .tw{font-weight:800;}
    .scroll{overflow-x:auto;}
    /* progress bar */
    .pbar{height:8px;border-radius:6px;background:#eee7f5;overflow:hidden;min-width:60px;}
    .pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    /* two-col & three-col */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0;}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .g-chart{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;min-width:0;}
    .chart-box{overflow:hidden;min-width:0;}
    /* board (kanban) */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
    .bcol{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
    .bcol h4{margin:0 0 10px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;}
    .bcol h4 .n{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;}
    .bcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent);min-width:0;}
    .bcard .bt{font-size:12.5px;font-weight:800;}
    .bcard .bs{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}
    .bcard.sev-bad{border-left-color:var(--bad);}
    .bcard.sev-warn{border-left-color:var(--warn);}
    .bcard.sev-info{border-left-color:var(--info);}
    /* timeline */
    .tl{position:relative;padding-left:22px;}
    .tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tli{position:relative;padding:0 0 16px 6px;}
    .tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
    .tli.done::before{background:var(--accent);border-color:var(--accent);}
    .tli.now::before{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
    .tli .tt{font-size:13px;font-weight:800;}
    .tli .td{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;}
    .tli .tm{font-size:11px;color:var(--accent);font-weight:700;}
    /* capacity load rows */
    .cap-row{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0;}
    .cap-row:last-child{border-bottom:none;}
    .cap-name{font-size:12.5px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .cap-track{height:20px;border-radius:6px;background:#f0ecf7;overflow:hidden;position:relative;min-width:0;}
    .cap-track i{display:block;height:100%;}
    .cap-pct{font-size:12px;font-weight:800;text-align:right;}
    /* def list */
    .dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
    .dl .k{font-size:11px;color:var(--muted);font-weight:700;}
    .dl .val{font-size:13.5px;font-weight:800;margin-top:2px;}
    /* misc */
    .note{background:var(--accent-soft);border:1px solid #e6d6fb;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#5a3a86;font-weight:600;display:flex;gap:9px;align-items:flex-start;}
    .note .ms{color:var(--accent);font-size:19px;flex:0 0 auto;}
    .actbar{display:flex;gap:8px;flex-wrap:wrap;}
    .btn{border:none;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn .ms{font-size:17px;}
    .btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 5px 14px rgba(147,51,234,.28);}
    .btn-g{background:#fff;border:1px solid var(--line);color:var(--muted);}
    .stat-line{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);}
    .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;font-weight:600;}
    .msg{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;}
    .msg .av{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
    .msg .bub{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;}
    .msg .bub .mn{font-size:11px;font-weight:800;color:var(--accent);}
    .msg .bub .mx{font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.5;}
    .msg .bub .mt{font-size:10.5px;color:var(--muted);margin-top:5px;font-weight:600;}
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr;}
      .split{grid-template-columns:1fr;}
      .g2,.g-chart{grid-template-columns:1fr;}
      .g3{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr 1fr;}
      .dl{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .nav button .txt{display:none;}
      .board{grid-template-columns:1fr;}
      .top-meta{display:none;}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo"><span class="ms">fact_check</span></div>
        <div>
          <h1>交期協同管理 <span style="font-weight:600;color:var(--muted);font-size:13px">Delivery &amp; Lead Time Coordination</span></h1>
          <p>交期承諾與產能即時對接 · 異常自動告警 · 客戶交期協調</p>
        </div>
      </div>
      <div class="top-meta">
        <span class="pill"><span class="ms">groups</span>業務部 · PMC · 業務助理</span>
        <span class="pill"><span class="ms">verified</span>OTD <b>96.4%</b></span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div id="scr"></div>
    <div class="foot">交期協同管理 Delivery &amp; Lead Time Coordination · Jvision 系統 Demo · 純前端展示假資料</div>
  </div>

  <script>
  (function(){
    "use strict";
    var charts=[];
    function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function mount(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
    var baseAnim={enabled:false};

    var NAV=[
      {ic:"fact_check",t:"交期承諾中心"},
      {ic:"account_tree",t:"產銷排程同步"},
      {ic:"monitoring",t:"生產進度監控"},
      {ic:"warning",t:"交期異常告警"},
      {ic:"groups",t:"客戶交期協調"},
      {ic:"insights",t:"OTD 績效儀表"}
    ];

    /* ---------- data ---------- */
    var orders=[
      {id:"SO-24817",cust:"台達精密 Delta",part:"連接器模組 CN-88",qty:12000,req:"08/22",ctp:"08/20",gap:2,status:"可承諾",sev:"ok",load:78,line:"SMT-A"},
      {id:"SO-24820",cust:"和碩聯合 Pegatron",part:"散熱基板 HB-42",qty:6400,req:"08/18",ctp:"08/21",gap:-3,status:"產能不足",sev:"bad",line:"CNC-2"},
      {id:"SO-24825",cust:"友達光電 AUO",part:"背光導板 LG-7",qty:20000,req:"08/26",ctp:"08/25",gap:1,status:"可承諾",sev:"ok",load:64,line:"注塑-3"},
      {id:"SO-24831",cust:"廣達電腦 Quanta",part:"機殼沖壓件 MC-15",qty:8800,req:"08/19",ctp:"08/20",gap:-1,status:"需協調",sev:"warn",line:"沖壓-1"},
      {id:"SO-24836",cust:"研華科技 Advantech",part:"控制板 PCBA-9",qty:3200,req:"08/24",ctp:"08/23",gap:1,status:"可承諾",sev:"ok",load:52,line:"SMT-B"},
      {id:"SO-24840",cust:"鴻海精密 Foxconn",part:"線束總成 WH-30",qty:15000,req:"08/17",ctp:"08/22",gap:-5,status:"產能不足",sev:"bad",line:"組裝-2"}
    ];

    var lines=[
      {name:"SMT-A",load:78,cap:"3.2萬/日",cl:"var(--ok)"},
      {name:"SMT-B",load:52,cap:"2.8萬/日",cl:"var(--ok)"},
      {name:"CNC-2",load:104,cap:"0.9萬/日",cl:"var(--bad)"},
      {name:"注塑-3",load:64,cap:"4.5萬/日",cl:"var(--ok)"},
      {name:"沖壓-1",load:91,cap:"1.6萬/日",cl:"var(--warn)"},
      {name:"組裝-2",load:112,cap:"1.2萬/日",cl:"var(--bad)"}
    ];

    var wo=[
      {id:"WO-5521",so:"SO-24817",part:"連接器模組 CN-88",stage:"貼片",prog:82,plan:"08/20",eta:"08/20",sev:"ok"},
      {id:"WO-5524",so:"SO-24820",part:"散熱基板 HB-42",stage:"CNC 加工",prog:38,plan:"08/18",eta:"08/21",sev:"bad"},
      {id:"WO-5528",so:"SO-24825",part:"背光導板 LG-7",stage:"注塑",prog:66,plan:"08/25",eta:"08/25",sev:"ok"},
      {id:"WO-5531",so:"SO-24831",part:"機殼沖壓件 MC-15",stage:"沖壓",prog:54,plan:"08/19",eta:"08/20",sev:"warn"},
      {id:"WO-5536",so:"SO-24836",part:"控制板 PCBA-9",stage:"AOI 檢測",prog:90,plan:"08/23",eta:"08/23",sev:"ok"},
      {id:"WO-5540",so:"SO-24840",part:"線束總成 WH-30",stage:"組裝",prog:29,plan:"08/17",eta:"08/22",sev:"bad"}
    ];

    var alerts=[
      {t:"組裝-2 產能超載 112%",so:"SO-24840",lvl:"L1 緊急",sev:"bad",owner:"林品豪 PMC",age:"14 分鐘前",risk:"延遲 5 日",act:"派工升級"},
      {t:"CNC-2 交期落後 3 日",so:"SO-24820",lvl:"L1 緊急",sev:"bad",owner:"陳映蓉 業務",age:"38 分鐘前",risk:"延遲 3 日",act:"客戶協調"},
      {t:"沖壓-1 交期時窗將至",so:"SO-24831",lvl:"L2 警示",sev:"warn",owner:"王國棟 PMC",age:"1 小時前",risk:"延遲 1 日",act:"加班補產"},
      {t:"物料到料延遲 導板膜",so:"SO-24825",lvl:"L3 提醒",sev:"info",owner:"李佳穎 助理",age:"2 小時前",risk:"風險觀察",act:"追料"}
    ];

    var thread=[
      {who:"業務",nm:"陳映蓉 業務專員",x:"和碩 HB-42 產能不足 3 日，已試算兩個替代交期，稍後同步客戶。",t:"09:12",cl:"var(--accent)"},
      {who:"PMC",nm:"林品豪 PMC",x:"CNC-2 建議切分兩批：首批 3200 pcs 可 08/19 交，餘量 08/21 補齊。",t:"09:24",cl:"var(--info)"},
      {who:"客戶",nm:"和碩 採購 · 張經理",x:"首批 08/19 可接受，餘量請務必 08/21 前到廠，否則影響產線。",t:"10:03",cl:"var(--warn)"},
      {who:"業務",nm:"陳映蓉 業務專員",x:"已鎖定分批交期並回填系統，變更通知單 CO-3391 已寄出。",t:"10:15",cl:"var(--accent)"}
    ];

    /* ---------- screen renderers ---------- */
    function sevBadge(sev,txt){
      var m={ok:"b-ok",warn:"b-warn",bad:"b-bad",info:"b-info"};
      return '<span class="bdg '+(m[sev]||"b-mut")+'">'+esc(txt)+'</span>';
    }
    function scrHead(ic,t,d,tag){
      return '<div class="scr-head"><div class="t"><h2><span class="ms">'+ic+'</span>'+esc(t)+'</h2><p>'+esc(d)+'</p></div><span class="tag">'+esc(tag)+'</span></div>';
    }

    var selOrder=0;
    function screen0(){
      var h=scrHead("fact_check","交期承諾中心","以 ATP／CTP 即時試算可承諾交期，於左側訂單清單挑選、右側回覆客戶。","訂單交期承諾");
      h+='<div class="split">';
      // list pane
      h+='<div class="listpane"><div class="lp-search"><span class="ms">search</span>搜尋訂單 / 客戶 / 料號</div>';
      for(var i=0;i<orders.length;i++){
        var o=orders[i];
        h+='<div class="lrow'+(i===selOrder?' on':'')+'" data-o="'+i+'"><div class="r1"><span class="oid">'+esc(o.id)+'</span>'+sevBadge(o.sev,o.status)+'</div><div class="cust">'+esc(o.cust)+' · '+esc(o.part)+'</div><div class="r3"><span class="bdg b-mut">需求 '+o.req+'</span><span class="bdg b-acc">CTP '+o.ctp+'</span></div></div>';
      }
      h+='</div>';
      // detail pane
      h+='<div class="detpane" id="detp"></div>';
      h+='</div>';
      document.getElementById("scr").innerHTML=h;
      bindOrderRows();
      renderOrderDetail();
    }
    function bindOrderRows(){
