    :root{

      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#059669;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#0f172a;
      --color-card:#fff;
      --color-card-foreground:#0f172a;
      --color-muted:#f1f5fd;
      --color-muted-foreground:#475569;
      --color-border:#e4ecfc;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#0f172a;
      --muted:#475569;
      --line:#e4ecfc;

      --warn:#a15c00;
      --bad:#dc2626;
      --info:#1d4ed8;
      --bg:#f8fafc;

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--color-foreground);font-family:"Fira Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,.lrow:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
    .mono,.oid,.tw,time,td:nth-child(2),td:nth-child(5),td:nth-child(6),td:nth-child(7){font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .app{max-width:1440px;margin:auto;padding:0 20px 44px}
    .top{display:flex;align-items:center;gap:18px;padding:20px 0 15px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:8px;background:var(--blue);color:#fff}
    .logo .ms{font-size:25px}
    .brand h1{margin:0;font-size:18px;line-height:1.25;font-weight:700}
    .brand h1 span{color:var(--muted);font-size:13px;font-weight:500}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .top-meta{display:flex;align-items:center;gap:8px;margin-left:auto}
    .pill{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);font-size:12px}
    .pill .ms{color:var(--blue);font-size:16px}
    .pill b{color:var(--ink)}
    .nav{display:flex;gap:4px;margin:16px 0 22px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow-x:auto}
    .nav button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;flex:1 0 auto;padding:8px 12px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
    .nav button:hover{background:var(--color-muted);color:var(--blue)}
    .nav button.on{background:var(--blue);color:#fff}
    .nav button .ms{font-size:18px}
    .idx{display:grid;place-items:center;min-width:19px;height:19px;padding:0 4px;border:1px solid currentColor;border-radius:4px;font-family:"Fira Code",monospace;font-size:10px}
    .scr-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
    .scr-head h2{display:flex;align-items:center;gap:9px;margin:0;font-size:22px;line-height:1.2}
    .scr-head h2 .ms{color:var(--blue)}
    .scr-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .tag{margin-left:auto;padding:6px 10px;border:1px solid #bfdbfe;border-radius:5px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700;white-space:nowrap}
    .card,.listpane{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
    .card{padding:15px}
    .card-h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:700}
    .card-h .ms{color:var(--blue);font-size:19px}
    .card-h .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .kpi{position:relative;min-width:0;padding:14px;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:7px;background:#fff}
    .kpi .lb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:500}
    .kpi .lb .ms{color:var(--blue);font-size:17px}

    .lp-search{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--muted);font-size:12px}
    .lrow{margin-bottom:7px;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;transition:background-color .18s ease,border-color .18s ease}
    .lrow[role=button]{cursor:pointer}
    .lrow:hover{border-color:#93c5fd;background:#f8fbff}
    .lrow.on{border-color:var(--blue);background:#eff6ff}
    .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .oid{overflow:hidden;font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .cust{margin-top:4px;color:var(--muted);font-size:12px}
    .r3{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .detpane{display:flex;min-width:0;flex-direction:column;gap:12px}
    .bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:4px;font-size:10.5px;font-weight:700;white-space:nowrap}
    .bdg::before{font-family:"Material Symbols Outlined";font-size:13px;font-weight:400}
    .b-ok{background:#ecfdf5;color:#047857}.b-ok::before{content:"check_circle"}
    .b-warn{background:#fffbeb;color:#925300}.b-warn::before{content:"schedule"}
    .b-bad{background:#fef2f2;color:#b91c1c}.b-bad::before{content:"error"}
    .b-info{background:#eff6ff;color:#1d4ed8}.b-info::before{content:"info"}
    .b-mut{background:#f8fafc;color:#475569}.b-mut::before{content:"label"}
    .b-acc{background:#ecfdf5;color:#047857}.b-acc::before{content:"event_available"}
    .scroll{overflow-x:auto}
    table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
    th{padding:9px 10px;border-bottom:2px solid var(--line);background:var(--color-muted);color:#334155;font-size:10.5px;font-weight:700;text-align:left;white-space:nowrap}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr:hover{background:#f8fbff}
    tbody tr:last-child td{border-bottom:0}
    td:nth-child(n+2){font-variant-numeric:tabular-nums}
    .tw{font-weight:700}
    .pbar{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:#dbeafe}
    .pbar i{display:block;height:100%;background:var(--blue)}
    .g-chart{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .bcol{min-width:0;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
    .bcol h4{display:flex;align-items:center;gap:6px;margin:0 0 9px;font-size:12px}
    .bcol h4 .n{margin-left:auto;padding:1px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;font-family:"Fira Code",monospace;font-size:10px}
    .bcard{margin-bottom:8px;padding:10px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:5px;background:#fff}
    .bcard.sev-bad{border-left-color:var(--bad)}.bcard.sev-warn{border-left-color:var(--warn)}.bcard.sev-info{border-left-color:var(--info)}.bcard.sev-ok{border-left-color:var(--ok)}
    .bt{font-size:12px;font-weight:700}.bs{margin-top:4px;color:var(--muted);font-size:10.5px}
    .tl{position:relative;padding-left:22px}
    .tl::before{position:absolute;top:5px;bottom:5px;left:7px;width:2px;background:var(--line);content:""}
    .tli{position:relative;padding:0 0 17px 7px}
    .tli::before{position:absolute;top:3px;left:-19px;width:10px;height:10px;border:2px solid #93c5fd;border-radius:50%;background:#fff;content:""}
    .tli.done::before{border-color:var(--ok);background:var(--ok)}
    .tli.now::before{border-color:var(--blue);background:#fff;outline:3px solid #dbeafe}
    .tt{font-size:12px;font-weight:700}.td{margin-top:3px;color:var(--muted);font-size:11px}.tm{margin-top:2px;color:var(--blue);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
    .cap-row{display:grid;grid-template-columns:105px 1fr 60px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
    .cap-row:last-child{border-bottom:0}.cap-name{overflow:hidden;font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .cap-track{height:18px;overflow:hidden;border-radius:3px;background:#e2e8f0}.cap-track i{display:block;height:100%}
    .cap-pct{text-align:right;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
    .dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
    .dl .k{color:var(--muted);font-size:10.5px;font-weight:600}.dl .val{margin-top:3px;font-size:13px;font-weight:700}
    .note{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:5px;background:#eff6ff;color:#1e3a5f;font-size:12px;line-height:1.5}
    .note .ms{color:var(--blue);font-size:18px}
    .actbar{display:flex;flex-wrap:wrap;gap:7px}
    .btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 12px;border:1px solid transparent;border-radius:5px;font-size:12px;font-weight:700;transition:background-color .18s ease,border-color .18s ease,color .18s ease}
    .btn .ms{font-size:17px}.btn-p{background:var(--color-accent);color:#fff}.btn-p:hover{background:#047857}.btn-g{border-color:var(--line);background:#fff;color:#334155}.btn-g:hover{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}
    .msg{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px}
    .av{display:grid;place-items:center;width:33px;height:33px;flex:none;border-radius:5px;color:#fff;font-size:10px;font-weight:700}
    .bub{min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
    .mn{color:var(--blue);font-size:10.5px;font-weight:700}.mx{margin-top:3px;font-size:12px;line-height:1.5}.mt{margin-top:5px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
    .foot{margin-top:25px;color:var(--muted);font-size:10.5px;text-align:center}
    .reveal{animation:reveal .35s ease both}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
      .reveal{animation:none}
    }
    @media(max-width:1024px){.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:768px){
      .app{padding-inline:14px}.top{align-items:flex-start}.top-meta{display:none}.brand h1 span{display:block;margin-top:3px}
      .kpis{grid-template-columns:repeat(2,1fr)}.split,.g-chart{grid-template-columns:1fr}.scr-head{align-items:flex-start}.tag{margin-left:0}.scr-head{flex-wrap:wrap}
    }
    @media(max-width:520px){
      .app{padding-inline:10px}.brand p{display:none}.nav{margin-top:12px}.nav button{min-width:45px;padding-inline:9px}.nav .txt{display:none}
      .kpis,.board{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.card{padding:12px}.scr-head h2{font-size:19px}
    }
  </style>
</head>
