<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jvision 品牌網店設計平台</title>
<meta name="description" content="拖曳式頁面設計、商品上架、表單、SEO 與訂單管理"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --accent:#EA580C;
  --accent2:#10B981;
  --bg:#ECFDF5;
  --card:#FFFFFF;
  --sub:#475569;
  --dark:#052E26;
  --dark2:#064E3B;
  --ok:#047857;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --hard:#052E26;
  --shadow:6px 6px 0 #052E26;
  --shadow-sm:3px 3px 0 #052E26;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{overflow-x:hidden}
html{background:var(--color-background)}
body{
  font-family:'Nunito Sans',sans-serif;
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(5,150,105,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(5,150,105,.08) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,[data-i]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{
  width:264px;flex:0 0 264px;background:var(--dark);color:#ECFDF5;
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;height:100vh;
  overflow-y:auto;z-index:30;border-right:4px solid var(--hard);
}
.main{flex:1 1 auto;min-width:0;margin-left:264px;display:flex;flex-direction:column}
.brand{padding:24px 18px 20px;display:flex;align-items:center;gap:13px;border-bottom:3px solid var(--color-secondary)}
.brand .logo{
  width:46px;height:46px;flex:0 0 46px;border:3px solid #000;background:var(--color-secondary);
  color:#000;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--color-accent);
}
.brand .logo .material-symbols-outlined{font-size:27px;font-weight:700}
.brand b{font-family:'Rubik',sans-serif;font-size:17px;font-weight:900;display:block;letter-spacing:-.25px}
.brand span{font-size:11px;color:#D1FAE5;font-weight:700}
.nav{padding:18px 13px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.nav .lbl{font-family:'Rubik',sans-serif;font-size:10px;color:#A7F3D0;padding:4px 8px 7px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:12px;border:2px solid transparent;background:transparent;
  color:#D1FAE5;width:100%;text-align:left;font-size:13.5px;font-weight:800;font-family:inherit;
}
.navbtn .material-symbols-outlined{font-size:22px;flex:0 0 auto}
.navbtn:hover{border-color:#A7F3D0;background:#064E3B;color:#fff}
.navbtn.on{background:var(--color-secondary);border-color:#000;color:#000;box-shadow:4px 4px 0 var(--color-accent);transform:translate(-2px,-2px)}
.navbtn small{display:block;font-size:10.5px;font-weight:700;opacity:.76;margin-top:1px}
.side .foot{margin-top:auto;padding:17px 18px;border-top:3px solid var(--color-secondary);font-size:11px;color:#D1FAE5}
.side .foot b{color:#FDBA74}
.top{
  background:rgba(255,255,255,.96);border-bottom:3px solid var(--hard);padding:17px 28px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
}
.top h1{font-family:'Rubik',sans-serif;font-size:22px;font-weight:900;letter-spacing:-.6px;text-transform:uppercase}
.top .crumb{font-size:12px;color:var(--color-muted-foreground);margin-top:2px;font-weight:700}
.top .sp{flex:1 1 auto}
.top .pill{display:flex;align-items:center;gap:7px;background:var(--color-secondary);color:#052E26;border:2px solid #052E26;padding:8px 13px;font-size:12px;font-weight:900;box-shadow:3px 3px 0 #052E26}
.top .pill .material-symbols-outlined{font-size:18px}
.top .av{width:38px;height:38px;border:2px solid #052E26;background:var(--color-accent);color:#000;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;box-shadow:3px 3px 0 #052E26}
.wrap{padding:30px 30px 48px;max-width:1360px;width:100%}
.grid{display:grid;gap:20px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.45fr 1fr}
.card,.kpi{background:var(--color-card);color:var(--color-card-foreground);border:3px solid var(--hard);box-shadow:var(--shadow)}
.card{padding:20px}
.card.pad0{padding:0;overflow:hidden}
.grid>.card:nth-child(even){transform:translateY(8px)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px;border-bottom:2px solid var(--color-border);padding-bottom:11px}
.ch .material-symbols-outlined{font-size:22px;color:var(--color-primary);font-weight:700}
.ch h3{font-family:'Rubik',sans-serif;font-size:15px;font-weight:900;letter-spacing:-.2px}
.ch .r{margin-left:auto;font-size:11.5px;color:var(--color-muted-foreground);font-weight:800}
.kpi{padding:18px 18px 20px;position:relative;overflow:hidden;min-height:130px}
.kpi:nth-child(2n){background:#D1FAE5}
.kpi:nth-child(3){background:#FFEDD5}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--color-primary);border-bottom:2px solid var(--hard)}
.kpi:nth-child(3)::before{background:var(--color-accent)}
.kpi .t{font-size:12px;color:#334155;font-weight:800;display:flex;align-items:center;gap:7px;margin-top:7px}
.kpi .t .material-symbols-outlined{font-size:18px;color:var(--color-primary);font-weight:700}
.kpi .v{font-family:'Rubik',sans-serif;font-size:29px;font-weight:900;margin-top:8px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:'Nunito Sans',sans-serif;font-size:13px;color:#475569;font-weight:800;letter-spacing:0}
.kpi .d{font-size:11.5px;margin-top:5px;font-weight:900}
.up{color:#047857}.dn{color:#B91C1C}
.muted{color:var(--color-muted-foreground);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{background:#D1FAE5;text-align:left;font-size:11px;color:#052E26;font-weight:900;padding:12px 14px;border:0;border-bottom:3px solid var(--hard);white-space:nowrap;text-transform:uppercase;letter-spacing:.65px}
td{padding:13px 14px;border-bottom:2px solid var(--color-border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ECFDF5}
th:nth-child(3),td:nth-child(3){text-align:right}
td[style*="font-weight:700"],.kpi .v,.score,.vl,.fn{font-variant-numeric:tabular-nums}
td:first-child[style*="font-size:12.5px"],td .muted[style*="font-size:11px"]{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;letter-spacing:-.2px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:2px solid currentColor;font-size:11px;font-weight:900;white-space:nowrap;background:#fff}
.tag::before{content:"■";font-size:8px}
.t-ok{background:#D1FAE5;color:#065F46}
.t-warn{background:#FFEDD5;color:#9A3412}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#DBEAFE;color:#1E40AF}
.t-mut{background:#F1F5F9;color:#334155}
.bar{height:10px;border:2px solid var(--hard);background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.scroll{overflow-x:auto;scrollbar-color:var(--color-primary) var(--color-muted)}
.chartbox{overflow:hidden}
.avt{width:32px;height:32px;border:2px solid var(--hard);background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex:0 0 32px;box-shadow:2px 2px 0 var(--hard)}
.editor{display:flex;flex-wrap:wrap;gap:18px}
.editor>.palette{flex:1 1 190px}.editor>.canvas{flex:2 1 280px;min-width:0}.editor>.props{flex:1 1 190px;min-width:0}
.palette{display:flex;flex-direction:column;gap:9px}
.blk{display:flex;align-items:center;gap:10px;padding:11px 12px;border:2px dashed var(--color-primary);font-size:12.5px;font-weight:800;background:#ECFDF5;cursor:grab}
.blk:hover{background:#D1FAE5;border-style:solid}
.blk .material-symbols-outlined{font-size:20px;color:var(--color-primary)}
.blk .gr{margin-left:auto;color:#475569;font-size:19px}
.canvas{background:#F8FAFC;border:3px solid var(--hard);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 5px #E8F1F3}
.sec{padding:15px;position:relative;color:#fff;overflow:hidden;border:2px solid #000;min-height:70px}
.sec .k{position:absolute;top:7px;right:8px;font-family:ui-monospace,monospace;font-size:10px;background:#fff;color:#000;padding:2px 7px;border:2px solid #000;font-weight:900}
.sec.act{outline:4px solid var(--color-accent);outline-offset:3px}
.sec .st{font-size:12px;font-weight:800;opacity:.95;padding-right:40px}
.sec .bt{font-family:'Rubik',sans-serif;font-size:16px;font-weight:900;margin-top:3px}
.props .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:10px 0;border-bottom:2px solid var(--color-border)}
.props .row span{color:var(--color-muted-foreground)}
.props .row b{font-weight:900;text-align:right}
.chip{display:inline-block;padding:5px 8px;border:2px solid var(--color-accent);font-size:11px;font-weight:900;background:#FFEDD5;color:#9A3412;margin:4px 4px 0 0}
.dev{display:flex;gap:5px}
.dev button{border:2px solid var(--hard);background:#fff;padding:6px 9px;font-size:12px;cursor:pointer;font-family:inherit;color:#334155;font-weight:800}
.dev button:hover{background:#D1FAE5}
.dev button.on{background:var(--color-primary);color:#fff;border-color:var(--hard);box-shadow:2px 2px 0 var(--hard)}
.funnel{display:flex;flex-direction:column;gap:9px}
.fstep{display:flex;align-items:center;gap:12px}
.fstep .fb{height:40px;border:2px solid var(--hard);background:var(--color-primary);display:flex;align-items:center;padding:0 13px;color:#fff;font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;box-shadow:2px 2px 0 var(--hard)}
.fstep:nth-child(even) .fb{background:var(--color-secondary);color:#052E26}
.fstep .fn{width:56px;text-align:right;font-family:ui-monospace,monospace;font-size:12px;color:#334155;font-weight:900;flex:0 0 56px}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:4px;background:var(--hard)}
.tl .it{position:relative;padding:0 0 18px 9px}
.tl .it::before{content:"";position:absolute;left:-25px;top:2px;width:14px;height:14px;background:var(--color-secondary);border:3px solid var(--hard)}
.tl .it .tt{font-weight:900;font-size:13px}
.tl .it .dd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#475569;margin-top:2px}
.formprev{border:3px solid var(--hard);padding:17px;background:#ECFDF5;box-shadow:4px 4px 0 var(--color-border)}
.fld{margin-bottom:13px}
.fld label{font-size:12px;font-weight:900;display:block;margin-bottom:5px}
.fld label i{color:#B91C1C;font-style:normal}
.fld .inp{background:#fff;border:2px solid var(--hard);padding:10px 11px;font-size:12.5px;color:#475569;min-height:42px}
.fld .inp.area{height:64px}
.subbtn{background:var(--color-accent);color:#000;border:3px solid #000;padding:11px 16px;font-size:13px;font-weight:900;width:100%;font-family:inherit;cursor:pointer;box-shadow:4px 4px 0 #000}
.subbtn:hover{background:#FB923C;transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.seorow{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:2px solid var(--color-border)}
.seorow:last-child{border-bottom:0}
.seorow .ic{width:34px;height:34px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.seorow .ic .material-symbols-outlined{font-size:20px;font-weight:700}
.i-ok{background:#D1FAE5;color:#065F46}.i-warn{background:#FFEDD5;color:#9A3412}.i-bad{background:#FEE2E2;color:#991B1B}
.seorow .tx b{font-size:13px;font-weight:900}
.seorow .tx p{font-size:11.5px;color:#475569;margin-top:2px}
.score{font-family:'Rubik',sans-serif;font-size:38px;font-weight:900;letter-spacing:-1.5px}
.mini{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;align-items:center;gap:11px}
.mrow .nm{flex:1 1 auto;font-size:12.5px;font-weight:800}
.mrow .vl{font-family:ui-monospace,monospace;font-size:12px;font-weight:900;width:52px;text-align:right}
@media (hover:hover){
  .navbtn,.blk,.dev button,.subbtn,tbody tr{transition:background-color .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
}
@media(max-width:1080px){.editor>.props{flex-basis:100%}}
@media(max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;height:auto;position:static;overflow:visible;border-right:0;border-bottom:4px solid var(--hard)}
  .main{margin-left:0}
  .brand{padding:16px 18px}
  .nav{flex-direction:row;flex-wrap:wrap;padding:12px}
  .nav .lbl{display:none}
  .navbtn{width:auto;min-height:48px}
  .side .foot{display:none}
  .top{top:0}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .grid>.card:nth-child(even){transform:none}
  .wrap{padding:22px 17px 40px}
  .top{padding:14px 17px}
  .card,.kpi{box-shadow:4px 4px 0 var(--hard)}
}
@media(max-width:560px){
  .editor>*{flex:1 1 100%}
  .nav{flex-wrap:nowrap;overflow-x:auto;padding:10px}
  .navbtn small,.navbtn span.txt{display:none}
  .navbtn{padding:10px;justify-content:center;flex:0 0 48px}
  .top h1{font-size:18px}
  .top .pill{order:3;width:100%;justify-content:center}
  .wrap{padding-inline:14px}
  .card{padding:16px}
  .ch{align-items:flex-start;flex-wrap:wrap}
  .ch .r{width:100%;margin-left:32px}
}
@media(max-width:430px){
  .kpis{grid-template-columns:1fr}
  .kpi{min-height:116px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .navbtn.on,.subbtn:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">storefront</span></div>
      <div><b>Jvision Store</b><span>品牌網店設計平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>Powered by <b>Jvision</b></div>
  </aside>
  <div class="main">
    <div class="top">
      <div>
        <h1 id="scr-title">—</h1>
        <div class="crumb" id="scr-crumb">—</div>
      </div>
      <div class="sp"></div>
      <div class="pill"><span class="material-symbols-outlined">bolt</span> 站點運作中</div>
      <div class="av">JV</div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {i:"dashboard",n:"版型與拖曳編輯",s:"頁面設計"},
  {i:"inventory_2",n:"商品上架管理",s:"商品建檔"},
  {i:"description",n:"表單與收件設定",s:"表單流程"},
  {i:"trending_up",n:"SEO 與網站優化",s:"收錄檢查"},
  {i:"receipt_long",n:"訂單與金物流",s:"訂單追蹤"},
  {i:"monitoring",n:"流量轉換分析",s:"成效數據"}
];
var CRUMB=["首頁 / 頁面設計","商品 / 上架管理","互動 / 表單設定","行銷 / SEO 優化","營運 / 訂單金物流","數據 / 流量轉換"];

var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Inter,Noto Sans TC,sans-serif"}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function kpiRow(arr){
  var h=arr.map(function(k){
    var d=k.up>0?'<div class="d up">▲ '+k.d+'</div>':k.up<0?'<div class="d dn">▼ '+k.d+'</div>':'<div class="d muted">'+k.d+'</div>';
    return '<div class="kpi"><div class="t"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.t+'</div>'+
      '<div class="v">'+k.v+(k.u?'<small> '+k.u+'</small>':'')+'</div>'+d+'</div>';
  }).join("");
  return '<div class="grid kpis">'+h+'</div>';
}
function miniBar(nm,v){
  return '<div class="mrow"><span class="nm">'+nm+'</span><div class="bar" style="flex:1 1 auto"><i style="width:'+v+'%"></i></div><span class="vl">'+v+'%</span></div>';
}

/* ===== SCREEN 0 : Layout editor ===== */
function s0(){
  var secs=[
    {st:"主視覺輪播",bt:"春季新品 · 全館免運",bg:"linear-gradient(135deg,#e11d48,#fb7185)",act:true},
    {st:"導覽選單",bt:"上衣 / 洋裝 / 配件 / 鞋履",bg:"linear-gradient(135deg,#334155,#475569)",act:false},
    {st:"商品清單 · 4 欄",bt:"精選 8 件商品",bg:"linear-gradient(135deg,#7c3aed,#a78bfa)",act:false},
    {st:"圖文區塊",bt:"關於 Jvision",bg:"linear-gradient(135deg,#0d9488,#2dd4bf)",act:false},
    {st:"收件表單",bt:"訂閱電子報享 9 折",bg:"linear-gradient(135deg,#f59e0b,#fbbf24)",act:false}
  ];
  var canvas=secs.map(function(x,k){
    return '<div class="sec'+(x.act?' act':'')+'" style="background:'+x.bg+'">'+
      '<div class="k">#'+(k+1)+'</div><div class="st">'+esc(x.st)+'</div><div class="bt">'+esc(x.bt)+'</div></div>';
  }).join("");
  var blocks=[["view_carousel","主視覺輪播"],["grid_view","商品格牌"],["image","圖文區塊"],["format_list_bulleted","分類選單"],["mail","電子報表單"],["reviews","評價牆"],["local_offer","促銷倒數"],["dns","頁尾資訊"]];

var SCREENS=[s0,s1,s2,s3,s4,s5];
var INITS=[s0init,s1init,s2init,s3init,s4init,s5init];

(function(){
  var nav=document.getElementById("nav");
  var html='<div class="lbl">功能模組</div>';
  for(var i=0;i<MODS.length;i++){
    html+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].i+'</span>'+
      '<span class="txt"><span>'+MODS[i].n+'</span><small>'+MODS[i].s+'</small></span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var k=+this.getAttribute("data-i");location.hash="go="+k;});
  }
})();

function show(i){
  killCharts();
  var c=document.getElementById("view");
  c.innerHTML=SCREENS[i]();
  document.getElementById("scr-title").textContent=MODS[i].n;
  document.getElementById("scr-crumb").textContent=CRUMB[i];
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void c.offsetHeight;
  if(INITS[i])INITS[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
