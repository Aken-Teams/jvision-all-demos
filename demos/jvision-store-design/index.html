<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jvision 品牌網店設計平台</title>
<meta name="description" content="拖曳式頁面設計、商品上架、表單、SEO 與訂單管理"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#e11d48;--accent2:#fb7185;--bg:#f5f6fa;--card:#ffffff;
  --ink:#1e2233;--sub:#6b7280;--line:#e8eaf0;--dark:#181b2a;--dark2:#22263b;
  --ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--dark),var(--dark2));color:#e7e9f5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;display:block;letter-spacing:.3px}
.brand span{font-size:11px;color:#9aa0c0}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav .lbl{font-size:10.5px;color:#79809f;padding:8px 10px 4px;letter-spacing:1px;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;cursor:pointer;color:#c4c8e2;font-size:13.5px;font-weight:600;border:0;background:transparent;width:100%;text-align:left;transition:.15s;font-family:inherit}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(225,29,72,.35)}
.navbtn small{display:block;font-size:10.5px;font-weight:500;opacity:.72;margin-top:1px}
.side .foot{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8288a8}
.side .foot b{color:var(--accent2)}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:800}
.top .crumb{font-size:12px;color:var(--sub);margin-top:2px}
.top .sp{flex:1 1 auto}
.top .pill{display:flex;align-items:center;gap:6px;background:#fff0f3;color:var(--accent);border:1px solid #fbd5de;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:700}
.top .pill .material-symbols-outlined{font-size:17px}
.top .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#334,#556);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.wrap{padding:24px 26px 40px;max-width:1280px;width:100%}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ch .material-symbols-outlined{font-size:20px;color:var(--accent)}
.ch h3{font-size:14.5px;font-weight:800}
.ch .r{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:600}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .t{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .t .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.kpi .v{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600}
.kpi .d{font-size:11.5px;margin-top:4px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--sub);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfe}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{background:#e7f7ee;color:var(--ok)}
.t-warn{background:#fef4e2;color:#b45309}
.t-bad{background:#fdecec;color:var(--bad)}
.t-info{background:#e8f0fe;color:var(--info)}
.t-mut{background:#eef0f5;color:#5b6270}
.bar{height:7px;border-radius:5px;background:#eceef4;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
.chartbox{overflow:hidden}
.avt{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e11d48,#fb7185);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 30px}
.muted{color:var(--sub);font-size:12px}
.editor{display:grid;grid-template-columns:220px minmax(0,1fr) 210px;gap:16px}.edcol{display:grid;gap:16px}
.palette{display:flex;flex-direction:column;gap:8px}
.blk{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px dashed #d6d9e4;border-radius:11px;font-size:12.5px;font-weight:600;background:#fbfbfe;cursor:grab}
.blk .material-symbols-outlined{font-size:19px;color:var(--accent)}
.blk .gr{margin-left:auto;color:#c3c7d4;font-size:18px}
.canvas{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec{border-radius:11px;padding:14px;position:relative;color:#fff;overflow:hidden}
.sec .k{position:absolute;top:8px;right:10px;font-size:10px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-weight:700}
.sec.act{outline:2px solid var(--accent);outline-offset:2px}
.sec .st{font-size:12px;font-weight:700;opacity:.85;padding-right:34px}
.sec .bt{font-size:16px;font-weight:800;margin-top:2px}
.props .row{display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.props .row span{color:var(--sub)}
.props .row b{font-weight:700}
.chip{display:inline-block;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;background:#fff0f3;color:var(--accent);margin:3px 4px 0 0}
.dev{display:flex;gap:6px}
.dev button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--sub);font-weight:600}
.dev button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:flex;align-items:center;gap:12px}
.fstep .fb{height:38px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden}
.fstep .fn{width:56px;text-align:right;font-size:12px;color:var(--sub);font-weight:700;flex:0 0 56px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 16px 8px}
.tl .it::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl .it .tt{font-weight:700;font-size:13px}
.tl .it .dd{font-size:11.5px;color:var(--sub)}
.formprev{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fafbfe}
.fld{margin-bottom:12px}
.fld label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
.fld label i{color:var(--accent);font-style:normal}
.fld .inp{background:#fff;border:1px solid #dfe2ea;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#9aa0b0}
.fld .inp.area{height:56px}
.subbtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700;width:100%;font-family:inherit;cursor:pointer}
.seorow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.seorow:last-child{border-bottom:0}
.seorow .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.seorow .ic .material-symbols-outlined{font-size:19px}
.i-ok{background:#e7f7ee;color:var(--ok)}.i-warn{background:#fef4e2;color:#b45309}.i-bad{background:#fdecec;color:var(--bad)}
.seorow .tx b{font-size:13px}
.seorow .tx p{font-size:11.5px;color:var(--sub);margin-top:2px}
.score{font-size:34px;font-weight:800;letter-spacing:-1px}
.mini{display:flex;flex-direction:column;gap:11px}
.mrow{display:flex;align-items:center;gap:11px}
.mrow .nm{flex:1 1 auto;font-size:12.5px;font-weight:600}
.mrow .vl{font-size:12px;font-weight:700;width:52px;text-align:right}
@media(max-width:1080px){.editor{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap;padding:10px}
  .nav .lbl{display:none}
  .navbtn{width:auto}
  .side .foot{display:none}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .wrap{padding:18px 16px 34px}
  .top{padding:14px 16px}
}
@media(max-width:560px){
  .navbtn small{display:none}
  .navbtn span.txt{display:none}
  .navbtn{padding:10px}
}
@media(max-width:430px){
  .kpis{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">storefront</span></div>
      <div><b>Jvision Store</b><span>品牌網店設計平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>Powered by <b>Jvision</b></div>
  </aside>
  <div class="main">
    <div class="top">
      <div>
        <h1 id="scr-title">—</h1>
        <div class="crumb" id="scr-crumb">—</div>
      </div>
      <div class="sp"></div>
      <div class="pill"><span class="material-symbols-outlined">bolt</span> 站點運作中</div>
      <div class="av">JV</div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {i:"dashboard",n:"版型與拖曳編輯",s:"頁面設計"},
  {i:"inventory_2",n:"商品上架管理",s:"商品建檔"},
  {i:"description",n:"表單與收件設定",s:"表單流程"},
  {i:"trending_up",n:"SEO 與網站優化",s:"收錄檢查"},
  {i:"receipt_long",n:"訂單與金物流",s:"訂單追蹤"},
  {i:"monitoring",n:"流量轉換分析",s:"成效數據"}
];
var CRUMB=["首頁 / 頁面設計","商品 / 上架管理","互動 / 表單設定","行銷 / SEO 優化","營運 / 訂單金物流","數據 / 流量轉換"];

var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Inter,Noto Sans TC,sans-serif"}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function kpiRow(arr){
  var h=arr.map(function(k){
    var d=k.up>0?'<div class="d up">▲ '+k.d+'</div>':k.up<0?'<div class="d dn">▼ '+k.d+'</div>':'<div class="d muted">'+k.d+'</div>';
    return '<div class="kpi"><div class="t"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.t+'</div>'+
      '<div class="v">'+k.v+(k.u?'<small> '+k.u+'</small>':'')+'</div>'+d+'</div>';
  }).join("");
  return '<div class="grid kpis">'+h+'</div>';
}
function miniBar(nm,v){
  return '<div class="mrow"><span class="nm">'+nm+'</span><div class="bar" style="flex:1 1 auto"><i style="width:'+v+'%"></i></div><span class="vl">'+v+'%</span></div>';
}

/* ===== SCREEN 0 : Layout editor ===== */
function s0(){
  var secs=[
    {st:"主視覺輪播",bt:"春季新品 · 全館免運",bg:"linear-gradient(135deg,#e11d48,#fb7185)",act:true},
    {st:"導覽選單",bt:"上衣 / 洋裝 / 配件 / 鞋履",bg:"linear-gradient(135deg,#334155,#475569)",act:false},
    {st:"商品清單 · 4 欄",bt:"精選 8 件商品",bg:"linear-gradient(135deg,#7c3aed,#a78bfa)",act:false},
    {st:"圖文區塊",bt:"關於 Jvision",bg:"linear-gradient(135deg,#0d9488,#2dd4bf)",act:false},
    {st:"收件表單",bt:"訂閱電子報享 9 折",bg:"linear-gradient(135deg,#f59e0b,#fbbf24)",act:false}
  ];
  var canvas=secs.map(function(x,k){
    return '<div class="sec'+(x.act?' act':'')+'" style="background:'+x.bg+'">'+
      '<div class="k">#'+(k+1)+'</div><div class="st">'+esc(x.st)+'</div><div class="bt">'+esc(x.bt)+'</div></div>';
  }).join("");
  var blocks=[["view_carousel","主視覺輪播"],["grid_view","商品格牌"],["image","圖文區塊"],["format_list_bulleted","分類選單"],["mail","電子報表單"],["reviews","評價牆"],["local_offer","促銷倒數"],["dns","頁尾資訊"]];
  var pal=blocks.map(function(b){return '<div class="blk"><span class="material-symbols-outlined">'+b[0]+'</span>'+b[1]+'<span class="material-symbols-outlined gr">drag_indicator</span></div>';}).join("");
  var props=[["區塊類型","主視覺輪播"],["高度","480 px"],["圓角","16 px"],["文字對齊","置中"],["按鈕","立即選購 →"],["動畫","淡入"]];
  var pr=props.map(function(p){return '<div class="row"><span>'+p[0]+'</span><b>'+p[1]+'</b></div>';}).join("");
  return ''+
  kpiRow([
    {t:"頁面區塊",v:"5",u:"個",d:"已排版",ic:"widgets",up:0},
    {t:"套用版型",v:"Aurora",u:"",d:"品牌主題",ic:"palette",up:0},
    {t:"RWD 斷點",v:"3",u:"組",d:"手機/平板/桌機",ic:"devices",up:0},
    {t:"未儲存變更",v:"2",u:"項",d:"編輯中",ic:"edit_note",up:-1}
  ])+
  '<div class="edcol" style="margin-top:16px"><div class="card">'+
    '<div class="ch"><span class="material-symbols-outlined">design_services</span><h3>拖曳頁面編輯器</h3>'+
    '<div class="r"><div class="dev"><button>手機</button><button>平板</button><button class="on">桌機</button></div></div></div>'+
    '<div class="editor">'+
      '<div class="palette"><div class="muted" style="margin-bottom:4px;font-weight:700">元件庫</div>'+pal+'</div>'+
      '<div class="canvas"><div class="muted" style="font-weight:700;margin-bottom:2px">首頁 · 即時預覽</div>'+canvas+'</div>'+
      '<div class="props"><div class="muted" style="font-weight:700;margin-bottom:4px">區塊屬性</div>'+pr+
        '<div style="margin-top:8px"><span class="chip">主色 #e11d48</span><span class="chip">Inter</span><span class="chip">陰影 md</span></div></div>'+
    '</div></div>'+
    '<div class="card"><div class="ch"><span class="material-symbols-outlined">insights</span><h3>版本與發佈進度</h3></div>'+
      '<div id="c0" class="chartbox"></div>'+
      '<div class="mini" style="margin-top:12px">'+
        miniBar("桌機完成度",96)+miniBar("平板完成度",88)+miniBar("手機完成度",74)+miniBar("無障礙檢查",81)+
      '</div>'+
    '</div></div>';
}
function s0init(){
  mk("c0",Object.assign({},BASE,{
    chart:Object.assign({},BASE.chart,{type:"area",height:200}),
    series:[{name:"編輯區塊數",data:[2,3,3,4,5,5,5]}],
    colors:["#e11d48"],
    stroke:{curve:"smooth",width:2},
    fill:{type:"gradient",gradient:{opacityFrom:.4,opacityTo:.05}},
    dataLabels:{enabled:false},
    xaxis:{categories:["v1","v2","v3","v4","v5","v6","v7"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{style:{fontSize:"11px"}}},
    grid:{borderColor:"#eef0f5"}
  }));
}

/* ===== SCREEN 1 : Products ===== */
var PRODS=[
  {sku:"JV-TOP-108",n:"棉麻寬版襯衫",cat:"上衣",price:1280,stk:42,st:"上架中",stc:"t-ok",img:"#e11d48"},
  {sku:"JV-DRS-221",n:"法式碎花洋裝",cat:"洋裝",price:1980,stk:8,st:"低庫存",stc:"t-warn",img:"#fb7185"},
  {sku:"JV-ACC-045",n:"真皮側背小包",cat:"配件",price:2480,stk:0,st:"缺貨",stc:"t-bad",img:"#7c3aed"},
  {sku:"JV-SHO-076",n:"復古樂福鞋",cat:"鞋履",price:2680,stk:31,st:"上架中",stc:"t-ok",img:"#0d9488"},
  {sku:"JV-TOP-133",n:"針織開襟外套",cat:"上衣",price:1680,stk:19,st:"上架中",stc:"t-ok",img:"#f59e0b"},
  {sku:"JV-DRS-198",n:"緞面吊帶長裙",cat:"洋裝",price:2280,stk:5,st:"低庫存",stc:"t-warn",img:"#2563eb"},
  {sku:"JV-ACC-062",n:"金屬感耳環",cat:"配件",price:680,stk:120,st:"上架中",stc:"t-ok",img:"#db2777"},
  {sku:"JV-TOP-141",n:"落肩設計T恤",cat:"上衣",price:890,stk:0,st:"待上架",stc:"t-mut",img:"#475569"}
];
function s1(){
  var rows=PRODS.map(function(p){
    return '<tr><td><div style="display:flex;align-items:center;gap:10px"><span class="avt" style="background:'+p.img+'">'+esc(p.cat.charAt(0))+'</span>'+
      '<div><b style="font-size:13px">'+esc(p.n)+'</b><div class="muted" style="font-size:11px">'+p.sku+'</div></div></div></td>'+
      '<td><span class="tag t-mut">'+p.cat+'</span></td>'+

(function(){
  var nav=document.getElementById("nav");
  var html='<div class="lbl">功能模組</div>';
  for(var i=0;i<MODS.length;i++){
    html+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].i+'</span>'+
      '<span class="txt"><span>'+MODS[i].n+'</span><small>'+MODS[i].s+'</small></span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var k=+this.getAttribute("data-i");location.hash="go="+k;});
  }
})();

function show(i){
  killCharts();
  var c=document.getElementById("view");
  c.innerHTML=SCREENS[i]();
  document.getElementById("scr-title").textContent=MODS[i].n;
  document.getElementById("scr-crumb").textContent=CRUMB[i];
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void c.offsetHeight;
  if(INITS[i])INITS[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
