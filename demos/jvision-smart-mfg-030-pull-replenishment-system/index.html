<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉動式補料系統 Pull Replenishment System</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --ok:#047857;
  --warn:#a15c00;
  --bad:#dc2626;
  --info:#1d4ed8;
}
*{box-sizing:border-box;min-width:0}
html{background:var(--color-background);color:var(--ink);font-family:"Open Sans",sans-serif}
body{margin:0;min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:600;font-style:normal;line-height:1;vertical-align:middle}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--color-primary);color:#fff;border-right:4px solid var(--ink)}
.brand{display:flex;align-items:center;gap:13px;padding:22px 18px;border-bottom:2px solid #94a3b8}
.logo{display:grid;place-items:center;width:46px;height:46px;flex:none;color:#fff;background:var(--color-accent);border:2px solid #fff}
.logo .material-symbols-outlined{font-size:27px}
.brand h1{margin:0;font-family:"Poppins",sans-serif;font-size:16px;font-weight:700;line-height:1.2}
.brand p{margin:4px 0 0;color:#dbe4ee;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.nav{display:flex;flex:1;flex-direction:column;gap:7px;overflow:auto;padding:14px 12px}
.nav .lbl{padding:6px 8px;color:#dbe4ee;font-size:11px;font-weight:700;letter-spacing:.12em}
.nav button{display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:10px;width:100%;padding:12px 10px;color:#fff;background:transparent;border:2px solid transparent;border-radius:0;font:600 13px "Open Sans",sans-serif;text-align:left}
.nav button:hover{background:#475569;border-color:#94a3b8}
.nav button.on{color:var(--color-on-accent);background:var(--color-accent);border-color:#fff;font-weight:700}
.nav button .material-symbols-outlined{font-size:21px}
.nav .idx{font:700 11px "Poppins",sans-serif}
.side .foot{padding:15px 18px;border-top:2px solid #94a3b8;color:#e2e8f0;font-size:11px;line-height:1.7}
.side .foot b{color:#fff}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:16px 26px;background:rgba(248,250,252,.97);border-bottom:3px solid var(--ink)}
.ttl h2{display:flex;align-items:center;gap:10px;margin:0;font:700 21px "Poppins",sans-serif}
.ttl h2 .material-symbols-outlined{display:grid;place-items:center;width:36px;height:36px;color:#fff;background:var(--color-primary);font-size:22px}
.ttl p{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:600}
.chip{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-left:auto}
.pill,.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:0;font-size:11px;font-weight:700}
.pill{padding:6px 10px}
.pill.g{color:#065f46;background:#d1fae5}
.pill:not(.g){color:#7f1d1d;background:#fee2e2}
.wrap{width:100%;max-width:1480px;padding:24px 26px 48px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.kpi,.rulecard,.sigcell,.kbcol,.kbcard,.sl,.rbody{border-radius:0}
.card,.kpi,.rulecard{background:var(--color-card);border:2px solid var(--ink)}
.card{padding:17px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:700 14px "Poppins",sans-serif}
.card h3 .material-symbols-outlined{color:var(--color-accent);font-size:21px}
.card h3 .tag{margin-left:auto;padding:3px 7px;color:var(--ink);background:var(--color-muted);border:1px solid var(--ink);font:700 10px "Open Sans",sans-serif}
.kpi{position:relative;overflow:hidden;padding:16px 17px;border-left:8px solid var(--color-accent)}
.kpi:nth-child(even){transform:translateY(6px)}
.k-top{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.k-top .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.kpi .v{margin-top:7px;font:700 29px "Poppins",sans-serif;letter-spacing:-.04em}
.kpi .v small{margin-left:4px;color:var(--muted);font:600 12px "Open Sans",sans-serif}
.kpi .d{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:700}
.d.up{color:#065f46}.d.dn{color:#b91c1c}
.chart{width:100%;height:300px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
th,td{padding:10px 11px;border:1px solid var(--line);white-space:nowrap}
th{color:#fff;background:var(--color-primary);font-size:11px;font-weight:700;letter-spacing:.025em;text-align:left}
td{font-weight:500}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#ecfdf5}
.bar,.gg{overflow:hidden;background:#d8dde3;border:1px solid #94a3b8;border-radius:0}
.bar{height:9px;min-width:74px}
.bar i,.gg i{display:block;height:100%;background:var(--color-accent)}
.badge{padding:3px 7px}
.b-ok{color:#065f46;background:#d1fae5}
.b-warn{color:#78350f;background:#fef3c7}
.b-bad{color:#991b1b;background:#fee2e2}
.b-info{color:#1e3a8a;background:#dbeafe}
.b-mut{color:#334155;background:#e2e8f0}
.dot{display:inline-block;width:8px;height:8px;border:1px solid currentColor;border-radius:50%}
.sigboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sigcell{padding:12px;background:#fff;border:2px solid var(--line)}
.sigcell .st{color:var(--muted);font-size:11px;font-weight:700}
.sigcell .mn{margin-top:2px;font-size:13px;font-weight:700}
.sigcell .gg{height:9px;margin-top:10px}
.sigcell .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;color:var(--muted);font-size:10px;font-weight:600}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kbcol{padding:9px;background:var(--color-muted);border:2px solid var(--ink)}
.kbcol .h{display:flex;align-items:center;gap:7px;padding:5px;font-size:12px;font-weight:700}
.kbcol .h .c{margin-left:auto;padding:1px 7px;background:#fff;border:1px solid var(--ink);font-size:10px}
.kbcard{margin-top:8px;padding:10px;background:#fff;border:1px solid var(--ink);border-left:6px solid var(--color-primary)}
.kbcard.o{border-left-color:#b45309}.kbcard.b{border-left-color:var(--info)}.kbcard.g{border-left-color:var(--ok)}
.kbcard .t{font-size:12px;font-weight:700}
.kbcard .sub{display:flex;justify-content:space-between;gap:7px;margin-top:4px;color:var(--muted);font-size:10px}
.kbcard .qty{margin-top:7px;color:#065f46;font-size:11px;font-weight:700}
.rulecard{padding:13px}
.rulecard .rh{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}
.rulecard .num{display:grid;place-items:center;width:29px;height:29px;flex:none;color:#fff;background:var(--color-primary);font:700 12px "Poppins",sans-serif}
.rulecard .rx{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.55}
.rulecard .rf{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.rmeta{padding-top:2px;color:var(--muted);font-size:10px;font-weight:600}
.rmeta b{display:block;color:var(--ink);font-size:12px}
.rline{position:relative}
.rline:before{position:absolute;top:19px;bottom:-2px;left:8px;width:2px;background:var(--ink);content:""}
.rnode{width:18px;height:18px;background:#fff;border:4px solid var(--color-primary);border-radius:0}
.rnode.done{background:var(--color-accent);border-color:var(--color-primary)}
.rnode.now{background:#fef3c7;border-color:#b45309}
.rbody{margin-left:33px;padding:10px 12px;background:#fff;border:1px solid var(--ink)}
.rbody .rt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.rbody .rd{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sl{overflow:hidden;background:#fff;border:2px solid var(--ink)}
.sl .hd{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;color:#fff;font-size:11px;font-weight:700}
.sl .bd{padding:10px}
.sl .lv{font:700 23px "Poppins",sans-serif}
.sl .lv small{color:var(--muted);font:600 11px "Open Sans",sans-serif}
.sl .gg{height:10px;margin-top:8px}
.sl .rk{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--muted);font-size:10px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:11px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.small{color:var(--muted);font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .sigboard,.kb{grid-template-columns:repeat(2,1fr)}
  .shelf{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:860px){
  .app{display:block}
  .side{position:relative;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{padding:14px 16px}
  .nav{flex-flow:row wrap;padding:10px}
  .nav .lbl,.side .foot{display:none}
  .nav button{width:auto;grid-template-columns:22px auto;padding:9px}
  .nav .idx{display:none}
  .top{top:0;padding:13px 16px}
}
@media(max-width:768px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .sigboard,.kb{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:18px 14px 40px}
  .kpi:nth-child(even){transform:none}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{grid-template-columns:22px;padding:10px}
  .ttl h2{font-size:16px}
  .ttl p{font-size:11px}
  .chip{display:none}
  .shelf{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">sync_alt</span></div>
    <div><h1>拉動式補料系統</h1><p>Pull Replenishment System</p></div>
  </div>
  <nav class="nav" id="nav" aria-label="補料作業流程"><div class="lbl">補料作業流程</div></nav>
  <div class="foot">MES · WMS · 電子看板整合<br><b>倉別</b> 主料倉 / 線邊倉 · <b>班別</b> 早班</div>
</aside>
<main class="main">
  <header class="top">
    <div class="ttl">
      <h2><span class="material-symbols-outlined" id="scr-icon">sensors</span><span id="scr-ttl">消耗訊號監測</span></h2>
      <p id="scr-sub">線邊料位消耗即時觸發拉動補料訊號</p>
    </div>
    <div class="chip">
      <span class="pill g"><span class="material-symbols-outlined" style="font-size:15px">check_circle</span>系統正常</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:15px">timer</span>補料及時率 96.4%</span>
    </div>
  </header>
  <div class="wrap"><div id="view" class="reveal"></div></div>
</main>
</div>
<script>
var MOD=[
 {icon:"sensors",name:"消耗訊號監測",sub:"線邊料位消耗即時觸發拉動補料訊號"},
 {icon:"rule",name:"補料規則引擎",sub:"安全庫存與批量規則動態比對判定"},
 {icon:"assignment",name:"補料任務下達",sub:"自動生成拉動補料工單並派工水蜘蛛"},
 {icon:"local_shipping",name:"水蜘蛛路徑執行",sub:"配送路線與線邊補料進度逐站追蹤"},
 {icon:"inventory",name:"線邊庫存看板",sub:"各工位料位庫存水位與缺料預警"},
 {icon:"insights",name:"補料績效分析",sub:"補料及時率、周轉率與異常趨勢分析"}
];
var nav=document.getElementById("nav"),view=document.getElementById("view"),charts=[];
MOD.forEach(function(m,i){
 var b=document.createElement("button");
 b.type="button";b.setAttribute("data-i",i);
 b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span>';
 b.onclick=function(){location.hash="v"+i};nav.appendChild(b)
});
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(el){var c=echarts.init(el);charts.push(c);return c}
function n(v){try{return(v||0).toLocaleString("zh-Hant")}catch(e){return String(v)}}
function kpi(i,l,v,u,d,cls){
 return '<div class="kpi"><div class="k-top"><span class="material-symbols-outlined">'+i+'</span>'+l+'</div><div class="v">'+v+'<small>'+u+'</small></div><div class="d '+(cls||"up")+'">'+d+'</div></div>'
}
function chartBase(){
 return {textStyle:{fontFamily:"Open Sans",color:"#0f172a"},grid:{left:8,right:14,top:28,bottom:8,containLabel:true},tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:11,color:"#334155"}}}
}
function s0(){
 var sig=[
  ["SMT-01 料位A","C0402-R100K",18,"186/hr","9 分","bad"],
  ["SMT-02 料位C","IC-STM32F4",26,"64/hr","14 分","bad"],
  ["DIP-03 料位B","CN-USB-C",41,"58/hr","28 分","warn"],
  ["組裝-05 料位D","SCR-M3x6",55,"120/hr","41 分","warn"],
  ["包裝-01 料位A","BOX-A4-CT",72,"33/hr","1.6 時","ok"],
  ["測試-02 料位F","PROBE-P10",63,"22/hr","2.1 時","ok"],
  ["SMT-01 料位E","L-4.7uH",34,"98/hr","21 分","warn"],
  ["DIP-03 料位A","DIODE-1N4",88,"40/hr","3.4 時","ok"]
 ],colors={bad:"#dc2626",warn:"#a15c00",ok:"#047857"};
 var cards=sig.map(function(s){
  var label=s[5]=="bad"?"即將觸發":s[5]=="warn"?"觀察中":"充足";
  return '<div class="sigcell"><div class="st">'+s[0]+'</div><div class="mn mono">'+s[1]+'</div><div class="gg"><i style="width:'+s[2]+'%;background:'+colors[s[5]]+'"></i></div><div class="meta"><span>水位 '+s[2]+'%</span><span>消耗 '+s[3]+'</span></div><div class="meta"><span class="badge b-'+s[5]+'"><span class="material-symbols-outlined" style="font-size:13px">'+(s[5]=="bad"?"warning":s[5]=="warn"?"visibility":"check_circle")+'</span>'+label+'</span><span>觸發 '+s[4]+'</span></div></div>'
 }).join("");
 view.innerHTML='<div class="grid g4" style="margin-bottom:16px">'+
 kpi("bolt","即時消耗訊號","18","筆/時","↑ +3")+
 kpi("notification_important","待觸發補料點","7","處","警示：3 處緊急","dn")+
 kpi("speed","平均消耗速率","142","pcs/hr","↑ +6.1%")+
 kpi("schedule","訊號回應時間","46","秒","改善：-12s")+
 '</div><div class="grid g23"><div class="card"><h3><span class="material-symbols-outlined">grid_view</span>線邊料位消耗訊號看板<span class="tag">即時</span></h3><div style="overflow-x:auto"><div class="sigboard">'+cards+'</div></div></div><div class="card"><h3><span class="material-symbols-outlined">monitoring</span>各工站消耗速率</h3><div id="c0" class="chart"></div></div></div>';
 var o=chartBase();o.legend.data=["消耗量","門檻"];o.xAxis={type:"category",data:["SMT-01","SMT-02","DIP-03","組裝-05","測試-02","包裝-01"],axisLabel:{fontSize:11}};o.yAxis={type:"value",name:"pcs/hr"};o.series=[{name:"消耗量",type:"bar",data:[186,64,58,120,22,33],itemStyle:{color:"#059669"},barWidth:"46%"},{name:"門檻",type:"line",data:[150,80,90,140,60,80],lineStyle:{color:"#334155",type:"dashed"},itemStyle:{color:"#334155"},symbol:"none"}];mk(document.getElementById("c0")).setOption(o)
}
function s1(){
 var rules=[
  ["01","安全庫存拉動","當線邊可用量低於安全庫存（ROP），立即產生拉動補料訊號。",["ROP=2h 用量","週期 60s","優先 高"],342,"b-bad"],
  ["02","批量整併規則","同工站多料號補料需求整併為單一水蜘蛛任務，減少往返趟次。",["整併窗 5min","上限 8 料號","優先 中"],128,"b-warn"],
  ["03","高價料複核","單價 > NT$500 之料號，補料量大於 2 件需物流工程師線上複核。",["門檻 NT$500","需複核","優先 中"],37,"b-info"],
  ["04","占用互斥","已被出貨單或工單占用的批號不得重複分配，避免超補。",["批號鎖定","即時","優先 高"],54,"b-bad"],
  ["05","效期先進先出","補料一律採 FEFO，優先出效期較近批號，將到期料優先消耗。",["FEFO","效期<30天","優先 中"],96,"b-warn"],
  ["06","路線平衡","依水蜘蛛負載與距離動態分派，避免單一路線壅塞。",["負載均衡","距離權重","優先 低"],210,"b-info"]
 ];
 var tbl=[
  ["C0402-R100K",340,600,2000,"國巨","觸發補料","b-bad"],
  ["IC-STM32F4",58,80,150,"ST","觸發+複核","b-warn"],
  ["CN-USB-C",210,250,500,"連展","觸發補料","b-bad"],
  ["SCR-M3x6",1420,800,5000,"晉禾","庫存充足","b-ok"],
  ["BOX-A4-CT",640,400,1000,"永O","庫存充足","b-ok"],
  ["L-4.7uH",120,300,600,"TDK","觸發補料","b-bad"],
