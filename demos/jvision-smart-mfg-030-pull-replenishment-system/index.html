<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>拉動式補料系統 Pull Replenishment System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316;
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e6e8ec; --side:#141821; --side2:#1e2530;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#cbd2dd;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(220,38,38,.4)}
.brand .logo .material-symbols-outlined{font-size:26px}
.brand h1{font-size:15px;color:#fff;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;color:#8b94a3;margin-top:3px;font-weight:500}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
.nav .lbl{font-size:11px;color:#6b7280;padding:8px 10px 4px;letter-spacing:1px;font-weight:700}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:none;background:transparent;color:#c3cad6;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:.15s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .idx{margin-left:auto;font-size:11px;color:#5b6472;font-weight:700}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.35)}
.nav button.on .idx{color:rgba(255,255,255,.75)}
.side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#71798a}
.side .foot b{color:#e5e7eb;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.top .ttl{min-width:0}
.top .ttl h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.top .ttl h2 .material-symbols-outlined{color:var(--accent);font-size:24px}
.top .ttl p{font-size:12.5px;color:var(--muted);margin-top:3px}
.top .chip{margin-left:auto;flex:none;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#fef2f2;color:var(--accent)}
.pill.g{background:#ecfdf5;color:var(--ok)} .pill.o{background:#fff7ed;color:var(--accent2)} .pill.b{background:#eff6ff;color:var(--info)}
.wrap{padding:24px 26px 44px;max-width:1320px;width:100%}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:#f3f4f6;padding:3px 9px;border-radius:6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .k-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .k-top .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi .v{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .d{font-size:11.5px;margin-top:6px;font-weight:700;display:flex;align-items:center;gap:4px}
.kpi .d.up{color:var(--ok)} .kpi .d.dn{color:var(--bad)}
.chart{width:100%;height:300px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;background:#fafbfc}
td{font-weight:500}
tr:last-child td{border-bottom:none}
.bar{height:7px;border-radius:99px;background:#eef0f3;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.b-ok{background:#ecfdf5;color:var(--ok)} .b-warn{background:#fffbeb;color:#b45309} .b-bad{background:#fef2f2;color:var(--bad)} .b-info{background:#eff6ff;color:var(--info)} .b-mut{background:#f3f4f6;color:#4b5563}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.blink{animation:bl 1.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.flow-anim{position:relative;overflow:hidden}
.flow-anim::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(249,115,22,.14),transparent);animation:sweep 3s linear infinite;pointer-events:none}
@keyframes sweep{to{left:130%}}
.sigboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sigcell{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.sigcell .st{font-size:12px;color:var(--muted);font-weight:700}
.sigcell .mn{font-size:14px;font-weight:800;margin-top:2px}
.sigcell .gg{height:8px;border-radius:99px;background:#eef0f3;margin-top:10px;overflow:hidden}
.sigcell .gg i{display:block;height:100%}
.sigcell .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:7px;font-weight:600}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kbcol{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kbcol .h{font-size:12.5px;font-weight:800;padding:6px 8px;display:flex;align-items:center;gap:7px}
.kbcol .h .c{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);padding:1px 8px;border-radius:999px;color:var(--muted)}
.kbcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:9px;border-left:3px solid var(--accent)}
.kbcard.o{border-left-color:var(--accent2)} .kbcard.b{border-left-color:var(--info)} .kbcard.g{border-left-color:var(--ok)}
.kbcard .t{font-size:13px;font-weight:800}
.kbcard .sub{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.kbcard .qty{font-size:11.5px;font-weight:700;margin-top:7px;color:var(--accent)}
.rmeta{font-size:11.5px;color:var(--muted);font-weight:600}
.rmeta b{display:block;color:var(--ink);font-size:13px;font-weight:800}
.rnode{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);background:#fff}
.rnode.done{background:var(--accent);border-color:var(--accent)}
.rnode.now{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(249,115,22,.18)}
.rline{position:relative}
.rline::before{content:"";position:absolute;left:8px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.rbody{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-left:34px}
.rbody .rt{font-size:13.5px;font-weight:800;display:flex;gap:8px;align-items:center}
.rbody .rd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sl .hd{padding:9px 11px;font-size:12px;font-weight:800;color:#fff;display:flex;justify-content:space-between;align-items:center}
.sl .bd{padding:11px}
.sl .lv{font-size:24px;font-weight:800}
.sl .lv small{font-size:12px;color:var(--muted);font-weight:600}
.sl .gg{height:9px;border-radius:99px;background:#eef0f3;margin-top:9px;overflow:hidden}
.sl .gg i{display:block;height:100%}
.sl .rk{font-size:11px;color:var(--muted);margin-top:8px;font-weight:600;display:flex;justify-content:space-between}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.small{font-size:12px;color:var(--muted)}
.rulecard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.rulecard .rh{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13.5px}
.rulecard .rh .num{width:28px;height:28px;border-radius:8px;background:#fef2f2;color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rulecard .rx{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.rulecard .rf{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.sigboard{grid-template-columns:repeat(2,1fr)}.kb{grid-template-columns:repeat(2,1fr)}.shelf{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:relative;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap;overflow:visible;gap:6px}
  .nav .lbl{display:none}
  .nav button{width:auto;flex:none}
  .nav button .idx{display:none}
  .side .foot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .sigboard,.kb{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:18px 16px 40px}
  .top{padding:14px 16px}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:10px}
  .top .ttl h2{font-size:16px}
  .shelf{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">sync_alt</span></div>
      <div><h1>拉動式補料系統</h1><p>Pull Replenishment System</p></div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">補料作業流程</div>
    </nav>
    <div class="foot">MES · WMS · 電子看板整合<br/><b>倉別</b> 主料倉 / 線邊倉 · <b>班別</b> 早班</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="ttl">
        <h2><span class="material-symbols-outlined" id="scr-icon">sensors</span><span id="scr-ttl">消耗訊號監測</span></h2>
        <p id="scr-sub">線邊料位消耗即時觸發拉動補料訊號</p>
      </div>
      <div class="chip">
        <span class="pill g"><span class="dot blink" style="background:var(--ok)"></span>系統正常</span>
        <span class="pill">補料及時率 96.4%</span>
      </div>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
var MOD=[
  {icon:"sensors",name:"消耗訊號監測",sub:"線邊料位消耗即時觸發拉動補料訊號"},
  {icon:"rule",name:"補料規則引擎",sub:"安全庫存與批量規則動態比對判定"},
  {icon:"assignment",name:"補料任務下達",sub:"自動生成拉動補料工單並派工水蜘蛛"},
  {icon:"local_shipping",name:"水蜘蛛路徑執行",sub:"配送路線與線邊補料進度逐站追蹤"},
  {icon:"inventory",name:"線邊庫存看板",sub:"各工位料位庫存水位與缺料預警"},
  {icon:"insights",name:"補料績效分析",sub:"補料及時率、周轉率與異常趨勢分析"}
];
var nav=document.getElementById("nav");
MOD.forEach(function(m,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span>';
  b.addEventListener("click",function(){location.hash="v"+i;});
  nav.appendChild(b);
});

var view=document.getElementById("view");
var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
function mk(el){var c=echarts.init(el);charts.push(c);return c;}
function n(v){try{return (v||0).toLocaleString();}catch(e){return String(v);}}

/* SCREEN 0 : 消耗訊號監測 */
function s0(){
  var kpi=[
    {i:"bolt",l:"即時消耗訊號",v:"18",u:"筆/時",d:"+3",up:1},
    {i:"notification_important",l:"待觸發補料點",v:"7",u:"處",d:"3 處緊急",up:0},
    {i:"speed",l:"平均消耗速率",v:"142",u:"pcs/hr",d:"+6.1%",up:1},
    {i:"schedule",l:"訊號回應時間",v:"46",u:"秒",d:"-12s",up:1}
  ];
  var cmap={bad:"#dc2626",warn:"#f59e0b",ok:"#16a34a"};
  var sig=[
    {loc:"SMT-01 料位A",mn:"C0402-R100K",pct:18,rate:"186/hr",eta:"9 分",c:"bad"},
    {loc:"SMT-02 料位C",mn:"IC-STM32F4",pct:26,rate:"64/hr",eta:"14 分",c:"bad"},
    {loc:"DIP-03 料位B",mn:"CN-USB-C",pct:41,rate:"58/hr",eta:"28 分",c:"warn"},
    {loc:"組裝-05 料位D",mn:"SCR-M3x6",pct:55,rate:"120/hr",eta:"41 分",c:"warn"},
    {loc:"包裝-01 料位A",mn:"BOX-A4-CT",pct:72,rate:"33/hr",eta:"1.6 時",c:"ok"},
    {loc:"測試-02 料位F",mn:"PROBE-P10",pct:63,rate:"22/hr",eta:"2.1 時",c:"ok"},
    {loc:"SMT-01 料位E",mn:"L-4.7uH",pct:34,rate:"98/hr",eta:"21 分",c:"warn"},
    {loc:"DIP-03 料位A",mn:"DIODE-1N4",pct:88,rate:"40/hr",eta:"3.4 時",c:"ok"}
  ];
  var cards=sig.map(function(s){
    return '<div class="sigcell"><div class="st">'+s.loc+'</div><div class="mn mono">'+s.mn+'</div>'+
    '<div class="gg"><i style="width:'+s.pct+'%;background:'+cmap[s.c]+'"></i></div>'+
    '<div class="meta"><span>水位 '+s.pct+'%</span><span>消耗 '+s.rate+'</span></div>'+
    '<div class="meta"><span class="badge '+(s.c==='bad'?'b-bad':s.c==='warn'?'b-warn':'b-ok')+'">'+(s.c==='bad'?'即將觸發':s.c==='warn'?'觀察中':'充足')+'</span><span>觸發 '+s.eta+'</span></div></div>';
  }).join("");
  view.innerHTML=
  '<div class="grid g4" style="margin-bottom:16px">'+kpi.map(function(k){
    return '<div class="kpi"><div class="k-top"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div><div class="v">'+k.v+'<small>'+k.u+'</small></div><div class="d '+(k.up?'up':'dn')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(k.up?'trending_up':'priority_high')+'</span>'+k.d+'</div></div>';
  }).join("")+'</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">grid_view</span>線邊料位消耗訊號看板<span class="tag">即時</span></h3><div style="overflow-x:auto"><div class="sigboard">'+cards+'</div></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>各工站消耗速率</h3><div id="c0" class="chart"></div></div>'+
  '</div>';
  void view.offsetHeight;
  var c=mk(document.getElementById("c0"));
  c.setOption({
    tooltip:{trigger:"axis"},grid:{left:8,right:14,top:26,bottom:8,containLabel:true},
    legend:{data:["消耗量","門檻"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["SMT-01","SMT-02","DIP-03","組裝-05","測試-02","包裝-01"],axisLabel:{fontSize:11}},
    yAxis:{type:"value",name:"pcs/hr",nameTextStyle:{fontSize:10}},
    series:[
      {name:"消耗量",type:"bar",data:[186,64,58,120,22,33],itemStyle:{color:"#dc2626",borderRadius:[4,4,0,0]},barWidth:"46%"},
      {name:"門檻",type:"line",data:[150,80,90,140,60,80],itemStyle:{color:"#f97316"},lineStyle:{type:"dashed"},symbol:"none"}
    ]
  });
}

/* SCREEN 1 : 補料規則引擎 */
function s1(){
  var rules=[
    {n:"01",t:"安全庫存拉動",x:"當線邊可用量低於安全庫存（ROP），立即產生拉動補料訊號。",tags:["ROP=2h 用量","週期 60s","優先 高"],hit:342,c:"b-bad"},
    {n:"02",t:"批量整併規則",x:"同工站多料號補料需求整併為單一水蜘蛛任務，減少往返趟次。",tags:["整併窗 5min","上限 8 料號","優先 中"],hit:128,c:"b-warn"},
    {n:"03",t:"高價料複核",x:"單價 > NT$500 之料號，補料量大於 2 件需物流工程師線上複核。",tags:["門檻 NT$500","需複核","優先 中"],hit:37,c:"b-info"},
    {n:"04",t:"占用互斥",x:"已被出貨單或工單占用的批號不得重複分配，避免超補。",tags:["批號鎖定","即時","優先 高"],hit:54,c:"b-bad"},
    {n:"05",t:"效期先進先出",x:"補料一律採 FEFO，優先出效期較近批號，將到期料優先消耗。",tags:["FEFO","效期<30天","優先 中"],hit:96,c:"b-warn"},
    {n:"06",t:"路線平衡",x:"依水蜘蛛負載與距離動態分派，避免單一路線壅塞。",tags:["負載均衡","距離權重","優先 低"],hit:210,c:"b-info"}
  ];
  var tbl=[
    {mn:"C0402-R100K",avail:340,rop:600,lot:2000,vend:"國巨",res:"觸發補料",b:"b-bad"},
    {mn:"IC-STM32F4",avail:58,rop:80,lot:150,vend:"ST",res:"觸發+複核",b:"b-warn"},

function show(i){
  i=Math.max(0,Math.min(RENDER.length-1,i));
  disposeCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var m=MOD[i];
  document.getElementById("scr-icon").textContent=m.icon;
  document.getElementById("scr-ttl").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  RENDER[i]();
}
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
