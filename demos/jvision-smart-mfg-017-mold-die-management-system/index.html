<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>模具管理系統 Mold/Die Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --c1:#c2410c; --c2:#fb923c; --c1-soft:#fff1e9; --c2-soft:#fff7ed;
  --bg:#f5f4f2; --panel:#ffffff; --ink:#1c1917; --sub:#78716c; --line:#ece7e2;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.app{display:flex;min-height:100vh;}
/* ===== Sidebar nav ===== */
.side{
  width:236px;flex:none;background:linear-gradient(180deg,#7c2d0e 0%,#9a3412 60%,#c2410c 100%);
  color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:4px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#ffedd5;}
.brand b{font-size:15px;font-weight:800;display:block;letter-spacing:.3px;}
.brand span{font-size:11px;color:#fed7aa;letter-spacing:.5px;}
nav{display:flex;flex-direction:column;gap:3px;min-width:0;}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:transparent;
  color:#ffe6d5;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;
  transition:background .15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:none;}
.navbtn .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.navbtn small{display:block;font-size:10.5px;font-weight:500;color:#fdba74;margin-top:1px;}
.navbtn:hover{background:rgba(255,255,255,.10);}
.navbtn.on{background:#fff;color:#9a3412;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.navbtn.on small{color:#c2410c;}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:#fdba74;border-top:1px solid rgba(255,255,255,.14);}
.side .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
/* ===== Main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{
  background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
}
.top h1{font-size:17px;margin:0;font-weight:800;}
.top .crumb{font-size:12px;color:var(--sub);margin-top:2px;}
.top .spacer{flex:1;min-width:12px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--c1-soft);color:var(--c1);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.pill .material-symbols-outlined{font-size:16px;}
.who{display:flex;align-items:center;gap:9px;}
.who .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.who b{font-size:12.5px;display:block;}.who span{font-size:11px;color:var(--sub);}
.wrap{padding:22px 24px 40px;min-width:0;}
/* ===== Split workspace ===== */
.split{display:grid;grid-template-columns:340px 1fr;gap:18px;min-width:0;align-items:start;}
.split.wide{grid-template-columns:390px 1fr;}
.listpane{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;}
.lp-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.lp-head b{font-size:14px;}
.lp-head .cnt{font-size:11px;color:var(--sub);background:var(--bg);padding:3px 9px;border-radius:999px;font-weight:600;}
.lp-search{padding:10px 14px;border-bottom:1px solid var(--line);}
.lp-search .box{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:9px;padding:8px 11px;color:var(--sub);font-size:12.5px;}
.lp-search .box .material-symbols-outlined{font-size:18px;}
.lplist{max-height:560px;overflow-y:auto;}
.lprow{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center;min-width:0;transition:background .12s;}
.lprow:hover{background:var(--c2-soft);}
.lprow.sel{background:var(--c1-soft);box-shadow:inset 3px 0 0 var(--c1);}
.lprow .ic{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.lprow .mid{min-width:0;flex:1;}
.lprow .mid b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lprow .mid span{font-size:11px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lprow .rt{flex:none;text-align:right;font-size:11px;}
.detpane{min-width:0;display:flex;flex-direction:column;gap:16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800;}
.card .csub{font-size:12px;color:var(--sub);margin-bottom:14px;}
.chd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.chd b{font-size:14.5px;}
.chd .csub2{font-size:11.5px;color:var(--sub);}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:56px;height:56px;border-radius:50%;background:var(--c2-soft);}
.kpi .kt{font-size:11.5px;color:var(--sub);font-weight:600;position:relative;}
.kpi .kv{font-size:25px;font-weight:800;margin:5px 0 2px;position:relative;letter-spacing:-.5px;}
.kpi .kv small{font-size:12px;font-weight:600;color:var(--sub);}
.kpi .kd{font-size:11px;font-weight:700;position:relative;display:inline-flex;align-items:center;gap:3px;}
.kpi .kd .material-symbols-outlined{font-size:14px;}
.up{color:var(--ok);}.down{color:var(--bad);}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-ok{background:#dcfce7;color:#15803d;}.b-warn{background:#fef3c7;color:#b45309;}.b-bad{background:#fee2e2;color:#b91c1c;}.b-info{background:#dbeafe;color:#1d4ed8;}.b-gray{background:#f1f0ee;color:#57534e;}.b-orange{background:var(--c1-soft);color:var(--c1);}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;padding:10px 12px;font-size:11px;color:var(--sub);font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap;background:#faf9f8;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:var(--c2-soft);}
.mono{font-family:"Inter",monospace;font-weight:700;letter-spacing:.3px;}
/* progress */
.bar{height:7px;border-radius:99px;background:#efece9;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:99px;}
/* detail rows */
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
.drow:last-child{border-bottom:0;}
.drow .k{color:var(--sub);}.drow .v{font-weight:700;text-align:right;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;min-width:0;}
/* timeline */
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 16px 6px;}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--c2);}
.tli.done::before{background:var(--c1);border-color:var(--c1);}
.tli b{font-size:12.5px;}.tli .tm{font-size:11px;color:var(--sub);}
.tli p{margin:3px 0 0;font-size:12px;color:var(--sub);}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.bcol{background:var(--bg);border-radius:12px;padding:10px;min-width:0;}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;padding:2px 4px 9px;}
.bcol .bh span{background:#fff;border-radius:99px;padding:1px 8px;font-size:10.5px;color:var(--sub);}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0;}
.bcard:last-child{margin-bottom:0;}
.bcard b{font-size:12.5px;display:block;}
.bcard .bm{font-size:11px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between;gap:6px;}
.bcard .tp{height:3px;border-radius:99px;margin:-10px -10px 8px;}
/* life list */
.lifelist .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;}
.lifelist .li:last-child{border-bottom:0;}
.lifelist .li .nm{width:118px;flex:none;min-width:0;}
.lifelist .li .nm b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lifelist .li .nm span{font-size:10.5px;color:var(--sub);}
.lifelist .li .gr{flex:1;min-width:0;}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0;}
.calh{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding-bottom:4px;}
.cell{background:var(--bg);border-radius:9px;min-height:70px;padding:6px;font-size:11px;min-width:0;position:relative;}
.cell .dn{font-weight:700;font-size:11.5px;color:var(--sub);}
.cell.today{outline:2px solid var(--c2);background:var(--c2-soft);}
.cell .ev{margin-top:4px;font-size:10px;padding:2px 5px;border-radius:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-o{background:var(--c1-soft);color:var(--c1);}.ev-b{background:#dbeafe;color:#1d4ed8;}.ev-r{background:#fee2e2;color:#b91c1c;}.ev-g{background:#dcfce7;color:#15803d;}
/* rack map */
.rack{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:0;}
.slot{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;padding:4px;text-align:center;min-width:0;}
.slot small{font-size:9px;font-weight:500;opacity:.9;margin-top:2px;}
.slot.empty{background:#f1f0ee;color:#a8a29e;border:1.5px dashed #d6d3d1;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:12px;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
/* misc */
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:600;color:#57534e;}
.hint{font-size:11.5px;color:var(--sub);background:var(--c2-soft);border:1px solid #fed7aa;border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start;}
.hint .material-symbols-outlined{font-size:17px;color:var(--c1);flex:none;}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:2px 0 10px;}
.sec-title .material-symbols-outlined{font-size:19px;color:var(--c1);}
.ovx{overflow-x:auto;}
.tag2{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--c1-soft);color:var(--c1);}
.thumb{width:44px;height:44px;border-radius:9px;background:linear-gradient(135deg,#fed7aa,#fb923c);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.thumb .material-symbols-outlined{font-size:24px;}
@media(max-width:860px){
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;z-index:50;}
  .brand{display:none;}
  nav{flex-direction:row;gap:4px;}
  .navbtn{flex-direction:column;gap:3px;padding:7px 12px;min-width:66px;text-align:center;}
  .navbtn small{display:none;}
  .navbtn .nt{font-size:10.5px;}
  .side .foot{display:none;}
  .main{padding-bottom:74px;}
}
@media(max-width:820px){
  .split,.split.wide{grid-template-columns:1fr;}
  .kpis{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr 1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .rack{grid-template-columns:repeat(4,1fr);}
}
@media(max-width:560px){
  .navbtn .nt{display:none;}
  .kpis{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .wrap{padding:16px 13px 40px;}
  .top{padding:12px 14px;}
  .cal{gap:3px;}
  .cell{min-height:56px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>模具管理</b><span>MOLD / DIE MDMS</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot"><span class="dot"></span>MES / CMMS / QMS 已同步 · v4.2</div>
  </aside>
  <div class="main">
    <div class="top">
      <div>
        <h1 id="scTitle">模具台帳</h1>
        <div class="crumb" id="scCrumb">模具管理系統 · 資產履歷</div>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined">verified</span>妥善率 94.2%</span>
      <div class="who">
        <div class="av">林</div>
        <div><b>林建豪</b><span>模具工程師</span></div>
      </div>
    </div>
    <div class="wrap"><div id="screen"></div></div>
  </div>
</div>
<script>
"use strict";
var NAV=[
  {t:"模具台帳",s:"資產與履歷",i:"inventory_2"},
  {t:"使用次數追蹤",s:"模次累計",i:"tag"},
  {t:"保養排程",s:"預防保養",i:"event_repeat"},
  {t:"壽命預警",s:"風險預警",i:"warning"},
  {t:"維修工單",s:"派工完工",i:"handyman"},
  {t:"存放定位",s:"模架借還",i:"warehouse"}
];
var CRUMB=["模具管理系統 · 資產履歷","模具管理系統 · 模次追蹤","模具管理系統 · 保養排程","模具管理系統 · 壽命與風險","模具管理系統 · 維修工單","模具管理系統 · 存放與借還"];
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function statusColor(s){return {"正常":'#16a34a',"保養中":'#2563eb',"預警":'#d97706',"超期":'#dc2626',"停用":'#78716c'}[s]||'#78716c';}
function stBadge(s){return s==="正常"?"b-ok":s==="預警"?"b-warn":s==="超期"?"b-bad":s==="保養中"?"b-info":"b-gray";}

/* ================= data ================= */
var MOLDS=[
  {id:"MD-2201",name:"儀表框注塑模",cat:"射出",mc:"IMM-08 / 320T",use:184200,life:250000,st:"正常",mat:"NAK80",cav:4,cyc:"32.5s",owner:"林建豪",loc:"A-03",last:"2026-07-28",next:"2026-08-22"},
  {id:"MD-2187",name:"連接器沖壓模",cat:"沖壓",mc:"PRS-02 / 160T",use:892000,life:1000000,st:"預警",mat:"SKD11",cav:8,cyc:"—",owner:"陳彥廷",loc:"B-11",last:"2026-06-30",next:"2026-08-15"},
  {id:"MD-2245",name:"外殼上蓋模",cat:"射出",mc:"IMM-03 / 450T",use:61500,life:300000,st:"正常",mat:"718H",cav:2,cyc:"41.0s",owner:"林建豪",loc:"A-07",last:"2026-07-19",next:"2026-09-10"},
  {id:"MD-2098",name:"端子壓接模",cat:"沖壓",mc:"PRS-05 / 80T",use:1012000,life:1000000,st:"超期",mat:"SKD11",cav:12,cyc:"—",owner:"王思婷",loc:"B-02",last:"2026-05-11",next:"逾期"},
  {id:"MD-2260",name:"導光板注塑模",cat:"射出",mc:"IMM-11 / 220T",use:98700,life:200000,st:"保養中",mat:"S136",cav:1,cyc:"58.2s",owner:"陳彥廷",loc:"維修區",last:"2026-08-10",next:"2026-08-13"},
  {id:"MD-2173",name:"支架彎曲模",cat:"沖壓",mc:"PRS-01 / 200T",use:430500,life:800000,st:"正常",mat:"DC53",cav:2,cyc:"—",owner:"王思婷",loc:"B-08",last:"2026-07-25",next:"2026-09-02"},
  {id:"MD-2211",name:"風扇葉輪模",cat:"射出",mc:"IMM-06 / 180T",use:238000,life:250000,st:"預警",mat:"NAK80",cav:6,cyc:"27.8s",owner:"林建豪",loc:"A-12",last:"2026-07-02",next:"2026-08-14"},
  {id:"MD-2302",name:"散熱片抽引模",cat:"沖壓",mc:"PRS-03 / 315T",use:12400,life:600000,st:"正常",mat:"DC53",cav:1,cyc:"—",owner:"陳彥廷",loc:"B-15",last:"2026-08-05",next:"2026-11-01"}
];

/* ================= KPI helper ================= */
function kpi(t,v,u,d,delta,dir){
  return '<div class="kpi"><div class="kt">'+t+'</div><div class="kv">'+v+(u?'<small> '+u+'</small>':'')+'</div>'+
    (d?'<div class="kd" style="color:var(--sub)">'+d+'</div>':'')+
    (delta?'<div class="kd '+(dir||"")+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"remove")+'</span>'+delta+'</div>':'')+'</div>';
}

/* ================= screens ================= */
function screen0(){
  var sel=MOLDS[0];
  var rows=MOLDS.map(function(d,idx){
    var pct=Math.round(d.use/d.life*100);
    return '<div class="lprow'+(idx===0?' sel':'')+'"><div class="ic" style="background:'+(d.cat==="射出"?"linear-gradient(135deg,#c2410c,#fb923c)":"linear-gradient(135deg,#1d4ed8,#60a5fa)")+'">'+esc(d.cat)+'</div>'+
    '<div class="mid"><b>'+esc(d.name)+'</b><span>'+esc(d.id)+' · '+esc(d.mc)+'</span></div>'+
    '<div class="rt"><span class="bdg '+stBadge(d.st)+'">'+esc(d.st)+'</span><div style="margin-top:5px;color:var(--sub)">'+pct+'%</div></div></div>';
  }).join("");
  var pct=Math.round(sel.use/sel.life*100);
  return '<div class="split wide">'+

    '<div class="detpane">'+
      '<div class="card"><div class="chd" style="padding:0 0 12px;border:0"><b>模架存放定位圖</b><span class="csub2">A 區射出 / B 區沖壓</span></div>'+

      '<div class="card"><div class="sec-title"><span class="material-symbols-outlined">bar_chart</span>各區存放使用率</div><div id="c5a"></div></div>'+

/* ================= charts ================= */
var CHART_BASE={fontFamily:'Inter,Noto Sans TC,sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}};
var GRID={borderColor:'#eee'};
function mk(el,opt){var n=document.querySelector(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c);}

function drawCharts(i){
  if(i===1){
    mk("#c1a",{chart:Object.assign({type:'bar',height:300},CHART_BASE),series:[{name:'今日模次',data:[9800,7200,6100,5400,4200,3100,2400]}],
      plotOptions:{bar:{horizontal:true,borderRadius:5,barHeight:'62%'}},colors:['#c2410c'],dataLabels:{enabled:true,style:{fontSize:'11px',colors:['#fff']},formatter:function(v){return (v/1000).toFixed(1)+'k';}},
      xaxis:{categories:['IMM-08','PRS-02','IMM-03','IMM-06','PRS-01','IMM-11','PRS-05'],labels:{style:{fontSize:'11px'}}},grid:GRID,legend:{show:false}});
    mk("#c1b",{chart:Object.assign({type:'line',height:300},CHART_BASE),
      series:[{name:'MD-2187 沖壓模',data:[720,748,765,789,812,838,865,892]},{name:'MD-2201 注塑模',data:[128,142,151,160,168,174,180,184]},{name:'MD-2211 葉輪模',data:[198,208,215,222,228,232,235,238]}],
      colors:['#c2410c','#fb923c','#1d4ed8'],stroke:{width:3,curve:'smooth'},markers:{size:3},
      xaxis:{categories:['W1','W2','W3','W4','W5','W6','W7','W8']},yaxis:{labels:{formatter:function(v){return v+'k';}}},grid:GRID,legend:{position:'top'},dataLabels:{enabled:false}});
  }else if(i===3){
    mk("#c3a",{chart:Object.assign({type:'radar',height:320},CHART_BASE),
      series:[{name:'MD-2098',data:[20,35,25,30,15]},{name:'MD-2211',data:[48,52,45,50,54]},{name:'MD-2187',data:[55,60,50,58,62]}],
      colors:['#dc2626','#fb923c','#c2410c'],stroke:{width:2},fill:{opacity:.12},markers:{size:3},
      xaxis:{categories:['剩餘壽命','合模精度','表面狀態','量測合格','保養時效']},yaxis:{show:false,min:0,max:100},legend:{position:'top'},dataLabels:{enabled:false}});
    mk("#c3b",{chart:Object.assign({type:'donut',height:290},CHART_BASE),
      series:[3,2,3],labels:['正常 (0-70%)','預警 (70-85%)','高風險 (>85%)'],colors:['#16a34a','#fb923c','#dc2626'],
      plotOptions:{pie:{donut:{size:'66%',labels:{show:true,total:{show:true,label:'模具總數',formatter:function(){return '8 副';}}}}}},legend:{position:'bottom'},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+'%';}}});
  }else if(i===4){
    mk("#c4a",{chart:Object.assign({type:'bar',height:300},CHART_BASE),series:[{name:'次數',data:[9,7,5,4,3]}],
      plotOptions:{bar:{borderRadius:6,columnWidth:'52%',distributed:true}},colors:['#c2410c','#ea580c','#fb923c','#fdba74','#fed7aa'],
      xaxis:{categories:['磨損','崩損','刮傷','堵料','潤滑'],labels:{style:{fontSize:'11px'}}},grid:GRID,legend:{show:false},dataLabels:{enabled:true,style:{colors:['#7c2d0e']}}});
    mk("#c4b",{chart:Object.assign({type:'area',height:270},CHART_BASE),series:[{name:'MTTR 小時',data:[2.8,2.5,2.2,1.9,1.7,1.6]}],
      colors:['#c2410c'],stroke:{width:3,curve:'smooth'},fill:{type:'gradient',gradient:{shadeIntensity:.5,opacityFrom:.4,opacityTo:.05}},
      xaxis:{categories:['3月','4月','5月','6月','7月','8月']},yaxis:{labels:{formatter:function(v){return v+'h';}}},grid:GRID,legend:{show:false},dataLabels:{enabled:false},markers:{size:4}});
  }else if(i===5){
    mk("#c5a",{chart:Object.assign({type:'bar',height:300,stacked:true},CHART_BASE),
      series:[{name:'已用',data:[14,10,4]},{name:'空位',data:[4,6,0]}],
      plotOptions:{bar:{borderRadius:5,columnWidth:'46%'}},colors:['#c2410c','#e7e5e4'],
      xaxis:{categories:['A 區(射出)','B 區(沖壓)','維修區']},grid:GRID,legend:{position:'top'},dataLabels:{enabled:false}});
  }
}

/* ================= show ================= */
var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  document.getElementById("scTitle").textContent=NAV[i].t;
  document.getElementById("scCrumb").textContent=CRUMB[i];
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  drawCharts(i);
}
(function initNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n,idx){return '<button class="navbtn" data-i="'+idx+'"><span class="material-symbols-outlined">'+n.i+'</span><span class="nt">'+n.t+'<small>'+n.s+'</small></span></button>';}).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++)btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
