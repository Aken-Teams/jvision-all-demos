<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>精實生產管理平台｜Lean Manufacturing Management Platform</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#a16207; --accent2:#eab308; --bg:#faf8f3; --panel:#ffffff;
  --line:#eadfc9; --ink:#3a3222; --muted:#8a7f68; --soft:#f5efe1;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#0369a1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
header{background:linear-gradient(100deg,#78500a,#a16207);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:10px;min-width:0;}
.logo .mk{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;}
.logo .mk .material-symbols-outlined{font-size:24px;}
.logo h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
.logo p{font-size:11px;margin:0;opacity:.82;white-space:nowrap;}
.hstat{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;}
.hstat div{text-align:right;min-width:0;}
.hstat b{font-size:15px;display:block;}
.hstat span{font-size:10px;opacity:.8;}
nav{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
nav button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
nav button .material-symbols-outlined{font-size:19px;}
nav button:hover{border-color:var(--accent2);color:var(--accent);}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(161,98,7,.28);}
main{padding:20px;max-width:1360px;margin:0 auto;}
.scr-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.scr-head .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
.scr-head .ic .material-symbols-outlined{font-size:26px;}
.scr-head h2{margin:0;font-size:19px;}
.scr-head p{margin:2px 0 0;font-size:12px;color:var(--muted);}
.tag{margin-left:auto;background:var(--soft);color:var(--accent);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.grid{display:grid;gap:14px;}
.min0>*{min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr;}.g2,.g3,.g23,.g32{grid-template-columns:1fr;}}
@media(max-width:560px){.hstat{display:none;}nav button span.lbl{display:none;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2);}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;}
.kpi .val small{font-size:12px;font-weight:500;color:var(--muted);}
.kpi .dt{font-size:11px;margin-top:5px;font-weight:600;}
.up{color:var(--ok);}.down{color:var(--bad);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--soft);color:var(--muted);font-weight:600;font-size:12px;}
tbody tr:hover{background:#fdfbf5;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.p-ok{background:#dcfce7;color:var(--ok);}
.p-warn{background:#fef3c7;color:var(--warn);}
.p-bad{background:#fee2e2;color:var(--bad);}
.p-info{background:#e0f2fe;color:var(--info);}
.p-mut{background:#eee7d6;color:var(--muted);}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:70px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.scroll{overflow-x:auto;}
.vsm{display:flex;gap:0;align-items:stretch;min-width:720px;}
.vsm .stp{flex:1;min-width:120px;text-align:center;}
.vsm .box{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px 8px;}
.vsm .box .nm{font-weight:700;font-size:13px;}
.vsm .box .material-symbols-outlined{font-size:22px;color:var(--accent);}
.vsm .box small{display:block;color:var(--muted);font-size:11px;margin-top:3px;}
.vsm .arw{display:flex;align-items:center;justify-content:center;color:var(--accent2);padding:0 2px;}
.vsm .arw .material-symbols-outlined{font-size:26px;}
.kb{display:flex;gap:12px;min-width:720px;}
.kb .col{flex:1;min-width:150px;background:var(--soft);border-radius:12px;padding:10px;}
.kb .col h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.kb .col h4 .cnt{background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:9px;padding:9px;margin-bottom:9px;}
.kcard .t{font-weight:700;font-size:12px;}
.kcard .m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:6px;align-items:center;}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.wrow .wi{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
.wrow .wn{flex:none;width:96px;font-weight:600;font-size:13px;}
.wrow .bar{flex:1;}
.wrow .wp{flex:none;width:52px;text-align:right;font-weight:700;font-size:13px;}
.tline{position:relative;padding-left:22px;}
.tline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tline .ev{position:relative;padding:0 0 16px 6px;}
.tline .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line);}
.tline .ev .d{font-size:11px;color:var(--muted);}
.tline .ev .h{font-weight:700;font-size:13px;margin:2px 0;}
.tline .ev .x{font-size:12px;color:var(--muted);}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.ck .cb{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;}
.ck .cb.y{background:#dcfce7;color:var(--ok);}
.ck .cb.n{background:#fee2e2;color:var(--bad);}
.ck .cb .material-symbols-outlined{font-size:15px;}
.ck .ct{flex:1;font-size:13px;}
.ck .cd{font-size:11px;color:var(--muted);}
.note{background:var(--soft);border-radius:10px;padding:11px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;}
.note .material-symbols-outlined{color:var(--accent);font-size:19px;flex:none;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;}
.mt{margin-top:14px;}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="mk"><span class="material-symbols-outlined">precision_manufacturing</span></div>
    <div>
      <h1>精實生產管理平台</h1>
      <p>Lean Manufacturing Management Platform</p>
    </div>
  </div>
  <div class="hstat">
    <div><b>18.4%</b><span>整體浪費比率</span></div>
    <div><b>84%</b><span>標準化覆蓋率</span></div>
    <div><b>82.6%</b><span>綜合 OEE</span></div>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function elx(id){return document.getElementById(id);}
function mk(id,opt){var node=elx(id);if(!node)return;var c=new ApexCharts(node,opt);c.render();charts.push(c);}
function baseChart(type,height,extra){var c={type:type,height:height,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Inter,Noto Sans TC,sans-serif"};if(extra){for(var k in extra){c[k]=extra[k];}}return c;}

var MODS=[
 {ic:"conveyor_belt",nm:"價值流地圖",sub:"全流程節拍、庫存與前置時間視覺化"},
 {ic:"view_kanban",nm:"看板拉動排產",sub:"看板卡循環、在製品上限與補料觸發"},
 {ic:"delete_sweep",nm:"七大浪費分析",sub:"過量、等待、搬運等浪費比率盤點"},
 {ic:"lightbulb",nm:"改善提案追蹤",sub:"Kaizen 提案登錄、PDCA 與效益結案"},
 {ic:"checklist",nm:"標準作業 SOP",sub:"標準工時、稽核覆蓋率與 5S 點檢"},
 {ic:"insights",nm:"精實指標儀表板",sub:"OEE、稼動、達交與浪費綜合監控"}
];

function head(i,tag){var m=MODS[i];return '<div class="scr-head"><div class="ic"><span class="material-symbols-outlined">'+m.ic+'</span></div><div><h2>'+m.nm+'</h2><p>'+m.sub+'</p></div><div class="tag">'+tag+'</div></div>';}
function kpi(lab,ic,val,unit,dt,cls){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+(cls||'')+'">'+dt+'</div></div>';}
function barw(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}

function s0(){
 var steps=[
  {nm:"進料檢驗",ic:"input",ct:"18min",wip:"420"},
  {nm:"CNC 加工",ic:"precision_manufacturing",ct:"46min",wip:"680"},
  {nm:"表面處理",ic:"blur_on",ct:"32min",wip:"1150"},
  {nm:"組裝線",ic:"handyman",ct:"58min",wip:"540"},
  {nm:"品檢包裝",ic:"inventory_2",ct:"24min",wip:"310"}
 ];
 var vsm='<div class="scroll"><div class="vsm">';
 for(var i=0;i<steps.length;i++){var s=steps[i];
  vsm+='<div class="stp"><div class="box"><span class="material-symbols-outlined">'+s.ic+'</span><div class="nm">'+s.nm+'</div><small>週期 '+s.ct+'</small><small>WIP '+s.wip+' 件</small></div></div>';
  if(i<steps.length-1){vsm+='<div class="arw"><span class="material-symbols-outlined">chevron_right</span></div>';}
 }
 vsm+='</div></div>';
 var h=head(0,"價值流 · 第 32 週");
 h+='<div class="grid kpis min0">'
   +kpi("總前置時間","timer","6.4","天","增值僅占 27%","")
   +kpi("增值時間","bolt","1.7","天","VA / LT 27%","up")
   +kpi("在製品 WIP","inventory","3,100","件","較上週 -8%","up")
   +kpi("流動效率","water_drop","27","%","目標 40%","down")
   +'</div>';
 h+='<div class="card mt"><h3><span class="material-symbols-outlined">timeline</span>當前價值流地圖（Current State）</h3>'+vsm
   +'<div class="note mt"><span class="material-symbols-outlined">info</span>各工序標示週期時間與在製品，其中「表面處理」前 WIP 堆積 1,150 件為主要瓶頸。</div></div>';
 h+='<div class="grid g23 min0 mt">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各工序增值 vs 非增值時間（分）</h3><div id="c0a"></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">insights</span>流動效率趨勢（%）</h3><div id="c0b"></div></div>';
 h+='</div>';
 elx("app").innerHTML='<div>'+h+'</div>';
 void elx("app").offsetHeight;
 mk("c0a",{series:[{name:"增值",data:[12,28,8,34,16]},{name:"非增值",data:[6,18,24,24,8]}],
   chart:baseChart("bar",300,{stacked:true}),colors:["#a16207","#e7cfa0"],
   plotOptions:{bar:{horizontal:false,columnWidth:"52%"}},dataLabels:{enabled:false},
   xaxis:{categories:["進料","CNC","表面","組裝","品檢"]},legend:{position:"top"},grid:{borderColor:"#eadfc9"}});
 mk("c0b",{series:[{name:"流動效率",data:[19,21,22,24,25,27]}],chart:baseChart("area",300),
   colors:["#a16207"],stroke:{width:2,curve:"smooth"},fill:{type:"gradient",gradient:{opacityFrom:.4,opacityTo:.05}},
   dataLabels:{enabled:false},xaxis:{categories:["W27","W28","W29","W30","W31","W32"]},yaxis:{max:40},grid:{borderColor:"#eadfc9"}});
}

function s1(){
 var cols=[
  {t:"看板待補",cnt:4,cards:[
    {t:"WO-2261 鋁支架",a:"補料 · 200 件",b:"P1"},
    {t:"WO-2274 主軸座",a:"補料 · 120 件",b:"P1"},
    {t:"WO-2288 側板",a:"補料 · 300 件",b:"P2"},
    {t:"WO-2290 端蓋",a:"補料 · 90 件",b:"P3"}
  ]},
  {t:"生產中",cnt:3,cards:[
    {t:"WO-2255 齒輪箱",a:"CNC-03",b:"62%"},
    {t:"WO-2258 法蘭盤",a:"CNC-01",b:"38%"},
    {t:"WO-2260 軸承座",a:"表面-02",b:"81%"}
  ]},
  {t:"待檢驗",cnt:2,cards:[
    {t:"WO-2249 連桿",a:"QC 佇列",b:"15 件"},
    {t:"WO-2251 外殼",a:"QC 佇列",b:"40 件"}
  ]},
  {t:"已完成",cnt:2,cards:[
    {t:"WO-2240 底座",a:"入庫",b:"180 件"},
    {t:"WO-2243 支撐板",a:"入庫",b:"260 件"}
  ]}
 ];
 var kb='<div class="scroll"><div class="kb">';
 for(var i=0;i<cols.length;i++){var c=cols[i];kb+='<div class="col"><h4>'+c.t+'<span class="cnt">'+c.cnt+'</span></h4>';
  for(var j=0;j<c.cards.length;j++){var cd=c.cards[j];kb+='<div class="kcard"><div class="t">'+cd.t+'</div><div class="m"><span>'+cd.a+'</span><span class="pill p-mut">'+cd.b+'</span></div></div>';}
  kb+='</div>';}
 kb+='</div></div>';
 var h=head(1,"拉動式 · 即時");
 h+='<div class="grid kpis min0">'
   +kpi("看板卡在線","view_kanban","46","張","循環正常","")
   +kpi("WIP 上限","layers","3,400","件","實際 3,100","up")
   +kpi("補料觸發","notifications_active","4","筆","待處理 P1×2","down")
   +kpi("拉動達成率","cached","94","%","目標 95%","")
   +'</div>';
 h+='<div class="card mt"><h3><span class="material-symbols-outlined">view_kanban</span>看板拉動板</h3>'+kb+'</div>';
 h+='<div class="grid g2 min0 mt">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各工站 WIP vs 上限（件）</h3><div id="c1a"></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>看板卡循環時間（小時）</h3><div id="c1b"></div></div>';
 h+='</div>';
 elx("app").innerHTML='<div>'+h+'</div>';
 void elx("app").offsetHeight;
 mk("c1a",{series:[{name:"實際 WIP",data:[420,680,1150,540,310]},{name:"上限",data:[500,800,900,700,500]}],
   chart:baseChart("bar",300),colors:["#a16207","#eab308"],plotOptions:{bar:{columnWidth:"55%"}},
   dataLabels:{enabled:false},xaxis:{categories:["進料","CNC","表面","組裝","品檢"]},legend:{position:"top"},grid:{borderColor:"#eadfc9"}});
 mk("c1b",{series:[{name:"循環時間",data:[8.2,7.6,7.1,6.8,6.4,6.1]}],chart:baseChart("line",300),
   colors:["#a16207"],stroke:{width:2,curve:"smooth"},markers:{size:4},dataLabels:{enabled:false},
   xaxis:{categories:["W27","W28","W29","W30","W31","W32"]},grid:{borderColor:"#eadfc9"}});
}

function s2(){
 var wastes=[
  {nm:"過量生產",ic:"inventory_2",p:9},
  {nm:"庫存",ic:"warehouse",p:23},
  {nm:"等待",ic:"hourglass_empty",p:19},
  {nm:"搬運",ic:"local_shipping",p:16},
  {nm:"多餘動作",ic:"directions_run",p:11},
  {nm:"過度加工",ic:"build",p:8},
  {nm:"不良重工",ic:"error",p:14}
 ];
 var list='';
 for(var i=0;i<wastes.length;i++){var w=wastes[i];
  list+='<div class="wrow"><div class="wi"><span class="material-symbols-outlined">'+w.ic+'</span></div><div class="wn">'+w.nm+'</div>'+barw(w.p)+'<div class="wp">'+w.p+'%</div></div>';}
 var h=head(2,"浪費盤點 · 月報");
 h+='<div class="grid kpis min0">'
   +kpi("整體浪費比率","percent","18.4","%","較上月 -2.1pt","up")
   +kpi("最大浪費源","priority_high","庫存","","占比 23%","down")
   +kpi("量化損失","payments","186","萬/月","可改善空間","down")
   +kpi("改善潛力","trending_down","-31","%","若消除前三大","up")
   +'</div>';
 h+='<div class="grid g2 min0 mt">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">delete_sweep</span>七大浪費占比</h3>'+list+'</div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>浪費金額分布（萬元）</h3><div id="c2a"></div></div>';
 h+='</div>';
 h+='<div class="card mt"><h3><span class="material-symbols-outlined">radar</span>各產線精實成熟度雷達</h3><div id="c2b"></div></div>';
 elx("app").innerHTML='<div>'+h+'</div>';
 void elx("app").offsetHeight;
 mk("c2a",{series:[43,35,30,26,18,14,20],chart:baseChart("donut",320),
   labels:["過量","庫存","等待","搬運","動作","加工","重工"],
   colors:["#78500a","#a16207","#c98a12","#eab308","#f0c94a","#d9b45f","#b45309"],
   dataLabels:{enabled:false},legend:{position:"bottom"},plotOptions:{pie:{donut:{size:"62%"}}}});
 mk("c2b",{series:[{name:"A 產線",data:[78,64,70,55,82]},{name:"B 產線",data:[62,58,66,74,60]}],
   chart:baseChart("radar",340),colors:["#a16207","#eab308"],stroke:{width:2},fill:{opacity:.18},
   markers:{size:3},xaxis:{categories:["流動化","標準化","5S","目視化","拉動化"]},
   yaxis:{max:100,tickAmount:5},grid:{borderColor:"#eadfc9"}});
}

function s3(){
 var rows=[
  {id:"KZ-118",t:"表面處理 WIP 削減",own:"李承翰",st:"Do",p:60,eff:"-42% 等待",cls:"p-info"},
  {id:"KZ-115",t:"CNC 換模 SMED",own:"王思婷",st:"Check",p:80,eff:"-18min",cls:"p-warn"},
