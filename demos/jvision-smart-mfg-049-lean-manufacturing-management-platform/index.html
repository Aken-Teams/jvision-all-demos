<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>精實生產管理平台｜Lean Manufacturing Management Platform</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --soft:var(--color-muted);
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --ok:#15803D;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 8px 24px rgba(15,23,42,.07);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;background:var(--bg);}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  min-height:100vh;
  font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;}
button,a,[role='button']{cursor:pointer;}
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
header{
  min-height:88px;
  padding:16px clamp(18px,3vw,40px);
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
  color:var(--color-on-primary);
  background:#0F2E67;
  border-bottom:4px solid var(--color-primary);
  box-shadow:0 6px 18px rgba(15,46,103,.16);
}
.logo{display:flex;align-items:center;gap:13px;min-width:0;}
.logo .mk{
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.38);
  border-radius:6px;
  background:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.logo .mk .material-symbols-outlined{font-size:25px;}
.logo h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.logo p{margin:2px 0 0;font-family:'Fira Code',monospace;font-size:10px;letter-spacing:.08em;opacity:.8;white-space:nowrap;}
.hstat{margin-left:auto;display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
.hstat div{min-width:120px;padding:3px 18px;text-align:right;border-left:1px solid rgba(255,255,255,.22);}
.hstat b{display:block;font-family:'Fira Code',monospace;font-size:17px;font-variant-numeric:tabular-nums;}
.hstat span{font-size:11px;color:#DBEAFE;}
nav{
  position:sticky;
  top:0;
  z-index:20;
  padding:10px clamp(14px,3vw,40px);
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:thin;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);
}
nav button{
  min-height:44px;
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 13px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:var(--muted);
  white-space:nowrap;
  font-size:13px;
  font-weight:600;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
nav button .material-symbols-outlined{font-size:19px;}
nav button:hover{color:var(--color-primary);background:#EFF6FF;border-color:#BFDBFE;transform:translateY(-1px);}
nav button.on{color:var(--color-on-primary);background:var(--color-primary);border-color:var(--color-primary);box-shadow:0 4px 12px rgba(37,99,235,.22);}
nav button.on:hover{background:#1D4ED8;transform:none;}
main{width:100%;max-width:1440px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 48px;}
.scr-head{
  min-height:70px;
  margin-bottom:20px;
  padding-bottom:18px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.scr-head .ic{
  width:48px;
  height:48px;
  border:1px solid #BFDBFE;
  border-radius:6px;
  background:#EFF6FF;
  color:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.scr-head .ic .material-symbols-outlined{font-size:27px;}
.scr-head h2{margin:0;font-size:clamp(20px,2vw,26px);line-height:1.2;letter-spacing:-.02em;}
.scr-head p{margin:5px 0 0;color:var(--muted);font-size:12px;}
.tag{
  margin-left:auto;
  padding:6px 10px;
  border:1px solid #BFDBFE;
  border-radius:4px;
  background:#EFF6FF;
  color:#1D4ED8;
  font-family:'Fira Code',monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
}
.grid{display:grid;gap:16px;}
.min0>*{min-width:0;}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr);}
.card,.kpi{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:7px;
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#BFDBFE;box-shadow:var(--shadow-md);transform:translateY(-2px);}
.card{padding:18px;}
.card h3{
  margin:0 0 16px;
  padding-bottom:11px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  line-height:1.35;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.kpi{position:relative;overflow:hidden;padding:17px 18px 16px;}
.kpi::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-primary);}
.kpi::after{content:'';position:absolute;top:0;right:0;width:44px;height:44px;background:linear-gradient(135deg,transparent 50%,#EFF6FF 50%);}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:500;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary);}
.kpi .val{margin-top:9px;font-family:'Fira Code',monospace;font-size:clamp(23px,2.4vw,29px);font-weight:700;line-height:1.1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.kpi .val small{font-family:'Fira Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;}
.kpi .dt{margin-top:8px;font-size:11px;font-weight:600;}
.up{color:var(--ok);}
.up::before{content:'✓ ';font-weight:700;}
.down{color:var(--bad);}
.down::before{content:'! ';font-weight:700;}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{text-align:right;background:#F1F5F9;color:#334155;font-size:11px;font-weight:700;letter-spacing:.035em;text-transform:none;}
th:first-child,th:nth-child(2),td:first-child,td:nth-child(2){text-align:left;}
td{text-align:right;color:#334155;}
td b,td:first-child{font-family:'Fira Code',monospace;font-weight:600;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#EFF6FF;}
tbody tr:last-child td{border-bottom:0;}
.pill{display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:700;line-height:1.2;}
.pill::before{content:'●';margin-right:5px;font-size:7px;}
.p-ok{background:#F0FDF4;color:#166534;}
.p-warn{background:#FFF7ED;color:#9A3412;}
.p-bad{background:#FEF2F2;color:#B91C1C;}
.p-info{background:#EFF6FF;color:#1D4ED8;}
.p-mut{background:#F1F5F9;color:#475569;}
.bar{height:8px;min-width:70px;overflow:hidden;border-radius:2px;background:#E2E8F0;}
.bar>i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));}
.scroll{max-width:100%;overflow-x:auto;scrollbar-color:#94A3B8 #E2E8F0;scrollbar-width:thin;}
.vsm{min-width:760px;display:flex;align-items:stretch;gap:0;}
.vsm .stp{min-width:126px;flex:1;text-align:center;}
.vsm .box{height:100%;padding:13px 9px;border:1px solid #93C5FD;border-top:3px solid var(--color-primary);border-radius:5px;background:#FFF;}
.vsm .box .nm{margin-top:5px;font-weight:700;font-size:13px;}
.vsm .box .material-symbols-outlined{font-size:23px;color:var(--color-primary);}
.vsm .box small{display:block;margin-top:3px;color:var(--muted);font-family:'Fira Code',monospace;font-size:10px;font-variant-numeric:tabular-nums;}
.vsm .arw{padding:0 3px;display:flex;align-items:center;justify-content:center;color:var(--color-primary);}
.vsm .arw .material-symbols-outlined{font-size:25px;}
.kb{min-width:760px;display:flex;gap:12px;}
.kb .col{min-width:165px;flex:1;padding:11px;border:1px solid var(--line);border-radius:5px;background:#F8FAFC;}
.kb .col h4{margin:0 0 11px;display:flex;align-items:center;justify-content:space-between;font-size:13px;}
.kb .col h4 .cnt{min-width:23px;padding:2px 7px;border-radius:999px;background:var(--color-primary);color:var(--color-on-primary);font-family:'Fira Code',monospace;font-size:10px;text-align:center;}
.kcard{margin-bottom:9px;padding:10px;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:4px;background:#FFF;box-shadow:var(--shadow-sm);transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;}
.kcard:hover{border-color:#93C5FD;box-shadow:0 6px 16px rgba(15,23,42,.08);transform:translateY(-1px);}
.kcard:last-child{margin-bottom:0;}
.kcard .t{font-family:'Fira Code',monospace;font-size:11px;font-weight:700;}
.kcard .m{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px;}
.wrow{padding:10px 0;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);}
.wrow:last-child{border-bottom:0;}
.wrow .wi{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #BFDBFE;border-radius:4px;background:#EFF6FF;color:var(--color-primary);}
.wrow .wn{width:96px;flex:none;font-size:13px;font-weight:600;}
.wrow .bar{flex:1;}
.wrow .wp{width:52px;flex:none;text-align:right;font-family:'Fira Code',monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.tline{position:relative;padding-left:25px;}
.tline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:#93C5FD;}
.tline .ev{position:relative;padding:0 0 19px 8px;}
.tline .ev:last-child{padding-bottom:0;}
.tline .ev::before{content:'';position:absolute;left:-22px;top:3px;width:9px;height:9px;border:3px solid #DBEAFE;border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 2px #FFF;}
.tline .ev .d{color:var(--color-primary);font-family:'Fira Code',monospace;font-size:10px;font-weight:600;}
.tline .ev .h{margin:3px 0;font-size:13px;font-weight:700;}
.tline .ev .x{color:var(--muted);font-size:12px;}
.ck{min-height:55px;padding:9px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
.ck:last-child{border-bottom:0;}
.ck .cb{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid currentColor;border-radius:4px;}
.ck .cb.y{background:#F0FDF4;color:#166534;}
.ck .cb.n{background:#FFF7ED;color:#9A3412;}
.ck .cb .material-symbols-outlined{font-size:15px;font-weight:700;}
.ck .ct{flex:1;font-size:13px;font-weight:500;}
.ck .cd{margin-top:2px;color:var(--muted);font-family:'Fira Code',monospace;font-size:10px;font-weight:400;}
.note{padding:12px 13px;display:flex;align-items:flex-start;gap:9px;border:1px solid #BFDBFE;border-left:3px solid var(--color-primary);border-radius:4px;background:#EFF6FF;color:#334155;font-size:12px;}
.note .material-symbols-outlined{flex:none;color:var(--color-primary);font-size:19px;}
.legend{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;}
.legend b{width:10px;height:10px;margin-right:5px;display:inline-block;border-radius:2px;}
.mt{margin-top:16px;}
.apexcharts-canvas{font-family:'Fira Sans',sans-serif!important;}
.apexcharts-text{fill:#475569!important;}
.apexcharts-gridline{stroke:#E2E8F0!important;}
#app>div{animation:screen-in .42s cubic-bezier(.2,.8,.2,1) both;}
#app .grid>*{animation:tile-in .4s cubic-bezier(.2,.9,.3,1.25) both;}
#app .grid>*:nth-child(2){animation-delay:.06s;}
#app .grid>*:nth-child(3){animation-delay:.12s;}
#app .grid>*:nth-child(4){animation-delay:.18s;}
@keyframes screen-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes tile-in{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:1fr;}
  header{min-height:80px;}
  .hstat div{min-width:105px;padding-inline:12px;}
}
@media(max-width:768px){
  main{padding-top:22px;}
  .g2,.g3{grid-template-columns:1fr;}
  .hstat{width:100%;margin-left:0;}
  .hstat div{flex:1;text-align:left;border-left:0;border-right:1px solid rgba(255,255,255,.22);}
  .hstat div:first-child{padding-left:0;}
  nav{flex-wrap:nowrap;}
  .card{padding:15px;}
}
@media(max-width:560px){
  header{padding:13px 16px;}
  .logo h1{font-size:15px;}
  .logo p{font-size:8px;}
  .hstat{display:none;}
  nav{padding:8px 12px;}
  nav button{min-width:44px;justify-content:center;padding:9px 11px;}
  nav button span.lbl{display:none;}
  main{padding:18px 12px 36px;}
  .scr-head{align-items:flex-start;}
  .scr-head .ic{width:42px;height:42px;}
  .scr-head p{max-width:250px;}
  .tag{width:100%;margin-left:0;text-align:center;}
  .kpis{grid-template-columns:1fr;gap:10px;}
  .kpi{padding:15px 16px;}
  .kpi .val{font-size:25px;}
  .card:hover,.kpi:hover,.kcard:hover{transform:none;}
  .wrow{gap:8px;}
  .wrow .wn{width:80px;font-size:12px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  #app>div,#app .grid>*{animation:none!important;opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="mk"><span class="material-symbols-outlined">precision_manufacturing</span></div>
    <div>
      <h1>精實生產管理平台</h1>
      <p>Lean Manufacturing Management Platform</p>
    </div>
  </div>
  <div class="hstat">
    <div><b>18.4%</b><span>整體浪費比率</span></div>
    <div><b>84%</b><span>標準化覆蓋率</span></div>
    <div><b>82.6%</b><span>綜合 OEE</span></div>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function elx(id){return document.getElementById(id);}
function mk(id,opt){var node=elx(id);if(!node)return;var c=new ApexCharts(node,opt);c.render();charts.push(c);}
function baseChart(type,height,extra){var c={type:type,height:height,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Inter,Noto Sans TC,sans-serif"};if(extra){for(var k in extra){c[k]=extra[k];}}return c;}

var MODS=[
 {ic:"conveyor_belt",nm:"價值流地圖",sub:"全流程節拍、庫存與前置時間視覺化"},
 {ic:"view_kanban",nm:"看板拉動排產",sub:"看板卡循環、在製品上限與補料觸發"},
 {ic:"delete_sweep",nm:"七大浪費分析",sub:"過量、等待、搬運等浪費比率盤點"},
 {ic:"lightbulb",nm:"改善提案追蹤",sub:"Kaizen 提案登錄、PDCA 與效益結案"},
 {ic:"checklist",nm:"標準作業 SOP",sub:"標準工時、稽核覆蓋率與 5S 點檢"},
 {ic:"insights",nm:"精實指標儀表板",sub:"OEE、稼動、達交與浪費綜合監控"}
];

function head(i,tag){var m=MODS[i];return '<div class="scr-head"><div class="ic"><span class="material-symbols-outlined">'+m.ic+'</span></div><div><h2>'+m.nm+'</h2><p>'+m.sub+'</p></div><div class="tag">'+tag+'</div></div>';}
function kpi(lab,ic,val,unit,dt,cls){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+(cls||'')+'">'+dt+'</div></div>';}
function barw(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}

function s0(){
 var steps=[
  {nm:"進料檢驗",ic:"input",ct:"18min",wip:"420"},
  {nm:"CNC 加工",ic:"precision_manufacturing",ct:"46min",wip:"680"},
  {nm:"表面處理",ic:"blur_on",ct:"32min",wip:"1150"},
  {nm:"組裝線",ic:"handyman",ct:"58min",wip:"540"},
  {nm:"品檢包裝",ic:"inventory_2",ct:"24min",wip:"310"}
 ];
 var vsm='<div class="scroll"><div class="vsm">';
 for(var i=0;i<steps.length;i++){var s=steps[i];
  vsm+='<div class="stp"><div class="box"><span class="material-symbols-outlined">'+s.ic+'</span><div class="nm">'+s.nm+'</div><small>週期 '+s.ct+'</small><small>WIP '+s.wip+' 件</small></div></div>';
  if(i<steps.length-1){vsm+='<div class="arw"><span class="material-symbols-outlined">chevron_right</span></div>';}
 }
 vsm+='</div></div>';
 var h=head(0,"價值流 · 第 32 週");
 h+='<div class="grid kpis min0">'
   +kpi("總前置時間","timer","6.4","天","增值僅占 27%","")
   +kpi("增值時間","bolt","1.7","天","VA / LT 27%","up")
   +kpi("在製品 WIP","inventory","3,100","件","較上週 -8%","up")
   +kpi("流動效率","water_drop","27","%","目標 40%","down")
   +'</div>';
