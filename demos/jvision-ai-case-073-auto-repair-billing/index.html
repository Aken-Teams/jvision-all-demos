<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>汽修保養請款艙 · Auto Repair Billing｜Jvision 系統 Demo</title>
<meta name="description" content="進廠維修單、車況檢查估價、零件庫存、工時派工到請款結算的汽修保養一站式管理（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#008F11;
  --color-on-secondary:#000000;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#0D1117;
  --color-foreground:#E6EDF3;
  --color-card:#182424;
  --color-card-foreground:#E6EDF3;
  --color-muted:#25292F;
  --color-muted-foreground:#A8B6C8;
  --color-border:#30363D;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;
  --blue:#00FF41;
  --ink:#E6EDF3;
  --muted:#A8B6C8;
  --line:#30363D;
  --ok:#00FF41;
  --warn:#FFD166;
  --bad:#FF5C5C;
  --panel:#12191D;
  --mono:"Josefin Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px),
    radial-gradient(circle at 78% 8%,rgba(0,143,17,.18),transparent 30%),
    var(--color-background);
  background-size:32px 32px,32px 32px,auto,auto;
  color:var(--color-foreground);
  font-family:"Josefin Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  line-height:1;
  vertical-align:middle;
}
.shell{display:flex;min-height:100vh}
.side{
  width:270px;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:rgba(8,14,17,.96);
  border-right:1px solid var(--color-border);
  box-shadow:12px 0 48px rgba(0,0,0,.3);
}
.side::before,.card::before,.slip::before{
  content:"";
  position:absolute;
  inset:0 auto auto 0;
  width:44px;
  height:1px;
  background:var(--color-primary);
  box-shadow:0 0 12px var(--color-primary);
}
.side-brand{display:flex;align-items:center;gap:13px;padding:22px 19px 17px}
.side-logo{
  width:46px;height:46px;flex:none;
  display:grid;place-items:center;
  color:var(--color-primary);
  background:rgba(0,255,65,.07);
  border:1px solid rgba(0,255,65,.56);
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));
  box-shadow:inset 0 0 18px rgba(0,255,65,.08),0 0 22px rgba(0,255,65,.1);
}
.side-brand b{
  display:block;
  color:#fff;
  font-size:16px;
  font-weight:700;
  letter-spacing:.06em;
}
.side-brand small{
  display:block;
  margin-top:4px;
  color:var(--color-primary);
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.side-live{
  margin:0 19px 15px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  color:#C9FFD6;
  background:rgba(0,255,65,.055);
  border:1px solid rgba(0,255,65,.28);
  font:600 11px var(--mono);
  letter-spacing:.06em;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--color-primary);
  box-shadow:0 0 10px var(--color-primary);
}
.side-nav{display:flex;flex-direction:column;gap:5px;padding:5px 11px;overflow:auto}
.side-nav button{
  min-height:46px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 13px;
  color:#B5C1CF;
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  text-align:left;
  font-size:14px;
  font-weight:600;
  transition:color .2s,background .2s,border-color .2s,transform .2s;
}
.side-nav button:hover{
  color:#fff;
  background:rgba(0,255,65,.055);
  border-color:rgba(0,255,65,.22);
  transform:translateX(2px);
}
.side-nav button.on{
  color:var(--color-primary);
  background:linear-gradient(90deg,rgba(0,255,65,.14),rgba(0,255,65,.025));
  border-color:rgba(0,255,65,.42);
  box-shadow:inset 3px 0 var(--color-primary),0 0 20px rgba(0,255,65,.05);
}
.side-nav .material-symbols-outlined{font-size:21px}
.side-foot{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 19px;
  border-top:1px solid var(--color-border);
  color:var(--color-muted-foreground);
  font-size:11px;
  line-height:1.45;
}
.side-ava,.av i,.avm{
  display:grid;
  place-items:center;
  flex:none;
  background:rgba(0,255,65,.12);
  border:1px solid rgba(0,255,65,.4);
  color:var(--color-primary);
  font-style:normal;
  font-weight:700;
}
.side-ava{width:34px;height:34px;border-radius:2px}
.main{flex:1;min-width:0}
.wrap{width:100%;max-width:1440px;margin:auto;padding:28px 32px 54px}
.view-h{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
}
.view-h h1{
  margin:0;
  color:#fff;
  font-size:clamp(23px,2.2vw,31px);
  font-weight:700;
  letter-spacing:.05em;
  text-shadow:0 0 20px rgba(0,255,65,.12);
}
.view-h h1::before{
  content:"SYS / ";
  color:var(--color-primary);
  font:600 10px "Cinzel",serif;
  letter-spacing:.16em;
  display:block;
  margin-bottom:7px;
}
.view-h p{margin:7px 0 0;color:var(--color-muted-foreground);font-size:13px;line-height:1.55}
.btn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 17px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid var(--color-primary);
  border-radius:2px;
  box-shadow:0 0 20px rgba(0,255,65,.2);
  font-size:13px;
  font-weight:700;
  transition:background .2s,box-shadow .2s,transform .2s;
}
.btn:hover{background:#56FF7E;box-shadow:0 0 28px rgba(0,255,65,.35);transform:translateY(-1px)}
.btn .material-symbols-outlined{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:19px}
.kpi,.card,.slip{
  position:relative;
  background:linear-gradient(145deg,rgba(24,36,36,.96),rgba(15,23,27,.98));
  border:1px solid var(--color-border);
  border-radius:4px;
  box-shadow:0 15px 35px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.025);
}
.kpi{padding:17px 18px;overflow:hidden}
.kpi::after{
  content:"";
  position:absolute;
  right:-18px;bottom:-30px;
  width:90px;height:90px;
  border:1px solid rgba(0,255,65,.11);
  border-radius:50%;
  box-shadow:0 0 0 12px rgba(0,255,65,.025);
}
.kpi .l{display:flex;align-items:center;gap:7px;color:#B8C5D4;font-size:12px;font-weight:600}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .v{
  margin-top:10px;
  color:#fff;
  font:700 29px "Cinzel",serif;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.kpi .v small{color:var(--color-muted-foreground);font:600 13px var(--mono)}
.kpi .d{margin-top:7px;color:#BDFCCB;font-size:11.5px;font-weight:600}
.grid{display:grid;gap:17px}.grid>*{min-width:0}
.g-17{grid-template-columns:1.7fr 1fr}.g-15{grid-template-columns:1.5fr 1fr}.g-11{grid-template-columns:1fr 1fr}
.card{padding:19px 20px;min-width:0}
.card>h3{
  margin:0 0 15px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  color:#F5F9FC;
  font-size:15px;
  font-weight:700;
  letter-spacing:.035em;
}
.card>h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.card>h3 .grow{margin-left:auto;color:#A4FFB9;font-size:11px;cursor:pointer}
.tag,.badge,.sev,.low-tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:2px;
  padding:3px 7px;
  font-size:10.5px;
  font-weight:700;
}
.t-wait,.sev-m{color:#FFE091;background:rgba(255,209,102,.1)}
.t-run{color:#8BFFAA;background:rgba(0,143,17,.18)}
.t-done,.sev-l{color:#8BFFAA;background:rgba(0,255,65,.08)}
.t-hold,.sev-h,.low-tag{color:#FF9494;background:rgba(255,51,51,.1)}
.slip{overflow:hidden}
.slip-h{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  padding:16px 19px;
  background:linear-gradient(100deg,#07100B,#10211A);
  border-bottom:1px solid rgba(0,255,65,.32);
}
.slip-h .plate{
  padding:7px 13px;
  color:#07100B;
  background:var(--color-primary);
  border:1px solid #97FFAE;
  border-radius:2px;
  font:700 20px var(--mono);
  letter-spacing:.1em;
}
.slip-h .meta{min-width:0;color:#AFC0CA;font:500 11px var(--mono)}
.slip-h .meta b{display:block;margin-bottom:3px;color:#fff;font-size:14px}
.slip-h .wo-no{margin-left:auto;text-align:right;color:#AFC0CA;font:500 11px var(--mono)}
.slip-h .wo-no b{display:block;color:var(--color-primary);font-size:14px}
.slip-sub{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--color-border)}
.slip-sub>div{padding:12px 16px;border-right:1px solid var(--color-border)}
.slip-sub>div:last-child{border-right:0}
.slip-sub .k{color:var(--color-muted-foreground);font-size:10.5px}
.slip-sub .val{margin-top:4px;color:#fff;font-size:13px;font-weight:700}
.scroll{overflow:auto}
.wtbl,.dtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.wtbl th,.dtbl th{
  padding:11px 13px;
  color:#B9C6D3;
  background:#10181C;
  border-bottom:1px solid rgba(0,255,65,.3);
  text-align:left;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
}
.wtbl td,.dtbl td{padding:12px 13px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.wtbl tbody tr:hover td,.dtbl tbody tr:hover td{background:rgba(0,255,65,.035)}
.wtbl .num,.dtbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wtbl tfoot td{color:#fff;background:#10181C;border-top:1px solid rgba(0,255,65,.3);font-weight:700}
.b-part{color:#83E6FF;background:rgba(0,167,220,.1)}
.b-labor{color:#8BFFAA;background:rgba(0,255,65,.07)}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:11px;overflow:auto}
.kb-col{min-width:0;padding:11px;background:#111A1D;border:1px solid var(--color-border);border-radius:3px}
.kb-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 11px;color:#F2F6F8;font-size:13px;font-weight:700}
.kb-h .c{
  min-width:23px;padding:2px 7px;text-align:center;
  color:var(--color-on-primary);background:var(--color-primary);
  border-radius:2px;font:700 11px var(--mono)
}
.jc{
  margin-bottom:8px;padding:11px 11px 10px;
  background:#182226;border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary);border-radius:2px;
  transition:border-color .2s,transform .2s,background .2s;
}
.jc:hover{transform:translateY(-1px);background:#1C292B}
.jc.wait{border-left-color:var(--warn)}.jc.done{border-left-color:#68FF8B}
.jc-top,.jc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.jc-top .plate{color:#fff;font:700 13px var(--mono);letter-spacing:.04em}
.jc p{margin:7px 0 9px;color:#CAD3DC;font-size:11.5px;line-height:1.5}
.jc p b{color:#fff}
.jc-foot{color:var(--color-muted-foreground);font-size:10.5px}
.av{display:inline-flex;align-items:center;gap:6px}.av i{width:22px;height:22px;border-radius:2px;font-size:9px}
.alert{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--color-border)}
.alert:first-of-type{border-top:0}
.alert-ic,.est-ic,.ai .ic{
  display:grid;place-items:center;flex:none;
  border:1px solid currentColor;border-radius:2px;
}
.alert-ic{width:36px;height:36px}
.a-red{color:#FF8585;background:rgba(255,51,51,.09)}
.a-amber{color:#FFE091;background:rgba(255,209,102,.08)}
.a-orange{color:#FFAD83;background:rgba(255,105,51,.08)}
.a-blue{color:#83E6FF;background:rgba(0,167,220,.08)}
.alert p{margin:0;color:#CCD5DD;font-size:12.5px;line-height:1.5}
.alert b{color:#fff}.alert small{display:block;margin-top:3px;color:#9BAABD;font:500 10.5px var(--mono)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.part,.pc{padding:13px;background:#111A1D;border:1px solid var(--color-border);border-radius:3px}
.part-t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.part-t b,.pc b{color:#F1F5F8;font-size:13px}
.sku{color:#AAB7C6;font:500 10.5px var(--mono);letter-spacing:.04em}
.pbar{height:7px;margin:10px 0 8px;overflow:hidden;background:#283237;border:1px solid #354148;border-radius:1px}
.pbar span{display:block;height:100%;background:var(--color-primary);box-shadow:0 0 8px currentColor}
.part small,.role,.util{color:var(--color-muted-foreground);font-size:11px}
.est-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--color-border)}
.est-row:first-of-type{border-top:0}
.est-ic{width:38px;height:38px;color:var(--color-primary);background:rgba(0,255,65,.055)}
.est-row .mid{flex:1;min-width:0}.est-row .mid b{color:#F2F6F8;font-size:13px}
.est-row .mid small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:11px;line-height:1.45}
.chart-box{position:relative;height:270px}.chart-box.sm{height:230px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:11px}
.pc .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.avm{width:38px;height:38px;border-radius:2px}
.summary{display:flex;flex-direction:column}
.sum-r{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px dashed #3B464C;font-size:12.5px}
.sum-r.total{margin-top:4px;padding-top:13px;border-top:1px solid rgba(0,255,65,.45);border-bottom:0;color:#fff;font-size:15px;font-weight:700}
.money{color:#F5F8FA;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.sum-r.total .money{color:var(--color-primary);font-size:21px;text-shadow:0 0 14px rgba(0,255,65,.2)}
.pay{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.pay button{
  flex:1;min-width:110px;min-height:43px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  color:#C6D0D8;background:#111A1D;border:1px solid var(--color-border);border-radius:2px;
  font-size:12px;font-weight:700;transition:.2s;
}
.pay button:hover,.pay button.on{color:var(--color-primary);border-color:var(--color-primary);background:rgba(0,255,65,.07)}
.ai{
  display:flex;gap:12px;margin-bottom:16px;padding:14px;
  background:linear-gradient(100deg,rgba(0,255,65,.08),rgba(0,143,17,.025));
  border:1px solid rgba(0,255,65,.34);border-radius:3px;
}
.ai .ic{width:39px;height:39px;color:var(--color-on-primary);background:var(--color-primary)}
.ai b{color:#F5F8FA;font-size:13px}.ai p{margin:4px 0 0;color:#C1CCD5;font-size:12px;line-height:1.6}
.reveal{animation:reveal .36s ease-out both}
.scan::after{
  content:"";
  position:fixed;z-index:100;pointer-events:none;
  inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,65,.35),transparent);
  animation:scan 7s linear infinite;
}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes scan{from{transform:translateY(-2vh)}to{transform:translateY(102vh)}}
@media(max-width:1120px){.kpis{grid-template-columns:repeat(2,1fr)}.g-17,.g-15,.g-11{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;border-right:0;border-bottom:1px solid var(--color-border)}
  .side-brand{padding:11px 15px 8px}.side-logo{width:39px;height:39px}.side-live,.side-foot{display:none}
  .side-nav{flex-direction:row;padding:0 10px 9px;overflow-x:auto}
  .side-nav button{flex:none;min-height:42px;padding:9px 12px}
  .wrap{padding:21px 16px 40px}
}
@media(max-width:600px){
  .view-h{align-items:stretch;flex-direction:column}.btn{width:100%}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:14px}.kpi .v{font-size:23px}
  .card{padding:16px 13px}.slip-sub{grid-template-columns:1fr 1fr}
  .slip-sub>div:nth-child(2){border-right:0}.slip-sub>div{border-bottom:1px solid var(--color-border)}
  .side-nav button span:not(.material-symbols-outlined){display:none}
  .side-nav button{min-width:44px;justify-content:center}
}
@media(max-width:390px){.kpis{grid-template-columns:1fr}.parts,.people{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .scan::after{display:none}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body class="scan">
<div class="shell">
  <aside class="side">
    <div class="side-brand">
      <span class="side-logo"><span class="material-symbols-outlined">car_repair</span></span>
      <div><b>汽修保養請款艙</b><small>Auto Repair Billing</small></div>
    </div>
    <span class="side-live"><span class="dot" aria-hidden="true"></span><span>營運快照 · 今日在廠 14 台</span></span>
    <nav class="side-nav" id="nav" aria-label="系統功能"></nav>
    <div class="side-foot">
      <span class="side-ava">顧</span>
      <div><b style="color:#fff;display:block">王建宏 · 服務顧問</b>宏昌汽車保養廠 · 中和廠</div>
    </div>
  </aside>
  <div class="main"><div class="wrap"><main id="view"></main></div></div>
</div>
<script>
const MODS=[
 ["dashboard","維修總覽","在廠車輛、進度看板與今日營運快照"],
 ["receipt_long","進廠維修單","車輛進廠開單、維修項目與工時零件明細"],
 ["search_check","檢查估價","車況檢查判定與工時零件估價確認"],

 if(i===2)mk("cRadar",{type:"radar",data:{labels:["煞車系統","引擎油液","變速箱","冷氣系統","輪胎","電系"],datasets:[{label:"目前車況",data:[45,50,60,65,85,88],backgroundColor:"rgba(0,255,65,.13)",borderColor:GREEN,pointBackgroundColor:GREEN,borderWidth:2},{label:"標準基準",data:[90,90,90,90,90,90],backgroundColor:"transparent",borderColor:GRAY,borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350},plugins:{legend:{position:"bottom",labels:{color:"#C5D0D9",usePointStyle:true}}},scales:{r:{min:0,max:100,grid:{color:GRID},angleLines:{color:GRID},pointLabels:{color:"#DCE5EB",font:{size:11}},ticks:{display:false}}}}});
 if(i===4)mk("cLabor",{type:"bar",data:{labels:TECHS.map(t=>t.name),datasets:[{label:"實際工時",data:[7.4,7,6.5,5.1],backgroundColor:GREEN,borderRadius:2},{label:"標準工時",data:[8,8,8,8],backgroundColor:"#50605F",borderRadius:2}]},options:commonOptions()});
 if(i===5)mk("cTrend",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"營收（萬）",data:[86,92,88,101,96,102],fill:true,tension:.32,borderColor:GREEN,backgroundColor:"rgba(0,255,65,.1)",pointBackgroundColor:GREEN,borderWidth:2},{label:"目標",data:[95,95,95,95,95,95],borderColor:GRAY,borderDash:[6,4],pointRadius:0,borderWidth:1.5}]},options:commonOptions()});
}
const view=document.getElementById("view"),nav=document.getElementById("nav");
nav.innerHTML=MODS.map((m,i)=>`<button type="button" data-i="${i}" class="${i===0?"on":""}" aria-current="${i===0?"page":"false"}">${icon(m[0])}<span>${m[1]}</span></button>`).join("");
function show(i){
 nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 const acts=[
  ["add","新增進廠維修單"],["print","列印維修單"],["send","傳送估價給客戶"],
  ["add_shopping_cart","一鍵叫料"],null,["receipt_long","開立請款單"]
 ],a=acts[i];
 view.innerHTML=`<header class="view-h"><div><h1>${MODS[i][1]}</h1><p>${MODS[i][2]}</p></div>${a?`<button type="button" class="btn">${icon(a[0])}${a[1]}</button>`:""}</header><div class="reveal">${SCREENS["s"+i]()}</div>`;
 draw(i);
}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;if(location.hash!==`#v${i}`)location.hash=`v${i}`;else show(i)});
window.addEventListener("resize",()=>charts.forEach(c=>{try{c.resize()}catch(e){}}));
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),i=m?Math.min(+m[1],MODS.length-1):0;
 show(i);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
