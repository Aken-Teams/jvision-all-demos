:root{--ink:#1c1410;--body:#44403c;--mut:#78716c;--line:#eae4dd;--accent:#ea580c;--accent2:#fb923c;--soft:#fff7ed;--bg:#f6f2ee;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}

.shell{display:flex;min-height:100vh}
/* sidebar */

.side-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 18px}
.side-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(234,88,12,.45);flex:none}

.side-ava{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#231710;font-weight:900;display:grid;place-items:center;flex:none}

.wrap{max-width:1320px;width:100%;margin:0 auto;padding:24px 30px 48px}
.view-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.view-h h1{margin:0;font-size:23px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
.view-h p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(234,88,12,.3)}
.btn .material-symbols-outlined{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;border-left:4px solid var(--accent);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(234,88,12,.1),transparent 70%)}

.g-17{grid-template-columns:1.7fr 1fr}
.g-15{grid-template-columns:1.5fr 1fr}

.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px 20px;min-width:0}

.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-wait{background:#fef3c7;color:#b45309}.t-run{background:#ffedd5;color:#c2410c}.t-done{background:#dcfce7;color:#15803d}.t-hold{background:#fee2e2;color:#b91c1c}

.slip-h{background:linear-gradient(120deg,#231710,#3b2418);color:#fed7aa;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.slip-sub div{padding:11px 16px;border-right:1px solid var(--line)}

.slip-sub .k{font-size:11px;color:var(--mut);font-weight:700}

.wtbl{width:100%;border-collapse:collapse;font-size:13px}

.b-part{background:#e0f2fe;color:#0369a1}.b-labor{background:#ffedd5;color:#c2410c}

.jc p{margin:6px 0 8px;font-size:12px;color:var(--body);line-height:1.4}
.jc p b{color:var(--ink)}
.jc-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mut)}
.av{display:inline-flex;align-items:center;gap:5px}

.alert{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.alert:first-child{border-top:0}
.alert-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.a-red{background:#fee2e2;color:#dc2626}.a-amber{background:#fef3c7;color:#d97706}.a-orange{background:#ffedd5;color:#c2410c}.a-blue{background:#e0f2fe;color:#0369a1}

.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.part{background:#faf6f1;border:1px solid var(--line);border-radius:13px;padding:14px}

.low-tag{font-size:10px;font-weight:800;color:#dc2626;background:#fee2e2;border-radius:6px;padding:2px 7px;white-space:nowrap}

.dtbl{width:100%;border-collapse:collapse;font-size:13px}

.est-ic{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}

.sev{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;white-space:nowrap}
.sev-h{background:#fee2e2;color:#b91c1c}.sev-m{background:#fef3c7;color:#b45309}.sev-l{background:#dcfce7;color:#15803d}
.chart-box{position:relative;height:270px}
.chart-box.sm{height:230px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:13px;padding:13px;background:#faf6f1;min-width:0}
.pc .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}

.pay{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
.pay button{flex:1;min-width:110px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font:inherit;font-weight:700;font-size:12.5px;color:var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pay button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.ai{border:1px dashed var(--accent2);background:linear-gradient(135deg,#fff7ed,#fffbf5);border-radius:14px;padding:14px;display:flex;gap:12px;margin-bottom:16px}
.ai .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none}

.ai p{margin:3px 0 0;font-size:12.5px;color:#57534e;line-height:1.6}
@media(max-width:1080px){.g-17,.g-15,.g-11{grid-template-columns:1fr}}
@media(max-width:860px){

  .side-foot{display:none}
  .wrap{padding:18px 16px 34px}
}
@media(max-width:560px){.side-nav button span:not(.material-symbols-outlined){display:none}.side-nav button{padding:11px}}
</style>

let charts=[];

const OR="#ea580c",OR2="#fb923c",GR="#94a3b8";

      {label:"營收（萬）",data:[86,92,88,101,96,102],fill:true,tension:.35,borderColor:OR,backgroundColor:"rgba(234,88,12,.12)",pointBackgroundColor:OR,borderWidth:3},
      {label:"目標",data:[95,95,95,95,95,95],borderColor:GR,borderDash:[6,4],pointRadius:0,borderWidth:1.5}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{grid:{color:"#f1eae3"}},x:{grid:{display:false}}}}});
