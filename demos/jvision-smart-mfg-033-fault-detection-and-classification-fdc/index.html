<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>故障偵測與分類系統 FDC</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0d9488; --accent2:#2dd4bf; --ink:#0f2b28; --muted:#5b7a76;
  --bg:#f1f6f5; --card:#ffffff; --line:#dbe8e6; --soft:#eef6f5;
  --red:#e11d48; --amber:#f59e0b; --green:#16a34a; --blue:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
/* NAV */
.topbar{
  background:linear-gradient(100deg,#0b7a70,#0d9488);
  color:#fff; padding:0 20px; position:sticky; top:0; z-index:50;
  box-shadow:0 2px 14px rgba(13,148,136,.28);
}
.brand{display:flex;align-items:center;gap:12px;padding:12px 0 8px;}
.brand .logo{
  width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand .logo .material-symbols-outlined{font-size:24px;color:#c9fff5;}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;}
.brand .sub{font-size:11.5px;opacity:.82;font-weight:500;margin-top:2px;}
.brand .spacer{flex:1;min-width:0;}
.brand .pill{
  background:rgba(255,255,255,.16);border-radius:20px;padding:5px 13px;
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex:none;
}
.brand .pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.28);}
nav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;}
nav button{
  flex:none;white-space:nowrap;border:0;cursor:pointer;
  background:rgba(255,255,255,.12); color:#eafffb;
  padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;
  font-family:inherit;display:flex;align-items:center;gap:7px;transition:.15s;min-width:0;
}
nav button .material-symbols-outlined{font-size:19px;}
nav button:hover{background:rgba(255,255,255,.22);}
nav button.on{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.18);}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
.scr-head{margin:0 0 18px;}
.scr-head .t{font-size:21px;font-weight:800;margin:0;display:flex;align-items:center;gap:9px;}
.scr-head .t .material-symbols-outlined{color:var(--accent);font-size:26px;}
.scr-head .d{color:var(--muted);font-size:13.5px;margin-top:5px;}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .val{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .sub{font-size:11.5px;margin-top:5px;font-weight:600;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);}
.up{color:var(--green);} .down{color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px;}
td{padding:9px 10px;border-bottom:1px solid var(--soft);white-space:nowrap;}
tr:last-child td{border-bottom:0;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.b-red{background:#fee2e2;color:#b91c1c;} .b-amb{background:#fef3c7;color:#b45309;}
.b-grn{background:#dcfce7;color:#15803d;} .b-blu{background:#dbeafe;color:#1d4ed8;}
.b-gry{background:#e7edec;color:#546a67;} .b-tel{background:#ccfbf1;color:#0f766e;}
.chart-box{position:relative;height:260px;min-width:0;}
.chart-sm{position:relative;height:200px;min-width:0;}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter";font-feature-settings:"tnum";}
.scroller{overflow-x:auto;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:6px;}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;}
.hr{height:1px;background:var(--line);margin:14px 0;}
/* sensor gauges */
.sensor{display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#fff,#f7fcfb);min-width:0;}
.sensor .top{display:flex;justify-content:space-between;align-items:center;}
.sensor .nm{font-size:13px;font-weight:700;}
.sensor .rd{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.sensor .rd small{font-size:12px;color:var(--muted);font-weight:600;}
.track{height:7px;border-radius:6px;background:#e7edec;position:relative;overflow:hidden;}
.track i{position:absolute;top:0;bottom:0;left:0;border-radius:6px;display:block;}
.sensor .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}
/* classification cards */
.fcard{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--card);min-width:0;display:flex;flex-direction:column;gap:10px;}
.fcard .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.fcard .ic .material-symbols-outlined{font-size:22px;}
.fcard .conf{height:8px;border-radius:6px;background:#e7edec;overflow:hidden;}
.fcard .conf i{display:block;height:100%;border-radius:6px;}
/* verify steps */
.vstep{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft);align-items:flex-start;}
.vstep:last-child{border-bottom:0;}
.vstep .no{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.vstep.done .no{background:var(--accent);color:#fff;}
.vstep .ct{flex:1;min-width:0;}
.vstep .ct .h{font-size:13.5px;font-weight:700;}
.vstep .ct .p{font-size:12px;color:var(--muted);margin-top:3px;}
/* matrix */
.matrix{border-collapse:separate;border-spacing:4px;}
.matrix td.cell{width:56px;height:44px;text-align:center;border-radius:8px;font-weight:800;font-size:14px;}
.matrix th{text-transform:none;font-size:11.5px;}
.tag{font-size:11px;font-weight:700;color:var(--muted);}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  nav button span.txt{display:none;}
  nav button{padding:9px 11px;}
  .brand h1{font-size:14px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">radar</span></div>
    <div style="min-width:0">
      <h1>故障偵測與分類系統 FDC</h1>
      <div class="sub">Fault Detection &amp; Classification · 多變量感測異常監控平台</div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot"></span>即時連線 · 48 台設備</div>
  </div>
  <nav id="nav"></nav>
</header>
<main>
  <div id="app"></div>
</main>
<script>
(function(){
"use strict";
var C = {accent:"#0d9488",accent2:"#2dd4bf",red:"#e11d48",amber:"#f59e0b",green:"#16a34a",blue:"#2563eb",muted:"#5b7a76",line:"#dbe8e6"};
var MODS = [
  {icon:"sensors",name:"感測監控"},
  {icon:"warning",name:"異常偵測"},
  {icon:"category",name:"故障分類"},
  {icon:"notifications_active",name:"告警派工"},
  {icon:"build_circle",name:"對策驗證"},
  {icon:"insights",name:"模型績效"}
];
var charts = {};
function destroyAll(){ for(var k in charts){ if(charts[k]){ try{charts[k].destroy();}catch(e){} charts[k]=null; } } charts={}; }
function el(id){ return document.getElementById(id); }

// ---------- NAV ----------
var nav = el("nav");
MODS.forEach(function(m,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span>';
  b.addEventListener("click",function(){ show(i); try{window.scrollTo(0,0);}catch(e){} });
  nav.appendChild(b);
});
function setActive(i){
  var bs=nav.querySelectorAll("button");
  for(var k=0;k<bs.length;k++){ bs[k].className = (+bs[k].getAttribute("data-i")===i)?"on":""; }
}

function head(icon,t,d){
  return '<div class="scr-head"><div class="t"><span class="material-symbols-outlined">'+icon+'</span>'+t+'</div><div class="d">'+d+'</div></div>';
}
function kpiRow(kpis){
  return '<div class="grid g4">'+kpis.map(function(k){
    return '<div class="kpi"><div class="bar" style="background:'+k.bar+'"></div><div class="lab">'+k.l+'</div><div class="val mono">'+k.v+(k.u?'<small>'+k.u+'</small>':'')+'</div><div class="sub '+k.c+'">'+k.s+'</div></div>';
  }).join('')+'</div>';
}

// =========================================================
// SCREEN 0 — 感測監控
// =========================================================
function s0(){
  var kpis=[
    {l:"線上感測通道",v:"1,284",u:"路",s:"48 台設備即時採集",c:"up",bar:C.accent},
    {l:"採樣頻率",v:"200",u:"ms",s:"平均端到端延遲 34ms",c:"up",bar:C.accent2},
    {l:"偏移中通道",v:"27",u:"路",s:"接近管制上限 UCL",c:"down",bar:C.amber},
    {l:"數據完整率",v:"99.6",u:"%",s:"較昨日 +0.3%",c:"up",bar:C.green}
  ];
  var sensors=[
    {nm:"腔體溫度 CH-A",v:"318.4",u:"°C",p:72,c:C.green,lo:"280",hi:"340"},
    {nm:"RF 功率",v:"1,842",u:"W",p:58,c:C.green,lo:"1500",hi:"2100"},
    {nm:"腔體壓力",v:"8.9",u:"mTorr",p:91,c:C.red,lo:"5",hi:"9"},
    {nm:"氣體流量 Ar",v:"142",u:"sccm",p:64,c:C.green,lo:"100",hi:"180"},
    {nm:"馬達電流",v:"6.4",u:"A",p:83,c:C.amber,lo:"3",hi:"7"},
    {nm:"冷卻水溫",v:"22.1",u:"°C",p:41,c:C.green,lo:"15",hi:"30"}
  ];
  var rows=[
    ["EQ-CVD-02","腔體壓力","8.9 mTorr","UCL 9.0",'<span class="badge b-amb">接近上限</span>',"14:32:08"],
    ["EQ-ETCH-05","馬達電流","6.4 A","UCL 7.0",'<span class="badge b-amb">接近上限</span>',"14:31:55"],
    ["EQ-CMP-01","研磨壓力","正常","—",'<span class="badge b-grn">正常</span>',"14:31:40"],
    ["EQ-PVD-03","靶材電壓","正常","—",'<span class="badge b-grn">正常</span>',"14:31:22"],
    ["EQ-CVD-02","腔體溫度","318.4 °C","UCL 340",'<span class="badge b-grn">正常</span>',"14:31:05"],
    ["EQ-DIFF-04","爐管溫度","偏移","LCL 950",'<span class="badge b-red">偏移</span>',"14:30:48"]
  ];
  var h=head("sensors","多變量感測數據監控","即時採集 48 台製程設備的溫度、壓力、電流等多變量感測訊號，比對管制界限並標示偏移通道。");
  h+=kpiRow(kpis);
  h+='<div class="grid g23" style="margin-top:14px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>EQ-CVD-02 · 腔體壓力即時趨勢（近 40 採樣）</h3><div class="chart-box"><canvas id="c0a"></canvas></div><div class="legend"><span><i class="dotc" style="background:'+C.accent+'"></i>量測值</span><span><i class="dotc" style="background:'+C.red+'"></i>UCL 上限</span><span><i class="dotc" style="background:'+C.blue+'"></i>目標中心</span></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">speed</span>關鍵通道即時讀值</h3><div class="grid" style="grid-template-columns:1fr;gap:10px">'+sensors.map(function(s){
    return '<div class="sensor"><div class="top"><span class="nm">'+s.nm+'</span><span class="rd mono">'+s.v+' <small>'+s.u+'</small></span></div><div class="track"><i style="width:'+s.p+'%;background:'+s.c+'"></i></div><div class="meta"><span>LCL '+s.lo+'</span><span>UCL '+s.hi+'</span></div></div>';
  }).join('')+'</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">table_rows</span>感測通道監控清單</h3><div class="scroller"><table><thead><tr><th>設備</th><th>感測參數</th><th>當前值</th><th>管制界限</th><th>狀態</th><th>更新時間</th></tr></thead><tbody>'+rows.map(function(r){
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="mono">'+r[3]+'</td><td>'+r[4]+'</td><td class="mono">'+r[5]+'</td></tr>';
  }).join('')+'</tbody></table></div></div>';
  render(h);
  afterRender();
  var labels=[]; for(var i=1;i<=40;i++) labels.push(i);
  var vals=[7.8,7.9,8.0,7.9,8.1,8.0,8.2,8.1,8.3,8.2,8.1,8.3,8.4,8.3,8.5,8.4,8.3,8.5,8.6,8.5,8.4,8.6,8.7,8.6,8.5,8.7,8.8,8.7,8.6,8.8,8.9,8.8,8.7,8.9,8.8,8.9,8.9,8.8,8.9,8.9];
  charts.c0a=new Chart(el("c0a"),{type:"line",data:{labels:labels,datasets:[
    {label:"量測值",data:vals,borderColor:C.accent,backgroundColor:"rgba(13,148,136,.12)",fill:true,tension:.35,pointRadius:0,borderWidth:2},
    {label:"UCL",data:labels.map(function(){return 9.0;}),borderColor:C.red,borderDash:[6,4],pointRadius:0,borderWidth:1.5,fill:false},
    {label:"中心",data:labels.map(function(){return 7.0;}),borderColor:C.blue,borderDash:[3,3],pointRadius:0,borderWidth:1.5,fill:false}
  ]},options:baseOpt({yMin:6,yMax:9.5})});
}

// =========================================================
// SCREEN 1 — 異常偵測 (SPC control chart)
// =========================================================
function s1(){
  var kpis=[
    {l:"今日異常事件",v:"18",u:"件",s:"3 件觸發 Nelson 規則",c:"down",bar:C.red},
    {l:"OOC 越界點",v:"6",u:"點",s:"超出 3σ 管制界限",c:"down",bar:C.amber},
    {l:"趨勢告警",v:"9",u:"次",s:"連續 7 點單側偏移",c:"down",bar:C.amber},
    {l:"平均偵測延遲",v:"1.8",u:"秒",s:"自越界至觸發",c:"up",bar:C.green}
  ];
  var rules=[
    ["規則 1","單點超出 3σ",4,"b-red"],
    ["規則 2","連續 9 點同側",3,"b-amb"],
    ["規則 3","連續 6 點遞增/減",2,"b-amb"],
    ["規則 5","3 點中 2 點超 2σ",5,"b-amb"],
    ["規則 8","連續 8 點皆離心",1,"b-gry"]
  ];
  var events=[
    ["EV-2418","EQ-ETCH-05","規則 1 · 單點越界","RF 反射功率突升",'<span class="badge b-red">高</span>',"14:28"],
    ["EV-2417","EQ-CVD-02","規則 2 · 同側偏移","壓力持續上升",'<span class="badge b-amb">中</span>',"14:19"],
    ["EV-2416","EQ-DIFF-04","規則 1 · 單點越界","爐溫低於 LCL",'<span class="badge b-red">高</span>',"14:02"],
    ["EV-2415","EQ-CMP-01","規則 3 · 遞增趨勢","研磨壓力遞增",'<span class="badge b-amb">中</span>',"13:47"],
    ["EV-2414","EQ-PVD-03","規則 5 · 2σ 警示","靶材電壓抖動",'<span class="badge b-gry">低</span>',"13:31"]
  ];
  var h=head("warning","異常事件偵測（SPC）","以 X-bar 管制圖與 Nelson/WECO 規則即時偵測製程越界與異常趨勢，將偏離自動轉為待分類事件。");
  h+=kpiRow(kpis);
  h+='<div class="grid g23" style="margin-top:14px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>X-bar 管制圖 · EQ-ETCH-05 RF 反射功率</h3><div class="chart-box"><canvas id="c1a"></canvas></div><div class="legend"><span><i class="dotc" style="background:'+C.accent+'"></i>樣本均值</span><span><i class="dotc" style="background:'+C.red+'"></i>UCL / LCL (3σ)</span><span><i class="dotc" style="background:'+C.blue+'"></i>CL 中心線</span></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">rule</span>觸發規則統計（今日）</h3><table><tbody>'+rules.map(function(r){
    return '<tr><td style="font-weight:700">'+r[0]+'</td><td style="color:var(--muted);font-size:12px">'+r[1]+'</td><td style="text-align:right"><span class="badge '+r[3]+'">'+r[2]+' 次</span></td></tr>';
  }).join('')+'</tbody></table><div class="hr"></div><div class="chart-sm"><canvas id="c1b"></canvas></div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">list_alt</span>待分類異常事件</h3><div class="scroller"><table><thead><tr><th>事件編號</th><th>設備</th><th>觸發規則</th><th>描述</th><th>嚴重度</th><th>時間</th></tr></thead><tbody>'+events.map(function(r){
    return '<tr><td class="mono" style="font-weight:700">'+r[0]+'</td><td class="mono">'+r[1]+'</td><td>'+r[2]+'</td><td style="color:var(--muted)">'+r[3]+'</td><td>'+r[4]+'</td><td class="mono">'+r[5]+'</td></tr>';
  }).join('')+'</tbody></table></div></div>';
  render(h);
  afterRender();
  var lb=[]; for(var i=1;i<=24;i++) lb.push("#"+i);
  var d=[50,51,49,52,50,53,51,54,52,55,53,56,54,58,55,62,57,61,59,66,60,63,58,55];
  charts.c1a=new Chart(el("c1a"),{type:"line",data:{labels:lb,datasets:[
    {label:"樣本均值",data:d,borderColor:C.accent,backgroundColor:"rgba(45,212,191,.12)",fill:true,tension:.3,borderWidth:2,
      pointRadius:d.map(function(v){return v>60?5:2;}),
      pointBackgroundColor:d.map(function(v){return v>60?C.red:C.accent;})},
    {label:"UCL",data:lb.map(function(){return 60;}),borderColor:C.red,borderDash:[6,4],pointRadius:0,borderWidth:1.5,fill:false},

// ---------- shared chart options ----------
function baseOpt(o){
  o=o||{};
  var opt={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:!o.noLegend,position:"bottom",labels:{font:{family:"Inter",size:12},boxWidth:12,padding:10}}},
    scales:{

      y:{grid:{color:"rgba(0,0,0,.05)"},ticks:{font:{family:"Inter",size:11},color:C.muted}}
    }};
  if(o.yMin!==undefined) opt.scales.y.min=o.yMin;
  if(o.yMax!==undefined) opt.scales.y.max=o.yMax;
  return opt;
}

function afterRender(){ void appEl.offsetHeight; }
function show(i){

  destroyAll();
  setActive(i);
  SCREENS[i]();
}
