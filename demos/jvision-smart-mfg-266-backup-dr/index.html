<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>備份與災難復原系統（Backup & DR）｜Jvision 系統 Demo</title>
  <meta name="description" content="排程備份、完整性檢核、異地複製到 DR 演練與 RTO/RPO 治理的單一操作平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#e11d48; --accent2:#fb7185; --ink:#1f2937; --muted:#64748b;
      --line:#e9edf3; --bg:#f5f6f9; --card:#ffffff; --soft:#fff1f3;
      --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,-apple-system,sans-serif;
      background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
    .app{display:flex;min-height:100vh;flex-direction:column;}
    .topbar{
      display:flex;align-items:center;gap:14px;padding:12px 22px;
      background:linear-gradient(100deg,#9f1239,#e11d48 55%,#fb7185);
      color:#fff;position:sticky;top:0;z-index:30;flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
    .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand span{display:block;font-size:11px;opacity:.85;font-weight:500;}
    .topbar .spacer{flex:1 1 auto;}
    .badge-live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;}
    .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.28);}
    nav.nav{
      display:flex;gap:7px;padding:11px 18px;background:var(--card);
      border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:20;
      flex-wrap:wrap;
    }
    .nav button{
      display:flex;align-items:center;gap:8px;border:1px solid var(--line);
      background:#fff;color:var(--muted);padding:8px 14px;border-radius:10px;
      font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:0;
      transition:all .15s;
    }
    .nav button .msi{font-size:19px;}
    .nav button .idx{font-size:11px;font-weight:800;background:var(--bg);border-radius:6px;padding:1px 7px;color:var(--muted);}
    .nav button:hover{border-color:var(--accent2);color:var(--accent);}
    .nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(225,29,72,.28);}
    .nav button.active .idx{background:rgba(255,255,255,.22);color:#fff;}
    main{padding:20px 22px 40px;max-width:1360px;margin:0 auto;width:100%;}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
    .screen-head .ico{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;}
    .screen-head h2{margin:0;font-size:20px;font-weight:800;}
    .screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px;}
    .screen-head .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:6px 13px;border-radius:20px;align-self:center;}

    /* split workspace signature */
    .split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
    .pane{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;}
    .pane-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;}
    .pane-h .msi{font-size:20px;color:var(--accent);}
    .pane-h .count{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:14px;padding:2px 10px;}
    .pane-b{padding:14px 16px;}

    .list-item{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;transition:background .12s;min-width:0;}
    .list-item:last-child{border-bottom:none;}
    .list-item:hover{background:#fafbfd;}
    .list-item.sel{background:var(--soft);border-left:3px solid var(--accent);padding-left:11px;}
    .li-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;background:var(--bg);color:var(--muted);}
    .li-main{min-width:0;flex:1;}
    .li-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .li-sub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px;}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0;position:relative;overflow:hidden;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .kpi .lab .msi{font-size:17px;color:var(--accent2);}
    .kpi .val{font-size:25px;font-weight:900;margin-top:6px;letter-spacing:-.5px;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);}
    .kpi .delta{font-size:11.5px;font-weight:700;margin-top:3px;}
    .up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .msi{font-size:19px;color:var(--accent);}
    .chart-wrap{position:relative;width:100%;overflow:hidden;}

    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
    th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fbfcfe;}
    tbody tr:hover{background:#fafbfd;}
    td.num{font-variant-numeric:tabular-nums;font-weight:700;}

    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
    .p-ok{background:#eafaf0;color:var(--ok);}
    .p-warn{background:#fef6e7;color:#b45309;}
    .p-bad{background:#fdecec;color:var(--bad);}
    .p-info{background:#eaf1fe;color:var(--info);}
    .p-mut{background:var(--bg);color:var(--muted);}

    .bar-track{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;min-width:80px;}
    .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));}

    .tier{display:flex;flex-direction:column;gap:11px;}
    .tier-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;min-width:0;}
    .tier-badge{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;flex:0 0 auto;}
    .tier-info{min-width:0;flex:1;}
    .tier-info .t{font-weight:800;font-size:14px;}
    .tier-info .d{font-size:12px;color:var(--muted);margin-top:2px;}
    .tier-metrics{display:flex;gap:16px;flex:0 0 auto;flex-wrap:wrap;}
    .tier-metrics div{text-align:right;}
    .tier-metrics .m{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;}
    .tier-metrics .l{font-size:10.5px;color:var(--muted);font-weight:600;}

    .timeline{position:relative;padding-left:26px;}
    .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 16px 0;}
    .tl-item:last-child{padding-bottom:0;}
    .tl-dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);background:var(--muted);}
    .tl-dot.ok{background:var(--ok);box-shadow:0 0 0 2px #bbf7d0;}
    .tl-dot.run{background:var(--accent);box-shadow:0 0 0 2px var(--accent2);}
    .tl-dot.wait{background:#cbd5e1;}
    .tl-t{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .tl-time{font-size:11px;color:var(--muted);font-weight:600;}
    .tl-d{font-size:12px;color:var(--muted);margin-top:3px;}

    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
    .col{background:#fbfcfe;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
    .col-h{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 3px;}
    .col-h .n{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:11px;color:var(--muted);}
    .task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;min-width:0;}
    .task:last-child{margin-bottom:0;}
    .task .tt{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .task .ts{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;}

    .repl-node{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:11px;min-width:0;}
    .repl-node:last-child{margin-bottom:0;}
    .repl-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
    .repl-main{min-width:0;flex:1;}
    .repl-main .rt{font-weight:800;font-size:13.5px;}
    .repl-main .rs{font-size:11.5px;color:var(--muted);margin-top:2px;}
    .repl-lag{text-align:right;flex:0 0 auto;}
    .repl-lag .v{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;}
    .repl-lag .l{font-size:10.5px;color:var(--muted);}

    .miniflow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;}
    .mf{flex:1 1 130px;background:#fbfcfe;border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0;}
    .mf .n{font-size:11px;color:var(--muted);font-weight:700;}
    .mf .v{font-weight:800;font-size:13.5px;margin-top:4px;}

    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;}
    .legend span{display:inline-flex;align-items:center;gap:6px;}
    .lg-dot{width:10px;height:10px;border-radius:3px;}

    .footer{color:var(--muted);font-size:11.5px;text-align:center;padding:22px 12px 8px;}

    @media(max-width:820px){
      .split{grid-template-columns:1fr;}
      .kpis{grid-template-columns:1fr 1fr;}
      .grid2{grid-template-columns:1fr;}
      .grid3{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr 1fr;}
    }
    @media(max-width:560px){
      main{padding:16px 13px 34px;}
      .topbar{padding:11px 14px;}
      nav.nav{padding:10px 12px;}
      .nav button .btxt{display:none;}
      .nav button{padding:8px 11px;}
      .kpis{grid-template-columns:1fr 1fr;}
      .board{grid-template-columns:1fr;}
      .screen-head .tag{display:none;}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><span class="msi">shield</span></div>
        <div>
          <h1>備份與災難復原系統 · Backup &amp; DR</h1>
          <span>排程備份 · 完整性檢核 · 異地複製 · DR 演練 · RTO/RPO 治理</span>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="badge-live"><span class="dot"></span>所有備援站點正常</div>
    </header>
    <nav class="nav" id="nav"></nav>
    <main><div id="screen"></div>
      <div class="footer">Jvision 系統 Demo · 純前端展示（模擬資料，無後端）· 資訊部 / 資訊安全部 / 稽核室</div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var C={accent:"#e11d48",accent2:"#fb7185",ok:"#16a34a",warn:"#f59e0b",bad:"#dc2626",info:"#2563eb",grid:"#eef1f6",mut:"#94a3b8"};
    var charts=[];
    function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function mk(id,cfg){var el=document.getElementById(id);if(!el)return;var ch=new Chart(el.getContext("2d"),cfg);charts.push(ch);return ch;}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

    var MODS=[
      {icon:"shield",name:"備援策略",sub:"保護分級與 RTO/RPO 目標"},
      {icon:"calendar_month",name:"排程備份",sub:"全量／增量排程與版本保留"},
      {icon:"fact_check",name:"完整性檢核",sub:"校驗與可還原性驗證"},
      {icon:"account_tree",name:"異地複製",sub:"異地／雲端備援複製監控"},
      {icon:"history",name:"災難復原",sub:"DR 演練與一鍵復原"},
      {icon:"monitoring",name:"RTO/RPO 治理",sub:"達成率追蹤與稽核報表"}
    ];

    function head(i,tag){
      var m=MODS[i];
      return '<div class="screen-head"><div class="ico"><span class="msi">'+m.icon+'</span></div>'+
        '<div><h2>'+esc(m.name)+'</h2><p>'+esc(m.sub)+'</p></div>'+
        '<div class="tag">'+tag+'</div></div>';
    }

    /* ============ SCREEN 0 : 備援策略 ============ */
    var TIERS=[
      {sys:"核心 ERP / 訂單資料庫",tier:"Tier 0",color:"#e11d48",rto:"15 分",rpo:"5 分",freq:"連續複寫 + 每時增量",retain:"90 天 / 12 月",crit:"最高"},
      {sys:"MES 生產執行系統",tier:"Tier 1",color:"#fb7185",rto:"1 小時",rpo:"30 分",freq:"每 30 分增量",retain:"60 天 / 6 月",crit:"高"},
      {sys:"檔案伺服器 / 共享磁碟",tier:"Tier 2",color:"#f59e0b",rto:"4 小時",rpo:"4 小時",freq:"每 4 小時增量",retain:"30 天",crit:"中"},
      {sys:"郵件與協作平台",tier:"Tier 2",color:"#f59e0b",rto:"4 小時",rpo:"2 小時",freq:"每 2 小時增量",retain:"45 天",crit:"中"},
      {sys:"開發測試環境",tier:"Tier 3",color:"#94a3b8",rto:"24 小時",rpo:"24 小時",freq:"每日全量",retain:"14 天",crit:"低"},
      {sys:"歸檔冷資料",tier:"Tier 3",color:"#94a3b8",rto:"48 小時",rpo:"7 天",freq:"每週全量",retain:"7 年",crit:"低"}
    ];
    function s0(){
      var items=TIERS.map(function(t,idx){
        return '<div class="list-item'+(idx===0?" sel":"")+'"><div class="li-icon" style="background:'+t.color+'22;color:'+t.color+'"><span class="msi">dns</span></div>'+
          '<div class="li-main"><div class="li-title">'+esc(t.sys)+'</div><div class="li-sub">'+t.tier+' · RTO '+t.rto+' / RPO '+t.rpo+'</div></div></div>';
      }).join("");
      var rows=TIERS.map(function(t){
        return '<div class="tier-row"><div class="tier-badge" style="background:'+t.color+'">'+t.tier.replace("Tier ","T")+'</div>'+
          '<div class="tier-info"><div class="t">'+esc(t.sys)+'</div><div class="d">'+esc(t.freq)+' · 保留 '+esc(t.retain)+' · 重要性：'+t.crit+'</div></div>'+
          '<div class="tier-metrics"><div><div class="m" style="color:'+C.accent+'">'+t.rto+'</div><div class="l">RTO 目標</div></div>'+
          '<div><div class="m" style="color:'+C.info+'">'+t.rpo+'</div><div class="l">RPO 目標</div></div></div></div>';
      }).join("");
      return head(0,"步驟 v0 · 資訊部架構師")+
      '<div class="split">'+
        '<div class="pane"><div class="pane-h"><span class="msi">dns</span>受保護系統<span class="count">'+TIERS.length+' 項</span></div>'+items+'</div>'+
        '<div style="min-width:0">'+
          '<div class="miniflow" style="margin-bottom:16px">'+
            '<div class="mf"><div class="n">受保護資產</div><div class="v">128 套系統</div></div>'+
            '<div class="mf"><div class="n">受保護資料量</div><div class="v">86.4 TB</div></div>'+
            '<div class="mf"><div class="n">Tier 0 系統</div><div class="v" style="color:'+C.accent+'">6 套</div></div>'+
            '<div class="mf"><div class="n">策略覆蓋率</div><div class="v" style="color:'+C.ok+'">100%</div></div>'+
          '</div>'+
          '<div class="card"><h3><span class="msi">shield</span>保護分級與 RTO/RPO 目標</h3><div class="tier">'+rows+'</div></div>'+
        '</div>'+
      '</div>';
    }

    /* ============ SCREEN 1 : 排程備份 ============ */
    var JOBS=[
      {name:"ERP-DB 每時增量",type:"增量",tier:"T0",next:"14:30",last:"13:30 成功",size:"2.1 GB",st:"ok"},
      {name:"MES 每半時增量",type:"增量",tier:"T1",next:"14:00",last:"13:30 成功",size:"640 MB",st:"ok"},
      {name:"檔案伺服器每 4 時",type:"增量",tier:"T2",next:"16:00",last:"12:00 成功",size:"5.8 GB",st:"ok"},
      {name:"郵件平台每 2 時",type:"增量",tier:"T2",next:"15:00",last:"13:00 執行中",size:"—",st:"run"},
      {name:"ERP 每日全量",type:"全量",tier:"T0",next:"02:00",last:"昨日 成功",size:"420 GB",st:"ok"},
      {name:"開發環境每日全量",type:"全量",tier:"T3",next:"03:00",last:"昨日 逾時重跑",size:"88 GB",st:"warn"},
      {name:"歸檔冷資料每週",type:"全量",tier:"T3",next:"週日 04:00",last:"上週 成功",size:"1.2 TB",st:"ok"}
    ];
    function stPill(st){
      if(st==="ok")return '<span class="pill p-ok">成功</span>';
      if(st==="run")return '<span class="pill p-info">執行中</span>';
      if(st==="warn")return '<span class="pill p-warn">重跑</span>';
      return '<span class="pill p-bad">失敗</span>';
    }
    function s1(){
      var items=JOBS.map(function(j,idx){
        return '<div class="list-item'+(idx===3?" sel":"")+'"><div class="li-icon" style="background:'+(j.st==="run"?"#eaf1fe;color:#2563eb":"var(--soft);color:#e11d48")+'"><span class="msi">'+(j.type==="全量"?"backup":"difference")+'</span></div>'+
          '<div class="li-main"><div class="li-title">'+esc(j.name)+'</div><div class="li-sub">'+j.tier+' · '+j.type+' · 下次 '+j.next+'</div></div></div>';
      }).join("");
      var rows=JOBS.map(function(j){
        return '<tr><td style="white-space:normal">'+esc(j.name)+'</td><td><span class="pill p-mut">'+j.tier+'</span></td><td>'+j.type+'</td><td>'+j.next+'</td><td>'+esc(j.last)+'</td><td class="num">'+j.size+'</td><td>'+stPill(j.st)+'</td></tr>';
      }).join("");
      return head(1,"步驟 v1 · 維運工程師")+

    ];

    var nav=document.getElementById("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return '<button data-i="'+i+'"><span class="msi">'+m.icon+'</span><span class="idx">v'+i+'</span><span class="btxt">'+esc(m.name)+'</span></button>';
    }).join("");

    function show(i){
      var box=document.getElementById("screen");
      killCharts();
      var s=SCREENS[i]||SCREENS[0];
      box.innerHTML=s.r();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
      void box.offsetHeight;
      if(s.c)s.c();
    }

    nav.addEventListener("click",function(e){
      var btn=e.target.closest("[data-i]");
      if(!btn)return;
      var i=+btn.getAttribute("data-i");
      location.hash="v"+i;
    });

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
</html>
