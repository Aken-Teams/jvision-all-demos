<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>會展檔期報價所 · Event Venue Sales</title>
<meta name="description" content="會展場地檔期、詢價報價、合約簽訂與活動執行的一站式管理（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--pri:#9333ea;--pri2:#a855f7;--pri-d:#7e22ce;--ink:#2a1a3e;--body:#4b4361;--mut:#8b7fa3;--line:#ece5f6;--bg:#f7f4fc;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}
/* top nav */
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 22px;position:sticky;top:0;z-index:30;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(147,51,234,.34)}
.brand b{font-size:15px;font-weight:900;color:var(--ink);display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--pri);letter-spacing:2px;font-weight:700}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:var(--bg);color:var(--pri)}
.nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.usr{width:34px;height:34px;border-radius:50%;background:#ede9fe;color:var(--pri);font-weight:800;display:grid;place-items:center;flex:none;font-family:"Noto Sans TC"}
.wrap{max-width:1360px;margin:0 auto;padding:22px 26px 46px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink)}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.live{display:inline-flex;align-items:center;gap:7px;background:#f0fdf4;color:var(--ok);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--line)}
.btn.sm{height:31px;padding:0 11px;font-size:12px}
.btn .material-symbols-outlined{font-size:18px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--pri),var(--pri2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--pri)}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);margin-top:5px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px;color:var(--ok)}
.kpi .d.dn{color:var(--bad)}
/* grid + card */
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 19px;min-width:0}
.card>h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";flex-wrap:wrap}
.card>h3 .material-symbols-outlined{color:var(--pri);font-size:20px}
.card>h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--pri);cursor:pointer}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block}
.t-book{background:#f3e8ff;color:#7e22ce}.t-hold{background:#fef3c7;color:#b45309}.t-free{background:#dcfce7;color:#166534}
.t-ok{background:#dcfce7;color:#166534}.t-wait{background:#fef3c7;color:#92400e}.t-bad{background:#fee2e2;color:#991b1b}.t-info{background:#ede9fe;color:#5b21b6}
/* calendar overview */
.cal{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;min-width:640px}
.dow{font-size:11px;font-weight:800;color:var(--mut);text-align:center;padding:2px 0}
.day{border:1px solid var(--line);border-radius:11px;padding:8px 8px 9px;min-height:92px;background:#fff;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out{background:#faf8fd;opacity:.55}
.day .dn{font-size:12px;font-weight:800;color:var(--ink)}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px #ede9fe}
.ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.b{background:#f3e8ff;color:#7e22ce}.ev.h{background:#fef3c7;color:#b45309}
/* venue matrix */
.mtx{overflow-x:auto}
.mtxg{border-collapse:separate;border-spacing:0;width:100%;min-width:840px;font-size:12px}
.mtxg th,.mtxg td{padding:0;border-bottom:1px solid var(--line)}
.mtxg thead th{position:sticky;top:0;background:#faf6ff;color:var(--mut);font-weight:800;font-size:11px;padding:9px 8px;text-align:center;border-bottom:2px solid var(--line);white-space:nowrap}
.mtxg thead th.wknd{color:var(--pri);background:#f5edff}
.mtxg .vn{position:sticky;left:0;background:#fff;text-align:left;padding:8px 12px;min-width:170px;border-right:1px solid var(--line);z-index:1}
.mtxg .vn b{font-size:13px;color:var(--ink);font-family:"Noto Sans TC";display:block}
.mtxg .vn small{font-size:10.5px;color:var(--mut)}
.cell{height:44px;padding:4px !important}
.blk{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;text-align:center;line-height:1.1;padding:2px}
.blk.book{background:linear-gradient(135deg,var(--pri),var(--pri2))}
.blk.hold{background:repeating-linear-gradient(45deg,#f59e0b,#f59e0b 6px,#fbbf24 6px,#fbbf24 12px);color:#5a3a00}
.blk.free{background:#f4ecfe;color:#a855f7;font-weight:700}
.mtxg tbody tr:hover .vn{background:#faf6ff}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--body);margin-top:14px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
/* pipeline */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.pcol{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.pch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pch b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.pch .sum{font-size:11px;font-weight:800;color:var(--pri);background:#f3e8ff;border-radius:999px;padding:2px 9px}
.deal{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(147,51,234,.06)}
.deal b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.deal .amt{color:var(--pri);font-weight:900;font-size:15px;margin:4px 0}
.deal small{color:var(--mut);font-size:11px;display:block;line-height:1.5}
.deal .prog{height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.deal .prog span{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.deal-f{display:flex;align-items:center;gap:6px;margin-top:5px}
.av2{width:22px;height:22px;border-radius:50%;background:#ede9fe;color:var(--pri);font-size:10px;font-weight:800;display:grid;place-items:center;font-family:"Noto Sans TC"}
.hot{font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;background:#fee2e2;color:#dc2626}
.warm{font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;background:#fef3c7;color:#b45309}
/* table */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:10px 12px;border-bottom:2px solid var(--line);background:#faf6ff;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:#faf6ff}
.tbl .id{font-weight:800;color:var(--pri)}
.tbl .nm{font-weight:700;color:var(--ink);font-family:"Noto Sans TC"}
/* contract */
.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc .dh{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;padding:16px 18px}
.doc .dh b{font-size:16px;font-family:"Noto Sans TC"}
.doc .dh small{display:block;color:#e9d5ff;font-size:12px;margin-top:2px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:13px}
.drow span{color:var(--mut)}
.drow b{color:var(--ink);font-weight:700;text-align:right}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 18px}
.sgn{border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center}
.sgn .sig{font-family:"Noto Sans TC";font-size:22px;font-weight:900;color:var(--pri);margin:6px 0}
.sgn small{color:var(--mut);font-size:11px}
.sgn.wait .sig{color:var(--mut);opacity:.5;font-size:14px;font-weight:600}
.pay{display:flex;flex-direction:column;gap:11px}
.pr{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.pr .pi{width:36px;height:36px;border-radius:10px;background:#f3e8ff;color:var(--pri);display:grid;place-items:center;flex:none}
.pr .mid{flex:1;min-width:0}
.pr .mid b{font-size:13px;color:var(--ink);font-family:"Noto Sans TC"}
.pr .mid small{display:block;color:var(--mut);font-size:11px}
.pr .amt{font-weight:900;color:var(--ink);font-family:Inter;font-size:15px}
/* checklist */
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.step.done{background:#f0fdf4;border-color:#bbf7d0}
.step.now{border-color:var(--pri);box-shadow:0 0 0 2px #ede9fe}
.step .st{font-size:11px;font-weight:800;color:var(--mut);display:flex;align-items:center;gap:6px}
.step.done .st{color:var(--ok)}
.step.now .st{color:var(--pri)}
.step b{display:block;margin-top:5px;font-size:14px;color:var(--ink);font-family:"Noto Sans TC"}
.step small{color:var(--mut);font-size:11px}
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .cb{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:15px}
.chk .cb.on{background:var(--ok);color:#fff}
.chk .cb.off{background:#fff;border:2px solid var(--line);color:transparent}
.chk .cb.wt{background:#fef3c7;color:#b45309}
.chk .info{flex:1;min-width:0}
.chk .info b{font-size:13px;color:var(--ink);font-family:"Noto Sans TC"}
.chk .info small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.chk .who{font-size:11px;color:var(--mut);white-space:nowrap;flex:none}
/* ai / notes */
.ai-row{display:flex;gap:11px;background:#f6effe;border-radius:12px;padding:12px 13px;margin-bottom:10px}
.ai-ic{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;flex:none}
.ai-row p{margin:0;font-size:13px;color:var(--body);line-height:1.55}
.ai-row b{color:var(--ink)}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:10px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al b{font-size:12.5px;font-family:"Noto Sans TC";color:var(--ink)}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.al .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.chart{width:100%;height:270px}
/* rwd */
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid.g2,.grid.g11,.grid.g2b{grid-template-columns:1fr !important}.sign{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:16px 14px 34px}.top{padding:10px 14px}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px 10px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo"><span class="material-symbols-outlined">stadium</span></span>
    <div><b>會展檔期報價所</b><span>VENUE SALES</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <span class="usr">展</span>
</header>
<main class="wrap" id="view"></main>
<script>
var MODS=[
 ["calendar_month","檔期總覽"],
 ["grid_view","場地檔期表"],
 ["request_quote","詢價報價"],
 ["draw","合約簽訂"],
 ["task_alt","活動執行"],
 ["insights","業績報表"]
];
var DESC=[
 "多場地檔期日曆總覽與暫訂到期提醒",
 "場地×日期矩陣顯示已訂／暫訂／可租狀態",
 "需求詢價、線上報價與報價管線追蹤",
 "合約條款、電子簽核與訂金付款狀態",
 "進場、佈場、驗收、退場檢核清單",
 "檔期成交漏斗、營收與場地使用率儀表"
];
var av=function(n){return '<span class="av2">'+n.slice(-1)+'</span>';};

/* ---------- KPI ---------- */
var KPI=[
 ["calendar_month","本月檔期使用率","78","%","+11pt",0],
 ["request_quote","待回覆報價","14","筆","3 筆即將到期",1],
 ["attach_money","本月成交金額","486","萬","+22%",0],
 ["event_available","可租空檔","23","天","近 30 日",0]
];
function kpiRow(){return '<div class="kpis">'+KPI.map(function(k){return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[0]+'</span>'+k[1]+'</div><div class="v">'+k[2]+'<small> '+k[3]+'</small></div><div class="d'+(k[5]?' dn':'')+'">'+k[4]+'</div></div>';}).join('')+'</div>';}

function wd(x){return ['日','一','二','三','四','五','六'][x];}

/* ---------- 0 檔期總覽 (month calendar) ---------- */
var CALDAYS=(function(){
 var arr=[];for(var i=0;i<6;i++)arr.push({out:true});
 var ev={
  1:[["b","電子展佈展"]],3:[["b","AI 論壇"]],5:[["h","婚宴洽談"]],
  7:[["b","新品發表"]],8:[["b","國際車展"],["h","尾牙暫訂"]],
  12:[["b","醫療展"]],13:[["b","科技高峰會"],["h","講座暫訂"]],
  15:[["h","品牌週暫"]],18:[["b","動漫祭"]],20:[["b","招商說明"]],
  22:[["b","food展"],["h","記者會暫"]],25:[["b","設計展"]],
  27:[["h","年會暫訂"]],28:[["b","電競賽"]],29:[["b","市集"]],30:[["b","演唱會"]]
 };
 for(var d=1;d<=31;d++){arr.push({d:d,today:d===13,ev:ev[d]||[]});}
 return arr;
})();
function scr0(){
 var cal='<div class="calgrid">'+['日','一','二','三','四','五','六'].map(function(w){return '<div class="dow">週'+w+'</div>';}).join('')+
  CALDAYS.map(function(c){
   if(c.out)return '<div class="day out"></div>';
   return '<div class="day'+(c.today?' today':'')+'"><div class="dn">'+c.d+'</div>'+c.ev.map(function(e){return '<div class="ev '+e[0]+'">'+e[1]+'</div>';}).join('')+'</div>';
  }).join('')+'</div>';
 var holds=[
  ["尾牙暫訂 · 華晶科技","展演廳 A","8/08","保留至 8/14","2 天後到期",1],
  ["講座暫訂 · 青禾教育","會議室 302","8/13","保留至 8/16","3 天後到期",0],
  ["記者會暫 · 沛能新創","多功能廳","8/22","保留至 8/18","已逾期",1],
  ["年會暫訂 · 鼎豐集團","國際廳","8/27","保留至 8/20","7 天後到期",0]
 ];
 return kpiRow()+
 '<div class="grid g2" style="grid-template-columns:1.55fr 1fr;">'+
  '<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>2026 年 8 月檔期日曆<span class="grow">全部場地 ›</span></h3><div class="cal">'+cal+'</div>'+
   '<div class="leg"><span><i style="background:linear-gradient(135deg,#9333ea,#a855f7)"></i>已訂活動</span><span><i style="background:#fbbf24"></i>暫訂保留</span><span><i style="background:#f4ecfe"></i>可租空檔</span></div></div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">hourglass_top</span>暫訂到期提醒</h3><div class="alist">'+
   holds.map(function(h){return '<div class="al'+(h[5]?' bad':'')+'"><span class="material-symbols-outlined">'+(h[5]?'error':'schedule')+'</span><div><b>'+h[0]+'</b><small>'+h[1]+' · 活動日 '+h[2]+' · '+h[3]+'</small></div><span class="tm">'+h[4]+'</span></div>';}).join('')+
   '</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn sm">轉正式合約</button><button class="btn ghost sm">延長保留</button><button class="btn ghost sm">釋出檔期</button></div></div>'+
 '</div>';
}

/* ---------- 1 場地檔期表 (venue x date matrix) ---------- */
var VENUES=[
 ["國際廳","2,400 人 · 3,600㎡"],
 ["展演廳 A","800 人 · 1,200㎡"],
 ["展演廳 B","600 人 · 900㎡"],
 ["多功能廳","500 人 · 700㎡"],
 ["會議室 302","120 人 · 180㎡"],
 ["宴會廳","350 桌 · 1,000㎡"],
 ["戶外廣場","5,000 人 · 開放"]
];

function show(i){

}

show(0);
