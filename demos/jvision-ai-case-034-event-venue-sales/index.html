<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>會展檔期報價所 · Event Venue Sales</title>
<meta name="description" content="會展場地檔期、詢價報價、合約簽訂與活動執行的一站式管理（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --warning:#A16207;
  --shadow:0 12px 36px rgba(6,78,59,.08);
  --shadow-hover:0 18px 46px rgba(6,78,59,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,"Microsoft JhengHei",sans-serif;
  color:var(--color-foreground);
  background:
    linear-gradient(90deg,rgba(5,150,105,.035) 1px,transparent 1px),
    linear-gradient(rgba(5,150,105,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 22;
  font-size:20px;
  line-height:1;
}
.top{
  position:sticky;
  top:0;
  z-index:50;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:24px;
  padding:12px clamp(16px,3vw,44px);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border-radius:4px;
  box-shadow:6px 6px 0 #D1FAE5;
}
.brand b{display:block;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.02em}
.brand small{display:block;margin-top:3px;color:var(--color-primary);font-size:9px;font-weight:600;letter-spacing:.18em}
.nav{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 12px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  white-space:nowrap;
  font-size:12px;
  font-weight:600;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{color:var(--ink);background:#ECFDF5;border-color:var(--line)}
.nav button.on{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.usr{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--ink);
  background:#D1FAE5;
  border:1px solid var(--line);
  border-radius:50%;
  font-size:12px;
  font-weight:600;
}
.wrap{width:min(1380px,100%);margin:auto;padding:34px clamp(16px,3vw,42px) 60px}
.vh{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
}
.vh h2{
  margin:0;
  color:var(--ink);
  font-size:clamp(25px,3vw,38px);
  font-weight:600;
  letter-spacing:-.045em;
}
.vh p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
  color:var(--color-primary);
  font-size:10px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.eyebrow::before{content:"";width:24px;height:2px;background:var(--color-accent)}
.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  color:#065F46;
  background:#D1FAE5;
  border:1px solid #6EE7B7;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
}
.live i{width:8px;height:8px;border:2px solid #065F46;border-radius:50%;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);opacity:.35}}
.btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 16px;
  color:#fff;
  background:var(--color-accent);
  border:1px solid var(--color-accent);
  border-radius:4px;
  font-size:12px;
  font-weight:600;
  box-shadow:3px 3px 0 #FED7AA;
  transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease;
}
.btn:hover{background:#C2410C;transform:translate(-1px,-1px);box-shadow:5px 5px 0 #FED7AA}
.btn.ghost{color:var(--ink);background:#fff;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{color:#065F46;background:#ECFDF5}
.btn.sm{min-height:35px;padding:0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{
  position:relative;
  min-width:0;
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi:hover{transform:translateY(-3px);border-color:#34D399;box-shadow:var(--shadow-hover)}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary)}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600}
.kpi .l .material-symbols-outlined{color:var(--color-primary)}
.kpi .v{
  margin-top:9px;
  color:var(--ink);
  font-size:28px;
  font-weight:600;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{color:var(--muted);font-size:12px;font-weight:500}
.kpi .d{margin-top:5px;color:#047857;font-size:11px;font-weight:600}
.kpi .d.dn{color:#B91C1C}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.card{
  min-width:0;
  padding:20px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card:hover{border-color:#6EE7B7;box-shadow:var(--shadow-hover)}
.card>h3,.card-head h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 17px;
  color:var(--ink);
  font-size:14px;
  font-weight:600;
}
.card>h3 .material-symbols-outlined,.card-head .material-symbols-outlined{color:var(--color-primary)}
.grow{margin-left:auto;color:var(--color-primary);font-size:11px;font-weight:600}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}
.t-book,.t-info{color:#065F46;background:#D1FAE5}
.t-hold,.t-wait{color:#854D0E;background:#FEF3C7}
.t-free,.t-ok{color:#166534;background:#DCFCE7}
.t-bad{color:#991B1B;background:#FEE2E2}
.cal{overflow-x:auto}
.calgrid{min-width:650px;display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{padding:4px;color:var(--muted);font-size:10px;font-weight:600;text-align:center}
.day{
  min-height:94px;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:3px;
}
.day.out{background:#F8FAFC;opacity:.55}
.day.today{border:2px solid var(--color-primary);box-shadow:inset 0 0 0 2px #D1FAE5}
.day .dn{color:var(--ink);font:600 11px/1 Inter,sans-serif}
.ev{overflow:hidden;padding:3px 5px;border-left:3px solid;font-size:9px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.ev.b{color:#065F46;background:#D1FAE5;border-color:#059669}
.ev.h{color:#854D0E;background:#FEF3C7;border-color:#A16207}
.leg{display:flex;gap:18px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:11px}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg i{width:14px;height:14px;display:inline-block;border:1px solid rgba(6,78,59,.18);border-radius:2px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:11px;
  color:#713F12;
  background:#FFFBEB;
  border:1px solid #FDE68A;
  border-left:4px solid #A16207;
  border-radius:3px;
}
.al.bad{color:#7F1D1D;background:#FEF2F2;border-color:#FECACA;border-left-color:var(--color-destructive)}
.al.good{color:#065F46;background:#ECFDF5;border-color:#A7F3D0;border-left-color:var(--color-primary)}
.al .material-symbols-outlined{flex:none;color:#A16207}
.al.bad .material-symbols-outlined{color:var(--color-destructive)}
.al.good .material-symbols-outlined{color:var(--color-primary)}
.al b{display:block;color:inherit;font-size:11px;font-weight:600}
.al small{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.5}
.al .tm{margin-left:auto;color:var(--muted);font:500 9px/1.4 Inter,monospace;white-space:nowrap}
.mtx,.scroll{overflow-x:auto}
.mtxg{width:100%;min-width:850px;border-collapse:separate;border-spacing:0;font-size:11px}
.mtxg th,.mtxg td{border-bottom:1px solid var(--line)}
.mtxg thead th{
  padding:10px 8px;
  color:var(--muted);
  background:#F0FDF4;
  border-bottom:2px solid var(--color-primary);
  font-weight:600;
  text-align:center;
  white-space:nowrap;
}
.mtxg thead th.wknd{color:#9A3412;background:#FFF7ED}
.mtxg .vn{
  position:sticky;
  left:0;
  z-index:2;
  min-width:170px;
  padding:9px 12px;
  background:#fff;
  border-right:1px solid var(--line);
  text-align:left;
}
.mtxg .vn b{display:block;color:var(--ink);font-size:12px;font-weight:600}
.mtxg .vn small{color:var(--muted);font-size:9px}
.cell{height:47px;padding:4px!important}
.blk{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3px;
  border-radius:2px;
  font-size:9px;
  font-weight:600;
  text-align:center;
}
.blk.book{color:#fff;background:#047857}
.blk.hold{color:#713F12;background:repeating-linear-gradient(135deg,#FDE68A,#FDE68A 6px,#FBBF24 6px,#FBBF24 12px);border:1px solid #A16207}
.blk.free{color:#065F46;background:#ECFDF5;border:1px dashed #6EE7B7}
.bar-row{display:flex;align-items:center;gap:10px;margin:11px 0}
.bar-label{width:96px;flex:none;color:var(--ink);font-size:11px;font-weight:600}
.track{flex:1;height:10px;overflow:hidden;background:#DDE9E7;border-radius:999px}
.track span{display:block;height:100%;background:var(--color-primary)}
.bar-value{width:42px;flex:none;color:var(--color-primary);font:600 11px/1 Inter,monospace;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{
  padding:11px 12px;
  color:var(--muted);
  background:#F0FDF4;
  border-bottom:2px solid var(--color-primary);
  font-size:10px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:hover td{background:#F0FDF4}
.tbl .id{color:var(--color-primary);font:600 11px/1 Inter,monospace}
.tbl .nm{color:var(--ink);font-weight:600}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(225px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 6px}
.pcol{padding:11px;background:#F0F7F6;border:1px solid var(--line);border-radius:4px}
.pch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pch b{color:var(--ink);font-size:11px;font-weight:600}
.sum{padding:3px 8px;color:#065F46;background:#D1FAE5;border-radius:999px;font:600 9px/1.4 Inter,monospace}
.deal{
  margin-bottom:9px;
  padding:11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:3px;
  box-shadow:0 3px 9px rgba(6,78,59,.05);
}
.deal:hover{border-color:#34D399;transform:translateY(-1px)}
.deal b{color:var(--ink);font-size:11px;font-weight:600}
.deal .amt{margin:5px 0;color:var(--color-primary);font:600 15px/1 Inter,sans-serif;text-align:right}
.deal small{display:block;color:var(--muted);font:400 9px/1.5 Inter,monospace}
.prog{height:5px;margin:8px 0;background:#DDE9E7;border-radius:999px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--color-primary)}
.deal-f{display:flex;align-items:center;gap:6px}
.av2{width:22px;height:22px;display:grid;place-items:center;color:#065F46;background:#D1FAE5;border-radius:50%;font-size:9px;font-weight:600}
.hot,.warm{padding:3px 6px;border:1px solid;border-radius:999px;font-size:9px;font-weight:600}
.hot{color:#991B1B;background:#FEE2E2}
.warm{color:#854D0E;background:#FEF3C7}
.ai-row{display:flex;gap:11px;margin-bottom:10px;padding:12px;background:#F0FDF4;border:1px solid var(--line);border-radius:3px}
.ai-ic{width:32px;height:32px;display:grid;place-items:center;flex:none;color:#fff;background:var(--color-primary);border-radius:3px}
.ai-row.warn{background:#FFF7ED;border-color:#FED7AA}
.ai-row.warn .ai-ic{background:var(--color-accent)}
.ai-row p{margin:0;color:var(--muted);font-size:11px;line-height:1.65}
.ai-row b{color:var(--ink)}
.doc{overflow:hidden;border:1px solid var(--line);border-radius:4px}
.dh{padding:18px;color:#fff;background:#065F46}
.dh b{font-size:15px;font-weight:600}
.dh small{display:block;margin-top:4px;color:#D1FAE5;font:400 10px/1.5 Inter,monospace}
.drow{display:flex;justify-content:space-between;gap:20px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:11px}
.drow span{color:var(--muted)}
.drow b{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.sgn{padding:14px;text-align:center;border:1px dashed #6EE7B7;border-radius:3px}
.sgn .sig{margin:7px 0;color:var(--color-primary);font-size:18px;font-weight:600}
.sgn small{color:var(--muted);font-size:9px}
.sgn.wait .sig{color:var(--muted);font-size:12px}
.pay{display:flex;flex-direction:column;gap:9px}
.pr{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:3px}
.pi{width:34px;height:34px;display:grid;place-items:center;flex:none;color:#065F46;background:#D1FAE5;border-radius:3px}
.mid{flex:1;min-width:0}
.mid b{display:block;color:var(--ink);font-size:11px;font-weight:600}
.mid small{display:block;color:var(--muted);font-size:9px}
.pr .amt{color:var(--ink);font:600 12px/1 Inter,monospace;text-align:right}
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.step{position:relative;padding:13px;background:#fff;border:1px solid var(--line);border-radius:4px}
.step:not(:last-child)::after{content:"";position:absolute;top:25px;right:-9px;z-index:2;width:9px;height:2px;background:var(--line)}
.step.done{background:#ECFDF5;border-color:#34D399}
.step.now{border:2px solid var(--color-accent);box-shadow:0 0 0 3px #FFEDD5}
.step .st{display:flex;align-items:center;gap:5px;color:var(--muted);font:600 9px/1 Inter,monospace}
.step.done .st{color:#047857}
.step.now .st{color:#C2410C}
.step b{display:block;margin-top:6px;color:var(--ink);font-size:13px;font-weight:600}
.step small{color:var(--muted);font-size:9px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.cb{width:22px;height:22px;display:grid;place-items:center;flex:none;border-radius:3px}
.cb.on{color:#fff;background:#047857}
.cb.wt{color:#713F12;background:#FDE68A;border:1px solid #A16207}
.cb.off{color:transparent;background:#fff;border:2px solid #94A3B8}
.info{flex:1;min-width:0}
.info b{display:block;color:var(--ink);font-size:11px;font-weight:600}
.info small{display:block;margin-top:3px;color:var(--muted);font-size:9px}
.who{color:var(--muted);font:500 9px/1.4 Inter,monospace;white-space:nowrap}
.chart{width:100%;height:270px}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.note-list{color:var(--muted);font-size:10px;line-height:1.8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.3,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}}
@media(max-width:1024px){
  .top{gap:14px}
  .nav button{padding:0 10px}
  .nav button .label{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2,.g11,.g2b{grid-template-columns:1fr!important}
}
@media(max-width:768px){
  .top{min-height:64px;padding:10px 16px}
  .brand small{display:none}
  .wrap{padding-top:24px}
  .stepbar{grid-template-columns:repeat(2,1fr)}
  .step:nth-child(2)::after{display:none}
  .sign{grid-template-columns:1fr}
}
@media(max-width:480px){
  .brand b{font-size:13px}
  .logo{width:38px;height:38px}
  .usr{display:none}
  .nav{margin-left:auto}
  .nav button{width:40px;padding:0;justify-content:center}
  .vh{align-items:flex-start}
  .vh h2{font-size:27px}
  .kpis{grid-template-columns:1fr}
  .card{padding:16px}
  .stepbar{grid-template-columns:1fr}
  .step::after{display:none!important}
  .drow{flex-direction:column;gap:4px}
  .drow b{text-align:left}
  .who{max-width:72px;white-space:normal;text-align:right}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><span class="material-symbols-outlined">stadium</span></span>
    <div><b>會展檔期報價所</b><small>VENUE SALES</small></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <span class="usr" aria-label="展會管理員">展</span>
