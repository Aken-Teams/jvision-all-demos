<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RFID/條碼盤點管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0369a1; --accent2:#38bdf8; --ink:#0f2537; --muted:#5b7185;
  --bg:#eef4f9; --card:#ffffff; --line:#dbe6ef; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
header{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#04486e,#0369a1);color:#fff;box-shadow:0 2px 14px rgba(3,57,90,.28)}
.hwrap{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.8;font-weight:500}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav-btn{display:flex;align-items:center;gap:6px;border:none;cursor:pointer;background:rgba(255,255,255,.10);color:#eaf5fc;
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0}
.nav-btn:hover{background:rgba(255,255,255,.22)}
.nav-btn.active{background:#fff;color:var(--accent)}
.nav-btn .material-symbols-outlined{font-size:19px}
main{max-width:1400px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.screen-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px}
.screen-head p{color:var(--muted);font-size:13px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#e3f1fb;color:#04597d;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(15,37,55,.04)}
.card h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .sub{font-size:11.5px;margin-top:4px;font-weight:600}
.kpi .ic{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:9px;background:#e3f1fb;color:var(--accent);display:grid;place-items:center;font-size:20px}
.up{color:var(--ok)}.down{color:var(--bad)}.wn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:#f5f9fc}
tbody tr:hover{background:#f7fbfe}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-neu{background:#e2e8f0;color:#475569}.t-info{background:#e0f2fe;color:#0369a1}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
.bar-row .nm{width:96px;flex:0 0 auto;font-weight:600;color:var(--muted)}
.bar-track{flex:1;height:9px;background:#eaf1f7;border-radius:6px;overflow:hidden;min-width:0}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar-row .pv{width:52px;text-align:right;font-weight:700;flex:0 0 auto}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:#f2f7fb;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#334b60}
.col h4 span.cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk .tt{font-size:12.5px;font-weight:700}
.tk .mt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 6px}
.tl-item:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item .th{font-size:13px;font-weight:700}
.tl-item .td{font-size:12px;color:var(--muted);margin-top:2px}
.tl-item .tm{font-size:11px;color:var(--accent);font-weight:700}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:0}
.gate{background:linear-gradient(160deg,#04486e,#0369a1);color:#fff;border-radius:14px;padding:14px;position:relative;overflow:hidden;min-width:0}
.gate .gt{font-size:12.5px;font-weight:700;opacity:.9;display:flex;align-items:center;gap:6px}
.gate .rd{font-size:30px;font-weight:800;margin-top:8px}
.gate .rd small{font-size:12px;opacity:.85;font-weight:600}
.gate .wave{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:10px}
.gate .wave i{flex:1;background:rgba(255,255,255,.55);border-radius:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:999px;margin-top:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pda{background:#0f2537;border-radius:20px;padding:12px;color:#e6f2fb;max-width:320px;margin:0 auto;box-shadow:0 8px 26px rgba(4,45,70,.3)}
.pda .scr{background:#08324b;border-radius:12px;padding:12px}
.pda .barcode{height:52px;background:repeating-linear-gradient(90deg,#eaf5fc 0 3px,#08324b 3px 6px);border-radius:6px;margin:10px 0}
.pda .row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.14)}
.pda .big{text-align:center;font-size:22px;font-weight:800;margin:8px 0}
.mini{font-size:11.5px;color:var(--muted);margin-top:2px}
.statline{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.statline b{font-weight:700}
.progress{height:8px;border-radius:5px;background:#eaf1f7;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .dock{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav-btn .lbl{display:none}
  .nav-btn{padding:8px 10px}
  .board{grid-template-columns:1fr}
  .brand h1{font-size:14px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
      <div><h1>RFID／條碼盤點管理系統</h1><small>RFID / Barcode Cycle Count・倉儲物流</small></div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main><div id="app"></div></main>

<script>
"use strict";
var SCREENS=[
  {i:0,ic:"calendar_month",nm:"盤點排程"},
  {i:1,ic:"inventory_2",nm:"RFID 批次讀取"},
  {i:2,ic:"qr_code_scanner",nm:"條碼手持盤點"},
  {i:3,ic:"fact_check",nm:"帳實差異比對"},
  {i:4,ic:"verified",nm:"覆核與帳調"},
  {i:5,ic:"monitoring",nm:"準確率儀表板"}
];
var charts=[];
function disposeCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}

/* helpers */
function kpi(lab,val,unit,sub,cls,ic){
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
  '<div class="lab">'+lab+'</div><div class="val">'+val+' <small>'+unit+'</small></div><div class="sub '+cls+'">'+sub+'</div></div>';
}
function barRow(nm,pv){return '<div class="bar-row"><span class="nm">'+nm+'</span><span class="bar-track"><span class="bar-fill" style="width:'+pv+'%"></span></span><span class="pv">'+pv+'%</span></div>';}
function statLine(a,b){return '<div class="statline"><span>'+a+'</span><b>'+b+'</b></div>';}
function tl(tm,th,td){return '<div class="tl-item"><div class="tm">'+tm+'</div><div class="th">'+th+'</div><div class="td">'+td+'</div></div>';}
function ruleRow(id,rule,ev,c){return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-size:12.5px">'+id+'</b><span class="tag '+c+'">'+ev+'</span></div><div class="mini" style="margin-top:3px">'+rule+'</div></div>';}
function benchRow(lab,bf,af,unit){
  var pct=Math.round((1-af/bf)*100);var better=af<bf;
  return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600"><span>'+lab+'</span><span><span style="color:var(--muted)">'+bf+'</span> → <b class="'+(better?'up':'down')+'">'+af+' '+unit+'</b></span></div><div class="progress" style="margin-top:5px"><i style="width:'+Math.min(Math.abs(pct),100)+'%"></i></div></div>';
}
function adjRow(id,sku,q,amt,c,st){return '<tr><td><b>'+id+'</b></td><td>'+sku+'</td><td style="text-align:right">'+q+'</td><td style="text-align:right">'+amt+'</td><td><span class="tag '+c+'">'+st+'</span></td></tr>';}

/* ---------- screen 0 : 盤點排程 ---------- */
function s0(){
  var sched=[
    {id:"CC-2608-A01",zone:"A 區・電子料",type:"循環盤點",abc:"A",items:184,owner:"林孟達",date:"08/14 08:00",st:"進行中",stc:"t-info"},
    {id:"CC-2608-A02",zone:"B 區・機構件",type:"循環盤點",abc:"B",items:96,owner:"陳雅琪",date:"08/14 10:30",st:"待開始",stc:"t-neu"},
    {id:"CC-2608-C11",zone:"C 區・耗材",type:"抽盤",abc:"C",items:42,owner:"王柏翰",date:"08/14 13:00",st:"待開始",stc:"t-neu"},
    {id:"CC-2608-A03",zone:"D 區・高價料",type:"複盤",abc:"A",items:28,owner:"張庭瑋",date:"08/15 09:00",st:"排定",stc:"t-warn"},
    {id:"FC-2608-ALL",zone:"全庫・季盤",type:"全盤",abc:"—",items:1620,owner:"倉儲部",date:"08/31 20:00",st:"排定",stc:"t-warn"},
    {id:"CC-2607-A19",zone:"A 區・電子料",type:"循環盤點",abc:"A",items:176,owner:"林孟達",date:"08/07 08:00",st:"已完成",stc:"t-ok"}
  ];
  var rows=sched.map(function(r){return '<tr><td><b>'+r.id+'</b></td><td>'+r.zone+'</td><td><span class="tag t-info">'+r.type+'</span></td><td>'+r.abc+'</td><td style="text-align:right">'+r.items+'</td><td>'+r.owner+'</td><td>'+r.date+'</td><td><span class="tag '+r.stc+'">'+r.st+'</span></td></tr>';}).join("");
  return ''+
  '<div class="screen-head"><div><h2><span class="material-symbols-outlined">calendar_month</span>盤點排程</h2>'+
  '<p>依 ABC 分級建立循環盤點排程，將儲位分組並派工。</p></div><span class="chip"><span class="material-symbols-outlined" style="font-size:16px">event_available</span>本週 12 張盤點單</span></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("本週盤點單","12","張","+3 較上週","up","assignment")+
    kpi("待派工儲位","37","組","A 級 9 組","wn","pin_drop")+
    kpi("循環覆蓋率","94.2","%","目標 95%","up","donut_large")+
    kpi("平均排程耗時","2.9","小時/月","-14.1 vs 傳統","up","schedule")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">table_view</span>今日／近期盤點排程</h3><div style="overflow-x:auto"><table><thead><tr><th>盤點單</th><th>儲位分組</th><th>類型</th><th>ABC</th><th style="text-align:right">品項</th><th>負責人</th><th>時間</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>ABC 分級盤點頻次</h3><div id="c0a" class="chart sm"></div><div class="legend"><span><i class="dot" style="background:#0369a1"></i>A 每週</span><span><i class="dot" style="background:#38bdf8"></i>B 雙週</span><span><i class="dot" style="background:#bae6fd"></i>C 每月</span></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各儲區排定盤點量（8 月）</h3><div id="c0b" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">groups</span>盤點人員派工負載</h3>'+
      barRow("林孟達",88)+barRow("陳雅琪",72)+barRow("王柏翰",54)+barRow("張庭瑋",41)+barRow("外包支援",23)+
    '</div>'+
  '</div>';
}
function s0charts(){
  mk("c0a",{tooltip:{trigger:"item"},series:[{type:"pie",radius:["45%","72%"],center:["50%","52%"],label:{show:false},data:[
    {value:9,name:"A 每週",itemStyle:{color:"#0369a1"}},{value:14,name:"B 雙週",itemStyle:{color:"#38bdf8"}},{value:14,name:"C 每月",itemStyle:{color:"#bae6fd"}}]}]});
  mk("c0b",{grid:{left:38,right:12,top:20,bottom:28},tooltip:{trigger:"axis"},legend:{data:["循環","全盤"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["A區","B區","C區","D區","E區"],axisLabel:{fontSize:11}},yAxis:{type:"value",axisLabel:{fontSize:11}},
    series:[{name:"循環",type:"bar",stack:"x",data:[184,96,42,28,66],itemStyle:{color:"#0369a1"}},{name:"全盤",type:"bar",stack:"x",data:[120,80,60,40,50],itemStyle:{color:"#38bdf8"}}]});
}

/* ---------- screen 1 : RFID 批次讀取 ---------- */
function s1(){
  var gates=[
    {nm:"門型天線 G1（收貨口）",rd:1284,rate:98.6,st:"讀取中"},
    {nm:"固定天線 A 排上方",rd:962,rate:97.1,st:"讀取中"},
    {nm:"手推 RFID 車 R3",rd:517,rate:95.4,st:"移動盤讀"}
  ];
  var gcards=gates.map(function(g){
    var w="";for(var i=0;i<11;i++){w+='<i style="height:'+(20+((i*37)%80))+'%"></i>';}
    return '<div class="gate"><div class="gt"><span class="material-symbols-outlined" style="font-size:17px">sensors</span>'+g.nm+'</div>'+
    '<div class="rd">'+g.rd.toLocaleString()+' <small>tags</small></div><div class="wave">'+w+'</div>'+
    '<span class="pill"><span class="material-symbols-outlined" style="font-size:14px">bolt</span>讀取率 '+g.rate+'%・'+g.st+'</span></div>';
  }).join("");
  var read=[
    {epx:"E280·1170·A03F",sku:"IC-3325 主控晶片",qty:48,loc:"A-03-2",rssi:-52,st:"符合",c:"t-ok"},
    {epx:"E280·1170·B7C1",sku:"CAP-104 電容組",qty:200,loc:"A-05-1",rssi:-58,st:"符合",c:"t-ok"},
    {epx:"E280·1170·C29D",sku:"PCB-A2 主板",qty:31,loc:"B-01-4",rssi:-61,st:"少 3 件",c:"t-warn"},
    {epx:"E280·1170·D544",sku:"CONN-88 連接器",qty:0,loc:"B-02-2",rssi:-74,st:"未讀到",c:"t-bad"},
    {epx:"E280·1170·E018",sku:"HS-12 散熱片",qty:120,loc:"C-04-3",rssi:-55,st:"符合",c:"t-ok"}
  ];
  var rows=read.map(function(r){return '<tr><td style="font-family:monospace;font-size:12px">'+r.epx+'</td><td>'+r.sku+'</td><td style="text-align:right">'+r.qty+'</td><td>'+r.loc+'</td><td>'+r.rssi+' dBm</td><td><span class="tag '+r.c+'">'+r.st+'</span></td></tr>';}).join("");
  return ''+
  '<div class="screen-head"><div><h2><span class="material-symbols-outlined">inventory_2</span>RFID 批次讀取</h2>'+
  '<p>固定式／門型天線批量標籤盤讀，秒級蒐集現場實盤數量。</p></div><span class="chip"><span class="material-symbols-outlined" style="font-size:16px">wifi_tethering</span>3 座天線在線</span></div>'+
  '<div class="dock" style="margin-bottom:14px">'+gcards+'</div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("本場已盤讀","2,763","tags","對應 41 儲位","up","nfc")+
    kpi("平均讀取率","97.0","%","門檻 95%","up","speed")+
    kpi("漏讀標籤","18","枚","需人工補讀","wn","report")+
    kpi("盤讀耗時","6.4","分/儲位","傳統 22 分","up","timer")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>即時盤讀明細（EPC）</h3><div style="overflow-x:auto"><table><thead><tr><th>EPC</th><th>料號品名</th><th style="text-align:right">盤讀數</th><th>儲位</th><th>訊號</th><th>比對</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>各天線每分鐘讀取量</h3><div id="c1a" class="chart sm"></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">timeline</span>RSSI 訊號強度分佈（本次盤讀）</h3><div id="c1b" class="chart"></div></div>';
