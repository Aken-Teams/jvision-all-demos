<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無線感應與條碼盤點系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Open Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
svg{display:block;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
header{position:sticky;top:0;z-index:20;border-bottom:3px solid var(--ink);background:#fff}
.hwrap{max-width:1440px;margin:auto;display:flex;align-items:stretch}
.brand{display:flex;align-items:center;gap:12px;min-width:292px;padding:13px 18px;border-right:3px solid var(--ink);background:var(--color-primary);color:#fff}
.logo{width:42px;height:42px;display:grid;place-items:center;border:2px solid #fff}
.brand h1{margin:0;font:700 16px/1.2 Poppins,sans-serif}
.brand small{display:block;margin-top:3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#e2e8f0}
nav{display:flex;flex:1;overflow-x:auto;background:var(--color-muted)}
.nav-btn{flex:1;min-width:112px;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 10px;border:0;border-right:1px solid #cbd5e1;background:transparent;color:var(--ink);font-size:12px;font-weight:700}
.nav-btn:hover{background:#e2e8f0}
.nav-btn.active{background:var(--color-accent);color:#001a12;box-shadow:inset 0 -5px 0 var(--ink)}
main{max-width:1440px;margin:auto;padding:26px 20px 64px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;padding-bottom:15px;border-bottom:3px solid var(--ink)}
.screen-head h2{display:flex;align-items:center;gap:10px;margin:0;font:700 clamp(24px,3vw,38px)/1 Poppins,sans-serif;letter-spacing:-.04em}
.screen-head h2 svg{color:var(--color-accent)}
.screen-head p{max-width:720px;margin:9px 0 0;color:var(--muted);font-size:13px}
.chip,.tag{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;font-weight:700}
.chip{padding:8px 11px;background:#fff;color:#334155;font-size:12px;white-space:nowrap}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
.card,.kpi{min-width:0;background:var(--color-card);border:2px solid var(--ink);box-shadow:5px 5px 0 #cbd5e1}
.card{padding:16px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:700 14px/1.3 Poppins,sans-serif}
.card h3 svg{color:var(--color-accent)}
.kpi{position:relative;min-height:130px;padding:16px;border-top:8px solid var(--color-primary)}
.kpi:nth-child(2n){transform:translateY(4px)}
.kpi .lab{padding-right:38px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{margin-top:15px;font:700 29px/1 Poppins,sans-serif;font-variant-numeric:tabular-nums}
.kpi .val small{font:600 12px "Open Sans",sans-serif;color:var(--muted)}
.kpi .sub{margin-top:8px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:12px;top:10px;width:31px;height:31px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--color-accent);color:#001a12}
.up{color:#047857}.down{color:#b91c1c}.wn{color:#92400e}
.scroll{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--color-primary);color:#fff;font-size:11px;font-weight:700;letter-spacing:.035em}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#ecfdf5}
td:nth-child(1),.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{padding:3px 7px;font-size:10.5px}
.t-ok{background:#d1fae5;color:#065f46}
.t-warn{background:#fef3c7;color:#78350f}
.t-bad{background:#fee2e2;color:#991b1b}
.t-neu{background:#e2e8f0;color:#334155}
.t-info{background:#dbeafe;color:#1e3a8a}
.chart{width:100%;height:270px}
.chart.sm{height:220px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border:1px solid var(--ink)}
.bar-row{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:10px;margin:13px 0;font-size:12px}
.bar-row .nm{font-weight:700}
.bar-track,.progress{height:11px;border:1px solid var(--ink);background:#e2e8f0}
.bar-fill,.progress i{display:block;height:100%;background:var(--color-accent)}
.bar-row .pv{text-align:right;font-family:var(--mono);font-weight:700}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gate{position:relative;overflow:hidden;padding:17px;border:3px solid var(--ink);background:var(--color-primary);color:#fff}
.gate:nth-child(2){background:#1e293b;transform:translateY(7px)}
.gate:nth-child(3){background:#475569}
.gt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.rd{margin-top:12px;font:700 31px/1 Poppins,sans-serif;font-variant-numeric:tabular-nums}
.rd small{font:600 11px "Open Sans",sans-serif}
.wave{height:30px;margin-top:12px;display:flex;align-items:flex-end;gap:4px}
.wave i{flex:1;background:#6ee7b7;border:1px solid #001a12}
.pill{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:4px 7px;border:1px solid #fff;background:#fff;color:#0f172a;font-size:10px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{padding:10px;border:2px solid var(--ink);background:var(--color-muted)}
.col h4{display:flex;justify-content:space-between;margin:0 0 9px;font-size:12px}
.cnt{padding:1px 7px;border:1px solid var(--ink);background:#fff;font-family:var(--mono)}
.tk{margin-bottom:8px;padding:9px;border:1px solid var(--ink);border-left:7px solid var(--blue);background:#fff}
.tt{font-size:12px;font-weight:700}
.mt{display:flex;justify-content:space-between;gap:5px;margin-top:5px;color:var(--muted);font-size:10.5px}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;border-left:3px solid var(--ink)}
.tl-item{position:relative;padding:0 0 17px 8px}
.tl-item:before{content:"";position:absolute;left:-23px;top:2px;width:11px;height:11px;border:3px solid var(--ink);background:var(--color-accent)}
.tm{font-family:var(--mono);font-size:10px;font-weight:700;color:#047857}
.th{font-size:12.5px;font-weight:700}
.td,.mini{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.6}
.pda{max-width:320px;margin:auto;padding:12px;border:3px solid var(--ink);background:#0f172a;color:#fff}
.scr{padding:13px;border:1px solid #94a3b8;background:#1e293b}
.barcode{height:52px;margin:11px 0;background:repeating-linear-gradient(90deg,#fff 0 2px,#0f172a 2px 5px)}
.pda .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #94a3b8;font-size:11px}
.pda .big{text-align:center;margin:10px 0;font:700 22px Poppins,sans-serif}
.action{display:flex;gap:8px;margin-top:12px}
.action span{flex:1;padding:9px;border:2px solid #fff;text-align:center;font-size:12px;font-weight:700}
.action .primary{background:var(--color-accent);color:#001a12}
.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.statline b{font-family:var(--mono)}
.rule{padding:10px 0;border-bottom:1px solid var(--line)}
.rule-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rule-top b{font-family:var(--mono);font-size:12px}
.note{margin-top:10px;padding:12px;border:2px solid var(--ink);background:#ecfdf5}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.25,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1}}
@media(max-width:1024px){
  .hwrap{display:block}.brand{border-right:0;border-bottom:2px solid var(--ink)}
  nav{width:100%}.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  main{padding:18px 12px 48px}.screen-head{align-items:flex-start}
  .dock,.g2{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}
  .gate:nth-child(2),.kpi:nth-child(2n){transform:none}
}
@media(max-width:560px){
  .brand{min-width:0}.brand h1{font-size:14px}.brand small{font-size:9px}
  .nav-btn{min-width:52px;padding:11px}.nav-btn .lbl{display:none}
  .g4{grid-template-columns:1fr}.board{grid-template-columns:1fr}
  .screen-head{display:block}.chip{margin-top:14px}
  .screen-head h2{font-size:26px}.card,.kpi{box-shadow:3px 3px 0 #cbd5e1}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
