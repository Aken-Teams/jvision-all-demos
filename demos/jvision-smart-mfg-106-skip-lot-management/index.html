<style>
:root{

--color-card:#fff;--color-card-foreground:#1e293b;--color-muted:#e9eff8;--color-muted-foreground:#475569;
--color-border:#e2e8f0;--color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#2563eb;
--blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
--ok:#047857;--warn:#a83e00;--bad:#dc2626;--info:#075985;--shadow:7px 7px 0 #1e293b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button,input{font:inherit}

.side{position:sticky;top:0;height:100vh;padding:18px;background:#111827;color:#fff;border-right:4px solid var(--ink);overflow:auto}
.brand{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:center;padding-bottom:20px;border-bottom:2px solid #fff}
.logo{display:grid;place-items:center;width:50px;height:50px;background:var(--color-accent);color:#000;border:3px solid #fff}
.logo svg{width:28px;height:28px}
.brand b{display:block;font-size:18px;line-height:1.15}
.brand small{color:#cbd5e1}
.nav{display:grid;gap:8px;margin-top:20px}
.nav button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:13px 12px;text-align:left;color:#fff;background:transparent;border:2px solid #64748b}
.nav button svg{width:21px;height:21px}
.nav button span{min-width:0}
.nav button small{display:block;color:#cbd5e1;font-size:11px}
.nav button:hover{background:#1e293b;border-color:#fff}
.nav button.on{background:var(--color-primary);border-color:#fff;box-shadow:4px 4px 0 #fff}
.nav button.on small{color:#fff}
.sfoot{margin-top:28px;padding-top:14px;border-top:2px solid #64748b;color:#cbd5e1;font-size:12px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;min-height:82px;padding:14px 24px;background:#fff;border-bottom:4px solid var(--ink)}
.top h1{margin:0;font-size:22px;line-height:1.2}
.crumb{color:var(--muted);font-size:12px;font-family:"Fira Code",monospace}
.sp{flex:1}
.pill,.badge,.tag{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;font-weight:700;line-height:1.2}
.pill{padding:8px 11px;background:#fff;color:var(--ink);font-size:12px}
.pill svg,.badge svg{width:16px;height:16px}
.live:before{content:"";width:8px;height:8px;background:var(--ok);border:1px solid var(--ink)}
.wrap{padding:26px;max-width:1600px;margin:auto}
.page-head{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:22px;padding:24px;background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:var(--shadow);overflow:hidden}
.page-head:after{content:"";position:absolute;right:-35px;top:-55px;width:170px;height:170px;background:var(--color-accent);border:3px solid var(--ink);transform:rotate(18deg)}
.page-head>*{position:relative;z-index:1}
.page-head .eyebrow{font:700 12px "Fira Code",monospace;text-transform:uppercase;letter-spacing:.12em}
.page-head h2{margin:6px 0 4px;font-size:clamp(25px,4vw,46px);line-height:1}
.page-head p{max-width:720px;margin:0;color:#dbeafe}
.page-head .stamp{padding:10px;background:#fff;color:#111827;border:3px solid #111827;font:700 13px "Fira Code",monospace;transform:rotate(-2deg)}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi,.card,.listpane{background:var(--color-card);border:3px solid var(--ink)}
.kpi{position:relative;min-width:0;padding:17px;box-shadow:5px 5px 0 var(--color-muted)}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi .kl{color:var(--muted);font-size:12px;font-weight:700}
.kpi .kv{margin:6px 0 2px;font:700 27px "Fira Code",monospace}
.kpi .kd{font-size:12px;font-weight:700}
.kpi .ic{float:right;width:36px;height:36px;display:grid;place-items:center;background:var(--color-muted);border:2px solid var(--ink)}
.kpi .ic svg{width:19px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:20px;align-items:start}
.detpane{display:grid;gap:18px;min-width:0}
.card{min-width:0;box-shadow:6px 6px 0 var(--color-muted)}
.ch,.lhead{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--color-muted);border-bottom:3px solid var(--ink)}
.ch h3,.lhead h3{margin:0;font-size:15px}
.ch .sub{color:var(--muted);font-size:12px;font-weight:600}
.cbody{padding:17px}
.search{display:flex;align-items:center;gap:8px;margin:12px;padding:10px;background:#fff;border:2px solid var(--ink);color:var(--muted);font-size:12px}
.search svg{width:17px}
.litem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:start;padding:13px;border:0;border-bottom:2px solid var(--line);background:#fff}
.litem:hover{background:#eff6ff}
.litem.on{background:#dbeafe;border-left:8px solid var(--blue);padding-left:7px}
.av{display:grid;place-items:center;width:40px;height:40px;background:var(--blue);color:#fff;border:2px solid var(--ink);font:700 14px "Fira Code",monospace}
.lt{min-width:0}
.lt b,.lt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt b{font-size:13px}.lt small{color:var(--muted);font-size:11px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px;background:#111827;color:#fff;border:3px solid var(--ink);box-shadow:7px 7px 0 var(--color-accent)}
.hero.danger{background:#7f1d1d}
.hero .hav{display:grid;place-items:center;width:58px;height:58px;background:var(--color-accent);color:#000;border:3px solid #fff;font:700 20px "Fira Code",monospace}
.hero h2{margin:0;font-size:21px}.hero p{margin:4px 0 0;color:#e2e8f0;font-size:12px}
.badge{padding:4px 8px;font-size:11px;background:#fff}
.b-ok{color:#065f46}.b-skip{color:#075985}.b-warn{color:#92400e}.b-bad{color:#b91c1c}.b-mut{color:#475569}
.tag{padding:3px 7px;background:#fff;color:var(--ink);font-size:11px}
.rule-box{border:2px solid var(--ink)}
.rl{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:2px solid var(--line);font-size:13px}
.rl:last-child{border:0}
.ck{width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--ink);font-weight:900}
.cky{background:#a7f3d0}.ckn{background:#fecaca}
.strip{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink)}
.strip>div{padding:15px;border-right:2px solid var(--ink)}
.strip>div:last-child{border:0}
.sl{color:var(--muted);font-size:11px;font-weight:700}.sv{font:700 22px "Fira Code",monospace}
.chart{width:100%;height:280px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:11px 12px;text-align:left;white-space:nowrap;background:#111827;color:#fff;border:2px solid #111827;font-size:11px;letter-spacing:.04em}
td{padding:11px 12px;border:1px solid #cbd5e1;vertical-align:middle}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#dbeafe}
.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
td:first-child,td small,time,.mono{font-family:"Fira Code",monospace}
.lvl{display:inline-block;padding:3px 8px;border:2px solid var(--ink);color:#fff;font-weight:700}
.miniq{display:inline-block;width:10px;height:10px;margin-right:2px;border:1px solid var(--ink)}
.bar{height:12px;background:#cbd5e1;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--blue)}
.dl{display:grid;gap:0;border:2px solid var(--ink)}
.dl .row{display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid var(--ink)}
.dl .row:last-child{border:0}
.dl .row span{color:var(--muted)}
.tl{position:relative;padding-left:30px}
.tl:before{content:"";position:absolute;left:9px;top:3px;bottom:3px;width:4px;background:var(--ink)}
.ti{position:relative;padding:0 0 20px}
.ti:last-child{padding-bottom:0}
.dot{position:absolute;left:-28px;top:2px;width:18px;height:18px;background:var(--blue);border:3px solid #fff;outline:2px solid var(--ink)}
.ti small{display:block;color:var(--muted)}.ti p{margin:5px 0 0;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.action{padding:11px 14px;border:3px solid var(--ink);font-weight:700}
.action.ok{background:#a7f3d0}.action.warn{background:#fde68a}.action.bad{background:#fecaca}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.3,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
@media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:800px){
.app{display:block}.side{position:sticky;z-index:20;width:100%;height:auto;padding:10px;display:flex;align-items:center;gap:12px;overflow-x:auto;border-right:0;border-bottom:4px solid var(--ink)}
.brand{display:flex;min-width:max-content;padding:0;border:0}.brand .logo{width:42px;height:42px}.brand small,.sfoot{display:none}
.nav{display:flex;margin:0;gap:8px}.nav button{width:auto;min-width:48px;grid-template-columns:22px auto;padding:10px}.nav button small{display:none}
.top{top:66px;padding:11px 14px}.top .date{display:none}.wrap{padding:16px}.page-head{grid-template-columns:1fr}.page-head .stamp{justify-self:start}
}
@media(max-width:520px){.kgrid{grid-template-columns:1fr}.kpi:nth-child(2n){transform:none}.top .live{display:none}.wrap{padding:12px}.strip{grid-template-columns:1fr}.strip>div{border-right:0;border-bottom:2px solid var(--ink)}}
</style>
</head>
