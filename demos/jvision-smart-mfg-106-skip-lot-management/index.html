<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skip Lot Management（跳批管理）｜Jvision 系統 Demo</title>
  <meta name="description" content="跳批資格條件、供應商料號矩陣、跳批啟動審核、績效追蹤與異常恢復全檢的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --acc:#16a34a; --acc2:#4ade80; --acc-d:#15803d;
      --ink:#0f2417; --sub:#5b7566; --line:#e2ece5; --bg:#f2f7f3; --card:#ffffff;
      --warn:#f59e0b; --bad:#dc2626; --ok:#16a34a; --info:#0891b2;
      --shadow:0 1px 2px rgba(16,60,32,.05),0 8px 24px rgba(16,60,32,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
    .app{display:flex;min-height:100vh;min-width:0}
    /* sidebar */
    .side{width:236px;flex:none;background:linear-gradient(180deg,#0f2417,#123a24);color:#dcefe3;display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;min-width:0}
    .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
    .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#06240f;flex:none;box-shadow:0 6px 16px rgba(74,222,128,.3)}
    .logo .material-symbols-outlined{font-size:24px}
    .brand b{font-size:15px;font-weight:800;letter-spacing:.2px;display:block}
    .brand span{font-size:11px;color:#8fc9a8}
    .nav{display:flex;flex-direction:column;gap:4px;min-width:0}
    .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#bfe0cd;padding:11px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;text-align:left;transition:.15s;min-width:0}
    .nav button .material-symbols-outlined{font-size:21px;flex:none}
    .nav button .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav button small{display:block;font-size:10.5px;color:#7db894;font-weight:500}
    .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    .nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.35)}
    .nav button.on small{color:#d6f5e2}
    .sfoot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:#79b795;border-top:1px solid rgba(255,255,255,.08)}
    .sfoot b{color:#cfeede}
    /* main */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
    .top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
    .top .crumb{font-size:12px;color:var(--sub);font-weight:600}
    .top .sp{flex:1}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#eafaf0;color:var(--acc-d);border:1px solid #c7ecd4;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700}
    .pill.dot::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--acc);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
    .wrap{padding:22px;min-width:0}
    /* generic */
    .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);min-width:0}
    .kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .kv{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
    .kpi .kd{font-size:11.5px;margin-top:4px;font-weight:600}
    .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--sub)}
    .kpi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#eafaf0;color:var(--acc-d);float:right}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
    .card .ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .card .ch h3{margin:0;font-size:14.5px;font-weight:800}
    .card .ch .sp{flex:1}
    .card .ch .sub{font-size:11.5px;color:var(--sub);font-weight:600}
    .cbody{padding:16px}
    /* split two-pane signature */
    .split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
    .listpane{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
    .lhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
    .lhead h3{margin:0;font-size:13.5px;font-weight:800}
    .lhead .sp{flex:1}
    .search{display:flex;align-items:center;gap:7px;background:#f3f8f4;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:12px 15px 6px;color:var(--sub);font-size:12.5px}
    .litem{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:.12s;min-width:0}
    .litem:hover{background:#f6fbf7}
    .litem.on{background:linear-gradient(90deg,#eafaf0,#fff);border-left:3px solid var(--acc);padding-left:12px}
    .litem .av{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
    .litem .lt{min-width:0;flex:1}
    .litem .lt b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .litem .lt small{font-size:11px;color:var(--sub);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .detpane{min-width:0;display:flex;flex-direction:column;gap:16px}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
    .b-ok{background:#e7f8ee;color:var(--acc-d)}
    .b-skip{background:#e0f2fe;color:#0369a1}
    .b-warn{background:#fef3c7;color:#b45309}
    .b-bad{background:#fee2e2;color:#b91c1c}
    .b-mut{background:#eef2f0;color:#556}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;color:var(--sub);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;border-bottom:1px solid var(--line);background:#f8fbf9;white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid #eef4f0;vertical-align:middle}
    tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#f8fbf9}
    .num{font-variant-numeric:tabular-nums;font-weight:700}
    .chart{width:100%;height:280px;overflow:hidden}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .bar{height:7px;border-radius:99px;background:#eaf1ec;overflow:hidden}
    .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
    .dl{display:flex;flex-direction:column;gap:12px}
    .dl .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
    .dl .row:last-child{border-bottom:0;padding-bottom:0}
    .dl .row b{font-weight:700}
    .dl .row span{color:var(--sub);font-weight:600}
    .hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:14px;background:linear-gradient(135deg,#0f2417,#16643a);color:#eafaf0;flex-wrap:wrap}
    .hero .hav{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
    .hero h2{margin:0;font-size:19px;font-weight:800}
    .hero p{margin:4px 0 0;font-size:12.5px;color:#a9d6bd}
    .hero .sp{flex:1}
    .rule-box{background:#f6fbf7;border:1px solid #d9efdf;border-radius:11px;padding:13px 15px}
    .rule-box .rl{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed #d9efdf}
    .rule-box .rl:last-child{border-bottom:0}
    .rule-box .rl .material-symbols-outlined{font-size:18px}
    .ck{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;flex:none}
    .cky{background:var(--acc);color:#fff}.ckn{background:#fee2e2;color:#b91c1c}
    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .ti{position:relative;padding:0 0 18px}
    .tl .ti:last-child{padding-bottom:0}
    .tl .dot{position:absolute;left:-21px;top:2px;width:14px;height:14px;border-radius:99px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
    .tl .ti b{font-size:13px}
    .tl .ti small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
    .tl .ti p{margin:5px 0 0;font-size:12px;color:#3c5648}
    .tl time{font-size:11px;color:var(--sub);font-weight:700}
    /* stat strip */
    .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
    .strip>div{padding:14px 16px;border-right:1px solid var(--line)}
    .strip>div:last-child{border-right:0}
    .strip .sl{font-size:11.5px;color:var(--sub);font-weight:600}
    .strip .sv{font-size:22px;font-weight:800;margin-top:4px}
    .prog-lg{display:flex;align-items:center;gap:12px}
    .ring{width:74px;height:74px;flex:none}
    .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef4f0;color:#456}
    .lvl{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}
    .miniq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:1px}
    @media(max-width:1040px){
      .kgrid{grid-template-columns:repeat(2,1fr)}
      .split{grid-template-columns:1fr}
      .g2,.g3{grid-template-columns:1fr}
      .strip{grid-template-columns:1fr}
      .strip>div{border-right:0;border-bottom:1px solid var(--line)}
    }
    @media(max-width:860px){
      .app{flex-direction:column}
      .side{width:auto;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow-x:auto}
      .brand{padding:0;flex:none}
      .sfoot{display:none}
      .nav{flex-direction:row;flex-wrap:nowrap;gap:6px}
      .nav button{flex:none;padding:9px 12px}
      .nav button small{display:none}
    }
    @media(max-width:560px){
      .kgrid{grid-template-columns:1fr}
      .top{padding:12px 14px}
      .wrap{padding:14px}
      .nav button .nx{display:none}
      .nav button{padding:9px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
        <div><b>SkipLot QMS</b><span>跳批管理平台</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sfoot">品保部 · IQC · 供應商品質<br/><b>v2.6</b> · 資料為示範用途</div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <div class="crumb" id="crumb">跳批管理</div>
          <h1 id="title">跳批資格條件</h1>
        </div>
        <div class="sp"></div>
        <span class="pill dot">IQC 連線中</span>
        <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">calendar_month</span> 2026-08-14</span>
      </header>
      <div class="wrap" id="view"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var charts=[];
    function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id,opt){var el=document.getElementById(id);if(!el||!window.echarts)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);return c;}
    var GRID={left:8,right:14,top:24,bottom:8,containLabel:true};
    var AX={axisLine:{lineStyle:{color:"#cddbd2"}},axisLabel:{color:"#5b7566",fontSize:11},axisTick:{show:false},splitLine:{lineStyle:{color:"#eef4f0"}}};

    /* ---------- fake data ---------- */
    var COLORS={A:"#16a34a",B:"#0891b2",C:"#f59e0b",D:"#dc2626"};
    // supplier x part rows (used across screens)
    var ROWS=[
      {id:"SP-2011",sup:"O裕精密",part:"CN-4471 連接器",cat:"連接器",lots:41,def:0.18,grade:"A",status:"skip",ratio:80,streak:38,due:"2026-11-02",risk:12,owner:"林士傑",last:"合格"},
      {id:"SP-2033",sup:"泰O電子",part:"RS-8820 電阻陣列",cat:"被動元件",lots:27,def:0.42,grade:"A",status:"skip",ratio:60,streak:24,due:"2026-10-18",risk:22,owner:"陳雅婷",last:"合格"},
      {id:"SP-2048",sup:"O盛五金",part:"MB-1200 鋁殼",cat:"機構件",lots:16,def:1.35,grade:"C",status:"review",ratio:0,streak:9,due:"-",risk:58,owner:"林士傑",last:"待判定"},
      {id:"SP-2050",sup:"O翊塑膠",part:"PL-330 外殼",cat:"機構件",lots:33,def:0.31,grade:"A",status:"skip",ratio:60,streak:29,due:"2026-10-05",risk:16,owner:"黃冠廷",last:"合格"},
      {id:"SP-2066",sup:"O發線材",part:"WR-990 線束",cat:"線材",lots:12,def:2.10,grade:"D",status:"full",ratio:0,streak:0,due:"-",risk:74,owner:"陳雅婷",last:"不良"},
      {id:"SP-2071",sup:"O茂馬達",part:"MT-560 微型馬達",cat:"驅動件",lots:22,def:0.66,grade:"B",status:"review",ratio:0,streak:14,due:"-",risk:34,owner:"黃冠廷",last:"合格"},
      {id:"SP-2088",sup:"O裕精密",part:"CN-2210 端子",cat:"連接器",lots:36,def:0.12,grade:"A",status:"skip",ratio:80,streak:34,due:"2026-11-20",risk:9,owner:"林士傑",last:"合格"},
      {id:"SP-2093",sup:"泰O電子",part:"CP-118 電容",cat:"被動元件",lots:19,def:0.88,grade:"B",status:"review",ratio:0,streak:11,due:"-",risk:41,owner:"陳雅婷",last:"合格"},
      {id:"SP-2101",sup:"O盛五金",part:"SC-045 螺絲",cat:"機構件",lots:44,def:0.09,grade:"A",status:"skip",ratio:80,streak:44,due:"2026-12-01",risk:6,owner:"黃冠廷",last:"合格"},
      {id:"SP-2115",sup:"O發線材",part:"FL-720 排線",cat:"線材",lots:8,def:1.72,grade:"D",status:"full",ratio:0,streak:0,due:"-",risk:69,owner:"林士傑",last:"不良"}
    ];
    function stBadge(s){
      if(s==="skip")return '<span class="badge b-skip">跳批中</span>';
      if(s==="review")return '<span class="badge b-warn">評估中</span>';
      if(s==="full")return '<span class="badge b-bad">恢復全檢</span>';
      return '<span class="badge b-mut">-</span>';
    }
    function gradeChip(g){var c={A:"#16a34a",B:"#0891b2",C:"#f59e0b",D:"#dc2626"}[g]||"#889";return '<span class="lvl" style="background:'+c+'">'+g+'</span>';}
    function avColor(g){return COLORS[g]||"#889";}

    /* ================= SCREEN 0 : 跳批資格條件（split） ================= */
    function s0(){
      var rules=[
        {t:"連續合格批數 ≥ 20 批",ok:true},
        {t:"近 90 天缺陷率 ≤ 0.5%",ok:true},
        {t:"供應商評等 A 或 B 級",ok:true},
        {t:"無重大客訴 / 召回紀錄",ok:true},
        {t:"最近一次稽核分數 ≥ 85",ok:false}
      ];
      var chips=ROWS.map(function(r,i){
        return '<div class="litem'+(i===0?' on':'')+'" onclick="__pick0('+i+')">'+
          '<div class="av" style="background:'+avColor(r.grade)+'">'+r.grade+'</div>'+
          '<div class="lt"><b>'+r.part+'</b><small>'+r.sup+' · '+r.id+'</small></div>'+
          stBadge(r.status)+'</div>';
      }).join("");
      var html=''+
      '<div class="kgrid">'+
        kpi("符合跳批資格","fact_check","6","+1 本週","up","／ 10 組供應商料號")+
        kpi("評估中待判定","pending_actions","3","2 組近門檻","flat","需補件覆核")+
        kpi("平均連續合格","done_all","23.6 批","門檻 20 批","up","跨料號中位數")+
        kpi("資格條件版本","rule","RULE v3","2026-07 生效","flat","4 項硬性條件")+
      '</div>'+
      '<div class="split">'+
        '<div class="listpane">'+
          '<div class="lhead"><h3>供應商料號清單</h3><div class="sp"></div><span class="tag">10 筆</span></div>'+
          '<div class="search"><span class="material-symbols-outlined" style="font-size:16px">search</span>搜尋供應商 / 料號</div>'+
          '<div id="list0" style="max-height:520px;overflow:auto">'+chips+'</div>'+
        '</div>'+
        '<div class="detpane" id="det0"></div>'+
      '</div>';
      set(html);
      window.__pick0=function(i){
        var ls=document.querySelectorAll("#list0 .litem");
        for(var k=0;k<ls.length;k++)ls[k].classList.toggle("on",k===i);
        renderDet0(i);
      };
      renderDet0(0);
      function renderDet0(i){
        var r=ROWS[i];
        var passN=rules.filter(function(x){return x.ok;}).length;
        var rl=rules.map(function(x){return '<div class="rl"><div class="ck '+(x.ok?"cky":"ckn")+'"><span class="material-symbols-outlined" style="font-size:14px">'+(x.ok?"check":"close")+'</span></div>'+x.t+'</div>';}).join("");
        var verdict = (r.grade==="A"||r.grade==="B") && r.def<=0.5 && r.lots>=20;
        var det=document.getElementById("det0");
        det.innerHTML=''+
        '<div class="hero"><div class="hav">'+r.grade+'</div>'+
          '<div><h2>'+r.part+'</h2><p>'+r.sup+' · '+r.id+' · '+r.cat+'</p></div>'+
          '<div class="sp"></div>'+
          '<div style="text-align:right"><div style="font-size:11px;color:#a9d6bd;font-weight:600">資格判定</div>'+
          '<div style="font-size:18px;font-weight:800;color:'+(verdict?"#4ade80":"#fca5a5")+'">'+(verdict?"符合跳批":"不符・維持全檢")+'</div></div></div>'+
        '<div class="g2">'+
          '<div class="card"><div class="ch"><h3>資格條件比對</h3><div class="sp"></div><span class="tag">'+passN+'/5 通過</span></div>'+
            '<div class="cbody"><div class="rule-box">'+rl+'</div></div></div>'+
          '<div class="card"><div class="ch"><h3>近 12 批缺陷率趨勢</h3></div>'+
            '<div class="cbody"><div class="chart" id="c0" style="height:230px"></div></div></div>'+
        '</div>'+

    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      disposeCharts();
      for(var k=0;k<btns.length;k++)btns[k].classList.toggle("on",k===i);
      document.getElementById("title").textContent=SCREENS[i].name;
      document.getElementById("crumb").textContent="跳批管理 / "+SCREENS[i].sub;
      SCREENS[i].fn();
      var view=document.getElementById("view");
      void view.offsetHeight;
    }
    window.show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
