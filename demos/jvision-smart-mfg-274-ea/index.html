<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業資訊系統架構管理平台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#2563EB;
 --color-on-primary:#FFFFFF;
 --color-secondary:#3B82F6;
 --color-on-secondary:#000000;
 --color-accent:#EA580C;
 --color-on-accent:#000000;
 --color-background:#F8FAFC;
 --color-foreground:#1E293B;
 --color-card:#FFFFFF;
 --color-card-foreground:#1E293B;
 --color-muted:#E9EFF8;
 --color-muted-foreground:#475569;
 --color-border:#E2E8F0;
 --color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;
 --color-ring:#2563EB;
 --blue:#2563EB;
 --ink:#1E293B;
 --muted:#475569;
 --line:#E2E8F0;
 --good:#047857;
 --warn:#B45309;
 --bad:#B91C1C;
 --info:#1D4ED8;
 --radius:8px;
 --shadow:0 1px 2px rgba(15,23,42,.06),0 5px 18px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{margin:0;max-width:100%;overflow-x:hidden;background:var(--color-background);color:var(--ink);font-family:"Work Sans",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.skip{position:fixed;left:16px;top:-60px;z-index:200;background:#fff;color:var(--blue);border:2px solid var(--blue);padding:9px 14px;text-decoration:none;font-weight:700}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(15,23,42,.05);backdrop-filter:blur(12px)}
.brand{max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 24px}
.logo{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;background:var(--blue);color:#fff;border-radius:7px;box-shadow:4px 4px 0 #BFDBFE}
.brand-copy{min-width:0}
.brand h1{margin:0;font-family:"Outfit",sans-serif;font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.brand .sub{margin-top:3px;color:var(--muted);font-size:11px;font-weight:500}
.spacer{flex:1}
.env{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid #BFDBFE;background:#EFF6FF;color:#1E40AF;padding:5px 9px;border-radius:6px;font:600 11px "Work Sans",sans-serif}
.env:before{content:"";width:7px;height:7px;border-radius:50%;background:#15803D;box-shadow:0 0 0 3px #DCFCE7}
.tabs-shell{border-top:1px solid #F1F5F9}
.tabs{max-width:1440px;margin:auto;display:flex;gap:2px;padding:0 20px;overflow-x:auto;scrollbar-width:thin}
.tabs button{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-height:45px;padding:7px 13px;border:0;background:transparent;color:#475569;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background-color .2s,color .2s}
.tabs button:after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:3px;background:transparent}
.tabs button:hover{background:#EFF6FF;color:#1D4ED8}
.tabs button.on{color:#1D4ED8;background:#F8FBFF}
.tabs button.on:after{background:var(--blue)}
.tabs button .material-symbols-outlined{font-size:18px}
main{max-width:1440px;margin:auto;padding:22px 24px 64px}
.scr-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:17px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.scr-head .tt{min-width:0}
.scr-head h2{display:flex;align-items:center;gap:9px;margin:0;font-family:"Outfit",sans-serif;font-size:25px;line-height:1.15;letter-spacing:-.025em}
.scr-head h2 .material-symbols-outlined{display:grid;place-items:center;width:34px;height:34px;background:#EFF6FF;color:var(--blue);border:1px solid #DBEAFE;border-radius:6px}
.scr-head p{max-width:850px;margin:6px 0 0;color:var(--muted);font-size:12.5px}
.badge{margin-left:auto;flex:0 0 auto;border:1px solid #BFDBFE;background:#EFF6FF;color:#1E40AF;padding:5px 9px;border-radius:5px;font:600 11px "Work Sans",sans-serif}
.grid{display:grid;gap:12px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.g2b{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card,.kpi{min-width:0;background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:15px}
.card h3{display:flex;align-items:center;gap:7px;margin:0 0 12px;font-family:"Outfit",sans-serif;font-size:14px;font-weight:600;letter-spacing:-.005em}
.card h3>.material-symbols-outlined{color:var(--blue);font-size:19px}
.card h3 .r{margin-left:auto;color:var(--muted);font:500 11px "Work Sans",sans-serif}
.kpi{position:relative;overflow:hidden;padding:14px 15px;border-top:3px solid var(--blue);transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:0 8px 22px rgba(37,99,235,.09)}
.kpi .ic{position:absolute;right:12px;top:12px;width:31px;height:31px;display:grid;place-items:center;background:#EFF6FF;color:#1D4ED8;border:1px solid #DBEAFE;border-radius:6px}
.kpi .ic .material-symbols-outlined{font-size:18px}
.kpi .lbl{padding-right:38px;color:var(--muted);font-size:11.5px;font-weight:600}
.kpi .val{margin-top:5px;font:700 25px/1.15 "Outfit",sans-serif;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:3px;color:var(--muted);font:600 12px "Work Sans",sans-serif}
.kpi .dt{min-height:17px;margin-top:5px;font-size:11px;font-weight:600}
.up{color:var(--good)}.up:before{content:"↑ "}
.dn{color:var(--bad)}.dn:before{content:"↓ "}
.fl{color:var(--warn)}.fl:before{content:"● "}
.chart{width:100%;height:260px;overflow:hidden}.chart.sm{height:220px}
.tblwrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;min-width:520px;border-collapse:collapse;background:#fff;font-size:12px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#F1F5F9;color:#334155;font-size:10.5px;font-weight:700;letter-spacing:.025em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#F8FAFC}
td:nth-last-child(1),td.mono{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:#ECFDF5;color:#047857;border-color:#A7F3D0}
.p-warn{background:#FFF7ED;color:#9A3412;border-color:#FED7AA}
.p-bad{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.p-info{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.p-mut{background:#F1F5F9;color:#475569;border-color:#CBD5E1}
.bar{height:7px;min-width:58px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
.scoreflex{display:flex;align-items:center;gap:8px;min-width:0}
.scoreflex .num{min-width:25px;text-align:right;font-size:11.5px}
.depmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.layer{min-width:0;background:#F8FAFC;border:1px solid var(--line);border-radius:6px;padding:10px}
.layer .lh{display:flex;align-items:center;gap:6px;margin-bottom:8px;color:#1D4ED8;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.node{display:flex;align-items:center;gap:7px;min-width:0;margin-bottom:7px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:5px;font-size:11.5px;font-weight:600;box-shadow:0 1px 1px rgba(15,23,42,.03)}
.node:last-child{margin-bottom:0}
.node .material-symbols-outlined{flex:0 0 auto;font-size:12px}
.node small{display:block;color:var(--muted);font-size:10px;font-weight:400}
.node .tag{margin-left:auto;flex:0 0 auto;padding:2px 6px;border-radius:3px;font-size:9.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dotc{width:9px;height:9px;border-radius:2px}
.gantt{min-width:640px}
.gantt .grow{display:grid;grid-template-columns:180px repeat(4,1fr);align-items:center;border-bottom:1px solid var(--line)}
.gantt .grow:last-child{border-bottom:0}
.gantt .ghd{padding:7px 8px;background:#F1F5F9;color:#334155;text-align:center;font-size:10.5px;font-weight:700}
.gantt .gname{padding:8px;font-size:11.5px;font-weight:600}
.gantt .gcell{padding:5px 4px}
.gantt .gbar{height:21px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:#fff;font-size:9.5px;font-weight:700}
.mtx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;overflow:hidden;background:var(--line);border:1px solid var(--line);border-radius:6px}
.mcell{min-width:0;background:#fff;padding:12px}
.mcell .mt{color:#334155;font-size:10px;font-weight:700;letter-spacing:.035em;text-transform:uppercase}
.mcell .mv{margin-top:5px;font-size:11.5px;font-weight:500}
.mcell .mv b{display:block;margin-top:3px;color:#1D4ED8}
.note{display:flex;align-items:flex-start;gap:6px;margin-top:9px;color:var(--muted);font-size:11px}
.note .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:15px}
.tl .row{display:flex;gap:10px;min-width:0}
.tl .rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.tl .dot{width:12px;height:12px;flex:0 0 auto;margin-top:3px;background:var(--blue);border:3px solid #DBEAFE;border-radius:50%}
.tl .ln{width:1px;min-height:13px;flex:1;background:#CBD5E1}
.tl .bd{min-width:0;padding-bottom:14px}
.tl .bd .h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:600}
.tl .bd .d{margin-top:2px;color:var(--muted);font-size:10.5px}
.tl .bd .tm{color:#1D4ED8;font-size:10px;font-weight:700}
.ti{padding:8px 9px;background:#F8FAFC;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;font-size:11.5px}
.ti .tn{font-weight:600}
.ti .tm{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:10px}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
 .brand,main{padding-left:18px;padding-right:18px}
 .tabs{padding:0 14px}
 .g2{grid-template-columns:minmax(0,1.25fr) minmax(280px,1fr)}
}
@media(max-width:768px){
 .brand{padding-top:10px;padding-bottom:10px}
 .brand .sub{display:none}
 .env{font-size:0;padding:7px}
 .tabs button{min-height:44px;padding:7px 11px;font-size:12px}
 main{padding:17px 14px 48px}
 .scr-head{align-items:flex-start}
 .scr-head h2{font-size:22px}
 .badge{margin-left:0}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g2,.g2b,.g3,.depmap{grid-template-columns:1fr}
}
@media(max-width:480px){
 .brand{padding-left:13px;padding-right:13px}
 .brand h1{font-size:15px}
 .logo{width:36px;height:36px}
 .tabs{padding:0 7px}
 main{padding-left:10px;padding-right:10px}
 .scr-head{display:block}
 .scr-head p{font-size:12px}
 .badge{display:inline-flex;margin-top:10px}
 .kpis{gap:8px}
 .kpi{padding:12px}
 .kpi .val{font-size:22px}
 .card{padding:12px}
 .mtx{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation:none!important;transition:none!important}
 .reveal{opacity:1;transform:none}
}
</style>
</head>

<script>
var CH={};
function disposeAll(){for(var k in CH){try{CH[k].dispose()}catch(e){}}CH={}}
function ec(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);CH[id]=c}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var C={blue:"#2563EB",blue2:"#3B82F6",orange:"#EA580C",green:"#047857",red:"#DC2626",amber:"#B45309",grid:"#E2E8F0",text:"#475569"};

 {i:4,ic:"trending_up",t:"優化路線圖"},
 {i:5,ic:"gavel",t:"架構治理"}
];
function kpi(ic,lbl,val,unit,dt,dc){
 return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div><div class="lbl">'+lbl+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':"")+'</div>'+(dt?'<div class="dt '+(dc||"")+'">'+dt+'</div>':'<div class="dt" aria-hidden="true">&nbsp;</div>')+'</div>'
}
function layer(title,ic,nodes){
 var s='<div class="layer"><div class="lh"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+title+'</div>';
 nodes.forEach(function(n){var c=n.tc.split(",");s+='<div class="node"><span class="material-symbols-outlined" style="color:'+c[1]+'" aria-hidden="true">circle</span><div style="min-width:0"><div>'+esc(n.n)+'</div><small>'+esc(n.s)+'</small></div><span class="tag" style="background:'+c[0]+';color:'+c[1]+'">'+esc(n.t)+'</span></div>'});
 return s+"</div>"
}
function mcell(t,v,ex){return '<div class="mcell"><div class="mt">'+t+'</div><div class="mv">'+v+'<b>'+ex+"</b></div></div>"}
function itrow(n,ty,c,sc,pd){return '<tr><td style="font-weight:600">'+n+'</td><td><span class="pill p-'+c+'">'+ty+'</span></td><td><div class="scoreflex"><div class="bar" aria-label="效益分 '+sc+'"><i style="width:'+sc+'%"></i></div><span class="num mono">'+sc+"</span></div></td><td class=\"mono\">"+pd+"</td></tr>"}
function tlrow(hh,tm,d,last){return '<div class="row"><div class="rail"><div class="dot"></div>'+(last?"":'<div class="ln"></div>')+'</div><div class="bd"><div class="h">'+esc(hh)+' <span class="tm">'+esc(tm)+'</span></div><div class="d">'+esc(d)+"</div></div></div>"}
function head(ic,title,desc,badge){return '<div class="scr-head"><div class="tt"><h2><span class="material-symbols-outlined" aria-hidden="true">'+ic+"</span>"+title+"</h2><p>"+desc+'</p></div><span class="badge">'+badge+"</span></div>"}
function finish(h){var a=document.getElementById("app");a.innerHTML='<div class="reveal">'+h+"</div>";void a.offsetHeight}

 ];

 var h=head("inventory_2","應用系統清冊","全企業應用與技術資產盤點，登錄業務能力、擁有者、技術堆疊與健康狀態，形成架構基線。","階段 v0 · 資訊部");
 h+='<div class="grid kpis" style="margin-bottom:12px">'+kpi("inventory_2","納管應用系統","62","個","+8 本季","up")+kpi("layers","技術堆疊種類","23","種","待收斂 14","fl")+kpi("groups","總使用人數","5,940","人","","")+kpi("verified","清冊完整度","96","%","+11%","up")+"</div>";
 h+='<div class="grid g2"><section class="card"><h3><span class="material-symbols-outlined">table_view</span>應用系統盤點清單<span class="r">共 62 筆 · 顯示 8</span></h3><div class="tblwrap"><table><thead><tr><th>代碼</th><th>系統名稱</th><th>業務能力</th><th>擁有者</th><th>技術堆疊</th><th>使用人數</th><th>狀態</th><th>健康度</th></tr></thead><tbody>';

(function initTabs(){

 for(var k=0;k<bs.length;k++){
  bs[k].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i")});
  bs[k].addEventListener("keydown",function(e){
   if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft"&&e.key!=="Home"&&e.key!=="End")return;
   e.preventDefault();
   var a=[].slice.call(bs),p=a.indexOf(this);
   if(e.key==="ArrowRight")p=(p+1)%a.length;
   if(e.key==="ArrowLeft")p=(p-1+a.length)%a.length;
   if(e.key==="Home")p=0;
   if(e.key==="End")p=a.length-1;
   a[p].focus();location.hash="v"+a[p].getAttribute("data-i")
  })
 }
})();
