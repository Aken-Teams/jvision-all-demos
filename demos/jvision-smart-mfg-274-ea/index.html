<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業架構管理平台（EA）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#b45309;--accent2:#f59e0b;--bg:#f6f4f1;--card:#ffffff;--ink:#26201a;--muted:#8a7f74;--line:#ece7e1;--good:#059669;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:'Inter','Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
header.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#5c3208,#b45309);color:#fff;box-shadow:0 2px 14px rgba(120,60,0,.22);}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px 6px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.3px;min-width:0;}
.brand .sub{font-size:12px;opacity:.82;font-weight:500;}
.brand .spacer{flex:1;min-width:0;}
.brand .env{font-size:11px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 14px 10px;}
nav.tabs button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:rgba(255,255,255,.82);font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;min-width:0;transition:.15s;}
nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff;}
nav.tabs button.on{background:#fff;color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.15);}
nav.tabs button .material-symbols-outlined{font-size:19px;}
main{max-width:1240px;margin:0 auto;padding:22px 18px 60px;}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.scr-head .tt{min-width:0;}
.scr-head h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scr-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.scr-head p{font-size:13px;color:var(--muted);margin-top:3px;}
.scr-head .badge{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:#fdf3e6;border:1px solid #f6dcb8;padding:6px 12px;border-radius:20px;white-space:nowrap;}
.grid{display:grid;gap:14px;min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:1.5fr 1fr;}
.g2b{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}.g2,.g2b,.g3{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(60,40,20,.04);}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .r{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi .ic{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fdf3e6;color:var(--accent);}
.kpi .ic .material-symbols-outlined{font-size:20px;}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;}
.kpi .dt{font-size:11.5px;margin-top:5px;font-weight:600;}
.up{color:var(--good);}.dn{color:var(--bad);}.fl{color:var(--warn);}
.chart{width:100%;height:260px;overflow:hidden;}
.chart.sm{height:220px;}
.tblwrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#faf8f5;}
tbody tr:hover{background:#fbfaf8;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
.p-good{background:#e7f6ee;color:var(--good);}
.p-warn{background:#fef3e2;color:var(--warn);}
.p-bad{background:#fdeaea;color:var(--bad);}
.p-info{background:#eef2fb;color:#3b5bdb;}
.p-mut{background:#f0ece7;color:var(--muted);}
.bar{height:7px;border-radius:5px;background:#efe9e2;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.board{grid-template-columns:1fr;}}
.depmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.depmap{grid-template-columns:1fr;}}
.layer{background:#faf7f3;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
.layer .lh{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.node{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.node .material-symbols-outlined{font-size:14px;flex:0 0 auto;}
.node .tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex:0 0 auto;white-space:nowrap;}
.node small{color:var(--muted);font-weight:500;display:block;font-size:11px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;}
.gantt{min-width:640px;}
.gantt .grow{display:grid;grid-template-columns:180px repeat(4,1fr);align-items:center;border-bottom:1px solid var(--line);}
.gantt .ghd{font-size:11px;color:var(--muted);font-weight:700;padding:6px 8px;text-align:center;}
.gantt .gname{font-size:12.5px;font-weight:600;padding:9px 8px;}
.gantt .gcell{padding:6px 4px;}
.gantt .gbar{height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;}
.mtx{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--line);border-radius:12px;overflow:hidden;min-width:0;}
@media(max-width:520px){.mtx{grid-template-columns:1fr;}}
.mcell{background:#fff;padding:12px;min-width:0;}
.mcell .mt{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.mcell .mv{font-size:12.5px;font-weight:600;margin-top:6px;}
.mcell .mv b{display:block;color:var(--accent);}
.note{font-size:12px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
.note .material-symbols-outlined{font-size:16px;color:var(--accent2);flex:0 0 auto;}
.scoreflex{display:flex;align-items:center;gap:10px;min-width:0;}
.scoreflex .num{font-size:13px;font-weight:800;min-width:26px;}
.tl .row{display:flex;gap:12px;min-width:0;}
.tl .rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fdf3e6;flex:0 0 auto;margin-top:3px;}
.tl .ln{width:2px;flex:1;background:var(--line);min-height:14px;}
.tl .bd{padding-bottom:16px;min-width:0;}
.tl .bd .h{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tl .bd .d{font-size:12px;color:var(--muted);margin-top:3px;}
.tl .bd .tm{font-size:11px;color:var(--accent);font-weight:700;}
.ti{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;font-size:12.5px;}
.ti .tn{font-weight:700;}
.ti .tm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;align-items:center;}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div style="min-width:0;">
      <h1>企業架構管理平台（EA）</h1>
      <div class="sub">Enterprise Architecture · 應用清冊 · 架構地圖 · 系統合理化</div>
    </div>
    <div class="spacer"></div>
    <div class="env">DEMO 環境 · 擬真資料</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main><div id="app"></div></main>
<script>
var CH = {};
function disposeAll(){for(var k in CH){try{CH[k].dispose();}catch(e){}}CH={};}
function ec(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);CH[id]=c;}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var TABS=[
 {i:0,ic:'inventory_2',t:'應用系統清冊'},
 {i:1,ic:'account_tree',t:'架構地圖'},
 {i:2,ic:'warning',t:'技術債標註'},
 {i:3,ic:'insights',t:'投資組合分析'},
 {i:4,ic:'trending_up',t:'優化路線圖'},
 {i:5,ic:'gavel',t:'架構治理'}
];

function kpi(ic,lbl,val,unit,dt,dc){
 return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'
 +'<div class="lbl">'+lbl+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
 +(dt?'<div class="dt '+(dc||'')+'">'+dt+'</div>':'<div class="dt" style="visibility:hidden">-</div>')+'</div>';
}
function layer(title,ic,nodes){
 var s='<div class="layer"><div class="lh"><span class="material-symbols-outlined" style="font-size:16px;color:#b45309">'+ic+'</span>'+title+'</div>';
 nodes.forEach(function(n){
  var c=n.tc.split(',');
  s+='<div class="node"><span class="material-symbols-outlined" style="color:'+c[1]+'">circle</span><div style="min-width:0"><div>'+esc(n.n)+'</div><small>'+esc(n.s)+'</small></div>'
  +'<span class="tag" style="background:'+c[0]+';color:'+c[1]+'">'+esc(n.t)+'</span></div>';
 });
 return s+'</div>';
}
function mcell(t,v,ex){return '<div class="mcell"><div class="mt">'+t+'</div><div class="mv">'+v+'<b>'+ex+'</b></div></div>';}
function itrow(n,ty,c,sc,pd){
 return '<tr><td style="font-weight:600">'+n+'</td><td><span class="pill p-'+c+'">'+ty+'</span></td>'
 +'<td><div class="scoreflex"><div class="bar"><i style="width:'+sc+'%"></i></div><span class="num mono">'+sc+'</span></div></td><td>'+pd+'</td></tr>';
}
function tlrow(hh,tm,d,last){
 return '<div class="row"><div class="rail"><div class="dot"></div>'+(last?'':'<div class="ln"></div>')+'</div>'
 +'<div class="bd"><div class="h">'+esc(hh)+' <span class="tm">'+esc(tm)+'</span></div><div class="d">'+esc(d)+'</div></div></div>';
}

/* SCREEN 0 應用系統清冊 */
function s0(){
 var apps=[
  {id:'APP-018',n:'ERP 財務核心',cap:'財務/會計',own:'財務部',stk:'商用資料庫 A',users:1200,st:'運行中',stc:'good',health:92},
  {id:'APP-042',n:'CRM 客戶關係',cap:'業務/行銷',own:'業務部',stk:'商用 CRM',users:860,st:'運行中',stc:'good',health:88},
  {id:'APP-071',n:'MES 製造執行',cap:'生產製造',own:'製造部',stk:'.NET / SQL',users:540,st:'運行中',stc:'good',health:79},
  {id:'APP-103',n:'舊版簽核系統',cap:'流程管理',own:'資訊部',stk:'Delphi 7',users:310,st:'待汰換',stc:'bad',health:41},
  {id:'APP-127',n:'HR 人資平台',cap:'人力資源',own:'人資部',stk:'Java / 商用資料庫 A',users:980,st:'運行中',stc:'good',health:84},
  {id:'APP-155',n:'內部入口網站',cap:'協作溝通',own:'資訊部',stk:'SharePoint',users:1500,st:'重複',stc:'warn',health:63},
  {id:'APP-190',n:'BI 報表分析',cap:'決策支援',own:'資訊長辦公室',stk:'商用 BI',users:420,st:'運行中',stc:'good',health:90},
  {id:'APP-208',n:'倉儲管理 WMS',cap:'供應鏈',own:'物流部',stk:'ASP.NET',users:230,st:'待評估',stc:'warn',health:58}
 ];
 var capData=[{value:14,name:'生產製造'},{value:11,name:'財務/會計'},{value:9,name:'供應鏈'},{value:8,name:'業務/行銷'},{value:7,name:'人力資源'},{value:13,name:'其他'}];
 var h='<div class="scr-head"><div class="tt"><h2><span class="material-symbols-outlined">inventory_2</span>應用系統清冊</h2>'
 +'<p>全企業應用與技術資產盤點，登錄業務能力、擁有者、技術堆疊與健康狀態，形成架構基線。</p></div>'
 +'<span class="badge">階段 v0 · 資訊部</span></div>';
 h+='<div class="grid kpis" style="margin-bottom:14px;">'
 +kpi('inventory_2','納管應用系統','62','個','+8 本季','up')
 +kpi('layers','技術堆疊種類','23','種','待收斂 14','fl')
 +kpi('groups','總使用人數','5,940','人','','')
 +kpi('verified','清冊完整度','96','%','+11%','up')
 +'</div>';
 h+='<div class="grid g2">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">table_view</span>應用系統盤點清單<span class="r">共 62 筆 · 顯示 8</span></h3><div class="tblwrap"><table>'
 +'<thead><tr><th>代碼</th><th>系統名稱</th><th>業務能力</th><th>擁有者</th><th>技術堆疊</th><th>使用人數</th><th>狀態</th><th>健康度</th></tr></thead><tbody>';
 apps.forEach(function(a){
  h+='<tr><td class="mono">'+a.id+'</td><td style="font-weight:600">'+esc(a.n)+'</td><td>'+esc(a.cap)+'</td><td>'+esc(a.own)+'</td><td>'+esc(a.stk)+'</td><td class="mono">'+a.users+'</td>'
  +'<td><span class="pill p-'+a.stc+'">'+esc(a.st)+'</span></td>'
  +'<td><div class="scoreflex"><div class="bar"><i style="width:'+a.health+'%"></i></div><span class="num mono">'+a.health+'</span></div></td></tr>';
 });
 h+='</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>業務能力分佈</h3><div id="c0a" class="chart sm"></div>'
 +'<div class="note"><span class="material-symbols-outlined">info</span>6 大業務能力域，62 個應用系統對應。</div></div>';
 h+='</div>';
 document.getElementById('app').innerHTML=h;
 void document.getElementById('app').offsetHeight;
 ec('c0a',{tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},color:['#b45309','#f59e0b','#e0872a','#c9741d','#f5b661','#a86233'],
  series:[{type:'pie',radius:['42%','66%'],center:['50%','42%'],avoidLabelOverlap:true,label:{fontSize:11},data:capData}]});
}

/* SCREEN 1 架構地圖 */
function s1(){
 var h='<div class="scr-head"><div class="tt"><h2><span class="material-symbols-outlined">account_tree</span>架構地圖</h2>'
 +'<p>依分層視角呈現系統依賴與整合關係，展示業務能力對應的應用分佈與資料流動路徑。</p></div>'
 +'<span class="badge">階段 v1 · 企業架構師</span></div>';
 h+='<div class="grid g2" style="margin-bottom:14px;">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">lan</span>分層架構視圖</h3><div class="depmap">'
 +layer('前端 / 通路層','captive_portal',[
   {n:'內部入口網站',s:'APP-155 · 1,500 人',t:'重複',tc:'#fef3e2,#d97706'},
   {n:'行動簽核 App',s:'APP-221 · iOS/Android',t:'運行',tc:'#e7f6ee,#059669'},
   {n:'客戶自助入口',s:'APP-233 · 對外',t:'運行',tc:'#e7f6ee,#059669'}
 ])
 +layer('應用 / 服務層','apps',[
   {n:'ERP 財務核心',s:'APP-018 · 商用資料庫 A',t:'核心',tc:'#eef2fb,#3b5bdb'},
   {n:'CRM 客戶關係',s:'APP-042 · SaaS',t:'核心',tc:'#eef2fb,#3b5bdb'},
   {n:'MES 製造執行',s:'APP-071 · .NET',t:'核心',tc:'#eef2fb,#3b5bdb'},
   {n:'舊版簽核系統',s:'APP-103 · Delphi',t:'待汰',tc:'#fdeaea,#dc2626'}
 ])
 +layer('資料 / 整合層','database',[
   {n:'iPaaS 整合中台',s:'MuleSoft · 47 介面',t:'樞紐',tc:'#fdf3e6,#b45309'},
   {n:'CMDB 組態庫',s:'2,140 CI 項目',t:'運行',tc:'#e7f6ee,#059669'},
   {n:'資料倉儲 DW',s:'雲端資料倉儲',t:'運行',tc:'#e7f6ee,#059669'}
 ])
 +'</div><div class="legend"><span><i class="dotc" style="background:#3b5bdb"></i>核心系統</span>'
 +'<span><i class="dotc" style="background:#059669"></i>運行中</span>'
 +'<span><i class="dotc" style="background:#d97706"></i>重複/待評</span>'
 +'<span><i class="dotc" style="background:#dc2626"></i>待汰換</span></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">hub</span>系統依賴介面數</h3><div id="c1a" class="chart"></div>'
 +'<div class="note"><span class="material-symbols-outlined">warning</span>iPaaS 整合中台 47 介面集中依賴，屬單點風險。</div></div>';
 h+='</div>';
 document.getElementById('app').innerHTML=h;
 void document.getElementById('app').offsetHeight;
 ec('c1a',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},grid:{left:8,right:20,top:14,bottom:8,containLabel:true},
  yAxis:{type:'category',data:['DW 倉儲','CMDB','舊版簽核','MES','CRM','ERP','iPaaS 中台'],axisLabel:{fontSize:11}},
  xAxis:{type:'value',axisLabel:{fontSize:11}},
  series:[{type:'bar',data:[9,12,4,18,21,29,47],barWidth:'56%',
   itemStyle:{color:function(p){return p.dataIndex===6?'#b45309':'#f5b661';},borderRadius:[0,5,5,0]},
   label:{show:true,position:'right',fontSize:11,fontWeight:700}}]});
}

/* SCREEN 2 技術債標註 */
function s2(){
 var debts=[
