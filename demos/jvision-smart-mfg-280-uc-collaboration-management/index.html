<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>統一通訊與協作平台管理 UC & Collaboration Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#15803d;
  --accent2:#4ade80;
  --bg:#f1f5f4;
  --panel:#ffffff;
  --ink:#0f2419;
  --muted:#5b6f66;
  --line:#e2ebe6;
  --side:#0c2e1e;
  --side2:#12432c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
/* sidebar */
.side{
  width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--side),var(--side2));
  color:#dcefe4;padding:22px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;}
.brand .logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#04160d;
}
.brand .logo .material-symbols-outlined{font-size:26px;}
.brand b{font-size:15px;font-weight:800;color:#fff;display:block;line-height:1.3;}
.brand span{font-size:11px;color:#8fbfa4;letter-spacing:.5px;}
.navlist{display:flex;flex-direction:column;gap:4px;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  background:transparent;border:0;color:#bcd8c9;cursor:pointer;text-align:left;
  font-family:inherit;font-size:13.5px;font-weight:600;width:100%;min-width:0;transition:.15s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#1a9a4b);color:#fff;box-shadow:0 6px 16px rgba(21,128,61,.35);}
.sidefoot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#7fae94;line-height:1.6;border-top:1px solid rgba(255,255,255,.08);}
/* main */
.main{flex:1 1 auto;min-width:0;padding:22px 26px 40px;}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.top h1{font-size:21px;margin:0 0 4px;font-weight:800;letter-spacing:-.3px;}
.top p{margin:0;color:var(--muted);font-size:13px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;
}
.chip .material-symbols-outlined{font-size:16px;}
/* grids */
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;
  box-shadow:0 1px 2px rgba(15,36,25,.04);
}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 14px;}
/* kpi */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px;}
.kpi .dt{font-size:11.5px;margin-top:6px;font-weight:700;}
.kpi .dt.up{color:#15803d;}
.kpi .dt.dn{color:#dc2626;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
/* chart */
.chartbox{width:100%;height:260px;overflow:hidden;}
.chartbox.sm{height:210px;}
/* table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f3f8f5;color:#3d5a4b;font-weight:700;font-size:11.5px;letter-spacing:.3px;}
tbody tr:hover{background:#f7fbf9;}
td.num{font-variant-numeric:tabular-nums;font-weight:600;}
/* badges */
.bg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.bg.g{background:#dcfce7;color:#166534;}
.bg.y{background:#fef9c3;color:#854d0e;}
.bg.r{background:#fee2e2;color:#b91c1c;}
.bg.b{background:#dbeafe;color:#1e40af;}
.bg.gray{background:#eef2f0;color:#556b5f;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
/* progress */
.pbar{height:8px;border-radius:999px;background:#e9f0ec;overflow:hidden;min-width:70px;}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#f4f8f6;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,36,25,.04);}
.tk .tt{font-size:12.5px;font-weight:700;margin-bottom:6px;line-height:1.35;}
.tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);}
.tk .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04160d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
/* timeline */
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlitem{position:relative;padding:0 0 16px 14px;}
.tlitem:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tlitem.r:before{border-color:#dc2626;}
.tlitem.y:before{border-color:#d97706;}
.tlitem .tm{font-size:11px;color:var(--muted);font-weight:700;}
.tlitem .tx{font-size:12.5px;margin-top:2px;line-height:1.45;}
/* list rows */
.lr{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0;}
.lr:last-child{border-bottom:0;}
.lr .ic{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:#dcfce7;color:var(--accent);}
.lr .ic .material-symbols-outlined{font-size:20px;}
.lr .mid{min-width:0;flex:1 1 auto;}
.lr .mid b{font-size:13px;display:block;}
.lr .mid span{font-size:11.5px;color:var(--muted);}
.lr .rt{text-align:right;font-size:12.5px;font-weight:800;white-space:nowrap;}
/* gauge row */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-width:0;}
.metric{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#fbfefc;}
.metric .mv{font-size:24px;font-weight:800;}
.metric .ml{font-size:11.5px;color:var(--muted);margin-top:3px;}
.sechead{display:flex;align-items:center;gap:8px;margin:22px 0 12px;font-size:13px;font-weight:800;color:#2c4638;}
.sechead .material-symbols-outlined{font-size:18px;color:var(--accent);}
.mb16{margin-bottom:16px;}
/* responsive */
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:100%;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;}
  .brand{padding:0 12px 0 0;width:auto;}
  .navlist{flex-direction:row;flex-wrap:wrap;gap:6px;}
  .navbtn{width:auto;padding:9px 12px;}
  .sidefoot{display:none;}
  .main{padding:18px 16px 34px;}
}
@media(max-width:820px){
  .g3,.g2,.g23,.g32,.gauges{grid-template-columns:1fr;}
  .g4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .navbtn .nx{display:none;}
  .navbtn{padding:9px;}
  .g4{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .top h1{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div>
        <b>UC Collab 平台</b>
        <span>統一通訊與協作管理</span>
      </div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="sidefoot">
      示範環境 · 假資料<br/>資訊部 / 行政部 / 人資部
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="scrTitle">平台總覽</h1>
        <p id="scrSub">帳號、授權與可用率戰情</p>
      </div>
      <div class="chip"><span class="material-symbols-outlined">verified</span> Demo · 統一通訊平台</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
"use strict";
var NAV=[
  {icon:"dashboard",name:"平台總覽",sub:"帳號、授權與可用率戰情"},
  {icon:"groups",name:"帳號與授權",sub:"帳號開通與授權指派"},
  {icon:"shield",name:"使用政策與 DLP",sub:"使用政策與資料外洩防護"},
  {icon:"monitoring",name:"通話品質監控",sub:"通話品質與平台可用性"},
  {icon:"warning",name:"異常使用告警",sub:"異常使用偵測與升級處理"},
  {icon:"request_quote",name:"授權與成本優化",sub:"授權使用量與成本優化"}
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){
  for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}
  charts=[];
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function ico(n){return '<span class="material-symbols-outlined">'+n+'</span>';}

/* ---- render helpers ---- */
function kpi(lab,icn,val,unit,dt,up){
  return '<div class="kpi"><div class="bar"></div>'+
    '<div class="lab">'+ico(icn)+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="dt '+(up?'up':'dn')+'">'+dt+'</div></div>';
}
function pbar(p){return '<div class="pbar"><i style="width:'+p+'%"></i></div>';}

/* =============== SCREEN 0 : 平台總覽 =============== */
function s0(){
  var html='';
  html+='<div class="grid g4 mb16">'+
    kpi("平台可用率","monitoring","99.94","%","▲ 較上月 +0.12%",true)+
    kpi("啟用帳號數","groups","3,182","","▲ 本月新增 74",true)+
    kpi("授權使用率","task_alt","87.6","%","▲ 回收閒置 42 席",true)+
    kpi("開放告警","warning","6","件","▼ 較昨日 -3",true)+
  '</div>';
  html+='<div class="grid g23 mb16">'+
    '<div class="card"><h3>'+ico("insights")+'各平台可用率與通話品質趨勢</h3>'+
      '<p class="sub">近 8 週 · 可用率(%) 與平均 MOS 分數</p>'+
      '<div id="c0a" class="chartbox"></div></div>'+
    '<div class="card"><h3>'+ico("account_tree")+'授權席次分佈</h3>'+
      '<p class="sub">依通訊平台</p>'+
      '<div id="c0b" class="chartbox"></div></div>'+
  '</div>';
  html+='<div class="grid g32">'+
    '<div class="card"><h3>'+ico("history")+'今日平台事件</h3>'+
      '<p class="sub">跨 IAM / SIEM / ITSM 同步</p>'+
      '<div class="tl">'+
        tli("g","09:12","Teams 語音閘道自動切換備援節點，通話零中斷")+
        tli("y","10:47","偵測研發部大量外部檔案分享，DLP 已攔截 3 筆")+
        tli("g","11:30","批次回收 42 席閒置 Zoom Pro 授權，回寫成本中心")+
        tli("r","13:05","VoIP 東京節點延遲飆升至 180ms，已建立 ITSM 工單")+
        tli("g","14:20","人資新進 18 人帳號自動開通並指派標準授權組")+
      '</div></div>'+
    '<div class="card"><h3>'+ico("groups")+'部門帳號健康度</h3>'+
      '<p class="sub">授權使用率 · 前五部門</p>'+
      deptRows()+
    '</div>'+
  '</div>';
  view.innerHTML=html;
  void view.offsetHeight;
  mkChart("c0a",{
    grid:{left:42,right:42,top:30,bottom:28},
    tooltip:{trigger:"axis"},
    legend:{data:["可用率 %","平均 MOS"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLabel:{fontSize:11}},
    yAxis:[
      {type:"value",min:99,max:100,axisLabel:{fontSize:10,formatter:"{value}%"}},
      {type:"value",min:3.5,max:5,axisLabel:{fontSize:10}}
    ],
    series:[
      {name:"可用率 %",type:"line",smooth:true,data:[99.82,99.88,99.79,99.91,99.86,99.9,99.88,99.94],itemStyle:{color:"#15803d"},areaStyle:{color:"rgba(21,128,61,.12)"}},
      {name:"平均 MOS",type:"line",yAxisIndex:1,smooth:true,data:[4.1,4.2,4.0,4.3,4.25,4.35,4.32,4.41],itemStyle:{color:"#4ade80"}}
    ]
  });
  mkChart("c0b",{
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{
      type:"pie",radius:["45%","70%"],center:["50%","44%"],
      label:{fontSize:11},
      data:[
        {value:1180,name:"Teams",itemStyle:{color:"#15803d"}},
        {value:860,name:"Zoom",itemStyle:{color:"#4ade80"}},
        {value:540,name:"Webex",itemStyle:{color:"#84cc16"}},
        {value:602,name:"VoIP 電話",itemStyle:{color:"#0d9488"}}
      ]
    }]
  });
}
function tli(cls,tm,tx){return '<div class="tlitem '+cls+'"><div class="tm">'+tm+'</div><div class="tx">'+tx+'</div></div>';}
function deptRows(){
  var d=[["資訊部",94,"g"],["行政部",89,"g"],["研發部",78,"y"],["業務部",83,"g"],["人資部",71,"y"]];
  var h='';
  for(var i=0;i<d.length;i++){
    h+='<div class="lr"><div class="ic">'+ico("corporate_fare")+'</div>'+
      '<div class="mid"><b>'+d[i][0]+'</b><span>授權使用率</span></div>'+
      '<div style="flex:1 1 auto;min-width:0">'+pbar(d[i][1])+'</div>'+
      '<div class="rt"><span class="bg '+d[i][2]+'">'+d[i][1]+'%</span></div></div>';
  }
  return h;
}

/* =============== SCREEN 1 : 帳號與授權 =============== */
function s1(){
  var rows=[
    ["EMP-20481","林彥廷","研發部","Teams + Zoom Pro","IAM 已同步","g","啟用"],
    ["EMP-20487","陳品瑄","行政部","Teams 標準","待審核","y","開通中"],
    ["EMP-20492","王柏森","業務部","Webex + VoIP 分機","IAM 已同步","g","啟用"],
    ["EMP-20495","黃于庭","人資部","Teams 標準","IAM 已同步","g","啟用"],
    ["EMP-20501","張哲瑋","資訊部","全模組 E5","已核准待指派","b","指派中"],
    ["EMP-20388","李佳蓉","業務部","Zoom Pro","閒置 62 天","r","建議回收"],
    ["EMP-20355","吳承翰","研發部","Webex","閒置 48 天","r","建議回收"]
  ];
  var tb='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    tb+='<tr><td class="num">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+
      '</td><td><span class="bg gray">'+r[4]+'</span></td>'+
      '<td><span class="bg '+r[5]+'">'+r[6]+'</span></td></tr>';
  }
  var html='';
  html+='<div class="grid g4 mb16">'+
    kpi("本月開通","person_add","74","帳號","▲ 到職 18 人自動化",true)+
    kpi("待審核授權","pending_actions","5","件","▼ SLA 內處理",true)+
    kpi("已指派授權","task_alt","2,788","席","▲ 使用率 87.6%",true)+
    kpi("建議回收","recycling","42","席","可省 NT$ 63K/月",true)+
  '</div>';
  html+='<div class="grid g32 mb16">'+
    '<div class="card"><h3>'+ico("groups")+'帳號與授權工作佇列</h3>'+
      '<p class="sub">與 IAM 群組權限自動同步</p>'+
      '<div class="tw"><table><thead><tr><th>員工編號</th><th>姓名</th><th>部門</th><th>授權組合</th><th>IAM 狀態</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>'+
    '<div class="card"><h3>'+ico("donut_large")+'授權方案佔比</h3>'+
      '<p class="sub">依訂閱層級</p>'+
      '<div id="c1" class="chartbox sm"></div>'+
      '<div class="metric" style="margin-top:6px"><div class="mv">3,182</div><div class="ml">總啟用帳號</div></div></div>'+
  '</div>';
  html+='<div class="card"><h3>'+ico("checklist")+'標準授權組合模板</h3>'+
    '<p class="sub">依角色自動套用（到職觸發）</p>'+
    '<div class="grid g3">'+
      tmpl("行政 / 一般","Teams 標準 · 會議 300 人 · 雲端錄影 10GB","1,240 席")+
      tmpl("業務 / 外勤","Webex + VoIP 分機 · 國際電話 · CRM 整合","640 席")+
      tmpl("研發 / 資訊","E5 全模組 · Zoom Pro · 進階資安","908 席")+
    '</div></div>';
  view.innerHTML=html;
  void view.offsetHeight;
  mkChart("c1",{
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["48%","72%"],center:["50%","42%"],label:{show:false},
      data:[
        {value:1240,name:"標準版",itemStyle:{color:"#4ade80"}},
        {value:908,name:"E5 全模組",itemStyle:{color:"#15803d"}},
        {value:640,name:"Pro 版",itemStyle:{color:"#0d9488"}},
        {value:394,name:"訪客 / 外部",itemStyle:{color:"#a3e635"}}
      ]}]
  });
}
function tmpl(t,d,c){
  return '<div class="card" style="background:#fbfefc"><h3 style="font-size:13px">'+ico("badge")+t+'</h3>'+

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  disposeCharts();
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  }
  document.getElementById("scrTitle").textContent=NAV[i].name;
  document.getElementById("scrSub").textContent=NAV[i].sub;
  SCREENS[i]();
}

/* build nav */
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button class="navbtn" data-i="'+i+'">'+ico(NAV[i].icon)+'<span class="nx">'+NAV[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=+this.getAttribute("data-i");
      location.hash="v"+n;
    });
  }
})();
window.addEventListener("resize",function(){
  for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
