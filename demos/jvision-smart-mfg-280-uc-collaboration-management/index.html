<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>統一通訊與協作平台管理 UC & Collaboration Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --accent:#0D9488;
  --accent2:#14B8A6;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --side:#0D9488;
  --side2:#14B8A6;
  --black:#071F1D;
  --shadow:6px 6px 0 #071F1D;
}
*{box-sizing:border-box;}
html{scroll-behavior:auto;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  font-family:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  background-color:var(--color-background);
  background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;}
button,a,[role="button"]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;align-items:stretch;}
.side{
  position:sticky;
  top:0;
  width:264px;
  height:100vh;
  flex:0 0 264px;
  padding:24px 18px;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
  overflow-y:auto;
  color:var(--black);
  background:var(--color-primary);
  border-right:3px solid var(--black);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 0 20px;
  border-bottom:3px solid var(--black);
}
.brand .logo{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--black);
  background:var(--color-accent);
  border:3px solid var(--black);
  border-radius:0;
  box-shadow:4px 4px 0 var(--black);
}
.brand .logo .material-symbols-outlined{font-size:26px;font-weight:700;}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.25;color:var(--black);}
.brand span{font-size:11px;font-weight:700;letter-spacing:.04em;color:#092F2B;}
.navlist{display:flex;flex-direction:column;gap:8px;}
.navbtn{
  width:100%;
  min-height:46px;
  min-width:0;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  color:var(--black);
  background:#5EEAD4;
  border:2px solid var(--black);
  border-radius:0;
  font-size:13px;
  font-weight:700;
  box-shadow:3px 3px 0 var(--black);
  transition:background-color 160ms ease,color 160ms ease,transform 160ms ease,box-shadow 160ms ease;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:#CCFBF1;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--black);}
.navbtn.on{background:var(--color-accent);color:var(--black);font-weight:800;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black);}
.sidefoot{
  margin-top:auto;
  padding:14px 2px 0;
  border-top:3px solid var(--black);
  color:#092F2B;
  font-size:11px;
  font-weight:700;
  line-height:1.7;
}
.main{flex:1 1 auto;min-width:0;padding:30px clamp(18px,3vw,44px) 48px;}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:24px;
  padding:22px;
  background:var(--color-card);
  border:3px solid var(--black);
  box-shadow:var(--shadow);
}
.top h1{margin:0 0 5px;font-size:clamp(24px,3vw,38px);font-weight:800;letter-spacing:-.045em;line-height:1.05;color:var(--black);}
.top p{margin:0;color:var(--muted);font-size:13px;font-weight:600;}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  color:var(--black);
  background:var(--color-secondary);
  border:2px solid var(--black);
  border-radius:0;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  box-shadow:3px 3px 0 var(--black);
}
.chip .material-symbols-outlined{font-size:17px;}
#view{animation:view-in 350ms ease-out both;}
@keyframes view-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);}
.card{
  min-width:0;
  padding:20px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid var(--black);
  border-radius:0;
  box-shadow:var(--shadow);
}
.card:nth-child(even){box-shadow:-5px 5px 0 var(--color-primary);}
.card h3{margin:0 0 5px;display:flex;align-items:center;gap:9px;color:var(--black);font-size:14px;font-weight:800;line-height:1.35;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary);}
.card .sub{margin:0 0 16px;color:var(--muted);font-size:12px;font-weight:500;line-height:1.55;}
.kpi{
  position:relative;
  min-width:0;
  min-height:148px;
  padding:18px 18px 18px 22px;
  overflow:hidden;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid var(--black);
  border-radius:0;
  box-shadow:5px 5px 0 var(--black);
}
.kpi:nth-child(2n){background:#CCFBF1;}
.kpi:nth-child(3n){background:#FFF7ED;}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700;}
.kpi .lab .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.kpi .val{margin-top:13px;color:var(--black);font-size:clamp(25px,2.5vw,34px);font-weight:800;letter-spacing:-.05em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;}
.kpi .val small{margin-left:5px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0;}
.kpi .dt{margin-top:12px;font-size:11px;font-weight:800;line-height:1.35;}
.kpi .dt.up{color:#06665D;}
.kpi .dt.dn{color:#B91C1C;}
.kpi .bar{position:absolute;inset:0 auto 0 0;width:7px;background:var(--color-accent);border-right:2px solid var(--black);}
.chartbox{width:100%;height:270px;overflow:hidden;}
.chartbox.sm{height:220px;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--black);border-radius:0;}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px;background:#fff;}
th,td{padding:12px 13px;text-align:left;border-right:1px solid #94A3B8;border-bottom:1px solid #94A3B8;white-space:nowrap;}
th:last-child,td:last-child{border-right:0;}
th{
  color:var(--black);
  background:var(--color-secondary);
  border-bottom:3px solid var(--black);
  font-size:11px;
  font-weight:800;
  letter-spacing:.035em;
}
tbody tr:nth-child(even){background:#F0FDFA;}
tbody tr:hover{background:#CCFBF1;}
td.num{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
th:nth-child(n+2):not(:last-child),td:nth-child(n+2):not(:last-child){font-variant-numeric:tabular-nums;}
.bg{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  line-height:1.25;
}
.bg.g{background:#D1FAE5;color:#065F46;}
.bg.y{background:#FEF3C7;color:#854D0E;}
.bg.r{background:#FEE2E2;color:#991B1B;}
.bg.b{background:#DBEAFE;color:#1E3A8A;}
.bg.gray{background:#E2E8F0;color:#334155;}
.dot{width:8px;height:8px;display:inline-block;border:1px solid currentColor;border-radius:0;}
.pbar{height:11px;min-width:70px;overflow:hidden;background:#E2E8F0;border:1px solid var(--black);border-radius:0;}
.pbar i{display:block;height:100%;background:var(--color-primary);border-right:1px solid var(--black);border-radius:0;}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0;}
.col{min-width:0;padding:12px;background:var(--color-muted);border:2px solid var(--black);border-radius:0;}
.col:nth-child(2){background:#CCFBF1;}
.col:nth-child(3){background:#FFF7ED;}
.col:nth-child(4){background:#D1FAE5;}
.col h4{margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;color:var(--black);font-size:12px;font-weight:800;}
.col h4 .cnt{min-width:26px;padding:2px 7px;text-align:center;color:var(--black);background:#fff;border:2px solid var(--black);border-radius:0;font-family:ui-monospace,monospace;font-size:10px;}
.tk{margin-bottom:10px;padding:11px;background:#fff;border:2px solid var(--black);border-radius:0;box-shadow:3px 3px 0 var(--black);}
.tk:last-child{margin-bottom:0;}
.tk .tt{margin-bottom:9px;color:var(--black);font-size:12px;font-weight:700;line-height:1.45;}
.tk .mt{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;font-weight:700;}
.tk .av{width:25px;height:25px;flex:0 0 25px;display:flex;align-items:center;justify-content:center;color:var(--black);background:var(--color-secondary);border:1px solid var(--black);border-radius:0;font-size:10px;font-weight:800;}
.tl{position:relative;padding-left:24px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--black);}
.tlitem{position:relative;padding:0 0 18px 15px;}
.tlitem:last-child{padding-bottom:0;}
.tlitem:before{content:"";position:absolute;left:-22px;top:2px;width:14px;height:14px;background:#fff;border:4px solid var(--color-primary);border-radius:0;}
.tlitem.r:before{border-color:var(--color-destructive);}
.tlitem.y:before{border-color:#B45309;}
.tlitem .tm{color:var(--muted);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:800;}
.tlitem .tx{margin-top:3px;color:var(--color-card-foreground);font-size:12px;font-weight:600;line-height:1.5;}
.lr{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 4px;border-bottom:2px solid var(--line);}
.lr:last-child{border-bottom:0;}
.lr .ic{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;color:var(--black);background:var(--color-secondary);border:2px solid var(--black);border-radius:0;}
.lr .ic .material-symbols-outlined{font-size:20px;}
.lr .mid{min-width:0;flex:1 1 auto;}
.lr .mid b{display:block;color:var(--black);font-size:12px;font-weight:800;}
.lr .mid span{color:var(--muted);font-size:10px;font-weight:600;line-height:1.4;}
.lr .rt{text-align:right;font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0;}
.metric{padding:15px;text-align:center;background:#CCFBF1;border:2px solid var(--black);border-radius:0;box-shadow:3px 3px 0 var(--black);}
.metric .mv{color:var(--black);font-size:23px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.metric .ml{margin-top:5px;color:var(--muted);font-size:10px;font-weight:700;}
.sechead{display:flex;align-items:center;gap:9px;margin:25px 0 13px;color:var(--black);font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;}
.sechead:after{content:"";height:3px;flex:1;background:var(--black);}
.sechead .material-symbols-outlined{font-size:20px;color:var(--color-accent);}
.mb16{margin-bottom:18px;}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{position:relative;width:100%;height:auto;flex:0 0 auto;padding:14px;border-right:0;border-bottom:3px solid var(--black);overflow:visible;}
  .brand{padding:0 0 12px;}
  .navlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .navbtn{justify-content:flex-start;padding:9px;}
  .sidefoot{display:none;}
  .main{padding:22px 16px 38px;}
  .top{padding:18px;}
}
@media(max-width:820px){
  .g3,.g2,.g23,.g32,.gauges{grid-template-columns:1fr;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .card:nth-child(even){box-shadow:5px 5px 0 var(--black);}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .side{padding:12px;}
  .brand .logo{width:42px;height:42px;flex-basis:42px;}
  .navlist{grid-template-columns:repeat(6,minmax(42px,1fr));}
  .navbtn{justify-content:center;min-height:44px;box-shadow:2px 2px 0 var(--black);}
  .navbtn .nx{display:none;}
  .g4{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
  .top{align-items:flex-start;margin-bottom:20px;box-shadow:4px 4px 0 var(--black);}
  .top h1{font-size:25px;}
  .chip{width:100%;justify-content:center;}
  .card{padding:16px;box-shadow:4px 4px 0 var(--black);}
  .kpi{min-height:132px;}
  .chartbox{height:245px;}
  .lr{align-items:flex-start;flex-wrap:wrap;}
  .lr .mid{min-width:140px;}
  .lr .rt{margin-left:auto;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
  #view{animation:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div>
        <b>UC Collab 平台</b>
        <span>統一通訊與協作管理</span>
      </div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="sidefoot">
      示範環境 · 假資料<br/>資訊部 / 行政部 / 人資部
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="scrTitle">平台總覽</h1>
        <p id="scrSub">帳號、授權與可用率戰情</p>
      </div>
      <div class="chip"><span class="material-symbols-outlined">verified</span> Demo · 統一通訊平台</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
"use strict";
var NAV=[
  {icon:"dashboard",name:"平台總覽",sub:"帳號、授權與可用率戰情"},
  {icon:"groups",name:"帳號與授權",sub:"帳號開通與授權指派"},
  {icon:"shield",name:"使用政策與 DLP",sub:"使用政策與資料外洩防護"},
  {icon:"monitoring",name:"通話品質監控",sub:"通話品質與平台可用性"},
  {icon:"warning",name:"異常使用告警",sub:"異常使用偵測與升級處理"},
  {icon:"request_quote",name:"授權與成本優化",sub:"授權使用量與成本優化"}
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){
  for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}
  charts=[];
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function ico(n){return '<span class="material-symbols-outlined">'+n+'</span>';}

/* ---- render helpers ---- */
function kpi(lab,icn,val,unit,dt,up){
  return '<div class="kpi"><div class="bar"></div>'+
    '<div class="lab">'+ico(icn)+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="dt '+(up?'up':'dn')+'">'+dt+'</div></div>';
}
function pbar(p){return '<div class="pbar"><i style="width:'+p+'%"></i></div>';}

/* =============== SCREEN 0 : 平台總覽 =============== */
function s0(){
  var html='';
  html+='<div class="grid g4 mb16">'+
    kpi("平台可用率","monitoring","99.94","%","▲ 較上月 +0.12%",true)+
    kpi("啟用帳號數","groups","3,182","","▲ 本月新增 74",true)+
    kpi("授權使用率","task_alt","87.6","%","▲ 回收閒置 42 席",true)+
    kpi("開放告警","warning","6","件","▼ 較昨日 -3",true)+
  '</div>';
  html+='<div class="grid g23 mb16">'+
    '<div class="card"><h3>'+ico("insights")+'各平台可用率與通話品質趨勢</h3>'+
      '<p class="sub">近 8 週 · 可用率(%) 與平均 MOS 分數</p>'+
      '<div id="c0a" class="chartbox"></div></div>'+
    '<div class="card"><h3>'+ico("account_tree")+'授權席次分佈</h3>'+
      '<p class="sub">依通訊平台</p>'+
      '<div id="c0b" class="chartbox"></div></div>'+
  '</div>';
  html+='<div class="grid g32">'+
    '<div class="card"><h3>'+ico("history")+'今日平台事件</h3>'+
      '<p class="sub">跨 IAM / SIEM / ITSM 同步</p>'+
      '<div class="tl">'+
        tli("g","09:12","協作平台語音閘道自動切換備援節點，通話零中斷")+
        tli("y","10:47","偵測研發部大量外部檔案分享，DLP 已攔截 3 筆")+
        tli("g","11:30","批次回收 42 席閒置視訊平台授權，回寫成本中心")+
        tli("r","13:05","VoIP 東京節點延遲飆升至 180ms，已建立 ITSM 工單")+
        tli("g","14:20","人資新進 18 人帳號自動開通並指派標準授權組")+
      '</div></div>'+
    '<div class="card"><h3>'+ico("groups")+'部門帳號健康度</h3>'+
      '<p class="sub">授權使用率 · 前五部門</p>'+
      deptRows()+
    '</div>'+
  '</div>';
  view.innerHTML=html;
  void view.offsetHeight;
  mkChart("c0a",{
    grid:{left:42,right:42,top:30,bottom:28},
    tooltip:{trigger:"axis"},
    legend:{data:["可用率 %","平均 MOS"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLabel:{fontSize:11}},
    yAxis:[
      {type:"value",min:99,max:100,axisLabel:{fontSize:10,formatter:"{value}%"}},
      {type:"value",min:3.5,max:5,axisLabel:{fontSize:10}}

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  disposeCharts();
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  }
  document.getElementById("scrTitle").textContent=NAV[i].name;
  document.getElementById("scrSub").textContent=NAV[i].sub;
  SCREENS[i]();
}

/* build nav */
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button class="navbtn" data-i="'+i+'">'+ico(NAV[i].icon)+'<span class="nx">'+NAV[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=+this.getAttribute("data-i");
      location.hash="v"+n;
    });
  }
})();
window.addEventListener("resize",function(){
  for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
