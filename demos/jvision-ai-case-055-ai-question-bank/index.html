<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI 題庫弱點教練 · AI Question-Bank Weakness Coach</title>
<meta name="description" content="題庫管理、知識點弱點診斷、AI 個人化出題、錯題本到學習建議與成效追蹤（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#db2777;--accent2:#f472b6;--ink:#2a1220;--bg:#fbf3f8;--card:#fff;--line:#f6d9e8;--soft:#fdeef6;--mut:#8a6178;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* layout: sidebar + main */
.app{display:flex;min-height:100vh}
.side{width:238px;flex:none;background:linear-gradient(180deg,#fff,#fdf2f8);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(219,39,119,.34)}
.logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:900;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:9.5px;color:var(--accent);letter-spacing:2px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 12px}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13.5px;padding:11px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;width:100%;font-family:"Noto Sans TC";position:relative}
.nav button .material-symbols-outlined{font-size:21px}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.3)}
.nav button .badge{margin-left:auto;font-size:10px;font-weight:800;background:#fee2e2;color:#b91c1c;border-radius:999px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.who .av{width:36px;height:36px;border-radius:50%;background:#fbcfe8;color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px;flex:none}
.who small{color:var(--mut);font-size:11px;display:block}
.who b{font-size:12.5px}
/* main */
.main{flex:1;min-width:0}
.wrap{max-width:1240px;margin:0 auto;padding:22px 26px 40px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:23px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:5px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800}
.pill .material-symbols-outlined{font-size:16px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.26}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* grid */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.5fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#fce7f3;color:#be185d}.t-mut{background:#eef2f6;color:#64748b}
/* table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft);text-transform:uppercase;letter-spacing:.03em}
table.data tr:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.chart{width:100%;min-height:60px}
/* stat cards */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.sc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.sc b{display:block;font-size:22px;font-weight:900;color:var(--ink)}
.sc span{font-size:11.5px;color:var(--mut)}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
/* meter rows (掌握度) */
.mtr{display:flex;flex-direction:column;gap:11px}
.mrow{display:flex;align-items:center;gap:12px}
.mrow .nm{width:118px;flex:none;font-size:12.5px;font-weight:700;font-family:"Noto Sans TC"}
.mrow .track{flex:1;height:12px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:0}
.mrow .track i{display:block;height:100%;border-radius:999px}
.mrow .pc{width:44px;flex:none;text-align:right;font-size:12.5px;font-weight:900;font-family:Inter}
.f-ok{background:linear-gradient(90deg,#4ade80,#16a34a)}.f-warn{background:linear-gradient(90deg,#fbbf24,#d97706)}.f-bad{background:linear-gradient(90deg,#fb7185,#dc2626)}
/* question / wrong list */
.qlist{display:flex;flex-direction:column;gap:11px}
.q{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;border-left:4px solid var(--accent)}
.q.bad{border-left-color:var(--bad);background:#fffafb}
.q.warn{border-left-color:var(--warn)}
.q .qh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.q .qid{font-size:11px;font-weight:800;color:var(--accent);background:var(--soft);border-radius:7px;padding:2px 8px;font-family:Inter}
.q .qt{font-size:13px;font-weight:700;color:var(--ink);font-family:"Noto Sans TC";flex:1;min-width:0}
.q .qm{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.q .qm b{color:var(--ink)}
/* practice question preview */
.qp{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:linear-gradient(180deg,#fff,#fdf2f8)}
.qp .stem{font-size:14px;font-weight:700;font-family:"Noto Sans TC";line-height:1.7;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.opt{border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13px;background:#fff;display:flex;gap:9px;align-items:center}
.opt.correct{border-color:#4ade80;background:#f0fdf4}
.opt.wrong{border-color:#fca5a5;background:#fef2f2}
.opt .k{width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:12px;flex:none}
.opt.correct .k{background:#16a34a;color:#fff}.opt.wrong .k{background:#dc2626;color:#fff}
/* suggestion cards */
.sug{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}.sug:first-of-type{border-top:0}
.sug .bx{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sug .in{min-width:0;flex:1}.sug .in b{font-size:13.5px;font-family:"Noto Sans TC";display:block}.sug .in small{color:var(--mut);font-size:12px;line-height:1.6;display:block;margin-top:3px}
.chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap;flex:none}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--mut)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff;font-family:"Noto Sans TC"}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #fbcfe8}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
/* student roster */
.stu{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}.stu:first-of-type{border-top:0}
.stu .av{width:38px;height:38px;border-radius:11px;background:#fbcfe8;color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none;font-size:13px}
.stu .in{flex:1;min-width:0}.stu .in b{font-size:13.5px}.stu .in small{display:block;color:var(--mut);font-size:11.5px}
.stu .mini{width:120px;flex:none}
.stu .mini .track{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.stu .mini .track i{display:block;height:100%}
.stu .mini small{font-size:10.5px;color:var(--mut);display:block;margin-bottom:3px}
@media(max-width:860px){
 .app{flex-direction:column}
 .side{width:auto;position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow:visible;z-index:20;border-right:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
 .brand{padding:12px 16px}
 .nav{flex-direction:row;flex-wrap:wrap;padding:0 12px 10px;gap:4px;margin-left:auto;width:100%}
 .nav button{width:auto;padding:9px 11px}
 .nav button .badge{margin-left:4px}
 .who{margin:0;border-top:0;padding:12px 16px}
}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.kpis{grid-template-columns:1fr 1fr}.nav button span:not(.material-symbols-outlined){display:none}.who{display:none}.mrow .nm{width:88px}.stu .mini{width:82px}}
</style>
</head>

  <nav class="nav" id="nav"></nav>

</div>
<script>
var MOD=[

// 學生名冊：名, 班級, 掌握%, 弱點, 等級
var STU=[["林曉彤","301","46","一元二次方程式","bad"],["王柏翔","301","72","幾何證明","ok"],["張家瑜","301","58","因式分解","warn"],["李承恩","301","39","一元二次方程式","bad"],["黃詩涵","301","81","—","ok"],["吳宗翰","301","64","三角函數","warn"]];

var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
nav.innerHTML=MOD.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>'+(m[4]?'<span class="badge">'+m[4]+'</span>':'')+'</button>';}).join('');

var fillCls={ok:'f-ok',warn:'f-warn',bad:'f-bad'};
var tagCls={ok:'t-ok',warn:'t-warn',bad:'t-bad'};

function kpiRow(){
 var k=[["insights","班級平均掌握度","61","%",'▲ 較上週 +4%','up'],["radar","高風險弱點知識點","3","項",'一元二次為首','dn'],["task_alt","本週練習正確率","73","%",'▲ 較 66%','up'],["menu_book","待複習錯題","42","題",'再測通過 68%','up']];
 return '<div class="kpis">'+k.map(function(x){return '<div class="kpi"><span class="material-symbols-outlined ic">'+x[0]+'</span><div class="l">'+x[1]+'</div><div class="v">'+x[2]+'<small> '+x[3]+'</small></div><div class="d '+x[5]+'">'+x[4]+'</div></div>';}).join('')+'</div>';

function meterRows(list){return '<div class="mtr">'+list.map(function(x){return '<div class="mrow"><span class="nm">'+x[0]+'</span><div class="track"><i class="'+fillCls[x[2]]+'" style="width:'+x[1]+'%"></i></div><span class="pc">'+x[1]+'%</span></div>';}).join('')+'</div>';}

var SCREENS=[

function(){return kpiRow()+
 '<div class="grid g2">'+
 '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 6 週練習正確率趨勢</h3><div class="chart" id="c_trend" style="height:270px"></div></div>'+

 '<div class="stat" style="margin-top:6px"><div class="sc"><b>1,284</b><span>本週作答</span></div><div class="sc"><b>73%</b><span>正確率</span></div><div class="sc"><b>42</b><span>錯題待複習</span></div></div></div>'+
 '</div>'+
 '<div class="grid g21" style="margin-top:16px">'+

 '<div class="card"><h3><span class="material-symbols-outlined">warning</span>需優先補強弱點</h3>'+
 meterRows(KP.slice().sort(function(a,b){return a[1]-b[1];}))+
 '<p class="note">依全班掌握度由低至高排序，紅色為高風險弱點，建議優先安排補救教學。</p></div>'+
 '</div>';},
// 1 題庫管理
function(){return '<div class="grid g21">'+
 '<div class="card"><h3><span class="material-symbols-outlined">quiz</span>題庫清單 · 國三數學<span class="grow">共 486 題</span></h3>'+
 '<div class="scroll"><table class="data"><thead><tr><th>題號</th><th>題目摘要</th><th>知識點</th><th>難度</th><th>鑑別度</th><th>使用率</th></tr></thead><tbody>'+
 QB.map(function(q){var dc=q[3]==='難'?'t-bad':q[3]==='中'?'t-warn':'t-ok';return '<tr><td><b>'+q[0]+'</b></td><td>'+q[1]+'</td><td>'+q[2]+'</td><td><span class="tag '+dc+'">'+q[3]+'</span></td><td>'+q[4]+'</td><td>'+q[5]+'</td></tr>';}).join('')+

function show(i){
 nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
