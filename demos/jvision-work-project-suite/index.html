<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>工作與專案協作套件 · 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0b1220; --panel:#101a2e; --panel2:#0e1728; --line:#1e2c47;
  --accent:#0369a1; --accent2:#38bdf8; --txt:#e6edf7; --mut:#8ba0bf;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --pur:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%,rgba(56,189,248,.12),transparent 60%),var(--bg);
  color:var(--txt);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  min-height:100vh;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none}

.nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;
  background:rgba(9,15,26,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:14px;min-width:0}
.brand .logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 4px 14px rgba(3,105,161,.5);
}
.brand b{font-family:"Noto Sans TC";font-size:15px;letter-spacing:.5px;white-space:nowrap}
.brand span{font-size:11px;color:var(--mut);display:block}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.nbtn{
  display:flex;align-items:center;gap:7px;
  padding:8px 12px;border-radius:9px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--mut);
  font-family:"Noto Sans TC";font-size:13px;font-weight:500;
}
.nbtn .material-symbols-outlined{font-size:19px}
.nbtn:hover{background:var(--panel);color:var(--txt)}
.nbtn.on{background:linear-gradient(135deg,rgba(3,105,161,.35),rgba(56,189,248,.18));border-color:var(--accent);color:#fff}
.navstat{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.head{margin-bottom:18px}
.head h1{font-family:"Noto Sans TC";font-size:22px;font-weight:900;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.head h1 .material-symbols-outlined{color:var(--accent2);font-size:26px}
.head p{margin:0;color:var(--mut);font-size:13px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.kanban{grid-template-columns:repeat(4,1fr)}
.wl{grid-template-columns:1.3fr 1fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32,.kanban,.wl{grid-template-columns:1fr}
}

.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-family:"Noto Sans TC";font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.sub{color:var(--mut);font-size:12px;font-weight:400;margin-left:auto}

.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.16),transparent 70%)}
.kpi .lbl{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:28px;font-weight:800;margin:6px 0 2px;font-family:"Inter"}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .delta{font-size:12px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}

.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}

.tw{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;font-family:"Noto Sans TC"}
td{color:var(--txt)}
tbody tr:hover{background:rgba(56,189,248,.06)}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.t-ok{background:rgba(34,197,94,.15);color:#4ade80}
.t-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.t-bad{background:rgba(239,68,68,.15);color:#f87171}
.t-info{background:rgba(56,189,248,.15);color:#7dd3fc}
.t-pur{background:rgba(167,139,250,.15);color:#c4b5fd}

.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col .colhd{display:flex;align-items:center;gap:7px;font-family:"Noto Sans TC";font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col .cnt{margin-left:auto;background:var(--panel);color:var(--mut);border-radius:20px;padding:1px 8px;font-size:11px}
.ktick{width:9px;height:9px;border-radius:3px;flex:none}
.task{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px}
.task .tt{font-size:13px;font-weight:600;font-family:"Noto Sans TC";margin-bottom:6px;line-height:1.35}
.task .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.chip{padding:1px 7px;border-radius:6px;font-size:10px;font-weight:600}

.gan{overflow-x:auto}
.ganin{min-width:640px}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.gname{font-size:12px;font-family:"Noto Sans TC"}
.gtrack{position:relative;height:22px;background:var(--panel2);border-radius:6px}
.gbar{position:absolute;top:3px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;font-weight:600;overflow:hidden}
.gbar.done{background:linear-gradient(90deg,#166534,#22c55e)}
.gbar.risk{background:linear-gradient(90deg,#b45309,#f59e0b)}
.gmile{position:absolute;top:1px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--pur)}
.gaxis{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:6px}
.gaxis .qs{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}

.wlrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.wlrow .nm{width:96px;font-size:12px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex:none}
.wlrow .track{flex:1;height:20px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:0;display:flex}
.wlrow .track i{display:block;height:100%}
.wlrow .pct{width:52px;text-align:right;font-size:12px;font-weight:700;flex:none}

.ruleitem{display:flex;align-items:flex-start;gap:11px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:var(--panel2)}
.ruleitem .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.ruleitem .body{flex:1;min-width:0}
.ruleitem .rt{font-size:13px;font-weight:700;font-family:"Noto Sans TC";display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ruleitem .rd{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.flowline{font-size:11px;color:var(--accent2);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.flowline .material-symbols-outlined{font-size:14px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px}
.sw{position:relative;width:38px;height:22px;border-radius:20px;background:var(--accent);flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.off{background:var(--line)}
.sw.off::after{right:auto;left:3px}

.audit{font-size:12px;color:var(--mut);display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.audit .tm{color:var(--accent2);font-family:"Inter";flex:none;font-size:11px;padding-top:1px}
.audit b{color:var(--txt);font-weight:600}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.ld{width:10px;height:10px;border-radius:3px;flex:none}

.foot{margin-top:26px;text-align:center;color:var(--mut);font-size:11px}

@media(max-width:560px){
  .nbtn span.txt{display:none}
  .nbtn{padding:8px 9px}
  .brand span{display:none}
  .navstat span.stxt{display:none}
}
</style>
</head>
<body>
<div class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">hub</span></div>
    <div><b>工作與專案協作套件</b><span>Work &amp; Project Suite · 控制台</span></div>
  </div>
  <div class="navbtns" id="nav"></div>
  <div class="navstat"><span class="dot"></span><span class="stxt">即時同步 · 12 位在線</span></div>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端），畫面與資料皆為擬真示範。/demos/jvision-work-project-suite/</div>
</div>

<script>
"use strict";

var SCREENS=[
  {icon:"dashboard",label:"協作總覽"},
  {icon:"checklist",label:"任務看板"},
  {icon:"account_tree",label:"專案排程"},
  {icon:"groups",label:"工作負荷"},
  {icon:"bolt",label:"流程自動化"},
  {icon:"insights",label:"工作報表"}
];

var app=document.getElementById("app");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function axisLight(){
  return {axisLine:{lineStyle:{color:"#3a4d6e"}},axisLabel:{color:"#8ba0bf",fontSize:11},splitLine:{lineStyle:{color:"#1e2c47"}}};
}
function kpiMini(ic,l,v){
  return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="val" style="font-size:22px">'+v+'</div></div>';
}

// ============ SCREEN 0 : 協作總覽 ============
function s0(){
  var kpis=[
    {ic:"task_alt",lbl:"進行中任務",val:"142",d:"+8 本週",cls:"up"},
    {ic:"warning",lbl:"逾期項目",val:"9",d:"-3 較上週",cls:"up"},
    {ic:"schedule",lbl:"任務準時率",val:"88",u:"%",d:"+4 pt",cls:"up"},
    {ic:"groups",lbl:"活躍成員",val:"38",u:"/45",d:"84% 參與",cls:"up"}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    kh+='<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lbl+'</div>'
      +'<div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'
      +'<div class="delta '+k.cls+'">'+k.d+'</div></div>';
  }
  var proj=[
    {n:"新版官網改版",pm:"陳怡君",pr:78,st:"進行中",cls:"t-info",due:"08/29"},
    {n:"ERP 導入第二期",pm:"林承翰",pr:45,st:"風險",cls:"t-warn",due:"09/15"},
    {n:"客服知識庫建置",pm:"王雅雯",pr:92,st:"審查中",cls:"t-pur",due:"08/18"},
    {n:"行動 App 2.0",pm:"張家豪",pr:30,st:"逾期",cls:"t-bad",due:"08/10"},
    {n:"年度稽核準備",pm:"李孟樺",pr:64,st:"進行中",cls:"t-info",due:"09/02"}
  ];
  var pr="";
  for(var j=0;j<proj.length;j++){var p=proj[j];
    pr+='<tr><td style="font-family:Noto Sans TC">'+esc(p.n)+'</td><td>'+esc(p.pm)+'</td>'
      +'<td style="min-width:120px"><div style="font-size:11px;color:var(--mut)">'+p.pr+'%</div><div class="bar"><i style="width:'+p.pr+'%"></i></div></td>'
      +'<td><span class="tag '+p.cls+'">'+p.st+'</span></td><td>'+p.due+'</td></tr>';
  }
  app.innerHTML=
    '<div class="head"><h1><span class="material-symbols-outlined">dashboard</span>協作總覽</h1><p>跨團隊即時指標、專案健康度與待辦焦點一覽</p></div>'
    +'<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'
    +'<div class="grid g23">'
      +'<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各團隊每週任務吞吐<span class="sub">已完成 vs 新增</span></h3><div id="c0a" class="chart"></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>任務狀態分布</h3><div id="c0b" class="chart"></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">folder_managed</span>重點專案進度<span class="sub">Top 5</span></h3>'
      +'<div class="tw"><table><thead><tr><th>專案</th><th>PM</th><th>進度</th><th>狀態</th><th>期限</th></tr></thead><tbody>'+pr+'</tbody></table></div></div>';
  void app.offsetHeight;
  mkChart("c0a",{
    tooltip:{trigger:"axis"},grid:{left:38,right:14,top:34,bottom:26},
    legend:{data:["已完成","新增"],textStyle:{color:"#8ba0bf"},top:0},
    xAxis:Object.assign({type:"category",data:["設計","前端","後端","QA","營運"]},axisLight()),
    yAxis:Object.assign({type:"value"},axisLight()),
    series:[
      {name:"已完成",type:"bar",data:[42,58,51,33,27],itemStyle:{color:"#22c55e",borderRadius:[4,4,0,0]}},
      {name:"新增",type:"bar",data:[18,24,29,15,12],itemStyle:{color:"#38bdf8",borderRadius:[4,4,0,0]}}
    ]
  });
  mkChart("c0b",{
    tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#8ba0bf"}},
    series:[{type:"pie",radius:["48%","72%"],center:["50%","44%"],
      label:{color:"#e6edf7",fontSize:11},
      data:[
        {value:64,name:"待辦",itemStyle:{color:"#8ba0bf"}},
        {value:142,name:"進行中",itemStyle:{color:"#38bdf8"}},
        {value:31,name:"審查中",itemStyle:{color:"#a78bfa"}},
        {value:9,name:"逾期",itemStyle:{color:"#ef4444"}}
      ]}]
  });
}

// ============ SCREEN 1 : 任務看板 ============
function s1(){
  var cols=[
    {t:"待辦",c:"#8ba0bf",items:[
      {tt:"整理需求訪談紀錄",who:"KY",clr:"#0369a1",lb:"文件",lc:"t-info",dt:"08/16"},
      {tt:"設計登入頁 wireframe",who:"CH",clr:"#a78bfa",lb:"設計",lc:"t-pur",dt:"08/18"},
      {tt:"建立測試資料集",who:"LW",clr:"#14b8a6",lb:"QA",lc:"t-ok",dt:"08/20"}
    ]},
    {t:"進行中",c:"#38bdf8",items:[
      {tt:"實作 API 權限中介層",who:"CH",clr:"#0369a1",lb:"後端",lc:"t-info",dt:"08/17"},
      {tt:"看板拖曳互動優化",who:"JH",clr:"#f59e0b",lb:"前端",lc:"t-warn",dt:"08/19"}
    ]},
    {t:"審查中",c:"#a78bfa",items:[
      {tt:"通知中心 UI 走查",who:"YW",clr:"#a78bfa",lb:"設計",lc:"t-pur",dt:"08/15"},
      {tt:"報表匯出效能檢查",who:"MH",clr:"#14b8a6",lb:"QA",lc:"t-ok",dt:"08/16"}
    ]},
    {t:"完成",c:"#22c55e",items:[
      {tt:"專案儀表板初版",who:"KY",clr:"#0369a1",lb:"前端",lc:"t-info",dt:"08/12"},
      {tt:"資料庫遷移腳本",who:"CH",clr:"#0369a1",lb:"後端",lc:"t-info",dt:"08/11"},
      {tt:"角色權限設計稿",who:"CH",clr:"#a78bfa",lb:"設計",lc:"t-pur",dt:"08/10"}
    ]}
  ];
  var h="";
  for(var i=0;i<cols.length;i++){var col=cols[i];
    var cards="";
    for(var j=0;j<col.items.length;j++){var it=col.items[j];
      cards+='<div class="task"><div class="tt">'+esc(it.tt)+'</div><div class="meta">'
        +'<span class="av" style="background:'+it.clr+'">'+it.who+'</span>'
        +'<span class="chip '+it.lc+'">'+it.lb+'</span>'
        +'<span style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:13px">event</span> '+it.dt+'</span>'
        +'</div></div>';
    }
    h+='<div class="col"><div class="colhd"><span class="ktick" style="background:'+col.c+'"></span>'+col.t
      +'<span class="cnt">'+col.items.length+'</span></div>'+cards+'</div>';
  }
  app.innerHTML=
    '<div class="head"><h1><span class="material-symbols-outlined">checklist</span>任務看板</h1><p>「新版官網改版」專案 · 依狀態流轉任務、指派負責人與標籤</p></div>'
    +'<div class="grid g4" style="margin-bottom:14px">'
      +kpiMini("view_column","看板任務","10")+kpiMini("hourglass_top","平均停留","1.8 天")
      +kpiMini("swap_horiz","本週流轉","27 次")+kpiMini("verified","完成率","72%")
    +'</div>'
    +'<div class="grid kanban">'+h+'</div>';
}

// ============ SCREEN 2 : 專案排程 (gantt) ============
function s2(){
  var rows=[
    {n:"需求與訪談",s:0,e:16,cls:"done",lbl:"完成"},
    {n:"UX / 視覺設計",s:12,e:34,cls:"done",lbl:"完成"},
    {n:"前端開發",s:30,e:64,cls:"",lbl:"進行 62%"},
    {n:"後端 / API",s:34,e:70,cls:"",lbl:"進行 55%"},
    {n:"系統整合測試",s:60,e:84,cls:"risk",lbl:"排程風險"},
    {n:"UAT 使用者驗收",s:78,e:92,cls:"",lbl:"待啟動"},
    {n:"上線與交付",s:90,e:100,cls:"",lbl:"待啟動"}
  ];
  var miles=[{p:34,n:"設計凍結"},{p:70,n:"功能凍結"},{p:100,n:"正式上線"}];
  var gr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    var w=r.e-r.s;
    gr+='<div class="grow"><div class="gname">'+esc(r.n)+'</div><div class="gtrack">'
      +'<div class="gbar '+r.cls+'" style="left:'+r.s+'%;width:'+w+'%">'+esc(r.lbl)+'</div>';
    for(var m=0;m<miles.length;m++){

var RENDER=[s0,s1,s2,s3,s4,s5];

function buildNav(){
  var h="";
  for(var i=0;i<SCREENS.length;i++){
    h+='<div class="nbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span><span class="txt">'+SCREENS[i].label+'</span></div>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=+this.getAttribute("data-i");
      location.hash="v"+n;
    });
  }
}

function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].className="nbtn"+(+btns[b].getAttribute("data-i")===i?" on":"");
  }
  (RENDER[i]||RENDER[0])();
}

buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
