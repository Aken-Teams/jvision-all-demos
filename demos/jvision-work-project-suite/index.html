<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>工作與專案協作套件 · 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:var(--color-muted);
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --ok:#15803D;
  --warn:#B45309;
  --bad:var(--color-destructive);
  --pur:#7E22CE;
  --shadow:6px 6px 0 #134E4A;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--txt);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
button{color:inherit}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

:where(a,button,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--color-card);
}

.nav{
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:stretch;
  gap:0;
  padding:0;
  background:var(--color-card);
  border-bottom:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:10px 16px;
  background:var(--ink);
  color:#fff;
  border-right:3px solid var(--ink);
}
.brand .logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #fff;
  border-radius:0;
  box-shadow:4px 4px 0 var(--color-secondary);
}
.brand b{
  display:block;
  font-size:15px;
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  color:#CCFBF1;
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.navbtns{
  display:flex;
  align-items:stretch;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nbtn{
  min-width:max-content;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 12px;
  border:0;
  border-right:1px solid var(--line);
  border-radius:0;
  background:var(--color-card);
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  transition:background-color 180ms ease,color 180ms ease,transform 180ms ease;
}
.nbtn .material-symbols-outlined{font-size:19px}
.nbtn:hover{background:#CCFBF1;color:var(--ink)}
.nbtn.on{
  position:relative;
  background:var(--color-primary);
  color:#061B19;
}
.nbtn.on::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  height:5px;
  background:var(--color-accent);
}
.navstat{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 16px;
  color:var(--ink);
  background:#CCFBF1;
  border-left:3px solid var(--ink);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.dot{
  width:11px;
  height:11px;
  flex:none;
  background:var(--ok);
  border:2px solid var(--ink);
  border-radius:0;
}

.wrap{max-width:1440px;margin:0 auto;padding:30px 22px 64px}
.head{
  position:relative;
  margin:0 0 22px;
  padding:22px 24px 20px;
  background:var(--color-primary);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.head::after{
  content:"WORKSPACE / LIVE";
  position:absolute;
  top:0;
  right:0;
  padding:5px 10px;
  color:#fff;
  background:var(--ink);
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
}
.head h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 5px;
  color:#061B19;
  font-size:clamp(24px,3vw,38px);
  font-weight:800;
  letter-spacing:-.045em;
  line-height:1.1;
}
.head h1 .material-symbols-outlined{
  display:grid;
  width:42px;
  height:42px;
  place-items:center;
  color:#fff;
  background:var(--ink);
  font-size:25px;
  border:2px solid #fff;
}
.head p{max-width:760px;margin:0;color:#092F2B;font-size:13px;font-weight:600}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.kanban{grid-template-columns:repeat(4,minmax(220px,1fr))}
.wl{grid-template-columns:1.3fr 1fr}

.card,.kpi,.col,.task,.ruleitem{
  border-radius:0;
  transition:background-color 180ms ease,transform 180ms ease,box-shadow 180ms ease;
}
.card{
  min-width:0;
  padding:16px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--line);
}
.card:hover{box-shadow:6px 6px 0 var(--color-secondary)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:-16px -16px 14px;
  padding:10px 12px;
  color:var(--ink);
  background:var(--color-muted);
  border-bottom:2px solid var(--ink);
  font-size:13px;
  font-weight:800;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{
  display:grid;
  width:27px;
  height:27px;
  place-items:center;
  color:#fff;
  background:var(--ink);
  font-size:17px;
}
.sub{
  margin-left:auto;
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
}

.kpi{
  position:relative;
  min-width:0;
  min-height:126px;
  padding:14px 15px 13px;
  overflow:hidden;
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-secondary);
}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:24px;
  height:24px;
  background:var(--color-accent);
  border-bottom:2px solid var(--ink);
  border-left:2px solid var(--ink);
}
.kpi::after{display:none}
.kpi:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--color-accent)}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:6px;
  padding-right:20px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .val{
  margin:7px 0 1px;
  color:var(--ink);
  font-family:"Plus Jakarta Sans",sans-serif;
  font-size:30px;
  font-weight:800;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.055em;
  line-height:1.15;
}
.kpi .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0}
.kpi .delta{font-size:11px;font-weight:800}
.up::before{content:"↑ ";font-family:var(--mono)}
.down::before{content:"↓ ";font-family:var(--mono)}
.up{color:#166534}
.down{color:var(--bad)}

.chart{width:100%;height:280px;overflow:hidden;background:#fff}
.chart.sm{height:230px}
.tw{overflow-x:auto;border:2px solid var(--ink);border-radius:0}
table{width:100%;min-width:0;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums lining-nums}
th,td{padding:9px 10px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{
  color:#fff;
  background:var(--ink);
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
}
td{color:var(--ink);background:#fff}
tbody tr:nth-child(even) td{background:#F0FDFA}
tbody tr:hover td{background:#CCFBF1}
td:nth-last-child(-n+2){font-variant-numeric:tabular-nums}

.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  line-height:1.25;
}
.tag::before{content:"";width:6px;height:6px;flex:none;background:currentColor;border:1px solid var(--ink)}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#115E59;background:#CCFBF1}
.t-pur{color:#6B21A8;background:#F3E8FF}

.bar{height:9px;margin-top:5px;overflow:hidden;background:#D7E4E8;border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-right:1px solid var(--ink);border-radius:0}

.col{
  min-width:0;
  padding:10px;
  background:#DDF8F3;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--line);
}
.col .colhd{
  display:flex;
  align-items:center;
  gap:7px;
  margin:-10px -10px 10px;
  padding:9px 10px;
  color:#fff;
  background:var(--ink);
  border-bottom:2px solid var(--ink);
  font-size:12px;
  font-weight:800;
}
.col .cnt{
  margin-left:auto;
  padding:1px 7px;
  color:var(--ink);
  background:var(--color-secondary);
  border:1px solid #fff;
  border-radius:0;
  font-family:var(--mono);
  font-size:10px;
}
.ktick{width:10px;height:10px;flex:none;border:1px solid #fff;border-radius:0}
.task{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:1px solid var(--ink);
  box-shadow:2px 2px 0 var(--line);
}
.task:last-child{margin-bottom:0}
.task:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--color-accent)}
.task .tt{margin-bottom:7px;color:var(--ink);font-size:12px;font-weight:800;line-height:1.4}
.task .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-family:var(--mono);font-size:10px}
.av{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  border:1px solid var(--ink);
  border-radius:0;
  font-family:var(--mono);
  font-size:9px;
  font-weight:800;
}
.chip{padding:2px 6px;border:1px solid currentColor;border-radius:0;font-size:9px;font-weight:800}

.gan{overflow-x:auto}
.ganin{min-width:640px}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.gname{color:var(--ink);font-size:11px;font-weight:700}
.gtrack{position:relative;height:24px;background:#D7E4E8;border:1px solid var(--ink);border-radius:0}
.gbar{
  position:absolute;
  top:3px;
  height:16px;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding:0 6px;
  color:#061B19;
  background:var(--color-secondary);
  border-right:2px solid var(--ink);
  border-radius:0;
  font-family:var(--mono);
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
}
.gbar.done{color:#fff;background:#15803D}
.gbar.risk{color:#111827;background:#F59E0B}
.gmile{position:absolute;top:-4px;width:13px;height:13px;background:var(--pur);border:2px solid var(--ink);transform:rotate(45deg)}
.gaxis{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:5px}
.gaxis .qs{display:flex;justify-content:space-between;color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:700}

.wlrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.wlrow .nm{width:98px;display:flex;align-items:center;gap:7px;flex:none;color:var(--ink);font-size:11px;font-weight:700}
.wlrow .track{display:flex;flex:1;min-width:0;height:20px;overflow:hidden;background:#D7E4E8;border:1px solid var(--ink);border-radius:0}
.wlrow .track i{display:block;height:100%;border-right:2px solid var(--ink)}
.wlrow .pct{width:52px;flex:none;text-align:right;font-family:var(--mono);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}

.ruleitem{
  display:flex;
  align-items:flex-start;
  gap:11px;
  margin-bottom:10px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--line);
}
.ruleitem .ico{width:38px;height:38px;display:grid;place-items:center;flex:none;color:#fff;border:2px solid var(--ink);border-radius:0}
.ruleitem .body{flex:1;min-width:0}
.ruleitem .rt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink);font-size:12px;font-weight:800}
.ruleitem .rd{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.55}
.flowline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:7px;color:var(--color-primary);font-size:10px;font-weight:700}
.flowline .material-symbols-outlined{font-size:13px}
.pill{padding:2px 6px;color:var(--ink);background:#CCFBF1;border:1px solid var(--ink);border-radius:0;font-family:var(--mono);font-size:9px}
.sw{position:relative;width:40px;height:23px;flex:none;background:var(--color-primary);border:2px solid var(--ink);border-radius:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:13px;height:13px;background:#fff;border:1px solid var(--ink);border-radius:0}
.sw.off{background:#CBD5E1}
.sw.off::after{right:auto;left:3px}

.audit{display:flex;align-items:flex-start;gap:9px;padding:9px 0;color:var(--muted);border-bottom:1px dashed var(--ink);font-size:11px}
.audit .tm{flex:none;padding-top:1px;color:#115E59;font-family:var(--mono);font-size:10px;font-weight:800}
.audit b{color:var(--ink);font-weight:800}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10px;font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.ld{width:11px;height:11px;flex:none;border:1px solid var(--ink);border-radius:0}
.foot{margin-top:28px;padding:10px;color:var(--muted);background:rgba(255,255,255,.8);border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;text-align:center}

.grid>*{animation:grid-enter 400ms cubic-bezier(.2,1.35,.45,1) both}
.grid>*:nth-child(2){animation-delay:60ms}
.grid>*:nth-child(3){animation-delay:120ms}
.grid>*:nth-child(4){animation-delay:180ms}
@keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}

@media(max-width:1024px){
  .nav{grid-template-columns:auto minmax(0,1fr)}
  .navstat{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32,.wl{grid-template-columns:1fr}
}
@media(max-width:768px){
  .nav{grid-template-columns:1fr}
  .brand{padding:9px 14px;border-right:0;border-bottom:2px solid var(--ink)}
  .brand .logo{width:36px;height:36px}
  .navbtns{border-top:0}
  .nbtn{min-height:50px;flex:1;padding:8px 11px}
  .wrap{padding:20px 14px 50px}
  .head{padding:18px 16px 16px}
  .head::after{font-size:8px}
  .g2,.g3{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(4,minmax(220px,1fr));overflow-x:auto;padding-bottom:7px}
}
@media(max-width:560px){
  .brand span:not(.material-symbols-outlined){display:none}
  .brand b{white-space:normal}
  .nbtn{min-width:48px}
  .nbtn span.txt{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{min-height:112px;padding:12px}
  .kpi .val{font-size:25px}
  .card{padding:13px}
  .card h3{margin:-13px -13px 12px}
  .head h1{padding-right:42px;font-size:25px}
  .head p{font-size:12px}
  .chart{height:250px}
  .chart.sm{height:220px}
}
@media(max-width:390px){
  .wrap{padding-right:10px;padding-left:10px}
  .g4{grid-template-columns:1fr 1fr}
  .kpi .lbl{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">hub</span></div>
    <div><b>工作與專案協作套件</b><span>Work &amp; Project Suite · 控制台</span></div>
  </div>
  <div class="navbtns" id="nav"></div>
  <div class="navstat"><span class="dot"></span><span class="stxt">即時同步 · 12 位在線</span></div>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端），畫面與資料皆為擬真示範。/demos/jvision-work-project-suite/</div>
</div>

<script>
"use strict";

var SCREENS=[
  {icon:"dashboard",label:"協作總覽"},
  {icon:"checklist",label:"任務看板"},
  {icon:"account_tree",label:"專案排程"},
  {icon:"groups",label:"工作負荷"},
  {icon:"bolt",label:"流程自動化"},
  {icon:"insights",label:"工作報表"}
];

var app=document.getElementById("app");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function axisLight(){
  return {axisLine:{lineStyle:{color:"#3a4d6e"}},axisLabel:{color:"#8ba0bf",fontSize:11},splitLine:{lineStyle:{color:"#1e2c47"}}};
}
function kpiMini(ic,l,v){
  return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="val" style="font-size:22px">'+v+'</div></div>';
}

// ============ SCREEN 0 : 協作總覽 ============
function s0(){
  var kpis=[

var RENDER=[s0,s1,s2,s3,s4,s5];

function buildNav(){
  var h="";
  for(var i=0;i<SCREENS.length;i++){
    h+='<button type="button" class="nbtn" data-i="'+i+'"><span class="material-symbols-outlined" aria-hidden="true">'+SCREENS[i].icon+'</span><span class="txt">'+SCREENS[i].label+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var n=+this.getAttribute("data-i");
      location.hash="v"+n;
    });
  }
}

function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].className="nbtn"+(+btns[b].getAttribute("data-i")===i?" on":"");
  }
  (RENDER[i]||RENDER[0])();
}

buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
