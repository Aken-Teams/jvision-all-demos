<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3PL 委外倉對帳與績效管理 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#f0fdf4;
  --track:#e2e8f0;
  --sidebar:#1e293b;
  --sidebar2:#334155;
  --side-edge:#475569;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#334155;
  --r:10px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font:400 14px/1.55 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  font-family:"Poppins","Open Sans",system-ui,sans-serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  width:248px;
  height:100vh;
  padding:20px 14px;
  overflow-y:auto;
  color:#f8fafc;
  background:var(--sidebar);
  border-right:1px solid var(--side-edge);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:3px 8px 20px;
  border-bottom:1px solid #475569;
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  color:#fff;
  background:var(--accent);
  border:1px solid #10b981;
  border-radius:8px;
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em}
.brand-txt span{display:block;margin-top:1px;color:#cbd5e1;font-size:10px;letter-spacing:.13em}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:18px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 12px;
  color:#cbd5e1;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#fff;background:#334155;border-color:#475569}
.nav button.on{color:#fff;background:var(--accent);border-color:#34d399;font-weight:700}
.nav .idx{margin-left:auto;color:inherit;font:600 10px/1 "Poppins",sans-serif;opacity:.75}
.side-foot{
  margin-top:auto;
  padding:14px 9px 2px;
  color:#cbd5e1;
  border-top:1px solid #475569;
  font-size:10.5px;
  line-height:1.7;
}
.side-foot b{color:#fff}

.main{flex:1;min-width:0;padding:22px 28px 52px}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin:-22px -28px 18px;
  padding:18px 28px 14px;
  background:rgba(248,250,252,.96);
  border-bottom:1px solid var(--line);
}
.topbar h1{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:600;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:25px}
.topbar .sub{margin-top:3px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 11px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:7px;
  font-size:11.5px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;background:var(--ok);border:2px solid #bbf7d0;border-radius:50%;animation:pulse 2s ease-in-out infinite}
.avatar{display:flex;flex:none;align-items:center;justify-content:center;width:34px;height:34px;color:#fff;background:var(--color-primary);border-radius:7px;font-weight:700}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
#screen>*,.grid-item{animation:card-in 400ms cubic-bezier(.2,.8,.2,1) both}
#screen>*:nth-child(2){animation-delay:60ms}
#screen>*:nth-child(3){animation-delay:120ms}
#screen>*:nth-child(4){animation-delay:180ms}

.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
  transition:border-color 150ms ease,background-color 150ms ease,transform 150ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#94a3b8}
.card,.sec{padding:15px}
.sec{margin-bottom:12px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.sec>h3{margin-bottom:12px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:18px}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font-size:11px}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat,.tile{position:relative;padding:15px 16px;border-top:3px solid var(--accent);overflow:hidden}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid #a7f3d0;
  border-radius:7px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:11.5px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;
  color:var(--ink);
  font:700 25px/1.25 "Poppins","Open Sans",sans-serif;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--muted);font:600 12px "Open Sans",sans-serif;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#047857}.delta.down,.d.down{color:#b91c1c}.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:7px}
.tile b{font-size:13px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}

.card.pad0>.card-h{padding:15px 15px 0!important}
table{width:100%;border-collapse:collapse;font-size:12.2px;font-variant-numeric:tabular-nums}
th{
  padding:9px 11px;
  color:var(--muted);
  text-align:left;
  white-space:nowrap;
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.03em;
}
td{padding:9px 11px;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover{background:var(--hov)}
tbody tr:last-child td{border-bottom:0}
th:nth-child(n+4),td:nth-child(n+4){text-align:right}
th:last-child,td:last-child{text-align:center}
.mono,td:first-child{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-weight:600;
  letter-spacing:.01em;
}
.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-width:38px;
  padding:3px 8px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700;
}
.t-ok{color:#047857;background:#ecfdf5}
.t-warn{color:#92400e;background:#fffbeb}
.t-bad{color:#b91c1c;background:#fef2f2}
.t-info{color:#334155;background:#f1f5f9}
.t-gray{color:#475569;background:#f8fafc}
.t-acc,.t-pink{color:#047857;background:#ecfdf5}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border-radius:3px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--muted);font-size:10.5px;font-weight:700;text-align:right}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 16px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-23px;width:13px;height:13px;background:#fff;border:3px solid var(--accent);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font:600 10.5px ui-monospace,monospace}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:12px;padding-top:11px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--th);border:1px solid var(--line);border-radius:8px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:12px;font-weight:600}
.col-h .cnt{padding:1px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:5px;font-size:10.5px}
.pcard{padding:10px 11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;transition:border-color 150ms ease,background-color 150ms ease}
.pcard:hover{background:#f8fafc;border-color:#94a3b8;border-left-color:var(--accent)}
.pcard b{font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10.5px}
.pcard .who,.who{display:inline-flex;align-items:center;gap:6px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:10.5px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);border:1px solid #a7f3d0;border-radius:50%;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}.av{width:26px;height:26px;font-size:11px}

.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:8px}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:30px;height:30px;color:var(--accent);background:var(--accent-soft);border-radius:6px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--muted);background:#fff;border:2px solid var(--line);border-radius:50%;font-size:10.5px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:var(--accent);border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 3px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:12.5px}.rep-row .sku span{color:var(--muted);font:400 10.5px ui-monospace,monospace}
.gauge{flex:none;width:110px}.gauge .track{height:8px;overflow:hidden;background:var(--track);border-radius:3px}.gauge .track i{display:block;height:100%;background:var(--accent)}.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border-radius:5px}.band .rng{position:absolute;inset-block:0;background:var(--accent-soft);border-radius:5px}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:3px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes card-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:12px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;flex-direction:row;align-items:center;flex-wrap:wrap;width:100%;height:auto;padding:11px 13px;gap:6px}
  .brand{padding:0 12px 0 3px;border:0}.side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:0}
  .nav button{width:auto;min-height:42px;padding:8px 11px}.nav .idx{display:none}
  .main{padding:18px 15px 42px}
  .topbar{position:static;margin:-18px -15px 16px;padding:16px 15px 13px}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:700px){.dl{grid-template-columns:1fr;gap:2px}.dl dt{margin-top:8px}}
@media(max-width:560px){
  body{font-size:13px}
  .g4{grid-template-columns:1fr 1fr;gap:9px}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .topbar{align-items:flex-start}.topbar h1{font-size:18px}.top-right{width:100%}
  .chip{flex:1;justify-content:center}.avatar{display:none}
  .kpi,.stat,.tile{padding:13px}.kpi .val,.stat .val,.tile .tv{font-size:21px}
  .lane-row{align-items:flex-start;flex-wrap:wrap}.steps{margin-left:42px}
}
@media(max-width:390px){.main{padding-inline:10px}.topbar{margin-inline:-10px;padding-inline:10px}.g4{grid-template-columns:1fr}.brand-txt{display:none}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">warehouse</span></div>
      <div class="brand-txt"><b>委外倉管理台</b><span>3PL MANAGEMENT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08 當期<br/>委外倉 5 座<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
