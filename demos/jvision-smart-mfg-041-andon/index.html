<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Andon 安燈系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --acc:#0891b2; --acc2:#22d3ee; --bg:#0b1220; --panel:#0f1a2e; --panel2:#13233d;
  --line:#1e3350; --txt:#e6f2f8; --mut:#8aa4bd; --card:#122238;
  --red:#ef4444; --yel:#f59e0b; --grn:#10b981; --blue:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#0e2036 0%,var(--bg) 60%);color:var(--txt);line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;display:inline-block}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(8,145,178,.14),transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(8,145,178,.4);flex:none}
.logo .material-symbols-outlined{font-size:26px;color:#04121a}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand p{font-size:12px;color:var(--mut);white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mut);white-space:nowrap}
.pill.live{color:#fecaca;border-color:#5b1e24;background:#2a1417}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.25)}
nav{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(9,16,28,.6)}
nav button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-width:0}
nav button:hover{color:var(--txt);border-color:var(--acc)}
nav button.on{background:linear-gradient(135deg,var(--acc),#0aa5c9);color:#02131b;border-color:transparent;box-shadow:0 4px 14px rgba(8,145,178,.35)}
nav button .material-symbols-outlined{font-size:19px}
main{padding:20px;flex:1}
.scr-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.scr-head .ico{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.scr-head .ico .material-symbols-outlined{color:var(--acc2);font-size:24px}
.scr-head h2{font-size:20px;font-weight:800}
.scr-head p{font-size:13px;color:var(--mut)}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel.pad0{padding:0;overflow:hidden}
.plist-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.plist-head b{font-size:14px}
.plist{max-height:560px;overflow-y:auto}
.li{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(30,51,80,.6);cursor:pointer;transition:.12s;min-width:0}
.li:hover{background:var(--panel2)}
.li.on{background:linear-gradient(90deg,rgba(8,145,178,.16),transparent);border-left:3px solid var(--acc2)}
.li .lamp{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}
.li .body{min-width:0;flex:1}
.li .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li .s{font-size:11.5px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700;white-space:nowrap}
.t-red{background:#3a1518;color:#fca5a5} .t-yel{background:#3a2c11;color:#fcd34d} .t-grn{background:#0f2f24;color:#6ee7b7} .t-blue{background:#132a45;color:#93c5fd} .t-gray{background:#1b2b41;color:#9fb6cf}
.lamp-red{background:var(--red);box-shadow:0 0 8px var(--red)} .lamp-yel{background:var(--yel);box-shadow:0 0 8px var(--yel)} .lamp-grn{background:var(--grn);box-shadow:0 0 8px var(--grn)} .lamp-blue{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .sub{font-size:11.5px;margin-top:4px}
.up{color:#6ee7b7}.down{color:#fca5a5}
.detail-hero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;margin-bottom:14px;border:1px solid var(--line)}
.detail-hero.red{background:linear-gradient(120deg,rgba(239,68,68,.16),transparent);border-color:#5b1e24}
.detail-hero.yel{background:linear-gradient(120deg,rgba(245,158,11,.14),transparent);border-color:#4a3712}
.detail-hero .big{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.detail-hero .big .material-symbols-outlined{font-size:32px}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(30,51,80,.7);font-size:13px}
.rowline .k{color:var(--mut)} .rowline .v{font-weight:600;text-align:right}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.pri{background:linear-gradient(135deg,var(--acc),#0aa5c9);color:#02131b;border-color:transparent}
.btn.dng{background:#2a1417;color:#fca5a5;border-color:#5b1e24}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;background:rgba(9,16,28,.4)}
tbody tr:hover{background:var(--panel2)}
.sec-title{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec-title .material-symbols-outlined{color:var(--acc2);font-size:20px}
.chart{width:100%;height:300px}
.mini{width:100%;height:220px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.station{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;position:relative;overflow:hidden}
.station .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.station .nm{font-size:13px;font-weight:700}
.station .zone{font-size:11px;color:var(--mut)}
.tower{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.seg{height:14px;border-radius:5px;background:#1a2a41;opacity:.35}
.seg.r.on{background:var(--red);opacity:1;box-shadow:0 0 12px var(--red)}
.seg.y.on{background:var(--yel);opacity:1;box-shadow:0 0 12px var(--yel)}
.seg.g.on{background:var(--grn);opacity:1;box-shadow:0 0 12px var(--grn)}
.station .meta{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.station .st{font-size:12px;font-weight:700;margin-top:6px}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px 8px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--acc2);background:var(--panel)}
.tl .ev.esc:before{background:var(--red);border-color:var(--red)}
.tl .ev .tm{font-size:11.5px;color:var(--mut)}
.tl .ev .tt{font-size:13.5px;font-weight:700;margin:2px 0}
.tl .ev .dd{font-size:12px;color:var(--mut)}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.lvlcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.lvlcard .n{font-size:12px;color:var(--mut)}
.lvlcard .r{font-size:14px;font-weight:700;margin-top:4px}
.lvlcard .m{font-size:11px;color:var(--mut);margin-top:3px}
.lvlcard.act{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}
.slabar{background:#1a2a41;border-radius:8px;height:10px;overflow:hidden;min-width:80px}
.slabar > i{display:block;height:100%;border-radius:8px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.timerbig{font-family:"Inter";font-size:30px;font-weight:800;letter-spacing:1px}
.card-soft{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
@media(max-width:820px){
  .split{grid-template-columns:1fr}
  .kgrid{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr 1fr}
  .lvl{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .three{grid-template-columns:1fr}
}
@media(max-width:560px){
  nav button .txt{display:none}
  nav button{padding:9px 11px}
  .kgrid{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  main{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">emergency_home</span></div>
      <div>
        <h1>Andon 安燈系統</h1>
        <p>異常觸發 · 通報升級 · 時效追蹤</p>
      </div>
    </div>
    <div class="top-right">
      <span class="pill live"><span class="dot"></span>2 件異常處理中</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">factory</span>台中三廠</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">schedule</span>早班 08:00–16:00</span>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<script>
"use strict";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function axisBase(){return{axisLine:{lineStyle:{color:"#1e3350"}},axisLabel:{color:"#8aa4bd"},splitLine:{lineStyle:{color:"rgba(30,51,80,.5)"}}};}

var stations=[
  {id:"L1-CNC-03",zone:"A區 · 加工線",r:1,y:0,g:0,st:"設備停機呼叫",who:"設備維修",min:12,tag:"設備異常",tc:"t-red"},
  {id:"L1-ASM-07",zone:"A區 · 組裝線",r:0,y:1,g:0,st:"缺料呼叫中",who:"物料備料",min:5,tag:"物料短缺",tc:"t-yel"},
  {id:"L2-QC-02",zone:"B區 · 檢測站",r:1,y:0,g:0,st:"品質異常待判",who:"品保工程",min:8,tag:"品質異常",tc:"t-red"},
  {id:"L2-PKG-05",zone:"B區 · 包裝線",r:0,y:0,g:1,st:"正常運轉",who:"—",min:0,tag:"正常",tc:"t-grn"},
  {id:"L3-CNC-11",zone:"C區 · 加工線",r:0,y:1,g:0,st:"換模作業中",who:"換模班",min:3,tag:"換線",tc:"t-yel"},
  {id:"L3-ASM-09",zone:"C區 · 組裝線",r:0,y:0,g:1,st:"正常運轉",who:"—",min:0,tag:"正常",tc:"t-grn"},
  {id:"L4-WELD-01",zone:"D區 · 焊接線",r:0,y:0,g:1,st:"正常運轉",who:"—",min:0,tag:"正常",tc:"t-grn"},
  {id:"L4-INS-04",zone:"D區 · 檢測站",r:0,y:1,g:0,st:"治具校正呼叫",who:"工程",min:2,tag:"工程支援",tc:"t-blue"}
];

var MOD=[
  {icon:"notification_important",name:"異常觸發台",sub:"拉繩/按鈕觸發燈號，即時建立異常事件"},
  {icon:"highlight",name:"安燈看板",sub:"產線燈號牆即時顯示紅黃綠與呼叫狀態"},
  {icon:"escalator_warning",name:"升級通報",sub:"逾時未回應自動逐級升級並推播通知"},
  {icon:"engineering",name:"到場處理",sub:"責任人員接手、到場計時與排除回報"},
  {icon:"timer",name:"時效追蹤",sub:"反應/處理/停線時間 SLA 達成率監控"},
  {icon:"analytics",name:"事件分析",sub:"異常類型分佈、重工熱點與改善追蹤"}
];

(function(){
  var n=document.getElementById("nav");var h="";
  for(var i=0;i<MOD.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MOD[i].icon+'</span><span class="txt">'+MOD[i].name+'</span></button>';
  }
  n.innerHTML=h;
})();

function head(i){
  return '<div class="scr-head"><div class="ico"><span class="material-symbols-outlined">'+MOD[i].icon+'</span></div>'
    +'<div><h2>'+MOD[i].name+'</h2><p>'+MOD[i].sub+'</p></div></div>';
}

/* ===== SCREEN 0 : 異常觸發台 (split) ===== */
var triggerSel=0;
var triggers=[
  {id:"AD-20260814-018",station:"L1-CNC-03",type:"設備異常",tc:"t-red",lamp:"lamp-red",time:"08:41",by:"作業員 · 王志明",reason:"主軸過載跳脫，機台自動停機",prod:"齒輪箱殼體 GX-220",wo:"WO-5521",qty:"320 / 800",sla:"5 分鐘內到場",impact:"高 · 影響本週兩張出貨工單",sug:"通知設備維修＋工程雙軌到場"},
  {id:"AD-20260814-017",station:"L1-ASM-07",type:"物料短缺",tc:"t-yel",lamp:"lamp-yel",time:"08:36",by:"作業員 · 李佩珊",reason:"線邊料架螺絲 M6 見底",prod:"控制盒 CB-118",wo:"WO-5518",qty:"540 / 900",sla:"3 分鐘內補料",impact:"中 · 15 分鐘後將停線",sug:"物料備料緊急補料 2 箱"},
  {id:"AD-20260814-016",station:"L2-QC-02",type:"品質異常",tc:"t-red",lamp:"lamp-red",time:"08:29",by:"檢測員 · 陳冠宇",reason:"連續 3 件外觀刮傷超規",prod:"面板 PN-330",wo:"WO-5510",qty:"—",sla:"8 分鐘內判定",impact:"高 · 疑似上工序治具磨損",sug:"品保到場封存並啟動追溯"},
  {id:"AD-20260814-015",station:"L3-CNC-11",type:"換線",tc:"t-yel",lamp:"lamp-yel",time:"08:18",by:"線長 · 吳孟樺",reason:"換模作業呼叫協助",prod:"支架 BR-090",wo:"WO-5525",qty:"—",sla:"依排程",impact:"低 · 計畫性換模",sug:"換模班依 SMED 標準支援"},
  {id:"AD-20260814-014",station:"L4-INS-04",type:"工程支援",tc:"t-blue",lamp:"lamp-blue",time:"08:05",by:"作業員 · 林淑芬",reason:"檢測治具數值飄移需校正",prod:"連接器 CN-071",wo:"WO-5519",qty:"210 / 600",sla:"依到場",impact:"低 · 暫用備援治具",sug:"工程到場校正並記錄"}
];
function show0(){
  var v=document.getElementById("view");
  var li="";
  for(var i=0;i<triggers.length;i++){var t=triggers[i];
    li+='<div class="li'+(i===triggerSel?' on':'')+'" onclick="triggerSel='+i+';show(0)">'
      +'<span class="lamp '+t.lamp+'"></span><div class="body">'
      +'<div class="t">'+t.station+' <span class="tag '+t.tc+'">'+t.type+'</span></div>'
      +'<div class="s">'+t.id+' · '+t.time+' · '+t.by+'</div></div></div>';
  }
  var t=triggers[triggerSel];
  var heroCls=t.tc==="t-red"?"red":"yel";
  var big=t.tc==="t-red"?'style="background:#3a1518;color:#fca5a5"':'style="background:#3a2c11;color:#fcd34d"';
  var right='<div class="panel">'
    +'<div class="detail-hero '+heroCls+'"><div class="big" '+big+'><span class="material-symbols-outlined">warning</span></div>'
    +'<div style="min-width:0"><div style="font-size:12px;color:var(--mut)">'+t.id+'</div>'
    +'<div style="font-size:19px;font-weight:800">'+t.station+' · '+t.type+'</div>'
    +'<div style="font-size:12.5px;color:var(--mut);margin-top:2px">'+t.reason+'</div></div></div>'
    +'<div class="rowline"><span class="k">觸發時間</span><span class="v">'+t.time+'　'+t.by+'</span></div>'
    +'<div class="rowline"><span class="k">關聯工單</span><span class="v">'+t.wo+'　產品 '+t.prod+'</span></div>'
    +'<div class="rowline"><span class="k">生產進度</span><span class="v">'+t.qty+'</span></div>'
    +'<div class="rowline"><span class="k">SLA 要求</span><span class="v">'+t.sla+'</span></div>'
    +'<div class="rowline"><span class="k">影響評估</span><span class="v">'+t.impact+'</span></div>'
    +'<div class="rowline"><span class="k">系統建議</span><span class="v">'+t.sug+'</span></div>'
    +'<div class="btns"><button class="btn pri"><span class="material-symbols-outlined" style="font-size:18px">campaign</span>確認並通報</button>'
    +'<button class="btn"><span class="material-symbols-outlined" style="font-size:18px">person_add</span>指派責任人</button>'
    +'<button class="btn dng"><span class="material-symbols-outlined" style="font-size:18px">block</span>誤觸取消</button></div></div>';
  v.innerHTML=head(0)
    +'<div class="split"><div class="panel pad0">'
    +'<div class="plist-head"><b>今日異常觸發</b><span class="tag t-gray">'+triggers.length+' 件</span></div>'
    +'<div class="plist">'+li+'</div></div>'+right+'</div>';
}

/* ===== SCREEN 1 : 安燈看板 ===== */
function show1(){
  var v=document.getElementById("view");
  var red=0,yel=0,grn=0,b="";
  for(var i=0;i<stations.length;i++){var s=stations[i];
    if(s.r)red++;else if(s.y)yel++;else grn++;
    b+='<div class="station"><div class="hd"><div><div class="nm">'+s.id+'</div><div class="zone">'+s.zone+'</div></div>'
      +'<span class="tag '+s.tc+'">'+s.tag+'</span></div>'

}
