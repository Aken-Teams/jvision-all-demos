<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產線異常警示通報系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#CBD5E1;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --red:#DC2626;
  --yellow:#A16207;
  --green:#047857;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  overflow-x:hidden;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
}
button,a,[onclick]{cursor:pointer}
button{font:inherit}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  display:inline-block;
  flex:none;
  font-family:"Material Symbols Outlined";
  font-size:20px;
  font-style:normal;
  font-weight:500;
  line-height:1;
  vertical-align:middle;
}
.mono,.value,.timer,td:nth-child(n+2),.event-id{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.app{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:stretch;
  min-height:82px;
  background:var(--color-card);
  border-bottom:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:315px;
  padding:14px 22px;
  color:#fff;
  background:var(--blue);
  border-right:3px solid var(--ink);
}
.logo{
  display:grid;
  width:48px;
  height:48px;
  place-items:center;
  color:var(--ink);
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
}
.logo .material-symbols-outlined{font-size:27px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.02em}
.brand p{margin:2px 0 0;font-size:12px;opacity:.9}
.top-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  width:100%;
  padding:14px 20px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 11px;
  color:var(--muted);
  background:#fff;
  border:2px solid var(--ink);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.pill.live{color:#991B1B;background:#FEE2E2}
.status-mark{
  display:grid;
  width:18px;
  height:18px;
  place-items:center;
  color:#fff;
  background:var(--red);
  font-size:12px;
  font-weight:800;
}
nav{
  position:sticky;
  top:82px;
  z-index:20;
  display:flex;
  gap:0;
  overflow-x:auto;
  background:#fff;
  border-bottom:3px solid var(--ink);
}
nav button{
  display:flex;
  flex:1;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:142px;
  min-height:52px;
  padding:10px 14px;
  color:var(--muted);
  background:#fff;
  border:0;
  border-right:2px solid var(--ink);
  font-size:13px;
  font-weight:700;
}
nav button:hover{color:var(--blue);background:var(--color-muted)}
nav button.on{
  position:relative;
  color:#fff;
  background:var(--blue);
}
nav button.on:after{
  position:absolute;
  right:8px;
  bottom:7px;
  left:8px;
  height:3px;
  background:#fff;
  content:"";
}
main{width:min(1540px,100%);margin:auto;padding:24px}
.screen-head{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:end;
  gap:16px;
  margin-bottom:18px;
  padding:20px;
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);
}
.screen-icon{
  display:grid;
  width:54px;
  height:54px;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:3px solid var(--ink);
}
.screen-icon .material-symbols-outlined{font-size:29px}
.screen-head h2{margin:0;font-size:clamp(22px,3vw,34px);line-height:1.08;font-weight:800}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.screen-code{
  align-self:start;
  padding:5px 8px;
  color:var(--muted);
  background:var(--color-muted);
  border:1px solid var(--ink);
  font:600 11px "Fira Code",monospace;
}
.panel,.card{
  min-width:0;
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:5px 5px 0 var(--line);
}
.panel{padding:18px}
.panel.flush{padding:0;overflow:hidden}
.split{display:grid;grid-template-columns:minmax(290px,350px) 1fr;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{
  position:relative;
  min-width:0;
  padding:16px;
  background:#fff;
  border:2px solid var(--ink);
}
.kpi:before{
  position:absolute;
  top:0;
  right:0;
  width:18px;
  height:18px;
  background:var(--blue);
  border-left:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
  content:"";
}
.kpi .label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi .value{margin-top:8px;font-size:28px;font-weight:700;line-height:1.1}
.kpi .value small{color:var(--muted);font:600 13px "Fira Sans",sans-serif}
.kpi .sub{margin-top:6px;font-size:11.5px;font-weight:600}
.good{color:var(--green)}.risk{color:#9A3412}.danger{color:var(--red)}
.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:54px;
  padding:12px 15px;
  background:var(--color-muted);
  border-bottom:2px solid var(--ink);
}
.list{max-height:610px;overflow:auto}
.list-item{
  display:flex;
  gap:11px;
  min-height:74px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.list-item:hover{background:#EFF6FF}
.list-item.on{
  padding-left:10px;
  background:#DBEAFE;
  border-left:5px solid var(--blue);
}
.signal{
  display:grid;
  width:20px;
  height:20px;
  margin-top:2px;
  flex:none;
  place-items:center;
  color:#fff;
  border:2px solid var(--ink);
  font-size:12px;
  font-weight:800;
}
.signal.red{background:var(--red)}.signal.yellow{color:#111;background:#FBBF24}.signal.blue{background:var(--blue)}
.item-body{min-width:0}
.item-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:800}
.item-sub{margin-top:4px;color:var(--muted);font-size:11.5px}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  font-size:10.5px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
}
.t-red{color:#991B1B;background:#FEE2E2}
.t-yellow{color:#713F12;background:#FEF3C7}
.t-green{color:#065F46;background:#D1FAE5}
.t-blue{color:#1E40AF;background:#DBEAFE}
.t-gray{color:#334155;background:#E2E8F0}
.detail-hero{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:15px;
  align-items:center;
  margin-bottom:14px;
  padding:17px;
  background:#EFF6FF;
  border:3px solid var(--ink);
}
.detail-hero.red{background:#FEE2E2}
.detail-hero.yellow{background:#FEF3C7}
.big-icon{
  display:grid;
  width:60px;
  height:60px;
  place-items:center;
  color:#fff;
  background:var(--red);
  border:3px solid var(--ink);
}
.yellow .big-icon{color:#111;background:#FBBF24}
.detail-hero h3{margin:2px 0;font-size:20px;font-weight:800}
.event-id{color:var(--muted);font-size:11px}
.detail-copy{color:var(--muted);font-size:12.5px}
.rowline{
  display:grid;
  grid-template-columns:minmax(110px,28%) 1fr;
  gap:14px;
  padding:11px 2px;
  border-bottom:1px dashed #94A3B8;
  font-size:13px;
}
.rowline .key{color:var(--muted)}
.rowline .val{text-align:right;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:44px;
  padding:9px 15px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  font-weight:800;
}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{color:#fff;background:var(--blue)}
.btn.cta{color:#111;background:var(--color-accent)}
.btn.destructive{color:#fff;background:var(--red)}
.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  font-size:14px;
  font-weight:800;
  text-transform:uppercase;
}
.section-title .material-symbols-outlined{color:var(--blue)}
.station-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.station{padding:13px;background:#fff;border:2px solid var(--ink)}
.station-head{display:flex;justify-content:space-between;gap:7px}
.station-name{font:700 12.5px "Fira Code",monospace}
.station-zone{color:var(--muted);font-size:10.5px}
.tower{display:grid;gap:5px;margin:12px 0}
.segment{height:13px;background:#E2E8F0;border:1px solid #94A3B8}
.segment.red.on{background:var(--red)}
.segment.yellow.on{background:#FBBF24}
.segment.green.on{background:#10B981}
.station-status{font-size:12px;font-weight:800}
.station-meta{display:flex;justify-content:space-between;gap:7px;margin-top:5px;color:var(--muted);font-size:10.5px}
.chart{width:100%;height:300px}.mini{width:100%;height:230px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:13px;height:13px;border:2px solid var(--ink)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}
.level{padding:12px 8px;text-align:center;background:#fff;border:2px solid var(--ink)}
.level.active{background:#DBEAFE;box-shadow:inset 0 -6px 0 var(--blue)}
.level .n{color:var(--muted);font-size:11px}.level .r{margin-top:4px;font-weight:800}.level .m{margin-top:3px;color:var(--muted);font-size:10.5px}
.timeline{position:relative;padding-left:27px}
.timeline:before{position:absolute;top:4px;bottom:4px;left:8px;width:3px;background:var(--ink);content:""}
.timeline-event{position:relative;padding:0 0 18px 10px}
.timeline-event:before{
  position:absolute;
  top:3px;
  left:-25px;
  width:13px;
  height:13px;
  background:#fff;
  border:3px solid var(--blue);
  content:"";
}
.timeline-event.escalated:before{background:var(--red);border-color:var(--ink)}
.timeline-event .time{color:var(--muted);font:500 11px "Fira Code",monospace}
.timeline-event .title{margin:2px 0;font-weight:800}
.timeline-event .desc{color:var(--muted);font-size:12px}
.soft-card{min-width:0;padding:16px;background:var(--color-muted);border:2px solid var(--ink)}
.timer{text-align:center;font-size:34px;font-weight:700;color:var(--red)}
.progress{min-width:85px;height:12px;background:#E2E8F0;border:1px solid var(--ink)}
.progress i{display:block;height:100%}
.table-wrap{overflow:auto}
table{width:100%;min-width:690px;border-collapse:collapse;font-size:12.5px}
th,td{padding:11px 12px;text-align:left;border:1px solid var(--line);white-space:nowrap}
th{color:#fff;background:var(--ink);font-size:11.5px;font-weight:700}
td:nth-child(n+2){text-align:right}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#DBEAFE}
table .tag{font-family:"Fira Sans",sans-serif}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
@media(max-width:1100px){
  .station-grid{grid-template-columns:repeat(2,1fr)}
  .three{grid-template-columns:1fr 1fr}
  .three>*:last-child{grid-column:1/-1}
}
@media(max-width:820px){
  .topbar{position:relative;display:block}
  .brand{width:100%;min-width:0;border-right:0;border-bottom:3px solid var(--ink)}
  .top-meta{justify-content:flex-start;overflow-x:auto}
  nav{top:0}
  .split,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .levels{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  main{padding:14px}
  .top-meta{padding:10px}
  .pill{min-height:34px}
  nav button{min-width:54px}
  nav button .nav-text{display:none}
  .screen-head{grid-template-columns:auto 1fr;padding:14px;box-shadow:5px 5px 0 var(--ink)}
  .screen-code{display:none}
  .screen-icon{width:46px;height:46px}
  .kpis,.station-grid,.three{grid-template-columns:1fr}
  .three>*:last-child{grid-column:auto}
  .rowline{grid-template-columns:1fr;gap:2px}
  .rowline .val{text-align:left}
  .actions .btn{width:100%}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">emergency_home</span></div>
    <div><h1>產線異常警示通報系統</h1><p>異常觸發 · 通報升級 · 時效追蹤</p></div>
  </div>
  <div class="top-meta">
    <span class="pill live"><span class="status-mark">!</span>2 件異常處理中</span>
    <span class="pill"><span class="material-symbols-outlined">factory</span>台中三廠</span>
    <span class="pill"><span class="material-symbols-outlined">schedule</span>早班 08:00–16:00</span>
  </div>
</header>
<nav id="nav" aria-label="主要功能"></nav>
<main id="view" tabindex="-1"></main>
</div>
<script>
"use strict";
var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
function axisBase(){return{axisLine:{lineStyle:{color:"#64748B"}},axisLabel:{color:"#475569",fontFamily:"Fira Code"},splitLine:{lineStyle:{color:"#CBD5E1"}}}}
function icon(name){return'<span class="material-symbols-outlined">'+name+'</span>'}
function signal(type){return'<span class="signal '+type+'" aria-hidden="true">'+(type==="red"?"!":type==="yellow"?"△":"i")+'</span>'}
function tag(text,type){return'<span class="tag t-'+type+'">'+text+'</span>'}
function actions(primary){
  return'<div class="actions">'+primary+'</div>'
}
var MOD=[
  ["notification_important","異常觸發台","拉繩/按鈕觸發燈號，即時建立異常事件"],
  ["highlight","安燈看板","產線燈號牆即時顯示紅黃綠與呼叫狀態"],
  ["escalator_warning","升級通報","逾時未回應自動逐級升級並推播通知"],
  ["engineering","到場處理","責任人員接手、到場計時與排除回報"],
  ["timer","時效追蹤","反應/處理/停線時間 SLA 達成率監控"],
  ["analytics","事件分析","異常類型分佈、重工熱點與改善追蹤"]
];
document.getElementById("nav").innerHTML=MOD.map(function(m,i){
  return'<button type="button" data-i="'+i+'" onclick="go('+i+')" aria-label="'+m[1]+'">'+icon(m[0])+'<span class="nav-text">'+m[1]+'</span></button>'
}).join("");
function head(i){
  return'<div class="screen-head reveal"><div class="screen-icon">'+icon(MOD[i][0])+'</div><div><h2>'+MOD[i][1]+'</h2><p>'+MOD[i][2]+'</p></div><span class="screen-code">OPS / 0'+(i+1)+'</span></div>'
}
var triggers=[
["AD-20260814-018","L1-CNC-03","設備異常","red","08:41","作業員 · 王志明","主軸過載跳脫，機台自動停機","齒輪箱殼體 GX-220","WO-5521","320 / 800","5 分鐘內到場","高 · 影響本週兩張出貨工單","通知設備維修＋工程雙軌到場"],
["AD-20260814-017","L1-ASM-07","物料短缺","yellow","08:36","作業員 · 李佩珊","線邊料架螺絲 M6 見底","控制盒 CB-118","WO-5518","540 / 900","3 分鐘內補料","中 · 15 分鐘後將停線","物料備料緊急補料 2 箱"],
["AD-20260814-016","L2-QC-02","品質異常","red","08:29","檢測員 · 陳冠宇","連續 3 件外觀刮傷超規","面板 PN-330","WO-5510","—","8 分鐘內判定","高 · 疑似上工序治具磨損","品保到場封存並啟動追溯"],
["AD-20260814-015","L3-CNC-11","換線","yellow","08:18","線長 · 吳孟樺","換模作業呼叫協助","支架 BR-090","WO-5525","—","依排程","低 · 計畫性換模","換模班依 SMED 標準支援"],
["AD-20260814-014","L4-INS-04","工程支援","blue","08:05","作業員 · 林淑芬","檢測治具數值飄移需校正","連接器 CN-071","WO-5519","210 / 600","依到場","低 · 暫用備援治具","工程到場校正並記錄"]
];
var triggerSel=0;
function show0(){
  var t=triggers[triggerSel];
  var list=triggers.map(function(x,i){
    return'<div class="list-item '+(i===triggerSel?"on":"")+'" tabindex="0" role="button" onclick="triggerSel='+i+';show(0)" onkeydown="if(event.key===\'Enter\'){this.click()}">'+signal(x[3])+'<div class="item-body"><div class="item-title"><span class="mono">'+x[1]+'</span>'+tag(x[2],x[3])+'</div><div class="item-sub mono">'+x[0]+' · '+x[4]+' · '+x[5]+'</div></div></div>'
  }).join("");
  var detail='<div class="panel"><div class="detail-hero '+t[3]+'"><div class="big-icon">'+icon("warning")+'</div><div><div class="event-id">'+t[0]+'</div><h3>'+t[1]+' · '+t[2]+'</h3><div class="detail-copy">'+t[6]+'</div></div></div>'
    +row("觸發時間",t[4]+"　"+t[5])+row("關聯工單",t[8]+"　產品 "+t[7])+row("生產進度",t[9])+row("SLA 要求",t[10])+row("影響評估",t[11])+row("系統建議",t[12])
    +actions('<button class="btn cta">'+icon("campaign")+'確認並通報</button><button class="btn">'+icon("person_add")+'指派責任人</button><button class="btn destructive">'+icon("block")+'誤觸取消</button></div>');
  view(head(0)+'<div class="split reveal"><div class="panel flush"><div class="list-head"><b>今日異常觸發</b>'+tag(triggers.length+" 件","gray")+'</div><div class="list">'+list+'</div></div>'+detail+'</div>')
}
