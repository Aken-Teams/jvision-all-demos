<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>危險品與化學品倉儲管理 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="icon" href="../../favicon.svg"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#10b981;
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#ecfdf5;
  --track:#e6e8ea;
  --sidebar:#0f172a;
  --sidebar2:#1e293b;
  --side-edge:#475569;
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#1d4ed8;
  --r:0px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  margin:0;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px!important;
  box-shadow:0 0 0 2px var(--color-card)!important;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:none;
  flex-direction:column;
  width:264px;
  height:100vh;
  padding:0;
  overflow:hidden;
  color:#fff;
  background:var(--sidebar);
  border-right:4px solid var(--accent);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:24px 18px;
  background:var(--accent);
  border-bottom:3px solid #020617;
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  color:#020617;
  background:#fff;
  border:3px solid #020617;
  border-radius:0;
  box-shadow:5px 5px 0 #020617;
}
.brand-logo .material-symbols-outlined{font-size:26px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#020617;font-size:16px;line-height:1.3;letter-spacing:.02em}
.brand-txt span{display:block;margin-top:3px;color:#052e16;font-size:10px;font-weight:700;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:0;min-width:0;margin:0;padding:18px 0}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  min-height:50px;
  padding:12px 18px;
  color:#cbd5e1;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:0;
  border-bottom:1px solid #334155;
  border-radius:0;
  font-size:13px;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.nav button:first-child{border-top:1px solid #334155}
.nav button:hover{color:#fff;background:#334155;transform:translateX(4px)}
.nav button.on{color:#020617;background:#fff;box-shadow:none}
.nav button.on::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--accent)}
.nav button.on .material-symbols-outlined{color:var(--accent)}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav .idx{margin-left:auto;color:inherit;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;opacity:.8}
.side-foot{
  margin-top:auto;
  padding:18px;
  color:#cbd5e1;
  border-top:3px solid #334155;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  line-height:1.75;
}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,46px) 64px}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  min-height:110px;
  margin:0 0 22px;
  padding:22px 24px;
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--accent);
}
.topbar::before{content:"OPERATIONS / HAZMAT";position:absolute;right:22px;bottom:8px;color:#94a3b8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.15em}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(21px,2.4vw,31px);line-height:1.2;letter-spacing:-.03em}
.topbar h1 .material-symbols-outlined{padding:7px;color:#fff;background:var(--color-primary);font-size:25px}
.topbar .sub{margin-top:7px;color:var(--muted);font-size:13px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:11px;
  font-weight:700;
}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid #fff;outline:2px solid var(--ok);border-radius:0;box-shadow:none;animation:pulse 2s steps(2,end) infinite}
.avatar{display:flex;flex:none;align-items:center;justify-content:center;width:38px;height:38px;color:#fff;background:var(--color-primary);border:2px solid var(--ink);border-radius:0;font-weight:700}
@keyframes pulse{50%{opacity:.35}}

#screen{display:grid;grid-template-columns:410px minmax(0,1fr);grid-auto-rows:min-content;gap:18px;align-items:start}
#screen>*{grid-column:1/-1;min-width:0;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px;padding:0!important;background:none!important;border:0!important;overflow:visible}
#screen>.grid.g4:first-child>*{flex:none!important;min-height:148px;padding:15px!important;background:#fff!important;border:2px solid var(--ink)!important;border-radius:0!important}
#screen>.grid.g4:first-child>*:nth-child(1),#screen>.grid.g4:first-child>*:nth-child(4){transform:translateY(8px)}
#screen>.grid.g4:first-child>.tile .ti{width:36px;height:36px;margin:0;overflow:visible}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:316px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--ink);
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 #cbd5e1;
}
.card,.sec{padding:18px}
.sec{margin-bottom:18px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h,.sec>h3{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:40px;
  margin-bottom:16px;
  padding-bottom:11px;
  border-bottom:3px solid var(--ink);
}
.sec>h3{justify-content:flex-start;font-size:15px}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;padding:17px;border-bottom:2px solid var(--ink)}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:15px;letter-spacing:.01em}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card-h .hint{color:var(--muted);font-size:11px;font-weight:700;text-align:right}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.8}

.kpi,.stat{position:relative;padding:17px;overflow:hidden}
.kpi::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:var(--accent);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
  border-radius:0;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:700}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:16px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:4px;
  color:var(--ink);
  font-family:"Poppins",sans-serif;
  font-size:26px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
.tile{display:flex;flex-direction:column;gap:8px;padding:17px}
.tile b{font-size:14px}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}

 table{width:100%;border-collapse:collapse;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
th{
  padding:12px 14px;
  color:#fff;
  text-align:left;
  white-space:nowrap;
  background:var(--color-primary);
  border-right:1px solid #64748b;
  border-bottom:3px solid var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
th:last-child{border-right:0}
td{padding:12px 14px;white-space:nowrap;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:var(--hov)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-weight:700;letter-spacing:.01em}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:25px;
  padding:3px 8px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
}
.t-ok{color:#065f46;background:#d1fae5}
.t-warn{color:#713f12;background:#fef3c7}
.t-bad{color:#991b1b;background:#fee2e2}
.t-info{color:#1e3a8a;background:#dbeafe}
.t-gray{color:#334155;background:#e2e8f0}
.t-acc,.t-pink{color:#064e3b;background:var(--accent-soft)}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #94a3b8;border-radius:0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:40px;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:15px;height:15px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #94a3b8;font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed #94a3b8;font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:2px solid var(--ink);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 8px;border-bottom:2px solid var(--ink);font-family:"Poppins",sans-serif;font-size:12px;font-weight:700}
.col-h .cnt{padding:1px 7px;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.pcard{padding:11px 12px;background:#fff;border:1px solid var(--ink);border-left:6px solid var(--accent);border-radius:0}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who,.who{display:inline-flex;align-items:center;gap:6px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#fff;background:var(--color-primary);border-radius:0;font-weight:700}
.mini-av{width:20px;height:20px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:0}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:33px;height:33px;color:#fff;background:var(--color-primary);border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--muted);background:#fff;border:2px solid #94a3b8;border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.steps .ln{width:20px;height:3px;background:#94a3b8}
.steps .s.done{color:#fff;background:var(--accent);border-color:#065f46}
.steps .s.cur{color:#064e3b;border:3px solid var(--accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed #94a3b8}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid #94a3b8;border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:28px;background:var(--track);border:1px solid #94a3b8;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border:1px solid #064e3b;border-radius:0;box-shadow:none}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  #screen>.grid.g4:first-child>*:nth-child(1),#screen>.grid.g4:first-child>*:nth-child(4){transform:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--accent)}
  .brand{padding:15px 16px}
  .brand-logo{width:40px;height:40px;box-shadow:4px 4px 0 #020617}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0}
  .nav button{justify-content:center;padding:11px 8px;border-right:1px solid #334155;border-bottom:0}
  .nav button:first-child{border-top:0}
  .nav button:hover{transform:none}
  .nav button.on::before{inset:auto 0 0;width:auto;height:5px}
  .nav .idx{display:none}
  .side-foot{display:none}
  .main{padding:22px 16px 50px}
  .topbar{min-height:0}
}
@media(max-width:768px){
  .topbar{align-items:flex-start;flex-direction:column;padding:18px;box-shadow:5px 5px 0 var(--accent)}
  .topbar::before{display:none}
  .top-right{justify-content:flex-start}
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .nav button{min-height:48px}
  .nav button .txt{display:none}
  .nav button .material-symbols-outlined{font-size:22px}
  .main{padding:18px 12px 42px}
  .topbar h1{font-size:20px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
