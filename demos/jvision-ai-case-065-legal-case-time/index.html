// ---- charts ----
var _ch={};
function kill(id){if(_ch[id]){_ch[id].destroy();delete _ch[id];}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;kill(id);_ch[id]=new Chart(el,cfg);}
var FONT={family:'Inter, "Noto Sans TC", sans-serif'};
Chart.defaults.font.family='Inter, "Noto Sans TC", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#7a6653';

function draw(i){
 if(i==0){
  mk('c_hours',{type:'bar',data:{labels:LAWYERS.map(function(l){return l[0];}),datasets:[
    {label:'正常工時',data:LAWYERS.map(function(l){return Math.round(l[3]*0.82*10)/10;}),backgroundColor:'#7c2d12',stack:'h'},
    {label:'加班工時',data:LAWYERS.map(function(l){return Math.round(l[3]*0.18*10)/10;}),backgroundColor:'#e0a458',stack:'h'}]},
   options:{maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:'#efe4d3'}}}}});
  var typeCount={};CASES.forEach(function(c){typeCount[c[2]]=(typeCount[c[2]]||0)+1;});
  mk('c_type',{type:'doughnut',data:{labels:Object.keys(typeCount),datasets:[{data:Object.values(typeCount),backgroundColor:['#7c2d12','#b45309','#d98c3f','#e0a458','#a8907a','#c9b79c'],borderWidth:2,borderColor:'#fffdf9'}]},
   options:{maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom'}}}});
 }
 if(i==3){
  var cid=window._case||CASELIST[0];var entries=TIME_ENTRIES[cid];
  mk('c_case',{type:'doughnut',data:{labels:entries.map(function(e){return e[1];}),datasets:[{data:entries.map(function(e){return e[3];}),backgroundColor:['#7c2d12','#b45309','#d98c3f','#e0a458','#c9b79c'],borderWidth:2,borderColor:'#fffdf9'}]},
   options:{maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom'}}}});
 }
 if(i==4){
  mk('c_bill',{type:'line',data:{labels:['3月','4月','5月','6月','7月','8月'],datasets:[
    {label:'計費金額',data:[98,112,105,121,118,126],borderColor:'#7c2d12',backgroundColor:'rgba(124,45,18,.12)',fill:true,tension:.35,borderWidth:3,pointBackgroundColor:'#7c2d12'},
    {label:'實收金額',data:[92,104,101,110,113,118],borderColor:'#b45309',backgroundColor:'transparent',tension:.35,borderWidth:2,borderDash:[5,4],pointBackgroundColor:'#b45309'}]},
   options:{maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{grid:{display:false}},y:{grid:{color:'#efe4d3'},ticks:{callback:function(v){return v+'萬';}}}}}});
 }
}

function pickCase(c){window._case=c;view.innerHTML=SCREENS[3]();void view.offsetHeight;draw(3);}
function setCal(m){window._calmode=m;view.innerHTML=SCREENS[2]();void view.offsetHeight;draw(2);}
function show(i){
 nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
 for(var k in _ch){kill(k);}
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
