<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>診所營運管理｜Jvision 系統 Demo</title>
<meta name="description" content="預約、病歷、診療到申報回診的照護流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --teal:#0d9488; --teal-d:#0f766e; --emer:#059669; --ink:#0f2e2a; --body:#40564f; --muted:#78908a; --line:#dcebe7; --bg:#f2f8f6; --amber:#d97706; --red:#dc2626; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .shell{ display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  /* light sidebar */
  .side{ background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand{ padding:20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
  .brand .lg{ width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--teal),var(--emer)); color:#fff; display:grid; place-content:center; }
  .brand b{ color:var(--ink); font-size:15px; display:block; } .brand small{ color:var(--muted); font-size:11px; }
  .nav{ flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:3px; }
  .nav .t{ font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:10px 12px 6px; }
  .nav button{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0; color:var(--body); font:inherit; font-size:14px; font-weight:600; padding:11px 12px; border-radius:11px; cursor:pointer; }
  .nav button .material-symbols-outlined{ font-size:21px; color:var(--muted); }
  .nav button:hover{ background:var(--bg); }
  .nav button.on{ background:var(--teal); color:#fff; } .nav button.on .material-symbols-outlined{ color:#fff; }
  .nav .badge{ margin-left:auto; font-size:11px; font-weight:800; background:#fee2e2; color:#dc2626; border-radius:999px; padding:1px 8px; } .nav button.on .badge{ background:rgba(255,255,255,.25); color:#fff; }
  .side-f{ padding:14px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .doc{ display:flex; align-items:center; gap:10px; } .doc .av{ width:34px; height:34px; border-radius:50%; background:#ccfbf1; color:var(--teal-d); font-weight:800; display:grid; place-content:center; }
  /* main */
  .main{ min-width:0; }
  .top{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px; }
  .top h1{ margin:0; font-size:19px; font-weight:900; color:var(--ink); } .top .sub{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--teal-d); background:#ccfbf1; border-radius:999px; padding:6px 12px; }
  .body{ padding:22px 26px 44px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--teal); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--teal-d); border:1px solid var(--line); } .btn .material-symbols-outlined{ font-size:18px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); } .vh p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--teal); }
  .kpi .v{ font-size:27px; font-weight:900; color:var(--ink); margin-top:7px; } .kpi .v small{ font-size:14px; color:var(--muted); } .kpi .d{ font-size:12px; font-weight:800; color:var(--emer); margin-top:4px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--teal); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--teal); cursor:pointer; }
  /* queue */
  .q{ display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--line); } .q:first-of-type{ border-top:0; }
  .q-no{ width:42px; height:42px; border-radius:12px; background:#ccfbf1; color:var(--teal-d); font-weight:900; font-size:16px; display:grid; place-content:center; flex:none; }
  .q.cur .q-no{ background:var(--teal); color:#fff; box-shadow:0 0 0 4px #ccfbf1; }
  .q .info{ flex:1; } .q .info b{ color:var(--ink); font-size:14px; } .q .info small{ display:block; color:var(--muted); font-size:12px; }
  .q .st{ font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; } .s-cur{ background:#d1fae5; color:#065f46; } .s-wait{ background:#fef3c7; color:#92400e; } .s-done{ background:#f1f5f9; color:#64748b; }
  /* appointment timeline */
  .apt{ display:flex; gap:14px; padding:11px 0; border-top:1px solid var(--line); } .apt:first-of-type{ border-top:0; }
  .apt .tm{ font-weight:800; color:var(--teal-d); font-size:14px; width:52px; flex:none; }
  .apt .nm b{ color:var(--ink); } .apt .nm small{ display:block; color:var(--muted); font-size:12px; }
  .apt .dept{ margin-left:auto; font-size:11px; font-weight:700; color:var(--teal-d); background:#ccfbf1; border-radius:999px; padding:3px 10px; height:max-content; }
  /* patient record */
  .pt-hd{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .pt-av{ width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,#5eead4,#0d9488); color:#fff; display:grid; place-content:center; font-size:22px; font-weight:800; }
  .pt-hd b{ font-size:19px; color:var(--ink); } .pt-hd small{ color:var(--muted); font-size:13px; }
  .vitals{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px; margin-bottom:16px; }
  .vt{ background:var(--bg); border-radius:12px; padding:12px; text-align:center; } .vt b{ display:block; font-size:20px; color:var(--ink); font-weight:900; } .vt span{ font-size:11px; color:var(--muted); }
  .visit{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .visit .d{ font-size:12px; color:var(--muted); width:76px; flex:none; } .visit b{ color:var(--ink); font-size:13px; } .visit small{ display:block; color:var(--muted); font-size:12px; }
  /* table */
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; } .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:var(--bg); white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:var(--bg); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; } .g-ok{ background:#d1fae5; color:#065f46; } .g-wait{ background:#fef3c7; color:#92400e; } .g-rej{ background:#fee2e2; color:#991b1b; }
  /* form */
  .form{ display:grid; grid-template-columns:1fr 1fr; gap:14px; } .fld{ display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; color:var(--body); } .fld.full{ grid-column:1/-1; }
  .fld input,.fld select,.fld textarea{ border:1px solid var(--line); border-radius:9px; padding:10px 12px; font:inherit; font-size:13px; color:var(--ink); outline:none; } .fld input:focus,.fld textarea:focus,.fld select:focus{ border-color:var(--teal); box-shadow:0 0 0 3px #ccfbf1; }
  /* drug stock */
  .drugs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; } .drug{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; } .drug b{ color:var(--ink); font-size:14px; } .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin:9px 0 7px; } .bar span{ display:block; height:100%; } .drug small{ font-size:11px; color:var(--muted); } .lowt{ font-size:10px; font-weight:800; color:var(--red); background:#fee2e2; border-radius:6px; padding:2px 7px; }
  .chart{ width:100%; height:270px; }
  @media (max-width:900px){ .shell{ grid-template-columns:1fr; } .shell>*{ min-width:0; } .side{ position:static; height:auto; min-width:0; } .nav{ flex-direction:row; overflow-x:auto; min-width:0; } .nav button{ white-space:nowrap; flex:none; } .nav .t,.side-f{ display:none; } .main{ min-width:0; } .grid{ grid-template-columns:1fr !important; } .form{ grid-template-columns:1fr; } }
  @media (max-width:640px){ .top{ flex-wrap:wrap; padding:12px 16px; gap:8px; } .top h1{ font-size:17px; } .top .r{ width:100%; } .body{ padding:16px 14px 30px; } .kpis{ grid-template-columns:1fr 1fr; } .vitals{ grid-template-columns:1fr 1fr; } .apt .dept{ display:none; } .card{ padding:16px; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">local_hospital</span></span><div><b>診所營運管理</b><small>康和聯合診所</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><div class="doc"><span class="av">陳</span><div><b style="color:var(--ink);">陳醫師</b><div>家醫科 · 第 2 診間</div></div></div></div>
  </aside>
  <div class="main">
    <header class="top"><div><h1 id="vt">預約掛號</h1><div class="sub">2026-07-23 · 上午診</div></div><div class="r"><span class="pill"><span class="material-symbols-outlined" style="font-size:16px;">groups</span>候診 6 人</span><span class="pill" style="background:#fef3c7;color:#92400e;">今日 42 診次</span></div></header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MODS=[["event_available","預約掛號","6"],["folder_shared","病患病歷",""],["stethoscope","診療處置",""],["receipt_long","申報請款","3"],["notifications_active","回診追蹤",""],["medication","藥材庫存","2"]];
const NAMES=["預約掛號","病患病歷","診療處置","申報請款","回診追蹤","藥材庫存"];
const KPI=[["候診等待","12","分鐘","−更短"],["回診完成率","96","%","+37%"],["申報退件率","1.9","%","−76%"],["紀錄工時","1","小時/日","−更省"]];
const QUEUE=[["18","王美玲","家醫科 · 複診","cur","看診中"],["19","陳建宏","家醫科 · 初診","wait","候診"],["20","林淑芬","家醫科 · 慢箋","wait","候診"],["21","黃志偉","家醫科 · 複診","wait","候診"],["22","吳雅婷","家醫科 · 初診","wait","候診"],["23","張家豪","家醫科 · 複診","wait","候診"],["17","李佳穎","家醫科 · 複診","done","已完成"],["16","趙敏","家醫科 · 慢箋","done","已完成"]];
const APT=[["09:00","王美玲","65歲 · 高血壓複診","家醫科"],["09:15","陳建宏","42歲 · 感冒初診","家醫科"],["09:30","林淑芬","58歲 · 慢性病領藥","家醫科"],["09:45","黃志偉","33歲 · 健檢報告","家醫科"],["10:00","吳雅婷","28歲 · 過敏就診","家醫科"],["10:15","張家豪","50歲 · 定期追蹤","家醫科"],["10:30","劉冠廷","39歲 · 皮膚問題","皮膚科"],["10:45","蔡宜臻","71歲 · 用藥調整","家醫科"]];
const CLAIMS=[["IC-2401","王美玲","一般門診","2,340","ok","已申報"],["IC-2402","陳建宏","一般門診","890","wait","待申報"],["IC-2403","林淑芬","慢性病連續處方","1,560","ok","已申報"],["IC-2404","黃志偉","健康檢查","3,200","rej","退件補正"],["IC-2405","吳雅婷","一般門診","760","wait","待申報"],["IC-2406","張家豪","一般門診","1,120","ok","已申報"],["IC-2407","劉冠廷","一般門診","980","wait","待申報"]];
const RECALL=[["王美玲","高血壓 3 個月追蹤","08/20","已預約"],["林淑芬","慢性病連續處方","08/05","待通知"],["黃志偉","健檢異常複查","07/30","已通知"],["李佳穎","術後回診","07/28","已預約"],["趙敏","糖尿病季追蹤","09/10","待通知"],["蔡宜臻","用藥調整回診","08/02","已通知"]];
const DRUGS=[["Amlodipine 5mg",320,200],["Metformin 500mg",180,250],["Amoxicillin 250mg",90,120],["Loratadine 10mg",240,150],["Acetaminophen 500mg",600,300],["Omeprazole 20mg",70,100],["外用藥膏",45,60],["注射生理食鹽水",120,80]];
const av=n=>`<span class="pt-av">${n.slice(-1)}</span>`;
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l"><span class="material-symbols-outlined">monitoring</span>${k[0]}</div><div class="v">${k[1]}<small>${k[2]}</small></div><div class="d">${k[3]}</div></div>`).join("")}</div>`;
const SCREENS={
 0:()=>kpiRow()+`<div class="grid" style="grid-template-columns:1fr 1.15fr;"><div class="card"><h3><span class="material-symbols-outlined">groups</span>候診佇列<span class="grow">叫號 ›</span></h3>${QUEUE.map(q=>`<div class="q ${q[3]==="cur"?"cur":""}"><span class="q-no">${q[0]}</span><div class="info"><b>${q[1]}</b><small>${q[2]}</small></div><span class="st s-${q[3]}">${q[4]}</span></div>`).join("")}</div><div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>今日預約時段</h3>${APT.map(a=>`<div class="apt"><span class="tm">${a[0]}</span><div class="nm"><b>${a[1]}</b><small>${a[2]}</small></div><span class="dept">${a[3]}</span></div>`).join("")}</div></div>`,
 1:()=>`<div class="grid" style="grid-template-columns:1.4fr 1fr;"><div class="card"><div class="pt-hd">${av("王美玲")}<div><b>王美玲</b><br/><small>女 · 65 歲 · 病歷號 A00218 · 高血壓、高血脂</small></div></div><div class="vitals"><div class="vt"><b>138/86</b><span>血壓 mmHg</span></div><div class="vt"><b>72</b><span>心跳 bpm</span></div><div class="vt"><b>36.5</b><span>體溫 °C</span></div><div class="vt"><b>68</b><span>體重 kg</span></div></div><h3 style="font-size:14px;color:var(--ink);margin:6px 0 10px;">就診紀錄</h3>${[["07/23","本次","血壓偏高，續開 Amlodipine，衛教低鈉飲食"],["04/20","複診","血壓穩定，維持原處方"],["01/15","複診","調整降血脂藥物劑量"],["10/12","初診","診斷高血壓，開立降壓藥"]].map(v=>`<div class="visit"><span class="d">${v[0]}</span><div><b>${v[1]}</b><small>${v[2]}</small></div></div>`).join("")}</div><div class="card"><h3><span class="material-symbols-outlined">folder_shared</span>病患名冊</h3><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>病歷號</th><th>姓名</th><th>最近就診</th></tr></thead><tbody>${[["A00218","王美玲","07/23"],["A00219","陳建宏","07/23"],["A00187","林淑芬","07/23"],["A00092","黃志偉","07/23"],["A00305","吳雅婷","07/23"],["A00044","趙敏","07/22"],["A00211","李佳穎","07/22"]].map(r=>`<tr><td style="font-weight:800;color:var(--ink);">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></div></div>`,
 2:()=>`<div class="grid" style="grid-template-columns:1.3fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">edit_note</span>診療與醫囑 · 王美玲（18 號）</h3><div class="form"><label class="fld"><span>主訴</span><input value="頭暈、血壓偏高" /></label><label class="fld"><span>診斷 (ICD-10)</span><input value="I10 原發性高血壓" /></label><label class="fld"><span>科別</span><select><option>家醫科</option><option>內科</option></select></label><label class="fld"><span>看診醫師</span><select><option>陳醫師</option></select></label><label class="fld full"><span>處方</span><textarea rows="3">Amlodipine 5mg × 28 日\nAtorvastatin 10mg × 28 日</textarea></label><label class="fld full"><span>醫囑 / 衛教</span><textarea rows="2">低鈉飲食、規律量血壓，三個月後回診</textarea></label></div><div style="display:flex;gap:10px;margin-top:14px;"><button class="btn"><span class="material-symbols-outlined">save</span>完成看診並開單</button><button class="btn ghost">存草稿</button></div></div><div class="card"><h3><span class="material-symbols-outlined">medication</span>常用處方</h3>${["Amlodipine 5mg","Metformin 500mg","Loratadine 10mg","Acetaminophen 500mg","Omeprazole 20mg"].map(d=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);"><span style="font-weight:600;color:var(--ink);">${d}</span><button class="btn ghost" style="height:30px;padding:0 10px;">加入</button></div>`).join("")}</div></div>`,
 3:()=>`<div class="vh" style="margin-bottom:14px;"><div><h2 style="font-size:18px;">健保申報</h2><p>本月申報件數與退件狀態</p></div><button class="btn"><span class="material-symbols-outlined">send</span>批次申報</button></div><div class="card" style="padding:0;"><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>單號</th><th>病患</th><th>案別</th><th>點數</th><th>狀態</th></tr></thead><tbody>${CLAIMS.map(c=>`<tr><td style="font-weight:800;color:var(--ink);">${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><span class="tag g-${c[4]}">${c[5]}</span></td></tr>`).join("")}</tbody></table></div></div>`,
 4:()=>`<div class="grid" style="grid-template-columns:1.3fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>回診追蹤名單</h3><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>病患</th><th>回診原因</th><th>建議日期</th><th>狀態</th></tr></thead><tbody>${RECALL.map(r=>`<tr><td style="font-weight:700;color:var(--ink);">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3]==="待通知"?"g-wait":"g-ok"}">${r[3]}</span></td></tr>`).join("")}</tbody></table></div></div><div class="card"><h3><span class="material-symbols-outlined">campaign</span>自動提醒</h3><div style="background:var(--bg);border-radius:12px;padding:14px;font-size:13px;color:var(--body);line-height:1.7;">系統依慢性病回診週期與健檢異常，<b style="color:var(--ink);">自動排定回診並推播簡訊 / LINE 提醒</b>，降低漏診與失聯。<br/><br/>本週已發送 <b style="color:var(--teal-d);">28</b> 則提醒，回覆確認 <b style="color:var(--teal-d);">21</b> 位。</div></div></div>`,
 5:()=>`<div class="drugs">${DRUGS.map(d=>{const pct=Math.min(100,Math.round(d[1]/(d[2]*1.5)*100));const low=d[1]<d[2];return `<div class="drug"><div style="display:flex;justify-content:space-between;align-items:center;"><b>${d[0]}</b>${low?'<span class="lowt">補貨</span>':""}</div><div class="bar"><span style="width:${pct}%;background:${low?"var(--red)":"var(--emer)"};"></span></div><small>庫存 ${d[1]} · 安全量 ${d[2]}</small></div>`;}).join("")}</div>`
};
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt");
nav.innerHTML=`<div class="t">功能模組</div>`+MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}${m[2]?`<span class="badge">${m[2]}</span>`:""}</button>`).join("");
function show(i){nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));vt.textContent=NAMES[i];view.innerHTML=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${["線上預約、報到分診與候診叫號","病歷、生命徵象與就診紀錄","看診、醫囑與電子處方","健保申報與請款","主動回診排程與提醒","藥品與耗材庫存"][i]}</p></div></div>`+SCREENS[i]();}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
