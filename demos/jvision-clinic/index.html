<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>診所營運管理｜Jvision 系統 Demo</title>
<meta name="description" content="預約、病歷、診療到申報回診的照護流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');

:root {
  --color-primary: #0891b2;
  --color-on-primary: #000000;
  --color-secondary: #22d3ee;
  --color-on-secondary: #0f172a;
  --color-accent: #059669;
  --color-on-accent: #000000;
  --color-background: #ecfeff;
  --color-foreground: #164e63;
  --color-card: #ffffff;
  --color-card-foreground: #164e63;
  --color-muted: #e8f1f6;
  --color-muted-foreground: #475569;
  --color-border: #a5f3fc;
  --color-destructive: #dc2626;
  --color-on-destructive: #ffffff;
  --color-ring: #0891b2;

  --blue: #0891b2;
  --ink: #164e63;
  --muted: #475569;
  --line: #a5f3fc;

  --teal: var(--color-primary);
  --teal-d: #0e7490;
  --emer: var(--color-accent);
  --body: #334155;
  --bg: var(--color-background);
  --amber: #b45309;
  --red: var(--color-destructive);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 14px rgba(8, 145, 178, .05);
  --shadow-md: 0 8px 24px rgba(15, 78, 99, .09);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html,
body { margin: 0; min-height: 100%; }
body {
  font-family: "Atkinson Hyperlegible", "Microsoft JhengHei", sans-serif;
  background: var(--color-background);
  color: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button,
input,
select,
textarea { font: inherit; }
button,
select { cursor: pointer; }
::selection { background: var(--color-secondary); color: var(--color-on-secondary); }

:where(button, input, select, textarea, [tabindex]):focus-visible {
  outline: 3px solid var(--color-ring);
  outline-offset: 3px;
}

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  flex: none;
}

.shell {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  min-height: 100vh;
}

.side {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: var(--color-card);
  border-right: 1px solid var(--color-border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 80px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--color-border);
}
.brand .lg {
  display: grid;
  place-content: center;
  width: 42px;
  height: 42px;
  color: var(--color-on-primary);
  background: var(--color-primary);
  border: 1px solid #0e7490;
  border-radius: 8px;
}
.brand b {
  display: block;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: -.01em;
}
.brand small {
  color: var(--color-muted-foreground);
  font-size: 12px;
}

.nav {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 4px;
  padding: 18px 12px;
}
.nav .t {
  padding: 8px 12px 7px;
  color: var(--color-muted-foreground);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  color: var(--body);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  font-size: 15px;
  font-weight: 700;
  text-align: left;
  transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, transform 220ms ease;
}
.nav button .material-symbols-outlined {
  color: var(--color-muted-foreground);
  font-size: 21px;
}
.nav button:hover {
  color: var(--ink);
  background: var(--color-background);
  border-color: var(--color-border);
  transform: translateX(2px);
}
.nav button.on {
  color: var(--color-on-primary);
  background: var(--color-primary);
  border-color: #0e7490;
}
.nav button.on .material-symbols-outlined { color: var(--color-on-primary); }
.nav .badge {
  min-width: 24px;
  margin-left: auto;
  padding: 2px 7px;
  color: #991b1b;
  background: #fee2e2;
  border: 1px solid #fecaca;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
}
.nav button.on .badge {
  color: #0f172a;
  background: #cffafe;
  border-color: #164e63;
}
.side-f {
  padding: 16px 18px;
  color: var(--color-muted-foreground);
  border-top: 1px solid var(--color-border);
  font-size: 13px;
}
.doc { display: flex; align-items: center; gap: 10px; }
.doc .av {
  display: grid;
  place-content: center;
  width: 36px;
  height: 36px;
  color: #164e63;
  background: #cffafe;
  border: 1px solid var(--color-border);
  border-radius: 50%;
  font-weight: 700;
}

.main { min-width: 0; }
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 80px;
  padding: 14px clamp(18px, 3vw, 40px);
  background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--color-border);
  backdrop-filter: blur(10px);
}
.top h1 {
  margin: 0;
  color: var(--ink);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.top .sub {
  margin-top: 2px;
  color: var(--color-muted-foreground);
  font-size: 13px;
}
.top .r {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 5px 11px;
  color: #164e63;
  background: #cffafe;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.body {
  width: min(1500px, 100%);
  margin: 0 auto;
  padding: 28px clamp(18px, 3vw, 40px) 52px;
}

.vh {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.vh h2 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(23px, 2.2vw, 30px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.025em;
}
.vh p {
  max-width: 65ch;
  margin: 6px 0 0;
  color: var(--color-muted-foreground);
  font-size: 14px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 42px;
  padding: 0 16px;
  color: var(--color-on-accent);
  background: var(--color-accent);
  border: 1px solid #047857;
  border-radius: 7px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .12);
  font-size: 14px;
  font-weight: 700;
  transition: background-color 220ms ease, border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
}
.btn:hover {
  background: #10b981;
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn.ghost {
  color: #0e7490;
  background: var(--color-card);
  border-color: var(--color-border);
  box-shadow: none;
}
.btn.ghost:hover {
  color: #164e63;
  background: #ecfeff;
  border-color: var(--color-primary);
}
.btn .material-symbols-outlined { font-size: 19px; }

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.kpi,
.card,
.drug {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}
.kpi {
  position: relative;
  min-height: 132px;
  padding: 18px 19px;
  border-radius: 9px;
  overflow: hidden;
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
}
.kpi::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--color-primary);
  content: "";
}
.kpi:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.kpi .l {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--color-muted-foreground);
  font-size: 13px;
  font-weight: 700;
}
.kpi .l .material-symbols-outlined { color: #0e7490; font-size: 19px; }
.kpi .v {
  margin-top: 9px;
  color: var(--ink);
  font-size: 31px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
}
.kpi .v small {
  margin-left: 4px;
  color: var(--color-muted-foreground);
  font-size: 13px;
  letter-spacing: 0;
}
.kpi .d {
  margin-top: 8px;
  color: #047857;
  font-size: 12px;
  font-weight: 700;
}

.grid { display: grid; gap: 18px; }
.grid > * { min-width: 0; }
.card {
  min-width: 0;
  padding: 20px 22px;
  border-radius: 10px;
}
.card > h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.card > h3 .material-symbols-outlined { color: #0e7490; font-size: 21px; }
.card > h3 .grow {
  margin-left: auto;
  color: #0e7490;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: color 200ms ease;
}
.card > h3 .grow:hover { color: var(--ink); }

.q {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 68px;
  padding: 11px 2px;
  border-top: 1px solid var(--color-border);
}
.q:first-of-type { border-top: 0; }
.q-no {
  display: grid;
  place-content: center;
  width: 42px;
  height: 42px;
  color: #164e63;
  background: #cffafe;
  border: 1px solid var(--color-border);
  border-radius: 7px;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 15px;
  font-weight: 700;
}
.q.cur .q-no {
  color: var(--color-on-primary);
  background: var(--color-primary);
  border-color: #0e7490;
  box-shadow: 0 0 0 3px #cffafe;
}
.q .info { flex: 1; min-width: 0; }
.q .info b { color: var(--ink); font-size: 15px; }
.q .info small {
  display: block;
  color: var(--color-muted-foreground);
  font-size: 12px;
}
.q .st,
.tag,
.lowt {
  display: inline-flex;
  align-items: center;
  border: 1px solid currentColor;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.4;
  white-space: nowrap;
}
.q .st { padding: 3px 9px; border-radius: 999px; }
.s-cur,
.g-ok { color: #065f46; background: #d1fae5; }
.s-wait,
.g-wait { color: #92400e; background: #fef3c7; }
.s-done { color: #475569; background: #f1f5f9; }
.g-rej { color: #991b1b; background: #fee2e2; }

.apt {
  display: flex;
  gap: 14px;
  min-height: 62px;
  padding: 11px 2px;
  border-top: 1px solid var(--color-border);
}
.apt:first-of-type { border-top: 0; }
.apt .tm {
  width: 54px;
  flex: none;
  color: #0e7490;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 14px;
  font-weight: 700;
}
.apt .nm { min-width: 0; }
.apt .nm b { color: var(--ink); }
.apt .nm small {
  display: block;
  color: var(--color-muted-foreground);
  font-size: 12px;
}
.apt .dept {
  height: max-content;
  margin-left: auto;
  padding: 3px 9px;
  color: #164e63;
  background: #cffafe;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

.pt-hd {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.pt-av {
  display: grid;
  place-content: center;
  width: 56px;
  height: 56px;
  flex: none;
  color: var(--color-on-primary);
  background: var(--color-primary);
  border: 1px solid #0e7490;
  border-radius: 8px;
  font-size: 22px;
  font-weight: 700;
}
.pt-hd b { color: var(--ink); font-size: 20px; }
.pt-hd small { color: var(--color-muted-foreground); font-size: 13px; }
.vitals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.vt {
  padding: 13px 10px;
  text-align: center;
  background: var(--color-background);
  border: 1px solid var(--color-border);
  border-radius: 7px;
}
.vt b {
  display: block;
  color: var(--ink);
  font-size: 21px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.vt span { color: var(--color-muted-foreground); font-size: 11px; }
.visit {
  display: flex;
  gap: 12px;
  padding: 11px 0;
  border-top: 1px solid var(--color-border);
}
.visit .d {
  width: 76px;
  flex: none;
  color: var(--color-muted-foreground);
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 12px;
}
.visit b { color: var(--ink); font-size: 13px; }
.visit small { display: block; color: var(--color-muted-foreground); font-size: 12px; }

.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  color: var(--body);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.tbl th {
  padding: 12px;
  color: #334155;
  background: var(--color-muted);
  border-top: 1px solid var(--color-border);
  border-bottom: 1px solid var(--color-border);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .035em;
  text-align: left;
  text-transform: none;
  white-space: nowrap;
}
.tbl th:first-child { border-left: 1px solid var(--color-border); border-radius: 7px 0 0 0; }
.tbl th:last-child { border-right: 1px solid var(--color-border); border-radius: 0 7px 0 0; }
.tbl td {
  padding: 13px 12px;
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
  transition: background-color 180ms ease;
}
.tbl tbody tr:hover td { background: #ecfeff; }
.tbl td:first-child { font-variant-numeric: tabular-nums; }
.tbl td:nth-child(4):not(:last-child) { text-align: right; }
.tag { padding: 3px 9px; border-radius: 999px; }

.form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.fld {
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--body);
  font-size: 13px;
  font-weight: 700;
}
.fld.full { grid-column: 1 / -1; }
.fld input,
.fld select,
.fld textarea {
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  color: var(--ink);
  background: var(--color-card);
  border: 1px solid #94a3b8;
  border-radius: 7px;
  outline: none;
  font-size: 14px;
  transition: border-color 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
}
.fld textarea { resize: vertical; }
.fld input:hover,
.fld select:hover,
.fld textarea:hover { border-color: var(--color-primary); }
.fld input:focus,
.fld select:focus,
.fld textarea:focus {
  border-color: var(--color-ring);
  box-shadow: 0 0 0 3px rgba(8, 145, 178, .22);
}

.drugs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.drug {
  padding: 16px;
  border-radius: 9px;
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
}
.drug:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.drug b { color: var(--ink); font-size: 14px; }
.bar {
  height: 8px;
  margin: 11px 0 8px;
  overflow: hidden;
  background: #dbe7ec;
  border-radius: 999px;
}
.bar span { display: block; height: 100%; }
.drug small {
  color: var(--color-muted-foreground);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.lowt {
  padding: 2px 7px;
  color: #991b1b;
  background: #fee2e2;
  border-radius: 5px;
}
.chart { width: 100%; height: 270px; }

.body > .vh,
.body > .kpis,
.body > .grid,
.body > .card,
.body > .drugs {
  animation: reveal 360ms ease-out both;
}
.body > :nth-child(2) { animation-delay: 55ms; }
.body > :nth-child(3) { animation-delay: 90ms; }
@keyframes reveal {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1024px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr); }
  .body { padding-inline: 22px; }
  .grid { grid-template-columns: 1fr !important; }
}

@media (max-width: 768px) {
  .shell { grid-template-columns: 1fr; }
  .shell > * { min-width: 0; }
  .side {
    position: static;
    height: auto;
    min-width: 0;
    border-right: 0;
    border-bottom: 1px solid var(--color-border);
  }
  .brand { min-height: 68px; padding: 12px 16px; }
  .nav {
    flex-direction: row;
    gap: 6px;
    padding: 9px 12px 12px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .nav button { width: auto; min-width: max-content; flex: none; }
  .nav button:hover { transform: translateY(-1px); }
  .nav .t,
  .side-f { display: none; }
  .top { top: 0; min-height: 70px; padding: 12px 18px; }
  .main { min-width: 0; }
  .form { grid-template-columns: 1fr; }
  .fld.full { grid-column: auto; }
}

@media (max-width: 640px) {
  .top { align-items: flex-start; flex-wrap: wrap; gap: 8px; }
  .top h1 { font-size: 19px; }
  .top .r { width: 100%; margin-left: 0; overflow-x: auto; }
  .body { padding: 20px 14px 36px; }
  .vh { margin-bottom: 18px; }
  .vh h2 { font-size: 24px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { min-height: 122px; padding: 15px; }
  .kpi .v { font-size: 26px; }
  .card { padding: 17px 15px; }
  .vitals { grid-template-columns: 1fr 1fr; }
  .apt .dept { display: none; }
  .q { gap: 10px; }
  .q .st { padding-inline: 7px; }
}

@media (max-width: 420px) {
  .brand .lg { width: 38px; height: 38px; }
  .pill { font-size: 11px; }
  .kpis { grid-template-columns: 1fr; }
  .pt-hd { align-items: flex-start; }
  .pt-hd small { display: inline-block; margin-top: 3px; }
  .btn { min-height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .body > * { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">local_hospital</span></span><div><b>診所營運管理</b><small>康和聯合診所</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><div class="doc"><span class="av">陳</span><div><b style="color:var(--ink);">陳醫師</b><div>家醫科 · 第 2 診間</div></div></div></div>
  </aside>
  <div class="main">
