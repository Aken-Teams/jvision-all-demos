<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>改善提案管理系統 Kaizen / CI Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:#F1F5F9;
  --acc:var(--color-primary);
  --acc2:var(--color-accent);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --dim:#64748B;
  --ok:#15803D;
  --warn:#A16207;
  --bad:var(--color-destructive);
  --info:#0369A1;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  color:var(--txt);
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit}
button,.tab{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:20px;
  min-height:68px;
  padding:10px clamp(16px,3vw,40px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
.brand .logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:4px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.brand b{
  display:block;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand span{display:block;color:var(--dim);font-size:10px;letter-spacing:.08em}
.tabs{display:flex;align-items:center;gap:3px;flex:1;min-width:0}
.tab{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:42px;
  padding:8px 11px;
  color:var(--mut);
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.tab .material-symbols-outlined{font-size:18px}
.tab:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
.tab:active{transform:translateY(1px)}
.tab.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:0 3px 0 #1D4ED8;
}
.navstat{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  padding:6px 9px;
  color:#166534;
  background:#F0FDF4;
  border:1px solid #BBF7D0;
  border-radius:999px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.dot{width:8px;height:8px;display:inline-block;background:#16A34A;border:2px solid #DCFCE7;border-radius:50%;box-shadow:0 0 0 2px #16A34A}
.wrap{width:min(100%,1440px);margin:0 auto;padding:clamp(24px,3vw,42px) clamp(16px,3vw,40px) 64px}
.head{position:relative;margin-bottom:22px;padding:4px 0 17px;border-bottom:1px solid var(--line)}
.head::after{content:"";position:absolute;bottom:-1px;left:0;width:72px;height:3px;background:var(--color-primary)}
.head h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:#0F172A;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:clamp(21px,2.1vw,29px);
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.025em;
}
.head h1 .material-symbols-outlined{display:grid;place-items:center;width:34px;height:34px;color:var(--blue);background:#DBEAFE;border-radius:4px;font-size:21px}
.head p{max-width:880px;margin-top:8px;color:var(--mut);font-size:13px;line-height:1.7}
.panel{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.panel:hover{border-color:#CBD5E1;box-shadow:0 2px 3px rgba(15,23,42,.05),0 12px 30px rgba(15,23,42,.08)}
.panel h3{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:28px;
  margin-bottom:14px;
  color:#0F172A;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:.005em;
}
.panel h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.sub{margin-left:auto;color:var(--dim);font-family:"Fira Code",monospace;font-size:10px;font-weight:500;letter-spacing:.02em}
.g{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.g>*{min-width:0}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-top:3px solid var(--color-primary);
  border-radius:6px;
  box-shadow:0 1px 2px rgba(15,23,42,.05);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi::after{content:"";position:absolute;right:-22px;bottom:-26px;width:80px;height:80px;background:#EFF6FF;border-radius:50%}
.kpi:hover{transform:translateY(-2px);border-color:#93C5FD;box-shadow:0 8px 22px rgba(37,99,235,.1)}
.kpi .lab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;font-weight:500}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{position:relative;z-index:1;margin-top:9px;color:#0F172A;font-family:"Fira Code",monospace;font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:4px;color:var(--mut);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta{position:relative;z-index:1;margin-top:7px;font-size:11px;font-weight:600}
.up{color:#166534}.down{color:#B91C1C}.flat{color:var(--mut)}
.tblwrap{overflow-x:auto;background:#FFF;border:1px solid var(--line);border-radius:4px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th{
  padding:10px 12px;
  color:#334155;
  background:#F1F5F9;
  border-bottom:2px solid #CBD5E1;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
td{padding:11px 12px;color:var(--txt);background:#FFF;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F8FAFC}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.bg{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:600;
  line-height:1.3;
  white-space:nowrap;
}
.bg .material-symbols-outlined{font-size:13px}
.b-ok{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.b-warn{color:#854D0E;background:#FEF9C3;border-color:#FDE047}
.b-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.b-info{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.b-acc{color:#1D4ED8;background:#DBEAFE;border-color:#93C5FD}
.b-gray{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.chart{width:100%;height:280px}
.chart.sm{height:220px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0}
.kb>*{min-width:0}
.kcol{padding:11px;background:#F8FAFC;border:1px solid var(--line);border-radius:5px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:2px 2px 9px;border-bottom:2px solid var(--line);font-size:12.5px;font-weight:700}
.kcol .kh .cnt{min-width:25px;padding:2px 7px;color:#334155;background:#E2E8F0;border-radius:999px;font-family:"Fira Code",monospace;font-size:10px;text-align:center}
.kcard{margin-bottom:8px;padding:11px;background:#FFF;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .2s ease,box-shadow .2s ease}
.kcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.08)}
.kcard:last-child{margin-bottom:0}
.kcard .kt{color:#0F172A;font-size:12.5px;font-weight:600;line-height:1.45}
.kcard .km{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--dim);font-size:10.5px}
.kcard .kav{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;color:#FFF;background:var(--blue);border-radius:3px;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
.form>*{min-width:0}
.fld{padding:12px 13px;background:#F8FAFC;border:1px solid var(--line);border-radius:4px}
.fld label{display:block;margin-bottom:5px;color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.025em}
.fld .fv{color:#0F172A;font-size:13.5px;font-weight:600}
.fld.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:4px 9px;color:#475569;background:#FFF;border:1px solid #CBD5E1;border-radius:999px;font-size:11px}
.chip.on{color:#1E40AF;background:#DBEAFE;border-color:#60A5FA;font-weight:600}
.scorebar{height:7px;margin-top:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.scorebar i{display:block;height:100%;background:var(--color-primary);border-radius:2px}
.rrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rrow:last-child{border:0}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:6px;width:2px;background:#CBD5E1}
.tli{position:relative;padding:0 0 19px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;top:3px;left:-24px;width:12px;height:12px;background:#FFF;border:3px solid var(--blue);border-radius:50%;box-shadow:0 0 0 3px #DBEAFE}
.tli.done::before{background:#15803D;border-color:#15803D;box-shadow:0 0 0 3px #DCFCE7}
.tli .tt{color:#0F172A;font-size:12.5px;font-weight:700}
.tli .td{margin-top:3px;color:var(--mut);font-size:11.5px;line-height:1.55}
.tli .tm{margin-top:4px;color:var(--dim);font-family:"Fira Code",monospace;font-size:10px}
.award{position:relative;overflow:hidden;padding:17px;background:#FFF;border:1px solid var(--line);border-top:4px solid var(--color-accent);border-radius:5px;box-shadow:var(--shadow)}
.award::after{content:"";position:absolute;right:-24px;bottom:-30px;width:90px;height:90px;background:#FFF7ED;border-radius:50%}
.award .rk{position:absolute;top:10px;right:13px;color:#CBD5E1;font-family:"Fira Code",monospace;font-size:27px;font-weight:700}
.award .nm{position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:#0F172A;font-size:14px;font-weight:700}
.award .pt{position:relative;z-index:1;margin-top:9px;color:#C2410C;font-family:"Fira Code",monospace;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
.award .pt small{margin-left:4px;color:var(--mut);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:11px;font-weight:600}
.award .meta{position:relative;z-index:1;margin-top:6px;color:var(--mut);font-size:11px}
.medal{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border:1px solid rgba(15,23,42,.12);border-radius:4px;font-size:16px}
.m1{color:#713F12;background:#FEF3C7}.m2{color:#334155;background:#E2E8F0}.m3{color:#7C2D12;background:#FFEDD5}
.mtx{display:grid;grid-template-columns:auto repeat(3,minmax(110px,1fr));gap:6px;min-width:520px}
.mtx .mc{padding:10px 8px;border-radius:3px;font-size:11.5px;font-weight:600;text-align:center}
.mtx .mh{display:flex;align-items:center;justify-content:center;color:#334155;background:#E9EFF8}
.mtx .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;color:#1E293B;border:1px solid rgba(71,85,105,.12)}
.mtx .cell b{font-family:"Fira Code",monospace;font-size:16px;font-variant-numeric:tabular-nums}
.mtx .cell span{font-size:10px}
.progline{display:flex;align-items:center;gap:8px}
.progline .pb{min-width:40px;height:7px;flex:1;overflow:hidden;background:#E2E8F0;border-radius:2px}
.progline .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:2px}
.progline span{width:36px;flex:none;color:var(--mut);font-family:"Fira Code",monospace;font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--mut);font-size:10.5px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border:1px solid rgba(15,23,42,.18);border-radius:2px;vertical-align:middle}
.note{display:flex;align-items:flex-start;gap:7px;margin-top:11px;padding:9px 10px;color:#334155;background:#EFF6FF;border-left:3px solid var(--blue);font-size:11px;line-height:1.55}
.note .material-symbols-outlined{flex:none;margin-top:1px;color:var(--blue);font-size:15px}
.foot{margin-top:38px;padding-top:17px;color:var(--dim);border-top:1px solid var(--line);font-family:"Fira Code",monospace;font-size:10px;text-align:center}
#app>.head,#app>.g,#app>.panel{animation:enter .4s cubic-bezier(.34,1.35,.64,1) both}
#app>.g{animation-delay:.05s}
#app>.panel{animation-delay:.1s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:1120px){
  .nav{gap:12px;padding-inline:18px;flex-wrap:wrap}
  .brand{margin-right:auto}
  .tabs{order:3;width:100%;overflow-x:auto;padding:2px 0 5px;scrollbar-width:thin}
  .tab{flex:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .kb{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .navstat{font-size:10px}
  .wrap{padding-top:26px}
}
@media(max-width:560px){
  .nav{padding:9px 14px}
  .brand .logo{width:34px;height:34px}
  .navstat{padding:5px 7px}
  .tabs{gap:5px}
  .tab{min-width:44px;min-height:44px;padding:9px 11px}
  .tlab{display:none}
  .g4,.kb{grid-template-columns:1fr}
  .panel,.kpi{padding:14px}
  .head h1{align-items:flex-start}
  .chart{height:260px}
  .chart.sm{height:220px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #app>.head,#app>.g,#app>.panel{opacity:1;transform:none}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">lightbulb</span></div>
    <div><b>Kaizen CI</b><span>改善提案管理系統</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="navstat"><span class="dot"></span>Live · 廠區 A</div>
</nav>
<div class="wrap">
  <div id="app"></div>
  <div class="foot">改善提案管理系統 Kaizen / CI Management System · 純前端 UI 展示 · 資料為模擬示意</div>
</div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el,null,{renderer:"canvas"});c.setOption(opt);charts.push(c);}
var AX="#475569", GRID="#E2E8F0", ACC="#2563EB", ACC2="#EA580C";
function baseGrid(){return{left:8,right:14,top:24,bottom:6,containLabel:true};}

var MODS=[
  {icon:"lightbulb",name:"提案登錄"},
  {icon:"fact_check",name:"審核評估"},
  {icon:"assignment_ind",name:"執行分派"},
  {icon:"trending_up",name:"成效追蹤"},
  {icon:"emoji_events",name:"獎勵歸檔"},
  {icon:"insights",name:"分析儀表板"}
];

function kpi(ic,lab,val,unit,dir,delta){
  var ar=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":dir==="warn"?"priority_high":"remove";
  var cls=dir==="up"?"up":dir==="down"||dir==="warn"?"down":"flat";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'
    +'<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
    +'<div class="delta '+cls+'"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px">'+ar+'</span>'+delta+'</div></div>';
}
function fld(l,v,full){
  return '<div class="fld'+(full?' full':'')+'"><label>'+l+'</label><div class="fv">'+v+'</div></div>';
}
function stepRow(t,p,cls){
  return '<div class="progline" style="margin:9px 0"><span style="flex:0 0 46%;font-size:12px;font-family:Noto Sans TC;color:'+(cls==="done"?"var(--txt)":"var(--mut)")+'">'+(cls==="done"?'<span class="material-symbols-outlined" style="font-size:15px;color:var(--ok)">check_circle</span> ':'')+t+'</span><span class="pb"><i style="width:'+p+'%"></i></span><span>'+p+'%</span></div>';
}
function tli(cls,t,d,m){

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeCharts();
  var tabs=document.querySelectorAll("#tabs .tab");
  for(var k=0;k<tabs.length;k++){tabs[k].classList.toggle("on",+tabs[k].getAttribute("data-i")===i);}
  SCREENS[i]();
  try{window.scrollTo(0,0);}catch(e){}
}
(function(){
  var t=document.getElementById("tabs"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="tab" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="tlab">'+MODS[i].name+'</span></button>';
  }
  t.innerHTML=h;
  var btns=t.querySelectorAll(".tab");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
})();
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
