<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>外派與駐外人員管理 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E6FFFA;
  --hov:#F0FDFA;
  --track:#CCFBF1;
  --sidebar:#134E4A;
  --sidebar2:#134E4A;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:12px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--bg);
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  margin:0;
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-weight:700;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  width:248px;
  height:100vh;
  padding:24px 16px;
  overflow-y:auto;
  color:#F0FDFA;
  background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 8px 24px}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:#042F2E;
  background:var(--color-secondary);
  border:2px solid #99F6E4;
  border-radius:10px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;line-height:1.1;letter-spacing:.02em}
.brand-txt span{
  display:block;
  margin-top:5px;
  color:#99F6E4;
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.11em;
}
.nav{display:flex;flex-direction:column;gap:7px;min-width:0;margin-top:4px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:44px;
  padding:10px 12px;
  color:#CCFBF1;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#FFFFFF;background:#0F766E;border-color:#2DD4BF}
.nav button.on{color:#042F2E;background:var(--color-secondary);border-color:#99F6E4}
.nav .idx{
  margin-left:auto;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  opacity:.78;
}
.side-foot{
  margin-top:auto;
  padding:16px 9px 2px;
  color:#CCFBF1;
  border-top:1px solid #2DD4BF;
  font-size:12px;
  line-height:1.7;
}
.side-foot b{color:#FFFFFF}
.main{flex:1;min-width:0;padding:28px 30px 64px}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:2px solid var(--line);
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:27px;line-height:1.1;color:#134E4A}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:27px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 12px;
  color:#334155;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;background:var(--ok);border:2px solid #DCFCE7;border-radius:50%;animation:pulse 2s ease-in-out infinite}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:#042F2E;
  background:var(--color-secondary);
  border:2px solid var(--accent);
  border-radius:8px;
  font-weight:700;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card,.sec,.kpi,.stat,.tile,.col,.pcard,.lane-row{transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:var(--accent)}
.sec>h3,.card-h{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:15px;
  padding-bottom:11px;
  border-bottom:2px solid var(--accent-soft);
}
.sec>h3{font-size:17px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{justify-content:space-between;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:17px}
.card-h .hint{color:var(--muted);font-size:12px}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;border-bottom:1px solid var(--line)}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:13px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:17px 18px;border-left:5px solid var(--accent)}
.kpi::after{display:none}
.kpi .ico{
  display:flex;
  position:absolute;
  top:15px;
  right:15px;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  color:#0F766E;
  background:var(--accent-soft);
  border:1px solid var(--line);
  border-radius:8px;
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:0;padding-right:38px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:16px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:6px;
  color:#134E4A;
  font-family:"Crimson Pro",serif;
  font-size:30px;
  font-weight:600;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:14px;font-weight:600}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:12px;font-weight:700}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card>div[style*="overflow-x:auto"],.card.pad0>div[style*="overflow-x:auto"]{scrollbar-color:var(--accent) var(--accent-soft)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{
  padding:12px 14px;
  color:#134E4A;
  text-align:left;
  white-space:nowrap;
  background:var(--th);
  border-bottom:2px solid var(--line);
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
td{padding:12px 14px;white-space:nowrap;border-bottom:1px solid #BCEFE7}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color 160ms ease}
tbody tr:hover{background:var(--hov)}
th:nth-last-child(-n+3),td:nth-last-child(-n+3){font-variant-numeric:tabular-nums}
td:has(.prog),td:has(.band){min-width:150px}
.mono,td:first-child{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-weight:600;
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  white-space:nowrap;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #99F6E4;border-radius:4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:40px;color:var(--muted);font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-26px;width:15px;height:15px;background:#FFFFFF;border:4px solid var(--accent);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}

.chk{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #BCEFE7;font-size:13px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{flex:none;font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px;text-align:right}
.note{margin-top:14px;padding:12px 13px;color:#334155;background:#FFFBEB;border:1px solid #F59E0B;border-left:4px solid var(--color-accent);border-radius:7px;font-size:12px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--th);border:1px solid var(--line);border-radius:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;font-size:13px;font-weight:700}
.col-h .cnt{padding:2px 8px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:5px;font-size:11px}
.pcard{padding:12px;background:#FFFFFF;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px}
.pcard:hover{border-color:var(--accent)}
.pcard b{font-size:14px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#115E59;background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;font-weight:800}
.mini-av{width:20px;height:20px;font-size:9px}
.av{width:28px;height:28px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;background:#FFFFFF;border:1px solid var(--line);border-radius:9px}
.lane-row:hover{border-color:var(--accent)}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#115E59;background:var(--accent-soft);border:1px solid var(--line);border-radius:7px;font-family:ui-monospace,Consolas,monospace;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:15px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{display:flex;align-items:center;justify-content:center;z-index:1;width:24px;height:24px;color:#64748B;background:#FFFFFF;border:2px solid #94A3B8;border-radius:50%;font-size:11px}
.steps .ln{width:20px;height:2px;background:#94A3B8}
.steps .s.done{color:#FFFFFF;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:#0F766E;border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 4px;border-bottom:1px solid #BCEFE7}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border:1px solid #99F6E4;border-radius:4px}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{display:block;margin-top:4px;color:var(--muted);font-size:10px;text-align:right;font-variant-numeric:tabular-nums}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border:1px solid #99F6E4;border-radius:5px}
.band .rng{position:absolute;top:0;bottom:0;background:#99F6E4;border-radius:4px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--accent);border:2px solid #134E4A;border-radius:3px}

.tile{display:flex;position:relative;flex-direction:column;gap:8px;padding:17px 18px;border-left:5px solid var(--accent)}
.tile .ti{display:flex;position:absolute;top:14px;right:14px;align-items:center;justify-content:center;width:34px;height:34px;color:#0F766E;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{padding-right:38px;font-size:16px}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
.tile .tv{font-size:29px}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important;fill:#475569!important;color:#475569!important}
.apexcharts-gridline{stroke:#BCEFE7!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;box-shadow:none!important}
.apexcharts-tooltip-title{background:var(--th)!important;border-bottom:1px solid var(--line)!important}
.apexcharts-series:nth-child(1) path{stroke:#0D9488}
.apexcharts-series:nth-child(2) path{stroke:#D97706}
.apexcharts-legend-marker{border-radius:2px!important}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:16px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{position:sticky;top:20px;grid-column:2;grid-row:1 / span 99;display:flex;flex-direction:column;gap:12px}
  #screen>.grid.g4:first-child>*{width:100%}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:2px 4px 12px}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .nav button{justify-content:center;padding:9px 8px;white-space:normal;text-align:center}
  .nav .idx{display:none}
  .side-foot{display:none}
  .main{padding:21px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  body{font-size:14px}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .board{grid-template-columns:1fr}
  .sidebar{padding:11px 10px}
  .brand-logo{width:38px;height:38px}
  .brand-txt b{font-size:16px}
  .nav{grid-template-columns:repeat(4,1fr)}
  .nav button{min-height:46px;padding:8px 4px}
  .nav button .txt{display:none}
  .topbar{display:block;margin-bottom:17px;padding-bottom:15px}
  .topbar h1{font-size:23px}
  .top-right{justify-content:flex-start;margin-top:14px}
  .chip{padding:6px 9px;font-size:11px}
  .card,.sec{padding:15px}
  .kpi,.stat{padding:14px 12px}
  .kpi .ico{display:none}
  .kpi .lbl,.stat .lbl{padding-right:0;font-size:11px}
  .kpi .val,.stat .val{font-size:25px}
  .kpi .delta,.stat .d{font-size:10px}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
  .lane-row{align-items:flex-start;flex-wrap:wrap}
  .steps{width:100%;padding-left:45px}
}
@media(max-width:390px){
  .main{padding-right:12px;padding-left:12px}
  .g4{grid-template-columns:1fr}
  .top-right .avatar{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">public</span></div>

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
