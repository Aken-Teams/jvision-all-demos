<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>裝櫃與裝載優化 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#f0fdf4;
  --track:#e6e8ea;
  --sidebar:#334155;
  --sidebar2:#334155;
  --side-edge:rgba(255,255,255,.18);
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#1d4ed8;
  --r:8px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  color:inherit;
  font-family:"Poppins","Open Sans",sans-serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#a7f3d0;color:#0f172a}

.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  width:100%;
  min-width:0;
  height:68px;
  padding:0 28px;
  gap:24px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-bottom:1px solid #1e293b;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 0 auto}
.brand-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  flex:none;
  border:1px solid rgba(255,255,255,.35);
  border-radius:7px;
  background:var(--color-accent);
  color:#fff;
}
.brand-logo .material-symbols-outlined{font-size:22px}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.02em;color:#fff}
.brand-txt span{display:block;color:#cbd5e1;font-size:9.5px;font-weight:700;letter-spacing:.14em}
.nav{
  display:flex;
  flex:1;
  min-width:0;
  gap:4px;
  margin:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:flex;
  align-items:center;
  min-height:44px;
  flex:0 0 auto;
  gap:8px;
  padding:9px 13px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#e2e8f0;
  font-size:13px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease;
}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav button:hover{background:#475569;color:#fff;border-color:#64748b}
.nav button.on{background:#fff;color:#0f172a;border-color:#fff}
.nav button.on .material-symbols-outlined{color:var(--color-accent)}
.nav .idx{margin-left:4px;color:currentColor;font:600 10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.65}
.side-foot{display:none}
.main{width:100%;max-width:1600px;margin:0 auto;padding:22px 30px 54px;min-width:0}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px solid var(--color-border);
}
.topbar h1{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:600;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{color:var(--color-accent);font-size:25px}
.topbar .sub{margin-top:3px;color:var(--color-muted-foreground);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  min-height:34px;
  gap:7px;
  padding:5px 10px;
  border:1px solid var(--color-border);
  border-radius:6px;
  background:var(--color-card);
  color:var(--color-muted-foreground);
  font-size:11.5px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  flex:none;
  border:1px solid #065f46;
  border-radius:6px;
  background:var(--color-accent);
  color:#fff;
  font-weight:700;
  font-size:12px;
}

.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  border:1px solid var(--color-border);
  border-radius:var(--r);
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:none;
}
.card,.sec{padding:16px}
.sec{margin-bottom:12px}
.card,.kpi,.stat,.tile,.lane-row,.pcard{
  transition:border-color 150ms ease,background-color 150ms ease,color 150ms ease;
}
.card:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#94a3b8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:600;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--color-accent);font-size:18px}
.card-h .hint{color:var(--color-muted-foreground);font-size:11px}
.sec>h3{margin-bottom:12px}
.sec>p{margin:0 0 12px;color:var(--color-muted-foreground);font-size:13px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:13px}
.dl dt{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat,.tile{position:relative;overflow:hidden;padding:15px 16px;border-top:3px solid var(--color-primary)}
.kpi::after{display:none}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border:1px solid #a7f3d0;
  border-radius:6px;
  background:#ecfdf5;
  color:#047857;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--color-muted-foreground);font-size:11.5px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;
  color:var(--color-foreground);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:26px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--color-muted-foreground);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#b91c1c}
.delta.flat,.d.flat{color:var(--color-muted-foreground)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:7px}
.tile b{font-size:13px;font-weight:600}
.tile p{margin:0;color:var(--color-muted-foreground);font-size:11.5px;line-height:1.55}
.tile .tv{font-size:25px}
.av,.mini-av{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border:1px solid #a7f3d0;
  border-radius:50%;
  background:#ecfdf5;
  color:#047857;
  font-weight:700;
}
.av{width:26px;height:26px;font-size:11px}
.mini-av{width:18px;height:18px;font-size:9px}
.who{display:inline-flex;align-items:center;gap:6px}

.card.pad0 .card-h{padding:16px 16px 0!important}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:10px 12px;
  border-bottom:1px solid #cbd5e1;
  background:var(--color-muted);
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--color-border);white-space:nowrap}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover{background:var(--hov)}
tr:last-child td{border-bottom:none}
td:nth-child(n+4){text-align:right}
th:nth-child(n+4){text-align:right}
.mono,td:first-child{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.t-ok{background:#ecfdf5;color:#047857}
.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#eff6ff;color:#1d4ed8}
.t-gray{background:#f8fafc;color:#475569}
.t-acc,.t-pink{background:#ecfdf5;color:#047857}

.bar{height:7px;min-width:56px;overflow:hidden;border-radius:3px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--color-accent)}
.prog{display:flex;align-items:center;gap:7px;min-width:0}
.prog small{width:38px;flex:none;color:#334155;font-size:10.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--color-border)}
.tl-item,.tl-i{position:relative;padding:0 0 16px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-22px;top:3px;width:13px;height:13px;border:3px solid var(--color-accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--color-muted-foreground);font:600 10.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--color-muted-foreground);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #cbd5e1;font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--color-muted-foreground)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--color-muted-foreground);font-size:11px}
.note{margin-top:12px;padding-top:11px;border-top:1px dashed #cbd5e1;color:var(--color-muted-foreground);font-size:11.5px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--color-border);border-radius:7px;background:var(--color-muted)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:12px;font-weight:600}
.col-h .cnt{padding:1px 7px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:var(--color-muted-foreground);font-size:10.5px}
.pcard{padding:10px 11px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:5px;background:#fff}
.pcard:hover{border-color:#94a3b8;border-left-color:#047857}
.pcard b{font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-size:10.5px}
.pcard .who{margin-top:7px;color:var(--color-foreground);font-size:10.5px}
.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 13px;border:1px solid var(--color-border);border-radius:7px;background:#fff}
.lane-row:hover{border-color:#94a3b8;background:#f8fafc}
.lane-row .num{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border:1px solid #a7f3d0;border-radius:5px;background:#ecfdf5;color:#047857;font-weight:700;font-variant-numeric:tabular-nums}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--color-muted-foreground);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{display:flex;align-items:center;justify-content:center;width:22px;height:22px;z-index:1;border:2px solid #cbd5e1;border-radius:50%;background:#fff;color:#64748b;font-size:10px}
.steps .ln{width:18px;height:2px;background:#cbd5e1}
.steps .s.done{border-color:var(--color-accent);background:var(--color-accent);color:#fff}
.steps .s.cur{border-color:var(--color-accent);color:#047857}
.steps .ln.done{background:var(--color-accent)}
.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 3px;border-bottom:1px dashed #cbd5e1}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12.5px}
.rep-row .sku span{color:var(--color-muted-foreground);font-size:10.5px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;border-radius:3px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:3px;background:var(--color-accent)}
.gauge small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:10px;text-align:right;font-variant-numeric:tabular-nums}
.band{position:relative;height:26px;min-width:150px;border-radius:5px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:5px;background:#a7f3d0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--color-secondary)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:3px;background:var(--color-accent)}

#screen{animation:screen-in 350ms ease-out both}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sidebar{padding:0 18px;gap:15px}
  .main{padding-inline:20px}
}
@media(max-width:900px){
  .sidebar{position:relative;height:auto;min-height:68px;flex-wrap:wrap;padding:10px 16px;gap:9px 16px}
  .nav{width:100%;order:2}
  .nav button{min-height:42px;padding:8px 11px}
  .main{padding:18px 16px 44px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
  .top-right{justify-content:flex-start}
}
@media(max-width:560px){
  .brand-txt span{display:none}
  .nav button .txt{display:none}
  .nav button{justify-content:center;min-width:44px;padding:9px}
  .nav .idx{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
  .topbar{flex-direction:column}
  .topbar h1{font-size:18px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .kpi .val,.stat .val,.tile .tv{font-size:22px}
  .card,.sec{padding:14px}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dt{margin-top:8px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .main{padding-inline:12px}
  .top-right{display:grid;grid-template-columns:1fr 1fr}
  .avatar{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">view_in_ar</span></div>
      <div class="brand-txt"><b>裝載優化台</b><span>LOAD OPTIMIZATION</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08 當期<br/>平均裝載率 84.6%<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
