<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>冷鏈/特殊儲存環境監控系統｜Cold Chain & Environmental Monitoring</title>
<meta name="description" content="溫濕度即時監控、超標告警處置、感測器管理、環境數據履歷與冷鏈稽核合規報表的單一控制台。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --cool:#0369a1;
  --radius:14px;
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Open Sans",sans-serif;
  line-height:1.55;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.mono,.val,.vv,td:nth-child(1),td:nth-child(4),td:nth-child(5){
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.skip{
  position:fixed;left:16px;top:-60px;z-index:100;
  padding:10px 14px;border-radius:8px;background:var(--color-primary);
  color:#fff;text-decoration:none;
}
.skip:focus{top:16px}

/* Navigation */
.nav{
  position:sticky;top:0;z-index:40;
  background:rgba(248,250,252,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.nav-in{max-width:1440px;margin:auto;padding:12px 24px 0}
.nav-top{display:flex;align-items:center;gap:16px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:42px;height:42px;display:grid;place-items:center;flex:none;
  border-radius:10px;background:var(--color-primary);color:#fff;
}
.logo .ms{font-size:23px}
.brand-title{
  font-family:"Poppins",sans-serif;font-size:15px;font-weight:700;
  letter-spacing:-.01em;
}
.brand-sub{font-size:11px;color:var(--muted)}
.live{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  padding:7px 11px;border:1px solid #a7f3d0;border-radius:999px;
  background:#ecfdf5;color:#065f46;font-size:12px;font-weight:700;
}
.live .ms{font-size:17px}
.tabs{
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;
  padding-bottom:0;
}
.tab{
  display:flex;align-items:center;gap:7px;flex:none;
  min-height:44px;padding:10px 13px;border:0;border-bottom:3px solid transparent;
  background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;
  transition:color 150ms ease,background 150ms ease,border-color 150ms ease;
}
.tab:hover{background:var(--color-muted);color:var(--ink)}
.tab.on{color:var(--color-accent);border-bottom-color:var(--color-accent)}
.tab .ms{font-size:19px}

/* Layout */
.wrap{max-width:1440px;margin:auto;padding:28px 24px 64px}
.head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:18px;margin-bottom:20px;
}
.eyebrow{
  margin-bottom:6px;color:var(--color-accent);
  font-family:"Poppins",sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;
}
.head h1{
  margin:0;font-family:"Poppins",sans-serif;
  font-size:clamp(25px,3vw,34px);line-height:1.2;letter-spacing:-.035em;
}
.head p{max-width:720px;margin:8px 0 0;color:var(--muted);font-size:13.5px}
.badge{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  min-height:40px;padding:8px 12px;border:1px solid #a7f3d0;
  border-radius:10px;background:#ecfdf5;color:#065f46;
  font-size:12px;font-weight:700;
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.section-gap{margin-bottom:14px}
.card{
  background:var(--color-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:17px;
  transition:border-color 150ms ease,background 150ms ease,transform 150ms ease;
}
.card:hover{border-color:#cbd5e1;background:#fdfefe}
.card.pad0{padding:0;overflow:hidden}
.ctitle{
  display:flex;align-items:center;gap:8px;margin:0 0 14px;
  color:var(--ink);font-family:"Poppins",sans-serif;
  font-size:13px;font-weight:600;
}
.ctitle .ms{font-size:20px;color:var(--color-accent)}
.ctitle small{margin-left:auto;color:var(--muted);font:600 10.5px "Open Sans",sans-serif}

/* KPI */
.kpi{position:relative;padding-left:20px;overflow:hidden}
.kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--kpi,var(--color-accent));
}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi .lab .ms{font-size:18px;color:var(--kpi,var(--color-accent))}
.kpi .val{margin-top:9px;font-size:29px;font-weight:700;line-height:1.15;letter-spacing:-.04em}
.kpi .val small{margin-left:4px;color:var(--muted);font:700 13px "Open Sans",sans-serif}
.kpi .sub{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11.5px;font-weight:600}
.kpi .sub .ms{font-size:16px}
.up{color:#047857}.down{color:#b91c1c}.wn{color:#92400e}

/* Status */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;border:1px solid transparent;border-radius:999px;
  font-size:10.5px;font-weight:700;white-space:nowrap;
}
.tag .ms{font-size:14px}
.t-ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.t-warn{background:#fffbeb;border-color:#fde68a;color:#854d0e}
.t-bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.t-cool{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.t-dim{background:var(--color-muted);border-color:var(--line);color:var(--muted)}

/* Charts and tables */
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}.chart.lg{height:320px}
.tbl-wrap{overflow-x:auto}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:12.5px}
th{
  padding:11px 13px;border-bottom:1px solid #cbd5e1;
  background:var(--color-muted);color:#334155;text-align:left;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
}
td{padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
td:nth-child(4),td:nth-child(5){text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background 150ms ease}
tbody tr:hover{background:#f8fafc}

/* Zone map */
.sensmap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.zone{
  position:relative;padding:14px 12px;border:1px solid var(--line);
  border-top:4px solid var(--state);border-radius:11px;background:#fff;
  transition:background 150ms ease,border-color 150ms ease,transform 150ms ease;
}
.zone:hover{background:var(--state-bg);transform:translateY(-2px)}
.zone.z-ok{--state:#059669;--state-bg:#f0fdf4}
.zone.z-warn{--state:#ca8a04;--state-bg:#fffbeb}
.zone.z-bad{--state:#dc2626;--state-bg:#fef2f2}
.zone .zn{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:700}
.zone .zt{margin-top:8px;font-size:23px;font-weight:700;line-height:1}
.zone .zt small{margin-left:2px;color:var(--muted);font-size:11px}
.zone .zh{margin-top:7px;color:var(--muted);font-size:10.5px}
.zone .state{
  display:flex;align-items:center;gap:4px;margin-top:9px;
  color:var(--state);font-size:10.5px;font-weight:700;
}
.zone .state .ms{font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .ms{font-size:15px}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{padding:10px;border:1px solid var(--line);border-radius:11px;background:#f8fafc}
.col h4{display:flex;align-items:center;gap:7px;margin:0 0 10px;font-size:12px}
.col h4 .n{
  margin-left:auto;padding:2px 7px;border:1px solid var(--line);
  border-radius:999px;background:#fff;color:var(--muted);font-size:10px;
}
.tk{
  margin-bottom:8px;padding:11px;border:1px solid var(--line);
  border-radius:9px;background:#fff;
  transition:border-color 150ms ease,transform 150ms ease;
}
.tk:hover{border-color:#94a3b8;transform:translateY(-1px)}
.tk:last-child{margin-bottom:0}
.tk .tt{margin-bottom:6px;font-size:12px;font-weight:700}
.tk .m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}

/* Bars, timeline, stats */
.pbar{height:7px;overflow:hidden;border-radius:99px;background:#e2e8f0}
.pbar i{display:block;height:100%;border-radius:inherit;background:#ca8a04}
.pbar.g i{background:#059669}.pbar.r i{background:#dc2626}
.rowline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline .nm{flex:0 0 120px;font-size:12px;font-weight:600}
.rowline .pbar{flex:1}
.rowline .vv{flex:0 0 48px;text-align:right;font-size:11.5px;font-weight:700}
.statline{display:flex;gap:10px;flex-wrap:wrap}
.statline .si{flex:1;min-width:135px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}
.statline .l{color:var(--muted);font-size:11px;font-weight:600}
.statline .v{margin-top:4px;font-size:18px;font-weight:700}
.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:#cbd5e1}
.ev{position:relative;padding:0 0 17px 6px}
.ev:last-child{padding-bottom:0}
.ev::before{
  content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;
  border:2px solid #fff;border-radius:50%;background:#0369a1;outline:2px solid #0369a1;
}
.ev.b::before{background:#dc2626;outline-color:#dc2626}
.ev.w::before{background:#ca8a04;outline-color:#ca8a04}
.ev.g::before{background:#059669;outline-color:#059669}
.ev .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
.ev .td{margin-top:3px;color:var(--muted);font-size:11px}
.ev .tm{color:#334155;font-size:10.5px;font-weight:700}

/* Motion */
.screen-enter .grid-item{animation:stagger-in 400ms backwards cubic-bezier(.2,.8,.2,1)}
.screen-enter .grid-item:nth-child(2){animation-delay:60ms}
.screen-enter .grid-item:nth-child(3){animation-delay:120ms}
.screen-enter .grid-item:nth-child(4){animation-delay:180ms}
.screen-enter .grid-item:nth-child(5){animation-delay:240ms}
.screen-enter .grid-item:nth-child(6){animation-delay:300ms}
@keyframes stagger-in{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .sensmap{grid-template-columns:repeat(3,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .nav-in,.wrap{padding-left:16px;padding-right:16px}
  .head{align-items:flex-start;flex-direction:column}
  .g2,.g23,.g32{grid-template-columns:1fr}
  .brand-sub{display:none}
  .live{font-size:0}
  .live .ms{font-size:18px}
}
@media(max-width:520px){
  .wrap{padding-top:22px}
  .g4,.board{grid-template-columns:1fr}
  .sensmap{grid-template-columns:repeat(2,1fr)}
  .tab{padding:10px}
  .tab .lbl{display:none}
  .head h1{font-size:25px}
  .card{padding:14px}
}
</style>
</head>
<body>
<a class="skip" href="#screen">跳至主要內容</a>
<header class="nav">
  <div class="nav-in">
    <div class="nav-top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="ms">ac_unit</span></div>
        <div>
          <div class="brand-title">ColdChain EMS</div>
          <div class="brand-sub">冷鏈 / 特殊儲存環境監控控制台</div>
        </div>
      </div>
      <div class="live"><span class="ms" aria-hidden="true">sensors</span>即時連線 · 48 感測點在線</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="系統功能"></nav>
  </div>
</header>
<main class="wrap"><div id="screen" tabindex="-1"></div></main>

<script>
"use strict";
var CH={};
var TABS=[
  {i:0,ic:"thermostat",lbl:"即時環境監控"},
  {i:1,ic:"warning",lbl:"超標告警處置"},
  {i:2,ic:"monitoring",lbl:"感測器管理"},
  {i:3,ic:"history",lbl:"環境數據履歷"},
  {i:4,ic:"inventory_2",lbl:"料件效期風險"},
  {i:5,ic:"fact_check",lbl:"稽核合規報表"}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function renderTabs(active){
  var t=document.getElementById("tabs");t.innerHTML="";
  TABS.forEach(function(x){
    var b=document.createElement("button");
    b.className="tab"+(x.i===active?" on":"");
    b.dataset.i=x.i;
    b.type="button";
    b.setAttribute("aria-current",x.i===active?"page":"false");
    b.setAttribute("aria-label",x.lbl);
    b.innerHTML='<span class="ms" aria-hidden="true">'+x.ic+'</span><span class="lbl">'+x.lbl+'</span>';
    b.onclick=function(){location.hash="v"+x.i;};
    t.appendChild(b);
  });
}
var AX="#475569",GRID="#e2e8f0",LBL="#334155";
function baseGrid(){return{left:8,right:14,top:28,bottom:8,containLabel:true};}
function axCommon(){
  return{
    animation:!matchMedia("(prefers-reduced-motion: reduce)").matches,
    tooltip:{trigger:"axis",backgroundColor:"#fff",borderColor:"#cbd5e1",textStyle:{color:"#0f172a",fontSize:12}},
    textStyle:{color:LBL,fontFamily:"Open Sans"}
  };
}
function initChart(id,opt){
  var dom=document.getElementById(id);if(!dom)return;
  if(CH[id])CH[id].dispose();
  var c=echarts.init(dom,null,{renderer:"canvas"});
  c.setOption(opt);CH[id]=c;
}
function line(nm,data,color){
  return{name:nm,type:"line",smooth:true,symbol:"none",data:data,lineStyle:{width:2.5,color:color},itemStyle:{color:color}};
}
function kpi(lab,val,ic,dir,sub,col,unit){
  var ico=dir==="up"?"trending_up":dir==="down"?"trending_down":"warning";
  var cls=dir==="up"?"up":dir==="down"?"down":"wn";
  return '<div class="card kpi grid-item" style="--kpi:'+col+'"><div class="lab"><span class="ms">'+ic+'</span>'+esc(lab)+'</div><div class="val">'+esc(val)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div><div class="sub '+cls+'"><span class="ms">'+ico+'</span>'+esc(sub)+'</div></div>';
}
function rowline(nm,v,cls){
  return '<div class="rowline"><div class="nm">'+esc(nm)+'</div><div class="pbar '+(cls||"")+'" role="progressbar" aria-label="'+esc(nm)+'" aria-valuenow="'+v+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+v+'%"></i></div><div class="vv">'+v+'%</div></div>';
}
function mount(html){
  var s=document.getElementById("screen");
  s.className="screen-enter";s.innerHTML=html;
  requestAnimationFrame(function(){s.classList.remove("screen-enter");void s.offsetWidth;s.classList.add("screen-enter");});
}
function heading(title,desc,badge,icon){
  return '<div class="head grid-item"><div><div class="eyebrow">Environmental Operations</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="badge"><span class="ms">'+icon+'</span>'+badge+'</div></div>';
}

function s0(){
  var zones=[
    ["冷凍A區",-22.4,"ok","-25~-18","RH 68%","達標","check_circle"],
    ["冷凍B區",-19.1,"ok","-25~-18","RH 71%","達標","check_circle"],
    ["冷藏C區",6.8,"warn","2~8","RH 82%","接近上限","warning"],
    ["冷藏D區",9.6,"bad","2~8","RH 88%","越限告警","error"],
    ["恆溫E區",21.3,"ok","18~24","RH 55%","達標","check_circle"],
    ["疫苗F庫",4.2,"ok","2~8","RH 60%","達標","check_circle"]
  ];
  var z=zones.map(function(x){return '<div class="zone z-'+x[2]+' grid-item"><div class="zn"><span class="ms">ac_unit</span>'+x[0]+'</div><div class="zt mono">'+x[1].toFixed(1)+'<small>°C</small></div><div class="zh">目標 '+x[3]+'　'+x[4]+'</div><div class="state"><span class="ms">'+x[6]+'</span>'+x[5]+'</div></div>';}).join("");
  mount(
    heading("即時環境監控","全廠冷鏈與特殊儲存區溫濕度即時狀態，越限儲區自動變色提示，值班人員一眼掌握現場。","更新於 08:42:15","bolt")+
    '<div class="grid g4 section-gap">'+
      kpi("在線儲區","6","monitoring","wn","1 區越限中","#ca8a04")+
      kpi("平均達標率","94.6","task_alt","up","近 24h +1.8%","#059669","%")+
      kpi("進行中告警","3","warning","down","較昨日 -2","#dc2626")+
      kpi("感測點在線","48/50","sensors","up","2 點斷訊","#0369a1")+
    '</div>'+
    '<section class="card section-gap grid-item"><div class="ctitle"><span class="ms">grid_view</span>儲區即時看板<small>ZONE MAP</small></div><div class="sensmap">'+z+'</div><div class="legend"><span><span class="ms up">check_circle</span>達標</span><span><span class="ms wn">warning</span>接近上下限</span><span><span class="ms down">error</span>越限告警</span></div></section>'+
    '<div class="grid g23"><section class="card grid-item"><div class="ctitle"><span class="ms">show_chart</span>近 12 小時溫度趨勢<small>°C</small></div><div id="c0a" class="chart"></div></section><section class="card grid-item"><div class="ctitle"><span class="ms">water_drop</span>各區濕度負載</div>'+rowline("冷凍A區",68,"g")+rowline("冷藏C區",82,"")+rowline("冷藏D區",88,"r")+rowline("恆溫E區",55,"g")+rowline("疫苗F庫",60,"g")+'</section></div>'
  );
  initChart("c0a",Object.assign(axCommon(),{
