<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>冷鏈/特殊儲存環境監控系統｜Cold Chain & Environmental Monitoring</title>
<meta name="description" content="溫濕度即時監控、超標告警處置、感測器管理、環境數據履歷與冷鏈稽核合規報表的單一控制台。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0c1015;--panel:#141a22;--panel2:#1b2530;--line:#26313d;--line2:#333f4d;
  --ink:#eef3f8;--muted:#9fb0c0;--dim:#6f8194;
  --accent:#c2410c;--accent2:#fb923c;--accent-soft:rgba(194,65,12,.16);
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--cool:#38bdf8;--good:#34d399;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%,rgba(194,65,12,.10),transparent 60%),var(--bg);
  color:var(--ink);font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

/* NAV */
.nav{position:sticky;top:0;z-index:40;background:rgba(12,16,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 6px 18px rgba(194,65,12,.4)}
.logo .ms{font-size:22px}
.brand .t{font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand .s{font-size:11px;color:var(--dim);white-space:nowrap}
.pill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.tabs{width:100%;display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 2px}
.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.tab .ms{font-size:19px}
.tab:hover{border-color:var(--line2);color:var(--ink)}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(194,65,12,.35)}

/* LAYOUT */
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px}
.head p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:640px}
.head .badge{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--accent2);background:var(--accent-soft);border:1px solid rgba(194,65,12,.35);padding:7px 12px;border-radius:10px;font-weight:700;white-space:nowrap}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}

.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.ctitle{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink);margin:0 0 12px}
.ctitle .ms{font-size:19px;color:var(--accent2)}
.ctitle small{margin-left:auto;color:var(--dim);font-weight:600;font-size:11px}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:600}
.kpi .lab .ms{font-size:18px}
.kpi .val{font-size:30px;font-weight:900;letter-spacing:-.5px;margin-top:8px;font-family:"Inter"}
.kpi .val small{font-size:14px;font-weight:700;color:var(--dim);margin-left:3px}
.kpi .sub{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .sub .ms{font-size:15px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.up{color:var(--ok)}.down{color:var(--bad)}.wn{color:var(--warn)}

/* chart */
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.chart.lg{height:320px}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums;font-weight:600}

/* chips / tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag .ms{font-size:14px}
.t-ok{background:rgba(34,197,94,.14);color:#4ade80}
.t-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.t-bad{background:rgba(239,68,68,.15);color:#f87171}
.t-cool{background:rgba(56,189,248,.14);color:#7dd3fc}
.t-dim{background:rgba(159,176,192,.12);color:var(--muted)}

/* board columns */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.col h4{margin:0 0 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.col h4 .n{margin-left:auto;font-size:11px;color:var(--dim);background:var(--panel2);border-radius:999px;padding:2px 8px}
.tk{background:linear-gradient(180deg,var(--panel2),#182029);border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:9px}
.tk:last-child{margin-bottom:0}
.tk .tt{font-size:12.5px;font-weight:700;margin-bottom:5px}
.tk .m{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* sensor grid signature */
.sensmap{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:820px){.sensmap{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.sensmap{grid-template-columns:repeat(2,1fr)}}
.zone{border-radius:12px;padding:13px 12px;border:1px solid var(--line2);position:relative;overflow:hidden;background:var(--panel)}
.zone .zn{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.zone .zt{font-size:24px;font-weight:900;margin-top:6px;font-family:"Inter";line-height:1}
.zone .zt small{font-size:12px;color:var(--dim);font-weight:700}
.zone .zh{font-size:11px;color:var(--dim);margin-top:4px}
.zone .zs{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%}
.zone.z-ok{border-color:rgba(34,197,94,.4);background:linear-gradient(180deg,rgba(34,197,94,.07),var(--panel))}
.zone.z-ok .zs{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.zone.z-warn{border-color:rgba(245,158,11,.45);background:linear-gradient(180deg,rgba(245,158,11,.08),var(--panel))}
.zone.z-warn .zs{background:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.zone.z-bad{border-color:rgba(239,68,68,.5);background:linear-gradient(180deg,rgba(239,68,68,.10),var(--panel))}
.zone.z-bad .zs{background:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.15)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl .ev.b::before{background:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.5)}
.tl .ev.w::before{background:var(--warn);box-shadow:0 0 0 2px rgba(245,158,11,.5)}
.tl .ev.g::before{background:var(--ok);box-shadow:0 0 0 2px rgba(34,197,94,.5)}
.tl .ev .th{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .ev .td{font-size:11.5px;color:var(--dim);margin-top:3px}
.tl .ev .tm{font-size:11px;color:var(--accent2);font-weight:700;font-family:"Inter"}

/* progress bars */
.pbar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pbar.g > i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.pbar.r > i{background:linear-gradient(90deg,#b91c1c,#f87171)}

.rowline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rowline:last-child{border-bottom:none}
.rowline .nm{font-size:12.5px;font-weight:600;flex:0 0 120px}
.rowline .pbar{flex:1}
.rowline .vv{flex:0 0 58px;text-align:right;font-size:12px;font-weight:700;font-family:"Inter"}

/* gauge-like stat row */
.statline{display:flex;gap:14px;flex-wrap:wrap}
.statline .si{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.statline .si .l{font-size:11px;color:var(--dim);font-weight:600}
.statline .si .v{font-size:19px;font-weight:800;margin-top:4px;font-family:"Inter"}

.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

@media(max-width:560px){
  .tab .lbl{display:none}
  .tab{padding:9px 11px}
  .brand .s{display:none}
}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-in">
    <div class="brand">
      <div class="logo"><span class="ms">ac_unit</span></div>
      <div>
        <div class="t">ColdChain EMS</div>
        <div class="s">冷鏈 / 特殊儲存環境監控控制台</div>
      </div>
    </div>
    <div class="pill"><span class="dot"></span>即時連線 · 48 感測點在線</div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var CH = {}; // chart registry

var TABS = [
  {i:0,ic:"thermostat",lbl:"即時環境監控"},
  {i:1,ic:"warning",lbl:"超標告警處置"},
  {i:2,ic:"monitoring",lbl:"感測器管理"},
  {i:3,ic:"history",lbl:"環境數據履歷"},
  {i:4,ic:"inventory_2",lbl:"料件效期風險"},
  {i:5,ic:"fact_check",lbl:"稽核合規報表"}
];

function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function renderTabs(active){
  var t=document.getElementById("tabs");
  t.innerHTML="";
  TABS.forEach(function(x){
    var b=el('<button class="tab'+(x.i===active?" on":"")+'" data-i="'+x.i+'"><span class="ms">'+x.ic+'</span><span class="lbl">'+x.lbl+'</span></button>');
    b.addEventListener("click",function(){location.hash="v"+x.i;});
    t.appendChild(b);
  });
}

/* ---------- chart helper ---------- */
var AX="#8195a8", GRID="#26313d", LBL="#cbd6e1";
function baseGrid(){return{left:8,right:14,top:26,bottom:8,containLabel:true};}
function initChart(id,opt){
  var dom=document.getElementById(id);
  if(!dom) return;
  if(CH[id]){try{CH[id].dispose();}catch(e){}}
  var c=echarts.init(dom,null,{renderer:"canvas"});
  c.setOption(opt);
  CH[id]=c;
}
function axCommon(){
  return {
    tooltip:{trigger:"axis",backgroundColor:"#1b2530",borderColor:"#333f4d",textStyle:{color:"#eef3f8",fontSize:12}},
    textStyle:{color:LBL,fontFamily:"Inter"}
  };
}

/* ============================================================
   SCREEN 0 — 即時環境監控 (control room dashboard)
   ============================================================ */
function s0(){
  var zones=[
    {n:"冷凍A區",t:-22.4,st:"ok",tgt:"-25~-18",h:"RH 68%"},
    {n:"冷凍B區",t:-19.1,st:"ok",tgt:"-25~-18",h:"RH 71%"},
    {n:"冷藏C區",t:6.8,st:"warn",tgt:"2~8",h:"RH 82%"},
    {n:"冷藏D區",t:9.6,st:"bad",tgt:"2~8",h:"RH 88%"},
    {n:"恆溫E區",t:21.3,st:"ok",tgt:"18~24",h:"RH 55%"},
    {n:"疫苗F庫",t:4.2,st:"ok",tgt:"2~8",h:"RH 60%"}
  ];
  var zhtml=zones.map(function(z){
    return '<div class="zone z-'+z.st+'"><span class="zs"></span>'+
      '<div class="zn"><span class="ms">ac_unit</span>'+esc(z.n)+'</div>'+
      '<div class="zt">'+z.t.toFixed(1)+'<small>°C</small></div>'+
      '<div class="zh">目標 '+esc(z.tgt)+'　'+esc(z.h)+'</div></div>';
  }).join("");

  var html=''+
  '<div class="head"><div><h1>即時環境監控</h1><p>全廠冷鏈與特殊儲存區溫濕度即時狀態，越限儲區自動變色提示，值班人員一眼掌握現場。</p></div>'+
    '<div class="badge"><span class="ms">bolt</span>更新於 08:42:15</div></div>'+

  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("在線儲區","6","monitoring","warn","1 區越限中","var(--warn)")+
    kpi("平均達標率","94.6","task_alt","up","近 24h +1.8%","var(--ok)","%")+
    kpi("進行中告警","3","warning","down","較昨日 -2","var(--bad)")+
    kpi("感測點在線","48/50","sensors","up","2 點斷訊","var(--cool)")+
  '</div>'+

  '<div class="card" style="margin-bottom:14px"><div class="ctitle"><span class="ms">grid_view</span>儲區即時看板<small>signature · zone map</small></div>'+
    '<div class="sensmap">'+zhtml+'</div>'+
    '<div class="legend"><span><i style="background:#22c55e"></i>達標</span><span><i style="background:#f59e0b"></i>接近上下限</span><span><i style="background:#ef4444"></i>越限告警</span></div>'+
  '</div>'+

  '<div class="grid g23">'+
    '<div class="card"><div class="ctitle"><span class="ms">show_chart</span>近 12 小時溫度趨勢<small>°C</small></div><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><div class="ctitle"><span class="ms">water_drop</span>各區濕度負載</div>'+
      rowline("冷凍A區",68,"g")+rowline("冷藏C區",82,"")+rowline("冷藏D區",88,"r")+rowline("恆溫E區",55,"g")+rowline("疫苗F庫",60,"g")+
    '</div>'+
  '</div>';

  var scr=document.getElementById("screen");scr.innerHTML=html;
  void scr.offsetHeight;
  var hrs=["21:00","22:00","23:00","00:00","01:00","02:00","03:00","04:00","05:00","06:00","07:00","08:00"];
  initChart("c0a",Object.assign(axCommon(),{
    legend:{data:["冷凍A區","冷藏D區","疫苗F庫"],textStyle:{color:LBL},top:0,right:0},
    grid:baseGrid(),
    xAxis:{type:"category",data:hrs,axisLine:{lineStyle:{color:GRID}},axisLabel:{color:AX,fontSize:10}},
    yAxis:{type:"value",axisLine:{show:false},splitLine:{lineStyle:{color:GRID}},axisLabel:{color:AX,fontSize:10}},
    series:[
      line("冷凍A區",[-21.8,-22.1,-22.4,-22.0,-21.6,-22.3,-22.5,-22.2,-22.0,-21.9,-22.3,-22.4],"#38bdf8"),
      line("冷藏D區",[6.2,6.8,7.1,7.6,8.1,8.4,8.9,9.2,9.6,9.4,9.6,9.6],"#ef4444"),
      line("疫苗F庫",[4.0,4.1,4.2,4.0,4.3,4.1,4.2,4.4,4.2,4.1,4.2,4.2],"#34d399")
    ]
  }));
}

/* ============================================================
   SCREEN 1 — 超標告警處置 (alert board + severity chart)
   ============================================================ */
function s1(){
  var cols=[
    {h:"新告警",ic:"notification_important",n:2,cls:"t-bad",items:[
      {t:"冷藏D區 溫度越上限",m:["09:38","9.6°C / 上限 8°C","嚴重"]},
      {t:"冷凍B區 除霜異常",m:["09:12","-16.8°C 短暫回溫","中"]}
    ]},
    {h:"處置中",ic:"engineering",n:2,cls:"t-warn",items:[
      {t:"冷藏C區 濕度偏高",m:["08:20","RH 82%","工程部到場"]},
      {t:"F庫門禁未關","m2":true,"m":["07:55","開門逾 6 分鐘","已通知"]}
    ]},
    {h:"待複核",ic:"fact_check",n:1,cls:"t-cool",items:[
      {t:"恆溫E區 感測跳動",m:["06:40","誤報疑慮","待品保確認"]}
    ]},
    {h:"已結案",ic:"task_alt",n:3,cls:"t-ok",items:[
      {t:"冷凍A區 電量告警",m:["昨 22:10","電池已更換"]},
      {t:"C區壓縮機重啟",m:["昨 20:05","恢復正常"]},
      {t:"D區斷訊補傳",m:["昨 18:30","已回補"]}
    ]}
  ];
  var board=cols.map(function(c){
    var tk=c.items.map(function(it){
      var m=it.m.map(function(x){return '<span>'+esc(x)+'</span>';}).join('<span style="color:var(--line2)">·</span>');
      return '<div class="tk"><div class="tt">'+esc(it.t)+'</div><div class="m">'+m+'</div></div>';
    }).join("");
    return '<div class="col"><h4><span class="tag '+c.cls+'"><span class="ms">'+c.ic+'</span></span>'+esc(c.h)+'<span class="n">'+c.n+'</span></h4>'+tk+'</div>';
  }).join("");

  var html=''+
  '<div class="head"><div><h1>超標告警處置</h1><p>越限與斷訊事件自動分級進入處置流程，從新告警到結案全程可追蹤回應時效。</p></div>'+
    '<div class="badge"><span class="ms">warning</span>平均回應 4.2 分鐘</div></div>'+

  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("今日告警","11","warning","down","較昨日 -3","var(--bad)")+
    kpi("嚴重等級","2","priority_high","wn","需立即處置","var(--warn)")+
    kpi("平均回應時效","4.2","timer","up","目標 ≤5 分","var(--ok)","分")+
    kpi("超時未處理","0","running_with_errors","up","全數在期","var(--ok)")+
  '</div>'+

      {name:"處置留存",max:100},{name:"可追溯",max:100},{name:"文件簽核",max:100}
    ],center:["50%","54%"],radius:"66%",axisName:{color:LBL,fontSize:11},splitLine:{lineStyle:{color:GRID}},splitArea:{areaStyle:{color:["rgba(255,255,255,.02)","rgba(255,255,255,.04)"]}},axisLine:{lineStyle:{color:GRID}}},
    series:[{type:"radar",data:[{value:[99,96,92,100,98,90],name:"本月",
      areaStyle:{color:"rgba(251,146,60,.28)"},lineStyle:{color:"#fb923c",width:2},itemStyle:{color:"#c2410c"}}]}]
  }));
}

/* ---------- shared builders ---------- */
function kpi(lab,val,ic,dir,sub,barcol,unit){
  var arrow=dir==="up"?'<span class="ms up">trending_up</span>':dir==="down"?'<span class="ms down">trending_down</span>':dir==="wn"?'<span class="ms wn">warning</span>':'';
  var cls=dir==="up"?"up":dir==="down"?"down":dir==="wn"?"wn":"";
  return '<div class="card kpi"><span class="bar" style="background:'+(barcol||"var(--accent)")+'"></span>'+
    '<div class="lab"><span class="ms">'+ic+'</span>'+esc(lab)+'</div>'+
    '<div class="val">'+esc(val)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div>'+
    '<div class="sub '+cls+'">'+arrow+esc(sub)+'</div></div>';
}
function line(nm,data,color){
  return {name:nm,type:"line",smooth:true,symbol:"none",data:data,lineStyle:{width:2.5,color:color},itemStyle:{color:color}};
}
function rowline(nm,v,cls){
  return '<div class="rowline"><div class="nm">'+esc(nm)+'</div><div class="pbar '+(cls||"")+'"><i style="width:'+v+'%"></i></div><div class="vv">'+v+'%</div></div>';
}

/* ---------- router ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  renderTabs(i);
  Object.keys(CH).forEach(function(k){try{CH[k].dispose();}catch(e){}delete CH[k];});
  SCREENS[i]();
}
window.addEventListener("resize",function(){Object.keys(CH).forEach(function(k){try{CH[k].resize();}catch(e){}});});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
