<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8D Report Management（8D報告管理）｜Jvision 系統 Demo</title>
<meta name="description" content="從異常到改善的品質閉環：8D 報告的團隊組成、圍堵、根因分析、對策驗證與結案稽核。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#7c3aed;--accent2:#a78bfa;--accent-soft:#f3eefe;--accent-line:#e6dcfb;
  --ink:#1e1633;--muted:#6b647e;--faint:#9a93ad;--line:#eae6f2;--bg:#f6f4fb;--card:#ffffff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --shadow:0 1px 2px rgba(35,20,70,.05),0 8px 24px rgba(60,30,120,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.wrap{max-width:1360px;margin:0 auto;padding:18px 20px 60px}
/* header */
.top{display:flex;align-items:center;gap:14px;padding:6px 2px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(124,58,237,.32)}
.logo .material-symbols-outlined{font-size:26px}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;flex:none}
/* nav */
nav{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:8px;box-shadow:var(--shadow);margin-bottom:18px}
nav button{flex:none;white-space:nowrap;min-width:0;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:9px 13px;border-radius:11px;cursor:pointer;transition:.15s}
nav button .material-symbols-outlined{font-size:19px}
nav button .idx{font-size:11px;font-weight:800;background:var(--bg);color:var(--faint);border-radius:6px;padding:1px 6px}
nav button:hover{background:var(--accent-soft);color:var(--accent)}
nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.28)}
nav button.on .idx{background:rgba(255,255,255,.25);color:#fff}
/* screen head */
.shead{display:flex;align-items:flex-start;gap:12px;margin:2px 2px 16px;flex-wrap:wrap}
.shead .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--accent-line)}
.shead h2{margin:0;font-size:18px;font-weight:800}
.shead p{margin:3px 0 0;font-size:13px;color:var(--muted);max-width:760px}
.stag{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:5px 11px;border-radius:999px;flex:none}
/* cards / grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.pad{padding:16px}
.ctitle{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin:0 0 12px}
.ctitle .material-symbols-outlined{font-size:19px;color:var(--accent)}
.ctitle small{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--faint)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:340px 1fr}
.min0{min-width:0}
/* kpi */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .kv{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .kv small{font-size:13px;font-weight:700;color:var(--faint);margin-left:3px}
.kpi .kd{font-size:11.5px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.kpi .kd .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--muted)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#faf9fd;position:sticky;top:0}
tbody tr:hover{background:var(--accent-soft)}
td.wrapc{white-space:normal;min-width:180px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;line-height:1.4}
.c-ok{background:#e7f6ec;color:#15803d}
.c-warn{background:#fdf1e0;color:#b45309}
.c-bad{background:#fdeaea;color:#b91c1c}
.c-info{background:#e7f0fd;color:#1d4ed8}
.c-acc{background:var(--accent-soft);color:var(--accent)}
.c-mut{background:#f0eef5;color:#6b647e}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* d-stage pill */
.dpill{display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;width:26px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);flex:none}
/* progress */
.bar{height:7px;border-radius:999px;background:#eee9f6;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#faf9fd;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}
.col > h4{margin:2px 4px 10px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.col > h4 .n{margin-left:auto;font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tk{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(35,20,70,.04);cursor:default}
.tk:hover{border-color:var(--accent2)}
.tk .id{font-size:10.5px;font-weight:800;color:var(--accent)}
.tk .tt{font-size:12.5px;font-weight:700;margin:3px 0 6px;white-space:normal}
.tk .mt{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.avatar{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
/* list (split left) */
.list{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}
.li{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.14s;background:var(--card)}
.li:hover{border-color:var(--accent2);background:var(--accent-soft)}
.li.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 14px rgba(124,58,237,.14)}
.li .r1{display:flex;align-items:center;gap:8px}
.li .r1 b{font-size:12.5px;font-weight:800}
.li .r2{font-size:12px;font-weight:700;margin:6px 0 5px;white-space:normal}
.li .r3{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
/* detail pane */
.pane{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card)}
.stepline{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.step{flex:1;min-width:64px;text-align:center}
.step .sd{height:6px;border-radius:999px;background:#eee9f6}
.step.done .sd{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.step.cur .sd{background:var(--warn)}
.step .sl{font-size:10px;color:var(--muted);margin-top:5px;font-weight:700}
.step.cur .sl{color:var(--warn)}
.kv2{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:12.5px;margin-top:8px}
.kv2 .k{color:var(--faint);font-weight:700}
.kv2 .v{font-weight:700}
/* fishbone */
.fish{position:relative;overflow-x:auto;padding:10px 0}
.fishrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bone{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:11px;background:#faf9fd}
.bone h5{margin:0 0 8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.bone ul{margin:0;padding-left:16px;font-size:11.8px;color:var(--muted)}
.bone li{margin-bottom:4px}
.bone li.hot{color:var(--bad);font-weight:700}
/* 5why */
.why{border-left:2px dashed var(--accent2);margin-left:8px;padding-left:16px}
.why .w{position:relative;padding:8px 0}
.why .w::before{content:"";position:absolute;left:-21px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-line)}
.why .w b{font-size:11px;color:var(--accent);font-weight:800}
.why .w p{margin:2px 0 0;font-size:12.5px}
/* validation cmp */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.cbox{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.cbox .cl{font-size:11px;color:var(--faint);font-weight:700}
.cbox .cn{font-size:24px;font-weight:900;margin-top:4px}
.cbox.b{background:#fdeaea}.cbox.b .cn{color:var(--bad)}
.cbox.a{background:#e7f6ec}.cbox.a .cn{color:var(--ok)}
.arrowx{color:var(--accent);font-weight:900}
/* misc */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.mini{height:280px;width:100%}
.mini-sm{height:220px;width:100%}
.note{font-size:12px;color:var(--muted);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.note .material-symbols-outlined{color:var(--accent);font-size:18px;flex:none}
.tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--faint)}
.scrollx{overflow-x:auto}
/* RWD */
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  nav{position:sticky;top:0;z-index:20}
  .split{grid-template-columns:1fr}
  .list{max-height:none}
}
@media(max-width:820px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .fishrow{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  .arrowx{transform:rotate(90deg)}
  .kv2{grid-template-columns:80px 1fr}
}
@media(max-width:560px){
  nav button .txt{display:none}
  nav button{padding:9px 11px}
  .wrap{padding:14px 13px 50px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div class="min0">
        <h1>8D Report Management　8D報告管理</h1>
        <p>從異常到改善的品質閉環與追溯稽核 · QMS 品質管理系統</p>
      </div>
    </div>
    <span class="badge"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>純前端 Demo · 假資料</span>
  </div>

  <nav id="nav"></nav>
  <div id="screen"></div>

  <div class="foot">Jvision 系統 Demo · 8D Report Management · 本頁為 UI 展示，資料皆為模擬</div>
</div>

<script>
"use strict";
var SCREEN=document.getElementById("screen");
var NAV=document.getElementById("nav");
var chartStore=[];
function disposeCharts(){for(var i=0;i<chartStore.length;i++){try{chartStore[i].dispose();}catch(e){}}chartStore=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  chartStore.push(c);
}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;"})[m];});}

/* ---------- palette for echarts ---------- */
var AXIS={axisLine:{lineStyle:{color:"#e0dbec"}},axisLabel:{color:"#7a7290",fontSize:11},axisTick:{show:false},splitLine:{lineStyle:{color:"#f0edf6"}}};
var PAL=["#7c3aed","#a78bfa","#22c55e","#f59e0b","#ef4444","#0ea5e9"];

var MODS=[
  {ic:"inbox",t:"8D 案件看板",d:"依 D1–D8 階段追蹤所有 8D 報告，左側案件清單、右側詳情的分割式工作台。"},
  {ic:"groups",t:"D1 團隊組成",d:"跨部門小組成員、RACI 職責與問題定義 5W2H。"},
  {ic:"shield",t:"D3 暫時對策",d:"受影響批次隔離、圍堵措施與外流風險追蹤。"},
  {ic:"account_tree",t:"D4 根因分析",d:"魚骨圖 6M 分類、5-Why 追根與 Pareto 缺陷排列。"},
  {ic:"task_alt",t:"D5–D6 對策驗證",d:"永久對策導入前後的管制圖與效果驗證證據。"},
  {ic:"verified",t:"D8 結案稽核",d:"完成天數、逾期率統計與經驗教訓知識庫。"}
];

/* ============ SCREEN 0 : 8D 案件看板 (split workspace) ============ */
var CASES=[
  {id:"8D-2408-017",title:"連接器端子鍍層剝離導致接觸不良",cust:"Nexon 電子",sev:"高",stage:5,d:8,owner:"陳彥廷",team:"連接器一課",due:"08/20",overdue:false,batch:"LOT-C2419",qty:"12,400 pcs",part:"CN-4470",type:"客訴",prog:62},
  {id:"8D-2408-015",title:"外殼射出縮水 尺寸超出公差 0.15mm",cust:"Aureus 工業",sev:"中",stage:4,d:6,owner:"林思妤",team:"成型二課",due:"08/18",overdue:true,batch:"LOT-H1188",qty:"3,200 pcs",part:"HS-2210",type:"進料退貨",prog:48},
  {id:"8D-2408-012",title:"PCBA 焊點空洞率偏高引發間歇斷路",cust:"內部製程",sev:"高",stage:6,d:7,owner:"王柏睿",team:"SMT 產線",due:"08/22",overdue:false,batch:"LOT-P0742",qty:"8,900 pcs",part:"PBA-118",type:"製程異常",prog:78},
  {id:"8D-2408-010",title:"金屬件表面刮傷 外觀不良客訴",cust:"Marlin 精密",sev:"低",stage:3,d:5,owner:"張詠晴",team:"沖壓一課",due:"08/16",overdue:true,batch:"LOT-M3301",qty:"5,600 pcs",part:"MT-9902",type:"客訴",prog:34},
  {id:"8D-2408-008",title:"包材印刷色差超出 ΔE 限值",cust:"Vertex 貿易",sev:"中",stage:8,d:8,owner:"李冠霖",team:"包裝課",due:"08/12",overdue:false,batch:"LOT-K5520",qty:"20,000 pcs",part:"PK-3050",type:"客訴",prog:100},
  {id:"8D-2408-006",title:"螺絲扭力不足 組裝後鬆脫",cust:"內部製程",sev:"中",stage:2,d:2,owner:"周芷妍",team:"組裝三課",due:"08/24",overdue:false,batch:"LOT-A7781",qty:"1,800 pcs",part:"AS-6612",type:"製程異常",prog:20}
];
var STAGE_NAMES={1:"D1 團隊",2:"D2 問題",3:"D3 圍堵",4:"D4 根因",5:"D5 對策",6:"D6 驗證",7:"D7 預防",8:"D8 結案"};
var selCase=0;
function sevChip(s){var m={"高":"c-bad","中":"c-warn","低":"c-info"};return '<span class="chip '+m[s]+'">'+s+'風險</span>';}
function screen0(){
  var boardCols=[
    {k:"D1–D2 定義",r:[1,2]},
    {k:"D3 圍堵",r:[3]},
    {k:"D4–D6 分析對策",r:[4,5,6]},
    {k:"D7–D8 預防結案",r:[7,8]}
  ];
  var openCnt=CASES.filter(function(c){return c.stage<8;}).length;
  var overdue=CASES.filter(function(c){return c.overdue;}).length;
  var avgD=(CASES.reduce(function(a,c){return a+c.d;},0)/CASES.length).toFixed(1);
  var kpis=[
    {l:"進行中案件",v:openCnt,u:"件",ic:"folder_open",d:"本月新開 6 件",cls:"fl"},
    {l:"逾期案件",v:overdue,u:"件",ic:"schedule",d:"需主管介入",cls:"dn"},
    {l:"平均進度",v:53,u:"%",ic:"donut_large",d:"跨全部案件",cls:"fl"},
    {l:"平均完成天數",v:avgD,u:"天",ic:"timer",d:"目標 ≤ 7 天",cls:"up"}
  ];
  var kpiH=kpis.map(function(k){
    return '<div class="kpi min0"><div class="kl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="kv">'+k.v+'<small>'+k.u+'</small></div><div class="kd '+k.cls+'"><span class="material-symbols-outlined">trending_flat</span>'+k.d+'</div></div>';
  }).join("");

  var listH=CASES.map(function(c,i){
    return '<div class="li'+(i===selCase?' sel':'')+'" data-case="'+i+'"><div class="r1"><span class="dpill">D'+c.stage+'</span><b>'+c.id+'</b>'+sevChip(c.sev)+(c.overdue?'<span class="chip c-bad" style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:13px">error</span>逾期</span>':'')+'</div><div class="r2">'+esc(c.title)+'</div><div class="r3"><span class="avatar">'+c.owner.charAt(0)+'</span>'+c.owner+' · '+c.team+'<span class="tag">'+c.type+'</span><span style="margin-left:auto">到期 '+c.due+'</span></div><div class="bar" style="margin-top:8px"><i style="width:'+c.prog+'%"></i></div></div>';
  }).join("");

  var boardH=boardCols.map(function(col){
    var items=CASES.filter(function(c){return col.r.indexOf(c.stage)>=0;});
    var cards=items.map(function(c){
      return '<div class="tk"><div class="id">'+c.id+'</div><div class="tt">'+esc(c.title)+'</div><div class="mt"><span class="avatar">'+c.owner.charAt(0)+'</span>'+c.owner+'<span class="chip '+({"高":"c-bad","中":"c-warn","低":"c-info"})[c.sev]+'">'+c.sev+'</span><span style="margin-left:auto">'+STAGE_NAMES[c.stage]+'</span></div></div>';
    }).join("")||'<div style="font-size:11px;color:var(--faint);padding:8px 4px">— 無案件 —</div>';
    return '<div class="col"><h4>'+col.k+'<span class="n">'+items.length+'</span></h4>'+cards+'</div>';
  }).join("");

  SCREEN.innerHTML=head(0,"v0")

/* ---------- shared helpers ---------- */
function kpiCard(ic,l,v,u,d,cls){
  cls=cls||"fl";
  var arrow=cls==="up"?"trending_up":(cls==="dn"?"trending_down":"trending_flat");
  return '<div class="kpi min0"><div class="kl"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="kv">'+v+'<small>'+u+'</small></div><div class="kd '+cls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+d+'</div></div>';
}
function head(i,tag){
  var m=MODS[i];
  return '<div class="shead"><div class="ic"><span class="material-symbols-outlined">'+m.ic+'</span></div><div class="min0"><h2>'+m.t+'</h2><p>'+m.d+'</p></div><span class="stag">'+tag+' · 螢幕 '+(i+1)+'/6</span></div>';
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  disposeCharts();
  var btns=NAV.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  SCREENS[i]();
  void SCREEN.offsetHeight;
}
/* build nav */
(function(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="idx">'+(i+1)+'</span><span class="material-symbols-outlined">'+MODS[i].ic+'</span><span class="txt">'+MODS[i].t+'</span></button>';
  }
  NAV.innerHTML=h;
  var btns=NAV.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var i=+this.getAttribute("data-i");show(i);location.hash="go="+i;});
  }
})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
