<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>碳權與抵換專案管理 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --accent:#059669;
  --accent2:#10B981;
  --accent-soft:#D1FAE5;
  --accent-soft2:#ECFDF5;
  --bg:#ECFDF5;
  --panel:#FFFFFF;
  --th:#F0FDF4;
  --hov:#ECFDF5;
  --track:#DDEDE7;
  --sidebar:#052E25;
  --sidebar2:#064E3B;
  --side-edge:rgba(167,243,208,.24);
  --ok:#047857;
  --warn:#92400E;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --r:4px;
  --glow:rgba(5,150,105,.18);
  --shadow:0 1px 2px rgba(6,78,59,.08),0 8px 24px rgba(6,78,59,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{
  margin:0;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  letter-spacing:-.015em;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:2px;
}
::selection{background:#A7F3D0;color:#052E25}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:224px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  padding:20px 14px 16px;
  overflow:auto;
  background:var(--sidebar);
  color:#ECFDF5;
  border-right:1px solid #047857;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:2px 6px 22px;
  border-bottom:1px solid var(--side-edge);
}
.brand-logo{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid #34D399;
  border-radius:3px;
  background:#D1FAE5;
  color:#064E3B;
  box-shadow:4px 4px 0 #047857;
}
.brand-logo .material-symbols-outlined{font-size:22px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  color:#FFFFFF;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:#A7F3D0;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:500;
  letter-spacing:.14em;
}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:18px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  min-height:42px;
  padding:9px 10px;
  border:1px solid transparent;
  border-radius:3px;
  background:transparent;
  color:#D1FAE5;
  text-align:left;
  font-size:12.5px;
  font-weight:500;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:19px}
.nav button:hover{background:rgba(209,250,229,.1);border-color:rgba(167,243,208,.3);color:#FFFFFF}
.nav button:active{transform:translateY(1px)}
.nav button.on{
  background:#A7F3D0;
  border-color:#A7F3D0;
  color:#052E25;
  box-shadow:inset 4px 0 0 var(--color-primary);
}
.nav .idx{
  margin-left:auto;
  color:inherit;
  opacity:.72;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.side-foot{
  margin-top:auto;
  padding:14px 7px 2px;
  border-top:1px solid var(--side-edge);
  color:#A7F3D0;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  line-height:1.75;
}
.side-foot b{color:#FFFFFF}
.main{flex:1;min-width:0;padding:22px 26px 52px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:20px;
  font-weight:700;
  line-height:1.25;
}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:23px}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:3px;
  background:rgba(255,255,255,.72);
  color:#334155;
  font-size:10.5px;
  font-weight:600;
  box-shadow:0 1px 1px rgba(6,78,59,.04);
}
.chip .dot{
  width:8px;
  height:8px;
  border:2px solid #047857;
  border-radius:50%;
  background:#D1FAE5;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,.24)}50%{box-shadow:0 0 0 4px rgba(5,150,105,0)}}
.avatar{
  width:32px;
  height:32px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid #047857;
  border-radius:3px;
  background:#D1FAE5;
  color:#064E3B;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--r);
  background:var(--panel);
  box-shadow:var(--shadow);
}
.card,.sec{padding:14px}
.sec{margin-bottom:12px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease,background-color .2s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#6EE7B7;box-shadow:0 2px 3px rgba(6,78,59,.08),0 12px 28px rgba(6,78,59,.09)}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
  flex-wrap:wrap;
}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:700;
}
.card-h h3::after,.sec>h3::after{
  content:"";
  width:20px;
  height:1px;
  margin-left:2px;
  background:#6EE7B7;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:17px}
.card-h .hint{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.sec>h3{margin-bottom:11px}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.75}
.dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 16px;margin:0;font-size:12px}
.dl dt{color:var(--muted);font-size:11px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat{position:relative;overflow:hidden;padding:14px 15px}
.kpi::before,.stat::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--accent);
}
.kpi::after{
  content:"";
  position:absolute;
  right:-20px;
  top:-25px;
  width:72px;
  height:72px;
  border:1px solid #A7F3D0;
  border-radius:50%;
  opacity:.55;
}
.kpi .ico{
  position:relative;
  z-index:1;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid #A7F3D0;
  border-radius:3px;
  background:#ECFDF5;
  color:#047857;
}
.kpi .ico .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:9px;
  color:var(--muted);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.02em;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:14px}
.kpi .val,.stat .val{
  margin-top:2px;
  color:#052E25;
  font-family:"Fira Code",monospace;
  font-size:23px;
  font-weight:700;
  letter-spacing:-.045em;
  line-height:1.25;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:11px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:5px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:13px}

.card.pad0 .card-h{padding:14px 14px 0!important}
table{width:100%;border-collapse:separate;border-spacing:0;color:#0F3F34;font-size:11.5px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:9px 11px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:var(--th);
  color:#334155;
  text-align:left;
  white-space:nowrap;
  font-size:10px;
  font-weight:700;
  letter-spacing:.045em;
}
th:nth-child(n+3){text-align:right}
td{
  padding:9px 11px;
  border-bottom:1px solid #DDEDE7;
  background:#FFFFFF;
  text-align:left;
  white-space:nowrap;
  vertical-align:middle;
}
td:nth-child(n+3){text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F0FDF4}
.mono{
  color:#064E3B;
  font-family:"Fira Code",monospace;
  font-weight:600;
  letter-spacing:-.015em;
  font-variant-numeric:tabular-nums lining-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 7px;
  border:1px solid currentColor;
  border-radius:2px;
  white-space:nowrap;
  font-size:9.5px;
  font-weight:700;
  line-height:1.45;
}
.tag::before{content:"";width:5px;height:5px;border:1px solid currentColor;border-radius:50%;background:currentColor}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-gray{background:#F1F5F9;color:#475569}
.t-acc,.t-pink{background:#ECFDF5;color:#047857}

.bar{height:6px;min-width:56px;overflow:hidden;border-radius:1px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:1px;background:var(--accent)}
.prog{display:flex;align-items:center;gap:7px;min-width:0}
.prog small{width:36px;flex:none;color:var(--muted);text-align:right;font-family:"Fira Code",monospace;font-size:9.5px;font-weight:600}

.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 15px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-21px;top:3px;width:11px;height:11px;border:3px solid var(--accent);border-radius:1px;background:#FFFFFF}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:9.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:11.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:10.5px}

.chk{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:11.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:18px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10px}
.note{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted);font-size:10.5px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:8px;padding:9px;border:1px solid var(--line);border-radius:3px;background:var(--th)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:11.5px;font-weight:700}
.col-h .cnt{padding:1px 7px;border:1px solid var(--line);border-radius:2px;background:#FFFFFF;color:var(--muted);font-family:"Fira Code",monospace;font-size:9.5px}
.pcard{padding:10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;background:#FFFFFF}
.pcard:hover{border-color:#6EE7B7;box-shadow:0 5px 14px rgba(6,78,59,.08);transform:translateY(-1px)}
.pcard b{font-size:11.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:4px;color:var(--muted);font-size:9.5px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:7px;color:var(--ink);font-size:10px}
.mini-av,.av{display:inline-grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:2px;background:var(--accent-soft);color:#047857;font-family:"Fira Code",monospace;font-weight:700}
.mini-av{width:18px;height:18px;font-size:8px}
.av{width:25px;height:25px;font-size:9px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:#FFFFFF}
.lane-row:hover{border-color:#6EE7B7;background:#F8FFFC}
.lane-row .num{width:29px;height:29px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;background:var(--accent-soft);color:#047857;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:12px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:10.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{position:relative;z-index:1;width:21px;height:21px;display:grid;place-items:center;border:2px solid var(--line);border-radius:50%;background:#FFFFFF;color:#64748B;font-family:"Fira Code",monospace;font-size:9px}
.steps .ln{width:18px;height:2px;background:var(--line)}
.steps .s.done{border-color:var(--accent);background:var(--accent);color:#000000}
.steps .s.cur{border-color:var(--accent);color:#047857;animation:pulse 2s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 3px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:11.5px}
.rep-row .sku span{color:var(--muted);font-size:10px}
.gauge{width:105px;flex:none}
.gauge .track{position:relative;height:7px;overflow:hidden;border-radius:1px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:1px;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);text-align:right;font-family:"Fira Code",monospace;font-size:9px}
.band{position:relative;height:24px;min-width:145px;border-radius:2px;background:var(--track)}
.band .rng{position:absolute;inset-block:0;border-radius:2px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:10px;height:18px;border-radius:1px;background:var(--accent);box-shadow:0 2px 5px var(--glow)}

.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:13px 14px;overflow:hidden}
.tile::after{content:"";position:absolute;right:0;top:0;width:34px;height:3px;background:var(--accent)}
.tile .ti{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;background:var(--accent-soft);color:#047857}
.tile .ti .material-symbols-outlined{font-size:18px}
.tile b{color:#334155;font-size:11px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.55}
.tile .tv{color:#052E25;font-family:"Fira Code",monospace;font-size:20px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums lining-nums}

.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans","Noto Sans TC",sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:2px!important;box-shadow:var(--shadow)!important}
.apexcharts-tooltip-title{background:var(--th)!important;border-bottom:1px solid var(--line)!important}

@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(320px,1fr);gap:12px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1;grid-row:1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow:visible;border-right:0;border-bottom:1px solid #047857}
  .brand{padding:0 10px 0 0;border:0}
  .brand-logo{width:34px;height:34px;box-shadow:3px 3px 0 #047857}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin:0}
  .nav button{min-height:38px;padding:7px 9px}

function buildNav(){var n=document.getElementById("nav");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}

window.addEventListener("hashchange",fromHash);fromHash();
