<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI銷售預測 AI Sales Forecasting｜Jvision 系統 Demo</title>
  <meta name="description" content="多變量需求預測、客戶下單週期分析、產品線需求分解與產銷回饋規劃" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;

  --blue:var(--color-primary);
  --ink:var(--color-foreground);
  --muted:var(--color-muted-foreground);
  --line:var(--color-border);

  --ac:var(--color-primary);
  --ac2:var(--color-secondary);
  --ac-soft:#EFF6FF;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --sub:var(--color-muted-foreground);
  --good:#047857;
  --warn:#B45309;
  --bad:var(--color-destructive);
  --shadow:none;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Fira Sans","Noto Sans TC",system-ui,-apple-system,sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#DBEAFE;color:#172554}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-size:20px;
}
.tnum,.kv,.lval,.mv,.sv,.idx,time,td:nth-child(n+2){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums lining-nums;
}

.shell{display:flex;min-height:100vh;flex-direction:column}
.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  min-height:64px;
  padding:12px clamp(16px,2vw,28px);
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-bottom:4px solid #1D4ED8;
  position:sticky;
  top:0;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{
  width:38px;
  height:38px;
  border:2px solid rgba(255,255,255,.72);
  border-radius:var(--radius-sm);
  display:grid;
  place-items:center;
  background:transparent;
  flex:0 0 auto;
}
.brand .logo .ms{font-size:23px}
.brand h1{
  margin:0;
  font-size:clamp(14px,1.5vw,17px);
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand p{
  margin:1px 0 0;
  font-size:11.5px;
  color:#DBEAFE;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.topbar .spacer{flex:1}
.topbar .pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.65);
  border-radius:var(--radius-sm);
  background:transparent;
  color:#FFFFFF;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.body{display:flex;flex:1;min-height:0}

nav.side{
  width:244px;
  flex:0 0 auto;
  padding:18px 12px;
  display:flex;
  flex-direction:column;
  gap:5px;
  background:var(--color-card);
  border-right:1px solid var(--color-border);
}
nav.side .nav-h{
  padding:5px 10px 8px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.navbtn{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-width:0;
  min-height:44px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:var(--color-foreground);
  font:inherit;
  font-size:13.5px;
  font-weight:600;
  text-align:left;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.navbtn .ms{font-size:20px;color:var(--color-muted-foreground);flex:0 0 auto}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .idx{margin-left:auto;color:#64748B;font-size:10.5px;font-weight:600;flex:0 0 auto}
.navbtn:hover{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.navbtn.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.navbtn.on .ms,.navbtn.on .idx{color:#FFFFFF}

main{
  flex:1;
  min-width:0;
  max-width:1600px;
  padding:clamp(16px,2.1vw,30px);
  overflow:hidden;
}
.screen-head{margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--color-border)}
.screen-head h2{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  color:var(--color-foreground);
  font-size:clamp(20px,2vw,26px);
  font-weight:700;
  letter-spacing:-.02em;
}
.screen-head h2 .ms{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:var(--radius-sm);
  background:#DBEAFE;
  color:#1D4ED8;
  font-size:21px;
}
.screen-head p{max-width:820px;margin:0;color:var(--color-muted-foreground);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
  min-width:0;
  padding:15px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-top:3px solid var(--color-primary);
  border-radius:var(--radius-md);
  box-shadow:none;
  animation:card-in 400ms cubic-bezier(.2,.8,.2,1) both;
}
.kpi:nth-child(2){animation-delay:60ms}
.kpi:nth-child(3){animation-delay:120ms}
.kpi:nth-child(4){animation-delay:180ms}
.kpi .kl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
}
.kpi .kl .ms{color:var(--color-primary);font-size:17px}
.kpi .kv{margin-top:8px;color:var(--color-foreground);font-size:clamp(22px,2.3vw,29px);font-weight:700;letter-spacing:-.035em}
.kpi .kd{margin-top:4px;font-size:11.5px;font-weight:600}
.up{color:#047857}
.down{color:#B91C1C}
.flat{color:var(--color-muted-foreground)}

.split{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:16px;align-items:start}
.pane,.sec{
  min-width:0;
  overflow:hidden;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  box-shadow:none;
  animation:card-in 400ms 120ms cubic-bezier(.2,.8,.2,1) both;
}
.pane-h,.sec .sh{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:48px;
  padding:12px 15px;
  border-bottom:1px solid var(--color-border);
  background:var(--color-muted);
  color:var(--color-foreground);
  font-size:13.5px;
  font-weight:700;
}
.pane-h .ms,.sec .sh .ms{color:var(--color-primary);font-size:19px}
.pane-h .cnt,.sec .sh .r{
  margin-left:auto;
  color:var(--color-muted-foreground);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:500;
}
.pane-b{padding:12px}
.sec .sb{padding:14px}

.lrow{
  display:flex;
  align-items:flex-start;
  gap:11px;
  min-width:0;
  min-height:56px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  transition:background-color 180ms ease,border-color 180ms ease;
}
.lrow:hover{background:#EFF6FF;border-color:#BFDBFE}
.lrow.sel{background:#DBEAFE;border-color:#60A5FA}
.lrow .dot{width:9px;height:9px;margin-top:6px;border:2px solid currentColor;border-radius:50%;flex:0 0 auto}
.lrow .lm{min-width:0;flex:1}
.lrow .lt{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ls{color:var(--color-muted-foreground);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lval{flex:0 0 auto;font-size:13px;font-weight:700;text-align:right}
.lrow .lval small{display:block;color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:10.5px;font-weight:500}

.chartbox{width:100%;overflow:hidden}
.chart{width:100%;height:300px;overflow:hidden}
.chart.sm{height:230px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.meta .m,.stat{
  min-width:0;
  padding:10px 12px;
  background:var(--color-muted);
  border:1px solid var(--color-border);
  border-radius:var(--radius-sm);
}
.meta .m .ml,.stat .sl{color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.meta .m .mv{margin-top:3px;font-size:15px;font-weight:700}

.tbl-wrap{overflow-x:auto;scrollbar-color:#94A3B8 var(--color-muted)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12.5px}
thead th{
  position:sticky;
  top:0;
  padding:10px 12px;
  background:#EAF2FF;
  border-bottom:2px solid #93C5FD;
  color:#334155;
  font-size:11px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--color-border);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F1F5FD}
thead th:nth-child(n+2),tbody td:nth-child(n+2){text-align:right}
thead th:last-child,tbody td:last-child{text-align:left}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.badge::before{content:"";width:6px;height:6px;border:2px solid currentColor;border-radius:50%;flex:0 0 auto}
.b-good{background:#ECFDF5;color:#047857}
.b-warn{background:#FFFBEB;color:#92400E}
.b-bad{background:#FEF2F2;color:#B91C1C}
.b-info{background:#EFF6FF;color:#1D4ED8}
.b-neu{background:#F1F5F9;color:#475569}

.ibar{height:8px;min-width:60px;overflow:hidden;background:#DBEAFE;border-radius:2px}
.ibar>span{display:block;height:100%;background:var(--color-primary);border-radius:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{min-width:0;padding:11px;background:var(--color-muted);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.col-h{display:flex;align-items:center;gap:6px;margin-bottom:9px;padding:0 3px;font-size:12.5px;font-weight:700}
.col-h .cc{margin-left:auto;padding:2px 7px;background:#FFFFFF;border:1px solid #BFDBFE;border-radius:var(--radius-sm);color:#1D4ED8;font-family:"Fira Code",monospace;font-size:10.5px}
.card{min-width:0;margin-bottom:9px;padding:10px;background:#FFFFFF;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:var(--radius-sm);box-shadow:none}
.card:last-child{margin-bottom:0}
.card .ct{margin-bottom:3px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{display:flex;justify-content:space-between;gap:8px;color:var(--color-muted-foreground);font-size:11px}

.tl{position:relative;margin:4px 0;padding-left:25px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#BFDBFE}
.tl .ev{position:relative;padding:0 0 17px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev .tk{position:absolute;left:-23px;top:2px;width:16px;height:16px;background:#FFFFFF;border:3px solid #3B82F6;border-radius:50%}
.tl .ev.done .tk{background:var(--color-accent);border-color:var(--color-accent)}
.tl .ev.done .tk::after{content:"";position:absolute;left:3px;top:1px;width:4px;height:7px;border-right:2px solid #FFFFFF;border-bottom:2px solid #FFFFFF;transform:rotate(45deg)}
.tl .ev .eh{font-size:13px;font-weight:700}
.tl .ev .em{color:var(--color-muted-foreground);font-size:11.5px}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:10px 12px;
  background:#EFF6FF;
  border:1px solid #93C5FD;
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  color:#334155;
  font-size:12px;
}
.note .ms{color:#1D4ED8;font-size:17px;flex:0 0 auto}
.lvbar{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--color-border)}
.lvbar:last-child{border-bottom:0}
.lvbar .n{width:112px;flex:0 0 auto;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvbar .ibar{flex:1}
.lvbar .v{width:48px;flex:0 0 auto;font-family:"Fira Code",monospace;font-size:12px;font-weight:600;text-align:right}
.gauge-wrap{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:110px}
.stat .sv{margin-top:3px;font-size:22px;font-weight:700}

@keyframes card-in{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:1100px){
  .split{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media(max-width:860px){
  .body{flex-direction:column}
  nav.side{
    width:auto;
    padding:8px;
    flex-direction:row;
    flex-wrap:nowrap;
    gap:6px;
    overflow-x:auto;
    border-right:0;
    border-bottom:1px solid var(--color-border);
    position:sticky;
    top:64px;
    z-index:20;
  }
  nav.side .nav-h{display:none}
  .navbtn{width:auto;min-width:max-content;flex:0 0 auto;padding:8px 11px}
  .navbtn .idx{display:none}
  main{width:100%;padding:16px}
}
@media(max-width:768px){
  .g2{grid-template-columns:1fr}
  .meta{grid-template-columns:1fr 1fr}
  .chart{height:280px}
}
@media(max-width:560px){
  .topbar{min-height:60px;padding:10px 12px}
  .brand .logo{width:34px;height:34px}
  .brand p,.topbar .pill{display:none}
  nav.side{top:60px}
  .navbtn .nlab{display:none}
  .navbtn{min-width:44px;justify-content:center;padding:9px 11px}
  .kpis,.board,.meta{grid-template-columns:1fr}
  .kpi{padding:13px}
  .screen-head{margin-bottom:14px}
  .screen-head h2{font-size:19px}
  .pane-b,.sec .sb{padding:11px}
  .chart{height:255px}
  .chart.sm{height:220px}
  .lvbar .n{width:96px}
}
@media(max-width:390px){
  main{padding:12px}
  .screen-head p{font-size:12px}
  .kpis{gap:9px}
  .topbar{gap:8px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .kpi,.pane,.sec{opacity:1;transform:none}
}
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><span class="ms">insights</span></div>
        <div style="min-width:0">
          <h1>AI銷售預測 · AI Sales Forecasting</h1>
          <p>多變量需求預測平台 · 業務部 / PMC產銷規劃 / 財務部</p>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="ms" style="font-size:15px">calendar_month</span>預測期間 2026-Q3</span>
      <span class="pill"><span class="ms" style="font-size:15px">verified</span>MAPE 8.4%</span>
    </header>
    <div class="body">
      <nav class="side" id="nav">
        <div class="nav-h">功能模組</div>
      </nav>
      <main id="view"></main>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    var C={ac:"#2563EB",ac2:"#3B82F6",good:"#059669",warn:"#B45309",bad:"#DC2626",line:"#E4ECFC",sub:"#475569"};
    var charts=[];
    function disposeCharts(){
      for(var i=0;i<charts.length;i++){ try{charts[i].dispose();}catch(e){} }
      charts=[];
    }
    function mk(id,opt){
      var el=document.getElementById(id);
      if(!el) return;
      var ch=echarts.init(el);
      ch.setOption(opt);
      charts.push(ch);
    }
    function fmt(n){ return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,","); }

    var MODULES=[
      {icon:"monitoring",name:"預測總覽儀表",sub:"各產品線需求預測、MAPE 與偏差趨勢彙總"},
      {icon:"insights",name:"多變量預測模型",sub:"季節性、景氣循環與促銷變量的模型輸出"},
      {icon:"history",name:"客戶下單週期分析",sub:"客戶下單節律辨識與提前期補貨訊號"},
      {icon:"account_tree",name:"產品線需求分解",sub:"由品項到品類逐層拆解預測數量與金額"},
      {icon:"fact_check",name:"預測校準比對",sub:"AI 預測與業務人工預測差異審視與調整"},
      {icon:"trending_up",name:"產銷回饋規劃",sub:"回饋 PMC 產能與備料，追蹤準確率成效"}
    ];

    /* ============ SCREEN 0 : 預測總覽儀表 (split) ============ */
    var LINES=[
      {id:"CNC 加工件",cust:"38 客戶",fc:12840,mape:6.9,bias:+1.4,st:"good"},
      {id:"精密齒輪組",cust:"22 客戶",fc:8620,mape:8.1,bias:-2.2,st:"good"},
      {id:"液壓閥模組",cust:"17 客戶",fc:5410,mape:11.6,bias:+5.1,st:"warn"},
      {id:"伺服馬達件",cust:"29 客戶",fc:9730,mape:7.4,bias:-1.1,st:"good"},
      {id:"感測器外殼",cust:"14 客戶",fc:3260,mape:14.3,bias:+7.8,st:"bad"},
      {id:"連接器端子",cust:"41 客戶",fc:15120,mape:9.2,bias:+3.3,st:"warn"}
    ];
    function stColor(s){ return s==="good"?C.good:s==="warn"?C.warn:C.bad; }

      {item:"感測器外殼",ai:3260,human:2700,fin:3050,dev:+20.7,st:"bad"},
      {item:"治具備品",ai:2810,human:2900,fin:2850,dev:-3.1,st:"good"}
    ];
    function screen4(){
      var rows=CAL.map(function(r){
        return "<tr><td style='font-weight:700'>"+r.item+"</td>"+
          "<td class='tnum'>"+fmt(r.ai)+"</td>"+
          "<td class='tnum'>"+fmt(r.human)+"</td>"+
          "<td class='tnum'>"+fmt(r.fin)+"</td>"+
          "<td class='tnum "+(r.dev>0?"up":"down")+"'>"+(r.dev>0?"+":"")+r.dev+"%</td>"+
          "<td>"+stBadge(r.st)+"</td>"+
          "<td>"+(r.st==="bad"?"<span class='badge b-bad'>需協銷覆核</span>":r.st==="warn"?"<span class='badge b-warn'>經理確認</span>":"<span class='badge b-good'>採用 AI</span>")+"</td></tr>";
      }).join("");
      var h=""+
      "<div class='screen-head'><h2><span class='ms'>fact_check</span>預測校準比對</h2><p>AI 預測 vs 業務人工預測差異審視，逐品項校準並記錄最終採用值</p></div>"+
      "<div class='kpis'>"+
        kpi("difference","平均差異","9.2","%","flat","AI vs 人工")+
        kpi("handshake","一致採用","4","項","up","差異 < 5% 直接採用")+
        kpi("gavel","待協銷覆核","2","項","down","差異 > 15%")+
        kpi("verified","校準後 MAPE","8.4","%","up","▼ 較純人工 12.8%")+
      "</div>"+
      "<div class='g2'>"+
        "<div class='sec'><div class='sh'><span class='ms'>bar_chart</span>AI vs 人工預測對比<span class='r'>件</span></div><div class='sb'><div class='chartbox'><div id='c4cmp' class='chart'></div></div></div></div>"+
        "<div class='sec'><div class='sh'><span class='ms'>scatter_plot</span>差異分佈<span class='r'>偏差 %</span></div><div class='sb'><div class='chartbox'><div id='c4dev' class='chart'></div></div></div></div>"+
      "</div>"+
      "<div class='sec' style='margin-top:14px'><div class='sh'><span class='ms'>table_view</span>校準明細表<span class='r'>7 品項</span></div><div class='sb'>"+
        "<div class='tbl-wrap'><table><thead><tr><th>品項</th><th>AI 預測</th><th>人工預測</th><th>校準採用</th><th>差異</th><th>穩定度</th><th>處置</th></tr></thead><tbody>"+rows+"</tbody></table></div>"+
        "<div class='note' style='margin-top:12px'><span class='ms'>gavel</span>RULE-02：預估金額超過 100 萬元的高差異品項需由業務經理協銷覆核後方可回饋產銷。</div>"+
      "</div></div>";
      return h;
    }
    function draw4(){
      var items=CAL.map(function(r){return r.item;});
      mk2("c4cmp",{
        grid:{left:48,right:14,top:34,bottom:56},
        tooltip:{trigger:"axis"},
        legend:{data:["AI 預測","人工預測","校準採用"],top:0,textStyle:{fontSize:11}},
        xAxis:{type:"category",data:items,axisLabel:{fontSize:9.5,color:C.sub,interval:0,rotate:32}},
        yAxis:{type:"value",axisLabel:{fontSize:11,color:C.sub},splitLine:{lineStyle:{color:C.line}}},
        series:[
          {name:"AI 預測",type:"bar",data:CAL.map(function(r){return r.ai;}),itemStyle:{color:C.ac,borderRadius:[4,4,0,0]}},
          {name:"人工預測",type:"bar",data:CAL.map(function(r){return r.human;}),itemStyle:{color:C.ac2,borderRadius:[4,4,0,0]}},
          {name:"校準採用",type:"line",data:CAL.map(function(r){return r.fin;}),lineStyle:{color:C.warn,width:2},itemStyle:{color:C.warn},symbolSize:6}
        ]
      });
      mk2("c4dev",{
        grid:{left:48,right:20,top:16,bottom:34},
        tooltip:{trigger:"item",formatter:function(p){return p.data[2]+"<br/>偏差 "+p.data[1]+"%";}},
        xAxis:{type:"value",name:"品項序",nameTextStyle:{fontSize:10,color:C.sub},axisLabel:{fontSize:10,color:C.sub},splitLine:{lineStyle:{color:C.line}}},
        yAxis:{type:"value",axisLabel:{fontSize:11,color:C.sub,formatter:"{value}%"},splitLine:{lineStyle:{color:C.line}}},
        series:[
          {type:"scatter",symbolSize:15,data:CAL.map(function(r,i){return [i+1,r.dev,r.item];}),
            itemStyle:{color:function(p){var d=Math.abs(p.data[1]);return d>15?C.bad:d>5?C.warn:C.good;}}},
          {type:"line",markLine:{silent:true,symbol:"none",lineStyle:{color:C.ac2,type:"dashed"},data:[{yAxis:15},{yAxis:-15}],label:{fontSize:10}}}
        ]
      });
    }

    /* ============ SCREEN 5 : 產銷回饋規劃 (timeline + gauges) ============ */
    function screen5(){
      var plan=[
        ["CNC 加工件",12500,"充足","2026-08-18","good"],
        ["連接器端子",14600,"追加採購","2026-08-20","warn"],
        ["精密齒輪組",8700,"充足","2026-08-19","good"],
        ["液壓閥模組",5000,"產能瓶頸","2026-08-25","bad"],
        ["伺服馬達件",5300,"充足","2026-08-21","good"]
      ];
      var rows=plan.map(function(p){
        var b=p[4]==="good"?"b-good":p[4]==="warn"?"b-warn":"b-bad";
        return "<tr><td style='font-weight:700'>"+p[0]+"</td><td class='tnum'>"+fmt(p[1])+"</td><td><span class='badge "+b+"'>"+p[2]+"</span></td><td>"+p[3]+"</td></tr>";
      }).join("");
      var h=""+
      "<div class='screen-head'><h2><span class='ms'>trending_up</span>產銷回饋規劃</h2><p>將校準後預測回饋 PMC 產能與備料，並追蹤 MAPE 與偏差改善率成效</p></div>"+
      "<div class='kpis'>"+
        kpi("verified","本季 MAPE","8.4","%","up","目標 ≤ 10%")+
        kpi("trending_up","偏差改善率","+34","%","up","▲ vs 純人工基準")+
        kpi("factory","產能覆蓋","86","%","flat","1 項待協調")+
        kpi("savings","呆滯庫存下降","−22","%","up","備料更貼近需求")+
      "</div>"+
      "<div class='g2'>"+
        "<div class='sec'><div class='sh'><span class='ms'>monitoring</span>MAPE 準確率趨勢<span class='r'>近 6 期</span></div><div class='sb'><div class='chartbox'><div id='c5mape' class='chart'></div></div></div></div>"+
        "<div class='sec'><div class='sh'><span class='ms'>speed</span>目標達成度<span class='r'>本季</span></div><div class='sb'><div class='chartbox'><div id='c5gauge' class='chart'></div></div></div></div>"+
      "</div>"+
      "<div class='g2' style='margin-top:14px'>"+
        "<div class='sec'><div class='sh'><span class='ms'>inventory_2</span>備料/產能回饋<span class='r'>PMC</span></div><div class='sb'><div class='tbl-wrap'><table style='min-width:420px'><thead><tr><th>品項</th><th>回饋需求</th><th>備料狀態</th><th>投產日</th></tr></thead><tbody>"+rows+"</tbody></table></div></div></div>"+
        "<div class='sec'><div class='sh'><span class='ms'>timeline</span>回饋執行時間軸<span class='r'>本週</span></div><div class='sb'><div class='tl'>"+
          tlEv(true,"預測校準完成","業務經理簽核 · 2026-08-13")+
          tlEv(true,"回饋 PMC 產銷會議","確認 5 品項產能配置 · 2026-08-13")+
          tlEv(false,"連接器端子追加採購","缺口 820 件 · 待供應商回覆 2026-08-20")+
          tlEv(false,"液壓閥模組產能協調","外包評估中 · 目標 2026-08-25")+
          tlEv(false,"實績回收與 MAPE 覆核","月底更新模型 · 2026-08-31")+
        "</div></div></div>"+
      "</div>";
      return h;
    }
    function tlEv(done,h2,mm){ return "<div class='ev"+(done?" done":"")+"'><span class='tk'></span><div class='eh'>"+h2+"</div><div class='em'>"+mm+"</div></div>"; }
    function draw5(){
      mk2("c5mape",{
        grid:{left:44,right:16,top:30,bottom:26},
        tooltip:{trigger:"axis"},
        legend:{data:["AI 校準","純人工"],top:0,textStyle:{fontSize:11}},
        xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLabel:{fontSize:11,color:C.sub}},
        yAxis:{type:"value",axisLabel:{fontSize:11,color:C.sub,formatter:"{value}%"},splitLine:{lineStyle:{color:C.line}}},
        series:[
          {name:"AI 校準",type:"line",smooth:true,data:[11.2,10.5,9.8,9.1,8.7,8.4],lineStyle:{color:C.ac,width:3},itemStyle:{color:C.ac},areaStyle:{color:"rgba(124,58,237,.10)"}},
          {name:"純人工",type:"line",smooth:true,data:[13.4,13.1,12.9,12.8,12.9,12.8],lineStyle:{color:C.ac2,width:2,type:"dashed"},itemStyle:{color:C.ac2}}
        ]
      });
      mk2("c5gauge",{
        series:[{type:"gauge",startAngle:210,endAngle:-30,min:0,max:100,radius:"92%",center:["50%","56%"],
          progress:{show:true,width:16,itemStyle:{color:C.ac}},
          axisLine:{lineStyle:{width:16,color:[[0.7,"#ede9fe"],[1,"#ddd6fe"]]}},
          pointer:{itemStyle:{color:C.ac}},
          axisTick:{show:false},splitLine:{length:10,lineStyle:{color:"#fff",width:2}},
          axisLabel:{fontSize:9,color:C.sub,distance:14},
          detail:{valueAnimation:false,fontSize:26,fontWeight:800,offsetCenter:[0,"38%"],formatter:"{value}%",color:C.ac},
          title:{offsetCenter:[0,"66%"],fontSize:12,color:C.sub},
          data:[{value:88,name:"預測目標達成度"}]}]
      });
    }

    /* ============ helpers ============ */
    function kpi(icon,label,val,unit,dir,desc){
      return "<div class='kpi'><div class='kl'><span class='ms'>"+icon+"</span>"+label+"</div>"+
        "<div class='kv'>"+val+(unit?"<span style='font-size:14px;font-weight:700;color:var(--sub)'> "+unit+"</span>":"")+"</div>"+
        "<div class='kd "+(dir==="up"?"up":dir==="down"?"down":"flat")+"'>"+desc+"</div></div>";
    }
    function mk2(id,opt){ mk(id,opt); }

    var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
    var DRAW=[function(){draw0(0);},draw1,function(){draw2(0);},draw3,draw4,draw5];

    function buildNav(){
      var nav=document.getElementById("nav");
      var html="<div class='nav-h'>功能模組</div>";
      for(var i=0;i<MODULES.length;i++){
        html+="<button class='navbtn' data-i='"+i+"' onclick='show("+i+")'>"+
          "<span class='ms'>"+MODULES[i].icon+"</span><span class='nlab'>"+MODULES[i].name+"</span><span class='idx'>0"+(i+1)+"</span></button>";
      }
      nav.innerHTML=html;
    }

    window.show=function(i){
      disposeCharts();
      var view=document.getElementById("view");
      view.innerHTML=RENDER[i]();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
      void view.offsetHeight;
      DRAW[i]();
    };

    buildNav();

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
