<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>會員分眾推播所 · Member Segmentation</title>
<meta name="description" content="RFM 分眾、標籤名單、EDM/簡訊/LINE 多渠道推播、A/B 測試與回購歸因的會員行銷平台（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#db2777;--accent2:#f472b6;--ink:#1f1017;--bg:#fbf3f7;--card:#fff;--line:#f4dde8;--mut:#8a6d79;--ok:#0d9488;--warn:#d97706;--bad:#dc2626;--soft:#fdeef4}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto;min-width:0}
.side .bd{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 22px rgba(219,39,119,.4)}
.side .lg .material-symbols-outlined{font-size:25px}
.side .bd b{font-size:15px;font-weight:900;font-family:"Noto Sans TC";display:block;line-height:1.2}
.side .bd span{font-size:9px;color:var(--accent);letter-spacing:1.3px;font-weight:800}
.nlabel{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:1px;padding:12px 10px 5px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#5c3f49;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#d98cb0}
.side button:hover{background:var(--soft)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.3)}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.7}
.side .foot b{color:var(--accent)}
.main{padding:22px 26px 44px;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.vhr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{background:var(--soft);color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.datechip{background:#fef3c7;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.26;font-size:30px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#cdf3ee;color:#0f766e}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#fde8f1;color:#be185d}.t-plat{background:#ede9fe;color:#6d28d9}.t-line{background:#dcfce7;color:#15803d}.t-sms{background:#e0f2fe;color:#0369a1}.t-edm{background:#fde8f1;color:#be185d}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11.5px;background:var(--soft)}
table.data tr:last-child td{border-bottom:0}
.rank{width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:900;display:inline-grid;place-content:center;font-size:12px;flex:none}
.rank.top{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.chart{height:250px}
.scroll{overflow-x:auto}
.bar{height:8px;background:#f6e0ea;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* signature: RFM segmentation grid */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.seg>*{min-width:0}
.sc{border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:linear-gradient(155deg,#fff,var(--soft));position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.sc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sccol,var(--accent))}
.sc .st{display:flex;align-items:center;gap:9px}
.sc .sd{width:34px;height:34px;border-radius:11px;background:var(--sccol,var(--accent));color:#fff;display:grid;place-items:center;flex:none}
.sc .sd .material-symbols-outlined{font-size:19px}
.sc .st b{font-family:"Noto Sans TC";font-size:14px;line-height:1.2;display:block}
.sc .st small{color:var(--mut);font-size:10.5px}
.sc .snum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc .snum .n{font-family:Inter;font-weight:900;font-size:23px;color:var(--sccol,var(--accent))}
.sc .snum .pc{font-size:12px;font-weight:800;color:var(--mut)}
.sc .sr{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.sc .sr b{color:var(--ink);font-family:Inter}
.sc .stip{font-size:11px;color:var(--mut);border-top:1px dashed var(--line);padding-top:7px;line-height:1.5}
/* RFM heat quadrant */
.rfm{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;font-size:11px}
.rfm>div{min-width:0}
.rfm .hh{display:grid;place-items:center;font-weight:800;color:var(--mut);padding:5px 0}
.rfm .rl{display:grid;place-items:center;font-weight:800;color:var(--mut);padding:0 6px}
.rfm .cell{border-radius:8px;aspect-ratio:1.7/1;display:grid;place-items:center;font-weight:900;color:#fff;font-family:Inter;font-size:12px}
/* push campaign performance panel (signature) */
.perf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.perf>*{min-width:0}
.pf{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:linear-gradient(160deg,#fff,var(--soft))}
.pf .l{font-size:11.5px;color:var(--mut);font-weight:700}
.pf .v{font-size:22px;font-weight:900;margin-top:4px;font-family:Inter}
.pf .s{font-size:11px;font-weight:800;margin-top:2px}
.camp{display:flex;flex-direction:column;gap:10px}
.ci{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px}
.ci .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ci .ct b{font-family:"Noto Sans TC";font-size:13.5px}
.ci .cd{color:var(--mut);font-size:11.5px;margin-top:3px}
.ci .cfun{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.ci .cfun>div{min-width:0;text-align:center;background:var(--soft);border-radius:9px;padding:6px 4px}
.ci .cfun span{font-size:10px;color:var(--mut);display:block}
.ci .cfun b{font-family:Inter;font-size:14px;color:var(--accent)}
.funnel{display:flex;flex-direction:column;gap:8px}
.fr{display:flex;align-items:center;gap:10px}
.fr .fn{width:74px;font-weight:800;font-size:12px;font-family:"Noto Sans TC";flex:none}
.fr .fb{flex:1;min-width:0;background:#f6e0ea;border-radius:8px;overflow:hidden;height:26px;position:relative}
.fr .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px}
.fr .fb span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#fff}
.fr .fv{width:70px;text-align:right;font-weight:800;color:var(--accent);flex:none;font-family:Inter;font-size:12px}
.chan{display:flex;flex-direction:column;gap:11px}
.chr{display:flex;align-items:center;gap:11px;font-size:12.5px}
.chr .cn{width:64px;font-weight:800;font-family:"Noto Sans TC";flex:none}
.chr .cbar{flex:1;min-width:0}
.chr .cv{width:56px;text-align:right;font-weight:800;color:var(--accent);flex:none;font-family:Inter}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.o{border-left-color:var(--ok)}
.ri .mid{flex:1;min-width:0}.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}.ri .qty b{font-family:Inter;font-size:15px;color:var(--accent)}.ri .qty small{display:block;font-size:10px;color:var(--mut)}
/* audience builder */
.aud{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.aud>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--soft);color:#8a3d63;border:1px solid var(--line);display:flex;align-items:center;gap:5px}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.chip .material-symbols-outlined{font-size:15px}
.cond{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:9px;background:#fff;font-size:12.5px}
.cond .op{font-size:11px;font-weight:800;color:var(--accent);background:var(--soft);padding:3px 8px;border-radius:7px;flex:none}
.cond .cx{margin-left:auto;color:var(--mut);flex:none}
.est{background:linear-gradient(150deg,var(--accent),var(--accent2));color:#fff;border-radius:16px;padding:18px;text-align:center}
.est .en{font-family:Inter;font-weight:900;font-size:34px;line-height:1}
.est .el{font-size:12px;opacity:.9;margin-top:4px}
.est .em{display:flex;justify-content:space-around;margin-top:14px;gap:8px}
.est .em div span{font-size:10.5px;opacity:.85;display:block}
.est .em div b{font-family:Inter;font-size:16px}
/* A/B */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ab>*{min-width:0}
.va{border:2px solid var(--line);border-radius:16px;padding:16px;background:#fff;position:relative}
.va.win{border-color:var(--accent);box-shadow:0 10px 26px rgba(219,39,119,.16)}
.va .vt{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.va .vt .vl{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:900;display:grid;place-items:center;font-family:Inter;flex:none}
.va.win .vt .vl{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.va .vt b{font-family:"Noto Sans TC";font-size:14px}
.prev{border:1px dashed #efb8d2;border-radius:11px;padding:12px;background:var(--soft);font-size:12px;line-height:1.6;margin-bottom:12px}
.prev .subj{font-weight:800;font-family:"Noto Sans TC";color:var(--ink);margin-bottom:5px}
.vmet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vmet>div{min-width:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.vmet span{font-size:10.5px;color:var(--mut);display:block}
.vmet b{font-family:Inter;font-size:18px;color:var(--accent)}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible;align-items:center}
 .side .bd{width:100%;padding-bottom:8px}
 .nlabel{display:none}
 .side button{width:auto;flex:none;padding:8px 12px;white-space:nowrap}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.aud,.ab{grid-template-columns:1fr}
 .seg{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){.kpis{grid-template-columns:1fr}.seg{grid-template-columns:1fr}.main{padding:16px 14px 40px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg"><span class="material-symbols-outlined">diversity_3</span></div><div><b>會員分眾推播所</b><span>MEMBER SEGMENTATION</span></div></div>
    <div class="nlabel">行銷營運台</div>
    <div id="nav"></div>
    <div class="foot">會員總數 <b>128,640</b> · 分眾 <b>8</b> 群<br/>本月推播 <b>34</b> 檔 · 平均開信 <b>41.6%</b><br/>資料更新 08-13 21:40</div>

  <main class="main">

</div>
<script>
var MOD=[
 ["分眾總覽","dashboard","分眾總覽","會員分眾結構、推播成效與回購貢獻的即時戰情"],
 ["RFM 分眾","scatter_plot","RFM 分眾象限","依最近購買、頻率、金額自動切分的分眾名單卡"],
 ["標籤 / 名單","sell","標籤與名單圈選","動態標籤、條件篩選與可再用受眾名單估算"],
 ["推播活動","campaign","推播活動編排","EDM / 簡訊 / LINE 多渠道排程、內容與成效"],
 ["A/B 測試","science","A/B 測試","版本分流、顯著性判定與勝出版本放量"],
 ["成效歸因","monitoring","成效追蹤與歸因","開信、點擊、轉換與回購金額的分眾歸因"]
];
var money=function(n){return "$"+n.toLocaleString();};
var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach(function(m,i){var b=document.createElement('button');b.dataset.i=i;b.className=i===0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=function(){show(i);};nav.appendChild(b);});

/* ---- data ---- */
/* segment: name, en, icon, color, people, pct, r,f,m(1-5), gmv, tip */
var SEG=[
 ["高價值 VIP","Champions","workspace_premium","#be185d",8620,6.7,5,5,5,"$18.6M","近期高頻高額，給專屬回饋與新品優先權"],
 ["忠誠回購","Loyal","favorite","#db2777",14280,11.1,4,5,4,"$12.4M","穩定回購，適合會員日與集點加碼"],
 ["高潛力新客","Potential","trending_up","#ec4899",11540,9.0,5,2,3,"$4.8M","新近購買、頻率待養成，推首購續購券"],
 ["一般活躍","Active","group","#f472b6",26800,20.8,3,3,3,"$9.2M","中段主力，維持既有推播節奏"],
 ["價格敏感","Discount","sell","#f59e0b",18960,14.7,3,3,2,"$3.6M","對折扣敏感，檔期活動觸發效果佳"],
 ["瀕臨流失","At Risk","hourglass_bottom","#fb923c",16240,12.6,2,3,3,"$5.1M","購買間隔拉長，需限時誘因喚回"],
 ["沉睡會員","Hibernating","bedtime","#94a3b8",22380,17.4,1,2,2,"$1.9M","90 天以上未回購，喚回券 + 內容重啟"],
 ["流失警戒","Lost","person_off","#64748b",9820,7.6,1,1,1,"$0.4M","長期無互動，低成本渠道最後嘗試"]
];
/* campaign: name, channel(class,txt), target, sent, open%, click%, conv, gmv, status(class,txt) */
var CAMP=[
 ["夏末 VIP 專屬新品預覽",["t-edm","EDM"],"高價值 VIP",8620,62.4,28.6,1284,"$2.86M",["t-ok","發送完成"]],
 ["會員日滿千折百",["t-line","LINE"],"忠誠回購 + 一般活躍",41080,48.2,19.4,3620,"$4.18M",["t-ok","發送中"]],
 ["新客首購續購券 $150",["t-sms","簡訊"],"高潛力新客",11540,-1,14.8,986,"$0.92M",["t-ok","發送完成"]],
 ["沉睡會員喚回 88 折",["t-line","LINE"],"沉睡會員",22380,31.6,9.2,612,"$0.68M",["t-warn","A/B 測試中"]],
 ["瀕臨流失限時加碼",["t-edm","EDM"],"瀕臨流失",16240,38.4,12.6,724,"$1.14M",["t-warn","排程中"]],
 ["生日禮遇雙倍點數",["t-sms","簡訊"],"當月壽星",4260,-1,22.4,548,"$0.62M",["t-ok","發送完成"]]
];
/* channel: name, sent, open/reach%, click%, cost */
var CHAN=[
 ["EDM",286400,42.6,11.8,0.08],
 ["LINE",198600,58.4,16.2,0.35],
 ["簡訊",96200,96.0,8.4,1.20],
 ["App 推播",142800,34.2,9.6,0.02]
];
var SEGMAX=Math.max.apply(null,SEG.map(function(s){return s[4];}));

function segCard(s){
 return '<div class="sc" style="--sccol:'+s[3]+'"><div class="st"><span class="sd"><span class="material-symbols-outlined">'+s[2]+'</span></span><div><b>'+s[0]+'</b><small>'+s[1]+' · R'+s[4+2]+' F'+s[5+2]+' M'+s[6+2]+'</small></div></div>'+
  '<div class="snum"><span class="n">'+s[4].toLocaleString()+'</span><span class="pc">人 · 佔 '+s[5]+'%</span></div>'+
  '<div class="bar"><i style="width:'+(s[4]/SEGMAX*100).toFixed(0)+'%;background:'+s[3]+'"></i></div>'+
  '<div class="sr"><span>累積貢獻</span><b>'+s[9]+'</b></div>'+
  '<div class="stip">'+s[10]+'</div></div>';
}

/* ---- screens ---- */
var SCREENS=[
 /* 0 分眾總覽 */
 function(){
