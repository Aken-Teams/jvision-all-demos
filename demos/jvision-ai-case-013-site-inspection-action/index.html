<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>巡檢改善追蹤台 · Site Inspection & Action</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#f97316;--ink:#1c1410;--bg:#f5f1ec;--card:#fff;--line:#e7ded4;--mut:#7a6a5c;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(234,88,12,.4)}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9.5px;color:var(--accent);letter-spacing:1.1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#5b4c40;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#b8a595}
.side button:hover{background:#faf5ef}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.7}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fff1e6;color:#c2410c;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-orange{background:#ffedd5;color:#c2410c}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf5ef}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#f0e9e0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
.ck{display:flex;flex-direction:column;gap:9px}
.ci{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px}
.ci .cn{flex:1;min-width:0}
.ci .cn b{font-size:13px;font-family:"Noto Sans TC";display:block}
.ci .cn small{color:var(--mut);font-size:11px}
.ci .jd{display:flex;gap:6px;flex:none}
.pill{font-size:11px;font-weight:800;padding:4px 11px;border-radius:8px;border:1.5px solid var(--line);color:#a99;background:#fff}
.pill.pass{border-color:var(--ok);background:#dcfce7;color:#15803d}
.pill.fail{border-color:var(--bad);background:#fee2e2;color:#b91c1c}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{aspect-ratio:4/3;border:1.5px dashed #d6c9ba;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#b09a86;font-size:11px;background:#faf6f1;text-align:center}
.ph .material-symbols-outlined{font-size:22px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kb>*{min-width:0}
.kcol{background:#faf5ef;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;font-family:"Noto Sans TC";padding:2px 4px 4px}
.kcol .kh span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--mut)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;border-left:4px solid var(--accent)}
.kcard.b1{border-left-color:var(--bad)}.kcard.b2{border-left-color:var(--warn)}.kcard.b3{border-left-color:var(--info)}.kcard.b4{border-left-color:var(--ok)}
.kcard b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.kcard small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.kcard .kf{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--mut)}
.ava{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{min-width:0}
.cmp .lbl{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.vrow{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.vrow .vhd{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.vrow .vhd b{font-size:13px;font-family:"Noto Sans TC"}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;border:1px solid var(--bad);color:var(--bad)}
.mini{display:flex;gap:6px}
.slist{display:flex;flex-direction:column;gap:9px}
.si{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.si .dt{flex:none;text-align:center;background:#fff7f0;border:1px solid #f4d9c2;border-radius:10px;padding:6px 9px;min-width:52px}
.si .dt b{font-size:16px;font-family:Inter;color:var(--accent);display:block;line-height:1}
.si .dt small{font-size:9.5px;color:var(--mut)}
.si .sm{flex:1;min-width:0}
.si .sm b{font-size:13px;font-family:"Noto Sans TC"}
.si .sm small{display:block;color:var(--mut);font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two{grid-template-columns:1fr}
 .kb{grid-template-columns:repeat(2,1fr)}
 .cmp{grid-template-columns:1fr}
}
@media(max-width:430px){
 .kb{grid-template-columns:1fr}
 .photos{grid-template-columns:repeat(3,1fr)}
 .main{padding:16px 14px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">巡</div><div><b>巡檢改善追蹤台</b><span>SITE INSPECTION · CAPA</span></div></div>
    <div id="nav"></div>
    <div class="foot">工區 A/B/C · 檢查表 12 式<br/>本月缺失 148 · 已關閉 121<br/>改善時效 2.1 天</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">巡檢總覽</h2><p id="vd"></p></div><div class="live"><i></i>現場即時回傳</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["巡檢總覽","monitoring","巡檢總覽","缺失、改善與複查全局戰情，掌握工地品安節奏"],
["巡檢執行","fact_check","巡檢執行","排定巡檢任務、逐項填寫檢查表與合格判定"],
["缺失追蹤","bug_report","缺失追蹤","缺失單登錄，含照片、定位與嚴重度分級"],
["改善看板","view_kanban","改善看板","待改善／改善中／待複查／已關閉四欄推進"],
["複查驗證","verified","複查驗證","比對改善前後照片，複查驗收與結案關閉"],
["統計報表","insert_chart","統計報表","缺失類型分佈、改善時效與工區排名分析"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const DEF=[
["DF-2418","B 棟 5F 電氣","配電盤接地未確實","高","待改善","陳志明","t-bad"],
["DF-2417","A 棟 3F 結構","鷹架踏板缺件2處","高","改善中","豐邦工程","t-warn"],
["DF-2416","C 棟 地下室","消防管路未固定","中","待複查","O安機電","t-info"],
["DF-2415","A 棟 2F 假設","開口護欄高度不足","中","改善中","豐邦工程","t-warn"],
["DF-2414","B 棟 屋突","防水層施工瑕疵","低","已關閉","昇泰防水","t-ok"],
["DF-2413","C 棟 1F 泥作","粉刷面裂縫","低","已關閉","O成營造","t-ok"]];
const CHK=[
["安全帽與背負式安全帶佩戴","個人防護具",1],
["高處作業開口護欄與防墜網","墜落防護",0],
["電氣設備接地與漏電斷路器","電氣安全",0],
["動火作業滅火器與監火人","火災預防",1],
["物料堆置穩固與通道淨空","物料管理",1],
["鷹架踏板固定與交叉拉桿","假設工程",0]];
const KAN={
"待改善":[["DF-2418","配電盤接地未確實","B 棟 5F 電氣","高","陳","逾期 1 天","b1"],["DF-2420","樓梯扶手鬆動","A 棟 4F","中","王","今日到期","b1"]],
"改善中":[["DF-2417","鷹架踏板缺件2處","A 棟 3F","高","豐","剩 2 天","b2"],["DF-2415","開口護欄高度不足","A 棟 2F","中","豐","剩 3 天","b2"]],
"待複查":[["DF-2416","消防管路未固定","C 棟 地下室","中","泰","已上傳照片","b3"],["DF-2419","臨時用電線路裸露","B 棟 1F","中","陳","待排複查","b3"]],
"已關閉":[["DF-2414","防水層施工瑕疵","B 棟 屋突","低","昇","複查合格","b4"],["DF-2413","粉刷面裂縫","C 棟 1F","低","成","複查合格","b4"]]
};
const VER=[
["DF-2416","消防管路未固定","C 棟 地下室 · 泰安機電","中"],
["DF-2419","臨時用電線路裸露","B 棟 1F · 陳志明","中"]];
const SCH=[
["19","週一","A 棟結構安全巡檢","陳志明 · 08:30","查檢 18 項","t-orange"],
["19","週一","全區用電消防巡檢","王倉管 · 14:00","查檢 22 項","t-info"],
["20","週二","B 棟假設工程巡檢","豐邦工程 · 09:00","查檢 15 項","t-orange"],
["21","週三","C 棟高處作業複查","營建主管 · 10:30","複查 6 件","t-ok"]];

function photos(n,label){let h='';for(let i=0;i<n;i++)h+='<div class="ph"><span class="material-symbols-outlined">photo_camera</span>'+(label||'照片')+'</div>';return h;}

const SCREENS=[
/* 0 巡檢總覽 */
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">fact_check</span><div class="l">本月巡檢</div><div class="v">64<small style="font-size:12px"> 次</small></div><div class="d up">▲ 達成率 96%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">bug_report</span><div class="l">待改善缺失</div><div class="v" style="color:var(--bad)">27</div><div class="d dn">逾期 4 · 高風險 6</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">timelapse</span><div class="l">平均改善時效</div><div class="v">2.1<small style="font-size:12px"> 天</small></div><div class="d up">▼ 較 7.1 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">verified</span><div class="l">複查關閉率</div><div class="v">81.8<small style="font-size:12px">%</small></div><div class="d up">▲ 一次通過 89%</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">assignment_late</span>近期缺失單 <span class="tag t-bad" style="margin-left:auto">高風險 2</span></h3><div class="scroll"><table class="data"><tr><th>缺失單</th><th>位置</th><th>缺失描述</th><th>嚴重</th><th>狀態</th></tr>${DEF.map(d=>`<tr><td><b>${d[0]}</b></td><td>${d[1]}</td><td>${d[2]}</td><td><span class="tag ${d[3]=='高'?'t-bad':d[3]=='中'?'t-warn':'t-info'}">${d[3]}</span></td><td><span class="tag ${d[6]}">${d[4]}</span></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>缺失狀態分佈</h3><div class="chart" id="c_stat" style="height:210px"></div>
  <h3 style="margin-top:14px"><span class="material-symbols-outlined">trending_up</span>週改善完成率</h3><div class="chart" id="c_trend" style="height:150px"></div></div>
</div>`,

/* 1 巡檢執行 (v1 排定巡檢) */
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">event</span>本週巡檢排程</h3><div class="slist">${SCH.map(s=>`<div class="si"><div class="dt"><b>${s[0]}</b><small>${s[1]}</small></div><div class="sm"><b>${s[2]}</b><small>${s[3]}</small></div><span class="tag ${s[5]}">${s[4]}</span></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">checklist</span>檢查表 · A 棟結構安全 <span class="tag t-warn" style="margin-left:auto">不合格 3</span></h3><div class="ck">${CHK.map(c=>`<div class="ci"><div class="cn"><b>${c[0]}</b><small>類別：${c[1]}</small></div><div class="jd"><span class="pill ${c[2]?'pass':''}">合格</span><span class="pill ${c[2]?'':'fail'}">不合格</span></div></div>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--mut)"><span>進度 6 / 18 項</span><span style="color:var(--accent);font-weight:800">合格率 50%</span></div><div class="bar" style="margin-top:6px"><i style="width:33%"></i></div></div>
</div>`,

/* 2 缺失追蹤 (v2 現場記錄缺失) */
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">edit_note</span>缺失單登錄 · DF-2418</h3>
  <table class="data" style="margin-bottom:14px"><tr><th style="width:82px">工區位置</th><td>B 棟 5F 電氣間（座標 X:12 Y:34）</td></tr><tr><th>缺失類別</th><td>電氣安全</td></tr><tr><th>缺失描述</th><td>配電盤接地線未確實鎖固，接地電阻超標</td></tr><tr><th>嚴重度</th><td><span class="tag t-bad">高風險</span> 阻擋當日施工面</td></tr><tr><th>責任單位</th><td>陳志明（自營電氣班）</td></tr><tr><th>改善期限</th><td>2026-08-15（3 天）</td></tr></table>
  <div class="cmp"><div><div class="lbl"><span class="material-symbols-outlined" style="font-size:16px;color:var(--bad)">photo_camera</span>缺失現況照片</div><div class="photos" style="grid-template-columns:repeat(3,1fr)">${photos(3,'缺失照')}</div></div><div><div class="lbl"><span class="material-symbols-outlined" style="font-size:16px;color:var(--info)">place</span>定位標記</div><div class="ph" style="aspect-ratio:auto;height:calc(100% - 22px);min-height:96px"><span class="material-symbols-outlined">map</span>平面圖定位</div></div></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">format_list_bulleted</span>今日新增缺失</h3><div class="scroll"><table class="data"><tr><th>單號</th><th>位置</th><th>嚴重</th></tr>${DEF.slice(0,5).map(d=>`<tr><td><b>${d[0]}</b><br/><small style="color:var(--mut)">${d[2]}</small></td><td>${d[1]}</td><td><span class="tag ${d[3]=='高'?'t-bad':d[3]=='中'?'t-warn':'t-info'}">${d[3]}</span></td></tr>`).join('')}</table></div>
  <div class="legend"><span><i class="dot" style="background:var(--bad)"></i>高 6</span><span><i class="dot" style="background:var(--warn)"></i>中 12</span><span><i class="dot" style="background:var(--info)"></i>低 9</span></div></div>
</div>`,

/* 3 改善看板 (v3 指派改善／改善執行) */
()=>`<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>缺失改善看板 <span class="tag t-orange" style="margin-left:auto">拖拉更新狀態</span></h3>

let CH=[];
function dispose(){CH.forEach(c=>{try{c.dispose();}catch(e){}});CH=[];}
function mk(id){const el=document.getElementById(id);if(!el)return null;const c=echarts.init(el);CH.push(c);return c;}
function draw(i){
 dispose();
 if(i==0){
  var c=mk('c_stat');if(c)c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:10.5},itemWidth:11,itemHeight:11},series:[{type:'pie',radius:['46%','72%'],center:['50%','42%'],label:{show:false},data:[{value:27,name:'待改善',itemStyle:{color:'#dc2626'}},{value:34,name:'改善中',itemStyle:{color:'#f59e0b'}},{value:16,name:'待複查',itemStyle:{color:'#2563eb'}},{value:71,name:'已關閉',itemStyle:{color:'#16a34a'}}]}]});
  var t=mk('c_trend');if(t)t.setOption({grid:{left:34,right:12,top:14,bottom:22},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['第1週','第2週','第3週','第4週','第5週','第6週'],axisLabel:{fontSize:10}},yAxis:{type:'value',max:100,axisLabel:{fontSize:10}},series:[{type:'line',smooth:true,data:[62,68,71,76,82,88],areaStyle:{color:'rgba(234,88,12,.15)'},lineStyle:{color:'#ea580c',width:2.5},itemStyle:{color:'#ea580c'}}]});
 }
 if(i==5){
  var p=mk('c_type');if(p)p.setOption({tooltip:{trigger:'item'},legend:{bottom:0,type:'scroll',textStyle:{fontSize:10.5}},series:[{type:'pie',roseType:'radius',radius:['32%','70%'],center:['50%','44%'],label:{fontSize:10},data:[{value:38,name:'墜落防護',itemStyle:{color:'#ea580c'}},{value:29,name:'電氣安全',itemStyle:{color:'#f97316'}},{value:24,name:'假設工程',itemStyle:{color:'#fb923c'}},{value:21,name:'物料管理',itemStyle:{color:'#fdba74'}},{value:18,name:'火災預防',itemStyle:{color:'#f59e0b'}},{value:12,name:'環境衛生',itemStyle:{color:'#fcd34d'}}]}]});
  var z=mk('c_zone');if(z)z.setOption({grid:{left:38,right:44,top:20,bottom:26},tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontSize:10.5}},xAxis:{type:'category',data:['A 棟','B 棟','C 棟','地下室','公共區'],axisLabel:{fontSize:10.5}},yAxis:[{type:'value',name:'缺失數',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},{type:'value',name:'天',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}}],series:[{name:'缺失數',type:'bar',data:[41,34,29,16,28],itemStyle:{color:'#ea580c',borderRadius:[4,4,0,0]},barWidth:16},{name:'改善時效(天)',type:'line',yAxisIndex:1,data:[3.2,1.8,2.4,2.1,2.6],lineStyle:{color:'#2563eb',width:2.5},itemStyle:{color:'#2563eb'}}]});
 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
window.addEventListener('resize',function(){CH.forEach(c=>{try{c.resize();}catch(e){}});});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
