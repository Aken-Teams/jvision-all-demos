<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>巡檢改善追蹤台 · Site Inspection & Action</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#64748b;--color-on-primary:#fff;--color-secondary:#94a3b8;
 --color-on-secondary:#0f172a;--color-accent:#ea580c;--color-on-accent:#000;
 --color-background:#f8fafc;--color-foreground:#334155;--color-card:#fff;
 --color-card-foreground:#334155;--color-muted:#ebf0f5;--color-muted-foreground:#475569;
 --color-border:#e2e8f0;--color-destructive:#dc2626;--color-on-destructive:#fff;
 --color-ring:#64748b;--blue:#64748b;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;
 --ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;
 --accent:#ea580c;--bg:#f8fafc;--card:#fff;--shadow:0 12px 32px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC",sans-serif;font-size:14px;line-height:1.5}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(100,116,139,.38);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.mono,table.data td:first-child,.kcard b,.si .dt,.kpi .v{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
 position:sticky;top:0;height:100vh;overflow:auto;z-index:20;
 display:flex;flex-direction:column;padding:22px 16px;
 background:#fff;border-right:1px solid var(--line)
}
.bd{display:flex;align-items:center;gap:12px;padding:2px 7px 25px}
.lg{
 width:42px;height:42px;flex:none;display:grid;place-items:center;
 background:var(--ink);color:#fff;border-radius:3px;font-size:17px;font-weight:800;
 box-shadow:5px 5px 0 var(--accent)
}
.bd b{display:block;font-size:15px;font-weight:800;letter-spacing:.02em}
.bd span{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.13em}
#nav{display:flex;flex-direction:column;gap:3px}
.side button{
 min-height:44px;width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;
 color:#475569;background:transparent;border:1px solid transparent;border-radius:4px;
 text-align:left;font-size:13px;font-weight:650;transition:background .2s,color .2s,border-color .2s,transform .2s
}
.side button .material-symbols-outlined{color:#64748b}
.side button:hover{background:#f1f5f9;color:#0f172a;transform:translateX(2px)}
.side button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.side button.on .material-symbols-outlined{color:#fb923c}
.foot{margin-top:auto;padding:18px 10px 2px;border-top:1px solid var(--line);color:#475569;font-size:11px;line-height:1.8}
.main{padding:28px clamp(18px,3vw,42px) 42px;overflow:hidden}
.vh{
 min-height:174px;margin-bottom:18px;padding:28px 30px;
 display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
 position:relative;overflow:hidden;background:#0f172a;color:#fff;border-radius:6px
}
.vh:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:
 linear-gradient(90deg,transparent 49.8%,rgba(255,255,255,.07) 50%,transparent 50.2%),
 linear-gradient(0deg,transparent 49.8%,rgba(255,255,255,.06) 50%,transparent 50.2%);
 background-size:48px 48px
}
.vh:after{content:"FIELD / 08";position:absolute;right:24px;top:18px;color:rgba(255,255,255,.16);font-size:38px;font-weight:800;letter-spacing:-.06em}
.vh>div{position:relative;z-index:1}
.vh h2{margin:0;font-size:clamp(27px,3vw,42px);line-height:1.08;font-weight:800;letter-spacing:-.045em}
.vh h2:after{content:" /";color:var(--accent)}
.vh p{max-width:660px;margin:10px 0 0;color:#cbd5e1;font-size:13px}
.live{
 position:relative;z-index:1;display:flex;align-items:center;gap:8px;white-space:nowrap;
 padding:9px 13px;background:#fff;color:#0f172a;border-left:4px solid var(--accent);
 border-radius:2px;font-size:11px;font-weight:800;letter-spacing:.03em
}
.live i{width:8px;height:8px;background:var(--accent);border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
 min-height:128px;padding:17px 18px;position:relative;overflow:hidden;
 background:var(--card);border:1px solid var(--line);border-radius:5px;
 box-shadow:0 1px 0 rgba(15,23,42,.03);
 transition:transform .22s,border-color .22s,box-shadow .22s
}
.kpi:hover{transform:translateY(-3px);border-color:#cbd5e1;box-shadow:var(--shadow)}
.kpi:after{content:"";position:absolute;left:0;bottom:0;width:42px;height:3px;background:var(--accent)}
.kpi .l{color:#475569;font-size:11px;font-weight:700;letter-spacing:.04em}
.kpi .v{margin-top:7px;color:#0f172a;font-size:29px;line-height:1;font-weight:800;letter-spacing:-.04em}
.kpi .v small{font-size:12px;font-weight:600;letter-spacing:0}
.kpi .d{margin-top:9px;font-size:10.5px;font-weight:700}
.kpi .ic{position:absolute;right:15px;top:15px;color:#94a3b8;font-size:22px}
.up{color:#166534}.dn{color:#b91c1c}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.36fr) minmax(330px,.84fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
 background:#fff;border:1px solid var(--line);border-radius:5px;padding:18px;
 box-shadow:0 1px 2px rgba(15,23,42,.025);
 transition:border-color .22s,box-shadow .22s
}
.card:hover{border-color:#cbd5e1;box-shadow:0 10px 26px rgba(15,23,42,.05)}
.card h3{
 margin:0 0 15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 color:#0f172a;font-size:13px;font-weight:800;letter-spacing:.015em
}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.tag{
 display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;
 font-size:10px;font-weight:800;line-height:1.45;white-space:nowrap;border:1px solid currentColor
}
.t-ok{background:#f0fdf4;color:#166534}.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#991b1b}.t-info{background:#eff6ff;color:#1e40af}
.t-orange{background:#fff7ed;color:#9a3412}
.scroll{overflow-x:auto;scrollbar-color:#94a3b8 #f1f5f9}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.data th{
 background:#f1f5f9;color:#334155;font-size:10.5px;font-weight:800;
 letter-spacing:.04em;white-space:nowrap
}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:#f8fafc}
table.data td:first-child,table.data td:has(>b:first-child){font-family:"JetBrains Mono",monospace}
table.data td:nth-child(n+2){font-variant-numeric:tabular-nums}
.chart{height:250px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bar{height:7px;background:#e2e8f0;border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.ck{display:flex;flex-direction:column;gap:7px}
.ci{
 display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 12px;
 border:1px solid var(--line);border-left:3px solid #cbd5e1;border-radius:3px;
 transition:border-color .2s,background .2s
}
.ci:hover{background:#f8fafc;border-left-color:var(--accent)}
.ci .cn{flex:1;min-width:0}.ci .cn b{display:block;color:#1e293b;font-size:12px}
.ci .cn small{color:#475569;font-size:10.5px}.ci .jd{display:flex;gap:5px;flex:none}
.pill{
 padding:4px 9px;background:#fff;color:#64748b;border:1px solid #cbd5e1;
 border-radius:3px;font-size:10px;font-weight:800
}
.pill.pass:before{content:"✓ ";font-weight:900}.pill.fail:before{content:"× ";font-weight:900}
.pill.pass{background:#f0fdf4;color:#166534;border-color:#86efac}
.pill.fail{background:#fef2f2;color:#991b1b;border-color:#fca5a5}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.ph{
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
 aspect-ratio:4/3;background:#f8fafc;color:#475569;border:1px dashed #94a3b8;
 border-radius:3px;text-align:center;font-size:10px
}
.ph .material-symbols-outlined{font-size:21px;color:#64748b}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{
 min-width:0;padding:9px;display:flex;flex-direction:column;gap:8px;
 background:#f1f5f9;border-top:3px solid #64748b;border-radius:2px
}
.kcol:nth-child(1){border-top-color:#dc2626}.kcol:nth-child(2){border-top-color:#d97706}
.kcol:nth-child(3){border-top-color:#2563eb}.kcol:nth-child(4){border-top-color:#15803d}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;color:#1e293b;font-size:11.5px;font-weight:800}
.kcol .kh span{min-width:24px;padding:1px 6px;background:#fff;border:1px solid var(--line);border-radius:2px;text-align:center;font-size:10px}
.kcard{
 padding:11px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
 border-radius:3px;box-shadow:0 2px 5px rgba(15,23,42,.04);
 transition:transform .2s,box-shadow .2s
}
.kcard:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(15,23,42,.08)}
.kcard.b1{border-left-color:#dc2626}.kcard.b2{border-left-color:#d97706}
.kcard.b3{border-left-color:#2563eb}.kcard.b4{border-left-color:#15803d}
.kcard b{display:block;color:#1e293b;font-family:Inter,sans-serif;font-size:11.5px}
.kcard small{display:block;margin-top:3px;color:#475569;font-size:10px}
.kcard .kf{display:flex;align-items:center;justify-content:space-between;margin-top:9px;color:#475569;font-size:9.5px}
.ava{width:21px;height:21px;display:inline-grid;place-items:center;background:#334155;color:#fff;border-radius:50%;font-size:9px;font-weight:800}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp>div{min-width:0}.cmp .lbl{display:flex;align-items:center;gap:5px;margin-bottom:6px;color:#475569;font-size:10.5px;font-weight:700}
.vrow{margin-bottom:11px;padding:13px;border:1px solid var(--line);border-radius:3px}
.vrow:last-child{margin-bottom:0}
.vrow .vhd{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.vrow .vhd b{font-size:12px}
.btn{
 min-height:36px;padding:7px 12px;border-radius:3px;font-size:10.5px;font-weight:800;
 transition:background .2s,color .2s,transform .2s,box-shadow .2s
}
.btn:hover{transform:translateY(-1px)}.btn.ok{background:#166534;color:#fff;border:1px solid #166534}
.btn.ok:hover{background:#14532d;box-shadow:0 5px 12px rgba(22,101,52,.2)}
.btn.no{background:#fff;color:#991b1b;border:1px solid #dc2626}.btn.no:hover{background:#fef2f2}
.mini{display:flex;gap:6px}
.slist{display:flex;flex-direction:column;gap:8px}
.si{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:3px}
.si:hover{background:#f8fafc}
.si .dt{flex:none;min-width:52px;padding:6px 8px;background:#0f172a;color:#fff;border-radius:2px;text-align:center}
.si .dt b{display:block;color:#fff;font-size:16px;line-height:1}.si .dt small{color:#cbd5e1;font-size:9px}
.si .sm{flex:1;min-width:0}.si .sm b{font-size:12px}.si .sm small{display:block;color:#475569;font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:#475569;font-size:10.5px}
.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;display:inline-block;border-radius:1px}
.legend span:before{font-family:"Material Symbols Outlined";font-size:13px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.kb{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}
 .bd{padding:1px 3px 13px}.lg{width:38px;height:38px}.side #nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
 .side button{justify-content:center;padding:9px 7px;font-size:11px}.side button:hover{transform:none}.foot{display:none}
 .main{padding:18px 16px 32px}.vh{min-height:154px;padding:23px 21px}.g2,.g11,.two{grid-template-columns:1fr}
}
@media(max-width:560px){
 .side #nav{grid-template-columns:repeat(2,1fr)}.side button{justify-content:flex-start}
 .vh{min-height:170px;align-items:flex-start;flex-direction:column}.vh:after{font-size:27px}
 .live{align-self:flex-start}.kpis{grid-template-columns:1fr 1fr}.kpi{min-height:117px;padding:14px}.kpi .v{font-size:24px}
 .kb{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}
 .card{padding:14px}.ci{align-items:flex-start;flex-direction:column}.ci .jd{width:100%}.pill{flex:1;text-align:center}
}
@media(max-width:390px){.kpis{grid-template-columns:1fr}.side button .material-symbols-outlined{font-size:18px}.vh h2{font-size:27px}}
@media(prefers-reduced-motion:no-preference){
 .card,.kpi,.ci,.si,.kcol{animation:reveal .36s ease-out both}
 .kpi:nth-child(2),.kcol:nth-child(2){animation-delay:.04s}.kpi:nth-child(3),.kcol:nth-child(3){animation-delay:.08s}
 .kpi:nth-child(4),.kcol:nth-child(4){animation-delay:.12s}
 @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="bd"><div class="lg">巡</div><div><b>巡檢改善追蹤台</b><span>SITE INSPECTION · CAPA</span></div></div>
 <div id="nav"></div>
 <div class="foot">工區 A/B/C · 檢查表 12 式<br/>本月缺失 148 · 已關閉 121<br/>改善時效 2.1 天</div>
</aside>
<main class="main">
 <div class="vh"><div><h2 id="vt">巡檢總覽</h2><p id="vd"></p></div><div class="live"><i aria-hidden="true"></i>現場即時回傳</div></div>
 <div id="view"></div>
</main>
</div>
<script>
const MOD=[
["巡檢總覽","monitoring","巡檢總覽","缺失、改善與複查全局戰情，掌握工地品安節奏"],
["巡檢執行","fact_check","巡檢執行","排定巡檢任務、逐項填寫檢查表與合格判定"],
["缺失追蹤","bug_report","缺失追蹤","缺失單登錄，含照片、定位與嚴重度分級"],
["改善看板","view_kanban","改善看板","待改善／改善中／待複查／已關閉四欄推進"],
["複查驗證","verified","複查驗證","比對改善前後照片，複查驗收與結案關閉"],
["統計報表","insert_chart","統計報表","缺失類型分佈、改善時效與工區排名分析"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{const b=document.createElement("button");b.type="button";b.dataset.i=i;b.className=i===0?"on":"";b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+"</span><span>"+m[0]+"</span>";b.onclick=()=>show(i);nav.appendChild(b)});

const DEF=[
["DF-2418","B 棟 5F 電氣","配電盤接地未確實","高","待改善","陳志明","t-bad"],
["DF-2417","A 棟 3F 結構","鷹架踏板缺件2處","高","改善中","豐邦工程","t-warn"],
["DF-2416","C 棟 地下室","消防管路未固定","中","待複查","O安機電","t-info"],
["DF-2415","A 棟 2F 假設","開口護欄高度不足","中","改善中","豐邦工程","t-warn"],
["DF-2414","B 棟 屋突","防水層施工瑕疵","低","已關閉","昇泰防水","t-ok"],
["DF-2413","C 棟 1F 泥作","粉刷面裂縫","低","已關閉","O成營造","t-ok"]];
const CHK=[
["安全帽與背負式安全帶佩戴","個人防護具",1],["高處作業開口護欄與防墜網","墜落防護",0],
["電氣設備接地與漏電斷路器","電氣安全",0],["動火作業滅火器與監火人","火災預防",1],
["物料堆置穩固與通道淨空","物料管理",1],["鷹架踏板固定與交叉拉桿","假設工程",0]];
const KAN={
"待改善":[["DF-2418","配電盤接地未確實","B 棟 5F 電氣","高","陳","逾期 1 天","b1"],["DF-2420","樓梯扶手鬆動","A 棟 4F","中","王","今日到期","b1"]],
"改善中":[["DF-2417","鷹架踏板缺件2處","A 棟 3F","高","豐","剩 2 天","b2"],["DF-2415","開口護欄高度不足","A 棟 2F","中","豐","剩 3 天","b2"]],
"待複查":[["DF-2416","消防管路未固定","C 棟 地下室","中","泰","已上傳照片","b3"],["DF-2419","臨時用電線路裸露","B 棟 1F","中","陳","待排複查","b3"]],
"已關閉":[["DF-2414","防水層施工瑕疵","B 棟 屋突","低","昇","複查合格","b4"],["DF-2413","粉刷面裂縫","C 棟 1F","低","成","複查合格","b4"]]};
const VER=[["DF-2416","消防管路未固定","C 棟 地下室 · 泰安機電","中"],["DF-2419","臨時用電線路裸露","B 棟 1F · 陳志明","中"]];
const SCH=[
["19","週一","A 棟結構安全巡檢","陳志明 · 08:30","查檢 18 項","t-orange"],
["19","週一","全區用電消防巡檢","王倉管 · 14:00","查檢 22 項","t-info"],
["20","週二","B 棟假設工程巡檢","豐邦工程 · 09:00","查檢 15 項","t-orange"],
["21","週三","C 棟高處作業複查","營建主管 · 10:30","複查 6 件","t-ok"]];
function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
function photos(n,label){let h="";for(let i=0;i<n;i++)h+='<div class="ph">'+icon("photo_camera")+(label||"照片")+"</div>";return h}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi">${icon("fact_check")}<div class="l">本月巡檢</div><div class="v">64<small> 次</small></div><div class="d up">▲ 達成率 96%</div></div>
