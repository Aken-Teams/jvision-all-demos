<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ICT Test Data Management（電路測試數據管理）｜Jvision 系統 Demo</title>
<meta name="description" content="ICT 電路測試數據管理：測試程式版本、測試數據蒐集、通過率看板、不良統計、治具維護與追溯稽核" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400..600,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A34800;
  --bad:#B91C1C;
  --radius:8px;
  --shadow:0 10px 30px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  color:var(--ink);
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  line-height:1;
  vertical-align:middle;
}
.skip-link{
  position:fixed;left:16px;top:-80px;z-index:100;
  padding:10px 14px;color:#fff;background:var(--blue);
  border-radius:6px;font-weight:600;
}
.skip-link:focus{top:12px}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;top:0;z-index:40;
  color:var(--ink);
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 18px rgba(15,23,42,.05);
  backdrop-filter:blur(12px);
}
.topbar::before{
  content:"";display:block;height:4px;
  background:linear-gradient(90deg,var(--blue) 0 72%,var(--color-accent) 72%);
}
.topbar-inner{
  width:min(1400px,100%);
  margin:auto;padding:12px 24px;
  display:flex;align-items:center;gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:258px}
.logo{
  width:42px;height:42px;flex:0 0 42px;
  display:grid;place-items:center;
  color:#fff;background:var(--blue);
  border-radius:7px;
  box-shadow:5px 5px 0 #BFDBFE;
}
.logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap;
}
.brand-txt span{
  display:block;margin-top:3px;color:var(--muted);
  font:500 10px/1.2 "Fira Code",monospace;
  letter-spacing:.05em;white-space:nowrap;
}
.nav{
  min-width:0;margin-left:auto;
  display:flex;justify-content:flex-end;gap:4px;
}
.nav button{
  position:relative;
  min-height:42px;padding:8px 11px;
  display:flex;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:6px;
  color:var(--muted);background:transparent;
  font-size:12px;font-weight:600;
  transition:color .2s,background .2s,border-color .2s,transform .2s;
}
.nav button::after{
  content:"";position:absolute;left:10px;right:10px;bottom:3px;
  height:2px;background:var(--blue);
  transform:scaleX(0);transform-origin:center;
  transition:transform .22s ease;
}
.nav button:hover{
  color:var(--blue);background:#EFF6FF;border-color:#DBEAFE;
  transform:translateY(-1px);
}
.nav button.active{
  color:var(--blue);background:#EFF6FF;border-color:#BFDBFE;
}
.nav button.active::after{transform:scaleX(1)}
.nav button .material-symbols-outlined{font-size:18px}
.wrap{width:min(1400px,100%);margin:auto;padding:30px 24px 70px}
.screen-head{
  position:relative;min-height:150px;margin-bottom:20px;padding:30px 32px;
  display:flex;align-items:center;gap:20px;
  overflow:hidden;color:#fff;background:#172554;
  border:1px solid #1E3A8A;border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.screen-head::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(115deg,transparent 0 66%,rgba(59,130,246,.22) 66% 78%,transparent 78%),
    radial-gradient(circle at 86% 18%,rgba(234,88,12,.3),transparent 24%);
}
.screen-head::after{
  content:"ICT / QMS";position:absolute;right:30px;bottom:16px;
  color:rgba(255,255,255,.12);
  font:700 42px/1 "Fira Code",monospace;
  letter-spacing:-.07em;
}
.screen-head>*{position:relative;z-index:1}
.screen-head .ic{
  width:54px;height:54px;flex:0 0 54px;
  display:grid;place-items:center;
  color:#fff;background:var(--blue);
  border:1px solid rgba(255,255,255,.35);border-radius:6px;
  box-shadow:6px 6px 0 rgba(59,130,246,.28);
}
.screen-head .ic .material-symbols-outlined{font-size:28px}
.screen-head h2{
  margin:0;font-size:clamp(22px,3vw,32px);
  line-height:1.2;font-weight:700;letter-spacing:-.025em;
}
.screen-head p{
  max-width:700px;margin:8px 0 0;
  color:#DBEAFE;font-size:13px;line-height:1.65;
}
.htag{
  margin-left:auto;align-self:flex-start;
  padding:7px 10px;color:#172554;background:#fff;
  border-left:4px solid var(--color-accent);border-radius:3px;
  font:600 11px/1 "Fira Code",monospace;
  letter-spacing:.04em;white-space:nowrap;
}
.grid{display:grid;gap:14px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.4fr}
.card{
  min-width:0;padding:18px;
  color:var(--color-card-foreground);background:var(--color-card);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 2px 10px rgba(15,23,42,.035);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{
  border-color:#BFDBFE;
  box-shadow:0 12px 28px rgba(37,99,235,.08);
  transform:translateY(-2px);
}
.card h3{
  margin:0 0 15px;padding-bottom:11px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);
  font-size:14px;font-weight:700;letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.card .sub{
  margin-left:auto;color:var(--muted);
  font:500 10.5px/1.2 "Fira Code",monospace;
}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
.kpi::after{
  content:"";position:absolute;right:-25px;bottom:-33px;
  width:92px;height:92px;border:16px solid #EFF6FF;
  transform:rotate(24deg);
}
.kpi .lab{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:7px;
  color:var(--muted);font-size:12px;font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  position:relative;z-index:1;margin-top:12px;
  font:700 28px/1 "Fira Code",monospace;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
}
.kpi .val small{
  margin-left:5px;color:var(--muted);
  font:600 12px/1 "Fira Sans",sans-serif;
}
.kpi .delta{
  position:relative;z-index:1;margin-top:10px;
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;
}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}.chart.lg{height:300px}
.tbl-wrap{
  max-width:100%;overflow-x:auto;
  border:1px solid var(--line);border-radius:6px;
  scrollbar-color:#94A3B8 #F1F5F9;
}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
th,td{
  height:42px;padding:9px 12px;
  text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
th{
  position:sticky;top:0;z-index:1;
  color:#334155;background:#F1F5F9;
  font-size:11px;font-weight:700;letter-spacing:.035em;
}
tbody tr{transition:background .18s}
tbody tr:nth-child(even){background:#FBFDFF}
tbody tr:hover{background:#EFF6FF}
tbody tr:last-child td{border-bottom:0}
td.num{
  text-align:right;font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;font-weight:600;
}
td:first-child b,.vh,.tt,.frow b{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border:1px solid transparent;border-radius:4px;
  font-size:11px;font-weight:700;line-height:1.25;
}
.pill::before{
  content:"";width:6px;height:6px;flex:0 0 6px;
  border-radius:50%;background:currentColor;
}
.pill .material-symbols-outlined{font-size:14px}
.p-ok{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.p-warn{color:#8A3B00;background:#FFF7ED;border-color:#FED7AA}
.p-bad{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.p-info{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.p-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.bar{
  min-width:70px;height:8px;overflow:hidden;
  background:#E2E8F0;border-radius:2px;
}
.bar>i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--blue),var(--color-secondary));
  border-radius:2px;
}
.vtl,.trace{position:relative;padding-left:25px}
.vtl::before,.trace::before{
  content:"";position:absolute;left:7px;top:4px;bottom:4px;
  width:2px;background:#CBD5E1;
}
.vtl .node,.trace .ev{position:relative;padding:0 0 17px 7px}
.vtl .node::before,.trace .ev::before{
  content:"";position:absolute;left:-23px;top:3px;
  width:12px;height:12px;background:#fff;
  border:3px solid var(--blue);border-radius:2px;
}
.vtl .node.cur::before{background:var(--blue);box-shadow:0 0 0 4px #DBEAFE}
.vtl .node .vh,.trace .ev .th{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12.5px;font-weight:700;
}
.vtl .node .vm,.trace .ev .td{
  margin-top:4px;color:var(--muted);font-size:11.5px;line-height:1.55;
}
.trace .ev .tt{
  margin-top:3px;color:var(--muted);font-size:10.5px;
}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.board>*{min-width:0}
.metric-row{
  min-width:0;margin:13px 0;
  display:flex;align-items:center;gap:11px;
}
.metric-row .mlab{width:120px;flex:0 0 auto;font-size:12px;font-weight:600}
.metric-row .bar{flex:1}
.metric-row .mval{
  min-width:56px;text-align:right;
  font:600 12px/1 "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.fx{
  min-width:0;padding:15px;background:#fff;
  border:1px solid var(--line);border-top:3px solid var(--blue);
  border-radius:var(--radius);
  box-shadow:0 2px 10px rgba(15,23,42,.035);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.fx:hover{transform:translateY(-2px);border-color:#93C5FD;box-shadow:var(--shadow)}
.fx .fh{display:flex;align-items:center;gap:8px;font:700 13px/1 "Fira Code",monospace}
.fx .fh .material-symbols-outlined{color:var(--blue);font-size:19px}
.fx .frow{
  margin-top:8px;display:flex;justify-content:space-between;gap:8px;
  color:var(--muted);font-size:11.5px;
}
.fx .frow b{color:var(--ink)}
.ring{
  position:relative;width:66px;height:66px;flex:0 0 66px;
  display:grid;place-items:center;border-radius:50%;
}
.ring::after{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}
.ring span{
  position:relative;z-index:1;
  font:700 13px/1 "Fira Code",monospace;
}
.legend{
  margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;
  color:var(--muted);font-size:11px;
}
.legend i{
  display:inline-block;width:11px;height:11px;margin-right:6px;
  border-radius:2px;vertical-align:-1px;
}
.note{
  margin-top:12px;padding:10px 12px;
  display:flex;align-items:flex-start;gap:7px;
  color:#334155;background:#F8FAFC;
  border-left:3px solid var(--blue);
  font-size:11.5px;line-height:1.55;
}
.note .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:16px}
.grid>*,.card,.fx{animation:reveal .42s both cubic-bezier(.2,.8,.2,1)}
.grid>*:nth-child(2){animation-delay:.06s}
.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}
@keyframes reveal{
  from{opacity:0;transform:translateY(14px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-wrap:wrap}
  .nav{width:100%;margin-left:0;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .nav button{flex:0 0 auto}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .topbar-inner{padding:10px 16px}
  .wrap{padding:20px 14px 56px}
  .screen-head{min-height:138px;padding:24px 20px;align-items:flex-start}
  .screen-head::after{font-size:30px}
  .screen-head .ic{width:46px;height:46px;flex-basis:46px}
  .htag{display:none}
  .g3,.g2{grid-template-columns:1fr}
  .card{padding:15px}
  .chart.lg{height:280px}
}
@media(max-width:520px){
  .brand{min-width:0}
  .brand-txt span{display:none}
  .brand-txt b{font-size:13px}
  .nav{gap:2px}
  .nav button{min-width:42px;justify-content:center;padding:8px}
  .nav button .txt{display:none}
  .g4,.board{grid-template-columns:1fr}
  .screen-head{padding:20px 16px;gap:14px}
  .screen-head h2{font-size:21px}
  .screen-head p{font-size:12px}
  .screen-head::after{display:none}
  .metric-row{flex-wrap:wrap}
  .metric-row .mlab{width:calc(100% - 68px)}
  .metric-row .bar{order:3;flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .grid>*,.card,.fx{opacity:1;transform:none}
}
</style>
</head>
<body>
<a class="skip-link" href="#app">跳至主要內容</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">memory</span></div>
      <div class="brand-txt">
        <b>ICT 電路測試數據管理</b>
        <span>ICT Test Data Management · QMS</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main class="wrap"><div id="app" tabindex="-1"></div></main>
<script>
"use strict";
var NAV=[
  {i:"description",t:"程式版本"},
  {i:"monitoring",t:"數據蒐集"},
  {i:"fact_check",t:"通過率看板"},
  {i:"rule",t:"不良統計"},
  {i:"build",t:"治具維護"},
  {i:"history",t:"追溯稽核"}
];
var TITLES=[
  {ic:"description",h:"測試程式版本管理",p:"ICT 測試程式版本控管、Rev 差異與載入履歷，確保機台載入正確版本。",tag:"Program Vault"},
  {ic:"monitoring",h:"測試數據蒐集",p:"各 ICT 測試機量測值與 PASS/FAIL 結果即時集中，取代散落各機的資料。",tag:"Live Collection"},
  {ic:"fact_check",h:"測試通過率看板",p:"以機台別與產品別檢視 FPY 與趨勢，通過率跌破門檻即時告警。",tag:"Yield Board"},
  {ic:"rule",h:"不良項目統計",p:"失效測項 Pareto 與根因分析，鎖定高頻不良測項回饋製程改善。",tag:"Defect Pareto"},
  {ic:"build",h:"治具維護追蹤",p:"治具稼動率、探針壽命與保養排程，依測試次數觸發預防保養。",tag:"Fixture Care"},
  {ic:"history",h:"測試追溯稽核",p:"序號級測試履歷與稽核紀錄，可依序號回溯完整測試歷程。",tag:"Traceability"}
];
function head(idx){
  var t=TITLES[idx];
  return '<div class="screen-head"><div class="ic" aria-hidden="true"><span class="material-symbols-outlined">'+t.ic+'</span></div><div style="min-width:0"><h2>'+t.h+'</h2><p>'+t.p+'</p></div><span class="htag">'+t.tag+'</span></div>';
}
function kpi(lab,ic,val,unit,delta,dir){
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="delta '+dir+'"><span class="material-symbols-outlined" aria-hidden="true">'+arrow+'</span>'+delta+'</div></div>';
}
function bar(p){return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div>'}
function chartBox(id,cls){return '<div id="'+id+'" class="chart '+(cls||"")+'" role="img" aria-label="數據圖表"></div>'}
var _charts={};
function makeChart(id,opt){
  var dom=document.getElementById(id);
  if(!dom)return;
  if(_charts[id]){try{_charts[id].dispose()}catch(e){}}
  var c=echarts.init(dom);
  c.setOption(opt);
  _charts[id]=c;
}
var AX={axisLine:{lineStyle:{color:"#CBD5E1"}},axisLabel:{color:"#475569",fontSize:11,fontFamily:"Fira Code"},splitLine:{lineStyle:{color:"#E9EFF8"}}};
function gridBox(){return {left:8,right:14,top:28,bottom:6,containLabel:true}}
function s0(){
  var progs=[
    {p:"ICT-PRG-A17",rev:"v3.4",prod:"MB-A17 主機板",st:"線上",stc:"p-ok",mc:"ICT-04 / ICT-07",dt:"08-12 09:20",by:"陳建志",cov:"98.6%"},
    {p:"ICT-PRG-B22",rev:"v2.1",prod:"PSU-B22 電源板",st:"線上",stc:"p-ok",mc:"ICT-02",dt:"08-11 14:05",by:"林怡君",cov:"96.2%"},

var navEl=document.getElementById("nav");
NAV.forEach(function(n,idx){
  var b=document.createElement("button");
  b.type="button";
  b.setAttribute("data-i",idx);
  b.setAttribute("aria-label",n.t);
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+n.i+'</span><span class="txt">'+n.t+'</span>';
  b.addEventListener("click",function(){location.hash="v"+idx});
  navEl.appendChild(b);
});
function show(i){
  var cont=document.getElementById("app");
  var sc=SCREENS[i]||SCREENS[0];
  cont.innerHTML=sc.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var active=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("active",active);
    btns[k].setAttribute("aria-current",active?"page":"false");
  }
  void cont.offsetHeight;
  if(sc.c)sc.c();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){
  Object.keys(_charts).forEach(function(k){try{_charts[k].resize()}catch(e){}})
});
fromHash();
