<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ICT Test Data Management（電路測試數據管理）｜Jvision 系統 Demo</title>
<meta name="description" content="ICT 電路測試數據管理：測試程式版本、測試數據蒐集、通過率看板、不良統計、治具維護與追溯稽核" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0369a1;
  --accent2:#38bdf8;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --bg:#f1f5f9;
  --card:#ffffff;
  --ok:#16a34a;
  --warn:#d97706;
  --bad:#dc2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;line-height:1;}
a{color:inherit;text-decoration:none;}

/* ===== top nav ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(120deg,#0c4a6e,#0369a1 60%,#075985);
  color:#fff;
  box-shadow:0 2px 14px rgba(3,105,161,.28);
}
.topbar-inner{
  max-width:1360px;margin:0 auto;padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.brand .logo .material-symbols-outlined{font-size:22px;color:#04283b;}
.brand-txt{min-width:0;}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand-txt span{display:block;font-size:11px;color:#bae6fd;white-space:nowrap;}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{
  border:0;cursor:pointer;color:#e0f2fe;
  background:rgba(255,255,255,.08);
  border-radius:9px;padding:8px 12px;
  font-family:inherit;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;min-width:0;
  transition:background .15s,color .15s,transform .1s;
}
.nav button .material-symbols-outlined{font-size:19px;}
.nav button:hover{background:rgba(255,255,255,.2);}
.nav button.active{background:#fff;color:#0369a1;font-weight:800;}

/* ===== layout ===== */
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;min-width:0;}
.screen-head .ic{
  width:46px;height:46px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,#0369a1,#38bdf8);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(3,105,161,.3);
}
.screen-head .ic .material-symbols-outlined{font-size:26px;}
.screen-head h2{margin:0;font-size:20px;font-weight:800;line-height:1.3;}
.screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:640px;}
.htag{margin-left:auto;align-self:center;background:#e0f2fe;color:#075985;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;white-space:nowrap;}

/* grids */
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
.grid>*{min-width:0;}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;}

/* KPI */
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-.5px;line-height:1;}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .delta{margin-top:7px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
.kpi::after{content:"";position:absolute;right:-14px;bottom:-14px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%);}

/* chart */
.chart{width:100%;height:260px;overflow:hidden;}
.chart.sm{height:210px;}
.chart.lg{height:300px;}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f8fafc;color:#475569;font-weight:700;font-size:11.5px;position:sticky;top:0;}
tbody tr:hover{background:#f0f9ff;}
td.num{font-variant-numeric:tabular-nums;font-weight:700;}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.pill .material-symbols-outlined{font-size:14px;}
.p-ok{background:#dcfce7;color:#166534;}
.p-warn{background:#fef3c7;color:#92400e;}
.p-bad{background:#fee2e2;color:#991b1b;}
.p-info{background:#e0f2fe;color:#075985;}
.p-mut{background:#eef2f6;color:#475569;}

/* bars */
.bar{height:8px;border-radius:6px;background:#eef2f6;overflow:hidden;min-width:70px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0369a1,#38bdf8);}

/* version timeline */
.vtl{position:relative;padding-left:22px;}
.vtl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(#38bdf8,#e2e8f0);}
.vtl .node{position:relative;padding:0 0 16px 6px;}
.vtl .node::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.vtl .node.cur::before{background:var(--accent);box-shadow:0 0 0 4px rgba(56,189,248,.28);}
.vtl .node .vh{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.vtl .node .vm{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}

/* board columns */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.board>*{min-width:0;}

/* gauge row / progress card */
.metric-row{display:flex;align-items:center;gap:10px;margin:10px 0;min-width:0;}
.metric-row .mlab{font-size:12.5px;font-weight:700;min-width:110px;flex:0 0 auto;}
.metric-row .bar{flex:1;}
.metric-row .mval{font-size:12.5px;font-weight:800;min-width:52px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;}

/* fixture cards */
.fx{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;min-width:0;}
.fx .fh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;}
.fx .fh .material-symbols-outlined{font-size:19px;color:var(--accent);}
.fx .frow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;gap:8px;}
.fx .frow b{color:var(--ink);}
.ring{width:64px;height:64px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;position:relative;}
.ring::after{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%;}
.ring span{position:relative;z-index:1;font-size:14px;font-weight:900;}

/* trace / audit */
.trace{position:relative;padding-left:24px;}
.trace::before{content:"";position:absolute;left:8px;top:2px;bottom:2px;width:2px;background:#e2e8f0;}
.trace .ev{position:relative;padding:0 0 14px 8px;}
.trace .ev::before{content:"";position:absolute;left:-20px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent2);}
.trace .ev .th{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.trace .ev .tt{font-size:11px;color:var(--muted);}
.trace .ev .td{font-size:12px;color:#475569;margin-top:3px;line-height:1.5;}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

.note{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:flex-start;gap:6px;line-height:1.5;}
.note .material-symbols-outlined{font-size:15px;color:var(--accent);flex:0 0 auto;}

@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:820px){
  .g4,.g3,.g2{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
  .wrap{padding:16px 12px 50px;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:8px 10px;}
  .brand-txt span{display:none;}
  .htag{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">memory</span></div>
      <div class="brand-txt">
        <b>ICT 電路測試數據管理</b>
        <span>ICT Test Data Management · QMS</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>

<script>
"use strict";
var NAV=[
  {i:"description",t:"程式版本"},
  {i:"monitoring",t:"數據蒐集"},
  {i:"fact_check",t:"通過率看板"},
  {i:"rule",t:"不良統計"},
  {i:"build",t:"治具維護"},
  {i:"history",t:"追溯稽核"}
];
var TITLES=[
  {ic:"description",h:"測試程式版本管理",p:"ICT 測試程式版本控管、Rev 差異與載入履歷，確保機台載入正確版本。",tag:"Program Vault"},
  {ic:"monitoring",h:"測試數據蒐集",p:"各 ICT 測試機量測值與 PASS/FAIL 結果即時集中，取代散落各機的資料。",tag:"Live Collection"},
  {ic:"fact_check",h:"測試通過率看板",p:"以機台別與產品別檢視 FPY 與趨勢，通過率跌破門檻即時告警。",tag:"Yield Board"},
  {ic:"rule",h:"不良項目統計",p:"失效測項 Pareto 與根因分析，鎖定高頻不良測項回饋製程改善。",tag:"Defect Pareto"},
  {ic:"build",h:"治具維護追蹤",p:"治具稼動率、探針壽命與保養排程，依測試次數觸發預防保養。",tag:"Fixture Care"},
  {ic:"history",h:"測試追溯稽核",p:"序號級測試履歷與稽核紀錄，可依序號回溯完整測試歷程。",tag:"Traceability"}
];

/* ---------- helpers ---------- */
function head(idx){
  var t=TITLES[idx];
  return '<div class="screen-head">'
    +'<div class="ic"><span class="material-symbols-outlined">'+t.ic+'</span></div>'
    +'<div style="min-width:0"><h2>'+t.h+'</h2><p>'+t.p+'</p></div>'
    +'<span class="htag">'+t.tag+'</span></div>';
}
function kpi(lab,ic,val,unit,delta,dir){
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'
    +'<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
    +'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+arrow+'</span>'+delta+'</div></div>';
}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}
function chartBox(id,cls){return '<div id="'+id+'" class="chart '+(cls||"")+'"></div>';}

var _charts={};
function makeChart(id,opt){
  var dom=document.getElementById(id);
  if(!dom)return;
  if(_charts[id]){try{_charts[id].dispose();}catch(e){}}
  var c=echarts.init(dom);
  c.setOption(opt);
  _charts[id]=c;
}
var AX={axisLine:{lineStyle:{color:"#cbd5e1"}},axisLabel:{color:"#64748b",fontSize:11},splitLine:{lineStyle:{color:"#eef2f6"}}};
function gridBox(){return {left:8,right:14,top:24,bottom:6,containLabel:true};}

/* ---------- screen 0: version management ---------- */
function s0(){
  var progs=[
    {p:"ICT-PRG-A17",rev:"v3.4",prod:"MB-A17 主機板",st:"線上",stc:"p-ok",mc:"ICT-04 / ICT-07",dt:"08-12 09:20",by:"陳建志",cov:"98.6%"},
    {p:"ICT-PRG-B22",rev:"v2.1",prod:"PSU-B22 電源板",st:"線上",stc:"p-ok",mc:"ICT-02",dt:"08-11 14:05",by:"林怡君",cov:"96.2%"},
    {p:"ICT-PRG-C09",rev:"v5.0",prod:"IO-C09 介面卡",st:"驗證中",stc:"p-warn",mc:"ICT-11(測試站)",dt:"08-13 08:40",by:"黃冠宇",cov:"94.8%"},
    {p:"ICT-PRG-D31",rev:"v1.7",prod:"SEN-D31 感測板",st:"線上",stc:"p-ok",mc:"ICT-05 / ICT-09",dt:"08-10 16:22",by:"陳建志",cov:"99.1%"},
    {p:"ICT-PRG-E44",rev:"v4.2",prod:"RF-E44 射頻板",st:"待審核",stc:"p-info",mc:"—",dt:"08-13 11:10",by:"吳采潔",cov:"92.5%"},
    {p:"ICT-PRG-F18",rev:"v2.8",prod:"CTRL-F18 控制板",st:"已封存",stc:"p-mut",mc:"—",dt:"07-28 10:00",by:"林怡君",cov:"—"}
  ];
  var rows=progs.map(function(r){
    return '<tr><td><b>'+r.p+'</b></td><td><span class="pill p-info">'+r.rev+'</span></td>'
      +'<td>'+r.prod+'</td><td><span class="pill '+r.stc+'">'+r.st+'</span></td>'
      +'<td>'+r.mc+'</td><td>'+r.dt+'</td><td>'+r.by+'</td><td class="num">'+r.cov+'</td></tr>';
  }).join("");

  var h=head(0);
  h+='<div class="grid g4" style="margin-bottom:14px">'
    +kpi("受控測試程式","description","42","支","+3 本月","up")
    +kpi("線上生效版本","verified","28","版","近 7 日 6 次載入","flat")
    +kpi("待審核版本","fact_check","3","件","需工程主管簽核","down")
    +kpi("平均測項覆蓋","checklist","96.8","%","目標 ≥ 95%","up")
    +'</div>';
  h+='<div class="grid g32" style="margin-bottom:14px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">difference</span>版本載入與差異趨勢<span class="sub">近 8 週</span></h3>'+chartBox("c0a")+'</div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">history_toggle_off</span>ICT-PRG-A17 版本履歷</h3>'
      +'<div class="vtl">'
      +'<div class="node cur"><div class="vh">v3.4 <span class="pill p-ok">線上</span></div><div class="vm">新增 R203/C88 短路測項，08-12 由陳建志載入 ICT-04、ICT-07。</div></div>'
      +'<div class="node"><div class="vh">v3.3</div><div class="vm">調整電容量測門檻 ±5%，修正誤判 12 pcs/日。</div></div>'
      +'<div class="node"><div class="vh">v3.2</div><div class="vm">配合 ECN-2207 移除 U14 測項。</div></div>'
      +'<div class="node"><div class="vh">v3.1</div><div class="vm">初版量產放行，測項覆蓋 95.4%。</div></div>'
      +'</div></div>'
    +'</div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>測試程式版本清單<span class="sub">受控文件</span></h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>程式</th><th>版本</th><th>對應產品</th><th>狀態</th><th>載入機台</th><th>最後更新</th><th>維護人</th><th>覆蓋率</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="note"><span class="material-symbols-outlined">gpp_good</span>版本異動需經工程主管審核；線上生效版本自動鎖定並記錄載入履歷。</div></div>';
  return h;
}
function s0charts(){
  makeChart("c0a",{
    tooltip:{trigger:"axis"},
    legend:{data:["新版發布","載入次數"],textStyle:{color:"#475569",fontSize:11},top:0,right:0},
    grid:gridBox(),
    xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLine:AX.axisLine,axisLabel:AX.axisLabel},
    yAxis:{type:"value",axisLabel:AX.axisLabel,splitLine:AX.splitLine},
    series:[
      {name:"新版發布",type:"bar",data:[2,1,3,2,4,2,3,3],itemStyle:{color:"#38bdf8",borderRadius:[4,4,0,0]},barWidth:14},
      {name:"載入次數",type:"line",smooth:true,data:[5,4,7,6,9,6,8,6],itemStyle:{color:"#0369a1"},lineStyle:{width:3}}
    ]
  });
}

/* ---------- screen 1: data collection ---------- */
function s1(){
  var machines=[
    {m:"ICT-02",prod:"PSU-B22",thr:"1,240",pass:"1,196",fpy:"96.5%",fpyc:"p-ok",ct:"18.2s",st:"運轉",stc:"p-ok"},
    {m:"ICT-04",prod:"MB-A17",thr:"980",pass:"942",fpy:"96.1%",fpyc:"p-ok",ct:"26.7s",st:"運轉",stc:"p-ok"},
    {m:"ICT-05",prod:"SEN-D31",thr:"1,510",pass:"1,489",fpy:"98.6%",fpyc:"p-ok",ct:"12.4s",st:"運轉",stc:"p-ok"},
    {m:"ICT-07",prod:"MB-A17",thr:"935",pass:"868",fpy:"92.8%",fpyc:"p-warn",ct:"27.1s",st:"警示",stc:"p-warn"},
    {m:"ICT-09",prod:"SEN-D31",thr:"1,470",pass:"1,451",fpy:"98.7%",fpyc:"p-ok",ct:"12.6s",st:"運轉",stc:"p-ok"},
    {m:"ICT-11",prod:"IO-C09",thr:"420",pass:"388",fpy:"92.4%",fpyc:"p-warn",ct:"31.0s",st:"驗證",stc:"p-info"}
  ];
  var rows=machines.map(function(r){
    return '<tr><td><b>'+r.m+'</b></td><td>'+r.prod+'</td><td class="num">'+r.thr+'</td><td class="num">'+r.pass+'</td>'
      +'<td><span class="pill '+r.fpyc+'">'+r.fpy+'</span></td><td class="num">'+r.ct+'</td>'
      +'<td><span class="pill '+r.stc+'">'+r.st+'</span></td></tr>';
  }).join("");
  var h=head(1);
  h+='<div class="grid g4" style="margin-bottom:14px">'

/* ---------- router ---------- */
var SCREENS=[
  {r:s0,c:s0charts},
  {r:s1,c:s1charts},
  {r:s2,c:s2charts},
  {r:s3,c:s3charts},
  {r:s4,c:s4charts},
  {r:s5,c:s5charts}
];

var navEl=document.getElementById("nav");
NAV.forEach(function(n,idx){
  var b=document.createElement("button");
  b.setAttribute("data-i",idx);
  b.innerHTML='<span class="material-symbols-outlined">'+n.i+'</span><span class="txt">'+n.t+'</span>';
  b.addEventListener("click",function(){location.hash="v"+idx;});
  navEl.appendChild(b);
});

function show(i){
  var cont=document.getElementById("app");
  var sc=SCREENS[i]||SCREENS[0];
  cont.innerHTML=sc.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);
  }
  void cont.offsetHeight;
  if(sc.c)sc.c();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
