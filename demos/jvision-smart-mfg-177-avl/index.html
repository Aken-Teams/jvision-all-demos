<style>
:root{--accent:#16a34a;--accent2:#4ade80;--ink:#0f1e14;--bg:#f2f8f3;--card:#fff;--line:#dcece0;--mut:#5f7a68;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#e7f6ec;--soft2:#f0faf3}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.top{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#0f3d24,#14532d);color:#fff;border-bottom:3px solid var(--accent2)}
.topin{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:11px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(22,163,74,.45)}
.brand .lg .material-symbols-outlined{font-size:24px;color:#04240f}
.brand b{font-size:15.5px;font-weight:900;font-family:"Noto Sans TC";display:block;line-height:1.15}
.brand span{font-size:9.5px;color:var(--accent2);letter-spacing:1.6px;font-weight:800}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-left:6px;min-width:0}
.nav button{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#d6ecdd;font:inherit;font-weight:700;font-size:13px;padding:8px 13px;border-radius:11px;cursor:pointer;font-family:"Noto Sans TC";white-space:nowrap;flex:none}
.nav button .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.nav button:hover{background:rgba(255,255,255,.13)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04240f;border-color:transparent}
.nav button.on .material-symbols-outlined{color:#04240f}
.topr{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfe8d7}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#04240f;display:grid;place-items:center;font-weight:900;flex:none;font-size:13px}
.main{max-width:1440px;margin:0 auto;padding:22px 24px 48px;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:5px 0 0;color:var(--mut);font-size:13px}
.vhr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{background:var(--soft);color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
.datechip{background:#fef3c7;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.22;font-size:30px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}
.g21{grid-template-columns:.9fr 1.4fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--mut);font-weight:700}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#d6f3df;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-mut{background:#eef2f0;color:#5f7a68}.t-pur{background:#ede9fe;color:#6d28d9}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11.5px;background:var(--soft2)}
table.data tr:last-child td{border-bottom:0}
.mono{font-family:Inter;font-weight:700}
.scroll{overflow-x:auto}
.bar{height:8px;background:#e3f0e7;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart{overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:start}
.board>*{min-width:0}
.col{background:var(--soft2);border:1px solid var(--line);border-radius:15px;padding:11px 11px 14px;display:flex;flex-direction:column;gap:10px}
.colh{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:800;font-size:13px;padding:2px 4px}
.colh .dot{width:9px;height:9px;border-radius:50%;flex:none}
.colh .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 9px;color:var(--mut);font-weight:800}
.kc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;border-top:3px solid var(--kcol,var(--accent));display:flex;flex-direction:column;gap:7px}
.kc .kt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kc .kt b{font-family:Inter;font-weight:800;font-size:13px}
.kc .kn{font-family:"Noto Sans TC";font-size:12.5px;font-weight:700;line-height:1.3;color:var(--ink)}
.kc .kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--mut)}
.kc .kmeta .material-symbols-outlined{font-size:14px}
.kc .kfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:7px}
.kc .kav{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:10px;flex:none}
.spectbl td .ok{color:var(--ok);font-weight:800}
.spectbl td .warn{color:var(--warn);font-weight:800}
.spectbl td .bad{color:var(--bad);font-weight:800}
.matchbig{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.candrow{display:flex;flex-direction:column;gap:9px}
.cand{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px}
.cand.sel{border-color:var(--accent);background:var(--soft2);box-shadow:0 0 0 2px rgba(22,163,74,.12)}
.cand .cn{min-width:0;flex:1}
.cand .cn b{font-family:Inter;font-weight:800;font-size:13px;display:block}
.cand .cn small{color:var(--mut);font-size:11px}
.cand .sc{width:54px;text-align:center;flex:none}
.cand .sc b{font-family:Inter;font-weight:900;font-size:19px;color:var(--accent)}
.cand .sc small{font-size:9.5px;color:var(--mut);display:block}
.avlgrp{display:flex;flex-direction:column;gap:8px}
.pref{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:11px;flex:none;color:#fff}
.chk{display:flex;flex-direction:column;gap:9px}
.chkrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.chkrow .ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.chkrow .cm{flex:1;min-width:0}
.chkrow .cm b{font-family:"Noto Sans TC";font-size:13px;display:block}
.chkrow .cm small{color:var(--mut);font-size:11px}
.ring{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v,0)*1%),#e3f0e7 0);display:grid;place-items:center;flex:none}
.ring i{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:Inter;font-weight:900;font-size:17px;color:var(--accent);font-style:normal}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px}
.tli::before{content:"";position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tli.done::before{background:var(--accent)}
.tli.now::before{border-color:var(--warn);animation:p 1.5s infinite}
.tli b{font-family:"Noto Sans TC";font-size:13px;display:block}
.tli .tm{font-size:11px;color:var(--mut);margin-top:2px}
.tli .td{font-size:12px;color:var(--ink);margin-top:4px;background:var(--soft2);border-radius:9px;padding:8px 10px;line-height:1.5}
.tests{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.trow .tn{flex:1;min-width:0;font-weight:700}
.trow .tb{width:110px;flex:none}
.trow .tv{width:52px;text-align:right;font-family:Inter;font-weight:800;flex:none}
.diff{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:Inter;font-size:12.5px}
.diffr{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.diffr:last-child{border-bottom:0}
.diffr .dl{width:22px;flex:none;font-weight:900}
.diffr.add{background:#eafaef}.diffr.add .dl{color:var(--ok)}
.diffr.del{background:#fdecec;text-decoration:line-through;color:#a13}.diffr.del .dl{color:var(--bad)}
.steps{display:flex;gap:0;flex-wrap:wrap;align-items:center}
.stp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:700}
.stp .sn{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.stp.done .sn{background:var(--accent);color:#fff}
.stp .arr{color:#c5d9cc;margin:0 10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:1080px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g21,.g11,.g3{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button{padding:8px 11px}
  .kpis{grid-template-columns:1fr 1fr}
  .who span{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="lg"><span class="material-symbols-outlined">account_tree</span></div>
      <div><b>電子料件替代料與AVL管理</b><span>ALT-PART &amp; AVL PLATFORM</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="topr">
      <div class="who"><span>採購 · 林采潔</span><div class="av">林</div></div>
    </div>
  </div>
</header>
<main class="main" id="view"></main>
<script>
var TODAY="2026-08-14";
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var MENU=[
  {i:"dashboard",t:"替代料看板"},
  {i:"account_tree",t:"替代料比對"},
  {i:"verified",t:"AVL 清單"},
  {i:"fact_check",t:"認證 RoHS"},
  {i:"science",t:"驗證測試"},
  {i:"rule",t:"BOM 更新"}
];
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}
function baseChart(o){o.chart=o.chart||{};o.chart.redrawOnParentResize=false;o.chart.redrawOnWindowResize=false;o.chart.animations={enabled:false};o.chart.fontFamily="Inter,Noto Sans TC,sans-serif";o.chart.toolbar={show:false};return o;}

function s0(){
  var kpis=[
    {l:"進行中替代案件",v:"38",u:"件",d:"缺料 21 · EOL 11 · 降本 6",ic:"account_tree",c:"up"},
    {l:"AVL 覆蓋率",v:"86",u:"%",d:"+3.4% 較上月",ic:"verified",c:"up"},
    {l:"平均驗證週期",v:"12.4",u:"天",d:"目標 ≤ 14 天",ic:"schedule",c:"up"},
    {l:"缺料風險件",v:"5",u:"件",d:"需求日已進入交期內",ic:"warning",c:"dn"}
  ];
  var cols=[
    {t:"料件比對需求",dot:"#94a3b8",col:"#94a3b8",cards:[
      {id:"ALT-2418",part:"MLCC 10µF/25V",reason:"缺料",tag:"t-bad",tt:"缺料風險",days:"需求 08/22",owner:"林",qty:"12k/月"},
      {id:"ALT-2421",part:"LDO 3.3V 500mA",reason:"EOL 停產",tag:"t-warn",tt:"停產替代",days:"需求 09/03",owner:"陳",qty:"4.2k/月"},
      {id:"ALT-2425",part:"連接器 FPC 0.5mm 30P",reason:"降本",tag:"t-info",tt:"成本優化",days:"需求 09/15",owner:"林",qty:"6k/月"}
    ]},
    {t:"搜尋替代料",dot:"#0ea5e9",col:"#0ea5e9",cards:[
      {id:"ALT-2410",part:"MCU ARM Cortex-M4",reason:"EOL 停產",tag:"t-warn",tt:"停產替代",days:"候選 3 筆",owner:"陳",qty:"1.8k/月"},
      {id:"ALT-2414",part:"電感 4.7µH 3A",reason:"缺料",tag:"t-bad",tt:"缺料風險",days:"候選 5 筆",owner:"黃",qty:"9k/月"}
    ]},
    {t:"規格與認證比對",dot:"#8b5cf6",col:"#8b5cf6",cards:[
      {id:"ALT-2402",part:"TVS 二極體 5V",reason:"缺料",tag:"t-bad",tt:"品保審查",days:"RoHS 待補",owner:"品",qty:"15k/月"},
      {id:"ALT-2406",part:"晶振 24MHz ±10ppm",reason:"降本",tag:"t-info",tt:"品保審查",days:"認證通過",owner:"品",qty:"3k/月"},
      {id:"ALT-2399",part:"MOSFET 30V 60A",reason:"EOL 停產",tag:"t-warn",tt:"品保審查",days:"REACH 檢核",owner:"品",qty:"2.6k/月"}
    ]},
    {t:"驗證測試 / 待核准",dot:"#16a34a",col:"#16a34a",cards:[
      {id:"ALT-2390",part:"穩壓 IC LDO 1.8V",reason:"降本",tag:"t-info",tt:"試產驗證",days:"信賴性測試中",owner:"研",qty:"5k/月"},
      {id:"ALT-2385",part:"鋁電容 470µF/16V",reason:"缺料",tag:"t-bad",tt:"待核准",days:"經理核准",owner:"經",qty:"7k/月"}
    ]}
  ];
  var boardHtml="";
  for(var c=0;c<cols.length;c++){
    var co=cols[c],cards="";
    for(var j=0;j<co.cards.length;j++){var k=co.cards[j];
      cards+='<div class="kc" style="--kcol:'+co.col+'">'+
        '<div class="kt"><b>'+esc(k.id)+'</b><span class="tag '+k.tag+'">'+esc(k.reason)+'</span></div>'+
        '<div class="kn">'+esc(k.part)+'</div>'+
        '<div class="kmeta"><span class="material-symbols-outlined">event</span>'+esc(k.days)+' · '+esc(k.qty)+'</div>'+
        '<div class="kfoot"><span class="tag t-mut">'+esc(k.tt)+'</span><div class="kav">'+esc(k.owner)+'</div></div>'+
      '</div>';
    }
    boardHtml+='<div class="col"><div class="colh"><span class="dot" style="background:'+co.dot+'"></span>'+esc(co.t)+
      '<span class="cnt">'+co.cards.length+'</span></div>'+cards+'</div>';
  }
  var kh="";for(var i=0;i<kpis.length;i++){var m=kpis[i];
    kh+='<div class="kpi"><span class="material-symbols-outlined ic">'+m.ic+'</span><div class="l">'+m.l+
      '</div><div class="v">'+m.v+' <small>'+m.u+'</small></div><div class="d '+m.c+'">'+esc(m.d)+'</div></div>';}
  return '<div class="vh"><div><h2>替代料案件看板</h2><p>缺料 · 停產(EOL) · 降本觸發的替代料案件，依作業階段流轉追蹤</p></div>'+
    '<div class="vhr"><span class="live"><i></i>即時同步 PLM／ERP</span><span class="datechip">'+TODAY+'</span></div></div>'+
    '<div class="kpis">'+kh+'</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>案件看板 <span class="r">依階段流轉 · 共 10 件</span></h3><div class="scroll"><div class="board">'+boardHtml+'</div></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>替代案件觸發來源趨勢</h3><div id="c0a" class="chart" style="height:250px"></div>'+
        '<div class="legend" style="margin-top:8px"><span><i style="background:#dc2626"></i>缺料</span><span><i style="background:#d97706"></i>EOL 停產</span><span><i style="background:#1d4ed8"></i>降本</span></div></div>'+
    '</div>';
}
function d0(){
  mkChart("c0a",baseChart({
    series:[
      {name:"缺料",data:[8,11,9,14,12,10]},
      {name:"EOL 停產",data:[5,6,7,6,8,11]},
      {name:"降本",data:[3,4,3,5,4,6]}
    ],
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:250,stacked:true},
    colors:["#dc2626","#d97706","#1d4ed8"],
    plotOptions:{bar:{columnWidth:"52%",borderRadius:4}},
    dataLabels:{enabled:false},
    xaxis:{categories:["3月","4月","5月","6月","7月","8月"]},
    yaxis:{title:{text:"案件數"}},
    legend:{show:false},
    grid:{borderColor:"#e3f0e7"},
    tooltip:{shared:true,intersect:false}
  }));
}

function s1(){
  var rows=[
    {p:"封裝尺寸",main:"0805",c1:"0805",c2:"0805",s1:"ok",s2:"ok"},

        '<div class="diffr del"><span class="dl">-</span>單一來源限制：僅 Murata GRM21BR61E106KA</div>'+
        '</div>'+
        '<p style="margin:12px 0 0;color:var(--mut);font-size:12px;line-height:1.6">變更後該料件由單一來源升級為三來源，缺料風險由高降為低，預估年降本 NT$ 42 萬。</p></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>系統同步狀態</h3><div id="c5a" class="chart" style="height:200px"></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">history</span>變更稽核紀錄 <span class="r">可追溯 · 不可竄改</span></h3>'+
      '<div class="scroll"><table class="data"><thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>狀態</th></tr></thead><tbody>'+ab+'</tbody></table></div></div>';
}
function d5(){
  mkChart("c5a",baseChart({
    series:[{name:"同步耗時(秒)",data:[2.1,3.4,1.8,2.6]}],
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:200},
    plotOptions:{bar:{columnWidth:"48%",borderRadius:4,distributed:true}},
    colors:["#16a34a","#4ade80","#0ea5e9","#8b5cf6"],
    dataLabels:{enabled:true,formatter:function(v){return v+"s";}},
    xaxis:{categories:["PLM","ERP","MES","WMS"]},
    yaxis:{title:{text:"秒"}},
    legend:{show:false},
    grid:{borderColor:"#e3f0e7"}
  }));
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];
function show(i){
  var n=SCREENS.length;if(i<0)i=0;if(i>=n)i=n-1;
  clearCharts();
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  void view.offsetHeight;
  DRAW[i]();
}
(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MENU.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MENU[i].i+'</span><span>'+MENU[i].t+'</span></button>';
  }
  nav.innerHTML=h;
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
