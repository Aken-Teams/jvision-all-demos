.t-info{color:#1e40af;background:#dbeafe;border-color:#bfdbfe}
.t-mut{color:#475569;background:#f1f5f9;border-color:#e2e8f0}
.t-pur{color:#6b21a8;background:#f3e8ff;border-color:#e9d5ff}
.scroll{max-width:100%;overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{

table.data tbody tr{transition:background .18s ease}
table.data tbody tr:hover{background:#f8fafc}
table.data tbody tr:last-child td{border-bottom:0}
table.data td:nth-child(n+3):has(.mono),table.data td.mono{text-align:right}
.mono{font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.chart{overflow:hidden}
.bar{height:7px;overflow:hidden;background:#e2e8f0;border-radius:2px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;align-items:start}
.col{

  border:1px solid var(--line);
  border-radius:3px;
  font:600 10px "Fira Code",monospace
}
.kc{
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--kcol,var(--blue));

  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.kc:hover{transform:translateY(-2px);border-color:#94a3b8;box-shadow:0 7px 16px rgba(15,23,42,.08)}
.kc .kt,.kc .kfoot{display:flex;align-items:center;justify-content:space-between;gap:7px}
.kc .kt b{font:700 11px "Fira Code",monospace}
.kc .kn{color:#1e293b;font-size:11.5px;font-weight:600;line-height:1.4}

.kc .kfoot{padding-top:7px;border-top:1px dashed var(--line)}
.kc .kav{

  color:#1d4ed8;background:#dbeafe;border-radius:50%;font-size:9px;font-weight:700
}
.spectbl td .ok{color:var(--ok);font-weight:700}
.spectbl td .warn{color:var(--warn);font-weight:700}
.spectbl td .bad{color:var(--bad);font-weight:700}
.candrow,.avlgrp,.chk,.tests{display:flex;flex-direction:column;gap:8px}
.cand{
  display:flex;align-items:center;gap:12px;

.cand .cn b{display:block;font:700 11.5px "Fira Code",monospace}
.cand .cn small{color:var(--mut);font-size:10.5px}
.cand .sc{width:56px;flex:none;text-align:right}
.cand .sc b{color:var(--blue);font:700 19px "Fira Code",monospace}
.cand .sc small{display:block;color:var(--mut);font-size:9px}
.pref{

}
.chkrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:6px}

.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding-bottom:15px}
.tli:before{
  content:"";position:absolute;left:-23px;top:1px;width:14px;height:14px;

.tli.done:before{background:var(--blue)}

.trow{display:flex;align-items:center;gap:10px;font-size:11.5px}

.diff{overflow:hidden;border:1px solid var(--line);border-radius:6px;font:500 11.5px "Fira Code",monospace}
.diffr{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.diffr:last-child{border-bottom:0}
.diffr .dl{width:20px;flex:none;font-weight:700}
.diffr.add{color:#14532d;background:#f0fdf4}

.diffr.del{color:#991b1b;background:#fef2f2;text-decoration:line-through}

.steps{display:flex;align-items:center;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11px;font-weight:600}
.stp .sn{
  width:25px;height:25px;display:grid;place-items:center;

.stp.done{color:#1e293b}

.arr{margin:0 8px;color:#94a3b8;font-size:17px}
.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--mut);font-size:10.5px;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:2px}
.grid-item,.kpi,.card{animation:enter .4s both cubic-bezier(.2,.8,.2,1)}
.kpis>:nth-child(2),.grid>:nth-child(2){animation-delay:.06s}
.kpis>:nth-child(3){animation-delay:.12s}
.kpis>:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1180px){
  .topin{align-items:flex-start;flex-wrap:wrap}
  .brand{min-width:0}.nav{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
}
@media(max-width:1024px){
  .g2,.g21{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(210px,1fr))}
}
@media(max-width:768px){
  .main{padding:22px 16px 44px}
  .topin{padding:9px 16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g11,.g3{grid-template-columns:1fr}
  .vh{align-items:flex-start;flex-direction:column}
  .vhr{justify-content:flex-start}
}
@media(max-width:560px){
  .brand b{font-size:13px}
  .who>span{display:none}
  .nav button{min-width:42px;justify-content:center}
  .nav button span:not(.material-symbols-outlined){display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:14px}
  .kpi .v{font-size:21px}
  .board{grid-template-columns:1fr}
  .card{padding:14px}
  .steps{gap:8px}
  .arr{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
  .grid-item,.kpi,.card,.live i,.tli.now:before{animation:none!important;opacity:1;transform:none}
}
</style>

var SCREENS=[s0,s1,s2,s3,s4,s5],DRAW=[d0,d1,d2,d3,d4,d5];
function show(i){
  var n=SCREENS.length;
  if(i<0)i=0;
  if(i>=n)i=n-1;
  clearCharts();
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].className=active?"on":"";
    btns[b].setAttribute("aria-current",active?"page":"false")
  }
  void view.offsetHeight;
  DRAW[i]()
}
(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MENU.length;i++){
    h+='<button type="button" data-i="'+i+'" onclick="location.hash=\'v'+i+'\'"><span class="material-symbols-outlined" aria-hidden="true">'+MENU[i].i+'</span><span>'+MENU[i].t+'</span></button>'
  }
  nav.innerHTML=h
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
