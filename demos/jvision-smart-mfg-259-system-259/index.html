<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>治具/夾具設計管理系統</title>
<meta name="description" content="治具/夾具設計圖檔版本管理、製作進度與外包追蹤、定期校驗與維護排程"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#1d4ed8; --accent2:#60a5fa;
  --bg:#eef2f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b;
  --line:#e2e8f0; --side:#0b1220; --side2:#141f36;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0891b2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.app{display:flex;min-height:100vh;align-items:stretch}
/* sidebar */
.side{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--side),var(--side2));color:#cbd5e1;padding:20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand .logo{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{color:#fff;font-size:15px;font-weight:800;line-height:1.3;display:block}
.brand span{font-size:11px;color:#8ea3c4}
.nav{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:transparent;border:0;color:#b6c2d6;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:.15s;min-width:0}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn small{display:block;font-size:11px;font-weight:400;color:#7d8dab;margin-top:1px}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.35)}
.navbtn.on small{color:#dbeafe}
.navtxt{min-width:0;flex:1}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#6b7c9c;border-top:1px solid rgba(255,255,255,.08)}
/* main */
.main{flex:1 1 auto;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:20px;font-weight:800;letter-spacing:.2px}
.top .sub{font-size:12.5px;color:var(--sub);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.who small{color:var(--sub);font-size:11px}
.who b{font-size:13px}
/* grids */
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .desc{font-size:11.5px;color:var(--sub);margin-bottom:12px}
/* kpi */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;min-width:0;position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:11px}
.kpi .lab{font-size:12px;color:var(--sub);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub)}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--sub)}
/* chart */
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}
.chart.lg{height:300px}
/* table */
.tblwrap{overflow-x:auto;border-radius:11px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{background:#f1f5f9;color:#475569;font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap;font-size:11.5px}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:hover td{background:#f8fafc}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#cffafe;color:#0e7490}
.t-mut{background:#e2e8f0;color:#475569}
.t-acc{background:#dbeafe;color:#1e40af}
.mono{font-family:"Inter",monospace;font-weight:600;letter-spacing:.3px}
/* progress bar */
.bar{height:7px;background:#e9eef6;border-radius:99px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:#f5f8fd;border:1px solid var(--line);border-radius:13px;padding:11px 10px;min-width:0}
.col>h4{font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#334155}
.col>h4 .n{background:#e2e8f0;color:#475569;font-size:11px;padding:1px 8px;border-radius:999px}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tk b{font-size:12.5px;display:block}
.tk .m{font-size:11px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk.b-warn{border-left-color:var(--warn)} .tk.b-ok{border-left-color:var(--ok)} .tk.b-bad{border-left-color:var(--bad)}
/* timeline */
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlrow{position:relative;padding:0 0 18px 6px}
.tlrow:last-child{padding-bottom:2px}
.tlrow .dot{position:absolute;left:-21px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tlrow.d-ok .dot{border-color:var(--ok)} .tlrow.d-warn .dot{border-color:var(--warn)} .tlrow.d-bad .dot{border-color:var(--bad)}
.tlrow .tt{font-size:12.5px;font-weight:700}
.tlrow .td{font-size:11.5px;color:var(--sub);margin-top:2px}
.tlrow .tm{font-size:11px;color:#94a3b8;margin-top:3px;font-weight:600}
/* version node */
.vnode{display:flex;gap:12px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.vnode .vh{width:44px;height:44px;flex:0 0 44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.vnode .vb{min-width:0;flex:1}
.vnode .vb b{font-size:13px}
.vnode .vb p{font-size:11.5px;color:var(--sub);margin-top:3px}
/* stat row */
.statline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.statline .s{min-width:0}
.statline .s b{font-size:19px;font-weight:800;display:block}
.statline .s span{font-size:11px;color:var(--sub)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.sig{background:linear-gradient(135deg,#0b1220,#1e3a8a);color:#fff;border:0}
.sig h3{color:#fff} .sig h3 .material-symbols-outlined{color:var(--accent2)}
.sig .desc{color:#c7d2fe}
.minibars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.mb{display:flex;align-items:center;gap:10px;font-size:12px}
.mb .lb{width:88px;flex:0 0 88px;color:var(--sub);font-weight:600}
.mb .num{width:38px;text-align:right;font-weight:700;font-size:12px}
.alertbox{display:flex;gap:10px;align-items:flex-start;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 13px}
.alertbox.warn{background:#fffbeb;border-color:#fde68a}
.alertbox .material-symbols-outlined{color:var(--bad)}
.alertbox.warn .material-symbols-outlined{color:var(--warn)}
.alertbox b{font-size:12.5px} .alertbox p{font-size:11.5px;color:var(--sub);margin-top:2px}
.hero-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 13px;font-size:12px;font-weight:600;min-width:0}
.chip .material-symbols-outlined{font-size:18px;color:var(--accent)}
.chip b{color:var(--accent);font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0}
.cal .dh{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding:2px 0}
.cd{border:1px solid var(--line);border-radius:9px;padding:6px 5px;min-height:56px;min-width:0;background:#fff;font-size:11px}
.cd .dn{font-weight:700;font-size:11.5px;color:#334155}
.cd .ev{margin-top:4px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:6px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd.dim{background:#f8fafc;color:#cbd5e1}
.cd.dim .dn{color:#cbd5e1}
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr)} }
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .brand{border-bottom:0;padding:0 12px 0 4px;margin:0;flex:0 0 auto}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;gap:6px}
  .navbtn{width:auto;flex:0 0 auto;padding:8px 12px}
  .navbtn small{display:none}
  .side .foot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .main{padding:16px 14px 34px}
  .navtxt{display:none}
  .navbtn{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .cd{min-height:44px;padding:4px 3px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>治具/夾具設計<br/>管理系統</b><span>Jig &amp; Fixture PLM</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>v2.6 · 研發管理平台</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="ttl">治具總覽儀表板</h1>
        <div class="sub" id="stl">全廠治具狀態、校驗到期與製作進度總覽</div>
      </div>
      <div class="who">
        <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span> 線上</span>
        <div class="av">陳</div>
        <div><b>陳彥廷</b><br/><small>研發專案管理師</small></div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var C=document.getElementById("screen");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var ch=echarts.init(el);charts.push(ch);return ch;}
var ACC="#1d4ed8",ACC2="#60a5fa",OK="#16a34a",WARN="#d97706",BAD="#dc2626",INFO="#0891b2",GREY="#94a3b8";

var NAV=[
  {ic:"dashboard",name:"治具總覽儀表板",sub:"狀態與到期預警"},
  {ic:"account_tree",name:"圖檔版本管理",sub:"版次控管與凍結"},
  {ic:"precision_manufacturing",name:"製作進度追蹤",sub:"自製與外包看板"},
  {ic:"groups",name:"外包廠商協作",sub:"廠商指派與驗收"},
  {ic:"fact_check",name:"校驗維護排程",sub:"定期校驗排程"},
  {ic:"history",name:"履歷稽核追溯",sub:"全生命週期紀錄"}
];

function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')">'+
       '<span class="material-symbols-outlined">'+NAV[i].ic+'</span>'+
       '<span class="navtxt">'+NAV[i].name+'<small>'+NAV[i].sub+'</small></span></button>';
  }
  document.getElementById("nav").innerHTML=h;
}
buildNav();

function setActive(i){
  var b=document.querySelectorAll(".navbtn");
  for(var k=0;k<b.length;k++){b[k].className="navbtn"+(k===i?" on":"");}
  document.getElementById("ttl").textContent=NAV[i].name;
  var subs=["全廠治具狀態、校驗到期與製作進度總覽","治具設計圖檔版次控管、變更差異與版本凍結",
    "自製與外包治具製作進度看板即時追蹤","外包廠商指派、交期監控與驗收評分",
    "治具定期校驗與保養排程、到期提醒","治具全生命週期操作紀錄與稽核查詢"];
  document.getElementById("stl").textContent=subs[i];
}

function pbar(p){return '<div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:'+p+'%"></i></div><span style="font-size:11px;font-weight:700;color:#475569">'+p+'%</span></div>';}

/* ===================== SCREEN 0 ===================== */
function s0(){
  var kpis=[
    {ic:"inventory_2",bg:ACC,lab:"治具總數",val:"1,284",u:"套",d:"+38 本季新增",cls:"up",di:"trending_up"},
    {ic:"warning",bg:WARN,lab:"校驗即將到期",val:"27",u:"套",d:"14 天內需校驗",cls:"down",di:"schedule"},
    {ic:"precision_manufacturing",bg:INFO,lab:"製作中案件",val:"46",u:"件",d:"其中 18 件外包",cls:"flat",di:"sync"},
    {ic:"fact_check",bg:OK,lab:"本月校驗達成率",val:"96.4",u:"%",d:"+4.1 vs 上月",cls:"up",di:"trending_up"}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    kh+='<div class="kpi"><div class="ic" style="background:'+k.bg+'"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
        '<div class="lab">'+k.lab+'</div><div class="val">'+k.val+' <small>'+k.u+'</small></div>'+
        '<div class="delta '+k.cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+k.di+'</span>'+k.d+'</div></div>';}

  var alerts=[
    {t:"JIG-0473 定位夾具校驗逾期 2 天",p:"適用產線 A-3，最後校驗 2026/06/01",w:false},
    {t:"JIG-1120 外包治具交期延遲",p:"精工模具廠 · 原訂 08/12 已逾期",w:false},
    {t:"27 套治具將於 14 天內到期校驗",p:"建議提前排入下週校驗排程",w:true}
  ];
  var ah="";
  for(var a=0;a<alerts.length;a++){var al=alerts[a];
    ah+='<div class="alertbox'+(al.w?" warn":"")+'" style="margin-bottom:9px"><span class="material-symbols-outlined">'+(al.w?"schedule":"error")+'</span><div><b>'+al.t+'</b><p>'+al.p+'</p></div></div>';}

  C.innerHTML=
  '<div class="hero-strip">'+
    '<div class="chip"><span class="material-symbols-outlined">factory</span>適用機台 <b>142</b></div>'+
    '<div class="chip"><span class="material-symbols-outlined">groups</span>外包廠商 <b>9</b></div>'+
    '<div class="chip"><span class="material-symbols-outlined">verified</span>凍結版本 <b>861</b></div>'+
    '<div class="chip"><span class="material-symbols-outlined">history</span>本月操作 <b>2,047</b></div>'+
  '</div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'+
  '<div class="grid g23" style="margin-bottom:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>治具製作與校驗趨勢</h3>'+
      '<div class="desc">近 6 週製作完成、校驗完成與逾期件數</div><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>治具狀態分布</h3>'+
      '<div class="desc">全廠 1,284 套治具目前狀態</div><div id="c0b" class="chart"></div></div>'+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>需關注事項</h3><div class="desc">系統自動排序之風險與到期提醒</div>'+ah+'</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">category</span>各類治具占比</h3><div class="desc">依治具型態統計</div><div id="c0c" class="chart"></div></div>'+
  '</div>';

  void C.offsetHeight;
  var a=mk("c0a");
  if(a)a.setOption({tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},grid:{left:34,right:14,top:16,bottom:44},
    xAxis:{type:"category",data:["W23","W24","W25","W26","W27","W28"],axisLabel:{fontSize:11}},
    yAxis:{type:"value",axisLabel:{fontSize:11},splitLine:{lineStyle:{color:"#eef2f7"}}},
    series:[
      {name:"製作完成",type:"bar",stack:"a",data:[12,15,11,18,14,20],itemStyle:{color:ACC}},
      {name:"校驗完成",type:"bar",stack:"a",data:[22,19,25,21,28,24],itemStyle:{color:ACC2}},
      {name:"逾期",type:"line",data:[5,4,6,3,4,2],itemStyle:{color:BAD},lineStyle:{width:2}}
    ]});
  var b=mk("c0b");
  if(b)b.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["46%","70%"],center:["50%","44%"],avoidLabelOverlap:true,label:{show:false},
      data:[{value:742,name:"上線使用",itemStyle:{color:OK}},{value:186,name:"待校驗",itemStyle:{color:WARN}},
        {value:46,name:"製作中",itemStyle:{color:INFO}},{value:198,name:"庫存備用",itemStyle:{color:ACC2}},
        {value:112,name:"停用報廢",itemStyle:{color:GREY}}]}]});
  var c=mk("c0c");
