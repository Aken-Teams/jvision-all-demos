<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>治具/夾具設計管理系統</title>
<meta name="description" content="治具/夾具設計圖檔版本管理、製作進度與外包追蹤、定期校驗與維護排程"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#123524;
  --muted:#475569;
  --line:#BBF7D0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --card:var(--color-card);
  --sub:var(--color-muted-foreground);
  --side:#123C27;
  --side2:#0D2F20;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#0F766E;
  --shadow-sm:0 2px 8px rgba(20,83,45,.07);
  --shadow-md:0 12px 30px rgba(20,83,45,.10);
  --shadow-lg:0 22px 52px rgba(20,83,45,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{max-width:100%;overflow-x:hidden;font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}
button,[onclick],[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#BBF7D0;color:#052E16}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px;font-variation-settings:"FILL" 0,"wght" 430,"GRAD" 0,"opsz" 24}
.app{display:flex;min-height:100vh;align-items:stretch;position:relative}
.app:before{content:"";position:fixed;z-index:-1;right:-14vw;top:-20vw;width:48vw;height:48vw;border-radius:42% 58% 63% 37% / 45% 34% 66% 55%;background:radial-gradient(circle at 35% 35%,rgba(34,197,94,.14),rgba(187,247,208,.04) 68%,transparent 69%);pointer-events:none}
.side{width:258px;flex:0 0 258px;min-width:0;padding:20px 14px 16px;display:flex;flex-direction:column;gap:6px;color:#DCFCE7;background:linear-gradient(165deg,var(--side) 0%,var(--side2) 72%,#17492F 100%);border-right:1px solid rgba(187,247,208,.18);position:relative;overflow:hidden}
.side:after{content:"";position:absolute;width:210px;height:210px;right:-112px;bottom:56px;border-radius:63% 37% 44% 56% / 39% 52% 48% 61%;border:34px solid rgba(74,222,128,.07);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:7px 8px 17px;border-bottom:1px solid rgba(220,252,231,.15);margin-bottom:10px;position:relative;z-index:1}
.brand .logo{width:43px;height:43px;flex:0 0 43px;border-radius:18px 12px 17px 11px;background:linear-gradient(145deg,#4ADE80,var(--color-primary));display:flex;align-items:center;justify-content:center;color:#052E16;box-shadow:0 8px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.38)}
.brand .logo .material-symbols-outlined{font-size:25px}
.brand b{display:block;color:#FFFFFF;font-size:15px;font-weight:700;line-height:1.35;letter-spacing:.02em}
.brand span{font-size:10.5px;color:#BBF7D0;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;min-width:0;padding:10px 11px;border:1px solid transparent;border-radius:15px 11px 15px 11px;background:transparent;color:#D1FAE5;font-size:13px;font-weight:600;text-align:left;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;color:#86EFAC}
.navbtn small{display:block;margin-top:1px;color:#A7D7B8;font-size:10.5px;font-weight:400}
.navbtn:hover{background:rgba(255,255,255,.08);border-color:rgba(187,247,208,.15);color:#FFFFFF;transform:translateX(2px)}
.navbtn.on{background:#F0FDF4;color:#14532D;border-color:#DCFCE7;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.navbtn.on .material-symbols-outlined{color:var(--color-primary)}
.navbtn.on small{color:#3F6550}
.navtxt{min-width:0;flex:1}
.side .foot{position:relative;z-index:1;margin-top:auto;padding:13px 10px 2px;border-top:1px solid rgba(220,252,231,.14);color:#A7D7B8;font-family:"Roboto Mono",monospace;font-size:10px;line-height:1.7}
.main{flex:1 1 auto;min-width:0;padding:23px 27px 42px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:14px 17px;background:rgba(255,255,255,.72);border:1px solid rgba(187,247,208,.9);border-radius:18px 24px 18px 24px;box-shadow:var(--shadow-sm);backdrop-filter:blur(12px)}
.top h1{color:var(--color-foreground);font-size:21px;font-weight:700;letter-spacing:.015em}
.top .sub{margin-top:2px;color:var(--sub);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid #86EFAC;border-radius:999px;background:#DCFCE7;color:#166534;font-size:11.5px;font-weight:700}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:36px;height:36px;border-radius:53% 47% 55% 45%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--color-primary),#166534);color:#FFFFFF;font-weight:700;font-size:13px;box-shadow:0 5px 14px rgba(21,128,61,.22)}
.who small{color:var(--sub);font-size:10.5px}
.who b{font-size:12.5px;color:var(--ink)}
#screen>*,.grid>*{animation:chapterReveal .36s ease-out both}
.grid>*:nth-child(2){animation-delay:.035s}.grid>*:nth-child(3){animation-delay:.07s}.grid>*:nth-child(4){animation-delay:.105s}
@keyframes chapterReveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:13px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.card,.kpi{min-width:0;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card{padding:16px 17px;border-radius:18px 23px 18px 23px}
.card:hover,.kpi:hover{border-color:#86EFAC;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:3px;color:var(--color-card-foreground);font-size:13.5px;font-weight:700}
.card h3 .material-symbols-outlined{width:28px;height:28px;border-radius:11px 8px 11px 8px;display:inline-flex;align-items:center;justify-content:center;background:#DCFCE7;color:var(--color-primary);font-size:17px}
.card .desc{margin-bottom:12px;color:var(--sub);font-size:11.5px}
.kpi{position:relative;overflow:hidden;padding:15px 16px;border-radius:21px 16px 22px 16px}
.kpi:after{content:"";position:absolute;right:-28px;top:-35px;width:90px;height:90px;border-radius:43% 57% 60% 40%;background:rgba(34,197,94,.07);pointer-events:none}
.kpi .ic{width:38px;height:38px;margin-bottom:10px;border-radius:15px 10px 15px 10px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-shadow:0 7px 16px rgba(20,83,45,.18)}
.kpi .lab{color:var(--sub);font-size:11.5px;font-weight:600}
.kpi .val{margin-top:1px;color:#102D1D;font-family:"Roboto Mono",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small{color:var(--sub);font-family:"Exo",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;font-weight:700}
.up{color:#166534}.down{color:#B91C1C}.flat{color:#475569}
.chart{width:100%;height:260px;overflow:hidden}
.chart.sm{height:210px}.chart.lg{height:300px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px 18px 14px 18px;background:#FFFFFF;scrollbar-color:#86EFAC #ECFDF5}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
th{padding:9px 11px;background:#E4F7E9;color:#28563B;font-size:10.5px;font-weight:700;text-align:left;white-space:nowrap;letter-spacing:.025em}
th:first-child{border-top-left-radius:13px}th:last-child{border-top-right-radius:17px}
td{padding:9px 11px;border-top:1px solid #D7F2DF;white-space:nowrap;vertical-align:middle}
tbody tr:nth-child(even) td{background:#FAFEFB}
tbody tr:hover td{background:#ECFDF5}
td .mono,td.mono,.num{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
td.mono,.num{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.4}
.t-ok{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.t-warn{background:#FEF3C7;border-color:#FCD34D;color:#92400E}
.t-bad{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B}
.t-info{background:#CCFBF1;border-color:#5EEAD4;color:#115E59}
.t-mut{background:#E8F0F1;border-color:#CBD5E1;color:#475569}
.t-acc{background:#D1FAE5;border-color:#6EE7B7;color:#065F46}
.mono{font-family:"Roboto Mono",monospace;font-weight:600;letter-spacing:.015em;font-variant-numeric:tabular-nums lining-nums}
.bar{height:7px;min-width:70px;overflow:hidden;border-radius:99px;background:#DDEBE2;box-shadow:inset 0 1px 2px rgba(20,83,45,.09)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;min-width:0}
.col{min-width:0;padding:10px;border:1px solid #CDEED7;border-radius:17px 13px 19px 13px;background:#F5FCF7}
.col:nth-child(even){border-radius:13px 19px 13px 17px}
.col>h4{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#28563B;font-size:12px;font-weight:700}
.col>h4 .n{padding:1px 8px;border:1px solid #A7E8BB;border-radius:999px;background:#DCFCE7;color:#166534;font-family:"Roboto Mono",monospace;font-size:10.5px}
.tk{margin-bottom:8px;padding:9px 10px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px 15px 11px 15px;background:#FFFFFF;box-shadow:0 2px 6px rgba(20,83,45,.05)}
.tk b{display:block;font-size:12px}
.tk .m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px;color:var(--sub);font-size:10.5px}
.tk.b-warn{border-left-color:var(--warn)}.tk.b-ok{border-left-color:var(--ok)}.tk.b-bad{border-left-color:var(--bad)}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;border-radius:2px;background:#B7E7C6}
.tlrow{position:relative;padding:0 0 16px 6px}
.tlrow:last-child{padding-bottom:2px}
.tlrow .dot{position:absolute;left:-21px;top:2px;width:14px;height:14px;border:3px solid var(--accent);border-radius:52% 48% 55% 45%;background:#FFFFFF;box-shadow:0 0 0 3px #ECFDF5}
.tlrow.d-ok .dot{border-color:var(--ok)}.tlrow.d-warn .dot{border-color:var(--warn)}.tlrow.d-bad .dot{border-color:var(--bad)}
.tlrow .tt{color:#193C28;font-size:12px;font-weight:700}
.tlrow .td{margin-top:2px;color:var(--sub);font-size:11px}
.tlrow .tm{margin-top:3px;color:#64748B;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:500;font-variant-numeric:tabular-nums}
.vnode{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px;padding:11px 12px;border:1px solid var(--line);border-radius:15px 11px 16px 11px;background:#FFFFFF}
.vnode .vh{width:44px;height:44px;flex:0 0 44px;border-radius:16px 10px 16px 10px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700}
.vnode .vb{min-width:0;flex:1}.vnode .vb b{font-size:12.5px}.vnode .vb p{margin-top:3px;color:var(--sub);font-size:11px}
.statline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.statline .s{min-width:0}.statline .s b{display:block;color:#173A27;font-family:"Roboto Mono",monospace;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}.statline .s span{color:var(--sub);font-size:10.5px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;color:var(--sub);font-size:11px}
.legend i{width:10px;height:10px;display:inline-block;margin-right:5px;border:1px solid rgba(15,23,42,.18);border-radius:4px 2px 4px 2px;vertical-align:-1px}
.sig{border:1px solid #2F7650;background:linear-gradient(145deg,#123C27,#0D2F20);color:#FFFFFF;box-shadow:var(--shadow-md)}
.sig:hover{border-color:#4ADE80}.sig h3{color:#FFFFFF}.sig h3 .material-symbols-outlined{background:rgba(134,239,172,.14);color:#86EFAC}.sig .desc{color:#D1FAE5}
.minibars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.mb{display:flex;align-items:center;gap:9px;font-size:11.5px}.mb .lb{width:88px;flex:0 0 88px;color:var(--sub);font-weight:600}.mb .num{width:42px;color:#244A34;font-weight:700;font-size:11px}
.alertbox{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid #FCA5A5;border-radius:14px 10px 15px 10px;background:#FEF2F2}
.alertbox.warn{border-color:#FCD34D;background:#FFFBEB}
.alertbox .material-symbols-outlined{color:var(--bad)}.alertbox.warn .material-symbols-outlined{color:var(--warn)}
.alertbox b{color:#4C1D1D;font-size:12px}.alertbox.warn b{color:#78350F}.alertbox p{margin-top:2px;color:#475569;font-size:11px}
.hero-strip{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;min-width:0;padding:7px 11px;border:1px solid var(--line);border-radius:14px 10px 15px 10px;background:#FFFFFF;color:#315B42;font-size:11.5px;font-weight:600;box-shadow:var(--shadow-sm)}
.chip .material-symbols-outlined{color:var(--accent);font-size:17px}.chip b{color:#166534;font-family:"Roboto Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;min-width:0}
.cal .dh{text-align:center;padding:2px 0;color:#40624D;font-size:10.5px;font-weight:700}
.cd{min-width:0;min-height:55px;padding:5px;border:1px solid var(--line);border-radius:10px 7px 11px 7px;background:#FFFFFF;font-size:10.5px}
.cd .dn{color:#28563B;font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}.cd .ev{display:block;overflow:hidden;margin-top:4px;padding:2px 5px;border-radius:6px;font-size:9.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.cd.dim{background:#F2F7F3;color:#94A3B8}.cd.dim .dn{color:#94A3B8}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:11px 12px;border-right:0;border-bottom:1px solid rgba(187,247,208,.2)}
  .brand{flex:0 0 auto;margin:0;padding:0 13px 0 3px;border-bottom:0}
  .brand .logo{width:38px;height:38px;flex-basis:38px}
  .nav{flex:1 1 100%;flex-direction:row;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding:4px 0 1px;scrollbar-width:thin}
  .navbtn{width:auto;min-height:42px;flex:0 0 auto;padding:8px 11px}
  .navbtn small{display:none}
  .side .foot{display:none}
  .main{padding-top:17px}
}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){
  .main{padding:13px 11px 30px}
  .top{align-items:flex-start;margin-bottom:12px;padding:12px 13px;border-radius:16px 20px 16px 20px}
  .top h1{font-size:18px}.top .sub{font-size:11px}
  .who{width:100%;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line)}
  .brand b{font-size:13px}.brand span{font-size:9.5px}
  .navtxt{display:none}.navbtn{min-width:42px;justify-content:center;padding:9px}
  .grid{gap:10px}.card{padding:14px 13px}.kpi{padding:13px 14px}
  .board{grid-template-columns:1fr}.chart{height:230px}.chart.sm{height:195px}
  .cd{min-height:44px;padding:4px 3px}.cd .ev{font-size:9px;padding:2px 3px}
  .hero-strip{gap:6px}.chip{flex:1 1 calc(50% - 6px);justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  #screen>*,.grid>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>治具/夾具設計<br/>管理系統</b><span>Jig &amp; Fixture PLM</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>v2.6 · 研發管理平台</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="ttl">治具總覽儀表板</h1>
        <div class="sub" id="stl">全廠治具狀態、校驗到期與製作進度總覽</div>
      </div>
      <div class="who">
        <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span> 線上</span>
        <div class="av">陳</div>
        <div><b>陳彥廷</b><br/><small>研發專案管理師</small></div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var C=document.getElementById("screen");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var ch=echarts.init(el);charts.push(ch);return ch;}
var ACC="#15803D",ACC2="#22C55E",OK="#15803D",WARN="#D97706",BAD="#DC2626",INFO="#0F766E",GREY="#64748B";

var NAV=[
  {ic:"dashboard",name:"治具總覽儀表板",sub:"狀態與到期預警"},
  {ic:"account_tree",name:"圖檔版本管理",sub:"版次控管與凍結"},
  {ic:"precision_manufacturing",name:"製作進度追蹤",sub:"自製與外包看板"},
  {ic:"groups",name:"外包廠商協作",sub:"廠商指派與驗收"},
  {ic:"fact_check",name:"校驗維護排程",sub:"定期校驗排程"},
  {ic:"history",name:"履歷稽核追溯",sub:"全生命週期紀錄"}
];

function buildNav(){
  var h="";
