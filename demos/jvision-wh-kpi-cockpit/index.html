<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>倉儲 KPI 戰情室 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#FFFFFF;
  --color-secondary:#475569;
  --color-on-secondary:#FFFFFF;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F2F3F4;
  --color-muted-foreground:#475569;
  --color-border:#E6E8EA;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E6E8EA;

  --accent:#334155;
  --accent2:#059669;
  --accent-soft:#ECFDF5;
  --accent-soft2:#D1FAE5;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --th:#F2F3F4;
  --hov:#F8FAFC;
  --track:#E6E8EA;
  --sidebar:#FFFFFF;
  --sidebar2:#F8FAFC;
  --side-edge:#E6E8EA;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#334155;
  --r:6px;
  --glow:rgba(15,23,42,.08);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 5px 16px rgba(15,23,42,.05);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  font-size:13px;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h{
  margin:0;
  font-family:"Poppins","Open Sans",sans-serif;
  color:var(--ink);
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px;
}
::selection{background:#A7F3D0;color:#052E24}

.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;
  flex:none;
  min-width:0;
  background:var(--sidebar);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:0 8px 20px;
  border-bottom:1px solid var(--line);
}
.brand-logo{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:5px;
}
.brand-logo .material-symbols-outlined{font-size:21px}
.brand-txt b{display:block;font-size:14px;font-weight:700;letter-spacing:.01em}
.brand-txt span{display:block;margin-top:1px;font-size:9px;color:var(--muted);letter-spacing:.13em}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:18px}
.nav button{
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:9px 10px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:5px;
  text-align:left;
  font-weight:600;
  transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease,transform 200ms ease;
  white-space:nowrap;
}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav button:hover{color:var(--ink);background:var(--color-muted);border-color:var(--line);transform:translateX(2px)}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:none;
}
.nav button.on::before{content:"";width:3px;height:20px;background:#6EE7B7;border-radius:2px;flex:none}
.nav .idx{margin-left:auto;font:600 10px/1 "Open Sans",sans-serif;opacity:.72}
.side-foot{
  margin-top:auto;
  padding:14px 9px 2px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
  line-height:1.7;
}
.side-foot b{color:var(--ink)}
.main{flex:1;min-width:0;padding:22px 26px 52px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:17px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.topbar h1{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{color:var(--color-accent);font-size:23px}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  font-size:11px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #D1FAE5;animation:pulse 2s ease-in-out infinite}
.avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:var(--color-primary);border-radius:4px;font-weight:700;font-size:12px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.card,.sec{padding:15px}
.sec{margin-bottom:12px}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{
  transition:border-color 220ms ease,box-shadow 220ms ease,transform 220ms ease,background-color 220ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#CBD5E1;box-shadow:0 2px 3px rgba(15,23,42,.04),0 8px 20px rgba(15,23,42,.07)}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.sec>h3{margin-bottom:11px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:18px;color:var(--color-accent)}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 16px;margin:0;font-size:12px}
.dl dt{color:var(--muted);font-size:11px;font-weight:600}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font-size:10.5px}

.kpi,.stat,.tile{position:relative;overflow:hidden;padding:14px 15px;border-top:3px solid var(--color-primary)}
.kpi::after{display:none}
.kpi .ico,.tile .ti{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-accent);
  background:var(--accent-soft);
  border:1px solid #A7F3D0;
  border-radius:4px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:9px;color:var(--muted);font-size:11px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--color-accent)}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:25px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--muted);font:600 12px/1 "Open Sans",sans-serif;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:10.5px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:6px}
.tile b{padding-right:38px;font-size:12px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}
.tile .ti{position:absolute;top:12px;right:12px}

.card.pad0 .card-h{padding:15px 15px 0!important}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:10px 12px;
  color:var(--muted);
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background-color 180ms ease}
tbody tr:hover{background:var(--hov)}
tbody tr:last-child td{border-bottom:none}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
td:first-child,td .mono,.mono{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#F1F5F9;color:#334155}
.t-gray{background:#F8FAFC;color:#475569}
.t-acc,.t-pink{background:#ECFDF5;color:#047857}

.bar{height:6px;min-width:56px;overflow:hidden;background:var(--track);border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-accent);border-radius:2px}
.prog{display:flex;align-items:center;gap:7px;min-width:0}
.prog small{width:36px;flex:none;color:var(--muted);font-size:10px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 15px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-22px;top:3px;width:12px;height:12px;border:3px solid var(--color-primary);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font:600 10px/1.4 ui-monospace,"SFMono-Regular",Consolas,monospace}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:18px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10px}
.note{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted);font-size:11px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--th);border:1px solid var(--line);border-radius:5px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:11px;font-weight:600}
.col-h .cnt{padding:2px 7px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-size:10px}
.pcard{padding:10px 11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--color-accent);border-radius:4px}
.pcard:hover{border-color:#94A3B8;transform:translateY(-1px)}
.pcard b{font-size:11.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:7px;color:var(--ink);font-size:10px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#065F46;background:#D1FAE5;border-radius:3px;font-weight:800}
.mini-av{width:18px;height:18px;font-size:8px}
.av{width:25px;height:25px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:5px}
.lane-row:hover{border-color:#94A3B8}
.lane-row .num{width:29px;height:29px;display:flex;align-items:center;justify-content:center;flex:none;color:#065F46;background:#D1FAE5;border-radius:3px;font:700 12px/1 "Poppins",sans-serif}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:12px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:10.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:21px;height:21px;display:flex;align-items:center;justify-content:center;z-index:1;color:var(--muted);background:#fff;border:2px solid var(--line);border-radius:50%;font-size:10px}
.steps .ln{width:18px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:#047857;border-color:var(--color-accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 3px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12px}
.rep-row .sku span{color:var(--muted);font-size:10px}
.gauge{width:108px;flex:none}
.gauge .track{height:7px;overflow:hidden;background:var(--track);border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--color-accent);border-radius:2px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:9px;text-align:right}
.band{position:relative;height:25px;min-width:150px;background:var(--track);border-radius:3px}
.band .rng{position:absolute;top:0;bottom:0;background:#D1FAE5;border-radius:3px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:11px;height:19px;background:var(--color-primary);border-radius:2px}

#screen{display:grid;grid-template-columns:360px minmax(0,1fr);grid-auto-rows:min-content;gap:12px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:292px}
#screen>.grid.g4:first-child>*{animation:card-in 400ms cubic-bezier(.2,.8,.2,1) both}
#screen>.grid.g4:first-child>*:nth-child(2){animation-delay:60ms}
#screen>.grid.g4:first-child>*:nth-child(3){animation-delay:120ms}
#screen>.grid.g4:first-child>*:nth-child(4){animation-delay:180ms}
#screen>*:nth-child(n+2){animation:section-in 420ms ease-out both}
#screen>*:nth-child(3){animation-delay:100ms}
@keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes section-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.apexcharts-text,.apexcharts-legend-text{font-family:"Open Sans",sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:4px!important;box-shadow:var(--shadow)!important}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 12px;gap:7px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 12px 0 2px;border:0}
  .brand-logo{width:36px;height:36px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:0}
  .nav button{min-height:40px;padding:8px 10px}
  .nav button.on::before{display:none}
  .nav .idx{display:none}
  .main{padding:18px 15px 42px}
  .topbar{align-items:center}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
}
@media(max-width:560px){
  body{font-size:12px}
  .main{padding:15px 12px 36px}
  .topbar{margin-bottom:14px;padding-bottom:14px}
  .topbar h1{font-size:17px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .nav button{min-width:42px;justify-content:center}
  .nav button .txt{display:none}
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr 1fr!important}
  .board{grid-template-columns:1fr}
  .tile{padding:12px}
  .tile .tv{font-size:21px}
  .card{padding:13px}
  th,td{padding:9px 10px}
}
@media(max-width:390px){
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr!important}
  .brand-txt{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">monitoring</span></div>
      <div class="brand-txt"><b>倉儲戰情室</b><span>WAREHOUSE COCKPIT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08/21 即時<br/>5 大構面 · 18 項 KPI<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>

function buildNav(){var n=document.getElementById("nav");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
