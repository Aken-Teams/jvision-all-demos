<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>倉儲 KPI 戰情室 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#3f4a5f; --accent2:#93a0b8; --accent-soft:#e8e9ec;
  --accent-soft2:#e8e9ec;
  --bg:#f8f9f9; --panel:#fff; --ink:#16171e; --muted:#7d8391;
  --line:#ecedef; --th:#f6f7f8; --hov:#f4f5f6; --track:#ecedef;
  --sidebar:#1b1f2b; --sidebar2:#2a3040; --side-edge:rgba(255,255,255,.06);
  --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#6366f1; --r:14px;
  --glow:rgba(63,74,95,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
h1,h2,h3,h4{font-family:"Noto Sans TC";margin:0}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 外框（側欄位置為變化點之一）── */
.app{display:flex;min-height:100vh}
.sidebar{width:242px;flex:none;min-width:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#eef2f7;display:flex;flex-direction:column;padding:22px 15px;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--side-edge)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 7px 20px;min-width:0}
.brand-logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px var(--glow)}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt b{display:block;font-family:"Noto Sans TC";font-weight:900;font-size:15.5px;letter-spacing:.4px}
.brand-txt span{font-size:10.5px;color:#96a0b2;letter-spacing:1.1px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;min-width:0;background:transparent;border:none;color:#c6ccd8;
  cursor:pointer;padding:10px 12px;border-radius:10px;font-family:"Noto Sans TC";font-size:13.5px;font-weight:500;
  text-align:left;transition:.15s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px var(--glow)}
.nav .idx{margin-left:auto;font-size:10.5px;opacity:.55;font-weight:700}
.side-foot{margin-top:auto;padding:13px 9px 2px;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px;color:#96a0b2;line-height:1.65}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:24px 28px 58px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:21px;font-weight:900;display:flex;align-items:center;gap:9px}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:25px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.avatar{width:33px;height:33px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none}

/* ── 版面 ── */
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)} .g23{grid-template-columns:2fr 1fr} .g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;min-width:0}
.sec{margin-bottom:15px}
.sec>h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:13px}
.sec>h3 .material-symbols-outlined{font-size:18px;color:var(--accent)}
.sec>p{margin:0 0 13px;font-size:13px;color:var(--muted);line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:13px;margin:0}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
@media(max-width:700px){.dl{grid-template-columns:1fr;gap:2px 0}.dl dt{margin-top:9px}}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.card-h h3 .material-symbols-outlined{font-size:18px;color:var(--accent)}
.card-h .hint{font-size:11.5px;color:var(--muted)}

/* KPI（兩種內容方言共用） */
.kpi,.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.kpi .ico{width:37px;height:37px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);position:relative;z-index:1}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{font-size:12px;color:var(--muted);margin-top:11px;font-weight:500;display:flex;align-items:center;gap:5px}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:3px;font-family:"Inter"}
.kpi .val small,.stat .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta,.stat .d{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.delta.up,.d.up{color:var(--ok)} .delta.down,.d.down{color:var(--bad)} .delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--th);letter-spacing:.3px;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hov)}
.mono{font-family:"Inter";font-weight:600;letter-spacing:.25px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d} .t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#ffe4e6;color:#be123c} .t-info{background:#e0e7ff;color:#4338ca}
.t-gray{background:#eef0f2;color:#64748b} .t-acc,.t-pink{background:var(--accent-soft);color:var(--accent)}

/* 進度 / 條 */
.bar{height:7px;border-radius:6px;background:var(--track);overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{font-size:11px;color:var(--muted);font-weight:600;width:38px;flex:none;text-align:right}

/* 時間軸（兩種方言） */
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)} .tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{font-size:11px;color:var(--muted);font-weight:600}
.tl-item b,.tl-i b{font-size:12.5px;display:block;margin:2px 0;font-family:"Noto Sans TC"}
.tl-item p,.tl-i p{margin:0;font-size:11.5px;color:var(--muted)}

/* 檢核列 */
.chk{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)} .chk .wait{color:var(--muted)} .chk .bad{color:var(--bad)} .chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0} .chk small{color:var(--muted);font-size:11px}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}

/* 看板 */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.board>*{min-width:0}
.col{background:var(--th);border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:9px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;font-family:"Noto Sans TC";padding:2px 4px 6px}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--muted)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;border-left:3px solid var(--accent)}
.pcard b{font-size:12.5px;font-family:"Noto Sans TC"}
.pcard .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink)}
.mini-av{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none}

/* 流程列 */
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.lane-row .num{width:31px;height:31px;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px;font-family:"Noto Sans TC"}
.lane-row .body p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#bbb;background:#fff;z-index:1}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .s.cur{border-color:var(--accent);color:var(--accent);animation:pulse 1.6s infinite}
.steps .ln.done{background:var(--accent)}

/* 量表列 */
.rep-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px dashed var(--line);min-width:0}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{font-size:13px;font-family:"Noto Sans TC";display:block}
.rep-row .sku span{font-size:11px;color:var(--muted)}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;border-radius:6px;background:var(--track);position:relative;overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.gauge small{font-size:10px;color:var(--muted);display:block;margin-top:3px;text-align:right}

/* 薪資帶 */
.band{position:relative;height:26px;border-radius:7px;background:var(--track);min-width:150px}
.band .rng{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:4px;background:var(--accent);box-shadow:0 2px 6px var(--glow)}

/* 磚 */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .ti{width:37px;height:37px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:14px;font-weight:800}
.tile p{margin:0;font-size:11.8px;color:var(--muted);line-height:1.6}
.tile .tv{font-size:22px;font-weight:800;font-family:"Inter";letter-spacing:-.4px}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.who{display:inline-flex;align-items:center;gap:6px}



/* KPI 收成左側 2×2 小卡，主圖佔右側大面積；第二張圖移到下方整排（不隱藏內容） */
#screen{display:grid;grid-template-columns:392px minmax(0,1fr);grid-auto-rows:min-content;gap:15px;align-items:start}
#screen > *{grid-column:1 / -1;margin-top:0!important}
#screen > .grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:12px;background:none!important;border:none!important;padding:0!important}
#screen > .grid.g4:first-child > *{flex:none!important;border-right:none!important;border-bottom:none!important;background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:var(--r)!important;padding:15px 16px!important}
#screen > .grid.g4:first-child > .tile .ti{width:34px;height:34px;overflow:visible;margin:0}
#screen > *:nth-child(2){grid-column:2;grid-row:1}
#screen > *:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen > *:nth-child(2) > .card:first-child{min-height:312px}
@media(max-width:1120px){#screen{grid-template-columns:minmax(0,1fr)}#screen > *,#screen > .grid.g4:first-child,#screen > *:nth-child(2){grid-column:1;grid-row:auto}}

.kpi,.stat,.tile{border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding-left:15px}
.kpi::after{display:none}
.kpi .ico{position:absolute;right:14px;top:14px;width:30px;height:30px;background:none;color:var(--accent-soft2)}
.kpi .ico .material-symbols-outlined{font-size:26px}
.kpi .lbl{margin-top:0}
.kpi .val,.stat .val{font-size:28px}
.tile{position:relative}
.tile .ti{position:absolute;right:13px;top:13px;width:30px;height:30px;border-radius:9px;background:none;color:var(--accent-soft2)}
.tile .ti .material-symbols-outlined{font-size:25px}
.tile .tv{font-size:26px}


@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:6px;border:none}
  .brand{padding:0 12px 0 4px} .side-foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0;flex:1}
  .nav button{padding:9px 12px} .nav .idx{display:none}
  .main{padding:20px 16px 46px}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.nav button .txt{display:none}.topbar h1{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">monitoring</span></div>
      <div class="brand-txt"><b>倉儲戰情室</b><span>WAREHOUSE COCKPIT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08/21 即時<br/>5 大構面 · 18 項 KPI<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

function mkArea(el,data,cats,name,x){push(el,{chart:Object.assign({},CB,{type:"area",height:_h(x,230)}),series:[{name:name,data:data}],

 var color=typeof a6==="string"?a6:"#3f4a5f", min=typeof a6==="number"?a6:undefined, h=_h(a7,230);

function mkDonut(el,labels,data,h){push(el,{chart:Object.assign({},CB,{type:"donut",height:_h(h,240)}),series:data,labels:labels,

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
