<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Customer Portal 客戶入口網站</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--panel:#ffffff;--line:#e2e8f0;--txt:#1e293b;--mut:#64748b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0284c7;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.brand-ic{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-ic .material-symbols-outlined{font-size:24px;}
.brand-t{min-width:0;}
.brand-t b{font-size:15px;font-weight:700;display:block;letter-spacing:.2px;}
.brand-t span{font-size:11px;color:var(--mut);}
nav{display:flex;flex-direction:column;gap:4px;}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 13px;border:none;background:transparent;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--mut);text-align:left;width:100%;transition:all .15s;min-width:0;}
.nav-btn:hover{background:var(--bg);color:var(--txt);}
.nav-btn.on{background:var(--accent);color:#fff;font-weight:600;}
.nav-btn .material-symbols-outlined{font-size:21px;flex-shrink:0;}
.nav-btn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);}
.side-foot .cust{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.side-foot .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.main{flex:1;min-width:0;padding:26px 30px 48px;}
.pg-head{margin-bottom:22px;}
.pg-head h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;}
.pg-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.pg-head p{color:var(--mut);font-size:13.5px;margin-top:5px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;}
.kpi .lb{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;}
.kpi .lb .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .vl{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.5px;}
.kpi .dl{font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:3px;}
.up{color:var(--ok);}.dn{color:var(--bad);}.fl{color:var(--mut);}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px;}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 19px;min-width:0;}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--mut);background:var(--bg);padding:3px 9px;border-radius:20px;}
.chwrap{position:relative;height:250px;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11.5px;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.b-ok{background:#dcfce7;color:#15803d;}.b-warn{background:#fef3c7;color:#b45309;}.b-bad{background:#fee2e2;color:#b91c1c;}.b-info{background:#e0f2fe;color:#0369a1;}.b-mut{background:#e2e8f0;color:#475569;}
.mono{font-family:'Inter',monospace;font-size:12.5px;color:var(--accent);font-weight:600;}
.prog{height:7px;background:var(--line);border-radius:6px;overflow:hidden;width:100px;display:inline-block;vertical-align:middle;}
.prog span{display:block;height:100%;background:var(--accent);border-radius:6px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.col{background:var(--bg);border-radius:12px;padding:12px;min-width:0;}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:9px;}
.tk:last-child{margin-bottom:0;}
.tk .t1{font-size:13px;font-weight:600;margin-bottom:5px;}
.tk .t2{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;}
.tk .t3{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mut);}
.tk .av2{width:22px;height:22px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-i{position:relative;padding-bottom:19px;}
.tl-i:last-child{padding-bottom:0;}
.tl-i::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--line);}
.tl-i.done::before{background:var(--ok);box-shadow:0 0 0 2px #bbf7d0;}
.tl-i.now::before{background:var(--info);box-shadow:0 0 0 2px #bae6fd;}
.tl-i .tt{font-size:13.5px;font-weight:600;}
.tl-i .td2{font-size:11.5px;color:var(--mut);margin-top:2px;}
.tl-i .tm{font-size:11px;color:var(--accent2);font-weight:600;margin-top:3px;}
.step{display:flex;align-items:center;gap:0;margin-bottom:20px;flex-wrap:wrap;}
.step-i{display:flex;align-items:center;gap:10px;padding:10px 15px;background:var(--panel);border:1px solid var(--line);border-radius:11px;font-size:13px;font-weight:600;min-width:0;}
.step-i .n{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.step-i.act{border-color:var(--accent);background:#f8fafc;}
.step-i.act .n{background:var(--accent);color:#fff;}
.step-i.ok .n{background:var(--ok);color:#fff;}
.step-a{color:var(--line);padding:0 5px;flex-shrink:0;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.fld{min-width:0;}
.fld label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--txt);}
.fld textarea{resize:vertical;min-height:78px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.btn.gh{background:var(--bg);color:var(--txt);border:1px solid var(--line);}
.doclist{display:flex;flex-direction:column;gap:10px;}
.doc{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;min-width:0;}
.doc .dic{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc .dtx{min-width:0;flex:1;}
.doc .dtx b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc .dtx span{font-size:11.5px;color:var(--mut);}
.doc .db{flex-shrink:0;}
.stat-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.stat-row:last-child{border-bottom:none;}
.stat-row .si{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);}
.stat-row .st{flex:1;min-width:0;}
.stat-row .st b{font-size:13.5px;}
.stat-row .st span{font-size:11.5px;color:var(--mut);display:block;}
.stat-row .sv{font-size:18px;font-weight:700;flex-shrink:0;}
.notif{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);}
.notif:last-child{border-bottom:none;}
.notif .ni{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif .nt2{min-width:0;flex:1;}
.notif .nt2 b{font-size:13px;font-weight:600;}
.notif .nt2 p{font-size:11.5px;color:var(--mut);margin-top:2px;}
.notif .nt2 time{font-size:10.5px;color:var(--accent2);}
@media(max-width:860px){
  .app{display:block;}
  .sidebar{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px 16px;gap:8px;}
  .brand{border-bottom:none;margin-bottom:0;padding:0 12px 0 0;border-right:1px solid var(--line);}
  nav{flex-direction:row;flex-wrap:wrap;flex:1;}
  .nav-btn{width:auto;padding:9px 12px;}
  .side-foot{display:none;}
  .main{padding:20px 18px 40px;}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr;}
  .grid2,.grid2b,.grid3{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
  .form-row{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav-btn .nt{display:none;}
  .nav-btn{padding:9px 11px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .pg-head h1{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-ic"><span class="material-symbols-outlined">storefront</span></div>
      <div class="brand-t"><b>客戶入口網站</b><span>Customer Portal</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="cust"><div class="av">宏</div><div><b style="font-size:12.5px;color:var(--txt)">宏鑫精密股份有限公司</b><div>客戶代碼 C-20418</div></div></div>
      <div>純 UI 展示，資料皆為擬真示範</div>
    </div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
var NAV=[
  {ic:"dashboard",t:"客戶入口首頁"},
  {ic:"receipt_long",t:"訂單查詢"},
  {ic:"monitoring",t:"出貨追蹤"},
  {ic:"description",t:"文件下載"},
  {ic:"request_quote",t:"線上詢價"},
  {ic:"insights",t:"自助成效分析"}
];
var chart=null;
function elId(id){return document.getElementById(id);}
function killChart(){if(chart){try{chart.destroy();}catch(e){}chart=null;}}
function head(ic,ti,su){return '<div class="pg-head"><h1><span class="material-symbols-outlined">'+ic+'</span>'+ti+'</h1><p>'+su+'</p></div>';}

/* ---------- Screen 0: 首頁 ---------- */
function s0(){
  var kp=[
    {lb:"進行中訂單",ic:"shopping_cart",vl:"12",dl:"本月新增 4 筆",cls:"up",di:"north_east"},
    {lb:"待出貨",ic:"local_shipping",vl:"5",dl:"其中 2 筆今日出貨",cls:"fl",di:"remove"},
    {lb:"待處理詢價",ic:"question_answer",vl:"3",dl:"平均回覆 6.1 小時",cls:"up",di:"north_east"},
    {lb:"本月自助率",ic:"touch_app",vl:"88%",dl:"較上月 +12%",cls:"up",di:"north_east"}
  ];
  var h=head("dashboard","客戶入口首頁","歡迎回來，宏鑫精密。以下為您近期訂單、出貨與待辦通知總覽。");
  h+='<div class="kpis">';
  kp.forEach(function(k){h+='<div class="kpi"><div class="lb"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lb+'</div><div class="vl">'+k.vl+'</div><div class="dl '+k.cls+'"><span class="material-symbols-outlined" style="font-size:14px">'+k.di+'</span>'+k.dl+'</div></div>';});
  h+='</div>';
  h+='<div class="grid2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">insert_chart</span>近半年訂單金額 (萬元)<span class="tag">2026 H1</span></h3><div class="chwrap" style="height:250px"><canvas id="c0"></canvas></div></div>';
  var no=[
    {ic:"local_shipping",bg:"#dcfce7",cl:"#15803d",b:"訂單 SO-260812 已出貨",p:"貨運單號 TW-88342190，預計 08/15 送達",t:"2 小時前"},
    {ic:"description",bg:"#e0f2fe",cl:"#0369a1",b:"合約文件已更新",p:"2026 年度供貨合約 v2 可供下載",t:"今天 09:20"},
    {ic:"reply",bg:"#fef3c7",cl:"#b45309",b:"詢價 RFQ-2609 已回覆",p:"業務已提供 CNC 治具報價，請查收",t:"昨天 16:40"},
    {ic:"payments",bg:"#e2e8f0",cl:"#475569",b:"發票 INV-260790 已開立",p:"金額 NT$ 428,000，付款期限 09/10",t:"08/11"}
  ];
  h+='<div class="card"><h3><span class="material-symbols-outlined">notifications</span>最新通知</h3>';
  no.forEach(function(n){h+='<div class="notif"><div class="ni" style="background:'+n.bg+';color:'+n.cl+'"><span class="material-symbols-outlined" style="font-size:19px">'+n.ic+'</span></div><div class="nt2"><b>'+n.b+'</b><p>'+n.p+'</p><time>'+n.t+'</time></div></div>';});
  h+='</div></div>';
  h+='<div class="grid3">';
  var qk=[
    {ic:"receipt_long",t:"查詢訂單",d:"檢視訂單明細與進度",i:1},
    {ic:"monitoring",t:"追蹤出貨",d:"即時物流狀態",i:2},
    {ic:"request_quote",t:"線上詢價",d:"提交新的需求",i:4}
  ];
  qk.forEach(function(q){h+='<div class="card" style="cursor:pointer" onclick="location.hash=\'go='+q.i+'\'"><div class="stat-row" style="border:none;padding:0"><div class="si"><span class="material-symbols-outlined">'+q.ic+'</span></div><div class="st"><b>'+q.t+'</b><span>'+q.d+'</span></div><span class="material-symbols-outlined" style="color:var(--accent2)">chevron_right</span></div></div>';});
  h+='</div>';
  elId("view").innerHTML=h;
  void elId("view").offsetHeight;
  killChart();
  var cv=elId("c0");
  if(cv){chart=new Chart(cv,{type:"bar",data:{labels:["1月","2月","3月","4月","5月","6月"],datasets:[{label:"訂單金額(萬)",data:[182,205,168,241,226,268],backgroundColor:"#334155",borderRadius:6,maxBarThickness:38}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:"#f1f5f9"}},x:{grid:{display:false}}}}});}
}

/* ---------- Screen 1: 訂單查詢 ---------- */
function s1(){
  var h=head("receipt_long","訂單查詢","自助查詢訂單明細、金額與生產進度，無需來電確認。");
  h+='<div class="grid3">';
  var st=[
    {lb:"全部訂單",vl:"37",ic:"list_alt"},
    {lb:"生產中",vl:"12",ic:"precision_manufacturing"},
    {lb:"已完成",vl:"20",ic:"task_alt"}
  ];
  st.forEach(function(s){h+='<div class="card"><div class="stat-row" style="border:none;padding:0"><div class="si"><span class="material-symbols-outlined">'+s.ic+'</span></div><div class="st"><b>'+s.lb+'</b></div><span class="sv">'+s.vl+'</span></div></div>';});
  h+='</div>';
  var rows=[
    {no:"SO-260812",dt:"2026-08-05",it:"CNC 精密治具 ×120",amt:"428,000",p:100,s:"已出貨",b:"b-ok"},
    {no:"SO-260798",dt:"2026-08-02",it:"鋁合金外殼 ×500",amt:"312,500",p:82,s:"生產中",b:"b-info"},
    {no:"SO-260771",dt:"2026-07-28",it:"不鏽鋼支架 ×800",amt:"196,000",p:60,s:"生產中",b:"b-info"},
    {no:"SO-260742",dt:"2026-07-22",it:"塑膠射出件 ×2000",amt:"88,400",p:35,s:"生產中",b:"b-info"},
    {no:"SO-260710",dt:"2026-07-15",it:"金屬沖壓件 ×1500",amt:"254,000",p:100,s:"已完成",b:"b-mut"},
    {no:"SO-260688",dt:"2026-07-08",it:"精密齒輪 ×300",amt:"510,000",p:100,s:"已完成",b:"b-mut"}
  ];
  h+='<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>訂單清單<span class="tag">共 6 筆</span></h3><div style="overflow-x:auto"><table><thead><tr><th>訂單編號</th><th>下單日期</th><th>品項</th><th>金額 (NT$)</th><th>生產進度</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><td><span class="mono">'+r.no+'</span></td><td>'+r.dt+'</td><td>'+r.it+'</td><td>'+r.amt+'</td><td><span class="prog"><span style="width:'+r.p+'%"></span></span> '+r.p+'%</td><td><span class="badge '+r.b+'">'+r.s+'</span></td></tr>';});
  h+='</tbody></table></div></div>';
  elId("view").innerHTML=h;
  void elId("view").offsetHeight;
  killChart();
}

/* ---------- Screen 2: 出貨追蹤 ---------- */
function s2(){
  var h=head("monitoring","出貨追蹤","即時追蹤出貨狀態與物流時程，掌握每批貨的每一步。");
  h+='<div class="grid2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">local_shipping</span>出貨 SO-260812 物流時程<span class="tag">運送中</span></h3>';
  var tl=[
    {c:"done",t:"訂單確認",d:"生產排程完成、備料入線",m:"2026-08-05 10:12"},
    {c:"done",t:"完工入庫",d:"品檢合格 120/120，入成品倉",m:"2026-08-10 15:40"},
    {c:"done",t:"揀貨包裝",d:"棧板 3 板、毛重 640 kg",m:"2026-08-12 09:05"},
    {c:"now",t:"運送中",d:"貨運單 TW-88342190，經台中轉運站",m:"2026-08-13 08:30"},
    {c:"",t:"預計送達",d:"宏鑫精密 台南廠收貨碼頭",m:"2026-08-15 (預計)"}
  ];
  h+='<div class="tl">';
  tl.forEach(function(x){h+='<div class="tl-i '+x.c+'"><div class="tt">'+x.t+'</div><div class="td2">'+x.d+'</div><div class="tm">'+x.m+'</div></div>';});
  h+='</div></div>';
  var sr=[
    {ic:"inventory_2",b:"待出貨批次",s:"排程 08/14-08/16",v:"5"},
    {ic:"local_shipping",b:"運送中",s:"3 家物流商",v:"3"},
    {ic:"where_to_vote",b:"本月已送達",s:"準時率 96%",v:"18"},
    {ic:"schedule",b:"平均運送天數",s:"較上季 -0.4 天",v:"2.3"}
  ];

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  SCREENS[i]();
  if(i===5){var c=elId("view");void c.offsetHeight;s5b();}
}
(function buildNav(){

  nv.innerHTML=h;
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
