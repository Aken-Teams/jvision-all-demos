<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Portal 客戶入口網站</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;
  --color-secondary:#3b82f6;--color-on-secondary:#000;
  --color-accent:#059669;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#0f172a;
  --color-card:#fff;--color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;--color-muted-foreground:#475569;
  --color-border:#e4ecfc;--color-destructive:#dc2626;
  --color-on-destructive:#fff;--color-ring:#2563eb;
  --blue:#2563eb;--ink:#0f172a;--muted:#475569;--line:#e4ecfc;
  --ok:#047857;--warn:#92400e;--bad:#b91c1c;--info:#1d4ed8;
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--color-background);color:var(--ink);font-family:"Fira Sans","Noto Sans TC",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,a,select,.upload{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#0f172a;color:#fff;border-right:4px solid var(--blue)}
.brand{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:12px;padding:22px 16px;border-bottom:1px solid #334155}
.brand-ic{width:48px;height:48px;display:grid;place-items:center;background:var(--blue);border:2px solid #fff}
.brand-ic span{font-size:27px}
.brand-t b{display:block;font-size:16px;line-height:1.25}
.brand-t span{display:block;margin-top:3px;color:#cbd5e1;font:11px "Fira Code",monospace;text-transform:uppercase;letter-spacing:.08em}
nav{display:flex;flex-direction:column;gap:5px;padding:14px 10px}
.nav-btn{width:100%;min-height:46px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:2px solid transparent;border-radius:0;background:transparent;color:#cbd5e1;text-align:left}
.nav-btn:hover{border-color:#64748b;color:#fff;background:#1e293b}
.nav-btn.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700;box-shadow:6px 6px 0 var(--blue)}
.nav-btn .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;padding:16px;border-top:1px solid #334155;color:#cbd5e1;font-size:11px}
.cust{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av,.av2{display:inline-grid;place-items:center;background:var(--color-accent);color:#fff;font-weight:700;border:2px solid currentColor}
.av{width:34px;height:34px}.av2{width:24px;height:24px;font-size:10px}
.customer-name{font-size:12px;color:#fff}
.main{min-width:0;padding:30px clamp(18px,3vw,46px) 56px}
#view{max-width:1440px;margin:auto;animation:reveal .36s ease-out both}
.pg-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;margin-bottom:22px;padding:0 0 16px;border-bottom:4px solid var(--ink)}
.pg-head:after{content:"CUSTOMER OPERATIONS";grid-column:2;grid-row:1/3;align-self:center;padding:7px 10px;background:var(--blue);color:#fff;font:600 11px "Fira Code",monospace;letter-spacing:.06em}
.pg-head h1{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(23px,2.4vw,34px);font-weight:700;letter-spacing:-.035em}
.pg-head h1 span{color:var(--blue);font-size:30px}
.pg-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.kpis,.grid2,.grid2b,.grid3,.board{display:grid;gap:14px;margin-bottom:18px}
.kpis{grid-template-columns:repeat(4,1fr)}
.grid2{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr)}
.grid2b{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.board{grid-template-columns:repeat(4,1fr)}
.card,.kpi{min-width:0;background:var(--color-card);border:2px solid var(--ink);border-radius:0;box-shadow:5px 5px 0 var(--line)}
.card{padding:18px}.kpi{padding:16px;border-top:7px solid var(--blue)}
.kpi:nth-child(even){transform:translateY(5px)}
.kpi .lb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .lb span{color:var(--blue);font-size:18px}
.kpi .vl,.sv{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.kpi .vl{margin-top:7px;font-size:29px;font-weight:700;letter-spacing:-.05em}
.kpi .dl{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11.5px;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--muted)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;padding-bottom:10px;border-bottom:2px solid var(--line);font-size:14px}
.card h3>span:first-child{color:var(--blue)}
.tag{margin-left:auto;padding:3px 7px;border:1px solid var(--ink);background:var(--color-muted);color:var(--ink);font:500 10px "Fira Code",monospace}
.chwrap{position:relative;width:100%;height:250px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:10px;border:1px solid var(--ink);background:#0f172a;color:#fff;text-align:left;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.03em}
td{padding:11px 10px;border:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:var(--color-muted)}
tbody tr:hover{background:#dbeafe}
td:nth-child(4),th:nth-child(4){text-align:right}
.mono,time{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{color:#1d4ed8;font-size:12px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;font-size:11px;font-weight:700;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;background:currentColor}
.b-ok{background:#d1fae5;color:#065f46}.b-warn{background:#fef3c7;color:#78350f}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}.b-mut{background:#e2e8f0;color:#334155}
.prog{display:inline-block;width:100px;height:9px;overflow:hidden;border:1px solid var(--ink);background:#fff;vertical-align:middle}
.prog span{display:block;height:100%;background:var(--blue)}
.stat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.si,.ni,.dic{display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--ink);background:var(--color-muted);color:var(--blue)}
.si{width:38px;height:38px}.ni{width:34px;height:34px}.dic{width:42px;height:42px}
.st,.dtx,.nt2{min-width:0;flex:1}
.st b,.dtx b,.nt2 b{font-size:13px}.st span,.dtx span,.nt2 p{display:block;color:var(--muted);font-size:11.5px}
.sv{font-size:19px;font-weight:700}
.notif{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}.notif p{margin:2px 0}.notif time{color:var(--muted);font-size:10px}
.quick{cursor:pointer}
.quick:hover{background:#eff6ff;box-shadow:8px 8px 0 var(--blue)}
.tl{position:relative;padding-left:29px}
.tl:before{content:"";position:absolute;left:8px;top:7px;bottom:7px;width:3px;background:var(--ink)}
.tl-i{position:relative;padding-bottom:19px}
.tl-i:last-child{padding-bottom:0}
.tl-i:before{content:"";position:absolute;left:-27px;top:2px;width:13px;height:13px;border:3px solid #fff;outline:2px solid var(--ink);background:#94a3b8}
.tl-i.done:before{background:var(--ok)}.tl-i.now:before{background:var(--blue)}
.tt{font-size:13px;font-weight:700}.td2{margin-top:2px;color:var(--muted);font-size:11.5px}.tm{margin-top:3px;color:#1d4ed8;font:600 11px "Fira Code",monospace}
.step{display:flex;align-items:center;gap:0;margin-bottom:20px;overflow-x:auto;padding:3px}
.step-i{display:flex;align-items:center;gap:9px;min-width:max-content;padding:9px 13px;border:2px solid var(--ink);background:#fff;font-size:12px;font-weight:700}
.step-i .n{width:25px;height:25px;display:grid;place-items:center;background:var(--color-muted);border:1px solid var(--ink);font:600 11px "Fira Code",monospace}
.step-i.ok .n{background:var(--ok);color:#fff}.step-i.act{background:#dbeafe;border-color:var(--blue)}.step-i.act .n{background:var(--blue);color:#fff}.step-a{padding:0 5px;color:var(--ink)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.fld label{display:block;margin-bottom:5px;color:var(--ink);font-size:11.5px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;padding:10px;border:2px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);font-size:13px}
.fld textarea{min-height:84px;resize:vertical}
.upload{padding:16px;border:2px dashed var(--ink);background:var(--color-muted);color:var(--muted);text-align:center;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 16px;border:2px solid var(--ink);border-radius:0;background:var(--color-accent);color:#fff;font-size:12px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn.gh{background:#fff;color:var(--ink)}
.doclist{display:flex;flex-direction:column;gap:9px}
.doc{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--ink);background:#fff}
.dtx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk{padding:11px;border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--line)}
.tk+.tk{margin-top:9px}.t1{margin-bottom:5px;font-size:13px;font-weight:700}.t2,.t3{display:flex;align-items:center;gap:7px}.t2{margin-bottom:7px;color:var(--muted);font-size:11px}.t3{justify-content:space-between;color:var(--muted);font-size:11px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.app{grid-template-columns:220px minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid2b{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.app{display:block}.sidebar{position:static;width:auto;height:auto;border-right:0;border-bottom:4px solid var(--blue)}.brand{padding:12px 14px}.brand-ic{width:40px;height:40px}nav{display:grid;grid-template-columns:repeat(3,1fr);padding:9px}.nav-btn{justify-content:center;padding:9px}.nav-btn.on{box-shadow:3px 3px 0 var(--blue)}.side-foot{display:none}.main{padding:20px 15px 40px}.pg-head{display:block}.pg-head:after{display:none}.grid3{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
@media(max-width:480px){nav{grid-template-columns:repeat(6,1fr);gap:2px}.nav-btn{min-width:0;padding:10px 4px}.nav-btn .nt{display:none}.kpis{grid-template-columns:1fr}.kpi:nth-child(even){transform:none}.card,.kpi{padding:14px}.board{grid-template-columns:1fr}.pg-head h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}#view{animation:none}.btn:hover{transform:none}}
</style>
</head>
