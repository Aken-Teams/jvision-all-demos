<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>公用設施戰情台 · Utility Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --panel2:#E9EFF8;
  --mut:#475569;
  --ok:#047857;
  --warn:#A63D00;
  --bad:#DC2626;
  --info:#0369A1;
}

*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  min-height:100vh;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
  font-size:15px;
  line-height:1.5;
}
button,a,[role="button"]{cursor:pointer}
button{font-family:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}

.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:stretch;
  gap:0;
  min-height:72px;
  padding:0;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:4px solid var(--ink);
}
.brand{
  display:flex;
  flex:0 0 310px;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:12px 20px;
  background:var(--ink);
  border-right:4px solid var(--ink);
}
.logo{
  display:grid;
  flex:none;
  width:44px;
  height:44px;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid var(--color-on-primary);
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-secondary);
}
.logo .material-symbols-outlined{color:#000;font-size:25px;font-weight:700}
.brand b{
  display:block;
  color:#FFF;
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:2px;
  color:#BFDBFE;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.13em;
}
.nav{
  display:flex;
  flex:1;
  align-items:stretch;
  justify-content:flex-end;
  gap:0;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-width:112px;
  min-height:68px;
  padding:10px 13px;
  color:#DBEAFE;
  background:transparent;
  border:0;
  border-left:1px solid rgba(255,255,255,.35);
  border-radius:0;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,box-shadow 180ms ease;
}
.nav button:hover{color:#FFF;background:#1D4ED8}
.nav button.on{
  color:#000;
  background:var(--color-accent);
  box-shadow:inset 0 -7px 0 #000;
}
.nav button.on .material-symbols-outlined{font-variation-settings:"FILL" 1}

.wrap{width:min(100%,1440px);margin:0 auto;padding:32px clamp(16px,3vw,42px) 52px}
.vh{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:18px;
  margin:0 0 24px;
  padding:22px 24px;
  color:#FFF;
  background:var(--ink);
  border:3px solid #000;
  box-shadow:9px 9px 0 var(--color-primary);
}
.vh h2{margin:0;color:#FFF;font-size:clamp(25px,3vw,40px);font-weight:700;line-height:1.08;letter-spacing:-.035em}
.vh p{max-width:760px;margin:8px 0 0;color:#CBD5E1;font-size:14px}
.live{
  max-width:380px;
  padding:9px 12px;
  color:#FFF;
  background:#065F46;
  border:2px solid #A7F3D0;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  text-align:right;
  white-space:normal;
}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
  position:relative;
  min-width:0;
  min-height:145px;
  padding:19px 18px 17px;
  overflow:hidden;
  color:var(--ink);
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.kpi:nth-child(even){transform:translateY(7px)}
.kpi::before{position:absolute;inset:0 auto 0 0;width:7px;background:var(--color-primary);content:""}
.kpi::after{position:absolute;right:-20px;bottom:-28px;width:84px;height:84px;background:var(--color-muted);border:2px solid var(--ink);content:"";transform:rotate(18deg)}
.kpi .l{position:relative;z-index:1;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.025em}
.kpi .v{position:relative;z-index:1;margin-top:8px;color:var(--ink);font-family:"Fira Code",monospace;font-size:clamp(25px,2.5vw,32px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{color:var(--muted)!important;font-family:"Fira Sans",sans-serif;font-weight:600}
.kpi .d{position:relative;z-index:1;margin-top:7px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;z-index:2;top:13px;right:13px;padding:5px;color:#FFF;background:var(--color-primary);border:2px solid var(--ink)}
.up{color:#047857}.dn{color:#B91C1C}

.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,.95fr)}
.g21{grid-template-columns:minmax(0,.95fr) minmax(0,1.3fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--line);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:-18px -18px 18px;
  padding:12px 14px;
  color:var(--ink);
  background:var(--color-muted);
  border-bottom:2px solid var(--ink);
  font-size:14px;
  font-weight:700;
  line-height:1.3;
}
.card h3 .material-symbols-outlined{padding:4px;color:#FFF;background:var(--color-primary);border:1px solid var(--ink)}
.card h3 .r{margin-left:auto}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#065F46;background:#D1FAE5}.t-ok::before{content:"✓ ";font-family:sans-serif}
.t-warn{color:#7C2D12;background:#FFEDD5}.t-warn::before{content:"! ";font-family:sans-serif}
.t-bad{color:#991B1B;background:#FEE2E2}.t-bad::before{content:"! ";font-family:sans-serif}
.t-info{color:#075985;background:#E0F2FE}.t-info::before{content:"i ";font-family:serif}
.t-run{color:#1E40AF;background:#DBEAFE}.t-run::before{content:"● ";font-family:sans-serif}

.scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);scrollbar-color:var(--color-primary) var(--color-muted)}
table.data,.mtx{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td,.mtx th,.mtx td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.data th,.mtx th{color:var(--ink);background:var(--color-muted);font-size:11px;font-weight:700;letter-spacing:.035em}
table.data th{text-align:left}
table.data td{color:var(--ink);text-align:left}
table.data td:first-child,table.data td:nth-child(5),.mtx td:not(:first-child){font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
table.data td:nth-child(5){text-align:right}
table.data td b{color:var(--ink);font-family:"Fira Code",monospace}
table.data tbody tr:nth-child(even) td,.mtx tr:nth-child(even) td{background:#F8FAFC}
table.data tr:hover td,.mtx tr:hover td{background:#EFF6FF}
.mtx{min-width:420px}.mtx th,.mtx td{text-align:right}.mtx th:first-child,.mtx td:first-child{text-align:left}
.cell{display:inline-block;min-width:46px;padding:4px 7px;color:#111827!important;border:1px solid #111827;border-radius:0;font-family:"Fira Code",monospace;font-size:11px;font-weight:700;text-align:right}

.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mtr{
  position:relative;
  min-width:0;
  padding:13px;
  background:#FFF;
  border:2px solid var(--line);
  border-radius:0;
}
.mtr:nth-child(3n+1){border-top:5px solid var(--color-primary)}
.mtr .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mtr .hd b{font-size:12px;font-weight:700;line-height:1.3}
.mtr .val{margin-top:9px;color:var(--ink);font-family:"Fira Code",monospace;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mtr .val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:10px;font-weight:600}
.mtr .sub{margin-top:4px;color:var(--muted);font-size:10.5px;text-align:right}
.dotpulse{width:11px;height:11px;flex:none;border:2px solid var(--ink);border-radius:0}

.lines{display:flex;flex-direction:column;gap:13px}
.lr{display:grid;grid-template-columns:100px minmax(90px,1fr) 74px;gap:11px;align-items:center}
.lr b{font-size:12px;font-weight:700}
.bar{height:17px;overflow:hidden;background:var(--color-muted);border:1px solid var(--ink);border-radius:0}
.bar i{display:block;height:100%;background:var(--color-primary);border-right:2px solid var(--ink);border-radius:0}
.lr small{font-family:"Fira Code",monospace;font-size:11px;font-weight:700;line-height:1.3;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink)!important;font-family:"Fira Code",monospace!important}
.dot{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);border-radius:0}

.alerts{display:flex;flex-direction:column;gap:10px}
.al{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:11px;
  align-items:start;
  padding:12px;
  background:#FFF7ED;
  border:2px solid var(--ink);
  border-left:8px solid #A63D00;
  border-radius:0;
}
.al.bad{background:#FEF2F2;border-left-color:var(--bad)}
.al.info{background:#F0F9FF;border-left-color:var(--info)}
.al.ok{background:#ECFDF5;border-left-color:var(--ok)}
.al .material-symbols-outlined{padding:4px;color:#7C2D12;background:#FFEDD5;border:1px solid currentColor;font-size:19px}
.al.bad .material-symbols-outlined{color:#991B1B;background:#FEE2E2}
.al.info .material-symbols-outlined{color:#075985;background:#E0F2FE}
.al.ok .material-symbols-outlined{color:#065F46;background:#D1FAE5}
.al b{font-size:12.5px;font-weight:700}
.al small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.al .tm{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right;white-space:nowrap}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;min-width:680px;padding:10px;background:var(--color-muted)}
.col{padding:10px;background:#F8FAFC;border:2px solid var(--ink);border-radius:0}
.col .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding-bottom:8px;color:var(--ink);border-bottom:2px solid var(--ink);font-size:12px;font-weight:700}
.col .ch .material-symbols-outlined{color:var(--color-primary)!important}
.col .cnt{min-width:25px;padding:1px 6px;color:#FFF;background:var(--ink);border-radius:0;font-family:"Fira Code",monospace;font-size:10px;text-align:center}
.tk{margin-bottom:10px;padding:10px;background:#FFF;border:1px solid var(--ink);border-top:5px solid var(--color-primary);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.tk .id{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.tk b{display:block;margin-top:5px;font-size:12px;font-weight:700;line-height:1.35}
.tk .m{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:10px}
.tk .m span:last-child{font-family:"Fira Code",monospace}
.prog{height:9px;margin-top:9px;overflow:hidden;background:var(--color-muted);border:1px solid var(--ink);border-radius:0}
.prog i{display:block;height:100%;background:var(--color-primary);border-right:1px solid var(--ink)}

.imp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ic2{min-width:0;padding:15px;background:#FFF;border:2px solid var(--ink);border-top:8px solid var(--color-primary);border-radius:0}
.ic2:nth-child(even){border-top-color:var(--color-accent)}
.ic2 b{color:var(--ink);font-size:12.5px;font-weight:700}
.ic2 .big{margin-top:7px;color:#1D4ED8;font-family:"Fira Code",monospace;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ic2 small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;text-align:right}

.gc{position:relative;min-width:0;padding:17px;background:#FFF;border:2px solid var(--ink);border-radius:0;box-shadow:6px 6px 0 var(--line)}
.gc::after{position:absolute;right:0;top:0;width:42px;height:12px;background:var(--color-accent);content:""}
.gc .gt{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:12px;font-weight:700}
.gc .gt .material-symbols-outlined{color:var(--color-primary)!important}
.gc .gv{margin-top:9px;color:var(--ink);font-family:"Fira Code",monospace;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.gc .gv small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:11px;font-weight:600}
.gc .gs{margin-top:4px;color:var(--muted);font-size:10.5px;text-align:right}
.chart{width:100%;min-height:1px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip{border:2px solid var(--ink)!important;border-radius:0!important;box-shadow:4px 4px 0 rgba(30,41,59,.22)!important}
.apexcharts-tooltip-title{background:var(--color-muted)!important;border-bottom:1px solid var(--ink)!important}

@media(max-width:1024px){
  .top{align-items:stretch;flex-wrap:wrap}
  .brand{flex:1 0 100%;border-right:0;border-bottom:2px solid #000}
  .nav{justify-content:flex-start;background:var(--color-primary)}
  .nav button{min-width:auto;min-height:54px;flex:1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meters,.imp{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .wrap{padding:24px 16px 40px}
  .vh{grid-template-columns:1fr;align-items:start;padding:19px;box-shadow:6px 6px 0 var(--color-primary)}
  .live{max-width:none;text-align:left}
  .g2,.g21,.g11,.g3{grid-template-columns:1fr}
  .kpi:nth-child(even){transform:none}
  .card{padding:15px}
  .card h3{margin:-15px -15px 15px}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .brand{padding:10px 14px}
  .brand b{font-size:14px}
  .nav button{min-width:52px;padding:9px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .wrap{padding:18px 12px 32px}
  .vh{margin-bottom:18px}
  .vh h2{font-size:27px}
  .kpis,.meters,.imp{grid-template-columns:1fr}
  .kpi{min-height:126px}
  .lr{grid-template-columns:82px minmax(70px,1fr) 68px;gap:7px}
  .al{grid-template-columns:auto minmax(0,1fr)}
  .al .tm{grid-column:2;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"><span class="material-symbols-outlined">water_drop</span></div><div><b>公用設施戰情台</b><span>UTILITY MANAGEMENT SYSTEM</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="live" id="live"></div></div>
  <div id="view"></div>
</main>
<script>
var MOD=[
["流量監控","water_drop","流量即時監控","用水/氣體/壓縮空氣流量即時採集與當班趨勢","● 即時監控 · 32 量測點 · 更新於 14:26"],
["洩漏偵測","sensors","洩漏偵測告警","夜間最小流量比對與異常流量洩漏判定","● 洩漏偵測引擎 · 4 件待處理告警"],
["分區分析","grid_view","分區用量分析","廠區/樓層/製程分區用量統計與排名","● 分區統計 · 本月累計用量彙整"],
["改善對策","build_circle","改善對策管理","改善工單派發、進度追蹤與驗收","● 改善工單看板 · 11 張處理中"],
["耗用績效","eco","單位耗用績效","單位產品用水量與節水成效追蹤","● 成效追蹤 · 近 6 週節水軌跡"],
["設施台帳","hub","設施設備台帳","水錶/閥件/幫浦資產與量測點台帳","● 設施台帳 · 128 項資產在管"]
];
var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd'),liveEl=document.getElementById('live');
MOD.forEach(function(m,i){var b=document.createElement('button');b.dataset.i=i;b.className=i===0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=function(){show(i);};nav.appendChild(b);});

/* ---- fake data ---- */
var METERS=[
["主進水總表","用水",412.8,"m³/h",430,"正常","t-ok"],
["純水系統 RO","用水",88.5,"m³/h",95,"正常","t-ok"],
["冷卻循環水","用水",176.2,"m³/h",160,"偏高","t-warn"],
["製程氮氣 N₂","氣體",1240,"Nm³/h",1300,"正常","t-ok"],
["壓縮空氣 CDA","氣體",2180,"Nm³/h",2100,"偏高","t-warn"],
["廢水回收","用水",64.3,"m³/h",70,"正常","t-ok"],
["消防備援水","用水",2.1,"m³/h",2,"正常","t-ok"],
["冷卻塔補水","用水",41.7,"m³/h",38,"洩漏疑慮","t-bad"]
