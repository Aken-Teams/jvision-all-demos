<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>公用設施戰情台 · Utility Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#4f46e5;--accent2:#818cf8;--bg:#0b1020;--panel:#141a30;--panel2:#1b2340;--line:#2a3357;--ink:#e8ecf8;--mut:#93a0c8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(79,70,229,.18),transparent 60%),var(--bg);color:var(--ink);min-height:100vh}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:rgba(12,16,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(79,70,229,.5)}
.logo .material-symbols-outlined{color:#fff;font-size:24px}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";color:#fff}
.brand span{font-size:10px;color:var(--accent2);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:1px solid transparent;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;min-width:0;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.45)}
.wrap{max-width:1320px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:#fff}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.live{background:rgba(52,211,153,.14);color:var(--ok);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;border:1px solid rgba(52,211,153,.3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.25),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:5px;font-family:Inter;color:#fff}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent2);opacity:.55}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .95fr}
.g21{grid-template-columns:.95fr 1.3fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 14px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:#fff}
.card h3 .material-symbols-outlined{color:var(--accent2)}
.card h3 .r{margin-left:auto}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:rgba(52,211,153,.16);color:var(--ok)}.t-warn{background:rgba(251,191,36,.16);color:var(--warn)}.t-bad{background:rgba(248,113,113,.16);color:var(--bad)}.t-info{background:rgba(56,189,248,.16);color:var(--info)}.t-run{background:rgba(129,140,248,.18);color:var(--accent2)}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--panel2)}
table.data td b{font-family:Inter;color:#fff}
table.data tr:hover td{background:rgba(79,70,229,.06)}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.meters>*{min-width:0}
.mtr{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--panel2)}
.mtr .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mtr .hd b{font-family:"Noto Sans TC";font-size:12.5px}
.mtr .val{font-family:Inter;font-weight:800;font-size:20px;margin-top:8px;color:#fff}
.mtr .val small{font-size:11px;color:var(--mut);font-weight:600}
.mtr .sub{font-size:11px;color:var(--mut);margin-top:2px}
.dotpulse{width:9px;height:9px;border-radius:50%;flex:none}
.lines{display:flex;flex-direction:column;gap:11px}
.lr{display:grid;grid-template-columns:96px 1fr 64px;gap:11px;align-items:center}
.lr b{font-size:12.5px;font-family:"Noto Sans TC"}
.bar{height:13px;background:var(--panel2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lr small{font-size:12px;font-weight:700;text-align:right;font-family:Inter;line-height:1.25}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.alerts{display:flex;flex-direction:column;gap:10px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:var(--panel2);border-radius:0 12px 12px 0;padding:11px 13px}
.al.bad{border-color:var(--bad)}.al.info{border-color:var(--info)}.al.ok{border-color:var(--ok)}
.al .material-symbols-outlined{font-size:20px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--info)}.al.ok .material-symbols-outlined{color:var(--ok)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.al .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none;text-align:right}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px}.kanban>*{min-width:0}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px}
.col .ch{display:flex;align-items:center;justify-content:space-between;font-family:"Noto Sans TC";font-size:12.5px;font-weight:700;margin-bottom:10px;color:#fff}
.col .cnt{background:var(--panel);border-radius:20px;font-size:11px;padding:1px 9px;color:var(--mut)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;border-top:3px solid var(--accent)}
.tk .id{font-family:Inter;font-size:10.5px;color:var(--accent2);font-weight:700}
.tk b{font-family:"Noto Sans TC";font-size:12.5px;display:block;margin-top:3px;line-height:1.35}
.tk .m{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:8px}
.prog{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.imp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.imp>*{min-width:0}
.ic2{border:1px solid var(--line);border-radius:13px;padding:14px;border-top:4px solid var(--accent);background:var(--panel2)}
.ic2 b{font-family:"Noto Sans TC";font-size:13px;color:var(--ink)}
.ic2 .big{font-family:Inter;font-weight:800;font-size:23px;color:var(--accent2);margin-top:5px}
.ic2 small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.mtx{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
.mtx th,.mtx td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.mtx th{color:var(--mut);font-weight:700;font-size:11px}
.mtx td:first-child,.mtx th:first-child{text-align:left;font-family:"Noto Sans TC"}
.cell{display:inline-block;min-width:42px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:11.5px;color:#0b1020;font-family:Inter}
.gc{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--panel2)}
.gc .gt{font-family:"Noto Sans TC";font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.gc .gv{font-family:Inter;font-weight:800;font-size:24px;color:#fff;margin-top:8px}
.gc .gv small{font-size:11px;color:var(--mut);font-weight:600}
.gc .gs{font-size:11px;color:var(--mut);margin-top:3px}
.chart{width:100%}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.imp{grid-template-columns:repeat(2,1fr)}.meters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g21,.g11,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.kpis,.meters,.imp{grid-template-columns:1fr}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
