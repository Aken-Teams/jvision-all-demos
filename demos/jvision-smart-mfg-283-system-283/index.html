<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業策略管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0f766e; --accent2:#5eead4; --accent-soft:#ccfbf1;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0ea5e9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter','Noto Sans TC',sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.layout{display:flex; min-height:100vh; align-items:stretch;}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--panel); border-right:1px solid var(--line);
  padding:22px 16px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; gap:12px; align-items:center; padding:4px 8px 18px; border-bottom:1px solid var(--line); margin-bottom:12px;}
.brand .logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,var(--accent),#0d9488); color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px; margin:0; font-weight:700; line-height:1.3;}
.brand p{font-size:11px; margin:2px 0 0; color:var(--muted);}
.nav{display:flex; flex-direction:column; gap:4px;}
.nav button{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:transparent; border:none; border-radius:10px; padding:11px 12px; cursor:pointer;
  color:var(--muted); font-family:inherit; font-size:13.5px; font-weight:500; min-width:0;
}
.nav button .material-symbols-outlined{font-size:21px; flex:0 0 auto;}
.nav button .txt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav button .num{margin-left:auto; font-size:11px; color:#94a3b8; font-weight:600;}
.nav button:hover{background:var(--bg); color:var(--ink);}
.nav button.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
.nav button.active .material-symbols-outlined{color:var(--accent);}
.side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:11px; color:var(--muted);}
.main{flex:1 1 auto; min-width:0; padding:26px 30px 60px;}
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
.topbar .ttl{min-width:0;}
.topbar h2{margin:0; font-size:21px; font-weight:700;}
.topbar .sub{margin:2px 0 0; font-size:13px; color:var(--muted);}
.pill{margin-left:auto; display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:12px; color:var(--muted); font-weight:500;}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);}

.grid{display:grid; gap:16px; min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0;}
.card h3{margin:0 0 4px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px; color:var(--accent);}
.card .cardsub{font-size:12px; color:var(--muted); margin:0 0 14px;}

.kpi .lbl{font-size:12.5px; color:var(--muted); font-weight:500;}
.kpi .val{font-size:27px; font-weight:700; margin:6px 0 2px; letter-spacing:-.5px;}
.kpi .delta{font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px;}
.kpi .delta.up{color:var(--ok);} .kpi .delta.down{color:var(--bad);} .kpi .delta.flat{color:var(--muted);}
.kpi .material-symbols-outlined{font-size:15px;}
.kpi.acc{background:linear-gradient(135deg,var(--accent),#0d9488); color:#fff; border:none;}
.kpi.acc .lbl{color:rgba(255,255,255,.85);}

.chart{width:100%; height:280px; overflow:hidden;}
.chart.sm{height:230px;}
.chart.lg{height:330px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
tbody tr:hover{background:var(--bg);}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600;}
.tag.g{background:#dcfce7;color:#15803d;} .tag.y{background:#fef3c7;color:#b45309;}
.tag.r{background:#fee2e2;color:#b91c1c;} .tag.b{background:#e0f2fe;color:#0369a1;}
.tag.n{background:#f1f5f9;color:#475569;} .tag.t{background:var(--accent-soft);color:var(--accent);}
.bar{height:7px; border-radius:4px; background:#e2e8f0; overflow:hidden; min-width:60px;}
.bar > i{display:block; height:100%; border-radius:4px; background:var(--accent);}

.swot{display:grid; grid-template-columns:1fr 1fr; gap:14px; min-width:0;}
.swot .q{border-radius:12px; padding:16px; border:1px solid var(--line); min-width:0;}
.swot .q h4{margin:0 0 10px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;}
.swot .q h4 .material-symbols-outlined{font-size:18px;}
.swot .q ul{margin:0; padding-left:18px; font-size:12.5px; color:#334155;}
.swot .q li{margin-bottom:6px;}
.swot .s{background:#f0fdf4;} .swot .s h4{color:#15803d;}
.swot .w{background:#fef2f2;} .swot .w h4{color:#b91c1c;}
.swot .o{background:#eff6ff;} .swot .o h4{color:#1d4ed8;}
.swot .t{background:#fffbeb;} .swot .t h4{color:#b45309;}

.board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; min-width:0;}
.col{background:var(--bg); border-radius:12px; padding:12px; min-width:0;}
.col .colh{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:10px; color:#334155;}
.col .colh .cnt{background:#fff; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--muted);}
.tk{background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:9px; padding:10px 11px; margin-bottom:9px;}
.tk .tt{font-size:12.5px; font-weight:600; margin-bottom:5px;}
.tk .meta{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

.tl{position:relative; padding-left:26px;}
.tl::before{content:""; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line);}
.tl .item{position:relative; padding-bottom:18px;}
.tl .item::before{content:""; position:absolute; left:-22px; top:3px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--accent);}
.tl .item.done::before{background:var(--accent);}
.tl .item.warn::before{border-color:var(--warn);}
.tl .item .th{font-size:13px; font-weight:600;}
.tl .item .dt{font-size:11px; color:var(--accent); font-weight:600; margin-top:2px;}

.scorerow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); min-width:0;}
.scorerow:last-child{border-bottom:none;}
.scorerow .nm{flex:1 1 auto; min-width:0; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis;}
.scorerow .barwrap{flex:0 0 120px; min-width:0;}
.scorerow .pc{flex:0 0 44px; text-align:right; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}

.mapgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; min-width:0;}
.perspective{background:var(--bg); border-radius:12px; padding:14px; min-width:0;}
.perspective .ph{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.objn{background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 10px; margin-bottom:8px; font-size:12px;}
.objn .on{font-weight:600; margin-bottom:4px;}
.objn .om{display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:11px;}

.slider-row{display:flex; align-items:center; gap:12px; margin-bottom:14px; min-width:0;}
.slider-row .sl{flex:0 0 120px; font-size:12.5px; font-weight:500; min-width:0;}
.slider-row input[type=range]{flex:1 1 auto; min-width:0; accent-color:var(--accent);}
.slider-row .sv{flex:0 0 54px; text-align:right; font-size:13px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}

.note{background:var(--accent-soft); border:1px solid #99f6e4; border-radius:10px; padding:12px 14px; font-size:12.5px; color:#0f766e; display:flex; gap:10px; align-items:flex-start;}
.note .material-symbols-outlined{font-size:19px; flex:0 0 auto;}

@media(max-width:860px){
  .layout{flex-direction:column;}
  .sidebar{width:auto; flex:none; height:auto; position:static; border-right:none; border-bottom:1px solid var(--line); flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 14px;}
  .brand{border-bottom:none; margin:0 14px 0 0; padding:0; flex:0 0 auto;}
  .nav{flex-direction:row; flex-wrap:wrap; gap:6px;}
  .nav button{width:auto;}
  .nav button .num{display:none;}
  .side-foot{display:none;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .swot{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
  .mapgrid{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:9px 11px;}
  .board{grid-template-columns:1fr;}
  .mapgrid{grid-template-columns:1fr;}
  .topbar h2{font-size:18px;}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div>
        <h1>企業策略管理系統</h1>
        <p>Strategy Management</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>總經理室 · 經營企劃部 · 事業處</div>
      <div style="margin-top:6px;">FY2026 策略週期 · v2.8</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="screen"></div>
  </main>
</div>

<script>
var MODULES=[
  {icon:"insights",name:"策略規劃與 SWOT",sub:"願景目標盤點與 SWOT/TOWS 分析"},
  {icon:"account_tree",name:"策略地圖與計分卡",sub:"四大構面策略目標與 KPI 對齊"},
  {icon:"task_alt",name:"策略專案與里程碑",sub:"策略專案立案與里程碑追蹤"},
  {icon:"science",name:"市場情境模擬",sub:"多情境營收與市佔敏感度模擬"},
  {icon:"request_quote",name:"資源配置",sub:"策略預算與人力資源分配"},
  {icon:"monitoring",name:"成效追蹤與檢討",sub:"準時完成率與策略投資報酬"}
];

var charts=[];
function disposeCharts(){
  for(var i=0;i<charts.length;i++){ try{charts[i].dispose();}catch(e){} }
  charts=[];
}
function mk(id){
  var el=document.getElementById(id);
  if(!el) return null;
  var c=echarts.init(el);
  charts.push(c);
  return c;
}
var teal="#0f766e", teal2="#14b8a6", tealL="#5eead4", axis="#94a3b8", split="#e2e8f0";
function baseGrid(){return{left:8,right:16,top:24,bottom:8,containLabel:true};}

/* ---------- SCREEN 0: 策略規劃與 SWOT ---------- */
function s0(){
  return '<div class="grid g4">'
    + kpi("策略議題","18","項","up","+3 本季")
    + kpi("已轉專案","11","項","up","61% 轉化率")
    + kpi("SWOT 因子","42","筆","flat","本週更新 6 筆")
    + kpiAcc("策略共識度","88","%","up","+6pp")
    + '</div>'
    + '<div class="grid g23" style="margin-top:16px;">'
      + '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>SWOT / TOWS 分析矩陣</h3>'
        + '<p class="cardsub">總經理室與經營企劃部共同盤點內外部因子</p>'
        + '<div class="swot">'
          + swotQ("s","trending_up","優勢 Strengths",["自有品牌區域市佔第一","毛利率高於同業 4.2pp","智慧產線稼動率 91%","通路關係穩固逾 15 年"])
          + swotQ("w","trending_down","劣勢 Weaknesses",["新產品開發週期偏長","海外據點覆蓋不足","數位轉型人才缺口","單一大客戶營收占 28%"])
          + swotQ("o","lightbulb","機會 Opportunities",["東南亞需求年增 12%","綠色供應鏈政策紅利","高階客製市場開放","AI 服務化商業模式"])
          + swotQ("t","warning","威脅 Threats",["原物料價格波動加劇","低價競品快速進入","匯率與關稅不確定","客戶自建供應鏈"])
        + '</div></div>'
      + '<div class="card"><h3><span class="material-symbols-outlined">insights</span>內外部能力雷達</h3>'
        + '<p class="cardsub">相對主要競爭者的六大能力評分</p>'
        + '<div id="c0a" class="chart"></div></div>'
    + '</div>'
    + '<div class="card" style="margin-top:16px;"><h3><span class="material-symbols-outlined">rule</span>TOWS 策略選項（交叉推導）</h3>'
      + '<p class="cardsub">由 SWOT 因子交叉產生的候選策略與優先評分</p>'
      + '<div style="overflow-x:auto"><table><thead><tr><th>策略選項</th><th>類型</th><th>對應構面</th><th class="num">吸引力</th><th class="num">可行性</th><th>建議</th></tr></thead><tbody>'
        + towsRow("拓展東南亞高階客製市場","SO","財務/顧客",92,74,"g","優先立案")
        + towsRow("導入 AI 服務化訂閱模式","SO","顧客/流程",88,68,"g","優先立案")
        + towsRow("縮短新品開發週期至 9 個月","WO","流程/學習",81,71,"y","規劃中")
        + towsRow("建立第二供應來源分散風險","ST","流程",76,83,"y","規劃中")
        + towsRow("降低單一大客戶依賴度","WT","財務/顧客",70,58,"r","觀察")
      + '</tbody></table></div></div>';
}
function swotQ(cls,ic,t,items){
  var li="";for(var i=0;i<items.length;i++){li+="<li>"+items[i]+"</li>";}
  return '<div class="q '+cls+'"><h4><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h4><ul>'+li+'</ul></div>';
}
function towsRow(n,tp,per,a,f,cls,rec){
  return '<tr><td style="white-space:normal">'+n+'</td><td><span class="tag t">'+tp+'</span></td><td>'+per+'</td><td class="num">'+a+'</td><td class="num">'+f+'</td><td><span class="tag '+cls+'">'+rec+'</span></td></tr>';
}
function d0(){
  var c=mk("c0a"); if(!c)return;
  c.setOption({
    tooltip:{},
    radar:{indicator:[
      {name:"品牌力",max:100},{name:"成本",max:100},{name:"創新",max:100},
      {name:"通路",max:100},{name:"數位",max:100},{name:"人才",max:100}
    ],radius:"64%",center:["50%","46%"],axisName:{color:"#475569",fontSize:11},splitLine:{lineStyle:{color:split}},splitArea:{areaStyle:{color:["#f8fafc","#fff"]}}},
    legend:{bottom:0,textStyle:{fontSize:11,color:axis}},
    series:[{type:"radar",data:[
      {value:[88,82,64,86,58,62],name:"本公司",areaStyle:{color:"rgba(15,118,110,.25)"},lineStyle:{color:teal},itemStyle:{color:teal}},
      {value:[72,90,76,68,80,74],name:"主要競爭者",areaStyle:{color:"rgba(148,163,184,.15)"},lineStyle:{color:axis},itemStyle:{color:axis}}
    ]}]
  });
}

/* ---------- SCREEN 1: 策略地圖與計分卡 ---------- */
function s1(){
  return '<div class="note"><span class="material-symbols-outlined">account_tree</span><div>策略地圖以「財務 → 顧客 → 內部流程 → 學習成長」四大構面串接因果，平衡計分卡追蹤各策略目標達成率並對齊 KPI。</div></div>'
    + '<div class="card" style="margin-top:16px;"><h3><span class="material-symbols-outlined">account_tree</span>平衡計分卡策略地圖</h3>'
      + '<p class="cardsub">FY2026 策略目標與即時達成率</p>'
      + '<div class="mapgrid">'
        + persp("trending_up","財務構面",[["提升營業利益率","EBIT 14.2% / 15%",95],["策略投資報酬","ROI 18.6% / 20%",93]])
        + persp("groups","顧客構面",[["核心客戶滿意度","91 / 92",99],["高階市占提升","23% / 28%",82]])
        + persp("account_tree","內部流程",[["新品開發週期","11.2 / 9 個月",78],["供應鏈韌性指數","84 / 90",93]])
        + persp("school","學習成長",[["數位人才覆蓋率","62% / 80%",78],["策略共識度","88% / 90%",98]])
      + '</div></div>'
    + '<div class="grid g2" style="margin-top:16px;">'
      + '<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>四大構面加權達成率</h3>'
        + '<p class="cardsub">依權重彙總的構面績效</p>'
        + '<div id="c1a" class="chart sm"></div></div>'
      + '<div class="card"><h3><span class="material-symbols-outlined">checklist</span>KPI 對齊清單</h3>'
        + '<p class="cardsub">策略目標與衡量指標達成狀態</p>'
        + scoreRow("營業利益率",95)+scoreRow("高階市占率",82)+scoreRow("新品開發週期",78)+scoreRow("數位人才覆蓋",78)+scoreRow("策略共識度",98)
      + '</div>'
    + '</div>';
}
function persp(ic,t,objs){
  var body="";
  for(var i=0;i<objs.length;i++){
    var o=objs[i];
    var col=o[2]>=90?"#15803d":o[2]>=75?"#b45309":"#b91c1c";
    body+='<div class="objn"><div class="on">'+o[0]+'</div><div class="om"><span>'+o[1]+'</span><span style="color:'+col+';font-weight:700">'+o[2]+'%</span></div></div>';
  }
  return '<div class="perspective"><div class="ph"><span class="material-symbols-outlined" style="font-size:16px">'+ic+'</span>'+t+'</div>'+body+'</div>';
}
function scoreRow(n,pc){
  var col=pc>=90?teal:pc>=75?"#d97706":"#dc2626";
  return '<div class="scorerow"><span class="nm">'+n+'</span><span class="barwrap"><span class="bar"><i style="width:'+pc+'%;background:'+col+'"></i></span></span><span class="pc">'+pc+'%</span></div>';
}
function d1(){
  var c=mk("c1a"); if(!c)return;
  c.setOption({
    grid:baseGrid(),
    tooltip:{trigger:"axis"},

        {name:"實際 ROI",type:"bar",data:[21,17,24,14,19],barWidth:"40%",itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:tealL},{offset:1,color:teal}]),borderRadius:[5,5,0,0]}},
        {name:"目標",type:"line",data:[20,20,20,20,20],lineStyle:{color:"#94a3b8",type:"dashed",width:2},itemStyle:{color:"#94a3b8"},symbol:"none"}
      ]
    });
  }
}

/* ---------- shared component builders ---------- */
function kpi(lbl,val,unit,dir,delta){
  var arrow=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
  return '<div class="card kpi"><div class="lbl">'+lbl+'</div>'
    +'<div class="val">'+val+'<span style="font-size:14px;font-weight:600;color:var(--muted)"> '+unit+'</span></div>'
    +'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+arrow+'</span>'+delta+'</div></div>';
}
function kpiAcc(lbl,val,unit,dir,delta){
  var arrow=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
  return '<div class="card kpi acc"><div class="lbl">'+lbl+'</div>'
    +'<div class="val">'+val+'<span style="font-size:14px;font-weight:600"> '+unit+'</span></div>'
    +'<div class="delta '+dir+'" style="color:#fff"><span class="material-symbols-outlined">'+arrow+'</span>'+delta+'</div></div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeCharts();
  c3aRef=null;
  var m=MODULES[i];
  var tb=document.getElementById("topbar");
  tb.innerHTML='<div class="ttl"><h2>'+m.name+'</h2><p class="sub">'+m.sub+'</p></div>'
    +'<span class="pill"><span class="dot"></span>FY2026 策略週期</span>';
  var sc=document.getElementById("screen");
  sc.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i); }
  void sc.offsetHeight;
  DRAW[i]();
}

(function initNav(){
  var nav=document.getElementById("nav");
  var html="";
  for(var i=0;i<MODULES.length;i++){
    html+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="txt">'+MODULES[i].name+'</span><span class="num">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=html;
})();

window.addEventListener("resize",function(){ for(var i=0;i<charts.length;i++){ try{charts[i].resize();}catch(e){} } });

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
