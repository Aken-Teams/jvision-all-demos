<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>財務報表自動化系統（Financial Reporting Automation / Close System）｜Jvision Demo</title>
<meta name="description" content="月結任務、傳票試算、帳戶調節、三大報表到揭露封存的財務結帳一站式平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --ok:#4ADE80;
  --okbg:rgba(34,197,94,.13);
  --warn:#FBBF24;
  --warnbg:rgba(245,158,11,.14);
  --bad:#F87171;
  --badbg:rgba(239,68,68,.14);
  --info:#7DD3FC;
  --infobg:rgba(14,165,233,.14);
  --panel:#0E1223;
  --soft:#1A1E2F;
  --shadow:0 18px 48px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:
    radial-gradient(circle at 82% 0,rgba(34,197,94,.07),transparent 28rem),
    var(--color-background);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-size:20px;
}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:256px;
  flex:0 0 256px;
  background:rgba(14,18,35,.96);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  z-index:5;
  backdrop-filter:blur(18px);
}
.brand{padding:23px 20px 19px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:12px}
.brand .mk{
  width:38px;
  height:38px;
  border:1px solid rgba(74,222,128,.45);
  border-radius:7px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 24px rgba(34,197,94,.16);
}
.brand .mk .material-symbols-outlined{font-size:21px}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em}
.brand p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.period{
  margin:16px 14px 7px;
  background:linear-gradient(145deg,rgba(30,41,59,.86),rgba(14,18,35,.92));
  border:1px solid var(--line);
  border-radius:8px;
  padding:13px;
}
.period .k{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.period .v{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;margin-top:3px}
.nav{padding:11px 10px 18px;display:flex;flex-direction:column;gap:3px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:43px;
  text-align:left;
  border:1px solid transparent;
  background:transparent;
  color:#CBD5E1;
  padding:9px 11px;
  border-radius:6px;
  font-size:13px;
  font-weight:500;
  transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease;
}
.nav button .idx{
  width:18px;
  flex:0 0 18px;
  color:#64748B;
  font:500 10px/1 "IBM Plex Sans",sans-serif;
  letter-spacing:.05em;
}
.nav button .material-symbols-outlined{font-size:19px;color:#94A3B8}
.nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:var(--soft);border-color:var(--line);color:#FFFFFF;transform:translateX(2px)}
.nav button.active{
  background:rgba(34,197,94,.12);
  border-color:rgba(74,222,128,.42);
  color:#FFFFFF;
}
.nav button.active::before{
  content:"";
  position:absolute;
  left:-1px;
  top:8px;
  bottom:8px;
  width:3px;
  background:var(--color-accent);
  border-radius:0 3px 3px 0;
}
.nav button.active .material-symbols-outlined{color:var(--color-accent)}
.nav button.active .idx{color:#86EFAC}
.side-foot{
  margin-top:auto;
  padding:15px 18px;
  border-top:1px solid var(--line);
  font-size:10px;
  color:#94A3B8;
  letter-spacing:.04em;
}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{
  min-height:73px;
  background:rgba(2,6,23,.78);
  border-bottom:1px solid var(--line);
  padding:13px 26px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:4;
  backdrop-filter:blur(16px);
}
.topbar .tt{min-width:0}
.topbar h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.topbar p{margin:1px 0 0;font-size:11px;color:var(--muted);letter-spacing:.05em}
.topbar .sp{flex:1 1 auto}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:5px 10px;
  border-radius:5px;
  font-size:11px;
  font-weight:500;
  background:var(--soft);
  border:1px solid var(--line);
  color:#CBD5E1;
}
.content{padding:22px 26px 42px;min-width:0}
.grid{display:grid;gap:13px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.4fr)}
.card{
  background:linear-gradient(145deg,rgba(18,23,43,.98),rgba(14,18,35,.98));
  border:1px solid var(--line);
  border-radius:8px;
  padding:15px;
  min-width:0;
  box-shadow:0 1px 0 rgba(255,255,255,.025);
  transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.card:hover{border-color:#475569;transform:translateY(-2px);box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 3px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--color-accent)}
.card .sub{font-size:11px;color:var(--muted);margin:0 0 13px}
.kpi{position:relative;overflow:hidden;min-height:126px}
.kpi::after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:-38px;
  width:98px;
  height:98px;
  border:1px solid rgba(74,222,128,.12);
  border-radius:50%;
}
.kpi .lbl{
  font-size:11px;
  color:#CBD5E1;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:7px;
}
.kpi .num{
  font-size:27px;
  line-height:1.2;
  font-weight:600;
  letter-spacing:-.04em;
  margin-top:10px;
  color:#FFFFFF;
  font-variant-numeric:tabular-nums;
}
.kpi .num small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .foot{font-size:10.5px;margin-top:7px;display:flex;align-items:center;gap:5px;color:#AAB8CC}
.up{color:var(--ok)}.down{color:var(--bad)}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10px;
  line-height:1.4;
  font-weight:600;
  white-space:nowrap;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-ok{background:var(--okbg);color:#86EFAC;border-color:rgba(74,222,128,.25)}
.t-warn{background:var(--warnbg);color:#FCD34D;border-color:rgba(251,191,36,.25)}
.t-bad{background:var(--badbg);color:#FCA5A5;border-color:rgba(248,113,113,.25)}
.t-info{background:var(--infobg);color:#BAE6FD;border-color:rgba(125,211,252,.24)}
.t-mut{background:var(--soft);color:#CBD5E1;border-color:var(--line)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid rgba(51,65,85,.72);white-space:nowrap}
th{
  font-size:10px;
  color:#CBD5E1;
  font-weight:600;
  letter-spacing:.06em;
  background:#171C2D;
}
td{color:#E2E8F0}
tbody tr{transition:background-color .2s ease}
tbody tr:hover{background:rgba(51,65,85,.22)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
}
.chartbox{width:100%;overflow:hidden;min-width:0}
.bar{height:7px;background:#293248;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--color-accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:9px;min-width:720px}
.col{background:#0A0F20;border:1px solid var(--line);border-radius:6px;padding:9px;min-width:0}
.col h4{margin:0 0 9px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:var(--soft);border:1px solid var(--line);border-radius:3px;font-size:10px;padding:1px 7px;color:#CBD5E1}
.tk{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:5px;
  padding:9px;
  margin-bottom:7px;
  transition:border-color .2s ease,transform .2s ease;
}
.tk:hover{border-color:#64748B;transform:translateY(-1px)}
.tk:last-child{margin-bottom:0}
.tk .tn{font-size:11.5px;font-weight:500}
.tk .meta{font-size:10px;color:#A8B5C8;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.av{
  width:21px;
  height:21px;
  border-radius:4px;
  background:#283449;
  border:1px solid #475569;
  color:#F8FAFC;
  font:600 9px/1 "IBM Plex Sans",sans-serif;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.tl{position:relative;padding-left:3px}
.tl .row{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl .row:last-child{border-bottom:0}
.tl .dot{flex:0 0 10px;width:10px;height:10px;border-radius:2px;margin-top:4px;background:#64748B;box-shadow:0 0 0 3px var(--soft)}
.tl .row.done .dot{background:var(--ok)}
.tl .row.late .dot{background:var(--bad)}
.tl .tx{min-width:0}
.tl .tx .h{font-size:11.5px;font-weight:500}
.tl .tx .m{font-size:10px;color:var(--muted);margin-top:2px}
.match{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:stretch;min-width:0}
.mside{background:#0A0F20;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.mside .mh{padding:9px 11px;font-size:11px;font-weight:600;background:#171C2D;border-bottom:1px solid var(--line)}
.mrow{padding:9px 11px;border-bottom:1px solid var(--line);font-size:11px;display:flex;justify-content:space-between;gap:8px}
.mrow:last-child{border-bottom:0}
.mrow .amt{font-weight:600;font-variant-numeric:tabular-nums}
.mconn{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--color-accent)}
.mconn .material-symbols-outlined{font-size:18px}
.stmt tr td:first-child{font-weight:500}
.stmt .sec td{background:var(--soft);font-weight:600;color:#86EFAC}
.stmt .sub td:first-child{padding-left:25px;color:#CBD5E1;font-weight:400}
.stmt .tot td{border-top:2px solid var(--color-accent);font-weight:700;color:#FFFFFF}
.steps{display:flex;gap:8px;min-width:700px}
.step{
  flex:1 1 120px;
  min-width:0;
  background:#0A0F20;
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px;
  position:relative;
}
.step:not(:last-child)::after{
  content:"";
  position:absolute;
  top:22px;
  right:-9px;
  width:8px;
  height:1px;
  background:#64748B;
}
.step .st{font-size:10px;font-weight:600;color:#A8B5C8;display:flex;align-items:center;gap:5px}
.step .sn{font-size:12px;font-weight:600;margin-top:8px}
.step .sd{font-size:10px;color:var(--muted);margin-top:3px}
.step.pass{border-color:rgba(74,222,128,.4);background:rgba(34,197,94,.07)}
.step.pass .st{color:#86EFAC}
.step.now{border-color:var(--color-accent);box-shadow:inset 3px 0 0 var(--color-accent)}
.step.now .st{color:#86EFAC}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:#A8B5C8;margin-top:10px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.ratio{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ratio:last-child{border-bottom:0}
.ratio .rn{flex:0 0 105px;font-size:11.5px;font-weight:500;min-width:0}
.ratio .rbar{flex:1 1 auto;min-width:0}
.ratio .rv{flex:0 0 62px;text-align:right;font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:14px 0}
.hint{
  font-size:10.5px;
  line-height:1.55;
  color:#CBD5E1;
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:11px;
  padding:9px 10px;
  background:var(--soft);
  border-left:3px solid #64748B;
}
.content>.grid>.card,.content>.card{animation:card-in .4s cubic-bezier(.2,.8,.2,1) both}
.content>.grid>.card:nth-child(2){animation-delay:.05s}
.content>.grid>.card:nth-child(3){animation-delay:.1s}
.content>.grid>.card:nth-child(4){animation-delay:.15s}
@keyframes card-in{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.apexcharts-text{fill:#CBD5E1!important;font-family:"IBM Plex Sans",sans-serif!important}
.apexcharts-legend-text{color:#CBD5E1!important}
.apexcharts-gridline{stroke:#334155}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  background:#0E1223!important;
  color:#F8FAFC!important;
  border:1px solid #475569!important;
  box-shadow:0 12px 30px rgba(0,0,0,.32)!important;
}
.apexcharts-tooltip-title{background:#1A1E2F!important;border-bottom:1px solid #475569!important}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .layout{display:block}
  .sidebar{width:auto;flex:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:16px;border-bottom:1px solid var(--line)}
  .period{display:none}
  .nav{flex-direction:row;flex-wrap:nowrap;gap:5px;padding:9px 10px;overflow-x:auto}
  .nav button{width:auto;flex:0 0 auto;min-height:42px}
  .side-foot{display:none}
  .topbar{position:static;padding:12px 16px}
  .content{padding:17px 16px 34px}
}
@media(max-width:768px){
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .match{grid-template-columns:1fr}
  .mconn{flex-direction:row;padding:7px 0}
  .mconn .material-symbols-outlined{transform:rotate(90deg)}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr}
  .topbar .pill{display:none}
  .topbar h2{font-size:17px}
  .nav button .lbl{display:none}
  .nav button{padding:9px 12px}
  .content{padding-inline:12px}
  .card{padding:13px}
  .kpi{min-height:114px}
  .kpi .num{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .content>.grid>.card,.content>.card{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mk"><span class="material-symbols-outlined">account_balance</span></div>
        <div>
          <h1>Close System</h1>
          <p>財務報表自動化</p>
        </div>
      </div>
    </div>
    <div class="period">
      <div class="k">結帳期間</div>
      <div class="v"><span class="material-symbols-outlined" style="font-size:18px">calendar_month</span>2026 年 07 月結</div>
      <div class="k" style="margin-top:9px">距截止</div>
      <div class="v" style="color:var(--warn)"><span class="material-symbols-outlined" style="font-size:18px">timer</span>2 天 06 小時</div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">Jvision Demo · 純前端展示<br />資料皆為模擬</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scr-title">結帳任務清單</h2>
        <p id="scr-sub">Close Checklist</p>
      </div>
      <div class="sp"></div>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">groups</span>財會 · 出納 · 財務長</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span>ERP / 銀行整合</span>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var NAV=[
  {icon:"checklist",t:"結帳任務清單",s:"Close Checklist"},
  {icon:"receipt_long",t:"傳票拋轉與試算",s:"Journals & Trial Balance"},
  {icon:"rule",t:"帳戶調節",s:"Account Reconciliation"},
  {icon:"description",t:"三大報表編製",s:"Financial Statements"},
  {icon:"fact_check",t:"分層覆核簽核",s:"Review & Approval"},
  {icon:"insights",t:"揭露與封存",s:"Disclosure & Period Close"}
];
var charts=[];
var reducedMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function chartBase(type,height){
  return{type:type,height:height,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:!reducedMotion,speed:420}};
}
var view=el("view");
var nav=el("nav");
var nh="";
for(var i=0;i<NAV.length;i++){

  void view.offsetHeight;
  var o={chart:chartBase("radar",300),series:[{name:"上期",data:[70,62,58,66,60]},{name:"本期",data:[82,68,74,72,68]}],
    colors:["#64748B","#22C55E"],stroke:{width:2},fill:{opacity:.13},markers:{size:3},
    xaxis:{categories:["獲利性","流動性","成長性","償債力","營運效率"],labels:{style:{fontSize:"10px",colors:["#CBD5E1","#CBD5E1","#CBD5E1","#CBD5E1","#CBD5E1"]}}},
    yaxis:{show:false,max:100},legend:{position:"top",fontSize:"10px",labels:{colors:"#CBD5E1"}},
    plotOptions:{radar:{polygons:{strokeColors:"#334155",connectorColors:"#334155",fill:{colors:["#0E1223","#1A1E2F"]}}}}};
  charts.push(new ApexCharts(el("c5a"),o));charts[charts.length-1].render();
}

function kpi(icon,lbl,num,unit,dir,foot){
  var arrow=dir==="up"?'<span class="up"><span class="material-symbols-outlined" style="font-size:14px">arrow_upward</span></span>':(dir==="down"?'<span class="down"><span class="material-symbols-outlined" style="font-size:14px">arrow_downward</span></span>':"");
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">'+icon+'</span>'+esc(lbl)+'</div>'+
    '<div class="num">'+esc(num)+(unit?'<small>'+esc(unit)+'</small>':"")+'</div><div class="foot">'+arrow+esc(foot)+'</div></div>';
}
function tlRow(cls,h,m){return '<div class="row '+cls+'"><span class="dot"></span><div class="tx"><div class="h">'+esc(h)+'</div><div class="m mono">'+esc(m)+'</div></div></div>';}
function rrow(n,a,age,tag,st){return '<tr><td>'+esc(n)+'</td><td class="num">'+money(a)+'</td><td class="mono">'+esc(age)+'</td><td><span class="tag '+tag+'">'+esc(st)+'</span></td></tr>';}
function srow(n,a,lvl){
  var v=(a<0?"-":"")+money(Math.abs(a));
  var rc=lvl===3?"tot":(lvl===0?"sub":"");
  return '<tr class="'+rc+'"><td>'+esc(n)+'</td><td class="num">'+v+'</td></tr>';
}
function step(state,icon,name,desc){
  return '<div class="step '+state+'"><div class="st"><span class="material-symbols-outlined" style="font-size:15px">'+icon+'</span>'+(state==="pass"?"已通過":(state==="now"?"進行中":"待處理"))+'</div><div class="sn">'+esc(name)+'</div><div class="sd">'+esc(desc)+'</div></div>';
}
function arow(n,who,op,tag,st){return '<tr><td>'+esc(n)+'</td><td class="mono">'+esc(who)+'</td><td>'+esc(op)+'</td><td><span class="tag '+tag+'">'+esc(st)+'</span></td></tr>';}
function ratio(n,v,pct){return '<div class="ratio"><div class="rn">'+esc(n)+'</div><div class="rbar"><div class="bar"><i style="width:'+Math.round(pct*100)+'%"></i></div></div><div class="rv">'+esc(v)+'</div></div>';}
function crow(n,who,ver,tm,tag,st){return '<tr><td>'+esc(n)+'</td><td>'+esc(who)+'</td><td class="mono">'+esc(ver)+'</td><td class="mono">'+esc(tm)+'</td><td><span class="tag '+tag+'">'+esc(st)+'</span></td></tr>';}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var active=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("active",active);
    btns[k].setAttribute("aria-current",active?"page":"false");
  }
  el("scr-title").textContent=NAV[i].t;
  el("scr-sub").textContent=NAV[i].s;
  view.innerHTML="";
  void view.offsetHeight;
  SCREENS[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
</body>
</html>
