<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>財務報表自動化系統（Financial Reporting Automation / Close System）｜Jvision Demo</title>
<meta name="description" content="月結任務、傳票試算、帳戶調節、三大報表到揭露封存的財務結帳一站式平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--panel:#ffffff;--ink:#0f172a;
  --muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;
  --ok:#0f766e;--okbg:#ccfbf1;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
  --info:#1d4ed8;--infobg:#dbeafe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.layout{display:flex;min-height:100vh;align-items:stretch}
/* sidebar */
.sidebar{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mk{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center}
.brand .mk .material-symbols-outlined{font-size:22px}
.brand h1{font-size:14.5px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.period{margin:14px 14px 4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.period .k{font-size:11px;color:var(--muted)}
.period .v{font-size:14px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px;margin-top:2px}
.nav{padding:10px 10px 18px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;font-family:inherit;font-weight:600;min-width:0}
.nav button .idx{font-size:11px;color:var(--muted);font-weight:700;width:16px;flex:0 0 16px}
.nav button .material-symbols-outlined{font-size:20px;color:var(--accent2)}
.nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:var(--soft)}
.nav button.active{background:var(--accent);color:#fff}
.nav button.active .material-symbols-outlined,.nav button.active .idx{color:#fff}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
/* main */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .tt{min-width:0}
.topbar h2{margin:0;font-size:17px;font-weight:800}
.topbar p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.topbar .sp{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--accent)}
.content{padding:22px 26px 40px;min-width:0}
/* grids */
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.55fr 1fr}
.g32{grid-template-columns:1fr 1.4fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .num{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:4px;color:var(--ink)}
.kpi .num small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .foot{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-warn{background:var(--warnbg);color:var(--warn)}
.t-bad{background:var(--badbg);color:var(--bad)}
.t-info{background:var(--infobg);color:var(--info)}
.t-mut{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.chartbox{width:100%;overflow:hidden;min-width:0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* checklist board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{margin:0 0 9px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk:last-child{margin-bottom:0}
.tk .tn{font-size:12.5px;font-weight:700}
.tk .meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.av{width:20px;height:20px;border-radius:50%;background:var(--accent2);color:#fff;font-size:9.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
/* timeline */
.tl{position:relative;padding-left:8px}
.tl .row{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl .row:last-child{border-bottom:0}
.tl .dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--accent2);box-shadow:0 0 0 4px var(--soft)}
.tl .row.done .dot{background:var(--ok)}
.tl .row.late .dot{background:var(--bad)}
.tl .tx{min-width:0}
.tl .tx .h{font-size:12.5px;font-weight:700}
.tl .tx .m{font-size:11px;color:var(--muted);margin-top:2px}
/* recon match */
.match{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:stretch;min-width:0}
.mside{background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.mside .mh{padding:9px 12px;font-size:12px;font-weight:800;background:#fff;border-bottom:1px solid var(--line)}
.mrow{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.mrow:last-child{border-bottom:0}
.mrow .amt{font-weight:700;font-variant-numeric:tabular-nums}
.mconn{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--accent2)}
.mconn .material-symbols-outlined{font-size:18px}
/* statement */
.stmt tr td:first-child{font-weight:600}
.stmt .sec td{background:var(--soft);font-weight:800;color:var(--accent)}
.stmt .sub td:first-child{padding-left:26px;color:var(--muted);font-weight:500}
.stmt .tot td{border-top:2px solid var(--accent);font-weight:800}
/* review steps */
.steps{display:flex;gap:0;flex-wrap:wrap;min-width:0}
.step{flex:1 1 120px;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-right:8px;margin-bottom:8px;position:relative}
.step .st{font-size:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.step .sn{font-size:13px;font-weight:800;margin-top:6px}
.step .sd{font-size:11px;color:var(--muted);margin-top:3px}
.step.pass{border-color:#99f6e4;background:#f0fdfa}
.step.now{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,65,85,.08)}
/* legend / ratio */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.ratio{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ratio:last-child{border-bottom:0}
.ratio .rn{flex:0 0 120px;font-size:12.5px;font-weight:700;min-width:0}
.ratio .rbar{flex:1 1 auto;min-width:0}
.ratio .rv{flex:0 0 74px;text-align:right;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:14px 0}
.hint{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:10px}
/* responsive */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .layout{display:block}
  .sidebar{width:auto;flex:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{border-bottom:1px solid var(--line)}
  .period{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;padding:10px}
  .nav button{width:auto;flex:0 0 auto}
  .side-foot{display:none}
  .content{padding:18px 16px 34px}
  .topbar{padding:12px 16px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .match{grid-template-columns:1fr}
  .mconn{flex-direction:row;padding:6px 0}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mk"><span class="material-symbols-outlined">account_balance</span></div>
        <div>
          <h1>Close System</h1>
          <p>財務報表自動化</p>
        </div>
      </div>
    </div>
    <div class="period">
      <div class="k">結帳期間</div>
      <div class="v"><span class="material-symbols-outlined" style="font-size:18px">calendar_month</span>2026 年 07 月結</div>
      <div class="k" style="margin-top:8px">距截止</div>
      <div class="v" style="color:var(--warn)"><span class="material-symbols-outlined" style="font-size:18px">timer</span>2 天 06 小時</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Jvision Demo · 純前端展示<br/>資料皆為模擬</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scr-title">結帳任務清單</h2>
        <p id="scr-sub">Close Checklist</p>
      </div>
      <div class="sp"></div>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">groups</span>財會 · 出納 · 財務長</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span>ERP / 銀行整合</span>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<script>
(function(){
"use strict";
var NAV=[
  {icon:"checklist",t:"結帳任務清單",s:"Close Checklist"},
  {icon:"receipt_long",t:"傳票拋轉與試算",s:"Journals & Trial Balance"},
  {icon:"rule",t:"帳戶調節",s:"Account Reconciliation"},
  {icon:"description",t:"三大報表編製",s:"Financial Statements"},
  {icon:"fact_check",t:"分層覆核簽核",s:"Review & Approval"},
  {icon:"insights",t:"揭露與封存",s:"Disclosure & Period Close"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
var view=el("view");

/* build nav */
var nav=el("nav");
var nh="";
for(var i=0;i<NAV.length;i++){
  nh+='<button data-i="'+i+'"><span class="idx">0'+(i+1)+'</span><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="lbl">'+esc(NAV[i].t)+'</span></button>';
}
nav.innerHTML=nh;
nav.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");if(!b)return;
  location.hash="go="+b.getAttribute("data-i");
});

function money(n){return n.toLocaleString("en-US");}

/* ---------- SCREEN 0 : Close Checklist ---------- */
function s0(){
  var tasks={
    todo:[
      {n:"折舊與攤銷計提",who:"CH",due:"07/31",tag:"t-mut",tt:"未開始"},
      {n:"預付費用分攤",who:"LW",due:"07/31",tag:"t-mut",tt:"未開始"}
    ],
    doing:[
      {n:"應收帳款帳齡結算",who:"CH",due:"07/30",tag:"t-info",tt:"進行中"},
      {n:"存貨評價與跌價",who:"WY",due:"07/30",tag:"t-info",tt:"進行中"},
      {n:"外幣兌換損益",who:"LW",due:"07/31",tag:"t-warn",tt:"逾期風險"}
    ],
    review:[
      {n:"薪資費用計提",who:"CS",due:"07/29",tag:"t-info",tt:"覆核中"},
      {n:"利息費用計提",who:"CS",due:"07/29",tag:"t-info",tt:"覆核中"}
    ],
    done:[
      {n:"子帳簿鎖定",who:"CH",due:"07/28",tag:"t-ok",tt:"完成"},
      {n:"銷貨收入截止",who:"WY",due:"07/28",tag:"t-ok",tt:"完成"},
      {n:"進項稅額拋轉",who:"LW",due:"07/28",tag:"t-ok",tt:"完成"}
    ]
  };
  function colHtml(title,arr){
    var h='<div class="col"><h4>'+title+'<span class="cnt">'+arr.length+'</span></h4>';
    for(var k=0;k<arr.length;k++){var t=arr[k];
      h+='<div class="tk"><div class="tn">'+esc(t.n)+'</div><div class="meta"><span class="av">'+t.who+'</span><span>截止 '+t.due+'</span><span class="tag '+t.tag+'">'+t.tt+'</span></div></div>';
    }
    return h+'</div>';
  }
  view.innerHTML=''+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("checklist","任務完成度","68","%","up","10 / 22 剩 12 項")+
    kpi("timer","距結帳截止","2.3","天","","截止 07/31 18:00")+
    kpi("warning","逾期風險任務","1","項","down","外幣兌換損益")+
    kpi("task_alt","已覆核完成","3","項","up","本期共 22 項")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card pad0" style="padding:16px"><h3><span class="material-symbols-outlined">view_kanban</span>月結任務看板</h3><p class="sub">依狀態分欄，拖曳指派負責人與截止時點（示意）</p>'+
      '<div style="overflow-x:auto"><div class="board">'+
        colHtml("待處理",tasks.todo)+colHtml("進行中",tasks.doing)+colHtml("覆核中",tasks.review)+colHtml("已完成",tasks.done)+
      '</div></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>各群組進度</h3><p class="sub">結帳子項完成比例</p>'+
      '<div id="c0a" class="chartbox"></div>'+
      '<div class="sep"></div>'+
      '<div class="tl">'+
        tlRow("done","子帳簿全數鎖定","07/28 09:12 · 系統自動")+
        tlRow("done","收入與進項截止確認","07/28 14:40 · WY")+
        tlRow("","薪資與利息計提待覆核","07/29 · CS")+
        tlRow("late","外幣兌換損益逾期","預計 07/31 · LW")+
      '</div>'+
    '</div>'+
  '</div>';
  void view.offsetHeight;
  var o={chart:{type:"radialBar",height:230,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[100,86,55,25],labels:["前置作業","收入循環","費用計提","評價調整"],
    colors:["#0f766e","#334155","#64748b","#94a3b8"],
    plotOptions:{radialBar:{hollow:{size:"38%"},dataLabels:{name:{fontSize:"12px"},value:{fontSize:"14px",fontWeight:700},total:{show:true,label:"整體",fontSize:"12px",formatter:function(){return"68%";}}}}},
    legend:{show:true,position:"bottom",fontSize:"11px"}};
  charts.push(new ApexCharts(el("c0a"),o));charts[charts.length-1].render();
}

/* ---------- SCREEN 1 : Journals & Trial Balance ---------- */
function s1(){
  var rows=[
    {v:"JV-2607-0148",src:"銷售子系統",acc:"1172 應收帳款",dr:8420500,cr:0,st:"t-ok",stt:"已過帳"},
    {v:"JV-2607-0149",src:"銷售子系統",acc:"4111 銷貨收入",dr:0,cr:8020476,st:"t-ok",stt:"已過帳"},
    {v:"JV-2607-0150",src:"採購子系統",acc:"5111 進貨成本",dr:5136200,cr:0,st:"t-ok",stt:"已過帳"},
    {v:"JV-2607-0151",src:"薪資系統",acc:"6120 薪資費用",dr:3218000,cr:0,st:"t-info",stt:"待覆核"},
    {v:"JV-2607-0152",src:"固定資產",acc:"6180 折舊費用",dr:642300,cr:0,st:"t-warn",stt:"待產生"},
    {v:"JV-2607-0153",src:"手工分錄",acc:"7220 兌換損失",dr:118940,cr:0,st:"t-bad",stt:"借貸不平"}
  ];
  var th='';
  for(var k=0;k<rows.length;k++){var r=rows[k];
    th+='<tr><td class="mono">'+r.v+'</td><td>'+esc(r.src)+'</td><td>'+esc(r.acc)+'</td><td class="num">'+(r.dr?money(r.dr):"—")+'</td><td class="num">'+(r.cr?money(r.cr):"—")+'</td><td><span class="tag '+r.st+'">'+r.stt+'</span></td></tr>';
  }
  view.innerHTML=''+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("receipt_long","本期傳票","1,284","筆","up","自動生成 1,201 筆")+
    kpi("bolt","自動化比率","93.5","%","up","手工分錄 83 筆")+
    kpi("balance","試算平衡","平衡","","up","借貸差額 0")+
    kpi("error","待處理例外","1","筆","down","借貸不平 1 筆")+
  '</div>'+

/* ---------- helpers ---------- */
function kpi(icon,lbl,num,unit,dir,foot){
  var arrow=dir==="up"?'<span class="up"><span class="material-symbols-outlined" style="font-size:15px">arrow_upward</span></span>':(dir==="down"?'<span class="down"><span class="material-symbols-outlined" style="font-size:15px">arrow_downward</span></span>':'');
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent2)">'+icon+'</span>'+esc(lbl)+'</div>'+
    '<div class="num">'+esc(num)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div>'+
    '<div class="foot">'+arrow+esc(foot)+'</div></div>';
}
function tlRow(cls,h,m){return '<div class="row '+cls+'"><span class="dot"></span><div class="tx"><div class="h">'+esc(h)+'</div><div class="m">'+esc(m)+'</div></div></div>';}
function rrow(n,a,age,tag,st){return '<tr><td>'+esc(n)+'</td><td class="num">'+money(a)+'</td><td>'+esc(age)+'</td><td><span class="tag '+tag+'">'+esc(st)+'</span></td></tr>';}
function srow(n,a,lvl){
  var cls=lvl===2?"sub":(lvl===3?"tot":"");
  var v=(a<0?'-':'')+money(Math.abs(a));
  if(lvl===2||lvl===3)cls=lvl===3?"tot":"";
  var rc=lvl===3?"tot":(lvl===0?"sub":"");
  return '<tr class="'+rc+'"><td>'+esc(n)+'</td><td class="num">'+v+'</td></tr>';
}
function step(state,icon,name,desc){
  return '<div class="step '+state+'"><div class="st"><span class="material-symbols-outlined" style="font-size:15px">'+icon+'</span>'+(state==="pass"?"已通過":(state==="now"?"進行中":"待處理"))+'</div><div class="sn">'+esc(name)+'</div><div class="sd">'+esc(desc)+'</div></div>';
}
function arow(n,who,op,tag,st){return '<tr><td>'+esc(n)+'</td><td>'+esc(who)+'</td><td>'+esc(op)+'</td><td><span class="tag '+tag+'">'+esc(st)+'</span></td></tr>';}
function ratio(n,v,pct){return '<div class="ratio"><div class="rn">'+esc(n)+'</div><div class="rbar"><div class="bar"><i style="width:'+Math.round(pct*100)+'%"></i></div></div><div class="rv">'+esc(v)+'</div></div>';}
function crow(n,who,ver,tm,tag,st){return '<tr><td>'+esc(n)+'</td><td>'+esc(who)+'</td><td class="mono">'+esc(ver)+'</td><td class="mono">'+esc(tm)+'</td><td><span class="tag '+tag+'">'+esc(st)+'</span></td></tr>';}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  el("scr-title").textContent=NAV[i].t;
  el("scr-sub").textContent=NAV[i].s;
  view.innerHTML="";
  void view.offsetHeight;
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
