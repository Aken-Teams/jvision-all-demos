<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>餐飲桌位出單站 KDS｜Jvision 系統 Demo</title>
<meta name="description" content="桌位地圖、點餐開單到廚房 KDS 出單的內外場一體化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#1E3A8A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#A16207;
  --color-on-accent:#FFFFFF;
  --color-background:#F8FAFC;
  --color-foreground:#1E40AF;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E40AF;
  --color-muted:#E9EEF5;
  --color-muted-foreground:#475569;
  --color-border:#BFDBFE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#1E3A8A;
  --blue:#1E3A8A;
  --ink:#172554;
  --muted:#475569;
  --line:#BFDBFE;
  --green:#15803D;
  --green-bg:#DCFCE7;
  --amber:#A16207;
  --amber-bg:#FEF3C7;
  --red:#B91C1C;
  --red-bg:#FEE2E2;
  --shadow:0 18px 50px rgba(30,58,138,.08);
  --shadow-sm:0 8px 24px rgba(30,58,138,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 100% 0,rgba(59,130,246,.10),transparent 26rem),
    linear-gradient(180deg,#fff 0,var(--color-background) 22rem);
  color:var(--muted);
  font-family:Karla,"Microsoft JhengHei",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"],.tb,.prod{cursor:pointer}
button:focus-visible,[role="button"]:focus-visible,.tb:focus-visible,.prod:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.mono,.tmr,.tno,.elapsed,.tm,.num,.val,td:first-child,td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(5){
  font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
}
.nav{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:rgba(30,58,138,.97);
  border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 35px rgba(23,37,84,.18);
  backdrop-filter:blur(18px);
}
.nav-in{
  width:min(1500px,100%);
  margin:auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.brand .lg{
  width:44px;height:44px;
  display:grid;place-items:center;
  color:var(--color-primary);
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.brand .lg span{font-size:25px}
.brand b{
  display:block;
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:16px;
  letter-spacing:.04em;
}
.brand small{display:block;color:#DBEAFE;font-size:11px}
.tabs{
  flex:1;
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  min-height:40px;
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  color:#DBEAFE;
  background:transparent;
  border:1px solid transparent;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:background .2s,color .2s,transform .2s;
}
.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
.tabs button.on{color:var(--color-primary);background:#fff;box-shadow:0 5px 16px rgba(0,0,0,.16)}
.tabs button .material-symbols-outlined{font-size:19px}
.nav-r{display:flex;align-items:center;gap:9px;min-width:max-content}
.npill{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 10px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  background:rgba(255,255,255,.09);
  font-size:12px;
  font-weight:700;
}
.npill .material-symbols-outlined{font-size:16px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.ava{
  width:36px;height:36px;
  display:grid;place-items:center;
  border-radius:10px;
  color:var(--color-primary);
  background:#fff;
  font-weight:700;
}
.wrap{width:min(1500px,100%);margin:auto;padding:28px 24px 56px}
.phead{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  gap:18px;
  min-height:116px;
  margin-bottom:20px;
  padding:24px 26px;
  color:#fff;
  background:
    linear-gradient(105deg,rgba(23,37,84,.98),rgba(30,64,175,.92)),
    var(--color-primary);
  border-radius:20px;
  box-shadow:var(--shadow);
}
.phead:after{
  content:"";
  position:absolute;
  width:230px;height:230px;
  right:9%;top:-135px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 58px rgba(255,255,255,.035);
}
.phead>div{position:relative;z-index:1}
.phead h1{
  margin:0;
  color:#fff;
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:clamp(24px,3vw,34px);
  line-height:1.15;
  letter-spacing:.03em;
}
.phead p{margin:7px 0 0;color:#DBEAFE;font-size:14px}
.phead .sp{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 16px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:1px solid var(--color-accent);
  border-radius:10px;
  box-shadow:0 5px 14px rgba(91,52,4,.18);
  font-size:13px;
  font-weight:700;
  transition:transform .2s,background .2s,box-shadow .2s;
}
.btn:hover{background:#854D0E;transform:translateY(-1px);box-shadow:0 8px 20px rgba(91,52,4,.24)}
.btn.ghost{color:var(--color-primary);background:#fff;border-color:#DBEAFE;box-shadow:none}
.btn.ghost:hover{background:#EFF6FF;border-color:#93C5FD}
.phead .btn.ghost{border-color:#fff}
.btn .material-symbols-outlined{font-size:18px}
.btn.block{width:100%;min-height:48px;margin-top:13px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.45fr 1fr}
.card,.kcol,.ticket{
  background:rgba(255,255,255,.96);
  border:1px solid var(--color-border);
  border-radius:16px;
  box-shadow:var(--shadow-sm);
}
.card{padding:20px}
.sec{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:16px;
  line-height:1.3;
}
.sec .material-symbols-outlined{color:var(--color-accent);font-size:20px}
.sec .tag{
  margin-left:auto;
  color:var(--muted);
  font-family:Karla,"Microsoft JhengHei",sans-serif;
  font-size:11px;
  font-weight:600;
  text-align:right;
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 18px;
  background:#fff;
  border:1px solid var(--color-border);
  border-radius:14px;
  box-shadow:var(--shadow-sm);
}
.kpi:after{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--color-primary);
}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi .l span{color:var(--color-secondary);font-size:18px}
.kpi .v{margin-top:5px;color:var(--ink);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:2px;color:var(--green);font-size:12px;font-weight:700}
.legend,.zone{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.legend{margin:0 0 15px;font-size:12px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid currentColor;border-radius:3px}
.zone{margin:5px 0 12px}
.zone .z{
  padding:5px 11px;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid var(--color-border);
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.tb{
  position:relative;
  min-height:116px;
  padding:13px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  background:#fff;
  border:1px solid var(--color-border);
  border-top:4px solid var(--color-primary);
  border-radius:13px;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.tb:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(30,58,138,.13)}
.tb .ic{font-size:23px}
.tb .no{color:var(--ink);font-size:17px;font-weight:700}
.tb .seats{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
.tb .seats span{font-size:14px}
.tb .st{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.tb .tmr{position:absolute;top:8px;right:8px;color:var(--muted);font-size:10px;font-weight:700}
.tb.free{border-top-color:var(--green);background:#F6FEF8}.tb.free .ic,.tb.free .st{color:var(--green)}.tb.free .st{background:var(--green-bg)}
.tb.busy{border-top-color:var(--color-accent);background:#FFFCF3}.tb.busy .ic,.tb.busy .st{color:#854D0E}.tb.busy .st{background:var(--amber-bg)}
.tb.dirty{border-top-color:#B45309;background:#FFFBEB}.tb.dirty .ic,.tb.dirty .st{color:#92400E}.tb.dirty .st{background:#FDE68A}
.tb.rsv{border-top-color:var(--color-secondary);background:#F5F9FF}.tb.rsv .ic,.tb.rsv .st{color:#1D4ED8}.tb.rsv .st{background:#DBEAFE}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;text-align:center}
.summary div{padding:13px 8px;background:#EFF6FF;border:1px solid var(--line);border-radius:11px}
.summary strong{display:block;color:var(--color-primary);font-size:25px;line-height:1.1}
.summary small{color:var(--muted);font-weight:600}
.pos3{display:grid;grid-template-columns:170px 1fr 340px;gap:16px;align-items:start}
.pos3>*{min-width:0}
.catlist{display:flex;flex-direction:column;gap:8px}
.catlist button{
  min-height:46px;
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--color-border);
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  text-align:left;
  transition:background .2s,color .2s,transform .2s;
}
.catlist button:hover{transform:translateX(2px);background:#EFF6FF}
.catlist button.on{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.catlist button span{font-size:20px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.prod{
  overflow:hidden;
  background:#fff;
  border:1px solid var(--color-border);
  border-radius:13px;
  transition:transform .2s,box-shadow .2s;
}
.prod:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(30,58,138,.13)}
.prod .ph{
  height:80px;
  display:grid;place-items:center;
  color:var(--color-primary);
  background:
    linear-gradient(145deg,rgba(255,255,255,.2),transparent),
    linear-gradient(135deg,#DBEAFE,#EFF6FF);
}
.prod .ph span{font-size:34px}
.prod .info{padding:11px 12px}
.prod .info b{display:block;color:var(--ink);font-size:14px}
.prod .pr{margin-top:3px;color:#854D0E;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.prod .pr small{font-size:11px}
.ticket{position:sticky;top:84px;padding:17px}
.ticket-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.ticket-h b{color:var(--ink)}
.ticket-h .tag{color:var(--muted);font-size:12px}
.ci{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ci .em{width:36px;height:36px;flex:none;display:grid;place-items:center;color:var(--color-primary);background:#EFF6FF;border-radius:9px}
.ci .em span{font-size:20px}
.ci .nm{flex:1;min-width:0}
.ci .nm b{display:block;color:var(--ink);font-size:13px}
.ci .nm small{display:block;color:#854D0E;font-size:11px;font-weight:600}
.ci .qty{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:700}
.qbtn{
  width:28px;height:28px;
  color:var(--color-primary);
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  font-weight:700;
}
.qbtn:hover{background:#EFF6FF}
.ticket-sum{margin-top:12px}
.ticket-sum .row{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.ticket-sum .total{margin-top:8px;padding-top:10px;color:var(--ink);border-top:1px dashed var(--line);font-size:20px;font-weight:700}
.kds-wrap{overflow-x:auto;padding-bottom:5px}
.kds{display:grid;grid-template-columns:repeat(3,minmax(290px,1fr));gap:15px}
.kcol{padding:14px;box-shadow:var(--shadow-sm)}
.kcol-h{
  display:flex;align-items:center;gap:8px;
  margin-bottom:11px;padding:3px 2px 11px;
  color:var(--ink);
  border-bottom:2px solid var(--line);
  font-weight:700;
}
.kcol-h .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.kcol-h .n{margin-left:auto;padding:2px 9px;color:#fff;background:var(--color-primary);border-radius:999px;font-size:11px}
.kcol.cook .kcol-h{border-color:#D97706}.kcol.cook .kcol-h .material-symbols-outlined{color:#A16207}.kcol.cook .n{background:#A16207}
.kcol.ready .kcol-h{border-color:var(--green)}.kcol.ready .kcol-h .material-symbols-outlined{color:var(--green)}.kcol.ready .n{background:var(--green)}
.kt{margin-top:11px;padding:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:11px}
.kt.cook{border-left-color:var(--color-accent)}
.kt.ready{border-left-color:var(--green)}
.kt.late{border-left-color:var(--red);background:#FFF7F7}
.kt-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.kt-h .tno{color:var(--ink);font-size:13px;font-weight:700}
.type{padding:2px 7px;color:var(--color-primary);background:#DBEAFE;border-radius:999px;font-size:10px;font-weight:700}
.type.take{color:#5B21B6;background:#EDE9FE}
.elapsed{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700}
.elapsed span{font-size:14px}
.kt.late .elapsed{color:var(--red)}
.latebadge{padding:1px 6px;color:var(--red);background:var(--red-bg);border-radius:5px;font:700 10px Karla,sans-serif}
.kt ul{margin:0;padding:0;list-style:none}
.kt li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:var(--ink);font-size:13px;font-weight:600}
.kt li small{color:#854D0E;font-size:11px}
.kt li.done{color:var(--muted);text-decoration:line-through}
.kt .q{color:var(--muted);font-variant-numeric:tabular-nums}
.kt-f{display:flex;gap:7px;margin-top:9px}
.kbtn{
  min-height:36px;flex:1;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}
.kbtn.pri{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.kbtn:hover{filter:brightness(.96)}
.rsv-list{display:flex;flex-direction:column;gap:9px}
.rrow{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 13px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
}
.rrow .tm{width:57px;flex:none;color:var(--color-primary);font-size:14px;font-weight:700}
.rrow .who{flex:1;min-width:130px}
.rrow .who b{color:var(--ink);font-size:14px}
.rrow .who small{display:block;color:var(--muted);font-size:11px}
.pax,.rst,.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.pax{color:var(--color-primary);background:#EFF6FF}
.pax span{font-size:15px}
.rst.ok,.pill.g{color:#166534;background:var(--green-bg)}
.rst.wait,.pill.a{color:#854D0E;background:var(--amber-bg)}
.rst.soon{color:#1D4ED8;background:#DBEAFE}
.wq{display:flex;align-items:center;gap:11px;margin-bottom:9px;padding:12px;background:#F8FAFC;border:1px solid var(--line);border-radius:11px}
.wq .num{width:45px;height:45px;flex:none;display:grid;place-items:center;color:#fff;background:var(--color-primary);border-radius:10px;font-weight:700}
.wq .info{flex:1;min-width:0}
.wq .info b{color:var(--ink)}
.wq .info small{display:block;color:var(--muted);font-size:11px}
.wq .eta{color:#854D0E;font-size:12px;font-weight:700}
.callout{margin-top:14px;padding:15px;text-align:center;background:#EFF6FF;border:1px solid var(--line);border-radius:12px}
.callout small{color:var(--muted);font-weight:600}
.callout strong{display:block;margin:3px 0;color:var(--color-primary);font-size:34px}
.chart{width:100%;height:290px}
.rank{display:flex;align-items:center;gap:11px;padding:8px 0}
.rank .rk{width:27px;height:27px;flex:none;display:grid;place-items:center;color:var(--color-primary);background:#EFF6FF;border-radius:7px;font-weight:700}
.rank b{width:130px;flex:none;color:var(--ink)}
.bar{height:9px;flex:1;overflow:hidden;background:var(--color-muted);border-radius:999px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.rank .val{width:68px;flex:none;color:var(--ink);font-weight:700;text-align:right}
.tbl-wrap{overflow-x:auto}
table.data{width:100%;min-width:500px;border-collapse:collapse;font-size:13px}
table.data th{
  padding:10px 12px;
  color:var(--color-primary);
  background:#EFF6FF;
  border-bottom:2px solid var(--color-border);
  font-size:11px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
}
table.data td{padding:11px 12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
table.data td:nth-child(3),table.data td:nth-child(4),table.data td:nth-child(5),
table.data th:nth-child(3),table.data th:nth-child(4),table.data th:nth-child(5){text-align:right}
table.data tbody tr:hover td{background:#F8FAFC}
.grid-item{animation:reveal .4s cubic-bezier(.34,1.56,.64,1) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes alertPulse{50%{box-shadow:0 0 0 4px rgba(220,38,38,.10)}}
.kt.late{animation:alertPulse 1.8s ease-in-out infinite}
@media(max-width:1180px){

  c.setOption({
   textStyle:common,grid:{left:8,right:14,top:22,bottom:8,containLabel:true},
   tooltip:{trigger:"axis"},xAxis:{type:"category",data:["11","12","13","14","17","18","19","20","21"],axisLabel:{color:"#475569"},axisLine:{lineStyle:{color:"#BFDBFE"}}},
   yAxis:{type:"value",splitLine:{lineStyle:{color:"#E9EEF5"}},axisLabel:{color:"#475569"}},
   series:[{type:"bar",data:[6200,14800,12100,4300,3800,15600,18200,13400,7800],itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"#3B82F6"},{offset:1,color:"#1E3A8A"}]),borderRadius:[6,6,0,0]}}]
  });charts.push(c);
 }
 const pie=document.getElementById("cPie");
 if(pie){
  const c=echarts.init(pie);
  c.setOption({
   textStyle:common,tooltip:{trigger:"item",formatter:"{b}: {c}%"},
   legend:{bottom:0,textStyle:{fontSize:11,color:"#475569"}},
   series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:3},label:{show:false},data:[
    {name:"內用",value:64,itemStyle:{color:"#1E3A8A"}},{name:"外帶",value:24,itemStyle:{color:"#3B82F6"}},{name:"外送",value:12,itemStyle:{color:"#A16207"}}
   ]}]
  });charts.push(c);
 }
}
const tabsEl=document.getElementById("tabs"),view=document.getElementById("view"),vt=document.getElementById("vt"),vs=document.getElementById("vs"),vact=document.getElementById("vact");
tabsEl.innerHTML=TABS.map((t,i)=>`<button type="button" role="tab" data-i="${i}" class="${i===0?"on":""}" aria-selected="${i===0}">${icon(t[0])}${t[1]}</button>`).join("");
function show(i){
 i=Math.max(0,Math.min(Number(i)||0,TABS.length-1));
 tabsEl.querySelectorAll("button[data-i]").forEach(b=>{const on=b.dataset.i===String(i);b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
 vt.textContent=TABS[i][1];vs.textContent=TABS[i][2];vact.innerHTML=ACT[i]||"";view.innerHTML=SCREENS[i]();draw(i);
}
tabsEl.addEventListener("click",e=>{
 const b=e.target.closest("button[data-i]");if(!b)return;
 const i=+b.dataset.i;
 if(location.hash!==`#v${i}`)location.hash=`v${i}`;else show(i);
 window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
});
tabsEl.addEventListener("keydown",e=>{
 const buttons=[...tabsEl.querySelectorAll("button[data-i]")],current=buttons.indexOf(document.activeElement);
 if(current<0||!["ArrowLeft","ArrowRight","Home","End"].includes(e.key))return;
 e.preventDefault();
 const next=e.key==="Home"?0:e.key==="End"?buttons.length-1:(current+(e.key==="ArrowRight"?1:-1)+buttons.length)%buttons.length;
 buttons[next].focus();
});
view.addEventListener("click",e=>{
 const cb=e.target.closest("[data-cat]");
 if(cb){cat=+cb.dataset.cat;view.innerHTML=SCREENS[2]()}
});
window.addEventListener("resize",()=>charts.forEach(c=>{try{c.resize()}catch(e){}}));
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],TABS.length-1):0);
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
