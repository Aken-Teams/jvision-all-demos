<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>餐飲桌位出單站 KDS｜Jvision 系統 Demo</title>

<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --accent:#c2410c; --accent2:#ea580c; --accent-d:#9a3412;
    --ink:#3a2415; --body:#6b4d3a; --muted:#9c8472; --line:#f0e2d6;
    --bg:#fdf7f1; --card:#ffffff; --soft:#fff2ea;
    --green:#16a34a; --gr-bg:#dcfce7; --amber:#d97706; --am-bg:#fef3c7;
    --blue:#2563eb; --bl-bg:#dbeafe; --red:#dc2626; --rd-bg:#fee2e2;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* ===== top nav ===== */

  .nav-in{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:11px 22px; max-width:1500px; margin:0 auto; min-width:0; }
  .brand{ display:flex; align-items:center; gap:11px; }

  .brand .lg .material-symbols-outlined{ font-size:25px; }
  .brand b{ display:block; font-size:16px; font-weight:900; letter-spacing:.02em; }
  .brand small{ display:block; font-size:11px; color:#ffe4d6; }
  .tabs{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex:1; min-width:0; }

  .tabs button.on{ background:#fff; color:var(--accent); box-shadow:0 3px 10px rgba(0,0,0,.16); }
  .nav-r{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  h3.sec{ margin:0 0 12px; font-size:15px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 17px; position:relative; overflow:hidden; }

  .kpi .l{ font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:16px; color:var(--accent2); }
  .kpi .v{ font-size:26px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:3px; } .kpi .d.up{ color:var(--green); } .kpi .d.dn{ color:var(--accent); }
  /* ===== table map ===== */
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:2px 0 12px; font-size:11px; font-weight:700; color:var(--body); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; } .legend i{ width:12px; height:12px; border-radius:4px; display:inline-block; }
  .zone{ display:flex; align-items:center; gap:10px; margin:2px 0 12px; flex-wrap:wrap; }
  .zone .z{ font-size:12px; font-weight:800; color:var(--ink); background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
  .tables{ display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:13px; }
  .tb{ border-radius:16px; border:2px solid var(--line); background:#fff; padding:12px 10px; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:112px; justify-content:center; position:relative; cursor:pointer; transition:transform .12s,box-shadow .12s; min-width:0; }
  .tb:hover{ transform:translateY(-3px); box-shadow:0 10px 22px rgba(154,52,18,.12); }
  .tb .no{ font-size:17px; font-weight:900; color:var(--ink); }
  .tb .seats{ font-size:11px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:3px; } .tb .seats .material-symbols-outlined{ font-size:14px; }
  .tb .st{ font-size:11px; font-weight:800; margin-top:2px; border-radius:999px; padding:1px 9px; }
  .tb .tmr{ position:absolute; top:8px; right:9px; font-size:10px; font-weight:800; color:var(--muted); }
  .tb.free{ border-color:#bbf7d0; background:#f2fdf5; } .tb.free .st{ background:var(--gr-bg); color:#15803d; }

  .tb.rsv{ border-color:#93c5fd; background:#f0f7ff; } .tb.rsv .st{ background:var(--bl-bg); color:#1d4ed8; }
  .tb .ic{ font-size:22px; color:var(--accent2); }
  .tb.free .ic{ color:#16a34a; } .tb.dirty .ic{ color:#d97706; } .tb.rsv .ic{ color:#2563eb; }

  .pos3{ display:grid; grid-template-columns:160px 1fr 330px; gap:16px; align-items:start; }
  .pos3>*{ min-width:0; }
  .catlist{ display:flex; flex-direction:column; gap:8px; }
  .catlist button{ text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:12px 13px; font:inherit; font-weight:800; font-size:13px; color:var(--body); cursor:pointer; display:flex; align-items:center; gap:9px; }
  .catlist button .material-symbols-outlined{ color:var(--accent2); font-size:20px; }
  .catlist button.on{ background:var(--accent); color:#fff; border-color:var(--accent); } .catlist button.on .material-symbols-outlined{ color:#fff; }
  .prods{ display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:13px; }
  .prod{ background:#fff; border:1px solid var(--line); border-radius:15px; overflow:hidden; cursor:pointer; transition:transform .12s,box-shadow .12s; }
  .prod:hover{ transform:translateY(-3px); box-shadow:0 12px 24px rgba(194,65,12,.12); }
  .prod .ph{ height:74px; display:grid; place-content:center; font-size:32px; background:linear-gradient(135deg,#fff2ea,#ffe3d1); }
  .prod .info{ padding:10px 12px; } .prod .info b{ display:block; font-size:14px; color:var(--ink); } .prod .info .pr{ color:var(--accent); font-weight:900; font-size:15px; margin-top:2px; }
  .prod .info .pr small{ color:var(--accent2); font-size:11px; }
  .ticket{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; position:sticky; top:86px; }
  .ticket-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .ticket-h b{ font-size:16px; color:var(--ink); } .ticket-h .tag{ font-size:12px; color:var(--muted); font-weight:700; }
  .ci{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .ci .em{ width:36px; height:36px; border-radius:10px; background:var(--soft); display:grid; place-content:center; font-size:19px; flex:none; }
  .ci .nm{ flex:1; min-width:0; } .ci .nm b{ font-size:13px; color:var(--ink); display:block; } .ci .nm small{ color:var(--accent2); font-size:11px; font-weight:700; }
  .ci .qty{ display:flex; align-items:center; gap:8px; } .ci .qty span{ font-weight:800; color:var(--ink); }
  .qbtn{ width:24px; height:24px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--accent); font-weight:900; cursor:pointer; }
  .ticket-sum{ margin-top:13px; font-size:14px; } .ticket-sum .row{ display:flex; justify-content:space-between; padding:3px 0; color:var(--body); }
  .ticket-sum .total{ font-size:21px; font-weight:900; color:var(--ink); border-top:1px dashed var(--line); margin-top:8px; padding-top:11px; }
  .btn.block{ width:100%; justify-content:center; height:46px; font-size:15px; margin-top:12px; }
  /* ===== KDS board ===== */
  .kds-wrap{ overflow-x:auto; padding-bottom:6px; }
  .kds{ display:grid; grid-template-columns:repeat(3,minmax(280px,1fr)); gap:16px; }
  .kcol{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .kcol-h{ display:flex; align-items:center; gap:9px; font-size:14px; font-weight:900; color:var(--ink); padding:2px 2px 10px; border-bottom:2px solid var(--line); }
  .kcol-h .material-symbols-outlined{ font-size:20px; }
  .kcol-h .n{ margin-left:auto; font-size:12px; font-weight:900; color:#fff; background:var(--accent); border-radius:999px; padding:1px 10px; }
  .kcol.wait .kcol-h{ border-color:#fdba74; } .kcol.wait .kcol-h .material-symbols-outlined{ color:var(--accent2); } .kcol.wait .kcol-h .n{ background:var(--accent2); }
  .kcol.cook .kcol-h{ border-color:#fbbf24; } .kcol.cook .kcol-h .material-symbols-outlined{ color:#d97706; } .kcol.cook .kcol-h .n{ background:#d97706; }
  .kcol.ready .kcol-h{ border-color:#86efac; } .kcol.ready .kcol-h .material-symbols-outlined{ color:#16a34a; } .kcol.ready .kcol-h .n{ background:#16a34a; }
  .kt{ border:1px solid var(--line); border-radius:14px; padding:12px; background:#fff; border-left:5px solid var(--accent); }
  .kt.cook{ border-left-color:#d97706; } .kt.ready{ border-left-color:#16a34a; }
  .kt.late{ border-left-color:var(--red); background:#fff6f5; animation:beat 1.8s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ box-shadow:0 0 0 0 rgba(220,38,38,0);} 50%{ box-shadow:0 0 0 4px rgba(220,38,38,.10);} }
  .kt-h{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .kt-h .tno{ font-size:14px; font-weight:900; color:var(--ink); }
  .kt-h .type{ font-size:10px; font-weight:800; border-radius:999px; padding:1px 8px; background:var(--soft); color:var(--accent); }
  .kt-h .type.take{ background:var(--bl-bg); color:#1d4ed8; }
  .kt-h .elapsed{ margin-left:auto; font-size:12px; font-weight:900; color:var(--muted); display:inline-flex; align-items:center; gap:3px; }
  .kt-h .elapsed .material-symbols-outlined{ font-size:15px; }
  .kt.late .elapsed{ color:var(--red); }
  .kt ul{ margin:0; padding:0; list-style:none; }
  .kt ul li{ display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--ink); padding:3px 0; font-weight:600; }
  .kt ul li small{ color:var(--accent2); font-weight:700; font-size:11px; }
  .kt ul li.done{ color:var(--muted); text-decoration:line-through; }
  .kt ul li .q{ color:var(--muted); font-weight:800; }
  .kt-f{ margin-top:9px; display:flex; align-items:center; gap:8px; }
  .kt-f .kbtn{ flex:1; border:0; border-radius:9px; padding:7px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; background:var(--soft); color:var(--accent); }
  .kt-f .kbtn.pri{ background:var(--accent); color:#fff; }
  .latebadge{ font-size:10px; font-weight:900; color:var(--red); background:var(--rd-bg); border-radius:6px; padding:1px 7px; }
  /* ===== reservation / waitlist ===== */
  .rsv-list{ display:flex; flex-direction:column; gap:10px; }
  .rrow{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:#fff; flex-wrap:wrap; }
  .rrow .tm{ font-size:15px; font-weight:900; color:var(--accent); width:52px; flex:none; }
  .rrow .who{ flex:1; min-width:120px; } .rrow .who b{ color:var(--ink); font-size:14px; } .rrow .who small{ display:block; color:var(--muted); font-size:11px; }
  .rrow .pax{ font-size:12px; font-weight:800; color:var(--body); background:var(--soft); border-radius:999px; padding:4px 11px; display:inline-flex; align-items:center; gap:4px; } .rrow .pax .material-symbols-outlined{ font-size:15px; }
  .rrow .rst{ font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; }
  .rst.ok{ background:var(--gr-bg); color:#15803d; } .rst.wait{ background:var(--am-bg); color:#b45309; } .rst.soon{ background:var(--bl-bg); color:#1d4ed8; }
  .wq{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px dashed var(--line); border-radius:14px; background:var(--soft); margin-bottom:9px; }
  .wq .num{ width:42px; height:42px; border-radius:12px; background:var(--accent); color:#fff; font-weight:900; font-size:16px; display:grid; place-content:center; flex:none; }
  .wq .info{ flex:1; min-width:0; } .wq .info b{ color:var(--ink); } .wq .info small{ display:block; color:var(--muted); font-size:11px; }
  .wq .eta{ font-size:12px; font-weight:800; color:var(--accent); }
  /* ===== report ===== */
  .chart{ width:100%; height:290px; }
  .rank{ display:flex; align-items:center; gap:12px; padding:7px 0; }
  .rank .rk{ width:26px; height:26px; border-radius:8px; background:var(--soft); color:var(--accent); font-weight:900; display:grid; place-content:center; flex:none; }
  .rank b{ width:130px; color:var(--ink); flex:none; }
  .bar{ flex:1; height:9px; border-radius:999px; background:var(--line); overflow:hidden; } .bar span{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .rank .val{ font-weight:900; color:var(--ink); width:64px; text-align:right; flex:none; }
  .tbl-wrap{ overflow-x:auto; }
  table.data{ width:100%; border-collapse:collapse; font-size:13px; min-width:500px; }
  table.data th{ text-align:left; font-size:11px; font-weight:800; color:var(--muted); padding:9px 12px; border-bottom:2px solid var(--line); white-space:nowrap; }
  table.data td{ padding:10px 12px; border-bottom:1px solid var(--line); color:var(--body); white-space:nowrap; }
  table.data tr:hover td{ background:var(--soft); }
  .pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; }
  .pill.g{ background:var(--gr-bg); color:#15803d; } .pill.a{ background:var(--am-bg); color:#b45309; }
  /* ===== RWD ===== */
  @media (max-width:1100px){
    .g2,.g2b{ grid-template-columns:1fr; }
    .pos3{ grid-template-columns:1fr; } .ticket{ position:static; } .catlist{ flex-direction:row; overflow-x:auto; } .catlist button{ white-space:nowrap; }
  }

    .wrap{ padding:16px 14px 40px; }

    .tables{ grid-template-columns:repeat(auto-fill,minmax(102px,1fr)); }
    .rank b{ width:88px; }
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-in">
    <div class="brand">
      <span class="lg"><span class="material-symbols-outlined">ramen_dining</span></span>
      <div><b>桌位出單站 KDS</b><small>爐香食堂 · 信義本店</small></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="nav-r">
      <span class="npill"><span class="dot"></span>營業中</span>
      <span class="npill"><span class="material-symbols-outlined">soup_kitchen</span>廚房工單 7</span>

  </div>
</nav>
<div class="wrap">
  <div class="phead">
    <div><h1 id="vt">營運總覽</h1><p id="vs">即時掌握桌況、廚房出單與今日營運</p></div>
    <div class="sp" id="vact"></div>

  <div id="view"></div>
</div>
<script>
const money=n=>"$"+n.toLocaleString();
const TABS=[
  ["dashboard","營運總覽","即時掌握桌況、廚房出單與今日營運"],
  ["table_restaurant","桌位管理","大廳桌位地圖：空桌 / 用餐中 / 待清理 / 已訂位"],
  ["restaurant_menu","點餐開單","帶位開桌、選菜加註並一鍵送單至廚房"],
  ["soup_kitchen","廚房出單 KDS","待製作 / 製作中 / 待出餐 工單看板"],
  ["event_seat","訂位候位","線上訂位與現場候位叫號管理"],
  ["monitoring","營運報表","營收、翻桌率與熱銷分析"]

const ACT={
  0:'<button class="btn ghost"><span class="material-symbols-outlined">print</span>列印班表</button><button class="btn"><span class="material-symbols-outlined">notifications_active</span>叫廚房</button>',
  1:'<button class="btn ghost"><span class="material-symbols-outlined">tune</span>區域篩選</button><button class="btn"><span class="material-symbols-outlined">add</span>帶位開桌</button>',

  3:'<button class="btn ghost"><span class="material-symbols-outlined">filter_alt</span>只看逾時</button><button class="btn"><span class="material-symbols-outlined">campaign</span>催單廣播</button>',
  4:'<button class="btn ghost"><span class="material-symbols-outlined">how_to_reg</span>候位叫號</button><button class="btn"><span class="material-symbols-outlined">add</span>新增訂位</button>',
  5:'<button class="btn ghost"><span class="material-symbols-outlined">download</span>匯出</button><button class="btn"><span class="material-symbols-outlined">calendar_month</span>日期範圍</button>'
};
/* ===== data ===== */
/* table: [no,status,seats,timer/rsv-label,orderNo,amount/paxLabel] */
const TABLES=[

let charts=[];
function draw(i){
  charts.forEach(c=>{try{c.dispose();}catch(e){}}); charts=[];
  if(!window.echarts || i!==5) return;
  const rev=document.getElementById("cRev");
  if(rev){ const c=echarts.init(rev); c.setOption({
    grid:{left:6,right:14,top:22,bottom:6,containLabel:true},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["11","12","13","14","17","18","19","20","21"],axisLabel:{color:"#9c8472"},axisLine:{lineStyle:{color:"#f0e2d6"}}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#f6ece3"}},axisLabel:{color:"#9c8472"}},
    series:[{type:"bar",data:[6200,14800,12100,4300,3800,15600,18200,13400,7800],itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"#ea580c"},{offset:1,color:"#c2410c"}]),borderRadius:[6,6,0,0]}}]
  }); charts.push(c); }
  const pie=document.getElementById("cPie");
  if(pie){ const c=echarts.init(pie); c.setOption({
    tooltip:{trigger:"item",formatter:"{b}: {c}%"},
    legend:{bottom:0,textStyle:{fontSize:11,color:"#6b4d3a"}},
    series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},data:[
      {name:"內用",value:64,itemStyle:{color:"#c2410c"}},
      {name:"外帶",value:24,itemStyle:{color:"#ea580c"}},
      {name:"外送",value:12,itemStyle:{color:"#fbbf24"}}
    ]}]
  }); charts.push(c); }
}

function show(i){
  tabsEl.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",b.dataset.i===String(i)));
  vt.textContent=TABS[i][1]; vs.textContent=TABS[i][2]; vact.innerHTML=ACT[i]||"";

}
tabsEl.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;show(+b.dataset.i);try{window.scrollTo(0,0);}catch(e){}});
