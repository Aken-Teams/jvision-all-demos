@media(max-width:1100px){.tb-in{grid-template-columns:1fr auto}.nav{grid-column:1/-1;grid-row:2}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:3px solid var(--ink)}}

</style>
