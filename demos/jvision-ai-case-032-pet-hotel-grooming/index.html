<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>寵物旅宿照護艙 · Pet Hotel & Grooming</title>
<meta name="description" content="寵物房況、訂房入住、美容預約、每日照護到帳務結算的一體化旅宿照護系統（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--teal:#14b8a6;--teal2:#2dd4bf;--teald:#0f766e;--ink:#0d3b36;--body:#3f5a55;--mut:#7b968f;--line:#d7ebe6;--bg:#f0faf7;--card:#fff;--amber:#f59e0b;--red:#ef4444;--ok:#10b981;--blue:#3b82f6;--pink:#f472b6;--purple:#8b5cf6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}
/* top nav */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(20,184,166,.06)}
.tb-in{display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.tb-in>*{min-width:0}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:grid;place-content:center;box-shadow:0 6px 16px rgba(20,184,166,.4)}
.brand .lg .material-symbols-outlined{font-size:24px;font-variation-settings:'FILL' 1}
.brand b{color:var(--ink);font-size:16px;font-family:"Noto Sans TC";font-weight:900;display:block;line-height:1.15}
.brand small{color:var(--mut);font-size:10.5px;letter-spacing:1.5px}
.nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.nav button{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--body);font:inherit;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;flex:none;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:20px;color:var(--mut)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 4px 12px rgba(20,184,166,.35)}
.nav button.on .material-symbols-outlined{color:#fff}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;background:#ccfbf1;color:var(--teald);font-size:12px;font-weight:800;border-radius:999px;padding:7px 13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(20,184,166,.5)}50%{opacity:.4;box-shadow:0 0 0 6px rgba(20,184,166,0)}}
.staff{display:flex;align-items:center;gap:9px}
.staff .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;display:grid;place-content:center;font-weight:800;font-size:14px}
.staff b{color:var(--ink);font-size:13px;display:block;line-height:1.2}.staff small{color:var(--mut);font-size:11px}
/* main */
.main{max-width:1360px;margin:0 auto;padding:22px 24px 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink)}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--teald);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--teal),var(--teal2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--teal)}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);margin-top:6px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;color:var(--ok);margin-top:3px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 19px;min-width:0}
.card>h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .material-symbols-outlined{color:var(--teal);font-size:20px}
.card>h3 .r{margin-left:auto;font-size:12px;font-weight:800;color:var(--teald)}
/* occupancy board */
.roomlegend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;font-weight:700;color:var(--body)}
.roomlegend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.d-empty{background:#e2f3ef;border:1px solid #bfe6de}.d-in{background:var(--teal)}.d-clean{background:var(--amber)}.d-out{background:var(--blue)}
.zone{font-size:12px;font-weight:800;color:var(--teald);margin:16px 0 9px;display:flex;align-items:center;gap:7px}
.zone .material-symbols-outlined{font-size:18px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.room{border-radius:14px;padding:12px;border:1px solid var(--line);background:#fff;position:relative;min-height:104px;display:flex;flex-direction:column;gap:4px;min-width:0}
.room.in{border-color:var(--teal);background:linear-gradient(160deg,#effffb,#dff7f2)}
.room.clean{border-color:#fcd9a3;background:#fffaf0}
.room.out{border-color:#bfdbfe;background:#f0f7ff}
.room .rno{font-size:12px;font-weight:800;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.room .sdot{width:9px;height:9px;border-radius:3px}
.room .pn{font-family:"Noto Sans TC";font-weight:900;color:var(--ink);font-size:15px;display:flex;align-items:center;gap:5px}
.room .pn .material-symbols-outlined{font-size:17px;color:var(--teal)}
.room .meta{font-size:11px;color:var(--mut);margin-top:auto;line-height:1.4}
.room .st{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px}
.st-in{background:#ccfbf1;color:var(--teald)}.st-clean{background:#fef3c7;color:#b45309}.st-out{background:#dbeafe;color:#1d4ed8}.st-empty{background:#eef5f3;color:var(--mut)}
.room.empty{background:#f7fbfa;border-style:dashed}
.room.empty .pn{color:var(--mut);font-weight:700;font-size:13px}
/* checklist */
.pethead{display:flex;align-items:center;gap:13px;margin-bottom:16px;flex-wrap:wrap}
.pethead .pav{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;display:grid;place-content:center;font-size:26px;flex:none}
.pethead b{font-size:18px;color:var(--ink);font-family:"Noto Sans TC"}
.pethead small{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk .cbox{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-content:center;font-size:16px}
.chk.done .cbox{background:var(--teal);color:#fff}
.chk.wait .cbox{background:#fff;border:2px solid var(--line);color:transparent}
.chk.now .cbox{background:#fff;border:2px solid var(--amber);color:var(--amber);animation:pulse 1.5s infinite}
.chk .ci{flex:1;min-width:0}.chk .ci b{color:var(--ink);font-size:13.5px;font-family:"Noto Sans TC"}
.chk .ci small{display:block;color:var(--mut);font-size:11.5px}
.chk .ct{font-size:12px;font-weight:800;color:var(--teald);white-space:nowrap;text-align:right}
.chk.wait .ct{color:var(--mut)}.chk.now .ct{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}
.p-teal{background:#ccfbf1;color:var(--teald)}.p-amber{background:#fef3c7;color:#b45309}.p-blue{background:#dbeafe;color:#1d4ed8}.p-pink{background:#fce7f3;color:#be185d}.p-red{background:#fee2e2;color:#b91c1c}.p-gray{background:#eef5f3;color:var(--mut)}.p-purple{background:#ede9fe;color:#6d28d9}
/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--body)}
.tbl tr:hover td{background:var(--bg)}
.tbl .nm{font-weight:800;color:var(--ink)}
/* appointment / timeline */
.apt{display:flex;gap:13px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.apt:first-of-type{border-top:0}
.apt .tm{font-weight:900;color:var(--teald);font-size:14px;width:52px;flex:none}
.apt .ab{min-width:0}.apt .ab b{color:var(--ink);font-family:"Noto Sans TC";font-size:13.5px}
.apt .ab small{display:block;color:var(--mut);font-size:11.5px}
.apt .ar{margin-left:auto;text-align:right;flex:none}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--body)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #ccfbf1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#ccfbf1;border-color:var(--teal);color:var(--teald)}
.chip .material-symbols-outlined{font-size:16px}
/* member card */
.member{display:flex;gap:13px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}
.member .mav{width:48px;height:48px;border-radius:14px;background:#ccfbf1;color:var(--teald);display:grid;place-content:center;font-size:24px;flex:none}
.member b{color:var(--ink);font-family:"Noto Sans TC";font-size:14px}
.member small{color:var(--mut);font-size:11.5px;display:block}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar span{display:block;height:100%;border-radius:999px}
.chart{width:100%;height:250px}
/* bill */
.bill{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line);font-size:13px;gap:10px}
.bill:first-of-type{border-top:0}
.bill .bn{color:var(--body)}.bill .bn small{color:var(--mut);font-size:11px;display:block}
.bill .bv{font-weight:800;color:var(--ink);font-family:Inter;white-space:nowrap}
.billtot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:13px;border-top:2px solid var(--ink)}
.billtot b{font-size:15px;color:var(--ink)}.billtot .tv{font-size:26px;font-weight:900;color:var(--teald);font-family:Inter}
.note{background:var(--bg);border-radius:12px;padding:13px 15px;font-size:12.5px;color:var(--body);line-height:1.7}
@media(max-width:960px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3,.form{grid-template-columns:1fr!important}}
@media(max-width:560px){.nav button span.lbl{display:none}.nav button{padding:9px 11px}.brand small{display:none}.tb-r .staff{display:none}.main{padding:16px 14px 34px}.vh h2{font-size:19px}}
</style>
</head>

function show(i){
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];vact.innerHTML=ACT[i];

}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
