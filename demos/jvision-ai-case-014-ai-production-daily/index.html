<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI 報工日報助理 · Production Daily</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#7C3AED;
  --color-on-primary:#FFFFFF;
  --color-secondary:#6366F1;
  --color-on-secondary:#000000;
  --color-accent:#EC4899;
  --color-on-accent:#000000;
  --color-background:#FAF5FF;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F7F3FD;
  --color-muted-foreground:#475569;
  --color-border:#EFE7FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#7C3AED;
  --blue:#7C3AED;
  --ink:#0F172A;
  --muted:#475569;
  --line:#D8C9EE;
  --ok:#047857;
  --warn:#A85400;
  --bad:#DC2626;
  --grid:rgba(124,58,237,.075);
  --shadow:7px 7px 0 #0F172A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  font-family:"Fira Sans",sans-serif;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
button{font:inherit}
button,a{cursor:pointer}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:22px;
  padding:12px clamp(14px,3vw,32px);
  background:#fff;
  border-bottom:3px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:12px;min-width:250px}
.logo{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent);
  font-family:"Fira Code",monospace;
  font-weight:700;
}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.15}
.brand span{
  display:block;
  margin-top:4px;
  color:var(--color-primary);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
}
.nav{
  display:flex;
  flex:1;
  justify-content:flex-end;
  gap:5px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
  padding:9px 10px;
  color:var(--muted);
  background:#fff;
  border:2px solid transparent;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s,color .18s,border-color .18s,transform .18s;
}
.nav button:hover{color:var(--ink);background:var(--color-muted);border-color:var(--ink)}
.nav button.on{
  color:#fff;
  background:var(--color-primary);
  border-color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  transform:translate(-2px,-2px);
}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.wrap{width:min(1320px,100%);margin:0 auto;padding:28px clamp(14px,3vw,34px) 54px}
.vh{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:20px;
  margin-bottom:22px;
}
.vh h2{
  margin:0;
  max-width:760px;
  font-size:clamp(28px,4vw,54px);
  line-height:.95;
  letter-spacing:-2px;
  font-weight:800;
}
.vh p{
  max-width:680px;
  margin:12px 0 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}
.live{
  align-self:center;
  padding:9px 12px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.live::before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:8px;
  background:var(--ok);
  border:1px solid var(--ink);
  animation:pulse 1.6s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.35}}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:20px;
}
.kpi{
  position:relative;
  min-height:138px;
  overflow:hidden;
  padding:17px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
}
.kpi:nth-child(2n){transform:translateY(6px)}
.kpi::after{
  content:"";
  position:absolute;
  right:-24px;
  bottom:-32px;
  width:86px;
  height:86px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  transform:rotate(18deg);
}
.kpi .l{
  padding-right:34px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.35px;
  text-transform:uppercase;
}
.kpi .v{
  position:relative;
  z-index:1;
  margin-top:13px;
  font-family:"Fira Code",monospace;
  font-size:clamp(23px,2.5vw,32px);
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi .d{position:relative;z-index:1;margin-top:10px;font-size:11px;font-weight:700}
.kpi .ic{
  position:absolute;
  right:13px;
  top:13px;
  color:var(--color-primary);
  font-size:24px;
}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.25fr) minmax(320px,.85fr)}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card,.ai{
  min-width:0;
  padding:18px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:var(--shadow);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 17px;
  padding-bottom:11px;
  border-bottom:2px solid var(--ink);
  font-size:14px;
  font-weight:800;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card h3 .r{margin-left:auto}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#065F46;background:#D1FAE5}
.t-warn{color:#7C3D00;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#5B21B6;background:#EDE9FE}
.t-run{color:#831843;background:#FCE7F3}
.chart{height:250px}
.scroll{overflow-x:auto;border:2px solid var(--ink)}
table.data{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
table.data th,table.data td{
  padding:11px 10px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  position:sticky;
  top:0;
  color:#fff;
  background:var(--color-primary);
  font-size:11px;
  font-weight:700;
  letter-spacing:.35px;
}
table.data tr:nth-child(even) td{background:var(--color-muted)}
table.data tr:hover td{background:#F3E8FF}
table.data th:nth-child(n+4):nth-child(-n+7),
table.data td:nth-child(n+4):nth-child(-n+7){text-align:right}
table.data td:first-child,table.data td:last-child,table.data td b{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.lines{display:flex;flex-direction:column;gap:15px}
.lr{display:grid;grid-template-columns:90px 1fr 54px;gap:11px;align-items:center}
.lr b{font-size:12px}
.bar{height:17px;background:var(--color-muted);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;border-right:2px solid var(--ink)}
.lr small{
  color:var(--ink)!important;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;display:inline-block;border:1px solid var(--ink)}
.ai{
  position:relative;
  overflow:hidden;
  background:#F3E8FF;
  box-shadow:8px 8px 0 var(--color-primary);
}
.ai::before{
  content:"AI";
  position:absolute;
  right:-7px;
  top:-22px;
  color:rgba(124,58,237,.12);
  font-family:"Fira Code",monospace;
  font-size:108px;
  font-weight:700;
  line-height:1;
}
.ai .ahd{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:15px;
  padding-bottom:14px;
  border-bottom:3px solid var(--ink);
}
.ai .aic{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--color-accent);
}
.ai .ahd b{display:block;font-size:15px;font-weight:800}
.ai .ahd small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.ai .ins{position:relative;display:flex;flex-direction:column;gap:9px}
.ai .li{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:11px 12px;
  background:#fff;
  border:2px solid var(--ink);
}
.ai .li .material-symbols-outlined{flex:none;color:var(--color-primary);font-size:19px}
.ai .li.g .material-symbols-outlined{color:var(--ok)}
.ai .li.w .material-symbols-outlined{color:var(--warn)}
.ai .li.b .material-symbols-outlined{color:var(--bad)}
.ai .li b{font-size:12.5px}
.ai .li p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
.chips{position:relative;display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chip{
  padding:5px 9px;
  color:#5B21B6;
  background:#fff;
  border:1px solid var(--color-primary);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.tl{position:relative;padding-left:32px}
.tl::before{
  content:"";
  position:absolute;
  left:9px;
  top:5px;
  bottom:5px;
  width:4px;
  background:var(--ink);
}
.tl .ti{position:relative;padding:0 0 21px 8px}
.tl .ti:last-child{padding-bottom:0}
.tl .ti::before{
  content:"";
  position:absolute;
  left:-31px;
  top:2px;
  width:15px;
  height:15px;
  background:var(--color-primary);
  border:3px solid #fff;
  outline:2px solid var(--ink);
}
.tl .ti.done::before{background:var(--ok)}
.tl .ti.warn::before{background:var(--warn)}
.tl .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tl .hd b{font-size:13px}
.tl .tm{
  padding:2px 5px;
  color:#fff;
  background:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.tl small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.55}
.anom{display:flex;flex-direction:column;gap:11px}
.an{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--warn);
}
.an.bad{box-shadow:4px 4px 0 var(--bad)}
.an.info{box-shadow:4px 4px 0 var(--color-primary)}
.an .ix{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  color:#fff;
  border:2px solid var(--ink);
}
.an .mid b{font-size:12.5px}
.an .mid small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.45}
.an .rt{text-align:right}
.imp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.ic2{
  padding:13px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-primary);
}
.ic2 b{font-size:12px}
.ic2 .big{
  margin-top:7px;
  color:var(--color-primary);
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
}
.ic2 small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.hand{display:flex;flex-direction:column;gap:10px}
.ho{
  display:flex;
  gap:11px;
  align-items:center;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
}
.ho .bx{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  border:1px solid var(--ink);
}
.ho .mid{flex:1;min-width:0}
.ho .mid b{font-size:12px}
.ho .mid small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px}
.signbtn{
  width:100%;
  margin-top:14px;
  padding:13px;
  color:#fff;
  background:var(--color-primary);
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--color-accent);
  font-weight:800;
  transition:background-color .18s,transform .18s,box-shadow .18s;
}
.signbtn:hover{background:#6D28D9;transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--color-accent)}
.grid-item,.kpi,.card,.ai{animation:enter .4s cubic-bezier(.34,1.56,.64,1) both}
.kpi:nth-child(2),.grid>*:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1}}
@media(max-width:1024px){
  .top{align-items:flex-start;flex-direction:column;gap:10px}
  .brand{min-width:0}
  .nav{width:100%;justify-content:flex-start}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .vh{grid-template-columns:1fr}
  .live{justify-self:start}
  .g11,.g3,.two{grid-template-columns:1fr}
  .an{grid-template-columns:40px 1fr}
  .an .rt{grid-column:2;text-align:left}
}
@media(max-width:520px){
  .wrap{padding-top:20px}
  .nav button{min-width:44px;min-height:44px;justify-content:center}
  .nav button span:not(.material-symbols-outlined){display:none}
  .kpis{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
  .vh h2{font-size:34px}
  .lr{grid-template-columns:76px 1fr 44px;gap:7px}
  .card,.ai{padding:14px;box-shadow:5px 5px 0 var(--ink)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .grid-item,.kpi,.card,.ai{opacity:1;transform:none;animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">報</div><div><b>AI 報工日報助理</b><span>PRODUCTION DAILY ASSISTANT</span></div></div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">日報總覽</h2><p id="vd"></p></div><div class="live" id="live">2026-08-13 早班 · 已彙整 5 條產線</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["日報總覽","summarize","日報總覽","當日產量、達成率與各線報工戰情"],
["報工彙整","fact_check","報工彙整","各產線報工、工時與產量計數自動蒐集"],
["AI 日報摘要","auto_awesome","AI 日報摘要","生成式重點洞察、異常歸因與明日建議"],
["異常標記","report","異常標記","停線、缺料與品質異常標記與影響排序"],
["產量趨勢","trending_up","產量趨勢","近 7 日產量、良率與達成率走勢"],
["交班紀錄","swap_horiz","交班紀錄","班別交接事項、待辦與簽核時間軸"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+'</span><span>'+m[0]+"</span>";
  b.onclick=()=>{location.hash="v"+i};
  nav.appendChild(b);
});
const LINES=[["A 線 · 沖壓",4800,4720,99.1,98],["B 線 · 焊接",3600,3180,97.4,88],["C 線 · 組裝",5200,5240,99.6,101],["D 線 · 塗裝",2800,2510,96.2,90],["E 線 · 檢包",4200,4290,99.8,102]];
function achColor(v){return v>=100?"#047857":v>=95?"#7C3AED":v>=88?"#A85400":"#DC2626"}
const WR=[["WO-2408-118","A 線","外殼沖壓件",4800,4720,4678,42,"14:20"],["WO-2408-119","B 線","車架焊接總成",3600,3180,3097,83,"14:05"],["WO-2408-121","C 線","控制盒組裝",5200,5240,5219,21,"14:32"],["WO-2408-122","D 線","面板噴塗",2800,2510,2415,95,"13:48"],["WO-2408-124","E 線","成品檢驗包裝",4200,4290,4281,9,"14:40"]];
