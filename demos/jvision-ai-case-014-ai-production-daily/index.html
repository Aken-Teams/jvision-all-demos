<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI 報工日報助理 · Production Daily</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#db2777;--accent2:#ec4899;--ink:#2a0d1c;--bg:#fdf2f8;--card:#fff;--line:#f3d6e6;--mut:#8a5d72;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--slate:#334155}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap;box-shadow:0 1px 0 rgba(219,39,119,.06)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(219,39,119,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#fce7f3;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(219,39,119,.35)}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fce7f3;color:#be185d;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.live::before{content:"● ";animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(219,39,119,.12),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.30}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.25fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .r{margin-left:auto}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#fce7f3;color:#be185d}.t-run{background:#fbcfe8;color:#9d174d}
.chart{height:250px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fdeef6}
table.data td b{font-family:Inter}
.scroll{overflow-x:auto}
.lines{display:flex;flex-direction:column;gap:11px}
.lr{display:grid;grid-template-columns:74px 1fr 54px;gap:11px;align-items:center}
.lr b{font-size:12.5px;font-family:"Noto Sans TC"}
.bar{height:13px;background:#fbe4f0;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lr small{font-size:12.5px;font-weight:700;text-align:right;font-family:Inter}
/* AI summary card */
.ai{border:1px solid #f5b4d5;background:linear-gradient(135deg,#fdf2f8,#fef6fb);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.ai::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.15),transparent 70%)}
.ai .ahd{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap}
.ai .aic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(219,39,119,.32)}
.ai .ahd b{font-family:"Noto Sans TC";font-size:15px;font-weight:800;display:block}
.ai .ahd small{color:var(--mut);font-size:11px}
.ai .ins{display:flex;flex-direction:column;gap:10px}
.ai .li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.ai .li .material-symbols-outlined{font-size:19px;flex:none;color:var(--accent)}
.ai .li.g .material-symbols-outlined{color:var(--ok)}.ai .li.w .material-symbols-outlined{color:var(--warn)}.ai .li.b .material-symbols-outlined{color:var(--bad)}
.ai .li b{font-size:12.5px;font-family:"Noto Sans TC"}
.ai .li p{margin:2px 0 0;font-size:11.5px;color:var(--mut);line-height:1.6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--accent)}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--accent),var(--accent2))}
.tl .ti{position:relative;padding:0 0 16px 6px}
.tl .ti:last-child{padding-bottom:0}
.tl .ti::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl .ti.done::before{background:var(--ok);box-shadow:0 0 0 2px #86efac}
.tl .ti.warn::before{background:var(--warn);box-shadow:0 0 0 2px #fcd34d}
.tl .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .hd b{font-family:"Noto Sans TC";font-size:13px}
.tl .tm{font-family:Inter;font-weight:700;font-size:11.5px;color:var(--accent)}
.tl small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;line-height:1.6}
/* anomaly list */
.anom{display:flex;flex-direction:column;gap:10px}
.an{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:11px 13px}
.an.bad{border-left-color:var(--bad)}.an.info{border-left-color:var(--accent)}
.an .ix{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.an .ix .material-symbols-outlined{font-size:20px}
.an .mid b{font-size:13px;font-family:"Noto Sans TC"}
.an .mid small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.an .rt{text-align:right}
.imp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ic2{border:1px solid var(--line);border-radius:13px;padding:13px;border-top:4px solid var(--accent);background:#fff}
.ic2 b{font-family:"Noto Sans TC";font-size:13.5px}
.ic2 .big{font-family:Inter;font-weight:800;font-size:22px;color:var(--accent);margin-top:4px}
.ic2 small{color:var(--mut);font-size:11px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.hand{display:flex;flex-direction:column;gap:10px}
.ho{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:11px;align-items:center}
.ho .bx{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ho .mid{flex:1;min-width:0}
.ho .mid b{font-size:12.5px;font-family:"Noto Sans TC"}
.ho .mid small{color:var(--mut);font-size:11px;display:block}
.signbtn{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;padding:12px;border-radius:11px;font:inherit;font-weight:800;font-size:14px;font-family:"Noto Sans TC";cursor:pointer;box-shadow:0 6px 16px rgba(219,39,119,.3)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.two{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">報</div><div><b>AI 報工日報助理</b><span>PRODUCTION DAILY ASSISTANT</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">日報總覽</h2><p id="vd"></p></div><div class="live" id="live">2026-08-13 早班 · 已彙整 5 條產線</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["日報總覽","summarize","日報總覽","當日產量、達成率與各線報工戰情"],
["報工彙整","fact_check","報工彙整","各產線報工、工時與產量計數自動蒐集"],
["AI 日報摘要","auto_awesome","AI 日報摘要","生成式重點洞察、異常歸因與明日建議"],
["異常標記","report","異常標記","停線、缺料與品質異常標記與影響排序"],
["產量趨勢","trending_up","產量趨勢","近 7 日產量、良率與達成率走勢"],
["交班紀錄","swap_horiz","交班紀錄","班別交接事項、待辦與簽核時間軸"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

// 各產線報工 [線, 計畫, 實績, 良率%, 達成%]
const LINES=[["A 線 · 沖壓",4800,4720,99.1,98],["B 線 · 焊接",3600,3180,97.4,88],["C 線 · 組裝",5200,5240,99.6,101],["D 線 · 塗裝",2800,2510,96.2,90],["E 線 · 檢包",4200,4290,99.8,102]];
function achColor(v){return v>=100?'#15803d':v>=95?'#db2777':v>=88?'#d97706':'#dc2626';}
// 報工明細 [工單, 產線, 品項, 計畫, 實績, 良品, 不良, 回報時間]
const WR=[["WO-2408-118","A 線","外殼沖壓件",4800,4720,4678,42,"14:20"],["WO-2408-119","B 線","車架焊接總成",3600,3180,3097,83,"14:05"],["WO-2408-121","C 線","控制盒組裝",5200,5240,5219,21,"14:32"],["WO-2408-122","D 線","面板噴塗",2800,2510,2415,95,"13:48"],["WO-2408-124","E 線","成品檢驗包裝",4200,4290,4281,9,"14:40"]];
// 異常 [色, icon, 標題, 說明, 影響, 等級, cls]
const ANOM=[["#dc2626","block","B 線焊接停線 42 分","二號焊接機械手臂感測異常，13:10-13:52 停機","產出 -420 pcs · 交期風險","高","bad"],["#d97706","inventory_2","D 線塗裝面漆缺料","白色面漆庫存 08:00 見底，等待補料 1.5 小時","達成率 -10% · 待補 380 pcs","中","warn"],["#d97706","rule","B 線焊道不良率偏高","焊道氣孔不良 2.6%，超出管制上限 1.5%","重工 83 件 · 需調機","中","warn"],["#db2777","schedule","A 線換模逾時","模具切換耗時 34 分，較標準多 12 分","損失 12 分 · SMED 待優化","低","info"]];
// 交班 [時間, 狀態(done/warn/''), 標題, 說明, 對象]
const HAND=[["07:00","done","早班開班點檢完成","5 條產線設備點檢 OK，物料備妥率 92%","生管 · 林"],["10:30","warn","B 線停線通報交接","焊接手臂維修中，已通報保養組張工，預計 13:00 復機","製造課 · 李"],["13:52","done","B 線復機並補產","焊接機復機，加開 1 小時追產 260 pcs","製造課 · 李"],["16:00","warn","中班待辦移交","D 線白漆補料需持續追蹤；B 線不良品 83 件待重工","廠長 · 王"]];
// 交班待辦 [色, icon, 事項, 對象]
const TODO=[["#dc2626","priority_high","B 線 83 件焊接不良品重工","中班 · 焊接組"],["#d97706","inventory","確認 D 線白色面漆補料到位","中班 · 物料組"],["#db2777","build","A 線換模 SMED 流程複盤","工程 · 陳"],["#15803d","check_circle","C/E 線維持節拍，無待辦","中班 · 組裝檢包"]];

const SCREENS=[
// v0 日報總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">inventory_2</span><div class="l">當日總產出</div><div class="v">19,940<small style="font-size:12px"> pcs</small></div><div class="d up">▲ 達成率 95.4%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">check_circle</span><div class="l">綜合良率</div><div class="v">98.6<small style="font-size:12px">%</small></div><div class="d up">▲ +0.3%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">report</span><div class="l">當班異常事件</div><div class="v" style="color:var(--bad)">4 <small style="font-size:12px">件</small></div><div class="d" style="color:var(--mut)">1 高 · 2 中 · 1 低</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">schedule</span><div class="l">停線累計</div><div class="v">42 <small style="font-size:12px">min</small></div><div class="d dn">▲ B 線焊接</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各產線今日達成率<span class="tag t-run r">目標 100%</span></h3>
  <div class="lines">${LINES.map(l=>`<div class="lr"><b>${l[0]}</b><div class="bar"><i style="width:${Math.min(l[4],100)}%;background:${l[4]>=100?'linear-gradient(90deg,#15803d,#22c55e)':l[4]>=95?'linear-gradient(90deg,#db2777,#ec4899)':l[4]>=88?'#d97706':'#dc2626'}"></i></div><small style="color:${achColor(l[4])}">${l[4]}%</small></div>`).join('')}</div>
  <div class="legend"><span><i class="dot" style="background:#15803d"></i>達標 ≥100%</span><span><i class="dot" style="background:#db2777"></i>接近 95-99%</span><span><i class="dot" style="background:#d97706"></i>落後 88-94%</span><span><i class="dot" style="background:#dc2626"></i>待處理 &lt;88%</span></div>
 </div>
 <div class="ai"><div class="ahd"><div class="aic"><span class="material-symbols-outlined">auto_awesome</span></div><div><b>AI 日報一句話</b><small>2026-08-13 早班 · 自動生成</small></div></div>
  <div class="ins">
   <div class="li g"><span class="material-symbols-outlined">thumb_up</span><div><b>整體達標 95.4%，C/E 線超前</b><p>組裝與檢包節拍穩定，可支援 B 線追產。</p></div></div>
   <div class="li b"><span class="material-symbols-outlined">warning</span><div><b>B 線焊接停線 42 分為今日最大缺口</b><p>拖低整廠達成率約 2 個百分點，已於 13:52 復機追產。</p></div></div>
   <div class="li w"><span class="material-symbols-outlined">inventory_2</span><div><b>D 線白漆缺料待追蹤</b><p>建議中班持續確認補料到位，避免二次停線。</p></div></div>
  </div>
  <div class="chips"><span class="chip">達成率 95.4%</span><span class="chip">良率 98.6%</span><span class="chip">異常 4 件</span></div>
 </div>
</div>`,
// v1 報工彙整
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">receipt_long</span><div class="l">已彙整工單</div><div class="v">5 <small style="font-size:12px">張</small></div><div class="d up">▲ 自動蒐集 100%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">groups</span><div class="l">報工人數</div><div class="v">38 <small style="font-size:12px">人</small></div><div class="d" style="color:var(--mut)">早班 · 5 產線</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">timer</span><div class="l">總報工工時</div><div class="v">37.2 <small style="font-size:12px">h</small></div><div class="d" style="color:var(--mut)">平均 7.44 h/線</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">sync</span><div class="l">最後同步</div><div class="v">14:40</div><div class="d up">▲ 自動·免手填</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">fact_check</span>各產線報工明細（計畫 vs 實績）</h3>
  <div class="scroll"><table class="data"><tr><th>工單</th><th>產線</th><th>品項</th><th>計畫</th><th>實績</th><th>良品</th><th>不良</th><th>回報</th></tr>
  ${WR.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3].toLocaleString()}</td><td><b>${w[4].toLocaleString()}</b></td><td style="color:var(--ok)">${w[5].toLocaleString()}</td><td style="color:${w[6]>50?'var(--bad)':'var(--mut)'}">${w[6]}</td><td>${w[7]}</td></tr>`).join('')}
  </table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>計畫 / 實績 / 不良對比</h3><div class="chart" id="c_wr" style="height:290px"></div></div>
</div>`,
// v2 AI 日報摘要
()=>`<div class="ai"><div class="ahd"><div class="aic"><span class="material-symbols-outlined">auto_awesome</span></div><div><b>AI 生成日報摘要</b><small>依 5 條產線報工、異常與趨勢資料生成 · 08-13 15:00</small></div><span class="tag t-run r" style="margin-left:auto">生成式摘要</span></div>
 <div class="ins">

   <div class="ho"><span class="bx" style="background:#db2777"><span class="material-symbols-outlined" style="font-size:17px">verified</span></span><div class="mid"><b>B 線 83 件重工全檢</b><small>負責：品保 · 黃 ｜ 期望：不良率回 &lt;1.5%</small></div><span class="tag t-info">中</span></div>

  </div>

</div>`,

function draw(i){
 if(i==1){
  const c=echarts.init(document.getElementById('c_wr'));c.setOption({grid:{left:44,right:14,top:30,bottom:24},tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},legend:{top:0,textStyle:{fontSize:11}},xAxis:{type:'category',data:LINES.map(l=>l[0].split(' ')[0]),axisLabel:{fontSize:11}},yAxis:{type:'value',axisLabel:{fontSize:11}},series:[{name:'計畫',type:'bar',data:WR.map(w=>w[3]),itemStyle:{color:'#f9a8d4'},barWidth:'30%'},{name:'實績',type:'bar',data:WR.map(w=>w[4]),itemStyle:{color:'#db2777'},barWidth:'30%'},{name:'不良',type:'bar',data:WR.map(w=>w[6]),itemStyle:{color:'#dc2626'},barWidth:'30%'}]});
 }
 if(i==2){
  const g=echarts.init(document.getElementById('c_gap'));g.setOption({tooltip:{trigger:'item',formatter:'{b}: {c} pcs ({d}%)'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['42%','70%'],center:['50%','44%'],avoidLabelOverlap:true,itemStyle:{borderColor:'#fff',borderWidth:2},label:{fontSize:11},data:[{value:420,name:'B 線停線',itemStyle:{color:'#dc2626'}},{value:380,name:'D 線缺料',itemStyle:{color:'#d97706'}},{value:83,name:'B 線重工',itemStyle:{color:'#db2777'}},{value:57,name:'其他微停',itemStyle:{color:'#f9a8d4'}}]}]});
 }
 if(i==3){
  const a=echarts.init(document.getElementById('c_an'));a.setOption({tooltip:{trigger:'item'},legend:{show:false},series:[{type:'pie',radius:['40%','68%'],center:['50%','50%'],itemStyle:{borderColor:'#fff',borderWidth:2},label:{fontSize:11,formatter:'{b}\n{c} 件'},data:[{value:1,name:'停線',itemStyle:{color:'#dc2626'}},{value:1,name:'缺料',itemStyle:{color:'#d97706'}},{value:1,name:'品質',itemStyle:{color:'#db2777'}},{value:1,name:'換模逾時',itemStyle:{color:'#ec4899'}}]}]});
 }
 if(i==4){
  const days=['8/7','8/8','8/9','8/10','8/11','8/12','8/13'];
  const t=echarts.init(document.getElementById('c_trend'));t.setOption({grid:{left:54,right:48,top:30,bottom:26},tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontSize:11}},xAxis:{type:'category',data:days,axisLabel:{fontSize:11}},yAxis:[{type:'value',name:'pcs',nameTextStyle:{fontSize:10},min:18000,max:22000,axisLabel:{fontSize:10}},{type:'value',name:'%',max:100,min:88,axisLabel:{fontSize:11,formatter:'{value}%'}}],series:[{name:'總產出',type:'bar',data:[19400,20100,19800,20600,21020,20340,19940],itemStyle:{color:'#f9a8d4',borderRadius:[5,5,0,0]},barWidth:'46%'},{name:'達成率',type:'line',yAxisIndex:1,smooth:true,data:[93,96,94,98,100,97,95],lineStyle:{color:'#db2777',width:3},itemStyle:{color:'#db2777'}}]});
  const q=echarts.init(document.getElementById('c_qty'));q.setOption({grid:{left:44,right:16,top:30,bottom:26},tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontSize:11}},xAxis:{type:'category',data:days,axisLabel:{fontSize:11}},yAxis:{type:'value',min:96,max:100,axisLabel:{fontSize:11,formatter:'{value}%'}},series:[{name:'綜合良率',type:'line',smooth:true,data:[98.1,98.4,98.2,98.7,98.8,98.5,98.6],areaStyle:{color:'rgba(219,39,119,.14)'},lineStyle:{color:'#db2777',width:3},itemStyle:{color:'#db2777'}},{name:'目標',type:'line',data:[98.5,98.5,98.5,98.5,98.5,98.5,98.5],symbol:'none',lineStyle:{color:'#94a3b8',type:'dashed',width:2}}]});
  const s=echarts.init(document.getElementById('c_stack'));s.setOption({grid:{left:54,right:16,top:30,bottom:26},tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontSize:11}},xAxis:{type:'category',data:days,axisLabel:{fontSize:11}},yAxis:{type:'value',name:'pcs',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},series:[['A 線','#db2777',4600],['B 線','#ec4899',3100],['C 線','#f472b6',5100],['D 線','#f9a8d4',2500],['E 線','#be185d',4100]].map((ln,idx)=>({name:ln[0],type:'line',stack:'p',areaStyle:{opacity:.7},smooth:true,symbol:'none',lineStyle:{width:1},itemStyle:{color:ln[1]},data:days.map((d,di)=>ln[2]+((di*13+idx*7)%9)*22)}))});
 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
