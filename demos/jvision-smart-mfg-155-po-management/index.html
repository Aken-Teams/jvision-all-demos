<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>採購訂單管理系統（PO Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&amp;family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root{
  --color-primary:#334155;
  --color-on-primary:#ffffff;
  --color-secondary:#475569;
  --color-on-secondary:#ffffff;
  --color-accent:#059669;
  --color-on-accent:#ffffff;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;

  --pink:var(--color-primary);
  --pink2:#64748b;
  --pink-soft:#eef2f4;
  --pink-line:#cbd5e1;
  --mut:var(--muted);
  --bg:var(--color-background);
  --card:var(--color-card);
  --ok:#047857;
  --warn:#a16207;
  --bad:var(--color-destructive);
  --info:#2563eb;

  --radius-sm:3px;
  --radius-md:5px;
  --radius-lg:8px;
  --font-display:"Cormorant Garamond","Noto Serif TC","PMingLiU",serif;
  --font-body:"Crimson Pro","Noto Serif TC","PMingLiU",serif;
  --font-label:"Cinzel","Noto Serif TC","PMingLiU",serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  background:var(--color-background);
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:#bbf7d0;color:#052e16}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:3px solid var(--color-accent);
}
.topbar-in{
  width:min(100%,1440px);
  min-height:66px;
  margin:0 auto;
  padding:9px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand .logo{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-items:center;
  color:#d1fae5;
  background:#1e293b;
  border:1px solid #64748b;
  border-radius:var(--radius-md);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand h1{
  margin:0;
  font-family:var(--font-display);
  font-size:19px;
  line-height:1.05;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:3px;
  color:#e2e8f0;
  font-size:12px;
  font-weight:400;
  letter-spacing:.02em;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:3px;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:#94a3b8 transparent;
}
.nav button{
  min-height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 11px;
  color:#f8fafc;
  background:transparent;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button:hover{background:#475569;border-color:#64748b}
.nav button.on{
  color:#052e16;
  background:#d1fae5;
  border-color:#6ee7b7;
}
.nav button.on::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  background:var(--color-accent);
  border-radius:50%;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:focus-visible{outline-color:#ffffff;outline-offset:-3px}

.wrap{width:min(100%,1440px);margin:0 auto;padding:18px 20px 42px}
#app>*,.grid-item{animation:panel-enter 380ms cubic-bezier(.2,.8,.2,1) both}
#app>*:nth-child(2){animation-delay:45ms}
#app>*:nth-child(3){animation-delay:90ms}
#app>*:nth-child(4){animation-delay:135ms}
@keyframes panel-enter{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.scr-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
  padding:0 0 13px;
  border-bottom:1px solid var(--color-border);
}
.scr-head h2{
  margin:0;
  font-family:var(--font-display);
  font-size:clamp(24px,2.2vw,32px);
  line-height:1.05;
  font-weight:700;
  letter-spacing:-.01em;
}
.scr-head p{
  max-width:820px;
  margin:5px 0 0;
  color:var(--color-muted-foreground);
  font-size:14px;
  line-height:1.4;
}
.pill{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:6px 11px;
  color:#064e3b;
  background:#d1fae5;
  border:1px solid #6ee7b7;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g23{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:12px}
.g32{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.65fr);gap:12px}

.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
}
.card{padding:14px}
.card h3{
  min-height:25px;
  margin:0 0 10px;
  display:flex;
  align-items:center;
  gap:7px;
  font-family:var(--font-display);
  font-size:17px;
  line-height:1.2;
  font-weight:700;
}
.card h3::after{
  content:"";
  height:1px;
  flex:1;
  margin-left:4px;
  background:var(--color-border);
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-accent)}
.card .sub{
  z-index:1;
  order:2;
  margin-left:auto;
  color:var(--color-muted-foreground);
  background:var(--color-card);
  font-family:var(--font-body);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}

.kpi{
  position:relative;
  overflow:hidden;
  padding:12px 14px 13px 17px;
  border-left:4px solid var(--color-primary);
  transition:background-color 180ms ease,border-color 180ms ease;
}
.kpi:hover{background:#f8fafc;border-left-color:var(--color-accent)}
.kpi::before{display:none}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--color-muted-foreground);
  font-size:13px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .val{
  margin-top:5px;
  font-family:var(--font-display);
  font-size:30px;
  line-height:1;
  font-weight:700;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{
  color:var(--color-muted-foreground);
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
}
.kpi .dt{
  min-height:18px;
  margin-top:5px;
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:12px;
  font-weight:600;
}
.up{color:#047857}.down{color:#b91c1c}

.tbl-wrap{
  width:100%;
  overflow:auto;
  background:#ffffff;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  scrollbar-color:#94a3b8 #f1f5f9;
}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
thead th{
  position:sticky;
  top:0;
  z-index:1;
  padding:9px 11px;
  color:#ffffff;
  background:var(--color-primary);
  border-right:1px solid #64748b;
  text-align:left;
  font-size:12px;
  font-weight:600;
  letter-spacing:.025em;
  white-space:nowrap;
}
thead th:last-child{border-right:0}
tbody td{
  height:39px;
  padding:8px 11px;
  border-top:1px solid var(--color-border);
  color:var(--color-foreground);
  white-space:nowrap;
}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#ecfdf5}
td:nth-last-child(-n+2),th:nth-last-child(-n+2){font-variant-numeric:tabular-nums}
td.mono{text-align:right}
td:first-child.mono{text-align:left}
.mono{
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums slashed-zero;
  font-weight:600;
  letter-spacing:-.02em;
}

.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:22px;
  padding:2px 7px;
  border:1px solid currentColor;
  border-radius:var(--radius-sm);
  font-size:11px;
  line-height:1.2;
  font-weight:600;
  white-space:nowrap;
}
.tag::before{content:"";width:5px;height:5px;flex:none;border:1px solid currentColor;border-radius:50%}
.t-ok{color:#065f46;background:#d1fae5}
.t-warn{color:#854d0e;background:#fef3c7}
.t-bad{color:#991b1b;background:#fee2e2}
.t-info{color:#1e40af;background:#dbeafe}
.t-mut{color:#475569;background:#f1f5f9}
.t-pink{color:#064e3b;background:#d1fae5}

.bar{
  height:7px;
  min-width:72px;
  overflow:hidden;
  background:#e2e8f0;
  border-radius:2px;
}
.bar>i{display:block;height:100%;background:var(--color-accent);border-radius:0}
.chart-box{position:relative;overflow:hidden}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.col{
  min-width:0;
  padding:8px;
  background:var(--color-muted);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
}
.col-h{
  min-height:32px;
  padding:2px 3px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--color-primary);
  font-size:13px;
  font-weight:700;
}
.col-h .cnt{
  min-width:25px;
  padding:1px 6px;
  color:#ffffff;
  background:var(--color-primary);
  border:1px solid var(--color-primary);
  border-radius:var(--radius-sm);
  text-align:center;
  font-family:var(--font-mono);
  font-size:11px;
}
.tk{
  margin-bottom:7px;
  padding:8px 9px;
  background:#ffffff;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  transition:background-color 180ms ease,border-color 180ms ease;
}
.tk:last-child{margin-bottom:0}
.tk:hover{background:#f8fafc;border-color:#94a3b8}
.tk .no{
  color:var(--color-primary);
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:700;
}
.tk .nm{margin:3px 0;font-size:13px;font-weight:600}
.tk .mt{
  margin-top:4px;
  display:flex;
  justify-content:space-between;
  gap:6px;
  color:var(--color-muted-foreground);
  font-size:11px;
}

.tl{position:relative;padding-left:2px}
.tl .step{position:relative;display:flex;gap:10px;padding-bottom:13px}
.tl .step:last-child{padding-bottom:0}
.tl .step:not(:last-child)::before{
  content:"";
  position:absolute;
  left:12px;
  top:25px;
  bottom:0;
  width:1px;
  background:#94a3b8;
}
.tl .mk{
  z-index:1;
  width:25px;
  height:25px;
  flex:none;
  display:grid;
  place-items:center;
  color:#ffffff;
  border:2px solid #ffffff;
  border-radius:50%;
}
.tl .mk .material-symbols-outlined{font-size:15px}
.tl .bd{min-width:0;flex:1}
.tl .bd .t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px;font-weight:600}
.tl .bd .d{margin-top:2px;color:var(--color-muted-foreground);font-size:12px}
.tl .bd .when{
  margin-top:2px;
  color:#065f46;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
}

.list{display:flex;flex-direction:column;gap:7px}
.li{
  min-width:0;
  min-height:49px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 9px;
  background:#ffffff;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  transition:background-color 180ms ease,border-color 180ms ease;
}
.li:hover{background:#f8fafc;border-color:#94a3b8}
.li .ic{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  color:#ffffff;
  background:var(--color-primary);
  border-radius:var(--radius-sm);
}
.li .ic .material-symbols-outlined{font-size:19px}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;font-size:13px;font-weight:600}
.li .tx span{display:block;color:var(--color-muted-foreground);font-size:12px;line-height:1.35}
.li .tx b .tag{display:inline-flex}

.diff-box{
  padding:10px 11px;
  background:#f8fafc;
  border:1px dashed #94a3b8;
  border-radius:var(--radius-md);
}
.diff-line{
  min-height:34px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:5px 0;
  border-bottom:1px solid var(--color-border);
  font-size:13px;
}
.diff-line:last-child{border-bottom:0}
.diff-line .fld{width:62px;flex:none;color:var(--color-muted-foreground);font-weight:600}
.strike{color:#991b1b;text-decoration:line-through;text-decoration-thickness:2px}
.newv{color:#047857;font-weight:700}
.mi{width:8px;height:8px;display:inline-block;border:1px solid currentColor;border-radius:1px}
.legend{display:flex;gap:11px;flex-wrap:wrap;margin-top:7px;color:var(--color-muted-foreground);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}

.stat-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.ss{
  padding:10px 12px;
  background:#ffffff;
  border:1px solid var(--color-border);
  border-top:3px solid var(--color-primary);
  border-radius:var(--radius-md);
  text-align:left;
}
.ss .v{
  font-family:var(--font-display);
  font-size:24px;
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.ss .l{margin-top:4px;color:var(--color-muted-foreground);font-size:12px}
.foot{
  margin-top:15px;
  padding-top:12px;
  color:var(--color-muted-foreground);
  border-top:1px solid var(--color-border);
  text-align:center;
  font-size:11px;
}

@media(max-width:1024px){
  .topbar-in{align-items:flex-start;flex-wrap:wrap;gap:7px 14px}
  .nav{width:100%;margin-left:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .topbar-in{padding-inline:14px}
  .wrap{padding:15px 14px 34px}
  .scr-head{align-items:flex-start;flex-direction:column}
  .g2{grid-template-columns:1fr}
  .card{padding:12px}
  .chart-box{max-height:260px}
  table{font-size:12px}
  thead th,tbody td{padding-inline:9px}
}
@media(max-width:480px){
  .topbar-in{padding:8px 10px}
  .brand .logo{width:36px;height:36px}
  .brand h1{font-size:17px}
  .brand small{font-size:10px}
  .nav button{min-width:42px;padding:8px 10px}
  .nav button span.lbl{display:none}
  .nav button.on::before{display:none}
  .wrap{padding:13px 10px 30px}
  .scr-head h2{font-size:25px}
  .pill{width:100%;justify-content:center}
  .kpis,.board,.stat-strip{grid-template-columns:1fr}
  .kpi{padding-block:11px}
  .kpi .val{font-size:27px}
  .card h3{font-size:16px}
  .col{padding:7px}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #app>*{opacity:1;transform:none}
}

@media(forced-colors:active){
  .tag,.pill,.nav button.on{border:2px solid currentColor}
  .bar>i{border:4px solid CanvasText}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">receipt_long</span></div>
      <div>
        <h1>採購訂單管理系統</h1>
        <small>PO Management · 供應商協同與交期控管</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<div class="wrap"><div id="app"></div>
  <div class="foot">採購訂單管理系統（PO Management）· 純前端展示 · 假資料僅供介面示意</div>
</div>

<script>
"use strict";
var NAVS=[
  {i:0,ic:"dashboard",t:"訂單總覽"},
  {i:1,ic:"description",t:"建立與版本"},
  {i:2,ic:"handshake",t:"供應商確認"},
  {i:3,ic:"history",t:"變更通知"},
  {i:4,ic:"monitoring",t:"交期追蹤"},
  {i:5,ic:"fact_check",t:"驗收結案"}
];
var app=document.getElementById("app");
var navEl=document.getElementById("nav");
navEl.innerHTML=NAVS.map(function(n){
  return '<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
}).join("");

var chartReg={};
function killCharts(){ for(var k in chartReg){ try{chartReg[k].destroy();}catch(e){} } chartReg={}; }

var PINK="#334155",PINK2="#64748b",OK="#059669",WARN="#b45309",BAD="#dc2626",INFO="#2563eb",GRID="#e6e8ea";

function head(title,desc,pill){
  return '<div class="scr-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="pill"><span class="material-symbols-outlined" style="font-size:16px">'+pill.ic+'</span>'+pill.t+'</div></div>';
}
function kpiMini(ic,l,v,u){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="val">'+v+' <small>'+u+'</small></div></div>';
}
function liRow(ic,l,v){

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i); }
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
