<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>採購訂單管理系統（PO Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --pink:#db2777; --pink2:#f472b6; --pink-soft:#fce7f3; --pink-line:#fbcfe8;
  --ink:#1f172b; --mut:#6b6473; --line:#ece7f0; --bg:#faf7fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#7c3aed;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#9d174d,#db2777 55%,#f472b6);color:#fff;box-shadow:0 4px 18px rgba(157,23,77,.22)}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.3)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.85;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:rgba(255,255,255,.1);color:#fff;padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;flex:none}
.nav button:hover{background:rgba(255,255,255,.22)}
.nav button.on{background:#fff;color:var(--pink)}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 46px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.scr-head h2{margin:0;font-size:21px;font-weight:800}
.scr-head p{margin:5px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pink-soft);color:#9d174d;border:1px solid var(--pink-line);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g23{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.g32{display:grid;grid-template-columns:1fr 1.6fr;gap:16px}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:480px){ .kpis{grid-template-columns:1fr} }
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 2px 10px rgba(31,23,43,.03)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--pink)}
.card .sub{color:var(--mut);font-size:12px;font-weight:500;margin-left:auto}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--pink),var(--pink2))}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--pink)}
.kpi .val{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--mut)}
.kpi .dt{font-size:11px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{background:var(--pink-soft);color:#9d174d;text-align:left;padding:10px 12px;font-weight:700;font-size:12px;white-space:nowrap}
tbody td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:#fdf2f8}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#ede9fe;color:#6d28d9}
.t-mut{background:#f1f0f3;color:#6b6473}
.t-pink{background:var(--pink-soft);color:#9d174d}
.bar{height:8px;border-radius:5px;background:#f1eef4;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pink),var(--pink2))}
.chart-box{position:relative;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.board{grid-template-columns:1fr}}
.col{background:#fbf7fa;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col-h{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:4px 6px 9px;color:#9d174d}
.col-h .cnt{background:#fff;border:1px solid var(--pink-line);border-radius:999px;padding:1px 8px;font-size:11px}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--pink2);border-radius:10px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.tk .no{font-size:11px;font-weight:800;color:var(--pink)}
.tk .nm{font-size:12.5px;font-weight:600;margin:3px 0}
.tk .mt{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:6px;margin-top:5px}
.tl{position:relative;padding-left:6px}
.tl .step{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl .step:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:-4px;width:2px;background:var(--pink-line)}
.tl .mk{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;z-index:1}
.tl .mk .material-symbols-outlined{font-size:16px}
.tl .bd{flex:1;min-width:0}
.tl .bd .t{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .bd .d{font-size:12px;color:var(--mut);margin-top:2px}
.tl .bd .when{font-size:11px;color:var(--pink);font-weight:700}
.list{display:flex;flex-direction:column;gap:9px}
.li{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.li .ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink)}
.li .ic .material-symbols-outlined{font-size:20px}
.li .tx{min-width:0;flex:1}
.li .tx b{font-size:13px;display:block}
.li .tx span{font-size:11.5px;color:var(--mut)}
.diff-box{border:1px dashed var(--pink-line);border-radius:12px;padding:12px;background:#fdf2f8}
.diff-line{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dotted var(--pink-line)}
.diff-line:last-child{border-bottom:0}
.diff-line .fld{width:64px;font-weight:600;color:var(--mut);flex:none}
.strike{text-decoration:line-through;color:var(--bad);opacity:.75}
.newv{color:var(--ok);font-weight:700}
.mi{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.stat-strip{grid-template-columns:1fr}}
.ss{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.ss .v{font-size:22px;font-weight:800}
.ss .l{font-size:11.5px;color:var(--mut);margin-top:3px}
.foot{margin-top:14px;font-size:11px;color:var(--mut);text-align:center}
@media(max-width:560px){ .nav button span.lbl{display:none} .nav button{padding:8px 10px} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">receipt_long</span></div>
      <div>
        <h1>採購訂單管理系統</h1>
        <small>PO Management · 供應商協同與交期控管</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<div class="wrap"><div id="app"></div>
  <div class="foot">採購訂單管理系統（PO Management）· 純前端展示 · 假資料僅供介面示意</div>
</div>

<script>
"use strict";
var NAVS=[
  {i:0,ic:"dashboard",t:"訂單總覽"},
  {i:1,ic:"description",t:"建立與版本"},
  {i:2,ic:"handshake",t:"供應商確認"},
  {i:3,ic:"history",t:"變更通知"},
  {i:4,ic:"monitoring",t:"交期追蹤"},
  {i:5,ic:"fact_check",t:"驗收結案"}
];
var app=document.getElementById("app");
var navEl=document.getElementById("nav");
navEl.innerHTML=NAVS.map(function(n){
  return '<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
}).join("");

var chartReg={};
function killCharts(){ for(var k in chartReg){ try{chartReg[k].destroy();}catch(e){} } chartReg={}; }

var PINK="#db2777",PINK2="#f472b6",OK="#16a34a",WARN="#d97706",BAD="#dc2626",INFO="#7c3aed",GRID="#f0e9f2";

function head(title,desc,pill){
  return '<div class="scr-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="pill"><span class="material-symbols-outlined" style="font-size:16px">'+pill.ic+'</span>'+pill.t+'</div></div>';
}
function kpiMini(ic,l,v,u){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="val">'+v+' <small>'+u+'</small></div></div>';
}
function liRow(ic,l,v){
  return '<div class="li"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div><div class="tx"><b>'+v+'</b><span>'+l+'</span></div></div>';
}

/* ===== Screen 0 : Dashboard ===== */
function s0(){
  var kpis=[
    {ic:"receipt_long",l:"在途採購訂單",v:"148",u:"張",dt:"+12",up:1},
    {ic:"payments",l:"未結採購金額",v:"3,842",u:"萬",dt:"+5.4%",up:1},
    {ic:"task_alt",l:"準時到貨率",v:"98.6",u:"%",dt:"+1.2%",up:1},
    {ic:"warning",l:"延誤風險訂單",v:"9",u:"張",dt:"-3",up:0}
  ];
  var rows=[
    ["PO-2408-1187","昇陽精密","CNC 主軸組件 ×120","218.4萬","08/18","確認","t-ok",92],
    ["PO-2408-1176","鴻運金屬","鋁擠型料 6063 ×2.4T","96.7萬","08/20","生產中","t-info",64],
    ["PO-2408-1169","立達電子","伺服驅動器 ×48","341.0萬","08/16","延誤","t-bad",38],
    ["PO-2408-1155","泰豐橡塑","密封膠圈 ×8600","12.3萬","08/15","待確認","t-warn",8],
    ["PO-2408-1142","協盛工業","鋼構支架 ×340","58.9萬","08/22","運送中","t-pink",81],
    ["PO-2408-1131","佳美化工","切削液 ×60桶","9.4萬","08/14","已到貨","t-ok",100]
  ];
  var html=head("訂單總覽儀表板","即時掌握在途訂單、採購金額、交期狀態與延誤風險，一頁式指揮中心。",{ic:"insights",t:"本月採購週期"});
  html+='<div class="kpis">'+kpis.map(function(k){
    return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="dt '+(k.up?'up':'down')+'"><span class="material-symbols-outlined" style="font-size:14px">'+(k.up?'trending_up':'trending_down')+'</span>'+k.dt+' 週對比</div></div>';
  }).join("")+'</div>';
  html+='<div class="g23" style="margin-top:16px">';
  html+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>採購金額 vs 準時到貨率<span class="sub">近 6 週</span></h3><div class="chart-box" style="height:280px"><canvas id="c0a"></canvas></div></div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>訂單狀態分布<span class="sub">148 張</span></h3><div class="chart-box" style="height:230px"><canvas id="c0b"></canvas></div>'
    +'<div class="legend"><span><i class="mi" style="background:'+PINK+'"></i>已確認</span><span><i class="mi" style="background:'+INFO+'"></i>生產中</span><span><i class="mi" style="background:'+PINK2+'"></i>運送中</span><span><i class="mi" style="background:'+WARN+'"></i>待確認</span><span><i class="mi" style="background:'+BAD+'"></i>延誤</span></div></div>';
  html+='</div>';
  html+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">list_alt</span>重點訂單追蹤<span class="sub">依交期排序</span></h3>';
  html+='<div class="tbl-wrap"><table><thead><tr><th>訂單編號</th><th>供應商</th><th>品項</th><th>金額</th><th>交期</th><th>狀態</th><th>進度</th></tr></thead><tbody>';
  html+=rows.map(function(r){
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td><td class="mono">'+r[4]+'</td><td><span class="tag '+r[6]+'">'+r[5]+'</span></td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+r[7]+'%"></i></div><span class="mono" style="font-size:11px">'+r[7]+'%</span></div></td></tr>';
  }).join("");
  html+='</tbody></table></div></div>';
  app.innerHTML=html;
  void app.offsetHeight;
  chartReg.c0a=new Chart(document.getElementById("c0a"),{
    data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
      datasets:[
        {type:"bar",label:"採購金額(萬)",data:[2980,3210,3050,3520,3680,3842],backgroundColor:"rgba(219,39,119,.28)",borderColor:PINK,borderWidth:1,borderRadius:6,yAxisID:"y"},
        {type:"line",label:"準時到貨率(%)",data:[91,93,94,96,97.4,98.6],borderColor:INFO,backgroundColor:INFO,tension:.35,pointRadius:3,yAxisID:"y1"}
      ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      scales:{y:{beginAtZero:true,grid:{color:GRID},title:{display:true,text:"金額(萬)"}},
        y1:{position:"right",min:80,max:100,grid:{drawOnChartArea:false},title:{display:true,text:"到貨率%"}}},
      plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}
  });
  chartReg.c0b=new Chart(document.getElementById("c0b"),{
    type:"doughnut",
    data:{labels:["已確認","生產中","運送中","待確認","延誤"],
      datasets:[{data:[52,41,28,18,9],backgroundColor:[PINK,INFO,PINK2,WARN,BAD],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}
  });
}

/* ===== Screen 1 : PO Create & Version ===== */
function s1(){
  var lines=[
    ["10","CNC 主軸組件","SPN-4420","72","$18,200","$1,310,400","08/18"],
    ["20","精密軸承 6208-2RS","BRG-6208","240","$860","$206,400","08/18"],
    ["30","伺服馬達 750W","SVM-750","24","$12,400","$297,600","08/20"],
    ["40","線性滑軌 HGH25","LMG-25","36","$4,150","$149,400","08/20"]
  ];
  var vers=[
    {v:"V3",cur:1,who:"陳采潔",when:"08/12 14:20",note:"調整第10項數量 60→72，交期順延 2 天",tag:"生效中",cls:"t-ok"},
    {v:"V2",cur:0,who:"陳采潔",when:"08/10 09:05",note:"新增第40項線性滑軌，付款條件改月結60天",tag:"已取代",cls:"t-mut"},
    {v:"V1",cur:0,who:"林昱辰",when:"08/08 16:41",note:"初版建立，共 3 品項送審",tag:"已取代",cls:"t-mut"}
  ];
  var html=head("採購訂單建立與版本","開立 PO、維護品項明細、審核與版本歷程，每次異動皆留下可稽核紀錄。",{ic:"description",t:"PO-2408-1187 · V3"});
  html+='<div class="g32">';
  html+='<div class="card"><h3><span class="material-symbols-outlined">assignment</span>訂單抬頭</h3>';
  html+='<div class="list">'
    +liRow("tag","訂單編號","PO-2408-1187")
    +liRow("storefront","供應商","昇陽精密機械股份有限公司")
    +liRow("payments","付款條件","月結 60 天 · TWD")
    +liRow("local_shipping","交貨地點","台中廠 · 收貨碼頭 B")
    +liRow("event","要求交期","2026-08-18")
    +liRow("badge","採購負責人","陳采潔（採購一課）")
    +'</div>';
  html+='<div class="diff-box" style="margin-top:12px"><div style="font-weight:700;font-size:13px;margin-bottom:6px">審核狀態</div>'
    +'<div class="tl"><div class="step"><div class="mk" style="background:'+OK+'"><span class="material-symbols-outlined">check</span></div><div class="bd"><div class="t">課級主管核准</div><div class="when">08/12 15:02 · 王志豪</div></div></div>'
    +'<div class="step"><div class="mk" style="background:'+OK+'"><span class="material-symbols-outlined">check</span></div><div class="bd"><div class="t">財務會簽</div><div class="when">08/12 16:30 · 蘇怡君</div></div></div>'
    +'<div class="step"><div class="mk" style="background:'+PINK+'"><span class="material-symbols-outlined">send</span></div><div class="bd"><div class="t">已發送供應商回簽</div><div class="when">待供應商確認</div></div></div></div></div>';
  html+='</div>';
  html+='<div style="display:flex;flex-direction:column;gap:16px;min-width:0">';
  html+='<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>品項明細<span class="sub">4 項</span></h3>';
  html+='<div class="tbl-wrap"><table><thead><tr><th>項次</th><th>品名</th><th>料號</th><th>數量</th><th>單價</th><th>小計</th><th>需求日</th></tr></thead><tbody>';
  html+=lines.map(function(l){
    return '<tr><td class="mono">'+l[0]+'</td><td>'+l[1]+'</td><td class="mono">'+l[2]+'</td><td class="mono">'+l[3]+'</td><td class="mono">'+l[4]+'</td><td class="mono">'+l[5]+'</td><td class="mono">'+l[6]+'</td></tr>';

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i); }
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
