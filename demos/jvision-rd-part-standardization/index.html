<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>零件標準化與共用件庫 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
/* 零件標準化與共用件庫｜Minimalism & Swiss Style */
:root{
  --color-primary:#15803d;
  --color-on-primary:#fff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#fff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#15803d;

  /* 外部介面名稱：必須保留 */
  --blue:#15803d;
  --ink:#14532d;
  --muted:#475569;
  --line:#bbf7d0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#dcfce7;
  --accent-soft2:#86efac;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#f7fcf8;
  --hov:#f0fdf4;
  --track:#dcfce7;
  --sidebar:#fff;
  --sidebar2:#fff;
  --side-edge:var(--color-border);
  --ok:#15803d;
  --warn:#b45309;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --r:4px;
  --shadow:0 1px 0 rgba(20,83,45,.08),0 8px 24px rgba(20,83,45,.05);
  --shadow-hover:0 1px 0 rgba(20,83,45,.12),0 12px 28px rgba(20,83,45,.09);
  --glow:rgba(21,128,61,.18);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Exo",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{margin:0;color:var(--ink);font-family:"Exo",sans-serif;letter-spacing:-.02em}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:400;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:3px;
}

/* 外框與頂部導覽 */
.app{display:flex;min-height:100vh;flex-direction:column}
.sidebar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  width:100%;
  min-width:0;
  height:72px;
  padding:0 32px;
  gap:28px;
  background:rgba(255,255,255,.96);
  color:var(--ink);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:12px;flex:none;min-width:0;padding:0}
.brand-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:2px;
  box-shadow:6px 6px 0 #bbf7d0;
}
.brand-logo .material-symbols-outlined{font-size:22px}
.brand-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.brand-txt span{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-family:"Roboto Mono",monospace;
  font-size:9px;
  letter-spacing:.12em;
}
.nav{display:flex;align-items:stretch;align-self:stretch;flex:1;min-width:0;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  min-height:44px;
  padding:0 16px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-radius:0;
  font-size:13px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  transition:color 220ms ease,background-color 220ms ease;
}
.nav button::after{
  content:"";
  position:absolute;
  right:16px;
  bottom:0;
  left:16px;
  height:3px;
  background:var(--color-primary);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform 220ms ease;
}
.nav button:hover{color:var(--ink);background:#f7fcf8}
.nav button.on{color:var(--color-primary);background:#f0fdf4}
.nav button.on::after{transform:scaleX(1)}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav .idx{
  margin-left:4px;
  color:inherit;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  opacity:.65;
}
.side-foot{display:none}
.main{flex:1;min-width:0;width:100%;max-width:1600px;margin:0 auto;padding:28px 40px 64px}

/* 畫面標題 */
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(21px,2vw,28px);font-weight:700}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:27px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:2px;
  font-size:11px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #dcfce7;animation:pulse 2s ease-in-out infinite}
.avatar{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;color:#fff;background:var(--color-primary);border-radius:50%;font-size:12px;font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.6}}

/* 網格與容器 */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform 220ms ease,border-color 220ms ease,box-shadow 220ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#86efac;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card,.sec{padding:20px}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{min-width:0}
.card-h .hint{color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px}

/* KPI 與資料磚 */
.kpi,.stat,.tile{position:relative;padding:18px 18px 18px 21px;overflow:hidden;border-left:4px solid var(--accent)}
.kpi::after{content:"";position:absolute;right:-25px;bottom:-32px;width:90px;height:90px;border:1px solid #dcfce7;border-radius:50%}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  color:var(--accent);
  background:var(--accent-soft);
  border-radius:2px;
}
.kpi .ico{position:absolute;top:16px;right:16px;z-index:1}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:0;padding-right:40px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:9px;
  color:var(--ink);
  font-family:"Roboto Mono",monospace;
  font-size:clamp(23px,2.2vw,29px);
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.05em;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Exo",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:7px}
.tile .ti{position:absolute;top:16px;right:16px}
.tile b{padding-right:42px;font-size:13px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}

/* 表格 */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
  padding:12px 14px;
  color:var(--muted);
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-align:left;
  white-space:nowrap;
}
th:first-child{border-left:0}
td{padding:12px 14px;border-bottom:1px solid #dcfce7;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color 200ms ease}
tbody tr:hover{background:var(--hov)}
th:not(:first-child),td:not(:first-child){text-align:right}
.mono,td:first-child{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
  letter-spacing:.01em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#f0fdf4}
.t-warn{color:#92400e;background:#fffbeb}
.t-bad{color:#991b1b;background:#fef2f2}
.t-info{color:#1e40af;background:#eff6ff}
.t-gray{color:#475569;background:#f1f5f9}
.t-acc,.t-pink{color:#166534;background:#ecfdf5}

/* 進度與量表 */
.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #bbf7d0;border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:600;text-align:right}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10px;text-align:right}

/* 時間軸與檢核 */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:5px;bottom:5px;left:7px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-25px;width:14px;height:14px;background:#fff;border:3px solid var(--accent);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px;line-height:1.7}

/* 看板與流程 */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{display:flex;flex-direction:column;gap:9px;min-width:0;padding:12px;background:#f7fcf8;border:1px solid var(--line);border-radius:2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;font-size:12px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:2px;font-family:"Roboto Mono",monospace;font-size:10px}
.pcard{padding:12px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;transition:transform 200ms ease,box-shadow 200ms ease}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px}
.pcard .who,.who{display:inline-flex;align-items:center;gap:6px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent);background:var(--accent-soft);border-radius:50%;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:2px}
.lane-row .num{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;color:var(--accent);background:var(--accent-soft);font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--muted);background:#fff;border:2px solid var(--line);border-radius:50%;font-family:"Roboto Mono",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:var(--accent);border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

/* 其他資料元件 */
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:2px}
.band .rng{position:absolute;top:0;bottom:0;background:#bbf7d0;border-radius:2px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:1px;box-shadow:0 2px 6px var(--glow)}

/* 每次切換 hash 後形成輕量章節揭示；DOM 本身始終保持完整可讀 */
#screen>.grid{animation:chapter-reveal 360ms ease-out both}
#screen>.grid:nth-child(2){animation-delay:70ms}
#screen>.grid:nth-child(3){animation-delay:140ms}
@keyframes chapter-reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding-right:24px;padding-left:24px}
}
@media(max-width:900px){
  .sidebar{height:auto;min-height:68px;padding:10px 18px;gap:16px;flex-wrap:wrap}
  .brand-txt span{display:none}
  .nav{order:2;width:100%;height:46px;flex-basis:100%}
  .nav button{padding:0 13px}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:700px){
  .main{padding:22px 16px 48px}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
  .card,.sec{padding:16px}
}
@media(max-width:560px){
  .g4,.board{grid-template-columns:1fr}
  .sidebar{padding-right:14px;padding-left:14px}
  .brand-logo{width:36px;height:36px}
  .nav button{min-width:46px;justify-content:center;padding:0 12px}
  .nav button .txt,.nav button .idx{display:none}
  .topbar h1{font-size:20px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .avatar{display:none}
  .kpi .val,.stat .val,.tile .tv{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>.grid{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">inventory_2</span></div>
      <div class="brand-txt"><b>共用件庫台</b><span>PART STANDARDIZATION</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">料號 12,480 項<br/>標準件 3,240 項<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

var CURVE="straight", BR=2;
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function _h(x,d){return typeof x==="number"?(x>0&&x<20?Math.round(d*x):x):d}
function mkArea(el,data,cats,name,x){push(el,{chart:Object.assign({},CB,{type:"area",height:_h(x,230)}),series:[{name:name,data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e7f4f3",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:3},colors:[typeof x==="string"?x:"#0d9488"],
 fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.38,opacityTo:.04,stops:[0,90]}},tooltip:{theme:"light"}})}
function mkBar(el,cats,data,name,horiz,a6,a7){
 var color=typeof a6==="string"?a6:"#0d9488", min=typeof a6==="number"?a6:undefined, h=_h(a7,230);

 xaxis:{categories:cats,labels:AX},yaxis:{min:min,labels:{style:AX.style}},grid:{borderColor:"#e7f4f3",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR,horizontal:!!horiz,columnWidth:"54%",barHeight:"60%"}},
 colors:[color],tooltip:{theme:"light"}})}
function mkStack(el,cats,series,horiz,h){push(el,{chart:Object.assign({},CB,{type:"bar",height:_h(h,245),stacked:true}),series:series,
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e7f4f3",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR?3:0,horizontal:!!horiz,columnWidth:"55%",barHeight:"62%"}},
 legend:{position:"bottom",fontSize:"11.5px"},colors:["#0d9488","#5fd3c6","#9fe5dd","#096b62","#c0e3e0","#064741"],tooltip:{theme:"light"}})}
function mkDonut(el,labels,data,h){push(el,{chart:Object.assign({},CB,{type:"donut",height:_h(h,240)}),series:data,labels:labels,
 colors:["#0d9488","#5fd3c6","#9fe5dd","#096b62","#c0e3e0","#064741"],legend:{position:"bottom",fontSize:"11.5px"},dataLabels:{enabled:false},
 plotOptions:{pie:{donut:{size:BR?"64%":"52%"}}},stroke:{width:2},tooltip:{theme:"light"}})}
function mkRadar(el,cats,data,name,h){push(el,{chart:Object.assign({},CB,{type:"radar",height:_h(h,270)}),series:[{name:name||"分數",data:data}],
 xaxis:{categories:cats},yaxis:{show:false},colors:["#0d9488"],markers:{size:4},dataLabels:{enabled:false},tooltip:{theme:"light"}})}
function mkLine2(el,cats,s1,s2,h){push(el,{chart:Object.assign({},CB,{type:"line",height:_h(h,240)}),series:[s1,s2],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e7f4f3",strokeDashArray:4},

 legend:{position:"top",fontSize:"11.5px"},tooltip:{theme:"light"}})}
function mkHeat(el,series,h){push(el,{chart:Object.assign({},CB,{type:"heatmap",height:_h(h,300)}),series:series,
 dataLabels:{enabled:false},xaxis:{labels:AX},yaxis:{labels:{style:AX.style}},

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
