<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>綠建築與廠房環境認證 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#D1FAE5;
  --accent-soft2:#ECFDF5;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#F0FDF4;
  --hov:#ECFDF5;
  --track:#DDEBE7;
  --sidebar:#053F32;
  --sidebar2:#064E3B;
  --side-edge:rgba(255,255,255,.14);
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#1D4ED8;
  --r:6px;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 24px rgba(6,78,59,.055);
  --shadow-hover:0 2px 3px rgba(6,78,59,.08),0 12px 30px rgba(6,78,59,.09);
  --glow:rgba(5,150,105,.2);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums lining-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans",sans-serif;color:var(--ink);line-height:1.25}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus{outline:none}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:4px}
::selection{background:#A7F3D0;color:#052E25}

.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;
  flex:none;
  min-width:0;
  min-height:100vh;
  padding:24px 16px 18px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  color:#F0FDF4;
  background:var(--sidebar);
  border-right:1px solid #065F46;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 8px 25px;border-bottom:1px solid var(--side-edge)}
.brand-logo{
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#052E25;
  background:#6EE7B7;
  border:1px solid #A7F3D0;
  border-radius:4px;
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#FFFFFF;font-size:15px;font-weight:700;letter-spacing:.02em}
.brand-txt span{display:block;margin-top:2px;color:#A7F3D0;font-family:"Fira Code",monospace;font-size:10px;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0;margin-top:20px}
.nav button{
  position:relative;
  min-width:0;
  min-height:44px;
  padding:10px 11px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:#D1FAE5;
  text-align:left;
  font-weight:500;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(167,243,208,.22);color:#FFFFFF;transform:translateX(2px)}
.nav button.on{background:#D1FAE5;border-color:#A7F3D0;color:#052E25;font-weight:700}
.nav button.on::before{content:"";position:absolute;left:-17px;top:8px;bottom:8px;width:3px;background:#6EE7B7}
.nav .idx{margin-left:auto;color:inherit;opacity:.7;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.side-foot{margin-top:auto;padding:16px 9px 0;border-top:1px solid var(--side-edge);color:#A7F3D0;font-size:10.5px;line-height:1.75}
.side-foot b{color:#FFFFFF;font-family:"Fira Code",monospace}

.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,42px) 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(20px,2vw,26px);font-weight:700;letter-spacing:-.025em}
.topbar h1 .material-symbols-outlined{width:34px;height:34px;display:grid;place-items:center;color:#FFFFFF;background:var(--accent);border-radius:4px;font-size:21px}
.topbar .sub{margin-top:6px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:7px 11px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:4px;color:#334155;font-size:11.5px;font-weight:600;box-shadow:0 1px 1px rgba(6,78,59,.03)}
.chip .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(4,120,87,.15);animation:pulse 2s ease-in-out infinite}
.avatar{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:4px;background:#064E3B;color:#FFFFFF;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.62;transform:scale(.88)}}

#screen{display:grid;grid-template-columns:392px minmax(0,1fr);grid-auto-rows:min-content;gap:16px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important;animation:reveal .36s ease-out both}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px;background:none!important;border:none!important;padding:0!important}
#screen>.grid.g4:first-child>*{flex:none!important;border:1px solid var(--line)!important;border-radius:var(--r)!important;background:var(--panel)!important;padding:16px!important}
#screen>.grid.g4:first-child>.tile .ti{width:34px;height:34px;margin:0;overflow:visible}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:318px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.sec,.kpi,.stat,.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card,.sec{min-width:0;padding:18px}
.sec{margin-bottom:16px}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease,background-color .22s ease}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#6EE7B7;box-shadow:var(--shadow-hover)}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;border-bottom:1px solid var(--line)}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.01em}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card-h .hint{color:var(--muted);font-size:11px;font-family:"Fira Code",monospace}
.sec>h3{margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.grid.g4:first-child{display:flex;gap:0;padding:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{flex:1 1 0;min-width:0;padding:17px 18px;border:0;border-right:1px solid var(--line);border-radius:0;background:none;box-shadow:none}
.grid.g4:first-child>:last-child{border-right:0}
.kpi,.stat{position:relative;min-width:0;padding:17px;overflow:hidden}
.kpi::after{display:none}
.kpi .ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border:1px solid #A7F3D0;border-radius:4px;color:var(--accent)}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:11.5px;font-weight:500}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{margin-top:4px;color:#052E25;font-family:"Fira Code",monospace;font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.25;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.tile{display:flex;flex-direction:column;gap:7px;min-width:0;padding:17px}
.tile .ti{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #A7F3D0;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:13px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}
.grid.g4:first-child>.tile{gap:5px}

.table-wrap,[style*="overflow-x:auto"]{scrollbar-color:#6EE7B7 #ECFDF5;scrollbar-width:thin}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums lining-nums}
th{padding:11px 14px;border-bottom:1px solid var(--line);background:var(--th);color:#334155;font-size:10.5px;font-weight:700;letter-spacing:.045em;text-align:left;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #D7EEE5;color:#173F35;white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--hov)}
td:nth-child(n+3),th:nth-child(n+3){font-variant-numeric:tabular-nums;text-align:right}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:0}
table b{font-weight:700;color:#052E25}

.tag{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:3px 8px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.t-ok{background:#D1FAE5;border-color:#6EE7B7;color:#065F46}
.t-warn{background:#FEF3C7;border-color:#FCD34D;color:#854D0E}
.t-bad{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B}
.t-info{background:#DBEAFE;border-color:#93C5FD;color:#1E40AF}
.t-gray{background:#F1F5F9;border-color:#CBD5E1;color:#475569}
.t-acc,.t-pink{background:#D1FAE5;border-color:#6EE7B7;color:#065F46}

.bar{height:7px;min-width:56px;overflow:hidden;border-radius:2px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-25px;top:3px;width:14px;height:14px;border:3px solid var(--accent);border-radius:50%;background:#FFFFFF}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;border:1px solid var(--line);border-radius:4px;background:var(--th)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#FFFFFF;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.pcard{padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;background:#FFFFFF}
.pcard:hover{border-color:#6EE7B7;box-shadow:var(--shadow);transform:translateY(-1px)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-family:"Fira Code",monospace;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10.5px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:#FFFFFF}
.lane-row:hover{border-color:#6EE7B7;box-shadow:var(--shadow)}
.lane-row .num{width:31px;height:31px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #A7F3D0;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:23px;height:23px;display:flex;align-items:center;justify-content:center;z-index:1;border:2px solid #CBD5E1;border-radius:50%;background:#FFFFFF;color:#64748B;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:#CBD5E1}
.steps .s.done{border-color:var(--accent);background:var(--accent);color:#FFFFFF}
.steps .s.cur{border-color:var(--accent);color:#047857;animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;position:relative;overflow:hidden;border-radius:2px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;border-radius:3px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:2px;background:var(--accent);box-shadow:0 2px 6px var(--glow)}

.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:4px!important;box-shadow:var(--shadow)!important}
.apexcharts-menu-icon,.apexcharts-reset-icon,.apexcharts-zoom-icon{cursor:pointer}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;min-height:0;position:static;padding:12px 14px;flex-direction:row;align-items:center;gap:8px;border-right:0;border-bottom:1px solid #065F46}
  .brand{padding:0 12px 0 3px;border:0}
  .brand-logo{width:36px;height:36px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}
  .nav button{min-height:42px;padding:8px 10px}
  .nav button.on::before{display:none}
  .nav button:hover{transform:none}
  .nav .idx{display:none}
  .main{padding:21px 16px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .grid.g4:first-child{flex-wrap:wrap}
  .grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{flex:1 1 46%;border-bottom:1px solid var(--line)}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
  .topbar{align-items:flex-start}
  .top-right{justify-content:flex-start}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
