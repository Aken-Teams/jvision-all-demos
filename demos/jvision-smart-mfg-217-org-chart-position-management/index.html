<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>組織圖與職位管理系統（Org Chart & Position Management）｜Jvision 系統 Demo</title>
  <meta name="description" content="動態組織圖視覺化、職位編制與員額管控、職位說明書（JD）管理與組織異動簽核" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --ok:#166534;
  --warn:#92400E;
  --danger:#B91C1C;
  --info:#075985;
  --ok-soft:#DCFCE7;
  --warn-soft:#FEF3C7;
  --danger-soft:#FEE2E2;
  --info-soft:#E0F2FE;
  --radius:0px;
  --shadow:7px 7px 0 #134E4A;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"Crimson Pro","Noto Serif TC","Noto Sans TC",Georgia,serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(13,148,136,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.12) 1px,transparent 1px);
  background-size:24px 24px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
::selection{background:var(--color-secondary);color:#0F172A}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

header.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(240,253,250,.97);
  border-bottom:3px solid var(--ink);
}
.topbar-inner{
  max-width:1440px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:stretch;
  gap:0;
  min-width:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:280px;
  padding:10px 18px 10px 0;
  border-right:3px solid var(--ink);
}
.brand .logo{
  width:44px;
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#062C2A;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent);
}
.brand .logo .material-symbols-outlined{font-size:25px;font-weight:700}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"Crimson Pro",serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  white-space:nowrap;
}
nav.nav{
  display:flex;
  align-items:stretch;
  gap:0;
  min-width:0;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:thin;
}
nav.nav button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:64px;
  padding:9px 13px;
  border:0;
  border-right:1px solid var(--line);
  background:transparent;
  color:#334155;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,box-shadow 180ms ease;
}
nav.nav button:first-child{border-left:1px solid var(--line)}
nav.nav button .material-symbols-outlined{font-size:19px}
nav.nav button:hover{background:#CCFBF1;color:#0F4C48}
nav.nav button.active{
  background:var(--color-primary);
  color:#001F1C;
  box-shadow:inset 0 -6px 0 var(--color-accent);
  font-weight:700;
}
nav.nav button:focus-visible,
a:focus-visible,
button:focus-visible,
[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:-4px;
  box-shadow:inset 0 0 0 2px #FFFFFF;
}

main{
  max-width:1440px;
  margin:0 auto;
  padding:30px 20px 72px;
  min-width:0;
}
.screen-head{
  position:relative;
  max-width:1000px;
  margin:0 0 24px;
  padding:22px 24px 20px;
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:9px 9px 0 var(--color-secondary);
}
.screen-head::after{
  content:"WORKFORCE / CONTROL";
  position:absolute;
  top:0;
  right:0;
  padding:5px 9px;
  background:var(--ink);
  color:#FFFFFF;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.screen-head .eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 9px;
  color:#062C2A;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.screen-head h1{
  max-width:760px;
  margin:13px 0 4px;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(30px,4vw,48px);
  font-weight:700;
  line-height:1.02;
  letter-spacing:-.02em;
}
.screen-head p{max-width:790px;margin:8px 0 0;color:#334155;font-size:15px;font-weight:600}

.grid{display:grid;gap:16px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-kpi .card:nth-child(even){transform:translateY(7px)}
.g-2{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 330px}
.card{
  position:relative;
  min-width:0;
  padding:18px;
  background:var(--panel);
  color:var(--ink);
  border:2px solid var(--ink);
  box-shadow:5px 5px 0 rgba(13,148,136,.42);
}
.card::before{
  content:"";
  position:absolute;
  top:-2px;
  left:-2px;
  width:44px;
  height:7px;
  background:var(--color-accent);
  border-right:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
}
.card h3{
  margin:2px 0 14px;
  padding-bottom:9px;
  border-bottom:2px solid var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:.02em;
}
.card h3 .material-symbols-outlined{font-size:20px;color:#0F766E}
.card .sub{color:#475569;font-family:"Crimson Pro","Noto Sans TC",serif;font-size:12px;font-weight:600}

.kpi{min-height:148px;padding:17px 17px 16px;overflow:hidden}
.kpi::after{
  content:"";
  position:absolute;
  right:-24px;
  bottom:-28px;
  width:82px;
  height:82px;
  border:12px solid rgba(45,212,191,.24);
  transform:rotate(18deg);
}
.kpi .ico{
  width:38px;
  height:38px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--color-secondary);
  color:#062C2A;
  border:2px solid var(--ink);
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .val{
  position:relative;
  z-index:1;
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.02em;
  line-height:.95;
}
.kpi .lbl{position:relative;z-index:1;margin-top:5px;color:#334155;font-size:13px;font-weight:600}
.kpi .delta{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:9px;
  padding:2px 6px;
  border:1px solid currentColor;
  font-size:11.5px;
  font-weight:700;
}
.kpi .delta.up{color:var(--ok);background:var(--ok-soft)}
.kpi .delta.down{color:var(--danger);background:var(--danger-soft)}
.kpi .delta.warn{color:var(--warn);background:var(--warn-soft)}
.kpi .delta .material-symbols-outlined{font-size:15px}

.chart-wrap{position:relative;width:100%;height:280px;overflow:hidden;min-width:0}
.chart-wrap.sm{height:220px}
.tbl-wrap{overflow-x:auto;border:2px solid var(--ink);scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums lining-nums}
th,td{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{
  position:sticky;
  top:0;
  z-index:2;
  background:#CCFBF1;
  color:#134E4A;
  border-bottom:2px solid var(--ink);
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.04em;
}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#FEF3C7}
td.name{font-weight:700}
td:nth-child(n+2){font-variant-numeric:tabular-nums lining-nums}
td[style*="min-width:140px"]{text-align:left}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  font-size:11.5px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:14px}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-danger{background:var(--danger-soft);color:var(--danger)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-purple{background:#CCFBF1;color:#115E59}
.p-gray{background:#E2E8F0;color:#334155}
.bar{height:10px;min-width:80px;background:#DCE8E7;border:1px solid var(--ink);overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--color-primary) 0 7px,var(--color-secondary) 7px 14px)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0}
.col{min-width:0;padding:10px;background:var(--color-muted);border:2px solid var(--ink)}
.col>.ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:2px 2px 9px;
  border-bottom:2px solid var(--ink);
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:11.5px;
  font-weight:600;
}
.col>.ch .cnt{min-width:25px;padding:1px 6px;background:var(--ink);color:#FFFFFF;text-align:center;font-size:11px;font-variant-numeric:tabular-nums}
.ticket{margin-bottom:9px;padding:10px;background:#FFFFFF;border:2px solid var(--ink);border-left:7px solid var(--color-primary);box-shadow:3px 3px 0 var(--color-border)}
.ticket:last-child{margin-bottom:0}
.ticket b{display:block;font-size:13px;font-weight:700}
.ticket .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;color:#475569;font-size:11px;font-weight:600}

.tl{position:relative;padding-left:25px;min-width:0}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item{position:relative;padding:0 0 20px 8px}
.tl-item::before{content:"";position:absolute;left:-23px;top:2px;width:14px;height:14px;background:#FFFFFF;border:3px solid var(--color-accent)}
.tl-item.done::before{background:var(--color-primary);border-color:var(--ink)}
.tl-item .t{font-size:13px;font-weight:700}
.tl-item .d{margin-top:2px;color:#475569;font-size:11.5px;font-weight:600}

.lrow{display:flex;align-items:center;gap:11px;min-width:0;padding:12px 3px;border-bottom:2px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .av{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);font-size:13px;font-weight:700;color:#FFFFFF}
.lrow .info{min-width:0;flex:1}
.lrow .info b{display:block;font-size:13px}
.lrow .info span{color:#475569;font-size:11.5px}
.lrow .rt{flex:none;text-align:right;font-variant-numeric:tabular-nums}

.mini{display:flex;gap:10px;flex-wrap:wrap}
.mini .m{flex:1;min-width:110px;padding:11px 12px;background:#CCFBF1;border:2px solid var(--ink)}
.mini .m .v{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .m .l{color:#334155;font-size:11.5px;font-weight:600}
.muted{color:#475569}
.foot-note{display:flex;align-items:flex-start;gap:6px;margin-top:12px;padding:8px 9px;background:var(--color-muted);border-left:4px solid var(--color-accent);color:#334155;font-size:11.5px;font-weight:600}

.orgwrap{overflow-x:auto;padding:8px 2px 12px}
.orgtree{min-width:640px;display:flex;flex-direction:column;align-items:center;gap:0}
.orglvl{position:relative;display:flex;justify-content:center;gap:13px;flex-wrap:wrap;padding:15px 0}
.orglvl.connect::before{content:"";position:absolute;top:0;left:15%;right:15%;height:3px;background:var(--ink)}
.onode{min-width:150px;padding:10px 13px;background:#FFFFFF;border:2px solid var(--ink);border-top:8px solid var(--color-primary);box-shadow:4px 4px 0 var(--color-border);text-align:center}
.onode.root{background:var(--color-primary);color:#001F1C;border-color:var(--ink);box-shadow:6px 6px 0 var(--color-accent)}
.onode.root .ot,.onode.root .op,.onode.root .om{color:#001F1C!important}
.onode .ot{font-family:"Cinzel","Noto Sans TC",serif;font-size:12px;font-weight:600}
.onode .op{margin-top:2px;color:#475569;font-size:11px}
.onode .om{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px;color:#475569;font-size:11px;font-variant-numeric:tabular-nums}
.onode .fillbadge{padding:1px 6px;color:#FFFFFF;border:1px solid var(--ink);font-size:10.5px;font-weight:700}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;color:#334155;font-size:11.5px;font-weight:600}
.legendrow .lg{display:flex;align-items:center;gap:6px}
.legendrow .sw{width:13px;height:13px;flex:none;border:1px solid var(--ink)}

.jdgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;min-width:0}
.jdcard{min-width:0;padding:13px;background:#F8FAFC;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--color-border)}
.jdcard:nth-child(3n+2){background:#ECFDF5}
.jdcard .jt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:"Cinzel","Noto Sans TC",serif;font-size:12px;font-weight:600}
.jdcard ul{margin:9px 0 0;padding-left:18px;color:#334155;font-size:12px;font-weight:600}
.jdcard ul li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{padding:2px 8px;background:#FFFFFF;color:#115E59;border:1px solid #0F766E;font-size:11px;font-weight:700}

@media(max-width:1100px){
  .topbar-inner{padding-right:0}
  .brand{min-width:250px}
  nav.nav button{padding-inline:10px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .topbar-inner{display:block;padding:0}
  .brand{min-width:0;padding:10px 16px;border-right:0;border-bottom:2px solid var(--ink)}
  nav.nav{margin-left:0}
  nav.nav button{flex:1;min-width:98px;min-height:50px}
  main{padding:22px 14px 56px}
  .screen-head{padding:18px 16px;box-shadow:6px 6px 0 var(--color-secondary)}
  .screen-head::after{display:none}
  .g-2,.g-2e,.g-3,.g-side{grid-template-columns:1fr}
  .g-kpi .card:nth-child(even){transform:none}
  .jdgrid{grid-template-columns:1fr}
}
@media(max-width:560px){
  nav.nav button{min-width:52px;padding:8px 10px}
  nav.nav button .txt{display:none}
  .screen-head h1{font-size:34px}
  .g-kpi,.board{grid-template-columns:1fr}
  .card{padding:15px;box-shadow:4px 4px 0 rgba(13,148,136,.42)}
  .kpi{min-height:132px}
  .kpi .ico{float:left;margin:0 12px 22px 0}
  .kpi .val{font-size:31px}
  .lrow{align-items:flex-start;flex-wrap:wrap}
  .lrow .rt{margin-left:47px}
}
@media(max-width:375px){
  main{padding-inline:10px}
  .brand-txt b{font-size:13px}
  .brand-txt span{font-size:10px}
  .screen-head{padding:16px 13px}
  .screen-head h1{font-size:30px}
  .card{padding:13px}
}

@media(prefers-reduced-motion:no-preference){
  .card{
    animation:brutalist-enter 400ms cubic-bezier(.34,1.56,.64,1) both;
  }
  .grid>.card:nth-child(2),.board>.col:nth-child(2),.jdgrid>.jdcard:nth-child(2){animation-delay:60ms}
  .grid>.card:nth-child(3),.board>.col:nth-child(3),.jdgrid>.jdcard:nth-child(3){animation-delay:120ms}
  .grid>.card:nth-child(4),.board>.col:nth-child(4),.jdgrid>.jdcard:nth-child(4){animation-delay:180ms}
  .col,.jdcard,.ticket{animation:brutalist-enter 360ms cubic-bezier(.34,1.56,.64,1) both}
  @keyframes brutalist-enter{
    from{opacity:0;transform:translateY(16px) scale(.92)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
        <div class="brand-txt">
          <b>組織圖與職位管理平台</b>
          <span>Org Chart &amp; Position Management</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>
  <main id="app"></main>

  <script>
  (function(){
    "use strict";
    var charts={};

    var NAV=[
      {i:0,ico:"account_tree",label:"動態組織圖"},
      {i:1,ico:"groups",label:"職位編制"},
      {i:2,ico:"description",label:"職位說明書"},
      {i:3,ico:"rule",label:"組織調整簽核"},
      {i:4,ico:"monitoring",label:"編制達成儀表"},
      {i:5,ico:"history",label:"版本歷史"}
    ];

    function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }

        '</div>'+
        '<div class="grid g-side">'+
          '<div class="card"><h3><span class="material-symbols-outlined">manage_history</span>組織圖版本歷程</h3>'+
            '<div class="tbl-wrap"><table><thead><tr><th>版本</th><th>生效日</th><th>異動人</th><th>主要變更</th><th>規模</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
            '<h3 style="margin-top:18px"><span class="material-symbols-outlined">stacked_bar_chart</span>各年度異動次數</h3>'+
            '<div class="chart-wrap sm"><canvas id="c5bar"></canvas></div>'+
          '</div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">timeline</span>異動作業流程</h3><div class="tl">'+tl+'</div></div>'+
        '</div>'
      );
    }
    function draw5(){
      mk("c5bar",{type:"bar",
        data:{labels:["2023","2024","2025","2026"],
          datasets:[{label:"組織異動次數",data:[7,9,11,12],
            backgroundColor:["#d8b4fe","#c084fc","#a855f7","#9333ea"],borderRadius:5}]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{x:{grid:{display:false}},y:{grid:{color:"#efeaf7"},beginAtZero:true}}}
      });
    }

    // ---------- shared builders ----------
    function head(title,ico,desc){
      return '<div class="screen-head">'+
        '<span class="eyebrow"><span class="material-symbols-outlined" style="font-size:15px">'+ico+'</span>組織與職位管理模組</span>'+
        '<h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>';
    }
    function kpi(ico,val,lbl,dir,delta){
      var dc=dir==="up"?"up":(dir==="down"?"down":"warn");
      var di=dir==="up"?"trending_up":(dir==="down"?"trending_down":"info");
      return '<div class="card kpi"><div class="ico"><span class="material-symbols-outlined">'+ico+'</span></div>'+
        '<div class="val">'+esc(val)+'</div><div class="lbl">'+esc(lbl)+'</div>'+
        '<div class="delta '+dc+'"><span class="material-symbols-outlined">'+di+'</span>'+esc(delta)+'</div></div>';
    }
    function mini(v,l){ return '<div class="m"><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div></div>'; }

    var SCREENS=[
      {build:screen0,draw:draw0},
      {build:screen1,draw:draw1},
      {build:screen2,draw:draw2},
      {build:screen3,draw:draw3},
      {build:screen4,draw:draw4},
      {build:screen5,draw:draw5}
    ];

    var navEl=document.getElementById("nav");
    NAV.forEach(function(n){
      var b=document.createElement("button");
      b.setAttribute("data-i",n.i);
      b.innerHTML='<span class="material-symbols-outlined">'+n.ico+'</span><span class="txt">'+n.label+'</span>';
      b.addEventListener("click",function(){ location.hash="v"+n.i; });
      navEl.appendChild(b);
    });

    function show(i){
      var app=document.getElementById("app");
      destroyAll();
      var s=SCREENS[i]||SCREENS[0];
      app.innerHTML="";
      app.appendChild(s.build());
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){
        btns[k].classList.toggle("active", (+btns[k].getAttribute("data-i"))===i);
      }
      void app.offsetHeight;
      try{ s.draw(); }catch(e){}
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
