<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>現場派工系統 RTD | 即時工單分派平台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --ink:#1f2937; --muted:#6b7280;
  --bg:#f6f5f8; --card:#ffffff; --line:#eadfe6; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --shadow:0 6px 22px rgba(219,39,119,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#9d174d,#db2777);color:#fff;box-shadow:0 4px 18px rgba(157,23,77,.28)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand b{font-family:"Noto Sans TC";font-weight:900;font-size:16px;letter-spacing:.5px;white-space:nowrap}
.brand span{display:block;font-size:11px;opacity:.82;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{flex:none;white-space:nowrap;border:0;background:rgba(255,255,255,.10);color:#fff;font-family:"Noto Sans TC";font-weight:700;font-size:13px;padding:8px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.22)}
.nav button.active{background:#fff;color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.screen-head h1{font-family:"Noto Sans TC";font-weight:900;font-size:22px;margin:0}
.screen-head p{margin:0;color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fce7f3;color:#be185d;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.chip .material-symbols-outlined{font-size:15px}
.spacer{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.grid{display:grid;gap:14px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:2fr 1fr}
.g-2e{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-board{grid-template-columns:repeat(4,1fr)}
.g-cfg{grid-template-columns:1.15fr .85fr}
.kpi{position:relative;overflow:hidden}
.kpi .label{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-family:"Inter";font-weight:800;font-size:28px;margin-top:4px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .foot{font-size:11.5px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:4px}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;background:#fce7f3;display:flex;align-items:center;justify-content:center}
.kpi .ic .material-symbols-outlined{font-size:20px;color:var(--accent)}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.sec-title{font-family:"Noto Sans TC";font-weight:900;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px}
.sec-title .material-symbols-outlined{font-size:19px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #f1e6ec;white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:12px;background:#fbf4f8}
tbody tr:hover{background:#fdf2f8}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:#dcfce7;color:#15803d}.t-run{background:#fce7f3;color:#be185d}.t-wait{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-hold{background:#e5e7eb;color:#4b5563}
.bar{height:7px;border-radius:99px;background:#f3e8ee;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mono{font-family:"Inter";font-weight:700}
.col{background:#faf3f7;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col > h4{margin:0 0 10px;font-family:"Noto Sans TC";font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.col > h4 em{font-style:normal;background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:10px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.tk:last-child{margin-bottom:0}
.tk .no{font-family:"Inter";font-weight:800;font-size:12.5px;color:var(--accent)}
.tk .nm{font-size:13px;font-weight:700;margin:3px 0}
.tk .mt{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.tk .mt span{background:#f6eef3;border-radius:6px;padding:2px 7px}
.tk.pri{border-left-color:var(--bad)}
.tk.done{border-left-color:var(--ok);opacity:.85}
.pr{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff}
.pr:last-child{margin-bottom:0}
.av{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:"Noto Sans TC";flex:none}
.pr .who{min-width:0}
.pr .who b{font-size:13.5px;font-weight:700}
.pr .who small{display:block;color:var(--muted);font-size:11.5px}
.match{margin-left:auto;text-align:right;flex:none}
.match .pct{font-family:"Inter";font-weight:800;font-size:17px;color:var(--accent)}
.match small{color:var(--muted);font-size:11px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#f3d9e6}
.tl .it{position:relative;padding:0 0 14px 0}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{content:"";position:absolute;left:-16px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .it.warn:before{border-color:var(--warn)}
.tl .it.bad:before{border-color:var(--bad)}
.tl .it .tt{font-size:13px;font-weight:700}
.tl .it .dd{font-size:11.5px;color:var(--muted)}
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff}
.rank:last-child{margin-bottom:0}
.rank .pos{width:30px;height:30px;border-radius:9px;background:#fce7f3;color:var(--accent);font-family:"Inter";font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.rank.hot .pos{background:var(--bad);color:#fff}
.rank .info{min-width:0;flex:1}
.rank .info b{font-size:13.5px}
.rank .info small{display:block;color:var(--muted);font-size:11.5px}
.rank .move{font-size:12px;font-weight:800;flex:none}
.alert{display:flex;gap:11px;padding:12px;border-radius:13px;border:1px solid var(--line);margin-bottom:10px;background:#fff}
.alert:last-child{margin-bottom:0}
.alert .ai{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.alert.sev-high{border-left:4px solid var(--bad)} .alert.sev-high .ai{background:#fee2e2;color:var(--bad)}
.alert.sev-mid{border-left:4px solid var(--warn)} .alert.sev-mid .ai{background:#fef3c7;color:var(--warn)}
.alert.sev-low{border-left:4px solid var(--accent)} .alert.sev-low .ai{background:#fce7f3;color:var(--accent)}
.alert .ab{min-width:0;flex:1}
.alert .ab b{font-size:13.5px}
.alert .ab p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.alert .ab .sug{margin-top:7px;font-size:12px;background:#faf3f7;border:1px dashed var(--accent2);border-radius:9px;padding:7px 9px;color:#9d174d}
.alert .act{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.btn{border:0;border-radius:9px;padding:6px 12px;font-family:"Noto Sans TC";font-weight:700;font-size:12px;cursor:pointer}
.btn-p{background:var(--accent);color:#fff}
.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink)}
.chart-box{position:relative;width:100%}
.h180{height:180px}.h220{height:220px}.h240{height:240px}.h260{height:260px}
.stations{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.st{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.st .top{display:flex;align-items:center;justify-content:space-between}
.st .dot{width:9px;height:9px;border-radius:50%}
.st b{font-size:13px;font-family:"Noto Sans TC"}
.st .u{font-family:"Inter";font-weight:800;font-size:19px;margin:6px 0 2px}
.st small{color:var(--muted);font-size:11px}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:1100px){.stations{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .g-2,.g-2e,.g-3,.g-cfg{grid-template-columns:1fr}
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-board{grid-template-columns:1fr 1fr}
  .stations{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:8px 10px}
  .brand span{display:none}
  .g-kpi{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>現場派工系統 RTD</b><span>Real-Time Dispatching · 智慧製造現場</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>

<script>
"use strict";
var NAV=[
  {icon:"dashboard",label:"戰情看板"},
  {icon:"grid_view",label:"工單派工牌"},
  {icon:"manage_accounts",label:"人機配置"},
  {icon:"low_priority",label:"優先序調整"},
  {icon:"report",label:"異常重派"},
  {icon:"insights",label:"派工績效"}
];
var app=document.getElementById("app");
var nav=document.getElementById("nav");
NAV.forEach(function(n,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+n.icon+'</span><span class="txt">'+n.label+'</span>';
  b.addEventListener("click",function(){show(i);location.hash="v"+i;});
  nav.appendChild(b);
});
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy();}catch(e){}});charts=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function head(title,sub,chipIcon,chipText){
  return '<div class="screen-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+
    '<span class="spacer"></span><span class="chip"><span class="material-symbols-outlined">'+chipIcon+'</span>'+chipText+'</span></div>';
}
function kpi(label,val,unit,foot,dir,icon){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var ar=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="card pad kpi"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div>'+
    '<div class="label">'+label+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="foot '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+ar+'</span>'+foot+'</div></div>';
}

/* SCREEN 0 : 戰情看板 */
function v0(){
  var stations=[
    {n:"CNC-01",s:"ok",u:94,t:"WO-2411 加工中"},
    {n:"CNC-02",s:"ok",u:88,t:"WO-2418 加工中"},
    {n:"沖壓-A",s:"warn",u:71,t:"換模等待"},
    {n:"焊接-C",s:"ok",u:90,t:"WO-2402 進行"},
    {n:"組裝-1",s:"bad",u:0,t:"缺料停線"},
    {n:"檢測-Q",s:"ok",u:82,t:"WO-2399 抽檢"}
  ];
  var rows=[
    ["WO-2411","精密外殼","CNC-01","王志明","run",76,"14:20"],
    ["WO-2402","傳動軸","焊接-C","陳建宏","run",58,"15:10"],
    ["WO-2418","支架組","CNC-02","林佳蓉","run",41,"16:00"],
    ["WO-2425","法蘭件","沖壓-A","—","wait",0,"16:40"],
    ["WO-2399","閥體","檢測-Q","黃郁婷","run",93,"13:50"],
    ["WO-2431","齒輪箱","組裝-1","—","hold",0,"17:20"]
  ];
  var tmap={run:["t-run","加工中"],wait:["t-wait","待派工"],hold:["t-hold","暫停"],ok:["t-ok","完成"],bad:["t-bad","異常"]};
  var stHtml=stations.map(function(s){
    return '<div class="st"><div class="top"><b>'+s.n+'</b><span class="dot d-'+s.s+' '+(s.s!=="ok"?"pulse":"")+'"></span></div>'+
      '<div class="u">'+s.u+'<small style="font-size:12px;font-weight:600;color:var(--muted)"> %</small></div>'+
      '<small>'+s.t+'</small></div>';
  }).join("");
  var trHtml=rows.map(function(r){
    var tg=tmap[r[4]];
    return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td>'+
      '<td><span class="tag '+tg[0]+'">'+tg[1]+'</span></td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+r[5]+'%"></i></div><small style="color:var(--muted)">'+r[5]+'%</small></div></td>'+
      '<td class="mono">'+r[6]+'</td></tr>';
  }).join("");
  app.innerHTML=head("現場戰情看板","跨工作站的工單、稼動與等待任務即時總覽","bolt","即時更新")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("今日派工達成率","91.6","%","較昨日 +2.3%","up","task_alt")+
      kpi("平均等待時間","6.4","分","縮短 1.8 分","up","hourglass_bottom")+
      kpi("線上工單","28","張","進行中 19 · 待派 9","flat","assignment")+
      kpi("設備稼動率","88.5","%","1 站停線中","down","speed")+
    '</div>'+
    '<div class="card pad" style="margin-bottom:14px"><h3 class="sec-title"><span class="material-symbols-outlined">grid_on</span>工作站即時狀態</h3>'+
      '<div class="stations">'+stHtml+'</div>'+
      '<div class="legend"><span><i class="d-ok" style="border-radius:50%"></i>正常</span><span><i class="d-warn" style="border-radius:50%"></i>等待/換模</span><span><i class="d-bad" style="border-radius:50%"></i>停線/異常</span></div></div>'+
    '<div class="grid g-2">'+
      '<div class="card pad"><h3 class="sec-title"><span class="material-symbols-outlined">table_rows</span>進行中工單</h3><div style="overflow-x:auto"><table><thead><tr><th>工單</th><th>品名</th><th>工作站</th><th>負責人</th><th>狀態</th><th>進度</th><th>交期</th></tr></thead><tbody>'+trHtml+'</tbody></table></div></div>'+
      '<div class="card pad"><h3 class="sec-title"><span class="material-symbols-outlined">show_chart</span>近 8 小時派工量</h3><div class="chart-box h240"><canvas id="c0"></canvas></div></div>'+
    '</div>';
  void app.offsetHeight;
  charts.push(new Chart(document.getElementById("c0"),{
    type:"bar",
    data:{labels:["08","09","10","11","12","13","14","15"],
      datasets:[
        {label:"已派工",data:[6,9,8,11,5,10,12,9],backgroundColor:"#db2777",borderRadius:5,maxBarThickness:24},
        {label:"待派工",data:[3,2,4,2,6,3,2,4],backgroundColor:"#f9c6de",borderRadius:5,maxBarThickness:24}
      ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},
      scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:"#f1e6ec"},ticks:{font:{size:10}}}}}
  }));
}

/* SCREEN 1 : 工單派工牌 */
function v1(){
  var cols=[
    {t:"待派工",n:4,items:[
      {no:"WO-2425",nm:"法蘭件 x120",mt:["沖壓-A","交期16:40"],pri:false},
      {no:"WO-2431",nm:"齒輪箱 x40",mt:["組裝-1","急件"],pri:true},
      {no:"WO-2440",nm:"連接桿 x200",mt:["CNC-03","交期18:00"],pri:false},
      {no:"WO-2447",nm:"外殼蓋 x90",mt:["沖壓-B","交期19:20"],pri:false}
    ]},
    {t:"已指派",n:3,items:[
      {no:"WO-2418",nm:"支架組 x80",mt:["林佳蓉","CNC-02"],pri:false},
      {no:"WO-2436",nm:"軸承座 x60",mt:["吳冠廷","焊接-D"],pri:false},
      {no:"WO-2452",nm:"護罩 x150",mt:["張書豪","沖壓-A"],pri:true}
    ]},
    {t:"加工中",n:3,items:[
      {no:"WO-2411",nm:"精密外殼 x50",mt:["王志明","76%"],pri:false},
      {no:"WO-2402",nm:"傳動軸 x30",mt:["陳建宏","58%"],pri:false},
      {no:"WO-2399",nm:"閥體 x100",mt:["黃郁婷","93%"],pri:false}
    ]},
    {t:"已完成",n:3,items:[
      {no:"WO-2388",nm:"底座 x70",mt:["準時","良率99%"],done:true},
      {no:"WO-2390",nm:"套筒 x110",mt:["準時","良率98%"],done:true},
      {no:"WO-2395",nm:"墊片 x260",mt:["提前","良率100%"],done:true}
    ]}
  ];
  var colsHtml=cols.map(function(c){
    var tk=c.items.map(function(it){
      var cls="tk"+(it.pri?" pri":"")+(it.done?" done":"");
      var mt=it.mt.map(function(m){return '<span>'+esc(m)+'</span>';}).join("");
      return '<div class="'+cls+'"><div class="no">'+it.no+(it.pri?' · 急件':'')+'</div><div class="nm">'+esc(it.nm)+'</div><div class="mt">'+mt+'</div></div>';
    }).join("");
    return '<div class="col"><h4>'+c.t+'<em>'+c.n+'</em></h4>'+tk+'</div>';
  }).join("");
  app.innerHTML=head("工單派工牌","以看板方式將待派工單指派至最合適的人機組合","view_kanban","拖拉指派")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+

      kpi("進行中","3","站","平均進度 76%","flat","autorenew")+

var SCREENS=[v0,v1,v2,v3,v4,v5];
function show(i){
  killCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("active",+b.getAttribute("data-i")===i);});
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
