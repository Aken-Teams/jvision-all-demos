<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>現場派工系統 RTD | 即時工單分派平台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --color-primary:#1E293B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#334155;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#0F172A;
  --color-foreground:#F8FAFC;
  --color-card:#1B2336;
  --color-card-foreground:#F8FAFC;
  --color-muted:#272F42;
  --color-muted-foreground:#94A3B8;
  --color-border:#475569;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#A8B6CA;
  --line:#475569;
  --bg:var(--color-background);
  --card:var(--color-card);
  --accent:var(--color-accent);
  --accent2:#86EFAC;
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#F87171;
  --shadow:0 10px 30px rgba(0,0,0,.22);
  --font-display:"Cinzel",Georgia,serif;
  --font-ui:"Josefin Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:var(--font-ui);
  background:
    linear-gradient(rgba(71,85,105,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(71,85,105,.08) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a{font:inherit}
a{color:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(34,197,94,.55);
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  color:var(--color-foreground);
  background:rgba(15,23,42,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.2);
  backdrop-filter:blur(16px);
}
.topbar-inner{
  width:min(100%,1440px);
  min-height:68px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.brand .logo{
  width:42px;
  height:42px;
  border:1px solid #64748B;
  border-radius:4px;
  background:var(--color-primary);
  display:grid;
  place-items:center;
  box-shadow:inset 0 -3px 0 var(--accent);
}
.brand .logo .material-symbols-outlined{font-size:24px;color:var(--accent)}
.brand b{
  display:block;
  font-family:var(--font-display),var(--font-ui);
  font-size:15px;
  font-weight:700;
  letter-spacing:.055em;
  line-height:1.25;
  white-space:nowrap;
}
.brand span{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.035em}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:thin;padding:3px}
.nav button{
  min-height:42px;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:3px;
  background:transparent;
  color:#CBD5E1;
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:var(--color-primary);border-color:var(--line);color:#FFFFFF;transform:translateY(-1px)}
.nav button.active{background:var(--accent);border-color:var(--accent);color:var(--color-on-accent);box-shadow:0 3px 0 #15803D}
.wrap{width:min(100%,1440px);margin:0 auto;padding:24px 24px 64px}
.screen-head{
  display:flex;
  align-items:flex-end;
  gap:14px;
  min-height:62px;
  margin:0 0 16px;
  padding-bottom:13px;
  border-bottom:1px solid var(--line);
}
.screen-head h1{
  margin:0;
  font-family:var(--font-display),var(--font-ui);
  font-size:23px;
  font-weight:700;
  letter-spacing:.035em;
  line-height:1.25;
}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.spacer{margin-left:auto}
.chip{
  min-height:30px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border:1px solid #3D8B58;
  border-radius:3px;
  background:#163C2A;
  color:#A7F3D0;
  font-size:12px;
  font-weight:700;
  letter-spacing:.025em;
  white-space:nowrap;
}
.chip .material-symbols-outlined{font-size:16px}
.card{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#64748B;box-shadow:0 14px 34px rgba(0,0,0,.28);transform:translateY(-1px)}
.pad{padding:15px}
.grid{display:grid;gap:12px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-board{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-cfg{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr)}
.kpi{position:relative;overflow:hidden;border-top:3px solid #64748B}
.kpi::after{content:"";position:absolute;right:-24px;bottom:-42px;width:96px;height:96px;border:1px solid rgba(34,197,94,.15);transform:rotate(45deg)}
.kpi .label{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
.kpi .val{
  margin-top:3px;
  padding-right:40px;
  font-family:var(--font-mono);
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;
  line-height:1.25;
}
.kpi .val small{margin-left:4px;color:#CBD5E1;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:0}
.kpi .foot{margin-top:7px;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600}
.kpi .ic{
  position:absolute;
  z-index:1;
  right:11px;
  top:11px;
  width:32px;
  height:32px;
  border:1px solid #3D8B58;
  border-radius:3px;
  background:#163C2A;
  display:grid;
  place-items:center;
}
.kpi .ic .material-symbols-outlined{font-size:19px;color:#86EFAC}
.up{color:#86EFAC}.down{color:#FCA5A5}.flat{color:#CBD5E1}
.sec-title{
  margin:0 0 12px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#FFFFFF;
  font-family:var(--font-ui);
  font-size:14px;
  font-weight:700;
  letter-spacing:.025em;
}
.sec-title::after{content:"";height:1px;flex:1;background:var(--line)}
.sec-title .material-symbols-outlined{font-size:18px;color:var(--accent)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid #354157;text-align:left;white-space:nowrap}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--color-primary);
  color:#D8E1EC;
  font-size:11px;
  font-weight:700;
  letter-spacing:.065em;
  text-transform:none;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#222D43}
tbody tr:last-child td{border-bottom:0}
td:has(.bar){text-align:right}
td .bar+small{min-width:38px;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:11px;
  font-weight:700;
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.t-ok{background:#153D2A;color:#86EFAC}.t-run{background:#163C2A;color:#86EFAC}.t-wait{background:#443512;color:#FDE68A}.t-bad{background:#4A1F26;color:#FCA5A5}.t-hold{background:#30394A;color:#D1D5DB}
.bar{height:7px;min-width:70px;border:1px solid #3A465B;border-radius:1px;background:#111827;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:0;background:linear-gradient(90deg,#16A34A,var(--accent))}
.col{min-width:0;padding:10px;border:1px solid var(--line);border-radius:4px;background:#141C2C}
.col>h4{margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.04em}
.col>h4 em{padding:2px 7px;border:1px solid var(--line);border-radius:2px;background:var(--color-primary);color:#D8E1EC;font-family:var(--font-mono);font-size:10px;font-style:normal}
.tk{
  margin-bottom:8px;
  padding:9px;
  border:1px solid var(--line);
  border-left:3px solid var(--accent);
  border-radius:3px;
  background:var(--card);
  box-shadow:0 3px 10px rgba(0,0,0,.18);
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.tk:hover{background:#222D43;border-color:#64748B;transform:translateX(2px)}
.tk:last-child{margin-bottom:0}
.tk .no{color:#86EFAC;font-family:var(--font-mono);font-size:11.5px;font-weight:700}
.tk .nm{margin:3px 0;color:#FFFFFF;font-size:12.5px;font-weight:650}
.tk .mt{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;color:#CBD5E1;font-size:10.5px}
.tk .mt span{padding:2px 6px;border:1px solid #3C485C;border-radius:2px;background:#202A3D}
.tk.pri{border-left-color:var(--bad)}
.tk.pri .no{color:#FCA5A5}
.tk.done{border-left-color:var(--ok);opacity:.9}
.pr{margin-bottom:8px;padding:9px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;background:#151E2F}
.pr:last-child{margin-bottom:0}
.av{width:36px;height:36px;flex:none;border:1px solid #3D8B58;border-radius:3px;background:#163C2A;color:#A7F3D0;display:grid;place-items:center;font-size:14px;font-weight:700}
.pr .who{min-width:0}
.pr .who b{font-size:13px;font-weight:650}
.pr .who small{display:block;color:var(--muted);font-size:11px}
.match{margin-left:auto;flex:none;text-align:right}
.match .pct{color:#86EFAC;font-family:var(--font-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.match small{color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:#64748B}
.tl .it{position:relative;padding:0 0 14px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border:2px solid var(--accent);border-radius:50%;background:var(--card)}
.tl .it.warn::before{border-color:var(--warn)}
.tl .it.bad::before{border-color:var(--bad)}
.tl .it .tt{font-size:12.5px;font-weight:650}
.tl .it .dd{color:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.rank{margin-bottom:8px;padding:9px 10px;display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:4px;background:#151E2F}
.rank:last-child{margin-bottom:0}
.rank .pos{width:29px;height:29px;flex:none;border:1px solid #3D8B58;border-radius:3px;background:#163C2A;color:#86EFAC;display:grid;place-items:center;font-family:var(--font-mono);font-weight:700}
.rank.hot .pos{border-color:#F87171;background:#4A1F26;color:#FCA5A5}
.rank .info{min-width:0;flex:1}
.rank .info b{font-size:13px}
.rank .info small{display:block;color:var(--muted);font-size:11px}
.rank .move{flex:none;font-family:var(--font-mono);font-size:11.5px;font-weight:700}
.alert{margin-bottom:9px;padding:10px;display:flex;gap:10px;border:1px solid var(--line);border-radius:4px;background:#151E2F}
.alert:last-child{margin-bottom:0}
.alert .ai{width:34px;height:34px;flex:none;border:1px solid currentColor;border-radius:3px;display:grid;place-items:center}
.alert.sev-high{border-left:4px solid var(--bad)}.alert.sev-high .ai{background:#4A1F26;color:#FCA5A5}
.alert.sev-mid{border-left:4px solid var(--warn)}.alert.sev-mid .ai{background:#443512;color:#FDE68A}
.alert.sev-low{border-left:4px solid var(--accent)}.alert.sev-low .ai{background:#163C2A;color:#A7F3D0}
.alert .ab{min-width:0;flex:1}
.alert .ab b{font-size:13px}
.alert .ab p{margin:3px 0 0;color:#CBD5E1;font-size:11.5px}
.alert .ab .sug{margin-top:7px;padding:7px 8px;border:1px dashed #3D8B58;border-radius:3px;background:#112F22;color:#B7F7CE;font-size:11.5px}
.alert .act{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.btn{min-width:78px;min-height:34px;padding:6px 11px;border-radius:3px;font-weight:700;font-size:11px;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn-p{border:1px solid var(--accent);background:var(--accent);color:var(--color-on-accent);box-shadow:0 3px 0 #15803D}
.btn-p:hover{background:#4ADE80}
.btn-o{border:1px solid #64748B;background:var(--color-primary);color:#F8FAFC}
.btn-o:hover{background:var(--color-secondary)}
.chart-box{position:relative;width:100%;padding:4px}
.h180{height:180px}.h220{height:220px}.h240{height:240px}.h260{height:260px}
.stations{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.st{min-width:0;padding:9px;border:1px solid var(--line);border-radius:4px;background:#151E2F;transition:border-color .2s ease,background-color .2s ease}
.st:hover{border-color:#64748B;background:#202A3D}
.st .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st .dot{width:auto;height:22px;padding:2px 6px;display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:2px;background:transparent;font-size:10px;font-weight:700;white-space:nowrap}
.st .dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st .dot.d-ok::after{content:"正常"}
.st .dot.d-warn::after{content:"等待"}
.st .dot.d-bad::after{content:"異常"}
.st b{font-family:var(--font-mono);font-size:11.5px}
.st .u{margin:5px 0 1px;font-family:var(--font-mono);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.st small{color:var(--muted);font-size:10.5px}
.d-ok{color:#86EFAC;background:#22C55E}.d-warn{color:#FDE68A;background:#FBBF24}.d-bad{color:#FCA5A5;background:#EF4444}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;color:#CBD5E1;font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;display:inline-block;border:1px solid rgba(255,255,255,.35);border-radius:1px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.58}}
#app>.screen-head,#app>.grid,#app>.card{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
#app>.grid{animation-delay:.05s}
#app>.card{animation-delay:.1s}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-wrap:wrap;gap:8px 16px}
  .nav{order:3;width:100%;margin-left:0}
  .stations{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:860px){
  .g-kpi,.g-board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .wrap{padding:18px 16px 50px}
  .g-2,.g-2e,.g-3,.g-cfg{grid-template-columns:1fr}
  .stations{grid-template-columns:repeat(2,minmax(0,1fr))}
  .alert{flex-wrap:wrap}
  .alert .act{width:100%;flex-direction:row;justify-content:flex-end}
}
@media(max-width:560px){
  .topbar-inner{padding:9px 12px}
  .brand{min-width:0}
  .brand span{display:none}
  .nav button{min-width:42px;justify-content:center;padding:8px 10px}
  .nav button span.txt{display:none}
  .wrap{padding:15px 12px 42px}
  .screen-head{align-items:flex-start;min-height:0}
  .screen-head h1{font-size:19px}
  .screen-head p{font-size:11.5px}
  .chip{font-size:10.5px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pad{padding:11px}
  .kpi .val{font-size:21px;padding-right:30px}
  .kpi .ic{width:27px;height:27px;right:8px;top:8px}
  .kpi .ic .material-symbols-outlined{font-size:16px}
  .kpi .foot{font-size:10px}
  .stations{grid-template-columns:1fr 1fr}
  .st .top{align-items:flex-start;flex-direction:column}
  .alert .ai{width:30px;height:30px}
  .btn{min-height:40px;flex:1}
}
@media(max-width:390px){
  .g-kpi{grid-template-columns:1fr}
  .stations{grid-template-columns:1fr}
  .screen-head{flex-wrap:wrap}
  .chip{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .pulse,#app>.screen-head,#app>.grid,#app>.card{animation:none!important;opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>現場派工系統 RTD</b><span>Real-Time Dispatching · 智慧製造現場</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>

<script>
"use strict";
var NAV=[
  {icon:"dashboard",label:"戰情看板"},
  {icon:"grid_view",label:"工單派工牌"},
  {icon:"manage_accounts",label:"人機配置"},
  {icon:"low_priority",label:"優先序調整"},
  {icon:"report",label:"異常重派"},
  {icon:"insights",label:"派工績效"}
];
var app=document.getElementById("app");
var nav=document.getElementById("nav");
NAV.forEach(function(n,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+n.icon+'</span><span class="txt">'+n.label+'</span>';
  b.addEventListener("click",function(){show(i);location.hash="v"+i;});
  nav.appendChild(b);
});
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy();}catch(e){}});charts=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function head(title,sub,chipIcon,chipText){
  return '<div class="screen-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+
    '<span class="spacer"></span><span class="chip"><span class="material-symbols-outlined">'+chipIcon+'</span>'+chipText+'</span></div>';
}

      '<td class="mono">'+r[3]+' 分</td><td class="mono">'+r[4]+'%</td>'+

      '<div style="overflow-x:auto"><table><thead><tr><th>班別</th><th>人員</th><th>派工達成率</th><th>平均等待</th><th>良率</th><th>評等</th></tr></thead><tbody>'+trHtml+'</tbody></table></div></div>';
  void app.offsetHeight;

    type:"line",

      datasets:[{label:"準時交付率 %",data:[77,80,83,87,90,93],borderColor:"#db2777",

var SCREENS=[v0,v1,v2,v3,v4,v5];
function show(i){
  killCharts();
  document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("active",+b.getAttribute("data-i")===i);});
  SCREENS[i]();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);
show(0);
fromHash();
</script>
