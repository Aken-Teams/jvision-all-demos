<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拖吊車隊任務站｜Jvision 系統 Demo</title>
<meta name="description" content="拖吊案件受理、就近派車、即時位置到收費結算的車隊調度（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --color-primary:#00ff41;
  --color-on-primary:#0f172a;
  --color-secondary:#008f11;
  --color-on-secondary:#000;
  --color-accent:#ff3333;
  --color-on-accent:#000;
  --color-background:#0d1117;
  --color-foreground:#e6edf3;
  --color-card:#182424;
  --color-card-foreground:#e6edf3;
  --color-muted:#25292f;
  --color-muted-foreground:#aab6c5;
  --color-border:#3b454d;
  --color-destructive:#ef4444;
  --color-on-destructive:#000;
  --color-ring:#00ff41;
  --blue:#00ff41;
  --ink:#e6edf3;
  --muted:#aab6c5;
  --line:#3b454d;
  --accent:var(--color-primary);
  --accent-d:#00b82f;
  --accent2:#00a62b;
  --body:#d4dde7;
  --bg:var(--color-background);
  --green:#00ff41;
  --amber:#fbbf24;
  --red:#ff4d4d;
  --mono:"Josefin Sans","Noto Sans Mono",monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Josefin Sans","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px),
    radial-gradient(circle at 85% 0,rgba(0,255,65,.08),transparent 30rem),
    var(--bg);
  background-size:32px 32px,32px 32px,auto,auto;
  color:var(--body);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
button,[data-i],.grow{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 6px rgba(0,255,65,.18);
}
.top{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(13,17,23,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 34px rgba(0,0,0,.38);
  backdrop-filter:blur(16px);
}
.top::after{
  content:"";
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.8;
}
.top .bar{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:66px;
  padding:10px 24px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .lg{
  position:relative;
  display:grid;
  flex:none;
  width:42px;
  height:42px;
  place-content:center;
  color:var(--accent);
  background:#101a18;
  border:1px solid rgba(0,255,65,.68);
  border-radius:4px;
  box-shadow:inset 0 0 18px rgba(0,255,65,.09),0 0 18px rgba(0,255,65,.12);
}
.brand .lg::before,.card::before,.kpi::before{
  content:"";
  position:absolute;
  top:-1px;
  left:-1px;
  width:12px;
  height:12px;
  border-top:2px solid var(--accent);
  border-left:2px solid var(--accent);
}
.brand b{
  display:block;
  color:#fff;
  font-size:16px;
  font-weight:700;
  letter-spacing:.08em;
}
.brand small{
  display:block;
  margin-top:3px;
  color:#91a69e;
  font-family:Cinzel,serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.18em;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 11px;
  color:#c7ffd5;
  background:rgba(0,255,65,.07);
  border:1px solid rgba(0,255,65,.3);
  border-radius:2px;
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
}
.live .dot{
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  box-shadow:0 0 10px var(--accent);
  animation:pulse 1.8s ease-in-out infinite;
}
.top .r{
  display:flex;
  align-items:center;
  gap:14px;
  margin-left:auto;
  color:var(--muted);
  font-family:var(--mono);
  font-size:12px;
}
.ava{
  display:grid;
  width:34px;
  height:34px;
  place-content:center;
  color:var(--accent);
  background:#121c1b;
  border:1px solid rgba(0,255,65,.45);
  border-radius:4px;
  font-weight:700;
}
nav.tabs{
  display:flex;
  gap:2px;
  padding:0 16px;
  overflow-x:auto;
  scrollbar-color:var(--accent) transparent;
}
nav.tabs button{
  position:relative;
  display:inline-flex;
  flex:none;
  align-items:center;
  gap:8px;
  min-height:46px;
  padding:10px 15px;
  color:#aebbc8;
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
  font-size:13px;
  font-weight:600;
  letter-spacing:.04em;
  white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease;
}
nav.tabs button .material-symbols-outlined{font-size:19px}
nav.tabs button:hover{color:#fff;background:rgba(0,255,65,.06)}
nav.tabs button.on{
  color:var(--accent);
  background:linear-gradient(180deg,transparent,rgba(0,255,65,.1));
  border-bottom-color:var(--accent);
  text-shadow:0 0 10px rgba(0,255,65,.4);
}
nav.tabs button.on::after{
  content:"";
  position:absolute;
  right:10px;
  bottom:5px;
  left:10px;
  height:1px;
  background:var(--accent);
  filter:blur(3px);
}
.body{max-width:1440px;margin:0 auto;padding:24px 24px 48px}
.vh{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  padding:3px 0 3px 14px;
  border-left:3px solid var(--accent);
  flex-wrap:wrap;
}
.vh h2{
  margin:0;
  color:var(--ink);
  font-family:Cinzel,"Microsoft JhengHei",serif;
  font-size:23px;
  font-weight:600;
  letter-spacing:.05em;
}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:40px;
  padding:0 16px;
  color:var(--color-on-primary);
  background:var(--accent);
  border:1px solid var(--accent);
  border-radius:3px;
  box-shadow:0 0 18px rgba(0,255,65,.12);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.btn:hover{
  background:#5aff7c;
  box-shadow:0 0 24px rgba(0,255,65,.3);
  transform:translateY(-1px);
}
.btn.ghost{
  color:var(--accent);
  background:rgba(0,255,65,.04);
  border-color:rgba(0,255,65,.5);
}
.btn.ghost:hover{color:#0d1117;background:var(--accent)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-bottom:18px;
}
.kpi,.card{
  position:relative;
  min-width:0;
  background:
    linear-gradient(135deg,rgba(0,255,65,.045),transparent 32%),
    var(--color-card);
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:0 12px 28px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025);
}
.kpi{
  overflow:hidden;
  padding:15px 17px;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.kpi:hover{
  border-color:rgba(0,255,65,.48);
  box-shadow:0 12px 30px rgba(0,0,0,.3),inset 0 0 24px rgba(0,255,65,.04);
  transform:translateY(-2px);
}
.kpi::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:34%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent));
}
.kpi .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .l .material-symbols-outlined{color:var(--accent);font-size:18px}
.kpi .v{
  margin-top:8px;
  color:var(--ink);
  font-family:var(--mono);
  font-size:29px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.kpi .v small{color:var(--muted);font-size:13px;font-weight:600}
.kpi .d{
  margin-top:4px;
  color:#72ff95;
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g-16{grid-template-columns:1.6fr 1fr}
.g-14{grid-template-columns:1fr 1.4fr}
.g-11{grid-template-columns:1fr 1fr}
.g-15{grid-template-columns:1.5fr 1fr}
.card{padding:18px 20px}
.card::after{
  content:"";
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:14px;
  height:14px;
  border-right:2px solid rgba(0,255,65,.52);
  border-bottom:2px solid rgba(0,255,65,.52);
  pointer-events:none;
}
.card>h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  color:var(--ink);
  font-size:15px;
  font-weight:650;
  letter-spacing:.035em;
}
.card>h3 .material-symbols-outlined{
  color:var(--accent);
  font-size:20px;
  filter:drop-shadow(0 0 6px rgba(0,255,65,.32));
}
.card>h3 .grow{
  margin-left:auto;
  color:#8bffab;
  font-size:12px;
  font-weight:600;
}
.card>h3 .grow:hover{color:#fff;text-decoration:underline}
.lmap{
  width:100%;
  height:440px;
  overflow:hidden;
  z-index:0;
  background:#10161a;
  border:1px solid var(--line);
  border-radius:3px;
  filter:saturate(.75) brightness(.82) contrast(1.08);
}
.map-legend{
  position:absolute;
  bottom:12px;
  left:12px;
  z-index:600;
  display:flex;
  gap:13px;
  padding:9px 12px;
  color:var(--ink);
  background:rgba(13,17,23,.94);
  border:1px solid var(--line);
  border-radius:3px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
  font-size:11px;
  font-weight:600;
  flex-wrap:wrap;
}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{
  display:inline-block;
  width:9px;
  height:9px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:1px;
}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  color:var(--ink);
  background:#182424;
}
.q,.veh{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-top:1px solid var(--line);
}
.q:first-of-type,.veh:first-of-type{border-top:0}
.pri{
  display:inline-grid;
  flex:none;
  align-self:flex-start;
  min-width:48px;
  height:27px;
  padding:0 8px;
  place-content:center;
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:3px;
  font-size:11px;
  font-weight:700;
}
.q .info,.veh .vinfo{flex:1;min-width:0}
.q .info b,.veh .vinfo b{
  display:block;
  color:var(--ink);
  font-family:var(--mono);
  font-size:14px;
  font-weight:600;
}
.q .info small,.veh .vinfo small{
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:var(--muted);
  font-size:12px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.eta{flex:none;text-align:right}
.eta b{
  color:var(--accent);
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.eta small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px}
.veh .ic{
  display:grid;
  flex:none;
  width:38px;
  height:38px;
  place-content:center;
  color:#fff;
  border:1px solid rgba(255,255,255,.16);
  border-radius:3px;
}
.vst,.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  flex:none;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.vst::before,.tag::before{
  content:"";
  width:6px;
  height:6px;
  background:currentColor;
  border-radius:50%;
}
.m-run{background:#007d22}.m-tow{background:#8c6500}.m-idle{background:#58616c}.m-late{background:#b4232d}
.v-run{color:#79ff9b;background:rgba(0,255,65,.08)}
.v-tow{color:#ffd166;background:rgba(251,191,36,.08)}
.v-idle{color:#c2ccd6;background:rgba(148,163,184,.08)}
.v-late{color:#ff9292;background:rgba(255,51,51,.09)}
.tl{margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 21px 29px}
.tl li::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:-4px;
  left:7px;
  width:1px;
  background:var(--line);
}
.tl li:last-child::before{display:none}
.tl li .dot{
  position:absolute;
  top:2px;
  left:0;
  width:15px;
  height:15px;
  background:var(--color-card);
  border:2px solid #7b8792;
  border-radius:50%;
}
.tl li.done .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 9px rgba(0,255,65,.35)}
.tl li.now .dot{
  background:#ff3333;
  border-color:#ff9b9b;
  box-shadow:0 0 0 4px rgba(255,51,51,.16),0 0 12px rgba(255,51,51,.4);
}
.tl li b{color:var(--ink);font-family:var(--mono);font-size:14px}
.tl li small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5}
.scroll{overflow-x:auto;scrollbar-color:var(--accent) var(--color-muted)}
.tbl{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.tbl th{
  padding:11px 12px;
  color:#b8c5d2;
  background:#11191c;
  border-top:1px solid var(--line);
  border-bottom:1px solid rgba(0,255,65,.4);
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.tbl td:first-child{font-family:var(--mono)}
.tbl th:nth-last-child(-n+2),.tbl td:nth-last-child(-n+2){text-align:right}
.tbl tr:hover td{background:rgba(0,255,65,.045)}
.g-ok{color:#77ff99;background:rgba(0,255,65,.08)}
.g-warn{color:#ff9898;background:rgba(255,51,51,.1)}
.g-run{color:#ffd166;background:rgba(251,191,36,.08)}
.chart{width:100%;height:280px}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .row .top2{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:13px;
}
.bars .row .top2 b{color:var(--ink);font-family:var(--mono)}
.bars .row .track{
  height:8px;
  overflow:hidden;
  background:#0f1519;
  border:1px solid var(--line);
  border-radius:1px;
}
.bars .row .fill{
  height:100%;
  background:linear-gradient(90deg,var(--color-secondary),var(--accent));
  box-shadow:0 0 10px rgba(0,255,65,.28);
}
.rc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc>*{min-width:0}
.receipt{
  padding:16px;
  background:#11191c;
  border:1px solid var(--line);
  border-radius:3px;
}
.receipt .rr{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:7px 0;
  border-bottom:1px dashed var(--line);
  font-size:13px;
}
.receipt .rr b{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.receipt .rr:last-child{
  padding-top:11px;
  color:var(--ink);
  border-bottom:0;
  font-size:15px;
  font-weight:700;
}
.grid-item,.kpi,.card{animation:enter .4s both}
.kpi:nth-child(2),.grid>.card:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4){animation-delay:.18s}
@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.72)}
}
@media (max-width:820px){
  .body{padding:18px 14px 34px}
  .g-16,.g-14,.g-11,.g-15,.rc{grid-template-columns:1fr}
  .lmap{height:350px}
  .top .bar{padding:9px 14px}
  .card{padding:16px}
}
@media (max-width:560px){
  .top .bar{gap:10px}
  .brand b{font-size:14px}
  .brand small{font-size:8px}
  .live{margin-left:auto;padding:5px 7px;font-size:10px}
  .top .r{display:none}
  nav.tabs{flex-wrap:nowrap;padding:0 7px}
  nav.tabs button span:not(.material-symbols-outlined){display:none}
  nav.tabs button{min-width:48px;justify-content:center;padding:10px 13px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:13px}
  .kpi .v{font-size:23px}
  .vh h2{font-size:20px}
  .q,.veh{gap:9px}
  .q .info small,.veh .vinfo small{max-width:190px}
  .map-legend{right:10px;left:10px}
}
@media (max-width:390px){
  .kpis{grid-template-columns:1fr}
  .q{align-items:flex-start;flex-wrap:wrap}
  .q .eta,.q>.btn{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0s!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  .live .dot{opacity:1;transform:none}
  .grid-item,.kpi,.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <span class="lg" aria-hidden="true"><span class="material-symbols-outlined">emergency</span></span>
      <div><b>拖吊車隊任務站</b><small>TOWING FLEET DISPATCH</small></div>
    </div>
    <span class="live"><span class="dot" aria-hidden="true"></span>8 車 · 5 案處理中</span>
    <div class="r">
      <span class="clk"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-4px;" aria-hidden="true">schedule</span> 2026-08-13 14:20 · 高雄站</span>
      <span class="ava" aria-label="調度員">調</span>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="主要功能"></nav>
</header>
<main class="body" id="view" tabindex="-1"></main>
<script>
const MODS=[["dashboard","派遣總覽"],["my_location","即時地圖"],["near_me","任務派車"],["conveyor_belt","拖吊進度"],["receipt_long","收費結算"],["leaderboard","車隊績效"]];
const NAMES=["派遣總覽","即時地圖","任務派車","拖吊進度","收費結算","車隊績效"];

function show(i){

tabs.addEventListener("click",e=>{

 if(!b)return;
 const i=+b.dataset.i;
 if(location.hash!==`#v${i}`)location.hash=`v${i}`;
 else show(i);
});
tabs.addEventListener("keydown",e=>{
 const items=[...tabs.querySelectorAll("button[data-i]")];
 const at=items.indexOf(document.activeElement);
 if(at<0||!["ArrowLeft","ArrowRight","Home","End"].includes(e.key))return;
 e.preventDefault();
 let next=e.key==="Home"?0:e.key==="End"?items.length-1:e.key==="ArrowRight"?(at+1)%items.length:(at-1+items.length)%items.length;
 items[next].focus();
});

function fromHash(){

}
window.addEventListener("hashchange",fromHash);
