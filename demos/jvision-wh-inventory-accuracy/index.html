<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>庫存準確率與差異根因管理 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#10b981;
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#ecfdf5;
  --track:#dfe4e8;
  --sidebar:#334155;
  --sidebar2:#334155;
  --side-edge:#0f172a;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#334155;
  --r:0;
  --glow:transparent;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:"Open Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{font-family:"Poppins","Open Sans",sans-serif;margin:0}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}

.app{display:flex;min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.sidebar{width:264px;flex:none;min-width:0;background:var(--sidebar);color:var(--color-on-primary);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;border-right:4px solid var(--side-edge);z-index:5}
.brand{display:flex;align-items:center;gap:12px;padding:22px 18px;border-bottom:2px solid #94a3b8;min-width:0}
.brand-logo{width:46px;height:46px;flex:none;border:2px solid #fff;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.brand-logo .material-symbols-outlined{font-size:26px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-weight:700;font-size:16px;letter-spacing:.02em}
.brand-txt span{display:block;margin-top:2px;font:600 10px/1.3 "Open Sans",sans-serif;color:#cbd5e1;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:0;margin-top:0;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;min-width:0;background:transparent;border:0;border-bottom:1px solid #64748b;color:#e2e8f0;padding:15px 17px;text-align:left;font-weight:700;white-space:nowrap;transition:background-color .18s ease,color .18s ease}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button:hover{background:#475569;color:#fff}
.nav button.on{background:var(--accent);color:#fff;box-shadow:inset 7px 0 0 #fff}
.nav .idx{margin-left:auto;font-family:"Poppins",sans-serif;font-size:11px;opacity:.82;font-weight:700;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:17px 18px;border-top:2px solid #94a3b8;font-size:11px;color:#cbd5e1;line-height:1.75;font-variant-numeric:tabular-nums}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:28px 32px 64px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;padding:0 0 18px;border-bottom:4px solid var(--ink);flex-wrap:wrap}
.topbar h1{font-size:clamp(22px,2.2vw,34px);line-height:1.12;font-weight:700;display:flex;align-items:center;gap:11px;letter-spacing:-.03em}
.topbar h1 .material-symbols-outlined{width:42px;height:42px;display:grid;place-items:center;background:var(--accent);color:#fff;border:2px solid var(--ink);font-size:25px}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:7px;font-weight:600}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--ink);padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--ink)}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid var(--ink);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
.avatar{width:38px;height:38px;background:var(--ink);border:2px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
#screen>.grid{animation:grid-enter .4s cubic-bezier(.2,.9,.3,1.25) both}
#screen>.grid:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3){animation-delay:.12s}
@keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.card,.sec{background:var(--panel);border:2px solid var(--ink);padding:18px;min-width:0;box-shadow:5px 5px 0 var(--ink)}
.sec{margin-bottom:15px}
.sec>h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:13px}
.sec>h3 .material-symbols-outlined{font-size:20px;color:var(--accent)}
.sec>p{margin:0 0 13px;font-size:13px;color:var(--muted);line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:13px;margin:0}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.card-h h3 .material-symbols-outlined{font-size:20px;color:var(--accent)}
.card-h .hint{font-size:11.5px;color:var(--muted);font-weight:600;border-left:3px solid var(--accent);padding-left:8px}

.kpi,.stat,.tile{background:var(--panel);border:2px solid var(--ink);padding:17px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:0;top:0;width:38px;height:8px;background:var(--accent)}
.kpi .ico,.tile .ti{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:2px solid var(--ink);position:relative;z-index:1}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{font-size:12px;color:var(--muted);margin-top:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{font-size:27px;font-weight:700;line-height:1.2;letter-spacing:-.04em;margin-top:4px;font-family:"Poppins",sans-serif;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta,.stat .d{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0 .card-h{padding:17px 17px 0!important}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:700;color:var(--ink);font-size:11px;padding:12px 14px;border-right:1px solid #cbd5e1;border-bottom:2px solid var(--ink);background:var(--th);letter-spacing:.04em;white-space:nowrap}
th:last-child{border-right:0}
td{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid #cbd5e1;white-space:nowrap}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:var(--hov)}
td:not(:first-child){text-align:right}
td:last-child{text-align:left}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{background:#d1fae5;color:#065f46}
.t-warn{background:#fef3c7;color:#92400e}
.t-bad{background:#fee2e2;color:#991b1b}
.t-info{background:#e2e8f0;color:#1e293b}
.t-gray{background:#f1f5f9;color:#475569}
.t-acc,.t-pink{background:var(--accent-soft);color:#065f46}

.bar{height:9px;background:var(--track);border:1px solid #94a3b8;overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{font:700 11px ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--muted);width:38px;flex:none;text-align:right;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-27px;top:2px;width:17px;height:17px;background:#fff;border:4px solid var(--accent)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{font:700 11px ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item b,.tl-i b{font-size:12.5px;display:block;margin:2px 0}
.tl-item p,.tl-i p{margin:0;font-size:11.5px;color:var(--muted)}

.chk{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:9px 2px;border-bottom:1px dashed #94a3b8}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:13px;padding-top:12px;border-top:1px dashed #94a3b8}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{background:var(--th);border:2px solid var(--ink);padding:11px;display:flex;flex-direction:column;gap:9px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 3px 6px}
.col-h .cnt{background:#fff;border:1px solid var(--ink);padding:1px 8px;font:700 11px ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--muted)}
.pcard{background:#fff;border:1px solid var(--ink);padding:11px 12px;border-left:6px solid var(--accent)}
.pcard b{font-size:12.5px}
.pcard .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink)}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--ink);color:#fff;font-weight:700}
.mini-av{width:20px;height:20px;font-size:9px}
.av{width:28px;height:28px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;padding:12px 14px;border:2px solid var(--ink);background:#fff;min-width:0}
.lane-row .num{width:33px;height:33px;flex:none;background:var(--accent);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 13px "Poppins",sans-serif}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:24px;height:24px;border:2px solid #94a3b8;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);background:#fff;z-index:1}
.steps .ln{width:20px;height:3px;background:#cbd5e1}
.steps .s.done{background:var(--accent);border-color:var(--ink);color:#fff}
.steps .s.cur{border:3px solid var(--accent);color:var(--ink);animation:pulse 1.6s infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px dashed #94a3b8;min-width:0}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{font-size:13px;display:block}
.rep-row .sku span{font-size:11px;color:var(--muted)}
.gauge{width:110px;flex:none}
.gauge .track{height:9px;background:var(--track);border:1px solid #94a3b8;position:relative;overflow:hidden}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{font:600 10px ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--muted);display:block;margin-top:3px;text-align:right}
.band{position:relative;height:28px;background:var(--track);border:1px solid #94a3b8;min-width:150px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border:1px solid var(--ink)}

.tile{display:flex;flex-direction:column;gap:7px;box-shadow:4px 4px 0 var(--ink)}
.tile:nth-child(2n){transform:translateY(7px)}
.tile b{font-size:13px;font-weight:700;color:var(--muted)}
.tile p{margin:0;font-size:11.8px;color:var(--muted);line-height:1.6}
.tile .tv{font-size:25px;margin-top:0;color:var(--ink)}
.grid.g4:first-child{gap:12px;background:transparent;border:0;padding:0;overflow:visible}
.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{background:var(--panel);border:2px solid var(--ink);padding:17px;box-shadow:4px 4px 0 var(--ink)}
.grid.g4:first-child>.tile .ti{width:40px;height:40px;overflow:visible;margin:0}
.kpi .lbl,.stat .lbl{margin-top:10px}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{padding:13px 14px}
  .brand-logo{width:40px;height:40px}
  .side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;border-top:1px solid #64748b}
  .nav button{flex:1 0 auto;border-bottom:0;border-right:1px solid #64748b;padding:12px 14px}
  .nav button.on{box-shadow:inset 0 -5px 0 #fff}
  .main{padding:22px 18px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
  .lane-row{align-items:flex-start;flex-wrap:wrap}
  .steps{width:100%;padding-left:46px}
}
@media(max-width:560px){
  body{font-size:13px}
  .main{padding:18px 12px 42px}
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .tile:nth-child(2n){transform:none}
  .nav button{min-height:48px}
  .nav button .txt{display:none}
  .nav .idx{display:block;margin-left:0}
  .topbar h1{font-size:21px}
  .topbar h1 .material-symbols-outlined{width:38px;height:38px}
  .top-right{width:100%}
  .chip{flex:1 1 auto;justify-content:center}
  .card,.sec{padding:14px;box-shadow:3px 3px 0 var(--ink)}
  .grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{box-shadow:3px 3px 0 var(--ink)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>.grid{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">fact_check</span></div>
      <div class="brand-txt"><b>庫存準確台</b><span>INVENTORY ACCURACY</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08 當期<br/>儲位 12,480 格<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;

function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}

function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
