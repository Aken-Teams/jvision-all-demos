<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工班請款結算台 · Crew Attendance & Billing</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#64748B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#334155;
  --color-card:#FFFFFF;
  --color-card-foreground:#334155;
  --color-muted:#EBF0F5;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#64748B;
  --blue:#64748B;
  --ink:#334155;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow:0 16px 42px rgba(15,23,42,.08);
  --shadow-soft:0 6px 18px rgba(15,23,42,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(100,116,139,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:Inter,"Noto Sans TC",system-ui,sans-serif;
  line-height:1.5;
}
button{font:inherit}
button,[onclick]{cursor:pointer}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
:focus-visible{
  outline:3px solid rgba(234,88,12,.38);
  outline-offset:3px;
}
.top{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:18px;
  min-height:68px;
  padding:10px clamp(16px,3vw,42px);
  border-bottom:1px solid rgba(226,232,240,.9);
  background:rgba(255,255,255,.94);
  box-shadow:0 4px 20px rgba(15,23,42,.05);
  backdrop-filter:blur(16px);
}
.top>*{min-width:0}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{
  position:relative;
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  overflow:hidden;
  border:1px solid #475569;
  border-radius:8px;
  background:#334155;
  color:#fff;
  font-size:16px;
  font-weight:800;
  box-shadow:5px 5px 0 #CBD5E1;
}
.logo::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:12px;
  height:12px;
  background:var(--color-accent);
  clip-path:polygon(100% 0,100% 100%,0 100%);
}
.brand b{display:block;color:#0F172A;font-size:15px;font-weight:800;letter-spacing:.02em}
.brand span{display:block;margin-top:1px;color:#64748B;font-size:9px;font-weight:700;letter-spacing:.16em}
.nav{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:inline-flex;
  align-items:center;
  flex:none;
  gap:6px;
  min-height:40px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#475569;
  font-weight:700;
  font-size:12px;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  border-color:#CBD5E1;
  background:#F1F5F9;
  color:#0F172A;
  transform:translateY(-1px);
}
.nav button.on{
  border-color:#334155;
  background:#334155;
  color:#FFF;
  box-shadow:0 5px 12px rgba(51,65,85,.18);
}
.nav button.on .material-symbols-outlined{color:#FDBA74}
.period{
  flex:none;
  padding:6px 10px;
  border:1px solid #CBD5E1;
  border-radius:6px;
  background:#F8FAFC;
  color:#334155;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}
.hero{
  position:relative;
  min-height:244px;
  overflow:hidden;
  border-bottom:1px solid #CBD5E1;
  background:#E8EDF2;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(248,250,252,.98) 0%,rgba(248,250,252,.94) 42%,rgba(248,250,252,.48) 72%,rgba(248,250,252,.1) 100%),
    repeating-linear-gradient(90deg,transparent 0 63px,rgba(71,85,105,.08) 64px),
    repeating-linear-gradient(0deg,transparent 0 63px,rgba(71,85,105,.08) 64px);
}
.hero-inner{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:minmax(0,1fr) 440px;
  align-items:center;
  gap:36px;
  width:min(1380px,100%);
  min-height:244px;
  margin:auto;
  padding:34px clamp(20px,4vw,56px);
}
.hero-copy{max-width:730px}
.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  color:#64748B;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.eyebrow::before{content:"";width:28px;height:3px;background:var(--color-accent)}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.vh h2{
  margin:0;
  color:#0F172A;
  font-size:clamp(30px,4vw,52px);
  font-weight:800;
  letter-spacing:-.045em;
  line-height:1.05;
}
.vh p{max-width:620px;margin:10px 0 0;color:#475569;font-size:14px}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:20px;
  padding:7px 10px;
  border:1px solid #CBD5E1;
  border-radius:6px;
  background:rgba(255,255,255,.76);
  color:#334155;
  font-size:11px;
  font-weight:800;
}
.live i{
  width:9px;
  height:9px;
  border:2px solid #FFF;
  border-radius:50%;
  background:#15803D;
  box-shadow:0 0 0 1px #15803D;
  animation:statusPulse 2.4s ease-in-out infinite;
}
.model-stage{
  position:relative;
  height:188px;
  perspective:850px;
  transform-style:preserve-3d;
}
.model-grid{
  position:absolute;
  right:8px;
  bottom:-75px;
  width:400px;
  height:240px;
  border:1px solid rgba(100,116,139,.18);
  background:
    linear-gradient(rgba(100,116,139,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.16) 1px,transparent 1px);
  background-size:26px 26px;
  transform:rotateX(66deg) rotateZ(-13deg);
}
.tower{
  position:absolute;
  right:98px;
  bottom:22px;
  width:156px;
  height:148px;
  transform:rotateY(-25deg) rotateX(4deg);
  transform-style:preserve-3d;
  animation:modelFloat 7s ease-in-out infinite;
}
.tower-front,.tower-side,.tower-top{position:absolute;border:1px solid #64748B}
.tower-front{
  inset:0;
  background:
    repeating-linear-gradient(0deg,transparent 0 28px,rgba(71,85,105,.32) 29px 31px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.88) 0 27px,#94A3B8 28px 30px);
  box-shadow:18px 24px 34px rgba(15,23,42,.14);
}
.tower-front::after{
  content:"";
  position:absolute;
  left:-18px;
  top:38px;
  width:190px;
  height:7px;
  background:var(--color-accent);
  box-shadow:0 38px 0 rgba(234,88,12,.72),0 76px 0 rgba(234,88,12,.44);
}
.tower-side{
  top:12px;
  right:-48px;
  width:48px;
  height:148px;
  transform:skewY(-25deg);
  transform-origin:left top;
  background:#64748B;
}
.tower-top{
  top:-25px;
  left:11px;
  width:156px;
  height:26px;
  transform:skewX(-65deg);
  transform-origin:left bottom;
  background:#CBD5E1;
}
.crane{
  position:absolute;
  right:18px;
  top:5px;
  width:250px;
  height:160px;
  border-left:5px solid #475569;
}
.crane::before{
  content:"";
  position:absolute;
  top:7px;
  left:-28px;
  width:248px;
  height:5px;
  background:#475569;
  box-shadow:0 10px 0 rgba(100,116,139,.42);
}
.crane::after{
  content:"";
  position:absolute;
  top:12px;
  right:27px;
  width:2px;
  height:72px;
  background:#64748B;
}
.wrap{width:min(1380px,100%);margin:0 auto;padding:24px clamp(16px,3.4vw,44px) 52px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
  position:relative;
  min-height:138px;
  overflow:hidden;
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--color-card);
  box-shadow:var(--shadow-soft);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi:hover{transform:translateY(-2px);border-color:#CBD5E1;box-shadow:var(--shadow)}
.kpi::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:#94A3B8;
}
.kpi:nth-child(3)::before{background:var(--color-accent)}
.kpi .l{color:#475569;font-size:11px;font-weight:700;letter-spacing:.03em}
.kpi .v{
  margin-top:8px;
  color:#0F172A;
  font-size:28px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.035em;
}
.kpi .v small{color:#64748B;font-size:11px;font-weight:700;letter-spacing:0}
.kpi .d{margin-top:6px;color:#475569;font-size:10.5px;font-weight:700}
.kpi .ic{
  position:absolute;
  right:14px;
  top:14px;
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border:1px solid #E2E8F0;
  border-radius:8px;
  background:#F8FAFC;
  color:#64748B;
}
.up{color:#166534!important}.dn{color:#B91C1C!important}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{
  min-width:0;
  padding:17px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--color-card);
  box-shadow:var(--shadow-soft);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  color:#0F172A;
  font-size:13px;
  font-weight:800;
  letter-spacing:.01em;
}
.card h3>.material-symbols-outlined{
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  border-radius:7px;
  background:#F1F5F9;
  color:#475569;
  font-size:18px;
}
.card h3 .r{margin-left:auto}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:23px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:5px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.t-ok{border-color:#BBF7D0;background:#F0FDF4;color:#166534}
.t-warn{border-color:#FED7AA;background:#FFF7ED;color:#9A3412}
.t-bad{border-color:#FECACA;background:#FEF2F2;color:#B91C1C}
.t-info{border-color:#BAE6FD;background:#F0F9FF;color:#075985}
.t-run{border-color:#FDBA74;background:#FFF7ED;color:#9A3412}
.t-mut{border-color:#CBD5E1;background:#F8FAFC;color:#475569}
.chart{height:250px}
.scroll{width:100%;overflow-x:auto;border-radius:8px}
table.data{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  background:#F1F5F9;
  color:#475569;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.025em;
}
table.data th:first-child{border-radius:7px 0 0}
table.data th:last-child{border-radius:0 7px 0 0}
table.data tbody tr{transition:background-color .18s ease}
table.data tbody tr:hover{background:#F8FAFC}
table.data td b{color:#0F172A}
table.data tfoot td{border-bottom:0;background:#F1F5F9;font-weight:800}
table.data td:first-child b,
table.data td:nth-child(2)[class=""],
table.data td .rn{font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:#475569;font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{display:inline-block;width:11px;height:11px;border:2px solid rgba(15,23,42,.25);border-radius:3px}
.crewpick{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding:2px;scrollbar-width:thin}
.crewpick button{
  flex:none;
  min-height:38px;
  padding:7px 12px;
  border:1px solid #CBD5E1;
  border-radius:7px;
  background:#FFF;
  color:#475569;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.crewpick button:hover{border-color:#64748B;background:#F8FAFC;transform:translateY(-1px)}
.crewpick button.on{border-color:#334155;background:#334155;color:#FFF}
.cal{display:grid;grid-template-columns:repeat(7,minmax(68px,1fr));gap:6px;min-width:540px}
.cal .dh{padding:5px 0;text-align:center;color:#64748B;font-size:10px;font-weight:800}
.cd{
  position:relative;
  min-height:68px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#FFF;
  font-size:10px;
}
.cd.dim{background:#F1F5F9;opacity:.65}
.cd .dn{color:#475569!important;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700}
.cd .st{display:inline-block;margin-top:6px;padding:2px 5px;border:1px solid transparent;border-radius:4px;font-size:9px;font-weight:800}
.st-w{border-color:#BBF7D0;background:#F0FDF4;color:#166534}
.st-o{border-color:#FED7AA;background:#FFF7ED;color:#9A3412}
.st-l{border-color:#CBD5E1;background:#F1F5F9;color:#475569}
.st-h{border-color:#FECACA;background:#FEF2F2;color:#B91C1C}
.cd .hr{position:absolute;right:5px;bottom:4px;color:#475569;font-family:"JetBrains Mono",monospace;font-size:8.5px;font-weight:700}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mc{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#F8FAFC}
.mc .l{color:#475569;font-size:10px;font-weight:700}
.mc .v{
  margin-top:3px;
  color:#0F172A;
  font-size:19px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.025em;
}
.pbar{height:8px;margin-top:6px;overflow:hidden;border:1px solid #CBD5E1;border-radius:2px;background:#E2E8F0}
.pbar i{display:block;height:100%;background:#64748B}
.rows{display:flex;flex-direction:column;gap:9px}
.prow{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#FFF}
.prow .ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prow .ph b{color:#0F172A;font-size:12px}
.prow .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;color:#475569;font-size:10.5px}
.inv{overflow:hidden;border:1px solid #CBD5E1;border-radius:11px;background:#FFF}
.inv .ih{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  overflow:hidden;
  padding:18px;
  background:#334155;
  color:#FFF;
}
.inv .ih::after{
  content:"";
  position:absolute;
  right:-28px;
  bottom:-42px;
  width:150px;
  height:100px;
  border:16px solid rgba(234,88,12,.78);
  transform:rotate(-20deg);
}
.inv .ih>div{position:relative;z-index:1}
.inv .ih b{font-size:15px}
.inv .ih span{display:block;margin-top:3px;color:#E2E8F0;font-size:10px}
.inv .ihr{text-align:right}
.inv .ihr .big{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:800}
.inv .ib{padding:7px 18px 16px}
.sumbox{display:grid;margin-top:5px}
.sr{display:flex;justify-content:space-between;gap:20px;padding:8px 2px;border-bottom:1px dashed #CBD5E1;font-size:12px}
.sr.tot{border-bottom:0;color:#C2410C;font-size:14px;font-weight:800}
.sr .rn{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:5px;bottom:8px;width:2px;background:#CBD5E1}
.ti{position:relative;padding:0 0 18px 7px;animation:timelineIn .42s both}
.ti:nth-child(2){animation-delay:.07s}.ti:nth-child(3){animation-delay:.14s}
.ti:nth-child(4){animation-delay:.21s}.ti:nth-child(5){animation-delay:.28s}
.ti::before{
  content:"";
  position:absolute;
  left:-23px;
  top:2px;
  width:12px;
  height:12px;
  border:3px solid #FFF;
  border-radius:50%;
  background:var(--color-accent);
  box-shadow:0 0 0 1px #EA580C;
}
.ti.done::before{background:#15803D;box-shadow:0 0 0 1px #15803D}
.ti.wait::before{background:#CBD5E1;box-shadow:0 0 0 1px #94A3B8}
.ti .tt{color:#0F172A;font-size:12px;font-weight:800}
.ti small{color:#475569;font-family:"JetBrains Mono",monospace;font-size:9.5px}
.ti .dsc{margin-top:2px;color:#475569;font-size:11px}
.note{margin:12px 0 0;color:#475569;font-size:10.5px}
.grid-item,.kpi,.card,.mc{animation:itemIn .4s both}
.kpi:nth-child(2),.mc:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3),.mc:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4),.mc:nth-child(4){animation-delay:.18s}
@keyframes itemIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes timelineIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes modelFloat{0%,100%{transform:rotateY(-25deg) rotateX(4deg) translateY(0)}50%{transform:rotateY(-21deg) rotateX(6deg) translateY(-5px)}}
@keyframes statusPulse{0%,100%{box-shadow:0 0 0 1px #15803D}50%{box-shadow:0 0 0 5px rgba(21,128,61,.13)}}
@media(max-width:1080px){
  .top{gap:10px}.brand span{display:none}.nav button{padding:8px}
  .nav button .txt{display:none}.hero-inner{grid-template-columns:minmax(0,1fr) 330px}
  .model-stage{transform:scale(.86);transform-origin:right center}
}
@media(max-width:800px){
  .top{padding:9px 14px}.brand b{font-size:13px}.period{display:none}
  .hero{min-height:218px}.hero-inner{display:block;min-height:218px;padding:30px 20px}
  .hero-copy{position:relative;z-index:2}.model-stage{position:absolute;right:-80px;bottom:-24px;width:360px;opacity:.22}
  .vh h2{font-size:36px}.vh p{max-width:72%}
  .wrap{padding:18px 14px 42px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.two{grid-template-columns:1fr}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  .top{min-height:60px}.logo{width:36px;height:36px;box-shadow:3px 3px 0 #CBD5E1}

function nt(n){return n.toLocaleString("en-US");}
function calcWage(r){
  var norm=r[2]*r[5];
  var ot=r[3]*r[5]*r[6];
  return {norm:norm,ot:Math.round(ot),tot:norm+Math.round(ot)};
}
function icon(name){return '<span class="material-symbols-outlined" aria-hidden="true">'+name+"</span>";}

var SCREENS=[
function(){

},
function(){

    if(att.h.indexOf(d)>=0)return["曠職","st-h"];

  }

    cells+='<div class="cd"><div class="dn">'+d+'</div>'+(s?'<div class="st '+s[1]+'">'+s[0]+"</div>":"")+(hr?'<div class="hr">'+hr+"</div>":"")+"</div>";

},
function(){
  var tn=0,to=0,tt=0;
  var rows=WAGE.map(function(r){
    var w=calcWage(r);tn+=w.norm;to+=w.ot;tt+=w.tot;
    return '<tr><td><b>'+r[0]+"</b> "+r[1]+'</td><td class="num">'+r[2]+'</td><td class="num">'+r[3]+'</td><td class="num">'+r[5]+'</td><td class="num">'+nt(w.norm)+'</td><td class="num">'+nt(w.ot)+'</td><td class="num"><b>'+nt(w.tot)+"</b></td></tr>";
  }).join("");

  '<div class="card" style="margin-top:16px"><h3>'+icon("rule")+'估驗計價（工項 × 合約單價）<span class="r tag t-run">估驗完成 92%</span></h3><div class="scroll"><table class="data"><thead><tr><th>工項</th><th>單位</th><th>合約單價</th><th>完成數量</th><th>本期計價</th></tr></thead><tbody>'+brows+'</tbody><tfoot><tr><td colspan="4">估驗計價合計</td><td class="num">'+nt(boqtot)+'</td></tr></tfoot></table></div><p class="note">本期計價金額 = 工資合計 '+nt(tt)+" + 估驗計價 "+nt(boqtot)+"，將帶入請款單。</p></div>";
},
function(){
  var wageTot=0;WAGE.forEach(function(r){wageTot+=calcWage(r).tot;});
  var boqTot=0;BOQ.forEach(function(b){boqTot+=b[2]*b[3];});
  var sub=wageTot+boqTot;

  var retain=Math.round(sub*.05);
  var net=gross-retain;
  return '<div class="grid g2">'+
  '<div class="card"><div class="inv"><div class="ih"><div><b>工程估驗計價請款單</b><span>REQ-2607 · 結算期別 2026-07</span><span>承攬廠商：O昌營造工程有限公司</span></div><div class="ihr"><div class="big">$'+nt(net)+'</div><span>本期實付金額</span></div></div>'+
  '<div class="ib"><div class="sumbox"><div class="sr"><span>工資計價（工時）</span><span class="rn">'+nt(wageTot)+'</span></div><div class="sr"><span>估驗計價（工項）</span><span class="rn">'+nt(boqTot)+'</span></div><div class="sr"><span>計價小計</span><span class="rn">'+nt(sub)+'</span></div><div class="sr"><span>營業稅 5%</span><span class="rn">'+nt(tax)+'</span></div><div class="sr"><span>請款總額（含稅）</span><span class="rn">'+nt(gross)+'</span></div><div class="sr"><span style="color:#B91C1C">減：本期保留款 5%</span><span class="rn" style="color:#B91C1C">-'+nt(retain)+'</span></div><div class="sr tot"><span>本期實付</span><span class="rn">'+nt(net)+"</span></div></div></div></div>"+

},

},

  [["請款單送出","2026-08-02 · 工班主管","計價明細與保留款確認完成","done"],["初審通過","2026-08-04 · 會計","發票與稅額勾稽無誤","done"],["主管審核","2026-08-06 · 營建工程主管","審核中，預計 8/09 完成","cur"],["安排撥款","預計 2026-08-12 · 財務","核准後排入撥款批次","wait"],["撥款完成","預計 2026-08-15 · 財務","實付款項匯入指定帳戶","wait"]].map(function(x){

  }).join("")+"</div></div>"+
  '<div class="card"><h3>'+icon("account_balance")+'累計撥款進度</h3><div class="chart" id="c_pay" style="height:230px"></div><div class="mini" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:8px 0 0"><div class="mc"><div class="l">已撥款</div><div class="v" style="color:#166534">6.72<small style="font-size:11px;color:#475569"> 百萬</small></div></div><div class="mc"><div class="l">待撥款</div><div class="v" style="color:#9A3412">3.37<small style="font-size:11px;color:#475569"> 百萬</small></div></div></div></div></div>'+
  '<div class="card" style="margin-top:16px"><h3>'+icon("receipt_long")+'請款付款進度總表</h3><div class="scroll"><table class="data"><thead><tr><th>請款單號</th><th>期別</th><th>請款金額</th><th>實付金額</th><th>審核</th><th>付款進度</th><th>狀態</th></tr></thead><tbody>'+
  PAY.map(function(p){
    return '<tr><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td><td class="num">'+p[2]+'</td><td class="num">'+p[3]+'</td><td>'+p[7]+'</td><td style="min-width:130px"><span class="num">'+p[6]+'%</span><div class="pbar" role="progressbar" aria-label="'+p[0]+' 付款進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p[6]+'"><i style="width:'+p[6]+'%"></i></div></td><td><span class="tag '+p[5]+'">'+p[4]+"</span></td></tr>";
  }).join("")+"</tbody></table></div></div>";
}
];

var chartText={color:"#475569",fontFamily:"Inter"};
var axisLine={lineStyle:{color:"#CBD5E1"}};
var splitLine={lineStyle:{color:"#E2E8F0",type:"dashed"}};

function makeChart(id,option){
  var el=document.getElementById(id);
  if(!el)return;
  var instance=echarts.init(el);
  instance.setOption(option);
  charts.push(instance);
}
function draw(i){
  charts.forEach(function(c){c.dispose();});
  charts=[];
  if(i===0){
    var names=CREWS.map(function(c){return c[0];});
    var wageArr=WAGE.map(function(r){return calcWage(r).tot;});
    makeChart("c_bar",{
      animationDuration:420,
      grid:{left:58,right:14,top:34,bottom:26},
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
      legend:{top:0,textStyle:chartText},
      xAxis:{type:"category",data:names,axisLabel:chartText,axisLine:axisLine,axisTick:{show:false}},
      yAxis:{type:"value",axisLabel:{color:"#475569",fontSize:10,formatter:function(v){return v/10000+"萬";}},splitLine:splitLine},
      series:[
        {name:"工資計價",type:"bar",stack:"x",barMaxWidth:32,data:wageArr,itemStyle:{color:"#64748B"}},
        {name:"估驗計價",type:"bar",stack:"x",barMaxWidth:32,data:[600000,100100,873600,95000,367200],itemStyle:{color:"#EA580C",borderRadius:[3,3,0,0]}}
      ]
    });
    var w=0,o=0,l=0,h=0;
    Object.keys(ATT).forEach(function(k){w+=ATT[k].w.length;o+=ATT[k].o.length;l+=ATT[k].l.length;h+=ATT[k].h.length;});
    makeChart("c_pie",{
      animationDuration:420,
      tooltip:{trigger:"item"},
      legend:{bottom:0,textStyle:chartText},
      series:[{type:"pie",radius:["48%","72%"],center:["50%","43%"],label:{color:"#334155",fontSize:10},itemStyle:{borderColor:"#FFF",borderWidth:3},data:[
        {value:w,name:"出工",itemStyle:{color:"#64748B"}},
        {value:o,name:"加班",itemStyle:{color:"#EA580C"}},
        {value:l,name:"請假",itemStyle:{color:"#94A3B8"}},
        {value:h,name:"曠職",itemStyle:{color:"#DC2626"}}
      ]}]
    });
  }
  if(i===2){
    makeChart("c_wh",{
      animationDuration:420,
      grid:{left:48,right:14,top:34,bottom:26},
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
      legend:{top:0,textStyle:chartText},
      xAxis:{type:"category",data:WAGE.map(function(r){return r[0];}),axisLabel:chartText,axisLine:axisLine,axisTick:{show:false}},
      yAxis:{type:"value",name:"工時",nameTextStyle:chartText,axisLabel:chartText,splitLine:splitLine},
      series:[
        {name:"正常工時",type:"bar",stack:"h",barMaxWidth:34,data:WAGE.map(function(r){return r[2];}),itemStyle:{color:"#64748B"}},
        {name:"加班工時",type:"bar",stack:"h",barMaxWidth:34,data:WAGE.map(function(r){return r[3];}),itemStyle:{color:"#EA580C",borderRadius:[3,3,0,0]}}
      ]
    });
  }
  if(i===4){
    makeChart("c_ret",{
      animationDuration:420,
      grid:{left:58,right:14,top:18,bottom:28},
      tooltip:{trigger:"axis"},
      xAxis:{type:"category",data:RETAIN.map(function(x){return x[0].slice(5);}),axisLabel:chartText,axisLine:axisLine,axisTick:{show:false}},
      yAxis:{type:"value",axisLabel:{color:"#475569",fontSize:10,formatter:function(v){return v/10000+"萬";}},splitLine:splitLine},
      series:[{name:"累計保留款",type:"line",smooth:.25,symbolSize:8,data:RETAIN.map(function(x){return x[4];}),areaStyle:{color:"rgba(234,88,12,.10)"},lineStyle:{color:"#EA580C",width:3},itemStyle:{color:"#EA580C",borderColor:"#FFF",borderWidth:2}}]
    });
  }
  if(i===5){
    makeChart("c_pay",{
      animationDuration:420,
      grid:{left:48,right:14,top:28,bottom:26},
      tooltip:{trigger:"axis"},
      legend:{top:0,textStyle:chartText},
      xAxis:{type:"category",data:["3月","4月","5月","6月","7月"],axisLabel:chartText,axisLine:axisLine,axisTick:{show:false}},
      yAxis:{type:"value",axisLabel:{color:"#475569",fontSize:10,formatter:function(v){return v/10000+"萬";}},splitLine:splitLine},
      series:[
        {name:"請款金額",type:"bar",barMaxWidth:26,data:[1729000,2033000,1881000,2147000,2292730],itemStyle:{color:"#CBD5E1",borderRadius:[3,3,0,0]}},
        {name:"實付金額",type:"bar",barMaxWidth:26,data:[1729000,2033000,1881000,1073500,0],itemStyle:{color:"#64748B",borderRadius:[3,3,0,0]}}
      ]
    });
  }
}
function pickCrew(c){
  window._crew=c;
  view.innerHTML=SCREENS[1]();
  draw(1);
}
function show(i){
  nav.querySelectorAll("button").forEach(function(b){
    var active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[i][2];
  vd.textContent=MOD[i][3];
  view.innerHTML=SCREENS[i]();
  draw(i);
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}catch(e){window.scrollTo(0,0);}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize();});});
fromHash();
</script>
