<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>端點偵測與應變系統（EDR/XDR）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#0D0D0D;
  --color-on-secondary:#FFFFFF;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#000000;
  --color-foreground:#E0E0E0;
  --color-card:#0C130E;
  --color-card-foreground:#E0E0E0;
  --color-muted:#181818;
  --color-muted-foreground:#A8B4C5;
  --color-border:#353535;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;

  --blue:#00FF41;
  --ink:#E0E0E0;
  --muted:#A8B4C5;
  --line:#353535;

  --c1:#00FF41;
  --c2:#7CFF9D;
  --bg:#000000;
  --panel:#0C130E;
  --panel2:#181818;
  --txt:#E0E0E0;
  --mut:#A8B4C5;
  --ok:#00FF41;
  --warn:#FFD24A;
  --crit:#FF4D4D;
  --high:#FF8A3D;
  --info:#70B7FF;
}

*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{max-width:100%;overflow-x:hidden;background:var(--color-background);scroll-behavior:auto}
body{
  max-width:100%;
  overflow-x:hidden;
  min-height:100vh;
  color:var(--color-foreground);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(0,255,65,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.045) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Josefin Sans","Noto Sans TC",system-ui,sans-serif;
  font-weight:500;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
button,a,[data-i]{cursor:pointer}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px #000;
}

.topnav{
  position:sticky;
  top:0;
  z-index:50;
  background:#000;
  border-bottom:2px solid var(--color-primary);
}
.topnav-inner{
  display:flex;
  align-items:stretch;
  gap:0;
  max-width:1600px;
  min-height:66px;
  margin:0 auto;
  padding:0 20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:290px;
  padding:9px 18px 9px 0;
  border-right:1px solid var(--line);
  color:#fff;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.055em;
  white-space:nowrap;
}
.brand .logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:2px solid var(--color-primary);
  border-radius:0;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:5px 5px 0 #133D1D;
}
.brand .logo .ms{font-size:24px;font-weight:700}
.brand small{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-family:"Josefin Sans","Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
}
.navbtns{
  display:flex;
  align-items:stretch;
  flex:1;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--color-primary) #000;
}
.navbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:48px;
  padding:8px 13px;
  border:0;
  border-right:1px solid var(--line);
  border-radius:0;
  background:#000;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;
}
.navbtn .ms{font-size:19px}
.navbtn:hover{background:var(--color-muted);color:#fff}
.navbtn.active{
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:inset 0 -5px 0 #fff;
}
.envtag{
  align-self:center;
  margin-left:12px;
  padding:7px 9px;
  border:1px solid var(--color-primary);
  border-radius:0;
  color:var(--color-primary);
  background:#071309;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}

main{max-width:1520px;margin:0 auto;padding:22px 20px 64px}
#app{animation:screen-in .34s ease-out both}
.scr-head{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  min-height:108px;
  margin:0 0 14px;
  padding:20px 22px 18px;
  border:1px solid var(--line);
  border-left:9px solid var(--color-primary);
  background:#080808;
  box-shadow:8px 8px 0 #102416;
}
.scr-head:after{
  content:"SECURITY OPERATIONS / ENDPOINT TELEMETRY";
  position:absolute;
  top:8px;
  right:12px;
  color:#6F7F73;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:9px;
  letter-spacing:.13em;
}
.scr-head h1{
  display:flex;
  align-items:center;
  gap:10px;
  max-width:820px;
  color:#fff;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(22px,2.2vw,34px);
  font-weight:700;
  line-height:1.08;
  letter-spacing:-.025em;
}
.scr-head h1 .ms{color:var(--color-primary);font-size:30px}
.scr-head p{margin-top:8px;color:#BCC6D3;font-size:13px;font-weight:600}
.chip{
  padding:7px 10px;
  border:1px solid var(--color-primary);
  border-radius:0;
  background:#071309;
  color:var(--color-primary);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(320px,2fr)}

.card{
  position:relative;
  overflow:hidden;
  padding:15px;
  border:1px solid var(--line);
  border-radius:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:42px;
  height:3px;
  background:var(--color-primary);
}
.card:nth-child(even):before{left:auto;right:0;width:76px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:27px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid var(--line);
  color:#F4F7F5;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}
.card h3 .ms{color:var(--color-primary);font-size:20px}
.card .sub{color:var(--muted);font-size:12px;font-weight:600}

.kpi{
  position:relative;
  min-height:128px;
  padding:14px 15px 13px;
  overflow:hidden;
  border:1px solid var(--line);
  border-top:4px solid var(--color-primary);
  border-radius:0;
  background:#090E0A;
}
.kpi:nth-child(2n){transform:translateY(5px);background:#0D0D0D}
.kpi:after{
  content:"";
  position:absolute;
  right:-18px;
  bottom:-18px;
  width:54px;
  height:54px;
  border:1px solid #22532D;
  transform:rotate(45deg);
}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:7px;
  color:#B8C5D3;
  font-size:12px;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:uppercase;
}
.kpi .lbl .ms{color:var(--color-primary);font-size:18px}
.kpi .val{
  margin-top:9px;
  color:#fff;
  font-family:"Cinzel",ui-monospace,monospace;
  font-size:clamp(25px,2.4vw,34px);
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;
  line-height:1;
  letter-spacing:-.04em;
}
.kpi .dlt{margin-top:9px;color:#BEC8D5;font-size:11px;font-weight:700}
.up:before{content:"[OK] ";color:var(--ok)}
.down:before{content:"[注意] ";color:#FF7070}
.up{color:#9DFFB5}
.down{color:#FF8D8D}

.bd{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
}
.bd:before{content:"■";font-size:8px}
.bd-crit{background:#351010;color:#FF9A9A}
.bd-high{background:#31180A;color:#FFB17C}
.bd-med{background:#2C2407;color:#FFE17C}
.bd-low{background:#0B2131;color:#94CCFF}
.bd-ok{background:#082A12;color:#86FFA4}
.bd-mut{background:#1B1B1B;color:#C5CEDA}

.scroll{overflow-x:auto;scrollbar-color:var(--color-primary) var(--color-muted)}
table{
  width:100%;
  border-collapse:collapse;
  color:#E5E9EF;
  font-size:12.5px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
th{
  padding:9px 10px;
  border:1px solid #424242;
  background:#171717;
  color:#C4CEDB;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.075em;
  text-align:left;
  text-transform:uppercase;
}
td{padding:9px 10px;border:1px solid #292929;vertical-align:middle}
tbody tr:nth-child(even){background:#101510}
tbody tr:hover{background:#182219}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td[style*="min-width"]{text-align:right}
.mono,.tl-time,.tkid{
  color:#82FF9F;
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}

.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:9px}
.col{
  min-height:180px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:0;
  background:#090909;
}
.col:nth-child(even){margin-top:12px}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
  padding:5px 4px 9px;
  border-bottom:2px solid var(--color-primary);
  color:#F2F2F2;
  font-size:12px;
  font-weight:700;
}
.col-h .cnt{
  min-width:24px;
  padding:2px 6px;
  border:1px solid var(--color-primary);
  border-radius:0;
  background:var(--color-primary);
  color:var(--color-on-primary);
  font-family:ui-monospace,monospace;
  font-size:10px;
  text-align:center;
}
.tk{
  margin-bottom:8px;
  padding:9px;
  border:1px solid var(--line);
  border-left:5px solid var(--color-primary);
  border-radius:0;
  background:var(--color-card);
  box-shadow:3px 3px 0 #202020;
}
.tk:last-child{margin-bottom:0}
.tk .tkt{margin:5px 0 8px;color:#F0F3F1;font-size:12.5px;font-weight:700;line-height:1.35}
.tk .tkm{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:10.5px}
.tk .av{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:25px;
  height:25px;
  border:1px solid var(--color-primary);
  border-radius:0;
  background:#071309;
  color:var(--color-primary);
  font-weight:700;
}

.tl{position:relative;padding-left:30px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:2px;background:var(--color-primary)}
.tl-item{position:relative;padding:0 0 15px 5px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:2px;
  left:-27px;
  width:14px;
  height:14px;
  border:3px solid #000;
  border-radius:0;
  background:var(--color-primary);
  box-shadow:0 0 0 1px var(--color-primary);
}
.tl-item.crit .tl-dot{background:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.tl-item.crit .tl-t:before{content:"[嚴重] ";color:#FF8C8C}
.tl-t{color:#F1F4F2;font-size:12.5px;font-weight:700}
.tl-meta{margin-top:2px;color:#B1BDCB;font-size:11.5px}
.tl-time{margin-top:2px}

.tree{
  overflow-x:auto;
  padding:8px;
  border:1px solid var(--line);
  background:#050805;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  line-height:1.9;
}
.tree .node{padding:2px 6px;border-radius:0;white-space:nowrap}
.tree .mal{border-left:3px solid var(--crit);background:#2B0D0D;color:#FFACAC}
.tree .susp{border-left:3px solid var(--warn);color:#FFE28A}
.tree .norm{color:#B8C3D1}

.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:128px;flex-shrink:0;color:#DDE3EA;font-size:12px;font-weight:600}
.bar-track{height:11px;flex:1;overflow:hidden;border:1px solid #3B3B3B;border-radius:0;background:#151515}
.bar-fill{height:100%;border-radius:0;background:repeating-linear-gradient(90deg,var(--color-primary) 0 8px,#0DBB39 8px 10px)}
.bar-val{
  width:48px;
  flex-shrink:0;
  color:#F4F7F5;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  text-align:right;
}
.progress{height:10px;min-width:80px;overflow:hidden;border:1px solid #454545;border-radius:0;background:#151515}
.progress span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--color-primary) 0 7px,#0DA634 7px 9px)}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  border:1px solid currentColor;
  border-radius:0;
  transform:rotate(45deg);
}
.dot-ok{background:var(--ok);color:var(--ok)}
.dot-warn{background:var(--warn);color:var(--warn)}
.dot-crit{background:var(--crit);color:var(--crit)}
.dot-mut{background:#8995A5;color:#8995A5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:#B4BFCD;font-size:11.5px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}

.statline{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #343434;font-size:12px}
.statline:last-child{border-bottom:0}
.statline .nm{flex:1;color:#D8DFE7}
.statline .vl{
  color:var(--color-primary);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  text-align:right;
}
.gauge-wrap{display:flex;align-items:center;justify-content:center;min-height:220px}

.hostgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.host{
  display:flex;
  align-items:center;
  justify-content:center;
  aspect-ratio:1;
  border:1px solid var(--line);
  border-radius:0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:9.5px;
  font-weight:700;
}
.host.on{border-color:#1F8C3A;background:#092711;color:#9CFFB4}
.host.iso{border-color:var(--crit);background:#310C0C;color:#FFB0B0}
.host.iso:before{content:"! ";font-weight:900}
.host.risk{border-color:var(--warn);background:#2B2206;color:#FFE388}
.host.risk:before{content:"▲ ";font-size:8px}
.host.off{border-style:dashed;background:#171717;color:#B6C0CD}

.apexcharts-canvas{margin-inline:auto}
.apexcharts-text,.apexcharts-legend-text{font-family:"Josefin Sans","Noto Sans TC",sans-serif!important}
.apexcharts-gridline{stroke:#343434}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  border:1px solid var(--color-primary)!important;
  border-radius:0!important;
  background:#080808!important;
  color:#fff!important;
  box-shadow:5px 5px 0 #1B3A22!important;
}

@keyframes screen-in{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:1100px){
  .topnav-inner{padding:0 14px;flex-wrap:wrap}
  .brand{min-width:255px}
  .navbtns{order:3;width:100%;border-top:1px solid var(--line)}
  .navbtn{flex:1}
  .envtag{margin-left:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:820px){
  main{padding:16px 12px 48px}
  .g2,.g3,.g-2-1,.g-1-2,.g-3-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(5,minmax(205px,1fr))}
  .col:nth-child(even){margin-top:0}
  .scr-head{align-items:flex-start;min-height:0;padding:38px 15px 15px;box-shadow:5px 5px 0 #102416}
  .scr-head h1{font-size:23px}
  .scr-head p{max-width:520px}
  .gauge-wrap{min-height:190px}
}

@media(max-width:560px){
  .topnav-inner{padding:0 10px}
  .brand{min-width:0;flex:1;border-right:0;padding-right:8px}
  .brand small{display:none}
  .envtag{max-width:132px;overflow:hidden;text-overflow:ellipsis}
  .navbtn{min-width:49px;padding:8px 11px}
  .navbtn span.tx{display:none}
  .navbtn .ms{font-size:21px}
  .scr-head{display:block;border-left-width:6px}
  .scr-head:after{left:14px;right:auto;max-width:90%;overflow:hidden;white-space:nowrap}
  .chip{display:inline-block;margin-top:13px;white-space:normal}
  .g4{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
  .card{padding:12px}
  .bar-lbl{width:96px}
  .hostgrid{grid-template-columns:repeat(6,minmax(42px,1fr))}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #app{animation:none!important;transform:none!important;opacity:1!important}
}
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <div class="brand">
      <span class="logo"><span class="ms">shield</span></span>
      <span>SentryXDR<small>端點偵測與應變 SOC 平台</small></span>
    </div>
    <div class="navbtns" id="nav"></div>
    <span class="envtag">● 生產環境 · 擬真資料</span>
  </div>
</nav>
<main>
  <div id="app"></div>
</main>

<script>
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(target,opt){var node=el(target);if(!node)return;var ch=new ApexCharts(node,opt);ch.render();charts.push(ch);}

var SCREENS=[
  {icon:"monitoring",tx:"監控總覽"},
  {icon:"warning",tx:"告警分流"},
  {icon:"account_tree",tx:"事件看板"},
  {icon:"biotech",tx:"鑑識調查"},
  {icon:"build",tx:"弱點修補"},
  {icon:"gavel",tx:"合規稽核"}
];

function baseOpts(type,h){
  return {
    chart:{type:type,height:h,fontFamily:'Inter,Noto Sans TC,sans-serif',foreColor:'#8fb2c4',
      toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},parentHeightOffset:0},

function statBars(rows){
  var max=0;for(var i=0;i<rows.length;i++){if(rows[i][1]>max)max=rows[i][1];}
  var s="";for(var j=0;j<rows.length;j++){var p=Math.round(rows[j][1]/max*100);
    s+='<div class="bar-row"><span class="bar-lbl">'+rows[j][0]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div><span class="bar-val">'+rows[j][1]+'</span></div>';}
  return s;
}

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  RENDER[i]();
}

(function(){
  var nav=el("nav");var s="";
  for(var i=0;i<SCREENS.length;i++){
    s+='<button class="navbtn" data-i="'+i+'"><span class="ms">'+SCREENS[i].icon+'</span><span class="tx">'+SCREENS[i].tx+'</span></button>';
  }
  nav.innerHTML=s;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      location.hash="go="+this.getAttribute("data-i");
    });
  }
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
