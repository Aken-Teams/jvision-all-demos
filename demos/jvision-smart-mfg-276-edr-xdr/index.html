<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>端點偵測與應變系統（EDR/XDR）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --c1:#0891b2; --c2:#22d3ee; --bg:#0a1420; --panel:#0f1e2e; --panel2:#13273a;
  --line:#1e3a52; --txt:#e6f4f8; --mut:#8fb2c4; --ok:#22c55e; --warn:#f59e0b;
  --crit:#ef4444; --high:#f97316; --info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#081019,#0a1420 40%);color:var(--txt);-webkit-font-smoothing:antialiased}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

.topnav{position:sticky;top:0;z-index:50;background:rgba(9,20,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topnav-inner{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;color:#04121a}
.brand .logo .ms{font-size:22px}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.navbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.navbtn .ms{font-size:19px}
.navbtn:hover{background:var(--panel2);color:var(--txt)}
.navbtn.active{background:linear-gradient(135deg,rgba(8,145,178,.25),rgba(34,211,238,.15));border-color:var(--c1);color:var(--c2)}
.envtag{font-size:11px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:20px;white-space:nowrap}

main{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.scr-head h1{font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h1 .ms{color:var(--c2);font-size:24px}
.scr-head p{color:var(--mut);font-size:13px;margin-top:3px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:600}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3-2{grid-template-columns:3fr 2fr}
@media(max-width:820px){
  .g2,.g3,.g4,.g-2-1,.g-1-2,.g-3-2{grid-template-columns:1fr}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .ms{font-size:19px;color:var(--c2)}
.card .sub{font-size:12px;color:var(--mut);font-weight:500}

.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px}
.kpi .lbl{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:600}
.kpi .lbl .ms{font-size:18px;color:var(--c2)}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .dlt{font-size:12px;font-weight:600;margin-top:4px}
.up{color:var(--ok)} .down{color:var(--crit)}

.bd{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bd-crit{background:rgba(239,68,68,.16);color:#fca5a5}
.bd-high{background:rgba(249,115,22,.16);color:#fdba74}
.bd-med{background:rgba(245,158,11,.16);color:#fcd34d}
.bd-low{background:rgba(56,189,248,.16);color:#7dd3fc}
.bd-ok{background:rgba(34,197,94,.16);color:#86efac}
.bd-mut{background:rgba(143,178,196,.14);color:var(--mut)}

table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
td{padding:10px;border-bottom:1px solid rgba(30,58,82,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(19,39,58,.5)}
.mono{font-family:"Inter",monospace;font-size:12.5px;color:var(--c2)}

.scroll{overflow-x:auto}

.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col-h .cnt{font-size:11px;background:rgba(8,145,178,.25);color:var(--c2);padding:2px 8px;border-radius:12px}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c1);border-radius:9px;padding:10px;margin-bottom:9px}
.tk:last-child{margin-bottom:0}
.tk .tkid{font-size:11px;color:var(--c2);font-family:monospace;font-weight:700}
.tk .tkt{font-size:13px;font-weight:600;margin:4px 0 6px}
.tk .tkm{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--mut)}
.tk .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#04121a;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--c2)}
.tl-item.crit .tl-dot{border-color:var(--crit)}
.tl-t{font-size:13px;font-weight:600}
.tl-meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl-time{font-size:11px;color:var(--c2);font-family:monospace}

.tree{font-family:monospace;font-size:12.5px;line-height:1.9;overflow-x:auto}
.tree .node{padding:2px 6px;border-radius:5px;white-space:nowrap}
.tree .mal{color:#fca5a5;background:rgba(239,68,68,.1)}
.tree .susp{color:#fcd34d}
.tree .norm{color:var(--mut)}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{font-size:12.5px;width:120px;flex-shrink:0;color:var(--txt)}
.bar-track{flex:1;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.bar-val{font-size:12px;font-weight:700;width:44px;text-align:right;flex-shrink:0}

.progress{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:70px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-ok{background:var(--ok)} .dot-warn{background:var(--warn)} .dot-crit{background:var(--crit)} .dot-mut{background:var(--mut)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}

.statline{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 0;border-bottom:1px solid rgba(30,58,82,.5)}
.statline:last-child{border-bottom:none}
.statline .nm{flex:1;color:var(--txt)}
.statline .vl{font-weight:700;color:var(--c2)}

.gauge-wrap{display:flex;align-items:center;justify-content:center}

.hostgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.host{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1px solid var(--line)}
.host.on{background:rgba(34,197,94,.12);color:#86efac;border-color:rgba(34,197,94,.3)}
.host.iso{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.4)}
.host.risk{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.35)}
.host.off{background:var(--panel2);color:var(--mut)}

@media(max-width:560px){
  .navbtn span.tx{display:none}
  .navbtn{padding:8px 10px}
  .brand small{display:none}
}
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <div class="brand">
      <span class="logo"><span class="ms">shield</span></span>
      <span>SentryXDR<small>端點偵測與應變 SOC 平台</small></span>
    </div>
    <div class="navbtns" id="nav"></div>
    <span class="envtag">● 生產環境 · 擬真資料</span>
  </div>
</nav>
<main>
  <div id="app"></div>
</main>

<script>
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(target,opt){var node=el(target);if(!node)return;var ch=new ApexCharts(node,opt);ch.render();charts.push(ch);}

var SCREENS=[
  {icon:"monitoring",tx:"監控總覽"},
  {icon:"warning",tx:"告警分流"},
  {icon:"account_tree",tx:"事件看板"},
  {icon:"biotech",tx:"鑑識調查"},
  {icon:"build",tx:"弱點修補"},
  {icon:"gavel",tx:"合規稽核"}
];

function baseOpts(type,h){
  return {
    chart:{type:type,height:h,fontFamily:'Inter,Noto Sans TC,sans-serif',foreColor:'#8fb2c4',
      toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},parentHeightOffset:0},
    grid:{borderColor:'rgba(30,58,82,.6)',strokeDashArray:3},
    dataLabels:{enabled:false},
    tooltip:{theme:'dark'},
    legend:{labels:{colors:'#8fb2c4'}}
  };
}

function kpiMini(icon,l,v,d,cls){
  return '<div class="kpi"><div class="lbl"><span class="ms">'+icon+'</span>'+l+'</div><div class="val">'+v+'</div><div class="dlt '+cls+'">'+d+'</div></div>';
}
function statBars(rows){
  var max=0;for(var i=0;i<rows.length;i++){if(rows[i][1]>max)max=rows[i][1];}
  var s="";for(var j=0;j<rows.length;j++){var p=Math.round(rows[j][1]/max*100);
    s+='<div class="bar-row"><span class="bar-lbl">'+rows[j][0]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div><span class="bar-val">'+rows[j][1]+'</span></div>';}
  return s;
}

/* ============ SCREEN 0 : 監控總覽 ============ */
function scr0(){
  var kpis=[
    {i:"devices",l:"受管端點",v:"1,842",d:"線上 1,796 · 離線 46",cls:"up"},
    {i:"warning",l:"活躍告警",v:"37",d:"嚴重 4 · 高 11",cls:"down"},
    {i:"shield",l:"威脅偵測率",v:"98.6%",d:"↑ 4.2% 對比上月",cls:"up"},
    {i:"timer",l:"平均圍堵時間",v:"6.4 分",d:"↓ 較 SLA 快 3.1 分",cls:"up"}
  ];
  var k="";for(var i=0;i<kpis.length;i++){var x=kpis[i];
    k+='<div class="kpi"><div class="lbl"><span class="ms">'+x.i+'</span>'+x.l+'</div><div class="val">'+x.v+'</div><div class="dlt '+x.cls+'">'+x.d+'</div></div>';}

  var pat=["on","on","on","on","risk","on","on","iso","on","on","on","on","risk","on","on","on","on","on","off","on","on","iso","on","on","on","on","on","on","risk","on","on","on","on","on","off","on","on","on","on","on","on","on","risk","on","on","on","on","on"];
  var labels={on:"在線",iso:"隔離",risk:"高風",off:"離線"};
  var hosts="";for(var h=0;h<pat.length;h++){hosts+='<div class="host '+pat[h]+'">'+labels[pat[h]]+'</div>';}

  el("app").innerHTML=
  '<div class="scr-head"><div><h1><span class="ms">monitoring</span>端點監控總覽</h1><p>全端點在線與健康狀態、即時威脅態勢儀表板</p></div><span class="chip">最後同步 08:41:22</span></div>'
  +'<div class="grid g4" style="margin-bottom:14px">'+k+'</div>'
  +'<div class="grid g-3-2" style="margin-bottom:14px">'
    +'<div class="card"><h3><span class="ms">insights</span>近 24 小時告警趨勢（依嚴重度）</h3><div id="c0trend"></div></div>'
    +'<div class="card"><h3><span class="ms">pie_chart</span>端點作業系統分布</h3><div class="gauge-wrap" id="c0os"></div>'
      +'<div class="legend"><span><i class="dot dot-ok"></i>Windows 11</span><span><i class="dot" style="background:var(--info)"></i>Windows 10</span><span><i class="dot dot-warn"></i>Linux</span><span><i class="dot dot-mut"></i>macOS</span></div></div>'
  +'</div>'
  +'<div class="grid g-2-1">'
    +'<div class="card"><h3><span class="ms">grid_view</span>端點群集健康狀態（廠區 A 抽樣 48 台）</h3><div class="hostgrid">'+hosts+'</div>'
      +'<div class="legend"><span><i class="dot dot-ok"></i>在線</span><span><i class="dot dot-crit"></i>已隔離</span><span><i class="dot dot-warn"></i>高風險</span><span><i class="dot dot-mut"></i>離線</span></div></div>'
    +'<div class="card"><h3><span class="ms">leaderboard</span>MITRE ATT&CK 命中戰術</h3>'
      +statBars([["初始存取",18],["執行",26],["持久化",9],["權限提升",14],["橫向移動",7],["資料外洩",3]])+'</div>'
  +'</div>';

  void el("app").offsetHeight;

  var trend=baseOpts('area',260);
  trend.series=[
    {name:'嚴重',data:[0,1,0,2,1,0,1,2,1,0,1,0]},
    {name:'高',data:[2,1,3,2,4,3,2,3,1,2,3,2]},
    {name:'中',data:[5,6,4,7,6,8,5,6,7,5,6,7]}
  ];
  trend.colors=['#ef4444','#f97316','#22d3ee'];
  trend.stroke={curve:'smooth',width:2};
  trend.fill={type:'gradient',gradient:{opacityFrom:.35,opacityTo:.02}};
  trend.xaxis={categories:['00','02','04','06','08','10','12','14','16','18','20','22'],labels:{style:{fontSize:'11px'}}};
  trend.chart.stacked=true;
  mk("c0trend",trend);

  var os=baseOpts('donut',260);
  os.series=[54,29,11,6];
  os.labels=['Windows 11','Windows 10','Linux','macOS'];
  os.colors=['#22c55e','#38bdf8','#f59e0b','#8fb2c4'];
  os.legend={show:false};
  os.plotOptions={pie:{donut:{size:'66%',labels:{show:true,total:{show:true,label:'受管端點',color:'#8fb2c4',formatter:function(){return '1,842';}}}}}};
  mk("c0os",os);
}

/* ============ SCREEN 1 : 威脅告警分流 ============ */
function scr1(){
  var alerts=[
    {id:"ALT-58120",sev:"crit",t:"Ransomware 加密行為偵測",host:"FAB-A-WS017",tac:"Impact",tm:"08:39",st:"待研判"},
    {id:"ALT-58118",sev:"crit",t:"高權限帳號異常登入",host:"DC-SRV-02",tac:"Credential Access",tm:"08:31",st:"待研判"},
    {id:"ALT-58115",sev:"high",t:"可疑 PowerShell 混淆執行",host:"OFF-HR-113",tac:"Execution",tm:"08:22",st:"分流中"},
    {id:"ALT-58109",sev:"high",t:"LSASS 記憶體讀取",host:"FAB-B-WS204",tac:"Credential Access",tm:"08:05",st:"分流中"},
    {id:"ALT-58101",sev:"med",t:"未簽章驅動載入",host:"ENG-CAD-31",tac:"Persistence",tm:"07:52",st:"已關聯"},
    {id:"ALT-58098",sev:"med",t:"對外 C2 疑似連線",host:"OFF-FIN-088",tac:"C2",tm:"07:44",st:"待研判"},
    {id:"ALT-58090",sev:"low",t:"USB 大量檔案複製",host:"OFF-SAL-057",tac:"Exfiltration",tm:"07:30",st:"已抑制"},
    {id:"ALT-58085",sev:"high",t:"排程工作建立於系統目錄",host:"FAB-A-WS009",tac:"Persistence",tm:"07:18",st:"分流中"}
  ];
  var sevmap={crit:["bd-crit","嚴重"],high:["bd-high","高"],med:["bd-med","中"],low:["bd-low","低"]};
  var rows="";for(var i=0;i<alerts.length;i++){var a=alerts[i];var sm=sevmap[a.sev];
    rows+='<tr><td class="mono">'+a.id+'</td><td><span class="bd '+sm[0]+'">'+sm[1]+'</span></td><td>'+a.t+'</td><td class="mono">'+a.host+'</td><td>'+a.tac+'</td><td>'+a.tm+'</td><td><span class="bd bd-mut">'+a.st+'</span></td></tr>';}

  el("app").innerHTML=
  '<div class="scr-head"><div><h1><span class="ms">warning</span>威脅告警分流</h1><p>偵測告警彙整、嚴重度分級與自動去重</p></div><span class="chip">佇列 37 · 去重合併 214</span></div>'
  +'<div class="grid g4" style="margin-bottom:14px">'
    +kpiMini("crisis","嚴重待處理","4","超出 SLA 0 件","up")
    +kpiMini("filter_alt","自動去重率","83%","節省人工 6.2h/日","up")
    +kpiMini("psychology","誤報率","4.1%","↓ 較上月 2.3%","up")
    +kpiMini("schedule","平均分流時間","8.5 分","目標 ≤ 10 分","up")
  +'</div>'
  +'<div class="grid g-1-2" style="margin-bottom:14px">'
    +'<div class="card"><h3><span class="ms">donut_small</span>告警嚴重度占比</h3><div class="gauge-wrap" id="c1sev"></div>'
      +'<div class="legend"><span><i class="dot dot-crit"></i>嚴重</span><span><i class="dot dot-warn"></i>高</span><span><i class="dot" style="background:var(--c2)"></i>中</span><span><i class="dot dot-mut"></i>低</span></div></div>'
    +'<div class="card"><h3><span class="ms">stacked_bar_chart</span>各偵測來源告警量（近 7 日）</h3><div id="c1src"></div></div>'
  +'</div>'
  +'<div class="card"><h3><span class="ms">list_alt</span>即時告警佇列</h3><div class="scroll"><table><thead><tr><th>告警編號</th><th>嚴重度</th><th>偵測內容</th><th>端點</th><th>戰術</th><th>時間</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

  void el("app").offsetHeight;

  var sev=baseOpts('donut',250);
  sev.series=[4,11,15,7];
  sev.labels=['嚴重','高','中','低'];
  sev.colors=['#ef4444','#f59e0b','#22d3ee','#8fb2c4'];
  sev.legend={show:false};
  sev.plotOptions={pie:{donut:{size:'62%'}}};
  mk("c1sev",sev);

  var src=baseOpts('bar',250);
  src.chart.stacked=true;
  src.series=[
    {name:'EDR 代理',data:[42,38,51,47,55,40,44]},
    {name:'網路 IDS',data:[18,22,16,20,25,19,21]},
    {name:'威脅情資',data:[9,7,11,8,13,10,12]}
