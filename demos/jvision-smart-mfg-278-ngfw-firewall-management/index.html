<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>防火牆與網路資安管理平台（NGFW / Firewall Management）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#0D0D0D;
  --color-on-secondary:#FFFFFF;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#000000;
  --color-foreground:#E0E0E0;
  --color-card:#0C130E;
  --color-card-foreground:#E0E0E0;
  --color-muted:#181818;
  --color-muted-foreground:#94A3B8;
  --color-border:#1F1F1F;
  --color-destructive:#EF4444;
  --color-ring:#00FF41;
  --blue:#00FF41;
  --ink:#E0E0E0;
  --muted:#94A3B8;
  --line:#343A36;
  --warning:#FFD84D;
  --info:#67E8F9;
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:auto}
body{
  margin:0;min-width:320px;background:var(--color-background);color:var(--ink);
  font-family:"Josefin Sans","Noto Sans TC",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px
}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:#050706;border-right:2px solid var(--color-primary)
}
.brand{padding:24px 20px;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:13px}
.logo-mark{
  width:48px;height:48px;display:grid;place-items:center;flex:none;
  color:var(--color-on-primary);background:var(--color-primary);
  border:2px solid var(--color-primary)
}
.logo-mark svg{width:27px;height:27px}
.brand-name{
  color:#fff;font-family:"Cinzel",serif;font-size:14px;font-weight:700;
  letter-spacing:.055em;line-height:1.45
}
.brand-sub{
  margin-top:13px;color:var(--color-primary);font-size:10px;font-weight:700;
  letter-spacing:.18em
}
nav{display:flex;flex-direction:column;padding:12px 0}
.nav-btn{
  position:relative;display:grid;grid-template-columns:22px 1fr;align-items:center;
  gap:12px;width:100%;min-height:52px;padding:12px 20px;border:0;
  border-bottom:1px solid var(--line);background:transparent;color:#B6C2BA;
  text-align:left;font-weight:600
}
.nav-btn:first-child{border-top:1px solid var(--line)}
.nav-btn:hover{background:var(--color-muted);color:#fff}
.nav-btn.on{
  background:var(--color-primary);color:var(--color-on-primary);
  font-weight:700
}
.nav-btn.on::after{
  content:"ACTIVE";position:absolute;right:9px;top:5px;font-size:8px;
  letter-spacing:.12em
}
.nav-btn svg{width:20px;height:20px;stroke-width:1.8}
.nav-index{font-family:"Cinzel",serif;font-size:10px;opacity:.75}
.side-foot{
  margin-top:auto;padding:16px 20px;border-top:2px solid var(--line);
  color:#A8B3AC;font-size:11px;line-height:1.7
}
.side-foot strong{color:var(--color-primary)}
.main{min-width:0;padding:28px clamp(16px,3vw,42px) 52px}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  padding-bottom:20px;margin-bottom:20px;border-bottom:2px solid var(--line)
}
.eyebrow{
  margin:0 0 7px;color:var(--color-primary);font-family:"Cinzel",serif;
  font-size:10px;font-weight:700;letter-spacing:.2em
}
h1{
  margin:0;color:#fff;font-family:"Cinzel",serif;font-size:clamp(22px,3vw,34px);
  line-height:1.12;letter-spacing:.025em
}
.desc{max-width:680px;margin:10px 0 0;color:#A8B3AC;font-size:14px}
.status{
  display:flex;align-items:center;gap:9px;flex:none;min-height:42px;padding:9px 12px;
  border:2px solid var(--color-primary);background:#071009;color:#fff;
  font-size:12px;font-weight:700
}
.status svg{width:18px;height:18px;color:var(--color-primary)}
.status-time{display:block;color:#A8B3AC;font:10px/1.2 monospace;font-weight:400}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
.stat-strip{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
  margin-bottom:14px
}
.chipstat,.card{
  min-width:0;background:var(--color-card);border:2px solid var(--line)
}
.chipstat{position:relative;padding:15px 16px}
.chipstat::before{
  content:"";position:absolute;top:-2px;left:-2px;width:38px;height:3px;
  background:var(--color-primary)
}
.cl{color:#A8B3AC;font-size:11px;font-weight:700;letter-spacing:.08em}
.cv{
  margin-top:7px;color:#fff;font-family:"Cinzel",serif;font-size:25px;
  font-weight:700;font-variant-numeric:tabular-nums
}
.cv small{color:var(--color-primary);font:700 11px "Josefin Sans",sans-serif}
.card{padding:18px}
.card h3{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px;
  color:#fff;font-family:"Cinzel",serif;font-size:14px;letter-spacing:.035em
}
.card h3 svg{width:20px;height:20px;color:var(--color-primary)}
.hint{margin-left:auto;color:#A8B3AC;font:600 11px "Josefin Sans",sans-serif}
.tbl-wrap{overflow:auto;border:1px solid var(--line)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th,td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
thead th{
  position:sticky;top:0;z-index:1;background:var(--color-primary);
  color:var(--color-on-primary);text-align:left;font-size:10px;font-weight:700;
  letter-spacing:.08em;white-space:nowrap
}
tbody tr:nth-child(even){background:#101612}
tbody tr:hover{background:#18221B}
td{color:#D8DED9}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono,.id,.tm{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums
}
.mono{color:#B9FFC9;font-size:11px}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 7px;
  border:1px solid currentColor;background:#050706;font-size:10px;
  font-weight:700;white-space:nowrap
}
.tag::before{content:"";width:6px;height:6px;background:currentColor}
.t-ok{color:var(--color-primary)}
.t-warn{color:var(--warning)}
.t-bad{color:#FF7373}
.t-info{color:var(--info)}
.t-mute{color:#C0CAC3}
.chartbox{position:relative;width:100%;overflow:hidden}
.note{
  padding:12px 14px;border:1px dashed #55615A;background:#080B09;
  color:#B9C2BC;font-size:12px;line-height:1.65
}
.diff,.rows,.hbar{display:flex;flex-direction:column;gap:8px}
.dl,.row{
  display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);
  background:#080B09
}
.dl{justify-content:space-between}
.dl .k{min-width:0;color:#B9C2BC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .v{font:700 11px ui-monospace,monospace;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:9px}
.col{padding:9px;border:1px solid var(--line);background:#080B09}
.ch{
  display:flex;justify-content:space-between;padding:5px 4px 10px;color:#fff;
  font-weight:700;border-bottom:2px solid var(--color-primary)
}
.ch .n{
  min-width:24px;padding:1px 6px;background:var(--color-primary);
  color:var(--color-on-primary);text-align:center;font:700 11px monospace
}
.ticket{
  margin-top:8px;padding:10px;border:1px solid #3A443D;border-left:4px solid var(--color-primary);
  background:var(--color-card)
}
.ticket .id{color:#B9FFC9;font-size:10px}
.ticket .ti{margin:5px 0 9px;color:#E9EEEA;font-size:12px;font-weight:600}
.ticket .mt{display:flex;align-items:center;justify-content:space-between}
.av{
  width:23px;height:23px;display:grid;place-items:center;border:1px solid var(--color-primary);
  color:var(--color-primary);font-size:10px;font-weight:700
}
.row .ic{
  width:36px;height:36px;display:grid;place-items:center;flex:none;
  border:1px solid currentColor
}
.row .ic svg{width:20px;height:20px}
.row .txt{min-width:0;flex:1}
.row .a{color:#fff;font-size:13px;font-weight:700}
.row .b{margin-top:3px;color:#A8B3AC;font-size:11px}
.row .rt{text-align:right;flex:none}
.row .big{font:700 17px "Cinzel",serif}
.row .sm{color:#A8B3AC;font-size:10px}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;
  background:var(--line)
}
.tl .it{position:relative;padding:0 0 18px 3px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";position:absolute;left:-24px;top:3px;width:12px;height:12px;
  border:3px solid var(--color-primary);background:#000
}
.tl .it.hot::before{border-color:#FF7373}
.tl .tm{color:#B9FFC9;font-size:10px}
.tl .tt2{margin:3px 0;color:#fff;font-weight:700}
.tl .td{color:#AEB8B1;font-size:12px}
.hb{display:flex;flex-direction:column;gap:5px}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700}
.hl span:last-child{color:#B9FFC9;font-family:monospace}
.ht{height:10px;border:1px solid #3E4942;background:#050706}
.ht i{display:block;height:100%;background:var(--color-primary)}
.sig{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.gauge{position:relative;width:140px;height:140px;flex:none}
.gauge .num{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none
}
.gauge b{color:#fff;font-family:"Cinzel",serif;font-size:22px}
.gauge s{color:#A8B3AC;font-size:10px;text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px;color:#B3BDB6;font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;display:inline-block}
.cpu{display:flex;align-items:center;gap:8px}
.cpu-track{height:7px;min-width:54px;flex:1;border:1px solid #3E4942;background:#050706}
.cpu-track i{display:block;height:100%}
.alert-text{color:#FF8B8B!important}
.board-scroll{overflow-x:auto}
@keyframes reveal{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
.view-enter>*{animation:reveal .4s cubic-bezier(.2,.9,.3,1.25) both}
.view-enter>*:nth-child(2){animation-delay:.06s}
.view-enter>*:nth-child(3){animation-delay:.12s}
.view-enter>*:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media(max-width:1100px){
  .stat-strip{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,minmax(200px,1fr))}
}
@media(max-width:900px){
  .app{display:block}
  .side{position:relative;width:100%;height:auto;border-right:0;border-bottom:2px solid var(--color-primary)}
  .brand{padding:15px 16px}
  .logo-mark{width:40px;height:40px}
  nav{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
  .nav-btn{padding:10px 12px;border-right:1px solid var(--line)}
  .side-foot{display:none}
  .main{padding:20px 16px 40px}
  .g2,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:600px){
  nav{grid-template-columns:repeat(6,1fr)}
  .nav-btn{display:flex;justify-content:center;min-height:48px;padding:10px}
  .nav-btn .nav-label,.nav-btn .nav-index,.nav-btn.on::after{display:none}
  .topbar{display:block}
  .status{margin-top:16px;width:100%}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chipstat{padding:13px 12px}
  .cv{font-size:20px}
  .card{padding:13px}
  .board{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></div>
      <div class="brand-name">NGFW 防火牆<br>資安管理平台</div>
    </div>
    <div class="brand-sub">FIREWALL MANAGEMENT · SOC</div>
  </div>
  <nav id="nav" aria-label="主要功能"></nav>
  <div class="side-foot"><strong>SYSTEM STATUS / NORMAL</strong><br>多廠區防火牆集中納管<br>政策合規率 96.4% · 攔截 12.8k/日<br>© 2026 InfoSec Operations</div>
</aside>
<main class="main">
  <header class="topbar">
    <div>
      <p class="eyebrow">SECURITY OPERATIONS / CONTROL NODE</p>

    </div>
    <div class="status" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg>
      <span>平台運行中 · 8 廠區 26 設備<span class="status-time">SNAPSHOT 14:42:00</span></span>
    </div>
  </header>
  <div id="view" aria-live="polite"></div>
</main>
</div>
<script>
(function(){
"use strict";
var ICONS={
inventory_2:'<path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/>',
rule:'<path d="M4 6h10M4 12h16M4 18h10"/><circle cx="17" cy="6" r="2"/><circle cx="17" cy="18" r="2"/>',
fact_check:'<path d="M7 3h10v3h3v15H4V6h3zM9 14l2 2 4-5"/>',
account_tree:'<path d="M6 3v6m0 0h12m-12 0v8m12-8v8M3 17h6v4H3zm12 0h6v4h-6z"/>',
monitoring:'<path d="M3 18h18M5 15l4-5 3 3 5-7 2 3"/>',
gavel:'<path d="m14 5 5 5M11 8l5 5M4 20l7-7M9 3l8 8-3 3-8-8z"/>',
chart:'<path d="M4 20V10m6 10V4m6 16v-7m5 7H2"/>',
warning:'<path d="M12 3 2 21h20L12 3Zm0 6v5m0 3v1"/>',
rocket:'<path d="M14 5c3-3 6-2 6-2s1 3-2 6l-5 5-4-4 5-5ZM7 12l-3 1-2 4 5-1m5 1-1 5 4-2 1-3"/>',
shield:'<path d="M12 3 20 6v5c0 5-3 8-8 10-5-2-8-5-8-10V6l8-3Z"/>',
pie:'<path d="M11 3v9h9A9 9 0 0 0 11 3Z"/><path d="M8 5a8 8 0 1 0 11 10H8V5Z"/>',
verified:'<path d="m12 2 3 2 4 .5.5 4 2.5 3-2.5 3-.5 4-4 .5-3 2-3-2-4-.5-.5-4L2 12l2.5-3L5 5l4-.5 3-2.5Zm-4 10 3 3 5-6"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">'+(ICONS[name]||ICONS.shield)+'</svg>'}
var MODS=[
{icon:"inventory_2",name:"設備納管",desc:"多廠區防火牆集中盤點與設備清冊"},
{icon:"rule",name:"政策集中管理",desc:"統一規則庫、物件與廠區差異比對"},
{icon:"fact_check",name:"變更審核",desc:"規則變更申請、風險評估與核准"},
{icon:"account_tree",name:"政策部署",desc:"批次推送、生效驗證與回滾點"},
{icon:"monitoring",name:"流量威脅監控",desc:"IPS/VPN 即時偵測與攔截統計"},
{icon:"gavel",name:"政策稽核",desc:"合規檢核、冗餘清理與稽核紀錄"}
];
var nav=document.getElementById("nav"),view=document.getElementById("view"),charts=[];
nav.innerHTML=MODS.map(function(m,i){return '<button class="nav-btn" data-i="'+i+'" aria-label="'+m.name+'">'+icon(m.icon)+'<span class="nav-label">'+m.name+'</span><span class="nav-index">0'+(i+1)+'</span></button>'}).join("");
Chart.defaults.color="#B8C2BB";
Chart.defaults.borderColor="#343A36";
Chart.defaults.font.family="'Josefin Sans',sans-serif";
function destroy(){charts.forEach(function(c){c.destroy()});charts=[]}
function chart(id,cfg){var e=document.getElementById(id);if(e)charts.push(new Chart(e,cfg))}
function head(title,ic,hint){return '<h3>'+icon(ic)+title+(hint?'<span class="hint">'+hint+'</span>':'')+'</h3>'}
function stats(a){return '<div class="stat-strip">'+a.map(function(x){return '<div class="chipstat"><div class="cl">'+x[0]+'</div><div class="cv'+(x[3]?' alert-text':'')+'">'+x[1]+' <small>'+x[2]+'</small></div></div>'}).join("")+'</div>'}
function tag(text,type){return '<span class="tag '+type+'">'+text+'</span>'}
function cpu(v){var c=v>65?"#FF7373":v>50?"#FFD84D":"#00FF41";return '<div class="cpu"><div class="cpu-track"><i style="width:'+v+'%;background:'+c+'"></i></div><span class="mono">'+v+'%</span></div>'}
function s0(){

return stats([["納管設備","26","台"],["連線正常","23","台"],["韌體待更新","4","台"],["總規則數","5,226","條"]])+
'<div class="grid g32"><section class="card">'+head("設備清冊（節錄 8 台）","inventory_2","依廠區集中盤點")+'<div class="tbl-wrap"><table><thead><tr><th>設備代號</th><th>廠區</th><th>型號</th><th>韌體</th><th class="num">規則</th><th>CPU 負載</th><th>狀態</th></tr></thead><tbody>'+d.map(function(x){return '<tr><td class="mono">'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td class="mono">'+x[3]+'</td><td class="num">'+x[4]+'</td><td>'+cpu(x[5])+'</td><td>'+tag(x[6],x[7])+'</td></tr>'}).join("")+'</tbody></table></div></section>'+
'<section class="card">'+head("各廠區設備分布","pie")+'<div class="chartbox" style="height:220px"><canvas id="c0"></canvas></div><div class="note" style="margin-top:14px">高雄廠 FW-KHH-01 離線逾 42 分鐘，已自動通知網管人員；新竹 / 台南韌體版本落後基準，建議排程更新。</div></section></div>'
}
