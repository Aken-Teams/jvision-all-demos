<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>防火牆與網路資安管理平台（NGFW / Firewall Management）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#334155;
  --accent2:#64748b;
  --bg:#f1f5f9;
  --panel:#ffffff;
  --line:#e2e8f0;
  --ink:#1e293b;
  --muted:#64748b;
  --ok:#16a34a;
  --warn:#d97706;
  --bad:#dc2626;
  --soft:#f8fafc;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
.app{display:flex;min-height:100vh;width:100%;}
.side{
  width:250px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line);}
.brand .logo{display:flex;align-items:center;gap:10px;}
.brand .logo .ico{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand .logo .ico .material-symbols-outlined{font-size:22px;}
.brand .tt{font-weight:800;font-size:14px;line-height:1.35;color:var(--accent);}
.brand .sub{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px;}
nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;flex-wrap:wrap;}
.nav-btn{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:9px;border:0;background:transparent;
  color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;width:100%;min-width:0;transition:.15s;
}
.nav-btn:hover{background:var(--soft);color:var(--accent);}
.nav-btn.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(51,65,85,.28);}
.nav-btn .material-symbols-outlined{font-size:20px;flex-shrink:0;}
.nav-btn .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6;}
.main{flex:1;min-width:0;padding:26px 30px 46px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.topbar h1{margin:0;font-size:21px;font-weight:800;color:var(--accent);letter-spacing:.3px;}
.topbar .desc{margin:6px 0 0;font-size:13px;color:var(--muted);max-width:620px;line-height:1.6;}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--accent2);
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.card h3{margin:0 0 14px;font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.card .hint{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:auto;}
.kpi .bar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;}
.kpi .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{position:relative;width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
thead th{background:var(--soft);color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover{background:var(--soft);}
.mono{font-family:"Inter",monospace;font-size:11.5px;letter-spacing:.2px;color:var(--accent2);font-weight:600;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0e7ff;color:#4338ca;}
.t-mute{background:#f1f5f9;color:#475569;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .ch{font-size:12px;font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:2px 4px;}
.col .ch .n{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:10.5px;padding:1px 8px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.ticket:last-child{margin-bottom:0;}
.ticket .id{font-size:10.5px;font-weight:700;color:var(--accent2);font-family:"Inter",monospace;}
.ticket .ti{font-size:12.5px;font-weight:600;margin:3px 0 6px;line-height:1.4;}
.ticket .mt{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--muted);}
.av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 4px;}
.tl .it:last-child{padding-bottom:0;}
.tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent2);}
.tl .it.hot::before{border-color:var(--bad);}
.tl .it.ok::before{border-color:var(--ok);}
.tl .tm{font-size:11px;color:var(--muted);font-family:"Inter",monospace;font-weight:600;}
.tl .tt2{font-size:13px;font-weight:600;margin:2px 0 2px;}
.tl .td{font-size:11.5px;color:var(--muted);line-height:1.5;}
.rows{display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--soft);min-width:0;}
.row .ic{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent2);}
.row .ic .material-symbols-outlined{font-size:19px;}
.row .txt{min-width:0;flex:1;}
.row .txt .a{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .txt .b{font-size:11px;color:var(--muted);margin-top:2px;}
.row .rt{text-align:right;flex-shrink:0;}
.row .rt .big{font-size:16px;font-weight:800;color:var(--accent);}
.row .rt .sm{font-size:10.5px;color:var(--muted);}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.sig{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.gauge{position:relative;width:130px;height:130px;flex-shrink:0;}
.gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.gauge .num b{font-size:24px;font-weight:800;color:var(--accent);line-height:1;}
.gauge .num s{font-size:10.5px;color:var(--muted);text-decoration:none;margin-top:3px;}
.diff{display:flex;flex-direction:column;gap:7px;font-size:12px;}
.diff .dl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:8px;background:var(--soft);}
.diff .dl .k{color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.diff .dl .v{font-weight:700;font-family:"Inter",monospace;font-size:11.5px;}
.stat-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.chipstat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px;min-width:0;flex:1 1 140px;}
.chipstat .cl{font-size:11px;color:var(--muted);font-weight:600;}
.chipstat .cv{font-size:19px;font-weight:800;color:var(--accent);margin-top:3px;}
.chipstat .cv small{font-size:11px;color:var(--muted);font-weight:600;}
.hbar{display:flex;flex-direction:column;gap:11px;}
.hbar .hb{display:flex;flex-direction:column;gap:5px;}
.hbar .hb .hl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;}
.hbar .hb .hl span:last-child{color:var(--accent2);font-family:"Inter",monospace;font-size:11.5px;}
.hbar .hb .ht{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;}
.hbar .hb .ht i{display:block;height:100%;border-radius:5px;}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:100%;height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);}
  nav{flex-direction:row;flex-wrap:wrap;padding:10px;}
  .nav-btn{width:auto;flex:1 1 auto;justify-content:center;}
  .side .foot{display:none;}
  .main{padding:20px 16px 40px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav-btn .nx{display:none;}
  .nav-btn{flex:0 0 auto;padding:10px;}
  .topbar h1{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">
        <div class="ico"><span class="material-symbols-outlined">shield</span></div>
        <div class="tt">NGFW 防火牆<br/>資安管理平台</div>
      </div>
      <div class="sub">FIREWALL MANAGEMENT · SOC</div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      多廠區防火牆集中納管<br/>政策合規率 96.4% · 攔截 12.8k/日<br/>© 2026 InfoSec Operations
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">總覽</h1>
        <p class="desc" id="scr-desc"></p>
      </div>
      <div class="pill"><span class="dot"></span> 平台運行中 · 8 廠區 26 設備</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
  "use strict";
  var MODS=[
    {icon:"inventory_2",name:"設備納管",desc:"多廠區防火牆集中盤點與設備清冊"},
    {icon:"rule",name:"政策集中管理",desc:"統一規則庫、物件與廠區差異比對"},
    {icon:"fact_check",name:"變更審核",desc:"規則變更申請、風險評估與核准"},
    {icon:"account_tree",name:"政策部署",desc:"批次推送、生效驗證與回滾點"},
    {icon:"monitoring",name:"流量威脅監控",desc:"IPS/VPN 即時偵測與攔截統計"},
    {icon:"gavel",name:"政策稽核",desc:"合規檢核、冗餘清理與稽核紀錄"}
  ];
  var view=document.getElementById("view");
  var navEl=document.getElementById("nav");
  var charts=[];
  var FONT={family:"Inter, Noto Sans TC, sans-serif"};
  var GRID="#e2e8f0";

  var nh="";
  for(var i=0;i<MODS.length;i++){
    nh+='<button class="nav-btn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nx">'+MODS[i].name+'</span></button>';
  }
  navEl.innerHTML=nh;

  function destroyCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
  function mkChart(id,cfg){
    var el=document.getElementById(id);
    if(!el)return;
    charts.push(new Chart(el.getContext("2d"),cfg));
  }

  // ---------- SCREEN 0: 設備納管 ----------
  function s0(){
    var devs=[
      {id:"FW-TPE-01",site:"台北總部",model:"NGFW-8300",fw:"7.4.3",rules:842,cpu:38,st:"online"},
      {id:"FW-TPE-02",site:"台北總部",model:"NGFW-8300",fw:"7.4.3",rules:842,cpu:41,st:"online"},
      {id:"FW-HSC-01",site:"新竹廠",model:"NGFW-6100",fw:"7.2.9",rules:531,cpu:56,st:"online"},
      {id:"FW-HSC-02",site:"新竹廠",model:"NGFW-6100",fw:"7.2.1",rules:527,cpu:62,st:"warn"},
      {id:"FW-TCH-01",site:"台中廠",model:"NGFW-6100",fw:"7.4.3",rules:604,cpu:33,st:"online"},
      {id:"FW-TNN-01",site:"台南廠",model:"NGFW-4200",fw:"7.1.5",rules:388,cpu:71,st:"warn"},
      {id:"FW-KHH-01",site:"高雄廠",model:"NGFW-4200",fw:"6.9.8",rules:372,cpu:22,st:"offline"},
      {id:"FW-DC-01",site:"雲端資料中心",model:"NGFW-VM",fw:"7.4.3",rules:1120,cpu:44,st:"online"}
    ];
    function sc(st){return st==="online"?'<span class="tag t-ok">連線中</span>':st==="warn"?'<span class="tag t-warn">待更新</span>':'<span class="tag t-bad">離線</span>';}
    var rows="";
    for(var i=0;i<devs.length;i++){var d=devs[i];
      var cc=d.cpu>65?"#dc2626":d.cpu>50?"#d97706":"#334155";
      rows+='<tr><td class="mono">'+d.id+'</td><td>'+d.site+'</td><td>'+d.model+'</td><td class="mono">'+d.fw+'</td><td>'+d.rules+'</td><td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:50px;height:6px;border-radius:4px;background:#f1f5f9;overflow:hidden"><i style="display:block;height:100%;width:'+d.cpu+'%;background:'+cc+'"></i></div><span class="mono">'+d.cpu+'%</span></div></td><td>'+sc(d.st)+'</td></tr>';
    }
    return ''+
    '<div class="stat-strip">'+
      '<div class="chipstat"><div class="cl">納管設備</div><div class="cv">26 <small>台</small></div></div>'+
      '<div class="chipstat"><div class="cl">連線正常</div><div class="cv">23 <small>台</small></div></div>'+
      '<div class="chipstat"><div class="cl">韌體待更新</div><div class="cv">4 <small>台</small></div></div>'+
      '<div class="chipstat"><div class="cl">總規則數</div><div class="cv">5,226 <small>條</small></div></div>'+
    '</div>'+
    '<div class="grid g32">'+
      '<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>設備清冊（節錄 8 台）<span class="hint">依廠區集中盤點</span></h3>'+
        '<div class="tbl-wrap"><table><thead><tr><th>設備代號</th><th>廠區</th><th>型號</th><th>韌體</th><th>規則</th><th>CPU 負載</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>各廠區設備分布</h3>'+
        '<div class="chartbox" style="height:220px"><canvas id="c0a"></canvas></div>'+
        '<div class="note" style="margin-top:14px">高雄廠 FW-KHH-01 離線逾 42 分鐘，已自動通知網管人員；新竹 / 台南韌體版本落後基準，建議排程更新。</div>'+
      '</div>'+
    '</div>';
  }
  function s0c(){
    mkChart("c0a",{type:"doughnut",data:{labels:["台北總部","新竹廠","台中廠","台南廠","高雄廠","資料中心"],datasets:[{data:[8,6,4,3,2,3],backgroundColor:["#334155","#475569","#64748b","#94a3b8","#cbd5e1","#1e293b"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{font:FONT,boxWidth:12,padding:9}}}}});
  }

  // ---------- SCREEN 1: 政策集中管理 ----------
  function s1(){
    var pol=[
      {id:"POL-1042",name:"ERP 對外服務",src:"DMZ-Web",dst:"ERP-Cluster",svc:"HTTPS/8443",act:"允許",hit:"48.2k",st:"一致"},
      {id:"POL-0871",name:"OT 網段隔離",src:"Office-LAN",dst:"OT-SCADA",svc:"ALL",act:"拒絕",hit:"1.9k",st:"一致"},
      {id:"POL-1180",name:"廠務 VPN 存取",src:"VPN-Pool",dst:"MES-App",svc:"TCP/1521",act:"允許",hit:"12.6k",st:"差異"},
      {id:"POL-0655",name:"備份流量",src:"Backup-Svr",dst:"NAS-Farm",svc:"TCP/445",act:"允許",hit:"6.1k",st:"一致"},
      {id:"POL-1355",name:"訪客網路上網",src:"Guest-WiFi",dst:"Internet",svc:"HTTP/HTTPS",act:"允許",hit:"22.4k",st:"差異"},
      {id:"POL-0902",name:"管理介面限制",src:"Admin-Jump",dst:"FW-Mgmt",svc:"TCP/22,443",act:"允許",hit:"0.4k",st:"一致"}
    ];
    function ss(s){return s==="一致"?'<span class="tag t-ok">各廠一致</span>':'<span class="tag t-warn">廠區差異</span>';}
    function sa(a){return a==="允許"?'<span class="tag t-info">允許</span>':'<span class="tag t-bad">拒絕</span>';}
    var rows="";
    for(var i=0;i<pol.length;i++){var p=pol[i];
      rows+='<tr><td class="mono">'+p.id+'</td><td>'+p.name+'</td><td class="mono">'+p.src+'</td><td class="mono">'+p.dst+'</td><td class="mono">'+p.svc+'</td><td>'+sa(p.act)+'</td><td>'+p.hit+'</td><td>'+ss(p.st)+'</td></tr>';
    }
    return ''+
    '<div class="grid g23">'+
      '<div class="card"><h3><span class="material-symbols-outlined">rule</span>統一規則庫<span class="hint">跨 8 廠區同步基準</span></h3>'+
        '<div class="tbl-wrap"><table><thead><tr><th>規則ID</th><th>名稱</th><th>來源</th><th>目的</th><th>服務</th><th>動作</th><th>命中/日</th><th>一致性</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">difference</span>廠區政策差異</h3>'+
        '<div class="diff">'+

    }
  });

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
  window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
