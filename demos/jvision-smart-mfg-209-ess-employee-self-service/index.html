<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>員工自助服務系統（ESS）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --sidebar:#FFFFFF;
  --card:var(--color-card);
  --soft:#F5FFFD;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --shadow:5px 5px 0 rgba(19,78,74,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  font-family:'Crimson Pro','Noto Sans TC',serif;
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,.inp{font:inherit}
button,[data-i],.qbtn{cursor:pointer}
button:focus-visible,[data-i]:focus-visible,.qbtn:focus-visible,.inp:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{
  width:258px;flex:0 0 258px;height:100vh;padding:24px 18px;
  position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:8px;
  background:var(--sidebar);border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 24px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand-logo{
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  color:#042F2E;background:var(--color-secondary);border:1px solid var(--ink);border-radius:4px;
  box-shadow:4px 4px 0 rgba(13,148,136,.2)
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt b,.topbar h1,.card h3{font-family:'Cormorant Garamond','Noto Sans TC',serif}
.brand-txt b{display:block;font-size:17px;line-height:1.1;letter-spacing:.02em}
.brand-txt span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;
  border:1px solid transparent;border-radius:3px;background:transparent;color:var(--muted);
  font-size:14px;font-weight:600;text-align:left;transition:background .2s,color .2s,border-color .2s,transform .2s
}
.nav button .material-symbols-outlined{font-size:20px;flex:0 0 auto}
.nav-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav button:hover{background:var(--soft);color:var(--ink);border-color:var(--line);transform:translateX(2px)}
.nav button.active{background:var(--ink);color:#FFF;border-color:var(--ink);box-shadow:3px 3px 0 var(--color-secondary)}
.side-foot{margin-top:auto;padding:16px 6px 0;border-top:1px solid var(--line)}
.userbox{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:50%;background:var(--color-primary);color:#FFF;font-weight:700}
.userbox b{display:block;font-size:14px}.userbox span{font-size:12px;color:var(--muted)}
.main{flex:1 1 auto;min-width:0;padding:30px clamp(18px,3vw,42px) 52px;max-width:1600px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.topbar h1{font-size:clamp(27px,3vw,38px);line-height:1;margin:0 0 7px;font-weight:700;letter-spacing:-.02em}
.topbar p{margin:0;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:#FFF;color:var(--ink);font-size:12px;font-weight:700}
.pill .material-symbols-outlined{font-size:17px;color:var(--accent)}
.grid{display:grid;gap:14px}.kpi4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g23{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.card{
  min-width:0;padding:18px;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);
  animation:card-in .4s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease
}
.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}.grid>.card:nth-child(4){animation-delay:.18s}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:7px 7px 0 rgba(13,148,136,.12)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;font-size:19px;font-weight:700}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:12px}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--accent)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi .val,.bal-card .bv,.stat-row b{font-variant-numeric:tabular-nums lining-nums}
.kpi .val{margin:8px 0 3px;font-family:'Cormorant Garamond','Noto Sans TC',serif;font-size:32px;line-height:1;font-weight:700}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:'Crimson Pro','Noto Sans TC',serif;font-size:13px;font-weight:600}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:#047857}.down{color:var(--bad)}.flat{color:var(--muted)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl-narrow table,.tbl-narrow{min-width:420px}
th{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--ink);background:var(--color-muted);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr{transition:background .18s}tbody tr:hover{background:var(--soft)}
td[style*="text-align:right"],th[style*="text-align:right"]{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:2px;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{background:#D1FAE5;color:#065F46}.t-warn{background:#FEF3C7;color:#92400E}.t-bad{background:#FEE2E2;color:#991B1B}.t-info{background:#CCFBF1;color:#115E59}.t-mut{background:#E8F1F4;color:#334155}
.scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}.chartbox{width:100%;min-width:0;overflow:hidden}.mini{color:var(--muted);font-size:12px}.mb16{margin-bottom:16px}
.todo{display:flex;flex-direction:column;gap:9px}.todo-item{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:var(--soft)}
.todo-ic{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:3px;color:#FFF}.todo-ic .material-symbols-outlined{font-size:19px}.todo-body{min-width:0;flex:1}.todo-body b{display:block;font-size:14px}.todo-body span{color:var(--muted);font-size:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{min-width:0;min-height:120px;padding:15px 10px;text-align:center;background:var(--soft);border:1px solid var(--line);border-radius:3px;transition:transform .22s,border-color .22s,box-shadow .22s}.qbtn:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:4px 4px 0 rgba(13,148,136,.16)}
.qic{width:42px;height:42px;display:grid;place-items:center;margin:0 auto 9px;border-radius:3px;background:var(--accent);color:#FFF}.qic .material-symbols-outlined{font-size:22px}.qbtn b{display:block;font-size:14px}.qbtn span{font-size:11px;color:var(--muted)}.qbtn .qic span{color:#FFF}
.ann{display:flex;flex-direction:column}.ann-item{padding:11px 4px;border-bottom:1px dashed var(--line)}.ann-item:last-child{border-bottom:0}.ann-item b{display:block;margin-bottom:3px;font-size:14px}.ann-item span{color:var(--muted);font-size:12px}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bal-card{min-width:0;padding:14px;text-align:left;border:1px solid var(--line);border-radius:3px;background:var(--soft)}.bn{color:var(--muted);font-size:12px;font-weight:700}.bal-card .bv{margin:5px 0 1px;color:var(--accent);font-size:27px;font-weight:700}.bx{color:var(--muted);font-size:11px}
.bar-wrap{height:7px;margin-top:8px;overflow:hidden;border-radius:0;background:#CBD5E1}.bar-in{height:100%;background:var(--accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px;font-weight:700}.field .inp{min-height:42px;padding:10px 11px;border:1px solid var(--line);border-radius:3px;background:var(--soft);color:var(--ink);font-size:13px}.field .inp.filled{background:#FFF;font-weight:600}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:44px;padding:10px 17px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:3px;font-size:13px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-2px)}.btn .material-symbols-outlined{font-size:18px}.btn-p{background:var(--color-accent);color:#271500;border-color:#92400E;box-shadow:3px 3px 0 #92400E}.btn-g{background:#FFF;color:var(--ink);border-color:var(--line)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-width:0}.col{min-width:0;padding:11px;border:1px solid var(--line);border-radius:3px;background:var(--soft)}.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;font-weight:700}.cnt{padding:1px 8px;border:1px solid var(--line);border-radius:2px;background:#FFF;color:var(--muted);font-size:11px}.tk{min-width:0;margin-bottom:8px;padding:10px;border-left:3px solid var(--accent);background:#FFF;box-shadow:0 1px 0 var(--line)}.tk:last-child{margin-bottom:0}.tk-t{margin-bottom:4px;font-size:13px;font-weight:700}.tk-m{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px}
.timeline{position:relative;padding-left:27px}.timeline:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}.tl-item{position:relative;padding-bottom:20px}.tl-item:last-child{padding-bottom:0}.tl-dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:#FFF;border:3px solid var(--accent)}.tl-dot.done{background:var(--accent)}.tl-dot.wait{border-color:#94A3B8}.tl-item b{display:block;font-size:14px}.tl-meta{margin-top:2px;color:var(--muted);font-size:12px}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.stat-row:last-child{border-bottom:0}.hint{display:flex;align-items:flex-start;gap:9px;margin-top:2px;padding:11px 13px;border:1px solid var(--accent);border-left:4px solid var(--accent);border-radius:2px;background:#CCFBF1;color:#134E4A;font-size:12px}.hint .material-symbols-outlined{flex:0 0 auto;color:var(--accent);font-size:19px}
.avatar-sm{width:27px;height:27px;flex:0 0 27px;display:inline-flex;align-items:center;justify-content:center;margin-right:7px;border-radius:50%;background:#CCFBF1;color:#115E59;font-size:11px;font-weight:700}.row-name{display:flex;align-items:center;min-width:0}
@keyframes card-in{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.kpi4{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.app{flex-direction:column}.sidebar{width:auto;height:auto;position:static;flex:none;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 0 11px;margin:0}.nav{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:5px;overflow-x:auto}.nav button{justify-content:center;padding:9px}.nav-t{display:none}.side-foot{display:none}.main{padding:20px 16px 40px}.topbar{align-items:flex-start}}
@media(max-width:820px){.g2,.g3,.g23,.form,.bal{grid-template-columns:1fr}.board{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:560px){.kpi4{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.main{padding:16px 12px 34px}.topbar h1{font-size:27px}.pill{width:100%;justify-content:center}.card{padding:15px}.todo-item{align-items:flex-start}.todo-item>.tag{margin-left:auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.card{animation:none!important;transform:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">badge</span></div>
      <div class="brand-txt"><b>ESS 自助服務</b><span>員工自助服務系統</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="userbox">
        <div class="avatar">陳</div>
        <div><b>陳品妍</b><span>製造二部 · 員工</span></div>
      </div>
    </div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var NAV=[
  {t:"我的自助首頁",ic:"dashboard"},
  {t:"電子薪資單",ic:"receipt_long"},
  {t:"請假加班申請",ic:"calendar_month"},
  {t:"簽核流程追蹤",ic:"task_alt"},
  {t:"個人資料異動",ic:"description"},
  {t:"自助服務成效",ic:"insights"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=new ApexCharts(el,opt);
  c.render();
  charts.push(c);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function topbar(title,desc,pillIc,pillTxt){
  return '<div class="topbar"><div><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'
    +'<span class="pill"><span class="material-symbols-outlined">'+pillIc+'</span>'+esc(pillTxt)+'</span></div>';
}

/* ---------- SCREEN 0 : 我的自助首頁 ---------- */
function s0(){
  var kpis=[
    {ic:"pending_actions",lab:"待我處理",val:"3",u:"件",d:"本週新增 2",cls:"flat",di:"remove"},
    {ic:"event_available",lab:"本月已用特休",val:"2.5",u:"天",d:"剩餘 9.5 天",cls:"up",di:"trending_up"},
    {ic:"payments",lab:"本月實發薪資",val:"52,480",u:"元",d:"含加班 3,200",cls:"up",di:"trending_up"},
    {ic:"schedule",lab:"待簽核申請",val:"2",u:"件",d:"平均 0.9 天核准",cls:"up",di:"trending_down"}
  ];
  var todo=[
    {c:"var(--warn)",ic:"assignment_late",t:"補打卡申請待補件",s:"08/12 下午卡未刷，請於今日內補件"},
    {c:"var(--accent)",ic:"fact_check",t:"年度個資確認尚未完成",s:"人資部要求 08/20 前完成眷屬資料確認"},
    {c:"var(--ok)",ic:"school",t:"教育訓練問卷待填",s:"「資安意識」課後問卷 · 約 3 分鐘"}
  ];
  var quick=[
    {ic:"event_busy",t:"我要請假",s:"特休 / 病假 / 事假"},
    {ic:"more_time",t:"加班申請",s:"事前申請工時"},
    {ic:"receipt_long",t:"查薪資單",s:"當月 / 歷月明細"},
    {ic:"contact_page",t:"資料異動",s:"帳戶 / 眷屬 / 證件"}
  ];
  var ann=[
    {t:"2026 年 8 月薪資已發放",s:"人資部 · 08/10 · 電子薪資單可於本系統查詢下載"},
    {t:"中秋節連假出勤公告",s:"人資部 · 08/08 · 09/19～09/22 連假，值班表已上傳"},
    {t:"勞退自提比例調整開放申請",s:"人資部 · 08/05 · 可於個人資料異動提出調整"}
  ];
  var h='';
  h+=topbar("我的自助首頁","陳品妍，午安。以下是您今日待辦與快捷服務。","calendar_today","2026 / 08 / 14（三）");
  h+='<div class="grid kpi4 mb16">';
  kpis.forEach(function(k){
    h+='<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div>'
      +'<div class="val">'+k.val+'<small>'+k.u+'</small></div>'
      +'<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+k.di+'</span>'+esc(k.d)+'</div></div>';
  });
  h+='</div>';
  h+='<div class="grid g23 mb16">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">checklist</span>我的待辦事項</h3><p class="sub">系統依期限自動排序，逾期項目優先顯示</p><div class="todo">';
  todo.forEach(function(t){
    h+='<div class="todo-item"><div class="todo-ic" style="background:'+t.c+'"><span class="material-symbols-outlined">'+t.ic+'</span></div>'
      +'<div class="todo-body"><b>'+esc(t.t)+'</b><span>'+esc(t.s)+'</span></div>'
      +'<span class="tag t-info">前往</span></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>我的自助使用分布</h3><p class="sub">近 30 天服務項目使用次數</p>'
    +'<div class="chartbox" id="c0d"></div></div>';
  h+='</div>';
  h+='<div class="card mb16"><h3><span class="material-symbols-outlined">bolt</span>快捷服務</h3><p class="sub">一鍵前往常用自助功能</p><div class="quick">';
  quick.forEach(function(q){
    h+='<div class="qbtn"><div class="qic"><span class="material-symbols-outlined">'+q.ic+'</span></div><b>'+esc(q.t)+'</b><span>'+esc(q.s)+'</span></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">campaign</span>人資公告</h3><p class="sub">最新 3 則</p><div class="ann">';
  ann.forEach(function(a){
    h+='<div class="ann-item"><b>'+esc(a.t)+'</b><span>'+esc(a.s)+'</span></div>';
  });
  h+='</div></div>';
  return h;
}
function initS0(){
  mk("c0d",{

function buildNav(){
  var nav=document.getElementById("nav");
  var html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="nav-t">'+esc(NAV[i].t)+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var idx=+this.getAttribute("data-i");
      location.hash="go="+idx;
    });
  }
}

function show(i){
  destroyCharts();
  var sc=SCREENS[i]||SCREENS[0];
  var container=document.getElementById("screen");
  container.innerHTML=sc.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);
  }
  void container.offsetHeight;
  sc.i();
}

buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
