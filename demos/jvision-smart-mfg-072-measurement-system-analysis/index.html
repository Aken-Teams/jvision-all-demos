<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../favicon.svg">
<title>品質量測系統分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --radius:4px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 22px rgba(15,23,42,.04)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;
  top:0;
  z-index:20;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#fff;
  border-right:1px solid var(--line)
}
.brand{
  min-height:76px;
  padding:18px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line)
}
.logo{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:3px
}
.logo svg{width:22px;height:22px}
.brand b{
  display:block;
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
  color:var(--ink)
}
.brand small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font:10px/1.35 "Fira Code",monospace
}
.nav{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:12px 10px
}
.nav button{
  width:100%;
  min-height:42px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border:1px solid transparent;
  border-radius:3px;
  background:transparent;
  color:#475569;
  font:500 12.5px "Fira Sans",sans-serif;
  text-align:left;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease
}
.nav button svg{width:18px;height:18px;flex:none}
.nav button .idx{
  margin-left:auto;
  color:#94a3b8;
  font:500 10px "Fira Code",monospace
}
.nav button:hover{
  color:var(--blue);
  background:#eff6ff;
  border-color:#bfdbfe;
  transform:translateX(2px)
}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  font-weight:600
}
.nav button.on .idx{color:#dbeafe}
.railfoot{
  margin-top:auto;
  padding:14px 16px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px
}
.u{display:flex;align-items:center;gap:9px}
.av{
  width:32px;
  height:32px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:#334155;
  border-radius:50%;
  font-weight:700
}
.main{min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:15;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 22px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px)
}
.top h1{
  margin:0;
  font-size:18px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.015em
}
.crumb{
  margin-top:4px;
  color:var(--muted);
  font:10.5px "Fira Code",monospace
}
.sp{flex:1}
.pill,.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  border-radius:999px;
  font-weight:600
}
.pill{
  padding:6px 10px;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  font-size:11px
}
.pill.g{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.pill.o{color:#92400e;background:#fffbeb;border-color:#fde68a}
.view{min-width:0;padding:18px 22px 38px}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:320px minmax(0,1fr)}
.split3{grid-template-columns:286px minmax(0,1fr)}
.card,.lp{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.card{
  padding:15px;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease
}
.card:hover{
  border-color:#bfdbfe;
  box-shadow:0 2px 3px rgba(15,23,42,.05),0 12px 28px rgba(37,99,235,.07);
  transform:translateY(-2px)
}
.card h3{
  margin:0 0 3px;
  color:var(--ink);
  font-size:13px;
  font-weight:700
}
.csub{
  margin:0 0 12px;
  color:var(--muted);
  font-size:11px
}
.kpi{position:relative;overflow:hidden}
.kpi:before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:2px;
  background:var(--blue)
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:600
}
.kpi .lab svg{width:17px;height:17px;color:var(--blue)}
.kpi .val,.big{
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.04em
}
.kpi .val{margin-top:7px;font-size:25px}
.kpi .dt{margin-top:5px;color:var(--muted);font-size:10.5px;font-weight:600}
.kpi .dt.up{color:var(--ok)}
.kpi .dt.dn{color:var(--bad)}
.big{font-size:31px}
.chartbox{position:relative;width:100%}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  font-size:11.5px;
  font-variant-numeric:tabular-nums
}
th{
  padding:8px 9px;
  color:#334155;
  background:#f1f5f9;
  border-top:1px solid var(--line);
  border-bottom:1px solid #cbd5e1;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.015em;
  text-align:left;
  white-space:nowrap
}
td{
  padding:8px 9px;
  border-bottom:1px solid var(--line);
  white-space:nowrap
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
td.mono,td:nth-child(n+2){font-variant-numeric:tabular-nums}
td.mono,.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
td:has(.mono),td.num{text-align:right}
.tag{
  padding:2px 7px;
  border:1px solid transparent;
  font-size:10px
}
.tag:before{
  content:"";
  width:6px;
  height:6px;
  border:1.5px solid currentColor;
  border-radius:50%
}
.tag.ok{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.tag.warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
.tag.bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.tag.info{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.tag.mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.dot{
  width:7px;
  height:7px;
  display:inline-block;
  border-radius:50%;
  outline:1px solid currentColor;
  outline-offset:1px
}
.lp{overflow:hidden}
.lph{
  padding:12px 13px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--line);
  font-size:12.5px;
  font-weight:700
}
.lph svg{width:18px;height:18px;color:var(--blue)}
.li{
  position:relative;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background-color .2s ease,transform .2s ease
}
.li:last-child{border-bottom:0}
.li:hover{background:#f8fbff}
.li.on{background:#eff6ff}
.li.on:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--blue)
}
.li .t{font-size:12px;font-weight:700}
.li .m{
  margin-top:3px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:10.5px
}
.bar{
  height:7px;
  min-width:58px;
  overflow:hidden;
  display:inline-block;
  background:#e2e8f0;
  border-radius:2px
}
.bar i{display:block;height:100%;border-radius:2px}
.mut{color:var(--muted)}
.hr{height:1px;margin:12px 0;background:var(--line)}
.pl{display:flex;flex-direction:column;gap:8px}
.fld{
  min-height:38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:8px 10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:3px;
  font-size:11.5px
}
.fld b{text-align:right;font-weight:600}
.gauge{text-align:center;padding:6px 0}
.mx{
  min-width:560px;
  border-collapse:separate;
  border-spacing:4px
}
.mx th{padding:4px;border:0;background:transparent;text-align:center}
.mx td{padding:0;border:0}
.cell{
  padding:8px 4px;
  border:1px solid var(--line);
  border-radius:2px;
  font:600 11px "Fira Code",monospace;
  text-align:right;
  font-variant-numeric:tabular-nums
}
.mxhead{
  padding:6px 7px!important;
  background:#f1f5f9!important;
  border-radius:2px;
  font-weight:700;
  text-align:left!important
}
.cl{
  display:flex;
  flex-wrap:wrap;
  gap:13px;
  margin-top:8px;
  color:var(--muted);
  font-size:10.5px
}
.cl span{display:inline-flex;align-items:center;gap:5px}
.step{
  display:flex;
  gap:11px;
  padding:11px 0;
  border-bottom:1px solid var(--line)
}
.step:last-child{border-bottom:0}
.step .n{
  width:28px;
  height:28px;
  flex:none;
  display:grid;
  place-items:center;
  color:#1d4ed8;
  background:#dbeafe;
  border:1px solid #93c5fd;
  border-radius:50%;
  font:700 11px "Fira Code",monospace
}
.step.done .n{color:#fff;background:var(--ok);border-color:var(--ok)}
.step.now .n{color:#fff;background:var(--blue);border-color:var(--blue)}
.step .tt{font-size:12px;font-weight:700}
.step .dd{margin-top:2px;color:var(--muted);font-size:10.5px}
.verdict{
  display:flex;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  padding:18px;
  color:#fff;
  background:#065f46;
  border:1px solid #047857;
  border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.verdict svg{width:40px;height:40px}
.verdict .vt{font-size:18px;font-weight:700}
.verdict .vs{margin-top:3px;color:#d1fae5;font-size:11.5px}
.chip{
  display:inline-flex;
  margin:2px 3px 2px 0;
  padding:4px 8px;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:3px;
  font:600 10.5px "Fira Code",monospace
}
.grid-item{animation:enter .4s cubic-bezier(.34,1.45,.64,1) both}
@keyframes enter{
  from{opacity:0;transform:translateY(14px) scale(.97)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{display:block}
  .rail{
    position:relative;
    width:auto;
    height:auto;
    border-right:0;
    border-bottom:1px solid var(--line)
  }
  .brand{min-height:66px}
  .nav{
    flex-direction:row;
    overflow-x:auto;
    padding:8px 10px;
    scrollbar-width:thin
  }
  .nav button{width:auto;flex:none}
  .nav button:hover{transform:translateY(-1px)}
  .railfoot{display:none}
  .top{top:0;min-height:68px}
  .split,.split3{grid-template-columns:1fr}
}
@media(max-width:768px){
  .g3,.g2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand{padding:13px}
  .nav button{min-width:42px;justify-content:center}
  .nav .lbl,.nav .idx{display:none}
  .top{padding:11px 13px}
  .top .pill:first-of-type{display:none}
  .top h1{font-size:16px}
  .view{padding:13px 12px 30px}
  .g4{grid-template-columns:1fr}
  .card{padding:13px}
  .fld{align-items:flex-start;flex-direction:column;gap:3px}
  .fld b{text-align:left}
  .verdict{align-items:flex-start;padding:15px}
  .verdict .vt{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
  .card:hover,.nav button:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="rail">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 19V5h16v14H4Z"/><path d="M8 15V9m4 6V7m4 8v-4"/>
      </svg>
    </div>
    <div><b>品質量測系統分析</b><small>QUALITY INSPECTION / MSA</small></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <div class="railfoot">
    <div class="u">
      <div class="av">計</div>
      <div><div style="color:var(--ink);font-weight:700">陳冠宇 · 計量室</div><div>量測系統工程師</div></div>
    </div>
  </div>
</aside>
<main class="main">
  <header class="top">
    <div>
      <h1 id="ttl">研究計畫設定</h1>
      <div class="crumb" id="crumb">MSA 研究 / 計畫配置</div>
    </div>
    <div class="sp"></div>
    <span class="pill">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 12 3 3 7-7"/><circle cx="12" cy="12" r="9"/></svg>
      AIAG MSA 4th
    </span>
    <span class="pill g" id="statpill"><span class="dot"></span>研究進行中</span>
  </header>
  <section class="view" id="view" aria-live="polite"></section>
</main>
</div>
<script>
(function(){
"use strict";
var view=document.getElementById("view"),charts=[];
var ICONS={
science:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg>',
straighten:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v10H4z"/><path d="M7 7v4m3-4v2m4-2v4m3-4v2"/></svg>',
analytics:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h16"/><path d="m7 15 4-4 3 2 5-6"/></svg>',
timeline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17 9 7l5 8 6-10"/><circle cx="4" cy="17" r="1.5"/><circle cx="9" cy="7" r="1.5"/><circle cx="14" cy="15" r="1.5"/><circle cx="20" cy="5" r="1.5"/></svg>',
groups:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c0-4 2-7 6-7s6 3 6 7m0-6c3 0 5 2 5 5"/></svg>',
task_alt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5h10M9 12h10M9 19h10"/><path d="m3 5 1 1 2-2m-3 8 1 1 2-2m-3 8 1 1 2-2"/></svg>',
folder_open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h7l2 2h9v10H3z"/><path d="m3 18 3-7h15"/></svg>',
verified:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
dataset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/></svg>',
report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3v1"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.analytics}
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function el(id){return document.getElementById(id)}
var MODS=[
{ic:"science",lbl:"研究計畫設定",crumb:"MSA 研究 / 計畫配置",stat:["g","研究進行中"]},
{ic:"straighten",lbl:"數據蒐集",crumb:"MSA 研究 / 盲測錄入",stat:["o","蒐集中 78%"]},
{ic:"analytics",lbl:"Gage R&R 分析",crumb:"MSA 研究 / 變異分析",stat:["g","%GRR 合格"]},
{ic:"timeline",lbl:"偏倚/線性/穩定性",crumb:"MSA 研究 / 標準件研究",stat:["g","系統穩定"]},
{ic:"groups",lbl:"量測人員能力",crumb:"MSA 研究 / 一致性評估",stat:["o","1 人待複測"]},
{ic:"task_alt",lbl:"判讀與改善建議",crumb:"MSA 研究 / 判定關案",stat:["g","可關案"]}
];
var nav=el("nav");
MODS.forEach(function(m,i){
 var b=document.createElement("button");
 b.type="button";b.dataset.i=i;
 b.setAttribute("aria-label",m.lbl);
 b.innerHTML=icon(m.ic)+'<span class="lbl">'+m.lbl+'</span><span class="idx">0'+i+'</span>';
 b.onclick=function(){location.hash="v"+i};
 nav.appendChild(b)
});
var APP=["王雅琪","林志豪","張美玲"];
var PARTS=[.752,.731,.834,.796,.688,.771,.815,.703,.759,.782];
Chart.defaults.font.family='"Fira Sans",sans-serif';
Chart.defaults.color="#475569";
function chartOpts(extra){
 var o={responsive:true,maintainAspectRatio:false,animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:400},plugins:{legend:{labels:{font:{family:"Fira Sans",size:10},boxWidth:10,padding:12,color:"#475569"}}},scales:{}};
 return Object.assign(o,extra||{})
}
function kpi(lab,val,ic,dt,dir){
 var dd=dt?'<div class="dt '+(dir||"")+'">'+(dir==="up"?"↑ ":dir==="dn"?"↓ ":"")+dt+"</div>":"";
 return '<div class="card kpi grid-item"><div class="lab">'+icon(ic)+lab+'</div><div class="val">'+val+"</div>"+dd+"</div>"
}
