<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../../favicon.svg" />
<title>MSA 量測系統分析平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1e1b34;--sub:#6b6784;--line:#e7e5f0;--bg:#f4f3fb;--card:#ffffff;
  --accent:#4f46e5;--accent2:#818cf8;--soft:#eef0ff;
  --ok:#10b981;--warn:#f59e0b;--bad:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh;min-width:0}
.rail{width:246px;flex:none;background:linear-gradient(180deg,#312e81 0%,#4338ca 60%,#4f46e5 100%);color:#e8e7ff;display:flex;flex-direction:column;min-width:0}
.brand{padding:20px 18px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.14)}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.brand .logo .material-symbols-outlined{font-size:23px;color:#fff}
.brand b{font-family:"Noto Sans TC";font-weight:900;font-size:15px;color:#fff;letter-spacing:.3px}
.brand small{display:block;font-size:11px;color:#c7c5ff;font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px;padding:12px 10px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:transparent;color:#d6d4ff;border-radius:10px;cursor:pointer;font-family:"Noto Sans TC";font-size:13.5px;font-weight:500;text-align:left;flex:none;white-space:nowrap;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .idx{margin-left:auto;font-size:11px;opacity:.5;font-weight:700}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.on{background:#fff;color:#4338ca;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.nav button.on .idx{opacity:.4}
.railfoot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:#c7c5ff}
.railfoot .u{display:flex;align-items:center;gap:9px}
.railfoot .av{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-family:"Noto Sans TC";font-size:17px;font-weight:900;margin:0}
.top .crumb{font-size:12px;color:var(--sub);margin-top:1px}
.top .sp{flex:1;min-width:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.pill.g{background:#e7f8f1;color:#0f9d6e}
.pill.o{background:#fff3df;color:#c9820a}
.view{padding:20px 22px 40px;min-width:0}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:340px 1fr}
.split3{grid-template-columns:300px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}
.card h3{font-family:"Noto Sans TC";font-size:14px;font-weight:800;margin:0 0 3px}
.card .csub{font-size:11.5px;color:var(--sub);margin:0 0 12px}
.kpi .lab{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:800;font-family:"Inter";margin-top:6px;letter-spacing:-.5px}
.kpi .val span{font-size:13px;color:var(--sub);font-weight:600;margin-left:3px}
.kpi .dt{font-size:11.5px;margin-top:6px;font-weight:700}
.kpi .dt.up{color:var(--ok)}.kpi .dt.dn{color:var(--bad)}
.chartbox{position:relative;width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-family:"Noto Sans TC";font-weight:700;color:var(--sub);font-size:11.5px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fafaff}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafaff}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.tag.ok{background:#e7f8f1;color:#0f9d6e}
.tag.warn{background:#fff3df;color:#c9820a}
.tag.bad{background:#fdeaea;color:#d64242}
.tag.info{background:var(--soft);color:var(--accent)}
.tag.mut{background:#f0eff7;color:#6b6784}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.lp{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}
.lp .lph{padding:13px 15px;border-bottom:1px solid var(--line);font-family:"Noto Sans TC";font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px}
.lp .lph .material-symbols-outlined{font-size:19px;color:var(--accent)}
.li{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;position:relative}
.li:last-child{border-bottom:0}
.li:hover{background:#fafaff}
.li.on{background:var(--soft)}
.li.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.li .t{font-family:"Noto Sans TC";font-weight:700;font-size:13px}
.li .m{font-size:11.5px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:5px;background:#eceaf6;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px}
.mut{color:var(--sub)}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums}
.big{font-size:32px;font-weight:800;letter-spacing:-1px;font-family:"Inter"}
.hr{height:1px;background:var(--line);margin:12px 0}
.pl{display:flex;flex-direction:column;gap:11px}
.fld{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:8px 11px;background:#fafaff;border:1px solid var(--line);border-radius:9px}
.fld b{font-weight:700}
.gauge{text-align:center;padding:6px 0}
.mx{width:100%;border-collapse:separate;border-spacing:5px;min-width:560px}
.mx th{background:transparent;border:0;text-align:center;padding:4px}
.mx td{padding:0;border:0}
.cell{border-radius:8px;padding:9px 4px;text-align:center;font-size:12px;font-weight:700;font-family:"Inter";border:1px solid var(--line)}
.mxhead{font-family:"Noto Sans TC";font-weight:800;font-size:12px;text-align:left;padding:6px 8px !important;background:#fafaff;border-radius:8px}
.cl{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:8px}
.cl span{display:inline-flex;align-items:center;gap:5px}
.step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--soft);color:var(--accent)}
.step.done .n{background:var(--ok);color:#fff}
.step.now .n{background:var(--accent);color:#fff}
.step .sb{min-width:0}
.step .sb .tt{font-family:"Noto Sans TC";font-weight:700;font-size:13.5px}
.step .sb .dd{font-size:11.5px;color:var(--sub);margin-top:2px}
.verdict{border-radius:14px;padding:18px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.verdict.ok{background:linear-gradient(120deg,#10b981,#0f9d6e)}
.verdict .material-symbols-outlined{font-size:44px}
.verdict .vt{font-family:"Noto Sans TC";font-weight:900;font-size:20px}
.verdict .vs{font-size:12.5px;opacity:.9;margin-top:3px}
.chip{display:inline-block;background:var(--soft);color:var(--accent);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:700;margin:2px 3px 2px 0}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .rail{width:auto}
  .brand{border-bottom:0}
  .nav{flex-direction:row;flex-wrap:wrap;overflow-x:auto;padding:8px 10px}
  .nav button{flex:none}
  .railfoot{display:none}
  .split,.split3{grid-template-columns:1fr}
}
@media(max-width:820px){
  .g4,.g3,.g2,.split,.split3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
  .nav button .idx{display:none}
  .view{padding:16px 13px 34px}
  .top{padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">straighten</span></div>
      <div>
        <b>MSA 量測系統分析</b>
        <small>Measurement System Analysis</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <div class="u">
        <div class="av">計</div>
        <div>
          <div style="color:#fff;font-weight:700">陳冠宇 · 計量室</div>
          <div>量測系統工程師</div>
        </div>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="ttl">研究計畫設定</h1>
        <div class="crumb" id="crumb">MSA 研究 / 計畫配置</div>
      </div>
      <div class="sp"></div>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span> AIAG MSA 4th</span>
      <span class="pill g" id="statpill"><span class="dot" style="background:#0f9d6e"></span> 研究進行中</span>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<script>
(function(){
"use strict";
var view=document.getElementById("view");
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

var MODS=[
  {ic:"science",lbl:"研究計畫設定",crumb:"MSA 研究 / 計畫配置",stat:["g","研究進行中"]},
  {ic:"straighten",lbl:"數據蒐集",crumb:"MSA 研究 / 盲測錄入",stat:["o","蒐集中 78%"]},
  {ic:"analytics",lbl:"Gage R&R 分析",crumb:"MSA 研究 / 變異分析",stat:["g","%GRR 合格"]},
  {ic:"timeline",lbl:"偏倚/線性/穩定性",crumb:"MSA 研究 / 標準件研究",stat:["g","系統穩定"]},
  {ic:"groups",lbl:"量測人員能力",crumb:"MSA 研究 / 一致性評估",stat:["o","1 人待複測"]},
  {ic:"task_alt",lbl:"判讀與改善建議",crumb:"MSA 研究 / 判定關案",stat:["g","可關案"]}
];

var nav=document.getElementById("nav");
MODS.forEach(function(m,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+m.ic+'</span><span class="lbl">'+m.lbl+'</span><span class="idx">0'+i+'</span>';
  b.addEventListener("click",function(){show(i);});
  nav.appendChild(b);
});

var APP=["王雅琪","林志豪","張美玲"];
var PARTS=[0.752,0.731,0.834,0.796,0.688,0.771,0.815,0.703,0.759,0.782];

function chartOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11},boxWidth:12,padding:12,color:"#6b6784"}}},scales:{}};
  return Object.assign(o,extra||{});
}

/* ===== S0 研究計畫設定 ===== */
function s0(){
  var plans=[
    {id:"MSA-24-0912",feat:"齒輪外徑 Ø",gage:"三次元量床 CMM-02",kind:"Gage R&R",st:"進行中",stc:"info",prog:60},
    {id:"MSA-24-0908",feat:"軸承內孔徑",gage:"數位卡尺 CAL-118",kind:"Gage R&R",st:"分析中",stc:"warn",prog:85},
    {id:"MSA-24-0901",feat:"活塞銷長度",gage:"外徑分厘卡 MI-07",kind:"偏倚/線性",st:"已完成",stc:"ok",prog:100},
    {id:"MSA-24-0895",feat:"鎖付扭力",gage:"扭力扳手 TQ-33",kind:"穩定性",st:"排程",stc:"mut",prog:15},
    {id:"MSA-24-0889",feat:"焊點面積",gage:"影像量測儀 VMS-05",kind:"屬性一致性",st:"進行中",stc:"info",prog:45}
  ];
  var rows=plans.map(function(p,i){
    return '<div class="li'+(i===0?' on':'')+'"><div class="t">'+p.id+' · '+p.feat+'</div>'+
      '<div class="m"><span class="tag '+p.stc+'">'+p.st+'</span><span>'+p.kind+'</span><span class="mut">'+p.gage+'</span></div>'+
      '<div class="m" style="margin-top:6px;align-items:center"><span class="bar" style="flex:1"><i style="width:'+p.prog+'%;background:var(--accent)"></i></span><span class="mono mut">'+p.prog+'%</span></div></div>';
  }).join("");
  view.innerHTML=
  '<div class="grid split3">'+
    '<div class="lp"><div class="lph"><span class="material-symbols-outlined">folder_open</span>研究計畫清單 ('+plans.length+')</div>'+rows+'</div>'+
    '<div class="grid" style="gap:14px">'+
      '<div class="grid g4">'+
        kpi("備妥量具","24","assignment_turned_in","+3 本週","up")+
        kpi("進行中研究","5","science","","")+
        kpi("本季 %GRR 合格率","88%","verified","+6%","up")+
        kpi("到期研究","2","event","≤3 天","dn")+
      '</div>'+
      '<div class="grid g2">'+
        '<div class="card"><h3>研究配置 — MSA-24-0912</h3><p class="csub">齒輪外徑 Ø · 三次元量床 CMM-02</p>'+
          '<div class="pl">'+
            fld("研究類型","Crossed Gage R&R")+
            fld("取樣零件數","10 件（涵蓋公差範圍）")+
            fld("量測人員","3 人 · A/B/C")+
            fld("重複量測次數","3 次 / 盲測")+
            fld("規格公差 (Tolerance)","0.120 mm")+
            fld("量具解析度","0.001 mm")+
          '</div></div>'+
        '<div class="card"><h3>取樣涵蓋度</h3><p class="csub">10 件量測值分佈於公差帶</p>'+
          '<div class="chartbox" style="height:150px"><canvas id="c0a"></canvas></div>'+
          '<div class="hr"></div><div style="font-size:12px;color:var(--sub)">建議取樣涵蓋 <b style="color:var(--ink)">80% 以上</b>製程變異，目前涵蓋 <b style="color:var(--accent)">92%</b>，取樣合格。</div>'+
        '</div>'+
      '</div>'+
      '<div class="card"><h3>量測順序表（隨機盲測）</h3><p class="csub">系統依隨機化排定量測人員 × 零件執行順序，避免記憶偏差</p>'+
        '<div style="overflow-x:auto"><table><thead><tr><th>順序</th><th>回合 Trial</th><th>量測人員</th><th>零件編號</th><th>狀態</th></tr></thead><tbody>'+
        seqRows()+'</tbody></table></div></div>'+
    '</div>'+
  '</div>';
  view.querySelectorAll(".lp .li").forEach(function(n){n.addEventListener("click",function(){view.querySelectorAll(".lp .li").forEach(function(x){x.classList.remove("on");});n.classList.add("on");});});
  void view.offsetHeight;
  charts.push(new Chart(el("c0a"),{type:"bar",data:{labels:["P1","P2","P3","P4","P5","P6","P7","P8","P9","P10"],
    datasets:[{label:"量測值 mm",data:PARTS,backgroundColor:"#818cf8",borderRadius:5,barPercentage:.7}]},
    options:chartOpts({plugins:{legend:{display:false}},scales:{y:{min:0.65,max:0.86,ticks:{font:{size:9}},grid:{color:"#f0eff7"}},x:{ticks:{font:{size:9}},grid:{display:false}}}})}));
}
function seqRows(){
  var seq=[["001","1","王雅琪","P07","已測"],["002","1","王雅琪","P03","已測"],["003","1","林志豪","P05","已測"],
    ["004","1","張美玲","P09","進行中"],["005","2","王雅琪","P02","待測"],["006","2","林志豪","P08","待測"],["007","2","張美玲","P01","待測"]];
  return seq.map(function(r){
    var st=r[4]==="已測"?'<span class="tag ok">已測</span>':r[4]==="進行中"?'<span class="tag warn">進行中</span>':'<span class="tag mut">待測</span>';
    return '<tr><td class="mono">'+r[0]+'</td><td>第 '+r[1]+' 回合</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td><td>'+st+'</td></tr>';
  }).join("");
}

/* ===== S1 數據蒐集 ===== */
function s1(){
  function mkVal(base,ap,tr){var jit=(ap-1)*0.004+(tr-1)*0.002+(Math.sin(base*97+ap*13+tr*7)*0.006);return base+jit;}
  var head='<tr><th class="mxhead">零件</th>';
  for(var a=0;a<3;a++){for(var t=1;t<=3;t++){head+='<th>'+String.fromCharCode(65+a)+'·T'+t+'</th>';}}
  head+='<th>全距 R</th></tr>';
  var body="";
  for(var p=0;p<10;p++){
    var vals=[],cells="";
    for(var a2=0;a2<3;a2++){for(var t2=1;t2<=3;t2++){var v=mkVal(PARTS[p],a2+1,t2);vals.push(v);
      var filled=(p<7)||(p===7&&a2<2);
      var bg=filled?"#eef0ff":"#fafaff";var col=filled?"#3730a3":"#c7c3dc";
      cells+='<td><div class="cell" style="background:'+bg+';color:'+col+'">'+(filled?v.toFixed(3):'—')+'</div></td>';
    }}
    var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
    body+='<tr><td class="mxhead">P'+(p<9?'0':'')+(p+1)+'</td>'+cells+'<td><div class="cell" style="background:#fff3df;color:#c9820a">'+(mx-mn).toFixed(3)+'</div></td></tr>';
  }
  view.innerHTML=
  '<div class="grid g4">'+
    kpi("應收資料","90","dataset","10件×3人×3次","")+
    kpi("已錄入","70","edit_note","78% 完成","up")+
    kpi("異常值攔截","2","report","超 4σ 已標記","dn")+
    kpi("平均全距 R̄","0.016","open_in_full","mm","")+
  '</div>'+
  '<div class="grid split" style="margin-top:14px">'+
    '<div class="grid" style="gap:14px">'+
      '<div class="card"><h3>錄入進度（依量測人員）</h3><p class="csub">A/B/C 三位量測人員盲測完成率</p>'+
        progRow("王雅琪 (A)",100,"var(--ok)")+progRow("林志豪 (B)",83,"var(--accent)")+progRow("張美玲 (C)",52,"var(--warn)")+
        '<div class="hr"></div><div class="chartbox" style="height:120px"><canvas id="c1a"></canvas></div>'+
      '</div>'+
      '<div class="card"><h3>資料檢核</h3><p class="csub">系統即時規則檢查</p>'+
        checkRow("盲測順序未被跳號","ok")+checkRow("重複量測差異在管制內","ok")+
        checkRow("P08 第2次超出 4σ，已標記重測","warn")+checkRow("量測人員 C 尚有 8 筆待錄","warn")+
      '</div>'+
    '</div>'+
    '<div class="card"><h3>量測資料矩陣（10 零件 × 3 人 × 3 次）</h3><p class="csub">盲測值 mm — 黃色為該零件全距 R</p>'+

function judge(l,v,r,c){
  return '<div class="fld"><span><b>'+l+'</b> <span class="mut mono" style="margin-left:6px">'+v+'</span></span><span class="tag '+c+'">'+r+'</span></div>';
}
function step(cls,n,t,d){
  return '<div class="step '+cls+'"><div class="n">'+(cls==="done"?'✓':n)+'</div><div class="sb"><div class="tt">'+t+'</div><div class="dd">'+d+'</div></div></div>';
}

/* helpers */
function kpi(lab,val,ic,dt,dir){
  var dd=dt?'<div class="dt '+(dir==="up"?"up":dir==="dn"?"dn":"")+'">'+(dir==="up"?'▲ ':dir==="dn"?'▼ ':'')+dt+'</div>':'';
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+'</div>'+dd+'</div>';
}
function fld(l,v){return '<div class="fld"><span class="mut">'+l+'</span><b>'+v+'</b></div>';}

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(RENDER.length-1,i|0));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var m=MODS[i];
  el("ttl").textContent=m.lbl;
  el("crumb").textContent=m.crumb;
  var sp=el("statpill");sp.className="pill "+(m.stat[0]==="g"?"g":m.stat[0]==="o"?"o":"");
  sp.innerHTML='<span class="dot" style="background:'+(m.stat[0]==="o"?"#c9820a":"#0f9d6e")+'"></span> '+m.stat[1];
  RENDER[i]();
}
window.show=show;
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
if(!(location.hash||"").match(/(?:go=|v)([0-9]+)/)){show(0);}
})();
</script>
