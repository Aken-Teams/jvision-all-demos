<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勞動法規合規管理系統 Labor Compliance Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --radius:12px;
  --serif:"Crimson Pro","Noto Serif TC","PMingLiU",serif;
  --display:"Cormorant Garamond","Noto Serif TC","PMingLiU",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:var(--serif);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#fff;
  background:#115E59;
  border-bottom:4px solid var(--color-secondary)
}
.topbar-in{
  max-width:1400px;
  min-height:64px;
  margin:auto;
  padding:10px 22px;
  display:flex;
  align-items:center;
  gap:18px
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#062E2B;
  background:var(--color-secondary);
  border:2px solid #99F6E4;
  border-radius:10px
}
.brand h1{
  margin:0;
  font-family:var(--display);
  font-size:21px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.brand .sub{
  margin-top:-2px;
  color:#CCFBF1;
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.08em
}
.top-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px
}
.top-pill{
  min-height:36px;
  padding:6px 11px;
  display:flex;
  align-items:center;
  gap:6px;
  background:#0F766E;
  border:1px solid #5EEAD4;
  border-radius:999px;
  font-size:13px;
  white-space:nowrap
}
.avatar{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  color:#042F2E;
  background:#FCD34D;
  border:2px solid #FFFBEB;
  border-radius:50%;
  font-weight:700
}
.nav{
  position:sticky;
  top:64px;
  z-index:35;
  background:var(--color-card);
  border-bottom:1px solid var(--color-border)
}
.nav-in{
  max-width:1400px;
  margin:auto;
  padding:0 16px;
  display:flex;
  overflow-x:auto;
  scrollbar-width:thin
}
.nav button{
  min-height:52px;
  padding:10px 14px;
  display:flex;
  flex:0 0 auto;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:0;
  border-bottom:4px solid transparent;
  font-size:14px;
  font-weight:600;
  transition:color .18s ease,background-color .18s ease,border-color .18s ease
}
.nav button:hover{color:#0F766E;background:#F0FDFA}
.nav button.active{
  color:#115E59;
  background:#CCFBF1;
  border-bottom-color:var(--color-accent)
}
.wrap{max-width:1400px;margin:auto;padding:26px 22px 64px}
.screen{animation:reveal .35s ease both}
.screen-head{
  margin-bottom:20px;
  padding-bottom:17px;
  display:flex;
  align-items:flex-start;
  gap:13px;
  border-bottom:2px solid var(--color-border)
}
.screen-head .ic{
  width:46px;
  height:46px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#032F2C;
  background:var(--color-secondary);
  border:2px solid var(--color-primary);
  border-radius:10px
}
.screen-head .ic .material-symbols-outlined{font-size:25px}
.screen-head h2{
  margin:0;
  color:#0F4F4A;
  font-family:var(--display);
  font-size:27px;
  line-height:1.08
}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ha{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  min-height:40px;
  padding:8px 13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--ink);
  background:#fff;
  border:1px solid #2DD4BF;
  border-radius:9px;
  font-size:14px;
  font-weight:600;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease
}
.btn:hover{background:#CCFBF1;border-color:#0D9488}
.btn.primary{
  color:#1C1917;
  background:var(--color-accent);
  border-color:#92400E
}
.btn.primary:hover{background:#B45309;color:#fff}
.btn.ghost{background:#F8FAFC}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.panel,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius)
}
.panel{padding:17px}
.panel h3{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#134E4A;
  font-family:var(--display);
  font-size:19px;
  line-height:1.2
}
.panel h3 .material-symbols-outlined{color:var(--color-primary)}
.panel .sub{margin-left:auto;color:var(--muted);font-family:var(--serif);font-size:13px;font-weight:400}
.kpi{
  position:relative;
  overflow:hidden;
  padding:16px 16px 15px 19px;
  border-top:4px solid var(--tone,var(--color-primary))
}
.kpi .kl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:14px;
  font-weight:600
}
.kpi .kl .material-symbols-outlined{color:var(--tone,var(--color-primary))}
.kpi .kv{
  margin-top:8px;
  color:#123D3A;
  font-family:var(--display);
  font-size:31px;
  font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums
}
.kpi .kd{margin-top:7px;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.up{color:#166534}.down{color:#991B1B}.flat{color:#475569}
.overflow-x{overflow-x:auto}
.chart-box{min-width:0;overflow:hidden}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  font-variant-numeric:tabular-nums
}
th,td{
  padding:11px 10px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid #99F6E4
}
th{
  color:#134E4A;
  background:#CCFBF1;
  border-top:1px solid #5EEAD4;
  font-family:var(--serif);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
td.wrap-cell{min-width:190px;white-space:normal}
td.num,.num{text-align:right;font-variant-numeric:tabular-nums}
.code,time,.code-cell{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}
.tag{
  min-height:25px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap
}
.tag .material-symbols-outlined{font-size:15px}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#991B1B;background:#FEF2F2}
.t-info{color:#1E40AF;background:#EFF6FF}
.t-cyan{color:#115E59;background:#ECFDF5}
.t-gray{color:#334155;background:#F8FAFC}
.board{
  display:grid;
  grid-template-columns:repeat(5,minmax(210px,1fr));
  gap:11px
}
.board.b4{grid-template-columns:repeat(4,minmax(230px,1fr))}
.col{
  min-width:0;
  padding:11px;
  background:#F8FAFC;
  border:1px solid #99F6E4;
  border-radius:10px
}
.col-head{
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#134E4A;
  font-size:14px;
  font-weight:700
}
.dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.cnt{
  margin-left:auto;
  min-width:25px;
  padding:1px 7px;
  color:#334155;
  background:#fff;
  border:1px solid #CBD5E1;
  border-radius:999px;
  text-align:center;
  font-family:var(--mono);
  font-size:11px
}
.card{
  margin-bottom:9px;
  padding:11px;
  background:#fff;
  border:1px solid #CBD5E1;
  border-left:4px solid var(--color-primary);
  border-radius:8px;
  transition:background-color .18s ease,border-color .18s ease
}
.card:hover{background:#F0FDFA;border-color:#2DD4BF}
.card:last-child{margin-bottom:0}
.ct{margin-bottom:5px;color:#163E3B;font-size:14px;font-weight:700}
.cm{display:flex;align-items:center;gap:5px;color:#475569;font-size:12px}
.cm .material-symbols-outlined{font-size:15px}
.cf{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}
.mini-av{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  color:#fff;
  background:#0F766E;
  border-radius:50%;
  font-weight:700
}
.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:#5EEAD4}
.tl-item{position:relative;padding:0 0 17px 7px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{
  content:"";
  position:absolute;
  top:4px;
  left:-21px;
  width:11px;
  height:11px;
  background:#fff;
  border:3px solid #0D9488;
  border-radius:50%
}
.tl-item.warn:before{border-color:#D97706}
.tl-item.bad:before{border-color:#DC2626}
.tt{font-weight:700}.td{color:#475569;font-size:13px}.tm{color:#0F766E;font-family:var(--mono);font-size:12px;font-weight:600}
.pbar{height:9px;overflow:hidden;background:#E2E8F0;border:1px solid #CBD5E1;border-radius:999px}
.pbar i{display:block;height:100%;background:#0D9488}
.list-row{padding:10px 2px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #CCFBF1}
.list-row:last-child{border-bottom:0}
.ln{font-weight:600}.lg{margin-left:auto;color:#475569;white-space:nowrap}
.legend{margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;color:#475569;font-size:13px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;display:inline-block;border-radius:2px}
.notice{
  padding:13px 14px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  color:#134E4A;
  background:#CCFBF1;
  border:1px solid #2DD4BF;
  border-left:5px solid #0D9488;
  border-radius:9px;
  font-size:14px
}
.notice .material-symbols-outlined{flex:0 0 auto;color:#0F766E}
.foot{max-width:1400px;margin:auto;padding:16px 22px 38px;color:#475569;text-align:center;font-size:12px}
.mb{margin-bottom:16px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:auto!important}
  .board,.board.b4{grid-template-columns:repeat(2,minmax(230px,1fr))}
}
@media(max-width:768px){
  .wrap{padding:20px 15px 52px}
  .topbar-in{padding:10px 15px}
  .g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}
  .screen-head{align-items:center}
  .ha{width:100%;margin-left:59px}
  .btn{min-height:44px}
}
@media(max-width:560px){
  .topbar-in{min-height:58px}
  .nav{top:58px}
  .brand h1{font-size:18px}
  .brand .sub,.hide-sm,.nav .txt{display:none}
  .nav-in{justify-content:space-between;padding:0 6px}
  .nav button{min-width:48px;justify-content:center;padding:11px}
  .g4{grid-template-columns:1fr}
  .board,.board.b4{grid-template-columns:1fr}
  .screen-head h2{font-size:23px}
  .ha{margin-left:0}
  .ha .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  .screen{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">gavel</span></div>
      <div style="min-width:0">
        <h1>勞動法規合規管理系統</h1>
        <div class="sub">Labor Compliance Management · 人力資源合規平台</div>
      </div>
    </div>
    <div class="top-right">
      <div class="top-pill hide-sm"><span class="material-symbols-outlined" aria-hidden="true">location_on</span>台灣 · 華東 · 越南</div>
      <div class="top-pill" aria-label="7 則通知"><span class="material-symbols-outlined" aria-hidden="true">notifications</span><span class="code">7</span></div>
      <div class="avatar" aria-label="法務使用者">法</div>
    </div>
  </div>
</header>
<nav class="nav" aria-label="主要功能"><div class="nav-in" id="nav"></div></nav>
<main class="wrap"><div id="app" aria-live="polite"></div></main>
<footer class="foot">勞動法規合規管理系統 · 展示用途 · 全部為模擬資料，不連接任何後端服務</footer>
<script>
(function(){
"use strict";
var MODULES=[
 {icon:"gavel",name:"法規異動資料庫",sub:"各地勞動法規版本追蹤與生效通知"},
 {icon:"fact_check",name:"影響評估看板",sub:"法規異動對制度衝擊的評估與指派"},
 {icon:"monitoring",name:"工時加班檢核",sub:"工時與加班上限自動比對與告警"},
 {icon:"checklist",name:"合規稽核清單",sub:"稽核項目執行與缺失記錄"},
 {icon:"rule",name:"缺失改善追蹤",sub:"缺失指派、期限與改善進度看板"},
 {icon:"verified",name:"遵循率與報告",sub:"法規遵循率、勞檢缺失統計與報告存檔"}
];
var app=document.getElementById("app"),navEl=document.getElementById("nav"),charts=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function icon(n){return'<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
function destroyCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
 var node=document.getElementById(id);if(!node||typeof ApexCharts==="undefined")return;
 opt.chart=opt.chart||{};opt.chart.animations={enabled:false};opt.chart.fontFamily='"Crimson Pro",serif';
 opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
 try{var c=new ApexCharts(node,opt);c.render();charts.push(c)}catch(e){}
}
function button(iconName,label,primary){
 return'<button type="button" class="btn '+(primary?"primary":"ghost")+'">'+icon(iconName)+esc(label)+"</button>"
}
function head(i,actions){
 var m=MODULES[i];
 return'<section class="screen"><header class="screen-head"><div class="ic">'+icon(m.icon)+'</div><div style="min-width:0"><h2>'+esc(m.name)+'</h2><p>'+esc(m.sub)+'</p></div><div class="ha">'+actions+"</div></header>"
}
function kpi(color,iconName,label,val,delta,cls){
 return'<article class="kpi" style="--tone:'+color+'"><div class="kl">'+icon(iconName)+esc(label)+'</div><div class="kv">'+val+'</div><div class="kd '+cls+'">'+delta+"</div></article>"
}
function tag(text,cls,iconName){return'<span class="tag '+cls+'">'+(iconName?icon(iconName):"")+esc(text)+"</span>"}
navEl.innerHTML=MODULES.map(function(m,i){
 return'<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'">'+icon(m.icon)+'<span class="txt">'+esc(m.name)+"</span></button>"
}).join("");
navEl.addEventListener("click",function(e){
 var b=e.target.closest("[data-i]");if(b)location.hash="go="+b.getAttribute("data-i")
});

function s0(){
 var kpis=
 kpi("#0D9488","update","本季法規異動","23 件",icon("arrow_upward")+"較上季 +6","up")+
 kpi("#DC2626","priority_high","高衝擊待處理","5 件",icon("warning")+"需30日內調整","down")+
 kpi("#1D4ED8","campaign","已推送通知","41 則",icon("check")+"覆蓋 8 單位","flat")+
 kpi("#15803D","task_alt","已完成調整","14 件",icon("arrow_upward")+"完成率 61%","up");
 var cols=[
  {t:"新公告",dot:"#1D4ED8",items:[["越南加班上限修正 (法令 45/2019)","越南廠","生效 2026-09-01","高","陳"],["勞退提繳率調整公告","台灣全區","生效 2026-10-01","中","林"]]},
  {t:"評估中",dot:"#0D9488",items:[["最低工資 27,470 元調升","台灣全區","生效 2026-01-01","高","王"],["女性夜間工作規定放寬","台灣全區","生效 2026-07-01","低","李"]]},
  {t:"制度調整",dot:"#7C3AED",items:[["特休遞延辦法更新","全集團","目標 2026-08-31","中","周"]]},
  {t:"待通知",dot:"#D97706",items:[["華東綜合工時備案續期","華東廠","到期 2026-08-20","高","吳"]]},
  {t:"已生效",dot:"#15803D",items:[["職安衛教育訓練時數新制","全集團","生效 2026-06-01","中","鄭"],["育嬰留停彈性化","台灣全區","生效 2026-03-01","低","何"]]}
 ];
 var board='<div class="board">';
 cols.forEach(function(col){
  board+='<section class="col"><div class="col-head"><span class="dot" style="background:'+col.dot+'"></span>'+esc(col.t)+'<span class="cnt">'+col.items.length+"</span></div>";
