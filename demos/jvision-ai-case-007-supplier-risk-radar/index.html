<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供應交期預警塔 · Supplier Risk Radar</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#b45309;--accent2:#d97706;--teal:#0f766e;--ink:#231a10;--bg:#f7f3ec;--card:#fff;--line:#ece3d5;--mut:#7a6a54;--ok:#15803d;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(180,83,9,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#f7f3ec;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fef3c7;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:.9fr 1.1fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0e7ff;color:#3730a3}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf6ef}
.chart{height:250px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:10px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.al .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.sup{display:flex;flex-direction:column;gap:10px}
.sr{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.sr .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-family:"Noto Sans TC"}
.sr .mid b{font-size:13px;font-family:"Noto Sans TC"}
.sr .mid small{color:var(--mut);font-size:11px}
.sr .sc{text-align:right}
.sr .sc b{font-family:Inter;font-size:16px}
.sr .sc small{display:block;font-size:10px;color:var(--mut)}
.gantt{display:flex;flex-direction:column;gap:8px}
.gr{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;font-size:12px}
.gr .track{position:relative;height:22px;background:#faf6ef;border-radius:6px;overflow:hidden}
.gr .track i{position:absolute;top:3px;height:16px;border-radius:5px;display:flex;align-items:center;padding:0 7px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.scroll{overflow-x:auto}
.leaf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lc{border:1px solid var(--line);border-radius:13px;padding:13px;border-top:4px solid var(--teal)}
.lc b{font-family:"Noto Sans TC";font-size:13.5px}
.lc .big{font-family:Inter;font-weight:800;font-size:22px;color:var(--teal);margin-top:4px}
.lc small{color:var(--mut);font-size:11px;display:block}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.gr{grid-template-columns:100px 1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">塔</div><div><b>供應交期預警塔</b><span>SUPPLIER RISK RADAR</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">風險預警塔</h2><p id="vd"></p></div><div class="live">監控 86 家供應商 · 5 筆交期預警</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["風險預警塔","radar","風險預警塔","供應商風險、交期預警與採購全局戰情"],
["供應商管理","apartment","供應商管理","供應商檔案、分級與績效評比"],
["詢報價協作","request_quote","詢報價協作","發詢價、線上比價與議合"],
["採購訂單","receipt_long","採購訂單","採購單、交期承諾與進度追蹤"],
["交期風險","event_busy","交期風險","交期延遲預警與到貨甘特"],
["供應商品質","verified_user","供應商品質","到貨驗收、允收率與品質評分"],
["綠色採購","eco","綠色採購","碳排、環保認證與綠色採購占比"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const SUP=[["佳金屬","金","金屬件","A",92,"t-ok"],["O野電子","綠","電子料","A",88,"t-ok"],["泰精密","泰","機構件","B",74,"t-warn"],["昌塑膠","昌","塑膠件","B",69,"t-warn"],["宏五金","宏","五金","C",58,"t-bad"],["新化工","新","化工料","B",71,"t-warn"]];
const ALERT=[["宏五金 PO-8821 交期延遲","承諾 8/14 → 預估 8/19，延遲 5 天，影響 B 線","bad","即時"],["昌塑膠 良率下滑至 96.2%","近 3 批允收率下降，建議稽核","warn","1 小時前"],["泰精密 產能吃緊","回報 8 月產能滿載，新單交期拉長","warn","3 小時前"]];
const PO=[["PO-8821","宏五金","冷鍛螺絲×20k","8/14","延遲 +5","t-bad"],["PO-8820","佳金屬","衝壓件×8k","8/12","如期","t-ok"],["PO-8819","O野電子","連接器×15k","8/13","如期","t-ok"],["PO-8818","昌塑膠","外殼×6k","8/15","風險","t-warn"],["PO-8817","泰精密","齒輪×3k","8/16","風險","t-warn"]];
const GANTT=[["PO-8820 佳金屬",5,55,"#15803d","如期"],["PO-8819 綠野電子",12,48,"#15803d","如期"],["PO-8818 昌塑膠",20,42,"#d97706","風險"],["PO-8817 泰精密",30,40,"#d97706","風險"],["PO-8821 宏五金",44,50,"#dc2626","延遲"]];
const RFQ=[["RFQ-2205","精密齒輪 5k","3 家報價","泰精密 最低","比價中","t-warn"],["RFQ-2204","電源模組 2k","4 家報價","綠野電子 得標","已核准","t-ok"],["RFQ-2203","鋁擠型 8k","2 家報價","佳金屬 議合中","議合中","t-warn"]];
const QUAL=[["佳金屬",99.2,0.6,"A"],["O野電子",98.8,1.1,"A"],["泰精密",97.4,2.4,"B"],["昌塑膠",96.2,3.6,"B"],["宏五金",93.5,6.1,"C"]];

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">schedule</span><div class="l">採購前置時間</div><div class="v">4.9<small style="font-size:12px"> 天</small></div><div class="d up">▼ 較 9.5 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">event_available</span><div class="l">準時到貨率</div><div class="v">92<small style="font-size:12px">%</small></div><div class="d up">▲ 較 78%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">notifications_active</span><div class="l">缺料預警覆蓋</div><div class="v">86<small style="font-size:12px">%</small></div><div class="d up">▲ 提前 5 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">交期預警</div><div class="v" style="color:var(--bad)">5</div><div class="d" style="color:var(--mut)">1 延遲 · 4 風險</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">radar</span>供應商風險雷達</h3><div class="chart" id="c_rd" style="height:280px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">crisis_alert</span>交期風險預警</h3><div class="alist">${ALERT.map(a=>`<div class="al ${a[2]}"><span class="material-symbols-outlined">${a[2]=='bad'?'error':'warning'}</span><div><b>${a[0]}</b><small>${a[1]}</small></div><span class="tm">${a[3]}</span></div>`).join('')}</div></div>
</div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">apartment</span>供應商分級與績效</h3><div class="sup">${SUP.map(s=>`<div class="sr"><span class="av">${s[1]}</span><div class="mid"><b>${s[0]}</b><small>${s[2]} · 等級 ${s[3]}</small></div><div class="sc"><b style="color:${s[4]>=85?'#15803d':s[4]>=65?'#b45309':'#b91c1c'}">${s[4]}</b><small>綜合分</small></div></div>`).join('')}</div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">request_quote</span>詢報價協作</h3><div class="scroll"><table class="data"><tr><th>詢價單</th><th>品項</th><th>報價</th><th>目前最佳</th><th>狀態</th></tr>${RFQ.map(r=>`<tr><td><b style="color:var(--accent)">${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="tag ${r[5]}">${r[4]}</span></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>採購訂單與交期承諾</h3><div class="scroll"><table class="data"><tr><th>採購單</th><th>供應商</th><th>品項</th><th>承諾交期</th><th>狀態</th></tr>${PO.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td><span class="tag ${p[5]}">${p[4]}</span></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">event_busy</span>到貨交期甘特（8 月）<span class="tag t-bad" style="margin-left:auto">1 延遲</span></h3><div class="gantt"><div class="gr"><b></b><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut)"><span>8/1</span><span>8/10</span><span>8/20</span><span>8/31</span></div></div>${GANTT.map(g=>`<div class="gr"><b style="font-family:Noto Sans TC">${g[0]}</b><div class="track"><i style="left:${g[1]}%;width:${g[2]-g[1]+8}%;background:${g[3]}">${g[4]}</i></div></div>`).join('')}</div><p style="font-size:11.5px;color:var(--mut);margin:13px 0 0">紅色為已延遲、橘色為風險；系統於承諾交期前 5 天自動預警。</p></div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">verified_user</span>供應商品質評分</h3><div class="scroll"><table class="data"><tr><th>供應商</th><th>允收率%</th><th>不良率%</th><th>等級</th></tr>${QUAL.map(q=>`<tr><td><b>${q[0]}</b></td><td>${q[1]}</td><td style="color:${q[2]>4?'#b91c1c':'inherit'}">${q[2]}</td><td><span class="tag ${q[3]=='A'?'t-ok':q[3]=='B'?'t-warn':'t-bad'}">${q[3]}</span></td></tr>`).join('')}</table></div></div><div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近半年允收率趨勢</h3><div class="chart" style="height:250px" id="c_ql"></div></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">eco</span>綠色採購指標</h3><div class="leaf"><div class="lc"><b>綠色採購占比</b><div class="big">64%</div><small>▲ 較去年 +18%</small></div><div class="lc"><b>環保認證供應商</b><div class="big">52<small style="font-size:11px"> 家</small></div><small>占 60% 供應商</small></div><div class="lc"><b>採購碳排</b><div class="big">-12%</div><small>較基準年下降</small></div><div class="lc"><b>在地採購比</b><div class="big">71%</div><small>縮短運輸碳足跡</small></div></div></div>`
];
function draw(i){
 if(i==0){const c=echarts.init(document.getElementById('c_rd'));c.setOption({tooltip:{},legend:{bottom:0,textStyle:{fontSize:11}},radar:{indicator:[{name:'交期',max:100},{name:'品質',max:100},{name:'價格',max:100},{name:'產能',max:100},{name:'配合度',max:100}],radius:'62%',axisName:{fontSize:11,color:'#7a6a54'}},series:[{type:'radar',data:[{value:[95,99,80,88,92],name:'佳金屬',itemStyle:{color:'#15803d'},areaStyle:{opacity:.15}},{value:[62,93,90,60,70],name:'宏五金',itemStyle:{color:'#dc2626'},areaStyle:{opacity:.12}}]}]});}
 if(i==5){const c=echarts.init(document.getElementById('c_ql'));c.setOption({grid:{left:40,right:14,top:20,bottom:24},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['3月','4月','5月','6月','7月','8月'],axisLabel:{fontSize:11}},yAxis:{type:'value',min:90,max:100,axisLabel:{fontSize:11}},series:[{name:'佳金屬',type:'line',smooth:true,data:[98.5,98.8,99,99.1,99.2,99.2],lineStyle:{color:'#15803d',width:3},itemStyle:{color:'#15803d'}},{name:'昌塑膠',type:'line',smooth:true,data:[98,97.6,97.2,96.8,96.5,96.2],lineStyle:{color:'#d97706',width:3},itemStyle:{color:'#d97706'}}]});}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
</html>
