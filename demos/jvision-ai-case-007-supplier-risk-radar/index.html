<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供應商交貨延遲預警台 · Supplier Risk Radar</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --grid:rgba(37,99,235,.075);
  --shadow:7px 7px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  font-family:"Fira Sans",sans-serif;
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:stretch;
  border-bottom:3px solid var(--ink);
  background:rgba(248,250,252,.97);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:280px;
  padding:12px 20px;
  border-right:3px solid var(--ink);
  background:var(--color-card);
}
.logo{
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  flex:none;
  border:3px solid var(--ink);
  background:var(--color-primary);
  color:var(--color-on-primary);
  font-family:"Fira Code",monospace;
  font-size:18px;
  font-weight:700;
  box-shadow:4px 4px 0 var(--color-accent);
}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  margin-top:3px;
  color:var(--color-primary);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.nav{
  display:flex;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:67px;
  flex:1 0 auto;
  padding:11px 14px;
  border:0;
  border-right:1px solid var(--ink);
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.nav button:hover{
  background:var(--color-muted);
  color:var(--ink);
}
.nav button.on{
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:inset 0 -6px 0 var(--color-accent);
}
.nav button.on .material-symbols-outlined{font-variation-settings:"FILL" 1,"wght" 600,"GRAD" 0,"opsz" 24}
.wrap{
  width:min(100%,1440px);
  margin:0 auto;
  padding:28px;
}
.vh{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:24px;
  margin-bottom:24px;
  padding:26px 28px;
  border:3px solid var(--ink);
  background:var(--color-card);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.vh:before{
  content:"LIVE PROCUREMENT CONTROL";
  position:absolute;
  top:10px;
  right:-54px;
  width:230px;
  padding:5px 0;
  transform:rotate(34deg);
  background:var(--color-accent);
  color:var(--color-on-accent);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
  text-align:center;
  letter-spacing:.08em;
}
.vh h2{
  margin:0;
  max-width:780px;
  font-size:clamp(28px,4vw,55px);
  line-height:.95;
  font-weight:700;
  letter-spacing:-.045em;
}
.vh p{
  margin:13px 0 0;
  max-width:700px;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}
.live{
  display:flex;
  align-items:center;
  gap:9px;
  margin-right:72px;
  padding:11px 14px;
  border:2px solid var(--ink);
  background:#FFEDD5;
  color:#7C2D12;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.live:before{
  content:"";
  width:10px;
  height:10px;
  border:2px solid var(--ink);
  background:var(--color-accent);
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpi{
  position:relative;
  min-width:0;
  min-height:145px;
  padding:18px;
  border:2px solid var(--ink);
  background:var(--color-card);
  overflow:hidden;
}
.kpi:nth-child(2){transform:translateY(7px)}
.kpi:nth-child(3){background:var(--color-muted)}
.kpi:nth-child(4){
  background:var(--ink);
  color:#fff;
}
.kpi .l{
  max-width:75%;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  line-height:1.4;
}
.kpi:nth-child(4) .l,.kpi:nth-child(4) .d{color:#CBD5E1!important}
.kpi .v{
  margin-top:14px;
  font-family:"Fira Code",monospace;
  font-size:32px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.06em;
}
.kpi .v small{letter-spacing:0}
.kpi .d{
  margin-top:5px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.kpi .ic{
  position:absolute;
  top:14px;
  right:14px;
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border:2px solid currentColor;
  color:var(--color-primary);
  opacity:1;
}
.kpi:nth-child(4) .ic{color:#FDBA74}
.up{color:var(--ok)!important}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  min-width:0;
  padding:18px;
  border:2px solid var(--ink);
  background:var(--color-card);
  box-shadow:5px 5px 0 var(--color-muted);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:34px;
  margin:-18px -18px 18px;
  padding:10px 13px;
  border-bottom:2px solid var(--ink);
  background:var(--color-muted);
  font-size:13px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px;
}
.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.tag:before{
  content:"";
  width:6px;
  height:6px;
  border:1px solid currentColor;
  background:currentColor;
}
.t-ok{background:#D1FAE5;color:#065F46}
.t-warn{background:#FEF3C7;color:#78350F}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#DBEAFE;color:#1E40AF}
.scroll{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--ink);
}
table.data{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
  font-size:12px;
}
table.data th,table.data td{
  padding:12px 13px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:middle;
}
table.data th:last-child,table.data td:last-child{border-right:0}
table.data tr:last-child td{border-bottom:0}
table.data th{
  background:var(--ink);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}
table.data tbody tr:nth-child(even){background:#F1F5F9}
table.data tbody tr:hover{background:#DBEAFE}
table.data td:first-child,
table.data td:nth-child(4){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
table.data td:nth-last-child(2):not(:first-child),
table.data td:nth-last-child(3):not(:first-child){
  font-variant-numeric:tabular-nums;
}
.chart{height:250px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:start;
  gap:11px;
  padding:12px;
  border:2px solid var(--ink);
  border-left:10px solid var(--warn);
  background:#FFFBEB;
}
.al.bad{
  border-left-color:var(--bad);
  background:#FEF2F2;
}
.al .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border:1px solid currentColor;
  color:var(--warn);
  font-size:18px;
}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al b{
  display:block;
  font-size:12px;
  line-height:1.45;
}
.al small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}
.al .tm{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  white-space:nowrap;
}
.sup{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.sr{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto;
  align-items:center;
  gap:11px;
  min-height:76px;
  padding:12px;
  border:2px solid var(--ink);
  background:var(--color-card);
}
.sr:nth-child(3n+2){background:var(--color-muted)}
.sr .av{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border:2px solid var(--ink);
  background:var(--color-primary);
  color:#fff;
  font-weight:700;
  box-shadow:3px 3px 0 var(--color-accent);
}
.sr .mid{min-width:0}
.sr .mid b{
  display:block;
  overflow:hidden;
  font-size:13px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.sr .mid small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}
.sr .sc{text-align:right}
.sr .sc b{
  font-family:"Fira Code",monospace;
  font-size:20px;
  font-variant-numeric:tabular-nums;
}
.sr .sc small{
  display:block;
  color:var(--muted);
  font-size:9px;
}
.gantt{display:flex;flex-direction:column;gap:9px}
.gr{
  display:grid;
  grid-template-columns:150px minmax(300px,1fr);
  align-items:center;
  gap:12px;
  font-size:11px;
}
.gr>b{
  overflow:hidden;
  font-family:"Fira Code",monospace!important;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.gr .track{
  position:relative;
  height:28px;
  border:1px solid var(--ink);
  background:
    repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),var(--line) calc(10% - 1px),var(--line) 10%);
  overflow:hidden;
}
.gr .track i{
  position:absolute;
  top:4px;
  display:flex;
  align-items:center;
  height:18px;
  padding:0 7px;
  border:1px solid var(--ink);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-style:normal;
  font-weight:700;
  white-space:nowrap;
}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.two>*{min-width:0}
.leaf{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.lc{
  min-height:145px;
  padding:15px;
  border:2px solid var(--ink);
  border-top:12px solid var(--ok);
  background:#ECFDF5;
}
.lc:nth-child(even){
  border-top-color:var(--color-primary);
  background:#EFF6FF;
}
.lc b{font-size:12px}
.lc .big{
  margin-top:17px;
  color:#065F46;
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.lc:nth-child(even) .big{color:#1D4ED8}
.lc small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
@media (prefers-reduced-motion:no-preference){
  .nav button{transition:background-color .18s ease,color .18s ease,box-shadow .18s ease}
  table.data tbody tr{transition:background-color .18s ease}
  .grid-item,.kpi,.card,.sr,.lc{
    animation:grid-in .4s backwards;
  }
  .kpi:nth-child(2),.sr:nth-child(2),.lc:nth-child(2){animation-delay:.06s}
  .kpi:nth-child(3),.sr:nth-child(3),.lc:nth-child(3){animation-delay:.12s}
  .kpi:nth-child(4),.sr:nth-child(4),.lc:nth-child(4){animation-delay:.18s}
  .sr:nth-child(5){animation-delay:.24s}
  .sr:nth-child(6){animation-delay:.3s}
  @keyframes grid-in{
    from{opacity:0;transform:translateY(16px) scale(.92)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .kpi:nth-child(2){
    animation-name:grid-in-offset;
  }
  @keyframes grid-in-offset{
    from{opacity:0;transform:translateY(23px) scale(.92)}
    to{opacity:1;transform:translateY(7px) scale(1)}
  }
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
@media(max-width:1100px){
  .top{grid-template-columns:1fr}
  .brand{
    min-width:0;
    border-right:0;
    border-bottom:2px solid var(--ink);
  }
  .nav button{min-height:51px}
  .vh{grid-template-columns:1fr}
  .live{width:max-content;max-width:100%;margin-right:0;white-space:normal}
  .leaf{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  .wrap{padding:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g11,.two{grid-template-columns:1fr}
  .sup{grid-template-columns:1fr}
  .vh{padding:22px}
  .vh h2{font-size:38px}
}
@media(max-width:520px){
  .brand{padding:10px 13px}
  .brand b{font-size:13px}
  .nav button{padding:10px 12px}
  .nav button>span:not(.material-symbols-outlined){display:none}
  .wrap{padding:14px}
  .vh{
    margin-bottom:18px;
    padding:19px 17px;
    box-shadow:4px 4px 0 var(--ink);
  }
  .vh:before{display:none}
  .vh h2{font-size:32px}
  .vh p{font-size:12px}
  .live{font-size:10px}
  .kpis{grid-template-columns:1fr}
  .kpi:nth-child(2){transform:none}
  .leaf{grid-template-columns:1fr}
  .card{padding:14px}
  .card h3{margin:-14px -14px 14px}
  .al{grid-template-columns:auto minmax(0,1fr)}
  .al .tm{grid-column:2}
  .gr{grid-template-columns:110px minmax(270px,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">塔</div>
    <div><b>供應商交貨延遲預警台</b><span>SUPPLIER RISK RADAR</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
  <div class="vh">
    <div>
      <h2 id="vt">風險預警塔</h2>
      <p id="vd"></p>
    </div>
    <div class="live"><span>監控 86 家供應商 · 5 筆交期預警</span></div>
  </div>
  <div id="view" aria-live="polite"></div>
</main>
<script>
const MOD=[
["風險預警塔","radar","風險預警塔","供應商風險、交期預警與採購全局戰情"],
["供應商管理","apartment","供應商管理","供應商檔案、分級與績效評比"],
["詢報價協作","request_quote","詢報價協作","發詢價、線上比價與議合"],
["採購訂單","receipt_long","採購訂單","採購單、交期承諾與進度追蹤"],
["交期風險","event_busy","交期風險","交期延遲預警與到貨甘特"],
["供應商品質","verified_user","供應商品質","到貨驗收、允收率與品質評分"],
["綠色採購","eco","綠色採購","碳排、環保認證與綠色採購占比"]
];
const nav=document.getElementById("nav");
const view=document.getElementById("view");
const vt=document.getElementById("vt");
const vd=document.getElementById("vd");

MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+'</span><span>'+m[0]+'</span>';
  b.onclick=()=>show(i,true);
  nav.appendChild(b);
});

const SUP=[
["佳金屬","金","金屬件","A",92,"t-ok"],
["O野電子","綠","電子料","A",88,"t-ok"],
["泰精密","泰","機構件","B",74,"t-warn"],
["昌塑膠","昌","塑膠件","B",69,"t-warn"],
["宏五金","宏","五金","C",58,"t-bad"],
["新化工","新","化工料","B",71,"t-warn"]
];
const ALERT=[
["宏五金 PO-8821 交期延遲","承諾 8/14 → 預估 8/19，延遲 5 天，影響 B 線","bad","即時"],
["昌塑膠 良率下滑至 96.2%","近 3 批允收率下降，建議稽核","warn","1 小時前"],
["泰精密 產能吃緊","回報 8 月產能滿載，新單交期拉長","warn","3 小時前"]
];
const PO=[
["PO-8821","宏五金","冷鍛螺絲×20k","8/14","延遲 +5","t-bad"],
["PO-8820","佳金屬","衝壓件×8k","8/12","如期","t-ok"],
["PO-8819","O野電子","連接器×15k","8/13","如期","t-ok"],
["PO-8818","昌塑膠","外殼×6k","8/15","風險","t-warn"],
["PO-8817","泰精密","齒輪×3k","8/16","風險","t-warn"]
];
const GANTT=[
["PO-8820 佳金屬",5,55,"#047857","如期"],
["PO-8819 綠野電子",12,48,"#047857","如期"],
["PO-8818 昌塑膠",20,42,"#B45309","風險"],
["PO-8817 泰精密",30,40,"#B45309","風險"],

function syncHash(i){
  const next="#v"+i;
  if(location.hash!==next)history.pushState(null,"",next);
}
function show(i,updateHash){
  const safe=Math.max(0,Math.min(Number(i)||0,SCREENS.length-1));
  nav.querySelectorAll("button").forEach(b=>{
    const active=Number(b.dataset.i)===safe;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[safe][2];
  vd.textContent=MOD[safe][3];
  view.innerHTML=SCREENS[safe]();
  draw(safe);
  if(updateHash)syncHash(safe);
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(Number(m[1]),SCREENS.length-1):0,false);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>{
  if(chart&&!chart.isDisposed())chart.resize();
});
fromHash();
