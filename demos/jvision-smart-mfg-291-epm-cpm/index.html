<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業績效管理系統（EPM/CPM）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --acc:var(--color-primary);
  --acc2:var(--color-secondary);
  --acc-d:#0F766E;
  --bg:var(--color-background);
  --card:var(--color-card);
  --mut:var(--color-muted-foreground);
  --soft:var(--color-muted);
  --warn:#B45309;
  --bad:var(--color-destructive);
  --good:#047857;
  --shadow:7px 7px 0 #134E4A;
  --shadow-small:3px 3px 0 #134E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  overflow-x:hidden;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro",Georgia,"Noto Serif TC",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-accent);
  outline-offset:3px;
}
.msi{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#FFFFFF;
  background:#134E4A;
  border-bottom:4px solid #000000;
  box-shadow:none;
}
.tb-inner{
  max-width:1440px;
  min-height:74px;
  margin:0 auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:46px;
  height:46px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000000;
  background:var(--color-secondary);
  border:3px solid #000000;
  border-radius:0;
  box-shadow:3px 3px 0 var(--color-accent);
}
.brand .logo .msi{font-size:27px;font-weight:700}
.brand b{
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:17px;
  font-weight:600;
  letter-spacing:.04em;
  white-space:nowrap;
}
.brand span{display:block;font-size:12px;opacity:.9;font-weight:400;letter-spacing:.08em}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.tb-right .q{
  min-height:34px;
  padding:6px 9px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#FFFFFF;
  border:1px solid var(--color-secondary);
  font-size:12px;
  font-family:"Crimson Pro",serif;
  font-variant-numeric:tabular-nums;
}
.tb-right .av{
  width:36px;
  height:36px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000000;
  background:var(--color-accent);
  border:2px solid #000000;
  border-radius:0;
  font-weight:700;
  font-size:14px;
}
nav.tabs{background:#FFFFFF;border-top:1px solid var(--color-secondary)}
.tabs-inner{
  max-width:1440px;
  margin:0 auto;
  padding:0 14px;
  display:flex;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--color-primary) var(--color-muted);
}
.tab{
  appearance:none;
  min-height:48px;
  flex:1 0 auto;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--ink);
  background:#FFFFFF;
  border:0;
  border-right:1px solid var(--line);
  border-bottom:4px solid transparent;
  border-radius:0;
  font-family:"Crimson Pro",serif;
  font-size:15px;
  font-weight:600;
}
.tab:first-child{border-left:1px solid var(--line)}
.tab .msi{font-size:20px}
.tab:hover{color:#000000;background:var(--color-muted)}
.tab.on{
  color:#000000;
  background:var(--color-secondary);
  border-bottom-color:#000000;
  box-shadow:inset 0 -2px 0 #000000;
}
main{max-width:1440px;margin:0 auto;padding:28px 20px 72px}
.scr-head{
  position:relative;
  margin:0 0 22px;
  padding:18px 20px 20px;
  display:grid;
  grid-template-columns:auto auto 1fr;
  align-items:end;
  gap:8px 14px;
  color:#FFFFFF;
  background:#134E4A;
  border:3px solid #000000;
  box-shadow:var(--shadow);
}
.scr-head::before{
  content:"EXECUTIVE / CONTROL DESK";
  grid-column:1/-1;
  color:var(--color-secondary);
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.18em;
}
.scr-head h1{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(27px,3vw,42px);
  line-height:.95;
  font-weight:700;
  letter-spacing:-.02em;
}
.scr-head p{margin:0;color:#D5F5F0;font-size:14px;line-height:1.35}
.pill{
  align-self:center;
  padding:5px 10px;
  color:#000000;
  background:var(--color-accent);
  border:2px solid #000000;
  border-radius:0;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
  white-space:nowrap;
}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,2fr) minmax(320px,1fr)}
.g-23{grid-template-columns:minmax(320px,1fr) minmax(0,2fr)}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:var(--shadow-small);
}
.card{padding:16px}
.card h3{
  margin:0 0 4px;
  padding-bottom:8px;
  border-bottom:2px solid var(--line);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:19px;
  line-height:1.1;
  font-weight:700;
}
.card .sub{margin-bottom:12px;color:var(--muted);font-size:12px;font-weight:400}
.kpi{
  position:relative;
  min-height:138px;
  overflow:hidden;
  padding:16px;
  border-top-width:7px;
  border-top-color:var(--color-primary);
}
.kpi:nth-child(2n){border-top-color:var(--color-secondary)}
.kpi:nth-child(3n){border-top-color:var(--color-accent)}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-25px;
  width:78px;
  height:78px;
  background:transparent;
  border:12px solid var(--color-muted);
  border-radius:0;
  transform:rotate(45deg);
}
.kpi .lbl{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.kpi .lbl .msi{
  padding:4px;
  color:#000000;
  background:var(--color-secondary);
  border:1px solid #000000;
  font-size:18px;
}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:11px;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(29px,3vw,40px);
  line-height:.95;
  font-weight:700;
  letter-spacing:-.025em;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .dl{position:relative;z-index:1;margin-top:10px;font-size:12px;font-weight:600}
.up,.dn,.fl{font-weight:700;text-decoration-thickness:2px;text-underline-offset:3px}
.up{color:#047857}.dn{color:#B91C1C}.fl{color:#9A4E06}
.dl.up::before,.pc.up::before{content:"▲ ";font-size:.8em}
.dl.dn::before,.pc.dn::before{content:"▼ ";font-size:.8em}
.dl.fl::before,.pc.fl::before{content:"◆ ";font-size:.75em}
.chartbox{width:100%;min-width:0;overflow:hidden}
.apexcharts-canvas text{font-family:"Crimson Pro",serif!important;fill:#334155!important}
.apexcharts-gridline{stroke:var(--line)}
.apexcharts-tooltip,.apexcharts-menu{
  border:2px solid var(--ink)!important;
  border-radius:0!important;
  box-shadow:var(--shadow-small)!important;
  font-family:"Crimson Pro",serif!important;
}
table{width:100%;border-collapse:collapse;border:2px solid var(--ink);font-size:14px}
th,td{padding:10px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{
  color:#FFFFFF;
  background:#134E4A;
  border-color:#2DD4BF;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
}
tbody tr:nth-child(even){background:#F5FFFD}
tbody tr:hover{background:var(--color-muted)}
td.num,th.num{text-align:right}
.num{
  text-align:right;
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums lining-nums;
}
.tag,.chip{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
}
.tag::before{content:"■";margin-right:5px;font-size:7px}
.t-g{color:#065F46;background:#D1FAE5}
.t-y{color:#92400E;background:#FEF3C7}
.t-r{color:#991B1B;background:#FEE2E2}
.t-b{color:#1E40AF;background:#DBEAFE}
.t-n{color:#334155;background:#F1F5F9}
.chip{color:#0F5F58;background:#CCFBF1}
.bar{
  height:12px;
  min-width:60px;
  overflow:hidden;
  background:repeating-linear-gradient(135deg,#D8E4E7 0,#D8E4E7 5px,#FFFFFF 5px,#FFFFFF 10px);
  border:1px solid var(--ink);
  border-radius:0;
}
.bar>i{display:block;height:100%;background:var(--color-primary);border-right:2px solid #000000;border-radius:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:10px}
.col{min-width:0;padding:10px;background:var(--soft);border:2px solid var(--ink);border-radius:0}
.col>.ch{
  margin:-10px -10px 10px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#FFFFFF;
  background:#134E4A;
  border-bottom:2px solid #000000;
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  font-weight:700;
}
.col>.ch .cnt{
  padding:1px 7px;
  color:#000000;
  background:var(--color-secondary);
  border:1px solid #000000;
  border-radius:0;
  font-family:ui-monospace,monospace;
  font-size:11px;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  color:var(--ink);
  background:#FFFFFF;
  border:1px solid var(--ink);
  border-left:7px solid var(--color-primary);
  border-radius:0;
  box-shadow:2px 2px 0 var(--ink);
}
.tk:last-child{margin-bottom:0}
.tk .tt{font-size:14px;font-weight:700}
.tk .mt{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.tk .amt{margin-top:7px;font-family:ui-monospace,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tk.b-y{border-left-color:var(--color-accent)}
.tk.b-r{border-left-color:var(--bad)}
.tk.b-b{border-left-color:#1D4ED8}
.avm{
  width:23px;
  height:23px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  background:#134E4A;
  border:1px solid #000000;
  border-radius:0;
  font-size:10px;
  font-weight:700;
}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:4px;background:var(--ink)}
.tl .it{position:relative;padding:0 0 18px 14px}
.tl .it::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;background:var(--color-accent);border:2px solid #000000;border-radius:0}
.tl .it .tm{color:var(--muted);font-family:ui-monospace,monospace;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .it .dc{margin-top:2px;font-size:14px;font-weight:700}
.tl .it .ex{margin-top:2px;color:var(--muted);font-size:12px}
.scw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.scw:last-child{border-bottom:0}
.scw .nm{flex:1;min-width:0}
.scw .nm b{font-size:14px}
.scw .nm span{display:block;color:var(--muted);font-size:11px}
.scw .bg{flex:2;min-width:80px}
.scw .pc{
  width:58px;
  flex:0 0 auto;
  text-align:right;
  font-family:ui-monospace,monospace;
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.note{
  padding:10px 12px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#334155;
  background:#FFF7E6;
  border:2px solid var(--color-accent);
  border-radius:0;
  font-size:13px;
}
.note .msi{flex:0 0 auto;color:#92400E;font-size:19px}
.miniflow{display:flex;gap:0;flex-wrap:wrap;margin-top:10px;border:2px solid var(--ink)}
.miniflow .st{
  position:relative;
  flex:1;
  min-width:170px;
  padding:12px;
  background:#FFFFFF;
  border-right:2px solid var(--ink);
  border-radius:0;
  font-size:12px;
}
.miniflow .st:last-child{border-right:0}
.miniflow .st b{
  display:block;
  margin-bottom:4px;
  color:#0F5F58;
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  font-weight:700;
}
@media (prefers-reduced-motion:no-preference){
  .tab,.card,.kpi,.tk{transition:background-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}
  .card:hover,.kpi:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #134E4A}
  .tk:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  #app>.scr-head,#app>.grid,#app>.card{animation:ledger-in .35s ease-out both}
  #app>.grid:nth-child(3),#app>.card:nth-child(3){animation-delay:.06s}
  #app>.grid:nth-child(4),#app>.card:nth-child(4){animation-delay:.12s}
  @keyframes ledger-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-32,.g-23{grid-template-columns:1fr}
  .scr-head{grid-template-columns:1fr auto}
  .scr-head p{grid-column:1/-1}
  .tb-right{width:100%;margin-left:58px}
}
@media(max-width:768px){
  .g-2,.g-3{grid-template-columns:1fr}
  main{padding:20px 14px 56px}
  .tb-inner{padding:9px 14px}
  .tb-right{margin-left:0;overflow-x:auto;flex-wrap:nowrap}
  .tb-right .q{white-space:nowrap}
  .board{grid-template-columns:repeat(4,minmax(230px,1fr))}
  .card{padding:13px}
  .scr-head{padding:15px;box-shadow:5px 5px 0 #134E4A}
}
@media(max-width:560px){
  .brand b{font-size:14px}
  .brand span{display:none}
  .brand .logo{width:40px;height:40px}
  .tab{min-width:48px;padding:11px 13px}
  .tab .tx{display:none}
  .g-kpi{grid-template-columns:1fr}
  .kpi{min-height:118px}
  .scr-head{display:flex;align-items:flex-start;flex-direction:column}
  .scr-head::before{order:-1}
  .scr-head h1{font-size:30px}
  .pill{white-space:normal}
  .scw{align-items:flex-start;flex-wrap:wrap}
  .scw .bg{order:3;flex-basis:100%}
  .miniflow{display:block}
  .miniflow .st{border-right:0;border-bottom:2px solid var(--ink)}
  .miniflow .st:last-child{border-bottom:0}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <div class="logo"><span class="msi">insights</span></div>
      <div><b>企業績效管理系統</b><span>EPM / CPM ｜ 經營戰情平台</span></div>
    </div>
    <div class="tb-right">
      <div class="q"><span class="msi">calendar_month</span>FY2026 · Q3</div>
      <div class="q"><span class="msi">sync</span>ERP/BI 已同步</div>
      <div class="av">林</div>
    </div>
  </div>
  <nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>
</header>
<main><div id="app"></div></main>
<script>
"use strict";
var app=document.getElementById("app");
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id); if(!el)return;
  var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter, Noto Sans TC, sans-serif'};
  opt.chart=Object.assign(baseChart,opt.chart||{});
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
var GREEN=['#16a34a','#4ade80','#86efac','#15803d','#22c55e','#bbf7d0'];

var TABS=[
  {i:0,ic:'dashboard',t:'經營戰情'},
  {i:1,ic:'request_quote',t:'預算編製'},
  {i:2,ic:'trending_up',t:'滾動預測'},
  {i:3,ic:'fact_check',t:'差異分析'},
  {i:4,ic:'insights',t:'指標整合'},
  {i:5,ic:'receipt_long',t:'報表稽核'}
];
(function(){
  var h='';
  for(var i=0;i<TABS.length;i++){h+='<button class="tab" data-i="'+TABS[i].i+'"><span class="msi">'+TABS[i].ic+'</span><span class="tx">'+TABS[i].t+'</span></button>';}
  document.getElementById('tabs').innerHTML=h;
  var btns=document.querySelectorAll('.tab');
  for(var j=0;j<btns.length;j++){btns[j].addEventListener('click',function(){location.hash='v'+this.getAttribute('data-i');});}
})();

function fmt(n){return n.toLocaleString('en-US');}

/* ============ SCREEN 0 : 經營戰情儀表板 ============ */
function s0(){
  var kpis=[
    {l:'累計營收',v:'$18.4億',d:'達成率 96.2%',c:'up',ic:'trending_up'},
    {l:'營業利益率',v:'14.8%',d:'較預算 +0.6pp',c:'up',ic:'monitoring'},
    {l:'自由現金流',v:'$3.12億',d:'較預算 -4.1%',c:'dn',ic:'account_balance_wallet'},

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle('on',+btns[b].getAttribute('data-i')===i);}
  (SCREENS[i]||s0)();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
