<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NCR 不合格品管理系統｜品質閉環平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#dc2626;--accent2:#f87171;--accent-d:#991b1b;
  --bg:#f4f5f7;--panel:#ffffff;--ink:#1f2430;--muted:#6b7280;--line:#e6e8ec;
  --ok:#16a34a;--warn:#d97706;--info:#2563eb;--purple:#7c3aed;--slate:#475569;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle;font-size:20px}
/* top nav */
.topbar{
  position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#7f1d1d,#dc2626 62%,#ef4444);
  color:#fff;box-shadow:0 4px 18px rgba(153,27,27,.28);
}
.tb-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:-2px}
.tb-spacer{flex:1;min-width:8px}
.tb-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.tb-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tb-pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.tb-user{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb-user .av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent-d);font-weight:800;display:grid;place-items:center;font-size:13px}
.tb-user small{font-size:11px;opacity:.85;display:block;margin-top:-2px}
/* nav tabs */
.nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:30}
.nav-in{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:4px;flex-wrap:wrap;min-width:0;overflow-x:auto}
.nav button{
  appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;
  color:var(--muted);font-weight:600;font-size:13.5px;padding:12px 14px;display:flex;align-items:center;gap:7px;
  border-bottom:3px solid transparent;white-space:nowrap;flex:none;min-width:0;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{color:var(--ink);background:#faf7f7}
.nav button.on{color:var(--accent-d);border-bottom-color:var(--accent)}
.nav button .idx{font-size:11px;background:#f1f2f4;color:var(--muted);border-radius:6px;padding:1px 6px;font-weight:700}
.nav button.on .idx{background:#fee2e2;color:var(--accent-d)}
/* main */
.wrap{max-width:1360px;margin:0 auto;padding:18px}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-width:0}
.scr-head h1{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h1 .material-symbols-outlined{color:var(--accent);font-size:24px}
.scr-head p{margin:0;color:var(--muted);font-size:13px}
.scr-head .sh-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn .material-symbols-outlined{font-size:18px}
.btn:hover{border-color:#cfd3da;background:#fafafa}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.gho{background:transparent}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card.pad{padding:16px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.card-h .material-symbols-outlined{color:var(--accent);font-size:20px}
.card-h .sub{color:var(--muted);font-weight:500;font-size:12px;margin-left:auto}
/* stat row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .lab .material-symbols-outlined{font-size:17px}
.stat .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .val small{font-size:13px;font-weight:600;color:var(--muted)}
.stat .chg{font-size:11.5px;font-weight:700;margin-top:3px;display:inline-flex;align-items:center;gap:3px}
.stat .chg .material-symbols-outlined{font-size:15px}
.stat .accent-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.up{color:var(--ok)}.down{color:var(--accent)}.flat{color:var(--muted)}
/* layout cols */
.cols{display:grid;gap:16px}
.c-73{grid-template-columns:1.9fr 1fr}
.c-64{grid-template-columns:1.4fr 1fr}
.c-55{grid-template-columns:1fr 1fr}
.c-3{grid-template-columns:repeat(3,1fr)}
.c-2{grid-template-columns:repeat(2,1fr)}
/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.tag .material-symbols-outlined{font-size:14px}
.t-return{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.t-rework{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.t-deviate{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.t-scrap{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
.t-hold{background:#faf5ff;color:#7c3aed;border:1px solid #e9d5ff}
.t-open{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.t-prog{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.t-done{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.t-crit{background:#dc2626;color:#fff}
.t-maj{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.t-min{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
/* table */
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.dt th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;position:sticky;top:0}
table.dt td{padding:11px 12px;border-bottom:1px solid #f1f2f4;vertical-align:middle}
table.dt tr:hover td{background:#fdf9f9}
table.dt .id{font-weight:800;color:var(--accent-d);font-family:"Inter",monospace;font-size:12.5px;white-space:nowrap}
.prod{font-weight:600}
.prod small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.mini-bar{height:6px;border-radius:6px;background:#eef0f3;overflow:hidden;min-width:70px}
.mini-bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.avatar-sm{width:24px;height:24px;border-radius:50%;background:#fee2e2;color:var(--accent-d);font-weight:700;font-size:10.5px;display:inline-grid;place-items:center;margin-right:5px}
.rowsel{cursor:pointer}
.rowsel.act td{background:#fdeaea!important}
/* chart box */
.chart-box{position:relative;width:100%}
.cb-h{height:240px}.cb-m{height:200px}.cb-l{height:170px}.cb-xl{height:300px}
canvas{max-width:100%}
/* legend chips */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* kanban / disposition board */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kb-col{background:#f7f8fa;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}
.kb-col h4{margin:0 0 9px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;padding:2px 2px}
.kb-col h4 .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:1px 7px;color:var(--muted)}
.kb-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.kb-card .kc-id{font-size:11.5px;font-weight:800;color:var(--accent-d);font-family:monospace}
.kb-card .kc-t{font-weight:700;font-size:13px;margin:3px 0}
.kb-card .kc-m{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kb-card.b-blue{border-left-color:#2563eb}
.kb-card.b-amber{border-left-color:#d97706}
.kb-card.b-slate{border-left-color:#64748b}
.kb-card.b-red{border-left-color:#dc2626}
/* approval flow */
.appr{display:flex;flex-direction:column;gap:0}
.appr-step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.appr-step:last-child{padding-bottom:0}
.appr-step .line{position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.appr-step:last-child .line{display:none}
.appr-step.ok .line{background:var(--ok)}
.appr-node{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;z-index:1;border:2px solid #fff}
.appr-node.ok{background:#dcfce7;color:var(--ok);box-shadow:0 0 0 2px #bbf7d0}
.appr-node.cur{background:#fee2e2;color:var(--accent);box-shadow:0 0 0 2px #fecaca;animation:pulse2 2.5s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 2px #fecaca}70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}100%{box-shadow:0 0 0 2px rgba(220,38,38,0)}}
.appr-node.wait{background:#f1f2f4;color:var(--muted)}
.appr-body{flex:1;min-width:0;padding-top:2px}
.appr-body .ab-t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appr-body .ab-r{font-size:12px;color:var(--muted)}
.appr-body .ab-time{font-size:11px;color:var(--muted);margin-top:3px}
/* fishbone */
.fish{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fish-cat{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.fish-cat h5{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--accent-d)}
.fish-cat ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.fish-cat li{font-size:12.5px;padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;gap:7px;align-items:flex-start}
.fish-cat li .material-symbols-outlined{font-size:15px;color:var(--muted);margin-top:1px}
.fish-cat li.root{border-color:#fca5a5;background:#fef2f2}
.fish-cat li.root .material-symbols-outlined{color:var(--accent)}
/* 5why */
.why{display:flex;flex-direction:column;gap:9px}
.why-row{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;background:#fafbfc;border:1px solid var(--line);border-radius:10px}
.why-n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:12px;flex:none}
.why-row .q{font-size:11px;color:var(--muted);font-weight:700}
.why-row .a{font-size:13px;font-weight:600;margin-top:1px}
/* capa list */
.capa-item{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid #f1f2f4;align-items:center;flex-wrap:wrap;min-width:0}
.capa-item:last-child{border-bottom:0}
.capa-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:#fee2e2;color:var(--accent-d)}
.capa-ico.blue{background:#dbeafe;color:#1d4ed8}
.capa-ico.green{background:#dcfce7;color:#15803d}
.capa-ico.amber{background:#fef3c7;color:#b45309}
.capa-main{flex:1;min-width:160px}
.capa-main .cm-t{font-weight:700;font-size:13.5px}
.capa-main .cm-s{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.capa-prog{width:130px;min-width:110px}
.capa-prog .pl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:4px}
/* 8d chips */
.d8{display:flex;gap:7px;flex-wrap:wrap}
.d8 .d{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);display:flex;align-items:center;gap:5px}
.d8 .d.done{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.d8 .d.cur{background:#fee2e2;border-color:#fca5a5;color:var(--accent-d)}
.d8 .d .material-symbols-outlined{font-size:15px}
/* verify checklist */
.chk{display:flex;flex-direction:column;gap:0}
.chk-row{display:flex;gap:11px;padding:12px 4px;border-bottom:1px solid #f1f2f4;align-items:center}
.chk-row:last-child{border-bottom:0}
.chk-box{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center}
.chk-box.ok{background:#dcfce7;color:var(--ok)}
.chk-box.no{background:#fee2e2;color:var(--accent)}
.chk-box.na{background:#f1f2f4;color:var(--muted)}
.chk-box .material-symbols-outlined{font-size:17px}
.chk-txt{flex:1;min-width:0}
.chk-txt .ct{font-weight:600;font-size:13px}
.chk-txt .cs{font-size:11.5px;color:var(--muted);margin-top:1px}
/* close panel */
.close-hero{background:linear-gradient(120deg,#fef2f2,#fff);border:1px solid #fecaca;border-radius:14px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-width:0}
.close-seal{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(153,27,27,.3)}
.close-seal .material-symbols-outlined{font-size:38px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px}
.kv .k{font-size:11px;color:var(--muted);font-weight:600}
.kv .v{font-size:13.5px;font-weight:700;margin-top:1px}
/* misc list */
.rl{display:flex;flex-direction:column}
.rl-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f2f4;align-items:center}
.rl-row:last-child{border-bottom:0}
.rl-ic{width:32px;height:32px;border-radius:9px;background:#fef2f2;color:var(--accent-d);display:grid;place-items:center;flex:none}
.rl-ic .material-symbols-outlined{font-size:18px}
.rl-b{flex:1;min-width:0}
.rl-b .t{font-weight:600;font-size:13px}
.rl-b .s{font-size:11.5px;color:var(--muted)}
.rl-v{font-weight:800;font-size:15px;white-space:nowrap}
/* progress bar row */
.pbar{display:flex;flex-direction:column;gap:11px}
.pbar-row .pb-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.pbar-row .pb-top .n{color:var(--muted);font-weight:700}
.pbar-track{height:9px;border-radius:9px;background:#eef0f3;overflow:hidden}
.pbar-track i{display:block;height:100%;border-radius:9px}
/* note box */
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#92400e;display:flex;gap:8px;align-items:flex-start}
.note.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.note.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.note .material-symbols-outlined{font-size:18px;flex:none}
.muted{color:var(--muted)}
.right{text-align:right}
.center{text-align:center}
.mt12{margin-top:12px}.mt16{margin-top:16px}
.divider{height:1px;background:var(--line);margin:12px 0}
.foot{max-width:1360px;margin:6px auto 22px;padding:0 18px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot .material-symbols-outlined{font-size:15px}
/* responsive */
@media(max-width:980px){
  .c-73,.c-64,.c-55{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .c-3{grid-template-columns:1fr}
  .kb{grid-template-columns:repeat(2,1fr)}
  .fish{grid-template-columns:1fr}
}
@media(max-width:820px){
  .c-2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:12px}
  .stats{grid-template-columns:1fr}
  .kb{grid-template-columns:1fr}
  .nav button .lab{display:none}
  .nav button{padding:12px 11px}
  .tb-meta .tb-pill.hide-sm{display:none}
  .scr-head h1{font-size:18px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
      <div><b>NCR QualityLoop</b><small>不合格品管理 · 品質閉環平台</small></div>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-meta">
      <div class="tb-pill hide-sm"><span class="material-symbols-outlined" style="font-size:16px">factory</span>大園三廠</div>
      <div class="tb-pill"><span class="dot"></span>系統即時連線</div>
      <div class="tb-user">
        <div class="av">陳</div>
        <div><div style="font-size:12.5px;font-weight:700">陳品臻</div><small>品保工程師</small></div>
      </div>
    </div>
  </div>
</header>

<nav class="nav"><div class="nav-in" id="nav"></div></nav>

<main class="wrap"><div id="view"></div></main>

<footer class="foot">
  <span><span class="material-symbols-outlined">verified_user</span>NCR QualityLoop v4.2</span>
  <span><span class="material-symbols-outlined">schedule</span>資料同步：2026-08-14 09:42</span>
  <span class="muted">本頁為純前端示範，資料皆為模擬。</span>
</footer>

<script>
"use strict";
var chartRegistry = [];
function destroyCharts(){
  for(var k=0;k<chartRegistry.length;k++){ try{ chartRegistry[k].destroy(); }catch(e){} }
  chartRegistry = [];
}
function mkChart(id, cfg){
  var el = document.getElementById(id);
  if(!el) return;
  var ctx = el.getContext("2d");
  var ch = new Chart(ctx, cfg);
  chartRegistry.push(ch);
  return ch;
}
var FONT = "'Inter','Noto Sans TC',sans-serif";
Chart.defaults.font.family = FONT;
Chart.defaults.font.size = 12;

/* ---------- helpers ---------- */
function scrHead(ic,title,desc,rightHtml){
  return '<div class="scr-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1>'+
    '<p>'+desc+'</p></div><div class="sh-r">'+(rightHtml||"")+'</div></div>';
}
function statCard(lab,ico,val,unit,chg,cls){
  return '<div class="stat"><div class="accent-bar"></div>'+
    '<div class="lab"><span class="material-symbols-outlined">'+ico+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small> '+unit+'</small>':'')+'</div>'+
    (chg?'<div class="chg '+cls+'"><span class="material-symbols-outlined">'+(cls==="up"?"trending_up":cls==="down"?"trending_down":"remove")+'</span>'+chg+'</div>':'')+
    '</div>';
}

/* disposition tag */
function dispTag(d){
  var map={
    "退貨":['t-return','undo'],"重工":['t-rework','build'],"特採":['t-deviate','how_to_reg'],
    "報廢":['t-scrap','delete'],"隔離":['t-hold','pause_circle']
  };
  var m=map[d]||['t-scrap','label'];
  return '<span class="tag '+m[0]+'"><span class="material-symbols-outlined">'+m[1]+'</span>'+d+'</span>';
}
function sevTag(s){
  var map={"嚴重":'t-crit',"主要":'t-maj',"次要":'t-min'};
  return '<span class="tag '+(map[s]||'t-min')+'">'+s+'</span>';
}
function statusTag(s){
  var map={"待判定":['t-open','pending'],"處置中":['t-prog','autorenew'],"已關閉":['t-done','check_circle'],"驗證中":['t-hold','fact_check']};
  var m=map[s]||['t-open','circle'];
  return '<span class="tag '+m[0]+'"><span class="material-symbols-outlined">'+m[1]+'</span>'+s+'</span>';
}

/* ---------- SHOW ---------- */
var RENDERERS = [renderList, renderDisposition, renderRootCause, renderCapa, renderVerify, renderStats];
function show(i){
  i = +i; if(isNaN(i)||i<0) i=0;
  if(i>=RENDERERS.length) i=RENDERERS.length-1;
  destroyCharts();
  var btns = document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    if(+btns[b].getAttribute("data-i")===i) btns[b].classList.add("on");
    else btns[b].classList.remove("on");
  }
  RENDERERS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
