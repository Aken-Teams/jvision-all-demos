<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NCR 不合格品管理系統｜品質閉環平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --accent-d:#1d4ed8;
  --bg:#f8fafc;
  --panel:#ffffff;
  --ok:#15803d;
  --warn:#b45309;
  --info:#2563eb;
  --purple:#7c3aed;
  --slate:#475569;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.045);
  --shadow-lift:0 2px 4px rgba(15,23,42,.07),0 12px 28px rgba(15,23,42,.07);
  --radius:6px;
  --mono:"Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--color-background)}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,a,[onclick],.rowsel{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:2px;
}
::selection{background:#bfdbfe;color:#172554}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
  vertical-align:middle;
  font-size:20px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#fff;
  background:#172554;
  border-bottom:3px solid var(--color-primary);
  box-shadow:0 4px 16px rgba(15,23,42,.16);
}
.tb-in{
  max-width:1440px;
  min-height:58px;
  margin:0 auto;
  padding:9px 22px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.01em;white-space:nowrap;min-width:0}
.brand .logo{
  width:36px;height:36px;border-radius:4px;
  background:var(--color-primary);
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;font-weight:400;color:#dbeafe;margin-top:-2px;letter-spacing:.03em}
.tb-spacer{flex:1;min-width:8px}
.tb-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.tb-pill{
  display:flex;align-items:center;gap:7px;
  min-height:32px;padding:5px 10px;
  border-radius:4px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);
  color:#f8fafc;font-size:12px;font-weight:500;white-space:nowrap;
}
.tb-pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;border:2px solid #dcfce7}
.tb-user{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb-user .av{width:32px;height:32px;border-radius:4px;background:#fff;color:#1d4ed8;font-weight:700;display:grid;place-items:center;font-size:13px}
.tb-user small{font-size:11px;color:#dbeafe;display:block;margin-top:-2px}

.nav{
  position:sticky;top:58px;z-index:30;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 5px rgba(15,23,42,.04);
  backdrop-filter:blur(10px);
}
.nav-in{max-width:1440px;margin:0 auto;padding:0 18px;display:flex;gap:0;min-width:0;overflow-x:auto;scrollbar-width:thin}
.nav button{
  appearance:none;border:0;border-right:1px solid var(--color-border);background:transparent;
  color:var(--color-muted-foreground);font-weight:600;font-size:13px;
  min-height:48px;padding:10px 15px;
  display:flex;align-items:center;gap:7px;
  border-bottom:3px solid transparent;white-space:nowrap;flex:none;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.nav button:first-child{border-left:1px solid var(--color-border)}
.nav button:hover{color:#1d4ed8;background:#eff6ff}
.nav button.on{color:#1d4ed8;border-bottom-color:var(--color-primary);background:#eff6ff}
.nav button .material-symbols-outlined{font-size:18px}
.nav button .idx{
  font-family:var(--mono);font-size:10px;line-height:18px;min-width:20px;text-align:center;
  background:var(--color-muted);color:#475569;border:1px solid #d5dfed;border-radius:3px;padding:0 4px;
}
.nav button.on .idx{background:var(--color-primary);border-color:var(--color-primary);color:#fff}

.wrap{max-width:1440px;margin:0 auto;padding:20px 22px 28px}
.scr-head{
  display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;min-width:0;
  margin:0 0 16px;padding:0 0 13px;border-bottom:1px solid var(--color-border);
}
.scr-head>div:first-child{position:relative;padding-left:13px}
.scr-head>div:first-child:before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;background:var(--color-primary)}
.scr-head h1{font-size:21px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.scr-head h1 .material-symbols-outlined{color:var(--color-primary);font-size:23px}
.scr-head p{margin:3px 0 0;color:var(--color-muted-foreground);font-size:12.5px}
.scr-head .sh-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.btn{
  appearance:none;min-height:38px;border:1px solid #cbd5e1;background:#fff;color:#1e293b;
  font-weight:600;font-size:13px;padding:8px 13px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  box-shadow:0 1px 1px rgba(15,23,42,.04);
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btn .material-symbols-outlined{font-size:18px}
.btn:hover{border-color:#94a3b8;background:#f8fafc;box-shadow:0 2px 5px rgba(15,23,42,.08);transform:translateY(-1px)}
.btn.pri{background:var(--color-accent);border-color:#c2410c;color:#fff;box-shadow:0 2px 5px rgba(154,52,18,.18)}
.btn.pri:hover{background:#c2410c;border-color:#9a3412}
.btn.gho{background:#fff}

.card{
  background:var(--color-card);color:var(--color-card-foreground);
  border:1px solid var(--color-border);border-radius:var(--radius);
  box-shadow:var(--shadow);min-width:0;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#cbd5e1;box-shadow:var(--shadow-lift)}
.card.pad{padding:16px}
.card-h{
  min-height:46px;padding:11px 15px;border-bottom:1px solid var(--color-border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13.5px;font-weight:700;letter-spacing:.01em;background:#f8fafc;
  border-radius:var(--radius) var(--radius) 0 0;
}
.card-h .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card-h .sub{color:var(--color-muted-foreground);font-weight:500;font-size:11.5px;margin-left:auto}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{
  background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius);
  padding:13px 14px 13px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.stat:hover{transform:translateY(-2px);border-color:#bfdbfe;box-shadow:var(--shadow-lift)}
.stat .lab{font-size:11.5px;color:var(--color-muted-foreground);font-weight:600;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
.stat .lab .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
.stat .val{font-family:var(--mono);font-size:25px;line-height:1.2;font-weight:700;margin-top:7px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat .val small{font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:500;color:var(--color-muted-foreground);letter-spacing:0}
.stat .chg{font-size:11.5px;font-weight:600;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.stat .chg .material-symbols-outlined{font-size:15px}
.stat .accent-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-primary)}
.up{color:#166534}.down{color:#b91c1c}.flat{color:#475569}

.cols{display:grid;gap:14px}
.c-73{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr)}
.c-64{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.c-55{grid-template-columns:repeat(2,minmax(0,1fr))}
.c-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c-2{grid-template-columns:repeat(2,minmax(0,1fr))}

.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:3px 7px;border-radius:3px;white-space:nowrap;line-height:1.3;border:1px solid currentColor;
}
.tag .material-symbols-outlined{font-size:13px}
.t-return{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.t-rework{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.t-deviate{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.t-scrap{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
.t-hold{background:#faf5ff;color:#6b21a8;border-color:#e9d5ff}
.t-open{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.t-prog{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.t-done{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.t-crit{background:#b91c1c;color:#fff;border-color:#991b1b}
.t-maj{background:#fef2f2;color:#991b1b;border-color:#fca5a5}
.t-min{background:#fffbeb;color:#854d0e;border-color:#fde68a}

.tbl-wrap{overflow-x:auto;scrollbar-width:thin}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:760px}
table.dt th{
  text-align:left;font-size:11px;color:#334155;font-weight:700;letter-spacing:.035em;
  padding:9px 11px;border-bottom:1px solid #cbd5e1;background:#edf2f8;white-space:nowrap;
  position:sticky;top:0;z-index:1;
}
table.dt td{padding:9px 11px;border-bottom:1px solid #e8edf3;vertical-align:middle;background:#fff}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:nth-child(even) td{background:#fbfdff}
table.dt tr:hover td{background:#eff6ff}
table.dt .id,.kc-id,.ab-time,.kv .v{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
table.dt .id{font-weight:600;color:#1d4ed8;font-size:12px;white-space:nowrap}
table.dt .right,.right{text-align:right;font-variant-numeric:tabular-nums}
.prod{font-weight:600;color:#1e293b}
.prod small{display:block;color:#64748b;font-weight:400;font-size:11px;margin-top:1px;font-family:var(--mono)}
.avatar-sm{width:24px;height:24px;border-radius:3px;background:#dbeafe;color:#1e40af;font-weight:700;font-size:10.5px;display:inline-grid;place-items:center;margin-right:5px}
.rowsel{cursor:pointer}
.rowsel.act td{background:#dbeafe!important}

.mini-bar,.pbar-track{background:#e2e8f0;overflow:hidden;border-radius:2px}
.mini-bar{height:6px;min-width:70px}
.mini-bar i,.pbar-track i{display:block;height:100%;border-radius:0;background:var(--color-primary)}
.chart-box{position:relative;width:100%}
.cb-h{height:240px}.cb-m{height:200px}.cb-l{height:170px}.cb-xl{height:300px}
canvas{max-width:100%}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--color-muted-foreground);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid rgba(15,23,42,.12)}

.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kb-col{background:#f1f5f9;border:1px solid #d8e1ec;border-radius:4px;padding:9px;min-width:0}
.kb-col h4{margin:0 0 8px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;padding:2px}
.kb-col h4 .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;background:#fff;border:1px solid #cbd5e1;border-radius:2px;padding:1px 6px;color:#475569}
.kb-card{background:#fff;border:1px solid #d8e1ec;border-left:4px solid var(--color-primary);border-radius:3px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .2s ease,box-shadow .2s ease}
.kb-card:last-child{margin-bottom:0}
.kb-card:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(15,23,42,.1)}
.kb-card .kc-id{font-size:11px;font-weight:600;color:#1d4ed8}
.kb-card .kc-t{font-weight:600;font-size:12.5px;margin:3px 0}
.kb-card .kc-m{font-size:11px;color:#475569;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kb-card.b-blue{border-left-color:#2563eb}.kb-card.b-amber{border-left-color:#ea580c}.kb-card.b-slate{border-left-color:#64748b}.kb-card.b-red{border-left-color:#dc2626}

.appr{display:flex;flex-direction:column}
.appr-step{display:flex;gap:11px;position:relative;padding-bottom:15px}
.appr-step:last-child{padding-bottom:0}
.appr-step .line{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#cbd5e1}
.appr-step:last-child .line{display:none}
.appr-step.ok .line{background:#15803d}
.appr-node{width:28px;height:28px;border-radius:3px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;z-index:1;border:1px solid transparent}
.appr-node.ok{background:#dcfce7;color:#166534;border-color:#86efac}
.appr-node.cur{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.appr-node.wait{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
.appr-body{flex:1;min-width:0;padding-top:1px}
.appr-body .ab-t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appr-body .ab-r{font-size:11.5px;color:#475569}
.appr-body .ab-time{font-size:10.5px;color:#64748b;margin-top:3px}

.fish{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fish-cat{background:#f8fafc;border:1px solid #d8e1ec;border-radius:4px;padding:10px;min-width:0}
.fish-cat h5{margin:0 0 7px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;color:#1d4ed8}
.fish-cat ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.fish-cat li{font-size:12px;padding:6px 8px;background:#fff;border:1px solid #d8e1ec;border-radius:3px;display:flex;gap:7px;align-items:flex-start}
.fish-cat li .material-symbols-outlined{font-size:14px;color:#64748b;margin-top:1px}
.fish-cat li.root{border-color:#fdba74;background:#fff7ed;border-left:4px solid var(--color-accent)}
.fish-cat li.root .material-symbols-outlined{color:#c2410c}
.why{display:flex;flex-direction:column;gap:7px}
.why-row{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;background:#f8fafc;border:1px solid #d8e1ec;border-radius:4px}
.why-n{width:25px;height:25px;border-radius:3px;background:var(--color-primary);color:#fff;font-family:var(--mono);font-weight:700;display:grid;place-items:center;font-size:11px;flex:none}
.why-row .q{font-size:10.5px;color:#475569;font-weight:600}
.why-row .a{font-size:12.5px;font-weight:500;margin-top:1px}

.capa-item{display:flex;gap:11px;padding:11px 13px;border-bottom:1px solid #e8edf3;align-items:center;flex-wrap:wrap;min-width:0;transition:background-color .2s ease}
.capa-item:hover{background:#f8fafc}
.capa-item:last-child{border-bottom:0}
.capa-ico{width:34px;height:34px;border-radius:3px;display:grid;place-items:center;flex:none;background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
.capa-ico.blue{background:#dbeafe;color:#1d4ed8}.capa-ico.green{background:#dcfce7;color:#166534;border-color:#bbf7d0}.capa-ico.amber{background:#ffedd5;color:#9a3412;border-color:#fed7aa}
.capa-main{flex:1;min-width:160px}.capa-main .cm-t{font-weight:600;font-size:13px}.capa-main .cm-s{font-size:11px;color:#475569;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.capa-prog{width:140px;min-width:110px}.capa-prog .pl{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;margin-bottom:4px}
.d8{display:flex;gap:6px;flex-wrap:wrap}
.d8 .d{font-size:10.5px;font-weight:600;padding:5px 8px;border-radius:3px;border:1px solid #cbd5e1;background:#fff;color:#475569;display:flex;align-items:center;gap:5px}
.d8 .d.done{background:#f0fdf4;border-color:#86efac;color:#166534}.d8 .d.cur{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8;box-shadow:inset 0 -2px 0 #2563eb}.d8 .d .material-symbols-outlined{font-size:14px}

.chk{display:flex;flex-direction:column}.chk-row{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid #e8edf3;align-items:center}.chk-row:last-child{border-bottom:0}
.chk-box{width:23px;height:23px;border-radius:3px;flex:none;display:grid;place-items:center;border:1px solid transparent}.chk-box.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}.chk-box.no{background:#ffedd5;color:#9a3412;border-color:#fed7aa}.chk-box.na{background:#f1f5f9;color:#475569;border-color:#cbd5e1}.chk-box .material-symbols-outlined{font-size:16px}
.chk-txt{flex:1;min-width:0}.chk-txt .ct{font-weight:600;font-size:12.5px}.chk-txt .cs{font-size:11px;color:#475569;margin-top:1px}
.close-hero{background:linear-gradient(105deg,#eff6ff,#fff 64%);border:1px solid #bfdbfe;border-left:5px solid var(--color-primary);border-radius:4px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-width:0}
.close-seal{width:62px;height:62px;border-radius:4px;background:#1d4ed8;color:#fff;display:grid;place-items:center;flex:none;box-shadow:6px 6px 0 #bfdbfe}.close-seal .material-symbols-outlined{font-size:36px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}.kv .k{font-size:10.5px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kv .v{font-size:13px;font-weight:600;margin-top:1px}

<script>
"use strict";
var chartRegistry = [];
function destroyCharts(){
  for(var k=0;k<chartRegistry.length;k++){ try{ chartRegistry[k].destroy(); }catch(e){} }
  chartRegistry = [];
}
function mkChart(id, cfg){
  var el = document.getElementById(id);
  if(!el) return;
  var ctx = el.getContext("2d");
  var ch = new Chart(ctx, cfg);
  chartRegistry.push(ch);
  return ch;
}
var FONT = "'Fira Sans',system-ui,sans-serif";
Chart.defaults.font.family = FONT;
Chart.defaults.font.size = 12;
Chart.defaults.color = "#475569";
var RED="#2563eb", RED2="#3b82f6", BLUE="#0f766e", AMBER="#ea580c", GREEN="#15803d", SLATE="#64748b", PURPLE="#7c3aed";

/* ---------- NAV ---------- */

  {ic:"description", t:"不良通報立案", s:"NCR 案件佇列"},

  {ic:"insights", t:"品質統計", s:"趨勢與 KPI"}
];
function buildNav(){
  var nav = document.getElementById("nav");

  for(var i=0;i<SCREENS.length;i++){
    html += '<button data-i="'+i+'" onclick="show('+i+')">'+

      '<span class="material-symbols-outlined">'+SCREENS[i].ic+'</span>'+
      '<span class="lab">'+SCREENS[i].t+'</span></button>';
  }
  nav.innerHTML = html;
}

/* ---------- helpers ---------- */
function scrHead(ic,title,desc,rightHtml){
  return '<div class="scr-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1>'+
    '<p>'+desc+'</p></div><div class="sh-r">'+(rightHtml||"")+'</div></div>';
}
function statCard(lab,ico,val,unit,chg,cls){
  return '<div class="stat"><div class="accent-bar"></div>'+
    '<div class="lab"><span class="material-symbols-outlined">'+ico+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small> '+unit+'</small>':'')+'</div>'+
    (chg?'<div class="chg '+cls+'"><span class="material-symbols-outlined">'+(cls==="up"?"trending_up":cls==="down"?"trending_down":"remove")+'</span>'+chg+'</div>':'')+
    '</div>';
}

/* disposition tag */
function dispTag(d){
  var map={
    "退貨":['t-return','undo'],"重工":['t-rework','build'],"特採":['t-deviate','how_to_reg'],
    "報廢":['t-scrap','delete'],"隔離":['t-hold','pause_circle']
  };
  var m=map[d]||['t-scrap','label'];
  return '<span class="tag '+m[0]+'"><span class="material-symbols-outlined">'+m[1]+'</span>'+d+'</span>';
}
function sevTag(s){
  var map={"嚴重":'t-crit',"主要":'t-maj',"次要":'t-min'};
  return '<span class="tag '+(map[s]||'t-min')+'">'+s+'</span>';
}
function statusTag(s){
  var map={"待判定":['t-open','pending'],"處置中":['t-prog','autorenew'],"已關閉":['t-done','check_circle'],"驗證中":['t-hold','fact_check']};
  var m=map[s]||['t-open','circle'];
  return '<span class="tag '+m[0]+'"><span class="material-symbols-outlined">'+m[1]+'</span>'+s+'</span>';
}

/* ---------- SHOW ---------- */
var RENDERERS = [renderList, renderDisposition, renderRootCause, renderCapa, renderVerify, renderStats];
function show(i){
  i = +i; if(isNaN(i)||i<0) i=0;
  if(i>=RENDERERS.length) i=RENDERERS.length-1;
  destroyCharts();
  var btns = document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    if(+btns[b].getAttribute("data-i")===i) btns[b].classList.add("on");
    else btns[b].classList.remove("on");
  }
  RENDERERS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
