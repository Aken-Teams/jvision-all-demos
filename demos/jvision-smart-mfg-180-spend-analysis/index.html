<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>採購支出分析儀表板（Spend Analysis）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#b45309;
  --accent2:#f59e0b;
  --bg:#f6f4f0;
  --panel:#ffffff;
  --ink:#292524;
  --muted:#78716c;
  --line:#e7e1d8;
  --soft:#faf7f2;
  --good:#15803d;
  --bad:#dc2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;}
.brand-logo{
  width:40px;height:40px;border-radius:11px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 14px rgba(180,83,9,.28);
}
.brand-logo .material-symbols-outlined{font-size:24px;}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;}
.brand-txt span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;
  width:100%;transition:.15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nb-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:var(--soft);color:var(--ink);}
.navbtn.active{background:linear-gradient(135deg,rgba(180,83,9,.12),rgba(245,158,11,.12));color:var(--accent);border-color:rgba(180,83,9,.25);}
.navbtn.active .material-symbols-outlined{color:var(--accent);}
.side-foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7;}
.main{flex:1 1 auto;min-width:0;padding:24px 28px 48px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted);}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(21,128,61,.15);}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.g12{grid-template-columns:1fr 2fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(41,37,36,.03);}
.card h3{margin:0 0 2px;font-size:14px;font-weight:800;}
.card .csub{font-size:11.5px;color:var(--muted);margin-bottom:12px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
.kpi .klab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .klab .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .kval{font-size:25px;font-weight:800;margin-top:8px;letter-spacing:.3px;}
.kpi .kval small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px;}
.kpi .kfoot{font-size:11.5px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:4px;}
.kpi .kfoot .material-symbols-outlined{font-size:15px;}
.up{color:var(--good);}.down{color:var(--bad);}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,rgba(180,83,9,.09),rgba(245,158,11,.05));}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:var(--soft);}
tbody tr:hover{background:var(--soft);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.t-warn{background:#fef3c7;color:#92400e;}
.t-ok{background:#dcfce7;color:#166534;}
.t-bad{background:#fee2e2;color:#991b1b;}
.t-info{background:#e0e7ff;color:#3730a3;}
.t-neu{background:#f1efe9;color:#57534e;}
.bar-wrap{background:var(--soft);border-radius:999px;height:8px;overflow:hidden;min-width:60px;}
.bar-in{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.overflow{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);}
.chart-box{overflow:hidden;min-width:0;}
.mini-list{list-style:none;margin:0;padding:0;}
.mini-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
.mini-list li:last-child{border-bottom:0;}
.avatar{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 28px;}
.flow-steps{display:flex;flex-wrap:wrap;gap:10px;}
.step{flex:1 1 150px;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;}
.step .snum{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-bottom:8px;}
.step b{display:block;font-size:13px;}
.step p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6;}
.stat-chip{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;}
.stat-chip .sc-l{font-size:11px;color:var(--muted);font-weight:600;}
.stat-chip .sc-v{font-size:19px;font-weight:800;margin-top:3px;}
.sig-cluster{display:flex;flex-direction:column;gap:12px;}
.sig-row{display:flex;align-items:center;gap:12px;}
.sig-row .name{width:110px;flex:0 0 110px;font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sig-row .track{flex:1 1 auto;min-width:0;}
.sig-row .val{width:60px;flex:0 0 60px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12px;display:flex;align-items:center;justify-content:space-between;}
.col h4 .cnt{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:10.5px;color:var(--muted);}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;}
.tk .tkt{font-size:12px;font-weight:700;}
.tk .tkm{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 6px;}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--line);}
.tl-item .tlt{font-size:12.5px;font-weight:700;}
.tl-item .tld{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
.tl-item .tlm{font-size:10.5px;color:var(--accent);font-weight:700;margin-top:4px;}
.donut-legend{display:flex;flex-direction:column;gap:9px;justify-content:center;}
.donut-legend .dl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;}
.donut-legend .dl .lft{display:flex;align-items:center;gap:8px;min-width:0;}
.donut-legend .dl i{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}
.donut-legend .dl b{font-variant-numeric:tabular-nums;}
.hint{font-size:11px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
.sec-title{font-size:13px;font-weight:800;margin:2px 0 10px;display:flex;align-items:center;gap:8px;}
.sec-title .material-symbols-outlined{font-size:19px;color:var(--accent);}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 14px 10px;}
  .brand{padding-bottom:12px;}
  .side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;}
  .navbtn{width:auto;flex:0 0 auto;}
  .main{padding:18px 16px 40px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .navbtn .nb-txt{display:none;}
  .navbtn{padding:10px;}
  .topbar h1{font-size:17px;}
  .sig-row .name{width:84px;flex:0 0 84px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">savings</span></div>
      <div class="brand-txt">
        <b>Spend Analysis</b>
        <span>採購支出分析儀表板</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      純 UI 展示 · 擬真資料<br/>資料來源：ERP · SRM · 電子採購<br/>幣別：TWD（新台幣）
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">支出總覽儀表板</h1>
        <div class="sub" id="scr-sub">全公司採購支出總額、趨勢與可視覆蓋率</div>
      </div>
      <div class="pill"><span class="dot"></span>資料截至 2026-08 · FY2026</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
  "use strict";

  var MODS=[
    {icon:"dashboard",name:"支出總覽",full:"支出總覽儀表板",sub:"全公司採購支出總額、趨勢與可視覆蓋率"},
    {icon:"account_tree",name:"資料彙整清理",full:"支出資料彙整清理",sub:"多來源交易匯入、去重與品類自動歸類"},
    {icon:"insights",name:"品類支出分析",full:"品類支出分析",sub:"依品類/成本中心多維度切分與同比分析"},
    {icon:"monitoring",name:"供應商集中度",full:"供應商支出與集中度",sub:"供應商排名、帕累托與採購集中度風險"},
    {icon:"request_quote",name:"降本機會",full:"降本機會辨識",sub:"議價槓桿、合約覆蓋與節省機會量化"},
    {icon:"trending_up",name:"策略採購決策",full:"策略採購決策",sub:"尋源策略、節省追蹤與決策紀錄看板"}
  ];

  var view=document.getElementById("view");
  var charts=[];
  function killCharts(){
    for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} }
    charts=[];
  }
  var PALETTE=["#b45309","#f59e0b","#d97706","#fbbf24","#92400e","#fcd34d","#78350f","#fde68a"];
  function mk(id,opt){
    var el=document.getElementById(id);
    if(!el) return;
    var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter, "Noto Sans TC", sans-serif'};
    opt.chart=Object.assign(baseChart,opt.chart||{});
    var c=new ApexCharts(el,opt);
    c.render();
    charts.push(c);
  }

  // ---------- SCREEN 0 : 支出總覽 ----------
  function v0(){
    view.innerHTML=''+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("payments","總採購支出","NT$ 8.42","億","+6.2% 同比","up","trending_up")+
      kpi("visibility","支出可視覆蓋率","94.3","%","+11.0pt","up","trending_up")+
      kpi("groups","活躍供應商","318","家","−22 家（整併）","down","trending_down")+
      kpi("savings","累計已實現節省","NT$ 3,180","萬","轉化率 71%","up","trending_up")+
    '</div>'+
    '<div class="grid g21" style="margin-bottom:16px">'+
      '<div class="card chart-box"><h3>月度採購支出趨勢</h3><div class="csub">直接材料 vs 間接採購 · 單位：百萬元</div><div id="c0a"></div></div>'+
      '<div class="card"><h3>支出結構</h3><div class="csub">依採購類型佔比</div>'+
        '<div class="grid g2" style="gap:12px;align-items:center">'+
          '<div class="chart-box" id="c0b"></div>'+
          '<div class="donut-legend">'+
            dl("#b45309","直接材料","62%")+
            dl("#f59e0b","間接採購","23%")+
            dl("#d97706","委外加工","10%")+
            dl("#fcd34d","資本支出","5%")+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="grid g12">'+
      '<div class="card"><h3>支出治理健康度</h3><div class="csub">關鍵指標</div>'+
        chip("合約覆蓋率","78%")+chip("目錄採購比","64%")+chip("Maverick 支出","12%")+chip("平均付款週期","41 天")+
      '</div>'+
      '<div class="card chart-box"><h3>前六大品類支出</h3><div class="csub">本年度累計 · 百萬元</div><div id="c0c"></div></div>'+
    '</div>';
    void view.offsetHeight;
    mk("c0a",{
      series:[
        {name:"直接材料",data:[42,45,48,44,51,53,49,55,58,52,60,62]},
        {name:"間接採購",data:[18,17,19,21,20,22,19,23,24,22,25,24]}
      ],
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:290,stacked:true},
      colors:["#b45309","#f59e0b"],
      dataLabels:{enabled:false},
      stroke:{curve:"smooth",width:2},
      fill:{type:"gradient",gradient:{opacityFrom:.35,opacityTo:.05}},
      xaxis:{categories:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],labels:{style:{fontSize:"11px"}}},
      yaxis:{labels:{formatter:function(v){return v+"M";}}},
      legend:{position:"top",horizontalAlign:"right"},
      grid:{borderColor:"#eee"},
      tooltip:{shared:true,intersect:false}
    });
    mk("c0b",{
      series:[62,23,10,5],
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:200},
      labels:["直接材料","間接採購","委外加工","資本支出"],
      colors:["#b45309","#f59e0b","#d97706","#fcd34d"],
      dataLabels:{enabled:false},
      legend:{show:false},
      stroke:{width:0},
      plotOptions:{pie:{donut:{size:"64%",labels:{show:true,total:{show:true,label:"總支出",formatter:function(){return "8.42億";}}}}}}
    });
    mk("c0c",{
      series:[{name:"支出",data:[186,142,98,74,61,48]}],
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:260},
      plotOptions:{bar:{horizontal:true,borderRadius:5,barHeight:"62%",distributed:true}},
      colors:PALETTE,
      dataLabels:{enabled:true,formatter:function(v){return v+"M";},style:{fontSize:"11px",colors:["#fff"]}},
      xaxis:{categories:["鋼材/金屬","電子零件","塑膠原料","包裝耗材","物流運輸","MRO 維護"]},
      legend:{show:false},
      grid:{borderColor:"#eee"}
    });
  }

  // ---------- SCREEN 1 : 資料彙整清理 ----------
  function v1(){
    var rows=[
      ["ERP-財務","152,840","一日一次","已同步","t-ok","02:00","99.8%"],
      ["SRM 平台","48,210","即時","已同步","t-ok","即時","99.5%"],
      ["電子採購平台","31,905","一日一次","已同步","t-ok","02:15","98.9%"],
      ["請購/PR 系統","12,470","一小時","部分延遲","t-warn","01:40","94.2%"],
      ["費用報銷系統","8,336","一日一次","待對應","t-warn","—","88.7%"],
      ["境外採購匯入","3,120","手動","異常","t-bad","—","72.0%"]
    ];
    var trows="";
    for(var i=0;i<rows.length;i++){var r=rows[i];
      trows+='<tr><td><b>'+r[0]+'</b></td><td class="num">'+r[1]+'</td><td>'+r[2]+'</td><td><span class="tag '+r[4]+'">'+r[3]+'</span></td><td>'+r[5]+'</td><td class="num">'+r[6]+'</td></tr>';
    }
    view.innerHTML=''+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("cloud_sync","本月匯入交易","256,881","筆","6 個來源","up","database")+
      kpi("filter_alt","去重/清理","4,912","筆","重複與異常剔除","down","filter_alt")+
      kpi("category","自動歸類率","91.6","%","+8.4pt","up","trending_up")+
      kpi("pending_actions","待人工確認","1,284","筆","未歸類支出","down","pending_actions")+
    '</div>'+
    '<div class="grid g21" style="margin-bottom:16px">'+
      '<div class="card"><h3>資料來源同步狀態</h3><div class="csub">單一支出資料池 · 各來源健康度</div>'+
        '<div class="overflow"><table><thead><tr><th>資料來源</th><th class="num">交易筆數</th><th>頻率</th><th>狀態</th><th>最後同步</th><th class="num">完整度</th></tr></thead><tbody>'+trows+'</tbody></table></div>'+
      '</div>'+
      '<div class="card chart-box"><h3>清理管線漏斗</h3><div class="csub">原始 → 可分析</div><div id="c1a"></div></div>'+
    '</div>'+
    '<div class="grid g12">'+
      '<div class="card"><h3>資料品質分數</h3><div class="csub">六構面評估</div><div class="chart-box" id="c1b"></div></div>'+
      '<div class="card"><h3>品類自動歸類建議</h3><div class="csub">系統依規則比對，待採購分析師確認</div>'+

  // ---------- helpers ----------
  function kpi(icon,lab,val,unit,foot,dir,fic){
    return '<div class="kpi"><div class="klab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'+
      '<div class="kval">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
      '<div class="kfoot '+dir+'"><span class="material-symbols-outlined">'+fic+'</span>'+foot+'</div></div>';
  }
  function dl(c,l,v){ return '<div class="dl"><div class="lft"><i style="background:'+c+'"></i>'+l+'</div><b>'+v+'</b></div>'; }
  function chip(l,v){ return '<div class="stat-chip" style="margin-bottom:10px"><div class="sc-l">'+l+'</div><div class="sc-v">'+v+'</div></div>'; }
  function clsrow(desc,sup,cat,conf,tg,act){
    return '<tr><td><b>'+desc+'</b></td><td>'+sup+'</td><td>'+cat+'</td><td class="num">'+conf+'</td><td><span class="tag '+tg+'">'+act+'</span></td></tr>';
  }
  function catrow(name,spend,yoy,dir,sups,con,pct){
    var cc=con==="高"?"t-bad":(con==="中"?"t-warn":"t-ok");
    return '<tr><td><b>'+name+'</b></td><td class="num">'+spend+'</td><td class="num '+dir+'">'+yoy+'</td><td class="num">'+sups+'</td>'+
      '<td><span class="tag '+cc+'">'+con+'</span></td>'+
      '<td><div class="bar-wrap" style="width:64px"><div class="bar-in" style="width:'+pct+'%"></div></div></td></tr>';
  }
  function sig(nm,val,c){
    return '<div class="sig-row"><div class="name">'+nm+'</div>'+
      '<div class="track"><div class="bar-wrap"><div class="bar-in" style="width:'+val+'%;background:'+c+'"></div></div></div>'+
      '<div class="val">'+val+'/100</div></div>';
  }
  function step(n,t,d){ return '<div class="step"><div class="snum">'+n+'</div><b>'+t+'</b><p>'+d+'</p></div>'; }
  function col(title,cnt,body){ return '<div class="col"><h4>'+title+'<span class="cnt">'+cnt+'</span></h4>'+body+'</div>'; }
  function tk(t,m,tg,pri){ return '<div class="tk"><div class="tkt">'+t+'</div><div class="tkm"><span>'+m+'</span><span class="tag '+tg+'">'+pri+'</span></div></div>'; }
  function tl(d,t,desc,id){ return '<div class="tl-item"><div class="tlt">'+t+'</div><div class="tld">'+desc+'</div><div class="tlm">'+d+' · '+id+'</div></div>'; }
