<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>採購支出分析儀表板（Spend Analysis）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --good:#15803D;
  --warning:#9A3412;
  --bad:#DC2626;
  --info:#1D4ED8;
  --radius:12px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden
}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:260px;
  height:100vh;
  flex:0 0 260px;
  padding:24px 16px;
  background:var(--color-card);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  z-index:30
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 8px 25px;
  border-bottom:1px solid var(--line)
}
.brand-logo{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--blue);
  border-radius:10px;
  box-shadow:5px 5px 0 #BFDBFE
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  font-size:15px;
  line-height:1.2;
  letter-spacing:-.01em
}
.brand-txt span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap
}
.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding-top:20px
}
.navbtn{
  position:relative;
  width:100%;
  min-height:44px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  text-align:left;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s
}
.navbtn:hover{
  color:var(--ink);
  background:#F1F5F9;
  transform:translateX(2px)
}
.navbtn.active{
  color:var(--blue);
  background:#EFF6FF;
  border-color:#BFDBFE
}
.navbtn.active::before{
  content:"";
  position:absolute;
  left:-17px;
  width:3px;
  height:24px;
  background:var(--blue)
}
.navbtn .material-symbols-outlined{flex:0 0 auto}
.nb-txt{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.side-foot{
  margin-top:auto;
  padding:17px 9px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10.5px;
  line-height:1.75
}
.main{
  flex:1 1 auto;
  min-width:0;
  padding:28px clamp(18px,3vw,44px) 56px
}
.topbar{
  position:sticky;
  top:16px;
  z-index:20;
  min-height:92px;
  margin-bottom:20px;
  padding:20px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-left:4px solid var(--blue);
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px)
}
.topbar h1{
  margin:0;
  color:var(--ink);
  font-size:clamp(20px,2.2vw,28px);
  line-height:1.15;
  letter-spacing:-.035em
}
.topbar .sub{
  margin-top:7px;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.5
}
.pill{
  min-height:40px;
  padding:8px 13px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  border:1px solid #FDBA74;
  border-radius:7px;
  background:#FFF7ED;
  color:#7C2D12;
  font:600 11.5px "Fira Code",monospace
}
.pill .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--good);
  box-shadow:0 0 0 3px #DCFCE7
}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.card{padding:19px}
.card h3{
  margin:0 0 4px;
  color:var(--ink);
  font-size:14px;
  line-height:1.35
}
.card .csub{
  margin-bottom:14px;
  color:var(--muted);
  font-size:11.5px
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:139px;
  padding:18px;
  transition:transform .22s,border-color .22s,box-shadow .22s
}
.kpi:hover{
  transform:translateY(-3px);
  border-color:#BFDBFE;
  box-shadow:0 10px 28px rgba(37,99,235,.1)
}
.kpi::after{
  content:"";
  position:absolute;
  right:-18px;
  top:-22px;
  width:78px;
  height:78px;
  border:14px solid #EFF6FF;
  border-radius:50%
}
.kpi .klab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600
}
.kpi .klab .material-symbols-outlined{color:var(--blue)}
.kpi .kval{
  position:relative;
  z-index:1;
  margin-top:12px;
  color:var(--ink);
  font:700 25px/1.15 "Fira Code",monospace;
  letter-spacing:-.04em
}
.kpi .kval small{
  margin-left:5px;
  color:var(--muted);
  font:500 12px "Fira Sans",sans-serif;
  letter-spacing:0
}
.kpi .kfoot{
  position:relative;
  z-index:1;
  margin-top:9px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:600
}
.kpi .kfoot .material-symbols-outlined{font-size:15px}
.up{color:var(--good)}
.down{color:var(--bad)}
.overflow{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:8px;
  -webkit-overflow-scrolling:touch
}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  color:var(--ink);
  font-size:12px
}
th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap
}
th{
  background:#F1F5F9;
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#F8FAFC}
td.num,th.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
td:first-child b,.tlm,.tkm,.pill{font-variant-numeric:tabular-nums}
.tag{
  min-height:24px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  border:1px solid currentColor;
  border-radius:50%;
  background:currentColor
}
.t-ok{background:#F0FDF4;color:#166534}
.t-warn{background:#FFF7ED;color:#9A3412}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.t-neu{background:#F8FAFC;color:#475569}
.bar-wrap{
  height:8px;
  min-width:60px;
  overflow:hidden;
  background:#E2E8F0;
  border-radius:2px
}
.bar-in{height:100%;background:var(--blue);border-radius:2px}
.chart-box{overflow:hidden}
.stat-chip{
  min-width:0;
  margin-bottom:9px;
  padding:11px 13px;
  border-left:3px solid var(--blue);
  background:#F8FAFC
}
.stat-chip .sc-l{color:var(--muted);font-size:10.5px}
.stat-chip .sc-v{
  margin-top:4px;
  font:700 18px "Fira Code",monospace
}
.donut-legend{
  display:flex;
  flex-direction:column;
  gap:10px;
  justify-content:center
}
.donut-legend .dl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:11.5px
}
.donut-legend .lft{display:flex;align-items:center;gap:8px}
.donut-legend i{width:10px;height:10px;border-radius:2px}
.donut-legend b{font-family:"Fira Code",monospace}
.sig-cluster{display:flex;flex-direction:column;gap:14px}
.sig-row{display:flex;align-items:center;gap:12px}
.sig-row .name{
  width:104px;
  flex:0 0 104px;
  overflow:hidden;
  font-size:11.5px;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap
}
.sig-row .track{flex:1;min-width:0}
.sig-row .val{
  width:58px;
  flex:0 0 58px;
  text-align:right;
  font:600 10.5px "Fira Code",monospace
}
.hint{
  margin-top:12px;
  display:flex;
  align-items:flex-start;
  gap:7px;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.55
}
.avatar{
  width:28px;
  height:28px;
  margin-right:6px;
  display:inline-grid;
  place-items:center;
  border-radius:5px;
  color:#fff;
  font-weight:700
}
.sec-title{
  margin:0 0 13px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:700
}
.sec-title .material-symbols-outlined{color:var(--blue)}
.flow-steps{display:flex;flex-wrap:wrap;gap:10px}
.step{
  position:relative;
  flex:1 1 160px;
  min-width:0;
  padding:14px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-top:3px solid var(--blue);
  border-radius:7px
}
.step .snum{
  width:25px;
  height:25px;
  margin-bottom:9px;
  display:grid;
  place-items:center;
  background:var(--blue);
  color:#fff;
  border-radius:4px;
  font:700 11px "Fira Code",monospace
}
.step b{display:block;font-size:12px}
.step p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.55
}
.board{
  min-width:660px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px
}
.col{
  padding:11px;
  background:#F1F5F9;
  border-top:3px solid #94A3B8
}
.col h4{
  margin:0 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11.5px
}
.col .cnt{
  padding:2px 7px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  color:var(--muted);
  font:600 10px "Fira Code",monospace
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px
}
.tk:last-child{margin-bottom:0}
.tkt{font-size:11px;font-weight:700}
.tkm{
  margin-top:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  color:var(--muted);
  font:400 9.5px "Fira Code",monospace
}
.tl{position:relative;padding-left:22px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:6px;
  left:6px;
  width:1px;
  background:#CBD5E1
}
.tl-item{position:relative;padding:0 0 18px 7px}
.tl-item::before{
  content:"";
  position:absolute;
  top:3px;
  left:-20px;
  width:9px;
  height:9px;
  background:#fff;
  border:3px solid var(--blue);
  border-radius:50%
}
.tlt{font-size:11.5px;font-weight:700}
.tld{
  margin-top:4px;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.55
}
.tlm{
  margin-top:5px;
  color:var(--blue);
  font:600 9.5px "Fira Code",monospace
}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
@media(max-width:1120px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:14px;
    border-right:0;
    border-bottom:1px solid var(--line)
  }
  .brand{padding:0 4px 13px}
  .nav{
    padding-top:12px;
    flex-direction:row;
    overflow-x:auto;
    scrollbar-width:thin
  }
  .navbtn{width:auto;flex:0 0 auto}
  .navbtn.active::before{display:none}
  .side-foot{display:none}
  .main{padding:16px 14px 40px}
  .topbar{position:relative;top:0}
}
@media(max-width:720px){
  .g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
  .pill{width:100%;justify-content:center}
}
@media(max-width:500px){
  .g4{grid-template-columns:1fr}
  .topbar{padding:17px}
  .nb-txt{display:none}
  .navbtn{min-width:44px;justify-content:center;padding:10px}
  .kpi{min-height:128px}
  .sig-row .name{width:82px;flex-basis:82px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
  .reveal{opacity:1;transform:none;animation:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"><span class="material-symbols-outlined">savings</span></div>
      <div class="brand-txt"><b>Spend Analysis</b><span>採購支出分析儀表板</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br>資料來源：ERP · SRM · 電子採購<br>幣別：TWD（新台幣）</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="scr-title">支出總覽儀表板</h1>
        <div class="sub" id="scr-sub">全公司採購支出總額、趨勢與可視覆蓋率</div>
      </div>
      <div class="pill"><span class="dot" aria-hidden="true"></span>資料截至 2026-08 · FY2026</div>
    </header>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
 {icon:"dashboard",name:"支出總覽",full:"支出總覽儀表板",sub:"全公司採購支出總額、趨勢與可視覆蓋率"},
 {icon:"account_tree",name:"資料彙整清理",full:"支出資料彙整清理",sub:"多來源交易匯入、去重與品類自動歸類"},
 {icon:"insights",name:"品類支出分析",full:"品類支出分析",sub:"依品類/成本中心多維度切分與同比分析"},
 {icon:"monitoring",name:"供應商集中度",full:"供應商支出與集中度",sub:"供應商排名、帕累托與採購集中度風險"},
 {icon:"request_quote",name:"降本機會",full:"降本機會辨識",sub:"議價槓桿、合約覆蓋與節省機會量化"},
 {icon:"trending_up",name:"策略採購決策",full:"策略採購決策",sub:"尋源策略、節省追蹤與決策紀錄看板"}
];
var view=document.getElementById("view"),charts=[];
var PALETTE=["#2563EB","#3B82F6","#60A5FA","#93C5FD","#1D4ED8","#EA580C","#0F766E","#64748B"];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
 var el=document.getElementById(id);if(!el)return;
 opt.chart=Object.assign({redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Fira Sans",sans-serif',foreColor:"#475569"},opt.chart||{});
 opt.grid=Object.assign({borderColor:"#E2E8F0"},opt.grid||{});
 var c=new ApexCharts(el,opt);c.render();charts.push(c)
}
function kpi(icon,lab,val,unit,foot,dir,fic){
 return '<div class="kpi reveal"><div class="klab"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+lab+'</div><div class="kval">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="kfoot '+dir+'"><span class="material-symbols-outlined" aria-hidden="true">'+fic+'</span>'+foot+'</div></div>'
}
function dl(c,l,v){return '<div class="dl"><div class="lft"><i style="background:'+c+'"></i>'+l+'</div><b>'+v+'</b></div>'}
function chip(l,v){return '<div class="stat-chip"><div class="sc-l">'+l+'</div><div class="sc-v">'+v+'</div></div>'}
function clsrow(a,b,c,d,e,f){return '<tr><td><b>'+a+'</b></td><td>'+b+'</td><td>'+c+'</td><td class="num">'+d+'</td><td><span class="tag '+e+'">'+f+'</span></td></tr>'}
function catrow(a,b,c,d,e,f,g){
 var h=f==="高"?"t-bad":f==="中"?"t-warn":"t-ok";
 return '<tr><td><b>'+a+'</b></td><td class="num">'+b+'</td><td class="num '+d+'">'+c+'</td><td class="num">'+e+'</td><td><span class="tag '+h+'">'+f+'</span></td><td><div class="bar-wrap" style="width:64px"><div class="bar-in" style="width:'+g+'%"></div></div></td></tr>'
}
function sig(a,b,c){return '<div class="sig-row"><div class="name">'+a+'</div><div class="track"><div class="bar-wrap"><div class="bar-in" style="width:'+b+'%;background:'+c+'"></div></div></div><div class="val">'+b+'/100</div></div>'}
function step(a,b,c){return '<div class="step"><div class="snum">'+a+'</div><b>'+b+'</b><p>'+c+'</p></div>'}

function show(i){
 killCharts();
 btns.forEach(function(b){var active=+b.getAttribute("data-i")===i;b.classList.toggle("active",active);b.setAttribute("aria-current",active?"page":"false")});
 document.getElementById("scr-title").textContent=MODS[i].full;
 document.getElementById("scr-sub").textContent=MODS[i].sub;
 SCREENS[i]()
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 var i=m?Math.min(+m[1],SCREENS.length-1):0;
 show(i);
 try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",fromHash);
fromHash()
})();
</script>
</body>
</html>
