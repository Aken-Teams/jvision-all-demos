<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>物流追蹤與TMS整合系統｜運輸控制塔展示</title>
<meta name="description" content="派車、追蹤、簽收到成本油耗的車隊管理"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#be185d; --accent2:#fb7185;
  --bg:#0b1020; --panel:#131a2e; --panel2:#1a2338; --line:#25304d;
  --txt:#e8ecf6; --mut:#93a0be; --dim:#697695;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:linear-gradient(180deg,#080c18,#0b1020 40%);
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:rgba(9,13,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-in{max-width:1500px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(190,24,93,.4)}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11px;margin:2px 0 0;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.tb-status{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.livedot .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.clockbox{font-family:"Inter";font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.navbtn{display:inline-flex;align-items:center;gap:7px;min-width:0;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;transition:.15s}
.navbtn:hover{color:var(--txt);border-color:var(--accent2)}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#9d174d);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(190,24,93,.35)}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn .idx{font-size:10px;opacity:.6;font-weight:700}
main{max-width:1500px;margin:0 auto;padding:20px 16px 60px}
.scrn-head{display:flex;align-items:center;gap:12px;margin:2px 0 18px;flex-wrap:wrap}
.scrn-head .sh-ic{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:rgba(190,24,93,.16);color:var(--accent2);border:1px solid rgba(251,113,133,.25)}
.scrn-head h2{margin:0;font-size:19px;font-weight:800}
.scrn-head p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.grid{display:grid;gap:14px}
.g-kpi4{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2a{grid-template-columns:1.4fr 1fr}
.g-2b{grid-template-columns:1fr 1.5fr}
.g-2c{grid-template-columns:1fr 1.2fr}
.min0>*{min-width:0}
@media(max-width:820px){
  .g-kpi4{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-3,.g-2a,.g-2b,.g-2c{grid-template-columns:1fr}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.card-h .sub{font-size:11px;color:var(--mut)}
.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-12px;top:-12px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(190,24,93,.25),transparent 70%)}
.kpi .k-lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .k-lab .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.kpi .k-val{font-size:27px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--mut);margin-left:3px}
.kpi .k-sub{font-size:11.5px;margin-top:5px;color:var(--mut)}
.up{color:var(--ok)}.down{color:var(--bad)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
thead th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(37,48,77,.5);white-space:nowrap}
tbody tr:hover{background:rgba(190,24,93,.06)}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.15);color:var(--ok)}
.p-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.p-bad{background:rgba(248,113,113,.15);color:var(--bad)}
.p-info{background:rgba(96,165,250,.15);color:var(--info)}
.p-mut{background:var(--panel2);color:var(--mut)}
.dotb{width:7px;height:7px;border-radius:50%;display:inline-block}
.chartbox{position:relative;width:100%;overflow:hidden}
.tl{position:relative;padding-left:8px}
.tl-i{position:relative;padding:0 0 16px 26px;border-left:2px solid var(--line)}
.tl-i:last-child{border-left-color:transparent}
.tl-i .dot{position:absolute;left:-8px;top:1px;width:15px;height:15px;border-radius:50%;background:var(--panel);border:3px solid var(--accent2)}
.tl-i.done .dot{background:var(--ok);border-color:var(--ok)}
.tl-i.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(190,24,93,.25)}
.tl-t{font-size:13px;font-weight:700}
.tl-s{font-size:11px;color:var(--mut);margin-top:2px}
.tl-time{font-size:10.5px;color:var(--accent2);font-weight:700;font-family:"Inter"}
.bar{height:7px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:4px}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--mut)}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);text-align:center}
.foot span{color:var(--mut)}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(37,48,77,.5);font-size:12.5px;gap:10px}
.stat-row:last-child{border-bottom:0}
.stat-row .l{color:var(--mut);display:flex;align-items:center;gap:7px;min-width:0}
.stat-row .l .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.big{font-size:26px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sig{background:linear-gradient(135deg,rgba(190,24,93,.14),rgba(251,113,133,.06));border:1px solid rgba(251,113,133,.28)}
@media(max-width:560px){
  .navbtn .lbl{display:none}
  .navbtn{padding:9px 11px}
  .clockbox{display:none}
  .brand h1{font-size:13px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="tb-top">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">local_shipping</span></div>
        <div style="min-width:0">
          <h1>TMS 運輸控制塔</h1>
          <p>物流追蹤與TMS整合系統 · Logistics Tracking</p>
        </div>
      </div>
      <div class="tb-status">
        <span class="livedot"><span class="d"></span>即時連線</span>
        <span class="clockbox" id="clk">--:--:--</span>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main>
  <div id="screen"></div>
  <div class="foot">
    純 UI 系統展示（無後端），畫面與資料皆為<span>擬真示範</span>。單一網域 <span>/demos/jvision-smart-mfg-193-logistics-tracking-tms-integration/</span>
  </div>
</main>

<script>
"use strict";
var C={accent:"#be185d",accent2:"#fb7185",ok:"#34d399",warn:"#fbbf24",bad:"#f87171",info:"#60a5fa",mut:"#93a0be",line:"#25304d",grid:"rgba(147,160,190,.14)",txt:"#e8ecf6"};

var MODULES=[
  {ic:"account_tree",name:"承運商比價派車",desc:"多承運商叫車、報價比對與運力指派"},
  {ic:"monitoring",name:"在途貨況追蹤",desc:"GPS 定位、里程碑與異常時窗預警"},
  {ic:"thermostat",name:"冷鏈溫控監測",desc:"全程溫度曲線監控與超限告警"},
  {ic:"fact_check",name:"到貨簽收回單",desc:"電子簽收、POD 回單與缺漏追蹤"},
  {ic:"insights",name:"配送績效分析",desc:"準時率、成本占比與承運商評比"},
  {ic:"request_quote",name:"運費核算對帳",desc:"運費試算、承運商對帳與差異審核"}
];

(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].ic+'</span><span class="idx">0'+i+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

(function(){
  var el=document.getElementById("clk");
  function pad(n){return n<10?"0"+n:""+n;}
  var d=new Date(); el.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
})();

var CHARTS={};
function mkChart(id,cfg){
  var el=document.getElementById(id); if(!el)return;
  if(CHARTS[id]){try{CHARTS[id].destroy();}catch(e){} CHARTS[id]=null;}
  if(!cfg.options) cfg.options={};
  cfg.options.responsive=true; cfg.options.maintainAspectRatio=false;
  CHARTS[id]=new Chart(el.getContext("2d"),cfg);
}
Chart.defaults.color=C.mut;
Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
Chart.defaults.borderColor=C.grid;

function axl(extra){var o={ticks:{color:C.mut,font:{size:11}},grid:{color:C.grid}};if(extra)for(var k in extra)o[k]=extra[k];return o;}

function head(i){
  return '<div class="scrn-head"><div class="sh-ic"><span class="material-symbols-outlined">'+MODULES[i].ic+'</span></div>'
    +'<div style="min-width:0"><h2>'+MODULES[i].name+'</h2><p>'+MODULES[i].desc+'</p></div>'
    +'<span class="tag" style="margin-left:auto">模組 0'+i+' / 06</span></div>';
}
function kpi(lab,ic,val,unit,sub,cls){
  return '<div class="kpi"><div class="k-lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'
    +'<div class="k-val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
    +'<div class="k-sub '+(cls||'')+'">'+sub+'</div></div>';
}

/* ===== SCREEN 0 : 承運商比價派車 ===== */
function s0(){
  var carriers=[
    {n:"順捷物流",code:"SJ",quote:8420,eta:"6.2h",cap:"92%",score:4.7,rec:1,tag:"冷鏈"},
    {n:"全達通運",code:"QD",quote:7980,eta:"7.8h",cap:"71%",score:4.4,rec:0,tag:"一般"},
    {n:"日盛快遞",code:"RS",quote:9110,eta:"5.4h",cap:"64%",score:4.6,rec:0,tag:"急件"},
    {n:"宏運車隊",code:"HY",quote:7640,eta:"9.1h",cap:"88%",score:4.1,rec:0,tag:"重車"},
    {n:"安捷冷藏",code:"AJ",quote:8990,eta:"6.9h",cap:"55%",score:4.8,rec:0,tag:"冷鏈"}
  ];
  var pend=[
    {id:"SO-24817",dest:"台中／烏日",win:"14:00-16:00",wt:"1.2t",temp:"-18°C",st:"warn",stt:"時窗2.0h內"},
    {id:"SO-24820",dest:"桃園／中壢",win:"16:30-18:00",wt:"680kg",temp:"常溫",st:"info",stt:"待指派"},
    {id:"SO-24825",dest:"高雄／楠梓",win:"次日 09:00",wt:"3.4t",temp:"常溫",st:"mut",stt:"待指派"},
    {id:"SO-24829",dest:"新竹／竹北",win:"15:00-17:00",wt:"420kg",temp:"2~8°C",st:"warn",stt:"時窗2.0h內"}
  ];
  var rows="";
  for(var i=0;i<carriers.length;i++){var c=carriers[i];
    rows+='<tr><td><b>'+c.n+'</b> <span class="pill p-mut">'+c.code+'</span>'+(c.rec?' <span class="pill p-ok"><span class="material-symbols-outlined" style="font-size:13px">verified</span>推薦</span>':'')+'</td>'
      +'<td class="mono">$'+c.quote.toLocaleString()+'</td><td class="mono">'+c.eta+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:7px"><span class="mono" style="width:34px">'+c.cap+'</span><div class="bar" style="width:60px;margin:0"><span style="width:'+c.cap+'"></span></div></div></td>'
      +'<td class="mono">★ '+c.score+'</td><td><span class="pill p-info">'+c.tag+'</span></td></tr>';
  }
  var pr="";
  for(var j=0;j<pend.length;j++){var p=pend[j];
    pr+='<tr><td class="mono">'+p.id+'</td><td>'+p.dest+'</td><td class="mono">'+p.win+'</td><td class="mono">'+p.wt+'</td><td>'+p.temp+'</td>'
      +'<td><span class="pill p-'+p.st+'">'+p.stt+'</span></td></tr>';
  }
  return head(0)
   +'<div class="grid g-kpi4 min0" style="margin-bottom:14px">'
    +kpi("待派車託運單","assignment_late","12","單","含 4 張時窗即將到期","down")
    +kpi("合作承運商","account_tree","5","家","即時報價比對中","")
    +kpi("本日已派車","local_shipping","38","單","較昨日 +6 單","up")
    +kpi("平均選商節省","savings","7.3","%","以最適承運商為基準","up")
   +'</div>'
   +'<div class="grid g-2b min0">'
     +'<div class="card"><div class="card-h"><h3>待派車託運單</h3><span class="sub">依收貨時窗排序</span></div>'
       +'<div class="tblwrap"><table><thead><tr><th>託運單號</th><th>目的地</th><th>收貨時窗</th><th>重量</th><th>溫層</th><th>狀態</th></tr></thead><tbody>'+pr+'</tbody></table></div></div>'
     +'<div class="card"><div class="card-h"><h3>承運商即時比價</h3><span class="sub">SO-24817 · 台中烏日冷鏈</span></div>'
       +'<div class="tblwrap"><table><thead><tr><th>承運商</th><th>報價</th><th>ETA</th><th>剩餘運力</th><th>評分</th><th>類型</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
       +'<div class="legend" style="margin-top:10px"><b><span class="dotb" style="background:var(--ok)"></span>系統推薦：順捷物流（冷鏈+時效最佳）</b></div></div>'
   +'</div>'
   +'<div class="grid g-2 min0" style="margin-top:14px">'
     +'<div class="card"><div class="card-h"><h3>各承運商報價比較</h3><span class="sub">SO-24817</span></div><div class="chartbox" style="height:250px"><canvas id="c0a"></canvas></div></div>'
     +'<div class="card"><div class="card-h"><h3>本週派車量與承運商占比</h3></div><div class="chartbox" style="height:250px"><canvas id="c0b"></canvas></div></div>'
   +'</div>';
}
function i0(){
  mkChart("c0a",{type:"bar",data:{labels:["順捷","全達","日盛","宏運","安捷"],
    datasets:[{label:"報價 $",data:[8420,7980,9110,7640,8990],backgroundColor:[C.accent,"#3d4a6b","#3d4a6b","#3d4a6b","#3d4a6b"],borderRadius:6,barThickness:34}]},
    options:{plugins:{legend:{display:false}},scales:{x:axl(),y:axl({beginAtZero:false})}}});
  mkChart("c0b",{type:"bar",data:{labels:["一","二","三","四","五","六","日"],
    datasets:[
      {label:"順捷",data:[9,11,8,12,10,6,4],backgroundColor:C.accent,stack:"s",borderRadius:3},
      {label:"全達",data:[6,5,7,6,8,4,3],backgroundColor:C.accent2,stack:"s",borderRadius:3},
      {label:"其他",data:[8,7,9,10,11,5,4],backgroundColor:"#3d4a6b",stack:"s",borderRadius:3}
    ]},
    options:{plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:11}}}},scales:{x:axl({stacked:true}),y:axl({stacked:true,beginAtZero:true})}}});
}

/* ===== SCREEN 1 : 在途貨況追蹤 ===== */
function s1(){
  var trips=[
    {id:"TR-8841",car:"KEB-3021",drv:"陳建宏",dest:"台中烏日",prog:78,eta:"14:52",st:"ok",stt:"準時"},
    {id:"TR-8839",car:"BGA-7712",drv:"林俊傑",dest:"桃園中壢",prog:42,eta:"16:40",st:"warn",stt:"時窗緊迫"},
    {id:"TR-8836",car:"RCK-5590",drv:"王志明",dest:"高雄楠梓",prog:15,eta:"次日09:20",st:"ok",stt:"準時"},
    {id:"TR-8833",car:"TPM-1188",drv:"張家豪",dest:"新竹竹北",prog:96,eta:"15:05",st:"ok",stt:"即將到貨"},
    {id:"TR-8830",car:"LHD-4402",drv:"李世偉",dest:"台南永康",prog:58,eta:"17:30",st:"bad",stt:"塞車延誤"}
  ];
  var tr="";
  for(var i=0;i<trips.length;i++){var t=trips[i];
    tr+='<tr><td class="mono">'+t.id+'</td><td class="mono">'+t.car+'</td><td>'+t.drv+'</td><td>'+t.dest+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:80px;margin:0"><span style="width:'+t.prog+'%"></span></div><span class="mono" style="font-size:11px">'+t.prog+'%</span></div></td>'
      +'<td class="mono">'+t.eta+'</td><td><span class="pill p-'+t.st+'">'+t.stt+'</span></td></tr>';
  }
  var mile=[
    {done:1,now:0,t:"倉庫出貨",s:"KEB-3021 已取貨 · 1.2t",tm:"08:12"},

var SCR=[{r:s0,i:i0},{r:s1,i:i1},{r:s2,i:i2},{r:s3,i:i3},{r:s4,i:i4},{r:s5,i:i5}];
function show(i){
  var cont=document.getElementById("screen");
  var s=SCR[i]||SCR[0];
  cont.innerHTML=s.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  void cont.offsetHeight;
  try{s.i();}catch(e){}
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
