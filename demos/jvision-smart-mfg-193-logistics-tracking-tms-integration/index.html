<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物流追蹤與TMS整合系統｜運輸控制塔展示</title>
<meta name="description" content="派車、追蹤、簽收到成本油耗的車隊管理">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#00ff41;
  --color-on-primary:#0f172a;
  --color-secondary:#008f11;
  --color-on-secondary:#000;
  --color-accent:#ff3333;
  --color-on-accent:#000;
  --color-background:#0d1117;
  --color-foreground:#e6edf3;
  --color-card:#182424;
  --color-card-foreground:#e6edf3;
  --color-muted:#25292f;
  --color-muted-foreground:#a8b3c2;
  --color-border:#30363d;
  --color-destructive:#ef4444;
  --color-on-destructive:#000;
  --color-ring:#00ff41;
  --blue:#00ff41;
  --ink:#e6edf3;
  --muted:#a8b3c2;
  --line:#30363d;
  --accent:var(--color-primary);
  --accent2:#71ff94;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:var(--color-muted);
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --dim:#8491a3;
  --ok:#4ade80;
  --warn:#fbbf24;
  --bad:#ff6262;
  --info:#67b7ff;
  --font-display:"Cinzel","Noto Serif TC",serif;
  --font-body:"Josefin Sans","Noto Sans TC",system-ui,sans-serif;
  --font-mono:"SFMono-Regular","Cascadia Code","Roboto Mono",monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--txt);
  background:
    linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px),
    var(--bg);
  background-size:40px 40px;
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(0,255,65,.16);
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(13,17,23,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.24);
  backdrop-filter:blur(12px);
}
.topbar::after{
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:1px;
  content:"";
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.42;
}
.tb-in{max-width:1500px;margin:0 auto;padding:12px 18px}
.tb-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  display:grid;
  width:42px;
  height:42px;
  flex:0 0 auto;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--accent);
  border:1px solid #8affaa;
  border-radius:2px;
  box-shadow:5px 5px 0 rgba(0,143,17,.35);
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand h1{
  margin:0;
  overflow:hidden;
  color:var(--txt);
  font-family:var(--font-display);
  font-size:15px;
  font-weight:700;
  letter-spacing:.075em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand p{
  margin:3px 0 0;
  overflow:hidden;
  color:var(--mut);
  font-size:12px;
  font-weight:500;
  letter-spacing:.035em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.tb-status{display:flex;align-items:center;gap:16px;flex:0 0 auto}
.livedot{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--mut);
  font-size:12px;
  font-weight:600;
}
.livedot .d{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid var(--bg);
  border-radius:50%;
  box-shadow:0 0 0 2px var(--ok);
}
.clockbox{
  color:var(--txt);
  font-family:var(--font-mono);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
nav{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding:1px 1px 4px}
.navbtn{
  display:inline-flex;
  min-height:42px;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  padding:8px 12px;
  color:var(--mut);
  background:transparent;
  border:1px solid var(--line);
  border-radius:2px;
  font-size:13px;
  font-weight:600;
  transition:color .2s ease,border-color .2s ease,background .2s ease,transform .2s ease;
}
.navbtn:hover{color:var(--txt);background:var(--panel);border-color:#68717d;transform:translateY(-1px)}
.navbtn.on{
  color:var(--color-on-primary);
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:4px 4px 0 rgba(0,143,17,.4);
}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn .idx{font-family:var(--font-mono);font-size:10px;font-weight:700;opacity:.72}
main{max-width:1500px;margin:0 auto;padding:22px 18px 64px}
#screen{animation:screen-in .35s ease both}
.scrn-head{
  display:flex;
  align-items:center;
  gap:13px;
  margin:2px 0 18px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}
.scrn-head .sh-ic{
  display:grid;
  width:42px;
  height:42px;
  flex:0 0 auto;
  place-items:center;
  color:var(--accent);
  background:rgba(0,255,65,.07);
  border:1px solid rgba(0,255,65,.45);
  border-radius:2px;
}
.scrn-head h2{
  margin:0;
  font-family:var(--font-display);
  font-size:19px;
  font-weight:700;
  letter-spacing:.045em;
}
.scrn-head p{margin:3px 0 0;color:var(--mut);font-size:13px}
.tag{
  margin-left:auto;
  padding:4px 9px;
  color:var(--accent);
  background:rgba(0,255,65,.06);
  border:1px solid rgba(0,255,65,.35);
  border-radius:2px;
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
}
.grid{display:grid;gap:12px}
.g-kpi4{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2a{grid-template-columns:1.4fr 1fr}
.g-2b{grid-template-columns:1fr 1.5fr}
.g-2c{grid-template-columns:1fr 1.2fr}
.min0>*{min-width:0}
.card,.kpi{
  min-width:0;
  background:linear-gradient(145deg,rgba(24,36,36,.98),rgba(19,29,29,.98));
  border:1px solid var(--line);
  border-radius:3px;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
  transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.card{padding:16px}
.card:hover,.kpi:hover{
  border-color:#4d5b59;
  box-shadow:0 11px 24px rgba(0,0,0,.23);
  transform:translateY(-2px);
}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.card-h h3{
  margin:0;
  color:var(--txt);
  font-family:var(--font-display);
  font-size:13px;
  font-weight:600;
  letter-spacing:.045em;
}
.card-h .sub{color:var(--mut);font-size:11px}
.kpi{position:relative;overflow:hidden;padding:15px 16px}
.kpi::before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:2px;
  content:"";
  background:linear-gradient(90deg,var(--accent),transparent 72%);
}
.kpi::after{
  position:absolute;
  right:-20px;
  bottom:-34px;
  width:82px;
  height:82px;
  content:"";
  border:1px solid rgba(0,255,65,.12);
  transform:rotate(45deg);
}
.kpi .k-lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--mut);
  font-size:12px;
  font-weight:600;
}
.kpi .k-lab .material-symbols-outlined{color:var(--accent);font-size:17px}
.kpi .k-val{
  margin-top:7px;
  color:var(--txt);
  font-family:var(--font-mono);
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .k-val small{margin-left:4px;color:var(--mut);font-size:12px;font-weight:600}
.kpi .k-sub{margin-top:5px;color:var(--mut);font-size:11.5px}
.up::before{content:"改善：";font-weight:700}
.down::before{content:"注意：";font-weight:700}
.up{color:var(--ok)!important}
.down{color:#ff8585!important}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12.5px}
thead th{
  padding:10px 12px;
  color:#c3ccd8;
  background:#202a2a;
  border-bottom:1px solid #485250;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
tbody td{
  padding:10px 12px;
  border-bottom:1px solid rgba(72,82,80,.58);
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(0,255,65,.045)}
th:nth-child(n+2),td.mono{text-align:right}
td:first-child.mono{text-align:left}
.mono{
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.p-ok{color:#7cf59c;background:rgba(74,222,128,.09)}
.p-warn{color:#ffd66b;background:rgba(251,191,36,.09)}
.p-bad{color:#ff8585;background:rgba(255,98,98,.09)}
.p-info{color:#8bcaff;background:rgba(103,183,255,.09)}
.p-mut{color:#bbc4cf;background:rgba(168,179,194,.07)}
.dotb{display:inline-block;width:7px;height:7px;border:1px solid currentColor;border-radius:50%}
.chartbox{position:relative;width:100%;overflow:hidden}
.tl{position:relative;padding-left:8px}
.tl-i{position:relative;padding:0 0 16px 27px;border-left:1px solid var(--line)}
.tl-i:last-child{border-left-color:transparent}
.tl-i .dot{
  position:absolute;
  top:1px;
  left:-7px;
  width:13px;
  height:13px;
  background:var(--panel);
  border:2px solid var(--mut);
  border-radius:50%;
}
.tl-i.done .dot{background:var(--ok);border-color:var(--ok)}
.tl-i.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,255,65,.14)}
.tl-i.done .tl-t::before{content:"完成 · "}
.tl-i.now .tl-t::before{content:"目前 · ";color:var(--accent)}
.tl-t{font-size:13px;font-weight:700}
.tl-s{margin-top:2px;color:var(--mut);font-size:11px}
.tl-time{color:var(--accent2);font-family:var(--font-mono);font-size:10.5px;font-weight:700}
.bar{height:6px;margin-top:6px;overflow:hidden;background:#303938;border-radius:0}
.bar>span{display:block;height:100%;background:var(--accent);border-right:2px solid #baffca}
.legend{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap;color:var(--mut);font-size:11px}
.legend b{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600}
.foot{
  margin-top:28px;
  padding-top:16px;
  color:var(--dim);
  border-top:1px solid var(--line);
  font-size:11px;
  text-align:center;
}
.foot span{color:var(--mut)}
.stat-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid rgba(72,82,80,.58);
  font-size:12.5px;
}
.stat-row:last-child{border-bottom:0}
.stat-row .l{display:flex;align-items:center;gap:7px;min-width:0;color:var(--mut)}
.stat-row .l .material-symbols-outlined{color:var(--accent);font-size:17px}
.stat-row .v{flex:0 0 auto;font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.big{
  font-family:var(--font-mono);
  font-size:26px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;
}
.sig{border-color:rgba(0,255,65,.34);background:linear-gradient(135deg,rgba(0,255,65,.055),rgba(24,36,36,.98) 38%)}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g-kpi4{grid-template-columns:repeat(2,1fr)}
  .g-2a,.g-2b,.g-2c{grid-template-columns:1fr}
}
@media(max-width:768px){
  .g-2,.g-3{grid-template-columns:1fr}
  .tb-in,main{padding-left:14px;padding-right:14px}
  .scrn-head{align-items:flex-start}
}
@media(max-width:560px){
  .g-kpi4{grid-template-columns:1fr 1fr}
  .navbtn .lbl{display:none}
  .navbtn{min-width:46px;justify-content:center;padding:9px 10px}
  .clockbox{display:none}
  .brand h1{font-size:13px}
  .brand p{font-size:10.5px}
  .livedot{font-size:10px}
  .scrn-head h2{font-size:16px}
  .scrn-head p{font-size:12px}
  .tag{width:100%;margin:2px 0 0 55px}
  .kpi{padding:13px}
  .kpi .k-val{font-size:22px}
}
@media(max-width:390px){
  .g-kpi4{grid-template-columns:1fr}
  .brand .logo{width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #screen{animation:none}
  .card:hover,.kpi:hover,.navbtn:hover{transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="tb-top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">local_shipping</span></div>
        <div style="min-width:0">
          <h1>TMS 運輸控制塔</h1>
          <p>物流追蹤與TMS整合系統 · Logistics Tracking</p>
        </div>
      </div>
      <div class="tb-status">
        <span class="livedot"><span class="d"></span>即時連線</span>
        <time class="clockbox" id="clk">--:--:--</time>
      </div>
    </div>
    <nav id="nav" aria-label="系統模組"></nav>
  </div>
</header>
<main>
  <div id="screen"></div>
  <div class="foot">
    純 UI 系統展示（無後端），畫面與資料皆為<span>擬真示範</span>。單一網域 <span>/demos/jvision-smart-mfg-193-logistics-tracking-tms-integration/</span>
  </div>
</main>
<script>
"use strict";
var C={accent:"#00ff41",accent2:"#71ff94",ok:"#4ade80",warn:"#fbbf24",bad:"#ff6262",info:"#67b7ff",mut:"#a8b3c2",line:"#30363d",grid:"rgba(168,179,194,.13)",txt:"#e6edf3"};

var MODULES=[
  {ic:"account_tree",name:"承運商比價派車",desc:"多承運商叫車、報價比對與運力指派"},
  {ic:"monitoring",name:"在途貨況追蹤",desc:"GPS 定位、里程碑與異常時窗預警"},
  {ic:"thermostat",name:"冷鏈溫控監測",desc:"全程溫度曲線監控與超限告警"},
  {ic:"fact_check",name:"到貨簽收回單",desc:"電子簽收、POD 回單與缺漏追蹤"},
  {ic:"insights",name:"配送績效分析",desc:"準時率、成本占比與承運商評比"},
  {ic:"request_quote",name:"運費核算對帳",desc:"運費試算、承運商對帳與差異審核"}
];

(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+MODULES[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODULES[i].ic+'</span><span class="idx">0'+i+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });
})();

(function(){
  var el=document.getElementById("clk");
  function pad(n){return n<10?"0"+n:""+n}
  var d=new Date();
  el.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  el.setAttribute("datetime",d.toISOString());
})();

var CHARTS={};
function mkChart(id,cfg){
  var el=document.getElementById(id);if(!el)return;
  if(CHARTS[id]){try{CHARTS[id].destroy()}catch(e){}CHARTS[id]=null}
  if(!cfg.options)cfg.options={};
  cfg.options.responsive=true;
  cfg.options.maintainAspectRatio=false;
  cfg.options.animation=window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350};
  CHARTS[id]=new Chart(el.getContext("2d"),cfg);
}
Chart.defaults.color=C.mut;
Chart.defaults.font.family="'Josefin Sans','Noto Sans TC',sans-serif";
Chart.defaults.borderColor=C.grid;
function axl(extra){
  var o={ticks:{color:C.mut,font:{size:11}},grid:{color:C.grid}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}
function head(i){
  return '<div class="scrn-head"><div class="sh-ic"><span class="material-symbols-outlined" aria-hidden="true">'+MODULES[i].ic+'</span></div>'+
  '<div style="min-width:0"><h2>'+MODULES[i].name+'</h2><p>'+MODULES[i].desc+'</p></div>'+
  '<span class="tag">模組 0'+i+' / 06</span></div>';
}
function kpi(lab,ic,val,unit,sub,cls){
  return '<div class="kpi"><div class="k-lab"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+lab+'</div>'+
  '<div class="k-val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
  '<div class="k-sub '+(cls||"")+'">'+sub+'</div></div>';
}

function s0(){
  var carriers=[
    {n:"O捷物流",code:"SJ",quote:8420,eta:"6.2h",cap:"92%",score:4.7,rec:1,tag:"冷鏈"},
    {n:"全達通運",code:"QD",quote:7980,eta:"7.8h",cap:"71%",score:4.4,rec:0,tag:"一般"},
    {n:"日盛快遞",code:"RS",quote:9110,eta:"5.4h",cap:"64%",score:4.6,rec:0,tag:"急件"},
    {n:"宏運車隊",code:"HY",quote:7640,eta:"9.1h",cap:"88%",score:4.1,rec:0,tag:"重車"},
    {n:"安捷冷藏",code:"AJ",quote:8990,eta:"6.9h",cap:"55%",score:4.8,rec:0,tag:"冷鏈"}
  ];
  var pend=[
    {id:"SO-24817",dest:"台中／烏日",win:"14:00-16:00",wt:"1.2t",temp:"-18°C",st:"warn",stt:"時窗2.0h內"},

function show(i){
  var cont=document.getElementById("screen"),s=SCR[i]||SCR[0];
  cont.innerHTML=s.r();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var on=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("on",on);
    btns[k].setAttribute("aria-current",on?"page":"false");
  }
  void cont.offsetHeight;
  try{s.i()}catch(e){}
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
