<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>業績獎金計算 Sales Commission &amp; Incentive｜Jvision Demo</title>
<meta name="description" content="獎金規則設定、業績彙整、自動核算、主管審核、爭議申訴到發放結算的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent2:#fb7185; --ink:#1f2430; --muted:#6b7280;
  --bg:#f5f6fa; --card:#ffffff; --line:#e8eaf0; --soft:#fff1f3;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 12px rgba(225,29,72,.28);}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0;}
nav.tabs button{
  border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;min-width:0;transition:.15s;
}
nav.tabs button .material-symbols-outlined{font-size:19px}
nav.tabs button:hover{background:var(--soft);color:var(--accent)}
nav.tabs button.on{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(225,29,72,.3)}

.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.screen-head .st{min-width:0}
.screen-head h1{margin:0;font-size:20px;letter-spacing:.3px}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;}
.pill .material-symbols-outlined{font-size:16px}
.spacer{margin-left:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--soft);}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:.3px;position:relative;z-index:1}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .sub{font-size:11.5px;margin-top:4px;position:relative;z-index:1}
.up{color:var(--ok)} .down{color:var(--bad)}

.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#fafafc;font-weight:700;color:var(--muted);font-size:12px}
tbody tr:hover{background:var(--soft)}
td .material-symbols-outlined{font-size:16px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}
.t-ok{background:#e7f6ec;color:var(--ok)}
.t-warn{background:#fef3e2;color:var(--warn)}
.t-bad{background:#fdeaea;color:var(--bad)}
.t-info{background:#e8f0fe;color:var(--info)}
.t-mute{background:#eef0f4;color:var(--muted)}

.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:800}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted)}
.col.c-todo .col-h{color:var(--muted)}
.col.c-run .col-h{color:var(--info)}
.col.c-rev .col-h{color:var(--warn)}
.col.c-done .col-h{color:var(--ok)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,20,40,.03)}
.tk:last-child{margin-bottom:0}
.tk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tk-name{font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-id{font-size:11px;color:var(--muted);font-weight:600}
.tk-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;gap:8px}
.tk-amt{font-weight:900;color:var(--accent);font-size:14px}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar{height:6px;border-radius:6px;background:#eef0f4;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.rulecard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.rulecard:last-child{margin-bottom:0}
.rulecard .rh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rulecard .rh b{font-size:14px}
.tier{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.tier:first-of-type{border-top:0}
.tier .tno{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--accent);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.tier .trate{font-weight:900;color:var(--accent)}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlitem{position:relative;padding:0 0 16px 6px}
.tlitem:last-child{padding-bottom:0}
.tldot{position:absolute;left:-21px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tlitem.done .tldot{background:var(--accent);border-color:var(--accent)}
.tlitem.now .tldot{border-color:var(--info);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.tl .tt{font-weight:800;font-size:13.5px}
.tl .td{font-size:12px;color:var(--muted);margin-top:2px}
.tl .tm{font-size:11px;color:var(--muted);margin-top:3px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.progline{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.progline .pl-n{width:120px;min-width:120px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progline .bar{flex:1;margin-top:0}
.progline .pl-v{width:56px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.rank{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .rk{width:26px;height:26px;border-radius:8px;background:#eef0f4;color:var(--muted);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rank.top1 .rk{background:var(--accent);color:#fff}
.rank.top2 .rk{background:var(--accent2);color:#fff}
.rank.top3 .rk{background:#fecdd3;color:var(--accent)}
.rank .rn{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rv{font-weight:900;font-variant-numeric:tabular-nums}
.note{background:var(--soft);border:1px solid #fbd0d8;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#9f1239;display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{font-size:19px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f0f1f5;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.chip .material-symbols-outlined{font-size:15px;color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.btn .material-symbols-outlined{font-size:16px}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mono{font-variant-numeric:tabular-nums}
.sec-note{font-size:11.5px;color:var(--muted);margin-top:6px}

@media(max-width:560px){
  nav.tabs button .lbl{display:none}
  nav.tabs button{padding:8px}
  .brand span{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">request_quote</span></div>
      <div><b>業績獎金計算</b><span>Sales Commission &amp; Incentive</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-i="0"><span class="material-symbols-outlined">rule</span><span class="lbl">獎金規則</span></button>
      <button data-i="1"><span class="material-symbols-outlined">receipt_long</span><span class="lbl">業績彙整</span></button>
      <button data-i="2"><span class="material-symbols-outlined">request_quote</span><span class="lbl">自動核算</span></button>
      <button data-i="3"><span class="material-symbols-outlined">fact_check</span><span class="lbl">審核看板</span></button>
      <button data-i="4"><span class="material-symbols-outlined">gavel</span><span class="lbl">爭議申訴</span></button>
      <button data-i="5"><span class="material-symbols-outlined">insights</span><span class="lbl">發放報表</span></button>
    </nav>
  </div>
</header>

<main class="wrap"><div id="view"></div></main>

<script>
"use strict";
var view=document.getElementById("view");
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el||typeof echarts==="undefined")return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
function money(n){return "NT$"+Number(n).toLocaleString("en-US");}
function fmt(n){return Number(n).toLocaleString("en-US");}

var REPS=[
  {id:"S-201",name:"陳冠宇",team:"北區一隊",sales:8420000,target:6500000,tier:"鑽石",comm:412600,ach:130,pstatus:"approved"},
  {id:"S-202",name:"林思妤",team:"北區一隊",sales:6180000,target:6000000,tier:"白金",comm:266900,ach:103,pstatus:"pending"},
  {id:"S-203",name:"王柏翰",team:"北區二隊",sales:5240000,target:5500000,tier:"黃金",comm:178400,ach:95,pstatus:"review"},
  {id:"S-204",name:"張雅涵",team:"中區一隊",sales:7310000,target:6000000,tier:"白金",comm:351200,ach:122,pstatus:"approved"},
  {id:"S-205",name:"黃鈺婷",team:"中區一隊",sales:4120000,target:4800000,tier:"銀級",comm:98600,ach:86,pstatus:"dispute"},
  {id:"S-206",name:"吳承翰",team:"南區一隊",sales:6890000,target:5800000,tier:"白金",comm:298700,ach:119,pstatus:"pending"},
  {id:"S-207",name:"劉沛穎",team:"南區一隊",sales:3980000,target:5000000,tier:"銀級",comm:84200,ach:80,pstatus:"review"},
  {id:"S-208",name:"蔡宗翰",team:"南區二隊",sales:9120000,target:7000000,tier:"鑽石",comm:468500,ach:130,pstatus:"approved"}
];

function s0(){
  view.innerHTML=''
  +head("rule","獎金規則設定","人資部","建立階梯級距、達成率係數與加速獎金規則，設定生效產品線與期間")
  +'<div class="grid g4" style="margin-bottom:14px">'
    +kpi("layers","啟用規則","6","組","3 條產品線適用","up")
    +kpi("percent","基礎佣金率","3.5","%","以認列淨業績計","")
    +kpi("bolt","加速獎金門檻","120","%","超標即進入加速級距","up")
    +kpi("event","本期生效","2026 Q3","","07/01 - 09/30","")
  +'</div>'
  +'<div class="grid g23">'
    +'<div class="card"><h3><span class="material-symbols-outlined">stairs</span>階梯級距規則庫</h3>'
      +rule("RULE-01","消費電子產品線","鑽石","啟用",[
        ["1","達成率 &lt; 90%","2.5%"],["2","90% - 110%","3.5%"],["3","110% - 120%","4.8%"],["4","&ge; 120% 加速","6.2%"]])
      +rule("RULE-02","工業設備產品線","白金","啟用",[
        ["1","達成率 &lt; 100%","2.0%"],["2","100% - 120%","4.0%"],["3","&ge; 120% 加速","5.5%"]])
      +rule("RULE-03","服務合約續約","黃金","草稿",[
        ["1","續約率 &lt; 80%","1.5%"],["2","80% - 95%","3.0%"],["3","&ge; 95%","4.2%"]])
    +'</div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">tune</span>係數與參數</h3>'
      +'<div class="progline"><span class="pl-n">團隊分攤係數</span><span class="bar"><i style="width:70%"></i></span><span class="pl-v">0.70</span></div>'
      +'<div class="progline"><span class="pl-n">個人達成係數</span><span class="bar"><i style="width:85%"></i></span><span class="pl-v">0.85</span></div>'
      +'<div class="progline"><span class="pl-n">新客加成</span><span class="bar"><i style="width:20%"></i></span><span class="pl-v">+20%</span></div>'
      +'<div class="progline"><span class="pl-n">退貨扣抵上限</span><span class="bar"><i style="width:15%"></i></span><span class="pl-v">15%</span></div>'
      +'<div style="margin-top:12px">'
        +'<div class="chip"><span class="material-symbols-outlined">verified</span>已核准</div>'
        +'<div class="chip"><span class="material-symbols-outlined">history</span>版本 v3.2</div>'
        +'<div class="chip"><span class="material-symbols-outlined">groups</span>適用 8 位業務</div>'
      +'</div>'
      +'<div class="note" style="margin-top:12px"><span class="material-symbols-outlined">info</span><div>加速級距僅適用達成率 &ge; 120% 之認列淨業績，退貨折讓須先行扣除後再套用。</div></div>'
    +'</div>'
  +'</div>';
}
function rule(id,line,tier,st,tiers){
  var stag=st==="啟用"?'<span class="tag t-ok"><span class="material-symbols-outlined">check_circle</span>啟用</span>':'<span class="tag t-mute">草稿</span>';
  var body="";
  for(var i=0;i<tiers.length;i++){
    body+='<div class="tier"><span class="tno">'+tiers[i][0]+'</span><span>'+tiers[i][1]+'</span><span class="trate">'+tiers[i][2]+'</span></div>';
  }
  return '<div class="rulecard"><div class="rh"><b>'+line+'</b><span class="tag t-info">'+id+'</span><span class="tag t-warn">'+tier+'</span>'+stag+'</div>'
    +'<div style="margin-top:8px">'+body+'</div></div>';
}

function s1(){
  var rows="";
  var src=[
    {o:"SO-260731-018",cust:"O達電子",rep:"陳冠宇",gross:2180000,ret:120000,net:2060000,st:"認列"},
    {o:"SO-260728-042",cust:"O聚材料",rep:"張雅涵",gross:1540000,ret:0,net:1540000,st:"認列"},
    {o:"SO-260725-007",cust:"聯O精機",rep:"蔡宗翰",gross:3120000,ret:280000,net:2840000,st:"認列"},
    {o:"SO-260722-091",cust:"O華光電",rep:"林思妤",gross:980000,ret:60000,net:920000,st:"待確認"},
    {o:"SO-260719-033",cust:"O鴻通訊",rep:"吳承翰",gross:1760000,ret:0,net:1760000,st:"認列"},
    {o:"SO-260715-056",cust:"O運物流",rep:"黃鈺婷",gross:640000,ret:210000,net:430000,st:"退貨扣抵"}
  ];
  for(var i=0;i<src.length;i++){var r=src[i];
    var tg=r.st==="認列"?"t-ok":(r.st==="待確認"?"t-warn":"t-bad");
    rows+='<tr><td class="mono">'+r.o+'</td><td>'+r.cust+'</td><td>'+r.rep+'</td>'
      +'<td class="num">'+fmt(r.gross)+'</td><td class="num" style="color:var(--bad)">-'+fmt(r.ret)+'</td>'
      +'<td class="num" style="color:var(--accent)">'+fmt(r.net)+'</td>'
      +'<td><span class="tag '+tg+'">'+r.st+'</span></td></tr>';
  }
  view.innerHTML=''
  +head("receipt_long","業績數據彙整","財務部","從 ERP/CRM 匯入本期銷售訂單，扣除退貨與折讓後鎖定認列業績基準")
  +'<div class="grid g4" style="margin-bottom:14px">'
    +kpi("shopping_cart","訂單筆數","428","筆","本期 07/01-07/31","")
    +kpi("payments","毛業績","5,126","萬","含未認列","up")
    +kpi("undo","退貨折讓","342","萬","占 6.7%","down")
    +kpi("verified","認列淨業績","4,784","萬","已鎖定基準","up")
  +'</div>'
  +'<div class="grid g32">'
    +'<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>訂單認列明細</h3>'
      +'<div class="tblwrap"><table><thead><tr><th>訂單編號</th><th>客戶</th><th>業務</th><th>毛額</th><th>退貨/折讓</th><th>淨額</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'

function kpi(icon,lab,val,unit,sub,dir){
  var sc=dir==="up"?"up":(dir==="down"?"down":"");
  var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px">trending_up</span>':(dir==="down"?'<span class="material-symbols-outlined" style="font-size:14px">trending_down</span>':'');
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'
    +'<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'
    +'<div class="sub '+sc+'">'+arrow+' '+sub+'</div></div>';
}

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
  void view.offsetHeight;
}
var tabsEl=document.getElementById("tabs");
tabsEl.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-i]");
  if(!t)return;
  location.hash="v"+t.getAttribute("data-i");
});
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
