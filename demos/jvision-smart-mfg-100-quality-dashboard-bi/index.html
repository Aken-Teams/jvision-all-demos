<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>品質戰情室 Quality Dashboard/BI</title>
<meta name="description" content="從異常到改善的品質閉環與追溯稽核"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#ede9fe;
  --bg:#f5f3fb; --card:#ffffff; --ink:#1e1b2e; --muted:#6b6880;
  --line:#e7e3f2; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(100deg,#5b21b6,#6d28d9 55%,#7c3aed);
  color:#fff; box-shadow:0 4px 18px rgba(76,29,149,.28);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
.brand .t1{font-weight:900;font-size:16px;letter-spacing:.5px;white-space:nowrap;}
.brand .t2{font-size:11px;opacity:.82;white-space:nowrap;}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.14);
  padding:7px 12px;border-radius:9px;font-size:13px;font-family:inherit;font-weight:600;
  transition:.15s;white-space:nowrap;
}
.nav button:hover{background:rgba(255,255,255,.22);}
.nav button.active{background:#fff;color:var(--accent);border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.nav button .ms{font-size:18px;}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.screen-head h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.5px;}
.screen-head p{margin:0;color:var(--muted);font-size:13px;}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(30,27,46,.04);min-width:0;}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .ms{font-size:19px;color:var(--accent);}
.sub{font-size:12px;color:var(--muted);font-weight:500;}
.grid{display:grid;gap:14px;min-width:0;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-src{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){
  .g-kpi,.g-2,.g-2e,.g-3,.g-src{grid-template-columns:1fr;}
}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .v{font-size:26px;font-weight:900;margin-top:4px;letter-spacing:.5px;}
.kpi .d{font-size:12px;margin-top:4px;font-weight:600;}
.kpi .d.up{color:var(--ok);} .kpi .d.down{color:var(--bad);}
.kpi.warn::before{background:var(--warn);} .kpi.bad::before{background:var(--bad);} .kpi.ok::before{background:var(--ok);}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:220px;}
.tablewrap{overflow-x:auto;border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#faf9fe;color:var(--muted);font-weight:700;font-size:12px;}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
.tag.ok{background:#dcfce7;color:#166534;} .tag.warn{background:#fef3c7;color:#92400e;}
.tag.bad{background:#fee2e2;color:#991b1b;} .tag.info{background:#dbeafe;color:#1e40af;}
.tag.mut{background:#eef0f4;color:#555;} .tag.pur{background:var(--accent-soft);color:var(--accent);}
.board{display:grid;gap:14px;grid-template-columns:repeat(4,1fr);min-width:640px;}
.col{background:#f3f1fb;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.col-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;padding:4px 6px 10px;}
.col-h .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.tk:last-child{margin-bottom:0;}
.tk .tid{font-size:11px;color:var(--accent);font-weight:800;}
.tk .tt{font-size:13px;font-weight:700;margin:3px 0 6px;}
.tk .tm{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tk .bar{height:5px;border-radius:99px;background:#eee;margin-top:8px;overflow:hidden;}
.tk .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:11px;border:1px solid var(--line);margin-bottom:10px;background:#fff;}
.alert:last-child{margin-bottom:0;}
.alert .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:20px;}
.alert.bad .ic{background:#fee2e2;color:var(--bad);} .alert.warn .ic{background:#fef3c7;color:var(--warn);}
.alert.info .ic{background:#dbeafe;color:var(--info);}
.alert .body{min-width:0;flex:1;}
.alert .tt{font-weight:700;font-size:14px;}
.alert .ds{font-size:12px;color:var(--muted);margin-top:2px;}
.alert .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
.srccard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;min-width:0;}
.srccard .top{display:flex;align-items:center;gap:10px;}
.srccard .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
.srccard .nm{font-weight:800;font-size:14px;}
.srccard .st{font-size:11px;color:var(--muted);}
.metric-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px dashed var(--line);}
.metric-row:first-of-type{border-top:none;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl .ev.done .dot{background:var(--accent);} .tl .ev.bad .dot{border-color:var(--bad);}
.tl .th{font-weight:700;font-size:13px;}
.tl .ts{font-size:11px;color:var(--muted);}
.tl .tb{font-size:12px;color:#444;margin-top:3px;}
.tracepath{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0;}
.node{flex:0 0 auto;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;position:relative;}
.node + .node{margin-left:34px;}
.node + .node::before{content:"→";position:absolute;left:-27px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:800;font-size:18px;}
.node .n1{font-size:11px;color:var(--muted);}
.node .n2{font-weight:800;font-size:14px;margin:2px 0;}
.node .n3{font-size:11px;}
.rev{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;align-items:flex-start;}
.rev:last-child{margin-bottom:0;}
.rev .av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;}
.rev .rb{min-width:0;flex:1;}
.rev .rn{font-weight:700;font-size:13px;}
.rev .rr{font-size:11px;color:var(--muted);}
.rev .rc{font-size:13px;margin-top:5px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block;}
.spacer{height:14px;}
.progline{height:8px;border-radius:99px;background:#ece8f7;overflow:hidden;margin-top:6px;}
.progline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.mini-stat{display:flex;gap:16px;flex-wrap:wrap;}
.mini-stat div{min-width:0;}
.mini-stat .ms-v{font-size:20px;font-weight:900;}
.mini-stat .ms-l{font-size:11px;color:var(--muted);}
@media(max-width:560px){
  .nav button span.lbl{display:none;}
  .nav button{padding:8px 10px;}
  .brand .t2{display:none;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo ms">shield</div>
      <div>
        <div class="t1">品質戰情室</div>
        <div class="t2">Quality Dashboard / BI · QMS 品質管理系統</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-i="0" onclick="show(0)"><span class="ms">dashboard</span><span class="lbl">戰情看板</span></button>
      <button data-i="1" onclick="show(1)"><span class="ms">account_tree</span><span class="lbl">數據整合</span></button>
      <button data-i="2" onclick="show(2)"><span class="ms">warning</span><span class="lbl">異常預警</span></button>
      <button data-i="3" onclick="show(3)"><span class="ms">monitoring</span><span class="lbl">SPC 管制</span></button>
      <button data-i="4" onclick="show(4)"><span class="ms">history</span><span class="lbl">批次追溯</span></button>
      <button data-i="5" onclick="show(5)"><span class="ms">fact_check</span><span class="lbl">管理審查</span></button>
    </nav>
  </div>
</div>
<main id="app"></main>

<script>
"use strict";
var app = document.getElementById("app");
var charts = [];
function disposeCharts(){
  for(var k=0;k<charts.length;k++){ try{ charts[k].dispose(); }catch(e){} }
  charts = [];
}
function mkChart(id, opt){
  var el = document.getElementById(id);
  if(!el) return;
  var c = echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}

/* ===================== SCREEN 0 : 品質戰情看板 ===================== */
function s0(){
  var kpis=[
    {l:"整體良率 FPY",v:"97.4%",d:"▲ 1.2%",c:"up",cls:"ok"},
    {l:"開放異常 (NCR)",v:"38",d:"▲ 5 件待處理",c:"down",cls:"warn"},
    {l:"客訴平均關案",v:"9.2 天",d:"▼ 較上季 -3.1",c:"up",cls:""},
    {l:"批號追溯時間",v:"14 分",d:"▼ -177 分",c:"up",cls:""}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    kh+='<div class="kpi '+k.cls+'"><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div><div class="d '+k.c+'">'+k.d+'</div></div>';
  }
  var board=[
    {t:"待判定",items:[
      {id:"NCR-2411",tt:"外殼噴漆色差超標",m:["A2 產線","期限 今日"],p:20},
      {id:"NCR-2415",tt:"進料尺寸 OOS",m:["來料檢","高優先"],p:10}
    ]},
    {t:"原因分析",items:[
      {id:"NCR-2402",tt:"焊點虛焊率上升",m:["SMT-3","品保 王"],p:55},
      {id:"NCR-2398",tt:"標籤批號不符",m:["終檢","品保 李"],p:60}
    ]},
    {t:"改善驗證",items:[
      {id:"NCR-2377",tt:"注塑縮水改善",m:["模具課","驗證中"],p:80},
      {id:"NCR-2381",tt:"CAPA 治具更新",m:["工程部","待簽核"],p:75}
    ]},
    {t:"已關閉",items:[
      {id:"NCR-2350",tt:"包裝破損客訴",m:["物流","已結案"],p:100},
      {id:"NCR-2344",tt:"扭力不足",m:["組裝","已驗證"],p:100}
    ]}
  ];
  var bh="";
  for(var b=0;b<board.length;b++){var col=board[b];
    bh+='<div class="col"><div class="col-h"><span>'+col.t+'</span><span class="cnt">'+col.items.length+'</span></div>';
    for(var j=0;j<col.items.length;j++){var it=col.items[j];
      var mh="";for(var mi=0;mi<it.m.length;mi++){mh+='<span>'+it.m[mi]+'</span>';}
      bh+='<div class="tk"><div class="tid">'+it.id+'</div><div class="tt">'+it.tt+'</div><div class="tm">'+mh+'</div><div class="bar"><i style="width:'+it.p+'%"></i></div></div>';
    }
    bh+='</div>';
  }
  return ''+
  '<div class="screen-head"><h1>品質戰情看板</h1><span class="pill">高階主管視角</span><p>全廠品質 KPI 即時彙整，一眼掌握該關注的重點。</p></div>'+
  '<div class="grid g-kpi">'+kh+'</div>'+
  '<div class="spacer"></div>'+
  '<div class="grid g-2">'+
    '<div class="card"><h3><span class="ms">trending_up</span>改善驗證率趨勢（近 6 週）</h3><div class="chart" id="c0a"></div></div>'+
    '<div class="card"><h3><span class="ms">donut_small</span>異常類型分布</h3><div class="chart" id="c0b"></div></div>'+
  '</div>'+
  '<div class="spacer"></div>'+
  '<div class="card"><h3><span class="ms">view_kanban</span>品質案件戰情看板（NCR 流轉）</h3><div style="overflow-x:auto"><div class="board">'+bh+'</div></div></div>';
}
function d0(){
  mkChart("c0a",{
    grid:{left:38,right:14,top:24,bottom:26},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLine:{lineStyle:{color:"#ccc"}}},
    yAxis:{type:"value",min:60,max:100,axisLabel:{formatter:"{value}%"},splitLine:{lineStyle:{color:"#eee"}}},
    series:[{type:"line",smooth:true,data:[67,72,77,82,87,92],areaStyle:{color:"rgba(109,40,217,.14)"},lineStyle:{color:"#6d28d9",width:3},itemStyle:{color:"#6d28d9"},symbolSize:7}]
  });
  mkChart("c0b",{
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["42%","68%"],center:["50%","44%"],avoidLabelOverlap:true,label:{show:false},
      data:[
        {value:14,name:"規格超差",itemStyle:{color:"#6d28d9"}},
        {value:9,name:"客戶抱怨",itemStyle:{color:"#8b5cf6"}},
        {value:7,name:"製程異常",itemStyle:{color:"#a78bfa"}},
        {value:5,name:"來料不良",itemStyle:{color:"#c4b5fd"}},
        {value:3,name:"標籤/包裝",itemStyle:{color:"#ddd6fe"}}
      ]}]
  });
}

/* ===================== SCREEN 1 : 數據源整合 ===================== */
function s1(){
  var src=[
    {ico:"fact_check",nm:"QMS 品質管理",st:"每 5 分鐘同步 · 正常",rows:[["今日筆數","1,842"],["延遲","0 秒"],["欄位對齊","100%"]]},
    {ico:"monitoring",nm:"SPC 製程數據",st:"即時串流 · 正常",rows:[["取樣站","24 站"],["今日樣本","9,310"],["缺漏率","0.3%"]]},
    {ico:"warning",nm:"NCR 異常通報",st:"事件觸發 · 正常",rows:[["今日通報","57"],["待清洗","3"],["對應率","99.2%"]]}
  ];
  var sh="";
  for(var i=0;i<src.length;i++){var s=src[i];
    var rh="";for(var r=0;r<s.rows.length;r++){rh+='<div class="metric-row"><span class="sub">'+s.rows[r][0]+'</span><b>'+s.rows[r][1]+'</b></div>';}
    sh+='<div class="srccard"><div class="top"><div class="ico ms">'+s.ico+'</div><div><div class="nm">'+s.nm+'</div><div class="st">'+s.st+'</div></div></div><div class="spacer" style="height:8px"></div>'+rh+'</div>';
  }
  var jobs=[
    ["09:42","QMS 全量同步","1,842 筆","ok","成功"],
    ["09:40","SPC 增量串流","+312 樣本","ok","成功"],
    ["09:35","NCR 事件匯入","57 筆","ok","成功"],
    ["09:30","欄位映射校驗","本體/批號/工站","warn","3 筆待人工確認"],
    ["09:15","重複資料去重","-118 筆","ok","成功"]
  ];
  var jh="";
  for(var j=0;j<jobs.length;j++){var jo=jobs[j];
    jh+='<tr><td>'+jo[0]+'</td><td>'+jo[1]+'</td><td>'+jo[2]+'</td><td><span class="tag '+jo[3]+'">'+jo[4]+'</span></td></tr>';
  }
  return ''+
  '<div class="screen-head"><h1>數據源整合</h1><span class="pill">製程工程部</span><p>把散落於 QMS、SPC、NCR 的品質數據匯流清洗，建立單一可信資料來源。</p></div>'+
  '<div class="grid g-src">'+sh+'</div>'+
  '<div class="spacer"></div>'+
  '<div class="grid g-2">'+
    '<div class="card"><h3><span class="ms">sync</span>各來源每小時匯入量</h3><div class="chart" id="c1a"></div></div>'+
    '<div class="card"><h3><span class="ms">verified</span>資料品質健康度</h3>'+
      '<div class="mini-stat" style="margin-bottom:12px"><div><div class="ms-v" style="color:var(--ok)">99.4%</div><div class="ms-l">整合成功率</div></div>'+
      '<div><div class="ms-v">3</div><div class="ms-l">待清洗筆數</div></div>'+
      '<div><div class="ms-v">0.3%</div><div class="ms-l">缺漏率</div></div></div>'+
      '<div class="sub">完整度</div><div class="progline"><i style="width:99%"></i></div>'+
      '<div class="sub" style="margin-top:10px">一致性</div><div class="progline"><i style="width:96%"></i></div>'+
      '<div class="sub" style="margin-top:10px">及時性</div><div class="progline"><i style="width:100%"></i></div>'+
    '</div>'+
  '</div>'+
  '<div class="spacer"></div>'+
  '<div class="card"><h3><span class="ms">receipt_long</span>ETL 匯入作業紀錄</h3><div class="tablewrap"><table>'+
    '<thead><tr><th>時間</th><th>作業</th><th>結果量</th><th>狀態</th></tr></thead><tbody>'+jh+'</tbody></table></div></div>';
}
function d1(){
  mkChart("c1a",{
    grid:{left:40,right:14,top:30,bottom:26},
    tooltip:{trigger:"axis"},
    legend:{top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["05","06","07","08","09","10"],axisLine:{lineStyle:{color:"#ccc"}}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#eee"}}},

  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("active", (+btns[b].getAttribute("data-i"))===i);
  }

}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
