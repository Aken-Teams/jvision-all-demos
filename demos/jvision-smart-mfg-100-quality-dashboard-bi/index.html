<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>企業品質數據戰情室</title>
<meta name="description" content="從異常到改善的品質閉環與追溯稽核"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#2563EB;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.mono,.kpi .v,.tk .tid,.node .n2,.tl .ts,td:first-child,.mini-stat .ms-v{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 4px 18px rgba(15,23,42,.05);
  backdrop-filter:blur(14px);
}
.topbar::before{
  content:"";
  display:block;
  height:4px;
  background:linear-gradient(90deg,var(--color-primary) 0 72%,var(--color-accent) 72%);
}
.topbar-inner{
  max-width:1440px;
  min-height:72px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.brand .logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:7px;
  box-shadow:4px 4px 0 #BFDBFE;
  font-size:23px;
}
.brand .t1{
  color:#0F172A;
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}
.brand .t2{
  color:var(--color-muted-foreground);
  font:500 10px/1.45 "Fira Code",monospace;
  letter-spacing:.02em;
  white-space:nowrap;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:3px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:40px;
  padding:8px 11px;
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  color:#334155;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{color:var(--color-primary);background:#EFF6FF;border-color:#BFDBFE}
.nav button:active{transform:translateY(1px)}
.nav button.active{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.nav button .ms{font-size:18px}
main{max-width:1440px;margin:0 auto;padding:28px 24px 64px}
.screen-head{
  position:relative;
  min-height:112px;
  margin-bottom:20px;
  padding:22px 24px 20px 28px;
  display:grid;
  grid-template-columns:auto 1fr;
  align-content:center;
  align-items:center;
  gap:5px 14px;
  overflow:hidden;
  background:linear-gradient(105deg,#0F172A,#172554);
  color:#fff;
  border-radius:8px;
  box-shadow:var(--shadow);
}
.screen-head::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:6px;
  background:var(--color-accent);
}
.screen-head::after{
  content:"QUALITY / CONTROL / INTELLIGENCE";
  position:absolute;
  right:22px;
  bottom:14px;
  color:rgba(255,255,255,.08);
  font:700 23px/1 "Fira Code",monospace;
  letter-spacing:.08em;
  pointer-events:none;
}
.screen-head h1{
  grid-column:1;
  margin:0;
  font-size:24px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:.04em;
}
.screen-head p{
  grid-column:1/-1;
  max-width:760px;
  margin:4px 0 0;
  color:#CBD5E1;
  font-size:13px;
}
.pill{
  position:relative;
  z-index:1;
  justify-self:start;
  padding:4px 9px;
  color:#FFEDD5;
  background:rgba(234,88,12,.2);
  border:1px solid rgba(251,146,60,.55);
  border-radius:999px;
  font:600 10px/1.3 "Fira Code",monospace;
  letter-spacing:.03em;
}
.grid{display:grid;gap:12px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3,.g-src{grid-template-columns:repeat(3,minmax(0,1fr))}
.card,.kpi,.srccard{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:8px;
  box-shadow:var(--shadow);
}
.card{padding:17px}
.card h3{
  margin:0 0 14px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#0F172A;
  border-bottom:1px solid var(--color-border);
  font-size:14px;
  font-weight:700;
  letter-spacing:.015em;
}
.card h3 .ms{color:var(--color-primary);font-size:19px}
.sub{color:var(--color-muted-foreground);font-size:12px;font-weight:500}
.kpi{
  position:relative;
  min-height:126px;
  padding:17px 17px 15px;
  overflow:hidden;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi:hover{
  border-color:#93C5FD;
  box-shadow:0 8px 22px rgba(37,99,235,.1);
  transform:translateY(-2px);
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--color-primary);
}
.kpi::after{
  content:"";
  position:absolute;
  right:13px;
  top:13px;
  width:7px;
  height:7px;
  background:var(--color-primary);
  border-radius:50%;
  box-shadow:0 0 0 4px #DBEAFE;
}
.kpi.ok::before,.kpi.ok::after{background:var(--ok)}
.kpi.ok::after{box-shadow:0 0 0 4px #DCFCE7}
.kpi.warn::before,.kpi.warn::after{background:var(--warn)}
.kpi.warn::after{box-shadow:0 0 0 4px #FEF3C7}
.kpi.bad::before,.kpi.bad::after{background:var(--bad)}
.kpi.bad::after{box-shadow:0 0 0 4px #FEE2E2}
.kpi .l{
  padding-right:20px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
}
.kpi .v{
  margin-top:8px;
  color:#0F172A;
  font-size:25px;
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.04em;
}
.kpi .d{margin-top:7px;color:#475569;font-size:11px;font-weight:600}
.kpi .d.up{color:#166534}
.kpi .d.down{color:#B91C1C}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.tablewrap{
  overflow-x:auto;
  border:1px solid var(--color-border);
  border-radius:6px;
}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{
  padding:10px 12px;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  white-space:nowrap;
}
th{
  color:#334155;
  background:#F1F5F9;
  font-size:11px;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:none;
}
td{color:#334155}
td:last-child:not(:first-child),th:last-child:not(:first-child){text-align:right}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F8FAFC}
tbody tr:last-child td{border-bottom:0}
.tag{
  display:inline-flex;
  min-height:22px;
  padding:3px 8px;
  align-items:center;
  gap:5px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1;
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.tag.warn{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.tag.bad{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.tag.info{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.tag.mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.tag.pur{color:#1D4ED8;background:#EFF6FF;border-color:#BFDBFE}
.board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;min-width:760px}
.col{min-width:0;padding:9px;background:#F8FAFC;border:1px solid var(--color-border);border-radius:7px}
.col-h{
  padding:3px 3px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#334155;
  font-size:12px;
  font-weight:700;
}
.col-h .cnt{
  min-width:24px;
  padding:2px 7px;
  color:#334155;
  background:#fff;
  border:1px solid var(--color-border);
  border-radius:999px;
  font:600 10px/1.3 "Fira Code",monospace;
  text-align:center;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary);
  border-radius:6px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.tk:hover{border-color:#93C5FD;box-shadow:0 5px 14px rgba(37,99,235,.08);transform:translateY(-1px)}
.tk:last-child{margin-bottom:0}
.tk .tid{color:var(--color-primary);font-size:10px;font-weight:700}
.tk .tt{margin:4px 0 7px;color:#1E293B;font-size:12px;font-weight:700}
.tk .tm{display:flex;gap:7px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:10px}
.tk .bar,.progline{
  height:6px;
  overflow:hidden;
  background:#E2E8F0;
  border-radius:2px;
}
.tk .bar{margin-top:9px}
.tk .bar i,.progline i{
  display:block;
  height:100%;
  background:var(--color-primary);
}
.alert{
  position:relative;
  margin-bottom:9px;
  padding:12px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  background:#fff;
  border:1px solid var(--color-border);
  border-radius:7px;
}
.alert:last-child{margin-bottom:0}
.alert::after{
  position:absolute;
  right:10px;
  top:10px;
  padding:2px 6px;
  border-radius:3px;
  font:700 9px/1.4 "Fira Code",monospace;
}
.alert.bad{border-left:4px solid var(--bad)}
.alert.bad::after{content:"高風險";color:#991B1B;background:#FEE2E2}
.alert.warn{border-left:4px solid var(--warn)}
.alert.warn::after{content:"需注意";color:#92400E;background:#FEF3C7}
.alert.info{border-left:4px solid var(--info)}
.alert.info::after{content:"提醒";color:#1E40AF;background:#DBEAFE}
.alert .ic{
  width:34px;
  height:34px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:5px;
  font-size:19px;
}
.alert.bad .ic{color:#B91C1C;background:#FEF2F2}
.alert.warn .ic{color:#92400E;background:#FFFBEB}
.alert.info .ic{color:#1D4ED8;background:#EFF6FF}
.alert .body{min-width:0;flex:1;padding-right:50px}
.alert .tt{color:#1E293B;font-size:13px;font-weight:700}
.alert .ds{margin-top:3px;color:var(--color-muted-foreground);font-size:11px}
.alert .meta{
  margin-top:7px;
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  color:#64748B;
  font:500 10px/1.4 "Fira Code",monospace;
}
.srccard{
  padding:15px;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.srccard:hover{border-color:#93C5FD;box-shadow:0 7px 20px rgba(37,99,235,.08)}
.srccard .top{display:flex;align-items:center;gap:10px}
.srccard .ico{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:6px;
  font-size:20px;
}
.srccard .nm{color:#0F172A;font-size:13px;font-weight:700}
.srccard .st{color:#166534;font-size:10px;font-weight:600}
.srccard .st::before{content:"●";margin-right:5px}
.metric-row{
  padding:6px 0;
  display:flex;
  justify-content:space-between;
  border-top:1px dashed var(--color-border);
  font-size:11px;
}
.metric-row b{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.metric-row:first-of-type{border-top:0}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:2px;background:#CBD5E1}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{
  position:absolute;
  left:-25px;
  top:2px;
  width:14px;
  height:14px;
  background:#fff;
  border:3px solid var(--color-primary);
  border-radius:50%;
}
.tl .ev.done .dot{background:var(--color-primary)}
.tl .ev.bad .dot{border-color:var(--bad);background:#FEE2E2}
.tl .ev.bad::after{
  content:"異常";
  display:inline-block;
  margin-top:5px;
  padding:2px 6px;
  color:#991B1B;
  background:#FEE2E2;
  border-radius:3px;
  font-size:9px;
  font-weight:700;
}
.tl .th{color:#1E293B;font-size:12px;font-weight:700}
.tl .ts{color:#64748B;font-size:10px}
.tl .tb{margin-top:3px;color:#475569;font-size:11px}
.tracepath{padding:4px 1px;display:flex;align-items:stretch;overflow-x:auto}
.node{
  position:relative;
  min-width:130px;
  flex:0 0 auto;
  padding:11px 12px;
  background:#fff;
  border:1px solid #CBD5E1;
  border-top:3px solid var(--color-primary);
  border-radius:6px;
}
.node+.node{margin-left:34px}
.node+.node::before{
  content:"→";
  position:absolute;
  left:-26px;
  top:50%;
  color:var(--color-primary);
  font:700 17px/1 "Fira Code",monospace;
  transform:translateY(-50%);
}
.node .n1{color:var(--color-muted-foreground);font-size:10px}
.node .n2{margin:2px 0;color:#0F172A;font-size:12px;font-weight:700}
.node .n3{color:#475569;font-size:10px}
.rev{
  margin-bottom:9px;
  padding:11px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:#fff;
  border:1px solid var(--color-border);
  border-radius:7px;
}
.rev:last-child{margin-bottom:0}
.rev .av{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:5px;
  font-weight:700;
}
.rev .rb{min-width:0;flex:1}
.rev .rn{color:#1E293B;font-size:12px;font-weight:700}
.rev .rr{color:#64748B;font:500 9px/1.5 "Fira Code",monospace}
.rev .rc{margin-top:5px;color:#475569;font-size:11px}
.legend{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;color:#475569;font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dotc{width:9px;height:9px;display:inline-block;border-radius:2px}
.spacer{height:12px}
.progline{margin-top:6px}
.mini-stat{display:flex;gap:22px;flex-wrap:wrap}
.mini-stat div{min-width:0}
.mini-stat .ms-v{color:#0F172A;font-size:19px;font-weight:700}
.mini-stat .ms-l{color:var(--color-muted-foreground);font-size:10px}
@media(max-width:1024px){
  .topbar-inner{padding-inline:18px;gap:14px}
  main{padding-inline:18px}
  .brand .t2{display:none}
  .nav button{padding-inline:9px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .topbar{position:relative}
  .topbar-inner{padding:10px 14px;display:block}
  .brand{margin-bottom:10px}
  .nav{margin:0;padding-bottom:2px}
  main{padding:16px 14px 48px}
  .screen-head{min-height:126px;padding:20px}
  .screen-head::after{font-size:14px}
  .g-2,.g-2e,.g-3,.g-src{grid-template-columns:1fr}
}
@media(max-width:480px){
  .brand .logo{width:38px;height:38px}
  .brand .t1{font-size:14px}
  .nav button{min-width:42px;justify-content:center}
  .nav button .lbl{display:none}
  .screen-head{display:block}
  .screen-head h1{font-size:21px}
  .screen-head .pill{display:inline-flex;margin-top:10px}
  .screen-head p{margin-top:9px}
  .g-kpi{grid-template-columns:1fr}
  .kpi{min-height:112px}
  .card{padding:14px}
  .alert .body{padding-right:0}
  .alert::after{position:static;align-self:flex-start;white-space:nowrap}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo ms" aria-hidden="true">shield</div>
      <div>
        <div class="t1">企業品質數據戰情室</div>
        <div class="t2">QUALITY DASHBOARD / BI · QMS 品質管理系統</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能">
      <button type="button" data-i="0" onclick="show(0)"><span class="ms" aria-hidden="true">dashboard</span><span class="lbl">戰情看板</span></button>
      <button type="button" data-i="1" onclick="show(1)"><span class="ms" aria-hidden="true">account_tree</span><span class="lbl">數據整合</span></button>
      <button type="button" data-i="2" onclick="show(2)"><span class="ms" aria-hidden="true">warning</span><span class="lbl">異常預警</span></button>
      <button type="button" data-i="3" onclick="show(3)"><span class="ms" aria-hidden="true">monitoring</span><span class="lbl">SPC 管制</span></button>
      <button type="button" data-i="4" onclick="show(4)"><span class="ms" aria-hidden="true">history</span><span class="lbl">批次追溯</span></button>
      <button type="button" data-i="5" onclick="show(5)"><span class="ms" aria-hidden="true">fact_check</span><span class="lbl">管理審查</span></button>
    </nav>
  </div>
</header>
<main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app"),charts=[];

var screens=[s0,s1,s2,s3,s4,s5],draws=[d0,d1,d2,d3,d4,d5];
function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]"),b;
  for(b=0;b<btns.length;b++){
    var active=(+btns[b].getAttribute("data-i"))===i;
    btns[b].classList.toggle("active",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  app.innerHTML=screens[i]();
  void app.offsetHeight;
  draws[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++)try{charts[i].resize()}catch(e){}});
fromHash();
