<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>企業員工與人事管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="出勤、薪資、招募到績效的人資全流程" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --acc:var(--color-primary);
  --acc2:var(--color-secondary);
  --acc-soft:#CCFBF1;
  --bg:var(--color-background);
  --card:var(--color-card);
  --ok:#047857;
  --warn:#A34F00;
  --bad:var(--color-destructive);
  --radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--bg);
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC","PingFang TC",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.shell{display:flex;min-height:100vh;align-items:stretch}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  gap:7px;
  width:258px;
  height:100vh;
  padding:22px 16px 16px;
  overflow-y:auto;
  background:#fff;
  border-right:2px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:2px 6px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:7px;
}
.brand .logo{
  display:grid;
  place-items:center;
  flex:none;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--acc);
  border:2px solid #115E59;
  border-radius:6px;
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b,.htitle b,.ch b{
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  letter-spacing:.02em;
}
.brand b{display:block;font-size:17px;font-weight:700}
.brand span{display:block;margin-top:1px;color:var(--muted);font-size:12px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-weight:600;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
  white-space:nowrap;
}
.nav button:hover{color:#115E59;background:#F0FDFA;border-color:var(--line)}
.nav button.on{
  color:#fff;
  background:var(--acc);
  border-color:#115E59;
}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav .tag{
  margin-left:auto;
  padding:2px 8px;
  color:#115E59;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  font-family:"Crimson Pro",monospace;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.nav button.on .tag{color:#000;background:var(--color-secondary);border-color:#99F6E4}
.side .foot{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:auto;
  padding:15px 7px 3px;
  border-top:1px solid var(--line);
}
.av{
  display:grid;
  place-items:center;
  flex:none;
  width:36px;
  height:36px;
  color:#fff;
  background:#115E59;
  border-radius:50%;
  font-weight:700;
}
.side .foot b{font-size:14px}
.side .foot small{display:block;color:var(--muted);font-size:12px}
.main{display:flex;flex:1;flex-direction:column;min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  min-height:78px;
  padding:14px 28px;
  background:#fff;
  border-bottom:2px solid var(--line);
}
.htitle b{display:block;font-size:23px;font-weight:700;line-height:1.1}
.htitle small{color:var(--muted);font-size:13px;font-weight:600}
.spacer{flex:1}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 12px;
  color:#115E59;
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:999px;
  font-family:"Crimson Pro",monospace;
  font-size:13px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.pill.live::before{
  content:"";
  width:8px;
  height:8px;
  background:#047857;
  border:2px solid #A7F3D0;
  border-radius:50%;
  animation:pulse 1.8s ease-out infinite;
}
@keyframes pulse{50%{opacity:.45}}
.wrap{min-width:0;padding:22px 28px 44px}
#view>*{animation:reveal .36s ease both}
#view>*:nth-child(2){animation-delay:.05s}
#view>*:nth-child(3){animation-delay:.1s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card{
  min-width:0;
  padding:17px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ch b{font-size:17px;font-weight:700}
.ch>.material-symbols-outlined{color:#115E59;font-size:19px}
.ch small{color:var(--muted);font-size:12px;font-weight:600}
.ch .r{margin-left:auto}
.kpi{
  position:relative;
  display:grid;
  grid-template-columns:40px 1fr;
  grid-template-areas:"ic v" "ic l" "ic d";
  gap:3px 12px;
  padding-top:20px;
  border-top:4px solid var(--acc);
}
.kpi .ic{
  grid-area:ic;
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  color:#115E59;
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:6px;
}
.kpi .v{
  grid-area:v;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:28px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
  line-height:1;
}
.kpi .l{grid-area:l;color:var(--muted);font-size:13px;font-weight:600}
.kpi .d,.kpi .mini{grid-area:d;font-size:12px;font-weight:600}
.up{color:#047857}.dn{color:var(--bad)}
.chart{width:100%;height:260px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  padding:11px 14px;
  color:#334155;
  background:var(--color-muted);
  border-bottom:2px solid var(--line);
  font-size:12px;
  font-weight:600;
  letter-spacing:.03em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:11px 14px;
  border-bottom:1px solid #CDEBE8;
  vertical-align:middle;
  white-space:nowrap;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
.num{
  font-family:"Crimson Pro","SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums;
  text-align:right;
}
.mono,.who small{
  font-family:"Crimson Pro","SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.av2{
  display:inline-grid;
  place-items:center;
  flex:none;
  width:29px;
  height:29px;
  color:#fff;
  border:1px solid rgba(0,0,0,.18);
  border-radius:50%;
  font-size:11px;
  font-weight:700;
}
.who{display:flex;align-items:center;gap:9px}
.who b{font-size:14px;font-weight:600}
.who small{display:block;color:var(--muted);font-size:11px}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
}
.badge::before{
  content:"";
  width:6px;
  height:6px;
  background:currentColor;
  border-radius:50%;
}
.b-ok{color:#065F46;background:#ECFDF5}
.b-warn{color:#92400E;background:#FFFBEB}
.b-bad{color:#B91C1C;background:#FEF2F2}
.b-info{color:#115E59;background:#F0FDFA}
.b-mut{color:#475569;background:#F1F5F9}
.bar{height:8px;overflow:hidden;background:#DDE9E8;border:1px solid #B9D8D5;border-radius:999px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{padding-bottom:3px;color:var(--muted);font-size:11px;font-weight:600;text-align:center}
.cal .cell{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-width:0;
  padding:6px;
  aspect-ratio:1;
  border:1px solid var(--line);
  border-radius:5px;
  font-size:11px;
}
.cal .cell .n{font-size:12px;font-weight:700}
.cal .cell .t{font-size:10px;font-weight:600}
.cal .l0{color:#64748B;background:#F8FAFC}
.cal .l1{color:#115E59;background:#CCFBF1}
.cal .l2{color:#134E4A;background:#99F6E4}
.cal .l3{color:#073B37;background:#5EEAD4}
.cal .l4{color:#fff;background:#0F766E}
.cal .exc{color:#991B1B!important;background:#FEE2E2!important;border:2px dashed #DC2626!important}
.board{display:grid;grid-template-columns:repeat(5,minmax(185px,1fr));gap:11px}
.col{min-width:0;padding:10px;background:#F0FDFA;border:1px solid var(--line);border-radius:6px}
.colh{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:13px;font-weight:600}
.colh .ct{
  margin-left:auto;
  padding:1px 8px;
  color:#334155;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.cc{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid #99DCD5;
  border-left:4px solid var(--acc);
  border-radius:5px;
  transition:background-color .18s ease,border-color .18s ease;
}
.cc:hover{background:#F0FDFA;border-color:#0D9488}
.cc:last-child{margin-bottom:0}
.cc .nm{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.cc .rl{margin:5px 0 8px;color:var(--muted);font-size:11px}
.cc .mt{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}
.cc .stars{color:#A34F00;letter-spacing:-1px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:5px}
.matrix .axl{
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
}
.matrix .axb{grid-column:2/5;padding-top:5px;color:var(--muted);font-size:11px;font-weight:600;text-align:center}
.matrix .box{position:relative;min-height:82px;padding:9px;border:1px solid var(--line);border-radius:5px}
.matrix .box .bl{margin-bottom:5px;font-size:11px;font-weight:600}
.matrix .box .cnt{position:absolute;top:8px;right:9px;font-weight:700;font-variant-numeric:tabular-nums}
.mx-hi{color:#115E59;background:#CCFBF1;border-width:2px!important}
.mx-mid{color:#134E4A;background:#F0FDFA}
.mx-lo{color:#475569;background:#F8FAFC}
.chip{display:inline-block;margin:2px 3px 0 0;padding:1px 7px;background:#fff;border:1px solid #7DD3C7;border-radius:999px;font-size:10px;font-weight:600}
.org{display:flex;flex-direction:column;gap:7px}
.org .node{display:flex;align-items:center;gap:10px;padding:9px 11px;background:#F0FDFA;border:1px solid var(--line);border-radius:5px}
.org .node.lv2{margin-left:22px;background:#fff}
.org .node.lv3{margin-left:44px;background:#fff}
.org .node .dot{flex:none;width:9px;height:9px;border:2px solid rgba(0,0,0,.15);border-radius:50%}
.org .node b{font-size:14px;font-weight:600}
.org .node small{display:block;color:var(--muted);font-size:11px}
.org .node .cnt{margin-left:auto;padding:2px 9px;color:#115E59;background:#CCFBF1;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600}
.pay{display:flex;flex-direction:column}
.payrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #8FD8D0;font-size:14px}
.payrow span{font-variant-numeric:tabular-nums}
.payrow.neg span{color:#B91C1C}
.payrow.tot{margin-top:4px;padding-top:12px;border-top:2px solid var(--ink);border-bottom:0;font-size:17px}
.payrow.tot span{color:#0F766E;font-size:21px;font-weight:700}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tli{position:relative;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;top:3px;left:-23px;width:13px;height:13px;background:#fff;border:3px solid var(--acc);border-radius:50%}
.tli.w::before{border-color:#A34F00}
.tli.b::before{border-color:#DC2626}
.tli .tt{font-size:14px;font-weight:700}
.tli .tm{margin:2px 0 4px;color:var(--muted);font-family:"Crimson Pro",monospace;font-size:11px;font-variant-numeric:tabular-nums}
.tli .td{color:#334155;font-size:13px;line-height:1.55}
.ai-hero{color:#fff;background:#0F766E;border:2px solid #115E59}
.ai-hero .ch b,.ai-hero .ch .material-symbols-outlined{color:#fff}
.ai-hero .ch small{color:#D5FAF5}
.ai-hero .big{margin:4px 0 12px;font-size:16px;font-weight:600;line-height:1.75}
.ai-hero .big em{padding:1px 7px;color:#17200A;background:#FBBF24;border-radius:4px;font-style:normal;font-weight:700}
.ai-hero .badge{color:#fff!important;background:#115E59!important;border-color:#5EEAD4!important}
.act{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;padding:11px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:5px}
.act:last-child{margin-bottom:0}
.act .ai{display:grid;place-items:center;flex:none;width:34px;height:34px;color:#115E59;background:#CCFBF1;border:1px solid var(--line);border-radius:5px}
.act .at{font-size:13px;font-weight:700}
.act .ad{margin-top:2px;color:var(--muted);font-size:12px;line-height:1.5}
.act .btn,.action-btn{
  flex:none;
  align-self:center;
  min-height:36px;
  padding:6px 12px;
  color:#fff;
  background:#0F766E;
  border:1px solid #115E59;
  border-radius:5px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease;
}
.act .btn{margin-left:auto}
.act .btn:hover,.action-btn:hover{color:#000;background:#2DD4BF}
.progwrap{display:flex;align-items:center;gap:9px;min-width:130px}
.progwrap small{flex:none;width:35px;color:var(--muted);font-size:11px;font-weight:600;text-align:right}
.mini{color:var(--muted);font-size:12px}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{
    position:static;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:center;
    width:100%;
    height:auto;
    padding:11px 15px;
    border-right:0;
    border-bottom:2px solid var(--line);
  }
  .brand{margin:0 8px 0 0;padding:0 12px 0 0;border:0;border-right:1px solid var(--line)}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .nav .tag,.side .foot{display:none}
  .top{top:0}
}
@media(max-width:768px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .wrap{padding:17px}
  .top{padding:13px 17px}
}
@media(max-width:520px){
  .brand div:last-child{display:none}
  .nav{justify-content:space-between}
  .nav button{justify-content:center;min-width:44px;padding:9px}
  .nav button .lbl{display:none}
  .top{position:static}
  .top .spacer{display:none}
  .htitle{width:100%}
  .card{padding:14px}
  .ch{align-items:flex-start;flex-wrap:wrap}
  .ch .r{width:100%;margin-left:28px}
  .org .node.lv2{margin-left:11px}
  .org .node.lv3{margin-left:22px}
  .act{flex-wrap:wrap}
  .act .btn{width:100%;margin-left:44px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  #view>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">diversity_3</span></div>
      <div><b>Jvision HRIS</b><span>企業員工與人事管理系統</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot">
      <div class="av" aria-hidden="true">陳</div>
      <div><b>陳靜宜</b><small>人資經理</small></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="htitle"><b id="tt">員工名冊</b><small id="ts">組織架構與人事檔案</small></div>
      <div class="spacer"></div>
      <span class="pill">2026 年 8 月</span>
      <span class="pill live">即時同步</span>
    </header>
    <div class="wrap"><div id="view" class="grid"></div></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"badge",name:"員工名冊",sub:"組織架構與人事檔案",tag:"482"},
  {icon:"fingerprint",name:"出勤差勤",sub:"打卡、請假與加班",tag:"7"},
  {icon:"payments",name:"薪資試算",sub:"薪資結構與月結試算",tag:"8月"},
  {icon:"person_search",name:"招募任用",sub:"職缺與人才庫進度",tag:"14"},
  {icon:"trending_up",name:"績效考核",sub:"OKR 與人才九宮格",tag:"Q3"},
  {icon:"smart_toy",name:"AI 人資摘要",sub:"異常偵測與建議行動",tag:"AI"}
];
var COL=["#0F766E","#0369A1","#047857","#A34F00","#7C3AED","#BE185D","#334155"];
function av(n,i){return '<span class="av2" style="background:'+COL[i%COL.length]+'">'+n.slice(-2)+'</span>'}

function buildNav(){
  document.getElementById("nav").innerHTML=MODS.map(function(m,i){
    return '<button type="button" data-i="'+i+'" onclick="show('+i+')" aria-label="'+m.name+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="tag">'+m.tag+'</span></button>'
  }).join("")
}
function show(i){
  i=Math.max(0,Math.min(i,SCR.length-1));
  if(i===cur)return;
  cur=i;
  disposeChart();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var active=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("on",active);
    btns[k].setAttribute("aria-current",active?"page":"false")
  }
  document.getElementById("tt").textContent=MODS[i].name;
  document.getElementById("ts").textContent=MODS[i].sub;
  var view=document.getElementById("view");
  view.innerHTML=SCR[i].r();
  void view.offsetHeight;
  SCR[i].d()
}
function resizeCharts(){if(chart){try{chart.resize()}catch(e){}if(chart._extra){try{chart._extra.resize()}catch(e){}}}}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",resizeCharts);
