<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人力資源資訊系統 HRIS｜Jvision 系統 Demo</title>
<meta name="description" content="出勤、薪資、招募到績效的人資全流程" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--acc:#4f46e5;--acc2:#818cf8;--acc-soft:#eef2ff;--ink:#1e1b2e;--mut:#6b7280;--line:#e7e6f0;--bg:#f5f5fb;--card:#fff;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--radius:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.shell{display:flex;min-height:100vh;align-items:stretch}
.shell>*{min-width:0}
/* sidebar */
.side{width:248px;flex:none;background:linear-gradient(180deg,#fff,#fafaff);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.32)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13.5px;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;transition:.16s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button:hover{background:var(--acc-soft);color:var(--acc)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.nav .tag{margin-left:auto;font-size:10.5px;font-weight:800;background:#fff;color:var(--acc);border-radius:20px;padding:2px 8px;border:1px solid var(--line)}
.nav button.on .tag{background:rgba(255,255,255,.24);color:#fff;border-color:transparent}
.side .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side .foot .av{width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.side .foot small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.side .foot b{font-size:12.5px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top .htitle b{font-size:18px;font-weight:800;display:block}
.top .htitle small{color:var(--mut);font-size:12px;font-weight:600}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:12px;padding:7px 13px;border-radius:20px}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.wrap{padding:22px 26px 40px;min-width:0}
/* generic */
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ch b{font-size:14.5px;font-weight:800}
.ch .material-symbols-outlined{font-size:19px;color:var(--acc)}
.ch small{color:var(--mut);font-size:11.5px;font-weight:600}
.ch .r{margin-left:auto}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.kpi .v{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.chart{width:100%;height:260px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:700;font-size:11.5px;padding:11px 14px;background:#fafaff;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafaff}
.av2{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:11px;color:#fff;flex:none}
.who{display:flex;align-items:center;gap:9px}
.who b{font-size:13px;font-weight:700}
.who small{color:var(--mut);font-size:11px;display:block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
.b-ok{background:#eafaf0;color:var(--ok)}
.b-warn{background:#fef6e7;color:#b7791f}
.b-bad{background:#fdecec;color:var(--bad)}
.b-info{background:var(--acc-soft);color:var(--acc)}
.b-mut{background:#f1f1f6;color:var(--mut)}
.bar{height:8px;border-radius:20px;background:#eee;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
/* attendance calendar heatmap */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dow{font-size:11px;font-weight:800;color:var(--mut);text-align:center;padding-bottom:2px}
.cal .cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;border:1px solid var(--line);font-size:11px;min-width:0}
.cal .cell .n{font-weight:800;font-size:12px}
.cal .cell .t{font-size:9.5px;font-weight:700;opacity:.85}
.cal .l0{background:#fafaff;color:#c0c0cf}
.cal .l1{background:#eef2ff;color:var(--acc)}
.cal .l2{background:#c7d2fe;color:#3730a3}
.cal .l3{background:#818cf8;color:#fff}
.cal .l4{background:#4f46e5;color:#fff}
.cal .exc{background:#fdecec !important;color:var(--bad) !important}
/* recruit kanban board */
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:13px}
.col{background:#fafaff;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.col .colh{display:flex;align-items:center;gap:7px;margin-bottom:11px;font-weight:800;font-size:12.5px}
.col .colh .ct{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:10.5px;padding:1px 8px;color:var(--mut)}
.cc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(30,27,46,.04)}
.cc:last-child{margin-bottom:0}
.cc .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.cc .rl{font-size:11px;color:var(--mut);font-weight:600;margin:5px 0 8px}
.cc .mt{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--mut);font-weight:700}
.cc .stars{color:var(--warn);letter-spacing:-1px}
/* 9-box talent matrix */
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:6px}
.matrix .axl{display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--mut);writing-mode:vertical-rl;transform:rotate(180deg)}
.matrix .axb{grid-column:2/5;text-align:center;font-size:10.5px;font-weight:800;color:var(--mut);padding-top:5px}
.matrix .box{border-radius:11px;padding:9px;min-height:78px;border:1px solid var(--line);position:relative}
.matrix .box .bl{font-size:10px;font-weight:800;opacity:.75;margin-bottom:5px}
.matrix .box .cnt{position:absolute;top:8px;right:9px;font-size:11px;font-weight:900}
.mx-hi{background:#eef2ff;color:#3730a3}
.mx-mid{background:#f6f7ff;color:var(--acc)}
.mx-lo{background:#fafaff;color:var(--mut)}
.chip{display:inline-block;font-size:10px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin:2px 3px 0 0}
/* org tree */
.org{display:flex;flex-direction:column;gap:8px}
.org .node{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fafaff}
.org .node.lv2{margin-left:22px;background:#fff}
.org .node.lv3{margin-left:44px;background:#fff}
.org .node .dot{width:9px;height:9px;border-radius:50%;flex:none}
.org .node b{font-size:13px;font-weight:800}
.org .node small{color:var(--mut);font-size:11px;font-weight:600}
.org .node .cnt{margin-left:auto;font-size:11px;font-weight:800;color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:2px 10px}
/* payslip */
.pay{display:flex;flex-direction:column;gap:2px}
.payrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.payrow b{font-weight:700}
.payrow.neg span{color:var(--bad)}
.payrow.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:12px;font-size:16px}
.payrow.tot b{font-weight:900}
.payrow.tot span{font-weight:900;color:var(--acc);font-size:20px}
/* ai timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tli.w::before{border-color:var(--warn)}
.tli.b::before{border-color:var(--bad)}
.tli .tt{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.tli .tm{font-size:11px;color:var(--mut);font-weight:600;margin:2px 0 4px}
.tli .td{font-size:12.5px;color:#4b4a5a;line-height:1.55}
.ai-hero{background:linear-gradient(135deg,var(--acc),#6d5ef0);color:#fff;border:0}
.ai-hero .ch b,.ai-hero .ch .material-symbols-outlined{color:#fff}
.ai-hero .ch small{color:rgba(255,255,255,.8)}
.ai-hero .big{font-size:15px;font-weight:800;line-height:1.7;margin:4px 0 10px}
.ai-hero .big em{font-style:normal;background:rgba(255,255,255,.22);border-radius:6px;padding:1px 7px;font-weight:900}
.act{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.act:last-child{margin-bottom:0}
.act .ai{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.act .at{font-weight:800;font-size:13px}
.act .ad{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.5}
.act .btn{margin-left:auto;flex:none;align-self:center;border:1px solid var(--acc);color:var(--acc);background:#fff;font:inherit;font-weight:800;font-size:11.5px;padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.progwrap{display:flex;align-items:center;gap:10px}
.progwrap small{font-size:11px;font-weight:800;color:var(--mut);width:34px;text-align:right;flex:none}
.mini{font-size:11px;color:var(--mut);font-weight:700;margin-top:3px}
.seg{display:inline-flex;background:#f1f1f6;border-radius:9px;padding:3px;gap:2px}
.seg span{font-size:11.5px;font-weight:800;color:var(--mut);padding:5px 12px;border-radius:7px}
.seg span.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* RWD */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:860px){
.side{position:static;height:auto;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
.brand{padding:0;margin-right:8px}
.nav{flex-direction:row;flex-wrap:wrap;flex:1}
.nav button{width:auto;flex:none;padding:9px 12px}
.nav .tag{display:none}
.side .foot{display:none}
.shell{flex-direction:column}
}
@media(max-width:820px){.g4,.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){
.nav button span.lbl{display:none}
.nav button{padding:9px}
.top{padding:12px 16px}.wrap{padding:16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">diversity_3</span></div>
      <div><b>Jvision HRIS</b><span>人力資源資訊系統</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="av">陳</div>
      <div><b>陳靜宜</b><small>人資經理</small></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="htitle"><b id="tt">員工名冊</b><small id="ts">組織架構與人事檔案</small></div>
      <div class="spacer"></div>
      <span class="pill">2026 年 8 月</span>
      <span class="pill live">即時同步</span>
    </div>
    <div class="wrap"><div id="view" class="grid"></div></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"badge",name:"員工名冊",sub:"組織架構與人事檔案",tag:"482"},
  {icon:"fingerprint",name:"出勤差勤",sub:"打卡、請假與加班",tag:"7"},
  {icon:"payments",name:"薪資試算",sub:"薪資結構與月結試算",tag:"8月"},
  {icon:"person_search",name:"招募任用",sub:"職缺與人才庫進度",tag:"14"},
  {icon:"trending_up",name:"績效考核",sub:"OKR 與人才九宮格",tag:"Q3"},
  {icon:"smart_toy",name:"AI 人資摘要",sub:"異常偵測與建議行動",tag:"AI"}
];
var COL=["#4f46e5","#818cf8","#22c55e","#f59e0b","#06b6d4","#ec4899","#8b5cf6"];
function av(n,i){return '<span class="av2" style="background:'+COL[i%COL.length]+'">'+n.slice(-2)+'</span>';}
function fmt(n){return (n||0).toLocaleString('en-US');}
var chart=null;
function disposeChart(){ if(chart){ if(chart._extra){ try{chart._extra.dispose();}catch(e){} } try{chart.dispose();}catch(e){} chart=null; } }

/* ---------- SCREEN 0 : 員工名冊 ---------- */
function s0(){
  var kp=[
    {ic:"groups",v:"482",l:"在職人數",d:"+6 本月",up:1},
    {ic:"person_add",v:"9",l:"本月新進",d:"+2",up:1},
    {ic:"logout",v:"3",l:"本月離職",d:"-1",up:1},
    {ic:"schedule",v:"3.8",l:"平均年資（年）",d:"+0.2",up:1}
  ];
  var org=[
    {lv:1,c:"#4f46e5",n:"總經理室",s:"陳建宏 / 總經理",cnt:482},
    {lv:2,c:"#818cf8",n:"研發中心",s:"林哲宇 / 副總",cnt:168},
    {lv:3,c:"#22c55e",n:"軟體開發部",s:"王思婷 / 協理",cnt:96},
    {lv:3,c:"#06b6d4",n:"硬體工程部",s:"張家豪 / 協理",cnt:72},
    {lv:2,c:"#f59e0b",n:"營運事業群",s:"黃雅琪 / 副總",cnt:214},
    {lv:3,c:"#ec4899",n:"業務行銷部",s:"吳承翰 / 經理",cnt:118},
    {lv:2,c:"#8b5cf6",n:"管理中心",s:"陳靜宜 / 協理",cnt:100}
  ];
  var ppl=[
    {n:"王思婷",id:"E1042",dp:"軟體開發部",ti:"前端技術主管",yr:"6.2 年",st:"在職"},
    {n:"李冠廷",id:"E1088",dp:"硬體工程部",ti:"韌體工程師",yr:"4.5 年",st:"在職"},
    {n:"周雅雯",id:"E1153",dp:"業務行銷部",ti:"行銷企劃",yr:"2.1 年",st:"在職"},
    {n:"許博丞",id:"E1201",dp:"軟體開發部",ti:"後端工程師",yr:"1.3 年",st:"試用"},
    {n:"蔡佩芸",id:"E1210",dp:"管理中心",ti:"人資專員",yr:"0.6 年",st:"試用"},
    {n:"鄭凱文",id:"E0988",dp:"營運事業群",ti:"產品經理",yr:"5.8 年",st:"在職"},
    {n:"陳美玲",id:"E1176",dp:"硬體工程部",ti:"品保工程師",yr:"3.0 年",st:"留停"}
  ];
  var stMap={"在職":"b-ok","試用":"b-info","留停":"b-warn"};
  return '<div class="grid g4" style="grid-column:1/-1">'+
    kp.map(function(k){return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="v">'+k.v+'</div><div class="l">'+k.l+'</div><div class="d up"><span class="material-symbols-outlined" style="font-size:15px">trending_up</span>'+k.d+'</div></div>';}).join('')+
  '</div>'+
  '<div class="grid g32" style="grid-column:1/-1">'+
    '<div class="card"><div class="ch"><span class="material-symbols-outlined">account_tree</span><b>組織架構</b><small class="r">7 個部門單位</small></div><div class="org">'+
      org.map(function(o){return '<div class="node lv'+o.lv+'"><span class="dot" style="background:'+o.c+'"></span><div><b>'+o.n+'</b><small>'+o.s+'</small></div><span class="cnt">'+o.cnt+' 人</span></div>';}).join('')+
    '</div></div>'+
    '<div class="card"><div class="ch"><span class="material-symbols-outlined">donut_large</span><b>部門人力分佈</b></div><div id="c0" class="chart" style="height:290px"></div></div>'+
  '</div>'+
  '<div class="card pad0" style="grid-column:1/-1"><div class="ch" style="padding:16px 18px 0"><span class="material-symbols-outlined">badge</span><b>員工名冊</b><small class="r">共 482 筆，顯示 7 筆</small></div><div style="overflow-x:auto"><table><thead><tr><th>員工</th><th>員工編號</th><th>部門</th><th>職稱</th><th>年資</th><th>狀態</th></tr></thead><tbody>'+
    ppl.map(function(p,i){return '<tr><td><div class="who">'+av(p.n,i)+'<div><b>'+p.n+'</b></div></div></td><td>'+p.id+'</td><td>'+p.dp+'</td><td>'+p.ti+'</td><td>'+p.yr+'</td><td><span class="badge '+stMap[p.st]+'">'+p.st+'</span></td></tr>';}).join('')+
  '</tbody></table></div></div>';
}
function d0(){
  chart=echarts.init(document.getElementById('c0'));
  chart.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c} 人 ({d}%)'},

var SCR=[{r:s0,d:d0},{r:s1,d:d1},{r:s2,d:d2},{r:s3,d:d3},{r:s4,d:d4},{r:s5,d:d5}];
var cur=-1;
function buildNav(){
  document.getElementById('nav').innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="tag">'+m.tag+'</span></button>';
  }).join('');
}
function show(i){
  i=Math.max(0,Math.min(i,SCR.length-1));
  if(i===cur){return;}
  cur=i;
  disposeChart();
  var btns=document.querySelectorAll('[data-i]');
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle('on',+btns[k].getAttribute('data-i')===i); }
  document.getElementById('tt').textContent=MODS[i].name;
  document.getElementById('ts').textContent=MODS[i].sub;
  var view=document.getElementById('view');
  view.innerHTML=SCR[i].r();
  void view.offsetHeight;
  SCR[i].d();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
