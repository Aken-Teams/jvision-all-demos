<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>團隊任務管理 · TeamFlow</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;--accent-soft:#eef2ff;
  --bg:#f5f6fb;--panel:#ffffff;--ink:#1e2233;--sub:#6b7080;--line:#e7e9f2;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;
  --shadow:0 1px 2px rgba(30,34,51,.04),0 8px 24px rgba(79,70,229,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.top{
  display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(79,70,229,.35);}
.logo .material-symbols-outlined{font-size:22px;}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;}
.brand p{font-size:11px;margin:0;color:var(--sub);}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);background:var(--accent-soft);padding:5px 10px;border-radius:999px;font-weight:600;}
.chip .material-symbols-outlined{font-size:15px;color:var(--accent);}
.ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#c7d2fe,#818cf8);color:#312e81;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
nav{
  display:flex;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  overflow-x:auto;flex-wrap:wrap;position:sticky;top:63px;z-index:20;
}
.navbtn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--sub);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;
  font-family:inherit;min-width:0;transition:all .15s;
}
.navbtn .material-symbols-outlined{font-size:19px;}
.navbtn:hover{background:var(--accent-soft);color:var(--accent);}
.navbtn.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28);}
.navbtn .idx{font-size:10px;opacity:.6;font-weight:700;}
main{padding:18px;flex:1;min-width:0;}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.screen-head h2{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;}
.screen-head h2 .material-symbols-outlined{font-size:24px;color:var(--accent);}
.screen-head .sub{color:var(--sub);font-size:12.5px;margin-top:3px;}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn .material-symbols-outlined{font-size:17px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);min-width:0;}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.kpi .k-ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
.kpi .k-ico .material-symbols-outlined{font-size:19px;}
.kpi .k-val{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:.3px;}
.kpi .k-lab{font-size:12px;color:var(--sub);margin-top:2px;}
.kpi .k-delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;}
.k-delta.up{color:var(--ok);background:#dcfce7;}
.k-delta.down{color:var(--bad);background:#fee2e2;}
.k-delta.flat{color:var(--warn);background:#fef3c7;}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden;}
.panel-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.panel-h h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
.panel-h h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.panel-h .cnt{font-size:11px;color:var(--sub);background:var(--bg);padding:3px 9px;border-radius:999px;font-weight:700;}
.panel-b{padding:14px 15px;min-width:0;}
.litem{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;transition:background .12s;}
.litem:last-child{border-bottom:none;}
.litem:hover{background:var(--accent-soft);}
.litem.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);}
.litem .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.litem .lt{min-width:0;flex:1;}
.litem .lt .lt-t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.litem .lt .lt-m{font-size:11.5px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.pri-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;}
.pri-高{color:var(--bad);background:#fee2e2;}
.pri-中{color:var(--warn);background:#fef3c7;}
.pri-低{color:var(--sub);background:#eef1f6;}
.d-title{font-size:17px;font-weight:800;margin:0 0 4px;}
.d-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:14px;}
.d-meta b{color:var(--ink);font-weight:600;}
.d-sec{margin-top:16px;}
.d-sec h4{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:0 0 9px;font-weight:700;}
.d-desc{font-size:13px;line-height:1.7;color:#3a3f52;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;}
.b-ok{color:var(--ok);background:#dcfce7;}
.b-prog{color:var(--info);background:#cffafe;}
.b-wait{color:var(--warn);background:#fef3c7;}
.b-block{color:var(--bad);background:#fee2e2;}
.b-done{color:var(--sub);background:#eef1f6;}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.check:last-child{border-bottom:none;}
.check .cb{width:19px;height:19px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check.done .cb{background:var(--accent);border-color:var(--accent);color:#fff;}
.check.done .cb .material-symbols-outlined{font-size:14px;}
.check.done span.txt{color:var(--sub);text-decoration:line-through;}
.check .who{margin-left:auto;font-size:11px;color:var(--sub);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
.tbl th{text-align:left;font-weight:700;color:var(--sub);padding:9px 11px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:#fafbff;}
.prog-wrap{width:90px;height:7px;background:var(--bg);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;}
.prog-in{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.col{background:var(--bg);border-radius:13px;padding:11px;min-width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,34,51,.04);cursor:pointer;}
.card:last-child{margin-bottom:0;}
.mini-ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#c7d2fe,#818cf8);color:#312e81;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);}
.chartbox{width:100%;height:280px;overflow:hidden;}
.chartbox.sm{height:220px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.tl{position:relative;padding-left:24px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .tl-dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl-item.muted .tl-dot{border-color:var(--line);}
.tl-item .tl-t{font-size:13px;font-weight:700;}
.tl-item .tl-d{font-size:11.5px;color:var(--sub);margin-top:2px;}
.tl-item .tl-time{font-size:11px;color:var(--accent);font-weight:600;}
.gantt{min-width:640px;}
.gantt-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}
.gantt-row:last-child{border-bottom:none;}
.gantt-lab{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gantt-track{position:relative;height:22px;background:var(--bg);border-radius:7px;}
.gantt-bar{position:absolute;top:3px;height:16px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 7px;color:#fff;font-size:10px;font-weight:700;overflow:hidden;white-space:nowrap;}
.flowmap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fnode{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:center;}
.fnode.act{background:var(--accent-soft);border-color:var(--accent2);}
.fnode .fn-ico{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--line);}
.fnode.act .fn-ico{background:var(--accent);border-color:var(--accent);color:#fff;}
.fnode.done2 .fn-ico{background:var(--ok);border-color:var(--ok);color:#fff;}
.fnode .fn-t{font-size:12px;font-weight:700;}
.fnode .fn-s{font-size:10.5px;color:var(--sub);margin-top:2px;}
.farrow{color:var(--line);flex-shrink:0;}
.doc{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.doc:hover{border-color:var(--accent2);box-shadow:var(--shadow);}
.doc .d-ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
.doc .d-info{min-width:0;flex:1;}
.doc .d-nm{font-weight:700;font-size:13px;}
.doc .d-mt{font-size:11.5px;color:var(--sub);margin-top:3px;}
.taglist{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.taglist .t{font-size:10px;background:var(--bg);color:var(--sub);padding:2px 8px;border-radius:6px;font-weight:600;}
.cmt{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);}
.cmt:last-child{border-bottom:none;}
.cmt .c-body{min-width:0;flex:1;}
.cmt .c-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cmt .c-nm{font-weight:700;font-size:12.5px;}
.cmt .c-tm{font-size:11px;color:var(--sub);}
.cmt .c-tx{font-size:13px;margin-top:5px;line-height:1.6;color:#3a3f52;}
.cmt .c-tx .men{color:var(--accent);font-weight:700;}
.load{display:flex;flex-direction:column;gap:12px;}
.load-row{display:grid;grid-template-columns:80px 1fr 44px;gap:10px;align-items:center;font-size:12.5px;}
.load-bar{height:9px;background:var(--bg);border-radius:99px;overflow:hidden;}
.load-in{height:100%;border-radius:99px;}
.note{font-size:11px;color:var(--sub);margin-top:12px;display:flex;align-items:center;gap:6px;line-height:1.5;}
.note .material-symbols-outlined{font-size:15px;color:var(--accent);flex-shrink:0;}
.reply{display:flex;gap:8px;margin-top:14px;align-items:center;}
.reply input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){
  .split{grid-template-columns:1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .navbtn .txt{display:none;}
  .navbtn{padding:9px 11px;}
  .brand p{display:none;}
  .top-right .chip{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div>
        <h1>TeamFlow · 團隊任務管理</h1>
        <p>任務、專案、知識到流程自動化的團隊協作平台</p>
      </div>
    </div>
    <div class="top-right">
      <span class="chip"><span class="material-symbols-outlined">calendar_month</span>2026 Q3 · 第 33 週</span>
      <span class="chip"><span class="material-symbols-outlined">groups</span>設計研發組</span>
      <div class="ava">陳</div>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="screen"></main>
</div>

<script>
"use strict";
var container=document.getElementById("screen");
var chartRegistry={};

var NAV=[
  {i:0,ico:"task_alt",t:"任務看板"},
  {i:1,ico:"account_tree",t:"專案里程碑"},
  {i:2,ico:"description",t:"知識文件庫"},
  {i:3,ico:"checklist",t:"簽核自動化"},
  {i:4,ico:"groups",t:"團隊協作牆"},
  {i:5,ico:"insights",t:"產能報表"}
];

var TASKS=[
  {id:"T-2041",title:"官網改版 · 首頁 Hero 動效",who:"林品瑄",pri:"高",due:"08/16",stat:"進行中",statc:"b-prog",prog:65,proj:"官網改版",dot:"#0891b2",
    desc:"依新版視覺稿實作首頁 Hero 區塊互動動效，含捲動視差與載入序列，需在多裝置驗證流暢度。",
    checks:[{t:"切版與 RWD 斷點",d:1,who:"林品瑄"},{t:"捲動視差動效",d:1,who:"林品瑄"},{t:"效能與 FPS 檢測",d:0,who:"周廷宇"},{t:"跨瀏覽器驗收",d:0,who:"陳映辰"}]},
  {id:"T-2038",title:"API 逾時例外處理重構",who:"周廷宇",pri:"高",due:"08/15",stat:"阻塞",statc:"b-block",prog:40,proj:"平台穩定性",dot:"#dc2626",
    desc:"統一後端 API 逾時與重試策略，目前受阻於第三方金流沙盒環境不穩，需等待供應商回覆。",
    checks:[{t:"逾時攔截層設計",d:1,who:"周廷宇"},{t:"重試與退避策略",d:1,who:"周廷宇"},{t:"金流沙盒串接測試",d:0,who:"周廷宇"},{t:"壓力測試報告",d:0,who:"黃思妤"}]},
  {id:"T-2033",title:"新進成員 Onboarding 手冊",who:"陳映辰",pri:"中",due:"08/20",stat:"待處理",statc:"b-wait",prog:15,proj:"團隊營運",dot:"#d97706",
    desc:"彙整開發環境、程式規範與部署流程，產出可自助上手的新人手冊並歸檔至知識庫。",
    checks:[{t:"環境設定章節",d:1,who:"陳映辰"},{t:"程式規範章節",d:0,who:"陳映辰"},{t:"部署流程章節",d:0,who:"周廷宇"},{t:"主管審閱",d:0,who:"陳彥廷"}]},
  {id:"T-2029",title:"儀表板圖表載入效能優化",who:"黃思妤",pri:"中",due:"08/18",stat:"進行中",statc:"b-prog",prog:80,proj:"平台穩定性",dot:"#0891b2",
    desc:"針對報表頁大量圖表採延遲初始化與資料快取，降低首屏載入時間至 1.5 秒內。",
    checks:[{t:"延遲初始化",d:1,who:"黃思妤"},{t:"資料快取層",d:1,who:"黃思妤"},{t:"首屏量測",d:1,who:"黃思妤"},{t:"驗收確認",d:0,who:"陳彥廷"}]},
  {id:"T-2025",title:"帳號權限矩陣盤點",who:"林品瑄",pri:"低",due:"08/24",stat:"待處理",statc:"b-wait",prog:5,proj:"團隊營運",dot:"#d97706",
    desc:"盤點各角色可存取模組與操作權限，補齊缺漏並移除離職成員帳號。",
    checks:[{t:"角色清單彙整",d:1,who:"林品瑄"},{t:"權限對照表",d:0,who:"林品瑄"},{t:"離職帳號清理",d:0,who:"陳映辰"},{t:"稽核簽核",d:0,who:"陳彥廷"}]},
  {id:"T-2018",title:"行動版導覽列可用性驗收",who:"陳映辰",pri:"中",due:"08/14",stat:"已完成",statc:"b-done",prog:100,proj:"官網改版",dot:"#6b7080",
    desc:"完成手機版收合導覽列的操作驗收，含觸控範圍、焦點順序與無障礙標籤。",
    checks:[{t:"觸控範圍檢查",d:1,who:"陳映辰"},{t:"焦點順序",d:1,who:"陳映辰"},{t:"無障礙標籤",d:1,who:"周廷宇"},{t:"主管驗收",d:1,who:"陳彥廷"}]}
];

var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};

function chart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  if(chartRegistry[id]){try{chartRegistry[id].dispose();}catch(e){}delete chartRegistry[id];}
  var c=echarts.init(el);
  c.setOption(opt);
  chartRegistry[id]=c;
}
var ax={axisLine:{lineStyle:{color:"#e7e9f2"}},axisLabel:{color:"#6b7080",fontSize:11},splitLine:{lineStyle:{color:"#f0f1f7"}}};

function kpi(ico,val,lab,dir,delta){
  var cls=dir==="up"?"up":(dir==="down"?"down":"flat");
  return '<div class="kpi"><div class="k-top"><div class="k-ico"><span class="material-symbols-outlined">'+ico+'</span></div>'+
    '<span class="k-delta '+cls+'">'+esc(delta)+'</span></div>'+
    '<div class="k-val">'+esc(val)+'</div><div class="k-lab">'+esc(lab)+'</div></div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  for(var k in chartRegistry){if(chartRegistry.hasOwnProperty(k)){try{chartRegistry[k].dispose();}catch(e){}}}
  chartRegistry={};
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}

(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button class="navbtn" data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ico+'</span>'+
      '<span class="txt">'+esc(n.t)+'</span><span class="idx">'+n.i+'</span></button>';
  }).join("");
  nav.addEventListener("click",function(e){
    var btn=e.target.closest?e.target.closest("[data-i]"):null;
    if(!btn)return;
    location.hash="go="+btn.getAttribute("data-i");
  });
})();

window.addEventListener("resize",function(){
  for(var k in chartRegistry){if(chartRegistry.hasOwnProperty(k)){try{chartRegistry[k].resize();}catch(e){}}}
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
