<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>團隊任務管理 · TeamFlow</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --sub:var(--color-muted-foreground);
  --ok:#047857;
  --warn:#B45309;
  --bad:var(--color-destructive);
  --info:#0E7490;
  --shadow:8px 8px 0 #134E4A;
  --shadow-sm:4px 4px 0 #134E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;background:var(--bg)}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,148,136,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.12) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button,.litem,.card,.doc{cursor:pointer}
button,input,.litem,.card,.doc{border-radius:0}
button:focus-visible,input:focus-visible,.navbtn:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-accent);color:#000}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:normal;
  line-height:1;
  vertical-align:middle;
}
.app{max-width:1440px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;background:rgba(240,253,250,.9);border-inline:2px solid var(--ink)}
.top{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  min-height:76px;padding:12px 20px;
  background:var(--panel);border-bottom:3px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:var(--color-primary);color:#000;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--color-accent)
}
.logo .material-symbols-outlined{font-size:27px;font-weight:700}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--sub);font-size:11.5px;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip,.cnt,.tag{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;background:var(--color-muted);border:2px solid var(--ink);
  color:var(--ink);font-size:11px;font-weight:800;line-height:1.2
}
.chip .material-symbols-outlined{font-size:16px;color:var(--accent)}
.ava,.mini-ava{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:36px;height:36px;background:var(--color-secondary);border:2px solid var(--ink);
  color:#0F172A;font-size:12px;font-weight:800
}
nav{
  position:sticky;top:76px;z-index:20;
  display:flex;gap:0;overflow-x:auto;flex-wrap:nowrap;
  padding:0;background:var(--ink);border-bottom:3px solid var(--ink);scrollbar-width:thin
}
.navbtn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;min-width:max-content;padding:10px 16px;
  background:var(--panel);border:0;border-right:2px solid var(--ink);
  color:var(--sub);font-size:12.5px;font-weight:800;white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,transform .18s ease
}
.navbtn:hover{background:var(--accent-soft);color:var(--ink)}
.navbtn.on{background:var(--color-accent);color:#000;box-shadow:inset 0 -6px 0 var(--ink)}
.navbtn.on:before{content:"ACTIVE";position:absolute;top:2px;right:3px;font-size:6px;letter-spacing:.08em}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn .idx{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;opacity:.75}
main{flex:1;min-width:0;padding:28px clamp(14px,2.3vw,34px) 40px}
#screen>*,.grid-item{animation:brutal-in .4s backwards}
#screen>*:nth-child(2){animation-delay:.06s}
#screen>*:nth-child(3){animation-delay:.12s}
#screen>*:nth-child(4){animation-delay:.18s}
@keyframes brutal-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.screen-head{
  position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin:0 0 22px;padding:20px 20px 18px;background:var(--color-secondary);border:3px solid var(--ink);box-shadow:var(--shadow)
}
.screen-head:after{content:"TEAM / WORK / FLOW";position:absolute;right:8px;top:5px;color:#0F172A;font-size:8px;font-weight:800;letter-spacing:.14em}
.screen-head h2{display:flex;align-items:center;gap:10px;margin:0;color:#0F172A;font-size:clamp(23px,3vw,38px);font-weight:800;letter-spacing:-.055em;line-height:1.05}
.screen-head h2 .material-symbols-outlined{font-size:1em;color:#0F172A}
.screen-head .sub{max-width:720px;margin-top:8px;color:#134E4A;font-size:12.5px;font-weight:600}
.hbtns{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:9px 14px;background:var(--panel);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  color:var(--ink);font-size:12.5px;font-weight:800;
  transition:background-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease
}
.btn:hover{background:var(--accent-soft);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--color-accent);border-color:var(--ink);color:#000}
.btn.pri:hover{background:#FB6A1C}
.btn .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{
  position:relative;min-width:0;padding:15px 16px 17px;background:var(--panel);border:3px solid var(--ink);box-shadow:var(--shadow-sm)
}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi:before{content:"";position:absolute;left:0;bottom:0;width:100%;height:5px;background:var(--color-primary)}
.kpi .k-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kpi .k-ico{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;background:var(--accent-soft);border:2px solid var(--ink);color:var(--ink)}
.kpi .k-ico .material-symbols-outlined{font-size:20px}
.kpi .k-val{margin-top:9px;font-size:clamp(25px,3vw,34px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.kpi .k-lab{margin-top:6px;color:var(--sub);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .k-delta,.pri-tag,.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1.5px solid currentColor;
  font-size:10.5px;font-weight:800;line-height:1.2
}
.k-delta.up:before,.b-ok:before{content:"↑"}
.k-delta.down:before,.b-block:before{content:"!"}
.k-delta.flat:before,.b-wait:before{content:"—"}
.b-prog:before{content:"▶";font-size:8px}
.b-done:before{content:"✓"}
.k-delta.up,.b-ok{background:#D1FAE5;color:#065F46}
.k-delta.down,.b-block{background:#FEE2E2;color:#991B1B}
.k-delta.flat,.b-wait{background:#FEF3C7;color:#92400E}
.b-prog{background:#CFFAFE;color:#155E75}
.b-done{background:#E2E8F0;color:#334155}
.pri-高{background:#FEE2E2;color:#991B1B}
.pri-高:before{content:"!!"}
.pri-中{background:#FEF3C7;color:#92400E}
.pri-中:before{content:"!"}
.pri-低{background:#E2E8F0;color:#334155}
.pri-低:before{content:"·"}
.split{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);gap:18px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.panel{min-width:0;overflow:hidden;background:var(--panel);border:3px solid var(--ink);box-shadow:var(--shadow-sm)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--color-muted);border-bottom:3px solid var(--ink)}
.panel-h h3{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.panel-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.panel-h .cnt{padding:3px 7px;background:var(--panel);border-width:1.5px}
.panel-b{min-width:0;padding:16px}
.litem{display:flex;align-items:flex-start;gap:11px;min-height:52px;padding:12px 14px;border-bottom:2px solid var(--ink);background:var(--panel);transition:background-color .18s ease,transform .18s ease}
.litem:last-child{border-bottom:0}
.litem:hover{background:var(--accent-soft)}
.litem.sel{background:#99F6E4;box-shadow:inset 8px 0 0 var(--color-accent)}
.litem.sel:after{content:"SELECTED";align-self:center;color:var(--ink);font-size:7px;font-weight:800;letter-spacing:.08em;writing-mode:vertical-rl}
.litem .dot{width:11px;height:11px;margin-top:4px;flex-shrink:0;border:2px solid var(--ink)}
.litem .lt{min-width:0;flex:1}
.litem .lt .lt-t{overflow:hidden;color:var(--ink);font-size:12.5px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.litem .lt .lt-m{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--sub);font-size:11px}
.d-title{margin:0 0 5px;font-size:clamp(18px,2.4vw,25px);font-weight:800;letter-spacing:-.03em}
.d-meta{display:flex;gap:8px 17px;flex-wrap:wrap;margin-bottom:15px;color:var(--sub);font-size:11.5px}
.d-meta b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.d-sec{margin-top:19px}
.d-sec h4{margin:0 0 9px;padding-bottom:5px;border-bottom:2px solid var(--ink);color:var(--sub);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.d-desc,.cmt .c-tx{color:#334155;font-size:12.5px;line-height:1.75}
.check{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 0;border-bottom:1px dashed var(--ink);font-size:12.5px}
.check:last-child{border-bottom:0}
.check .cb{display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;background:#fff;border:2px solid var(--ink)}
.check.done .cb{background:var(--color-primary);color:#000}
.check.done .cb .material-symbols-outlined{font-size:14px;font-weight:800}
.check.done span.txt{color:var(--sub);text-decoration:line-through}
.check .who{margin-left:auto;color:var(--sub);font-size:10.5px}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px;border:2px solid var(--ink);background:var(--color-primary);color:#000;font-size:10px;font-weight:800;letter-spacing:.06em;text-align:left;text-transform:uppercase;white-space:nowrap}
.tbl td{padding:11px 10px;border:1px solid #64748B;border-inline-width:2px;white-space:nowrap}
.tbl td:first-child,.tbl td:last-child{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:2px solid var(--ink)}
.tbl tbody tr:nth-child(even) td{background:#F8FAFC}
.tbl tbody tr:hover td{background:var(--accent-soft)}
.tbl td:nth-last-child(1){text-align:right}
.prog-wrap,.load-bar{display:inline-block;overflow:hidden;width:90px;height:9px;background:var(--color-muted);border:1px solid var(--ink);vertical-align:middle}
.prog-in,.load-in{height:100%;background:var(--color-primary)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{min-width:0;padding:11px;background:var(--color-muted);border:2px solid var(--ink)}
.card{margin-bottom:9px;padding:11px;background:var(--panel);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:background-color .18s ease,transform .18s ease}
.card:hover{background:var(--accent-soft);transform:translate(-2px,-2px)}
.card:last-child{margin-bottom:0}
.tag{padding:3px 7px;background:var(--accent-soft);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px}
.chartbox{width:100%;height:280px;overflow:hidden;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(13,148,136,.09) 40px)}
.chartbox.sm{height:220px}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:3px;background:var(--ink)}
.tl-item{position:relative;padding:0 0 19px}
.tl-item:last-child{padding-bottom:0}
.tl-item .tl-dot{position:absolute;top:2px;left:-26px;width:17px;height:17px;background:var(--color-accent);border:3px solid var(--ink)}
.tl-item.muted .tl-dot{background:var(--color-muted)}
.tl-item .tl-t{font-size:12.5px;font-weight:800}
.tl-item .tl-d{margin-top:2px;color:var(--sub);font-size:11px}
.tl-item .tl-time{color:#0F766E;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;font-weight:800}
.gantt{min-width:640px}
.gantt-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #64748B}
.gantt-row:last-child{border-bottom:0}
.gantt-lab{overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.gantt-track{position:relative;height:24px;background:var(--color-muted);border:1px solid var(--ink)}
.gantt-bar{position:absolute;top:3px;display:flex;align-items:center;height:16px;overflow:hidden;padding:0 7px;background:var(--color-primary);border-right:3px solid var(--ink);color:#000;font-size:9px;font-weight:800;white-space:nowrap}
.flowmap{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.fnode{flex:1;min-width:120px;padding:12px;background:var(--color-muted);border:2px solid var(--ink);text-align:center}
.fnode.act{background:#99F6E4;box-shadow:inset 0 -6px 0 var(--color-accent)}
.fnode.act:before{content:"CURRENT STEP";display:block;margin-bottom:5px;font-size:7px;font-weight:800;letter-spacing:.1em}
.fnode .fn-ico{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:0 auto 7px;background:var(--panel);border:2px solid var(--ink)}
.fnode.act .fn-ico{background:var(--color-accent);color:#000}
.fnode.done2 .fn-ico{background:#10B981;color:#000}
.fnode.done2:after{content:"COMPLETE";display:block;margin-top:4px;color:#065F46;font-size:7px;font-weight:800;letter-spacing:.08em}
.fnode .fn-t{font-size:11.5px;font-weight:800}
.fnode .fn-s{margin-top:2px;color:var(--sub);font-size:10px}
.farrow{align-self:center;flex-shrink:0;color:var(--ink)}
.doc{display:flex;gap:12px;margin-bottom:10px;padding:13px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease}
.doc:hover{background:var(--accent-soft);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.doc .d-ico{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex-shrink:0;background:var(--color-accent);border:2px solid var(--ink);color:#000}
.doc .d-info{min-width:0;flex:1}
.doc .d-nm{font-size:12.5px;font-weight:800}
.doc .d-mt{margin-top:3px;color:var(--sub);font-size:11px}
.taglist{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.taglist .t{padding:2px 6px;background:var(--color-muted);border:1px solid #64748B;color:#334155;font-size:9.5px;font-weight:700}
.cmt{display:flex;gap:11px;padding:14px 0;border-bottom:2px solid var(--ink)}
.cmt:last-child{border-bottom:0}
.cmt .c-body{min-width:0;flex:1}
.cmt .c-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmt .c-nm{font-size:12px;font-weight:800}
.cmt .c-tm{color:var(--sub);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px}
.cmt .c-tx{margin-top:5px}
.cmt .c-tx .men{background:var(--accent-soft);color:#0F766E;font-weight:800}
.load{display:flex;flex-direction:column;gap:13px}
.load-row{display:grid;grid-template-columns:80px 1fr 48px;gap:10px;align-items:center;font-size:12px}
.load-row>span:last-child{font-variant-numeric:tabular-nums}
.note{display:flex;align-items:flex-start;gap:7px;margin-top:13px;padding:9px;background:#FFEDD5;border:2px solid var(--ink);color:#7C2D12;font-size:10.5px;font-weight:600;line-height:1.5}
.note .material-symbols-outlined{flex-shrink:0;color:var(--color-accent);font-size:16px}
.reply{display:flex;align-items:center;gap:8px;margin-top:15px}
.reply input{flex:1;min-width:0;min-height:44px;padding:9px 11px;background:#fff;border:2px solid var(--ink);color:var(--ink);font-size:12.5px}
.reply input::placeholder{color:#64748B}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .app{border-inline:0}
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .screen-head{box-shadow:5px 5px 0 var(--ink)}
  .screen-head h2{font-size:28px}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .top{min-height:68px;padding:9px 12px}
  .logo{width:42px;height:42px}
  .brand h1{font-size:14px}
  .brand p,.top-right .chip{display:none}
  .top-right{margin-left:auto}
  nav{top:68px}
  .navbtn{min-width:52px;min-height:48px;padding:9px 12px}
  .navbtn .txt{display:none}
  main{padding:18px 12px 30px}
  .screen-head{align-items:flex-start;padding:18px 14px 15px;margin-bottom:18px}
  .screen-head h2{font-size:25px}
  .screen-head .sub{font-size:11.5px}
  .hbtns{width:100%}
  .hbtns .btn{flex:1}
  .kpis{grid-template-columns:1fr;gap:11px}
  .kpi:nth-child(even){transform:none}
  .board{grid-template-columns:1fr}
  .panel-b{padding:13px}
  .flowmap{display:grid;grid-template-columns:1fr}
  .farrow{transform:rotate(90deg);justify-self:center}
  .load-row{grid-template-columns:70px 1fr 42px}
  .reply{align-items:flex-end}
  .reply .mini-ava{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  #screen>*,.grid-item{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div>
        <h1>TeamFlow · 團隊任務管理</h1>
        <p>任務、專案、知識到流程自動化的團隊協作平台</p>
      </div>
    </div>
    <div class="top-right">

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  for(var k in chartRegistry){if(chartRegistry.hasOwnProperty(k)){try{chartRegistry[k].dispose();}catch(e){}}}
  chartRegistry={};
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}

(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button class="navbtn" data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ico+'</span>'+
      '<span class="txt">'+esc(n.t)+'</span><span class="idx">'+n.i+'</span></button>';
  }).join("");
  nav.addEventListener("click",function(e){
    var btn=e.target.closest?e.target.closest("[data-i]"):null;
    if(!btn)return;
    location.hash="go="+btn.getAttribute("data-i");
  });
})();

window.addEventListener("resize",function(){
  for(var k in chartRegistry){if(chartRegistry.hasOwnProperty(k)){try{chartRegistry[k].resize();}catch(e){}}}
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
