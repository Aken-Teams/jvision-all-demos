<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>機車行營運管理｜Jvision</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#00ff41;
  --color-on-primary:#0f172a;
  --color-secondary:#008f11;
  --color-on-secondary:#000;
  --color-accent:#ff3333;
  --color-on-accent:#000;
  --color-background:#0d1117;
  --color-foreground:#e6edf3;
  --color-card:#182424;
  --color-card-foreground:#e6edf3;
  --color-muted:#25292f;
  --color-muted-foreground:#a8b5c7;
  --color-border:#3a424c;
  --color-destructive:#ef4444;
  --color-on-destructive:#000;
  --color-ring:#00ff41;
  --blue:#00ff41;
  --ink:#e6edf3;
  --muted:#a8b5c7;
  --line:#3a424c;
  --ok:#43ff70;
  --warn:#ffc857;
  --bad:#ff6666;
  --info:#68d8ff;
  --violet:#c5a3ff;
  --mono:"Josefin Sans",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px),
    radial-gradient(circle at 82% 8%,rgba(0,143,17,.16),transparent 30rem),
    var(--color-background);
  background-size:32px 32px,32px 32px,auto,auto;
  font-family:"Josefin Sans",sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.msi{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(13,17,23,.94);
  border-bottom:1px solid rgba(0,255,65,.35);
  box-shadow:0 8px 32px rgba(0,0,0,.35),0 1px 18px rgba(0,255,65,.08);
  backdrop-filter:blur(16px);
}
.top::after{
  content:"";
  position:absolute;
  inset:auto 0 -1px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--color-primary),transparent);
  opacity:.72;
}
.top-inner{
  width:min(1440px,100%);
  margin:auto;
  padding:11px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:250px}
.logo,.scr-ic{
  display:grid;
  place-items:center;
  position:relative;
  color:var(--color-primary);
  background:rgba(0,255,65,.07);
  border:1px solid rgba(0,255,65,.48);
  box-shadow:inset 0 0 16px rgba(0,255,65,.07),0 0 18px rgba(0,255,65,.08);
  clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
}
.logo{width:42px;height:42px;flex:none}
.logo::before,.scr-ic::before{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  top:3px;
  right:3px;
  border-top:1px solid var(--color-primary);
  border-right:1px solid var(--color-primary);
}
.logo .msi{font-size:25px}
.brand b{
  display:block;
  font-family:"Cinzel","Josefin Sans",sans-serif;
  font-size:16px;
  letter-spacing:.08em;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:1px;
  color:var(--color-muted-foreground);
  font-size:11px;
  letter-spacing:.12em;
}
nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  min-width:0;
}
nav button{
  min-height:42px;
  padding:8px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#b9c5d3;
  background:transparent;
  border:1px solid transparent;
  border-radius:2px;
  white-space:nowrap;
  transition:color .2s,background .2s,border-color .2s,box-shadow .2s;
}
nav button .msi{font-size:19px}
nav button:hover{
  color:#fff;
  background:rgba(0,255,65,.07);
  border-color:rgba(0,255,65,.28);
}
nav button.on{
  color:var(--color-primary);
  background:rgba(0,255,65,.11);
  border-color:rgba(0,255,65,.65);
  box-shadow:inset 0 -2px var(--color-primary),0 0 15px rgba(0,255,65,.09);
}
main{width:min(1440px,100%);margin:auto;padding:24px 20px 64px}
.scr-head{
  min-height:72px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:14px;
}
.scr-ic{width:48px;height:48px;flex:none}
.scr-ic .msi{font-size:27px}
.scr-head h1{
  margin:0;
  font-family:"Cinzel","Josefin Sans",sans-serif;
  font-size:clamp(20px,2.1vw,28px);
  line-height:1.2;
  letter-spacing:.055em;
}
.scr-head p{margin:5px 0 0;color:var(--color-muted-foreground);font-size:13px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.65fr)}
.card,.kpi{
  position:relative;
  min-width:0;
  color:var(--color-card-foreground);
  background:
    linear-gradient(135deg,rgba(0,255,65,.035),transparent 36%),
    rgba(24,36,36,.94);
  border:1px solid var(--color-border);
  border-radius:3px;
  box-shadow:0 12px 28px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.025);
}
.card::before,.kpi::after{
  content:"";
  position:absolute;
  top:-1px;
  left:-1px;
  width:24px;
  height:12px;
  border-top:1px solid var(--color-primary);
  border-left:1px solid var(--color-primary);
  pointer-events:none;
}
.card{padding:17px}
.card h3{
  margin:0 0 14px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--color-border);
  font-family:"Cinzel","Josefin Sans",sans-serif;
  font-size:14px;
  letter-spacing:.045em;
}
.card h3 .msi{color:var(--color-primary);font-size:20px}
.kpi{
  min-height:132px;
  padding:15px 16px 13px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:linear-gradient(transparent,var(--color-primary),transparent);
  box-shadow:0 0 12px var(--color-primary);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:#b8c4d2;
  font-size:12px;
  font-weight:600;
  letter-spacing:.045em;
}
.kpi .lab .msi{color:var(--color-primary);font-size:18px}
.kpi .val{
  margin-top:8px;
  font-family:var(--mono);
  font-size:clamp(24px,2.6vw,31px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:.025em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(0,255,65,.1);
}
.kpi .val small{
  margin-left:5px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:500;
}
.kpi .dt{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:3px;
  color:var(--color-muted-foreground);
  font-size:11.5px;
  font-weight:600;
}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.ov{
  max-width:100%;
  overflow-x:auto;
  border:1px solid var(--color-border);
  border-radius:2px;
  scrollbar-color:var(--color-secondary) var(--color-muted);
}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:13px}
th,td{
  padding:10px 12px;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  white-space:nowrap;
}
th{
  color:#c4cfdb;
  background:#202b2b;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.06em;
}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(0,255,65,.045)}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  min-height:24px;
  padding:3px 8px;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:2px;
  font-size:11px;
  font-weight:700;
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  background:currentColor;
  box-shadow:0 0 6px currentColor;
}
.t-ok{color:#75ff97;background:rgba(0,255,65,.07)}
.t-warn{color:#ffd77a;background:rgba(255,200,87,.08)}
.t-bad{color:#ff8585;background:rgba(239,68,68,.09)}
.t-info{color:#82dfff;background:rgba(104,216,255,.08)}
.t-pur{color:#ceb5ff;background:rgba(197,163,255,.08)}
.t-gray{color:#c0c9d4;background:rgba(148,163,184,.08)}
.chart{width:100%;height:280px;min-width:0}
.chip{
  display:inline-block;
  padding:3px 8px;
  color:#c6d2df;
  background:#222d31;
  border:1px solid #44505a;
  border-radius:2px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
}
.bar{height:7px;overflow:hidden;background:#0d1518;border:1px solid #354148;border-radius:0}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--color-secondary),var(--color-primary));
  box-shadow:0 0 10px rgba(0,255,65,.38);
}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:850px}
.col{padding:11px;background:#111a1d;border:1px solid #354148}
.col-h{
  margin-bottom:10px;
  padding:2px 2px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--color-border);
  font-size:12px;
  font-weight:700;
}
.col-h .n{
  min-width:24px;
  padding:1px 7px;
  color:var(--color-primary);
  background:rgba(0,255,65,.07);
  border:1px solid rgba(0,255,65,.38);
  text-align:center;
  font-family:var(--mono);
}
.wo{
  margin-bottom:9px;
  padding:10px 11px;
  background:#1b272a;
  border:1px solid #3b484e;
  border-left:3px solid var(--color-primary);
  box-shadow:0 5px 14px rgba(0,0,0,.18);
}
.wo:last-child{margin-bottom:0}
.wo b{font-family:var(--mono);font-size:12px;letter-spacing:.03em}
.wo .meta{
  margin-top:7px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  color:#aebbc9;
  font-size:11px;
}
.wo .av{
  width:22px;
  height:22px;
  display:inline-grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:50%;
  font-weight:700;
}
.inv{padding:15px;background:#111a1d;border:1px dashed #536168}
.inv-row{
  padding:8px 0;
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px dashed #3d4a50;
  font-size:13px;
}
.inv-row:last-child{border-bottom:0}
.inv-row>span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.inv-total{color:var(--color-primary);font-size:21px;font-weight:700;text-shadow:0 0 10px rgba(0,255,65,.22)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.pill-row .chip{
  min-height:34px;
  padding:7px 10px;
  color:#d7e1ea;
  transition:border-color .2s,color .2s,background .2s;
}
.pill-row .chip:hover{color:var(--color-primary);background:rgba(0,255,65,.07);border-color:var(--color-primary)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:#b2becb;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:4px;display:inline-block}
.subtitle{margin:-7px 0 12px;color:#b5c1ce;font-size:12px}
.prog-lab{display:flex;justify-content:space-between;margin-bottom:4px;font-family:var(--mono);font-size:11px}
.hl{color:var(--color-primary);font-weight:700}
.mini{color:#b4c0cc;font-family:"Josefin Sans",sans-serif;font-size:11px;font-weight:500}
.live{
  width:8px;
  height:8px;
  display:inline-block;
  margin-left:auto;
  background:var(--ok);
  border:1px solid #d7ffe1;
  border-radius:50%;
  box-shadow:0 0 9px var(--ok);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.38;box-shadow:none}}
@media(max-width:1100px){
  .top-inner{align-items:flex-start;flex-direction:column;gap:8px}
  nav{width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:3px}
  .top{position:relative}
}
@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  main{padding:18px 12px 48px}
  .top-inner{padding:10px 12px}
  .brand{min-width:0}
  nav button{min-width:44px;justify-content:center;padding:8px 10px}
  nav button .txt{display:none}
  .g4{grid-template-columns:1fr}
  .card{padding:13px}
  .scr-head{align-items:flex-start}
  .scr-head p{max-width:30rem}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>

function statusTag(s){

function priTag(p){return '<span class="tag '+(p==="急"?"t-bad":"t-info")+'">'+p+"</span>"}
function kpi(ic,lab,val,unit,dir,dt){
  var arrow=dir==="up"?'<span class="msi" aria-hidden="true">arrow_upward</span>':dir==="down"?'<span class="msi" aria-hidden="true">arrow_downward</span>':"";
  return '<div class="kpi"><div class="lab"><span class="msi" aria-hidden="true">'+ic+"</span>"+lab+'</div><div class="val">'+val+(unit?"<small>"+unit+"</small>":"")+'</div><div class="dt '+(dir||"")+'">'+arrow+(dt||"")+"</div></div>"
}
function scrHead(ic,title,sub){
  return '<div class="scr-head"><div class="scr-ic"><span class="msi" aria-hidden="true">'+ic+'</span></div><div><h1>'+title+"</h1><p>"+sub+"</p></div></div>"
}
function s0(){
  var rows=customers.map(function(c){
    var vt=c.vip==="金卡"?"t-warn":c.vip==="銀卡"?"t-info":"t-gray";
    return "<tr><td><b>"+c.plate+"</b></td><td>"+c.owner+"</td><td>"+c.model+"</td><td>"+(c.cc>0?c.cc+"cc":"電動")+"</td><td>"+c.km.toLocaleString()+" km</td><td>"+c.last+'</td><td><span class="chip">'+c.next+'</span></td><td><span class="tag '+vt+'">'+c.vip+"</span></td></tr>"
  }).join("");
  return scrHead("two_wheeler","客戶車籍","車主與車輛建檔、保養歷程與會員等級管理")+
  '<div class="grid g4" style="margin-bottom:14px">'+
  kpi("groups","建檔車主","1,284","位","up","本月新增 38")+
  kpi("two_wheeler","在籍車輛","1,536","台","up","含 214 台電動車")+
  kpi("event_repeat","本月待保養","47","台","","依里程排程")+
  kpi("workspace_premium","VIP 會員","326","位","up","金卡 92")+
  '</div><div class="grid g23"><div class="card"><h3><span class="msi">manage_search</span>車籍清單</h3><div class="ov"><table><thead><tr><th>車牌</th><th>車主</th><th>車型</th><th>排氣量</th><th>里程</th><th>上次進廠</th><th>下次項目</th><th>會員</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h3><span class="msi">pie_chart</span>會員等級占比</h3><div id="c0" class="chart" style="height:300px"></div></div></div>'
}
function s1(){
  function cardWO(w){
    return '<div class="wo"><b>'+w.no+"</b> "+priTag(w.pri)+'<div style="font-size:12.5px;margin-top:5px">'+w.item+'</div><div class="meta"><span><span class="av">'+w.owner.charAt(0)+"</span> "+w.owner+'</span><span><span class="msi">engineering</span> '+w.tech+'</span><span><span class="msi">schedule</span> '+w.eta+"</span></div></div>"
  }
  function col(title,ic,list){
    return '<div class="col"><div class="col-h"><span><span class="msi" style="color:var(--color-primary)">'+ic+"</span> "+title+'</span><span class="n">'+list.length+"</span></div>"+list.map(cardWO).join("")+"</div>"
  }
  return scrHead("build","維修保養單","工單看板：從待受理、維修中、路試到完工的即時進度")+
  '<div class="grid g4" style="margin-bottom:14px">'+
  kpi("assignment","今日工單","23","張","up","急件 5 張")+
  kpi("engineering","在廠維修","8","台","","技師 3 人")+
  kpi("timer","平均工時","1.8","hr","down","較上週 -0.3")+
  kpi("task_alt","今日完工","11","張","up","準時率 94%")+
  '</div><div class="card"><h3><span class="msi">view_kanban</span>維修工單看板 <span class="live" aria-hidden="true"></span><span class="mini">即時同步</span></h3><div class="ov"><div class="board">'+
  col("待受理／派工","inbox",workorders.wait)+col("維修中","build_circle",workorders.doing)+col("路試／檢驗","speed",workorders.test)+col("已完工","verified",workorders.done)+
  "</div></div></div>"
}
function s2(){
  var rows=parts.map(function(p){
    var pct=Math.min(100,Math.round(p.stock/(p.safe*1.6)*100));
    var col=p.st==="充足"?"var(--ok)":p.st==="偏低"?"var(--warn)":"var(--bad)";
    return '<tr><td><span class="chip">'+p.sku+"</span></td><td><b>"+p.name+"</b></td><td>"+p.cat+"</td><td>"+p.stock+" "+p.unit+"</td><td>"+p.safe+"</td><td>"+money(p.price)+'</td><td style="min-width:130px"><div class="bar" aria-label="庫存水位 '+pct+'%"><i style="width:'+pct+"%;background:"+col+'"></i></div></td><td>'+statusTag(p.st)+"</td></tr>"
  }).join("");
  return scrHead("inventory_2","零件庫存","料件安全庫存監控、進出料統計與補貨預警")+
  '<div class="grid g4" style="margin-bottom:14px">'+
  kpi("category","料件品項","386","項","","8 大類別")+
  kpi("warning","低於安全量","3","項","down","需補貨")+
  kpi("payments","庫存價值","$284K","","","含備品")+
  kpi("local_shipping","本週進料","64","件","up","3 家供應商")+
  '</div><div class="grid g32"><div class="card"><h3><span class="msi">stacked_bar_chart</span>各類別週進出料</h3><div id="c2" class="chart"></div><div class="legend"><span><i style="background:#00ff41"></i>進料</span><span><i style="background:#68d8ff"></i>領用</span></div></div><div class="card"><h3><span class="msi">table_rows</span>零件庫存清單</h3><div class="ov"><table><thead><tr><th>料號</th><th>品名</th><th>類別</th><th>庫存</th><th>安全量</th><th>單價</th><th>水位</th><th>狀態</th></tr></thead><tbody>'+rows+"</tbody></table></div></div></div>"

function s3(){
  var rows=receivables.map(function(r){
    var pct=r.amt?Math.round(r.paid/r.amt*100):0;
    return "<tr><td><b>"+r.no+"</b></td><td>"+r.owner+"</td><td>"+money(r.amt)+"</td><td>"+money(r.paid)+'</td><td><span class="chip">'+r.method+'</span></td><td style="min-width:120px"><div class="prog-lab"><span>'+pct+'%</span></div><div class="bar" aria-label="沖銷進度 '+pct+'%"><i style="width:'+pct+'%"></i></div></td><td>'+statusTag(r.st)+"</td><td>"+r.date+"</td></tr>"
  }).join("");
  var out=receivables.reduce(function(a,r){return a+r.amt-r.paid},0);
  return scrHead("receipt_long","付款沖銷","收款、賒帳與分期沖銷管理，掌握應收帳款")+
  '<div class="grid g4" style="margin-bottom:14px">'+
  kpi("account_balance_wallet","本月營收","$186,400","","up","較上月 +12%")+
  kpi("credit_score","已沖銷","$168,600","","","占 90.4%")+
  kpi("pending_actions","未收帳款",money(out),"","down","賒帳 4 筆")+
  kpi("percent","現金收款率","62","%","","LINE Pay 上升")+
  '</div><div class="grid g23"><div class="card"><h3><span class="msi">receipt</span>應收帳款與沖銷</h3><div class="ov"><table><thead><tr><th>單號</th><th>車主</th><th>應收</th><th>已收</th><th>方式</th><th>沖銷進度</th><th>狀態</th><th>日期</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h3><span class="msi">donut_large</span>收款方式占比</h3><div id="c3" class="chart" style="height:300px"></div></div></div>'
}
function s4(){
  var sub=invoiceItems.reduce(function(a,it){return a+it.qty*it.price},0);
  var labor=invoiceItems.filter(function(it){return it.type==="工資"}).reduce(function(a,it){return a+it.qty*it.price},0);
  var partSum=sub-labor,tax=Math.round(sub*.05),total=sub+tax;
  var lines=invoiceItems.map(function(it){
    return '<div class="inv-row"><span>'+it.name+' <span class="chip">'+it.type+"</span> ×"+it.qty+"</span><span>"+money(it.qty*it.price)+"</span></div>"
  }).join("");
  return scrHead("print","報表列印","估價單、維修明細與月結報表產出與列印預覽")+
  '<div class="grid g4" style="margin-bottom:14px">'+
  kpi("description","本月估價單","218","張","up","轉工單 82%")+
  kpi("print","已列印明細","196","張","","含電子發票")+
  kpi("summarize","月結報表","6","份","","自動彙整")+
  kpi("forward_to_inbox","LINE 傳送","143","筆","up","車主接收")+
  '</div><div class="grid g2"><div class="card"><h3><span class="msi">receipt_long</span>估價單預覽 EST-260812</h3><div class="subtitle">車主：林志明　車牌：BKR-1258　車型：勁戰六代 125</div><div class="inv">'+lines+
  '<div class="inv-row"><span>工資小計</span><span>'+money(labor)+'</span></div><div class="inv-row"><span>零件小計</span><span>'+money(partSum)+'</span></div><div class="inv-row"><span>營業稅 5%</span><span>'+money(tax)+'</span></div><div class="inv-row" style="margin-top:6px"><span style="font-weight:700">合計應付</span><span class="inv-total">'+money(total)+'</span></div></div><div class="pill-row"><span class="chip">列印估價單</span><span class="chip">轉為工單</span><span class="chip">LINE 傳送</span><span class="chip">開立發票</span></div></div><div class="card"><h3><span class="msi">bar_chart</span>近六月報表產出量</h3><div id="c4" class="chart"></div><div class="legend"><span><i style="background:#00ff41"></i>估價單</span><span><i style="background:#68d8ff"></i>維修明細</span></div></div></div>'
}

  '<div class="grid g4" style="margin-bottom:14px">'+

  kpi("savings","本月毛利","$121,100","","up","毛利率 48.8%")+
  kpi("engineering","工資毛利","$74,600","","","占 61.6%")+
  kpi("inventory","零件毛利","$46,500","","up","占 38.4%")+
  '</div><div class="grid g2" style="margin-bottom:14px"><div class="card"><h3><span class="msi">show_chart</span>近六月營收與毛利趨勢</h3><div id="c5" class="chart"></div></div><div class="card"><h3><span class="msi">radar</span>服務類別綜合表現</h3><div id="c5b" class="chart"></div></div></div><div class="card"><h3><span class="msi">analytics</span>各服務類別毛利拆解</h3><div class="ov"><table><thead><tr><th>服務類別</th><th>營收</th><th>成本</th><th>毛利</th><th>毛利率</th></tr></thead><tbody>'+rows+"</tbody></table></div></div>"

function initChart(i){
  var text="#b9c5d3",line="#3a424c",green="#00ff41",cyan="#68d8ff";
  var base={
    animation:!matchMedia("(prefers-reduced-motion: reduce)").matches,
    textStyle:{fontFamily:'"Josefin Sans",sans-serif',color:text},
    color:[green,cyan,"#c5a3ff","#ffc857","#ff6666","#94a3b8"]
  };
  function axis(){
    return {axisLine:{lineStyle:{color:line}},axisTick:{lineStyle:{color:line}},axisLabel:{color:text},splitLine:{lineStyle:{color:"#303b40"}}}
  }
  if(i===0){
    chart=echarts.init(document.getElementById("c0"));
    chart.setOption(Object.assign({},base,{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:text}},series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],itemStyle:{borderColor:"#182424",borderWidth:3},label:{color:"#e6edf3",formatter:"{b}\n{d}%"},data:[{value:326,name:"金卡"},{value:512,name:"銀卡"},{value:698,name:"一般"}]}]}))
  }else if(i===2){
    chart=echarts.init(document.getElementById("c2"));
    chart.setOption(Object.assign({},base,{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},grid:{left:8,right:12,top:20,bottom:8,containLabel:true},xAxis:Object.assign({type:"value"},axis()),yAxis:Object.assign({type:"category",data:["油品","輪胎","煞車","點火","電系","傳動","濾材"]},axis()),series:[{name:"進料",type:"bar",stack:"a",data:[24,8,6,30,4,3,10],itemStyle:{color:green}},{name:"領用",type:"bar",stack:"a",data:[18,11,9,12,3,5,7],itemStyle:{color:cyan}}]}))
  }else if(i===3){
    chart=echarts.init(document.getElementById("c3"));
    chart.setOption(Object.assign({},base,{tooltip:{trigger:"item",formatter:"{b}: {c} ({d}%)"},legend:{bottom:0,textStyle:{color:text}},series:[{type:"pie",radius:["48%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#182424",borderWidth:3},label:{color:"#e6edf3",formatter:"{d}%"},data:[{value:62,name:"現金"},{value:14,name:"信用卡"},{value:12,name:"LINE Pay"},{value:8,name:"分期"},{value:4,name:"賒帳"}]}]}))
  }else if(i===4){
    chart=echarts.init(document.getElementById("c4"));
    chart.setOption(Object.assign({},base,{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},grid:{left:8,right:12,top:20,bottom:8,containLabel:true},xAxis:Object.assign({type:"category",data:["3月","4月","5月","6月","7月","8月"]},axis()),yAxis:Object.assign({type:"value"},axis()),series:[{name:"估價單",type:"bar",barWidth:14,data:[182,196,205,188,214,218],itemStyle:{color:green}},{name:"維修明細",type:"bar",barWidth:14,data:[160,171,180,169,192,196],itemStyle:{color:cyan}}]}))
  }else if(i===5){
    chart=echarts.init(document.getElementById("c5"));
    chart.setOption(Object.assign({},base,{tooltip:{trigger:"axis"},legend:{top:0,textStyle:{color:text}},grid:{left:8,right:12,top:34,bottom:8,containLabel:true},xAxis:Object.assign({type:"category",boundaryGap:false,data:["3月","4月","5月","6月","7月","8月"]},axis()),yAxis:Object.assign({type:"value"},axis()),series:[{name:"營收",type:"line",smooth:true,data:[208,221,234,219,236,248],lineStyle:{width:3,color:green},areaStyle:{color:"rgba(0,255,65,.10)"},itemStyle:{color:green}},{name:"毛利",type:"line",smooth:true,data:[96,104,112,101,114,121],lineStyle:{width:3,color:cyan},areaStyle:{color:"rgba(104,216,255,.10)"},itemStyle:{color:cyan}}]}));
    chart2=echarts.init(document.getElementById("c5b"));
    chart2.setOption(Object.assign({},base,{tooltip:{},legend:{bottom:0,textStyle:{color:text}},radar:{indicator:[{name:"營收",max:100},{name:"毛利率",max:100},{name:"回廠率",max:100},{name:"滿意度",max:100},{name:"週轉",max:100}],radius:"62%",axisName:{color:text},axisLine:{lineStyle:{color:line}},splitLine:{lineStyle:{color:line}},splitArea:{areaStyle:{color:["rgba(0,255,65,.02)","rgba(255,255,255,.01)"]}}},series:[{type:"radar",areaStyle:{opacity:.14},data:[{value:[88,78,72,90,68],name:"定期保養",itemStyle:{color:green}},{value:[74,55,60,80,72],name:"引擎檢修",itemStyle:{color:cyan}}]}]}))
  }
}
var SCR=[s0,s1,s2,s3,s4,s5];
function show(i){
  disposeCharts();
  var app=document.getElementById("app");
  app.innerHTML=SCR[i]();
  document.querySelectorAll("#nav button").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false")
  });
  initChart(i)
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button type="button" data-i="'+n.i+'" aria-label="'+n.t+'"><span class="msi" aria-hidden="true">'+n.ic+'</span><span class="txt">'+n.t+"</span></button>"
  }).join("");
  nav.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i")})
  })
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var i=m?Math.min(+m[1],5):0;
  show(i);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){
  if(chart)chart.resize();
  if(chart2)chart2.resize()
});
fromHash();
</script>
