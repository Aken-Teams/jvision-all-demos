<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>機車行營運管理｜Jvision</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --accent:#0369a1; --accent2:#38bdf8; --ink:#0f2333; --muted:#64748b;
    --bg:#eef4f9; --card:#ffffff; --line:#e2ecf3; --soft:#f1f7fb;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --pur:#7c3aed;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  header.top{
    position:sticky;top:0;z-index:30; background:linear-gradient(100deg,#0b3a5c,#0369a1);
    color:#fff; box-shadow:0 2px 14px rgba(3,105,161,.28);
  }
  .top-inner{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;}
  .logo .msi{font-size:24px;color:#e0f2fe;}
  .brand b{font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
  .brand small{display:block;font-size:11px;color:#bae6fd;font-weight:400;}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
  nav button{
    flex:none;white-space:nowrap; border:0; cursor:pointer; font-family:inherit;
    background:rgba(255,255,255,.08); color:#e0f2fe; padding:8px 13px; border-radius:10px;
    font-size:13px; font-weight:600; display:flex;align-items:center;gap:7px; transition:.15s;
  }
  nav button .msi{font-size:19px;}
  nav button:hover{background:rgba(255,255,255,.2);}
  nav button.on{background:#fff;color:#0369a1;box-shadow:0 3px 10px rgba(0,0,0,.18);}
  main{max-width:1280px;margin:0 auto;padding:22px 18px 60px;}
  .scr-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;min-width:0;}
  .scr-ic{width:46px;height:46px;border-radius:13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(3,105,161,.3);}
  .scr-ic .msi{font-size:26px;}
  .scr-head h1{font-size:21px;margin:0;font-weight:700;}
  .scr-head p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card h3 .msi{font-size:20px;color:var(--accent);}
  .grid{display:grid;gap:16px;min-width:0;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g23{grid-template-columns:2fr 1fr;}
  .g32{grid-template-columns:1fr 1.6fr;}
  @media(max-width:820px){
    .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  }
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden;min-width:0;}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);}
  .kpi .lab{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .kpi .lab .msi{font-size:17px;color:var(--accent2);}
  .kpi .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:.5px;}
  .kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;}
  .kpi .dt{font-size:11.5px;margin-top:5px;font-weight:600;display:flex;align-items:center;gap:2px;}
  .up{color:var(--ok);} .down{color:var(--bad);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:var(--soft);color:var(--muted);font-weight:600;font-size:12px;}
  tbody tr:hover{background:#f8fbfd;}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.4;}
  .t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
  .t-bad{background:#fee2e2;color:#b91c1c;} .t-info{background:#e0f2fe;color:#0369a1;}
  .t-pur{background:#ede9fe;color:#6d28d9;} .t-gray{background:#e2e8f0;color:#475569;}
  .chart{width:100%;height:280px;min-width:0;}
  .bar{height:8px;border-radius:6px;background:#e5eef5;overflow:hidden;}
  .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .chip{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--soft);font-size:11.5px;color:var(--muted);font-weight:600;}
  .ov{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;}
  .board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:14px;min-width:760px;}
  .col{background:var(--soft);border-radius:14px;padding:12px;min-width:0;}
  .col-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:10px;padding:0 2px;}
  .col-h .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
  .wo{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,35,51,.05);}
  .wo b{font-size:13px;} .wo .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
  .wo .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;}
  .inv{border:1px dashed var(--line);border-radius:14px;padding:16px;background:var(--soft);}
  .inv-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed #d6e4ee;gap:10px;}
  .inv-row:last-child{border-bottom:0;}
  .inv-total{font-size:20px;font-weight:700;color:var(--accent);}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .subtitle{font-size:12px;color:var(--muted);margin:-8px 0 12px;}
  .prog-lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .hl{color:var(--accent);font-weight:700;}
  .mini{font-size:11.5px;color:var(--muted);font-weight:500;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.6s infinite;margin-right:2px;}
  @media(max-width:560px){ nav button span.txt{display:none;} nav button{padding:8px 10px;} }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo"><span class="msi">two_wheeler</span></div>

<main><div id="app"></div></main>

/* helper */
function money(n){ return "$"+(n||0).toLocaleString(); }
function statusTag(s){
  var m={"充足":"t-ok","偏低":"t-warn","警戒":"t-bad","已沖銷":"t-ok","部分":"t-warn","未收":"t-bad"};
  return '<span class="tag '+(m[s]||"t-gray")+'">'+s+'</span>';
}
function priTag(p){ return '<span class="tag '+(p==="急"?"t-bad":"t-info")+'">'+p+'</span>'; }
function kpi(ic,lab,val,unit,dir,dt){
  var arrow=dir==="up"?'<span class="msi" style="font-size:15px">arrow_upward</span>':(dir==="down"?'<span class="msi" style="font-size:15px">arrow_downward</span>':"");
  var cls=dir==="up"?"up":(dir==="down"?"down":"");
  return '<div class="kpi"><div class="lab"><span class="msi">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':"")+'</div>'+
    '<div class="dt '+cls+'">'+arrow+(dt||"")+'</div></div>';
}
function scrHead(ic,title,sub){
  return '<div class="scr-head"><div class="scr-ic"><span class="msi">'+ic+'</span></div>'+
    '<div style="min-width:0"><h1>'+title+'</h1><p>'+sub+'</p></div></div>';
}

/* ---------------- screens ---------------- */
/* 0 客戶車籍 */
function s0(){
  var rows=customers.map(function(c){
    var vt=c.vip==="金卡"?"t-warn":(c.vip==="銀卡"?"t-info":"t-gray");
    return '<tr><td><b>'+c.plate+'</b></td><td>'+c.owner+'</td><td>'+c.model+'</td>'+
      '<td>'+(c.cc>0?c.cc+"cc":"電動")+'</td><td>'+c.km.toLocaleString()+' km</td>'+
      '<td>'+c.last+'</td><td><span class="chip">'+c.next+'</span></td>'+
      '<td><span class="tag '+vt+'">'+c.vip+'</span></td></tr>';

  return scrHead("two_wheeler","客戶車籍","車主與車輛建檔、保養歷程與會員等級管理")+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("groups","建檔車主","1,284","位","up","本月新增 38")+
    kpi("two_wheeler","在籍車輛","1,536","台","up","含 214 台電動車")+
    kpi("event_repeat","本月待保養","47","台","","依里程排程")+

    '<div class="card"><h3><span class="msi">pie_chart</span>會員等級占比</h3><div id="c0" class="chart" style="height:300px"></div></div>'+
  '</div>';
}

/* 1 維修保養單 (看板) */
function s1(){
  function cardWO(w){
    return '<div class="wo"><b>'+w.no+'</b> '+priTag(w.pri)+
      '<div style="font-size:12.5px;margin-top:5px">'+w.item+'</div>'+

  '<div class="card"><h3><span class="msi">view_kanban</span>維修工單看板 <span class="live"></span><span class="mini">即時同步</span></h3>'+

      col("待受理／派工","inbox",workorders.wait)+
      col("維修中","build_circle",workorders.doing)+
      col("路試／檢驗","speed",workorders.test)+
      col("已完工","verified",workorders.done)+

/* 2 零件庫存 */
function s2(){
  var rows=parts.map(function(p){
    var pct=Math.min(100,Math.round(p.stock/(p.safe*1.6)*100));
    var col=p.st==="充足"?"var(--ok)":(p.st==="偏低"?"var(--warn)":"var(--bad)");
    return '<tr><td><span class="chip">'+p.sku+'</span></td><td><b>'+p.name+'</b></td>'+
      '<td>'+p.cat+'</td><td>'+p.stock+' '+p.unit+'</td><td>'+p.safe+'</td>'+
      '<td>'+money(p.price)+'</td>'+
      '<td style="min-width:130px"><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div></td>'+
      '<td>'+statusTag(p.st)+'</td></tr>';
  }).join("");
  return scrHead("inventory_2","零件庫存","料件安全庫存監控、進出料統計與補貨預警")+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("category","料件品項","386","項","","8 大類別")+
    kpi("warning","低於安全量","3","項","down","需補貨")+
    kpi("payments","庫存價值","$284K","","","含備品")+
    kpi("local_shipping","本週進料","64","件","up","3 家供應商")+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card"><h3><span class="msi">stacked_bar_chart</span>各類別週進出料</h3><div id="c2" class="chart"></div>'+
      '<div class="legend"><span><i style="background:#0369a1"></i>進料</span><span><i style="background:#38bdf8"></i>領用</span></div></div>'+
    '<div class="card"><h3><span class="msi">table_rows</span>零件庫存清單</h3>'+
      '<div class="ov"><table><thead><tr><th>料號</th><th>品名</th><th>類別</th><th>庫存</th><th>安全量</th><th>單價</th><th>水位</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '</div>';
}

/* 3 付款沖銷 */
function s3(){
  var rows=receivables.map(function(r){
    var pct=r.amt>0?Math.round(r.paid/r.amt*100):0;
    return '<tr><td><b>'+r.no+'</b></td><td>'+r.owner+'</td><td>'+money(r.amt)+'</td>'+
      '<td>'+money(r.paid)+'</td><td><span class="chip">'+r.method+'</span></td>'+
      '<td style="min-width:120px"><div class="prog-lab"><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></td>'+
      '<td>'+statusTag(r.st)+'</td><td>'+r.date+'</td></tr>';
  }).join("");
  var out=receivables.reduce(function(a,r){return a+(r.amt-r.paid);},0);
  return scrHead("receipt_long","付款沖銷","收款、賒帳與分期沖銷管理，掌握應收帳款")+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("account_balance_wallet","本月營收","$186,400","","up","較上月 +12%")+
    kpi("credit_score","已沖銷","$168,600","","","占 90.4%")+
    kpi("pending_actions","未收帳款",money(out),"","down","賒帳 4 筆")+
    kpi("percent","現金收款率","62","%","","LINE Pay 上升")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="msi">receipt</span>應收帳款與沖銷</h3>'+
      '<div class="ov"><table><thead><tr><th>單號</th><th>車主</th><th>應收</th><th>已收</th><th>方式</th><th>沖銷進度</th><th>狀態</th><th>日期</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="msi">donut_large</span>收款方式占比</h3><div id="c3" class="chart" style="height:300px"></div></div>'+
  '</div>';
}

/* 4 報表列印 (估價單) */
function s4(){
  var sub=invoiceItems.reduce(function(a,it){return a+it.qty*it.price;},0);
  var labor=invoiceItems.filter(function(it){return it.type==="工資";}).reduce(function(a,it){return a+it.qty*it.price;},0);
  var partSum=sub-labor;
  var tax=Math.round(sub*0.05);
  var total=sub+tax;
  var lines=invoiceItems.map(function(it){
    return '<div class="inv-row"><span>'+it.name+' <span class="chip">'+it.type+'</span> ×'+it.qty+'</span><span>'+money(it.qty*it.price)+'</span></div>';
  }).join("");
  return scrHead("print","報表列印","估價單、維修明細與月結報表產出與列印預覽")+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("description","本月估價單","218","張","up","轉工單 82%")+
    kpi("print","已列印明細","196","張","","含電子發票")+
    kpi("summarize","月結報表","6","份","","自動彙整")+
    kpi("forward_to_inbox","LINE 傳送","143","筆","up","車主接收")+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="msi">receipt_long</span>估價單預覽 EST-260812</h3>'+
      '<div class="subtitle">車主：林志明　車牌：BKR-1258　車型：勁戰六代 125</div>'+
      '<div class="inv">'+lines+
        '<div class="inv-row"><span>工資小計</span><span>'+money(labor)+'</span></div>'+
        '<div class="inv-row"><span>零件小計</span><span>'+money(partSum)+'</span></div>'+
        '<div class="inv-row"><span>營業稅 5%</span><span>'+money(tax)+'</span></div>'+
        '<div class="inv-row" style="margin-top:6px"><span style="font-weight:700">合計應付</span><span class="inv-total">'+money(total)+'</span></div>'+
      '</div>'+
      '<div class="pill-row"><span class="chip">列印估價單</span><span class="chip">轉為工單</span><span class="chip">LINE 傳送</span><span class="chip">開立發票</span></div></div>'+
    '<div class="card"><h3><span class="msi">bar_chart</span>近六月報表產出量</h3><div id="c4" class="chart"></div>'+
      '<div class="legend"><span><i style="background:#0369a1"></i>估價單</span><span><i style="background:#38bdf8"></i>維修明細</span></div></div>'+
  '</div>';
}

var SCR=[s0,s1,s2,s3,s4,s5];
function show(i){
  disposeCharts();
  var c=document.getElementById("app");
  c.innerHTML=SCR[i]();
  document.querySelectorAll("#nav button").forEach(function(b){
    b.classList.toggle("on", +b.getAttribute("data-i")===i);
  });
  void c.offsetHeight;
  initChart(i);
}

(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button data-i="'+n.i+'"><span class="msi">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }).join("");
  nav.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){ location.hash="v"+b.getAttribute("data-i"); show(+b.getAttribute("data-i")); });
  });
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
