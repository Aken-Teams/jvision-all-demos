<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>資本支出評估與管理系統 CAPEX</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --bg:#f6f5f8; --card:#ffffff;
  --ink:#1e1b24; --sub:#6b6577; --line:#eceaf0; --side:#231a2b; --side2:#160f1c;
  --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#7c3aed;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#efe9f2;display:flex;flex-direction:column;min-width:0}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(219,39,119,.4)}
.brand .logo .material-symbols-outlined{font-size:22px;color:#fff}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.2}
.brand span{font-size:11px;color:#b9adc4;display:block;margin-top:2px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:3px;padding:14px 12px;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#cabcd4;padding:11px 13px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),#be185d);color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.35)}
.nav .lbl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .foot{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9a8ea6;line-height:1.6}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:800;margin:0}
.top .sub{font-size:12.5px;color:var(--sub);margin-top:3px}
.top .spacer{flex:1;min-width:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fbe8f1;color:#be185d}
.pill .material-symbols-outlined{font-size:16px}
.wrap{padding:22px 26px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(30,27,36,.03)}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700}
.card .desc{font-size:12px;color:var(--sub);margin:0 0 14px}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .top-row{display:flex;align-items:center;justify-content:space-between}
.kpi .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .ico .material-symbols-outlined{font-size:22px}
.kpi .val{font-size:27px;font-weight:800;line-height:1;font-family:"Inter"}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chartbox{width:100%;overflow:hidden;min-width:0}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;font-weight:700;color:var(--sub);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:11.5px;letter-spacing:.3px}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf7fb}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#ffe4e6;color:#be123c}
.t-info{background:#ede9fe;color:#6d28d9}
.t-pink{background:#fbe8f1;color:#be185d}
.t-gray{background:#eef0f3;color:#475569}
.bar{height:8px;border-radius:999px;background:#eee;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter"}
.right{text-align:right}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.col{background:#faf8fb;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--sub)}
.tik{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tik:last-child{margin-bottom:0}
.tik .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tik .tt{font-size:12.8px;font-weight:700}
.tik .amt{font-size:12px;font-weight:800;color:var(--accent);font-family:"Inter"}
.tik .meta{font-size:11px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tik .lv{border-left:3px solid var(--accent);padding-left:7px}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev.done .dot{background:var(--accent)}
.tl .ev.wait .dot{border-color:#cbd5e1}
.tl .eh{font-size:13px;font-weight:700}
.tl .em{font-size:11.5px;color:var(--sub);margin-top:2px}
.tl .ed{font-size:11px;color:#9a94a6;margin-top:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dotc{width:10px;height:10px;border-radius:3px;flex:none}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.metric-row:last-child{border-bottom:0}
.metric-row .ml{font-size:12.5px;color:var(--sub);font-weight:600}
.metric-row .mv{font-size:15px;font-weight:800;font-family:"Inter"}
.hbar{display:flex;flex-direction:column;gap:11px}
.hbar .row{display:flex;align-items:center;gap:10px}
.hbar .nm{width:96px;flex:none;font-size:12px;font-weight:600;color:var(--ink)}
.hbar .track{flex:1;height:22px;background:#f1eef4;border-radius:7px;overflow:hidden;min-width:0}
.hbar .track>i{display:block;height:100%;border-radius:7px}
.hbar .vv{width:98px;flex:none;text-align:right;font-size:11.5px;font-weight:700;font-family:"Inter"}
.note{background:#fdf2f8;border:1px solid #fbcfe8;border-radius:12px;padding:13px 15px;font-size:12.3px;color:#9d174d;display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{font-size:19px;flex:none;color:var(--accent)}
.sechd{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.sechd .material-symbols-outlined{font-size:20px;color:var(--accent)}
.sechd b{font-size:14.5px}
.stepbar{display:flex;gap:6px;margin-top:8px}
.stepbar .s{flex:1;height:6px;border-radius:999px;background:#eee}
.stepbar .s.on{background:var(--accent)}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
  .brand{border-bottom:0;padding:14px 16px}
  .nav{flex-direction:row;flex-wrap:wrap;padding:0 12px 12px;gap:6px}
  .nav button{width:auto;padding:9px 12px}
  .side .foot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav .lbl{display:none}
  .nav button{padding:9px}
  .board{grid-template-columns:1fr}
  .wrap{padding:16px}
  .top{padding:14px 16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">savings</span></div>
      <div><b>CAPEX 評估管理</b><span>資本支出評估與管理系統</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">財務會計系統 · v2.4<br/>資料為展示用途，非真實財務數字</div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="ttl">投資組合總覽</h1>
        <div class="sub" id="sub">全公司資本支出提案與預算執行即時儀表板</div>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined">calendar_month</span>會計年度 FY2026</span>
      <span class="pill"><span class="material-symbols-outlined">account_balance</span>年度預算 8,400 萬</span>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function money(n){return n.toLocaleString("en-US");}
function el(id){return document.getElementById(id);}
function apex(id,opt){
  var node=document.getElementById(id);
  if(!node)return;
  if(!opt.chart)opt.chart={};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(node,opt);c.render();charts.push(c);}catch(e){}
}
var PINK="#db2777",PINK2="#f472b6",VIOLET="#7c3aed",AMBER="#f59e0b",GREEN="#16a34a",SLATE="#94a3b8";

var META=[
  {t:"投資組合總覽",s:"全公司資本支出提案與預算執行即時儀表板",ic:"dashboard"},
  {t:"投資案提案",s:"資本支出投資案建立、分類與提案佇列",ic:"request_quote"},
  {t:"財務評估",s:"ROI／IRR／NPV／回收期試算與門檻比對",ic:"insights"},
  {t:"分級核准",s:"依金額多層級簽核與授權額度控管",ic:"gavel"},
  {t:"預算執行追蹤",s:"動支進度、預實差異與里程碑付款",ic:"monitoring"},
  {t:"效益後評估",s:"實際回收比對與投資後審計稽核",ic:"fact_check"}
];

function statCard(ic,lab,val,unit,bg,cl){
  return '<div class="card kpi"><div class="top-row"><div class="ico" style="background:'+bg+'"><span class="material-symbols-outlined" style="color:'+cl+'">'+ic+'</span></div></div>'
    +'<div class="val">'+val+' <span style="font-size:14px;color:var(--sub);font-weight:600">'+unit+'</span></div><div class="lab">'+lab+'</div></div>';
}
function formField(lab,val){
  return '<div style="margin-bottom:11px"><div style="font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:5px">'+lab+'</div>'
    +'<div style="border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;font-weight:600;background:#faf8fb">'+val+'</div></div>';
}
function ticket(tt,id,cls,tag,meta){
  return '<div class="tik"><div class="r1"><div class="tt lv">'+tt+'</div><span class="tag '+cls+'">'+tag+'</span></div>'
    +'<div class="meta"><span class="mono">'+id+'</span> · '+meta+'</div></div>';
}
function col(title,cnt,cards){
  return '<div class="col"><h4>'+title+'<span class="cnt">'+cnt+'</span></h4>'+cards.join("")+'</div>';
}
function apCard(tt,id,amt,lvl,cls,who){
  return '<div class="tik"><div class="r1"><div class="tt">'+tt+'</div></div>'
    +'<div class="r1" style="margin-top:7px"><span class="amt">'+amt+'</span><span class="tag '+cls+'">'+lvl+'</span></div>'
    +'<div class="meta"><span class="mono">'+id+'</span> · '+who+'</div></div>';
}
function tlev(st,hd,m,d){
  return '<div class="ev '+st+'"><div class="dot"></div><div class="eh">'+hd+'</div><div class="em">'+m+'</div><div class="ed">'+d+'</div></div>';
}
function hb(nm,cl,w,vv){
  return '<div class="row"><div class="nm">'+nm+'</div><div class="track"><i style="width:'+w+'%;background:'+cl+'"></i></div><div class="vv">'+vv+'</div></div>';
}

/* ---------- SCREEN 0 : Portfolio Dashboard ---------- */
function s0(){
  var kpis=[
    {ic:"request_quote",bg:"#fbe8f1",cl:"#be185d",val:"32",lab:"進行中投資案",d:"+5",up:1},
    {ic:"account_balance_wallet",bg:"#ede9fe",cl:"#6d28d9",val:"6,180 萬",lab:"已核准金額",d:"73.6% 預算",up:1},
    {ic:"trending_up",bg:"#dcfce7",cl:"#15803d",val:"18.4%",lab:"組合平均 IRR",d:"+1.7pp",up:1},
    {ic:"warning",bg:"#fef3c7",cl:"#b45309",val:"4",lab:"超支預警案",d:"+1",up:0}
  ];
  var h='<div class="grid g4">';
  kpis.forEach(function(k){
    h+='<div class="card kpi"><div class="top-row"><div class="ico" style="background:'+k.bg+'"><span class="material-symbols-outlined" style="color:'+k.cl+'">'+k.ic+'</span></div>'
     +'<span class="delta '+(k.up?'up':'down')+'"><span class="material-symbols-outlined">'+(k.up?'trending_up':'trending_down')+'</span>'+k.d+'</span></div>'
     +'<div class="val">'+k.val+'</div><div class="lab">'+k.lab+'</div></div>';
  });
  h+='</div>';
  h+='<div class="grid g23" style="margin-top:16px">'
   +'<div class="card"><h3>各類別 CAPEX 預算 vs 動支（萬元）</h3><p class="desc">分類編列與實際動支比較，掌握執行進度</p><div class="chartbox" id="c0a"></div></div>'
   +'<div class="card"><h3>投資組合分布</h3><p class="desc">依投資類別占比</p><div class="chartbox" id="c0b"></div></div>'
   +'</div>';
  h+='<div class="grid g23" style="margin-top:16px">'
   +'<div class="card"><h3>年度累計動支趨勢</h3><p class="desc">預算上限與逐月實際動支</p><div class="chartbox" id="c0c"></div></div>'
   +'<div class="card"><div class="sechd"><span class="material-symbols-outlined">priority_high</span><b>需關注案件</b></div>'
   +ticket('產線二廠自動化改造','FED-2214','t-bad','超支 12%','里程碑 3 延誤')
   +ticket('AGV 無人搬運車導入','FED-2190','t-warn','待財務長核准','金額 1,850 萬')
   +ticket('太陽能屋頂建置','FED-2176','t-info','IRR 低於門檻','回收期 8.2 年')
   +ticket('MES 系統升級','FED-2158','t-warn','憑證缺漏退件','需補採購合約')
   +'</div></div>';
  el("view").innerHTML=h;
  void el("view").offsetHeight;
  apex("c0a",{
    chart:{type:"bar",height:300},
    series:[{name:"編列預算",data:[1800,1400,1200,900,760,540]},{name:"實際動支",data:[1520,1310,880,940,410,300]}],
    colors:[PINK2,PINK],
    plotOptions:{bar:{columnWidth:"58%",borderRadius:4}},
    dataLabels:{enabled:false},
    xaxis:{categories:["產能擴充","自動化","數位轉型","綠能節能","設施維護","研發設備"],labels:{style:{fontSize:"11px"},rotate:0,hideOverlappingLabels:false}},
    yaxis:{labels:{style:{fontSize:"11px"}}},
    legend:{position:"top",fontSize:"12px"},
    grid:{borderColor:"#eee"},
    tooltip:{shared:true,intersect:false}
  });
  apex("c0b",{
    chart:{type:"donut",height:300},
    series:[34,26,16,12,8,4],
    labels:["產能擴充","自動化","數位轉型","綠能節能","設施維護","研發設備"],
    colors:[PINK,PINK2,VIOLET,GREEN,AMBER,SLATE],
    legend:{position:"bottom",fontSize:"11px"},
    dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";},style:{fontSize:"10px"}},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"投資案",fontSize:"12px",formatter:function(){return"32 件";}}}}}}
  });
  apex("c0c",{
    chart:{type:"line",height:280},
    series:[{name:"年度預算上限",data:[8400,8400,8400,8400,8400,8400,8400,8400]},{name:"累計動支",data:[820,1640,2380,3150,4020,4780,5510,6180]}],
    colors:[SLATE,PINK],
    stroke:{width:[2,3],dashArray:[6,0],curve:"smooth"},
    dataLabels:{enabled:false},
    xaxis:{categories:["1月","2月","3月","4月","5月","6月","7月","8月"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{style:{fontSize:"11px"},formatter:function(v){return(v/1000).toFixed(1)+"K";}}},
    legend:{position:"top",fontSize:"12px"},
    grid:{borderColor:"#eee"},
    markers:{size:0},
    tooltip:{shared:true,intersect:false}
  });
}

/* ---------- SCREEN 1 : Proposal ---------- */
function s1(){
  var rows=[
    ["FED-2231","智慧倉儲立體庫改造","產能擴充","2,400","陳建宏 / 生產部","t-info","評估中"],
    ["FED-2229","射出機汰換 8 台","自動化","1,680","林思妤 / 設備部","t-pink","待提交"],
    ["FED-2226","AI 品質檢測系統","數位轉型","950","王志豪 / 品保部","t-info","評估中"],
    ["FED-2222","廠區空壓系統節能","綠能節能","620","黃郁婷 / 工務部","t-ok","已送核"],
    ["FED-2218","研發實驗室設備","研發設備","1,350","張文彬 / 研發部","t-pink","待提交"],
    ["FED-2214","產線二廠自動化改造","自動化","3,200","蔡佩蓉 / 生產部","t-ok","已送核"],
    ["FED-2210","ERP 雲端遷移","數位轉型","880","周家豪 / 資訊部","t-warn","退件補件"]
  ];
  var h='<div class="grid g3">'
   +statCard("request_quote","本月新增提案","14","件","#fbe8f1","#be185d")
   +statCard("payments","提案累計金額","1.16 億","元","#ede9fe","#6d28d9")
   +statCard("pending_actions","待提交","9","件","#fef3c7","#b45309")
   +'</div>';

  h+='<div class="grid g32" style="margin-top:16px">';

var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var n=el("nav"),h="";
  META.forEach(function(m,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.ic+'</span><span class="lbl">'+m.t+'</span></button>';
  });
  n.innerHTML=h;
  var btns=n.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  destroyCharts();
  var m=META[i]||META[0];
  el("ttl").textContent=m.t;
  el("sub").textContent=m.s;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  (SCREENS[i]||SCREENS[0])();
  try{location.hash="v"+i;}catch(e){}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
