<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業投資支出評估管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --bg:#020617;
  --card:#0E1223;
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#F87171;
  --info:#60A5FA;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(51,65,85,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.16) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:#050914;border-right:2px solid var(--line);z-index:5
}
.brand{padding:24px 20px;border-bottom:2px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;display:grid;place-items:center;flex:none;
  background:var(--color-accent);color:var(--color-on-accent);
  border:2px solid #86EFAC;box-shadow:6px 6px 0 #14532D
}
.logo .material-symbols-outlined{font-size:25px}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:.04em}
.brand small{display:block;margin-top:5px;color:#CBD5E1;font-size:10px;line-height:1.45}
.eyebrow{
  display:inline-block;margin-bottom:12px;color:var(--color-accent);
  font:600 10px/1 "Fira Code",monospace;letter-spacing:.16em;text-transform:uppercase
}
.nav{display:flex;flex-direction:column;padding:14px 0}
.nav button{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  min-height:48px;padding:11px 18px;border:0;border-bottom:1px solid #1E293B;
  background:transparent;color:#CBD5E1;text-align:left;font-size:13px;font-weight:600
}
.nav button:first-child{border-top:1px solid #1E293B}
.nav button:hover{background:#172033;color:#fff}
.nav button.on{background:var(--color-accent);color:var(--color-on-accent)}
.nav button.on:after{content:"";position:absolute;right:-2px;top:0;bottom:0;width:7px;background:#fff}
.nav .material-symbols-outlined{font-size:20px}
.nav-index{font:600 10px "Fira Code",monospace;opacity:.75}
.side .foot{
  margin-top:auto;padding:17px 18px;border-top:2px solid var(--line);
  color:#94A3B8;font:11px/1.7 "Fira Code",monospace
}
.main{min-width:0}
.top{
  min-height:92px;padding:18px 28px;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;background:rgba(2,6,23,.94);border-bottom:2px solid var(--line);
  position:sticky;top:0;z-index:4
}
.top h1{margin:0;font-size:clamp(19px,2vw,27px);line-height:1.1;font-weight:800;letter-spacing:-.025em}
.top .sub{margin-top:7px;color:#CBD5E1;font-size:12px}
.top .spacer{flex:1}
.pill{
  min-height:36px;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;
  background:var(--color-muted);border:1px solid #475569;color:#E2E8F0;
  font:600 11px "Fira Code",monospace;white-space:nowrap
}
.pill.accent{background:var(--color-accent);border-color:#86EFAC;color:var(--color-on-accent)}
.pill .material-symbols-outlined{font-size:17px}
.wrap{padding:24px 28px 38px;max-width:1680px;margin:auto}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.65fr)}
.card{
  position:relative;min-width:0;padding:17px;background:var(--card);
  border:1px solid var(--line);box-shadow:5px 5px 0 #050914
}
.card:before{content:"";position:absolute;left:-1px;top:-1px;width:32px;height:4px;background:var(--color-accent)}
.card h3{margin:0 0 4px;font-size:14px;font-weight:800}
.card .desc{margin:0 0 13px;color:#AAB8CC;font-size:11.5px}
.kpi{min-height:143px;display:flex;flex-direction:column;gap:9px}
.kpi .top-row{display:flex;justify-content:space-between;align-items:start}
.kpi .ico{
  width:39px;height:39px;display:grid;place-items:center;
  border:1px solid currentColor;background:#172033!important
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .val{
  margin-top:auto;font:700 clamp(23px,2.5vw,32px)/1 "Fira Code",monospace;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums
}
.kpi .lab{color:#CBD5E1;font-size:11.5px;font-weight:600}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;font:600 10.5px "Fira Code",monospace}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chartbox{width:100%;min-width:0;overflow:hidden}
.sechd{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sechd .material-symbols-outlined{font-size:20px;color:var(--color-accent)}
.sechd b{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:10px;border:1px solid #475569;background:#172033;color:#E2E8F0;
  text-align:left;font:600 10.5px "Fira Code",monospace;letter-spacing:.02em;white-space:nowrap
}
td{padding:11px 10px;border:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#11172A}
tbody tr:hover{background:#1A2438}
.right{text-align:right}
.mono,.amt,.mv,.vv{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
td.right{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 7px;
  border:1px solid currentColor;font-size:10.5px;font-weight:700
}
.tag:before{content:"";width:6px;height:6px;background:currentColor}
.t-ok{color:#86EFAC;background:#0D2D20}
.t-warn{color:#FCD34D;background:#35270A}
.t-bad{color:#FCA5A5;background:#3A121B}
.t-info{color:#93C5FD;background:#102A4C}
.t-pink{color:#C4B5FD;background:#251A4A}
.t-gray{color:#CBD5E1;background:#1E293B}
.board{display:grid;grid-template-columns:repeat(4,minmax(235px,1fr));gap:12px}
.col{min-width:0;padding:11px;background:#080D1A;border:1px solid var(--line)}
.col h4{
  margin:0 0 10px;padding-bottom:9px;display:flex;justify-content:space-between;
  border-bottom:2px solid var(--line);font-size:12px
}
.cnt{padding:1px 7px;background:var(--color-accent);color:var(--color-on-accent);font:700 10px "Fira Code",monospace}
.tik{margin-bottom:9px;padding:10px;background:var(--card);border:1px solid #475569}
.tik:last-child{margin-bottom:0}
.tik .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tik .tt{font-size:12px;font-weight:700}
.tik .amt{color:#86EFAC;font-size:11px;font-weight:700}
.tik .meta{margin-top:7px;color:#AAB8CC;font-size:10.5px;line-height:1.5}
.tik .lv{padding-left:8px;border-left:4px solid var(--color-accent)}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#475569}
.tl .ev{position:relative;padding:0 0 17px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{
  position:absolute;left:-26px;top:1px;width:15px;height:15px;
  background:var(--card);border:3px solid var(--color-accent)
}
.tl .done .dot{background:var(--color-accent)}
.tl .wait .dot{border-color:#94A3B8;background:var(--card)}
.tl .eh{font-size:12px;font-weight:700}
.tl .em{margin-top:3px;color:#CBD5E1;font-size:11px}
.tl .ed{margin-top:3px;color:#94A3B8;font:10.5px/1.5 "Fira Code",monospace}
.legend{display:flex;gap:15px;flex-wrap:wrap;color:#CBD5E1;font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dotc{width:10px;height:10px;border:1px solid #fff}
.metric-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.metric-row .ml{color:#CBD5E1;font-size:11.5px;font-weight:600}
.metric-row .mv{font-size:14px;font-weight:700;text-align:right}
.hbar{display:flex;flex-direction:column;gap:12px}
.hbar .row{display:flex;align-items:center;gap:10px}
.hbar .nm{width:96px;flex:none;color:#E2E8F0;font-size:11px;font-weight:600}
.hbar .track{flex:1;height:20px;background:#080D1A;border:1px solid #475569;overflow:hidden}
.hbar .track>i{display:block;height:100%}
.hbar .vv{width:112px;flex:none;text-align:right;color:#E2E8F0;font-size:10.5px;font-weight:600}
.note{
  display:flex;align-items:flex-start;gap:9px;padding:12px 13px;
  background:#0B291C;border:1px solid #22C55E;color:#D1FAE5;font-size:11.5px;line-height:1.55
}
.note .material-symbols-outlined{flex:none;color:#86EFAC;font-size:19px}
.bar{height:9px;min-width:60px;background:#080D1A;border:1px solid #475569;overflow:hidden}
.bar>i{display:block;height:100%}
.stepbar{display:flex;gap:5px;margin-top:6px}
.stepbar .s{height:7px;flex:1;background:#1E293B;border:1px solid #475569}
.stepbar .s.on{background:var(--color-accent);border-color:#86EFAC}
.form-label{margin:0 0 5px;color:#CBD5E1;font-size:10.5px;font-weight:600}
.form-value{padding:10px 11px;background:#080D1A;border:1px solid #475569;font-size:12px;font-weight:600}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;width:100%;height:auto}
  .brand{padding:15px 16px}
  .eyebrow,.side .foot{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,1fr);padding:0;overflow-x:auto}
  .nav button{min-width:110px;justify-content:center;padding:10px 8px;border-right:1px solid #334155}
  .nav button.on:after{left:0;right:0;top:auto;bottom:0;width:auto;height:5px}
  .nav-index{display:none}
  .top{position:static;padding:16px}
  .wrap{padding:18px 16px 30px}
}
@media(max-width:620px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .top .spacer{display:none}
  .top{align-items:flex-start}
  .top>div:first-child{width:100%}
  .pill{flex:1;justify-content:center}
  .board{grid-template-columns:1fr}
  .card{padding:14px;box-shadow:3px 3px 0 #050914}
  .nav button{min-width:54px}
  .nav .lbl{display:none}
  .kpi{min-height:125px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="eyebrow">Finance / Capital Gateway</span>
      <div class="brand-row">
        <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">account_balance</span></div>
        <div><b>企業投資支出評估</b><small>資本支出評估與管理系統</small></div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot">FINANCE ACCOUNTING LEDGER<br>CAPEX CONTROL · v2.4<br>資料為展示用途，非真實財務數字</div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="ttl">投資組合總覽</h1>
        <div class="sub" id="sub">全公司資本支出提案與預算執行即時儀表板</div>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>會計年度 FY2026</span>
      <span class="pill accent"><span class="material-symbols-outlined" aria-hidden="true">account_balance_wallet</span>年度預算 8,400 萬</span>
    </header>
    <div class="wrap"><div id="view" class="reveal"></div></div>
  </main>
</div>
<script>
"use strict";
var charts=[];
function el(id){return document.getElementById(id)}
function money(n){return n.toLocaleString("en-US")}
function destroyCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
var GREEN="#22C55E",GREEN2="#86EFAC",BLUE="#60A5FA",AMBER="#FBBF24",RED="#EF4444",VIOLET="#A78BFA",SLATE="#94A3B8";
function apex(id,opt){
  var node=el(id);if(!node)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='"Fira Sans",sans-serif';
  opt.chart.foreColor="#CBD5E1";
  opt.chart.toolbar={show:false};
  opt.theme={mode:"dark"};
  opt.grid=opt.grid||{};opt.grid.borderColor="#334155";
  opt.tooltip=opt.tooltip||{};opt.tooltip.theme="dark";
  try{var c=new ApexCharts(node,opt);c.render();charts.push(c)}catch(e){}
}
var META=[
 {t:"投資組合總覽",s:"全公司資本支出提案與預算執行即時儀表板",ic:"dashboard"},
 {t:"投資案提案",s:"資本支出投資案建立、分類與提案佇列",ic:"request_quote"},
 {t:"財務評估",s:"ROI／IRR／NPV／回收期試算與門檻比對",ic:"insights"},
 {t:"分級核准",s:"依金額多層級簽核與授權額度控管",ic:"gavel"},
 {t:"預算執行追蹤",s:"動支進度、預實差異與里程碑付款",ic:"monitoring"},
 {t:"效益後評估",s:"實際回收比對與投資後審計稽核",ic:"fact_check"}
];
function statCard(ic,lab,val,unit,cl){
 return '<div class="card kpi"><div class="top-row"><div class="ico" style="color:'+cl+'"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div></div><div class="val">'+val+' <span style="font:600 12px Fira Sans;color:#CBD5E1">'+unit+'</span></div><div class="lab">'+lab+'</div></div>'
}
function formField(lab,val){return '<div style="margin-bottom:11px"><div class="form-label">'+lab+'</div><div class="form-value">'+val+'</div></div>'}
function ticket(tt,id,cls,tag,meta){return '<div class="tik"><div class="r1"><div class="tt lv">'+tt+'</div><span class="tag '+cls+'">'+tag+'</span></div><div class="meta"><span class="mono">'+id+'</span> · '+meta+'</div></div>'}
function col(title,cnt,cards){return '<div class="col"><h4>'+title+'<span class="cnt">'+cnt+'</span></h4>'+cards.join("")+'</div>'}
function apCard(tt,id,amt,lvl,cls,who){return '<div class="tik"><div class="r1"><div class="tt">'+tt+'</div></div><div class="r1" style="margin-top:7px"><span class="amt">'+amt+'</span><span class="tag '+cls+'">'+lvl+'</span></div><div class="meta"><span class="mono">'+id+'</span> · '+who+'</div></div>'}
function tlev(st,hd,m,d){return '<div class="ev '+st+'"><div class="dot"></div><div class="eh">'+hd+'</div><div class="em">'+m+'</div><div class="ed">'+d+'</div></div>'}
function hb(nm,cl,w,vv){return '<div class="row"><div class="nm">'+nm+'</div><div class="track"><i style="width:'+w+'%;background:'+cl+'"></i></div><div class="vv">'+vv+'</div></div>'}

function s0(){
 var k=[
  ["request_quote","32","進行中投資案","+5",1,BLUE],
  ["account_balance_wallet","6,180 萬","已核准金額","73.6% 預算",1,VIOLET],
  ["trending_up","18.4%","組合平均 IRR","+1.7pp",1,GREEN2],
  ["warning","4","超支預警案","+1",0,AMBER]
 ],h='<div class="grid g4">';
 k.forEach(function(x){h+='<div class="card kpi"><div class="top-row"><div class="ico" style="color:'+x[5]+'"><span class="material-symbols-outlined" aria-hidden="true">'+x[0]+'</span></div><span class="delta '+(x[4]?"up":"down")+'"><span class="material-symbols-outlined" aria-hidden="true">'+(x[4]?"trending_up":"trending_down")+'</span>'+x[3]+'</span></div><div class="val">'+x[1]+'</div><div class="lab">'+x[2]+'</div></div>'});
 h+='</div><div class="grid g23" style="margin-top:14px"><div class="card"><h3>各類別 CAPEX 預算 vs 動支（萬元）</h3><p class="desc">分類編列與實際動支比較，掌握執行進度</p><div class="chartbox" id="c0a"></div></div><div class="card"><h3>投資組合分布</h3><p class="desc">依投資類別占比</p><div class="chartbox" id="c0b"></div></div></div>';
 h+='<div class="grid g23" style="margin-top:14px"><div class="card"><h3>年度累計動支趨勢</h3><p class="desc">預算上限與逐月實際動支</p><div class="chartbox" id="c0c"></div></div><div class="card"><div class="sechd"><span class="material-symbols-outlined">priority_high</span><b>需關注案件</b></div>'+ticket("產線二廠自動化改造","FED-2214","t-bad","超支 12%","里程碑 3 延誤")+ticket("AGV 無人搬運車導入","FED-2190","t-warn","待財務長核准","金額 1,850 萬")+ticket("太陽能屋頂建置","FED-2176","t-info","IRR 低於門檻","回收期 8.2 年")+ticket("MES 系統升級","FED-2158","t-warn","憑證缺漏退件","需補採購合約")+'</div></div>';
 el("view").innerHTML=h;
