<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>預算管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="從年度預算編製、審核、控管到差異分析與現金流預測的財務即時掌握（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --red:#dc2626; --red-d:#b91c1c; --org:#f97316; --ink:#1f1416; --body:#4b3f42; --muted:#9a8b8e; --line:#efe4e5; --bg:#faf6f6; --green:#16a34a; --amber:#d97706; --blue:#2563eb; --card:#fff; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .shell{ display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  .side{ background:linear-gradient(180deg,#2a1416,#1a0d0e); color:#f7e9ea; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand{ padding:20px 18px; display:flex; align-items:center; gap:11px; border-bottom:1px solid rgba(255,255,255,.1); }
  .brand .lg{ width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--red),var(--org)); color:#fff; display:grid; place-content:center; }
  .brand .lg .material-symbols-outlined{ font-size:24px; }
  .brand b{ color:#fff; font-size:15px; display:block; letter-spacing:.02em; } .brand small{ color:#d9b8ba; font-size:11px; }
  .nav{ flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .nav .t{ font-size:10px; font-weight:800; letter-spacing:.1em; color:#c99a9c; padding:10px 12px 6px; }
  .nav button{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0; color:#f0dcdd; font:inherit; font-size:14px; font-weight:600; padding:11px 12px; border-radius:11px; cursor:pointer; }
  .nav button .material-symbols-outlined{ font-size:21px; color:#e0a9ab; }
  .nav button:hover{ background:rgba(255,255,255,.08); } .nav button.on{ background:linear-gradient(135deg,var(--red),var(--red-d)); color:#fff; } .nav button.on .material-symbols-outlined{ color:#fff; }
  .side-f{ padding:16px 18px; border-top:1px solid rgba(255,255,255,.1); }
  .fy{ font-size:11px; color:#d9b8ba; } .fy b{ color:#fff; font-size:16px; display:block; margin-bottom:6px; } .fybar{ height:7px; border-radius:999px; background:rgba(255,255,255,.16); overflow:hidden; } .fybar span{ display:block; height:100%; background:linear-gradient(90deg,var(--org),var(--red)); }
  .main{ min-width:0; }
  .top{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px; }
  .top h1{ margin:0; font-size:19px; font-weight:900; color:var(--ink); } .top .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--red-d); background:#fef2f2; border:1px solid #fde0e0; border-radius:999px; padding:6px 12px; } .pill .material-symbols-outlined{ font-size:16px; }
  .ava{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--red),var(--org)); color:#fff; font-weight:800; display:grid; place-content:center; }
  .body{ padding:22px 26px 46px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--red); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; } .btn.ghost{ background:#fff; color:var(--red); border:1px solid var(--line); } .btn.sm{ height:30px; padding:0 11px; font-size:12px; } .btn .material-symbols-outlined{ font-size:18px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; } .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); } .vh p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
  .kpis>*{ min-width:0; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; position:relative; overflow:hidden; } .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); } .kpi.o::before{ background:var(--org); } .kpi.g::before{ background:var(--green); } .kpi.b::before{ background:var(--blue); }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; align-items:center; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--red); } .kpi .v{ font-size:26px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; } .kpi .d{ font-size:12px; font-weight:800; margin-top:4px; color:var(--green); } .kpi .d.dn{ color:var(--red); }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1.6fr 1fr; } .g12{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:1fr 1fr 1fr; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; } .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--red); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--red); cursor:pointer; }
  .chart{ width:100%; height:280px; overflow:hidden; }
  .chart.sm{ height:230px; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; } .tbl th{ text-align:left; font-size:11px; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:var(--bg); white-space:nowrap; } .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:#fdf7f7; } .tbl .num{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; } .t-ok{ background:#dcfce7; color:#166534; } .t-warn{ background:#fef3c7; color:#92400e; } .t-bad{ background:#fee2e2; color:#991b1b; } .t-info{ background:#e0edff; color:#1e40af; } .t-mut{ background:#f1e9ea; color:#7a6b6e; }
  .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; min-width:70px; } .bar span{ display:block; height:100%; border-radius:999px; }
  .prog2{ display:flex; align-items:center; gap:9px; } .prog2 b{ font-size:12px; color:var(--ink); font-weight:800; white-space:nowrap; }
  .board{ display:grid; grid-template-columns:repeat(4,minmax(210px,1fr)); gap:12px; }
  .bcol{ background:var(--bg); border:1px solid var(--line); border-radius:13px; padding:11px; min-width:0; } .bch{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .bch b{ color:var(--ink); font-size:13px; } .bch .sum{ font-size:11px; font-weight:800; color:var(--red); background:#fef2f2; border-radius:999px; padding:2px 9px; }
  .req{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:9px; box-shadow:0 1px 3px rgba(31,20,22,.05); } .req b{ color:var(--ink); font-size:13px; display:block; } .req .amt{ color:var(--red-d); font-weight:900; font-size:15px; margin:5px 0; } .req small{ color:var(--muted); font-size:11px; display:block; } .req .meta{ display:flex; align-items:center; gap:6px; margin-top:7px; } .av2{ width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,var(--red),var(--org)); color:#fff; font-size:10px; font-weight:800; display:grid; place-content:center; }
  .tl-i{ display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); } .tl-i:first-of-type{ border-top:0; } .tl-ic{ width:34px; height:34px; border-radius:10px; display:grid; place-content:center; flex:none; color:#fff; } .tl-ic .material-symbols-outlined{ font-size:19px; } .tl-i b{ color:var(--ink); font-size:13px; } .tl-i small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; } .tl-i .when{ margin-left:auto; font-size:11px; color:#b3a4a7; white-space:nowrap; }
  .alert{ display:flex; gap:11px; align-items:flex-start; border-radius:12px; padding:12px 14px; margin-bottom:10px; border:1px solid; } .alert.hi{ background:#fef2f2; border-color:#fdcaca; } .alert.md{ background:#fff7ed; border-color:#fed7aa; } .alert.lo{ background:#f0f9ff; border-color:#bae6fd; } .alert .aic{ width:30px; height:30px; border-radius:9px; display:grid; place-content:center; flex:none; color:#fff; } .alert.hi .aic{ background:var(--red); } .alert.md .aic{ background:var(--org); } .alert.lo .aic{ background:var(--blue); } .alert .aic .material-symbols-outlined{ font-size:18px; } .alert b{ color:var(--ink); font-size:13px; } .alert p{ margin:2px 0 0; font-size:12px; color:var(--body); line-height:1.5; }
  .steps-v .sv{ display:flex; gap:12px; padding-bottom:14px; position:relative; } .steps-v .sv:not(:last-child)::before{ content:""; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:var(--line); } .steps-v .sic{ width:32px; height:32px; border-radius:50%; display:grid; place-content:center; flex:none; font-size:13px; font-weight:900; z-index:1; } .steps-v .sv.done .sic{ background:var(--green); color:#fff; } .steps-v .sv.now .sic{ background:var(--red); color:#fff; } .steps-v .sv.wait .sic{ background:var(--line); color:var(--muted); } .steps-v .sv b{ color:var(--ink); font-size:13px; } .steps-v .sv small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .flow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; } .fstep{ display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; color:var(--body); } .fstep.act{ background:var(--red); color:#fff; border-color:var(--red); } .fstep .n{ width:20px; height:20px; border-radius:50%; background:var(--bg); color:var(--red); font-weight:900; display:grid; place-content:center; font-size:11px; } .fstep.act .n{ background:rgba(255,255,255,.25); color:#fff; } .farr{ color:var(--muted); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--body); margin-top:10px; } .legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px; }
  @media (max-width:860px){ .shell{ grid-template-columns:1fr; } .shell>*{ min-width:0; } .side{ position:static; height:auto; min-width:0; } .brand{ border-bottom:0; } .nav{ flex-direction:row; overflow-x:auto; padding:10px 12px; } .nav button{ white-space:nowrap; flex:none; } .nav .t,.side-f{ display:none; } .main{ min-width:0; } .g2,.g12,.g3{ grid-template-columns:1fr; } .board{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .top{ flex-wrap:wrap; padding:12px 16px; } .body{ padding:16px 14px 30px; } .kpis{ grid-template-columns:1fr 1fr; } .nav button span:not(.material-symbols-outlined){ display:none; } .nav button{ padding:11px; } .top .pill span:not(.material-symbols-outlined){ display:none; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">savings</span></span><div><b>預算管理系統</b><small>元O集團 · FY2026</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><div class="fy"><b>年度預算執行率</b>已動用 62.4%<div class="fybar"><span style="width:62.4%;"></span></div></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">預算總覽儀表板</h1><div class="sub" id="vsub">集團 · 財年 2026 · 更新於 08:42</div></div>
      <div class="r"><span class="pill"><span class="material-symbols-outlined">notifications_active</span><span>4 項超支預警</span></span><span class="ava">財</span></div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
(function(){
  var MODS=[
    ["dashboard","預算總覽儀表板","集團預算達成、剩餘與健康度即時概覽"],
    ["request_quote","年度預算編製","各部門逐科目編列、版本控管與試算"],
    ["fact_check","審核簽核流程","多層級呈核、退回修正與核定歸檔"],
    ["monitoring","執行控管追蹤","動用凍結、超支預警與科目控管"],
    ["insights","差異分析","實際對預算差異、原因歸類與趨勢"],
    ["trending_up","現金流預測","收支排程、資金缺口與滾動預測"]
  ];
  var charts=[];
  function clearCharts(){ for(var i=0;i<charts.length;i++){ try{ charts[i].dispose(); }catch(e){} } charts=[]; }
  function mk(id,opt){ var el=document.getElementById(id); if(!el) return; var c=echarts.init(el); c.setOption(opt); charts.push(c); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function money(n){ return n.toLocaleString("en-US"); }
  var GRID={left:"3%",right:"4%",top:"14%",bottom:"6%",containLabel:true};
  var AXLINE={lineStyle:{color:"#e6dcdd"}};
  var AXLABEL={color:"#9a8b8e",fontSize:11};
  var SPLIT={lineStyle:{color:"#f2eaeb"}};

  // ---- screen 0: dashboard ----
  function s0(){
    var deps=[
      ["生產製造",42000,27300],["研發技術",28000,15600],["行銷業務",19500,14800],
      ["資訊系統",12600,7100],["行政管理",9800,6400],["人力資源",8200,5900]
    ];
    var rows=deps.map(function(d){
      var pct=Math.round(d[2]/d[1]*100); var cls=pct>=90?"t-bad":pct>=75?"t-warn":"t-ok"; var bc=pct>=90?"var(--red)":pct>=75?"var(--org)":"var(--green)";
      return '<tr><td><b style="color:var(--ink)">'+esc(d[0])+'</b></td><td class="num">'+money(d[1])+'</td><td class="num">'+money(d[2])+'</td>'+
        '<td class="num">'+money(d[1]-d[2])+'</td><td><div class="prog2"><div class="bar" style="flex:1"><span style="width:'+Math.min(pct,100)+'%;background:'+bc+'"></span></div><b>'+pct+'%</b></div></td>'+
        '<td><span class="tag '+cls+'">'+(pct>=90?"逼近上限":pct>=75?"留意":"健康")+'</span></td></tr>';
    }).join("");
    return ''+
    '<div class="vh"><div><h2>預算總覽儀表板</h2><p>集團 FY2026 年度預算 120,100 千元 · 已核定 6 部門 · 即時動用監控</p></div><button class="btn"><span class="material-symbols-outlined">download</span>匯出月報</button></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="l"><span class="material-symbols-outlined">account_balance</span>年度總預算</div><div class="v">120,100<small> 千元</small></div><div class="d">6 部門 · 42 科目</div></div>'+
      '<div class="kpi o"><div class="l"><span class="material-symbols-outlined">payments</span>累計動用</div><div class="v">74,940<small> 千元</small></div><div class="d dn">執行率 62.4%</div></div>'+
      '<div class="kpi g"><div class="l"><span class="material-symbols-outlined">savings</span>可用餘額</div><div class="v">45,160<small> 千元</small></div><div class="d">佔比 37.6%</div></div>'+
      '<div class="kpi b"><div class="l"><span class="material-symbols-outlined">warning</span>超支/預警科目</div><div class="v">4<small> 項</small></div><div class="d dn">需審視動用</div></div>'+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各部門預算 vs. 累計動用<span class="grow">千元</span></h3><div id="c0a" class="chart"></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>預算配置結構</h3><div id="c0b" class="chart"></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:18px"><h3><span class="material-symbols-outlined">table_chart</span>部門預算執行明細</h3>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>部門</th><th style="text-align:right">核定預算</th><th style="text-align:right">累計動用</th><th style="text-align:right">餘額</th><th>執行率</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
  function d0(){
    var deps=[["生產製造",42000,27300],["研發技術",28000,15600],["行銷業務",19500,14800],["資訊系統",12600,7100],["行政管理",9800,6400],["人力資源",8200,5900]];
    mk("c0a",{grid:GRID,tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{data:["核定預算","累計動用"],top:0,textStyle:{fontSize:11,color:"#4b3f42"}},
      xAxis:{type:"category",data:deps.map(function(d){return d[0];}),axisLine:AXLINE,axisLabel:{color:"#9a8b8e",fontSize:10,interval:0,rotate:20}},
      yAxis:{type:"value",axisLine:AXLINE,axisLabel:AXLABEL,splitLine:SPLIT},
      series:[
        {name:"核定預算",type:"bar",data:deps.map(function(d){return d[1];}),itemStyle:{color:"#fca5a5",borderRadius:[4,4,0,0]},barWidth:14},
        {name:"累計動用",type:"bar",data:deps.map(function(d){return d[2];}),itemStyle:{color:"#dc2626",borderRadius:[4,4,0,0]},barWidth:14}
      ]});
    mk("c0b",{tooltip:{trigger:"item",formatter:"{b}: {c} 千元 ({d}%)"},legend:{bottom:0,textStyle:{fontSize:11,color:"#4b3f42"}},
      series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],avoidLabelOverlap:true,itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
        data:[{value:42000,name:"生產製造",itemStyle:{color:"#dc2626"}},{value:28000,name:"研發技術",itemStyle:{color:"#f97316"}},{value:19500,name:"行銷業務",itemStyle:{color:"#fbbf24"}},{value:12600,name:"資訊系統",itemStyle:{color:"#2563eb"}},{value:9800,name:"行政管理",itemStyle:{color:"#16a34a"}},{value:8200,name:"人力資源",itemStyle:{color:"#a855f7"}}]}]});
  }

  // ---- screen 1: budget preparation ----
  function s1(){
    var items=[
      ["6101","薪資獎金","人事費",8600,8420,"已試算"],
      ["6203","差旅交通","營業費",1200,1350,"超編"],
      ["6310","原物料採購","製造費",21500,21500,"已試算"],
      ["6415","設備維護","製造費",3400,3180,"已試算"],
      ["6520","廣告行銷","營業費",4800,5200,"超編"],
      ["6640","教育訓練","管理費",900,760,"草案"],
      ["6712","資訊軟體","管理費",2600,2600,"已試算"],
      ["6830","研發試作","研發費",6200,5900,"草案"]
    ];
    var body=items.map(function(it){
      var over=it[4]>it[3]; var diff=it[4]-it[3]; var st=it[5]==="超編"?"t-bad":it[5]==="草案"?"t-mut":"t-ok";
      return '<tr><td>'+esc(it[0])+'</td><td><b style="color:var(--ink)">'+esc(it[1])+'</b></td><td><span class="tag t-info">'+esc(it[2])+'</span></td>'+
        '<td class="num">'+money(it[3])+'</td><td class="num">'+money(it[4])+'</td>'+
        '<td class="num" style="color:'+(over?"var(--red)":diff<0?"var(--green)":"var(--ink)")+'">'+(diff>0?"+":"")+money(diff)+'</td>'+
        '<td><span class="tag '+st+'">'+esc(it[5])+'</span></td></tr>';
    }).join("");
    return ''+

      '<div class="kpi b"><div class="l"><span class="material-symbols-outlined">savings</span>建議動用額度</div><div class="v">10,000<small> 千元</small></div><div class="d">短期融資緩衝</div></div>'+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">stacked_line_chart</span>13 週現金水位預測<span class="grow">千元</span></h3><div id="c5a" class="chart" style="height:320px"></div>'+
        '<div class="legend"><span><i style="background:#dc2626"></i>期末現金水位</span><span><i style="background:#94a3b8"></i>安全下限</span></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>近期收支排程</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>日期</th><th>項目</th><th>類別</th><th style="text-align:right">金額</th><th>狀態</th></tr></thead><tbody>'+sr+'</tbody></table></div></div>'+
    '</div>';
  }
  function d5(){
    var wk=[]; for(var i=1;i<=13;i++){ wk.push("W"+i); }
    var lvl=[32400,29500,33100,28800,24600,19200,27500,31000,26400,30800,35200,33900,38600];
    var floorv=wk.map(function(){return 20000;});
    mk("c5a",{grid:GRID,tooltip:{trigger:"axis",valueFormatter:function(v){return money(v)+" 千元";}},legend:{data:["期末現金水位","安全下限"],top:0,textStyle:{fontSize:11,color:"#4b3f42"}},
      xAxis:{type:"category",data:wk,boundaryGap:false,axisLine:AXLINE,axisLabel:{color:"#9a8b8e",fontSize:10}},
      yAxis:{type:"value",name:"千元",axisLine:AXLINE,axisLabel:AXLABEL,splitLine:SPLIT},
      series:[
        {name:"安全下限",type:"line",data:floorv,itemStyle:{color:"#94a3b8"},lineStyle:{color:"#94a3b8",width:2,type:"dashed"},symbol:"none"},
        {name:"期末現金水位",type:"line",data:lvl,smooth:true,itemStyle:{color:"#dc2626"},lineStyle:{width:3},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"rgba(249,115,22,.25)"},{offset:1,color:"rgba(220,38,38,.04)"}])},
          markPoint:{data:[{type:"min",name:"最低水位",itemStyle:{color:"#f97316"}}],label:{fontSize:10}}}
      ]});
  }

  var SCREENS=[s0,s1,s2,s3,s4,s5];
  var DRAW=[d0,d1,d2,d3,d4,d5];

  function buildNav(){
    var nav=document.getElementById("nav");
    var html='<div class="t">預算作業</div>';
    for(var i=0;i<MODS.length;i++){
      html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i][0]+'</span><span>'+MODS[i][1]+'</span></button>';
      if(i===0){ html+='<div class="t">流程作業</div>'; }
    }
    nav.innerHTML=html;
    var btns=nav.querySelectorAll("[data-i]");
    for(var j=0;j<btns.length;j++){
      (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); try{window.scrollTo(0,0);}catch(e){} }); })(btns[j]);
    }
  }

  function show(i){
    clearCharts();
    var view=document.getElementById("view");
    view.innerHTML=SCREENS[i]();
    document.getElementById("vt").textContent=MODS[i][1];
    document.getElementById("vsub").textContent=MODS[i][2];
    var btns=document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
    void view.offsetHeight;
    DRAW[i]();
  }

  buildNav();
  window.__show=show;
})();
function show(i){ window.__show(i); }
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
