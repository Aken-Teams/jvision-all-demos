<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stop-Ship / 品質警示管理｜Jvision 系統 Demo</title>
  <meta name="description" content="從異常確認、警示發布、批次鎖定到改善驗證解除的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root {
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --success:#047857;
      --warning:#a84600;
      --sidebar:#0f172a;
      --sidebar-muted:#cbd5e1;
      --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 22px rgba(15,23,42,.05);
      --radius:8px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;min-height:100%}
    body{
      background:var(--color-background);
      color:var(--ink);
      font-family:"Fira Sans",sans-serif;
      font-size:14px;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    button,input,select,textarea{font:inherit}
    button,a{touch-action:manipulation}
    button{cursor:pointer}
    :focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .mono,.n,.id,.val,.mv,.ttime,.nidx,td:nth-child(1),td:nth-child(3),td:last-child{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }
    .icon{
      width:20px;
      height:20px;
      display:inline-block;
      flex:0 0 auto;
      stroke:currentColor;
      fill:none;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      padding:22px 16px 18px;
      color:#fff;
      background:var(--sidebar);
      border-right:1px solid #1e293b;
      z-index:20;
    }
    .brand{display:flex;align-items:center;gap:12px;padding:0 6px 22px}
    .logo{
      width:42px;height:42px;
      display:grid;place-items:center;
      color:#fff;
      background:var(--blue);
      border:1px solid rgba(255,255,255,.24);
      border-radius:6px;
      box-shadow:0 7px 18px rgba(37,99,235,.3);
    }
    .logo .icon{width:23px;height:23px}
    .brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
    .brand p{margin:3px 0 0;color:var(--sidebar-muted);font-size:11px}
    .nav{display:grid;gap:4px}
    .navbtn{
      width:100%;
      min-height:44px;
      display:flex;
      align-items:center;
      gap:11px;
      padding:10px 11px;
      border:1px solid transparent;
      border-radius:6px;
      color:var(--sidebar-muted);
      background:transparent;
      text-align:left;
      transition:background-color .2s,color .2s,border-color .2s,transform .2s;
    }
    .navbtn:hover{color:#fff;background:#1e293b;transform:translateX(2px)}
    .navbtn.active{
      color:#fff;
      background:var(--blue);
      border-color:#60a5fa;
      box-shadow:0 5px 14px rgba(37,99,235,.25);
    }
    .nlabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
    .nidx{margin-left:auto;color:#94a3b8;font-size:10px}
    .navbtn.active .nidx{color:#dbeafe}
    .sidefoot{
      margin-top:auto;
      padding:16px 7px 0;
      border-top:1px solid #334155;
      color:#94a3b8;
      font-size:11px;
      line-height:1.65;
    }
    .main{min-width:0;padding:24px clamp(16px,2.4vw,36px) 64px}
    .topbar{
      display:flex;
      align-items:flex-start;
      gap:18px;
      margin-bottom:20px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
    }
    .topbar .th{min-width:0}
    .eyebrow{
      margin-bottom:6px;
      color:var(--blue);
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .topbar h2{margin:0;font-size:clamp(21px,2vw,27px);line-height:1.2;letter-spacing:-.025em}
    .topbar p{max-width:760px;margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
    .chip{
      margin-left:auto;
      display:inline-flex;
      align-items:center;
      gap:7px;
      min-height:34px;
      padding:6px 11px;
      border:1px solid #bfdbfe;
      border-radius:999px;
      color:#1d4ed8;
      background:#eff6ff;
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .chip .icon{width:15px;height:15px}
    .grid{display:grid;gap:12px}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
    .g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
    .card{
      min-width:0;
      padding:16px;
      background:var(--color-card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      transition:border-color .22s,box-shadow .22s,transform .22s;
    }
    .card:hover{border-color:#bfdbfe;box-shadow:0 2px 3px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.07)}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:700;letter-spacing:-.01em}
    .card .sub{margin:0 0 13px;color:var(--muted);font-size:11.5px;line-height:1.5}
    .kpi{position:relative;overflow:hidden}
    .kpi:before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:3px;
      background:var(--kpi-color,var(--blue));
    }
    .kpi-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .kpi .ic{
      width:34px;height:34px;
      display:grid;place-items:center;
      border-radius:6px;
      color:var(--kpi-color,var(--blue));
      background:var(--kpi-bg,#eff6ff);
      border:1px solid currentColor;
    }
    .kpi .ic .icon{width:18px;height:18px}
    .kpi .val{margin-top:12px;font-size:26px;font-weight:700;line-height:1;letter-spacing:-.04em}
    .kpi .lbl{margin-top:7px;color:var(--muted);font-size:11.5px;font-weight:500}
    .dt{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:10.5px;font-weight:700}
    .up{color:var(--success)}
    .down{color:var(--color-destructive)}
    .chartbox{width:100%;height:280px}
    .chart-sm{width:100%;height:230px}
    .scroll{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:6px}
    table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
    th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
    th{
      position:sticky;
      top:0;
      z-index:1;
      color:#334155;
      background:#f1f5f9;
      font-size:10.5px;
      font-weight:700;
      letter-spacing:.035em;
      text-transform:uppercase;
    }
    td.n,td:nth-child(3){font-weight:600}
    td:nth-child(3){text-align:right}
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background-color .18s}
    tbody tr:hover{background:#f8fbff}
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      padding:3px 8px;
      border:1px solid currentColor;
      border-radius:999px;
      font-size:10.5px;
      font-weight:700;
      line-height:1;
    }
    .tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .t-a{color:#b91c1c;background:#fff1f2}
    .t-b{color:#92400e;background:#fffbeb}
    .t-c{color:#1d4ed8;background:#eff6ff}
    .t-ok{color:#047857;background:#ecfdf5}
    .t-g{color:#475569;background:#f1f5f9}
    .banner{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:12px;
      padding:14px 16px;
      border:1px solid #fecaca;
      border-left:4px solid var(--color-destructive);
      border-radius:var(--radius);
      background:#fff;
      box-shadow:var(--shadow);
    }
    .bi{
      width:40px;height:40px;
      display:grid;place-items:center;
      flex:0 0 40px;
      color:#fff;
      background:var(--color-destructive);
      border-radius:6px;
    }
    .bt{min-width:0}
    .bt b{font-size:14px}
    .bt div{margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.45}
    .ba{margin-left:auto}
    .btn{
      min-height:40px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:9px 14px;
      border:1px solid #b84100;
      border-radius:6px;
      color:#fff;
      background:var(--color-accent);
      font-size:12px;
      font-weight:700;
      box-shadow:0 4px 10px rgba(234,88,12,.18);
      transition:background-color .2s,box-shadow .2s,transform .2s;
    }
    .btn:hover{background:#c2410c;box-shadow:0 7px 16px rgba(234,88,12,.24);transform:translateY(-1px)}
    .btn.ghost{color:#1d4ed8;background:#fff;border-color:#93c5fd;box-shadow:none}
    .btn.ghost:hover{background:#eff6ff}
    .btn .icon{width:16px;height:16px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10.5px}
    .legend i{width:9px;height:9px;display:inline-block;margin-right:5px;border-radius:2px}
    .nrow{
      display:flex;
      align-items:center;
      gap:11px;
      padding:10px 2px;
      border-bottom:1px solid var(--line);
    }
    .nrow:last-child{border:0}
    .av{
      width:36px;height:36px;
      display:grid;place-items:center;
      flex:0 0 36px;
      border:1px solid #bfdbfe;
      border-radius:6px;
      color:#1d4ed8;
      background:#eff6ff;
      font-size:11px;
      font-weight:700;
    }
    .nb{min-width:0;flex:1}
    .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:700}
    .ns{margin-top:3px;color:var(--muted);font-size:10.5px}
    .rt{flex:0 0 auto;text-align:right;color:var(--muted);font-size:10px}
    .tl{position:relative;padding-left:25px}
    .tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#cbd5e1}
    .tli{position:relative;padding-bottom:18px}
    .tli:last-child{padding-bottom:0}
    .dot{
      position:absolute;
      left:-23px;top:1px;
      width:15px;height:15px;
      border:3px solid var(--blue);
      border-radius:50%;
      background:#fff;
    }
    .tli.done .dot{background:var(--blue);box-shadow:inset 0 0 0 2px #fff}
    .ttime{color:var(--muted);font-size:10px;font-weight:600}
    .ttit{margin:2px 0;font-size:12.5px;font-weight:700}
    .tdesc{color:var(--muted);font-size:11px;line-height:1.5}
    .trace{display:grid;grid-template-columns:repeat(3,1fr);min-width:640px}
    .tstage{padding:0 8px}
    .sh{
      margin-bottom:10px;
      padding-bottom:8px;
      border-bottom:2px solid #bfdbfe;
      color:#1d4ed8;
      text-align:center;
      font-size:11.5px;
      font-weight:700;
    }
    .node{
      position:relative;
      margin-bottom:8px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:6px;
      background:#f8fafc;
    }
    .node.hot{border-color:#fca5a5;border-left:4px solid var(--color-destructive);background:#fff7f7}
    .node.hot:after{
      content:"風險";
      position:absolute;
      top:7px;right:7px;
      color:#b91c1c;
      font-size:9px;
      font-weight:700;
    }
    .nn{padding-right:30px;font-size:12px;font-weight:700}
    .nd{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.4}
    .minirow{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:38px;
      padding:7px 0;
      border-bottom:1px dashed var(--line);
    }
    .minirow:last-child{border-bottom:0}
    .ml{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:600}
    .mv{flex:0 0 auto;font-size:11.5px;font-weight:700;text-align:right}
    .pbar{height:7px;overflow:hidden;border-radius:999px;background:#dbe4ef}
    .pbar>span{display:block;height:100%;background:var(--blue);border-radius:inherit}
    .gate{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:8px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:6px;
      background:#f8fafc;
    }
    .gk{
      width:30px;height:30px;
      display:grid;place-items:center;
      flex:0 0 30px;
      border:1px solid currentColor;
      border-radius:5px;
    }
    .gk.ok{color:#047857;background:#ecfdf5}
    .gk.no{color:#92400e;background:#fffbeb}
    .gk .icon{width:16px;height:16px}
    .gt{min-width:0;flex:1}
    .gt b{font-size:11.5px}
    .gt div{margin-top:2px;color:var(--muted);font-size:10px;line-height:1.4}
    .board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;min-width:780px}
    .col{padding:10px;border:1px solid var(--line);border-radius:6px;background:#f1f5f9}
    .colh{display:flex;justify-content:space-between;margin-bottom:9px;font-size:11.5px;font-weight:700}
    .cnt{padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:10px}
    .tk{
      margin-bottom:8px;
      padding:9px;
      border:1px solid var(--line);
      border-left:3px solid var(--blue);
      border-radius:5px;
      background:#fff;
      box-shadow:0 1px 2px rgba(15,23,42,.05);
    }
    .tk:last-child{margin-bottom:0}
    .tk .id{color:var(--muted);font-size:9.5px;font-weight:600}
    .tk .ti{margin:3px 0 7px;font-size:11.5px;font-weight:700;line-height:1.4}
    .tk .mt{display:flex;justify-content:space-between;color:var(--muted);font-size:9.5px}
    .verified{color:var(--success);font-weight:700}
    .section-gap{margin-bottom:12px}
    .grid-item{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
    .grid-item:nth-child(2){animation-delay:.05s}
    .grid-item:nth-child(3){animation-delay:.1s}
    .grid-item:nth-child(4){animation-delay:.15s}
    @keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
    @media(max-width:1100px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
    }
    @media(max-width:860px){
      .layout{display:block}
      .sidebar{
        position:sticky;
        width:100%;height:auto;
        padding:10px 14px;
        border:0;border-bottom:1px solid #334155;
      }
      .brand{padding:0 0 9px}
      .logo{width:36px;height:36px}
      .nav{display:flex;overflow-x:auto;padding-bottom:2px}
      .navbtn{width:auto;min-width:44px;flex:0 0 auto;padding:9px}
      .nidx{display:none}
      .sidefoot{display:none}
      .main{padding:19px 16px 50px}
    }
    @media(max-width:720px){
      .g2,.g3{grid-template-columns:1fr}
      .topbar{align-items:flex-start}
      .chip{margin-left:0}
      .trace{grid-template-columns:1fr}
      .banner{align-items:flex-start;flex-wrap:wrap}
      .ba{width:100%;margin-left:54px}
    }
    @media(max-width:520px){
      .brand p{display:none}
      .nlabel{display:none}
      .navbtn.active .nlabel{display:inline}
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .card{padding:13px}
      .kpi .val{font-size:22px}
      .topbar{display:block}
      .chip{margin-top:12px}
      .btn{width:100%}
      .ba{margin-left:0}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      .grid-item{animation:none!important}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true" data-icon="alert"></div>
        <div>
          <h1>產品停出貨品質預警台</h1>
          <p>QUALITY STOP-SHIP CONTROL</p>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能"></nav>
      <div class="sidefoot">品保部 · 生產部 · 出貨倉儲部<br />QMS 品質管理系統 Demo</div>
    </aside>
    <main class="main">
      <div id="screen" aria-live="polite"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";

    var ICONS={
      alert:'<svg class="icon" viewBox="0 0 24 24"><path d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
      box:'<svg class="icon" viewBox="0 0 24 24"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
      users:'<svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      tree:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/><path d="M15 6h3a3 3 0 0 1 3 3v6"/></svg>',
      check:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
      chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg>',
      person:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
      send:'<svg class="icon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
      lock:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
      truck:'<svg class="icon" viewBox="0 0 24 24"><path d="M10 17h4V5H2v12h3"/><path d="M14 9h4l4 4v4h-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>',

      return "<div class='grid g4 section-gap'>"+kpi("timer","#2563eb","#eff6ff","6.4","警示發布時效(分)","-38%","up")+kpi("shield","#047857","#ecfdf5","96.8","批次攔截率(%)","+11pt","up")+kpi("repeat","#dc2626","#fff1f2","2.1","重複不良率(%)","-3.8pt","up")+kpi("check","#1d4ed8","#eff6ff","8.6","平均關案(天)","-59%","up")+"</div><div class='grid g23 section-gap'><div class='card grid-item'><h3>發布時效 vs 攔截率 · 近 12 週</h3><p class='sub'>時效下降、攔截率上升的品質閉環成效</p><div id='c5a' class='chartbox'></div></div><div class='card grid-item'><h3>來源單位警示分布</h3><p class='sub'>各單位活躍警示占比</p><div id='c5b' class='chart-sm'></div></div></div><div class='grid g2'><div class='card grid-item'><h3>各單位攔截率排行</h3><p class='sub'>攔截率 % 與近月警示數</p>"+rank+"</div><div class='card grid-item'><h3>異常類型分布</h3><p class='sub'>停止出貨警示的觸發原因</p><div id='c5c' class='chart-sm'></div></div></div>";
    }
    function d5(){
      var wk=[];for(var i=1;i<=12;i++)wk.push("W"+i);
      mk("c5a",{grid:{left:38,right:42,top:26,bottom:24},tooltip:{trigger:"axis"},legend:{right:0,textStyle:{color:"#475569",fontSize:10}},xAxis:Object.assign({type:"category",data:wk},AXIS),yAxis:[Object.assign({type:"value",name:"分",nameTextStyle:{color:"#475569"}},AXIS,SPLIT),Object.assign({type:"value",name:"%",min:70,max:100,position:"right",nameTextStyle:{color:"#475569"}},AXIS,{splitLine:{show:false}})],series:[
        {name:"發布時效(分)",type:"bar",data:[11,10.4,10,9.1,8.6,8.2,7.8,7.5,7.1,6.9,6.6,6.4],barWidth:11,itemStyle:{color:"#60a5fa",borderRadius:[3,3,0,0]}},
        {name:"攔截率(%)",type:"line",yAxisIndex:1,smooth:true,data:[85,86,88,89,90,91,92,93,94,95,96,96.8],symbol:"circle",symbolSize:5,lineStyle:{width:3,color:"#ea580c"},itemStyle:{color:"#ea580c"}}
      ]});
      mk("c5b",{tooltip:{trigger:"item",formatter:"{b}: {c} ({d}%)"},series:[{type:"pie",radius:["42%","70%"],label:{fontSize:10,color:"#475569",formatter:"{b}\n{d}%"},data:[
        {value:9,name:"射出成型",itemStyle:{color:"#2563eb"}},{value:6,name:"CNC加工",itemStyle:{color:"#3b82f6"}},{value:4,name:"電鍍",itemStyle:{color:"#60a5fa"}},{value:3,name:"出貨終檢",itemStyle:{color:"#ea580c"}},{value:2,name:"成品倉",itemStyle:{color:"#94a3b8"}}
      ]}]});
      mk("c5c",{grid:{left:28,right:12,top:16,bottom:28},tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},xAxis:Object.assign({type:"category",data:["尺寸\n超差","外觀\n不良","鍍層\n異常","標籤\n錯誤","包裝\n受潮"]},AXIS,{axisLabel:{color:"#475569",fontSize:9,interval:0}}),yAxis:Object.assign({type:"value"},AXIS,SPLIT),series:[{type:"bar",data:[14,11,7,5,3],barWidth:"46%",itemStyle:{color:"#2563eb",borderRadius:[3,3,0,0]},label:{show:true,position:"top",fontSize:10,color:"#475569",fontFamily:"Fira Code"}}]});
    }

    var SCR=[[s0,d0],[s1,d1],[s2,function(){}],[s3,d3],[s4,d4],[s5,d5]];
    var nav=document.getElementById("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return "<button class='navbtn' data-i='"+i+"' aria-label='"+esc(m.name)+"' title='"+esc(m.desc)+"'>"+icon(m.icon)+"<span class='nlabel'>"+esc(m.name)+"</span><span class='nidx'>0"+(i+1)+"</span></button>"
    }).join("");

    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]");
      if(b)location.hash="v"+b.getAttribute("data-i");
    });

    function show(i){
      dispose();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){
        var active=+btns[k].getAttribute("data-i")===i;
        btns[k].classList.toggle("active",active);
        btns[k].setAttribute("aria-current",active?"page":"false");
      }
      var t=TITLES[i];
      document.getElementById("screen").innerHTML="<div class='topbar'><div class='th'><div class='eyebrow'>Quality inspection / Stop-Ship</div><h2>"+esc(t[0])+"</h2><p>"+esc(t[1])+"</p></div><span class='chip'>"+icon("person")+esc(t[2])+"</span></div>"+SCR[i][0]();
      SCR[i][1]();
    }

    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      var i=m?Math.min(+m[1],5):0;
      show(i);
      try{window.scrollTo(0,0)}catch(e){}
    }

    window.addEventListener("hashchange",fromHash);
    window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
    fromHash();
  })();
  </script>
