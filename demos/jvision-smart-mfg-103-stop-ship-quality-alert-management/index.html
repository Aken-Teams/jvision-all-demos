<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stop-Ship / 品質警示管理｜Jvision 系統 Demo</title>
  <meta name="description" content="從異常確認、警示發布、批次鎖定到改善驗證解除的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#0d9488;--accent2:#2dd4bf;--ink:#0f2321;--muted:#5b7370;
      --line:#dbe7e4;--bg:#f2f7f6;--card:#ffffff;--soft:#e6f4f1;
      --a:#dc2626;--b:#f59e0b;--c:#2563eb;--ok:#059669;
      --shadow:0 1px 2px rgba(13,148,136,.06),0 8px 24px rgba(13,148,136,.07);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;vertical-align:middle}
    .layout{display:flex;min-height:100vh;align-items:stretch}
    .sidebar{width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;min-width:0}
    .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
    .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px}
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand h1{font-size:15px;margin:0;line-height:1.25;font-weight:800}
    .brand p{font-size:11px;margin:2px 0 0;color:var(--muted);font-weight:500}
    .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;width:100%;min-width:0;transition:.15s}
    .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
    .navbtn .nlabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .navbtn .nidx{margin-left:auto;font-size:11px;font-weight:700;color:var(--line)}
    .navbtn:hover{background:var(--soft);color:var(--accent)}
    .navbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .navbtn.active .nidx{color:rgba(255,255,255,.7)}
    .sidefoot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}
    .main{flex:1 1 auto;min-width:0;padding:26px 30px 60px;max-width:100%}
    .topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    .topbar .th{min-width:0}
    .topbar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
    .topbar p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:640px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;margin-left:auto;flex:0 0 auto}
    .chip .material-symbols-outlined{font-size:16px}
    .grid{display:grid;gap:14px}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:1.6fr 1fr}
    .g32{grid-template-columns:1fr 1.5fr}
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;box-shadow:var(--shadow);min-width:0}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800}
    .card .sub{margin:0 0 14px;font-size:12px;color:var(--muted)}
    .kpi .material-symbols-outlined{font-size:20px}
    .kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
    .kpi .val{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1}
    .kpi .lbl{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
    .kpi .dt{font-size:11px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:3px}
    .up{color:var(--ok)} .down{color:var(--a)}
    .chartbox{width:100%;height:280px;overflow:hidden}
    .chart-sm{width:100%;height:230px;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--bg)}
    tbody tr:hover{background:var(--soft)}
    td.n{font-variant-numeric:tabular-nums;font-weight:700}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.4}
    .tag .material-symbols-outlined{font-size:13px}
    .t-a{background:#fee2e2;color:#b91c1c} .t-b{background:#fef3c7;color:#b45309}
    .t-c{background:#dbeafe;color:#1d4ed8} .t-ok{background:#d1fae5;color:#047857}
    .t-g{background:#e5e7eb;color:#4b5563}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .col{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
    .colh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:10px}
    .colh .cnt{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
    .tk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .tk .id{font-size:10.5px;color:var(--muted);font-weight:700}
    .tk .ti{font-size:12.5px;font-weight:700;margin:3px 0 7px;line-height:1.35;white-space:normal}
    .tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--muted)}
    .bar{border-left:4px solid var(--accent);padding-left:4px}
    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 20px}
    .tli:last-child{padding-bottom:0}
    .tli .dot{position:absolute;left:-22px;top:1px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-sizing:border-box}
    .tli.done .dot{background:var(--accent);border-color:var(--accent)}
    .tli .ttime{font-size:11px;color:var(--muted);font-weight:700}
    .tli .ttit{font-size:13px;font-weight:700;margin:2px 0 3px}
    .tli .tdesc{font-size:12px;color:var(--muted);line-height:1.5}
    /* notify list */
    .nrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0}
    .nrow:last-child{border-bottom:0}
    .nrow .av{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 38px;font-weight:800;font-size:13px}
    .nrow .nb{min-width:0;flex:1 1 auto}
    .nrow .nb .nt{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nrow .nb .ns{font-size:11.5px;color:var(--muted);margin-top:2px}
    .nrow .rt{flex:0 0 auto;text-align:right;font-size:11px;color:var(--muted)}
    /* progress */
    .pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
    .pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    /* trace map */
    .trace{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;align-items:stretch;min-width:640px}
    .tstage{padding:0 8px}
    .tstage>.sh{font-size:12px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--soft)}
    .node{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:10px;position:relative}
    .node.hot{border-color:var(--a);background:#fef2f2}
    .node .nn{font-size:12.5px;font-weight:800}
    .node .nd{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
    .banner{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#fef2f2,#fff);border:1px solid #fecaca;margin-bottom:16px}
    .banner .bi{width:44px;height:44px;border-radius:12px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
    .banner .bt{min-width:0}
    .banner .bt b{font-size:14.5px;font-weight:800}
    .banner .bt div{font-size:12px;color:var(--muted);margin-top:2px}
    .banner .ba{margin-left:auto;flex:0 0 auto;text-align:right}
    .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
    .btn.ghost{background:var(--soft);color:var(--accent)}
    .btn .material-symbols-outlined{font-size:16px}
    .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
    .minirow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
    .minirow:last-child{border-bottom:0}
    .minirow .ml{font-size:12.5px;font-weight:600;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .minirow .mv{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
    .gate{display:flex;align-items:center;gap:10px;padding:11px;border-radius:11px;border:1px solid var(--line);margin-bottom:9px;background:var(--bg)}
    .gate .gk{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
    .gate .gk.ok{background:#d1fae5;color:#047857}.gate .gk.no{background:#fee2e2;color:#b91c1c}
    .gate .gt{min-width:0;flex:1 1 auto}
    .gate .gt b{font-size:12.5px;font-weight:700}.gate .gt div{font-size:11px;color:var(--muted)}
    .gate .gk .material-symbols-outlined{font-size:18px}
    @media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:860px){
      .layout{flex-direction:column}
      .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
      .brand{padding:0 12px 0 2px}
      .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;gap:6px}
      .navbtn{width:auto;padding:9px 12px}.navbtn .nidx{display:none}
      .sidefoot{display:none}
      .main{padding:20px 16px 50px}
    }
    @media(max-width:820px){.g3,.g2{grid-template-columns:1fr}.trace{grid-template-columns:1fr}}
    @media(max-width:560px){
      .navbtn .nlabel{display:none}.navbtn{padding:9px 11px}
      .g4{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}
      .topbar h2{font-size:19px}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">warning</span></div>
        <div>
          <h1>Stop-Ship 警示</h1>
          <p>品質警示管理平台</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidefoot">
        品保部 · 生產部 · 出貨倉儲部<br/>QMS 品質管理系統 Demo
      </div>
    </aside>
    <main class="main">
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    var MODS=[
      {icon:"warning",name:"警示發布中心",desc:"異常確認、分級發布與升級"},
      {icon:"inventory_2",name:"受影響批次鎖定",desc:"自動比對並凍結出貨批次"},
      {icon:"groups",name:"跨部門通知推播",desc:"多管道通知與已讀簽收追蹤"},
      {icon:"account_tree",name:"批次追溯地圖",desc:"上下游流向與出貨去向追溯"},
      {icon:"verified",name:"改善驗證解除",desc:"驗證證據審核與解鎖放行"},
      {icon:"monitoring",name:"警示指標看板",desc:"發布時效與攔截率成效分析"}
    ];
    var TITLES=[
      {t:"警示發布中心",s:"確認異常成立、判定嚴重度分級並發布 Stop-Ship 警示",chip:"品保工程師"},
      {t:"受影響批次鎖定",s:"自動比對受影響批號、庫存與在途出貨並一鍵凍結",chip:"品保工程師"},
      {t:"跨部門通知推播",s:"依分級推播權責單位，追蹤送達與已讀簽收",chip:"品保工程師"},
      {t:"批次追溯地圖",s:"釐清上下游流向與已出貨去向，界定攔截與召回範圍",chip:"品保工程師"},
      {t:"改善驗證解除",s:"審核 CAPA 改善與驗證證據，解鎖批次並關閉警示",chip:"品質經理"},
      {t:"警示指標看板",s:"追蹤警示發布時效與受影響批次攔截率成效",chip:"品質經理"}
    ];
    var charts=[];
    function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
    function esc(s){return String(s).replace(/[&<>"]/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[x];});}

    var AXIS={axisLine:{lineStyle:{color:"#dbe7e4"}},axisLabel:{color:"#5b7370",fontSize:11},axisTick:{show:false}};
    var SPLIT={splitLine:{lineStyle:{color:"#eef4f3"}}};

    /* ---------- Screen 0: 警示發布中心 ---------- */
    function s0(){
      var alerts=[
        {id:"SA-24107",p:"車門內飾板 塑件毛邊",lv:"A",st:"發布中",bt:12,dept:"射出成型二課",tm:"08:12",own:"陳品保"},
        {id:"SA-24106",p:"煞車卡鉗 尺寸超差 Ø0.08",lv:"A",st:"待判定",bt:8,dept:"CNC 加工三線",tm:"07:58",own:"林工程"},
        {id:"SA-24104",p:"連接器端子 鍍層厚度不足",lv:"B",st:"發布中",bt:5,dept:"電鍍課",tm:"昨 21:40",own:"王品保"},
        {id:"SA-24101",p:"標籤批號與檢驗報告不一致",lv:"B",st:"升級待核",bt:3,dept:"出貨終檢",tm:"昨 18:03",own:"陳品保"},
        {id:"SA-24098",p:"包裝濕度指示卡變色",lv:"C",st:"監控中",bt:2,dept:"成品倉",tm:"昨 15:22",own:"張倉管"}
      ];
      var lvl=function(l){return l=="A"?"t-a":l=="B"?"t-b":"t-c";};
      var stt=function(s){return s=="發布中"?"t-a":s=="待判定"?"t-b":s=="升級待核"?"t-c":"t-ok";};
      var rows=alerts.map(function(a){
        return "<tr><td class='n'>"+esc(a.id)+"</td><td style='white-space:normal'>"+esc(a.p)+"</td>"+
        "<td><span class='tag "+lvl(a.lv)+"'>"+a.lv+" 級</span></td>"+
        "<td><span class='tag "+stt(a.st)+"'>"+esc(a.st)+"</span></td>"+
        "<td class='n'>"+a.bt+"</td><td>"+esc(a.dept)+"</td><td>"+esc(a.own)+"</td><td>"+esc(a.tm)+"</td></tr>";
      }).join("");
      return "<div class='banner'><div class='bi'><span class='material-symbols-outlined'>crisis_alert</span></div>"+
        "<div class='bt'><b>SA-24107 · A 級停止出貨警示 進行中</b><div>車門內飾板塑件毛邊，影響 12 批 · 已鎖定 8 批 · 通知送達 5/6 單位</div></div>"+
        "<div class='ba'><button class='btn'><span class='material-symbols-outlined'>campaign</span>發布新警示</button></div></div>"+
      "<div class='grid g4' style='margin-bottom:14px'>"+
        kpi("crisis_alert","#dc2626","#fee2e2","5","今日活躍警示","+2","down")+
        kpi("priority_high","#b45309","#fef3c7","2","A 級待處理","-1","up")+
        kpi("timer","#0d9488","#e6f4f1","6.4","平均發布時效(分)","-38%","up")+
        kpi("pending_actions","#2563eb","#dbeafe","3","升級待核准","0","")+
      "</div>"+
      "<div class='grid g23'>"+
        "<div class='card'><h3>警示清單 · 依優先度排序</h3><p class='sub'>涉及已出貨批號者列為最高優先（RULE-01）</p>"+
          "<div class='scroll'><table><thead><tr><th>警示單號</th><th>異常品項</th><th>分級</th><th>狀態</th><th>影響批</th><th>來源單位</th><th>負責人</th><th>時間</th></tr></thead><tbody>"+rows+"</tbody></table></div></div>"+
        "<div class='card'><h3>近 14 日警示發布分級</h3><p class='sub'>各嚴重度發布量趨勢</p><div id='c0' class='chart-sm'></div></div>"+
      "</div>";
    }
    function d0(){
      var days=[];for(var i=13;i>=0;i--)days.push((i===0?"今":i+"d"));
      mk("c0",{grid:{left:38,right:12,top:20,bottom:26},tooltip:{trigger:"axis"},legend:{data:["A級","B級","C級"],right:0,top:0,textStyle:{fontSize:11,color:"#5b7370"},itemWidth:12,itemHeight:8},
        xAxis:Object.assign({type:"category",data:days},AXIS),yAxis:Object.assign({type:"value"},AXIS,SPLIT),
        series:[
          {name:"A級",type:"bar",stack:"x",data:[1,0,2,1,1,0,1,2,1,0,1,1,2,2],itemStyle:{color:"#dc2626"},barWidth:11},
          {name:"B級",type:"bar",stack:"x",data:[2,1,1,3,2,1,2,1,2,3,1,2,1,2],itemStyle:{color:"#f59e0b"}},
          {name:"C級",type:"bar",stack:"x",data:[1,2,1,1,2,2,1,1,2,1,3,1,2,1],itemStyle:{color:"#2dd4bf"}}
        ]});
    }

    /* ---------- Screen 1: 受影響批次鎖定 ---------- */
    function s1(){
      var batches=[
        {b:"LOT-A7-0912",loc:"成品倉 C-03",qty:1280, st:"已凍結",flow:"庫存",risk:"高"},
        {b:"LOT-A7-0913",loc:"成品倉 C-03",qty:960, st:"已凍結",flow:"庫存",risk:"高"},
        {b:"LOT-A7-0915",loc:"在途 · 貨櫃 TK-118",qty:640, st:"攔截中",flow:"在途",risk:"高"},
        {b:"LOT-A7-0908",loc:"線邊倉 IJ2",qty:420, st:"已凍結",flow:"半成品",risk:"中"},
        {b:"LOT-A7-0905",loc:"已出貨 · 客戶 D 廠",qty:800, st:"待召回",flow:"已出貨",risk:"高"},
        {b:"LOT-A7-0902",loc:"待驗區 QC-1",qty:300, st:"複驗中",flow:"待驗",risk:"低"}
      ];
      var rk=function(r){return r=="高"?"t-a":r=="中"?"t-b":"t-ok";};

    }

    var SCR=[[s0,d0],[s1,d1],[s2,d2],[s3,d3],[s4,d4],[s5,d5]];

    /* nav */
    var nav=document.getElementById("nav");
    nav.innerHTML=MODS.map(function(m,i){
      return "<button class='navbtn' data-i='"+i+"'><span class='material-symbols-outlined'>"+m.icon+"</span><span class='nlabel'>"+esc(m.name)+"</span><span class='nidx'>0"+(i+1)+"</span></button>";

    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]");if(!b)return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function show(i){
      disposeCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++)btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);

      var c=document.getElementById("screen");
      c.innerHTML=head+SCR[i][0]();
      void c.offsetHeight;
      SCR[i][1]();
    }
    window.show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
