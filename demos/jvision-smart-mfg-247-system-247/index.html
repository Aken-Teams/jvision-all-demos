<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>樣品/打樣管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="樣品申請、打樣物料領用、進度與交期管控的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--pri:#9333ea;--pri2:#c084fc;--bg:#f6f4fb;--card:#ffffff;--ink:#1e1630;--sub:#6b6480;--line:#ece7f5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px 40px;}
header.top{background:linear-gradient(120deg,#6b21a8,#9333ea 55%,#c084fc);color:#fff;padding:20px 0;margin-bottom:16px;}
.top .inner{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.logo .material-symbols-outlined{font-size:28px;}
.htxt{min-width:0;}
.htxt h1{margin:0;font-size:19px;font-weight:900;letter-spacing:.5px;}
.htxt p{margin:2px 0 0;font-size:12.5px;opacity:.9;}
.hbadges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0;}
.hbadge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;}
.hbadge .material-symbols-outlined{font-size:16px;}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;min-width:0;transition:.15s;}
nav.tabs button .material-symbols-outlined{font-size:19px;}
nav.tabs button:hover{border-color:var(--pri2);color:var(--pri);}
nav.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 6px 16px rgba(147,51,234,.28);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(70,40,110,.05);min-width:0;}
.scr-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap;min-width:0;}
.scr-head .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#9333ea,#c084fc);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.scr-head .ic .material-symbols-outlined{font-size:26px;}
.scr-head h2{margin:0;font-size:18px;font-weight:800;}
.scr-head p{margin:3px 0 0;font-size:12.5px;color:var(--sub);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;}
.kpi .lab{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--pri);}
.kpi .val{font-size:24px;font-weight:900;margin-top:6px;letter-spacing:.5px;}
.kpi .val small{font-size:12px;font-weight:600;color:var(--sub);margin-left:3px;}
.kpi .dl{margin-top:6px;font-size:11.5px;font-weight:600;}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;min-width:0;}
.gridcols{display:grid;gap:16px;min-width:0;}
.c2{grid-template-columns:1fr 1fr;}
.c3{grid-template-columns:1.4fr 1fr;}
.listcol{min-width:0;}
.lc-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:10px;color:var(--sub);font-size:13px;}
.lc-search .material-symbols-outlined{font-size:18px;}
.litem{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;min-width:0;}
.litem:hover{border-color:var(--pri2);}
.litem.on{border-color:var(--pri);background:#faf5ff;box-shadow:0 4px 12px rgba(147,51,234,.1);}
.litem .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.litem .no{font-size:13px;font-weight:800;color:var(--pri);}
.litem .nm{font-size:13.5px;font-weight:700;margin-top:4px;}
.litem .mt{font-size:11.5px;color:var(--sub);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#dbeafe;color:#1d4ed8;}
.t-mut{background:#f1eefb;color:#7c3aed;}
.detail{min-width:0;}
.detail h3{margin:0 0 3px;font-size:17px;font-weight:800;}
.dsub{font-size:12.5px;color:var(--sub);margin-bottom:14px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:14px;}
.field .fl{font-size:11.5px;color:var(--sub);}
.field .fv{font-size:14px;font-weight:700;margin-top:2px;}
.sec-title{font-size:13px;font-weight:800;margin:16px 0 9px;display:flex;align-items:center;gap:6px;}
.sec-title .material-symbols-outlined{font-size:18px;color:var(--pri);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tnum{font-variant-numeric:tabular-nums;font-weight:700;}
.bar{height:7px;border-radius:5px;background:#eee6f7;overflow:hidden;min-width:60px;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#9333ea,#c084fc);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#faf8fd;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;}
.col h4 .cnt{background:var(--pri);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;min-width:0;}
.tk .tno{font-size:11.5px;font-weight:800;color:var(--pri);}
.tk .tnm{font-size:12.5px;font-weight:700;margin:4px 0;}
.tk .tf{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;}
.chartbox{overflow:hidden;min-width:0;}
.timeline{position:relative;padding-left:26px;}
.timeline:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlitem{position:relative;padding:0 0 18px 6px;}
.tlitem:before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:2px solid #fff;box-shadow:0 0 0 2px var(--pri2);}
.tlitem .tt{font-size:13px;font-weight:800;}
.tlitem .td{font-size:12px;color:var(--sub);margin-top:2px;}
.tlitem .tm{font-size:11px;color:var(--pri);font-weight:700;margin-top:3px;}
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;min-width:0;}
.chk .cb{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
.chk .cb .material-symbols-outlined{font-size:16px;}
.chk .ct{font-size:13px;font-weight:700;}
.chk .cd{font-size:11.5px;color:var(--sub);margin-top:2px;}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.note{background:#faf5ff;border:1px dashed var(--pri2);border-radius:12px;padding:12px;font-size:12.5px;color:#6b21a8;display:flex;gap:9px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:19px;color:var(--pri);flex:0 0 auto;}
.mini{font-size:11.5px;color:var(--sub);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
@media(max-width:820px){
.kpis{grid-template-columns:1fr 1fr;}
.split{grid-template-columns:1fr;}
.gridcols.c2,.gridcols.c3{grid-template-columns:1fr;}
.board{grid-template-columns:1fr 1fr;}
.field-grid{grid-template-columns:1fr;}
}
@media(max-width:560px){
.kpis{grid-template-columns:1fr 1fr;}
.board{grid-template-columns:1fr;}
nav.tabs button span.lbl{display:none;}
.hbadges{display:none;}
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="logo"><span class="material-symbols-outlined">science</span></div>
    <div class="htxt">
      <h1>樣品/打樣管理系統</h1>

    </div>
    <div class="hbadges">
      <div class="hbadge"><span class="material-symbols-outlined">groups</span>3 種角色</div>

</header>
<div class="wrap">
  <nav class="tabs" id="tabs"></nav>

</div>

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function kpiCard(ic,lab,val,unit,dl,dlc){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+(dl?'<div class="dl" style="color:'+dlc+'">'+dl+'</div>':'')+'</div>';}
function tag(c,ic,t){return '<span class="tag '+c+'"><span class="material-symbols-outlined">'+ic+'</span>'+t+'</span>';}

/* ---------- render ---------- */
function show(i){
 var tabs=document.querySelectorAll("#tabs button");
 for(var k=0;k<tabs.length;k++){ tabs[k].className=(+tabs[k].getAttribute("data-i")===i)?"on":""; }
 destroyChart();
 var box=document.getElementById("screen");
 var head='<div class="scr-head"><div class="ic"><span class="material-symbols-outlined">'+NAV[i].ic+'</span></div><div><h2>'+NAV[i].t+'</h2><p>'+SUB[i]+'</p></div></div>';
 box.innerHTML=head+SCR[i]();
 void box.offsetHeight;
 initChart(i);
 if(i===0){
  var lis=box.querySelectorAll("[data-sel]");
  for(var j=0;j<lis.length;j++){ lis[j].addEventListener("click",function(){ sel0=+this.getAttribute("data-sel"); show(0); }); }
 }
}

(function(){

 for(var i=0;i<NAV.length;i++){ h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>'; }
 var t=document.getElementById("tabs");t.innerHTML=h;
 var bs=t.querySelectorAll("button");
 for(var j=0;j<bs.length;j++){ bs[j].addEventListener("click",function(){ show(+this.getAttribute("data-i")); location.hash="go="+this.getAttribute("data-i"); }); }
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
