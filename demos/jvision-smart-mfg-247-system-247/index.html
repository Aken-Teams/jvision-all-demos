<style>
:root{
 --color-primary:#15803D;--color-on-primary:#FFFFFF;
 --color-secondary:#22C55E;--color-on-secondary:#0F172A;
 --color-accent:#D97706;--color-on-accent:#000000;
 --color-background:#F0FDF4;--color-foreground:#14532D;
 --color-card:#FFFFFF;--color-card-foreground:#14532D;
 --color-muted:#E8F0F1;--color-muted-foreground:#475569;
 --color-border:#BBF7D0;--color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;--color-ring:#15803D;
 --blue:#15803D;--ink:#14532D;--muted:#475569;--line:#BBF7D0;
 --pri:var(--color-primary);--pri2:var(--color-secondary);
 --bg:var(--color-background);--card:var(--color-card);
 --sub:var(--color-muted-foreground);--ok:#15803D;--warn:#B45309;
 --bad:#B91C1C;--info:#1D4ED8;
 --shadow:0 12px 32px rgba(20,83,45,.08);
 --shadow-soft:0 4px 14px rgba(20,83,45,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
 min-width:320px;background:
 radial-gradient(circle at 8% 4%,rgba(34,197,94,.12),transparent 25rem),
 radial-gradient(circle at 93% 38%,rgba(217,119,6,.07),transparent 30rem),
 var(--bg);
 color:var(--ink);font-family:"Exo",sans-serif;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button,[data-sel]{cursor:pointer}
.material-symbols-outlined{
 font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
 font-size:20px;line-height:1;vertical-align:middle
}
.top{
 position:relative;overflow:hidden;color:#fff;padding:24px 0 48px;
 background:linear-gradient(125deg,#14532D 0%,#15803D 58%,#22C55E 125%);
}
.top:before,.top:after{
 content:"";position:absolute;border-radius:44% 56% 60% 40%;
 border:1px solid rgba(255,255,255,.2);pointer-events:none
}
.top:before{width:360px;height:220px;right:-80px;top:-105px;transform:rotate(12deg)}
.top:after{width:260px;height:150px;left:36%;bottom:-110px;transform:rotate(-8deg)}
.top .inner{
 position:relative;z-index:1;max-width:1360px;margin:auto;padding:0 20px;
 display:flex;align-items:center;gap:15px;flex-wrap:wrap
}
.logo{
 width:50px;height:50px;border-radius:19px 13px 20px 14px;
 display:grid;place-items:center;flex:0 0 auto;
 background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
 box-shadow:inset 0 1px rgba(255,255,255,.25)
}
.logo .material-symbols-outlined{font-size:29px}
.htxt{min-width:0}
.htxt h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.04em}
.htxt p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:#DCFCE7}
.hbadges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hbadge{
 display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
 font-size:12px;font-weight:600;background:rgba(255,255,255,.13);
 border:1px solid rgba(255,255,255,.26)
}
.hbadge .material-symbols-outlined{font-size:16px}
.wrap{max-width:1360px;margin:-25px auto 0;padding:0 20px 44px;position:relative;z-index:2}
.tabs-shell{
 position:sticky;top:0;z-index:20;padding:10px;margin-bottom:18px;
 border:1px solid rgba(187,247,208,.9);border-radius:22px 15px 22px 16px;
 background:rgba(255,255,255,.94);box-shadow:var(--shadow);
 backdrop-filter:blur(14px)
}
.journey{
 height:3px;margin:0 5px 9px;border-radius:999px;background:#DCFCE7;overflow:hidden
}
.journey i{
 display:block;width:16.666%;height:100%;border-radius:inherit;
 background:linear-gradient(90deg,var(--pri),var(--pri2));
 transition:width .25s ease
}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{
 flex:1 0 auto;min-height:42px;padding:9px 12px;border:1px solid transparent;
 border-radius:14px 10px 15px 11px;color:var(--sub);background:transparent;
 display:flex;align-items:center;justify-content:center;gap:7px;
 font-size:12.5px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .2s
}
nav.tabs button:hover{background:#F0FDF4;color:var(--pri);border-color:var(--line)}
nav.tabs button.on{
 color:#fff;background:linear-gradient(135deg,#166534,var(--pri));
 box-shadow:0 7px 16px rgba(21,128,61,.22)
}
nav.tabs button .material-symbols-outlined{font-size:18px}
button:focus-visible,[data-sel]:focus-visible{
 outline:3px solid rgba(21,128,61,.28);outline-offset:3px
}
#screen{min-height:540px}
.scr-head{
 display:flex;align-items:center;gap:12px;margin:0 2px 15px;
 animation:reveal .35s ease both
}
.scr-head .ic{
 width:46px;height:46px;border-radius:18px 12px 19px 13px;flex:0 0 auto;
 display:grid;place-items:center;color:#fff;
 background:linear-gradient(135deg,#166534,var(--pri2));
 box-shadow:0 8px 18px rgba(21,128,61,.18)
}
.scr-head .ic .material-symbols-outlined{font-size:25px}
.scr-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.02em}
.scr-head p{margin:3px 0 0;color:var(--sub);font-size:12.5px;line-height:1.5}
.card,.kpi{
 min-width:0;background:rgba(255,255,255,.97);border:1px solid var(--line);
 box-shadow:var(--shadow-soft)
}
.card{padding:18px;border-radius:21px 15px 22px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{
 position:relative;overflow:hidden;padding:15px 16px;
 border-radius:18px 13px 20px 14px;animation:reveal .35s ease both
}
.kpi:after{
 content:"";position:absolute;width:58px;height:58px;border-radius:45% 55% 62% 38%;
 right:-24px;top:-25px;background:rgba(34,197,94,.1)
}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;font-weight:500}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--pri)}
.kpi .val{
 margin-top:6px;font-family:"Roboto Mono",monospace;font-size:24px;
 font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums
}
.kpi .val small{margin-left:4px;color:var(--sub);font-family:"Exo",sans-serif;font-size:12px;font-weight:600}
.kpi .dl{margin-top:6px;font-size:11.5px;font-weight:600}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}
.gridcols{display:grid;gap:16px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1.4fr 1fr}
.listcol,.detail,.chartbox{min-width:0}
.lc-search{
 display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 11px;margin-bottom:11px;
 border:1px solid var(--line);border-radius:13px 9px 14px 10px;background:#F8FFFA;
 color:var(--sub);font-size:12.5px
}
.lc-search .material-symbols-outlined{font-size:18px}
.litem{
 min-width:0;padding:11px 12px;margin-bottom:9px;border:1px solid #DDF7E5;
 border-radius:15px 10px 16px 11px;background:#fff;
 transition:border-color .2s,background .2s,transform .2s,box-shadow .2s
}
.litem:hover{border-color:var(--pri2);transform:translateY(-1px)}
.litem.on{border-color:var(--pri);background:#F0FDF4;box-shadow:0 6px 15px rgba(21,128,61,.1)}
.litem .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.litem .no,.tk .tno,.tnum,.tm{
 font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums
}
.litem .no{font-size:12.5px;font-weight:700;color:var(--pri)}
.litem .nm{margin-top:5px;font-size:13.5px;font-weight:700}
.litem .mt{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;color:var(--sub);font-size:11.5px}
.tag{
 display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
 font-size:11px;font-weight:700;white-space:nowrap;border:1px solid transparent
}
.tag .material-symbols-outlined{font-size:13px}
.t-ok{background:#DCFCE7;color:#166534;border-color:#86EFAC}
.t-warn{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.t-bad{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.t-info{background:#DBEAFE;color:#1E40AF;border-color:#93C5FD}
.t-mut{background:#ECFDF5;color:#166534;border-color:#A7F3D0}
.detail h3{margin:0 0 3px;font-size:18px;font-weight:700}
.dsub{margin-bottom:15px;color:var(--sub);font-size:12.5px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:14px}
.field{padding-bottom:8px;border-bottom:1px dashed #DDF7E5}
.field .fl{color:var(--sub);font-size:11.5px}
.field .fv{margin-top:3px;font-size:14px;font-weight:700}
.sec-title{
 display:flex;align-items:center;gap:7px;margin:15px 0 10px;
 font-size:13px;font-weight:700;color:#14532D
}
.sec-title .material-symbols-outlined{font-size:18px;color:var(--pri)}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
 padding:10px;text-align:left;white-space:nowrap;color:#334155;background:#F0FDF4;
 border-top:1px solid var(--line);border-bottom:1px solid var(--line);
 font-size:11.5px;font-weight:700
}
th:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}
th:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
td{padding:10px;border-bottom:1px solid #E5F5EA;vertical-align:middle}
tbody tr:hover{background:#F8FFFA}
.tnum{font-weight:600;white-space:nowrap}
td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
.bar{height:8px;min-width:60px;overflow:hidden;border-radius:999px;background:#DCFCE7}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#15803D,#4ADE80)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;min-width:650px}
.col{min-width:0;padding:11px;background:#F3FCF5;border:1px solid var(--line);border-radius:16px 11px 17px 12px}
.col h4{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:12.5px}
.col h4 .cnt{
 min-width:23px;padding:2px 7px;text-align:center;color:#fff;background:var(--pri);
 border-radius:999px;font-family:"Roboto Mono",monospace;font-size:10.5px
}
.tk{min-width:0;padding:10px;margin-bottom:9px;background:#fff;border:1px solid #DDF7E5;border-radius:13px 9px 14px 10px}
.tk .tno{color:var(--pri);font-size:11.5px;font-weight:700}
.tk .tnm{margin:4px 0;font-size:12.5px;font-weight:700}
.tk .tf{display:flex;justify-content:space-between;gap:8px;color:var(--sub);font-size:11px}
.chartbox{overflow:hidden}
.timeline{position:relative;padding-left:27px}
.timeline:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:#BBF7D0}
.tlitem{position:relative;padding:0 0 19px 6px}
.tlitem:before{
 content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;
 background:var(--pri);border:3px solid #fff;box-shadow:0 0 0 2px #4ADE80
}
.tlitem .tt{font-size:13px;font-weight:700}.tlitem .td{margin-top:3px;color:var(--sub);font-size:12px;line-height:1.5}
.tlitem .tm{margin-top:4px;color:var(--pri);font-size:11px;font-weight:700}
.chk{
 display:flex;align-items:flex-start;gap:10px;min-width:0;padding:11px;margin-bottom:9px;
 border:1px solid #DDF7E5;border-radius:15px 10px 16px 11px;background:#FCFFFD
}
.chk .cb{display:grid;place-items:center;width:23px;height:23px;flex:0 0 auto;border-radius:9px 6px 9px 6px;color:#fff}
.chk .cb .material-symbols-outlined{font-size:16px}
.chk .ct{font-size:13px;font-weight:700}.chk .cd{margin-top:2px;color:var(--sub);font-size:11.5px}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.note{
 display:flex;align-items:flex-start;gap:9px;padding:12px;border:1px dashed #4ADE80;
 border-radius:16px 11px 17px 12px;background:#F0FDF4;color:#14532D;
 font-size:12.5px;line-height:1.55
}
.note .material-symbols-outlined{flex:0 0 auto;color:var(--pri);font-size:19px}
.mini{color:var(--sub);font-size:11.5px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
 .hbadges{margin-left:0;width:100%}.split{grid-template-columns:310px minmax(0,1fr)}
 .c3{grid-template-columns:1.2fr .8fr}
}
@media(max-width:820px){
 .wrap{padding-left:14px;padding-right:14px}.kpis{grid-template-columns:1fr 1fr}
 .split,.c2,.c3{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr 1fr}
 .tabs-shell{top:0;border-radius:0 0 18px 18px;margin-left:-14px;margin-right:-14px}
 nav.tabs button{flex:0 0 auto}
}
@media(max-width:560px){
 .top{padding:20px 0 42px}.top .inner{padding:0 15px}.hbadges{display:none}
 .htxt h1{font-size:18px}.htxt p{font-size:11.5px}.logo{width:44px;height:44px}
 nav.tabs button{width:43px;padding:9px}.tabs .lbl{display:none}
 .kpis{gap:9px}.kpi{padding:13px}.kpi .val{font-size:21px}
 .card{padding:14px}.field-grid{grid-template-columns:1fr}.scr-head{align-items:flex-start}
 .scr-head h2{font-size:17px}.scr-head p{font-size:11.5px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
