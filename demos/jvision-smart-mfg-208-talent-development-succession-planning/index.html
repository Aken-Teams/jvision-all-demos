<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --good:#15803D;
  --warn:#A85300;
  --bad:#B91C1C;
  --info:#0369A1;
  --shadow:0 8px 24px rgba(19,78,74,.08);
  --shadow-hover:0 16px 36px rgba(19,78,74,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(13,148,136,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.045) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Crimson Pro","Cormorant Garamond",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
.skip{
  position:fixed;left:16px;top:-60px;z-index:100;
  padding:10px 14px;color:#fff;background:var(--color-foreground);
  border-radius:4px;text-decoration:none
}
.skip:focus{top:12px}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:24px;
  min-height:76px;padding:12px clamp(16px,3vw,42px);
  color:var(--color-card);
  background:rgba(19,78,74,.97);
  border-bottom:4px solid var(--color-secondary);
  box-shadow:0 8px 24px rgba(15,23,42,.16);
  backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{
  width:44px;height:44px;flex:none;
  display:grid;place-items:center;
  color:var(--color-on-secondary);
  background:var(--color-secondary);
  border:1px solid rgba(255,255,255,.45);
  border-radius:4px
}
.logo .material-symbols-outlined{font-size:25px}
.brand h1{
  margin:0;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:clamp(15px,1.7vw,20px);
  font-weight:600;letter-spacing:.025em;line-height:1.2
}
.brand p{margin:3px 0 0;color:#CCFBF1;font-size:13px}
.livechip{
  margin-left:auto;
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;
  color:#ECFDF5;background:rgba(255,255,255,.08);
  border:1px solid rgba(94,234,212,.7);
  border-radius:999px;font-size:13px;white-space:nowrap
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:#86EFAC;border:2px solid #fff
}
.nav{
  position:sticky;top:76px;z-index:40;
  display:flex;gap:4px;overflow-x:auto;
  padding:8px clamp(12px,3vw,42px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  scrollbar-width:thin
}
.nav button{
  min-height:44px;flex:none;
  display:flex;align-items:center;gap:7px;
  padding:9px 13px;
  color:var(--muted);background:transparent;
  border:1px solid transparent;border-radius:3px;
  font-weight:600;transition:background-color .22s,color .22s,border-color .22s,transform .22s
}
.nav button:hover{color:var(--ink);background:var(--color-muted);border-color:var(--line)}
.nav button.on{
  color:#fff;background:var(--color-primary);
  border-color:#0F766E;box-shadow:inset 0 -3px 0 var(--color-secondary)
}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{max-width:1440px;margin:auto;padding:clamp(20px,3vw,38px) clamp(14px,3vw,42px) 64px}
.scr-head{
  display:flex;align-items:flex-end;gap:13px;flex-wrap:wrap;
  margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)
}
.scr-head .big{font-size:34px;color:var(--color-primary)}
.scr-head h2{
  margin:0;font-family:"Cinzel","Crimson Pro",serif;
  font-size:clamp(22px,3vw,31px);font-weight:600;letter-spacing:.01em
}
.scr-head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tag{
  margin-left:auto;padding:5px 10px;
  color:var(--ink);background:#CCFBF1;
  border:1px solid var(--line);border-radius:3px;
  font:600 12px "Cinzel",serif;letter-spacing:.05em
}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.two-even{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;padding:18px;
  color:var(--color-card-foreground);background:var(--color-card);
  border:1px solid rgba(13,148,136,.28);
  border-radius:5px;box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease
}
.card:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:var(--shadow-hover)}
.card h3{
  margin:0 0 14px;display:flex;align-items:center;gap:8px;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:15px;font-weight:600;letter-spacing:.015em
}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary)}
.card .sub{margin-left:auto;color:var(--muted);font:400 13px "Crimson Pro",serif}
.kpi{position:relative;overflow:hidden;border-top:4px solid var(--color-primary)}
.kpi:after{
  content:"";position:absolute;right:-20px;top:-30px;
  width:90px;height:90px;border-radius:50%;background:rgba(45,212,191,.1)
}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:600}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .val{
  position:relative;z-index:1;margin-top:10px;
  font:600 34px/1 "Cinzel","Crimson Pro",serif;
  font-variant-numeric:tabular-nums
}
.kpi .val small{margin-left:5px;color:var(--muted);font:600 14px "Crimson Pro",serif}
.delta{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:13px;font-weight:600}
.delta .material-symbols-outlined{font-size:16px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chartbox{position:relative;width:100%;overflow:hidden}
.h220{height:220px}.h240{height:240px}.h260{height:260px}.h300{height:300px}
.tbl-wrap{overflow-x:auto;border:1px solid rgba(13,148,136,.3);border-radius:4px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
th{
  padding:11px 12px;text-align:left;white-space:nowrap;
  color:#fff;background:var(--color-foreground);
  font-family:"Cinzel","Crimson Pro",serif;font-size:12px;font-weight:600;letter-spacing:.025em
}
td{padding:10px 12px;color:var(--ink);border-top:1px solid #CDEBE7}
tbody tr:nth-child(even) td{background:#F7FFFD}
tbody tr:hover td{background:#CCFBF1}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;border:1px solid currentColor;border-radius:3px;
  font-size:12px;font-weight:700;line-height:1;white-space:nowrap
}
.badge:before{font-family:"Material Symbols Outlined";font-size:14px}
.b-good{color:#166534;background:#DCFCE7}.b-good:before{content:"check_circle"}
.b-warn{color:#854D0E;background:#FEF3C7}.b-warn:before{content:"schedule"}
.b-bad{color:#991B1B;background:#FEE2E2}.b-bad:before{content:"warning"}
.b-info{color:#075985;background:#E0F2FE}.b-info:before{content:"info"}
.b-acc{color:#115E59;background:#CCFBF1}.b-acc:before{content:"analytics"}
.pbar{height:8px;min-width:70px;overflow:hidden;background:#DCE8E8;border-radius:2px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.risk{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #CDEBE7}
.risk:first-child{border-top:0}
.rk{
  width:46px;height:46px;flex:none;display:grid;place-items:center;
  border:2px solid currentColor;border-radius:4px;
  font:600 17px "Cinzel",serif
}
.rk.hi{color:#991B1B;background:#FEE2E2}
.rk.md{color:#854D0E;background:#FEF3C7}
.rk.lo{color:#166534;background:#DCFCE7}
.risk .nm{font-size:14px;font-weight:700}
.risk .meta{margin-top:2px;color:var(--muted);font-size:13px}
.ninebox{display:grid;grid-template-columns:64px repeat(3,1fr);gap:7px}
.nb-axis{display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.nb-cell{position:relative;min-height:84px;padding:10px;border:1px solid #99DAD2;border-radius:4px}
.nb-cell .cellhd{margin-bottom:6px;font-size:12px;font-weight:700}
.nb-c-star{background:#CCFBF1;border:2px solid var(--color-primary)}
.nb-c-hi{background:#DCFCE7}.nb-c-mid{background:#E0F2FE}
.nb-c-lo{background:#F1F5F9}.nb-c-risk{background:#FEF2F2}
.chip{
  display:inline-block;margin:2px 3px 0 0;padding:3px 7px;
  color:var(--ink);background:rgba(255,255,255,.85);
  border:1px solid rgba(19,78,74,.18);border-radius:2px;font-size:11px;font-weight:600
}
.chip.star{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.tl{position:relative;padding-left:25px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.node{
  position:absolute;left:-24px;top:3px;width:16px;height:16px;
  background:var(--info);border:3px solid #fff;border-radius:50%;
  box-shadow:0 0 0 2px var(--info)
}
.node.done{background:var(--good);box-shadow:0 0 0 2px var(--good)}
.node.now{background:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.tl-item .tt{font-size:14px;font-weight:700}
.tl-item .td{margin-top:2px;color:var(--muted);font-size:13px}
.tl-item .tm{margin-top:3px;color:var(--muted);font:12px ui-monospace,monospace}
.mentor{
  display:flex;align-items:center;gap:12px;min-width:0;padding:12px;
  background:#F7FFFD;border:1px solid #B7E6DF;border-radius:4px
}
.ava{
  width:43px;height:43px;flex:none;display:grid;place-items:center;
  color:#fff;background:var(--color-primary);border-radius:4px;
  font:600 17px "Cinzel",serif
}
.mentor .info{min-width:0}.mentor .info b{font-size:14px}
.mentor .info span{display:block;color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block;border:1px solid rgba(19,78,74,.3);border-radius:2px}
.footer{margin-top:34px;color:var(--muted);font-size:13px;text-align:center;line-height:1.7}
.grid-item{animation:reveal .42s cubic-bezier(.2,.9,.25,1.2) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two,.two-even{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar{min-height:68px;padding:10px 14px}
  .nav{top:68px}
  .brand p{display:none}
  .livechip{font-size:12px}
  .three{grid-template-columns:1fr}
  .wrap{padding-top:22px}
}
@media(max-width:560px){
  .livechip{display:none}
  .navtxt{display:none}
  .nav{justify-content:space-between}
  .nav button{min-width:44px;justify-content:center;padding:9px}
  .kpis{grid-template-columns:1fr}
  .scr-head{align-items:flex-start}
  .tag{margin-left:47px}
  .card{padding:14px}
  .ninebox{grid-template-columns:48px repeat(3,minmax(82px,1fr));overflow-x:auto}
  .nb-cell{min-height:100px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  .grid-item{animation:none}
}
</style>

function baseOpt(o){o=o||{};return{responsive:true,maintainAspectRatio:false,indexAxis:o.indexAxis||"x",plugins:{legend:{display:o.legend!==false,labels:{color:TXTC,boxWidth:12,font:{size:12}}},tooltip:{titleColor:"#fff",bodyColor:"#fff",backgroundColor:"#134E4A"}},scales:{x:{stacked:!!o.stacked,ticks:{color:TICK,font:{size:12}},grid:{color:GRID}},y:{stacked:!!o.stacked,beginAtZero:true,max:o.y100?100:undefined,ticks:{color:TICK,font:{size:12}},grid:{color:GRID}}}}}
function radarOpt(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:TXTC,boxWidth:12}}},scales:{r:{angleLines:{color:GRID},grid:{color:GRID},pointLabels:{color:TICK,font:{size:12}},ticks:{display:false},suggestedMin:0,suggestedMax:100}}}}
function donutOpt(){return{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{color:TXTC,boxWidth:12,font:{size:12},padding:14}}}}}
var RENDER=[s0,s1,s2,s3,s4,s5],INIT=[initS0,initS1,initS2,initS3,initS4,initS5];
function show(i){
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){var active=+btns[b].getAttribute("data-i")===i;btns[b].className=active?"on":"";btns[b].setAttribute("aria-current",active?"page":"false")}
  killCharts();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  INIT[i]()
}
(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<SCREENS.length;i++)h+='<button type="button" data-i="'+i+'" aria-label="'+SCREENS[i].title+'"><span class="material-symbols-outlined" aria-hidden="true">'+SCREENS[i].icon+'</span><span class="navtxt">'+SCREENS[i].title+'</span></button>';
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++)(function(el){el.addEventListener("click",function(){var n=+el.getAttribute("data-i");if(location.hash!=="#v"+n)location.hash="v"+n;else show(n);try{window.scrollTo(0,0)}catch(e){}})})(btns[j])
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),n=document.querySelectorAll("[data-i]").length||6;show(m?Math.min(+m[1],n-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
