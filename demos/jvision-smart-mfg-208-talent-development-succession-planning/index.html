<style>
:root{

  --line:#2c2447; --txt:#e9e6f5; --muted:#a49dc4; --dim:#726a94;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(124,58,237,.18),transparent 60%),var(--bg);
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,#140f24,#1a1330);
  border-bottom:1px solid var(--line);
  padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;color:#fff;box-shadow:0 0 18px rgba(124,58,237,.55);
}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand h1{font-size:15px;margin:0;font-weight:800;line-height:1.2;white-space:nowrap}
.brand p{font-size:11px;margin:0;color:var(--dim)}
.livechip{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);
  background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);padding:5px 11px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 18px;background:#120d20;border-bottom:1px solid var(--line)}
.nav button{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;min-width:0;
}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{color:var(--txt);background:rgba(124,58,237,.12)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--acc),#6d28d9);border-color:var(--acc2);box-shadow:0 0 16px rgba(124,58,237,.4)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.scr-head .material-symbols-outlined.big{font-size:30px;color:var(--acc2)}
.scr-head h2{margin:0;font-size:20px;font-weight:800}
.scr-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.scr-head .tag{margin-left:auto;font-size:11px;color:var(--acc2);border:1px solid var(--line);padding:5px 11px;border-radius:999px;background:var(--panel)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:1.4fr 1fr}
.two-even{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two,.two-even,.three{grid-template-columns:1fr}
}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--acc2)}
.card .sub{font-size:11.5px;color:var(--dim);font-weight:400;margin-left:auto}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--acc2)}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;line-height:1}
.kpi .val small{font-size:13px;color:var(--dim);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11.5px;margin-top:7px;display:flex;align-items:center;gap:4px}
.kpi .delta .material-symbols-outlined{font-size:14px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.chartbox{position:relative;width:100%;overflow:hidden}
.h220{height:220px} .h240{height:240px} .h260{height:260px} .h300{height:300px}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{background:#160f28;color:var(--muted);text-align:left;padding:10px 12px;font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);color:var(--txt)}
tr:hover td{background:rgba(124,58,237,.06)}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-good{background:rgba(52,211,153,.14);color:var(--good)}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.b-bad{background:rgba(248,113,113,.14);color:var(--bad)}
.b-info{background:rgba(96,165,250,.14);color:var(--info)}
.b-acc{background:rgba(167,139,250,.16);color:var(--acc2)}
.pbar{height:7px;border-radius:999px;background:#241d3d;overflow:hidden;min-width:70px}
.pbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.risk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.risk:first-child{border-top:none}
.risk .rk{width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:16px}
.rk.hi{background:rgba(248,113,113,.15);color:var(--bad)}
.rk.md{background:rgba(251,191,36,.15);color:var(--warn)}
.rk.lo{background:rgba(52,211,153,.15);color:var(--good)}
.risk .nm{font-weight:700;font-size:13px}
.risk .meta{font-size:11px;color:var(--dim);margin-top:2px}
.ninebox{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:6px}
.nb-axis{display:grid;place-items:center;font-size:10.5px;color:var(--dim);text-align:center;font-weight:600}
.nb-cell{border-radius:10px;padding:9px;min-height:78px;border:1px solid var(--line);position:relative}
.nb-cell .cellhd{font-size:10.5px;font-weight:700;opacity:.9;margin-bottom:5px}
.nb-c-star{background:rgba(124,58,237,.20);border-color:var(--acc2)}
.nb-c-hi{background:rgba(52,211,153,.12)}
.nb-c-mid{background:rgba(96,165,250,.10)}
.nb-c-lo{background:rgba(251,191,36,.10)}
.nb-c-risk{background:rgba(248,113,113,.10)}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);margin:2px 3px 0 0;color:var(--txt)}
.chip.star{background:rgba(167,139,250,.25);color:#fff}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 0}
.tl-item:last-child{padding-bottom:0}
.tl-item .node{position:absolute;left:-19px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.tl-item .node.done{background:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.2)}
.tl-item .node.now{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.2)}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .td{font-size:11.5px;color:var(--muted);margin-top:2px}
.tl-item .tm{font-size:10.5px;color:var(--dim);margin-top:3px}
.mentor{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-width:0}
.ava{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.mentor .info{min-width:0}
.mentor .info b{font-size:13px}
.mentor .info span{font-size:11px;color:var(--dim);display:block}
.bench{display:flex;align-items:center;gap:4px}
.bench i{width:14px;height:22px;border-radius:3px;background:#241d3d}
.bench i.f{background:linear-gradient(180deg,var(--acc2),var(--acc))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.footer{color:var(--dim);font-size:11px;text-align:center;margin-top:30px;line-height:1.7}
@media(max-width:560px){
  .navtxt{display:none}
  .nav button{padding:8px 11px}
  .brand p{display:none}
}
</style>
</head>

function killCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}

}

function baseOpt(o){o=o||{};
  return {responsive:true,maintainAspectRatio:false,indexAxis:o.indexAxis||"x",
    plugins:{legend:{display:o.legend===false?false:true,labels:{color:TXTC,boxWidth:12,font:{size:11}}},tooltip:{titleColor:"#fff",bodyColor:"#fff"}},
    scales:{x:{stacked:!!o.stacked,ticks:{color:TICK,font:{size:11}},grid:{color:GRID}},y:{stacked:!!o.stacked,beginAtZero:true,max:o.y100?100:undefined,ticks:{color:TICK,font:{size:11}},grid:{color:GRID}}}};
}
function radarOpt(){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:TXTC,boxWidth:12,font:{size:11}}}},scales:{r:{angleLines:{color:GRID},grid:{color:GRID},pointLabels:{color:TICK,font:{size:11}},ticks:{display:false,backdropColor:"transparent"},suggestedMin:0,suggestedMax:100}}};}
function donutOpt(){return {responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{color:TXTC,boxWidth:12,font:{size:11},padding:12}}}};}

function show(i){
  var nav=document.getElementById("nav");
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  killCharts();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  INIT[i]();
}

(function buildNav(){
  var nav=document.getElementById("nav");var h="";
  for(var i=0;i<SCREENS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span><span class="navtxt">'+SCREENS[i].title+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){(function(el){el.addEventListener("click",function(){show(+el.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(btns[j]);}
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
