<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>備品備件管理系統 · Spare Parts Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --sidebar:#0F172A;
  --sidebar-muted:#CBD5E1;
  --mono:"Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:"Fira Sans","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--color-background);scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
  vertical-align:middle;
}
.shell{
  display:grid;
  grid-template-columns:244px minmax(0,1fr);
  min-height:100vh;
}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:14px;
  height:100vh;
  overflow:auto;
  padding:20px 14px 16px;
  border-right:1px solid #1E293B;
  background:var(--sidebar);
  color:#F8FAFC;
}
.side .bd{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:56px;
  padding:0 8px 16px;
  border-bottom:1px solid rgba(226,232,240,.16);
}
.side .lg{
  display:grid;
  flex:none;
  width:40px;
  height:40px;
  place-items:center;
  border:1px solid rgba(255,255,255,.24);
  border-radius:8px;
  background:var(--color-primary);
  box-shadow:4px 4px 0 rgba(59,130,246,.25);
  color:var(--color-on-primary);
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
}
.side .bd b{
  display:block;
  color:#FFFFFF;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}
.side .bd span{
  display:block;
  margin-top:2px;
  color:#93C5FD;
  font-family:var(--mono);
  font-size:9px;
  font-weight:500;
  letter-spacing:.12em;
}
.side .nav{display:flex;flex-direction:column;gap:5px}
.side button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--sidebar-muted);
  font-weight:500;
  text-align:left;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.side button .material-symbols-outlined{color:#94A3B8}
.side button:hover{
  border-color:rgba(148,163,184,.28);
  background:#1E293B;
  color:#FFFFFF;
  transform:translateX(2px);
}
.side button.on{
  border-color:#60A5FA;
  background:var(--color-primary);
  color:#FFFFFF;
  box-shadow:3px 3px 0 rgba(96,165,250,.22);
}
.side button.on:before{
  position:absolute;
  left:-12px;
  width:3px;
  height:24px;
  background:#FDBA74;
  content:"";
}
.side button.on .material-symbols-outlined{color:#FFFFFF}
.side .foot{
  margin-top:auto;
  padding:14px 9px 2px;
  border-top:1px solid rgba(226,232,240,.16);
  color:#CBD5E1;
  font-family:var(--mono);
  font-size:10px;
  line-height:1.8;
}
.main{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px clamp(16px,2.2vw,34px) 40px;
}
.vh{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:78px;
  margin:-24px calc(clamp(16px,2.2vw,34px) * -1) 20px;
  padding:15px clamp(16px,2.2vw,34px);
  border-bottom:1px solid var(--color-border);
  background:rgba(248,250,252,.94);
  backdrop-filter:blur(12px);
}
.vh h2{
  margin:0;
  color:var(--color-foreground);
  font-size:clamp(20px,2vw,27px);
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.2;
}
.vh p{margin:5px 0 0;color:var(--color-muted-foreground);font-size:12px}
.live{
  display:flex;
  flex:none;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  border:1px solid #86EFAC;
  border-radius:999px;
  background:#F0FDF4;
  color:#166534;
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
}
.live i{
  display:inline-block;
  width:8px;
  height:8px;
  border:2px solid #FFFFFF;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 2px #16A34A;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}
.kpis>*{min-width:0}
.kpi{
  position:relative;
  min-height:114px;
  overflow:hidden;
  padding:15px 16px;
  border:1px solid var(--color-border);
  border-radius:9px;
  background:var(--color-card);
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi:before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--color-primary);
  content:"";
}
.kpi:hover{
  border-color:#93C5FD;
  box-shadow:0 8px 20px rgba(15,23,42,.08);
  transform:translateY(-2px);
}
.kpi .l{
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
}
.kpi .v{
  margin-top:5px;
  color:var(--color-foreground);
  font-family:var(--mono);
  font-size:25px;
  font-weight:700;
  letter-spacing:-.04em;
  line-height:1.2;
}
.kpi .v small{letter-spacing:0}
.kpi .d{margin-top:6px;font-size:10px;font-weight:600}
.kpi .ic{
  position:absolute;
  top:14px;
  right:13px;
  color:var(--color-primary);
  font-size:27px;
  opacity:.22;
}
.up{color:#166534}.dn{color:#B91C1C}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(280px,.8fr) minmax(0,1.4fr)}
.card{
  min-width:0;
  padding:16px;
  border:1px solid var(--color-border);
  border-radius:9px;
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:0 1px 3px rgba(15,23,42,.05);
}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:26px;
  margin:0 0 13px;
  padding-bottom:10px;
  border-bottom:1px solid var(--color-border);
  color:var(--color-foreground);
  font-size:13px;
  font-weight:700;
  letter-spacing:.01em;
  line-height:1.35;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-family:var(--sans);
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{background:#F0FDF4;color:#166534}
.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#EFF6FF;color:#1D4ED8}
.scroll{
  width:100%;
  overflow-x:auto;
  scrollbar-color:#94A3B8 #E2E8F0;
  scrollbar-width:thin;
}
table.data{
  width:100%;
  border-spacing:0;
  border-collapse:separate;
  font-size:12px;
}
table.data th,table.data td{
  padding:10px;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  border-top:1px solid var(--color-border);
  background:var(--color-muted);
  color:#334155;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
}
table.data th:first-child{border-left:1px solid var(--color-border);border-radius:6px 0 0}
table.data th:last-child{border-right:1px solid var(--color-border);border-radius:0 6px 0 0}
table.data tbody tr{transition:background-color .18s ease}
table.data tbody tr:hover{background:#F8FAFC}
table.data td:first-child,
table.data td:nth-child(3),
table.data td:nth-child(5){font-family:var(--mono);font-variant-numeric:tabular-nums}
table.data th:nth-child(3),
table.data td:nth-child(3),
table.data th:nth-child(5),
table.data td:nth-child(5){text-align:right}
.rep{display:flex;flex-direction:column;gap:8px}
.ri{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:60px;
  padding:10px 12px 10px 15px;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-destructive);
  border-radius:7px;
  background:#FFFFFF;
  transition:border-color .2s ease,background-color .2s ease,transform .2s ease;
}
.ri:hover{background:#F8FAFC;transform:translateX(2px)}
.ri.w{border-left-color:#D97706}
.ri.o{border-left-color:var(--ok)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:12px;font-weight:600}
.ri .mid b:first-letter{font-family:var(--mono)}
.ri .mid small{
  display:block;
  margin-top:3px;
  color:var(--color-muted-foreground);
  font-size:10px;
}
.ri .qty{flex:none;text-align:right}
.ri .qty b{
  color:var(--color-accent);
  font-family:var(--mono);
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.ri .qty small{display:block;color:var(--color-muted-foreground);font-size:9px}
.chart{height:250px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.two>*{min-width:0}
.bar{
  height:7px;
  overflow:hidden;
  border-radius:2px;
  background:var(--color-muted);
}
.bar i{
  display:block;
  height:100%;
  border-radius:2px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  transition:width .35s ease;
}
.tl{display:flex;flex-direction:column}
.tl .ev{position:relative;display:flex;gap:11px;padding-bottom:13px}
.tl .ev:before{
  position:absolute;
  top:26px;
  bottom:0;
  left:14px;
  width:1px;
  background:var(--color-border);
  content:"";
}
.tl .ev:last-child:before{display:none}
.tl .dot{
  z-index:1;
  display:grid;
  flex:none;
  width:30px;
  height:30px;
  place-items:center;
  border:2px solid #FFFFFF;
  border-radius:50%;
  color:#FFFFFF;
  box-shadow:0 0 0 1px var(--color-border);
}
.tl .dot .material-symbols-outlined{font-size:16px}
.tl .body{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:#FFFFFF;
}
.tl .body .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl .body b{font-size:12px;font-weight:600}
.tl .body .tm{
  color:var(--color-muted-foreground);
  font-family:var(--mono);
  font-size:10px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.tl .body small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:10px}
.tl .body code{
  padding:1px 5px;
  border:1px solid #BFDBFE;
  border-radius:3px;
  background:#EFF6FF;
  color:#1D4ED8;
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
}
.thr{display:flex;flex-direction:column;gap:9px}
.trow{
  padding:11px 12px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:#FFFFFF;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.trow:hover{border-color:#93C5FD;box-shadow:0 4px 12px rgba(15,23,42,.06)}
.trow .h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px;
  flex-wrap:wrap;
}
.trow .h b{font-size:12px;font-weight:600}
.trow .h span{color:var(--color-muted-foreground);font-size:10px}
.trow .h>.tag,.trow .h span .tag{margin-left:6px;color:inherit}
.gauge{
  position:relative;
  height:10px;
  overflow:visible;
  border-radius:2px;
  background:var(--color-muted);
}
.gauge .fill{
  position:absolute;
  inset:0 auto 0 0;
  border-radius:2px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  transition:width .35s ease;
}
.gauge .rop,.gauge .saf{
  position:absolute;
  top:-3px;
  bottom:-3px;
  width:3px;
  border:1px solid #FFFFFF;
  border-radius:1px;
}
.gauge .rop{background:var(--color-destructive)}
.gauge .saf{background:#D97706}
.leg{
  display:flex;
  gap:14px;
  margin-top:10px;
  color:var(--color-muted-foreground);
  font-size:10px;
  flex-wrap:wrap;
}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{
  display:inline-block;
  width:10px;
  height:10px;
  border:1px solid rgba(15,23,42,.16);
  border-radius:2px;
}
.mtx{
  display:grid;
  grid-template-columns:130px repeat(4,minmax(82px,1fr));
  gap:5px;
  min-width:570px;
}
.mtx .hd{
  padding:6px;
  color:var(--color-muted-foreground);
  font-size:10px;
  font-weight:700;
  text-align:center;
}
.mtx .rh{
  display:flex;
  align-items:center;
  padding:6px 8px;
  color:var(--color-foreground);
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
}
.mtx .cell{
  position:relative;
  min-height:50px;
  padding:8px 6px;
  border:2px solid rgba(255,255,255,.72);
  border-radius:6px;
  color:#FFFFFF;
  font-size:10px;
  font-weight:700;
  line-height:1.35;
  text-align:center;
  box-shadow:inset 0 0 0 1px rgba(15,23,42,.1);
}
.mtx .cell small{
  display:block;
  margin-top:2px;
  color:#FFFFFF;
  font-family:var(--mono);
  font-size:9px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.cbrd{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;min-width:520px}
.cbrd>*{min-width:0}
.ccol{
  padding:10px;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:#F8FAFC;
}
.ccol .ch{
  display:flex;
  justify-content:space-between;
  gap:6px;
  margin-bottom:8px;
  color:var(--color-foreground);
  font-size:11px;
  font-weight:700;
}
.ccol .ch .n{
  min-width:24px;
  padding:1px 6px;
  border:1px solid #BFDBFE;
  border-radius:999px;
  background:#EFF6FF;
  color:#1D4ED8;
  font-family:var(--mono);
  font-size:10px;
  text-align:center;
}
.cc{
  margin-bottom:7px;
  padding:8px 9px;
  border:1px solid var(--color-border);
  border-radius:6px;
  background:#FFFFFF;
  font-size:11px;
}
.cc:last-child{margin-bottom:0}
.cc b{font-size:11px;font-weight:600}
.cc small{display:block;margin-top:4px;color:var(--color-muted-foreground);font-size:10px}
.cc small:first-letter{font-family:var(--mono)}
@media(max-width:1024px){
  .shell{grid-template-columns:214px minmax(0,1fr)}
  .main{padding-right:18px;padding-left:18px}
  .vh{margin-right:-18px;margin-left:-18px;padding-right:18px;padding-left:18px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g11,.g21,.two{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}
  .side{
    position:relative;
    height:auto;
    min-height:0;
    padding:12px 14px;
    border-right:0;
    border-bottom:1px solid #1E293B;
  }
  .side .bd{min-height:48px;padding:0 2px 10px}
  .side .lg{width:36px;height:36px}
  .side .nav{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }
  .side button{
    justify-content:flex-start;
    min-height:42px;
    padding:8px;
    font-size:11px;
  }
  .side button.on:before{display:none}
  .side button:hover{transform:none}
  .side .foot{display:none}
  .main{padding-top:0}
  .vh{
    top:0;
    min-height:72px;
    margin-top:0;
    margin-bottom:15px;
  }
  .vh h2{font-size:20px}
  .vh p{max-width:440px}
}
@media(max-width:520px){
  .side .nav{grid-template-columns:repeat(6,1fr)}
  .side button{justify-content:center;padding:9px}
  .side button .txt{display:none}
  .side button .material-symbols-outlined{font-size:21px}
  .vh{align-items:flex-start;flex-direction:column;padding-top:12px;padding-bottom:12px}
  .live{align-self:flex-start}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{min-height:105px;padding:13px}
  .kpi .v{font-size:21px}
  .card{padding:13px}
  .ri{align-items:flex-start}
  .ri .qty{padding-top:2px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}
  .kpi{min-height:100px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">備</div><div><b>備品備件管理</b><span>SPARE PARTS MGMT</span></div></div>
    <div class="nav" id="nav" aria-label="系統功能導覽"></div>
    <div class="foot">備件料號 2,860 · 儲位 480<br/>缺貨率 2.4% · 週轉 6.8 天<br/>關鍵備件 128 項受監控</div>
  </aside>
  <main class="main">
