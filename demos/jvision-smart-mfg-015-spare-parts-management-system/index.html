<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>備品備件管理系統 · Spare Parts Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#15803d;--accent2:#4ade80;--ink:#0e1a12;--bg:#eef3ee;--card:#fff;--line:#dbe6dd;--mut:#5c7263;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--dark:#0f2417}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--dark);color:#dcefe2;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(21,128,61,.45);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:9.5px;color:var(--accent2);letter-spacing:1.2px}
.side .nav{display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#a7c4b1;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:21px;color:#6f9680}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#7ba088;border-top:1px solid rgba(255,255,255,.1);line-height:1.7}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#dcfce7;color:#166534;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28;font-size:30px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:.9fr 1.3fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0efe6;color:#166534}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f2f7f3}
table.data tr:last-child td{border-bottom:0}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.o{border-left-color:var(--ok)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:16px;color:var(--accent)}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#e6efe8;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
.tl{display:flex;flex-direction:column;gap:0}
.tl .ev{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl .ev:before{content:"";position:absolute;left:15px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl .ev:last-child:before{display:none}
.tl .dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;z-index:1}
.tl .dot .material-symbols-outlined{font-size:18px}
.tl .body{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.tl .body .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl .body b{font-size:13px;font-family:"Noto Sans TC"}
.tl .body .tm{color:var(--mut);font-size:11px;white-space:nowrap}
.tl .body small{color:var(--mut);font-size:11.5px;display:block;margin-top:3px}
.tl .body code{background:#eef4f0;color:var(--accent);padding:1px 6px;border-radius:5px;font-size:11px;font-weight:700}
.thr{display:flex;flex-direction:column;gap:11px}
.trow{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.trow .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.trow .h b{font-size:13px;font-family:"Noto Sans TC"}
.trow .h span{font-size:11px;color:var(--mut)}
.gauge{position:relative;height:12px;background:#e6efe8;border-radius:7px;overflow:hidden}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.gauge .rop{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--bad);border-radius:2px}
.gauge .saf{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--warn);border-radius:2px}
.leg{display:flex;gap:16px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mtx{display:grid;grid-template-columns:130px repeat(4,1fr);gap:6px;min-width:560px}
.mtx .hd{font-size:11px;font-weight:700;color:var(--mut);padding:6px;text-align:center}
.mtx .rh{font-size:12px;font-weight:700;font-family:"Noto Sans TC";display:flex;align-items:center;padding:6px 8px}
.mtx .cell{border-radius:9px;padding:9px 6px;text-align:center;font-size:11px;font-weight:700;color:#fff;line-height:1.4}
.mtx .cell small{display:block;font-size:9.5px;opacity:.9;font-weight:600}
.cbrd{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:520px}
.cbrd>*{min-width:0}
.ccol{background:#f4f8f5;border:1px solid var(--line);border-radius:12px;padding:11px}
.ccol .ch{font-size:12px;font-weight:800;font-family:"Noto Sans TC";margin-bottom:9px;display:flex;justify-content:space-between;gap:6px}
.ccol .ch .n{background:#fff;border-radius:20px;padding:1px 8px;font-size:11px;color:var(--accent)}
.cc{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.cc:last-child{margin-bottom:0}
.cc b{font-family:"Noto Sans TC";font-size:12.5px}
.cc small{color:var(--mut);display:block;font-size:11px;margin-top:3px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible;padding:12px 14px}
 .side .bd{width:100%;padding-bottom:8px}
 .side .nav{flex-direction:row;flex-wrap:wrap}
 .side button{width:auto;flex:none;white-space:nowrap}
 .side .foot{display:none}
}
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.g21,.two{grid-template-columns:1fr}
}
@media(max-width:560px){
 .side button .txt{display:none}
 .side button{padding:11px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">備</div><div><b>備品備件管理</b><span>SPARE PARTS MGMT</span></div></div>
