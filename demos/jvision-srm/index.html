<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供應商關係管理 SRM｜Jvision Demo</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#a16207;
  --accent2:#eab308;
  --bg:#f6f5f0;
  --panel:#ffffff;
  --line:#e7e3d7;
  --ink:#2c2416;
  --muted:#7a705c;
  --soft:#faf8f2;
  --good:#15803d;
  --warn:#b45309;
  --bad:#b91c1c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:252px;flex:0 0 252px;min-width:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:22px 16px;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.brand-logo{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 16px rgba(161,98,7,.32);
}
.brand-logo .material-symbols-outlined{font-size:26px;}
.brand-t{min-width:0;}
.brand-t b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block;}
.brand-t span{font-size:11px;color:var(--muted);}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;min-width:0;
  border:1px solid transparent;background:transparent;cursor:pointer;
  padding:11px 12px;border-radius:11px;text-align:left;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
  transition:.16s;
}
.nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav button .idx{margin-left:auto;font-size:11px;font-weight:700;color:#c7bfa9;flex:0 0 auto;}
.nav button:hover{background:var(--soft);color:var(--ink);}
.nav button.on{
  background:linear-gradient(135deg,rgba(161,98,7,.12),rgba(234,179,8,.14));
  color:var(--accent);border-color:rgba(161,98,7,.25);
}
.nav button.on .idx{color:var(--accent);}
.side-foot{margin-top:auto;padding:14px 8px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7;}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.topbar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.3px;}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:4px;}
.crumb{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px;}
.crumb .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);}

.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.7fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(60,50,20,.03);}
.card h3{margin:0 0 4px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .cap{font-size:11.5px;color:var(--muted);margin-bottom:14px;}

.kpi{display:flex;flex-direction:column;gap:9px;}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:.5px;line-height:1;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;width:fit-content;}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.up{background:rgba(21,128,61,.1);color:var(--good);}
.down{background:rgba(185,28,28,.1);color:var(--bad);}
.flat{background:rgba(180,83,9,.1);color:var(--warn);}

.chart{width:100%;height:260px;min-width:0;overflow:hidden;}
.chart.sm{height:210px;}
.chart.lg{height:300px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px;border-bottom:1px solid #f1eee3;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.tblwrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.b-a{background:rgba(21,128,61,.12);color:var(--good);}
.b-b{background:rgba(180,83,9,.12);color:var(--warn);}
.b-c{background:rgba(185,28,28,.12);color:var(--bad);}
.b-n{background:#efece2;color:var(--muted);}
.b-p{background:rgba(161,98,7,.12);color:var(--accent);}

.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#efece2;color:var(--muted);}
.tagA{background:linear-gradient(135deg,#a16207,#eab308);color:#fff;}
.tagB{background:#fef3c7;color:#92600a;}
.tagC{background:#fde8e8;color:#b91c1c;}

.avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#a16207,#eab308);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;}
.rowc{display:flex;align-items:center;gap:9px;min-width:0;}

.bar{height:7px;border-radius:4px;background:#eee7d4;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.col>.ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 3px;}
.col>.ch .n{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:10.5px;padding:1px 8px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(60,50,20,.04);}
.tk:last-child{margin-bottom:0;}
.tk .tt{font-size:12.5px;font-weight:700;margin-bottom:5px;}
.tk .mm{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:space-between;}
.tk .amt{font-weight:800;color:var(--accent);}

.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 18px 4px;}
.tli:last-child{padding-bottom:0;}
.tli:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);}
.tli.done:before{background:var(--accent);}
.tli.warnp:before{border-color:var(--warn);}
.tli .th{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;}
.tli .td{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
.tli .tm{font-size:10.5px;color:var(--accent);font-weight:700;margin-top:3px;}

.mini{display:flex;flex-direction:column;gap:12px;}
.mrow{display:flex;align-items:center;gap:11px;min-width:0;}
.mrow .mn{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mrow .mv{font-size:12.5px;font-weight:800;flex:0 0 auto;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);}

.risk-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.risk-gauge{flex:0 0 190px;min-width:0;}
.risk-list{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px;}
.ritem{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--soft);min-width:0;}
.ritem .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
.ritem .ic.hi{background:var(--bad);}
.ritem .ic.md{background:var(--warn);}
.ritem .ic.lo{background:var(--good);}
.ritem .rt{min-width:0;flex:1 1 auto;}
.ritem .rt b{font-size:12.5px;display:block;}
.ritem .rt span{font-size:11px;color:var(--muted);}
.ritem .rv{font-size:11px;font-weight:800;flex:0 0 auto;text-align:right;}

.bid-live{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--bad);}
.bid-live .blink{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px rgba(185,28,28,.15);}
.stars{color:var(--accent2);font-size:13px;letter-spacing:1px;}
.stars .e{color:#e2dcc9;}

.scorecard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:0;}
@media(max-width:560px){.scorecard{grid-template-columns:1fr 1fr;}}
.sc{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0;}
.sc .scl{font-size:11px;color:var(--muted);font-weight:600;}
.sc .scv{font-size:22px;font-weight:800;margin-top:4px;color:var(--accent);}

@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);padding:14px 14px 10px;}
  .brand{border-bottom:none;padding-bottom:10px;margin-bottom:8px;}
  .side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px;}
  .nav button{width:auto;padding:9px 13px;}
  .nav button .idx{display:none;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:10px;}
  .topbar h1{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">handshake</span></div>
      <div class="brand-t"><b>Jvision SRM</b><span>供應商關係管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Demo 環境 · 模擬資料<br/>© 2026 Jvision 採購協同
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">供應商主檔與分級</h1>
        <div class="sub" id="scr-sub">供應商建檔、分類與 ABC 分級管理</div>
      </div>
      <div class="crumb"><span class="dot"></span>採購供應鏈 · SRM</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
"use strict";
var SCREENS=[
  {icon:"groups",name:"供應商主檔",full:"供應商主檔與分級",sub:"供應商建檔、分類與 ABC 分級管理"},
  {icon:"request_quote",name:"詢比議價",full:"詢比議價",sub:"線上發詢價、多家報價比價與議價"},
  {icon:"gavel",name:"電子競標",full:"電子競標",sub:"逆向拍賣即時競價與得標決標"},
  {icon:"receipt_long",name:"訂單交期",full:"採購訂單交期",sub:"下單、在途追蹤與到貨監控"},
  {icon:"insights",name:"供應商績效",full:"供應商績效",sub:"QCD 評分卡與績效趨勢分析"},
  {icon:"warning",name:"交期風險",full:"交期風險預警",sub:"缺料與延遲風險自動排序告警"}
];

var CHARTS={};
function disposeAll(){for(var k in CHARTS){if(CHARTS[k]){try{CHARTS[k].dispose();}catch(e){}CHARTS[k]=null;}}}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  if(CHARTS[id]){try{CHARTS[id].dispose();}catch(e){}}
  var c=echarts.init(el);
  c.setOption(opt);
  CHARTS[id]=c;
}
var GOLD="#a16207",AMBER="#eab308";
function grid(){return{left:8,right:14,top:22,bottom:6,containLabel:true};}
function axStyle(){return{axisLine:{lineStyle:{color:"#d8d0bd"}},axisLabel:{color:"#7a705c",fontSize:11},splitLine:{lineStyle:{color:"#f0ebdd"}}};}

function starRow(n){
  var s="";for(var i=0;i<5;i++){s+=(i<n?"★":"<span class='e'>★</span>");}
  return "<span class='stars'>"+s+"</span>";
}

/* ---------- SCREEN 0: 供應商主檔與分級 ---------- */
function s0(){
  var sup=[
    {c:"SP-1042",n:"鴻昱精密",cat:"機構件",lv:"A",cty:"台中",score:94,st:"合格",spend:1280},
    {c:"SP-2087",n:"泰豐電子",cat:"PCBA",lv:"A",cty:"新竹",score:91,st:"合格",spend:2140},
    {c:"SP-3311",n:"晶盛塑膠",cat:"射出件",lv:"B",cty:"桃園",score:82,st:"合格",spend:640},
    {c:"SP-4506",n:"聯茂表面",cat:"表面處理",lv:"B",cty:"高雄",score:78,st:"觀察",spend:410},
    {c:"SP-5220",n:"大興包材",cat:"包裝材料",lv:"C",cty:"台南",score:66,st:"觀察",spend:180},
    {c:"SP-6741",n:"宇邦五金",cat:"標準件",lv:"C",cty:"彰化",score:59,st:"限用",spend:95}
  ];
  var lvB={A:"tagA",B:"tagB",C:"tagC"};
  var rows=sup.map(function(s){
    return "<tr><td><b>"+s.c+"</b></td><td><div class='rowc'><span class='avatar'>"+s.n.slice(0,1)+"</span><span>"+s.n+"</span></div></td>"+
      "<td>"+s.cat+"</td><td><span class='tag "+lvB[s.lv]+"'>"+s.lv+" 級</span></td><td>"+s.cty+"</td>"+
      "<td><div class='rowc'><div class='bar' style='width:80px'><i style='width:"+s.score+"%'></i></div><b>"+s.score+"</b></div></td>"+
      "<td>"+(s.st==="合格"?"<span class='badge b-a'>合格</span>":s.st==="觀察"?"<span class='badge b-b'>觀察</span>":"<span class='badge b-c'>限用</span>")+"</td>"+
      "<td><b>"+s.spend+"</b> 萬</td></tr>";
  }).join("");

  document.getElementById("view").innerHTML=
  "<div class='grid g4' style='margin-bottom:16px'>"+
    kpi("groups","合格供應商","218","+12","家","up")+
    kpi("verified","A 級供應商","46","21%","佔比","flat")+
    kpi("account_tree","採購品類","34","類","","flat")+
    kpi("history","本季新增評鑑","9","家待審","","up")+
  "</div>"+
  "<div class='grid g23' style='margin-bottom:16px'>"+
    "<div class='card'><h3><span class='material-symbols-outlined'>table_rows</span>供應商主檔清單</h3><div class='cap'>依採購金額與績效分級 · 顯示前 6 筆</div>"+
      "<div class='tblwrap'><table><thead><tr><th>編號</th><th>供應商</th><th>品類</th><th>分級</th><th>據點</th><th>績效分</th><th>狀態</th><th>年採購額</th></tr></thead><tbody>"+rows+"</tbody></table></div></div>"+
    "<div class='card'><h3><span class='material-symbols-outlined'>donut_small</span>ABC 分級佔比</h3><div class='cap'>採購金額 80/15/5 分佈</div><div id='c0a' class='chart sm'></div></div>"+
  "</div>"+
  "<div class='grid g2'>"+
    "<div class='card'><h3><span class='material-symbols-outlined'>public</span>供應商據點分佈</h3><div class='cap'>各縣市合格供應商家數</div><div id='c0b' class='chart sm'></div></div>"+
    "<div class='card'><h3><span class='material-symbols-outlined'>fact_check</span>評鑑狀態總覽</h3><div class='cap'>供應商生命週期管理</div>"+
      "<div class='mini' style='margin-top:6px'>"+
        mrow("已合格供應商","218 家",88)+
        mrow("觀察 / 輔導中","34 家",40)+
        mrow("待現場稽核","9 家",22)+
        mrow("限用 / 淘汰","6 家",12)+
      "</div>"+
      "<div style='margin-top:14px;display:flex;gap:8px;flex-wrap:wrap'>"+
        "<span class='pill'><span class='material-symbols-outlined' style='font-size:15px'>event</span>下次評鑑 08/28</span>"+
        "<span class='pill'><span class='material-symbols-outlined' style='font-size:15px'>shield</span>ISO 稽核合格 96%</span>"+
      "</div></div>"+
  "</div>";

  void document.getElementById("view").offsetHeight;

  mk("c0a",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{color:"#7a705c"}},
    series:[{type:"pie",radius:["48%","72%"],center:["50%","44%"],avoidLabelOverlap:false,itemStyle:{borderColor:"#fff",borderWidth:2},
      label:{formatter:"{b}\n{d}%",color:"#2c2416",fontSize:11},
      data:[{value:80,name:"A 級",itemStyle:{color:GOLD}},{value:15,name:"B 級",itemStyle:{color:AMBER}},{value:5,name:"C 級",itemStyle:{color:"#d6c48a"}}]}]});

  mk("c0b",{grid:grid(),tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["台中","新竹","桃園","高雄","台南","彰化"],axisLine:{lineStyle:{color:"#d8d0bd"}},axisLabel:{color:"#7a705c",fontSize:11}},
    yAxis:Object.assign({type:"value"},axStyle()),
    series:[{type:"bar",data:[52,44,38,29,26,29],barWidth:"52%",itemStyle:{borderRadius:[6,6,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:AMBER},{offset:1,color:GOLD}])}}]});
}

/* ---------- SCREEN 1: 詢比議價 ---------- */
function s1(){
  var q=[
    {v:"鴻昱精密",unit:128,moq:500,lead:14,pay:"月結60",valid:"08/25",sel:true},
    {v:"泰豐電子",unit:135,moq:300,lead:10,pay:"月結45",valid:"08/24",sel:false},
    {v:"晶盛塑膠",unit:141,moq:800,lead:18,pay:"月結30",valid:"08/26",sel:false},
    {v:"聯茂表面",unit:132,moq:600,lead:16,pay:"月結60",valid:"08/23",sel:false}
  ];
  var best=Math.min.apply(null,q.map(function(x){return x.unit;}));
  var rows=q.map(function(x){

    series:[{type:"scatter",symbolSize:function(d){return Math.sqrt(d[2])*1.6;},
      itemStyle:{color:function(p){var s=p.data[0]+p.data[1];return s>150?"#b91c1c":s>110?"#eab308":"#15803d";},opacity:.82},
      data:[[86,90,1400,"PCBA 主板"],[78,82,900,"陽極處理"],[55,62,700,"精密齒輪"],[30,40,500,"外殼射出"],[22,30,300,"棧板紙箱"],[48,70,820,"電源模組"]]}]});
}

/* ---------- helpers ---------- */
function kpi(ic,lab,val,delta,unit,dir){
  var d="";
  if(delta){
    var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
    d="<span class='delta "+dir+"'><span class='material-symbols-outlined'>"+arrow+"</span>"+delta+"</span>";
  }
  return "<div class='card kpi'><div class='lab'><span class='material-symbols-outlined'>"+ic+"</span>"+lab+"</div>"+
    "<div class='val'>"+val+(unit?"<small>"+unit+"</small>":"")+"</div>"+d+"</div>";
}
function mrow(name,val,pct){
  return "<div class='mrow'><span class='mn'>"+name+"</span><div class='bar' style='width:80px'><i style='width:"+pct+"%'></i></div><span class='mv'>"+val+"</span></div>";
}
function tli(cls,title,desc,tm){
  return "<div class='tli "+cls+"'><div class='th'>"+title+"</div><div class='td'>"+desc+"</div><div class='tm'>"+tm+"</div></div>";
}
function sc(l,v){return "<div class='sc'><div class='scl'>"+l+"</div><div class='scv'>"+v+"</div></div>";}
function poCol(title,n,items){
  var t=items.map(function(it){
    var late=it[3]==="逾期";
    return "<div class='tk'><div class='tt'>"+it[0]+"</div><div class='mm'><span>"+it[1]+" · "+it[2]+"</span><span class='amt' style='color:"+(late?"var(--bad)":"var(--accent)")+"'>"+(late?"逾期":it[3])+"</span></div></div>";
  }).join("");
  return "<div class='col'><div class='ch'>"+title+"<span class='n'>"+n+"</span></div>"+t+"</div>";
}
function ritem(lv,ic,title,desc,rv){
  return "<div class='ritem'><div class='ic "+lv+"'><span class='material-symbols-outlined' style='font-size:20px'>"+ic+"</span></div>"+
    "<div class='rt'><b>"+title+"</b><span>"+desc+"</span></div><div class='rv'>"+rv+"</div></div>";
}

/* ---------- nav + render ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
(function buildNav(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<SCREENS.length;i++){
    h+="<button data-i='"+i+"'><span class='material-symbols-outlined'>"+SCREENS[i].icon+"</span><span class='txt'>"+SCREENS[i].name+"</span><span class='idx'>0"+(i+1)+"</span></button>";
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("button");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var idx=+this.getAttribute("data-i");show(idx);location.hash="v"+idx;});
  }
})();

function show(i){
  disposeAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=SCREENS[i].full;
  document.getElementById("scr-sub").textContent=SCREENS[i].sub;
  RENDER[i]();
  var view=document.getElementById("view");
  void view.offsetHeight;
}
window.addEventListener("resize",function(){for(var k in CHARTS){if(CHARTS[k]){try{CHARTS[k].resize();}catch(e){}}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
