<html lang="zh-Hant">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFFFFF;--color-secondary:#3B82F6;--color-on-secondary:#000000;
--color-accent:#EA580C;--color-on-accent:#000000;--color-background:#F8FAFC;--color-foreground:#1E293B;
--color-card:#FFFFFF;--color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;--ok:#15803D;--warn:#9A3412;--bad:#DC2626;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.shell{min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.topbar{position:sticky;top:0;z-index:20;border-bottom:3px solid var(--ink);background:var(--color-card)}
.tb-in{max-width:1440px;margin:auto;display:flex;align-items:stretch;min-height:74px}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px;border-right:3px solid var(--ink);min-width:294px}
.logo{width:45px;height:45px;display:grid;place-items:center;background:var(--blue);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:#fff;font:700 13px "Fira Code"}
.brand b{display:block;font-size:16px;font-weight:700}.brand small{display:block;color:var(--muted);font:500 10px "Fira Code";letter-spacing:.08em}
.nav{display:flex;align-items:stretch;overflow-x:auto;flex:1}
.nav button{min-width:108px;border:0;border-right:1px solid var(--line);background:#fff;color:var(--muted);padding:10px 13px;font:600 13px "Fira Sans";display:grid;place-items:center;gap:4px}
.nav button:hover{background:var(--color-muted);color:var(--ink);transition:background .18s,color .18s}
.nav button.on{background:var(--ink);color:#fff;box-shadow:inset 0 -6px 0 var(--color-accent)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.live{align-self:center;margin:10px 18px;padding:7px 10px;border:2px solid var(--ink);font:700 11px "Fira Code";white-space:nowrap;background:#fff}
.live:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;background:var(--ok);border:1px solid var(--ink)}
.main{max-width:1440px;margin:auto;padding:30px 24px 52px}
.vh{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;margin-bottom:22px}
.vh h1{max-width:850px;margin:0;font-size:clamp(28px,4vw,52px);line-height:1.02;letter-spacing:-.04em;font-weight:700}
.vh p{max-width:760px;margin:12px 0 0;color:var(--muted);font-size:14px}
.eyebrow{display:inline-block;margin-bottom:10px;background:var(--blue);color:#fff;border:2px solid var(--ink);padding:4px 9px;font:700 11px "Fira Code";letter-spacing:.08em}
.pill{background:var(--color-accent);color:#111827;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:9px 13px;font:700 12px "Fira Code";white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi,.card{background:var(--color-card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.kpi{padding:15px;min-height:132px;position:relative}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase}
.kpi .v{margin-top:9px;font:700 25px "Fira Code";letter-spacing:-.04em}
.kpi .unit{font-size:11px;color:var(--muted);letter-spacing:0}
.kpi .d{margin-top:7px;font:600 11px "Fira Code"}
.kpi .idx{position:absolute;right:11px;top:8px;color:var(--line);font:700 30px "Fira Code"}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1.45fr .85fr}.g11{grid-template-columns:1fr 1fr}.g21{grid-template-columns:.85fr 1.45fr}
.card{padding:17px;min-width:0}.card+.card{}
.card h2{margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--ink);font-size:15px;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:12px;height:12px;background:var(--blue);border:2px solid var(--ink)}
.card h2 small{margin-left:auto;color:var(--muted);font:500 10px "Fira Code"}
.chart{width:100%;min-height:240px}
.acards,.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:11px}
.acard,.hg,.rc,.stl{border:2px solid var(--ink);background:#fff;padding:13px}
.acard:nth-child(3n+2),.hg:nth-child(even){background:var(--color-muted)}
.ah{display:flex;justify-content:space-between;gap:10px}.ah b,.hg b{font-size:13px}.mono,.ah small{font-family:"Fira Code";font-size:10px;color:var(--muted)}
.score{min-width:47px;height:47px;display:grid;place-items:center;border:2px solid var(--ink);font:700 15px "Fira Code";background:#fff}
.rows{margin-top:10px;display:grid;gap:5px;font-size:11px}.rows div{display:flex;justify-content:space-between;gap:10px}.rows b{font-family:"Fira Code";text-align:right}
.hg{text-align:center}.hg .n{font:700 25px "Fira Code";margin:8px}.sub,.note{color:var(--muted);font-size:11px}
.bar,.hbar{height:10px;border:1px solid var(--ink);background:#fff;overflow:hidden}.bar{display:inline-block;width:85px;vertical-align:middle}.bar i,.hbar i{display:block;height:100%;background:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border:1px solid var(--ink);text-align:left;white-space:nowrap}
th{background:var(--ink);color:#fff;font-size:11px}
td:nth-child(n+2){font-family:"Fira Code"}td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:var(--color-muted)}
.tag{display:inline-flex;gap:5px;align-items:center;border:2px solid currentColor;padding:2px 7px;font:700 10px "Fira Code";background:#fff}
.tag:before{content:"";width:7px;height:7px;background:currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.run{color:var(--blue)}
.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;min-width:500px}
.mcell{min-height:62px;border:2px solid var(--ink);padding:7px;display:flex;flex-direction:column;justify-content:space-between;color:#111827}
.mcell b{font:700 18px "Fira Code"}.mcell.hi{background:#FCA5A5}.mcell.md{background:#FDBA74}.mcell.lo{background:#86EFAC}
.labels{display:grid;grid-template-columns:repeat(5,1fr);min-width:500px;text-align:center;font:600 10px "Fira Code";margin-top:5px}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px}.leg span{border:1px solid var(--ink);padding:3px 6px}
.rcm,.stlist,.timeline{display:grid;gap:10px}.rc{border-left:9px solid var(--blue)}.rc.hi{border-left-color:var(--bad)}.rc.md{border-left-color:var(--color-accent)}
.rh,.stl{display:flex;align-items:center;justify-content:space-between;gap:10px}.mt{margin-top:7px;color:var(--muted);font-size:11px}.mt b{color:var(--ink);font-family:"Fira Code"}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:650px}.dh{text-align:center;background:var(--ink);color:#fff;padding:5px;font-size:11px}.cd{min-height:77px;border:1px solid var(--ink);padding:5px;background:#fff}.cd.mut{background:var(--color-muted)}.cd .dn{font:600 10px "Fira Code"}.ev{margin-top:4px;border:1px solid var(--ink);padding:2px 4px;font-size:9px;font-weight:700}.pd{background:#BFDBFE}.pv{background:#BBF7D0}.cr{background:#FECACA}.ins{background:#FED7AA}
.stl{justify-content:flex-start}.stl .rt{margin-left:auto;font:700 13px "Fira Code";color:var(--blue)}
.tli{border:2px solid var(--ink);padding:12px;background:#fff}.tli:nth-child(even){margin-left:22px;background:var(--color-muted)}.tli b{font-size:13px}.tli small{display:block;color:var(--muted);margin-top:5px}.amt{color:var(--blue);font-family:"Fira Code";font-weight:700}
.foot{border-top:3px solid var(--ink);background:var(--ink);color:#fff;padding:18px 24px;font:500 10px "Fira Code"}
@media(max-width:1050px){.tb-in{flex-wrap:wrap}.brand{border-bottom:2px solid var(--ink)}.nav{order:3;width:100%;border-top:2px solid var(--ink)}.kpis{grid-template-columns:1fr 1fr}.g2,.g11,.g21{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:22px 14px 42px}.brand{min-width:0;flex:1}.brand small,.live{display:none}.nav button{min-width:74px;font-size:11px}.vh{grid-template-columns:1fr}.vh h1{font-size:31px}.kpis{grid-template-columns:1fr}.kpi:nth-child(even){transform:none}.card,.kpi{box-shadow:4px 4px 0 var(--ink)}}
@media(prefers-reduced-motion:no-preference){.grid-item{animation:enter .4s backwards;animation-delay:calc(var(--i,0)*60ms)}@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
