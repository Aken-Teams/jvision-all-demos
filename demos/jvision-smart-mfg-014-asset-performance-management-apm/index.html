<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>資產績效管理系統 · APM</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--ink:#0f1b33;--accent:#1d4ed8;--accent2:#60a5fa;--bg:#eef2fb;--card:#fff;--line:#dce3f2;--mut:#5c6a86;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#0b1f45,#12306e);color:#dbe6ff;box-shadow:0 2px 14px rgba(13,37,90,.25)}
.tb-in{max-width:1360px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
.brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 0 18px rgba(96,165,250,.6);font-size:13px}
.brand b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff;line-height:1.15}
.brand span{font-size:10px;color:#9dc0ff;letter-spacing:1.5px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#c3d4f5;font:inherit;font-weight:600;font-size:13px;padding:9px 13px;border-radius:9px;cursor:pointer;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;box-shadow:0 3px 12px rgba(29,78,216,.45)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.live{background:rgba(96,165,250,.18);color:#bfd6ff;padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#60a5fa;display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes grow{from{width:0}}
.main{max-width:1360px;margin:0 auto;padding:22px 20px 40px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px;max-width:680px}
.pill{background:#dbe7ff;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 19px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent2);opacity:.55}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}
.g21{grid-template-columns:.9fr 1.4fr}
.g11{grid-template-columns:1fr 1fr}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.g2,.g21,.g11{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}.nav button span.tx{display:none}.brand span{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:700}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 small{margin-left:auto;color:var(--mut);font-size:11px;font-weight:600}
.chart{width:100%}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-run{background:#dbeafe;color:#1d4ed8}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f4f7fd}
table.data tr:last-child td{border-bottom:0}
.bar{height:7px;background:#eef2f8;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;width:80px}
.bar i{display:block;height:100%;border-radius:6px;animation:grow .9s ease}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.acard{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fbfcff,#fff)}
.acard .ah{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:9px}
.acard .ah b{font-family:"Noto Sans TC";font-size:14px;display:block}
.acard .ah small{color:var(--mut);font-size:11px}
.acard .rows{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mut)}
.acard .rows div{display:flex;justify-content:space-between;gap:8px}
.acard .rows b{color:var(--ink);font-weight:700}
.ring{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;font-family:Inter}
.ring span{background:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.hg{border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}
.hg b{font-family:"Noto Sans TC";font-size:13px;display:block;margin-bottom:8px}
.hg .n{font-size:24px;font-weight:800;font-family:Inter;line-height:1}
.hg .n small{font-size:11px;color:var(--mut)}
.hbar{height:8px;background:#eef2f8;border-radius:6px;overflow:hidden;margin:9px 0 6px}
.hbar i{display:block;height:100%;border-radius:6px;animation:grow .9s ease}
.hg .sub{font-size:11px;color:var(--mut)}
.matrix{display:grid;grid-template-columns:44px repeat(5,1fr);gap:6px;min-width:520px}
.matrix .yl{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:11px;color:var(--mut);font-weight:700;grid-row:span 5;display:grid;place-items:center}
.mcell{border-radius:9px;min-height:58px;padding:7px;font-size:11px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.mcell .cn{font-weight:800;font-size:17px;font-family:Inter}
.mcell .cl{opacity:.9;font-size:10px}
.xl{display:grid;grid-template-columns:44px repeat(5,1fr);gap:6px;margin-top:6px;font-size:10.5px;color:var(--mut);text-align:center;font-weight:700;min-width:520px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--mut)}
.leg span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.rcm{display:flex;flex-direction:column;gap:10px}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 13px;border-left:4px solid var(--accent)}
.rc.hi{border-left-color:var(--bad)}.rc.md{border-left-color:var(--warn)}
.rc .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rc .rh b{font-family:"Noto Sans TC";font-size:13.5px}
.rc .mt{margin-top:8px;font-size:11px;color:var(--mut);line-height:1.7}
.rc .mt b{color:var(--ink);font-family:Inter}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;min-width:640px}
.cal .dh{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .cd{border:1px solid var(--line);border-radius:9px;min-height:78px;padding:6px;font-size:11px;background:#fbfcff}
.cal .cd.mut{background:#f4f6fb;opacity:.55}
.cal .cd .dn{font-weight:700;color:var(--mut);font-size:11px}
.cal .cd .ev{margin-top:3px;border-radius:5px;padding:2px 5px;font-size:9.5px;font-weight:700;line-height:1.35}
.ev.pd{background:#dbeafe;color:#1d4ed8}.ev.pv{background:#dcfce7;color:#15803d}.ev.cr{background:#fee2e2;color:#b91c1c}.ev.in{background:#fef3c7;color:#b45309}
.stlist{display:flex;flex-direction:column;gap:9px}
.stl{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.stl .material-symbols-outlined{flex:none;color:var(--accent)}
.stl b{font-size:12.5px;font-family:"Noto Sans TC"}
.stl small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.stl .rt{margin-left:auto;text-align:right;flex:none;font-size:12px;color:var(--accent);font-weight:800;font-family:Inter}
.tl{position:relative;padding-left:8px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:10px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 20px}
.tli::before{content:"";position:absolute;left:-1px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tli b{font-size:13px;font-family:"Noto Sans TC"}
.tli small{color:var(--mut);font-size:11px;display:block;margin-top:3px;line-height:1.6}
.tli .amt{font-family:Inter;font-weight:800;color:var(--accent)}
.note{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.6}
.foot{max-width:1360px;margin:0 auto;padding:8px 20px 24px;color:var(--mut);font-size:11px}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-in">
    <div class="brand"><div class="lg">APM</div><div><b>資產績效管理系統</b><span>ASSET PERFORMANCE MGMT</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="tb-r"><div class="live"><i></i>即時同步</div></div>
  </div>
</div>
<div class="main"><div id="app"></div></div>
<div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-014-asset-performance-management-apm/</div>

<script>
var MODS=[
  {icon:"inventory_2",name:"資產登錄"},
  {icon:"monitor_heart",name:"健康度評分"},
  {icon:"grid_on",name:"風險矩陣"},
  {icon:"science",name:"可靠度分析"},
  {icon:"handyman",name:"維護策略"},
  {icon:"savings",name:"生命週期成本"}
];
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function hcolor(v){return v>=85?"#16a34a":v>=70?"#f59e0b":"#ef4444";}
function kpiHTML(kp){return '<div class="kpis">'+kp.map(function(k){return '<div class="kpi"><span class="material-symbols-outlined ic">'+k.ic+'</span><div class="l">'+k.l+'</div><div class="v">'+k.v+' <span style="font-size:12px;color:var(--mut)">'+k.d+'</span></div><div class="d '+k.cls+'">'+k.du+'</div></div>';}).join('')+'</div>';}

/* ---------- screen 0: 資產登錄 ---------- */
function v0(c){
  var assets=[
    {id:"AST-CNC-018",name:"五軸CNC加工中心",area:"精密加工課",vendor:"Mazak",year:2019,val:1280,life:12,used:6,health:88,rc:"#16a34a",crit:"高"},
    {id:"AST-INJ-042",name:"射出成型機 350T",area:"成型二課",vendor:"FANUC",year:2016,val:860,life:15,used:9,health:64,rc:"#f59e0b",crit:"高"},
    {id:"AST-CMP-007",name:"空壓主機 250HP",area:"廠務動力",vendor:"Atlas Copco",year:2014,val:540,life:20,used:11,health:72,rc:"#f59e0b",crit:"中"},
    {id:"AST-RBT-023",name:"六軸搬運機械臂",area:"組裝一線",vendor:"KUKA",year:2021,val:410,life:10,used:4,health:91,rc:"#16a34a",crit:"中"},
    {id:"AST-CHL-011",name:"冰水主機 400RT",area:"廠務動力",vendor:"Trane",year:2013,val:720,life:18,used:12,health:58,rc:"#ef4444",crit:"高"},
    {id:"AST-SMT-030",name:"SMT 貼片產線",area:"電子製造課",vendor:"Panasonic",year:2020,val:1960,life:10,used:5,health:83,rc:"#16a34a",crit:"高"}
  ];
  var kp=[
    {l:"在管資產總數",v:"1,284",d:"台/件",ic:"dns",cls:"up",du:"本月 +36"},
    {l:"資產總帳面值",v:"6.57 億",d:"NTD",ic:"payments",cls:"up",du:"折舊後淨值"},
    {l:"主檔完整率",v:"96.4%",d:"欄位齊備",ic:"fact_check",cls:"up",du:"+2.1%"},
    {l:"待建檔資產",v:"18",d:"件",ic:"pending_actions",cls:"dn",du:"新進設備"}
  ];
  var h='<div class="vh"><div><h2>資產登錄 · 設備台帳主檔</h2><p>集中管理設備規格、購置成本、運轉時數與維修履歷，建立可追蹤稽核的資產基礎資料。</p></div><div class="pill">資產主檔 v3.2</div></div>';
  h+=kpiHTML(kp);
  h+='<div class="grid g2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>重點資產卡片<small>共 '+assets.length+' 項</small></h3><div class="acards">';
  h+=assets.map(function(a){
    var pct=Math.round((a.used/a.life)*100);
    return '<div class="acard"><div class="ah"><div><b>'+esc(a.name)+'</b><small>'+a.id+' · '+esc(a.area)+'</small></div>'+
      '<div class="ring" style="background:conic-gradient('+a.rc+' '+(a.health*3.6)+'deg,#eef2f8 0)"><span style="color:'+a.rc+'">'+a.health+'</span></div></div>'+
      '<div class="rows"><div><span>供應商</span><b>'+esc(a.vendor)+'</b></div><div><span>購置年份</span><b>'+a.year+'</b></div>'+
      '<div><span>帳面值</span><b>'+a.val+' 萬</b></div><div><span>關鍵度</span><b>'+a.crit+'</b></div>'+
      '<div><span>壽命耗用</span><b>'+pct+'%（'+a.used+'/'+a.life+'年）</b></div></div></div>';
  }).join('');
  h+='</div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>資產分類佔比</h3><div id="c0a" class="chart"></div>'+
     '<div class="note">依設備類別統計台帳數量，電子製造與加工類占主要投資比重。</div></div>';
  h+='</div>';
  c.innerHTML=h;
  void c.offsetHeight;
  var ch=new ApexCharts(document.querySelector("#c0a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[286,214,168,142,312,162],labels:["加工設備","成型設備","廠務動力","自動化搬運","電子製造","檢測量測"],
    colors:["#1d4ed8","#60a5fa","#93c5fd","#f59e0b","#16a34a","#a78bfa"],
    legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    plotOptions:{pie:{donut:{size:"62%"}}},stroke:{width:2}
  });
  ch.render();charts.push(ch);
}

/* ---------- screen 1: 健康度評分 ---------- */
function v1(c){
  var kp=[
    {l:"平均健康指數",v:"78.4",d:"分",ic:"favorite",cls:"up",du:"+3.2 vs 上月"},
    {l:"健康資產占比",v:"64%",d:"≥85分",ic:"health_and_safety",cls:"up",du:"+5%"},
    {l:"劣化告警數",v:"7",d:"件待處理",ic:"warning",cls:"dn",du:"本週 +2"},
    {l:"感測覆蓋率",v:"91%",d:"設備聯網",ic:"sensors",cls:"up",du:"+4%"}
  ];
  var gs=[
    {n:"CNC-018 主軸",v:88,s:"振動 2.1mm/s"},
    {n:"INJ-042 液壓",v:64,s:"油溫偏高 58°C"},
    {n:"CMP-007 軸承",v:72,s:"溫升 12°C"},
    {n:"RBT-023 減速機",v:91,s:"扭矩正常"},
    {n:"CHL-011 壓縮機",v:58,s:"效率下降"},
    {n:"SMT-030 貼片頭",v:83,s:"精度 ±0.02"}
  ];
  var h='<div class="vh"><div><h2>健康度評分 · 設備狀態監測</h2><p>整合振動、溫度、電流與運轉參數，計算各資產健康指數並偵測劣化趨勢。</p></div><div class="pill">監測中 68 台</div></div>';
  h+=kpiHTML(kp);
  h+='<div class="grid g2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>健康指數趨勢（近12週）</h3><div id="c1a" class="chart"></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">speed</span>各類設備健康分布</h3><div id="c1b" class="chart"></div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">monitor_heart</span>關鍵子元件健康度</h3><div class="hgrid">';
  h+=gs.map(function(g){var col=hcolor(g.v);return '<div class="hg"><b>'+esc(g.n)+'</b><div class="n" style="color:'+col+'">'+g.v+'<small>/100</small></div><div class="hbar"><i style="width:'+g.v+'%;background:'+col+'"></i></div><div class="sub">'+esc(g.s)+'</div></div>';}).join('');
  h+='</div></div>';
  c.innerHTML=h;
  void c.offsetHeight;
  var c1=new ApexCharts(document.querySelector("#c1a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:300,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false,toolbar:{show:false}},
    series:[{name:"CNC-018",data:[92,91,90,89,90,88,88,87,88,88,87,88]},{name:"INJ-042",data:[78,76,74,73,71,70,68,67,66,65,64,64]},{name:"CHL-011",data:[74,72,70,68,66,64,63,61,60,59,58,58]}],
    colors:["#16a34a","#f59e0b","#ef4444"],stroke:{width:3,curve:"smooth"},
    xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8","W9","W10","W11","W12"],labels:{style:{fontSize:"11px"}}},
    yaxis:{min:40,max:100,labels:{style:{fontSize:"11px"}}},grid:{borderColor:"#eef2f8"},
    legend:{position:"top",fontSize:"12px"},dataLabels:{enabled:false},markers:{size:0}
  });
  c1.render();charts.push(c1);
  var c2=new ApexCharts(document.querySelector("#c1b"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radialBar",height:300,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[88,72,64,91],labels:["加工類","動力類","成型類","自動化"],
    colors:["#1d4ed8","#60a5fa","#f59e0b","#16a34a"],
    plotOptions:{radialBar:{dataLabels:{name:{fontSize:"12px"},value:{fontSize:"14px"},total:{show:true,label:"平均",formatter:function(){return "78.8";}}}}},
    stroke:{width:2}
  });
