<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>訂單變更管理 Order Change Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;
  --bg:#f8fafc;
  --card:#ffffff;
  --soft:#f1f5fd;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --radius:8px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 5px 14px rgba(37,99,235,.04);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  overflow-x:hidden;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[data-i]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.28);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:1px solid var(--color-border);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
}
.topbar-inner{
  width:min(100%,1440px);
  min-width:0;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content;}
.brand .logo{
  width:36px;
  height:36px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:0 3px 0 #1d4ed8;
}
.brand .logo .material-symbols-outlined{font-size:21px;}
.brand-txt{min-width:0;}
.brand-txt b{
  display:block;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand-txt span{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap;}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:3px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  flex:0 0 auto;
  padding:7px 10px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}
.nav button .material-symbols-outlined{font-size:17px;}
.nav button:hover{border-color:var(--line);background:var(--soft);color:var(--blue);}
.nav button.on{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:var(--color-on-primary);
}
main{width:min(100%,1440px);min-width:0;margin:0 auto;padding:20px 24px 52px;}
#app{animation:screen-in .22s ease-out both;}
@keyframes screen-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.screen-head{
  min-width:0;
  margin-bottom:16px;
  padding-bottom:14px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid var(--line);
}
.screen-head .t{min-width:0;}
.screen-head h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--ink);
  font-size:21px;
  font-weight:700;
  letter-spacing:-.025em;
}
.screen-head h1 .material-symbols-outlined{color:var(--blue);font-size:24px;}
.screen-head p{max-width:760px;margin:4px 0 0;color:var(--muted);font-size:12.5px;}
.pill{
  min-height:30px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  padding:5px 10px;
  border:1px solid #bbf7d0;
  border-radius:5px;
  background:#f0fdf4;
  color:#166534;
  font-size:11px;
  font-weight:600;
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 3px #dcfce7;}
.grid{display:grid;gap:12px;min-width:0;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g-1-2{grid-template-columns:minmax(300px,1fr) minmax(0,2fr);}
.card,.kpi{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow);
}
.card{padding:15px;}
.card.pad0{padding:0;overflow:hidden;}
.card h3{
  margin:0 0 12px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
  font-size:13px;
  font-weight:700;
  letter-spacing:.005em;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:18px;}
.card .sub{color:var(--muted);font-size:11px;font-weight:400;}
.kpi{
  position:relative;
  overflow:hidden;
  padding:13px 14px 12px;
  border-top:3px solid var(--blue);
}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600;}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:16px;}
.kpi .val{
  margin-top:5px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.05em;
  line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:5px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:11px;font-weight:500;letter-spacing:0;}
.kpi .delta{margin-top:4px;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;}
.kpi .delta.up{color:#047857;}
.kpi .delta.down{color:#b91c1c;}
.kpi .delta .material-symbols-outlined{font-size:14px;}
.tbl-wrap{max-width:100%;overflow:auto;scrollbar-width:thin;}
table{width:100%;min-width:540px;border-collapse:collapse;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--soft);
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.055em;
  text-transform:uppercase;
}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#f8fbff;}
tbody tr:last-child td{border-bottom:0;}
td.mono{
  color:#1e3a5f;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}
.tag{
  min-height:23px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10px;
  font-weight:600;
  line-height:1;
  white-space:nowrap;
}
.tag .material-symbols-outlined{font-size:13px;}
.t-red{background:#fef2f2;color:#b91c1c;}
.t-org{background:#fff7ed;color:#9a3412;}
.t-grn{background:#f0fdf4;color:#166534;}
.t-blu{background:#eff6ff;color:#1d4ed8;}
.t-gry{background:#f8fafc;color:#475569;}
.t-prp{background:#faf5ff;color:#6b21a8;}
.board{min-width:960px;display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:9px;}
.col{min-width:0;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--soft);}
.col-head{margin-bottom:9px;padding:1px 2px 7px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.col-head .nm{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:11px;font-weight:700;}
.col-head .nm .material-symbols-outlined{font-size:15px;}
.col-head .cnt{min-width:22px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;text-align:center;}
.ktile{
  min-width:0;
  margin-bottom:7px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.ktile:last-child{margin-bottom:0;}
.ktile:hover{transform:translateY(-1px);border-color:#93c5fd;box-shadow:0 4px 10px rgba(15,23,42,.07);}
.ktile .id{color:var(--blue);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;}
.ktile .cust{margin:3px 0 6px;overflow:hidden;color:var(--ink);font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap;}
.ktile .meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.ktile .prog{height:4px;margin-top:8px;overflow:hidden;border-radius:0;background:#dbe5f4;}
.ktile .prog i{display:block;height:100%;background:var(--blue);}
.ktile .foot{margin-top:7px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;}
.avatar{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--blue);color:#fff;font-family:"Fira Sans",sans-serif;font-size:10px;font-weight:700;}
.chart-box{width:100%;min-width:0;overflow:hidden;}
.timeline{position:relative;padding-left:25px;}
.timeline::before{content:"";position:absolute;top:5px;bottom:5px;left:9px;width:1px;background:#cbd5e1;}
.tl-item{position:relative;padding:0 0 17px 5px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;top:1px;left:-21px;width:19px;height:19px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:50%;color:#fff;box-shadow:0 0 0 1px var(--line);}
.tl-dot .material-symbols-outlined{font-size:12px;}
.tl-item .th{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--ink);font-size:12px;font-weight:700;}
.tl-item .td{margin-top:2px;color:var(--muted);font-size:11px;}
.sign-row{
  min-width:0;
  margin-bottom:8px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fbfdff;
}
.sign-row .dep{min-width:0;flex:1;display:flex;align-items:center;gap:8px;}
.sign-row .dep .ic{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:5px;color:#fff;}
.sign-row .dep .ic .material-symbols-outlined{font-size:17px;}
.sign-row .dep .nm{min-width:0;}
.sign-row .dep .nm b{display:block;color:var(--ink);font-size:12px;}
.sign-row .dep .nm span{display:block;color:var(--muted);font-size:10px;}
.diff{overflow:hidden;border:1px solid var(--line);border-radius:6px;}
.diff-row{min-width:0;padding:10px 12px;display:grid;grid-template-columns:1.15fr 1fr auto 1fr;align-items:center;gap:9px;border-bottom:1px solid var(--line);font-size:12px;}
.diff-row:last-child{border-bottom:0;}
.diff-row .fld{color:var(--muted);font-size:11px;font-weight:700;}
.diff-row .old,.diff-row .new{font-family:"Fira Code",monospace;font-size:11px;font-variant-numeric:tabular-nums;}
.diff-row .old{color:#64748b;text-decoration:line-through;}
.diff-row .arw{display:flex;align-items:center;color:var(--blue);}
.diff-row .arw .material-symbols-outlined{font-size:17px;}
.diff-row .new{color:var(--ink);font-weight:600;}
.form-grid{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.field label{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;}
.field .box{min-width:0;min-height:39px;padding:8px 10px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:5px;background:#fbfdff;color:var(--ink);font-size:12px;font-weight:500;}
.field .box .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:16px;}
.checklist-item{min-width:0;margin-bottom:7px;padding:9px 10px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;background:#fff;}
.checklist-item .ck{width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#fff;}
.checklist-item .ck .material-symbols-outlined{font-size:14px;}
.checklist-item .lab{min-width:0;flex:1;}
.checklist-item .lab b{display:block;color:var(--ink);font-size:12px;}
.checklist-item .lab span{display:block;color:var(--muted);font-size:10px;}
.legend{margin-top:9px;display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:10.5px;}
.legend i{width:9px;height:9px;margin-right:5px;display:inline-block;border:1px solid rgba(15,23,42,.18);border-radius:2px;vertical-align:middle;}
.note{min-width:0;padding:10px 11px;display:flex;align-items:flex-start;gap:8px;border:1px solid #bfdbfe;border-left:3px solid var(--blue);border-radius:5px;background:#eff6ff;color:#1e3a5f;font-size:11.5px;}
.note .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:18px;}
.stat-inline{display:flex;flex-wrap:wrap;gap:18px;}
.stat-inline .s b{display:block;color:var(--ink);font-family:"Fira Code",monospace;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-inline .s span{color:var(--muted);font-size:10px;}
.mini-list{margin:0;padding:0;list-style:none;}
.mini-list li{min-width:0;padding:8px 2px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);font-size:12px;}
.mini-list li:last-child{border-bottom:0;}
.mini-list li b{font-family:"Fira Code",monospace;font-size:11px;font-variant-numeric:tabular-nums;}
.bar-lite{width:86px;height:6px;flex:0 0 86px;overflow:hidden;border-radius:0;background:#e2e8f0;}
.bar-lite i{display:block;height:100%;}
@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .nav{width:100%;margin-left:0;padding-bottom:2px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g-2-1,.g-1-2{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);}
}
@media(max-width:820px){
  .topbar-inner,main{padding-left:16px;padding-right:16px;}
  .g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr;}
  .screen-head{align-items:flex-start;}
  .sign-row{align-items:flex-start;flex-wrap:wrap;}
  .sign-row .dep{min-width:180px;}
}
@media(max-width:560px){
  .topbar-inner{padding-top:8px;padding-bottom:8px;}
  .brand .logo{width:34px;height:34px;}
  .nav button{min-width:38px;padding:7px 9px;}
  .nav button .lbl{display:none;}
  main{padding:16px 12px 40px;}
  .screen-head{margin-bottom:12px;display:block;}
  .screen-head h1{font-size:19px;}
  .screen-head p{font-size:11.5px;}
  .screen-head .pill{margin-top:10px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .card{padding:12px;}
  .kpi{padding:11px 10px 10px;}
  .kpi .val{font-size:20px;}
  .kpi .lab{align-items:flex-start;font-size:10px;}
  .form-grid{grid-template-columns:1fr;}
  .field[style*="grid-column"]{grid-column:auto!important;}
  .diff{overflow-x:auto;}
  .diff-row{min-width:500px;}
  .sign-row>div[style*="flex:1.4"]{flex-basis:100%!important;}
  .bar-lite{width:64px;flex-basis:64px;}
}
@media(max-width:375px){
  .g4{grid-template-columns:1fr;}
  .brand-txt span{display:none;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
  #app{animation:none;}
  .ktile:hover{transform:none;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">published_with_changes</span></div>
      <div class="brand-txt">
        <b>訂單變更管理</b>
        <span>Order Change Management · 智慧製造</span>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
</div>
<main>
  <div id="app"></div>
</main>
<script>
(function(){
"use strict";
var MODULES=[
  {icon:"receipt_long",name:"變更申請單"},
  {icon:"account_tree",name:"變更看板"},
  {icon:"fact_check",name:"影響評估"},
  {icon:"groups",name:"跨部門會簽"},
  {icon:"checklist",name:"訂單同步"},
  {icon:"insights",name:"時效與損失分析"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}

var STAGES=[
  {key:"apply",nm:"申請登錄",ic:"edit_note",col:"#94a3b8"},
  {key:"assess",nm:"影響評估",ic:"fact_check",col:"#f97316"},
  {key:"sign",nm:"跨部門會簽",ic:"groups",col:"#dc2626"},
  {key:"sync",nm:"訂單同步",ic:"sync",col:"#2563eb"},
  {key:"done",nm:"已結案",ic:"task_alt",col:"#16a34a"}
];
var CHANGES=[
  {id:"OCR-2408-071",cust:"O達精密",type:"數量增加",tag:"t-blu",prio:"高",po:"PO-55231",qty:"+2,000 pcs",amt:186,stage:"sign",prog:70,due:"08/16",owner:"林",risk:"產能吃緊"},
  {id:"OCR-2408-069",cust:"O睿電子",type:"交期提前",tag:"t-red",prio:"急",po:"PO-55198",qty:"提前 6 天",amt:242,stage:"assess",prog:35,due:"08/15",owner:"陳",risk:"物料到料不及"},

        '<div class="s"><b>-46%</b><span>損失金額降幅</span></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function rankRow(nm,v,col,w){
  return '<li><span>'+nm+'</span><span style="display:flex;align-items:center;gap:8px"><span class="bar-lite"><i style="width:'+w+'%;background:'+col+'"></i></span><b>'+v+'</b></span></li>';
}

/* ===== shared render helpers ===== */
function head(i,desc,pillTxt){
  var m=MODULES[i];
  return '<div class="screen-head"><div class="t"><h1><span class="material-symbols-outlined">'+m.icon+'</span>'+m.name+'</h1><p>'+desc+'</p></div>'+
    '<span class="pill"><span class="dot"></span>'+pillTxt+'</span></div>';
}
function kpi(ic,lab,val,unit,dir,delta){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+'<small>'+unit+'</small></div>'+
    '<div class="delta '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":"priority_high")+'</span>'+delta+'</div></div>';
}
function field(lab,ic,val,full){
  return '<div class="field" style="'+(full?"grid-column:1/-1":"")+'"><label>'+lab+'</label><div class="box"><span class="material-symbols-outlined">'+ic+'</span>'+esc(val)+'</div></div>';
}

/* ===== controller ===== */
var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  void app.offsetHeight;
  initCharts(i);
  try{window.scrollTo(0,0);}catch(e){}
}
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var n=+this.getAttribute("data-i");location.hash="v"+n;});
  }
})();
window.show=show;
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
