<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>訂單變更管理 Order Change Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#dc2626;--accent2:#f97316;--ink:#1f2430;--muted:#6b7280;
  --line:#e8e6e2;--bg:#f6f5f2;--card:#ffffff;--soft:#faf9f7;
  --ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(220,38,38,.28);}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand-txt{min-width:0;}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap;}
.brand-txt span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;}
.nav{display:flex;gap:6px;flex-wrap:wrap;min-width:0;margin-left:auto;}
.nav button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 12px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.nav button .material-symbols-outlined{font-size:18px;}
.nav button:hover{border-color:var(--accent);color:var(--accent);}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(220,38,38,.25);}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0;}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0;}
.screen-head .t{min-width:0;}
.screen-head h1{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;}
.screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.grid{display:grid;gap:14px;min-width:0;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g-2-1{grid-template-columns:2fr 1fr;}
.g-1-2{grid-template-columns:1fr 2fr;}
@media(max-width:820px){.g2,.g3,.g4,.g-2-1,.g-1-2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.card .sub{font-size:12px;color:var(--muted);font-weight:500;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta.up{color:var(--ok);}
.kpi .delta.down{color:var(--bad);}
.kpi .delta .material-symbols-outlined{font-size:15px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--soft);}
tbody tr:hover{background:var(--soft);}
td.mono{font-family:"Inter",monospace;font-weight:600;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.tag .material-symbols-outlined{font-size:14px;}
.t-red{background:#fef2f2;color:#b91c1c;}
.t-org{background:#fff7ed;color:#c2410c;}
.t-grn{background:#f0fdf4;color:#15803d;}
.t-blu{background:#eff6ff;color:#1d4ed8;}
.t-gry{background:#f3f4f6;color:#4b5563;}
.t-prp{background:#faf5ff;color:#7e22ce;}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;min-width:0;}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.board{grid-template-columns:1fr;}}
.col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:2px 4px;}
.col-head .nm{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;}
.col-head .nm .material-symbols-outlined{font-size:16px;}
.col-head .cnt{font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);}
.ktile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;transition:box-shadow .15s,transform .15s;min-width:0;}
.ktile:hover{box-shadow:0 6px 16px rgba(0,0,0,.07);transform:translateY(-2px);}
.ktile .id{font-size:11px;font-weight:700;color:var(--accent);font-family:monospace;}
.ktile .cust{font-size:13px;font-weight:700;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ktile .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.ktile .prog{height:5px;border-radius:3px;background:#eee;margin-top:8px;overflow:hidden;}
.ktile .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.ktile .foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted);}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.chart-box{width:100%;overflow:hidden;min-width:0;}
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px 6px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-22px;top:2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
.tl-dot .material-symbols-outlined{font-size:13px;}
.tl-item .th{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tl-item .td{font-size:12px;color:var(--muted);margin-top:2px;}
.sign-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--soft);min-width:0;}
.sign-row .dep{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.sign-row .dep .ic{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;}
.sign-row .dep .nm{min-width:0;}
.sign-row .dep .nm b{font-size:13px;display:block;}
.sign-row .dep .nm span{font-size:11px;color:var(--muted);}
.diff{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.diff-row{display:grid;grid-template-columns:1.2fr 1fr auto 1fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;min-width:0;}
.diff-row:last-child{border-bottom:none;}
.diff-row .fld{font-weight:700;color:var(--muted);font-size:12px;}
.diff-row .old{color:var(--muted);text-decoration:line-through;}
.diff-row .arw{color:var(--accent);display:flex;align-items:center;}
.diff-row .new{font-weight:700;color:var(--ink);}
@media(max-width:560px){.diff-row{grid-template-columns:1fr 1fr auto 1fr;font-size:12px;}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
@media(max-width:820px){.form-grid{grid-template-columns:1fr;}}
.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.field .box{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.field .box .material-symbols-outlined{font-size:17px;color:var(--accent);flex:0 0 auto;}
.checklist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;font-size:13px;background:#fff;min-width:0;}
.checklist-item .ck{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;}
.checklist-item .ck .material-symbols-outlined{font-size:15px;}
.checklist-item .lab{flex:1;min-width:0;}
.checklist-item .lab b{display:block;font-size:13px;}
.checklist-item .lab span{font-size:11px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
.note{background:linear-gradient(135deg,#fff1f0,#fff7ed);border:1px solid #fecaca;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#9a3412;display:flex;gap:10px;align-items:flex-start;min-width:0;}
.note .material-symbols-outlined{color:var(--accent);font-size:20px;flex:0 0 auto;}
.stat-inline{display:flex;gap:16px;flex-wrap:wrap;}
.stat-inline .s b{font-size:20px;font-weight:800;display:block;}
.stat-inline .s span{font-size:11px;color:var(--muted);}
.mini-list{list-style:none;margin:0;padding:0;}
.mini-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px;min-width:0;}
.mini-list li:last-child{border-bottom:none;}
.bar-lite{height:7px;border-radius:4px;background:#eee;overflow:hidden;flex:0 0 90px;}
.bar-lite i{display:block;height:100%;}
@media(max-width:560px){.nav button .lbl{display:none;}.nav button{padding:8px;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">published_with_changes</span></div>
      <div class="brand-txt">
        <b>訂單變更管理</b>
        <span>Order Change Management · 智慧製造</span>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
</div>
<main>
  <div id="app"></div>
</main>
<script>
(function(){
"use strict";
var MODULES=[
  {icon:"receipt_long",name:"變更申請單"},
  {icon:"account_tree",name:"變更看板"},
  {icon:"fact_check",name:"影響評估"},
  {icon:"groups",name:"跨部門會簽"},
  {icon:"checklist",name:"訂單同步"},
  {icon:"insights",name:"時效與損失分析"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}

var STAGES=[
  {key:"apply",nm:"申請登錄",ic:"edit_note",col:"#94a3b8"},
  {key:"assess",nm:"影響評估",ic:"fact_check",col:"#f97316"},
  {key:"sign",nm:"跨部門會簽",ic:"groups",col:"#dc2626"},
  {key:"sync",nm:"訂單同步",ic:"sync",col:"#2563eb"},
  {key:"done",nm:"已結案",ic:"task_alt",col:"#16a34a"}
];
var CHANGES=[
  {id:"OCR-2408-071",cust:"O達精密",type:"數量增加",tag:"t-blu",prio:"高",po:"PO-55231",qty:"+2,000 pcs",amt:186,stage:"sign",prog:70,due:"08/16",owner:"林",risk:"產能吃緊"},
  {id:"OCR-2408-069",cust:"O睿電子",type:"交期提前",tag:"t-red",prio:"急",po:"PO-55198",qty:"提前 6 天",amt:242,stage:"assess",prog:35,due:"08/15",owner:"陳",risk:"物料到料不及"},
  {id:"OCR-2408-066",cust:"O晶科技",type:"規格變更",tag:"t-org",prio:"中",po:"PO-55142",qty:"改 3mm 鍍層",amt:98,stage:"assess",prog:40,due:"08/18",owner:"黃",risk:"需重驗 BOM"},
  {id:"OCR-2408-064",cust:"O通工業",type:"數量減少",tag:"t-gry",prio:"低",po:"PO-55110",qty:"-800 pcs",amt:54,stage:"sync",prog:88,due:"08/17",owner:"吳",risk:"呆料風險"},
  {id:"OCR-2408-061",cust:"群O機械",type:"交期延後",tag:"t-prp",prio:"中",po:"PO-55088",qty:"延後 4 天",amt:73,stage:"apply",prog:12,due:"08/19",owner:"劉",risk:"待客戶確認"},
  {id:"OCR-2408-058",cust:"鴻O金屬",type:"規格變更",tag:"t-org",prio:"高",po:"PO-55033",qty:"換 SUS316 料",amt:311,stage:"sign",prog:62,due:"08/16",owner:"林",risk:"採購前置長"},
  {id:"OCR-2408-055",cust:"O成塑膠",type:"數量增加",tag:"t-blu",prio:"中",po:"PO-54990",qty:"+500 pcs",amt:41,stage:"done",prog:100,due:"08/12",owner:"陳",risk:"—"},
  {id:"OCR-2408-052",cust:"O信化工",type:"交期提前",tag:"t-red",prio:"急",po:"PO-54951",qty:"提前 3 天",amt:128,stage:"apply",prog:8,due:"08/20",owner:"黃",risk:"待評估"},
  {id:"OCR-2408-049",cust:"O越材料",type:"規格變更",tag:"t-org",prio:"中",po:"PO-54900",qty:"改包裝規格",amt:36,stage:"sync",prog:80,due:"08/17",owner:"吳",risk:"標籤重印"},
  {id:"OCR-2408-045",cust:"O豐橡膠",type:"數量增加",tag:"t-blu",prio:"低",po:"PO-54855",qty:"+1,200 pcs",amt:67,stage:"done",prog:100,due:"08/11",owner:"劉",risk:"—"}
];

/* ===== Screen 0 : 變更申請單 ===== */
function s0(){
  var rows=CHANGES.map(function(c){
    var st=STAGES.filter(function(s){return s.key===c.stage;})[0]||STAGES[0];
    return '<tr>'+
      '<td class="mono">'+esc(c.id)+'</td>'+
      '<td><b>'+esc(c.cust)+'</b></td>'+
      '<td class="mono">'+esc(c.po)+'</td>'+
      '<td><span class="tag '+c.tag+'">'+esc(c.type)+'</span></td>'+
      '<td>'+esc(c.qty)+'</td>'+
      '<td class="mono">'+c.amt+' 萬</td>'+
      '<td><span class="tag t-gry"><span class="material-symbols-outlined">'+st.ic+'</span>'+st.nm+'</span></td>'+
      '<td><span class="tag '+(c.prio==="急"?"t-red":c.prio==="高"?"t-org":c.prio==="中"?"t-blu":"t-gry")+'">'+esc(c.prio)+'</span></td>'+
      '<td>'+esc(c.due)+'</td>'+
    '</tr>';
  }).join("");
  return head(0,"登錄客戶提出的訂單變更需求，附上原始訂單基準與變更說明。","本月變更單 32 件")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("assignment","本月變更單","32","件","up","較上月 +5")+
    kpi("bolt","急件待處理","3","件","down","即時 SLA 追蹤")+
    kpi("payments","涉及金額","1,286","萬","up","含增量與規格")+
    kpi("timer","平均登錄耗時","7.4","分","up","範本自動帶入")+
  '</div>'+
  '<div class="grid g-1-2">'+
    '<div class="card">'+
      '<h3><span class="material-symbols-outlined">note_add</span>新增變更申請單</h3>'+
      '<div class="form-grid">'+
        field("原始訂單","tag","PO-55231 / O達精密",false)+
        field("變更類型","category","數量增加",false)+
        field("變更前","inventory_2","數量 8,000 pcs",false)+
        field("變更後","published_with_changes","數量 10,000 pcs",false)+
        field("客戶期望完成日","event","2026-08-16",true)+
        field("變更原因說明","description","客戶下游訂單追加，需同步拉高本批產出。",true)+
      '</div>'+
      '<div class="note" style="margin-top:12px"><span class="material-symbols-outlined">smart_toy</span>'+
      '<div>系統偵測此變更影響 <b>SMT-2 產線</b> 週產能與 <b>連接器端子</b> 物料，已自動預派 PMC 評估。</div></div>'+
    '</div>'+
    '<div class="card pad0">'+
      '<div style="padding:14px 16px 0"><h3 style="margin:0"><span class="material-symbols-outlined">receipt_long</span>變更申請清單 <span class="sub">· 依建立時間</span></h3></div>'+
      '<div class="tbl-wrap" style="margin-top:10px"><table>'+
        '<thead><tr><th>變更單號</th><th>客戶</th><th>原訂單</th><th>類型</th><th>變更內容</th><th>金額</th><th>階段</th><th>優先</th><th>期望日</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
  '</div>';
}

/* ===== Screen 1 : 變更看板 (signature) ===== */
function s1(){
  var cols=STAGES.map(function(st){
    var items=CHANGES.filter(function(c){return c.stage===st.key;});
    var tiles=items.map(function(c){
      return '<div class="ktile">'+
        '<div class="id">'+esc(c.id)+'</div>'+
        '<div class="cust">'+esc(c.cust)+'</div>'+
        '<div class="meta">'+
          '<span class="tag '+c.tag+'">'+esc(c.type)+'</span>'+
          '<span class="tag '+(c.prio==="急"?"t-red":c.prio==="高"?"t-org":"t-gry")+'">'+esc(c.prio)+'</span>'+
        '</div>'+
        '<div class="prog"><i style="width:'+c.prog+'%"></i></div>'+
        '<div class="foot"><span><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;color:'+(c.risk==="—"?"#16a34a":"#dc2626")+'">'+(c.risk==="—"?"check_circle":"warning")+'</span> '+esc(c.due)+'</span><span class="avatar">'+esc(c.owner)+'</span></div>'+
      '</div>';
    }).join("");
    return '<div class="col">'+

/* ===== controller ===== */
var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  void app.offsetHeight;
  initCharts(i);
  try{window.scrollTo(0,0);}catch(e){}
}
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){var n=+this.getAttribute("data-i");location.hash="v"+n;});
  }
