<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>無鹵/綠色材料管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#fb923c;--bg:#f4f5f7;--card:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--dark:#1c1917;--dark2:#292524;}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{width:236px;background:var(--dark);color:#e7e5e4;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
.brand{padding:20px 18px;border-bottom:1px solid #3f3a36;display:flex;align-items:center;gap:11px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand h1{font-size:15px;font-weight:700;color:#fff;}
.brand p{font-size:11px;color:#a8a29e;margin-top:2px;}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;flex-wrap:wrap;}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;border:none;background:transparent;color:#d6d3d1;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left;width:100%;transition:.15s;}
.navbtn .material-symbols-outlined{font-size:21px;color:#a8a29e;flex-shrink:0;}
.navbtn:hover{background:#292524;color:#fff;}
.navbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.navbtn.active .material-symbols-outlined{color:#fff;}
.navnum{margin-left:auto;font-size:11px;opacity:.6;}
.sidefoot{margin-top:auto;padding:16px 18px;border-top:1px solid #3f3a36;font-size:11px;color:#a8a29e;}
.main{flex:1;padding:26px 30px 46px;max-width:100%;overflow-x:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.topbar h2{font-size:21px;font-weight:700;}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:3px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;background:#fff7ed;color:var(--accent);border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid #fed7aa;}
.chip .material-symbols-outlined{font-size:16px;}
.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px;}
.kpi{background:var(--card);border-radius:14px;padding:17px 18px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);}
.kpi .kt{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.kpi .kt .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .kv{font-size:27px;font-weight:700;margin-top:9px;}
.kpi .kv small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px;}
.kpi .kd{font-size:11.5px;margin-top:6px;font-weight:600;}
.up{color:#16a34a;}.down{color:#dc2626;}.warn{color:#d97706;}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);padding:18px 20px;margin-bottom:18px;}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .csub{font-size:12px;color:var(--muted);margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 12px;background:#fafaf9;color:var(--muted);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid #f1f0ef;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fffbf7;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0f2fe;color:#0369a1;}
.t-mute{background:#f3f4f6;color:#4b5563;}
.bar{height:7px;border-radius:5px;background:#f1f0ef;overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{overflow:hidden;}
.timeline{position:relative;padding-left:8px;}
.titem{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #f1f0ef;}
.titem:last-child{border-bottom:none;}
.tdot{width:11px;height:11px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.tinfo{flex:1;}
.tinfo .th{font-size:13.5px;font-weight:600;}
.tinfo .td{font-size:12px;color:var(--muted);margin-top:2px;}
.tinfo .tm{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:3px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.col{background:#fafaf9;border-radius:12px;padding:12px;border:1px solid var(--line);}
.colh{font-size:12.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.colh .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 1px rgba(0,0,0,.02);}
.tk:last-child{margin-bottom:0;}
.tk .tkh{font-size:13px;font-weight:600;}
.tk .tkm{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:6px;}
.tk .tkbadge{border-top:1px solid #f1f0ef;margin-top:8px;padding-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.declist{display:flex;flex-direction:column;gap:11px;}
.dec{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:#fff;}
.dec .dico{width:40px;height:40px;border-radius:10px;background:#fff7ed;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dec .dmain{flex:1;min-width:0;}
.dec .dmain .dt{font-size:13.5px;font-weight:600;}
.dec .dmain .ds{font-size:11.5px;color:var(--muted);margin-top:2px;}
.reprow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f1f0ef;}
.reprow:last-child{border-bottom:none;}
.repico{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#fff7ed,#ffedd5);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.repmain{flex:1;min-width:0;}
.repmain .rt{font-size:13.5px;font-weight:600;}
.repmain .rs{font-size:11.5px;color:var(--muted);margin-top:3px;}
@media(max-width:1080px){.kpigrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
 .app{flex-direction:column;}
 .sidebar{width:100%;height:auto;position:static;flex-direction:column;}
 .nav{flex-direction:row;flex-wrap:wrap;padding:9px;}
 .navbtn{width:auto;flex:1 1 auto;}
 .navnum{display:none;}
 .sidefoot{display:none;}
 .main{padding:20px 16px 40px;}
}
@media(max-width:820px){
 .grid2,.grid2b,.grid3{grid-template-columns:1fr;}
 .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
 .kpigrid{grid-template-columns:1fr;}
 .navbtn .navtxt{display:none;}
 .navbtn{justify-content:center;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div>
        <h1>綠色材料管理</h1>
        <p>Halogen-Free / Green Material</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      綠色符合性平台 v3.2<br/>研發 · 採購 · 法規事務
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="scTitle">綠色材料資料庫</h2>
        <div class="sub" id="scSub"></div>
      </div>
      <div class="chip"><span class="material-symbols-outlined">verified</span><span>QMS 綠色符合性</span></div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
var MODS=[
 {icon:"science",name:"綠色材料資料庫",sub:"無鹵/低鹵材料規格與物質清單查詢"},
 {icon:"description",name:"供應商聲明書",sub:"RoHS/REACH/HF 聲明蒐集與有效期追蹤"},
 {icon:"rule",name:"合規篩檢",sub:"限用物質門檻自動比對與判定"},
 {icon:"account_tree",name:"替代材料評估",sub:"候選料件比對與驗證看板"},
 {icon:"biotech",name:"IMDS / 測試報告",sub:"第三方檢測數據與 PPM 彙整"},
 {icon:"verified",name:"合規報告產出",sub:"產品符合性宣告與稽核佐證"}
];
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

function buildNav(){
  var n=el("nav");var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="navtxt">'+MODS[i].name+'</span><span class="navnum">'+i+'</span></button>';
  }
  n.innerHTML=h;
  var btns=n.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
}

/* ---------- Screen 0: 綠色材料資料庫 ---------- */
function s0(c){
  var mats=[
    {code:"GM-CU-1004",name:"無鹵FR-4基板(HF)",cat:"PCB基材",std:"IEC 61249-2-21",br:280,cl:410,st:"ok"},
    {code:"GM-PA6-220",name:"環保阻燃PA6",cat:"塑膠件",std:"UL94 V-0",br:120,cl:190,st:"ok"},
    {code:"GM-SN-050",name:"SAC305無鉛焊錫",cat:"焊接材料",std:"J-STD-006",br:0,cl:0,st:"ok"},
    {code:"GM-CBL-77",name:"低鹵電源線材",cat:"線材",std:"IEC 62821",br:640,cl:780,st:"warn"},
    {code:"GM-ADH-31",name:"環氧封裝膠",cat:"膠材",std:"RoHS 2.0",br:90,cl:150,st:"ok"},
    {code:"GM-LBL-09",name:"防水標籤貼紙",cat:"耗材",std:"待補測試",br:"--",cl:"--",st:"pending"}
  ];
  var h='<div class="kpigrid">'+
    kpi("inventory_2","登錄綠色料號","1,284","+38 本月","up")+
    kpi("verified","合規料號比例","91.4%","目標 ≥90%","up")+
    kpi("science","涵蓋材料類別","24","類","")+
    kpi("warning","待補資料料號","28","-6 本週","up")+
  '</div>';
  h+='<div class="grid2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>綠色材料清單</h3><div class="csub">無鹵標準：溴(Br) ≤900ppm、氯(Cl) ≤900ppm、Br+Cl ≤1500ppm</div><div style="overflow-x:auto"><table><thead><tr><th>料號</th><th>名稱</th><th>類別</th><th>適用標準</th><th>Br(ppm)</th><th>Cl(ppm)</th><th>狀態</th></tr></thead><tbody>';
  for(var i=0;i<mats.length;i++){var m=mats[i];
    h+='<tr><td style="font-weight:600">'+m.code+'</td><td>'+m.name+'</td><td>'+m.cat+'</td><td>'+m.std+'</td><td>'+m.br+'</td><td>'+m.cl+'</td><td>'+stTag(m.st)+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>材料類別分布</h3><div class="csub">依綠色料號數量統計</div><div class="chartbox" id="c0a" style="height:270px"></div></div>';
  h+='</div>';
  c.innerHTML=h;
  void c.offsetHeight;
  var ch=new ApexCharts(el("c0a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:270,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[412,286,201,175,120,90],
    labels:["PCB基材","塑膠件","線材","焊接材料","膠材","耗材"],
    colors:["#ea580c","#fb923c","#fdba74","#fca5a5","#f59e0b","#a8a29e"],
    legend:{position:"bottom",fontSize:"12px"},
    dataLabels:{enabled:false},
    stroke:{width:0},
    plotOptions:{pie:{donut:{size:"64%",labels:{show:true,total:{show:true,label:"綠色料號",fontSize:"12px",color:"#6b7280"}}}}}
  });
  ch.render();charts.push(ch);
}

/* ---------- Screen 1: 供應商聲明書 ---------- */
function s1(c){
  var h='<div class="kpigrid">'+
    kpi("description","有效聲明書","842","份","")+
    kpi("schedule","30天內到期","17","需換版","warn")+
    kpi("error","缺件供應商","5","家","down")+
    kpi("task_alt","本月回收率","88%","+7%","up")+
  '</div>';
  h+='<div class="grid2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">folder_open</span>供應商聲明書狀態</h3><div class="csub">RoHS / REACH / 無鹵(HF) 聲明蒐集追蹤</div><div class="declist">';
  var decs=[
    {n:"O昇電子材料",d:"HF + RoHS 聲明 · 有效至 2027-03",st:"ok",lb:"齊全"},
    {n:"綠源塑膠",d:"REACH SVHC 聲明 · 有效至 2026-09",st:"warn",lb:"即將到期"},
    {n:"泰豐線纜",d:"無鹵聲明缺件 · MSDS 已補",st:"bad",lb:"缺件"},
    {n:"晶邦化工",d:"RoHS 2.0 全套 · 有效至 2028-01",st:"ok",lb:"齊全"},
    {n:"和欣膠業",d:"HF 聲明審核中 · 待回覆",st:"info",lb:"審核中"}
  ];
  for(var i=0;i<decs.length;i++){var d=decs[i];
    h+='<div class="dec"><div class="dico"><span class="material-symbols-outlined">business</span></div><div class="dmain"><div class="dt">'+d.n+'</div><div class="ds">'+d.d+'</div></div>'+stTag2(d.st,d.lb)+'</div>';
  }
  h+='</div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">event_upcoming</span>聲明到期提醒</h3><div class="csub">近期需換版之聲明書</div><div class="timeline">';
  var tl=[
    {col:"#dc2626",t:"綠源塑膠 REACH 聲明",d:"距到期 12 天，已通知採購換版",m:"2026-08-26 到期"},
    {col:"#d97706",t:"銘泰金屬 RoHS 聲明",d:"距到期 21 天，供應商已排程重測",m:"2026-09-04 到期"},
    {col:"#d97706",t:"永光電材 HF 聲明",d:"距到期 28 天，待供應商上傳",m:"2026-09-11 到期"},
    {col:"#16a34a",t:"晶邦化工 RoHS 聲明",d:"已於本週完成換版歸檔",m:"完成 2026-08-10"}
  ];
  for(var k=0;k<tl.length;k++){var e=tl[k];
    h+='<div class="titem"><div class="tdot" style="background:'+e.col+'"></div><div class="tinfo"><div class="th">'+e.t+'</div><div class="td">'+e.d+'</div><div class="tm">'+e.m+'</div></div></div>';
  }
  h+='</div></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各月聲明蒐集進度</h3><div class="csub">已回收 vs 待回收（份）</div><div class="chartbox" id="c1a" style="height:280px"></div></div>';
  c.innerHTML=h;
  void c.offsetHeight;
  var ch=new ApexCharts(el("c1a"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:280,stacked:true,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false,toolbar:{show:false}},
    series:[{name:"已回收",data:[62,71,80,88,95,102]},{name:"待回收",data:[18,15,13,11,9,8]}],
    xaxis:{categories:["3月","4月","5月","6月","7月","8月"],labels:{style:{fontSize:"12px"}}},
    colors:["#ea580c","#fed7aa"],
    plotOptions:{bar:{columnWidth:"52%",borderRadius:4}},
    dataLabels:{enabled:false},
    legend:{position:"top",fontSize:"12px"},
    tooltip:{shared:true,intersect:false},
    grid:{borderColor:"#f1f0ef"}
  });
  ch.render();charts.push(ch);
}

/* ---------- Screen 2: 合規篩檢 (signature) ---------- */
function s2(c){
  var rows=[
    {sub:"鉛 Pb",lim:"1000",val:"120",st:"ok"},
    {sub:"鎘 Cd",lim:"100",val:"18",st:"ok"},
    {sub:"汞 Hg",lim:"1000",val:"0",st:"ok"},
    {sub:"六價鉻 Cr6+",lim:"1000",val:"940",st:"warn"},
    {sub:"多溴聯苯 PBB",lim:"1000",val:"0",st:"ok"},
    {sub:"溴 Br (HF)",lim:"900",val:"1120",st:"bad"},
    {sub:"氯 Cl (HF)",lim:"900",val:"430",st:"ok"},
    {sub:"鄰苯二甲酸酯 DEHP",lim:"1000",val:"待測",st:"pending"}
  ];
  var h='<div class="kpigrid">'+
    kpi("rule","本批篩檢項目","10","限用物質","")+
    kpi("check_circle","通過項目","6","符合門檻","up")+
    kpi("dangerous","超標項目","1","Br 超標","down")+
    kpi("hourglass_top","待補測項目","1","DEHP","warn")+
  '</div>';
  h+='<div class="grid2">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>限用物質門檻比對</h3><div class="csub">料號 GM-CBL-77 · 檢測值 vs 管制門檻(ppm)</div><div style="overflow-x:auto"><table><thead><tr><th>管制物質</th><th>門檻(ppm)</th><th>檢測值</th><th>裕度</th><th>判定</th></tr></thead><tbody>';
  for(var i=0;i<rows.length;i++){var r=rows[i];
    var pct=r.st==="pending"?0:Math.min(100,Math.round((parseFloat(r.val)||0)/parseFloat(r.lim)*100));
    var bcol=r.st==="bad"?"#dc2626":(r.st==="warn"?"#d97706":"#16a34a");
    var marg=r.st==="pending"?"--":(r.st==="bad"?"超標":(100-pct)+"%");
    h+='<tr><td style="font-weight:600">'+r.sub+'</td><td>'+r.lim+'</td><td>'+r.val+'</td><td><div class="bar" style="width:80px"><span style="width:'+pct+'%;background:'+bcol+'"></span></div><span style="font-size:11px;color:'+bcol+'">'+marg+'</span></td><td>'+stTag(r.st)+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">radar</span>物質風險雷達</h3><div class="csub">各物質檢測值占門檻比(%)</div><div class="chartbox" id="c2a" style="height:300px"></div></div>';
  h+='</div>';
  c.innerHTML=h;

/* ---------- helpers ---------- */
function kpi(icon,label,val,delta,cls){
  var d=delta?'<div class="kd '+(cls||"")+'">'+delta+'</div>':'';
  return '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div><div class="kv">'+val+'</div>'+d+'</div>';
}
function stTag(st){
  if(st==="ok")return '<span class="tag t-ok">合格</span>';
  if(st==="warn")return '<span class="tag t-warn">接近門檻</span>';
  if(st==="bad")return '<span class="tag t-bad">超標</span>';
  if(st==="pending")return '<span class="tag t-mute">待補測</span>';
  return '<span class="tag t-info">處理中</span>';
}
function stTag2(st,lb){
  var m={ok:"t-ok",warn:"t-warn",bad:"t-bad",info:"t-info",mute:"t-mute"};
  return '<span class="tag '+(m[st]||"t-mute")+'">'+lb+'</span>';
}
function imdsTag(st){
  if(st==="ok")return '<span class="tag t-ok">已提交</span>';
  if(st==="info")return '<span class="tag t-info">建置中</span>';
  return '<span class="tag t-mute">未建</span>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  el("scTitle").textContent=MODS[i].name;
  el("scSub").textContent=MODS[i].sub;
  var c=el("screen");
  c.innerHTML="";
  void c.offsetHeight;
  SCREENS[i](c);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
