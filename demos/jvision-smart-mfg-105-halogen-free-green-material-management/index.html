<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品無鹵綠色材料管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --success:#15803d;
  --warning:#a44808;
  --sidebar:#0f172a;
  --shadow:0 10px 28px rgba(15,23,42,.055);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",system-ui,sans-serif;line-height:1.55}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:1.25rem;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;z-index:20;display:flex;flex:0 0 250px;flex-direction:column;height:100vh;background:var(--sidebar);color:#cbd5e1;border-right:1px solid #1e293b}
.brand{display:flex;align-items:center;gap:12px;padding:24px 20px;border-bottom:1px solid #334155}
.logo{display:grid;flex:0 0 42px;width:42px;height:42px;place-items:center;color:#fff;background:var(--blue);border-radius:9px;box-shadow:5px 5px 0 #1d4ed8}
.brand h1{margin:0;color:#fff;font-size:15px;line-height:1.3;letter-spacing:.02em}
.brand p{margin:3px 0 0;color:#94a3b8;font-family:"Fira Code",monospace;font-size:9px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:6px;padding:18px 12px}
.navbtn{display:flex;width:100%;align-items:center;gap:12px;padding:12px 13px;border:1px solid transparent;border-radius:7px;background:transparent;color:#cbd5e1;text-align:left;transition:background .22s ease,border-color .22s ease,color .22s ease,transform .22s ease}
.navbtn .material-symbols-outlined{color:#94a3b8}
.navbtn:hover{transform:translateX(3px);background:#1e293b;color:#fff;border-color:#334155}
.navbtn.active{background:var(--blue);color:#fff;border-color:#60a5fa;box-shadow:4px 4px 0 rgba(59,130,246,.25)}
.navbtn.active .material-symbols-outlined{color:#fff}
.navtxt{font-size:13px;font-weight:600}
.navnum{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:10px;opacity:.72}
.sidefoot{margin-top:auto;padding:18px 20px;border-top:1px solid #334155;color:#94a3b8;font-family:"Fira Code",monospace;font-size:10px;line-height:1.7}
.main{flex:1;max-width:100%;padding:32px clamp(18px,3vw,42px) 52px;overflow-x:hidden}
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;padding:24px 26px;overflow:hidden;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;box-shadow:var(--shadow)}
.topbar:after{position:absolute;right:-45px;bottom:-70px;width:190px;height:150px;content:"";background:linear-gradient(135deg,rgba(37,99,235,.11),rgba(59,130,246,.02));transform:rotate(-10deg)}
.topbar>div{position:relative;z-index:1}
.topbar h2{margin:0;font-size:clamp(21px,2.2vw,28px);line-height:1.25;letter-spacing:-.025em}
.sub{margin-top:6px;color:var(--muted);font-size:13px}
.chip{display:inline-flex;flex:0 0 auto;align-items:center;gap:7px;padding:8px 12px;color:#1e3a8a;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;font-size:12px;font-weight:700}
.kpigrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi,.card{background:var(--color-card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}
.kpi{position:relative;padding:18px;overflow:hidden;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.kpi:before{position:absolute;top:0;left:0;width:100%;height:3px;content:"";background:var(--blue);transform:scaleX(.28);transform-origin:left;transition:transform .22s ease}
.kpi:hover{transform:translateY(-3px);border-color:#bfdbfe;box-shadow:0 14px 32px rgba(37,99,235,.1)}
.kpi:hover:before{transform:scaleX(1)}
.kt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.kt .material-symbols-outlined{color:var(--blue)}
.kv{margin-top:10px;color:var(--ink);font-family:"Fira Code",monospace;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.kd{margin-top:6px;color:var(--muted);font-size:11px;font-weight:600}
.up{color:#166534}.down{color:#b91c1c}.warn{color:#92400e}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px}
.grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{margin-bottom:18px;padding:20px;transition:border-color .22s ease,box-shadow .22s ease}
.card:hover{border-color:#cbd5e1;box-shadow:0 13px 30px rgba(15,23,42,.075)}
.card h3{display:flex;align-items:center;gap:9px;margin:0 0 4px;font-size:15px;letter-spacing:-.01em}
.card h3 .material-symbols-outlined{color:var(--blue)}
.csub{margin-bottom:16px;color:var(--muted);font-size:12px}
table{width:100%;border-spacing:0;border-collapse:separate;font-size:12.5px}
th{padding:11px 12px;background:#f1f5f9;color:#334155;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.035em;text-align:left;white-space:nowrap}
th:first-child{border-left:1px solid var(--line);border-radius:6px 0 0 0}
th:last-child{border-right:1px solid var(--line);border-radius:0 6px 0 0}
td{padding:12px;border-bottom:1px solid #edf2f7;white-space:nowrap;transition:background .18s ease}
tbody tr:hover td{background:#f8fbff}
td:nth-child(n+5){font-variant-numeric:tabular-nums}
table td:first-child,.mono{font-family:"Fira Code",monospace;font-size:11.5px}
.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:700;line-height:1.2}
.tag:before{font-family:"Material Symbols Outlined";font-size:14px;font-weight:400}
.t-ok{color:#166534;background:#f0fdf4}.t-ok:before{content:"check_circle"}
.t-warn{color:#92400e;background:#fffbeb}.t-warn:before{content:"warning"}
.t-bad{color:#b91c1c;background:#fef2f2}.t-bad:before{content:"error"}
.t-info{color:#1d4ed8;background:#eff6ff}.t-info:before{content:"info"}
.t-mute{color:#475569;background:#f1f5f9}.t-mute:before{content:"schedule"}
.bar{height:7px;overflow:hidden;background:#e2e8f0;border-radius:999px}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:inherit}
.chartbox{overflow:hidden}
.timeline{padding-left:2px}
.titem{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid #edf2f7}
.titem:last-child{border-bottom:0}
.tdot{flex:0 0 11px;width:11px;height:11px;margin-top:5px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px currentColor}
.tinfo{flex:1}
.tinfo .th{font-size:13px;font-weight:700}
.tinfo .td{margin-top:2px;color:var(--muted);font-size:11.5px}
.tinfo .tm{margin-top:4px;color:#1d4ed8;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:13px}
.col{padding:12px;background:#f1f5f9;border:1px solid var(--line);border-radius:8px}
.colh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:12px;font-weight:700}
.cnt{padding:1px 8px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tk{margin-bottom:9px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 2px 5px rgba(15,23,42,.04);transition:transform .2s ease,border-color .2s ease}
.tk:hover{transform:translateY(-2px);border-color:#93c5fd}
.tk:last-child{margin-bottom:0}
.tkh{font-size:12.5px;font-weight:700}
.tkm{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:10.5px}
.tkbadge{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid #edf2f7}
.declist{display:flex;flex-direction:column;gap:10px}
.dec{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--line);border-radius:8px;transition:transform .2s ease,border-color .2s ease}
.dec:hover{transform:translateX(3px);border-color:#93c5fd}
.dico,.repico{display:grid;flex:0 0 40px;width:40px;height:40px;place-items:center;color:var(--blue);background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px}
.dmain,.repmain{flex:1}
.dt,.rt{font-size:13px;font-weight:700}
.ds,.rs{margin-top:2px;color:var(--muted);font-size:11px}
.reprow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #edf2f7}
.reprow:last-child{border-bottom:0}
.repico{flex-basis:42px;width:42px;height:42px}
.screen-enter>.kpi,.screen-enter>.card,.screen-enter>.grid2,.screen-enter>.grid2b{animation:rise .4s cubic-bezier(.2,.75,.25,1) both}
.screen-enter>.kpi:nth-child(2){animation-delay:.05s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:1100px){.kpigrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:880px){
  .app{display:block}
  .sidebar{position:static;width:100%;height:auto}
  .brand{padding:16px}
  .nav{flex-direction:row;padding:10px;overflow-x:auto}
  .navbtn{flex:0 0 auto;width:auto}
  .navbtn:hover{transform:translateY(-2px)}
  .navnum,.sidefoot{display:none}
  .main{padding:20px 16px 40px}
  .grid2,.grid2b,.grid3{grid-template-columns:1fr}
}
@media(max-width:620px){
  .topbar{align-items:flex-start;padding:19px;flex-direction:column}
  .chip{align-self:flex-start}
  .kpigrid{grid-template-columns:1fr;gap:12px}
  .card{padding:16px}
  .navtxt{font-size:12px}
  .board{grid-template-columns:repeat(4,240px)}
}
@media(max-width:390px){
  .brand p{display:none}
  .navbtn{padding:10px}
  .navbtn .navtxt{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">eco</span></div>
    <div><h1>產品無鹵綠色材料管理</h1><p>HALOGEN-FREE / GREEN MATERIAL</p></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <div class="sidefoot">綠色符合性平台 v3.2<br>研發 · 採購 · 法規事務</div>
</aside>
<main class="main">
  <header class="topbar">
    <div><h2 id="scTitle">綠色材料資料庫</h2><div class="sub" id="scSub"></div></div>
    <div class="chip"><span class="material-symbols-outlined" aria-hidden="true">verified</span><span>QMS 綠色符合性</span></div>
  </header>
  <div id="screen" aria-live="polite"></div>
</main>
</div>
<script>
var MODS=[
 {icon:"science",name:"綠色材料資料庫",sub:"無鹵/低鹵材料規格與物質清單查詢"},
 {icon:"description",name:"供應商聲明書",sub:"RoHS/REACH/HF 聲明蒐集與有效期追蹤"},
 {icon:"rule",name:"合規篩檢",sub:"限用物質門檻自動比對與判定"},
 {icon:"account_tree",name:"替代材料評估",sub:"候選料件比對與驗證看板"},
 {icon:"biotech",name:"IMDS / 測試報告",sub:"第三方檢測數據與 PPM 彙整"},
 {icon:"verified",name:"合規報告產出",sub:"產品符合性宣告與稽核佐證"}
];
var charts=[];
function el(id){return document.getElementById(id)}
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function buildNav(){
 var h="";
 MODS.forEach(function(m,i){h+='<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="navtxt">'+m.name+'</span><span class="navnum">0'+(i+1)+'</span></button>'});
 el("nav").innerHTML=h;
 el("nav").querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){location.hash="v"+this.dataset.i})})
}
function kpi(icon,label,val,delta,cls){
 return '<div class="kpi"><div class="kt"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+label+'</div><div class="kv">'+val+'</div>'+(delta?'<div class="kd '+(cls||"")+'">'+delta+'</div>':"")+'</div>'
}
function stTag(st){
 if(st==="ok")return '<span class="tag t-ok">合格</span>';
 if(st==="warn")return '<span class="tag t-warn">接近門檻</span>';
 if(st==="bad")return '<span class="tag t-bad">超標</span>';
 if(st==="pending")return '<span class="tag t-mute">待補測</span>';
 return '<span class="tag t-info">處理中</span>'
}
function stTag2(st,lb){
 var m={ok:"t-ok",warn:"t-warn",bad:"t-bad",info:"t-info",mute:"t-mute"};
 return '<span class="tag '+(m[st]||"t-mute")+'">'+lb+'</span>'
}
function imdsTag(st){
 if(st==="ok")return '<span class="tag t-ok">已提交</span>';
 if(st==="info")return '<span class="tag t-info">建置中</span>';
 return '<span class="tag t-mute">未建</span>'
}
function baseChart(type,height){
 return {chart:{type:type,height:height,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false,toolbar:{show:false}},dataLabels:{enabled:false},grid:{borderColor:"#e2e8f0"},legend:{fontFamily:"Fira Sans",fontSize:"12px"},tooltip:{theme:"light"},colors:["#2563eb","#3b82f6","#93c5fd","#ea580c"]}
}
function mount(id,opt){var c=new ApexCharts(el(id),opt);c.render();charts.push(c)}
function finish(c){
 c.classList.add("screen-enter");
 c.querySelectorAll("td").forEach(function(td){
  var t=td.textContent.trim();
  if(/^[-+]?(?:\d[\d,.]*)(?:%|天|份|筆|家|類)?$/.test(t)||t==="--")td.classList.add("num");
  if(/^(GM-|RPT-|ALT-)/.test(t))td.classList.add("mono")
 })
}
function s0(c){
 var mats=[
  ["GM-CU-1004","無鹵FR-4基板(HF)","PCB基材","IEC 61249-2-21",280,410,"ok"],
  ["GM-PA6-220","環保阻燃PA6","塑膠件","UL94 V-0",120,190,"ok"],
  ["GM-SN-050","SAC305無鉛焊錫","焊接材料","J-STD-006",0,0,"ok"],
  ["GM-CBL-77","低鹵電源線材","線材","IEC 62821",640,780,"warn"],
  ["GM-ADH-31","環氧封裝膠","膠材","RoHS 2.0",90,150,"ok"],
  ["GM-LBL-09","防水標籤貼紙","耗材","待補測試","--","--","pending"]
 ];
 var h='<div class="kpigrid">'+kpi("inventory_2","登錄綠色料號","1,284","+38 本月","up")+kpi("verified","合規料號比例","91.4%","目標 ≥90%","up")+kpi("science","涵蓋材料類別","24","類","")+kpi("warning","待補資料料號","28","-6 本週","up")+'</div><div class="grid2"><section class="card"><h3><span class="material-symbols-outlined">table_rows</span>綠色材料清單</h3><div class="csub">無鹵標準：溴(Br) ≤900ppm、氯(Cl) ≤900ppm、Br+Cl ≤1500ppm</div><div style="overflow-x:auto"><table><thead><tr><th>料號</th><th>名稱</th><th>類別</th><th>適用標準</th><th>Br(ppm)</th><th>Cl(ppm)</th><th>狀態</th></tr></thead><tbody>';
 mats.forEach(function(m){h+='<tr><td>'+m[0]+'</td><td>'+m[1]+'</td><td>'+m[2]+'</td><td>'+m[3]+'</td><td>'+m[4]+'</td><td>'+m[5]+'</td><td>'+stTag(m[6])+'</td></tr>'});
 h+='</tbody></table></div></section><section class="card"><h3><span class="material-symbols-outlined">donut_large</span>材料類別分布</h3><div class="csub">依綠色料號數量統計</div><div id="c0a" class="chartbox" style="height:270px"></div></section></div>';
 c.innerHTML=h;finish(c);
 var o=baseChart("donut",270);o.series=[412,286,201,175,120,90];o.labels=["PCB基材","塑膠件","線材","焊接材料","膠材","耗材"];o.colors=["#2563eb","#3b82f6","#60a5fa","#93c5fd","#ea580c","#64748b"];o.stroke={width:0};o.legend.position="bottom";o.plotOptions={pie:{donut:{size:"66%",labels:{show:true,total:{show:true,label:"綠色料號",color:"#475569"}}}}};mount("c0a",o)
}
function s1(c){
 var decs=[
  ["O昇電子材料","HF + RoHS 聲明 · 有效至 2027-03","ok","齊全"],
  ["O源塑膠","REACH SVHC 聲明 · 有效至 2026-09","warn","即將到期"],
  ["泰豐線纜","無鹵聲明缺件 · MSDS 已補","bad","缺件"],
  ["O邦化工","RoHS 2.0 全套 · 有效至 2028-01","ok","齊全"],
  ["和欣膠業","HF 聲明審核中 · 待回覆","info","審核中"]
 ];
 var tl=[
  ["#dc2626","綠源塑膠 REACH 聲明","距到期 12 天，已通知採購換版","2026-08-26 到期"],
  ["#a44808","銘泰金屬 RoHS 聲明","距到期 21 天，供應商已排程重測","2026-09-04 到期"],
  ["#a44808","永光電材 HF 聲明","距到期 28 天，待供應商上傳","2026-09-11 到期"],
  ["#15803d","晶邦化工 RoHS 聲明","已於本週完成換版歸檔","完成 2026-08-10"]
 ];
 var h='<div class="kpigrid">'+kpi("description","有效聲明書","842","份","")+kpi("schedule","30天內到期","17","需換版","warn")+kpi("error","缺件供應商","5","家","down")+kpi("task_alt","本月回收率","88%","+7%","up")+'</div><div class="grid2"><section class="card"><h3><span class="material-symbols-outlined">folder_open</span>供應商聲明書狀態</h3><div class="csub">RoHS / REACH / 無鹵(HF) 聲明蒐集追蹤</div><div class="declist">';
 decs.forEach(function(d){h+='<div class="dec"><div class="dico"><span class="material-symbols-outlined">business</span></div><div class="dmain"><div class="dt">'+d[0]+'</div><div class="ds">'+d[1]+'</div></div>'+stTag2(d[2],d[3])+'</div>'});
