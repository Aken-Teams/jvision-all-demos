<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>合約續約管理 Contract Renewal Management｜Jvision 系統 Demo</title>
<meta name="description" content="合約到期預警、續約談判追蹤、條款價格比對、內部核准與電子簽署歸檔的一站式續約管理平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#1d4ed8; --accent2:#60a5fa; --ink:#0f172a; --mut:#64748b;
  --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff; --side:#0b1220; --side2:#111c33;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --soft:#eff4ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;vertical-align:middle}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{width:250px;flex:none;min-width:0;background:linear-gradient(180deg,var(--side),var(--side2));color:#cbd5e1;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(29,78,216,.4)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{color:#fff;font-size:15px;font-weight:800;display:block;letter-spacing:.2px}
.brand span{font-size:11px;color:#7c8aa5}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{display:flex;gap:11px;align-items:center;background:transparent;border:0;color:#aab6cc;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(90deg,var(--accent),rgba(96,165,250,.35));color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.35)}
.nav .idx{margin-left:auto;font-size:11px;opacity:.55;flex:none}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6b7896;line-height:1.7}
.side .foot b{color:#9fb0cc}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.top .sub{font-size:12px;color:var(--mut);margin-top:2px}
.top .grow{flex:1;min-width:0}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap}
.chip .material-symbols-outlined{font-size:16px}
.wrap{padding:22px;min-width:0}
.grid{display:grid;gap:14px;min-width:0}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.col-2a{grid-template-columns:1.5fr 1fr}
.col-2b{grid-template-columns:1fr 1.6fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ct{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;margin:0 0 13px}
.ct .material-symbols-outlined{font-size:19px;color:var(--accent)}
.ct .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--mut)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px}
.kpi .val{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.5px;overflow-wrap:anywhere}
.kpi .val small{font-size:13px;font-weight:700;color:var(--mut);margin-left:3px}
.kpi .dt{font-size:11.5px;margin-top:6px;font-weight:700}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.up{color:var(--ok)}.down{color:var(--bad)}.wn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f8fafc;font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.4px}
tbody tr:hover{background:#fafcff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#1d4ed8}
.b-mut{background:#f1f5f9;color:#475569}
.chart{width:100%;overflow:hidden}
.scroll{overflow-x:auto;min-width:0;border-radius:12px}
.mini{font-size:11.5px;color:var(--mut)}
.hr{height:1px;background:var(--line);margin:12px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;min-width:0}
.cal .dow{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding:2px}
.cal .cell{background:#f8fafc;border:1px solid var(--line);border-radius:10px;min-height:74px;padding:6px 7px;font-size:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cell.mut{opacity:.4}
.cal .cell .d{font-weight:800;font-size:12px;color:#334155}
.cal .ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.r{background:#fee2e2;color:#b91c1c}
.ev.o{background:#ffedd5;color:#c2410c}
.ev.b{background:#dbeafe;color:#1d4ed8}
.ev.g{background:#dcfce7;color:#15803d}
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff}
.alert .ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff}
.alert .ic .material-symbols-outlined{font-size:19px}
.alert b{font-size:13px}
.alert .mini{margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(29,78,216,.45)}70%{box-shadow:0 0 0 8px rgba(29,78,216,0)}100%{box-shadow:0 0 0 0 rgba(29,78,216,0)}}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.lane{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.lane h4{margin:0 0 9px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.lane h4 .n{margin-left:auto;background:#e2e8f0;color:#475569;border-radius:999px;padding:1px 8px;font-size:11px}
.lane .top-bd{height:3px;border-radius:999px;margin:-2px 0 9px}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tk b{font-size:12.5px;display:block}
.tk .row{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.tk .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.tk .amt{margin-left:auto;font-weight:800;font-size:12px;color:var(--accent)}
.diff td.old{color:#b91c1c;background:#fef2f2}
.diff td.new{color:#15803d;background:#f0fdf4}
.diff .rk{font-weight:800}
.steps{position:relative}
.step{display:flex;gap:13px}
.step .rail{display:flex;flex-direction:column;align-items:center;flex:none}
.step .node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.step .line{width:2px;flex:1;background:var(--line);margin:3px 0}
.step:last-child .line{display:none}
.step .body{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.step .body .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .body b{font-size:13.5px}
.sig{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;flex-wrap:wrap}
.sig .qr{width:44px;height:44px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.sig .qr .material-symbols-outlined{font-size:24px}
@media(max-width:1080px){.k4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:column;padding:12px}
  .brand{border-bottom:0;margin-bottom:8px;padding-bottom:8px}
  .side .foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
  .nav .idx{display:none}
}
@media(max-width:820px){
  .k4,.k3,.k2,.col-2a,.col-2b{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:9px 11px}
  .wrap{padding:14px}
  .top{padding:12px 14px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div><b>續約管理中樞</b><span>Contract Renewal</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <b>合約續約管理平台</b><br/>
      到期預警 · 談判追蹤 · 條款比對<br/>
      內部簽核 · 電子簽署歸檔<br/>
      <span style="color:#5f6b85">Demo 假資料 · zh-Hant</span>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="tt">到期日曆與預警</h1>
        <div class="sub" id="st">偵測即將到期合約，依剩餘天數分級發出預警</div>
      </div>
      <div class="grow"></div>
      <span class="chip"><span class="dot"></span>2026 上半年度</span>
      <span class="chip"><span class="material-symbols-outlined">groups</span>業務部 · 法務部</span>
    </header>
    <main class="wrap"><div id="view"></div></main>
  </div>
</div>

<script>
"use strict";
var NAV=[
  {ic:"calendar_month",t:"到期日曆與預警",s:"偵測即將到期合約，依剩餘天數分級發出預警"},
  {ic:"account_tree",t:"續約談判追蹤",s:"續約進度看板，逐階段推進談判狀態"},
  {ic:"history",t:"條款價格比對",s:"新舊版合約條款與價格差異，標記風險"},
  {ic:"fact_check",t:"內部核准簽核",s:"續約條件內部審批流，逐關核准放行"},
  {ic:"verified",t:"電子簽署歸檔",s:"簽署狀態追蹤與合約主檔更新"},
  {ic:"insights",t:"續約成效分析",s:"續約率、預警達成率與續約金額趨勢"}
];

var CONTRACTS=[
  {no:"CT-2401",cust:"泰鼎精密工業",owner:"陳彥廷",amt:480,end:"07-18",days:4,tier:"紅"},
  {no:"CT-2388",cust:"宏達雲端服務",owner:"林思妤",amt:1260,end:"07-22",days:8,tier:"紅"},
  {no:"CT-2415",cust:"聯華食品物流",owner:"黃柏勳",amt:320,end:"07-28",days:14,tier:"橙"},
  {no:"CT-2377",cust:"新光紡織集團",owner:"陳彥廷",amt:760,end:"08-05",days:22,tier:"橙"},
  {no:"CT-2402",cust:"台耀化學",owner:"吳孟軒",amt:540,end:"08-14",days:31,tier:"藍"}
];
function tierBadge(t){var m={"紅":"b-bad","橙":"b-warn","藍":"b-info","綠":"b-ok"};return '<span class="badge '+(m[t]||"b-mut")+'">'+t+'級</span>';}
function riskBadge(r){var m={"高":"b-bad","中":"b-warn","低":"b-ok"};return '<span class="badge '+(m[r]||"b-mut")+'">'+r+'</span>';}

function el(id){return document.getElementById(id);}
function kpi(bar,lab,icn,val,unit,dt,cls){
  return '<div class="kpi"><span class="bar" style="background:'+bar+'"></span>'+
    '<div class="lab"><span class="material-symbols-outlined">'+icn+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="dt '+(cls||'')+'">'+dt+'</div></div>';
}

function s0(){
  var evMap={
    "18":{c:"r",x:"泰鼎 到期"},"22":{c:"r",x:"宏達 到期"},"28":{c:"o",x:"聯華 到期"},
    "05":{c:"b",x:"新光 審查"},"09":{c:"g",x:"崇越 簽署"},"14":{c:"o",x:"台耀 到期"},
    "20":{c:"b",x:"元晶 評估"},"25":{c:"g",x:"和泰 提醒"}
  };
  var lead=3, total=35, days=[];
  for(var i=0;i<total;i++){
    var dnum=i-lead+1;
    var inMonth=dnum>=1&&dnum<=31;
    var key=(dnum<10?'0':'')+dnum;
    days.push({n:inMonth?dnum:'', mut:!inMonth, ev:inMonth?evMap[key]:null});
  }
  var dow=["日","一","二","三","四","五","六"];
  var calH='<div class="cal">';
  for(var d=0;d<7;d++)calH+='<div class="dow">'+dow[d]+'</div>';
  for(var j=0;j<days.length;j++){
    var c=days[j];
    calH+='<div class="cell'+(c.mut?' mut':'')+'"><span class="d">'+c.n+'</span>';
    if(c.ev)calH+='<span class="ev '+c.ev.c+'">'+c.ev.x+'</span>';
    calH+='</div>';
  }
  calH+='</div>';

  var alerts=CONTRACTS.map(function(r){
    var col=r.tier==="紅"?"#dc2626":r.tier==="橙"?"#d97706":r.tier==="藍"?"#1d4ed8":"#16a34a";
    var ic=r.tier==="紅"?"warning":r.tier==="橙"?"schedule":"event_upcoming";
    return '<div class="alert"><div class="ic" style="background:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
      '<div style="flex:1;min-width:0"><b>'+r.cust+'</b> '+tierBadge(r.tier)+
      '<div class="mini">'+r.no+' · 到期 '+r.end+' · 剩 '+r.days+' 天 · 負責 '+r.owner+' · 金額 '+r.amt+' 萬</div></div></div>';
  }).join('');

  return '<div class="grid k4" style="margin-bottom:14px">'+
      kpi('#dc2626','30 天內到期','event_busy','7','件','較上月 +2 件','wn')+
      kpi('#d97706','紅色預警','notification_important','2','件','需 3 日內啟動','down')+
      kpi('#1d4ed8','本月待續約金額','payments','5,240','萬','涵蓋 8 份合約','')+
      kpi('#16a34a','提前預警達成率','verified','94.2','%','目標 90%','up')+
    '</div>'+
    '<div class="grid col-2a">'+
      '<div class="card"><div class="ct"><span class="material-symbols-outlined">calendar_month</span>2026 年 7 月 到期日曆'+
        '<span class="tag">紅到期·橙將到期·藍審查·綠進行</span></div>'+calH+'</div>'+
      '<div class="card"><div class="ct"><span class="material-symbols-outlined">notification_important</span>分級預警清單<span class="tag">即時</span></div>'+alerts+'</div>'+
    '</div>';
}

function s1(){
  var lanes=[
    {t:"待啟動",c:"#94a3b8",items:[
      {n:"聯華食品物流",who:"黃",amt:320,tag:"b-warn",tx:"14天到期"},
      {n:"和泰汽車零件",who:"吳",amt:920,tag:"b-info",tx:"待排程"}
    ]},
    {t:"評估中",c:"#1d4ed8",items:[
      {n:"宏達雲端服務",who:"林",amt:1260,tag:"b-bad",tx:"客戶議價"},
      {n:"元晶太陽能",who:"林",amt:2100,tag:"b-info",tx:"擴約評估"}
    ]},
    {t:"談判中",c:"#d97706",items:[
      {n:"泰鼎精密工業",who:"陳",amt:480,tag:"b-bad",tx:"卡點:漲幅"},
      {n:"新光紡織集團",who:"陳",amt:760,tag:"b-warn",tx:"條款協商"}
    ]},
    {t:"待簽核",c:"#16a34a",items:[
      {n:"崇越電通",who:"黃",amt:180,tag:"b-ok",tx:"主管審批"}
    ]}
  ];
  var board='<div class="board">';
  lanes.forEach(function(L){
    board+='<div class="lane"><div class="top-bd" style="background:'+L.c+'"></div>'+
      '<h4>'+L.t+'<span class="n">'+L.items.length+'</span></h4>';
    L.items.forEach(function(t){
      board+='<div class="tk"><b>'+t.n+'</b>'+
        '<div class="row"><span class="av">'+t.who+'</span>'+
        '<span class="badge '+t.tag+'">'+t.tx+'</span>'+
        '<span class="amt">'+t.amt+'萬</span></div></div>';
    });
    board+='</div>';
  });
  board+='</div>';

  return '<div class="grid k4" style="margin-bottom:14px">'+
      kpi('#1d4ed8','進行中續約','account_tree','7','案','跨 4 位業務','')+
      kpi('#d97706','談判卡點','report','3','案','漲幅與條款','wn')+
      kpi('#16a34a','本季續約率','trending_up','86','%','較上季 +5%','up')+
      kpi('#60a5fa','平均談判週期','schedule','11.4','天','目標 14 天內','up')+
    '</div>'+
    '<div class="card" style="margin-bottom:14px"><div class="ct"><span class="material-symbols-outlined">view_kanban</span>續約談判看板<span class="tag">拖動推進 · Demo 靜態</span></div>'+
      '<div class="scroll">'+board+'</div></div>'+
    '<div class="grid col-2b">'+
      '<div class="card"><div class="ct"><span class="material-symbols-outlined">bar_chart</span>各階段案量</div><div id="c1a" class="chart" style="height:230px"></div></div>'+
      '<div class="card"><div class="ct"><span class="material-symbols-outlined">timeline</span>近 6 週續約推進</div><div id="c1b" class="chart" style="height:230px"></div></div>'+
    '</div>';
}
function d1(){
  var a=el("c1a");
  if(a){var ch=echarts.init(a);ch.setOption({
    grid:{left:60,right:16,top:16,bottom:24},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    xAxis:{type:"value",axisLine:{show:false},splitLine:{lineStyle:{color:"#eef2f7"}}},
    yAxis:{type:"category",data:["待簽核","談判中","評估中","待啟動"],axisLine:{show:false},axisTick:{show:false}},

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAWS=[null,d1,d2,null,null,d5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var view=el("view");
  view.innerHTML=SCREENS[i]();
  el("tt").textContent=NAV[i].t;
  el("st").textContent=NAV[i].s;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  void view.offsetHeight;
  if(DRAWS[i])DRAWS[i]();
}
(function buildNav(){
  var html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span>'+
      '<span class="txt">'+NAV[i].t+'</span><span class="idx">'+i+'</span></button>';
  }
  var nav=el("nav");nav.innerHTML=html;
  nav.addEventListener("click",function(e){
    var t=e.target.closest("[data-i]");if(!t)return;
    show(+t.getAttribute("data-i"));
    try{window.scrollTo(0,0);}catch(err){}
  });
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
