<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合約續約管理 Contract Renewal Management｜Jvision 系統 Demo</title>
<meta name="description" content="合約到期預警、續約談判追蹤、條款價格比對、內部核准與電子簽署歸檔的一站式續約管理平台">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --paper:#FFFFFF;
  --grid:rgba(37,99,235,.075);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  line-height:1;
  letter-spacing:normal;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
  display:flex;
  flex-direction:column;
  padding:20px 16px;
  color:#fff;
  background:#0F172A;
  border-right:4px solid var(--blue);
}
.brand{
  display:grid;
  grid-template-columns:52px 1fr;
  align-items:center;
  gap:12px;
  padding:0 0 20px;
  margin-bottom:18px;
  border-bottom:2px solid #334155;
}
.logo{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid #fff;
}
.logo .material-symbols-outlined{font-size:28px}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:.03em}
.brand small{
  display:block;
  margin-top:3px;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-transform:uppercase;
}
.nav{display:grid;gap:8px}
.nav button{
  position:relative;
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 24px;
  align-items:center;
  gap:9px;
  width:100%;
  min-height:48px;
  padding:10px 11px;
  border:2px solid transparent;
  border-radius:0;
  background:transparent;
  color:#CBD5E1;
  text-align:left;
  font-size:13px;
  font-weight:700;
  transition:background-color .18s,color .18s,border-color .18s;
}
.nav button:hover{color:#fff;border-color:#64748B;background:#1E293B}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:#fff;
  transform:translateX(5px);
}
.nav button.on::before{
  content:"";
  position:absolute;
  left:-12px;
  width:6px;
  height:100%;
  background:#34D399;
}
.nav .material-symbols-outlined{font-size:21px}
.idx{
  color:inherit;
  opacity:.72;
  text-align:right;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.foot{
  margin-top:auto;
  padding:16px 4px 0;
  border-top:2px solid #334155;
  color:#CBD5E1;
  font-size:11px;
  line-height:1.7;
}
.foot b{color:#fff}
.mono{font-family:"Fira Code",monospace}
.main{min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:88px;
  padding:14px 28px;
  background:rgba(248,250,252,.96);
  border-bottom:3px solid var(--ink);
}
.top::after{
  content:"";
  position:absolute;
  bottom:-3px;
  right:0;
  width:24%;
  height:3px;
  background:var(--color-accent);
}
.top h1{
  margin:0;
  font-size:clamp(19px,2vw,28px);
  font-weight:800;
  line-height:1.1;
  letter-spacing:-.035em;
}
.top .sub{margin-top:5px;color:var(--muted);font-size:12px}
.grow{flex:1}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 10px;
  border:2px solid var(--ink);
  background:#fff;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.chip:first-of-type{background:#D1FAE5}
.chip .material-symbols-outlined{font-size:17px}
.dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid #fff;
  outline:1px solid var(--ok);
}
.wrap{padding:28px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.col-2a{grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr)}
.col-2b{grid-template-columns:minmax(300px,.8fr) minmax(0,1.55fr)}
.card,.kpi{
  min-width:0;
  background:var(--paper);
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--line);
}
.card{padding:18px}
.card.pad0{padding:0;overflow:hidden}
.ct{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 16px;
  padding-bottom:11px;
  border-bottom:2px solid var(--ink);
  font-size:14px;
  font-weight:800;
}
.ct .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  color:#fff;
  background:var(--blue);
  font-size:19px;
}
.ct .tag{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  text-align:right;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 17px 15px;
}
.kpi::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:30px;
  height:30px;
  border-left:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
  background:var(--stripe,var(--blue));
}
.kpi .bar{position:absolute;left:0;top:0;width:7px;height:100%}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  padding-right:24px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--ink)}
.kpi .val{
  margin-top:10px;
  font-family:"Fira Code",monospace;
  font-size:clamp(24px,3vw,32px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.06em;
  overflow-wrap:anywhere;
}
.kpi .val small{
  margin-left:5px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:0;
}
.kpi .dt{margin-top:9px;font-size:11px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}.wn{color:var(--warn)}
.scroll{width:100%;overflow:auto;border:2px solid var(--ink)}
table{
  width:100%;
  min-width:590px;
  border-collapse:collapse;
  background:#fff;
  font-size:12.5px;
}
th,td{
  padding:12px 13px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
th{
  background:var(--ink);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.03em;
  text-transform:none;
}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#EFF6FF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono,td[style*="font-weight:700"]{font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:800;
  line-height:1.1;
}
.badge::before{content:"";width:6px;height:6px;background:currentColor}
.b-ok{background:#D1FAE5;color:#065F46}
.b-warn{background:#FEF3C7;color:#92400E}
.b-bad{background:#FEE2E2;color:#991B1B}
.b-info{background:#DBEAFE;color:#1E40AF}
.b-mut{background:#E2E8F0;color:#334155}
.mini{color:var(--muted);font-size:11.5px;line-height:1.55}
.hr{height:2px;margin:14px 0;background:var(--ink)}
.chart{width:100%;overflow:hidden}
.cal{
  display:grid;
  grid-template-columns:repeat(7,minmax(58px,1fr));
  gap:0;
  border-top:2px solid var(--ink);
  border-left:2px solid var(--ink);
  overflow:auto;
}
.cal .dow{
  padding:8px 4px;
  background:var(--ink);
  color:#fff;
  border-right:1px solid #475569;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  text-align:center;
}
.cal .cell{
  min-height:78px;
  padding:7px;
  background:#fff;
  border-right:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
  font-size:12px;
}
.cal .cell.mut{background:#F1F5F9;color:#94A3B8}
.cal .d{display:block;font-family:"Fira Code",monospace;font-weight:700}
.cal .ev{
  display:block;
  margin-top:7px;
  padding:3px 5px;
  border:1px solid currentColor;
  font-size:9.5px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ev.r{background:#FEE2E2;color:#991B1B}
.ev.o{background:#FEF3C7;color:#92400E}
.ev.b{background:#DBEAFE;color:#1E40AF}
.ev.g{background:#D1FAE5;color:#065F46}
.alert{
  display:flex;
  align-items:flex-start;
  gap:11px;
  margin-bottom:10px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
}
.alert:last-child{margin-bottom:0}
.alert .ic{
  display:grid;
  place-items:center;
  flex:none;
  width:36px;
  height:36px;
  color:#fff;
  border:2px solid var(--ink);
}
.alert .ic .material-symbols-outlined{font-size:19px}
.alert b{font-size:12.5px}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(200px,1fr));
  gap:12px;
  min-width:860px;
}
.lane{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.lane .top-bd{height:7px;margin:-10px -10px 10px;border-bottom:2px solid var(--ink)}
.lane h4{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0 0 10px;
  font-size:12px;
  text-transform:uppercase;
}
.lane h4 .n{
  margin-left:auto;
  padding:2px 7px;
  background:#fff;
  border:1px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid var(--ink);
}
.tk:last-child{margin-bottom:0}
.tk b{display:block;font-size:12.5px}
.tk .row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.tk .av{
  display:grid;
  place-items:center;
  flex:none;
  width:24px;
  height:24px;
  background:var(--blue);
  color:#fff;
  border:1px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.tk .amt{
  margin-left:auto;
  color:#1E40AF;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.diff td.old{background:#FFF1F2;color:#9F1239;text-decoration:line-through}
.diff td.new{background:#ECFDF5;color:#065F46;font-weight:700}
.diff .rk{font-weight:800}
.steps{position:relative}
.step{display:flex;gap:12px}
.step .rail{display:flex;flex-direction:column;align-items:center;flex:none}
.step .node{
  display:grid;
  place-items:center;
  flex:none;
  width:34px;
  height:34px;
  color:#fff;
  border:2px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
}
.step .line{width:3px;flex:1;background:var(--ink)}
.step:last-child .line{display:none}
.step .body{
  flex:1;
  min-width:0;
  margin-bottom:12px;
  padding:12px;
  background:#fff;
  border:2px solid var(--ink);
}
.step .body .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .body b{font-size:13px}
.sig{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:10px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
}
.sig:last-child{margin-bottom:0}
.sig .qr{
  display:grid;
  place-items:center;
  flex:none;
  width:46px;
  height:46px;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
}
.sig .qr .material-symbols-outlined{font-size:26px}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1120px){
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{align-items:flex-start}
  .chip{display:none}
}
@media(max-width:860px){
  .shell{display:block}
  .side{position:static;width:100%;height:auto;padding:12px}
  .brand{grid-template-columns:42px 1fr;margin:0 0 10px;padding:0 0 10px}
  .logo{width:42px;height:42px}
  .nav{grid-template-columns:repeat(6,1fr);gap:5px}
  .nav button{
    display:flex;
    justify-content:center;
    min-height:44px;
    padding:8px;
    border-color:#475569;
  }
  .nav button.on{transform:none}
  .nav button.on::before{display:none}
  .nav .txt,.nav .idx{display:none}
  .foot{display:none}
  .top{position:relative;min-height:auto;padding:16px 18px}
  .wrap{padding:18px}
  .col-2a,.col-2b,.k2,.k3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .k4{grid-template-columns:1fr}
  .wrap{padding:12px}
  .top{padding:14px 12px}
  .top h1{font-size:20px}
  .top .sub{font-size:11px}
  .card{padding:13px}
  .card,.kpi{box-shadow:4px 4px 0 var(--line)}
  .ct{align-items:flex-start}
  .ct .tag{max-width:45%}
  .cal{grid-template-columns:repeat(7,minmax(48px,1fr))}
  .cal .cell{min-height:70px;padding:5px}
  .sig{align-items:flex-start;flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  .reveal{animation:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">verified</span></div>
      <div><b>續約管理中樞</b><small>Contract Renewal</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot">
      <b>合約續約管理平台</b><br>
      到期預警 · 談判追蹤 · 條款比對<br>
      內部簽核 · 電子簽署歸檔<br>
      <span class="mono">Demo 假資料 · zh-Hant</span>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="tt">到期日曆與預警</h1>
        <div class="sub" id="st">偵測即將到期合約，依剩餘天數分級發出預警</div>
      </div>
      <div class="grow"></div>
      <span class="chip"><span class="dot" aria-hidden="true"></span>2026 上半年度</span>
      <span class="chip"><span class="material-symbols-outlined" aria-hidden="true">groups</span>業務部 · 法務部</span>
    </header>
    <main class="wrap"><div id="view" aria-live="polite"></div></main>
  </div>
</div>
<script>
"use strict";
var NAV=[
{ic:"calendar_month",t:"到期日曆與預警",s:"偵測即將到期合約，依剩餘天數分級發出預警"},
{ic:"account_tree",t:"續約談判追蹤",s:"續約進度看板，逐階段推進談判狀態"},
{ic:"history",t:"條款價格比對",s:"新舊版合約條款與價格差異，標記風險"},
{ic:"fact_check",t:"內部核准簽核",s:"續約條件內部審批流，逐關核准放行"},
{ic:"verified",t:"電子簽署歸檔",s:"簽署狀態追蹤與合約主檔更新"},
{ic:"insights",t:"續約成效分析",s:"續約率、預警達成率與續約金額趨勢"}
];
var CONTRACTS=[
{no:"CT-2401",cust:"O鼎精密工業",owner:"陳彥廷",amt:480,end:"07-18",days:4,tier:"紅"},
{no:"CT-2388",cust:"O達雲端服務",owner:"林思妤",amt:1260,end:"07-22",days:8,tier:"紅"},
{no:"CT-2415",cust:"聯O食品物流",owner:"黃柏勳",amt:320,end:"07-28",days:14,tier:"橙"},
{no:"CT-2377",cust:"O曜紡織集團",owner:"陳彥廷",amt:760,end:"08-05",days:22,tier:"橙"},
{no:"CT-2402",cust:"O耀化學",owner:"吳孟軒",amt:540,end:"08-14",days:31,tier:"藍"}
];
function el(id){return document.getElementById(id)}
function fmt(n){return Number(n).toLocaleString("zh-TW")}
function tierBadge(t){var m={"紅":"b-bad","橙":"b-warn","藍":"b-info","綠":"b-ok"};return '<span class="badge '+(m[t]||"b-mut")+'">'+t+'級</span>'}
function riskBadge(r){var m={"高":"b-bad","中":"b-warn","低":"b-ok"};return '<span class="badge '+(m[r]||"b-mut")+'">'+r+'風險</span>'}
function kpi(bar,lab,icn,val,unit,dt,cls){
return '<div class="kpi" style="--stripe:'+bar+'"><span class="bar" style="background:'+bar+'"></span><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+icn+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dt '+(cls||"")+'">'+dt+'</div></div>'

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],5):0);window.scrollTo(0,0)}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
fromHash();
</script>
</body>
