<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自動化立體倉庫管理系統（AS/RS）</title>
<meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0891b2; --accent2:#22d3ee; --ink:#0f172a; --sub:#64748b;
  --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#083344,#0891b2);
  color:#fff;box-shadow:0 2px 14px rgba(8,51,68,.25);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#e0f7ff;}
.brand h1{font-size:15px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand p{font-size:11px;margin:2px 0 0;color:#bae6fd;white-space:nowrap;}
.livechip{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap;}
.dot{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.3);}
nav.tabs{max-width:1360px;margin:0 auto;padding:0 10px;display:flex;gap:4px;flex-wrap:wrap;}
.tab{
  border:0;background:transparent;color:#cffafe;font-family:inherit;cursor:pointer;
  padding:11px 13px;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.15s;min-width:0;
}
.tab .material-symbols-outlined{font-size:19px;}
.tab:hover{background:rgba(255,255,255,.12);}
.tab.on{background:var(--bg);color:var(--accent);font-weight:700;}
main{max-width:1360px;margin:0 auto;padding:18px 16px 60px;}
.scr-head{margin:2px 0 16px;}
.scr-head h2{font-size:19px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scr-head h2 .material-symbols-outlined{color:var(--accent);font-size:24px;}
.scr-head p{margin:0;color:var(--sub);font-size:13px;}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:2fr 1fr;}
.g2e{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g2,.g2e,.g3{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .kv{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px;}
.kpi .kd{font-size:11.5px;color:var(--sub);}
.kpi .kd b{color:var(--ok);}
.kpi .kd.dn b{color:var(--bad);}
.chartbox{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--sub);font-weight:600;font-size:11.5px;background:#f8fafc;}
tbody tr:hover{background:#f8fafc;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.p-ok{background:#dcfce7;color:#166534;}
.p-warn{background:#fef3c7;color:#92400e;}
.p-bad{background:#fee2e2;color:#991b1b;}
.p-run{background:#cffafe;color:#155e75;}
.p-idle{background:#e2e8f0;color:#475569;}
.bar{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:820px){.kanban{grid-template-columns:1fr;}}
.kcol{background:#eef6f9;border:1px solid #d6ebf1;border-radius:12px;padding:10px;min-width:0;}
.kcol h4{margin:0 0 10px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between;color:#0e5a6b;}
.kcount{background:#0891b2;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700;}
.kcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:9px;}
.kcard .kt{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.kcard .km{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;}
.kcard .km span{display:inline-flex;align-items:center;gap:3px;}
.kcard .km .material-symbols-outlined{font-size:14px;color:var(--accent);}
.tagio{font-size:10px;font-weight:800;padding:1px 7px;border-radius:6px;}
.tag-in{background:#dcfce7;color:#166534;}
.tag-out{background:#ffedd5;color:#9a3412;}
.racklegend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:12px;color:var(--sub);}
.racklegend span{display:inline-flex;align-items:center;gap:6px;}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;}
.rackwrap{overflow-x:auto;}
.rack{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;min-width:520px;}
.rack .rlabel{font-size:11px;font-weight:700;color:#0e5a6b;white-space:nowrap;}
.rrow{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;}
.cell{aspect-ratio:1/1;border-radius:4px;background:#e2e8f0;position:relative;}
.cell.occ{background:linear-gradient(135deg,#0891b2,#22d3ee);}
.cell.rsv{background:#fbbf24;}
.cell.blk{background:#f87171;}
.cell.pick{background:#a3e635;box-shadow:0 0 0 2px #65a30d;}
.aisle{display:flex;flex-direction:column;gap:10px;}
.aline{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;}
@media(max-width:560px){.aline{grid-template-columns:1fr;}}
.aline .an{font-weight:800;font-size:13px;display:flex;align-items:center;gap:7px;color:#0e5a6b;min-width:0;}
.aline .an .material-symbols-outlined{color:var(--accent);font-size:20px;}
.track{position:relative;height:26px;background:#e2e8f0;border-radius:8px;overflow:hidden;min-width:0;}
.track>i{position:absolute;top:0;bottom:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#083344;}
.crane{background:linear-gradient(90deg,#0891b2,#22d3ee);color:#fff;}
.crane2{background:#fbbf24;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;margin-bottom:14px;}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent);}
.tli .tt{font-size:13px;font-weight:700;}
.tli .td{font-size:11.5px;color:var(--sub);margin-top:2px;}
.tli .ttime{font-size:11px;color:var(--accent);font-weight:700;}
.small{font-size:11.5px;color:var(--sub);}
.flowbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.flowbar .fstep{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.flowbar .fstep .material-symbols-outlined{font-size:16px;}
@media(max-width:560px){
  .tab span.txt{display:none;}
  .tab{padding:11px;}
  .brand p{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">warehouse</span></div>
      <div>
        <h1>自動化立體倉庫管理系統</h1>
        <p>AS/RS Management System · 出入庫排程與設備調度</p>
      </div>
    </div>
    <div class="livechip"><span class="dot"></span>即時連線 · WCS / MES</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>

<script>
(function(){
  "use strict";
  var accent="#0891b2", accent2="#22d3ee", grid="#e2e8f0";
  var charts={};

  var NAV=[
    {icon:"receipt_long",t:"指令排程"},
    {icon:"account_tree",t:"堆垛機調度"},
    {icon:"grid_view",t:"儲位視覺化"},
    {icon:"monitoring",t:"設備稼動"},
    {icon:"inventory_2",t:"料箱庫存"},
    {icon:"trending_up",t:"效率分析"}
  ];

  var kanban={
    queued:[
      {id:"WO-4821",type:"IN",sku:"CB-塑膠殼A",qty:120,aisle:"A1",pri:"高",who:"林倉管"},
      {id:"WO-4826",type:"OUT",sku:"MB-主板R3",qty:48,aisle:"C2",pri:"中",who:"陳倉管"},
      {id:"WO-4830",type:"IN",sku:"PK-包材箱",qty:200,aisle:"B3",pri:"低",who:"林倉管"}
    ],
    dispatch:[
      {id:"WO-4818",type:"OUT",sku:"CN-連接器",qty:64,aisle:"A2",pri:"高",who:"王調度"},
      {id:"WO-4820",type:"IN",sku:"SC-散熱片",qty:90,aisle:"D1",pri:"中",who:"王調度"}
    ],
    running:[
      {id:"WO-4812",type:"OUT",sku:"MB-主板R2",qty:36,aisle:"C1",pri:"高",who:"堆垛機#3"},
      {id:"WO-4815",type:"IN",sku:"CB-塑膠殼B",qty:150,aisle:"B1",pri:"中",who:"堆垛機#1"},
      {id:"WO-4816",type:"OUT",sku:"PK-緩衝材",qty:24,aisle:"A3",pri:"低",who:"堆垛機#2"}
    ],
    done:[
      {id:"WO-4805",type:"OUT",sku:"CN-排線",qty:80,aisle:"C3",pri:"中",who:"已交付產線"},
      {id:"WO-4808",type:"IN",sku:"SC-風扇模組",qty:60,aisle:"D2",pri:"高",who:"已上架"}
    ]
  };

  var aisles=[
    {n:"巷道A · SRM#1",pos:64,w:18,task:"取箱 A-12-07",st:"running"},
    {n:"巷道B · SRM#2",pos:30,w:16,task:"放箱 B-04-03",st:"running"},
    {n:"巷道C · SRM#3",pos:82,w:14,task:"取箱 C-09-11",st:"running"},
    {n:"巷道D · SRM#4",pos:0,w:12,task:"待命",st:"idle"}
  ];

  var equip=[
    {name:"堆垛機 SRM#1",type:"Stacker",util:92,st:"running",temp:"41°C",alarm:"—"},
    {name:"堆垛機 SRM#2",type:"Stacker",util:88,st:"running",temp:"39°C",alarm:"—"},
    {name:"堆垛機 SRM#3",type:"Stacker",util:95,st:"running",temp:"44°C",alarm:"—"},
    {name:"堆垛機 SRM#4",type:"Stacker",util:0,st:"idle",temp:"32°C",alarm:"—"},
    {name:"入庫輸送線 CV-IN",type:"Conveyor",util:76,st:"running",temp:"35°C",alarm:"—"},
    {name:"出庫輸送線 CV-OUT",type:"Conveyor",util:81,st:"running",temp:"36°C",alarm:"—"},
    {name:"垂直提升機 VLM-1",type:"Lift",util:58,st:"warn",temp:"48°C",alarm:"軸承溫升偏高"}
  ];

  var stock=[
    {sku:"MB-主板R3",name:"主板 Rev.3",lot:"L2608A",qty:428,safe:200,exp:"2027-02",loc:"C2-07-04",st:"ok"},
    {sku:"CB-塑膠殼A",name:"塑膠外殼 A",lot:"L2607C",qty:96,safe:150,exp:"2028-05",loc:"A1-03-09",st:"low"},
    {sku:"CN-連接器",name:"連接器組",lot:"L2606B",qty:1240,safe:400,exp:"2029-01",loc:"A2-11-02",st:"ok"},
    {sku:"SC-散熱片",name:"鋁擠散熱片",lot:"L2605D",qty:312,safe:250,exp:"2026-09",loc:"D1-06-08",st:"exp"},
    {sku:"PK-包材箱",name:"出貨紙箱",lot:"L2608E",qty:58,safe:120,exp:"—",loc:"B3-02-01",st:"low"},
    {sku:"MB-主板R2",name:"主板 Rev.2",lot:"L2604F",qty:180,safe:100,exp:"2026-08",loc:"C1-08-05",st:"exp"}
  ];

  function esc(s){return String(s);}
  function ioTag(t){return t==="IN"?'<span class="tagio tag-in">入庫</span>':'<span class="tagio tag-out">出庫</span>';}
  function priPill(p){var c=p==="高"?"p-bad":p==="中"?"p-warn":"p-idle";return '<span class="pill '+c+'">'+p+'</span>';}

  function kcard(x){
    return '<div class="kcard"><div class="kt">'+esc(x.id)+ioTag(x.type)+'</div>'+
      '<div class="km"><span><span class="material-symbols-outlined">inventory_2</span>'+esc(x.sku)+'</span>'+
      '<span><span class="material-symbols-outlined">tag</span>'+esc(x.qty)+' 箱</span>'+
      '<span><span class="material-symbols-outlined">conveyor_belt</span>'+esc(x.aisle)+'</span></div>'+
      '<div class="km"><span>'+priPill(x.pri)+'</span><span>'+esc(x.who)+'</span></div></div>';
  }
  function kcol(title,icon,arr){
    var h='<div class="kcol"><h4><span><span class="material-symbols-outlined" style="font-size:16px;color:#0891b2">'+icon+'</span> '+title+'</span><span class="kcount">'+arr.length+'</span></h4>';
    for(var i=0;i<arr.length;i++)h+=kcard(arr[i]);
    return h+'</div>';
  }

  function stChip(s){
    if(s==="running")return '<span class="pill p-run">運行中</span>';
    if(s==="warn")return '<span class="pill p-warn">告警</span>';
    if(s==="idle")return '<span class="pill p-idle">待命</span>';
    return '<span class="pill p-ok">正常</span>';
  }
  function stockPill(s){
    if(s==="low")return '<span class="pill p-bad">低於安全</span>';
    if(s==="exp")return '<span class="pill p-warn">效期將到</span>';
    return '<span class="pill p-ok">正常</span>';
  }

  function kpi(icon,label,val,desc,dir,note,dn){
    var cls=dn?"kd dn":"kd";
    var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px;color:'+(dn?"#dc2626":"#16a34a")+'">trending_up</span>':"";
    return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'+
      '<div class="kv">'+val+'</div><div class="'+cls+'">'+arrow+' '+desc+(note?' · <b>'+note+'</b>':"")+'</div></div>';
  }
  function tli(time,t,d){return '<div class="tli"><div class="ttime">'+time+'</div><div class="tt">'+t+'</div><div class="td">'+d+'</div></div>';}

  function s0(){
    var flow='<div class="flowbar">'+
      '<div class="fstep"><span class="material-symbols-outlined">receipt_long</span>指令接收排程</div>'+
      '<div class="fstep"><span class="material-symbols-outlined">account_tree</span>堆垛機調度派工</div>'+
      '<div class="fstep"><span class="material-symbols-outlined">precision_manufacturing</span>料箱存取執行</div>'+
      '<div class="fstep"><span class="material-symbols-outlined">task_alt</span>庫存核對交付</div></div>';
    return ''+
    '<div class="scr-head"><h2><span class="material-symbols-outlined">receipt_long</span>出入庫指令排程</h2>'+
    '<p>入出庫任務看板 — 依優先序與巷道負載派工，即時追蹤每張作業單狀態</p></div>'+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("today","今日出入庫指令","326","入庫 148 · 出庫 178","up","本班達成 82%")+
      kpi("bolt","佇列待排","8","高優先 3 張","","平均等待 4.2 分")+
      kpi("timer","平均作業節拍","38 秒","單箱取放週期","up","較昨降 3 秒")+
      kpi("verified","指令準時率","97.4%","近 4 小時","up","目標 95%")+
    '</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>出入庫作業看板</h3>'+
    '<div class="kanban">'+
      kcol("待排程","inbox",kanban.queued)+
      kcol("調度派工","account_tree",kanban.dispatch)+
      kcol("執行中","precision_manufacturing",kanban.running)+
      kcol("已完成","task_alt",kanban.done)+
    '</div>'+flow+'</div>';
  }

  function s1(){
    var rows="";
    for(var i=0;i<aisles.length;i++){
      var a=aisles[i];
      rows+='<div class="aline"><div class="an"><span class="material-symbols-outlined">precision_manufacturing</span>'+esc(a.n)+'</div>'+
        '<div class="track"><i class="'+(a.st==="idle"?"crane2":"crane")+'" style="left:'+a.pos+'%;width:'+a.w+'%">'+(a.st==="idle"?"待命":"作業")+'</i></div>'+
        '<div class="small">'+esc(a.task)+' · '+stChip(a.st)+'</div></div>';
    }
    var tl='<div class="tl">'+
      tli("09:12","任務 WO-4812 派工 SRM#3","出庫 C1-08-05 · 主板 R2 ×36")+
      tli("09:14","SRM#1 取箱 A-12-07","入庫緩存 → 上架，路徑避讓 SRM#2")+
      tli("09:15","VLM-1 提升機告警","軸承溫升偏高，降速運行維持吞吐")+
      tli("09:17","WO-4818 出庫覆核","批號比對通過，交付出庫輸送線")+
      '</div>';
    return ''+
    '<div class="scr-head"><h2><span class="material-symbols-outlined">account_tree</span>堆垛機調度</h2>'+
    '<p>各巷道堆垛機（SRM）任務分派、路徑與避讓 — 對接 WCS 下達動作指令</p></div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">conveyor_belt</span>巷道即時位置與任務</h3><div class="aisle">'+rows+'</div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">history</span>調度事件時間軸</h3>'+tl+'</div>'+
    '</div>'+
    '<div class="grid g2e" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各巷道任務量（今日）</h3><div class="chartbox" style="height:240px"><canvas id="c1a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">speed</span>堆垛機稼動率</h3><div class="chartbox" style="height:240px"><canvas id="c1b"></canvas></div></div>'+
    '</div>';
  }

  function s2(){
    var rowsL=["A","B","C","D"], html="";
    var patterns=[
      "occ occ rsv occ . occ occ . occ blk occ occ rsv . occ occ",
      ". occ occ occ occ . occ occ pick occ . occ occ occ . occ",
      "occ occ . occ occ occ blk occ occ occ occ . occ occ occ .",
      "occ . occ occ . occ occ occ . occ occ rsv occ occ occ occ"
    ];
    for(var r=0;r<rowsL.length;r++){
      var cells=patterns[r].split(" "), cell="";
      for(var c=0;c<16;c++){
        var cls=cells[c]==="."?"":cells[c];
        cell+='<div class="cell '+cls+'"></div>';
      }
      html+='<div class="rlabel">排 '+rowsL[r]+'</div><div class="rrow">'+cell+'</div>';
    }
    return ''+
    '<div class="scr-head"><h2><span class="material-symbols-outlined">grid_view</span>貨格儲位視覺化</h2>'+
    '<p>立體貨架占用地圖 — 4 排 × 16 列 × 多層，儲位分配與庫容一目了然</p></div>'+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("inventory_2","總貨格數","8,192","雙深巷道貨位","","4 巷道 × 32 層")+
      kpi("pie_chart","儲位占用率","78.6%","+2.1% 本週","up","健康區間")+
      kpi("lock","保留儲位","214","出庫單占用","","不可重複分配")+
      kpi("block","封鎖貨格","36","待維修/盤差","","已標記處理","dn")+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">warehouse</span>立體貨架占用地圖</h3>'+
        '<div class="racklegend">'+
          '<span><i class="swatch" style="background:linear-gradient(135deg,#0891b2,#22d3ee)"></i>已占用</span>'+
          '<span><i class="swatch" style="background:#e2e8f0"></i>空位</span>'+
          '<span><i class="swatch" style="background:#fbbf24"></i>保留</span>'+
          '<span><i class="swatch" style="background:#f87171"></i>封鎖</span>'+
          '<span><i class="swatch" style="background:#a3e635"></i>待揀</span>'+
        '</div>'+
        '<div class="rackwrap"><div class="rack">'+html+'</div></div>'+
      '</div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>各排庫容分佈</h3><div class="chartbox" style="height:260px"><canvas id="c2a"></canvas></div></div>'+
    '</div>';
  }

  function s3(){
    var rows="";
    for(var i=0;i<equip.length;i++){
      var e=equip[i];
      rows+='<tr><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.type)+'</td><td>'+stChip(e.st)+'</td>'+
        '<td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+e.util+'%"></i></div><span class="small">'+e.util+'%</span></div></td>'+
        '<td>'+esc(e.temp)+'</td><td>'+(e.alarm==="—"?'<span class="small">—</span>':'<span class="pill p-warn">'+esc(e.alarm)+'</span>')+'</td></tr>';
    }
    return ''+
    '<div class="scr-head"><h2><span class="material-symbols-outlined">monitoring</span>設備稼動監控</h2>'+
    '<p>堆垛機、輸送線、提升機即時狀態與稼動率 — 設備工程部監看吞吐節拍</p></div>'+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("bolt","整體稼動率 OEE","89.3%","近 8 小時","up","目標 85%")+
      kpi("package_2","今日吞吐量","5,140","料箱存取次數","up","+6.4% 對比昨日")+
      kpi("warning","設備告警","1","VLM-1 溫升","","已降速維持運轉","dn")+
      kpi("bolt","能耗","312 kWh","本班累計","","單箱 0.06 kWh")+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>吞吐量與稼動率趨勢（今日）</h3><div class="chartbox" style="height:260px"><canvas id="c3a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">bolt</span>設備狀態一覽</h3><div style="overflow-x:auto"><table><thead><tr><th>設備</th><th>類型</th><th>狀態</th><th>稼動率</th><th>溫度</th><th>告警</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '</div>';
  }

  function s4(){
    var rows="";
    for(var i=0;i<stock.length;i++){
      var s=stock[i];
      rows+='<tr><td><b>'+esc(s.sku)+'</b><div class="small">'+esc(s.name)+'</div></td><td>'+esc(s.lot)+'</td>'+
        '<td>'+esc(s.qty)+'</td><td class="small">'+esc(s.safe)+'</td><td>'+esc(s.exp)+'</td><td>'+esc(s.loc)+'</td><td>'+stockPill(s.st)+'</td></tr>';
    }
    return ''+
    '<div class="scr-head"><h2><span class="material-symbols-outlined">inventory_2</span>料箱庫存管理</h2>'+
    '<p>料箱/棧板庫存、批號效期與帳實盤點 — 出庫前覆核一致性後交付產線</p></div>'+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("inventory","庫存料號","1,286","活躍 SKU","","涵蓋 6 大類")+
      kpi("fact_check","庫存準確率","99.1%","循環盤點","up","帳實一致")+
      kpi("notification_important","低於安全庫存","2","需補貨","","已列補貨清單","dn")+
      kpi("schedule","批號將到期","2","30 日內","","先進先出提示","dn")+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>庫存明細（含批號 / 儲位）</h3><div style="overflow-x:auto"><table><thead><tr><th>料號 / 品名</th><th>批號</th><th>可用量</th><th>安全庫存</th><th>效期</th><th>儲位</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>庫存狀態分佈</h3><div class="chartbox" style="height:260px"><canvas id="c4a"></canvas></div></div>'+
    '</div>';
  }

  function s5(){
    return ''+
    '<div class="scr-head"><h2><span class="material-symbols-outlined">trending_up</span>作業效率分析</h2>'+
    '<p>出入庫節拍、吞吐量與稼動率趨勢儀表 — 追蹤導入成效與瓶頸巷道</p></div>'+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("timer","平均出庫節拍","38 秒","單箱","up","導入前 71 秒")+
      kpi("local_shipping","出貨延遲率","1.9%","本月","up","導入前 9.2%")+
      kpi("fact_check","庫存準確率","99%","本月","up","導入前 88%")+
      kpi("schedule","盤點工時","2.9","小時/月","up","導入前 17 小時")+
    '</div>'+
    '<div class="grid g2e">'+
      '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>週吞吐量（入庫 vs 出庫）</h3><div class="chartbox" style="height:250px"><canvas id="c5a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>庫存準確率提升趨勢</h3><div class="chartbox" style="height:250px"><canvas id="c5b"></canvas></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">insights</span>各巷道平均取放節拍（秒）</h3><div class="chartbox" style="height:230px"><canvas id="c5c"></canvas></div></div>';
  }

  var SCR=[s0,s1,s2,s3,s4,s5];

  function mk(id,cfg){
    var el=document.getElementById(id);
    if(!el)return;
    if(charts[id]){try{charts[id].destroy();}catch(e){}charts[id]=null;}
    charts[id]=new Chart(el,cfg);
  }
  var baseOpt={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11}}}}};

  function drawCharts(i){
    if(i===1){
      mk("c1a",{type:"bar",data:{labels:["巷道A","巷道B","巷道C","巷道D"],datasets:[
        {label:"入庫",data:[68,52,74,41],backgroundColor:accent},
        {label:"出庫",data:[81,63,88,37],backgroundColor:accent2}]},
        options:Object.assign({},baseOpt,{scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:grid}}}})});
      mk("c1b",{type:"doughnut",data:{labels:["SRM#1","SRM#2","SRM#3","SRM#4(待命)"],datasets:[
        {data:[92,88,95,5],backgroundColor:["#0891b2","#22d3ee","#0e7490","#cbd5e1"]}]},
        options:Object.assign({cutout:"58%"},baseOpt)});
    }else if(i===2){
      mk("c2a",{type:"bar",data:{labels:["排A","排B","排C","排D"],datasets:[
        {label:"已占用",data:[1560,1420,1680,1330],backgroundColor:accent},
        {label:"空位",data:[488,628,368,718],backgroundColor:"#cbd5e1"}]},
        options:Object.assign({},baseOpt,{indexAxis:"y",scales:{x:{stacked:true,grid:{color:grid}},y:{stacked:true,grid:{display:false}}}})});
    }else if(i===3){
      mk("c3a",{type:"line",data:{labels:["08","10","12","14","16","18","20"],datasets:[
        {label:"吞吐量(箱)",data:[420,780,610,840,720,910,860],borderColor:accent,backgroundColor:"rgba(8,145,178,.12)",fill:true,tension:.35,yAxisID:"y"},
        {label:"稼動率 %",data:[82,90,85,93,88,91,89],borderColor:"#fbbf24",backgroundColor:"transparent",tension:.35,yAxisID:"y1"}]},
        options:Object.assign({},baseOpt,{scales:{y:{position:"left",grid:{color:grid}},y1:{position:"right",min:60,max:100,grid:{display:false}},x:{grid:{display:false}}}})});
    }else if(i===4){
      mk("c4a",{type:"doughnut",data:{labels:["正常","低於安全","效期將到"],datasets:[
        {data:[1282,2,2],backgroundColor:["#0891b2","#dc2626","#d97706"]}]},
        options:Object.assign({cutout:"60%"},baseOpt)});
    }else if(i===5){
      mk("c5a",{type:"bar",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[
        {label:"入庫",data:[3200,3400,3550,3700,3620,3900],backgroundColor:accent},
        {label:"出庫",data:[3050,3300,3480,3650,3700,3980],backgroundColor:accent2}]},
        options:Object.assign({},baseOpt,{scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:grid}}}})});
      mk("c5b",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[
        {label:"庫存準確率 %",data:[88,90,92,95,97,99],borderColor:accent,backgroundColor:"rgba(34,211,238,.15)",fill:true,tension:.35,pointRadius:4}]},
        options:Object.assign({},baseOpt,{scales:{y:{min:80,max:100,grid:{color:grid}},x:{grid:{display:false}}}})});
      mk("c5c",{type:"bar",data:{labels:["巷道A","巷道B","巷道C","巷道D"],datasets:[
        {label:"平均取放節拍(秒)",data:[36,42,34,39],backgroundColor:[accent,accent2,"#0e7490","#67e8f9"]}]},
        options:Object.assign({},baseOpt,{plugins:{legend:{display:false}},scales:{y:{grid:{color:grid}},x:{grid:{display:false}}}})});
    }
  }

  var appEl=document.getElementById("app");
  function show(i){
    var tabs=document.querySelectorAll("[data-i]");
    for(var k=0;k<tabs.length;k++)tabs[k].classList.toggle("on",+tabs[k].getAttribute("data-i")===i);
    appEl.innerHTML=SCR[i]();
    void appEl.offsetHeight;
    drawCharts(i);
  }

  var tabsEl=document.getElementById("tabs"), navHtml="";
  for(var j=0;j<NAV.length;j++){
    navHtml+='<button class="tab" data-i="'+j+'"><span class="material-symbols-outlined">'+NAV[j].icon+'</span><span class="txt">'+NAV[j].t+'</span></button>';
  }
  tabsEl.innerHTML=navHtml;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }

  window.show=show;
  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
  window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
</body>
</html>
