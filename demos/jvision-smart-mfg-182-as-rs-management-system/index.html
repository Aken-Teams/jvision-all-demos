<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自動化立體倉庫管理系統（AS/RS）</title>
<meta name="description" content="收貨到出貨的倉內作業與庫存精準管理">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --success:#047857;
  --warning:#a16207;
  --danger:#b91c1c;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  overflow-x:hidden;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Open Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
svg{display:block}
.icon{
  width:20px;height:20px;flex:0 0 auto;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(248,250,252,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.topbar-inner{
  max-width:1440px;margin:auto;padding:12px 24px;
  display:flex;align-items:center;gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;height:42px;border-radius:10px;
  display:grid;place-items:center;flex:0 0 auto;
  background:var(--color-primary);color:#fff;
}
.logo .icon{width:23px;height:23px}
.brand h1{
  margin:0;
  font:600 15px/1.3 "Poppins","Open Sans",sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}
.livechip{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  border:1px solid #a7f3d0;border-radius:999px;
  background:#ecfdf5;color:#065f46;padding:7px 11px;
  font-size:11px;font-weight:700;white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent)}
.tabs-shell{border-top:1px solid var(--line)}
.tabs{
  max-width:1440px;margin:auto;padding:0 24px;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;
}
.tab{
  min-height:48px;padding:0 14px;border:0;border-bottom:3px solid transparent;
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  background:transparent;color:var(--muted);
  font-size:12px;font-weight:700;
  transition:color .15s ease,background-color .15s ease,border-color .15s ease;
}
.tab:hover{background:var(--color-muted);color:var(--ink)}
.tab.on{border-bottom-color:var(--color-accent);color:#047857;background:#ecfdf5}
main{max-width:1440px;margin:auto;padding:26px 24px 64px}
.scr-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line);
}
.scr-head h2{
  margin:0 0 5px;display:flex;align-items:center;gap:10px;
  font:600 23px/1.25 "Poppins","Open Sans",sans-serif;
  letter-spacing:-.02em;
}
.scr-head h2 .icon{color:var(--color-accent);width:24px;height:24px}
.scr-head p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,2fr) minmax(320px,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.card,.kpi{
  min-width:0;background:var(--color-card);border:1px solid var(--line);
  border-radius:var(--radius);
}
.card{padding:18px}
.card h3{
  margin:0 0 15px;display:flex;align-items:center;gap:8px;
  font:600 14px/1.35 "Poppins","Open Sans",sans-serif;
}
.card h3 .icon,.kl .icon{color:var(--color-accent)}
.kpi{
  padding:17px 18px;border-top:3px solid var(--color-primary);
  transition:border-color .15s ease,background-color .15s ease;
}
.kpi:hover{border-top-color:var(--color-accent);background:#fcfffe}
.kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kl .icon{width:17px;height:17px}
.kv{
  margin:8px 0 3px;
  font:600 28px/1.15 "Poppins","Open Sans",sans-serif;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.kd{color:var(--muted);font-size:11.5px}
.kd b{color:var(--success)}
.kd.dn b{color:var(--danger)}
.chartbox{position:relative;width:100%;overflow:hidden}
.table-wrap,.rackwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{
  padding:11px 10px;border-bottom:1px solid var(--line);
  text-align:left;vertical-align:middle;white-space:nowrap;
}
th{
  background:var(--color-muted);color:var(--muted);
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
tbody tr{transition:background-color .15s ease}
tbody tr:hover{background:#f8fafc}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.mono,.code,td:first-child{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  min-height:24px;padding:3px 9px;border:1px solid transparent;border-radius:999px;
  font-size:10.5px;font-weight:700;white-space:nowrap;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.p-warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.p-bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.p-run{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.p-idle{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:99px;background:#e2e8f0}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--color-accent)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kcol{min-width:0;padding:11px;background:#f8fafc;border:1px solid var(--line);border-radius:10px}
.kcol h4{
  margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;
  color:var(--color-primary);font:600 12px/1.3 "Poppins","Open Sans",sans-serif;
}
.kcol-title{display:flex;align-items:center;gap:6px}
.kcol-title .icon{width:16px;height:16px;color:var(--color-accent)}
.kcount{
  min-width:24px;padding:2px 7px;border-radius:999px;text-align:center;
  background:var(--color-primary);color:#fff;font-size:10px;
}
.kcard{
  margin-bottom:8px;padding:11px;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--color-accent);
  border-radius:8px;transition:border-color .15s ease,background-color .15s ease;
}
.kcard:last-child{margin-bottom:0}
.kcard:hover{border-color:#a7f3d0;background:#fcfffe}
.kt{display:flex;align-items:center;justify-content:space-between;gap:7px;font-weight:700}
.km{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:11px}
.km span{display:inline-flex;align-items:center;gap:4px}
.km .icon{width:13px;height:13px;color:var(--color-accent)}
.tagio{padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:700}
.tag-in{background:#d1fae5;color:#065f46}
.tag-out{background:#ffedd5;color:#9a3412}
.flowbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.fstep{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  border:1px solid #a7f3d0;border-radius:7px;background:#ecfdf5;
  color:#065f46;font-size:11px;font-weight:700;
}
.fstep .icon{width:15px;height:15px}
.aisle{display:flex;flex-direction:column;gap:9px}
.aline{
  display:grid;grid-template-columns:145px minmax(160px,1fr) auto;
  gap:12px;align-items:center;padding:11px;border:1px solid var(--line);
  border-radius:9px;background:#fafafa;
}
.an{display:flex;align-items:center;gap:7px;color:var(--color-primary);font-size:12px;font-weight:700}
.an .icon{width:18px;height:18px;color:var(--color-accent)}
.track{position:relative;height:28px;overflow:hidden;border-radius:6px;background:#e2e8f0}
.track i{
  position:absolute;top:0;bottom:0;display:grid;place-items:center;
  min-width:42px;border-radius:5px;color:#fff;font-size:9px;font-style:normal;font-weight:700;
}
.crane{background:var(--color-accent)}
.crane2{background:#b45309}
.small{color:var(--muted);font-size:11px}
.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:16px}
.tli:last-child{margin-bottom:0}
.tli::before{
  content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--color-accent);border:3px solid #d1fae5;
}
.ttime{color:#047857;font:700 10.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.tt{font-size:12.5px;font-weight:700}
.td{margin-top:2px;color:var(--muted);font-size:11px}
.racklegend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;color:var(--muted);font-size:11px}
.racklegend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:13px;height:13px;border:1px solid rgba(15,23,42,.12);border-radius:3px}
.rack{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;min-width:560px}
.rlabel{color:var(--color-primary);font-size:11px;font-weight:700}
.rrow{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.cell{aspect-ratio:1;border:1px solid #cbd5e1;border-radius:3px;background:#e2e8f0}
.cell.occ{border-color:#047857;background:var(--color-accent)}
.cell.rsv{border-color:#b45309;background:#fbbf24}
.cell.blk{border-color:#991b1b;background:#ef4444}
.cell.pick{border:2px solid #365314;background:#84cc16}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .topbar-inner{padding:10px 16px}
  .tabs{padding:0 16px}
  main{padding:20px 16px 48px}
  .brand p{display:none}
  .livechip{padding:6px 9px}
  .scr-head{align-items:flex-start}
  .scr-head h2{font-size:20px}
  .g2e{grid-template-columns:1fr}
  .aline{grid-template-columns:1fr}
}
@media(max-width:480px){
  .topbar-inner{gap:10px}
  .brand h1{font-size:13px}
  .logo{width:38px;height:38px}
  .livechip{font-size:0}
  .livechip::after{content:"WCS / MES";font-size:10px}
  .tab{padding:0 12px}
  .tab .txt{display:none}
  .g-kpi,.kanban{grid-template-columns:1fr}
  .card{padding:15px}
  .kv{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .reveal{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

];

 {sku:"CN-連接器",name:"連接器組",lot:"L2606B",qty:1240,safe:400,exp:"2029-01",loc:"A2-11-02",st:"ok"},

 {sku:"PK-包材箱",name:"出貨紙箱",lot:"L2608E",qty:58,safe:120,exp:"—",loc:"B3-02-01",st:"low"},

function icon(n){return '<svg class="icon" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function safe(v){return String(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){return Number(v).toLocaleString("zh-TW")}
function ioTag(t){return t==="IN"?'<span class="tagio tag-in">入庫</span>':'<span class="tagio tag-out">出庫</span>'}
function priPill(p){return '<span class="pill '+(p==="高"?"p-bad":p==="中"?"p-warn":"p-idle")+'">'+safe(p)+'</span>'}
function stChip(s){
 if(s==="running")return '<span class="pill p-run">運行中</span>';
 if(s==="warn")return '<span class="pill p-warn">告警</span>';
 if(s==="idle")return '<span class="pill p-idle">待命</span>';
 return '<span class="pill p-ok">正常</span>'

function stockPill(s){

}).join("");
function show(i){
 document.querySelectorAll("[data-i]").forEach(function(b){
  var on=Number(b.dataset.i)===i;
  b.classList.toggle("on",on);
  b.setAttribute("aria-current",on?"page":"false")
 });
 app.innerHTML='<div class="reveal">'+screens[i]()+'</div>';
 drawCharts(i)
}
tabs.addEventListener("click",function(e){
 var b=e.target.closest("[data-i]");
 if(b)location.hash="v"+b.dataset.i
});
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 var i=m?Math.min(Number(m[1]),5):0;
 show(i);
 try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.show=show;
window.addEventListener("hashchange",fromHash);
fromHash()
})();
