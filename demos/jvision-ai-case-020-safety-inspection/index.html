<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>安衛風險巡檢台 · EHS Safety Patrol</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#ca8a04;--accent2:#eab308;--ink:#f1f0ea;--bg:#14161c;--panel:#1c1f27;--panel2:#171a21;--line:#2b2f3a;--mut:#9aa0ac;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#181b22,#20242e);border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:none}
.logo{width:38px;height:38px;border-radius:10px;background:repeating-linear-gradient(45deg,#ca8a04 0 10px,#20242e 10px 20px);display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 0 0 2px #ca8a04}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent2);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:nowrap;min-width:0;overflow-x:auto}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#262a34;color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1400}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.siren{background:rgba(234,179,8,.14);color:#fde047;border:1px solid rgba(234,179,8,.45);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.siren i{width:9px;height:9px;border-radius:50%;background:var(--accent2);display:inline-block;animation:bl 1.1s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(234,179,8,.6)}50%{opacity:.4;box-shadow:0 0 0 6px rgba(234,179,8,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.card h3{margin:0 0 12px;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink)}
.card h3 .material-symbols-outlined{color:var(--accent2)}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-r{background:rgba(239,68,68,.2);color:#fca5a5}.t-a{background:rgba(245,158,11,.22);color:#fcd34d}.t-b{background:rgba(202,138,4,.22);color:#fde047}.t-g{background:rgba(34,197,94,.2);color:#86efac}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--panel2)}
table.data tr:hover td{background:var(--panel2)}
.chart{height:230px}
.scroll{overflow-x:auto}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.zc{border-radius:12px;padding:13px;border:1px solid var(--line);background:var(--panel2)}
.zc.g{border-left:4px solid var(--ok)}.zc.a{border-left:4px solid var(--warn)}.zc.r{border-left:4px solid var(--bad)}
.zc b{font-family:"Noto Sans TC";font-size:14px;display:block}
.zc .stt{font-size:11px;font-weight:800;margin-top:6px;display:flex;align-items:center;gap:5px}
.zc small{color:var(--mut);font-size:11px;display:block;margin-top:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:var(--ok)}.dot.a{background:var(--warn)}.dot.r{background:var(--bad);animation:bl 1.1s infinite}
.chk{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--line)}
.ci.pass{border-color:var(--ok)}.ci.fail{border-color:var(--bad)}.ci.na{border-color:var(--mut)}
.ci .bx{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff}
.ci b{font-size:12.5px;font-family:"Noto Sans TC"}
.ci small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ci .rt{margin-left:auto;flex:none}
.sch{display:flex;flex-direction:column;gap:9px}
.si{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.si .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:12px;font-weight:800;color:#1a1400;flex:none;font-family:"Noto Sans TC"}
.si b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.si small{color:var(--mut);font-size:11px}
.si .rt{margin-left:auto;text-align:right;flex:none}
.rmwrap{overflow-x:auto}
.rm{border-collapse:separate;border-spacing:4px;margin:0 auto}
.rm td,.rm th{text-align:center}
.rm .cell{width:50px;height:44px;border-radius:8px;color:#1a1400;font-weight:800;font-size:15px;font-family:Inter;position:relative}
.rm .cell small{position:absolute;left:4px;top:2px;font-size:8.5px;font-weight:700;opacity:.75}
.rm .ax{color:var(--mut);font-size:10px;font-weight:700;font-family:"Noto Sans TC";white-space:nowrap}
.rm .yl{writing-mode:vertical-rl;text-orientation:mixed}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.leg span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.leg i{width:13px;height:13px;border-radius:4px;display:inline-block}
.hz{display:flex;flex-direction:column;gap:9px}
.hzc{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--panel2)}
.hzc .ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hzc b{font-family:"Noto Sans TC";font-size:12.5px}
.hzc small{color:var(--mut);font-size:11px;display:block;margin-top:5px}
.score{font-family:Inter;font-weight:900;font-size:16px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.hg{background:var(--panel2);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.hg .ph{height:90px;display:grid;place-items:center;color:#fff;position:relative}
.hg .ph .material-symbols-outlined{font-size:44px;opacity:.92}
.hg .ph .badge{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.4);color:#fff}
.hg .bd{padding:11px 13px}
.hg b{font-family:"Noto Sans TC";font-size:12.5px;display:block}
.hg small{color:var(--mut);font-size:11px;display:block;margin-top:4px}
.impr{display:flex;flex-direction:column;gap:10px}
.im{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2);display:flex;gap:12px;align-items:center}
.im .bx{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.im b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.im small{color:var(--mut);font-size:11px}
.im .prog{height:6px;background:#2b2f3a;border-radius:5px;overflow:hidden;margin-top:7px;width:120px;max-width:100%}
.im .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.im .rt{margin-left:auto;flex:none;text-align:right}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.tc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.tc .material-symbols-outlined{color:var(--accent2);font-size:24px}
.tc b{display:block;font-family:"Noto Sans TC";font-size:13.5px;margin:7px 0 5px}
.tc .rate{display:flex;align-items:center;gap:8px;margin-top:8px}
.tc .rate .pb{flex:1;height:7px;background:#2b2f3a;border-radius:5px;overflow:hidden}
.tc .rate .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tc small{color:var(--mut);font-size:11px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:3px solid var(--panel)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">安</div><div><b>安衛風險巡檢台</b><span>EHS SAFETY PATROL</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">安衛總覽</h2><p id="vd"></p></div><div class="siren"><i></i>2 項高風險缺失待改善</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["安衛總覽","dashboard","安衛總覽","廠區安衛指標、巡檢排程與危害趨勢全局視圖"],
["安衛巡檢","checklist","安衛巡檢","巡檢排程、檢核表填報與現場危害辨識"],
["風險矩陣","grid_on","風險矩陣","可能性 × 嚴重度 5×5 風險評估分級"],
["違規改善","build","違規改善","缺失開立、改善追蹤與複查結案"],
["教育訓練","school","教育訓練","安衛訓練達成率與證照到期管理"],
["事故通報","report","事故通報","虛驚與事故通報、調查與再發防止"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const ZONES=[["沖壓一廠","r","2 項未改善 · 護欄缺口"],["電鍍二廠","a","化學品標示待補"],["組裝三廠","g","巡檢達標 · 0 缺失"],["倉儲物流","a","堆高機通道占用"],["鍋爐機房","g","巡檢達標 · 0 缺失"],["廢水處理","g","巡檢達標 · 0 缺失"]];
const SCHED=[["沖壓一廠 · 機械安全巡檢","王","王志安 · 巡檢員","今日 09:00","逾期","t-r"],["電鍍二廠 · 化學品管理","陳","陳美惠 · 巡檢員","今日 13:30","進行中","t-a"],["倉儲物流 · 堆高機作業","林","林大山 · 巡檢員","今日 15:00","待巡檢","t-b"],["組裝三廠 · 用電安全","黃","黃淑芬 · 巡檢員","明日 10:00","已排定","t-b"]];
const CHK=[["機械護罩與防護裝置","沖壓機 P-03 護欄缺口 30cm","fail","不符"],["緊急停止裝置測試","全數作動正常","pass","符合"],["作業區照明與地面","照度足夠、無油漬","pass","符合"],["個人防護具佩戴","2 名作業員未戴護目鏡","fail","不符"],["消防設備與逃生通道","滅火器壓力正常、通道淨空","pass","符合"],["噪音與粉塵防護","此區非管制作業","na","不適用"]];
const HAZ=[["#ca8a04","警示","機械護欄缺口","沖壓一廠 P-03","warning","可能捲夾 · 已拍照登錄"],["#ef4444","高風險","化學品未標示","電鍍二廠 槽區","science","强酸桶缺 GHS 標示"],["#f59e0b","注意","堆高機通道占用","倉儲物流 B 區","local_shipping","棧板堆放阻礙動線"],["#ca8a04","警示","高處作業無護欄","沖壓一廠 夾層","stairs","2.4m 平台臨邊未防護"]];
const RM=[[2,3,4,4,5],[2,2,3,4,4],[1,2,3,3,4],[1,1,2,2,3],[1,1,1,2,2]];
const RMC=[[0,1,1,2,3],[0,0,1,2,2],[0,1,2,1,1],[1,0,0,1,0],[0,1,0,0,0]];
const SEV=["5 災難","4 重大","3 中度","2 輕微","1 極輕"];
const LIK=["1 稀少","2 偶爾","3 可能","4 常見","5 頻繁"];
const TOPRISK=[["化學品未標示 · 電鍍二廠",5,4,20,"高"],["機械護欄缺口 · 沖壓一廠",4,4,16,"高"],["高處作業無護欄 · 夾層平台",4,3,12,"中"],["堆高機通道占用 · 倉儲",3,3,9,"中"],["照明不足 · 廢水處理",2,3,6,"低"]];
const IMPR=[["沖壓機 P-03 加裝固定護欄","done","已完成並複查通過","王志安","#22c55e","check",100],["電鍍槽區補齊 GHS 標示","prog","標示已訂購，安裝中","陳美惠","#ca8a04","sync",60],["夾層平台增設臨邊護欄","prog","工程發包中","林大山","#ca8a04","sync",35],["倉儲通道劃設禁放標線","open","待排定施作","黃淑芬","#ef4444","schedule",10]];
const TRAIN=[["health_and_safety","一般安全衛生教育","法定 6 小時 · 全員",98,294,300],["fire_extinguisher","消防編組演練","半年一次 · 應變小組",100,48,48],["engineering","堆高機操作證訓練","特殊作業 · 證照",82,41,50],["masks","有機溶劑作業主管","電鍍二廠 · 證照",90,18,20]];
const CERT=[["堆高機操作證","林大山","2026-09-30","即將到期","t-a"],["有機溶劑作業主管","陳美惠","2026-12-15","有效","t-g"],["急救人員證","黃淑芬","2026-08-25","即將到期","t-a"],["高壓氣體特定設備","王志安","2027-03-10","有效","t-g"]];
const INC=[["INC-S038","電鍍二廠 化學品濺出","虛驚","2026-08-11 14:20","調查中","t-a"],["INC-S037","倉儲 堆高機擦撞棧板","輕傷","2026-08-08 10:05","已結案","t-g"],["INC-S036","沖壓一廠 手部近夾點","虛驚","2026-08-05 16:40","已結案","t-g"],["INC-S035","鍋爐機房 蒸氣管洩漏","財損","2026-07-29 08:15","已結案","t-g"]];
const ITL=[["14:20 事故發生","電鍍二廠槽區搬運時强酸容器傾倒，少量濺出"],["14:22 現場應變","作業員撤離、啟動洗眼器與圍堵，無人員受傷"],["14:35 通報立案 INC-S038","職安衛主管判定虛驚事件，啟動調查"],["15:10 原因初判","容器固定帶老化斷裂 · 搬運未使用專用推車"],["待辦 改善對策","更換固定帶、導入專用搬運車、加強教育訓練"]];

function rmColor(lv){return lv>=5?'#dc2626':lv>=4?'#f97316':lv>=3?'#eab308':lv>=2?'#84cc16':'#22c55e';}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">fact_check</span><div class="l">本月巡檢達成率</div><div class="v">94<small style="font-size:12px">%</small></div><div class="d up">▲ 較 78%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">report_problem</span><div class="l">待改善缺失</div><div class="v" style="color:#fcd34d">11</div><div class="d" style="color:var(--mut)">2 高 · 4 中 · 5 低</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">health_and_safety</span><div class="l">失能傷害頻率 FR</div><div class="v">0.8</div><div class="d up">▼ 較 2.6</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">event_repeat</span><div class="l">無事故天數</div><div class="v">126<small style="font-size:12px"> 天</small></div><div class="d up">▲ 創新高</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">grid_view</span>廠區安衛狀態看板</h3><div class="zones">${ZONES.map(z=>`<div class="zc ${z[1]}"><b>${z[0]}</b><div class="stt"><span class="dot ${z[1]}"></span>${z[1]=='r'?'高風險':z[1]=='a'?'注意':'正常'}</div><small>${z[2]}</small></div>`).join('')}</div><h3 style="margin-top:15px"><span class="material-symbols-outlined">show_chart</span>缺失與改善趨勢（近 6 週）</h3><div class="chart" id="c_tr" style="height:200px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">event</span>今日巡檢排程</h3><div class="sch">${SCHED.map(s=>`<div class="si"><span class="av">${s[1]}</span><div style="min-width:0"><b>${s[0]}</b><small>${s[2]}</small></div><div class="rt"><span class="tag ${s[5]}">${s[4]}</span><small style="display:block;color:var(--mut);margin-top:4px">${s[3]}</small></div></div>`).join('')}</div></div>
</div>`,
