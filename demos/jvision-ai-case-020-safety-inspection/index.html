<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>安衛風險巡檢員 · EHS Risk Inspector</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;--color-on-primary:#FFF;
  --color-secondary:#3B82F6;--color-on-secondary:#000;
  --color-accent:#EA580C;--color-on-accent:#000;
  --color-background:#F8FAFC;--color-foreground:#1E293B;
  --color-card:#FFF;--color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;--color-muted-foreground:#475569;
  --color-border:#E2E8F0;--color-destructive:#DC2626;
  --color-on-destructive:#FFF;--color-ring:#2563EB;
  --blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
  --ok:#15803D;--warn:#A84A00;--bad:#DC2626;
  --shadow:5px 5px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.45}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{
  position:sticky;top:0;z-index:30;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;
  min-height:72px;background:#FFF;border-bottom:3px solid var(--ink)
}
.brand{display:flex;align-items:center;gap:12px;padding:10px 18px;border-right:3px solid var(--ink)}
.logo{
  width:44px;height:44px;display:grid;place-items:center;
  background:var(--color-primary);color:#FFF;border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--color-accent);font:700 19px "Fira Code",monospace
}
.brand b{display:block;font-size:16px;font-weight:700;white-space:nowrap}
.brand span{display:block;color:var(--color-primary);font:600 10px "Fira Code",monospace;letter-spacing:.09em}
.nav{display:flex;min-width:0;overflow-x:auto;scrollbar-width:thin}
.nav button{
  flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:69px;padding:10px 13px;border:0;border-right:1px solid var(--line);
  background:#FFF;color:var(--muted);font-weight:600
}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--ink);color:#FFF;box-shadow:inset 0 -6px var(--color-accent)}
.nav button.on .material-symbols-outlined{color:#FDBA74}
.quick{
  border:0;border-left:3px solid var(--ink);padding:0 18px;
  background:var(--color-accent);color:var(--color-on-accent);font-weight:700
}
.quick:hover{background:#FB923C}
.wrap{max-width:1440px;margin:auto;padding:24px}
.hero{
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:24px;align-items:end;margin-bottom:18px;padding:22px 24px;
  background:var(--color-primary);color:#FFF;border:3px solid var(--ink);
  box-shadow:var(--shadow);overflow:hidden
}
.hero:after{
  content:"";position:absolute;right:25%;top:-55px;width:160px;height:180px;
  border:22px solid rgba(255,255,255,.14);transform:rotate(20deg);pointer-events:none
}
.eyebrow{margin:0 0 6px;font:700 11px "Fira Code",monospace;letter-spacing:.12em;color:#DBEAFE}
.hero h1{position:relative;margin:0;font-size:clamp(25px,3vw,42px);line-height:1;font-weight:700}
.hero p{position:relative;margin:10px 0 0;color:#EFF6FF;font-size:14px}
.siren{
  position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:#FFF;color:#7C2D12;border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--color-accent);font-weight:700;font-size:12px
}
.siren i,.dot{display:inline-block;width:10px;height:10px;border:2px solid currentColor;background:currentColor}
.siren i{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.kpi{position:relative;min-height:128px;padding:17px;background:#FFF;border:2px solid var(--ink)}
.kpi:nth-child(even){background:var(--color-muted)}
.kpi:before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:7px;background:var(--color-primary)}
.kpi:nth-child(2):before{background:var(--color-accent)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{margin-top:10px;font:700 30px "Fira Code",monospace;letter-spacing:-.05em}
.kpi .v small{font-size:12px;letter-spacing:0}
.kpi .d{margin-top:3px;font:600 11px "Fira Code",monospace}
.kpi .ic{position:absolute;right:13px;bottom:12px;font-size:34px;color:var(--color-primary);opacity:.24}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(330px,.85fr)}
.card{background:#FFF;border:2px solid var(--ink);padding:16px}
.card:nth-child(2n){box-shadow:4px 4px 0 var(--color-border)}
.card h3{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:-16px -16px 15px;padding:12px 14px;border-bottom:2px solid var(--ink);
  background:var(--color-muted);font-size:14px;font-weight:700
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.tag{
  display:inline-flex;align-items:center;white-space:nowrap;padding:3px 7px;
  border:1px solid currentColor;font:700 10px "Fira Code",monospace
}
.t-r{background:#FEE2E2;color:#991B1B}.t-a{background:#FFEDD5;color:#9A3412}
.t-b{background:#DBEAFE;color:#1E40AF}.t-g{background:#DCFCE7;color:#166534}
.scroll,.rmwrap{overflow:auto}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:10px;border:1px solid var(--line);text-align:left}
table.data th{background:var(--ink);color:#FFF;font-size:11px;font-weight:700}
table.data tr:hover td{background:#EFF6FF}
table.data td:first-child,table.data td:nth-last-child(2){font-family:"Fira Code",monospace}
table.data td:last-child{text-align:right}
.chart{height:230px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.zc{padding:12px;background:#FFF;border:2px solid var(--line)}
.zc.g{border-left:8px solid var(--ok)}.zc.a{border-left:8px solid var(--warn)}.zc.r{border-left:8px solid var(--bad)}
.zc b{display:block;font-size:13px}.zc .stt{display:flex;align-items:center;gap:6px;margin-top:7px;font-weight:700;font-size:11px}
.zc small,.ci small,.si small,.hzc small,.hg small,.im small,.tc small,.ti small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.dot.g{color:var(--ok)}.dot.a{color:var(--warn)}.dot.r{color:var(--bad)}
.chk,.sch,.hz,.impr{display:flex;flex-direction:column;gap:8px}
.ci,.si,.im,.hzc{display:flex;gap:11px;align-items:center;padding:11px;background:#F8FAFC;border:1px solid var(--line)}
.ci{align-items:flex-start;border-left:7px solid var(--muted)}
.ci.pass{border-left-color:var(--ok)}.ci.fail{border-left-color:var(--bad)}
.ci .bx,.im .bx{display:grid;place-items:center;flex:none;width:27px;height:27px;color:#FFF;border:2px solid var(--ink)}
.ci b,.si b,.im b,.hzc b{font-size:12px}
.rt{margin-left:auto;flex:none;text-align:right}
.si .av{display:grid;place-items:center;flex:none;width:34px;height:34px;background:var(--color-primary);color:#FFF;border:2px solid var(--ink);font:700 12px "Fira Code",monospace}
.rm{margin:auto;border-collapse:separate;border-spacing:4px}
.rm td,.rm th{text-align:center}
.rm .cell{position:relative;width:54px;height:48px;display:grid;place-items:center;border:2px solid var(--ink);font:700 16px "Fira Code",monospace;color:#111827}
.rm .cell small{position:absolute;left:3px;top:1px;font-size:9px}
.rm .ax{color:var(--muted);font:600 10px "Fira Code",monospace;white-space:nowrap}
.rm .yl{writing-mode:vertical-rl}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.leg span{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.leg i{display:inline-block;width:15px;height:15px;border:1px solid var(--ink)}
.hzc{display:block}.hzc .ct{display:flex;justify-content:space-between;gap:10px}
.score{font:700 18px "Fira Code",monospace}
.hgrid,.tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hg,.tc{overflow:hidden;background:#FFF;border:2px solid var(--ink)}
.hg .ph{position:relative;height:88px;display:grid;place-items:center;color:#FFF;border-bottom:2px solid var(--ink)}
.hg .ph .material-symbols-outlined{font-size:43px}
.hg .badge{position:absolute;left:7px;top:7px;padding:3px 7px;background:#111827;color:#FFF;font:700 10px "Fira Code",monospace}
.hg .bd,.tc{padding:11px}.hg b,.tc b{display:block;font-size:12px}
.im{border-left:7px solid var(--color-primary)}
.im .prog,.tc .pb{overflow:hidden;height:8px;margin-top:7px;background:#CBD5E1;border:1px solid var(--ink)}
.im .prog{width:150px;max-width:100%}
.im .prog i,.tc .pb i{display:block;height:100%;background:var(--color-primary)}
.tc .material-symbols-outlined{font-size:28px;color:var(--color-primary)}
.tc .rate{display:flex;align-items:center;gap:8px;margin-top:9px}.tc .pb{flex:1;margin:0}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:8px;width:3px;background:var(--ink)}
.ti{position:relative;padding:0 0 17px 5px}
.ti:before{content:"";position:absolute;left:-23px;top:2px;width:13px;height:13px;background:var(--color-accent);border:2px solid var(--ink)}
.ti .tt{font:700 12px "Fira Code",monospace}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;background:var(--color-muted);border:1px solid var(--ink);font-size:11px;font-weight:700}
.footer-cta{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  margin-top:18px;padding:18px 20px;background:var(--ink);color:#FFF;border:3px solid var(--ink)
}
.footer-cta b{font-size:16px}.footer-cta small{display:block;color:#CBD5E1}
.footer-cta button{padding:11px 16px;border:2px solid #FFF;background:var(--color-accent);color:#111827;font-weight:700}
.footer-cta button:hover{background:#FB923C}
footer{padding:18px 0 2px;color:var(--muted);font:500 10px "Fira Code",monospace}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .top{grid-template-columns:auto 1fr}.quick{display:none}.brand{border-right:3px solid var(--ink)}
  .g2{grid-template-columns:1fr}.zones{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .top{display:block}.brand{border-right:0;border-bottom:2px solid var(--ink)}
  .nav button{min-height:52px}.hero{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}
  .zones{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .wrap{padding:14px}.brand{padding:8px 12px}.brand span{display:none}
  .nav button{padding:8px}.nav button span:last-child{display:none}
  .hero{padding:18px}.hero h1{font-size:27px}.kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{min-height:116px;padding:14px}.kpi .v{font-size:25px}
  .zones,.hgrid,.tr{grid-template-columns:1fr}.footer-cta{align-items:stretch;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">安</div>
    <div><b>安衛風險巡檢員</b><span>QUALITY INSPECTION / EHS</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <button class="quick" type="button" onclick="show(1)">開始巡檢</button>
</header>

<main class="wrap">
  <section class="hero" aria-labelledby="vt">
    <div>
      <p class="eyebrow">RISK CONTROL CENTER / 06 MODULES</p>
      <h1 id="vt">安衛總覽</h1>
      <p id="vd"></p>
    </div>
    <div class="siren" role="status"><i aria-hidden="true"></i><span>高風險警示：2 項缺失待改善</span></div>
  </section>
  <div id="view" aria-live="polite"></div>
  <section class="footer-cta">
    <div><b>把現場風險轉成可追蹤的改善行動</b><small>巡檢、評估、改善、訓練與事故調查集中管理。</small></div>
    <button type="button" onclick="show(1)">前往安衛巡檢</button>
  </section>
  <footer>安衛風險巡檢員 · EHS SAFETY PATROL / QUALITY INSPECTION COMPLIANCE DASHBOARD</footer>
</main>

<script>
const MOD=[

];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";b.dataset.i=i;b.className=i===0?"on":"";
  b.setAttribute("aria-label",m[0]);
  b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span>${m[0]}</span>`;
  b.onclick=()=>show(i);
  nav.appendChild(b);
});

const ZONES=[
["沖壓一廠","r","2 項未改善 · 護欄缺口"],["電鍍二廠","a","化學品標示待補"],
["組裝三廠","g","巡檢達標 · 0 缺失"],["倉儲物流","a","堆高機通道占用"],
["鍋爐機房","g","巡檢達標 · 0 缺失"],["廢水處理","g","巡檢達標 · 0 缺失"]
];
const SCHED=[
["沖壓一廠 · 機械安全巡檢","王","王志安 · 巡檢員","今日 09:00","逾期","t-r"],
["電鍍二廠 · 化學品管理","陳","陳美惠 · 巡檢員","今日 13:30","進行中","t-a"],
["倉儲物流 · 堆高機作業","林","林大山 · 巡檢員","今日 15:00","待巡檢","t-b"],
["組裝三廠 · 用電安全","黃","黃淑芬 · 巡檢員","明日 10:00","已排定","t-b"]

const CHK=[
["機械護罩與防護裝置","沖壓機 P-03 護欄缺口 30cm","fail","不符"],
["緊急停止裝置測試","全數作動正常","pass","符合"],
["作業區照明與地面","照度足夠、無油漬","pass","符合"],
["個人防護具佩戴","2 名作業員未戴護目鏡","fail","不符"],
["消防設備與逃生通道","滅火器壓力正常、通道淨空","pass","符合"],
["噪音與粉塵防護","此區非管制作業","na","不適用"]

const HAZ=[
["#A84A00","警示","機械護欄缺口","沖壓一廠 P-03","warning","可能捲夾 · 已拍照登錄"],
["#DC2626","高風險","化學品未標示","電鍍二廠 槽區","science","强酸桶缺 GHS 標示"],
["#9A3412","注意","堆高機通道占用","倉儲物流 B 區","local_shipping","棧板堆放阻礙動線"],
["#2563EB","警示","高處作業無護欄","沖壓一廠 夾層","stairs","2.4m 平台臨邊未防護"]
];
const RM=[[2,3,4,4,5],[2,2,3,4,4],[1,2,3,3,4],[1,1,2,2,3],[1,1,1,2,2]];
const RMC=[[0,1,1,2,3],[0,0,1,2,2],[0,1,2,1,1],[1,0,0,1,0],[0,1,0,0,0]];
const SEV=["5 災難","4 重大","3 中度","2 輕微","1 極輕"];
const LIK=["1 稀少","2 偶爾","3 可能","4 常見","5 頻繁"];
const TOPRISK=[
["化學品未標示 · 電鍍二廠",5,4,20,"高"],["機械護欄缺口 · 沖壓一廠",4,4,16,"高"],
["高處作業無護欄 · 夾層平台",4,3,12,"中"],["堆高機通道占用 · 倉儲",3,3,9,"中"],
["照明不足 · 廢水處理",2,3,6,"低"]
];
const IMPR=[
["沖壓機 P-03 加裝固定護欄","done","已完成並複查通過","王志安","#15803D","check",100],
["電鍍槽區補齊 GHS 標示","prog","標示已訂購，安裝中","陳美惠","#2563EB","sync",60],
["夾層平台增設臨邊護欄","prog","工程發包中","林大山","#2563EB","sync",35],
["倉儲通道劃設禁放標線","open","待排定施作","黃淑芬","#DC2626","schedule",10]
];
const TRAIN=[
["health_and_safety","一般安全衛生教育","法定 6 小時 · 全員",98,294,300],
["fire_extinguisher","消防編組演練","半年一次 · 應變小組",100,48,48],

["masks","有機溶劑作業主管","電鍍二廠 · 證照",90,18,20]
];
const CERT=[
["堆高機操作證","林大山","2026-09-30","即將到期","t-a"],
["有機溶劑作業主管","陳美惠","2026-12-15","有效","t-g"],
["急救人員證","黃淑芬","2026-08-25","即將到期","t-a"],
["高壓氣體特定設備","王志安","2027-03-10","有效","t-g"]
];
const INC=[
["INC-S038","電鍍二廠 化學品濺出","虛驚","2026-08-11 14:20","調查中","t-a"],
["INC-S037","倉儲 堆高機擦撞棧板","輕傷","2026-08-08 10:05","已結案","t-g"],
["INC-S036","沖壓一廠 手部近夾點","虛驚","2026-08-05 16:40","已結案","t-g"],
["INC-S035","鍋爐機房 蒸氣管洩漏","財損","2026-07-29 08:15","已結案","t-g"]
];
const ITL=[
["14:20 事故發生","電鍍二廠槽區搬運時强酸容器傾倒，少量濺出"],
["14:22 現場應變","作業員撤離、啟動洗眼器與圍堵，無人員受傷"],
["14:35 通報立案 INC-S038","職安衛主管判定虛驚事件，啟動調查"],
["15:10 原因初判","容器固定帶老化斷裂 · 搬運未使用專用推車"],
["待辦 改善對策","更換固定帶、導入專用搬運車、加強教育訓練"]
];

function rmColor(lv){return lv>=5?"#DC2626":lv>=4?"#F97316":lv>=3?"#EAB308":lv>=2?"#84CC16":"#22C55E"}
function icon(name){return `<span class="material-symbols-outlined" aria-hidden="true">${name}</span>`}
function statusText(c){return c==="r"?"高風險":c==="a"?"注意":"正常"}

const SCREENS=[
()=>`<div class="reveal">

let chart;
function draw(i){
  if(chart){chart.dispose();chart=null}
  const text="#475569",line="#CBD5E1",blue="#2563EB",orange="#EA580C",green="#15803D";
  if(i===0){
    const el=document.getElementById("c_tr");
    if(el){
      chart=echarts.init(el);
      chart.setOption({
        grid:{left:40,right:14,top:34,bottom:26},
        legend:{top:0,textStyle:{color:text,fontFamily:"Fira Sans",fontSize:11}},
        tooltip:{trigger:"axis"},
        xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLabel:{color:text,fontSize:10},axisLine:{lineStyle:{color:line}}},
        yAxis:{type:"value",axisLabel:{color:text,fontSize:10},splitLine:{lineStyle:{color:line,type:"dashed"}}},
        series:[
          {name:"新增缺失",type:"bar",data:[18,15,14,11,9,7],itemStyle:{color:orange}},
          {name:"已改善",type:"bar",data:[10,12,13,12,10,9],itemStyle:{color:green}},
          {name:"巡檢達成率%",type:"line",smooth:false,data:[78,82,85,88,91,94],lineStyle:{color:blue,width:3},itemStyle:{color:blue}}
        ]
      });
    }
  }
  if(i===4){
    const el=document.getElementById("c_tn");
    if(el){
      chart=echarts.init(el);
      chart.setOption({
        grid:{left:42,right:14,top:18,bottom:26},tooltip:{trigger:"axis"},
        xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLabel:{color:text,fontSize:10},axisLine:{lineStyle:{color:line}}},
        yAxis:{type:"value",name:"時數",nameTextStyle:{color:text,fontSize:10},axisLabel:{color:text,fontSize:10},splitLine:{lineStyle:{color:line,type:"dashed"}}},
        series:[{type:"line",smooth:false,data:[120,180,210,240,280,320],areaStyle:{color:"rgba(37,99,235,.12)"},lineStyle:{color:blue,width:3},itemStyle:{color:orange}}]
      });
    }
  }
}
function show(i){
  i=Math.max(0,Math.min(Number(i)||0,MOD.length-1));
  nav.querySelectorAll("button").forEach(b=>{
    const on=Number(b.dataset.i)===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
  view.innerHTML=SCREENS[i]();
  draw(i);
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(Number(m[1]),5):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>{if(chart)chart.resize()});
fromHash();
</script>
</body>
