<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業擔保與資金借貸管理</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E8DC;
  --ok:#087F5B;
  --warn:#A75800;
  --bad:#C81E1E;
  --info:#176B87;
  --canvas:#F0FDFA;
  --paper:#FFFFFF;
  --soft:#E6FFFA;
  --shadow:0 12px 30px rgba(15,118,110,.08);
  --font-display:"Cormorant Garamond","Crimson Pro",serif;
  --font-body:"Crimson Pro","Noto Serif TC",serif;
  --font-code:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;font-weight:400;font-style:normal;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.app{min-height:100vh}
.sidebar{
  position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:28px;min-height:76px;padding:10px clamp(18px,4vw,64px);
  background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  box-shadow:0 3px 16px rgba(15,118,110,.05);backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.brand-logo{
  display:grid;place-items:center;width:42px;height:42px;border-radius:4px;
  background:var(--color-primary);color:#fff;box-shadow:5px 5px 0 #99F6E4
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt b{display:block;font-family:var(--font-display);font-size:18px;line-height:1;font-weight:700;letter-spacing:.03em}
.brand-txt span{display:block;margin-top:5px;color:var(--muted);font-family:var(--font-code);font-size:9px;letter-spacing:.13em}
.nav{display:flex;justify-content:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:flex;align-items:center;gap:7px;flex:none;min-height:44px;padding:9px 12px;
  color:var(--muted);background:transparent;border:1px solid transparent;border-radius:3px;
  font-weight:600;white-space:nowrap;transition:background-color .22s,color .22s,border-color .22s,transform .22s
}
.nav button:hover{color:var(--ink);background:var(--soft);border-color:var(--line);transform:translateY(-1px)}
.nav button.on{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.nav .idx{font-family:var(--font-code);font-size:10px;opacity:.7}
.side-foot{color:var(--muted);font-size:11px;line-height:1.45;text-align:right;white-space:nowrap}
.side-foot b{color:var(--ink);font-family:var(--font-code)}
.main{width:min(1540px,100%);margin:0 auto;padding:clamp(24px,4vw,52px) clamp(16px,4vw,64px) 72px}
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  margin-bottom:26px;padding-bottom:22px;border-bottom:2px solid var(--ink)
}
.eyebrow{margin-bottom:8px;color:var(--color-primary);font-family:var(--font-code);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.topbar h1{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--font-display);font-size:clamp(30px,4vw,46px);line-height:1;font-weight:700;letter-spacing:-.025em}
.topbar h1 .material-symbols-outlined{font-size:30px;color:var(--color-primary)}
.topbar .sub{margin-top:9px;color:var(--muted);font-size:15px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 11px;background:#fff;border:1px solid var(--line);border-radius:2px;color:var(--muted);font-size:13px;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #D1FAE5;animation:pulse 2s ease-in-out infinite}
.avatar{display:grid;place-items:center;width:36px;height:36px;background:var(--color-accent);border-radius:2px;color:#111827;font-weight:700}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card,.tile,.feature,.cta-panel{
  min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)
}
.card{padding:20px}.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card-h h3{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--font-display);font-size:20px;line-height:1.15}
.card-h h3 .material-symbols-outlined{color:var(--color-primary)}
.card-h .hint{color:var(--muted);font-family:var(--font-code);font-size:11px}
.tile{position:relative;padding:20px;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}
.tile::before{content:"";position:absolute;top:0;right:0;width:42px;height:4px;background:var(--color-secondary)}
.tile:hover,.feature:hover{transform:translateY(-3px);border-color:var(--color-primary);box-shadow:0 16px 34px rgba(15,118,110,.13)}
.tile .ti{display:grid;place-items:center;width:38px;height:38px;margin-bottom:18px;border:1px solid var(--line);border-radius:3px;background:var(--soft);color:var(--color-primary)}
.tile b{display:block;font-size:14px;font-weight:600}.tile .tv{margin:5px 0 1px;font-family:var(--font-display);font-size:31px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile p{margin:0;color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{padding:11px 14px;background:#E6FFFA;border-bottom:1px solid var(--color-primary);color:var(--ink);font-family:var(--font-code);font-size:11px;font-weight:700;letter-spacing:.02em;text-align:left;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #C7EFE9;white-space:nowrap}
tbody tr{transition:background-color .2s}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-code);font-size:12px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;border-radius:2px;font-size:11px;font-weight:700;line-height:1.35}
.tag::before{font-family:"Material Symbols Outlined";font-size:13px}
.t-ok{color:#067647;background:#ECFDF3}.t-ok::before{content:"check_circle"}
.t-warn{color:#8A4B08;background:#FFF7E6}.t-warn::before{content:"warning"}
.t-bad{color:#B42318;background:#FEF3F2}.t-bad::before{content:"error"}
.t-info{color:#175CD3;background:#EFF8FF}.t-info::before{content:"info"}
.t-gray{color:#475569;background:#F1F5F9}.t-gray::before{content:"remove_circle"}
.prog{display:flex;align-items:center;gap:8px;min-width:130px}.bar{height:7px;flex:1;background:#D7EAE8;overflow:hidden}.bar i{display:block;height:100%;background:var(--color-primary)}.prog small{width:34px;color:var(--muted);font-family:var(--font-code);font-size:10px;text-align:right}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feature{padding:22px;transition:transform .22s,border-color .22s,box-shadow .22s}
.feature .material-symbols-outlined{display:grid;place-items:center;width:40px;height:40px;margin-bottom:18px;background:var(--color-primary);color:#fff;border-radius:3px}
.feature h3{margin:0 0 7px;font-family:var(--font-display);font-size:22px}.feature p{margin:0;color:var(--muted);font-size:14px}
.cta-panel{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:16px;padding:24px;background:var(--ink);border-color:var(--ink);color:#fff}
.cta-panel h3{margin:0 0 4px;font-family:var(--font-display);font-size:24px}.cta-panel p{margin:0;color:#CCFBF1}
.cta{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 16px;border:1px solid #F59E0B;border-radius:2px;background:var(--color-accent);color:#111827;font-weight:700;text-decoration:none;transition:transform .22s,background-color .22s}
.cta:hover{transform:translateY(-2px);background:#F59E0B}
.grid-item{animation:reveal .42s cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
.screen-note{margin-top:14px;padding:12px 14px;border-left:3px solid var(--color-accent);background:#FFFBEB;color:#713F12;font-size:13px}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@media(max-width:1200px){
  .sidebar{grid-template-columns:auto 1fr}.side-foot{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .sidebar{position:static;grid-template-columns:1fr;padding:12px 18px;gap:8px}.brand{min-width:0}.nav{justify-content:flex-start}
  .topbar{align-items:flex-start;flex-direction:column}.top-right{justify-content:flex-start}
  .g32,.g2{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button{padding:9px}.nav button .txt,.nav button .idx{display:none}
  .main{padding-top:26px}.g4,.feature-grid{grid-template-columns:1fr}
  .topbar h1{font-size:32px}.chip:nth-child(2){display:none}.cta-panel{align-items:flex-start;flex-direction:column}
  .tile,.card{padding:17px}.card.pad0{padding:0}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tile(ic,t,v,p){return '<article class="tile grid-item"><div class="ti"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>'}
function pg(p){return '<div class="prog" aria-label="使用率 '+p+'%"><div class="bar"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
function tbl(h,r){return '<div class="table-wrap"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function card(t,ic,body,hint){return '<section class="card grid-item"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function cardT(t,ic,body,hint){return '<section class="card pad0 grid-item"><div class="card-h" style="padding:20px 20px 0"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}

var CB={redrawOnParentResize:true,redrawOnWindowResize:true,animations:{enabled:false},toolbar:{show:false},fontFamily:"Crimson Pro"};
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function mkArea(el,data,cats,name){push(el,{chart:Object.assign({},CB,{type:"area",height:245}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:AX},yaxis:{labels:AX},grid:{borderColor:"#C7EFE9",strokeDashArray:3},dataLabels:{enabled:false},stroke:{curve:"straight",width:2},colors:["#0D9488"],fill:{type:"gradient",gradient:{opacityFrom:.3,opacityTo:.02}},tooltip:{theme:"light"}})}
function mkStack(el,cats,series){push(el,{chart:Object.assign({},CB,{type:"bar",height:250,stacked:true}),series:series,xaxis:{categories:cats,labels:AX},yaxis:{labels:AX},grid:{borderColor:"#C7EFE9",strokeDashArray:3},dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:2,columnWidth:"48%"}},colors:["#0D9488","#99F6E4"],legend:{position:"bottom"},tooltip:{theme:"light"}})}
function mkDonut(el,labels,data){push(el,{chart:Object.assign({},CB,{type:"donut",height:250}),series:data,labels:labels,colors:["#0D9488","#2DD4BF","#D97706","#0F766E","#64748B"],dataLabels:{enabled:false},legend:{position:"bottom"},plotOptions:{pie:{donut:{size:"68%"}}},stroke:{width:3,colors:["#fff"]},tooltip:{theme:"light"}})}
function mkLine2(el,cats,s1,s2){push(el,{chart:Object.assign({},CB,{type:"line",height:250}),series:[s1,s2],xaxis:{categories:cats,labels:AX},yaxis:{labels:AX},grid:{borderColor:"#C7EFE9",strokeDashArray:3},dataLabels:{enabled:false},stroke:{curve:"straight",width:2,dashArray:[0,5]},colors:["#0D9488","#D97706"],legend:{position:"top"},tooltip:{theme:"light"}})}
function mkBar(el,cats,data,name){push(el,{chart:Object.assign({},CB,{type:"bar",height:250}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:AX},yaxis:{labels:AX},grid:{borderColor:"#C7EFE9",strokeDashArray:3},dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:2,columnWidth:"45%"}},colors:["#0D9488"],tooltip:{theme:"light"}})}

}
