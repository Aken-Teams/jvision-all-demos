<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>電子簽核用印系統 E-Signature / Digital Seal Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#C7D5F3;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --accent-soft:#DBEAFE;
  --sub:#475569;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --warn:#A16207;
  --danger:#DC2626;
  --ok:#047857;
  --info:#1D4ED8;
  --black:#0F172A;
  --border:2px solid var(--black);
}
*{box-sizing:border-box;}
html{scroll-behavior:auto;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  background-color:var(--color-background);
  background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;}
button,[data-i],.btn{cursor:pointer;}
button:focus-visible,.btn:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  display:inline-block;
  direction:ltr;
  font-family:"Material Symbols Outlined";
  font-size:inherit;
  font-style:normal;
  font-weight:normal;
  letter-spacing:normal;
  line-height:1;
  text-transform:none;
  vertical-align:middle;
  white-space:nowrap;
}
.layout{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex:0 0 280px;
  flex-direction:column;
  width:280px;
  height:100vh;
  min-width:0;
  padding:22px 16px 16px;
  overflow-y:auto;
  background:var(--color-card);
  border-right:3px solid var(--black);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin:-22px -16px 20px;
  padding:22px 16px 18px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-bottom:3px solid var(--black);
}
.brand-mark{
  display:flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  width:50px;
  height:50px;
  color:var(--black);
  background:#BFDBFE;
  border:3px solid var(--black);
  border-radius:0;
}
.brand-mark .material-symbols-outlined{font-size:28px;}
.brand-txt{min-width:0;}
.brand-txt b{display:block;font-size:15px;font-weight:900;line-height:1.3;letter-spacing:.03em;}
.brand-txt span{display:block;margin-top:3px;font-family:"Fira Code",monospace;font-size:10px;font-weight:600;letter-spacing:.08em;opacity:.9;}
.nav{display:flex;flex-direction:column;gap:8px;}
.nav button{
  position:relative;
  display:grid;
  grid-template-columns:24px minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:48px;
  padding:10px 11px;
  color:var(--color-foreground);
  text-align:left;
  background:var(--color-card);
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:3px 3px 0 var(--black);
  transition:background-color 160ms ease,color 160ms ease,transform 160ms ease,box-shadow 160ms ease;
}
.nav button:hover{background:#DBEAFE;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--black);}
.nav button.on{color:var(--color-on-primary);background:var(--color-primary);transform:translate(3px,3px);box-shadow:0 0 0 var(--black);}
.nav button.on::before{position:absolute;left:-18px;width:10px;height:100%;content:"";background:var(--color-accent);border:2px solid var(--black);}
.nav button .material-symbols-outlined{font-size:22px;}
.nav button.on .material-symbols-outlined{color:#FFFFFF;}
.nav button .nt{min-width:0;overflow:hidden;font-size:13px;font-weight:800;text-overflow:ellipsis;white-space:nowrap;}
.nav-idx{margin-left:auto;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;}
.side-foot{
  margin-top:auto;
  padding:15px 10px 3px;
  color:var(--color-muted-foreground);
  border-top:2px solid var(--black);
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.7;
}
.side-foot b{color:var(--color-primary);}
.main{flex:1 1 auto;min-width:0;padding:32px clamp(18px,3vw,48px) 56px;overflow:hidden;}
.topbar{
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin:0 0 28px;
  padding:20px;
  background:var(--color-card);
  border:3px solid var(--black);
  box-shadow:8px 8px 0 var(--black);
}
.topbar .tb-info{min-width:0;}
.topbar h1{margin:0;font-size:clamp(22px,2.4vw,36px);font-weight:900;line-height:1.08;letter-spacing:-.04em;}
.topbar .sub{margin-top:8px;color:var(--color-muted-foreground);font-size:13px;font-weight:600;}
.tb-tag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:5px 10px;
  color:#FFFFFF;
  background:var(--color-primary);
  border:2px solid var(--black);
  border-radius:0;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}
.pill.ghost{color:var(--color-foreground);background:var(--color-card);}
.pill .material-symbols-outlined{font-size:16px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px;}
.kpi{
  position:relative;
  min-width:0;
  min-height:148px;
  padding:18px 16px;
  overflow:hidden;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:var(--border);
  border-radius:0;
  box-shadow:5px 5px 0 var(--black);
}
.kpi:nth-child(2n){transform:translateY(8px);}
.kpi::after{position:absolute;right:-18px;bottom:-28px;width:82px;height:82px;content:"";background:var(--accent-soft);border:2px solid var(--black);transform:rotate(18deg);}
.kpi .kh{position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:var(--color-muted-foreground);font-size:12px;font-weight:800;}
.kpi .kh .material-symbols-outlined{padding:5px;color:#FFFFFF;background:var(--color-primary);border:2px solid var(--black);font-size:18px;}
.kpi .kv{position:relative;z-index:1;margin-top:10px;font-family:"Fira Code",monospace;font-size:clamp(26px,3vw,38px);font-weight:700;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums;}
.kpi .kv small{margin-left:5px;color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:13px;font-weight:700;letter-spacing:0;}
.kpi .kd{position:relative;z-index:1;margin-top:12px;font-size:11px;font-weight:800;}
.kd.up{color:#047857;}.kd.down{color:#B91C1C;}.kd.flat{color:var(--color-muted-foreground);}
.kd.up::before{content:"[改善] ";}.kd.down::before{content:"[注意] ";}.kd.flat::before{content:"[持平] ";}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;margin-bottom:18px;}
.grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px;}
.panel{
  min-width:0;
  padding:18px;
  background:var(--color-card);
  border:var(--border);
  border-radius:0;
  box-shadow:5px 5px 0 var(--black);
}
.panel-h{display:flex;align-items:center;gap:9px;margin:-18px -18px 18px;padding:13px 16px;background:var(--color-muted);border-bottom:2px solid var(--black);}
.panel-h .material-symbols-outlined{padding:5px;color:#FFFFFF;background:var(--color-primary);border:2px solid var(--black);font-size:18px;}
.panel-h h3{min-width:0;margin:0;font-size:14px;font-weight:900;line-height:1.3;}
.panel-h .ph-sub{margin-left:auto;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;white-space:nowrap;}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
.tbl-scroll{width:100%;overflow-x:auto;border:2px solid var(--black);border-radius:0;}
table{width:100%;min-width:560px;border-collapse:collapse;background:var(--color-card);font-size:12px;}
th{padding:11px 12px;color:#FFFFFF;text-align:left;background:var(--black);border-right:1px solid #475569;border-bottom:0;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
th:last-child{border-right:0;}
td{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;}
td:last-child{border-right:0;}
tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even){background:var(--color-muted);}
tbody tr:hover{background:#DBEAFE;}
td .mono,td.mono{font-variant-numeric:tabular-nums;}
.mono{font-family:"Fira Code",monospace;font-size:11px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;}
td:nth-last-child(1) .badge{justify-content:center;}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  color:var(--color-foreground);
  background:var(--color-muted);
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  line-height:1.25;
  white-space:nowrap;
}
.badge::before{font-family:"Fira Code",monospace;font-weight:900;}
.b-ok{color:#065F46;background:#D1FAE5;}.b-ok::before{content:"✓";}
.b-wait{color:#854D0E;background:#FEF3C7;}.b-wait::before{content:"!";}
.b-run{color:#1E40AF;background:#DBEAFE;}.b-run::before{content:"→";}
.b-no{color:#991B1B;background:#FEE2E2;}.b-no::before{content:"×";}
.b-gray{color:#334155;background:#E2E8F0;}.b-gray::before{content:"•";}
.b-purple{color:#5B21B6;background:#EDE9FE;}.b-purple::before{content:"◆";}
.avatar{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;width:30px;height:30px;color:#FFFFFF;background:var(--color-primary);border:2px solid var(--black);border-radius:0;font-family:"Fira Code",monospace;font-size:11px;font-weight:700;}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.bar-mini{height:10px;min-width:62px;overflow:hidden;background:#E2E8F0;border:1px solid var(--black);border-radius:0;}
.bar-mini>i{display:block;height:100%;background:var(--color-primary);border-right:1px solid var(--black);border-radius:0;}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.col{min-width:0;padding:10px;background:var(--color-muted);border:2px solid var(--black);border-radius:0;}
.col-h{display:flex;align-items:center;gap:7px;margin:-10px -10px 10px;padding:10px;background:var(--color-card);border-bottom:2px solid var(--black);font-size:12px;font-weight:900;}
.col-h .dot{width:12px;height:12px;flex:0 0 auto;border:2px solid var(--black);border-radius:0;}
.col-h .cnt{margin-left:auto;padding:1px 7px;color:#FFFFFF;background:var(--black);border-radius:0;font-family:"Fira Code",monospace;font-size:10px;}
.card-mini{margin-bottom:10px;padding:11px;background:var(--color-card);border:2px solid var(--black);border-radius:0;box-shadow:3px 3px 0 var(--black);}
.card-mini:last-child{margin-bottom:0;}
.card-mini .cm-t{font-size:12px;font-weight:800;line-height:1.4;}
.card-mini .cm-id{margin-top:4px;color:var(--color-muted-foreground);font-size:10px;}
.card-mini .cm-foot{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--color-muted-foreground);font-size:10px;}
.card-mini .cm-foot .material-symbols-outlined{font-size:14px;}
.tl{position:relative;padding-left:30px;}
.tl::before{position:absolute;top:4px;bottom:4px;left:10px;width:3px;content:"";background:var(--black);}
.tl-item{position:relative;padding:0 0 20px 8px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;top:1px;left:-27px;width:18px;height:18px;background:#FFFFFF;border:5px solid var(--color-primary);border-radius:0;transform:rotate(45deg);}
.tl-dot.warn{border-color:var(--warn);}.tl-dot.info{border-color:var(--info);}.tl-dot.gray{border-color:#64748B;}
.tl-time{color:var(--color-muted-foreground);font-size:10px;font-weight:700;}
.tl-title{margin-top:2px;font-size:13px;font-weight:900;}
.tl-desc{margin-top:3px;color:var(--color-muted-foreground);font-size:11px;}
.steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:2px;}
.step{display:flex;align-items:center;gap:9px;min-width:150px;}
.step .num{display:flex;flex:0 0 auto;align-items:center;justify-content:center;width:34px;height:34px;color:#FFFFFF;background:var(--color-primary);border:2px solid var(--black);border-radius:0;font-family:"Fira Code",monospace;font-size:12px;font-weight:800;}
.step.todo .num{color:var(--color-muted-foreground);background:#FFFFFF;border-style:dashed;}
.step.done .num{color:#FFFFFF;background:var(--color-accent);}
.step.done .num::after{margin-left:2px;content:"✓";}
.step .st{font-size:12px;font-weight:900;}
.step .ss{color:var(--color-muted-foreground);font-size:10px;}
.step .line{flex:1 1 auto;height:3px;min-width:14px;margin:0 8px;background:var(--black);}
.seal{display:flex;flex:0 0 auto;flex-direction:column;align-items:center;justify-content:center;width:120px;height:120px;color:var(--danger);text-align:center;background:#FFF7F7;border:5px double var(--danger);border-radius:50%;box-shadow:none;font-weight:900;line-height:1.3;transform:rotate(-7deg);}
.seal .sl1{font-size:18px;letter-spacing:2px;}.seal .sl2{margin-top:3px;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;letter-spacing:1px;}.seal .sl3{margin-top:5px;font-family:"Fira Code",monospace;font-size:9px;font-weight:600;}
.doc-preview{display:flex;align-items:center;justify-content:center;gap:18px;padding:18px;background:#DBEAFE;border:2px dashed var(--black);border-radius:0;flex-wrap:wrap;}
.doc-paper{flex:1 1 220px;min-width:0;padding:16px;background:#FFFFFF;border:2px solid var(--black);border-radius:0;box-shadow:4px 4px 0 var(--black);}
.doc-paper .dl{height:8px;margin-bottom:9px;background:var(--line);border-radius:0;}.doc-paper .dl.s{width:60%;}.doc-paper .dl.m{width:85%;}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;}
.fld label{color:var(--color-foreground);font-size:11px;font-weight:900;}
.fld .inp{display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:9px 11px;color:var(--color-foreground);background:var(--color-muted);border:2px solid var(--black);border-radius:0;font-size:12px;}
.fld .inp .material-symbols-outlined{flex:0 0 auto;color:var(--color-primary);font-size:18px;}
.fld.full{grid-column:1/-1;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:6px 10px;color:var(--color-muted-foreground);background:#FFFFFF;border:2px solid var(--black);border-radius:0;font-size:11px;font-weight:800;}
.chip.on{color:#FFFFFF;background:var(--color-primary);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 17px;color:#FFFFFF;background:var(--color-accent);border:2px solid var(--black);border-radius:0;box-shadow:4px 4px 0 var(--black);font-size:12px;font-weight:900;transition:background-color 160ms ease,color 160ms ease,transform 160ms ease,box-shadow 160ms ease;}
.btn:hover{background:#047857;transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--black);}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--black);}
.btn .material-symbols-outlined{font-size:18px;}
.btn.ghost{color:var(--color-primary);background:#FFFFFF;}
.btn.ghost:hover{color:#FFFFFF;background:var(--color-primary);}
.vcard{display:flex;flex-direction:column;gap:11px;min-width:0;padding:16px;background:var(--color-card);border:2px solid var(--black);border-radius:0;box-shadow:5px 5px 0 var(--black);}
.vcard:nth-child(2){transform:translateY(9px);}
.vcard .vc-top{display:flex;align-items:center;gap:10px;}
.vc-ic{display:flex;flex:0 0 auto;align-items:center;justify-content:center;width:42px;height:42px;border:2px solid var(--black);border-radius:0;}
.vc-ic.g{color:#065F46;background:#D1FAE5;}.vc-ic.y{color:#854D0E;background:#FEF3C7;}.vc-ic.b{color:#1E40AF;background:#DBEAFE;}
.vc-ic .material-symbols-outlined{font-size:22px;}
.vc-name{font-size:14px;font-weight:900;}.vc-role{color:var(--color-muted-foreground);font-size:11px;}
.vc-body{color:var(--color-muted-foreground);font-size:11px;line-height:1.7;}
.vc-body .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);}
.vc-body .r:last-child{border-bottom:0;}.vc-body .r b{color:var(--color-foreground);font-weight:700;text-align:right;}
.note{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;color:#1E3A8A;background:#DBEAFE;border:2px solid var(--black);border-left:9px solid var(--color-primary);border-radius:0;font-size:12px;}
.note .material-symbols-outlined{flex:0 0 auto;margin-top:1px;color:var(--color-primary);font-size:20px;}
.section-t{display:flex;align-items:center;gap:8px;margin:24px 0 12px;color:var(--color-foreground);font-size:14px;font-weight:900;letter-spacing:.02em;}
.section-t::after{flex:1;height:3px;content:"";background:var(--black);}
.section-t .material-symbols-outlined{padding:4px;color:#FFFFFF;background:var(--color-primary);border:2px solid var(--black);font-size:18px;}
#screen>*{animation:grid-enter 400ms cubic-bezier(.34,1.56,.64,1) both;}
#screen>*:nth-child(2){animation-delay:60ms;}#screen>*:nth-child(3){animation-delay:120ms;}#screen>*:nth-child(4){animation-delay:180ms;}
@keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@media(max-width:1100px){
  .sidebar{width:244px;flex-basis:244px;}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:900px){
  .layout{flex-direction:column;}
  .sidebar{position:static;width:100%;height:auto;flex:0 0 auto;padding:12px;border-right:0;border-bottom:3px solid var(--black);overflow:visible;}
  .brand{margin:-12px -12px 12px;padding:12px;}
  .brand-mark{width:42px;height:42px;}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px;}
  .nav button{display:flex;justify-content:center;min-height:46px;padding:8px;box-shadow:2px 2px 0 var(--black);}
  .nav button.on::before{display:none;}
  .nav button .nt,.nav-idx{display:none;}
  .side-foot{display:none;}
  .main{padding:22px 18px 44px;}
  .grid2,.grid2b{grid-template-columns:1fr;}
}
@media(max-width:700px){
  .topbar{align-items:stretch;flex-direction:column;padding:16px;box-shadow:5px 5px 0 var(--black);}
  .tb-tag{margin-left:0;}
  .grid3,.form-grid{grid-template-columns:1fr;}
  .fld.full{grid-column:auto;}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
  .vcard:nth-child(2),.kpi:nth-child(2n){transform:none;}
}
@media(max-width:480px){
  body{background-size:24px 24px;}
  .main{padding:17px 12px 36px;}
  .topbar{margin-bottom:20px;}
  .topbar h1{font-size:23px;}

/* ---------- controller ---------- */
var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
var CHART=[chart0,null,chart2,chart3,chart4,chart5];
var container=document.getElementById("screen");
function show(i){
  var n=RENDER.length;
  if(i<0)i=0; if(i>n-1)i=n-1;
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=MODS[i].name;
  document.getElementById("scr-sub").textContent=MODS[i].sub;
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  if(CHART[i])CHART[i]();
  try{window.scrollTo(0,0);}catch(e){}
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
