<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>電子簽核用印系統 E-Signature / Digital Seal Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0f766e; --accent2:#5eead4; --accent-soft:#ccfbf1;
  --ink:#0f2422; --sub:#5b736f; --line:#e2ede9; --bg:#f2f7f5; --card:#ffffff;
  --warn:#b45309; --danger:#be123c; --ok:#0f766e; --info:#0369a1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.layout{display:flex;min-height:100vh;align-items:stretch;}
/* Sidebar */
.sidebar{
  width:256px;flex:0 0 256px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#134e4a);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 12px rgba(15,118,110,.28);}
.brand-mark .material-symbols-outlined{font-size:24px;}
.brand-txt{min-width:0;}
.brand-txt b{display:block;font-size:14px;font-weight:800;letter-spacing:.2px;line-height:1.3;}
.brand-txt span{display:block;font-size:11px;color:var(--sub);letter-spacing:.5px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;
  padding:11px 12px;border-radius:11px;cursor:pointer;color:var(--sub);font-family:inherit;
  font-size:13.5px;font-weight:600;text-align:left;transition:.16s;min-width:0;
}
.nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.nav button .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav button:hover{background:var(--bg);color:var(--ink);}
.nav button.on{background:linear-gradient(135deg,var(--accent),#115e59);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28);}
.nav button.on .material-symbols-outlined{color:var(--accent2);}
.nav-idx{margin-left:auto;font-size:11px;font-weight:700;opacity:.55;}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);line-height:1.5;}
.side-foot b{color:var(--accent);}
/* Main */
.main{flex:1 1 auto;min-width:0;padding:26px 30px 48px;}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.topbar .tb-info{min-width:0;}
.topbar h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px;}
.topbar .sub{font-size:13px;color:var(--sub);margin-top:2px;}
.tb-tag{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;}
.pill.ghost{background:#fff;border:1px solid var(--line);color:var(--sub);}
.pill .material-symbols-outlined{font-size:16px;}
/* Cards & grids */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden;min-width:0;}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:66px;height:66px;border-radius:50%;background:var(--accent-soft);opacity:.6;}
.kpi .kh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:600;position:relative;z-index:1;}
.kpi .kh .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .kv{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.5px;position:relative;z-index:1;}
.kpi .kv small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px;}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:600;position:relative;z-index:1;}
.kd.up{color:var(--ok);} .kd.down{color:var(--danger);} .kd.flat{color:var(--sub);}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px;}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.panel-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.panel-h .material-symbols-outlined{font-size:20px;color:var(--accent);}
.panel-h h3{margin:0;font-size:15px;font-weight:800;min-width:0;}
.panel-h .ph-sub{font-size:11.5px;color:var(--sub);margin-left:auto;font-weight:600;white-space:nowrap;}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
/* Table */
.tbl-scroll{overflow-x:auto;border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;letter-spacing:.3px;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:var(--bg);}
.mono{font-family:"Inter",monospace;font-weight:600;font-size:12.5px;letter-spacing:.3px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.b-ok{background:#d1fae5;color:#065f46;} .b-wait{background:#fef3c7;color:#92400e;}
.b-run{background:#e0f2fe;color:#075985;} .b-no{background:#ffe4e6;color:#9f1239;}
.b-gray{background:#e5eae8;color:#475569;} .b-purple{background:#ede9fe;color:#5b21b6;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:0 0 auto;}
.who{display:flex;align-items:center;gap:8px;}
.bar-mini{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:56px;}
.bar-mini > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
/* Board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.col{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.col-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;margin-bottom:10px;padding:2px 4px;}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.col-h .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--sub);}
.card-mini{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(15,36,34,.04);}
.card-mini:last-child{margin-bottom:0;}
.card-mini .cm-t{font-size:12.5px;font-weight:700;line-height:1.4;}
.card-mini .cm-id{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px;}
.card-mini .cm-foot{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--sub);}
.card-mini .cm-foot .material-symbols-outlined{font-size:14px;}
/* Timeline */
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px 6px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl-dot.warn{border-color:var(--warn);} .tl-dot.info{border-color:var(--info);} .tl-dot.gray{border-color:#94a3b8;}
.tl-time{font-size:11px;color:var(--sub);font-weight:700;}
.tl-title{font-size:13.5px;font-weight:700;margin-top:1px;}
.tl-desc{font-size:12px;color:var(--sub);margin-top:2px;}
/* Steps */
.steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:2px;}
.step{display:flex;align-items:center;gap:9px;min-width:150px;}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto;}
.step.todo .num{background:#fff;border:2px solid var(--line);color:var(--sub);}
.step.done .num{background:var(--ok);}
.step .st{font-size:12.5px;font-weight:700;}
.step .ss{font-size:11px;color:var(--sub);}
.step .line{flex:1 1 auto;height:2px;background:var(--line);margin:0 8px;min-width:14px;}
/* seal signature element */
.seal{width:120px;height:120px;border-radius:50%;border:4px double var(--danger);color:var(--danger);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1.3;flex:0 0 auto;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(190,18,60,.15);background:repeating-radial-gradient(circle,rgba(190,18,60,.04) 0 3px,transparent 3px 6px);}
.seal .sl1{font-size:18px;letter-spacing:2px;}
.seal .sl2{font-size:11px;font-weight:700;margin-top:3px;letter-spacing:1px;}
.seal .sl3{font-size:10px;font-weight:600;margin-top:5px;opacity:.85;}
.doc-preview{background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;}
.doc-paper{flex:1 1 220px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 4px 14px rgba(15,36,34,.06);}
.doc-paper .dl{height:8px;border-radius:4px;background:var(--line);margin-bottom:8px;}
.doc-paper .dl.s{width:60%;} .doc-paper .dl.m{width:85%;}
/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;}
.fld label{font-size:12px;font-weight:700;color:var(--sub);}
.fld .inp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);min-width:0;display:flex;align-items:center;gap:8px;}
.fld .inp .material-symbols-outlined{font-size:17px;color:var(--accent);flex:0 0 auto;}
.fld.full{grid-column:1/-1;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:default;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:11px 18px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 14px rgba(15,118,110,.24);}
.btn .material-symbols-outlined{font-size:18px;}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);box-shadow:none;}
/* verify cards */
.vcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.vcard .vc-top{display:flex;align-items:center;gap:10px;}
.vc-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.vc-ic.g{background:#d1fae5;color:#065f46;} .vc-ic.y{background:#fef3c7;color:#92400e;} .vc-ic.b{background:#e0f2fe;color:#075985;}
.vc-ic .material-symbols-outlined{font-size:22px;}
.vc-name{font-size:14px;font-weight:800;}
.vc-role{font-size:11.5px;color:var(--sub);}
.vc-body{font-size:12px;color:var(--sub);line-height:1.7;}
.vc-body .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);}
.vc-body .r:last-child{border-bottom:0;}
.vc-body .r b{color:var(--ink);font-weight:700;}
.note{background:var(--accent-soft);border:1px solid #99f6e4;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#134e4a;display:flex;gap:10px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:19px;color:var(--accent);flex:0 0 auto;margin-top:1px;}
.section-t{font-size:13px;font-weight:800;color:var(--sub);margin:2px 0 12px;display:flex;align-items:center;gap:7px;letter-spacing:.3px;}
.section-t .material-symbols-outlined{font-size:18px;color:var(--accent);}
/* Responsive */
@media(max-width:1000px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:860px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:6px;}
  .brand{border-bottom:0;margin-bottom:0;padding:0 12px 0 0;border-right:1px solid var(--line);margin-right:4px;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;flex:1 1 auto;}
  .nav button{width:auto;padding:9px 12px;}
  .nav-idx{display:none;}
  .side-foot{display:none;}
  .main{padding:20px 18px 40px;}
}
@media(max-width:820px){
  .grid2,.grid2b,.grid3,.form-grid{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .nav button .nt{display:none;}
  .nav button{padding:9px 11px;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .topbar h1{font-size:18px;}
  .main{padding:16px 13px 34px;}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="material-symbols-outlined">approval</span></div>

        <b>電子簽核用印</b>

      </div>

</div>

<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"簽核總覽儀表",sub:"待簽、逾期與用印量即時彙整"},
  {icon:"description",name:"文件提交申請",sub:"上傳文件、選擇印章與指定簽核路徑"},
  {icon:"verified",name:"身分驗證中心",sub:"多因素憑證驗證與簽署人身分確認"},
  {icon:"account_tree",name:"簽核用印流程",sub:"分層核決與線上用印審核關卡"},
  {icon:"shield",name:"印鑑與憑證管理",sub:"電子印章授權、額度與有效期控管"},
  {icon:"history",name:"稽核軌跡歸檔",sub:"簽署證跡、時戳與文件歸檔留存"}
];
var chartRegistry={};
function destroyCharts(){for(var k in chartRegistry){if(chartRegistry[k]){try{chartRegistry[k].destroy();}catch(e){}chartRegistry[k]=null;}}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function initials(nm){return String(nm||"?").slice(0,1);}

/* ---------- build nav ---------- */
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')">'+
       '<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="nt">'+MODS[i].name+'</span>'+
       '<span class="nav-idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
})();

/* ================= SCREEN 0 : Dashboard ================= */
function screen0(){
  var kpis=[
    {ic:"pending_actions",v:"37",u:"件",l:"待我簽核",d:"其中 6 件今日到期",cls:"down"},
    {ic:"schedule",v:"4.2",u:"小時",l:"平均簽核時效",d:"較上月 -38%",cls:"up"},
    {ic:"cloud_done",v:"81",u:"%",l:"遠端簽署使用率",d:"目標 75% 已達標",cls:"up"},
    {ic:"warning",v:"5",u:"件",l:"逾期未結案",d:"需主管介入",cls:"down"}
  ];
  var h='<div class="kpi-grid">';
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    h+='<div class="kpi"><div class="kh"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div>'+
       '<div class="kv">'+k.v+'<small>'+k.u+'</small></div>'+
       '<div class="kd '+k.cls+'">'+k.d+'</div></div>';
  }
  h+='</div>';

  h+='<div class="grid2">';
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">monitoring</span><h3>近 7 日用印與簽署量</h3><span class="ph-sub">單位：件</span></div><div class="chart-wrap" style="height:260px"><canvas id="c0a"></canvas></div></div>';
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">donut_large</span><h3>待辦文件分佈</h3><span class="ph-sub">依狀態</span></div><div class="chart-wrap" style="height:260px"><canvas id="c0b"></canvas></div></div>';
  h+='</div>';

  var rows=[
    {id:"DOC-25081401",t:"O晶科技 NDA 保密協議",type:"合約用印",who:"陳彥廷",lvl:"3/3",st:"逾期",cls:"b-no",due:"08-13"},
    {id:"DOC-25081402",t:"設備採購合約 A-柏昇機械",type:"合約用印",who:"林思妤",lvl:"2/3",st:"簽核中",cls:"b-run",due:"08-15"},
    {id:"DOC-25081405",t:"技術授權書-鴻齊光電",type:"公司大章",who:"黃冠宇",lvl:"1/3",st:"待簽",cls:"b-wait",due:"08-16"},
    {id:"DOC-25081409",t:"年度供應商評鑑報告",type:"騎縫章",who:"吳孟儒",lvl:"3/3",st:"已完成",cls:"b-ok",due:"08-12"},
    {id:"DOC-25081412",t:"人事任用核定單",type:"人事章",who:"張雅涵",lvl:"2/3",st:"簽核中",cls:"b-run",due:"08-15"}
  ];
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">fact_check</span><h3>優先待辦文件</h3><span class="ph-sub">依到期日排序</span></div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>文件編號</th><th>文件名稱</th><th>用印類型</th><th>承辦</th><th>進度</th><th>到期</th><th>狀態</th></tr></thead><tbody>';
  for(var r=0;r<rows.length;r++){var o=rows[r];

var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
var CHART=[chart0,null,chart2,chart3,chart4,chart5];
var container=document.getElementById("screen");
function show(i){
  var n=RENDER.length;
  if(i<0)i=0; if(i>n-1)i=n-1;
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=MODS[i].name;
  document.getElementById("scr-sub").textContent=MODS[i].sub;
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  if(CHART[i])CHART[i]();
  try{window.scrollTo(0,0);}catch(e){}
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
