<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>採購發票對帳協同系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b1220;--panel:#0f1b2d;--panel2:#132539;--line:#1e3450;
  --accent:#0369a1;--accent2:#38bdf8;--ink:#e2eaf3;--muted:#8ba3c0;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);
  color:var(--ink);line-height:1.55;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(56,189,248,.10),transparent),radial-gradient(900px 500px at -10% 10%,rgba(3,105,161,.14),transparent);
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:20;background:rgba(9,15,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 14px rgba(3,105,161,.5)}
.logo .ms{font-size:22px}
.brand-t{min-width:0}
.brand-t h1{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:6px 11px;border-radius:999px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
nav{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap;min-width:0}
.nav-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0}
.nav-btn .ms{font-size:19px}
.nav-btn:hover{color:var(--ink);border-color:var(--accent)}
.nav-btn.active{background:linear-gradient(135deg,rgba(3,105,161,.35),rgba(56,189,248,.18));color:#fff;border-color:var(--accent2)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0}
.screen-head h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;min-width:0}
.screen-head h2 .ms{color:var(--accent2);font-size:26px}
.screen-head p{color:var(--muted);font-size:13px;margin-top:3px}
.chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--accent2)}
.grid{display:grid;gap:14px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:1.6fr 1fr}
.g-1-2{grid-template-columns:1fr 1.7fr}
@media(max-width:820px){
  .g-kpi,.g-2,.g-3,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;min-width:0}
.card-h b{font-size:14px;font-weight:700}
.card-h .ms{font-size:18px;color:var(--accent2)}
.muted{color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.15),transparent 70%)}
.kpi .k-ic{width:34px;height:34px;border-radius:9px;background:rgba(3,105,161,.25);display:flex;align-items:center;justify-content:center;color:var(--accent2);margin-bottom:9px}
.kpi .k-ic .ms{font-size:19px}
.kpi .k-v{font-size:26px;font-weight:800;letter-spacing:.3px}
.kpi .k-l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .k-d{font-size:11px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:11px 12px;border-bottom:1px solid rgba(30,52,80,.6);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(56,189,248,.05)}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:rgba(34,197,94,.16);color:#6ee7a8}
.t-warn{background:rgba(245,158,11,.16);color:#fbca5b}
.t-bad{background:rgba(239,68,68,.16);color:#f79b9b}
.t-info{background:rgba(56,189,248,.16);color:#7dd3fc}
.t-mut{background:rgba(139,163,192,.16);color:#b8c8dc}
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart-box{position:relative;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col-h span.n{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:10px;margin-bottom:9px}
.tk b{font-size:12.5px;display:block;margin-bottom:5px}
.tk .tk-m{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tk.warn{border-left-color:var(--warn)}
.tk.bad{border-left-color:var(--bad)}
.tk.ok{border-left-color:var(--ok)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px 4px}
.tl-i::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:3px solid var(--panel);box-shadow:0 0 0 2px var(--accent)}
.tl-i.done::before{background:var(--ok)}
.tl-i.now::before{background:var(--warn)}
.tl-t{font-size:13px;font-weight:700}
.tl-d{font-size:12px;color:var(--muted);margin-top:2px}
.tl-time{font-size:11px;color:var(--accent2);font-weight:600}
.match-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-width:0}
@media(max-width:820px){.match-row{grid-template-columns:1fr}}
.mcol{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;min-width:0}
.mcol h5{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:9px;font-weight:700}
.mcol h5 .ms{font-size:16px}
.mline{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed rgba(30,52,80,.8)}
.mline:last-child{border-bottom:none}
.mline .v{font-weight:700}
.metric{margin-bottom:14px}
.metric:last-child{margin-bottom:0}
.metric-h{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.metric-h b{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:560px){
  .nav-btn span.lbl{display:none}
  .nav-btn{padding:9px 11px}
  .brand-live span.lbl{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="ms">fact_check</span></div>
    <div class="brand-t">
      <h1>採購發票對帳協同系統</h1>
      <p>SRM · 訂單／驗收／發票三方比對協同平台</p>
    </div>
    <div class="brand-live"><span class="dot"></span><span class="lbl">對帳引擎運行中</span></div>
  </div>
  <nav id="nav"></nav>
</header>
<main class="wrap">
  <div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-179-system-179/</div>
</main>
<script>
"use strict";
var NAV=[
  {ic:"receipt_long",t:"發票提交入口"},
  {ic:"fact_check",t:"三方自動比對"},
  {ic:"rule",t:"差異標記工單"},
  {ic:"task_alt",t:"核准與付款"},
  {ic:"account_tree",t:"對帳歸檔"},
  {ic:"monitoring",t:"對帳儀表板"}
];
var app=document.getElementById("app");
var chartReg={};
function destroyCharts(){for(var k in chartReg){if(chartReg[k]){try{chartReg[k].destroy();}catch(e){}chartReg[k]=null;}}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function baseGrid(){return{color:"rgba(56,189,248,.10)"};}
function tickColor(){return{color:"#8ba3c0",font:{size:11}};}

var INV=[
  {no:"INV-24081",sup:"O達精密",po:"PO-77120",amt:842500,items:12,stat:"matched",due:"08/22"},
  {no:"INV-24082",sup:"泰O五金",po:"PO-77133",amt:156800,items:5,stat:"diff",due:"08/20"},
  {no:"INV-24083",sup:"O鋼材料",po:"PO-77140",amt:1298000,items:20,stat:"pending",due:"08/25"},
  {no:"INV-24084",sup:"O揚電子",po:"PO-77151",amt:389200,items:8,stat:"matched",due:"08/23"},
  {no:"INV-24085",sup:"O茂塑膠",po:"PO-77162",amt:73400,items:3,stat:"diff",due:"08/19"},
  {no:"INV-24086",sup:"O信工業",po:"PO-77171",amt:521900,items:14,stat:"pending",due:"08/26"},
  {no:"INV-24087",sup:"O達精密",po:"PO-77188",amt:210500,items:6,stat:"matched",due:"08/24"}
];
var STATMAP={matched:["t-ok","已比對"],diff:["t-bad","有差異"],pending:["t-warn","比對中"]};

function s0(){
  var rows=INV.map(function(r){
    var s=STATMAP[r.stat]||["t-mut","--"];
    return '<tr><td class="mono">'+esc(r.no)+'</td><td>'+esc(r.sup)+'</td><td class="mono">'+esc(r.po)+'</td><td class="mono">$'+r.amt.toLocaleString()+'</td><td class="mono">'+r.items+'</td><td>'+r.due+'</td><td><span class="tag '+s[0]+'">'+s[1]+'</span></td></tr>';
  }).join("");
  return ''+
  head("receipt_long","發票提交入口","供應商線上開票、上傳附件，系統即時收件與辨識","收件佇列 · 7 張")+
  '<div class="grid g-kpi" style="margin-bottom:14px">'+
    kpi("upload_file","23","本日收件發票","up","+6 較昨日")+
    kpi("document_scanner","98.2%","OCR 辨識成功率","up","+1.4%")+
    kpi("pending_actions","4","待完成補件","down","-2")+
    kpi("schedule","2.4 分","平均收件處理","up","-0.8 分")+
  '</div>'+
  '<div class="grid g-1-2">'+
    '<div class="card"><div class="card-h"><b>收件來源占比</b><span class="ms">donut_large</span></div><div class="chart-box" style="height:230px"><canvas id="c0a"></canvas></div><div class="legend"><span><i style="background:#0369a1"></i>發票入口上傳</span><span><i style="background:#38bdf8"></i>EDI 自動介接</span><span><i style="background:#7dd3fc"></i>電子郵件收件</span></div></div>'+
    '<div class="card pad0"><div style="padding:16px 16px 0"><div class="card-h"><b>今日收件清單</b><span class="sub">供應商發票即時進件</span></div></div><div class="tbl-wrap"><table><thead><tr><th>發票號碼</th><th>供應商</th><th>對應訂單</th><th>金額</th><th>品項</th><th>付款到期</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '</div>'+
  '<div class="grid g-3" style="margin-top:14px">'+
    portlet("qr_code_scanner","線上開票入口","供應商登入後依 PO 帶出品項、稅率自動開立電子發票，減少人工重打。","已啟用 128 家供應商")+
    portlet("attach_file","附件與稅務檢核","上傳影像後系統自動抽取抬頭、統編、稅額並比對主檔一致性。","抽取欄位 12 項")+
    portlet("mark_email_read","收件回執","每張發票進件即回傳收件回執與案件編號，供應商可線上追蹤進度。","平均回執 8 秒")+
  '</div>';
}

function s1(){
  return ''+
  head("fact_check","三方自動比對","發票逐項勾稽採購訂單與驗收單，計算價差、量差與稅差","比對案件 INV-24082")+
  '<div class="grid g-2-1" style="margin-bottom:14px">'+
    '<div class="card"><div class="card-h"><b>三方比對明細 — INV-24082 泰O五金</b><span class="tag t-bad">偵測 2 項差異</span></div>'+
      '<div class="match-row">'+
        matchcol("shopping_cart","採購訂單 PO-77133",[["六角螺栓 M8","3,200 pcs"],["單價","$18.5"],["訂單金額","$59,200"],["含稅","$62,160"]])+
        matchcol("inventory_2","驗收單 GR-5521",[["實收數量","3,150 pcs"],["驗收合格","3,120 pcs"],["驗收金額","$57,720"],["驗收日","08/16"]])+
        matchcol("receipt_long","供應商發票",[["開票數量","3,200 pcs"],["單價","$19.2"],["發票金額","$61,440"],["稅額","$7,840"]])+
      '</div>'+
      '<div style="margin-top:14px" class="grid g-3">'+
        difftile("量差","開票 3,200 / 驗收 3,120","-80 pcs","bad")+
        difftile("價差","發票 $19.2 / 訂單 $18.5","+3.8%","warn")+
        difftile("稅差","計算稅額一致","$0","ok")+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="card-h"><b>比對容差設定</b><span class="ms">tune</span></div>'+
      metric("價格容差","≤ ±2%","72")+metric("數量容差","≤ ±1%","55")+metric("稅額容差","精準比對","100")+metric("交期容差","≤ 3 天","88")+
      '<div class="sub" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">超出容差項目將自動標記並開立差異工單，交由採購專員釐清。</div>'+
    '</div>'+
  '</div>'+
  '<div class="grid g-2">'+
    '<div class="card"><div class="card-h"><b>近 7 日三方比對結果</b><span class="ms">stacked_bar_chart</span></div><div class="chart-box" style="height:250px"><canvas id="c1a"></canvas></div></div>'+
    '<div class="card"><div class="card-h"><b>差異類型分布</b><span class="ms">pie_chart</span></div><div class="chart-box" style="height:250px"><canvas id="c1b"></canvas></div></div>'+
  '</div>';
}

function s2(){
  var cols=[
    {t:"待釐清",n:3,items:[
      tk("INV-24082 量差","泰O五金","-80 pcs","bad","王采潔"),
      tk("INV-24085 價差","O茂塑膠","+6.1%","warn","陳彥廷"),
      tk("INV-24091 缺驗收單","O鋼材料","無 GR 對應","bad","王采潔")
    ]},
    {t:"補件中",n:2,items:[
      tk("INV-24078 稅額差","O揚電子","$1,240","warn","供應商回覆"),
      tk("INV-24080 品名不符","O信工業","1 項","warn","供應商回覆")
    ]},
    {t:"已釐清",n:2,items:[
      tk("INV-24072 量差已補","O達精密","補驗收單","ok","已結清"),
      tk("INV-24069 價差核可","泰O五金","主管核可","ok","已結清")
    ]},
    {t:"退回重開",n:1,items:[
      tk("INV-24066 抬頭錯誤","O茂塑膠","統編不符","bad","已退回")
    ]}
  ];
  var board=cols.map(function(c){
    return '<div class="col"><div class="col-h">'+esc(c.t)+'<span class="n">'+c.n+'</span></div>'+c.items.join("")+'</div>';
  }).join("");
  return ''+
  head("rule","差異標記工單","超出容差的項目自動標記並開立差異工單，派給對應窗口處理","進行中 8 張")+
  '<div class="grid g-kpi" style="margin-bottom:14px">'+
    kpi("flag","8","進行中差異工單","down","-3 本週")+
    kpi("timer","1.6 天","平均結清時間","up","-0.5 天")+
    kpi("percent","3.1%","對帳差異率","up","-1.2%")+
    kpi("verified","91%","首次比對通過率","up","+4%")+
  '</div>'+
  '<div class="board">'+board+'</div>'+
  '<div class="grid g-2" style="margin-top:14px">'+
    '<div class="card"><div class="card-h"><b>差異工單老化分析</b><span class="ms">hourglass_top</span></div><div class="chart-box" style="height:240px"><canvas id="c2a"></canvas></div></div>'+
    '<div class="card"><div class="card-h"><b>差異責任歸屬 Top 供應商</b><span class="ms">leaderboard</span></div>'+
      '<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>供應商</th><th>差異件</th><th>金額影響</th><th>結清率</th></tr></thead><tbody>'+
        supprow("O茂塑膠",9,"$52,400","0.62")+
        supprow("泰O五金",6,"$31,900","0.78")+
        supprow("O鋼材料",4,"$88,200","0.55")+
        supprow("O揚電子",3,"$12,600","0.90")+
        supprow("O信工業",2,"$7,800","0.85")+
      '</tbody></table></div></div>'+
  '</div>';
}

function head(ic,t,d,chip){
  return '<div class="screen-head"><div><h2><span class="ms">'+ic+'</span>'+t+'</h2><p>'+d+'</p></div><span class="chip">'+chip+'</span></div>';
}
function kpi(ic,v,l,dir,d){
  var dd=d?'<div class="k-d '+(dir==="up"?"up":"down")+'"><span class="ms" style="font-size:14px">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+d+'</div>':'';
  return '<div class="kpi"><div class="k-ic"><span class="ms">'+ic+'</span></div><div class="k-v">'+v+'</div><div class="k-l">'+l+'</div>'+dd+'</div>';
}
function portlet(ic,t,d,foot){
  return '<div class="card"><div class="card-h"><b>'+t+'</b><span class="ms">'+ic+'</span></div><p class="sub" style="line-height:1.7">'+d+'</p><div class="tag t-info" style="margin-top:11px">'+foot+'</div></div>';
}
function matchcol(ic,t,lines){
  var body=lines.map(function(l){return '<div class="mline"><span class="muted">'+l[0]+'</span><span class="v">'+l[1]+'</span></div>';}).join("");
  return '<div class="mcol"><h5><span class="ms">'+ic+'</span>'+t+'</h5>'+body+'</div>';
}
function difftile(t,d,v,tone){
  var cls=tone==="ok"?"t-ok":tone==="warn"?"t-warn":"t-bad";
  return '<div class="card" style="background:var(--panel2);padding:12px"><div class="sub">'+t+'</div><div style="font-size:18px;font-weight:800;margin:4px 0"><span class="tag '+cls+'">'+v+'</span></div><div class="sub">'+d+'</div></div>';
}
function metric(l,v,pct){
  return '<div class="metric"><div class="metric-h"><span class="muted">'+l+'</span><b>'+v+'</b></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function tk(t,sup,val,tone,who){
  return '<div class="tk '+tone+'"><b>'+esc(t)+'</b><div class="tk-m"><span>'+esc(sup)+' · '+esc(val)+'</span><span>'+esc(who)+'</span></div></div>';
}
function tl(state,t,d,time){
  return '<div class="tl-i '+state+'"><div class="tl-t">'+t+'</div><div class="tl-d">'+d+'</div><div class="tl-time">'+time+'</div></div>';
}
function supprow(n,c,amt,rate){
  var pct=Math.round(parseFloat(rate)*100);
  return '<tr><td>'+n+'</td><td class="mono">'+c+'</td><td class="mono">'+amt+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+pct+'%"></i></div><span class="mono sub">'+pct+'%</span></div></td></tr>';
}
function alertrow(tone,t,d,lv){
  var cls=tone==="bad"?"t-bad":tone==="warn"?"t-warn":"t-info";
  var ic=tone==="bad"?"error":tone==="warn"?"warning":"info";
  return '<div style="display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(30,52,80,.6)"><span class="ms" style="color:var(--accent2);font-size:19px;flex:none">'+ic+'</span><div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:700">'+esc(t)+'</div><div class="sub">'+esc(d)+'</div></div><span class="tag '+cls+'" style="flex:none;align-self:center">'+lv+'</span></div>';
}

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  app.innerHTML=RENDER[i]();
  void app.offsetHeight;
  charts(i);
}

(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button class="nav-btn" data-i="'+i+'"><span class="ms">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
