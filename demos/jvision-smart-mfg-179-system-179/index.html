<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>採購發票對帳協同系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --panel:#fff;
  --panel2:#f1f5f9;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);
  line-height:1.55;
  background:
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
}
button{font:inherit}
button,.nav-btn{cursor:pointer}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:1.25rem;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
  backdrop-filter:blur(14px);
}
.brand{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  max-width:1440px;
  margin:auto;
  padding:14px 24px 11px;
}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid #1d4ed8;
  border-radius:5px;
  box-shadow:4px 4px 0 #dbeafe;
}
.logo .ms{font-size:23px}
.brand-t{min-width:0}
.brand-t h1{
  overflow:hidden;
  color:#0f172a;
  font-size:17px;
  font-weight:700;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand-t p{
  overflow:hidden;
  margin-top:1px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand-live{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  padding:6px 10px;
  color:#166534;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.dot{
  width:8px;
  height:8px;
  flex:none;
  border-radius:50%;
  background:#15803d;
  box-shadow:0 0 0 3px #dcfce7;
}
nav{
  display:flex;
  gap:2px;
  max-width:1440px;
  margin:auto;
  padding:0 24px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:46px;
  padding:9px 14px 11px;
  color:#475569;
  background:transparent;
  border:0;
  border-bottom:3px solid transparent;
  border-radius:4px 4px 0 0;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease;
}
.nav-btn:hover{color:#1d4ed8;background:#eff6ff}
.nav-btn.active{color:#1d4ed8;background:#eff6ff;border-bottom-color:var(--blue)}
.nav-btn:focus-visible,
button:focus-visible,
[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:2px;
}
.wrap{width:min(1440px,100%);margin:auto;padding:24px 24px 56px}
.screen-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  min-width:0;
  margin-bottom:18px;
  padding:19px 20px;
  background:linear-gradient(110deg,#fff 0%,#fff 60%,#eff6ff 100%);
  border:1px solid var(--line);
  border-left:4px solid var(--blue);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.screen-head h2{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  color:#0f172a;
  font-size:23px;
  font-weight:700;
  letter-spacing:-.02em;
}
.screen-head h2 .ms{color:var(--blue);font-size:26px}
.screen-head p{margin-top:3px;color:var(--muted);font-size:13px}
.chip{
  flex:none;
  padding:6px 10px;
  color:#1e40af;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:4px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.grid{display:grid;gap:12px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.card,.kpi{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card{
  padding:16px;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{
  border-color:#cbd5e1;
  box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.07);
  transform:translateY(-2px);
}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
  margin-bottom:12px;
}
.card-h b{color:#0f172a;font-size:14px;font-weight:700}
.card-h .ms{color:var(--blue);font-size:20px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12px}
.kpi{
  position:relative;
  overflow:hidden;
  padding:15px 16px;
  border-top:3px solid #cbd5e1;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi:hover{
  border-top-color:var(--blue);
  box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(37,99,235,.08);
  transform:translateY(-2px);
}
.kpi::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:54px;
  height:54px;
  background:linear-gradient(135deg,transparent 50%,#eff6ff 50%);
}
.kpi .k-ic{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  margin-bottom:9px;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-radius:4px;
}
.kpi .k-ic .ms{font-size:18px}
.kpi .k-v{
  color:#0f172a;
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .k-l{margin-top:2px;color:var(--muted);font-size:12px}
.kpi .k-d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:7px;
  font-size:11px;
  font-weight:700;
}
.up{color:#166534}.down{color:#991b1b}
.tbl-wrap{overflow-x:auto}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  color:#334155;
  font-size:12.5px;
}
th{
  padding:10px 12px;
  color:#334155;
  background:#f1f5f9;
  border-top:1px solid var(--line);
  border-bottom:1px solid #cbd5e1;
  font-size:11px;
  font-weight:700;
  letter-spacing:.025em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:10px 12px;
  border-bottom:1px solid #edf2f7;
  white-space:nowrap;
}
tbody tr:nth-child(even){background:#fbfdff}
tbody tr:hover{background:#eff6ff}
tr:last-child td{border-bottom:0}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td.mono,.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td.mono{text-align:right}
td:first-child.mono{text-align:left}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1.35;
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  flex:none;
  border-radius:50%;
  background:currentColor;
}
.t-ok{color:#166534;background:#f0fdf4}
.t-warn{color:#92400e;background:#fffbeb}
.t-bad{color:#991b1b;background:#fef2f2}
.t-info{color:#1e40af;background:#eff6ff}
.t-mut{color:#475569;background:#f8fafc}
.bar{
  min-width:60px;
  height:7px;
  overflow:hidden;
  background:#e2e8f0;
  border-radius:2px;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#1d4ed8,#3b82f6);
  border-radius:2px;
}
.chart-box{position:relative;overflow:hidden}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  min-width:0;
}
.col{
  min-width:0;
  padding:11px;
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  border-radius:var(--radius);
}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:2px 2px 9px;
  color:#334155;
  border-bottom:2px solid #cbd5e1;
  font-size:12.5px;
  font-weight:700;
}
.col-h span.n{
  padding:1px 7px;
  color:#334155;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:4px solid var(--blue);
  border-radius:4px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s ease,box-shadow .2s ease;
}
.tk:hover{transform:translateX(2px);box-shadow:0 4px 10px rgba(15,23,42,.08)}
.tk b{display:block;margin-bottom:5px;color:#1e293b;font-size:12px}
.tk .tk-m{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10.5px;flex-wrap:wrap}
.tk.warn{border-left-color:#b45309}
.tk.bad{border-left-color:#dc2626}
.tk.ok{border-left-color:#15803d}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:8px;
  width:2px;
  background:#cbd5e1;
}
.tl-i{position:relative;padding:0 0 18px 4px}
.tl-i::before{
  content:"";
  position:absolute;
  top:3px;
  left:-23px;
  width:11px;
  height:11px;
  background:#fff;
  border:3px solid #94a3b8;
  border-radius:50%;
}
.tl-i.done::before{background:#dcfce7;border-color:#15803d}
.tl-i.now::before{background:#ffedd5;border-color:#c2410c;box-shadow:0 0 0 3px #fed7aa}
.tl-t{color:#1e293b;font-size:12.5px;font-weight:700}
.tl-d{margin-top:2px;color:var(--muted);font-size:11.5px}
.tl-time{
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.match-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcol{
  min-width:0;
  padding:12px;
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:4px;
}
.mcol h5{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;
  color:#334155;
  font-size:11.5px;
  font-weight:700;
}
.mcol h5 .ms{color:var(--blue);font-size:16px}
.mline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px dashed #cbd5e1;
  font-size:11.5px;
}
.mline:last-child{border-bottom:0}
.mline .v{font-family:"Fira Code",monospace;font-weight:600;text-align:right}
.metric{margin-bottom:13px}
.metric:last-child{margin-bottom:0}
.metric-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-size:11.5px}
.metric-h b{font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:middle}
.foot{
  margin-top:30px;
  padding-top:18px;
  color:#64748b;
  border-top:1px solid var(--line);
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
#app>.screen-head,
#app>.grid,
#app>.board,
#app>.card{
  animation:reveal .4s cubic-bezier(.2,.75,.25,1) both;
}
#app>.grid:nth-child(2),#app>.board:nth-child(2),#app>.card:nth-child(2){animation-delay:.05s}
#app>.grid:nth-child(3),#app>.board:nth-child(3),#app>.card:nth-child(3){animation-delay:.1s}
#app>.grid:nth-child(4),#app>.board:nth-child(4),#app>.card:nth-child(4){animation-delay:.15s}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1,.g-1-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .brand{padding:11px 16px 9px}
  nav{padding:0 16px}
  .wrap{padding:18px 16px 44px}
  .screen-head{align-items:flex-start;padding:16px}
  .screen-head h2{font-size:20px}
  .g-2,.g-3,.match-row{grid-template-columns:1fr}
}
@media(max-width:520px){
  .brand{grid-template-columns:auto minmax(0,1fr)}
  .brand-live{display:none}
  .brand-t p{display:none}
  nav{gap:1px;padding:0 10px}
  .nav-btn{min-width:48px;min-height:48px;padding:10px 13px}
  .nav-btn .lbl{display:none}
  .wrap{padding:14px 12px 38px}
  .screen-head{display:block;margin-bottom:12px;padding:14px}
  .screen-head p{font-size:12px}
  .chip{display:inline-block;margin-top:10px}
  .g-kpi,.board{grid-template-columns:1fr}
  .card,.kpi{padding:14px}
  .kpi{display:grid;grid-template-columns:auto 1fr;column-gap:11px}
  .kpi .k-ic{grid-row:1/4;margin:0}
  .kpi .k-v{font-size:22px}
  .kpi .k-d{grid-column:2}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #app>*{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="ms">fact_check</span></div>
    <div class="brand-t">
      <h1>採購發票對帳協同系統</h1>
      <p>SRM · 訂單／驗收／發票三方比對協同平台</p>
    </div>
    <div class="brand-live" role="status"><span class="dot" aria-hidden="true"></span><span class="lbl">對帳引擎運行中</span></div>
  </div>
  <nav id="nav" aria-label="系統功能"></nav>
</header>
<main class="wrap">
  <div id="app"></div>
  <div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · /demos/jvision-smart-mfg-179-system-179/</div>
</main>
<script>
"use strict";
var NAV=[
  {ic:"receipt_long",t:"發票提交入口"},
  {ic:"fact_check",t:"三方自動比對"},
  {ic:"rule",t:"差異標記工單"},
  {ic:"task_alt",t:"核准與付款"},
  {ic:"account_tree",t:"對帳歸檔"},
  {ic:"monitoring",t:"對帳儀表板"}
];
var app=document.getElementById("app");
var chartReg={};
function destroyCharts(){
  for(var k in chartReg){
    if(chartReg[k]){
      try{chartReg[k].destroy()}catch(e){}
      chartReg[k]=null;
    }
  }
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function baseGrid(){return{color:"rgba(148,163,184,.18)"}}
function tickColor(){return{color:"#475569",font:{family:"Fira Code",size:10}}}

var INV=[
  {no:"INV-24081",sup:"O達精密",po:"PO-77120",amt:842500,items:12,stat:"matched",due:"08/22"},
  {no:"INV-24082",sup:"泰O五金",po:"PO-77133",amt:156800,items:5,stat:"diff",due:"08/20"},
  {no:"INV-24083",sup:"O鋼材料",po:"PO-77140",amt:1298000,items:20,stat:"pending",due:"08/25"},
  {no:"INV-24084",sup:"O揚電子",po:"PO-77151",amt:389200,items:8,stat:"matched",due:"08/23"},
  {no:"INV-24085",sup:"O茂塑膠",po:"PO-77162",amt:73400,items:3,stat:"diff",due:"08/19"},
  {no:"INV-24086",sup:"O信工業",po:"PO-77171",amt:521900,items:14,stat:"pending",due:"08/26"},
  {no:"INV-24087",sup:"O達精密",po:"PO-77188",amt:210500,items:6,stat:"matched",due:"08/24"}
];
var STATMAP={
  matched:["t-ok","已比對"],
  diff:["t-bad","有差異"],
  pending:["t-warn","比對中"]
};

function s0(){
  var rows=INV.map(function(r){
    var s=STATMAP[r.stat]||["t-mut","--"];
    return '<tr><td class="mono">'+esc(r.no)+'</td><td>'+esc(r.sup)+'</td><td class="mono">'+esc(r.po)+'</td><td class="mono">$'+r.amt.toLocaleString()+'</td><td class="mono">'+r.items+'</td><td class="mono">'+r.due+'</td><td><span class="tag '+s[0]+'">'+s[1]+'</span></td></tr>';
  }).join("");
  return head("receipt_long","發票提交入口","供應商線上開票、上傳附件，系統即時收件與辨識","收件佇列 · 7 張")+
  '<div class="grid g-kpi" style="margin-bottom:12px">'+
    kpi("upload_file","23","本日收件發票","up","+6 較昨日")+
    kpi("document_scanner","98.2%","OCR 辨識成功率","up","+1.4%")+
    kpi("pending_actions","4","待完成補件","down","-2")+
    kpi("schedule","2.4 分","平均收件處理","up","-0.8 分")+

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("active",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  app.innerHTML=RENDER[i]();
  void app.offsetHeight;
  charts(i);
}
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button type="button" class="nav-btn" data-i="'+i+'" aria-label="'+NAV[i].t+'"><span class="ms" aria-hidden="true">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      location.hash="v"+this.getAttribute("data-i");
    });
  }
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
