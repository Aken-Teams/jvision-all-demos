<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>原物料期貨避險管理系統｜Jvision 系統 Demo</title>
  <meta name="description" content="現貨曝險評估、避險策略、期貨建倉、損益監控到結算對帳的原物料避險管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#E2E8F0;
      --good:#15803D;
      --bad:#B91C1C;
      --warn:#A84B05;
      --black:#0F172A;
      --grid:rgba(37,99,235,.075);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    html,body{margin:0;min-height:100%}
    body{
      color:var(--ink);
      background-color:var(--color-background);
      background-image:
        linear-gradient(var(--grid) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:32px 32px;
      font-family:"Fira Sans",system-ui,-apple-system,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,.navbtn{cursor:pointer}
    button:focus-visible,.navbtn:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
      position:relative;
      z-index:10;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:500;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .layout{display:flex;min-height:100vh;align-items:stretch}
    .side{
      width:270px;
      flex:0 0 270px;
      min-width:0;
      height:100vh;
      padding:20px 14px 16px;
      display:flex;
      flex-direction:column;
      gap:8px;
      position:sticky;
      top:0;
      z-index:20;
      color:#DBEAFE;
      background:var(--black);
      border-right:4px solid var(--color-primary);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin:-20px -14px 12px;
      padding:22px 18px 20px;
      background:var(--color-primary);
      border-bottom:4px solid #000;
      color:#fff;
    }
    .brand .logo{
      width:46px;
      height:46px;
      flex:0 0 46px;
      display:grid;
      place-items:center;
      color:#000;
      background:#fff;
      border:3px solid #000;
      box-shadow:5px 5px 0 #000;
    }
    .brand .logo .material-symbols-outlined{font-size:27px}
    .brand .bt{min-width:0}
    .brand .bt b{
      display:block;
      font-size:17px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .brand .bt span{display:block;margin-top:2px;font-size:11px;color:#DBEAFE}
    .nav{display:flex;flex-direction:column;gap:7px}
    .navbtn{
      width:100%;
      min-height:48px;
      padding:10px 11px;
      display:flex;
      align-items:center;
      gap:11px;
      border:2px solid transparent;
      border-radius:0;
      color:#CBD5E1;
      background:transparent;
      text-align:left;
      font-size:13px;
      font-weight:700;
    }
    .navbtn:hover{color:#fff;background:#1E293B;border-color:#64748B}
    .navbtn.on{
      color:#000;
      background:#fff;
      border-color:#000;
      box-shadow:6px 6px 0 var(--color-primary);
      transform:translate(-2px,-2px);
    }
    .navbtn .ic{width:24px;display:flex;justify-content:center;flex:0 0 24px}
    .navbtn .ic .material-symbols-outlined{font-size:21px}
    .navbtn .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .navbtn .no{
      margin-left:auto;
      color:#94A3B8;
      font-family:"Fira Code",monospace;
      font-size:10px;
      font-weight:700;
    }
    .navbtn.on .no{color:var(--color-primary)}
    .side .foot{
      margin-top:auto;
      padding:14px 10px 2px;
      border-top:2px solid #334155;
      color:#94A3B8;
      font:11px/1.6 "Fira Code",monospace;
    }
    .side .foot b{color:#fff}
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{
      min-height:88px;
      padding:15px 26px;
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      position:sticky;
      top:0;
      z-index:15;
      color:var(--ink);
      background:rgba(248,250,252,.96);
      border-bottom:3px solid var(--black);
    }
    .topbar .htxt{min-width:0}
    .topbar h1{
      margin:0;
      font-size:21px;
      font-weight:800;
      letter-spacing:-.025em;
    }
    .topbar .sub{margin-top:2px;color:var(--muted);font-size:12px}
    .topbar .spacer{flex:1}
    .chip{
      min-height:36px;
      padding:6px 10px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      border:2px solid var(--black);
      border-radius:0;
      background:#fff;
      color:var(--ink);
      font-size:11px;
      font-weight:700;
      box-shadow:3px 3px 0 var(--black);
    }
    .chip .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
    .chip.live{background:#DCFCE7;color:#14532D}
    .chip.live .dot{
      width:9px;
      height:9px;
      display:inline-block;
      background:var(--good);
      border:2px solid #14532D;
    }
    .wrap{width:100%;max-width:1600px;margin:auto;padding:26px 28px 48px;min-width:0}
    .scr-h{
      display:inline-block;
      margin:0 0 8px;
      padding:7px 11px;
      color:#fff;
      background:var(--color-primary);
      border:3px solid var(--black);
      box-shadow:5px 5px 0 var(--black);
      font-size:18px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .scr-d{max-width:920px;margin:7px 0 23px;color:var(--muted);font-size:13px}
    .grid{display:grid;gap:16px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1.6fr 1fr}
    .g-2e{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:repeat(3,1fr)}
    .g-side{grid-template-columns:1fr 320px}
    .card,.kpi{
      min-width:0;
      border:3px solid var(--black);
      border-radius:0;
      background:var(--color-card);
      box-shadow:7px 7px 0 var(--black);
    }
    .card{padding:17px}
    .card h3{
      margin:0 0 4px;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      font-weight:800;
      letter-spacing:-.01em;
    }
    .card h3 .material-symbols-outlined{
      width:29px;
      height:29px;
      display:grid;
      place-items:center;
      flex:0 0 29px;
      color:#fff;
      background:var(--color-primary);
      border:2px solid var(--black);
      font-size:17px;
    }
    .card .ch-sub{margin-bottom:14px;color:var(--muted);font-size:11.5px}
    .kpi{
      min-height:144px;
      padding:17px 16px 15px;
      position:relative;
      overflow:hidden;
    }
    .kpi:nth-child(odd){transform:translateY(-3px)}
    .kpi:nth-child(even){transform:translateY(4px)}
    .kpi::after{
      content:"";
      position:absolute;
      right:-20px;
      bottom:-35px;
      width:80px;
      height:80px;
      background:var(--color-muted);
      border:3px solid var(--black);
      transform:rotate(24deg);
    }
    .kpi .kl{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:11.5px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.035em;
    }
    .kpi .kl .material-symbols-outlined{
      width:26px;
      height:26px;
      display:grid;
      place-items:center;
      color:#fff;
      background:var(--color-primary);
      border:2px solid var(--black);
      font-size:16px;
    }
    .kpi .kv{
      margin-top:9px;
      position:relative;
      z-index:1;
      font:700 26px/1.2 "Fira Code",monospace;
      letter-spacing:-.055em;
    }
    .kpi .kd{
      margin-top:7px;
      display:flex;
      align-items:center;
      gap:4px;
      position:relative;
      z-index:1;
      font-size:11px;
      font-weight:700;
    }
    .kpi .kd .material-symbols-outlined{font-size:15px}
    .up{color:var(--good)}
    .down{color:var(--bad)}
    .flat{color:var(--muted)}
    .chart-wrap{position:relative;width:100%;overflow:hidden}
    .tbl-scroll{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      border:2px solid var(--black);
    }
    table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
    th,td{
      padding:10px 11px;
      border-right:1px solid #CBD5E1;
      border-bottom:1px solid #CBD5E1;
      white-space:nowrap;
      text-align:left;
    }
    th:last-child,td:last-child{border-right:0}
    tbody tr:last-child td{border-bottom:0}
    th{
      position:sticky;
      top:0;
      z-index:2;
      color:#fff;
      background:var(--black);
      font-size:10.5px;
      font-weight:700;
      letter-spacing:.035em;
      text-transform:uppercase;
    }
    td{font-weight:500}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    tbody tr:nth-child(even){background:#F1F5F9}
    tbody tr:hover{background:#DBEAFE}
    .mono,.kv,.mv,.lv,.rv,.tt,.no{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:4px;
      min-height:25px;
      padding:2px 7px;
      border:2px solid currentColor;
      border-radius:0;
      font-size:10.5px;
      font-weight:700;
    }
    .t-green{color:#14532D;background:#DCFCE7}
    .t-red{color:#7F1D1D;background:#FEE2E2}
    .t-orange{color:#7C2D12;background:#FFEDD5}
    .t-blue{color:#1E3A8A;background:#DBEAFE}
    .t-gray{color:#334155;background:#E2E8F0}
    .t-amber{color:#713F12;background:#FEF3C7}
    .pos{color:#166534;font-weight:800}
    .neg{color:#991B1B;font-weight:800}
    .bar{
      height:11px;
      min-width:70px;
      overflow:hidden;
      background:#E2E8F0;
      border:2px solid var(--black);
      border-radius:0;
    }
    .bar>i{display:block;height:100%;background:var(--color-primary)}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0}
    .col{
      min-width:0;
      padding:10px;
      background:var(--color-muted);
      border:2px solid var(--black);
    }
    .col .ct{
      margin-bottom:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
    }
    .col .ct span.n{
      padding:1px 7px;
      color:#fff;
      background:var(--black);
      border:2px solid var(--black);
      font:700 10px "Fira Code",monospace;
    }
    .tk{
      margin-bottom:9px;
      padding:10px;
      background:#fff;
      border:2px solid var(--black);
      box-shadow:4px 4px 0 var(--color-primary);
    }
    .tk:last-child{margin-bottom:0}
    .tk .tkh{display:flex;justify-content:space-between;gap:7px;font-size:11.5px;font-weight:800}
    .tk .tkm{margin-top:5px;color:var(--muted);font-size:10.5px;line-height:1.5}
    .tl{position:relative;padding-left:25px}
    .tl::before{
      content:"";
      position:absolute;
      left:7px;
      top:4px;
      bottom:4px;
      width:3px;
      background:var(--black);
    }
    .tli{position:relative;padding:0 0 17px 5px}
    .tli:last-child{padding-bottom:0}
    .tli::before{
      content:"";
      position:absolute;
      left:-23px;
      top:2px;
      width:13px;
      height:13px;
      background:var(--color-accent);
      border:3px solid var(--black);
    }
    .tli.done::before{background:#22C55E}
    .tli.wait::before{background:#CBD5E1}
    .tli .th{font-size:12px;font-weight:800}
    .tli .tm{margin-top:2px;color:var(--muted);font-size:11px}
    .tli .tt{margin-top:2px;color:#9A3412;font-size:10px;font-weight:700}
    .gauge{display:flex;align-items:center;gap:16px}
    .donut-wrap{width:150px;height:150px;position:relative;flex:0 0 150px}
    .donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .donut-c b{font:700 25px/1 "Fira Code",monospace}
    .donut-c span{margin-top:4px;color:var(--muted);font-size:10px}
    .legend{display:flex;flex:1;flex-direction:column;gap:9px;min-width:0}
    .legend .li{display:flex;align-items:center;gap:8px;min-width:0;font-size:11px}
    .legend .sw{width:13px;height:13px;flex:0 0 13px;border:2px solid var(--black)}
    .legend .lv{margin-left:auto;font-weight:700}
    .strat{display:flex;flex-direction:column;gap:15px}
    .srow{min-width:0}
    .srow .sh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:11.5px;font-weight:700}
    .srow .sh .rv{color:#9A3412;font-weight:700}
    .alertbox{
      margin-bottom:10px;
      padding:11px 12px;
      display:flex;
      align-items:flex-start;
      gap:10px;
      border:2px solid currentColor;
      border-radius:0;
    }
    .alertbox .material-symbols-outlined{margin-top:1px;flex:0 0 20px;font-size:20px}
    .alertbox .abt{min-width:0}
    .alertbox .abt b{display:block;font-size:12px}
    .alertbox .abt span{display:block;margin-top:2px;font-size:11px;line-height:1.5}
    .a-red{color:#7F1D1D;background:#FEF2F2}
    .a-amber{color:#713F12;background:#FFFBEB}
    .a-blue{color:#1E3A8A;background:#EFF6FF}
    .a-green{color:#14532D;background:#F0FDF4}
    .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mini{
      min-width:0;
      padding:11px;
      background:var(--color-muted);
      border:2px solid var(--black);
    }
    .mini .ml{color:var(--muted);font-size:10.5px;font-weight:700}
    .mini .mv{margin-top:4px;font-size:18px;font-weight:700}
    .mini .ms{margin-top:3px;font-size:10px;font-weight:700}
    .steps{display:flex;gap:0;margin-bottom:20px}
    .step{
      min-width:80px;
      flex:1;
      padding:0 5px;
      position:relative;
      text-align:center;
    }
    .step::before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:16px;
      height:3px;
      z-index:-1;
      background:var(--black);
    }
    .step .sc{
      width:34px;
      height:34px;
      margin:0 auto 7px;
      display:grid;
      place-items:center;
      color:var(--muted);
      background:#fff;
      border:3px solid var(--black);
      font:700 12px "Fira Code",monospace;
    }
    .step.don .sc{color:#fff;background:var(--good)}
    .step.act .sc{color:#000;background:var(--color-accent);box-shadow:4px 4px 0 var(--black)}
    .step .st{font-size:11px;font-weight:800}
    .step .ss{margin-top:1px;color:var(--muted);font-size:10px}
    .divider{height:3px;margin:17px 0;background:var(--black)}
    .flex{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
    .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
    .btn{
      min-height:42px;
      padding:8px 14px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:var(--ink);
      background:#fff;
      border:3px solid var(--black);
      border-radius:0;
      box-shadow:4px 4px 0 var(--black);
      font-size:12px;
      font-weight:800;
    }
    .btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--black)}
    .btn.pri{color:#000;background:var(--color-accent)}
    .btn .material-symbols-outlined{font-size:18px}
    @keyframes gridIn{
      from{opacity:0;transform:translateY(16px) scale(.92)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .grid>*{
      animation:gridIn .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    .grid>*:nth-child(2){animation-delay:.06s}
    .grid>*:nth-child(3){animation-delay:.12s}
    .grid>*:nth-child(4){animation-delay:.18s}
    @media(max-width:1180px){.g-side{grid-template-columns:1fr}}
    @media(max-width:900px){
      .layout{flex-direction:column}
      .side{
        width:100%;
        height:auto;
        padding:12px;
        position:static;
        flex:none;
        border-right:0;
        border-bottom:4px solid var(--color-primary);
      }
      .brand{margin:-12px -12px 8px;padding:14px}
      .brand .logo{width:40px;height:40px;flex-basis:40px}
      .nav{flex-direction:row;overflow-x:auto;padding:2px 2px 8px}
      .navbtn{width:auto;min-width:max-content}
      .navbtn .no{display:none}
      .side .foot{display:none}
      .topbar{position:static;padding:13px 16px}
      .wrap{padding:22px 16px 38px}
    }
    @media(max-width:820px){
      .g-kpi{grid-template-columns:repeat(2,1fr)}
      .g-2,.g-2e,.g-3,.g-side{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
      .mgrid{grid-template-columns:1fr}
      .mgrid2{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .topbar .spacer{display:none}
      .chip{max-width:100%}
      .navbtn .tx{display:none}
      .navbtn{min-width:48px;justify-content:center;padding:9px}
      .g-kpi{grid-template-columns:1fr}
      .kpi:nth-child(n){transform:none}
      .board{grid-template-columns:1fr}
      .gauge{flex-direction:column;align-items:stretch}
      .donut-wrap{margin:auto}
      .steps{overflow-x:auto;padding-bottom:5px}
      .step{min-width:92px}
      .scr-h{font-size:16px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      .grid>*{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">trending_up</span></div>
        <div class="bt"><b>HedgeCtrl</b><span>原物料期貨避險管理</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能"></nav>
      <div class="foot"><b>資料截止</b> 2026/08/14 09:41<br />資料為展示用途，非實際交易帳戶。</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="htxt">
          <h1 id="scr-title">曝險部位總覽</h1>
          <div class="sub" id="scr-sub">現貨採購曝險與敞口即時彙整</div>
        </div>
        <div class="spacer"></div>
        <span class="chip live"><span class="dot" aria-hidden="true"></span>行情連線正常</span>
        <span class="chip"><span class="material-symbols-outlined">account_balance_wallet</span>避險帳戶 HDG-0088</span>
      </header>
      <div class="wrap" id="view"></div>
    </main>
  </div>
  <script>
  (function(){
    "use strict";

    function chartOptions(title,stacked){
      return{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{family:"Fira Sans",size:11}}}},scales:{y:{grid:{color:C.line},stacked:!!stacked,title:{display:!!title,text:title||""}},x:{grid:{display:false},stacked:!!stacked}}}
    }
    function kpi(icon,label,val,dic,dtxt,dir){
      var cls=dir==="up"?"up":dir==="down"?"down":"flat";
      return'<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+esc(label)+'</div><div class="kv">'+esc(val)+'</div><div class="kd '+cls+'"><span class="material-symbols-outlined">'+dic+'</span>'+esc(dtxt)+'</div></div>'
    }
    function srow(label,rv,pct){return'<div class="srow"><div class="sh"><span>'+esc(label)+'</span><span class="rv">'+esc(rv)+'</span></div><div class="bar" style="min-width:0;width:100%"><i style="width:'+pct+'%"></i></div></div>'}
    function mini(label,val,sub,dir){var cls=dir==="up"?"up":dir==="down"?"down":"flat";return'<div class="mini"><div class="ml">'+esc(label)+'</div><div class="mv">'+esc(val)+'</div><div class="ms '+cls+'">'+esc(sub)+'</div></div>'}
    function policy(clr,ic,t,d){return'<div class="alertbox a-'+clr+'"><span class="material-symbols-outlined">'+ic+'</span><div class="abt"><b>'+esc(t)+'</b><span>'+esc(d)+'</span></div></div>'}
    function stp(cls,n,t,s){return'<div class="step '+cls+'"><div class="sc">'+(cls==="don"?'<span class="material-symbols-outlined" style="font-size:17px">check</span>':n)+'</div><div class="st">'+esc(t)+'</div><div class="ss">'+esc(s)+'</div></div>'}
    function lg(color,label,val){return'<div class="li"><span class="sw" style="background:'+color+'"></span><span>'+esc(label)+'</span><span class="lv">'+esc(val)+'</span></div>'}
    function boardCol(title,n,items){var cards=items.map(function(it){return'<div class="tk"><div class="tkh"><span>'+esc(it.t)+'</span><span class="tag '+it.tag+'" style="font-size:10px">'+esc(it.tl)+'</span></div><div class="tkm">'+esc(it.m)+'</div></div>'}).join("");return'<div class="col"><div class="ct">'+esc(title)+'<span class="n">'+n+'</span></div>'+cards+'</div>'}

    function tl(cls,t,m,time){return'<div class="tli '+cls+'"><div class="th">'+esc(t)+'</div><div class="tm">'+esc(m)+'</div><div class="tt">'+esc(time)+'</div></div>'}
    function marg(name,rate,cls){
      var pct=Math.min(100,Math.round(rate/350*100));
      var color=cls==="good"?"#15803D":"#EA580C";
      return'<div class="srow" style="margin-bottom:12px"><div class="sh"><span>'+esc(name)+'</span><span class="rv" style="color:'+color+'">'+rate+'%</span></div><div class="bar" style="width:100%"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>'
    }
    var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
    function buildNav(){
      var nav=document.getElementById("nav");
      nav.innerHTML=MODS.map(function(m,i){return'<button class="navbtn" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="ic"><span class="material-symbols-outlined">'+m.icon+'</span></span><span class="tx">'+esc(m.name)+'</span><span class="no">0'+(i+1)+'</span></button>'}).join("");
      Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})
    }
    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      var m=MODS[i];
      document.getElementById("scr-title").textContent=m.name;
      document.getElementById("scr-sub").textContent=m.desc;
      Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
        var on=+b.getAttribute("data-i")===i;
        b.classList.toggle("on",on);
        b.setAttribute("aria-current",on?"page":"false")
      });
      Object.keys(charts).forEach(function(k){destroyChart(k)});
      document.getElementById("view").innerHTML="";
      SCREENS[i]()
    }
    buildNav();
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0)}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
