<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採購潛在供應商開發管理｜控制中心</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --ok:#047857;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  min-height:100vh;
  color:var(--color-foreground);
  background:
    linear-gradient(var(--color-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-border) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(248,250,252,.97);
  border-bottom:3px solid var(--ink);
}
.tb-in{
  max-width:1440px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
}
.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font:500 11px/1.4 "Fira Code",monospace}
.tb-spacer{flex:1}
.sys-state,.clock{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  font:600 11px "Fira Code",monospace;
  white-space:nowrap;
}
.state-mark{width:10px;height:10px;background:var(--ok);border:2px solid var(--ink)}
.primary-action{
  min-height:40px;
  padding:9px 16px;
  color:#fff;
  background:var(--color-accent);
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  font-weight:700;
}
.primary-action:hover{background:#C2410C;transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.tabs{
  max-width:1440px;
  margin:auto;
  padding:0 20px 12px;
  display:flex;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tab{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  padding:9px 14px;
  color:var(--muted);
  background:#fff;
  border:2px solid var(--ink);
  border-right:0;
  font-size:13px;
  font-weight:600;
}
.tab:last-child{border-right:2px solid var(--ink)}
.tab:hover{color:var(--ink);background:var(--color-muted)}
.tab.on{color:#fff;background:var(--color-primary)}
main{max-width:1440px;margin:auto;padding:28px 20px 72px}
.scr-head{
  position:relative;
  min-height:170px;
  margin:0 0 24px;
  padding:28px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:18px;
  overflow:hidden;
  color:#fff;
  background:var(--ink);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.scr-head::after{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  right:-80px;
  top:-140px;
  background:var(--color-primary);
  border:3px solid #fff;
  transform:rotate(18deg);
}
.scr-copy{position:relative;z-index:1;max-width:760px}
.eyebrow{
  display:inline-block;
  margin-bottom:14px;
  padding:5px 8px;
  color:var(--ink);
  background:#fff;
  border:2px solid #fff;
  font:700 11px "Fira Code",monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.scr-head h1{margin:0;font-size:clamp(27px,4vw,48px);line-height:1.05;letter-spacing:-.035em}
.scr-head p{margin:14px 0 0;color:#E2E8F0;font-size:14px}
.badge{
  position:relative;
  z-index:1;
  align-self:start;
  padding:7px 10px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid #fff;
  font:700 11px "Fira Code",monospace;
}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1.45fr 1fr}
.g-2e{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-side{grid-template-columns:300px minmax(0,1fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.card{padding:18px}
.card h3{
  margin:0 0 16px;
  padding-bottom:11px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:2px solid var(--ink);
  font-size:14px;
}
.card h3 .icon{color:var(--color-primary)}
.sub{margin-left:auto;color:var(--muted);font:500 10px "Fira Code",monospace;text-align:right}
.kpi{position:relative;padding:17px;overflow:hidden}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:8px;
  height:100%;
  background:var(--color-primary);
}
.kpi:nth-child(2)::before{background:var(--color-accent)}
.kpi:nth-child(3)::before{background:var(--ok)}
.kpi:nth-child(4)::before{background:var(--bad)}
.kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kl .icon{width:17px;height:17px}
.kv{margin:11px 0 4px;font:700 29px "Fira Code",monospace;letter-spacing:-.04em}
.kv small{margin-left:5px;color:var(--muted);font:600 12px "Fira Sans",sans-serif}
.kd{display:inline-flex;align-items:center;gap:4px;font:700 11px "Fira Code",monospace}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chartbox{position:relative;width:100%;overflow:hidden}
.tbl-wrap{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:600px;border-collapse:collapse;background:#fff;font-size:12.5px}
th{
  padding:11px 10px;
  color:#fff;
  background:var(--ink);
  border-right:1px solid #64748B;
  text-align:left;
  white-space:nowrap;
  font:600 11px "Fira Code",monospace;
  letter-spacing:.02em;
}
td{padding:11px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#EFF6FF}
td.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  color:var(--ink);
  background:#fff;
  border:1.5px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.pill::before{content:"";width:7px;height:7px;background:currentColor;border:1px solid currentColor}
.p-ok{color:var(--ok);background:#ECFDF5}
.p-warn{color:var(--warn);background:#FFF7ED}
.p-bad{color:var(--bad);background:#FEF2F2}
.p-info{color:var(--info);background:#EFF6FF}
.p-mut{color:var(--muted);background:#F1F5F9}
.bar-mini{height:9px;min-width:58px;background:#E2E8F0;border:1px solid var(--ink);overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--color-primary)}
.avatar{
  width:28px;
  height:28px;
  display:inline-grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border:1px solid var(--ink);
  font:700 11px "Fira Code",monospace;
  vertical-align:middle;
}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.col{min-width:0;padding:10px;background:var(--color-muted);border:2px solid var(--ink)}
.ch{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.cnt{padding:2px 6px;color:#fff;background:var(--ink);font:700 10px "Fira Code",monospace}
.tk{margin-bottom:8px;padding:10px;background:#fff;border:2px solid var(--ink)}
.tk:last-child{margin-bottom:0}
.tt{margin-bottom:7px;font-size:12px;font-weight:700;line-height:1.4}
.tm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-i{position:relative;padding:0 0 18px 7px}
.tl-i:last-child{padding-bottom:0}
.dot2{position:absolute;left:-27px;top:2px;width:15px;height:15px;background:#fff;border:3px solid var(--ink)}
.done .dot2{background:var(--ok)}
.now .dot2{background:var(--color-accent)}
.tdate{color:var(--muted);font:600 10px "Fira Code",monospace}
.th{margin-top:2px;font-size:12.5px;font-weight:700}
.td2{margin-top:3px;color:var(--muted);font-size:11px}
.list-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.lr-n{flex:1;min-width:0}
.lr-n b{display:block;font-size:12.5px}
.lr-n span{color:var(--muted);font-size:11px}
.qbox{display:grid;gap:9px}
.q-item{padding:11px;background:#fff;border:2px solid var(--ink)}
.q-t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:600}
.q-scale{display:flex;gap:4px;margin-top:9px}
.q-scale i{height:8px;flex:1;background:#CBD5E1;border:1px solid var(--ink)}
.q-scale i.f{background:var(--color-primary)}
.stat-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.stat-line:last-child{border-bottom:0}
.stat-line span{color:var(--muted)}
.hint{margin-top:13px;padding:9px;color:var(--muted);background:var(--color-muted);border-left:5px solid var(--color-primary);font-size:11px}
.score-ring{
  width:66px;
  height:66px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  background:#fff;
  border:4px solid var(--color-primary);
  font:700 17px "Fira Code",monospace;
}
.section-label{margin:24px 0 12px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.footer-cta{
  max-width:1400px;
  margin:0 auto 26px;
  padding:24px;
  display:flex;
  align-items:center;
  gap:18px;
  color:#fff;
  background:var(--color-primary);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.footer-cta b{display:block;font-size:18px}
.footer-cta span{display:block;margin-top:4px;color:#DBEAFE;font-size:12px}
.footer-cta .primary-action{margin-left:auto;background:var(--color-accent)}
.foot{max-width:1440px;margin:auto;padding:0 20px 34px;color:var(--muted);font-size:11px;line-height:1.7}
.reveal{opacity:0;transform:translateY(12px)}
.reveal.is-visible{opacity:1;transform:none;transition:opacity .35s ease-out,transform .35s ease-out}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-side{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  .clock{display:none}
}
@media(max-width:768px){
  .tb-in{padding:10px 14px}
  .tabs{padding:0 14px 10px}
  main{padding:20px 14px 56px}
  .scr-head{min-height:190px;padding:22px;grid-template-columns:1fr}
  .scr-head::after{width:190px;height:190px;right:-90px;top:-90px}
  .badge{justify-self:start}
  .g-2e,.g-3{grid-template-columns:1fr}
  .footer-cta{margin:0 14px 24px}
}
@media(max-width:560px){
  .brand small,.sys-state,.top-action-label{display:none}
  .brand b{font-size:14px}
  .primary-action{padding:8px 10px}
  .tab{padding:9px 11px}
  .tab .t-label{display:none}
  .g-kpi,.board{grid-template-columns:1fr}
  .scr-head{margin-bottom:20px}
  .card{padding:14px}
  .footer-cta{align-items:flex-start;flex-direction:column}
  .footer-cta .primary-action{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 6 6M10 7v6M7 10h6"></path></svg>
      </div>
      <div>
        <b>採購潛在供應商開發管理</b>
        <small>PROCUREMENT / SOURCING CONTROL</small>
      </div>
    </div>
    <div class="tb-spacer"></div>
    <div class="sys-state"><span class="state-mark" aria-hidden="true"></span>正常｜系統狀態</div>
    <div class="clock">2026/08/14&nbsp;09:41</div>
    <button class="primary-action" type="button" onclick="show(0);location.hash='v0'">
      <span class="top-action-label">新增尋源需求</span><span aria-hidden="true">＋</span>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="主要功能"></nav>
</header>

<main id="app" tabindex="-1"></main>

<section class="footer-cta" aria-label="主要行動">
  <div>
    <b>從需求到正式導入，維持同一條採購決策鏈。</b>
    <span>集中查看候選、初篩、驗證與開發績效，降低單一來源風險。</span>
  </div>
  <button class="primary-action" type="button" onclick="show(0);location.hash='v0';document.getElementById('app').focus()">建立尋源需求</button>
</section>

<footer class="foot">
  本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範，與專案詳細頁的功能模組、運作流程一致。單一網域下以
  <code>/demos/jvision-smart-mfg-158-sourcing/</code> 提供。
</footer>

<script>
"use strict";
(function(){
  var C={
    primary:"#2563EB",secondary:"#3B82F6",accent:"#EA580C",
    ok:"#047857",warn:"#9A3412",bad:"#B91C1C",info:"#1D4ED8",
    ink:"#1E293B",muted:"#475569",grid:"rgba(71,85,105,.18)",panel:"#FFFFFF"
  };
  var charts={};

  function icon(path){
    return '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">'+path+'</svg>';
  }
  var I={
    grid:icon('<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect>'),
    users:icon('<circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-4 2-6 6-6s6 2 6 6M16 5a3 3 0 0 1 0 6M17 14c3 .5 4 2.5 4 6"></path>'),
    check:icon('<rect x="3" y="3" width="18" height="18"></rect><path d="m7 12 3 3 7-7"></path>'),
    flow:icon('<circle cx="5" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M7 5h10M5 7v5l7 5 7-5V7"></path>'),
    flask:icon('<path d="M9 3h6M10 3v6l-6 10h16L14 9V3M8 15h8"></path>'),
    chart:icon('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>'),
    table:icon('<rect x="2" y="4" width="20" height="16"></rect><path d="M2 10h20M8 4v16"></path>'),
    alert:icon('<path d="M12 3 2 21h20L12 3Z"></path><path d="M12 9v5M12 18h.01"></path>'),
    clock:icon('<circle cx="12" cy="12" r="9"></circle><path d="M12 7v6l4 2"></path>'),
    trend:icon('<path d="m3 17 6-6 4 4 8-9M15 6h6v6"></path>'),
    search:icon('<circle cx="10" cy="10" r="6"></circle><path d="m15 15 6 6"></path>'),
    globe:icon('<circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path>'),
    star:icon('<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"></path>')
  };

  function destroyAll(){
    Object.keys(charts).forEach(function(k){
      if(charts[k]){try{charts[k].destroy()}catch(e){}}
      charts[k]=null;
    });
  }
  function mk(id,cfg){
    var el=document.getElementById(id);
    if(!el)return;
    charts[id]=new Chart(el,cfg);
  }
  Chart.defaults.color=C.muted;
  Chart.defaults.font.family="'Fira Sans',sans-serif";
  Chart.defaults.font.size=11;
  Chart.defaults.borderColor=C.grid;

  var TABS=[
    {i:0,x:I.search,t:"尋源需求"},
    {i:1,x:I.users,t:"潛在供應商庫"},
    {i:2,x:I.check,t:"初篩問卷"},
    {i:3,x:I.flow,t:"開發專案"},
    {i:4,x:I.flask,t:"樣品驗證"},
    {i:5,x:I.chart,t:"績效分析"}
  ];

  function head(title,desc,badge){
    return '<section class="scr-head reveal"><div class="scr-copy"><span class="eyebrow">SUPPLIER DEVELOPMENT / CONTROL</span><h1>'+title+'</h1><p>'+desc+'</p></div><span class="badge">'+badge+'</span></section>';
  }
  function axes(extra){
    var o={
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:C.ink,boxWidth:12,font:{size:11}}}},
      scales:{
        x:{ticks:{color:C.muted},grid:{color:C.grid}},
        y:{ticks:{color:C.muted},grid:{color:C.grid}}
      }
    };
    if(extra)Object.keys(extra).forEach(function(k){o[k]=extra[k]});
    return o;
  }
  function kpi(ic,label,val,unit,delta,dir){
    var cls=dir==="up"?"up":dir==="down"?"down":"flat";
    var mark=dir==="up"?"↑":dir==="down"?"↓":"—";
    return '<article class="kpi reveal"><div class="kl">'+ic+label+'</div><div class="kv">'+val+'<small>'+unit+'</small></div><div class="kd '+cls+'"><span aria-hidden="true">'+mark+'</span> '+(delta||"無變動")+'</div></article>';
  }
  function pill(text,cls){return '<span class="pill '+cls+'">'+text+'</span>'}
  function card(title,sub,content,ic){
    return '<section class="card reveal"><h3>'+(ic||I.grid)+title+(sub?'<span class="sub">'+sub+'</span>':'')+'</h3>'+content+'</section>';
  }

  function s0(){
    var rows=[
      ["SRQ-2451","精密齒輪箱外殼","金屬機構","高","08/22","林采蓉","評估中",74],

      return '<div class="list-row"><span class="avatar">'+s[0].charAt(0)+'</span><div class="lr-n"><b>'+s[0]+'</b><span>在案 '+s[3]+' · 成功率 '+s[2]+'%</span></div><div style="text-align:right"><b class="mono">'+s[1]+' 天</b><div class="bar-mini" style="width:90px;margin-top:5px"><i style="width:'+s[2]+'%"></i></div></div></div>';
    }).join("");
    return head("尋源績效分析","新供應商開發週期、尋源成功率與成本效益洞察","策略採購 · v5")+
      '<div class="grid g-kpi" style="margin-bottom:16px">'+
      kpi(I.trend,"尋源成功率","69","%","+11","up")+
      kpi(I.clock,"新供應商開發週期","41","天","-9","up")+
      kpi(I.chart,"尋源議價節省","7.8","%","+2.4","up")+
      kpi(I.flow,"單一來源料件","14","項","-6","up")+'</div>'+
      '<div class="grid g-2" style="margin-bottom:16px">'+
      card("尋源成功率趨勢","近 6 月",'<div class="chartbox" style="height:250px"><canvas id="c5a"></canvas></div>',I.trend)+
      card("尋源漏斗","候選 → 正式導入",'<div class="chartbox" style="height:250px"><canvas id="c5b"></canvas></div>',I.chart)+'</div>'+
      '<div class="grid g-2">'+
      card("採購人員尋源績效","週期 / 成功率",list+'<div class="hint">績效摘要｜吳柏諭本季開發週期最短、成功率最高</div>',I.star)+
      card("各料類尋源達成","目標 vs 實際",'<div class="chartbox" style="height:250px"><canvas id="c5c"></canvas></div>',I.grid)+'</div>';
  }
  function d5(){
    mk("c5a",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"尋源成功率 %",data:[58,60,63,65,67,69],borderColor:C.primary,backgroundColor:"rgba(37,99,235,.12)",fill:true,tension:0,pointRadius:4,pointStyle:"rect"}]},options:axes({plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{min:40,max:80}}})});
    mk("c5b",{type:"bar",data:{labels:["候選建檔","初篩合格","樣品驗證","正式導入"],datasets:[{label:"件數",data:[142,57,26,18],backgroundColor:[C.primary,C.accent,C.info,C.ok],borderColor:C.ink,borderWidth:1}]},options:axes({indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{beginAtZero:true},y:{grid:{display:false}}}})});
    mk("c5c",{type:"bar",data:{labels:["金屬機構","熱管理","被動元件","橡塑膠"],datasets:[{label:"目標",data:[8,5,6,5],backgroundColor:"#94A3B8",borderColor:C.ink,borderWidth:1},{label:"實際導入",data:[7,4,4,3],backgroundColor:C.primary,borderColor:C.ink,borderWidth:1}]},options:axes({scales:{x:{grid:{display:false}},y:{beginAtZero:true}}})});
  }

  var SCREENS=[
    {r:s0,d:d0},{r:s1,d:d1},{r:s2,d:d2},
    {r:s3,d:d3},{r:s4,d:d4},{r:s5,d:d5}
  ];

  function reveal(){
    var els=document.querySelectorAll(".reveal");
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      els.forEach(function(el){el.classList.add("is-visible")});
      return;
    }
    if(!("IntersectionObserver" in window)){
      els.forEach(function(el){el.classList.add("is-visible")});
      return;
    }
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    },{threshold:.08,rootMargin:"0px 0px -5% 0px"});
    els.forEach(function(el){io.observe(el)});
  }

  function buildTabs(){
    var el=document.getElementById("tabs");
    el.innerHTML=TABS.map(function(t){
      return '<button class="tab" type="button" data-i="'+t.i+'" aria-controls="app">'+t.x+'<span class="t-label">'+t.t+'</span></button>';
    }).join("");
    el.querySelectorAll("[data-i]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var n=Number(this.getAttribute("data-i"));
        show(n);
        try{location.hash="v"+n}catch(e){}
      });
    });
  }

  window.show=function(i){
    i=Number(i);
    if(!Number.isInteger(i)||i<0||i>=SCREENS.length)i=0;
    destroyAll();
    var app=document.getElementById("app");
    app.innerHTML=SCREENS[i].r();
    document.querySelectorAll(".tab").forEach(function(btn){
      var active=Number(btn.getAttribute("data-i"))===i;
      btn.classList.toggle("on",active);
      btn.setAttribute("aria-current",active?"page":"false");
    });
    void app.offsetHeight;
    try{SCREENS[i].d()}catch(e){}
    reveal();
  };

  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    var n=m?Math.min(Number(m[1]),SCREENS.length-1):0;
    show(n);
    try{window.scrollTo(0,0)}catch(e){}
  }

  buildTabs();
  window.addEventListener("hashchange",fromHash);
  fromHash();
})();
</script>
