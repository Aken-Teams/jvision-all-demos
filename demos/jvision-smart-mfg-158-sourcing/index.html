<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>尋源開發管理系統（Sourcing）｜控制中心</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b1020; --panel:#141a2e; --panel2:#1b2340; --line:#2a3357;
  --txt:#e7ecff; --mut:#98a3cf; --dim:#6f7bad;
  --accent:#7c3aed; --accent2:#a78bfa; --accent-soft:rgba(124,58,237,.16);
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(124,58,237,.15),transparent 60%),var(--bg);
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(11,16,32,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.tb-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:0 0 auto;}
.brand .logo .msy{font-size:20px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500;}
.tb-spacer{flex:1 1 auto;min-width:0;}
.tb-stat{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);}
.tb-stat .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
nav.tabs{max-width:1360px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap;}
.tab{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;
  font-family:inherit;transition:.15s;min-width:0;
}
.tab .msy{font-size:18px}
.tab:hover{color:var(--txt);border-color:var(--accent);}
.tab.on{background:var(--accent-soft);border-color:var(--accent);color:#fff;}
main{max-width:1360px;margin:0 auto;padding:18px 16px 60px;}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.scr-head h1{font-size:20px;font-weight:800;margin:0;letter-spacing:.4px;}
.scr-head p{margin:0;color:var(--mut);font-size:13px;}
.badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--accent2);background:var(--accent-soft);}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1.5fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-side{grid-template-columns:260px 1fr;}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-2e,.g-3,.g-side{grid-template-columns:1fr;}
}
@media(max-width:560px){ .g-kpi{grid-template-columns:1fr;} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px;}
.card h3 .msy{font-size:18px;color:var(--accent2);}
.card .sub{color:var(--dim);font-size:11px;font-weight:500;margin-left:auto;}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);}
.kpi .kl{color:var(--mut);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .msy{font-size:16px;color:var(--accent2);}
.kpi .kv{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:.5px;}
.kpi .kv small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px;}
.kpi .kd{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--mut)}
.chartbox{position:relative;width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
td{padding:10px;border-bottom:1px solid rgba(42,51,87,.5);color:var(--txt);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(124,58,237,.06);}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block;}
.p-ok{background:rgba(52,211,153,.15);color:var(--ok);}
.p-warn{background:rgba(251,191,36,.15);color:var(--warn);}
.p-bad{background:rgba(251,113,133,.15);color:var(--bad);}
.p-info{background:rgba(96,165,250,.15);color:var(--info);}
.p-mut{background:rgba(152,163,207,.12);color:var(--mut);}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;letter-spacing:.3px;}
.bar-mini{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:56px;}
.bar-mini > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;}
.avatar{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
@media(max-width:980px){.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.board{grid-template-columns:1fr;}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .ch{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:var(--mut);}
.col .cnt{background:var(--panel);border:1px solid var(--line);border-radius:99px;font-size:10px;padding:1px 7px;color:var(--accent2);}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;}
.tk:last-child{margin-bottom:0;}
.tk .tt{font-size:12px;font-weight:700;margin-bottom:4px;line-height:1.35;}
.tk .tm{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-i{position:relative;padding:0 0 16px 6px;}
.tl-i:last-child{padding-bottom:0;}
.tl-i .dot2{position:absolute;left:-19px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 3px var(--accent-soft);}
.tl-i.done .dot2{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2);}
.tl-i.now .dot2{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.2);}
.tl-i .th{font-size:12.5px;font-weight:700;}
.tl-i .td2{font-size:11px;color:var(--mut);margin-top:2px;}
.tl-i .tdate{font-size:10.5px;color:var(--dim);}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(42,51,87,.5);}
.list-row:last-child{border-bottom:none;}
.list-row .lr-n{flex:1 1 auto;min-width:0;}
.list-row .lr-n b{font-size:12.5px;font-weight:700;display:block;}
.list-row .lr-n span{font-size:11px;color:var(--dim);}
.qbox{display:flex;flex-direction:column;gap:9px;}
.q-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);}
.q-item .q-t{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center;}
.q-item .q-scale{display:flex;gap:4px;margin-top:8px;}
.q-item .q-scale i{flex:1;height:7px;border-radius:3px;background:var(--panel);}
.q-item .q-scale i.f{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.stat-line{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid rgba(42,51,87,.5);}
.stat-line:last-child{border-bottom:none;}
.stat-line span{color:var(--mut);}
.stat-line b{font-weight:700;}
.hint{font-size:11px;color:var(--dim);margin-top:12px;display:flex;align-items:center;gap:6px;}
.foot{max-width:1360px;margin:0 auto;padding:0 16px 30px;color:var(--dim);font-size:11px;line-height:1.7;}
.score-ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto;}
@media(max-width:560px){ .tab .t-label{display:none;} .tab{padding:8px 11px;} }
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="msy">travel_explore</span></div>
      <div style="min-width:0">
        <b>尋源開發管理系統</b>
        <small>Sourcing &amp; Supplier Development Console</small>
      </div>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-stat"><span class="dot"></span> 系統正常</div>
    <div class="tb-stat"><span class="msy" style="font-size:15px">schedule</span> 2026/08/14 09:41</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<div class="foot">
  本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範，與專案詳細頁的功能模組、運作流程一致。單一網域下以 <code>/demos/jvision-smart-mfg-158-sourcing/</code> 提供。
</div>

<script>
"use strict";
(function(){
  var C = {
    accent:"#7c3aed", accent2:"#a78bfa", ok:"#34d399", warn:"#fbbf24",
    bad:"#fb7185", info:"#60a5fa", grid:"rgba(152,163,207,.16)",
    tick:"#98a3cf", txt:"#e7ecff", panel:"#141a2e"
  };
  var charts = {};
  function destroyAll(){ for(var k in charts){ if(charts[k]){ try{charts[k].destroy();}catch(e){} charts[k]=null; } } }
  function mk(id, cfg){
    var el = document.getElementById(id);
    if(!el) return;
    if(charts[id]){ try{charts[id].destroy();}catch(e){} }
    charts[id] = new Chart(el, cfg);
  }
  Chart.defaults.color = C.tick;
  Chart.defaults.font.family = "Inter, 'Noto Sans TC', sans-serif";
  Chart.defaults.font.size = 11;

  var TABS = [
    {i:0, icon:"request_quote", t:"尋源需求"},
    {i:1, icon:"groups", t:"潛在供應商庫"},
    {i:2, icon:"fact_check", t:"初篩問卷"},
    {i:3, icon:"account_tree", t:"開發專案"},
    {i:4, icon:"science", t:"樣品驗證"},
    {i:5, icon:"insights", t:"績效分析"}
  ];

  function head(title, desc, badge){
    return '<div class="scr-head"><h1>'+title+'</h1>'+
      (badge?'<span class="badge">'+badge+'</span>':'')+
      '<div class="tb-spacer"></div><p>'+desc+'</p></div>';
  }
  function axes(extra){
    var o = {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{labels:{color:C.txt, boxWidth:12, font:{size:11}}} },
      scales:{
        x:{ ticks:{color:C.tick}, grid:{color:C.grid} },
        y:{ ticks:{color:C.tick}, grid:{color:C.grid} }
      }
    };
    if(extra) for(var k in extra) o[k]=extra[k];
    return o;
  }
  function kpi(icon,label,val,unit,delta,dir){
    var dc = dir==="up"?"up":(dir==="down"?"down":"flat");
    var ar = dir==="up"?"arrow_upward":(dir==="down"?"arrow_downward":"remove");
    return '<div class="kpi"><div class="kl"><span class="msy">'+icon+'</span>'+label+'</div>'+
      '<div class="kv">'+val+'<small>'+unit+'</small></div>'+
      (delta!==""?'<div class="kd '+dc+'"><span class="msy" style="font-size:13px">'+ar+'</span>'+delta+'</div>':'<div class="kd flat">—</div>')+'</div>';
  }

  /* ---------- SCREEN 0 : 尋源需求管理 ---------- */
  function s0(){
    var rows = [
      {id:"SRQ-2451", part:"精密齒輪箱外殼", cat:"金屬機構", pr:"高", due:"08/22", owner:"林采蓉", st:"評估中", stc:"p-info", risk:74},
      {id:"SRQ-2450", part:"高導熱散熱鰭片", cat:"熱管理", pr:"高", due:"08/19", owner:"陳冠廷", st:"搜尋中", stc:"p-warn", risk:88},
      {id:"SRQ-2447", part:"車規級電容 (X7R)", cat:"被動元件", pr:"中", due:"08/30", owner:"黃思翰", st:"待確認", stc:"p-mut", risk:41},
      {id:"SRQ-2445", part:"矽膠密封墊圈", cat:"橡塑膠", pr:"中", due:"09/04", owner:"林采蓉", st:"評估中", stc:"p-info", risk:53},
      {id:"SRQ-2441", part:"陽極鋁擠型導軌", cat:"金屬機構", pr:"低", due:"09/12", owner:"吳柏諭", st:"驗證中", stc:"p-ok", risk:29},
      {id:"SRQ-2438", part:"氟橡膠 O-Ring", cat:"橡塑膠", pr:"高", due:"08/18", owner:"陳冠廷", st:"搜尋中", stc:"p-warn", risk:81}
    ];
    var body = rows.map(function(r){
      var pc = r.pr==="高"?"p-bad":(r.pr==="中"?"p-warn":"p-mut");
      var rc = r.risk>=70?"var(--bad)":(r.risk>=45?"var(--warn)":"var(--ok)");
      return '<tr><td class="mono">'+r.id+'</td><td><b>'+r.part+'</b></td><td><span class="pill p-mut">'+r.cat+'</span></td>'+
        '<td><span class="pill '+pc+'">'+r.pr+'</span></td><td class="mono">'+r.due+'</td>'+
        '<td><span class="avatar" style="margin-right:6px">'+r.owner.charAt(0)+'</span>'+r.owner+'</td>'+
        '<td><span class="pill '+r.stc+'">'+r.st+'</span></td>'+
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar-mini" style="width:70px"><i style="width:'+r.risk+'%;background:'+rc+'"></i></div><span class="mono" style="color:'+rc+'">'+r.risk+'</span></div></td></tr>';
    }).join("");
    return head("尋源需求管理","料件尋源需求登錄、優先排序與缺料風險評估","需求確認 · v0")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("pending_actions","待處理需求","28","件","+5","up")+
      kpi("priority_high","高優先件","9","件","+2","down")+
      kpi("timer","平均需求前置","4.6","天","-1.2","up")+
      kpi("warning","缺料風險件","6","件","+1","down")+
    '</div>'+
    '<div class="grid g-2" style="margin-bottom:14px">'+
      '<div class="card"><h3><span class="msy">table_chart</span>尋源需求清單<span class="sub">依到期與風險排序</span></h3>'+
        '<div class="tbl-wrap"><table><thead><tr><th>需求單號</th><th>料件</th><th>類別</th><th>優先</th><th>需求日</th><th>負責人</th><th>狀態</th><th>缺料風險</th></tr></thead><tbody>'+body+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="msy">donut_large</span>需求分佈<span class="sub">依料件類別</span></h3>'+
        '<div class="chartbox" style="height:230px"><canvas id="c0a"></canvas></div>'+
        '<div class="hint"><span class="msy" style="font-size:14px">bolt</span>金屬機構與熱管理為本季尋源熱點</div></div>'+
    '</div>'+
    '<div class="grid g-2e">'+
      '<div class="card"><h3><span class="msy">stacked_bar_chart</span>各採購負責人在案量<span class="sub">近 4 週</span></h3>'+
        '<div class="chartbox" style="height:220px"><canvas id="c0b"></canvas></div></div>'+
      '<div class="card"><h3><span class="msy">rule</span>決策規則觸發<span class="sub">尋源自動判定</span></h3>'+
        '<div class="stat-line"><span>需求日在標準交期內</span><b class="p-bad" style="padding:2px 9px;border-radius:99px">6 件命中</b></div>'+
        '<div class="stat-line"><span>報價高於參考價 8%↑</span><b class="p-warn" style="padding:2px 9px;border-radius:99px">2 件待說明</b></div>'+
        '<div class="stat-line"><span>單一來源且影響生產</span><b class="p-info" style="padding:2px 9px;border-radius:99px">3 件待核准</b></div>'+
        '<div class="stat-line"><span>本週新登錄需求</span><b>11 件</b></div>'+
        '<div class="hint"><span class="msy" style="font-size:14px">gavel</span>命中規則之需求將自動提升尋源優先序</div></div>'+
    '</div>';
  }
  function d0(){
    mk("c0a",{type:"doughnut",data:{labels:["金屬機構","熱管理","被動元件","橡塑膠","其他"],
      datasets:[{data:[9,6,5,4,4],backgroundColor:[C.accent,C.accent2,C.info,C.warn,"#475277"],borderColor:C.panel,borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{color:C.txt,boxWidth:11,font:{size:11}}}}}});
    mk("c0b",{type:"bar",data:{labels:["林采蓉","陳冠廷","黃思翰","吳柏諭"],
      datasets:[
        {label:"搜尋中",data:[4,6,3,2],backgroundColor:C.accent},
        {label:"評估中",data:[3,2,4,3],backgroundColor:C.accent2},
        {label:"驗證中",data:[2,1,1,3],backgroundColor:C.info}
      ]},options:axes({scales:{x:{stacked:true,ticks:{color:C.tick},grid:{color:C.grid}},y:{stacked:true,ticks:{color:C.tick},grid:{color:C.grid}}}})});
  }

  /* ---------- SCREEN 1 : 潛在供應商庫 ---------- */
  function s1(){
    var sup = [
      {n:"O昇精密工業", reg:"台中", cat:"金屬機構", cap:"CNC / 壓鑄", score:86, tag:"已合作料類", tc:"p-ok"},
      {n:"O晶熱導科技", reg:"新竹", cat:"熱管理", cap:"擠型散熱", score:78, tag:"新開發", tc:"p-info"},
      {n:"O豐橡塑", reg:"高雄", cat:"橡塑膠", cap:"射出 / 密封件", score:71, tag:"新開發", tc:"p-info"},
      {n:"日曜電子材料", reg:"桃園", cat:"被動元件", cap:"車規電容", score:64, tag:"初篩中", tc:"p-warn"},
      {n:"O鈦金屬", reg:"台南", cat:"金屬機構", cap:"陽極 / 擠型", score:59, tag:"初篩中", tc:"p-warn"},
      {n:"O茂複合材料", reg:"彰化", cat:"橡塑膠", cap:"氟橡膠", score:52, tag:"候選", tc:"p-mut"}
    ];
    var cards = sup.map(function(s){
      var col = s.score>=80?"var(--ok)":(s.score>=65?"var(--accent2)":"var(--warn)");
      return '<div class="card" style="padding:13px"><div style="display:flex;align-items:center;gap:11px;margin-bottom:9px">'+

        '<div class="chartbox" style="height:250px"><canvas id="c5c"></canvas></div></div>'+
    '</div>';
  }
  function d5(){
    mk("c5a",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],
      datasets:[{label:"尋源成功率 %",data:[58,60,63,65,67,69],borderColor:C.accent,backgroundColor:"rgba(124,58,237,.18)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:C.accent2}]},
      options:axes({plugins:{legend:{display:false}},scales:{x:{ticks:{color:C.tick},grid:{color:C.grid}},y:{min:40,max:80,ticks:{color:C.tick},grid:{color:C.grid}}}})});
    mk("c5b",{type:"bar",data:{labels:["候選建檔","初篩合格","樣品驗證","正式導入"],
      datasets:[{label:"件數",data:[142,57,26,18],backgroundColor:[C.accent,C.accent2,C.info,C.ok],borderRadius:6}]},
      options:axes({indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{ticks:{color:C.tick},grid:{color:C.grid}},y:{ticks:{color:C.tick},grid:{display:false}}}})});
    mk("c5c",{type:"bar",data:{labels:["金屬機構","熱管理","被動元件","橡塑膠"],
      datasets:[
        {label:"目標",data:[8,5,6,5],backgroundColor:"#475277",borderRadius:5},
        {label:"實際導入",data:[7,4,4,3],backgroundColor:C.accent,borderRadius:5}
      ]},options:axes()});
  }

  var SCREENS = [
    {r:s0, d:d0}, {r:s1, d:d1}, {r:s2, d:d2},
    {r:s3, d:d3}, {r:s4, d:d4}, {r:s5, d:d5}
  ];

  function buildTabs(){
    var el = document.getElementById("tabs");
    el.innerHTML = TABS.map(function(t){
      return '<button class="tab" data-i="'+t.i+'"><span class="msy">'+t.icon+'</span>'+
        '<span class="t-label">'+t.t+'</span></button>';
    }).join("");
    var btns = el.querySelectorAll("[data-i]");
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener("click", function(){
        var n = +this.getAttribute("data-i");
        show(n);
        try{ location.hash = "v"+n; }catch(e){}
      });
    }
  }

  window.show = function(i){
    var app = document.getElementById("app");
    destroyAll();
    var sc = SCREENS[i] || SCREENS[0];
    app.innerHTML = sc.r();
    var btns = document.querySelectorAll(".tab");
    for(var b=0;b<btns.length;b++){
      btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i);
    }
    void app.offsetHeight;
    try{ sc.d(); }catch(e){}
  };

  buildTabs();
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
