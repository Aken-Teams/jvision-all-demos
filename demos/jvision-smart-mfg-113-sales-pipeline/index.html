<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales Pipeline 業務機會管理 | 純 UI 展示</title>
<meta name="description" content="從名單到成交的完整客戶生命週期管理（純 UI 擬真展示）" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.3);
  outline-offset:2px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:"liga";
}
.mono,.val,.amt,.tm,.rx,td:nth-last-child(-n+3){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
}
.tb-in{
  width:min(100%,1360px);
  min-height:64px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:220px}
.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:var(--color-on-primary);
  background:var(--blue);
  border-radius:8px;
}
.logo .ms{font-size:22px}
.brand b{display:block;font-size:15px;line-height:1.3;letter-spacing:.01em}
.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}
.nav button{
  min-height:40px;
  padding:8px 11px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font:600 12px "Fira Sans",sans-serif;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button .ms{font-size:18px}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}
.wrap{width:min(100%,1360px);margin:auto;padding:26px 18px 54px}
.scr-head{
  margin-bottom:18px;
  padding-bottom:17px;
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:6px 12px;
  border-bottom:1px solid var(--line);
}
.scr-head h1{margin:0;font-size:clamp(21px,2.2vw,28px);line-height:1.25;letter-spacing:-.025em}
.scr-head .tag{
  justify-self:start;
  padding:4px 8px;
  border:1px solid #BFDBFE;
  border-radius:5px;
  background:#EFF6FF;
  color:#1D4ED8;
  font:600 10px "Fira Code",monospace;
  letter-spacing:.06em;
}
.scr-head p{grid-column:1/-1;margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.panel,.kpi{
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.panel{padding:16px}
.panel-t{
  min-height:28px;
  margin:0 0 13px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}
.panel-t .ms{color:var(--blue);font-size:20px}
.panel-t small{margin-left:auto;color:var(--muted);font-size:11px;font-weight:400}
.kpi{
  min-height:126px;
  padding:16px;
  position:relative;
  overflow:hidden;
  border-top:3px solid var(--blue);
  transition:border-color .18s ease,background-color .18s ease;
}
.kpi:nth-child(3n+2){border-top-color:var(--color-accent)}
.kpi:hover{background:#FBFDFF}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .ms{font-size:18px;color:var(--blue)}
.kpi .val{
  margin-top:9px;
  color:var(--ink);
  font-size:27px;
  font-weight:700;
  letter-spacing:-.04em;
}
.kpi .val span{
  margin-left:5px;
  color:var(--muted);
  font:500 12px "Fira Sans",sans-serif;
}
.kpi .d{margin-top:6px;font-size:11.5px;font-weight:600}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--warn)}
.up::before{content:"↑ "}
.down::before{content:"! "}
.flat::before{content:"— "}
.chart{width:100%;overflow:hidden}
.tbl-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:7px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th{
  padding:10px 12px;
  background:var(--color-muted);
  border-bottom:1px solid var(--line);
  color:var(--muted);
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.025em;
  white-space:nowrap;
}
td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  color:var(--ink);
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F8FBFF}
th:nth-last-child(-n+3),td:nth-last-child(-n+3){text-align:right}
.pill{
  min-height:25px;
  padding:4px 8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid transparent;
  border-radius:5px;
  font:600 11px "Fira Sans",sans-serif;
  white-space:nowrap;
}
.pill .ms{font-size:14px}
.p-ok{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
.p-warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.p-bad{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
.p-acc{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.p-dim{background:var(--color-muted);border-color:var(--line);color:var(--muted)}
.bar,.prob{
  overflow:hidden;
  background:#E2E8F0;
  border-radius:2px;
}
.bar{height:6px;min-width:60px}
.bar>i,.prob>i{display:block;height:100%;background:var(--blue)}
.avatar{
  width:25px;
  height:25px;
  display:inline-grid;
  place-items:center;
  border-radius:6px;
  background:#DBEAFE;
  color:#1D4ED8;
  font-size:11px;
  font-weight:700;
  vertical-align:middle;
}
.kanban{min-width:1060px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kcol{
  min-width:0;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:var(--color-muted);
  border:1px solid var(--line);
  border-radius:8px;
}
.kcol-h{
  padding:2px 1px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #CBD5E1;
  font-size:12px;
  font-weight:700;
}
.kcol-h .n{
  min-width:24px;
  padding:2px 6px;
  border:1px solid #BFDBFE;
  border-radius:4px;
  background:#fff;
  color:#1D4ED8;
  text-align:center;
  font:600 10px "Fira Code",monospace;
}
.kcard{
  padding:11px;
  background:#fff;
  border:1px solid #D8E3F4;
  border-radius:7px;
  font-size:12px;
  transition:transform .18s ease,border-color .18s ease,background-color .18s ease;
}
.kcard:hover{transform:translateY(-2px);border-color:var(--blue);background:#FBFDFF}
.kcard b{display:block;margin-bottom:6px;font-size:12.5px;line-height:1.45}
.kcard .amt{color:#047857;font-size:12.5px;font-weight:700}
.kcard .meta{
  margin-top:7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  color:var(--muted);
  font-size:10.5px;
}
.kcard .prob{height:5px;margin-top:8px}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#BFDBFE}
.tl-item{position:relative;padding:0 0 19px 4px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";
  position:absolute;
  left:-25px;
  top:3px;
  width:10px;
  height:10px;
  border:3px solid #DBEAFE;
  border-radius:50%;
  background:var(--blue);
}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .td{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.55}
.tl-item .tm{margin-top:4px;color:#64748B;font-size:10.5px}
.fnl{display:flex;flex-direction:column;gap:11px}
.fnl-row{display:flex;align-items:center;gap:10px}
.fnl-row .fl{width:82px;flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:600}
.fnl-row .fb{
  min-width:50px;
  height:30px;
  padding:0 10px;
  display:flex;
  align-items:center;
  border-radius:4px;
  background:var(--blue);
  color:#fff;
  font:600 11px "Fira Code",monospace;
}
.fnl-row .fv{width:48px;flex:0 0 auto;text-align:right;font:600 11px "Fira Code",monospace}
.rlist{display:flex;flex-direction:column;gap:9px}
.ritem{
  padding:11px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
}
.ritem .ic{
  width:34px;
  height:34px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:6px;
}
.ritem .ic .ms{font-size:19px}
.ic.rbad{background:#FEF2F2;color:#B91C1C}
.ic.rwarn{background:#FFFBEB;color:#92400E}
.ic.racc{background:#EFF6FF;color:#1D4ED8}
.ritem .rb{min-width:0;flex:1}
.ritem .rt{font-size:13px;font-weight:700;line-height:1.45}
.ritem .rd{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.55}
.ritem .rx{margin-top:5px;color:#64748B;font-size:10.5px;line-height:1.5}
.prof{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prof .pa{
  width:56px;
  height:56px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  font-size:21px;
  font-weight:700;
}
.prof .pi b{font-size:17px}
.prof .pi div{margin-top:4px;color:var(--muted);font-size:12px}
.dl{margin-top:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dl>div{min-width:0;padding:10px;background:var(--color-muted);border-radius:6px}
.dk{color:#64748B;font-size:10.5px}
.dv{margin-top:3px;font-size:13px;font-weight:700}
.foot{
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11.5px;
  line-height:1.7;
  text-align:center;
}
.foot b{color:#1D4ED8}
.reveal{animation:reveal .36s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .tb-in{align-items:flex-start;flex-direction:column;gap:8px}
  .nav{width:100%;margin:0;overflow-x:auto;padding-bottom:2px}
  .nav button{flex:0 0 auto}
  .g-kpi{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .wrap{padding:20px 14px 44px}
  .g-2,.g-2-1,.g-1-2{grid-template-columns:1fr}
  .panel{padding:14px}
  .kanban{min-width:0;grid-template-columns:1fr}
  .tbl-wrap:has(.kanban){border:0;overflow:visible}
  .kcol{padding:9px}
  .kcard .meta{flex-wrap:wrap}
}
@media(max-width:560px){
  .tb-in{padding:9px 12px}
  .brand{min-width:0}
  .nav .lbl{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,1fr)}
  .nav button{min-width:44px;padding:8px}
  .g-kpi{grid-template-columns:1fr}
  .kpi{min-height:112px}
  .scr-head{grid-template-columns:1fr}
  .scr-head .tag{grid-row:2}
  .scr-head p{grid-row:3}
  .dl{grid-template-columns:1fr}
  .panel-t{align-items:flex-start;flex-wrap:wrap}
  .panel-t small{width:100%;margin-left:28px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="ms">account_tree</span></div>
      <div><b>Sales Pipeline</b><small>業務機會管理 · CRM 控制台</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
  </div>
</div>
<main class="wrap">
  <div id="app" aria-live="polite"></div>
  <div class="foot">本頁為 <b>純 UI 系統展示</b>（無後端），畫面與資料皆為擬真示範。<br/>Sales Pipeline 業務機會管理 · 與專案詳細頁的功能模組、運作流程一致。</div>
</main>
<script>
"use strict";
var app=document.getElementById("app"),charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose()}catch(e){}}charts=[]}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize()}catch(e){}}});
var AX="#475569",GRID="#E4ECFC",LTXT="#0F172A",BLUE="#2563EB",GREEN="#059669",RED="#DC2626";
function axisBase(){return{axisLine:{lineStyle:{color:"#CBD5E1"}},axisLabel:{color:AX,fontFamily:"Fira Code"},axisTick:{show:false},splitLine:{lineStyle:{color:GRID,type:"dashed"}}}}
function num(n){return n.toLocaleString("en-US")}
function money(n){return "$"+num(n)}
function kpi(o){return'<div class="kpi"><div class="lab"><span class="ms">'+o.ic+"</span>"+o.l+'</div><div class="val">'+o.v+"<span>"+o.u+'</span></div><div class="d '+o.c+'">'+o.d+"</div></div>"}
var SCREENS=[
 {icon:"account_tree",label:"商機看板",title:"商機階段看板 Kanban",tag:"MODULE 01",desc:"以拖曳看板檢視五大階段商機分布、加權金額與成交機率，快速掌握管線健康度。",fn:s0},
 {icon:"groups",label:"客戶檔案",title:"客戶與商機檔案",tag:"MODULE 02",desc:"整合客戶聯絡人、需求摘要與互動歷程，單一視圖看懂每個商機的來龍去脈。",fn:s1},
 {icon:"request_quote",label:"機率預估",title:"成交機率與金額預估",tag:"MODULE 03",desc:"依成交機率計算加權金額，彙整本月預估貢獻與各業務預估達成。",fn:s2},
 {icon:"history",label:"停留分析",title:"階段停留天數分析",tag:"MODULE 04",desc:"分析各階段平均停留天數，標示超時停滯商機並提示推進動作。",fn:s3},
 {icon:"warning",label:"風險提醒",title:"風險與待辦提醒",tag:"MODULE 05",desc:"自動排序報價到期、無下次聯絡日、大額停滯等風險，附上處置建議。",fn:s4},
 {icon:"insights",label:"轉換分析",title:"轉換率與銷售週期",tag:"MODULE 06",desc:"銷售漏斗轉換率、平均銷售週期與月度達成率儀表，回饋下一輪管線。",fn:s5}
];
var nav=document.getElementById("nav");
(function(){var s="";for(var i=0;i<SCREENS.length;i++)s+='<button type="button" data-i="'+i+'" aria-label="'+SCREENS[i].label+'"><span class="ms">'+SCREENS[i].icon+'</span><span class="lbl">'+SCREENS[i].label+"</span></button>";nav.innerHTML=s;nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)location.hash="v"+b.getAttribute("data-i")})})();
function head(i){var s=SCREENS[i];return'<div class="scr-head"><h1>'+s.title+'</h1><span class="tag">'+s.tag+"</span><p>"+s.desc+"</p></div>"}
function show(i){clearCharts();var bs=document.querySelectorAll("[data-i]");for(var k=0;k<bs.length;k++){var on=+bs[k].getAttribute("data-i")===i;bs[k].classList.toggle("on",on);bs[k].setAttribute("aria-current",on?"page":"false")}app.innerHTML='<div class="reveal">'+head(i)+SCREENS[i].fn()+"</div>";void app.offsetHeight;if(SCREENS[i].draw)SCREENS[i].draw()}
var STAGES=[
 {k:"建立商機",cards:[{n:"O都精機 CNC 產線升級",amt:2400000,p:20,o:"陳志明",d:"3 天前"},{n:"永光化學 ERP 導入",amt:860000,p:15,o:"林佳蓉",d:"1 天前"},{n:"宏遠紡織 MES 評估",amt:1250000,p:20,o:"王大維",d:"今天"}]},
 {k:"設定階段與機率",cards:[{n:"友O集團 刀庫管理",amt:1800000,p:40,o:"陳志明",d:"5 天前"},{n:"O鋼構 排程系統",amt:3200000,p:35,o:"王大維",d:"2 天前"}]},
 {k:"定期更新進度",cards:[{n:"O立光 檢測整合",amt:2750000,p:55,o:"林佳蓉",d:"1 天前"},{n:"O偉科技 保養平台",amt:980000,p:50,o:"陳志明",d:"今天"},{n:"O昇電 能源儀表",amt:1400000,p:60,o:"王大維",d:"4 天前"}]},
 {k:"報價議合",cards:[{n:"研O科技 IoT 平台",amt:4100000,p:75,o:"林佳蓉",d:"今天"},{n:"O宸 產線看板",amt:1800000,p:70,o:"陳志明",d:"2 天前"}]},
 {k:"已成交",cards:[{n:"O大工業 稼動率分析",amt:2200000,p:100,o:"王大維",d:"昨天"},{n:"鴻準 品質追溯",amt:1650000,p:100,o:"林佳蓉",d:"3 天前"}]}
];
