<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales Pipeline 業務機會管理 | 純 UI 展示</title>
<meta name="description" content="從名單到成交的完整客戶生命週期管理（純 UI 擬真展示）" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#be185d; --accent2:#fb7185;
  --bg:#0d0b14; --bg2:#16121f; --panel:#1c1729; --panel2:#241d33;
  --line:#332a45; --txt:#f3edf8; --muted:#a99fbb; --dim:#7d738f;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(190,24,93,.18),transparent 60%),var(--bg);
  color:var(--txt); -webkit-font-smoothing:antialiased; min-height:100vh;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';}
.topbar{position:sticky;top:0;z-index:50;background:rgba(13,11,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 4px 14px rgba(190,24,93,.5)}
.brand .logo .ms{font-size:20px}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;color:var(--dim);font-size:11px;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0
}
.nav button .ms{font-size:18px}
.nav button:hover{color:var(--txt);background:var(--panel)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--accent),#9d174d);border-color:var(--accent);box-shadow:0 3px 12px rgba(190,24,93,.4)}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.scr-head h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.3px}
.scr-head .tag{font-size:12px;color:var(--dim);font-weight:600;background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:20px}
.scr-head p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%;line-height:1.6}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px}
.panel-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 0 12px}
.panel-t .ms{font-size:19px;color:var(--accent2)}
.panel-t small{margin-left:auto;color:var(--dim);font-weight:500;font-size:11px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
.grid>*{min-width:0}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .lab{color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .ms{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .val span{font-size:13px;color:var(--dim);font-weight:600;margin-left:3px}
.kpi .d{font-size:11.5px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--warn)}
.chart{width:100%;overflow:hidden}
.tbl-wrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid rgba(51,42,69,.5);white-space:nowrap}
tr:hover td{background:rgba(190,24,93,.06)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill .ms{font-size:14px}
.p-ok{background:rgba(52,211,153,.14);color:var(--ok)}
.p-warn{background:rgba(251,191,36,.16);color:var(--warn)}
.p-bad{background:rgba(248,113,113,.16);color:var(--bad)}
.p-acc{background:rgba(251,113,133,.16);color:var(--accent2)}
.p-dim{background:rgba(125,115,143,.16);color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:820px){.kanban{grid-template-columns:1fr}}
.kanban>*{min-width:0}
.kcol{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:9px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.kcol-h .n{background:var(--panel2);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.kcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;transition:.15s}
.kcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.kcard b{font-size:12.5px;display:block;margin-bottom:5px}
.kcard .amt{color:var(--accent2);font-weight:800;font-size:13px}
.kcard .meta{color:var(--dim);font-size:11px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.kcard .prob{height:4px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.kcard .prob>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 4px}
.tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl-item .tt{font-weight:700;font-size:13px}
.tl-item .td{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
.tl-item .tm{color:var(--dim);font-size:11px;margin-top:3px}
.fnl{display:flex;flex-direction:column;gap:10px}
.fnl-row{display:flex;align-items:center;gap:10px}
.fnl-row .fl{width:80px;font-size:12px;color:var(--muted);font-weight:600;flex:0 0 auto}
.fnl-row .fb{height:30px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:700;font-size:12px;min-width:44px}
.fnl-row .fv{width:48px;text-align:right;font-size:12px;font-weight:700;flex:0 0 auto}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg2)}
.ritem .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.ritem .ic .ms{font-size:19px}
.ic.rbad{background:rgba(248,113,113,.14);color:var(--bad)}
.ic.rwarn{background:rgba(251,191,36,.14);color:var(--warn)}
.ic.racc{background:rgba(190,24,93,.16);color:var(--accent2)}
.ritem .rb{min-width:0;flex:1}
.ritem .rt{font-weight:700;font-size:13px}
.ritem .rd{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.5}
.ritem .rx{color:var(--dim);font-size:11px;margin-top:4px}
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof .pa{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;flex:0 0 auto}
.prof .pi b{font-size:17px}
.prof .pi div{color:var(--muted);font-size:12.5px;margin-top:3px}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(max-width:560px){.dl{grid-template-columns:1fr}}
.dl>div{min-width:0}
.dl .dk{color:var(--dim);font-size:11px}
.dl .dv{font-weight:700;font-size:13.5px;margin-top:2px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:30px;line-height:1.7}
.foot b{color:var(--accent2)}
.mono{font-variant-numeric:tabular-nums}
@media(max-width:560px){.nav .lbl{display:none}.nav button{padding:8px}.scr-head h1{font-size:19px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="ms">account_tree</span></div>
      <div><b>Sales Pipeline</b><small>業務機會管理 · CRM 控制台</small></div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
</div>
<div class="wrap"><div id="app"></div>
  <div class="foot">本頁為 <b>純 UI 系統展示</b>（無後端），畫面與資料皆為擬真示範。<br/>Sales Pipeline 業務機會管理 · 與專案詳細頁的功能模組、運作流程一致。</div>
</div>

<script>
"use strict";
var app=document.getElementById("app");
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

var AX="#a99fbb", GRID="#332a45", LTXT="#f3edf8";
function axisBase(){return{axisLine:{lineStyle:{color:GRID}},axisLabel:{color:AX},axisTick:{show:false},splitLine:{lineStyle:{color:GRID,type:"dashed"}}};}
function num(n){return n.toLocaleString("en-US");}
function money(n){return "$"+num(n);}
function kpi(o){return '<div class="kpi"><div class="lab"><span class="ms">'+o.ic+'</span>'+o.l+'</div><div class="val mono">'+o.v+'<span>'+o.u+'</span></div><div class="d '+o.c+'">'+o.d+'</div></div>';}

var SCREENS=[
  {icon:"account_tree",label:"商機看板",title:"商機階段看板 Kanban",tag:"MODULE 01",
   desc:"以拖曳看板檢視五大階段商機分布、加權金額與成交機率，快速掌握管線健康度。",fn:s0},
  {icon:"groups",label:"客戶檔案",title:"客戶與商機檔案",tag:"MODULE 02",
   desc:"整合客戶聯絡人、需求摘要與互動歷程，單一視圖看懂每個商機的來龍去脈。",fn:s1},
  {icon:"request_quote",label:"機率預估",title:"成交機率與金額預估",tag:"MODULE 03",
   desc:"依成交機率計算加權金額，彙整本月預估貢獻與各業務預估達成。",fn:s2},
  {icon:"history",label:"停留分析",title:"階段停留天數分析",tag:"MODULE 04",
   desc:"分析各階段平均停留天數，標示超時停滯商機並提示推進動作。",fn:s3},
  {icon:"warning",label:"風險提醒",title:"風險與待辦提醒",tag:"MODULE 05",
   desc:"自動排序報價到期、無下次聯絡日、大額停滯等風險，附上處置建議。",fn:s4},
  {icon:"insights",label:"轉換分析",title:"轉換率與銷售週期",tag:"MODULE 06",
   desc:"銷售漏斗轉換率、平均銷售週期與月度達成率儀表，回饋下一輪管線。",fn:s5}
];

var nav=document.getElementById("nav");
(function(){var s="";for(var i=0;i<SCREENS.length;i++){s+='<button data-i="'+i+'"><span class="ms">'+SCREENS[i].icon+'</span><span class="lbl">'+SCREENS[i].label+'</span></button>';}nav.innerHTML=s;
nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;location.hash="v"+b.getAttribute("data-i");});})();

function head(i){var s=SCREENS[i];return '<div class="scr-head"><h1>'+s.title+'</h1><span class="tag">'+s.tag+'</span><p>'+s.desc+'</p></div>';}

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  app.innerHTML=head(i)+SCREENS[i].fn();
  void app.offsetHeight;
  if(SCREENS[i].draw)SCREENS[i].draw();
}

/* ===== SCREEN 0 : KANBAN ===== */
var STAGES=[
  {k:"建立商機",cards:[
    {n:"O都精機 CNC 產線升級",amt:2400000,p:20,o:"陳志明",d:"3 天前"},
    {n:"永光化學 ERP 導入",amt:860000,p:15,o:"林佳蓉",d:"1 天前"},
    {n:"宏遠紡織 MES 評估",amt:1250000,p:20,o:"王大維",d:"今天"}
  ]},
  {k:"設定階段與機率",cards:[
    {n:"友O集團 刀庫管理",amt:1800000,p:40,o:"陳志明",d:"5 天前"},
    {n:"O鋼構 排程系統",amt:3200000,p:35,o:"王大維",d:"2 天前"}
  ]},
  {k:"定期更新進度",cards:[
    {n:"O立光 檢測整合",amt:2750000,p:55,o:"林佳蓉",d:"1 天前"},
    {n:"O偉科技 保養平台",amt:980000,p:50,o:"陳志明",d:"今天"},
    {n:"O昇電 能源儀表",amt:1400000,p:60,o:"王大維",d:"4 天前"}
  ]},
  {k:"報價議合",cards:[
    {n:"研O科技 IoT 平台",amt:4100000,p:75,o:"林佳蓉",d:"今天"},
    {n:"O宸 產線看板",amt:1800000,p:70,o:"陳志明",d:"2 天前"}
  ]},
  {k:"已成交",cards:[
    {n:"O大工業 稼動率分析",amt:2200000,p:100,o:"王大維",d:"昨天"},
    {n:"鴻準 品質追溯",amt:1650000,p:100,o:"林佳蓉",d:"3 天前"}
  ]}
];
function s0(){
  var kpis=[
    {l:"進行中商機",v:"10",u:"件",d:"本週 +3",c:"up",ic:"account_tree"},
    {l:"管線總金額",v:"2,239",u:"萬",d:"加權後 1,110 萬",c:"flat",ic:"payments"},
    {l:"本月成交",v:"2",u:"件",d:"385 萬",c:"up",ic:"verified"},
    {l:"平均成交機率",v:"52",u:"%",d:"較上月 +6%",c:"up",ic:"percent"}
  ];
  var h='<div class="grid g-kpi" style="margin-bottom:14px">'+kpis.map(kpi).join("")+'</div>';
  h+='<div class="panel"><div class="panel-t"><span class="ms">view_kanban</span>商機階段看板<small>拖曳卡片以推進階段 · 擬真示範</small></div>';
  h+='<div class="tbl-wrap"><div class="kanban">';
  for(var i=0;i<STAGES.length;i++){
    var st=STAGES[i];var sum=0;for(var a=0;a<st.cards.length;a++)sum+=st.cards[a].amt;
    h+='<div class="kcol"><div class="kcol-h"><span>'+st.k+'</span><span class="n">'+st.cards.length+'</span></div>';
    for(var j=0;j<st.cards.length;j++){var c=st.cards[j];
      h+='<div class="kcard"><b>'+c.n+'</b><span class="amt">'+money(c.amt)+'</span>'
       +'<div class="prob"><i style="width:'+c.p+'%"></i></div>'
       +'<div class="meta"><span><span class="avatar">'+c.o.charAt(0)+'</span> '+c.o+'</span><span>'+c.p+'% · '+c.d+'</span></div></div>';
    }
    h+='<div style="text-align:center;color:var(--dim);font-size:11px;padding-top:2px">小計 '+money(sum)+'</div></div>';
  }
  h+='</div></div></div>';
  return h;
}

/* ===== SCREEN 1 : CUSTOMER PROFILE ===== */
function tl(d,t,x){return '<div class="tl-item"><div class="tt">'+t+'</div><div class="td">'+x+'</div><div class="tm">'+d+'</div></div>';}
function fileRow(n,m){return '<div class="ritem"><div class="ic racc"><span class="ms">description</span></div><div class="rb"><div class="rt">'+n+'</div><div class="rx">'+m+'</div></div></div>';}
function s1(){
  var h='<div class="grid g-2-1">';
  h+='<div style="display:flex;flex-direction:column;gap:14px">';
  h+='<div class="panel"><div class="prof"><div class="pa">研</div><div class="pi" style="min-width:0"><b>研O科技股份有限公司</b><div>工業電腦 · 上市 · 台北內湖 · 客戶編號 C-20418</div></div></div>';
  h+='<div class="dl">'
    +'<div><div class="dk">主要聯絡人</div><div class="dv">李明哲 · 資訊處協理</div></div>'
    +'<div><div class="dk">負責業務</div><div class="dv">林佳蓉</div></div>'
    +'<div><div class="dk">商機來源</div><div class="dv">展會名單（自動化展）</div></div>'
    +'<div><div class="dk">預估金額</div><div class="dv" style="color:var(--accent2)">$4,100,000</div></div>'
    +'<div><div class="dk">目前階段</div><div class="dv"><span class="pill p-acc"><span class="ms">handshake</span>報價議合</span></div></div>'
    +'<div><div class="dk">下次聯絡日</div><div class="dv">2026-08-19</div></div>'
    +'</div>';
  h+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div class="dk" style="color:var(--dim);font-size:11px;margin-bottom:5px">需求摘要</div><div style="color:var(--muted);font-size:13px;line-height:1.7">客戶欲導入產線 IoT 資料採集平台，串接 300+ 感測點，需支援 OPC-UA 與現有 MES 整合；重視資安與現場穩定性，已排除兩家競品，進入最終報價比價。</div></div>';
  h+='</div>';
  h+='<div class="panel"><div class="panel-t"><span class="ms">forum</span>互動歷程</div><div class="tl">'

/* ===== router ===== */
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
