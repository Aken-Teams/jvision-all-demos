<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>模擬分析軟體整合平台（CAE整合管理）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#be185d;--accent2:#fb7185;
  --bg:#0b0e17;--panel:#151a29;--panel2:#1b2236;--line:#2a3450;
  --txt:#e7ecf7;--mut:#8b97b5;--dim:#5f6c8f;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;
  background-image:radial-gradient(circle at 15% -10%,rgba(190,24,93,.14),transparent 45%),radial-gradient(circle at 100% 0%,rgba(251,113,133,.08),transparent 40%);
  min-height:100vh}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;
  vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}

.topbar{position:sticky;top:0;z-index:40;background:rgba(11,14,23,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.tbrow{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 16px rgba(190,24,93,.4)}
.logo .ms{font-size:22px}
.bttl{font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font-size:11px;color:var(--mut);white-space:nowrap}
.tbstat{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);
  background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:20px;flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2)}

.navwrap{background:rgba(21,26,41,.6);border-bottom:1px solid var(--line)}
.nav{display:flex;gap:6px;padding:9px 14px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.nbtn{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:9px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--mut);font-family:inherit;font-size:13px;
  font-weight:600;transition:.15s;white-space:nowrap}
.nbtn .ms{font-size:19px}
.nbtn:hover{background:var(--panel2);color:var(--txt)}
.nbtn.on{background:linear-gradient(135deg,rgba(190,24,93,.9),rgba(251,113,133,.85));color:#fff;
  border-color:var(--accent2);box-shadow:0 4px 14px rgba(190,24,93,.35)}
.nbadge{font-size:10px;background:rgba(255,255,255,.16);padding:1px 6px;border-radius:8px;font-weight:700}

main{max-width:1440px;margin:0 auto;padding:20px 18px 60px}
.shead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.sh-ic{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent2)}
.sh-ic .ms{font-size:26px}
.sh-t{font-size:20px;font-weight:800}
.sh-d{font-size:13px;color:var(--mut)}
.sh-tag{margin-left:auto;font-size:12px;color:var(--accent2);background:rgba(190,24,93,.14);
  border:1px solid rgba(190,24,93,.4);padding:5px 12px;border-radius:20px;font-weight:600;white-space:nowrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}
.panel h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .ms{font-size:18px;color:var(--accent2)}
.ptag{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}

.g2,.g3,.g4,.g13{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g13{grid-template-columns:1.3fr 1fr}
@media(max-width:820px){
  .g2,.g3,.g4,.g13{grid-template-columns:1fr}
}

.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle,rgba(190,24,93,.28),transparent 70%)}
.kpi .kl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .kl .ms{font-size:16px;color:var(--accent2)}
.kpi .kv{font-size:26px;font-weight:800;margin-top:7px}
.kpi .kv small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .kd{font-size:11px;margin-top:5px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}

.cwrap{position:relative;width:100%;overflow:hidden}

.tscroll{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;padding:9px 11px;color:var(--mut);font-weight:600;font-size:11px;
  border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 11px;border-bottom:1px solid rgba(42,52,80,.55);white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.3px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:20px;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.16);color:var(--ok)}
.p-run{background:rgba(96,165,250,.16);color:var(--info)}
.p-warn{background:rgba(251,191,36,.16);color:var(--warn)}
.p-bad{background:rgba(248,113,113,.16);color:var(--bad)}
.p-idle{background:rgba(139,151,181,.16);color:var(--mut)}
.p-acc{background:rgba(190,24,93,.18);color:var(--accent2)}

.bar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.bcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}
.bcol h4{font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bcol h4 b{color:var(--txt);font-size:11px;background:var(--panel);padding:1px 8px;border-radius:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);
  border-radius:9px;padding:10px;margin-bottom:9px}
.card .ct{font-size:12.5px;font-weight:700}
.card .cm{font-size:11px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 15px 12px}
.tli::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(190,24,93,.25)}
.tli.done::before{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2)}
.tli .tlt{font-size:13px;font-weight:700}
.tli .tld{font-size:11.5px;color:var(--mut);margin-top:2px}
.tli .tlm{font-size:10.5px;color:var(--dim);margin-top:3px}

.lrow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid rgba(42,52,80,.5)}
.lrow:last-child{border-bottom:none}
.lic{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;background:var(--panel2);color:var(--accent2)}
.lic .ms{font-size:19px}
.lmain{flex:1;min-width:0}
.lt{font-size:13px;font-weight:600}
.ld{font-size:11px;color:var(--mut)}

.node{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.node .nn{font-size:12px;color:var(--mut)}
.node .nv{font-size:22px;font-weight:800;margin:5px 0}
.node .ring{height:6px;border-radius:4px;background:var(--panel);overflow:hidden;margin-top:6px}
.node .ring>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.lmap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
@media(max-width:820px){.lmap{grid-template-columns:1fr}.lmap .lmid{transform:rotate(90deg)}}
.lmid{text-align:center;color:var(--accent2)}
.lmid .ms{font-size:30px}
.lbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
.lbox .lbt{font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:600}
.param{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(42,52,80,.6)}
.param:last-child{border:none}
.param b{color:var(--txt);font-variant-numeric:tabular-nums}

.chk{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;margin-bottom:9px}
.chk .cbox{width:24px;height:24px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center}
.chk.pass .cbox{background:rgba(52,211,153,.18);color:var(--ok)}
.chk.fail .cbox{background:rgba(248,113,113,.18);color:var(--bad)}
.chk.wait .cbox{background:rgba(251,191,36,.18);color:var(--warn)}
.chk .cx{flex:1;min-width:0}
.chk .cxt{font-size:13px;font-weight:600}
.chk .cxd{font-size:11px;color:var(--mut)}
.chk .cxv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.mini{font-size:11px;color:var(--dim);margin-top:2px}
.hint{font-size:11px;color:var(--mut);margin-top:10px;display:flex;align-items:center;gap:6px}
.hint .ms{font-size:15px;color:var(--accent2)}
.sp{height:14px}
.flexb{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

@media(max-width:560px){
  .navtxt{display:none}
  .nbtn{padding:8px 11px}
  .bsub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo"><span class="ms">science</span></div>
      <div style="min-width:0">
        <div class="bttl">CAE 整合管理平台</div>
        <div class="bsub">模擬分析軟體整合 · 研發控制台</div>
      </div>
    </div>
    <div class="tbstat">
      <span class="pulse"></span> 求解叢集連線中
      <span style="color:var(--dim)">|</span> 授權 22 / 30 席
    </div>
  </div>
</header>

<div class="navwrap">
  <nav class="nav" id="nav"></nav>
</div>

<main>
  <div id="app"></div>
</main>

<script>
(function(){
"use strict";

var MODS=[
  {ic:"science",name:"模擬案件管理",badge:"CASE",t:"模擬案件管理",d:"CAE 分析案件建立、指派與進度追蹤"},
  {ic:"history",name:"版本控制",badge:"VER",t:"模型版本控制",d:"模型與求解設定版本快照與比對"},
  {ic:"account_tree",name:"設計資料連動",badge:"SYNC",t:"設計資料連動",d:"模擬結果與 CAD/PDM 設計參數雙向同步"},
  {ic:"insights",name:"多物理場結果",badge:"MULTI",t:"多物理場結果",d:"結構、熱、流體多工具結果彙整比較"},
  {ic:"build",name:"求解資源排程",badge:"HPC",t:"求解資源排程",d:"HPC 授權與運算節點佇列調度"},
  {ic:"fact_check",name:"設計驗證審核",badge:"GATE",t:"設計驗證審核",d:"收斂性、規格符合性判定與簽核放行"}
];

var charts={};
var app=document.getElementById("app");

function head(i){
  var m=MODS[i];
  return '<div class="shead">'+
    '<div class="sh-ic"><span class="ms">'+m.ic+'</span></div>'+
    '<div><div class="sh-t">'+m.t+'</div><div class="sh-d">'+m.d+'</div></div>'+
    '<div class="sh-tag">模組 '+(i+1)+' / 6 · '+m.badge+'</div></div>';
}
function destroyCharts(){
  for(var k in charts){ if(charts[k]){ try{charts[k].destroy();}catch(e){} charts[k]=null; } }
  charts={};
}
var AX="#8b97b5", GRID="rgba(42,52,80,.55)", LT="#e7ecf7";
function gridOpts(extra){
  var o={maintainAspectRatio:false,responsive:true,
    plugins:{legend:{labels:{color:LT,font:{size:11},boxWidth:12,padding:12}}},
    scales:{
      x:{ticks:{color:AX,font:{size:10}},grid:{color:GRID}},
      y:{ticks:{color:AX,font:{size:10}},grid:{color:GRID}}
    }};
  if(extra) for(var k in extra){o[k]=extra[k];}
  return o;
}
function mkChart(id,cfg){
  var cv=document.getElementById(id);
  if(!cv) return;
  charts[id]=new Chart(cv.getContext("2d"),cfg);
}

// ==================== SCREEN 0 : 模擬案件管理 ====================
function s0(){
  var kpis=[
    {ic:"science",l:"進行中案件",v:"38",u:"件",d:"+5 本週",c:"up"},
    {ic:"pending",l:"待求解佇列",v:"12",u:"件",d:"排隊中",c:"flat"},
    {ic:"task_alt",l:"本月完成",v:"64",u:"件",d:"+18%",c:"up"},
    {ic:"warning",l:"逾期風險",v:"3",u:"件",d:"需介入",c:"down"}
  ];
  var k="";
  kpis.forEach(function(x){
    k+='<div class="kpi"><div class="kl"><span class="ms">'+x.ic+'</span>'+x.l+'</div>'+
      '<div class="kv">'+x.v+'<small>'+x.u+'</small></div>'+
      '<div class="kd '+x.c+'"><span class="ms" style="font-size:14px">'+
      (x.c==="up"?"trending_up":x.c==="down"?"priority_high":"remove")+'</span>'+x.d+'</div></div>';
  });

  var cols=[
    {t:"規劃中",n:3,cards:[
      {ct:"車架前叉結構強度分析",who:"林彥廷",tag:"結構",p:"p-acc"},
      {ct:"電池模組散熱評估",who:"陳思妤",tag:"熱傳",p:"p-warn"},
      {ct:"進氣道流場優化",who:"黃志遠",tag:"流體",p:"p-run"}
    ]},
    {t:"求解中",n:2,cards:[
      {ct:"馬達外殼模態分析",who:"吳孟儒",tag:"結構",p:"p-acc"},
      {ct:"散熱鰭片對流模擬",who:"張雅涵",tag:"熱傳",p:"p-warn"}
    ]},
    {t:"驗證中",n:2,cards:[
      {ct:"連桿疲勞壽命評估",who:"李冠宇",tag:"結構",p:"p-acc"},
      {ct:"外殼跌落衝擊分析",who:"周宛儒",tag:"結構",p:"p-acc"}
    ]},
    {t:"已放行",n:2,cards:[
      {ct:"齒輪箱熱平衡分析",who:"鄭博安",tag:"熱傳",p:"p-ok"},
      {ct:"風扇葉片氣動分析",who:"許庭瑋",tag:"流體",p:"p-ok"}
    ]}
  ];
  var board="";
  cols.forEach(function(c){
    var cc="";
    c.cards.forEach(function(cd){
      cc+='<div class="card"><div class="ct">'+cd.ct+'</div>'+
        '<div class="cm"><span>'+cd.who+'</span><span class="pill '+cd.p+'">'+cd.tag+'</span></div></div>';
    });
    board+='<div class="bcol"><h4>'+c.t+'<b>'+c.n+'</b></h4>'+cc+'</div>';
  });

  return head(0)+
    '<div class="g4">'+k+'</div><div class="sp"></div>'+
    '<div class="g13">'+
      '<div class="panel"><h3><span class="ms">view_kanban</span>案件看板<span class="ptag">依狀態流轉</span></h3>'+
        '<div class="board">'+board+'</div></div>'+
      '<div class="panel"><h3><span class="ms">donut_small</span>案件分布<span class="ptag">物理場類型</span></h3>'+
        '<div class="cwrap" style="height:230px"><canvas id="c0a"></canvas></div>'+
        '<div class="hint"><span class="ms">tips_and_updates</span>結構分析佔比最高，散熱案件本季成長明顯。</div>'+
      '</div>'+
    '</div>';
}
function s0init(){
  mkChart("c0a",{type:"doughnut",
    data:{labels:["結構分析","熱傳分析","流體分析","電磁分析"],
      datasets:[{data:[42,26,20,12],backgroundColor:["#be185d","#fb7185","#f9a8d4","#60a5fa"],borderColor:"#151a29",borderWidth:3}]},
    options:{maintainAspectRatio:false,responsive:true,cutout:"62%",
      plugins:{legend:{position:"bottom",labels:{color:LT,font:{size:11},boxWidth:12,padding:10}}}}});
}

// ==================== SCREEN 1 : 版本控制 ====================
function s1(){
  var rows=[
    {v:"v4.2",m:"車架前叉 · 網格細化",who:"林彥廷",elem:"1.84M",solver:"Abaqus",when:"08-13 14:20",st:"目前版本",p:"p-acc"},
    {v:"v4.1",m:"邊界條件修正",who:"林彥廷",elem:"1.62M",solver:"Abaqus",when:"08-12 09:05",st:"已凍結",p:"p-ok"},
    {v:"v4.0",m:"幾何更新 · 焊道倒角",who:"陳思妤",elem:"1.58M",solver:"Abaqus",when:"08-10 16:40",st:"已凍結",p:"p-ok"},
    {v:"v3.3",m:"負載工況調整",who:"李冠宇",elem:"1.40M",solver:"Ansys",when:"08-08 11:12",st:"已封存",p:"p-idle"},
    {v:"v3.2",m:"材料屬性更新",who:"李冠宇",elem:"1.40M",solver:"Ansys",when:"08-06 10:30",st:"已封存",p:"p-idle"}
  ];
  var tr="";
  rows.forEach(function(r){
    tr+='<tr><td class="mono" style="color:var(--accent2);font-weight:700">'+r.v+'</td>'+
      '<td>'+r.m+'</td><td>'+r.who+'</td><td class="mono">'+r.elem+'</td>'+
      '<td>'+r.solver+'</td><td class="mono" style="color:var(--mut)">'+r.when+'</td>'+
      '<td><span class="pill '+r.p+'">'+r.st+'</span></td></tr>';
  });

  var diffs=[
    {l:"網格節點數",a:"1.62M",b:"1.84M",d:"+13.6%",c:"up"},
    {l:"最大 von Mises",a:"318 MPa",b:"286 MPa",d:"-10.1%",c:"up"},
    {l:"安全係數",a:"1.42",b:"1.58",d:"+0.16",c:"up"},
    {l:"求解時間",a:"46 min",b:"58 min",d:"+12 min",c:"down"}
  ];
  var df="";
  diffs.forEach(function(x){
    df+='<div class="param"><span>'+x.l+'</span>'+
      '<span><span style="color:var(--dim)">'+x.a+'</span> <span class="ms" style="font-size:13px;color:var(--dim)">arrow_right_alt</span> '+
      '<b>'+x.b+'</b> <span class="'+x.c+'" style="font-size:11px">'+x.d+'</span></span></div>';
  });

  return head(1)+
    '<div class="g13">'+
      '<div class="panel"><h3><span class="ms">history</span>版本快照<span class="ptag">案件 CAE-2287</span></h3>'+
        '<div class="tscroll"><table><thead><tr><th>版本</th><th>變更摘要</th><th>建立者</th><th>網格量</th><th>求解器</th><th>時間</th><th>狀態</th></tr></thead>'+
        '<tbody>'+tr+'</tbody></table></div>'+

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  }
  app.innerHTML=SCREENS[i].r();
  void app.offsetHeight;
  if(SCREENS[i].i) SCREENS[i].i();
}

nav.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==nav&&!t.hasAttribute("data-i")){t=t.parentNode;}
  if(t&&t.hasAttribute("data-i")){location.hash="v"+t.getAttribute("data-i");}
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
