<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研發工程模擬分析整合平台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#86EFAC;

  --ok:#15803D;
  --warn:#A34F00;
  --bad:#B91C1C;
  --info:#075985;
  --shadow:7px 7px 0 #14532D;
  --shadow-small:4px 4px 0 #14532D;
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:auto}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--color-foreground);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(21,128,61,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.09) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Exo",sans-serif;
  line-height:1.5;
}
button,canvas{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  display:inline-block;
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  font-size:1.25em;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  vertical-align:middle;
  -webkit-font-feature-settings:"liga";
  font-feature-settings:"liga";
}
.mono,.kv,.cxv,.mini,td:nth-child(1),td:nth-child(4),td:nth-child(6){
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#fff;
  background:#14532D;
  border-bottom:4px solid #0F172A;
}
.tbrow{
  width:min(1440px,100%);
  margin:auto;
  min-height:76px;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:3px solid #fff;
  box-shadow:4px 4px 0 #0F172A;
}
.logo .ms{font-size:28px}
.bttl{
  font-size:18px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:.03em;
}
.bsub{margin-top:3px;color:#DCFCE7;font-size:12px}
.tbstat{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  color:#fff;
  background:#0F172A;
  border:2px solid #fff;
  font-size:12px;
  font-family:"Roboto Mono",monospace;
}
.pulse{
  width:12px;
  height:12px;
  flex:0 0 auto;
  background:#22C55E;
  border:2px solid #fff;
}
.navwrap{
  position:sticky;
  top:76px;
  z-index:35;
  background:#fff;
  border-bottom:3px solid #14532D;
}
.nav{
  width:min(1440px,100%);
  margin:auto;
  padding:8px 16px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nbtn{
  min-height:44px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  color:#334155;
  background:#E8F0F1;
  border:2px solid #14532D;
  border-radius:0;
  font-weight:800;
  font-size:12px;
  transition:background-color .18s,color .18s,transform .18s,box-shadow .18s;
}
.nbtn:hover{
  color:#14532D;
  background:#DCFCE7;
  transform:translate(-2px,-2px);
  box-shadow:3px 3px 0 #14532D;
}
.nbtn.on{
  color:#fff;
  background:#15803D;
  box-shadow:4px 4px 0 #0F172A;
  transform:translate(-2px,-2px);
}
.nbadge{
  padding:1px 5px;
  color:#0F172A;
  background:#FDE68A;
  border:1px solid currentColor;
  font-family:"Roboto Mono",monospace;
  font-size:9px;
  font-weight:700;
}
.nbtn.on .nbadge{color:#000;background:#F59E0B}
main{
  width:min(1440px,100%);
  margin:auto;
  padding:26px 20px 64px;
}
#app{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
.shead{
  position:relative;
  margin:0 0 24px;
  padding:19px 20px 18px 82px;
  min-height:78px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  flex-wrap:wrap;
  background:#fff;
  border:3px solid #14532D;
  box-shadow:var(--shadow);
}
.shead::after{
  content:"";
  position:absolute;
  right:18%;
  top:-3px;
  width:80px;
  height:11px;
  background:#D97706;
  border:3px solid #14532D;
}
.sh-ic{
  position:absolute;
  left:18px;
  top:14px;
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  color:#fff;
  background:#15803D;
  border:3px solid #0F172A;
}
.sh-ic .ms{font-size:27px}
.sh-t{
  font-size:clamp(20px,2vw,29px);
  line-height:1;
  font-weight:900;
  letter-spacing:.01em;
}
.sh-d{margin-top:7px;color:#475569;font-size:13px;font-weight:500}
.sh-tag{
  margin-left:auto;
  padding:6px 10px;
  color:#000;
  background:#F59E0B;
  border:2px solid #0F172A;
  font-family:"Roboto Mono",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.g2,.g3,.g4,.g13{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g13{grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr)}
.sp{height:18px}
.panel{
  position:relative;
  padding:17px;
  color:#14532D;
  background:#fff;
  border:3px solid #14532D;
  box-shadow:var(--shadow-small);
}
.panel h3{
  margin:0 0 15px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:3px solid #14532D;
  font-size:14px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.panel h3 .ms{color:#15803D;font-size:21px}
.ptag{
  margin-left:auto;
  color:#475569;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  font-weight:500;
  text-transform:none;
}
.kpi{
  position:relative;
  min-height:132px;
  padding:16px;
  overflow:hidden;
  color:#14532D;
  background:#fff;
  border:3px solid #14532D;
  box-shadow:var(--shadow-small);
}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:35px;
  height:35px;
  background:#BBF7D0;
  border-left:3px solid #14532D;
  border-bottom:3px solid #14532D;
}
.kpi .kl{
  display:flex;
  align-items:center;
  gap:7px;
  color:#475569;
  font-size:12px;
  font-weight:700;
}
.kpi .kl .ms{color:#15803D;font-size:18px}
.kpi .kv{
  margin-top:8px;
  color:#0F172A;
  font-size:30px;
  line-height:1.1;
  font-weight:700;
}
.kpi .kv small{
  margin-left:4px;
  color:#475569;
  font-family:"Exo",sans-serif;
  font-size:12px;
}
.kpi .kd{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:700;
}
.up{color:#166534}.down{color:#B91C1C}.flat{color:#475569}
.cwrap{position:relative;width:100%;overflow:hidden}
.tscroll{
  width:100%;
  overflow-x:auto;
  border:2px solid #14532D;
}
table{
  width:100%;
  min-width:570px;
  border-collapse:collapse;
  color:#0F172A;
  background:#fff;
  font-size:12px;
}
th{
  padding:10px 11px;
  color:#fff;
  background:#14532D;
  border-right:1px solid #86EFAC;
  text-align:left;
  white-space:nowrap;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
}
td{
  padding:10px 11px;
  border-right:1px solid #BBF7D0;
  border-bottom:1px solid #86EFAC;
  white-space:nowrap;
}
th:last-child,td:last-child{border-right:0}
tbody tr:nth-child(even){background:#F0FDF4}
tbody tr:hover{background:#DCFCE7}
td:nth-child(3),td:nth-child(4),td:nth-child(5),td:nth-child(6){text-align:right}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  color:#0F172A;
  background:#E8F0F1;
  border:2px solid currentColor;
  font-size:10px;
  line-height:1.3;
  font-weight:800;
  white-space:nowrap;
}
.p-ok{color:#166534;background:#DCFCE7}
.p-run{color:#075985;background:#E0F2FE}
.p-warn{color:#92400E;background:#FEF3C7}
.p-bad{color:#B91C1C;background:#FEE2E2}
.p-idle{color:#475569;background:#E8F0F1}
.p-acc{color:#14532D;background:#BBF7D0}
.bar{
  height:11px;
  min-width:70px;
  overflow:hidden;
  background:#E8F0F1;
  border:2px solid #14532D;
}
.bar>span,.ring>span{
  display:block;
  height:100%;
  background:#22C55E;
}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(150px,1fr));
  gap:10px;
}
.bcol{
  padding:10px;
  background:#E8F0F1;
  border:2px solid #14532D;
}
.bcol:nth-child(even){transform:translateY(8px)}
.bcol h4{
  margin:0 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#334155;
  font-size:11px;
  font-weight:900;
}
.bcol h4 b{
  min-width:24px;
  padding:1px 6px;
  color:#fff;
  background:#14532D;
  border:1px solid #0F172A;
  text-align:center;
  font-family:"Roboto Mono",monospace;
}
.card{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid #14532D;
  border-left:7px solid #22C55E;
  box-shadow:3px 3px 0 rgba(20,83,45,.32);
}
.card:last-child{margin-bottom:0}
.card .ct{font-size:12px;font-weight:800}
.card .cm{
  margin-top:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  color:#475569;
  font-size:10px;
}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  left:7px;
  top:3px;
  bottom:4px;
  width:4px;
  background:#14532D;
}
.tli{position:relative;padding:0 0 17px 13px}
.tli::before{
  content:"";
  position:absolute;
  left:-24px;
  top:3px;
  width:13px;
  height:13px;
  background:#F59E0B;
  border:3px solid #14532D;
}
.tli.done::before{background:#22C55E}
.tli .tlt{font-size:13px;font-weight:900}
.tli .tld{margin-top:2px;color:#475569;font-size:11px}
.tli .tlm{margin-top:4px;color:#475569;font:10px "Roboto Mono",monospace}
.lrow{
  padding:11px 3px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:2px solid #BBF7D0;
}
.lrow:last-child{border-bottom:0}
.lic{
  width:36px;
  height:36px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#fff;
  background:#15803D;
  border:2px solid #14532D;
}
.lmain{flex:1}
.lt{font-size:12px;font-weight:800}
.ld{color:#475569;font-size:10px}
.node{
  padding:14px;
  color:#14532D;
  background:#fff;
  border:3px solid #14532D;
  box-shadow:var(--shadow-small);
  text-align:left;
}
.node:nth-child(even){background:#DCFCE7;transform:translateY(8px)}
.node .nn{color:#475569;font:11px "Roboto Mono",monospace}
.node .nv{margin:6px 0;color:#0F172A;font:700 25px "Roboto Mono",monospace}
.node .ring{
  height:12px;
  overflow:hidden;
  background:#E8F0F1;
  border:2px solid #14532D;
}
.lmap{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:13px;
  align-items:center;
}
.lmid{
  padding:10px 5px;
  color:#14532D;
  text-align:center;
  font-weight:800;
}
.lmid .ms{font-size:34px}
.lbox{
  padding:13px;
  background:#F0FDF4;
  border:3px solid #14532D;
}
.lbox .lbt{
  margin-bottom:8px;
  color:#334155;
  font-size:12px;
  font-weight:900;
}
.param{
  padding:7px 0;
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:2px dashed #86EFAC;
  color:#475569;
  font-size:11px;
}
.param:last-child{border-bottom:0}
.param b{
  color:#0F172A;
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
  text-align:right;
}
.chk{
  margin-bottom:9px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#F8FAFC;
  border:2px solid #14532D;
}
.chk .cbox{
  width:28px;
  height:28px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:2px solid currentColor;
}
.chk.pass{border-left:8px solid #15803D}
.chk.fail{border-left:8px solid #B91C1C}
.chk.wait{border-left:8px solid #D97706}
.chk.pass .cbox{color:#166534;background:#DCFCE7}
.chk.fail .cbox{color:#B91C1C;background:#FEE2E2}
.chk.wait .cbox{color:#92400E;background:#FEF3C7}
.chk .cx{flex:1}
.chk .cxt{font-size:12px;font-weight:900}
.chk .cxd{color:#475569;font-size:10px}
.chk .cxv{
  color:#0F172A;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.mini{margin-top:3px;color:#475569;font-size:9px}
.hint{
  margin-top:12px;
  padding:9px;
  display:flex;
  align-items:flex-start;
  gap:7px;
  color:#334155;
  background:#FEF3C7;
  border:2px solid #D97706;
  font-size:11px;
  font-weight:600;
}
.hint .ms{color:#92400E;font-size:17px}
.flexb{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
@keyframes enter{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g13{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .navwrap{top:76px}
  main{padding:20px 14px 48px}
  .g2,.g3,.g13{grid-template-columns:1fr}
  .lmap{grid-template-columns:1fr}
  .lmid{transform:rotate(90deg)}
  .shead{padding-left:74px}
}
@media(max-width:560px){
  .tbrow{padding:9px 12px;min-height:70px}
  .tbstat{width:100%;margin-left:0;justify-content:center}
  .navwrap{position:relative;top:auto}
  .nav{padding:7px 10px}
  .navtxt{display:none}
  .nbtn{padding:8px 10px}
  .g4,.board{grid-template-columns:1fr}
  .kpi:nth-child(even),.bcol:nth-child(even),.node:nth-child(even){transform:none}
  .sh-tag{width:100%;margin-left:0;text-align:center}
  .shead::after{right:12px}
  .panel{padding:13px}
  .panel h3{align-items:flex-start;flex-wrap:wrap}
  .ptag{width:100%;margin-left:29px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #app{animation:none}
  .kpi:nth-child(even),.bcol:nth-child(even),.node:nth-child(even){transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="ms">science</span></div>
      <div>
        <div class="bttl">研發工程模擬分析整合平台</div>
        <div class="bsub">模擬分析軟體整合 · 研發控制台</div>
      </div>
    </div>
    <div class="tbstat">
      <span class="pulse" aria-hidden="true"></span>
      <span>狀態：求解叢集連線中</span>
      <span aria-hidden="true">|</span>
      <span>授權 22 / 30 席</span>
    </div>
  </div>
</header>

<div class="navwrap">
  <nav class="nav" id="nav" aria-label="平台功能"></nav>
</div>

<main>
  <div id="app"></div>
</main>

<script>
(function(){
"use strict";

var MODS=[
  {ic:"science",name:"模擬案件管理",badge:"CASE",t:"模擬案件管理",d:"CAE 分析案件建立、指派與進度追蹤"},
  {ic:"history",name:"版本控制",badge:"VER",t:"模型版本控制",d:"模型與求解設定版本快照與比對"},
  {ic:"account_tree",name:"設計資料連動",badge:"SYNC",t:"設計資料連動",d:"模擬結果與 CAD/PDM 設計參數雙向同步"},
  {ic:"insights",name:"多物理場結果",badge:"MULTI",t:"多物理場結果",d:"結構、熱、流體多工具結果彙整比較"},
  {ic:"build",name:"求解資源排程",badge:"HPC",t:"求解資源排程",d:"HPC 授權與運算節點佇列調度"},
  {ic:"fact_check",name:"設計驗證審核",badge:"GATE",t:"設計驗證審核",d:"收斂性、規格符合性判定與簽核放行"}
];

var charts={};
var app=document.getElementById("app");
var AX="#475569",GRID="rgba(21,128,61,.18)",LT="#14532D";

function head(i){
  var m=MODS[i];
  return '<div class="shead">'+
    '<div class="sh-ic" aria-hidden="true"><span class="ms">'+m.ic+'</span></div>'+
    '<div><div class="sh-t">'+m.t+'</div><div class="sh-d">'+m.d+'</div></div>'+
    '<div class="sh-tag">模組 '+(i+1)+' / 6 · '+m.badge+'</div></div>';
}
function destroyCharts(){
  for(var k in charts){
    if(charts[k]){
      try{charts[k].destroy()}catch(e){}
      charts[k]=null;
    }
  }
  charts={};
}
function gridOpts(extra){
  var o={
    maintainAspectRatio:false,
    responsive:true,
    plugins:{legend:{labels:{color:LT,font:{family:"Exo",size:11,weight:"600"},boxWidth:12,padding:12}}},
    scales:{
      x:{ticks:{color:AX,font:{family:"Roboto Mono",size:10}},grid:{color:GRID},border:{color:"#14532D"}},
      y:{ticks:{color:AX,font:{family:"Roboto Mono",size:10}},grid:{color:GRID},border:{color:"#14532D"}}
    }

    {st:"wait",ic:"schedule",t:"熱工況溫度上限",d:"78.4℃ 接近 80℃ 上限，待確認",v:"78.4℃"},
    {st:"pass",ic:"check",t:"網格獨立性",d:"三級網格結果偏差 < 3%",v:"2.1%"},
    {st:"fail",ic:"close",t:"疲勞壽命 ≥ 3e6",d:"工況E 僅 2.1e6，需設計調整",v:"2.1e6"}
  ],ck="";

  });
  var flow=[
    {done:true,tlt:"工程師提交結果 v4.2",tld:"林彥廷 · 附收斂報告",tlm:"08-13 14:20"},

    {done:false,tlt:"技術長終審（進行中）",tld:"疲勞項未達標，評估是否退回",tlm:"待處理"},
    {done:false,tlt:"設計凍結放行",tld:"通過後同步 PDM 並鎖定版本",tlm:"—"}
  ],tl="";
  flow.forEach(function(x){
    tl+='<div class="tli '+(x.done?"done":"")+'"><div class="tlt">'+x.tlt+'</div>'+
      '<div class="tld">'+x.tld+'</div><div class="tlm">'+x.tlm+'</div></div>';
  });
  return head(5)+'<div class="g13"><div class="panel"><h3><span class="ms" aria-hidden="true">fact_check</span>驗證判定項<span class="ptag">案件 CAE-2287 v4.2</span></h3>'+ck+
    '<div class="flexb" style="margin-top:6px"><span class="pill p-bad"><span class="ms" aria-hidden="true">block</span>1 項未通過</span>'+
    '<span style="font-size:12px;color:var(--muted)">4 通過 · 1 待確認 · 1 未通過</span></div></div>'+
    '<div class="panel"><h3><span class="ms" aria-hidden="true">approval</span>簽核流程<span class="ptag">四階審核</span></h3>'+
    '<div class="tl">'+tl+'</div><div class="hint"><span class="ms" aria-hidden="true">gavel</span>依 RULE-01：影響設計凍結之未達標項優先處理。</div></div></div>'+

    '<div class="cwrap" style="height:210px"><canvas id="c5a" aria-label="近期審核放行率月度趨勢圖"></canvas></div></div>';
}
function s5init(){
  mkChart("c5a",{type:"bar",data:{labels:["3月","4月","5月","6月","7月","8月"],
    datasets:[
      {label:"一次通過",data:[41,45,48,52,58,62],backgroundColor:"#15803D",stack:"a"},
      {label:"退回重算",data:[14,12,11,9,7,6],backgroundColor:"#D97706",stack:"a"},
      {label:"通過率 %",data:[74.5,78.9,81.3,85.2,89.2,91.2],type:"line",yAxisID:"y1",borderColor:"#075985",backgroundColor:"#075985",tension:.35,pointRadius:3}
    ]},options:{maintainAspectRatio:false,responsive:true,
      plugins:{legend:{labels:{color:LT,font:{family:"Exo",size:11,weight:"600"},boxWidth:12,padding:10}}},
      scales:{
        x:{ticks:{color:AX,font:{family:"Roboto Mono",size:10}},grid:{color:GRID},stacked:true},
        y:{ticks:{color:AX,font:{family:"Roboto Mono",size:10}},grid:{color:GRID},stacked:true},
        y1:{position:"right",min:60,max:100,ticks:{color:"#075985",font:{family:"Roboto Mono",size:10}},grid:{drawOnChartArea:false}}
      }}});
}

var SCREENS=[
  {r:s0,i:s0init},{r:s1,i:s1init},{r:s2,i:s2init},
  {r:s3,i:s3init},{r:s4,i:s4init},{r:s5,i:s5init}
];

var nav=document.getElementById("nav"),navHtml="";
MODS.forEach(function(m,i){
  navHtml+='<button class="nbtn" type="button" data-i="'+i+'" aria-label="'+m.name+'">'+
    '<span class="ms" aria-hidden="true">'+m.ic+'</span><span class="navtxt">'+m.name+
    '</span><span class="nbadge">'+m.badge+'</span></button>';
});
nav.innerHTML=navHtml;

function animateItems(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var items=app.querySelectorAll(".grid-item");
  items.forEach(function(item,index){
    item.animate(
      [{opacity:0,transform:"translateY(16px) scale(.92)"},{opacity:1,transform:getComputedStyle(item).transform==="none"?"none":getComputedStyle(item).transform}],
      {duration:380,delay:index*60,easing:"cubic-bezier(.34,1.56,.64,1)",fill:"both"}
    );
  });
}
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  app.innerHTML=SCREENS[i].r();
  void app.offsetHeight;
  animateItems();
  if(SCREENS[i].i)SCREENS[i].i();
}
nav.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==nav&&!t.hasAttribute("data-i"))t=t.parentNode;
  if(t&&t.hasAttribute("data-i"))location.hash="v"+t.getAttribute("data-i");
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
