<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客戶評分卡管理 Customer Scorecard Management｜Jvision Demo</title>
  <meta name="description" content="客戶評分數據匯入、多維度評分彙總、趨勢分析與低分項目改善追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#a16207; --accent2:#eab308; --accent-soft:#fef9c3;
      --bg:#faf9f5; --panel:#ffffff; --ink:#1c1917; --muted:#78716c;
      --line:#e7e5e4; --good:#15803d; --warn:#b45309; --bad:#b91c1c;
      --chip:#f5f5f4;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
    a{color:inherit;text-decoration:none}

    /* top nav */
    .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#78500a,#a16207);color:#fff;border-bottom:3px solid var(--accent2)}
    .topbar-inner{max-width:1360px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-width:0}
    .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent2);color:#3b2a05;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
    .brand small{display:block;font-weight:500;font-size:11px;opacity:.8}
    nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0}
    nav.tabs button{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:#fde9b0;font-family:inherit;font-size:13px;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
    nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
    nav.tabs button.active{background:#fff;color:var(--accent)}
    nav.tabs button .material-symbols-outlined{font-size:19px}

    .wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
    .screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
    .screen-head h1{font-size:21px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px}
    .screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px}
    .screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .badge{background:var(--accent-soft);color:#854d0e;font-weight:700;font-size:12px;padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}

    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:2fr 1fr}
    .g32{grid-template-columns:1.4fr 1fr}
    .grid>*{min-width:0}

    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
    .card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
    .card .sub{color:var(--muted);font-size:12px;font-weight:500}

    .kpi{position:relative;overflow:hidden}
    .kpi .lab{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .val{font-size:28px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
    .kpi .val small{font-size:14px;font-weight:700;color:var(--muted)}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
    .kpi .up{color:var(--good)} .kpi .down{color:var(--bad)}
    .kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}

    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
    tbody tr:hover{background:#fdfcf9}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

    .pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
    .p-a{background:#dcfce7;color:#166534}.p-b{background:#fef3c7;color:#92400e}.p-c{background:#fee2e2;color:#991b1b}.p-n{background:#e0e7ff;color:#3730a3}
    .grade{display:inline-flex;width:26px;height:26px;border-radius:8px;font-weight:900;font-size:13px;align-items:center;justify-content:center;color:#fff}
    .gA{background:#15803d}.gB{background:#65a30d}.gC{background:#ca8a04}.gD{background:#dc2626}

    .bar{height:8px;border-radius:99px;background:#f1efe9;overflow:hidden;min-width:60px}
    .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .scoretag{font-weight:900;font-variant-numeric:tabular-nums}

    .chartbox{width:100%;overflow:hidden}

    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    .board>*{min-width:0}
    .col{background:#f7f5ef;border:1px solid var(--line);border-radius:12px;padding:10px}
    .col-h{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;padding:0 2px}
    .col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
    .task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12.5px}
    .task .t{font-weight:700;margin-bottom:4px}
    .task .m{color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:6px;margin-top:6px}

    .tl{position:relative;padding-left:22px}
    .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .ev{position:relative;padding:0 0 16px 0}
    .tl .ev:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:99px;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
    .tl .ev .th{font-weight:700;font-size:13px}
    .tl .ev .tm{color:var(--muted);font-size:11.5px}
    .tl .ev .td{font-size:12.5px;color:#44403c;margin-top:3px}

    .radar-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px}
    .radar-legend span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
    .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

    .stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .step{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;gap:9px;align-items:center}
    .step .n{width:26px;height:26px;border-radius:8px;background:var(--chip);color:var(--muted);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .step.done .n{background:var(--good);color:#fff}
    .step.active .n{background:var(--accent);color:#fff}
    .step .lb{font-size:12.5px;font-weight:700;min-width:0}
    .step .lb small{display:block;font-weight:500;color:var(--muted);font-size:11px}

    .list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
    .list-row:last-child{border-bottom:0}
    .av{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}

    .miniweight{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
    .miniweight:last-child{border:0}
    .miniweight .wname{width:96px;font-weight:700;font-size:13px;flex-shrink:0}
    .miniweight input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
    .miniweight .wval{width:52px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

    .note{background:var(--accent-soft);border:1px solid #fde68a;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#854d0e;display:flex;gap:8px}
    .note .material-symbols-outlined{font-size:19px;flex-shrink:0}

    .imp-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted)}

    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
    }
    @media(max-width:560px){
      nav.tabs button span.lbl{display:none}
      nav.tabs button{padding:9px 10px}
      .board{grid-template-columns:1fr}
      .brand small{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">評</div>
        <div>客戶評分卡管理<small>Customer Scorecard Management</small></div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main class="wrap"><div id="screen"></div></main>

  <script>
  (function(){
    var accent="#a16207", accent2="#eab308";
    var charts=[];
    function clearCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
    function esc(s){return (""+s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

    var MODS=[
      {icon:"dashboard",name:"評分總覽",sub:"客戶評分卡總覽與排名"},
      {icon:"description",name:"數據匯入",sub:"多來源評分數據匯入與標準化"},
      {icon:"rule",name:"評分模型",sub:"多維度權重與評級規則設定"},
      {icon:"insights",name:"趨勢分析",sub:"評分趨勢與雷達比較分析"},
      {icon:"task_alt",name:"改善追蹤",sub:"低分項目改善措施與成效追蹤"},
      {icon:"verified",name:"評核稽核",sub:"評分覆核、簽核與稽核軌跡"}
    ];

    // ---------- fake data ----------
    var CUST=[
      {code:"C-1042",name:"O昱精密",score:92.4,grade:"A",q:95,d:90,s:93,c:88,trend:2.1,tier:"策略客戶",owner:"陳彥廷"},
      {code:"C-0388",name:"O泰電子",score:88.1,grade:"A",q:90,d:85,s:89,c:87,trend:0.6,tier:"策略客戶",owner:"林孟潔"},
      {code:"C-1177",name:"O睦工業",score:81.7,grade:"B",q:84,d:78,s:83,c:80,trend:-1.4,tier:"重點客戶",owner:"黃柏勳"},
      {code:"C-0925",name:"O合光電",score:79.3,grade:"B",q:82,d:74,s:80,c:78,trend:1.2,tier:"重點客戶",owner:"陳彥廷"},
      {code:"C-1503",name:"O鋒機械",score:74.6,grade:"C",q:78,d:66,s:76,c:75,trend:-3.2,tier:"一般客戶",owner:"吳念真"},
      {code:"C-0611",name:"O達材料",score:71.2,grade:"C",q:75,d:64,s:72,c:70,trend:0.4,tier:"一般客戶",owner:"林孟潔"},
      {code:"C-1330",name:"O揚科技",score:63.8,grade:"D",q:70,d:55,s:62,c:66,trend:-4.8,tier:"觀察客戶",owner:"黃柏勳"},
      {code:"C-0742",name:"O泰塑膠",score:60.5,grade:"D",q:66,d:52,s:60,c:63,trend:-2.0,tier:"觀察客戶",owner:"吳念真"}
    ];

    function gradeCls(g){return g==="A"?"gA":g==="B"?"gB":g==="C"?"gC":"gD";}
    function tierPill(t){var m={"策略客戶":"p-a","重點客戶":"p-n","一般客戶":"p-b","觀察客戶":"p-c"};return '<span class="pill '+(m[t]||"p-b")+'">'+esc(t)+'</span>';}
    function trendHtml(v){var up=v>=0;return '<span class="'+(up?"kpi":"")+'" style="color:'+(up?"#15803d":"#b91c1c")+';font-weight:700;font-variant-numeric:tabular-nums"><span class="material-symbols-outlined" style="font-size:16px">'+(up?"trending_up":"trending_down")+'</span> '+(up?"+":"")+v.toFixed(1)+'</span>';}

    // ---------- screens ----------
    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function head(i,extra){
      return '<div class="screen-head"><div><h1><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+MODS[i].name+'</h1><p>'+MODS[i].sub+'</p></div><div>'+(extra||"")+'</div></div>';
    }

    // ===== Screen 0 : 評分總覽 =====
    function s0(el){
      var kpis=[
        {lab:"平均客戶評分",val:"78.9",unit:"分",d:"+3.2",up:true,ic:"grade"},
        {lab:"A/B 級客戶佔比",val:"50",unit:"%",d:"+8%",up:true,ic:"workspace_premium"},
        {lab:"低分項目改善完成率",val:"92",unit:"%",d:"+11%",up:true,ic:"task_alt"},
        {lab:"本期衰退客戶",val:"3",unit:"家",d:"+1",up:false,ic:"trending_down"}
      ];
      var kh="";
      for(var i=0;i<kpis.length;i++){var k=kpis[i];
        kh+='<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="lab">'+k.lab+'</div><div class="val">'+k.val+' <small>'+k.unit+'</small></div><div class="delta '+(k.up?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:15px">'+(k.up?"arrow_upward":"arrow_downward")+'</span>'+k.d+' 較上期</div></div>';
      }
      var rows="";
      var sorted=CUST.slice().sort(function(a,b){return b.score-a.score;});
      for(var j=0;j<sorted.length;j++){var c=sorted[j];
        rows+='<tr><td style="font-weight:800;color:var(--muted)">#'+(j+1)+'</td><td style="font-weight:700">'+esc(c.name)+'<br><span class="sub">'+c.code+'</span></td>'+
          '<td>'+tierPill(c.tier)+'</td>'+
          '<td class="num"><span class="scoretag">'+c.score.toFixed(1)+'</span></td>'+
          '<td><span class="grade '+gradeCls(c.grade)+'">'+c.grade+'</span></td>'+
          '<td style="min-width:120px"><div class="bar"><i style="width:'+c.score+'%"></i></div></td>'+
          '<td class="num">'+trendHtml(c.trend)+'</td>'+
          '<td>'+esc(c.owner)+'</td></tr>';
      }
      el.innerHTML=head(0,'<span class="badge"><span class="material-symbols-outlined" style="font-size:16px">calendar_month</span>2026 Q2 · 8 家受評客戶</span>')+
        '<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'+
        '<div class="grid g23">'+
          '<div class="card"><h3><span class="material-symbols-outlined">leaderboard</span>客戶評分排名</h3><div style="overflow-x:auto"><table><thead><tr><th>名次</th><th>客戶</th><th>分級</th><th class="num">總分</th><th>等級</th><th>分數條</th><th class="num">趨勢</th><th>業務</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>等級分布</h3><div id="c0a" class="chartbox"></div></div>'+
        '</div>';
      void el.offsetHeight;
      var gc={A:0,B:0,C:0,D:0}; for(var m=0;m<CUST.length;m++){gc[CUST[m].grade]++;}
      var ch=new ApexCharts(document.getElementById("c0a"),{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
        series:[gc.A,gc.B,gc.C,gc.D],labels:["A 級（優秀）","B 級（良好）","C 級（合格）","D 級（待改善）"],
        colors:["#15803d","#65a30d","#ca8a04","#dc2626"],
        legend:{position:"bottom",fontFamily:"Noto Sans TC"},
        dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
        plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"受評客戶",fontFamily:"Noto Sans TC",formatter:function(){return "8 家";}}}}}},
        stroke:{width:2}
      });
      ch.render(); charts.push(ch);
    }

    // ===== Screen 1 : 數據匯入 =====
    function s1(el){
      var files=[
        {name:"鴻昱_供應商評鑑_2026Q2.xlsx",src:"客戶ERP匯出",rows:126,mapped:126,st:"完成",cls:"p-a",fmt:"客戶自訂格式 A"},
        {name:"亞泰_季度評分表.csv",src:"EDI 傳輸",rows:98,mapped:98,st:"完成",cls:"p-a",fmt:"標準 CSV"},
        {name:"川睦_QBR紀錄.xlsx",src:"郵件附件",rows:54,mapped:49,st:"待對應",cls:"p-b",fmt:"客戶自訂格式 B"},
        {name:"泰鋒_交期考核.pdf",src:"人工上傳",rows:31,mapped:0,st:"欄位異常",cls:"p-c",fmt:"PDF 需 OCR"},
        {name:"聯合光電_服務問卷.csv",src:"問卷系統 API",rows:72,mapped:72,st:"完成",cls:"p-a",fmt:"標準 CSV"}
      ];
      var frows="";
      for(var i=0;i<files.length;i++){var f=files[i];var pct=f.rows?Math.round(f.mapped/f.rows*100):0;
        frows+='<tr><td style="font-weight:700"><span class="material-symbols-outlined" style="font-size:18px;color:var(--accent)">draft</span> '+esc(f.name)+'</td><td>'+esc(f.src)+'</td><td>'+esc(f.fmt)+'</td><td class="num">'+f.rows+'</td><td class="num">'+f.mapped+'</td><td style="min-width:110px"><div class="bar"><i style="width:'+pct+'%"></i></div></td><td><span class="pill '+f.cls+'">'+f.st+'</span></td></tr>';
      }
      // field mapping preview
      var maps=[
        {src:"客戶欄位「品質分數」","std":"品質維度 (Q)",st:"自動對應",ok:true},
        {src:"客戶欄位「準交率」","std":"交期維度 (D)",st:"自動對應",ok:true},
        {src:"客戶欄位「客服滿意」","std":"服務維度 (S)",st:"自動對應",ok:true},
        {src:"客戶欄位「合作意願」","std":"配合維度 (C)",st:"需人工確認",ok:false},
        {src:"客戶欄位「備註等級」","std":"（略過）",st:"未對應",ok:false}
      ];
      var mrows="";
      for(var j=0;j<maps.length;j++){var mp=maps[j];
        mrows+='<div class="list-row"><span class="material-symbols-outlined" style="color:'+(mp.ok?"#15803d":"#b45309")+'">'+(mp.ok?"check_circle":"help")+'</span><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(mp.src)+'</div><div class="sub" style="display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:14px">arrow_forward</span>'+esc(mp.std)+'</div></div><span class="imp-tag">'+esc(mp.st)+'</span></div>';
      }
      var steps=["接收檔案","格式辨識","欄位對應","標準化彙整","入庫"];
      var stepH="";
      for(var s=0;s<steps.length;s++){var cls=s<3?"done":(s===3?"active":"");
        stepH+='<div class="step '+cls+'"><div class="n">'+(s<3?'<span class="material-symbols-outlined" style="font-size:16px">check</span>':(s+1))+'</div><div class="lb">'+steps[s]+'</div></div>';
      }
      el.innerHTML=head(1,'<span class="badge"><span class="material-symbols-outlined" style="font-size:16px">cloud_upload</span>本批 5 檔 · 381 筆</span>')+
        '<div class="stepper">'+stepH+'</div>'+

    // ---------- nav + routing ----------
    function buildTabs(){
      var t=document.getElementById("tabs"),h="";
      for(var i=0;i<MODS.length;i++){
        h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="lbl">'+MODS[i].name+'</span></button>';
      }
      t.innerHTML=h;
      var btns=t.querySelectorAll("button");
      for(var j=0;j<btns.length;j++){
        btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
      }
    }
    function setActive(i){
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i); }
    }
    function show(i){
      clearCharts();
      var el=document.getElementById("screen");
      el.innerHTML="";
      setActive(i);
      void el.offsetHeight;
      (SCREENS[i]||SCREENS[0])(el);
    }
    buildTabs();
    window.show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
