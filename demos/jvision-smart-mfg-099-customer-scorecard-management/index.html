<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>客戶評分卡管理 Customer Scorecard Management｜Jvision Demo</title>
  <meta name="description" content="客戶評分數據匯入、多維度評分彙總、趨勢分析與低分項目改善追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#E2E8F0;
      --good:#15803D;
      --warn:#B45309;
      --bad:#B91C1C;
      --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .topbar:before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--blue) 0 74%,var(--color-accent) 74%)}
    .topbar-inner{max-width:1400px;min-height:70px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:26px}
    .brand{display:flex;align-items:center;gap:12px;min-width:280px;font-weight:700;letter-spacing:-.01em}
    .logo{width:38px;height:38px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:4px;font-family:"Fira Code",monospace;font-weight:700;box-shadow:5px 5px 0 #BFDBFE}
    .brand small{display:block;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:400;letter-spacing:.03em}
    .tabs{margin-left:auto;display:flex;gap:4px}
    .tabs button{min-height:42px;padding:9px 11px;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:4px;transition:background .2s,color .2s,border-color .2s}
    .tabs button:hover{background:var(--color-muted);color:var(--blue)}
    .tabs button.active{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
    .wrap{max-width:1400px;margin:auto;padding:34px 24px 64px}
    .screen-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
    .screen-head h1{margin:0;display:flex;align-items:center;gap:10px;font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.035em}
    .screen-head h1 .material-symbols-outlined{font-size:30px;color:var(--blue)}
    .screen-head p{margin:7px 0 0;color:var(--muted);font-size:14px}
    .badge,.pill,.imp-tag{display:inline-flex;align-items:center;gap:5px;font-weight:600}
    .badge{padding:7px 11px;color:#1E40AF;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:4px;font-family:"Fira Code",monospace;font-size:11px}
    .grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1.45fr 1fr}.grid>*{min-width:0}
    .card{background:var(--color-card);border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--shadow);min-width:0;transition:transform .2s,border-color .2s,box-shadow .2s}
    .card:hover{border-color:#CBD5E1;box-shadow:0 12px 30px rgba(15,23,42,.08)}
    .card h3{margin:0 0 15px;display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.01em}
    .card h3 .material-symbols-outlined{color:var(--blue)}
    .sub{color:var(--muted);font-size:12px}
    .kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
    .kpi:after{content:"";position:absolute;right:-22px;bottom:-35px;width:90px;height:90px;border:1px solid #DBEAFE;transform:rotate(45deg)}
    .kpi .lab{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
    .kpi .val{margin-top:8px;font-family:"Fira Code",monospace;font-size:28px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .kpi .val small{font-family:"Fira Sans",sans-serif;color:var(--muted);font-size:13px}
    .kpi .delta{margin-top:5px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
    .up{color:var(--good)}.down{color:var(--bad)}
    .kpi .ic{position:absolute;right:14px;top:14px;width:38px;height:38px;display:grid;place-items:center;background:#EFF6FF;color:var(--blue);border:1px solid #BFDBFE;border-radius:4px}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
    th{background:#F8FAFC;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.055em;text-transform:uppercase}
    tbody tr{transition:background .2s}
    tbody tr:hover{background:#F8FAFC}
    td.num,th.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    td .sub,.code,.time,.scoretag{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .scoretag{font-weight:700}
    .pill{padding:4px 8px;border:1px solid;border-radius:3px;font-size:11px}
    .pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .p-a{background:#F0FDF4;color:#166534;border-color:#BBF7D0}.p-b{background:#FFFBEB;color:#92400E;border-color:#FDE68A}.p-c{background:#FEF2F2;color:#991B1B;border-color:#FECACA}.p-n{background:#EFF6FF;color:#1E40AF;border-color:#BFDBFE}
    .grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:3px;color:#fff;font-family:"Fira Code",monospace;font-weight:700}
    .gA{background:#166534}.gB{background:#4D7C0F}.gC{background:#A16207}.gD{background:#B91C1C}
    .bar{height:7px;min-width:70px;background:#E2E8F0;overflow:hidden;border-radius:1px}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--color-secondary))}
    .chartbox{width:100%;overflow:hidden}
    .stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
    .step{display:flex;align-items:center;gap:9px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px;font-weight:600}
    .step .n{width:25px;height:25px;display:grid;place-items:center;background:var(--color-muted);color:var(--muted);border-radius:3px;font-family:"Fira Code",monospace}
    .step.done .n{background:var(--good);color:#fff}.step.active{border-color:#93C5FD;background:#EFF6FF}.step.active .n{background:var(--blue);color:#fff}
    .list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
    .list-row:last-child{border:0}
    .imp-tag{padding:3px 7px;background:var(--color-muted);color:#334155;border-radius:3px;font-size:10px}
    .note{margin-top:12px;padding:12px;display:flex;gap:8px;background:#FFF7ED;color:#9A3412;border-left:3px solid var(--color-accent);font-size:12px}
    .miniweight{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .wname{width:122px;font-size:12px;font-weight:600}.miniweight input{flex:1;accent-color:var(--blue)}.wval{width:48px;text-align:right;font-family:"Fira Code",monospace;font-weight:700}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:900px}
    .col{padding:10px;background:#F8FAFC;border-top:3px solid var(--blue)}
    .col-h{display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:700}
    .cnt{padding:1px 7px;background:#fff;border:1px solid var(--line);font-family:"Fira Code",monospace}
    .task{margin-bottom:8px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:3px;font-size:12px}
    .task .t{margin-bottom:7px;font-weight:600}.task .m{margin-top:8px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
    .tl{position:relative;padding-left:24px}.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:1px;background:#CBD5E1}.ev{position:relative;padding-bottom:18px}.ev:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px #93C5FD}.th{font-size:13px;font-weight:600}.tm{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}.td{margin-top:3px;color:#334155;font-size:12px}
    .av{width:32px;height:32px;display:grid;place-items:center;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;font-family:"Fira Code",monospace;font-weight:700}
    .radar-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;color:var(--muted);font-size:11px}.radar-legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px}
    .section-gap{margin-top:16px}
    @media(max-width:1024px){.topbar-inner{align-items:flex-start;padding-top:13px;padding-bottom:10px;flex-wrap:wrap}.brand{min-width:0}.tabs{width:100%;overflow:auto;margin-left:0}.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
    @media(max-width:768px){.wrap{padding:24px 16px 50px}.topbar-inner{padding-left:16px;padding-right:16px}.screen-head{align-items:flex-start;flex-direction:column}.stepper{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
    @media(max-width:480px){.g4{grid-template-columns:1fr}.tabs .lbl{display:none}.tabs button{min-width:44px;justify-content:center}.brand small{display:none}.card{padding:15px}.stepper{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="logo">評</div><div>客戶評分卡管理<small>Customer Scorecard Management</small></div></div>
      <nav class="tabs" id="tabs" aria-label="主要功能"></nav>
    </div>
  </header>
  <main class="wrap"><div id="screen"></div></main>
  <script>
  (function(){
    var accent="#2563EB",accent2="#EA580C",charts=[];
    var MODS=[
      {icon:"dashboard",name:"評分總覽",sub:"客戶評分卡總覽與排名"},
      {icon:"description",name:"數據匯入",sub:"多來源評分數據匯入與標準化"},
      {icon:"rule",name:"評分模型",sub:"多維度權重與評級規則設定"},
      {icon:"insights",name:"趨勢分析",sub:"評分趨勢與雷達比較分析"},
      {icon:"task_alt",name:"改善追蹤",sub:"低分項目改善措施與成效追蹤"},
      {icon:"verified",name:"評核稽核",sub:"評分覆核、簽核與稽核軌跡"}
    ];
    var CUST=[
      ["C-1042","O昱精密",92.4,"A",95,90,93,88,2.1,"策略客戶","陳彥廷"],
      ["C-0388","O泰電子",88.1,"A",90,85,89,87,.6,"策略客戶","林孟潔"],
      ["C-1177","O睦工業",81.7,"B",84,78,83,80,-1.4,"重點客戶","黃柏勳"],
      ["C-0925","O合光電",79.3,"B",82,74,80,78,1.2,"重點客戶","陳彥廷"],
      ["C-1503","O鋒機械",74.6,"C",78,66,76,75,-3.2,"一般客戶","吳念真"],
      ["C-0611","O達材料",71.2,"C",75,64,72,70,.4,"一般客戶","林孟潔"],
      ["C-1330","O揚科技",63.8,"D",70,55,62,66,-4.8,"觀察客戶","黃柏勳"],
      ["C-0742","O泰塑膠",60.5,"D",66,52,60,63,-2,"觀察客戶","吳念真"]
    ];
    function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
    function icon(n){return'<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
    function head(i,x){return'<div class="screen-head"><div><h1>'+icon(MODS[i].icon)+MODS[i].name+'</h1><p>'+MODS[i].sub+'</p></div><div>'+(x||"")+"</div></div>"}
    function badge(i,t){return'<span class="badge">'+icon(i)+t+"</span>"}
    function pill(t,c){return'<span class="pill '+c+'">'+esc(t)+"</span>"}
    function grade(g){return'<span class="grade g'+g+'" aria-label="'+g+' 級">'+g+"</span>"}
    function kpi(l,v,u,i,d,c){return'<div class="card kpi"><div class="ic">'+icon(i)+'</div><div class="lab">'+l+'</div><div class="val">'+v+" <small>"+u+'</small></div>'+(d?'<div class="delta '+c+'>'+icon(c==="up"?"arrow_upward":"arrow_downward")+d+"</div>":"")+"</div>"}
    function chart(id,opt){var c=new ApexCharts(document.getElementById(id),opt);c.render();charts.push(c)}
    function base(type,h){return{chart:{type:type,height:h||300,animations:{enabled:false},toolbar:{show:false},fontFamily:"Fira Sans"},grid:{borderColor:"#E2E8F0"},dataLabels:{enabled:false},legend:{position:"bottom",fontFamily:"Fira Sans"},stroke:{width:2}}}
    function s0(el){
      var rows=CUST.map(function(c,i){var pc={"策略客戶":"p-a","重點客戶":"p-n","一般客戶":"p-b","觀察客戶":"p-c"}[c[9]],up=c[8]>=0;return"<tr><td class=code>#"+(i+1)+'</td><td><strong>'+c[1]+'</strong><br><span class=sub>'+c[0]+"</span></td><td>"+pill(c[9],pc)+'</td><td class=num><span class=scoretag>'+c[2].toFixed(1)+"</span></td><td>"+grade(c[3])+'</td><td><div class=bar><i style="width:'+c[2]+'%"></i></div></td><td class="num '+(up?"up":"down")+'">'+icon(up?"trending_up":"trending_down")+(up?"+":"")+c[8].toFixed(1)+"</td><td>"+c[10]+"</td></tr>"}).join("");
      el.innerHTML=head(0,badge("calendar_month","2026 Q2 · 8 家受評客戶"))+'<div class="grid g4">'+kpi("平均客戶評分","78.9","分","grade","+3.2 較上期","up")+kpi("A/B 級客戶佔比","50","%","workspace_premium","+8% 較上期","up")+kpi("低分項目改善完成率","92","%","task_alt","+11% 較上期","up")+kpi("本期衰退客戶","3","家","trending_down","+1 較上期","down")+'</div><div class="grid g23 section-gap"><div class=card><h3>'+icon("leaderboard")+'客戶評分排名</h3><div class=table-wrap><table><thead><tr><th>名次</th><th>客戶</th><th>分級</th><th class=num>總分</th><th>等級</th><th>分數條</th><th class=num>趨勢</th><th>業務</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class=card><h3>'+icon("donut_large")+'等級分布</h3><div id=c0a class=chartbox></div></div></div>';
      var o=base("donut",300);o.series=[2,2,2,2];o.labels=["A 級（優秀）","B 級（良好）","C 級（合格）","D 級（待改善）"];o.colors=["#166534","#4D7C0F","#A16207","#B91C1C"];o.dataLabels={enabled:true,formatter:function(v){return Math.round(v)+"%"}};o.plotOptions={pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"受評客戶",formatter:function(){return"8 家"}}}}}};chart("c0a",o)
    }
    function s1(el){
      var fs=[
        ["鴻昱_供應商評鑑_2026Q2.xlsx","客戶ERP匯出","客戶自訂格式 A",126,126,"完成","p-a"],
        ["亞泰_季度評分表.csv","EDI 傳輸","標準 CSV",98,98,"完成","p-a"],
        ["川睦_QBR紀錄.xlsx","郵件附件","客戶自訂格式 B",54,49,"待對應","p-b"],
        ["泰鋒_交期考核.pdf","人工上傳","PDF 需 OCR",31,0,"欄位異常","p-c"],
        ["聯合光電_服務問卷.csv","問卷系統 API","標準 CSV",72,72,"完成","p-a"]
      ];
      var rows=fs.map(function(f){var p=Math.round(f[4]/f[3]*100);return"<tr><td><strong>"+icon("draft")+f[0]+"</strong></td><td>"+f[1]+"</td><td>"+f[2]+'</td><td class=num>'+f[3]+'</td><td class=num>'+f[4]+'</td><td><div class=bar><i style="width:'+p+'%"></i></div></td><td>'+pill(f[5],f[6])+"</td></tr>"}).join("");
      var maps=[["品質分數","品質維度 (Q)","自動對應",1],["準交率","交期維度 (D)","自動對應",1],["客服滿意","服務維度 (S)","自動對應",1],["合作意願","配合維度 (C)","需人工確認",0],["備註等級","（略過）","未對應",0]].map(function(m){return'<div class=list-row>'+icon(m[3]?"check_circle":"help")+'<div style="flex:1"><strong>客戶欄位「'+m[0]+'」</strong><div class=sub>'+icon("arrow_forward")+m[1]+'</div></div><span class=imp-tag>'+m[2]+"</span></div>"}).join("");
      var steps=["接收檔案","格式辨識","欄位對應","標準化彙整","入庫"].map(function(s,i){return'<div class="step '+(i<3?"done":i===3?"active":"")+'"><div class=n>'+(i<3?icon("check"):i+1)+'</div>'+s+"</div>"}).join("");
      el.innerHTML=head(1,badge("cloud_upload","本批 5 檔 · 381 筆"))+'<div class=stepper>'+steps+'</div><div class="grid g4">'+kpi("匯入檔案","5","檔","upload_file")+kpi("原始筆數","381","筆","table_rows")+kpi("成功標準化","345","筆","done_all")+kpi("待處理例外","36","筆","error")+'</div><div class="grid g32 section-gap"><div class=card><h3>'+icon("description")+'匯入批次清單</h3><div class=table-wrap><table><thead><tr><th>檔案</th><th>來源</th><th>原始格式</th><th class=num>筆數</th><th class=num>已對應</th><th>對應率</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class=note>'+icon("tips_and_updates")+'系統偵測「川睦_QBR紀錄」使用客戶自訂格式，已自動比對 90% 欄位，剩餘欄位請於右側確認對應。</div></div><div class=card><h3>'+icon("swap_horiz")+'欄位對應預覽</h3>'+maps+"</div></div>"
    }
    function s2(el){
