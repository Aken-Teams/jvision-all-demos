<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SBOM 與開源授權合規 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803d;
  --color-on-primary:#fff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#fff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#15803d;
  --blue:#15803d;
  --ink:#14532d;
  --muted:#475569;
  --line:#bbf7d0;
  --accent:#15803d;
  --accent2:#22c55e;
  --accent-soft:#dcfce7;
  --accent-soft2:#f0fdf4;
  --bg:#f0fdf4;
  --panel:#fff;
  --th:#ecfdf3;
  --hov:#f0fdf4;
  --track:#dbe9e1;
  --sidebar:#052e16;
  --sidebar2:#14532d;
  --side-edge:rgba(255,255,255,.16);
  --ok:#15803d;
  --warn:#b45309;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --r:4px;
  --shadow:0 1px 0 rgba(20,83,45,.08),0 8px 24px rgba(20,83,45,.06);
  --shadow-hover:0 2px 0 rgba(20,83,45,.1),0 14px 30px rgba(20,83,45,.1);
  --glow:rgba(21,128,61,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Exo",system-ui,sans-serif;line-height:1.25;letter-spacing:-.02em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#bbf7d0;color:#052e16}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;top:0;z-index:20;
  display:flex;flex:none;flex-direction:column;
  width:248px;height:100vh;padding:24px 16px 18px;
  color:#f0fdf4;
  background:var(--sidebar);
  border-right:1px solid #166534;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand-logo{
  display:grid;place-items:center;flex:none;
  width:42px;height:42px;border-radius:2px;
  color:var(--color-on-primary);background:var(--color-primary);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:6px 6px 0 rgba(34,197,94,.2);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em}
.brand-txt span{display:block;margin-top:2px;color:#bbf7d0;font-family:"Roboto Mono",monospace;font-size:9.5px;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:20px}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;min-width:0;
  padding:11px 10px;color:#d1fae5;background:transparent;
  border:1px solid transparent;border-radius:2px;text-align:left;
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background-color 220ms ease,border-color 220ms ease,color 220ms ease,transform 220ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#fff;background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12);transform:translateX(2px)}
.nav button.on{color:#052e16;background:#fff;border-color:#fff;font-weight:700}
.nav button.on::before{content:"";position:absolute;left:-17px;top:7px;bottom:7px;width:4px;background:var(--color-secondary)}
.nav .idx{margin-left:auto;color:inherit;font-family:"Roboto Mono",monospace;font-size:10px;opacity:.68}
.side-foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.14);color:#bbf7d0;font-family:"Roboto Mono",monospace;font-size:10px;line-height:1.8}
.side-foot b{color:#fff}

.main{flex:1;min-width:0;padding:28px 30px 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 auto 22px;max-width:1500px}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:26px}
.topbar .sub{margin-top:5px;color:var(--color-muted-foreground);font-size:12px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;color:var(--color-muted-foreground);background:var(--color-card);border:1px solid var(--color-border);border-radius:2px;font-size:11px;font-weight:600;box-shadow:0 1px 0 rgba(20,83,45,.05)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.14);animation:pulse 2s ease-in-out infinite}
.avatar{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:2px;color:#fff;background:var(--color-primary);font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700}
#screen{max-width:1500px;margin:0 auto;animation:screen-in 420ms cubic-bezier(.2,.75,.25,1) both}
#screen::before{content:"";display:block;width:72px;height:3px;margin-bottom:14px;background:linear-gradient(90deg,var(--color-primary) 0 68%,var(--color-accent) 68%)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  color:var(--color-card-foreground);background:var(--color-card);
  border:1px solid var(--color-border);border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform 220ms ease,box-shadow 220ms ease,border-color 220ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);border-color:#86efac;box-shadow:var(--shadow-hover)}
.card,.sec{padding:17px;min-width:0}
.sec{margin-bottom:14px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.sec>p{margin:0 0 13px;color:var(--color-muted-foreground);font-size:13px;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card-h .hint{color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10px}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;min-width:0;overflow:hidden;padding:15px 17px}
.kpi::before,.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-primary)}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:76px;height:76px;border:1px solid var(--color-border);transform:rotate(45deg)}
.kpi .ico{position:relative;z-index:1;display:grid;place-items:center;width:36px;height:36px;border:1px solid #86efac;border-radius:2px;color:var(--color-primary);background:var(--accent-soft)}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:11px;color:var(--color-muted-foreground);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-primary);font-size:15px}
.kpi .val,.stat .val,.tile .tv{margin-top:3px;font-family:"Roboto Mono",monospace;font-size:25px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Exo",sans-serif;font-size:12px;font-weight:600}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#166534}.delta.down,.d.down{color:#b91c1c}.delta.flat,.d.flat{color:var(--color-muted-foreground)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0 .card-h{margin:0;padding:16px 17px 12px;border-bottom:1px solid var(--color-border)}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{padding:10px 13px;color:#334155;background:var(--th);border-bottom:1px solid #86efac;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
td{padding:10px 13px;border-bottom:1px solid #dcfce7;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background-color 180ms ease}
tbody tr:hover{background:var(--hov)}
th:nth-child(n+3),td:nth-child(n+3){font-variant-numeric:tabular-nums}
td:has(>b),td:has(>.prog){font-family:"Roboto Mono",monospace}
.mono{font-family:"Roboto Mono",monospace;font-weight:600;letter-spacing:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:700;line-height:1.3;white-space:nowrap}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-ok{color:#166534;background:#f0fdf4}
.t-warn{color:#92400e;background:#fffbeb}
.t-bad{color:#991b1b;background:#fef2f2}
.t-info{color:#1e40af;background:#eff6ff}
.t-gray{color:#475569;background:#f1f5f9}
.t-acc,.t-pink{color:#166534;background:#dcfce7}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #cbd5e1;border-radius:0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:0;transition:width 420ms ease}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:42px;color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--color-border)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--color-primary)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12px}
.tl-item p,.tl-i p{margin:0;color:var(--color-muted-foreground);font-size:11px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--color-border);font-size:12px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--color-muted-foreground)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--color-muted-foreground);font-size:10px}
.note{margin-top:13px;padding-top:12px;color:var(--color-muted-foreground);border-top:1px dashed var(--color-border);font-size:11px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--th);border:1px solid var(--color-border);border-radius:2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;font-size:12px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:var(--color-muted-foreground);background:#fff;border:1px solid var(--color-border);border-radius:999px;font-family:"Roboto Mono",monospace;font-size:10px}
.pcard{padding:11px 12px;background:#fff;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:2px;transition:transform 200ms ease,box-shadow 200ms ease}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard b{font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:10px}
.mini-av,.av{display:inline-grid;place-items:center;flex:none;color:var(--color-primary);background:var(--accent-soft);border:1px solid #86efac;font-family:"Roboto Mono",monospace;font-weight:700}
.mini-av{width:18px;height:18px;border-radius:2px;font-size:8px}
.av{width:26px;height:26px;border-radius:2px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--color-border);border-radius:2px}
.lane-row .num{display:grid;place-items:center;flex:none;width:31px;height:31px;color:var(--color-primary);background:var(--accent-soft);border:1px solid #86efac;border-radius:2px;font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--color-muted-foreground);font-size:11px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:grid;place-items:center;width:22px;height:22px;color:#64748b;background:#fff;border:2px solid #cbd5e1;border-radius:50%;font-family:"Roboto Mono",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:#cbd5e1}
.steps .s.done{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:var(--color-primary);border-color:var(--color-primary);animation:pulse 1.6s infinite}
.steps .ln.done{background:var(--color-primary)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--color-border)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12px}
.rep-row .sku span{color:var(--color-muted-foreground);font-size:10px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track)}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:9px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border-radius:2px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--color-muted-foreground)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--color-primary);border-radius:1px;box-shadow:0 2px 6px var(--glow)}

.tile{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0;padding:15px 17px 15px 20px;overflow:hidden}
.tile .ti{display:grid;place-items:center;width:36px;height:36px;color:var(--color-primary);background:var(--accent-soft);border:1px solid #86efac;border-radius:2px}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tile p{margin:0;color:var(--color-muted-foreground);font-size:11px;line-height:1.55}
.tile .tv{font-size:22px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes screen-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:14px;align-items:start}
  #screen::before{grid-column:1/-1;margin-bottom:0}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-of-type{grid-column:2;grid-row:2/span 99;display:flex;flex-direction:column;gap:12px;position:sticky;top:18px}
  #screen>.grid.g4:first-of-type>*{width:100%}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;flex-direction:row;align-items:center;flex-wrap:wrap;border-right:0;border-bottom:1px solid #166534}
  .brand{padding:0 12px 0 4px;border:0}.brand-logo{width:36px;height:36px;box-shadow:4px 4px 0 rgba(34,197,94,.18)}
  .side-foot{display:none}.nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:0}
  .nav button{min-height:42px;padding:9px 11px}.nav button.on::before{left:8px;right:8px;top:auto;bottom:-2px;width:auto;height:3px}
  .nav .idx{display:none}.main{padding:20px 16px 48px}.topbar{align-items:center}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:700px){.dl{grid-template-columns:1fr;gap:2px}.dl dt{margin-top:9px}}
@media(max-width:560px){
  .g4{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h1{font-size:18px}
  .top-right{justify-content:flex-start}.nav button .txt{display:none}.nav button{justify-content:center;min-width:42px;padding:9px}
  .card,.sec{padding:14px}.tile{padding:14px 14px 14px 18px}.kpi .val,.stat .val{font-size:22px}
}
@media(max-width:390px){.g4{grid-template-columns:1fr}.chip:nth-child(2){display:none}.main{padding-inline:12px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen,.card,.sec,.kpi,.stat,.tile,.pcard,.nav button{transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">policy</span></div>
      <div class="brand-txt"><b>SBOM 合規台</b><span>SBOM COMPLIANCE</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">產品 24 條線<br/>元件 1,486 個<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

var AX={style:{colors:"#76938d",fontSize:"11px"}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};
var CURVE="smooth", BR=5;
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function _h(x,d){return typeof x==="number"?(x>0&&x<20?Math.round(d*x):x):d}
function mkArea(el,data,cats,name,x){push(el,{chart:Object.assign({},CB,{type:"area",height:_h(x,230)}),series:[{name:name,data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e8f6ed",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:3},colors:[typeof x==="string"?x:"#16a34a"],
 fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.38,opacityTo:.04,stops:[0,90]}},tooltip:{theme:"light"}})}
function mkBar(el,cats,data,name,horiz,a6,a7){
 var color=typeof a6==="string"?a6:"#16a34a", min=typeof a6==="number"?a6:undefined, h=_h(a7,230);
 push(el,{chart:Object.assign({},CB,{type:"bar",height:h}),series:[{name:name||"數值",data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{min:min,labels:{style:AX.style}},grid:{borderColor:"#e8f6ed",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR,horizontal:!!horiz,columnWidth:"54%",barHeight:"60%"}},
 colors:[color],tooltip:{theme:"light"}})}
function mkStack(el,cats,series,horiz,h){push(el,{chart:Object.assign({},CB,{type:"bar",height:_h(h,245),stacked:true}),series:series,
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e8f6ed",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR?3:0,horizontal:!!horiz,columnWidth:"55%",barHeight:"62%"}},
 legend:{position:"bottom",fontSize:"11.5px"},colors:["#16a34a","#6ed392","#a8e5be","#107535","#c2e7d0","#0b4e24"],tooltip:{theme:"light"}})}
function mkDonut(el,labels,data,h){push(el,{chart:Object.assign({},CB,{type:"donut",height:_h(h,240)}),series:data,labels:labels,
 colors:["#16a34a","#6ed392","#a8e5be","#107535","#c2e7d0","#0b4e24"],legend:{position:"bottom",fontSize:"11.5px"},dataLabels:{enabled:false},
 plotOptions:{pie:{donut:{size:BR?"64%":"52%"}}},stroke:{width:2},tooltip:{theme:"light"}})}
function mkRadar(el,cats,data,name,h){push(el,{chart:Object.assign({},CB,{type:"radar",height:_h(h,270)}),series:[{name:name||"分數",data:data}],
 xaxis:{categories:cats},yaxis:{show:false},colors:["#16a34a"],markers:{size:4},dataLabels:{enabled:false},tooltip:{theme:"light"}})}
function mkLine2(el,cats,s1,s2,h){push(el,{chart:Object.assign({},CB,{type:"line",height:_h(h,240)}),series:[s1,s2],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e8f6ed",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:[3,3],dashArray:[0,5]},colors:["#16a34a","#6ed392"],
 legend:{position:"top",fontSize:"11.5px"},tooltip:{theme:"light"}})}
function mkHeat(el,series,h){push(el,{chart:Object.assign({},CB,{type:"heatmap",height:_h(h,300)}),series:series,
 dataLabels:{enabled:false},xaxis:{labels:AX},yaxis:{labels:{style:AX.style}},
 legend:{position:"bottom",fontSize:"11px"},tooltip:{theme:"light"},stroke:{width:2,colors:["#fff"]}})}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
