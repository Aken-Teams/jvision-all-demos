<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
--color-primary:#059669;--color-on-primary:#000;--color-secondary:#10B981;--color-on-secondary:#0F172A;
--color-accent:#059669;--color-on-accent:#000;--color-background:#ECFDF5;--color-foreground:#064E3B;
--color-card:#FFF;--color-card-foreground:#064E3B;--color-muted:#E8F1F3;--color-muted-foreground:#475569;
--color-border:#A7F3D0;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#059669;
--blue:#059669;--ink:#064E3B;--muted:#475569;--line:#A7F3D0;
--warn:#A16207;--ok:#047857;--bad:#B91C1C;--info:#1D4ED8;--panel:#FFF;--th:#D1FAE5;--track:#DDEBE7;
}
*{box-sizing:border-box}
html{background:var(--color-background)}
body{margin:0;background-color:var(--color-background);background-image:linear-gradient(rgba(5,150,105,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(5,150,105,.09) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font:14px/1.5 "Fira Sans","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:500;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#052E25;color:#ECFDF5;border-right:4px solid #000}
.brand{display:flex;align-items:center;gap:12px;padding:22px 18px;border-bottom:2px solid #34D399}
.brand-logo{display:grid;place-items:center;width:48px;height:48px;flex:none;background:#34D399;border:3px solid #000;color:#000;box-shadow:6px 6px 0 #059669}
.brand-logo span{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.brand-txt span{display:block;margin-top:4px;color:#A7F3D0;font:500 10px/1.3 "Fira Code",monospace;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;padding:18px 12px;gap:8px}
.nav button{width:100%;min-height:48px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:transparent;color:#D1FAE5;border:2px solid transparent;border-radius:0;text-align:left;font-weight:600}
.nav button:hover{background:#064E3B;border-color:#6EE7B7}
.nav button.on{background:#34D399;color:#000;border-color:#000;box-shadow:5px 5px 0 #000}
.nav .idx{font:700 11px "Fira Code",monospace}
.side-foot{margin-top:auto;padding:18px;border-top:2px solid #34D399;color:#A7F3D0;font:500 11px/1.7 "Fira Code",monospace}
.side-foot b{color:#FFF}
.main{min-width:0;padding:28px 32px 64px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;padding:20px;background:#FFF;border:3px solid #000;box-shadow:8px 8px 0 #059669}
.topbar h1{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(21px,2.5vw,32px);line-height:1.15;font-weight:700;letter-spacing:-.03em}
.topbar h1 .material-symbols-outlined{font-size:30px;color:#059669}
.topbar .sub{margin-top:7px;color:var(--muted);font-weight:500}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 10px;background:#ECFDF5;border:2px solid #064E3B;color:#064E3B;font:600 11px "Fira Code",monospace}
.dot{width:10px;height:10px;background:#059669;border:2px solid #064E3B}
.avatar{display:grid;place-items:center;width:38px;height:38px;background:#059669;border:2px solid #000;color:#000;font-weight:700}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.tile{background:#FFF;border:3px solid #064E3B;border-radius:0;box-shadow:6px 6px 0 #A7F3D0}
.card{padding:18px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:700}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:#059669}
.card-h .hint{color:var(--muted);font:500 11px "Fira Code",monospace}
.tile{position:relative;min-height:156px;padding:18px;border-color:#000;box-shadow:7px 7px 0 #059669}
.tile:nth-child(even){transform:translateY(8px)}
.tile .ti{display:grid;place-items:center;width:39px;height:39px;margin-bottom:17px;background:#34D399;border:2px solid #000;color:#000}
.tile .ti span{font-size:22px}
.tile b{font-size:13px}
.tile .tv{margin-top:auto;font:700 clamp(25px,3vw,34px)/1.1 "Fira Code",monospace;letter-spacing:-.05em}
.tile p{margin:7px 0 0;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 14px;background:#064E3B;color:#FFF;border-right:1px solid #6EE7B7;border-bottom:3px solid #000;text-align:left;font:600 11px "Fira Code",monospace;letter-spacing:.03em;white-space:nowrap}
td{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#F0FDF4}
tbody tr:hover{background:#D1FAE5}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
td:has(.prog),td:has(.tag){vertical-align:middle}
.mono{font-family:"Fira Code",monospace;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:2px solid currentColor;border-radius:0;font-size:11px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:7px;height:7px;background:currentColor}
.t-ok{background:#D1FAE5;color:#065F46}.t-warn{background:#FEF3C7;color:#854D0E}.t-bad{background:#FEE2E2;color:#991B1B}.t-info{background:#DBEAFE;color:#1E40AF}.t-gray{background:#F1F5F9;color:#475569}.t-acc,.t-pink{background:#D1FAE5;color:#065F46}
.prog{display:flex;align-items:center;gap:8px;min-width:130px}
.bar{height:12px;flex:1;background:var(--track);border:1px solid #064E3B}
.bar i{display:block;height:100%;background:#059669}
.prog small{width:38px;text-align:right;color:#334155;font:600 11px "Fira Code",monospace}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
.app{display:block}.sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid #000}.brand{padding:14px}.nav{display:grid;grid-template-columns:repeat(4,1fr);padding:10px}.nav button{grid-template-columns:24px 1fr}.nav .idx,.side-foot{display:none}.main{padding:20px 16px 48px}.topbar{align-items:flex-start}
}
@media(max-width:700px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}.topbar{display:block}.top-right{justify-content:flex-start;margin-top:16px}.nav button{display:flex;justify-content:center}.nav .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media(max-width:500px){.g4{grid-template-columns:1fr}.tile:nth-child(even){transform:none}.main{padding-inline:12px}.topbar{box-shadow:5px 5px 0 #059669}}
@media(prefers-reduced-motion:no-preference){
#screen>.grid{animation:reveal .42s cubic-bezier(.22,1.25,.4,1) both}
#screen>.grid:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3){animation-delay:.12s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="app">
<aside class="sidebar">
<div class="brand">
<div class="brand-logo"><span class="material-symbols-outlined">park</span></div>

<script>
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tbl(h,r){return'<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+r.map(function(x){return'<tr>'+x.map(function(c,i){return'<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return'<div class="prog" aria-label="完成 '+p+'%"><div class="bar"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
function card(t,ic,body,hint){return'<section class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function cardT(t,ic,body,hint){return'<section class="card pad0"><div class="card-h" style="padding:18px 18px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function tile(ic,t,v,p){return'<article class="tile"><div class="ti"><span class="material-symbols-outlined">'+ic+'</span></div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>'}
var AX={style:{colors:"#475569",fontSize:"11px",fontFamily:"Fira Code"}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Fira Sans"};
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function mkBar(el,cats,data,name,horiz,min){push(el,{chart:Object.assign({},CB,{type:"bar",height:250}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:AX},yaxis:{min:typeof min==="number"?min:void 0,labels:{style:AX.style}},grid:{borderColor:"#A7F3D0",strokeDashArray:0},dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:0,horizontal:!!horiz,columnWidth:"58%",barHeight:"66%"}},colors:["#059669"],tooltip:{theme:"light"}})}
function mkArea(el,data,cats,name){push(el,{chart:Object.assign({},CB,{type:"area",height:250}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#A7F3D0"},dataLabels:{enabled:false},stroke:{curve:"straight",width:4},colors:["#059669"],fill:{type:"solid",opacity:.18},tooltip:{theme:"light"}})}
function mkDonut(el,labels,data){push(el,{chart:Object.assign({},CB,{type:"donut",height:250}),series:data,labels:labels,colors:["#059669","#10B981","#34D399","#047857","#F59E0B","#064E3B"],legend:{position:"bottom",fontSize:"11px"},dataLabels:{enabled:false},plotOptions:{pie:{donut:{size:"58%"}}},stroke:{width:3,colors:["#fff"]},tooltip:{theme:"light"}})}
function mkRadar(el,cats,data,name){push(el,{chart:Object.assign({},CB,{type:"radar",height:270}),series:[{name:name,data:data}],xaxis:{categories:cats,labels:{style:{colors:"#475569"}}},yaxis:{show:false},colors:["#059669"],fill:{opacity:.18},stroke:{width:3},markers:{size:4,strokeWidth:2},dataLabels:{enabled:false},tooltip:{theme:"light"}})}

var MODULES=[
{icon:"dashboard",name:"自然議題總覽",sub:"據點敏感度與依賴衝擊盤點"},

c.innerHTML=
'<div class="grid g4">'+
tile("park","評估據點","5 處","含 2 家關鍵供應商所在地")+

["<b>供應商 B（華南）</b>","—","工業區","14.6 km","<span class='tag t-bad'>4.4（高）</span>","<span class='tag t-gray'>不明</span>","<span class='tag t-bad'>不明</span>","<span class='tag t-warn'>中</span>","<span class='tag t-warn'>不可控</span>","<span class='tag t-warn'>問卷</span>"]

var RENDER=[v0,v1,v2,v3];

function buildNav(){
var n=document.getElementById("nav");
n.innerHTML=MODULES.map(function(m,i){
return'<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'
}).join("");
Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})
})
}
function show(i){
killCharts();
var m=MODULES[i];
document.getElementById("th-ico").textContent=m.icon;
document.getElementById("th-title").textContent=m.name;
document.getElementById("th-sub").textContent=m.sub;
Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
var on=+b.getAttribute("data-i")===i;
b.classList.toggle("on",on);
if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
});
RENDER[i](document.getElementById("screen"))
}
function fromHash(){
var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
show(m?Math.min(+m[1],MODULES.length-1):0);
try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
