<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>長照個案守護所 · Long-Term Care</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#221a33;--accent:#7c3aed;--accent2:#a78bfa;--bg:#f5f2fb;--card:#fff;--line:#e9e2f5;--mut:#6b6382;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--soft:#f3eefc}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#3b1d6e,#5b2ca0);color:#ede7fb;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:0 0 20px rgba(167,139,250,.55)}
.side .lg .material-symbols-outlined{color:#fff;font-size:24px}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:#c4b5fd;letter-spacing:1.5px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#d8ccf7;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#c4b5fd}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side button .bg{margin-left:auto;font-size:11px;font-weight:800;background:#fca5a5;color:#7f1d1d;border-radius:999px;padding:1px 8px}
.side button.on .bg{background:rgba(255,255,255,.28);color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#c4b5fd;border-top:1px solid rgba(255,255,255,.12);line-height:1.7}
.main{padding:0}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.top p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--accent);background:var(--soft);border-radius:999px;padding:6px 12px}
.pill.warm{background:#fef3c7;color:#b45309}
.live{background:#ede9fe;color:#6d28d9;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#7c3aed;display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.body{padding:22px 26px 44px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px;color:var(--ok)}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.45}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g21{grid-template-columns:.85fr 1.35fr}
.two{grid-template-columns:1fr 1fr}
.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent)}
/* 個案卡 */
.casehd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cav{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;flex:none}
.casehd b{font-size:19px;font-family:"Noto Sans TC"}
.casehd small{color:var(--mut);font-size:12.5px;display:block}
.lvl{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.l7{background:#fee2e2;color:#b91c1c}.l4{background:#fef3c7;color:#b45309}.l2{background:#dcfce7;color:#15803d}
.chart{height:250px}
.chart.sm{height:210px}
.cases{display:flex;flex-direction:column;gap:9px}
.cml{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;cursor:default}
.cml:hover{background:var(--soft)}
.cml .av{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none}
.cml .info{flex:1;min-width:0}
.cml .info b{font-size:13.5px;font-family:"Noto Sans TC"}
.cml .info small{display:block;color:var(--mut);font-size:11.5px}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-run{background:#ede9fe;color:#6d28d9}.t-info{background:#dbeafe;color:#1d4ed8}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--soft)}
table.data tr:hover td{background:#faf7ff}
.scroll{overflow-x:auto}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 11px 11px 0;padding:10px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}.al.info{border-color:var(--accent);background:var(--soft)}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--accent)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
/* ADL 評估 */
.adl{display:flex;flex-direction:column;gap:8px}
.adl .row{display:flex;align-items:center;gap:10px}
.adl .row span.nm{font-size:12.5px;width:78px;flex:none;color:var(--ink);font-weight:600}
.adl .bar{flex:1;height:9px;background:#eee6fa;border-radius:6px;overflow:hidden}
.adl .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.adl .row b{font-size:12px;width:44px;text-align:right;flex:none}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 6px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.done::before{background:var(--ok)}.ti.now::before{background:var(--warn);animation:pulse 1.4s infinite}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:11.5px;color:#4a4160;margin-top:2px}
/* schedule grid */
.sched{display:grid;grid-template-columns:64px repeat(3,1fr);gap:6px}
.sched .hh{font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:6px 0}
.sched .tm{font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center}
.sched .cell{border:1px solid var(--line);border-radius:10px;min-height:52px;padding:6px;font-size:10.5px;background:#fff}
.sched .cell.b{background:var(--soft);border-color:#ddd0f5}
.sched .cell b{font-family:"Noto Sans TC";font-size:11px;display:block;color:var(--accent)}
.sched .cell small{color:var(--mut);font-size:10px}
.sched .cell.conf{background:#fef2f2;border-color:#fecaca}
.sched .cell.conf b{color:var(--bad)}
/* vitals */
.vt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.vt .v{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.vt .v b{display:block;font-size:22px;font-weight:900;font-family:Inter}
.vt .v span{font-size:11px;color:var(--mut)}
.vt .v em{font-size:10px;font-weight:800;font-style:normal;padding:1px 7px;border-radius:20px}
.med{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.med:first-child{border-top:0}
.med .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;background:#dcfce7;color:#15803d}
.med .ck.miss{background:#fee2e2;color:#b91c1c}
.med .mi{flex:1}.med .mi b{font-size:12.5px;font-family:"Noto Sans TC"}.med .mi small{display:block;color:var(--mut);font-size:11px}
/* 給付 */
.budget{display:flex;flex-direction:column;gap:12px}
.bt{border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.bt .h{display:flex;justify-content:space-between;font-size:12.5px;font-family:"Noto Sans TC";margin-bottom:8px}
.bt .h b{font-weight:800}
.bt .pb{height:10px;background:#eee6fa;border-radius:6px;overflow:hidden}
.bt .pb i{display:block;height:100%;border-radius:6px}
.bt small{font-size:11px;color:var(--mut);display:block;margin-top:6px}
.hamb{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side button .bg{display:none}.side .foot{display:none}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g21,.two{grid-template-columns:1fr}.vt{grid-template-columns:repeat(2,1fr)}.sched{grid-template-columns:52px repeat(3,1fr)}}
@media(max-width:480px){.top{padding:12px 14px}.body{padding:16px 13px 30px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg"><span class="material-symbols-outlined">diversity_1</span></div><div><b>長照個案守護所</b><span>LONG-TERM CARE</span></div></div>
    <div id="nav"></div>
    <div class="foot">收案個案 128 位<br/>今日到宅服務 34 · 待評估 5<br/>本月給付核銷 92%</div>

  <main class="main">
    <header class="top">
      <div><h2 id="vt">個案總覽</h2><p id="vd"></p></div>
      <div class="r"><span class="pill"><span class="material-symbols-outlined" style="font-size:16px">groups</span>收案 128 位</span><span class="pill warm">待評估 5</span><span class="live"><i></i>照護即時同步</span></div>

</div>
<script>
const MOD=[["個案總覽","dashboard","個案總覽","收案概況、失能分布與今日照護排程一覽",""],
["個案管理","diversity_1","個案管理 · 收案評估","個案基本資料、失能等級與 ADL/IADL 評估",""],
["照護計畫","assignment_ind","照護計畫","個別化照護目標、服務項目與 ADL 雷達評估",""],
["服務排程","event_available","服務排程 · 派工","居服/日照班表、照服員派工與衝突偵測","2"],

["給付申報","receipt_long","給付申報","長照給付額度、部分負擔與核銷申報","1"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0]+(m[4]?'<span class="bg">'+m[4]+'</span>':'');b.onclick=()=>show(i);nav.appendChild(b);});

const CASES=[["陳阿桃","女 · 82 歲","失能第7級 · 居家服務","l7","照護中","t-run","巴氏 38"],["林金水","男 · 76 歲","失能第4級 · 日間照顧","l4","照護中","t-run","巴氏 62"],["王秀英","女 · 88 歲","失能第7級 · 居家服務","l7","待回訪","t-warn","巴氏 32"],["張明德","男 · 71 歲","失能第2級 · 居家服務","l2","穩定","t-ok","巴氏 78"],["李春嬌","女 · 79 歲","失能第4級 · 居家+日照","l4","照護中","t-run","巴氏 58"],["黃清河","男 · 84 歲","失能第7級 · 居家服務","l7","待評估","t-warn","巴氏 40"]];
const KPI=[["收案個案","128","位","▲ 本月 +6"],["今日到宅服務","34","趟","6 位照服員"],["異常量測待處理","3","件","2 高 · 1 中"],["給付核銷率","92","%","▲ 較上月 +8%"]];
const ALERTS=[["陳阿桃 收縮壓 178 mmHg","高於警戒 160，已通知護理長並回報家屬","bad"],["黃清河 空腹血糖 62 mg/dL","低血糖預警，照服員已補充並記錄","bad"],["王秀英 服務逾期未回報","居服員 08/13 下午班未打卡，督導追蹤中","warn"],["李春嬌 照護計畫將屆期","計畫效期 08/31 到期，建議重新評估","info"]];

const ADLROWS=[["進食",65],["移位",40],["如廁",30],["洗澡",20],["平地行走",45],["穿脫衣",35]];
const CAREPLAN=[["生活自理支持","協助沐浴、如廁、更衣，維持基本清潔","每週 5 次","照服員 · 吳麗珠"],["安全看視","跌倒風險評估與居家環境改善","每日","督導 · 蔡文彬"],["營養照護","備餐協助與吞嚥評估、低鈉飲食","每週 5 次","營養師 · 周佩瑜"],["用藥提醒","三高慢性病用藥管理與提醒","每日","護理師 · 郭雅玲"],["社會參與","陪同散步、認知刺激活動","每週 3 次","照服員 · 吳麗珠"]];
const PLANTL=[["收案評估完成","08/01 · 照管專員","ADL 巴氏量表 38 分，判定失能第 7 級","done"],["擬定照護計畫","08/03 · 護理長","核定居家服務每月 36 小時，部分負擔 16%","done"],["家屬同意簽署","08/04 · 家屬 陳先生","確認服務項目與自付額，完成簽署","done"],["服務啟動","08/05 · 督導員","指派照服員吳麗珠，週一至週五到宅","now"],["月中複評","08/20 · 護理師","預定回訪評估 ADL 進展與計畫調整","",]];

const SCHED=[["08:00","日照專車 A","","陳阿桃 · 接送","",""],["09:00","居家服務","陳阿桃 · 沐浴協助 conf","林金水 · 日照活動","王秀英 · 生活支持"],["11:00","","王秀英 · 陪同就醫","","李春嬌 · 備餐"],["14:00","","黃清河 · 生活支持","張明德 · 陪同散步",""],["16:00","日照專車 A","","林金水 · 返家接送",""]];
const STAFF=[["吳麗珠","居服員","陳阿桃、李春嬌","6 趟","滿載","t-warn"],["蔡文彬","居服員","王秀英、黃清河","5 趟","正常","t-ok"],["周佩瑜","日照照服","林金水 等 8 位","日照班","正常","t-ok"],["郭雅玲","護理師","巡診 4 案","4 趟","正常","t-ok"],["張淑芬","居服員","張明德","3 趟","可加派","t-info"]];

const VITALS=[["血壓","138/86","mmHg","偏高","t-warn"],["血糖","112","mg/dL","正常","t-ok"],["體溫","36.4","°C","正常","t-ok"],["血氧","97","%","正常","t-ok"]];
const MEDS=[["Amlodipine 5mg","降血壓 · 早餐後","已服用",1],["Metformin 500mg","糖尿病 · 三餐後","已服用",1],["Aspirin 100mg","抗血栓 · 早餐後","已服用",1],["Atorvastatin 10mg","降血脂 · 睡前","未服用",0],["軟便劑","便秘 · 需要時","已服用",1]];

const BUDGET=[["照顧及專業服務","36,180","28,940",80,"每月核定額度 · 已用 80%","#7c3aed"],["交通接送","2,400","1,680",70,"日照往返接送","#a78bfa"],["輔具及居家無障礙","40,000","12,500",31,"年度額度 · 已申請扶手改善","#16a34a"],["喘息服務","32,340","9,700",30,"家庭照顧者喘息","#f59e0b"]];
const CLAIM=[["LTC-0812","陳阿桃","居家服務 20 趟","36,180","5,789","ok","已核銷"],["LTC-0813","林金水","日間照顧 22 日","28,600","4,290","wait","待審核"],["LTC-0814","王秀英","居家服務 18 趟","32,560","5,210","ok","已核銷"],["LTC-0815","黃清河","居家服務 16 趟","28,940","4,631","rej","退補 · 缺服務紀錄"],["LTC-0816","李春嬌","居家+日照 30 趟","41,200","6,592","wait","待審核"]];

const SCREENS=[
// 0 個案總覽
()=>`<div class="kpis">${KPI.map((k,i)=>`<div class="kpi"><span class="material-symbols-outlined ic">${['groups','directions_car','warning','verified'][i]}</span><div class="l">${k[0]}</div><div class="v">${k[1]}<small> ${k[2]}</small></div><div class="d">${k[3]}</div></div>`).join('')}</div>
<div class="grid g2">
  <div class="card"><h3><span class="material-symbols-outlined">groups</span>收案個案清單<span class="grow">共 128 位 ›</span></h3><div class="cases">${CASES.map(c=>`<div class="cml"><div class="av">${c[0].slice(0,1)}</div><div class="info"><b>${c[0]} <span class="lvl ${c[3]}">${c[2].split(' · ')[0]}</span></b><small>${c[1]} · ${c[2].split(' · ')[1]}</small></div><div style="text-align:right"><span class="tag ${c[5]}">${c[4]}</span><div style="font-size:11px;color:var(--mut);margin-top:3px">${c[6]}</div></div></div>`).join('')}</div></div>

// 3 服務排程 派工 (flow v3)
()=>`<div class="card"><h3><span class="material-symbols-outlined">event_available</span>今日服務排程 · 2026-08-13（三）<span class="tag t-bad" style="margin-left:auto">偵測到 1 筆時段衝突</span></h3>

${SCHED.map(r=>`<div class="tm">${r[0]}</div>${[r[2],r[3],r[4]].map(c=>{if(!c)return '<div class="cell"></div>';const conf=c.includes('conf');const cc=c.replace(' conf','');return `<div class="cell b${conf?' conf':''}"><b>${cc.split(' · ')[0]}</b><small>${cc.split(' · ')[1]||''}</small>${conf?'<small style="color:var(--bad);font-weight:800">⚠ 與日照接送重疊</small>':''}</div>`;}).join('')}`).join('')}

<div style="background:#fef2f2;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:12.5px;line-height:1.7;border-left:3px solid var(--bad)"><b style="color:var(--bad)">RULE-03 衝突：</b>吳麗珠 09:00 陳阿桃沐浴協助 與 日照接送重疊，且未保留交通緩衝。建議改派 <b>張淑芬（可加派）</b>。</div></div>`,

  <div style="background:var(--soft);border-radius:12px;padding:11px 13px;margin-top:12px;font-size:12px;color:var(--mut);line-height:1.6"><b style="color:var(--accent)">照服員回報：</b>個案精神尚可，午餐進食 8 成，Atorvastatin 睡前藥待家屬確認後補服。</div></div>

function draw(i){
  if(i==0){const c=echarts.init(document.getElementById('c_lvl'));c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11},itemWidth:11,itemHeight:11},series:[{type:'pie',radius:['46%','72%'],center:['50%','42%'],label:{fontSize:11,formatter:'{d}%'},data:[{value:38,name:'第7級 重度',itemStyle:{color:'#7c3aed'}},{value:52,name:'第4-6級 中度',itemStyle:{color:'#a78bfa'}},{value:38,name:'第2-3級 輕度',itemStyle:{color:'#c4b5fd'}}]}]});}
  if(i==2){const c=echarts.init(document.getElementById('c_radar'));c.setOption({tooltip:{},legend:{bottom:0,textStyle:{fontSize:11},data:['本次評估','照護目標']},radar:{center:['50%','46%'],radius:'62%',indicator:[{name:'進食',max:100},{name:'移位',max:100},{name:'如廁',max:100},{name:'洗澡',max:100},{name:'行走',max:100},{name:'穿脫衣',max:100}],axisName:{fontSize:11,color:'#6b6382'},splitLine:{lineStyle:{color:'#e9e2f5'}},splitArea:{areaStyle:{color:['#faf7ff','#fff']}}},series:[{type:'radar',data:[{value:[65,40,30,20,45,35],name:'本次評估',areaStyle:{color:'rgba(124,58,237,.22)'},lineStyle:{color:'#7c3aed',width:2},itemStyle:{color:'#7c3aed'}},{value:[70,55,45,35,55,50],name:'照護目標',lineStyle:{color:'#16a34a',type:'dashed',width:2},itemStyle:{color:'#16a34a'},areaStyle:{color:'rgba(22,163,74,.06)'}}]}]});}
  if(i==4){const bp=echarts.init(document.getElementById('c_bp'));bp.setOption({grid:{left:38,right:12,top:22,bottom:24},tooltip:{trigger:'axis'},legend:{data:['收縮壓','舒張壓'],textStyle:{fontSize:10},top:0,itemWidth:12,itemHeight:8},xAxis:{type:'category',data:['8/7','8/8','8/9','8/10','8/11','8/12','8/13'],axisLabel:{fontSize:10}},yAxis:{type:'value',min:60,max:190,axisLabel:{fontSize:10}},series:[{name:'收縮壓',type:'line',smooth:true,data:[142,150,138,165,155,178,138],lineStyle:{color:'#7c3aed',width:2.5},itemStyle:{color:'#7c3aed'},markLine:{silent:true,data:[{yAxis:160,label:{formatter:'警戒',fontSize:9}}],lineStyle:{color:'#ef4444',type:'dashed'}}},{name:'舒張壓',type:'line',smooth:true,data:[84,88,82,92,90,96,86],lineStyle:{color:'#a78bfa',width:2},itemStyle:{color:'#a78bfa'}}]});
  const gl=echarts.init(document.getElementById('c_glu'));gl.setOption({grid:{left:38,right:12,top:18,bottom:24},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['8/7','8/8','8/9','8/10','8/11','8/12','8/13'],axisLabel:{fontSize:10}},yAxis:{type:'value',min:50,max:180,axisLabel:{fontSize:10}},series:[{type:'line',smooth:true,data:[110,125,98,140,62,118,112],areaStyle:{color:'rgba(124,58,237,.12)'},lineStyle:{color:'#7c3aed',width:2.5},itemStyle:{color:'#7c3aed'},markLine:{silent:true,data:[{yAxis:70,label:{formatter:'低血糖',fontSize:9}}],lineStyle:{color:'#f59e0b',type:'dashed'}}}]});}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
