:root{

  --color-secondary:#22D3EE;--color-on-secondary:#0F172A;

*{box-sizing:border-box}

body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Atkinson Hyperlegible","Noto Sans TC",system-ui,sans-serif;line-height:1.5}

.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:7px;background:#DDF8FA;border-right:1px solid rgba(8,145,178,.15);box-shadow:8px 0 24px rgba(8,145,178,.08);z-index:20}

.side button{width:100%;min-height:46px;padding:11px 13px;display:flex;align-items:center;gap:11px;border:1px solid transparent;border-radius:14px;background:transparent;color:#315966;font:700 14px/1.2 "Atkinson Hyperlegible","Noto Sans TC",sans-serif;text-align:left;transition:background .2s,color .2s,box-shadow .2s,transform .15s}

.body{padding:24px 28px 48px}

.al{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border:1px solid #ECD591;border-left:4px solid #B47B00;border-radius:12px;background:#FFF9E8}

.adl .row{display:flex;align-items:center;gap:10px}
.adl .nm{width:78px;flex:none;color:#244F5B;font-size:12.5px;font-weight:700}
.adl .bar,.bt .pb{flex:1;overflow:hidden;border-radius:999px;background:#E1EFF2;box-shadow:var(--inset)}
.adl .bar{height:10px}.adl .bar i,.bt .pb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0891B2,#22D3EE)}
.adl .row b{width:46px;flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:24px}.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#A8DEE4}
.ti{position:relative;padding:0 0 16px 7px}.ti::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:#0891B2;box-shadow:0 0 0 2px #75D5DF}

.sched{display:grid;grid-template-columns:64px repeat(3,1fr);gap:7px}
.sched .hh,.sched .tm{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-weight:700}
.sched .hh{padding:7px 0}
.sched .cell{min-height:56px;padding:7px;border:1px solid #C8E9EC;border-radius:11px;background:#FBFFFF}
.sched .cell.b{background:#EAF9FA;box-shadow:var(--inset)}
.sched .cell b{display:block;color:#075E72;font-size:11px}.sched .cell small{display:block;color:var(--muted);font-size:10px}
.sched .cell.conf{border-color:#E9A7A7;background:#FFF0F0}.sched .cell.conf b{color:#991B1B}
.vt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px}
.vt .v{padding:14px 8px;text-align:center;border:1px solid #C7EDF0;border-radius:14px;background:#EDF9FA;box-shadow:var(--inset)}
.vt .v b{display:block;color:#083D4C;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}.vt .v span{color:var(--muted);font-size:11px}.vt .v em{font-style:normal}
.med{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #D7EFF1}.med:first-of-type{border-top:0}

.bt{padding:14px;border:1px solid #C7EDF0;border-radius:14px;background:#FBFFFF}
.bt .h{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:12.5px}.bt .h b{font-variant-numeric:tabular-nums}.bt .pb{height:10px}.bt small{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.note{margin-top:14px;padding:12px 14px;border:1px solid #BEE8EC;border-radius:13px;background:#EDF9FA;color:#315966;font-size:12.5px;line-height:1.7;box-shadow:var(--inset)}
.note.bad{border-color:#F0B9B9;border-left:4px solid var(--bad);background:#FFF2F2}.note b:first-child{color:#06758C}.note.bad b:first-child{color:#991B1B}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.action{border-color:#69D6DE;background:linear-gradient(145deg,#E9FFFF,#AEEFF2);color:#064E5D;transition:transform .15s,box-shadow .15s}
.action:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.action:active{transform:translateY(1px);box-shadow:var(--inset)}
.grid-item{animation:reveal .4s cubic-bezier(.2,.75,.3,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1000px){.shell{grid-template-columns:220px minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}}
@media(max-width:768px){.shell{display:block}.side{position:static;height:auto;padding:14px}.bd{padding-bottom:10px}#nav{display:grid;grid-template-columns:repeat(3,1fr)}.side button{justify-content:center;padding:10px 8px;font-size:12px}.side button .bg,.foot{display:none}.top{padding:14px 16px}.top .r{width:100%;margin-left:0}.body{padding:18px 15px 36px}.vt{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){#nav{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:1fr}.card{padding:16px}.top h2{font-size:19px}.top .r .pill:last-of-type{display:none}.casehd{align-items:flex-start}.cav{width:52px;height:52px}.sched{grid-template-columns:52px repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
