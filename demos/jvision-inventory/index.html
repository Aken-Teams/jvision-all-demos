<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>商品庫存管理 · WMS 倉儲管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --accent-soft:#fce7f3;
  --bg:#f6f5f8; --panel:#ffffff; --ink:#1f1526; --muted:#7a6f83;
  --line:#ece7f0; --sidebar:#2a1522; --sidebar2:#3a1c2f;
  --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#6366f1;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
/* ---- Sidebar ---- */
.sidebar{
  width:248px;flex:none;min-width:0;
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#f5e6ef;display:flex;flex-direction:column;
  padding:22px 16px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;min-width:0;}
.brand-logo{
  width:42px;height:42px;flex:none;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 18px rgba(219,39,119,.4);
}
.brand-logo .material-symbols-outlined{font-size:24px;}
.brand-txt b{display:block;font-family:"Noto Sans TC";font-weight:900;font-size:16px;letter-spacing:.5px;}
.brand-txt span{font-size:11px;color:#c8a5ba;letter-spacing:1px;}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:6px;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:12px;min-width:0;
  background:transparent;border:none;color:#d6bccb;cursor:pointer;
  padding:11px 12px;border-radius:11px;font-family:"Noto Sans TC";
  font-size:14px;font-weight:500;text-align:left;transition:.15s;white-space:nowrap;flex:none;
}
.nav button .material-symbols-outlined{font-size:21px;flex:none;}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav button.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.35);
}
.nav .idx{margin-left:auto;font-size:11px;opacity:.6;font-weight:700;}
.side-foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#a98aa0;line-height:1.6;}
.side-foot b{color:#f2d7e6;}
/* ---- Main ---- */
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.topbar h1{font-family:"Noto Sans TC";font-size:22px;font-weight:900;margin:0;display:flex;align-items:center;gap:10px;}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--muted);}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
/* grids */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.grid > *{min-width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.card-h h3{margin:0;font-family:"Noto Sans TC";font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;}
.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card-h .hint{font-size:11.5px;color:var(--muted);}
/* KPI */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;min-width:0;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);opacity:.7;}
.kpi .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);position:relative;z-index:1;}
.kpi .ico .material-symbols-outlined{font-size:21px;}
.kpi .lbl{font-size:12px;color:var(--muted);margin-top:12px;font-weight:500;}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px;font-family:"Inter";}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;}
.delta.up{color:var(--ok);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted);}
.delta .material-symbols-outlined{font-size:15px;}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:11px 14px;border-bottom:1px solid var(--line);background:#faf8fb;letter-spacing:.3px;white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fdf5f9;}
.mono{font-family:"Inter";font-weight:600;letter-spacing:.3px;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#ffe4e6;color:#be123c;} .t-info{background:#e0e7ff;color:#4338ca;}
.t-gray{background:#eef0f2;color:#64748b;} .t-pink{background:var(--accent-soft);color:var(--accent);}
.bar{height:7px;border-radius:6px;background:#eee7ec;overflow:hidden;min-width:60px;}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.prog{display:flex;align-items:center;gap:8px;min-width:0;}
.prog small{font-size:11px;color:var(--muted);font-weight:600;width:34px;flex:none;text-align:right;}
/* Screen 0 receiving lane */
.lane{display:flex;flex-direction:column;gap:12px;}
.lane-row{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;min-width:0;}
.lane-row .num{width:32px;height:32px;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.lane-row .body{flex:1;min-width:0;}
.lane-row .body b{font-size:13.5px;font-family:"Noto Sans TC";}
.lane-row .body p{margin:2px 0 0;font-size:11.5px;color:var(--muted);}
.steps{display:flex;align-items:center;gap:0;flex:none;}
.steps .s{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#cbb;background:#fff;position:relative;z-index:1;}
.steps .ln{width:22px;height:2px;background:var(--line);}
.steps .s.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.steps .s.cur{border-color:var(--accent);color:var(--accent);animation:pulse 1.6s infinite;}
.steps .ln.done{background:var(--accent);}
/* Screen 1 shelf grid */
.shelf-wrap{overflow-x:auto;}
.shelf{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;min-width:520px;}
.cell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;position:relative;}
.cell.empty{background:#eef0f2;color:#b9b0c0;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:14px;align-items:center;}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
.aisle-lbl{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;min-width:520px;margin-bottom:6px;}
.aisle-lbl span{text-align:center;font-size:10px;color:var(--muted);font-weight:600;}
/* Screen 3 kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.board > *{min-width:0;}
.col{background:#faf8fb;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;font-family:"Noto Sans TC";padding:2px 4px 6px;}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--muted);}
.pcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;border-left:3px solid var(--accent);}
.pcard b{font-size:12.5px;font-family:"Inter";}
.pcard .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink);}
.mini-av{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none;}
/* Screen 4 replenish */
.rep-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px dashed var(--line);min-width:0;}
.rep-row:last-child{border-bottom:none;}
.rep-row .sku{flex:1;min-width:0;}
.rep-row .sku b{font-size:13px;font-family:"Noto Sans TC";display:block;}
.rep-row .sku span{font-size:11px;color:var(--muted);}
.gauge{width:90px;flex:none;}
.gauge .track{height:8px;border-radius:6px;background:#eee7ec;position:relative;overflow:hidden;}
.gauge .track i{display:block;height:100%;border-radius:6px;}
.gauge .lv{position:absolute;top:-1px;width:2px;height:10px;background:var(--ink);}
.gauge small{font-size:10px;color:var(--muted);display:block;margin-top:3px;text-align:right;}
/* Screen 5 timeline */
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl-dot.warn{border-color:var(--warn);} .tl-dot.bad{border-color:var(--bad);} .tl-dot.ok{border-color:var(--ok);}
.tl-time{font-size:11px;color:var(--muted);font-weight:600;}
.tl-item b{font-size:13px;font-family:"Noto Sans TC";display:block;margin:2px 0;}
.tl-item p{margin:0;font-size:11.5px;color:var(--muted);}
/* responsive */
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:6px;}
  .brand{padding:0 12px 0 4px;}
  .side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0;flex:1;}
  .nav button{padding:9px 12px;}
  .nav .idx{display:none;}
  .main{padding:20px 18px 50px;}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .g4{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .nav button .txt{display:none;}
  .nav button{padding:9px 11px;}
  .topbar h1{font-size:19px;}
}
@media(max-width:400px){
  .g4{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">warehouse</span></div>
      <div class="brand-txt"><b>庫存倉儲</b><span>WMS INVENTORY</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      倉別：<b>桃園中央倉 · DC-01</b><br/>
      班次：<b>日班 08:00–17:00</b><br/>
      版本 <b>v3.4.2</b> · 純 UI 展示
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico">move_to_inbox</span><span id="th-title">收貨入庫</span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span> 系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span> 2026/08/13</span>
        <div class="avatar">倉</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ============ DATA ============ */
var MODULES=[
  {icon:"move_to_inbox",name:"收貨入庫",sub:"收貨驗收、ASN 對單與智慧上架建議"},
  {icon:"shelves",name:"儲位庫容",sub:"貨架儲位視覺化、庫容熱度與動線規劃"},
  {icon:"inventory",name:"即時庫存",sub:"SKU 存量、批號效期與呆滯庫存分析"},
  {icon:"outbox",name:"波次揀貨",sub:"訂單波次、揀貨路徑與出貨覆核進度"},
  {icon:"autorenew",name:"安全補貨",sub:"安全庫存門檻、補貨建議與缺貨預警"},
  {icon:"fact_check",name:"盤點稽核",sub:"循環盤點、差異調整與作業稽核軌跡"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function money(n){try{return Number(n).toLocaleString("en-US");}catch(e){return String(n);}}

/* ============ RENDER HELPERS ============ */
function kpiGrid(arr){
  var h=arr.map(function(k){
    var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
    return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
      '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
      '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>';
  }).join("");
  return '<div class="grid g4">'+h+'</div>';
}
function tbl(heads,rows){
  var h=heads.map(function(x){return '<th>'+esc(x)+'</th>';}).join("");
  var b=rows.map(function(r){
    return '<tr>'+r.map(function(cell,i){
      return '<td'+(i===0?' class="mono"':'')+'>'+cell+'</td>';
    }).join("")+'</tr>';
  }).join("");
  return '<div style="overflow-x:auto"><table><thead><tr>'+h+'</tr></thead><tbody>'+b+'</tbody></table></div>';
}

/* ============ CHART HELPERS ============ */
function push(el,opt){var node=document.getElementById(el)||document.querySelector(el);if(!node)return;var ch=new ApexCharts(node,opt);ch.render();charts.push(ch);}
var AX={style:{colors:"#8a8092",fontSize:"11px"}};
function mkArea(el,data,cats,name,fmtK){
  push(el,{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:240,fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:name,data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:AX.style,formatter:fmtK?function(v){return (v/1000).toFixed(0)+"k";}:undefined}},
    grid:{borderColor:"#f0ecf2",strokeDashArray:4},dataLabels:{enabled:false},
    stroke:{curve:"smooth",width:3},colors:["#db2777"],
    fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.4,opacityTo:.05,stops:[0,90]}},
    tooltip:{theme:"light"}
  });
}
function mkBar(el,cats,data,name,horiz,color){
  push(el,{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:240,fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:name||"數值",data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:{colors:"#8a8092",fontSize:horiz?"12px":"11px"}}},
    grid:{borderColor:"#f0ecf2",strokeDashArray:4},dataLabels:{enabled:false},
    plotOptions:{bar:{borderRadius:5,horizontal:!!horiz,columnWidth:"55%",barHeight:"58%"}},
    colors:[color||"#db2777"],tooltip:{theme:"light"}
  });
}
function mkDonut(el,labels,data){
  push(el,{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:250,fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:data,labels:labels,
    colors:["#db2777","#f472b6","#f9a8d4","#c026d3","#fbcfe8"],
    legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:false},
    plotOptions:{pie:{donut:{size:"62%"}}},stroke:{width:2},tooltip:{theme:"light"}
  });
}
function mkRadial(el,labels,data,total){
  push(el,{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radialBar",height:280,fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:data,labels:labels,
    colors:["#db2777","#f472b6","#c026d3","#f9a8d4"],
    plotOptions:{radialBar:{hollow:{size:"30%"},dataLabels:{name:{fontSize:"12px"},value:{fontSize:"14px",fontWeight:700},total:{show:true,label:"平均",formatter:function(){return total;}}}}},
    legend:{show:true,position:"bottom",fontSize:"12px"}
  });
}
function mkRadar(el,cats,data){
  push(el,{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radar",height:280,fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:"健康度",data:data}],
    xaxis:{categories:cats,labels:{style:{colors:["#8a8092","#8a8092","#8a8092","#8a8092","#8a8092","#8a8092"],fontSize:"11px"}}},
    yaxis:{show:false,max:100,min:0},
    stroke:{width:2},colors:["#db2777"],
    fill:{opacity:.25},markers:{size:3,colors:["#db2777"]},
    dataLabels:{enabled:false},tooltip:{theme:"light"}
  });
}

/* ============ SCREEN 0 : 收貨入庫 ============ */
function v0(c){
  var kpis=[
    {ico:"local_shipping",lbl:"今日進貨單",val:"18",u:"單",d:"+3",cls:"up"},
    {ico:"inventory_2",lbl:"待驗收品項",val:"426",u:"件",d:"進行中",cls:"flat"},
    {ico:"task_alt",lbl:"上架完成率",val:"73",u:"%",d:"+8%",cls:"up"},
    {ico:"error",lbl:"驗收異常",val:"5",u:"件",d:"待處理",cls:"down"}

  mkArea("c5b",[97.8,98.1,98.4,98.6,98.9,99.2],["3月","4月","5月","6月","7月","8月"],"準確率 %");
}

/* ============ NAV / SHOW ============ */
var RENDER=[v0,v1,v2,v3,v4,v5];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODULES.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});
  });
}
function show(i){
  killCharts();
  var m=MODULES[i];
  document.getElementById("th-ico").textContent=m.icon;
  document.getElementById("th-title").textContent=m.name;
  document.getElementById("th-sub").textContent=m.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.classList.toggle("on",+b.getAttribute("data-i")===i);
  });
  var c=document.getElementById("screen");
  RENDER[i](c);
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
