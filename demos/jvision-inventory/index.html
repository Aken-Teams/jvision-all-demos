<style>

  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;

  --accent:#EA580C;

  --bg:#ECFDF5;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 92% 4%,rgba(234,88,12,.16) 0 7.5%,transparent 7.7%),
    linear-gradient(135deg,rgba(16,185,129,.09) 25%,transparent 25%) 0 0/38px 38px,
    var(--color-background);
  font-family:"Nunito Sans","Noto Sans TC",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;top:0;z-index:10;
  width:272px;height:100vh;flex:none;min-width:0;
  display:flex;flex-direction:column;
  padding:24px 18px;
  color:#ECFDF5;
  background:
    linear-gradient(145deg,rgba(255,255,255,.09) 0 16%,transparent 16.2%),
    linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  border-right:5px solid var(--color-secondary);
  box-shadow:14px 0 36px rgba(6,78,59,.16);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:4px 7px 25px}
.brand-logo{
  width:48px;height:48px;flex:none;
  display:grid;place-items:center;
  color:#022C22;
  background:linear-gradient(135deg,#6EE7B7 0 58%,#FDBA74 58%);
  border:2px solid rgba(255,255,255,.7);
  border-radius:15px 15px 5px 15px;
  box-shadow:5px 5px 0 rgba(0,0,0,.25);
}
.brand-logo .material-symbols-outlined{font-size:26px}
.brand-txt b{display:block;font-family:"Rubik","Noto Sans TC",sans-serif;font-size:18px;font-weight:700;letter-spacing:.035em}
.brand-txt span{display:block;margin-top:2px;color:#A7F3D0;font-family:"Rubik",sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em}
.nav{display:flex;flex-direction:column;gap:8px;min-width:0;margin-top:4px}
.nav button{
  min-width:0;min-height:48px;flex:none;
  display:flex;align-items:center;gap:12px;
  padding:11px 13px;
  color:#D1FAE5;background:transparent;
  border:1px solid transparent;border-radius:13px;
  font-size:14px;font-weight:800;text-align:left;white-space:nowrap;
  transition:background-color .22s ease,color .22s ease,transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav button:hover{color:#FFF;background:rgba(255,255,255,.1);border-color:rgba(167,243,208,.45);transform:translateX(4px)}
.nav button.on{color:#022C22;background:#6EE7B7;border-color:#A7F3D0;box-shadow:5px 5px 0 #001C15}
.nav .idx{margin-left:auto;font-family:"Rubik",monospace;font-size:11px;font-weight:700;opacity:.78}
.side-foot{margin-top:auto;padding:17px 10px 2px;color:#A7F3D0;border-top:1px solid rgba(167,243,208,.28);font-size:11px;line-height:1.8}
.side-foot b{color:#FFF;font-family:"Rubik","Noto Sans TC",sans-serif}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,44px) 64px}

  position:sticky;top:0;z-index:8;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin:-30px calc(clamp(18px,3vw,44px) * -1) 28px;
  padding:24px clamp(18px,3vw,44px) 18px;

.topbar h1{display:flex;align-items:center;gap:12px;margin:0;color:var(--ink);font-family:"Rubik","Noto Sans TC",sans-serif;font-size:clamp(25px,2.5vw,35px);font-weight:700;letter-spacing:-.03em}

.topbar .sub{margin:7px 0 0 56px;color:var(--muted);font-size:13px;font-weight:700}

.chip .dot{width:9px;height:9px;border-radius:3px;background:var(--ok);box-shadow:0 0 0 3px rgba(4,120,87,.15);animation:pulse 2s ease-in-out infinite}

.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g32{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.grid>*{min-width:0}
.card,.kpi{min-width:0;color:var(--color-card-foreground);background:var(--color-card);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.card{padding:20px;border-radius:var(--radius) var(--radius) 7px var(--radius);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.card:hover{border-color:#34D399;box-shadow:var(--shadow-md);transform:translateY(-3px)}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card-h h3{min-width:0;display:flex;align-items:center;gap:9px;margin:0;color:#064E3B;font-family:"Rubik","Noto Sans TC",sans-serif;font-size:15px;font-weight:700}
.card-h h3 .material-symbols-outlined{width:31px;height:31px;display:grid;place-items:center;color:#047857;background:#D1FAE5;border-radius:9px 9px 3px 9px;font-size:18px}
.card-h .hint{color:var(--muted);font-size:11.5px;font-weight:700}
.kpi{position:relative;isolation:isolate;overflow:hidden;padding:18px 19px;border-top:5px solid var(--color-primary);border-radius:17px 17px 6px 17px;transition:transform .22s ease,box-shadow .22s ease}
.kpi:nth-child(2){border-top-color:#0284C7}.kpi:nth-child(3){border-top-color:#10B981}.kpi:nth-child(4){border-top-color:#EA580C}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.kpi::after{content:"";position:absolute;z-index:-1;right:-27px;top:-31px;width:104px;height:104px;background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(234,88,12,.09));border-radius:29px;transform:rotate(18deg)}
.kpi .ico{width:41px;height:41px;display:grid;place-items:center;color:#065F46;background:#D1FAE5;border:1px solid #6EE7B7;border-radius:12px 12px 4px 12px}
.kpi:nth-child(2) .ico{color:#075985;background:#E0F2FE;border-color:#7DD3FC}.kpi:nth-child(4) .ico{color:#9A3412;background:#FFEDD5;border-color:#FDBA74}
.kpi .ico .material-symbols-outlined{font-size:22px}.kpi .lbl{margin-top:13px;color:var(--muted);font-size:12px;font-weight:800}
.kpi .val{margin-top:2px;color:#064E3B;font-family:"Rubik",sans-serif;font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.kpi .val small{margin-left:4px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:0}.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:11.5px;font-weight:800}.delta.up{color:#047857}.delta.down{color:#B91C1C}.delta.flat{color:#475569}.delta .material-symbols-outlined{font-size:15px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
th{padding:12px 14px;color:#334155;background:#E8F1F3;border-bottom:2px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.035em;text-align:left;white-space:nowrap}
td{padding:12px 14px;color:#164E3E;background:#FFF;border-bottom:1px solid #D1FAE5;white-space:nowrap}tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:#F0FDF4}th:nth-child(n+3),td:nth-child(n+3){text-align:right}td .tag,td .prog{text-align:left}
.mono{font-family:"Rubik","SFMono-Regular",Consolas,monospace;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:25px;padding:4px 9px;border:1px solid currentColor;border-radius:8px 8px 3px 8px;font-size:11px;font-weight:800;line-height:1;white-space:nowrap}.tag::before{content:"";width:7px;height:7px;flex:none;background:currentColor;border-radius:2px}.t-ok{color:#047857;background:#ECFDF5}.t-warn{color:#9A3412;background:#FFF7ED}.t-bad{color:#B91C1C;background:#FEF2F2}.t-info{color:#0369A1;background:#F0F9FF}.t-gray{color:#475569;background:#F1F5F9}.t-pink{color:#047857;background:#D1FAE5}
.bar{height:9px;min-width:60px;overflow:hidden;background:#DBE7E3;border-radius:3px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),#34D399);border-radius:3px}.prog{display:flex;align-items:center;gap:8px;min-width:0}.prog small{width:38px;flex:none;color:var(--muted);font-family:"Rubik",monospace;font-size:11px;font-weight:700;text-align:right}
.lane{display:flex;flex-direction:column;gap:11px}.lane-row{min-width:0;display:flex;align-items:center;gap:14px;padding:13px 15px;background:#F8FFFB;border:1px solid var(--line);border-left:5px solid var(--color-primary);border-radius:13px 13px 5px 13px;transition:background-color .2s ease,transform .2s ease,border-color .2s ease}.lane-row:hover{background:#ECFDF5;border-color:#34D399;transform:translateX(3px)}
.lane-row .num{width:35px;height:35px;flex:none;display:grid;place-items:center;color:#FFF;background:#047857;border-radius:10px 10px 3px 10px;font-family:"Rubik",monospace;font-size:12px;font-weight:700}.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13.5px;font-weight:800}.lane-row .body p{margin:3px 0 0;color:var(--muted);font-size:11.5px}.steps{display:flex;align-items:center;flex:none}.steps .s{position:relative;z-index:1;width:24px;height:24px;display:grid;place-items:center;color:#475569;background:#FFF;border:2px solid #94A3B8;border-radius:7px;font-family:"Rubik",monospace;font-size:11px}.steps .ln{width:20px;height:3px;background:#CBD5E1}.steps .s.done{color:#FFF;background:#047857;border-color:#047857}.steps .s.cur{color:#9A3412;background:#FFF7ED;border-color:#EA580C;animation:pulse 1.6s ease-in-out infinite}.steps .ln.done{background:#047857}
.shelf-wrap{overflow-x:auto;padding:4px 2px 6px}.shelf{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;min-width:520px}.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;color:#FFF;border:1px solid rgba(6,78,59,.2);border-radius:8px 8px 3px 8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);font-family:"Rubik",monospace;font-size:10px;font-weight:700}.cell.empty{color:#475569;background:#E2E8F0;box-shadow:none}.legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:11.5px;font-weight:700}.legend i{width:13px;height:13px;display:inline-block;margin-right:5px;border:1px solid rgba(6,78,59,.25);border-radius:3px;vertical-align:-2px}.aisle-lbl{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;min-width:520px;margin-bottom:7px}.aisle-lbl span{color:var(--muted);font-family:"Rubik",monospace;font-size:10px;font-weight:700;text-align:center}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px;min-width:820px}.board>*{min-width:0}.col{display:flex;flex-direction:column;gap:10px;padding:12px;background:#ECFDF5;border:1px solid var(--line);border-top:5px solid var(--color-primary);border-radius:15px 15px 5px 15px}.col:nth-child(2){border-top-color:#0284C7}.col:nth-child(3){border-top-color:#D97706}.col:nth-child(4){border-top-color:#EA580C}.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;font-family:"Rubik","Noto Sans TC",sans-serif;font-size:12.5px;font-weight:700}.col-h .cnt{padding:2px 9px;color:#334155;background:#FFF;border:1px solid var(--line);border-radius:7px;font-family:"Rubik",monospace;font-size:11px}
.pcard{padding:12px;background:#FFF;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:11px 11px 4px 11px;box-shadow:0 3px 10px rgba(6,78,59,.07);transition:transform .2s ease,box-shadow .2s ease}.pcard:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(6,78,59,.14)}.pcard b{font-family:"Rubik",monospace;font-size:12.5px;font-variant-numeric:tabular-nums}.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:11px}.pcard .who{display:inline-flex;align-items:center;gap:6px;margin-top:9px;color:var(--ink);font-size:11px;font-weight:800}.mini-av{width:20px;height:20px;flex:none;display:grid;place-items:center;color:#FFF;background:#047857;border-radius:6px;font-size:9px;font-weight:800}
.rep-row{min-width:0;display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px dashed #6EE7B7}.rep-row:last-child{border-bottom:none}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:13px;font-weight:800}.rep-row .sku span{color:var(--muted);font-family:"Rubik",monospace;font-size:11px;font-variant-numeric:tabular-nums}.gauge{width:96px;flex:none}.gauge .track{position:relative;overflow:hidden;height:9px;background:#DBE7E3;border-radius:3px}.gauge .track i{display:block;height:100%;border-radius:3px}.gauge .lv{position:absolute;top:-2px;width:3px;height:13px;background:#0F172A}.gauge small{display:block;margin-top:4px;color:var(--muted);font-family:"Rubik",monospace;font-size:10px;text-align:right}
.tl{position:relative;padding-left:29px}.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:3px;background:#A7F3D0}.tl-item{position:relative;padding:0 0 19px}.tl-item:last-child{padding-bottom:0}.tl-dot{position:absolute;left:-27px;top:2px;width:15px;height:15px;background:#FFF;border:4px solid var(--color-primary);border-radius:4px}.tl-dot.warn{border-color:#C2410C}.tl-dot.bad{border-color:#DC2626}.tl-dot.ok{border-color:#047857}.tl-time{color:var(--muted);font-family:"Rubik",monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}.tl-item b{display:block;margin:2px 0;font-size:13px;font-weight:800}.tl-item p{margin:0;color:var(--muted);font-size:11.5px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Nunito Sans","Noto Sans TC",sans-serif!important;fill:#475569!important;color:#475569!important}.apexcharts-gridline{stroke:#D1FAE5!important}.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:11px!important;box-shadow:var(--shadow-md)!important}.apexcharts-tooltip-title{background:#ECFDF5!important;border-bottom:1px solid var(--line)!important}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">warehouse</span></div>
      <div class="brand-txt"><b>庫存倉儲</b><span>WMS INVENTORY</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      倉別：<b>桃園中央倉 · DC-01</b><br/>
      班次：<b>日班 08:00–17:00</b><br/>
      版本 <b>v3.4.2</b> · 純 UI 展示
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico">move_to_inbox</span><span id="th-title">收貨入庫</span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span> 系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span> 2026/08/13</span>
        <div class="avatar">倉</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ============ DATA ============ */
var MODULES=[
  {icon:"move_to_inbox",name:"收貨入庫",sub:"收貨驗收、ASN 對單與智慧上架建議"},

/* ============ RENDER HELPERS ============ */
function kpiGrid(arr){
  var h=arr.map(function(k){
    var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
    return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
      '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
      '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>';
  }).join("");
  return '<div class="grid g4">'+h+'</div>';
}
function tbl(heads,rows){
  var h=heads.map(function(x){return '<th>'+esc(x)+'</th>';}).join("");
  var b=rows.map(function(r){
    return '<tr>'+r.map(function(cell,i){
      return '<td'+(i===0?' class="mono"':'')+'>'+cell+'</td>';
    }).join("")+'</tr>';
  }).join("");
  return '<div style="overflow-x:auto"><table><thead><tr>'+h+'</tr></thead><tbody>'+b+'</tbody></table></div>';
}

/* ============ CHART HELPERS ============ */

var AX={style:{colors:"#8a8092",fontSize:"11px"}};

  push(el,{

    yaxis:{labels:{style:AX.style,formatter:fmtK?function(v){return (v/1000).toFixed(0)+"k";}:undefined}},
    grid:{borderColor:"#f0ecf2",strokeDashArray:4},dataLabels:{enabled:false},

/* ============ NAV / SHOW ============ */
var RENDER=[v0,v1,v2,v3,v4,v5];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODULES.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});
  });
}
function show(i){
  killCharts();
  var m=MODULES[i];
  document.getElementById("th-ico").textContent=m.icon;
  document.getElementById("th-title").textContent=m.name;
  document.getElementById("th-sub").textContent=m.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.classList.toggle("on",+b.getAttribute("data-i")===i);
  });
  var c=document.getElementById("screen");
  RENDER[i](c);
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
