<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>太陽能案場維運艙｜Jvision 系統 Demo</title>
  <meta name="description" content="追蹤太陽能案場發電、巡檢、維修與售電收益的維運管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#059669;
      --color-on-primary:#000000;
      --color-secondary:#10b981;
      --color-on-secondary:#0f172a;
      --color-accent:#059669;
      --color-on-accent:#000000;
      --color-background:#ecfdf5;
      --color-foreground:#064e3b;
      --color-card:#ffffff;
      --color-card-foreground:#064e3b;
      --color-muted:#e8f1f3;
      --color-muted-foreground:#475569;
      --color-border:#a7f3d0;
      --color-destructive:#dc2626;
      --color-on-destructive:#ffffff;
      --color-ring:#059669;
      --blue:#059669;
      --ink:#064e3b;
      --muted:#475569;
      --line:#a7f3d0;
      --bg:#ecfdf5;
      --card:#ffffff;
      --ok:#047857;
      --warn:#a16207;
      --bad:#dc2626;
      --info:#0369a1;
      --shadow:0 10px 28px rgba(6,78,59,.07);
      --shadow-hover:0 16px 36px rgba(6,78,59,.12);
      --radius:12px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;min-height:100%}
    body{
      background:
        linear-gradient(rgba(5,150,105,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(5,150,105,.035) 1px,transparent 1px),
        var(--color-background);
      background-size:32px 32px;
      color:var(--ink);
      font-family:"Fira Sans",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,a,[role="button"]{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .icon{
      width:20px;
      height:20px;
      flex:none;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
    .side{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      flex-direction:column;
      height:100vh;
      padding:18px 14px;
      overflow-y:auto;
      color:#d1fae5;
      background:#064e3b;
      border-right:1px solid #047857;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      min-height:62px;
      padding:4px 8px 17px;
      margin-bottom:12px;
      border-bottom:1px solid rgba(236,253,245,.18);
    }
    .logo{
      display:grid;
      place-items:center;
      width:40px;
      height:40px;
      flex:none;
      color:#052e16;
      background:#fbbf24;
      border:1px solid #fde68a;
      border-radius:9px;
      box-shadow:4px 4px 0 #022c22;
    }
    .brand b{display:block;color:#fff;font-size:15px;letter-spacing:.02em}
    .brand span{display:block;margin-top:2px;color:#a7f3d0;font:10px/1.4 "Fira Code",monospace;letter-spacing:.06em}
    #nav{display:grid;gap:5px}
    .navbtn{
      position:relative;
      display:grid;
      grid-template-columns:24px minmax(0,1fr);
      align-items:center;
      gap:10px;
      width:100%;
      min-height:52px;
      padding:9px 11px;
      color:#d1fae5;
      text-align:left;
      background:transparent;
      border:1px solid transparent;
      border-radius:9px;
      transition:background-color .22s,border-color .22s,color .22s,transform .22s;
    }
    .navbtn:hover{color:#fff;background:#065f46;border-color:#10b981;transform:translateX(2px)}
    .navbtn.on{
      color:#022c22;
      background:#d1fae5;
      border-color:#6ee7b7;
      box-shadow:4px 4px 0 #022c22;
    }
    .navbtn.on::before{
      content:"";
      position:absolute;
      left:-15px;
      width:4px;
      height:28px;
      background:#fbbf24;
    }
    .navbtn .txt>span{display:block;font-size:13px;font-weight:700}
    .navbtn small{display:block;margin-top:2px;color:inherit;font-size:10px;line-height:1.35;opacity:.72}
    .sidefoot{
      margin-top:auto;
      padding:16px 9px 3px;
      color:#a7f3d0;
      border-top:1px solid rgba(236,253,245,.18);
      font-size:11px;
      line-height:1.7;
    }
    .sidefoot b{color:#fff}
    .main{min-width:0;padding:24px clamp(14px,2.6vw,36px) 48px}
    .top{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      min-height:69px;
      padding-bottom:16px;
      margin-bottom:16px;
      border-bottom:1px solid var(--line);
    }
    .eyebrow{
      display:flex;
      align-items:center;
      gap:7px;
      margin-bottom:6px;
      color:var(--color-primary);
      font:600 10px/1 "Fira Code",monospace;
      letter-spacing:.13em;
      text-transform:uppercase;
    }
    .eyebrow::before{content:"";width:22px;height:2px;background:#fbbf24}
    .top h1{margin:0;font-size:clamp(22px,2.4vw,30px);line-height:1.1;letter-spacing:-.035em}
    .top p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:38px;
      padding:7px 12px;
      color:#065f46;
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:3px 3px 0 rgba(6,78,59,.09);
      font:600 11px/1.4 "Fira Code",monospace;
      white-space:nowrap;
    }
    .pill .dot{width:9px;height:9px;background:#059669;border:2px solid #d1fae5;border-radius:50%}
    .grid{display:grid;gap:12px}
    .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-plant{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card,.stat,.plant,.ticket{
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      transition:transform .22s,box-shadow .22s,border-color .22s;
    }
    .card:hover,.stat:hover,.plant:hover,.ticket:hover{
      border-color:#34d399;
      box-shadow:var(--shadow-hover);
      transform:translateY(-2px);
    }
    .card{min-width:0;padding:15px 16px;border-radius:var(--radius)}
    .card h3{margin:0;font-size:14px;line-height:1.35;letter-spacing:-.01em}
    .card .sub{margin:4px 0 11px;color:var(--muted);font-size:11px}
    .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
    .kpi{position:relative;min-height:136px;overflow:hidden}
    .kpi::after{
      content:"";
      position:absolute;
      top:0;
      right:0;
      width:52px;
      height:4px;
      background:#fbbf24;
    }
    .kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600}
    .kpi .lab .icon{width:17px;height:17px;color:var(--color-primary)}
    .kpi .val{
      margin-top:12px;
      color:#064e3b;
      font:700 28px/1 "Fira Code",monospace;
      letter-spacing:-.04em;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{font:600 11px/1 "Fira Sans",sans-serif;color:var(--muted)}
    .delta{margin-top:9px;font:600 10.5px/1.4 "Fira Code",monospace}
    .up{color:#047857}.down{color:#b91c1c}
    .spark{position:absolute;right:10px;bottom:8px;width:68px;height:30px;opacity:.75}
    .chart{width:100%;height:280px;min-width:0}
    .chart.sm{height:230px}
    .rowflex{display:flex;gap:10px;flex-wrap:wrap}
    .stat{flex:1;min-width:145px;padding:12px 13px;border-radius:10px}
    .stat .l{color:var(--muted);font-size:10.5px;font-weight:600}
    .stat .v{margin-top:5px;font:700 19px/1.2 "Fira Code",monospace;font-variant-numeric:tabular-nums}
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:4px 8px;
      border:1px solid currentColor;
      border-radius:6px;
      font-size:10.5px;
      font-weight:700;
      line-height:1.1;
    }
    .tag::before{content:"";width:6px;height:6px;border:1px solid currentColor;border-radius:50%;background:currentColor}
    .t-ok{color:#047857;background:#ecfdf5}
    .t-warn{color:#92400e;background:#fffbeb}
    .t-bad{color:#b91c1c;background:#fef2f2}
    .t-info{color:#0369a1;background:#f0f9ff}
    .t-mut{color:#475569;background:#f8fafc}
    .plant{position:relative;min-width:0;padding:14px;border-radius:10px}
    .plant .nm{padding-right:95px;font-size:13px;font-weight:700}
    .plant .loc{margin-top:3px;color:var(--muted);font-size:10.5px}
    .plant .big{margin:14px 0 0;font:700 22px/1 "Fira Code",monospace;font-variant-numeric:tabular-nums}
    .plant .big small{color:var(--muted);font:600 10px/1 "Fira Sans",sans-serif}
    .plant .mini{display:flex;gap:17px;margin-top:11px;color:var(--muted);font-size:10px}
    .plant .mini b{display:block;margin-top:2px;color:var(--ink);font:700 13px/1.2 "Fira Code",monospace}
    .health,.bar,.tprog{overflow:hidden;background:#e2e8f0;border-radius:2px}
    .health{height:5px;margin-top:12px}
    .health>i,.bar>i,.tprog>i{display:block;height:100%;background:var(--color-primary)}
    .badge{position:absolute;top:12px;right:12px;padding:4px 7px;border:1px solid currentColor;border-radius:5px;font-size:9.5px;font-weight:700}
    .badge::before{content:"● ";font-size:8px}
    table{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:12px}
    th,td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{
      position:sticky;
      top:0;
      z-index:1;
      color:#065f46;
      text-align:left;
      background:#ecfdf5;
      border-top:1px solid var(--line);
      font-size:10px;
      font-weight:700;
      letter-spacing:.04em;
    }
    td{color:#334155}
    td b{color:var(--ink)}
    tbody tr{transition:background-color .18s}
    tbody tr:hover{background:#f0fdf4}
    th:first-child,td:first-child{border-left:1px solid var(--line)}
    th:last-child,td:last-child{border-right:1px solid var(--line)}
    td:nth-child(n+2):not(:last-child),th:nth-child(n+2):not(:last-child){text-align:right}
    .mono{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }
    .tprog{display:inline-block;width:110px;height:5px;vertical-align:middle}
    .kb{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px}
    .kbcol{min-width:0;padding:10px;background:#f0fdf4;border:1px solid var(--line);border-radius:10px}
    .kh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
    .cnt{min-width:25px;padding:3px 7px;color:var(--muted);text-align:center;background:#fff;border:1px solid var(--line);border-radius:5px;font:600 10px "Fira Code",monospace}
    .ticket{padding:10px;margin-bottom:8px;border-radius:8px;box-shadow:0 3px 10px rgba(6,78,59,.05)}
    .ticket .tt{font-size:11.5px;font-weight:700;line-height:1.45}
    .ticket .meta{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--muted);font-size:9.5px;flex-wrap:wrap}
    .ticket .who{display:inline-flex;align-items:center;gap:5px}
    .av{display:grid;place-items:center;width:20px;height:20px;color:#fff;background:#047857;border-radius:4px;font-size:9px;font-weight:700}
    .prio{width:4px;height:17px;flex:none;border-radius:1px}
    .tl{position:relative;padding-left:27px}
    .tl::before{content:"";position:absolute;top:5px;bottom:4px;left:8px;width:1px;background:var(--line)}
    .tli{position:relative;padding-bottom:18px}
    .tli:last-child{padding-bottom:0}
    .tli .dot{position:absolute;top:2px;left:-24px;width:11px;height:11px;border:2px solid #fff;box-shadow:0 0 0 1px #64748b;border-radius:50%}
    .tli .tm{color:var(--muted);font:600 10px/1.4 "Fira Code",monospace}
    .tli .ti{margin:3px 0;font-size:12.5px;font-weight:700}
    .tli .td{color:var(--muted);font-size:11px;line-height:1.55}
    .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 13px;margin-top:7px}
    .li{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:11px}
    .li i,.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;border:1px solid currentColor;border-radius:2px;vertical-align:middle}
    .cal{display:grid;grid-template-columns:repeat(7,minmax(65px,1fr));gap:5px;min-width:520px}
    .dow{padding:4px;text-align:center;color:var(--muted);font:600 10px "Fira Code",monospace}
    .cell{min-height:73px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:7px}
    .cell.mut{background:#f8fafc}
    .cell .d{color:var(--muted);font:600 10px "Fira Code",monospace}
    .cell.today{border:2px solid var(--color-primary);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
    .ev{padding:3px 4px;margin-top:4px;overflow:hidden;border-left:3px solid currentColor;font-size:9.5px;font-weight:600;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}
    .ev.c{color:#0369a1;background:#e0f2fe}
    .ev.m{color:#047857;background:#d1fae5}
    .ev.i{color:#92400e;background:#fef3c7}
    .legend{display:flex;gap:14px;margin-top:11px;color:var(--muted);font-size:10.5px;flex-wrap:wrap}
    .mobilebrand{display:none}
    .grid-item{animation:enter .42s cubic-bezier(.2,.9,.3,1.25) both}
    .grid-item:nth-child(2){animation-delay:.05s}
    .grid-item:nth-child(3){animation-delay:.1s}
    .grid-item:nth-child(4){animation-delay:.15s}
    .grid-item:nth-child(5){animation-delay:.2s}
    .grid-item:nth-child(6){animation-delay:.25s}
    @keyframes enter{
      from{opacity:0;transform:translateY(14px) scale(.97)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1050px){
      .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g-plant{grid-template-columns:repeat(2,minmax(0,1fr))}
      .kb{grid-template-columns:repeat(2,minmax(220px,1fr))}
    }
    @media(max-width:820px){
      .shell{display:block}
      .side{
        position:sticky;
        top:0;
        width:100%;
        height:auto;
        padding:10px 12px;
        overflow-x:auto;
        overflow-y:hidden;
      }
      .brand,.sidefoot{display:none}
      .mobilebrand{display:flex;align-items:center;gap:9px;margin-bottom:9px;color:#fff;font-size:13px;font-weight:700}
      .mobilebrand .logo{width:32px;height:32px;box-shadow:none}
      #nav{display:flex;width:max-content}
      .navbtn{grid-template-columns:20px auto;width:auto;min-height:42px;padding:8px 10px}
      .navbtn small{display:none}
      .navbtn.on::before{display:none}
      .main{padding-top:18px}
      .g-2,.g-2e{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .top{align-items:flex-start;flex-direction:column}
      .pill{width:100%;white-space:normal}
      .g-kpi,.g-plant{grid-template-columns:1fr}
      .kb{grid-template-columns:1fr}
      .navbtn .txt{display:none}
      .navbtn{grid-template-columns:20px;padding:9px}
      .card{padding:13px}
      .lgrid{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .grid-item{animation:none!important}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="主要功能">
      <div class="mobilebrand">
        <div class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M12 1v2M12 11v2M6 7H4m16 0h-2M7.8 2.8 6.4 1.4m9.8 1.4 1.4-1.4M3 16h18l-2 6H5l-2-6Z"/><path d="m8 16 1 6m7-6-1 6"/></svg></div>
        太陽能案場維運艙
      </div>
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M12 1v2M12 11v2M6 7H4m16 0h-2M7.8 2.8 6.4 1.4m9.8 1.4 1.4-1.4M3 16h18l-2 6H5l-2-6Z"/><path d="m8 16 1 6m7-6-1 6"/></svg></div>
        <div><b>維運艙</b><span>SOLAR ASSET O&amp;M</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidefoot"><b>39 座案場</b> · 全台併網<br>資料為展示用途 · <b>Jvision</b> Demo</div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <div class="eyebrow">Operations command</div>
          <h1 id="scr-title">案場總覽</h1>
          <p id="scr-sub">全案場發電、可用率即時看板</p>
        </div>
        <span class="pill"><span class="dot" aria-hidden="true"></span>即時連線 · 2026/08/13 14:20</span>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <script>
    var ICONS={
      solar:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M12 1v2M12 11v2M6 7H4m16 0h-2M3 16h18l-2 6H5l-2-6Z"/></svg>',
      chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>',
      tool:'<svg class="icon" viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0-5-5L6 4l3 3-6 6a3 3 0 0 0 4 4l6-6 3 3-3 3a4 4 0 0 0 5-5l-4-4Z"/></svg>',
      alert:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>',
      clean:'<svg class="icon" viewBox="0 0 24 24"><path d="m14 4 6 6M17 7 8 16m-4 4h7l-7-7v7Z"/></svg>',
      pay:'<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20m-6 5h2"/></svg>',
      bolt:'<svg class="icon" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/></svg>',
      check:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
      leaf:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 4C11 4 5 8 5 15c0 3 2 5 5 5 7 0 10-7 10-16Z"/><path d="M4 21c3-6 7-9 12-12"/></svg>',
      trend:'<svg class="icon" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 7-8"/><path d="M15 7h5v5"/></svg>'
    };

    var MODS=[
      {icon:"solar",name:"案場總覽",sub:"全案場發電、可用率即時看板"},
      {icon:"chart",name:"發電監控",sub:"逆變器、串列發電曲線追蹤"},
      {icon:"tool",name:"巡檢派工",sub:"現場巡檢與維修工單調度"},
      {icon:"alert",name:"故障告警",sub:"設備異常告警與診斷處置"},
      {icon:"clean",name:"清洗保養",sub:"面板清洗與定期保養排程"},
      {icon:"pay",name:"售電收益",sub:"躉售電費結算與收益分析"}
    ];

    var nav=document.getElementById("nav");
    MODS.forEach(function(m,i){
      var b=document.createElement("button");
      b.type="button";
      b.className="navbtn";
      b.setAttribute("data-i",i);
      b.setAttribute("aria-label",m.name+"："+m.sub);
      b.innerHTML=ICONS[m.icon]+'<span class="txt"><span>'+m.name+'</span><small>'+m.sub+'</small></span>';
      b.addEventListener("click",function(){

      h+='<section class="grid g-2e" style="margin-top:12px"><article class="card"><div class="cardhead"><h3>月度售電收益趨勢</h3>'+tag("t-info","單位 · 萬元")+'</div><div id="c5" class="chart"></div></article><article class="card"><div class="cardhead"><h3>各案場收益占比</h3>'+tag("t-mut","期間 · 本月")+'</div><div id="c5b" class="chart"></div></article></section>';
      h+='<section class="card" style="margin-top:12px"><div class="cardhead"><h3>案場收益結算明細</h3>'+tag("t-warn","注意 · 2 案場低於預期")+'</div><div style="overflow-x:auto"><table><thead><tr><th>案場</th><th>本月發電(MWh)</th><th>費率(元/度)</th><th>本月收益(萬元)</th><th>PR值</th><th>年度累計(萬元)</th><th>狀態</th></tr></thead><tbody>';

        h+='<tr><td><b>'+r[0]+'</b></td><td class="mono">'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="mono"><b>'+r[3]+'</b></td><td class="mono">'+r[4]+'%</td><td class="mono">'+r[5]+'</td><td>'+tag(r[7],r[6])+'</td></tr>';

      mkChart(document.getElementById("c5"),merge(chartBase(),{

          {name:"實際收益",type:"bar",barWidth:"42%",itemStyle:{color:C.green},data:[2410,2620,2755,2810,2751,2882]},

      mkChart(document.getElementById("c5b"),merge(chartBase(),{
        tooltip:{trigger:"item",formatter:"{b}: {c} 萬元 ({d}%)"},
        legend:{bottom:0,type:"scroll",textStyle:{fontSize:10,color:C.gray}},
        series:[{type:"pie",radius:["40%","68%"],center:["50%","41%"],label:{show:false},data:[
          {value:605,name:"麥寮一場",itemStyle:{color:"#047857"}},
          {value:819,name:"七股鹽田",itemStyle:{color:"#059669"}},
          {value:359,name:"芳苑漁電",itemStyle:{color:"#10b981"}},
          {value:353,name:"林邊二場",itemStyle:{color:"#34d399"}},
          {value:100,name:"布袋案場",itemStyle:{color:C.gold}},
          {value:647,name:"永安案場",itemStyle:{color:"#065f46"}}
        ]}]
      }));
    }

    var SCREENS=[v0,v1,v2,v3,v4,v5];
    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      disposeCharts();
      document.querySelectorAll("[data-i]").forEach(function(b){
        var active=+b.getAttribute("data-i")===i;
        b.classList.toggle("on",active);
        b.setAttribute("aria-current",active?"page":"false");
      });
      document.getElementById("scr-title").textContent=MODS[i].name;
      document.getElementById("scr-sub").textContent=MODS[i].sub;
      SCREENS[i]();
      animateItems();
    }
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      show(m?Math.min(+m[1],SCREENS.length-1):0);
      try{window.scrollTo(0,0)}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
    fromHash();
  </script>
