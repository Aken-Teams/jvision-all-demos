<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外籍移工管理系統（Foreign Worker Management）｜Jvision 系統 Demo</title>
  <meta name="description" content="聘僱許可與居留證到期提醒、入出境與體檢排程、仲介費用申報與聘僱合規追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#0D9488;
      --color-on-primary:#000000;
      --color-secondary:#2DD4BF;
      --color-on-secondary:#0F172A;
      --color-accent:#D97706;
      --color-on-accent:#000000;
      --color-background:#F0FDFA;
      --color-foreground:#134E4A;
      --color-card:#FFFFFF;
      --color-card-foreground:#134E4A;
      --color-muted:#E8F1F4;
      --color-muted-foreground:#475569;
      --color-border:#5EEAD4;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#0D9488;
      --blue:#0D9488;
      --ink:#134E4A;
      --muted:#475569;
      --line:#5EEAD4;
      --ok:#047857;
      --warn:#A35405;
      --danger:#B91C1C;
      --info:#0369A1;
      --ok-soft:#D1FAE5;
      --warn-soft:#FEF3C7;
      --danger-soft:#FEE2E2;
      --info-soft:#E0F2FE;
      --radius:8px;
      --transition:180ms ease;
      --serif:"Crimson Pro","Noto Serif TC","PingFang TC",serif;
      --display:"Cormorant Garamond","Noto Serif TC","PingFang TC",serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0;min-height:100%}
    body{
      background:var(--color-background);
      color:var(--color-foreground);
      font-family:var(--serif);
      font-size:16px;
      line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    button,a,[role="button"]{cursor:pointer}
    button{font:inherit}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      background:var(--color-card);
      border-bottom:2px solid var(--color-primary);
    }
    .topbar-inner{
      width:min(100%,1440px);
      margin:auto;
      padding:10px 20px;
      display:flex;
      align-items:center;
      gap:18px;
      min-width:0;
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:220px}
    .logo{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      flex:none;
      color:var(--color-on-primary);
      background:var(--color-secondary);
      border:2px solid var(--color-primary);
      border-radius:7px;
    }
    .logo .material-symbols-outlined{font-size:23px}
    .brand-txt{min-width:0}
    .brand-txt b{
      display:block;
      color:var(--ink);
      font-family:var(--display);
      font-size:17px;
      font-weight:700;
      letter-spacing:.04em;
      line-height:1.1;
      white-space:nowrap;
    }
    .brand-txt span{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-family:"Cinzel",serif;
      font-size:9px;
      font-weight:600;
      letter-spacing:.08em;
      white-space:nowrap;
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:4px;
      min-width:0;
      margin-left:auto;
    }
    .nav button{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 10px;
      border:1px solid transparent;
      border-radius:6px;
      background:transparent;
      color:var(--muted);
      font-size:14px;
      font-weight:600;
      white-space:nowrap;
      transition:background-color var(--transition),color var(--transition),border-color var(--transition);
    }
    .nav button .material-symbols-outlined{font-size:19px}
    .nav button:hover{
      color:var(--ink);
      background:var(--color-muted);
      border-color:var(--line);
    }
    .nav button.active{
      color:var(--color-on-primary);
      background:var(--color-secondary);
      border-color:var(--color-primary);
    }
    main{
      width:min(100%,1440px);
      margin:auto;
      padding:20px 20px 56px;
      min-width:0;
    }
    .screen-head{
      position:relative;
      margin:0 0 15px;
      padding:18px 20px;
      overflow:hidden;
      background:var(--color-card);
      border:1px solid var(--line);
      border-left:5px solid var(--color-primary);
      border-radius:var(--radius);
    }
    .screen-head::after{
      content:"";
      position:absolute;
      right:18px;
      top:0;
      width:72px;
      height:100%;
      opacity:.35;
      background:
        linear-gradient(90deg,transparent 48%,var(--color-border) 49%,var(--color-border) 51%,transparent 52%),
        linear-gradient(0deg,transparent 48%,var(--color-border) 49%,var(--color-border) 51%,transparent 52%);
      background-size:18px 18px;
    }
    .eyebrow{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:3px 8px;
      color:#075E56;
      background:#CCFBF1;
      border:1px solid var(--line);
      border-radius:4px;
      font-size:12px;
      font-weight:600;
      letter-spacing:.04em;
    }
    .screen-head h1{
      position:relative;
      z-index:1;
      margin:8px 0 2px;
      color:var(--ink);
      font-family:var(--display);
      font-size:clamp(25px,2.2vw,34px);
      font-weight:700;
      line-height:1.05;
      letter-spacing:.015em;
    }
    .screen-head p{
      position:relative;
      z-index:1;
      max-width:820px;
      margin:0;
      color:var(--muted);
      font-size:14px;
      font-weight:400;
    }
    .grid{display:grid;gap:12px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g-2{grid-template-columns:minmax(0,1.58fr) minmax(300px,1fr)}
    .g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-side{grid-template-columns:minmax(0,1fr) 310px}
    .card{
      min-width:0;
      padding:14px;
      background:var(--color-card);
      color:var(--color-card-foreground);
      border:1px solid var(--line);
      border-radius:var(--radius);
      transition:border-color var(--transition),background-color var(--transition);
    }
    .card:hover{border-color:var(--color-primary)}
    .card h3{
      display:flex;
      align-items:center;
      gap:7px;
      margin:0 0 11px;
      color:var(--ink);
      font-size:15px;
      font-weight:600;
      letter-spacing:.015em;
    }
    .card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
    .card .sub{color:var(--muted);font-size:12px;font-weight:400}
    .kpi{
      position:relative;
      display:grid;
      grid-template-columns:38px 1fr;
      grid-template-rows:auto auto auto;
      column-gap:10px;
      overflow:hidden;
      border-top:3px solid var(--color-primary);
    }
    .kpi .ico{
      grid-row:1/4;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      color:#075E56;
      background:#CCFBF1;
      border:1px solid var(--line);
      border-radius:6px;
    }
    .kpi .ico .material-symbols-outlined{font-size:21px}
    .kpi .val{
      color:var(--ink);
      font-family:var(--display);
      font-size:27px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
      line-height:.95;
    }
    .kpi .lbl{margin-top:3px;color:var(--muted);font-size:12px;font-weight:600}
    .kpi .delta{
      display:inline-flex;
      align-items:center;
      gap:3px;
      width:max-content;
      margin-top:4px;
      font-size:11px;
      font-weight:600;
    }
    .kpi .delta.up{color:var(--ok)}
    .kpi .delta.down{color:var(--danger)}
    .kpi .delta.warn{color:var(--warn)}
    .kpi .delta .material-symbols-outlined{font-size:14px}
    .chart{width:100%;height:270px;overflow:hidden;min-width:0}
    .chart.sm{height:210px}
    .tbl-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:6px;
      scrollbar-color:var(--color-primary) var(--color-muted);
    }
    table{width:100%;min-width:540px;border-collapse:collapse;font-size:13px}
    th,td{
      padding:8px 10px;
      border-bottom:1px solid #BCEEE7;
      text-align:left;
      white-space:nowrap;
    }
    th{
      position:sticky;
      top:0;
      z-index:1;
      color:#0F4C47;
      background:#CCFBF1;
      font-size:11px;
      font-weight:600;
      letter-spacing:.035em;
    }
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#F0FDFA}
    td.name{font-weight:600}
    td:nth-child(5),td:nth-child(6){font-variant-numeric:tabular-nums}
    .mono,.date,.code{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .country-mark{
      display:inline-grid;
      place-items:center;
      min-width:25px;
      height:20px;
      margin-right:6px;
      padding:0 4px;
      color:#075E56;
      background:#CCFBF1;
      border:1px solid var(--line);
      border-radius:3px;
      font-family:var(--mono);
      font-size:9px;
      font-weight:700;
      vertical-align:middle;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 7px;
      border:1px solid currentColor;
      border-radius:4px;
      font-size:11px;
      font-weight:600;
      line-height:1.2;
    }
    .pill .material-symbols-outlined{font-size:13px}
    .p-ok{color:#047857;background:var(--ok-soft)}
    .p-warn{color:#8A4705;background:var(--warn-soft)}
    .p-danger{color:#B91C1C;background:var(--danger-soft)}
    .p-info{color:#075985;background:var(--info-soft)}
    .p-gray{color:#475569;background:#F1F5F9}
    .bar{
      min-width:80px;
      height:7px;
      overflow:hidden;
      background:#DCE7E9;
      border:1px solid #C5D6D9;
      border-radius:2px;
    }
    .bar>i{display:block;height:100%;background:var(--color-primary)}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
    .col{
      min-width:0;
      padding:8px;
      background:#F8FFFD;
      border:1px solid var(--line);
      border-radius:6px;
    }
    .ch{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
      padding:0 1px;
      color:var(--ink);
      font-size:12px;
      font-weight:600;
    }
    .cnt{
      min-width:22px;
      padding:1px 6px;
      color:var(--muted);
      background:#FFF;
      border:1px solid var(--line);
      border-radius:3px;
      text-align:center;
    }
    .ticket{
      margin-bottom:7px;
      padding:8px;
      background:#FFF;
      border:1px solid #BCEEE7;
      border-left:3px solid var(--color-accent);
      border-radius:5px;
      transition:background-color var(--transition),border-color var(--transition);
    }
    .ticket:last-child{margin-bottom:0}
    .ticket:hover{background:#FFFBEB;border-color:var(--color-accent)}
    .ticket b{display:block;font-size:12px;font-weight:600}
    .ticket .meta{
      display:flex;
      align-items:center;
      gap:5px;
      flex-wrap:wrap;
      margin-top:5px;
      color:var(--muted);
      font-size:10.5px;
    }
    .tl{position:relative;padding-left:22px;min-width:0}
    .tl::before{
      content:"";
      position:absolute;
      left:7px;
      top:4px;
      bottom:4px;
      width:2px;
      background:var(--line);
    }
    .tl-item{position:relative;padding:0 0 16px 5px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item::before{
      content:"";
      position:absolute;
      left:-19px;
      top:3px;
      width:12px;
      height:12px;
      background:#FFF;
      border:3px solid var(--color-accent);
      border-radius:50%;
    }
    .tl-item.done::before{background:var(--color-primary);border-color:var(--color-primary)}
    .tl-item .t{font-size:13px;font-weight:600}
    .tl-item .d{color:var(--muted);font-size:11px}
    .lrow{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      padding:9px 2px;
      border-bottom:1px solid #BCEEE7;
    }
    .lrow:last-child{border-bottom:0}
    .lrow .av{
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      flex:none;
      color:#FFF;
      border-radius:5px;
    }
    .lrow .info{min-width:0;flex:1}
    .lrow .info b{display:block;font-size:13px;font-weight:600}
    .lrow .info span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
    .lrow .rt{flex:none;text-align:right}
    .mini{display:flex;gap:8px;flex-wrap:wrap}
    .mini .m{
      min-width:100px;
      flex:1;
      padding:9px 10px;
      background:#F0FDFA;
      border:1px solid var(--line);
      border-radius:5px;
    }
    .mini .v{
      color:var(--ink);
      font-family:var(--display);
      font-size:20px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }
    .mini .l{color:var(--muted);font-size:11px;font-weight:600}
    .donut-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .legend{min-width:132px;margin:0;padding:0;list-style:none;font-size:12px}
    .legend li{display:flex;align-items:center;gap:7px;padding:4px 0}
    .legend .dot{width:10px;height:10px;flex:none;border:1px solid rgba(0,0,0,.18);border-radius:2px}
    .legend b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    .foot-note{
      display:flex;
      align-items:flex-start;
      gap:5px;
      margin-top:9px;
      color:var(--muted);
      font-size:11px;
    }
    .reveal{animation:reveal .36s ease both}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1100px){
      .topbar-inner{align-items:flex-start;flex-direction:column;gap:8px}
      .nav{width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
      .nav button{flex:none}
    }
    @media(max-width:820px){
      main{padding:14px 14px 48px}
      .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g-2,.g-2e,.g-side{grid-template-columns:1fr}
      .board{grid-template-columns:repeat(2,minmax(0,1fr))}
      .screen-head::after{display:none}
    }
    @media(max-width:480px){
      .topbar-inner{padding:9px 12px}
      .g-kpi,.board{grid-template-columns:1fr}
      .screen-head{padding:15px}
      .card{padding:11px}
      .nav button{min-width:42px;justify-content:center;padding:8px}
      .nav button .txt{display:none}
      .brand{min-width:0}
      .chart{height:240px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .reveal{animation:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">groups</span></div>
        <div class="brand-txt">
          <b>移工管理平台</b>
          <span>Foreign Worker Management</span>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能"></nav>
    </div>
  </header>
  <main id="app"></main>
  <script>
  (function(){
    "use strict";
    var accent="#0D9488",accent2="#2DD4BF",amber="#D97706",charts={};
    var NAV=[
      {i:0,ico:"groups",label:"移工名冊"},
      {i:1,ico:"verified",label:"證件效期"},
      {i:2,ico:"calendar_month",label:"入出境體檢"},
      {i:3,ico:"receipt_long",label:"仲介費用"},
      {i:4,ico:"gavel",label:"合規稽核"},
      {i:5,ico:"account_tree",label:"續聘離境"}
    ];
    function el(html){var d=document.createElement("div");d.className="reveal";d.innerHTML=html;return d}
    function flag(c){return {"越南":"VN","印尼":"ID","菲律賓":"PH","泰國":"TH"}[c]||"FW"}
    function esc(s){return String(s).replace(/[&<>]/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[x]})}
    function disposeAll(){for(var k in charts){try{charts[k].dispose()}catch(e){}}charts={}}
    function mk(id,opt){var node=document.getElementById(id);if(!node)return;var c=echarts.init(node);c.setOption(opt);charts[id]=c}
    function country(c){return '<span class="country-mark" aria-label="'+esc(c)+'">'+flag(c)+'</span>'}
    function head(title,ico,desc){
      return '<div class="screen-head"><span class="eyebrow"><span class="material-symbols-outlined" style="font-size:15px">'+ico+'</span>移工管理模組</span><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'
    }
    function kpi(ico,val,lbl,dir,delta){
      var dc=dir==="up"?"up":dir==="down"?"down":"warn";
      var di=dir==="up"?"trending_up":dir==="down"?"trending_down":"info";
      return '<div class="card kpi"><div class="ico"><span class="material-symbols-outlined">'+ico+'</span></div><div class="val">'+esc(val)+'</div><div class="lbl">'+esc(lbl)+'</div><div class="delta '+dc+'"><span class="material-symbols-outlined">'+di+'</span>'+esc(delta)+'</div></div>'
    }
    function mini(v,l){return '<div class="m"><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div></div>'}
    function natLeg(n,v,c){return '<li><span class="dot" style="background:'+c+'"></span>'+n+'<b>'+v+' 人</b></li>'}
    var WORKERS=[
      {name:"NGUYEN VAN A",cn:"阮文安",nat:"越南",plant:"A廠 沖壓",agent:"宏昌人力",permit:"2026-11-08",arc:"2026-09-02",status:"在職",years:2.3},
      {name:"SITI RAHMA",cn:"西蒂",nat:"印尼",plant:"B廠 組裝",agent:"友邦仲介",permit:"2026-08-30",arc:"2026-08-25",status:"在職",years:1.1},
      {name:"DELA CRUZ M",cn:"戴拉",nat:"菲律賓",plant:"A廠 品保",agent:"宏昌人力",permit:"2027-02-14",arc:"2027-01-10",status:"在職",years:.6},
      {name:"SOMCHAI P",cn:"頌猜",nat:"泰國",plant:"C廠 表面處理",agent:"泰豐勞務",permit:"2026-09-19",arc:"2026-10-05",status:"在職",years:2.9},
      {name:"TRAN THI B",cn:"陳氏碧",nat:"越南",plant:"B廠 包裝",agent:"友邦仲介",permit:"2028-03-01",arc:"2027-11-18",status:"在職",years:.3},
      {name:"BUDI SANTOSO",cn:"布迪",nat:"印尼",plant:"A廠 沖壓",agent:"宏昌人力",permit:"2026-08-22",arc:"2026-08-19",status:"待續聘",years:2.9},
      {name:"REYES J",cn:"雷耶斯",nat:"菲律賓",plant:"C廠 CNC",agent:"泰豐勞務",permit:"2027-06-30",arc:"2027-05-12",status:"在職",years:1.7},
      {name:"LE VAN C",cn:"黎文誠",nat:"越南",plant:"B廠 組裝",agent:"友邦仲介",permit:"2026-08-28",arc:"2026-09-15",status:"在職",years:2.1}
    ];

        var active=(+btns[k].getAttribute("data-i"))===i;
        btns[k].classList.toggle("active",active);
        btns[k].setAttribute("aria-current",active?"page":"false")
      }
      void app.offsetHeight;
      try{s.draw()}catch(e){}
    }
    window.addEventListener("resize",function(){for(var k in charts){try{charts[k].resize()}catch(e){}}});
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0)}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
</html>
