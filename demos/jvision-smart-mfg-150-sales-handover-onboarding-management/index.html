<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
  --color-on-secondary:#000;--color-accent:#059669;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#0f172a;--color-card:#fff;
  --color-card-foreground:#0f172a;--color-muted:#f1f5fd;--color-muted-foreground:#475569;
  --color-border:#e4ecfc;--color-destructive:#dc2626;--color-on-destructive:#fff;
  --color-ring:#2563eb;--blue:#2563eb;--ink:#0f172a;--muted:#475569;--line:#e4ecfc;
  --ok:#047857;--ok-bg:#d1fae5;--warn:#9a5410;--warn-bg:#fef3c7;
  --bad:#b91c1c;--bad-bg:#fee2e2;--info:#1d4ed8;--info-bg:#dbeafe;
}
*{box-sizing:border-box;min-width:0}
html{background:var(--color-background);color:var(--ink);scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;font-family:"Fira Sans",sans-serif;font-size:14px;line-height:1.45}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:19px;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;white-space:nowrap}
.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:6px}
.brand small{display:block;margin-top:1px;color:var(--muted);font:500 10px/1.3 "Fira Code",monospace;letter-spacing:.03em}
.nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;padding:2px}
.nav button{display:flex;align-items:center;gap:6px;min-height:40px;padding:8px 11px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav .n{font:600 10px "Fira Code",monospace;opacity:.75}
main{max-width:1440px;margin:auto;padding:22px 20px 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
.head h1{display:flex;align-items:center;gap:9px;margin:0;font-size:23px;line-height:1.2;letter-spacing:-.02em}
.head h1 .material-symbols-outlined{color:var(--blue);font-size:26px}
.head p,.sub,.mini{color:var(--muted)}
.head p{margin:5px 0 0;font-size:13px}
.pill,.tag,.chip{display:inline-flex;align-items:center;gap:5px}
.pill{padding:6px 10px;border:1px solid #bfdbfe;border-radius:999px;background:#eff6ff;color:#1e40af;font-size:12px;font-weight:600;white-space:nowrap}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:1.65fr 1fr}.g32{grid-template-columns:1fr 1.55fr}
.card{background:var(--color-card);border:1px solid var(--line);border-radius:7px;padding:15px;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:border-color .2s,transform .2s}
.card:hover{border-color:#bfdbfe}
.card h3{display:flex;align-items:center;gap:7px;margin:0 0 2px;font-size:14px}
.card h3 .material-symbols-outlined{color:var(--blue)}
.card .sub{margin-bottom:11px;font-size:12px}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
.kpi .lab{color:var(--muted);font-size:12px;font-weight:600}
.kpi .val{margin-top:8px;font:700 29px/1 "Fira Code",monospace;letter-spacing:-.04em}
.kpi .val small{font:600 13px "Fira Sans",sans-serif;color:var(--muted)}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;display:grid;place-items:center;border-radius:5px;background:#eff6ff;color:var(--blue)}
.dt{display:inline-flex;align-items:center;gap:3px;margin-top:9px;font:600 11px "Fira Code",monospace}.up{color:var(--ok)}.down{color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12.5px}
th{padding:9px 11px;background:var(--color-muted);border-bottom:1px solid var(--line);color:#334155;text-align:left;font-size:11.5px;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid #edf2fa;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
code,.mono,td:first-child{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.tag{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:#065f46}.t-warn{background:var(--warn-bg);color:#854d0e}
.t-bad{background:var(--bad-bg);color:#991b1b}.t-info{background:var(--info-bg);color:#1e40af}.t-mut{background:#e9eef7;color:#334155}
.av{width:27px;height:27px;display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--blue);color:#fff;font:700 10px "Fira Code",monospace}
.who{display:flex;align-items:center;gap:7px}
.bar{height:6px;min-width:58px;overflow:hidden;border-radius:2px;background:#e2e8f0}.bar i{display:block;height:100%;background:var(--blue)}
.chart{overflow:hidden}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;min-width:660px}
.col{padding:9px;border:1px solid var(--line);border-radius:6px;background:#f8fafc}
.col h4{display:flex;justify-content:space-between;margin:0 0 8px;color:#334155;font-size:12px}
.col h4 .c{padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;font-family:"Fira Code",monospace}
.ci{margin-bottom:7px;padding:8px 9px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;background:#fff;font-size:12px}
.ci b{display:block;margin-bottom:3px}.ci .m{display:flex;gap:7px;color:var(--muted);font-size:11px}
.tl{position:relative;margin:4px 0 0;padding-left:25px}.tl:before{content:"";position:absolute;left:8px;top:5px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;list-style:none;padding:0 0 14px}.tl li:before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 2px #cbd5e1}
.tl li.done:before{background:var(--ok);box-shadow:0 0 0 2px #a7f3d0}.tl .tt{font-weight:600}.tl .td{color:var(--muted);font-size:12px}.tl .tm{color:var(--blue);font:600 10.5px "Fira Code",monospace}
.stat-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.chip{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#f8fafc;color:#334155;font-size:11.5px;font-weight:600}.chip b{color:var(--blue);font:700 14px "Fira Code",monospace}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 11px;border:1px solid #bfdbfe;border-radius:5px;background:#eff6ff;color:#1e3a5f;font-size:12px}.note .material-symbols-outlined{flex:none;color:var(--blue)}
.item{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:#f8fafc}.mini{font-size:11.5px}
.prog-lg{display:flex;align-items:center;gap:13px}.ring{--p:0;width:92px;height:92px;display:grid;place-items:center;flex:none;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),#e2e8f0 0)}.ring i{width:70px;height:70px;display:grid;place-content:center;text-align:center;border-radius:50%;background:#fff;font-style:normal}.ring b{color:var(--blue);font:700 20px "Fira Code",monospace}.ring s{color:var(--muted);font-size:10px;text-decoration:none}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11.5px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px}
.divider{height:1px;margin:11px 0;background:var(--line)}
.sig{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid #bfdbfe;border-radius:5px;background:#eff6ff}.sig .num{margin-left:auto;color:var(--blue);font:700 24px "Fira Code",monospace}
.stack{display:flex;flex-direction:column;gap:8px}
.reveal{animation:reveal .35s ease-out both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}}
@media(max-width:1024px){.topbar-in{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){main{padding:17px 13px 48px}.topbar-in{padding:9px 13px}.g2,.g23,.g32{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:20px}}
@media(max-width:480px){.g4,.g3{grid-template-columns:1fr}.nav .lbl{display:none}.nav{justify-content:space-between}.nav button{justify-content:center;flex:1;padding:8px}.card{padding:13px}.kpi .val{font-size:26px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
