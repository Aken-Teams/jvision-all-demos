<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>業務交接管理 Sales Handover/Onboarding Management｜Jvision 系統 Demo</title>
<meta name="description" content="從業務異動到客戶完成交接的可操作、可追蹤、可稽核平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --acc:#a16207; --acc2:#eab308; --acc-soft:#fef3c7; --acc-soft2:#fef9c3;
  --ink:#1c1917; --sub:#78716c; --line:#e7e5e4; --bg:#faf9f7; --card:#ffffff;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --info:#1d4ed8; --info-bg:#dbeafe;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
a{color:inherit;text-decoration:none}
/* top nav */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#3b2f0b,#5c4809);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(234,179,8,.4)}
.brand small{display:block;font-weight:500;font-size:11px;color:#e7d9a8;letter-spacing:.5px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);color:#f5eeda;border:1px solid rgba(255,255,255,.1);padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.16)}
.nav button.on{background:var(--acc2);color:#3b2f0b;border-color:var(--acc2);box-shadow:0 2px 8px rgba(234,179,8,.35)}
.nav button .n{font-size:10px;opacity:.8;font-weight:800}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:22px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.head h1 .material-symbols-outlined{color:var(--acc);font-size:26px}
.head p{color:var(--sub);font-size:13px;margin-top:4px}
.pill{background:var(--acc-soft);color:var(--acc);border:1px solid #fde68a;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
/* grid */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card h3 .material-symbols-outlined{color:var(--acc);font-size:19px}
.card .sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:6px;line-height:1}
.kpi .val small{font-size:14px;font-weight:700;color:var(--sub)}
.kpi .dt{font-size:12px;margin-top:8px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--acc)}
.up{color:var(--ok)}.down{color:var(--bad)}
/* table */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{background:#faf7f0;text-align:left;padding:10px 12px;font-weight:700;color:#57534e;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f5f5f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fdfbf6}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}
.t-mut{background:#f5f5f4;color:#78716c}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:var(--acc);flex:none}
.who{display:flex;align-items:center;gap:8px}
.bar{height:7px;border-radius:99px;background:#f0ede6;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.chart{overflow:hidden}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#57534e}
.col h4 span.c{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px}
.ci{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12.5px}
.ci b{font-weight:700;display:block;margin-bottom:3px}
.ci .m{color:var(--sub);font-size:11.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl li{list-style:none;position:relative;padding:0 0 16px 6px}
.tl li::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--acc);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--acc-soft)}
.tl li.done::before{background:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.tl li.wait::before{background:#d6d3d1;box-shadow:0 0 0 2px #f5f5f4}
.tl .tt{font-size:13px;font-weight:700}
.tl .td{font-size:12px;color:var(--sub);margin-top:2px}
.tl .tm{font-size:11px;color:var(--acc);font-weight:700;margin-top:3px}
/* misc */
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{background:#faf7f0;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;color:#57534e;display:flex;align-items:center;gap:6px}
.chip b{color:var(--acc);font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.note{background:var(--acc-soft2);border:1px solid #fde68a;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#713f12;display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{color:var(--acc);font-size:19px;flex:none}
.prog-lg{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(var(--acc) calc(var(--p)*1%),#f0ede6 0);display:flex;align-items:center;justify-content:center}
.ring i{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.ring i b{font-size:22px;font-weight:900;color:var(--acc)}
.ring i s{font-size:10px;color:var(--sub);text-decoration:none}
.mini{font-size:11.5px;color:var(--sub)}
.sig{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,var(--acc-soft),#fff);border:1px solid #fde68a;border-radius:12px;padding:12px 14px}
.sig .num{font-size:26px;font-weight:900;color:var(--acc);line-height:1}
.divider{height:1px;background:var(--line);margin:12px 0}
@media(max-width:560px){.nav button .lbl{display:none}.nav button{padding:8px 10px}.head h1{font-size:19px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="logo material-symbols-outlined">move_up</span>
      <span>業務交接管理<small>Sales Handover / Onboarding</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main>
  <div id="view"></div>
</main>
<script>
"use strict";
var NAV=[
  {i:0,ic:"dashboard",lbl:"交接總覽"},
  {i:1,ic:"groups",lbl:"客戶商機清冊"},
  {i:2,ic:"checklist",lbl:"交接清單進度"},
  {i:3,ic:"fact_check",lbl:"主管審核簽收"},
  {i:4,ic:"warning",lbl:"未結案事項"},
  {i:5,ic:"insights",lbl:"交接成效分析"}
];
var view=document.getElementById("view");
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var base={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'}};if(!opt.chart)opt.chart={};for(var kk in base.chart){if(opt.chart[kk]===undefined)opt.chart[kk]=base.chart[kk];}var c=new ApexCharts(el,opt);c.render();charts.push(c);}
function ini(a,b){return '<span class="av" style="background:'+b+'">'+a+'</span>';}
var GOLD=["#a16207","#eab308","#ca8a04","#f59e0b","#854d0e","#fbbf24"];

/* ============ SCREEN 0 : 交接總覽儀表 ============ */
function v0(){
  var html='';
  html+=hd("dashboard","交接總覽儀表","進行中交接案件、完整率與客戶流失風險一眼掌握","本月 8 件在辦");
  var kpis=[
    {lab:"進行中交接案",v:"8",u:"件",ic:"move_up",dt:"+2 較上月",up:true},
    {lab:"平均交接完整率",v:"86",u:"%",ic:"task_alt",dt:"+9pt",up:true},
    {lab:"逾期交接案",v:"2",u:"件",ic:"schedule",dt:"-1 件",up:true},
    {lab:"交接後客戶流失率",v:"3.4",u:"%",ic:"person_off",dt:"-2.1pt",up:true}
  ];
  html+='<div class="grid g4">';
  for(var i=0;i<kpis.length;i++){var k=kpis[i];
    html+='<div class="card kpi"><div class="ic material-symbols-outlined">'+k.ic+'</div>'
      +'<div class="lab">'+k.lab+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div>'
      +'<div class="dt '+(k.up?'up':'down')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(k.up?'trending_up':'trending_down')+'</span>'+k.dt+'</div></div>';
  }
  html+='</div>';
  html+='<div class="grid g23" style="margin-top:14px">';
  html+='<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各交接案進度分佈</h3><div class="sub">依交接工作項目狀態統計（件數）</div><div id="c0a" class="chart" style="height:300px"></div><div class="legend"><span><i style="background:#15803d"></i>已交付</span><span><i style="background:#eab308"></i>進行中</span><span><i style="background:#d6d3d1"></i>待處理</span></div></div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>交接案狀態</h3><div class="sub">全部 12 件（含已結案）</div><div id="c0b" class="chart" style="height:250px"></div>'
    +'<div class="stat-row"><span class="chip"><b>8</b> 進行中</span><span class="chip"><b>2</b> 待審核</span><span class="chip"><b>2</b> 已結案</span></div></div>';
  html+='</div>';
  // signature: handover cases table
  var rows=[
    {c:"HO-2608-01",dep:"北區業務一課",out:"陳建宏",oc:"CH",in:"林品妤",inc:"LI",cust:24,opp:9,due:"08/20",p:92,st:"進行中",t:"t-warn"},
    {c:"HO-2608-02",dep:"南區業務二課",out:"王志明",oc:"WA",in:"黃郁婷",inc:"HU",cust:31,opp:12,due:"08/18",p:100,st:"待審核",t:"t-info"},
    {c:"HO-2608-03",dep:"大客戶事業部",out:"李國維",oc:"LI",in:"張凱翔",inc:"CH",cust:11,opp:6,due:"08/15",p:64,st:"逾期",t:"t-bad"},
    {c:"HO-2608-04",dep:"通路業務課",out:"周雅琪",oc:"CH",in:"吳承恩",inc:"WU",cust:19,opp:5,due:"08/25",p:78,st:"進行中",t:"t-warn"},
    {c:"HO-2608-05",dep:"北區業務三課",out:"許文彬",oc:"HS",in:"蔡宜庭",inc:"TS",cust:8,opp:3,due:"08/12",p:100,st:"已結案",t:"t-ok"}
  ];
  var tb='';
  for(var r=0;r<rows.length;r++){var o=rows[r];
    tb+='<tr><td><b>'+o.c+'</b></td><td>'+o.dep+'</td>'
      +'<td><div class="who">'+ini(o.oc,"#854d0e")+o.out+'</div></td>'
      +'<td><div class="who">'+ini(o.inc,"#a16207")+o.in+'</div></td>'
      +'<td style="text-align:center">'+o.cust+'</td><td style="text-align:center">'+o.opp+'</td>'
      +'<td>'+o.due+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+o.p+'%"></i></div><span style="font-size:11px;font-weight:700;color:#57534e">'+o.p+'%</span></div></td>'
      +'<td><span class="tag '+o.t+'">'+o.st+'</span></td></tr>';
  }
  html+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">table_view</span>進行中交接案件清單</h3><div class="sub">signature：交接案主控台，追蹤每案客戶／商機數與完成度</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>交接單號</th><th>單位</th><th>離任業務</th><th>接手業務</th><th>客戶</th><th>商機</th><th>期限</th><th>完整度</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>';
  view.innerHTML=html;
  void view.offsetHeight;
  mk("c0a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",stacked:true,height:300},plotOptions:{bar:{horizontal:false,columnWidth:"52%",borderRadius:4}},
    series:[{name:"已交付",data:[18,20,7,12,6]},{name:"進行中",data:[4,3,2,4,1]},{name:"待處理",data:[2,1,3,3,0]}],
    colors:["#15803d","#eab308","#d6d3d1"],dataLabels:{enabled:false},
    xaxis:{categories:["HO-01","HO-02","HO-03","HO-04","HO-05"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{style:{fontSize:"11px"}}},grid:{borderColor:"#f0ede6"},legend:{show:false},
    tooltip:{shared:true,intersect:false}});
  mk("c0b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:250},series:[8,2,2],labels:["進行中","待審核","已結案"],
    colors:["#eab308","#1d4ed8","#15803d"],dataLabels:{enabled:false},legend:{position:"bottom",fontSize:"12px"},
    plotOptions:{pie:{donut:{size:"66%",labels:{show:true,total:{show:true,label:"交接案",fontSize:"12px",color:"#78716c",formatter:function(){return "12 件";}}}}}},
    stroke:{width:2}});
}

/* ============ SCREEN 1 : 客戶與商機清冊 ============ */
function v1(){
  var html='';
  html+=hd("groups","客戶與商機清冊","盤點離任業務名下客戶、商機與往來紀錄","HO-2608-01｜陳建宏 名下");
  html+='<div class="grid g4">';
  var s=[
    {lab:"名下客戶",v:"24",ic:"apartment"},{lab:"進行中商機",v:"9",ic:"trending_up"},
    {lab:"預估金額",v:"1,860",u:"萬",ic:"payments"},{lab:"待補資料",v:"5",u:"筆",ic:"edit_note"}
  ];
  for(var i=0;i<s.length;i++){var k=s[i];
    html+='<div class="card kpi"><div class="ic material-symbols-outlined">'+k.ic+'</div><div class="lab">'+k.lab+'</div><div class="val">'+k.v+(k.u?' <small>'+k.u+'</small>':'')+'</div></div>';
  }
  html+='</div>';
  html+='<div class="grid g23" style="margin-top:14px">';
  // customer list
  var cust=[
    {n:"宏遠精機股份",lv:"A",lt:"t-bad",own:"營運長 廖先生",opp:3,amt:"620萬",last:"08/05",comp:95},
    {n:"台鴻自動化",lv:"A",lt:"t-bad",own:"採購經理 江小姐",opp:2,amt:"410萬",last:"07/28",comp:80},
    {n:"晉O科技",lv:"B",lt:"t-warn",own:"廠長 郭先生",opp:1,amt:"180萬",last:"08/09",comp:100},
    {n:"O信機械",lv:"B",lt:"t-warn",own:"總務 何小姐",opp:2,amt:"350萬",last:"06/30",comp:60},
    {n:"銓O工業",lv:"C",lt:"t-mut",own:"業務窗口 賴先生",opp:1,amt:"120萬",last:"08/01",comp:45}
  ];
  var ct='';
  for(var c=0;c<cust.length;c++){var o=cust[c];
    ct+='<tr><td><b>'+o.n+'</b></td><td style="text-align:center"><span class="tag '+o.lt+'">'+o.lv+'</span></td><td>'+o.own+'</td>'
      +'<td style="text-align:center">'+o.opp+'</td><td>'+o.amt+'</td><td>'+o.last+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:7px"><div class="bar" style="flex:1"><i style="width:'+o.comp+'%"></i></div><span style="font-size:11px;font-weight:700;color:'+(o.comp<70?'#b45309':'#57534e')+'">'+o.comp+'%</span></div></td></tr>';
  }
  html+='<div class="card"><h3><span class="material-symbols-outlined">apartment</span>名下客戶清冊</h3><div class="sub">依重要度分級，資料完整度低者需優先補齊</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>客戶名稱</th><th>級別</th><th>關鍵聯絡人</th><th>商機</th><th>金額</th><th>最後往來</th><th>資料完整度</th></tr></thead><tbody>'+ct+'</tbody></table></div></div>';
  // opportunity value by stage
  html+='<div class="card"><h3><span class="material-symbols-outlined">insights</span>商機金額分佈</h3><div class="sub">依商機階段（萬元）</div><div id="c1a" class="chart" style="height:280px"></div></div>';
  html+='</div>';
  // interaction timeline

/* ===== helpers ===== */
function hd(ic,t,d,pill){
  return '<div class="head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h1><p>'+d+'</p></div><span class="pill"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+pill+'</span></div>';
}
function tli(cls,t,d,m){return '<li class="'+cls+'"><div class="tt">'+t+'</div><div class="td">'+d+'</div><div class="tm">'+m+'</div></li>';}
function miss(t,d,tt){return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:#faf8f3;border:1px solid var(--line);border-radius:10px"><span class="tag '+tt+'" style="flex:none;margin-top:1px">!</span><div><b style="font-size:12.5px">'+t+'</b><div class="mini">'+d+'</div></div></div>';}
function chkrow(t,c,o,st,stt){return '<tr><td>'+t+'</td><td>'+c+'</td><td>'+o+'</td><td><span class="tag '+stt+'">'+st+'</span></td></tr>';}
function rulerow(id,r,hit,tt){return '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#faf8f3;border:1px solid var(--line);border-radius:10px"><span class="tag t-mut" style="flex:none;font-weight:800">'+id+'</span><div style="flex:1"><div style="font-size:12.5px;font-weight:600;color:#44403c">'+r+'</div></div><span class="tag '+tt+'" style="flex:none">'+hit+'</span></div>';}

/* ===== render + nav ===== */
var SCREENS=[v0,v1,v2,v3,v4,v5];
function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
(function buildNav(){
  var nav=document.getElementById("nav");var h='';
  for(var i=0;i<NAV.length;i++){var o=NAV[i];
    h+='<button data-i="'+o.i+'"><span class="n">'+o.i+'</span><span class="material-symbols-outlined" style="font-size:18px">'+o.ic+'</span><span class="lbl">'+o.lbl+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
