<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 協作工作台｜Jvision 系統 Demo</title>
<meta name="description" content="任務、專案、知識到流程自動化的團隊協作（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --org:#ea580c; --org2:#fb923c; --org-d:#c2410c;
    --side:#1c1917; --side2:#292524; --side-tx:#d6c9c1; --side-mut:#9c8f86;
    --ink:#1c1917; --body:#44403c; --muted:#8b827b; --line:#ece7e3; --bg:#f6f3f0;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --blue:#2563eb; --purple:#7c3aed;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .shell{ display:grid; grid-template-columns:214px 1fr; min-height:100vh; }
  /* sidebar */
  .side{ background:linear-gradient(180deg,var(--side),#0c0a09); display:flex; flex-direction:column; padding:16px 12px; gap:4px; position:sticky; top:0; height:100vh; overflow:auto; }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 16px; }
  .brand .lg{ width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--org2),var(--org)); color:#fff; display:grid; place-content:center; flex:none; box-shadow:0 6px 16px rgba(234,88,12,.4); }
  .brand .lg .material-symbols-outlined{ font-size:24px; }
  .brand b{ color:#fff; font-size:15px; font-weight:900; letter-spacing:.5px; display:block; }
  .brand small{ color:var(--side-mut); font-size:11px; }
  .side .cat{ font-size:10px; font-weight:800; color:var(--side-mut); text-transform:uppercase; letter-spacing:1px; padding:12px 10px 6px; }
  .side button{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:10px 11px; border:0; background:none; color:var(--side-tx); border-radius:11px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; min-width:0; }
  .side button .material-symbols-outlined{ font-size:21px; flex:none; }
  .side button:hover{ background:var(--side2); color:#fff; }
  .side button.on{ background:linear-gradient(135deg,var(--org),var(--org-d)); color:#fff; box-shadow:0 6px 14px rgba(234,88,12,.35); }
  .side .btxt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side .sp{ margin-top:auto; }
  .side .me{ display:flex; align-items:center; gap:10px; padding:10px 8px 4px; border-top:1px solid #3a332f; margin-top:8px; }
  .side .me .av{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--org2),var(--org)); color:#fff; display:grid; place-content:center; font-weight:800; font-size:13px; flex:none; }
  .side .me b{ color:#fff; font-size:12px; display:block; } .side .me small{ color:var(--side-mut); font-size:10px; }
  /* main */
  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ position:sticky; top:0; z-index:10; background:rgba(255,255,255,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:13px 26px; display:flex; align-items:center; gap:14px; }
  .top h1{ margin:0; font-size:18px; font-weight:900; color:var(--ink); } .top .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--org-d); background:#ffedd5; border-radius:999px; padding:5px 11px; }
  .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--org); animation:pulse 2s infinite; } @keyframes pulse{50%{opacity:.25;}}
  .ico{ width:34px; height:34px; border-radius:10px; background:#fff; border:1px solid var(--line); color:var(--body); display:grid; place-content:center; } .ico .material-symbols-outlined{ font-size:19px; }
  .body{ padding:22px 26px 46px; min-width:0; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:22px; font-weight:900; color:var(--ink); } .vh p{ margin:4px 0 0; font-size:13px; color:var(--muted); }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--org); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; } .btn:hover{ background:var(--org-d); } .btn.ghost{ background:#fff; color:var(--org-d); border:1px solid var(--line); } .btn .material-symbols-outlined{ font-size:18px; }
  /* kpis */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:15px; padding:15px 17px; border-left:4px solid var(--org); min-width:0; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; align-items:center; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--org); }
  .kpi .v{ font-size:27px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:4px; } .up{ color:var(--green); } .dn{ color:var(--red); }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1fr 1fr; } .g21{ grid-template-columns:1.5fr 1fr; } .g12{ grid-template-columns:1fr 1.5fr; } .g3{ grid-template-columns:1fr 1fr 1fr; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--org); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--org-d); cursor:pointer; }
  .chart{ width:100%; }
  /* KANBAN */
  .kb{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .kbcol{ background:#f4efec; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .kbcol>h4{ margin:0 0 10px; font-size:13px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:7px; }
  .kbcol>h4 .n{ margin-left:auto; background:#fff; border:1px solid var(--line); color:var(--muted); font-size:11px; border-radius:999px; padding:1px 8px; }
  .kbcol .dot{ width:8px; height:8px; border-radius:50%; }
  .kbcard{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .kbcard .t{ font-size:13px; font-weight:700; color:var(--ink); line-height:1.4; }
  .kbcard .m{ display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .pill{ font-size:10px; font-weight:800; border-radius:999px; padding:2px 8px; }
  .p-h{ background:#fee2e2; color:#dc2626; } .p-m{ background:#fef3c7; color:#b45309; } .p-l{ background:#dbeafe; color:#1d4ed8; }
  .tagc{ font-size:10px; font-weight:800; border-radius:6px; padding:2px 7px; background:#ffedd5; color:var(--org-d); }
  .av2{ width:22px; height:22px; border-radius:50%; color:#fff; display:grid; place-content:center; font-size:10px; font-weight:800; margin-left:auto; }
  .kbcard .due{ font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; } .kbcard .due .material-symbols-outlined{ font-size:14px; }
  /* GANTT / milestones */
  .gt{ overflow-x:auto; }
  .gt-head{ display:grid; grid-template-columns:150px repeat(8,1fr); border-bottom:2px solid var(--line); min-width:720px; }
  .gt-head div{ font-size:11px; font-weight:800; color:var(--muted); padding:7px 4px; text-align:center; } .gt-head div:first-child{ text-align:left; }
  .gt-row{ display:grid; grid-template-columns:150px 1fr; border-bottom:1px solid var(--line); min-width:720px; align-items:center; }
  .gt-lbl{ font-size:12px; font-weight:700; color:var(--ink); padding:11px 6px; }
  .gt-track{ position:relative; height:42px; background:repeating-linear-gradient(90deg,transparent,transparent calc(12.5% - 1px),#f2ede9 calc(12.5% - 1px),#f2ede9 12.5%); }
  .gt-bar{ position:absolute; top:9px; height:24px; border-radius:7px; display:flex; align-items:center; padding:0 9px; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; }
  .b-org{ background:linear-gradient(90deg,var(--org),var(--org2)); } .b-blue{ background:linear-gradient(90deg,#2563eb,#60a5fa); } .b-green{ background:linear-gradient(90deg,#059669,#34d399); } .b-gray{ background:linear-gradient(90deg,#78716c,#a8a29e); }
  .gt-now{ position:absolute; top:-4px; bottom:0; width:2px; background:var(--red); z-index:2; }
  .gt-ms{ position:absolute; top:4px; width:16px; height:16px; background:#fff; border:3px solid var(--org); transform:rotate(45deg); z-index:3; }
  /* timeline */
  .tl{ position:relative; padding-left:26px; }
  .tl::before{ content:""; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tli{ position:relative; padding:0 0 18px; }
  .tli::before{ content:""; position:absolute; left:-22px; top:3px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--org); }
  .tli.done::before{ background:var(--green); border-color:var(--green); } .tli.now::before{ background:var(--org); box-shadow:0 0 0 4px #ffedd5; }
  .tli b{ font-size:13px; color:var(--ink); } .tli .dt{ font-size:11px; color:var(--muted); } .tli p{ margin:3px 0 0; font-size:12px; color:var(--body); }
  /* knowledge */
  .doc{ display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--line); align-items:flex-start; } .doc:first-of-type{ border-top:0; }
  .doc-ic{ width:38px; height:38px; border-radius:10px; display:grid; place-content:center; flex:none; } .doc-ic .material-symbols-outlined{ font-size:20px; }
  .di-1{ background:#ffedd5; color:var(--org-d); } .di-2{ background:#dbeafe; color:#1d4ed8; } .di-3{ background:#dcfce7; color:#166534; } .di-4{ background:#f3e8ff; color:#7c3aed; }
  .doc .t{ font-size:13px; font-weight:700; color:var(--ink); } .doc .mt{ font-size:11px; color:var(--muted); margin-top:3px; }
  .doc .mt b{ color:var(--body); }
  .folders{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fold{ background:#f4efec; border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; align-items:center; gap:10px; }
  .fold .material-symbols-outlined{ color:var(--org); } .fold b{ font-size:13px; color:var(--ink); display:block; } .fold small{ font-size:11px; color:var(--muted); }
  .srch{ display:flex; align-items:center; gap:8px; background:#f4efec; border:1px solid var(--line); border-radius:11px; padding:9px 13px; margin-bottom:14px; }
  .srch .material-symbols-outlined{ color:var(--muted); } .srch input{ border:0; background:none; font:inherit; font-size:13px; flex:1; outline:none; color:var(--body); }
  /* AI agent chat */
  .chat{ display:flex; flex-direction:column; gap:14px; }
  .msg{ display:flex; gap:11px; align-items:flex-start; } .msg.r{ flex-direction:row-reverse; }
  .msg .ab{ width:32px; height:32px; border-radius:10px; display:grid; place-content:center; flex:none; color:#fff; }
  .msg .ai{ background:linear-gradient(135deg,var(--org),var(--org2)); } .msg .usr{ background:#78716c; }
  .msg .bub{ max-width:78%; background:#f4efec; border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-size:13px; line-height:1.6; color:var(--body); }
  .msg.r .bub{ background:linear-gradient(135deg,#fff7ed,#ffedd5); border-color:#fed7aa; }
  .msg .bub b{ color:var(--ink); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip{ font-size:12px; font-weight:700; background:#fff; border:1px solid var(--org2); color:var(--org-d); border-radius:999px; padding:6px 12px; cursor:pointer; }
  .todo{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:13px; } .todo:first-of-type{ border-top:0; }
  .cbx{ width:18px; height:18px; border-radius:5px; border:2px solid var(--org); flex:none; display:grid; place-content:center; } .cbx.on{ background:var(--org); border-color:var(--org); } .cbx.on .material-symbols-outlined{ color:#fff; font-size:14px; }
  .todo .who{ margin-left:auto; font-size:11px; color:var(--muted); }
  /* automation flow */
  .flow{ display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 0; }
  .fnode{ background:#fff; border:2px solid var(--line); border-radius:14px; padding:13px 15px; min-width:150px; flex:none; }
  .fnode.on{ border-color:var(--org); box-shadow:0 6px 16px rgba(234,88,12,.14); }
  .fnode .fic{ width:32px; height:32px; border-radius:9px; background:#ffedd5; color:var(--org-d); display:grid; place-content:center; margin-bottom:8px; } .fnode .fic .material-symbols-outlined{ font-size:19px; }
  .fnode b{ font-size:13px; color:var(--ink); display:block; } .fnode small{ font-size:11px; color:var(--muted); }
  .farrow{ display:flex; align-items:center; color:var(--org2); flex:none; padding:0 4px; } .farrow .material-symbols-outlined{ font-size:26px; }
  .rule{ display:flex; gap:11px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start; } .rule:first-of-type{ border-top:0; }
  .rule-n{ width:28px; height:28px; border-radius:8px; background:var(--org); color:#fff; display:grid; place-content:center; font-weight:800; font-size:13px; flex:none; }
  .rule p{ margin:0; font-size:13px; line-height:1.5; } .rule b{ color:var(--ink); }
  .approve{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fafafa; }
  .approve .st{ width:30px; height:30px; border-radius:50%; display:grid; place-content:center; flex:none; } .approve .st .material-symbols-outlined{ font-size:18px; color:#fff; }
  .s-ok{ background:var(--green); } .s-wait{ background:var(--amber); } .s-idle{ background:#d6d3d1; }
  .approve b{ font-size:13px; color:var(--ink); } .approve small{ font-size:11px; color:var(--muted); display:block; }
  .approve .tm{ margin-left:auto; font-size:11px; color:var(--muted); }
  /* table */
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:#faf7f5; white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:#faf7f5; }
  .bar{ height:7px; border-radius:999px; background:#ece7e3; overflow:hidden; } .bar span{ display:block; height:100%; background:var(--org); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; }
  .t-on{ background:#dcfce7; color:#166534; } .t-risk{ background:#fef3c7; color:#92400e; } .t-late{ background:#fee2e2; color:#991b1b; }
  /* report cards */
  .mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .mini2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .mini2>*{ min-width:0; }
  .load{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .load:first-of-type{ border-top:0; }
  .load .av3{ width:34px; height:34px; border-radius:50%; color:#fff; display:grid; place-content:center; font-weight:800; font-size:12px; flex:none; }
  .load b{ font-size:13px; color:var(--ink); } .load small{ font-size:11px; color:var(--muted); }
  .load .barwrap{ flex:1; min-width:60px; } .load .pct{ font-size:13px; font-weight:800; color:var(--ink); width:44px; text-align:right; }
  .note{ font-size:12px; color:var(--muted); line-height:1.7; margin-top:10px; }
  @media (max-width:860px){
    .shell{ grid-template-columns:1fr; }
    .side{ position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px; }
    .brand{ padding:4px 8px; } .side .cat{ display:none; } .side .sp{ margin:0; } .side .me{ border:0; margin:0; padding:4px; }
    .side button{ width:auto; flex:none; white-space:nowrap; }
  }
  @media (max-width:820px){
    .body{ padding:16px 14px 32px; }
    .kpis{ grid-template-columns:1fr 1fr; }
    .g2,.g21,.g12,.g3{ grid-template-columns:1fr; }
    .kb{ grid-template-columns:1fr 1fr; }
    .folders{ grid-template-columns:1fr; }
    .mini,.mini2{ grid-template-columns:1fr; }
  }
  @media (max-width:560px){
    .side .btxt{ display:none; } .side button{ padding:10px; }
    .kpis{ grid-template-columns:1fr; } .kb{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">任務看板</h1><div class="sub">力晶協作 · AI 協作工作台 · 產品開發團隊</div></div>
      <div class="r">
        <span class="live"><span class="dot"></span>12 位成員在線</span>
        <div class="ico"><span class="material-symbols-outlined">notifications</span></div>
        <div class="ico"><span class="material-symbols-outlined">search</span></div>
      </div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MODS=[
  ["view_kanban","任務看板"],
  ["account_tree","專案里程碑"],
  ["menu_book","知識庫"],
  ["smart_toy","AI 代理人"],
  ["rule_settings","流程自動化"],
  ["insights","工作報表"]
];
const DESC=[
  "跨欄位拖拉任務、指派負責人、追蹤優先度與截止日",
  "專案時間軸、里程碑與交付甘特一覽",
  "文件、會議筆記與全文檢索的團隊知識庫",
  "摘要、待辦擷取與草稿生成的智慧助理",
  "表單簽核流程與觸發規則設計器",
  "團隊產能、負載與準時率的營運洞察"
];
const ppl={王:"#ea580c",黃:"#2563eb",李:"#16a34a",陳:"#7c3aed",吳:"#db2777",林:"#0891b2",張:"#b45309",劉:"#0d9488"};
const avc=n=>ppl[n[0]]||"#78716c";

/* ---------- SCREEN 0: KANBAN ---------- */
const KB=[
  ["待辦","#94a3b8",[
    ["新版登入頁 A/B 測試設計","王思婷","07/28","h","設計"],
    ["整合第三方金流 SDK","李冠廷","08/02","m","後端"],
    ["客服知識庫內容盤點","陳雅琪","07/30","l","內容"]]],
  ["進行中","#ea580c",[
    ["行動端推播通知模組","黃彥霖","07/25","h","前端"],
    ["訂單匯出報表優化","張哲瑋","07/26","m","後端"]]],
  ["審查中","#2563eb",[
    ["會員中心 UI 改版","吳心妤","07/24","h","設計"],
    ["API 速率限制文件","劉承恩","07/27","l","文件"]]],
  ["已完成","#16a34a",[
    ["首頁效能優化","林郁婷","07/22","m","前端"],
    ["資料庫索引重建","王思婷","07/21","h","DBA"]]]
];
const priCls=p=>p==="h"?"p-h":p==="m"?"p-m":"p-l";
const priTx=p=>p==="h"?"高":p==="m"?"中":"低";
function kanbanHtml(){
  return `<div style="overflow-x:auto;"><div class="kb">`+KB.map(col=>`
    <div class="kbcol">
      <h4><span class="dot" style="background:${col[1]};"></span>${col[0]}<span class="n">${col[2].length}</span></h4>
