<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>企業AI文件與專案協作台｜Jvision 系統 Demo</title>
<meta name="description" content="任務、專案、知識到流程自動化的企業 AI 文件與專案協作台（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#2563EB;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --green:#15803D;
  --amber:#A16207;
  --red:#B91C1C;
  --purple:#7C3AED;
  --radius:14px;
  --ease:180ms ease;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Plus Jakarta Sans","Microsoft JhengHei",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button,[data-i],.chip,.grow{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.mono,.dt,.due,.tm,.pct,.kpi .v,.tbl td:nth-child(n+2){
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  font-family:"Plus Jakarta Sans",ui-monospace,SFMono-Regular,Consolas,monospace;
}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:5px;
  padding:18px 14px;
  background:#CCFBF1;
  border-right:2px solid var(--color-primary);
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand .lg{
  width:42px;height:42px;flex:none;display:grid;place-items:center;
  color:#fff;background:var(--color-primary);border:2px solid var(--ink);
  border-radius:12px;
}
.brand b{display:block;color:var(--ink);font-size:14px;line-height:1.25}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.side .cat{
  padding:10px 11px 5px;color:var(--muted);font-size:10px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;
}
.side button{
  width:100%;min-height:44px;display:flex;align-items:center;gap:11px;
  padding:10px 12px;border:1px solid transparent;border-radius:11px;
  background:transparent;color:var(--ink);text-align:left;font-weight:600;
  transition:background var(--ease),color var(--ease),border-color var(--ease);
}
.side button:hover{background:#fff;border-color:var(--line)}
.side button.on{
  background:var(--color-primary);color:#fff;border-color:var(--ink);
}
.side button .material-symbols-outlined{font-size:21px}
.btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{margin-top:auto}
.me{
  display:flex;align-items:center;gap:10px;margin-top:10px;padding:14px 8px 3px;
  border-top:1px solid var(--color-primary);
}
.me .av{width:34px;height:34px;border-radius:10px}
.me b{display:block;color:var(--ink);font-size:12px}
.me small{color:var(--muted);font-size:10px}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  min-height:72px;padding:12px 28px;background:#fff;
  border-bottom:1px solid var(--line);
}
.top h1{margin:0;color:var(--ink);font-size:18px;line-height:1.25}
.top .sub{margin-top:3px;color:var(--muted);font-size:11px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.live{
  display:inline-flex;align-items:center;gap:7px;padding:6px 10px;
  color:#115E59;background:#CCFBF1;border:1px solid var(--color-primary);
  border-radius:999px;font-size:11px;font-weight:700;
}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--color-primary)}
.ico{
  width:38px;height:38px;display:grid;place-items:center;padding:0;
  background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;
}
.body{min-width:0;max-width:1540px;margin:auto;padding:25px 28px 48px}
.vh{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:20px;
}
.vh h2{margin:0;color:var(--ink);font-size:24px;letter-spacing:-.02em}
.vh p{max-width:720px;margin:5px 0 0;color:var(--muted);font-size:12px}
.btn{
  min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:0 16px;border:2px solid var(--ink);border-radius:10px;
  background:var(--color-accent);color:#111827;font-weight:700;
  transition:background var(--ease),color var(--ease),transform var(--ease);
}
.btn:hover{background:#C2410C;color:#fff}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--color-primary)}
.btn.ghost:hover{background:#CCFBF1;color:var(--ink)}
.btn .material-symbols-outlined{font-size:19px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
.card,.kpi{
  background:var(--color-card);color:var(--color-card-foreground);
  border:1px solid var(--line);border-radius:var(--radius);
}
.card{padding:19px 20px}
.card>h3{
  display:flex;align-items:center;gap:8px;margin:0 0 16px;
  color:var(--ink);font-size:15px;line-height:1.4;
}
.card>h3 .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.card>h3 .grow{margin-left:auto;color:#9A3412;font-size:12px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{position:relative;padding:16px 17px;border-top:4px solid var(--color-primary)}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:700}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .v{margin-top:7px;color:var(--ink);font-size:27px;font-weight:700;line-height:1.2}
.kpi .v small{color:var(--muted);font:600 12px "Plus Jakarta Sans",sans-serif}
.kpi .d{margin-top:7px;font-size:11px;font-weight:700}
.up{color:#166534}.dn{color:#991B1B}
.chart{width:100%}
.kb{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:13px}
.kbcol{min-width:0;padding:12px;background:var(--color-muted);border:1px solid #CBD5E1;border-radius:12px}
.kbcol>h4{display:flex;align-items:center;gap:7px;margin:0 0 11px;color:var(--ink);font-size:12px}
.kbcol>h4 .n{
  margin-left:auto;padding:1px 8px;background:#fff;color:var(--muted);
  border:1px solid #CBD5E1;border-radius:999px;font-size:10px;
}
.kbcol .dot{width:9px;height:9px;border-radius:3px}
.kbcard{margin-bottom:9px;padding:11px;background:#fff;border:1px solid #CBD5E1;border-radius:10px}
.kbcard:last-child{margin-bottom:0}
.kbcard .t{color:var(--ink);font-size:12px;font-weight:700;line-height:1.5}
.kbcard .m{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.pill,.tag,.tagc{display:inline-flex;align-items:center;border-radius:999px;font-size:10px;font-weight:700}
.pill,.tagc{padding:3px 8px}
.p-h{background:#FEE2E2;color:#991B1B}.p-m{background:#FEF3C7;color:#92400E}.p-l{background:#DBEAFE;color:#1E40AF}
.tagc{background:#CCFBF1;color:#115E59;border:1px solid var(--color-secondary)}
.av2,.av3{
  display:grid;place-items:center;flex:none;color:#fff;font-weight:700;
  border:1px solid rgba(0,0,0,.2);
}
.av2{width:24px;height:24px;margin-left:auto;border-radius:7px;font-size:9px}
.kbcard .due{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:10px}
.kbcard .due .material-symbols-outlined{font-size:14px}
.gt{overflow-x:auto}
.gt-head{display:grid;grid-template-columns:150px repeat(8,1fr);min-width:720px;border-bottom:2px solid var(--color-primary)}
.gt-head div{padding:7px 4px;color:var(--muted);font-size:10px;font-weight:700;text-align:center}
.gt-head div:first-child{text-align:left}
.gt-row{display:grid;grid-template-columns:150px 1fr;min-width:720px;align-items:center;border-bottom:1px solid var(--line)}
.gt-lbl{padding:11px 6px;color:var(--ink);font-size:11px;font-weight:700}
.gt-track{
  position:relative;height:42px;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),#CCFBF1 calc(12.5% - 1px),#CCFBF1 12.5%);
}
.gt-bar{
  position:absolute;top:9px;height:24px;display:flex;align-items:center;
  padding:0 9px;overflow:hidden;border:1px solid rgba(0,0,0,.22);
  border-radius:6px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap;
}
.b-org{background:var(--color-accent)}.b-blue{background:var(--blue)}
.b-green{background:#15803D}.b-gray{background:#475569}
.gt-now{position:absolute;top:-4px;bottom:0;z-index:2;width:2px;background:var(--red)}
.gt-ms{position:absolute;top:4px;z-index:3;width:16px;height:16px;background:#fff;border:3px solid var(--color-accent);transform:rotate(45deg)}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding-bottom:19px}
.tli:before{content:"";position:absolute;left:-24px;top:3px;width:13px;height:13px;background:#fff;border:3px solid #64748B;border-radius:50%}
.tli.done:before{content:"✓";display:grid;place-items:center;width:17px;height:17px;left:-26px;top:1px;background:var(--green);border:0;color:#fff;font-size:10px}
.tli.now:before{content:"";background:var(--color-accent);border-color:#9A3412}
.tli b{color:var(--ink);font-size:12px}.tli .dt{color:var(--muted);font-size:10px}
.tli p{margin:3px 0 0;color:var(--color-foreground);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:10px 11px;background:var(--color-muted);border-bottom:2px solid var(--color-primary);
  color:var(--ink);font-size:10px;font-weight:700;text-align:left;white-space:nowrap;
}
.tbl td{padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:hover td{background:#F0FDFA}
.tbl th:nth-child(n+2),.tbl td:nth-child(n+2){text-align:right}
.tag{padding:3px 9px}
.t-on{background:#DCFCE7;color:#166534}.t-risk{background:#FEF3C7;color:#92400E}.t-late{background:#FEE2E2;color:#991B1B}
.note{margin-top:11px;color:var(--muted);font-size:11px;line-height:1.7}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fold{display:flex;align-items:center;gap:10px;padding:12px;background:var(--color-muted);border:1px solid #CBD5E1;border-radius:10px}
.fold .material-symbols-outlined{color:var(--color-primary)}
.fold b{display:block;color:var(--ink);font-size:12px}.fold small{color:var(--muted);font-size:10px}
.srch{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:9px 12px;background:var(--color-muted);border:1px solid #CBD5E1;border-radius:10px}
.srch input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px}
.srch .material-symbols-outlined{color:var(--muted)}
.doc{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc-ic{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:9px}
.di-1{background:#FFEDD5;color:#9A3412}.di-2{background:#DBEAFE;color:#1E40AF}
.di-3{background:#DCFCE7;color:#166534}.di-4{background:#F3E8FF;color:#6B21A8}
.doc .t{color:var(--ink);font-size:12px;font-weight:700}.doc .mt{margin-top:3px;color:var(--muted);font-size:10px}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;align-items:flex-start;gap:10px}.msg.r{flex-direction:row-reverse}
.msg .ab{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:9px;color:#fff;font-size:11px}
.msg .ai{background:var(--color-primary)}.msg .usr{background:#475569}
.msg .bub{max-width:80%;padding:11px 13px;background:var(--color-muted);border:1px solid #CBD5E1;border-radius:12px;color:var(--color-foreground);font-size:12px;line-height:1.7}
.msg.r .bub{background:#FFF7ED;border-color:#FDBA74}.msg .bub b{color:var(--ink)}
.todo{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:11px}
.todo:first-of-type{border-top:0}
.cbx{width:18px;height:18px;display:grid;place-items:center;flex:none;border:2px solid var(--color-primary);border-radius:4px}
.cbx.on{background:var(--color-primary)}.cbx.on .material-symbols-outlined{color:#fff;font-size:13px}
.todo .who{margin-left:auto;color:var(--muted);font-size:10px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 11px;background:#fff;border:1px solid var(--color-primary);border-radius:999px;color:#115E59;font-size:11px;font-weight:700;transition:background var(--ease)}
.chip:hover{background:#CCFBF1}
.flow{display:flex;align-items:stretch;overflow-x:auto;padding:5px 0}
.fnode{min-width:150px;flex:none;padding:13px;background:#fff;border:2px solid #CBD5E1;border-radius:11px}
.fnode.on{border-color:var(--color-primary);background:#F0FDFA}
.fnode .fic{width:33px;height:33px;display:grid;place-items:center;margin-bottom:8px;background:#CCFBF1;color:#115E59;border-radius:8px}
.fnode b{display:block;color:var(--ink);font-size:12px}.fnode small{color:var(--muted);font-size:10px}
.farrow{display:flex;align-items:center;flex:none;padding:0 5px;color:var(--color-primary)}
.rule{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}.rule-n{width:28px;height:28px;display:grid;place-items:center;flex:none;background:var(--color-primary);border-radius:7px;color:#fff;font-weight:700}
.rule p{margin:0;font-size:12px}.rule b{color:var(--ink)}
.approve{display:flex;align-items:center;gap:11px;margin-bottom:9px;padding:11px 12px;background:var(--color-muted);border:1px solid #CBD5E1;border-radius:10px}
.approve .st{width:31px;height:31px;display:grid;place-items:center;flex:none;border-radius:8px}
.approve .st .material-symbols-outlined{color:#fff;font-size:18px}
.s-ok{background:var(--green)}.s-wait{background:var(--amber)}.s-idle{background:#475569}
.approve b{color:var(--ink);font-size:12px}.approve small{display:block;color:var(--muted);font-size:10px}
.approve .tm{margin-left:auto;color:var(--muted);font-size:10px;text-align:right}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.load{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.load:first-of-type{border-top:0}.av3{width:35px;height:35px;border-radius:9px;font-size:10px}
.load b{display:block;color:var(--ink);font-size:12px}.load small{display:block;color:var(--muted);font-size:10px}
.barwrap{min-width:60px;flex:1}.bar{height:8px;overflow:hidden;background:#E2E8F0;border-radius:999px}
.bar span{display:block;height:100%;background:var(--color-primary)}
.pct{width:45px;color:var(--ink);font-size:12px;font-weight:700;text-align:right}
.grid-item{animation:reveal .4s cubic-bezier(.34,1.35,.64,1) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .shell{grid-template-columns:205px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}
  .side{position:sticky;z-index:30;width:100%;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:9px;border-right:0;border-bottom:2px solid var(--color-primary)}
  .brand{padding:0 6px}.brand .lg{width:38px;height:38px}.brand .btxt,.side .cat,.side .sp,.side .me{display:none}
  .side button{width:auto;flex:none;padding:9px 10px}.side button .btxt{display:block}
  .top{position:static;padding:12px 16px}.top .sub{display:none}
  .body{padding:20px 15px 36px}
  .g2{grid-template-columns:1fr}.kb{grid-template-columns:repeat(2,minmax(210px,1fr))}
}
@media(max-width:560px){
  .side button .btxt{display:none}
  .top{min-height:62px}.top .live{display:none}.top h1{font-size:16px}
  .vh h2{font-size:21px}.kpis,.mini2,.folders{grid-template-columns:1fr}
  .kb{grid-template-columns:1fr}.card{padding:16px}
  .msg .bub{max-width:86%}.todo{align-items:flex-start;flex-wrap:wrap}.todo .who{width:100%;margin-left:27px;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="主要導覽"></aside>
  <main class="main">
    <header class="top">
      <div><h1 id="vt">任務看板</h1><div class="sub">力晶協作 · 企業AI文件與專案協作台 · 產品開發團隊</div></div>
      <div class="r">
        <span class="live"><span class="dot" aria-hidden="true"></span>12 位成員在線</span>
        <button class="ico" aria-label="通知"><span class="material-symbols-outlined">notifications</span></button>
        <button class="ico" aria-label="搜尋"><span class="material-symbols-outlined">search</span></button>
      </div>
    </header>
    <div class="body" id="view"></div>
  </main>
</div>
<script>
const MODS=[
  ["view_kanban","任務看板"],["account_tree","專案里程碑"],["menu_book","知識庫"],
  ["smart_toy","AI 代理人"],["rule_settings","流程自動化"],["insights","工作報表"]
];
const DESC=[
  "跨欄位拖拉任務、指派負責人、追蹤優先度與截止日",
  "專案時間軸、里程碑與交付甘特一覽",
  "文件、會議筆記與全文檢索的團隊知識庫",
  "摘要、待辦擷取與草稿生成的智慧助理",
  "表單簽核流程與觸發規則設計器",
  "團隊產能、負載與準時率的營運洞察"
];
const ppl={王:"#0D9488",黃:"#2563EB",李:"#15803D",陳:"#7C3AED",吳:"#BE185D",林:"#0E7490",張:"#A16207",劉:"#115E59"};
