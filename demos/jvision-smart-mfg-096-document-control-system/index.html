<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>文件管制系統 Document Control System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#9333ea;--accent2:#c084fc;--accent-soft:#f5edff;
  --ink:#1e1633;--muted:#6b6486;--line:#e9e2f5;--bg:#f6f3fb;--card:#ffffff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;font-size:20px}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:linear-gradient(170deg,#2a1345,#4a1d7a);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand .logo .material-symbols-outlined{background:var(--accent2);color:#3a0d63;border-radius:9px;padding:6px;font-size:22px}
.brand .sub{font-size:12px;color:var(--accent2);margin-top:8px;letter-spacing:.5px}
.nav{padding:12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;color:#e6dbf7;padding:11px 13px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:#fff;color:var(--accent)}
.nav .idx{margin-left:auto;font-size:11px;opacity:.55;font-weight:700}
.side-foot{margin-top:auto;padding:16px 18px;font-size:11px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.1)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.topbar h1{font-size:18px;font-weight:800}
.topbar .crumb{font-size:12px;color:var(--muted);font-weight:600}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.wrap{padding:22px 26px;max-width:1500px;width:100%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;background:var(--accent-soft);border-radius:50%}
.kpi .kl{font-size:12.5px;color:var(--muted);font-weight:600;position:relative}
.kpi .kv{font-size:26px;font-weight:800;margin-top:6px;position:relative}
.kpi .kd{font-size:12px;font-weight:700;margin-top:4px;position:relative}
.kpi .material-symbols-outlined{color:var(--accent);position:relative}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.panel h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.chartbox{overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#faf8fd}
tbody tr:hover{background:#faf7fe}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.t-ok{background:#e7f6ec;color:var(--ok)}.t-warn{background:#fdf0dd;color:var(--warn)}.t-bad{background:#fbe6e6;color:var(--bad)}.t-info{background:#e6effd;color:var(--info)}.t-mut{background:#efeaf7;color:var(--muted)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-top:4px}
.listcol{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.listcol .lh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.searchbar{padding:10px 14px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-family:inherit;font-size:13px;background:#faf8fd}
.doclist{overflow:auto;max-height:560px}
.docitem{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;border-left:3px solid transparent}
.docitem:hover{background:#faf7fe}
.docitem.on{background:var(--accent-soft);border-left-color:var(--accent)}
.docitem .di-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.docitem .di-no{font-size:12px;font-weight:800;color:var(--accent);font-family:"Inter"}
.docitem .di-title{font-size:13.5px;font-weight:700;margin-top:3px}
.docitem .di-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.detailcol{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.dethead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.dethead .dh-no{font-size:12px;font-weight:800;color:var(--accent)}
.dethead h2{font-size:18px;font-weight:800;margin-top:3px}
.detmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.dm{background:#faf8fd;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.dm .l{font-size:11px;color:var(--muted);font-weight:600}
.dm .v{font-size:14px;font-weight:800;margin-top:4px}
.sect-t{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px}
.flowrow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.fstep{flex:1;min-width:150px;background:#faf8fd;border:1px solid var(--line);border-radius:13px;padding:14px;margin-right:26px;position:relative}
.fstep:last-child{margin-right:0}
.fstep::after{content:"chevron_right";font-family:'Material Symbols Outlined';position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--accent2);font-size:22px}
.fstep:last-child::after{display:none}
.fstep .fs-role{font-size:11px;color:var(--muted);font-weight:700}
.fstep .fs-name{font-size:13.5px;font-weight:800;margin:4px 0}
.fstep.done{background:#e7f6ec;border-color:#bfe5cb}
.fstep.cur{background:var(--accent-soft);border-color:var(--accent2)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col{background:#faf8fd;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col .ch{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.col .ch .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;border-top:3px solid var(--accent2)}
.tk .tk-no{font-size:11px;font-weight:800;color:var(--accent)}
.tk .tk-t{font-size:12.5px;font-weight:700;margin:4px 0}
.tk .tk-m{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlnode{position:relative;padding:0 0 20px 8px}
.tlnode::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tlnode.old::before{background:#c9c1dc;box-shadow:0 0 0 2px var(--line)}
.tlnode .tv{font-size:13px;font-weight:800}
.tlnode .tm{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.tlnode .tx{font-size:12.5px;color:#453a5f;background:#faf8fd;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diffcol{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.diffcol .dch{padding:9px 12px;font-size:12px;font-weight:800;background:#faf8fd;border-bottom:1px solid var(--line)}
.diffline{padding:7px 12px;font-size:12px;border-bottom:1px solid var(--line);font-family:"Inter"}
.diff-add{background:#e7f6ec}.diff-del{background:#fbe6e6;text-decoration:line-through;color:#a13}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.rev-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cell{background:#faf8fd;border:1px solid var(--line);border-radius:10px;min-height:74px;padding:7px;font-size:11px}
.cell .d{font-weight:800;color:var(--muted)}
.cell .ev{margin-top:5px;border-radius:6px;padding:2px 5px;font-size:10.5px;font-weight:700;line-height:1.3}
.ev-due{background:#fdf0dd;color:var(--warn)}.ev-over{background:#fbe6e6;color:var(--bad)}.ev-ok{background:#e7f6ec;color:var(--ok)}
.cell.dim{opacity:.4}
.audititem{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.audititem .ico{flex:0 0 38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.audititem .abody{flex:1;min-width:0}
.audititem .at{font-size:13px;font-weight:700}
.audititem .am{font-size:11.5px;color:var(--muted);margin-top:2px}
.audititem .atime{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:6px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}.detmeta{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.split{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}.diff{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap;overflow:visible}
  .nav button{width:auto}
  .nav .idx{display:none}
  .side-foot{display:none}
}
@media(max-width:820px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2b{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span.lbl{display:none}
  .cards{grid-template-columns:1fr}
  .detmeta{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .wrap{padding:16px 14px}
  .topbar{padding:14px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">description</span><span>文件管制系統</span></div>
      <div class="sub">DOCUMENT CONTROL · QMS</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">ISO 9001 受控文件平台<br/>版本正確率 · 複審準時率</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb">品質管理 / 文件管制</div>
        <h1 id="ttl">文件庫</h1>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span> 受控狀態即時同步</span>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}
var base={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:'Inter,Noto Sans TC,sans-serif',toolbar:{show:false}}};
var ACC='#9333ea',ACC2='#c084fc';

var MODS=[
 {icon:'description',name:'文件庫',desc:'受控文件版本與生效狀態管理'},
 {icon:'fact_check',name:'簽核流程',desc:'起草、審核、核准電子簽核路由'},
 {icon:'account_tree',name:'版本履歷',desc:'版次變更與差異對照追溯'},
 {icon:'receipt_long',name:'分發簽收',desc:'發行分發與現場閱讀簽收追蹤'},
 {icon:'calendar_month',name:'定期複審',desc:'到期複審排程與逾期提醒'},
 {icon:'gavel',name:'稽核軌跡',desc:'全生命週期操作紀錄與合規稽核'}
];

var DOCS=[
 {no:'QP-01-05',title:'文件與紀錄管制程序',cat:'程序書',ver:'C.3',stat:'生效中',owner:'品保部 陳志明',eff:'2026-05-12',rev:'2028-05-11',dept:'全公司',pages:14,dist:32,ack:32},
 {no:'WI-CNC-217',title:'CNC 加工首件檢驗作業指導書',cat:'作業指導書',ver:'B.1',stat:'審核中',owner:'製造一課 林佩儀',eff:'—',rev:'—',dept:'製造一課',pages:6,dist:0,ack:0},
 {no:'SOP-QC-088',title:'進料檢驗抽樣標準作業程序',cat:'標準程序',ver:'D.0',stat:'生效中',owner:'品管課 王大維',eff:'2026-03-01',rev:'2026-09-01',dept:'品管課',pages:9,dist:18,ack:16},
 {no:'FM-PR-140',title:'不合格品處置單',cat:'表單',ver:'A.4',stat:'生效中',owner:'品保部 陳志明',eff:'2025-11-20',rev:'2027-11-19',dept:'全公司',pages:2,dist:45,ack:45},
 {no:'WI-ASM-303',title:'PCBA 組裝防呆作業指導書',cat:'作業指導書',ver:'C.0',stat:'複審中',owner:'製造二課 張淑芬',eff:'2024-08-15',rev:'2026-08-14',dept:'製造二課',pages:11,dist:24,ack:21},
 {no:'QM-00-01',title:'品質手冊',cat:'手冊',ver:'F.2',stat:'生效中',owner:'管理代表 黃品瑄',eff:'2026-01-02',rev:'2029-01-01',dept:'全公司',pages:48,dist:12,ack:12},
 {no:'SOP-WH-051',title:'成品入出庫先進先出程序',cat:'標準程序',ver:'B.3',stat:'草稿',owner:'倉管課 吳俊賢',eff:'—',rev:'—',dept:'倉管課',pages:5,dist:0,ack:0},
 {no:'WI-PNT-119',title:'噴塗前處理與烘烤參數指導書',cat:'作業指導書',ver:'A.2',stat:'生效中',owner:'表處課 蔡明宏',eff:'2025-09-30',rev:'2026-09-29',dept:'表處課',pages:7,dist:15,ack:14}
];
function statTag(s){var m={'生效中':'t-ok','審核中':'t-info','複審中':'t-warn','草稿':'t-mut'};return '<span class="tag '+(m[s]||'t-mut')+'">'+s+'</span>';}

// SCREEN 0 : 文件庫 (split workspace)
function s0(){
  var kpi=[
    {l:'受控文件總數',v:'1,284',d:'較上季 +38',c:'up',i:'description'},
    {l:'現行生效版本',v:'1,197',d:'93.2% 為最新版',c:'up',i:'verified'},
    {l:'待簽核 / 草稿',v:'52',d:'審核中 31 · 草稿 21',c:'flat',i:'fact_check'},
    {l:'現場版本正確率',v:'98.6%',d:'目標 99%',c:'up',i:'task_alt'}
  ];
  var html='<div class="cards">'+kpi.map(function(k){return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined" style="font-size:18px">'+k.i+'</span> '+k.l+'</div><div class="kv">'+k.v+'</div><div class="kd '+k.c+'">'+k.d+'</div></div>';}).join('')+'</div>';
  html+='<div class="split">';
  html+='<div class="listcol"><div class="lh"><span class="material-symbols-outlined" style="color:var(--accent)">folder_open</span> 受控文件清單</div>'
      +'<div class="searchbar"><input placeholder="搜尋文件編號 / 名稱…"/></div><div class="doclist" id="doclist">';
  html+=DOCS.map(function(d,i){return '<div class="docitem'+(i===0?' on':'')+'" data-doc="'+i+'"><div class="di-top"><span class="di-no">'+d.no+'</span>'+statTag(d.stat)+'</div>'
      +'<div class="di-title">'+d.title+'</div><div class="di-meta"><span>版次 '+d.ver+'</span><span>'+d.cat+'</span><span>'+d.dept+'</span></div></div>';}).join('');
  html+='</div></div>';
  html+='<div class="detailcol" id="docdetail"></div>';
  html+='</div>';
  html+='<div class="hint"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">touch_app</span> 左側點選文件，右側即時載入版本、簽核與分發資訊（雙欄工作台）。</div>';
  document.getElementById('view').innerHTML=html;
  void document.getElementById('view').offsetHeight;
  function renderDetail(idx){
    var d=DOCS[idx];if(!d)return;
    var h='<div class="dethead"><div style="flex:1;min-width:0"><div class="dh-no">'+d.no+' · 版次 '+d.ver+'</div><h2>'+d.title+'</h2></div>'+statTag(d.stat)+'</div>';
    h+='<div class="detmeta">'
      +'<div class="dm"><div class="l">文件類別</div><div class="v">'+d.cat+'</div></div>'
      +'<div class="dm"><div class="l">負責單位</div><div class="v" style="font-size:13px">'+d.owner+'</div></div>'
      +'<div class="dm"><div class="l">生效日期</div><div class="v">'+d.eff+'</div></div>'
      +'<div class="dm"><div class="l">下次複審</div><div class="v">'+d.rev+'</div></div></div>';
    h+='<div class="sect-t">分發簽收進度</div>';
    var pct=d.dist?Math.round(d.ack/d.dist*100):0;
    h+='<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">已簽收 '+d.ack+' / 分發 '+d.dist+' 份　('+pct+'%)</div>';
    h+='<div class="bar"><span style="width:'+pct+'%"></span></div>';
    h+='<div class="sect-t">適用範圍</div><div style="font-size:13px;color:#453a5f">適用單位：'+d.dept+'　頁數：'+d.pages+' 頁　文件格式：受控 PDF（浮水印）</div>';
    h+='<div class="chartbox" style="margin-top:8px"><div id="c0mini"></div></div>';
    document.getElementById('docdetail').innerHTML=h;
    void document.getElementById('docdetail').offsetHeight;
    for(var j=charts.length-1;j>=0;j--){if(charts[j]._dcMini){try{charts[j].destroy();}catch(e){}charts.splice(j,1);}}
    var el=document.getElementById('c0mini');
    if(el){try{var c=new ApexCharts(el,Object.assign({},base,{
      chart:Object.assign({},base.chart,{type:'bar',height:130}),
      series:[{name:'份數',data:[d.dist,d.ack,Math.max(d.dist-d.ack,0)]}],

var SCR=[s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  i=Math.max(0,Math.min(i,SCR.length-1));
  var nb=document.querySelectorAll('#nav [data-i]');
  for(var k=0;k<nb.length;k++)nb[k].classList.toggle('on',+nb[k].getAttribute('data-i')===i);
  document.getElementById('ttl').textContent=MODS[i].name;
  document.getElementById('crumb').textContent='品質管理 / 文件管制 / '+MODS[i].name;
  SCR[i](i);
}
(function(){
  var nav=document.getElementById('nav');
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>';}).join('');
  nav.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;var n=+b.getAttribute('data-i');location.hash='v'+n;show(n);});
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
