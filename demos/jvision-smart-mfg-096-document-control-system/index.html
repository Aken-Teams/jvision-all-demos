<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件管制系統 Document Control System</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#a84800;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --radius:8px;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button,[data-doc]{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.mono,.kv,.di-no,.dh-no,.dm .v,td.num,td.code,.atime,.fs-time{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:20}
.brand{padding:24px 22px 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;letter-spacing:.01em}
.logo-mark{display:grid;place-items:center;width:38px;height:38px;background:var(--blue);color:#fff;border-radius:7px}
.brand .sub{margin-top:10px;color:var(--muted);font:500 10px/1.4 "Fira Code",monospace;letter-spacing:.12em}
.nav{padding:18px 12px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.nav button{width:100%;min-height:44px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:11px;padding:10px 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);text-align:left;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{background:var(--color-muted);color:var(--ink);transform:translateX(2px)}
.nav button.on{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.nav .idx{font:600 10px "Fira Code",monospace;color:#64748b}
.side-foot{margin-top:auto;padding:17px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;min-height:76px;padding:14px clamp(16px,3vw,34px);display:flex;align-items:center;gap:18px;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topbar h1{margin:2px 0 0;font-size:20px;line-height:1.25;letter-spacing:-.02em}
.crumb{color:var(--muted);font:500 11px "Fira Code",monospace}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;background:#ecfdf3;border:1px solid #bbf7d0;border-radius:999px;color:#166534;font-size:12px;font-weight:600;white-space:nowrap}
.wrap{width:100%;max-width:1480px;margin:0 auto;padding:26px clamp(14px,3vw,34px) 54px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
.eyebrow{margin:0 0 5px;color:var(--blue);font:600 11px "Fira Code",monospace;letter-spacing:.1em;text-transform:uppercase}
.view-head h2{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.18;letter-spacing:-.035em}
.view-head p{max-width:620px;margin:7px 0 0;color:var(--muted);font-size:13px}
.primary-action{min-height:42px;padding:9px 15px;border:1px solid #c2410c;border-radius:7px;background:var(--color-accent);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(194,65,12,.18);transition:transform .2s,box-shadow .2s,background .2s}
.primary-action:hover{background:#c2410c;transform:translateY(-1px);box-shadow:0 7px 18px rgba(194,65,12,.24)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.kpi,.panel,.listcol,.detailcol{background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{position:relative;padding:17px 18px;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
.kpi:hover{border-color:#bfdbfe;transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.09)}
.kl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.kl .material-symbols-outlined{color:var(--blue)}
.kv{margin-top:9px;font-size:25px;font-weight:700;line-height:1.2;letter-spacing:-.04em}
.kd{margin-top:6px;font-size:11.5px;font-weight:600}
.up{color:#166534}.down{color:#991b1b}.flat{color:var(--muted)}
.panel{padding:18px}
.panel h3{display:flex;align-items:center;gap:9px;margin:0 0 15px;font-size:14px}
.panel h3 .material-symbols-outlined,.lh .material-symbols-outlined{color:var(--blue)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-top:15px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f1f5f9;color:#334155;text-align:left;font-size:11px;font-weight:700;letter-spacing:.035em}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:#f8fafc}
td.num{text-align:right}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.tag:before{font-family:"Material Symbols Outlined";font-size:13px}
.t-ok{background:#f0fdf4;color:#166534}.t-ok:before{content:"check_circle"}
.t-warn{background:#fff7ed;color:#9a3412}.t-warn:before{content:"schedule"}
.t-bad{background:#fef2f2;color:#991b1b}.t-bad:before{content:"error"}
.t-info{background:#eff6ff;color:#1d4ed8}.t-info:before{content:"pending"}
.t-mut{background:#f1f5f9;color:#475569}.t-mut:before{content:"draft"}
.t-acc{background:#fff7ed;color:#9a3412}.t-acc:before{content:"rate_review"}
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:15px;margin-top:15px}
.listcol{overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.searchbar{padding:11px 13px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;height:40px;padding:8px 11px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:var(--ink)}
.searchbar input:hover{border-color:#94a3b8}
.doclist{max-height:570px;overflow:auto}
.docitem{padding:13px 15px;border-bottom:1px solid var(--line);border-left:3px solid transparent;transition:background .2s,border-color .2s}
.docitem:hover{background:#f8fafc}
.docitem.on{background:#eff6ff;border-left-color:var(--blue)}
.di-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.di-no,.dh-no{color:#1d4ed8;font-size:11.5px;font-weight:700}
.di-title{margin-top:5px;font-size:13px;font-weight:700}
.di-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:5px;color:var(--muted);font-size:11px}
.detailcol{padding:20px}
.dethead{display:flex;align-items:flex-start;gap:15px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dethead h2{margin:4px 0 0;font-size:19px;line-height:1.35}
.detmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.dm{padding:11px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:6px}
.dm .l{color:var(--muted);font-size:10.5px;font-weight:600}
.dm .v{margin-top:4px;font-size:12.5px;font-weight:700}
.sect-t{margin:19px 0 9px;color:#334155;font:700 11px "Fira Code",monospace;letter-spacing:.06em;text-transform:uppercase}
.bar{height:8px;overflow:hidden;background:#e2e8f0;border-radius:2px}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:2px}
.hint{display:flex;align-items:center;gap:7px;margin-top:13px;color:var(--muted);font-size:11.5px}
.hint .material-symbols-outlined{color:var(--blue)}
.flowrow{display:flex;align-items:stretch;overflow:auto;padding:3px 2px 8px}
.fstep{position:relative;flex:1;min-width:154px;margin-right:28px;padding:13px;background:#f8fafc;border:1px solid var(--line);border-radius:6px}
.fstep:after{content:"chevron_right";position:absolute;right:-26px;top:50%;transform:translateY(-50%);color:#64748b;font-family:"Material Symbols Outlined";font-size:20px}
.fstep:last-child{margin-right:0}.fstep:last-child:after{display:none}
.fstep.done{background:#f0fdf4;border-color:#86efac}
.fstep.cur{background:#eff6ff;border-color:#60a5fa;box-shadow:inset 3px 0 var(--blue)}
.fs-role{color:var(--muted);font-size:10.5px;font-weight:700}
.fs-name{margin:4px 0;font-size:12.5px;font-weight:700}
.fs-time{color:var(--muted);font-size:10px}
.comment{margin-bottom:9px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:0 6px 6px 0}
.comment-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.comment-text{margin-top:5px;color:#334155;font-size:12px}
.comment-time{margin-top:4px;color:var(--muted);font:400 10px "Fira Code",monospace}
.timeline{position:relative;padding-left:27px}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:8px;width:1px;background:#cbd5e1}
.tlnode{position:relative;padding:0 0 20px 7px}
.tlnode:before{content:"";position:absolute;left:-25px;top:3px;width:11px;height:11px;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--blue);border-radius:50%}
.tlnode.old:before{background:#94a3b8;box-shadow:0 0 0 2px #cbd5e1}
.tv{font:700 12px "Fira Code",monospace}.tm{margin:3px 0 6px;color:var(--muted);font-size:10.5px}
.tx{padding:9px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;color:#334155;font-size:12px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diffcol{overflow:hidden;border:1px solid var(--line);border-radius:6px}
.dch{padding:9px 11px;background:#f1f5f9;border-bottom:1px solid var(--line);font:700 11px "Fira Code",monospace}
.diffline{padding:7px 11px;border-bottom:1px solid var(--line);font:400 11px "Fira Code",monospace}
.diffline:last-child{border:0}.diff-add{background:#f0fdf4;border-left:3px solid #15803d}.diff-del{background:#fef2f2;border-left:3px solid #dc2626;text-decoration:line-through}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;min-width:570px}
.wd{padding:4px;text-align:center;color:var(--muted);font-size:10.5px;font-weight:700}
.cell{min-height:76px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:10.5px}
.cell .d{color:var(--muted);font:700 10px "Fira Code",monospace}
.cell.dim{background:#f8fafc;opacity:.55}
.ev{margin-top:6px;padding:4px 5px;border-left:3px solid;border-radius:3px;font-weight:600;line-height:1.3}
.ev-ok{background:#f0fdf4;color:#166534;border-color:#15803d}
.ev-due{background:#fff7ed;color:#9a3412;border-color:#ea580c}
.ev-over{background:#fef2f2;color:#991b1b;border-color:#dc2626}
.rev-legend{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:12px;color:var(--muted);font-size:11.5px;font-weight:600}
.legend-icon{font-size:15px;margin-right:3px}
.audititem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.audititem:last-child{border-bottom:0}
.ico{flex:0 0 36px;height:36px;display:grid;place-items:center;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;color:#1d4ed8}
.ico.warn{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.abody{flex:1}.at{font-size:12.5px;font-weight:700}.am{margin-top:3px;color:var(--muted);font-size:10.5px}
.atime{color:var(--muted);font-size:10px;white-space:nowrap}
.chartbox{overflow:hidden}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1120px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.detmeta{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;width:100%;height:auto}.brand{padding:15px 16px}.nav{flex-direction:row;padding:9px;overflow:auto}.nav button{width:auto;min-width:max-content;grid-template-columns:22px auto}.nav .idx{display:none}.side-foot{display:none}.topbar{top:0}.split{grid-template-columns:1fr}.doclist{max-height:350px}}
@media(max-width:720px){.grid2b,.diff{grid-template-columns:1fr}.view-head{align-items:flex-start;flex-direction:column}.primary-action{width:100%}.topbar .pill{display:none}}
@media(max-width:520px){.cards{grid-template-columns:1fr}.detmeta{grid-template-columns:1fr 1fr}.wrap{padding-top:18px}.topbar{min-height:66px}.nav button{padding:9px}.nav .lbl{font-size:12px}.kpi{padding:15px}.detailcol,.panel{padding:15px}.audititem{flex-wrap:wrap}.atime{margin-left:48px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{animation:none;opacity:1;transform:none}
  .kpi:hover,.primary-action:hover,.nav button:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="logo-mark material-symbols-outlined">description</span><span>企業文件版本管制系統</span></div>
      <div class="sub">DOCUMENT CONTROL · QMS</div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">ISO 9001 受控文件平台<br>版本正確率 · 複審準時率</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">品質管理 / 文件管制</div>
        <h1 id="ttl">文件庫</h1>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined">verified</span>受控狀態即時同步</span>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
var BLUE="#2563eb",SECONDARY="#3b82f6",ORANGE="#ea580c";
var MODS=[
 {icon:"description",name:"文件庫",desc:"受控文件版本與生效狀態管理"},
 {icon:"fact_check",name:"簽核流程",desc:"起草、審核、核准電子簽核路由"},
 {icon:"account_tree",name:"版本履歷",desc:"版次變更與差異對照追溯"},
 {icon:"receipt_long",name:"分發簽收",desc:"發行分發與現場閱讀簽收追蹤"},
 {icon:"calendar_month",name:"定期複審",desc:"到期複審排程與逾期提醒"},
 {icon:"gavel",name:"稽核軌跡",desc:"全生命週期操作紀錄與合規稽核"}
];
var DOCS=[
 {no:"QP-01-05",title:"文件與紀錄管制程序",cat:"程序書",ver:"C.3",stat:"生效中",owner:"品保部 陳志明",eff:"2026-05-12",rev:"2028-05-11",dept:"全公司",pages:14,dist:32,ack:32},
 {no:"WI-CNC-217",title:"CNC 加工首件檢驗作業指導書",cat:"作業指導書",ver:"B.1",stat:"審核中",owner:"製造一課 林佩儀",eff:"—",rev:"—",dept:"製造一課",pages:6,dist:0,ack:0},
 {no:"SOP-QC-088",title:"進料檢驗抽樣標準作業程序",cat:"標準程序",ver:"D.0",stat:"生效中",owner:"品管課 王大維",eff:"2026-03-01",rev:"2026-09-01",dept:"品管課",pages:9,dist:18,ack:16},
 {no:"FM-PR-140",title:"不合格品處置單",cat:"表單",ver:"A.4",stat:"生效中",owner:"品保部 陳志明",eff:"2025-11-20",rev:"2027-11-19",dept:"全公司",pages:2,dist:45,ack:45},
 {no:"WI-ASM-303",title:"PCBA 組裝防呆作業指導書",cat:"作業指導書",ver:"C.0",stat:"複審中",owner:"製造二課 張淑芬",eff:"2024-08-15",rev:"2026-08-14",dept:"製造二課",pages:11,dist:24,ack:21},
 {no:"QM-00-01",title:"品質手冊",cat:"手冊",ver:"F.2",stat:"生效中",owner:"管理代表 黃品瑄",eff:"2026-01-02",rev:"2029-01-01",dept:"全公司",pages:48,dist:12,ack:12},
 {no:"SOP-WH-051",title:"成品入出庫先進先出程序",cat:"標準程序",ver:"B.3",stat:"草稿",owner:"倉管課 吳俊賢",eff:"—",rev:"—",dept:"倉管課",pages:5,dist:0,ack:0},
 {no:"WI-PNT-119",title:"噴塗前處理與烘烤參數指導書",cat:"作業指導書",ver:"A.2",stat:"生效中",owner:"表處課 蔡明宏",eff:"2025-09-30",rev:"2026-09-29",dept:"表處課",pages:7,dist:15,ack:14}
];
var base={
 chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:"Fira Sans,sans-serif",toolbar:{show:false},foreColor:"#475569"},
 grid:{borderColor:"#e2e8f0",strokeDashArray:4},
 tooltip:{theme:"light"}
};
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}}
function icon(i){return '<span class="material-symbols-outlined">'+i+"</span>"}
function statTag(s){var m={"生效中":"t-ok","審核中":"t-info","複審中":"t-warn","草稿":"t-mut"};return '<span class="tag '+(m[s]||"t-mut")+'">'+s+"</span>"}
function head(i,cta){return '<div class="view-head reveal"><div><p class="eyebrow">QUALITY MANAGEMENT SYSTEM · 0'+(i+1)+'</p><h2>'+MODS[i].name+'</h2><p>'+MODS[i].desc+'，確保文件版本、責任、時效與操作紀錄皆可追溯。</p></div>'+(cta?'<button class="primary-action" type="button">'+icon("add")+' '+cta+"</button>":"")+"</div>"}
function cards(a){return '<div class="cards reveal">'+a.map(function(k){return '<article class="kpi"><div class="kl">'+icon(k.i)+k.l+'</div><div class="kv">'+k.v+'</div><div class="kd '+k.c+'">'+k.d+"</div></article>"}).join("")+"</div>"}
