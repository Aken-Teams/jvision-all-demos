.kpi,.stat{position:relative;overflow:hidden}.kpi:before,.tile:before{content:"";display:block;width:32px;height:3px;background:var(--accent);position:absolute;top:0;left:18px}.kpi .ico,.tile .ti{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;background:#ecfdf5;color:#047857}.kpi .lbl,.stat .lbl{font-size:12px;color:var(--muted);margin-top:12px;font-weight:600}.kpi .val,.stat .val,.tile .tv{font:600 25px "Poppins";letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .val small,.stat .val small{font-size:12px;color:var(--muted)}.kpi .delta,.stat .d{font-size:11px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}.delta.up,.d.up{color:var(--ok)}.delta.down,.d.down{color:var(--bad)}.delta.flat,.d.flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th{background:var(--th);color:#334155;text-align:left;font-size:11px;font-weight:700;letter-spacing:.35px;padding:11px 14px;border-bottom:1px solid #cbd5e1;white-space:nowrap}td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}td:nth-child(n+5){text-align:right}tbody tr{transition:background .2s}tbody tr:hover{background:#f8fafc}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid currentColor}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.t-ok{background:#ecfdf5;color:#047857}.t-warn{background:#fffbeb;color:#92400e}.t-bad{background:#fef2f2;color:#b91c1c}.t-info,.t-gray{background:#f1f5f9;color:#334155}.t-acc,.t-pink{background:#ecfdf5;color:#047857}
.bar,.gauge .track{height:7px;background:var(--track);overflow:hidden}.bar>i,.gauge .track i{display:block;height:100%;background:var(--accent)}.prog{display:flex;align-items:center;gap:8px}.prog small,.gauge small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.tl{position:relative;padding-left:25px}.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}.tl-item,.tl-i{position:relative;padding-bottom:17px}.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent)}.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}.tl-time,.tl-t{font:600 11px ui-monospace,monospace;color:var(--muted)}.tl-item b,.tl-i b{display:block;font-size:13px;margin:2px 0}.tl-item p,.tl-i p{margin:0;font-size:12px;color:var(--muted)}

.rep-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line)}.rep-row .sku{flex:1}.rep-row .sku span{font-size:11px;color:var(--muted)}.gauge{width:110px}.band{position:relative;height:26px;background:var(--track);min-width:150px}.band .rng{position:absolute;inset-block:0;background:#d1fae5}.band .mid{position:absolute;inset-block:-3px;width:2px;background:var(--muted)}.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent)}
.tile{display:flex;flex-direction:column;gap:8px;position:relative}.tile b{font-size:14px}.tile p{margin:0;font-size:12px;color:var(--muted)}.who{display:inline-flex;align-items:center;gap:6px}.dl{display:grid;grid-template-columns:136px 1fr;gap:10px 18px}.dl dt{color:var(--muted);font-size:12px;font-weight:600}.dl dd{margin:0}
@media(min-width:1080px){#screen{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}#screen>*{grid-column:1;margin-top:0!important}#screen>.grid.g4:first-child{grid-column:2;grid-row:1/span 99;display:flex;flex-direction:column;gap:12px;position:sticky;top:18px}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">inventory_2</span></div>

    <div class="side-foot">2026 年度<br/>保稅料件 2,408 項<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>

      </div>

        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>

    </div>

</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

/* ── 圖表（曲線與圓角為變化點）── */
var AX={style:{colors:"#77819f",fontSize:"11px"}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};
var CURVE="smooth", BR=5;
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function _h(x,d){return typeof x==="number"?(x>0&&x<20?Math.round(d*x):x):d}
function mkArea(el,data,cats,name,x){push(el,{chart:Object.assign({},CB,{type:"area",height:_h(x,230)}),series:[{name:name,data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e9ecf7",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:3},colors:[typeof x==="string"?x:"#1e40af"],
 fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.38,opacityTo:.04,stops:[0,90]}},tooltip:{theme:"light"}})}
function mkBar(el,cats,data,name,horiz,a6,a7){
 var color=typeof a6==="string"?a6:"#1e40af", min=typeof a6==="number"?a6:undefined, h=_h(a7,230);
 push(el,{chart:Object.assign({},CB,{type:"bar",height:h}),series:[{name:name||"數值",data:data}],
 xaxis:{categories:cats,labels:AX},yaxis:{min:min,labels:{style:AX.style}},grid:{borderColor:"#e9ecf7",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR,horizontal:!!horiz,columnWidth:"54%",barHeight:"60%"}},
 colors:[color],tooltip:{theme:"light"}})}
function mkStack(el,cats,series,horiz,h){push(el,{chart:Object.assign({},CB,{type:"bar",height:_h(h,245),stacked:true}),series:series,
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e9ecf7",strokeDashArray:4},
 dataLabels:{enabled:false},plotOptions:{bar:{borderRadius:BR?3:0,horizontal:!!horiz,columnWidth:"55%",barHeight:"62%"}},
 legend:{position:"bottom",fontSize:"11.5px"},colors:["#1e40af","#7f9ff0","#b2c5f6","#162e7e","#c5cdea","#0e1f54"],tooltip:{theme:"light"}})}
function mkDonut(el,labels,data,h){push(el,{chart:Object.assign({},CB,{type:"donut",height:_h(h,240)}),series:data,labels:labels,
 colors:["#1e40af","#7f9ff0","#b2c5f6","#162e7e","#c5cdea","#0e1f54"],legend:{position:"bottom",fontSize:"11.5px"},dataLabels:{enabled:false},
 plotOptions:{pie:{donut:{size:BR?"64%":"52%"}}},stroke:{width:2},tooltip:{theme:"light"}})}
function mkRadar(el,cats,data,name,h){push(el,{chart:Object.assign({},CB,{type:"radar",height:_h(h,270)}),series:[{name:name||"分數",data:data}],
 xaxis:{categories:cats},yaxis:{show:false},colors:["#1e40af"],markers:{size:4},dataLabels:{enabled:false},tooltip:{theme:"light"}})}
function mkLine2(el,cats,s1,s2,h){push(el,{chart:Object.assign({},CB,{type:"line",height:_h(h,240)}),series:[s1,s2],
 xaxis:{categories:cats,labels:AX},yaxis:{labels:{style:AX.style}},grid:{borderColor:"#e9ecf7",strokeDashArray:4},
 dataLabels:{enabled:false},stroke:{curve:CURVE,width:[3,3],dashArray:[0,5]},colors:["#1e40af","#7f9ff0"],
 legend:{position:"top",fontSize:"11.5px"},tooltip:{theme:"light"}})}
function mkHeat(el,series,h){push(el,{chart:Object.assign({},CB,{type:"heatmap",height:_h(h,300)}),series:series,
 dataLabels:{enabled:false},xaxis:{labels:AX},yaxis:{labels:{style:AX.style}},
 legend:{position:"bottom",fontSize:"11px"},tooltip:{theme:"light"},stroke:{width:2,colors:["#fff"]}})}

/* ── 本系統內容 ── */

var MODULES=[
 {icon:"dashboard",name:"保稅總覽",sub:"保稅庫存金額、稅負與核銷進度"},
 {icon:"receipt_long",name:"料件核銷",sub:"進口料件的耗用申報與勾稽"},
 {icon:"menu_book",name:"帳冊與申報",sub:"保稅帳冊、報單與海關申報"},
 {icon:"policy",name:"稽核追蹤",sub:"海關查核、盤差與補稅風險"}
];
function tile(ic,t,v,p){return '<div class="tile"><div class="ti"><span class="material-symbols-outlined">'+ic+'</span></div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></div>'}
function v0(c){
 c.innerHTML=
 '<div class="grid g4">'+
  tile("inventory_2","保稅庫存金額","4.82 億","佔總庫存 62.4%")+
  tile("savings","暫免稅負","6,840 萬","關稅 + 營業稅")+
  tile("percent","核銷達成率","91.4%","目標 95%，缺口 3.6pt")+
  tile("warning","逾期未核銷","148 項","超過 2 年存倉期限")+

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
