<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>法令遵循管理系統（Compliance）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --accent-soft:#fce7f3;
  --ink:#1f1220; --muted:#7a6a74; --line:#f0dfe8; --bg:#faf5f8; --card:#ffffff;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#0284c7;
  --radius:16px; --shadow:0 4px 20px rgba(219,39,119,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-logo{
  width:40px;height:40px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(219,39,119,.35);
}
.brand-logo .msi{font-size:24px;}
.brand-txt{min-width:0;}
.brand-title{font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap;}
nav.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.navbtn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;
  transition:.15s;min-width:0;
}
.navbtn:hover{background:var(--accent-soft);color:var(--accent);}
.navbtn.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(219,39,119,.3);}
.navbtn .msi{font-size:19px;}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px;min-width:0;}
.scr-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.scr-ic{
  width:48px;height:48px;border-radius:13px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.scr-ic .msi{font-size:27px;}
.scr-h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.3px;}
.scr-desc{font-size:13px;color:var(--muted);margin:2px 0 0;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pill .msi{font-size:14px;}
.p-ok{background:#dcfce7;color:var(--ok);}
.p-warn{background:#fef3c7;color:#b45309;}
.p-bad{background:#fee2e2;color:var(--bad);}
.p-info{background:#e0f2fe;color:var(--info);}
.p-muted{background:#f1eef0;color:var(--muted);}
.p-accent{background:var(--accent-soft);color:var(--accent);}
.grid{display:grid;gap:16px;min-width:0;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-sb{grid-template-columns:1.5fr 1fr;}
.g-bs{grid-template-columns:1fr 1.6fr;}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr;}
  .g-2,.g-3,.g-sb,.g-bs{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0;}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.card-h .msi{font-size:20px;color:var(--accent);}
.card-t{font-size:15px;font-weight:700;margin:0;}
.card-sub{font-size:12px;color:var(--muted);margin-left:auto;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi-lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi-lab .msi{font-size:17px;color:var(--accent);}
.kpi-val{font-size:27px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px;}
.kpi-val small{font-size:13px;font-weight:600;color:var(--muted);}
.kpi-delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.kpi-delta .msi{font-size:14px;}
.up{color:var(--ok);} .down{color:var(--bad);}
.chart{width:100%;overflow:hidden;}
.chart.h260{height:260px;} .chart.h300{height:300px;} .chart.h220{height:220px;}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{background:#fbeef5;color:#8a3564;text-align:left;font-weight:700;padding:10px 12px;white-space:nowrap;font-size:12px;}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:#fdf3f8;}
.mono{font-family:"Inter",monospace;font-size:12px;color:var(--muted);}
.bar-mini{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px;}
.bar-mini > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.board{grid-template-columns:1fr;}}
.col{background:#fbf6f9;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:10px;color:#8a3564;}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.03);}
.tk:last-child{margin-bottom:0;}
.tk b{font-size:13px;display:block;} .tk .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
.tl-item.done .tl-dot{background:var(--ok);}
.tl-item.now .tl-dot{background:var(--warn);}
.tl-t{font-size:14px;font-weight:700;}
.tl-m{font-size:12px;color:var(--muted);margin-top:2px;}
.tl-time{font-size:11px;color:var(--accent);font-weight:600;}
.selfrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);min-width:0;flex-wrap:wrap;}
.selfrow:first-child{border-top:none;}
.selfrow .nm{min-width:120px;flex:1;font-weight:600;font-size:13px;}
.prog{flex:2;min-width:120px;}
.prog .bar{height:10px;border-radius:8px;background:var(--line);overflow:hidden;}
.prog .bar > i{display:block;height:100%;border-radius:8px;}
.riskgrid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;min-width:420px;}
.riskgrid .rh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px;}
.riskgrid .rl{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;padding:0 6px;}
.rc{border-radius:8px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.note{background:#fbf6f9;border:1px dashed var(--accent2);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:14px;}
.note .msi{color:var(--accent);font-size:18px;flex:none;}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);}
@media(max-width:560px){.hidenav-lab{display:none;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo"><span class="msi">gavel</span></div>
      <div class="brand-txt">
        <div class="brand-title">法令遵循管理系統</div>
        <div class="brand-sub">Compliance Management Platform</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>

<script>
"use strict";
var NAV=[
  {ic:"gavel",label:"法規資料庫"},
  {ic:"checklist",label:"合規檢核清單"},
  {ic:"shield",label:"出口管制篩查"},
  {ic:"warning",label:"違規通報"},
  {ic:"task_alt",label:"矯正措施"},
  {ic:"fact_check",label:"稽核複查"}
];
var navEl=document.getElementById("nav");
NAV.forEach(function(n,i){
  var b=document.createElement("button");
  b.className="navbtn";b.setAttribute("data-i",String(i));
  b.innerHTML='<span class="msi">'+n.ic+'</span><span class="hidenav-lab">'+n.label+'</span>';
  b.addEventListener("click",function(){location.hash="v"+i;});
  navEl.appendChild(b);
});
var app=document.getElementById("app");
var charts=[];
function disposeCharts(){
  for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}
  charts=[];
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
window.addEventListener("resize",function(){
  for(var k=0;k<charts.length;k++){try{charts[k].resize();}catch(e){}}
});
var ACC="#db2777",ACC2="#f472b6",MUT="#7a6a74";
var FOOT='<div class="foot">法令遵循管理系統（Compliance）· 純 UI 展示，資料皆為擬真示範 · 無後端服務</div>';

function head(ic,title,desc,pill){
  return '<div class="scr-head"><div class="scr-ic"><span class="msi">'+ic+'</span></div>'+
    '<div style="flex:1;min-width:0"><h1 class="scr-h1">'+title+'</h1><p class="scr-desc">'+desc+'</p></div>'+
    (pill||'')+'</div>';
}
function kpi(lab,ic,val,unit,delta,dir){
  return '<div class="kpi"><div class="kpi-lab"><span class="msi">'+ic+'</span>'+lab+'</div>'+
    '<div class="kpi-val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (delta?'<div class="kpi-delta '+dir+'"><span class="msi">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div>':'')+'</div>';
}
function tlItem(cls,time,t,m){
  return '<div class="tl-item '+cls+'"><div class="tl-dot"></div>'+
    '<div class="tl-time">'+time+'</div><div class="tl-t">'+t+'</div><div class="tl-m">'+m+'</div></div>';
}

/* ===== SCREEN 0 : 法規資料庫 ===== */
function s0(){
  var regs=[
    {code:"REG-EU-2023/1542",nm:"歐盟電池法規（Battery Regulation）",area:"歐盟",ver:"v3.2",upd:"2026-07-28",st:"已生效",cls:"p-bad"},
    {code:"REG-US-EAR-744",nm:"美國出口管理條例 EAR 744",area:"美國",ver:"v5.1",upd:"2026-08-05",st:"異動待評估",cls:"p-warn"},
    {code:"REG-TW-勞基-32",nm:"勞動基準法第32條 工時規範",area:"台灣",ver:"v2.0",upd:"2026-06-11",st:"已生效",cls:"p-ok"},
    {code:"REG-CN-數安-21",nm:"中國數據安全法 第21條",area:"中國",ver:"v1.4",upd:"2026-07-19",st:"異動待評估",cls:"p-warn"},
    {code:"REG-EU-GDPR-33",nm:"GDPR 第33條 資料外洩通報",area:"歐盟",ver:"v4.0",upd:"2026-05-30",st:"已生效",cls:"p-ok"},
    {code:"REG-TW-個資-27",nm:"個人資料保護法第27條",area:"台灣",ver:"v2.3",upd:"2026-08-01",st:"新增草案",cls:"p-info"}
  ];
  var rows=regs.map(function(r){
    return '<tr><td><span class="mono">'+r.code+'</span></td><td>'+r.nm+'</td>'+
      '<td><span class="pill p-accent">'+r.area+'</span></td><td class="mono">'+r.ver+'</td>'+
      '<td class="mono">'+r.upd+'</td><td><span class="pill '+r.cls+'">'+r.st+'</span></td></tr>';
  }).join('');
  var html=head("gavel","法規資料庫與異動追蹤","集中管理各國適用法規條文，即時追蹤法規異動與適用範圍",
      '<span class="pill p-accent"><span class="msi">sync</span>本月異動 5 筆</span>');
  html+='<div class="grid g-kpi" style="margin-bottom:16px">'+
    kpi("納管法規","gavel","248","條","+12 本季","up")+
    kpi("本月異動","history","5","筆","2 待評估","down")+
    kpi("適用地區","account_tree","7","國/區","覆蓋主要市場","up")+
    kpi("待評估異動","warning","2","筆","需 3 日內處理","down")+
  '</div>';
  html+='<div class="grid g-sb" style="margin-bottom:16px">';
  html+='<div class="card"><div class="card-h"><span class="msi">table_view</span><h3 class="card-t">法規清單與異動狀態</h3><span class="card-sub">依更新時間排序</span></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>法規編號</th><th>法規名稱</th><th>地區</th><th>版本</th><th>最近異動</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  html+='<div class="card"><div class="card-h"><span class="msi">donut_large</span><h3 class="card-t">各地區法規分布</h3></div><div id="c0a" class="chart h260"></div></div>';
  html+='</div>';
  html+='<div class="card"><div class="card-h"><span class="msi">history</span><h3 class="card-t">近期法規異動時間軸</h3></div>'+
    '<div class="tl">'+
      tlItem("done","2026-08-05","EAR 744 受管制實體名單新增 12 家","出口管制篩查規則已排入更新佇列")+
      tlItem("now","2026-08-01","個資法第27條 修正草案公告","法務部評估對現行合規檢核之影響")+
      tlItem("done","2026-07-28","歐盟電池法規 v3.2 正式生效","碳足跡揭露要求納入年度自評項目")+
      tlItem("done","2026-07-19","中國數據安全法第21條 施行細則更新","跨境傳輸章節新增檢核點")+
    '</div></div>';
  app.innerHTML=html+FOOT;
  void app.offsetHeight;
  mkChart("c0a",{
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{color:MUT,fontSize:11}},
    series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],
      itemStyle:{borderRadius:6,borderColor:"#fff",borderWidth:2},
      label:{show:false},
      data:[
        {value:78,name:"台灣",itemStyle:{color:ACC}},
        {value:64,name:"歐盟",itemStyle:{color:ACC2}},
        {value:52,name:"美國",itemStyle:{color:"#fbbfd8"}},
        {value:34,name:"中國",itemStyle:{color:"#c026a1"}},
        {value:20,name:"其他",itemStyle:{color:"#f9d6e6"}}
      ]}]
  });
}

/* ===== SCREEN 1 : 合規檢核清單 ===== */
function s1(){
  var items=[
    {c:"CHK-001",nm:"工時與加班紀錄符合勞基法",dept:"人資部",due:"2026-08-20",st:"符合",cls:"p-ok",v:100},
    {c:"CHK-002",nm:"個資蒐集告知書齊備",dept:"法務部",due:"2026-08-18",st:"缺失",cls:"p-bad",v:45},
    {c:"CHK-003",nm:"供應商反貪腐聲明簽署",dept:"採購部",due:"2026-08-25",st:"進行中",cls:"p-warn",v:70},
    {c:"CHK-004",nm:"出口貨品分類號複核",dept:"貿易部",due:"2026-08-15",st:"符合",cls:"p-ok",v:100},
    {c:"CHK-005",nm:"資安事件通報流程演練",dept:"資訊部",due:"2026-08-30",st:"進行中",cls:"p-warn",v:55},
    {c:"CHK-006",nm:"碳足跡揭露資料完整",dept:"永續部",due:"2026-09-05",st:"缺失",cls:"p-bad",v:30}
  ];
  var rows=items.map(function(x){
    return '<tr><td class="mono">'+x.c+'</td><td>'+x.nm+'</td><td>'+x.dept+'</td>'+
      '<td class="mono">'+x.due+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar-mini"><i style="width:'+x.v+'%"></i></div><span class="mono">'+x.v+'%</span></div></td>'+
      '<td><span class="pill '+x.cls+'">'+x.st+'</span></td></tr>';
  }).join('');
  var html=head("checklist","合規檢核清單與定期自評","依適用法規設計檢核項目，指派責任部門並追蹤自評完成度",
      '<span class="pill p-warn"><span class="msi">pending</span>2 項缺失待改善</span>');
  html+='<div class="grid g-kpi" style="margin-bottom:16px">'+
    kpi("檢核項目","checklist","42","項","覆蓋 7 部門","up")+
    kpi("符合率","verified","78","%","目標 90%","up")+
    kpi("缺失項目","warning","6","項","2 項高風險","down")+
    kpi("本期到期","calendar_month","11","項","3 日內 3 項","down")+
  '</div>';
  html+='<div class="grid g-bs" style="margin-bottom:16px">';
  html+='<div class="card"><div class="card-h"><span class="msi">radar</span><h3 class="card-t">各領域自評成熟度</h3></div><div id="c1a" class="chart h300"></div></div>';
  html+='<div class="card"><div class="card-h"><span class="msi">fact_check</span><h3 class="card-t">檢核項目與自評進度</h3><span class="card-sub">依到期日</span></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>編號</th><th>檢核項目</th><th>責任部門</th><th>到期</th><th>自評進度</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  html+='</div>';
  html+='<div class="card"><div class="card-h"><span class="msi">groups</span><h3 class="card-t">各部門自評完成度</h3></div><div id="c1b" class="chart h260"></div></div>';
  app.innerHTML=html+FOOT;
  void app.offsetHeight;
  mkChart("c1a",{
    tooltip:{},
    radar:{indicator:[
      {name:"勞動法遵",max:100},{name:"個資保護",max:100},{name:"出口管制",max:100},
      {name:"反貪腐",max:100},{name:"資安",max:100},{name:"環境永續",max:100}

function riskMatrix(){
  var dests=["低風險國","一般管制","高度管制","禁運國"];
  var levels=["一般品項","雙用途","高敏感"];
  var data=[
    [42,18,6,0],
    [24,11,4,1],
    [9,5,3,2]
  ];
  function color(dest,lv){
    var score=dest+lv;
    if(score>=4)return "#dc2626";
    if(score>=2)return "#f59e0b";
    return "#16a34a";
  }
  var h='<div style="overflow-x:auto"><div class="riskgrid">';
  h+='<div class="rh"></div>';
  dests.forEach(function(d){h+='<div class="rh">'+d+'</div>';});
  for(var r=0;r<levels.length;r++){
    h+='<div class="rl">'+levels[r]+'</div>';
    for(var c=0;c<dests.length;c++){
      h+='<div class="rc" style="background:'+color(c,r)+'">'+data[r][c]+'</div>';
    }
  }
  h+='</div></div>';
  return h;
}
