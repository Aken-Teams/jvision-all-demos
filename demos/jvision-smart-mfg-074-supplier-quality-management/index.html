<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SQM 供應商品質管理</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--pk:#db2777;--pk2:#f472b6;--bg:#fbf5f9;--card:#ffffff;--ink:#3d1f33;--mut:#8a6b7e;--line:#f2dde9;--ok:#059669;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
header.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#9d174d,#db2777);color:#fff;box-shadow:0 2px 14px rgba(219,39,119,.25);}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px 6px;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff;}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.5px;}
.brand small{display:block;font-size:11px;font-weight:400;color:#ffd9ec;margin-top:2px;}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px;}
nav button{flex:none;white-space:nowrap;min-width:0;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#ffe3f1;font-family:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;transition:.15s;}
nav button .material-symbols-outlined{font-size:19px;}
nav button:hover{background:rgba(255,255,255,.22);color:#fff;}
nav button.on{background:#fff;color:#be185d;box-shadow:0 3px 10px rgba(0,0,0,.15);}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px;}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.scr-head h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;}
.scr-head h2 .material-symbols-outlined{color:var(--pk);font-size:26px;}
.scr-head p{font-size:13px;color:var(--mut);margin-top:4px;}
.tag{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;background:#fce7f3;color:#be185d;white-space:nowrap;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
.min0>*{min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--pk);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;position:relative;overflow:hidden;}
.kpi .ic{width:40px;height:40px;border-radius:11px;background:#fce7f3;color:var(--pk);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.kpi .ic .material-symbols-outlined{font-size:22px;}
.kpi .val{font-size:27px;font-weight:800;line-height:1;}
.kpi .lab{font-size:12px;color:var(--mut);margin-top:6px;}
.kpi .dl{font-size:11px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:2px;}
.up{color:var(--ok);}.dn{color:var(--bad);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.p-ok{background:#dcfce7;color:#166534;}
.p-warn{background:#fef3c7;color:#92400e;}
.p-bad{background:#fee2e2;color:#991b1b;}
.p-info{background:#e0e7ff;color:#3730a3;}
.p-pk{background:#fce7f3;color:#be185d;}
.grade{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex:none;}
.gA{background:#059669;}.gB{background:#0891b2;}.gC{background:#d97706;}.gD{background:#dc2626;}
.bar{height:7px;border-radius:6px;background:#f2dde9;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pk2),var(--pk));}
.chart{width:100%;height:280px;min-width:0;}
.chart.sm{height:230px;}
.chart.lg{height:320px;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.sub{font-size:12px;color:var(--mut);}
.audit-row{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;align-items:center;background:#fff;}
.audit-row .dt{text-align:center;flex:none;width:56px;background:#fce7f3;border-radius:10px;padding:7px 0;color:#be185d;}
.audit-row .dt b{display:block;font-size:18px;line-height:1;}
.audit-row .dt span{font-size:10px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0;}
.cal .h{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0;}
.cal .d{min-height:52px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px;position:relative;background:#fff;min-width:0;}
.cal .d .n{font-weight:700;color:var(--mut);}
.cal .d.ev{border-color:var(--pk2);background:#fdf2f8;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 0;}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--pk);border:2px solid #fff;box-shadow:0 0 0 2px var(--pk2);}
.tl-item.done::before{background:var(--ok);box-shadow:0 0 0 2px #a7f3d0;}
.tl-item .tt{font-weight:700;font-size:13px;}
.tl-item .td{font-size:12px;color:var(--mut);margin-top:2px;}
.tl-item .tm{font-size:11px;color:var(--pk);font-weight:600;}
.scard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;min-width:0;}
.scard .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.scard .nm{font-weight:800;font-size:15px;}
.big-score{font-size:34px;font-weight:800;color:var(--pk);line-height:1;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.rank{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;}
.rank .no{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fce7f3;color:#be185d;flex:none;}
.rank.top1 .no{background:var(--pk);color:#fff;}
.stat-strip{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;background:#fdf2f8;color:#be185d;border:1px solid #f9d7e8;}
@media(max-width:820px){
 .g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr;}
 .chart{height:250px;}
}
@media(max-width:560px){
 nav button span.txt{display:none;}
 nav button{padding:9px 11px;}
 .brand h1{font-size:15px;}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">verified</span></div>
    <div>
      <h1>SQM 供應商品質管理</h1>
      <small>Supplier Quality Management · 建檔 · 稽核 · IQC · SCAR · 計分卡</small>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main><div id="view"></div></main>

<script>
"use strict";
var MODS=[
 {icon:"badge",name:"供應商建檔"},
 {icon:"fact_check",name:"稽核排程"},
 {icon:"biotech",name:"進料 IQC"},
 {icon:"build_circle",name:"SCAR 改善"},
 {icon:"scoreboard",name:"績效計分卡"},
 {icon:"military_tech",name:"分級管理"}
];
var chartStore=[];
function disposeCharts(){for(var i=0;i<chartStore.length;i++){try{chartStore[i].dispose();}catch(e){}}chartStore=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);chartStore.push(c);}

var PK="#db2777",PK2="#f472b6";

function kpi(ic,val,unit,sub,dir,note){
 var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:15px">arrow_upward</span>':dir==="dn"?'<span class="material-symbols-outlined" style="font-size:15px">arrow_downward</span>':"";
 var dl=note?'<div class="dl '+(dir==="up"?"up":dir==="dn"?"dn":"")+'">'+arrow+note+'</div>':"";
 return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
  '<div class="val">'+val+'<span style="font-size:14px;font-weight:600;color:var(--mut)"> '+unit+'</span></div>'+
  '<div class="lab">'+sub+'</div>'+dl+'</div>';
}

/* ---------- SCREEN 0 : 供應商建檔與分級 ---------- */
function s0(){
 var sup=[
  {c:"SP-1042",n:"精O金屬工業",cat:"CNC 加工件",g:"A",pct:96,parts:18,onb:"2019/03",st:"合格"},
  {c:"SP-2087",n:"O昌電子零件",cat:"PCBA 電子",g:"A",pct:93,parts:24,onb:"2018/07",st:"合格"},
  {c:"SP-3311",n:"O新塑膠射出",cat:"塑膠件",g:"B",pct:84,parts:12,onb:"2020/11",st:"合格"},
  {c:"SP-4520",n:"永O橡膠密封",cat:"橡膠 O-Ring",g:"B",pct:81,parts:9,onb:"2021/02",st:"觀察"},
  {c:"SP-5673",n:"O源表面處理",cat:"電鍍塗裝",g:"C",pct:68,parts:6,onb:"2022/05",st:"觀察"},
  {c:"SP-6790",n:"O達包裝材料",cat:"包材",g:"C",pct:62,parts:4,onb:"2023/01",st:"改善中"},
  {c:"SP-7788",n:"新緯線材科技",cat:"線束",g:"D",pct:48,parts:3,onb:"2024/06",st:"限用"}
 ];
 var rows=sup.map(function(s){
  var st=s.st==="合格"?"p-ok":s.st==="觀察"?"p-warn":s.st==="限用"?"p-bad":"p-info";
  return '<tr><td class="mono">'+s.c+'</td><td><b>'+s.n+'</b></td><td class="sub">'+s.cat+'</td>'+
   '<td><span class="grade g'+s.g+'">'+s.g+'</span></td>'+
   '<td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+s.pct+'%"></i></div><b class="mono">'+s.pct+'</b></div></td>'+
   '<td class="mono">'+s.parts+'</td><td class="sub">'+s.onb+'</td>'+
   '<td><span class="pill '+st+'">'+s.st+'</span></td></tr>';
 }).join("");
 return '<div class="scr-head"><div><h2><span class="material-symbols-outlined">badge</span>供應商建檔與分級</h2>'+
  '<p>AVL 合格供應商名冊 · 資格審核狀態與 A/B/C/D 分級總覽</p></div><div class="tag">v0 · 採購部</div></div>'+
 '<div class="grid g4 min0" style="margin-bottom:14px">'+
  kpi("groups","合格供應商","128","家","up","+6 本季")+
  kpi("verified","A 級占比","34%","","up","+3.2%")+
  kpi("pending_actions","待資格審核","5","件","dn","3 逾期")+
  kpi("block","限用/停用","2","家","dn","本月 -1")+
 '</div>'+
 '<div class="grid g23 min0">'+
  '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>合格供應商名冊 (AVL)</h3>'+
   '<div style="overflow-x:auto"><table><thead><tr><th>代碼</th><th>名稱</th><th>供料類別</th><th>等級</th><th>綜合評分</th><th>料號數</th><th>建檔</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>分級分佈</h3><div id="c0a" class="chart sm"></div>'+
   '<div class="legend"><span><i class="dot" style="background:#059669"></i>A 級</span><span><i class="dot" style="background:#0891b2"></i>B 級</span><span><i class="dot" style="background:#d97706"></i>C 級</span><span><i class="dot" style="background:#dc2626"></i>D 級</span></div></div>'+
 '</div>';
}
function s0charts(){
 mkChart("c0a",{tooltip:{trigger:"item"},series:[{type:"pie",radius:["48%","74%"],avoidLabelOverlap:true,
  itemStyle:{borderColor:"#fff",borderWidth:3},label:{formatter:"{b}\n{c}家"},
  data:[{value:44,name:"A 級",itemStyle:{color:"#059669"}},{value:52,name:"B 級",itemStyle:{color:"#0891b2"}},
   {value:26,name:"C 級",itemStyle:{color:"#d97706"}},{value:6,name:"D 級",itemStyle:{color:"#dc2626"}}]}]});
}

/* ---------- SCREEN 1 : 稽核排程與執行 ---------- */
function s1(){
 var ev={3:{t:"精O金屬",c:PK},9:{t:"O昌電子",c:"#0891b2"},12:{t:"O新塑膠",c:"#d97706"},
  17:{t:"O源表面",c:PK},18:{t:"永O橡膠",c:"#0891b2"},24:{t:"O達包裝",c:"#d97706"},27:{t:"O緯線材",c:"#dc2626"}};
 var cal=[];
 for(var d=1;d<=28;d++){var e=ev[d];
  cal.push('<div class="d'+(e?" ev":"")+'"><span class="n">'+d+'</span>'+(e?'<div style="margin-top:4px"><i class="dot" style="background:'+e.c+'"></i> <span style="font-size:9px">'+e.t+'</span></div>':'')+'</div>');}
 var wk=["一","二","三","四","五","六","日"].map(function(w){return '<div class="h">'+w+'</div>';}).join("");
 var todo=[
  {d:"17",m:"8月",n:"O源表面處理",tp:"現場品質系統稽核",r:"王品維 工程師",st:"進行中",c:"p-warn"},
  {d:"18",m:"8月",n:"永O橡膠密封",tp:"製程稽核 (VDA6.3)",r:"陳冠廷 工程師",st:"已排定",c:"p-info"},
  {d:"24",m:"8月",n:"O達包裝材料",tp:"矯正措施複稽",r:"林思妤 工程師",st:"已排定",c:"p-info"},
  {d:"27",m:"8月",n:"新緯線材科技",tp:"新供應商認證稽核",r:"王品維 工程師",st:"待確認",c:"p-pk"}
 ].map(function(a){return '<div class="audit-row"><div class="dt"><b>'+a.d+'</b><span>'+a.m+'</span></div>'+
  '<div style="flex:1;min-width:0"><div style="font-weight:700">'+a.n+'</div><div class="sub">'+a.tp+' · '+a.r+'</div></div>'+
  '<span class="pill '+a.c+'">'+a.st+'</span></div>';}).join("");
 return '<div class="scr-head"><div><h2><span class="material-symbols-outlined">fact_check</span>稽核排程與執行</h2>'+
  '<p>年度稽核行事曆 · 現場稽核任務分派與檢查表得分</p></div><div class="tag">v1 · 供應商品質工程部</div></div>'+
 '<div class="grid g4 min0" style="margin-bottom:14px">'+
  kpi("event_available","本月排定","7","場","","2 待確認")+
  kpi("task_alt","稽核完成率","88%","","up","目標 90%")+
  kpi("checklist","平均檢查表得分","82.4","分","up","+1.6")+
  kpi("gpp_bad","重大缺失","4","項","dn","需開 SCAR")+
 '</div>'+
 '<div class="grid g32 min0">'+
  '<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>8 月稽核行事曆</h3>'+
   '<div style="overflow-x:auto"><div class="cal">'+wk+cal.join("")+'</div></div></div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">assignment</span>近期稽核任務</h3><div class="grid" style="gap:9px">'+todo+'</div></div>'+
 '</div>'+
 '<div class="grid g2 min0" style="margin-top:14px">'+
  '<div class="card"><h3><span class="material-symbols-outlined">radar</span>檢查表構面得分 (O源表面處理)</h3><div id="c1a" class="chart"></div></div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各類別稽核缺失統計</h3><div id="c1b" class="chart"></div></div>'+
 '</div>';
}
function s1charts(){
 mkChart("c1a",{tooltip:{},radar:{indicator:[{name:"品質系統",max:100},{name:"製程控制",max:100},{name:"文件管理",max:100},
  {name:"設備校驗",max:100},{name:"人員訓練",max:100},{name:"矯正措施",max:100}],
  splitArea:{areaStyle:{color:["#fdf2f8","#fff"]}},axisName:{color:"#8a6b7e"}},
  series:[{type:"radar",areaStyle:{color:"rgba(219,39,119,.2)"},lineStyle:{color:PK},itemStyle:{color:PK},
   data:[{value:[72,65,80,58,74,60],name:"本次得分"}]}]});
 mkChart("c1b",{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{data:["輕微","主要","重大"],bottom:0,textStyle:{color:"#8a6b7e"}},
  grid:{left:40,right:14,top:20,bottom:44},
  xAxis:{type:"category",data:["電子","加工","塑膠","橡膠","表面處理","包材"],axisLabel:{color:"#8a6b7e"}},
  yAxis:{type:"value",axisLabel:{color:"#8a6b7e"},splitLine:{lineStyle:{color:"#f2dde9"}}},
  series:[
   {name:"輕微",type:"bar",stack:"x",data:[3,2,5,4,7,6],itemStyle:{color:"#fbcfe8"}},
   {name:"主要",type:"bar",stack:"x",data:[1,2,3,2,4,3],itemStyle:{color:PK2}},
   {name:"重大",type:"bar",stack:"x",data:[0,1,1,0,2,0],itemStyle:{color:PK}}]});
}

/* ---------- SCREEN 2 : 進料品質 IQC + SPC ---------- */
function s2(){
 var lots=[
  {lot:"L240814-01",sup:"精O金屬",part:"軸承座 CNC",qty:"1,200",smp:80,def:1,res:"允收",c:"p-ok"},
  {lot:"L240814-02",sup:"O昌電子",part:"控制板 PCBA",qty:"600",smp:50,def:0,res:"允收",c:"p-ok"},
  {lot:"L240813-07",sup:"O新塑膠",part:"外殼上蓋",qty:"3,000",smp:125,def:4,res:"特採",c:"p-warn"},
  {lot:"L240813-04",sup:"O源表面",part:"鍍鋅支架",qty:"2,400",smp:125,def:9,res:"退貨",c:"p-bad"},
  {lot:"L240812-11",sup:"永O橡膠",part:"密封圈 O-Ring",qty:"5,000",smp:200,def:3,res:"允收",c:"p-ok"},
  {lot:"L240812-02",sup:"O達包裝",part:"防震內襯",qty:"4,000",smp:200,def:12,res:"退貨",c:"p-bad"}
 ].map(function(l){return '<tr><td class="mono">'+l.lot+'</td><td>'+l.sup+'</td><td class="sub">'+l.part+'</td>'+
  '<td class="mono">'+l.qty+'</td><td class="mono">'+l.smp+'</td><td class="mono">'+l.def+'</td>'+
  '<td><span class="pill '+l.c+'">'+l.res+'</span></td></tr>';}).join("");
 return '<div class="scr-head"><div><h2><span class="material-symbols-outlined">biotech</span>進料品質 IQC 與 SPC 管制</h2>'+
  '<p>來料批次抽驗結果 · 關鍵尺寸管制圖與允收率趨勢</p></div><div class="tag">v2 · 品保部</div></div>'+
 '<div class="grid g4 min0" style="margin-bottom:14px">'+
