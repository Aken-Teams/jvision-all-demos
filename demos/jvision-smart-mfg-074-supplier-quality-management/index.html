<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SQM 供應商品質管理</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#2563EB;
 --color-on-primary:#FFFFFF;
 --color-secondary:#3B82F6;
 --color-on-secondary:#000000;
 --color-accent:#EA580C;
 --color-on-accent:#000000;
 --color-background:#F8FAFC;
 --color-foreground:#1E293B;
 --color-card:#FFFFFF;
 --color-card-foreground:#1E293B;
 --color-muted:#E9EFF8;
 --color-muted-foreground:#475569;
 --color-border:#CBD5E1;
 --color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;
 --color-ring:#2563EB;
 --blue:#2563EB;
 --ink:#1E293B;
 --muted:#475569;
 --mut:#475569;
 --line:#CBD5E1;
 --pk:#2563EB;
 --pk2:#3B82F6;
 --bg:#F8FAFC;
 --card:#FFFFFF;
 --ok:#047857;
 --warn:#B45309;
 --bad:#DC2626;
 --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:auto;}
body{
 min-width:320px;
 font-family:"Fira Sans","Noto Sans TC",sans-serif;
 background-color:var(--color-background);
 background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
 background-size:32px 32px;
 color:var(--color-foreground);
 line-height:1.5;
 -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid var(--color-ring);
 outline-offset:3px;
}
.material-symbols-outlined{
 font-family:"Material Symbols Outlined";
 font-weight:normal;
 font-style:normal;
 line-height:1;
 vertical-align:middle;
}
header.top{
 position:sticky;
 top:0;
 z-index:50;
 display:grid;
 grid-template-columns:minmax(300px,420px) 1fr;
 align-items:stretch;
 background:var(--color-card);
 color:var(--color-foreground);
 border-bottom:3px solid var(--ink);
 box-shadow:0 5px 0 rgba(37,99,235,.22);
}
.brand{
 display:flex;
 align-items:center;
 gap:14px;
 min-width:0;
 padding:13px 20px;
 background:var(--color-primary);
 color:var(--color-on-primary);
 border-right:3px solid var(--ink);
}
.brand .logo{
 width:44px;
 height:44px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
 background:var(--color-accent);
 color:var(--color-on-accent);
 border:2px solid var(--ink);
 border-radius:0;
 box-shadow:4px 4px 0 var(--ink);
}
.brand .logo .material-symbols-outlined{font-size:25px;color:var(--color-on-accent);}
.brand h1{
 font-size:18px;
 font-weight:700;
 letter-spacing:.02em;
 line-height:1.2;
}
.brand small{
 display:block;
 margin-top:3px;
 color:#DBEAFE;
 font-size:11px;
 font-weight:500;
 line-height:1.35;
}
nav{
 display:flex;
 align-items:stretch;
 gap:0;
 min-width:0;
 padding:0;
 overflow-x:auto;
 scrollbar-width:thin;
 background:var(--color-card);
}
nav button{
 position:relative;
 flex:1 0 112px;
 min-height:70px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 padding:10px 12px;
 border:0;
 border-right:1px solid var(--line);
 border-radius:0;
 background:var(--color-card);
 color:var(--muted);
 font:700 12px/1.25 "Fira Sans","Noto Sans TC",sans-serif;
 white-space:nowrap;
 transition:background-color 180ms ease,color 180ms ease,box-shadow 180ms ease;
}
nav button .material-symbols-outlined{font-size:20px;}
nav button:hover{background:var(--color-muted);color:var(--ink);}
nav button.on{
 background:var(--color-accent);
 color:var(--color-on-accent);
 box-shadow:inset 0 -6px 0 var(--ink);
}
nav button.on::before{
 content:"ACTIVE";
 position:absolute;
 top:4px;
 right:5px;
 font:700 8px/1 "Fira Code",monospace;
 letter-spacing:.08em;
}
main{
 width:min(100%,1440px);
 margin:0 auto;
 padding:28px 24px 64px;
}
#view{animation:view-in 380ms cubic-bezier(.34,1.56,.64,1) both;}
.scr-head{
 position:relative;
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 gap:20px;
 flex-wrap:wrap;
 margin:0 0 20px;
 padding:24px 26px 22px;
 background:var(--color-card);
 border:3px solid var(--ink);
 box-shadow:var(--shadow);
 overflow:hidden;
}
.scr-head::after{
 content:"SQM / CONTROL DESK";
 position:absolute;
 top:0;
 right:0;
 padding:5px 9px;
 background:var(--ink);
 color:#fff;
 font:600 9px/1 "Fira Code",monospace;
 letter-spacing:.1em;
}
.scr-head h2{
 max-width:850px;
 display:flex;
 align-items:center;
 gap:12px;
 font-size:clamp(23px,3vw,35px);
 font-weight:700;
 line-height:1.12;
 letter-spacing:-.025em;
}
.scr-head h2 .material-symbols-outlined{
 display:grid;
 place-items:center;
 width:45px;
 height:45px;
 flex:none;
 background:var(--color-primary);
 color:var(--color-on-primary);
 border:2px solid var(--ink);
 font-size:27px;
}
.scr-head p{margin-top:9px;color:var(--muted);font-size:13px;font-weight:500;}
.tag{
 flex:none;
 padding:8px 11px;
 border:2px solid var(--ink);
 border-radius:0;
 background:var(--color-accent);
 color:var(--color-on-accent);
 font:700 11px/1.2 "Fira Code",monospace;
 white-space:nowrap;
 box-shadow:3px 3px 0 var(--ink);
}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);}
.min0>*{min-width:0;}
.card,.kpi,.scard,.audit-row,.rank{
 min-width:0;
 background:var(--color-card);
 border:2px solid var(--ink);
 border-radius:0;
}
.card{
 position:relative;
 padding:19px;
 box-shadow:4px 4px 0 rgba(30,41,59,.18);
}
.card::before{
 content:"";
 position:absolute;
 top:-2px;
 left:-2px;
 width:48px;
 height:6px;
 background:var(--color-primary);
 border-right:2px solid var(--ink);
}
.card h3{
 display:flex;
 align-items:center;
 gap:9px;
 margin-bottom:15px;
 padding-bottom:11px;
 border-bottom:2px solid var(--ink);
 color:var(--ink);
 font-size:14px;
 font-weight:700;
 letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary);}
.kpi{
 position:relative;
 min-height:156px;
 padding:15px 16px 16px;
 overflow:hidden;
 box-shadow:4px 4px 0 var(--ink);
}
.kpi::after{
 content:"";
 position:absolute;
 top:0;
 right:0;
 width:38%;
 height:7px;
 background:var(--color-primary);
 border-left:2px solid var(--ink);
}
.kpi:nth-child(2n)::after{background:var(--color-accent);}
.kpi .ic{
 width:38px;
 height:38px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-bottom:13px;
 border:2px solid var(--ink);
 border-radius:0;
 background:var(--color-muted);
 color:var(--color-primary);
}
.kpi .ic .material-symbols-outlined{font-size:21px;}
.kpi .val{
 color:var(--ink);
 font:700 27px/1.05 "Fira Code","Noto Sans TC",monospace;
 letter-spacing:-.04em;
 font-variant-numeric:tabular-nums;
}
.kpi .lab{margin-top:7px;color:var(--muted);font-size:12px;font-weight:500;}
.kpi .dl{
 display:inline-flex;
 align-items:center;
 gap:3px;
 margin-top:8px;
 padding:3px 6px;
 border:1px solid currentColor;
 font:700 10px/1.3 "Fira Code",monospace;
}
.up{color:var(--ok);}
.dn{color:var(--bad);}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
th{
 padding:10px;
 border-right:1px solid #94A3B8;
 border-bottom:2px solid var(--ink);
 background:var(--color-muted);
 color:var(--ink);
 text-align:left;
 font:700 10px/1.25 "Fira Code","Noto Sans TC",monospace;
 letter-spacing:.04em;
 text-transform:uppercase;
 white-space:nowrap;
}
th:last-child{border-right:0;}
td{
 padding:11px 10px;
 border-right:1px solid var(--line);
 border-bottom:1px solid var(--line);
 color:var(--ink);
 white-space:nowrap;
}
td:last-child{border-right:0;}
tbody tr:nth-child(even){background:#F8FAFC;}
tbody tr:hover{background:#EFF6FF;}
tr:last-child td{border-bottom:0;}
th:nth-child(4),td:nth-child(4){text-align:center;}
th:nth-child(5),th:nth-child(6),td:nth-child(5),td:nth-child(6){text-align:right;}
.pill{
 display:inline-flex;
 align-items:center;
 gap:4px;
 padding:4px 8px;
 border:1px solid currentColor;
 border-radius:0;
 font-size:10px;
 font-weight:700;
 line-height:1.2;
 white-space:nowrap;
}
.pill::before{content:"■";font-size:7px;line-height:1;}
.p-ok{background:#D1FAE5;color:#065F46;}
.p-warn{background:#FEF3C7;color:#78350F;}
.p-bad{background:#FEE2E2;color:#991B1B;}
.p-info{background:#DBEAFE;color:#1E3A8A;}
.p-pk{background:#FFEDD5;color:#9A3412;}
.grade{
 width:28px;
 height:28px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 border:2px solid var(--ink);
 border-radius:0;
 color:#fff;
 font:700 13px/1 "Fira Code",monospace;
 box-shadow:2px 2px 0 var(--ink);
}
.gA{background:#047857;}.gB{background:#0369A1;}.gC{background:#B45309;}.gD{background:#B91C1C;}
.bar{height:10px;border:1px solid #94A3B8;border-radius:0;background:var(--color-muted);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:0;background:repeating-linear-gradient(135deg,var(--color-primary) 0 7px,var(--color-secondary) 7px 14px);}
.chart{width:100%;height:280px;min-width:0;}
.chart.sm{height:230px;}
.chart.lg{height:320px;}
.mono{
 font-family:"Fira Code","Noto Sans TC",monospace;
 font-variant-numeric:tabular-nums;
 font-weight:600;
}
.sub{color:var(--muted);font-size:12px;}
.audit-row{
 display:flex;
 align-items:center;
 gap:12px;
 padding:11px;
 box-shadow:3px 3px 0 rgba(30,41,59,.16);
}
.audit-row .dt{
 width:58px;
 flex:none;
 padding:8px 0;
 border:2px solid var(--ink);
 border-radius:0;
 background:var(--color-primary);
 color:var(--color-on-primary);
 text-align:center;
}
.audit-row .dt b{display:block;font:700 19px/1 "Fira Code",monospace;}
.audit-row .dt span{font-size:10px;font-weight:700;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(56px,1fr));gap:0;border-top:2px solid var(--ink);border-left:2px solid var(--ink);}
.cal .h{
 padding:6px 2px;
 border-right:2px solid var(--ink);
 border-bottom:2px solid var(--ink);
 background:var(--ink);
 color:#fff;
 font:700 10px/1.2 "Fira Code",monospace;
 text-align:center;
}
.cal .d{
 position:relative;
 min-width:0;
 min-height:58px;
 padding:6px;
 border:0;
 border-right:2px solid var(--ink);
 border-bottom:2px solid var(--ink);
 border-radius:0;
 background:#fff;
 font-size:11px;
}
.cal .d .n{color:var(--muted);font:700 11px/1 "Fira Code",monospace;}
.cal .d.ev{background:#DBEAFE;box-shadow:inset 6px 0 0 var(--color-primary);}
.dot{display:inline-block;width:8px;height:8px;border:1px solid var(--ink);border-radius:0;}
.timeline{position:relative;padding-left:27px;}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink);}
.tl-item{position:relative;padding:0 0 18px;}
.tl-item::before{
 content:"!";
 position:absolute;
 left:-27px;
 top:1px;
 width:17px;
 height:17px;
 display:grid;
 place-items:center;
 border:2px solid var(--ink);
 border-radius:0;
 background:var(--color-accent);
 color:var(--color-on-accent);
 font:700 10px/1 "Fira Code",monospace;
}
.tl-item.done::before{content:"✓";background:var(--ok);color:#fff;}
.tl-item .tt{font-size:13px;font-weight:700;}
.tl-item .td{margin-top:3px;color:var(--muted);font-size:12px;}
.tl-item .tm{margin-top:2px;color:#1D4ED8;font:600 10px/1.4 "Fira Code",monospace;}
.scard{padding:14px;box-shadow:3px 3px 0 rgba(30,41,59,.2);}
.scard .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--ink);}
.scard .nm{font-size:15px;font-weight:700;}
.big-score{color:var(--color-primary);font:700 35px/1 "Fira Code",monospace;letter-spacing:-.05em;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:12px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.rank{display:flex;align-items:center;gap:12px;padding:10px;box-shadow:3px 3px 0 rgba(30,41,59,.16);}
.rank .no{
 width:30px;
 height:30px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
 border:2px solid var(--ink);
 border-radius:0;
 background:var(--color-muted);
 color:var(--ink);
 font:700 12px/1 "Fira Code",monospace;
}
.rank.top1{background:#FFF7ED;box-shadow:4px 4px 0 var(--color-accent);}
.rank.top1 .no{background:var(--color-accent);color:var(--color-on-accent);}
.stat-strip{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
 padding:5px 8px;
 border:1px solid var(--color-primary);
 border-radius:0;
 background:#EFF6FF;
 color:#1E3A8A;
 font-size:10px;
 font-weight:700;
}
@keyframes view-in{
 from{opacity:0;transform:translateY(14px) scale(.985);}
 to{opacity:1;transform:none;}
}
@media(max-width:1100px){
 header.top{grid-template-columns:340px 1fr;}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
 .g23,.g32{grid-template-columns:minmax(0,1fr);}
 nav button{flex-basis:88px;padding-inline:8px;}
}
@media(max-width:820px){
 header.top{position:static;display:block;}
 .brand{border-right:0;border-bottom:3px solid var(--ink);}
 nav{position:sticky;top:0;z-index:40;border-bottom:2px solid var(--ink);}
 nav button{min-height:58px;flex:1 0 100px;}
 main{padding:20px 16px 52px;}
 .g2,.g3,.g23,.g32{grid-template-columns:1fr;}
 .chart{height:250px;}
 .scr-head{padding:22px 18px 18px;}
}
@media(max-width:560px){
 .brand{padding:11px 14px;}
 .brand h1{font-size:16px;}
 .brand small{max-width:270px;}
 nav button{flex-basis:58px;min-height:54px;padding:8px 10px;}
 nav button span.txt{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
 nav button .material-symbols-outlined{font-size:22px;}
 nav button.on::before{content:"";top:auto;right:auto;bottom:3px;width:18px;height:3px;background:var(--ink);}
 main{padding:16px 12px 44px;}
 .scr-head{display:block;margin-bottom:18px;padding:20px 15px 16px;box-shadow:4px 4px 0 var(--ink);}
 .scr-head::after{font-size:7px;}
 .scr-head h2{align-items:flex-start;padding-top:10px;font-size:22px;}
 .scr-head h2 .material-symbols-outlined{width:38px;height:38px;font-size:22px;}
 .scr-head p{font-size:12px;}
 .tag{display:inline-block;margin-top:15px;}
 .g4{grid-template-columns:1fr;}
 .card{padding:15px;}
 .kpi{min-height:142px;}
 .chart,.chart.lg{height:240px;}
 .chart.sm{height:220px;}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  scroll-behavior:auto!important;
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  transition-duration:.01ms!important;
 }
 #view{opacity:1;transform:none;animation:none;}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">verified</span></div>
    <div>
      <h1>SQM 供應商品質管理</h1>
      <small>Supplier Quality Management · 建檔 · 稽核 · IQC · SCAR · 計分卡</small>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main><div id="view"></div></main>

<script>
"use strict";
var MODS=[
 {icon:"badge",name:"供應商建檔"},
 {icon:"fact_check",name:"稽核排程"},
 {icon:"biotech",name:"進料 IQC"},
 {icon:"build_circle",name:"SCAR 改善"},
 {icon:"scoreboard",name:"績效計分卡"},
 {icon:"military_tech",name:"分級管理"}
];
var chartStore=[];
function disposeCharts(){for(var i=0;i<chartStore.length;i++){try{chartStore[i].dispose();}catch(e){}}chartStore=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);chartStore.push(c);}

var PK="#db2777",PK2="#f472b6";

function kpi(ic,val,unit,sub,dir,note){
 var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:15px">arrow_upward</span>':dir==="dn"?'<span class="material-symbols-outlined" style="font-size:15px">arrow_downward</span>':"";
 var dl=note?'<div class="dl '+(dir==="up"?"up":dir==="dn"?"dn":"")+'">'+arrow+note+'</div>':"";
 return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
  '<div class="val">'+val+'<span style="font-size:14px;font-weight:600;color:var(--mut)"> '+unit+'</span></div>'+
  '<div class="lab">'+sub+'</div>'+dl+'</div>';
}

/* ---------- SCREEN 0 : 供應商建檔與分級 ---------- */
function s0(){
 var sup=[
  {c:"SP-1042",n:"精O金屬工業",cat:"CNC 加工件",g:"A",pct:96,parts:18,onb:"2019/03",st:"合格"},
  {c:"SP-2087",n:"O昌電子零件",cat:"PCBA 電子",g:"A",pct:93,parts:24,onb:"2018/07",st:"合格"},
  {c:"SP-3311",n:"O新塑膠射出",cat:"塑膠件",g:"B",pct:84,parts:12,onb:"2020/11",st:"合格"},
  {c:"SP-4520",n:"永O橡膠密封",cat:"橡膠 O-Ring",g:"B",pct:81,parts:9,onb:"2021/02",st:"觀察"},
  {c:"SP-5673",n:"O源表面處理",cat:"電鍍塗裝",g:"C",pct:68,parts:6,onb:"2022/05",st:"觀察"},
  {c:"SP-6790",n:"O達包裝材料",cat:"包材",g:"C",pct:62,parts:4,onb:"2023/01",st:"改善中"},
  {c:"SP-7788",n:"新緯線材科技",cat:"線束",g:"D",pct:48,parts:3,onb:"2024/06",st:"限用"}
 ];
 var rows=sup.map(function(s){
  var st=s.st==="合格"?"p-ok":s.st==="觀察"?"p-warn":s.st==="限用"?"p-bad":"p-info";
  return '<tr><td class="mono">'+s.c+'</td><td><b>'+s.n+'</b></td><td class="sub">'+s.cat+'</td>'+
   '<td><span class="grade g'+s.g+'">'+s.g+'</span></td>'+
   '<td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+s.pct+'%"></i></div><b class="mono">'+s.pct+'</b></div></td>'+
   '<td class="mono">'+s.parts+'</td><td class="sub">'+s.onb+'</td>'+
   '<td><span class="pill '+st+'">'+s.st+'</span></td></tr>';
 }).join("");
 return '<div class="scr-head"><div><h2><span class="material-symbols-outlined">badge</span>供應商建檔與分級</h2>'+
  '<p>AVL 合格供應商名冊 · 資格審核狀態與 A/B/C/D 分級總覽</p></div><div class="tag">v0 · 採購部</div></div>'+

 ].map(function(m){var cls=m.dir==="up"?"tl-item done":"tl-item";

  return '<div class="'+cls+'"><div class="tt">'+m.n+' '+ic+'</div><div class="td">'+m.rs+'</div><div class="tm">'+m.dt+'</div></div>';}).join("");
 return '<div class="scr-head"><div><h2><span class="material-symbols-outlined">military_tech</span>合格率與分級管理</h2>'+

   {value:26,name:"70-84%",itemStyle:{color:"#d97706"}},{value:6,name:"<70%",itemStyle:{color:"#dc2626"}}]}]});

   {name:"稽核完成率",type:"line",smooth:true,data:[78,80,83,85,86,88],lineStyle:{color:PK2,width:2},itemStyle:{color:PK2}}]});

var SCREENS=[
 {r:s0,c:s0charts},{r:s1,c:s1charts},{r:s2,c:s2charts},
 {r:s3,c:s3charts},{r:s4,c:s4charts},{r:s5,c:s5charts}
];

function buildNav(){
 var nav=document.getElementById("nav");
 nav.innerHTML=MODS.map(function(m,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="txt">'+m.name+'</span></button>';
 }).join("");
 var btns=nav.querySelectorAll("[data-i]");
 for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){show(+this.getAttribute("data-i"));});}
}

function show(i){
 var container=document.getElementById("view");
 disposeCharts();
 container.innerHTML=SCREENS[i].r();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
 void container.offsetHeight;
 SCREENS[i].c();
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
